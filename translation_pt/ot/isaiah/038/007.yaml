  text: וְ/זֶה לְּ/ךָ֥ הָ/א֖וֹת מֵ/אֵ֣ת יְהוָ֑ה אֲשֶׁר֙ יַעֲשֶׂ֣ה יְהוָ֔ה אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה אֲשֶׁ֥ר דִּבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/007.yaml
  text: 'And this will be the sign to you from Yahweh[a], that Yahweh will do this thing that he has spoken:'
translation:
  language: pt
  text: 'E este será para você o sinal da parte de Yahweh de que Yahweh fará esta coisa[a] que disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este assunto” ou “esta palavra”. O hebraico davar pode referir-se a uma coisa, um assunto ou uma palavra dita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: E este será
  rationale: A conjunção mantém a ligação com o discurso anterior, e o futuro de ligação, implícito na oração nominal hebraica, produz uma formulação natural em português.
- source_word: לְּךָ הָאוֹת
  choice: o sinal que ... lhe dará
  rationale: A construção portuguesa explicita de modo idiomático o destinatário do sinal sem mudar seu sentido; o artigo hebraico aponta para um sinal específico.
- source_word: מֵאֵת יְהוָה
  choice: Yahweh ... dará
  rationale: מֵאֵת marca a origem do sinal. A formulação verbal é natural em português e conserva Yahweh como sua fonte.
- source_word: אֲשֶׁר יַעֲשֶׂה יְהוָה
  choice: Yahweh fará
  rationale: A oração relativa apresenta aquilo que o sinal confirma; 'fará' traduz diretamente o sentido amplo de עשה.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: o que
  rationale: Neste contexto, דָּבָר designa aquilo que foi declarado e será realizado. 'O que' evita o pouco natural 'esta coisa' e preserva a referência abrangente ao conteúdo da declaração.
- source_word: אֲשֶׁר דִּבֵּר
  choice: que disse
  rationale: Traduz a declaração já feita por Yahweh sem acrescentar a noção interpretativa de promessa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o nome divino em vez de substituí-lo por um título.
- issue: Relação entre o sinal e a declaração divina
  choice: O sinal confirma que Yahweh realizará aquilo que disse
  alternative: O sinal é identificado com o próprio acontecimento anunciado
  rationale: A sintaxe permite certa compressão entre o sinal e seu conteúdo confirmatório. A redação portuguesa conserva a função de confirmação sem desenvolver uma explicação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de 'Yahweh' foi mantida por corresponder à repetição enfática do nome no hebraico. Os dois-pontos preservam a função introdutória do versículo em relação ao sinal descrito a seguir.
