revisions:
- from: Como o andorinhão ou a garça[a], assim eu chilreio; gemo como a pomba. Meus olhos enfraquecem de tanto olhar para o alto. Senhor, estou oprimido; sê minha garantia.
  to: Como o andorinhão ou o grou[a], assim eu chilreio; gemo como a pomba. Meus olhos enfraquecem de tanto olhar para o alto. Senhor, estou oprimido; sê meu fiador.
  rationale: A revisão corrige “garça” para “grou”, preservando a distinção zoológica exigida pelo hebraico e pelo audit trail inglês. Também substitui “minha garantia” por “meu fiador”, formulação portuguesa mais natural e semanticamente mais próxima do apelo para que Deus assuma a garantia do suplicante. Não se altera a ambiguidade quanto à primeira ave, que permanece indicada no texto e na nota.
