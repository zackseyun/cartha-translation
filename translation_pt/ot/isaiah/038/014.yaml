  text: כְּ/ס֤וּס עָגוּר֙ כֵּ֣ן אֲצַפְצֵ֔ף אֶהְגֶּ֖ה כַּ/יּוֹנָ֑ה דַּלּ֤וּ עֵינַ/י֙ לַ/מָּר֔וֹם אֲדֹנָ֖/י עָֽשְׁקָה לִּ֥/י עָרְבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/014.yaml
  text: Like a swift or a crane[a], so I chirp; I moan like a dove. My eyes grow weak looking upward. Lord, I am oppressed; be my pledge.
translation:
  language: pt
  text: Como o andorinhão ou o grou[a], assim eu chilreio; gemo como a pomba. Meus olhos enfraquecem de tanto olhar para o alto. Senhor, estou oprimido; sê meu fiador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo uma identificação tradicional: “Como a andorinha ou o grou”. O primeiro nome de ave é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּסוּס עָגוּר
  choice: Como o andorinhão ou a garça
  rationale: Os nomes das aves, sobretudo סוּס, são incertos. “Andorinhão” representa uma identificação moderna possível, enquanto “garça” traduz עָגוּר; a nota preserva a identificação tradicional “andorinha”.
- source_word: אֲצַפְצֵף
  choice: eu chilreio
  rationale: O verbo descreve um som agudo de ave. “Chilreio” mantém a imagem sonora e tem registro digno e compreensível.
- source_word: אֶהְגֶּה
  choice: gemo
  rationale: Neste lamento, o verbo indica uma emissão baixa e dolorida; “gemo” comunica a aflição e contrasta com o som agudo anterior.
- source_word: כַּיּוֹנָה
  choice: como a pomba
  rationale: Tradução direta da comparação com o arrulho lamentoso da pomba.
- source_word: דַּלּוּ עֵינַי
  choice: Meus olhos enfraquecem
  rationale: A expressão retrata os olhos perdendo as forças devido ao olhar prolongado; a formulação preserva a metáfora sem soar obscura.
- source_word: לַמָּרוֹם
  choice: de tanto olhar para o alto
  rationale: O hebraico diz literalmente “para o alto”. A formulação explicita a direção do olhar sem substituir o termo por “céu”.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É um título divino em vocativo, não o Tetragrama; “Senhor” traduz o título de forma natural.
- source_word: עָשְׁקָה לִּי
  choice: estou oprimido
  rationale: A construção concisa deriva da raiz “oprimir, defraudar, tratar injustamente”; a tradução expressa naturalmente a queixa presente.
- source_word: עָרְבֵנִי
  choice: sê minha garantia
  rationale: O verbo emprega linguagem jurídica e relacional de assumir garantia por alguém. A escolha conserva essa imagem, em vez de reduzi-la ao sentido genérico de “ajuda-me”.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor
  rationale: O termo funciona aqui como título divino em apelo direto. “Senhor” evita confundi-lo com a forma usada para representar o nome da aliança.
- issue: Identificação incerta das aves em כְּסוּס עָגוּר
  choice: Como o andorinhão ou a garça
  alternative: Como a andorinha ou a garça
  rationale: A identificação zoológica do primeiro nome é incerta. O texto principal adota uma possibilidade lexical plausível, e a nota registra a identificação tradicional sem apresentar nenhuma delas como indiscutível.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A linguagem poética e as imagens sonora, corporal e jurídica do hebraico foram preservadas sem eliminar a incerteza zoológica.
