  yaml_path: translation/ot/isaiah/038/009.yaml
  text: 'A writing of Hezekiah king of Judah[b][a], when he had been sick and had recovered from his sickness:'
translation:
  language: pt
  text: 'Escrito de Ezequias, rei de Judá,[a] quando esteve doente e se recuperou de sua doença[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Composição de Ezequias” ou “Registro de Ezequias”. O termo hebraico indica uma composição escrita sem especificar exatamente o gênero.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e viveu de sua doença”. A expressão significa que ele se recuperou.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּב
  choice: Escrito
  rationale: O substantivo designa de modo amplo uma composição escrita ou documento, sem determinar o gênero; “Escrito” preserva essa abertura melhor que “poema” ou “salmo”.
- source_word: לְחִזְקִיָּהוּ
  choice: de Ezequias
  rationale: O לְ no cabeçalho indica atribuição ou associação; em português, “de Ezequias” expressa isso de modo natural sem decidir de forma excessiva entre autoria e posse.
- source_word: מֶלֶךְ יְהוּדָה
  choice: rei de Judá
  rationale: Tradução direta e natural da cadeia construta que identifica o cargo e o reino de Ezequias.
- source_word: בַּחֲלֹתוֹ
  choice: quando esteve doente
  rationale: O infinitivo construto com בְּ indica circunstância temporal. A formulação é natural e não acrescenta a ideia ingressiva de que ele adoeceu naquele momento.
- source_word: וַיְחִי
  choice: se recuperou
  rationale: Embora o verbo signifique literalmente “viveu”, junto de “de sua doença” comunica idiomaticamente recuperação, sem sugerir ressurreição.
- source_word: מֵחָלְיוֹ
  choice: de sua doença
  rationale: A preposição מִן marca afastamento ou saída da enfermidade; a expressão completa é vertida naturalmente como “se recuperou de sua doença”.
theological_decisions: []
