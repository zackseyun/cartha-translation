  text: אֲדֹנָ֖/י עֲלֵי/הֶ֣ם יִֽחְי֑וּ וּ/לְ/כָל בָּ/הֶן֙ חַיֵּ֣י רוּחִ֔/י וְ/תַחֲלִימֵ֖/נִי וְ/הַחֲיֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/016.yaml
  text: Lord[a], by these things men live, and in all these is the life of my spirit[c][b]; so restore me to health and let me live.
translation:
  language: pt
  text: Senhor, por essas coisas as pessoas vivem[a], e em todas elas está a vida do meu espírito. Restaura-me a saúde[b] e faze-me viver[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eles vivem” ou “vive-se”; o verbo hebraico não traz sujeito expresso.
    reason: lexical_alternative
  - marker: b
    text: Ou “cura-me”. O verbo pode indicar tornar alguém saudável ou restaurar-lhe a saúde.
    reason: lexical_alternative
  - marker: c
    text: Ou “reaviva-me” ou “conserva-me vivo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz o título divino de modo natural e reverente em português; embora a forma possa ser entendida literalmente como “meu Senhor”, o vocativo “Senhor” é idiomático na oração.
- source_word: עֲלֵיהֶם
  choice: por essas coisas
  rationale: A expressão retoma as realidades mencionadas anteriormente e admite sentido instrumental ou causal. “Por essas coisas” conserva essa abertura sem tornar a frase excessivamente técnica.
- source_word: יִחְיוּ
  choice: as pessoas vivem
  rationale: O verbo está na terceira pessoa do plural, mas não traz sujeito expresso. “As pessoas” comunica o sentido humano genérico em português corrente; a nota preserva as alternativas mais literais.
- source_word: וּלְכָל בָּהֶן
  choice: e em todas elas
  rationale: A expressão difícil é entendida de forma abrangente e locativa, referindo-se às mesmas “coisas” da oração anterior.
- source_word: חַיֵּי רוּחִי
  choice: a vida do meu espírito
  rationale: Mantém a construção nominal e traduz רוּחַ por “espírito”, adequado aqui à vitalidade interior do orante, sem excluir totalmente a associação com fôlego e vida.
- source_word: וְתַחֲלִימֵנִי
  choice: Restabelece-me a saúde
  rationale: No contexto de enfermidade e recuperação, expressa claramente o sentido causativo de tornar saudável ou restaurar à saúde.
- source_word: וְהַחֲיֵנִי
  choice: e faze-me viver
  rationale: Preserva o sentido causativo de חיה sem decidir de maneira indevida entre reanimar, conservar vivo ou prolongar a vida.
theological_decisions:
- issue: Sujeito humano genérico implícito em יִחְיוּ
  choice: as pessoas vivem
  alternative: eles vivem; vive-se
  rationale: O hebraico usa um verbo masculino plural sem sujeito expresso. A tradução comunica a referência humana genérica, enquanto a nota registra que a identidade gramatical do sujeito permanece aberta.
- issue: Alcance de וְהַחֲיֵנִי no pedido de Ezequias
  choice: faze-me viver
  alternative: reaviva-me; conserva-me vivo
  rationale: A formulação mantém a tensão entre restauração da vitalidade e preservação da vida, sem impor uma leitura mais específica do que o contexto e o verbo exigem.
translation_notes:
  register: Português moderno, claro e reverente, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A colocação pronominal e “faze-me viver” preservam dignidade poética sem recorrer a vocabulário arcaico excessivo.
