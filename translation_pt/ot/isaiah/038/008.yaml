  to: Eis que farei a sombra, que havia descido com o sol nos degraus de Acaz[b], recuar dez degraus[a]. E o sol recuou dez degraus nos degraus pelos quais havia descido.
  rationale: A revisão conserva a ambiguidade do hebraico e a linguagem fenomenológica do sinal. Ela substitui uma paráfrase temporal e causal por uma oração relativa mais próxima da sintaxe e do grau de explicitação do texto-fonte, sem alterar o sentido do acontecimento narrado.
