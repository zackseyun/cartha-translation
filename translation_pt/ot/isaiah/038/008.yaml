  text: הִנְ/נִ֣י מֵשִׁ֣יב אֶת צֵ֣ל הַֽ/מַּעֲל֡וֹת אֲשֶׁ֣ר יָרְדָה֩ בְ/מַעֲל֨וֹת אָחָ֥ז בַּ/שֶּׁ֛מֶשׁ אֲחֹרַנִּ֖ית עֶ֣שֶׂר מַעֲל֑וֹת וַ/תָּ֤שָׁב הַ/שֶּׁ֨מֶשׁ֙ עֶ֣שֶׂר מַעֲל֔וֹת בַּֽ/מַּעֲל֖וֹת אֲשֶׁ֥ר יָרָֽדָה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/008.yaml
  text: Behold[a], I will make the shadow go back ten steps, which had gone down on the steps of Ahaz by the sun[b]. And the sun went back ten steps on the steps on which it had gone down.
translation:
  language: pt
  text: Eis que farei a sombra, que havia descido com o sol nos degraus de Acaz[b], recuar dez degraus[a]. E o sol recuou dez degraus nos degraus pelos quais havia descido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dez graus”. A palavra hebraica significa literalmente “degraus” ou “subidas”; alguns entendem que se trata de uma estrutura em forma de escada usada para indicar a passagem do tempo pela sombra do sol.
    reason: lexical_alternative
  - marker: b
    text: Ou “no relógio solar de Acaz”. O hebraico diz literalmente “nos degraus de Acaz”, talvez se referindo a uma estrutura na qual se observava a sombra do sol.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que
  rationale: Introduz com solenidade o anúncio divino e preserva a força apresentativa do hebraico em registro digno e corrente.
- source_word: מֵשִׁיב
  choice: farei ... recuar
  rationale: O particípio hifil de שוב tem sentido causativo; esta formulação o expressa naturalmente em português.
- source_word: צֵל
  choice: a sombra
  rationale: Mantém a referência concreta à sombra envolvida no sinal, sem explicação adicional.
- source_word: מַעֲלוֹת
  choice: degraus
  rationale: O termo designa literalmente subidas ou degraus. A escolha preserva a imagem concreta e não impõe a interpretação de um relógio solar.
- source_word: בְמַעֲלוֹת אָחָז
  choice: nos degraus de Acaz
  rationale: Reproduz a associação da estrutura com Acaz e deixa em aberto sua forma e função exatas.
- source_word: בַּשֶּׁמֶשׁ
  choice: pela ação do sol
  rationale: Explicita de modo natural a relação instrumental ou causal entre o sol e a descida da sombra, sem identificar a estrutura como relógio solar.
- source_word: אֲחֹרַנִּית
  choice: recuar
  rationale: Integra ao verbo a ideia adverbial de movimento para trás, evitando uma construção pesada.
- source_word: עֶשֶׂר מַעֲלוֹת
  choice: dez degraus
  rationale: Mantém o numeral e o sentido concreto do substantivo; 'dez graus' é uma interpretação possível, registrada em nota.
- source_word: וַתָּשָׁב הַשֶּׁמֶשׁ
  choice: E o sol recuou
  rationale: Preserva o sujeito explícito 'o sol' e a linguagem observacional da narrativa.
- source_word: אֲשֶׁר יָרָדָה
  choice: pelos quais havia descido
  rationale: Conserva a imagem direcional e a possível mudança de referente no enunciado hebraico, cuja oração final tem 'o sol' como antecedente gramatical imediato.
theological_decisions:
- issue: Natureza do sinal envolvendo o sol e a sombra
  choice: Narrar o acontecimento em linguagem observacional, como no hebraico, sem explicar o mecanismo.
  alternative: Restringir a descrição ao movimento da sombra em um relógio solar ou reformulá-la para evitar a ideia de recuo do sol.
  rationale: O texto apresenta um sinal extraordinário dizendo tanto que a sombra recuaria como que o sol recuou. A tradução deve preservar essa tensão sem naturalizar o acontecimento nem impor uma explicação científica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Eis que' mantém a solenidade do anúncio; 'degraus' preserva a concretude e a ambiguidade do hebraico. A repetição de 'degraus' é deliberada, acompanhando a formulação enfática do original.
