  text: וַ/יֹּ֣אמֶר יְשַׁעְיָ֔הוּ יִשְׂא֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וְ/יִמְרְח֥וּ עַֽל הַ/שְּׁחִ֖ין וְ/יֶֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/021.yaml
  text: Isaiah had said[a], “Let them take a cake of figs and spread it on the boil, so that he may recover.”
translation:
  language: pt
  text: 'Isaías tinha dito: “Que tragam uma massa de figos e a apliquem sobre o furúnculo, para que ele se recupere[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e ele viva”. O hebraico emprega o verbo “viver” no sentido de recuperar-se de uma doença.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: tinha dito
  rationale: Embora a forma hebraica seja wayyiqtol, literalmente “e disse”, o versículo fornece uma explicação retrospectiva para a narrativa anterior; o mais-que-perfeito composto expressa com naturalidade essa relação discursiva em português.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: יִשְׂאוּ
  choice: Que tragam
  rationale: נשׂא pode significar levantar, carregar ou tomar; neste contexto de preparação de um tratamento, “tragam” comunica naturalmente que o remédio deve ser obtido e levado ao doente.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: uma massa de figos
  rationale: A expressão designa uma porção compactada de figos. “Massa de figos” evita sugerir um bolo assado e permanece clara para leitores modernos.
- source_word: וְיִמְרְחוּ
  choice: e a apliquem
  rationale: מרח significa espalhar ou untar. “Aplicar” é idiomático no contexto de um preparado medicinal; o pronome retoma “massa de figos”.
- source_word: עַל הַשְּׁחִין
  choice: sobre o furúnculo
  rationale: שְׁחִין designa uma lesão cutânea inflamada, como um furúnculo. A escolha é direta e convencional neste contexto.
- source_word: וְיֶחִי
  choice: para que ele se recupere
  rationale: חיה significa literalmente “viver”, mas aqui, no contexto da cura de uma doença, expressa recuperação. A nota preserva o sentido lexical mais literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural tanto no Brasil quanto em outros contextos lusófonos. A formulação preserva o caráter de instrução médica do enunciado e sinaliza em nota a expressão hebraica literal.
