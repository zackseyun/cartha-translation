lexical_decisions:
- source_word: וַיַּסֵּב
  choice: virou
  rationale: O hifil de סבב descreve aqui o ato físico de mudar a direção do rosto; “virou” é natural e preciso em português.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Adota-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: פָּנָיו
  choice: o rosto
  rationale: Preserva a referência corporal concreta do hebraico e a força expressiva do gesto.
- source_word: אֶל הַקִּיר
  choice: para a parede
  rationale: Expressa naturalmente a direção indicada por אֶל, sem afirmar mais do que o texto sobre proximidade ou contato.
- source_word: וַיִּתְפַּלֵּל
  choice: e orou
  rationale: Tradução direta e corrente do verbo פלל no hitpael em contexto de oração.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição identifica o destinatário da oração, e o nome divino é transliterado para preservar o nome próprio presente no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva sua função de nome próprio; uma nota registra a representação hebraica e a forma tradicional.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Mantém-se o gesto corporal explícito e o nome divino como nome próprio. A ordem dos marcadores segue sua ocorrência no texto.
