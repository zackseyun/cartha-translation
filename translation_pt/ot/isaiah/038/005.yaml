base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/005.yaml
  text: 'Go and say to Hezekiah, ‘Thus says the LORD, the God of David your father: I have heard your prayer; I have seen your tears. Look, I will add fifteen years to your days.’'
translation:
  language: pt
  text: 'Vá e diga a Ezequias: “Assim diz o SENHOR, o Deus de Davi, seu pai: Ouvi a sua oração e vi as suas lágrimas. Eis que acrescentarei quinze anos aos seus dias.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Vá e diga
  rationale: Reproduz naturalmente em português a sequência imperativa hebraica.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o nome divino por SENHOR em versaletes.
- source_word: אָבִיךָ
  choice: seu pai
  rationale: Preserva a linguagem de ancestralidade dinástica, na qual Davi é chamado pai de Ezequias.
- source_word: הִנְנִי
  choice: Eis que
  rationale: Mantém o elemento de apresentação e ênfase do hebraico antes da promessa divina.
- source_word: יוֹסִף עַל יָמֶיךָ
  choice: acrescentarei quinze anos aos seus dias
  rationale: Conserva a expressão idiomática hebraica e permanece clara em português.
theological_decisions:
- issue: Relação de Davi com Ezequias
  choice: Davi, seu pai
  alternative: Davi, seu antepassado
  rationale: A tradução formal preserva a formulação bíblica e sua dimensão dinástica, sem eliminar a abrangência semântica de 'pai' no hebraico.
- issue: Representação do nome divino
  choice: SENHOR
  alternative: Yahweh
  rationale: Emprega a convenção tradicional e amplamente inteligível, sem acrescentar uma vocalização ao corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o paralelismo entre ouvir a oração e ver as lágrimas, bem como a solenidade da fórmula profética.
