base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/001.yaml
  text: 'In those days Hezekiah became sick to the point of death[a], and Isaiah the prophet, the son of Amoz, came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you shall not live.”'
translation:
  language: pt
  text: 'Naqueles dias, Ezequias adoeceu a ponto de morrer[a], e o profeta Isaías, filho de Amoz, foi até ele e lhe disse: “Assim diz Yahweh: Ponha sua casa em ordem, pois você está para morrer; você não viverá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “até morrer” ou “para morrer”. A expressão hebraica indica uma enfermidade em condição mortal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Naqueles dias
  rationale: Preserva o conhecido marcador temporal hebraico e sua ligação narrativa, em português natural.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: Ezequias adoeceu a ponto de morrer
  rationale: O verbo indica adoecimento, e לָמוּת expressa aqui o alcance ou resultado mortal da enfermidade.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: o profeta Isaías, filho de Amoz
  rationale: Mantém todos os elementos da aposição hebraica numa ordem corrente em português.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Conserva a fórmula profética solene e verte diretamente o nome divino.
- source_word: צַו לְבֵיתֶךָ
  choice: Ponha sua casa em ordem
  rationale: Comunica o sentido idiomático de dar as disposições necessárias para a casa, a família e os assuntos pessoais antes da morte.
- source_word: כִּי מֵת אַתָּה
  choice: pois você está para morrer
  rationale: O particípio predicativo anuncia uma morte iminente e certa; a formulação evita o contrassenso contextual de dizer que Ezequias já estava morto.
- source_word: וְלֹא תִחְיֶה
  choice: não continuará vivo
  rationale: Expressa diretamente a negação de vida futura sem restringir o sentido à recuperação médica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega explicitamente o Tetragrama; a transliteração preserva o nome da aliança sem substituí-lo por um título.
- issue: Força de כִּי מֵת אַתָּה וְלֹא תִחְיֶה
  choice: 'um anúncio certo de morte iminente: “você está para morrer; não continuará vivo”'
  alternative: “você está morto e não viverá”; “você morrerá e não se recuperará”
  rationale: A opção preserva a certeza do anúncio profético e a tensão do relato, sem produzir uma afirmação impossível no contexto nem reduzir a segunda oração à ideia de recuperação clínica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “você” no discurso direto e mantém a solenidade da fórmula profética sem arcaísmos desnecessários.
