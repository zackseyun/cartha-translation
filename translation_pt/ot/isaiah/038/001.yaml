    issue: “Então” traduz a ligação entre as duas ações.
    rationale: O וַ/יָּבֹא introduz a ação seguinte na narrativa, mas não exige o reforço temporal explícito de “Então”. “E” é mais fiel e fluente.
  - severity: low
    issue: “não continuará vivo” é menos direto do que o hebraico.
    rationale: וְלֹא תִחְיֶה significa literalmente que ele não viverá. “Você não viverá” preserva a declaração sem acrescentar a noção aspectual de continuação.
  - severity: low
    issue: A nota de rodapé pode indicar com maior precisão a alternativa literal.
    rationale: “Para morrer” é possível, mas “até morrer” evidencia melhor a construção hebraica e a nota deve explicar que a expressão comunica gravidade mortal, não necessariamente a morte já consumada.
