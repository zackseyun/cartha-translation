  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מָֽה אֲדַבֵּ֥ר וְ/אָֽמַר לִ֖/י וְ/ה֣וּא עָשָׂ֑ה אֶדַּדֶּ֥ה כָל שְׁנוֹתַ֖/י עַל מַ֥ר נַפְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/015.yaml
  text: What can I say? He has spoken to me[a], and he himself has done it. I will walk slowly all my years because of the bitterness of my soul.
translation:
  language: pt
  text: O que direi? Ele me falou, e ele mesmo o fez. Andarei devagar todos os meus anos por causa da amargura da minha alma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Andarei mansamente todos os meus anos na amargura da minha alma”. O verbo hebraico é raro e pode indicar um andar contido ou lento; a expressão “na amargura” também pode indicar o modo ou a circunstância, em vez da causa.'
    reason: Alternativa lexical e sintática decorrente da raridade do verbo e da amplitude semântica da preposição.
lexical_decisions:
- source_word: מָה אֲדַבֵּר
  choice: O que direi?
  rationale: Mantém a forma interrogativa e o valor retórico do hebraico, expressando a dificuldade ou incapacidade de acrescentar algo diante do que ocorreu.
- source_word: וְאָמַר לִי
  choice: Ele me falou
  rationale: Apresenta a fala como ação concluída e preserva o pronome sem explicitar no texto que o referente é Deus.
- source_word: וְהוּא עָשָׂה
  choice: e ele mesmo o fez
  rationale: O pronome hebraico explícito é enfático; “ele mesmo” conserva essa ênfase, e “o fez” mantém implícito o objeto da ação.
- source_word: אֶדַּדֶּה
  choice: Andarei devagar
  rationale: O verbo é raro e provavelmente descreve um andar lento, brando ou abatido. A formulação é clara em português e preserva a imagem de movimento que também pode representar a maneira de viver.
- source_word: כָּל שְׁנוֹתַי
  choice: todos os meus anos
  rationale: Tradução direta da expressão temporal, sem acrescentar “restantes”, embora isso possa estar implícito no contexto.
- source_word: עַל מַר נַפְשִׁי
  choice: por causa da amargura da minha alma
  rationale: Entende עַל em sentido causal e preserva “alma”, mantendo a linguagem antropológica e a intensidade afetiva do hebraico.
theological_decisions:
- issue: Referente dos verbos na terceira pessoa
  choice: Manter “ele” no texto, entendendo que se refere a Deus pelo contexto.
  alternative: Explicitar “Deus” ou deixar o sujeito inteiramente indeterminado.
  rationale: O cântico de Ezequias aponta para a palavra e a ação do Senhor, mas este versículo não o nomeia diretamente. O pronome preserva tanto a referência contextual quanto a forma do hebraico.
- issue: Relação entre a amargura e o andar lento
  choice: 'Ler a expressão como causa: “por causa da amargura da minha alma”.'
  alternative: 'Lê-la como modo ou circunstância: “na amargura da minha alma”.'
  rationale: A preposição admite mais de uma relação semântica. A leitura causal é coerente, mas a alternativa permanece genuína e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das orações e a repetição pronominal preservam a ênfase do hebraico sem tornar a frase excessivamente pesada.
