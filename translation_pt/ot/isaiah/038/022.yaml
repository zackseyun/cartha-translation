base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/022.yaml
  text: And Hezekiah said[a], “What is the sign that I shall go up to the house of Yahweh?”
translation:
  language: pt
  text: 'E Ezequias disse: “Qual é o sinal[a] de que subirei à casa de Yahweh?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que sinal há de que subirei à casa de Yahweh?”'
    reason: Alternativa sintática e lexical para a pergunta מָה אוֹת, que também pode ser formulada em português como “Que sinal há...?”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva de modo natural a sequência simples do hebraico.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: מָה אוֹת
  choice: Qual é o sinal
  rationale: A construção pergunta pela identificação do sinal. O artigo em português é natural no contexto, embora o hebraico não tenha artigo explícito; a alternativa é registrada em nota.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo que o sinal deve confirmar. “De que” liga idiomaticamente “sinal” à oração seguinte em português.
- source_word: אֶעֱלֶה
  choice: subirei
  rationale: O imperfeito Qal tem referência futura neste contexto. “Subirei” conserva a ideia concreta e a expressão tradicional de subir ao templo.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de” sem substituí-la interpretativamente por “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome próprio, em vez de substituí-lo por um título.
- issue: Natureza da afirmação introduzida por כִּי
  choice: “de que subirei” como conteúdo confirmado pelo sinal
  alternative: “porque subirei” como relação causal
  rationale: No contexto, Ezequias pede um sinal que confirme sua futura ida à casa de Yahweh; a tradução mantém essa leitura sem acrescentar certeza ou condição além do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Subirei” mantém concisão e formalidade moderada; “casa de Yahweh” conserva a imagem hebraica.
