  text: דּוֹרִ֗/י נִסַּ֧ע וְ/נִגְלָ֛ה מִ/נִּ֖י כְּ/אֹ֣הֶל רֹעִ֑/י קִפַּ֨דְתִּי כָ/אֹרֵ֤ג חַיַּ/י֙ מִ/דַּלָּ֣ה יְבַצְּעֵ֔/נִי מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/012.yaml
  text: My dwelling is pulled up and carried away from me like a shepherd’s tent[a]; I have rolled up my life like a weaver; from the loom he cuts me off[c][b]. From day to night you bring me to an end.
translation:
  language: pt
  text: 'Minha morada foi arrancada e levada para longe de mim,

    como a tenda de um pastor.[a]

    Enrolei minha vida como um tecelão;[b]

    ele me corta dos fios do tear.[c]

    Do dia até a noite, tu me levas ao fim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha geração partiu e foi removida de mim, como a tenda de um pastor”. A palavra hebraica geralmente significa “geração”, mas, neste contexto, pode indicar “morada” ou “habitação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Cortei minha vida como um tecelão”. O verbo hebraico é difícil; “enrolei” segue a imagem do trabalho de tecelagem.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “ele me corta da urdidura”. O termo hebraico se refere mais especificamente aos fios pendentes do tear.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹרִי
  choice: minha morada
  rationale: Embora דּוֹר normalmente signifique “geração”, o paralelismo com a tenda móvel favorece aqui o sentido raro de morada ou habitação; a alternativa é preservada em nota.
- source_word: נִסַּע וְנִגְלָה
  choice: foi arrancada e levada para longe
  rationale: A combinação dos verbos retrata uma tenda desmontada e removida. A formulação mantém o valor passivo e torna concreta a imagem em português.
- source_word: כְּאֹהֶל רֹעִי
  choice: como a tenda de um pastor
  rationale: Preserva de modo natural a imagem do abrigo temporário e transportável usado por um pastor.
- source_word: קִפַּדְתִּי
  choice: Enrolei
  rationale: O verbo é difícil. No contexto da tecelagem, “enrolei” expressa a possível ideia de enrolar o tecido, sem antecipar o corte mencionado na oração seguinte.
- source_word: כָאֹרֵג חַיַּי
  choice: minha vida como um tecelão
  rationale: Mantém a poesia hebraica condensada e associa a vida ao trabalho que um tecelão enrola ou termina.
- source_word: מִדַּלָּה
  choice: dos fios do tear
  rationale: O termo parece designar mais especificamente fios pendentes ou ligados ao tear. “Fios do tear” é compreensível e conserva essa precisão sem recorrer a terminologia técnica obscura.
- source_word: יְבַצְּעֵנִי
  choice: ele me corta
  rationale: O verbo comunica cortar ou separar. A tradução se ajusta à imagem da tecelagem e conserva o sujeito na terceira pessoa.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: Do dia até a noite
  rationale: Segue de perto o hebraico e ressalta a rapidez com que a vida chega ao fim.
- source_word: תַּשְׁלִימֵנִי
  choice: tu me levas ao fim
  rationale: Expressa o sentido causativo de completar ou pôr fim e preserva a passagem repentina para a segunda pessoa.
theological_decisions:
- issue: Mudança do sujeito gramatical da terceira para a segunda pessoa
  choice: 'Preservar a mudança poética: “ele me corta... tu me levas ao fim”'
  alternative: 'Uniformizar as duas orações como referência direta a Deus: “tu me cortas... tu me levas ao fim”'
  rationale: O hebraico passa aparentemente da terceira pessoa, dentro da figura do tecelão, para uma interpelação direta em segunda pessoa. Manter a mudança respeita a forma do lamento e não resolve silenciosamente a possível referência a Deus.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética em versos. “Tu” preserva a interpelação singular e solene sem explicitar o referente. As notas mantêm as principais ambiguidades lexicais do hebraico.
