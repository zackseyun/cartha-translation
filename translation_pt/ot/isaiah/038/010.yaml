- from: 'Eu disse: “No meio dos meus dias[a], tenho de passar pelos portões do Sheol[b]; fui privado do restante dos meus anos.”'
  to: 'Eu disse: “No meio dos meus dias[a], irei às portas do Sheol[b]; fui privado do restante dos meus anos.”'
