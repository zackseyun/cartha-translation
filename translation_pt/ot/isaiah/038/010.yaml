  text: אֲנִ֣י אָמַ֗רְתִּי בִּ/דְמִ֥י יָמַ֛/י אֵלֵ֖כָה בְּ/שַׁעֲרֵ֣י שְׁא֑וֹל פֻּקַּ֖דְתִּי יֶ֥תֶר שְׁנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/010.yaml
  text: I said[a], “In the middle of my days I must go through the gates of Sheol[b]; I am deprived of the rest of my years.”
translation:
  language: pt
  text: 'Eu disse: “No meio dos meus dias[a], irei às portas do Sheol[b]; fui privado do restante dos meus anos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico de sentido incerto: “na interrupção dos meus dias”, “na quietude dos meus dias” ou “no meio dos meus dias”; no contexto, provavelmente se refere ao auge ou ponto médio da vida.'
    reason: lexical_alternative
  - marker: b
    text: Ou “a morada dos mortos” ou “a sepultura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְמִי
  choice: no meio de
  rationale: O termo é difícil e pode sugerir interrupção, silêncio ou ponto médio. Em paralelo com a perda dos anos restantes, “no meio de” comunica de modo natural a ideia provável de morte prematura, sem ocultar a dificuldade lexical, registrada em nota.
- source_word: יָמַי
  choice: meus dias
  rationale: Mantém a imagem hebraica dos dias como duração da vida e forma uma expressão compreensível em português.
- source_word: אֵלֵכָה
  choice: tenho de passar
  rationale: Expressa o movimento esperado rumo à morte e sua inevitabilidade no contexto da lamentação.
- source_word: בְּשַׁעֲרֵי
  choice: pelos portões de
  rationale: A preposição בְּ com “portões” admite a ideia de entrada ou passagem. “Passar pelos portões” é natural em português e apresenta os portões como acesso ao Sheol.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração preserva o conceito hebraico do domínio dos mortos sem reduzi-lo a uma sepultura física nem identificá-lo com concepções posteriores de inferno.
- source_word: פֻּקַּדְתִּי
  choice: fui privado de
  rationale: Neste lamento, a forma passiva comunica que os anos ainda esperados lhe foram tirados. A formulação é clara e mantém o sentido de perda sofrida.
- source_word: יֶתֶר
  choice: o restante de
  rationale: Traduz diretamente a ideia de resto ou porção remanescente.
- source_word: שְׁנוֹתָי
  choice: meus anos
  rationale: Tradução literal e natural, referindo-se aos anos de vida que o falante esperava ainda ter.
theological_decisions:
- issue: Sentido de שְׁאוֹל numa lamentação sobre a morte iminente
  choice: Sheol
  alternative: a morada dos mortos; a sepultura
  rationale: “Sheol” conserva a linguagem israelita sobre o domínio dos mortos e evita impor ao texto uma definição doutrinária posterior ou identificar o termo apenas com o túmulo físico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Portões” foi preferido a “portas” para representar uma entrada monumental; “Sheol” foi mantido e explicado em nota. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
