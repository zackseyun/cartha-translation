  text: שִׁוִּ֤יתִי עַד בֹּ֨קֶר֙ כָּֽ/אֲרִ֔י כֵּ֥ן יְשַׁבֵּ֖ר כָּל עַצְמוֹתָ֑/י מִ/יּ֥וֹם עַד לַ֖יְלָה תַּשְׁלִימֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/013.yaml
  text: I waited until morning[a]; like a lion, so he breaks all my bones[b]. From day to night you bring me to an end.
translation:
  language: pt
  text: Esperei até o amanhecer[a]; como um leão, ele quebra todos os meus ossos[b]. Do dia à noite, tu me levas ao fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mantive-me firme até o amanhecer.” O verbo inicial é difícil, e alguns o entendem como autocontrole, em vez de espera.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico muda de “ele quebra” para “tu me levas ao fim”; essa mudança poética de pessoa é preservada na tradução.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Esperei
  rationale: O verbo é difícil neste contexto. Entendê-lo como espera ou resistência durante a noite combina bem com עַד בֹּקֶר e com o fluxo do lamento, sem ocultar em nota a possibilidade de autocontrole.
- source_word: עַד בֹּקֶר
  choice: até de manhã
  rationale: Expressão temporal direta, vertida de modo natural em português.
- source_word: כָּאֲרִי
  choice: como um leão
  rationale: Mantém diretamente o símile hebraico e sua imagem de força devastadora.
- source_word: יְשַׁבֵּר
  choice: quebra
  rationale: O piel de שבר comunica ação intensa de quebrar ou despedaçar. “Quebra” é concreto, claro e combina naturalmente com “ossos”.
- source_word: כָּל עַצְמוֹתָי
  choice: todos os meus ossos
  rationale: Preserva a imagem corporal enfática do hebraico.
- source_word: מִיּוֹם עַד לַיְלָה
  choice: Do dia até a noite
  rationale: Reproduz a expressão temporal hebraica sem interpretá-la explicitamente como “num só dia”.
- source_word: תַּשְׁלִימֵנִי
  choice: tu me levas ao fim
  rationale: Expressa aqui a ideia de completar no sentido de pôr fim à vida do falante. O pronome “tu” torna audível a segunda pessoa masculina singular e preserva a mudança de interlocução.
theological_decisions:
- issue: Mudança da terceira para a segunda pessoa dentro do versículo
  choice: Preservar “ele quebra ... tu me levas ao fim”
  alternative: Harmonizar as duas orações na terceira pessoa ou identificar explicitamente o leão com Deus em ambas
  rationale: O hebraico contém uma mudança poética de pessoa. Mantê-la conserva a tensão e a intensidade do lamento sem explicitar além do texto a relação exata entre a imagem do leão e Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” para refletir claramente a segunda pessoa singular do hebraico. A formulação mantém o paralelismo, a violência da imagem do leão e a mudança repentina de pessoa.
