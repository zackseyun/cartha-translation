  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יְשַׁעְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/004.yaml
  text: Then the word of Yahweh came to Isaiah[a], saying,
translation:
  language: pt
  text: 'Então a palavra de Yahweh[a] veio a Isaías:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também transliterado como “Jeová”.'
    reason: Registra a forma hebraica do nome divino e uma forma tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O waw consecutivo com היה dá sequência à narrativa; em português atual, “Então ... veio” expressa essa função sem recorrer ao arcaísmo “E aconteceu que”.
- source_word: דְּבַר
  choice: a palavra
  rationale: Na fórmula profética דְּבַר יְהוָה, “a palavra” preserva de modo transparente a expressão tradicional de revelação divina, sem a interpretação adicional de “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da palavra divina; “veio a Isaías” é uma formulação natural e digna em português.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Emprega a forma portuguesa consagrada do nome pessoal.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz o conteúdo da fala que vem no versículo seguinte. Em português, os dois-pontos cumprem essa função com mais naturalidade do que o decalque “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e segue uma transliteração acadêmica amplamente aceita, enquanto “Jeová” representa uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula profética foi preservada, enquanto לֵאמֹר foi representado naturalmente por dois-pontos porque a fala começa no versículo seguinte.
