  text: וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִ֖י עַל הָ/עִ֥יר הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/006.yaml
  text: And I will deliver you and this city from the hand of the king of Assyria[a], and I will defend this city.
translation:
  language: pt
  text: Eu livrarei você e esta cidade da mão do rei da Assíria[a] e defenderei esta cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do poder do rei da Assíria». A expressão hebraica diz literalmente: «da mão do rei da Assíria».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף
  choice: das mãos de
  rationale: A expressão hebraica indica poder ou domínio. A formulação portuguesa preserva a imagem concreta e é compreensível no contexto de livramento.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: do rei da Assíria
  rationale: Reproduz de modo direto e natural a construção que identifica o governante assírio.
- source_word: אַצִּילְךָ
  choice: livrarei você
  rationale: O hifil de נצל expressa retirar ou resgatar alguém do perigo. «Livrar» convém ao contexto militar e mantém dignidade bíblica sem acrescentar uma ideia soteriológica mais ampla.
- source_word: וְאֵת הָעִיר הַזֹּאת
  choice: e esta cidade
  rationale: Traduz diretamente o objeto definido com demonstrativo, sem acrescentar ênfase ausente no hebraico.
- source_word: וְגַנּוֹתִי
  choice: e defenderei
  rationale: O verbo גנן comunica proteção. No cenário de ameaça militar, «defender» expressa com naturalidade uma proteção ativa.
- source_word: עַל הָעִיר הַזֹּאת
  choice: esta cidade
  rationale: Com גנן, a preposição assinala aquilo sobre o qual recai a proteção; em português, «defender esta cidade» é mais idiomático que uma reprodução literal da preposição.
theological_decisions:
- issue: Linguagem de livramento divino em contexto histórico-militar
  choice: «livrarei» para a retirada de Ezequias e Jerusalém do poder assírio
  alternative: «salvarei» ou «resgatarei»
  rationale: O versículo trata da preservação histórica diante de um rei inimigo. «Livrarei» mantém o sentido imediato e o registro bíblico sem importar uma afirmação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Você» torna explícito o objeto masculino singular do hebraico; «das mãos» conserva a imagem idiomática, enquanto a nota esclarece seu sentido de poder ou domínio.
