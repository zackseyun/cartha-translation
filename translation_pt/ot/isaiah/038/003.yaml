  text: וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/038/003.yaml
  text: And he said[a], “Please, O Yahweh, remember how I have walked before you in faithfulness and with a whole heart[c][b], and have done what is good in your eyes.” And Hezekiah wept greatly.
translation:
  language: pt
  text: 'E ele disse: “Por favor, ó Yahweh, lembra-te de que tenho andado diante de ti com fidelidade[a] e com um coração íntegro[b], e tenho feito o que é bom aos teus olhos”. E Ezequias chorou muito[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com verdade”. O termo hebraico pode indicar verdade, confiabilidade ou fidelidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “de coração indiviso” ou “de coração pleno”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “chorou com grande choro”.
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אָנָּה ... נָא
  choice: Por favor ... lembra-te
  rationale: Expressa de modo natural e reverente a súplica enfática formada pelas partículas de apelo.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: tenho andado diante de ti
  rationale: Mantém a metáfora bíblica de andar diante de Deus e seu sentido de conduta contínua.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: No contexto da conduta de Ezequias, comunica integridade e constância, sem eliminar a possibilidade lexical de 'verdade'.
- source_word: וּבְלֵב שָׁלֵם
  choice: de coração íntegro
  rationale: Comunica inteireza e sinceridade da devoção em português corrente, sem sugerir necessariamente perfeição sem pecado.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: e tenho feito o que é bom aos teus olhos
  rationale: Preserva a imagem hebraica da avaliação divina e soa natural em português.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: chorou muito
  rationale: Transmite naturalmente a intensidade do cognato acusativo hebraico, literalmente 'chorou um grande choro', sem acrescentar a nuance específica de amargura.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: A autodescrição de Ezequias pode parecer uma alegação de perfeição moral absoluta.
  choice: de coração íntegro
  alternative: de coração perfeito; de coração indiviso
  rationale: A escolha conserva a ideia hebraica de inteireza e devoção sincera, sem resolver o texto como se Ezequias afirmasse impecabilidade absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o nome Yahweh, a metáfora bíblica de andar diante de Deus e a expressão 'aos teus olhos'. A colocação pronominal 'lembra-te' preserva o tom reverente sem recorrer a linguagem excessivamente arcaica.
