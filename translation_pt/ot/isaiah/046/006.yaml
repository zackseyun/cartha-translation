base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/006.yaml
  text: Those who lavish gold from the purse and weigh out silver on the scale hire a goldsmith[a], and he makes it into a god; they bow down, indeed they prostrate themselves.
translation:
  language: pt
  text: Os que esbanjam ouro da bolsa e pesam prata na balança[a] contratam um ourives, e ele faz disso um deus; eles se ajoelham e até se prostram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pesam prata com a haste da balança”. A palavra hebraica significa literalmente “cana” ou “vara” e pode designar a haste usada para medir numa balança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּלִים
  choice: Os que esbanjam
  rationale: O particípio descreve quem derrama ou despende abundantemente; “esbanjam” comunica o gasto extravagante no contexto da fabricação de um ídolo.
- source_word: זָהָב מִכִּיס
  choice: ouro da bolsa
  rationale: כִּיס é uma bolsa ou saco para dinheiro; “bolsa” é natural e preserva a imagem concreta.
- source_word: וְכֶסֶף בַּקָּנֶה יִשְׁקֹלוּ
  choice: e pesam prata na balança[a]
  rationale: קָנֶה significa literalmente “cana” ou “vara”, mas aqui provavelmente designa a haste de uma balança. A tradução comunica naturalmente a atividade comercial, enquanto a nota preserva a particularidade lexical.
- source_word: יִשְׂכְּרוּ צוֹרֵף
  choice: contratam um ourives
  rationale: צוֹרֵף designa um artesão de metais, refinador ou ourives; por se tratar de ouro e prata empregados na fabricação de uma imagem, “ourives” é preciso no contexto.
- source_word: וְיַעֲשֵׂהוּ אֵל
  choice: e ele faz disso um deus
  rationale: O sufixo remete ao metal mencionado. “Faz disso um deus” mantém a linguagem deliberadamente polêmica do hebraico sem substituir אֵל por “ídolo”.
- source_word: יִסְגְּדוּ
  choice: eles se ajoelham
  rationale: סגד indica inclinar-se ou ajoelhar-se em homenagem; esta formulação é clara e permite distinguir a ação seguinte, mais intensa.
- source_word: אַף יִשְׁתַּחֲווּ
  choice: e até se prostram
  rationale: אַף reforça a segunda ação, e השתחוה descreve prostração em reverência ou adoração. “Até” preserva a intensificação retórica.
theological_decisions:
- issue: Terminologia aplicada à falsa divindade fabricada
  choice: um deus
  alternative: um ídolo
  rationale: O hebraico emprega אֵל, “deus”. A tradução conserva essa escolha lexical e a ironia da passagem; o contexto deixa evidente que se trata de uma divindade feita por mãos humanas, sem lhe atribuir realidade divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo das ações e a progressão de ajoelhar-se para prostrar-se.
