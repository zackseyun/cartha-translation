  - severity: low
    issue: A nota de rodapé a não explicita “cedem/afundam” como alternativa do texto adotado.
    rationale: Uma nota lexical alinhada com a escolha principal torna transparente a nuance e a alternativa de “desabam”, sem sobrecarregar o texto.
  revised_text: Eles cedem[a]; prostram-se juntos. Não conseguem livrar a carga, e eles mesmos vão para o cativeiro.
