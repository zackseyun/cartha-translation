source:
  edition: WLC
  text: קָרְס֤וּ כָֽרְעוּ֙ יַחְדָּ֔ו לֹ֥א יָכְל֖וּ מַלֵּ֣ט מַשָּׂ֑א וְ/נַפְשָׁ֖/ם בַּ/שְּׁבִ֥י הָלָֽכָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/002.yaml
  text: They stoop[a]; they bow down together. They are unable to save the burden[b], and they themselves go into captivity.
translation:
  language: pt
  text: Eles cedem[a]; prostram-se juntos. Não conseguem livrar a carga, e eles mesmos vão para o cativeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desabam”; o verbo hebraico pode sugerir que cedem, afundam ou entram em colapso.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְסוּ
  choice: se curvam
  rationale: O verbo descreve afundar ou encurvar-se. “Curvam-se” mantém a imagem física e o paralelismo sem afirmar necessariamente um colapso completo.
- source_word: כָּרְעוּ
  choice: prostram-se
  rationale: O verbo pode indicar ajoelhar-se ou curvar-se. “Prostram-se” preserva a ironia de deuses que, em vez de receberem prostração, caem eles próprios.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Expressa ação conjunta e soa natural em português atual.
- source_word: לֹא יָכְלוּ
  choice: não conseguem
  rationale: Comunica incapacidade e mantém viva a descrição profética no presente.
- source_word: מַלֵּט
  choice: livrar
  rationale: O infinitivo causativo significa fazer escapar ou pôr a salvo. “Livrar” é direto e adequado ao contexto imediato.
- source_word: מַשָּׂא
  choice: a carga
  rationale: Refere-se àquilo que é transportado. “Carga” é concreto e natural no contexto dos ídolos carregados.
- source_word: וְנַפְשָׁם
  choice: e eles mesmos
  rationale: נֶפֶשׁ pode significar vida, pessoa ou o próprio ser. Aqui, a construção personifica os deuses/ídolos e pode ser vertida idiomaticamente como “eles mesmos”, sem introduzir uma afirmação sobre a alma dos ídolos.
- source_word: בַּשְּׁבִי
  choice: para o cativeiro
  rationale: Indica a condição ou destino de quem é levado cativo.
- source_word: הָלָכָה
  choice: vão
  rationale: Embora seja formalmente perfeito feminino singular, concordando com נֶפֶשׁ, o presente em português combina com as cláusulas anteriores e comunica a cena profética com vivacidade.
theological_decisions:
- issue: Personificação dos deuses/ídolos na cláusula final
  choice: Traduzir וְנַפְשָׁם idiomaticamente por “e eles mesmos”
  alternative: “e sua vida/alma vai para o cativeiro”
  rationale: A passagem ridiculariza a impotência dos deuses babilônicos. O hebraico admite “o próprio ser/pessoa”; a forma reflexiva preserva a força da personificação sem resolver o termo נֶפֶשׁ como uma declaração antropológica sobre os ídolos.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético. “Prostram-se” conserva a ironia cultual, enquanto “carga” mantém a imagem concreta do contexto. A ambiguidade de נֶפֶשׁ é preservada na documentação da decisão, mas o texto principal usa a forma idiomática “eles mesmos”.
