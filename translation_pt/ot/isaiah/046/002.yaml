  source_fidelity: 'A tradução preserva adequadamente a sequência e a personificação: os ídolos/deuses se abaixam, não podem libertar aquilo que carregam e acabam no cativeiro. Porém, a primeira forma verbal, קָרְסוּ, sugere mais especificamente ceder/afundar ou desabar do que o genérico “se curvam”, e a nota atual não registra a alternativa mais próxima de “cedem/afundam”.'
