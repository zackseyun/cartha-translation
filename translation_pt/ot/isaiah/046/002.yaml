  terminology: “Prostram-se” representa bem כָּרְעוּ no contexto irônico. “Livrar a carga” é uma formulação natural para מַלֵּט מַשָּׂא. “Eles mesmos” comunica de modo idiomático o valor autorreferencial possível de וְנַפְשָׁם, sem transformar o termo em uma tese sobre uma alma dos ídolos.
  issues:
