id: ISA.46.12
reference: Isaiah 46:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֥וּ אֵלַ֖/י אַבִּ֣ירֵי לֵ֑ב הָ/רְחוֹקִ֖ים מִ/צְּדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/012.yaml
  text: Listen to me[a], you stubborn of heart[b], you who are far from righteousness.
translation:
  language: pt
  text: Escutem-me, vocês que têm o coração obstinado[a], vocês que estão longe da justiça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “fortes de coração” ou “duros de coração”. A expressão hebraica significa literalmente “fortes” ou “poderosos de coração”, mas provavelmente tem sentido negativo neste contexto: obstinados.'
    reason: lexical_alternative
  - marker: b
    text: Ou “longe da retidão”; neste contexto, “justiça” também pode se referir à ação justa e salvadora de Deus, isto é, à sua vindicação.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Escutem
  rationale: O imperativo plural convoca os destinatários não apenas a ouvir sons, mas a prestar atenção e acatar; “Escutem” é natural e direto em português moderno.
- source_word: אֵלַי
  choice: me
  rationale: 'Com “Escutem”, o pronome átono expressa de modo idiomático e fiel a direção da convocação: “a mim”.'
- source_word: אַבִּירֵי לֵב
  choice: vocês que têm o coração obstinado
  rationale: A expressão significa literalmente algo como “fortes/poderosos de coração”, mas no contexto de repreensão caracteriza obstinação. A formulação conserva a imagem do coração sem soar artificial em português.
- source_word: הָרְחוֹקִים
  choice: vocês que estão longe
  rationale: O particípio substantivado descreve o grupo interpelado; uma oração relativa produz português claro e natural.
- source_word: מִצְּדָקָה
  choice: da justiça
  rationale: צְדָקָה abrange retidão, justiça e, neste contexto mais amplo, possivelmente a ação justa ou salvadora de Deus. “Justiça” preserva melhor essa amplitude em português, enquanto a nota registra a alternativa “retidão”.
theological_decisions:
- issue: Sentido de צְדָקָה
  choice: justiça
  alternative: retidão; ação salvadora ou vindicação
  rationale: O termo pode indicar retidão moral, justiça ou a intervenção justa e salvadora de Deus. O contexto imediato não exige restringi-lo exclusivamente à condição moral dos destinatários; “justiça” mantém a tensão, e a nota explicita as demais possibilidades.
- issue: Força de אַבִּירֵי לֵב
  choice: coração obstinado
  alternative: fortes de coração; duros de coração
  rationale: Embora a expressão seja literalmente “fortes/poderosos de coração”, sua função na repreensão é provavelmente negativa. “Obstinado” comunica essa força contextual sem transformar a expressão em uma afirmação de coragem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A repetição de “vocês” reproduz a interpelação enfática do hebraico, e as notas preservam as ambiguidades lexicais relevantes.
