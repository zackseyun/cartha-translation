  text: Remember this and be ashamed[a]; take it to heart[c][b], you transgressors.
translation:
  language: pt
  text: Lembrem-se disto e sejam firmes[a]; levem isto a sério[b], vocês que se rebelam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mostrem-se fortes”, “tomem coragem” ou, segundo outra interpretação, “envergonhem-se”. O verbo hebraico é raro e seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tragam isto de volta ao coração”; isto é, voltem a considerar isto atentamente ou guardem isto no coração.
    reason: lexical_alternative
  - marker: c
    text: Ou “transgressores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Lembrem-se
  rationale: Imperativo plural de זכר. A forma pronominal é a maneira natural, em português, de ordenar que algo seja recordado.
- source_word: זֹאת
  choice: disto
  rationale: Preserva o demonstrativo feminino singular e retoma o que foi apresentado no contexto anterior.
- source_word: וְהִתְאֹשָׁשׁוּ
  choice: e sejam firmes
  rationale: O verbo é raro e parece exortar os ouvintes a se mostrarem fortes ou firmes. A tradução evita introduzir uma referência explícita à masculinidade e não adota a interpretação contextualmente possível, mas lexicalmente incerta, de sentir vergonha.
- source_word: הָשִׁיבוּ ... עַל־לֵב
  choice: levem isso a sério
  rationale: A expressão significa literalmente fazer algo voltar ao coração, isto é, voltar a considerá-lo atentamente e interiorizá-lo. A formulação escolhida comunica o sentido idiomático em português corrente.
- source_word: פוֹשְׁעִים
  choice: vocês que se rebelam
  rationale: O particípio plural de פשע descreve pessoas que se insurgem ou transgridem. A construção verbal é clara e natural em português, preservando a ideia ativa e contínua.
theological_decisions:
- issue: Natureza da exortação em וְהִתְאֹשָׁשׁוּ
  choice: sejam firmes
  alternative: envergonhem-se
  rationale: Como o verbo é raro, a interpretação exata é discutida. A tradução segue o sentido lexical de fortalecimento ou firmeza, sem resolver a tensão por uma leitura contextual que exigiria um sentido menos seguro.
- issue: Caracterização de פוֹשְׁעִים
  choice: vocês que se rebelam
  alternative: transgressores
  rationale: A escolha mantém o aspecto de rebelião presente na raiz sem limitar o termo a uma categoria técnica de infração religiosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O plural foi expresso por formas correntes sem regionalismos marcados. As notas preservam a incerteza do verbo raro e o sentido literal do idioma hebraico.
