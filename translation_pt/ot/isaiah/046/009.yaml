  text: זִכְר֥וּ רִאשֹׁנ֖וֹת מֵ/עוֹלָ֑ם כִּ֣י אָנֹכִ֥י אֵל֙ וְ/אֵ֣ין ע֔וֹד אֱלֹהִ֖ים וְ/אֶ֥פֶס כָּמֽוֹ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/009.yaml
  text: Remember the former things of old[a], for I am God, and there is no other; I am God, and there is none like me.
translation:
  language: pt
  text: Lembrem-se das coisas passadas, de muito tempo atrás[a], pois eu sou Deus, e não há outro; eu sou Deus, e não há ninguém semelhante a mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos tempos antigos” ou “desde os tempos antigos”. Aqui, a expressão hebraica se refere ao passado remoto, não necessariamente à eternidade em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Lembrem-se
  rationale: Imperativo plural de זכר, dirigido ao público e exigindo recordação ativa. A forma é natural e clara no português moderno.
- source_word: רִאשֹׁנוֹת
  choice: das coisas passadas
  rationale: Adjetivo feminino plural usado substantivamente, referindo-se a atos ou acontecimentos anteriores; a expressão mantém o contraste recorrente em Isaías entre o que passou e o que virá.
- source_word: מֵעוֹלָם
  choice: dos tempos antigos
  rationale: Neste contexto, עוֹלָם aponta para o passado remoto, não necessariamente para a eternidade em sentido abstrato.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem de recordar, com força explicativa clara e digna.
- source_word: אָנֹכִי אֵל
  choice: eu sou Deus
  rationale: אֵל funciona aqui como designação comum de Deus, e não como nome próprio que exija transliteração.
- source_word: וְאֵין עוֹד
  choice: e não há outro
  rationale: A locução hebraica exprime exclusividade; esta tradução é concisa e natural.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora tenha forma morfológica plural, o termo refere-se aqui ao único Deus e está integrado numa declaração explícita de singularidade.
- source_word: וְאֶפֶס כָּמוֹנִי
  choice: e não há ninguém semelhante a mim
  rationale: A expressão afirma incomparabilidade. “Ninguém semelhante a mim” comunica naturalmente a referência pessoal sem enfraquecer a afirmação.
theological_decisions:
- issue: Autoidentificação divina e exclusividade
  choice: Preservar as duas ocorrências de “Deus” e as duas afirmações paralelas de exclusividade.
  alternative: Traduzir apenas a primeira ocorrência de “Deus” e deixar a segunda subentendida, ou verter אֵל como “Deus poderoso”.
  rationale: O hebraico formula enfaticamente a singularidade e incomparabilidade de Deus mediante cláusulas paralelas. A repetição preserva essa ênfase sem acrescentar conteúdo doutrinário ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O plural “Lembrem-se” explicita o destinatário coletivo do imperativo hebraico. A pontuação preserva o paralelismo e a ênfase da declaração divina.
