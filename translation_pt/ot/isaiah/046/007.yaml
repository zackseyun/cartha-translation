base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/007.yaml
  text: They lift it onto the shoulder[a], they carry it, and they set it in its place, and it stands there; it does not move from its place. Even if someone cries out to it, it does not answer; it does not save him from his distress.
translation:
  language: pt
  text: Eles o erguem sobre o ombro, carregam-no e o colocam em seu lugar[a]. Ele fica ali, de pé; não sai do lugar. Mesmo que alguém clame a ele, ele não responde nem salva essa pessoa de sua aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “e o colocam debaixo dele”, provavelmente no sentido de pôr o ídolo em seu lugar ou sobre sua base.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂאֻהוּ
  choice: Eles o levantam
  rationale: Distingue a ação inicial de erguer o ídolo do verbo seguinte, que descreve carregá-lo.
- source_word: עַל כָּתֵף
  choice: sobre os ombros
  rationale: O hebraico traz o singular coletivo/idiomático; o plural é a expressão mais natural em português para o transporte de uma carga pesada, sem alterar o sentido.
- source_word: יִסְבְּלֻהוּ
  choice: carregam-no
  rationale: Expressa o ato de suportar e transportar uma carga, preservando a sequência de ações.
- source_word: וְיַנִּיחֻהוּ תַחְתָּיו
  choice: e o colocam em seu lugar
  rationale: A formulação hebraica é literalmente semelhante a 'e o colocam debaixo dele', provavelmente referindo-se à colocação do ídolo em sua posição ou base; a nota preserva a dificuldade textual.
- source_word: וְיַעֲמֹד
  choice: Ali ele fica de pé
  rationale: Descreve o ídolo já posicionado e introduz naturalmente o contraste com sua completa imobilidade.
- source_word: מִמְּקוֹמוֹ לֹא יָמִישׁ
  choice: não sai do lugar
  rationale: Reproduz de modo idiomático a incapacidade do ídolo de se mover de sua posição.
- source_word: אַף יִצְעַק אֵלָיו
  choice: Mesmo que alguém clame a ele
  rationale: אַף tem força enfática/concessiva, e o sujeito masculino singular é genérico; 'alguém' comunica essa indefinição naturalmente.
- source_word: וְלֹא יַעֲנֶה
  choice: ele não responde
  rationale: ענה é o verbo comum para responder a um clamor ou pedido; o presente combina com a descrição proverbial da impotência do ídolo.
- source_word: מִצָּרָתוֹ לֹא יוֹשִׁיעֶנּוּ
  choice: nem salva essa pessoa de sua aflição
  rationale: Preserva o sentido teológico de ישׁע, 'salvar/livrar', e verte צָרָה por 'aflição'; 'essa pessoa' mantém a referência singular genérica com clareza em português.
theological_decisions:
- issue: Masculino singular genérico na oração final
  choice: alguém ... essa pessoa ... sua aflição
  alternative: ele clama ... não o salva de sua aflição
  rationale: O masculino singular hebraico tem função genérica. A formulação escolhida conserva a referência singular sem sugerir que o texto se limita a um homem.
- issue: Impotência do ídolo diante do clamor
  choice: ele não responde nem salva
  alternative: ele não pode responder nem salvar
  rationale: O hebraico afirma o fato negativo, não emprega explicitamente um verbo de capacidade. A tradução preserva essa forma sem enfraquecer a ironia contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ênclise em “carregam-no” evita uma sequência pouco natural de pronomes soltos, enquanto o restante mantém sintaxe corrente. A ambiguidade da expressão תַחְתָּיו é preservada em nota.
