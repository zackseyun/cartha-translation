base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/001.yaml
  text: Bel bows down[a]; Nebo stoops. Their idols are for the beasts and the cattle. Your loads are borne[c][b], loaded as a burden for the weary.
translation:
  language: pt
  text: Bel se curva; Nebo se abaixa. Seus ídolos[a] são postos sobre animais e sobre o gado. Suas cargas são transportadas, postas como fardo sobre o animal cansado[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas imagens”. O termo hebraico pode designar imagens fabricadas, mas aqui se refere polemicamente a ídolos.
    reason: lexical_alternative
  - marker: b
    text: O hebraico desta frase é difícil. Provavelmente se refere às imagens dos ídolos, antes carregadas em procissão ou transportadas como objetos sagrados, e agora levadas como carga.
    reason: textual_difficulty
  - marker: c
    text: Ou “um fardo para o que está cansado”. A forma hebraica feminina singular provavelmente se refere ao animal que carrega os ídolos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  choice: se curva
  rationale: O perfeito qal descreve vividamente a queda e humilhação de Bel; o presente preserva a força da cena profética.
- source_word: בֵּל
  choice: Bel
  rationale: Nome próprio da divindade babilônica, transliterado.
- source_word: קֹרֵס
  choice: se abaixa
  rationale: O particípio expressa curvar-se ou desabar; a escolha forma um paralelismo natural com “se curva” sem apagar a imagem de humilhação.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nome próprio da divindade babilônica, transliterado.
- source_word: עֲצַבֵּיהֶם
  choice: seus ídolos
  rationale: Neste contexto profético, o termo designa imagens cultuais e tem força polêmica; “ídolos” comunica isso com clareza.
- source_word: לַחַיָּה וְלַבְּהֵמָה
  choice: sobre animais e sobre o gado
  rationale: A expressão apresenta as imagens como carga transportada por animais; “gado” preserva o sentido coletivo de animais domésticos sem especificar uma espécie.
- source_word: נְשֻׂאֹתֵיכֶם
  choice: as coisas que vocês carregavam
  rationale: A forma hebraica é difícil e pode designar os objetos antes carregados pelos adoradores; esta formulação mantém a referência relativamente aberta.
- source_word: עֲמוּסוֹת
  choice: são colocadas como carga
  rationale: O particípio passivo descreve os objetos sendo carregados ou postos sobre animais, reforçando a ironia de deuses que precisam ser transportados.
- source_word: מַשָּׂא
  choice: um peso
  rationale: O substantivo significa carga ou fardo; “peso” evita repetição imediata e ressalta o efeito sobre o carregador.
- source_word: לַעֲיֵפָה
  choice: para o animal cansado
  rationale: O feminino singular provavelmente aponta para um animal de carga implícito ou coletivo; a tradução explicita apenas o referente sugerido pelo contexto.
theological_decisions:
- issue: Designação das imagens cultuais pagãs
  choice: seus ídolos
  alternative: suas imagens
  rationale: “Ídolos” preserva a crítica profética inerente ao contexto sem acrescentar uma doutrina alheia ao texto.
- issue: Ironia dos deuses transportados
  choice: as coisas que vocês carregavam são colocadas como carga
  alternative: suas cargas são transportadas
  rationale: A formulação mantém a provável alusão às imagens antes levadas em procissão, mas não identifica o referente de modo mais rígido do que permite o hebraico difícil.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas verbais vívidas no presente e tratamento por “vocês”. O paralelismo poético foi preservado; a segunda metade foi formulada de modo natural sem ocultar a dificuldade sintática do hebraico.
