base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/004.yaml
  text: Even to your old age[a], I am he, and to gray hairs I will carry you. I have made, and I will bear; I will carry[b], and I will rescue.
translation:
  language: pt
  text: Mesmo na velhice de vocês, sou eu; mesmo quando tiverem cabelos brancos, eu os carregarei. Eu os fiz, eu os sustentarei, eu os carregarei e os livrarei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu os resgatarei”. O verbo hebraico também pode significar pôr a salvo ou fazer escapar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד זִקְנָה
  choice: Mesmo até a velhice de vocês
  rationale: Expressa a continuidade enfática até a velhice. O possessivo, implícito pelo contexto da fala ao povo, torna a frase natural em português.
- source_word: אֲנִי הוּא
  choice: eu sou o mesmo
  rationale: Mantém a solene autoidentificação divina e, em português, comunica naturalmente a continuidade de identidade sugerida no contexto, sem desenvolver uma fórmula teológica posterior.
- source_word: וְעַד שֵׂיבָה
  choice: até terem cabelos brancos
  rationale: Preserva a imagem concreta dos cabelos brancos como sinal de idade avançada, em formulação corrente e clara.
- source_word: אֶסְבֹּל
  choice: eu os carregarei / os sustentarei
  rationale: סבל abrange carregar um peso e sustentá-lo. A primeira ocorrência conserva a imagem de carregar; a segunda usa 'sustentarei' para evitar repetição pesada, sem sair do campo semântico.
- source_word: עָשִׂיתִי
  choice: Eu os fiz
  rationale: 'O objeto ''vocês/os'' é fornecido pelo contexto: Deus fez o povo que promete continuar carregando.'
- source_word: אֶשָּׂא
  choice: os sustentarei
  rationale: נשא pode significar levantar, levar ou suportar. 'Sustentarei' comunica aqui o cuidado contínuo de Deus e permite que סבל retenha a imagem explícita de carregar.
- source_word: וַאֲמַלֵּט
  choice: e os livrarei
  rationale: O piel de מלט indica fazer escapar, pôr a salvo ou livrar. 'Livrarei' é digno e corrente, sem ampliar indevidamente o sentido para uma formulação soteriológica completa.
theological_decisions:
- issue: Autoidentificação divina em אֲנִי הוּא
  choice: eu sou o mesmo
  alternative: eu sou ele; sou eu
  rationale: '''Eu sou o mesmo'' é natural no contexto da permanência de Deus ao longo da vida do povo e preserva a força da declaração, sem importar formulações teológicas posteriores.'
- issue: Objeto implícito dos verbos de fazer, sustentar, carregar e livrar
  choice: explicitar 'vocês/os'
  alternative: deixar os verbos sem objeto expresso
  rationale: O contexto identifica o povo interpelado como objeto. A explicitação é necessária para uma frase natural em português e não altera o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural 'vocês/os' deixa claro que Deus se dirige ao povo. A imagem dos cabelos brancos foi preservada; a alternância entre 'sustentar' e 'carregar' reflete a sobreposição semântica dos verbos hebraicos sem tornar a redação artificial.
