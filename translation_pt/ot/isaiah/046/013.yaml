  text: קֵרַ֤בְתִּי צִדְקָתִ/י֙ לֹ֣א תִרְחָ֔ק וּ/תְשׁוּעָתִ֖/י לֹ֣א תְאַחֵ֑ר וְ/נָתַתִּ֤י בְ/צִיּוֹן֙ תְּשׁוּעָ֔ה לְ/יִשְׂרָאֵ֖ל תִּפְאַרְתִּֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/013.yaml
  text: I have brought near my righteousness[a]; it is not far away, and my salvation will not delay. I will place salvation in Zion[b], for Israel my splendor.
translation:
  language: pt
  text: Aproximei a minha justiça[a]; ela não está longe, e a minha salvação não demorará. Porei em Sião salvação, para Israel o meu esplendor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a minha retidão» ou «a minha vindicação».
    reason: lexical_alternative
  - marker: b
    text: Ou «a minha glória».
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵרַבְתִּי
  choice: Eu trouxe para perto
  rationale: O qal perfeito na primeira pessoa singular expressa uma ação realizada com relevância presente; a formulação preserva tanto o aspecto quanto a ideia de aproximação.
- source_word: צִדְקָתִי
  choice: a minha justiça
  rationale: צדקה abrange justiça, retidão e ação vindicadora; «justiça» mantém amplitude teológica em português, com alternativas registradas em nota.
- source_word: לֹא תִרְחָק
  choice: ela não está longe
  rationale: O verbo na terceira pessoa feminina concorda com «justiça»; a expressão comunica proximidade iminente em português natural.
- source_word: וּתְשׁוּעָתִי
  choice: e a minha salvação
  rationale: «Salvação» representa adequadamente תשועה e preserva a terminologia bíblica corrente e a repetição temática do versículo.
- source_word: לֹא תְאַחֵר
  choice: não demorará
  rationale: O piel imperfeito expressa que a salvação não se atrasará; «não demorará» é atual e idiomático.
- source_word: וְנָתַתִּי
  choice: Porei
  rationale: נתן pode significar dar, estabelecer ou colocar; com a preposição locativa e o objeto abstrato, «porei» exprime de modo conciso o sentido contextual.
- source_word: בְצִיּוֹן
  choice: em Sião
  rationale: A preposição ב tem sentido locativo direto neste contexto.
- source_word: תְּשׁוּעָה
  choice: a salvação
  rationale: A repetição de «salvação» reproduz a ênfase lexical hebraica.
- source_word: לְיִשְׂרָאֵל
  choice: de Israel
  rationale: Na construção adotada para a cláusula final, ל marca a relação de Israel com aquilo que Deus estabelece como seu esplendor; a formulação evita o português truncado sem perder o nexo do hebraico.
- source_word: תִּפְאַרְתִּי
  choice: o meu esplendor
  rationale: תפארת pode designar esplendor, glória ou beleza; «esplendor» preserva a ideia de honra majestosa sem restringir o campo semântico.
theological_decisions:
- issue: Sentido de «minha justiça» em paralelo com «minha salvação»
  choice: Manter «minha justiça» como termo amplo, intimamente ligado à ação salvadora de Deus.
  alternative: «minha retidão» ou «minha vindicação»
  rationale: Em Isaías, a justiça divina pode abranger fidelidade, juízo e intervenção salvadora. Não se reduz o termo a um atributo moral nem apenas a uma vindicação forense.
- issue: Relação sintática entre salvação, Sião, Israel e o esplendor de Deus
  choice: «Porei a salvação em Sião e farei de Israel o meu esplendor.»
  alternative: «Porei em Sião a salvação, para Israel o meu esplendor» ou «Porei a salvação em Sião, minha glória para Israel»
  rationale: 'O hebraico final é comprimido: וְנָתַתִּי בְצִיּוֹן תְּשׁוּעָה לְיִשְׂרָאֵל תִּפְאַרְתִּי. A tradução adotada entende «Israel» como o referente associado a «meu esplendor», leitura apoiada pela ordem das palavras e pelo paralelismo, mas a nota conserva a alternativa lexical «glória».'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém a repetição de «salvação» e emprega «Sião», forma bíblica portuguesa estabelecida. Os marcadores [a] e [b] aparecem no texto principal.
