revisions:
- from: Eu trouxe para perto a minha justiça[a]; ela não está longe, e a minha salvação não demorará. Porei a salvação em Sião e farei de Israel o meu esplendor[b].
  to: Aproximei a minha justiça[a]; ela não está longe, e a minha salvação não demorará. Porei em Sião salvação, para Israel o meu esplendor[b].
  rationale: 'A revisão substitui a paráfrase interpretativa «farei de Israel o meu esplendor» por uma formulação elíptica que acompanha a construção nominal concisa do hebraico: Deus põe salvação em Sião e enuncia «para Israel o meu esplendor», sem decidir além do necessário se o esplendor é dado, manifestado ou associado a Israel. Também torna a primeira oração mais idiomática em português.'
