  yaml_path: translation/ot/isaiah/046/011.yaml
  text: calling from the east a bird of prey[a], from a distant land the man of my purpose. Indeed, I have spoken; indeed, I will bring it to pass. I have formed it; indeed[b], I will do it.
translation:
  language: pt
  text: que chama do leste uma ave de rapina, de uma terra distante o homem do meu propósito.[a] Sim, eu falei e certamente farei acontecer; eu o formei e certamente o realizarei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem do meu conselho”.'
    reason: lexical_alternative
  - marker: b
    text: No contexto mais amplo, a figura chamada do leste é muitas vezes identificada como Ciro, mas ele não é nomeado neste versículo.
    reason: cross_reference
lexical_decisions:
- source_word: קֹרֵא
  choice: que chama
  rationale: O particípio qal masculino singular descreve Deus e dá continuidade à autodescrição do versículo anterior. A oração relativa soa natural em português sem perder seu valor verbal.
- source_word: מִמִּזְרָח
  choice: do leste
  rationale: מִזְרָח designa o leste, literalmente a direção do nascer do sol. “Do leste” é claro e geograficamente adequado.
- source_word: עַיִט
  choice: uma ave de rapina
  rationale: O substantivo indica genericamente uma ave predadora, sem especificar uma espécie como águia.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: de uma terra distante
  rationale: Reproduz de modo natural a ideia hebraica de distância geográfica.
- source_word: אִישׁ עֲצָתוֹ
  choice: o homem do meu propósito
  rationale: No contexto, עֵצָה expressa o plano ou propósito de Deus. A formulação preserva a concisão e não acrescenta explicitamente a ideia de execução, embora ela esteja implícita.
- source_word: אַף
  choice: sim / certamente
  rationale: Nas ocorrências repetidas, אַף tem força enfática e confirmatória. A variação idiomática evita rigidez em português e conserva a ênfase crescente.
- source_word: דִּבַּרְתִּי
  choice: eu falei
  rationale: O perfeito hebraico apresenta a declaração divina como concluída; o pretérito perfeito é a forma direta e natural em português.
- source_word: אֲבִיאֶנָּה
  choice: farei que aconteça
  rationale: A forma causativa com sufixo feminino aponta mais naturalmente para o propósito ou acontecimento anunciado. A expressão comunica seu cumprimento sem vinculá-la ao homem mencionado.
- source_word: יָצַרְתִּי
  choice: eu o formei
  rationale: Preserva a imagem concreta de יָצַר, “formar, moldar”, e mantém a intencionalidade divina.
- source_word: אֶעֱשֶׂנָּה
  choice: o realizarei
  rationale: Neste contexto, עשה se refere à execução do plano anunciado. “Realizarei” é natural em português e mantém a conclusão enfática.
theological_decisions:
- issue: Identidade da ave de rapina / do homem do propósito divino
  choice: Manter a imagem e não identificar a pessoa no texto principal.
  alternative: Identificá-la explicitamente como Ciro.
  rationale: O contexto mais amplo costuma ser entendido como referência a Ciro, mas este versículo não o nomeia. A tradução não deve transformar uma identificação contextual em informação explícita do hebraico.
- issue: Sentido de אִישׁ עֲצָתוֹ
  choice: “o homem do meu propósito”
  alternative: “o homem do meu conselho” ou “o homem que executa meu plano”
  rationale: “Propósito” comunica a intenção ou plano divino em português corrente, enquanto “conselho” pode sugerir uma reunião consultiva e “que executa” explicitaria uma função apenas implícita.
- issue: Referente dos sufixos femininos em אֲבִיאֶנָּה e אֶעֱשֶׂנָּה
  choice: Entendê-los como referência ao propósito ou acontecimento anunciado.
  alternative: Entendê-los como referência ao homem chamado de longe.
  rationale: Os sufixos são femininos, ao passo que “homem” é masculino. O referente mais provável é uma realidade feminina implícita, como a decisão, palavra ou obra de Deus.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. Conserva o paralelismo profético, a metáfora da ave de rapina e a repetição enfática, evitando identificar no texto principal a figura histórica não nomeada no versículo.
