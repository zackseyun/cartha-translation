  text: To whom will you liken me and make me equal[a], and compare me, that we may be alike?
translation:
  language: pt
  text: A quem vocês me compararão, me igualarão e me equipararão[a], para que sejamos semelhantes?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “A quem vocês me assemelharão, me tornarão igual e me compararão, para que sejamos semelhantes?” O hebraico acumula vários verbos de sentido próximo para intensificar o desafio retórico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִי
  choice: A quem
  rationale: A preposição לְ com o interrogativo מִי introduz o termo da comparação; a posição inicial conserva a força do desafio retórico.
- source_word: תְדַמְיוּנִי
  choice: vocês me compararão
  rationale: O piel de דמה significa comparar ou tornar semelhante. “Compararão” é natural em português e mantém explícito o sufixo de primeira pessoa, “me”.
- source_word: וְתַשְׁווּ
  choice: e me igualarão
  rationale: O hifil de שוה expressa pôr no mesmo nível ou considerar igual. O objeto “me”, implícito pela estrutura paralela, foi explicitado em português.
- source_word: וְתַמְשִׁלוּנִי
  choice: Com quem me confrontarão
  rationale: O hifil de משל aqui significa comparar ou equiparar. “Confrontar” no sentido de pôr lado a lado para comparação preserva a acumulação de verbos próximos sem repetição pesada; “com quem” explicita naturalmente o complemento elíptico.
- source_word: וְנִדְמֶה
  choice: para que sejamos semelhantes
  rationale: A forma de primeira pessoa do plural inclui Deus e o suposto termo de comparação. “Para que” comunica o resultado pretendido ou alegado, sem eliminar a nuance volitiva da forma hebraica.
theological_decisions:
- issue: Polêmica contra a idolatria
  choice: Manter a sequência acumulativa de verbos de comparação.
  alternative: Reduzir a pergunta a um único verbo de comparação para maior fluidez.
  rationale: A sucessão de quase sinônimos intensifica o desafio retórico contra qualquer tentativa de equiparar Deus a outro ser ou objeto; conservá-la reproduz a ênfase sem acrescentar formulações doutrinárias.
- issue: Primeira pessoa do plural em וְנִדְמֶה
  choice: “para que sejamos semelhantes”
  alternative: “que se assemelhe a mim”
  rationale: A tradução mantém o “nós” gramatical do hebraico e, portanto, a tensão retórica entre Deus e aquele ou aquilo a que seria comparado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A formulação preserva o paralelismo e a acumulação retórica do hebraico. O marcador [a] aparece no texto principal.
