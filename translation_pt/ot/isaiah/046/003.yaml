  text: שִׁמְע֤וּ אֵלַ/י֙ בֵּ֣ית יַעֲקֹ֔ב וְ/כָל שְׁאֵרִ֖ית בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/עֲמֻסִים֙ מִנִּי בֶ֔טֶן הַ/נְּשֻׂאִ֖ים מִנִּי רָֽחַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/003.yaml
  text: Listen to me[a], house of Jacob, and all the remnant of the house of Israel, who have been borne by me from birth, carried from the womb.
translation:
  language: pt
  text: “Ouçam-me, casa de Jacó e todo o remanescente da casa de Israel, vocês que são carregados por mim desde o ventre[a] e levados por mim desde o útero.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega duas expressões relacionadas, “desde o ventre” e “desde o útero”, formando um paralelismo poético sobre o cuidado de Deus desde o início da vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Escutem-me
  rationale: O imperativo plural convoca os destinatários a prestar atenção. “Escutem-me” é natural no português atual e conserva tanto a ordem quanto o objeto da atenção.
- source_word: בֵּית יַעֲקֹב
  choice: casa de Jacó
  rationale: Mantém a expressão coletiva tradicional do hebraico para o povo descendente de Jacó, sem a substituir por uma paráfrase interpretativa.
- source_word: וְכָל שְׁאֵרִית בֵּית יִשְׂרָאֵל
  choice: e todo o remanescente da casa de Israel
  rationale: “Remanescente” preserva um termo profético importante em Isaías e sua continuidade literária e teológica.
- source_word: הַעֲמֻסִים
  choice: que são sustentados
  rationale: O particípio passivo descreve o povo como aquele que suporta a ação de ser levado. “Sustentados” comunica o cuidado contínuo de Deus e permite distinguir este verbo do particípio paralelo seguinte.
- source_word: מִנִּי בֶטֶן
  choice: desde o ventre
  rationale: 'A forma poética מִנִּי funciona aqui com valor de origem temporal: desde o início da vida no ventre. “Ventre” conserva a imagem corporal e a distingue de רָחַם.'
- source_word: הַנְּשֻׂאִים
  choice: carregados
  rationale: O particípio passivo de נשׂא mantém a imagem concreta de alguém levado ou carregado, central ao contraste contextual entre Deus, que carrega seu povo, e os ídolos, que precisam ser carregados.
- source_word: מִנִּי רָחַם
  choice: desde o útero
  rationale: “Útero” representa o termo anatômico רָחַם e preserva a variação lexical do paralelismo hebraico sem perder clareza.
theological_decisions:
- issue: Terminologia profética do remanescente
  choice: remanescente
  alternative: os que restaram
  rationale: A opção mantém a ressonância literária de שְׁאֵרִית em Isaías sem acrescentar conteúdo doutrinário.
- issue: Agente dos particípios passivos
  choice: são sustentados ... e carregados
  alternative: são sustentados por mim ... e carregados por mim
  rationale: O contexto identifica Deus como aquele que sustenta e carrega, mas a construção hebraica não explicita o agente em cada particípio; a forma passiva preserva essa concisão e evita inserir uma repetição ausente, sem ocultar o contraste contextual.
- issue: Relação entre os dois particípios
  choice: sustentados ... e carregados
  alternative: carregados ... e levados
  rationale: A tradução conserva o paralelismo e diferencia os verbos, ao mesmo tempo que mantém a ideia comum do cuidado divino desde o começo da vida.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. O vocativo coletivo foi preservado, e “vocês” torna explícita de modo natural a ligação entre os destinatários e os particípios seguintes.
