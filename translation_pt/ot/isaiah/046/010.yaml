  text: מַגִּ֤יד מֵֽ/רֵאשִׁית֙ אַחֲרִ֔ית וּ/מִ/קֶּ֖דֶם אֲשֶׁ֣ר לֹא נַעֲשׂ֑וּ אֹמֵר֙ עֲצָתִ֣/י תָק֔וּם וְ/כָל חֶפְצִ֖/י אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/010.yaml
  text: declaring the end from the beginning[a], and from ancient times things that have not been done, saying, ‘My purpose shall stand[c][b], and I will accomplish all my good pleasure.’
translation:
  language: pt
  text: 'que anuncia desde o princípio o fim e, desde os tempos antigos, as coisas que ainda não aconteceram[a]; que diz: “Meu propósito[b] permanecerá de pé, e realizarei tudo o que desejo[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as coisas que não foram feitas”. Também pode ser traduzido por “as coisas ainda não realizadas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Meu conselho” ou “Meu plano”.
    reason: lexical_alternative
  - marker: c
    text: Ou “tudo o que me agrada”, “todo o meu prazer” ou “toda a minha vontade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: que anuncia
  rationale: O particípio hifil de נגד expressa tornar conhecido ou anunciar. A construção relativa mantém a ligação com a autoapresentação de Deus no contexto anterior e soa natural em português.
- source_word: מֵרֵאשִׁית
  choice: desde o princípio
  rationale: רֵאשִׁית indica o começo ou ponto inicial; “desde o princípio” preserva o contraste temporal com “o fim”.
- source_word: אַחֲרִית
  choice: o fim
  rationale: Embora também possa significar “resultado” ou “desfecho”, o contraste direto com רֵאשִׁית favorece “o fim”.
- source_word: וּמִקֶּדֶם
  choice: e, desde os tempos antigos
  rationale: No uso temporal, קֶדֶם designa a antiguidade ou um passado remoto. A expressão conserva o paralelismo sem sugerir apenas anterioridade imediata.
- source_word: אֲשֶׁר לֹא נַעֲשׂוּ
  choice: as coisas que ainda não aconteceram
  rationale: A forma nifal de עשה significa literalmente “que não foram feitas”, mas, neste contexto profético, refere-se naturalmente a acontecimentos ainda não realizados. A nota preserva a formulação literal.
- source_word: אֹמֵר
  choice: que diz
  rationale: O particípio continua a descrição de Deus. A oração relativa é mais fluente em português do que um gerúndio solto e mantém a relação sintática.
- source_word: עֲצָתִי
  choice: Meu propósito
  rationale: עֵצָה pode denotar conselho, plano ou propósito. Aqui se refere à intenção divina que será efetivada; “propósito” comunica isso sem reduzir o termo a mero conselho dado a alguém.
- source_word: תָקוּם
  choice: permanecerá de pé
  rationale: קום expressa aqui firmeza, validade e permanência. A tradução conserva a metáfora hebraica e é inteligível em português corrente.
- source_word: וְכָל חֶפְצִי
  choice: tudo o que desejo
  rationale: חֵפֶץ abrange desejo, agrado, prazer ou vontade. A expressão escolhida é natural e preserva a dimensão volitiva sem acrescentar o qualificativo não expresso “bom”.
- source_word: אֶעֱשֶׂה
  choice: realizarei
  rationale: עשה significa fazer ou executar; no contexto da concretização do propósito divino, “realizarei” transmite adequadamente a ação levada a efeito.
theological_decisions:
- issue: A relação entre o conhecimento declarado por Deus e a realização de sua intenção
  choice: “Meu propósito permanecerá de pé, e realizarei tudo o que desejo”
  alternative: “Meu conselho subsistirá, e farei toda a minha vontade”
  rationale: A formulação mantém a afirmação forte de que a intenção divina permanece e é executada, sem desenvolver uma teoria sistemática específica sobre presciência, determinação ou causalidade além do que o hebraico declara.
- issue: Sentido volitivo de חֶפְצִי
  choice: “tudo o que desejo”
  alternative: “todo o meu prazer” ou “tudo o que me agrada”
  rationale: “Desejo” conserva a intenção e a volição presentes no termo, enquanto as alternativas legítimas são registradas em nota para não eliminar sua amplitude afetiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva o paralelismo temporal, a sequência participial e a metáfora de o propósito permanecer de pé. Evita o adjetivo “bom”, ausente do hebraico, e usa notas para preservar alternativas lexicais genuínas.
