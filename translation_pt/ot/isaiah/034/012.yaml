  text: חֹרֶ֥י/הָ וְ/אֵֽין שָׁ֖ם מְלוּכָ֣ה יִקְרָ֑אוּ וְ/כָל שָׂרֶ֖י/הָ יִ֥הְיוּ אָֽפֶס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/012.yaml
  text: They will call its nobles[a], but there will be no kingdom there, and all its princes will be nothing.
translation:
  language: pt
  text: Chamarão os seus nobres[a], mas ali não haverá reino, e todos os seus príncipes serão reduzidos a nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os seus nobres chamarão, mas ali não haverá reino”. O hebraico da primeira linha é difícil.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֹרֶיהָ
  choice: os seus nobres
  rationale: O termo designa provavelmente os membros livres da aristocracia. “Nobres” mantém o sentido sociopolítico e forma um paralelo natural com “príncipes”.
- source_word: וְאֵין שָׁם
  choice: mas ali não haverá
  rationale: A formulação preserva a negação enfática e o valor locativo; “mas” expressa naturalmente o contraste percebido no contexto.
- source_word: מְלוּכָה
  choice: reino
  rationale: O substantivo pode indicar realeza, governo régio ou reino. “Reino” é claro no contexto da destruição da ordem política de Edom.
- source_word: יִקְרָאוּ
  choice: chamarão
  rationale: Mantém o sentido básico e a forma finita do verbo קרא sem impor uma finalidade política específica, como proclamar ou convocar para reinar.
- source_word: שָׂרֶיהָ
  choice: seus príncipes
  rationale: “Príncipes” conserva o registro político elevado e o paralelismo com “nobres”.
- source_word: יִהְיוּ אָפֶס
  choice: serão reduzidos a nada
  rationale: Expressa de modo natural em português o resultado de inexistência ou nulidade indicado por אָפֶס, no contexto do colapso completo da liderança de Edom.
theological_decisions:
- issue: Sintaxe difícil da primeira linha
  choice: “Chamarão os seus nobres, mas ali não haverá reino”
  alternative: “Os seus nobres chamarão, mas ali não haverá reino”
  rationale: A ordem consonantal admite mais de uma relação sintática entre “seus nobres”, “chamarão” e “reino”. O texto principal segue a leitura em que os nobres são chamados e preserva a afirmação separada sobre a inexistência de reino; a nota registra a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção concisa mantém o tom profético e a ambiguidade genuína da primeira linha é explicitada em nota.
