base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/004.yaml
  text: All the host of heaven will rot away[a], and the skies will be rolled up like a scroll; all their host will wither like a leaf withers from the vine[e][d][c][b], and like a withered fig from the fig tree.
translation:
  language: pt
  text: Todo o exército dos céus se desfará[a], e os céus serão enrolados como um rolo[b]. Todo o seu exército murchará[c], como uma folha que cai da videira e como um figo que cai da figueira[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “definhará”, “se decomporá” ou “se dissolverá”. O verbo hebraico pode indicar definhamento, decomposição ou dissolução.
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, um documento escrito em forma de rolo. Também se pode traduzir: “os céus se enrolarão como um rolo”.'
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “todo o seu exército”, expressão que provavelmente se refere ao conjunto dos corpos celestes, especialmente às estrelas.'
    reason: lexical_alternative
  - marker: d
    text: 'A imagem hebraica pode enfatizar tanto o murchar quanto a queda resultante. Também se pode traduzir: “como uma folha que murcha na videira e como um figo que murcha na figueira”.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָמַקּוּ
  choice: se desfará
  rationale: O nifal de נמק pode expressar definhar, decompor-se ou dissolver-se. “Se desfará” conserva a imagem de desintegração no juízo cósmico e soa natural em português, sem limitar o sentido à putrefação orgânica.
- source_word: צְבָא הַשָּׁמַיִם
  choice: o exército dos céus
  rationale: Preserva a expressão hebraica e sua amplitude, que pode designar o conjunto ou a multidão dos corpos celestes, especialmente as estrelas, sem substituir a imagem por uma identificação exclusiva.
- source_word: וְנָגֹלּוּ כַסֵּפֶר הַשָּׁמָיִם
  choice: e os céus se enrolarão como um rolo
  rationale: גלל comunica o ato de enrolar, e סֵפֶר pode ser um documento em forma de rolo. A formulação mantém diretamente a comparação antiga e a imagem visual.
- source_word: וְכָל צְבָאָם
  choice: Todo o seu exército
  rationale: O sufixo plural remete naturalmente aos céus. A tradução preserva o vínculo gramatical e a repetição poética de צבא, sem explicitar “estrelas” no corpo do texto.
- source_word: יִבּוֹל
  choice: murchará
  rationale: נבל descreve o murchar ou definhar da vegetação e prepara as duas comparações agrícolas seguintes.
- source_word: כִּנְבֹל עָלֶה מִגֶּפֶן
  choice: como a folha murcha que cai da videira
  rationale: A formulação conserva tanto o murchar indicado pela raiz נבל quanto o afastamento da videira expresso por מן, em português corrente e poético.
- source_word: וּכְנֹבֶלֶת מִתְּאֵנָה
  choice: e como o figo murcho que cai da figueira
  rationale: O referente feminino está implícito junto a “figueira”; “figo” o torna claro em português. A redação mantém o paralelismo com a folha e a possibilidade de a imagem envolver murchar e cair.
theological_decisions:
- issue: Natureza da imagem cósmica
  choice: Apresentar diretamente a desintegração do exército celeste e o enrolar dos céus como linguagem profética de juízo cósmico.
  alternative: Reduzir a passagem a uma metáfora de queda política ou defini-la como descrição estritamente literal de fenômenos astronômicos.
  rationale: O hebraico emprega poesia profética elevada. A tradução mantém a força e a tensão da imagem sem decidir se ela é metafórica, literal ou reúne as duas dimensões.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A tradução conserva a repetição poética de “exército”, a escala cósmica e as imagens agrícolas, enquanto as notas esclarecem expressões antigas e ambiguidades lexicais genuínas.
