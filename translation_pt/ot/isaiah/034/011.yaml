  naturalness: O português é claro, moderno e de registro adequadamente solene. «Linha de medir», «pedras de prumo», «desolação» e «vazio» funcionam naturalmente no contexto poético-profético. A ligação da última oração melhora o fluxo e reproduz a progressão da frase hebraica.
  terminology: As escolhas para os animais mantêm prudentemente a incerteza zoológica nas notas. «Corvo» corresponde bem a עֹרֵב. A nota sobre tohu/bohu preserva de modo útil a alusão a Gênesis 1:2, sem transformar a alusão em interpretação doutrinária no texto principal.
