  text: וִ/ירֵשׁ֨וּ/הָ֙ קָאַ֣ת וְ/קִפּ֔וֹד וְ/יַנְשׁ֥וֹף וְ/עֹרֵ֖ב יִשְׁכְּנוּ בָ֑/הּ וְ/נָטָ֥ה עָלֶ֛י/הָ קַֽו תֹ֖הוּ וְ/אַבְנֵי בֹֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/011.yaml
  text: The desert owl and the hedgehog will possess her[a], and the owl and the raven will dwell in her[b]; he will stretch over her the measuring line of desolation and the plumb stones of emptiness.
translation:
  language: pt
  text: A coruja-do-deserto e o ouriço tomarão posse dela[a]; a coruja e o corvo habitarão nela, e ele estenderá sobre ela a linha de medir da desolação e as pedras de prumo do vazio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação dos animais mencionados aqui é incerta. “Coruja-do-deserto” também pode ser traduzido por “pelicano” ou “corvo-marinho”, e “ouriço”, por “porco-espinho” ou “abetouro”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “a linha de medir de tohu e as pedras de bohu”. A expressão ecoa Gênesis 1:2 (“sem forma e vazia”) e retrata a terra como reduzida a uma espécie de descriação.
    reason: cross_reference
lexical_decisions:
- source_word: וִירֵשׁוּהָ
  choice: tomarão posse dela
  rationale: ירשׁ pode significar possuir, herdar ou tomar posse. No contexto da terra arruinada ocupada por animais selvagens, “tomarão posse dela” comunica a ideia de ocupação sem sugerir herança legal.
- source_word: קָאַת
  choice: coruja-do-deserto
  rationale: A identificação zoológica é incerta. Esta opção é clara e adequada ao cenário de desolação, enquanto as alternativas são registradas em nota.
- source_word: קִפּוֹד
  choice: ouriço
  rationale: O termo designa um animal de identificação discutida. “Ouriço” é uma tradução tradicional e compreensível, sem ocultar a incerteza indicada em nota.
- source_word: יַנְשׁוֹף
  choice: coruja
  rationale: O termo é geralmente entendido como uma ave noturna, provavelmente algum tipo de coruja. A designação genérica evita precisão zoológica indevida.
- source_word: עֹרֵב
  choice: corvo
  rationale: Equivalente português corrente para עֹרֵב e apropriado à imagem bíblica de lugares devastados.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: habitarão nela
  rationale: שׁכן expressa habitar ou estabelecer-se. “Habitarão” mantém o tom solene e sugere permanência nas ruínas.
- source_word: וְנָטָה עָלֶיהָ
  choice: Ele estenderá sobre ela
  rationale: נטה descreve o ato de estender uma linha. O sujeito não está expresso no hebraico; o contexto aponta para Deus como agente do juízo, preservado pelo pronome sem explicitação adicional.
- source_word: קַו תֹהוּ
  choice: a linha de medir da desolação
  rationale: קַו é uma linha ou cordel de medição, e תֹהוּ denota desolação, caos ou ausência de forma. A formulação conserva a metáfora de medição e se ajusta ao contexto de juízo.
- source_word: וְאַבְנֵי בֹהוּ
  choice: e as pedras de prumo do vazio
  rationale: Em paralelismo com a linha de medir, as “pedras” são entendidas como pesos de prumo. בֹהוּ significa vazio ou vacuidade e, junto de תֹהוּ, ecoa Gênesis 1:2.
theological_decisions:
- issue: Alusão à linguagem da criação em תֹהוּ e בֹהוּ
  choice: Empregar “desolação” e “vazio” no texto e explicitar em nota o eco de Gênesis 1:2.
  alternative: Traduzir no texto principal por “caos” e “vacuidade” ou reproduzir uma fórmula fixa como “sem forma e vazia”.
  rationale: A expressão retrata o território julgado como reduzido a uma condição de descriação. A tradução escolhida mantém o sentido imediato e natural em português, enquanto a nota preserva a importante tensão intertextual sem impor uma interpretação além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O feminino em “dela”, “nela” e “ela” preserva a referência hebraica ao território personificado. A construção técnica “pedras de prumo” mantém a imagem de medição judicial sem substituir a metáfora por uma explicação.
