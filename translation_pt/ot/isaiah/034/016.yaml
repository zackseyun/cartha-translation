source:
  edition: WLC
  text: דִּרְשׁ֨וּ מֵֽ/עַל סֵ֤פֶר יְהוָה֙ וּֽ/קְרָ֔אוּ אַחַ֤ת מֵ/הֵ֨נָּה֙ לֹ֣א נֶעְדָּ֔רָה אִשָּׁ֥ה רְעוּתָ֖/הּ לֹ֣א פָקָ֑דוּ כִּֽי פִ/י֙ ה֣וּא צִוָּ֔ה וְ/רוּח֖/וֹ ה֥וּא קִבְּצָֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/016.yaml
  text: 'Search in the book of Yahweh and read: not one of these will be missing[a]; none will lack her mate. For his mouth has commanded[b], and his Spirit has gathered them.'
translation:
  language: pt
  text: 'Procurem no livro de Yahweh e leiam: nenhuma delas faltará; nenhuma ficará sem sua companheira. Pois a minha boca deu a ordem[a], e o seu Espírito[b] as reuniu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico literalmente: “a minha boca, ela ordenou”. Alguns traduzem em terceira pessoa: “a boca dele deu a ordem”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou “seu sopro”; também é possível: “seu vento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ מֵעַל סֵפֶר יְהוָה
  choice: Procurem no livro de Yahweh
  rationale: O imperativo plural de דרשׁ, neste contexto, convida os ouvintes a examinar ou consultar o registro escrito. “Procurem no livro” é natural em português e expressa investigação ativa; o nome divino é transliterado como “Yahweh”.
- source_word: וּקְרָאוּ
  choice: e leiam
  rationale: Embora קרא também possa significar “chamar” ou “proclamar”, a referência imediata a um livro favorece o sentido de ler, possivelmente em voz alta.
- source_word: אַחַת מֵהֵנָּה לֹא נֶעְדָּרָה
  choice: nenhuma delas faltará
  rationale: A expressão feminina singular tem força distributiva e retoma as criaturas mencionadas no contexto. O futuro comunica em português a certeza profética do anúncio.
- source_word: אִשָּׁה רְעוּתָהּ לֹא פָקָדוּ
  choice: nenhuma ficará sem sua companheira
  rationale: A construção feminina distributiva e רְעוּתָהּ destacam que cada criatura terá sua correspondente. “Companheira” preserva o gênero e evita tornar a relação mais especificamente reprodutiva do que o hebraico exige.
- source_word: כִּי פִי הוּא צִוָּה
  choice: Pois a minha boca deu a ordem
  rationale: פִי é literalmente “minha boca”. A tradução mantém a primeira pessoa do texto massorético e conserva, em vez de eliminar, a mudança subsequente para a terceira pessoa.
- source_word: וְרוּחוֹ
  choice: e o seu Espírito
  rationale: רוּחַ pode significar “espírito”, “sopro” ou “vento”. No paralelismo com a ordem divina e com a ação de reunir, “Espírito” comunica adequadamente a agência divina, enquanto as alternativas lexicais são registradas em nota.
- source_word: קִבְּצָן
  choice: as reuniu
  rationale: O verbo קבץ significa reunir ou ajuntar, e o sufixo pronominal retoma as criaturas. O perfeito hebraico apresenta a ação como certa ou realizada.
theological_decisions:
- issue: Mudança de pessoa na descrição da ação divina
  choice: “a minha boca deu a ordem, e o seu Espírito as reuniu”
  alternative: “a boca dele deu a ordem, e o seu Espírito as reuniu”
  rationale: O hebraico traz literalmente “minha boca” e logo depois “seu Espírito”. A tradução principal preserva essa tensão gramatical e discursiva, sem harmonizá-la silenciosamente; a leitura coerente em terceira pessoa é indicada em nota.
- issue: Sentido de רוּחַ na cláusula final
  choice: Espírito
  alternative: sopro ou vento
  rationale: “Espírito” preserva a possibilidade de agência divina pessoal no contexto, mas a amplitude semântica do termo hebraico permanece explícita em nota, sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantém-se “Yahweh” conforme a camada de consulta fornecida. A formulação preserva a mudança de primeira para terceira pessoa presente no hebraico, e todos os marcadores de nota aparecem no texto principal.
