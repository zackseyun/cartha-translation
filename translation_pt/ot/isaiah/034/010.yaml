source:
  edition: WLC
  text: לַ֤יְלָה וְ/יוֹמָם֙ לֹ֣א תִכְבֶּ֔ה לְ/עוֹלָ֖ם יַעֲלֶ֣ה עֲשָׁנָ֑/הּ מִ/דּ֤וֹר לָ/דוֹר֙ תֶּחֱרָ֔ב לְ/נֵ֣צַח נְצָחִ֔ים אֵ֥ין עֹבֵ֖ר בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/010.yaml
  text: Night and day it shall not be quenched; its smoke shall go up forever[a]. From generation to generation it shall lie waste; forever and ever no one shall pass through it.
translation:
  language: pt
  text: Noite e dia, não se apagará; sua fumaça subirá para sempre. De geração em geração, ficará devastada[a]; para todo o sempre, ninguém passará por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará desolada”.'
    reason: O verbo hebraico pode indicar tanto ser devastado quanto tornar-se desolado.
lexical_decisions:
- source_word: לַיְלָה וְיוֹמָם
  choice: Noite e dia
  rationale: Preserva o merismo hebraico que expressa continuidade e soa natural em português.
- source_word: לֹא תִכְבֶּה
  choice: não se apagará
  rationale: O verbo כבה, aplicado ao fogo, indica que ele não se extinguirá. A forma pronominal é corrente e mantém o sujeito implícito do contexto.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Mantém diretamente a linguagem enfática de duração do oráculo.
- source_word: יַעֲלֶה עֲשָׁנָהּ
  choice: sua fumaça subirá
  rationale: Reproduz de modo natural a expressão hebraica para a ascensão da fumaça, sem personificação desnecessária.
- source_word: מִדּוֹר לָדוֹר
  choice: De geração em geração
  rationale: Equivalente idiomático e formalmente próximo da expressão hebraica de continuidade entre gerações.
- source_word: תֶּחֱרָב
  choice: ficará devastada
  rationale: O verbo חרב descreve o estado resultante de devastação ou desolação. A escolha é clara e se harmoniza com a ausência de viajantes na oração seguinte.
- source_word: לְנֵצַח נְצָחִים
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente que transmite a intensificação da duração no hebraico.
- source_word: אֵין עֹבֵר בָּהּ
  choice: ninguém passará por ela
  rationale: Expressa naturalmente a ausência completa de quem atravesse a terra, com o valor prospectivo exigido pelo contexto.
theological_decisions:
- issue: Linguagem de duração no oráculo de juízo
  choice: Traduzir os termos repetidos de duração como “para sempre” e “para todo o sempre”.
  alternative: Atenuar a duração com formulações como “por eras” ou “por muito tempo”.
  rationale: O hebraico acumula עוֹלָם e נֵצַח נְצָחִים para comunicar perpetuidade enfática. A tradução preserva essa força retórica sem decidir antecipadamente como ela deve ser sistematizada teologicamente.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem “Noite e dia” e o paralelismo temporal preservam a cadência profética; evitou-se vocabulário arcaico.
