  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חֶ֣רֶב לַ/יהוָ֞ה מָלְאָ֥ה דָם֙ הֻדַּ֣שְׁנָה מֵ/חֵ֔לֶב מִ/דַּ֤ם כָּרִים֙ וְ/עַתּוּדִ֔ים מֵ/חֵ֖לֶב כִּלְי֣וֹת אֵילִ֑ים כִּ֣י זֶ֤בַח לַֽ/יהוָה֙ בְּ/בָצְרָ֔ה וְ/טֶ֥בַח גָּד֖וֹל בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/006.yaml
  text: The sword of Yahweh is filled with blood[a]; it is made fat with fat, with the blood of lambs and goats, with the fat of the kidneys of rams. For Yahweh has a sacrifice in Bozrah[b], and a great slaughter in the land of Edom.
translation:
  language: pt
  text: A espada de Yahweh está cheia de sangue; está impregnada de gordura, do sangue de cordeiros e bodes[a], da gordura dos rins de carneiros. Pois Yahweh tem um sacrifício em Bozra[b] e uma grande matança na terra de Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “bodes” designa especificamente machos caprinos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pois há um sacrifício para Yahweh em Bozra”. A oração hebraica não tem verbo expresso e pode ser entendida das duas maneiras.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב לַיהוָה
  choice: A espada de Yahweh
  rationale: Mantém a imagem concreta da espada como instrumento pertencente a Yahweh; o lamed indica aqui relação ou posse.
- source_word: מָלְאָה דָם
  choice: está cheia de sangue
  rationale: Reproduz o estado resultante expresso pelo perfeito e conserva a força vívida da imagem.
- source_word: הֻדַּשְׁנָה מֵחֵלֶב
  choice: está impregnada de gordura
  rationale: Expressa naturalmente em português o passivo e a imagem sacrificial de uma espada coberta ou saturada de gordura, sem reduzir a linguagem a uma descrição genérica de batalha.
- source_word: מִדַּם כָּרִים וְעַתּוּדִים
  choice: do sangue de cordeiros e bodes
  rationale: Conserva o catálogo de animais sacrificiais; 'bodes' explicita naturalmente em português que עַתּוּדִים designa machos.
- source_word: מֵחֵלֶב כִּלְיוֹת אֵילִים
  choice: da gordura dos rins de carneiros
  rationale: Preserva a referência anatômica explícita e a terminologia própria dos sacrifícios.
- source_word: כִּי זֶבַח לַיהוָה
  choice: Pois Yahweh tem um sacrifício
  rationale: Supre de maneira idiomática o verbo ausente na oração nominal hebraica, sem esconder na nota a construção alternativa possível.
- source_word: בְּבָצְרָה
  choice: em Bozra
  rationale: Translitera o topônimo hebraico de forma clara e corrente em português.
- source_word: טֶבַח גָּדוֹל
  choice: uma grande matança
  rationale: Mantém a intensidade brutal do substantivo e sua relação deliberada com a imagem sacrificial.
theological_decisions:
- issue: Linguagem sacrificial aplicada ao juízo contra Edom
  choice: Manter explicitamente 'gordura', 'rins', 'sacrifício' e 'matança'.
  alternative: Converter a passagem em linguagem genérica de guerra ou batalha.
  rationale: O texto apresenta intencionalmente o juízo de Yahweh por meio de imagens sacrificiais; suavizá-las apagaria a tensão teológica e poética.
- issue: Construção nominal זֶבַח לַיהוָה
  choice: Yahweh tem um sacrifício
  alternative: há um sacrifício para Yahweh
  rationale: As duas análises são possíveis porque não há verbo expresso. A leitura principal é natural no contexto, e a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo e a aspereza das imagens de guerra e sacrifício, evitando tanto arcaísmos quanto suavizações interpretativas.
