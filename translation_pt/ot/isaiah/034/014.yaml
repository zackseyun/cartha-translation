revisions:
- from: As criaturas do deserto se encontrarão com as hienas[a], e o demônio-bode chamará o seu companheiro. Sim, ali Lilite[b] se acomodará e encontrará para si um lugar de descanso.
  to: As criaturas do deserto se encontrarão com as hienas[a], e os demônios-bode chamarão uns aos outros. Sim, ali Lilite[b] se instalará e encontrará para si um lugar de descanso.
  rationale: A revisão torna explícito em português o valor coletivo de שָׂעִיר e da ação de chamar, sem introduzir uma identificação individual inexistente no texto. “Se instalará” transmite com maior precisão a ideia de Lilite chegar a um lugar de repouso. As notas preservam as incertezas lexicais relevantes.
