  text: וּ/פָגְשׁ֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/שָׂעִ֖יר עַל רֵעֵ֣/הוּ יִקְרָ֑א אַךְ שָׁם֙ הִרְגִּ֣יעָה לִּילִ֔ית וּ/מָצְאָ֥ה לָ֖/הּ מָנֽוֹחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/014.yaml
  text: And desert creatures will meet with hyenas[a], and the goat-demon will call to its fellow; indeed[b], there Lilith will settle down and find a resting place for herself.
translation:
  language: pt
  text: As criaturas do deserto se encontrarão com as hienas[a], e os demônios-bode chamarão uns aos outros. Sim, ali Lilite[b] se instalará e encontrará para si um lugar de descanso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chacais”; a identificação do animal no hebraico é incerta.
    reason: lexical_alternative
  - marker: b
    text: “Lilite” também pode ser traduzido como “criatura noturna” ou “monstro noturno”; algumas traduções antigas trazem “coruja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים
  choice: criaturas do deserto
  rationale: O termo designa seres associados a regiões áridas e ruínas desoladas, sem identificar necessariamente uma espécie específica.
- source_word: אִיִּים
  choice: hienas
  rationale: A identificação zoológica é incerta; “hienas” é uma proposta moderna plausível que combina com a imagem de animais necrófagos do deserto. A alternativa é registrada em nota.
- source_word: שָׂעִיר
  choice: demônio-bode
  rationale: Neste cenário de desolação habitado por seres inquietantes, o termo provavelmente tem sentido demoníaco, e não apenas o de “bode”; a tradução evita a associação greco-romana de “sátiro”.
- source_word: עַל רֵעֵהוּ יִקְרָא
  choice: chamará o seu companheiro
  rationale: Expressa um ser chamando outro semelhante ou associado a ele, sem especificar que seja seu parceiro sexual.
- source_word: אַךְ
  choice: sim
  rationale: A partícula enfatiza e confirma a declaração seguinte de maneira natural em português.
- source_word: הִרְגִּיעָה
  choice: se acomodará
  rationale: Comunica a ideia de se aquietar ou instalar-se, evitando repetição direta antes de “lugar de descanso”.
- source_word: לִּילִית
  choice: Lilite
  rationale: A transliteração adaptada ao português preserva a raridade, a ambiguidade e a possível ressonância mítica do termo, em vez de impor uma identificação zoológica.
- source_word: מָנוֹחַ
  choice: um lugar de descanso
  rationale: Representa tanto o descanso quanto o lugar concreto onde esse repouso é encontrado, em harmonia com a imagem de ocupação das ruínas.
theological_decisions:
- issue: Se os seres do deserto devem ser desmitologizados neste oráculo de juízo
  choice: Preservar a provável dimensão sobrenatural ou mítica em “demônio-bode” e “Lilite”.
  alternative: Traduzir ambos como animais ou aves comuns do deserto.
  rationale: A cena retrata deliberadamente uma terra devastada e inquietante. Preservar essa força reflete melhor o hebraico sem afirmar uma demonologia além do que o versículo diz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética e a atmosfera sombria do hebraico são preservadas, enquanto a sintaxe é ajustada para soar natural. Todos os termos raros ou incertos recebem tratamento transparente por meio de notas.
