    issue: “o demônio-bode chamará o seu companheiro” singulariza a cena
    rationale: O verbo יִקְרָא está no singular, mas funciona coletivamente após o sujeito coletivo/plural שָׂעִיר; no paralelismo, a ideia é que os seres caprinos chamam uns aos outros. O singular em português pode sugerir um único demônio específico chamando um único companheiro.
  - severity: low
    issue: “se acomodará” enfraquece levemente a imagem de fixar repouso
    rationale: הִרְגִּיעָה indica chegar ao repouso, assentar-se ou estabelecer-se. “Se instalará” conserva melhor essa imagem concreta e sombria, preparando “lugar de descanso”.
