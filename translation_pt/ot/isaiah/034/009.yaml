  text: וְ/נֶהֶפְכ֤וּ נְחָלֶ֨י/הָ֙ לְ/זֶ֔פֶת וַ/עֲפָרָ֖/הּ לְ/גָפְרִ֑ית וְ/הָיְתָ֣ה אַרְצָ֔/הּ לְ/זֶ֖פֶת בֹּעֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/009.yaml
  text: Her wadis will be turned into pitch[a], and her dust into sulfur[b]; her land will become burning pitch.
translation:
  language: pt
  text: Seus leitos de torrente[a] se transformarão em piche, e seu pó, em enxofre[b]; sua terra se tornará piche em chamas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus riachos”. O termo hebraico pode se referir a uádis, leitos de torrente ou cursos d’água.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “pedra de enxofre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶהֶפְכוּ
  choice: se transformarão
  rationale: O nifal perfeito de הפך, no discurso profético, expressa aqui uma transformação futura. A forma pronominal preserva o sentido passivo-resultativo com naturalidade em português.
- source_word: נְחָלֶיהָ
  choice: seus leitos de torrente
  rationale: נחל pode designar um uádi, leito de torrente ou curso d’água. No contexto árido de Edom, “leitos de torrente” comunica a realidade geográfica sem sugerir rios perenes; a alternativa mais simples consta em nota.
- source_word: זֶפֶת
  choice: piche
  rationale: זפת designa piche ou betume. “Piche” é corrente, concreto e preserva a imagem de uma substância escura e combustível.
- source_word: עֲפָרָהּ
  choice: seu pó
  rationale: עפר significa pó, terra seca ou solo solto. “Pó” conserva a imagem extrema de desolação e transformação da própria matéria da terra.
- source_word: גָפְרִית
  choice: enxofre
  rationale: גפרית corresponde a enxofre; esta é a designação moderna, clara e amplamente compreendida em português.
- source_word: אַרְצָהּ
  choice: sua terra
  rationale: ארץ refere-se aqui ao território da nação julgada. “Sua terra” é natural e contextualmente preciso.
- source_word: בֹּעֵרָה
  choice: em chamas
  rationale: O particípio qal descreve o piche ardendo. “Em chamas” produz uma formulação portuguesa vívida e natural sem ampliar a duração ou a intensidade.
theological_decisions:
- issue: Personificação da terra julgada pelos sufixos femininos
  choice: Manter a cadeia de possessivos por meio de “seus”, “seu” e “sua”, cujo referente contextual é a entidade feminina do versículo anterior
  alternative: Explicitar “dela” ou substituir a personificação por uma referência impessoal
  rationale: O hebraico repete sufixos de terceira pessoa feminina singular. Em português, os possessivos concordam com o objeto possuído, não com o possuidor; por isso, “seus/seu/sua” preserva a referência anafórica sem forçar uma marca feminina inexistente na gramática portuguesa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Leitos de torrente” evita o regionalismo menos conhecido “uádis”; “piche” é mais acessível que “betume”. Os marcadores de nota aparecem no texto principal.
