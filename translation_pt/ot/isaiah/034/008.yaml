source:
  edition: WLC
  text: כִּ֛י י֥וֹם נָקָ֖ם לַֽ/יהוָ֑ה שְׁנַ֥ת שִׁלּוּמִ֖ים לְ/רִ֥יב צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/008.yaml
  text: For Yahweh has a day of vengeance[a], a year of recompense for Zion’s cause.
translation:
  language: pt
  text: Pois Yahweh tem um dia de vingança, um ano de retribuição pela causa de Sião.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois há para Yahweh um dia de vingança, um ano de retribuição pelo pleito de Sião.”'
    reason: Preserva as alternativas sintáticas de לַיהוָה e o sentido explicitamente judicial possível de רִיב.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do juízo descrito no contexto anterior, de modo natural e explicativo em português.
- source_word: יוֹם נָקָם
  choice: um dia de vingança
  rationale: Mantém a expressão temporal e o sentido de punição retributiva do hebraico.
- source_word: לַיהוָה
  choice: Yahweh tem
  rationale: Expressa em português corrente o possível valor possessivo ou relacional da preposição ל, sem perder a associação do dia de vingança com Yahweh.
- source_word: שְׁנַת שִׁלּוּמִים
  choice: um ano de retribuição
  rationale: Preserva o paralelismo entre 'dia' e 'ano'; 'retribuição' comunica de forma atual a ideia de pagamento judicial devido.
- source_word: לְרִיב צִיּוֹן
  choice: pela causa de Sião
  rationale: רִיב pode designar disputa, pleito ou causa judicial; 'causa' conserva o matiz forense com clareza para leitores comuns.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome pactual presente no texto hebraico, em conformidade com a orientação editorial fornecida.
- issue: Sentido de לַיהוָה
  choice: 'valor possessivo/relacional: ''Yahweh tem um dia de vingança'''
  alternative: '''há um dia de vingança para Yahweh'' ou ''um dia de vingança pertence a Yahweh'''
  rationale: A construção hebraica admite mais de uma formulação. O texto principal usa português natural, enquanto a nota preserva a alternativa estrutural.
- issue: Valor forense de רִיב
  choice: causa
  alternative: pleito; processo; contenda
  rationale: '''Causa'' mantém a linguagem judicial sem determinar além do texto a forma exata da disputa.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético entre 'dia' e 'ano' foi mantido; 'vingança' e 'retribuição' conservam a força judicial do original.
