revisions:
- from: Ele mesmo lhes lançou a sorte, e sua mão a repartiu entre eles com o cordel de medir[a]. Eles a possuirão para sempre[b] e, de geração em geração, habitarão nela.
  to: Ele mesmo lhes lançou a sorte, e sua mão lhes repartiu a terra pela linha de medir[a]. Eles a possuirão para sempre[b] e, de geração em geração, habitarão nela.
  rationale: A revisão substitui «a repartiu entre eles» por «lhes repartiu a terra», para representar claramente a atribuição feita pelo agente divino. «A terra» explicita o antecedente já implicado no sufixo feminino e no contexto imediato, sem alterar a imagem ou introduzir uma identificação sectária. A expressão relativa à medição foi ajustada para que a nota [a] apresente uma alternativa efetiva.
