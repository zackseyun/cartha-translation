base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/017.yaml
  text: And he himself has cast the lot for them[a], and his hand has apportioned it to them by line; they will possess it forever[b]; from generation to generation they will dwell in it.
translation:
  language: pt
  text: Ele mesmo lhes lançou a sorte, e sua mão lhes repartiu a terra pela linha de medir[a]. Eles a possuirão para sempre[b] e, de geração em geração, habitarão nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: com o cordel de medir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: a herdarão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ele mesmo
  rationale: O pronome independente acrescenta ênfase ao agente divino; “Ele mesmo” preserva essa força.
- source_word: הִפִּיל לָהֶן גּוֹרָל
  choice: lhes lançou a sorte
  rationale: A construção causativa de נפל com גּוֹרָל é a expressão idiomática para lançar sortes. O pronome átono “lhes” evita impor em português um gênero que obscureceria a referência coletiva aos animais do contexto.
- source_word: וְיָדוֹ
  choice: e sua mão
  rationale: Mantém a imagem antropomórfica da ação direta de Deus na distribuição do território.
- source_word: חִלְּקַתָּה לָהֶם
  choice: a repartiu entre eles
  rationale: חלק indica repartir ou distribuir; o pronome “a” conserva o objeto feminino implícito, isto é, a terra, sem acrescentar o substantivo ao texto principal.
- source_word: בַּקָּו
  choice: com o cordel de medir
  rationale: קָו designa a linha ou cordel usado para medir terrenos; a formulação explicita naturalmente em português a imagem de demarcação.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Expressa de modo corrente e digno a duração permanente indicada pela locução hebraica.
- source_word: יִירָשׁוּהָ
  choice: Eles a possuirão
  rationale: ירשׁ pode significar herdar ou tomar posse. No contexto de distribuição territorial, “possuir” comunica claramente a ocupação duradoura, sem eliminar a alternativa “herdar”.
- source_word: לְדוֹר וָדוֹר
  choice: de geração em geração
  rationale: É a forma idiomática tradicional e ainda corrente para a continuidade através das gerações.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: habitarão nela
  rationale: שׁכן expressa habitação ou estabelecimento contínuo; “habitarão” preserva o tom solene e a referência feminina ao território.
theological_decisions:
- issue: Referência dos pronomes na imagem da distribuição territorial
  choice: Os pronomes permanecem sem substantivos explicativos, remetendo coletivamente às criaturas selvagens do contexto imediato e à terra que lhes é distribuída.
  alternative: Explicitar no versículo “os animais” e “a terra de Edom”.
  rationale: Isaías 34:11,13–15 apresenta animais e aves ocupando Edom, mas o hebraico deste versículo usa apenas pronomes. Mantê-los evita inserir identificações não expressas e conserva a alternância hebraica entre formas plurais femininas e masculinas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das orações e as imagens de lançar a sorte, medir e repartir foram preservadas. O uso de “lhes” acomoda naturalmente a variação de gênero dos pronomes hebraicos, enquanto “eles” funciona como plural coletivo no desenvolvimento do versículo.
