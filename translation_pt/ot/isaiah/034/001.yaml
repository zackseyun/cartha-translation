  text: קִרְב֤וּ גוֹיִם֙ לִ/שְׁמֹ֔עַ וּ/לְאֻמִּ֖ים הַקְשִׁ֑יבוּ תִּשְׁמַ֤ע הָ/אָ֨רֶץ֙ וּ/מְלֹאָ֔/הּ תֵּבֵ֖ל וְ/כָל צֶאֱצָאֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/001.yaml
  text: Come near[a], nations, to hear; and listen, peoples. Let the earth hear, and all that fills it[b], the world and all its offspring.
translation:
  language: pt
  text: Aproximem-se, nações, para ouvir; povos, prestem atenção. Que a terra escute, e tudo o que a enche; o mundo e tudo o que dele procede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os seus descendentes” ou “tudo o que ele produz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבוּ
  choice: Aproximem-se
  rationale: Preserva o imperativo plural e o sentido de achegar-se para ouvir uma proclamação.
- source_word: גוֹיִם
  choice: nações
  rationale: Designa amplamente as nações do mundo, sem introduzir o contraste posterior sugerido por “gentios”.
- source_word: לִשְׁמֹעַ
  choice: para ouvir
  rationale: Expressa a finalidade da aproximação e mantém a ligação verbal com תִּשְׁמַע na segunda metade.
- source_word: לְאֻמִּים
  choice: povos
  rationale: Mantém a variação poética em paralelo com “nações”.
- source_word: הַקְשִׁיבוּ
  choice: prestem atenção
  rationale: 'Comunica a força do imperativo hifil: ouvir de modo atento.'
- source_word: תִּשְׁמַע
  choice: Que ... escute
  rationale: Representa naturalmente em português o valor jussivo do imperfeito.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O contexto universal, reforçado por “mundo”, favorece “terra” em vez de “país”.
- source_word: מְלֹאָהּ
  choice: tudo o que a enche
  rationale: Preserva a imagem concreta da plenitude ou de todo o conteúdo da terra.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: Equivalente natural para o mundo habitado e ordenado.
- source_word: כָל צֶאֱצָאֶיהָ
  choice: tudo o que dele procede
  rationale: Conserva a ideia abrangente daquilo que sai ou nasce do mundo sem restringi-la apenas a descendentes humanos ou a produtos agrícolas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com paralelismo profético preservado. Empregou-se “prestem atenção” para distinguir הַקְשִׁיבוּ de שׁמע, traduzido por “ouvir/escutar”. O pronome em “dele” retoma “o mundo”.
