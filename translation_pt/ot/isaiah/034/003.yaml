base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/003.yaml
  text: Their slain will be thrown out[a], and the stench of their corpses will rise[c][b]; the mountains will melt from their blood.
translation:
  language: pt
  text: Seus mortos serão lançados fora[a], e o fedor dos seus cadáveres subirá[b]; os montes se derreterão por causa do sangue deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão atirados para fora”. O verbo hebraico pode ser traduzido por “lançar” ou “atirar”; o contexto também evoca a desonra de corpos deixados sem sepultura.
    reason: lexical_alternative
  - marker: b
    text: Ou “o fedor deles subirá”. O pronome se refere aos cadáveres.
    reason: lexical_alternative
  - marker: c
    text: 'Trata-se de linguagem profética hiperbólica de juízo: o derramamento de sangue é retratado como tão imenso que até os montes se derretem por causa dele.'
    reason: cultural_note
lexical_decisions:
- source_word: חַלְלֵיהֶם
  choice: os mortos deles
  rationale: O substantivo designa os mortos ou traspassados em combate. “Os mortos deles” é natural em português e mantém o contexto de mortandade, sem sugerir apenas feridos.
- source_word: יֻשְׁלָכוּ
  choice: serão lançados fora
  rationale: O passivo de שלך expressa lançar ou atirar. “Lançados fora” comunica tanto o descarte violento quanto a desonra de corpos deixados sem sepultura.
- source_word: פִגְרֵיהֶם
  choice: seus cadáveres
  rationale: פגר refere-se a um corpo morto. “Cadáveres” preserva a crueza da imagem e é claro no português atual.
- source_word: יַעֲלֶה בָאְשָׁם
  choice: o mau cheiro dos seus cadáveres subirá
  rationale: עלה significa subir, e באש designa odor ruim. A formulação portuguesa torna explícita a ligação do sufixo com os cadáveres e conserva o movimento ascendente da imagem.
- source_word: וְנָמַסּוּ
  choice: se derreterão
  rationale: מסס significa derreter ou dissolver. “Se derreterão” conserva a imagem profética vívida sem explicar ou atenuar seu caráter hiperbólico.
- source_word: הָרִים
  choice: os montes
  rationale: הרים designa montes ou montanhas. “Montes” é uma opção bíblica natural e amplamente compreensível, sem diminuir necessariamente a escala da cena.
- source_word: מִדָּמָם
  choice: com o sangue deles
  rationale: A preposição מן pode indicar origem ou causa. Neste contexto, “com o sangue deles” produz uma imagem natural em português, preservando a associação direta entre o derretimento dos montes e o sangue derramado.
theological_decisions:
- issue: Natureza da imagem do juízo divino
  choice: Manter a imagem gráfica e hiperbólica de cadáveres, mau cheiro, sangue e montes que se derretem.
  alternative: Explicar a última frase como “os montes ficarão encharcados” ou “serão lavados pelo sangue deles”.
  rationale: O hebraico emprega linguagem profética chocante e de escala cósmica. Preservar a metáfora mantém sua força e evita resolver silenciosamente a tensão da imagem.
- issue: Relação expressa pela preposição מִן em מִדָּמָם
  choice: “com o sangue deles”
  alternative: “por causa do sangue deles” ou “do sangue deles”
  rationale: A construção admite nuanças de fonte ou causa. A tradução escolhida mantém a ligação concreta e poética sem definir de modo excessivo o mecanismo da imagem.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça junto da expressão correspondente. O vocabulário preserva a crueza do hebraico sem arcaísmos desnecessários.
