  source_fidelity: O texto principal reproduz adequadamente a construção explicativa de כִּי, a indignação e a fúria de Yahweh contra as nações e suas forças, bem como a sequência de destinar sob ḥerem e entregar à matança. «Todo o exército delas» é uma tradução contextual defensável do coletivo צְבָאָם.
