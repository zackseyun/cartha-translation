  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י קֶ֤צֶף לַֽ/יהוָה֙ עַל כָּל הַ/גּוֹיִ֔ם וְ/חֵמָ֖ה עַל כָּל צְבָאָ֑/ם הֶחֱרִימָ֖/ם נְתָנָ֥/ם לַ/טָּֽבַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/002.yaml
  text: For Yahweh has indignation against all the nations[a], and wrath against all their host; he has devoted them to destruction[b]; he has given them over to the slaughter.
translation:
  language: pt
  text: Pois Yahweh está indignado contra todas as nações e furioso contra todo o exército delas; ele as destinou à destruição[a] e as entregou à matança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele as consagrou à destruição”. O verbo hebraico indica que foram destinadas à destruição sob o juízo divino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da convocação ao juízo no contexto anterior, com fluidez em português.
- source_word: קֶצֶף
  choice: está indignado
  rationale: Expressa ira divina de caráter judicial e permite distingui-la do termo mais intenso חֵמָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַל כָּל הַגּוֹיִם
  choice: contra todas as nações
  rationale: Com termos de ira, עַל tem sentido adversativo; גּוֹיִם designa aqui as nações em geral.
- source_word: וְחֵמָה
  choice: e furioso
  rationale: Comunica a intensidade da ira ardente e mantém distinção lexical em relação a קֶצֶף, de modo natural em português.
- source_word: עַל כָּל צְבָאָם
  choice: contra todo o exército delas
  rationale: צָבָא pode designar exército ou hoste; no contexto de juízo contra as nações, 'exército' é claro, natural e preserva o coletivo singular hebraico.
- source_word: הֶחֱרִימָם
  choice: ele as destinou à destruição
  rationale: 'Preserva a ideia do Hifil de חרם: entregar ou consagrar irrevogavelmente à destruição sob juízo divino, sem sugerir que a destruição já foi executada.'
- source_word: נְתָנָם לַטָּבַח
  choice: e as entregou à matança
  rationale: Reproduz o ato judicial de entregar alguém para ser morto e mantém a imagem forte do substantivo טֶבַח.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio divino; 'Yahweh' o representa diretamente, sem trocá-lo por um título.
- issue: Sentido judicial de הֶחֱרִימָם
  choice: ele as destinou à destruição
  alternative: ele as destruiu completamente; ele as colocou sob interdição
  rationale: A formulação conserva a noção de ḥerem, isto é, destinação irrevogável à destruição por juízo divino, mas evita a expressão pouco transparente 'sob interdição' e não antecipa a execução descrita na oração seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção nominal hebraica foi vertida por estados verbais naturais ('está indignado', 'furioso'). 'Exército' foi preferido a 'hoste' por ser mais corrente, sem perder o sentido militar contextual.
