base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/007.yaml
  text: Wild oxen will fall with them[a], and young bulls with the mighty ones; their land will be drenched with blood[b], and their dust made rich with fat.
translation:
  language: pt
  text: Os bois selvagens cairão com eles[a], e os novilhos, com os poderosos[b]; a terra deles ficará encharcada de sangue, e o seu pó será enriquecido com gordura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “órixes”. O hebraico רְאֵמִים designa grandes animais selvagens e fortes, provavelmente bovinos, mas a espécie exata é incerta.'
    reason: lexical_alternative
  - marker: b
    text: “Os poderosos” pode referir-se a guerreiros ou líderes influentes ou, dentro da imagem poética, a touros fortes; o hebraico permite ambas as nuances.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: cairão
  rationale: Embora o verbo signifique literalmente “descer”, no contexto de matança e juízo “cairão” expressa naturalmente a ideia de serem abatidos sem apagar a imagem hebraica.
- source_word: רְאֵמִים
  choice: bois selvagens
  rationale: A espécie exata é incerta; “bois selvagens” comunica animais bovinos grandes e fortes e evita a tradução tradicional, mas zoologicamente improvável, “unicórnios”.
- source_word: עִמָּם
  choice: com eles
  rationale: Mantém a referência pronominal do hebraico sem especificar indevidamente seu antecedente.
- source_word: וּפָרִים
  choice: novilhos
  rationale: פָּר designa com frequência um touro jovem; “novilhos” é corrente em português e se integra à imagem de sacrifício e matança.
- source_word: אַבִּירִים
  choice: os poderosos
  rationale: O termo pode indicar pessoas poderosas ou animais fortes. A escolha conserva a ambiguidade e o paralelismo poético.
- source_word: וְרִוְּתָה
  choice: ficará encharcada
  rationale: O verbo descreve ficar saturado ou beber até se fartar. Tendo “terra” por sujeito e “sangue” como substância, “ficará encharcada” oferece uma formulação natural e vívida.
- source_word: אַרְצָם
  choice: a terra deles
  rationale: Refere-se ao território dos que estão sob juízo e reproduz o pronome plural hebraico.
- source_word: מִדָּם
  choice: de sangue
  rationale: Depois de “encharcada”, a construção portuguesa idiomática usa “de” para indicar aquilo que satura a terra.
- source_word: וַעֲפָרָם
  choice: o seu pó
  rationale: Preserva a imagem concreta do hebraico e sua ressonância com a mortalidade e o juízo.
- source_word: מֵחֵלֶב
  choice: com gordura
  rationale: Indica a gordura das vítimas abatidas e forma uma construção portuguesa natural com “enriquecido”.
- source_word: יְדֻשָּׁן
  choice: será enriquecido
  rationale: O verbo significa tornar gordo, fértil ou rico. Aplicado ao pó, “será enriquecido” mantém a imagem sem recorrer a uma formulação portuguesa artificial.
theological_decisions:
- issue: Força literal ou metafórica das figuras de animais
  choice: Manter no texto os termos referentes a animais, permitindo ao mesmo tempo que representem figuradamente a queda dos poderosos no juízo divino.
  alternative: Entender todos os animais apenas como vítimas sacrificiais literais, ou interpretar todos eles exclusivamente como metáforas de governantes humanos.
  rationale: Isaías 34 combina imagens de sacrifício e de campo de batalha. O hebraico permite uma leitura em camadas; a tradução preserva essa tensão em vez de impor uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva o paralelismo poético; a elipse em “e os novilhos, com os poderosos” evita repetição pesada sem perder o sentido. Os marcadores [a] e [b] aparecem junto aos termos que explicam.
