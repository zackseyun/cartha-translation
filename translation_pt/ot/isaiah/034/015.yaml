base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/015.yaml
  text: There the arrow snake will nest and lay eggs[a], and hatch them, and gather them in her shadow; indeed, there the kites will gather[c][b], each with her mate.
translation:
  language: pt
  text: Ali a cobra-flecha fará seu ninho e porá ovos[a]; ela os fará eclodir e os reunirá à sua sombra[b]. Sim, ali os milhafres se reunirão[c], cada uma com sua companheira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico קִפּוֹז é incerto; também tem sido traduzido como “coruja” ou como outro animal do deserto.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e os chocará à sua sombra”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “abutres”; ou, de modo mais geral, “aves de rapina”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִפּוֹז
  choice: cobra-flecha
  rationale: O termo ocorre apenas aqui e sua identificação é muito incerta. A opção por um réptil combina com a sequência de ações — fazer ninho, pôr ovos e chocá-los — sem esconder a incerteza, registrada em nota.
- source_word: קִנְּנָה
  choice: fará seu ninho
  rationale: Expressa naturalmente em português o ato de se instalar e nidificar; o futuro acompanha a descrição profética da desolação vindoura.
- source_word: וַתְּמַלֵּט
  choice: e porá ovos
  rationale: O verbo denota dar à luz ou produzir descendência; no contexto de ninho e eclosão, pôr ovos transmite a imagem zoológica com clareza.
- source_word: וּבָקְעָה
  choice: ela os chocará
  rationale: O verbo significa literalmente romper ou abrir. Em relação a ovos, pode descrever sua eclosão; em português, 'chocará' mantém a sequência natural, embora possa também sugerir incubação.
- source_word: וְדָגְרָה בְצִלָּהּ
  choice: e os abrigará à sua sombra
  rationale: דגרה está ligado ao ato de chocar ou cuidar da ninhada. A formulação comunica proteção sob a sombra da mãe, preservando a imagem do hebraico; a alternativa mais literal é indicada em nota.
- source_word: אַךְ
  choice: Sim
  rationale: A partícula tem aqui força enfática ou asseverativa, confirmando a certeza da cena.
- source_word: דַיּוֹת
  choice: milhafres
  rationale: É uma identificação lexical provável para essas aves de rapina, embora abutres ou uma designação mais geral continuem possíveis.
- source_word: אִשָּׁה רְעוּתָהּ
  choice: cada fêmea com sua companheira
  rationale: A expressão é literalmente feminina, 'uma com sua companheira'. 'Companheira' preserva essa forma e a ambiguidade relacional, sem impor a interpretação de parceiro reprodutivo.
theological_decisions: []
