id: ISA.34.5
reference: Isaiah 34:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי רִוְּתָ֥ה בַ/שָּׁמַ֖יִם חַרְבִּ֑/י הִנֵּה֙ עַל אֱד֣וֹם תֵּרֵ֔ד וְ/עַל עַ֥ם חֶרְמִ֖/י לְ/מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/005.yaml
  text: For my sword is drenched in the heavens[a]; behold, it will descend on Edom, on the people of my ban[b], for judgment.
translation:
  language: pt
  text: Pois minha espada se embriagou nos céus[a]; eis que ela descerá sobre Edom, sobre o povo que destinei à destruição[b], para o juízo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficou encharcada nos céus” ou “bebeu até se fartar nos céus”. O hebraico descreve a espada como embriagada ou saturada antes de descer para executar o juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz literalmente uma expressão como “o povo do meu ḥerem”: um povo irrevogavelmente entregue à destruição sob o juízo divino.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Preserva a força explicativa ou fundamentadora da partícula sem decidir de modo excessivo entre valor causal e enfático.
- source_word: רִוְּתָה
  choice: se embriagou
  rationale: Conserva a metáfora incomum de רוה, que pode expressar beber até se fartar ou ficar saturado. A nota registra a alternativa concreta 'ficou encharcada'.
- source_word: בַשָּׁמַיִם
  choice: nos céus
  rationale: Reproduz o cenário cósmico e o plural hebraico em português natural e elevado.
- source_word: חַרְבִּי
  choice: minha espada
  rationale: Tradução direta da construção possessiva; no contexto, a espada é o instrumento do juízo divino.
- source_word: הִנֵּה
  choice: eis que
  rationale: Expressão corrente no registro bíblico digno, que chama atenção para a ação iminente sem recorrer a uma forma excessivamente arcaica.
- source_word: עַל אֱדוֹם
  choice: sobre Edom
  rationale: Mantém a imagem espacial da espada descendo sobre Edom e, no contexto, comunica naturalmente a ação hostil.
- source_word: תֵּרֵד
  choice: ela descerá
  rationale: Preserva o movimento descendente desde os céus; o pronome retoma claramente 'espada'.
- source_word: עַם חֶרְמִי
  choice: o povo que destinei à destruição
  rationale: Comunica o sentido de חֵרֶם como aquilo que foi irrevogavelmente entregue à destruição sob juízo divino, evitando o obscuro 'povo do meu interdito'.
- source_word: לְמִשְׁפָּט
  choice: para o juízo
  rationale: Mantém a dimensão judicial de מִשְׁפָּט e a finalidade da descida da espada.
theological_decisions:
- issue: Sentido de חֵרֶם no contexto de guerra e juízo divinos
  choice: o povo que destinei à destruição
  alternative: o povo sob meu interdito; o povo condenado por mim
  rationale: A formulação comunica a consagração irrevogável à destruição implicada pelo termo, sem reduzi-lo a uma maldição verbal nem introduzir uma doutrina denominacional.
- issue: Imagem expressa por רִוְּתָה aplicada à espada divina
  choice: se embriagou
  alternative: ficou encharcada; bebeu até se fartar
  rationale: O hebraico admite a imagem de saciedade por bebida e, por extensão, saturação. O texto principal conserva a metáfora mais marcada, enquanto a nota preserva a alternativa lexical sem identificar explicitamente o líquido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” preserva a solenidade de הִנֵּה; “se embriagou” mantém a imagem poética e sua ambiguidade, esclarecida em nota.
