review_pass:
  verdict: revise
  source_fidelity: 'O sentido geral está correto: a vegetação invade as construções abandonadas, e o lugar passa a servir de habitat para chacais e avestruzes. Contudo, o hebraico emprega בְּ para ambos os locais («em seus palácios... em suas fortalezas»); «sobre os seus palácios» torna a primeira imagem mais espacialmente específica do que o texto exige. A relação final indicada por לְ é mais claramente expressa por «para avestruzes».'
  naturalness: A coordenação original, «e urtigas e sarças, nas suas fortalezas», é truncada em português, sobretudo pela vírgula antes do complemento. A construção paralela «urtigas e sarças em suas fortalezas» é fluente e conserva o paralelismo poético.
  terminology: «Espinhos», «urtigas», «sarças», «fortalezas», «chacais» e «avestruzes» são escolhas adequadas e de registro moderno. «Morada de chacais» comunica bem נְוֵה; «pastagem para avestruzes» reproduz de modo natural a função indicada no hebraico.
  issues:
  - severity: medium
    issue: «sobre os seus palácios» para בְּ/אַרְמְנֹתֶיהָ
    rationale: O texto hebraico localiza o crescimento nos palácios, não afirma explicitamente que os espinhos crescem por cima deles. «Em seus palácios» é mais próximo e ainda evoca a ruína tomada pela vegetação.
  - severity: medium
    issue: Coordenação e pontuação de «e urtigas e sarças, nas suas fortalezas»
    rationale: A vírgula separa inadequadamente os vegetais de seu complemento e a repetição de «e» torna a frase pouco natural. O paralelismo sem a conjunção inicial é claro e poético.
  - severity: low
    issue: «pastagem de avestruzes»
    rationale: Embora compreensível, «de» pode sugerir posse ou composição. «Pastagem para avestruzes» explicita melhor o valor final de לִבְנוֹת יַעֲנָה.
  revised_text: Espinhos crescerão em seus palácios, urtigas e sarças em suas fortalezas. Ela se tornará morada de chacais[a], pastagem para avestruzes[b].
