- from: Espinhos crescerão sobre os seus palácios, e urtigas e sarças, nas suas fortalezas. Ela se tornará morada de chacais[a] e pastagem de avestruzes[b].
  to: Espinhos crescerão em seus palácios, urtigas e sarças em suas fortalezas. Ela se tornará morada de chacais[a], pastagem para avestruzes[b].
  rationale: A revisão ajusta as duas expressões locativas ao hebraico, restaura o paralelismo conciso entre palácios e fortalezas e torna explícita, em português natural, a relação de destino/finalidade da pastagem. Mantêm-se a personificação feminina, a diferenciação das plantas e as notas nos respectivos âncoras.
