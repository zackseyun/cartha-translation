base_translation:
  language: en
  yaml_path: translation/ot/isaiah/034/013.yaml
  text: Thorns will grow over her palaces[a], nettles and brambles in her fortresses; and she will become a haunt of jackals[b], a pasture for ostriches.
translation:
  language: pt
  text: Espinhos crescerão em seus palácios, urtigas e sarças em suas fortalezas. Ela se tornará morada de chacais[a], pastagem para avestruzes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chacais” é o sentido mais provável; traduções antigas trazem “dragões”.
    reason: alternative_reading
  - marker: b
    text: Hebraico, literalmente, “para as filhas do avestruz”, expressão idiomática que se refere a avestruzes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלְתָה
  choice: crescerão sobre
  rationale: O verbo עלה descreve aqui a vegetação que brota e toma conta das construções arruinadas; a expressão comunica naturalmente essa imagem em português.
- source_word: אַרְמְנֹתֶיהָ
  choice: os seus palácios
  rationale: ארמון designa palácio ou residência fortificada; “palácios” é claro e mantém o paralelismo com “fortalezas”.
- source_word: סִירִים
  choice: espinhos
  rationale: Termo geral para vegetação espinhosa, apropriado à imagem de abandono e desolação.
- source_word: קִמּוֹשׂ
  choice: urtigas
  rationale: Designa uma planta silvestre nociva associada a lugares abandonados; “urtigas” é uma equivalência tradicional e compreensível.
- source_word: וָחוֹחַ
  choice: sarças
  rationale: Refere-se a vegetação espinhosa; “sarças” distingue o termo dos “espinhos” já mencionados sem sair do mesmo campo semântico.
- source_word: בְּמִבְצָרֶיהָ
  choice: nas suas fortalezas
  rationale: מבצר denota estruturas ou lugares fortificados; “fortalezas” é natural no contexto das ruínas urbanas.
- source_word: וְהָיְתָה
  choice: Ela se tornará
  rationale: O feminino singular retoma a cidade ou terra personificada e indica sua transformação em habitat de animais selvagens.
- source_word: נְוֵה
  choice: morada
  rationale: נוה pode indicar habitação ou lugar onde animais permanecem; “morada” preserva o sentido sem repetir a imagem de pastagem da oração seguinte.
- source_word: תַנִּים
  choice: chacais
  rationale: Nos contextos proféticos de desolação, “chacais” é o referente zoológico mais provável; traduções antigas como “dragões” podem induzir o leitor moderno ao erro.
- source_word: חָצִיר
  choice: pastagem
  rationale: Aqui o substantivo é entendido como terreno coberto de erva, em paralelo com a morada dos animais selvagens.
- source_word: לִבְנוֹת יַעֲנָה
  choice: de avestruzes
  rationale: A expressão significa literalmente “para as filhas do avestruz”, um modo idiomático hebraico de se referir a avestruzes; o texto principal transmite o referente de maneira natural.
theological_decisions: []
