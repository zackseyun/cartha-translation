  text: הִנֵּ֧ה עֲבָדַ֛/י יָרֹ֖נּוּ מִ/טּ֣וּב לֵ֑ב וְ/אַתֶּ֤ם תִּצְעֲקוּ֙ מִ/כְּאֵ֣ב לֵ֔ב וּ/מִ/שֵּׁ֥בֶר ר֖וּחַ תְּיֵלִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/014.yaml
  text: Look[a], my servants will sing for gladness of heart, but you will cry out from pain of heart[d][c][b], and from a broken spirit you will wail.
translation:
  language: pt
  text: Eis que os meus servos cantarão de alegria no coração,[a] mas vocês gritarão de dor no coração[b] e, por causa do espírito quebrantado, lamentarão em alta voz.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “soltarão gritos de alegria por estarem alegres de coração”. O hebraico diz literalmente “pela bondade do coração”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de angústia no coração”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “uivarão por causa do espírito despedaçado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz enfaticamente o contraste. Embora seja uma fórmula bíblica, continua compreensível e digna em português moderno.
- source_word: עֲבָדַי
  choice: os meus servos
  rationale: Designa os que pertencem a Deus e o servem; “servos” é natural no contexto e não acentua indevidamente a condição jurídica de escravidão.
- source_word: יָרֹנּוּ
  choice: cantarão
  rationale: O verbo pode indicar cantar ou soltar um grito jubiloso. “Cantarão” expressa de modo natural a celebração e mantém o contraste com os gritos de aflição.
- source_word: מִטּוּב לֵב
  choice: de alegria no coração
  rationale: 'A expressão indica bem-estar e contentamento interior, não bondade moral. A preposição מן tem aqui valor causal: a alegria no coração dá origem ao canto.'
- source_word: תִּצְעֲקוּ
  choice: gritarão
  rationale: צעק denota um clamor alto, frequentemente provocado pela aflição; “gritarão” conserva sua intensidade.
- source_word: מִכְּאֵב לֵב
  choice: de dor no coração
  rationale: Preserva a imagem hebraica e o paralelismo direto com a alegria no coração.
- source_word: מִשֵּׁבֶר רוּחַ
  choice: por causa do espírito quebrantado
  rationale: שבר רוח retrata a pessoa interior esmagada ou despedaçada. “Espírito quebrantado” conserva a metáfora sem explicá-la excessivamente.
- source_word: תְּיֵלִילוּ
  choice: gemerão
  rationale: O verbo descreve lamentação forte e audível. “Gemerão” é idiomático em português, enquanto a nota registra a opção mais intensa “uivarão”.
theological_decisions:
- issue: Identidade de “os meus servos” e de “vocês”
  choice: Manter apenas o contraste estabelecido no versículo entre os servos de Deus e o grupo interpelado.
  alternative: Identificar explicitamente os servos como o remanescente fiel e “vocês” como israelitas apóstatas.
  rationale: O texto afirma destinos opostos, mas o próprio versículo não nomeia os grupos com maior precisão. A tradução deixa essa identificação a cargo do contexto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo entre “alegria no coração” e “dor no coração” foi preservado, assim como a progressão enfática de gritar para gemer.
