  text: כִּֽי הִנְ/נִ֥י בוֹרֵ֛א שָׁמַ֥יִם חֲדָשִׁ֖ים וָ/אָ֣רֶץ חֲדָשָׁ֑ה וְ/לֹ֤א תִזָּכַ֨רְנָה֙ הָ/רִ֣אשֹׁנ֔וֹת וְ/לֹ֥א תַעֲלֶ֖ינָה עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/017.yaml
  text: For behold[a], I am creating new heavens and a new earth; and the former things will not be remembered[b], nor will they come to mind.
translation:
  language: pt
  text: Pois eis que estou criando novos céus e uma nova terra; as coisas passadas não serão lembradas[a], nem virão à mente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não serão recordadas”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nem subirão sobre o coração”, expressão que significa “nem virão à mente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Preserva a função explicativa ou causal da conjunção em relação ao contexto anterior.
- source_word: הִנְנִי
  choice: 'vejam: estou'
  rationale: “Vejam” conserva de modo natural a força de chamada de atenção, enquanto “estou” introduz a ação enfática do próprio Deus.
- source_word: בוֹרֵא
  choice: criando
  rationale: O particípio apresenta a ação divina como em curso ou como empreendimento certo; “estou criando” reproduz essa força em português corrente.
- source_word: שָׁמַיִם חֲדָשִׁים
  choice: novos céus
  rationale: Mantém o alcance cósmico e a ressonância bíblica da expressão, sem restringi-la aos céus visíveis.
- source_word: וָאָרֶץ חֲדָשָׁה
  choice: e uma nova terra
  rationale: Em paralelo com “novos céus”, “terra” expressa o âmbito cósmico, não apenas uma região ou território.
- source_word: הָרִאשֹׁנוֹת
  choice: as coisas passadas
  rationale: O adjetivo feminino plural é substantivado e permanece deliberadamente amplo, referindo-se ao que pertencia à ordem anterior.
- source_word: תִזָּכַרְנָה
  choice: não serão lembradas
  rationale: Reproduz naturalmente a forma nifal e não especifica quem deixará de recordá-las.
- source_word: תַעֲלֶינָה עַל לֵב
  choice: nem virão à mente
  rationale: Traduz em português idiomático a imagem hebraica de “subir sobre o coração”, preservada literalmente em nota.
theological_decisions:
- issue: Alcance cósmico da renovação prometida
  choice: “novos céus e uma nova terra” conserva o alcance pleno da fórmula de criação.
  alternative: Entender a expressão principalmente como metáfora da restauração política ou pós-exílica.
  rationale: A combinação “céus e terra” possui amplitude cósmica no uso bíblico. A tradução não reduz esse alcance, mas também não impõe ao versículo um sistema escatológico detalhado.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Vejam” comunica a força de הִנְנִי de maneira corrente; a pontuação após a chamada de atenção evita uma construção artificial. O plural em “novos céus” segue o hebraico e preserva sua ressonância canônica.
