  text: וּ/בָנ֥וּ בָתִּ֖ים וְ/יָשָׁ֑בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/אָכְל֖וּ פִּרְיָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/021.yaml
  text: They will build houses and live in them[b][a]; they will plant vineyards and eat their fruit.
translation:
  language: pt
  text: Construirão casas e morarão nelas; plantarão vinhas e comerão o fruto delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָנוּ
  choice: Construirão
  rationale: O verbo בנה significa “construir”. Neste contexto profético, a forma verbal descreve uma promessa futura; o português exprime isso naturalmente pelo futuro do indicativo.
- source_word: בָתִּים
  choice: casas
  rationale: Tradução concreta e direta do plural de בַּיִת, sem acrescentar a nuance afetiva de “lares”.
- source_word: וְיָשָׁבוּ
  choice: e morarão nelas
  rationale: ישׁב, neste contexto, significa morar ou habitar. “Morarão nelas” é corrente e explicita naturalmente que as casas serão ocupadas por quem as construiu.
- source_word: וְנָטְעוּ
  choice: plantarão
  rationale: נטע significa “plantar”; o futuro mantém a sequência de promessas proféticas.
- source_word: כְרָמִים
  choice: vinhas
  rationale: כֶּרֶם designa uma vinha ou vinhedo. “Vinhas” é uma expressão corrente e amplamente compreensível em português.
- source_word: וְאָכְלוּ
  choice: e comerão
  rationale: אכל significa literalmente “comer”. A escolha preserva a imagem concreta de usufruir da própria colheita, sem ampliá-la para “desfrutar”.
- source_word: פִּרְיָם
  choice: o fruto delas
  rationale: פְּרִי é singular coletivo, “fruto” ou “produção”, e o sufixo masculino plural retoma as vinhas. “Delas” torna essa referência inequívoca em português.
theological_decisions:
- issue: Valor temporal das formas verbais proféticas
  choice: Traduzir a sequência como promessas futuras
  alternative: Traduzir as formas como ações passadas ou com um perfeito português
  rationale: No contexto da restauração prometida em Isaías 65, as formas perfeitas hebraicas apresentam aquilo que o povo experimentará no futuro. O futuro do indicativo comunica essa função no português atual sem transformar a promessa em relato passado.
translation_notes:
  register: Português moderno, claro e digno, com sujeito implícito natural à língua. “Morarão” favorece legibilidade cotidiana; “vinhas” conserva a imagem agrícola tradicional e é amplamente compreensível. O ponto e vírgula reproduz a divisão equilibrada entre construir/morar e plantar/comer.
