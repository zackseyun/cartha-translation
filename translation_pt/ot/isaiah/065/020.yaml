id: ISA.65.20
reference: Isaiah 65:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹא יִֽהְיֶ֨ה מִ/שָּׁ֜ם ע֗וֹד ע֤וּל יָמִים֙ וְ/זָקֵ֔ן אֲשֶׁ֥ר לֹֽא יְמַלֵּ֖א אֶת יָמָ֑י/ו כִּ֣י הַ/נַּ֗עַר בֶּן מֵאָ֤ה שָׁנָה֙ יָמ֔וּת וְ/הַ֣/חוֹטֶ֔א בֶּן מֵאָ֥ה שָׁנָ֖ה יְקֻלָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/020.yaml
  text: No more shall there be from there an infant of days[a], or an old man who does not fill out his days; for the youth will die a hundred years old[c][b], and the sinner a hundred years old will be accursed.
translation:
  language: pt
  text: Não haverá mais ali bebê que viva apenas poucos dias[a], nem idoso que não complete os seus dias; pois o jovem morrerá aos cem anos, e o pecador de cem anos será amaldiçoado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “bebê de dias”.
    reason: lexical_alternative
  - marker: b
    text: 'Outra interpretação: “quem não chegar aos cem anos será considerado amaldiçoado”.'
    reason: interpretive_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: ali
  rationale: O hebraico traz literalmente “de lá”, mas, neste contexto existencial, “ali” comunica de modo natural em português que tal pessoa já não será encontrada naquele lugar.
- source_word: עוּל יָמִים
  choice: bebê que viva apenas poucos dias
  rationale: A expressão construta significa literalmente “bebê de dias” e, no contexto, descreve um bebê cuja vida dura poucos dias. A formulação explicita o sentido idiomático sem introduzir uma idade precisa.
- source_word: זָקֵן אֲשֶׁר לֹא יְמַלֵּא אֶת־יָמָיו
  choice: idoso que não complete os seus dias
  rationale: Preserva a imagem hebraica de “completar os dias” e continua clara e digna em português moderno.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: נַעַר abrange desde menino até jovem. “O jovem” mantém essa relativa amplitude e funciona no contraste com o idoso.
- source_word: בֶּן־מֵאָה שָׁנָה
  choice: aos cem anos / de cem anos
  rationale: São formas portuguesas naturais para a construção hebraica que expressa idade; a variação acompanha a sintaxe das duas orações.
- source_word: יָמוּת
  choice: morrerá
  rationale: O imperfeito tem valor futuro natural neste contexto profético, e o verbo é mantido em seu sentido direto.
- source_word: הַחוֹטֵא
  choice: o pecador
  rationale: O particípio designa alguém caracterizado pelo pecado; “o pecador” é conciso e lexicalmente direto.
- source_word: יְקֻלָּל
  choice: será amaldiçoado
  rationale: O Pual indica que a pessoa estará sob maldição. “Será amaldiçoado” preserva a força judicial do termo e soa mais corrente que “será maldito” em muitos contextos lusófonos.
theological_decisions:
- issue: A presença de morte e maldição no contexto da promessa de novos céus e nova terra
  choice: Manter literalmente que o jovem morrerá aos cem anos e que o pecador de cem anos será amaldiçoado.
  alternative: Interpretar a morte figuradamente ou reformular o texto para eliminar sua tensão com outras passagens escatológicas.
  rationale: O hebraico afirma explicitamente “morrerá” e “será amaldiçoado”. A tradução preserva essa tensão e não a harmoniza com um sistema escatológico posterior.
- issue: Relação entre a idade de cem anos e a condição do pecador
  choice: 'Traduzir a sintaxe direta: “o pecador de cem anos será amaldiçoado”.'
  alternative: Entender que quem não alcançar cem anos será considerado amaldiçoado.
  rationale: A alternativa é uma interpretação contextual conhecida, mas acrescenta uma negação que não aparece expressamente na oração hebraica. O texto principal mantém a estrutura mais direta, e a nota registra a leitura interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Bebê” torna o referente imediato para leitores comuns; “complete os seus dias” conserva a imagem poética hebraica. A ordem e a tensão das duas últimas orações foram preservadas sem harmonização teológica.
