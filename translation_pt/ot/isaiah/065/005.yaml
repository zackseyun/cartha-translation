  text: הָ/אֹֽמְרִים֙ קְרַ֣ב אֵלֶ֔י/ךָ אַל תִּגַּשׁ בִּ֖/י כִּ֣י קְדַשְׁתִּ֑י/ךָ אֵ֚לֶּה עָשָׁ֣ן בְּ/אַפִּ֔/י אֵ֥שׁ יֹקֶ֖דֶת כָּל הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/005.yaml
  text: who say[a], ‘Keep to yourself; do not come near me, for I am holier than you.’ These are smoke in my nostrils, a fire burning all day long.
translation:
  language: pt
  text: 'os que dizem[a]: “Fique aí; não se aproxime de mim, pois sou mais santo do que você”. Eles são fumaça nas minhas narinas, fogo que arde o dia inteiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois sou santo demais para você”, ou: “pois me mantive santo, separado de você”. A frase hebraica é difícil e expressa uma pretensão de superioridade ritual ou moral.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: os que dizem
  rationale: O particípio tem função substantiva e dá continuidade à descrição das pessoas mencionadas no contexto anterior.
- source_word: קְרַב אֵלֶיךָ
  choice: Fique aí
  rationale: A expressão idiomática funciona, no contexto, como uma ordem desdenhosa para que o interlocutor mantenha distância. Esta formulação é natural em português e preserva o tom de exclusão.
- source_word: אַל תִּגַּשׁ בִּי
  choice: não se aproxime de mim
  rationale: נגשׁ com ב indica aproximar-se de alguém; a tradução conserva de modo claro a proibição e o distanciamento exigido.
- source_word: כִּי קְדַשְׁתִּיךָ
  choice: pois sou mais santo do que você
  rationale: A construção hebraica é difícil e condensada. No contexto, expressa uma pretensão arrogante de superioridade ritual ou moral; a tradução principal comunica esse sentido sem ocultar as alternativas, registradas em nota.
- source_word: אֵלֶּה
  choice: Eles
  rationale: O demonstrativo retoma as pessoas que acabam de ser descritas. O pronome evita rigidez desnecessária em português.
- source_word: עָשָׁן בְּאַפִּי
  choice: fumaça nas minhas narinas
  rationale: Preserva a imagem concreta e incisiva da fumaça irritante, em vez de reduzir אַף ao sentido abstrato de ira.
- source_word: אֵשׁ יֹקֶדֶת
  choice: fogo que arde
  rationale: Reproduz a metáfora e o valor contínuo do particípio hebraico em português natural.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Equivalente idiomático moderno que mantém a ideia de duração contínua.
theological_decisions:
- issue: Sentido de כִּי קְדַשְׁתִּיךָ
  choice: pois sou mais santo do que você
  alternative: pois sou santo demais para você; pois me mantive santo, separado de você
  rationale: A forma hebraica é sintaticamente incomum e admite mais de uma interpretação. A leitura principal reflete melhor, no contexto, a alegação de superioridade religiosa que o oráculo condena, sem endossá-la; a nota preserva as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Fique aí” transmite a ordem excludente sem reproduzir de forma obscura o hebraísmo; “narinas” conserva a imagem corporal vívida do original.
