base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/009.yaml
  text: And I will bring forth offspring from Jacob[a], and from Judah an heir of my mountains; my chosen ones will possess it[b], and my servants will dwell there.
translation:
  language: pt
  text: E farei surgir de Jacó descendência[a] e, de Judá, um herdeiro dos meus montes; os meus escolhidos tomarão posse dela[b], e os meus servos habitarão ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «semente». A palavra hebraica é um singular coletivo que pode significar semente, descendência ou descendentes.
    reason: lexical_alternative
  - marker: b
    text: Ou «a herdarão». O mesmo verbo hebraico está por trás de «herdeiro» e de «tomarão posse», ligando as ideias de herança e posse. No texto hebraico, o pronome objeto é feminino singular; seu referente não é explicitado e pode pressupor a terra, em vez de retomar gramaticalmente «os meus montes».
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: E farei sair
  rationale: O hifil de יצא tem sentido causativo, «fazer sair». A formulação preserva a ação divina e soa natural em português.
- source_word: מִיַּעֲקֹב זֶרַע
  choice: de Jacó uma descendência
  rationale: זֶרַע é um singular coletivo que pode significar semente, prole ou descendentes. «Descendência» conserva o caráter coletivo com clareza moderna.
- source_word: וּמִיהוּדָה יוֹרֵשׁ
  choice: e, de Judá, quem herde
  rationale: O particípio יוֹרֵשׁ designa aquele que herda ou toma posse. «Quem herde» permite uma construção portuguesa natural com o objeto plural «os meus montes».
- source_word: הָרָי
  choice: os meus montes
  rationale: Mantém o plural concreto do hebraico e não reduz a imagem territorial a «terra» nem a espiritualiza.
- source_word: וִירֵשׁוּהָ
  choice: os possuirão
  rationale: ירש reúne as ideias de herdar e tomar posse. «Possuirão» expressa a ocupação efetiva; o pronome plural retoma naturalmente «os meus montes». A forma hebraica apresenta sufixo feminino singular, uma incongruência gramatical preservada em nota como alternativa textual.
- source_word: בְחִירַי
  choice: os meus escolhidos
  rationale: Tradução transparente que conserva a escolha divina sem acrescentar terminologia doutrinária posterior.
- source_word: וַעֲבָדַי יִשְׁכְּנוּ שָׁמָּה
  choice: e os meus servos habitarão ali
  rationale: שכן indica habitar ou estabelecer-se. «Habitarão ali» mantém o sentido duradouro e o registro digno.
theological_decisions:
- issue: Referente de «os meus montes» e natureza da promessa
  choice: 'Conservar a linguagem territorial concreta: «os meus montes».'
  alternative: Generalizar como «minha terra» ou interpretar exclusivamente como bênção escatológica espiritual.
  rationale: O hebraico menciona explicitamente os montes pertencentes a Deus. A tradução mantém a dimensão geográfica e deixa em aberto questões sobre o alcance e o cumprimento teológico da promessa.
- issue: Relação entre «quem herde» e «os meus escolhidos»
  choice: Não identificar explicitamente o herdeiro singular com um indivíduo específico nem eliminar a passagem ao plural.
  alternative: Interpretar o singular como uma figura messiânica individual ou harmonizá-lo plenamente com o coletivo seguinte.
  rationale: O texto passa de יוֹרֵשׁ, singular, a בְחִירַי, plural. A tradução preserva essa tensão gramatical e referencial sem impor uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Montes» preserva a imagem bíblica sem arcaísmo excessivo; «habitarão» sustenta o tom literário. As vírgulas destacam o paralelismo entre Jacó e Judá.
