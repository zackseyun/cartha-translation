source:
  edition: WLC
  text: זְאֵ֨ב וְ/טָלֶ֜ה יִרְע֣וּ כְ/אֶחָ֗ד וְ/אַרְיֵה֙ כַּ/בָּקָ֣ר יֹֽאכַל תֶּ֔בֶן וְ/נָחָ֖שׁ עָפָ֣ר לַחְמ֑/וֹ לֹֽא יָרֵ֧עוּ וְ/לֹֽא יַשְׁחִ֛יתוּ בְּ/כָל הַ֥ר קָדְשִׁ֖/י אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/025.yaml
  text: The wolf and the lamb will graze together[a], and the lion will eat straw like the cattle; and dust will be the serpent’s food[c][b]. They will do no evil or destruction on all my holy mountain," says Yahweh.
translation:
  language: pt
  text: O lobo e o cordeiro pastarão juntos[a], e o leão comerá palha como o gado; o pó será o alimento da serpente[b]. Não farão mal nem causarão destruição em todo o meu santo monte[c], diz Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cabrito”; o termo hebraico pode referir-se, de modo mais amplo, a um animal jovem dos rebanhos de ovelhas ou cabras.
    reason: lexical_alternative
  - marker: b
    text: A serpente alimentar-se do pó provavelmente remete a Gênesis 3:14.
    reason: cross_reference
  - marker: c
    text: Ou “Não praticarão o mal nem destruirão”. O primeiro verbo pode indicar tanto fazer o mal quanto causar dano.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְאֵב
  choice: lobo
  rationale: Equivalente comum e direto do animal mencionado.
- source_word: טָלֶה
  choice: cordeiro
  rationale: No contraste com o lobo, comunica naturalmente a imagem de uma presa jovem e vulnerável; o termo hebraico pode designar de modo mais amplo um animal jovem do rebanho menor.
- source_word: יִרְעוּ כְאֶחָד
  choice: pastarão juntos
  rationale: Expressa com naturalidade tanto a ação de רעה quanto o sentido conjunto de כְאֶחָד.
- source_word: אַרְיֵה
  choice: leão
  rationale: Equivalente padrão e inequívoco.
- source_word: כַּבָּקָר
  choice: como o gado
  rationale: בקר é um substantivo coletivo referente ao gado bovino; esta opção evita impor um singular específico.
- source_word: יֹאכַל תֶּבֶן
  choice: comerá palha
  rationale: Tradução direta que preserva a inversão da dieta predatória do leão.
- source_word: נָחָשׁ
  choice: serpente
  rationale: Mantém o registro literário e a provável ressonância de Gênesis 3:14.
- source_word: עָפָר לַחְמוֹ
  choice: o pó será o alimento da serpente
  rationale: לֶחֶם pode significar pão ou alimento; 'alimento' é natural neste contexto, e a explicitação de 'serpente' evita uma referência pronominal ambígua em português.
- source_word: לֹא יָרֵעוּ וְלֹא יַשְׁחִיתוּ
  choice: Não farão mal nem causarão destruição
  rationale: Preserva o sentido contextual de dano do primeiro verbo e distingue os dois verbos sem transformar o segundo em uma construção portuguesa pouco natural.
- source_word: בְּכָל הַר קָדְשִׁי
  choice: em todo o meu santo monte
  rationale: Expressão idiomática em português que mantém a extensão total indicada por כָּל.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: Representa o nome divino pessoal no texto hebraico e o valor formular da declaração profética.
theological_decisions:
- issue: Possível alusão a Gênesis 3:14 na referência à serpente e ao pó
  choice: Manter 'serpente' e 'o pó será o alimento da serpente' no texto, explicando apenas em nota a provável alusão.
  alternative: Usar 'cobra' ou explicitar no texto que se trata da maldição de Gênesis.
  rationale: A formulação preserva a ressonância intertextual sem transformar uma provável alusão em interpretação explícita.
- issue: Sentido de לֹא יָרֵעוּ
  choice: Não farão mal
  alternative: Não praticarão o mal
  rationale: O verbo pode envolver maldade ou dano. No contexto de animais predadores e em paralelo com destruição, 'farão mal' preserva a amplitude entre ação nociva e mal moral.
- issue: Referente implícito dos verbos finais no plural
  choice: Conservar o sujeito indeterminado em 'Não farão...'
  alternative: Explicitar 'os animais' ou 'eles'.
  rationale: O hebraico não nomeia novamente o sujeito; a tradução evita restringi-lo interpretativamente aos animais recém-mencionados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e os paralelismos do hebraico foram mantidos sempre que naturais. O nome divino foi transliterado como “Yahweh”, de acordo com a forma explícita יהוה na fonte.
