id: ISA.65.10
reference: Isaiah 65:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֤ה הַ/שָּׁרוֹן֙ לִ/נְוֵה צֹ֔אן וְ/עֵ֥מֶק עָכ֖וֹר לְ/רֵ֣בֶץ בָּקָ֑ר לְ/עַמִּ֖/י אֲשֶׁ֥ר דְּרָשֽׁוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/010.yaml
  text: Sharon will become a pasture for flocks[a], and the Valley of Achor a resting place for cattle[b], for my people who have sought me.
translation:
  language: pt
  text: Sarom se tornará pastagem para os rebanhos[a], e o vale de Acor, lugar de repouso para o gado[b], para o meu povo que me buscou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morada para as ovelhas” ou “lugar de pastoreio para as ovelhas”.
    reason: lexical_alternative
  - marker: b
    text: O vale de Acor está associado a um julgamento anterior (Js 7.24–26); aqui, é apresentado como lugar de restauração e segurança.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: se tornará
  rationale: No discurso profético, a forma tem sentido futuro e resultativo; a escolha ressalta a transformação ligada à restauração.
- source_word: הַשָּׁרוֹן
  choice: Sarom
  rationale: Mantém o topônimo tradicional em português, sem reproduzir o artigo hebraico, que não é natural diante do nome em português.
- source_word: לִנְוֵה צֹאן
  choice: pastagem para os rebanhos
  rationale: נָוֶה pode indicar morada, pastagem ou lugar de pastoreio. A formulação é clara e preserva a imagem pastoril; 'rebanhos' expressa naturalmente o coletivo צֹאן.
- source_word: וְעֵמֶק עָכוֹר
  choice: e o vale de Acor
  rationale: Traduz עֵמֶק e conserva Acor como topônimo reconhecível em português.
- source_word: לְרֵבֶץ בָּקָר
  choice: lugar de repouso para o gado
  rationale: רֵבֶץ designa um lugar onde os animais se deitam e descansam, comunicando repouso seguro, não apenas alimentação.
- source_word: לְעַמִּי
  choice: para o meu povo
  rationale: 'A preposição indica benefício: as terras restauradas estarão à disposição do povo de Deus.'
- source_word: אֲשֶׁר דְּרָשׁוּנִי
  choice: que me buscou
  rationale: דרש, tendo Deus como objeto, significa normalmente 'buscar'. O pretérito perfeito identifica o povo por sua resposta anterior sem acrescentar uma delimitação doutrinária.
theological_decisions:
- issue: Identidade de “meu povo que me buscou”
  choice: A expressão identifica o povo fiel que Deus reconhece como seu, sem definir um grupo doutrinário mais estreito do que o próprio texto.
  alternative: Pode ser entendida especificamente como o remanescente de Israel ou, de modo coletivo, como todo o Israel restaurado.
  rationale: A tradução conserva a amplitude e a tensão do hebraico, sem decidir entre leituras teológicas que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e uso internacional amplo. Mantêm-se os topônimos bíblicos tradicionais “Sarom” e “Acor”; o paralelismo pastoril hebraico é preservado.
