  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֹ֤א יִֽיגְעוּ֙ לָ/רִ֔יק וְ/לֹ֥א יֵלְד֖וּ לַ/בֶּהָלָ֑ה כִּ֣י זֶ֜רַע בְּרוּכֵ֤י יְהוָה֙ הֵ֔מָּה וְ/צֶאֱצָאֵי/הֶ֖ם אִתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/023.yaml
  text: They will not labor for emptiness[a], nor bear children for calamity, for they are the offspring of those blessed by Yahweh, and their descendants with them.
translation:
  language: pt
  text: Não trabalharão em vão, nem terão filhos para a calamidade[a], pois são a descendência dos que Yahweh abençoou, e seus descendentes estarão com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para o terror» ou «para um desastre repentino». O termo hebraico também pode indicar pânico ou calamidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיגְעוּ
  choice: trabalharão
  rationale: O verbo יגע expressa trabalho ou esforço árduo; “trabalharão” é natural e claro em português, enquanto o contexto comunica o esforço envolvido.
- source_word: לָרִיק
  choice: em vão
  rationale: רִיק denota vazio, inutilidade ou algo que não produz resultado. “Em vão” traduz de modo idiomático a ideia de trabalho infrutífero.
- source_word: יֵלְדוּ
  choice: terão filhos
  rationale: ילד aqui se refere a gerar ou dar à luz descendentes. “Terão filhos” inclui naturalmente a comunidade inteira sem restringir a ação apenas às mães.
- source_word: לַבֶּהָלָה
  choice: para a calamidade
  rationale: בֶּהָלָה pode indicar terror, pânico ou ruína repentina. Neste contexto, “para a calamidade” preserva a ideia de filhos destinados a sofrer desastre, sem definir além do que o hebraico permite.
- source_word: זֶרַע
  choice: descendência
  rationale: זֶרַע significa literalmente “semente” e, por extensão, prole ou descendência. “Descendência” é digno e compreensível, mantendo o sentido coletivo.
- source_word: בְּרוּכֵי יְהוָה
  choice: dos abençoados de Yahweh
  rationale: 'A construção identifica um grupo caracterizado pela bênção de Yahweh. A formulação conserva a possível relação geracional: eles pertencem à descendência daqueles que Yahweh abençoou.'
- source_word: וְצֶאֱצָאֵיהֶם אִתָּם
  choice: e seus descendentes estarão com eles
  rationale: צֶאֱצָאִים designa descendentes, e אִתָּם significa “com eles”. O verbo “estarão”, implícito em português, torna a frase natural e expressa continuidade familiar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Relação expressa por זֶרַע בְּרוּכֵי יְהוָה
  choice: descendência dos abençoados de Yahweh
  alternative: descendência abençoada por Yahweh
  rationale: A forma בְּרוּכֵי é plural construto e, na leitura mais direta, descreve pessoas abençoadas por Yahweh das quais o grupo é descendência. A tradução evita fundir silenciosamente as duas expressões numa única qualificação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução prefere “em vão” à expressão mais literal “para o vazio” e mantém “calamidade” para não reduzir a amplitude semântica de בֶּהָלָה. Não há marcador de nota porque nenhuma nota é necessária para a leitura publicada deste versículo.
