revisions:
- from: Não trabalharão em vão, nem terão filhos para a calamidade, pois são descendência dos abençoados de Yahweh, e seus descendentes estarão com eles.
  to: Não trabalharão em vão, nem terão filhos para a calamidade[a], pois são a descendência dos que Yahweh abençoou, e seus descendentes estarão com eles.
  rationale: A revisão torna a relação de «descendência» com «os que Yahweh abençoou» idiomática em português, sem eliminar a leitura geracional expressa pelo construto hebraico. Também acrescenta uma nota lexical para a amplitude de בֶּהָלָה. O futuro em «estarão com eles» é coerente com a moldura verbal futura do versículo e torna explícita em português a cópula elíptica.
