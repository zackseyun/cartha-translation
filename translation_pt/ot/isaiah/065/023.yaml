review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a negação de trabalho infrutífero e de filhos associados à calamidade, bem como a continuidade da descendência. Contudo, «dos abençoados de Yahweh» é menos natural em português e pode soar como um grupo desvinculado; «dos que Yahweh abençoou» explicita de modo idiomático a construção hebraica בלי alterar sua relação geracional. A nota para בֶּהָלָה é aconselhável, pois o termo também abrange terror, pânico e desastre repentino.
  naturalness: «Não trabalharão em vão» é natural e digno. «Terão filhos para a calamidade» preserva a concisão e a orientação da preposição hebraica, embora seja uma formulação solene apropriada ao registro profético. «A descendência dos que Yahweh abençoou» é mais fluente e clara que «descendência dos abençoados de Yahweh».
  terminology: «Yahweh» representa diretamente o Tetragrama. «Descendência» e «descendentes» refletem adequadamente a distinção funcional entre זֶרַע e צֶאֱצָאִים. «Calamidade» é uma escolha legítima para בֶּהָלָה, desde que sua gama de sentidos seja registrada em nota.
  issues:
  - severity: low
    issue: Formulação pouco idiomática de «dos abençoados de Yahweh».
    rationale: Embora defensável literalmente, a expressão é menos natural em português moderno. «Dos que Yahweh abençoou» mantém a leitura adotada no rastro inglês — descendência de pessoas abençoadas por Yahweh — com maior clareza.
  - severity: low
    issue: Ausência de nota para «calamidade».
    rationale: בֶּהָלָה pode denotar terror, pânico ou desastre súbito. Uma nota breve preserva essa amplitude sem sobrecarregar o texto.
