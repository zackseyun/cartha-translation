source:
  edition: WLC
  text: פֵּרַ֧שְׂתִּי יָדַ֛/י כָּל הַ/יּ֖וֹם אֶל עַ֣ם סוֹרֵ֑ר הַ/הֹלְכִים֙ הַ/דֶּ֣רֶךְ לֹא ט֔וֹב אַחַ֖ר מַחְשְׁבֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/002.yaml
  text: I spread out my hands all day long to a rebellious people[a], who walk in a way that is not good[c][b], following their own thoughts.
translation:
  language: pt
  text: Estendi as minhas mãos o dia inteiro[a] a um povo rebelde[b], que anda por um caminho que não é bom, seguindo os seus próprios pensamentos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mantive as minhas mãos estendidas o dia inteiro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “obstinado”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “seus próprios planos” ou “seus próprios desígnios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: Estendi
  rationale: O piel de פרשׂ comunica a ação de estender ou abrir. “Estendi” preserva a imagem concreta do gesto divino e soa natural em português.
- source_word: יָדַי
  choice: as minhas mãos
  rationale: A forma hebraica é plural/dual com sufixo de primeira pessoa; o plural mantém integralmente a imagem corporal.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: A expressão indica ação contínua ao longo de todo o dia. “O dia inteiro” é corrente e claro em português moderno.
- source_word: אֶל
  choice: a
  rationale: A preposição indica a direção do gesto para o povo; “a” é conciso e natural com o verbo “estender” neste contexto.
- source_word: עַם
  choice: povo
  rationale: O substantivo designa aqui uma coletividade, não necessariamente uma entidade geopolítica; “povo” é o equivalente contextual adequado.
- source_word: סוֹרֵר
  choice: rebelde
  rationale: O particípio descreve quem resiste, se desvia ou se mostra obstinado. “Rebelde” conserva a força moral e relacional do termo sem explicação adicional.
- source_word: הַהֹלְכִים
  choice: que anda
  rationale: O particípio caracteriza a conduta habitual do povo. O singular concorda coletivamente com “povo” e conserva a metáfora hebraica de andar como modo de viver.
- source_word: הַדֶּרֶךְ
  choice: por um caminho
  rationale: A expressão mantém a metáfora de percurso e conduta. O artigo hebraico pode ter valor associativo; em português, “um caminho” exprime naturalmente a caracterização que se segue.
- source_word: לֹא טוֹב
  choice: que não é bom
  rationale: A tradução conserva a negação literal de “bom”, sem intensificá-la para “mau”, “perverso” ou “maligno”.
- source_word: אַחַר
  choice: seguindo
  rationale: Em contexto de conduta, a preposição comunica a ideia de ir atrás de algo ou orientar-se por isso. “Seguindo” liga naturalmente a expressão ao verbo “andar”.
- source_word: מַחְשְׁבֹתֵיהֶם
  choice: os seus próprios pensamentos
  rationale: O substantivo pode indicar pensamentos, planos ou desígnios. “Pensamentos” é direto; “próprios” torna clara a orientação autônoma expressa pelo sufixo possessivo no contexto.
theological_decisions:
- issue: A postura divina diante de um povo desobediente
  choice: Preservar a imagem antropomórfica “Estendi as minhas mãos” como gesto persistente dirigido ao povo.
  alternative: Parafrasear como “Continuei procurando acolhê-los” ou “Continuei chamando-os”.
  rationale: A imagem corporal pertence ao texto e mantém, sem resolver artificialmente, a tensão entre a iniciativa persistente de Deus e a rebeldia humana.
- issue: A avaliação moral da conduta do povo
  choice: Traduzir לֹא טוֹב por “não é bom”.
  alternative: Traduzir por “é mau”, “é perverso” ou “não é correto”.
  rationale: O hebraico nega o adjetivo “bom”. Manter essa formulação evita introduzir uma especificação moral mais forte do que a expressa na fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a metáfora hebraica de estender as mãos e andar por um caminho, mas evita construções excessivamente arcaicas. Os marcadores foram posicionados junto às palavras a que suas alternativas se referem.
