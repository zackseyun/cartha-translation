  text: וְ/אַתֶּם֙ עֹזְבֵ֣י יְהוָ֔ה הַ/שְּׁכֵחִ֖ים אֶת הַ֣ר קָדְשִׁ֑/י הַֽ/עֹרְכִ֤ים לַ/גַּד֙ שֻׁלְחָ֔ן וְ/הַֽ/מְמַלְאִ֖ים לַ/מְנִ֥י מִמְסָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/011.yaml
  text: But you are those who forsake Yahweh[a], who forget my holy mountain, who set a table for Gad[c][b], and who fill mixed wine for Meni.
translation:
  language: pt
  text: Mas vocês, que abandonam Yahweh, que se esquecem do meu santo monte, que preparam uma mesa para Gad[a] e enchem de bebida misturada[c] para Meni[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gad provavelmente era o nome de uma divindade associada à fortuna; outra tradução possível é “para a Fortuna”.
    reason: alternative_reading
  - marker: b
    text: Meni provavelmente era o nome de uma divindade associada ao destino; outra tradução possível é “para o Destino”.
    reason: alternative_reading
  - marker: c
    text: 'Ou “vinho misturado”. A expressão se refere a uma bebida preparada, provavelmente para uma libação. Lit.: “enchem bebida misturada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mas vocês
  rationale: A conjunção seguida do pronome independente introduz contraste com o contexto anterior; “Mas vocês” expressa isso naturalmente.
- source_word: עֹזְבֵי יְהוָה
  choice: que abandonam Yahweh
  rationale: O particípio descreve o grupo interpelado. “Abandonam” preserva a força relacional e pactual de עזב, enquanto “Yahweh” translitera o nome divino.
- source_word: הַשְּׁכֵחִים אֶת הַר קָדְשִׁי
  choice: que se esquecem do meu santo monte
  rationale: Mantém o sentido direto do particípio e verte a expressão hebraica de modo idiomático; o monte é Sião, mas o nome não é acrescentado ao texto.
- source_word: הָעֹרְכִים לַגַּד שֻׁלְחָן
  choice: que põem uma mesa para Gad
  rationale: ערך com “mesa” indica dispor ou pôr a mesa. Gad é mantido como nome próprio, sem ocultar em nota sua associação provável com a fortuna.
- source_word: וְהַמְמַלְאִים לַמְנִי מִמְסָךְ
  choice: e enchem uma taça de bebida misturada para Meni
  rationale: O verbo significa literalmente “encher”. A menção de “uma taça” explicita em português o recipiente implícito exigido pelo verbo e pelo contexto de libação; מִמְסָךְ é deixado como “bebida misturada”, sem restringi-lo necessariamente a vinho. Meni é preservado como nome próprio.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz o Tetragrama como nome pessoal. A transliteração “Yahweh” preserva essa função sem substituí-lo por um título.
- issue: Se גַּד e מְנִי devem ser nomes próprios ou substantivos comuns
  choice: Gad e Meni no texto principal
  alternative: Fortuna e Destino
  rationale: No contexto, são mais provavelmente nomes de divindades ou poderes personificados. A transliteração preserva essa leitura, enquanto as notas registram o significado associado sem eliminar a ambiguidade.
- issue: Natureza de מִמְסָךְ
  choice: bebida misturada
  alternative: vinho misturado; libação
  rationale: O termo designa uma bebida preparada ou misturada, provavelmente usada como libação. “Bebida misturada” evita afirmar como certo tanto o ingrediente específico quanto a função ritual, embora o contexto favoreça ambos.
translation_notes:
  register: Português moderno, claro e solene, com construção direta. “Vocês” favorece ampla compreensão, especialmente brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte. Todos os marcadores de nota aparecem junto aos termos correspondentes no texto.
