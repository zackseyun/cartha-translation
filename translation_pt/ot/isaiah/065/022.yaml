source:
  edition: WLC
  text: לֹ֤א יִבְנוּ֙ וְ/אַחֵ֣ר יֵשֵׁ֔ב לֹ֥א יִטְּע֖וּ וְ/אַחֵ֣ר יֹאכֵ֑ל כִּֽי כִ/ימֵ֤י הָ/עֵץ֙ יְמֵ֣י עַמִּ֔/י וּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם יְבַלּ֥וּ בְחִירָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/022.yaml
  text: They will not build and another inhabit; they will not plant and another eat. For the days of my people will be like the days of a tree[a], and my chosen ones will wear out the work of their hands.
translation:
  language: pt
  text: Não construirão para que outro habite, nem plantarão para que outro coma. Pois os dias do meu povo serão como os dias de uma árvore, e os meus escolhidos desfrutarão plenamente do trabalho de suas mãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “desgastarão pelo uso” ou “usarão até o fim” o trabalho de suas mãos; isto é, desfrutarão dele durante toda a sua duração.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְנוּ
  choice: construirão
  rationale: O qal imperfeito de בנה tem sentido futuro no contexto da restauração prometida.
- source_word: וְאַחֵר יֵשֵׁב
  choice: para que outro habite
  rationale: ישׁב pode significar morar ou habitar; a casa construída é o objeto implícito. A construção com “para que” expressa naturalmente em português o resultado frustrante que a promessa nega.
- source_word: יִטְּעוּ
  choice: plantarão
  rationale: O qal imperfeito de נטע significa diretamente plantar e assume valor futuro neste contexto.
- source_word: וְאַחֵר יֹאכֵל
  choice: para que outro coma
  rationale: אכל é o verbo comum para comer; o produto da plantação permanece implícito, como no hebraico.
- source_word: כִּי כִימֵי הָעֵץ
  choice: Pois os dias ... serão como os dias de uma árvore
  rationale: A comparação com os dias de uma árvore comunica longevidade; o artigo hebraico tem valor genérico, expresso naturalmente pelo indefinido em português.
- source_word: יְמֵי עַמִּי
  choice: os dias do meu povo
  rationale: Tradução direta da cadeia construta, preservando a imagem temporal do original.
- source_word: וּמַעֲשֵׂה יְדֵיהֶם
  choice: o trabalho de suas mãos
  rationale: Mantém a expressão hebraica tradicional e inteligível para o fruto do próprio trabalho.
- source_word: יְבַלּוּ
  choice: desfrutarão plenamente
  rationale: O piel de בלה pode significar gastar pelo uso ou usar até o fim. No contexto de bênção, a formulação comunica que os escolhidos usufruirão do próprio trabalho durante toda a sua duração, sem transformar a imagem literal numa ideia negativa de deterioração.
- source_word: בְּחִירָי
  choice: os meus escolhidos
  rationale: Reproduz o substantivo plural derivado de בחר sem recorrer a “eleitos”, termo que pode trazer associações teológicas mais específicas.
theological_decisions:
- issue: Sentido de יְבַלּוּ no contexto da bênção futura
  choice: desfrutarão plenamente
  alternative: desgastarão pelo uso / usarão até o fim
  rationale: A promessa enfatiza segurança, longevidade e usufruto do próprio trabalho. A tradução idiomática evita sugerir mera deterioração, enquanto a nota preserva a imagem e a ambiguidade lexical do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. O paralelismo hebraico foi preservado, e a repetição de “outro” mantém em foco a reversão da injustiça.
