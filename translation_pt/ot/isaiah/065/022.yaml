  source_fidelity: 'A tradução preserva adequadamente o paralelismo negativo e a reversão da injustiça: o povo não construirá nem plantará para que outros usufruam. «Os dias do meu povo serão como os dias de uma árvore» reproduz a comparação genérica e a imagem de longevidade. «Desfrutarão plenamente do trabalho de suas mãos» é uma explicitação contextual defensável de יְבַלּוּ no cenário de bênção, e a nota registra a alternativa mais literal de usar/desgastar até o fim.'
