  text: וְ/הָיָ֥ה טֶֽרֶם יִקְרָ֖אוּ וַ/אֲנִ֣י אֶעֱנֶ֑ה ע֛וֹד הֵ֥ם מְדַבְּרִ֖ים וַ/אֲנִ֥י אֶשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/024.yaml
  text: And it will happen that before they call[a], I will answer; while they are still speaking[b], I will hear.
translation:
  language: pt
  text: E acontecerá que, antes que eles chamem[a], eu responderei; enquanto ainda estiverem falando[b], eu ouvirei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “clamem”. O verbo pode indicar chamar ou clamar, inclusive ao dirigir um apelo a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “enquanto ainda falarem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Reproduz de modo natural a fórmula profética que introduz uma situação futura, sem recorrer a linguagem arcaica.
- source_word: טֶרֶם
  choice: antes que
  rationale: Expressa com clareza a anterioridade temporal marcada pelo advérbio hebraico.
- source_word: יִקְרָאוּ
  choice: eles chamem
  rationale: Mantém a amplitude de קרא, que pode indicar chamar ou clamar, inclusive em apelo dirigido a Deus, sem explicitar além do hebraico que se trata de oração.
- source_word: אֶעֱנֶה
  choice: eu responderei
  rationale: Equivale naturalmente a ענה e forma o par semântico esperado com 'chamem'.
- source_word: עוֹד הֵם מְדַבְּרִים
  choice: enquanto ainda estiverem falando
  rationale: Comunica a ação contínua e ainda em curso expressa por עוֹד com o particípio, em português corrente e solene.
- source_word: אֶשְׁמָע
  choice: eu ouvirei
  rationale: Preserva o sentido básico de שמע e deixa implícita, sem a acrescentar ao texto, a ideia contextual de atenção favorável.
theological_decisions:
- issue: Se o contexto de oração deve ser explicitado
  choice: Conservar os termos gerais 'chamem', 'responderei' e 'ouvirei'.
  alternative: Traduzir como 'antes que orem, eu responderei' ou 'eu os atenderei'.
  rationale: O contexto sugere apelo a Deus e resposta divina, mas o hebraico emprega verbos mais amplos. A redação escolhida preserva essa amplitude e não introduz uma interpretação mais específica no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das duas orações e o paralelismo hebraico foram preservados; o futuro do subjuntivo após 'antes que' e 'enquanto' produz uma formulação idiomática em português.
