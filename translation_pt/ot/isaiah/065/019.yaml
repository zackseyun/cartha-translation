id: ISA.65.19
reference: Isaiah 65:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גַלְתִּ֥י בִ/ירוּשָׁלִַ֖ם וְ/שַׂשְׂתִּ֣י בְ/עַמִּ֑/י וְ/לֹֽא יִשָּׁמַ֥ע בָּ/הּ֙ ע֔וֹד ק֥וֹל בְּכִ֖י וְ/ק֥וֹל זְעָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/019.yaml
  text: I will rejoice in Jerusalem and delight in my people[a]; no longer will the sound of weeping be heard in her[c][b], or the sound of crying.
translation:
  language: pt
  text: Eu me alegrarei em Jerusalém e terei prazer no meu povo[a]; nunca mais se ouvirá nela[b] o som de choro nem o som de clamor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por Jerusalém” e “por meu povo”. A preposição hebraica significa literalmente “em”, mas também pode ser entendida em sentido relacional.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nela”, referindo-se a Jerusalém, nome feminino em hebraico e em português.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “grito de aflição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַלְתִּי
  choice: Eu me alegrarei
  rationale: גיל expressa alegria ou exultação. O futuro é adequado ao contexto prospectivo das promessas, embora a forma hebraica seja qatal.
- source_word: בִירוּשָׁלִַם
  choice: em Jerusalém
  rationale: A preposição ב tem aqui seu sentido locativo direto, sem excluir a leitura relacional indicada em nota.
- source_word: וְשַׂשְׂתִּי
  choice: e terei prazer
  rationale: שׂושׂ é próximo de גיל, mas a formulação preserva alguma distinção entre os dois verbos de alegria e soa natural em português.
- source_word: בְעַמִּי
  choice: no meu povo
  rationale: Mantém o valor básico de ב e forma uma expressão portuguesa idiomática de satisfação afetuosa.
- source_word: יִשָּׁמַע
  choice: se ouvirá
  rationale: O nifal de שׁמע é naturalmente expresso pela construção passiva pronominal portuguesa.
- source_word: בָּהּ
  choice: nela
  rationale: O pronome feminino singular retoma Jerusalém e conserva, de modo natural em português, o gênero feminino da cidade.
- source_word: עוֹד
  choice: nunca mais
  rationale: Com a negação, עוֹד indica que a situação não voltará a ocorrer; 'nunca mais' é claro e idiomático.
- source_word: קוֹל בְּכִי
  choice: o som de choro
  rationale: Preserva a ênfase auditiva de קוֹל e traduz בְּכִי com linguagem corrente e digna.
- source_word: וְקוֹל זְעָקָה
  choice: nem o som de clamor
  rationale: זְעָקָה designa um grito ou clamor de aflição. 'Clamor' distingue o termo do choro precedente e preserva sua intensidade.
theological_decisions:
- issue: Personificação de Jerusalém no pronome feminino
  choice: Manter “nela”, referindo-se a Jerusalém
  alternative: Traduzir de modo impessoal como “ali”
  rationale: O hebraico usa pronome feminino singular. “Nela” conserva a referência gramatical e a textura literária sem acrescentar interpretação teológica.
- issue: Distinção entre dois verbos próximos de alegria
  choice: Usar “me alegrarei” e “terei prazer”
  alternative: Repetir “me alegrarei” ou usar “exultarei” e “me alegrarei”
  rationale: A diferenciação reflete os dois verbos hebraicos relacionados, evitando tanto a uniformização quanto um registro excessivamente elevado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética e o paralelismo foram preservados; “clamor” mantém a intensidade de זְעָקָה sem obscurecer o sentido.
