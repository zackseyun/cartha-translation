base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/006.yaml
  text: 'Look[a], it is written before me: I will not keep silent, but I will repay; indeed[b], I will repay into their lap.'
translation:
  language: pt
  text: 'Eis que está escrito diante de mim[a]: não ficarei calado; pelo contrário, retribuirei[b]; sim, retribuirei no regaço deles[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso permanece escrito diante de mim”.'
    reason: lexical_alternative
  - marker: b
    text: A forma hebraica é perfectiva e também pode ser traduzida literalmente por “retribuí”; no anúncio profético, ela apresenta a retribuição futura como certa.
    reason: textual_ambiguity
  - marker: c
    text: 'Ou: “no colo deles”. A imagem hebraica é a da retribuição devolvida diretamente à própria pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Introduz uma declaração solene e chama a atenção para ela. “Eis que” conserva a força dêitica do hebraico em linguagem bíblica digna e ainda compreensível.
- source_word: כְתוּבָה לְפָנַי
  choice: está escrito diante de mim
  rationale: O particípio passivo com a expressão preposicional apresenta um registro escrito que permanece perante Deus. A formulação preserva tanto a imagem do registro quanto sua presença contínua.
- source_word: לֹא אֶחֱשֶׂה
  choice: não ficarei calado
  rationale: O verbo חשה denota ficar ou permanecer em silêncio. A expressão portuguesa comunica aqui a decisão futura de Deus de não deixar de agir.
- source_word: כִּי אִם
  choice: pelo contrário
  rationale: 'Depois da negação, a locução hebraica introduz o contraste positivo: Deus não permanecerá calado, mas responderá mediante retribuição.'
- source_word: שִׁלַּמְתִּי
  choice: retribuirei
  rationale: Embora a forma hebraica seja perfectiva, no anúncio profético ela pode apresentar como certa uma ação futura. “Retribuirei” preserva a reciprocidade judicial sem especificar uma modalidade de castigo além do texto.
- source_word: וְשִׁלַּמְתִּי
  choice: sim, retribuirei
  rationale: A repetição intensifica a certeza da declaração. “Sim” transmite essa confirmação sem reduzir a segunda ocorrência a mera coordenação.
- source_word: עַל חֵיקָם
  choice: no colo deles
  rationale: חֵיק designa a região do colo ou peito, e a expressão retrata a retribuição devolvida diretamente à própria pessoa. “No colo deles” conserva a metáfora em português atual.
theological_decisions:
- issue: Força aspectual e temporal de שִׁלַּמְתִּי / וְשִׁלַּמְתִּי
  choice: 'Sentido futuro: “retribuirei; sim, retribuirei”'
  alternative: 'Sentido perfectivo: “retribuí; sim, retribuí” ou “tenho retribuído”'
  rationale: No discurso profético de juízo, o perfeito pode apresentar uma ação futura como decidida e certa. O contexto favorece o futuro, mas a nota registra a forma perfectiva sem resolver silenciosamente a tensão aspectual.
- issue: Natureza da retribuição
  choice: Retribuição judicial sem maior especificação
  alternative: Castigo ou vingança
  rationale: O verbo שׁלם exprime pagamento ou retribuição. “Retribuir” conserva a correspondência judicial e evita estreitar o sentido com uma interpretação não explicitada no versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” mantém a abertura enfática; “colo” evita o arcaísmo de “regaço”, enquanto a nota preserva a imagem corporal alternativa. A pontuação destaca a negação, o contraste e a repetição enfática.
