  text: הַ/יֹּֽשְׁבִים֙ בַּ/קְּבָרִ֔ים וּ/בַ/נְּצוּרִ֖ים יָלִ֑ינוּ הָ/אֹֽכְלִים֙ בְּשַׂ֣ר הַ/חֲזִ֔יר ו/פרק פִּגֻּלִ֖ים כְּלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/004.yaml
  text: who sit among the graves and spend the night in hidden places[a], who eat pig's flesh, and broth of unclean things is in their vessels[b];
translation:
  language: pt
  text: os que se assentam entre os túmulos e passam a noite em lugares ocultos[a], os que comem carne de porco e em seus recipientes há caldo de coisas impuras[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em lugares secretos”. O termo hebraico é difícil e também tem sido entendido como “em lugares guardados” ou, com menor probabilidade neste contexto, “em lugares sitiados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sopa” ou “ensopado” de coisas impuras ou repugnantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשְׁבִים
  choice: os que se assentam
  rationale: O particípio qal de ישׁב descreve substantivamente essas pessoas. “Assentam-se” preserva a imagem concreta, podendo também sugerir que permanecem no local.
- source_word: בַּקְּבָרִים
  choice: entre os túmulos
  rationale: קברים designa sepulturas ou túmulos. Neste contexto, “entre” exprime naturalmente a presença no ambiente dos túmulos sem exigir que estejam dentro deles.
- source_word: וּבַנְּצוּרִים
  choice: em lugares ocultos
  rationale: O termo נְצוּרִים é difícil. Em paralelo com os túmulos e com a permanência noturna, “lugares ocultos” é uma leitura contextual plausível; a incerteza lexical é registrada em nota.
- source_word: יָלִינוּ
  choice: passam a noite
  rationale: O verbo לין significa alojar-se ou permanecer durante a noite. “Passam a noite” é direto e natural em português.
- source_word: הָאֹכְלִים
  choice: os que comem
  rationale: O particípio substantivado continua a descrição do grupo e é reproduzido pela construção relativa portuguesa.
- source_word: בְּשַׂר הַחֲזִיר
  choice: carne de porco
  rationale: A expressão mantém a referência concreta ao animal e sua força no contexto de impureza ritual, sem recorrer a uma formulação arcaizante.
- source_word: ופרק
  choice: caldo
  rationale: A forma rara é tradicionalmente entendida como um alimento líquido, caldo, sopa ou ensopado. “Caldo” combina bem com a menção aos recipientes, enquanto a incerteza é preservada em nota.
- source_word: פִּגֻּלִים
  choice: coisas impuras
  rationale: O termo indica coisas ritualmente contaminadas ou repugnantes, especialmente em contexto alimentar ou sacrificial. “Impuras” comunica esse aspecto sem ampliar indevidamente o sentido.
- source_word: כְּלֵיהֶם
  choice: seus recipientes
  rationale: כְּלִי é um termo amplo para utensílio, vaso ou recipiente. “Recipientes” conserva essa generalidade e soa corrente em português.
theological_decisions:
- issue: Linguagem relativa a alimentos ritualmente ofensivos
  choice: Manter as imagens concretas de carne de porco, caldo, recipientes e coisas impuras.
  alternative: Generalizar como “alimentos proibidos” ou “abominações”.
  rationale: A formulação conserva a denúncia de práticas associadas à impureza e ao culto ilícito sem introduzir categorias doutrinárias posteriores nem explicar além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe participial foi mantida por meio de “os que”, e as duas incertezas lexicais relevantes foram preservadas em notas.
