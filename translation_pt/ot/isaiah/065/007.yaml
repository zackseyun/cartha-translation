  text: עֲ֠וֺנֹתֵי/כֶם וַ/עֲוֺנֹ֨ת אֲבוֹתֵי/כֶ֤ם יַחְדָּו֙ אָמַ֣ר יְהוָ֔ה אֲשֶׁ֤ר קִטְּרוּ֙ עַל הֶ֣/הָרִ֔ים וְ/עַל הַ/גְּבָע֖וֹת חֵרְפ֑וּ/נִי וּ/מַדֹּתִ֧י פְעֻלָּתָ֛/ם רִֽאשֹׁנָ֖ה על חֵיקָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/007.yaml
  text: your iniquities and the iniquities of your fathers together[a], says Yahweh, because they burned incense on the mountains and reproached me on the hills[b]; so I will measure their former deed into their lap.
translation:
  language: pt
  text: As iniquidades de vocês e as iniquidades de seus antepassados, todas juntas — diz Yahweh —, porque queimaram incenso nos montes e me afrontaram nas colinas; por isso, medirei no colo deles a sua obra anterior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “medirei no colo deles” descreve uma retribuição entregue direta e pessoalmente. A palavra traduzida por “obra” também pode significar “sua retribuição”.
    reason: Alternativa lexical e esclarecimento de expressão idiomática.
lexical_decisions:
- source_word: עֲוֺנֹתֵיכֶם
  choice: as iniquidades de vocês
  rationale: “Iniquidades” preserva tanto a gravidade moral de עָוֹן quanto sua relação contextual com culpa e juízo; “de vocês” oferece leitura portuguesa ampla e clara.
- source_word: וַעֲוֺנֹת אֲבוֹתֵיכֶם
  choice: e as iniquidades de seus antepassados
  rationale: “Antepassados” comunica naturalmente a referência histórica de אָבוֹת sem sugerir apenas os pais imediatos; o masculino gramatical do hebraico não exige restringir o sentido em português.
- source_word: יַחְדָּו
  choice: todas juntas
  rationale: Expressa que as iniquidades da geração presente e as dos antepassados são consideradas conjuntamente, sem resolver a tensão sobre culpa intergeracional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֲשֶׁר
  choice: porque
  rationale: Neste contexto, a partícula introduz a razão do juízo, embora formalmente também possa funcionar como relativo.
- source_word: קִטְּרוּ
  choice: queimaram incenso
  rationale: Representa diretamente o uso cultual do piel de קטר.
- source_word: עַל הֶהָרִים וְעַל הַגְּבָעוֹת
  choice: nos montes ... nas colinas
  rationale: Mantém os dois locais explicitamente nomeados e preserva o paralelismo entre as ações.
- source_word: חֵרְפוּנִי
  choice: me afrontaram
  rationale: “Afrontaram” traduz com dignidade e clareza a ideia de insultar, ultrajar ou tratar com desprezo.
- source_word: וּמַדֹּתִי
  choice: por isso, medirei
  rationale: Preserva a metáfora de medir e explicita naturalmente a consequência do motivo apresentado.
- source_word: פְעֻלָּתָם
  choice: o que fizeram
  rationale: Traduz o sentido de ação ou obra sem decidir pelo possível sentido alternativo de recompensa, que é registrado em nota.
- source_word: רִאשֹׁנָה
  choice: anteriormente
  rationale: Comunica o caráter prévio da conduta, evitando o português menos natural “primeiramente” ou a leitura rígida de uma única “primeira obra”.
- source_word: עַל חֵיקָם
  choice: no colo deles
  rationale: Conserva a imagem hebraica de retribuição colocada diretamente no colo da pessoa; a nota esclarece o valor idiomático.
theological_decisions:
- issue: Culpa e juízo entre gerações
  choice: Manter lado a lado as iniquidades da geração presente e as dos antepassados, consideradas conjuntamente.
  alternative: Entender que os descendentes são punidos pelos pecados ancestrais independentemente de sua própria conduta.
  rationale: O verso menciona explicitamente tanto “as iniquidades de vocês” quanto as dos antepassados. A tradução mantém essa tensão sem impor uma harmonização doutrinária externa.
- issue: Sentido de פְעֻלָּתָם no contexto de juízo
  choice: Traduzir como “o que fizeram”.
  alternative: “a sua retribuição” ou “o seu pagamento”.
  rationale: O sentido punitivo já aparece na imagem de medir no colo; traduzir o substantivo como a conduta evita redundância, enquanto a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês”, “antepassados” e “colo” por naturalidade contemporânea, preservando o paralelismo, a metáfora judicial e a ambiguidade lexical relevante.
