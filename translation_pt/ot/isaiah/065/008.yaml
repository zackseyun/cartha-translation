  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כַּ/אֲשֶׁ֨ר יִמָּצֵ֤א הַ/תִּירוֹשׁ֙ בָּֽ/אֶשְׁכּ֔וֹל וְ/אָמַר֙ אַל תַּשְׁחִיתֵ֔/הוּ כִּ֥י בְרָכָ֖ה בּ֑/וֹ כֵּ֤ן אֶֽעֱשֶׂה֙ לְמַ֣עַן עֲבָדַ֔/י לְ/בִלְתִּ֖י הַֽשְׁחִ֥ית הַ/כֹּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/008.yaml
  text: 'Thus says Yahweh: As when new wine is found in a cluster[a], and one says, ‘Do not destroy it, for there is a blessing in it,’ so I will act for the sake of my servants[b], so as not to destroy all of them.'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Como quando se encontra vinho novo num cacho[a] e alguém diz: ‘Não o destrua, pois há nele uma bênção’, assim agirei por causa dos meus servos, para não destruir tudo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho” ou “vinho fresco”; o hebraico תִּירוֹשׁ se refere especificamente ao vinho novo.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “para não destruir tudo” ou “para não destruir o todo”; o hebraico deixa implícito o referente, que no contexto pode ser entendido como o povo sob juízo: “para não destruir todos eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética consagrada, formal e ainda natural em português contemporâneo.
- source_word: כַּאֲשֶׁר
  choice: Como quando
  rationale: Introduz a situação comparativa retomada por כֵּן, sem reduzi-la a uma relação apenas temporal.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: Preserva a referência específica a vinho novo ou fresco e a imagem agrícola do texto.
- source_word: אֶשְׁכּוֹל
  choice: cacho
  rationale: No contexto, designa naturalmente um cacho de uvas; a forma concisa evita explicitação desnecessária.
- source_word: וְאָמַר
  choice: e alguém diz
  rationale: O verbo singular tem sujeito indefinido; “alguém” exprime isso de modo natural em português.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Não o destrua
  rationale: Mantém o sentido de שׁחת e a repetição lexical com a ocorrência final do mesmo verbo.
- source_word: כִּי בְרָכָה בּוֹ
  choice: pois há nele uma bênção
  rationale: Conserva a linguagem concreta de “bênção” e expressa com naturalidade sua presença no cacho.
- source_word: כֵּן אֶעֱשֶׂה
  choice: assim agirei
  rationale: Aplica a comparação à ação divina de maneira idiomática, sem ampliar o sentido.
- source_word: לְמַעַן עֲבָדַי
  choice: por causa dos meus servos
  rationale: Expressa a consideração ou motivação indicada por לְמַעַן; “servos” é adequado ao contexto profético.
- source_word: לְבִלְתִּי הַשְׁחִית הַכֹּל
  choice: para não destruir tudo
  rationale: Mantém a ausência de objeto pessoal explícito no hebraico e preserva a ambiguidade de הַכֹּל, esclarecida em nota.
theological_decisions:
- issue: Referente de הַכֹּל (“tudo/o todo”) na cláusula final
  choice: Manter no texto “não destruir tudo”, sem explicitar o referente
  alternative: “não destruir todos eles”, entendendo como referente o povo ou grupo sob juízo
  rationale: O contexto favorece a referência ao conjunto do povo, mas o hebraico deixa o objeto implícito. A tradução conserva essa abertura, enquanto a nota informa a leitura contextual provável sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo da comparação e a repetição de “destruir”. As aspas delimitam toda a fala divina, com aspas simples para a fala interna da pessoa que encontra o cacho.
