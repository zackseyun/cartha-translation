base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/016.yaml
  text: whoever blesses himself in the land will bless himself by the God of truth[a], and whoever swears in the land will swear by the God of truth; because the former troubles are forgotten[c][b], and because they are hidden from my eyes.
translation:
  language: pt
  text: Quem se abençoar na terra[b] se abençoará pelo Deus do Amém[a], e quem jurar na terra jurará pelo Deus do Amém; pois as aflições passadas foram esquecidas e estão ocultas aos meus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo Deus da verdade” ou “pelo Deus fiel”. O hebraico Amém expressa firmeza, fidelidade e verdade.'
    reason: alternative_reading
  - marker: b
    text: “Na terra” também pode ser entendido como “no país” ou “nesta terra”, conforme o alcance atribuído ao hebraico אֶרֶץ. “Se abençoar” pode significar invocar ou declarar uma bênção sobre si; o verbo hebraico é reflexivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּתְבָּרֵךְ / יִתְבָּרֵךְ
  choice: invocar uma bênção sobre si / fará isso
  rationale: Preserva o valor reflexivo do hitpael de ברך e exprime de modo natural a ideia de alguém declarar ou desejar para si uma bênção, sem reduzi-la a uma simples voz passiva.
- source_word: בָּאָרֶץ
  choice: na terra
  rationale: Em português, “terra” preserva melhor do que “país” a ambiguidade de אֶרֶץ entre território e mundo habitado; a nota explicita a possibilidade mais local.
- source_word: בֵּאלֹהֵי אָמֵן
  choice: pelo Deus do Amém
  rationale: Mantém o incomum epíteto hebraico אָמֵן e suas associações com firmeza, fidelidade e verdade, sem escolher silenciosamente apenas uma dessas dimensões.
- source_word: הַנִּשְׁבָּע / יִשָּׁבַע
  choice: quem jurar / jurará
  rationale: Traduz de maneira direta e idiomática o nifal de שׁבע, que aqui significa jurar ou prestar juramento.
- source_word: הַצָּרוֹת הָרִאשֹׁנוֹת
  choice: as aflições passadas
  rationale: “Aflições” comunica o peso de צָרוֹת, enquanto “passadas” exprime o contraste temporal de רִאשֹׁנוֹת em português corrente.
- source_word: נִשְׁכְּחוּ ... נִסְתְּרוּ מֵעֵינָי
  choice: foram esquecidas e estão ocultas aos meus olhos
  rationale: Conserva tanto o estado resultante dos perfeitos quanto a imagem antropomórfica do texto hebraico.
theological_decisions:
- issue: Sentido do epíteto בֵּאלֹהֵי אָמֵן
  choice: o Deus do Amém
  alternative: o Deus da verdade; o Deus fiel
  rationale: A transliteração preserva a formulação singular e a tensão semântica do hebraico, enquanto a nota oferece os sentidos interpretativos legítimos de verdade e fidelidade.
- issue: Alcance de בָּאָרֶץ
  choice: na terra
  alternative: no país; nesta terra
  rationale: “Terra” permite a leitura tanto territorial quanto mais ampla; a tradução não resolve indevidamente se a referência é à terra de Israel ou à terra em sentido abrangente.
- issue: Ocultação das aflições aos olhos de Deus
  choice: estão ocultas aos meus olhos
  alternative: foram afastadas da minha vista
  rationale: A expressão concreta do hebraico é mantida sem explicar teologicamente de que modo Deus deixa de considerar as aflições anteriores.
translation_notes:
  register: Português atual, digno e de leitura ampla, com preferência por uma formulação clara sem eliminar as ambiguidades do hebraico. “Deus do Amém” é deliberadamente incomum, como o epíteto na fonte, e recebe explicação em nota.
