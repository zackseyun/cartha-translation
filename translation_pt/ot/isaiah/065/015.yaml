source:
  edition: WLC
  text: וְ/הִנַּחְתֶּ֨ם שִׁמְ/כֶ֤ם לִ/שְׁבוּעָה֙ לִ/בְחִירַ֔/י וֶ/הֱמִיתְ/ךָ֖ אֲדֹנָ֣/י יְהוִ֑ה וְ/לַ/עֲבָדָ֥י/ו יִקְרָ֖א שֵׁ֥ם אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/015.yaml
  text: You will leave your name as a curse for my chosen ones[a], and the Lord Yahweh will put you to death[b]; but to his servants he will call another name.
translation:
  language: pt
  text: Vocês deixarão seu nome como uma maldição para os meus escolhidos[a], e o Senhor Yahweh matará você[b]; mas dará outro nome aos seus servos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como fórmula de juramento”; neste contexto, o nome seria usado numa maldição pronunciada ao jurar.
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa aqui do plural (“vocês”, “seu”) para o singular (“você”).
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְהִנַּחְתֶּם
  choice: vocês deixarão
  rationale: O hifil de נוח/הניח, com “nome” como objeto, indica deixar para trás ou deixar como algo; “deixarão” é natural e se liga bem a “como maldição”.
- source_word: שִׁמְכֶם
  choice: o nome de vocês
  rationale: Preserva o sentido de nome como designação ou reputação que permanecerá para uso posterior, além do número plural do sufixo hebraico.
- source_word: לִשְׁבוּעָה
  choice: como maldição
  rationale: Embora שְׁבוּעָה costume significar “juramento”, neste contexto de juízo designa uma fórmula de maldição empregada ao jurar. A alternativa mais literal é registrada em nota.
- source_word: לִבְחִירַי
  choice: para os meus escolhidos
  rationale: Reproduz o plural substantivado com sufixo de primeira pessoa e soa natural em português.
- source_word: וֶהֱמִיתְךָ
  choice: matará você
  rationale: O hifil de מות expressa causar a morte. A forma “matará” é direta e atual; “você” conserva a mudança do plural anterior para o objeto singular no hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי quanto o nome divino יְהוִה, sem produzir a repetição “Senhor SENHOR”.
- source_word: וְלַעֲבָדָיו
  choice: mas ... aos seus servos
  rationale: A conjunção introduz contraste entre o destino do grupo julgado e o dos que pertencem a Deus. “Servos” destaca serviço e pertencimento, sem tornar a condição de escravidão o foco.
- source_word: יִקְרָא שֵׁם אַחֵר
  choice: dará outro nome
  rationale: Literalmente, “chamará outro nome”. Em português, “dará outro nome” comunica com naturalidade a atribuição de uma nova designação aos servos.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha preserva de modo transparente o título “Senhor” e o nome pactual Yahweh presentes no hebraico.
- issue: Sentido de עֲבָדָיו
  choice: seus servos
  alternative: seus escravos
  rationale: Neste contraste, o ponto principal é pertencer a Deus e servi-lo; a condição social de escravidão não está em primeiro plano.
- issue: Mudança de número na pessoa interpelada
  choice: “Vocês” no início e “você” em seguida
  alternative: uniformizar tudo no plural
  rationale: O hebraico passa de formas plurais em וְהִנַּחְתֶּם e שִׁמְכֶם para o sufixo masculino singular em וֶהֱמִיתְךָ. A tradução conserva essa tensão textual em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” e “você” para tornar visível a mudança de número do hebraico. A expressão idiomática “dará outro nome” foi preferida à construção pouco natural “chamará outro nome”.
