source:
  edition: WLC
  text: כִּֽי אִם שִׂ֤ישׂוּ וְ/גִ֨ילוּ֙ עֲדֵי עַ֔ד אֲשֶׁ֖ר אֲנִ֣י בוֹרֵ֑א כִּי֩ הִנְ/נִ֨י בוֹרֵ֧א אֶת יְרוּשָׁלִַ֛ם גִּילָ֖ה וְ/עַמָּ֥/הּ מָשֽׂוֹשׂ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/018.yaml
  text: But be glad and rejoice forever in what I am creating; for behold[a], I am creating Jerusalem as rejoicing, and her people as joy.
translation:
  language: pt
  text: Mas alegrem-se e exultem para sempre no que estou criando, pois eis que estou criando Jerusalém para exultação, e seu povo para alegria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «estou criando Jerusalém como uma exultação, e seu povo como uma alegria».'
    reason: O hebraico também permite entender os substantivos como complementos predicativos ou resultativos, em vez de indicação de finalidade.
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: No contexto, a combinação introduz contraste com a ordem anterior de não recordar as coisas passadas; «Mas» expressa isso naturalmente.
- source_word: שִׂישׂוּ
  choice: alegrem-se
  rationale: O verbo exprime alegria intensa; esta escolha o distingue do verbo seguinte e preserva o par poético.
- source_word: וְגִילוּ
  choice: e exultem
  rationale: «Exultem» conserva a intensidade de גיל e evita fundir os dois verbos quase sinônimos.
- source_word: עֲדֵי עַד
  choice: para sempre
  rationale: Forma portuguesa corrente e digna para o idioma de duração contínua.
- source_word: אֲשֶׁר אֲנִי בוֹרֵא
  choice: no que estou criando
  rationale: A oração relativa indica aquilo em que ou por causa de que o povo deve alegrar-se, preservando a forma participial da ação divina.
- source_word: הִנְנִי
  choice: eis que
  rationale: Marca o anúncio divino enfático em registro profético solene, sem arcaísmo excessivo.
- source_word: בוֹרֵא
  choice: estou criando
  rationale: O particípio apresenta a ação como atual ou iminente; o progressivo português mantém sua vivacidade.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: גִּילָה
  choice: como exultação
  rationale: Preserva a relação lexical com וְגִילוּ e a possível função predicativa/resultativa do substantivo após «criar».
- source_word: וְעַמָּהּ
  choice: e o seu povo
  rationale: O possessivo remete a Jerusalém; a formulação é natural e conserva a personificação da cidade.
- source_word: מָשׂוֹשׂ
  choice: como alegria
  rationale: Mantém o paralelismo predicativo com «como exultação» e representa o substantivo de alegria.
theological_decisions:
- issue: Função dos substantivos predicativos גִּילָה e מָשׂוֹשׂ depois de ברא
  choice: Jerusalém é criada como exultação, e seu povo como alegria
  alternative: Jerusalém é criada para exultação, e seu povo para alegria
  rationale: O hebraico permite uma leitura predicativa/resultativa ou final. O texto principal conserva a imagem poética de identidade transformada; a nota registra a leitura final sem decidir além da evidência linguística.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com legibilidade brasileira. O par «alegrem-se e exultem» conserva os dois verbos hebraicos, e «eis que» mantém a solenidade do anúncio profético. O marcador da nota aparece no texto principal.
