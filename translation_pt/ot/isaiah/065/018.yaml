    reason: O hebraico também permite entender os substantivos como complementos predicativos ou resultativos, em vez de indicação de finalidade.
  revision_rationale: A revisão substitui uma construção marcada e potencialmente comparativa por uma formulação portuguesa natural que representa a leitura final possível. A nota conserva a leitura predicativa/resultativa do hebraico, sem resolver uma ambiguidade que o texto-fonte permite. Também reposiciona o marcador junto à unidade anotada.
