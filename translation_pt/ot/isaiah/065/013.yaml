language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה עֲבָדַ֤/י יֹאכֵ֨לוּ֙ וְ/אַתֶּ֣ם תִּרְעָ֔בוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׁתּ֖וּ וְ/אַתֶּ֣ם תִּצְמָ֑אוּ הִנֵּ֧ה עֲבָדַ֛/י יִשְׂמָ֖חוּ וְ/אַתֶּ֥ם תֵּבֹֽשׁוּ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/013.yaml
  text: 'Therefore this is what the Lord GOD says: Look[a], my servants will eat, but you will be hungry; look, my servants will drink, but you will be thirsty; look, my servants will rejoice[b], but you will be put to shame.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: “Eis que os meus servos[a] comerão, mas vocês passarão fome; eis que os meus servos beberão, mas vocês passarão sede; eis que os meus servos se alegrarão, mas vocês serão envergonhados[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode ser traduzido como “meus escravos”; aqui, “meus servos” se ajusta melhor ao contexto daqueles que pertencem a Deus e o servem.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficarão envergonhados”. O hebraico pode indicar tanto sentir vergonha quanto sofrer vergonha ou desonra.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca a consequência da acusação anterior e introduz o contraste entre bênção e juízo de forma natural em português.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional com clareza e dignidade.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando fundi-los ou repetir “Senhor”.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a função enfática de chamar a atenção para cada um dos três contrastes, em registro profético ainda compreensível.
- source_word: עֲבָדַי
  choice: os meus servos
  rationale: O termo pode indicar servos ou escravos; neste contexto, ressalta os que pertencem a Deus e o servem, sem exigir a especificação da condição social.
- source_word: יֹאכֵלוּ / תִּרְעָבוּ
  choice: comerão / passarão fome
  rationale: Expressa com naturalidade o contraste concreto entre ter alimento e sofrer fome.
- source_word: יִשְׁתּוּ / תִּצְמָאוּ
  choice: beberão / passarão sede
  rationale: Preserva o paralelismo e emprega uma expressão portuguesa corrente para sofrer sede.
- source_word: יִשְׂמָחוּ
  choice: se alegrarão
  rationale: Comunica a alegria futura em linguagem natural e compatível com o tom elevado da passagem.
- source_word: תֵּבֹשׁוּ
  choice: serão envergonhados
  rationale: Conserva o sentido de sofrer vergonha ou desonra no contexto de juízo, sem excluir inteiramente a experiência subjetiva de vergonha.
- source_word: וְאַתֶּם
  choice: mas vocês
  rationale: Embora וְ seja literalmente “e”, a estrutura repetida estabelece um contraste adversativo inequívoco; “mas” o comunica naturalmente.
theological_decisions:
- issue: Representação do nome divino na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR; o Senhor Deus
  rationale: A tradução mantém separadamente o título אֲדֹנָי e o nome pessoal יהוה, tornando visível o nome divino presente no hebraico e evitando a forma pouco natural “Senhor SENHOR”.
- issue: Natureza da vergonha anunciada em תֵּבֹשׁוּ
  choice: serão envergonhados
  alternative: ficarão envergonhados; serão desonrados
  rationale: No contexto de reversão judicial, a forma escolhida destaca a desonra sofrida, mas a nota preserva a possibilidade de o verbo também indicar sentir vergonha.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “eis que” conserva a ênfase e o ritmo profético do hebraico; “vocês” torna explícito o plural da segunda pessoa sem regionalismo excessivo.
