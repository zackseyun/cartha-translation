  text: הָ/עָ֗ם הַ/מַּכְעִיסִ֥ים אוֹתִ֛/י עַל פָּנַ֖/י תָּמִ֑יד זֹֽבְחִים֙ בַּ/גַּנּ֔וֹת וּֽ/מְקַטְּרִ֖ים עַל הַ/לְּבֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/003.yaml
  text: the people who continually provoke me to my face[a], sacrificing in the gardens and burning incense on the bricks.
translation:
  language: pt
  text: o povo que me provoca continuamente, bem diante de mim, sacrificando nos jardins e queimando incenso sobre os tijolos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sobre os tijolos”. A expressão provavelmente se refere a estruturas cultuais ou altares de tijolos usados em práticas de culto condenadas aqui.'
    reason: Esclarece o provável referente cultual sem inserir “altares” no texto principal.
lexical_decisions:
- source_word: הָעָם
  choice: o povo
  rationale: O artigo definido aponta para um grupo já identificado no contexto; “o povo” preserva o sentido coletivo sem especificá-lo como nação.
- source_word: הַמַּכְעִיסִים
  choice: que me provoca
  rationale: O hiphil de כעס expressa causar ira ou provocar; “provoca” comunica a ação deliberada e desafiadora em português natural.
- source_word: עַל־פָּנַי
  choice: bem diante de mim
  rationale: A expressão significa literalmente “sobre o meu rosto” e, neste contexto, indica afronta aberta na própria presença de Deus. “Bem diante de mim” conserva essa força sem recorrer ao coloquialismo “na minha cara”.
- source_word: תָּמִיד
  choice: continuamente
  rationale: O advérbio descreve uma conduta persistente e repetida.
- source_word: זֹבְחִים
  choice: sacrificando
  rationale: O particípio retrata atividade cultual contínua; a forma verbal é concisa e mantém o sentido ritual.
- source_word: בַּגַּנּוֹת
  choice: nos jardins
  rationale: Tradução locativa direta que preserva a imagem, sem acrescentar que os jardins fossem explicitamente santuários.
- source_word: וּמְקַטְּרִים
  choice: e queimando incenso
  rationale: No contexto cultual, o piel de קטר se refere à produção de fumaça ritual, normalmente pela queima de incenso.
- source_word: עַל־הַלְּבֵנִים
  choice: sobre os tijolos
  rationale: O hebraico menciona literalmente “os tijolos”, sem nomear altares. A tradução mantém a abertura lexical, enquanto a nota explica o provável uso cultual.
theological_decisions:
- issue: Natureza cultual de עַל־הַלְּבֵנִים
  choice: sobre os tijolos
  alternative: sobre altares de tijolos
  rationale: Embora o contexto de sacrifícios e incenso sugira instalações cultuais feitas de tijolos, o substantivo hebraico não diz explicitamente “altares”. O texto principal preserva essa ambiguidade e a nota apresenta a interpretação provável.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Bem diante de mim” transmite afronta aberta sem a informalidade de “na minha cara”. A ordem das ações acompanha de perto o hebraico.
