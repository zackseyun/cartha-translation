  text: נִדְרַ֨שְׁתִּי֙ לְ/ל֣וֹא שָׁאָ֔לוּ נִמְצֵ֖אתִי לְ/לֹ֣א בִקְשֻׁ֑/נִי אָמַ֨רְתִּי֙ הִנֵּ֣/נִי הִנֵּ֔/נִי אֶל גּ֖וֹי לֹֽא קֹרָ֥א בִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/001.yaml
  text: I let myself be sought by those who did not ask[a]; I let myself be found by those who did not seek me. I said, ‘Here I am[b], here I am,’ to a nation that did not call on my name.
translation:
  language: pt
  text: 'Deixei que me procurassem os que não perguntavam por mim[a]; deixei que me encontrassem os que não me buscavam. Eu disse: “Aqui estou, aqui estou”, a uma nação[b] que não invocava o meu nome.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Fui procurado pelos que não perguntavam; fui encontrado pelos que não me buscavam”. As formas hebraicas podem ser entendidas como passivos simples, embora o contexto sugira que Deus se deu a conhecer a quem não o procurava.'
    reason: lexical_alternative
  - marker: b
    text: Paulo cita este versículo em Romanos 10:20 ao falar dos gentios. Por isso, “nação” pode ser entendida nesse sentido canônico mais amplo.
    reason: cross_reference
lexical_decisions:
- source_word: נִדְרַשְׁתִּי
  choice: Deixei que me procurassem
  rationale: O nifal pode ser traduzido como passivo simples, “fui procurado”, mas, no contexto e em paralelo com נִמְצֵאתִי, também comunica que Deus se tornou acessível. A formulação escolhida é natural em português e mantém essa nuance sem afirmar mais do que o texto permite.
- source_word: לְלֹא שָׁאָלוּ
  choice: os que não perguntavam por mim
  rationale: שׁאל significa “perguntar” ou “consultar”. A expressão “perguntar por mim” é idiomática em português e explicita a relação exigida pelo contexto, embora o objeto não esteja expresso separadamente no hebraico.
- source_word: נִמְצֵאתִי
  choice: deixei que me encontrassem
  rationale: O nifal de מצא significa literalmente “fui encontrado”. A construção com “deixei que” preserva aqui a ideia contextual de disponibilidade e manifestação divina, em paralelo com a primeira oração.
- source_word: לְלֹא בִקְשֻׁנִי
  choice: os que não me buscavam
  rationale: בקשׁ tem o sentido direto de “buscar” ou “procurar”, e o sufixo pronominal exige “me”. “Buscar” evita repetição lexical excessiva e conserva o paralelismo de sentido.
- source_word: הִנֵּנִי הִנֵּנִי
  choice: Aqui estou, aqui estou
  rationale: A expressão indica presença e disponibilidade. A repetição enfática do hebraico é mantida, e “Aqui estou” é claro, atual e digno em português.
- source_word: גּוֹי
  choice: nação
  rationale: גוי designa basicamente uma “nação”. A tradução evita inserir “gentios” diretamente no texto, deixando a aplicação canônica indicada em nota.
- source_word: לֹא קֹרָא בִשְׁמִי
  choice: que não invocava o meu nome
  rationale: A construção ativa קרא בְּשֵׁם significa chamar ou invocar o nome de alguém. “Invocava o meu nome” comunica com clareza o sentido religioso da expressão sem confundi-la com “ser chamada pelo meu nome”.
theological_decisions:
- issue: Se a manifestação divina aos gentios deve ser explicitada no texto principal
  choice: Manter “nação” no texto e registrar em nota a aplicação de Paulo aos gentios.
  alternative: Traduzir גּוֹי como “gentios” ou “nação gentia”.
  rationale: O hebraico diz genericamente “nação”, enquanto Romanos 10:20 aplica o versículo aos gentios. Separar tradução e aplicação canônica preserva tanto o valor lexical quanto a conexão intertextual.
- issue: Se os nifais devem ser apresentados apenas como passivos ou como atos de autodeclaração divina
  choice: Traduzir com “deixei que me...”, registrando em nota o passivo mais literal.
  alternative: “Fui procurado... fui encontrado.”
  rationale: As formas hebraicas admitem o passivo simples, mas o contexto ressalta que Deus se apresenta a quem não o buscava. A nota preserva a ambiguidade gramatical genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A dicção é simples e digna; mantém-se a repetição enfática do hebraico e evita-se terminologia denominacional.
