base_translation:
  language: en
  yaml_path: translation/ot/isaiah/065/012.yaml
  text: And I will destine you for the sword[a], and all of you will bow down for the slaughter, because I called and you did not answer; I spoke and you did not listen. And you did what was evil in my eyes[d][c][b], and chose what I did not delight in.
translation:
  language: pt
  text: Eu os destinarei à espada[a], e todos vocês se curvarão para a matança[b], porque eu chamei, e vocês não responderam; falei, e vocês não escutaram[c]. Vocês fizeram o que era mau aos meus olhos e escolheram aquilo em que não tive prazer[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Eu os designarei” ou “Eu os contarei”. O verbo hebraico também pode formar um jogo de palavras com o “Destino” mencionado no versículo anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “se ajoelharão” ou “se agacharão”. O verbo hebraico se refere literalmente a dobrar os joelhos; aqui, retrata a queda sob o juízo.
    reason: lexical_alternative
  - marker: c
    text: Ou “não ouviram” ou, por implicação, “não obedeceram”.
    reason: lexical_alternative
  - marker: d
    text: Ou “aquilo que eu não desejava” ou “aquilo de que não tive prazer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָנִיתִי
  choice: Eu os destinarei
  rationale: O verbo מנה pode significar contar, designar ou destinar. “Destinarei” expressa a designação para o juízo e preserva a possível ironia com o nome “Destino” no versículo anterior, sem introduzir uma formulação doutrinária sobre predestinação.
- source_word: לַחֶרֶב
  choice: à espada
  rationale: Mantém a imagem hebraica convencional de entrega à morte pela espada, em formulação natural e concisa em português.
- source_word: לַטֶּבַח
  choice: para o abate
  rationale: טבח indica matança ou abate. A escolha conserva o paralelo concreto com “à espada” e a severidade da linguagem judicial.
- source_word: תִּכְרָעוּ
  choice: se curvarão
  rationale: כרע descreve o ato de dobrar os joelhos ou curvar-se. No contexto, sugere cair sob o juízo, mas a tradução mantém a imagem sem explicá-la dentro do texto.
- source_word: יַעַן
  choice: porque
  rationale: Introduz de maneira direta a causa do juízo anunciado.
- source_word: קָרָאתִי ... עֲנִיתֶם
  choice: eu chamei, e vocês não responderam
  rationale: Preserva o paralelismo entre chamar e responder, bem como a recusa culpável dos destinatários.
- source_word: דִּבַּרְתִּי ... שְׁמַעְתֶּם
  choice: falei, e vocês não escutaram
  rationale: “Escutaram” mantém tanto a dimensão auditiva quanto a ideia implícita de acolher e atender, sem resolver o verbo diretamente como “obedecer”.
- source_word: וַתַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: Vocês fizeram o que era mau aos meus olhos
  rationale: Reproduz de modo claro o idioma hebraico que apresenta a conduta como má segundo a avaliação de Deus.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בְּחַרְתֶּם
  choice: e escolheram aquilo que não me agradava
  rationale: חפץ pode comunicar desejo, prazer ou agrado. “Não me agradava” é natural em português e preserva a dimensão pessoal e volitiva da desaprovação divina.
theological_decisions:
- issue: Linguagem de juízo divino
  choice: “Eu os destinarei à espada ... todos vocês se curvarão para o abate”
  alternative: “Eu os contarei para a espada ... todos vocês cairão de joelhos para serem mortos”
  rationale: A formulação conserva a ação judicial direta de Deus e as imagens do hebraico, sem suavizar o juízo nem expandi-lo para uma afirmação doutrinária que o versículo não explicita.
- issue: Sentido de שׁמע na resposta à fala divina
  choice: “não escutaram”
  alternative: “não ouviram” ou “não obedeceram”
  rationale: “Escutaram” se encaixa no paralelo com “falei” e sugere recusa deliberada. A implicação de desobediência permanece presente, mas não é imposta como único sentido possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e conserva o encadeamento hebraico por meio de “e”, evitando tornar explícitas implicações que permanecem abertas no original.
