base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/002.yaml
  text: And he made my mouth like a sharp sword; in the shadow of his hand he hid me[a]. And he made me into a polished arrow; in his quiver he concealed me.
translation:
  language: pt
  text: E fez minha boca como uma espada afiada; à sombra de sua mão, escondeu-me. Fez de mim uma flecha polida[a]; em sua aljava, ocultou-me.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “flecha escolhida”, “flecha afiada” ou “flecha purificada”. O adjetivo hebraico transmite a ideia de algo purificado ou refinado e, neste contexto, provavelmente descreve uma flecha cuidadosamente preparada para uso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם פִּי
  choice: E fez minha boca
  rationale: O verbo שׂים significa pôr ou colocar, mas, com o complemento comparativo, “fez minha boca” expressa naturalmente o estado resultante sem substituir a imagem concreta da boca pela ideia abstrata de fala.
- source_word: כְּחֶרֶב חַדָּה
  choice: como uma espada afiada
  rationale: Preserva diretamente a comparação e a imagem de uma arma cortante, sem explicá-la como pregação, profecia ou discurso poderoso.
- source_word: בְּצֵל יָדוֹ
  choice: à sombra de sua mão
  rationale: Mantém a imagem hebraica de sombra, ao mesmo tempo que usa uma construção portuguesa natural, capaz de sugerir proteção e ocultação sem as explicitar.
- source_word: הֶחְבִּיאָנִי
  choice: escondeu-me
  rationale: O hifil de חבא indica esconder ou ocultar. A escolha é direta e corrente em português.
- source_word: וַיְשִׂימֵנִי לְחֵץ
  choice: Fez de mim uma flecha
  rationale: Com לְחֵץ, a construção apresenta o servo como feito ou preparado para ser uma flecha. “Fez de mim” comunica esse resultado de modo idiomático e sem ampliar a metáfora.
- source_word: בָּרוּר
  choice: polida
  rationale: O adjetivo pode descrever algo purificado, selecionado ou cuidadosamente preparado. Aplicado a uma flecha, “polida” oferece uma imagem concreta e plausível, enquanto a nota preserva alternativas legítimas.
- source_word: בְּאַשְׁפָּתוֹ
  choice: em sua aljava
  rationale: “Aljava” é o equivalente português preciso e corrente para o recipiente em que se guardam flechas; o sufixo possessivo foi preservado.
- source_word: הִסְתִּירָנִי
  choice: ocultou-me
  rationale: O hifil de סתר significa esconder ou ocultar. “Ocultou-me” mantém o sentido e evita repetição estilística desnecessária com “escondeu-me”.
theological_decisions:
- issue: Imagens de armas aplicadas à fala e à vocação do servo
  choice: Manter as metáforas concretas “espada afiada” e “flecha polida” sem explicar seu referente teológico no texto principal.
  alternative: Explicitar as imagens como fala poderosa, proclamação profética ou missão messiânica.
  rationale: O versículo apresenta imagens poéticas fortes, mas não define sozinho toda a sua aplicação. A tradução conserva a abertura e a tensão teológica do texto sem inserir uma interpretação confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A colocação pronominal “escondeu-me/ocultou-me” sustenta o registro poético sem soar arcaica em excesso. A repetição de “fez” acompanha o paralelismo hebraico, e o ponto e vírgula preserva o ritmo dos dois pares poéticos.
