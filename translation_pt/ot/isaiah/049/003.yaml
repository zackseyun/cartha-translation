  text: וַ/יֹּ֥אמֶר לִ֖/י עַבְדִּ/י אָ֑תָּה יִשְׂרָאֵ֕ל אֲשֶׁר בְּ/ךָ֖ אֶתְפָּאָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/003.yaml
  text: And he said to me[a], “You are my servant, Israel, in whom I will be glorified.”
translation:
  language: pt
  text: 'E ele me disse: “Você é o meu servo, Israel, em quem me glorificarei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele me disse
  rationale: O wayyiqtol de אמר dá continuidade à sequência; “E ele me disse” preserva essa progressão de modo natural em português.
- source_word: עַבְדִּי
  choice: o meu servo
  rationale: “Servo” é a tradução consagrada e contextualmente adequada em Isaías, destacando o serviço comissionado sem pôr em primeiro plano a condição de escravo.
- source_word: אָתָּה
  choice: Você é
  rationale: O pronome independente é explícito e enfático; em português, a cópula é necessária. “Você” oferece ampla legibilidade brasileira sem perder dignidade.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se o nome próprio em aposição a “meu servo”, sem decidir a identidade precisa do servo.
- source_word: בְּךָ
  choice: em quem
  rationale: A preposição ב com sufixo de segunda pessoa é literalmente “em você”; após o nome pessoal “Israel”, “em quem” preserva de modo natural a relação sintática.
- source_word: אֶתְפָּאָר
  choice: manifestarei a minha glória
  rationale: O hitpael de פאר pode indicar mostrar-se glorioso ou manifestar a própria glória. A formulação comunica a ação reflexiva de Deus de modo idiomático, sem tornar o verbo meramente passivo.
theological_decisions:
- issue: Identidade e função de “Israel” na interpelação ao servo
  choice: 'Conservar a interpelação direta: “Você é o meu servo, Israel”, sem explicar quem é Israel neste contexto.'
  alternative: Interpretar explicitamente “Israel” como a nação inteira, o remanescente fiel ou um servo individual que representa Israel.
  rationale: O versículo chama o servo de “Israel”, enquanto o contexto mais amplo mantém tensão entre identidade coletiva, remanescente e representação individual. A tradução não deve resolver essa questão doutrinariamente.
- issue: Agência na manifestação da glória divina
  choice: “manifestarei a minha glória”
  alternative: “serei glorificado” ou “glorificarei a mim mesmo”
  rationale: A escolha preserva a iniciativa divina sugerida pela forma verbal reflexiva, sem excluir o sentido de Deus ser glorificado no servo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem e a aposição do hebraico foram preservadas. Não se acrescentou nota porque a redação principal expressa adequadamente a nuance reflexiva; nenhuma variante indispensável exige marcação.
