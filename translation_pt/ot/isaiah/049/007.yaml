  - severity: low
    issue: “Ao detestado pela nação” é menos idiomático que uma oração relativa em português contemporâneo.
    rationale: A construção não é incorreta, mas “àquele que a nação detesta” soa mais natural e mantém o sentido de rejeição dirigido ao destinatário.
  - severity: low
