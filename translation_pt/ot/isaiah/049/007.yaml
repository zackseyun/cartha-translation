source:
  edition: WLC
  text: כֹּ֣ה אָֽמַר יְהוָה֩ גֹּאֵ֨ל יִשְׂרָאֵ֜ל קְדוֹשׁ֗/וֹ לִ/בְזֹה נֶ֜פֶשׁ לִ/מְתָ֤עֵֽב גּוֹי֙ לְ/עֶ֣בֶד מֹשְׁלִ֔ים מְלָכִים֙ יִרְא֣וּ וָ/קָ֔מוּ שָׂרִ֖ים וְ/יִֽשְׁתַּחֲוּ֑וּ לְמַ֤עַן יְהוָה֙ אֲשֶׁ֣ר נֶאֱמָ֔ן קְדֹ֥שׁ יִשְׂרָאֵ֖ל וַ/יִּבְחָרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/007.yaml
  text: 'Thus says Yahweh[a], the Redeemer of Israel, his Holy One, to one despised in soul, abhorred by the nation, a servant of rulers: Kings will see and rise up, princes also, and they will bow down, because of Yahweh, who is faithful, the Holy One of Israel[d][c][b], who has chosen you.'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Redentor de Israel, o seu Santo,[a] àquele que é profundamente desprezado,[b] àquele que a nação detesta,[c] ao escravo de governantes:[d]


    “Reis verão e se levantarão;

    príncipes se prostrarão,[e]

    por causa de Yahweh, que é fiel,

    o Santo de Israel, que escolheu você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o seu Santo”. O referente do sufixo “seu” não é plenamente explícito; a expressão pode ser entendida em relação a Israel ou, conforme outra análise sintática, ao destinatário da fala.
    reason: referent_clarification
  - marker: b
    text: Literalmente, “desprezado de alma”. A expressão hebraica é condensada e pode significar “profundamente desprezado” ou, possivelmente, “desprezado pelas pessoas”.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser entendido como “detestado pelas nações” ou “aquele que a nação detesta”.
    reason: lexical_alternative
  - marker: d
    text: O termo hebraico também pode ser traduzido como “servo de governantes”; aqui, “escravo” ressalta a condição de sujeição e humilhação.
    reason: lexical_alternative
  - marker: e
    text: O objeto de “se prostrarão” não está expresso no hebraico. O contexto pode relacionar o gesto à exaltação do destinatário, enquanto Yahweh é apresentado como sua razão última.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: גֹּאֵל
  choice: Redentor
  rationale: Conserva a ideia de resgate e restauração associada ao título, sem acrescentar uma relação jurídica de parentesco que não está explícita neste contexto.
- source_word: קְדוֹשׁוֹ
  choice: o seu Santo
  rationale: Reproduz o sufixo pronominal hebraico. O antecedente mais natural é Israel, antecipando o título completo “o Santo de Israel” no fim do versículo, sem eliminar a forma compacta do original.
- source_word: לִבְזֹה נֶפֶשׁ
  choice: àquele que é profundamente desprezado
  rationale: A expressão hebraica é condensada e difícil. Esta formulação comunica em português corrente a intensidade provável sem impor como certa uma análise específica de נֶפֶשׁ.
- source_word: לִמְתָעֵב גּוֹי
  choice: ao detestado pela nação
  rationale: Mantém o substantivo singular גּוֹי e o sentido de forte rejeição dirigido à pessoa interpelada.
- source_word: לְעֶבֶד מֹשְׁלִים
  choice: ao escravo de governantes
  rationale: “Escravo” torna explícita a condição humilhante de sujeição sugerida pelo contexto; a nota registra o sentido mais amplo “servo”.
- source_word: מְלָכִים יִרְאוּ וָקָמוּ
  choice: Reis verão e se levantarão
  rationale: Preserva a ausência de objeto expresso para “verão” e apresenta o levantar-se como gesto de honra.
- source_word: שָׂרִים וְיִשְׁתַּחֲווּ
  choice: príncipes se prostrarão
  rationale: “Príncipes” é adequado ao paralelismo com reis, e “se prostrarão” expressa claramente o gesto de homenagem sem defini-lo necessariamente como culto.
- source_word: לְמַעַן יְהוָה
  choice: por causa de Yahweh
  rationale: Expressa a força causal da locução e identifica Yahweh como a razão última da homenagem.
- source_word: אֲשֶׁר נֶאֱמָן
  choice: que é fiel
  rationale: Mantém a estrutura relativa e comunica a confiabilidade constante de Yahweh.
- source_word: קְדֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva o título divino característico de Isaías em formulação tradicional e inteligível.
- source_word: וַיִּבְחָרֶךָּ
  choice: que escolheu você
  rationale: Integra naturalmente a oração à descrição precedente de Yahweh e mantém explícita a segunda pessoa singular.
theological_decisions:
- issue: Referente de קְדוֹשׁוֹ (“o seu Santo”)
  choice: Manter o pronome e entender Israel como seu antecedente mais natural.
  alternative: Entender a expressão como uma designação do servo interpelado.
  rationale: A sequência “Redentor de Israel, o seu Santo” permite que o sufixo retome “Israel”, leitura corroborada pelo título explícito “Santo de Israel” mais adiante. A tradução conserva, porém, a forma pronominal compacta do hebraico em vez de expandi-la silenciosamente.
- issue: Destinatário da prostração dos príncipes
  choice: Não declarar um objeto para “se prostrarão”.
  alternative: Explicitar que eles se prostram diante do servo ou diante de Yahweh.
  rationale: O hebraico não expressa o objeto do verbo. O contexto relaciona o gesto à exaltação do servo e apresenta Yahweh como sua causa última; explicitar um destinatário resolveria uma tensão que o texto mantém.
- issue: Natureza do gesto expresso por וְיִשְׁתַּחֲווּ
  choice: Traduzir como homenagem corporal sem classificá-la explicitamente como adoração divina.
  alternative: Traduzir por “adorarão”.
  rationale: O verbo pode descrever prostração perante Deus ou perante uma autoridade humana. “Se prostrarão” preserva essa amplitude contextual.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe poética simples. Emprega “você” para a segunda pessoa singular por sua ampla legibilidade brasileira, sem coloquialismo. As repetições dos títulos divinos e o paralelismo hebraico foram preservados; expressões muito comprimidas receberam tradução clara acompanhada de notas.
