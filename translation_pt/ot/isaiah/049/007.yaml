  terminology: “Yahweh”, “Redentor” e “o Santo de Israel” são consistentes e apropriados. “Se prostrarão” preserva bem a amplitude de וְיִשְׁתַּחֲווּ sem impor que se trate de adoração divina. A nota sobre “o seu Santo” deve preservar a ambiguidade sintática e referencial, em vez de identificá-lo definitivamente com “o Santo de Israel”.
