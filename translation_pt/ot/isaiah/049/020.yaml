base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/020.yaml
  text: Yet the children of your bereavement will still say in your hearing[a], ‘The place is too cramped for me[b]; make room for me so that I may dwell.’
translation:
  language: pt
  text: 'Você ainda ouvirá os filhos da sua perda dizerem: “Este lugar está apertado demais para mim; abra espaço para mim, para que eu possa morar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֚וֹד
  choice: Ainda
  rationale: Expressa continuação ou persistência no contexto e combina naturalmente com o futuro profético.
- source_word: יֹאמְר֣וּ
  choice: dirão
  rationale: O imperfeito qal de אמר tem valor futuro neste contexto profético.
- source_word: בְ/אָזְנַ֔יִ/ךְ
  choice: aos seus ouvidos
  rationale: Preserva de modo claro e natural a imagem concreta do hebraico, isto é, palavras ditas diretamente na presença de Sião.
- source_word: בְּנֵ֖י שִׁכֻּלָ֑יִ/ךְ
  choice: os filhos que você perdeu
  rationale: Comunica de maneira natural que são os filhos ligados à perda sofrida por Sião, sem sugerir que eles próprios estejam enlutados.
- source_word: צַר לִ֥י הַמָּק֖וֹם
  choice: Este lugar está apertado demais para mim
  rationale: צַר descreve falta de espaço; a formulação transmite claramente a superlotação.
- source_word: גְּשָׁ/ה לִּ֥/י
  choice: dê-me espaço
  rationale: Embora נגשׁ costume significar literalmente aproximar-se, neste contexto de falta de espaço a expressão provavelmente pede que se abra lugar para quem fala.
- source_word: וְ/אֵשֵֽׁבָה
  choice: para que eu possa morar aqui
  rationale: ישׁב aqui indica habitar ou estabelecer-se; a construção final explicita naturalmente a finalidade do pedido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento de Sião no singular por “você”. A tradução prioriza clareza sem eliminar a personificação nem a imagem de uma cidade novamente cheia de filhos.
