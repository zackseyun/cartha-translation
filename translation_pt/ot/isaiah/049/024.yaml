  text: הֲ/יֻקַּ֥ח מִ/גִּבּ֖וֹר מַלְק֑וֹחַ וְ/אִם שְׁבִ֥י צַדִּ֖יק יִמָּלֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/024.yaml
  text: Can plunder be taken from a mighty man[b][a], or can the captives of a righteous one be rescued?
translation:
  language: pt
  text: Será que se pode tirar o despojo[a] de um homem poderoso, ou será que os cativos de um justo[b] podem ser libertados?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a presa”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os cativos de um justo”. A expressão é difícil neste contexto. Alguns a entendem de outra maneira, e algumas versões antigas refletem uma leitura mais próxima de “os cativos de um tirano” ou “de alguém terrível”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֻקַּח
  choice: Será que se pode tirar
  rationale: A partícula interrogativa com o imperfeito passivo de לקח introduz uma pergunta retórica; esta formulação preserva a força modal em português natural.
- source_word: מִגִּבּוֹר
  choice: de um homem poderoso
  rationale: גִּבּוֹר designa alguém forte ou poderoso, muitas vezes um guerreiro; a escolha mantém o sentido amplo sem impor a nuance militar.
- source_word: מַלְקוֹחַ
  choice: o despojo
  rationale: O substantivo denota aquilo que foi tomado, saque ou presa. “Despojo” é digno, compreensível e se ajusta ao paralelismo com os cativos.
- source_word: וְאִם
  choice: ou será que
  rationale: No paralelismo retórico, וְאִם introduz a segunda pergunta, e não uma condição propriamente dita.
- source_word: שְׁבִי
  choice: os cativos
  rationale: Embora possa significar “cativeiro”, o contexto favorece as pessoas capturadas, em paralelo com o despojo.
- source_word: צַדִּיק
  choice: de um justo
  rationale: Mantém o sentido lexical direto do Texto Massorético e preserva a dificuldade contextual, sem substituí-lo silenciosamente por uma interpretação como “tirano”.
- source_word: יִמָּלֵט
  choice: podem ser libertados
  rationale: O nifal de מלט expressa escapar ou ser livrado; a forma passiva harmoniza com a primeira metade do verso.
theological_decisions:
- issue: O sentido de צַדִּיק ao descrever aquele que mantém cativos
  choice: Manter “um justo” no texto principal.
  alternative: “um tirano”, “um opressor” ou leitura semelhante a “um terrível”.
  rationale: O hebraico massorético traz צַדִּיק, “justo”. Como isso gera uma tensão real no contexto e algumas versões antigas refletem outra leitura, a tradução preserva o texto recebido e registra a dificuldade em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção interrogativa conserva o paralelismo retórico; as notas registram a alternativa lexical e a dificuldade textual sem resolver a tensão no corpo do versículo.
