  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֵ/אמֹ֤ר לַֽ/אֲסוּרִים֙ צֵ֔אוּ לַ/אֲשֶׁ֥ר בַּ/חֹ֖שֶׁךְ הִגָּל֑וּ עַל דְּרָכִ֣ים יִרְע֔וּ וּ/בְ/כָל שְׁפָיִ֖ים מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/009.yaml
  text: saying to the prisoners[a], “Come out,” to those in darkness, “Show yourselves.” They will graze along the roads[b], and on all the bare heights will be their pasture.
translation:
  language: pt
  text: 'para dizer aos presos: “Saiam!”, e aos que estão nas trevas: “Apareçam!”[a] Eles pastarão ao longo dos caminhos, e em todas as elevações descampadas[b] terão pasto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mostrem-se!” ou “Sejam revelados!”'
    reason: lexical_alternative
  - marker: b
    text: Isto é, elevações expostas ou sem árvores; também se pode traduzir por “colinas descampadas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: para dizer
  rationale: O infinitivo construto introduz o conteúdo da missão mencionada no contexto anterior e mantém a ligação sintática com o versículo precedente.
- source_word: לַאֲסוּרִים
  choice: aos presos
  rationale: O particípio passivo de אסר designa pessoas amarradas ou encarceradas; “presos” é claro e natural, sem definir se a imagem é literal ou metafórica.
- source_word: צֵאוּ
  choice: Saiam!
  rationale: O imperativo plural de יצא é vertido de modo direto e idiomático como uma ordem de libertação.
- source_word: לַאֲשֶׁר בַּחֹשֶׁךְ
  choice: aos que estão nas trevas
  rationale: Preserva tanto o sentido concreto quanto o metafórico de חֹשֶׁךְ, sem explicitar um referente específico.
- source_word: הִגָּלוּ
  choice: Apareçam!
  rationale: O imperativo nifal de גלה pede que os ocultos se tornem visíveis. “Apareçam” é natural e conserva a ideia de manifestação, enquanto a nota registra uma alternativa mais reflexiva.
- source_word: עַל דְּרָכִים
  choice: ao longo dos caminhos
  rationale: A expressão indica os lugares por onde o grupo restaurado pastará; “ao longo dos caminhos” comunica bem a distribuição do pastoreio pelo percurso.
- source_word: יִרְעוּ
  choice: pastarão
  rationale: O qal imperfeito de רעה mantém a metáfora pastoral do texto hebraico sem a transformar em explicação.
- source_word: שְׁפָיִם
  choice: elevações descampadas
  rationale: A expressão designa lugares altos expostos ou sem árvores. “Elevações descampadas” preserva o sentido topográfico e evita associações cultuais indevidas de “lugares altos”.
- source_word: מַרְעִיתָם
  choice: terão pasto
  rationale: O substantivo com sufixo de terceira pessoa plural refere-se ao lugar ou alimento de pastagem. A construção portuguesa é natural e conserva o sentido coletivo.
theological_decisions:
- issue: Sentido literal ou metafórico dos presos e das trevas
  choice: Manter as imagens concretas de “presos” e “trevas” sem explicar a que se referem.
  alternative: Identificá-las explicitamente com os exilados ou com libertação espiritual.
  rationale: A linguagem de restauração pode abranger o retorno do exílio e dimensões salvíficas mais amplas; a tradução não deve restringir a tensão presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Os imperativos diretos preservam a força da proclamação, e a metáfora pastoral permanece sem explicação interpretativa.
