  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה בְּ/עֵ֤ת רָצוֹן֙ עֲנִיתִ֔י/ךָ וּ/בְ/י֥וֹם יְשׁוּעָ֖ה עֲזַרְתִּ֑י/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֙ לִ/בְרִ֣ית עָ֔ם לְ/הָקִ֣ים אֶ֔רֶץ לְ/הַנְחִ֖יל נְחָל֥וֹת שֹׁמֵמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/008.yaml
  text: 'Thus says Yahweh: “In a time of favor I answered you[a], and in a day of salvation I helped you; I will keep you and give you as a covenant for the people, to raise up the land[e][d][c][b], to apportion the desolate inheritances,”'
translation:
  language: pt
  text: 'Assim diz Yahweh: “Num tempo de favor eu lhe respondi[a] e, num dia de salvação[b], eu o ajudei. Eu o guardarei[c] e o darei como aliança para o povo[d], para restaurar a terra[e] e distribuir as heranças desoladas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “num tempo aceitável”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “num dia de livramento”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “preservarei”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “como aliança ao povo”.'
    reason: lexical_alternative
  - marker: e
    text: 'Ou: “para estabelecer a terra” ou “para reerguer a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua identidade pactual, em conformidade com a opção do projeto.
- source_word: בְּעֵת רָצוֹן
  choice: No tempo do favor
  rationale: רָצוֹן expressa favor, aceitação ou boa vontade; a formulação é natural em português e mantém a ideia de uma ocasião favorável determinada por Deus.
- source_word: עֲנִיתִיךָ
  choice: eu lhe respondi
  rationale: Traduz diretamente o sentido comum de ענה, sem acrescentar ao verbo a ideia de resposta favorável, já indicada pelo contexto.
- source_word: בְיוֹם יְשׁוּעָה
  choice: no dia da salvação
  rationale: יְשׁוּעָה abrange salvação e livramento. A construção definida soa mais natural em português, embora o hebraico não tenha artigo explícito.
- source_word: עֲזַרְתִּיךָ
  choice: eu o ajudei
  rationale: Equivalência direta, clara e idiomática de עזר.
- source_word: וְאֶצָּרְךָ
  choice: Eu o guardarei
  rationale: נצר comunica guardar, proteger ou preservar; “guardarei” mantém de modo conciso a nuance protetora.
- source_word: וְאֶתֶּנְךָ לִבְרִית עָם
  choice: o darei como aliança para o povo
  rationale: Mantém a formulação densa segundo a qual o próprio servo é dado como aliança, sem reduzi-lo a simples mediador; “para o povo” expressa adequadamente o valor benefactivo.
- source_word: לְהָקִים אֶרֶץ
  choice: para restaurar a terra
  rationale: No contexto de propriedades desoladas, o hifil de קום aponta naturalmente para reerguer ou restaurar a terra; a nota preserva alternativas mais formais.
- source_word: לְהַנְחִיל נְחָלוֹת שֹׁמֵמוֹת
  choice: repartir como herança as propriedades desoladas
  rationale: O hifil de נחל significa dar ou distribuir como herança. “Propriedades” torna concretas as porções hereditárias sem perder a relação com herança.
theological_decisions:
- issue: Identidade e função do destinatário como aliança
  choice: Preservar que o destinatário é dado “como aliança para o povo”.
  alternative: Explicitar que ele é mediador da aliança ou que estabelece uma aliança.
  rationale: A construção hebraica apresenta a própria figura em função ou incorporação pactual; uma explicação mais estreita resolveria indevidamente a densidade teológica do texto.
- issue: Amplitude semântica de יְשׁוּעָה
  choice: salvação
  alternative: livramento
  rationale: “Salvação” preserva tanto o resgate histórico imediato quanto a ressonância redentora mais ampla, enquanto “livramento” permanece registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de objeto que evitam ambiguidade excessiva. A pontuação divide com clareza a resposta passada e a promessa futura. Todas as alternativas relevantes são indicadas por marcadores no texto principal.
