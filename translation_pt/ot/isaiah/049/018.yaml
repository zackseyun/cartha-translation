  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ חַי אָ֣נִי נְאֻם יְהוָ֗ה כִּ֤י כֻלָּ/ם֙ כָּ/עֲדִ֣י תִלְבָּ֔שִׁי וּֽ/תְקַשְּׁרִ֖י/ם כַּ/כַּלָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/018.yaml
  text: 'Lift up your eyes all around and see: they all gather together; they come to you. As I live[a], declares Yahweh, you will surely put them all on like an ornament and bind them on like a bride.'
translation:
  language: pt
  text: 'Erga os olhos e olhe ao redor: todos eles se reúnem e vêm até você. Tão certo como eu vivo — declara Yahweh —, você certamente se revestirá de todos eles como de um adorno[a] e os prenderá a si mesma, como uma noiva.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como de uma joia”; o termo hebraico se refere a adorno ou joia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Erga os olhos e olhe ao redor
  rationale: Reproduz os dois imperativos dirigidos a Sião personificada e expressa סָבִיב de modo natural em português.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: todos eles se reúnem e vêm até você
  rationale: O presente dá vivacidade à visão profética; a forma reflexiva de “se reúnem” representa adequadamente o nifal נִקְבְּצוּ.
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Equivalente idiomático e solene da fórmula hebraica de juramento divino.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética e translitera o nome divino expresso pelo Tetragrama.
- source_word: כָּעֲדִי
  choice: como de um adorno
  rationale: עֲדִי designa adorno ou joia; o singular “um adorno” acompanha a forma hebraica e preserva a imagem figurada.
- source_word: וּתְקַשְּׁרִים כַּכַּלָּה
  choice: e os prenderá a si como uma noiva
  rationale: Explicita em português a ideia de prender os retornados a si como adornos, preservando a comparação nupcial e o sufixo masculino plural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Identidade dos que se reúnem
  choice: todos eles
  alternative: todos os seus filhos
  rationale: O pronome retoma, pelo contexto, os filhos de Sião, mas o versículo não repete explicitamente o substantivo; a tradução conserva essa referência implícita.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A pontuação destaca a fórmula de juramento e a declaração profética sem introduzir interpretação denominacional.
