id: ISA.49.1
reference: Isaiah 49:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְע֤וּ אִיִּים֙ אֵלַ֔/י וְ/הַקְשִׁ֥יבוּ לְאֻמִּ֖ים מֵ/רָח֑וֹק יְהוָה֙ מִ/בֶּ֣טֶן קְרָאָ֔/נִי מִ/מְּעֵ֥י אִמִּ֖/י הִזְכִּ֥יר שְׁמִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/001.yaml
  text: 'Listen to me[a], coastlands, and pay attention, peoples from far away: Yahweh called me from the womb[b]; from my mother’s body he mentioned my name.'
translation:
  language: pt
  text: 'Escutem-me, terras costeiras[a]; prestem atenção, povos distantes: Yahweh me chamou desde o ventre; desde as entranhas de minha mãe, mencionou o meu nome[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilhas”. O termo hebraico também pode designar, de modo mais amplo, terras marítimas ou regiões costeiras distantes.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “chamou-me pelo nome” ou como referência a nomeação e designação.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Escutem-me
  rationale: O imperativo plural convoca os destinatários a ouvir com atenção; “Escutem-me” é direto, atual e preserva a força do chamado.
- source_word: אִיִּים
  choice: terras costeiras
  rationale: Em Isaías, o termo frequentemente abrange regiões marítimas distantes, e não somente ilhas em sentido estrito.
- source_word: וְהַקְשִׁיבוּ
  choice: prestem atenção
  rationale: O imperativo intensifica a convocação para ouvir e é expresso de modo natural em português contemporâneo.
- source_word: לְאֻמִּים מֵרָחוֹק
  choice: povos distantes
  rationale: A formulação concisa conserva tanto a referência a grupos humanos quanto a ideia de distância geográfica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִבֶּטֶן קְרָאָנִי
  choice: me chamou desde o ventre
  rationale: Preserva a imagem pré-natal e a possível nuance de convocação ou designação, sem explicitá-la além do hebraico.
- source_word: מִמְּעֵי אִמִּי
  choice: desde as entranhas de minha mãe
  rationale: Mantém a imagem corporal e a variação poética em relação ao termo anterior, “ventre”.
- source_word: הִזְכִּיר שְׁמִי
  choice: mencionou o meu nome
  rationale: Reflete de perto o causativo de זכר, que pode significar fazer lembrar ou mencionar, preservando a tensão com o sentido contextual de nomear ou designar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta o nome próprio divino; a transliteração o preserva sem convertê-lo em título.
- issue: Sentido da referência pré-natal ao nome
  choice: mencionou o meu nome
  alternative: chamou-me pelo nome / designou-me
  rationale: A tradução mantém o valor lexical do verbo e não determina se a frase descreve apenas menção, nomeação ou designação vocacional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. O paralelismo poético foi mantido sem tornar os dois termos referentes ao ventre idênticos.
