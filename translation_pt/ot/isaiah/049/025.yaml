id: ISA.49.25
reference: Isaiah 49:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה גַּם שְׁבִ֤י גִבּוֹר֙ יֻקָּ֔ח וּ/מַלְק֥וֹחַ עָרִ֖יץ יִמָּלֵ֑ט וְ/אֶת יְרִיבֵ/ךְ֙ אָנֹכִ֣י אָרִ֔יב וְ/אֶת בָּנַ֖יִ/ךְ אָנֹכִ֥י אוֹשִֽׁיעַ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/025.yaml
  text: 'For thus says Yahweh: Even the captives of the mighty will be taken away[a], and the prey of the ruthless will escape; and I myself will contend with the one who contends with you[b], and I myself will save your children.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh: “Até os cativos do poderoso serão tirados, e a presa do tirano escapará; eu mesmo contenderei com quem contende com você e eu mesmo salvarei seus filhos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo o Tetragrama de títulos como “Senhor” e preservando sua função no texto hebraico.
- source_word: שְׁבִי גִבּוֹר
  choice: os cativos do poderoso
  rationale: Entende שְׁבִי concretamente como o conjunto de pessoas mantidas em cativeiro e גִבּוֹר como uma figura poderosa, sem restringir a referência a um guerreiro.
- source_word: יֻקָּח
  choice: serão tirados
  rationale: Expressa a remoção dos cativos do poder de quem os detém e conserva a voz passiva do hebraico.
- source_word: מַלְקוֹחַ עָרִיץ
  choice: a presa do tirano
  rationale: Mantém a imagem daquilo que foi capturado; “tirano” comunica de modo natural o caráter violento e opressor de עָרִיץ.
- source_word: יִמָּלֵט
  choice: escapará
  rationale: Preserva a ideia vívida de escapar ou livrar-se, sem explicitar além do hebraico o agente da libertação.
- source_word: יְרִיבֵךְ ... אָרִיב
  choice: contenderei com quem contende com você
  rationale: Reproduz a repetição da raiz ריב e conserva a ambiguidade entre disputa judicial e oposição ativa.
- source_word: אָנֹכִי
  choice: eu mesmo
  rationale: Representa a ênfase do pronome independente, repetido nas duas promessas de intervenção divina.
- source_word: בָּנַיִךְ
  choice: seus filhos
  rationale: Traduz diretamente o plural masculino “filhos”; no contexto do discurso dirigido a Sião, pode abranger seus descendentes, sem ser necessário neutralizar o termo no corpo do texto.
- source_word: אוֹשִׁיעַ
  choice: salvarei
  rationale: É a correspondência direta e teologicamente ampla para o hifil de ישׁע, que pode denotar salvar, livrar ou resgatar.
theological_decisions:
- issue: Alcance de בָּנַיִךְ no discurso dirigido a Sião
  choice: seus filhos
  alternative: suas crianças / seus descendentes
  rationale: O hebraico emprega literalmente “filhos” e pode, no retrato corporativo de Sião, incluir seus descendentes em sentido amplo. A tradução preserva a forma concreta sem limitar doutrinariamente seu alcance.
- issue: Natureza da ação expressa por ריב
  choice: contenderei
  alternative: lutarei / defenderei a sua causa
  rationale: “Contender” mantém aberta a tensão entre uma disputa de caráter judicial e o enfrentamento ativo dos adversários, evitando decidir uma imagem que o hebraico deixa ampla.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A repetição enfática “eu mesmo” e o paralelismo verbal de “contenderei/contende” foram preservados. Não há marcadores de nota, pois nenhuma nota foi julgada necessária.
