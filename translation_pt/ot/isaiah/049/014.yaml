  language: en
  yaml_path: translation/ot/isaiah/049/014.yaml
  text: But Zion said, “The LORD has forsaken me; my Lord has forgotten me.”
translation:
  language: pt
  text: 'Mas Sião disse: “O SENHOR me abandonou; meu Senhor se esqueceu de mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיּוֹן
  choice: Sião
  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio Zion.
- source_word: עֲזָבַנִי
  choice: me abandonou
  rationale: Expressa diretamente o sentido de deixar ou desamparar percebido por Sião, sem atenuar a força da queixa.
- source_word: יְהוָה
  choice: O SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o tetragrama por SENHOR em versaletes.
- source_word: אדֹנָי
  choice: meu Senhor
  rationale: Preserva tanto o título אדני quanto o sufixo de primeira pessoa, distinguindo-o do tetragrama anterior.
- source_word: שְׁכֵחָנִי
  choice: se esqueceu de mim
  rationale: Tradução natural e semanticamente direta da alegação de ter sido esquecida.
theological_decisions:
- issue: A queixa de Sião sobre abandono e esquecimento divinos
  choice: 'Mantida como fala direta e sem qualificação: “O SENHOR me abandonou; meu Senhor se esqueceu de mim.”'
  alternative: Explicitar que essa é apenas uma percepção equivocada de Sião.
  rationale: O versículo apresenta a queixa de Sião antes da resposta divina; inserir uma correção dentro da fala resolveria antecipadamente a tensão retórica e teológica do contexto.
- issue: Distinção entre יהוה e אדני
  choice: “O SENHOR” e “meu Senhor”
  alternative: Empregar “Javé” e “o Senhor”, ou traduzir ambos simplesmente por “o Senhor”.
  rationale: A escolha preserva a diferença lexical do hebraico e o elemento possessivo em אדני, em consonância com o uso português tradicional e com a evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. A conjunção adversativa “Mas” mantém o contraste discursivo de וַתֹּאמֶר no contexto. A pontuação com ponto e vírgula preserva o paralelismo entre as duas acusações.
