  text: מִֽהֲר֖וּ בָּנָ֑יִ/ךְ מְהָֽרְסַ֥יִ/ךְ וּ/מַחֲרִבַ֖יִ/ךְ מִמֵּ֥/ךְ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/017.yaml
  text: Your children hurry back[a]; those who tore you down and devastated you will depart from you.
translation:
  language: pt
  text: Seus filhos voltam depressa[a]; os que a derrubaram e devastaram sairão de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seus construtores se apressam”. Alguns testemunhos antigos refletem “construtores” em vez de “filhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִהֲרוּ
  choice: voltam depressa
  rationale: O verbo מהר significa “apressar-se”. O retorno não é expresso de modo explícito pelo verbo, mas é indicado pelo contraste contextual entre os filhos que chegam e os destruidores que saem; “voltam depressa” comunica esse movimento restaurador com naturalidade.
- source_word: בָּנָיִךְ
  choice: seus filhos
  rationale: O texto massorético vocaliza a forma como “seus filhos”. Como Sião/Jerusalém é personificada, a expressão designa naturalmente seus habitantes ou descendentes. A leitura antiga “seus construtores” é preservada em nota.
- source_word: מְהָרְסַיִךְ
  choice: os que derrubaram
  rationale: Particípio de הרס, “derrubar, demolir”. A oração relativa é natural em português e mantém a imagem da destruição de uma cidade.
- source_word: וּמַחֲרִבַיִךְ
  choice: e devastaram
  rationale: A forma designa os que causaram desolação ou ruína. Coordenada com “derrubaram”, a tradução evita repetição pesada e expressa a gravidade da destruição.
- source_word: מִמֵּךְ
  choice: embora
  rationale: A preposição separativa com o sufixo feminino indica afastamento de Sião. Em combinação com יצא, “ir embora” expressa de modo idiomático em português a saída para longe dela.
- source_word: יֵצֵאוּ
  choice: irão embora
  rationale: יצא significa “sair, ir para fora”. Com מִמֵּךְ e os destruidores como sujeito, “irão embora” comunica claramente sua retirada de Sião.
theological_decisions:
- issue: Leitura variante de בָּנָיִךְ
  choice: seus filhos
  alternative: seus construtores
  rationale: 'O texto massorético traz “seus filhos”, leitura coerente com o tema da restauração: os filhos de Sião retornam enquanto seus destruidores partem. Alguns testemunhos antigos refletem “seus construtores”; a alternativa é registrada em nota para preservar a questão textual sem substituir a leitura hebraica principal.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” explicita a referência feminina a Sião de maneira natural; o texto preserva o paralelismo entre a rápida volta dos filhos e a partida dos destruidores.
