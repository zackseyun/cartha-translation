  yaml_path: translation/ot/isaiah/049/011.yaml
  text: And I will make all my mountains into a road[b][a], and my highways will be raised up.
translation:
  language: pt
  text: Farei de todos os meus montes uma estrada[a], e minhas estradas serão elevadas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para servir de estrada” ou “como caminho”. O hebraico pode indicar tanto o resultado quanto a finalidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “serão erguidas”. O termo hebraico pode referir-se a uma estrada preparada ou construída sobre aterros.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Farei
  rationale: שׂים pode significar pôr, colocar ou fazer; aqui, com לַדָּרֶךְ, “farei” expressa naturalmente a transformação dos montes em rota transitável.
- source_word: כָל הָרַי
  choice: todos os meus montes
  rationale: Preserva a imagem concreta e o sufixo de primeira pessoa, sem decidir se os montes são obstáculos literais, figurados ou ambos.
- source_word: לַדָּרֶךְ
  choice: uma estrada
  rationale: דֶּרֶךְ designa caminho ou estrada, e o ל pode indicar resultado ou finalidade. No corpo do texto, “fazer de... uma estrada” comunica bem o provável resultado, enquanto a nota conserva a ambiguidade.
- source_word: וּמְסִלֹּתַי
  choice: e minhas estradas elevadas
  rationale: מְסִלָּה pode designar uma via preparada ou aterrada. “Estradas elevadas” mantém esse aspecto construtivo e distingue o termo de דֶּרֶךְ.
- source_word: יְרֻמוּן
  choice: serão erguidas
  rationale: A forma de רום exprime elevação; “serão erguidas” se ajusta à imagem de vias preparadas sem recorrer ao abstrato “exaltadas”.
theological_decisions:
- issue: Sentido da imagem de viagem e restauração
  choice: Manter a figura concreta de Deus convertendo o terreno em uma rota para seu povo.
  alternative: Explicitar uma remoção espiritual ou providencial de obstáculos, ou limitar a frase a uma rota física para o retorno dos exilados.
  rationale: O hebraico usa topografia concreta como imagem de restauração, mas não obriga o tradutor a escolher entre uma leitura literal, figurada ou combinada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Montes” preserva o tom poético bíblico sem soar arcaico; “estradas elevadas” procura conservar a diferença lexical e a imagem de uma via construída.
