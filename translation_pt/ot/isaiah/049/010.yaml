base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/010.yaml
  text: They will not hunger or thirst[a], nor will scorching heat or sun strike them; for the one who has compassion on them will lead them[b], and he will guide them to springs of water.
translation:
  language: pt
  text: Não terão fome nem sede; nem o calor abrasador nem o sol os ferirão, pois aquele que tem compaixão deles os conduzirá e os guiará até fontes de água[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto a fontes de água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעָבוּ
  choice: terão fome
  rationale: O qal imperfeito de רָעֵב expressa sentir ou passar fome; a locução é natural em português e mantém o paralelismo com “terão sede”.
- source_word: יִצְמָאוּ
  choice: terão sede
  rationale: O qal imperfeito de צָמֵא significa ter sede; esta formulação é corrente e forma um par poético claro com “terão fome”.
- source_word: יַכֵּם
  choice: os ferirão
  rationale: O hifil de נכה indica atingir ou golpear. “Ferirão” comunica aqui o efeito nocivo do calor e do sol sem recorrer a linguagem arcaica.
- source_word: שָׁרָב
  choice: calor abrasador
  rationale: שָׁרָב designa calor intenso e ressequente, especialmente o calor opressivo do deserto; “calor abrasador” preserva essa intensidade.
- source_word: שָׁמֶשׁ
  choice: sol
  rationale: É o sentido comum e concreto do substantivo neste contexto.
- source_word: מְרַחֲמָם
  choice: aquele que tem compaixão deles
  rationale: O particípio de רָחַם com sufixo de terceira pessoa masculina plural descreve continuamente quem se compadece deles. A tradução mantém a descrição sem inserir explicitamente “Deus”.
- source_word: יְנַהֲגֵם
  choice: os conduzirá
  rationale: O piel de נָהַג significa conduzir ou guiar. “Conduzirá” se ajusta ao contexto pastoral e evita repetição imediata com o verbo seguinte.
- source_word: מַבּוּעֵי מַיִם
  choice: fontes de água
  rationale: מַבּוּעַ é uma nascente ou fonte natural de água corrente; “fontes de água” mantém a imagem concreta e é amplamente compreensível.
- source_word: יְנַהֲלֵם
  choice: os guiará
  rationale: O piel de נהל denota condução ou orientação, muitas vezes cuidadosa; “guiará” preserva essa nuance.
- source_word: וְעַל
  choice: até
  rationale: Embora עַל frequentemente signifique “sobre”, neste contexto de movimento guiado pode marcar direção ou destino. “Até” expressa naturalmente o movimento rumo às fontes, preservando em nota a leitura locativa.
theological_decisions:
- issue: Referente daquele que tem compaixão e guia
  choice: Manter a designação descritiva “aquele que tem compaixão deles”
  alternative: Identificá-lo explicitamente como Deus
  rationale: O contexto aponta para Deus, mas o hebraico não emprega aqui o nome ou o título divino. A formulação descritiva preserva tanto o provável referente quanto a maneira indireta pela qual o texto o apresenta.
- issue: Relação espacial com as fontes de água
  choice: “até fontes de água”
  alternative: “junto a fontes de água”
  rationale: A preposição עַל admite neste contexto uma leitura direcional ou locativa. O texto principal adota a direção do movimento, enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética simples. Mantém o paralelismo fome/sede e calor/sol, evita arcaísmos e não explicita o referente divino além do que o hebraico declara.
