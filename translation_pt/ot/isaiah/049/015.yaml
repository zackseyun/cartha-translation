  text: הֲ/תִשְׁכַּ֤ח אִשָּׁה֙ עוּלָ֔/הּ מֵ/רַחֵ֖ם בֶּן בִּטְנָ֑/הּ גַּם אֵ֣לֶּה תִשְׁכַּ֔חְנָה וְ/אָנֹכִ֖י לֹ֥א אֶשְׁכָּחֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/015.yaml
  text: Can a woman forget her nursing child[a], and have no compassion on the son of her womb? Even these may forget, yet I will not forget you.
translation:
  language: pt
  text: Pode uma mulher esquecer-se do bebê que ela amamenta[a] e deixar de ter compaixão do filho do seu ventre? Mesmo essas podem esquecer, mas eu não me esquecerei de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a criança de peito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/תִשְׁכַּח
  choice: Pode ... esquecer-se
  rationale: A partícula interrogativa com o imperfeito introduz uma pergunta retórica sobre uma possibilidade quase impensável; “Pode...” preserva essa força em português natural.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo significa “mulher” ou “esposa”. Embora o contexto seja materno, manter “mulher” conserva a formulação hebraica, e as expressões seguintes explicitam a maternidade.
- source_word: עוּלָהּ
  choice: o bebê que amamenta
  rationale: O termo designa uma criança de peito. A formulação é clara e atual, preservando a imagem da dependência materna.
- source_word: מֵ/רַחֵם
  choice: deixar de ter compaixão
  rationale: O verbo רחם exprime compaixão ou misericórdia. Com a preposição מן, a construção indica abster-se ou deixar de compadecer-se; esta tradução comunica isso com naturalidade.
- source_word: בֶּן בִּטְנָהּ
  choice: o filho do seu ventre
  rationale: A tradução mantém tanto o substantivo masculino בן, “filho”, quanto a imagem concreta do ventre materno.
- source_word: גַּם אֵלֶּה
  choice: Mesmo essas
  rationale: A expressão retoma enfaticamente as mulheres recém-mencionadas e introduz uma concessão surpreendente.
- source_word: תִשְׁכַּחְנָה
  choice: podem esquecer
  rationale: O imperfeito admite aqui uma possibilidade dentro da concessão, sem afirmar que tal esquecimento necessariamente ocorrerá.
- source_word: וְ/אָנֹכִי
  choice: mas eu
  rationale: O pronome independente אָנֹכִי é enfático, e a conjunção estabelece forte contraste; “mas eu” o expressa de modo natural e digno.
- source_word: לֹא אֶשְׁכָּחֵךְ
  choice: não me esquecerei de você
  rationale: A negação com o imperfeito transmite a promessa enfática de que o Senhor não esquecerá Sião. A regência pronominal é natural no português brasileiro amplamente compreensível.
theological_decisions:
- issue: Linguagem de gênero em בֶּן בִּטְנָהּ
  choice: o filho do seu ventre
  alternative: a criança do seu ventre
  rationale: O hebraico emprega explicitamente בן, “filho”. A tradução mantém o termo masculino sem obscurecer que a comparação abrange a relação materna em geral.
- issue: Força da comparação retórica
  choice: Mesmo essas podem esquecer, mas eu não me esquecerei de você
  alternative: Ainda que essas se esqueçam, eu não me esquecerei de você
  rationale: A redação conserva a concessão e o contraste enfático do hebraico sem transformar a falha materna em certeza nem acrescentar explicações teológicas ao texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Bebê que amamenta” evita o ar arcaico de “lactente” ou “criança de peito” no texto principal; “filho do seu ventre” preserva a imagem e o gênero lexical do hebraico.
