  text: הֵ֥ן עַל כַּפַּ֖יִם חַקֹּתִ֑י/ךְ חוֹמֹתַ֥יִ/ךְ נֶגְדִּ֖/י תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/016.yaml
  text: Look[a], I have engraved you on the palms of my hands; your walls are continually before me.
translation:
  language: pt
  text: Veja, eu gravei você nas palmas das minhas mãos; suas muralhas estão continuamente diante de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Veja
  rationale: Interjeição dêitica que chama enfaticamente a atenção; “Veja” é natural no português moderno e mantém essa força.
- source_word: עַל
  choice: nas
  rationale: A preposição espacial indica que a gravação está sobre as palmas; a contração “nas” é idiomática em português.
- source_word: כַּפַּיִם
  choice: palmas das minhas mãos
  rationale: O substantivo dual designa as palmas/mãos. A formulação explícita preserva a imagem corporal concreta e soa natural em português.
- source_word: חַקֹּתִיךְ
  choice: eu gravei você
  rationale: O verbo denota gravar ou inscrever, com uma imagem de permanência. O sufixo é feminino singular e se refere, no contexto, a Sião/Jerusalém personificada.
- source_word: חוֹמֹתַיִךְ
  choice: suas muralhas
  rationale: O plural se refere às muralhas de Sião/Jerusalém; “muralhas” comunica com clareza as fortificações urbanas sem inserir o nome da cidade.
- source_word: נֶגְדִּי
  choice: diante de mim
  rationale: Expressão idiomática para aquilo que permanece à vista ou na presença de alguém.
- source_word: תָּמִיד
  choice: continuamente
  rationale: Expressa continuidade constante e conserva o tom solene do hebraico.
theological_decisions:
- issue: Representação metafórica das mãos divinas e da gravação
  choice: 'Manter diretamente a metáfora antropomórfica: “eu gravei você nas palmas das minhas mãos”.'
  alternative: Parafrasear o sentido como “eu sempre me lembro de você”.
  rationale: O hebraico emprega uma imagem corporal vívida para comunicar a lembrança e o compromisso permanentes de Deus com Sião; preservar a metáfora evita reduzir a tensão poética à sua interpretação.
- issue: Referente dos sufixos femininos singulares
  choice: Usar “você/suas”, deixando que o contexto identifique Sião/Jerusalém.
  alternative: Inserir explicitamente “Sião” ou “Jerusalém” no versículo.
  rationale: Os sufixos hebraicos são femininos singulares e contextualmente apontam para Sião/Jerusalém personificada, mas o versículo a trata por pronome; manter isso preserva a forma do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” representa com naturalidade o destinatário singular personificado; “muralhas” evita a possível ambiguidade de “muros”. Não se acrescentou nota lexical porque “gravei” transmite adequadamente o sentido de inscrição entalhada.
