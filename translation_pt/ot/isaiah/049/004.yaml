  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָמַ֨רְתִּי֙ לְ/רִ֣יק יָגַ֔עְתִּי לְ/תֹ֥הוּ וְ/הֶ֖בֶל כֹּחִ֣/י כִלֵּ֑יתִי אָכֵן֙ מִשְׁפָּטִ֣/י אֶת יְהוָ֔ה וּ/פְעֻלָּתִ֖/י אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/004.yaml
  text: But I said[a], “I have labored in vain; I have spent my strength for emptiness and vanity. Yet surely my justice is with Yahweh[b], and my reward is with my God.”
translation:
  language: pt
  text: 'Mas eu disse: “Trabalhei em vão; esgotei minhas forças para o vazio e a futilidade. Contudo, certamente meu direito[a] está com Yahweh, e minha recompensa[b], com meu Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha causa”, “minha justiça” ou “minha vindicação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha retribuição” ou “minha paga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרִיק
  choice: em vão
  rationale: Expressa de modo natural a ideia de esforço sem resultado, mantendo o paralelismo com a frase seguinte.
- source_word: יָגַעְתִּי
  choice: trabalhei
  rationale: Comunica o trabalho árduo do servo em linguagem corrente; o desgaste resultante aparece explicitamente em “esgotei minhas forças”.
- source_word: לְתֹהוּ וְהֶבֶל
  choice: para o vazio e a futilidade
  rationale: 'Mantém distintos os dois substantivos hebraicos: תֹהוּ aponta para vazio ou ausência de resultado, enquanto הֶבֶל sugere transitoriedade e, por extensão, futilidade.'
- source_word: כֹּחִי כִלֵּיתִי
  choice: esgotei minhas forças
  rationale: O piel de כלה indica consumir ou usar por completo; a expressão portuguesa preserva a intensidade do esforço.
- source_word: אָכֵן
  choice: Contudo, certamente
  rationale: Reproduz tanto a virada adversativa em relação ao lamento quanto a convicção enfática da declaração seguinte.
- source_word: מִשְׁפָּטִי
  choice: meu direito
  rationale: “Direito” preserva a dimensão jurídica daquilo que cabe ao servo sem decidir se o termo significa especificamente causa, sentença favorável ou vindicação.
- source_word: אֶת יְהוָה
  choice: está com Yahweh
  rationale: A construção indica que o direito do servo está confiado à guarda de Yahweh; “com” evita acrescentar uma ideia direcional ausente do hebraico.
- source_word: וּפְעֻלָּתִי
  choice: e minha recompensa
  rationale: Neste contexto de trabalho aparentemente infrutífero, פְעֻלָּה designa naturalmente a paga ou recompensa correspondente ao trabalho.
- source_word: אֶת אֱלֹהָי
  choice: com meu Deus
  rationale: Mantém o paralelismo com “está com Yahweh” e a ideia de que a recompensa permanece sob os cuidados de Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome divino pessoal presente no texto, em vez de substituí-lo por um título.
- issue: Sentido de מִשְׁפָּטִי na fala do servo
  choice: meu direito
  alternative: minha causa; minha justiça; minha vindicação; meu julgamento
  rationale: 'A escolha conserva a amplitude jurídica e a tensão do texto: aquilo que é justamente devido ao servo permanece com Deus, sem antecipar se isso se manifestará como julgamento, defesa da causa ou vindicação.'
- issue: Sentido de פְעֻלָּתִי
  choice: minha recompensa
  alternative: minha paga; minha retribuição; minha obra
  rationale: O contexto favorece a remuneração ou o resultado do trabalho, mas a nota registra alternativas que refletem a amplitude lexical do termo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem das frases preserva o paralelismo poético, e a elipse de “está” antes de “com meu Deus” soa natural sem enfraquecer a correspondência entre os dois membros.
