  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָי֨וּ מְלָכִ֜ים אֹֽמְנַ֗יִ/ךְ וְ/שָׂרֽוֹתֵי/הֶם֙ מֵינִ֣יקֹתַ֔יִ/ךְ אַפַּ֗יִם אֶ֚רֶץ יִשְׁתַּ֣חֲווּ לָ֔/ךְ וַ/עֲפַ֥ר רַגְלַ֖יִ/ךְ יְלַחֵ֑כוּ וְ/יָדַ֨עַתְּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֥ר לֹֽא יֵבֹ֖שׁוּ קוָֹֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/023.yaml
  text: Kings will be your foster fathers[a], and their princesses your nursing mothers. With faces to the ground they will bow down to you, and they will lick the dust of your feet. Then you will know that I am Yahweh[b]; those who wait for me will not be put to shame.
translation:
  language: pt
  text: Reis serão os seus tutores[a], e as princesas deles, suas amas de leite. Com o rosto em terra, eles se prostrarão diante de você e lamberão o pó dos seus pés. Então você saberá que eu sou Yahweh; os que esperam em mim[b] não serão envergonhados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que cuidam de você”. O termo hebraico pode designar quem cria, sustenta ou protege alguém.
    reason: lexical_alternative
  - marker: b
    text: Ou “os que põem a esperança em mim”. O verbo hebraico inclui tanto a ideia de esperar como a de ter esperança confiante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְנַיִךְ
  choice: os seus tutores
  rationale: O termo derivado de אמן designa homens que criam, sustentam ou protegem. “Tutores” preserva a função de cuidado e proteção exercida pelos reis, em paralelo com as amas de leite, sem restringir o sentido à paternidade adotiva.
- source_word: שָׂרוֹתֵיהֶם
  choice: as princesas deles
  rationale: O feminino plural de שׂר pode indicar mulheres da realeza ou da nobreza. “Princesas” forma um paralelo natural com “reis”, embora “nobres” ou “rainhas” também sejam possíveis.
- source_word: מֵינִיקֹתַיִךְ
  choice: suas amas de leite
  rationale: Expressa com precisão mulheres encarregadas de amamentar e cuidar de uma criança, preservando a imagem concreta do hebraico.
- source_word: אַפַּיִם אֶרֶץ
  choice: com o rosto em terra
  rationale: A expressão idiomática descreve prostração completa. A formulação é vívida, clara e natural em português.
- source_word: יִשְׁתַּחֲווּ לָךְ
  choice: eles se prostrarão diante de você
  rationale: O verbo indica curvar-se ou prostrar-se em homenagem. Esta escolha preserva o gesto concreto sem impor o sentido específico de culto divino.
- source_word: וַעֲפַר רַגְלַיִךְ יְלַחֵכוּ
  choice: lamberão o pó dos seus pés
  rationale: Mantém a imagem deliberadamente intensa de humilhação e submissão total.
- source_word: וְיָדַעַתְּ
  choice: Então você saberá
  rationale: O perfeito com a conjunção, no discurso profético, apresenta aqui o conhecimento como resultado do acontecimento anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֹא יֵבֹשׁוּ
  choice: não serão envergonhados
  rationale: Comunica que os que esperam em Yahweh não acabarão em desonra ou frustração pública, e não apenas que deixarão de sentir vergonha interior.
- source_word: קוָֹי
  choice: os que esperam em mim
  rationale: O particípio de קוה reúne as ideias de aguardar e esperar com confiança. A nota registra explicitamente a nuance de esperança.
theological_decisions:
- issue: A natureza da homenagem prestada a Sião
  choice: “se prostrarão diante de você”, como gesto de submissão e homenagem
  alternative: “adorarão você”
  rationale: Embora השתחוה possa referir-se à adoração, neste contexto reis e princesas prestam homenagem à Sião restaurada. A tradução mantém o gesto descrito sem afirmar que Sião recebe culto divino.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração conserva no texto o nome divino pessoal e evita substituí-lo por um título.
- issue: Amplitude semântica de קוה
  choice: “esperam em mim”, com nota sobre aguardar com esperança
  alternative: “aguardam por mim”
  rationale: O verbo combina espera, confiança e expectativa esperançosa; o texto e a nota preservam essa amplitude sem escolher exclusivamente uma só nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular feminino de segunda pessoa dirigido a Sião foi vertido por “você”; os possessivos foram formulados para evitar ambiguidade. “Amas de leite” preserva a imagem histórica concreta, enquanto “tutores” comunica cuidado e proteção sem linguagem excessivamente arcaica.
