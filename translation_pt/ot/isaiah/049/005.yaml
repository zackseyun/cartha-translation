  text: וְ/עַתָּ֣ה אָמַ֣ר יְהוָ֗ה יֹצְרִ֤/י מִ/בֶּ֨טֶן֙ לְ/עֶ֣בֶד ל֔/וֹ לְ/שׁוֹבֵ֤ב יַֽעֲקֹב֙ אֵלָ֔י/ו וְ/יִשְׂרָאֵ֖ל לא יֵאָסֵ֑ף וְ/אֶכָּבֵד֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֵ/אלֹהַ֖/י הָיָ֥ה עֻזִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/005.yaml
  text: And now Yahweh says—he who formed me from the womb to be his servant, to bring Jacob back to him, and that Israel might be gathered to him[a]—yet I am honored in the eyes of Yahweh, and my God has become my strength.
translation:
  language: pt
  text: 'E agora Yahweh diz — aquele que me formou desde o ventre para ser seu servo, para trazer Jacó de volta a ele e para que Israel seja reunido a ele[a] —: “Serei honrado aos olhos de Yahweh, e meu Deus tem sido a minha força.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto consonantal hebraico diz: “e Israel não será reunido” (ou, conforme o contexto: “embora Israel não seja reunido”). Muitas versões e interpretações antigas entendem: “e para que Israel seja reunido a ele”, leitura que corresponde à linha paralela: “para trazer Jacó de volta a ele”.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva seu caráter pessoal e pactual, em conformidade com a opção do projeto.
- source_word: יֹצְרִי מִבֶּטֶן
  choice: aquele que me formou desde o ventre
  rationale: יֹצֵר expressa formar ou modelar intencionalmente; “desde o ventre” comunica de modo natural que a vocação do servo remonta à sua formação no ventre materno.
- source_word: לְעֶבֶד לוֹ
  choice: para ser seu servo
  rationale: עֶבֶד pode significar servo ou escravo; neste contexto vocacional, “servo” é fiel, digno e natural.
- source_word: לְשׁוֹבֵב יַעֲקֹב אֵלָיו
  choice: para trazer Jacó de volta a ele
  rationale: O verbo tem sentido causativo de fazer voltar; a expressão preserva tanto a restauração quanto o movimento em direção a Deus.
- source_word: וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: e para que Israel seja reunido a ele
  rationale: A leitura לוֹ, refletida por antigas testemunhas e favorecida pelo paralelismo, produz “a ele”; a leitura consonantal massorética לֹא, “não”, é mantida explicitamente em nota.
- source_word: וְאֶכָּבֵד בְּעֵינֵי יְהוָה
  choice: Sou honrado aos olhos de Yahweh
  rationale: O nifal de כבד indica ser honrado ou estimado. O presente comunica com naturalidade a condição declarada pelo servo, sem acrescentar um contraste que depende da leitura textual alternativa.
- source_word: וֵאלֹהַי הָיָה עֻזִּי
  choice: e o meu Deus tem sido a minha força
  rationale: “Força” corresponde diretamente a עֹז. “Tem sido” preserva o valor verbal de היה e expressa uma realidade iniciada anteriormente e ainda vigente, sem sugerir que Deus só então passou a ser sua força.
theological_decisions:
- issue: Leitura de וְיִשְׂרָאֵל לא יֵאָסֵף
  choice: “e para que Israel seja reunido a ele” no texto principal
  alternative: “e Israel não seja reunido” ou “embora Israel não seja reunido”
  rationale: O texto consonantal preservado lê לֹא, “não”, mas o paralelismo com a volta de Jacó e antigas testemunhas favorecem לוֹ, “a ele”. A tradução principal segue a leitura contextual mais coerente, enquanto a nota conserva integralmente a tensão textual e sua possível interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém “Yahweh” como nome divino, evita construções excessivamente literais e assinala a variante textual sem ocultar a ambiguidade.
