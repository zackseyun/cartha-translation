  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה אֶשָּׂ֤א אֶל גּוֹיִם֙ יָדִ֔/י וְ/אֶל עַמִּ֖ים אָרִ֣ים נִסִּ֑/י וְ/הֵבִ֤יאוּ בָנַ֨יִ/ךְ֙ בְּ/חֹ֔צֶן וּ/בְנֹתַ֖יִ/ךְ עַל כָּתֵ֥ף תִּנָּשֶֽׂאנָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/022.yaml
  text: 'Thus says the Lord GOD: Behold[a], I will lift up my hand to the nations, and raise my banner to the peoples; and they will bring your sons in their bosom[b], and your daughters will be carried on the shoulder.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: “Eis que levantarei a mão para as nações e erguerei minha bandeira para os povos; eles trarão teus filhos junto ao peito[a], e tuas filhas serão carregadas ao ombro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no regaço” ou “na dobra da roupa”; a imagem é de crianças levadas bem achegadas ao corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי como o nome divino יהוה, evitando a repetição pouco natural «Senhor SENHOR» e mantendo o nome da aliança.
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força de chamada de atenção do discurso profético em registro solene, mas ainda corrente no português bíblico.
- source_word: אֶשָּׂא ... יָדִי
  choice: levantarei a mão
  rationale: Reproduz diretamente a imagem hebraica de um gesto público que convoca ou sinaliza.
- source_word: גּוֹיִם
  choice: nações
  rationale: Indica coletividades nacionais em sentido amplo, sem introduzir o sentido técnico posterior de «gentios».
- source_word: אָרִים נִסִּי
  choice: erguerei minha bandeira
  rationale: נֵס pode designar bandeira, estandarte ou sinal elevado; «bandeira» comunica naturalmente a imagem pública de convocação.
- source_word: עַמִּים
  choice: povos
  rationale: Preserva a variação lexical e o paralelismo com «nações», sem impor uma distinção semântica rígida.
- source_word: בָנַיִךְ
  choice: seus filhos
  rationale: Mantém a referência masculina específica, em paralelo deliberado com «suas filhas».
- source_word: בְּחֹצֶן
  choice: junto ao peito
  rationale: Expressa de modo natural a ideia de levar as crianças no regaço ou na dobra da roupa, bem achegadas ao corpo.
- source_word: בְנֹתַיִךְ
  choice: suas filhas
  rationale: Tradução direta e específica do plural feminino hebraico.
- source_word: עַל כָּתֵף תִּנָּשֶׂאנָה
  choice: serão carregadas sobre os ombros
  rationale: Preserva o sentido passivo do nifal e apresenta em português natural a imagem de serem levadas aos ombros.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: O texto contém explicitamente o Tetragrama. «Yahweh» preserva o nome divino, enquanto «Senhor» traduz אֲדֹנָי; isso evita ocultar a distinção presente no hebraico.
- issue: Identidade dos destinatários femininos nos sufixos de segunda pessoa
  choice: manter «seus filhos» e «suas filhas» sem explicitar o referente
  alternative: explicitar «ó Sião»
  rationale: Os sufixos femininos singulares remetem contextualmente a Sião, mas o nome não aparece neste versículo; não explicitá-lo preserva a forma e a dependência contextual do original.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o paralelismo profético, a metáfora da mão levantada e a imagem da bandeira. O pronome possessivo «seus/suas» conserva a referência feminina singular de Sião sem acrescentar seu nome ao versículo.
