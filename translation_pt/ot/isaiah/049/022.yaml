- from: 'Assim diz o Senhor Yahweh: “Eis que levantarei a mão para as nações e erguerei minha bandeira para os povos; eles trarão seus filhos junto ao peito[a], e suas filhas serão carregadas sobre os ombros.”'
  to: 'Assim diz o Senhor Yahweh: “Eis que levantarei a mão para as nações e erguerei minha bandeira para os povos; eles trarão teus filhos junto ao peito[a], e tuas filhas serão carregadas ao ombro.”'
  rationale: A revisão resolve a ambiguidade pronominal introduzida por «seus/suas» em português e aproxima «ao ombro» do singular hebraico, sem modificar o sentido, o registro profético nem a ambiguidade contextual quanto à identidade de Sião.
