    issue: Os possessivos «seus filhos» e «suas filhas» podem ser entendidos como terceira pessoa em português.
    rationale: Os sufixos hebraicos são de segunda pessoa feminina singular. «Teus filhos» e «tuas filhas» preservam essa referência de forma explícita, sem acrescentar o nome de Sião.
  - severity: low
    issue: «Sobre os ombros» pluraliza a imagem de כָּתֵף, singular no hebraico.
    rationale: Embora o plural seja idiomático e não altere materialmente o sentido, «ao ombro» conserva melhor a formulação hebraica e é natural em português.
