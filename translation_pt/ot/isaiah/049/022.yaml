review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura, o paralelismo e as imagens do hebraico: a mão levantada às nações, o estandarte aos povos, os filhos levados junto ao corpo e as filhas carregadas. «Yahweh» representa explicitamente o Tetragrama na combinação אַדֹנָי יְהוִה, e «Senhor Yahweh» distingue de modo claro o título do nome divino.'
  naturalness: O registro é moderno e solenemente profético, com boa legibilidade em português brasileiro e internacional. A troca de «seus/suas» por «teus/tuas» torna inequívoca a segunda pessoa feminina singular do hebraico, sem explicitar «Sião», que não consta no versículo.
  terminology: «Nações» e «povos» refletem bem a variação גּוֹיִם / עַמִּים; «bandeira» é uma opção natural para נֵס. «Junto ao peito» transmite de forma idiomática בְּחֹצֶן, e a nota preserva as alternativas literais relevantes. «Ao ombro» reproduz de maneira mais próxima o singular כָּתֵף e permanece natural em português.
  issues:
