  text: וְ/אָמַ֣רְתְּ בִּ/לְבָבֵ֗/ךְ מִ֤י יָֽלַד לִ/י֙ אֶת אֵ֔לֶּה וַ/אֲנִ֥י שְׁכוּלָ֖ה וְ/גַלְמוּדָ֑ה גֹּלָ֣ה וְ/סוּרָ֗ה וְ/אֵ֨לֶּה֙ מִ֣י גִדֵּ֔ל הֵ֤ן אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י אֵ֖לֶּה אֵיפֹ֥ה הֵֽם־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/021.yaml
  text: Then you will say in your heart, ‘Who has borne these for me, since I was bereaved and barren, exiled and cast off? And these—who has raised them? Look, I was left alone; where then did these come from?’
translation:
  language: pt
  text: 'Então você dirá em seu coração: “Quem deu à luz estes para mim? Eu estava privada de filhos e estéril, exilada e rejeitada. E estes, quem os criou? Eu tinha ficado sozinha; estes, onde estavam?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָלַד לִי אֶת־אֵלֶּה
  choice: deu à luz estes para mim
  rationale: Preserva a imagem materna do verbo ילד e a ideia de que os filhos aparecem para Sião, sem reduzir a pergunta a uma formulação genérica como ‘de onde vieram’.
- source_word: שְׁכוּלָה וְגַלְמוּדָה
  choice: privada de filhos e estéril
  rationale: שכולה descreve quem perdeu ou foi privada de filhos; גלמודה, neste contexto, indica a condição de não ter filhos, tradicionalmente expressa como esterilidade ou desolação.
- source_word: גֹּלָה וְסוּרָה
  choice: exilada e rejeitada
  rationale: גלה indica exílio; סורה transmite afastamento ou exclusão. ‘Rejeitada’ expressa naturalmente a condição de quem foi posta de lado, sem especificar um agente.
- source_word: מִי גִדֵּל
  choice: quem os criou
  rationale: O piel de גדל aqui significa criar ou fazer crescer filhos, não meramente gerar.
- source_word: אֵלֶּה אֵיפֹה הֵם
  choice: estes, onde estavam?
  rationale: Segue de perto a pergunta hebraica sobre o paradeiro anterior dos filhos, preservando sua forma e a surpresa de Sião.
theological_decisions:
- issue: Identidade e fala metafórica de Sião
  choice: Manter a voz feminina implícita em ‘privada de filhos’, ‘estéril’, ‘exilada’ e ‘rejeitada’
  alternative: Neutralizar o gênero ou explicitar ‘Sião’ dentro do versículo
  rationale: As formas femininas hebraicas retomam Sião personificada como mãe. A tradução mantém essa imagem sem inserir um nome ausente do versículo.
- issue: Origem dos filhos inesperados
  choice: Preservar as perguntas sem identificar explicitamente quem os deu
  alternative: Explicitar que Deus os trouxe ou devolveu
  rationale: O contexto pode sugerir ação divina, mas o versículo formula a descoberta como perguntas; explicitar o agente resolveria uma tensão que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura interrogativa e a personificação materna de Sião foram preservadas; evitou-se ampliar a última pergunta para ‘de onde vieram’, pois o hebraico pergunta literalmente onde eles estavam.
