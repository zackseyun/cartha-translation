id: ISA.49.19
reference: Isaiah 49:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י חָרְבֹתַ֨יִ/ךְ֙ וְ/שֹׁ֣מְמֹתַ֔יִ/ךְ וְ/אֶ֖רֶץ הֲרִֽסֻתֵ֑י/ךְ כִּ֤י עַתָּה֙ תֵּצְרִ֣י מִ/יּוֹשֵׁ֔ב וְ/רָחֲק֖וּ מְבַלְּעָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/019.yaml
  text: For your ruins[a], your desolate places, and your devastated land—surely now you will be too cramped for inhabitants[b], and those who swallowed you up will be far away.
translation:
  language: pt
  text: Pois as tuas ruínas, os teus lugares desolados e a tua terra devastada — agora, sim, ficarás apertada demais por causa dos habitantes[a], e os que te engoliram[b] estarão longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficarás estreita demais para os habitantes”. A expressão hebraica é compacta e admite essa tradução mais formal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os que te devoraram”. O hebraico emprega a imagem vívida de engolir ou devorar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרְבֹתַיִךְ
  choice: as tuas ruínas
  rationale: חרבה designa lugares arruinados ou devastados. “Ruínas” é natural em português e mantém o paralelismo do verso.
- source_word: שֹׁמְמֹתַיִךְ
  choice: os teus lugares desolados
  rationale: A forma de שמם comunica abandono e desolação; a expressão escolhida preserva esse sentido de maneira clara.
- source_word: אֶרֶץ הֲרִסֻתֵיךְ
  choice: a tua terra devastada
  rationale: A construção descreve a terra marcada pela destruição. “Terra devastada” expressa naturalmente o estado resultante.
- source_word: כִּי
  choice: Pois
  rationale: O primeiro כִּי apresenta a razão ou fundamento da promessa no contexto anterior.
- source_word: כִּי עַתָּה
  choice: agora, sim
  rationale: O segundo כִּי tem força enfática. “Agora, sim” transmite em português a ênfase da reversão anunciada.
- source_word: תֵּצְרִי
  choice: ficarás apertada demais
  rationale: A forma feminina singular dirige-se a Sião e descreve falta de espaço diante do aumento da população.
- source_word: מִיּוֹשֵׁב
  choice: por causa dos habitantes
  rationale: A preposição מִן relaciona a falta de espaço com os que passam a habitar a terra; a formulação preserva essa relação sem resolver além do necessário a construção compacta.
- source_word: וְרָחֲקוּ
  choice: estarão longe
  rationale: O perfeito pode ter referência futura no discurso profético, apresentando o resultado da restauração prometida.
- source_word: מְבַלְּעָיִךְ
  choice: os que te engoliram
  rationale: A escolha mantém a imagem vívida de בלע, em vez de reduzi-la ao termo geral “destruidores”.
theological_decisions:
- issue: Referência temporal do perfeito profético na oração final
  choice: 'Futuro: “estarão longe”'
  alternative: 'Perfeito ou passado: “estão longe”, “foram para longe” ou “afastaram-se”'
  rationale: No oráculo de salvação, a oração integra a reversão futura prometida a Sião. O futuro comunica essa função contextual sem negar o valor perfectivo da forma hebraica.
- issue: Sujeito singular feminino de תֵּצְרִי
  choice: 'Manter a interpelação direta a Sião: “ficarás”'
  alternative: 'Fazer das ruínas e da terra o sujeito plural: “ficarão apertadas”'
  rationale: A morfologia hebraica está no feminino singular e continua a personificação de Sião; alterar para o plural tornaria a sintaxe portuguesa mais regular, mas apagaria esse dado textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a interpelação poética a Sião. O travessão conserva a topicalização compacta dos três elementos iniciais, e “agora, sim” comunica a ênfase da segunda ocorrência de כִּי.
