  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר נָקֵ֨ל מִֽ/הְיוֹתְ/ךָ֥ לִ/י֙ עֶ֔בֶד לְ/הָקִים֙ אֶת שִׁבְטֵ֣י יַעֲקֹ֔ב ו/נצירי יִשְׂרָאֵ֖ל לְ/הָשִׁ֑יב וּ/נְתַתִּ֨י/ךָ֙ לְ/א֣וֹר גּוֹיִ֔ם לִֽ/הְי֥וֹת יְשׁוּעָתִ֖/י עַד קְצֵ֥ה הָ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/006.yaml
  text: And he said[a], “It is too small a thing for you to be my servant to raise up the tribes of Jacob and to bring back the preserved ones of Israel; I will also make you a light for the nations[c][b], to be my salvation to the end of the earth.”
translation:
  language: pt
  text: 'Ele disse: “É pouco demais que você seja meu servo apenas para reerguer as tribos de Jacó e trazer de volta os preservados de Israel[a]. Também farei de você uma luz para as nações[b], para que você seja a minha salvação até a extremidade da terra[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os sobreviventes de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma luz às nações”; “gentios” também é uma tradução possível de “nações”.
    reason: lexical_alternative
  - marker: c
    text: Ou “até os confins da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: É pouco demais
  rationale: Expressa que uma missão limitada à restauração de Israel seria pequena ou insuficiente diante do propósito divino mais amplo, em português natural.
- source_word: עֶבֶד
  choice: servo
  rationale: No contexto dos cânticos do Servo em Isaías, funciona como designação de vocação e serviço a Deus; “servo” preserva isso sem enfatizar indevidamente a condição jurídica de escravo.
- source_word: לְהָקִים
  choice: reerguer
  rationale: Preserva a imagem concreta do Hifil de קום e comunica o sentido contextual de restabelecer as tribos.
- source_word: שִׁבְטֵי יַעֲקֹב
  choice: as tribos de Jacó
  rationale: Mantém “Jacó”, explicitamente presente no hebraico, e preserva o paralelismo com Israel.
- source_word: נְצִירֵי יִשְׂרָאֵל
  choice: os preservados de Israel
  rationale: Reflete o sentido de pessoas guardadas ou preservadas, sem especificá-las apenas como sobreviventes; essa leitura contextual permanece indicada em nota.
- source_word: לְהָשִׁיב
  choice: trazer de volta
  rationale: Traduz de modo transparente a ideia causativa de fazer retornar, permitindo também o sentido mais amplo de restauração.
- source_word: וּנְתַתִּיךָ
  choice: Também farei de você
  rationale: A expressão significa literalmente “eu te darei” em uma construção que designa alguém para determinada função. “Farei de você” é idiomático, e “também” explicita a ampliação da missão.
- source_word: לְאוֹר גּוֹיִם
  choice: uma luz para as nações
  rationale: “Nações” preserva o horizonte universal do texto e evita antecipar uma formulação etnicamente mais estreita; “para” é natural na construção predicativa em português.
- source_word: יְשׁוּעָתִי
  choice: a minha salvação
  rationale: Mantém a amplitude teológica da ação salvadora de Deus e a formulação nominal do hebraico.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: até a extremidade da terra
  rationale: Conserva o singular do hebraico, embora o plural idiomático seja registrado como alternativa em nota.
theological_decisions:
- issue: Identidade e alcance da missão do servo
  choice: 'Preservar a dupla missão: restaurar Israel e levar a salvação de Deus às nações.'
  alternative: Explicitar uma leitura exclusivamente coletiva ou exclusivamente messiânica.
  rationale: O versículo apresenta o servo atuando tanto em favor de Jacó/Israel quanto das nações, mas não exige que a tradução resolva a identidade debatida do servo.
- issue: Relação entre o servo e a salvação de Deus
  choice: “para que você seja a minha salvação”
  alternative: “para que a minha salvação alcance”
  rationale: A construção hebraica liga diretamente o servo à expressão “minha salvação”. A redação escolhida preserva essa tensão, sem reduzir o servo apenas a instrumento pelo qual a salvação alcança outros.
- issue: Sentido de גּוֹיִם
  choice: nações
  alternative: gentios
  rationale: “Nações” mantém o alcance universal e a amplitude lexical do termo no contexto profético.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o paralelismo poético e a progressão de Israel para as nações, sem explicitar uma identificação doutrinária do servo.
