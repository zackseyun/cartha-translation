  naturalness: 'A formulação «É pouco demais que você seja meu servo para...» é compreensível, mas soa truncada em português contemporâneo. A inclusão de «apenas» torna explícita, de modo idiomático e sem acréscimo interpretativo substantivo, a limitação implícita na construção hebraica: a missão voltada a Israel não é a totalidade da tarefa.'
  terminology: «Servo» é adequado ao registro profético e evita impor uma identificação doutrinária ao personagem. «Os preservados de Israel» mantém a opção lexical do texto-base; a alternativa «sobreviventes» permanece apropriadamente em nota. «Gentios» como alternativa para «nações» também está corretamente assinalado.
