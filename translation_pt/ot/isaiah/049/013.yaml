id: ISA.49.13
reference: Isaiah 49:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָנּ֤וּ שָׁמַ֨יִם֙ וְ/גִ֣ילִי אָ֔רֶץ יפצחו הָרִ֖ים רִנָּ֑ה כִּֽי נִחַ֤ם יְהוָה֙ עַמּ֔/וֹ וַ/עֲנִיָּ֖/ו יְרַחֵֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/013.yaml
  text: Shout for joy[a], O heavens, and rejoice, O earth; let the mountains break out in singing[c][b], for Yahweh has comforted his people and will have compassion on his afflicted ones.
translation:
  language: pt
  text: Exultem de alegria, ó céus, e alegre-se a terra; irrompam os montes em cântico, pois Yahweh consolou o seu povo e terá compaixão dos seus aflitos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos seus pobres” ou “dos seus humildes”. O termo hebraico pode designar pessoas aflitas, pobres ou humildes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנּוּ
  choice: Exultem de alegria
  rationale: O imperativo plural de רנן expressa júbilo vocal; a formulação comunica celebração intensa e combina naturalmente com o chamado dirigido aos céus.
- source_word: שָׁמַיִם
  choice: céus
  rationale: O plural preserva o sentido poético e cósmico, em paralelo com a terra e os montes.
- source_word: וְגִילִי
  choice: e alegre-se
  rationale: O imperativo feminino singular dirige-se à terra; a forma portuguesa mantém a personificação e o paralelismo.
- source_word: אָרֶץ
  choice: a terra
  rationale: O contexto cósmico — céus, terra e montes — favorece 'terra', não uma região específica.
- source_word: יפצחו ... רִנָּה
  choice: irrompam ... em cântico
  rationale: Reproduz a imagem de começar subitamente uma expressão vocal jubilosa, com força exortativa.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural a razão do júbilo cósmico.
- source_word: נִחַם
  choice: consolou
  rationale: Neste contexto, o verbo indica que Yahweh trouxe consolo ao seu povo; o pretérito traduz a ação apresentada como realizada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַמּוֹ
  choice: o seu povo
  rationale: Mantém o sentido coletivo e relacional do hebraico.
- source_word: וַעֲנִיָּו
  choice: dos seus aflitos
  rationale: O termo pode descrever aflitos, pobres ou humildes; 'aflitos' se ajusta ao contexto de consolo sem limitar o sentido à pobreza econômica.
- source_word: יְרַחֵם
  choice: terá compaixão
  rationale: O imperfeito expressa a ação compassiva de Yahweh; o futuro preserva a progressão verbal em relação a 'consolou'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Amplitude semântica de עָנִי
  choice: aflitos
  alternative: pobres ou humildes
  rationale: A escolha preserva o foco contextual no sofrimento dos que recebem compaixão, enquanto uma nota registra as alternativas legítimas.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com cadência poética. A personificação dos céus, da terra e dos montes foi preservada, bem como a distinção verbal entre o consolo já declarado e a compaixão futura.
