  text: וְ/הַאֲכַלְתִּ֤י אֶת מוֹנַ֨יִ/ךְ֙ אֶת בְּשָׂרָ֔/ם וְ/כֶ/עָסִ֖יס דָּמָ֣/ם יִשְׁכָּר֑וּ/ן וְ/יָדְע֣וּ כָל בָּשָׂ֗ר כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/026.yaml
  text: I will make those who oppress you eat their own flesh[a], and they will become drunk with their own blood as with sweet wine. Then all flesh will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: pt
  text: Farei com que os que oprimem você comam a própria carne, e eles se embriagarão com o próprio sangue, como com vinho novo[a]. Então toda carne saberá que eu, Yahweh, sou o seu Salvador e o seu Redentor, o Poderoso de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho doce”. O termo hebraico עָסִיס pode se referir a vinho doce ou recém-prensado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲכַלְתִּי
  choice: Farei com que ... comam
  rationale: O hifil de אכל tem sentido causativo. A formulação explicita essa força e soa natural em português.
- source_word: מוֹנַיִךְ
  choice: os que oprimem você
  rationale: O termo designa os que maltratam ou oprimem Sião. A oração relativa é clara e mantém a referência feminina singular representada por “você”.
- source_word: בְּשָׂרָם
  choice: a própria carne
  rationale: O sufixo possessivo refere-se aos opressores; “própria” torna clara a imagem reflexiva de autodestruição.
- source_word: וְכֶעָסִיס
  choice: como com vinho novo
  rationale: עָסִיס pode indicar vinho doce ou recém-prensado. “Vinho novo” preserva o caráter de bebida intoxicante exigido pelo verbo e evita sugerir mero suco.
- source_word: דָּמָם
  choice: o próprio sangue
  rationale: A formulação explicita a posse reflexiva e mantém o paralelismo com “a própria carne”.
- source_word: יִשְׁכָּרוּן
  choice: eles se embriagarão
  rationale: O verbo expressa ficar bêbado ou embriagado; a forma pronominal é idiomática e vívida em português.
- source_word: כָל בָּשָׂר
  choice: toda carne
  rationale: Mantém literalmente o idioma profético, seu alcance universal e suas ressonâncias intertextuais, sem reduzi-lo a uma paráfrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מוֹשִׁיעֵךְ
  choice: o seu Salvador
  rationale: Expressa de maneira concisa a identidade e função salvadora indicada pela forma participial.
- source_word: וְגֹאֲלֵךְ
  choice: o seu Redentor
  rationale: Preserva o importante termo pactual גאל sem especificar além do texto a figura de um resgatador familiar.
- source_word: אֲבִיר יַעֲקֹב
  choice: o Poderoso de Jacó
  rationale: Reproduz com precisão o título divino e conserva “Jacó”, conforme o texto hebraico.
theological_decisions:
- issue: Manter ou suavizar as imagens violentas do juízo
  choice: Manter diretamente as imagens de comer a própria carne e embriagar-se com o próprio sangue
  alternative: Parafrasear como autodestruição geral dos inimigos
  rationale: A retórica profética é deliberadamente chocante e descreve a reversão do sofrimento imposto a Sião. Suavizá-la ocultaria a força do hebraico.
- issue: Tradução de כָל בָּשָׂר
  choice: toda carne
  alternative: todas as pessoas; toda a humanidade
  rationale: A expressão literal preserva o registro profético, o alcance universal e as conexões internas das Escrituras sem resolver o idioma por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo poético, o nome divino Yahweh e a linguagem profética forte. O marcador [a] aparece no texto principal imediatamente após a expressão anotada.
