base_translation:
  language: en
  yaml_path: translation/ot/isaiah/049/012.yaml
  text: Look[a], these will come from far away, and look, these from the north and from the sea[b], and these from the land of Sinim.
translation:
  language: pt
  text: Vejam! Estes virão de longe; vejam! Estes virão do norte e do mar[a], e estes, da terra de Sinim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “do oeste”, pois, no uso geográfico hebraico, “o mar” pode indicar o oeste.
    reason: lexical_alternative
  - marker: b
    text: “Sinim” é um nome geográfico de localização incerta. Entre as identificações propostas estão Siena/Assuã, no sul do Egito, e uma região mais distante a leste; não há certeza quanto ao lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Interjeição que chama a atenção dos ouvintes. O plural é natural em português para uma audiência coletiva, e a repetição preserva a estrutura dêitica do hebraico.
- source_word: אֵלֶּה
  choice: estes / aqueles
  rationale: O demonstrativo plural aponta sucessivamente para grupos distintos. Empregam-se “estes” nas duas primeiras ocorrências e “aqueles” na última para produzir uma enumeração natural em português sem perder o contraste espacial.
- source_word: מֵרָחוֹק
  choice: de longe
  rationale: Equivalente corrente e conciso que comunica distância espacial.
- source_word: יָבֹאוּ
  choice: virão
  rationale: O imperfeito hebraico tem sentido futuro no contexto; o futuro simples é claro e natural em português.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Tradução direta do substantivo direcional com a preposição de origem.
- source_word: וּמִיָּם
  choice: e do mar
  rationale: Mantém o sentido lexical explícito de “mar”. No uso geográfico hebraico, o mar também pode indicar o oeste; essa possibilidade é registrada em nota.
- source_word: מֵאֶרֶץ
  choice: da terra de
  rationale: Equivalente formal e natural da construção que introduz um topônimo.
- source_word: סִינִים
  choice: Sinim
  rationale: Como a identificação do lugar é incerta, o nome é transliterado, sem adotar no texto principal uma localização conjectural.
