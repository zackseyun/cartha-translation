id: ISA.63.10
reference: Isaiah 63:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵ֛מָּה מָר֥וּ וְ/עִצְּב֖וּ אֶת ר֣וּחַ קָדְשׁ֑/וֹ וַ/יֵּהָפֵ֥ךְ לָ/הֶ֛ם לְ/אוֹיֵ֖ב ה֥וּא נִלְחַם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/010.yaml
  text: But they rebelled and grieved his Holy Spirit[a]; so he turned against them as an enemy; he himself fought against them.
translation:
  language: pt
  text: Mas eles se rebelaram e entristeceram o seu Espírito Santo[a]. Então ele se tornou inimigo deles e ele próprio lutou contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o seu espírito santo”; mais literalmente: “o espírito da sua santidade”.'
    reason: A expressão hebraica admite a forma adjetiva em minúsculas e, de modo mais literal, a construção “espírito da sua santidade”; o hebraico não marca distinção entre maiúsculas e minúsculas.
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mas eles
  rationale: A conjunção com o pronome independente contrasta a rebelião do povo com os atos salvadores de Deus mencionados antes, e “Mas eles” expressa esse contraste com naturalidade.
- source_word: מָרוּ
  choice: se rebelaram
  rationale: מרה denota rebelião ou desafio à autoridade, especialmente contra Deus; a forma pronominal é corrente e direta em português.
- source_word: וְעִצְּבוּ
  choice: e entristeceram
  rationale: O piel de עצב comunica causar dor ou tristeza. “Entristeceram” preserva a força relacional e afetiva sem ampliar o sentido.
- source_word: אֶת רוּחַ קָדְשׁוֹ
  choice: o seu Espírito Santo
  rationale: A expressão construta significa literalmente “o espírito da sua santidade” e pode equivaler a “seu espírito santo”. A formulação escolhida é natural no uso bíblico português, enquanto a nota preserva as alternativas e a ambiguidade de capitalização.
- source_word: וַיֵּהָפֵךְ לָהֶם לְאוֹיֵב
  choice: Então ele se tornou inimigo deles
  rationale: 'A construção indica uma mudança de posição ou relação: literalmente, ele veio a ser “para eles como inimigo”. “Se tornou inimigo deles” comunica claramente essa reversão e mantém a ligação consequencial.'
- source_word: הוּא
  choice: ele próprio
  rationale: O pronome explícito é enfático; “ele próprio” preserva a ênfase de que o próprio Deus passou a combatê-los.
- source_word: נִלְחַם בָּם
  choice: lutou contra eles
  rationale: לחם com בְּ aqui significa combater alguém. A tradução é direta e evita a possível leitura de que lutou ao lado deles.
theological_decisions:
- issue: Tradução e capitalização de רוּחַ קָדְשׁוֹ
  choice: o seu Espírito Santo
  alternative: o seu espírito santo; literalmente, o espírito da sua santidade
  rationale: O contexto apresenta o espírito de Deus como passível de ser entristecido, favorecendo a referência pessoal tradicional, mas a expressão hebraica não contém distinção de maiúsculas. A nota mantém acessíveis as leituras lexicais mais literais sem negar o peso teológico do contexto.
- issue: Agente da mudança em וַיֵּהָפֵךְ
  choice: ele se tornou inimigo deles
  alternative: ele voltou-se contra eles como inimigo
  rationale: O sujeito mais natural é Deus, retomado enfaticamente por הוּא na oração seguinte. A tradução preserva a forte reversão relacional sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação foi dividida em duas frases para clareza, sem enfraquecer a sequência lógica do hebraico. O marcador [a] aparece imediatamente após a expressão à qual se refere.
