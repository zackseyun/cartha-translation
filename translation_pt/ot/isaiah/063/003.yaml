  text: פּוּרָ֣ה דָּרַ֣כְתִּי לְ/בַדִּ֗/י וּ/מֵֽ/עַמִּים֙ אֵֽין אִ֣ישׁ אִתִּ֔/י וְ/אֶדְרְכֵ֣/ם בְּ/אַפִּ֔/י וְ/אֶרְמְסֵ֖/ם בַּ/חֲמָתִ֑/י וְ/יֵ֤ז נִצְחָ/ם֙ עַל בְּגָדַ֔/י וְ/כָל מַלְבּוּשַׁ֖/י אֶגְאָֽלְתִּי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/003.yaml
  text: I have trodden the winepress alone[a], and from the peoples no man was with me; I trod them in my anger and trampled them in my wrath; their lifeblood spattered on my garments[b], and I stained all my clothing.
translation:
  language: pt
  text: Pisei sozinho o lagar[a]; dos povos, nenhum homem estava comigo. Eu os pisei na minha ira e os calquei no meu furor; o sangue deles salpicou as minhas vestes[b], e manchei toda a minha roupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem que ninguém estivesse comigo”. O hebraico diz literalmente: “nenhum homem estava comigo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o seu sumo”. O termo hebraico pode evocar o sumo que corre das uvas no lagar, ao mesmo tempo que se refere ao sangue dos que são julgados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוּרָה
  choice: o lagar
  rationale: Designa o lugar onde as uvas eram pisadas. “Lagar” é a expressão portuguesa tradicional e ainda clara, preservando a metáfora do juízo.
- source_word: דָּרַכְתִּי
  choice: Pisei
  rationale: O perfeito hebraico apresenta a ação como concluída. “Pisei” é natural em português e preserva a ação própria do lagar.
- source_word: לְבַדִּי
  choice: sozinho
  rationale: Expressa de modo direto e idiomático que a ação foi realizada sem auxílio.
- source_word: וּמֵעַמִּים
  choice: dos povos
  rationale: Mantém o plural coletivo de עַמִּים e a ideia de que ninguém procedente desses povos acompanhava o falante.
- source_word: אֵין אִישׁ אִתִּי
  choice: nenhum homem estava comigo
  rationale: Preserva o substantivo singular masculino אִישׁ e a ênfase na completa solidão, enquanto a nota registra a alternativa idiomática abrangente.
- source_word: וְאֶדְרְכֵם
  choice: Eu os pisei
  rationale: Repete o verbo “pisar”, refletindo a repetição da raiz דרך e ligando diretamente os povos à imagem do lagar.
- source_word: בְּאַפִּי
  choice: na minha ira
  rationale: אַף significa idiomaticamente ira neste contexto; a formulação conserva a linguagem pessoal e intensa do hebraico.
- source_word: וְאֶרְמְסֵם
  choice: e os calquei
  rationale: “Calcar” expressa pisar com força e distingue este verbo do anterior, preservando a intensificação poética sem linguagem excessivamente arcaica.
- source_word: בַּחֲמָתִי
  choice: no meu furor
  rationale: חֵמָה comunica ira ardente. “Furor” mantém o registro elevado e a diferencia de אַף, traduzido por “ira”.
- source_word: וְיֵז
  choice: salpicou
  rationale: O verbo descreve líquido que espirra ou se projeta. “Salpicou” é vívido e natural com “vestes”.
- source_word: נִצְחָם
  choice: o sangue deles
  rationale: O termo pode evocar o líquido ou sumo que corre no lagar, mas, aplicado aos povos julgados, refere-se ao sangue. A nota preserva essa sobreposição metafórica.
- source_word: בְּגָדַי
  choice: as minhas vestes
  rationale: “Vestes” corresponde ao registro poético e permite variar naturalmente com מַלְבּוּשַׁי, traduzido por “minha roupa”.
- source_word: וְכָל מַלְבּוּשַׁי אֶגְאָלְתִּי
  choice: e manchei toda a minha roupa
  rationale: Reproduz a consequência do sangue projetado sobre a totalidade da roupa, em linguagem clara e digna.
theological_decisions:
- issue: Imagem do guerreiro divino e do juízo
  choice: Manter a fala divina em primeira pessoa e a violenta metáfora do lagar sem suavização.
  alternative: Abstrair a cena como simples vitória ou atenuar a linguagem de ira e furor.
  rationale: O hebraico retrata o juízo solitário de YHWH em termos pessoais e vívidos. A tradução conserva a tensão entre ira e justiça, sem acrescentar interpretação cristológica ou denominacional.
- issue: O singular masculino אִישׁ
  choice: Traduzir no texto principal como “nenhum homem estava comigo”.
  alternative: “Ninguém estava comigo.”
  rationale: A opção principal conserva a forma lexical masculina do hebraico; a nota oferece a formulação portuguesa mais abrangente e idiomática sem alterar o sentido.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A repetição de “pisei” conserva o vínculo verbal da metáfora; “calquei” intensifica a ação. “Lagar”, “vestes”, “ira” e “furor” sustentam o tom elevado sem recorrer a sintaxe arcaica.
