  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִי זֶ֣ה בָּ֣א מֵ/אֱד֗וֹם חֲמ֤וּץ בְּגָדִים֙ מִ/בָּצְרָ֔ה זֶ֚ה הָד֣וּר בִּ/לְבוּשׁ֔/וֹ צֹעֶ֖ה בְּ/רֹ֣ב כֹּח֑/וֹ אֲנִ֛י מְדַבֵּ֥ר בִּ/צְדָקָ֖ה רַ֥ב לְ/הוֹשִֽׁיעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/001.yaml
  text: Who is this coming from Edom[a], with crimson garments from Bozrah—this one splendid in his clothing, marching in the greatness of his strength? It is I, speaking in righteousness[c][b], mighty to save.
translation:
  language: pt
  text: Quem é este que vem de Edom, de Bozra, com roupas avermelhadas[a] — este, esplêndido em sua veste, avançando[b] na grandeza de sua força? “Sou eu, que falo em retidão[c], poderoso para salvar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com roupas manchadas de vermelho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “caminhando a passos largos”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com justiça”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמוּץ בְּגָדִים
  choice: roupas tingidas de vermelho
  rationale: Expressa que as roupas foram avermelhadas, sem antecipar explicitamente neste versículo a causa indicada pela imagem do lagar no contexto seguinte.
- source_word: הָדוּר בִּלְבוּשׁוֹ
  choice: esplêndido em sua veste
  rationale: Preserva a ideia de aparência imponente e magnífica, em registro elevado mas atual.
- source_word: צֹעֶה
  choice: avançando
  rationale: O termo hebraico é difícil e pode descrever um caminhar vigoroso ou imponente. 'Avançando' mantém a imagem de movimento sem definir em excesso sua maneira.
- source_word: בְּרֹב כֹּחוֹ
  choice: na grandeza de sua força
  rationale: Conserva os dois elementos da expressão hebraica — grandeza/abundância e força — e seu tom poético.
- source_word: מְדַבֵּר בִּצְדָקָה
  choice: falo com retidão
  rationale: Traduz צְדָקָה de modo amplo, abrangendo correção moral e judicial sem reduzir a expressão apenas à veracidade.
- source_word: רַב לְהוֹשִׁיעַ
  choice: poderoso para salvar
  rationale: Forma idiomática em português que comunica a grande capacidade do respondente para salvar ou libertar.
- source_word: מֵאֱדוֹם
  choice: de Edom
  rationale: Mantém o nome próprio da região indicada no texto.
- source_word: מִבָּצְרָה
  choice: de Bozra
  rationale: Mantém o nome próprio da cidade edomita em forma portuguesa corrente.
theological_decisions:
- issue: Identidade daquele que responde
  choice: A identidade permanece implícita no versículo.
  alternative: Identificá-lo expressamente como o SENHOR, como uma figura messiânica ou como uma personificação profética.
  rationale: O hebraico apresenta um diálogo dramático e não nomeia o respondente neste versículo; a tradução preserva essa tensão.
- issue: Sentido de צְדָקָה
  choice: retidão
  alternative: justiça
  rationale: '''Retidão'' mantém em primeiro plano a correção moral e pactual, enquanto ''justiça'' continua sendo uma nuance contextual legítima, registrada em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. A pergunta foi dividida em duas para maior clareza oral, e a resposta direta foi marcada com aspas. Todos os marcadores de nota aparecem no texto principal.
