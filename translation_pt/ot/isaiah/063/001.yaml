  to: Quem é este que vem de Edom, de Bozra, com roupas avermelhadas[a] — este, esplêndido em sua veste, avançando[b] na grandeza de sua força? “Sou eu, que falo em retidão[c], poderoso para salvar.”
  rationale: A revisão elimina a implicação indevida de que as vestes foram tingidas, preservando a descrição cromática e a ambiguidade contextual do hebraico. Também restaura a pergunta única do original e ajusta «com retidão» para «em retidão», mantendo todas as âncoras de nota e seus sentidos alternativos.
