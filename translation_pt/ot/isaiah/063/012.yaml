  text: מוֹלִיךְ֙ לִ/ימִ֣ין מֹשֶׁ֔ה זְר֖וֹעַ תִּפְאַרְתּ֑/וֹ בּ֤וֹקֵֽעַ מַ֨יִם֙ מִ/פְּנֵי/הֶ֔ם לַ/עֲשׂ֥וֹת ל֖/וֹ שֵׁ֥ם עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/012.yaml
  text: who led his glorious arm at the right hand of Moses, who split the waters before them to make for himself an everlasting name,
translation:
  language: pt
  text: que conduziu seu braço glorioso à direita de Moisés, que dividiu as águas diante deles para fazer para si um nome eterno,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: conduziu
  rationale: O particípio hifil descreve aquele que fazia seguir ou conduzia; “conduziu” é natural e mantém a imagem sem explicá-la além do hebraico.
- source_word: זְרוֹעַ תִּפְאַרְתּוֹ
  choice: seu braço glorioso
  rationale: Preserva a metáfora do braço como manifestação do poder divino e traduz תִּפְאֶרֶת como glória/esplendor.
- source_word: לִימִין מֹשֶׁה
  choice: à direita de Moisés
  rationale: Mantém a relação espacial e simbólica expressa literalmente no texto, sem substituí-la por uma interpretação como “por meio de Moisés”.
- source_word: בּוֹקֵעַ מַיִם
  choice: dividiu as águas
  rationale: בקע indica abrir, fender ou partir; no contexto do êxodo, “dividiu as águas” comunica claramente a ação sem perder a imagem.
- source_word: שֵׁם עוֹלָם
  choice: nome eterno
  rationale: Tradução direta da expressão, que aponta para uma reputação ou renome duradouro sem exigir que essa explicação seja inserida no texto.
theological_decisions:
- issue: Relação entre o braço glorioso de Deus e Moisés
  choice: manter “seu braço glorioso à direita de Moisés”
  alternative: explicitar o braço como poder de Deus atuando por meio de Moisés
  rationale: O hebraico conserva a personificação e a posição “à direita”; a tradução não deve resolver a imagem teológica de modo mais específico que a fonte.
- issue: Finalidade da divisão das águas
  choice: “para fazer para si um nome eterno”
  alternative: “para conquistar renome eterno”
  rationale: A formulação reflexiva e teleológica do original é preservada, incluindo a linguagem bíblica de Deus fazer para si um nome.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura relativa compatível com a continuidade do período em Isaías 63:11–14. A vírgula final foi mantida porque o versículo integra uma frase que prossegue no contexto.
