revisions:
- from: Contarei os atos de amor leal[a] de Yahweh[b], os feitos de Yahweh dignos de louvor, por tudo o que Yahweh nos concedeu[c], e a grande bondade para com a casa de Israel, que ele lhes concedeu segundo a sua compaixão e segundo a abundância do seu amor leal.
  to: Contarei os atos de amor leal[a] de Yahweh[b], os louvores de Yahweh, conforme tudo o que Yahweh nos concedeu[c], e a grande bondade para com a casa de Israel, que ele lhes concedeu segundo a sua compaixão e segundo a abundância do seu amor leal.
  rationale: 'A revisão limita-se a reduzir duas explicitações interpretativas: restitui «os louvores de Yahweh» para תְּהִלּוֹת e emprega «conforme tudo o que» para כְּעַל כֹּל אֲשֶׁר. Mantêm-se as demais escolhas e todas as âncoras de nota.'
