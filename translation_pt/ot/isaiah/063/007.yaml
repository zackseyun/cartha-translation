  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַֽסְדֵ֨י יְהוָ֤ה אַזְכִּיר֙ תְּהִלֹּ֣ת יְהוָ֔ה כְּ/עַ֕ל כֹּ֥ל אֲשֶׁר גְּמָלָ֖/נוּ יְהוָ֑ה וְ/רַב טוּב֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל אֲשֶׁר גְּמָלָ֥/ם כְּֽ/רַחֲמָ֖י/ו וּ/כְ/רֹ֥ב חֲסָדָֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/007.yaml
  text: I will recount the steadfast love of Yahweh[a], the praises of Yahweh, according to all that Yahweh has bestowed on us[c][b], and the great goodness to the house of Israel that he has bestowed on them according to his compassion and according to the abundance of his steadfast love.
translation:
  language: pt
  text: Contarei os atos de amor leal[a] de Yahweh[b], os louvores de Yahweh, conforme tudo o que Yahweh nos concedeu[c], e a grande bondade para com a casa de Israel, que ele lhes concedeu segundo a sua compaixão e segundo a abundância do seu amor leal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “misericórdias”, “bondades” ou “atos de fidelidade”; o hebraico חֶסֶד denota amor bondoso, constante e leal.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” translitera o nome divino YHWH, tradicionalmente representado por “SENHOR”; outra forma conhecida é “Jeová”.
    reason: alternative_reading
  - marker: c
    text: Ou “nos tratou generosamente” ou “fez por nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי / חֲסָדָיו
  choice: atos de amor leal / amor leal
  rationale: חסד expressa bondade e amor constantes, frequentemente no contexto de lealdade relacional e pactual. “Amor leal” preserva essas dimensões sem restringir o termo apenas a “misericórdia”; na primeira ocorrência, o plural é representado por “atos de amor leal”.
- source_word: אַזְכִּיר
  choice: Contarei
  rationale: O hifil de זכר, neste contexto de louvor público, indica trazer verbalmente à memória ou relatar, não apenas recordar em silêncio. “Contarei” é natural e comunica essa ação declarativa.
- source_word: תְּהִלֹּת
  choice: os feitos de Yahweh dignos de louvor
  rationale: O plural pode designar louvores ou aquilo que dá motivo ao louvor. A formulação escolhida torna claro que os atos de Yahweh estão sendo celebrados, em harmonia com as orações explicativas seguintes.
- source_word: כְּעַל כֹּל אֲשֶׁר
  choice: por tudo o que
  rationale: A expressão introduz a base ou o motivo do relato de louvor. “Por tudo o que” é idiomático em português e preserva essa relação sem impor uma causalidade mais técnica.
- source_word: גְּמָלָנוּ / גְּמָלָם
  choice: nos concedeu / lhes concedeu
  rationale: גמל pode significar tratar, retribuir ou conceder. O contexto positivo favorece a ideia de benefício generosamente conferido; a alternância hebraica entre “nós” e “eles” foi mantida.
- source_word: וְרַב טוּב
  choice: e a grande bondade
  rationale: A expressão enfatiza a magnitude da bondade divina. “Grande bondade” é clara, digna e próxima da construção hebraica.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para com a casa de Israel
  rationale: “Casa de Israel” conserva a designação coletiva e pactual; “para com” expressa naturalmente a direção da bondade.
- source_word: כְּרַחֲמָיו
  choice: segundo a sua compaixão
  rationale: רחמים denota misericórdia ou compaixão profunda. O singular coletivo “compaixão” é natural em português e conserva a força afetiva do termo.
- source_word: וּכְרֹב חֲסָדָיו
  choice: e segundo a abundância do seu amor leal
  rationale: רֹב exprime abundância, enquanto חסד retoma o amor constante e leal. A repetição de “amor leal” mantém a coesão lexical do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo tetragrama YHWH, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente pelo título “Senhor”.
- issue: Amplitude teológica de חסד
  choice: amor leal
  alternative: misericórdia; bondade; fidelidade à aliança
  rationale: “Amor leal” mantém juntas a afeição, a constância e a lealdade relacional do termo, sem converter uma de suas dimensões em definição exclusiva.
- issue: Mudança de pessoa entre גְּמָלָנוּ e גְּמָלָם
  choice: manter “nos” e depois “lhes”
  alternative: uniformizar como “nos” ou “lhes”
  rationale: A mudança do envolvimento do falante para a referência à casa de Israel está no hebraico e pode ser retoricamente significativa; por isso, não foi harmonizada.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A estrutura cumulativa do hebraico foi preservada sem tornar o período artificial; o vocabulário evita arcaísmos e formulações confessionais particulares.
