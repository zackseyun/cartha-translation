  text: כַּ/בְּהֵמָה֙ בַּ/בִּקְעָ֣ה תֵרֵ֔ד ר֥וּחַ יְהוָ֖ה תְּנִיחֶ֑/נּוּ כֵּ֚ן נִהַ֣גְתָּ עַמְּ/ךָ֔ לַ/עֲשׂ֥וֹת לְ/ךָ֖ שֵׁ֥ם תִּפְאָֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/014.yaml
  text: Like livestock going down into the valley[a], the Spirit of Yahweh gave them rest; so you led your people[c][b], to make for yourself a glorious name.
translation:
  language: pt
  text: Como o gado que desce ao vale, o Espírito de Yahweh[a] lhe deu descanso[b]; assim conduziste o teu povo, para fazer para ti um nome glorioso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o vento de Yahweh”. O hebraico רוּחַ pode significar “espírito”, “vento” ou “sopro”, embora “Espírito” se ajuste melhor ao contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “deu descanso a ele”. O singular provavelmente se refere a Israel como um povo considerado coletivamente. Também se pode traduzir: “deu-lhes descanso”.'
    reason: alternative_reading
  - marker: c
    text: Ou “um nome de glória”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבְּהֵמָה
  choice: Como o gado
  rationale: בְּהֵמָה é um termo coletivo para animais domésticos de grande porte; “gado” preserva o sentido coletivo e torna natural a imagem pastoril em português.
- source_word: בַּבִּקְעָה
  choice: ao vale
  rationale: בִּקְעָה pode designar um vale amplo ou planície entre elevações. Com o verbo “descer”, “ao vale” expressa de modo conciso o movimento para esse terreno.
- source_word: תֵרֵד
  choice: que desce
  rationale: O imperfeito singular concorda com o coletivo בְּהֵמָה; “que desce” mantém essa forma e produz uma comparação natural em português.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: רוּחַ pode significar espírito, vento ou sopro, mas neste contexto de orientação divina e descanso, “Espírito” é a leitura mais provável. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: תְּנִיחֶנּוּ
  choice: lhe deu descanso
  rationale: O hifil de נוח significa “fazer descansar” ou “dar descanso”. O pronome “lhe” conserva o sufixo masculino singular hebraico, entendido no contexto como referência coletiva ao povo.
- source_word: כֵּן
  choice: assim
  rationale: Introduz a correspondência entre a comparação e a ação divina; “assim” é claro e digno em português.
- source_word: נִהַגְתָּ
  choice: conduziste
  rationale: O verbo indica guiar ou conduzir. “Conduziste” preserva o vínculo com a imagem do gado sem sugerir coerção indevida.
- source_word: עַמְּךָ
  choice: o teu povo
  rationale: Em contexto de aliança, עַם designa o povo pertencente a Deus; a forma com “teu” é direta e natural.
- source_word: לַעֲשׂוֹת לְךָ
  choice: para fazeres para ti
  rationale: A construção infinitiva expressa propósito, e o segundo “para ti” representa explicitamente o dativo pronominal sem acrescentar interpretação.
- source_word: שֵׁם תִּפְאָרֶת
  choice: um nome glorioso
  rationale: A expressão construta descreve um nome caracterizado por glória ou esplendor. “Um nome glorioso” é idiomático e mantém o sentido honorífico.
theological_decisions:
- issue: Referente do sufixo singular em תְּנִיחֶנּוּ
  choice: Conservar o singular em “lhe deu descanso”, entendendo-o como singular coletivo referente ao povo de Israel.
  alternative: Empregar o plural “deu-lhes descanso” para explicitar a referência ao povo.
  rationale: O sufixo hebraico é inequivocamente singular, embora o contexto indique um referente coletivo. A tradução conserva a forma da fonte sem negar seu sentido corporativo.
- issue: Sentido de רוּחַ יְהוָה
  choice: “o Espírito de Yahweh”
  alternative: “o vento de Yahweh” ou “o sopro de Yahweh”
  rationale: A recordação da condução e do descanso concedidos por Deus favorece a atuação pessoal do Espírito, mas a polissemia de רוּחַ é preservada em nota.
- issue: Relação entre שֵׁם e תִּפְאָרֶת
  choice: “um nome glorioso”
  alternative: “um nome de glória”
  rationale: A forma adjetival comunica naturalmente em português que o nome é marcado por glória, enquanto a alternativa mais formal é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa do singular coerentes com a fala dirigida a Deus. A sintaxe mantém o paralelismo poético e a comparação pastoril sem soar arcaica; “Yahweh” preserva o nome divino.
