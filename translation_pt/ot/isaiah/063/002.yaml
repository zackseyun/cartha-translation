  text: מַדּ֥וּעַ אָדֹ֖ם לִ/לְבוּשֶׁ֑/ךָ וּ/בְגָדֶ֖י/ךָ כְּ/דֹרֵ֥ךְ בְּ/גַֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/002.yaml
  text: Why is your clothing red[b][a], and your garments like one who treads in the winepress?
translation:
  language: pt
  text: Por que a sua roupa está vermelha[a], e as suas vestes são como as de quem pisa uvas no lagar?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «avermelhada» ou «escarlate». O hebraico diz simplesmente «vermelha», deixando que o contexto esclareça a causa.'
    reason: lexical_alternative
  - marker: b
    text: A comparação é com alguém que pisa uvas num lagar e fica com as vestes tingidas de vermelho pelo sumo.
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Por que
  rationale: Interrogativo direto e natural em português, correspondente ao pedido de explicação expresso no hebraico.
- source_word: אָדֹם
  choice: está vermelha
  rationale: Preserva a indicação simples da cor sem antecipar a explicação dada pelo contexto; a construção com «está» soa natural para a aparência circunstancial da roupa.
- source_word: לִלְבוּשֶׁךָ
  choice: a sua roupa
  rationale: לְבוּשׁ designa roupa ou vestimenta de modo amplo; «roupa» é atual, claro e não restringe o sentido a um manto específico.
- source_word: וּבְגָדֶיךָ
  choice: e as suas vestes
  rationale: Mantém o paralelismo poético com «roupa» e emprega linguagem digna e facilmente compreensível.
- source_word: כְּדֹרֵךְ
  choice: como as de quem pisa uvas
  rationale: Expressa a comparação e o valor participial de alguém ocupado em pisar; «uvas» fica explícito como complemento culturalmente implícito na ação realizada no lagar.
- source_word: בְּגַת
  choice: no lagar
  rationale: גַּת é o local onde se pisam uvas para extrair o sumo; «lagar» é o equivalente português tradicional e preciso.
theological_decisions:
- issue: Se a imagem de sangue e juízo por trás das roupas vermelhas deve ser explicitada
  choice: Manter a descrição visual «vermelha», sem acrescentar «manchada de sangue».
  alternative: Traduzir como «manchada de sangue» ou «ensanguentada».
  rationale: O hebraico deste versículo menciona apenas a cor vermelha e a comparação com quem pisa no lagar. A relação com sangue e juízo se esclarece no contexto seguinte; explicitá-la aqui eliminaria prematuramente a tensão da imagem.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo poético entre «roupa» e «vestes» e mantém a imagem do lagar sem antecipar sua interpretação no versículo seguinte.
