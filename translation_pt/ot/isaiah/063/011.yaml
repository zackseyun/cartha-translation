source:
  edition: WLC
  text: וַ/יִּזְכֹּ֥ר יְמֵֽי עוֹלָ֖ם מֹשֶׁ֣ה עַמּ֑/וֹ אַיֵּ֣ה הַֽ/מַּעֲלֵ֣/ם מִ/יָּ֗ם אֵ֚ת רֹעֵ֣י צֹאנ֔/וֹ אַיֵּ֛ה הַ/שָּׂ֥ם בְּ/קִרְבּ֖/וֹ אֶת ר֥וּחַ קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/011.yaml
  text: 'Then he remembered the ancient days[b][a], Moses and his people: “Where is the one who brought them up out of the sea with the shepherds of his flock? Where is the one who put his Holy Spirit within him?”'
translation:
  language: pt
  text: 'Então ele se lembrou dos dias antigos, de Moisés e do seu povo: “Onde está aquele que os fez sair do mar com os pastores do seu rebanho?[a] Onde está aquele que pôs dentro dele o seu Espírito Santo?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “com os pastores do seu rebanho”; alguns leem “com o pastor do seu rebanho”, provavelmente em referência a Moisés.'
    reason: alternative_reading
  - marker: b
    text: Ou “dentro deles” ou “no meio deles”. O hebraico tem um sufixo singular (“dentro dele”), mas não está claro a quem ele se refere.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Então ele se lembrou
  rationale: O wayyiqtol de זכר dá sequência ao discurso; “então” expressa naturalmente essa progressão, mantendo o sujeito singular sem explicitar além do hebraico quem ele é.
- source_word: יְמֵי עוֹלָם
  choice: os dias antigos
  rationale: A expressão aponta para tempos remotos, especialmente os atos salvadores fundacionais relembrados no contexto.
- source_word: מֹשֶׁה עַמּוֹ
  choice: de Moisés e do seu povo
  rationale: A sequência hebraica é comprimida e sintaticamente difícil. A formulação associa Moisés e o povo aos dias recordados sem introduzir “servo”, termo ausente do texto.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Mantém a repetição e o presente retórico da lamentação.
- source_word: הַמַּעֲלֵם מִיָּם
  choice: aquele que os fez subir do mar
  rationale: O causativo de עלה, com sufixo plural, descreve a ação de fazer o povo subir para fora do mar no êxodo.
- source_word: אֵת רֹעֵי צֹאנוֹ
  choice: com os pastores do seu rebanho
  rationale: Preserva o plural da vocalização massorética, apesar da possibilidade contextual de uma leitura singular referente a Moisés.
- source_word: הַשָּׂם
  choice: aquele que pôs
  rationale: Traduz o particípio de שׂים em paralelo com “aquele que os fez subir”.
- source_word: בְּקִרְבּוֹ
  choice: dentro dele
  rationale: Conserva o sufixo masculino singular do texto massorético, deixando a identidade do referente em aberto.
- source_word: רוּחַ קָדְשׁוֹ
  choice: o seu Espírito Santo
  rationale: Expressa a referência ao Espírito divino e mantém a formulação marcada que também ocorre em Isaías 63:10.
theological_decisions:
- issue: Sujeito de “se lembrou”
  choice: Manter o sujeito singular como “ele”, sem nomeá-lo
  alternative: 'Entender “seu povo” como sujeito: “seu povo se lembrou”'
  rationale: A forma verbal é singular, e o contexto permite entender o SENHOR como sujeito; contudo, a sintaxe é difícil. O pronome preserva a leitura adotada sem inserir explicitamente “Deus” ou “o SENHOR”.
- issue: Referente de “dentro dele”
  choice: Preservar o singular do hebraico
  alternative: “dentro deles” ou “no meio deles”
  rationale: O sufixo massorético é singular, mas pode referir-se a Moisés ou ao povo considerado coletivamente; a nota conserva as alternativas sem resolver uma ambiguidade teologicamente relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A repetição retórica de “Onde está aquele” e as ambiguidades do hebraico foram preservadas; os marcadores aparecem junto às expressões a que suas notas se referem.
