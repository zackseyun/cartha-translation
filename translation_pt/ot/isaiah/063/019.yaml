source:
  edition: WLC
  text: הָיִ֗ינוּ מֵֽ/עוֹלָם֙ לֹֽא מָשַׁ֣לְתָּ בָּ֔/ם לֹֽא נִקְרָ֥א שִׁמְ/ךָ֖ עֲלֵי/הֶ֑ם לוּא קָרַ֤עְתָּ שָׁמַ֨יִם֙ יָרַ֔דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/019.yaml
  text: We have become like those over whom you have never ruled[a], those who were never called by your name. If only you would tear open the heavens and come down[b]; before you the mountains would quake.
translation:
  language: pt
  text: Tornamo-nos como aqueles sobre os quais nunca governaste[a], aqueles que nunca foram chamados pelo teu nome. Ah, se rasgasses os céus e descesses! Diante de ti[b], os montes tremeriam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é condensada; mais literalmente, pode incluir a ideia de “desde a antiguidade” ou “desde sempre”.
    reason: textual_ambiguity
  - marker: b
    text: 'Mais literalmente: “de diante da tua face/presença”.'
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “os montes escorreriam” ou “se derreteriam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִינוּ
  choice: Tornamo-nos
  rationale: O perfeito de היה pode expressar um estado presente resultante de circunstâncias anteriores. No lamento, “tornamo-nos” comunica que Israel agora se encontra numa condição semelhante à de povos alheios ao governo de Deus.
- source_word: מֵעוֹלָם לֹא מָשַׁלְתָּ בָּם
  choice: como aqueles sobre os quais nunca governaste
  rationale: A construção hebraica é comprimida e difícil. A formulação idiomática conserva o sentido contextual de Israel ter passado a parecer-se com povos que jamais estiveram sob o governo de Deus, mantendo em nota a nuance temporal mais literal de מֵעוֹלָם.
- source_word: לֹא נִקְרָא שִׁמְךָ עֲלֵיהֶם
  choice: como os que nunca foram chamados pelo teu nome
  rationale: A expressão passiva indica identificação e pertencimento associados ao nome de Deus. A tradução mantém a imagem hebraica sem explicá-la excessivamente.
- source_word: לוּא
  choice: Ah, se
  rationale: A partícula introduz um desejo intenso. “Ah, se” é natural em português atual e preserva a urgência do lamento.
- source_word: קָרַעְתָּ שָׁמַיִם
  choice: rasgasses os céus
  rationale: קרע significa rasgar. O imperfeito do subjuntivo português, regido por “Ah, se”, expressa adequadamente o desejo, sem enfraquecer a imagem vívida.
- source_word: יָרַדְתָּ
  choice: descesses
  rationale: 'Sob o alcance optativo de לוּא, a forma verbal participa do desejo expresso: que Deus desça.'
- source_word: מִפָּנֶיךָ
  choice: Diante de ti
  rationale: A expressão significa literalmente “de diante da tua face/presença” e descreve a reação da criação à manifestação divina.
- source_word: הָרִים נָזֹלּוּ
  choice: os montes tremeriam
  rationale: נזל significa literalmente fluir ou escorrer e, nesta imagem teofânica, pode retratar os montes derretendo-se ou desfazendo-se diante de Deus. “Tremeriam” comunica com naturalidade o efeito dramático, enquanto as imagens mais literais são preservadas em nota.
theological_decisions:
- issue: Identidade de aliança na expressão “teu nome foi chamado sobre eles”
  choice: como os que nunca foram chamados pelo teu nome
  alternative: como aqueles sobre os quais o teu nome nunca foi invocado
  rationale: O hebraico pode apontar para identificação e pertencimento a Deus, e não apenas para um ato verbal de invocação. A tradução conserva essa dimensão sem impor uma formulação doutrinária específica.
- issue: Resposta dos montes à manifestação divina
  choice: os montes tremeriam
  alternative: os montes se derreteriam / escorreriam
  rationale: A tradução principal torna clara a reação cósmica à descida de Deus, mas a nota preserva a metáfora lexical mais concreta e a tensão poética do original.
- issue: Relação sintática da última oração com o desejo precedente
  choice: 'Oração independente: “Diante de ti, os montes tremeriam”'
  alternative: “para que diante de ti os montes tremessem”
  rationale: O hebraico não traz um conector final explícito. A pontuação evita acrescentar “para que” e deixa aberta a relação exata entre a descida divina e a reação dos montes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais naturais no lamento (“Ah, se...”). Emprega “tu” em coerência com a oração dirigida diretamente a Deus. A pontuação evita inserir uma relação de finalidade ausente do hebraico, e as notas preservam as principais ambiguidades lexicais.
