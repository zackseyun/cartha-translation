  text: כִּ֛י י֥וֹם נָקָ֖ם בְּ/לִבִּ֑/י וּ/שְׁנַ֥ת גְּאוּלַ֖/י בָּֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/004.yaml
  text: For the day of vengeance was in my heart[a], and the year of my redeemed had come.
translation:
  language: pt
  text: Pois o dia da vingança estava no meu coração, e o ano daqueles que resgatei[a] havia chegado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o ano da minha redenção” ou “o ano do meu resgate”. O hebraico pode referir-se àqueles que o falante resgatou ou ao seu ato de resgatar.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da ação descrita no contexto anterior e mantém de modo natural a ligação explicativa do hebraico.
- source_word: יוֹם נָקָם
  choice: o dia da vingança
  rationale: Conserva a imagem temporal concreta e o sentido de retribuição punitiva, sem reduzir “dia” a uma paráfrase genérica.
- source_word: בְּלִבִּי
  choice: estava no meu coração
  rationale: Preserva a expressão antropológica hebraica para a intenção ou determinação interior do falante.
- source_word: וּשְׁנַת גְּאוּלַי
  choice: e o ano dos meus resgatados
  rationale: גְּאוּלַי é mais diretamente entendido, segundo sua forma, como “meus resgatados”. A construção expressa o ano relacionado àqueles que pertencem ao Redentor por terem sido resgatados, em paralelo ao “dia da vingança”.
- source_word: בָּאָה
  choice: havia chegado
  rationale: O mais-que-perfeito comunica que o tempo determinado já tinha chegado na perspectiva narrativa do falante.
theological_decisions:
- issue: Relação entre o juízo divino e o resgate em גְּאוּלַי
  choice: meus resgatados
  alternative: minha redenção / meu ato de resgatar
  rationale: A forma hebraica favorece a referência às pessoas resgatadas, enquanto o contexto associa o ano tanto a elas quanto à ação redentora. A tradução principal segue a morfologia, e a nota conserva a possibilidade contextual ligada ao ato de resgatar, sem eliminar a tensão entre juízo e salvação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Vingança” e “coração” preservam as imagens fortes do hebraico; “resgatados” evita transformar silenciosamente uma forma pessoal em substantivo abstrato.
