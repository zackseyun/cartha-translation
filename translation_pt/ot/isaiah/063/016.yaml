source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אָבִ֔י/נוּ כִּ֤י אַבְרָהָם֙ לֹ֣א יְדָעָ֔/נוּ וְ/יִשְׂרָאֵ֖ל לֹ֣א יַכִּירָ֑/נוּ אַתָּ֤ה יְהוָה֙ אָבִ֔י/נוּ גֹּאֲלֵ֥/נוּ מֵֽ/עוֹלָ֖ם שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/016.yaml
  text: For you are our Father[a], though Abraham does not know us and Israel does not acknowledge us; you, O Yahweh, are our Father[b]; our Redeemer from of old is your name.
translation:
  language: pt
  text: Pois tu és nosso Pai, ainda que Abraão não nos conheça e Israel[b] não nos reconheça. Tu, Yahweh, és nosso Pai; nosso Redentor desde os tempos antigos é o teu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nosso Redentor desde sempre é o teu nome.”'
    reason: Leitura alternativa para מֵעוֹלָם, que pode exprimir tanto antiguidade remota quanto duração ilimitada.
  - marker: b
    text: Aqui, “Israel” provavelmente se refere a Jacó, o patriarca, em paralelo com Abraão.
    reason: Esclarece o referente provável sem substituir no texto principal o nome usado no hebraico.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da súplica no contexto e conserva a força explicativa do hebraico.
- source_word: אָבִינוּ
  choice: nosso Pai
  rationale: A referência direta a Deus é relacional e teológica, não apenas genealógica; “Pai” preserva seu sentido pessoal e pactual.
- source_word: יְדָעָנוּ
  choice: não nos conheça
  rationale: O qal de ידע significa normalmente “conhecer”; aqui indica ausência de conhecimento ou reconhecimento relacional por parte de Abraão.
- source_word: יַכִּירָנוּ
  choice: não nos reconheça
  rationale: O hifil de נכר pode significar reconhecer ou dar-se conta da identidade de alguém. “Reconheça” mantém a distinção em relação a “conheça” sem ampliar indevidamente o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: גֹּאֲלֵנוּ
  choice: nosso Redentor
  rationale: גאל designa quem resgata ou liberta, muitas vezes com implicações de parentesco. “Redentor” é a forma concisa e natural, sem tornar explícita uma nuance de parentesco que o versículo não desenvolve.
- source_word: מֵעוֹלָם
  choice: desde a antiguidade
  rationale: עוֹלָם pode indicar um passado remoto ou duração sem fim. “Desde a antiguidade” conserva a profundidade temporal sem impor ao texto uma leitura metafísica mais forte.
- source_word: שְׁמֶךָ
  choice: é o teu nome
  rationale: A oração nominal hebraica é naturalmente expressa em português com o verbo “ser”, preservando a estrutura predicativa e a ideia de identidade ou reputação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Força temporal de מֵעוֹלָם
  choice: desde a antiguidade
  alternative: desde sempre
  rationale: A expressão admite tanto a ideia de antiguidade remota quanto a de duração ilimitada. O texto principal evita decidir além do que a frase exige, e a nota preserva a leitura alternativa.
- issue: Referente de יִשְׂרָאֵל
  choice: Israel, isto é, provavelmente o patriarca Jacó
  alternative: Israel como o povo de Israel
  rationale: O paralelismo com Abraão favorece a referência ao patriarca Jacó, mas o texto principal mantém simplesmente “Israel”, preservando a forma e a possível amplitude do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético foram preservados sem rigidez excessiva. As aspas delimitam a expressão que funciona como nome ou designação de Yahweh; os marcadores foram posicionados junto às expressões a que suas notas se referem.
