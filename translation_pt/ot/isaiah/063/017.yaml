revisions:
- from: Por que, Yahweh, nos fazes andar desgarrados dos teus caminhos e endureces o nosso coração, afastando-o do temor de ti? Volta[a] por amor dos teus servos, das tribos da tua herança.
  to: Por que, Yahweh, nos fazes andar desgarrados dos teus caminhos e endureces o nosso coração, afastando-o do temor de ti? Volta[a] por amor dos teus servos, as tribos da tua herança.
  rationale: 'A única correção necessária é sintática: «as tribos da tua herança» deixa clara a aposição a «teus servos», refletindo a relação da frase hebraica sem alterar seu sentido. Mantêm-se a atribuição causativa direta, o singular coletivo e a nota sobre «Volta».'
