  text: לָ֣/מָּה תַתְעֵ֤/נוּ יְהוָה֙ מִ/דְּרָכֶ֔י/ךָ תַּקְשִׁ֥יחַ לִבֵּ֖/נוּ מִ/יִּרְאָתֶ֑/ךָ שׁ֚וּב לְמַ֣עַן עֲבָדֶ֔י/ךָ שִׁבְטֵ֖י נַחֲלָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/017.yaml
  text: Why[a], Yahweh, do you make us wander from your ways and harden our hearts from fearing you? Return for the sake of your servants[c][b], the tribes of your inheritance.
translation:
  language: pt
  text: Por que, Yahweh, nos fazes andar desgarrados dos teus caminhos e endureces o nosso coração, afastando-o do temor de ti? Volta[a] por amor dos teus servos, as tribos da tua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Volta-te”. O pedido é para que Deus torne a voltar-se para o seu povo com presença e favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Introduz diretamente a pergunta de lamento, sem acrescentar ênfase ausente do hebraico.
- source_word: תַתְעֵנוּ
  choice: nos fazes andar desgarrados
  rationale: Preserva o valor causativo do hifil de תעה e evita suavizá-lo para uma formulação meramente permissiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: מִדְּרָכֶיךָ
  choice: dos teus caminhos
  rationale: A preposição מן indica separação; com 'andar desgarrados', a construção portuguesa comunica naturalmente o afastamento dos caminhos de Deus.
- source_word: תַּקְשִׁיחַ
  choice: endureces
  rationale: Expressa diretamente o causativo 'tornar duro, endurecer'.
- source_word: לִבֵּנוּ
  choice: o nosso coração
  rationale: Mantém o singular coletivo hebraico, apresentando o povo como uma unidade.
- source_word: מִיִּרְאָתֶךָ
  choice: afastando-o do temor de ti
  rationale: Comunica a separação resultante do endurecimento e preserva o sentido de reverência ou temor dirigido a Deus.
- source_word: שׁוּב
  choice: Volta
  rationale: Pedido para que Deus volte a seu povo em presença e favor; a alternativa 'Volta-te' também é possível.
- source_word: לְמַעַן
  choice: por amor de
  rationale: Expressa o motivo ou benefício invocado na súplica de forma natural e dignificada em português.
- source_word: עֲבָדֶיךָ
  choice: teus servos
  rationale: Adequado ao contexto devocional e pactual, sem realçar indevidamente a condição de escravidão.
- source_word: שִׁבְטֵי נַחֲלָתֶךָ
  choice: das tribos da tua herança
  rationale: Entende 'as tribos da tua herança' como expressão em aposição a 'teus servos' e conserva a linguagem pactual de herança.
theological_decisions:
- issue: Causação divina no extravio e no endurecimento
  choice: Manter a atribuição causativa direta a Yahweh
  alternative: Suavizar para 'permites que nos desviemos' ou 'deixas nosso coração endurecer'
  rationale: Os dois verbos hebraicos estão no hifil e a oração atribui diretamente a ação a Deus. A tradução preserva a tensão do lamento sem explicar nem atenuar a soberania divina.
- issue: Singular coletivo de לִבֵּנוּ
  choice: o nosso coração
  alternative: os nossos corações
  rationale: A forma hebraica é singular com sufixo de primeira pessoa plural. O singular coletivo é compreensível em português e destaca a voz corporativa do povo.
- issue: Relação entre 'teus servos' e 'tribos da tua herança'
  choice: Tratar a segunda expressão como aposição explicativa
  alternative: Entender como dois grupos ou dois motivos distintos
  rationale: A ausência de conjunção e o contexto favorecem a identificação dos servos com as tribos pertencentes à herança de Yahweh.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. Conserva a segunda pessoa do singular em registro bíblico corrente ('fazes', 'teus') e mantém o singular coletivo 'o nosso coração'. O marcador [a] está colocado junto a 'Volta'.
