review_pass:
  verdict: revise
  source_fidelity: A tradução conserva adequadamente a pergunta de lamento, os causativos dirigidos a Yahweh, o singular coletivo «o nosso coração» e a súplica para que ele volte. Contudo, «das tribos da tua herança» não funciona bem como a aposição exigida pelo hebraico; pode ser lido como complemento de «servos», em vez de identificar os servos com as tribos.
  naturalness: O registro é digno, claro e compatível com português moderno de ampla compreensão. «Andar desgarrados» é compreensível, embora mais marcado que «desviar», e não requer alteração. A correção da aposição melhora decisivamente a fluência e a sintaxe.
  terminology: «Yahweh», «caminhos», «endureces», «temor», «servos» e «herança» são escolhas apropriadas. «Por amor dos» é uma formulação bíblica ainda inteligível e preserva bem o apelo «por causa/em favor de».
  issues:
  - severity: medium
    issue: Aposição introduzida por «das»
    rationale: 'Em «por amor dos teus servos, das tribos da tua herança», «das tribos» é uma construção apositiva inadequada e pode sugerir uma relação genitiva entre os servos e as tribos. O hebraico apresenta «as tribos da tua herança» em aposição a «teus servos». Deve-se usar o artigo definido: «teus servos, as tribos da tua herança».'
  revised_text: Por que, Yahweh, nos fazes andar desgarrados dos teus caminhos e endureces o nosso coração, afastando-o do temor de ti? Volta[a] por amor dos teus servos, as tribos da tua herança.
  revised_footnotes:
