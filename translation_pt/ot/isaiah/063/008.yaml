id: ISA.63.8
reference: Isaiah 63:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַךְ עַמִּ֣/י הֵ֔מָּה בָּנִ֖ים לֹ֣א יְשַׁקֵּ֑רוּ וַ/יְהִ֥י לָ/הֶ֖ם לְ/מוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/008.yaml
  text: For he said[a], “Surely they are my people, children who will not deal falsely”; so he became their Savior.
translation:
  language: pt
  text: 'Pois ele disse: “Certamente eles são o meu povo, filhos que não agirão com falsidade[a]”. Assim, ele se tornou o Salvador deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filhos que não mentirão” ou “filhos que não se mostrarão falsos”.'
    reason: A forma verbal de שׁקר admite o sentido mais específico de mentir e também o de mostrar-se falso ou desleal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pois ele disse
  rationale: O waw consecutivo dá continuidade à narrativa; no contexto, “Pois” expressa naturalmente a relação explicativa com o que precede, sem perder a introdução da fala.
- source_word: אַךְ
  choice: Certamente
  rationale: Aqui a partícula tem força enfática e afirmativa, não restritiva.
- source_word: עַמִּי הֵמָּה
  choice: eles são o meu povo
  rationale: Mantém a expressão coletiva de aliança e representa a ênfase do pronome independente הֵמָּה.
- source_word: בָּנִים
  choice: filhos
  rationale: Preserva diretamente a metáfora filial do hebraico. No contexto, o plural masculino se refere coletivamente ao povo, não apenas a homens.
- source_word: לֹא יְשַׁקֵּרוּ
  choice: não agirão com falsidade
  rationale: O piel de שׁקר pode indicar comportamento falso ou desleal, com alcance mais amplo que apenas proferir uma mentira; a nota registra alternativas legítimas.
- source_word: וַיְהִי לָהֶם
  choice: Assim, ele se tornou ... deles
  rationale: Expressa em português corrente a relação resultante indicada pela sequência narrativa, em vez de reproduzir literalmente “foi para eles”.
- source_word: לְמוֹשִׁיעַ
  choice: o Salvador
  rationale: O substantivo participial de ישׁע designa aquele que salva ou livra; “Salvador” conserva tanto o sentido quanto a força teológica do contexto.
theological_decisions:
- issue: Designação divina em לְמוֹשִׁיעַ
  choice: Salvador
  alternative: libertador
  rationale: O texto apresenta Deus como aquele que salva o seu povo. “Salvador” preserva essa força sem acrescentar ao versículo uma identificação doutrinária posterior.
- issue: Alcance de gênero de בָּנִים
  choice: filhos
  alternative: filhos e filhas; crianças
  rationale: “Filhos” preserva em português a relação filial e pode designar coletivamente os membros do povo. A escolha não restringe o referente aos homens.
- issue: Expectativa divina e futura infidelidade do povo
  choice: filhos que não agirão com falsidade
  alternative: filhos que não serão falsos
  rationale: A fala apresenta a expectativa ou caracterização divina no momento narrado. A tradução não harmoniza nem elimina a tensão com a infidelidade posteriormente narrada no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem e a metáfora filial do hebraico foram preservadas, enquanto a construção resultativa foi vertida de modo idiomático.
