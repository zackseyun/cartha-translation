  - severity: low
    issue: A nota usa “seiva” como alternativa principal para o termo raro נִצְחָם.
    rationale: No contexto do lagar, “suco” representa com mais precisão a alternativa de líquido extraído/esmagado. A nota ainda deve registrar que o sentido do hebraico permanece incerto.
