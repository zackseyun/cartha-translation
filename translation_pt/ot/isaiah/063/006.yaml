  text: וְ/אָב֤וּס עַמִּים֙ בְּ/אַפִּ֔/י וַ/אֲשַׁכְּרֵ֖/ם בַּ/חֲמָתִ֑/י וְ/אוֹרִ֥יד לָ/אָ֖רֶץ נִצְחָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/006.yaml
  text: I trampled peoples in my anger[a]; I made them drunk in my wrath[b], and I brought their lifeblood down to the earth.
translation:
  language: pt
  text: Pisei povos na minha ira; embriaguei-os no meu furor e fiz descer à terra o sangue deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e de sentido incerto; pode ser entendido como “suco” ou “sangue” e também como “vigor” ou “esplendor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּס
  choice: Pisei
  rationale: O verbo בוס indica pisar ou calcar sob os pés. “Pisei” conserva a imagem violenta do lagar e soa natural em português.
- source_word: עַמִּים
  choice: povos
  rationale: O plural de עַם pode significar “povos” ou “nações”. “Povos” evita a ideia anacrônica de Estados nacionais modernos.
- source_word: בְּאַפִּי
  choice: na minha ira
  rationale: אַף significa literalmente “nariz”, mas neste uso idiomático expressa ira. A tradução comunica o sentido, não o antropomorfismo lexical.
- source_word: וַאֲשַׁכְּרֵם
  choice: embriaguei-os
  rationale: A forma intensiva de שׁכר significa fazer alguém ficar bêbado. “Embriaguei-os” preserva diretamente a imagem de intoxicação ligada ao lagar.
- source_word: בַּחֲמָתִי
  choice: no meu furor
  rationale: חֵמָה denota furor, cólera ou ardor. “Furor” mantém o tom elevado e distingue o termo de אַף, traduzido por “ira”.
- source_word: וְאוֹרִיד
  choice: fiz ... descer
  rationale: O hifil de ירד significa literalmente “fazer descer”. Esta escolha preserva de perto a direção expressa pelo verbo hebraico.
- source_word: לָאָרֶץ
  choice: até a terra
  rationale: A preposição ל marca o destino ou direção. “Até a terra” comunica o movimento descendente sem transformar explicitamente o verbo em “derramar”.
- source_word: נִצְחָם
  choice: o sangue vital deles
  rationale: O termo é raro e discutido. No contexto do lagar e do juízo, “sangue vital” preserva a sobreposição entre o líquido das uvas esmagadas e o sangue dos povos, enquanto a nota registra a incerteza lexical.
theological_decisions:
- issue: Como verter a violenta imagem de juízo associada ao lagar sem suavizá-la nem tornar explícita uma interpretação incerta
  choice: Manter as ações de pisar, embriagar e fazer o sangue vital descer à terra.
  alternative: Traduzir o último termo por “seiva”, “sangue”, “vigor” ou “esplendor”.
  rationale: O hebraico reúne imagens de pisoteio, embriaguez e líquido que desce à terra. A tradução mantém a severidade do juízo e a tensão metafórica entre suco e sangue, sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural no registro escrito. “Ira” e “furor” preservam a distinção dos dois termos hebraicos e o tom poético-profético.
