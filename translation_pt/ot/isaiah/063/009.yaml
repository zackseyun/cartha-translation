  text: בְּֽ/כָל צָרָתָ֣/ם לא צָ֗ר וּ/מַלְאַ֤ךְ פָּנָי/ו֙ הֽוֹשִׁיעָ֔/ם בְּ/אַהֲבָת֥/וֹ וּ/בְ/חֶמְלָת֖/וֹ ה֣וּא גְאָלָ֑/ם וַֽ/יְנַטְּלֵ֥/ם וַֽ/יְנַשְּׂאֵ֖/ם כָּל יְמֵ֥י עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/009.yaml
  text: In all their distress[a], he was distressed, and the angel of his presence saved them; in his love and in his compassion he redeemed them, and he lifted them up and carried them all the days of old.
translation:
  language: pt
  text: Em toda a aflição deles, ele não estava aflito[a], e o anjo de sua presença os salvou; em seu amor e em sua compaixão, ele os redimiu; levantou-os e os carregou todos os dias de outrora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Conforme uma antiga leitura alternativa: “Em toda a aflição deles, ele estava aflito”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל צָרָתָם
  choice: Em toda a aflição deles
  rationale: Preserva o alcance abrangente de בְּכָל e traduz צָרָה por um termo natural e digno, adequado tanto ao sofrimento quanto à adversidade.
- source_word: לֹא צָר
  choice: ele não ficou aflito
  rationale: Segue o texto massorético vocalizado, no qual לֹא significa “não”, sem substituí-lo silenciosamente pela antiga leitura alternativa לוֹ; “ficou aflito” expressa o valor predicativo de צָר no contexto.
- source_word: וּמַלְאַךְ פָּנָיו
  choice: e o anjo da sua presença
  rationale: “Anjo” é a acepção estabelecida de מַלְאָךְ neste contexto de livramento, e “presença” comunica idiomaticamente o hebraico literal “face”.
- source_word: הוֹשִׁיעָם
  choice: os salvou
  rationale: O hifil de יָשַׁע indica salvar ou livrar; “salvou” é claro e conserva a força teológica do verbo.
- source_word: בְּאַהֲבָתוֹ וּבְחֶמְלָתוֹ
  choice: Em seu amor e em sua compaixão
  rationale: Mantém o paralelismo e a preposição hebraica, permitindo que ela expresse tanto a esfera quanto a motivação da ação divina.
- source_word: הוּא גְאָלָם
  choice: ele os resgatou
  rationale: גָּאַל descreve a ação de um redentor que recupera ou liberta. “Resgatou” é corrente em português e conserva a ideia de redenção sem exigir linguagem técnica.
- source_word: וַיְנַטְּלֵם וַיְנַשְּׂאֵם
  choice: levantou-os e os carregou
  rationale: 'Distingue os dois verbos sucessivos: primeiro levantar ou tomar nos braços, depois carregar ou sustentar.'
- source_word: כָּל יְמֵי עוֹלָם
  choice: durante todos os dias do passado
  rationale: No contexto retrospectivo, עוֹלָם aponta para tempos remotos, não necessariamente para eternidade futura. A formulação é clara e preserva a referência histórica.
theological_decisions:
- issue: Leitura de לֹא צָר na primeira oração
  choice: 'Seguir o texto massorético: “ele não ficou aflito”.'
  alternative: “Em toda a aflição deles, ele ficou aflito”, conforme a antiga leitura alternativa que entende לוֹ em vez de לֹא.
  rationale: O texto hebraico fornecido traz לֹא, “não”. Como a leitura alternativa é antiga, difundida e teologicamente significativa, ela é registrada em nota, mas não substitui silenciosamente o texto massorético.
- issue: Identidade do “anjo da sua presença”
  choice: Manter a expressão sem identificar explicitamente o anjo com Deus, com o Messias ou com outra figura.
  alternative: Explicitar uma identificação teológica específica.
  rationale: O versículo atribui salvação ao anjo da presença divina, mas não define aqui sua identidade com precisão; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide as ações sem desfazer o paralelismo poético. O marcador [a] aparece imediatamente após a oração afetada pela variante textual.
