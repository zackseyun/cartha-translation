  text: הַבֵּ֤ט מִ/שָּׁמַ֨יִם֙ וּ/רְאֵ֔ה מִ/זְּבֻ֥ל קָדְשְׁ/ךָ֖ וְ/תִפְאַרְתֶּ֑/ךָ אַיֵּ֤ה קִנְאָֽתְ/ךָ֙ וּ/גְב֣וּרֹתֶ֔/ךָ הֲמ֥וֹן מֵעֶ֛י/ךָ וְֽ/רַחֲמֶ֖י/ךָ אֵלַ֥/י הִתְאַפָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/015.yaml
  text: Look down from heaven and see[a], from your holy and glorious dwelling[c][b]. Where are your zeal and your mighty deeds? The stirring of your inward parts and your compassions are withheld from me.
translation:
  language: pt
  text: Olha lá dos céus e vê, da tua santa e gloriosa morada. Onde estão o teu zelo[a] e os teus feitos poderosos? A comoção das tuas entranhas[b] e as tuas compaixões se refreiam em relação a mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu ciúme”. Aqui a palavra indica ardor zeloso.'
    reason: lexical_alternative
  - marker: b
    text: Expressão corporal para profunda emoção interior ou compaixão.
    reason: cultural_note
  - marker: c
    text: 'Ou: “se retêm em relação a mim” ou “são contidas em relação a mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט מִשָּׁמַיִם וּרְאֵה
  choice: Olha dos céus e vê
  rationale: Mantém os dois imperativos e deixa que a expressão “dos céus” comunique naturalmente a perspectiva de olhar para baixo.
- source_word: מִזְּבֻל קָדְשְׁךָ וְתִפְאַרְתֶּךָ
  choice: da tua santa e gloriosa morada
  rationale: זְבֻל designa uma morada elevada; a formulação adjetival é clara em português e preserva as ideias de santidade e glória.
- source_word: קִנְאָתְךָ
  choice: o teu zelo
  rationale: Neste apelo à intervenção divina, קִנְאָה expressa ardor zeloso; “zelo” evita as conotações estreitas que “ciúme” pode ter no português atual.
- source_word: גְבוּרוֹתֶיךָ
  choice: os teus feitos poderosos
  rationale: O plural aponta para manifestações concretas de poder, não apenas para força abstrata.
- source_word: הֲמוֹן מֵעֶיךָ
  choice: A comoção das tuas entranhas
  rationale: Preserva tanto a ideia de agitação interior em הֲמוֹן quanto a metáfora corporal de מֵעִים, usada para emoções profundas.
- source_word: רַחֲמֶיךָ
  choice: as tuas compaixões
  rationale: Conserva o plural hebraico e sua noção de manifestações abundantes de misericórdia e ternura.
- source_word: אֵלַי הִתְאַפָּקוּ
  choice: se contêm para comigo
  rationale: O reflexivo “se contêm” representa o hitpael, isto é, conter-se ou reter-se; “para comigo” mantém a orientação expressa por אֵלַי.
theological_decisions:
- issue: Linguagem antropopática sobre as emoções de Deus
  choice: Manter a imagem corporal em “comoção das tuas entranhas”.
  alternative: comoção do teu íntimo; ternura do teu coração
  rationale: A imagem hebraica atribui a Deus, em linguagem humana e corporal, profunda emoção compassiva. Preservá-la mantém a força poética sem afirmar corporeidade divina.
- issue: Sentido de קִנְאָה aplicado a Deus
  choice: Traduzir por “zelo” no texto principal.
  alternative: ciúme
  rationale: O contexto pede o ardor de Deus em favor de seu povo e sua disposição de agir. “Zelo” comunica esse sentido sem eliminar a alternativa lexical.
- issue: Aparente retração da compaixão divina
  choice: Usar a forma reflexiva “se contêm”.
  alternative: são retidas; são contidas
  rationale: A forma hebraica apresenta o zelo emotivo e as compaixões como refreando-se. A tradução preserva a linguagem de lamento e não explica teologicamente por que Deus parece não agir.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe poética e a metáfora das “entranhas” foram preservadas, enquanto construções excessivamente arcaicas foram evitadas.
