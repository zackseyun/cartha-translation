revisions:
- from: Olha dos céus e vê, da tua santa e gloriosa morada. Onde estão o teu zelo[a] e os teus feitos poderosos? A comoção das tuas entranhas[b] e as tuas compaixões se contêm para comigo[c].
  to: Olha lá dos céus e vê, da tua santa e gloriosa morada. Onde estão o teu zelo[a] e os teus feitos poderosos? A comoção das tuas entranhas[b] e as tuas compaixões se refreiam em relação a mim[c].
  rationale: A revisão melhora a legibilidade contemporânea sem alterar o sentido. «Lá dos céus» explicita a direção implícita no apelo. «Se refreiam em relação a mim» reproduz de modo mais idiomático a ideia de autocontenção do hitpael, mantendo o caráter de lamento e a ambiguidade sobre o motivo dessa aparente retenção.
