  text: לַ/מִּצְעָ֕ר יָרְשׁ֖וּ עַם קָדְשֶׁ֑/ךָ צָרֵ֕י/נוּ בּוֹסְס֖וּ מִקְדָּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/018.yaml
  text: Your holy people possessed it for a little while[b][a]; our adversaries have trampled your sanctuary.
translation:
  language: pt
  text: Por pouco tempo[b], o teu povo santo tomou posse dela[a]; os nossos adversários pisotearam o teu santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não declara o objeto de «tomou posse». Pelo contexto, «dela» provavelmente se refere à terra ou à herança, não necessariamente ao próprio santuário.
    reason: alternative_reading
  - marker: b
    text: 'Ou: «em pequena medida» ou «por breve tempo». A expressão hebraica pode indicar pouca duração ou pequena extensão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמִּצְעָר
  choice: Por pouco tempo
  rationale: מִצְעָר indica pequenez e, com a preposição ל, funciona aqui naturalmente como expressão adverbial de duração breve; a formulação também mantém aberta, em nota, a possibilidade de pequena medida ou extensão.
- source_word: יָרְשׁוּ
  choice: tomou posse dela
  rationale: ירשׁ pode significar herdar, possuir ou tomar posse. O objeto está implícito no hebraico; em português, o pronome o explicita gramaticalmente sem identificá-lo com o santuário.
- source_word: עַם קָדְשֶׁךָ
  choice: o teu povo santo
  rationale: A construção significa literalmente 'o povo da tua santidade'; 'o teu povo santo' comunica com naturalidade tanto a pertença a Deus quanto a condição consagrada.
- source_word: צָרֵינוּ
  choice: os nossos adversários
  rationale: צָר designa quem se mostra hostil, um adversário ou inimigo. 'Adversários' preserva o tom elevado da lamentação sem ampliar o sentido.
- source_word: בּוֹסְסוּ
  choice: pisotearam
  rationale: O verbo בוסס descreve o ato de calcar ou pisar de modo aviltante. 'Pisotearam' é corrente e conserva a força de profanação.
- source_word: מִקְדָּשֶׁךָ
  choice: o teu santuário
  rationale: מִקְדָּשׁ é um lugar santo ou santuário. A escolha preserva a linguagem de espaço sagrado sem substituir o termo pelo arquitetonicamente mais específico 'templo'.
theological_decisions:
- issue: Objeto implícito de יָרְשׁוּ
  choice: Empregar 'dela', remetendo contextualmente à terra ou herança, sem nomeá-la no corpo do versículo.
  alternative: Deixar o verbo sem objeto ou identificar 'o teu santuário' como seu objeto.
  rationale: O hebraico não expressa o objeto. O português normalmente o requer nessa construção, mas o santuário aparece como objeto distinto na oração seguinte. O pronome feminino acompanha a referência contextual provável à terra ou herança e a nota preserva a elipse do original.
- issue: Sentido de לַמִּצְעָר
  choice: 'Entender temporalmente: ''Por pouco tempo''.'
  alternative: 'Entender quantitativamente: ''em pequena medida'' ou ''em pequena extensão''.'
  rationale: A leitura temporal forma uma lamentação coerente sobre a posse breve da herança antes da profanação do santuário; a amplitude lexical é preservada em nota, sem transformar a interpretação contextual em certeza absoluta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes ('teu') e vocabulário de lamentação bíblica sem arcaísmo excessivo. A ordem inicial 'Por pouco tempo' reproduz a ênfase do hebraico. Os marcadores aparecem após a oração a que ambas as notas se referem.
