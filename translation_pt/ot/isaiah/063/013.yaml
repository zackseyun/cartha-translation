base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/013.yaml
  text: leading them through the depths like a horse in the wilderness[a]; they did not stumble.
translation:
  language: pt
  text: conduzindo-os através das profundezas[a], como um cavalo no deserto; eles não tropeçaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “através das águas profundas”. O hebraico diz “através das profundezas”, em alusão à travessia do êxodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיכָם
  choice: conduzindo-os
  rationale: O particípio hifil de הלך, com sufixo de terceira pessoa do plural, prossegue a descrição da orientação passada do povo e conserva o fluxo participial do contexto.
- source_word: בַּתְּהֹמוֹת
  choice: através das profundezas
  rationale: O plural de תְּהוֹם denota profundezas, frequentemente aquáticas. A preposição e o contexto do êxodo favorecem a ideia de movimento através delas, sem inserir explicitamente “mar” no texto.
- source_word: כַּסּוּס
  choice: como um cavalo
  rationale: A construção comparativa com o substantivo singular é expressa naturalmente em português pelo singular indefinido.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר pode designar deserto ou região erma. “Deserto” é corrente, claro e mantém a ressonância do êxodo.
- source_word: לֹא יִכָּשֵׁלוּ
  choice: eles não tropeçaram
  rationale: O nifal de כשל significa tropeçar, cambalear ou vacilar. A oração independente reproduz mais diretamente a sintaxe hebraica, sem tornar explícita uma relação de resultado apenas implícita.
theological_decisions:
- issue: Imagem da travessia do êxodo
  choice: Manter “as profundezas” no texto e explicar em nota sua provável referência às águas profundas.
  alternative: Traduzir “através do mar” ou “através das águas profundas”.
  rationale: O contexto evoca claramente a travessia do êxodo, mas תְּהֹמוֹת é mais amplo que “mar”. A tradução preserva a imagem e a ambiguidade lexical sem apagar a alusão contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação mantém a sequência imagética e apresenta a oração final de modo direto, conforme o hebraico.
