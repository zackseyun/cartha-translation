id: ISA.63.5
reference: Isaiah 63:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַבִּיט֙ וְ/אֵ֣ין עֹזֵ֔ר וְ/אֶשְׁתּוֹמֵ֖ם וְ/אֵ֣ין סוֹמֵ֑ךְ וַ/תּ֤וֹשַֽׁע לִ/י֙ זְרֹעִ֔/י וַ/חֲמָתִ֖/י הִ֥יא סְמָכָֽתְ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/063/005.yaml
  text: I looked[a], but there was no one to help; I was appalled, but there was no one to support. So my own arm brought me salvation[b], and my wrath—it upheld me.
translation:
  language: pt
  text: Olhei, mas não havia ninguém que ajudasse; fiquei estarrecido[a], mas não havia ninguém que desse apoio. Então meu próprio braço me trouxe salvação[b], e minha ira — ela me sustentou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquei espantado”. O verbo hebraico pode indicar espanto atônito, consternação ou desolação.
    reason: lexical_alternative
  - marker: b
    text: Ou “me deu a vitória”. O verbo hebraico vem da raiz frequentemente traduzida por “salvar” ou “livrar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַבִּיט
  choice: Olhei
  rationale: O hifil de נבט indica olhar de modo atento ou dirigido. “Olhei” é natural e preserva a concisão do hebraico.
- source_word: עֹזֵר
  choice: ninguém que ajudasse
  rationale: O particípio de עזר designa quem ajuda; a oração com subjuntivo é idiomática em português depois de “não havia ninguém”.
- source_word: וְאֶשְׁתּוֹמֵם
  choice: fiquei estarrecido
  rationale: A forma reflexiva de שמם pode exprimir espanto atônito, consternação ou desolação. “Fiquei estarrecido” comunica a intensidade sem especificar indevidamente sua causa.
- source_word: סוֹמֵךְ
  choice: ninguém que desse apoio
  rationale: O particípio de סמך significa apoiar ou sustentar. “Desse apoio” mantém o paralelismo com “ajudasse” e permite que a forma finita posterior seja traduzida por “sustentou”.
- source_word: וַתּוֹשַׁע לִי זְרֹעִי
  choice: meu próprio braço me trouxe salvação
  rationale: O verbo de ישׁע com לִי apresenta o braço do próprio falante como agente de sua libertação ou vitória. “Próprio” explicita a ênfase contextual da ausência de qualquer ajudador.
- source_word: חֲמָתִי
  choice: minha ira
  rationale: חֵמָה denota ira ardente ou furor; “ira” é corrente, digna e adequada ao contexto profético de juízo.
- source_word: הִיא סְמָכָתְנִי
  choice: ela me sustentou
  rationale: O pronome feminino retoma חֲמָתִי. Em português, “ela” preserva essa retomada enfática, e “sustentou” traduz naturalmente a forma finita de סמך.
theological_decisions:
- issue: Autolivramento divino em linguagem antropomórfica
  choice: Então meu próprio braço me trouxe salvação
  alternative: Então meu braço conquistou a vitória para mim
  rationale: A formulação conserva a imagem do poder do próprio falante agindo sem auxílio e mantém a ligação lexical com a ideia de salvar, sem restringi-la apenas a vitória militar.
- issue: A ira como aquilo que sustenta o agente do juízo
  choice: e minha ira — ela me sustentou
  alternative: e meu furor me deu apoio
  rationale: A tradução conserva a tensão do texto, no qual a ira do falante o sustenta na execução do juízo, sem suavizar nem explicar teologicamente a imagem.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O travessão e o pronome “ela” reproduzem a retomada enfática do hebraico. Os dois marcadores de nota aparecem no texto principal.
