  source_fidelity: 'A tradução preserva adequadamente os termos centrais: «coração», a reflexão/meditação sobre o terror, o escriba e as torres. Contudo, os dois últimos particípios hebraicos nas perguntas («o que pesa» e «o que conta») são mais bem mantidos em português pelo presente, acompanhando o «Onde está?» repetido. Os imperfeitos «pesava» e «contava» introduzem uma retrospectiva verbal que não está expressa na forma hebraica.'
