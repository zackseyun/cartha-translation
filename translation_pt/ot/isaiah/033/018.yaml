base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/018.yaml
  text: 'Your heart will meditate on terror: “Where is the scribe? Where is the one who weighs? Where is the one who counts the towers?”[a][b]'
translation:
  language: pt
  text: 'Seu coração refletirá sobre o terror: “Onde está o escriba? Onde está aquele que pesa? Onde está aquele que conta as torres?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meditará sobre o terror” ou “murmurará a respeito do terror”. O verbo hebraico pode indicar reflexão interior ou fala em voz baixa.
    reason: lexical_alternative
  - marker: b
    text: “O escriba... aquele que pesa... aquele que conta as torres” provavelmente se refere a oficiais estrangeiros envolvidos em avaliações, tributos ou cálculos de cerco.
    reason: cultural_note
lexical_decisions:
- source_word: לִבְּךָ
  choice: seu coração
  rationale: Preserva o termo antropológico hebraico para a pessoa interior, inclusive sua atividade de pensar e recordar.
- source_word: יֶהְגֶּה
  choice: refletirá sobre
  rationale: O verbo pode indicar meditação interior ou fala em voz baixa; no contexto, a reflexão retrospectiva sobre o terror é a leitura mais natural, sem excluir totalmente a amplitude lexical.
- source_word: אֵימָה
  choice: o terror
  rationale: Comunica a intensidade de pavor ou medo profundo expressa pelo substantivo hebraico.
- source_word: אַיֵּה
  choice: Onde está
  rationale: Mantém a repetição enfática e a referência singular de cada pergunta retórica.
- source_word: סֹפֵר
  choice: o escriba
  rationale: Designa de modo plausível um oficial encarregado de escrever, registrar ou contar, sem determinar além do que o contexto permite.
- source_word: שֹׁקֵל
  choice: aquele que pesava
  rationale: Traduz transparentemente o particípio de שקל e sugere sua possível função de pesar tributo sem inseri-la no texto.
- source_word: סֹפֵר אֶת הַמִּגְדָּלִים
  choice: aquele que contava as torres
  rationale: Neste complemento concreto, ספר tem naturalmente o sentido de contar; o imperfeito português harmoniza a recordação de agentes do terror passado.
- source_word: הַמִּגְדָּלִים
  choice: as torres
  rationale: Preserva a imagem concreta, sem ampliá-la interpretativamente para fortificações ou torres de vigia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural. “Refletirá” evita a possível conotação devocional exclusiva de “meditará”, enquanto as notas preservam a ambiguidade do verbo. O pretérito imperfeito nas perguntas apresenta as funções como lembradas após a ameaça, conforme o contexto imediato.
