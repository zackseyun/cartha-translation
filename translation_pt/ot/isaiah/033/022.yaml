source:
  edition: WLC
  text: כִּ֤י יְהוָה֙ שֹׁפְטֵ֔/נוּ יְהוָ֖ה מְחֹקְקֵ֑/נוּ יְהוָ֥ה מַלְכֵּ֖/נוּ ה֥וּא יוֹשִׁיעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/022.yaml
  text: For Yahweh is our judge[a]; Yahweh is our lawgiver; Yahweh is our king[b]; he will save us.
translation:
  language: pt
  text: Pois Yahweh é o nosso juiz; Yahweh é o nosso legislador[a]; Yahweh é o nosso rei; ele nos salvará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que nos dá leis”; o termo hebraico também pode, em certos contextos, designar um governante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do contexto anterior, preservando de modo natural a força conectiva do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, em vez de substituí-lo por um título.
- source_word: שֹׁפְטֵנוּ
  choice: o nosso juiz
  rationale: Preserva de forma concisa o título judicial expresso pela forma nominal/participial hebraica.
- source_word: מְחֹקְקֵנוּ
  choice: o nosso legislador
  rationale: 'Expressa a ideia de quem decreta ou estabelece leis e mantém a sequência de funções públicas: juiz, legislador e rei.'
- source_word: מַלְכֵּנוּ
  choice: o nosso rei
  rationale: Mantém diretamente a imagem monárquica do substantivo hebraico.
- source_word: הוּא
  choice: ele
  rationale: Conserva o pronome explícito e sua ênfase na afirmação culminante.
- source_word: יוֹשִׁיעֵנוּ
  choice: nos salvará
  rationale: Traduz diretamente o hifil imperfeito de ישׁע, preservando tanto o sentido futuro quanto a linguagem de salvação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Nuance de מְחֹקְקֵנוּ
  choice: o nosso legislador
  alternative: aquele que nos dá leis; o nosso governante
  rationale: “Legislador” preserva a função jurídico-governamental e distingue o termo tanto de “juiz” quanto de “rei”, sem eliminar sua possível nuance de governante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Yahweh” e a estrutura tríplice do hebraico foram mantidas; a ordem final “ele nos salvará” conserva o clímax do versículo.
