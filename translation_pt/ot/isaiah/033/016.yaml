id: ISA.33.16
reference: Isaiah 33:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֚וּא מְרוֹמִ֣ים יִשְׁכֹּ֔ן מְצָד֥וֹת סְלָעִ֖ים מִשְׂגַּבּ֑/וֹ לַחְמ֣/וֹ נִתָּ֔ן מֵימָ֖י/ו נֶאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/016.yaml
  text: He will dwell on the heights[a]; rocky fortresses will be his refuge; his bread will be given[b], his water will be sure.
translation:
  language: pt
  text: Ele habitará nas alturas; fortalezas rochosas serão o seu refúgio.[a] Seu pão lhe será dado, e sua água estará garantida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão a sua fortaleza”; o termo hebraico indica um lugar elevado, seguro e protegido.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua água não faltará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרוֹמִים
  choice: nas alturas
  rationale: Preserva a imagem espacial de lugares elevados, associada à segurança, em português natural.
- source_word: יִשְׁכֹּן
  choice: habitará
  rationale: Expressa a permanência indicada pelo qal imperfeito e mantém o tom digno da promessa.
- source_word: מְצָדוֹת סְלָעִים
  choice: fortalezas rochosas
  rationale: Reproduz naturalmente a expressão construta, literalmente 'fortalezas de rochas', e sua imagem de posições inacessíveis e defensáveis.
- source_word: מִשְׂגַּבּוֹ
  choice: o seu refúgio
  rationale: Comunica a função protetora de um lugar alto e seguro sem repetir desnecessariamente 'fortaleza'.
- source_word: לַחְמוֹ
  choice: seu pão
  rationale: Mantém o termo concreto hebraico e sua função metonímica de provisão.
- source_word: נִתָּן
  choice: lhe será dado
  rationale: O particípio passivo predicativo é apresentado como promessa futura, em harmonia com o contexto.
- source_word: מֵימָיו
  choice: sua água
  rationale: Embora formalmente plural, מַיִם corresponde naturalmente ao nome massivo singular 'água' em português.
- source_word: נֶאֱמָנִים
  choice: estará garantida
  rationale: Expressa uma provisão firme, segura e confiável; a nota conserva a alternativa mais concreta, 'não faltará'.
- source_word: הוּא
  choice: Ele
  rationale: Retoma no masculino singular o homem justo descrito no versículo anterior, sem acrescentar uma identificação messiânica ou divina.
theological_decisions:
- issue: Referente do pronome masculino singular
  choice: O homem justo descrito no contexto anterior
  alternative: Uma declaração generalizada sobre a pessoa justa ou uma aplicação tipológica ao remanescente fiel
  rationale: Isaías 33:15 descreve aquele que anda em justiça, e o versículo 16 anuncia as bênçãos destinadas a ele. O masculino singular é preservado sem especificar um referente teológico que o texto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo poético e as imagens concretas de altura, proteção, pão e água.
