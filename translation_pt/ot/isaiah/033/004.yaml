lexical_decisions:
- source_word: וְאֻסַּף
  choice: E ... será recolhido
  rationale: O passivo de אסף, no contexto profético, é expresso naturalmente pelo futuro em português; a conjunção é mantida como “E”.
- source_word: שְׁלַלְכֶם
  choice: o seu despojo
  rationale: שׁלל designa despojo ou saque de guerra. “Despojo” conserva o sentido militar e o sufixo de segunda pessoa do plural é vertido pelo possessivo amplamente compreensível “seu”.
- source_word: אֹסֶף הֶחָסִיל
  choice: como os gafanhotos recolhem tudo
  rationale: A construção cognata com אסף descreve a coleta efetuada pelo חָסִיל. Uma reprodução nominal rígida seria pouco natural em português; a forma verbal mantém a imagem de recolhimento completo associada aos gafanhotos.
- source_word: הֶחָסִיל
  choice: os gafanhotos
  rationale: חָסִיל pode indicar uma espécie ou fase do gafanhoto, com ênfase em sua ação devoradora. “Gafanhotos” é claro no contexto profético, enquanto a especificidade lexical é preservada em nota.
- source_word: כְּמַשַּׁק
  choice: como ... avançam impetuosamente
  rationale: O substantivo raro parece denotar ímpeto, investida ou movimento rápido. A locução adverbial comunica esse avanço súbito sem fixar indevidamente um sentido exclusivamente militar.
- source_word: גֵּבִים
  choice: enxames
  rationale: O termo raro e incerto provavelmente se refere a massas de criaturas que se movem em conjunto; “enxames” se ajusta ao paralelismo com os gafanhotos sem ocultar a dificuldade, registrada em nota.
- source_word: שׁוֹקֵק
  choice: assim avançam
  rationale: O particípio retrata movimento intenso e repetido. “Avançam” preserva o sujeito não especificado, sem introduzir “homens” ou outro referente ausente do hebraico.
- source_word: בּוֹ
  choice: sobre ele
  rationale: A preposição com sufixo retoma naturalmente o despojo e descreve o movimento dirigido sobre ele.
