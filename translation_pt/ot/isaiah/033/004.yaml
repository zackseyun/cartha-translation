translation:
  language: pt
  text: E o seu despojo será recolhido, tal como os gafanhotos o recolhem[a]; como o ímpeto de enxames, avançam sobre ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como o ajuntamento do gafanhoto devorador”. O termo hebraico חָסִיל pode designar uma espécie ou fase específica do gafanhoto.'
