  text: מֶ֥לֶךְ בְּ/יָפְי֖/וֹ תֶּחֱזֶ֣ינָה עֵינֶ֑י/ךָ תִּרְאֶ֖ינָה אֶ֥רֶץ מַרְחַקִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/017.yaml
  text: Your eyes will behold the king in his beauty[a]; they will see a far-reaching land.
translation:
  language: pt
  text: Seus olhos contemplarão o rei em sua beleza; verão uma terra que se estende ao longe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma terra distante”; mais literalmente, “uma terra de grandes distâncias”.
    reason: A expressão hebraica אֶרֶץ מַרְחַקִּים admite tanto a ideia de uma terra extensa quanto a de uma terra remota.
lexical_decisions:
- source_word: מֶלֶךְ
  choice: o rei
  rationale: O substantivo significa “rei”. Embora não tenha artigo em hebraico, o contexto permite sentido definido; a tradução não identifica qual rei está em vista.
- source_word: בְּיָפְיוֹ
  choice: em sua beleza
  rationale: Preserva de modo natural a construção hebraica e mantém aberta a possibilidade de beleza, esplendor régio ou dignidade restaurada.
- source_word: תֶּחֱזֶינָה
  choice: contemplarão
  rationale: חזה pode indicar visão atenta, mais expressiva que um simples “ver”; “contemplarão” comunica essa nuance sem excessiva solenidade.
- source_word: עֵינֶיךָ
  choice: seus olhos
  rationale: Mantém a imagem explícita do hebraico e fornece o sujeito dos verbos no plural.
- source_word: תִּרְאֶינָה
  choice: verão
  rationale: Concorda naturalmente com “seus olhos” em português e conserva o paralelismo entre as duas orações.
- source_word: אֶרֶץ
  choice: uma terra
  rationale: “Terra” preserva a amplitude semântica do termo, e o artigo indefinido é natural neste contexto.
- source_word: מַרְחַקִּים
  choice: que se estende ao longe
  rationale: O plural derivado da ideia de distância pode denotar regiões ou extensões longínquas. A formulação comunica essa amplitude em português corrente, enquanto a nota registra alternativas mais literais.
theological_decisions:
- issue: Identidade de “o rei”
  choice: Manter apenas “o rei”, sem identificar o referente.
  alternative: Identificá-lo como Ezequias, o SENHOR ou um rei messiânico/escatológico.
  rationale: O versículo não identifica explicitamente o rei; manter o referente em aberto preserva a tensão interpretativa do texto.
- issue: Sentido da terra vista
  choice: Descrever uma terra que se estende ao longe.
  alternative: Entender a expressão somente como uma terra remota ou distante.
  rationale: A construção hebraica admite tanto a ideia de vastidão quanto a de distância. O texto principal expressa extensão, e a nota preserva a leitura locativa alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Contemplarão” conserva o tom poético sem arcaísmo excessivo; “que se estende ao longe” torna idiomática a expressão hebraica compacta.
