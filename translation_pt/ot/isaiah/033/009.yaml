  text: אָבַ֤ל אֻמְלְלָה֙ אָ֔רֶץ הֶחְפִּ֥יר לְבָנ֖וֹן קָמַ֑ל הָיָ֤ה הַ/שָּׁרוֹן֙ כָּֽ/עֲרָבָ֔ה וְ/נֹעֵ֥ר בָּשָׁ֖ן וְ/כַרְמֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/009.yaml
  text: The land mourns and withers[a]; Lebanon is ashamed and withers away. Sharon has become like the Arabah[b], and Bashan and Carmel shake off their leaves.
translation:
  language: pt
  text: A terra está de luto e definha; o Líbano está envergonhado e murcha. Sarom tornou-se como a Arabá[a], e Basã e Carmelo sacodem de si a folhagem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como a planície desértica” ou “como o deserto”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Basã e Carmelo sacodem”; no contexto, a imagem provavelmente indica que perdem sua folhagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל
  choice: está de luto
  rationale: Preserva a personificação poética da terra e o sentido comum do verbo de prantear, sem reduzir a imagem apenas à seca física.
- source_word: אֻמְלְלָה
  choice: definha
  rationale: Expressa perda de vigor e ressecamento, adequando-se à devastação da terra e distinguindo-se do verbo vegetal posterior.
- source_word: אֶרֶץ
  choice: a terra
  rationale: No contexto, designa o território devastado, não necessariamente o planeta inteiro; a formulação portuguesa mantém a amplitude possível do termo.
- source_word: הֶחְפִּיר
  choice: está envergonhado
  rationale: Mantém a personificação do Líbano e o sentido de vergonha ou humilhação do verbo.
- source_word: לְבָנוֹן
  choice: Líbano
  rationale: Forma portuguesa convencional do topônimo.
- source_word: קָמַל
  choice: murcha
  rationale: Verbo natural para vegetação que perde viço, preservando a imagem física e poética.
- source_word: הַשָּׁרוֹן
  choice: Sarom
  rationale: Forma bíblica portuguesa amplamente reconhecível para o nome regional.
- source_word: כָּעֲרָבָה
  choice: como a Arabá
  rationale: Preserva a possível referência geográfica específica, sem apagar a conotação de planície árida; a nota oferece o sentido descritivo alternativo.
- source_word: נֹעֵר
  choice: sacodem sua folhagem
  rationale: Mantém a imagem verbal literal de sacudir, explicitando pelo contexto aquilo que é sacudido sem transformar silenciosamente a expressão em simples desnudamento.
- source_word: בָּשָׁן
  choice: Basã
  rationale: Forma portuguesa tradicional e corrente do topônimo.
- source_word: כַרְמֶל
  choice: Carmelo
  rationale: Forma portuguesa convencional do topônimo; não se acrescenta 'monte', pois isso não está explícito no hebraico.
