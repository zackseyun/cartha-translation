source:
  edition: WLC
  text: יְהוָ֥ה חָנֵּ֖/נוּ לְ/ךָ֣ קִוִּ֑ינוּ הֱיֵ֤ה זְרֹעָ/ם֙ לַ/בְּקָרִ֔ים אַף יְשׁוּעָתֵ֖/נוּ בְּ/עֵ֥ת צָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/002.yaml
  text: O Yahweh[a], be gracious to us; we wait for you. Be our arm every morning, also our salvation in the time of distress.
translation:
  language: pt
  text: Ó Yahweh, concede-nos tua graça; esperamos por ti. Sê o braço deles[a] a cada manhã e também a nossa salvação no tempo da angústia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente «o braço deles». Alguns entendem que a expressão se refere coletivamente ao povo que ora e traduzem «o nosso braço».
    reason: Explica a mudança de pronome no texto hebraico e registra a alternativa contextual sem adotá-la no texto principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Ó Yahweh
  rationale: Translitera o nome divino e acrescenta «Ó» para expressar a invocação direta da oração.
- source_word: חָנֵּנוּ
  choice: concede-nos tua graça
  rationale: Expressa o pedido de favor ou graça do verbo חנן sem reduzi-lo apenas à ideia de compaixão.
- source_word: לְךָ קִוִּינוּ
  choice: esperamos por ti
  rationale: Mantém a imagem de aguardar com esperança e confiança; o perfeito hebraico pode abranger a atitude já assumida pelos que oram.
- source_word: הֱיֵה
  choice: Sê
  rationale: O imperativo de היה introduz uma petição direta.
- source_word: זְרֹעָם
  choice: o braço deles
  rationale: Preserva tanto a metáfora concreta de braço como força protetora quanto o sufixo masculino plural de terceira pessoa do texto hebraico.
- source_word: לַבְּקָרִים
  choice: a cada manhã
  rationale: Transmite naturalmente o sentido distributivo e repetido do plural «manhãs».
- source_word: אַף
  choice: também
  rationale: Representa a força aditiva que liga a segunda petição à primeira.
- source_word: יְשׁוּעָתֵנוּ
  choice: a nossa salvação
  rationale: Conserva a amplitude de יְשׁוּעָה, que inclui livramento concreto e salvação.
- source_word: בְּעֵת צָרָה
  choice: no tempo da angústia
  rationale: Traduz a situação de aflição ou aperto com linguagem digna e corrente.
theological_decisions:
- issue: Pronome em זְרֹעָם
  choice: o braço deles
  alternative: o nosso braço
  rationale: O texto massorético traz claramente um sufixo de terceira pessoa plural, embora isso produza uma mudança de pessoa dentro da oração comunitária. A tradução principal preserva essa tensão; a alternativa contextualmente regularizada aparece em nota.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa singular coerentes com a oração direta. A metáfora «braço» e a mudança pronominal do hebraico foram preservadas, com esclarecimento em nota.
