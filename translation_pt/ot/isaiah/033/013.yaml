  text: שִׁמְע֥וּ רְחוֹקִ֖ים אֲשֶׁ֣ר עָשִׂ֑יתִי וּ/דְע֥וּ קְרוֹבִ֖ים גְּבֻרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/013.yaml
  text: Hear[a], you who are far away, what I have done; and know, you who are near[b], my might.
translation:
  language: pt
  text: Ouçam, vocês que estão longe, o que fiz; e saibam, vocês que estão perto, do meu poder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da minha força”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Ouçam
  rationale: Imperativo plural de שׁמע. “Ouçam” conserva a convocação direta e o tom profético, além de soar natural em português.
- source_word: רְחוֹקִים
  choice: vocês que estão longe
  rationale: Adjetivo plural empregado substantivamente e como vocativo. A formulação explicita os destinatários e mantém o contraste espacial com os que estão perto.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: o que fiz
  rationale: O relativo אֲשֶׁר com o perfeito na primeira pessoa singular indica uma ação realizada. “O que fiz” é direto, idiomático e não acrescenta uma nuance temporal ausente da forma hebraica.
- source_word: וּדְעוּ
  choice: e reconheçam
  rationale: Imperativo plural de ידע. Neste contexto, após a ordem para ouvir o feito divino, “reconheçam” comunica conhecimento consciente da manifestação de poder sem exigir uma explicação adicional.
- source_word: קְרוֹבִים
  choice: vocês que estão perto
  rationale: Adjetivo plural substantivado, em vocativo e paralelo a רְחוֹקִים. A tradução preserva a oposição retórica entre longe e perto.
- source_word: גְּבֻרָתִי
  choice: o meu poder
  rationale: גְּבוּרָה pode designar força, poder ou capacidade poderosa. “Poder” é natural e digno em português e mantém o substantivo abstrato sem transformá-lo interpretativamente em “feito poderoso”.
theological_decisions:
- issue: Identidade de quem fala nas formas de primeira pessoa
  choice: Manter apenas a primeira pessoa implícita no versículo, sem inserir o nome divino.
  alternative: Explicitar “o que eu, o SENHOR, fiz” ou “o poder do SENHOR”.
  rationale: O contexto identifica o locutor como o SENHOR, mas esta linha hebraica não repete o nome divino. A tradução preserva essa forma e evita acrescentar um sujeito explícito.
- issue: Sentido de וּדְעוּ no chamado aos que estão perto
  choice: “e reconheçam”
  alternative: “e saibam” ou “e conheçam”
  rationale: “Reconheçam” expressa adequadamente o chamado a perceber e admitir o poder demonstrado, mas a nota conserva os equivalentes mais formais porque ידע não exige por si só a ideia de confissão.
translation_notes:
  register: Português moderno, claro e solene, com imperativos plurais na terceira pessoa, adequados à legibilidade brasileira e amplamente compreensíveis. A estrutura paralela entre os que estão longe e os que estão perto foi preservada.
