  text: ה֣וֹי שׁוֹדֵ֗ד וְ/אַתָּה֙ לֹ֣א שָׁד֔וּד וּ/בוֹגֵ֖ד וְ/לֹא בָ֣גְדוּ ב֑/וֹ כַּ/הֲתִֽמְ/ךָ֤ שׁוֹדֵד֙ תּוּשַּׁ֔ד כַּ/נְּלֹתְ/ךָ֥ לִ/בְגֹּ֖ד יִבְגְּדוּ בָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/001.yaml
  text: Woe to you[a], destroyer, though you yourself have not been destroyed, and betrayer, though they have not betrayed you. When you finish destroying, you will be destroyed; when you cease betraying[c][b], they will betray you.
translation:
  language: pt
  text: Ai de você, devastador, que não foi devastado, e traidor, contra quem não agiram traiçoeiramente.[a] Quando você acabar de devastar, será devastado; quando terminar de agir traiçoeiramente,[c] agirão traiçoeiramente contra você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “e não agiram traiçoeiramente contra ele”. Pelo discurso direto e pelo paralelismo, também se pode entender: “e contra você não agiram traiçoeiramente”.'
    reason: alternative_reading
  - marker: b
    text: Também se pode traduzir a série ligada à raiz hebraica שׁדד por “saqueador ... saqueado”, pois ela pode destacar tanto a devastação violenta quanto o despojo.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “quando cessar de agir traiçoeiramente” ou “quando acabar de trair”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai de você
  rationale: Preserva a força de denúncia profética e introduz naturalmente a interpelação direta em português.
- source_word: שׁוֹדֵד / שָׁדוּד / תּוּשַּׁד
  choice: devastador / devastado / será devastado
  rationale: “Devastar” abrange a destruição violenta e o despojo, além de conservar a repetição e a inversão retórica do hebraico.
- source_word: בּוֹגֵד / בגד
  choice: traidor / agir traiçoeiramente
  rationale: A combinação é idiomática em português e mantém a relação lexical entre o agente e seus atos, sem restringir o sentido a uma única forma de traição.
- source_word: בָגְדוּ בוֹ
  choice: contra quem ainda não agiram traiçoeiramente
  rationale: Mantém no texto principal a terceira pessoa masculina singular do Texto Massorético e a vincula ao vocativo “traidor”, preservando a ambiguidade sintática sem emendar silenciosamente o pronome para a segunda pessoa.
- source_word: כַּהֲתִמְךָ
  choice: Quando você acabar
  rationale: Expressa de modo natural a conclusão temporal da atividade devastadora.
- source_word: כַּנְּלֹתְךָ לִבְגֹּד
  choice: quando terminar de agir traiçoeiramente
  rationale: O verbo pode indicar completar ou chegar ao fim; “terminar” preserva essa amplitude melhor que uma formulação que implique necessariamente abandono voluntário.
- source_word: יִבְגְּדוּ בָךְ
  choice: agirão traiçoeiramente contra você
  rationale: Conserva a repetição da raiz בגד e explicita corretamente o alvo da ação na segunda pessoa.
theological_decisions: []
