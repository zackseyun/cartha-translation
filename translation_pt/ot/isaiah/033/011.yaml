  text: תַּהֲר֥וּ חֲשַׁ֖שׁ תֵּ֣לְדוּ קַ֑שׁ רוּחֲ/כֶ֕ם אֵ֖שׁ תֹּאכַלְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/011.yaml
  text: You conceive chaff; you give birth to stubble[a]. Your breath is a fire that will consume you.
translation:
  language: pt
  text: Vocês concebem palha seca e dão à luz restolho. O sopro de vocês é um fogo que os consumirá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O espírito de vocês é um fogo que os consumirá”. O termo hebraico também pode significar “sopro”, “vento” ou “espírito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּהֲרוּ
  choice: vocês concebem
  rationale: Preserva diretamente a metáfora de gravidez do Qal imperfeito na segunda pessoa do plural e prepara o paralelo com “dão à luz”.
- source_word: חֲשַׁשׁ
  choice: palha seca
  rationale: Expressa material vegetal leve, seco e facilmente combustível; é claro em português e se distingue suficientemente de “restolho”.
- source_word: תֵּלְדוּ
  choice: dão à luz
  rationale: Mantém explícita e natural a metáfora do parto.
- source_word: קַשׁ
  choice: restolho
  rationale: Designa os resíduos secos deixados no campo e preserva a imagem de inutilidade e combustibilidade em paralelo com “palha seca”.
- source_word: רוּחֲכֶם
  choice: o sopro de vocês
  rationale: “Sopro” conserva a concretude de רוּחַ e permite a extensão figurada à força interior ou disposição dos destinatários, sem fixar prematuramente o sentido como “espírito”.
- source_word: אֵשׁ
  choice: um fogo
  rationale: Equivalente direto e idiomático, funcionando como predicativo na metáfora.
- source_word: תֹּאכַלְכֶם
  choice: os consumirá
  rationale: Com fogo como sujeito, “consumir” comunica naturalmente a ação destrutiva de אכל.
theological_decisions:
- issue: Sentido de רוּחֲכֶם na imagem profética de julgamento
  choice: o sopro de vocês
  alternative: o espírito de vocês; o vento de vocês
  rationale: A escolha preserva a imagem concreta de algo que procede dos próprios destinatários e se volta contra eles, sem eliminar a ambiguidade lexical; a nota registra a principal alternativa interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A construção mantém o paralelismo poético e a sequência concepção–parto–combustão. O marcador [a] foi colocado após a frase à qual se aplica.
