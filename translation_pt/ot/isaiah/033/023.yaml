  text: נִטְּשׁ֖וּ חֲבָלָ֑יִ/ךְ בַּל יְחַזְּק֤וּ כֵן תָּרְנָ/ם֙ בַּל פָּ֣רְשׂוּ נֵ֔ס אָ֣ז חֻלַּ֤ק עַֽד שָׁלָל֙ מַרְבֶּ֔ה פִּסְחִ֖ים בָּ֥זְזוּ בַֽז־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/023.yaml
  text: Your ropes hang loose[a]; they cannot hold firm the base of their mast; they cannot spread the sail. Then abundant plunder will be divided[b]; even the lame will carry off the spoil.
translation:
  language: pt
  text: Suas cordas estão frouxas; não conseguem firmar a base do mastro nem estender a vela.[a] Então será repartida grande quantidade de despojos; até os mancos levarão o saque.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem estender a bandeira (ou o estandarte)”. A palavra hebraica geralmente significa “bandeira”, “estandarte” ou “sinal”, mas “vela” se ajusta à imagem de um navio neste versículo.'
    reason: lexical_alternative
  - marker: b
    text: A imagem do navio incapacitado retrata a queda do adversário e a facilidade com que seus despojos serão tomados.
    reason: cultural_note
lexical_decisions:
- source_word: נִטְּשׁוּ חֲבָלָיִךְ
  choice: Suas cordas estão frouxas
  rationale: O perfeito passivo indica cordas soltas ou afrouxadas. A formulação preserva a imagem náutica e o sufixo feminino singular de segunda pessoa.
- source_word: בַּל יְחַזְּקוּ כֵן תָּרְנָם
  choice: não conseguem firmar a base do mastro
  rationale: בַּל expressa incapacidade enfática; כֵן é obscuro, mas provavelmente designa a base, o suporte ou encaixe do mastro. A tradução mantém essa incerteza sem especificar um mecanismo naval.
- source_word: בַּל פָּרְשׂוּ נֵס
  choice: nem estender a vela
  rationale: נֵס normalmente significa bandeira ou estandarte, mas aquilo que se estende junto ao mastro pode ser entendido como vela no contexto náutico. A alternativa lexical mais comum é registrada em nota.
- source_word: אָז חֻלַּק עַד שָׁלָל מַרְבֶּה
  choice: Então será repartida grande quantidade de despojos
  rationale: O passivo descreve a distribuição do saque; o futuro se ajusta à sequência profética. עַד é difícil no contexto, e a formulação comunica a abundância sem lhe atribuir uma função excessivamente precisa.
- source_word: פִּסְחִים
  choice: os que não podem andar
  rationale: Expressa de modo claro e digno pessoas com incapacidade para caminhar e ressalta que até elas poderão tomar parte no saque.
- source_word: בָּזְזוּ בַז
  choice: levarão o saque
  rationale: A construção cognata intensifica a ação de saquear. A formulação portuguesa é natural e conserva o sentido sem repetição artificial.
theological_decisions:
- issue: Identidade do navio ou destinatário feminino implícito
  choice: Manter a segunda pessoa sem identificar explicitamente o referente
  alternative: Acrescentar que o navio representa o inimigo ou a Assíria
  rationale: O versículo emprega a imagem de uma embarcação incapacitada, mas não nomeia aqui de modo inequívoco o referente. A tradução evita resolver no texto uma identificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora náutica foi preservada, assim como a mudança da segunda pessoa feminina singular nas cordas para o plural associado ao mastro no hebraico. Evitou-se linguagem capacitista no tratamento de פִּסְחִים.
