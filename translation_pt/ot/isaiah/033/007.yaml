base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/007.yaml
  text: Look[a], their heroes cry out outside[b]; the messengers of peace weep bitterly.
translation:
  language: pt
  text: 'Eis: os heróis deles[a] clamam lá fora; os mensageiros da paz[b] choram amargamente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico אֶרְאֶלָּם é incerto; pode significar “os seus valentes” ou “os seus heróis”, ou, de modo mais literal, algo como “os seus homens de Ariel” ou “os seus leões de Deus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os embaixadores da paz” ou “os enviados da paz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição dêitica que chama enfaticamente a atenção. “Vejam” é natural em português moderno e preserva essa força.
- source_word: אֶרְאֶלָּם
  choice: os heróis deles
  rationale: O termo é raro e de sentido incerto. No contexto de devastação e fracasso diplomático, provavelmente designa homens valentes ou campeões; a ambiguidade é registrada em nota.
- source_word: צָעֲקוּ
  choice: clamam
  rationale: O qal perfeito de צעק indica um grito de aflição. O presente dá vivacidade profética à cena.
- source_word: חֻצָה
  choice: lá fora
  rationale: O termo indica o exterior ou espaço aberto. “Lá fora” reflete o sentido sem acrescentar a especificidade de “nas ruas”.
- source_word: מַלְאֲכֵי שָׁלוֹם
  choice: os mensageiros da paz
  rationale: מַלְאָך pode significar mensageiro ou enviado. O contexto favorece emissários humanos envolvidos em negociações; “mensageiros da paz” mantém a expressão ampla e transparente.
- source_word: מַר
  choice: amargamente
  rationale: O adjetivo é empregado adverbialmente para caracterizar a intensidade dolorosa do choro.
- source_word: יִבְכָּיוּן
  choice: choram
  rationale: O imperfeito pode retratar uma ação presente de modo vívido ou ter valor futuro. Aqui o presente harmoniza com o paralelismo poético.
theological_decisions:
- issue: Identidade de אֶרְאֶלָּם
  choice: homens valentes ou heróis humanos
  alternative: “homens de Ariel”, “leões de Deus” ou outra designação obscura
  rationale: O contexto imediato trata de ruína nacional, negociações fracassadas e lamento público, favorecendo uma referência a campeões humanos. Como o hebraico permanece incerto, as principais possibilidades são preservadas em nota.
- issue: Função de מַלְאֲכֵי שָׁלוֹם
  choice: mensageiros humanos encarregados da paz
  alternative: embaixadores ou enviados da paz
  rationale: O contexto político e diplomático favorece emissários humanos, sem necessidade de introduzir seres angelicais. A nota explicita as traduções diplomáticas possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo plural “Vejam” funciona como chamada de atenção; “lá fora” evita especificar “nas ruas” além do hebraico. As notas preservam as incertezas lexicais reais.
