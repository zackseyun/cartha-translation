  text: נִשְׂגָּ֣ב יְהוָ֔ה כִּ֥י שֹׁכֵ֖ן מָר֑וֹם מִלֵּ֣א צִיּ֔וֹן מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/005.yaml
  text: Yahweh is exalted[a], for he dwells on high; he has filled Zion with justice and righteousness.
translation:
  language: pt
  text: Yahweh é exaltado, pois habita no alto[a]; encheu Sião de justiça e retidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “habita nas alturas”.
    reason: Alternativa lexical que preserva o possível valor coletivo ou abstrato de מָרוֹם.
lexical_decisions:
- source_word: נִשְׂגָּב
  choice: é exaltado
  rationale: Expressa o sentido estativo/passivo de elevação suprema e honra, preservando de modo natural a imagem vertical do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz de forma concisa e natural a razão da afirmação anterior.
- source_word: שֹׁכֵן מָרוֹם
  choice: habita no alto
  rationale: O particípio indica habitação contínua, e a expressão conserva a imagem espacial elevada sem soar rígida em português.
- source_word: מִלֵּא
  choice: encheu
  rationale: Preserva o aspecto perfectivo do verbo hebraico, apresentando a ação como realizada, com resultado relevante no presente.
- source_word: צִיּוֹן
  choice: Sião
  rationale: É a forma tradicional e amplamente reconhecida do nome geográfico em português.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: No par com צְדָקָה, refere-se à ordem justa e ao exercício da justiça, não apenas a uma sentença judicial.
- source_word: צְדָקָה
  choice: retidão
  rationale: Preserva a dimensão de correção moral e distingue o termo de מִשְׁפָּט, evitando traduzir ambos como “justiça”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: O par מִשְׁפָּט וּצְדָקָה
  choice: justiça e retidão
  alternative: juízo e justiça
  rationale: A tradução mantém distintos os dois termos relacionados, abrangendo tanto a ordem social justa quanto a integridade moral, sem reduzir a amplitude teológica do par.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das orações e o paralelismo poético do hebraico foram preservados sem rigidez excessiva.
