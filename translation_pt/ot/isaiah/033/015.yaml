source:
  edition: WLC
  text: הֹלֵ֣ךְ צְדָק֔וֹת וְ/דֹבֵ֖ר מֵֽישָׁרִ֑ים מֹאֵ֞ס בְּ/בֶ֣צַע מַעֲשַׁקּ֗וֹת נֹעֵ֤ר כַּפָּי/ו֙ מִ/תְּמֹ֣ךְ בַּ/שֹּׁ֔חַד אֹטֵ֤ם אָזְנ/וֹ֙ מִ/שְּׁמֹ֣עַ דָּמִ֔ים וְ/עֹצֵ֥ם עֵינָ֖י/ו מֵ/רְא֥וֹת בְּ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/015.yaml
  text: He who walks in righteousness and speaks what is upright[a], who despises gain from extortions, who shakes his hands free from taking a bribe, who stops his ears from hearing of bloodshed[c][b], and shuts his eyes from looking on evil—
translation:
  language: pt
  text: Aquele que anda em retidão[a] e fala o que é reto, que despreza o lucro de extorsões[b], que sacode as mãos para não aceitar suborno, que tapa os ouvidos para não ouvir falar de derramamento de sangue[c] e fecha os olhos para não ver o mal—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “anda praticando atos justos” ou “anda em justiça”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o lucro proveniente da opressão”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sangues”, expressão hebraica que pode indicar derramamento de sangue ou culpa de sangue.
    reason: cultural_note
lexical_decisions:
- source_word: הֹלֵךְ צְדָקוֹת
  choice: anda em justiça
  rationale: Preserva a metáfora hebraica de andar como modo de vida. O plural צְדָקוֹת tem aqui valor qualitativo e abrangente; “justiça” mantém a tensão entre retidão moral e conduta justa.
- source_word: וְדֹבֵר מֵישָׁרִים
  choice: e fala o que é reto
  rationale: Expressa naturalmente o sentido moral de retidão, honestidade e equidade sem reduzir a frase apenas à sinceridade.
- source_word: מֹאֵס בְּבֶצַע מַעֲשַׁקּוֹת
  choice: despreza o lucro de extorsões
  rationale: “Despreza” comunica forte repulsa moral; “lucro de extorsões” conserva tanto a ideia de ganho ilícito como o plural de atos opressivos.
- source_word: נֹעֵר כַּפָּיו מִתְּמֹךְ בַּשֹּׁחַד
  choice: sacode as mãos para não aceitar suborno
  rationale: Mantém o gesto concreto de rejeição e explicita com naturalidade que ele se recusa a receber o suborno.
- source_word: אֹטֵם אָזְנוֹ מִשְּׁמֹעַ דָּמִים
  choice: tapa os ouvidos para não ouvir falar de derramamento de sangue
  rationale: O plural idiomático português “ouvidos” soa natural. “Ouvir falar de” preserva a formulação ampla do hebraico sem especificar indevidamente planos, relatos ou cumplicidade.
- source_word: וְעֹצֵם עֵינָיו מֵרְאוֹת בְּרָע
  choice: e fecha os olhos para não contemplar o mal
  rationale: Conserva a imagem de recusa deliberada. “Contemplar” sugere olhar intencional ou complacente, sem restringir o alcance geral de רָע.
theological_decisions:
- issue: Particípios éticos sem pronome relativo explícito
  choice: Aquele que...
  alternative: Quem... / O que anda...
  rationale: “Aquele que” fornece um sujeito natural em português e preserva o caráter singular e representativo da descrição hebraica sem a tornar uma lista abstrata de virtudes.
- issue: Sentido de צְדָקוֹת
  choice: justiça
  alternative: atos justos / retidão
  rationale: “Justiça” preserva a amplitude ética do termo e sua ligação com uma vida conforme ao que é justo. A nota registra alternativas possíveis, evitando resolver silenciosamente a tensão lexical.
- issue: Alcance de מִשְּׁמֹעַ דָּמִים
  choice: não ouvir falar de derramamento de sangue
  alternative: não escutar planos de violência / não ouvir sobre culpa de sangue
  rationale: O hebraico não determina se se trata de planos violentos, relatos ou envolvimento cúmplice. A tradução mantém essa abertura em vez de inserir uma situação específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção paralela adequada à poesia profética. A metáfora de “andar” e os gestos corporais foram preservados; formas plurais naturais em português foram usadas para “mãos”, “ouvidos” e “olhos”.
