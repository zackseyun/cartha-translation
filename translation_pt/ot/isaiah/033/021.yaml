id: ISA.33.21
reference: Isaiah 33:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אִם שָׁ֞ם אַדִּ֤יר יְהוָה֙ לָ֔/נוּ מְקוֹם נְהָרִ֥ים יְאֹרִ֖ים רַחֲבֵ֣י יָדָ֑יִם בַּל תֵּ֤לֶךְ בּ/וֹ֙ אֳנִי שַׁ֔יִט וְ/צִ֥י אַדִּ֖יר לֹ֥א יַעַבְרֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/021.yaml
  text: But there the majestic Yahweh will be for us a place of rivers[a], of broad streams, where no rowing ship can go[c][b], and no mighty vessel can pass through.
translation:
  language: pt
  text: Mas ali o majestoso Yahweh será para nós um lugar de rios e de canais largos[a], onde nenhum navio a remo[b] navegará, nem embarcação poderosa alguma passará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “largos de mãos”, expressão idiomática que indica cursos de água muito largos.
    reason: Explica a forma concreta do idiomatismo hebraico preservado pelo sentido na tradução.
  - marker: b
    text: 'Ou: “navio a remos”; o termo hebraico se refere a uma embarcação usada em navegação ativa.'
    reason: Registra uma alternativa lexical possível sem especificar além do que o hebraico permite.
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: A expressão introduz aqui um forte contraste com o quadro anterior; “Mas” comunica essa retomada adversativa de modo natural em português.
- source_word: שָׁם
  choice: ali
  rationale: Mantém a ênfase locativa em Sião e soa natural no contexto.
- source_word: אַדִּיר יְהוָה
  choice: o majestoso Yahweh
  rationale: אַדִּיר expressa majestade, poder ou nobreza e, nesta construção, pode qualificar diretamente Yahweh. A alternativa sintática é registrada em nota.
- source_word: לָנוּ
  choice: para nós
  rationale: 'A preposição indica benefício: Yahweh será para seu povo esse lugar de proteção.'
- source_word: מְקוֹם
  choice: um lugar
  rationale: Preserva a metáfora ousada que identifica Yahweh como o lugar caracterizado por cursos de água protetores, sem convertê-la silenciosamente em comparação.
- source_word: נְהָרִים יְאֹרִים
  choice: rios e canais
  rationale: Distingue os dois termos hídricos. יְאֹרִים pode designar canais ou braços de rio; “canais” mantém a imagem de vias aquáticas sem pressupor necessariamente uma obra artificial.
- source_word: רַחֲבֵי יָדָיִם
  choice: largos
  rationale: A expressão literalmente relacionada a “mãos/lados” funciona como um idiomatismo de grande largura; o sentido é traduzido no texto e a forma hebraica é explicada em nota.
- source_word: אֳנִי שַׁיִט
  choice: navio a remo
  rationale: A expressão indica uma embarcação empregada em navegação ativa, provavelmente movida a remos. “Navio a remo” é claro e evita a especificidade histórica excessiva de “galera”.
- source_word: וְצִי אַדִּיר
  choice: nem embarcação poderosa alguma
  rationale: צִי designa navio ou embarcação, enquanto אַדִּיר ressalta poder ou imponência. A formulação portuguesa preserva a imagem de uma embarcação formidável.
- source_word: לֹא יַעַבְרֶנּוּ
  choice: passará
  rationale: O sufixo retoma o lugar aquático; no português, a referência fica clara pela oração relativa e dispensa um objeto pronominal pouco natural.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Relação de אַדִּיר com יהוה
  choice: o majestoso Yahweh
  alternative: Yahweh, em majestade
  rationale: A leitura principal toma אַדִּיר como qualificação direta de Yahweh. Como a sintaxe também admite uma formulação predicativa ou adverbial, essa possibilidade é preservada em nota.
- issue: Yahweh como lugar de cursos de água protetores
  choice: será para nós um lugar de rios e de canais largos
  alternative: será para nós como um lugar de rios e de canais largos
  rationale: O hebraico não inclui uma partícula explícita de comparação. A tradução conserva a identificação metafórica e não a enfraquece acrescentando “como”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem das orações acompanha de perto o hebraico, mas evita construções artificiais. “Embarcação poderosa alguma” preserva o tom elevado e a negação enfática.
