id: ISA.33.8
reference: Isaiah 33:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נָשַׁ֣מּוּ מְסִלּ֔וֹת שָׁבַ֖ת עֹבֵ֣ר אֹ֑רַח הֵפֵ֤ר בְּרִית֙ מָאַ֣ס עָרִ֔ים לֹ֥א חָשַׁ֖ב אֱנֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/008.yaml
  text: The highways lie desolate[a]; the traveler has ceased from the road. He has broken the covenant, despised the cities[b], and regarded no man.
translation:
  language: pt
  text: As estradas estão desertas; o viajante deixou de passar pelo caminho. Ele rompeu a aliança, desprezou as cidades[a] e não teve consideração por homem algum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, segundo algumas versões antigas, “desprezou as testemunhas”. O Texto Massorético traz “cidades”.
    reason: textual_variant
  - marker: b
    text: Hebraico “homem” (ʾenôsh), termo singular para um ser humano ou homem mortal; aqui tem sentido genérico.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: estão desertas
  rationale: O verbo indica o estado resultante de devastação ou abandono. A formulação é natural em português e preserva o sentido estativo.
- source_word: מְסִלּוֹת
  choice: estradas
  rationale: O substantivo plural designa vias principais de circulação. “Estradas” é claro e corrente em português, sem sugerir necessariamente o conceito moderno de autoestrada.
- source_word: שָׁבַת
  choice: deixou de passar
  rationale: O verbo expressa cessação; combinado com o particípio seguinte, a formulação comunica de modo natural que a circulação do viajante cessou.
- source_word: עֹבֵר אֹרַח
  choice: o viajante ... pelo caminho
  rationale: A expressão descreve literalmente quem passa por uma via. “O viajante” é conciso e preserva o singular, enquanto “pelo caminho” reflete אֹרַח.
- source_word: הֵפֵר בְּרִית
  choice: rompeu a aliança
  rationale: A expressão significa quebrar ou violar uma aliança. “Aliança” preserva o termo bíblico central בְּרִית sem excluir a possibilidade de um pacto político no contexto.
- source_word: מָאַס עָרִים
  choice: desprezou as cidades
  rationale: O Texto Massorético traz “cidades” e o verbo comunica rejeição ou desprezo. A variante apoiada por algumas versões antigas é registrada em nota.
- source_word: לֹא חָשַׁב אֱנוֹשׁ
  choice: não teve consideração por homem algum
  rationale: A expressão indica ausência de consideração por um ser humano. “Homem algum” conserva o substantivo hebraico singular אֱנוֹשׁ e, no contexto, tem força genérica.
theological_decisions:
- issue: Sentido genérico de אֱנוֹשׁ
  choice: homem algum
  alternative: ninguém; ser humano algum; a humanidade
  rationale: O hebraico emprega um substantivo masculino singular para o ser humano mortal. A tradução preserva essa forma, enquanto a nota esclarece sua força genérica.
- issue: Referente dos verbos na terceira pessoa do singular
  choice: mantido como o pronome não especificado “ele”
  alternative: o inimigo; o traidor; aquele que rompeu o pacto
  rationale: O versículo não identifica expressamente o sujeito. Manter “ele” preserva a ambiguidade do hebraico e evita defini-lo por inferência contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe mantém o paralelismo breve do hebraico. Os marcadores foram posicionados junto às expressões a que suas respectivas notas se referem.
