  rationale: A revisão melhora a naturalidade e desfaz uma ambiguidade de referência sem alterar o sentido. “Festas solenes” expressa de forma idiomática o contexto de celebrações cultuais designadas; a nota mantém as leituras alternativas legítimas. “Teus olhos” reproduz explicitamente a ênfase hebraica e identifica sem dúvida o destinatário. “Removida” traduz de modo natural a estabilidade da tenda no contexto das estacas e cordas.
