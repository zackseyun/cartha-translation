  text: חֲזֵ֣ה צִיּ֔וֹן קִרְיַ֖ת מֽוֹעֲדֵ֑/נוּ עֵינֶי/ךָ֩ תִרְאֶ֨ינָה יְרוּשָׁלִַ֜ם נָוֶ֣ה שַׁאֲנָ֗ן אֹ֤הֶל בַּל יִצְעָן֙ בַּל יִסַּ֤ע יְתֵֽדֹתָי/ו֙ לָ/נֶ֔צַח וְ/כָל חֲבָלָ֖י/ו בַּל יִנָּתֵֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/020.yaml
  text: Look upon Zion[a], the city of our appointed feasts; your eyes will see Jerusalem, a quiet habitation, a tent that will not be moved; its stakes will never be pulled up[c][b], and none of its ropes will be torn apart.
translation:
  language: pt
  text: Contempla Sião, a cidade das nossas festas solenes;[a] teus olhos verão Jerusalém, uma morada tranquila,[b] uma tenda que não será removida. Suas estacas jamais serão arrancadas, e nenhuma de suas cordas será rompida.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cidade das nossas assembleias” ou “a cidade das nossas festas”. O termo hebraico pode indicar tempos fixados ou reuniões, especialmente no contexto do culto.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma morada segura”. O adjetivo pode expressar tranquilidade, ausência de perturbação ou segurança.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega a imagem de uma tenda para retratar a permanência de Jerusalém: suas estacas não serão arrancadas, e suas cordas não serão rompidas.'
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה
  choice: Contemple
  rationale: Preserva a força do imperativo dirigido a uma pessoa no singular e soa natural e digno em português.
- source_word: קִרְיַת מוֹעֲדֵנוּ
  choice: a cidade das nossas festas determinadas
  rationale: מוֹעֵד designa tempo ou encontro marcado e, neste contexto de Sião, provavelmente evoca as festas comunitárias de culto; “determinadas” mantém a noção de ocasião fixada.
- source_word: עֵינֶיךָ תִרְאֶינָה
  choice: seus olhos verão
  rationale: Mantém os olhos como sujeito explícito, preservando a ênfase concreta do hebraico.
- source_word: נָוֶה שַׁאֲנָן
  choice: uma morada tranquila
  rationale: נָוֶה é uma morada ou habitação; שַׁאֲנָן comunica tranquilidade, ausência de perturbação e, por extensão, segurança.
- source_word: אֹהֶל בַּל יִצְעָן
  choice: uma tenda que não será deslocada
  rationale: Mantém a metáfora literal da tenda e traduz o verbo raro de modo compatível com a ideia contextual de não ser removida ou levada a outro lugar.
- source_word: בַּל יִסַּע יְתֵדֹתָיו לָנֶצַח
  choice: Suas estacas jamais serão arrancadas
  rationale: נסע, com estacas de tenda, descreve retirá-las ao levantar acampamento; “jamais” expressa naturalmente לָנֶצַח nesta construção negativa.
- source_word: וְכָל חֲבָלָיו בַּל יִנָּתֵקוּ
  choice: e nenhuma de suas cordas será rompida
  rationale: A formulação positiva-negativa idiomática “nenhuma” reproduz o sentido de “todas... não”; חֲבָלִים são as cordas da tenda e נתק indica romper ou arrebentar.
theological_decisions:
- issue: Natureza da imagem de Sião/Jerusalém
  choice: Apresentar Jerusalém como morada pacífica e estável por meio da imagem concreta de uma tenda impossível de desmontar.
  alternative: Explicitar na tradução uma leitura exclusivamente histórico-política ou uma identificação escatológica/eclesiológica.
  rationale: O texto hebraico afirma a estabilidade de Jerusalém mediante uma metáfora, mas não define no próprio versículo o alcance histórico ou escatológico da promessa; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Contemple” conserva a solenidade sem arcaísmo excessivo; “festas determinadas” preserva o componente cultual e a ideia de ocasiões marcadas. Os marcadores seguem ordem de ocorrência no texto.
