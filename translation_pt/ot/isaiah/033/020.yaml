review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o imperativo, o paralelismo Sião/Jerusalém e a metáfora de uma tenda permanentemente firme. Contudo, “festas determinadas” não é idiomático e pode sugerir festas específicas já identificadas, em vez de ocasiões cultuais fixadas. “Seus olhos” também cria uma referência possessiva potencialmente ambígua após “Sião”.
  naturalness: O registro é geralmente apropriado, mas “festas determinadas” soa pouco natural no português atual. A formulação com “teus olhos” torna inequívoco que a promessa se dirige ao destinatário do imperativo, mantendo ao mesmo tempo a ênfase corporal do hebraico.
  terminology: “Festas solenes” comunica naturalmente o sentido cultual de מוֹעֲדֵנוּ sem eliminar as alternativas de “assembleias” ou “festas”, que permanecem explicitadas na nota. “Morada tranquila”, “tenda”, “estacas” e “cordas” mantêm com precisão a imagem hebraica.
  issues:
  - severity: medium
    issue: “festas determinadas”
    rationale: Embora reflita literalmente a ideia de ocasiões designadas, a expressão não é natural em português moderno e pode ser entendida como “certas festas” ou festas previamente especificadas. “Festas solenes” é uma solução cultual idiomática, enquanto a nota preserva a amplitude lexical.
  - severity: low
    issue: “seus olhos verão”
    rationale: Depois de “Sião”, o possessivo de terceira pessoa pode momentaneamente parecer retomar a cidade. “Teus olhos verão” elimina a ambiguidade e conserva o sujeito explícito do hebraico.
