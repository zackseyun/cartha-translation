base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
translation:
  language: pt
  text: 'E nenhum morador dirá: “Estou doente”; o povo que nela habita tem sua iniquidade[a] perdoada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua culpa foi levada embora” ou “seu pecado foi removido”. A expressão hebraica fala literalmente da iniquidade sendo carregada ou retirada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל
  choice: E nenhum
  rationale: A conjunção é preservada, e a negação forte introduz naturalmente em português o sujeito genérico “nenhum morador”.
- source_word: יֹאמַר
  choice: dirá
  rationale: O imperfeito tem sentido futuro no discurso profético; “dirá” é claro e natural.
- source_word: שָׁכֵן
  choice: morador
  rationale: A forma singular designa genericamente quem reside na cidade; “morador” é corrente e acessível.
- source_word: חָלִיתִי
  choice: Estou doente
  rationale: O verbo חלה expressa doença ou fraqueza; no discurso direto, o presente comunica adequadamente o estado resultante.
- source_word: הָעָם
  choice: o povo
  rationale: עם refere-se aqui à população como coletividade, sem realce político de nacionalidade.
- source_word: הַיֹּשֵׁב בָּהּ
  choice: que habita nela
  rationale: O particípio singular concorda com o coletivo “povo”. O sufixo feminino aponta para a cidade, por isso “nela” preserva a referência gramatical do hebraico.
- source_word: נְשֻׂא
  choice: terá ... perdoada
  rationale: O particípio passivo de נשׂא com עָוֹן forma uma expressão que pode indicar que a iniquidade é carregada, retirada ou perdoada. O futuro harmoniza a afirmação com o horizonte profético e resulta em português natural.
- source_word: עָוֺן
  choice: iniquidade
  rationale: O termo pode abranger iniquidade, culpa ou consequência da culpa; “iniquidade” conserva seu peso moral e teológico, enquanto a nota registra a imagem literal.
theological_decisions:
- issue: Relação entre cura física e perdão no versículo
  choice: O texto apresenta lado a lado a ausência de doença e o perdão ou remoção da iniquidade entre o povo de Sião.
  alternative: Entender a doença apenas como metáfora espiritual, ou afirmar uma relação causal direta entre cada doença individual e um pecado individual.
  rationale: O hebraico reúne as duas bênçãos no contexto de restauração, mas não explicita uma relação causal universal entre doença e pecado. A tradução mantém ambas sem impor uma conclusão sistemática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Morador” e “estou doente” são correntes; “iniquidade” preserva a densidade bíblico-teológica. A referência feminina à cidade foi mantida em “nela”.
