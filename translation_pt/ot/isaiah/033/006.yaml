source:
  edition: WLC
  text: וְ/הָיָה֙ אֱמוּנַ֣ת עִתֶּ֔י/ךָ חֹ֥סֶן יְשׁוּעֹ֖ת חָכְמַ֣ת וָ/דָ֑עַת יִרְאַ֥ת יְהוָ֖ה הִ֥יא אוֹצָרֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/006.yaml
  text: And he will be the stability of your times[a], a wealth of salvation, wisdom, and knowledge[c][b]; the fear of Yahweh is his treasure.
translation:
  language: pt
  text: E ele será a estabilidade dos seus tempos[a], uma riqueza de salvações[b], sabedoria e conhecimento; o temor de Yahweh é o seu tesouro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Haverá estabilidade em seus tempos”; o verbo hebraico também pode ser entendido de modo impessoal, sem “ele” como sujeito.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “salvações”; o plural pode indicar salvação abundante ou muitos livramentos.'
    reason: lexical_alternative
  - marker: c
    text: O sufixo hebraico é masculino singular (“dele”), mas seu referente é incerto; pode referir-se a Yahweh ou a outro referente masculino determinado pelo contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: E ele será
  rationale: O verbo está no masculino singular e pode retomar pessoalmente Yahweh no contexto; a possibilidade de leitura impessoal é preservada em nota.
- source_word: אֱמוּנַת עִתֶּיךָ
  choice: a estabilidade dos seus tempos
  rationale: אֱמוּנָה expressa firmeza ou estabilidade objetiva; עִתֶּיךָ mantém a amplitude de 'seus tempos', dirigindo-se a um referente masculino singular.
- source_word: חֹסֶן יְשׁוּעֹת
  choice: uma riqueza de salvações
  rationale: חֹסֶן pode indicar riqueza, reserva ou abundância; o plural יְשׁוּעוֹת é mantido para conservar a ideia de múltiplos livramentos ou salvação abundante.
- source_word: חָכְמַת וָדָעַת
  choice: sabedoria e conhecimento
  rationale: Tradução direta e natural dos dois substantivos coordenados.
- source_word: יִרְאַת יְהוָה
  choice: o temor de Yahweh
  rationale: Preserva a expressão hebraica de reverência pactual e translitera o nome divino pessoal.
- source_word: הִיא אוֹצָרוֹ
  choice: será o seu tesouro
  rationale: A cópula portuguesa no futuro acompanha a perspectiva temporal da primeira oração; 'seu' preserva a ambiguidade do sufixo masculino singular quanto ao referente.
theological_decisions:
- issue: Sujeito de וְהָיָה
  choice: 'Leitura pessoal: “ele será”'
  alternative: 'Leitura impessoal: “haverá estabilidade”'
  rationale: O masculino singular favorece um sujeito pessoal retomado do contexto, mas o hebraico também admite construção impessoal; a alternativa é registrada em nota.
- issue: Referente do sufixo em אוֹצָרוֹ
  choice: “o seu tesouro”, sem explicitar o referente
  alternative: “o tesouro dele”, “o tesouro dela” ou “o seu tesouro” referido ao destinatário
  rationale: O sufixo masculino singular tem referente debatido. A formulação portuguesa conserva parte dessa ambiguidade, complementada pela nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura poética concisa. “Yahweh” preserva o nome divino; “seus tempos” e “seu tesouro” mantêm as ambiguidades referenciais sem tornar a frase artificial.
