base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/014.yaml
  text: 'Sinners in Zion are afraid[d][c][b][a]; trembling has seized the godless: “Who among us can dwell with a consuming fire? Who among us can dwell with everlasting burnings?”'
translation:
  language: pt
  text: 'Os pecadores em Sião estão com medo; o tremor se apoderou dos ímpios[a]: “Quem de nós pode habitar[b] com o fogo devorador[c]? Quem de nós pode habitar com as chamas eternas[d]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hipócritas”. O termo hebraico pode designar os irreligiosos ou profanos, e não apenas pessoas insinceras.
    reason: lexical_alternative
  - marker: b
    text: Ou “permanecer” ou “morar temporariamente”. O verbo hebraico pode indicar residência temporária ou permanência.
    reason: lexical_alternative
  - marker: c
    text: A expressão “fogo devorador” evoca a linguagem bíblica sobre a presença santa e julgadora de Deus; compare Deuteronômio 4:24; Hebreus 12:29.
    reason: cross_reference
  - marker: d
    text: Ou “chamas perpétuas” ou “ardores eternos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּחֲדוּ
  choice: estão com medo
  rationale: O perfeito qal descreve o medo que tomou conta deles, com ênfase no estado resultante; a formulação é natural em português atual.
- source_word: בְצִיּוֹן
  choice: em Sião
  rationale: A preposição בְ tem sentido locativo e identifica Sião como o lugar onde estão os pecadores.
- source_word: חַטָּאִים
  choice: pecadores
  rationale: Equivalente direto e corrente para os que são caracterizados pelo pecado.
- source_word: אָחֲזָה רְעָדָה
  choice: o tremor se apoderou
  rationale: Mantém a imagem concreta do hebraico, em que o tremor agarra ou domina os ímpios.
- source_word: חֲנֵפִים
  choice: ímpios
  rationale: Neste contexto de juízo, o termo designa pessoas irreligiosas ou profanas, não apenas insinceras; “ímpios” comunica bem esse sentido moral e religioso.
- source_word: מִי יָגוּר לָנוּ
  choice: Quem de nós pode habitar
  rationale: A expressão לָנוּ é vertida idiomaticamente como “de nós”, preservando a autorreferência coletiva; יָגוּר pode indicar morar, permanecer ou residir temporariamente.
- source_word: אֵשׁ אוֹכֵלָה
  choice: fogo devorador
  rationale: Preserva a força participial e a imagem de um fogo que consome, em formulação natural e dignificada em português.
- source_word: מוֹקְדֵי עוֹלָם
  choice: chamas eternas
  rationale: Comunica a imagem plural de focos ardentes duradouros e a força temporal de עוֹלָם sem definir além do texto a natureza dessas chamas.
theological_decisions:
- issue: Referente do fogo devorador e das chamas eternas
  choice: A tradução mantém as imagens como metáforas não explicitadas no corpo do versículo, com nota indicando sua associação contextual à presença santa e julgadora de Deus.
  alternative: Entender as imagens de modo mais restrito como o fogo do juízo divino contra os perversos ou como simbolismo ligado ao altar de Sião.
  rationale: O contexto imediato associa a presença de YHWH ao perigo para os perversos, e o versículo seguinte descreve quem pode permanecer ali. A redação não resolve indevidamente a tensão nem introduz categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira e vocabulário amplamente compreensível. A ordem poética e o paralelismo das duas perguntas foram preservados; as alternativas lexicais relevantes e a alusão teológica foram colocadas em notas.
