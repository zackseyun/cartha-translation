  yaml_path: translation/ot/isaiah/033/003.yaml
  text: At the sound of the tumult[a], peoples fled; at your rising up[b], nations were scattered.
translation:
  language: pt
  text: Ao som do tumulto[a], os povos fugiram; ao te levantares[b], as nações se dispersaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao ruído da agitação, os povos fugiram”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa de tua exaltação”. O hebraico pode enfatizar tanto o ato de Deus levantar-se para agir quanto sua majestade exaltada.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִקּוֹל
  choice: Ao som de
  rationale: A preposição מִן com קוֹל indica aqui a ocasião ou causa da reação. “Ao som de” é idiomático em português e preserva a força desencadeadora da expressão.
- source_word: הָמוֹן
  choice: tumulto
  rationale: הָמוֹן pode indicar multidão, ruído ou agitação ruidosa. Neste contexto de fuga de povos, “tumulto” expressa melhor a comoção audível sem reduzir o termo apenas a “barulho”.
- source_word: נָדְדוּ
  choice: fugiram
  rationale: Embora o verbo possa significar vaguear ou afastar-se, o contexto militar e de juízo favorece o sentido de retirada em fuga.
- source_word: עַמִּים
  choice: os povos
  rationale: “Povos” preserva a distinção lexical em relação a גּוֹיִם, traduzido depois por “nações”, embora os campos semânticos se sobreponham.
- source_word: מֵרוֹמְמֻתֶךָ
  choice: quando te levantaste
  rationale: A forma derivada de רום pode exprimir elevação, exaltação ou o ato de levantar-se. “Quando te levantaste” apresenta de modo natural a provável imagem de Deus erguendo-se para agir, sem excluir a ideia de sua exaltação.
- source_word: נָפְצוּ
  choice: se dispersaram
  rationale: O verbo admite os sentidos de dispersar e despedaçar. Com “nações” como sujeito e em paralelismo com a fuga dos povos, “se dispersaram” é a leitura contextual mais provável.
- source_word: גּוֹיִם
  choice: as nações
  rationale: “Nações” é a equivalência comum no contexto de Isaías e evita introduzir o contraste posterior associado ao termo “gentios”.
theological_decisions:
- issue: Referente do sufixo de segunda pessoa em מֵרוֹמְמֻתֶךָ
  choice: A fala é dirigida a Deus e descreve seu levantar-se ou sua exaltação ao agir em juízo.
  alternative: A fala poderia ser entendida como dirigida a Sião ou Jerusalém personificada.
  rationale: O contexto imediato destaca a intervenção do SENHOR contra nações hostis. A tradução conserva a segunda pessoa sem inserir explicitamente o nome divino, preservando a tensão quanto ao referente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. O paralelismo poético entre “povos” e “nações” foi preservado, assim como a ambiguidade entre levantar-se para agir e ser exaltado.
