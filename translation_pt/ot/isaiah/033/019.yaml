  text: אֶת עַ֥ם נוֹעָ֖ז לֹ֣א תִרְאֶ֑ה עַ֣ם עִמְקֵ֤י שָׂפָה֙ מִ/שְּׁמ֔וֹעַ נִלְעַ֥ג לָשׁ֖וֹן אֵ֥ין בִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/019.yaml
  text: You will no longer see the insolent people[a], a people of speech too deep to understand[c][b], of a stammering tongue without comprehension.
translation:
  language: pt
  text: Você não verá mais o povo insolente,[a] povo de fala profunda demais para ser entendida,[b] de língua balbuciante, incompreensível.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o povo feroz” ou “o povo desafiador”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um povo de lábio profundo, impossível de ouvir”. Isto é, um povo cuja fala é obscura demais para ser entendida.
    reason: lexical_alternative
  - marker: c
    text: Ou “de língua zombeteira” ou “de língua estranha”. A expressão hebraica é difícil e provavelmente se refere a uma língua estrangeira ininteligível para o ouvinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹעָז
  choice: insolente
  rationale: Expressa a ousadia arrogante e intimidadora do povo; alternativas possíveis são “feroz” e “desafiador”.
- source_word: תִרְאֶה
  choice: você não verá mais
  rationale: Mantém o sentido básico de ראה, “ver”; “mais” explicita naturalmente, no contexto, que esse povo deixará de estar presente diante do ouvinte.
- source_word: עִמְקֵי שָׂפָה
  choice: de fala profunda demais para se entender
  rationale: Comunica em português o idiomatismo literal “profundo de lábio”, isto é, uma fala obscura e inacessível ao ouvinte, preservando algo da imagem hebraica.
- source_word: מִשְּׁמוֹעַ
  choice: para se entender
  rationale: Embora literalmente relacionado a “ouvir”, no sintagma indica que aquilo que se ouve não pode ser compreendido.
- source_word: נִלְעַג לָשׁוֹן
  choice: de língua balbuciante
  rationale: A expressão difícil descreve uma língua estrangeira que soa truncada ou ininteligível ao ouvinte, sem necessariamente afirmar um distúrbio real de fala.
- source_word: אֵין בִּינָה
  choice: incompreensível
  rationale: No paralelismo, indica ausência de inteligibilidade para quem ouve; a formulação portuguesa evita sugerir que os falantes carecem de inteligência.
- source_word: עַם ... עַם
  choice: o povo ... povo
  rationale: Preserva a repetição enfática do hebraico de modo natural e evita tornar “nação” mais político do que o contexto exige.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “povo” e a imagem de fala “profunda” foram mantidas, enquanto “incompreensível” esclarece que o problema é a inteligibilidade da língua para o ouvinte.
