  text: עַתָּ֥ה אָק֖וּם יֹאמַ֣ר יְהוָ֑ה עַתָּה֙ אֵֽרוֹמָ֔ם עַתָּ֖ה אֶנָּשֵֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/010.yaml
  text: Now I will arise[a], says Yahweh; now I will be exalted; now I will lift myself up.
translation:
  language: pt
  text: “Agora me levantarei”, diz Yahweh; “agora serei exaltado; agora serei elevado”.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os dois últimos verbos hebraicos têm sentidos muito próximos. Também podem ser traduzidos: “agora me exaltarei; agora me elevarei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: agora
  rationale: Marca a ação divina iminente. A repetição nas três orações foi preservada para manter a força retórica e a progressão do hebraico.
- source_word: אָקוּם
  choice: me levantarei
  rationale: O imperfeito qal de קום expressa aqui a decisão de entrar em ação. Em português, a forma pronominal é natural e conserva o tom solene.
- source_word: יֹאמַר יְהוָה
  choice: diz Yahweh
  rationale: Reproduz de modo natural a fórmula profética e mantém o nome divino presente no texto hebraico.
- source_word: אֵרוֹמָם
  choice: serei exaltado
  rationale: A forma de רום comunica elevação ou exaltação. A tradução preserva sua relação semântica com o verbo seguinte sem fundi-los numa única expressão.
- source_word: אֶנָּשֵׂא
  choice: serei elevado
  rationale: O nifal de נשׂא admite sentido passivo ou reflexivo, ligado a ser erguido ou elevado. “Serei elevado” mantém a imagem básica e distingue este verbo do anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome divino, não um título. A transliteração “Yahweh” preserva essa distinção sem substituir o nome por “SENHOR”.
- issue: Relação entre os dois verbos finais de exaltação
  choice: serei exaltado; serei elevado
  alternative: me exaltarei; me elevarei
  rationale: Os dois verbos hebraicos têm sentidos próximos, e suas formas podem ser entendidas com matiz passivo ou reflexivo. A tradução mantém ambos e não transforma a progressão poética numa afirmação teológica mais específica.
translation_notes:
  register: Português atual, claro e solene, com repetição deliberada de “agora” e paralelismo poético. As aspas delimitam a fala divina interrompida pela fórmula “diz Yahweh”.
