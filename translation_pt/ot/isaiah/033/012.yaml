  text: וְ/הָי֥וּ עַמִּ֖ים מִשְׂרְפ֣וֹת שִׂ֑יד קוֹצִ֥ים כְּסוּחִ֖ים בָּ/אֵ֥שׁ יִצַּֽתּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/012.yaml
  text: And the peoples will become burnings of lime; like cut thornbushes[a], they will be burned in the fire.
translation:
  language: pt
  text: E os povos se tornarão como a cal que se queima; como espinheiros cortados, arderão no fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pegarão fogo” ou “serão acesos”. O verbo hebraico pode enfatizar o início da combustão, bem como o fato de arderem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: E ... se tornarão
  rationale: O verbo היה com predicativo expressa aqui a passagem ao estado resultante do juízo, não apenas existência estática.
- source_word: עַמִּים
  choice: os povos
  rationale: Preserva o plural coletivo e o alcance amplo do hebraico, sem restringi-lo à ideia política de nações.
- source_word: מִשְׂרְפוֹת שִׂיד
  choice: como cal queimada
  rationale: A construção hebraica é condensada e pode designar queimas de cal ou o produto dessa queima. A formulação portuguesa conserva a imagem da cal submetida ao fogo e torna clara sua função comparativa no verso.
- source_word: קוֹצִים כְּסוּחִים
  choice: espinheiros cortados
  rationale: קוֹצִים pode indicar espinhos ou vegetação espinhosa; no contexto de combustível cortado, 'espinheiros' comunica naturalmente a imagem. O particípio passivo כְּסוּחִים é mantido como 'cortados'.
- source_word: בָּאֵשׁ
  choice: pelo fogo
  rationale: Embora a preposição possa ser entendida locativamente ('no fogo'), em português 'pelo fogo' liga-se de modo natural ao ato de incendiar sem alterar a imagem.
- source_word: יִצַּתּוּ
  choice: serão incendiados
  rationale: O verbo descreve serem acesos ou pegarem fogo. 'Serão incendiados' preserva a força da ignição melhor que uma formulação voltada apenas ao consumo completo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A comparação com a cal foi explicitada por 'como' para evitar a expressão pouco natural 'queimas de cal', enquanto a nota preserva a ambiguidade lexical do verbo final.
