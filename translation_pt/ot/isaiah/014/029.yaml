  text: אַֽל תִּשְׂמְחִ֤י פְלֶ֨שֶׁת֙ כֻּלֵּ֔/ךְ כִּ֥י נִשְׁבַּ֖ר שֵׁ֣בֶט מַכֵּ֑/ךְ כִּֽי מִ/שֹּׁ֤רֶשׁ נָחָשׁ֙ יֵ֣צֵא צֶ֔פַע וּ/פִרְי֖/וֹ שָׂרָ֥ף מְעוֹפֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/029.yaml
  text: Do not rejoice, all of you Philistia, because the rod that struck you is broken; for from the root of the serpent will come out a viper, and its fruit will be a flying fiery serpent.
translation:
  language: pt
  text: Não se alegre, Filístia inteira, porque foi quebrada a vara de quem a feria; pois da raiz da serpente sairá uma víbora, e seu fruto será uma serpente ardente voadora.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: Filístia inteira
  rationale: Reproduz o vocativo coletivo dirigido a toda a Filístia em português natural.
- source_word: שֵׁבֶט מַכֵּךְ
  choice: a vara que a feria
  rationale: Mantém a imagem de instrumento de domínio ou castigo e o particípio hebraico, cujo referente permanece implícito.
- source_word: צֶפַע
  choice: víbora
  rationale: Termo português corrente para uma serpente venenosa, sem alegar uma identificação zoológica mais precisa do que o texto permite.
- source_word: שָׂרָף מְעוֹפֵף
  choice: serpente ardente voadora
  rationale: Conserva a expressão imagética hebraica, incluindo tanto o caráter ardente quanto o qualificativo 'voadora'.
theological_decisions:
- issue: Identidade histórica da vara, da serpente, da víbora e de seu fruto
  choice: Preservar as metáforas sem identificar explicitamente governantes ou impérios
  alternative: Inserir uma interpretação histórica específica no corpo do versículo
  rationale: O versículo não nomeia os referentes; explicitá-los resolveria uma ambiguidade histórica e teológica legítima.
- issue: Relação entre a serpente e seu fruto
  choice: Traduzir literalmente a progressão metafórica
  alternative: Parafrasear como uma sucessão de reis ou ameaças
  rationale: A linguagem figurada do hebraico é deliberada e deve permanecer visível.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e ampla inteligibilidade internacional. O feminino em 'a feria' retoma 'Filístia'; 'dela' retoma 'serpente'.
