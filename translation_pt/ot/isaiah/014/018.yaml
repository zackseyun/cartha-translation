  text: כָּל מַלְכֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם שָׁכְב֥וּ בְ/כָב֖וֹד אִ֥ישׁ בְּ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/018.yaml
  text: All the kings of the nations[a], all of them, lie in glory[b], each in his own house.
translation:
  language: pt
  text: Todos os reis das nações, todos eles, jazem em glória[a], cada um em sua própria casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com honra».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «em sua casa»; neste contexto, pode referir-se ao túmulo ou à câmara funerária de cada rei.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: Introduz a totalidade do grupo e combina naturalmente com o plural «os reis».
- source_word: מַלְכֵי גוֹיִם
  choice: os reis das nações
  rationale: Reproduz a cadeia construta hebraica sem restringir indevidamente גוֹיִם a povos estrangeiros específicos.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Mantém a retomada enfática do hebraico, embora seja redundante em português.
- source_word: שָׁכְבוּ
  choice: jazem
  rationale: No contexto funerário, «jazem» expressa de modo conciso e digno o estado de estarem deitados na morte ou no sepultamento, sem acrescentar a metáfora do sono.
- source_word: בְכָבוֹד
  choice: em glória
  rationale: Conserva de perto a imagem e a formulação hebraicas; neste contexto, a expressão comunica a dignidade de um sepultamento honroso. A alternativa idiomática é registrada em nota.
- source_word: אִישׁ
  choice: cada um
  rationale: Na construção distributiva, אִישׁ significa idiomaticamente «cada um», referindo-se individualmente aos reis já mencionados.
- source_word: בְבֵיתוֹ
  choice: em sua própria casa
  rationale: Preserva o substantivo hebraico «casa» e torna explícito em português o valor distributivo do sufixo possessivo; no contexto, a casa pode designar o túmulo ou a câmara funerária.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a repetição enfática do hebraico preservada. «Jazem» mantém o cenário funerário sem explicá-lo em excesso. Os marcadores foram posicionados junto às expressões às quais suas notas efetivamente se referem.
