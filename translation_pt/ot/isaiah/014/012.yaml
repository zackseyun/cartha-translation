revisions:
- from: Como você caiu do céu, ó brilhante, filho da alvorada![a] Você foi derrubado por terra, você que subjugava as nações!
  to: Como você caiu do céu, ó astro brilhante[a], filho da alvorada! Você foi abatido à terra, você que subjugava as nações!
  rationale: A revisão melhora a precisão de «à terra», torna mais natural a designação poética de הֵילֵל sem a converter em nome próprio ou em identificação astronômica rígida, e posiciona a chamada de nota junto ao termo a que ela se refere. O restante preserva o tom de escárnio poético e o sentido do hebraico.
