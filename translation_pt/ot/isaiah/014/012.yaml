review_pass:
  verdict: revise
  source_fidelity: 'O sentido central é bem preservado: a queda do céu, a designação poética ligada à luz e à aurora, o abatimento à terra e a ação dominadora contra as nações. Contudo, «por terra» tende a significar “no chão/derrubado” em vez de marcar claramente o movimento «à terra» de לָאָרֶץ.'
  naturalness: «Como você caiu» é claro e adequado ao português moderno. «Ó brilhante» é compreensível, mas soa elíptico e pouco idiomático como vocativo isolado; «ó astro brilhante» conserva a imagem celeste e lê-se com maior naturalidade. «Foi abatido à terra» é mais preciso e natural que «foi derrubado por terra».
  terminology: A opção descritiva, sem usar «Lúcifer» como nome próprio no texto, respeita o hebraico e evita impor uma identificação posterior. «Filho da alvorada» preserva bem a construção poética. A nota mantém de forma apropriada as alternativas tradicionais e lexicais.
  issues:
  - severity: medium
    issue: «Você foi derrubado por terra» não expressa com precisão o destino «à terra».
    rationale: לָאָרֶץ indica movimento/direção para a terra. Em português, «derrubado por terra» geralmente descreve o resultado de cair no chão; «abatido à terra» preserva melhor tanto a direção quanto a imagem de humilhação violenta de נִגְדַּעְתָּ.
  - severity: low
    issue: «Ó brilhante» é um vocativo excessivamente elíptico em português.
    rationale: Embora reflita a ideia lexical de הֵילֵל, um adjetivo substantivado dessa forma soa menos natural. «Ó astro brilhante» explicita, sem determinar em excesso como «estrela da manhã», a figura celeste pressuposta pelo paralelismo.
  - severity: low
    issue: O marcador da nota não está imediatamente junto ao termo anotado.
    rationale: A nota trata especificamente de הֵילֵל; colocá-la depois de «brilhante» torna o vínculo inequívoco e corresponde à nota de tradução declarada.
  revised_text: Como você caiu do céu, ó astro brilhante[a], filho da alvorada! Você foi abatido à terra, você que subjugava as nações!
