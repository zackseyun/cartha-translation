source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
translation:
  language: pt
  text: Como você caiu do céu, ó astro brilhante[a], filho da alvorada! Você foi abatido à terra, você que subjugava as nações!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico הֵילֵל é tradicionalmente traduzido por «Lúcifer» em algumas versões antigas; mais literalmente, designa uma figura celestial brilhante, muitas vezes entendida como «astro da manhã» ou «estrela da manhã».
    reason: Registra a tradução tradicional e interpretações lexicais plausíveis sem transformá-las na única leitura do texto principal.
lexical_decisions:
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação retórica de espanto e lamentação sem acrescentar uma interjeição interpretativa.
- source_word: נָפַלְתָּ מִשָּׁמַיִם
  choice: você caiu do céu
  rationale: Expressa de modo natural a queda consumada e preserva o contraste poético entre céu e terra.
- source_word: הֵילֵל
  choice: ó brilhante
  rationale: Reproduz a ideia de uma figura luminosa sem transformar a designação poética no nome próprio tradicional «Lúcifer».
- source_word: בֶּן־שָׁחַר
  choice: filho da alvorada
  rationale: Mantém literalmente a imagem poética hebraica; «alvorada» é corrente, elevada e adequada ao paralelismo celestial.
- source_word: נִגְדַּעְתָּ לָאָרֶץ
  choice: Você foi derrubado por terra
  rationale: Comunica a força passiva e violenta de נִגְדַּעְתָּ em português natural, enquanto «por terra» preserva o movimento de humilhação desde o céu.
- source_word: חוֹלֵשׁ עַל־גּוֹיִם
  choice: você que subjugava as nações
  rationale: O particípio indica a ação característica ou continuada da figura; «subjugava» transmite o domínio opressor sobre as nações sem a obscuridade de uma tradução excessivamente literal.
theological_decisions:
- issue: Se הֵילֵל deve ser traduzido pelo nome tradicional «Lúcifer»
  choice: Traduzir descritivamente como «ó brilhante» no texto principal
  alternative: Lúcifer; estrela da manhã; astro da manhã
  rationale: No hebraico, o termo funciona como designação poética de uma figura luminosa e não é inequivocamente um nome próprio. A tradução descritiva prioriza o texto-fonte e não resolve a identidade da figura mediante uma tradição posterior.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A invocação «ó brilhante» preserva o tom poético. Evita-se tratar «Lúcifer» como nome próprio no texto principal. O marcador [a] aparece imediatamente após a expressão poética à qual a nota se refere.
