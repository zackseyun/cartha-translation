    reason: Registra a tradução tradicional e interpretações lexicais plausíveis sem transformá-las na única leitura do texto principal.
  revision_rationale: A revisão melhora a precisão de «à terra», torna mais natural a designação poética de הֵילֵל sem a converter em nome próprio ou em identificação astronômica rígida, e posiciona a chamada de nota junto ao termo a que ela se refere. O restante preserva o tom de escárnio poético e o sentido do hebraico.
