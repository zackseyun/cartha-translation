  text: לִ/שְׁבֹּ֤ר אַשּׁוּר֙ בְּ/אַרְצִ֔/י וְ/עַל הָרַ֖/י אֲבוּסֶ֑/נּוּ וְ/סָ֤ר מֵֽ/עֲלֵי/הֶם֙ עֻלּ֔/וֹ וְ/סֻ֨בֳּל֔/וֹ מֵ/עַ֥ל שִׁכְמ֖/וֹ יָסֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/025.yaml
  text: to break Assyria in my land[a], and on my mountains I will trample him; then his yoke will depart from upon them[b], and his burden from upon his shoulder will depart.
translation:
  language: pt
  text: para despedaçar a Assíria na minha terra[a] e pisoteá-la nos meus montes; então, o jugo dela se afastará de sobre eles[b], e a carga dela se afastará de sobre o ombro dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o assírio”; o termo hebraico pode designar tanto a nação quanto seu governante ou exército representativo.
    reason: alternative_reading
  - marker: b
    text: O hebraico passa do plural, “sobre eles”, ao singular, “sobre o ombro dele”. O singular pode personificar o povo oprimido ou ter sentido distributivo.
    reason: number_shift
lexical_decisions:
- source_word: לִשְׁבֹּר
  choice: para despedaçar
  rationale: O infinitivo construto expressa propósito ou resultado na continuação do juramento anterior. “Despedaçar” preserva a força da metáfora de שׁבר sem acrescentar uma interpretação específica.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: O termo pode indicar a nação ou o assírio como seu representante. O nome nacional se ajusta ao contexto da opressão imperial; a personificação permanece perceptível pelas ações e pelos possessivos.
- source_word: בְּאַרְצִי
  choice: na minha terra
  rationale: Tradução direta que conserva tanto o sentido territorial quanto a declaração de pertencimento a Deus.
- source_word: הָרַי
  choice: meus montes
  rationale: Mantém o plural e o sufixo de primeira pessoa, com expressão topográfica natural em português.
- source_word: אֲבוּסֶנּוּ
  choice: pisoteá-la
  rationale: בוס significa pisar ou calcar. O objeto singular retoma a Assíria personificada; o feminino segue naturalmente o gênero do nome em português.
- source_word: וְסָר
  choice: será tirado
  rationale: Embora סור tenha o sentido básico de afastar-se ou sair, no quadro do jugo opressor o passivo idiomático comunica que ele deixará de pesar sobre o povo.
- source_word: מֵעֲלֵיהֶם
  choice: de sobre eles
  rationale: Preserva a preposição e o sufixo plural, mantendo a imagem de um peso colocado sobre os oprimidos.
- source_word: עֻלּוֹ
  choice: o jugo dela
  rationale: “Jugo” é a metáfora convencional para dominação. O possessivo refere-se à Assíria, com concordância feminina exigida pelo português.
- source_word: סֻבֳּלוֹ
  choice: a carga dela
  rationale: “Carga” representa um peso carregado sob coerção e forma um paralelo concreto com “jugo”.
- source_word: שִׁכְמוֹ
  choice: o ombro dele
  rationale: Conserva o singular do texto massorético após o plural “eles”, sem harmonizar a oscilação de número.
- source_word: יָסוּר
  choice: sairá
  rationale: Expressa o afastamento da carga e preserva a repetição semântica de סור, embora com variação idiomática em português.
theological_decisions:
- issue: Referente de אַשּׁוּר
  choice: A Assíria como poder imperial personificado
  alternative: O assírio, entendido como rei, invasor ou exército representativo
  rationale: O contexto trata da derrota de uma potência opressora na terra de Deus. “A Assíria” conserva o referente coletivo, enquanto a personificação permite as ações e os possessivos singulares.
- issue: Mudança de número entre מֵעֲלֵיהֶם e שִׁכְמוֹ
  choice: Preservar a passagem do plural “eles” ao singular “dele”
  alternative: 'Regularizar no plural: “dos ombros deles”'
  rationale: A forma massorética apresenta plural na primeira expressão e singular na segunda. A tradução mantém essa tensão, que pode personificar o povo oprimido ou empregar o singular distributivamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção preserva a imagem concreta do jugo e da carga, a personificação da Assíria e a mudança de número do hebraico. O feminino dos possessivos referentes à Assíria é uma exigência gramatical do português, não uma alteração do referente.
