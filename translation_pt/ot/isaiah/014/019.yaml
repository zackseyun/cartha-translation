  text: וְ/אַתָּ֞ה הָשְׁלַ֤כְתָּ מִֽ/קִּבְרְ/ךָ֙ כְּ/נֵ֣צֶר נִתְעָ֔ב לְב֥וּשׁ הֲרֻגִ֖ים מְטֹ֣עֲנֵי חָ֑רֶב יוֹרְדֵ֥י אֶל אַבְנֵי ב֖וֹר כְּ/פֶ֥גֶר מוּבָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/019.yaml
  text: But you are cast out from your grave like a despised branch[a], clothed with the slain, those pierced by the sword, who go down to the stones of the pit[c][b], like a trampled corpse.
translation:
  language: pt
  text: Mas você foi lançado fora da sua sepultura, como um ramo abominado[a], envolto pelos mortos, pelos traspassados pela espada[b], que descem às pedras da cova[c], como um cadáver pisoteado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um broto detestado” ou “como um renovo abominado”. A palavra hebraica pode significar “broto”, “renovo” ou “ramo”; aqui indica algo detestado e jogado fora.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos atravessados pela espada”. A expressão hebraica é difícil; o sentido contextual é o dos mortos em batalha.
    reason: lexical_alternative
  - marker: c
    text: A “cova” é uma imagem poética da sepultura ou do domínio dos mortos; “pedras da cova” talvez evoque uma sepultura revestida de pedras.
    reason: cultural_note
lexical_decisions:
- source_word: הָשְׁלַכְתָּ מִקִּבְרְךָ
  choice: foi lançado para fora da sua sepultura
  rationale: O hofal perfeito expressa estado resultante passivo, e a preposição מן indica exclusão do lugar de sepultamento. A formulação mantém essa força em português corrente.
- source_word: כְּנֵצֶר נִתְעָב
  choice: como um ramo rejeitado
  rationale: נֵצֶר designa broto, renovo ou ramo; aqui, qualificado por נִתְעָב e inserido numa cena de desonra, refere-se a algo repulsado e descartado. “Ramo” evita introduzir uma associação messiânica não exigida pelo contexto.
- source_word: לְבוּשׁ הֲרֻגִים
  choice: coberto de mortos
  rationale: Embora לְבוּשׁ tenha a imagem literal de estar vestido, “coberto de mortos” comunica naturalmente em português a imagem macabra de o destinatário estar envolvido pelos mortos, sem eliminar a metáfora subjacente.
- source_word: מְטֹעֲנֵי חָרֶב
  choice: dos atravessados pela espada
  rationale: A expressão hebraica é difícil, mas no contexto descreve mortos em batalha atingidos ou traspassados pela espada. “Atravessados” preserva a violência concreta e a incerteza é registrada em nota.
- source_word: יוֹרְדֵי אֶל אַבְנֵי בוֹר
  choice: dos que descem às pedras da cova
  rationale: Mantém a construção participial e a imagem incomum das pedras da cova, sem reduzi-la interpretativamente apenas a “sepultura”.
- source_word: כְּפֶגֶר מוּבָס
  choice: como um cadáver pisoteado
  rationale: פֶגֶר é um corpo morto, e מוּבָס descreve aquilo que foi calcado ou pisado. A escolha é direta, vívida e digna.
theological_decisions:
- issue: Possíveis conotações messiânicas de נֵצֶר
  choice: ramo
  alternative: renovo ou broto
  rationale: Embora נֵצֶר possa ter ressonância messiânica em Isaías 11:1, aqui o contexto imediato é a zombaria contra um governante desonrado e privado de sepultamento digno. “Ramo” preserva o sentido vegetal sem importar uma leitura teológica alheia ao versículo.
- issue: Sentido de בּוֹר na linguagem da morte
  choice: cova
  alternative: sepultura ou mundo dos mortos
  rationale: “Cova” conserva a imagem concreta do hebraico e permite sua associação poética com a morte sem identificar de modo excessivamente preciso o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acumulativa acompanha a sequência poética hebraica; “sepultura”, “cova” e “cadáver” mantêm as imagens distintas do original.
