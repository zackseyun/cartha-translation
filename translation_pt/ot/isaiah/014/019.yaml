  naturalness: 'A sintaxe enumerativa é justificável como poesia, mas pode ficar mais clara em português com preposições e referentes consistentes: “pelos mortos, pelos traspassados...” preserva a acumulação sem a construção pouco natural “de mortos, dos...”. “Lançado fora da sua sepultura” é mais idiomático que “lançado para fora da sua sepultura”.'
