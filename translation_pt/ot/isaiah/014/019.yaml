- from: Mas você foi lançado para fora da sua sepultura, como um ramo rejeitado[a], coberto de mortos, dos atravessados pela espada[b], dos que descem às pedras da cova[c], como um cadáver pisoteado.
  to: Mas você foi lançado fora da sua sepultura, como um ramo abominado[a], envolto pelos mortos, pelos traspassados pela espada[b], que descem às pedras da cova[c], como um cadáver pisoteado.
