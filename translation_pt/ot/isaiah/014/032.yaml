source:
  edition: WLC
  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/032.yaml
  text: And what will one answer the messengers of the nation? That Yahweh has founded Zion[b][a], and in her the afflicted of his people will find refuge.
translation:
  language: pt
  text: E o que se responderá aos mensageiros da nação?[a] Que Yahweh fundou Sião, e nela os aflitos[b] do seu povo encontrarão refúgio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos enviados da nação” ou “aos embaixadores da nação”. O termo hebraico também pode designar representantes diplomáticos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os pobres do seu povo”, “os necessitados do seu povo” ou “os humildes do seu povo”. O termo hebraico pode indicar pobreza, aflição ou humildade, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה יַעֲנֶה
  choice: E o que se responderá
  rationale: Preserva a ligação discursiva do waw e expressa de modo natural em português o sujeito genérico ou indefinido do verbo hebraico, sem identificar uma pessoa específica.
- source_word: מַלְאֲכֵי גוֹי
  choice: aos mensageiros da nação
  rationale: מַלְאָךְ pode designar mensageiros ou enviados diplomáticos. O singular definido pelo contexto, גוֹי, é mantido como “a nação”, sem especificação além do texto.
- source_word: כִּי
  choice: Que
  rationale: Neste contexto, introduz o conteúdo da resposta esperada, e não necessariamente uma oração causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִסַּד צִיּוֹן
  choice: fundou Sião
  rationale: יִסַּד denota fundar ou estabelecer, possivelmente com nuance arquitetônica. O pretérito perfeito português apresenta o ato divino como realizado.
- source_word: וּבָהּ
  choice: e nela
  rationale: O pronome feminino singular retoma Sião. “Nela” é natural em português e mantém o gênero da cidade, embora torne menos explícita a personificação do que “em sua pessoa” ou formulações artificiais.
- source_word: יֶחֱסוּ
  choice: encontrarão refúgio
  rationale: Comunica naturalmente o ato ou resultado de refugiar-se, preservando a ideia de segurança encontrada em Sião.
- source_word: עֲנִיֵּי עַמּוֹ
  choice: os aflitos do seu povo
  rationale: עֲנִיִּים pode indicar pobres, oprimidos, aflitos ou humildes. “Aflitos” abrange aqui a vulnerabilidade e o sofrimento sem limitar o sentido à pobreza econômica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Referente feminino de וּבָהּ
  choice: nela
  alternative: ali; nela própria
  rationale: A forma feminina retoma Sião e sustenta a imagem da cidade como lugar de refúgio, sem acrescentar uma interpretação eclesiológica ou escatológica específica.
- issue: Amplitude semântica de עֲנִיֵּי
  choice: aflitos
  alternative: pobres; humildes; necessitados
  rationale: A escolha preserva a condição de sofrimento e vulnerabilidade do povo, enquanto uma nota registra as alternativas legítimas sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção impessoal “se responderá” evita impor um sujeito ausente no hebraico. “Sião” segue a forma portuguesa consagrada, e “nela” preserva de maneira idiomática o referente feminino.
