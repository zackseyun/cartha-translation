  yaml_path: translation/ot/isaiah/014/028.yaml
  text: 'In the year of the death of King Ahaz[a], this oracle came:'
translation:
  language: pt
  text: 'No ano da morte do rei Acaz, veio este pronunciamento[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esta mensagem solene”; mais literalmente, “este peso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  choice: No ano da morte de
  rationale: A expressão temporal hebraica data a mensagem pelo ano da morte de Acaz. A formulação preserva de perto a construção do texto-fonte e é natural em português.
- source_word: הַמֶּלֶךְ אָחָז
  choice: o rei Acaz
  rationale: O artigo e o título são expressos segundo o uso natural do português; o nome próprio segue a forma portuguesa tradicional e amplamente reconhecida.
- source_word: הָיָה
  choice: veio
  rationale: Embora o verbo signifique literalmente “foi/existiu”, aqui ele introduz o surgimento da mensagem profética. “Veio” produz uma frase natural sem especificar indevidamente quem a proferiu ou como foi transmitida.
- source_word: הַמַּשָּׂא
  choice: pronunciamento
  rationale: Em cabeçalhos proféticos, מַשָּׂא designa uma declaração solene, muitas vezes de juízo. “Pronunciamento” comunica essa função com clareza atual, enquanto “peso” preservaria a forma lexical, mas seria pouco transparente no texto principal.
- source_word: הַזֶּה
  choice: este
  rationale: O demonstrativo aponta diretamente para a profecia que segue.
