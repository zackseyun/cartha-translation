id: ISA.14.1
reference: Isaiah 14:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ יְרַחֵ֨ם יְהוָ֜ה אֶֽת יַעֲקֹ֗ב וּ/בָחַ֥ר עוֹד֙ בְּ/יִשְׂרָאֵ֔ל וְ/הִנִּיחָ֖/ם עַל אַדְמָתָ֑/ם וְ/נִלְוָ֤ה הַ/גֵּר֙ עֲלֵי/הֶ֔ם וְ/נִסְפְּח֖וּ עַל בֵּ֥ית יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/001.yaml
  text: For Yahweh will have compassion on Jacob and will again choose Israel[a], and he will settle them on their own land. The foreigner will join them[b], and they will attach themselves to the house of Jacob.
translation:
  language: pt
  text: Pois Yahweh terá compaixão de Jacó, tornará a escolher Israel e os fará repousar em sua própria terra. Os estrangeiros[a] se unirão a eles e serão agregados à casa de Jacó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os imigrantes” ou “os residentes estrangeiros”. O hebraico גֵּר muitas vezes designa pessoas de fora que vivem entre os israelitas, não apenas visitantes de passagem.
    reason: lexical_alternative
  - marker: b
    text: Ou “se ligarão à casa de Jacó”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento do que precede e mantém de modo natural a conexão discursiva.
- source_word: יְרַחֵם
  choice: terá compaixão
  rationale: Expressa a compaixão terna do piel de רחם em português atual e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo tetragrama.
- source_word: וּבָחַר עוֹד בְּיִשְׂרָאֵל
  choice: tornará a escolher Israel
  rationale: Comunica uma escolha renovada, sem sugerir uma primeira eleição nem definir além do texto seu alcance teológico.
- source_word: וְהִנִּיחָם עַל אַדְמָתָם
  choice: e os fará repousar em sua própria terra
  rationale: Mantém o valor causativo de נוח e sua possível dimensão de repouso e estabelecimento na terra, sem reduzi-lo apenas a assentamento.
- source_word: הַגֵּר
  choice: o estrangeiro
  rationale: É uma forma clara e abrangente; a nota conserva os sentidos mais específicos de imigrante ou residente estrangeiro.
- source_word: וְנִלְוָה הַגֵּר עֲלֵיהֶם
  choice: O estrangeiro se unirá a eles
  rationale: Representa de modo natural a associação voluntária indicada por נלוה.
- source_word: וְנִסְפְּחוּ עַל בֵּית יַעֲקֹב
  choice: e eles serão ligados à casa de Jacó
  rationale: Preserva a forma passiva do nifal e a imagem de incorporação ou ligação à casa de Jacó.
theological_decisions:
- issue: Sentido da nova escolha de Israel
  choice: tornará a escolher Israel
  alternative: voltará a favorecer Israel
  rationale: A tradução preserva a linguagem de eleição e restauração, sem determinar se seu alcance é exclusivamente nacional, escatológico ou tipológico.
- issue: Identidade e condição de הַגֵּר
  choice: o estrangeiro
  alternative: o imigrante / o residente estrangeiro
  rationale: A escolha é legível e não impõe uma categoria técnica, enquanto a nota registra a possível condição de não israelita residente.
- issue: Voz de וְנִסְפְּחוּ
  choice: serão ligados
  alternative: se ligarão
  rationale: A forma passiva preserva o nifal e também a ambiguidade quanto à agência de sua incorporação à casa de Jacó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo entre Jacó e Israel, a imagem da casa de Jacó e as ambiguidades relevantes do hebraico.
