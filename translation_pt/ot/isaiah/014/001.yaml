revisions:
- from: Pois Yahweh terá compaixão de Jacó, tornará a escolher Israel e os fará repousar em sua própria terra. O estrangeiro[a] se unirá a eles, e eles serão ligados à casa de Jacó.[b]
  to: Pois Yahweh terá compaixão de Jacó, tornará a escolher Israel e os fará repousar em sua própria terra. Os estrangeiros[a] se unirão a eles e serão agregados à casa de Jacó.[b]
  rationale: A revisão resolve a mudança hebraica de singular coletivo para plural por meio de um plural explícito e natural em português («os estrangeiros»). «Serão agregados» mantém a voz passiva do nifal e a ideia de incorporação à casa de Jacó, sem eliminar a alternativa reflexiva indicada na nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:17Z'
review_pass:
  verdict: revise
  source_fidelity: A primeira parte transmite adequadamente a compaixão de Yahweh, a escolha renovada de Israel e o repouso/estabelecimento na terra. No final, porém, «eles serão ligados» é uma formulação pouco natural e deixa o referente do plural excessivamente obscuro em português. O hebraico alterna o coletivo singular הַגֵּר com o plural וְנִסְפְּחוּ; a tradução deve conservar essa referência aos não israelitas sem atribuir-lhes uma agência ou uma categoria mais específica do que o texto permite.
  naturalness: «Os estrangeiros se unirão a eles e serão agregados à casa de Jacó» é mais idiomático em português contemporâneo do que «O estrangeiro ... e eles serão ligados». Também torna explícito o referente coletivo que o hebraico expressa com singular coletivo seguido de plural.
  terminology: «Yahweh», «Jacó», «Israel», «terra» e «casa de Jacó» estão adequados. «Estrangeiros» permanece uma opção ampla e legível para גֵּר; a nota preserva as alternativas de residente não israelita.
  issues:
  - severity: medium
    issue: Referente e fluência da oração final
    rationale: A sequência «O estrangeiro se unirá a eles, e eles serão ligados» alterna singular e plural de uma maneira que soa truncada em português e pode fazer «eles» referir-se a Israel/Jacó. O plural hebraico após o singular coletivo pode ser expresso naturalmente por «os estrangeiros».
  - severity: low
    issue: Colocação e conteúdo da nota b
    rationale: A nota b deve estar ancorada diretamente em «serão agregados à casa de Jacó» e deve refletir a alternativa relevante em português, não uma formulação reflexiva que já não corresponde exatamente à redação principal.
  revised_text: Pois Yahweh terá compaixão de Jacó, tornará a escolher Israel e os fará repousar em sua própria terra. Os estrangeiros[a] se unirão a eles e serão agregados à casa de Jacó.[b]
  revised_footnotes:
