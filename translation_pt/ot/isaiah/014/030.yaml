base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/030.yaml
  text: The firstborn of the poor will graze[a], and the needy will lie down in safety; and I will kill your root with famine[b], and it will slay your remnant.
translation:
  language: pt
  text: Os primogênitos dos pobres pastarão[a], e os necessitados se deitarão em segurança; e matarei a sua raiz pela fome, e ele matará o seu remanescente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os mais pobres dos pobres”. O hebraico diz literalmente “os primogênitos dos pobres”, expressão que pode funcionar como intensificação.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz um verbo masculino singular: “matará o seu remanescente”, sem identificar explicitamente o sujeito. Ele pode ser entendido como a fome ou o juízo personificado, como um agente indefinido ou como Deus implícito.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: pastarão
  rationale: Preserva a imagem pastoril do Qal de רעה, em paralelo com o ato de se deitar.
- source_word: בְּכוֹרֵי דַלִּים
  choice: os primogênitos dos pobres
  rationale: Mantém a formulação literal e incomum do hebraico, sem decidir no texto principal se ela funciona como superlativo.
- source_word: וְאֶבְיוֹנִים
  choice: e os necessitados
  rationale: Distingue אֶבְיוֹנִים de דַלִּים e realça a condição de carência.
- source_word: לָבֶטַח יִרְבָּצוּ
  choice: se deitarão em segurança
  rationale: Conserva tanto a ideia de repouso seguro quanto a imagem pastoril de רבץ.
- source_word: וְהֵמַתִּי בָרָעָב
  choice: matarei ... pela fome
  rationale: Expressa de modo natural a causação de morte no Hifil de מות e o valor instrumental da preposição ב.
- source_word: שָׁרְשֵׁךְ
  choice: sua raiz
  rationale: Preserva a metáfora hebraica da raiz como origem ou base do povo interpelado.
- source_word: וּשְׁאֵרִיתֵךְ
  choice: o seu remanescente
  rationale: Mantém o vocabulário profético de שְׁאֵרִית e a ideia daquilo que sobreviver.
- source_word: יַהֲרֹג
  choice: ela matará
  rationale: O feminino português retoma naturalmente 'fome', embora o hebraico use verbo masculino singular; a nota registra a ambiguidade do sujeito.
theological_decisions:
- issue: Sujeito ambíguo do verbo final no singular
  choice: Retomar 'a fome' com 'ela matará' no texto principal
  alternative: 'Entender o sujeito como indefinido ou como Deus: ''ele matará'' ou ''matarei'''
  rationale: O hebraico muda da primeira pessoa para a terceira pessoa masculina singular sem explicitar o sujeito. Em português, 'ela' pode retomar a fome como juízo personificado, mas a nota preserva as demais possibilidades e a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. As imagens pastoril e vegetal foram preservadas, assim como a ambiguidade do sujeito na oração final por meio de nota.
