  text: לֹֽא תֵחַ֤ד אִתָּ/ם֙ בִּ/קְבוּרָ֔ה כִּֽי אַרְצְ/ךָ֥ שִׁחַ֖תָּ עַמְּ/ךָ֣ הָרָ֑גְתָּ לֹֽא יִקָּרֵ֥א לְ/עוֹלָ֖ם זֶ֥רַע מְרֵעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/020.yaml
  text: You will not be joined with them in burial[a], because you have destroyed your land; you have slain your people. The offspring of evildoers will never be named.
translation:
  language: pt
  text: Você não será reunido a eles no sepultamento, porque destruiu a sua terra; matou o seu povo. A descendência dos malfeitores[a] jamais será nomeada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a semente dos malfeitores” ou “os descendentes dos perversos”.
    reason: Alternativas lexicais para זֶרַע מְרֵעִים, preservando tanto a imagem literal de “semente” quanto o sentido genealógico de “descendentes”.
lexical_decisions:
- source_word: תֵחַד אִתָּם בִּקְבוּרָה
  choice: não será reunido a eles na sepultura
  rationale: Expressa a exclusão do governante do sepultamento junto aos demais, preservando a força relacional de אִתָּם. A formulação passiva em português evita sugerir que ele simplesmente decidiu não se juntar a eles.
- source_word: אַרְצְךָ שִׁחַתָּ
  choice: destruiu a sua terra
  rationale: Mantém a referência direta ao território sob o domínio do governante e a severidade do Piel de שׁחת.
- source_word: עַמְּךָ הָרָגְתָּ
  choice: matou o seu povo
  rationale: Tradução direta e atual, que preserva a acusação de que o governante matou aqueles que estavam sob seu próprio domínio, sem acrescentar uma qualificação jurídica não expressa.
- source_word: לֹא יִקָּרֵא לְעוֹלָם
  choice: jamais será nomeada
  rationale: Preserva o sentido de não ser chamado ou nomeado para sempre, incluindo a possível ideia contextual de apagamento duradouro, sem explicitá-la além do hebraico.
- source_word: זֶרַע מְרֵעִים
  choice: a descendência dos malfeitores
  rationale: “Descendência” comunica naturalmente o sentido coletivo de זֶרַע; “malfeitores” mantém o plural e a caracterização moral de מְרֵעִים.
theological_decisions:
- issue: Se זֶרַע מְרֵעִים designa especificamente a dinastia do tirano ou, de modo mais geral, a descendência dos malfeitores
  choice: a descendência dos malfeitores
  alternative: a descendência deste malfeitor
  rationale: O hebraico traz “malfeitores” no plural e formula a expressão de modo geral. O contexto pode incluir a linhagem do governante condenado, mas a tradução não restringe o referente além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula preserva o paralelismo das duas acusações. “Jamais será nomeada” mantém deliberadamente a concisão e a possível tensão entre receber nome, ser reconhecida e permanecer na memória.
