source:
  edition: WLC
  text: אַ֧ךְ אֶל שְׁא֛וֹל תּוּרָ֖ד אֶל יַרְכְּתֵי בֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/015.yaml
  text: But you will be brought down to Sheol[a], to the depths of the pit.
translation:
  language: pt
  text: Mas você será feito descer ao Sheol[a], às profundezas da cova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sepultura” ou “o mundo dos mortos”, para “Sheol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Marca o forte contraste adversativo entre a pretensão de subir nos versículos anteriores e a queda anunciada aqui. “Mas” expressa essa reversão de modo natural, embora a partícula também possa ter nuance enfática.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém transliterado o conceito hebraico do mundo dos mortos, sem reduzi-lo a uma sepultura individual nem identificá-lo com uma formulação doutrinária posterior.
- source_word: תּוּרָד
  choice: será levado para baixo
  rationale: O hofal de ירד é causativo-passivo. A formulação conserva a ideia de que o destinatário será feito descer, em contraste com sua ambição de subir.
- source_word: יַרְכְּתֵי
  choice: às profundezas de
  rationale: No plural construto, indica as partes mais internas ou extremas; “às profundezas” é idiomático e preserva a imagem espacial descendente.
- source_word: בּוֹר
  choice: a cova
  rationale: “Cova” representa o poço profundo da imagem poética e evita confundi-lo inteiramente com Sheol. No contexto, sugere o lugar de descida e humilhação.
theological_decisions:
- issue: Tradução de שְׁאוֹל no contexto poético de juízo
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: “Sheol” preserva a imagem hebraica e sua amplitude, sem restringi-la a uma sepultura física nem convertê-la automaticamente em uma doutrina posterior sobre o inferno.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. A repetição direcional em “levado para baixo” explicita o valor de ירד e reforça o contraste contextual entre subir e descer.
