  text: שְׁא֗וֹל מִ/תַּ֛חַת רָגְזָ֥ה לְ/ךָ֖ לִ/קְרַ֣את בּוֹאֶ֑/ךָ עוֹרֵ֨ר לְ/ךָ֤ רְפָאִים֙ כָּל עַתּ֣וּדֵי אָ֔רֶץ הֵקִים֙ מִ/כִּסְאוֹתָ֔/ם כֹּ֖ל מַלְכֵ֥י גוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/009.yaml
  text: Sheol beneath is stirred up for you[a], to meet your coming; it rouses the shades for you, all the leaders of the earth[b]; it raises from their thrones all the kings of the nations.
translation:
  language: pt
  text: O Sheol, lá embaixo, se agita por sua causa, para ir ao seu encontro quando você chegar; desperta por sua causa as sombras — todos os líderes da terra[a] — e faz todos os reis das nações se levantarem de seus tronos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todos os bodes da terra”, metáfora para líderes ou governantes proeminentes. “Sombras” traduz o hebraico refaím; também pode ser entendido como “os mortos” ou “os espíritos dos falecidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém por transliteração o conceito hebraico do domínio dos mortos, sem reduzi-lo apenas à sepultura nem importar as associações doutrinárias posteriores de “inferno”.
- source_word: מִתַּחַת
  choice: lá embaixo
  rationale: Preserva a localização inferior de Sheol e soa natural na personificação poética.
- source_word: רָגְזָה
  choice: se agita
  rationale: Expressa o tremor ou a perturbação de Sheol diante da chegada do rei, sem definir excessivamente a natureza do movimento.
- source_word: לִקְרַאת בּוֹאֶךָ
  choice: para ir ao seu encontro quando você chegar
  rationale: Comunica com clareza a imagem vívida de Sheol preparando-se para receber o recém-chegado.
- source_word: עוֹרֵר
  choice: desperta
  rationale: Conserva a imagem de Sheol fazendo seus habitantes reagirem e se levantarem diante da chegada.
- source_word: רְפָאִים
  choice: as sombras dos mortos
  rationale: Preserva o tom poético do termo para os habitantes de Sheol e, ao mesmo tempo, esclarece ao leitor moderno que se trata dos mortos, não do antigo povo dos refains.
- source_word: עַתּוּדֵי אָרֶץ
  choice: os líderes da terra
  rationale: Transmite o sentido metafórico da expressão literal “bodes da terra”, referente aos homens proeminentes ou governantes; a imagem literal é registrada em nota.
- source_word: הֵקִים
  choice: faz ... se levantarem
  rationale: Representa o valor causativo do hifil e a cena dos reis mortos erguendo-se para receber o novo ocupante de Sheol.
- source_word: מִכִּסְאוֹתָם
  choice: de seus tronos
  rationale: Mantém a imagem régia explícita no contexto dos reis das nações.
- source_word: כֹּל מַלְכֵי גוֹיִם
  choice: todos os reis das nações
  rationale: Preserva de modo direto tanto a abrangência universal quanto a linguagem política do hebraico.
theological_decisions:
- issue: Como traduzir שְׁאוֹל numa sátira poética sobre os mortos
  choice: Sheol
  alternative: sepultura; inferno; mundo dos mortos
  rationale: A transliteração preserva o retrato hebraico do domínio dos mortos personificado e evita identificar o termo, sem apoio suficiente neste verso, com noções doutrinárias posteriores de inferno.
- issue: Identidade dos רְפָאִים neste contexto
  choice: sombras dos mortos
  alternative: refains; mortos; espíritos dos falecidos
  rationale: O contexto de Sheol aponta para os mortos, e não para um grupo étnico ou para gigantes. “Sombras dos mortos” conserva o caráter poético sem definir em detalhe sua condição metafísica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais para leitores brasileiros. A repetição de “por sua causa” preserva os dois dativos hebraicos; “você” mantém a interpelação direta do poema. A construção conserva o paralelismo e a personificação de Sheol.
