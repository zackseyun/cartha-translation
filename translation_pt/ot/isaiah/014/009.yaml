revisions:
- from: O Sheol lá embaixo se agita por sua causa, para ir ao seu encontro quando você chegar; desperta por sua causa as sombras dos mortos[a], todos os líderes da terra[b]; faz todos os reis das nações se levantarem de seus tronos.
  to: O Sheol, lá embaixo, se agita por sua causa, para ir ao seu encontro quando você chegar; desperta por sua causa as sombras — todos os líderes da terra[a] — e faz todos os reis das nações se levantarem de seus tronos.
  rationale: A revisão retém a transliteração “Sheol”, a imagem espacial de estar embaixo, a dupla referência ao destinatário e o valor causativo de “faz ... se levantarem”. Substitui “sombras dos mortos” por “sombras”, preservando a concisão e a ambiguidade poética de רְפָאִים, e consolida as duas notas lexicais em uma única nota ancorada na expressão que reúne os refaím e os líderes da terra.
