id: ISA.14.8
reference: Isaiah 14:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם בְּרוֹשִׁ֛ים שָׂמְח֥וּ לְ/ךָ֖ אַרְזֵ֣י לְבָנ֑וֹן מֵ/אָ֣ז שָׁכַ֔בְתָּ לֹֽא יַעֲלֶ֥ה הַ/כֹּרֵ֖ת עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/008.yaml
  text: 'Even the cypresses rejoice over you[a], the cedars of Lebanon: ‘Since you have lain down, no woodcutter comes up against us.’'
translation:
  language: pt
  text: 'Até os ciprestes[a] se alegram por causa de você,

    os cedros do Líbano dizem:

    “Desde que você se deitou,

    nenhum lenhador sobe contra nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “zimbros” ou “abetos”; não se sabe ao certo qual espécie de árvore o termo hebraico designa.
    reason: Alternativa lexical decorrente da identificação botânica incerta de בְּרוֹשִׁים.
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'Dá ao elemento adicional valor enfático: não apenas pessoas, mas até as árvores participam da alegria.'
- source_word: בְּרוֹשִׁים
  choice: ciprestes
  rationale: É uma tradução tradicional e plausível para o termo hebraico referente a uma conífera, embora a espécie exata seja incerta; as principais alternativas são registradas em nota.
- source_word: שָׂמְחוּ לְךָ
  choice: se alegram por causa de você
  rationale: Expressa que a alegria decorre do que aconteceu ao rei, sem acrescentar explicitamente “com a sua queda”. O presente comunica a situação resultante e mantém viva a fala poética.
- source_word: אַרְזֵי לְבָנוֹן
  choice: os cedros do Líbano
  rationale: Reproduz com clareza a construção hebraica e a conhecida referência às árvores do Líbano.
- source_word: מֵאָז
  choice: Desde que
  rationale: Marca o início da nova situação a partir do momento em que o governante se deitou.
- source_word: שָׁכַבְתָּ
  choice: você se deitou
  rationale: Preserva a metáfora hebraica de deitar-se, que no contexto evoca morte ou queda, sem explicá-la dentro do texto.
- source_word: לֹא יַעֲלֶה
  choice: nenhum ... sobe
  rationale: O presente descreve a condição contínua após a queda do tirano e conserva a ideia espacial de subir até as árvores.
- source_word: הַכֹּרֵת
  choice: lenhador
  rationale: Identifica naturalmente aquele que corta árvores, conforme exige a imagem do contexto.
- source_word: עָלֵינוּ
  choice: contra nós
  rationale: Mantém a direção hostil expressa pela preposição no contexto do corte das árvores.
theological_decisions:
- issue: Força figurada da alegria das árvores
  choice: As árvores são personificadas no cântico de zombaria contra o rei caído da Babilônia.
  alternative: Entender a frase apenas como informação literal sobre a interrupção da exploração de madeira.
  rationale: O contexto imediato é poesia de zombaria com personificação. A tradução conserva a imagem e deixa que ela comunique tanto o alívio da criação quanto o fim da ameaça.
- issue: Sentido contextual de שָׁכַבְתָּ
  choice: Manter a metáfora “você se deitou”.
  alternative: Traduzir explicitamente como “você morreu” ou “você foi abatido”.
  rationale: A formulação hebraica admite a referência à morte e à queda do rei sem nomeá-las diretamente; preservar essa tensão mantém a força poética.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética. “Por causa de você” evita o sentido português potencialmente congratulatório de “por você”, enquanto não explicita além do hebraico que a alegria decorre da queda do rei. “Sobe contra nós” conserva tanto o movimento geográfico quanto a hostilidade da ação.
