  naturalness: «Que feria...; que dominava...» é natural no encadeamento do versículo e preserva o caráter descritivo retrospectivo. «Com perseguição implacável» é conciso, poético e inteligível no português internacional contemporâneo.
  terminology: «Povos» para עַמִּים e «nações» para גּוֹיִם preservam a distinção lexical. «Furor», «ira», «golpes incessantes» e «dominava» são adequados ao registro e à violência do texto, sem intensificação interpretativa indevida.
