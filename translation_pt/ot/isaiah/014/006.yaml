  text: מַכֶּ֤ה עַמִּים֙ בְּ/עֶבְרָ֔ה מַכַּ֖ת בִּלְתִּ֣י סָרָ֑ה רֹדֶ֤ה בָ/אַף֙ גּוֹיִ֔ם מֻרְדָּ֖ף בְּלִ֥י חָשָֽׂךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/006.yaml
  text: striking peoples in fury with an unceasing blow[a], ruling nations in anger[b], with unrelenting persecution.
translation:
  language: pt
  text: que feria os povos com furor, com golpes incessantes; que dominava as nações com ira,[a] com perseguição implacável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico da oração final é condensado e difícil. A forma «perseguido» pode ser entendida de modos diferentes; aqui, «com perseguição implacável» continua a descrição da opressão das nações pelo governante.
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֶּה עַמִּים
  choice: feria os povos
  rationale: O particípio hifil descreve a ação habitual do opressor. O imperfeito em português expressa naturalmente essa ação continuada no contexto da sátira contra o rei da Babilônia, e “povos” preserva a distinção em relação a גּוֹיִם, “nações”.
- source_word: בְּעֶבְרָה
  choice: com furor
  rationale: עֶבְרָה denota ira transbordante ou furor. A expressão é forte, atual e adequada ao paralelismo poético.
- source_word: מַכַּת בִּלְתִּי סָרָה
  choice: com golpes incessantes
  rationale: A construção transmite a ideia de golpes que não cessavam ou não se desviavam. O plural é natural em português para uma agressão repetida, sem alterar o sentido coletivo do singular hebraico.
- source_word: רֹדֶה בָאַף גּוֹיִם
  choice: dominava as nações com ira
  rationale: רדה pode significar governar, dominar ou subjugar. “Dominava” deixa claro o caráter opressivo indicado pelo contexto, enquanto “nações” traduz גּוֹיִם e mantém o paralelismo lexical.
- source_word: מֻרְדָּף
  choice: era perseguido
  rationale: A forma massorética é um particípio passivo masculino singular, que em sua leitura mais direta se refere ao governante descrito pelos particípios anteriores. A tradução conserva essa voz passiva, embora o contexto e a sintaxe comprimida tenham levado a outra leitura, registrada em nota.
- source_word: בְּלִי חָשָׂךְ
  choice: sem que ninguém o detivesse
  rationale: חשׂך significa reter, impedir, poupar ou conter. A formulação idiomática comunica uma perseguição sem impedimento ou contenção e concorda com a leitura passiva adotada no texto principal.
theological_decisions:
- issue: Referente e sintaxe da oração final
  choice: A oração final descreve o próprio governante como sendo perseguido sem impedimento.
  alternative: 'A oração pode continuar descrevendo a tirania do governante: “com perseguição implacável” ou “perseguindo sem trégua” as nações.'
  rationale: מֻרְדָּף é formalmente passivo e masculino singular, favorecendo a referência ao governante; contudo, a sequência sintática é difícil e o contexto permite entender a expressão como descrição da perseguição opressiva que ele exercia. A alternativa é mantida em nota para não eliminar a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo foi preservado por duas orações iniciadas por “que”; o ponto e vírgula marca a divisão poética sem tornar o verso artificialmente fragmentado.
