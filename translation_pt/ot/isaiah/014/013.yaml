  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ בִֽ/לְבָבְ/ךָ֙ הַ/שָּׁמַ֣יִם אֶֽעֱלֶ֔ה מִ/מַּ֥עַל לְ/כֽוֹכְבֵי אֵ֖ל אָרִ֣ים כִּסְאִ֑/י וְ/אֵשֵׁ֥ב בְּ/הַר מוֹעֵ֖ד בְּ/יַרְכְּתֵ֥י צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/013.yaml
  text: But you said in your heart[a], ‘I will ascend to the heavens; I will raise my throne above the stars of God, and I will sit on the mount of assembly in the far reaches of the north.’
translation:
  language: pt
  text: 'Mas você disse em seu coração: “Subirei aos céus; acima das estrelas de Deus erguerei o meu trono e me assentarei no monte da assembleia, nos confins do norte[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “nos confins de Zafom”, caso צָפוֹן aluda ao monte cósmico conhecido na tradição do antigo Oriente Próximo.
    reason: Leitura alternativa que preserva a possibilidade de צָפוֹן funcionar como nome próprio, sem substituir no texto principal seu sentido comum, “norte”.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: A conjunção e o pronome introduzem um contraste com o contexto anterior; “Mas você” expressa essa força adversativa em português atual.
- source_word: בִלְבָבְךָ
  choice: em seu coração
  rationale: Mantém a expressão hebraica para pensamento íntimo ou fala interior, que também é clara e natural em português.
- source_word: הַשָּׁמַיִם אֶעֱלֶה
  choice: Subirei aos céus
  rationale: Preserva o plural hebraico e o movimento ascendente da pretensão arrogante.
- source_word: מִמַּעַל לְכוֹכְבֵי אֵל
  choice: acima das estrelas de Deus
  rationale: Conserva a imagem hebraica sem decidir se as estrelas são astros, seres celestiais ou poderes celestes.
- source_word: אָרִים כִּסְאִי
  choice: erguerei o meu trono
  rationale: Expressa naturalmente o hifil de רום e mantém a imagem de autoexaltação.
- source_word: וְאֵשֵׁב
  choice: Eu me assentarei
  rationale: O verbo ישב pode significar sentar-se ou habitar; “me assentarei” preserva aqui a possível imagem de entronização sem explicitá-la.
- source_word: בְּהַר מוֹעֵד
  choice: no monte da assembleia
  rationale: מוֹעֵד designa aqui provavelmente uma assembleia marcada ou solene; a formulação mantém o cenário cósmico sem introduzir uma interpretação adicional.
- source_word: בְּיַרְכְּתֵי צָפוֹן
  choice: nos confins do norte
  rationale: יַרְכְּתֵי indica regiões extremas, remotas ou recônditas. “Confins” é conciso e preserva a imagem geográfica ou cósmica; a possível referência a Zafom fica registrada em nota.
theological_decisions:
- issue: Possível alusão mitológica em צָפוֹן
  choice: Traduzir צָפוֹן como “norte” no texto principal.
  alternative: Entender צָפוֹן como o nome próprio “Zafom”.
  rationale: O termo normalmente significa “norte”, mas neste contexto pode aludir ao monte cósmico Zafom, conhecido no antigo Oriente Próximo. A tradução principal mantém o sentido lexical comum, e a nota preserva a possível alusão.
- issue: Interpretação de “estrelas de Deus”
  choice: Manter literalmente “estrelas de Deus”.
  alternative: Explicitar como “seres celestiais” ou reduzir a expressão a “estrelas”.
  rationale: A expressão pode evocar astros, seres celestiais ou poderes elevados. Preservá-la evita resolver no texto uma ambiguidade presente no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala mantém o tom elevado e arrogante da declaração. O marcador [a] foi colocado junto de “norte”, termo ao qual a nota efetivamente se refere.
