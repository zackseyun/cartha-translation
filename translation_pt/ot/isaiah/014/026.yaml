  source_fidelity: 'O texto traduz com precisão a estrutura paralela do hebraico: o desígnio dirigido contra toda a terra e a mão estendida contra todas as nações. “Plano traçado” comunica adequadamente o particípio passivo הַיְעוּצָה, sem sobreinterpretá-lo como uma determinação teológica específica. “Contra”, “toda a terra”, “mão estendida” e “todas as nações” correspondem bem ao sentido contextual e à imagem do original.'
  naturalness: O português é moderno, claro e de registro bíblico digno, com leitura fluente no Brasil e em outros contextos lusófonos. “Plano traçado” evita a repetição pouco idiomática de “plano planejado”, mantendo a ideia de um plano já formulado.
  terminology: A terminologia está adequada. “Terra” preserva a leitura de alcance universal favorecida pelo paralelismo, enquanto a nota registra de modo apropriado a alternativa regional. “Nações” é preferível a “gentios” neste contexto, e a manutenção literal de “mão” conserva a metáfora hebraica.
