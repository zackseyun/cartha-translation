source:
  edition: WLC
  text: זֹ֛את הָ/עֵצָ֥ה הַ/יְּעוּצָ֖ה עַל כָּל הָ/אָ֑רֶץ וְ/זֹ֛את הַ/יָּ֥ד הַ/נְּטוּיָ֖ה עַל כָּל הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/026.yaml
  text: This is the plan that is planned against all the earth[a], and this is the hand that is stretched out against all the nations.
translation:
  language: pt
  text: Este é o plano traçado contra toda a terra[a], e esta é a mão estendida contra todas as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o país”, caso a referência seja entendida em sentido mais regional do que universal.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָעֵצָה הַיְעוּצָה
  choice: Este é o plano traçado
  rationale: A expressão identifica enfaticamente o desígnio já formulado. “Plano traçado” mantém a ligação entre o substantivo e o particípio da mesma raiz sem recorrer à repetição pouco natural “plano planejado”.
- source_word: עַל
  choice: contra
  rationale: No contexto de juízo, indica a direção hostil do plano e da mão, não apenas o assunto a que se referem.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: אֶרֶץ pode designar “terra” ou “país/região”. O paralelismo com “todas as nações” favorece aqui a amplitude universal, enquanto a nota preserva a leitura regional possível.
- source_word: וְזֹאת הַיָּד הַנְּטוּיָה
  choice: e esta é a mão estendida
  rationale: Conserva a estrutura paralela e a imagem bíblica da mão divina pronta para agir em juízo; explicitar “poder” enfraqueceria a metáfora.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם refere-se amplamente às nações; “nações” é claro e não introduz o contraste religioso sugerido por “gentios”.
theological_decisions:
- issue: Alcance de הָאָרֶץ no oráculo de juízo
  choice: 'alcance universal: “toda a terra”'
  alternative: 'alcance regional: “todo o país” ou “toda a região”'
  rationale: O paralelismo imediato com “todas as nações” favorece um horizonte universal. A alternativa lexical legítima é mantida em nota, sem resolver além do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Plano traçado” evita a repetição artificial “plano planejado”, preserva a correspondência semântica do hebraico e mantém o caráter firme do desígnio. A construção paralela das duas metades foi conservada.
