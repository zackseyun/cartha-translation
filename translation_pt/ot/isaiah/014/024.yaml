  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר אִם לֹ֞א כַּ/אֲשֶׁ֤ר דִּמִּ֨יתִי֙ כֵּ֣ן הָיָ֔תָה וְ/כַ/אֲשֶׁ֥ר יָעַ֖צְתִּי הִ֥יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/024.yaml
  text: 'Yahweh of Armies has sworn[a], saying: Surely, just as I have planned, so it has come to pass; and just as I have purposed[d][c][b], so it will stand.'
translation:
  language: pt
  text: 'Yahweh dos Exércitos[a] jurou, dizendo: “Certamente[b], assim como planejei[c], assim aconteceu; e, conforme determinei[d], assim se cumprirá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Fórmula hebraica de juramento; literalmente, “se não”, com o sentido de forte afirmação: “certamente” ou “de fato”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pensei”, “concebi” ou “pretendi”. O verbo hebraico está no perfeito (“aconteceu”); no contexto profético, também pode apresentar como realizada uma coisa ainda futura, por ser certa.'
    reason: textual_clarity
  - marker: d
    text: 'Ou: “resolvi”. A última expressão é literalmente “ela ficará de pé”, isto é, será estabelecida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: jurou
  rationale: O perfeito hebraico apresenta o juramento solene como ato consumado; o pretérito perfeito é direto e natural em português.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת pelo sentido concreto de forças ou exércitos, mais transparente hoje do que a forma tradicional “Senhor dos Exércitos”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Equivalente corrente do infinitivo hebraico que introduz discurso direto.
- source_word: אִם לֹא
  choice: Certamente
  rationale: No contexto de juramento, a expressão literalmente condicional funciona como forte afirmação; uma tradução literal por “se não” seria obscura em português.
- source_word: דִּמִּיתִי
  choice: planejei
  rationale: O verbo pode expressar pensar, conceber ou intentar; no paralelismo com יָעַצְתִּי, “planejei” comunica intenção deliberada sem apagar a amplitude lexical.
- source_word: הָיָתָה
  choice: acontecerá
  rationale: Embora a forma verbal seja perfeita, neste juramento profético ela apresenta o acontecimento futuro como certo. O futuro explícito produz em português a leitura contextual natural.
- source_word: יָעַצְתִּי
  choice: determinei
  rationale: Expressa a ideia de deliberar, resolver ou estabelecer um propósito e evita repetir “planejei”, preservando o paralelismo sem torná-lo idêntico.
- source_word: הִיא תָקוּם
  choice: assim se cumprirá
  rationale: תָקוּם significa literalmente “se levantará/ficará de pé”; aplicado ao propósito divino, indica que ele será estabelecido e efetivado. “Se cumprirá” comunica esse valor em português natural.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh das hostes
  rationale: A escolha conserva o nome próprio do texto hebraico e torna claro o sentido militar de צְבָאוֹת, sem acrescentar uma interpretação denominacional.
- issue: Valor da fórmula de juramento אִם לֹא
  choice: Certamente
  alternative: Se não; de fato
  rationale: A construção é uma fórmula elíptica de juramento que reforça a certeza da declaração, não uma condição aberta.
- issue: Valor temporal de הָיָתָה
  choice: assim acontecerá
  alternative: assim aconteceu; assim veio a ser
  rationale: O perfeito hebraico pode apresentar como consumado aquilo que está garantido pelo decreto divino. Como o segundo membro usa o imperfeito תָקוּם e o contexto anuncia o que Yahweh fará, o futuro transmite melhor a referência prospectiva, enquanto a nota preserva a forma literal.
- issue: Metáfora de תָקוּם
  choice: assim se cumprirá
  alternative: ela ficará de pé; será estabelecido
  rationale: A tradução comunica a efetivação firme do propósito. A nota registra a imagem hebraica de permanecer ou ficar de pé.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido por “assim como... assim...” e “conforme... assim...”. Evitaram-se tanto o arcaísmo “hostes” quanto uma tradução literal obscura da fórmula de juramento.
