  text: הוּרַ֥ד שְׁא֛וֹל גְּאוֹנֶ֖/ךָ הֶמְיַ֣ת נְבָלֶ֑י/ךָ תַּחְתֶּ֨י/ךָ֙ יֻצַּ֣ע רִמָּ֔ה וּ/מְכַסֶּ֖י/ךָ תּוֹלֵעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/011.yaml
  text: Your pomp has been brought down to Sheol[a], the sound of your harps; maggots are spread out beneath you[c][b], and worms are your covering.
translation:
  language: pt
  text: O seu esplendor e o som de suas harpas foram lançados ao Sheol[b]; debaixo de você se estendem larvas, e vermes são a sua cobertura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sheol é o domínio dos mortos; também se pode traduzir por “a sepultura” ou “o mundo dos mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: foi rebaixado
  rationale: O hofal de ירד expressa descida causada em forma passiva. “Foi rebaixado” comunica tanto a descida ao mundo dos mortos quanto a humilhação do esplendor real.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: Mantém o conceito hebraico do domínio dos mortos, sem reduzi-lo à sepultura física nem importar a noção teológica posterior de inferno.
- source_word: גְּאוֹנֶךָ
  choice: o seu esplendor
  rationale: גאון pode indicar majestade, pompa ou orgulho. Neste contexto régio, “esplendor” conserva em primeiro plano a grandeza ostentosa derrubada, sem eliminar a conotação de soberba.
- source_word: הֶמְיַת נְבָלֶיךָ
  choice: o som de suas harpas
  rationale: הֶמְיַת designa som ou ruído, e נבל é um instrumento de cordas semelhante à harpa ou lira. A expressão é clara e natural em português.
- source_word: תַּחְתֶּיךָ יֻצַּע רִמָּה
  choice: debaixo de você estende-se uma cama de larvas
  rationale: O passivo de יצע descreve algo estendido ou preparado como leito. A formulação explicita em português a imagem mortuária de uma cama formada por larvas.
- source_word: וּמְכַסֶּיךָ תּוֹלֵעָה
  choice: e vermes são a sua coberta
  rationale: Preserva o paralelismo grotesco entre o leito de larvas e a cobertura de vermes, mantendo תּוֹלֵעָה distinto de רִמָּה.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: O texto retrata a descida ao domínio dos mortos. A transliteração preserva a amplitude da concepção hebraica e evita identificá-la automaticamente com a sepultura física ou com o inferno de formulações doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e acessível, com “você” para leitura brasileira natural. A ordem foi ajustada para fluência, e “uma cama de larvas” torna explícita a metáfora inerente a יצע sem suavizar a imagem de decomposição.
