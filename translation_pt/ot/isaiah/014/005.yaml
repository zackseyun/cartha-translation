  text: שָׁבַ֥ר יְהוָ֖ה מַטֵּ֣ה רְשָׁעִ֑ים שֵׁ֖בֶט מֹשְׁלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/005.yaml
  text: Yahweh has broken the staff of the wicked[a], the scepter of rulers,
translation:
  language: pt
  text: 'Yahweh quebrou o bastão dos perversos[a],

    o cetro dos governantes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “a vara dos perversos”. O hebraico emprega dois termos paralelos para instrumentos de autoridade: “bastão” e “cetro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבַר
  choice: quebrou
  rationale: O qal perfeito, terceira pessoa masculina singular, apresenta a ação de quebrar como concluída. O pretérito perfeito é direto e natural em português, sem intensificar desnecessariamente o verbo como faria “despedaçou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַטֵּה
  choice: bastão
  rationale: O termo pode designar bastão ou vara. “Bastão” mantém a imagem de um instrumento de autoridade e permite distingui-lo do termo paralelo שֵׁבֶט.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: O adjetivo plural substantivado designa coletivamente pessoas moralmente más, sem exigir marcação de gênero adicional.
- source_word: שֵׁבֶט
  choice: cetro
  rationale: Embora também possa significar vara ou bastão, no paralelismo com “governantes” aponta naturalmente para um emblema ou instrumento de poder régio.
- source_word: מֹשְׁלִים
  choice: governantes
  rationale: O particípio plural de משל refere-se aos que governam. “Governantes” é direto e evita a interpretação adicional contida em “tiranos”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal divino em vez de substituí-lo por um título.
translation_notes:
  register: Português atual, claro e solene. A disposição em duas linhas conserva o paralelismo poético. “Perversos” e “governantes” mantêm o caráter coletivo dos plurais hebraicos sem acrescentar qualificações não expressas no texto.
