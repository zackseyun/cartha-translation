source:
  edition: WLC
  text: הֵילִ֤ילִֽי שַׁ֨עַר֙ זַֽעֲקִי עִ֔יר נָמ֖וֹג פְּלֶ֣שֶׁת כֻּלֵּ֑/ךְ כִּ֤י מִ/צָּפוֹן֙ עָשָׁ֣ן בָּ֔א וְ/אֵ֥ין בּוֹדֵ֖ד בְּ/מוֹעָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/031.yaml
  text: Wail[a], O gate! Cry out, O city! Melt away, all of you, Philistia! For smoke comes from the north[c][b], and there is no straggler in his ranks.
translation:
  language: pt
  text: Uiva[a], ó porta! Grite, ó cidade! Derreta-se[b], Filístia inteira! Pois do norte vem fumaça, e não há retardatário em suas fileiras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Lamente” ou “solte um grito de lamento”; o verbo hebraico também pode indicar um clamor de aflição.
    reason: lexical_alternative
  - marker: b
    text: Ou “Desfaleça” ou “desmanche-se de medo”.
    reason: lexical_alternative
  - marker: c
    text: Ou “e ninguém fica isolado em seus lugares designados”. A cláusula hebraica também pode referir-se a lugares ou tempos determinados; neste contexto, pode descrever a força invasora plenamente reunida e em ordem.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: Lamente-se
  rationale: O imperativo feminino singular de ילל expressa um grito de lamento e aflição. “Lamente-se” é claro, digno e mantém o tom urgente; a alternativa mais sonora, “Uive”, é registrada em nota.
- source_word: שַׁעַר
  choice: ó porta
  rationale: A porta da cidade é personificada e diretamente interpelada, provavelmente representando por metonímia a vida pública e as defesas da cidade.
- source_word: זַעֲקִי
  choice: Clame
  rationale: O imperativo de זעק indica levantar um grito urgente. “Clame” preserva a força sem acrescentar a ideia mais específica de um grito estridente.
- source_word: עִיר
  choice: ó cidade
  rationale: Vocativo paralelo a “ó porta”, mantendo a personificação e o discurso direto.
- source_word: נָמוֹג
  choice: Derreta-se
  rationale: מוג pode descrever derretimento, colapso ou perda de coragem. A tradução conserva a metáfora hebraica e deixa em aberto suas dimensões emocional e coletiva.
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: toda você, Filístia
  rationale: Preserva a interpelação de Filístia como entidade coletiva feminina e torna explícita a ideia de totalidade contida no sufixo.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão do lamento em estilo profético natural em português.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Tradução direcional direta, indicando a origem da ameaça.
- source_word: עָשָׁן
  choice: fumaça
  rationale: Mantém a imagem literal, sem decidir se se trata da devastação causada pelo invasor ou de uma figura para o exército que avança.
- source_word: בָּא
  choice: vem
  rationale: O perfeito hebraico tem força vívida no discurso profético; o presente português comunica a iminência da ameaça.
- source_word: וְאֵין בּוֹדֵד
  choice: e não há retardatário
  rationale: בודד descreve alguém separado ou isolado; no cenário militar, “retardatário” comunica naturalmente que ninguém ficou para trás.
- source_word: בְּמוֹעָדָיו
  choice: em suas fileiras
  rationale: No contexto da força invasora, a expressão pode apontar para postos ou formações designados. “Fileiras” comunica a leitura militar, enquanto a formulação mais literal e ambígua é preservada em nota.
theological_decisions:
- issue: Sentido da cláusula final וְאֵין בּוֹדֵד בְּמוֹעָדָיו
  choice: A força invasora é apresentada como organizada, sem nenhum retardatário em suas fileiras.
  alternative: “E ninguém fica isolado em seus lugares designados” ou “e ninguém falta no tempo determinado”.
  rationale: A fumaça que vem do norte sugere uma força invasora em avanço, e a leitura militar forma uma imagem coerente de disciplina e irresistibilidade. Como מועד admite sentidos relacionados a tempo, reunião ou lugar designado, a nota preserva a incerteza real.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. As personificações de “porta”, “cidade” e “Filístia” foram mantidas, assim como as imagens concretas de derretimento e fumaça. A pontuação conserva o ritmo urgente dos imperativos proféticos.
