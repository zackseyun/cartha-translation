id: ISA.14.21
reference: Isaiah 14:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָכִ֧ינוּ לְ/בָנָ֛י/ו מַטְבֵּ֖חַ בַּ/עֲוֺ֣ן אֲבוֹתָ֑/ם בַּל יָקֻ֨מוּ֙ וְ/יָ֣רְשׁוּ אָ֔רֶץ וּ/מָלְא֥וּ פְנֵֽי תֵבֵ֖ל עָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/021.yaml
  text: Prepare slaughter for his sons because of the guilt of their fathers[a], lest they rise up and possess the land[c][b], and fill the face of the world with cities.
translation:
  language: pt
  text: Preparem a matança para os filhos dele por causa da culpa dos pais deles,[a] para que não se levantem, tomem posse da terra[b] e encham a face do mundo de cidades.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da iniquidade dos pais deles”; o termo hebraico pode indicar culpa, iniquidade ou o castigo decorrente da culpa.
    reason: lexical_alternative
  - marker: b
    text: Ou “herdem a terra”; o verbo hebraico pode significar herdar, tomar posse ou possuir.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “encham a face do mundo de cidades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ
  choice: Preparem
  rationale: O hifil imperativo plural de כון exige uma ordem direta dirigida a mais de uma pessoa; “Preparem” é natural e preserva essa força.
- source_word: לְבָנָיו
  choice: para os filhos dele
  rationale: Traduz literalmente o plural masculino com sufixo de terceira pessoa, evitando em português a possível ambiguidade de “seus filhos”.
- source_word: מַטְבֵּחַ
  choice: a matança
  rationale: O substantivo designa abate violento ou matança em contexto de juízo; a expressão preserva a severidade do hebraico.
- source_word: בַּעֲוֺן אֲבוֹתָם
  choice: por causa da culpa dos pais deles
  rationale: בְּ tem valor causal, e עָוֹן pode indicar culpa, iniquidade ou sua consequência punitiva. “Culpa” mantém a dimensão moral sem excluir a consequência.
- source_word: בַּל יָקֻמוּ
  choice: para que não se levantem
  rationale: בַּל introduz aqui finalidade negativa; “para que não” é português atual e claro. “Se levantem” conserva tanto a imagem literal quanto a possível ideia de ascensão ao poder.
- source_word: וְיָרְשׁוּ אָרֶץ
  choice: tomem posse da terra
  rationale: ירש pode significar herdar ou tomar posse. Neste contexto, “tomem posse” evita introduzir indevidamente conotação de herança pactual, enquanto “terra” mantém a distinção em relação a תֵבֵל, “mundo”.
- source_word: וּמָלְאוּ פְנֵי תֵבֵל עָרִים
  choice: e encham a face do mundo de cidades
  rationale: Preserva a imagem hebraica de “face do mundo” e traduz עָרִים diretamente por “cidades”.
theological_decisions:
- issue: Juízo intergeracional ligado à culpa dos pais
  choice: Manter a afirmação de que a matança dos filhos está ligada à culpa dos pais.
  alternative: Explicitar que os filhos seriam julgados apenas se repetissem os pecados dos pais, ou traduzir עָוֹן somente como “castigo”.
  rationale: O texto associa diretamente os filhos à culpa dos pais. A tradução preserva essa tensão teológica sem harmonizá-la ou resolvê-la por interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “dele/deles” para reduzir a ambiguidade possessiva. A construção “para que não” substitui o mais literário “para que não venham a”, sem perder a finalidade negativa. A imagem “face do mundo” é mantida deliberadamente.
