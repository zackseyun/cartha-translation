  source_fidelity: 'A tradução preserva adequadamente a progressão do hebraico: a resposta coletiva, o discurso dirigido ao rei, a inclusão zombeteira em “Você também”, o enfraquecimento e a equiparação final aos mortos. “Ficou fraco” comunica de modo natural o estado resultante de חֻלֵּיתָ sem impor o sentido de doença, e “tornou-se como nós” mantém a repetição intencional da segunda oração.'
