  text: כֻּלָּ֣/ם יַֽעֲנ֔וּ וְ/יֹאמְר֖וּ אֵלֶ֑י/ךָ גַּם אַתָּ֛ה חֻלֵּ֥יתָ כָמ֖וֹ/נוּ אֵלֵ֥י/נוּ נִמְשָֽׁלְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/010.yaml
  text: All of them will answer and say to you[a], ‘You too have become weak like us[b]; you have become like us.’
translation:
  language: pt
  text: 'Todos eles responderão e dirão a você: “Você também ficou fraco como nós[a]; tornou-se como nós[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi enfraquecido como nós”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi igualado a nós” ou “foi comparado a nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Preserva a abrangência do hebraico e retoma naturalmente, no contexto, o grupo dos mortos ou reis que fala.
- source_word: יַעֲנוּ וְיֹאמְרוּ
  choice: responderão e dirão
  rationale: Mantém os dois verbos coordenados e o caráter formal do diálogo poético.
- source_word: אֵלֶיךָ
  choice: a você
  rationale: Expressa de modo claro e corrente o destinatário singular da fala, com ampla legibilidade em português moderno.
- source_word: גַּם אַתָּה
  choice: Você também
  rationale: Conserva a inclusão provocadora do rei caído entre os mortos.
- source_word: חֻלֵּיתָ
  choice: ficou fraco
  rationale: Comunica a perda de força e o estado resultante indicados pelo Pual de חלה, sem sugerir necessariamente doença física.
- source_word: כָמוֹנוּ
  choice: como nós
  rationale: É a equivalência comparativa direta e natural.
- source_word: אֵלֵינוּ נִמְשָׁלְתָּ
  choice: tornou-se como nós
  rationale: Representa o sentido contextual de passar a ser semelhante ou comparável aos mortos, preservando a repetição enfática do hebraico.
theological_decisions:
- issue: Natureza da provocação no Sheol
  choice: Apresentar a fala como zombaria poética acerca da perda de poder do rei e de sua redução à condição dos mortos.
  alternative: Explicitar uma leitura mitológica dos mortos personificados ou extrair da cena uma doutrina detalhada do estado intermediário.
  rationale: O versículo emprega a imagem poética dos mortos falando, mas não resolve questões teológicas mais amplas sobre a vida após a morte.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A repetição entre as duas orações foi mantida por seu efeito enfático e zombeteiro.
