  text: וְ/שַׂמְתִּ֛י/הָ לְ/מוֹרַ֥שׁ קִפֹּ֖ד וְ/אַגְמֵי מָ֑יִם וְ/טֵֽאטֵאתִ֨י/הָ֙ בְּ/מַטְאֲטֵ֣א הַשְׁמֵ֔ד נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/023.yaml
  text: I will make her a possession of the hedgehog and pools of water[a], and I will sweep her with the broom of destruction, declares Yahweh of Armies.
translation:
  language: pt
  text: Farei dela domínio do ouriço[a] e lagoas de água; eu a varrerei com a vassoura da destruição — declara Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica קִפֹּד provavelmente designa um animal que vive no deserto ou entre ruínas. Sua identificação é incerta; outras traduções possíveis são “porco-espinho”, “coruja” e o tradicional “abetouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: Farei dela
  rationale: O verbo שׂוּם pode significar pôr, estabelecer ou fazer; com os complementos deste contexto, “farei dela” expressa naturalmente a transformação de Babilônia.
- source_word: לְמוֹרַשׁ קִפֹּד
  choice: domínio do ouriço
  rationale: מוֹרָשׁ designa uma posse ou território possuído. “Domínio” comunica de modo natural que a cidade passará a ser ocupada pela criatura mencionada, sem sugerir uma herança jurídica.
- source_word: קִפֹּד
  choice: ouriço
  rationale: A identificação do animal é incerta. “Ouriço” é uma opção lexical moderna plausível; a incerteza e outras possibilidades são registradas em nota.
- source_word: וְאַגְמֵי מָיִם
  choice: e uma região de lagoas
  rationale: O plural אַגְמֵי indica lagoas, charcos ou áreas alagadiças. A expressão portuguesa preserva tanto o plural coletivo quanto a imagem de inundação e abandono.
- source_word: וְטֵאטֵאתִיהָ
  choice: eu a varrerei
  rationale: Mantém a metáfora vívida do verbo טאטא, “varrer”, e o sufixo feminino referente à cidade de Babilônia.
- source_word: בְּמַטְאֲטֵא הַשְׁמֵד
  choice: com a vassoura da destruição
  rationale: Reproduz o instrumento introduzido por בְּ e preserva a construção enfática e metafórica do hebraico.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente e solene da fórmula profética que introduz a autoridade da declaração divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Traduz transparentemente o sentido militar e cósmico de צְבָאוֹת, preservando o título divino.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração e evita substituí-lo por um título.
- issue: Referente dos sufixos femininos
  choice: dela / a
  alternative: disso / isso
  rationale: Os sufixos hebraicos femininos retomam Babilônia como cidade personificada; as formas femininas portuguesas conservam essa imagem profética.
- issue: Intensidade de הַשְׁמֵד
  choice: destruição
  alternative: extermínio; aniquilação
  rationale: “Destruição” mantém a força do termo sem acrescentar uma precisão totalizante que o contexto imediato não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo o paralelismo, a personificação de Babilônia e a metáfora concreta da vassoura. O travessão destaca naturalmente a fórmula profética final.
