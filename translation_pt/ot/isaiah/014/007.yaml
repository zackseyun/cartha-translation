    issue: «todos» torna explícito o sujeito de פָּצְחוּ.
    rationale: O verbo hebraico está no plural, mas não traz sujeito expresso. «Todos» o interpreta como a totalidade dos habitantes da terra; embora plausível no contexto, essa especificação não está no texto e reduz sua elipse poética.
  - severity: low
    issue: «cânticos de alegria» pluraliza e estreita רִנָּה.
    rationale: O substantivo hebraico é singular e pode denotar um clamor ou canto jubiloso. Uma formulação singular/coletiva preserva melhor essa flexibilidade.
  revised_text: Toda a terra descansa e está tranquila; irrompem em canto jubiloso.
