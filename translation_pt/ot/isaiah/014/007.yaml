  text: נָ֥חָה שָׁקְטָ֖ה כָּל הָ/אָ֑רֶץ פָּצְח֖וּ רִנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/007.yaml
  text: All the earth is at rest and quiet[a]; they break out in singing.
translation:
  language: pt
  text: Toda a terra descansa e está tranquila; irrompem em canto jubiloso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָחָה
  choice: descansa
  rationale: O perfeito qal feminino singular descreve o estado resultante de repouso da terra; o presente em português comunica naturalmente esse estado no contexto poético.
- source_word: שָׁקְטָה
  choice: tranquila
  rationale: 'O verbo, coordenado com נָחָה, indica quietude e ausência de perturbação. O adjetivo predicativo produz em português uma formulação concisa e natural: “descansa tranquila”.'
- source_word: כָּל הָאָרֶץ
  choice: Toda a terra
  rationale: Embora אֶרֶץ também possa significar “terra” no sentido de território ou país, כָּל e o alcance do cântico favorecem aqui a referência abrangente à terra inteira.
- source_word: פָּצְחוּ
  choice: irrompem
  rationale: O verbo expressa o início súbito e vigoroso de um som; “irrompem” preserva essa força ingressiva em linguagem poética atual.
- source_word: רִנָּה
  choice: em cânticos de alegria
  rationale: O substantivo designa um brado ressoante, frequentemente jubiloso. “Cânticos de alegria” torna explícita a nuance festiva sem limitar a expressão a um único cântico.
theological_decisions:
- issue: Sujeito implícito de פָּצְחוּ, verbo no plural
  choice: todos
  alternative: eles
  rationale: O hebraico muda de “toda a terra”, singular, para um verbo plural sem sujeito expresso. “Todos” preserva a referência coletiva natural aos habitantes da terra sem identificar um grupo teológico específico.
translation_notes:
  register: Português moderno, digno e poético, com ampla legibilidade brasileira. A aliteração e a concisão do hebraico são refletidas por “descansa tranquila”; a segunda oração mantém a mudança para o plural presente no texto-fonte.
