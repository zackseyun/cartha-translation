  text: וְ/הָיָ֗ה בְּ/י֨וֹם הָנִ֤יחַ יְהוָה֙ לְ/ךָ֔ מֵֽ/עָצְבְּ/ךָ֖ וּ/מֵ/רָגְזֶ֑/ךָ וּ/מִן הָ/עֲבֹדָ֥ה הַ/קָּשָׁ֖ה אֲשֶׁ֥ר עֻבַּד בָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/003.yaml
  text: And it shall be[a], in the day when Yahweh gives you rest from your pain and your turmoil, and from the hard service with which you were made to serve[b],
translation:
  language: pt
  text: E acontecerá que, no dia em que Yahweh lhe der descanso da sua dor[a], da sua inquietação e do trabalho pesado que lhe foi imposto[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do seu sofrimento” ou “da sua tristeza”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da dura servidão que lhe foi imposta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Reproduz a fórmula profética que introduz uma circunstância futura, em português natural e digno.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Conserva a imagem temporal do hebraico e funciona naturalmente como introdução da oração temporal.
- source_word: הָנִיחַ
  choice: lhe der descanso
  rationale: 'Expressa o valor causativo do hifil de נוח: conceder descanso ou alívio a alguém.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵעָצְבְּךָ
  choice: da sua dor
  rationale: עצב pode indicar dor, sofrimento ou tristeza; “dor” mantém a abrangência da aflição sem limitá-la ao aspecto emocional.
- source_word: וּמֵרָגְזֶךָ
  choice: da sua inquietação
  rationale: רגז comunica agitação, perturbação ou desassossego; “inquietação” abrange a instabilidade interior e circunstancial.
- source_word: הָעֲבֹדָה הַקָּשָׁה
  choice: do trabalho pesado
  rationale: Traduz de modo claro o labor severo e opressivo, sem especificar além do texto uma forma jurídica particular de escravidão.
- source_word: אֲשֶׁר עֻבַּד בָּךְ
  choice: a que você foi submetido
  rationale: Torna explícito o sentido passivo e coercivo da construção com עבד e ב, ao mesmo tempo que evita uma reprodução pouco natural como “que foi trabalhado em você”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome próprio da aliança sem substituí-lo por “SENHOR”.
- issue: Natureza do trabalho imposto
  choice: trabalho pesado a que você foi submetido
  alternative: servidão dura em que você foi obrigado a servir
  rationale: A tradução conserva a coerção do passivo hebraico, mas não define além do que o versículo afirma a condição social ou jurídica exata do destinatário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega “você” apenas na oração passiva para tornar inequívoco o destinatário singular; mantém a vírgula final porque o versículo introduz a continuação sintática do versículo seguinte.
