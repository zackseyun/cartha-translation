id: ISA.14.27
reference: Isaiah 14:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי יְהוָ֧ה צְבָא֛וֹת יָעָ֖ץ וּ/מִ֣י יָפֵ֑ר וְ/יָד֥/וֹ הַ/נְּטוּיָ֖ה וּֽ/מִ֥י יְשִׁיבֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/027.yaml
  text: For Yahweh of hosts has purposed[a], and who can annul it? His hand is stretched out[b], and who can turn it back?
translation:
  language: pt
  text: Pois Yahweh dos Exércitos traçou seu plano; quem poderá anulá-lo[a]? Sua mão está estendida[b]; quem poderá fazê-la recuar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “frustrá-lo?” O verbo hebraico pode significar quebrar, invalidar ou impedir a realização de um plano.'
    reason: lexical_alternative
  - marker: b
    text: A imagem da mão estendida comunica poder em ação, muitas vezes em julgamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a declaração anterior e preserva o encadeamento argumentativo do hebraico.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz o título צְבָאוֹת de modo tradicional, amplo e compreensível, sem restringi-lo apenas a exércitos humanos.
- source_word: יָעָץ
  choice: traçou seu plano
  rationale: O verbo expressa deliberar, decidir ou formular um propósito. A formulação explicita em português o plano implícito que serve de objeto à pergunta seguinte.
- source_word: יָפֵר
  choice: anulá-lo
  rationale: O hifil de פרר pode significar quebrar, invalidar ou frustrar. “Anular” conserva a ideia de tornar sem efeito o plano de Yahweh.
- source_word: יָדוֹ הַנְּטוּיָה
  choice: Sua mão está estendida
  rationale: Preserva a imagem antropomórfica hebraica da mão estendida, símbolo de poder em ação.
- source_word: יְשִׁיבֶנָּה
  choice: fazê-la recuar
  rationale: O hifil de שוב com sufixo feminino retoma “mão” e expressa fazê-la voltar ou retirar-se.
theological_decisions:
- issue: Tradução do título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos
  rationale: O texto hebraico emprega diretamente o nome יהוה. A tradução conserva o nome pessoal como “Yahweh” e mantém a amplitude do título “dos Exércitos”.
- issue: Força da imagem da mão estendida
  choice: Preservar a metáfora sem explicá-la no corpo do versículo
  alternative: Parafrasear como poder de Deus em ação ou julgamento
  rationale: A imagem pode indicar intervenção poderosa, frequentemente em juízo, mas o texto não explicita aqui todos esses elementos; por isso, a tensão imagética é mantida e esclarecida apenas em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura retórica das duas perguntas foi preservada, assim como a metáfora da mão estendida.
