  text: who made the world like a wilderness and tore down its cities[a], who did not open the house for his prisoners?
translation:
  language: pt
  text: que transformou o mundo num deserto, arrasou suas cidades e não abriu para seus prisioneiros o caminho de volta para casa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “não abriu para casa”, com “casa” em forma direcional. A expressão elíptica pode significar: “não abriu para seus prisioneiros o caminho de volta para casa”.'
    reason: A nota preserva a construção incomum do hebraico e esclarece que “o caminho” é uma explicitação necessária em português.
lexical_decisions:
- source_word: שָׂם
  choice: transformou
  rationale: O qal perfeito de שׂים, seguido da comparação, expressa o resultado produzido pelo tirano. “Transformou” comunica naturalmente em português que ele fez o mundo ficar como um deserto.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תבל designa o mundo habitado. “O mundo” é claro, corrente e preserva a amplitude da denúncia poética.
- source_word: כַּמִּדְבָּר
  choice: num deserto
  rationale: A preposição כ marca comparação. Em português, “transformou o mundo num deserto” transmite idiomaticamente “fez o mundo como um deserto”, sem restringir necessariamente a imagem a dunas de areia.
- source_word: וְעָרָיו
  choice: suas cidades
  rationale: O sufixo masculino singular retoma o mundo ou domínio mencionado. “Suas cidades” preserva a forma do hebraico e, no contexto, refere-se naturalmente às cidades desse mundo.
- source_word: הָרָס
  choice: arrasou
  rationale: הרס descreve derrubar ou destruir. “Arrasou” mantém a força concreta da devastação de cidades e é natural em português.
- source_word: אֲסִירָיו
  choice: seus prisioneiros
  rationale: אסיריו se refere aos que estavam presos ou mantidos em cativeiro pelo tirano. “Seus prisioneiros” é uma correspondência direta e clara.
- source_word: לֹא פָתַח בָּיְתָה
  choice: não deixou ... voltar para casa
  rationale: ביתה contém o ה direcional e significa “para casa”. Embora פתח signifique literalmente “abrir”, a construção elíptica comunica que ele não abriu a saída ou o caminho para que os prisioneiros fossem para casa. A formulação escolhida expressa esse sentido em português natural, enquanto a nota preserva a imagem literal.
