  text: וּ/לְקָח֣וּ/ם עַמִּים֮ וֶ/הֱבִיא֣וּ/ם אֶל מְקוֹמָ/ם֒ וְ/הִֽתְנַחֲל֣וּ/ם בֵּֽית יִשְׂרָאֵ֗ל עַ֚ל אַדְמַ֣ת יְהוָ֔ה לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָח֑וֹת וְ/הָיוּ֙ שֹׁבִ֣ים לְ/שֹֽׁבֵי/הֶ֔ם וְ/רָד֖וּ בְּ/נֹגְשֵׂי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/002.yaml
  text: Peoples will take them and bring them to their place[a], and the house of Israel will possess them on the land of Yahweh as male slaves and female slaves. They will become captors of their captors[d][c][b], and they will rule over their oppressors.
translation:
  language: pt
  text: Povos os tomarão e os levarão ao lugar deles, e a casa de Israel tomará posse deles na terra de Yahweh, como escravos e escravas.[a] Eles levarão cativos os que os haviam levado cativos[b] e dominarão os seus opressores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como escravos e escravas”; o texto menciona explicitamente ambos os sexos.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico repete a mesma raiz para “levar cativo”, criando um jogo de palavras que enfatiza a inversão de papéis. Também se pode traduzir: “Eles se tornarão captores dos seus captores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקָחוּם עַמִּים
  choice: Povos os tomarão
  rationale: Mantém o sentido comum de לקח, “tomar”, e o plural étnico de עַמִּים, sem sugerir necessariamente Estados nacionais modernos.
- source_word: וֶהֱבִיאוּם אֶל־מְקוֹמָם
  choice: e os levarão ao lugar deles
  rationale: Expressa o movimento até o lugar pertencente a Israel; “levarão” é natural em português com esse ponto de vista narrativo.
- source_word: וְהִתְנַחֲלוּם
  choice: tomará posse deles
  rationale: Comunica o sentido de adquirir como posse ou herança e preserva o sufixo pronominal que faz das pessoas o objeto do verbo.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Conserva a expressão coletiva e pactual do hebraico.
- source_word: עַל אַדְמַת יְהוָה
  choice: na terra de Yahweh
  rationale: “Na terra” é idiomático em português, enquanto “de Yahweh” preserva a afirmação de pertença e verte diretamente o nome divino.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: como escravos e escravas
  rationale: Não suaviza a condição de escravidão e reproduz de modo natural a distinção explícita de sexo no hebraico.
- source_word: וְהָיוּ שֹׁבִים לְשֹׁבֵיהֶם
  choice: Eles levarão cativos os que os haviam levado cativos
  rationale: Preserva a repetição intencional da raiz שבה e torna clara, em português corrente, a inversão entre cativos e captores.
- source_word: וְרָדוּ בְּנֹגְשֵׂיהֶם
  choice: e dominarão os seus opressores
  rationale: “Dominar” expressa רדה com força, e “opressores” representa o alcance contextual de נגשׂ sem restringi-lo a feitores.
theological_decisions:
- issue: A inversão social em que Israel possui pessoas como escravos
  choice: Traduzir diretamente a linguagem de escravidão e domínio
  alternative: Empregar “servos e servas” ou parafrasear como sujeição geral
  rationale: O hebraico descreve explicitamente escravos e escravas. A tradução deve conservar a dureza e a tensão ética da imagem sem justificá-la nem suavizá-la.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Forma da inversão entre captores e cativos
  choice: Eles levarão cativos os que os haviam levado cativos
  alternative: Eles se tornarão captores dos seus captores
  rationale: A opção escolhida conserva o jogo de palavras da mesma raiz hebraica e comunica com clareza a anterioridade da captura sofrida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “casa de Israel”, “Yahweh” e a linguagem explícita de escravidão. Os marcadores [a] e [b] aparecem no texto principal em ordem.
