base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/016.yaml
  text: 'Those who see you will stare at you; they will look closely at you: ‘Is this the man who made the earth tremble[a], who shook kingdoms,’'
translation:
  language: pt
  text: 'Os que te virem olharão fixamente para ti e te examinarão com atenção[a]: “É este o homem que fazia a terra tremer, que abalava reinos,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “refletirão sobre ti” ou “te observarão atentamente”. O verbo hebraico pode indicar exame ou consideração cuidadosa, e não apenas o ato físico de olhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאֶיךָ
  choice: os que te virem
  rationale: O particípio qal plural com sufixo de segunda pessoa funciona substantivamente. Em português, a construção com futuro do subjuntivo expressa com naturalidade “os que te virem” e preserva o discurso direto.
- source_word: אֵלֶיךָ יַשְׁגִּיחוּ
  choice: olharão fixamente para ti
  rationale: O hifil de שׁגח indica um olhar dirigido e atento; “olharão fixamente” comunica a intensidade e o espanto da cena.
- source_word: אֵלֶיךָ יִתְבּוֹנָנוּ
  choice: te examinarão com atenção
  rationale: A forma reflexiva/intensiva de בין sugere observação cuidadosa ou consideração. A escolha mantém a progressão do olhar para o exame atento, sem excluir a dimensão reflexiva.
- source_word: הֲזֶה הָאִישׁ
  choice: É este o homem
  rationale: A partícula interrogativa com o demonstrativo introduz uma pergunta de espanto, enquanto אִישׁ designa explicitamente um homem.
- source_word: מַרְגִּיז הָאָרֶץ
  choice: que fazia a terra tremer
  rationale: O particípio causativo indica alguém que fazia a terra estremecer. O imperfeito português apresenta essa ação como característica da atuação passada do tirano.
- source_word: מַרְעִישׁ מַמְלָכוֹת
  choice: que abalava reinos
  rationale: O particípio hifil de רעשׁ exprime causar abalo. “Abalava reinos” é conciso, natural e mantém o paralelismo com a oração anterior.
theological_decisions:
- issue: Referente de “o homem” na zombaria
  choice: Traduzir diretamente como um governante humano
  alternative: Identificá-lo no texto principal com Satanás/Lúcifer ou com uma figura simultaneamente humana e cósmica
  rationale: O hebraico deste versículo diz “o homem”, e o contexto literário imediato apresenta uma zombaria contra o rei da Babilônia. A tradução não deve inserir na redação uma identificação teológica posterior.
translation_notes:
  register: Português atual, digno e amplamente compreensível. O uso de “te/ti” mantém de modo claro e econômico a segunda pessoa masculina singular repetida no hebraico. A pontuação final preserva a continuidade da pergunta no versículo seguinte.
