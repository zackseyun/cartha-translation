id: ISA.14.22
reference: Isaiah 14:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/קַמְתִּ֣י עֲלֵי/הֶ֔ם נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/הִכְרַתִּ֨י לְ/בָבֶ֜ל שֵׁ֥ם וּ/שְׁאָ֛ר וְ/נִ֥ין וָ/נֶ֖כֶד נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/022.yaml
  text: And I will rise up against them[a], declares Yahweh of Armies, and I will cut off from Babylon name and remnant, offspring and posterity[b], declares Yahweh.
translation:
  language: pt
  text: Levantarei-me contra eles — declara Yahweh dos Exércitos[a] — e eliminarei da Babilônia nome e remanescente, descendência e posteridade[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “SENHOR dos Exércitos”.
    reason: lexical_alternative
  - marker: b
    text: A sequência “nome e remanescente, descendência e posteridade” é uma expressão abrangente para o apagamento da memória da Babilônia e de toda a sua linhagem sobrevivente.
    reason: cultural_note
lexical_decisions:
- source_word: וְקַמְתִּי
  choice: Eu me levantarei
  rationale: O perfeito qal com וְ em discurso profético tem valor futuro. A expressão preserva a imagem hebraica da intervenção ativa de Yahweh.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: Com קום neste contexto de juízo, עַל tem sentido adversativo; “contra eles” é claro e natural em português.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara Yahweh dos Exércitos
  rationale: “Declara” comunica naturalmente a fórmula profética נְאֻם; o nome divino é representado como “Yahweh”, e צְבָאוֹת como “Exércitos”, preservando a força marcial do título.
- source_word: וְהִכְרַתִּי
  choice: e eliminarei
  rationale: O hifil de כרת indica remover ou exterminar. “Eliminarei” expressa o juízo total em português corrente sem introduzir uma imagem física inadequada.
- source_word: לְבָבֶל
  choice: da Babilônia
  rationale: 'Após הִכְרִית, o לְ tem efeito privativo: aquilo que será removido da Babilônia.'
- source_word: שֵׁם
  choice: nome
  rationale: Mantém a concisão do hebraico e permite os sentidos associados de identidade, memória e continuidade.
- source_word: שְׁאָר
  choice: remanescente
  rationale: Designa o que resta ou sobrevive; aqui, diferentemente de certos usos teológicos positivos, integra uma declaração de erradicação completa.
- source_word: נִין
  choice: descendência
  rationale: Refere-se à prole ou linhagem e forma, com נֶכֶד, uma expressão abrangente sobre continuidade familiar.
- source_word: נֶכֶד
  choice: posteridade
  rationale: Evita restringir o termo a uma geração específica e comunica a linhagem futura em paralelo com “descendência”.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A repetição da fórmula profética ao final foi mantida por sua ênfase e solenidade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual e evita substituí-lo silenciosamente por um título.
- issue: Sentido do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos Poderes
  rationale: “Dos Exércitos” traduz de modo transparente o domínio de Yahweh sobre as forças celestiais e terrenas, mantendo a força judicial e marcial sem limitar explicitamente o referente.
- issue: Alcance da sequência שֵׁם וּשְׁאָר וְנִין וָנֶכֶד
  choice: 'manter os quatro termos: “nome e remanescente, descendência e posteridade”'
  alternative: parafrasear como “toda memória e toda a linhagem sobrevivente”
  rationale: A formulação cumulativa hebraica comunica extinção abrangente. A tradução conserva sua tensão poética, enquanto a nota explica o efeito global sem apagar os elementos individuais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões destacam as duas fórmulas proféticas sem alterar sua posição retórica. A concisão e o paralelismo da enumeração hebraica foram preservados.
