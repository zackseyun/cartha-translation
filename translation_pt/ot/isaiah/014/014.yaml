source:
  edition: WLC
  text: אֶעֱלֶ֖ה עַל בָּ֣מֳתֵי עָ֑ב אֶדַּמֶּ֖ה לְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/014.yaml
  text: I will ascend above the heights of the clouds[a]; I will make myself like the Most High.
translation:
  language: pt
  text: Subirei acima das alturas das nuvens; farei-me semelhante ao Altíssimo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: Subirei
  rationale: O qal imperfeito na primeira pessoa do singular de עלה expressa movimento para cima; “subirei” preserva com naturalidade o sentido de ascensão e exaltação.
- source_word: עַל
  choice: acima de
  rationale: Com o verbo de subida e a expressão seguinte, a preposição indica elevação que ultrapassa as alturas das nuvens, não apenas posição sobre elas.
- source_word: בָּמֳתֵי עָב
  choice: as alturas das nuvens
  rationale: O plural construto de בָּמָה com עָב retrata as regiões elevadas das nuvens; a formulação mantém a imagem e é natural em português.
- source_word: אֶדַּמֶּה
  choice: farei de mim semelhante
  rationale: A forma hitpael de דמה comunica a ideia reflexiva de tornar-se ou fazer-se comparável; “farei de mim semelhante” explicita essa nuance sem eliminar a possibilidade de entender “serei semelhante”.
- source_word: לְעֶלְיוֹן
  choice: ao Altíssimo
  rationale: עֶלְיוֹן funciona aqui como título divino. “Altíssimo” é a forma consagrada e clara em português.
theological_decisions:
- issue: Interpretação de עֶלְיוֹן como título divino
  choice: ao Altíssimo
  alternative: ao mais elevado
  rationale: O contexto apresenta a pretensão de alcançar condição divina. O título “Altíssimo” preserva essa força teológica sem acrescentar identificações doutrinárias posteriores.
- issue: Nuance reflexiva de אֶדַּמֶּה
  choice: farei de mim semelhante
  alternative: serei semelhante
  rationale: A opção principal torna perceptível a forma reflexiva e a pretensão deliberada do falante, enquanto a alternativa mais simples permanece lexicalmente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A construção conserva o paralelismo e o tom elevado da declaração arrogante. Não se acrescentou nota porque a alternativa lexical não é necessária para compreender o verso, e a formulação principal já preserva a nuance reflexiva.
