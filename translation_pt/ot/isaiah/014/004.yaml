base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/004.yaml
  text: 'you will take up this taunt against the king of Babylon[a], and say: “How the oppressor has ceased, the insolence has ceased!”'
translation:
  language: pt
  text: 'você entoará esta sátira contra o rei da Babilônia e dirá: “Como cessou o opressor! Como cessou a tirania![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido do termo hebraico é incerto. Também pode ser traduzido por “arrogância”, “investida” ou “cobrança opressiva”; tradicionalmente, foi entendido como “cidade dourada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂאתָ
  choice: você entoará
  rationale: Com מָשָׁל, o verbo נשׂא forma uma expressão idiomática para iniciar ou proferir uma composição; “entoará” é natural em português e se ajusta ao caráter poético da sátira.
- source_word: הַמָּשָׁל הַזֶּה
  choice: esta sátira
  rationale: מָשָׁל pode designar provérbio, dito figurado ou composição de escárnio. Neste contexto, introduz uma fala poética que ridiculariza a queda do rei da Babilônia; “sátira” comunica essa função.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: contra o rei da Babilônia
  rationale: A preposição עַל pode significar “sobre” ou “contra”; o teor hostil da composição favorece “contra”.
- source_word: אֵיךְ
  choice: Como
  rationale: Introduz uma exclamação enfática de espanto e escárnio. A repetição de “Como” explicita em português o paralelismo exclamativo.
- source_word: שָׁבַת / שָׁבְתָה
  choice: cessou / acabou
  rationale: Ambas as formas vêm da mesma raiz, “cessar”. A leve variação verbal produz português corrente sem perder o paralelismo semântico.
- source_word: נֹגֵשׂ
  choice: o opressor
  rationale: O particípio substantivado refere-se a quem pressiona, exige tributo ou oprime; “opressor” é amplo, claro e adequado ao domínio imperial.
- source_word: מַדְהֵבָה
  choice: a tirania
  rationale: O termo é raro e incerto. Uma provável relação com a imposição opressiva favorece “tirania”, que também forma um paralelo coerente com “opressor”; outras interpretações são registradas em nota.
theological_decisions:
- issue: Sentido do termo raro מַדְהֵבָה
  choice: a tirania
  alternative: a cidade dourada; a arrogância; a investida; a cobrança opressiva
  rationale: A questão é lexical, não doutrinária. O contexto e possíveis associações com opressão ou exação favorecem “tirania”, mas a raridade do vocábulo impede certeza; por isso, a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com ritmo poético. “Entoará esta sátira” representa naturalmente a expressão hebraica, enquanto a repetição exclamativa de “Como” reforça o paralelismo. O marcador [a] aparece no texto junto ao termo lexicalmente incerto.
