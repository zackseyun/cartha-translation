  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/נִּשְׁאָ֣ר בְּ/צִיּ֗וֹן וְ/הַ/נּוֹתָר֙ בִּ/יר֣וּשָׁלִַ֔ם קָד֖וֹשׁ יֵאָ֣מֶר ל֑/וֹ כָּל הַ/כָּת֥וּב לַ/חַיִּ֖ים בִּ/ירוּשָׁלִָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/003.yaml
  text: And it shall be that whoever remains in Zion and whoever is left in Jerusalem will be called holy—everyone who is recorded for life in Jerusalem[a][b].
translation:
  language: pt
  text: E acontecerá que todo aquele que restar em Sião e todo aquele que ficar em Jerusalém será chamado santo — todo aquele que estiver registrado para a vida em Jerusalém[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo aquele que estiver inscrito entre os vivos em Jerusalém”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “registrado para a vida” pode aludir a um registro oficial dos que foram poupados para continuar vivos; ela também evoca o tema bíblico mais amplo de pessoas inscritas no livro da vida de Deus.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Reproduz de modo natural e digno a fórmula profético-futura hebraica, sem enfraquecer sua orientação para o futuro.
- source_word: הַנִּשְׁאָר
  choice: todo aquele que restar
  rationale: O particípio nifal de שׁאר designa quem permanece ou sobrevive. A formulação mantém a força genérica e a ideia de remanescente.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: Conserva o topônimo e seu peso geográfico e teológico.
- source_word: וְהַנּוֹתָר
  choice: e todo aquele que ficar
  rationale: Mantém o paralelismo sinonímico com o primeiro particípio, empregando variação portuguesa natural sem apagar a noção de sobrevivência.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Tradução locativa direta do nome próprio.
- source_word: קָדוֹשׁ
  choice: santo
  rationale: É o equivalente corrente e teologicamente significativo, indicando consagração, não apenas algo genericamente sagrado.
- source_word: יֵאָמֶר לוֹ
  choice: será chamado
  rationale: 'Expressa idiomaticamente o nifal de אמר com לֹו e preserva a designação predicativa: essa pessoa será reconhecida ou denominada santa.'
- source_word: כָּל
  choice: todo aquele
  rationale: Introduz naturalmente em português a explicação em aposição, com referência distributiva a cada integrante do remanescente.
- source_word: הַכָּתוּב
  choice: que estiver registrado
  rationale: O particípio passivo de כתב sugere inscrição em um registro. “Registrado” é moderno e claro sem determinar de forma excessiva a natureza desse registro.
- source_word: לַחַיִּים
  choice: para a vida
  rationale: Preserva a expressão compacta e ambígua do hebraico, que pode indicar inscrição destinada à vida ou inclusão entre os vivos.
- source_word: בִּירוּשָׁלִַם
  choice: em Jerusalém
  rationale: Mantém a expressão locativa final ligada à linguagem de registro.
theological_decisions:
- issue: Se o versículo se refere apenas a sobreviventes físicos ou a um remanescente santificado e marcado por Deus
  choice: O texto principal mantém juntas a sobrevivência, a santidade e a inscrição para a vida.
  alternative: Entender a frase exclusivamente como um cadastro histórico de sobreviventes ou, no outro extremo, identificá-la explicitamente com a formulação posterior do livro da vida.
  rationale: O hebraico une a linguagem de remanescente à designação “santo” e ao registro para a vida. A tradução preserva essa tensão sem reduzir a passagem a apenas uma dessas dimensões.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Todo aquele” conserva a referência genérica dos particípios hebraicos; a repetição sustenta o paralelismo. “Para a vida” mantém deliberadamente a ambiguidade do original.
