  text: וְ/הֶחֱזִיקוּ֩ שֶׁ֨בַע נָשִׁ֜ים בְּ/אִ֣ישׁ אֶחָ֗ד בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר לַחְמֵ֣/נוּ נֹאכֵ֔ל וְ/שִׂמְלָתֵ֖/נוּ נִלְבָּ֑שׁ רַ֗ק יִקָּרֵ֤א שִׁמְ/ךָ֙ עָלֵ֔י/נוּ אֱסֹ֖ף חֶרְפָּתֵֽ/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/001.yaml
  text: And seven women will take hold of one man in that day[a], saying, “We will eat our own bread and wear our own clothing; only let your name be called over us[b]. Take away our reproach.”
translation:
  language: pt
  text: 'Naquele dia, sete mulheres se agarrarão a um só homem e dirão: “Comeremos do nosso próprio pão e vestiremos nossas próprias roupas; apenas deixe que o seu nome seja chamado sobre nós[a]. Tire de nós a nossa desonra[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixe que sejamos chamadas pelo seu nome”. A expressão provavelmente implica casamento ou algum vínculo legal e social com o homem.'
    reason: lexical_alternative
  - marker: b
    text: “Desonra” indica vergonha ou desprestígio social; neste contexto, provavelmente se refere ao estigma de não ter o nome e a posição social de um marido depois da devastação descrita anteriormente.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶחֱזִיקוּ
  choice: se agarrarão
  rationale: O hifil de חזק com ב expressa tomar ou segurar firmemente. “Se agarrarão” conserva a força e a iniciativa urgente das mulheres sem sugerir necessariamente violência.
- source_word: שֶׁבַע נָשִׁים
  choice: sete mulheres
  rationale: Tradução direta do numeral com o substantivo; “mulheres”, e não “esposas”, evita antecipar a relação conjugal apenas implícita no pedido.
- source_word: בְּאִישׁ אֶחָד
  choice: a um só homem
  rationale: A preposição ב marca aquilo a que elas se agarram. “Um só homem” ressalta naturalmente, em português, o contraste entre as sete mulheres e o único homem.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Reproduz a fórmula profética hebraica em português natural.
- source_word: לֵאמֹר
  choice: e dirão
  rationale: Introduz o discurso direto de modo idiomático; o futuro acompanha a forma verbal principal e o contexto profético.
- source_word: לַחְמֵנוּ נֹאכֵל
  choice: Comeremos do nosso próprio pão
  rationale: O sufixo possessivo significa “nosso pão”; “próprio” explicita a ênfase contextual de que elas proverão o próprio alimento.
- source_word: וְשִׂמְלָתֵנוּ נִלְבָּשׁ
  choice: vestiremos nossas próprias roupas
  rationale: “Roupas” comunica o sentido coletivo de שִׂמְלָה em português corrente, e “próprias” mantém o paralelismo enfático com o pão.
- source_word: רַק
  choice: apenas
  rationale: 'Marca a limitação do pedido: elas solicitam somente a associação ao nome do homem.'
- source_word: יִקָּרֵא שִׁמְךָ עָלֵינוּ
  choice: deixe que o seu nome seja chamado sobre nós
  rationale: Conserva a imagem da construção hebraica no texto principal, sem explicitar como casamento aquilo que o original deixa implícito.
- source_word: אֱסֹף
  choice: Tire de nós
  rationale: Embora אָסַף tenha o sentido básico de reunir, neste uso significa remover ou levar embora. A formulação escolhida é natural com o objeto “desonra”.
- source_word: חֶרְפָּתֵנוּ
  choice: a nossa desonra
  rationale: “Desonra” preserva a dimensão pública e social do termo, sem restringi-lo a um sentimento interior nem determinar uma única causa.
theological_decisions:
- issue: Vínculo conjugal ou social implícito em “seu nome seja chamado sobre nós”
  choice: Manter no texto a expressão hebraica, com esclarecimento em nota.
  alternative: “Sejamos chamadas pelo seu nome” ou “case-se conosco”.
  rationale: A frase provavelmente indica que as mulheres passariam a estar vinculadas ao nome e à posição social do homem, possivelmente pelo casamento, mas não emprega o verbo hebraico comum para casar. A tradução preserva essa ambiguidade.
- issue: Sentido específico de חֶרְפָּה
  choice: Traduzir de modo geral como “desonra”.
  alternative: “A desonra de não ter marido” ou “a vergonha de não ter filhos”.
  rationale: O contexto sugere estigma social relacionado à ausência de marido, nome familiar ou descendência após a devastação, mas o versículo não identifica uma única causa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem inicial “Naquele dia” preserva a fórmula profética; a expressão incomum “seu nome seja chamado sobre nós” foi mantida deliberadamente para conservar a imagem e a ambiguidade do hebraico, com explicação em nota.
