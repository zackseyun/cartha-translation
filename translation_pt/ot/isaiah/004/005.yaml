id: ISA.4.5
reference: Isaiah 4:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָרָ֣א יְהוָ֡ה עַל֩ כָּל מְכ֨וֹן הַר צִיּ֜וֹן וְ/עַל מִקְרָאֶ֗/הָ עָנָ֤ן יוֹמָם֙ וְ/עָשָׁ֔ן וְ/נֹ֛גַהּ אֵ֥שׁ לֶהָבָ֖ה לָ֑יְלָה כִּ֥י עַל כָּל כָּב֖וֹד חֻפָּֽה־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/005.yaml
  text: Then Yahweh will create over the whole site of Mount Zion and over her assemblies a cloud by day[a], and smoke, and the brightness of a flaming fire by night[d][c][b]; for over all the glory there will be a canopy.
translation:
  language: pt
  text: Então Javé criará sobre todo lugar do monte Sião e sobre as suas assembleias[a] uma nuvem de dia, fumaça e o brilho de um fogo em chamas à noite[b][c]; pois haverá um dossel[d] sobre toda a glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas convocações”. O termo hebraico pode designar assembleias marcadas ou reuniões para as quais o povo foi convocado.
    reason: lexical_alternative
  - marker: b
    text: Ou “o clarão de um fogo ardente à noite”.
    reason: lexical_alternative
  - marker: c
    text: A imagem lembra a nuvem e o fogo de Javé no deserto (por exemplo, Êxodo 13:21–22).
    reason: cross_reference
  - marker: d
    text: Ou “uma cobertura”. O termo hebraico também pode designar um dossel nupcial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָא
  choice: Então ... criará
  rationale: O perfeito qal com conjunção, no contexto profético de restauração, expressa naturalmente uma promessa futura. “Criará” preserva a força específica de ברא, e “então” comunica a progressão do discurso.
- source_word: יְהוָה
  choice: Javé
  rationale: Forma corrente em português para representar diretamente o nome divino, em vez de substituí-lo por um título.
- source_word: מְכוֹן
  choice: lugar
  rationale: O substantivo indica um local fixo ou estabelecido. “Lugar” é natural e compreensível, sem impor a interpretação mais específica de “morada” ou “fundamento”.
- source_word: הַר צִיּוֹן
  choice: monte Sião
  rationale: Forma consagrada e natural do topônimo em português.
- source_word: מִקְרָאֶיהָ
  choice: as suas assembleias
  rationale: מִקְרָא pode designar reuniões convocadas ou assembleias. O sufixo feminino singular remete a Sião. “Assembleias” é claro e preserva a dimensão comunitária.
- source_word: עָנָן יוֹמָם
  choice: uma nuvem de dia
  rationale: Tradução direta que conserva a imagem e sua possível evocação da presença divina no deserto.
- source_word: וְעָשָׁן
  choice: fumaça
  rationale: Mantém a fumaça como elemento visível distinto na sequência de manifestações, sem fundi-la com a nuvem.
- source_word: וְנֹגַהּ אֵשׁ לֶהָבָה לָיְלָה
  choice: e o brilho de um fogo em chamas à noite
  rationale: “Brilho” representa נֹגַהּ, enquanto “fogo em chamas” conserva a ideia de לֶהָבָה sem reduzir a expressão simplesmente a “fogo”.
- source_word: כִּי
  choice: pois
  rationale: Introduz com naturalidade em português a explicação que fundamenta a imagem anterior.
- source_word: כָּבוֹד
  choice: a glória
  rationale: Preserva o termo teologicamente expressivo sem especificar se se trata da presença gloriosa de Deus, da honra de Sião ou de ambas.
- source_word: חֻפָּה
  choice: um dossel
  rationale: “Dossel” mantém a imagem concreta de uma cobertura elevada e protetora, além de permitir, sem impor, a possível conotação nupcial do termo hebraico.
theological_decisions:
- issue: Aspecto profético de וּבָרָא
  choice: promessa futura (“criará”)
  alternative: narrativa passada (“criou”)
  rationale: O contexto de Isaías 4 apresenta a restauração futura de Sião. O futuro comunica adequadamente o valor profético do perfeito sem transformar a frase em relato passado.
- issue: Possível evocação do êxodo e de uma nova criação
  choice: manter as imagens de nuvem, fumaça e fogo sem explicitar uma interpretação tipológica no texto principal
  alternative: acrescentar “coluna de nuvem” e “coluna de fogo” ou identificar diretamente um cumprimento messiânico ou eclesiológico
  rationale: A linguagem evoca fortemente a manifestação divina no deserto, mas o hebraico não contém aqui a palavra “coluna” nem define explicitamente o cumprimento. A tradução conserva a alusão e deixa sua relação teológica aberta à leitura contextual.
- issue: Referência de כָּבוֹד (“glória”)
  choice: preservar a expressão ampla “toda a glória”
  alternative: explicitar “toda a presença gloriosa de Javé” ou “toda a glória de Sião”
  rationale: O referente exato permanece aberto no hebraico. A formulação literal evita resolver indevidamente a tensão entre a glória divina e a glória associada à Sião restaurada.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das imagens hebraicas foi preservada, mas a pontuação e os artigos foram ajustados à fluência do português. “Javé”, “monte Sião”, “assembleias” e “dossel” mantêm precisão lexical sem linguagem excessivamente técnica.
