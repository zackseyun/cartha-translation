source:
  edition: WLC
  text: וְ/סֻכָּ֛ה תִּהְיֶ֥ה לְ/צֵל יוֹמָ֖ם מֵ/חֹ֑רֶב וּ/לְ/מַחְסֶה֙ וּ/לְ/מִסְתּ֔וֹר מִ/זֶּ֖רֶם וּ/מִ/מָּטָֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/006.yaml
  text: And there will be a shelter for shade by day from heat[c][b][a], and for a refuge and a hiding place from storm and from rain.
translation:
  language: pt
  text: E haverá uma cobertura para dar sombra durante o dia contra o calor, e para servir de refúgio e abrigo contra a tempestade[a] e a chuva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enxurrada” ou “aguaceiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֻכָּה
  choice: cobertura
  rationale: O substantivo designa uma estrutura coberta, muitas vezes temporária. “Cobertura” preserva a imagem concreta e funciona naturalmente no contexto de proteção climática; “cabana” seria possível, mas sugeriria uma construção mais específica.
- source_word: תִּהְיֶה
  choice: haverá
  rationale: Expressa de modo natural em português a existência futura da cobertura, de acordo com o imperfeito hebraico neste contexto.
- source_word: לְצֵל
  choice: para dar sombra
  rationale: Torna explícita, sem exceder o sentido da construção hebraica, a função protetora da cobertura e soa mais natural do que “para sombra”.
- source_word: יוֹמָם
  choice: durante o dia
  rationale: Reproduz claramente o valor adverbial temporal do hebraico em português corrente.
- source_word: מֵחֹרֶב
  choice: contra o calor
  rationale: No contexto de proteção contra as condições do tempo, חֹרֶב indica calor intenso ou abrasador; “calor” mantém uma formulação clara sem intensificação interpretativa desnecessária.
- source_word: מַחְסֶה
  choice: refúgio
  rationale: Conserva a ideia de um lugar de proteção e distingue o termo tanto da cobertura inicial quanto do substantivo seguinte.
- source_word: מִסְתּוֹר
  choice: abrigo
  rationale: Comunica um lugar coberto e protegido. Embora o termo possa envolver ocultação, “esconderijo” seria menos natural para proteção contra intempéries em português.
- source_word: זֶרֶם
  choice: tempestade
  rationale: O termo pode indicar tempestade, enxurrada ou aguaceiro violento. “Tempestade” distingue-o de מָטָר, “chuva”, sem eliminar sua força.
- source_word: מָטָר
  choice: chuva
  rationale: É o sentido normal do substantivo e forma um par climático natural com “tempestade”.
theological_decisions:
- issue: Natureza da imagem protetora
  choice: Traduzir a imagem concreta de uma cobertura que protege das intempéries, sem identificar no texto seu referente teológico posterior.
  alternative: Explicitar a cobertura como Sião, a presença divina ou a proteção messiânica.
  rationale: O hebraico apresenta poeticamente uma proteção contra calor, tempestade e chuva. O contexto mais amplo permite leituras teológicas, mas este versículo não exige que a tradução escolha uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação poética do hebraico foi mantida, evitando tanto arcaísmos quanto explicações teológicas inseridas no corpo do versículo.
