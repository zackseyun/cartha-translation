  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ צֶ֣מַח יְהוָ֔ה לִ/צְבִ֖י וּ/לְ/כָב֑וֹד וּ/פְרִ֤י הָ/אָ֨רֶץ֙ לְ/גָא֣וֹן וּ/לְ/תִפְאֶ֔רֶת לִ/פְלֵיטַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/002.yaml
  text: In that day the branch of Yahweh will be for beauty and for glory[a], and the fruit of the land for majesty and for splendor[b], for the survivors of Israel.
translation:
  language: pt
  text: Naquele dia, o renovo de Yahweh será beleza e glória[a], e o fruto da terra, majestade e esplendor para os sobreviventes de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o crescimento de Yahweh” ou “aquilo que Yahweh faz brotar”. O hebraico pode evocar tanto a fertilidade renovada da terra quanto a imagem profética posterior do “Renovo” de Yahweh.
    reason: alternative_reading
  - marker: b
    text: Ou “o remanescente de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal natural no discurso profético, preservando sua força sem definir indevidamente o momento referido.
- source_word: צֶמַח יְהוָה
  choice: o renovo de Yahweh
  rationale: “Renovo” conserva a imagem concreta de algo que brota e permite tanto a referência à fertilidade restaurada quanto uma possível ressonância régia ou messiânica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, distinguindo-o de títulos como “Senhor”.
- source_word: לִצְבִי וּלְכָבוֹד
  choice: beleza e glória
  rationale: Mantém o paralelismo poético e distingue a atratividade ou formosura de צְבִי da honra e imponência de כָבוֹד.
- source_word: וּפְרִי הָאָרֶץ
  choice: e o fruto da terra
  rationale: “Fruto” preserva a imagem agrícola; “terra” é natural em português e, no contexto, pode designar especificamente a terra de Israel.
- source_word: לְגָאוֹן וּלְתִפְאֶרֶת
  choice: majestade e esplendor
  rationale: O contexto exige o sentido positivo de גָאוֹן, aqui expresso por “majestade”; “esplendor” diferencia תִפְאֶרֶת dos termos anteriores sem perder o registro elevado.
- source_word: לִפְלֵיטַת יִשְׂרָאֵל
  choice: para os sobreviventes de Israel
  rationale: פְלֵיטָה designa os que escaparam ou sobreviveram. “Sobreviventes” é claro no português atual e conserva a referência aos preservados após o juízo.
theological_decisions:
- issue: Se צֶמַח יְהוָה deve ser traduzido de modo a preservar uma possível ressonância messiânica
  choice: o renovo de Yahweh
  alternative: o crescimento de Yahweh; aquilo que Yahweh faz brotar
  rationale: A expressão pode apontar para a restauração fértil da terra ou evocar a figura profética do “Renovo”. O texto principal mantém a metáfora concreta sem usar inicial maiúscula, evitando impor uma interpretação exclusivamente messiânica; a nota registra as alternativas agrícolas.
- issue: Se לִפְלֵיטַת יִשְׂרָאֵל deve empregar a terminologia teológica tradicional de “remanescente”
  choice: para os sobreviventes de Israel
  alternative: para o remanescente de Israel
  rationale: O hebraico se refere aos que escaparam ou sobreviveram. A formulação principal é transparente para leitores atuais, enquanto a nota preserva a alternativa tradicional importante na teologia de Isaías.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção nominal “será beleza e glória” preserva o paralelismo poético e a concisão do hebraico; a elipse de “será” no segundo membro evita repetição pesada sem alterar o sentido.
