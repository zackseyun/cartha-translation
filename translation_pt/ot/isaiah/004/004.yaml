  naturalness: O texto é claro e natural em português moderno. “Imundície” é igualmente compreensível e melhor corresponde ao registro profético. “Espírito abrasador” é mais idiomático do que “espírito de fogo” e conserva melhor o valor do particípio hebraico.
  terminology: “Juízo” é uma opção adequada para מִשְׁפָּט neste contexto. A nota sobre “Espírito”, “vento” e “sopro” preserva corretamente a ambiguidade de רוּחַ. A nota lexical sobre culpa de sangue é pertinente.
