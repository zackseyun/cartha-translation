source:
  edition: WLC
  text: אִ֣ם רָחַ֣ץ אֲדֹנָ֗/י אֵ֚ת צֹאַ֣ת בְּנוֹת צִיּ֔וֹן וְ/אֶת דְּמֵ֥י יְרוּשָׁלִַ֖ם יָדִ֣יחַ מִ/קִּרְבָּ֑/הּ בְּ/ר֥וּחַ מִשְׁפָּ֖ט וּ/בְ/ר֥וּחַ בָּעֵֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/004.yaml
  text: when the Lord has washed away the filth of the daughters of Zion and cleansed the bloodshed of Jerusalem from her midst by a spirit of justice and by a spirit of burning[a][b].
translation:
  language: pt
  text: quando o Senhor tiver lavado a imundície das filhas de Sião e removido do meio dela o sangue derramado em Jerusalém, por um espírito de juízo e por um espírito abrasador[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo Espírito de juízo e pelo Espírito abrasador”. A palavra hebraica também pode significar “vento” ou “sopro”.'
    reason: alternative_reading
  - marker: b
    text: “O sangue derramado” também pode ser traduzido por “a culpa de sangue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: quando
  rationale: No contexto, introduz a ocasião ou condição em que se cumpre a promessa anterior; “quando” comunica isso naturalmente sem sugerir incerteza indevida.
- source_word: רָחַץ
  choice: tiver lavado
  rationale: Preserva a imagem concreta de lavagem e, com a construção futura composta, mantém a relação temporal com o contexto.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino Adonai de modo tradicional e claro, sem tratá-lo como o tetragrama.
- source_word: צֹאַת
  choice: a sujeira
  rationale: Mantém a força da imagem de imundície, em linguagem atual e compreensível, sem recorrer a uma formulação excessivamente clínica.
- source_word: בְּנוֹת צִיּוֹן
  choice: as filhas de Sião
  rationale: Preserva a expressão profética e sua imagem coletiva, evitando substituí-la interpretativamente por “mulheres de Sião”.
- source_word: דְּמֵי יְרוּשָׁלַםִ
  choice: o sangue derramado em Jerusalém
  rationale: O plural hebraico “sangues” pode indicar derramamento de sangue ou culpa de sangue; esta formulação é natural em português e conserva o sentido moral do contexto.
- source_word: יָדִיחַ מִקִּרְבָּהּ
  choice: removido do meio dela
  rationale: Expressa a expulsão purificadora indicada pelo verbo e preserva o sufixo feminino que personifica Jerusalém.
- source_word: בְּרוּחַ
  choice: por um espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro. O artigo indefinido evita identificar de modo explícito o referente com o Espírito Santo, identificação que o hebraico não exige.
- source_word: מִשְׁפָּט
  choice: juízo
  rationale: Neste contexto de purificação punitiva, “juízo” reproduz mais diretamente a dimensão judicial do termo, embora “justiça” também seja possível.
- source_word: בְּרוּחַ בָּעֵר
  choice: por um espírito de fogo
  rationale: Comunica em português natural a força consumidora e purificadora da raiz בער; “de ardor” ou “de queima” seriam mais formais, porém menos idiomáticos.
theological_decisions:
- issue: Sentido de רוּחַ nas expressões paralelas
  choice: “por um espírito de juízo e por um espírito de fogo”
  alternative: “pelo Espírito de juízo e pelo Espírito de fogo” ou “por um vento de juízo e por um sopro abrasador”
  rationale: O hebraico admite espírito, vento ou sopro e não identifica explicitamente o Espírito Santo. A tradução principal mantém a indeterminação, enquanto a nota registra as leituras legítimas.
- issue: Sentido de דְּמֵי יְרוּשָׁלַםִ
  choice: “o sangue derramado em Jerusalém”
  alternative: “a culpa de sangue de Jerusalém”
  rationale: A expressão pode apontar tanto para o sangue resultante da violência quanto para a culpa decorrente dela. A tradução principal usa uma formulação concreta, e a nota preserva a alternativa jurídica e moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se a personificação feminina de Jerusalém, a imagem forte da purificação e a ambiguidade de רוּחַ. Todos os marcadores de nota aparecem no texto principal.
