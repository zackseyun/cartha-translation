  naturalness: O português é claro, atual e de registro profético apropriado. «Suba», «levante a voz» e «não tenha medo» são naturais. «Eis» é levemente elevado, mas corrente e especialmente adequado neste contexto.
  terminology: «Sião», «Jerusalém», «Judá», «boas-novas» e «Deus» estão bem empregados. «Mensageira de boas-novas» conserva o feminino singular do particípio e deixa aberta, com nota, a questão de sua relação sintática com Sião e Jerusalém.
