  text: עַ֣ל הַר גָּבֹ֤הַ עֲלִי לָ/ךְ֙ מְבַשֶּׂ֣רֶת צִיּ֔וֹן הָרִ֤ימִי בַ/כֹּ֨חַ֙ קוֹלֵ֔/ךְ מְבַשֶּׂ֖רֶת יְרוּשָׁלִָ֑ם הָרִ֨ימִי֙ אַל תִּירָ֔אִי אִמְרִי֙ לְ/עָרֵ֣י יְהוּדָ֔ה הִנֵּ֖ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/009.yaml
  text: Go up on a high mountain[a], bearer of good news to Zion; lift up your voice with strength, bearer of good news to Jerusalem; lift it up, do not fear; say to the cities of Judah[b], “Behold your God!”
translation:
  language: pt
  text: 'Suba a um monte alto, mensageira de boas-novas para Sião[a]; levante a voz com força, mensageira de boas-novas para Jerusalém[b]; levante-a, não tenha medo. Diga às cidades de Judá: “Eis o Deus de vocês!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ó Sião, mensageira de boas-novas, suba a um monte alto... Ó Jerusalém, mensageira de boas-novas, levante a voz com força”. O hebraico também permite entender Sião e Jerusalém como as mensageiras diretamente interpeladas.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Você que leva boas-novas a Sião... a Jerusalém”. O particípio feminino pode referir-se à pessoa interpelada, em vez de às cidades personificadas como mensageiras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבַשֶּׂרֶת
  choice: mensageira de boas-novas
  rationale: O particípio feminino singular pode designar uma mensageira ou a cidade personificada como anunciadora. A formulação conserva o gênero e a função participial sem eliminar a ambiguidade sintática.
- source_word: עֲלִי
  choice: Suba
  rationale: Imperativo feminino singular de עלה; é natural em português e mantém o sentido direcional.
- source_word: הַר גָּבֹהַ
  choice: um monte alto
  rationale: Expressa um lugar elevado para a proclamação pública; o artigo hebraico pode ter valor genérico.
- source_word: הָרִימִי ... קוֹלֵךְ
  choice: levante a voz
  rationale: Reproduz naturalmente o imperativo e a expressão hebraica relativa à proclamação audível.
- source_word: בַכֹּחַ
  choice: com força
  rationale: Mantém concretamente o substantivo כֹּחַ e comunica a intensidade da proclamação.
- source_word: אַל תִּירָאִי
  choice: não tenha medo
  rationale: Proibição direta no feminino singular, em linguagem portuguesa atual.
- source_word: לְעָרֵי יְהוּדָה
  choice: às cidades de Judá
  rationale: Tradução direta da expressão preposicional, preservando a referência geográfica.
- source_word: הִנֵּה אֱלֹהֵיכֶם
  choice: Aqui está o seu Deus!
  rationale: Aqui está funciona como chamada de atenção dêitica clara e digna; seu Deus é dirigido coletivamente às cidades, uso normal no português brasileiro.
theological_decisions:
- issue: Identificação sintática dos particípios femininos מְבַשֶּׂרֶת com Sião e Jerusalém
  choice: O texto principal trata a figura interpelada como mensageira de boas-novas para Sião e Jerusalém.
  alternative: Sião e Jerusalém podem ser vocativos e, portanto, as próprias cidades personificadas como mensageiras; também se pode entender a expressão como “você que leva boas-novas a Sião/Jerusalém”.
  rationale: A sintaxe hebraica admite essas leituras. A redação principal segue uma análise plausível, enquanto as notas registram as alternativas genuínas sem resolver indevidamente a tensão.
- issue: Tradução de אֱלֹהִים com sufixo pronominal
  choice: seu Deus
  alternative: vosso Deus
  rationale: O substantivo refere-se ao Deus de Judá/Israel, e não contém neste versículo o nome divino YHWH. “Seu” oferece ampla legibilidade brasileira, embora o referente seja plural coletivo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Boas-novas” preserva o conteúdo positivo do anúncio; os imperativos no feminino refletem a morfologia hebraica. A repetição de “levante” mantém a ênfase do original.
