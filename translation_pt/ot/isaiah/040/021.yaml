  naturalness: «Não sabem? Não ouvem?» é claro, natural e mantém a cadência interrogativa. «Não lhes foi dito» é mais sóbrio e apropriado ao registro do que «Isso não lhes foi contado», sem alterar o sentido.
  terminology: «Alicerces da terra» traduz naturalmente מוֹסְדוֹת הָאָרֶץ no contexto cósmico e mantém o plural. A nota conserva corretamente a leitura em que essa expressão é objeto de «entenderam».
