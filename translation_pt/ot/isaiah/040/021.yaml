    rationale: תִשְׁמָעוּ é imperfeito, em paralelo com תֵדְעוּ («não sabem?»). «Não ouviram?» emprega o perfeito e sugere mais especificamente uma ocasião passada de audição. «Não ouvem?» preserva melhor a forma e o paralelismo retórico.
  - severity: low
    issue: Formulação «Isso não lhes foi contado»
    rationale: Embora compreensível, o demonstrativo «isso» não é expresso no hebraico e «foi contado» pode soar mais narrativo. «Não lhes foi dito» é mais direto e idiomático neste registro.
