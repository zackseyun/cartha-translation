  text: הֲ/ל֤וֹא תֵֽדְעוּ֙ הֲ/ל֣וֹא תִשְׁמָ֔עוּ הֲ/ל֛וֹא הֻגַּ֥ד מֵ/רֹ֖אשׁ לָ/כֶ֑ם הֲ/לוֹא֙ הֲבִ֣ינֹתֶ֔ם מוֹסְד֖וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/021.yaml
  text: Do you not know? Do you not hear? Has it not been told to you from the beginning? Have you not understood from the foundations of the earth?[a]
translation:
  language: pt
  text: Vocês não sabem? Não ouvem? Não lhes foi dito desde o princípio? Vocês não entenderam desde os alicerces da terra?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês não entenderam os alicerces da terra?”'
    reason: 'Leitura sintática alternativa: a expressão hebraica pode ser objeto de “entenderam”, em vez de indicar o ponto inicial no tempo.'
lexical_decisions:
- source_word: הֲלוֹא
  choice: não...?
  rationale: A partícula interrogativa negativa repetida introduz perguntas retóricas que esperam resposta afirmativa. A repetição é preservada de modo natural em português.
- source_word: תֵדְעוּ
  choice: sabem
  rationale: O verbo expressa conhecimento ou consciência; “sabem” é direto e idiomático no contexto.
- source_word: תִשְׁמָעוּ
  choice: ouviram
  rationale: O verbo significa primariamente “ouvir”. O pretérito é natural em português nesta sequência, sem acrescentar a nuance volitiva de “escutar”.
- source_word: הֻגַּד
  choice: foi contado
  rationale: A forma passiva indica que a informação foi comunicada aos ouvintes. “Foi contado” é corrente e preserva a voz passiva.
- source_word: מֵרֹאשׁ
  choice: desde o princípio
  rationale: A expressão aponta para o tempo mais remoto ou ponto inicial; “desde o princípio” conserva esse sentido temporal.
- source_word: הֲבִינֹתֶם
  choice: entenderam
  rationale: O Hifil de בין aqui comunica entendimento ou discernimento; “entenderam” mantém o foco cognitivo.
- source_word: מוֹסְדוֹת
  choice: fundamentos
  rationale: O substantivo plural designa os fundamentos ou alicerces; “fundamentos” preserva a forma plural e convém ao contexto cósmico.
- source_word: הָאָרֶץ
  choice: da terra
  rationale: O contexto da criação indica a terra em sentido cósmico, não uma região ou país específico.
theological_decisions:
- issue: Relação sintática da oração final
  choice: Vocês não entenderam desde os fundamentos da terra?
  alternative: Vocês não entenderam os fundamentos da terra?
  rationale: O hebraico não traz preposição explícita antes de “fundamentos da terra”. A expressão pode funcionar como referência temporal/de origem, em paralelo com “desde o princípio”, ou como objeto direto de “entenderam”. A leitura temporal foi adotada no texto por se ajustar à sequência, mas a leitura objetiva permanece viável e é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”, de ampla legibilidade brasileira. As quatro perguntas retóricas e sua cadência foram preservadas; a alternância verbal busca naturalidade sem enfraquecer a repetição hebraica.
