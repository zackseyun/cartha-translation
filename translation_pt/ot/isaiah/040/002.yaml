source:
  edition: WLC
  text: דַּבְּר֞וּ עַל לֵ֤ב יְרֽוּשָׁלִַ֨ם֙ וְ/קִרְא֣וּ אֵלֶ֔י/הָ כִּ֤י מָֽלְאָה֙ צְבָאָ֔/הּ כִּ֥י נִרְצָ֖ה עֲוֺנָ֑/הּ כִּ֤י לָקְחָה֙ מִ/יַּ֣ד יְהוָ֔ה כִּפְלַ֖יִם בְּ/כָל חַטֹּאתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/002.yaml
  text: Speak to the heart of Jerusalem[a], and call out to her that her hard service is completed, that her iniquity is pardoned[c][b], that she has received from the hand of Yahweh double for all her sins.
translation:
  language: pt
  text: Falem ao coração de Jerusalém e proclamem-lhe que seu serviço árduo chegou ao fim,[a] que sua iniquidade foi perdoada,[b] e que ela recebeu da mão de Yahweh em dobro por todos os seus pecados.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua guerra terminou” ou “seu tempo de serviço se cumpriu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a punição por sua iniquidade foi aceita como suficiente” ou “sua culpa foi aceita”.'
    reason: lexical_alternative
  - marker: c
    text: “Em dobro” pode ser uma expressão idiomática que indica uma medida plena, não necessariamente uma duplicação matemática exata.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבְּרוּ עַל־לֵב
  choice: Falem ao coração de
  rationale: Reproduz de perto a expressão idiomática hebraica, que comunica uma fala consoladora e tranquilizadora, mantendo uma formulação digna e compreensível em português.
- source_word: וְקִרְאוּ אֵלֶיהָ
  choice: e proclamem-lhe
  rationale: קרא com אֶל pode indicar chamar em voz alta ou proclamar a alguém. “Proclamem-lhe” se ajusta ao contexto de anúncio profético sem perder a força da comunicação direta.
- source_word: מָלְאָה צְבָאָהּ
  choice: seu serviço árduo chegou ao fim
  rationale: צָבָא pode designar guerra, serviço obrigatório ou um período determinado de serviço. A formulação principal preserva a ideia mais ampla de um tempo penoso agora concluído; as alternativas são registradas em nota.
- source_word: נִרְצָה עֲוֺנָהּ
  choice: sua iniquidade foi perdoada
  rationale: No contexto de restauração, a construção anuncia que a iniquidade já foi tratada e que o perdão pode ser proclamado. Como רצה no nifal também pode expressar aceitação ou satisfação, essa nuance permanece na nota.
- source_word: לָקְחָה מִיַּד יְהוָה
  choice: ela recebeu da mão de Yahweh
  rationale: לקח admite “tomar” ou “receber”; aqui, “recebeu” é a forma natural em português. “Da mão de” conserva a imagem hebraica da ação procedente de Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּפְלַיִם
  choice: em dobro
  rationale: Mantém o sentido lexical de “duplo” sem decidir no texto se se trata de uma proporção matemática exata ou de uma medida plena, questão esclarecida em nota.
- source_word: בְּכָל חַטֹּאתֶיהָ
  choice: por todos os seus pecados
  rationale: No contexto, חַטֹּאות se refere aos pecados de Jerusalém, e a preposição expressa a relação entre eles e aquilo que ela recebeu.
theological_decisions:
- issue: Sentido de Jerusalém ter recebido “em dobro” da mão de Yahweh
  choice: Manter “em dobro” no texto, no contexto do juízo já recebido, sem impor uma proporção matemática exata.
  alternative: Entender como punição precisamente duplicada por cada pecado, ou como referência a uma abundante medida de graça.
  rationale: O contexto imediato fala de serviço concluído e iniquidade perdoada após sofrimento. A tradução conserva a imagem literal e deixa em aberto se “dobro” funciona idiomaticamente como medida plena.
- issue: Força de נִרְצָה עֲוֺנָהּ
  choice: Anunciar que a iniquidade de Jerusalém foi perdoada.
  alternative: Entender que a punição por sua iniquidade foi aceita como suficiente ou satisfeita.
  rationale: “Foi perdoada” comunica naturalmente o resultado restaurador no contexto, enquanto a nota preserva a possível nuance de aceitação ou satisfação da pena.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A expressão “falar ao coração” conserva deliberadamente a imagem hebraica e seu tom consolador; “proclamem-lhe” mantém o registro profético sem soar arcaico em excesso.
