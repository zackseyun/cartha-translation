  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יָבֵ֤שׁ חָצִיר֙ נָ֣בֵֽל צִ֔יץ כִּ֛י ר֥וּחַ יְהוָ֖ה נָ֣שְׁבָה בּ֑/וֹ אָכֵ֥ן חָצִ֖יר הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/007.yaml
  text: The grass dries up[a], the flower withers, because the breath of Yahweh blows on it; surely the people are grass.
translation:
  language: pt
  text: A erva seca, a flor murcha, porque o sopro de Yahweh sopra sobre ela; certamente, o povo é erva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque o vento de Yahweh sopra sobre ela”; menos provavelmente neste contexto: “porque o Espírito de Yahweh sopra sobre ela”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֵשׁ
  choice: seca
  rationale: O qal perfeito de יבש descreve a erva tornando-se seca. O presente poético em português expressa naturalmente uma verdade geral e mantém o paralelismo.
- source_word: חָצִיר
  choice: erva
  rationale: Neste contexto poético, חָצִיר designa a vegetação rasteira e transitória. “Erva” conserva a metáfora e soa natural em português bíblico atual.
- source_word: נָבֵל
  choice: murcha
  rationale: O verbo indica murchar ou perder o viço. “Murcha” combina de modo idiomático com “flor” e distingue esta ação do ressecamento da erva.
- source_word: צִיץ
  choice: flor
  rationale: “Flor” é a equivalência mais clara e comum para צִיץ neste quadro de beleza passageira.
- source_word: כִּי
  choice: porque
  rationale: A conjunção introduz a causa do ressecamento e do murchar; “porque” explicita essa relação sem alterar a poesia.
- source_word: רוּחַ
  choice: sopro
  rationale: רוּחַ pode significar sopro, vento ou espírito. “Sopro” preserva aqui tanto a ação pessoal de Yahweh quanto a imagem de algo que sopra sobre a vegetação, sem eliminar a ambiguidade, registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como “Yahweh”, preservando o nome próprio presente no texto hebraico em vez de substituí-lo por um título.
- source_word: נָשְׁבָה
  choice: sopra
  rationale: O verbo significa soprar. O presente mantém o caráter proverbial da afirmação e produz a associação intencional entre “sopro” e “sopra”.
- source_word: בּוֹ
  choice: sobre ela
  rationale: A preposição indica a ação exercida sobre a erva; o pronome feminino concorda naturalmente com “erva” em português.
- source_word: אָכֵן
  choice: certamente
  rationale: A partícula introduz confirmação enfática. “Certamente” preserva essa força conclusiva em registro digno e atual.
- source_word: הָעָם
  choice: o povo
  rationale: A expressão definida é mantida como “o povo”, sem decidir se a referência contextual abrange Israel em particular ou a humanidade de modo representativo.
theological_decisions:
- issue: Sentido de רוּחַ יְהוָה
  choice: o sopro de Yahweh
  alternative: o vento de Yahweh; o Espírito de Yahweh
  rationale: “Sopro” se ajusta à imagem da vegetação que seca sob a ação divina e preserva uma dimensão pessoal. Como רוּחַ também pode significar “vento” ou “Espírito”, as possibilidades legítimas são apresentadas em nota, sendo “Espírito” menos provável neste contexto.
- issue: Alcance de הָעָם
  choice: o povo
  alternative: a humanidade; a nação
  rationale: A tradução conserva a expressão coletiva e definida do hebraico sem restringir indevidamente sua referência teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação conserva o paralelismo poético, a repetição entre “sopro” e “sopra” e a metáfora conclusiva. O marcador de nota foi colocado após a frase para documentar a ambiguidade lexical de רוּחַ.
