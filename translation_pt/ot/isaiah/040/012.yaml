base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/012.yaml
  text: Who has measured the waters in the hollow of his hand[a], and marked off the heavens with a span, and measured the dust of the earth in a measure[c][b], and weighed the mountains in scales and the hills in balances?
translation:
  language: pt
  text: Quem mediu as águas na concha de sua mão, demarcou os céus com um palmo, recolheu numa medida[a] o pó da terra e pesou os montes numa balança e as colinas em pratos de balança?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “numa medida de um terço”. O termo hebraico indica uma antiga unidade ou vasilha de medição cuja capacidade exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Introduz a pergunta retórica que destaca a incomparabilidade de Deus.
- source_word: מָדַד בְּשָׁעֳלוֹ מַיִם
  choice: mediu as águas na concha da mão
  rationale: Preserva a imagem antropomórfica concreta; “concha da mão” é uma expressão portuguesa natural para a cavidade da palma.
- source_word: וְשָׁמַיִם בַּזֶּרֶת תִּכֵּן
  choice: demarcou os céus com um palmo
  rationale: זֶרֶת designa o palmo como medida, e תִּכֵּן comunica a determinação ou medição da extensão.
- source_word: וְכָל בַּשָּׁלִשׁ עֲפַר הָאָרֶץ
  choice: recolheu numa medida o pó da terra
  rationale: O verbo retrata o pó contido ou medido; “recolheu numa medida” preserva a imagem de um recipiente sem atribuir precisão indevida à unidade antiga.
- source_word: וְשָׁקַל בַּפֶּלֶס הָרִים וּגְבָעוֹת בְּמֹאזְנָיִם
  choice: pesou os montes numa balança e as colinas em pratos de balança
  rationale: Mantém o paralelismo e representa os dois termos hebraicos relacionados a instrumentos de pesagem.
theological_decisions:
- issue: Linguagem antropomórfica aplicada ao Criador
  choice: Manter literalmente as imagens da concha da mão e do palmo
  alternative: Substituí-las por formulações abstratas, como “por seu poder” ou “com exatidão”
  rationale: A poesia hebraica usa deliberadamente medidas humanas diminutas para apresentar a grandeza incomparável daquele que mede toda a criação; não há razão textual para suavizar a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética. A repetição de termos de medição foi preservada, assim como a pergunta retórica e as imagens concretas do hebraico.
