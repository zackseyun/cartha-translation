  text: הִנֵּ֨ה אֲדֹנָ֤/י יְהוִה֙ בְּ/חָזָ֣ק יָב֔וֹא וּ/זְרֹע֖/וֹ מֹ֣שְׁלָה ל֑/וֹ הִנֵּ֤ה שְׂכָר/וֹ֙ אִתּ֔/וֹ וּ/פְעֻלָּת֖/וֹ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/010.yaml
  text: Behold[a], the Lord GOD comes with strength, and his arm rules for him; behold, his reward is with him[d][c][b], and his recompense before him.
translation:
  language: pt
  text: Eis que o Senhor Yahweh[a] vem com poder[b], e seu braço exerce domínio em seu favor[c]. Eis que sua recompensa está com ele, e sua retribuição está diante dele[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «o Senhor Yahweh». Outra convenção traduz o título composto como «o Senhor DEUS».'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «virá com poder». O verbo hebraico também pode ser traduzido com sentido futuro explícito.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «seu braço governa em seu favor».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: «seu salário está com ele, e seu pagamento, diante dele». Os termos hebraicos podem designar recompensa, salário ou compensação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a função dêitica e enfática da interjeição profética nas duas ocorrências, com tom solene ainda reconhecível no português moderno.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa os dois elementos do título hebraico: אֲדֹנָי como «Senhor» e o nome divino יְהוִה como «Yahweh», sem produzir a repetição artificial «Senhor SENHOR».'
- source_word: בְּחָזָק
  choice: com poder
  rationale: Expressa de modo natural a maneira poderosa da vinda; evita transformar a expressão em um título como «como um poderoso».
- source_word: יָבוֹא
  choice: vem
  rationale: O presente dá vivacidade e certeza à proclamação introduzida por הִנֵּה, embora o imperfeito hebraico também admita tradução futura.
- source_word: וּזְרֹעוֹ
  choice: e seu braço
  rationale: Mantém a metáfora bíblica transparente do braço como instrumento de poder, sem reduzi-la à abstração «força».
- source_word: מֹשְׁלָה לוֹ
  choice: exerce domínio por ele
  rationale: Conserva o sentido participial de משל e representa לו como atuação em favor ou por parte dele, sem eliminar a personificação do braço.
- source_word: שְׂכָרוֹ
  choice: sua recompensa
  rationale: Abrange a ideia de recompensa ou salário e se ajusta ao paralelismo poético sem impor um tom estritamente comercial.
- source_word: אִתּוֹ
  choice: está com ele
  rationale: Traduz diretamente a ideia de acompanhamento ou presença.
- source_word: וּפְעֻלָּתוֹ
  choice: e sua retribuição
  rationale: No paralelismo com שְׂכָרוֹ, expressa o resultado ou pagamento da obra, preservando a possibilidade de recompensa concedida sem especificar os destinatários.
- source_word: לְפָנָיו
  choice: vai à sua frente
  rationale: Comunica naturalmente a imagem espacial de algo que está ou segue adiante dele, adequada à cena de chegada régia.
theological_decisions:
- issue: Representação do nome divino יְהוָה no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução explicita o nome próprio da aliança presente no texto hebraico e distingue-o do título אֲדֹנָי. A nota registra a convenção alternativa sem fundir os dois termos.
- issue: Referência da recompensa e da retribuição
  choice: manter os possessivos sem identificar quem recebe
  alternative: explicitar que ele traz recompensa para seu povo e castigo para seus inimigos
  rationale: O versículo afirma que a recompensa e a retribuição pertencem ou estão associadas a ele, mas não nomeia aqui seus destinatários; a tradução preserva essa abertura contextual.
- issue: Agência metafórica do braço divino
  choice: seu braço exerce domínio por ele
  alternative: ele governa com seu braço poderoso
  rationale: A formulação mantém a personificação e a estrutura do hebraico, em vez de resolver a metáfora numa paráfrase teológica.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. «Eis que» conserva a força profética; «Yahweh» preserva o nome divino; e as imagens do braço e da chegada régia são mantidas sem paráfrase denominacional.
