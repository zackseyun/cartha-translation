  naturalness: O registro é moderno, solene e acessível. «Eis que», «com poder» e «recompensa» funcionam bem. A substituição de «por ele» por «em seu favor» elimina uma ambiguidade moderna indesejada; «está diante dele» reproduz com naturalidade a imagem espacial sem acrescentar ação.
  terminology: «O Senhor Yahweh» representa adequadamente אֲדֹנָי יְהוִה conforme a convenção indicada. «Braço», «recompensa» e «retribuição» mantêm a terminologia e o paralelismo do hebraico. Não há necessidade de especificar destinatários ou impor uma interpretação teológica.
