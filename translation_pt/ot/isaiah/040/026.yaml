source:
  edition: WLC
  text: שְׂאוּ מָר֨וֹם עֵינֵי/כֶ֤ם וּ/רְאוּ֙ מִי בָרָ֣א אֵ֔לֶּה הַ/מּוֹצִ֥יא בְ/מִסְפָּ֖ר צְבָאָ֑/ם לְ/כֻלָּ/ם֙ בְּ/שֵׁ֣ם יִקְרָ֔א מֵ/רֹ֤ב אוֹנִים֙ וְ/אַמִּ֣יץ כֹּ֔חַ אִ֖ישׁ לֹ֥א נֶעְדָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/026.yaml
  text: 'Lift up your eyes on high and see: who created these? He who brings out their host by number[a], calling all of them by name. Because of the greatness of his might and the strength of his power[c][b], not one is missing.'
translation:
  language: pt
  text: 'Levantem os olhos para o alto e vejam: quem criou estas coisas? É ele quem faz sair, em número, o exército delas[a] e chama todas pelo nome[b]. Por causa da grandeza do seu vigor e da força do seu poder, não falta nenhuma delas[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O exército delas” é a multidão ordenada dos corpos celestes.
    reason: cultural_note
  - marker: b
    text: 'Ou: “chama cada uma pelo nome”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “nem um homem falta”; “homem” é uma expressão hebraica distributiva e aqui significa que nenhuma delas está ausente.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ מָרוֹם עֵינֵיכֶם
  choice: Levantem os olhos para o alto
  rationale: Mantém o imperativo plural, o movimento de erguer os olhos e o sentido espacial de מָרוֹם, em português natural.
- source_word: מִי בָרָא אֵלֶּה
  choice: quem criou estas coisas?
  rationale: Preserva a pergunta retórica e o demonstrativo neutro, sem inserir explicitamente “estrelas”, embora o contexto aponte para os corpos celestes.
- source_word: הַמּוֹצִיא בְמִסְפָּר צְבָאָם
  choice: É ele quem faz sair, em número certo, o exército delas
  rationale: A construção “É ele quem” liga com clareza o particípio substantivado ao Criador. “Em número certo” comunica enumeração ordenada, e “exército” conserva a imagem coletiva de צָבָא sem acrescentar “estrelas” ao texto.
- source_word: לְכֻלָּם בְּשֵׁם יִקְרָא
  choice: e chama todas pelo nome
  rationale: Reproduz o alcance de לְכֻלָּם e a ideia de que cada integrante da multidão celeste é pessoalmente conhecido e convocado.
- source_word: מֵרֹב אוֹנִים
  choice: Por causa da grandeza do seu vigor
  rationale: Entende מִן como causal e mantém אוֹנִים como “vigor”, distinguindo-o de כֹּחַ na expressão paralela seguinte.
- source_word: וְאַמִּיץ כֹּחַ
  choice: e porque ele é forte em poder
  rationale: Preserva a construção adjetival e o paralelismo intensificador, evitando fundir os dois termos hebraicos de força numa única expressão.
- source_word: אִישׁ לֹא נֶעְדָּר
  choice: nenhuma delas falta
  rationale: 'Expressa naturalmente o uso distributivo de אִישׁ: nenhum membro do exército celeste está ausente.'
theological_decisions:
- issue: Referente de “estas coisas” e “o exército delas”
  choice: Manter os referentes implícitos no texto principal, entendendo-os contextualmente como os corpos celestes.
  alternative: Traduzir explicitamente como “estrelas” ou “exército de estrelas”.
  rationale: O olhar dirigido para o alto, a enumeração e a nomeação apontam fortemente para os astros, mas o hebraico conserva a expressão demonstrativa e coletiva; a tradução não deve eliminar essa abertura retórica.
- issue: Relação entre o poder de Deus e a ausência de qualquer membro
  choice: 'Conservar a relação causal: nenhum deles falta por causa do vigor e poder do Criador.'
  alternative: Ler a frase apenas como duas afirmações justapostas sobre Deus e os astros.
  rationale: O valor causal de מִן é o mais adequado ao contexto e apresenta o poder divino como fundamento da ordem e preservação do exército celeste, sem desenvolver implicações doutrinárias além do texto.
- issue: Valor distributivo de אִישׁ
  choice: Traduzir “nenhuma delas falta”.
  alternative: Traduzir literalmente “nenhum homem falta” ou, de modo menos contextual, “ninguém falta”.
  rationale: אִישׁ funciona distributivamente e se refere aos membros do conjunto celeste, não a seres humanos do sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural e preferência por construções naturais no Brasil sem regionalismos marcados. A imagem de “exército” foi mantida por sua importância poética, com esclarecimento em nota. Os marcadores foram posicionados junto às expressões que explicam.
