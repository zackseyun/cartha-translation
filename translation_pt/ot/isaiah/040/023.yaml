lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: que reduz
  rationale: O particípio continua a descrição de Deus no versículo anterior. Com לְאָיִן, «reduz ... a nada» expressa naturalmente em português a ação de levar alguém à insignificância.
- source_word: רוֹזְנִים
  choice: os príncipes
  rationale: O termo designa altos oficiais, nobres ou governantes; «príncipes» preserva o tom elevado e político do texto.
- source_word: לְאָיִן
  choice: a nada
  rationale: אָיִן indica inexistência ou nulidade; a expressão idiomática «reduz ... a nada» mantém sua força.
- source_word: שֹׁפְטֵי אֶרֶץ
  choice: os juízes da terra
  rationale: A construção pode referir-se aos juízes da terra ou do país; o contexto universal e cósmico de Isaías 40 favorece «terra».
- source_word: כַּתֹּהוּ
  choice: como o vazio
  rationale: תֹהוּ pode indicar vazio, desolação, caos ou irrealidade. «Como o vazio» conserva a imagem e evita restringi-la ao uso associado a Gênesis 1.
- source_word: עָשָׂה
  choice: faz
  rationale: Embora seja morfologicamente perfeito, no paralelismo poético descreve a ação característica de Deus e pode ser vertido naturalmente no presente.
theological_decisions:
- issue: Âmbito de אֶרֶץ em שֹׁפְטֵי אֶרֶץ
  choice: terra
  alternative: país
  rationale: O contexto ressalta a soberania de Deus sobre o mundo e as nações; «terra» preserva esse alcance universal sem eliminar a alternativa lexical.
