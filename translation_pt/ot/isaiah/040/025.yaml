  text: וְ/אֶל מִ֥י תְדַמְּי֖וּ/נִי וְ/אֶשְׁוֶ֑ה יֹאמַ֖ר קָדֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/025.yaml
  text: To whom then will you compare me[a], that I should be equal? says the Holy One.
translation:
  language: pt
  text: “Com quem, então, vocês me compararão, para que eu lhe seja igual?”, diz o Santo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶל מִי
  choice: Com quem, então
  rationale: A preposição אֶל introduz a pessoa tomada como termo da comparação. “Com quem” é a formulação natural em português; “então” explicita com naturalidade a transição retórica do contexto.
- source_word: תְדַמְּיוּנִי
  choice: vocês me compararão
  rationale: O piel de דמה significa “assemelhar, comparar”. O futuro mantém a forma verbal hebraica e “vocês” torna explícita a segunda pessoa do plural para leitores de diferentes regiões lusófonas.
- source_word: וְאֶשְׁוֶה
  choice: para que eu lhe seja igual
  rationale: שוה pode indicar igualdade, equivalência ou semelhança. A construção final expressa o resultado visado pela comparação; “lhe” retoma de modo natural o referente singular e indefinido de “quem”, sem especificar identidade ou gênero.
- source_word: יֹאמַר
  choice: diz
  rationale: O imperfeito hebraico funciona como fórmula profética de fala; o presente português é natural e preserva sua vivacidade.
- source_word: קָדוֹשׁ
  choice: o Santo
  rationale: O adjetivo substantivado funciona como título divino. O texto diz apenas “Santo”, sem acrescentar “de Israel”.
theological_decisions:
- issue: Autodescrição e incomparabilidade divina
  choice: Preservar a pergunta retórica, a primeira pessoa divina e o título exato “o Santo”.
  alternative: Parafrasear como “Quem pode se comparar comigo?” ou ampliar para “o Santo de Israel”.
  rationale: A formulação hebraica afirma a singularidade de Deus por meio de uma pergunta dirigida aos ouvintes. A tradução não acrescenta o complemento “de Israel” nem transforma a pergunta em declaração.
- issue: Sentido de וְאֶשְׁוֶה
  choice: “para que eu lhe seja igual”
  alternative: “e eu seja semelhante” ou “para que eu possa ser comparado”
  rationale: “Igual” conserva a força possível de equivalência em שוה, enquanto “lhe” mantém a relação com o termo singular e indefinido da comparação. A tradução evita inserir um referente masculino explícito como “ele”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para marcar claramente o plural hebraico e mantém a concisão e a força retórica do versículo.
