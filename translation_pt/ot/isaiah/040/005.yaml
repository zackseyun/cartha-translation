  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִגְלָ֖ה כְּב֣וֹד יְהוָ֑ה וְ/רָא֤וּ כָל בָּשָׂר֙ יַחְדָּ֔ו כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/005.yaml
  text: And the glory of Yahweh will be revealed[a], and all flesh together will see, for the mouth of Yahweh has spoken.
translation:
  language: pt
  text: E a glória de Yahweh será revelada, e toda carne[a] verá juntamente, pois a boca de Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a humanidade”; em hebraico, “toda carne”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְלָה
  choice: será revelada
  rationale: O nifal de גלה expressa manifestação ou revelação; a forma passiva preserva tanto o sentido verbal quanto a força futura da promessa profética.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כָּבוֹד comunica glória, honra e peso; a construção portuguesa mantém a relação do estado construto e conserva o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
- source_word: וְרָאוּ
  choice: verá
  rationale: O perfeito na sequência profética tem valor futuro. O singular concorda naturalmente com a expressão coletiva 'toda carne'; não se acrescenta um objeto ausente do hebraico.
- source_word: כָל בָּשָׂר
  choice: toda carne
  rationale: Mantém a imagem hebraica concreta e a universalidade da expressão, que neste contexto se refere a toda a humanidade.
- source_word: יַחְדָּו
  choice: juntamente
  rationale: Preserva a ideia de participação coletiva ou simultânea sem expandi-la para uma interpretação mais específica.
- source_word: כִּי
  choice: pois
  rationale: Introduz o fundamento e a garantia da promessa anterior em português natural.
- source_word: פִּי יְהוָה
  choice: a boca de Yahweh
  rationale: Conserva a expressão antropomórfica concreta e enfática do hebraico.
- source_word: דִּבֵּר
  choice: falou
  rationale: O perfeito apresenta a palavra divina como pronunciada e, portanto, certa; o pretérito perfeito é direto e natural em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido e imagem de כָל בָּשָׂר
  choice: toda carne
  alternative: toda a humanidade; todos
  rationale: Embora a referência contextual seja universal e humana, a tradução retém a imagem hebraica da carne e sua ênfase na condição corpórea e criada.
- issue: Objeto implícito de וְרָאוּ
  choice: não acrescentar objeto expresso
  alternative: a verá; verá isso
  rationale: O hebraico não traz pronome ou objeto explícito. A formulação portuguesa conserva essa abertura em vez de identificar gramaticalmente aquilo que será visto.
translation_notes:
  register: Português moderno, solene e amplamente compreensível. A ordem foi levemente ajustada à sintaxe portuguesa, mas a imagem de “toda carne”, o advérbio coletivo e a expressão “a boca de Yahweh” foram preservados. O marcador da nota foi colocado junto à expressão que ela explica.
