  source_fidelity: 'A tradução preserva com precisão os principais elementos do hebraico: o futuro passivo de וְנִגְלָה (“será revelada”), “a glória de Yahweh”, a expressão concreta e universal “toda carne”, o valor coletivo de יַחְדָּו (“juntamente”) e a garantia conclusiva “pois a boca de Yahweh falou”. A ausência de objeto expresso para “verá” é mantida, sem inserir interpretativamente “a glória” ou “isso”.'
