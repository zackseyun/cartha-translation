  yaml_path: translation/ot/isaiah/040/017.yaml
  text: All the nations are as nothing before him[a]; they are regarded by him as less than nothing and emptiness.
translation:
  language: pt
  text: Todas as nações são como nada diante dele; ele as considera menos que nada e vazio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são consideradas por ele menos que nada e caos/desolação”. A palavra hebraica תֹהוּ também pode ter o sentido de “desolação”, “vazio” ou “caos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: Todas as nações
  rationale: Expressa de modo natural a totalidade coletiva indicada por כָּל e mantém o sentido amplo de גּוֹיִם sem especificar indevidamente etnia ou religião.
- source_word: כְּאַיִן
  choice: como nada
  rationale: Preserva a comparação marcada por כְּ e traduz אַיִן como ausência de valor ou substância no contraste retórico.
- source_word: נֶגְדּוֹ
  choice: diante dele
  rationale: Mantém tanto a ideia relacional quanto a força avaliativa da expressão hebraica.
- source_word: מֵאֶפֶס
  choice: menos que nada
  rationale: Entende מִן com força comparativa e conserva a intensificação retórica do segundo membro.
- source_word: וָתֹהוּ
  choice: e vazio
  rationale: תֹהוּ pode indicar vazio, desolação ou caos; neste paralelismo, “vazio” comunica melhor a completa falta de substância.
- source_word: נֶחְשְׁבוּ לוֹ
  choice: ele as considera
  rationale: Reformula naturalmente em voz ativa a construção hebraica “são consideradas para ele”, deixando claro que a avaliação é feita por Deus.
theological_decisions:
- issue: Grau de negação no segundo membro
  choice: menos que nada e vazio
  alternative: nada e caos; nulidade e desolação
  rationale: A combinação מֵאֶפֶס וָתֹהוּ acumula termos de nulidade para exaltar a incomparabilidade de Deus, sem necessariamente formular uma afirmação metafísica sobre a existência das nações.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A voz ativa em “ele as considera” evita uma passiva pouco idiomática sem alterar o agente ou a perspectiva do hebraico.
