source:
  edition: WLC
  text: וּ/לְבָנ֕וֹן אֵ֥ין דֵּ֖י בָּעֵ֑ר וְ/חַיָּת֔/וֹ אֵ֥ין דֵּ֖י עוֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/016.yaml
  text: Lebanon is not enough to burn[b][a], nor are its animals enough for a burnt offering.
translation:
  language: pt
  text: O Líbano não basta para servir de lenha,[a] nem seus animais para um holocausto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Líbano provavelmente evoca suas famosas florestas; o sentido é que nem toda a sua madeira seria suficiente para alimentar o fogo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “oferta inteiramente queimada”. O termo hebraico designa um sacrifício totalmente consumido pelo fogo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָנוֹן
  choice: o Líbano
  rationale: Mantém o nome próprio presente no hebraico, enquanto o contexto permite que ele represente metonimicamente suas célebres florestas.
- source_word: אֵין דֵּי
  choice: não tem ... suficiente / não ... bastam
  rationale: Expressa a ideia de insuficiência em português natural; a variação evita repetição rígida sem alterar o paralelismo semântico.
- source_word: בָּעֵר
  choice: para o fogo
  rationale: O infinitivo se refere ao material que seria queimado. A formulação explicita naturalmente em português a lenha implícita no emprego metonímico de Líbano.
- source_word: וְחַיָּתוֹ
  choice: seus animais
  rationale: Preserva o sentido amplo de חַיָּה e a referência dos animais ao Líbano, sem restringir indevidamente a animais selvagens.
- source_word: עוֹלָה
  choice: um holocausto
  rationale: Termo sacrificial tradicional e ainda inteligível em português bíblico para a oferta inteiramente queimada; mantém o singular hebraico.
theological_decisions:
- issue: Força interpretativa da imagem sacrificial
  choice: Mesmo toda a madeira e todos os animais do Líbano seriam insuficientes para uma oferta proporcional à grandeza de Deus.
  alternative: Uma afirmação geral sobre a insuficiência de todos os recursos humanos de adoração.
  rationale: O contexto de Isaías 40:12–17 ressalta a incomparável grandeza de Deus. A tradução conserva a imagem sacrificial sem ampliá-la para uma formulação doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Lenha suficiente para o fogo” torna natural a metonímia do Líbano e suas florestas; “holocausto” preserva o termo sacrificial consagrado, acompanhado de nota para evitar ambiguidade moderna.
