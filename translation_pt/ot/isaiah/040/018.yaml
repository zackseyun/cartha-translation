  text: וְ/אֶל מִ֖י תְּדַמְּי֣וּ/ן אֵ֑ל וּ/מַה דְּמ֖וּת תַּ֥עַרְכוּ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/018.yaml
  text: To whom[a], then, will you liken God, and what likeness will you compare to him?
translation:
  language: pt
  text: A quem[a], então, vocês compararão Deus? E que semelhança colocarão lado a lado com ele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E com quem vocês compararão Deus? Que figura porão diante dele?”'
    reason: 'Alternativa lexical e sintática: o וְ pode ser traduzido simplesmente por “e”, דְּמוּת por “figura”, e ערך por “pôr diante de”.'
lexical_decisions:
- source_word: וְ/אֶל מִי
  choice: A quem, então
  rationale: אֶל מִי introduz o termo da comparação. Em português, “comparar Deus a alguém” permite conservar “a quem”; o וְ inicial é expresso discursivamente por “então”, acompanhando o desenvolvimento da pergunta retórica.
- source_word: תְּדַמְּיוּן
  choice: vocês compararão
  rationale: A forma de דמה comunica a ação de considerar ou apresentar algo como semelhante. “Compararão” é atual, claro e mantém a força da pergunta retórica.
- source_word: אֵל
  choice: Deus
  rationale: No contexto, אֵל designa o Deus verdadeiro cuja incomparabilidade é contraposta aos ídolos, e não um deus indefinido.
- source_word: דְּמוּת
  choice: semelhança
  rationale: דְּמוּת pode indicar semelhança, figura ou forma. “Semelhança” conserva a ideia ampla de correspondência sem restringi-la necessariamente a uma imagem material.
- source_word: תַּעַרְכוּ לֽוֹ
  choice: colocarão lado a lado com ele
  rationale: ערך tem o sentido básico de dispor ou pôr em ordem; neste contexto, trata-se de colocar uma representação diante de Deus ou ao lado dele para confronto. A formulação preserva essa imagem concreta e sua função comparativa.
theological_decisions:
- issue: Sentido de אֵל na pergunta sobre idolatria e incomparabilidade
  choice: Deus
  alternative: um deus
  rationale: Isaías 40 trata da incomparabilidade do Deus de Israel em contraste com representações fabricadas. A referência definida “Deus” decorre do contexto, sem acrescentar um título doutrinário.
- issue: Natureza da דְּמוּת proposta
  choice: semelhança
  alternative: imagem
  rationale: “Semelhança” mantém aberta a abrangência do termo hebraico, que pode incluir forma ou representação, sem decidir de modo indevido que se trata exclusivamente de um objeto esculpido.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com “vocês” para a segunda pessoa do plural. As duas perguntas explicitam o paralelismo hebraico, enquanto “lado a lado” conserva a imagem de dispor algo para comparação.
