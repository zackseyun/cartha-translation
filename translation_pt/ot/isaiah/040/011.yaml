  yaml_path: translation/ot/isaiah/040/011.yaml
  text: Like a shepherd he will pasture his flock[a]; with his arm he will gather the lambs, and in his bosom he will carry them[c][b]; he will gently lead the nursing ewes.
translation:
  language: pt
  text: Como um pastor, ele apascentará o seu rebanho[a]; com seu braço reunirá os cordeiros e os carregará junto ao seu peito[b]; conduzirá com cuidado as ovelhas que estão amamentando.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como um pastor, ele cuidará do seu rebanho”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “no seu seio” ou “no seu colo”, imagem de cuidado próximo e terno.
    reason: cultural_note
  - marker: c
    text: 'Ou: “as ovelhas com crias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֹעֶה
  choice: Como pastor
  rationale: A preposição כְּ estabelece uma comparação. “Como pastor” preserva de modo natural a imagem pastoral.
- source_word: עֶדְרוֹ יִרְעֶה
  choice: ele apascentará o seu rebanho
  rationale: עֵדֶר designa o rebanho, e רעה expressa a ação de pastorear, alimentar e cuidar. “Apascentará” mantém a concretude da metáfora sem acrescentar interpretação.
- source_word: בִּזְרֹעוֹ
  choice: com o braço
  rationale: A preposição בְּ tem valor instrumental neste contexto; a formulação conserva a imagem do braço como meio de reunir e proteger.
- source_word: יְקַבֵּץ טְלָאִים
  choice: reunirá os cordeiros
  rationale: קבץ significa reunir, e טְלָאִים designa cordeiros. O artigo definido é natural em português para os integrantes do rebanho em foco.
- source_word: וּבְחֵיקוֹ יִשָּׂא
  choice: e os carregará junto ao peito
  rationale: חֵיק indica o peito, seio ou colo, evocando proximidade e cuidado terno. “Junto ao peito” comunica a imagem com naturalidade moderna; “os” explicita o objeto retomado, os cordeiros.
- source_word: עָלוֹת
  choice: as ovelhas que amamentam
  rationale: O termo se refere às fêmeas que dão de mamar, possivelmente vistas como acompanhadas de suas crias. A tradução mantém a especificidade pastoral sem decidir além do necessário.
- source_word: יְנַהֵל
  choice: conduzirá com cuidado
  rationale: נהל significa conduzir ou guiar e, neste contexto de animais vulneráveis, sugere direção atenciosa. “Com cuidado” expressa essa nuance contextual sem tornar explícita uma ideia teológica adicional.
theological_decisions:
- issue: Imagem de Deus como pastor
  choice: Manter diretamente a metáfora pastoral aplicada ao sujeito divino do contexto
  alternative: Explicitar na tradução uma interpretação messiânica ou cristológica posterior
  rationale: O versículo retrata o cuidado terno de YHWH por meio da figura do pastor. A tradução preserva a imagem de Isaías sem incorporar conclusões teológicas posteriores ao texto do versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Apascentará” preserva a linguagem pastoral concreta; as expressões ao redor tornam seu sentido claro. A pontuação mantém o paralelismo poético hebraico.
