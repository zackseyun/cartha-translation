  terminology: “Apascentará”, “rebanho”, “cordeiros” e “conduzirá com cuidado” são adequados ao registro pastoral e ao hebraico. “Junto ao seu peito” comunica naturalmente a imagem de בְּחֵיקוֹ; a nota preserva os equivalentes literais “seio” e “colo”.
