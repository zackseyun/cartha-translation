  text: הַ/פֶּ֨סֶל֙ נָסַ֣ךְ חָרָ֔שׁ וְ/צֹרֵ֖ף בַּ/זָּהָ֣ב יְרַקְּעֶ֑/נּוּ וּ/רְתֻק֥וֹת כֶּ֖סֶף צוֹרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/019.yaml
  text: As for the idol, a craftsman casts it, and a goldsmith overlays it with gold and forges silver chains for it.
translation:
  language: pt
  text: Quanto ao ídolo, um artesão o funde; um ourives o reveste de ouro e forja para ele correntes de prata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפֶּסֶל
  choice: o ídolo
  rationale: Embora פֶּסֶל designe literalmente uma imagem esculpida ou talhada, no contexto da comparação com Deus refere-se à imagem cultual como ídolo; a formulação também evita a estranheza de chamar de “esculpido” algo que o artesão funde.
- source_word: נָסַךְ
  choice: funde
  rationale: No contexto do trabalho de um artesão sobre uma imagem metálica, o verbo indica fundir ou moldar metal por fundição.
- source_word: יְרַקְּעֶנּוּ
  choice: o reveste
  rationale: O verbo descreve o metal batido e aplicado em lâminas; “reveste de ouro” comunica naturalmente o processo e seu resultado sem sugerir que o ídolo seja de ouro maciço.
- source_word: וּרְתֻקוֹת כֶּסֶף צוֹרֵף
  choice: e forja para ele correntes de prata
  rationale: A expressão concisa associa o trabalho do ourives à produção de correntes de prata. “Forja” preserva a ação artesanal, e “para ele” explicita em português a relação das correntes com o ídolo.
theological_decisions:
- issue: Identificação de פֶּסֶל como objeto cultual
  choice: ídolo
  alternative: imagem esculpida
  rationale: O contexto polemiza contra a fabricação de uma representação divina. “Ídolo” torna clara essa função sem acrescentar uma doutrina denominacional.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo artesanal preservado. O ponto e vírgula organiza a sequência de ações sem tornar a frase excessivamente fragmentada.
