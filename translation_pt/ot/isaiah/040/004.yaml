  text: כָּל גֶּיא֙ יִנָּשֵׂ֔א וְ/כָל הַ֥ר וְ/גִבְעָ֖ה יִשְׁפָּ֑לוּ וְ/הָיָ֤ה הֶֽ/עָקֹב֙ לְ/מִישׁ֔וֹר וְ/הָ/רְכָסִ֖ים לְ/בִקְעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/004.yaml
  text: Every valley will be lifted up[a], and every mountain and hill will be made low; the uneven ground will become level[b], and the ridges a plain.
translation:
  language: pt
  text: Todo vale será elevado, e todo monte e toda colina serão rebaixados; o terreno irregular[a] se tornará plano, e os terrenos acidentados[b] se tornarão uma planície.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o lugar tortuoso”; o termo hebraico pode indicar aquilo que é torto, sinuoso ou irregular.
    reason: lexical_alternative
  - marker: b
    text: Ou “os lugares escarpados”; o substantivo hebraico é raro e pode referir-se de modo mais geral a terreno áspero ou acidentado.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּיא
  choice: vale
  rationale: Designa um vale ou ravina; “vale” é amplo, natural e mantém o contraste topográfico com monte e colina.
- source_word: יִנָּשֵׂא
  choice: será elevado
  rationale: O nifal de נשׂא expressa aqui a elevação do vale. A forma passiva preserva a imagem concreta e o paralelismo.
- source_word: הַר
  choice: monte
  rationale: Equivalente corrente para uma elevação maior e forma uma combinação natural com “colina”.
- source_word: גִבְעָה
  choice: colina
  rationale: Indica uma elevação menor que הַר e preserva a distinção da dupla topográfica.
- source_word: יִשְׁפָּלוּ
  choice: serão rebaixados
  rationale: O verbo שׁפל comunica tornar-se baixo ou ser abaixado; “rebaixados” mantém a oposição direta a “elevado”.
- source_word: הֶעָקֹב
  choice: o terreno irregular
  rationale: O termo pode indicar algo tortuoso, torto ou desigual. No contexto de preparação de um caminho, “terreno irregular” comunica claramente o sentido físico sem excluir a alternativa lexical.
- source_word: לְמִישׁוֹר
  choice: plano
  rationale: מִישׁוֹר designa terreno nivelado ou planície. O predicativo “plano” expressa com concisão o contraste com “irregular”.
- source_word: הָרְכָסִים
  choice: os terrenos acidentados
  rationale: O substantivo raro parece referir-se a terreno rugoso, escarpado ou com elevações. A expressão escolhida preserva a imagem topográfica sem impor precisão indevida.
- source_word: לְבִקְעָה
  choice: uma planície
  rationale: בִקְעָה pode designar uma planície ou vale amplo. “Uma planície” funciona naturalmente como o estado resultante e evita repetir “vale”.
theological_decisions:
- issue: Natureza da imagem
  choice: Apresentar uma transformação física e topográfica no texto principal.
  alternative: Interpretar explicitamente como humilhação dos orgulhosos e exaltação dos humildes, ou como preparação escatológica para a vinda do SENHOR.
  rationale: O hebraico imediato descreve a transformação da paisagem no contexto da preparação de um caminho. Leituras metafóricas e escatológicas podem surgir do contexto e da recepção posterior, mas não devem ser inseridas na redação deste versículo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário topográfico concreto. A pontuação conserva o paralelismo poético; a elipse de “se tornarão” antes de “uma planície” evita repetição sem obscurecer o sentido.
