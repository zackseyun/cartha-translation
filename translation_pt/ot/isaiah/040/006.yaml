base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/006.yaml
  text: A voice says[a], “Cry out!” And I said, “What shall I cry?” All flesh is grass[c][b], and all its loveliness is like the flower of the field.
translation:
  language: pt
  text: 'Uma voz diz: “Clame!” E ele disse[a]: “O que clamarei?” Toda carne é erva[b], e toda a sua beleza[c] é como a flor do campo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura tradicional, com vocalização diferente da mesma sequência consonantal: “E eu disse”.'
    reason: alternative_reading
  - marker: b
    text: “Toda carne” é uma expressão literal que aqui se refere a toda a humanidade, isto é, a todos os seres humanos.
    reason: lexical_alternative
  - marker: c
    text: Ou “todo o seu esplendor” ou “toda a sua glória”. A palavra hebraica também costuma expressar bondade, amor fiel ou lealdade; neste contexto, refere-se ao que há de belo ou admirável na humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל אֹמֵר
  choice: Uma voz diz
  rationale: קוֹל designa aqui uma voz não identificada, e o particípio אֹמֵר apresenta a fala de modo vívido e contínuo. O presente é natural em português.
- source_word: קְרָא
  choice: Clame!
  rationale: O imperativo de קרא exige uma convocação pública e enfática. “Clame” mantém a força sem restringir o sentido a uma proclamação formal.
- source_word: וְאָמַר
  choice: E alguém disse
  rationale: A vocalização do WLC, וְאָמַר, é de terceira pessoa masculina singular. Como o referente não é identificado, “alguém” é mais natural em português do que um “ele” sem antecedente explícito. A leitura em primeira pessoa é registrada em nota.
- source_word: מָה אֶקְרָא
  choice: O que clamarei?
  rationale: Repete a raiz קרא e, assim, conserva a ligação verbal com “Clame!”. A forma futura exprime naturalmente a pergunta sobre o conteúdo da mensagem.
- source_word: כָּל הַבָּשָׂר
  choice: Toda carne
  rationale: A expressão literal hebraica refere-se à humanidade mortal. A tradução preserva a imagem e sua contraposição à erva, esclarecendo o referente em nota.
- source_word: חָצִיר
  choice: erva
  rationale: חָצִיר denota erva ou vegetação rasteira. “Erva” é corrente na linguagem bíblica em português e combina naturalmente com a imagem da flor do campo.
- source_word: חַסְדּוֹ
  choice: toda a sua beleza
  rationale: Embora חֶסֶד frequentemente denote bondade, lealdade ou amor fiel, neste paralelismo descreve aquilo que há de atraente, admirável ou esplêndido na humanidade e que é tão passageiro quanto uma flor. “Beleza” comunica o sentido contextual sem eliminar outras possibilidades, registradas em nota.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: como a flor do campo
  rationale: צִיץ é flor ou broto. A expressão genérica “a flor do campo” é natural, clara e preserva a imagem da floração transitória.
theological_decisions:
- issue: Identificação do segundo falante em וְאָמַר
  choice: 'Terceira pessoa indefinida: “E alguém disse”'
  alternative: 'Primeira pessoa: “E eu disse”'
  rationale: A vocalização apresentada no WLC sustenta a terceira pessoa, que por isso aparece no texto principal. A leitura em primeira pessoa, resultante de outra vocalização da mesma sequência consonantal e refletida em tradições textuais, permanece em nota para não resolver silenciosamente a identidade do interlocutor.
- issue: Sentido contextual de חַסְדּוֹ
  choice: “toda a sua beleza”
  alternative: “toda a sua glória”, “toda a sua bondade” ou “toda a sua lealdade”
  rationale: O paralelismo com a flor favorece uma qualidade admirável e visível da humanidade, mas o campo semântico usual de חֶסֶד torna a expressão deliberadamente densa. A nota preserva essa amplitude sem introduzir no texto principal uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a imagem concreta de “toda carne” e a repetição de “clamar”. A pontuação distingue claramente as duas falas, e as notas preservam as ambiguidades textual e lexical relevantes.
