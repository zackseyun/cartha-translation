  terminology: “Yahweh” segue de forma consistente a decisão editorial de transliterar o Tetragrama. “Caminho”, “estrada” e “nosso Deus” comunicam bem a imagética de preparação de uma via para a chegada divina. Não há imposição interpretativa ou confessional indevida.
