  text: ק֣וֹל קוֹרֵ֔א בַּ/מִּדְבָּ֕ר פַּנּ֖וּ דֶּ֣רֶךְ יְהוָ֑ה יַשְּׁרוּ֙ בָּ/עֲרָבָ֔ה מְסִלָּ֖ה לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/003.yaml
  text: 'A voice cries: “In the wilderness prepare the way of Yahweh[a]; make straight in the desert a highway for our God.”'
translation:
  language: pt
  text: Uma voz clama:[a] “No deserto, preparem o caminho de Yahweh; na planície árida, endireitem uma estrada para o nosso Deus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo outra pontuação: “Uma voz clama no deserto: ‘Preparem o caminho de Yahweh; na planície árida, endireitem uma estrada para o nosso Deus.’”'
    reason: Leitura alternativa quanto à ligação sintática de “no deserto”.
lexical_decisions:
- source_word: ק֣וֹל
  choice: Uma voz
  rationale: קוֹל pode significar “voz” ou “som”. Com o particípio קוֹרֵא, “Uma voz” introduz naturalmente a proclamação profética sem identificar o mensageiro.
- source_word: קוֹרֵא
  choice: clama
  rationale: O particípio significa literalmente “chamando” ou “proclamando”. A forma finita “clama” é natural em português e mantém a força pública e enfática do anúncio.
- source_word: בַּמִּדְבָּר
  choice: No deserto
  rationale: A expressão pode ligar-se a “clama” ou à ordem “preparem”. A acentuação massorética favorece sua ligação com a ordem seguinte; a leitura alternativa é preservada em nota.
- source_word: פַּנּוּ
  choice: preparem
  rationale: Neste contexto, פנה designa desimpedir ou preparar uma rota. “Preparem” comunica com clareza a imagem da abertura de um caminho para a chegada divina.
- source_word: דֶּרֶךְ
  choice: o caminho
  rationale: דֶּרֶךְ pode ser caminho, estrada ou rota. “O caminho de Yahweh” preserva a formulação profética e a relação de construção com o nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome pessoal divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יַשְּׁרוּ
  choice: endireitem
  rationale: O verbo significa tornar reto ou nivelar. “Endireitem” conserva a ação verbal e o paralelismo com “preparem”.
- source_word: בָּעֲרָבָה
  choice: na planície árida
  rationale: עֲרָבָה designa uma estepe ou planície desértica. “Planície árida” é clara em português e evita tratar מִדְבָּר e עֲרָבָה como termos completamente idênticos.
- source_word: מְסִלָּה
  choice: uma estrada
  rationale: מְסִלָּה refere-se a uma via preparada, muitas vezes elevada ou construída. “Estrada” comunica uma rota deliberadamente preparada sem sugerir necessariamente uma rodovia moderna.
- source_word: לֵאלֹהֵינוּ
  choice: para o nosso Deus
  rationale: Embora אֱלֹהִים tenha forma plural, aqui é a designação singular normal do Deus de Israel; a preposição indica que a estrada é preparada para ele.
theological_decisions:
- issue: Ligação sintática de “no deserto”
  choice: 'Ligar “no deserto” à ordem: “No deserto, preparem o caminho de Yahweh”.'
  alternative: 'Ligar a expressão ao mensageiro: “Uma voz clama no deserto: ‘Preparem o caminho de Yahweh’”.'
  rationale: A acentuação massorética favorece a ligação com a ordem seguinte. Como o hebraico consonantal admite a outra divisão, conhecida também por suas citações no Novo Testamento, a alternativa é explicitamente preservada em nota, sem eliminar a ambiguidade histórica.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural adequados ao público coletivo. “Planície árida” diferencia os dois termos geográficos hebraicos, e “estrada” evita a associação excessivamente moderna de “rodovia”. O marcador de nota foi colocado após “clama” porque a nota trata precisamente do limite sintático nesse ponto.
