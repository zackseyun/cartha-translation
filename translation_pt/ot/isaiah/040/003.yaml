  source_fidelity: 'O texto traduz com precisão a sequência hebraica e seu paralelismo: “Uma voz clama”, a ordem de preparar o caminho de Yahweh, e a ordem paralela de endireitar uma estrada para nosso Deus. Os imperativos plurais refletem adequadamente o plural hebraico. “Planície árida” representa de modo defensável עֲרָבָה e distingue, sem forçar oposição rígida, esse termo de מִדְבָּר.'
