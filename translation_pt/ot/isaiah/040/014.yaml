id: ISA.40.14
reference: Isaiah 40:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֶת מִ֤י נוֹעָץ֙ וַ/יְבִינֵ֔/הוּ וַֽ/יְלַמְּדֵ֖/הוּ בְּ/אֹ֣רַח מִשְׁפָּ֑ט וַ/יְלַמְּדֵ֣/הוּ דַ֔עַת וְ/דֶ֥רֶךְ תְּבוּנ֖וֹת יוֹדִיעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/014.yaml
  text: Whom did he consult[a], and who gave him understanding? Who taught him the path of justice, taught him knowledge[b], and made known to him the way of understanding?
translation:
  language: pt
  text: A quem ele consultou, e quem o fez entender? Quem lhe ensinou o caminho da justiça[a], lhe ensinou o conhecimento e lhe deu a conhecer o caminho do discernimento[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do juízo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da compreensão” ou “do entendimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי נוֹעָץ
  choice: A quem ele consultou
  rationale: אֶת מִי introduz a pessoa consultada, e נוֹעָץ, forma nifal de יעץ, expressa a ideia de buscar conselho. “A quem ele consultou” é claro e natural em português, mantendo a pergunta retórica.
- source_word: וַיְבִינֵהוּ
  choice: e quem o fez entender
  rationale: 'O hifil de בין tem sentido causativo: “fazer compreender/entender”. A formulação preserva essa força sem transformar o verbo em mera instrução.'
- source_word: וַיְלַמְּדֵהוּ
  choice: lhe ensinou
  rationale: Traduz diretamente a ação de ensinar e é repetido na segunda ocorrência para refletir a repetição hebraica.
- source_word: בְּאֹרַח מִשְׁפָּט
  choice: o caminho da justiça
  rationale: אֹרַח designa caminho ou vereda, enquanto מִשְׁפָּט pode significar justiça, juízo ou julgamento. “Caminho da justiça” comunica bem o curso correto e preserva a imagem sapiencial.
- source_word: דַעַת
  choice: o conhecimento
  rationale: “Conhecimento” preserva a distinção lexical em relação a בין, ligado a entender, e תְּבוּנוֹת, ligado a discernimento.
- source_word: וְדֶרֶךְ תְּבוּנוֹת
  choice: o caminho do discernimento
  rationale: דֶרֶךְ mantém o paralelismo com אֹרַח, e “discernimento” representa o plural abstrato תְּבוּנוֹת de modo idiomático, distinguindo-o das outras palavras cognitivas do versículo.
- source_word: יוֹדִיעֶנּוּ
  choice: lhe deu a conhecer
  rationale: O hifil de ידע é causativo, “fazer saber/tornar conhecido”. “Deu a conhecer” é uma expressão portuguesa natural que conserva esse valor.
theological_decisions:
- issue: Referente dos pronomes de terceira pessoa
  choice: Os pronomes permanecem sem a inserção explícita de “o SENHOR”, sendo identificados pelo contexto como referentes ao SENHOR.
  alternative: Inserir “o SENHOR” ou entender o referente como uma figura divina não especificada.
  rationale: Isaías 40:13–14 apresenta perguntas retóricas sobre a sabedoria independente e incomparável do SENHOR. Manter os pronomes segue a forma hebraica e deixa o contexto fornecer o referente.
- issue: Sentido de מִשְׁפָּט
  choice: justiça
  alternative: juízo ou julgamento
  rationale: No contexto sapiencial, “justiça” expressa com clareza o caminho normativamente correto, sem excluir o possível matiz judicial, registrado em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “lhe ensinou” e o paralelismo entre os dois “caminhos” foram preservados. As três expressões cognitivas foram diferenciadas como “entender”, “conhecimento” e “discernimento”.
