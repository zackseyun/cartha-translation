  text: Comfort[a], comfort my people[b], says your God.
translation:
  language: pt
  text: “Consolem, consolem o meu povo”, diz o Deus de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַחֲמוּ
  choice: Consolem
  rationale: O imperativo plural do piel de נחם convoca os destinatários a dar consolo. “Consolem” é natural, direto e mantém a força verbal sem ampliar o texto.
- source_word: נַחֲמוּ נַחֲמוּ
  choice: Consolem, consolem
  rationale: A repetição hebraica é preservada para transmitir ênfase, urgência e solenidade.
- source_word: עַמִּי
  choice: o meu povo
  rationale: עם designa aqui o povo em sentido comunitário e pactual; “o meu povo” preserva tanto a relação possessiva quanto essa ressonância.
- source_word: יֹאמַר
  choice: diz
  rationale: Embora a forma seja morfologicamente imperfeita e possa ser vertida como “dirá”, em introduções proféticas de fala ela tem valor declarativo corrente; “diz” é idiomático em português.
- source_word: אֱלֹהֵיכֶם
  choice: o seu Deus
  rationale: Apesar da forma morfologicamente plural de אֱלֹהִים, a referência é ao único Deus de Israel. O possessivo plural hebraico é expresso pelo português abrangente “seu”.
theological_decisions:
- issue: Identificação do falante e tom da aliança
  choice: “diz o seu Deus” como introdução da fala divina
  alternative: “dirá o seu Deus”, preservando de modo mais explícito o aspecto futuro da forma verbal
  rationale: A formulação identifica Deus como fonte da ordem e preserva a relação restaurada expressa por “meu povo” e “seu Deus”, sem especificar quem recebe os imperativos plurais.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem “o meu povo” e “o seu Deus” soa natural e conserva a solenidade do paralelismo pactual. Não foram incluídas notas, pois as alternativas lexicais não são necessárias para compreender o versículo.
