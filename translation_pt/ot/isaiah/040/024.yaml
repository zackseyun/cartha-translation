  text: אַ֣ף בַּל נִטָּ֗עוּ אַ֚ף בַּל זֹרָ֔עוּ אַ֛ף בַּל שֹׁרֵ֥שׁ בָּ/אָ֖רֶץ גִּזְעָ֑/ם וְ/גַם נָשַׁ֤ף בָּ/הֶם֙ וַ/יִּבָ֔שׁוּ וּ/סְעָרָ֖ה כַּ/קַּ֥שׁ תִּשָּׂאֵֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/024.yaml
  text: Scarcely are they planted[a], scarcely are they sown, scarcely has their stem taken root in the earth, when he merely blows on them and they wither[b], and a storm carries them away like stubble.
translation:
  language: pt
  text: Mal foram plantados[a], mal foram semeados, mal o seu caule criou raízes na terra, e basta que ele sopre sobre eles para que sequem; uma tempestade[b] os leva embora como restolho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nem sequer foram plantados... nem sequer o seu caule criou raízes na terra”. A repetição hebraica ressalta a rapidez com que o seu surgimento é desfeito.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um vendaval”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף בַּל
  choice: mal
  rationale: A repetição enfática expressa que cada ação mal chegou a acontecer antes que a destruição sobreviesse; “mal” preserva de modo natural em português essa força temporal e retórica.
- source_word: נִטָּעוּ
  choice: foram plantados
  rationale: O passivo de נטע apresenta metaforicamente os governantes como plantas recém-estabelecidas e mantém o paralelismo agrícola.
- source_word: זֹרָעוּ
  choice: foram semeados
  rationale: O passivo de זרע dá continuidade à imagem agrícola e ao paralelismo com “foram plantados”.
- source_word: שֹׁרֵשׁ
  choice: criou raízes
  rationale: A expressão portuguesa comunica naturalmente a ideia de se estabelecer na terra, sem tentar reproduzir a forma hebraica incomum de maneira obscura.
- source_word: גִּזְעָם
  choice: o seu caule
  rationale: גזע pode indicar tronco, cepa ou caule. “Caule” conserva a metáfora vegetal e funciona com o singular coletivo do hebraico.
- source_word: נָשַׁף
  choice: sopre sobre eles
  rationale: O verbo significa soprar ou respirar. A formulação preserva a imagem da ação divina fácil e direta.
- source_word: וַיִּבָשׁוּ
  choice: sequem
  rationale: יבש significa secar ou murchar; “sequem” é claro e mantém a imagem vegetal.
- source_word: סְעָרָה
  choice: uma tempestade
  rationale: O substantivo pode designar tempestade, tormenta ou vendaval. “Tempestade” é amplo, corrente e mantém a força destrutiva; a alternativa mais específica é registrada em nota.
- source_word: כַּקַּשׁ
  choice: como restolho
  rationale: קשׁ designa a palha ou os restos secos deixados no campo após a colheita. “Restolho” conserva essa imagem com maior precisão do que “palha” em sentido genérico.
- source_word: תִּשָּׂאֵם
  choice: os leva
  rationale: נשא aqui indica carregar ou arrebatar. “Os leva” expressa o movimento sem especificar além do texto o modo da remoção.
theological_decisions:
- issue: Referente do sujeito singular em “ele sopre sobre eles”
  choice: Deus é o sujeito implícito
  alternative: Um vento impessoal sopra sobre eles
  rationale: Em Isaías 40:23–24, continua em foco aquele que reduz os governantes a nada. O pronome pessoal preserva a agência divina do contexto sem inserir o nome de Deus onde o hebraico não o repete.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “mal” reproduz o ritmo poético e a urgência do hebraico; “e basta que” comunica a facilidade da ação divina sem acrescentar intensidade indevida.
