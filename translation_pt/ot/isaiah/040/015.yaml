id: ISA.40.15
reference: Isaiah 40:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֤ן גּוֹיִם֙ כְּ/מַ֣ר מִ/דְּלִ֔י וּ/כְ/שַׁ֥חַק מֹאזְנַ֖יִם נֶחְשָׁ֑בוּ הֵ֥ן אִיִּ֖ים כַּ/דַּ֥ק יִטּֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/015.yaml
  text: Look[a], the nations are like a drop from a bucket, and are regarded as dust on the scales; look[b], the coastlands he lifts like fine dust.
translation:
  language: pt
  text: Eis que as nações são como uma gota de um balde e são consideradas como pó sobre os pratos da balança; eis que as terras costeiras[a] ele ergue como pó fino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as ilhas”. O termo hebraico pode designar ilhas, regiões costeiras ou terras marítimas distantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Partícula deítica que chama a atenção para a imagem. “Eis que” conserva a força retórica e o paralelismo da repetição sem acrescentar uma conclusão lógica.
- source_word: גּוֹיִם
  choice: as nações
  rationale: Designa coletivamente os povos ou nações do mundo; o artigo definido é natural em português neste uso genérico.
- source_word: כְּמַר מִדְּלִי
  choice: como uma gota de um balde
  rationale: מַר indica uma gota, e a preposição מִן marca sua procedência. “De um balde” permanece próxima da formulação hebraica, sem substituí-la pela expressão proverbial “num balde”.
- source_word: וּכְשַׁחַק מֹאזְנַיִם
  choice: como pó sobre os pratos da balança
  rationale: שַׁחַק pode indicar pó fino, enquanto מֹאזְנַיִם designa uma balança. A menção aos pratos torna clara para o leitor moderno a imagem de uma quantidade sem peso perceptível.
- source_word: נֶחְשָׁבוּ
  choice: são consideradas
  rationale: O passivo de חשׁב expressa avaliação ou cômputo. “São consideradas” preserva esse sentido sem intensificá-lo.
- source_word: אִיִּים
  choice: as terras costeiras
  rationale: Em Isaías, o termo frequentemente abrange ilhas, litorais e terras marítimas distantes. “Terras costeiras” comunica essa amplitude geográfica.
- source_word: כַּדַּק
  choice: como pó fino
  rationale: דַּק descreve algo fino, delgado ou diminuto; no contexto da imagem de peso insignificante, “pó fino” é concreto e natural.
- source_word: יִטּוֹל
  choice: ele ergue
  rationale: O verbo pode significar levantar, tomar ou carregar. “Ergue” preserva a imagem do manejo fácil das terras pelo sujeito implícito.
theological_decisions:
- issue: Sujeito implícito de יִטּוֹל
  choice: Manter o pronome “ele”, que no contexto remete a Deus, sem inserir o nome divino.
  alternative: Explicitar “Deus” ou “o Senhor”, ou empregar uma construção impessoal.
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas não traz sujeito expresso nesta oração. A ordem “as terras costeiras ele ergue” conserva a ênfase do hebraico e deixa a identificação do sujeito depender do contexto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência poética. A repetição de “eis que” reproduz a estrutura retórica hebraica; a ordem marcada da oração final conserva o destaque dado às terras costeiras.
