id: ISA.40.28
reference: Isaiah 40:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/ל֨וֹא יָדַ֜עְתָּ אִם לֹ֣א שָׁמַ֗עְתָּ אֱלֹהֵ֨י עוֹלָ֤ם יְהוָה֙ בּוֹרֵא֙ קְצ֣וֹת הָ/אָ֔רֶץ לֹ֥א יִיעַ֖ף וְ/לֹ֣א יִיגָ֑ע אֵ֥ין חֵ֖קֶר לִ/תְבוּנָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/028.yaml
  text: Have you not known? Have you not heard? Yahweh is the everlasting God[a], the Creator of the ends of the earth. He does not grow faint or become weary; his understanding is unsearchable.
translation:
  language: pt
  text: Você não sabe? Não ouviu? Yahweh[a] é o Deus eterno, o Criador dos confins da terra. Ele não se cansa nem fica exausto; seu entendimento é insondável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, o nome divino, tradicionalmente vertido como “SENHOR”.
    reason: Esclarece a transliteração do Tetragrama e registra a forma tradicional conhecida pelos leitores.
lexical_decisions:
- source_word: הֲלוֹא יָדַעְתָּ
  choice: Você não sabe?
  rationale: A partícula introduz uma pergunta retórica que espera resposta afirmativa e relembra ao ouvinte algo que ele já deveria saber. O presente é natural em português nesse tipo de repreensão retórica.
- source_word: אִם לֹא שָׁמַעְתָּ
  choice: Não ouviu?
  rationale: Embora אִם possa ser condicional em outros contextos, aqui a expressão funciona em paralelo com a pergunta anterior e é melhor entendida como uma segunda pergunta retórica.
- source_word: אֱלֹהֵי עוֹלָם
  choice: o Deus eterno
  rationale: A construção significa literalmente 'Deus da eternidade/perpetuidade'. 'O Deus eterno' expressa de modo natural a duração ilimitada indicada por עוֹלָם.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בּוֹרֵא
  choice: o Criador
  rationale: O particípio qal é usado substantivamente, em aposição, identificando Yahweh como Criador.
- source_word: קְצוֹת הָאָרֶץ
  choice: dos confins da terra
  rationale: Preserva a imagem hebraica das regiões mais distantes da terra em uma expressão bíblica natural em português.
- source_word: לֹא יִיעַף וְלֹא יִיגָע
  choice: não se cansa nem fica exausto
  rationale: Mantém o paralelismo e a progressão dos dois verbos próximos, distinguindo cansaço de exaustão completa em português corrente.
- source_word: אֵין חֵקֶר לִתְבוּנָתוֹ
  choice: seu entendimento é insondável
  rationale: A expressão literal 'não há investigação para o seu entendimento' afirma que ele não pode ser plenamente perscrutado; 'insondável' conserva essa imagem e é conciso.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino pessoal. A transliteração o preserva sem substituí-lo pelo título tradicional; uma nota auxilia leitores acostumados a outras formas.
- issue: Alcance de אֵין חֵקֶר לִתְבוּנָתוֹ
  choice: seu entendimento é insondável
  alternative: não há como investigar seu entendimento
  rationale: A formulação afirma a impossibilidade de sondar plenamente o entendimento de Deus, sem expandi-la para uma declaração sistemática mais abrangente sobre tudo o que pode ou não ser conhecido a respeito dele.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. As perguntas breves preservam a força retórica do hebraico; 'confins' e 'insondável' mantêm imagens tradicionais ainda compreensíveis, sem tornar o texto excessivamente arcaico.
