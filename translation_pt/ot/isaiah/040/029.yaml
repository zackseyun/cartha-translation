  text: נֹתֵ֥ן לַ/יָּעֵ֖ף כֹּ֑חַ וּ/לְ/אֵ֥ין אוֹנִ֖ים עָצְמָ֥ה יַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/029.yaml
  text: He gives strength to the weary[a], and to the one without vigor he increases might.
translation:
  language: pt
  text: Ele dá força ao cansado e aumenta o vigor daquele que não tem forças.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹתֵן
  choice: dá
  rationale: O particípio qal descreve, no contexto, uma ação característica e contínua de Deus; o presente simples em português expressa naturalmente esse valor geral.
- source_word: לַיָּעֵף
  choice: ao cansado
  rationale: O adjetivo designa alguém exausto ou fatigado. “Cansado” é claro, atual e mantém o paralelismo com a pessoa sem forças.
- source_word: כֹּחַ
  choice: força
  rationale: Neste contexto poético, o substantivo indica capacidade ou força pessoal, em contraste com o cansaço.
- source_word: וּלְאֵין אוֹנִים
  choice: daquele que não tem forças
  rationale: A construção expressa ausência de vigor ou capacidade. Esta formulação preserva a referência pessoal singular implícita e soa natural em português.
- source_word: עָצְמָה
  choice: vigor
  rationale: O substantivo denota força ou potência. “Vigor” distingue o termo de כֹּחַ sem enfraquecer o paralelismo poético.
- source_word: יַרְבֶּה
  choice: aumenta
  rationale: O hifil de רבה significa tornar muito, aumentar ou multiplicar; “aumenta” preserva o valor causativo com clareza idiomática.
theological_decisions:
- issue: Sujeito implícito do versículo
  choice: “Ele” refere-se a Deus, conforme o contexto imediato.
  alternative: Repetir explicitamente “Deus” ou “o SENHOR”.
  rationale: O hebraico não apresenta um sujeito explícito neste versículo, mas o contexto anterior descreve o SENHOR e suas ações. “Ele” preserva a continuidade discursiva sem acrescentar uma identificação redundante ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo hebraico e evita tanto arcaísmos como explicitação teológica além do contexto.
