source:
  edition: WLC
  text: יָבֵ֥שׁ חָצִ֖יר נָ֣בֵֽל צִ֑יץ וּ/דְבַר אֱלֹהֵ֖י/נוּ יָק֥וּם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/008.yaml
  text: The grass withers[a], the flower fades, but the word of our God will stand forever.
translation:
  language: pt
  text: A erva seca, a flor murcha, mas a palavra do nosso Deus permanecerá para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָבֵשׁ
  choice: seca
  rationale: O qal de יבש indica tornar-se seco ou ressecar. “Seca” é natural em português e mantém a imagem concreta, distinguindo-a do verbo aplicado à flor.
- source_word: חָצִיר
  choice: erva
  rationale: Neste contexto poético, חָצִיר designa a vegetação rasteira. “Erva” é ampla e natural, sem sugerir especificamente feno já cortado.
- source_word: נָבֵל
  choice: murcha
  rationale: נבל pode indicar murchar ou perder o viço. “Murcha” corresponde naturalmente à flor e preserva a distinção em relação à erva que seca.
- source_word: צִיץ
  choice: flor
  rationale: No paralelismo com a erva, צִיץ refere-se à flor ou ao broto florido; “flor” é a forma mais clara e comum.
- source_word: וּדְבַר
  choice: mas a palavra
  rationale: Embora ו seja normalmente “e”, o paralelismo estabelece contraste entre a vegetação passageira e a permanência da palavra divina. “Mas” expressa esse valor adversativo de modo idiomático.
- source_word: אֱלֹהֵינוּ
  choice: do nosso Deus
  rationale: A forma אֱלֹהִים com o sufixo de primeira pessoa do plural refere-se aqui, segundo o uso israelita, ao singular “nosso Deus”.
- source_word: יָקוּם
  choice: permanecerá
  rationale: קום significa literalmente levantar-se ou ficar de pé; neste contexto, comunica continuidade e firmeza. “Permanecerá” transmite a metáfora contextual de validade duradoura em português natural.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: A expressão idiomática indica duração ilimitada neste contraste com a transitoriedade da vegetação; “para sempre” é a equivalência corrente e clara.
theological_decisions:
- issue: Valor adversativo entre a criação passageira e a palavra divina permanente
  choice: mas
  alternative: e
  rationale: A conjunção hebraica pode ser traduzida formalmente por “e”, mas o contraste é estabelecido pelo próprio paralelismo. “Mas” o torna explícito sem acrescentar uma ideia alheia ao texto.
- issue: Amplitude semântica de דָּבָר
  choice: palavra
  alternative: promessa ou mensagem
  rationale: “Palavra” preserva a amplitude do termo hebraico e evita restringir a declaração divina a uma promessa ou mensagem específica.
- issue: Metáfora de permanência em יָקוּם
  choice: permanecerá
  alternative: ficará de pé
  rationale: “Ficará de pé” preservaria mais literalmente a imagem, mas pode soar corporal ou pouco idiomático aplicada a “palavra”. “Permanecerá” comunica seu sentido contextual sem limitar a palavra divina a mera sobrevivência textual.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural tanto no Brasil quanto em outros contextos lusófonos. O paralelismo poético e a distinção entre a erva que seca e a flor que murcha foram preservados.
