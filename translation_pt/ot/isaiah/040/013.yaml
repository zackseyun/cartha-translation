  text: מִֽי תִכֵּ֥ן אֶת ר֖וּחַ יְהוָ֑ה וְ/אִ֥ישׁ עֲצָת֖/וֹ יוֹדִיעֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/013.yaml
  text: Who has measured the Spirit of Yahweh[b][a], or what man has made his counsel known to him?
translation:
  language: pt
  text: Quem mediu o Espírito de Yahweh[a][b], ou que homem lhe deu a conhecer o seu conselho?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mente de Yahweh”. A palavra hebraica pode indicar espírito, sopro ou disposição interior; a tradição grega refletida em Romanos 11:34 traz “mente”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Quem dirigiu o Espírito de Yahweh?” / “Quem pode instruí-lo?”. Essas opções refletem interpretações dos verbos hebraicos e a antiga tradição grega.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; “Quem” reproduz com naturalidade a concisão do hebraico.
- source_word: תִכֵּן
  choice: mediu
  rationale: O verbo תכן pode envolver medir, pesar ou determinar. “Mediu” conserva a metáfora concreta e sua ligação com as imagens do contexto imediato de Isaías 40.
- source_word: רוּחַ
  choice: Espírito
  rationale: רוּחַ pode significar espírito, sopro, vento ou disposição interior. “Espírito”, com inicial maiúscula, é natural quando se refere ao Espírito de Yahweh, sem excluir a nuance de mente ou disposição indicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְאִישׁ
  choice: ou que homem
  rationale: אִישׁ é o singular “homem”; no paralelismo interrogativo, “que homem” expressa naturalmente a força retórica.
- source_word: עֲצָתוֹ
  choice: o seu conselho
  rationale: עֵצָה pode indicar conselho, plano ou propósito. “Conselho” mantém tanto a nuance deliberativa quanto a intencional.
- source_word: יוֹדִיעֶנּוּ
  choice: lhe deu a conhecer
  rationale: O hifil de ידע significa “fazer saber” ou “dar a conhecer”. A forma verbal hebraica é formalmente imperfeita, mas pode ter força perfectiva na pergunta retórica paralela; “deu a conhecer” mantém o paralelismo com “mediu” sem importar diretamente a interpretação “instruiu”.
theological_decisions:
- issue: Sentido de רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  alternative: a mente de Yahweh
  rationale: “Espírito” traduz diretamente um sentido central de רוּחַ e preserva a referência divina; a possível nuance de mente ou disposição interior permanece explícita em nota, inclusive por sua relevância para a tradição grega refletida em Romanos 11:34.
- issue: Relação expressa por יוֹדִיעֶנּוּ
  choice: lhe deu a conhecer o seu conselho
  alternative: o instruiu / pode instruí-lo
  rationale: A tradução escolhida conserva a construção causativa “dar a conhecer” e deixa a relação pronominal tão aberta quanto possível; “instruir” explicita uma implicação interpretativa e, por isso, fica na nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Yahweh” preserva o nome divino. A ordem dos marcadores [a][b] foi normalizada para corresponder à sequência das notas.
