base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/020.yaml
  text: He who is too poor for an offering chooses wood that will not rot[c][b][a]; he seeks out for himself a skilled craftsman to prepare an idol that will not totter.
translation:
  language: pt
  text: Quem é pobre demais para apresentar uma oferta[a] escolhe madeira que não apodreça; procura para si um artesão habilidoso, para preparar um ídolo[b] que não tombe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O empobrecido escolhe, como oferta, uma madeira que não apodreça”. A expressão inicial em hebraico é compacta e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “uma imagem esculpida”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que não se abale”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְסֻכָּן תְּרוּמָה
  choice: Quem é pobre demais para apresentar uma oferta
  rationale: A expressão hebraica inicial é compacta e de construção discutida. Esta formulação comunica a interpretação contextual mais provável — alguém sem recursos para uma oferta mais cara — sem transformar a pobreza em característica absoluta.
- source_word: עֵץ לֹא יִרְקַב
  choice: madeira que não apodreça
  rationale: Mantém a imagem concreta da escolha de um material durável e soa natural em português atual.
- source_word: חָרָשׁ חָכָם
  choice: um artesão habilidoso
  rationale: חָכָם descreve aqui competência técnica, não sabedoria moral; 'artesão habilidoso' expressa esse sentido.
- source_word: יְבַקֶּשׁ לוֹ
  choice: procura para si
  rationale: Reproduz tanto a procura deliberada quanto o valor benefactivo de לוֹ, em ordem natural no português.
- source_word: לְהָכִין
  choice: para preparar
  rationale: Preserva o sentido amplo de tornar pronto ou estabelecer, sem especificar além do hebraico cada etapa da fabricação.
- source_word: פֶּסֶל
  choice: um ídolo
  rationale: '''Ídolo'' é lexicalmente legítimo e torna clara a força polêmica do contexto; a alternativa mais formal, ''imagem esculpida'', é registrada em nota.'
- source_word: לֹא יִמּוֹט
  choice: que não tombe
  rationale: Expressa de modo concreto e inteligível a instabilidade física que o fabricante tenta evitar, preservando a ironia do texto.
theological_decisions:
- issue: Sentido de פֶּסֶל na crítica à idolatria
  choice: um ídolo
  alternative: uma imagem esculpida
  rationale: O contexto ridiculariza a fabricação de uma falsa divindade. 'Ídolo' comunica diretamente essa força teológica sem exceder o campo semântico do termo hebraico.
- issue: Construção da expressão inicial הַמְסֻכָּן תְּרוּמָה
  choice: Quem é pobre demais para apresentar uma oferta
  alternative: O empobrecido escolhe como oferta
  rationale: A sintaxe hebraica admite mais de uma análise. A leitura principal segue a relação contextual entre falta de recursos e escolha de material barato, enquanto a nota conserva a alternativa sem resolver artificialmente a ambiguidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a ironia profética: alguém procura garantir estabilidade a um objeto que ele próprio manda fabricar.'
