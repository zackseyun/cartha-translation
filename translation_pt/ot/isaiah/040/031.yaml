source:
  edition: WLC
  text: וְ/קוֹיֵ֤ יְהוָה֙ יַחֲלִ֣יפוּ כֹ֔חַ יַעֲל֥וּ אֵ֖בֶר כַּ/נְּשָׁרִ֑ים יָר֨וּצוּ֙ וְ/לֹ֣א יִיגָ֔עוּ יֵלְכ֖וּ וְ/לֹ֥א יִיעָֽפוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/031.yaml
  text: But those who wait for Yahweh will renew their strength[a]; they will rise up with wings like eagles; they will run and not grow weary[b]; they will walk and not faint.
translation:
  language: pt
  text: Mas os que esperam por Yahweh renovarão suas forças[a]; subirão com asas como as águias[b]; correrão e não se cansarão; caminharão e não desfalecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que põem sua esperança em Yahweh”. O verbo hebraico combina a ideia de esperar com esperança confiante.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico pode designar grandes aves de rapina, incluindo águias e abutres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/קוֹיֵ יְהוָה
  choice: Mas os que esperam em Yahweh
  rationale: O particípio de קוה expressa espera marcada por expectativa e esperança. “Esperam em” é natural em português e mantém tanto a dimensão temporal quanto a confiança implícita. “Mas” explicita o contraste com o cansaço dos jovens no versículo anterior.
- source_word: יַחֲלִיפוּ כֹחַ
  choice: renovam suas forças
  rationale: A expressão pode indicar renovar ou recuperar vigor. O presente com valor geral/prospectivo é natural na formulação da promessa em português, e “suas forças” torna explícita a relação possessiva implícita.
- source_word: יַעֲלוּ אֵבֶר
  choice: sobem com asas
  rationale: Preserva o movimento ascendente de עלה e a imagem concreta de אֵבֶר, “asa”, sem recorrer ao mais interpretativo “levantam voo”.
- source_word: כַּ/נְּשָׁרִים
  choice: como as águias
  rationale: נשר designa uma grande ave de rapina e, na imagem poética de voo elevado e vigor, “águias” é a tradução tradicional e contextualmente adequada; a amplitude zoológica do termo é registrada em nota.
- source_word: יָרוּצוּ וְ/לֹא יִיגָעוּ
  choice: correm e não se cansam
  rationale: Mantém a coordenação e o paralelismo hebraicos em português corrente. יגע indica ficar cansado ou exausto pelo esforço.
- source_word: יֵלְכוּ וְ/לֹא יִיעָפוּ
  choice: caminham e não desfalecem
  rationale: “Caminham” preserva o contraste poético com “correm”; “desfalecem” comunica a exaustão intensa expressa por יעף.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio יהוה. A transliteração “Yahweh” preserva sua condição de nome pessoal, em vez de substituí-lo por um título.
- issue: Nuance de קוה
  choice: esperam em Yahweh
  alternative: põem sua esperança em Yahweh
  rationale: קוה reúne as ideias de esperar e esperar com esperança. O texto principal conserva a imagem concreta da espera, enquanto a nota registra explicitamente sua dimensão de esperança confiante.
- issue: Valor temporal dos imperfeitos hebraicos
  choice: 'presente de promessa: “renovam... sobem... correm... caminham”'
  alternative: 'futuro: “renovarão... subirão... correrão... caminharão”'
  rationale: No contexto, os imperfeitos exprimem o resultado prometido para quem espera em Yahweh. O presente português comunica uma verdade geral e recorrente sem excluir sua orientação prospectiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conserva o paralelismo poético e a progressão “sobem... correm... caminham”, evitando formulações excessivamente arcaicas.
