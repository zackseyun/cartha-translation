  text: Até os jovens desfalecem e se cansam, e os moços certamente tropeçam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִעֲפוּ
  choice: ficam exaustos
  rationale: O Qal imperfeito de עוף expressa aqui fraqueza ou exaustão; «ficam exaustos» comunica naturalmente a mudança de estado.
- source_word: נְעָרִים
  choice: os jovens
  rationale: נְעָרִים designa jovens ou rapazes; «os jovens» é amplo, natural e adequado ao paralelismo.
- source_word: וְיִגָעוּ
  choice: cansados
  rationale: יגע significa cansar-se ou ficar fatigado. Em coordenação com «ficam», a expressão «ficam exaustos e cansados» preserva os dois verbos sem rigidez desnecessária.
- source_word: וּבַחוּרִים
  choice: os que estão no vigor da juventude
  rationale: בַחוּרִים refere-se a jovens em plena força. A formulação distingue o termo de נְעָרִים e expressa o vigor contextual sem introduzir a ideia lexicalmente injustificada de que sejam «escolhidos».
- source_word: כָּשׁוֹל יִכָּשֵׁלוּ
  choice: tropeçam sem falta
  rationale: O infinitivo absoluto seguido do verbo finito intensifica ou torna enfática a ação. «Sem falta» preserva a certeza enfática sem converter necessariamente o tropeço em queda definitiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. Preferiu-se «os que estão no vigor da juventude» para representar a distinção entre נְעָרִים e בַחוּרִים sem recorrer a «escolhidos», sentido inadequado neste contexto.
