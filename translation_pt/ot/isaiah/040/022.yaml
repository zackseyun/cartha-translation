base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/022.yaml
  text: He is the one who sits above the circle of the earth[a], and its inhabitants are like grasshoppers[b]; who stretches out the heavens like a curtain and spreads them out like a tent to dwell in.
translation:
  language: pt
  text: É ele quem está sentado acima do círculo da terra[a]; seus habitantes são como gafanhotos. É ele quem estende os céus como um tecido fino[b] e os desdobra como uma tenda para habitar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abóbada” ou “horizonte da terra”. A palavra hebraica pode indicar uma extensão circular ou um limite semelhante a uma cúpula.
    reason: lexical_alternative
  - marker: b
    text: Ou “como gaze” ou “como um véu”. O termo hebraico se refere a algo fino ou delicado.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב
  choice: É ele quem está sentado
  rationale: O particípio substantivado descreve uma condição contínua. A formulação é natural em português e não acrescenta a noção explícita de entronização, ausente do verbo.
- source_word: עַל חוּג הָאָרֶץ
  choice: acima do círculo da terra
  rationale: “Acima” comunica a exaltação espacial sugerida pelo contexto; “círculo” preserva a imagem hebraica sem impor um modelo cosmológico específico.
- source_word: וְיֹשְׁבֶיהָ
  choice: seus habitantes
  rationale: Equivalente corrente e conciso para o particípio substantivado com sufixo pronominal.
- source_word: כַחֲגָבִים
  choice: como gafanhotos
  rationale: Mantém a comparação visual de pequenez; o substantivo hebraico pode designar gafanhotos ou insetos semelhantes.
- source_word: הַנּוֹטֶה
  choice: É ele quem estende
  rationale: Retoma naturalmente, em português, a descrição participial de Deus e preserva a imagem de estender os céus.
- source_word: כַדֹּק
  choice: como um tecido fino
  rationale: דֹק designa algo fino ou delicado. “Tecido fino” conserva essa qualidade sem restringir indevidamente a imagem a um objeto específico.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Preserva o alcance cosmológico e o registro poético do plural hebraico.
- source_word: וַיִּמְתָּחֵם
  choice: e os abre
  rationale: Expressa a ideia de estender ou desdobrar e evita repetição pesada logo após “estende”, mantendo a metáfora da tenda.
- source_word: כָּאֹהֶל לָשָׁבֶת
  choice: como uma tenda para habitação
  rationale: Conserva a comparação com a tenda e a finalidade de habitar, sem determinar de modo indevido quem habita nela.
theological_decisions:
- issue: Imagem cosmológica em חוּג הָאָרֶץ
  choice: círculo da terra
  alternative: abóbada da terra; horizonte da terra
  rationale: A linguagem é poética e exalta a transcendência e o poder criador de Deus. “Círculo” preserva a imagem e sua abertura lexical, sem convertê-la em afirmação científica moderna.
- issue: Sujeito implícito de לָשָׁבֶת
  choice: para habitação
  alternative: para nela habitar; para que nela se habite
  rationale: A expressão nominal mantém em aberto o referente do infinitivo hebraico e evita decidir se a habitação é apresentada especificamente como sendo de Deus ou dos habitantes da terra.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético reforçado pela repetição de “É ele quem”. “Terra” e “céus” mantêm o alcance cósmico; “para habitação” preserva a concisão e a ambiguidade do infinitivo final.
