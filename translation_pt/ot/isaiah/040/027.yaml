  text: לָ֤/מָּה תֹאמַר֙ יַֽעֲקֹ֔ב וּ/תְדַבֵּ֖ר יִשְׂרָאֵ֑ל נִסְתְּרָ֤ה דַרְכִּ/י֙ מֵֽ/יְהוָ֔ה וּ/מֵ/אֱלֹהַ֖/י מִשְׁפָּטִ֥/י יַעֲבֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/040/027.yaml
  text: Why do you say[a], O Jacob, and speak, O Israel, “My way is hidden from Yahweh, and my justice is disregarded by my God”?
translation:
  language: pt
  text: 'Por que você diz, ó Jacó, e declara, ó Israel: “Meu caminho está escondido de Yahweh, e meu direito[a] é ignorado pelo meu Deus”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha causa” ou “a justiça que me é devida”. O termo hebraico pode indicar o direito de alguém, sua causa judicial ou sua reivindicação por justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Mantém a força da pergunta retórica em português natural.
- source_word: תֹאמַר ... וּתְדַבֵּר
  choice: você diz ... e declara
  rationale: Preserva a variação entre אמר e דבר sem produzir um paralelismo artificial; “declara” comunica fala expressa e deliberada.
- source_word: יַעֲקֹב ... יִשְׂרָאֵל
  choice: ó Jacó ... ó Israel
  rationale: Conserva os dois nomes paralelos usados para interpelar o povo; “ó” marca claramente o vocativo em registro digno.
- source_word: נִסְתְּרָה דַרְכִּי
  choice: Meu caminho está oculto
  rationale: Preserva tanto a forma passiva quanto a metáfora de דרך para o curso ou as circunstâncias da vida.
- source_word: מֵיְהוָה
  choice: a Yahweh
  rationale: O nome divino é transliterado como “Yahweh”; a preposição “a” expressa que o caminho estaria fora de sua percepção.
- source_word: מִשְׁפָּטִי
  choice: meu direito
  rationale: No contexto da queixa, מִשְׁפָּטִי pode indicar o direito ou a reivindicação de alguém à justiça. “Meu direito” é idiomático, sem eliminar as alternativas “minha causa” e “a justiça que me é devida”.
- source_word: יַעֲבוֹר
  choice: é ignorado
  rationale: O sentido contextual do verbo é que a reivindicação passa sem receber atenção. A forma passiva produz em português uma queixa clara e natural, sem atribuir uma razão à aparente negligência.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal e pactual presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de מִשְׁפָּטִי na queixa de Israel
  choice: meu direito
  alternative: minha causa; a justiça que me é devida
  rationale: O termo admite dimensões jurídicas relacionadas entre si. A tradução mantém a tensão da alegação de que Deus não estaria atendendo ao direito do povo, enquanto a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo poético e os vocativos foram mantidos; a formulação da queixa permanece perceptiva, sem endossá-la nem explicar antecipadamente a resposta dos versículos seguintes.
