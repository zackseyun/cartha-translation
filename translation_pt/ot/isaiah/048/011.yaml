  text: לְמַעֲנִ֧/י לְמַעֲנִ֛/י אֶעֱשֶׂ֖ה כִּ֣י אֵ֣יךְ יֵחָ֑ל וּ/כְבוֹדִ֖/י לְ/אַחֵ֥ר לֹֽא אֶתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/011.yaml
  text: For my own sake[a], for my own sake, I will act; for how can it be profaned? And my glory I will not give to another.
translation:
  language: pt
  text: Por minha causa, por minha causa, agirei; pois como poderia ser profanado?[a] E a minha glória não darei a outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois como poderia o meu nome ser profanado?” O hebraico deixa implícito o referente de “ser profanado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעֲנִי
  choice: por minha própria causa
  rationale: A expressão indica motivo ou finalidade em favor do próprio Deus. “Própria” transmite a força reflexiva, e a repetição integral preserva a ênfase hebraica.
- source_word: אֶעֱשֶׂה
  choice: agirei
  rationale: O verbo עשה é amplo, e aqui não traz objeto expresso. “Agirei” comunica intervenção decidida sem acrescentar o que Deus fará.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão explicativa da declaração anterior, com tom elevado, mas natural.
- source_word: אֵיךְ יֵחָל
  choice: como poderia haver profanação?
  rationale: O nifal de חלל significa “ser profanado”, mas o referente não está expresso no hebraico. A formulação impessoal evita inserir “meu nome” ou “eu” no texto principal e mantém a força da pergunta retórica.
- source_word: וּכְבוֹדִי
  choice: Não darei a minha glória
  rationale: כבוד significa “glória” ou “honra”; “glória” se ajusta à autodeclaração divina. A conjunção hebraica é representada pela continuidade direta da frase, natural em português.
- source_word: לְאַחֵר
  choice: a outro
  rationale: Mantém de modo conciso a referência a qualquer outro pretendente, sem especificar ídolos ou outra entidade além do que diz o texto.
- source_word: אֶתֵּן
  choice: darei
  rationale: נתן tem o sentido comum de “dar”; a forma simples preserva o paralelismo e a firmeza da declaração.
theological_decisions:
- issue: Referente implícito em יֵחָל (“ser profanado”)
  choice: 'Manter o referente não expresso por meio de uma construção impessoal: “como poderia haver profanação?”'
  alternative: “como poderia o meu nome ser profanado?” ou “como eu poderia ser profanado?”
  rationale: O hebraico não explicita o sujeito de “ser profanado”. “Meu nome” é uma interpretação provável e tradicional, mas incluí-la no texto principal eliminaria uma ambiguidade genuína; por isso, aparece apenas na nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição enfática do original foi preservada. A construção impessoal na pergunta é deliberada para conservar a indeterminação do hebraico.
