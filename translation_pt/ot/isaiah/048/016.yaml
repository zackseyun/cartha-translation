  text: קִרְב֧וּ אֵלַ֣/י שִׁמְעוּ זֹ֗את לֹ֤א מֵ/רֹאשׁ֙ בַּ/סֵּ֣תֶר דִּבַּ֔רְתִּי מֵ/עֵ֥ת הֱיוֹתָ֖/הּ שָׁ֣ם אָ֑נִי וְ/עַתָּ֗ה אֲדֹנָ֧/י יְהוִ֛ה שְׁלָחַ֖/נִי וְ/רוּחֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/016.yaml
  text: 'Come near to me[a]; hear this: From the beginning I have not spoken in secret; from the time it came to be, I was there. And now the Lord GOD has sent me[c][b], and his Spirit.'
translation:
  language: pt
  text: 'Aproximem-se de mim; ouçam isto: Desde o princípio, não falei em segredo; desde o momento em que isso veio a existir[a], eu estava lá. E agora o Senhor Yahweh enviou-me e o seu espírito[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde o momento em que isso aconteceu” ou “desde o momento em que isso existiu”. O hebraico diz literalmente: “desde o tempo de seu ser”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico não identifica explicitamente quem fala. A expressão “e o seu espírito” pode ser entendida como coordenada com “me” (“enviou-me e o seu espírito”); o sentido preciso de “espírito” e sua relação na frase permanecem abertos.
    reason: alternative_reading
lexical_decisions:
- source_word: קִרְבוּ אֵלַי
  choice: Aproximem-se de mim
  rationale: O imperativo qal plural de קרב expressa um chamado direto para que os ouvintes se aproximem; esta formulação é natural, clara e preserva o número plural.
- source_word: שִׁמְעוּ זֹאת
  choice: ouçam isto
  rationale: Mantém o imperativo plural e o demonstrativo de modo conciso e idiomático.
- source_word: לֹא מֵרֹאשׁ בַּסֵּתֶר דִּבַּרְתִּי
  choice: Desde o princípio, não falei em segredo
  rationale: מֵרֹאשׁ indica o começo ou ponto inicial, e בַּסֵּתֶר indica ocultamento ou segredo. O perfeito verbal é vertido pelo pretérito perfeito, natural no contexto retrospectivo.
- source_word: מֵעֵת הֱיוֹתָהּ
  choice: desde o momento em que isso veio a existir
  rationale: A expressão significa literalmente 'desde o tempo de seu ser'. O pronome neutro 'isso' evita determinar em excesso o referente feminino implícito e 'veio a existir' preserva a amplitude entre surgimento, existência e acontecimento.
- source_word: שָׁם אָנִי
  choice: eu estava lá
  rationale: Embora a frase seja nominal, o contexto retrospectivo favorece o imperfeito português para indicar presença no momento mencionado.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a forma confusa 'Senhor SENHOR' e seguindo a orientação fornecida de representar o nome da aliança como Yahweh.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O perfeito com sufixo de primeira pessoa indica que o Senhor Yahweh realizou o envio; o pretérito perfeito é direto e natural em português.
- source_word: וְרוּחוֹ
  choice: e o seu Espírito
  rationale: Mantém a conjunção e o substantivo com sufixo possessivo como elemento coordenado, sem acrescentar 'com'. A inicial maiúscula apresenta a leitura pessoal mais provável no contexto, enquanto a nota registra a ambiguidade.
theological_decisions:
- issue: Identidade do falante
  choice: Manter a fala na primeira pessoa sem identificar explicitamente quem fala
  alternative: Identificar o falante como o Servo ou Messias
  rationale: O hebraico não nomeia explicitamente o falante neste versículo. A tradução conserva essa indeterminação em vez de inserir uma identificação cristológica no texto.
- issue: Construção e sentido de וְרוּחוֹ
  choice: e o seu Espírito
  alternative: e o seu espírito; ou entender a expressão como 'com o seu Espírito'
  rationale: A coordenação literal permite entender o Espírito como outro agente ligado ao envio, mas a sintaxe é breve e admite outras construções. A tradução não acrescenta uma preposição ausente e registra as alternativas em nota.
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Yahweh; o Senhor DEUS
  rationale: A formulação distingue o título do nome próprio divino e preserva o nome da aliança conforme a orientação doutrinária mais recente fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a concisão proféticas foram preservadas sem tornar a sintaxe artificial. As ambiguidades referentes à identidade do falante, ao antecedente de הֱיוֹתָהּ e à função de וְרוּחוֹ foram mantidas ou documentadas em notas.
