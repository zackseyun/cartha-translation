  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֣את בֵּֽית יַעֲקֹ֗ב הַ/נִּקְרָאִים֙ בְּ/שֵׁ֣ם יִשְׂרָאֵ֔ל וּ/מִ/מֵּ֥י יְהוּדָ֖ה יָצָ֑אוּ הַֽ/נִּשְׁבָּעִ֣ים בְּ/שֵׁ֣ם יְהוָ֗ה וּ/בֵ/אלֹהֵ֤י יִשְׂרָאֵל֙ יַזְכִּ֔ירוּ לֹ֥א בֶ/אֱמֶ֖ת וְ/לֹ֥א בִ/צְדָקָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/001.yaml
  text: Hear this[a], house of Jacob, you who are called by the name of Israel and who came out from the waters of Judah, who swear by the name of Yahweh and invoke the God of Israel, but not in truth or in righteousness.
translation:
  language: pt
  text: Ouçam isto, casa de Jacó, vocês que são chamados pelo nome de Israel e que saíram das águas de Judá[a], que juram pelo nome de Yahweh e invocam o Deus de Israel, mas não com verdade nem com justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “das águas de Judá”, provavelmente no sentido de “da descendência de Judá” ou “dos lombos de Judá”.'
    reason: Esclarece uma imagem hebraica incomum cujo provável sentido idiomático é a descendência física.
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Ouçam isto
  rationale: O imperativo plural seguido do demonstrativo constitui uma convocação direta. “Ouçam isto” é natural em português e mantém a força do hebraico.
- source_word: בֵּית יַעֲקֹב
  choice: casa de Jacó
  rationale: Preserva a expressão profética tradicional e sua ressonância intertextual, sem restringi-la à ideia moderna de residência.
- source_word: הַנִּקְרָאִים בְּשֵׁם יִשְׂרָאֵל
  choice: vocês que são chamados pelo nome de Israel
  rationale: Mantém a construção passiva e a ideia de designação pelo nome, com possível nuance identitária e pactual.
- source_word: וּמִמֵּי יְהוּדָה יָצָאוּ
  choice: e que saíram das águas de Judá
  rationale: Conserva no texto a imagem incomum e poeticamente concreta do hebraico; a nota esclarece seu provável sentido de descendência.
- source_word: הַנִּשְׁבָּעִים בְּשֵׁם יְהוָה
  choice: que juram pelo nome de Yahweh
  rationale: Expressa a realização de juramentos mediante a invocação do nome divino e permanece próxima da forma hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וּבֵאלֹהֵי יִשְׂרָאֵל יַזְכִּירוּ
  choice: e invocam o Deus de Israel
  rationale: Neste contexto religioso e ligado a juramentos, o hifil de זכר indica fazer menção solene ou invocar, não apenas recordar mentalmente.
- source_word: לֹא בֶאֱמֶת
  choice: mas não com verdade
  rationale: Preserva a amplitude de אֱמֶת, que pode envolver verdade, sinceridade e fidelidade, sem reduzir a expressão a apenas uma dessas nuances.
- source_word: וְלֹא בִצְדָקָה
  choice: nem com justiça
  rationale: “Justiça” comunica de modo natural a conformidade moral e relacional expressa por צְדָקָה, mantendo aberta sua proximidade semântica com retidão.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico apresenta o tetragrama como nome pessoal. “Yahweh” o representa diretamente, sem substituí-lo por um título nem adotar uma forma híbrida tradicional.
- issue: Interpretação de מִמֵּי יְהוּדָה
  choice: Manter “das águas de Judá” no texto e explicar a provável referência à descendência em nota
  alternative: “da descendência de Judá” ou “dos lombos de Judá” no texto principal
  rationale: A formulação literal é genuinamente incomum e provavelmente funciona como imagem ou eufemismo para origem física. Preservá-la evita ocultar a forma do original, enquanto a nota garante compreensão.
- issue: Sentido de אֱמֶת e צְדָקָה na denúncia
  choice: “com verdade” e “com justiça”
  alternative: “com fidelidade” e “com retidão” ou “sinceramente e de modo justo”
  rationale: Os substantivos hebraicos possuem campos semânticos amplos. A redação escolhida conserva a tensão entre sinceridade, fidelidade, justiça e retidão, sem limitar antecipadamente a acusação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural explícito “vocês” esclarece os particípios que retomam o destinatário coletivo. A imagem literal “águas de Judá” foi preservada por transparência ao original e acompanhada de nota.
