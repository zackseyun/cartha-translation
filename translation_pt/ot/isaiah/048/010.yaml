  text: הִנֵּ֥ה צְרַפְתִּ֖י/ךָ וְ/לֹ֣א בְ/כָ֑סֶף בְּחַרְתִּ֖י/ךָ בְּ/כ֥וּר עֹֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/010.yaml
  text: Behold[a], I have refined you, but not as silver[b]; I have chosen you in the furnace of affliction.
translation:
  language: pt
  text: Eis que refinei você, mas não como a prata[a]; escolhi você[b] na fornalha da aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “não com prata” ou “não em prata”. A expressão é difícil; provavelmente indica que esse refino não ocorreu do mesmo modo que o refino da prata.
    reason: lexical_alternative
  - marker: b
    text: Ou, “pus você à prova”. Embora o verbo hebraico signifique normalmente “escolher”, alguns entendem aqui o sentido de pôr à prova ou testar, de acordo com a imagem do refino.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força enfática que chama a atenção para a declaração, em registro profético digno e ainda compreensível.
- source_word: צְרַפְתִּיךָ
  choice: refinei você
  rationale: Preserva a metáfora metalúrgica de צרף e a ligação com a prata e a fornalha.
- source_word: וְלֹא בְכָסֶף
  choice: mas não como a prata
  rationale: Entende a preposição בְּ em sentido comparativo, leitura contextual provável, sem esconder que a expressão hebraica é difícil.
- source_word: בְּחַרְתִּיךָ
  choice: escolhi você
  rationale: Traduz בחר segundo seu sentido lexical comum, preservando no texto principal a ideia de escolha; a possibilidade contextual de ‘provei’ é registrada em nota.
- source_word: בְּכוּר
  choice: na fornalha
  rationale: כור designa uma fornalha usada na metalurgia; ‘fornalha’ mantém a imagem de refino de modo claro.
- source_word: עֹנִי
  choice: aflição
  rationale: Expressa sofrimento, miséria ou condição aflitiva e conserva a gravidade e a amplitude do termo hebraico.
theological_decisions:
- issue: Sentido de בְּחַרְתִּיךָ no contexto metalúrgico
  choice: escolhi você
  alternative: provei você
  rationale: Embora o contexto de refino favoreça para alguns a noção de provar, o sentido normal de בחר é ‘escolher’. A tradução principal segue esse valor lexical sem transformar a escolha em uma afirmação doutrinária mais específica; a leitura contextual alternativa é preservada em nota.
- issue: Natureza do refino expresso por וְלֹא בְכָסֶף
  choice: não como a prata
  alternative: não com prata
  rationale: A comparação se ajusta melhor à metáfora do contexto, mas a sintaxe hebraica permite uma tradução mais literal e permanece difícil; por isso, a alternativa é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de “você” explicita o objeto masculino singular do hebraico sem recorrer a formas pronominais excessivamente formais. As imagens metalúrgicas e as ambiguidades lexicais relevantes foram preservadas.
