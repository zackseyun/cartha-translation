  text: הִקָּבְצ֤וּ כֻלְּ/כֶם֙ וּֽ/שֲׁמָ֔עוּ מִ֥י בָ/הֶ֖ם הִגִּ֣יד אֶת אֵ֑לֶּה יְהוָ֣ה אֲהֵב֔/וֹ יַעֲשֶׂ֤ה חֶפְצ/וֹ֙ בְּ/בָבֶ֔ל וּ/זְרֹע֖/וֹ כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/014.yaml
  text: 'Gather yourselves[a], all of you, and listen: who among them has declared these things? Yahweh loves him; he will carry out his purpose in Babylon, and his arm will be against the Chaldeans.'
translation:
  language: pt
  text: 'Reúnam-se, todos vocês, e escutem: quem entre eles anunciou estas coisas? Yahweh o ama; ele realizará seu propósito na Babilônia, e seu braço será contra os caldeus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh o ama; ele [Yahweh] realizará seu propósito na Babilônia, e seu braço será contra os caldeus”, entendendo-se que o sujeito de “realizará” e o referente de “seu braço” são Yahweh, e não seu agente escolhido.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ כֻלְּכֶם
  choice: Reúnam-se todos
  rationale: O imperativo nifal plural convoca todo o auditório a reunir-se; a forma reflexiva natural em português preserva tanto a exortação quanto a abrangência de כֻלְּכֶם.
- source_word: וּשֲׁמָעוּ
  choice: e escutem
  rationale: O imperativo de שׁמע pede atenção deliberada; “escutem” comunica isso de modo corrente.
- source_word: מִי בָהֶם הִגִּיד אֶת־אֵלֶּה
  choice: quem entre eles anunciou estas coisas?
  rationale: Mantém a pergunta retórica e traduz o hifil de נגד como anúncio público ou declaração prévia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: אֲהֵבוֹ
  choice: o ama
  rationale: O sufixo masculino singular é preservado, sem identificar no texto a pessoa favorecida; o perfeito expressa aqui uma relação de favor estabelecida, vertida naturalmente pelo presente.
- source_word: יַעֲשֶׂה חֶפְצוֹ
  choice: ele realizará o propósito de Yahweh
  rationale: עשה com חפץ indica executar uma vontade ou propósito. A explicitação de “Yahweh” evita em português atribuir necessariamente o propósito ao agente humano, ao mesmo tempo que mantém o agente como sujeito da ação na leitura principal.
- source_word: בְּבָבֶל
  choice: na Babilônia
  rationale: Preserva o valor locativo mais direto da preposição ב, sem impor silenciosamente o sentido adversativo “contra”.
- source_word: וּזְרֹעוֹ כַּשְׂדִּים
  choice: e seu braço será contra os caldeus
  rationale: Conserva “braço” como metáfora hebraica de força e supre a relação adversativa e o valor futuro exigidos pelo contexto da cláusula nominal.
theological_decisions:
- issue: Referência dos pronomes masculinos singulares em “Yahweh o ama; ele realizará... e seu braço...”
  choice: Na leitura principal, eles apontam para o agente humano favorecido por Yahweh, que executa o propósito divino na Babilônia.
  alternative: Yahweh pode ser entendido como sujeito de “realizará”, e “seu braço” como o próprio braço de Yahweh.
  rationale: O contexto imediato favorece um agente distinto chamado por Yahweh, mas a sintaxe hebraica admite a leitura alternativa; por isso, a ambiguidade teológica é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A redação evita arcaísmos, mantém a metáfora do “braço” e conserva em nota a ambiguidade real dos referentes pronominais.
