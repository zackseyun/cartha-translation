source:
  edition: WLC
  text: גַּ֣ם לֹֽא שָׁמַ֗עְתָּ גַּ֚ם לֹ֣א יָדַ֔עְתָּ גַּ֕ם מֵ/אָ֖ז לֹא פִתְּחָ֣ה אָזְנֶ֑/ךָ כִּ֤י יָדַ֨עְתִּי֙ בָּג֣וֹד תִּבְגּ֔וֹד וּ/פֹשֵׁ֥עַ מִ/בֶּ֖טֶן קֹ֥רָא לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/008.yaml
  text: Indeed[a], you had not heard; indeed, you had not known; indeed, from of old your ear had not been opened. For I knew that you would surely deal treacherously[b], and that from the womb you would be called a transgressor.
translation:
  language: pt
  text: De fato, você não tinha ouvido; de fato, não sabia; de fato, desde outrora seu ouvido não se abrira. Pois eu sabia que você certamente agiria traiçoeiramente e que, desde o ventre[a], seria chamado rebelde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde o nascimento”. O hebraico diz literalmente “desde o ventre”, uma expressão que pode caracterizar alguém desde sua origem ou desde o estágio mais antigo da vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם ... גַּם
  choice: não tinha ouvido, nem sabia; desde muito tempo
  rationale: A repetição acumula ênfase. Em português, a combinação de coordenação e pausa preserva o movimento retórico sem a rigidez pouco natural de repetir “de fato” três vezes.
- source_word: שָׁמַעְתָּ / יָדַעְתָּ
  choice: você não tinha ouvido, nem sabia
  rationale: Os perfeitos negados descrevem desconhecimento anterior; o mais-que-perfeito composto no primeiro verbo estabelece o plano temporal, enquanto “nem sabia” o continua naturalmente.
- source_word: מֵאָז
  choice: desde muito tempo
  rationale: Expressa um ponto remoto no passado com continuidade temporal, sem impor “desde o princípio”.
- source_word: פִתְּחָה אָזְנֶךָ
  choice: o seu ouvido não havia sido aberto
  rationale: Mantém a imagem hebraica e sua possível referência tanto à recepção quanto à revelação, sem explicá-la no corpo do texto.
- source_word: בָּגוֹד תִּבְגּוֹד
  choice: certamente agiria com traição
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a certeza do ato; “certamente” representa essa ênfase.
- source_word: פֹשֵׁעַ
  choice: rebelde
  rationale: O particípio substantivado designa quem se rebela ou rompe fidelidade; “rebelde” é direto, atual e adequado ao contexto de Israel.
- source_word: מִבֶּטֶן
  choice: desde o ventre
  rationale: Conserva a imagem concreta do hebraico e permite sua força idiomática de origem ou estágio mais antigo.
- source_word: קֹרָא לָךְ
  choice: seria chamado
  rationale: A formulação passiva comunica naturalmente a ideia de receber uma designação ou nome caracterizador.
theological_decisions:
- issue: Se “desde o ventre” afirma culpa pré-natal literal ou caracteriza idiomaticamente a rebeldia de Israel desde sua origem
  choice: Manter literalmente “desde o ventre” sem explicitação doutrinária no texto
  alternative: Traduzir interpretativamente como “desde o nascimento” ou afirmar culpa pessoal pré-natal
  rationale: O discurso se dirige corporativamente a Israel/Jacó e usa retórica de origem. A tradução preserva a imagem e a tensão sem convertê-la em formulação doutrinária.
- issue: Nuance de פֹשֵׁעַ
  choice: rebelde
  alternative: transgressor
  rationale: “Rebelde” preserva a noção relacional de insurgência e quebra de fidelidade; a nota registra a alternativa jurídica mais formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o paralelismo profético, mas evita repetições artificiais; a imagem do ouvido aberto e a expressão “desde o ventre” permanecem visíveis.
