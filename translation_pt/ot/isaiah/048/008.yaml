  - severity: medium
    issue: A nota de rodapé descreve de modo inexato a formulação literal e sua âncora é inadequada.
    rationale: O hebraico diz “um rebelde/transgressor, desde o ventre, se te chama/chamará”, não a expressão fixa “rebelde desde o ventre” como se esta fosse a única unidade lexical literal. A nota deve ancorar “desde o ventre” e explicar a alternativa idiomática “desde o nascimento”, sem alterar a caracterização do texto.
  - severity: low
