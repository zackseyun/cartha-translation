  naturalness: O português é em geral claro e moderno. “Desde muito tempo” é menos idiomático e menos preciso que “desde outrora” neste registro. “Seu ouvido não se abrira” conserva a imagem hebraica com naturalidade suficiente em registro profético.
  terminology: “Rebelde” traduz bem פֹשֵׁעַ no contexto de deslealdade e rebelião. “Agiria traiçoeiramente” expressa com mais naturalidade a intensificação de בָּגוֹד תִּבְגּוֹד do que “agiria com traição”.
