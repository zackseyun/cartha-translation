revisions:
- from: Você não tinha ouvido, nem sabia; desde muito tempo o seu ouvido não havia sido aberto. Pois eu sabia que você certamente agiria com traição e que, desde o ventre, seria chamado rebelde.[a]
  to: De fato, você não tinha ouvido; de fato, não sabia; de fato, desde outrora seu ouvido não se abrira. Pois eu sabia que você certamente agiria traiçoeiramente e que, desde o ventre[a], seria chamado rebelde.
  rationale: A revisão restabelece a força acumulativa da repetição de גַּם, melhora a expressão temporal de מֵאָז e corrige a nota para que ela corresponda ao texto hebraico e esteja ancorada na expressão que efetivamente explica. Mantêm-se a imagem do ouvido que se abre, a intensificação da ação traiçoeira, “rebelde” para פֹשֵׁעַ e a ambiguidade idiomática de “desde o ventre”.
