  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: צְא֣וּ מִ/בָּבֶל֮ בִּרְח֣וּ מִ/כַּשְׂדִּים֒ בְּ/ק֣וֹל רִנָּ֗ה הַגִּ֤ידוּ הַשְׁמִ֨יעוּ֙ זֹ֔את הוֹצִיא֖וּ/הָ עַד קְצֵ֣ה הָ/אָ֑רֶץ אִמְר֕וּ גָּאַ֥ל יְהוָ֖ה עַבְדּ֥/וֹ יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/020.yaml
  text: Go out from Babylon[a]; flee from the Chaldeans! Declare this with a shout of joy; make it heard; send it out to the end of the earth. Say[b], “Yahweh has redeemed his servant Jacob.”
translation:
  language: pt
  text: 'Saiam da Babilônia; fujam dos caldeus![a] Anunciem isto com um grito de alegria; façam que seja ouvido; levem isto até a extremidade da terra.[b] Digam: “Yahweh redimiu seu servo Jacó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da Caldeia”; literalmente, o hebraico diz “dos caldeus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “até os confins da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאוּ
  choice: Saiam
  rationale: Imperativo plural de יצא, indicando a saída da Babilônia; “saiam” preserva de modo natural a força direta da ordem.
- source_word: מִבָּבֶל
  choice: da Babilônia
  rationale: Expressa diretamente o lugar do qual os destinatários devem sair.
- source_word: בִּרְחוּ
  choice: fujam
  rationale: Preserva a urgência do imperativo ברח, mais forte do que simplesmente “deixem”.
- source_word: מִכַּשְׂדִּים
  choice: dos caldeus
  rationale: O hebraico usa o nome plural do povo, não o nome da região; a alternativa contextual “da Caldeia” é registrada em nota.
- source_word: בְּקוֹל רִנָּה
  choice: com um grito de alegria
  rationale: Comunica tanto a expressão vocal quanto o caráter jubiloso da proclamação em português atual.
- source_word: הַגִּידוּ
  choice: Anunciem
  rationale: O imperativo exige uma proclamação pública; “anunciem” é claro e mantém o tom profético.
- source_word: הַשְׁמִיעוּ
  choice: façam que seja ouvido
  rationale: Preserva a forma causativa do hifil de שמע, sem reduzi-la a mera repetição de “anunciem”.
- source_word: זֹאת
  choice: isto
  rationale: Mantém o demonstrativo que funciona como conteúdo da proclamação.
- source_word: הוֹצִיאוּהָ
  choice: levem-no
  rationale: O hifil de יצא com sufixo refere-se à mensagem anunciada; “levem-no” expressa sua difusão até longe sem recorrer ao anacrônico “publiquem”.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: até a extremidade da terra
  rationale: Conserva o singular hebraico קְצֵה e a ideia espacial de limite ou confim; a forma idiomática plural é indicada em nota.
- source_word: אִמְרוּ
  choice: Digam
  rationale: Reproduz com simplicidade o novo imperativo que introduz o conteúdo exato da proclamação.
- source_word: גָּאַל
  choice: redimiu
  rationale: Preserva o peso lexical de גאל como ato de redenção ou resgate e apresenta a ação como realizada, conforme o perfeito hebraico.
- source_word: עַבְדּוֹ יַעֲקֹב
  choice: seu servo Jacó
  rationale: Mantém a relação possessiva e a designação coletiva e pessoal de Jacó sem explicitação interpretativa adicional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome divino, em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Força de גָּאַל no contexto da libertação do exílio
  choice: redimiu
  alternative: resgatou; libertou
  rationale: “Redimiu” conserva a linguagem própria de גאל e sua ressonância de reivindicação e libertação, sem especificar além do que o contexto hebraico afirma.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural e vocabulário de ampla compreensão. A cadência breve preserva a urgência profética, enquanto “redimiu” mantém o peso teológico do hebraico. O marcador [b] foi colocado junto à expressão a que sua alternativa lexical efetivamente se refere.
