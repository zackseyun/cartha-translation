base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/018.yaml
  text: If only you had paid attention to my commandments! Then your peace would have been like a river[b][a], and your righteousness like the waves of the sea.
translation:
  language: pt
  text: Quem dera você tivesse dado atenção aos meus mandamentos![a] Então a sua paz teria sido como um rio, e a sua justiça[b], como as ondas do mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tivesse escutado os meus mandamentos” ou “tivesse dado ouvidos aos meus mandamentos”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “a sua retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּא
  choice: Quem dera
  rationale: Introduz com naturalidade em português um desejo não realizado, com tom de lamento, sem recorrer a uma formulação arcaica.
- source_word: הִקְשַׁ֖בְתָּ
  choice: você tivesse dado atenção
  rationale: O verbo indica escuta atenta e responsiva, não mera percepção auditiva. A construção no pretérito mais-que-perfeito composto preserva o caráter contrafactual.
- source_word: לְמִצְוֺתָי
  choice: aos meus mandamentos
  rationale: Mantém o plural e o sufixo de primeira pessoa, além do peso moral e pactual do termo hebraico.
- source_word: וַיְהִי
  choice: Então ... teria sido
  rationale: No contexto do desejo irrealizado introduzido por לוּא, expressa a consequência que teria ocorrido; a formulação contrafactual é natural em português.
- source_word: כַנָּהָר
  choice: como um rio
  rationale: Preserva diretamente a imagem poética de fluxo contínuo e abundante.
- source_word: שְׁלוֹמֶךָ
  choice: a sua paz
  rationale: “Paz” é a tradução concisa e tradicional de שָׁלוֹם, embora o termo também possa abranger bem-estar e plenitude.
- source_word: וְצִדְקָתְךָ
  choice: a sua justiça
  rationale: “Justiça” comunica em português corrente tanto a conformidade com o que é reto quanto a ordem justa, preservando a amplitude contextual de צְדָקָה sem impor uma leitura exclusivamente individual.
- source_word: כְּגַלֵּי הַיָּם
  choice: como as ondas do mar
  rationale: Mantém a imagem vívida e a estrutura poética do hebraico em linguagem portuguesa natural.
theological_decisions:
- issue: Sentido de צִדְקָה no contexto
  choice: justiça
  alternative: retidão
  rationale: O termo pode indicar justiça, retidão ou uma condição de conformidade à ordem correta. “Justiça” é natural e ampla em português; a alternativa “retidão” é registrada para preservar a tensão lexical e moral-pactual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem dera” conserva a força emotiva do lamento; “você” representa naturalmente o singular hebraico. A pontuação realça o paralelismo poético sem alterar a sintaxe contrafactual.
