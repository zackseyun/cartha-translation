  text: כִּֽי מֵ/עִ֤יר הַ/קֹּ֨דֶשׁ֙ נִקְרָ֔אוּ וְ/עַל אֱלֹהֵ֥י יִשְׂרָאֵ֖ל נִסְמָ֑כוּ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/002.yaml
  text: For they are called from the holy city[a], and they lean on the God of Israel; Yahweh of hosts is his name.
translation:
  language: pt
  text: Pois recebem o nome da cidade santa[a] e se apoiam no Deus de Israel; Yahweh dos Exércitos é o seu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são chamados da cidade santa”. O hebraico pode indicar tanto que recebem sua designação da cidade quanto que procedem dela.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da acusação precedente, preservando o valor explicativo do hebraico.
- source_word: מֵעִיר הַקֹּדֶשׁ
  choice: pela cidade santa
  rationale: Com o passivo de קרא, a expressão pode indicar designação ou procedência. No contexto, “pela cidade santa” destaca a identidade reivindicada, sem eliminar a leitura de origem, registrada em nota.
- source_word: נִקְרָאוּ
  choice: são chamados
  rationale: O nifal de קרא significa naturalmente “ser chamado” ou “receber o nome”; a forma passiva evita interpretar além do texto como “chamam a si mesmos”.
- source_word: וְעַל אֱלֹהֵי יִשְׂרָאֵל נִסְמָכוּ
  choice: e se apoiam no Deus de Israel
  rationale: “Apoiar-se em” conserva a metáfora de dependência de סמך e também a possível ironia no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, “Exércitos” é claro e abrangente, sem restringir indevidamente a referência às hostes celestiais ou terrenas.
- source_word: שְׁמוֹ
  choice: é o seu nome
  rationale: Reproduz de modo natural a fórmula hebraica de declaração do nome.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz explicitamente o tetragrama; “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Relação do povo com a cidade santa
  choice: são chamados pela cidade santa
  alternative: são chamados da cidade santa; procedem da cidade santa
  rationale: A construção permite uma nuance de designação/identidade ou de origem. O texto principal prioriza a designação reivindicada no contexto, e a nota preserva a leitura de procedência.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Mantém a metáfora de apoio, o nome divino e a ambiguidade da relação com a cidade santa.
