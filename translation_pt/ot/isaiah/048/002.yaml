review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente כִּי, a metáfora de dependência em נִסְמָכוּ, o título divino e a fórmula final. Contudo, «são chamados pela cidade santa» em português normalmente sugere que a cidade é o agente que os chama, nuance que não é a função mais natural de מֵעִיר com o passivo de קרא aqui. A redação deve expressar que a cidade está na base de sua designação, sem excluir a possível nuance de procedência.
  naturalness: «Pois», «se apoiam no Deus de Israel» e a conclusão são naturais em registro bíblico contemporâneo. «Recebem o nome da cidade santa» é mais idiomático e semanticamente claro do que «são chamados pela cidade santa».
  terminology: «Yahweh dos Exércitos» reproduz de modo consistente יהוה צבאות. «Deus de Israel» e «nome» estão corretos e adequados ao registro.
  issues:
  - severity: medium
    issue: «São chamados pela cidade santa» atribui à cidade uma ação de chamar.
    rationale: Em português, «por/pela» em uma passiva tende a introduzir o agente. No hebraico, מִן pode marcar a fonte da designação ou a origem; não afirma naturalmente que a cidade execute a ação de chamar. Uma formulação com «recebem o nome da» comunica a leitura de designação sem essa implicação indevida.
  revised_text: Pois recebem o nome da cidade santa[a] e se apoiam no Deus de Israel; Yahweh dos Exércitos é o seu nome.
  revised_footnotes:
