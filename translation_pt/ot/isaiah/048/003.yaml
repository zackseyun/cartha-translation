  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָ/רִֽאשֹׁנוֹת֙ מֵ/אָ֣ז הִגַּ֔דְתִּי וּ/מִ/פִּ֥/י יָצְא֖וּ וְ/אַשְׁמִיעֵ֑/ם פִּתְאֹ֥ם עָשִׂ֖יתִי וַ/תָּבֹֽאנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/003.yaml
  text: I declared the former things long ago[a]; they went out from my mouth, and I made them heard. Suddenly I acted[b], and they came to pass.
translation:
  language: pt
  text: As coisas anteriores, há muito tempo eu as anunciei; elas saíram da minha boca, e fiz com que fossem ouvidas.[a] De repente, agi,[b] e elas aconteceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “e eu as proclamei”. O verbo hebraico está na forma causativa: “fiz com que fossem ouvidas”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “eu fiz isso”. O hebraico emprega o verbo comum “fazer”, aqui no contexto de Deus levar a efeito os acontecimentos anunciados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: as coisas anteriores
  rationale: O adjetivo feminino plural substantivado designa acontecimentos ou anúncios anteriores. “As coisas anteriores” preserva a relação com o contraste profético entre coisas anteriores e novas em Isaías.
- source_word: מֵאָז
  choice: há muito tempo
  rationale: No contexto, indica que o anúncio foi feito num passado remoto; esta expressão comunica a distância temporal em português corrente.
- source_word: הִגַּדְתִּי
  choice: eu as anunciei
  rationale: O hifil de נגד descreve o ato de dar a conhecer ou anunciar, especialmente numa declaração profética. “Anunciei” mantém o tom solene sem soar artificial.
- source_word: וּמִפִּי יָצְאוּ
  choice: elas saíram da minha boca
  rationale: Mantém a imagem concreta das palavras ou declarações que saem da boca de Deus, bem como a concordância feminina com “as coisas anteriores”.
- source_word: וְאַשְׁמִיעֵם
  choice: e eu as fiz ouvir
  rationale: 'Preserva a força causativa do hifil de שמע: Deus fez com que fossem ouvidas. “Eu as proclamei” é uma alternativa natural, mas menos explícita quanto à causatividade.'
- source_word: פִּתְאֹם
  choice: De repente
  rationale: Expressa diretamente o caráter súbito da ação divina.
- source_word: עָשִׂיתִי
  choice: agi
  rationale: O verbo comum “fazer” aparece aqui de modo absoluto no contexto do cumprimento do que foi anunciado. “Agi” é conciso e evita especificar além do texto exatamente o que Deus fez.
- source_word: וַתָּבֹאנָה
  choice: e elas aconteceram
  rationale: O verbo feminino plural retoma “as coisas anteriores”. Para acontecimentos anunciados que se tornam realidade, “aconteceram” é claro e natural, sem a tonalidade arcaizante de “vieram a acontecer”.
theological_decisions:
- issue: Relação entre a predição divina e seu cumprimento
  choice: A tradução apresenta Deus anunciando os acontecimentos e depois agindo, após o que eles aconteceram.
  alternative: Traduzir de modo ainda mais literal como “eu fiz, e elas vieram”, ou explicitar a causalidade com “eu os fiz acontecer”.
  rationale: A sequência hebraica associa anúncio, ação divina e ocorrência, mas não contém um conectivo causal explícito na última oração. “Agi, e elas aconteceram” conserva tanto a associação quanto a tensão, sem acrescentar uma formulação determinista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição dos pronomes femininos preserva a ligação gramatical com “as coisas anteriores”; a imagem de palavras saindo da boca foi mantida. Os marcadores de nota aparecem junto às expressões às quais se referem.
