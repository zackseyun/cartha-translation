  naturalness: 'O texto é em geral claro e de registro apropriado. Contudo, “eu as fiz ouvir” é sintaticamente ambíguo e pouco natural em português moderno: pode sugerir que “as coisas anteriores” foram levadas a ouvir, em vez de terem sido ouvidas. A construção explícita passiva elimina esse problema.'
  terminology: “Coisas anteriores”, “anunciei”, “saíram da minha boca”, “De repente” e “aconteceram” são escolhas adequadas. A nota a deve acompanhar uma formulação que expresse sem ambiguidade o causativo hebraico.
