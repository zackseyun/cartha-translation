    issue: «Sim» para אַף
    rationale: Embora possa expressar ênfase, em português tende a funcionar como resposta a uma pergunta. «De fato» é uma introdução enfática mais idiomática para esta declaração solene.
  - severity: medium
    issue: «eles se apresentam juntos» para יַעַמְדוּ יַחְדָּו
    rationale: «Se apresentam» é uma interpretação contextual legítima, mas acrescenta a noção de comparecimento perante uma autoridade. O hebraico conserva a imagem básica de estar de pé/tomar posição.
  - severity: low
    issue: Alternativa «desdobrou os céus» na nota
    rationale: A alternativa não reflete tão diretamente o campo semântico de estender, abranger ou medir por palmos associado ao verbo raro טפח neste contexto.
