base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/013.yaml
  text: Indeed[a], my hand founded the earth, and my right hand spread out the heavens; when I call to them, they stand together.
translation:
  language: pt
  text: De fato, a minha mão fundou a terra, e a minha mão direita estendeu os céus[a]; quando os chamo, eles tomam posição juntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abarcou os céus” ou “mediu os céus a palmos”.'
    reason: Alternativas lexicais para טִפְּחָה, verbo raro cuja imagem pode indicar estender, abranger ou medir com a palma.
lexical_decisions:
- source_word: אַף
  choice: Sim
  rationale: A partícula enfática introduz uma afirmação solene; “Sim” transmite a ênfase de modo natural e digno em português.
- source_word: יָדִי
  choice: a minha mão
  rationale: Preserva a imagem antropomórfica concreta da ação criadora divina.
- source_word: יָסְדָה
  choice: fundou
  rationale: Mantém de forma concisa a imagem de lançar fundamentos.
- source_word: אֶרֶץ
  choice: a terra
  rationale: O contexto cósmico indica a terra como parte da criação, não uma região específica.
- source_word: וִימִינִי
  choice: e a minha mão direita
  rationale: Preserva o paralelismo e a imagem hebraica de poder e ação direta.
- source_word: טִפְּחָה
  choice: estendeu
  rationale: Expressa com clareza a ideia de expandir ou abarcar os céus, sem fechar as alternativas lexicais possíveis.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: É a forma portuguesa tradicional, atual e adequada ao plural hebraico no contexto da criação.
- source_word: קֹרֵא אֲנִי אֲלֵיהֶם
  choice: quando eu os convoco
  rationale: A formulação temporal torna explícita a relação natural com a ação seguinte; “convoco” comunica um chamado soberano dirigido à terra e aos céus.
- source_word: יַעַמְדוּ
  choice: eles se apresentam
  rationale: No contexto de uma convocação, o verbo descreve não só permanecer de pé, mas comparecer ou tomar posição diante de quem chama.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Preserva o sentido básico de atuação conjunta, sem decidir entre simultaneidade e unidade.
theological_decisions:
- issue: Linguagem antropomórfica para a ação criadora de Deus
  choice: Preservar “minha mão” e “minha mão direita” como imagens concretas.
  alternative: Parafrasear como “meu poder” e “minha força”.
  rationale: O hebraico emprega explicitamente imagens corporais para destacar a ação direta e soberana de Deus; convertê-las em abstrações apagaria a forma do texto.
- issue: Resposta da criação ao chamado divino
  choice: Traduzir יַעַמְדוּ como “se apresentam”.
  alternative: “ficam de pé” ou “tomam posição”.
  rationale: A escolha conserva a personificação da terra e dos céus respondendo à convocação divina, ao mesmo tempo que soa natural em português.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; registro digno, com paralelismo e imagens concretas do hebraico preservados.
