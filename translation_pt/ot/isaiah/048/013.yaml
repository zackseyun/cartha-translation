revisions:
- from: Sim, a minha mão fundou a terra, e a minha mão direita estendeu os céus[a]; quando eu os convoco, eles se apresentam juntos.
  to: De fato, a minha mão fundou a terra, e a minha mão direita estendeu os céus[a]; quando os chamo, eles tomam posição juntos.
  rationale: A revisão melhora a correspondência com a função enfática de אַף e preserva mais diretamente a imagem de עמד, sem alterar o sentido geral nem resolver além do necessário a personificação da criação. A nota foi ajustada para oferecer alternativas lexicais mais próximas do verbo hebraico.
