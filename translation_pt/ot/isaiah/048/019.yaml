  text: וַ/יְהִ֤י כַ/חוֹל֙ זַרְעֶ֔/ךָ וְ/צֶאֱצָאֵ֥י מֵעֶ֖י/ךָ כִּ/מְעֹתָ֑י/ו לֹֽא יִכָּרֵ֧ת וְֽ/לֹא יִשָּׁמֵ֛ד שְׁמ֖/וֹ מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/019.yaml
  text: Your offspring would have been like the sand[a], and the descendants from your body like its grains[b]; their name would not have been cut off or destroyed from before me.
translation:
  language: pt
  text: Sua descendência teria sido como a areia, e os descendentes do seu corpo, como os grãos dela[a]; seu nome[b] não teria sido cortado nem destruído de diante de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como suas partículas” ou “como seus pequenos seixos”; o termo hebraico se refere às pequenas unidades da areia.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o nome dele”. O singular pode personificar a descendência como uma linhagem coletiva; também se pode entender “o nome deles” ou “o nome dela”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: teria sido
  rationale: O versículo continua o resultado contrafactual iniciado no lamento condicional do versículo 18; o futuro do pretérito composto expressa em português uma consequência que não se realizou.
- source_word: כַחוֹל
  choice: como a areia
  rationale: חוֹל designa normalmente areia, e a comparação comunica uma descendência incontável.
- source_word: זַרְעֶךָ
  choice: sua descendência
  rationale: זֶרַע é um coletivo que, neste contexto, se refere à linhagem ou posteridade; “descendência” preserva naturalmente essa força coletiva.
- source_word: וְצֶאֱצָאֵי
  choice: e os descendentes
  rationale: O substantivo indica aqueles que procedem de alguém. “Descendentes” distingue o termo do coletivo anterior sem perder o paralelismo.
- source_word: מֵעֶיךָ
  choice: do seu corpo
  rationale: Embora מֵעֶיךָ se refira literalmente às partes interiores, no contexto genealógico indica origem física. “Do seu corpo” é claro, atual e digno.
- source_word: כִּמְעֹתָיו
  choice: como os grãos dela
  rationale: O sufixo retoma naturalmente a areia, e o substantivo raro indica suas pequenas unidades ou partículas. “Grãos” mantém a imagem de modo idiomático em português, com alternativas registradas em nota.
- source_word: לֹא יִכָּרֵת
  choice: não teria sido eliminado
  rationale: No nifal, כרת pode indicar que um nome ou uma linhagem é cortado ou extinto. “Eliminado” comunica o sentido com naturalidade sem exigir a expressão menos corrente “cortado”.
- source_word: וְלֹא יִשָּׁמֵד
  choice: nem destruído
  rationale: שׁמד no nifal indica ser destruído ou exterminado. “Destruído” preserva a intensificação paralela.
- source_word: שְׁמוֹ
  choice: seu nome
  rationale: O hebraico emprega “nome” no singular com sufixo masculino singular. “Seu nome” conserva formalmente o singular e permite a leitura coletiva, sem impor no corpo do texto um referente mais explícito do que o original.
- source_word: מִלְּפָנַי
  choice: de diante de mim
  rationale: A expressão preserva a imagem hebraica de desaparecer da presença ou de diante de Deus, mantendo o tom solene.
theological_decisions:
- issue: Força contrafactual em relação ao contexto anterior
  choice: teria sido ... não teria sido
  alternative: seria ... não seria; foi ... não foi
  rationale: O versículo apresenta a consequência não realizada da condição lamentada no versículo 18. A forma escolhida explicita essa relação sem transformar a declaração em promessa futura ou fato passado.
- issue: Número e referente de שְׁמוֹ
  choice: seu nome
  alternative: o nome deles; o nome dela; o nome dessa descendência
  rationale: A forma hebraica é singular masculina e pode personificar a descendência como uma linhagem coletiva. O possessivo português mantém a ambiguidade genuína, enquanto a nota esclarece a forma e as possibilidades.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção contrafactual foi mantida; evitou-se o arcaísmo anatômico “lombos” e preservou-se, por meio de “seu nome”, a ambiguidade do singular coletivo hebraico.
