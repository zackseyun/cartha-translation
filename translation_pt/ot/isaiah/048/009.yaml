  text: לְמַ֤עַן שְׁמִ/י֙ אַאֲרִ֣יךְ אַפִּ֔/י וּ/תְהִלָּתִ֖/י אֶחֱטָם לָ֑/ךְ לְ/בִלְתִּ֖י הַכְרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/009.yaml
  text: For the sake of my name I delay my anger[a], and for my praise I restrain it for you[c][b], so as not to cut you off.
translation:
  language: pt
  text: Por causa do meu nome, adiarei a minha ira[a]; por causa do meu louvor, eu a refrearei em seu favor[b], para não eliminar você[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “alongarei meu nariz”, expressão idiomática que significa adiar a ira ou ser lento para irar-se.
    reason: cultural_note
  - marker: b
    text: Ou “eu a conterei”. O verbo hebraico pode evocar a imagem de amordaçar ou pôr freio.
    reason: lexical_alternative
  - marker: c
    text: Ou “destruir você” ou “exterminar você”. O hebraico diz literalmente “cortar você fora”, expressão que pode denotar eliminação em contexto judicial ou de aliança.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שְׁמִי
  choice: Por causa do meu nome
  rationale: Preserva a motivação expressa por לְמַעַן e o sentido hebraico de “nome” como reputação, honra e caráter revelado, sem substituí-lo por uma abstração.
- source_word: אַאֲרִיךְ אַפִּי
  choice: adiarei a minha ira
  rationale: Expressa naturalmente o idioma hebraico, literalmente “alongarei meu nariz”, mantendo o aspecto temporal e a ação deliberada de postergar a ira.
- source_word: וּתְהִלָּתִי
  choice: por causa do meu louvor
  rationale: Mantém o substantivo “louvor” e o paralelismo com “por causa do meu nome”, sem interpretá-lo diretamente como “glória” ou “renome”.
- source_word: אֶחֱטָם
  choice: eu a refrearei
  rationale: O verbo evoca amordaçar, pôr freio ou conter. “Refrearei” comunica a metáfora de contenção, e o pronome “a” retoma naturalmente “minha ira”.
- source_word: לָךְ
  choice: em seu favor
  rationale: Torna explícita de modo natural a relação benéfica da contenção com o destinatário, evitando que “por você” pareça indicar que o povo é a causa da decisão divina.
- source_word: לְבִלְתִּי הַכְרִיתֶךָ
  choice: para não eliminar você
  rationale: Comunica claramente a finalidade ou o resultado pretendido. “Eliminar” preserva a ideia judicial de remover ou cortar, com maior naturalidade no português atual.
theological_decisions:
- issue: Motivação divina ao conter o juízo
  choice: Deus adia e refreia sua ira por causa do próprio nome e louvor, e a preservação do destinatário é o resultado declarado.
  alternative: Apresentar o benefício de Israel como a motivação principal ou substituir “louvor” por “glória” no texto.
  rationale: O versículo fundamenta explicitamente a contenção no nome e no louvor de Deus, sem mencionar mérito humano; a tradução mantém essa ênfase sem acrescentar um sistema doutrinário.
- issue: Objeto implícito de אֶחֱטָם
  choice: O pronome “a” retoma “minha ira” da oração anterior.
  alternative: Deixar o objeto sem expressão ou repetir “minha ira”.
  rationale: O português pede um complemento mais claro; o pronome preserva a elipse hebraica sem acrescentar conteúdo além do contexto imediato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico foi mantido, e os pronomes dirigidos ao destinatário permanecem no singular.
