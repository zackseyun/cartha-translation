id: ISA.48.15
reference: Isaiah 48:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִ֥י אֲנִ֛י דִּבַּ֖רְתִּי אַף קְרָאתִ֑י/ו הֲבִיאֹתִ֖י/ו וְ/הִצְלִ֥יחַ דַּרְכּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/015.yaml
  text: I[a], I have spoken; indeed[b], I have called him; I have brought him, and I will make his way prosper.
translation:
  language: pt
  text: Eu, eu falei; sim, eu o chamei[a]. Eu o trouxe, e ele fará prosperar o seu caminho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os pronomes “o” e “seu” referem-se àquele que Deus chamou e trouxe; no contexto, ele é geralmente entendido como Ciro (ver Isaías 48:14).
    reason: cross_reference
  - marker: b
    text: 'Ou: “ele terá êxito em seu caminho”. O verbo hebraico está na forma causativa; literalmente, “ele fará prosperar o seu caminho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי אֲנִי
  choice: Eu, eu
  rationale: A repetição preserva a ênfase retórica do pronome hebraico sem a reduzir a um único “eu”.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: O perfeito apresenta a declaração divina como realizada; o pretérito perfeito é direto, solene e natural em português.
- source_word: אַף
  choice: sim
  rationale: Neste contexto, a partícula confirma e intensifica a afirmação anterior, mais do que simplesmente acrescentar outro elemento.
- source_word: קְרָאתִיו
  choice: eu o chamei
  rationale: Mantém o sentido amplo de chamar ou convocar e não especifica além do hebraico a natureza da comissão.
- source_word: הֲבִיאֹתִיו
  choice: Eu o trouxe
  rationale: O hifil de בוא tem sentido causativo, “trazer” ou “fazer vir”; “trouxe” comunica isso de modo conciso e natural.
- source_word: וְהִצְלִיחַ
  choice: e ele fará prosperar
  rationale: A forma verbal é hifil de terceira pessoa masculina singular, não primeira pessoa. A tradução conserva tanto o sujeito “ele” quanto o valor causativo do verbo.
- source_word: דַּרְכּוֹ
  choice: o seu caminho
  rationale: “Caminho” traduz diretamente o termo e pode designar o curso de ação ou empreendimento do agente mencionado.
theological_decisions:
- issue: Referente dos pronomes masculinos singulares
  choice: Os pronomes permanecem sem identificação explícita no texto principal.
  alternative: Identificar diretamente o referente como Ciro ou descrevê-lo genericamente como o instrumento escolhido por Deus.
  rationale: O versículo hebraico usa pronomes, embora o contexto imediato aponte comumente para Ciro. Preservar os pronomes evita inserir no texto principal uma identificação que o próprio versículo não repete.
- issue: Sujeito de וְהִצְלִיחַ
  choice: “ele fará prosperar”
  alternative: “eu farei prosperar”
  rationale: Embora Deus seja o sujeito dos verbos anteriores, וְהִצְלִיחַ está morfologicamente na terceira pessoa masculina singular. A mudança de sujeito e a tensão resultante são preservadas em vez de serem harmonizadas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição enfática “Eu, eu” e a mudança para a terceira pessoa no último verbo foram mantidas por refletirem a forma hebraica. “Sim” comunica a força confirmatória de אַף sem soar excessivamente arcaico.
