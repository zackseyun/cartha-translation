  text: שָׁמַ֤עְתָּֽ חֲזֵה֙ כֻּלָּ֔/הּ וְ/אַתֶּ֖ם הֲ/ל֣וֹא תַגִּ֑ידוּ הִשְׁמַעְתִּ֤י/ךָ חֲדָשׁוֹת֙ מֵ/עַ֔תָּה וּ/נְצֻר֖וֹת וְ/לֹ֥א יְדַעְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/006.yaml
  text: You have heard; now see all this. And will you not declare it? From now on I make you hear new things, hidden things that you have not known.
translation:
  language: pt
  text: Você ouviu; agora veja tudo isso. E vocês não anunciarão tudo isso? De agora em diante, faço você ouvir coisas novas, coisas ocultas que você não conhecia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲזֵה
  choice: agora veja
  rationale: O imperativo aramaizante significa “ver/observar”. “Agora” torna natural em português a passagem de ouvir para ver, em consonância com o contexto e com a camada inglesa auditada.
- source_word: תַגִּידוּ
  choice: anunciarão
  rationale: O verbo נגד no hifil significa declarar, contar ou tornar conhecido; “anunciar” preserva a ideia de divulgação pública.
- source_word: חֲדָשׁוֹת
  choice: coisas novas
  rationale: O adjetivo feminino plural é usado substantivamente e refere-se a acontecimentos ou revelações novas.
- source_word: נְצֻרוֹת
  choice: coisas ocultas
  rationale: O particípio passivo de נצר descreve coisas guardadas ou reservadas, daí “ocultas”, sem especificar além do hebraico como foram escondidas.
theological_decisions:
- issue: Alternância entre destinatário singular e plural
  choice: Preservar “você” no singular em “ouviu/veja/faço você ouvir/conhecia” e “vocês” no plural em “anunciarão”
  alternative: Uniformizar todos os pronomes no singular ou no plural
  rationale: O hebraico alterna explicitamente formas singulares e plurais. Preservar essa oscilação evita apagar uma tensão real do texto, possivelmente entre Israel coletivamente e seus membros como grupo.
- issue: Tempo e agência da revelação divina
  choice: “De agora em diante, faço você ouvir”
  alternative: “A partir de agora, anuncio a você”
  rationale: Mantém a construção causativa הִשְׁמַעְתִּיךָ, na qual o falante faz o destinatário ouvir, sem substituir essa imagem por uma formulação teologicamente mais explícita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A colocação pronominal foi evitada para preservar naturalidade internacional. A alternância singular/plural do hebraico foi mantida deliberadamente.
