  naturalness: O texto é geralmente claro e de registro apropriado. «Agora elas foram criadas» comunica com mais naturalidade a realização atual de um evento já efetuado. «Veja» é uma interjeição direta e idiomática para הִנֵּה. A formulação «para que você não dissesse» mantém o sentido preventivo de פֶּן.
  terminology: «Criadas» preserva corretamente a força de ברא sem reduzir a ação divina a anúncio ou previsão. «Ouvido falar delas» é uma formulação portuguesa natural para o conhecimento prévio negado por שמע neste contexto.
