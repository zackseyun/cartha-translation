  text: עַתָּ֤ה נִבְרְאוּ֙ וְ/לֹ֣א מֵ/אָ֔ז וְ/לִ/פְנֵי י֖וֹם וְ/לֹ֣א שְׁמַעְתָּ֑/ם פֶּן תֹּאמַ֖ר הִנֵּ֥ה יְדַעְתִּֽי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/007.yaml
  text: Now they are created[a], and not from long ago; before today you had not heard them, lest you should say, ‘Look, I knew them.’
translation:
  language: pt
  text: 'Agora elas foram criadas[a], e não desde tempos antigos; antes de hoje você não tinha ouvido falar delas, para que você não dissesse: “Veja, eu as conhecia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Agora elas são criadas, e não desde a antiguidade; antes deste dia você não tinha ouvido falar delas.”'
    reason: Alternativa lexical e aspectual para נִבְרְאוּ, מֵאָז e וְלִפְנֵי יוֹם.
lexical_decisions:
- source_word: עַתָּה
  choice: Agora
  rationale: Marca a realização presente em contraste com o passado remoto mencionado na sequência.
- source_word: נִבְרְאוּ
  choice: elas são criadas
  rationale: Preserva o verbo forte ברא e o valor de perfeito hebraico ligado à realização presente das coisas recém-reveladas.
- source_word: מֵאָז
  choice: desde tempos antigos
  rationale: Expressa de modo natural a negação de uma origem ou existência em época remota.
- source_word: וְלִפְנֵי יוֹם
  choice: antes de hoje
  rationale: Representa o idiomatismo temporal hebraico com clareza em português moderno.
- source_word: שְׁמַעְתָּם
  choice: você não tinha ouvido falar delas
  rationale: O mais-que-perfeito situa a falta de conhecimento antes da revelação presente; 'ouvido falar' comunica naturalmente o sentido de tomar conhecimento dessas coisas.
- source_word: פֶּן תֹּאמַר
  choice: para que não dissesse
  rationale: Conserva a ideia preventiva de פֶּן e a possibilidade expressa pelo imperfeito subsequente.
- source_word: הִנֵּה
  choice: Olhe
  rationale: Interjeição dêitica atual e inteligível, sem o tom arcaico de 'eis' ou 'eis que'.
- source_word: יְדַעְתִּין
  choice: eu já as conhecia
  rationale: O pronome feminino plural retoma naturalmente 'elas'; 'já' explicita a anterioridade implícita na alegação, sem alterar seu conteúdo básico.
theological_decisions:
- issue: Sentido de 'criadas' aplicado às coisas recém-reveladas
  choice: Manter a linguagem explícita de criação
  alternative: são realizadas; são anunciadas
  rationale: O hebraico emprega ברא, que enfatiza a ação soberana de Deus ao trazer à existência ou realizar essas novas coisas; reduzir o verbo a mero anúncio enfraqueceria essa força.
- issue: Referência dos sufixos pronominais plurais
  choice: Usar 'elas', remetendo às coisas ou realidades do contexto
  alternative: estas coisas; isso
  rationale: Mantém a pluralidade e evita especificar além do que o versículo declara.
- issue: Anterioridade em 'eu já as conhecia'
  choice: Incluir 'já' como explicitação contextual
  alternative: eu as conhecia
  rationale: A partícula não aparece separadamente no hebraico, mas a afirmação reivindica conhecimento prévio. A nota não é necessária porque a explicitação é idiomática e não resolve uma tensão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por 'você' torna explícita a segunda pessoa masculina singular do hebraico sem recorrer ao mais regional 'tu'. A construção conserva a repetição temporal e a tensão entre criação e revelação.
