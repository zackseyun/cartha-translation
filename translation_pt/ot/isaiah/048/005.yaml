base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/005.yaml
  text: I declared it to you long ago[a]; before it came to pass I made you hear it, lest you say, ‘My idol did them[b], and my carved image and my cast image commanded them.’
translation:
  language: pt
  text: 'Eu anunciei isso a você há muito tempo; antes que acontecesse, fiz com que você ouvisse isso, para que você não dissesse: “Meu ídolo fez essas coisas; minha imagem esculpida e minha imagem de metal fundido as ordenaram.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַגִּיד
  choice: Eu anunciei
  rationale: O hifil de נגד significa anunciar ou dar a conhecer. “Anunciei” preserva o tom profético e é natural em português atual.
- source_word: מֵאָז
  choice: há muito tempo
  rationale: A expressão aponta para um anúncio feito anteriormente, bem antes do cumprimento. “Há muito tempo” comunica de modo idiomático essa anterioridade.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: antes que acontecesse
  rationale: Literalmente, “antes que viesse”. O feminino singular parece retomar implicitamente a coisa ou ocorrência anunciada; “acontecesse” expressa em português o sentido eventivo sem identificar além do necessário o referente.
- source_word: הִשְׁמַעְתִּיךָ
  choice: fiz com que você o ouvisse
  rationale: Mantém a força causativa do hifil de שמע. O pronome “o” retoma o anúncio ou acontecimento implícito no contexto.
- source_word: פֶּן
  choice: para que você não dissesse
  rationale: Introduz uma finalidade preventiva. Esta construção é clara e mais natural no português moderno do que uma formulação com “para que não acontecesse de”.
- source_word: עָצְבִּי
  choice: meu ídolo
  rationale: עצב designa aqui um ídolo. A escolha distingue o termo dos dois tipos específicos de imagem mencionados em seguida.
- source_word: עָשָׂם
  choice: fez essas coisas
  rationale: O sufixo plural remete aos atos ou acontecimentos preditos. “Essas coisas” explicita naturalmente o referente plural sem sugerir fabricação material.
- source_word: פִסְלִי
  choice: minha imagem esculpida
  rationale: פסל denota uma imagem produzida por entalhe ou escultura. A expressão preserva a especificidade do termo em linguagem atual.
- source_word: נִסְכִּי
  choice: minha imagem de metal fundido
  rationale: O substantivo se refere a uma imagem produzida por fundição. A formulação explicita o processo e evita a possível leitura de “imagem fundida” como algo unido ou mesclado.
- source_word: צִוָּם
  choice: as ordenaram
  rationale: צוה significa normalmente ordenar. O feminino plural retoma “essas coisas” e preserva a ironia de atribuir às imagens o comando dos acontecimentos.
theological_decisions:
- issue: Distinção entre os três termos ligados à idolatria
  choice: “ídolo”, “imagem esculpida” e “imagem de metal fundido”
  alternative: Repetir “ídolo” nos três casos ou empregar “imagem de escultura” e “imagem fundida”
  rationale: O hebraico usa três expressões relacionadas, mas distintas. Preservar essa diferenciação mantém a progressão retórica da denúncia sem acrescentar uma interpretação doutrinária.
- issue: Referente dos sufixos plurais em עָשָׂם e צִוָּם
  choice: “essas coisas” e “as”
  alternative: “esses acontecimentos” ou “tudo isso”
  rationale: O texto não nomeia explicitamente o referente plural. “Essas coisas” conserva sua amplitude, podendo abranger os atos e acontecimentos anteriormente anunciados.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução evita arcaísmos como “imagem de escultura” e preserva a força causativa de “fiz com que você o ouvisse”. Nenhuma nota é necessária: “antes que acontecesse” traduz diretamente o sentido idiomático de בטרם תבוא, enquanto “imagem de metal fundido” incorpora no texto a precisão lexical.'
