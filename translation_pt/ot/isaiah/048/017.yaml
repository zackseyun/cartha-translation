  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/ךָ֖ קְד֣וֹשׁ יִשְׂרָאֵ֑ל אֲנִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מְלַמֶּדְ/ךָ֣ לְ/הוֹעִ֔יל מַדְרִֽיכֲ/ךָ֖ בְּ/דֶ֥רֶךְ תֵּלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/017.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: I am Yahweh your God, who teaches you to profit[b], who leads you in the way you should go.'
translation:
  language: pt
  text: 'Assim diz Yahweh, seu Redentor, o Santo de Israel: “Eu sou Yahweh, seu Deus, que ensina o que é proveitoso para você e o guia pelo caminho que deve seguir.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ensina para o seu benefício e o guia pelo caminho que você segue”. A expressão hebraica final pode ser entendida de modo instrucional (“que deve seguir”) ou descritivo (“que você segue”).'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título «Senhor» e preservando sua repetição no hebraico.
- source_word: גֹּאַלְךָ
  choice: seu Redentor
  rationale: Expressa de modo conciso o particípio usado como título divino, sem explicitar além do texto a possível dimensão de resgatador familiar.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Mantém o título característico de Isaías em forma consagrada, clara e natural em português.
- source_word: מְלַמֶּדְךָ לְהוֹעִיל
  choice: que ensina o que é proveitoso para você
  rationale: Comunica a instrução voltada ao benefício do destinatário e evita a formulação pouco natural «ensina você a lucrar», que poderia sugerir ganho financeiro.
- source_word: מַדְרִיכֲךָ
  choice: o guia
  rationale: Preserva o sentido causativo de condução e combina naturalmente com a imagem do caminho.
- source_word: בְּדֶרֶךְ תֵּלֵךְ
  choice: pelo caminho que deve seguir
  rationale: Reflete a leitura instrucional favorecida pelo contexto, mantendo em nota a possibilidade de uma leitura mais descritiva.
theological_decisions:
- issue: Repetição do nome divino יְהוָה
  choice: Yahweh ... Eu sou Yahweh, seu Deus
  alternative: SENHOR ... Eu sou o SENHOR, seu Deus
  rationale: A transliteração preserva a identificação pessoal enfática e não substitui o nome por um título.
- issue: Nuance da instrução e da orientação divinas
  choice: ensina o que é proveitoso para você e o guia pelo caminho que deve seguir
  alternative: ensina para o seu benefício e o guia pelo caminho que você segue
  rationale: A formulação principal apresenta Deus como instrutor benéfico e guia sem introduzir determinismo; a nota conserva a ambiguidade do imperfeito hebraico na oração final.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O singular «você/seu» representa as formas hebraicas masculinas singulares dirigidas a Israel. A nota reúne a alternativa mais formal para לְהוֹעִיל e a ambiguidade de תֵּלֵךְ.
