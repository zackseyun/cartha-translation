  text: שְׁמַ֤ע אֵלַ/י֙ יַֽעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל מְקֹרָאִ֑/י אֲנִי הוּא֙ אֲנִ֣י רִאשׁ֔וֹן אַ֖ף אֲנִ֥י אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/012.yaml
  text: 'Listen to me[a], Jacob, and Israel, whom I called: I am he; I am the first[b], and I am the last.'
translation:
  language: pt
  text: 'Escute-me, Jacó, e Israel, a quem chamei[a]: Eu sou o mesmo[b]; eu sou o primeiro e também sou o último.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Israel, meu chamado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Eu sou aquele”. A expressão hebraica é uma fórmula concisa de autoidentificação divina usada repetidamente em Isaías.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Escute-me
  rationale: O imperativo masculino singular pede atenção ativa. “Escute-me” é natural no português moderno e preserva a força da ordem.
- source_word: אֵלַי
  choice: -me
  rationale: 'A preposição אֶל com o sufixo da primeira pessoa é expressa idiomaticamente pelo pronome ligado ao verbo: “Escute-me”.'
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Forma consagrada do nome próprio em português.
- source_word: וְיִשְׂרָאֵל
  choice: e Israel
  rationale: Mantém a conjunção e os dois vocativos paralelos dirigidos ao povo da aliança.
- source_word: מְקֹרָאִי
  choice: a quem chamei
  rationale: Comunica com clareza a forma passiva/resultativa ligada a קרא e o sufixo da primeira pessoa, sem eliminar em nota a alternativa mais formal, “meu chamado”.
- source_word: אֲנִי הוּא
  choice: Eu sou ele
  rationale: Preserva de modo compacto os dois elementos do hebraico e o peso da fórmula de autoidentificação divina recorrente em Isaías. Embora incomum em português isoladamente, é inteligível e evita ampliar a expressão.
- source_word: רִאשׁוֹן
  choice: o primeiro
  rationale: O artigo torna natural em português o adjetivo empregado substantivamente e conserva sua força absoluta.
- source_word: אַף
  choice: e também
  rationale: Expressa tanto a adição como a ênfase do termo hebraico na segunda metade da declaração paralela.
- source_word: אַחֲרוֹן
  choice: o último
  rationale: Mantém o paralelismo formal e a afirmação enfática da primazia e ultimidade de Deus.
theological_decisions:
- issue: A fórmula divina de autoidentificação אֲנִי הוּא
  choice: Eu sou ele
  alternative: Eu sou o mesmo; Eu sou aquele; Eu sou
  rationale: “Eu sou ele” conserva a formulação compacta do hebraico sem identificar explicitamente seu referente nem importar conclusões doutrinárias posteriores. A nota registra opções idiomáticas sem resolver a tensão do texto.
- issue: A singularidade divina em רִאשׁוֹן ... אַחֲרוֹן
  choice: o primeiro ... o último
  alternative: primeiro ... último
  rationale: A forma com artigos comunica em português a força absoluta e quase titular da expressão, sem expandi-la em uma paráfrase temporal ou ontológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas reconhecíveis tanto no Brasil como internacionalmente. “Escute-me” favorece clareza contemporânea; “Eu sou ele” mantém deliberadamente a concisão e a estranheza significativa da fórmula hebraica. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
