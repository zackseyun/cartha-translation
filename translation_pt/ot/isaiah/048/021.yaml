id: ISA.48.21
reference: Isaiah 48:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֣א צָמְא֗וּ בָּ/חֳרָבוֹת֙ הֽוֹלִיכָ֔/ם מַ֥יִם מִ/צּ֖וּר הִזִּ֣יל לָ֑/מוֹ וַ/יִּ֨בְקַע צ֔וּר וַ/יָּזֻ֖בוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/021.yaml
  text: They did not thirst when he led them through the deserts[a]; he made water flow for them from the rock; he split the rock[b], and water gushed out.
translation:
  language: pt
  text: Eles não tiveram sede quando ele os conduziu pelas regiões áridas[a]; fez a água correr da rocha para eles; fendeu a rocha[b], e as águas jorraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelos desertos” ou “pelos lugares secos”.
    reason: lexical_alternative
  - marker: b
    text: O versículo faz eco à provisão de água da rocha pelo SENHOR no deserto (por exemplo, Êx 17:6; Nm 20:11).
    reason: cross_reference
lexical_decisions:
- source_word: צָמְאוּ
  choice: tiveram sede
  rationale: O verbo expressa a experiência da sede; com a negação, “não tiveram sede” preserva sua força verbal e é natural em português.
- source_word: בָּחֳרָבוֹת
  choice: pelas regiões áridas
  rationale: O substantivo plural designa lugares secos e desolados. “Regiões áridas” preserva a amplitude do termo sem restringi-lo a desertos de uma topografia específica; “pelas” combina naturalmente com o movimento de conduzir.
- source_word: הוֹלִיכָם
  choice: ele os conduziu
  rationale: O hifil de הלך tem sentido causativo de levar ou conduzir. A formulação é clara, digna e mantém o sujeito pronominal implícito no hebraico.
- source_word: הִזִּיל
  choice: fez a água correr
  rationale: O hifil de נזל é causativo. A tradução explicita que ele fez a água fluir, sem transformar a ação em simples derramamento.
- source_word: מִצּוּר
  choice: da rocha
  rationale: A forma singular com preposição identifica a rocha como origem da água e se ajusta à alusão às narrativas do deserto.
- source_word: וַיִּבְקַע צוּר
  choice: fendeu a rocha
  rationale: בקע significa partir ou abrir por fenda. “Fendeu” preserva a imagem concreta em registro bíblico digno, mas ainda compreensível.
- source_word: וַיָּזֻבוּ מָיִם
  choice: as águas jorraram
  rationale: O plural hebraico מָיִם pede naturalmente “águas”, e o verbo descreve seu fluxo para fora; “jorraram” comunica a força vívida da cena.
theological_decisions:
- issue: Referente do sujeito na terceira pessoa do singular
  choice: “ele”, referindo-se ao SENHOR pelo contexto
  alternative: Inserir explicitamente “o SENHOR” ou entender um sujeito genérico
  rationale: O contexto mantém Deus como agente, mas o versículo não repete o nome divino. O pronome preserva a forma do hebraico e evita explicitação interpretativa desnecessária.
- issue: Eco intertextual do milagre da água tirada da rocha no deserto
  choice: Preservar a alusão histórico-poética sem ampliá-la no texto principal
  alternative: Explicitar uma interpretação tipológica ou sacramental
  rationale: A linguagem evoca claramente a provisão do SENHOR no deserto, mas o versículo não formula por si só uma interpretação posterior. A nota oferece as referências pertinentes sem resolver a alusão de modo denominacional.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O texto conserva paralelismo e imagens poéticas, usa “ele” sem inserir o nome divino ausente no versículo e mantém a ambiguidade topográfica de בָּחֳרָבוֹת por meio de “regiões áridas”.
