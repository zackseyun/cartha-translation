  text: מִ/דַּעְתִּ֕/י כִּ֥י קָשֶׁ֖ה אָ֑תָּה וְ/גִ֤יד בַּרְזֶל֙ עָרְפֶּ֔/ךָ וּ/מִצְחֲ/ךָ֖ נְחוּשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/048/004.yaml
  text: Because I knew that you are stubborn[a], and your neck is an iron sinew, and your forehead is bronze[c][b],
translation:
  language: pt
  text: Porque eu sabia que você é obstinado[a], que seu pescoço é um tendão de ferro[b] e que sua testa é de bronze[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “duro” ou “teimoso”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “seu pescoço é um tendão de ferro”; a imagem expressa resistência obstinada.
    reason: cultural_note
  - marker: c
    text: A metáfora da testa de bronze sugere dureza e falta de vergonha.
    reason: cultural_note
lexical_decisions:
- source_word: מִדַּעְתִּי כִּי
  choice: Porque eu sabia que
  rationale: A construção apresenta o conhecimento como razão do que precede e introduz seu conteúdo; a formulação preserva o nexo causal e soa natural em português.
- source_word: קָשֶׁה
  choice: obstinado
  rationale: Embora o sentido básico seja “duro”, aplicado a uma pessoa na repreensão profética indica resistência persistente; “obstinado” mantém o tom digno e moral sem achatar a metáfora seguinte.
- source_word: וְגִיד בַּרְזֶל
  choice: um tendão de ferro
  rationale: גִּיד designa tendão ou nervo; “tendão” é concreto, atual e preserva literalmente a vigorosa imagem corporal.
- source_word: עָרְפֶּךָ
  choice: seu pescoço
  rationale: O termo pode indicar a nuca, mas “pescoço” comunica de modo mais natural a conhecida imagem de resistência obstinada.
- source_word: וּמִצְחֲךָ
  choice: e sua testa
  rationale: “Testa” é o equivalente moderno e transparente, conservando a metáfora corporal.
- source_word: נְחוּשָׁה
  choice: era de bronze
  rationale: O substantivo predicativo designa cobre ou bronze; “bronze” expressa adequadamente a dureza da imagem, e “de” torna natural em português a metáfora nominal hebraica.
theological_decisions:
- issue: Descrição metafórica da rebeldia de Israel
  choice: 'Manter as imagens corporais e metálicas: “pescoço era um tendão de ferro” e “testa era de bronze”.'
  alternative: Explicitar como “você era inflexível e sem vergonha”.
  rationale: O hebraico repreende por meio de imagens concretas, associadas à resistência obstinada e à dureza impudente. Conservá-las preserva a força poética e evita impor uma interpretação abstrata única.
- issue: Referência temporal de קָשֶׁה na oração dependente
  choice: “era obstinado”
  alternative: “é obstinado”
  rationale: Em português, a concordância temporal com “eu sabia” é mais natural; não nega que a característica possa persistir no momento do discurso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular “você” representa o destinatário coletivo tratado no masculino singular pelo hebraico. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
