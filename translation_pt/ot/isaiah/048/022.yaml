  yaml_path: translation/ot/isaiah/048/022.yaml
  text: There is no peace," says Yahweh[a], "for the wicked.
translation:
  language: pt
  text: “Não há paz[a]”, diz Yahweh, “para os perversos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bem-estar” ou “plenitude”. O hebraico shalom pode incluir paz, bem-estar e plenitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: Não há
  rationale: Expressa de modo natural em português a negação existencial do hebraico.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É a tradução concisa e tradicional que se ajusta à declaração profética, embora o termo hebraico também possa abranger bem-estar e integridade.
- source_word: אָמַר
  choice: diz
  rationale: Embora a forma hebraica seja morfologicamente perfeita, nesta fórmula de fala profética ela introduz de maneira idiomática um pronunciamento divino vigente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, preservando sua referência pactual.
- source_word: לָרְשָׁעִים
  choice: para os perversos
  rationale: A preposição indica aqueles a quem a declaração se aplica; o adjetivo plural substantivado designa pessoas moralmente perversas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração Yahweh preserva o nome próprio sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com formulação breve que acompanha a concisão enfática do hebraico. O marcador massorético de seção não faz parte do conteúdo verbal do versículo.
