  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֹמַ֕ר עַד מָתַ֖י אֲדֹנָ֑/י וַ/יֹּ֡אמֶר עַ֣ד אֲשֶׁר֩ אִם שָׁא֨וּ עָרִ֜ים מֵ/אֵ֣ין יוֹשֵׁ֗ב וּ/בָתִּים֙ מֵ/אֵ֣ין אָדָ֔ם וְ/הָ/אֲדָמָ֖ה תִּשָּׁאֶ֥ה שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/011.yaml
  text: Then I said[a], “Until when, Lord?” And he said, “Until cities lie waste, without inhabitant, and houses without man, and the land is laid waste[b], a desolation.”
translation:
  language: pt
  text: 'Então eu disse[a]: “Até quando, Senhor?” Ele respondeu: “Até que as cidades fiquem devastadas, sem habitantes, e as casas, sem ninguém; até que a terra seja arrasada e se torne uma desolação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por quanto tempo, Senhor?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência sem acrescentar conteúdo.
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Reproduz de perto a expressão hebraica e mantém a ligação verbal com a resposta introduzida por “até que”.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: É a forma portuguesa tradicional e adequada para o título divino אֲדֹנָי; o sufixo de primeira pessoa está lexicalizado no título.
- source_word: עַד אֲשֶׁר אִם
  choice: Até que
  rationale: Introduz o limite temporal do juízo. A partícula אִם tem aqui força idiomática ou enfática, não uma condição que precise ser vertida por “se”.
- source_word: שָׁאוּ
  choice: fiquem devastadas
  rationale: Comunica o estado resultante de devastação das cidades e concorda naturalmente com o plural feminino em português.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem habitantes
  rationale: Transmite em português corrente o sentido coletivo de não haver quem habite as cidades.
- source_word: וּבָתִּים מֵאֵין אָדָם
  choice: e as casas, sem ninguém
  rationale: אָדָם é genérico neste contexto. “Sem ninguém” preserva o sentido de ausência total de seres humanos sem sugerir que apenas homens estejam em vista.
- source_word: וְהָאֲדָמָה
  choice: a terra
  rationale: No contexto do juízo nacional, אֲדָמָה designa a terra ou território, e não meramente o solo.
- source_word: תִּשָּׁאֶה שְׁמָמָה
  choice: seja arrasada e se torne uma desolação
  rationale: Conserva a acumulação enfática do verbo de devastação e do substantivo שְׁמָמָה, em formulação clara e natural.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: sem ninguém
  alternative: sem homem algum
  rationale: O termo indica aqui a ausência de qualquer pessoa nas casas, não especificamente a ausência de indivíduos do sexo masculino. A tradução torna explícita essa referência humana genérica sem alterar o alcance do juízo.
- issue: Duração do endurecimento e do juízo
  choice: Até que
  alternative: Até o tempo em que
  rationale: A resposta apresenta a devastação como o limite indicado à pergunta do profeta, sem inferir além do texto o que ocorre depois desse limite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “até” foi mantida para refletir a ligação entre a pergunta e a resposta hebraicas; a segunda ocorrência antes de “a terra” também preserva o alcance da construção temporal em uma frase portuguesa fluida.
