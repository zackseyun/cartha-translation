  text: וַ/יַּגַּ֣ע עַל פִּ֔/י וַ/יֹּ֕אמֶר הִנֵּ֛ה נָגַ֥ע זֶ֖ה עַל שְׂפָתֶ֑י/ךָ וְ/סָ֣ר עֲוֺנֶ֔/ךָ וְ/חַטָּאתְ/ךָ֖ תְּכֻפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/007.yaml
  text: And he touched my mouth and said, “Look, this has touched your lips; your guilt is removed, and your sin is atoned for.”
translation:
  language: pt
  text: 'Então ele tocou a minha boca e disse: “Veja! Isto tocou os seus lábios; a sua culpa foi removida, e o seu pecado foi expiado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגַּע עַל־פִּי
  choice: Então ele tocou a minha boca
  rationale: Reproduz diretamente a ação hebraica; “então” expressa a progressão narrativa do wayyiqtol sem tornar a sequência pesada.
- source_word: הִנֵּה
  choice: Veja!
  rationale: Mantém a força de chamada de atenção da partícula hebraica em linguagem atual e natural.
- source_word: עֲוֺנֶךָ
  choice: a sua culpa
  rationale: Neste contexto, עָוֹן aponta para a culpa resultante do pecado, confirmada pelo verbo “foi removida”.
- source_word: וְחַטָּאתְךָ תְּכֻפָּר
  choice: e o seu pecado foi expiado
  rationale: Preserva a terminologia cultual e a forma passiva do hebraico, sem explicitar um agente que o texto não nomeia.
theological_decisions:
- issue: Relação entre o toque da brasa, a remoção da culpa e a expiação
  choice: Manter as afirmações em sequência, sem explicar o mecanismo
  alternative: Interpretar explicitamente a brasa como causa sacramental ou meramente simbólica
  rationale: O versículo associa o toque à remoção da culpa e à expiação, mas não formula uma teoria detalhada da causalidade; a tradução preserva essa tensão.
- issue: Agente da expiação
  choice: 'Usar a voz passiva: “foi expiado”'
  alternative: “Deus expiou o seu pecado”
  rationale: O hebraico emprega uma forma passiva e deixa o agente implícito; nomeá-lo no texto traduzido acrescentaria informação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Veja!” comunica a função discursiva de הִנֵּה com mais naturalidade contemporânea que “Eis”. A alternância entre “minha” e “seus/sua” acompanha a mudança da narração em primeira pessoa para a fala dirigida a Isaías.
