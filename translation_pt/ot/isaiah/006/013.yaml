base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/013.yaml
  text: And though a tenth remains in it[a], it will again be for burning, like a terebinth or like an oak whose stump remains when it is felled. The holy seed is its stump.
translation:
  language: pt
  text: E, ainda que nela reste uma décima parte, ela voltará a ser destinada à queima, como o terebinto e como o carvalho, dos quais fica o toco quando são derrubados.[a] A semente santa é o seu toco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando suas folhas caem”. O termo hebraico é difícil; o texto principal segue o sentido que melhor corresponde à imagem do toco deixado após a derrubada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד בָּהּ עֲשִׂרִיָּה
  choice: E ainda que nela reste a décima parte
  rationale: Expressa em português natural o valor continuativo e concessivo de עוֹד no contexto, preserva a referência feminina à terra ou cidade em בָּהּ e mantém a proporção indicada por עֲשִׂרִיָּה.
- source_word: וְשָׁבָה וְהָיְתָה לְבָעֵר
  choice: esta tornará a ser consumida
  rationale: Mantém a ideia de recorrência de שׁוב e traduz לְבָעֵר sem restringir o juízo necessariamente à queima literal; 'consumida' também preserva a formulação predicativa do hebraico.
- source_word: כָּאֵלָה וְכָאַלּוֹן
  choice: como o terebinto e como o carvalho
  rationale: Conserva as duas espécies arbóreas e o paralelismo coordenado do hebraico.
- source_word: אֲשֶׁר בְּשַׁלֶּכֶת מַצֶּבֶת בָּם
  choice: dos quais fica o toco quando são derrubados
  rationale: Entende o termo difícil בְּשַׁלֶּכֶת à luz da imagem imediata de um toco que permanece, com a alternativa lexical registrada em nota.
- source_word: זֶרַע קֹדֶשׁ
  choice: A semente santa
  rationale: Preserva literalmente a metáfora e sua possível dimensão coletiva e pactual, sem definir mais estreitamente sua identidade.
- source_word: מַצַּבְתָּהּ
  choice: é o seu toco
  rationale: Retoma a mesma imagem arbórea de מַצֶּבֶת e conserva a relação pronominal feminina com a realidade mencionada no início do versículo.
theological_decisions:
- issue: Identidade da 'semente santa'
  choice: Manter 'A semente santa é o seu toco' sem identificar explicitamente o referente.
  alternative: Explicitar como o remanescente fiel, o povo sobrevivente da aliança ou uma linhagem messiânica.
  rationale: O hebraico apresenta uma sobrevivência consagrada após o juízo, mas não define neste versículo sua identidade com maior precisão. A tradução preserva essa tensão interpretativa.
- issue: Natureza do novo juízo sobre a décima parte
  choice: Traduzir לְבָעֵר por 'ser consumida'.
  alternative: Traduzir por 'ser queimada' ou 'servir para queima'.
  rationale: A opção mantém o sentido de destruição ou eliminação sem impor que o fogo seja necessariamente literal, embora a queima continue sendo uma possibilidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega 'tere­binto' como termo botânico tradicional e preciso; 'toco' comunica de modo claro a parte da árvore que permanece. A construção mantém a metáfora e a ambiguidade teológica do original.
