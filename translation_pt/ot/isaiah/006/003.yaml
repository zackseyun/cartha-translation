id: ISA.6.3
reference: Isaiah 6:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/קָרָ֨א זֶ֤ה אֶל זֶה֙ וְ/אָמַ֔ר קָד֧וֹשׁ קָד֛וֹשׁ קָד֖וֹשׁ יְהוָ֣ה צְבָא֑וֹת מְלֹ֥א כָל הָ/אָ֖רֶץ כְּבוֹדֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/003.yaml
  text: 'And one called to another and said: “Holy[a], holy, holy is Yahweh of hosts[b]; the whole earth is full of his glory.”'
translation:
  language: pt
  text: 'E um clamava ao outro, dizendo:


    “Santo, santo, santo é Yahweh[a] dos Exércitos[b];

    toda a terra está cheia da sua glória.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
  - marker: b
    text: Ou “das hostes”. O título hebraico se refere às forças celestes e terrenas sob seu comando.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָא
  choice: clamava
  rationale: O qal de קרא pode significar “chamar” ou “clamar”. O imperfeito em português retrata naturalmente a proclamação contínua ou alternada na cena, e “clamava” comunica a intensidade sem acrescentar conteúdo.
- source_word: זֶה אֶל זֶה
  choice: um ao outro
  rationale: Expressão recíproca idiomática que indica que os seres chamavam uns aos outros; a formulação preserva a relação expressa no hebraico e soa natural em português.
- source_word: וְאָמַר
  choice: dizendo
  rationale: O gerúndio liga naturalmente o conteúdo da proclamação ao verbo anterior, sem alterar a sequência ou o sentido do hebraico.
- source_word: קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ
  choice: Santo, santo, santo
  rationale: Mantém integralmente a repetição tríplice, sua ênfase e sua força litúrgica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: No título divino, “Exércitos” comunica de modo claro as forças sob o comando de Yahweh. A inicial maiúscula sinaliza sua função no título, sem restringir o referente apenas a exércitos humanos.
- source_word: מְלֹא כָל הָאָרֶץ
  choice: toda a terra está cheia
  rationale: Expressa em português natural a construção nominal hebraica, preservando a abrangência de כָל הָאָרֶץ.
- source_word: כְּבוֹדוֹ
  choice: da sua glória
  rationale: 'Completa idiomaticamente a ideia de plenitude: a terra está cheia da glória pertencente a Yahweh.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto a nota registra a substituição tradicional por “SENHOR”.
- issue: Sentido do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh das hostes
  rationale: “Dos Exércitos” é compreensível no português atual e mantém a imagem de forças organizadas sob o comando divino. A nota preserva a amplitude possível do título, que pode abranger forças celestes e terrenas.
- issue: Repetição tríplice de קָדוֹשׁ
  choice: Santo, santo, santo
  alternative: Santíssimo
  rationale: A repetição hebraica deve permanecer explícita; condensá-la em um superlativo apagaria sua forma enfática e sua força poética, além de resolver além do que o texto declara.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A disposição em linhas conserva a cadência poética da proclamação. “Clamava” evita a possível fraqueza de “chamava”, e “dos Exércitos” é mais transparente hoje do que “das hostes”, cuja forma tradicional fica registrada em nota.
