id: ISA.6.10
reference: Isaiah 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַשְׁמֵן֙ לֵב הָ/עָ֣ם הַ/זֶּ֔ה וְ/אָזְנָ֥י/ו הַכְבֵּ֖ד וְ/עֵינָ֣י/ו הָשַׁ֑ע פֶּן יִרְאֶ֨ה בְ/עֵינָ֜י/ו וּ/בְ/אָזְנָ֣י/ו יִשְׁמָ֗ע וּ/לְבָב֥/וֹ יָבִ֛ין וָ/שָׁ֖ב וְ/רָ֥פָא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/010.yaml
  text: Make the heart of this people dull[a], and make their ears heavy, and blind their eyes, lest they see with their eyes, and hear with their ears, and understand with their heart, and turn back[c][b], and be healed.
translation:
  language: pt
  text: Torne insensível o coração deste povo; torne pesados os seus ouvidos e feche os seus olhos[a], para que não veja com os olhos, nem ouça com os ouvidos, nem entenda com o coração, nem volte[b] e seja curado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “torne cegos os seus olhos” ou “cubra os seus olhos”; o verbo hebraico indica fazer com que os olhos deixem de responder.
    reason: lexical_alternative
  - marker: b
    text: Ou “retorne”; o verbo pode indicar simplesmente voltar e, neste contexto, também pode envolver arrependimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמֵן
  choice: Torne insensível
  rationale: O hifil imperativo de שׁמן significa literalmente “engorde”, mas, com “coração”, expressa insensibilidade ou falta de receptividade. “Torne insensível” comunica o sentido idiomático sem introduzir o termo teologicamente mais carregado “endureça”.
- source_word: לֵב
  choice: coração
  rationale: לֵב abrange pensamento, vontade e interioridade. “Coração” conserva a antropologia e a ressonância bíblicas do hebraico.
- source_word: הָעָם הַזֶּה
  choice: deste povo
  rationale: Mantém o coletivo singular do hebraico e soa natural no discurso profético em português.
- source_word: הַכְבֵּד
  choice: torne pesados
  rationale: O hifil de כבד preserva a imagem de ouvidos “pesados”, isto é, pouco receptivos, sem substituí-la por “endureça”.
- source_word: הָשַׁע
  choice: feche
  rationale: No contexto dos olhos, o verbo indica torná-los inoperantes, possivelmente fechando-os ou cobrindo-os. “Feche” conserva melhor a provável imagem concreta; a nota registra outras possibilidades.
- source_word: פֶּן
  choice: para que não
  rationale: Expressa de modo natural e solene em português a força preventiva de פֶּן, sem eliminar a tensão da finalidade apresentada no texto.
- source_word: יִרְאֶה ... יִשְׁמָע ... יָבִין
  choice: veja ... ouça ... entenda
  rationale: As formas estão no singular por concordarem com o coletivo singular “povo”; o português permite manter essa concordância com clareza.
- source_word: וָשָׁב
  choice: volte
  rationale: שׁוב significa voltar ou retornar e, no contexto, pode envolver arrependimento. “Volte” preserva a amplitude sem explicitar mais do que o hebraico.
- source_word: וְרָפָא לוֹ
  choice: seja curado
  rationale: A construção hebraica é concisa e elíptica. “Seja curado” comunica naturalmente o resultado sem acrescentar um agente explícito.
theological_decisions:
- issue: Agência divina no endurecimento judicial
  choice: 'Manter os imperativos diretos: “Torne... torne... feche...” e a oração “para que não...”.'
  alternative: Suavizar como permissão (“Deixe que se torne...”) ou interpretar apenas como resultado.
  rationale: O hebraico traz imperativos hifil masculinos singulares dirigidos ao profeta. A tradução preserva a força desconcertante da comissão divina e não resolve silenciosamente sua tensão teológica.
- issue: Coletivo singular e concordância
  choice: Manter “este povo” e os verbos subsequentes no singular.
  alternative: Empregar construções plurais, como “estas pessoas... vejam... ouçam”.
  rationale: Diferentemente do inglês, o português faz naturalmente a concordância gramatical com o coletivo singular, refletindo de perto a forma hebraica sem comprometer a legibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e as imagens hebraicas foram preservadas quando naturais. A concordância singular segue o coletivo “povo”; não é necessária uma nota específica sobre número gramatical em português.
