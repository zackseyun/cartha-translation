  source_fidelity: A tradução preserva os երեք imperativos hifil dirigidos a Isaías, as imagens de coração insensível, ouvidos pesados e olhos tornados incapazes de ver, bem como a oração preventiva introduzida por פֶּן. Mantém adequadamente o coletivo singular “deste povo” e a sequência verbal singular. “Volte” conserva a amplitude de וָשָׁב, sem impor “arrependa-se”. “Seja curado” é uma boa representação portuguesa da construção final elíptica וְרָפָא לוֹ.
  naturalness: O português é moderno, claro e digno. A repetição de “com os olhos / com os ouvidos / com o coração” reproduz de modo natural o paralelismo hebraico. A concordância no singular com “povo” é idiomática e clara.
  terminology: “Coração”, “insensível”, “pesados”, “feche”, “volte” e “seja curado” são escolhas adequadas e não introduzem linguagem doutrinariamente mais específica do que o hebraico. A nota em [a] registra de maneira útil a incerteza imagética do verbo referente aos olhos; a nota em [b] preserva a possibilidade contextual de arrependimento sem a tornar obrigatória.
