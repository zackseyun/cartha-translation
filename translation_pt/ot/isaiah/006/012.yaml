  text: וְ/רִחַ֥ק יְהוָ֖ה אֶת הָ/אָדָ֑ם וְ/רַבָּ֥ה הָ/עֲזוּבָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/012.yaml
  text: And Yahweh will remove people far away[b][a], and the forsaken places will be many in the midst of the land.
translation:
  language: pt
  text: E Yahweh afastará as pessoas para longe, e grande será a desolação no meio da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e muitos serão os lugares abandonados no meio da terra»; também é possível entender: «e grande será o abandono no meio da terra».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִחַק
  choice: afastará para longe
  rationale: Expressa o sentido causativo/resultativo de רחק no contexto profético, preservando explicitamente a ideia de distância.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: הָאָדָם
  choice: as pessoas
  rationale: O singular coletivo אָדָם refere-se aqui à população humana; em português corrente, «as pessoas» comunica naturalmente esse valor coletivo sem restringi-lo aos homens.
- source_word: וְרַבָּה
  choice: haverá muita
  rationale: A forma feminina predica grande quantidade ou extensão da עֲזוּבָה; esta construção é natural com o substantivo abstrato «desolação».
- source_word: הָעֲזוּבָה
  choice: desolação
  rationale: Preserva o sentido de abandono e estado deserto sem precisar decidir que a forma designa concretamente vários lugares abandonados.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: no meio da terra
  rationale: Mantém de modo claro e relativamente formal a expressão espacial hebraica.
theological_decisions:
- issue: Valor coletivo de הָאָדָם
  choice: as pessoas
  alternative: a humanidade
  rationale: O contexto trata da retirada dos habitantes sob juízo. A opção escolhida é coletiva, inclusiva e idiomática, sem acrescentar uma universalidade abstrata que «a humanidade» poderia sugerir.
- issue: Interpretação de הָעֲזוּבָה
  choice: desolação
  alternative: lugares abandonados
  rationale: O hebraico admite uma leitura abstrata, como abandono ou desolação, e uma concretização como áreas deixadas desertas. O texto principal conserva a leitura abstrata; a nota registra a alternativa concreta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Afastará para longe» preserva a ênfase espacial do hebraico; «desolação» mantém a ambiguidade entre abandono e condição deserta, esclarecida em nota.
