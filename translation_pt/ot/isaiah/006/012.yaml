    issue: Ordem de «para longe»
    rationale: A posição pós-verbal antes do objeto é possível, mas «afastará as pessoas para longe» é mais fluida e não altera a ênfase espacial do hebraico.
  - severity: low
    issue: «Haverá muita desolação» para וְרַבָּה
    rationale: A formulação é semanticamente aceitável, porém a construção hebraica predica que a desolação/abandono será grande. «Grande será a desolação» é mais fiel à forma e ao tom sem sacrificar naturalidade.
  revised_text: E Yahweh afastará as pessoas para longe, e grande será a desolação no meio da terra.[a]
