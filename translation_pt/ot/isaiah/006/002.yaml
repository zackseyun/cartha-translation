id: ISA.6.2
reference: Isaiah 6:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׂרָפִ֨ים עֹמְדִ֤ים מִ/מַּ֨עַל֙ ל֔/וֹ שֵׁ֧שׁ כְּנָפַ֛יִם שֵׁ֥שׁ כְּנָפַ֖יִם לְ/אֶחָ֑ד בִּ/שְׁתַּ֣יִם יְכַסֶּ֣ה פָנָ֗י/ו וּ/בִ/שְׁתַּ֛יִם יְכַסֶּ֥ה רַגְלָ֖י/ו וּ/בִ/שְׁתַּ֥יִם יְעוֹפֵֽף׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/002.yaml
  text: 'Seraphim were standing above him. Each had six wings: with two he covered his face[a], and with two he covered his feet, and with two he flew.'
translation:
  language: pt
  text: 'Serafins[a] estavam de pé acima dele. Cada um tinha seis asas: com duas cobria o rosto, com duas cobria os pés e com duas voava.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode estar relacionado a uma raiz que significa “queimar”, daí a possível interpretação “seres ardentes”.
    reason: Registra a alternativa etimológica sem a impor no texto principal.
lexical_decisions:
- source_word: שְׂרָפִים
  choice: Serafins
  rationale: Mantém o nome tradicional dessa classe de seres celestiais, sem transformar em tradução certa a possível etimologia “seres ardentes”.
- source_word: עֹמְדִים
  choice: estavam de pé
  rationale: Expressa naturalmente o particípio hebraico como uma posição contínua na descrição da visão.
- source_word: מִמַּעַל לוֹ
  choice: acima dele
  rationale: Indica a posição dos serafins em relação ao Senhor entronizado; o pronome masculino preserva a referência pessoal do hebraico.
- source_word: שֵׁשׁ כְּנָפַיִם ... שֵׁשׁ כְּנָפַיִם לְאֶחָד
  choice: Cada um tinha seis asas
  rationale: 'Comunica com clareza o sentido distributivo da repetição hebraica: cada serafim possuía seis asas.'
- source_word: בִּשְׁתַּיִם
  choice: com duas
  rationale: Reproduz o uso instrumental da preposição e deixa implícita, de modo natural, a referência às asas.
- source_word: יְכַסֶּה
  choice: cobria
  rationale: O imperfeito hebraico descreve a ação característica ou contínua de cada serafim na cena; o singular acompanha “cada um”.
- source_word: פָנָיו
  choice: o rosto
  rationale: Tradução idiomática em português; o possessivo fica claro pelo sujeito singular e não precisa ser repetido.
- source_word: רַגְלָיו
  choice: os pés
  rationale: É o sentido contextual mais direto do termo hebraico, preferível a “pernas”.
- source_word: יְעוֹפֵף
  choice: voava
  rationale: Mantém a descrição contínua da visão e a coordenação temporal com “cobria”.
theological_decisions:
- issue: Traduzir שְׂרָפִים literalmente ou como nome reconhecido de seres celestiais
  choice: Serafins
  alternative: seres ardentes
  rationale: A transliteração tradicional preserva a identidade textual desses seres na visão sem afirmar como significado pleno uma etimologia possível, mas incerta.
- issue: Referente do sufixo em לוֹ
  choice: acima dele
  alternative: acima disso / acima do trono
  rationale: No contexto imediato, o referente mais natural é o Senhor sentado no trono; a tradução preserva essa referência pessoal sem acrescentar identificação além do texto.
- issue: Força distributiva dos verbos no singular
  choice: 'Cada um tinha seis asas: com duas cobria...'
  alternative: 'Eles tinham seis asas cada um: com duas cobriam...'
  rationale: O singular em português conserva a passagem hebraica do plural coletivo para a descrição individual de cada serafim.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição hebraica de “seis asas” foi condensada em formulação distributiva natural. Os possessivos foram omitidos onde o português os entende pelo contexto, sem perda de referência.
