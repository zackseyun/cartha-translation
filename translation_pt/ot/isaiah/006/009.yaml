  text: וַ/יֹּ֕אמֶר לֵ֥ךְ וְ/אָמַרְתָּ֖ לָ/עָ֣ם הַ/זֶּ֑ה שִׁמְע֤וּ שָׁמ֨וֹעַ֙ וְ/אַל תָּבִ֔ינוּ וּ/רְא֥וּ רָא֖וֹ וְ/אַל תֵּדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/009.yaml
  text: 'And he said[a], “Go, and say to this people: ‘Keep hearing, but do not understand; keep seeing, but do not perceive.’”'
translation:
  language: pt
  text: 'E ele disse[a]: “Vá e diga a este povo: ‘Continuem ouvindo, mas não entendam; continuem vendo, mas não percebam.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ouçam de fato, mas não entendam; vejam de fato, mas não saibam”, preservando mais formalmente a intensificação hebraica. A frase também pode ser entendida com força preditiva: “Vocês certamente ouvirão... vocês certamente verão...”.'
    reason: Leitura alternativa da construção hebraica com imperativo e infinitivo absoluto, incluindo sua possível força preditiva.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o fluxo narrativo do wayyiqtol sem impor uma sequência temporal mais forte do que o hebraico exige.
- source_word: לֵךְ
  choice: Vá
  rationale: Imperativo simples de הלך dirigido a Isaías; é a forma direta e natural em português.
- source_word: וְאָמַרְתָּ
  choice: e diga
  rationale: Expressa naturalmente a ordem que vem em sequência após “Vá”, mantendo a coordenação do hebraico.
- source_word: לָעָם הַזֶּה
  choice: a este povo
  rationale: עָם significa normalmente “povo”; o demonstrativo é preservado e mantém o possível tom de distanciamento.
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Continuem ouvindo
  rationale: A construção com imperativo e infinitivo absoluto intensifica a ação. “Continuem ouvindo” comunica em português atual sua força insistente ou durativa sem recorrer a uma formulação opaca.
- source_word: וְאַל תָּבִינוּ
  choice: mas não entendam
  rationale: בין denota entender ou discernir. “Mas” explicita de modo natural o contraste que, no hebraico, é ligado por waw com a partícula negativa.
- source_word: וּרְאוּ רָאוֹ
  choice: continuem vendo
  rationale: Assim como na oração anterior, o imperativo seguido do infinitivo absoluto intensifica a ação; a formulação preserva o paralelismo e a ideia de continuidade.
- source_word: וְאַל תֵּדָעוּ
  choice: mas não percebam
  rationale: ידע significa literalmente saber ou conhecer, mas neste contexto visual pode envolver reconhecer ou perceber. “Percebam” produz português claro e conserva a progressão entre ver e apreender o significado, enquanto a opção mais formal é registrada na nota.
theological_decisions:
- issue: Se as formas devem ser traduzidas como ordens diretas ou como predição irônica/judicial
  choice: 'Ordens diretas com força retórica: “Continuem ouvindo... continuem vendo... mas não entendam... mas não percebam”.'
  alternative: 'Sentido preditivo: “Vocês certamente ouvirão... vocês certamente verão...”.'
  rationale: שִׁמְעוּ e רְאוּ são imperativos, e as formas negativas seguintes podem prosseguir a força de ordem. No contexto, a comissão tem dimensão irônica e judicial, mas transformar o texto principal em mera predição apagaria sua forma gramatical. A possível força preditiva é preservada em nota.
- issue: Como representar ידע sem eliminar sua relação com a visão
  choice: “não percebam” no texto principal
  alternative: “não saibam” ou “não reconheçam”
  rationale: “Perceber” é idiomático no paralelismo entre ver e compreender, mas ידע é lexicalmente mais amplo. A nota oferece “não saibam” para preservar de modo mais formal essa amplitude e evitar que a distinção entre בין e ידע seja ocultada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Continuem ouvindo” e “continuem vendo” comunicam a intensificação em linguagem corrente. A colocação do marcador [a] após “disse” vincula a nota à maneira de entender toda a fala que segue.
