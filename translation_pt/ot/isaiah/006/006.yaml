  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֣עָף אֵלַ֗/י אֶחָד֙ מִן הַ/שְּׂרָפִ֔ים וּ/בְ/יָד֖/וֹ רִצְפָּ֑ה בְּ/מֶ֨לְקַחַ֔יִם לָקַ֖ח מֵ/עַ֥ל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/006.yaml
  text: Then one of the seraphim flew to me[a], and in his hand was a glowing coal that he had taken from the altar with tongs.
translation:
  language: pt
  text: Então um dos serafins voou até mim, e em sua mão havia uma brasa incandescente[a], que ele havia tirado do altar com uma tenaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: uma brasa viva. O termo hebraico também pode designar uma pedra quente retirada do altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעָף
  choice: voou
  rationale: O verbo עוּף expressa voo; “voou” transmite diretamente o movimento, enquanto אֵלַי já indica a direção.
- source_word: אֵלַי
  choice: até mim
  rationale: A preposição אֶל com o sufixo de primeira pessoa indica movimento em direção ao profeta; “até mim” é natural e preciso em português.
- source_word: אֶחָד מִן־הַשְּׂרָפִים
  choice: um dos serafins
  rationale: “Serafins” conserva o nome tradicional e específico desses seres celestiais na visão de Isaías, sem substituir o termo por uma interpretação etimológica como “seres ardentes”.
- source_word: וּבְיָדוֹ
  choice: e em sua mão havia
  rationale: A construção hebraica é nominal. A inserção de “havia” produz uma frase clara em português e preserva a imagem concreta do objeto na mão do serafim.
- source_word: רִצְפָּה
  choice: uma brasa incandescente
  rationale: O termo pode indicar uma brasa ou pedra aquecida retirada do altar. “Brasa incandescente” comunica de modo claro o calor do objeto no contexto, sem excluir a alternativa lexical registrada na nota.
- source_word: בְּמֶלְקַחַיִם
  choice: com uma tenaz
  rationale: O substantivo designa uma tenaz ou pinça própria para manejar objetos quentes. O singular coletivo “uma tenaz” é idiomático em português.
- source_word: לָקַח
  choice: ele havia tirado
  rationale: 'O qatal descreve naturalmente uma ação anterior ao voo: o serafim já retirara do altar o objeto que tinha na mão. O mais-que-perfeito composto torna clara essa sequência.'
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: do altar
  rationale: מֵעַל significa literalmente “de sobre” ou “de cima de”. No contexto, “do altar” é fluente e conserva adequadamente a procedência.
theological_decisions:
- issue: Tradução de שְׂרָפִים na visão da sala do trono
  choice: serafins
  alternative: seres ardentes
  rationale: O termo identifica uma classe de seres celestiais em Isaías 6. Mantê-lo como “serafins” preserva a especificidade literária e teológica sem impor como tradução a possível associação etimológica com o ardor.
- issue: Tradução de רִצְפָּה na cena de purificação junto ao altar
  choice: brasa incandescente
  alternative: brasa viva; pedra quente
  rationale: O objeto aquecido vem do altar e é usado na purificação do profeta. “Brasa incandescente” torna a cena compreensível em português atual, enquanto a nota conserva a amplitude lexical do hebraico sem definir com certeza se era carvão ou pedra.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A coordenação da frase acompanha o ritmo narrativo hebraico; “sua mão” evita o lusitanismo mais marcado “na mão dele”, e “tenaz” preserva com concisão o instrumento cultual.
