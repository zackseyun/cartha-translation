source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת ק֤וֹל אֲדֹנָ/י֙ אֹמֵ֔ר אֶת מִ֥י אֶשְׁלַ֖ח וּ/מִ֣י יֵֽלֶךְ לָ֑/נוּ וָ/אֹמַ֖ר הִנְ/נִ֥י שְׁלָחֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/008.yaml
  text: Then I heard the voice of the Lord saying[a], “Whom shall I send, and who will go for us?” And I said, “Here am I[b]. Send me.”
translation:
  language: pt
  text: 'Então ouvi a voz do Senhor, que dizia: “A quem enviarei, e quem irá por nós[a]?” E eu disse: “Eis-me aqui[b]. Envia-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “por nós”. O plural pode refletir o contexto do conselho celestial; alguns leitores cristãos também percebem aqui uma ressonância canônica com a revelação trinitária posterior. O próprio texto não identifica o referente.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “Aqui estou”. A expressão hebraica comunica prontidão e disponibilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: Então ouvi
  rationale: O wayyiqtol dá continuidade à narrativa; “então” comunica com naturalidade a progressão da cena, e “ouvi” traduz diretamente o verbo שׁמע.
- source_word: קוֹל אֲדֹנָי
  choice: a voz do Senhor
  rationale: Como se trata de fala articulada, קוֹל significa naturalmente “voz”. אֲדֹנָי é o título divino tradicionalmente vertido como “Senhor”.
- source_word: אֹמֵר
  choice: que dizia
  rationale: O particípio ligado a “voz” introduz o conteúdo da fala. “Que dizia” é idiomático em português e preserva o caráter verbal da expressão.
- source_word: מִי אֶשְׁלַח
  choice: Quem enviarei
  rationale: O interrogativo מִי é o objeto do verbo “enviar”; em português, “quem” serve naturalmente tanto como sujeito quanto como objeto.
- source_word: וּמִי יֵלֶךְ לָנוּ
  choice: e quem irá por nós
  rationale: Preserva diretamente o sufixo hebraico de primeira pessoa do plural em לָנוּ, sem identificar nem reduzir o referente.
- source_word: הִנְנִי
  choice: Eis-me aqui
  rationale: A fórmula hebraica expressa presença, disponibilidade e prontidão. “Eis-me aqui” mantém a concisão e a solenidade apropriadas à cena de chamado.
- source_word: שְׁלָחֵנִי
  choice: Envia-me
  rationale: O imperativo com sufixo de primeira pessoa singular constitui uma oferta direta para receber a missão.
theological_decisions:
- issue: Primeira pessoa do plural na fala divina (“por nós”)
  choice: Manter “por nós” no texto principal sem definir o referente.
  alternative: Interpretar como conselho celestial, plural de majestade ou deliberação, ou ressonância canônica da revelação trinitária posterior.
  rationale: O hebraico emprega inequivocamente a primeira pessoa do plural, mas o próprio versículo não identifica seu referente. A tradução preserva essa tensão em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis-me aqui” conserva a solenidade tradicional sem tornar o restante do versículo arcaico. A pontuação explicita com naturalidade a introdução da fala.
