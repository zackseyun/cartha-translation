id: ISA.6.5
reference: Isaiah 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֽוֹי לִ֣/י כִֽי נִדְמֵ֗יתִי כִּ֣י אִ֤ישׁ טְמֵֽא שְׂפָתַ֨יִם֙ אָנֹ֔כִי וּ/בְ/תוֹךְ֙ עַם טְמֵ֣א שְׂפָתַ֔יִם אָנֹכִ֖י יוֹשֵׁ֑ב כִּ֗י אֶת הַ/מֶּ֛לֶךְ יְהוָ֥ה צְבָא֖וֹת רָא֥וּ עֵינָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/005.yaml
  text: And I said[a], “Woe is me, for I am ruined; for I am a man of unclean lips, and I dwell among a people of unclean lips; for my eyes have seen the King[b], Yahweh of Armies.”
translation:
  language: pt
  text: 'Então eu disse: “Ai de mim! Estou perdido,[a] pois sou um homem de lábios impuros e vivo no meio de um povo de lábios impuros; pois os meus olhos viram o Rei, Yahweh dos Exércitos.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fui destruído” ou “fui silenciado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “o SENHOR dos Exércitos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: Ai de mim!
  rationale: Expressa de modo natural e solene, em português atual, o lamento diante de desgraça e juízo iminentes.
- source_word: נִדְמֵיתִי
  choice: Estou perdido
  rationale: Comunica claramente a sensação de ruína diante da presença divina, sem restringir em excesso a ambiguidade do verbo hebraico; outras possibilidades são registradas em nota.
- source_word: אִישׁ טְמֵא שְׂפָתַיִם
  choice: um homem de lábios impuros
  rationale: Mantém a referência masculina do profeta a si mesmo e conserva a imagem hebraica da impureza localizada nos lábios, isto é, na fala.
- source_word: וּבְתוֹךְ ... יוֹשֵׁב
  choice: vivo no meio de
  rationale: Traduz a ideia de habitação contínua em português corrente e digno; o sentido contextual de ישב é residir, não simplesmente estar sentado.
- source_word: עַם טְמֵא שְׂפָתַיִם
  choice: um povo de lábios impuros
  rationale: Preserva tanto o sentido coletivo e indefinido de עַם quanto o paralelismo deliberado com a confissão pessoal de Isaías.
- source_word: הַמֶּלֶךְ
  choice: o Rei
  rationale: Conserva o artigo definido e a força titular da referência a Deus; a inicial maiúscula sinaliza esse uso titular sem acrescentar conteúdo.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Reproduz o nome divino e traduz צְבָאוֹת de maneira transparente, mantendo a imagem do soberano que comanda exércitos.
- source_word: רָאוּ עֵינַי
  choice: os meus olhos viram
  rationale: Preserva a formulação enfática e concreta do hebraico, adequada à reação imediata de Isaías à visão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta diretamente o nome da aliança. A forma Yahweh preserva sua condição de nome próprio; a forma tradicional portuguesa é indicada em nota.
- issue: Sentido de צְבָאוֹת no título divino
  choice: dos Exércitos
  alternative: dos Exércitos Celestiais; dos Exércitos do Céu
  rationale: “Exércitos” traduz o termo sem decidir silenciosamente se a referência imediata abrange forças celestiais, astros ou todos os contingentes sob o comando divino.
- issue: A ameaça expressa por נִדְמֵיתִי
  choice: Estou perdido
  alternative: Fui destruído; fui silenciado
  rationale: A escolha comunica a expectativa de ruína diante da santidade divina, mas a nota preserva a amplitude lexical e a tensão entre destruição e silêncio.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição “de lábios impuros” foi mantida por ser estrutural e teologicamente significativa. “Vivo no meio de” evita o arcaísmo de “habito” sem reduzir a dignidade do discurso.
