  text: בִּ/שְׁנַת מוֹת֙ הַ/מֶּ֣לֶךְ עֻזִּיָּ֔הוּ וָ/אֶרְאֶ֧ה אֶת אֲדֹנָ֛/י יֹשֵׁ֥ב עַל כִּסֵּ֖א רָ֣ם וְ/נִשָּׂ֑א וְ/שׁוּלָ֖י/ו מְלֵאִ֥ים אֶת הַ/הֵיכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/001.yaml
  text: In the year of King Uzziah’s death[a], I saw the Lord seated on a throne, high and lifted up[b], and the hem of his robe filled the temple.
translation:
  language: pt
  text: No ano da morte do rei Uzias, vi o Senhor, sentado num trono, alto e exaltado; as abas de seu manto[a] enchiam o templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cauda de sua veste”.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica também pode significar “palácio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת הַמֶּלֶךְ עֻזִּיָּהוּ
  choice: No ano da morte do rei Uzias
  rationale: Preserva a construção temporal e entende מוֹת como o acontecimento da morte, não como um processo. A forma portuguesa é natural e mantém o título junto ao nome.
- source_word: וָאֶרְאֶה
  choice: vi
  rationale: O wayyiqtol na primeira pessoa relata diretamente a experiência do profeta; em português, a conjunção pode ser omitida sem perda da sequência narrativa.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Trata-se do título divino אֲדֹנָי, e não do tetragrama. “O Senhor” é a forma corrente, digna e adequada ao contexto da visão.
- source_word: יֹשֵׁב עַל כִּסֵּא
  choice: sentado num trono
  rationale: Expressa com clareza tanto a postura quanto a imagem de entronização real.
- source_word: רָם וְנִשָּׂא
  choice: alto e elevado
  rationale: Mantém os dois termos e a cadência solene da expressão hebraica, sem reduzi-los a uma única ideia abstrata.
- source_word: שׁוּלָיו
  choice: as abas de seu manto
  rationale: O plural hebraico designa as extremidades inferiores ou partes pendentes da veste. “Abas” conserva o plural e oferece uma imagem concreta e compreensível.
- source_word: מְלֵאִים אֶת הַהֵיכָל
  choice: enchiam o templo
  rationale: O verbo no plural concorda com as extremidades da veste. הֵיכָל pode significar palácio ou templo; o contexto da visão cultual favorece “templo”.
theological_decisions:
- issue: Tradução de אֲדֹנָי na visão divina
  choice: o Senhor
  alternative: o Soberano
  rationale: A tradução preserva o título divino escrito no hebraico sem introduzir o nome da aliança, YHWH, que não ocorre neste versículo.
- issue: Sentido de הֵיכָל
  choice: templo
  alternative: palácio
  rationale: O termo admite os dois sentidos. A cena de adoração, com serafins e aclamação de santidade nos versículos seguintes, favorece o santuário, embora a imagem do trono também conserve a dimensão palaciana.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, enquanto “num trono” e “as abas de seu manto” evitam construções artificiais. Os marcadores de nota foram colocados junto aos termos a que se referem.
