base_translation:
  language: en
  yaml_path: translation/ot/isaiah/006/004.yaml
  text: The foundations of the thresholds shook at the sound of the one calling[b][a], and the house was filled with smoke.
translation:
  language: pt
  text: As bases das soleiras[a] tremeram ao som daquele que clamava, e a casa[b] se encheu de fumaça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os umbrais” ou “os suportes das soleiras”. A expressão hebraica se refere a elementos estruturais da área da entrada, junto às soleiras.
    reason: lexical_alternative
  - marker: b
    text: Ou “o templo”. Em hebraico, “a casa”, expressão comum para o santuário do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנֻעוּ
  choice: tremeram
  rationale: Expressa de modo natural o movimento físico causado pela voz, sem aumentar indevidamente sua intensidade.
- source_word: אַמּוֹת הַסִּפִּים
  choice: os fundamentos das soleiras
  rationale: Conserva a imagem arquitetônica e a relação construtiva do hebraico; como אַמּוֹת pode indicar bases, suportes ou partes verticais da entrada, a alternativa é registrada em nota.
- source_word: מִקּוֹל
  choice: ao som de
  rationale: Formulação idiomática em português que preserva o valor causal do hebraico, literalmente 'desde/por causa da voz ou som de'.
- source_word: הַקּוֹרֵא
  choice: daquele que clamava
  rationale: Mantém o particípio substantivado e sua ação em curso, sem identificar explicitamente o referente além do que o hebraico declara.
- source_word: וְהַבַּיִת
  choice: e a casa
  rationale: Traduz diretamente בַּיִת; no contexto, a palavra designa o santuário ou templo, sentido explicitado em nota.
- source_word: יִמָּלֵא
  choice: se encheu
  rationale: O nifal é vertido naturalmente em português como construção pronominal de sentido passivo/resultativo dentro da sequência narrativa.
- source_word: עָשָׁן
  choice: fumaça
  rationale: Equivalente lexical direto e natural em português.
theological_decisions:
- issue: Terminologia do templo na visão profética
  choice: a casa
  alternative: o templo
  rationale: O hebraico diz literalmente 'a casa', designação comum do templo. A tradução preserva a formulação da fonte, enquanto a nota esclarece seu referente contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Clamava” preserva a força vocal do contexto; “soleiras” e “fundamentos” mantêm a imagem arquitetônica. Todos os marcadores de nota aparecem no texto principal.
