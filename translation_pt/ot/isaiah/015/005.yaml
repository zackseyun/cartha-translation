  text: לִבִּ/י֙ לְ/מוֹאָ֣ב יִזְעָ֔ק בְּרִיחֶ֕/הָ עַד צֹ֖עַר עֶגְלַ֣ת שְׁלִשִׁיָּ֑ה כִּ֣י מַעֲלֵ֣ה הַ/לּוּחִ֗ית בִּ/בְכִי֙ יַֽעֲלֶה בּ֔/וֹ כִּ֚י דֶּ֣רֶךְ חוֹרֹנַ֔יִם זַעֲקַת שֶׁ֖בֶר יְעֹעֵֽרוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/005.yaml
  text: My heart cries out for Moab[a]; her fugitives flee as far as Zoar, as far as Eglath-shelishiyah. For they go up the ascent of Luhith with weeping[c][b]; for on the road to Horonaim they raise a cry of destruction.
translation:
  language: pt
  text: Meu coração clama por Moabe; seus fugitivos fogem até Zoar, até Eglate-Selisia.[a][b] Pois sobem chorando pela subida de Luíte;[c] pois, na estrada para Horonaim, levantam um grito de destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico בְּרִיחֶיהָ é difícil. Pode significar “seus fugitivos/refugiados”, como no texto, ou, mais literalmente, “suas barras”; alguns entendem esta última opção como metáfora ou propõem uma correção do texto à luz do contexto.
    reason: lexical_alternative
  - marker: b
    text: Eglate-Selisia provavelmente é um nome de lugar. A expressão também pode ser entendida literalmente como “uma novilha de três anos”.
    reason: lexical_alternative
  - marker: c
    text: Neste versículo, os verbos hebraicos alternam entre formas no singular e no plural. A tradução emprega o plural para representar o movimento coletivo do povo de Moabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי לְמוֹאָב יִזְעָק
  choice: Meu coração clama por Moabe
  rationale: Preserva a imagem hebraica do coração como centro da emoção e entende לְמוֹאָב como o objeto ou beneficiário do clamor de lamento.
- source_word: בְּרִיחֶיהָ
  choice: seus fugitivos fogem
  rationale: Embora a forma seja difícil, o contexto de pessoas que escapam da devastação favorece o sentido de fugitivos ou refugiados. O verbo “fogem” explicita em português o movimento implícito na expressão e no destino introduzido por עַד.
- source_word: עַד צֹעַר
  choice: até Zoar
  rationale: עַד indica o limite alcançado pela fuga.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Eglate-Selisia
  rationale: No contexto de vários topônimos e trajetos, a expressão provavelmente designa um lugar. A transliteração evita decidir no texto principal por sua possível leitura literal.
- source_word: מַעֲלֵה הַלּוּחִית
  choice: a subida de Luíte
  rationale: Designa uma ladeira ou via ascendente associada a Luíte; “subida” é natural e conserva a imagem geográfica.
- source_word: בִּבְכִי יַעֲלֶה בּוֹ
  choice: sobem chorando pela subida
  rationale: Expressa de modo idiomático o deslocamento acompanhado de choro. O plural trata o sujeito como o povo fugitivo coletivo, sem ocultar em nota a oscilação de número do hebraico.
- source_word: דֶּרֶךְ חוֹרֹנַיִם
  choice: na estrada de Horonaim
  rationale: Tradução natural para a rota associada ao lugar chamado Horonaim.
- source_word: זַעֲקַת שֶׁבֶר יְעֹעֵרוּ
  choice: levantam um grito de destruição
  rationale: “Levantam um grito” comunica idiomaticamente a ideia de suscitar um clamor, enquanto שֶׁבֶר aponta para ruína ou devastação.
