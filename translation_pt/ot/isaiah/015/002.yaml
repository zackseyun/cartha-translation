base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/002.yaml
  text: He has gone up to the temple[a], and Dibon to the high places, to weep. Over Nebo and over Medeba Moab wails; on every head is baldness[b], every beard is cut off.
translation:
  language: pt
  text: Subiu ao templo[a], e Dibom, aos lugares altos, para chorar. Por Nebo e por Medeba, Moabe lamenta; em toda cabeça há calvície[b], e toda barba foi cortada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Subiu à casa, e Dibom, aos lugares altos, para chorar”. A palavra hebraica traduzida como “templo” significa literalmente “casa”, mas, neste contexto, provavelmente se refere a um santuário ou templo.'
    reason: lexical_alternative
  - marker: b
    text: A calvície e o corte da barba eram sinais de luto.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: Subiu
  rationale: O qal perfeito descreve a subida como ação realizada. A forma verbal sem sujeito explícito preserva em português a indeterminação do hebraico, sem acrescentar uma identificação ausente no texto.
- source_word: הַבַּיִת
  choice: ao templo
  rationale: Embora signifique literalmente “à casa”, o paralelo com “lugares altos” e o contexto de pranto em locais de culto favorecem o sentido de templo ou santuário.
- source_word: וְדִיבֹן
  choice: e Dibom
  rationale: Mantém o topônimo e a coordenação pouco usual do hebraico, sem inserir uma preposição que o texto consonantal não repete.
- source_word: הַבָּמוֹת
  choice: aos lugares altos
  rationale: A expressão designa com frequência locais elevados de culto. “Lugares altos” preserva tanto a imagem espacial quanto a conotação religiosa.
- source_word: לְבֶכִי
  choice: para chorar
  rationale: A preposição com o substantivo indica finalidade; a construção infinitiva é natural em português.
- source_word: עַל נְבוֹ וְעַל מֵידְבָא
  choice: Por causa de Nebo e de Medeba
  rationale: עַל introduz aqui o objeto ou motivo do lamento. “Por causa de” comunica naturalmente que essas cidades são motivo do pranto.
- source_word: מוֹאָב יְיֵלִיל
  choice: Moabe solta lamentos
  rationale: O verbo expressa lamentação alta e audível. A formulação evita a possível conotação animal de “uiva”, mas conserva a intensidade do pranto.
- source_word: בְּכָל רֹאשָׁיו קָרְחָה
  choice: em toda cabeça há calvície
  rationale: Traduz distributivamente o sufixo singular coletivo ligado a Moabe e mantém a construção nominal, entendida como sinal público de luto.
- source_word: כָּל זָקָן גְּרוּעָה
  choice: toda barba foi cortada
  rationale: A forma passiva indica que as barbas foram removidas ou aparadas. “Foi cortada” é clara, literal e mantém o paralelismo com a cabeça rapada.
theological_decisions:
- issue: Identidade do sujeito que sobe
  choice: 'Manter o sujeito não expresso: “Subiu”'
  alternative: “Ele subiu” ou “Dibom subiu”
  rationale: O hebraico não identifica explicitamente o sujeito antes de “Dibom”, e a sintaxe admite mais de uma análise. O português permite conservar essa ambiguidade sem impor uma identificação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com topônimos nas formas correntes “Dibom”, “Nebo”, “Medeba” e “Moabe”. A ordem da primeira frase conserva deliberadamente algo da concisão e da ambiguidade sintática do hebraico.
