base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/004.yaml
  text: Heshbon and Elealeh cry out[a]; their voice is heard as far as Jahaz. Therefore the armed men of Moab cry out[b]; his soul trembles within him.
translation:
  language: pt
  text: Hesbom e Eleale gritam; sua voz é ouvida até Jaza. Por isso, os homens armados de Moabe soltam gritos; sua alma treme dentro dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase final em hebraico é difícil. Também pode ser entendida como: “a alma dele está angustiada por ele” ou “seu ser interior desfalece”. O singular pode se referir a Moabe personificado.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְעַק
  choice: gritam
  rationale: O verbo זעק expressa um clamor alto de aflição ou alarme. O presente dá vivacidade à poesia profética; o plural acomoda em português os dois nomes de cidades personificadas.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Hesbom e Eleale
  rationale: Nomes geográficos transliterados em formas correntes e reconhecíveis em português.
- source_word: עַד יַהַץ
  choice: até Jaza
  rationale: עַד indica o limite ou alcance do som; “até” reproduz isso de maneira direta e natural.
- source_word: נִשְׁמַע קוֹלָם
  choice: sua voz é ouvida
  rationale: Preserva a imagem hebraica de uma voz coletiva pertencente às cidades personificadas.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Marca naturalmente em português a consequência introduzida pela expressão hebraica.
- source_word: חֲלֻצֵי מוֹאָב
  choice: os homens armados de Moabe
  rationale: חֲלֻצִים designa homens equipados ou preparados para o combate. A formulação mantém explícito o sentido militar sem restringi-los a uma categoria mais específica.
- source_word: יָרִיעוּ
  choice: soltam gritos
  rationale: O hifil de רוע/ריע indica um grito forte, muitas vezes em contexto militar. Aqui, o contexto de calamidade não exige que seja entendido especificamente como grito de guerra.
- source_word: נַפְשׁוֹ
  choice: a alma dele
  rationale: נֶפֶשׁ aponta para a vida ou o ser interior. “Alma” conserva a imagem poética sem impor uma definição antropológica técnica.
- source_word: יָרְעָה לּוֹ
  choice: treme dentro dele
  rationale: A expressão hebraica é difícil e comunica perturbação ou colapso interior. Esta versão mantém a imagem tradicional e preserva o referente masculino singular, provavelmente Moabe personificado.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em נַפְשׁוֹ יָרְעָה לּוֹ
  choice: manter “a alma dele... dentro dele”, entendendo provavelmente Moabe de modo coletivo e personificado
  alternative: 'pluralizar como referência aos homens armados: “a alma deles treme dentro deles”'
  rationale: O hebraico muda dos combatentes no plural para pronomes no singular. Manter o singular preserva essa tensão gramatical e evita resolver silenciosamente a referência.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. Empregaram-se formas tradicionais dos topônimos em português e paralelismo conciso para conservar o caráter poético. O singular deliberadamente incomum da frase final reproduz a ambiguidade do hebraico.
