source:
  edition: WLC
  text: כִּֽי הִקִּ֥יפָה הַ/זְּעָקָ֖ה אֶת גְּב֣וּל מוֹאָ֑ב עַד אֶגְלַ֨יִם֙ יִלְלָתָ֔/הּ וּ/בְאֵ֥ר אֵילִ֖ים יִלְלָתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/008.yaml
  text: For the outcry has gone around the border of Moab[a]; its wailing reaches as far as Eglaim[b], and its wailing to Beer-elim.
translation:
  language: pt
  text: Pois o grito de aflição percorreu toda a fronteira de Moabe[a]; seu lamento chegou até Eglaim e até Beer-Elim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «rodeou a fronteira de Moabe». O verbo hebraico retrata o grito percorrendo toda a volta de Moabe.'
    reason: lexical_alternative
  - marker: b
    text: Beer-Elim é um nome de lugar, possivelmente com o sentido de «poço de Elim» ou «poço dos poderosos».
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação que dá continuidade ao lamento anterior; «pois» é natural e mantém a relação discursiva.
- source_word: הִקִּיפָה
  choice: percorreu toda
  rationale: O verbo expressa a ideia de dar a volta ou cercar. Com o grito como sujeito, a formulação comunica sua propagação por toda a fronteira sem perder a imagem espacial.
- source_word: הַזְּעָקָה
  choice: o grito de aflição
  rationale: זְעָקָה designa um clamor intenso provocado por angústia; a expressão explicita esse sentido em português corrente.
- source_word: אֶת גְּבוּל מוֹאָב
  choice: toda a fronteira de Moabe
  rationale: גְּבוּל tem aqui sentido geográfico de fronteira ou limite. «Toda» decorre da ideia circundante do verbo, não de um quantificador hebraico independente.
- source_word: עַד
  choice: até
  rationale: Marca a extensão geográfica alcançada pelo lamento.
- source_word: אֶגְלַיִם
  choice: Eglaim
  rationale: Topônimo transliterado de forma clara em português.
- source_word: יִלְלָתָהּ
  choice: seu lamento
  rationale: יִלְלָה indica pranto ou gemido intenso. «Lamento» conserva o tom de dor e permite uma frase natural; as duas ocorrências hebraicas são representadas por um único predicado coordenado em português.
- source_word: וּבְאֵר אֵילִים
  choice: e até Beer-Elim
  rationale: Continua o alcance geográfico do lamento em paralelismo com Eglaim; o topônimo é transliterado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação «até Eglaim e até Beer-Elim» reproduz naturalmente os dois pontos geográficos, enquanto a nota preserva a imagem mais literal do verbo hebraico.
