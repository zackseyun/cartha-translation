base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/001.yaml
  text: 'An oracle concerning Moab: because in a night Ar of Moab is devastated[a], it is destroyed; because in a night Kir of Moab is devastated[c][b], it is destroyed.'
translation:
  language: pt
  text: 'Oráculo sobre Moabe[a]:


    Pois, numa só noite[b], Ar de Moabe foi devastada, foi destruída;


    pois, numa só noite, Quir de Moabe foi devastada, foi destruída[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Peso sobre Moabe” ou “Pronunciamento sobre Moabe”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “numa noite”, expressão que ressalta a destruição súbita ocorrida no espaço de uma única noite; também pode ser traduzida por “da noite para o dia”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico também pode significar “foi silenciada” ou “foi eliminada”. A mesma expressão ocorre na declaração sobre Ar de Moabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: oráculo
  rationale: Em títulos proféticos, o termo introduz uma mensagem solene, frequentemente de juízo. “Oráculo” comunica a função do gênero sem recorrer ao literal potencialmente enganoso “peso”.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo e território.
- source_word: כִּי
  choice: pois
  rationale: Introduz o conteúdo ou fundamento da declaração profética. “Pois” preserva a ligação explicativa e a solenidade sem tornar a frase excessivamente causal.
- source_word: בְּלֵיל
  choice: numa só noite
  rationale: A expressão indefinida destaca que a ruína ocorre dentro de uma única noite. A inclusão de “só” torna essa força clara e idiomática em português.
- source_word: שֻׁדַּד
  choice: foi devastada
  rationale: O passivo expressa saque violento e desolação. “Devastada” é forte, mas não exige a ideia de aniquilação absoluta.
- source_word: עָר מוֹאָב
  choice: Ar de Moabe
  rationale: Mantém o nome próprio da cidade e reproduz de modo transparente a relação hebraica com Moabe.
- source_word: נִדְמָה
  choice: foi destruída
  rationale: No contexto da ruína de cidades, o verbo indica que elas foram eliminadas ou levadas ao fim. A nota preserva a possível imagem de terem sido silenciadas ou suprimidas.
- source_word: קִיר מוֹאָב
  choice: Quir de Moabe
  rationale: Emprega a forma portuguesa tradicional do topônimo e preserva a relação construta “de Moabe”.
