  text: כִּֽי מֵ֥י נִמְרִ֖ים מְשַׁמּ֣וֹת יִֽהְי֑וּ כִּֽי יָבֵ֤שׁ חָצִיר֙ כָּ֣לָה דֶ֔שֶׁא יֶ֖רֶק לֹ֥א הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/006.yaml
  text: For the waters of Nimrim will become desolations[a], for the grass is dried up, the vegetation is gone, and no green thing remains.
translation:
  language: pt
  text: Pois as águas de Ninrim ficarão desoladas[a], pois a relva secou, a vegetação desapareceu, e já não há nada verde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se tornarão uma desolação” ou “a região das águas ficará desolada”. A expressão hebraica é compacta e pode descrever tanto as próprias águas como estando desoladas quanto a região ao redor delas tornando-se um lugar desolado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da lamentação e do juízo no contexto; a segunda ocorrência é expressa naturalmente pela sequência explicativa em português, sem repetição necessária.
- source_word: מֵי נִמְרִים
  choice: as águas de Ninrim
  rationale: Preserva a construção hebraica no plural e translitera o topônimo.
- source_word: מְשַׁמּוֹת יִהְיוּ
  choice: ficarão desoladas
  rationale: Expressa a mudança de estado possível em היה com predicativo, mantendo a concordância com “águas”; a nota registra a formulação compacta e ambígua do hebraico.
- source_word: יָבֵשׁ חָצִיר
  choice: a relva secou
  rationale: Traduz diretamente o perfeito verbal e a vegetação herbácea, com linguagem natural e atual.
- source_word: כָּלָה דֶשֶׁא
  choice: a vegetação desapareceu
  rationale: Comunica a perda completa do broto ou verdor indicada pelo verbo e emprega um termo português amplo e acessível.
- source_word: יֶרֶק לֹא הָיָה
  choice: já não há nada verde
  rationale: Reproduz a negação existencial e o sentido abrangente de יֶרֶק, descrevendo a ausência total de verdor.
