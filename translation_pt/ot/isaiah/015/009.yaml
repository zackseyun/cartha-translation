base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/009.yaml
  text: 'For the waters of Dimon are full of blood[a], for I will bring more upon Dimon: a lion upon the fugitives of Moab[c][b], and upon the remnant of the land.'
translation:
  language: pt
  text: 'Pois as águas de Dimom estão cheias de sangue[a], pois trarei ainda mais sobre Dimom[b]: um leão sobre os fugitivos de Moabe[c] e sobre o remanescente da terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dimom” talvez forme um jogo de palavras com o termo hebraico para “sangue” (dam). Alguns relacionam esse nome de lugar a Dibom.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porei coisas adicionais sobre Dimom”. O hebraico deixa implícita a natureza das calamidades acrescentadas.'
    reason: alternative_reading
  - marker: c
    text: O “leão” pode ser literal ou uma imagem figurada de mais juízo.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי דִימוֹן
  choice: as águas de Dimom
  rationale: Mantém o plural construto e a forma do topônimo no texto massorético, preservando a possível aliteração ou associação com דָם, “sangue”.
- source_word: מָלְאוּ דָם
  choice: estão cheias de sangue
  rationale: Reproduz de modo natural e vívido o estado expresso por מלא com דָם.
- source_word: כִּי ... כִּי
  choice: Pois ... Por isso
  rationale: No primeiro caso, כִּי introduz a explicação; no segundo, a conexão pode ser entendida como consequencial. A formulação portuguesa mantém o encadeamento profético sem rigidez artificial.
- source_word: אָשִׁית עַל דִּימוֹן נוֹסָפוֹת
  choice: trarei ainda mais sobre Dimom
  rationale: שׂים com עַל pode indicar impor ou trazer algo sobre alguém; נוֹסָפוֹת deixa implícita a natureza das calamidades adicionais, e “ainda mais” preserva essa concisão.
- source_word: לִפְלֵיטַת מוֹאָב
  choice: contra os fugitivos de Moabe
  rationale: פְלֵיטָה designa os que escaparam ou fugiram. “Fugitivos” se ajusta ao contexto de invasão e fuga; “contra” explicita em português a relação hostil do leão com eles.
- source_word: אַרְיֵה
  choice: um leão
  rationale: Mantém sem interpretação a imagem concreta do substantivo singular.
- source_word: וְלִשְׁאֵרִית אֲדָמָה
  choice: e contra os que restarem na terra
  rationale: Expressa idiomaticamente שְׁאֵרִית como os sobreviventes restantes e entende אֲדָמָה em sentido territorial. O paralelo com a cláusula anterior sustenta a repetição de “contra”.
theological_decisions:
- issue: Natureza do “leão” no anúncio de juízo
  choice: Conservar a imagem concreta “um leão” sem identificar seu referente no texto principal.
  alternative: Entendê-lo explicitamente como um leão literal, uma potência invasora ou outra calamidade.
  rationale: O hebraico apresenta a imagem, mas não esclarece se ela é literal ou figurada; a tradução preserva essa ambiguidade profética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dimom” e “Moabe” seguem formas bíblicas correntes; a construção mantém a concisão e a força imagética do oráculo.
