  naturalness: O português proposto é claro e de registro bíblico moderno. A repetição de “pois” é aceitável neste contexto solene e reproduz o paralelismo causal/enfático hebraico. “Sobre os fugitivos” mantém a construção da imagem de modo mais próximo, sem prejudicar a fluência.
  terminology: “Dimom” e “Moabe” são formas adequadas. “Remanescente” corresponde bem a שְׁאֵרִית; “leão” preserva a imagem concreta e sua ambiguidade. As notas devem acompanhar a ordem dos respectivos elementos no texto.
