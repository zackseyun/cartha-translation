  text: עַל כֵּ֖ן יִתְרָ֣ה עָשָׂ֑ה וּ/פְקֻדָּתָ֔/ם עַ֛ל נַ֥חַל הָ/עֲרָבִ֖ים יִשָּׂאֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/007.yaml
  text: Therefore the abundance they have gained and what they have stored up they carry away over the Brook of the Willows[a][b].
translation:
  language: pt
  text: Por isso, levam para além do Ribeiro dos Salgueiros[a] a abundância que acumularam e aquilo que guardaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para além do uádi da Arabá” ou “para além do vale das planícies desérticas”. A expressão hebraica é incerta; a tradução tradicional é “Ribeiro dos Salgueiros”.'
    reason: alternative_reading
  - marker: b
    text: A expressão traduzida por “aquilo que guardaram” é difícil em hebraico e também pode significar “suas posses” ou “aquilo que lhes foi confiado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְרָה עָשָׂה
  choice: a abundância que acumularam
  rationale: A expressão combina a ideia de excedente ou abundância com o que foi produzido ou adquirido. No contexto da fuga dos moabitas, “acumularam” comunica naturalmente os bens reunidos sem restringi-los apenas a dinheiro.
- source_word: וּפְקֻדָּתָם
  choice: e aquilo que guardaram
  rationale: O substantivo é difícil e pode designar reservas, posses ou algo posto sob guarda. A formulação mantém a relação com bens preservados, sem eliminar a incerteza lexical, registrada em nota.
- source_word: נַחַל
  choice: Ribeiro
  rationale: O termo costuma indicar um curso de água ou vale sazonal. “Ribeiro” é claro e preserva a forma tradicional do topônimo, enquanto “uádi” seria mais técnico.
- source_word: הָעֲרָבִים
  choice: dos Salgueiros
  rationale: Segue a interpretação tradicional como nome de árvores e, portanto, como topônimo, mas a possível relação com a Arabá ou com planícies desérticas é preservada em nota.
- source_word: יִשָּׂאוּם
  choice: levam
  rationale: O verbo significa carregar ou transportar, e o sufixo retoma os bens mencionados. “Levam” expressa com naturalidade a retirada desses bens durante a fuga.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para evitar que o pronome objeto hebraico parecesse retomar apenas o segundo grupo de bens. As duas incertezas lexicais relevantes foram mantidas em notas.
