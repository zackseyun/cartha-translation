  text: In its streets they put on sackcloth; on its rooftops and in its squares everyone wails[a], going down in weeping.
translation:
  language: pt
  text: Nas suas ruas, vestem pano de saco; sobre os seus terraços e nas suas praças, todos lamentam[a], descendo em pranto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos lamentam, descendo em lágrimas”. O hebraico diz literalmente “descendo em pranto”, imagem que pode sugerir tanto uma descida física como alguém vencido pela dor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחוּצֹתָיו
  choice: Nas suas ruas
  rationale: חוּצוֹת designa os espaços exteriores ou abertos da cidade e, neste contexto urbano, corresponde naturalmente a “ruas”.
- source_word: חָגְרוּ שָׂק
  choice: vestem pano de saco
  rationale: חגר significa literalmente cingir-se; com שַׂק, descreve o ato de vestir pano áspero como sinal público de luto. A formulação é atual e preserva o costume antigo.
- source_word: עַל גַּגּוֹתֶיהָ
  choice: nos seus terraços
  rationale: גַּגּוֹת refere-se aos tetos planos das casas, usados como terraços. “Terraços” comunica a imagem com clareza em português.
- source_word: וּבִרְחֹבֹתֶיהָ
  choice: e nas suas praças
  rationale: רְחוֹבוֹת são espaços públicos largos, frequentemente praças; a escolha também mantém a distinção em relação às “ruas” do primeiro segmento.
- source_word: כֻּלֹּה
  choice: todos
  rationale: Embora a forma seja singular e literalmente signifique “toda ela”, o contexto aponta coletivamente para os habitantes da cidade.
- source_word: יְיֵלִיל
  choice: gemem
  rationale: ילל indica lamento alto e intenso. “Gemem” é digno e natural, embora um pouco menos estridente que “uivam”; o contexto de pranto mantém a intensidade.
- source_word: יֹרֵד בַּבֶּכִי
  choice: descendo em pranto
  rationale: A tradução conserva a imagem literal do particípio יֹרֵד, “descendo”, sem decidir se se trata de movimento físico ou de alguém abatido pela dor.
