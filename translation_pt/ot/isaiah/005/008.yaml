base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/008.yaml
  text: Woe to those who join house to house[a], who bring field near to field until there is no place left[b], and you are made to dwell alone in the midst of the land.
translation:
  language: pt
  text: Ai dos que juntam casa a casa e aproximam campo de campo, até não restar lugar, e vocês acabem morando sozinhos no meio da terra[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa aqui para a segunda pessoa do plural («vocês»), confrontando diretamente os acusados. O verbo tem forma passiva-causativa e pode ser traduzido mais literalmente por «serem postos a morar».
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai dos
  rationale: Introduz uma denúncia profética com tom de ameaça e lamento; é a fórmula corrente e digna em português.
- source_word: מַגִּיעֵי בַיִת בְּבַיִת
  choice: que juntam casa a casa
  rationale: O particípio causativo descreve fazer uma casa tocar outra. “Juntam” comunica com naturalidade a acumulação sucessiva de propriedades e preserva o ritmo hebraico.
- source_word: שָׂדֶה בְשָׂדֶה יַקְרִיבוּ
  choice: e aproximam campo de campo
  rationale: O verbo significa literalmente “fazer chegar perto” e, no contexto, descreve a anexação de terrenos contíguos. “Aproximam” mantém a distinção em relação ao verbo da oração anterior sem obscurecer a imagem.
- source_word: עַד אֶפֶס מָקוֹם
  choice: até não restar espaço
  rationale: 'Expressa o resultado da aquisição incessante: já não sobra lugar para outros. A formulação é clara e idiomática em português.'
- source_word: וְהוּשַׁבְתֶּם
  choice: e vocês ficarem estabelecidos
  rationale: A forma hebraica é causativa passiva e passa à segunda pessoa do plural. “Ficarem estabelecidos” preserva razoavelmente a ideia resultante e soa mais natural que uma reprodução mecânica como “serem feitos habitar”.
- source_word: לְבַדְּכֶם בְּקֶרֶב הָאָרֶץ
  choice: sozinhos no meio da terra
  rationale: Mantém tanto a exclusividade dos proprietários denunciados quanto a imagem espacial do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A repetição “casa a casa” e “campo de campo” conserva o paralelismo e a cadência da denúncia hebraica; a mudança abrupta para “vocês” foi mantida.
