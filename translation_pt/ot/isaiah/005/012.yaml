id: ISA.5.12
reference: Isaiah 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֨ה כִנּ֜וֹר וָ/נֶ֗בֶל תֹּ֧ף וְ/חָלִ֛יל וָ/יַ֖יִן מִשְׁתֵּי/הֶ֑ם וְ/אֵ֨ת פֹּ֤עַל יְהוָה֙ לֹ֣א יַבִּ֔יטוּ וּ/מַעֲשֵׂ֥ה יָדָ֖י/ו לֹ֥א רָאֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/012.yaml
  text: There are lyre and harp[a], tambourine and flute, and wine at their feasts; but they do not look to the work of Yahweh[b], and they do not see the work of his hands.
translation:
  language: pt
  text: Em seus banquetes há lira e harpa, tamborim e flauta, e vinho; mas eles não atentam para a obra de Yahweh[a], nem veem a obra de suas mãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a obra de Yahweh [...] a obra de suas mãos”, expressões paralelas que enfatizam os atos de Yahweh aos quais eles não dão atenção.'
    reason: Esclarece o paralelismo hebraico entre as duas expressões, preservado na tradução.
lexical_decisions:
- source_word: וְהָיָה
  choice: há
  rationale: O perfeito de היה introduz de modo idiomático a cena; o presente português expressa a caracterização contínua dos banquetes.
- source_word: כִנּוֹר וָנֶבֶל
  choice: lira e harpa
  rationale: Mantém dois instrumentos de cordas distintos, embora sua identificação exata seja incerta.
- source_word: תֹּף וְחָלִיל
  choice: tamborim e flauta
  rationale: Equivalentes modernos e reconhecíveis para um tambor de armação e um instrumento de sopro.
- source_word: מִשְׁתֵּיהֶם
  choice: em seus banquetes
  rationale: O substantivo indica um banquete ou festa centrada na bebida; “banquetes” é natural e o vinho explicita o contexto.
- source_word: פֹּעַל יְהוָה
  choice: ao que Yahweh faz
  rationale: Expressa naturalmente a atividade ou os atos de Yahweh, preservando o paralelismo conceitual com a obra de suas mãos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: לֹא יַבִּיטוּ
  choice: não prestam atenção
  rationale: O Hifil de נבט comunica atenção dirigida e consideração, mais que simples visão física.
- source_word: מַעֲשֵׂה יָדָיו לֹא רָאוּ
  choice: nem veem a obra de suas mãos
  rationale: Preserva a imagem concreta das mãos e o contraste poético entre não prestar atenção e não ver.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente sem substituir o nome por um título.
- issue: Sentido da obra ignorada
  choice: “o que Yahweh faz” em paralelo com “a obra de suas mãos”
  alternative: Limitar a referência à criação ou a um ato histórico específico
  rationale: O hebraico não identifica aqui uma obra específica; a tradução conserva a abrangência e a tensão da acusação profética.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Banquetes” evita a coloquialidade de “festas de bebida”; “prestam atenção” comunica o valor volitivo de יַבִּיטוּ. O marcador [a] aparece no texto principal.
