  text: אֵין עָיֵ֤ף וְ/אֵין כּוֹשֵׁל֙ בּ֔/וֹ לֹ֥א יָנ֖וּם וְ/לֹ֣א יִישָׁ֑ן וְ/לֹ֤א נִפְתַּח֙ אֵז֣וֹר חֲלָצָ֔י/ו וְ/לֹ֥א נִתַּ֖ק שְׂר֥וֹךְ נְעָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/027.yaml
  text: None among them is weary[a], and none stumbles; none slumbers or sleeps; the belt at his waist is not loosened[b], and the strap of his sandals is not broken.
translation:
  language: pt
  text: Entre eles, ninguém está cansado, ninguém tropeça; ninguém cochila nem dorme. O cinto em sua cintura não se afrouxa, e a correia de suas sandálias não se rompe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega pronomes no singular ao descrever coletivamente a força invasora: literalmente, “nele... sua cintura... suas sandálias”.'
    reason: collective_singular
lexical_decisions:
- source_word: עָיֵף
  choice: cansado
  rationale: Expressa com clareza o esgotamento físico no contexto de uma força militar em marcha.
- source_word: כּוֹשֵׁל
  choice: tropeça
  rationale: Preserva a imagem concreta de perder o passo ou vacilar.
- source_word: בּוֹ
  choice: entre eles
  rationale: O pronome hebraico é singular, mas retoma coletivamente a força invasora; a formulação distributiva é natural em português.
- source_word: יָנוּם / יִישָׁן
  choice: cochila / dorme
  rationale: Mantém os dois verbos próximos, mas distintos, e conserva o paralelismo poético.
- source_word: נִפְתַּח
  choice: se afrouxa
  rationale: No contexto de um cinto, comunica de modo idiomático que ele não se solta nem perde a firmeza.
- source_word: אֵזוֹר חֲלָצָיו
  choice: o cinto em sua cintura
  rationale: Evita o arcaísmo 'lombos' e mantém clara a localização corporal.
- source_word: נִתַּק
  choice: se rompe
  rationale: Representa adequadamente a ideia de a correia ser partida ou arrebentada.
- source_word: שְׂרוֹךְ נְעָלָיו
  choice: a correia de suas sandálias
  rationale: Mantém a concretude histórica do calçado e usa terminologia corrente.
theological_decisions: []
