source:
  edition: WLC
  text: וְ/עַתָּ֛ה יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וְ/אִ֣ישׁ יְהוּדָ֑ה שִׁפְטוּ נָ֕א בֵּינִ֖/י וּ/בֵ֥ין כַּרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/003.yaml
  text: And now[a], inhabitant of Jerusalem and man of Judah, judge, please, between me and my vineyard.
translation:
  language: pt
  text: E agora, habitante de Jerusalém e homem de Judá[a], julguem, por favor, entre mim e a minha vinha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega as expressões no singular — “habitante de Jerusalém” e “homem de Judá” — como uma forma representativa de se dirigir coletivamente ao povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Mantém a ligação com o cântico precedente e assinala a passagem retórica para o apelo direto.
- source_word: יוֹשֵׁב יְרוּשָׁלַם
  choice: habitante de Jerusalém
  rationale: Preserva o particípio no singular, empregado de modo representativo para se dirigir coletivamente à população da cidade.
- source_word: וְאִישׁ יְהוּדָה
  choice: e homem de Judá
  rationale: Conserva o substantivo masculino singular אִישׁ e seu paralelismo com “habitante de Jerusalém”, sem neutralizar a forma da fonte.
- source_word: שִׁפְטוּ
  choice: julguem
  rationale: O imperativo é plural e pede que os destinatários emitam uma avaliação; “julguem” é direto, atual e natural em português.
- source_word: נָא
  choice: por favor
  rationale: Expressa a partícula de súplica que suaviza o imperativo, sem recorrer a uma formulação arcaica.
- source_word: בֵּינִי וּבֵין כַּרְמִי
  choice: entre mim e a minha vinha
  rationale: Mantém as duas partes da controvérsia metafórica e traduz כֶּרֶם pelo termo corrente “vinha”.
theological_decisions:
- issue: Singular representativo e tratamento marcado por gênero
  choice: Manter “habitante de Jerusalém e homem de Judá” no singular
  alternative: “habitantes de Jerusalém e homens de Judá” ou “povo de Jerusalém e de Judá”
  rationale: O hebraico interpela coletivamente o público por meio de expressões representativas no singular. A tradução conserva essa textura e o masculino explícito de אִישׁ, enquanto o imperativo plural “julguem” evidencia que a convocação alcança o grupo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Julguem” evita o arcaísmo de “julgai”; “por favor” preserva o tom de apelo de נָא. A leve tensão entre os vocativos singulares e o imperativo plural foi mantida por corresponder à forma hebraica.
