  register: Português moderno, digno e amplamente compreensível, com cadência poética moderada. “Rugirá”, “trevas” e “aflição” mantêm a força profética sem arcaísmo excessivo. As notas preservam as ambiguidades reais do sufixo masculino, de אֶרֶץ, de צַר e da rara expressão final.
