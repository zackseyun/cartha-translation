base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/030.yaml
  text: And he will roar over it on that day like the roaring of the sea[a]; and if one looks to the land, behold, darkness and distress[d][c][b], and the light is darkened in its clouds.
translation:
  language: pt
  text: Naquele dia, ele rugirá sobre ele[a] como o rugido do mar. Se alguém olhar para a terra[b], eis trevas e aflição[c], e a luz se torna escura em suas nuvens[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra ele”. O sufixo hebraico é masculino singular e pode referir-se a um povo personificado, à terra ou ao alvo inimigo, conforme a relação com o contexto anterior.
    reason: alternative_reading
  - marker: b
    text: Ou “para a Terra”. A palavra hebraica אֶרֶץ pode significar “país” ou “território”, bem como “Terra” no sentido mais amplo.
    reason: lexical_alternative
  - marker: c
    text: Ou “angústia” ou “aperto”. O termo hebraico צַר expressa aflição, dificuldade ou constrição.
    reason: lexical_alternative
  - marker: d
    text: Ou “em suas nuvens espessas”. A expressão hebraica final é difícil e talvez se refira a massas de nuvens escuras em que a luz se torna obscurecida.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִנְהֹם
  choice: ele rugirá
  rationale: O verbo נהם descreve um rugido ou bramido forte. A forma está na terceira pessoa masculina do singular e deixa o sujeito implícito; “ele” preserva essa forma sem identificar além do contexto a força invasora.
- source_word: עָלָיו
  choice: sobre ela
  rationale: 'A preposição עַל com sufixo masculino singular pode indicar posição ou hostilidade: “sobre” ou “contra”. “Sobre ela” aponta naturalmente para a terra ou população atacada, enquanto a nota registra a discordância de gênero e outras referências possíveis.'
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal profética corrente, vertida de modo natural em português.
- source_word: כְּנַהֲמַת יָם
  choice: como o rugido do mar
  rationale: Conserva a comparação sonora e ameaçadora com o bramido das águas do mar.
- source_word: וְנִבַּט לָאָרֶץ
  choice: Se alguém olhar para a terra
  rationale: A forma verbal pode ser entendida de maneira impessoal. A construção condicional comunica naturalmente o ato de voltar os olhos para a região devastada, sem fixar uma pessoa específica.
- source_word: וְהִנֵּה
  choice: verá apenas
  rationale: No contexto da observação, esta formulação transmite a apresentação súbita marcada por הִנֵּה em português atual; “apenas” ressalta que a cena encontrada é inteiramente sombria.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: Equivalente direto que preserva o tom poético e profético.
- source_word: צַר
  choice: aflição
  rationale: O termo comunica aperto, angústia ou situação opressiva. “Aflição” abrange tanto a experiência humana quanto a calamidade externa.
- source_word: וָאוֹר חָשַׁךְ
  choice: até a luz escureceu
  rationale: Preserva o contraste paradoxal entre luz e escuridão e representa o perfeito hebraico como estado ou resultado já contemplado na visão profética.
- source_word: בַּעֲרִיפֶיהָ
  choice: em suas nuvens
  rationale: A expressão final é rara e difícil. “Em suas nuvens” segue diretamente a preposição ב e entende o substantivo como massas de nuvens, mantendo o sufixo feminino ligado à terra ou à cena.
