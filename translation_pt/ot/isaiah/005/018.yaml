id: ISA.5.18
reference: Isaiah 5:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֛וֹי מֹשְׁכֵ֥י הֶֽ/עָוֺ֖ן בְּ/חַבְלֵ֣י הַ/שָּׁ֑וְא וְ/כַ/עֲב֥וֹת הָ/עֲגָלָ֖ה חַטָּאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/018.yaml
  text: Woe to those who drag iniquity with cords of falsehood[a], and sin with cart ropes[b],
translation:
  language: pt
  text: Ai dos que arrastam a iniquidade com cordas de falsidade[a] e o pecado como com cordas de carroça[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com cordas de vazio” ou “de vaidade”; o termo hebraico pode indicar falsidade, vazio ou vaidade.
    reason: lexical_alternative
  - marker: b
    text: A imagem também pode sugerir que essas pessoas atraem sobre si a culpa ou o castigo, e não apenas que arrastam consigo o pecado.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Introduz uma denúncia profética com força de lamento e ameaça; é a forma portuguesa tradicional e ainda clara.
- source_word: מֹשְׁכֵי
  choice: os que arrastam
  rationale: O particípio descreve ação contínua e preserva a imagem vigorosa de puxar uma carga.
- source_word: עָוֹן
  choice: iniquidade
  rationale: Conserva o peso moral do termo e sua possível associação com culpa, além de distingui-lo de חַטָּאָה.
- source_word: בְּחַבְלֵי הַשָּׁוְא
  choice: com cordas de falsidade
  rationale: חֶבֶל designa corda, enquanto שָׁוְא pode indicar falsidade, vazio ou vaidade; 'falsidade' é natural no contexto sem eliminar as alternativas em nota.
- source_word: וְכַעֲבֹתוֹת
  choice: e ... como com cordas
  rationale: Mantém o כ comparativo e representa עֲבֹתוֹת como cordas grossas, cujo peso é sugerido pelo uso com uma carroça.
- source_word: הָעֲגָלָה
  choice: carroça
  rationale: Equivalente atual e concreto para o veículo de carga evocado pela metáfora.
- source_word: חַטָּאָה
  choice: pecado
  rationale: Tradução direta que preserva a distinção lexical em relação a 'iniquidade'.
theological_decisions:
- issue: Relação metafórica entre as pessoas e o pecado
  choice: A imagem principal mostra pessoas arrastando deliberadamente a iniquidade e o pecado.
  alternative: O texto pode sugerir que elas atraem sobre si a culpa ou o castigo por meio da falsidade.
  rationale: Os objetos diretos favorecem a imagem concreta de arrastar o mal; contudo, o alcance semântico de עָוֹן permite a nuance de culpa ou consequência, registrada sem resolver a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação completa a fórmula profética iniciada por “Ai”. A construção “como com” foi mantida para representar o כ comparativo do hebraico, apesar de sua leve estranheza, pois ela conserva a força da comparação.
