  text: וְ/עַתָּה֙ אוֹדִֽיעָה נָּ֣א אֶתְ/כֶ֔ם אֵ֛ת אֲשֶׁר אֲנִ֥י עֹשֶׂ֖ה לְ/כַרְמִ֑/י הָסֵ֤ר מְשׂוּכָּת/וֹ֙ וְ/הָיָ֣ה לְ/בָעֵ֔ר פָּרֹ֥ץ גְּדֵר֖/וֹ וְ/הָיָ֥ה לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
translation:
  language: pt
  text: 'E agora, por favor, deixem-me dizer a vocês o que farei com a minha vinha: retirarei a sua cerca viva, e ela ficará destinada à queima[a]; derrubarei o seu muro, e ela será pisoteada[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será queimada” ou “será consumida”. Literalmente: “será para queima”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ela se tornará um lugar de pisoteio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conexão discursiva de וְ como o valor temporal de עַתָּה.
- source_word: אוֹדִיעָה נָּא אֶתְכֶם
  choice: por favor, deixem-me dizer a vocês
  rationale: Expressa de modo natural o hifil de ידע, 'dar a conhecer, informar', e mantém a força cortês ou apelativa de נָא; 'a vocês' torna explícito o objeto plural.
- source_word: אֵת אֲשֶׁר אֲנִי עֹשֶׂה לְכַרְמִי
  choice: o que farei com a minha vinha
  rationale: O particípio aponta, no contexto, para a ação iminente anunciada; 'com a minha vinha' é idiomático em português para aquilo que se fará à vinha.
- source_word: הָסֵר מְשׂוּכָּתוֹ
  choice: retirarei a sua cerca viva
  rationale: O infinitivo absoluto introduz a ação decidida; 'cerca viva' distingue a sebe protetora do muro mencionado em seguida.
- source_word: וְהָיָה לְבָעֵר
  choice: e ela será consumida
  rationale: A construção é literalmente 'e será para queima/consumo'. 'Será consumida' comunica a destruição resultante sem restringir indevidamente a expressão ao ato de incendiar.
- source_word: פָּרֹץ גְּדֵרוֹ
  choice: derrubarei o seu muro
  rationale: O infinitivo absoluto exprime outra ação decisiva; 'muro' preserva a distinção entre גָּדֵר e a cerca viva anterior.
- source_word: וְהָיָה לְמִרְמָס
  choice: e ela será pisoteada
  rationale: Transforma naturalmente o substantivo 'pisoteio' em uma construção passiva portuguesa, mantendo a imagem de devastação.
theological_decisions:
- issue: A vinha como imagem metafórica de juízo
  choice: Manter a metáfora agrícola sem identificar seu referente no corpo deste versículo.
  alternative: Explicitar no texto que a vinha representa Israel ou Judá.
  rationale: Embora o contexto identifique o referente da vinha, este versículo formula o juízo por meio da imagem. Preservá-la evita inserir interpretação explicativa no texto.
- issue: Sentido de וְהָיָה לְבָעֵר
  choice: Traduzir como 'será consumida', registrando a formulação mais literal em nota.
  alternative: Traduzir como 'será queimada'.
  rationale: O hebraico admite a ideia de que a vinha ficará destinada à queima ou será consumida. A escolha mantém a força destrutiva sem encerrar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para marcar o objeto plural e 'cerca viva' para distinguir a sebe do muro. As notas preservam as alternativas genuínas das construções hebraicas.
