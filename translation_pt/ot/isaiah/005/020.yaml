  text: ה֣וֹי הָ/אֹמְרִ֥ים לָ/רַ֛ע ט֖וֹב וְ/לַ/טּ֣וֹב רָ֑ע שָׂמִ֨ים חֹ֤שֶׁךְ לְ/אוֹר֙ וְ/א֣וֹר לְ/חֹ֔שֶׁךְ שָׂמִ֥ים מַ֛ר לְ/מָת֖וֹק וּ/מָת֥וֹק לְ/מָֽר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/020.yaml
  text: Woe to those who call evil good and good evil[a], who make darkness light and light darkness[b], who make bitter sweet and sweet bitter.
translation:
  language: pt
  text: Ai dos que chamam o mal de bem e o bem de mal[a], que fazem das trevas luz e da luz trevas[b], que fazem do amargo doce e do doce amargo!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dizem ao mal: ‘Bem’, e ao bem: ‘Mal’”.'
    reason: lexical_alternative
  - marker: b
    text: As imagens repetidas de trevas e luz, amargo e doce, intensificam a acusação de inverter a realidade moral, não apenas de cometer um erro de palavras.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética de denúncia e juízo; “Ai” é a forma bíblica tradicional, clara e vigorosa em português.
- source_word: הָאֹמְרִים לָרַע טוֹב וְלַטּוֹב רָע
  choice: dos que chamam o mal de bem e o bem de mal
  rationale: Embora אָמַר signifique literalmente “dizer”, a construção predicativa expressa atribuição de nome ou valor; “chamam ... de” comunica isso naturalmente e preserva o paralelismo.
- source_word: שָׂמִים חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  choice: que fazem das trevas luz e da luz trevas
  rationale: “Fazer de X Y” reproduz de modo idiomático a inversão expressa por שׂים com לְ, sem decidir entre mera rotulação e transformação figurada.
- source_word: שָׂמִים מַר לְמָתוֹק וּמָתוֹק לְמָר
  choice: que fazem do amargo doce e do doce amargo
  rationale: Mantém a construção paralela, o contraste sensorial e a concisão poética do hebraico.
theological_decisions:
- issue: Natureza da denúncia
  choice: Condenação ampla da inversão moral, apresentada por três pares antitéticos
  alternative: Restringir o texto a uma aplicação exclusivamente judicial, social, política ou doutrinária
  rationale: O primeiro contraste é explicitamente moral, enquanto trevas/luz e amargo/doce ampliam e intensificam a acusação. A tradução não limita a aplicação além do que o texto afirma.
- issue: Sentido de שָׂמִים com לְ
  choice: Preservar a tensão entre apresentar, reclassificar e figuradamente converter uma coisa em outra
  alternative: Explicitar apenas “consideram como” ou apenas “transformam em”
  rationale: A formulação “fazem de” é natural em português e evita resolver indevidamente a amplitude metafórica da construção hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “que fazem” conserva o ritmo profético e a estrutura paralela. O ponto de exclamação explicita em português a força da interjeição inicial sem acrescentar conteúdo.
