    reason: lexical_alternative
  - marker: c
    text: Ou “como uma tempestade” ou “como um vendaval”; a imagem comunica velocidade e força destrutiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: cujas
  rationale: Introduz a oração relativa que descreve a força invasora do versículo anterior e incorpora naturalmente os sufixos possessivos hebraicos.
- source_word: חִצָּיו שְׁנוּנִים
  choice: suas flechas estão afiadas
  rationale: Preserva o sentido passivo/adjetival de armas tornadas agudas e prontas para a batalha.
- source_word: וְכָל קַשְּׁתֹתָיו דְּרֻכוֹת
  choice: e todos os seus arcos, retesados
  rationale: דְּרֻכוֹת descreve arcos encurvados ou tensionados para uso; “retesados” transmite com concisão seu estado de prontidão.
- source_word: פַּרְסוֹת סוּסָיו
  choice: os cascos dos seus cavalos
  rationale: Reproduz claramente a relação de posse expressa pela construção hebraica.
- source_word: כַּצַּר
  choice: como pederneira
  rationale: צַר designa aqui pedra muito dura, provavelmente pederneira; a comparação ressalta a dureza dos cascos.
- source_word: נֶחְשָׁבוּ
  choice: são considerados
  rationale: Mantém o valor nifal de חשׁב, “ser considerado, reputado ou tido como”, sem reduzir a expressão a mera aparência.
- source_word: וְגַלְגִּלָּיו
  choice: e suas rodas
  rationale: Conserva a formulação concisa do hebraico; o contexto militar permite entender que se trata das rodas dos carros.
- source_word: כַּסּוּפָה
  choice: como um redemoinho
  rationale: סוּפָה denota uma tempestade violenta ou redemoinho; a escolha preserva a imagem de velocidade e força impetuosa.
