translation:
  language: pt
  text: cujas flechas estão afiadas, e todos os seus arcos, retesados[a]; os cascos dos seus cavalos são considerados como pederneira[b], e suas rodas, como um redemoinho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tensionados” ou “armados”; o hebraico descreve arcos preparados e prontos para uso.
    reason: lexical_alternative
  - marker: b
