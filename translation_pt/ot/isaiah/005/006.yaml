  rationale: 'A revisão conserva a estrutura de juízo e a ação direta em primeira pessoa, enquanto corrige duas escolhas agrícolas: substitui “capinada” por “cavada” para refletir o cultivo do solo e substitui “ervas daninhas” por “abrolhos” para preservar o caráter espinhoso do par hebraico. A nota mantém a necessária cautela quanto à botânica.'
