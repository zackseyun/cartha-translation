base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
translation:
  language: pt
  text: Eu farei dela um terreno devastado; não será podada nem cavada, e nela crescerão espinheiros e abrolhos[a]. E ordenarei às nuvens que não derramem chuva sobre ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação botânica exata dos dois termos hebraicos é incerta; também podem ser traduzidos como “abrolhos e espinhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשִׁיתֵהוּ
  choice: Eu a transformarei
  rationale: שׂים tem sentido amplo de pôr ou fazer; com o predicativo בָתָה, “transformarei” expressa naturalmente em português a mudança imposta à vinha.
- source_word: בָתָה
  choice: terra devastada
  rationale: O substantivo indica terra arruinada, abandonada ou não cultivada. A escolha comunica tanto devastação quanto abandono e preserva o referente agrícola.
- source_word: לֹא יִזָּמֵר
  choice: não será podada
  rationale: No contexto de uma vinha, זמר designa a poda; a construção passiva reflete o nifal hebraico.
- source_word: וְלֹא יֵעָדֵר
  choice: nem capinada
  rationale: עדר se refere ao cultivo do solo por escavação ou enxada. “Capinada” é uma formulação agrícola clara e corrente, embora “revolvida com a enxada” seja mais literal.
- source_word: וְעָלָה
  choice: crescerão
  rationale: O verbo descreve o surgimento da vegetação indesejada; “crescerão” é idiomático e concorda naturalmente com o sujeito composto.
- source_word: שָׁמִיר וָשָׁיִת
  choice: espinheiros e ervas daninhas
  rationale: O par designa vegetação espinhosa e invasora associada à desolação. A botânica exata é incerta; por isso, a formulação evita especificação excessiva.
- source_word: וְעַל הֶעָבִים אֲצַוֶּה
  choice: Também ordenarei às nuvens
  rationale: A construção hebraica apresenta as nuvens como alvo da ordem. Em português, “ordenar às nuvens” conserva claramente essa agência.
- source_word: מֵהַמְטִיר עָלָיו מָטָר
  choice: que não derramem chuva sobre ela
  rationale: Após צוה, מן com o infinitivo expressa impedimento ou proibição. A expressão cognata literal “chover chuva” é vertida de modo natural, sem perder a ideia de retenção da chuva.
theological_decisions:
- issue: Agência do falante no juízo figurado
  choice: 'Manter a ação direta em primeira pessoa: “Eu a transformarei” e “ordenarei”'
  alternative: Apresentar a devastação de maneira impessoal
  rationale: O hebraico atribui explicitamente ao falante a imposição do juízo sobre a vinha. A tradução mantém essa força sem identificar além do que o contexto estabelece neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações segue de perto o hebraico, enquanto construções idiomáticas são usadas onde a literalidade soaria artificial.
