  text: לָ/כֵ֛ן גָּלָ֥ה עַמִּ֖/י מִ/בְּלִי דָ֑עַת וּ/כְבוֹד/וֹ֙ מְתֵ֣י רָעָ֔ב וַ/הֲמוֹנ֖/וֹ צִחֵ֥ה צָמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/013.yaml
  text: Therefore my people go into exile for lack of knowledge; their honored men are dying of hunger[a], and their multitude is parched with thirst.
translation:
  language: pt
  text: Por isso, meu povo vai para o exílio por falta de conhecimento; seus nobres passam fome[a], e sua multidão está ressequida de sede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sua glória, homens de fome”. “Sua glória” provavelmente se refere aos nobres ou às pessoas de destaque do povo; “homens de fome” designa pessoas afligidas pela fome.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência da acusação precedente de modo claro e natural.
- source_word: גָּלָה
  choice: vai para o exílio
  rationale: Preserva o sentido de exílio sem especificar uma agência que o hebraico não declara; o perfeito profético apresenta o acontecimento futuro como certo.
- source_word: עַמִּי
  choice: meu povo
  rationale: Reproduz diretamente a expressão pactual com sufixo de primeira pessoa.
- source_word: מִבְּלִי דָעַת
  choice: por falta de conhecimento
  rationale: Expressa naturalmente tanto a privação quanto a força causal da locução hebraica.
- source_word: כְבוֹדוֹ
  choice: seus nobres
  rationale: O termo significa literalmente 'sua glória', mas, no paralelismo, designa provavelmente a parcela ilustre ou proeminente do povo; a nota conserva a forma literal e a ambiguidade.
- source_word: מְתֵי רָעָב
  choice: homens de fome
  rationale: Mantém a construção hebraica incomum e não decide se ela indica famintos, vítimas da fome ou moribundos; a nota esclarece o sentido provável.
- source_word: הֲמוֹנוֹ
  choice: sua multidão
  rationale: Conserva o sentido coletivo da massa do povo e o paralelismo com os seus membros proeminentes.
- source_word: צִחֵה צָמָא
  choice: está ressequida de sede
  rationale: Transmite a extrema secura física e preserva a combinação enfática entre ressequimento e sede.
theological_decisions:
- issue: Sentido de דַּעַת na acusação profética
  choice: conhecimento
  alternative: entendimento
  rationale: '''Conhecimento'' preserva a amplitude do termo, que pode incluir conhecimento moral e pactual de Deus, sem reduzi-lo à compreensão intelectual.'
- issue: Valor temporal de גָּלָה
  choice: vai para o exílio
  alternative: foi para o exílio
  rationale: No contexto oracular, o perfeito pode apresentar como consumado um juízo ainda por ocorrer. O presente prospectivo em português comunica essa certeza sem situar necessariamente o exílio no passado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a concisão e o paralelismo proféticos; a expressão deliberadamente marcada “homens de fome” conserva uma dificuldade real do hebraico, explicada em nota.
