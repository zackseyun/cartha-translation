  timestamp: '2026-07-13T23:30:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'A versão identifica corretamente a vinha com a casa de Israel e Judá com a plantação do deleite de Yahweh, e preserva adequadamente os termos centrais. Contudo, «encontrou» e sobretudo «ouviu» explicitam ações que não estão no hebraico: depois de cada objeto esperado, o texto traz simplesmente «e eis».'
  naturalness: O português é claro e digno. «Eis» é natural no registro bíblico-literário e reproduz de modo mais direto a força abrupta de הִנֵּה do que os verbos adicionados.
  terminology: «Yahweh dos Exércitos», «casa de Israel», «justiça», «derramamento de sangue», «retidão» e «clamor» são escolhas adequadas. «Os homens de Judá» comunica melhor o uso coletivo de אִישׁ neste contexto; a nota pode registrar o singular hebraico.
  issues:
  - severity: medium
    issue: Verbos «encontrou» e «ouviu» introduzem explicitação não expressa no texto-fonte.
    rationale: O hebraico diz «esperou justiça, e eis derramamento de sangue; retidão, e eis clamor». Embora um clamor possa ser ouvido e o mal possa ser encontrado, esses verbos deslocam a formulação enfática e elíptica de הִנֵּה.
  - severity: low
    issue: «O homem de Judá» pode sugerir indevidamente um indivíduo.
    rationale: Embora אִישׁ esteja no singular, aqui funciona naturalmente como expressão coletiva em paralelo com «a casa de Israel». Uma forma plural coletiva em português é mais clara, com nota para o singular hebraico.
