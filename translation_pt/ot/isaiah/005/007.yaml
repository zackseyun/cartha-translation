source:
  edition: WLC
  text: כִּ֣י כֶ֜רֶם יְהוָ֤ה צְבָאוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/אִ֣ישׁ יְהוּדָ֔ה נְטַ֖ע שַׁעֲשׁוּעָ֑י/ו וַ/יְקַ֤ו לְ/מִשְׁפָּט֙ וְ/הִנֵּ֣ה מִשְׂפָּ֔ח לִ/צְדָקָ֖ה וְ/הִנֵּ֥ה צְעָקָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/007.yaml
  text: For the vineyard of Yahweh of Armies is the house of Israel[a], and the men of Judah are the planting of his delight. He looked for justice, but behold, bloodshed; for righteousness, but behold[c][b], an outcry.
translation:
  language: pt
  text: Pois a vinha de Yahweh dos Exércitos é a casa de Israel, e os homens de Judá são a plantação do seu deleite.[a] Ele esperava justiça, mas eis derramamento de sangue; retidão, mas eis clamor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem de Judá”. O hebraico traz “o homem de Judá” no singular, com provável sentido coletivo.'
    reason: alternative_reading
  - marker: b
    text: O hebraico faz jogos de som entre “justiça” (mishpát) e “derramamento de sangue” (mispáh), e entre “retidão” (tsedaqáh) e “clamor” (tse‘aqáh). Esses jogos sonoros acentuam o contraste entre o que Yahweh esperava e o que se vê em lugar disso.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da figura da vinha e preserva a força causal do hebraico.
- source_word: כֶרֶם
  choice: vinha
  rationale: Designa o terreno cultivado com videiras e retoma naturalmente a imagem do cântico precedente.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um termo atual e inteligível, preservando a força do título.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão coletiva e pactual convencional do hebraico.
- source_word: וְאִישׁ יְהוּדָה
  choice: o homem de Judá
  rationale: Conserva o singular hebraico e sua provável função coletiva, sem resolver silenciosamente a tensão; a nota esclarece a alternativa.
- source_word: נְטַע שַׁעֲשׁוּעָיו
  choice: a plantação que lhe dava prazer
  rationale: Mantém a metáfora agrícola e exprime de modo natural que Judá era objeto do deleite de Yahweh.
- source_word: וַיְקַו
  choice: Ele esperava
  rationale: Expressa a expectativa figurada do proprietário da vinha e sustenta o paralelismo.
- source_word: לְמִשְׁפָּט
  choice: justiça
  rationale: No contexto, refere-se à ordem social e moral justa, não apenas a uma sentença judicial.
- source_word: מִשְׂפָּח
  choice: derramamento de sangue
  rationale: O termo raro indica provavelmente violência ou sangue derramado e contrasta com מִשְׁפָּט; a perda do jogo sonoro é indicada em nota.
- source_word: לִצְדָקָה
  choice: retidão
  rationale: Preserva a ideia moral e relacional de conformidade ao que é correto, distinguindo-a de מִשְׁפָּט.
- source_word: צְעָקָה
  choice: um clamor
  rationale: Comunica o grito provocado por opressão ou injustiça e mantém a concisão do paralelo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o tetragrama; a forma Yahweh preserva o nome pactual em vez de substituí-lo por um título.
- issue: Força coletiva de וְאִישׁ יְהוּדָה
  choice: o homem de Judá
  alternative: os homens de Judá / o povo de Judá
  rationale: O singular foi preservado no texto para refletir a forma hebraica, enquanto a nota registra que ele pode ter sentido coletivo.
- issue: Linguagem figurada de expectativa divina em וַיְקַו
  choice: Ele esperava
  alternative: Ele procurou / aguardou
  rationale: Mantém a personificação própria do cântico da vinha sem transformá-la numa afirmação sistemática sobre limitação do conhecimento divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo foi tornado explícito pela repetição de “esperava”, e “ouviu” foi usado na segunda linha para formar uma expressão portuguesa natural com “clamor”, sem alterar o contraste essencial do hebraico.
