revisions:
- from: Pois a vinha de Yahweh dos Exércitos é a casa de Israel, e o homem de Judá é a plantação que lhe dava prazer.[a] Ele esperava justiça, mas encontrou derramamento de sangue; esperava retidão, mas ouviu um clamor.[b]
  to: Pois a vinha de Yahweh dos Exércitos é a casa de Israel, e os homens de Judá são a plantação do seu deleite.[a] Ele esperava justiça, mas eis derramamento de sangue; retidão, mas eis clamor.[b]
  rationale: A revisão conserva o paralelismo e a imagem agrícola, mas substitui as explicitações interpretativas «encontrou» e «ouviu» por «eis», correspondente a הִנֵּה. Também torna explícito em português o sentido coletivo de «homem de Judá», sem ocultar na nota a forma singular do hebraico.
