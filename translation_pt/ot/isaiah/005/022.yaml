source:
  edition: WLC
  text: ה֕וֹי גִּבּוֹרִ֖ים לִ/שְׁתּ֣וֹת יָ֑יִן וְ/אַנְשֵׁי חַ֖יִל לִ/מְסֹ֥ךְ שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/022.yaml
  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
translation:
  language: pt
  text: Ai dos que são heróis[a] em beber vinho e homens valentes[b] em misturar bebida forte!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “poderosos”. O termo hebraico muitas vezes designa guerreiros ou homens de grande força, mas aqui é usado ironicamente para falar da habilidade de beber.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “homens de valor”. A expressão normalmente descreve homens capazes ou valentes, mas aqui é aplicada sarcasticamente aos que sabem preparar bebida embriagante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética que expressa lamento e anuncia condenação; “Ai” é a forma corrente e vigorosa em português.
- source_word: גִּבּוֹרִים
  choice: heróis
  rationale: O termo costuma designar homens poderosos ou guerreiros, mas aqui é empregado ironicamente para exaltar uma suposta proeza no beber.
- source_word: לִשְׁתּוֹת יָיִן
  choice: em beber vinho
  rationale: A preposição com o infinitivo indica a área em que são chamados de “heróis”; “em beber vinho” mantém o paralelismo e soa natural.
- source_word: וְאַנְשֵׁי חַיִל
  choice: e homens valentes
  rationale: A expressão designa normalmente homens capazes, fortes ou valorosos; aqui sua aplicação à preparação de bebida é sarcástica.
- source_word: לִמְסֹךְ
  choice: em misturar
  rationale: O verbo significa misturar ou preparar uma bebida, preservando o paralelismo com “em beber”.
- source_word: שֵׁכָר
  choice: bebida forte
  rationale: Designa uma bebida embriagante, geralmente distinta do vinho; a tradução evita especificar sem necessidade um tipo exato de bebida.
theological_decisions:
- issue: Ironia na descrição dos beberrões
  choice: Preservar os títulos positivos “heróis” e “homens valentes” em sentido irônico
  alternative: Explicitar no texto que são beberrões habilidosos
  rationale: O hebraico cria a denúncia pela aplicação sarcástica de termos de força e valor à bebida; explicitar a ironia reduziria a força retórica.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo entre “heróis em beber” e “homens valentes em misturar”. “Bebida forte” conserva a amplitude do termo hebraico e não implica necessariamente bebida destilada.
