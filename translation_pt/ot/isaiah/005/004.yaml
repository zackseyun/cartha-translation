base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/004.yaml
  text: What more was there to do for my vineyard that I have not done in it? Why[a], when I expected it to produce grapes, did it produce wild grapes?
translation:
  language: pt
  text: Que mais havia para fazer pela minha vinha que eu não fiz nela? Por que, quando eu esperava que ela produzisse uvas, ela produziu uvas ruins[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uvas bravas”, “uvas imprestáveis” ou “fruto malcheiroso”; o termo hebraico se refere a fruto ruim e inutilizável.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לַּעֲשׂוֹת עוֹד
  choice: Que mais havia para fazer
  rationale: Reproduz a pergunta retórica sobre alguma providência ainda possível, sem ampliar o hebraico para uma afirmação explícita de impossibilidade.
- source_word: לְכַרְמִי
  choice: pela minha vinha
  rationale: A preposição לְ indica aqui ação em benefício da vinha; “pela” é idiomático em português e mantém “vinha” em sentido literal.
- source_word: וְלֹא עָשִׂיתִי בוֹ
  choice: que eu não tenha feito nela
  rationale: Preserva a força retórica de que nada necessário ficou por fazer e mantém בּוֹ como ação realizada na vinha.
- source_word: קִוֵּיתִי
  choice: eu esperava
  rationale: No contexto agrícola, קוה expressa expectativa quanto ao resultado, mais precisamente que simples espera.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: que ela produzisse uvas
  rationale: Com produtos da terra, עשה tem naturalmente o sentido de produzir; o pronome explicita a vinha como sujeito sem alterar a imagem.
- source_word: בְּאֻשִׁים
  choice: uvas ruins
  rationale: O termo designa fruto de má qualidade, repulsivo ou imprestável. “Uvas ruins” comunica diretamente o contraste com as uvas esperadas, enquanto a nota registra alternativas lexicais.
theological_decisions:
- issue: Imagem metafórica da vinha
  choice: Manter “minha vinha” como imagem literal no versículo.
  alternative: Explicitar no texto “meu povo” ou “Israel”.
  rationale: O próprio cântico interpreta a metáfora no contexto posterior; antecipar aqui o referente eliminaria o desenvolvimento poético e acrescentaria uma explicação não expressa neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com estrutura retórica próxima do hebraico. A repetição de “ela” evita dúvida sobre a vinha como sujeito da produção. A nota foi colocada junto de “uvas ruins”, termo ao qual se refere.
