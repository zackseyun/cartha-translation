base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/029.yaml
  text: Its roaring is like a lion[a], and it roars like young lions; it growls and seizes prey, and carries it off[b], with none to rescue.
translation:
  language: pt
  text: Seu rugido é como o de um leão[a]; ruge como leões jovens. Rosna, agarra a presa e a leva embora[b], e não há quem a livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como o de uma leoa»; o termo hebraico pode, em certos contextos, ser entendido mais especificamente assim, embora «leão» se ajuste bem ao paralelismo deste versículo.
    reason: lexical_alternative
  - marker: b
    text: Ou «a arrasta para longe» ou «escapa com ela»; o verbo hebraico sugere levar a presa para além de qualquer possibilidade de recuperação.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָגָה
  choice: rugido
  rationale: O substantivo designa o rugido do leão; a construção «Seu rugido é...» reproduz naturalmente a oração nominal hebraica.
- source_word: לוֹ
  choice: seu
  rationale: O sufixo masculino singular retoma a força invasora personificada no contexto anterior; «seu» preserva a referência sem explicitação indevida.
- source_word: כַּלָּבִיא
  choice: como o de um leão
  rationale: לָבִיא designa normalmente um leão forte e adulto. A formulação evita a impressão pouco natural de que o rugido seja o próprio leão e mantém o paralelismo.
- source_word: וְשאג
  choice: ruge
  rationale: O perfeito integra uma descrição poética vívida; o presente comunica essa imediatez em português.
- source_word: כַּכְּפִירִים
  choice: como leões jovens
  rationale: כְּפִירִים refere-se a leões jovens já vigorosos, e não necessariamente a filhotes pequenos.
- source_word: וְיִנְהֹם
  choice: rosna
  rationale: O verbo indica um som grave, como rosnado, distinto do rugido mencionado antes.
- source_word: וְיֹאחֵז
  choice: agarra
  rationale: O verbo significa tomar ou segurar firmemente; «agarra» é natural e vívido no contexto predatório.
- source_word: טֶרֶף
  choice: a presa
  rationale: Embora possa também indicar despojo, a metáfora do leão favorece diretamente «presa».
- source_word: וְיַפְלִיט
  choice: a leva embora
  rationale: Neste contexto, o hifil sugere retirar a presa e pô-la fora do alcance de quem poderia recuperá-la; a expressão mantém essa ideia sem estreitar demais o sentido.
- source_word: וְאֵין מַצִּיל
  choice: sem que ninguém possa livrá-la
  rationale: A cláusula declara a inexistência de quem livre a presa; «possa» expressa naturalmente a impotência total, e o pronome explicita o objeto já presente no contexto.
