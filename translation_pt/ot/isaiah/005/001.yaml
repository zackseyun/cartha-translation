base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/001.yaml
  text: 'Let me sing[a], please, for my beloved a song of my beloved concerning his vineyard: my beloved had a vineyard on a fertile hill.'
translation:
  language: pt
  text: 'Deixem-me cantar, por favor, para o meu amado uma canção do meu amado a respeito de sua vinha: meu amado tinha uma vinha numa colina fértil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “num chifre, filho de óleo”, expressão idiomática que descreve uma colina fértil.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה נָּא
  choice: Cantarei, por favor
  rationale: O coortativo na primeira pessoa expressa disposição ou autoexortação, e נָא acrescenta apelo ou suavização. A formulação conserva ambos, embora o português natural também permita «Deixem-me cantar».
- source_word: לִידִידִי
  choice: para o meu amado
  rationale: O ל marca relação ou destinatário; «para o meu amado» comunica naturalmente que a canção é cantada em favor dele ou com referência a ele.
- source_word: שִׁירַת דּוֹדִי
  choice: uma canção do meu amado
  rationale: 'Preserva a construção «canção de meu amado» e sua possível ambiguidade: pode ser uma canção pertencente a ele ou uma canção a seu respeito. Embora יָדִיד e דּוֹד sejam palavras hebraicas distintas, «amado» mantém o paralelismo poético sem introduzir diferença artificial.'
- source_word: לְכַרְמוֹ
  choice: a respeito da sua vinha
  rationale: 'Aqui ל indica assunto ou referência: a canção diz respeito à vinha do amado.'
- source_word: כֶּרֶם הָיָה לִידִידִי
  choice: meu amado tinha uma vinha
  rationale: A construção hebraica de existência com ל tem sentido possessivo; esta é a expressão corrente em português.
- source_word: בְּקֶרֶן בֶּן שָׁמֶן
  choice: numa colina fértil
  rationale: A expressão literalmente menciona um «chifre, filho de óleo/gordura». No uso topográfico e idiomático, descreve uma elevação de solo rico e fértil; o sentido é apresentado no texto e a imagem literal, em nota.
theological_decisions:
- issue: Identidade do «amado» no cântico da vinha
  choice: Manter «meu amado» sem identificá-lo no texto principal.
  alternative: Identificá-lo desde já como o SENHOR, ou entendê-lo apenas como amigo/personagem literário do profeta.
  rationale: O versículo funciona como abertura poética e ainda não explicita a identidade do amado. A tradução preserva a tensão literária que o contexto posterior esclarecerá.
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira e compreensão internacional. «A respeito de» mantém precisão sem excessiva solenidade; a repetição de «meu amado» preserva a estrutura e a tensão do original.
