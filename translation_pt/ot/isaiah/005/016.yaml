  text: וַ/יִּגְבַּ֛ה יְהוָ֥ה צְבָא֖וֹת בַּ/מִּשְׁפָּ֑ט וְ/הָ/אֵל֙ הַ/קָּד֔וֹשׁ נִקְדָּ֖שׁ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/016.yaml
  text: But Yahweh of hosts is exalted in justice[b][a], and the Holy God is shown holy in righteousness.
translation:
  language: pt
  text: Mas Yahweh dos Exércitos é exaltado no juízo[a], e o Deus Santo mostra-se santo[b] pela justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na justiça”. O termo hebraico pode designar tanto a justiça como princípio quanto o juízo posto em ação.
    reason: lexical_alternative
  - marker: b
    text: Ou “é mostrado santo” ou “é santificado”. O sentido é que a santidade de Deus é manifestada ou vindicada, não que ele passe a ser santo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּה
  choice: é exaltado
  rationale: Expressa o sentido estativo de גבה, indicando que a elevada posição de Yahweh se manifesta em seu ato judicial.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Preserva o nome divino e traduz צְבָאוֹת por uma formulação portuguesa tradicional e abrangente, sem restringi-la apenas a exércitos humanos.
- source_word: בַּמִּשְׁפָּט
  choice: no juízo
  rationale: O contexto imediato enfatiza a ação judicial divina. A expressão também permite perceber o caráter justo desse juízo; a alternativa lexical é registrada em nota.
- source_word: וְהָאֵל הַקָּדוֹשׁ
  choice: e o Deus Santo
  rationale: Formulação natural e digna que mantém אֵל como substantivo e הַקָּדוֹשׁ como qualificação de força titular.
- source_word: נִקְדָּשׁ
  choice: mostra-se santo
  rationale: Comunica o nifal de קדש como manifestação ou comprovação pública da santidade de Deus, sem sugerir que ele passe a tornar-se santo.
- source_word: בִּצְדָקָה
  choice: pela justiça
  rationale: Mantém a distinção lexical entre מִשְׁפָּט, traduzido por 'juízo', e צְדָקָה, traduzido por 'justiça', enquanto 'pela' exprime naturalmente o meio pelo qual sua santidade se manifesta.
theological_decisions:
- issue: Linguagem sobre a santidade divina sem implicar mudança na natureza de Deus
  choice: mostra-se santo
  alternative: é santificado; é mostrado santo
  rationale: O verbo não indica que Deus adquira santidade, mas que sua santidade é manifestada e vindicada por sua ação justa.
- issue: Distinção entre מִשְׁפָּט e צְדָקָה
  choice: juízo ... justiça
  alternative: justiça ... retidão; justiça ... justiça
  rationale: A escolha conserva os dois termos relacionados, porém distintos, e se ajusta ao contexto de julgamento divino sem apagar o paralelismo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem das notas acompanha os termos a que se referem, e todos os marcadores aparecem no texto principal.
