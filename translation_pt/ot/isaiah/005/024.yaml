  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵן֩ כֶּ/אֱכֹ֨ל קַ֜שׁ לְשׁ֣וֹן אֵ֗שׁ וַ/חֲשַׁ֤שׁ לֶֽהָבָה֙ יִרְפֶּ֔ה שָׁרְשָׁ/ם֙ כַּ/מָּ֣ק יִֽהְיֶ֔ה וּ/פִרְחָ֖/ם כָּ/אָבָ֣ק יַעֲלֶ֑ה כִּ֣י מָאֲס֗וּ אֵ֚ת תּוֹרַת֙ יְהוָ֣ה צְבָא֔וֹת וְ/אֵ֛ת אִמְרַ֥ת קְדֽוֹשׁ יִשְׂרָאֵ֖ל נִאֵֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/024.yaml
  text: Therefore[a], as the tongue of fire devours stubble, and dry grass sinks before the flame, so their root will become rot, and their blossom will go up like dust; for they have rejected the law of Yahweh of hosts[b], and have despised the word of the Holy One of Israel.
translation:
  language: pt
  text: Por isso, assim como a língua de fogo devora a palha, e a vegetação seca[a] se desfaz diante da chama, a raiz deles será como podridão[b], e sua flor subirá como pó; pois rejeitaram a lei de Yahweh dos Exércitos e desprezaram a palavra do Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «palha seca» ou «restolho»; o termo hebraico indica matéria vegetal seca e combustível.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como «a raiz deles se tornará podridão»; a construção hebraica permite destacar tanto a comparação quanto o resultado.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência judicial da acusação anterior em linguagem natural e clara.
- source_word: לְשׁוֹן אֵשׁ
  choice: língua de fogo
  rationale: Mantém a metáfora hebraica vívida, em vez de reduzi-la simplesmente a «chama».
- source_word: קַשׁ
  choice: palha
  rationale: Designa material vegetal seco deixado após a colheita; «palha» é corrente e preserva a imagem agrícola.
- source_word: חֲשַׁשׁ
  choice: vegetação seca
  rationale: Expressa sem estreitamento indevido o material vegetal seco e facilmente combustível indicado pelo termo.
- source_word: יִרְפֶּה
  choice: se desfaz diante de
  rationale: Comunica o enfraquecimento e colapso causados pela chama sem impor ao verbo o sentido mais específico de «ser consumido».
- source_word: כַּמָּק
  choice: como podridão
  rationale: Preserva tanto a imagem de decomposição quanto a partícula comparativa explícita no hebraico.
- source_word: כָּאָבָק יַעֲלֶה
  choice: subirá como pó
  rationale: Reproduz o movimento ascendente e a comparação com algo leve e dispersável.
- source_word: תּוֹרַת
  choice: lei
  rationale: No contexto de rejeição da aliança e juízo, «lei» comunica a autoridade normativa, embora o termo também possa significar instrução.
- source_word: אִמְרַת
  choice: palavra
  rationale: Equivalente natural para a declaração divina que Israel desprezou.
- source_word: נִאֵצוּ
  choice: desprezaram
  rationale: Expressa a atitude de desdém e rejeição afrontosa, distinguindo-a do verbo anterior traduzido por «rejeitaram».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Reproduz o nome próprio da aliança presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Tradução de יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh dos exércitos celestiais
  rationale: Mantém a fórmula tradicional e sua amplitude, sem restringir quais exércitos estão em vista.
- issue: Sentido de תּוֹרָה no contexto profético
  choice: lei
  alternative: instrução
  rationale: «Lei» preserva aqui a força normativa e pactual, sem negar a amplitude lexical de «instrução».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética foi preservada por meio das imagens paralelas de fogo, raiz, flor e pó; evitou-se linguagem excessivamente técnica ou denominacional.
