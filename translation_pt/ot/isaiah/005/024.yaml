  terminology: «Yahweh dos Exércitos», «a lei» e «o Santo de Israel» são traduções consistentes, compreensíveis e adequadas ao registro profético. «Palha», «podridão», «flor» e «pó» mantêm as imagens agrícolas e de dissolução do original.
