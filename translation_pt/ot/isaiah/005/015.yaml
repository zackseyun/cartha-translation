base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/015.yaml
  text: And man is brought low[a], and a man is humbled[b], and the eyes of the lofty will be brought low.
translation:
  language: pt
  text: E o ser humano é abatido[a], e o homem é humilhado, e os olhos dos altivos[b] serão humilhados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se curva”. O hebraico emprega aqui dois verbos relacionados, mas distintos, para descrever o abatimento.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os olhos dos elevados”, isto é, o olhar orgulhoso das pessoas altivas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: é abatido
  rationale: Expressa a ideia de baixar-se ou ser levado para baixo no contexto de juízo, mantendo distinção em relação ao verbo שׁפל das cláusulas seguintes.
- source_word: אָדָם
  choice: o ser humano
  rationale: Representa a humanidade em sentido geral e forma um paralelo poético natural, sem restringir indevidamente a referência aos homens do sexo masculino.
- source_word: וַיִּשְׁפַּל
  choice: é rebaixado
  rationale: Preserva o sentido de tornar-se baixo ou humilhado e permite repetir o mesmo verbo na última cláusula, como no hebraico.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o substantivo masculino singular e o contraste poético com o termo mais abrangente אָדָם.
- source_word: עֵינֵי גְבֹהִים
  choice: os olhos dos altivos
  rationale: Conserva a imagem concreta do hebraico, na qual os olhos representam o olhar orgulhoso de pessoas elevadas aos próprios olhos.
- source_word: תִּשְׁפַּלְנָה
  choice: serão rebaixados
  rationale: O futuro concorda com o plural feminino 'olhos' no hebraico e anuncia o juízo vindouro; a repetição de 'rebaixado' reflete a repetição da raiz שׁפל.
theological_decisions:
- issue: Relação entre אָדָם e אִישׁ
  choice: o ser humano ... o homem
  alternative: o homem ... um homem
  rationale: A combinação preserva a abrangência representativa de אָדָם e a forma masculina individualizante de אִישׁ, sem eliminar o paralelismo.
- issue: Aspecto verbal na poesia profética
  choice: presente nas duas primeiras cláusulas e futuro na última
  alternative: passado em todas as cláusulas; futuro em todas as cláusulas
  rationale: O presente comunica a vivacidade e a certeza do abatimento anunciado pelos wayyiqtol, enquanto o imperfeito final é mantido como futuro, preservando a progressão poética sem impor uma sequência narrativa rígida.
- issue: Imagem dos olhos altivos
  choice: manter literalmente 'os olhos dos altivos'
  alternative: o olhar orgulhoso
  rationale: A formulação concreta preserva a metáfora hebraica e deixa explícita em nota a associação com orgulho e arrogância.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo e repetição deliberada. 'Ser humano' tem ampla legibilidade internacional e brasileira; 'altivos' conserva o registro poético sem soar arcaico.
