  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְעַזְּקֵ֣/הוּ וַֽ/יְסַקְּלֵ֗/הוּ וַ/יִּטָּעֵ֨/הוּ֙ שֹׂרֵ֔ק וַ/יִּ֤בֶן מִגְדָּל֙ בְּ/תוֹכ֔/וֹ וְ/גַם יֶ֖קֶב חָצֵ֣ב בּ֑/וֹ וַ/יְקַ֛ו לַ/עֲשׂ֥וֹת עֲנָבִ֖ים וַ/יַּ֥עַשׂ בְּאֻשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/002.yaml
  text: He dug it up[a], cleared it of stones, and planted it with choice vines; he built a tower in its midst, and also hewed out a winepress in it. Then he expected it to produce grapes, but it produced wild grapes.
translation:
  language: pt
  text: Ele revolveu a terra, retirou as pedras e plantou nela videiras escolhidas. No meio dela, construiu uma torre e também escavou um lagar. Então esperou que ela produzisse uvas, mas ela produziu uvas ruins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uvas imprestáveis” ou “frutos ruins”. O termo hebraico indica frutos maus ou repugnantes, em contraste com as boas uvas esperadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַזְּקֵהוּ
  choice: revolveu a terra
  rationale: O verbo descreve o trabalho de cavar ou preparar o solo da vinha. “Revolveu a terra” comunica naturalmente essa preparação agrícola sem especificar além do hebraico.
- source_word: וַיְסַקְּלֵהוּ
  choice: retirou as pedras
  rationale: No contexto da vinha, o piel indica remover as pedras do terreno, não apedrejá-lo.
- source_word: שֹׂרֵק
  choice: videiras escolhidas
  rationale: O termo designa uma videira ou cepa de alta qualidade. O plural expressa em português o sentido coletivo da plantação.
- source_word: מִגְדָּל
  choice: torre
  rationale: Mantém o sentido básico do substantivo. Embora provavelmente servisse de torre de vigia, essa função não é explicitada no hebraico.
- source_word: בְּתוֹכוֹ
  choice: no meio dela
  rationale: Preserva de modo claro e natural a localização da torre dentro da vinha.
- source_word: יֶקֶב
  choice: lagar
  rationale: “Lagar” é o termo português tradicional e preciso para a instalação onde as uvas eram prensadas e o líquido recolhido.
- source_word: חָצֵב
  choice: escavou
  rationale: O verbo sugere talhar ou abrir na rocha. “Escavou” preserva a imagem concreta e combina naturalmente com “lagar”.
- source_word: וַיְקַו
  choice: esperou
  rationale: O verbo pode expressar esperar, aguardar ou ter esperança. Aqui indica a expectativa justificada do proprietário depois de todo o preparo.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: que ela produzisse uvas
  rationale: Em português, “produzir uvas” é a forma idiomática de expressar o hebraico literalmente próximo de “fazer uvas”.
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: mas ela produziu uvas ruins
  rationale: בְּאֻשִׁים designa frutos de qualidade má, imprestáveis ou repugnantes. “Uvas ruins” mantém claro o contraste sem definir indevidamente a natureza exata do defeito.
theological_decisions:
- issue: A vinha é posteriormente identificada com Israel no contexto do cântico.
  choice: Manter aqui apenas a imagem agrícola concreta.
  alternative: Explicitar já neste versículo o referente alegórico da vinha.
  rationale: O próprio versículo ainda apresenta a narrativa da vinha. A tradução preserva a tensão literária e permite que a explicação posterior do texto revele seu referente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva-se “lagar” por sua precisão e presença consolidada no vocabulário bíblico, enquanto a sintaxe ao redor esclarece seu uso.
