  text: הָ/אֹמְרִ֗ים יְמַהֵ֧ר יָחִ֛ישָׁ/ה מַעֲשֵׂ֖/הוּ לְמַ֣עַן נִרְאֶ֑ה וְ/תִקְרַ֣ב וְ/תָב֗וֹאָ/ה עֲצַ֛ת קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/נֵדָֽעָה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/019.yaml
  text: who say[a], “Let him hurry; let him hasten his work, so that we may see it; let the plan of the Holy One of Israel draw near and come, so that we may know it.”
translation:
  language: pt
  text: 'os que dizem: “Que ele se apresse; que apresse sua obra, para que a vejamos; que o plano[a] do Santo de Israel se aproxime e venha, para que o conheçamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conselho”.'
    reason: Alternativa lexical para עֲצַת, que pode designar conselho, plano ou propósito.
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: os que dizem
  rationale: O particípio continua a caracterização iniciada no contexto anterior; a formulação preserva essa ligação sem transformar a expressão em uma oração independente.
- source_word: יְמַהֵר יָחִישָׁה מַעֲשֵׂהוּ
  choice: Que ele se apresse; que execute depressa a sua obra
  rationale: Mantém os dois verbos hebraicos e sua intensificação retórica, ao mesmo tempo que produz uma construção natural em português. O tom volitivo comunica o desafio irônico dos falantes.
- source_word: מַעֲשֵׂהוּ
  choice: a sua obra
  rationale: “Obra” abrange feito, ação ou trabalho e deixa em aberto a natureza exata da atuação anunciada.
- source_word: לְמַעַן נִרְאֶה
  choice: para que a vejamos
  rationale: Expressa a finalidade e retoma naturalmente “obra” com o pronome feminino.
- source_word: וְתִקְרַב וְתָבוֹאָה
  choice: se aproxime e se cumpra
  rationale: Preserva os dois verbos coordenados. Para um plano, “se cumpra” comunica de modo natural a ideia de ele chegar ou acontecer, sem reduzir a ênfase do paralelismo.
- source_word: עֲצַת
  choice: o plano
  rationale: O substantivo pode significar conselho, plano ou propósito. “Plano” é claro no português atual e se ajusta à ação divina esperada; “conselho” é registrado em nota.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Tradução consagrada e inteligível do título divino característico de Isaías.
- source_word: וְנֵדָעָה
  choice: para que o conheçamos
  rationale: Completa o desafio dos falantes e retoma “plano”; a construção final paralela a “para que a vejamos” é natural em português.
theological_decisions:
- issue: Referente dos verbos e sufixos na terceira pessoa
  choice: Os falantes desafiam Deus ironicamente a agir depressa, mantendo-o referido como “ele”.
  alternative: Identificar explicitamente o sujeito como “Deus”.
  rationale: O contexto e a expressão “plano do Santo de Israel” identificam o referente, mas o pronome preserva a distância retórica e o tom de escárnio do hebraico.
- issue: Sentido de עֲצַת
  choice: plano
  alternative: conselho ou propósito
  rationale: “Plano” comunica claramente a intenção divina sem impor uma formulação teológica técnica; a alternativa lexical “conselho” permanece disponível em nota.
- issue: Valor de וְתָבוֹאָה aplicado ao plano
  choice: se cumpra
  alternative: venha ou chegue
  rationale: “Venha” reproduziria mais diretamente a imagem hebraica, mas soa menos natural com “plano” em português. “Se cumpra” preserva a ideia contextual de o plano chegar à realização, sem especificar além do necessário qual ação ocorrerá.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação e as exclamações evidenciam o desafio irônico sem acrescentar identificação explícita dos falantes ou de Deus. O versículo começa em minúscula por continuar sintaticamente a descrição do contexto anterior.
