  source_fidelity: A tradução comunica adequadamente a fórmula hebraica elíptica בְּאָזְנַי, entendida como a recepção direta da palavra por Isaías, e preserva a asseveração solene de אִם־לֹא em “Sem dúvida”. “Muitas casas”, “ficarão desoladas”, “casas grandes e belas” e “sem ninguém que more nelas” refletem com precisão o sentido do hebraico, inclusive a desocupação total.
  naturalness: O português é moderno, fluente e digno. “Ouvi Javé dos Exércitos declarar” torna inteligível uma elipse que, se reproduzida literalmente no corpo do texto, soaria excessivamente abrupta em português. A nota informa de modo adequado a literalidade e a ausência de verbo expresso.
  terminology: “Javé dos Exércitos” preserva o nome divino e traduz de forma estabelecida e compreensível o título יְהוָה צְבָאוֹת. “Desoladas” e “sem ninguém que more nelas” mantêm o registro profético sem introduzir interpretação doutrinária.
