source:
  edition: WLC
  text: בְּ/אָזְנָ֖/י יְהוָ֣ה צְבָא֑וֹת אִם לֹ֞א בָּתִּ֤ים רַבִּים֙ לְ/שַׁמָּ֣ה יִֽהְי֔וּ גְּדֹלִ֥ים וְ/טוֹבִ֖ים מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/009.yaml
  text: 'In my ears Yahweh of Armies has sworn: Surely many houses will become a desolation[a], great and good houses[b], without inhabitant.'
translation:
  language: pt
  text: Ouvi Javé dos Exércitos declarar:[a] “Sem dúvida, muitas casas ficarão desoladas; casas grandes e belas ficarão sem ninguém que more nelas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Aos meus ouvidos, Javé dos Exércitos”. O hebraico não traz um verbo expresso; a fórmula que se segue tem a força de um juramento solene.
    reason: idioma_e_elipse
lexical_decisions:
- source_word: בְּאָזְנָי
  choice: Ouvi ... declarar
  rationale: O hebraico diz literalmente “aos meus ouvidos” e não traz um verbo expresso. A formulação em português comunica que a mensagem foi ouvida diretamente pelo profeta, enquanto a nota preserva a imagem original.
- source_word: יְהוָה צְבָאוֹת
  choice: Javé dos Exércitos
  rationale: “Javé” representa em forma corrente portuguesa o nome divino יהוה; “dos Exércitos” torna transparente o título צְבָאוֹת, que apresenta Deus como comandante das forças celestes e terrestres.
- source_word: אִם לֹא
  choice: Sem dúvida
  rationale: Neste contexto, a expressão introduz uma afirmação solene, própria de uma fórmula de juramento, e não uma condição comum.
- source_word: בָּתִּים רַבִּים
  choice: muitas casas
  rationale: O contexto trata de imóveis acumulados, portanto o sentido concreto de “casas” é preferível a “famílias” ou “lares”.
- source_word: לְשַׁמָּה יִהְיוּ
  choice: ficarão desoladas
  rationale: Expressa com naturalidade o estado resultante de devastação indicado pelo substantivo שַׁמָּה com o verbo היה.
- source_word: גְּדֹלִים וְטוֹבִים
  choice: casas grandes e belas
  rationale: “Grandes” preserva a referência ao tamanho, e “belas” comunica a qualidade e o valor positivo de טוֹבִים neste contexto imobiliário.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sem ninguém que more nelas
  rationale: Formulação portuguesa natural que preserva a imagem severa de casas totalmente desabitadas.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Javé
  alternative: SENHOR
  rationale: O texto hebraico emprega o nome próprio divino, não o título אֲדֹנָי. “Javé” preserva essa distinção e é uma forma reconhecível em português.
- issue: Força de juramento em אִם לֹא
  choice: declarar ... Sem dúvida
  alternative: 'jurou: Certamente'
  rationale: A construção tem força de juramento, mas o hebraico não contém um verbo equivalente a “jurar”. A tradução comunica a solenidade sem inserir esse verbo no texto principal; a nota explicita a construção.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi levemente ajustada para evitar uma frase nominal obscura, e a imagem hebraica foi preservada em nota.
