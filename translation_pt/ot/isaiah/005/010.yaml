  text: For ten yoke-pairs of vineyard will yield one bath[b][a], and a homer of seed will yield an ephah.
translation:
  language: pt
  text: Pois dez juntas de vinha produzirão apenas um bato[a][b], e um hômer de semente produzirá apenas um efa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dez jeiras de vinha». O hebraico provavelmente se refere à extensão de vinha que dez juntas de bois podiam trabalhar, e não aos próprios animais.'
    reason: lexical_alternative
  - marker: b
    text: 'O bato era uma medida para líquidos, e o efa, uma medida para secos. Um hômer equivalia a dez efas. A imagem é de extrema escassez: uma grande vinha produziria pouquíssimo vinho, e a colheita corresponderia a apenas um décimo da semente plantada.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do juízo anunciado no contexto anterior, preservando a força causal do hebraico.
- source_word: עֲשֶׂרֶת
  choice: dez
  rationale: Correspondência direta do numeral cardinal.
- source_word: צִמְדֵּי כֶרֶם
  choice: jeiras de vinha
  rationale: צֶמֶד designa literalmente uma junta e, por extensão, a área de terra trabalhada por uma junta. «Jeira» comunica em português essa medida agrária sem sugerir que dez pares de animais estejam na vinha.
- source_word: יַעֲשׂוּ
  choice: produzirão
  rationale: Neste contexto agrícola, עשה tem o sentido idiomático de produzir ou render.
- source_word: בַּת אֶחָת
  choice: um bato
  rationale: Mantém por transliteração a antiga unidade hebraica para líquidos, com explicação em nota.
- source_word: וְזֶרַע חֹמֶר
  choice: e um ômer de semente
  rationale: Expressa naturalmente a construção hebraica que indica uma quantidade de semente equivalente a um חֹמֶר.
- source_word: יַעֲשֶׂה
  choice: produzirá
  rationale: Mantém a correspondência com o mesmo verbo hebraico empregado na primeira oração.
- source_word: אֵיפָה
  choice: um efa
  rationale: Mantém por transliteração a antiga unidade hebraica para secos, com explicação em nota.
