  source_fidelity: 'A estrutura e as proporções do hebraico são bem preservadas: dez צִמְדֵּי de vinha rendem um bato, e uma quantidade de semente de um חֹמֶר rende um efa. Contudo, «ômer» não é a transliteração adequada de חֹמֶר (homer); pode confundir-se com עֹמֶר, uma medida distinta. «Juntas de vinha», com nota explicativa, preserva melhor a imagem e a ambiguidade lexical do que o regionalismo potencialmente pouco transparente «jeiras».'
