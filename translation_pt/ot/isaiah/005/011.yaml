base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
translation:
  language: pt
  text: Ai dos que se levantam cedo pela manhã para correr atrás de bebida embriagante, dos que se demoram até o crepúsculo[a], até que o vinho os inflame!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o anoitecer”. A palavra hebraica pode designar o crepúsculo, sobretudo o do fim do dia, embora sua nuance exata varie conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Introduz uma denúncia profética com tom de lamento e juízo; “Ai” é a fórmula consagrada e natural em português.
- source_word: מַשְׁכִּימֵי בַבֹּקֶר
  choice: os que se levantam cedo pela manhã
  rationale: Preserva o particípio e a ênfase temporal, em linguagem clara e corrente.
- source_word: שֵׁכָר
  choice: bebida embriagante
  rationale: Designa uma bebida alcoólica, em contraste com o vinho, sem necessariamente se referir a destilados modernos; “embriagante” evita essa falsa especificidade.
- source_word: יִרְדֹּפוּ
  choice: correr atrás de
  rationale: Reproduz de modo vívido e natural a ideia de perseguir avidamente.
- source_word: מְאַחֲרֵי בַנֶּשֶׁף
  choice: os que se demoram até o crepúsculo
  rationale: Expressa a permanência prolongada até o fim do dia e mantém o sentido contextual mais provável de נֶשֶׁף.
- source_word: יַיִן
  choice: vinho
  rationale: Equivalente lexical direto e inequívoco.
- source_word: יַדְלִיקֵם
  choice: os inflama
  rationale: Mantém a metáfora do vinho que acende ou inflama os bebedores, sem reduzi-la apenas a excitação ou embriaguez.
theological_decisions: []
