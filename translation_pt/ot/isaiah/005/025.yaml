source:
  edition: WLC
  text: עַל כֵּ֡ן חָרָה֩ אַף יְהוָ֨ה בְּ/עַמּ֜/וֹ וַ/יֵּ֣ט יָד֧/וֹ עָלָ֣י/ו וַ/יַּכֵּ֗/הוּ וַֽ/יִּרְגְּזוּ֙ הֶֽ/הָרִ֔ים וַ/תְּהִ֧י נִבְלָתָ֛/ם כַּ/סּוּחָ֖ה בְּ/קֶ֣רֶב חוּצ֑וֹת בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/025.yaml
  text: Therefore the anger of Yahweh burned against his people[a], and he stretched out his hand against them and struck them; the mountains quaked, and their corpses were like refuse in the midst of the streets. For all this, his anger has not turned away, and his hand is still stretched out.
translation:
  language: pt
  text: Por isso, a ira de Yahweh se acendeu contra o seu povo. Ele estendeu a mão contra eles e os feriu; os montes tremeram, e os cadáveres deles eram como lixo[a] no meio das ruas. Com tudo isso, a sua ira não se afastou, e a sua mão continua estendida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como aquilo que é varrido»; o termo hebraico é raro e parece referir-se a algo varrido ou descartado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz de modo natural a consequência da acusação anterior e preserva a relação causal do hebraico.
- source_word: חָרָה אַף יְהוָה
  choice: a ira de Yahweh se acendeu
  rationale: Mantém a imagem hebraica da ira que arde, em formulação corrente e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título “Senhor”.
- source_word: בְּעַמּוֹ
  choice: contra o seu povo
  rationale: Com o verbo de ira, a preposição marca o alvo da indignação.
- source_word: וַיֵּט יָדוֹ עָלָיו
  choice: Ele estendeu a mão contra eles
  rationale: Preserva a imagem de ação judicial divina; o sufixo singular retoma coletivamente “povo”, expresso pelo plural natural em português.
- source_word: וַיַּכֵּהוּ
  choice: e os feriu
  rationale: Traduz a ação de golpear sem arcaísmo e trata o povo coletivo como plural em português.
- source_word: וַיִּרְגְּזוּ הֶהָרִים
  choice: os montes tremeram
  rationale: Comunica claramente o abalo descrito pelo verbo e conserva o tom profético.
- source_word: נִבְלָתָם
  choice: os cadáveres deles
  rationale: Expressa de maneira direta e solene os corpos mortos mencionados no texto.
- source_word: כַּסּוּחָה
  choice: como lixo
  rationale: O termo raro parece indicar matéria varrida, descartada ou rejeitada; “lixo” comunica a imagem com clareza, enquanto a alternativa mais literal é registrada em nota.
- source_word: בְּקֶרֶב חוּצוֹת
  choice: no meio das ruas
  rationale: Preserva tanto a localização pública quanto a força espacial da expressão.
- source_word: בְּכָל זֹאת
  choice: Apesar de tudo isso
  rationale: No refrão, a expressão ressalta que os juízos já sofridos não fizeram cessar a ira divina.
- source_word: לֹא שָׁב אַפּוֹ
  choice: a sua ira não se afastou
  rationale: Mantém a metáfora da ira que não recuou, em português idiomático.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: e a sua mão continua estendida
  rationale: Preserva a imagem recorrente de julgamento ainda ativo, sem explicá-la além do texto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o caráter de nome próprio do tetragrama e evita substituí-lo por um título.
- issue: Linguagem antropomórfica da ira e da mão de Deus
  choice: Conservar a ira que se acende e a mão estendida
  alternative: Explicitar abstratamente que Deus ficou muito irado e continuou castigando
  rationale: As imagens corporais pertencem à força poética e teológica do hebraico; mantê-las evita reduzir ou interpretar em excesso o texto.
- issue: Sentido da mão ainda estendida
  choice: Manter a imagem sem definir explicitamente se indica apenas castigo contínuo ou prontidão para novo juízo
  alternative: Traduzir diretamente como “ele ainda está castigando”
  rationale: A formulação hebraica é imagética e seu alcance deve permanecer aberto dentro do contexto profético.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A estrutura profética e as imagens concretas foram preservadas, evitando arcaísmos. O marcador [a] foi colocado junto de “lixo”, expressão à qual a nota efetivamente se refere.
