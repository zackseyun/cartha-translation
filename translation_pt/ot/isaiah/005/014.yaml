base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/014.yaml
  text: Therefore Sheol has enlarged its throat and opened its mouth without measure[a], and her splendor, her multitude, her uproar[c][b], and the one who exults in her go down.
translation:
  language: pt
  text: Por isso, Sheol[c] alargou a garganta[a] e escancarou a boca sem limite[b]; para lá descem o esplendor da cidade, sua multidão, seu tumulto e quem nela se alegra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aumentou seu apetite»; literalmente, «alargou sua nefesh», termo que aqui evoca a garganta ou o apetite.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «sem medida».'
    reason: lexical_alternative
  - marker: c
    text: Sheol é o mundo dos mortos; aqui é personificado como uma figura que escancara a boca para engolir o esplendor e os festeiros da cidade.
    reason: cultural_note
lexical_decisions:
- source_word: שְּׁאוֹל
  choice: Sheol
  rationale: Mantém o termo hebraico para o mundo dos mortos e preserva sua personificação como figura devoradora; «sepultura» ou «morte» estreitariam o sentido.
- source_word: הִרְחִיבָה ... נַפְשָׁהּ
  choice: alargou a garganta
  rationale: Embora נֶפֶשׁ literalmente possa significar «vida», «ser» ou «alma», neste contexto corporal, em paralelo com abrir a boca, «garganta» comunica naturalmente a imagem de engolir sem reduzir a expressão a mero «apetite».
- source_word: וּפָעֲרָה פִיהָ
  choice: escancarou a boca
  rationale: Expressa a abertura ampla indicada pelo verbo פער e conserva a imagem vívida do Sheol pronto para devorar.
- source_word: לִבְלִי חֹק
  choice: sem limite
  rationale: Neste idioma, חֹק indica medida ou limite, não uma lei; «sem limite» é claro e poeticamente adequado.
- source_word: וְיָרַד
  choice: para lá descem
  rationale: O presente profético comunica a certeza e a vivacidade do juízo anunciado; «para lá» explicita em português o destino indicado pelo Sheol sem alterar a imagem.
- source_word: הֲדָרָהּ
  choice: o esplendor da cidade
  rationale: O sufixo feminino remete à cidade em seu contexto; a explicitação evita que o leitor atribua o esplendor ao Sheol, também personificado no feminino no hebraico.
- source_word: הֲמוֹנָהּ
  choice: sua multidão
  rationale: Preserva o sentido coletivo da massa de pessoas ligada à cidade e mantém o registro poético.
- source_word: שְׁאוֹנָהּ
  choice: seu tumulto
  rationale: Comunica o ruído e a agitação da vida festiva da cidade, adequados ao contexto de julgamento.
- source_word: וְעָלֵז בָּהּ
  choice: quem nela se entrega à euforia
  rationale: Mantém o singular hebraico com valor genérico e transmite uma alegria intensa, possivelmente arrogante ou festiva, sem especificar além do texto.
theological_decisions:
- issue: Tradução de שְּׁאוֹל no contexto poético de juízo
  choice: Sheol
  alternative: a sepultura; a morte; o mundo dos mortos
  rationale: A transliteração preserva a referência hebraica ao domínio dos mortos e a tensão da personificação como devorador insaciável, sem identificar o termo apenas com uma sepultura física nem impor uma definição doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi ajustada para esclarecer que os sufixos femininos finais se referem à cidade, não ao Sheol, enquanto a imagem poética e a ambiguidade lexical relevante são preservadas em notas.
