source:
  edition: WLC
  text: מַצְדִּיקֵ֥י רָשָׁ֖ע עֵ֣קֶב שֹׁ֑חַד וְ/צִדְקַ֥ת צַדִּיקִ֖ים יָסִ֥ירוּ מִמֶּֽ/נּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/023.yaml
  text: who acquit the wicked for a bribe[a], and take away the righteousness of the righteous from him.
translation:
  language: pt
  text: os que absolvem o perverso por causa de um suborno[a] e tiram dos justos a sua justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que declaram justo o perverso por causa de um suborno e retiram do justo o seu direito”.'
    reason: Registra as alternativas forenses de מַצְדִּיקֵי e צִדְקַת, além de representar de modo mais explícito o sufixo masculino singular de מִמֶּנּוּ.
lexical_decisions:
- source_word: מַצְדִּיקֵי
  choice: os que absolvem
  rationale: 'O particípio hifil de צדק tem sentido forense neste contexto: declarar alguém justo ou inocente. “Absolvem” expressa isso com naturalidade em português.'
- source_word: רָשָׁע
  choice: o perverso
  rationale: O adjetivo substantivado singular designa a pessoa moralmente má e culpada. “Perverso” preserva a dimensão moral sem perder a pertinência judicial.
- source_word: עֵקֶב שֹׁחַד
  choice: por causa de suborno
  rationale: A expressão indica que o suborno é a causa ou motivação da absolvição corrupta. Esta formulação preserva essa relação sem acrescentar detalhes não expressos.
- source_word: וְצִדְקַת
  choice: e ... a sua justiça
  rationale: צְדָקָה pode significar justiça, retidão ou direito reconhecido. “Justiça” mantém a ligação lexical com צדק e a tensão entre o caráter moral e a situação judicial.
- source_word: צַדִּיקִים
  choice: dos justos
  rationale: O adjetivo plural substantivado contrasta diretamente com “o perverso”. “Os justos” é corrente, digno e semanticamente próximo do hebraico.
- source_word: יָסִירוּ
  choice: tiram
  rationale: O hifil de סור significa retirar ou remover. “Tiram” é direto e natural, comunicando a privação injusta.
- source_word: מִמֶּנּוּ
  choice: a sua
  rationale: O sufixo hebraico é masculino singular, embora retome distributivamente o plural “justos”. A construção “dos justos a sua justiça” conserva em português esse valor distributivo sem substituí-lo explicitamente por um pronome plural.
theological_decisions:
- issue: Sentido de צִדְקָה na denúncia jurídico-moral
  choice: justiça
  alternative: direito; retidão
  rationale: O contexto é de corrupção judicial, mas o termo também carrega valor moral e mantém um jogo lexical com “absolvem” e “justos”. “Justiça” preserva melhor essa amplitude sem reduzir o sentido apenas a um direito legal.
- issue: Referência singular de מִמֶּנּוּ após צַדִּיקִים
  choice: valor distributivo preservado por “a sua justiça”
  alternative: a justiça deles; do justo, o seu direito
  rationale: O Texto Massorético apresenta antecedente plural e sufixo singular. A tradução evita corrigir silenciosamente essa forma para um plural explícito, ao mesmo tempo que permanece compreensível em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo e a repetição da raiz צדק são preservados tanto quanto possível por “absolvem”, “justos” e “justiça”; a nota registra uma versão mais formal e estritamente forense.
