  text: וְ/נָֽשָׂא נֵ֤ס לַ/גּוֹיִם֙ מֵ/רָח֔וֹק וְ/שָׁ֥רַק ל֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ וְ/הִנֵּ֥ה מְהֵרָ֖ה קַ֥ל יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/026.yaml
  text: He will raise a signal for the nations from far away[a], and whistle for them from the end of the earth; and behold, quickly, swiftly[c][b], it comes.
translation:
  language: pt
  text: Ele erguerá um sinal[a] para as nações distantes e assobiará[b] para elas desde os confins da terra; e eis que vem[c] depressa, velozmente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma bandeira” ou “um estandarte”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico indica a produção de um som agudo para chamar ou convocar.
    reason: lexical_alternative
  - marker: c
    text: 'Em hebraico, o pronome anterior e o verbo estão no singular: literalmente, “para ele ... vem”. O singular provavelmente representa a força invasora como um conjunto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: Ele erguerá
  rationale: O perfeito hebraico tem valor futuro no fluxo profético. “Erguerá” expressa naturalmente o ato de levantar um sinal visível.
- source_word: נֵס
  choice: um sinal
  rationale: O termo designa um sinal elevado para convocar ou reunir, muitas vezes com conotação militar. “Sinal” comunica sua função sem restringi-lo a um tipo específico de bandeira.
- source_word: לַגּוֹיִם מֵרָחוֹק
  choice: para as nações de longe
  rationale: Mantém “nações” para גּוֹיִם e liga a expressão de distância aos povos convocados, leitura natural no contexto.
- source_word: וְשָׁרַק
  choice: e assobiará
  rationale: O verbo descreve um som agudo usado como chamado. “Assobiará” é claro em português moderno e evita a ideia de hostilidade que “sibilará” poderia sugerir.
- source_word: לוֹ
  choice: para elas
  rationale: Embora o hebraico use pronome masculino singular, o referente contextual são coletivamente as nações. O plural feminino é natural em português; a mudança de número é explicitada em nota.
- source_word: מִקְצֵה הָאָרֶץ
  choice: desde os confins da terra
  rationale: A expressão indica os lugares mais remotos. “Confins da terra” conserva a imagem espacial e o alcance internacional.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva a vivacidade e a súbita focalização do marcador profético hebraico.
- source_word: מְהֵרָה קַל
  choice: depressa, velozmente
  rationale: Os dois termos acumulam ênfase sobre a rapidez da chegada. A dupla formulação mantém essa intensificação sem soar artificial.
- source_word: יָבֹוא
  choice: vem
  rationale: O singular hebraico apresenta a força invasora como uma unidade coletiva. O presente após “eis que” transmite chegada vívida e iminente.
theological_decisions:
- issue: Número gramatical da força convocada
  choice: 'Usar “para elas” em referência às nações, mas conservar o verbo final no singular: “vem”.'
  alternative: Uniformizar todo o trecho no plural (“para elas... vêm”) ou explicitar um referente singular (“para ele... ele vem”).
  rationale: O hebraico menciona nações no plural, mas passa a pronome e verbo no singular, provavelmente concebendo a força invasora coletivamente. A tradução preserva essa tensão em vez de resolvê-la por completo; trata-se de uma decisão gramatical e literária, não doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” preserva deliberadamente o tom profético elevado; “assobiará” mantém a imagem concreta do chamado. A pontuação destaca a rapidez enfática da chegada.
