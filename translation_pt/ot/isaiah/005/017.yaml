  yaml_path: translation/ot/isaiah/005/017.yaml
  text: Then lambs will graze as in their pasture[d][c][b][a], and sojourners will eat among the ruins of the well-fed.
translation:
  language: pt
  text: Então os cordeiros[a] pastarão como em seu próprio pasto[b], e os estrangeiros residentes[d] comerão entre as ruínas dos abastados[c].
  philosophy: optimal-equivalence
  footnotes:
