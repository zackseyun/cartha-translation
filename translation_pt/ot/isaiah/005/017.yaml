lexical_decisions:
- source_word: וְרָעוּ
  choice: Então ... pastarão
  rationale: O qal de רעה descreve animais que pastam. “Então” expressa naturalmente a consequência do juízo anunciado no contexto anterior.
- source_word: כְבָשִׂים
  choice: cordeiros
  rationale: O termo pode designar ovelhas em geral, mas “cordeiros” preserva seu sentido comum e a imagem de animais vulneráveis pastando depois da queda dos poderosos.
- source_word: כְדָבְרָם
  choice: como em seu próprio pasto
  rationale: A forma hebraica é difícil. No contexto, a interpretação tradicional ligada a um lugar de pastagem é a mais coerente; “seu próprio” comunica a ideia de pastarem livremente como em terreno destinado a eles.
- source_word: וְחָרְבוֹת
  choice: entre as ruínas
  rationale: O plural denota lugares arruinados ou desolados. A preposição “entre” torna explícito em português o valor locativo exigido pelo contexto.
- source_word: מֵחִים
  choice: dos abastados
  rationale: A forma rara é geralmente entendida como referência aos gordos, bem alimentados ou prósperos. “Abastados” conserva a dimensão social sem transformar a imagem em descrição meramente física.
- source_word: גָּרִים
  choice: forasteiros
  rationale: גרים designa pessoas de fora que vivem ou permanecem em terra alheia. “Forasteiros” é claro e natural no verso, além de ressaltar a inversão social.
- source_word: יֹאכֵלוּ
  choice: comerão
  rationale: O sentido comum de אכל é “comer”. Aqui, a expressão sugere que os forasteiros se alimentarão do que houver entre as propriedades arruinadas dos abastados.
