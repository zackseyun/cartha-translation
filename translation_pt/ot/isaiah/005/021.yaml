base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/021.yaml
  text: Woe to those who are wise in their own eyes and discerning in their own sight[a].
translation:
  language: pt
  text: Ai dos que são sábios aos seus próprios olhos e se consideram entendidos[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “capazes de discernir”. O termo hebraico indica inteligência perceptiva ou discernimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Interjeição profética que expressa denúncia e anuncia juízo; “Ai” é a forma consagrada e natural em português.
- source_word: חֲכָמִים
  choice: sábios
  rationale: Mantém o sentido direto do adjetivo substantivado e sua relação com a autoavaliação condenada no versículo.
- source_word: בְּעֵינֵיהֶם
  choice: aos seus próprios olhos
  rationale: Reproduz com naturalidade o idioma hebraico de autoavaliação, tornando clara a força reflexiva do sufixo.
- source_word: וְנֶגֶד פְּנֵיהֶם
  choice: se consideram
  rationale: Expressa em português corrente a ideia idiomática de parecer algo diante de si mesmos, preservando o paralelismo sem recorrer à formulação pouco natural “diante do próprio rosto”.
- source_word: נְבֹנִים
  choice: entendidos
  rationale: Comunica inteligência perceptiva e capacidade de discernimento, além de conservar a distinção lexical em relação a “sábios”.
