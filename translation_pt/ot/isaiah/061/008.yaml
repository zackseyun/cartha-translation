id: ISA.61.8
reference: Isaiah 61:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י אֲנִ֤י יְהוָה֙ אֹהֵ֣ב מִשְׁפָּ֔ט שֹׂנֵ֥א גָזֵ֖ל בְּ/עוֹלָ֑ה וְ/נָתַתִּ֤י פְעֻלָּתָ/ם֙ בֶּ/אֱמֶ֔ת וּ/בְרִ֥ית עוֹלָ֖ם אֶכְר֥וֹת לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/008.yaml
  text: For I[a], Yahweh, love justice; I hate robbery with burnt offering. And I will give them their recompense in faithfulness[c][b], and I will cut an everlasting covenant with them.
translation:
  language: pt
  text: Pois eu, Javé, amo a justiça; odeio o roubo com holocausto.[a] Eu lhes darei a sua recompensa com fidelidade[b] e firmarei com eles uma aliança eterna.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “roubo em um holocausto”, “roubo para um holocausto” ou, possivelmente, “roubo com injustiça”. A expressão hebraica é difícil e pode se referir a bens roubados apresentados como oferta ou à injustiça misturada ao culto.
    reason: alternative_reading
  - marker: b
    text: Ou “seu pagamento” ou “seu salário”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “cortarei com eles uma aliança”, expressão idiomática hebraica que significa firmar uma aliança.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Forma portuguesa corrente do nome divino, preservando seu caráter pessoal e pactual.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: O contraste ético com o roubo favorece o sentido social e moral de justiça, não apenas um julgamento judicial.
- source_word: גָזֵל
  choice: roubo
  rationale: Expressa de modo conciso a apropriação violenta ou injusta indicada pelo substantivo hebraico.
- source_word: בְּעוֹלָה
  choice: com holocausto
  rationale: Segue a vocalização massorética עוֹלָה, “holocausto”, e mantém aberta a relação exata entre o roubo e a oferta sacrificial.
- source_word: פְעֻלָּתָם
  choice: a sua recompensa
  rationale: No contexto da promessa divina, designa aquilo que lhes é dado como retribuição; a nota registra os sentidos próximos “pagamento” e “salário”.
- source_word: בֶּאֱמֶת
  choice: com fidelidade
  rationale: Apresenta a ação de Deus como fiel, segura e verdadeira, em harmonia com o contexto de aliança.
- source_word: בְרִית עוֹלָם
  choice: uma aliança eterna
  rationale: Equivalente natural da fórmula hebraica de aliança duradoura.
- source_word: אֶכְרֹת
  choice: firmarei
  rationale: Traduz naturalmente em português o sentido do idioma hebraico “cortar uma aliança”, cuja forma literal é explicada em nota.
theological_decisions:
- issue: Interpretação de גָזֵל בְּעוֹלָה
  choice: roubo com holocausto
  alternative: roubo em holocausto; roubo para holocausto; roubo com injustiça
  rationale: A formulação conserva a vocalização massorética e a associação compacta entre injustiça e culto, sem definir indevidamente a função da preposição. A leitura “injustiça” pressupõe outra compreensão da forma consonantal e fica registrada como possibilidade.
- issue: Sentido de פְעֻלָּתָם
  choice: a sua recompensa
  alternative: seu pagamento; seu salário; sua obra
  rationale: O contexto de restauração e aliança favorece aquilo que Deus lhes concede como retribuição, sem eliminar em nota a amplitude lexical do termo.
- issue: Expressão כרת ברית
  choice: firmarei uma aliança
  alternative: cortarei uma aliança
  rationale: “Firmar uma aliança” comunica em português atual o sentido do idioma hebraico, enquanto a nota preserva sua imagem literal sem produzir uma frase obscura no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Javé” preserva o nome divino em forma portuguesa; “firmarei” evita reproduzir de modo obscuro o idioma hebraico, explicado em nota. A construção difícil ligada a בְּעוֹלָה permanece compacta no texto e suas principais possibilidades são apresentadas sem resolver artificialmente a ambiguidade.
