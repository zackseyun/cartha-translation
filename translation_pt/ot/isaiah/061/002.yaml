  text: לִ/קְרֹ֤א שְׁנַת רָצוֹן֙ לַֽ/יהוָ֔ה וְ/י֥וֹם נָקָ֖ם לֵ/אלֹהֵ֑י/נוּ לְ/נַחֵ֖ם כָּל אֲבֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/002.yaml
  text: to proclaim the year of Yahweh’s favor and the day of vengeance of our God[a], to comfort all who mourn[b],
translation:
  language: pt
  text: para proclamar o ano do favor de Yahweh[a] e o dia da vingança do nosso Deus, para consolar todos os que estão de luto[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o ano da aceitação de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os enlutados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: proclamar
  rationale: O infinitivo de קרא expressa aqui o anúncio público que integra a missão descrita; “proclamar” comunica melhor essa função do que o genérico “chamar”.
- source_word: שְׁנַת רָצוֹן
  choice: o ano do favor
  rationale: רָצוֹן pode indicar favor, boa vontade ou aceitação. “Ano do favor” é claro e natural, sem eliminar a nuance de acolhimento divino, registrada na nota.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: A preposição ל relaciona o ano e o favor ao nome divino. “De Yahweh” preserva essa relação e representa diretamente o Tetragrama.
- source_word: וְיוֹם נָקָם
  choice: e o dia da vingança
  rationale: נָקָם designa retribuição ou vingança. A formulação mantém o paralelismo com “o ano” e não enfraquece o contraste intencional entre favor e retribuição divina.
- source_word: לֵאלֹהֵינוּ
  choice: do nosso Deus
  rationale: A preposição ל marca a relação da vingança com Deus, enquanto o sufixo de primeira pessoa plural é preservado em “nosso”.
- source_word: לְנַחֵם
  choice: para consolar
  rationale: O infinitivo de נחם continua a descrição da missão e, neste contexto de luto, significa dar consolo.
- source_word: כָּל אֲבֵלִים
  choice: todos os que estão de luto
  rationale: אֲבֵלִים refere-se a pessoas que pranteiam ou estão enlutadas. A expressão é inclusiva, natural em português e comunica mais precisamente o estado de luto do que o simples “choram”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Contraste entre o favor e a vingança divina
  choice: manter “o ano do favor” e “o dia da vingança” em coordenação direta
  alternative: atenuar “vingança” para “juízo” ou subordiná-la ao tema do consolo
  rationale: O próprio texto justapõe favor e vingança. A tradução mantém essa tensão teológica sem suavizá-la nem explicá-la além do que o hebraico declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura infinitiva foi mantida por se tratar da continuação sintática do versículo anterior; a vírgula final sinaliza que a frase prossegue no contexto.
