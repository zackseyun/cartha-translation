source:
  edition: WLC
  text: תַּ֤חַת בָּשְׁתְּ/כֶם֙ מִשְׁנֶ֔ה וּ/כְלִמָּ֖ה יָרֹ֣נּוּ חֶלְקָ֑/ם לָ/כֵ֤ן בְּ/אַרְצָ/ם֙ מִשְׁנֶ֣ה יִירָ֔שׁוּ שִׂמְחַ֥ת עוֹלָ֖ם תִּֽהְיֶ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/007.yaml
  text: Instead of your shame[a], there will be a double portion; and instead of disgrace, they will shout for joy over their portion. Therefore in their land they will possess a double portion[c][b]; everlasting joy will be theirs.
translation:
  language: pt
  text: Em vez da vergonha de vocês[a], haverá porção dobrada; e, em vez da desonra, eles gritarão de alegria por sua porção[b]. Por isso, na terra deles, eles possuirão porção dobrada[c]; alegria eterna será deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico passa de “a vergonha de vocês” para formas na terceira pessoa: “a porção deles”, “a terra deles” e “eles possuirão”. Muitas traduções uniformizam os pronomes na segunda pessoa para facilitar a leitura.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “cantarão de alegria por sua porção”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “herdarão porção dobrada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Em vez de
  rationale: No contexto, a preposição indica troca ou substituição e introduz a reversão prometida.
- source_word: בָּשְׁתְּכֶם
  choice: a vergonha de vocês
  rationale: Mantém o sufixo de segunda pessoa do plural e usa uma formulação natural e amplamente compreensível em português.
- source_word: מִשְׁנֶה
  choice: porção dobrada
  rationale: Expressa uma quantidade dupla e preserva a possível ressonância de herança ou restituição.
- source_word: וּכְלִמָּה
  choice: e, em vez da desonra
  rationale: O segundo termo sugere vergonha pública ou humilhação; “desonra” o distingue da “vergonha” anterior e mantém o paralelismo.
- source_word: יָרֹנּוּ
  choice: eles gritarão de alegria
  rationale: O verbo descreve uma manifestação vocal e intensa de alegria, mais forte que simplesmente “se alegrarão”.
- source_word: חֶלְקָם
  choice: sua porção
  rationale: “Porção” traduz o sentido de parte atribuída e conserva a ligação temática com a porção dobrada.
- source_word: לָכֵן
  choice: Por isso
  rationale: Marca de modo natural a consequência da reversão anunciada.
- source_word: בְּאַרְצָם
  choice: na terra deles
  rationale: Retém a terceira pessoa e a dimensão territorial própria do contexto de restauração.
- source_word: יִירָשׁוּ
  choice: possuirão
  rationale: O verbo pode significar herdar ou tomar posse; “possuirão” funciona naturalmente com “porção dobrada”, sem eliminar a alternativa de herança.
- source_word: שִׂמְחַת עוֹלָם
  choice: alegria eterna
  rationale: Comunica alegria duradoura ou perpétua em linguagem digna e corrente.
- source_word: תִּהְיֶה לָהֶם
  choice: será deles
  rationale: Expressa de maneira idiomática a posse ou atribuição futura dessa alegria.
theological_decisions:
- issue: Mudança pronominal da segunda pessoa (“a vergonha de vocês”) para a terceira pessoa do plural (“sua porção”, “terra deles”, “possuirão”)
  choice: Preservar a mudança de pessoa do texto massorético.
  alternative: 'Uniformizar tudo na segunda pessoa: “vocês gritarão... sua terra... possuirão”.'
  rationale: A alternância está presente no hebraico e pode ser significativa ou refletir uma mudança retórica. Mantê-la evita resolver silenciosamente uma dificuldade textual genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “vocês” em vez de “vós”. A ordem e a alternância pronominal do hebraico foram preservadas sem sacrificar a clareza; as alternativas legítimas de רנן e ירשׁ aparecem em notas.
