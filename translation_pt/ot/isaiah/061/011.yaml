  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י כָ/אָ֨רֶץ֙ תּוֹצִ֣יא צִמְחָ֔/הּ וּ/כְ/גַנָּ֖ה זֵרוּעֶ֣י/הָ תַצְמִ֑יחַ כֵּ֣ן אֲדֹנָ֣/י יְהוִ֗ה יַצְמִ֤יחַ צְדָקָה֙ וּ/תְהִלָּ֔ה נֶ֖גֶד כָּל הַ/גּוֹיִֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/011.yaml
  text: For as the earth brings forth its growth[a], and as a garden causes what is sown in it to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.
translation:
  language: pt
  text: Pois, assim como a terra faz brotar os seus brotos, e como um jardim faz germinar o que foi semeado nele, assim o Senhor Yahweh fará brotar a justiça[a] e o louvor diante de todas as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”; o termo hebraico também pode envolver a ideia de justiça manifesta publicamente ou vindicação.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a comparação que fundamenta e explica a promessa anterior.
- source_word: כָאָרֶץ
  choice: a terra
  rationale: A imagem agrícola tem alcance geral e criacional, não especificamente territorial.
- source_word: תּוֹצִיא צִמְחָהּ
  choice: faz brotar o que nela cresce
  rationale: Expressa de modo natural o valor causativo do verbo e mantém a imagem do crescimento que emerge da terra.
- source_word: וּכְגַנָּה זֵרוּעֶיהָ תַצְמִיחַ
  choice: e como um jardim faz germinar o que nele foi semeado
  rationale: Preserva o paralelismo e representa זֵרוּעֶיהָ como aquilo que foi semeado, não apenas como sementes em sentido abstrato.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico e preserva Yahweh como nome divino, evitando a repetição pouco natural “Senhor SENHOR”.
- source_word: יַצְמִיחַ
  choice: fará brotar
  rationale: Mantém a força causativa e retoma deliberadamente a imagem agrícola das duas primeiras orações.
- source_word: צְדָקָה
  choice: justiça
  rationale: Em português, “justiça” abrange de modo natural a conformidade com o que é reto e a manifestação pública da ação justa ou vindicadora; a alternativa “retidão” é registrada em nota.
- source_word: וּתְהִלָּה
  choice: e o louvor
  rationale: O substantivo normalmente indica louvor, aqui entendido como a resposta pública à obra salvadora de Deus.
- source_word: נֶגֶד כָּל הַגּוֹיִם
  choice: diante de todas as nações
  rationale: Reproduz o sentido espacial e público de נֶגֶד sem restringi-lo a mera observação passiva.
theological_decisions:
- issue: Forma portuguesa do título divino אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A opção escolhida distingue o título אֲדֹנָי do nome pactual יְהוִה e evita ocultar o nome divino.
- issue: Amplitude semântica de צְדָקָה no contexto de restauração profética
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva tanto a dimensão moral quanto a manifestação pública do que é reto, sem excluir a nuance de vindicação; “retidão” permanece uma tradução possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo perceptível e repetição intencional de “brotar” para refletir o elo verbal hebraico. A construção “o que nele foi semeado” evita uma formulação artificial e conserva o sentido passivo do original.
