reference: Isaiah 61:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שׂ֧וֹשׂ אָשִׂ֣ישׂ בַּֽ/יהוָ֗ה תָּגֵ֤ל נַפְשִׁ/י֙ בֵּֽ/אלֹהַ֔/י כִּ֤י הִלְבִּישַׁ֨/נִי֙ בִּגְדֵי יֶ֔שַׁע מְעִ֥יל צְדָקָ֖ה יְעָטָ֑/נִי כֶּֽ/חָתָן֙ יְכַהֵ֣ן פְּאֵ֔ר וְ/כַ/כַּלָּ֖ה תַּעְדֶּ֥ה כֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/010.yaml
  text: I will greatly rejoice in Yahweh[a]; my soul will exult in my God, for he has clothed me with garments of salvation; he has wrapped me in a robe of righteousness, like a bridegroom who adorns himself with a priestly headdress[b], and like a bride who decks herself with her jewelry.
translation:
  language: pt
  text: Eu me alegrarei muito em Yahweh; minha alma exultará no meu Deus, pois ele me vestiu com vestes de salvação e me envolveu com um manto de justiça[a], como um noivo que se adorna com um turbante, à maneira de um sacerdote[b], e como uma noiva que se enfeita com suas joias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um manto de retidão».'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é incomum e provavelmente evoca o adorno sacerdotal: «como um noivo que põe um adorno de cabeça à maneira de um sacerdote».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׂוֹשׂ אָשִׂישׂ
  choice: Eu me alegrarei muito
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a ação verbal. Em português corrente, «muito» comunica essa ênfase sem reproduzir de modo artificial a repetição hebraica.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição בְּ indica aqui o objeto ou âmbito da alegria; o nome divino יהוה é transliterado como «Yahweh».
- source_word: תָּגֵל נַפְשִׁי
  choice: minha alma exultará
  rationale: גיל expressa alegria intensa; «exultará» mantém a força poética e evita repetir simplesmente «alegrar-se».
- source_word: בֵּאלֹהַי
  choice: no meu Deus
  rationale: A construção é paralela a «em Yahweh» e apresenta Deus como o objeto da exultação.
- source_word: הִלְבִּישַׁנִי
  choice: ele me vestiu
  rationale: O perfeito hebraico apresenta a ação como realizada; o pretérito perfeito português é natural e conserva seu efeito presente no contexto.
- source_word: בִּגְדֵי יֶשַׁע
  choice: vestes de salvação
  rationale: A expressão preserva a metáfora do vestuário e o sentido amplo de יֶשַׁע como salvação ou livramento.
- source_word: מְעִיל צְדָקָה
  choice: um manto de justiça
  rationale: מְעִיל designa uma veste exterior, e «manto» mantém a imagem poética. «Justiça» conserva a amplitude moral, relacional e pactual de צְדָקָה; a possível nuance de «retidão» é registrada em nota.
- source_word: יְעָטָנִי
  choice: me envolveu
  rationale: O verbo descreve cobrir ou envolver alguém com uma veste; «envolveu» é natural e mantém a imagem.
- source_word: כֶּחָתָן
  choice: como um noivo
  rationale: Reproduz diretamente a comparação introduzida por כְּ.
- source_word: יְכַהֵן פְּאֵר
  choice: que põe na cabeça um turbante sacerdotal
  rationale: A expressão hebraica incomum provavelmente associa o ato de adornar a cabeça à indumentária sacerdotal. «Turbante sacerdotal» torna perceptíveis tanto o adorno de cabeça quanto a alusão ao sacerdote, sem tratar a interpretação como indiscutível.
- source_word: וְכַכַּלָּה תַּעְדֶּה כֵלֶיהָ
  choice: e como uma noiva que se enfeita com suas joias
  rationale: עדה significa adornar-se, e כֵלִים, neste contexto nupcial, refere-se aos objetos ornamentais da noiva; «joias» é claro e atual.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. A transliteração «Yahweh» preserva o nome pactual e evita substituí-lo por um título.
- issue: Amplitude semântica de צְדָקָה
  choice: justiça
  alternative: retidão
  rationale: No contexto da investidura divina, «justiça» preserva a amplitude teológica e relacional do termo, enquanto a nota mantém visível a possível formulação «retidão».
- issue: Alusão sacerdotal em יְכַהֵן פְּאֵר
  choice: turbante sacerdotal
  alternative: adorno de cabeça; adorna-se como um sacerdote
  rationale: A forma verbal rara derivada de כהן parece evocar o sacerdote, mas a sintaxe é difícil. A tradução mantém essa alusão no texto e reconhece em nota uma leitura menos explícita.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção poética foi mantida sem rigidez excessiva; «vestes», «manto» e «exultará» preservam a dignidade da imagem. Os marcadores [a] e [b] aparecem nos pontos exatos a que as notas se referem.
