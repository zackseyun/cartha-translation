  yaml_path: translation/ot/isaiah/061/005.yaml
  text: Foreigners will stand and shepherd your flocks[b][a], and foreigners' sons will be your farmers and your vinedressers.
translation:
  language: pt
  text: Estrangeiros ficarão de pé[a] e pastorearão os rebanhos de vocês; filhos de estrangeiros[b] serão os agricultores e os cultivadores das vinhas de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estrangeiros estarão de pé e apascentarão as ovelhas de vocês”. O termo hebraico para “rebanhos” é coletivo e pode abranger ovelhas e cabras.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “filhos de estrangeiros” pode designar pessoas provenientes de nações estrangeiras, não necessariamente apenas descendentes literais de estrangeiros.
    reason: cultural_note
lexical_decisions:
- source_word: זָרִים
  choice: Estrangeiros
  rationale: Designa pessoas de fora do povo ou de outra nação. “Estrangeiros” é claro, atual e mantém o paralelismo com בְנֵי נֵכָר.
- source_word: וְעָמְדוּ
  choice: estarão a postos
  rationale: O verbo significa literalmente “estar de pé”. Neste contexto, a expressão comunica presença e prontidão para o serviço sem tornar a frase artificial em português.
- source_word: וְרָעוּ
  choice: pastorearão
  rationale: רעה descreve a ação de conduzir, cuidar ou apascentar animais; “pastorearão” preserva o campo semântico pastoril.
- source_word: צֹאנְכֶם
  choice: os rebanhos de vocês
  rationale: O coletivo abrange rebanhos de animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanhos” preserva o sentido coletivo.
- source_word: בְנֵי נֵכָר
  choice: filhos de estrangeiros
  rationale: A tradução formal conserva a construção hebraica, enquanto a nota esclarece que ela pode designar pessoas pertencentes a nações estrangeiras, sem exigir ênfase na filiação literal.
- source_word: אִכָּרֵיכֶם
  choice: os agricultores de vocês
  rationale: O substantivo designa trabalhadores do campo ou lavradores. “Agricultores” é corrente, abrangente e compreensível.
- source_word: כֹרְמֵיכֶם
  choice: os cultivadores das vinhas de vocês
  rationale: A expressão comunica de modo transparente o trabalho específico nas vinhas e evita um termo técnico menos conhecido, como “viticultores”.
theological_decisions:
- issue: Inversão de papéis sociais no oráculo da restauração de Sião
  choice: O texto apresenta estrangeiros realizando trabalho pastoril e agrícola em benefício da comunidade restaurada.
  alternative: Entender a cena apenas como cooperação internacional generalizada ou somente como metáfora de abundância.
  rationale: O hebraico descreve de modo direto estrangeiros exercendo essas funções. A tradução mantém a assimetria da imagem sem acrescentar uma interpretação eclesiológica ou doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade no Brasil. “Estarão a postos” conserva a ideia contextual de estar de pé e pronto, e “cultivadores das vinhas” oferece precisão sem tecnicismo. Os pronomes e possessivos no plural deixam claro que a comunidade é a destinatária.
