  text: לָ/שׂ֣וּם לַ/אֲבֵלֵ֣י צִיּ֗וֹן לָ/תֵת֩ לָ/הֶ֨ם פְּאֵ֜ר תַּ֣חַת אֵ֗פֶר שֶׁ֤מֶן שָׂשׂוֹן֙ תַּ֣חַת אֵ֔בֶל מַעֲטֵ֣ה תְהִלָּ֔ה תַּ֖חַת ר֣וּחַ כֵּהָ֑ה וְ/קֹרָ֤א לָ/הֶם֙ אֵילֵ֣י הַ/צֶּ֔דֶק מַטַּ֥ע יְהוָ֖ה לְ/הִתְפָּאֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/003.yaml
  text: to appoint for the mourners of Zion[a], to give them a headdress instead of ashes, oil of gladness instead of mourning, a garment of praise instead of a faint spirit; and they will be called oaks of righteousness, the planting of Yahweh[d][c][b], that he may display his glory.
translation:
  language: pt
  text: para prover aos enlutados de Sião, dando-lhes um adorno de cabeça[a] em vez de cinzas, óleo de alegria em vez de luto, um manto de louvor em vez de um espírito abatido. Eles serão chamados carvalhos[b] de retidão[c], plantação de Yahweh, para que ele manifeste a sua glória[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “beleza”. O hebraico פְּאֵר pode indicar beleza ou adorno, especialmente um enfeite festivo para a cabeça; a imagem provavelmente contrasta esse adorno com as cinzas colocadas sobre a cabeça durante o luto.
    reason: lexical_alternative
  - marker: b
    text: Ou “terebintos”. O termo hebraico pode se referir mais especificamente a terebintos, árvores grandes associadas à força.
    reason: lexical_alternative
  - marker: c
    text: Ou “justiça”. A palavra hebraica צֶדֶק abrange tanto retidão quanto justiça, conforme o contexto.
    reason: alternative_reading
  - marker: d
    text: Ou “para que ele seja glorificado”. O verbo hebraico final também pode destacar a glorificação de Yahweh por meio dessa plantação.
    reason: alternative_reading
lexical_decisions:
- source_word: לָשׂוּם לַאֲבֵלֵי צִיּוֹן
  choice: para proporcionar aos que choram por Sião
  rationale: O infinitivo לָשׂוּם expressa aqui propósito, em paralelo com לָתֵת. “Proporcionar” comunica naturalmente a ideia de dispor ou prover algo para os enlutados, enquanto “aos que choram por Sião” preserva a relação do construto sem decidir indevidamente se eles estão fisicamente em Sião.
- source_word: לָתֵת לָהֶם
  choice: e dar-lhes
  rationale: Mantém o sentido direto do infinitivo e o paralelismo com a expressão anterior.
- source_word: פְּאֵר
  choice: um adorno de cabeça
  rationale: O substantivo designa concretamente um adorno festivo, provavelmente usado na cabeça, e contrasta com as cinzas do luto. A formulação evita restringir o objeto a um tipo específico de turbante.
- source_word: תַּחַת אֵפֶר
  choice: em vez de cinzas
  rationale: תַּחַת indica substituição, e “cinzas” preserva a imagem cultural do luto.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: óleo de alegria
  rationale: A construção associa o óleo de unção às celebrações e à alegria; a expressão é clara e poética em português atual.
- source_word: מַעֲטֵה תְהִלָּה
  choice: um manto de louvor
  rationale: מַעֲטֶה é uma cobertura ou veste exterior. “Manto” conserva a metáfora concreta e o registro poético.
- source_word: תַּחַת רוּחַ כֵּהָה
  choice: em vez de um espírito abatido
  rationale: כֵּהָה sugere algo enfraquecido, obscurecido ou sem vigor. “Abatido” comunica a condição interior sem reduzi-la a um diagnóstico psicológico moderno.
- source_word: וְקֹרָא לָהֶם
  choice: Eles serão chamados
  rationale: A forma verbal singular pode ter força indefinida, expressa naturalmente pelo passivo em português, sem introduzir um sujeito não indicado.
- source_word: אֵילֵי הַצֶּדֶק
  choice: carvalhos de retidão
  rationale: Em paralelo com “plantação”, אֵילֵי evoca árvores grandes e fortes. “Carvalhos” torna a imagem acessível; “retidão” preserva o sentido moral e relacional de צֶדֶק, sem excluir sua dimensão de justiça.
- source_word: מַטַּע יְהוָה
  choice: plantação de Yahweh
  rationale: A expressão identifica o povo restaurado como aquilo que Yahweh plantou. O nome divino é transliterado, preservando o nome próprio presente no hebraico.
- source_word: לְהִתְפָּאֵר
  choice: para que ele manifeste a sua glória
  rationale: A forma hitpael pode apontar para a demonstração da majestade de Yahweh por meio de sua plantação. A tradução mantém a finalidade e a agência divina, com a leitura passiva alternativa registrada em nota.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido da oração final לְהִתְפָּאֵר
  choice: para que ele manifeste a sua glória
  alternative: para que ele seja glorificado
  rationale: A leitura escolhida apresenta a plantação como meio pelo qual Yahweh exibe sua glória, mas a morfologia também permite ressaltar que ele é glorificado; essa tensão é preservada em nota.
- issue: Amplitude semântica de הַצֶּדֶק
  choice: retidão
  alternative: justiça
  rationale: No título metafórico dado ao povo restaurado, “retidão” expressa bem sua qualidade moral e pactual, enquanto “justiça” continua sendo uma leitura legítima e é indicada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição “em vez de” conserva o paralelismo hebraico; as imagens concretas de adorno, óleo, manto, árvores e plantação foram mantidas. A pontuação divide a sequência de dádivas de seu resultado sem apagar a continuidade do versículo.
