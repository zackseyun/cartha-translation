source:
  edition: WLC
  text: וְ/אַתֶּ֗ם כֹּהֲנֵ֤י יְהוָה֙ תִּקָּרֵ֔אוּ מְשָׁרְתֵ֣י אֱלֹהֵ֔י/נוּ יֵאָמֵ֖ר לָ/כֶ֑ם חֵ֤יל גּוֹיִם֙ תֹּאכֵ֔לוּ וּ/בִ/כְבוֹדָ֖/ם תִּתְיַמָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/006.yaml
  text: But you will be called the priests of Yahweh; they will say of you, "Ministers of our God." You will eat the wealth of nations[a], and in their glory you will boast.
translation:
  language: pt
  text: 'Mas vocês serão chamados sacerdotes de Yahweh; a respeito de vocês se dirá: “Ministros do nosso Deus.” Vocês comerão a riqueza das nações e, em sua glória, vocês se gloriarão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e exultarão em sua glória”. O verbo hebraico final é raro, e seu sentido exato é discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֵי יְהוָה
  choice: sacerdotes de Yahweh
  rationale: Preserva a construção nominal e a designação sacerdotal explícita, usando o nome divino em forma corrente e reconhecível.
- source_word: תִּקָּרֵאוּ
  choice: serão chamados
  rationale: Reproduz diretamente o nifal, mantendo a voz passiva e o paralelismo com a designação seguinte.
- source_word: מְשָׁרְתֵי אֱלֹהֵינוּ
  choice: Ministros do nosso Deus
  rationale: “Ministros” expressa serviço oficial ou cultual e corresponde ao paralelo com “sacerdotes”, sem impor um cargo eclesiástico posterior.
- source_word: יֵאָמֵר לָכֶם
  choice: a respeito de vocês se dirá
  rationale: Mantém a construção impessoal do hebraico e permite conservar “Ministros do nosso Deus” como designação em discurso direto.
- source_word: חֵיל גּוֹיִם
  choice: a riqueza das nações
  rationale: Neste contexto, חֵיל indica sobretudo bens ou recursos; “riqueza” combina naturalmente com o verbo “comer” e preserva a imagem.
- source_word: תֹּאכֵלוּ
  choice: comerão
  rationale: Conserva a metáfora concreta do hebraico, em vez de explicitá-la como “desfrutarão” ou “consumirão”.
- source_word: וּבִכְבוֹדָם
  choice: no esplendor delas
  rationale: כָּבוֹד pode significar glória, honra ou esplendor. “Esplendor” funciona naturalmente com o referente plural “nações” e com o verbo seguinte, sem reduzir o termo a riqueza material.
- source_word: תִּתְיַמָּרוּ
  choice: se gloriarão
  rationale: O verbo hitpael raro provavelmente comunica gloriar-se ou exultar. “Se gloriarão” preserva a nuance reflexiva e a incerteza é registrada em nota.
theological_decisions:
- issue: Possível espiritualização posterior da função sacerdotal de Israel
  choice: Manter a declaração profética direta de que os destinatários serão chamados “sacerdotes de Yahweh” e “Ministros do nosso Deus”.
  alternative: Generalizar a passagem como simples serviço espiritual, sem terminologia sacerdotal.
  rationale: O hebraico emprega linguagem sacerdotal e cultual explícita; a tradução conserva essa imagem sem identificar os destinatários com uma instituição posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”). O discurso direto e o paralelismo profético foram preservados; a metáfora “comer a riqueza” permanece visível.
