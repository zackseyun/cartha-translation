  naturalness: «Vocês» e a sintaxe impessoal são naturais em português moderno. «Em sua glória, vocês se gloriarão» é deliberadamente próximo do paralelismo hebraico e, embora tenha repetição expressiva, é compreensível e apropriado ao registro profético.
