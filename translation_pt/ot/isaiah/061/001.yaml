reference: Isaiah 61:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ר֛וּחַ אֲדֹנָ֥/י יְהוִ֖ה עָלָ֑/י יַ֡עַן מָשַׁח֩ יְהוָ֨ה אֹתִ֜/י לְ/בַשֵּׂ֣ר עֲנָוִ֗ים שְׁלָחַ֨/נִי֙ לַ/חֲבֹ֣שׁ לְ/נִשְׁבְּרֵי לֵ֔ב לִ/קְרֹ֤א לִ/שְׁבוּיִם֙ דְּר֔וֹר וְ/לַ/אֲסוּרִ֖ים פְּקַח קֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/001.yaml
  text: The Spirit of the Lord GOD is upon me[a], because Yahweh has anointed me to bring good news to the humble; he has sent me to bind up the brokenhearted[b], to proclaim liberty to the captives and opening of the prison to the bound.
translation:
  language: pt
  text: O Espírito do Senhor Yahweh está sobre mim, porque Yahweh me ungiu para levar boas-novas aos humildes[a]. Ele me enviou para cuidar dos que têm o coração quebrantado, para proclamar liberdade aos cativos e abertura da prisão aos que estão presos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos pobres” ou “aos afligidos”. O hebraico עֲנָוִים pode designar os humildes, mansos, pobres ou oprimidos.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica פְּקַח־קוֹחַ é difícil. Também pode ser entendida como “abertura dos olhos” ou, de modo mais geral, “soltura” dos que estão presos.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֛וּחַ
  choice: Espírito
  rationale: No contexto de capacitação e comissionamento profético, designa o Espírito divino, não mero vento, fôlego ou disposição humana.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי, “Senhor”, quanto o nome divino יהוה, transliterado como “Yahweh”, sem produzir a repetição artificial “Senhor SENHOR”.
- source_word: עָלָי
  choice: está sobre mim
  rationale: Mantém a imagem hebraica de presença e capacitação profética em linguagem portuguesa natural e solene.
- source_word: יַעַן
  choice: porque
  rationale: Introduz de maneira clara a razão ou fundamento do comissionamento descrito.
- source_word: מָשַׁח
  choice: me ungiu
  rationale: Traduz diretamente o ato concluído de consagração e comissionamento, preservando sua ressonância messiânica sem explicá-la no próprio texto.
- source_word: לְבַשֵּׂר
  choice: para levar boas-novas
  rationale: Expressa o anúncio de notícias favoráveis em linguagem corrente, preservando o sentido de missão do verbo.
- source_word: עֲנָוִים
  choice: aos humildes
  rationale: Conserva a dimensão social e espiritual do termo, que pode designar pessoas humildes, mansas, pobres ou afligidas; a alternativa importante é registrada em nota.
- source_word: שְׁלָחַנִי
  choice: Ele me enviou
  rationale: Traduz com clareza o perfeito hebraico e explicita naturalmente em português o sujeito já mencionado, sem acrescentar nova informação.
- source_word: לַחֲבֹשׁ
  choice: para atar as feridas
  rationale: Preserva a imagem concreta de ligar ou enfaixar uma ferida, evitando reduzir a expressão ao conceito mais geral de curar.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: dos que têm o coração quebrantado
  rationale: Reproduz de modo idiomático a metáfora hebraica de pessoas interiormente feridas ou esmagadas.
- source_word: לִקְרֹא
  choice: para proclamar
  rationale: Comunica um anúncio público e autorizado, adequado à declaração de libertação.
- source_word: לִשְׁבוּיִם
  choice: aos cativos
  rationale: Refere-se aos que foram levados em cativeiro e mantém o paralelismo com os que estão presos.
- source_word: דְּרוֹר
  choice: liberdade
  rationale: Expressa soltura ou emancipação proclamada, termo especialmente apropriado no contexto de libertação de cativos.
- source_word: פְּקַח־קוֹחַ
  choice: abertura da prisão
  rationale: Adota a interpretação contextual tradicional ligada à libertação dos presos, mas reconhece em nota a dificuldade da expressão hebraica.
theological_decisions:
- issue: Tradução do nome divino יהוה no título composto אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano Senhor; Senhor DEUS
  rationale: A forma escolhida mantém distintos o título divino e o nome da aliança presentes no hebraico, sem substituir o nome por outro título.
- issue: Linguagem de unção e possível leitura messiânica
  choice: Yahweh me ungiu
  alternative: Yahweh me consagrou
  rationale: “Ungiu” representa diretamente o verbo hebraico e preserva sua tensão profética e messiânica, sem importar para o versículo uma identificação interpretativa posterior.
- issue: Identidade do orador profético
  choice: Uso da primeira pessoa sem identificação adicional
  alternative: Identificar explicitamente o orador como o profeta ou o Messias
  rationale: O versículo não identifica expressamente o orador nessa linha; a tradução conserva essa abertura interpretativa.
- issue: Sentido da expressão פְּקַח־קוֹחַ
  choice: abertura da prisão
  alternative: abertura dos olhos; soltura
  rationale: O paralelismo com cativos e presos favorece uma leitura de libertação, mas a expressão hebraica é difícil e permite outras análises, preservadas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o paralelismo poético e as metáforas concretas do hebraico, evitando linguagem excessivamente arcaica e preservando as ambiguidades lexicais relevantes em notas.
