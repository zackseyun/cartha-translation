  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
translation:
  language: pt
  text: Eles reconstruirão as ruínas antigas[a], reerguerão os lugares devastados de outrora e renovarão as cidades em ruínas, desoladas de geração em geração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as ruínas de tempos remotos”. O hebraico עוֹלָם pode indicar antiguidade remota ou longa duração.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “desoladas há muitas gerações”. O hebraico diz literalmente “geração e geração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: reconstruirão
  rationale: Embora בנה signifique literalmente “construir”, o objeto “ruínas” indica restauração; “reconstruirão” expressa isso de modo natural e preciso.
- source_word: חָרְבוֹת עוֹלָם
  choice: as ruínas antigas
  rationale: חָרְבוֹת designa ruínas ou lugares arruinados, e עוֹלָם aqui aponta para antiguidade remota ou longa duração, não necessariamente eternidade.
- source_word: שֹׁמְמוֹת רִאשֹׁנִים
  choice: os lugares devastados de outrora
  rationale: שֹׁמְמוֹת pode designar lugares desolados, enquanto רִאשֹׁנִים tem sentido temporal de tempos anteriores; a formulação evita o pouco natural “primeiras devastações”.
- source_word: יְקוֹמֵמוּ
  choice: reerguerão
  rationale: A forma intensiva/causativa de קום comunica fazer ficar novamente de pé; “reerguerão” conserva a imagem concreta e o sentido restaurador.
- source_word: וְחִדְּשׁוּ
  choice: renovarão
  rationale: חדשׁ significa tornar novo ou renovar; a escolha preserva a variedade verbal do hebraico sem reduzir todos os verbos a “restaurar”.
- source_word: עָרֵי חֹרֶב
  choice: as cidades arruinadas
  rationale: A construção caracteriza as cidades por ruína ou devastação; “cidades arruinadas” é idiomático e claro em português.
- source_word: שֹׁמְמוֹת דּוֹר וָדֹור
  choice: devastadas de geração em geração
  rationale: A expressão idiomática דּוֹר וָדוֹר descreve a continuidade ao longo de gerações sucessivas; a forma portuguesa mantém essa força distributiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva os três verbos restauradores distintos — reconstruir, reerguer e renovar — e evita interpretar עוֹלָם como eternidade neste contexto.
