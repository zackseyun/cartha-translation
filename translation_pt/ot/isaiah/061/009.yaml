base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/009.yaml
  text: Their offspring will be known among the nations[a], and their descendants in the midst of the peoples[b]; all who see them will recognize that they are offspring blessed by Yahweh.
translation:
  language: pt
  text: A descendência deles será conhecida entre as nações[a], e seus descendentes, no meio dos povos; todos os que os virem reconhecerão que são descendência abençoada por Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os gentios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹדַע
  choice: será conhecida
  rationale: O nifal de ידע expressa aqui o sentido passivo de tornar-se ou ser conhecido. A formulação preserva esse valor sem especificar um agente.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa coletividades nacionais; “nações” mantém o sentido amplo e evita impor uma oposição mais estreita entre judeus e gentios.
- source_word: זַרְעָם
  choice: a descendência deles
  rationale: זֶרַע é um substantivo coletivo que pode significar semente, prole ou descendência. “Descendência” é natural em português e adequado ao contexto humano.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: e seus descendentes
  rationale: O termo é paralelo a זֶרַע e se refere aos que procedem deles. A variação “descendentes” conserva o paralelismo sem produzir uma repetição rígida.
- source_word: בְּתוֹךְ הָעַמִּים
  choice: no meio dos povos
  rationale: A tradução mantém a imagem espacial de בְּתוֹךְ e distingue עַמִּים como “povos” de גּוֹיִם como “nações”.
- source_word: כָּל רֹאֵיהֶם
  choice: todos os que os virem
  rationale: O particípio hebraico é expresso naturalmente por uma oração relativa; o futuro do subjuntivo é idiomático em português para a referência futura.
- source_word: יַכִּירוּם
  choice: reconhecerão
  rationale: O hifil de נכר significa reconhecer ou identificar. Em português, a oração seguinte com “que” comunica naturalmente o conteúdo desse reconhecimento, enquanto “os” já aparece em “os virem”.
- source_word: כִּי
  choice: que
  rationale: כִּי introduz o conteúdo do que os observadores reconhecerão, e não necessariamente uma explicação causal.
- source_word: זֶרַע
  choice: uma descendência
  rationale: “Descendência” preserva o valor coletivo de זֶרַע e o vínculo lexical com sua primeira ocorrência no versículo.
- source_word: בֵּרַךְ
  choice: abençoou
  rationale: 'A forma é o piel perfeito, terceira pessoa masculina singular, com Yahweh como sujeito: literalmente, uma descendência que Yahweh abençoou. A oração relativa preserva essa relação verbal.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Relação entre Yahweh e a bênção
  choice: uma descendência que Yahweh abençoou
  alternative: uma descendência abençoada por Yahweh
  rationale: בֵּרַךְ é uma forma verbal ativa no perfeito, tendo Yahweh como sujeito. A oração relativa mantém explicitamente essa estrutura e evita tratar a forma como particípio passivo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O paralelismo hebraico foi preservado por “nações/povos” e “descendência/descendentes”, sem tornar a sintaxe artificial.
