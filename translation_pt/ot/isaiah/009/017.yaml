  text: כִּֽי בָעֲרָ֤ה כָ/אֵשׁ֙ רִשְׁעָ֔ה שָׁמִ֥יר וָ/שַׁ֖יִת תֹּאכֵ֑ל וַ/תִּצַּת֙ בְּ/סִֽבְכֵ֣י הַ/יַּ֔עַר וַ/יִּֽתְאַבְּכ֖וּ גֵּא֥וּת עָשָֽׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/017.yaml
  text: For wickedness burns like a fire; it devours brier and thorn[a], and it kindles the thickets of the forest, and they roll upward in a column of smoke.
translation:
  language: pt
  text: Pois a maldade arde como fogo; devora espinheiros e cardos, incendeia os matagais da floresta e se revolvem para o alto em fumaça crescente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e sobem em uma coluna de fumaça”. O hebraico da oração final é difícil; o sentido provável é o de fumaça que sobe em grandes rolos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָעֲרָה
  choice: arde
  rationale: O qal perfeito, tendo רִשְׁעָה como sujeito, pode apresentar vividamente uma ação presente ou seu efeito atual; “arde” mantém a imagem contínua do fogo em português natural.
- source_word: רִשְׁעָה
  choice: maldade
  rationale: O substantivo abstrato designa perversidade ou mal moral. “Maldade” é corrente, clara e preserva a personificação pela qual ela age como fogo.
- source_word: שָׁמִיר וָשַׁיִת
  choice: espinheiros e cardos
  rationale: O par descreve vegetação espinhosa e sem valor, sem permitir identificação botânica segura. A formulação escolhida comunica essa imagem de modo natural.
- source_word: תֹּאכֵל
  choice: devora
  rationale: Embora אכל signifique literalmente comer, é empregado aqui para a ação consumidora do fogo; “devora” conserva a força da metáfora.
- source_word: וַתִּצַּת
  choice: incendeia
  rationale: O verbo indica atear ou pôr fogo. “Incendeia” expressa claramente a progressão da vegetação rasteira consumida para os matagais da floresta em chamas.
- source_word: סִבְכֵי הַיַּעַר
  choice: os matagais da floresta
  rationale: סבך indica crescimento denso e entrelaçado. “Matagais da floresta” é compreensível e mantém a imagem de vegetação cerrada.
- source_word: וַיִּתְאַבְּכוּ
  choice: e eles sobem
  rationale: O verbo raro e difícil parece descrever movimento ascendente e revolvente. A tradução mantém o plural e comunica o sentido provável sem especificar excessivamente o movimento.
- source_word: גֵּאוּת עָשָׁן
  choice: em uma coluna de fumaça
  rationale: A expressão pode retratar uma massa alta, crescente ou volumosa de fumaça. “Uma coluna de fumaça” transmite de forma idiomática a imagem provável.
