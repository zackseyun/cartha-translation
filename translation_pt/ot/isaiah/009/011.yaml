id: ISA.9.11
reference: Isaiah 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲרָ֣ם מִ/קֶּ֗דֶם וּ/פְלִשְׁתִּים֙ מֵֽ/אָח֔וֹר וַ/יֹּאכְל֥וּ אֶת יִשְׂרָאֵ֖ל בְּ/כָל פֶּ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/011.yaml
  text: Aram from the east and the Philistines from the west devoured Israel with full mouth[a]. For all this, his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: pt
  text: Arã, vindo do leste, e os filisteus, vindos do oeste[a], devoraram Israel de boca cheia[b]. Apesar de tudo isso, a ira dele não se afastou, e sua mão continua estendida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “de trás”. Em contraste com “do leste”, provavelmente significa “do oeste”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente “com toda a boca”; isto é, vorazmente ou por completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Arã
  rationale: Mantém o nome etnogeográfico hebraico transliterado, em vez de substituí-lo pelo nome moderno “Síria”.
- source_word: מִקֶּדֶם
  choice: vindo do leste
  rationale: Embora קֶדֶם também possa indicar a frente, o paralelismo geográfico com מֵאָחוֹר favorece o sentido direcional “leste”.
- source_word: וּפְלִשְׁתִּים
  choice: e os filisteus
  rationale: Emprega a forma portuguesa corrente para esse povo.
- source_word: מֵאָחוֹר
  choice: vindos do oeste
  rationale: O sentido literal é “de trás”, mas, em contraste com “do leste”, a expressão provavelmente designa o oeste; a ambiguidade é registrada em nota.
- source_word: וַיֹּאכְלוּ
  choice: devoraram
  rationale: Conserva a metáfora vívida do ato de comer aplicada à destruição de Israel por inimigos.
- source_word: בְּכָל פֶּה
  choice: de boca cheia
  rationale: Mantém em português a imagem concreta da boca e comunica consumo voraz, sem substituí-la inteiramente por uma explicação abstrata.
- source_word: בְּכָל זֹאת
  choice: Apesar de tudo isso
  rationale: 'Expressa a função concessiva do refrão: mesmo depois dos golpes já descritos, o juízo divino prossegue.'
- source_word: לֹא שָׁב אַפּוֹ
  choice: a ira dele não se afastou
  rationale: Traduz אַף pelo sentido idiomático “ira” e preserva, tanto quanto possível, a imagem verbal de não se retirar ou voltar.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: sua mão continua estendida
  rationale: Reproduz a imagem profética de uma mão ainda estendida em juízo e o valor continuativo de עוֹד.
theological_decisions:
- issue: Referente dos pronomes no refrão
  choice: Os pronomes permanecem na terceira pessoa e se referem contextualmente a Deus.
  alternative: Explicitar “a ira do SENHOR” e “a mão do SENHOR”.
  rationale: O contexto identifica Deus como agente do juízo, mas o hebraico usa pronomes; mantê-los evita acrescentar ao texto uma explicitação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação conserva as imagens concretas do hebraico e registra em notas as duas expressões cuja tradução idiomática exige interpretação.
source_grounding:
  english_pob_role: consult_only
