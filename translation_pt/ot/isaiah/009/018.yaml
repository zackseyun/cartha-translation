id: ISA.9.18
reference: Isaiah 9:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/עֶבְרַ֛ת יְהוָ֥ה צְבָא֖וֹת נֶעְתַּ֣ם אָ֑רֶץ וַ/יְהִ֤י הָ/עָם֙ כְּ/מַאֲכֹ֣לֶת אֵ֔שׁ אִ֥ישׁ אֶל אָחִ֖י/ו לֹ֥א יַחְמֹֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/018.yaml
  text: By the wrath of Yahweh of hosts the land is scorched[a], and the people have become like fuel for the fire; no man spares his brother.
translation:
  language: pt
  text: Pela ira de Yahweh dos Exércitos, a terra fica abrasada[a], e o povo se torna como combustível para o fogo; ninguém poupa seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é consumida pelo fogo” ou “fica escurecida”. O verbo hebraico é raro, e seu sentido exato é discutido; a imagem de fogo no contexto imediato favorece “fica abrasada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶבְרַת
  choice: Pela ira de
  rationale: A preposição בְּ tem valor instrumental, e עֶבְרָה expressa ira intensa; a formulação preserva concisão e força judicial.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת por uma expressão natural em português que comunica forças organizadas, inclusive o sentido marcial e celestial.
- source_word: נֶעְתַּם
  choice: fica abrasada
  rationale: O verbo raro tem sentido discutido, podendo indicar queimar ou escurecer. A imagem imediata do fogo favorece 'abrasada', sem sugerir necessariamente destruição total.
- source_word: אָרֶץ
  choice: a terra
  rationale: No contexto do juízo sobre o povo, refere-se mais provavelmente ao território habitado do que ao planeta inteiro; 'terra' preserva a amplitude lexical do hebraico.
- source_word: וַיְהִי הָעָם
  choice: e o povo se torna
  rationale: Expressa o desenvolvimento e o estado resultante da narrativa profética em presente vívido, natural em português.
- source_word: כְּמַאֲכֹלֶת אֵשׁ
  choice: como combustível para o fogo
  rationale: A expressão designa aquilo que o fogo consome. 'Combustível para o fogo' reproduz de modo idiomático a metáfora hebraica.
- source_word: אִישׁ אֶל אָחִיו לֹא יַחְמֹלוּ
  choice: ninguém poupa seu irmão
  rationale: 'O hebraico tem sentido distributivo: cada homem deixa de poupar seu irmão. ''Ninguém'' comunica isso naturalmente, e ''irmão'' mantém a linguagem familiar e o horror do conflito interno.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio da aliança; 'Yahweh' o representa diretamente, sem substituí-lo por um título.
- issue: Sentido de צְבָאוֹת
  choice: dos Exércitos
  alternative: dos exércitos celestiais
  rationale: A forma concisa preserva a expressão tradicional e sua amplitude, sem restringi-la explicitamente a um único referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo profético, o nome divino e a ambiguidade lexical relevante mediante nota.
