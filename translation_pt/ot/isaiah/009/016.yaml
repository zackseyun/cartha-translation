source:
  edition: WLC
  text: עַל כֵּ֨ן עַל בַּחוּרָ֜י/ו לֹֽא יִשְׂמַ֣ח אֲדֹנָ֗/י וְ/אֶת יְתֹמָ֤י/ו וְ/אֶת אַלְמְנֹתָי/ו֙ לֹ֣א יְרַחֵ֔ם כִּ֤י כֻלּ/וֹ֙ חָנֵ֣ף וּ/מֵרַ֔ע וְ/כָל פֶּ֖ה דֹּבֵ֣ר נְבָלָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/016.yaml
  text: Therefore the Lord does not rejoice over their young men[a], and he does not have compassion on their fatherless and their widows; for every one of them is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: pt
  text: Por isso, o Senhor não se alegra com os jovens desse povo[a], nem se compadece de seus órfãos e de suas viúvas, pois todos são ímpios e praticam o mal, e toda boca profere loucura[b]. Apesar de tudo isso, a sua ira não se afastou, e a sua mão continua estendida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “seus jovens”; o mesmo sufixo singular aparece em “seus órfãos” e “suas viúvas”. O referente é o povo considerado coletivamente.
    reason: lexical_alternative
  - marker: b
    text: Ou “profere insensatez vergonhosa”, “fala coisas vis” ou “fala loucura infame”. O termo hebraico pode reunir as ideias de loucura moral, desonra e vileza.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz a consequência da acusação anterior e conserva de modo natural a força inferencial da expressão hebraica.
- source_word: בַּחוּרָיו
  choice: os jovens desse povo
  rationale: בָּחוּר designa jovens no vigor da idade. A formulação explicita o referente coletivo do sufixo masculino singular sem sugerir que os jovens pertençam a um indivíduo.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Em Isaías, a forma funciona como título divino; “o Senhor” é a forma idiomática e reconhecível em português.
- source_word: יְתֹמָיו ... אַלְמְנֹתָיו
  choice: seus órfãos e suas viúvas
  rationale: “Órfãos” e “viúvas” expressam naturalmente os grupos socialmente vulneráveis indicados pelo hebraico; o possessivo retoma “esse povo”.
- source_word: יְרַחֵם
  choice: se compadece
  rationale: Expressa misericórdia movida por compaixão e forma um paralelo verbal natural com “se alegra”.
- source_word: כֻלּוֹ חָנֵף וּמֵרַע
  choice: todos são ímpios e praticam o mal
  rationale: Desdobra o coletivo hebraico de forma idiomática. חָנֵף indica impiedade, e מֵרַע caracteriza quem faz o mal.
- source_word: כָל פֶּה דֹּבֵר נְבָלָה
  choice: toda boca profere insensatez vergonhosa
  rationale: Mantém a imagem concreta de “toda boca” e conserva em נְבָלָה tanto a insensatez moral quanto o caráter desonroso ou vil da fala.
- source_word: בְּכָל זֹאת לֹא שָׁב אַפּוֹ
  choice: Apesar de tudo isso, a sua ira não se afastou
  rationale: A expressão introduz o refrão de juízo persistente; “ira” traduz o uso idiomático de אַף, e “não se afastou” comunica o sentido de שׁוּב neste contexto.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: e a sua mão continua estendida
  rationale: Preserva a imagem hebraica da mão divina ainda estendida, sem decidir além do contexto se ela enfatiza golpe, poder ou juízo continuado.
theological_decisions:
- issue: Forma do título divino אֲדֹנָי
  choice: o Senhor
  alternative: meu Senhor
  rationale: Embora a forma tenha origem morfológica associada a um possessivo, seu uso profético aqui é o de um título divino estabelecido, não uma declaração explícita de posse pessoal.
- issue: Sufixos possessivos singulares ligados aos jovens, órfãos e viúvas
  choice: referência coletiva a “esse povo”
  alternative: seus jovens, seus órfãos e suas viúvas, com possessivos formalmente singulares
  rationale: Os sufixos hebraicos são masculinos singulares porque retomam o povo como entidade coletiva. A tradução explicita esse referente para evitar a impressão de que um homem individual seja o possuidor desses grupos.
- issue: Imagem da mão divina estendida
  choice: manter “a sua mão continua estendida” sem explicação interpretativa no corpo do texto
  alternative: explicitar “estendida para ferir” ou “em juízo”
  rationale: A imagem, no refrão de Isaías, sugere juízo ainda ativo, mas o hebraico não fornece aqui um complemento explícito. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o paralelismo profético, a imagem concreta de “toda boca” e o refrão da ira e da mão estendida, ao mesmo tempo que esclarece apenas o necessário para tornar natural o referente coletivo dos possessivos.
