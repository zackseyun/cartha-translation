  text: הִרְבִּ֣יתָ הַ/גּ֔וֹי לא הִגְדַּ֣לְתָּ הַ/שִּׂמְחָ֑ה שָׂמְח֤וּ לְ/פָנֶ֨י/ךָ֙ כְּ/שִׂמְחַ֣ת בַּ/קָּצִ֔יר כַּ/אֲשֶׁ֥ר יָגִ֖ילוּ בְּ/חַלְּקָ֥/ם שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/002.yaml
  text: You have multiplied the nation[a]; you have not increased the joy. They rejoice before you as with the joy at harvest[b], as men exult when they divide spoil.
translation:
  language: pt
  text: Multiplicaste a nação; não aumentaste a alegria[a]. Eles se alegram diante de ti como com a alegria da colheita[b], como os que exultam ao repartir o despojo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas versões antigas e muitas traduções trazem “aumentaste a alegria dela”, refletindo uma leitura hebraica como לוֹ (“para ela”) em vez de לֹא (“não”).
    reason: textual_variant
  - marker: b
    text: 'Ou: “Eles se alegram diante de ti como se alegram na colheita, como os que exultam ao repartir o despojo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבִּיתָ
  choice: Multiplicaste
  rationale: O hifil de רבה expressa fazer numeroso ou multiplicar. A escolha preserva o sentido causativo e concorda naturalmente com “a nação”.
- source_word: הַגּוֹי
  choice: a nação
  rationale: גוי pode significar “nação” ou “povo”; o singular definido e a imagem coletiva favorecem “a nação”.
- source_word: לֹא הִגְדַּלְתָּ הַשִּׂמְחָה
  choice: não aumentaste a alegria
  rationale: Segue diretamente o Texto Massorético, que traz לֹא, “não”, sem corrigir silenciosamente a leitura difícil.
- source_word: שָׂמְחוּ לְפָנֶיךָ
  choice: Eles se alegram diante de ti
  rationale: O presente comunica com naturalidade o resultado vívido no discurso profético; “diante de ti” preserva a orientação da alegria para a presença de Deus.
- source_word: כְּשִׂמְחַת בַּקָּצִיר
  choice: como na alegria da colheita
  rationale: Mantém explícita a comparação com a alegria própria do tempo da colheita.
- source_word: כַּאֲשֶׁר יָגִילוּ
  choice: como exultam quando
  rationale: גיל indica alegria intensa; “exultam” conserva esse tom elevado sem deixar de ser compreensível.
- source_word: בְּחַלְּקָם שָׁלָל
  choice: repartem o despojo
  rationale: A expressão descreve a distribuição dos bens capturados após uma vitória; “despojo” preserva a imagem militar.
theological_decisions:
- issue: Leitura textual de לֹא (“não”) em contraste com לוֹ (“para ela” ou “a ela”)
  choice: 'O texto principal segue o Texto Massorético: “não aumentaste a alegria”.'
  alternative: “aumentaste a alegria dela”
  rationale: A fonte hebraica fornecida lê claramente לֹא. Embora a leitura alternativa produza um paralelismo mais fluente e seja refletida por versões antigas, a tensão textual não deve ser resolvida por emenda silenciosa; por isso, a alternativa aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a forma verbal profética concisa e a imagem militar do despojo. A leitura difícil do Texto Massorético permanece no texto principal, com a variante antiga registrada em nota.
