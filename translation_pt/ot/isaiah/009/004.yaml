- from: Pois toda bota do guerreiro que marcha no tumulto da batalha[a], e toda veste revolvida em sangue, serão destinadas à queima, combustível para o fogo.
  to: Pois toda bota do guerreiro que marcha no tumulto[a], e toda veste enrolada em sangue, serão destinadas à queima, combustível para o fogo.
