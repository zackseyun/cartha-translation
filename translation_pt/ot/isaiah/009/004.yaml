  text: For every boot of the tramping warrior in the battle's tumult[a], and every garment rolled in blood, will be for burning, fuel for the fire.
translation:
  language: pt
  text: Pois toda bota do guerreiro que marcha no tumulto[a], e toda veste enrolada em sangue, serão destinadas à queima, combustível para o fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o estrépito de quem marcha em tumulto”. A expressão hebraica é rara e difícil; alguns entendem a primeira frase de modo mais abstrato, como referência ao ruído de quem marcha, e não ao calçado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior e mantém com naturalidade o valor causal do hebraico.
- source_word: כָל
  choice: toda
  rationale: Expressa o sentido distributivo e rege naturalmente os dois substantivos singulares coordenados em português.
- source_word: סְאוֹן
  choice: bota
  rationale: Embora raro e difícil, o substantivo provavelmente designa calçado militar neste contexto, formando uma imagem concreta paralela à veste ensanguentada.
- source_word: סֹאֵן
  choice: do guerreiro que marcha
  rationale: Reproduz o valor participial e a ação ruidosa do combatente, explicitando o agente implícito sem abandonar a imagem militar.
- source_word: בְּרַעַשׁ
  choice: no tumulto da batalha
  rationale: רַעַשׁ pode indicar estrondo, agitação ou tumulto; o contexto militar permite explicitar que se trata do tumulto da batalha.
- source_word: וְשִׂמְלָה
  choice: e toda veste
  rationale: שִׂמְלָה é um termo geral para peça de roupa; “veste” conserva um registro digno, e “toda” retoma distributivamente כָל.
- source_word: מְגוֹלָלָה
  choice: revolvida
  rationale: Preserva a imagem do particípio passivo, de algo rolado ou revolvido, sem substituí-la pela interpretação mais explícita “encharcada”.
- source_word: בְדָמִים
  choice: em sangue
  rationale: O plural hebraico é vertido idiomaticamente pelo singular coletivo “sangue”, indicando o sangue do combate.
- source_word: וְהָיְתָה לִשְׂרֵפָה
  choice: serão destinadas à queima
  rationale: Mantém a construção de finalidade ou destinação, literalmente “será para queima”, com concordância portuguesa aplicada aos dois itens coordenados.
- source_word: מַאֲכֹלֶת אֵשׁ
  choice: combustível para o fogo
  rationale: Comunica naturalmente a metáfora literal “alimento do fogo”, indicando aquilo que o fogo consumirá.
