id: ISA.9.5
reference: Isaiah 9:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי יֶ֣לֶד יֻלַּד לָ֗/נוּ בֵּ֚ן נִתַּן לָ֔/נוּ וַ/תְּהִ֥י הַ/מִּשְׂרָ֖ה עַל שִׁכְמ֑/וֹ וַ/יִּקְרָ֨א שְׁמ֜/וֹ פֶּ֠לֶא יוֹעֵץ֙ אֵ֣ל גִּבּ֔וֹר אֲבִי עַ֖ד שַׂר שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/005.yaml
  text: For a child has been born to us[a], a son has been given to us, and the rule is on his shoulder; and his name is called Wonderful Counselor, Mighty God, Father of Eternity[b], Prince of Peace.
translation:
  language: pt
  text: Pois um menino nasceu para nós[a], um filho nos foi dado, e o domínio está sobre o seu ombro; e ele é chamado Maravilhoso Conselheiro, Deus Poderoso, Pai da Eternidade[b], Príncipe da Paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme o valor profético indicado pelo contexto: “Pois um menino nascerá para nós, um filho nos será dado; o domínio estará sobre o seu ombro, e ele será chamado...”'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “Pai da Eternidade”. Também se pode traduzir: “Pai Eterno”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação da esperança anunciada no contexto anterior, preservando a força causal do hebraico.
- source_word: יֶלֶד
  choice: menino
  rationale: Designa uma criança e, neste paralelismo com 'filho', o masculino natural do português corresponde adequadamente ao referente hebraico.
- source_word: יֻלַּד לָנוּ
  choice: nasceu para nós
  rationale: O perfeito passivo apresenta o nascimento como fato consumado; a formulação é clara e mantém לָנוּ sem explicitar um agente não declarado.
- source_word: בֵּן נִתַּן לָנוּ
  choice: um filho nos foi dado
  rationale: Preserva o paralelismo passivo e a ideia de dádiva, sem acrescentar quem o deu.
- source_word: הַמִּשְׂרָה
  choice: o domínio
  rationale: Exprime autoridade régia ou governo sem sugerir apenas uma instituição administrativa moderna.
- source_word: וַתְּהִי ... עַל שִׁכְמוֹ
  choice: está sobre o seu ombro
  rationale: Reproduz diretamente a imagem hebraica da autoridade régia carregada sobre o ombro, sem expandi-la interpretativamente.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: ele é chamado
  rationale: A construção hebraica tem sujeito não especificado e funciona como fórmula de nomeação; a passiva portuguesa evita impor quem dá o nome.
- source_word: פֶּלֶא יוֹעֵץ
  choice: Maravilhoso Conselheiro
  rationale: Lê os termos como um título régio composto e preserva tanto o caráter extraordinário quanto a função de aconselhar.
- source_word: אֵל גִּבּוֹר
  choice: Deus Poderoso
  rationale: Traduz diretamente a forte expressão divina, também presente em Isaías 10:21, sem enfraquecê-la por razões teológicas.
- source_word: אֲבִי עַד
  choice: Pai da Eternidade
  rationale: Reflete de modo transparente a construção hebraica 'pai de eternidade/perpetuidade', preservando sua forma incomum.
- source_word: שַׂר שָׁלוֹם
  choice: Príncipe da Paz
  rationale: É uma tradução direta e natural do título régio; 'paz' preserva, de forma concisa, o amplo sentido de שָׁלוֹם.
theological_decisions:
- issue: Força e referente dos títulos régios
  choice: Tratar toda a sequência como nomes ou títulos atribuídos ao menino, incluindo 'Deus Poderoso'.
  alternative: Entender parte da sequência como descrição de Deus, ou enfraquecer אֵל גִּבּוֹר para 'herói divino' ou 'herói poderoso'.
  rationale: A fórmula de nomeação e a sequência sintática favorecem títulos do menino. A tradução conserva a força do hebraico sem introduzir uma paráfrase teológica nem reduzir sua tensão.
- issue: Valor temporal da proclamação profética
  choice: Usar formas passadas para 'nasceu' e 'foi dado', com o estado presente 'está' e a fórmula 'é chamado'.
  alternative: 'Traduzir toda a sequência com futuro profético: ''nascerá'', ''será dado'', ''estará'' e ''será chamado''.'
  rationale: Os perfeitos hebraicos apresentam os acontecimentos como consumados na proclamação, enquanto o contexto permite uma leitura prospectiva. A nota registra a forma futura tradicional para preservar essa ambiguidade contextual.
- issue: Sentido de אֲבִי עַד
  choice: Pai da Eternidade
  alternative: Pai Eterno
  rationale: A opção principal deixa visível a relação construta do hebraico e evita decidir se a eternidade qualifica diretamente o pai ou aquilo sobre o qual ele exerce paternidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a imagem concreta do ombro, a solenidade dos títulos régios e a ambiguidade temporal por meio de nota. Os marcadores [a] e [b] aparecem no texto principal.
