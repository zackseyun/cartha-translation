  text: וַ/יַּכְרֵ֨ת יְהוָ֜ה מִ/יִּשְׂרָאֵ֗ל רֹ֧אשׁ וְ/זָנָ֛ב כִּפָּ֥ה וְ/אַגְמ֖וֹן י֥וֹם אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/013.yaml
  text: So Yahweh cut off from Israel head and tail[a], palm branch and reed[b], in one day.
translation:
  language: pt
  text: Então, Yahweh cortou de Israel a cabeça e a cauda[a], o ramo de palmeira e o junco[b], num só dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, toda a extensão da nação, dos mais exaltados aos mais humildes; as imagens são explicadas no versículo seguinte.
    reason: cross_reference
  - marker: b
    text: 'Ou: «caniço».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְרֵת
  choice: cortou
  rationale: O hifil de כרת expressa remoção decisiva. Em português, «cortou de Israel» preserva a imagem concreta e o sentido de eliminação, sem ampliar o texto para «destruiu».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição מן indica separação ou remoção do interior da nação; «de Israel» é natural e conciso.
- source_word: רֹאשׁ וְזָנָב
  choice: a cabeça e a cauda
  rationale: Mantém as imagens corporais concretas do hebraico, cuja interpretação é dada no versículo seguinte.
- source_word: כִּפָּה
  choice: o ramo de palmeira
  rationale: Designa a copa ou um ramo da palmeira e conserva a imagem elevada em contraste com o junco.
- source_word: וְאַגְמוֹן
  choice: e o junco
  rationale: אגמון designa uma planta de brejo semelhante a um junco. «Junco» é claro e natural em português e mantém o contraste da imagem.
- source_word: יוֹם אֶחָד
  choice: num só dia
  rationale: Expressão temporal idiomática que comunica a rapidez e a abrangência do juízo.
theological_decisions:
- issue: Manutenção da metáfora em vez de expansão interpretativa
  choice: Preservar «a cabeça e a cauda, o ramo de palmeira e o junco» no texto principal
  alternative: Traduzir interpretativamente como «os líderes e os seguidores, os grandes e os pequenos»
  rationale: O hebraico apresenta imagens metafóricas que são explicadas no versículo seguinte. Mantê-las respeita a forma da fonte e evita inserir a interpretação na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «cortou de Israel» conserva a metáfora hebraica, e os artigos definidos tornam natural a série de pares em português.
