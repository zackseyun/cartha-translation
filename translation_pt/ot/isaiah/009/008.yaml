id: ISA.9.8
reference: Isaiah 9:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָדְעוּ֙ הָ/עָ֣ם כֻּלּ֔/וֹ אֶפְרַ֖יִם וְ/יוֹשֵׁ֣ב שֹׁמְר֑וֹן בְּ/גַאֲוָ֛ה וּ/בְ/גֹ֥דֶל לֵבָ֖ב לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/008.yaml
  text: And all the people will know—Ephraim and the inhabitants of Samaria—who say in pride and in arrogance of heart,[a]
translation:
  language: pt
  text: E todo o povo saberá — Efraim e os habitantes de Samaria —, que dizem com orgulho e arrogância de coração:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “grandeza de coração”. Neste contexto, a expressão transmite a ideia de autoexaltação orgulhosa; por isso, “arrogância de coração”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: E ... saberá
  rationale: O perfeito com conjunção, no discurso profético, admite sentido futuro ou resultativo. O futuro corresponde ao anúncio profético e preserva a continuidade com a declaração citada no versículo seguinte.
- source_word: הָעָם כֻּלּוֹ
  choice: todo o povo
  rationale: Expressa a totalidade indicada pelo substantivo acompanhado de כֻּלּוֹ, em português natural.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém o nome próprio do texto hebraico, embora no contexto ele represente metonimicamente o reino do norte.
- source_word: וְיוֹשֵׁב שֹׁמְרוֹן
  choice: e os habitantes de Samaria
  rationale: O particípio singular tem sentido coletivo; o plural idiomático em português comunica esse valor com clareza.
- source_word: בְּגַאֲוָה
  choice: com orgulho
  rationale: Comunica o sentido moral negativo de גַּאֲוָה e soa natural em português.
- source_word: וּבְגֹדֶל לֵבָב
  choice: e arrogância de coração
  rationale: A expressão significa literalmente 'grandeza de coração', mas neste contexto descreve autoexaltação orgulhosa. 'Arrogância de coração' preserva a força negativa sem tornar opaco o idioma.
- source_word: לֵאמֹר
  choice: que dizem
  rationale: Introduz a fala orgulhosa que continua no versículo seguinte. A forma relativa liga naturalmente os referentes à citação por vir.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os travessões conservam a aposição explicativa, e os dois-pontos indicam que a fala introduzida continua no versículo seguinte.
