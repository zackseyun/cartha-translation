  text: כִּ֣י אֶת עֹ֣ל סֻבֳּל֗/וֹ וְ/אֵת֙ מַטֵּ֣ה שִׁכְמ֔/וֹ שֵׁ֖בֶט הַ/נֹּגֵ֣שׂ בּ֑/וֹ הַחִתֹּ֖תָ כְּ/י֥וֹם מִדְיָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/003.yaml
  text: For the yoke of his burden[a], and the staff on his shoulder[c][b], the rod of his oppressor—you have shattered them as on the day of Midian.
translation:
  language: pt
  text: Pois o jugo de sua carga[a], a vara sobre seu ombro e o bastão de seu opressor — tu os despedaçaste[c], como no dia de Midiã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o jugo de seu fardo» ou «o jugo de sua opressão».
    reason: lexical_alternative
  - marker: b
    text: «O dia de Midiã» provavelmente recorda a derrota que o SENHOR infligiu a Midiã nos dias de Gideão (Juízes 7).
    reason: cross_reference
  - marker: c
    text: O hebraico emprega um verbo no perfeito, «despedaçaste», maneira profética de apresentar a vitória de Deus como certa; algumas traduções trazem «despedaçarás».
    reason: alternative_reading
lexical_decisions:
- source_word: עֹל סֻבֳּלוֹ
  choice: o jugo de sua carga
  rationale: Mantém a imagem concreta do jugo e o sentido de carga ou peso imposto expresso por סבל, sem reduzir a construção a uma abstração.
- source_word: מַטֵּה שִׁכְמוֹ
  choice: a vara sobre seu ombro
  rationale: מַטֶּה pode designar vara ou cajado; «vara» é natural no contexto de opressão, enquanto «sobre seu ombro» preserva a localização expressa pelo hebraico.
- source_word: שֵׁבֶט הַנֹּגֵשׂ בּוֹ
  choice: o bastão de quem o oprimia
  rationale: שֵׁבֶט tem aqui sentido coercivo, e נֹגֵשׂ designa quem oprime, exige trabalho ou conduz à força. «Bastão» evita repetição imediata de «vara» sem perder a imagem punitiva.
- source_word: הַחִתֹּתָ
  choice: tu os despedaçaste
  rationale: O verbo חתת comunica quebra violenta ou destruição. O pronome plural «os» reúne naturalmente em português os instrumentos de opressão enumerados, e o pretérito preserva a forma perfeita e a certeza retórica do texto.
- source_word: כְּיוֹם מִדְיָן
  choice: como no dia de Midiã
  rationale: Preserva a comparação histórica concisa e sua provável alusão à derrota decisiva de Midiã.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da alegria e da libertação descritas no contexto anterior.
theological_decisions:
- issue: Perfeito profético e ação divina
  choice: 'Traduzir הַחִתֹּתָ no pretérito, em discurso direto a Deus: «tu os despedaçaste».'
  alternative: 'Traduzir com futuro: «tu os despedaçarás».'
  rationale: A forma hebraica é perfeita e apresenta a vitória divina como consumada ou tão certa quanto um fato consumado. O pretérito conserva essa força retórica sem eliminar a possível referência futura no contexto profético.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem dos elementos mantém a enumeração enfática do hebraico antes do verbo; o travessão destaca a ação divina. «Tu» preserva a segunda pessoa singular dirigida a Deus.
