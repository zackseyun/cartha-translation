  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ל/םרבה הַ/מִּשְׂרָ֜ה וּ/לְ/שָׁל֣וֹם אֵֽין קֵ֗ץ עַל כִּסֵּ֤א דָוִד֙ וְ/עַל מַמְלַכְתּ֔/וֹ לְ/הָכִ֤ין אֹתָ/הּ֙ וּֽ/לְ/סַעֲדָ֔/הּ בְּ/מִשְׁפָּ֖ט וּ/בִ/צְדָקָ֑ה מֵ/עַתָּה֙ וְ/עַד עוֹלָ֔ם קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּעֲשֶׂה זֹּֽאת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/006.yaml
  text: Of the increase of the dominion and of peace there will be no end[a], on the throne of David and over his kingdom, to establish it and to uphold it with justice and with righteousness from now on and forever. The zeal of Yahweh of Armies will do this.
translation:
  language: pt
  text: O aumento do domínio e da paz não terá fim, sobre o trono de Davi e sobre o seu reino, para estabelecê-lo e sustentá-lo com justiça e retidão, desde agora e para sempre. O zelo de Yahweh dos Exércitos[a] fará isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradicionalmente: “SENHOR dos Exércitos”.'
    reason: Registra a forma tradicional portuguesa do nome divino e do título, sem substituir "Yahweh" no texto principal.
lexical_decisions:
- source_word: למרבה
  choice: O aumento
  rationale: A construção introduz a ideia de crescimento ou expansão contínua; “o aumento” conserva essa força sem transformar a frase em paráfrase.
- source_word: הַמשרה
  choice: do domínio
  rationale: מִשְׂרָה indica autoridade ou governo régio. “Domínio” comunica o alcance da soberania e evita um sentido meramente administrativo.
- source_word: ולשלום
  choice: e da paz
  rationale: שָׁלוֹם abrange paz, integridade e bem-estar; “paz” é a forma concisa e corrente que mantém essas associações no contexto.
- source_word: אין קץ
  choice: não terá fim
  rationale: Embora a oração nominal diga literalmente “não há fim”, o futuro é natural em português no horizonte profético e expressa a duração ilimitada do reinado.
- source_word: על כסא דוד ועל ממלכתו
  choice: Ele reinará sobre o trono de Davi e sobre o seu reino
  rationale: A inserção moderada de “Ele reinará” torna natural em português a ligação sintática fragmentária com o contexto anterior, sem acrescentar uma identificação doutrinária; preserva-se a linguagem dinástica davídica.
- source_word: להכין אתה ולסעדה
  choice: para estabelecê-lo e sustentá-lo
  rationale: כון no hifil comunica firmar ou estabelecer, e סעד, sustentar ou apoiar. Os pronomes masculinos concordam em português com “reino”, antecedente correspondente.
- source_word: במשפט ובצדקה
  choice: com justiça e retidão
  rationale: “Justiça” expressa o sentido governamental e ético de מִשְׁפָּט; “retidão” distingue צְדָקָה e comunica conformidade moral sem repetição.
- source_word: מעתה ועד עולם
  choice: desde agora e para sempre
  rationale: A expressão indica duração contínua a partir do horizonte presente da profecia; esta formulação é clara, digna e atual.
- source_word: קנאת
  choice: O zelo
  rationale: קִנְאָה aqui descreve o ardor comprometido de Yahweh em cumprir a promessa; “zelo” evita a conotação inadequada de inveja mesquinha.
- source_word: יהוה צבאות
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino explícito e traduz צבאות de modo inteligível, preservando a imagem das hostes sob o comando divino.
theological_decisions:
- issue: Escopo davídico e messiânico da promessa régia
  choice: Conservar “trono de Davi”, “seu reino” e a duração eterna, sem inserir no texto uma identificação cristológica explícita.
  alternative: Identificar diretamente o rei prometido como Cristo na tradução.
  rationale: O texto sustenta uma expectativa régia davídica de alcance permanente, mas não traz neste versículo o identificador cristológico explícito; a tradução preserva o alcance e a tensão do texto profético.
- issue: Tradução de יהוה צבאות
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; SENHOR dos Exércitos celestiais
  rationale: “Yahweh” representa diretamente o nome da aliança, e “dos Exércitos” preserva o título hebraico sem limitar no texto principal a possível referência das hostes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração “Ele reinará” explicita apenas o vínculo verbal exigido pela fluência em português. O marcador [a] foi colocado junto de “Yahweh dos Exércitos”, expressão à qual a nota efetivamente se refere.
