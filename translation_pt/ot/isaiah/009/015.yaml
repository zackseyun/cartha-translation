  text: וַ/יִּֽהְי֛וּ מְאַשְּׁרֵ֥י הָֽ/עָם הַ/זֶּ֖ה מַתְעִ֑ים וּ/מְאֻשָּׁרָ֖י/ו מְבֻלָּעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/015.yaml
  text: And the guides of this people have become those who lead them astray[a], and those guided by them are swallowed up.
translation:
  language: pt
  text: E os que guiam este povo passaram a fazê-lo andar perdido[a], e os que são guiados por eles são engolidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que declaram feliz este povo o fazem andar perdido, e os que são declarados felizes por eles são engolidos”. As formas hebraicas derivadas de אשר podem se referir a declarar alguém feliz ou abençoado, embora o contexto também favoreça o sentido de “guiar” e “ser guiado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: se tornaram
  rationale: Expressa a passagem ao estado descrito pelo verbo היה com waw consecutivo, de modo natural em português.
- source_word: מְאַשְּׁרֵי
  choice: os que guiam
  rationale: No contexto, o particípio de אשר designa os guias do povo e prepara a ironia de que esses guias o desencaminham.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Tradução direta e natural de עם com o demonstrativo.
- source_word: מַתְעִים
  choice: os que o fazem andar perdido
  rationale: Preserva a força causativa do particípio Hifil de תעה e a imagem de fazer alguém vagar ou perder o rumo.
- source_word: וּמְאֻשָּׁרָיו
  choice: os que são guiados por eles
  rationale: Entende o particípio passivo em paralelo com מְאַשְּׁרֵי, referindo-se aos que recebem a orientação dos guias; o plural em português explicita o referente coletivo do sufixo hebraico.
- source_word: מְבֻלָּעִים
  choice: são engolidos
  rationale: Mantém a metáfora vívida do particípio passivo de בלע sem reduzi-la interpretativamente a 'destruídos'.
theological_decisions:
- issue: Interpretação das formas derivadas de אשר
  choice: Traduzir as formas emparelhadas como os que guiam e os que são guiados
  alternative: Traduzir como os que declaram este povo feliz ou o abençoam, e os declarados felizes ou abençoados por eles
  rationale: O paralelo imediato com מַתְעִים, 'fazem andar perdido', favorece o sentido de condução. Como אשר também pode estar ligado a declarar alguém feliz ou abençoado, a leitura alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo, a ironia dos guias que desorientam e a metáfora de ser engolido; a ambiguidade lexical relevante é registrada em nota.
