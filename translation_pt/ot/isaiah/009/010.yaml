  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְשַׂגֵּ֧ב יְהוָ֛ה אֶת צָרֵ֥י רְצִ֖ין עָלָ֑י/ו וְ/אֶת אֹיְבָ֖י/ו יְסַכְסֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/010.yaml
  text: And Yahweh raised up the adversaries of Rezin against him[a], and stirred up his enemies[b],
translation:
  language: pt
  text: E Yahweh levantou contra ele[a] os adversários de Rezim e incitou os inimigos dele[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fortaleceu” ou “exaltou” os adversários de Rezim contra ele.
    reason: lexical_alternative
  - marker: b
    text: O hebraico mantém os pronomes no singular (“contra ele… os inimigos dele”); pelo contexto mais amplo, o alvo é o reino do Norte, isto é, Efraim.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: levantou
  rationale: No hifil, שׂגב pode significar pôr em posição elevada, fortalecer ou exaltar. Neste contexto de juízo, “levantou” expressa de modo natural que Yahweh fez surgir ou avançar os adversários, sem sugerir que lhes concedeu honra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: צָרֵי רְצִין
  choice: os adversários de Rezim
  rationale: Reproduz a construção hebraica e evita repetir “inimigos” na mesma oração.
- source_word: עָלָיו
  choice: contra ele
  rationale: Em contexto hostil, עַל tem naturalmente o sentido de “contra”; o pronome masculino singular é preservado.
- source_word: אֹיְבָיו
  choice: os inimigos dele
  rationale: Mantém explicitamente o sufixo masculino singular e evita que “seus” seja entendido como referência a Yahweh.
- source_word: יְסַכְסֵךְ
  choice: incitou
  rationale: סכסך descreve o ato de instigar ou pôr agentes hostis em ação; “incitou” preserva esse sentido causativo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Referente dos pronomes masculinos singulares
  choice: Manter “ele” e “dele” sem nomear o referente no texto principal
  alternative: Israel; Efraim
  rationale: Embora o contexto mais amplo aponte para o reino do Norte/Efraim, o hebraico deste versículo conserva o referente apenas por meio de sufixos singulares. A tradução mantém essa indeterminação textual.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. “Rezim” segue a forma tradicional e amplamente reconhecível em português. A vírgula final foi mantida porque o trecho fornecido continua sintaticamente no versículo seguinte/contexto imediato.
