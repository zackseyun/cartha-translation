id: ISA.9.9
reference: Isaiah 9:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְבֵנִ֥ים נָפָ֖לוּ וְ/גָזִ֣ית נִבְנֶ֑ה שִׁקְמִ֣ים גֻּדָּ֔עוּ וַ/אֲרָזִ֖ים נַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/009.yaml
  text: Bricks have fallen[a], but we will rebuild with cut stone; sycamores have been cut down[b], but we will replace them with cedars.
translation:
  language: pt
  text: Os tijolos caíram, mas construiremos com pedras lavradas; os sicômoros[a] foram cortados, mas nós os substituiremos por cedros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, figueiras-sicômoro.
    reason: cultural_note
lexical_decisions:
- source_word: לְבֵנִים
  choice: tijolos
  rationale: O substantivo plural designa tijolos comuns de construção, provavelmente de barro, em contraste com a cantaria mais resistente; “tijolos” evita especificar além do hebraico.
- source_word: נָפָלוּ
  choice: caíram
  rationale: O qatal na terceira pessoa do plural apresenta a queda como fato consumado; o pretérito perfeito é natural em português.
- source_word: גָזִית
  choice: pedras lavradas
  rationale: O termo designa pedra trabalhada ou talhada para construção. “Pedras lavradas” é claro, digno e preserva o contraste com tijolos comuns.
- source_word: נִבְנֶה
  choice: construiremos
  rationale: O imperfeito na primeira pessoa do plural expressa a ação futura pretendida. Embora “reconstruiremos” seja contextualmente possível, o verbo hebraico significa literalmente “construir”, e a formulação escolhida preserva isso.
- source_word: שִׁקְמִים
  choice: sicômoros
  rationale: Refere-se às figueiras-sicômoro da região. A forma concisa “sicômoros” é tradicional e recebe esclarecimento botânico em nota.
- source_word: גֻּדָּעוּ
  choice: foram cortados
  rationale: A forma passiva indica que as árvores foram abatidas ou decepadas; “foram cortados” preserva a voz passiva em linguagem corrente.
- source_word: אֲרָזִים
  choice: cedros
  rationale: Designa cedros, madeira mais valiosa e prestigiosa que a dos sicômoros; “cedros” é suficiente e natural.
- source_word: נַחֲלִיף
  choice: nós os substituiremos por
  rationale: O hifil de חלף indica substituir uma coisa por outra. A construção explicita naturalmente em português a troca dos sicômoros por cedros.
theological_decisions:
- issue: Tom da declaração dos falantes
  choice: Preservar a resolução confiante expressa pelo contraste entre materiais inferiores destruídos e materiais superiores escolhidos para a nova construção.
  alternative: Apresentar a frase como simples declaração neutra de reconstrução.
  rationale: O contexto caracteriza a fala como orgulhosa e desafiadora, mas esse juízo não precisa ser acrescentado ao versículo; os próprios contrastes entre tijolos e pedras lavradas, sicômoros e cedros, comunicam a pretensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo hebraico e a progressão enfática das duas substituições. A repetição explícita de “nós” na segunda oração reforça naturalmente a determinação dos falantes sem alterar o sentido.
