  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָ/עָם֙ הַ/הֹלְכִ֣ים בַּ/חֹ֔שֶׁךְ רָא֖וּ א֣וֹר גָּד֑וֹל יֹשְׁבֵי֙ בְּ/אֶ֣רֶץ צַלְמָ֔וֶת א֖וֹר נָגַ֥הּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/001.yaml
  text: The people walking in darkness have seen a great light; on those dwelling in a land of deep darkness[a], light has shone.
translation:
  language: pt
  text: O povo que anda nas trevas viu uma grande luz; sobre os que habitam numa terra de profunda escuridão[a], a luz brilhou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “numa terra da sombra da morte”. O termo hebraico צַלְמָוֶת é tradicionalmente traduzido dessa maneira, embora também possa indicar profunda escuridão ou densas trevas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: O povo
  rationale: O substantivo coletivo עַם designa aqui o povo ou a população; “o povo” é direto e natural em português.
- source_word: הַהֹלְכִים
  choice: que anda
  rationale: O particípio expressa uma condição contínua e conserva a imagem hebraica de andar como modo de vida. O singular concorda naturalmente com o coletivo “povo” em português.
- source_word: בַּחֹשֶׁךְ
  choice: nas trevas
  rationale: Preserva tanto a imagem concreta como seu valor metafórico; “nas trevas” é uma formulação corrente e digna em português.
- source_word: רָאוּ
  choice: viu
  rationale: O perfeito hebraico apresenta a visão da luz como acontecimento realizado. O pretérito perfeito português comunica isso com clareza, sem impor uma construção temporal adicional.
- source_word: אוֹר גָּדוֹל
  choice: uma grande luz
  rationale: Reproduz diretamente a combinação substantivo-adjetivo; o artigo indefinido é natural em português.
- source_word: יֹשְׁבֵי
  choice: os que habitam
  rationale: Mantém a força participial e a condição contínua, sem reduzir a expressão ao termo mais genérico “habitantes”.
- source_word: בְּאֶרֶץ
  choice: numa terra
  rationale: A construção é qualitativa — uma terra caracterizada pela escuridão —, e “numa terra de...” soa natural em português.
- source_word: צַלְמָוֶת
  choice: profunda escuridão
  rationale: O termo pode designar trevas densas ou escuridão profunda. Esta opção expressa o sentido provável no contexto sem inserir explicitamente a morte no texto principal; a tradução tradicional é preservada em nota.
- source_word: אוֹר
  choice: a luz
  rationale: A repetição de “luz” preserva o paralelismo e o efeito literário do hebraico.
- source_word: נָגַהּ
  choice: brilhou
  rationale: O verbo significa emitir luz ou brilhar. “Brilhou” é direto e menos interpretativo do que “raiou”.
- source_word: עֲלֵיהֶם
  choice: sobre os que
  rationale: A posição inicial da expressão no segundo membro preserva o paralelismo hebraico e liga naturalmente o pronome aos que habitam na terra descrita.
theological_decisions:
- issue: Tradução de צַלְמָוֶת numa passagem profética de relevância messiânica
  choice: profunda escuridão
  alternative: sombra da morte
  rationale: No contexto, o termo provavelmente funciona como expressão de trevas intensas, sem necessariamente nomear a morte. A leitura tradicional permanece na nota para conservar a ambiguidade lexical e sua importância histórica, sem fazê-la prevalecer sobre o sentido contextual mais provável.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O registro é digno sem ser arcaizante. O paralelismo, a repetição de “luz” e a imagem de andar nas trevas foram preservados.
