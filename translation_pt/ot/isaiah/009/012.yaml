  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ/עָ֥ם לֹא שָׁ֖ב עַד הַ/מַּכֵּ֑/הוּ וְ/אֶת יְהוָ֥ה צְבָא֖וֹת לֹ֥א דָרָֽשׁוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/012.yaml
  text: But the people did not return to him who struck them[a], nor did they seek Yahweh of Armies.
translation:
  language: pt
  text: Mas o povo não voltou para aquele que o feriu, nem buscou Yahweh dos Exércitos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָעָם
  choice: Mas o povo
  rationale: 'A conjunção וְ assume valor adversativo no contexto: apesar do juízo sofrido, o povo não voltou. “Mas” expressa esse contraste naturalmente.'
- source_word: לֹא שָׁב
  choice: não voltou
  rationale: שׁוּב significa voltar ou retornar. “Voltou” preserva tanto o movimento relacional em direção a Deus quanto a implicação de arrependimento, sem explicitar mais do que o hebraico.
- source_word: עַד הַמַּכֵּהוּ
  choice: para aquele que o feriu
  rationale: A expressão aponta pessoalmente para quem aplicou o golpe. O sufixo hebraico é singular e retoma o substantivo coletivo “povo”; por isso, o português singular “o” reproduz bem a forma e permanece natural.
- source_word: וְאֶת
  choice: nem
  rationale: Em coordenação com o segundo verbo negado, “nem” expressa de modo idiomático a ligação entre as duas orações negativas.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: “Yahweh” representa diretamente o nome divino יְהוָה. “Dos Exércitos” comunica em português moderno o sentido concreto de צְבָאוֹת e conserva a forma tradicional do título em português.
- source_word: לֹא דָרָשׁוּ
  choice: nem buscou
  rationale: דָּרַשׁ aqui indica buscar a Deus, recorrendo a ele. Como “o povo” é singular coletivo em português, o verbo permanece no singular.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” o preserva como nome, sem substituí-lo por um título.
- issue: Sentido do título צְבָאוֹת
  choice: dos Exércitos
  alternative: dos Exércitos celestiais; dos poderes; tradicionalmente, dos Exércitos
  rationale: A tradução mantém a imagem ampla de forças organizadas sob o comando divino, sem restringi-la explicitamente a exércitos humanos ou celestiais.
- issue: Agente do golpe e chamado ao retorno
  choice: aquele que o feriu
  alternative: quem o feriu
  rationale: O particípio definido apresenta o agente do juízo como uma pessoa reconhecível no contexto, implicitamente Yahweh. A tradução preserva essa referência sem inserir o nome na primeira oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo entre “não voltou” e “nem buscou”, além do singular coletivo de “o povo”. Não há marcadores de nota porque nenhuma nota é necessária para esclarecer uma ambiguidade textual relevante neste versículo.
