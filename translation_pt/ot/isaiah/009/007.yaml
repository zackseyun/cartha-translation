  text: דָּבָ֛ר שָׁלַ֥ח אֲדֹנָ֖/י בְּ/יַעֲקֹ֑ב וְ/נָפַ֖ל בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/007.yaml
  text: The Lord sent a word into Jacob[a], and it fell on Israel.
translation:
  language: pt
  text: O Senhor enviou uma palavra contra Jacó[a], e ela caiu sobre Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Senhor enviou uma mensagem a Jacó, e ela caiu sobre Israel.”'
    reason: 'Alternativa lexical e preposicional: דָּבָר pode ser “mensagem”, e בְּיַעֲקֹב pode indicar direção ou alvo.'
lexical_decisions:
- source_word: דָּבָר
  choice: uma palavra
  rationale: Preserva a concisão e a força profética do termo, que também pode significar “mensagem” ou “pronunciamento”.
- source_word: שָׁלַח
  choice: enviou
  rationale: É o sentido básico do verbo e soa natural no contexto de uma declaração divina.
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: Traduz o título divino presente no hebraico, que aqui não é o tetragrama.
- source_word: בְּיַעֲקֹב
  choice: contra Jacó
  rationale: No contexto de juízo e em paralelo com a palavra que cai sobre Israel, “contra” comunica o alvo adversativo; a nota preserva a possibilidade direcional de “a Jacó”.
- source_word: וְנָפַל
  choice: e ela caiu
  rationale: Mantém a metáfora vívida da palavra divina que chega com efeito; o pronome feminino retoma naturalmente “palavra” em português.
- source_word: בְּיִשְׂרָאֵל
  choice: sobre Israel
  rationale: Com “cair”, “sobre” expressa naturalmente o impacto sem eliminar a imagem do original.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: O Senhor
  alternative: Senhor
  rationale: O texto traz um título divino, não o nome pactual יהוה; por isso, traduz-se o título de modo reverente e corrente.
- issue: Valor da preposição בְּ diante de Jacó e Israel
  choice: juízo dirigido contra Jacó e caindo sobre Israel
  alternative: “a Jacó” ou, mais literalmente, “em Jacó/Israel”
  rationale: O paralelismo e o contexto de juízo favorecem a força adversativa no primeiro membro, mas a nota mantém a ambiguidade lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Uma palavra” conserva a formulação profética concisa; “ela” torna explícita a retomada gramatical exigida pelo português.
