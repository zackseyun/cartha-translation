  yaml_path: translation/ot/isaiah/009/014.yaml
  text: The elder and the honored man is the head[b][a], and the prophet who teaches falsehood is the tail.
translation:
  language: pt
  text: O ancião e o homem respeitado[a] são a cabeça, e o profeta que ensina a falsidade[b] é a cauda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O idoso e o homem de alta posição”. A expressão hebraica traduzida como “homem respeitado” significa literalmente “elevado de rosto”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o profeta que ensina mentiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: ancião
  rationale: O termo pode indicar tanto um homem idoso quanto um ancião em posição de liderança. “Ancião” é natural no contexto social e preserva a possível função representativa.
- source_word: וּנְשׂוּא פָנִים
  choice: e o homem respeitado
  rationale: O idiomatismo hebraico, literalmente “elevado de rosto”, designa alguém honrado ou de posição elevada. “Homem respeitado” comunica claramente esse prestígio sem reproduzir uma expressão obscura.
- source_word: הוּא הָרֹאשׁ
  choice: são a cabeça
  rationale: O pronome singular identifica conjuntamente as figuras anteriores com a imagem coletiva da “cabeça”. Em português, o verbo no plural concorda naturalmente com o sujeito composto, sem alterar a metáfora singular.
- source_word: וְנָבִיא
  choice: e o profeta
  rationale: A construção apresenta o profeta como figura representativa em paralelo com “a cabeça” e “a cauda”; o artigo definido mantém essa identificação.
- source_word: מוֹרֶה שֶּׁקֶר
  choice: que ensina a mentira
  rationale: O particípio descreve uma atividade característica ou contínua. “Ensina a mentira” preserva diretamente a força moral e cognitiva de שֶׁקֶר.
- source_word: הוּא הַזָּנָב
  choice: é a cauda
  rationale: A tradução conserva sem explicação adicional a metáfora corporal que contrasta com “a cabeça”.
theological_decisions:
- issue: Identificação metafórica dos líderes sociais e religiosos como “cabeça” e “cauda”
  choice: Manter diretamente as metáforas “cabeça” e “cauda”.
  alternative: Explicitar como “líderes” e “parte inferior” ou “seguidores”.
  rationale: O hebraico emprega imagens corporais concretas, desenvolvidas no contexto imediato. Preservá-las mantém a força retórica e evita inserir interpretação no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as metáforas do hebraico foram preservadas, enquanto o idiomatismo social foi expresso de modo natural.
