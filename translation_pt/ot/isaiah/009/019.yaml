base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/019.yaml
  text: He cuts on the right[a], but is hungry; he eats on the left, but is not satisfied[b]. Each one eats the flesh of his own arm.
translation:
  language: pt
  text: Corta à direita[a], mas fica com fome; come à esquerda, mas eles não se saciam. Cada um come a carne do seu próprio braço.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Arrebata à direita”. Neste contexto de violência e fome, o hebraico pode sugerir tomar ou dilacerar alimento com violência, e não simplesmente cortar.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Cada um come a carne do seu braço”. O hebraico passa ao plural em “eles não se saciam”. A imagem provavelmente retrata conflito interno extremo ou autodestruição em termos de canibalismo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְזֹר
  choice: Corta
  rationale: Preserva o sentido concreto mais básico de גזר, «cortar», sem eliminar a possível ideia contextual de arrebatar ou dilacerar alimento.
- source_word: עַל יָמִין
  choice: à direita
  rationale: Expressa de modo natural a direção espacial e mantém o paralelismo com «à esquerda».
- source_word: וְרָעֵב
  choice: mas continua com fome
  rationale: Torna explícita a relação adversativa e a persistência da fome após a ação anterior.
- source_word: וַיֹּאכַל
  choice: come
  rationale: Emprega o sentido comum de אכל e deixa que o contexto comunique o desespero.
- source_word: עַל שְׂמֹאול
  choice: à esquerda
  rationale: Mantém a correspondência retórica e espacial com «à direita».
- source_word: וְלֹא שָׂבֵעוּ
  choice: mas não fica satisfeito
  rationale: Comunica naturalmente a falta de saciedade. Embora o hebraico apresente aqui forma plural, o contexto distributivo permite concordância singular em português com o sujeito implícito, sem alterar o sentido coletivo.
- source_word: אִישׁ
  choice: Cada um
  rationale: Reproduz o valor distributivo do substantivo singular e é inclusivo e natural em português.
- source_word: בְּשַׂר
  choice: a carne
  rationale: Conserva a imagem corporal forte e sombria do hebraico.
- source_word: זְרֹעוֹ
  choice: do seu próprio braço
  rationale: Traduz literalmente «seu braço» e explicita a relação reflexiva sugerida pelo contexto.
- source_word: יֹאכֵלוּ
  choice: come
  rationale: A construção hebraica combina «cada um» no singular com verbo plural em sentido distributivo; o português exige naturalmente concordância singular.
