  naturalness: O registro é moderno, conciso e apropriado. «Corta à direita» e «come à esquerda» conservam a concisão imagética do hebraico. A inclusão de «eles» antes de «não se saciam» torna a mudança para o plural inteligível em português, embora mantenha a ruptura retórica do original.
  terminology: «Carne», «braço» e «cada um» são escolhas adequadas e preservam a crueza corporal e o valor distributivo. «Se saciam» exprime com precisão a ausência de saciedade. A nota lexical sobre «arrebata» é útil; a nota final deve também indicar a forma plural hebraica relevante para a redação revista.
