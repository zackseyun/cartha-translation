base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/020.yaml
  text: Manasseh devours Ephraim[a], and Ephraim Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is still stretched out.
translation:
  language: pt
  text: Manassés devora Efraim[a], e Efraim devora Manassés; juntos, eles estão contra Judá. Apesar de tudo isso, sua ira não se afastou, e sua mão continua estendida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico omite o verbo nas duas primeiras expressões e traz o marcador de objeto antes de cada segundo nome. “Devora” é suprido a partir da imagem do versículo anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Nome próprio tradicional em português para a tribo de Manassés.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Nome próprio tradicional em português para a tribo de Efraim.
- source_word: אֶת
  choice: '[marcador de objeto direto, não traduzido]'
  rationale: O marcador hebraico não possui equivalente natural direto em português.
- source_word: יַחְדָּו הֵמָּה
  choice: juntos, eles
  rationale: Preserva a ação conjunta e dá expressão natural ao pronome independente enfático.
- source_word: עַל
  choice: se lançam contra
  rationale: No contexto de hostilidade, comunica a orientação adversativa; o verbo é suprido para formar uma oração natural em português.
- source_word: בְּכָל זֹאת
  choice: Apesar de tudo isso
  rationale: 'Expressa de modo claro o valor concessivo do refrão: os acontecimentos anteriores não fizeram cessar a ira divina.'
- source_word: לֹא שָׁב אַפּוֹ
  choice: a ira dele não se afastou
  rationale: אף é idiomaticamente 'ira', e שוב descreve aqui a ira que não recuou nem cessou.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: e sua mão continua estendida
  rationale: Mantém a imagem corporal da mão divina e comunica o estado contínuo indicado por וְעוֹד e pelo particípio.
theological_decisions:
- issue: Referente de “a ira dele” e “sua mão”
  choice: Manter os pronomes, cujo referente contextual é Deus
  alternative: Explicitar “a ira do SENHOR” e “a mão dele”
  rationale: O refrão literário identifica contextualmente o agente divino; manter os pronomes preserva a forma hebraica sem inserir o nome divino no versículo.
- issue: Verbo omitido entre Manassés e Efraim
  choice: Suprir “devora” a partir da imagem do versículo anterior
  alternative: Usar uma formulação genérica como “Manassés contra Efraim”
  rationale: O hebraico apresenta frases elípticas com אֶת; recuperar “devora” preserva a vívida imagem contextual, enquanto a nota registra a elipse original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela e o refrão profético foram preservados; a nota torna transparente o único verbo contextual suprido.
