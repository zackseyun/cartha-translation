  - severity: medium
    issue: A nota identifica de forma imprecisa a elipse hebraica.
    rationale: O hebraico não traz literalmente “contra/devorando” entre os nomes. Há marcador de objeto antes do segundo nome em cada membro, e “devora” é inferido da imagem do versículo anterior; a nota deve distinguir esses fatos.
