source:
  edition: WLC
  text: הֵ֣ן גּ֥וֹר יָג֛וּר אֶ֖פֶס מֵֽ/אוֹתִ֑/י מִי גָ֥ר אִתָּ֖/ךְ עָלַ֥יִ/ךְ יִפּֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/015.yaml
  text: Look[a], if anyone stirs up strife, it is not from me[c][b]; whoever stirs up strife with you will fall before you.
translation:
  language: pt
  text: Eis que, se alguém provocar conflito[a], isso não virá de mim[b]; quem provocar conflito com você cairá diante de você[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se ajuntar hostilmente”. O verbo hebraico também pode significar “ajuntar-se” ou “residir”, mas aqui indica oposição hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou “isso não será por mim”, “não terá o meu apoio” ou “será sem mim”.
    reason: lexical_alternative
  - marker: c
    text: Ou “cairá por causa de você”; mais literalmente, “cairá sobre você”. Pelo contexto, trata-se da derrota do agressor, não do êxito de seu ataque.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Veja
  rationale: Introduz uma declaração enfática e chama a atenção. “Veja” preserva essa força em português atual e digno.
- source_word: גּוֹר יָגוּר
  choice: provocar conflito
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ideia verbal. Embora גור possa indicar ajuntamento ou permanência, neste contexto descreve mobilização hostil; “provocar conflito” comunica essa oposição sem restringi-la indevidamente a um ataque militar.
- source_word: אֶפֶס מֵאוֹתִי
  choice: isso não virá de mim
  rationale: A expressão nega que a ação hostil tenha sua origem em Deus. A formulação é natural e mantém a nuance de procedência, sem excluir na nota as possibilidades de agência ou autorização.
- source_word: מִי גָר אִתָּךְ
  choice: quem provocar conflito com você
  rationale: מִי tem aqui valor relativo indefinido, bem expresso por “quem”. Repete-se “provocar conflito” para refletir a repetição de גור; “com você” conserva de perto אִתָּךְ, enquanto o contexto deixa claro o caráter hostil.
- source_word: עָלַיִךְ יִפּוֹל
  choice: cairá diante de você
  rationale: A expressão literalmente associa a queda do agressor a Sião, com a preposição עַל permitindo mais de uma relação. No contexto de proteção e vindicação, “cairá diante de você” comunica a derrota do opositor sem sugerir que seu ataque será bem-sucedido.
theological_decisions:
- issue: Se a hostilidade contra Sião é enviada ou autorizada por Deus
  choice: A ação hostil não vem de Deus.
  alternative: A frase também pode ser entendida mais estritamente como “não será por mim” ou “sem o meu apoio”.
  rationale: אֶפֶס מֵאוֹתִי nega uma relação entre Deus e a hostilidade, mas pode enfatizar origem, agência ou autorização. O texto principal mantém a negação de origem, e a nota preserva as outras nuances.
- issue: Sentido da queda do agressor em relação a Sião
  choice: O agressor cairá derrotado diante dela.
  alternative: Mais literalmente, “cairá sobre você”; também é possível entender “cairá por causa de você”.
  rationale: O contexto imediato promete segurança e vindicação a Sião, mas a construção עָלַיִךְ יִפּוֹל permanece lexicalmente ambígua. A tradução comunica a derrota, enquanto a nota registra as alternativas formais.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom é direto e solene sem arcaísmos. “Você” representa a Sião personificada, destinatária feminina singular no hebraico.
