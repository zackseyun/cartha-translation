  text: כָּל כְּלִ֞י יוּצַ֤ר עָלַ֨יִ/ךְ֙ לֹ֣א יִצְלָ֔ח וְ/כָל לָשׁ֛וֹן תָּֽקוּם אִתָּ֥/ךְ לַ/מִּשְׁפָּ֖ט תַּרְשִׁ֑יעִי זֹ֡את נַחֲלַת֩ עַבְדֵ֨י יְהוָ֧ה וְ/צִדְקָתָ֛/ם מֵ/אִתִּ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/017.yaml
  text: No weapon formed against you will succeed[a], and every tongue that rises against you in judgment you will condemn. This is the heritage of the servants of Yahweh, and their righteousness is from me[b], declares Yahweh.
translation:
  language: pt
  text: Nenhuma arma forjada contra você terá sucesso, e você condenará[a] toda língua que se levantar contra você em juízo. Esta é a herança dos servos de Yahweh, e a justiça deles vem de mim[b] — declara Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você a declarará culpada”. O verbo hebraico tem sentido jurídico: declarar alguém culpado ou condená-lo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a vindicação deles vem de mim”. Neste contexto jurídico, o termo hebraico traduzido por “justiça” também pode indicar uma decisão favorável que os vindica.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלִי
  choice: arma
  rationale: Embora o substantivo possa designar utensílio, vaso ou instrumento, o contexto hostil de algo fabricado contra Sião favorece “arma”.
- source_word: יוּצַר
  choice: forjada
  rationale: O passivo de יצר indica algo moldado ou fabricado. “Forjada” é natural em português no contexto de armas, sem restringir necessariamente o objeto a metal.
- source_word: עָלַיִךְ
  choice: contra você
  rationale: No contexto hostil, a preposição עַל tem sentido adversativo, expresso idiomaticamente por “contra”.
- source_word: יִצְלָח
  choice: terá sucesso
  rationale: O verbo comunica prosperar ou alcançar êxito; aplicado à arma, “terá sucesso” expressa claramente que ela não cumprirá seu propósito.
- source_word: לָשׁוֹן
  choice: língua
  rationale: Mantém a metáfora concreta do hebraico para a fala acusadora e continua inteligível em português.
- source_word: תָּקוּם
  choice: se levantar
  rationale: Preserva a imagem de alguém que se ergue como adversário, aqui em contexto judicial.
- source_word: לַמִּשְׁפָּט
  choice: em juízo
  rationale: Conserva o caráter forense da expressão sem limitá-la a uma instituição judicial moderna específica.
- source_word: תַּרְשִׁיעִי
  choice: você condenará
  rationale: O hifil de רשע significa declarar culpado ou condenar. “Condenará” é conciso e adequado ao cenário jurídico; a alternativa lexical é registrada em nota.
- source_word: נַחֲלַת
  choice: herança
  rationale: Designa posse ou porção recebida e preserva o tom pactual da declaração.
- source_word: עַבְדֵי
  choice: servos
  rationale: Na expressão pactual “servos de Yahweh”, o termo identifica os que pertencem e servem a Yahweh, sem enfatizar aqui a condição social de escravidão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: צִדְקָתָם
  choice: a justiça deles
  rationale: Preserva o vocábulo hebraico padrão do campo de justiça/retidão, enquanto uma nota registra a forte nuance forense de “vindicação” neste contexto.
- source_word: מֵאִתִּי
  choice: vem de mim
  rationale: Expressa em português natural a origem ou procedência indicada pelo hebraico, sem acrescentar a ideia de mérito humano.
theological_decisions:
- issue: Sentido de צִדְקָתָם na cláusula final
  choice: a justiça deles vem de mim
  alternative: a vindicação deles vem de mim
  rationale: O substantivo pode apontar tanto para justiça/retidão quanto, neste cenário jurídico, para a vindicação concedida por Yahweh. O texto principal mantém “justiça”, e a nota preserva a leitura forense sem eliminar a ambiguidade.
- issue: Referente da segunda pessoa feminina singular
  choice: você
  alternative: tu
  rationale: As formas femininas singulares dirigem-se à Sião/Jerusalém personificada no contexto. “Você” mantém o singular e oferece ampla legibilidade moderna; não se explicita “Sião” no texto para não substituir a forma direta do hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém o paralelismo militar e jurídico, a metáfora de “língua”, o nome Yahweh e a ambiguidade entre justiça e vindicação. Os marcadores [a] e [b] aparecem no texto principal.
