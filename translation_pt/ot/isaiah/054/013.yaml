base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/013.yaml
  text: And all your children will be taught by Yahweh[b][a], and great will be the peace of your children.
translation:
  language: pt
  text: E todos os seus filhos[a] serão ensinados por Yahweh, e grande será a paz[b] dos seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos do sexo masculino”, nas duas ocorrências; o hebraico בנים pode designar especificamente filhos do sexo masculino ou, em sentido mais amplo, filhos em geral.
    reason: lexical_alternative
  - marker: b
    text: “Paz” (shalom) também pode transmitir a ideia de integridade, bem-estar ou florescimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: E todos
  rationale: A conjunção dá continuidade ao contexto, e כָּל tem aqui sentido coletivo, expresso naturalmente por “todos”.
- source_word: בָּנַיִ/ךְ ... בָּנָיִ/ךְ
  choice: seus filhos
  rationale: בנים pode designar especificamente filhos homens ou, de modo coletivo, os filhos de ambos os sexos. “Filhos” preserva a metáfora de Sião como mãe e é natural em português.
- source_word: לִמּוּדֵי
  choice: serão ensinados
  rationale: A forma derivada de למד descreve pessoas instruídas. A construção verbal predicativa comunica com clareza a instrução cuja fonte ou agente é Yahweh, sem excluir a alternativa nominal “discípulos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְ/רַב
  choice: e grande será
  rationale: Mantém a ordem poética enfática do predicado hebraico e produz uma formulação digna e natural em português.
- source_word: שְׁלֹום
  choice: paz
  rationale: “Paz” é a correspondência principal e mais reconhecível, enquanto uma nota conserva a amplitude semântica de שָׁלוֹם, que inclui integridade, bem-estar e prosperidade.
theological_decisions:
- issue: Referente de “seus filhos” na promessa dirigida a Sião
  choice: Manter “seus filhos” como descendência coletiva de Sião, sem identificação adicional.
  alternative: “seus filhos homens”, “seus habitantes” ou uma identificação étnica/eclesial explícita
  rationale: O hebraico personifica Sião/Jerusalém como mulher e fala coletivamente de seus filhos. A tradução conserva essa imagem e sua abertura teológica, sem restringi-la ao sexo masculino nem impor uma identificação posterior.
- issue: Relação expressa por לִמּוּדֵי יְהוָה
  choice: “ensinados por Yahweh”
  alternative: “discípulos de Yahweh” ou “instruídos por Yahweh”
  rationale: A formulação escolhida preserva a agência divina mais provável e corresponde ao uso predicativo no contexto, embora a forma hebraica também possa caracterizar os filhos como discípulos ou pessoas instruídas por Yahweh.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A ordem “grande será” conserva o relevo poético do hebraico; “Yahweh” preserva o nome divino.
