- from: '“Pois isto é para mim como as águas de Noé: assim como jurei que as águas de Noé nunca mais passariam sobre a terra[a], também jurei não me irar contra você nem repreendê-la.”'
  to: '“Pois isto é para mim como as águas de Noé: assim como jurei que as águas de Noé nunca mais passariam sobre a terra[a], também jurei não me irar contra ti nem te repreender.”'
  rationale: A única alteração necessária elimina a alternância entre segunda e terceira pessoa no final do versículo. “Ti ... te” é compreensível no português bíblico contemporâneo, preserva a interlocução direta e corresponde à segunda pessoa feminina singular do hebraico. O restante do texto e a nota permanecem fiéis ao Texto Massorético e ao sentido da comparação.
