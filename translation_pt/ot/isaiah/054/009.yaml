source:
  edition: WLC
  text: כִּי מֵ֥י נֹ֨חַ֙ זֹ֣את לִ֔/י אֲשֶׁ֣ר נִשְׁבַּ֗עְתִּי מֵ/עֲבֹ֥ר מֵי נֹ֛חַ ע֖וֹד עַל הָ/אָ֑רֶץ כֵּ֥ן נִשְׁבַּ֛עְתִּי מִ/קְּצֹ֥ף עָלַ֖יִ/ךְ וּ/מִ/גְּעָר בָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/009.yaml
  text: 'For this is like the waters of Noah to me: just as I swore that the waters of Noah would never again pass over the earth[a], so I have sworn not to be angry with you and not to rebuke you.'
translation:
  language: pt
  text: '“Pois isto é para mim como as águas de Noé: assim como jurei que as águas de Noé nunca mais passariam sobre a terra[a], também jurei não me irar contra ti nem te repreender.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois isto é para mim como as águas de Noé”. Algumas traduções, influenciadas por versões antigas, trazem “os dias de Noé”, mas o texto hebraico diz “as águas de Noé”.'
    reason: Leitura alternativa e esclarecimento textual da expressão hebraica elíptica.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da promessa anterior e preserva de modo natural o valor conectivo do hebraico.
- source_word: מֵי נֹחַ
  choice: as águas de Noé
  rationale: Mantém literalmente a expressão construta hebraica e a alusão ao dilúvio, sem substituí-la por “dias de Noé”.
- source_word: זֹאת לִי
  choice: isto é para mim como
  rationale: A construção hebraica é elíptica; “como” explicita a comparação exigida pelo contexto sem eliminar a forma incomum do original.
- source_word: אֲשֶׁר ... כֵּן
  choice: assim como ... também
  rationale: Expressa com clareza a correlação comparativa entre o juramento relacionado a Noé e o juramento dirigido a Sião.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei
  rationale: Verbo direto e solene que corresponde ao ato de prestar juramento; a repetição preserva o paralelismo hebraico.
- source_word: מֵעֲבֹר ... עוֹד
  choice: nunca mais passariam
  rationale: Comunica a proibição de nova ocorrência implícita na construção do juramento e conserva a ideia de as águas passarem sobre a terra.
- source_word: עַל הָאָרֶץ
  choice: sobre a terra
  rationale: “Terra” é apropriado ao contexto do dilúvio de Noé, e “sobre” acompanha o movimento das águas.
- source_word: מִקְּצֹף עָלַיִךְ
  choice: não me irar contra você
  rationale: Torna explícita em português a negação requerida pela construção hebraica com o juramento e mantém a força de קצף.
- source_word: וּמִגְּעָר בָּךְ
  choice: nem repreendê-la
  rationale: “Repreender” traduz naturalmente גער; o pronome feminino explicita que o referente é Sião/Jerusalém, mantendo a concordância feminina do hebraico.
theological_decisions:
- issue: Comparação elíptica em זֹאת לִי
  choice: isto é para mim como as águas de Noé
  alternative: 'isto é para mim: as águas de Noé / isto é para mim como os dias de Noé'
  rationale: O Texto Massorético diz “águas de Noé”, não “dias de Noé”. A inclusão de “como” apenas torna inteligível a comparação elíptica.
- issue: Força do juramento com מִן seguido de infinitivos
  choice: jurei não me irar contra você nem repreendê-la
  alternative: jurei que não me irarei contra você nem a repreenderei
  rationale: A formulação escolhida preserva de perto a construção com infinitivos e explicita a força negativa necessária em português, sem ampliar a afirmação teológica.
- issue: Referente feminino da segunda pessoa
  choice: você ... repreendê-la
  alternative: ti ... te repreender
  rationale: O hebraico se dirige no feminino singular a Sião/Jerusalém. A redação mantém essa informação no pronome objeto, usando linguagem moderna e amplamente compreensível.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita regionalismo excessivo; “repreendê-la” conserva o gênero feminino de Sião/Jerusalém. A repetição de “águas de Noé” e “jurei” mantém o paralelismo solene do original.
