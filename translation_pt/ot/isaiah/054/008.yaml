  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/שֶׁ֣צֶף קֶ֗צֶף הִסְתַּ֨רְתִּי פָנַ֥/י רֶ֨גַע֙ מִמֵּ֔/ךְ וּ/בְ/חֶ֥סֶד עוֹלָ֖ם רִֽחַמְתִּ֑י/ךְ אָמַ֥ר גֹּאֲלֵ֖/ךְ יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/008.yaml
  text: In a surge of wrath I hid my face from you for a moment[a], but with everlasting lovingkindness I have had compassion on you, says Yahweh[b], your Redeemer.
translation:
  language: pt
  text: Num ímpeto de ira, escondi de você o meu rosto por um instante[a], mas, com amor leal eterno, tive compaixão de você — diz Yahweh, seu Redentor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num transbordar de ira” ou “num acesso de ira”. A expressão hebraica é rara e intensifica a ideia de ira.
    reason: lexical_alternative
  - marker: b
    text: “Redentor” traduz um termo que pode designar aquele que resgata e reivindica alguém, muitas vezes com implicações familiares.
    reason: cultural_context
lexical_decisions:
- source_word: בְּשֶׁצֶף קֶצֶף
  choice: num ímpeto de ira
  rationale: A rara combinação de substantivos intensifica a ira e sugere um movimento súbito ou transbordante. “Ímpeto de ira” conserva a concisão e a força poética sem definir excessivamente a imagem.
- source_word: הִסְתַּרְתִּי פָנַי
  choice: escondi de você o meu rosto
  rationale: Preserva diretamente o idioma hebraico de ocultar o rosto, que comunica retirada temporária de favor ou presença.
- source_word: רֶגַע
  choice: por um instante
  rationale: Expressa um período muito breve e sustenta o contraste poético com o amor eterno da linha seguinte.
- source_word: וּבְחֶסֶד עוֹלָם
  choice: mas, com amor leal eterno
  rationale: “Amor leal” comunica de modo natural a constância, misericórdia e fidelidade relacional de חֶסֶד, sem tornar explícita uma referência à aliança que não aparece lexicalmente na expressão.
- source_word: רִחַמְתִּיךְ
  choice: tive compaixão de você
  rationale: O verbo רחם denota compaixão profunda e misericordiosa. A formulação mantém a declaração divina como ação efetiva e é clara em português moderno.
- source_word: גֹּאֲלֵךְ
  choice: seu Redentor
  rationale: Reproduz o título de quem resgata ou reivindica alguém, preservando suas possíveis ressonâncias familiares e pactuais sem especificá-las como “resgatador da família”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de חֶסֶד neste contexto
  choice: amor leal eterno
  alternative: amor constante eterno; misericórdia eterna; amor de aliança eterno
  rationale: O contexto contrasta a ira momentânea com a benevolência divina duradoura. “Amor leal” preserva a amplitude de חֶסֶד — amor, misericórdia e fidelidade — sem restringi-lo a uma única formulação teológica.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega o nome próprio divino. “Yahweh” o representa diretamente e o distingue do título אֲדֹנָי.
- issue: Aspecto de רִחַמְתִּיךְ
  choice: tive compaixão de você
  alternative: terei compaixão de você; mostrei misericórdia a você
  rationale: A forma perfeita pode apresentar a compaixão como ação divina decidida e efetiva. O passado mantém a forma do hebraico sem excluir a força duradoura indicada pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura em duas metades conserva o contraste entre o breve ocultamento do rosto e o amor eterno. Mantém-se a referência feminina singular implícita no contexto hebraico por meio do “você”, sem introduzir marca de gênero desnecessária em português.
