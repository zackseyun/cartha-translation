  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּ/צְדָקָ֖ה תִּכּוֹנָ֑נִי רַחֲקִ֤י מֵ/עֹ֨שֶׁק֙ כִּֽי לֹ֣א תִירָ֔אִי וּ/מִ֨/מְּחִתָּ֔ה כִּ֥י לֹֽא תִקְרַ֖ב אֵלָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/014.yaml
  text: In righteousness you will be established[a]; you will be far from oppression, for you will not fear, and from terror[b], for it will not come near you.
translation:
  language: pt
  text: Em justiça serás estabelecida[a]; mantém-te longe da opressão, pois não temerás, e do terror[b], pois ele não se aproximará de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pela justiça serás estabelecida”. A preposição hebraica pode indicar tanto o meio como a esfera.'
    reason: lexical_alternative
  - marker: b
    text: “Terror” também pode ser traduzido como “destruição” ou “ruína”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּצְדָקָה
  choice: Em justiça
  rationale: A preposição ב pode indicar esfera ou meio. “Em justiça” preserva a concisão e deixa aberta a dimensão ética, jurídica e relacional de צְדָקָה; a possibilidade instrumental é registrada em nota.
- source_word: תִּכּוֹנָנִי
  choice: serás estabelecida
  rationale: Preserva o sentido passivo/resultativo de כון e marca o feminino singular da destinatária, Sião/Jerusalém, sem nomeá-la explicitamente.
- source_word: רַחֲקִי
  choice: mantém-te longe
  rationale: O hebraico apresenta um imperativo feminino singular. A formulação conserva a força de ordem e expressa separação contínua com naturalidade em português.
- source_word: מֵעֹשֶׁק
  choice: da opressão
  rationale: עֹשֶׁק abrange opressão, exploração e extorsão; “opressão” comunica melhor o sentido amplo da ameaça no contexto.
- source_word: כִּי לֹא תִירָאִי
  choice: pois não temerás
  rationale: Mantém o valor de garantia futura do imperfeito e a relação explicativa introduzida por כִּי.
- source_word: מִמְּחִתָּה
  choice: do terror
  rationale: מְחִתָּה pode designar terror, destruição ou ruína. “Terror” corresponde melhor ao paralelo com o medo, sem eliminar em nota as alternativas ligadas à devastação.
- source_word: כִּי לֹא תִקְרַב אֵלָיִךְ
  choice: pois ele não se aproximará de ti
  rationale: O verbo feminino singular retoma naturalmente מְחִתָּה. O pronome “ele” retoma “terror” em português e preserva a imagem da ameaça que não chega perto.
theological_decisions:
- issue: Destinatária e gênero
  choice: Manter a segunda pessoa do singular e marcar o feminino em “estabelecida”, entendendo a destinatária contextual como Sião/Jerusalém.
  alternative: Acrescentar explicitamente “Sião” ou “Jerusalém”.
  rationale: O contexto identifica a figura feminina coletiva, mas o versículo não repete seu nome; não se acrescenta ao texto o que está apenas implícito.
- issue: Força verbal de רַחֲקִי
  choice: 'Traduzir como imperativo: “mantém-te longe”.'
  alternative: 'Ler como promessa: “estarás longe”.'
  rationale: A forma massorética é um imperativo feminino singular. Preservá-la evita transformar uma exortação em mera previsão, embora ela apareça entre promessas de segurança.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a apóstrofe a Sião. “Mantém-te” conserva o imperativo hebraico; “serás estabelecida” torna visível o gênero feminino da destinatária. Evitaram-se explicitações denominacionais e a inserção do nome “Sião” no corpo do versículo.
