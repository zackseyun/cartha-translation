  text: וְ/שַׂמְתִּ֤י כַּֽדְכֹד֙ שִׁמְשֹׁתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ לְ/אַבְנֵ֣י אֶקְדָּ֑ח וְ/כָל גְּבוּלֵ֖/ךְ לְ/אַבְנֵי חֵֽפֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/012.yaml
  text: And I will make your pinnacles of ruby[a], your gates of sparkling stone[d][c][b], and all your boundary walls of precious stones.
translation:
  language: pt
  text: Farei de rubis[a] os seus pináculos[b], de pedras faiscantes[c] os seus portões e de pedras preciosas todo o seu contorno[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico כַּדְכֹד provavelmente designa uma gema vermelha ou brilhante; também pode ser traduzido por “granadas” ou “jaspe vermelho”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “pináculos” é raro e também pode ser entendido como “ameias” ou “janelas”.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica parece referir-se a uma gema brilhante ou de aspecto ígneo; traduções antigas por vezes usam “carbúnculos”.
    reason: lexical_alternative
  - marker: d
    text: Ou “todos os seus limites” ou “todo o seu território”; a imagem da construção da cidade favorece aqui um sentido arquitetônico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Farei
  rationale: O verbo שׂוּם pode significar “pôr”, “estabelecer” ou “fazer”. No contexto da reconstrução figurada da cidade, “farei” comunica de modo natural a ideia de formar seus elementos com pedras preciosas.
- source_word: כַּדְכֹד
  choice: rubis
  rationale: A identificação exata da gema é incerta. “Rubis” conserva a associação tradicional com uma pedra vermelha ou brilhante, enquanto a nota registra alternativas plausíveis.
- source_word: שִׁמְשֹׁתַיִךְ
  choice: seus pináculos
  rationale: O substantivo é raro e de sentido incerto. No conjunto arquitetônico formado por portões e limites da cidade, “pináculos” expressa uma estrutura elevada e ornamental sem eliminar as alternativas registradas em nota.
- source_word: וּשְׁעָרַיִךְ
  choice: os seus portões
  rationale: שַׁעַר designa normalmente o portão de uma cidade. “Portões” é claro e natural no contexto urbano.
- source_word: לְאַבְנֵי אֶקְדָּח
  choice: de pedras faiscantes
  rationale: אֶקְדָּח parece indicar uma pedra de brilho intenso ou aspecto ígneo, mas o mineral não pode ser identificado com segurança. “Pedras faiscantes” preserva a imagem luminosa em português corrente.
- source_word: וְכָל גְּבוּלֵךְ
  choice: todo o seu contorno
  rationale: גְּבוּל pode indicar limite, fronteira ou território. “Todo o seu contorno” se integra à imagem arquitetônica sem especificar indevidamente que se trata de muralhas.
- source_word: לְאַבְנֵי חֵפֶץ
  choice: de pedras preciosas
  rationale: חֵפֶץ expressa aquilo que é desejável, agradável ou estimado. Neste contexto de gemas ornamentais, “pedras preciosas” transmite com clareza o valor e a beleza pretendidos.
