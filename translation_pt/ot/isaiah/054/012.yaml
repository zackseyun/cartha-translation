translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. A construção paralela “de... os seus...” preserva o caráter poético e arquitetônico do hebraico. As incertezas na identificação das gemas e do elemento arquitetônico raro são mantidas nas notas.
