  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ כִּי לֹ֣א תֵב֔וֹשִׁי וְ/אַל תִּכָּלְמִ֖י כִּ֣י לֹ֣א תַחְפִּ֑ירִי כִּ֣י בֹ֤שֶׁת עֲלוּמַ֨יִ/ךְ֙ תִּשְׁכָּ֔חִי וְ/חֶרְפַּ֥ת אַלְמְנוּתַ֖יִ/ךְ לֹ֥א תִזְכְּרִי עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/004.yaml
  text: Do not fear[a], for you will not be put to shame; and do not be humiliated, for you will not be disgraced. For you will forget the shame of your youth[b], and you will remember the reproach of your widowhood no more.
translation:
  language: pt
  text: Não tenha medo[a], pois você não será envergonhada; não fique humilhada, pois você não será desonrada. Você se esquecerá da vergonha da sua juventude[b] e não se lembrará mais da afronta da sua viuvez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não tenha receio”.'
    reason: lexical_alternative
  - marker: b
    text: A linguagem hebraica deste versículo emprega vários termos de sentidos próximos — vergonha, humilhação, desonra e afronta — para enfatizar o fim da desgraça pública de Sião.
    reason: lexical_overlap
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: A proibição é dirigida a Sião/Jerusalém, personificada como mulher. A formulação é direta, natural e preserva o sentido de temor.
- source_word: תֵבוֹשִׁי
  choice: você não será envergonhada
  rationale: O verbo pode expressar vergonha, frustração ou desonra pública; a forma passiva comunica aqui a reversão da vergonha pública de Sião.
- source_word: תִּכָּלְמִי
  choice: não se sinta humilhada
  rationale: O nifal de כלם indica sofrer humilhação ou desonra. Esta formulação distingue o termo de בושׁ sem tornar o português artificial.
- source_word: תַחְפִּירִי
  choice: você não será desonrada
  rationale: Neste contexto, חפר descreve cair em desonra ou opróbrio; “desonrada” mantém a progressão dos termos de vergonha.
- source_word: בֹשֶׁת עֲלוּמַיִךְ
  choice: a vergonha da sua juventude
  rationale: Tradução natural de uma expressão que se refere à vergonha associada à juventude de Sião na metáfora profética.
- source_word: תִּשְׁכָּחִי
  choice: você se esquecerá
  rationale: O futuro expressa a promessa de que a vergonha passada deixará de definir a experiência de Sião.
- source_word: חֶרְפַּת אַלְמְנוּתַיִךְ
  choice: a humilhação da sua viuvez
  rationale: חֶרְפָּה abrange opróbrio, afronta e humilhação pública. “Humilhação” é corrente em português, enquanto “viuvez” preserva literalmente a metáfora matrimonial.
- source_word: לֹא תִזְכְּרִי עוֹד
  choice: não se lembrará mais
  rationale: 'Formulação idiomática que preserva a força temporal de עוֹד: não mais, não novamente.'
theological_decisions:
- issue: Referente feminino singular
  choice: Manter formas femininas para a destinatária, entendida no contexto como Sião/Jerusalém personificada como mulher.
  alternative: Tratar a destinatária como uma mulher genérica ou neutralizar o gênero.
  rationale: O contexto imediato de Isaías 54 emprega imagens femininas, matrimoniais e de viuvez para Sião restaurada. As concordâncias femininas em português preservam essa personificação sem acrescentar o nome “Sião” ao versículo.
- issue: Metáfora matrimonial da viuvez
  choice: Preservar literalmente “viuvez”.
  alternative: Interpretar como “abandono” ou “desolação”.
  rationale: A imagem matrimonial é teologicamente significativa no retrato profético de ruptura e restauração; interpretá-la na tradução eliminaria parte da tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As formas femininas tornam audível a personificação de Sião. Evitou-se vocabulário excessivamente arcaico, mas foi preservada a imagem de “viuvez”.
