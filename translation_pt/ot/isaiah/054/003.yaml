source:
  edition: WLC
  text: כִּי יָמִ֥ין וּ/שְׂמֹ֖אול תִּפְרֹ֑צִי וְ/זַרְעֵ/ךְ֙ גּוֹיִ֣ם יִירָ֔שׁ וְ/עָרִ֥ים נְשַׁמּ֖וֹת יוֹשִֽׁיבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/003.yaml
  text: For you will spread out to the right and to the left[b][a], and your offspring will possess nations and will settle desolate cities.
translation:
  language: pt
  text: Pois você se expandirá para a direita e para a esquerda, e sua descendência possuirá nações[a] e repovoará cidades desoladas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “herdará nações” ou “desapossará nações”. O verbo hebraico pode indicar herdar, tomar posse ou desapossar, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “fará com que cidades desoladas sejam habitadas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da promessa e preserva a ligação causal com o contexto anterior.
- source_word: יָמִין וּשְׂמֹאול
  choice: para a direita e para a esquerda
  rationale: Mantém a imagem espacial concreta, usada aqui para expressar expansão ampla, sem convertê-la indevidamente em pontos cardeais.
- source_word: תִּפְרֹצִי
  choice: você se expandirá
  rationale: Comunica naturalmente o avanço ou alargamento expresso por פרץ no contexto, embora o verbo também possa sugerir irromper ou romper limites.
- source_word: וְזַרְעֵךְ
  choice: sua descendência
  rationale: Preserva o valor coletivo de זֶרַע em português atual, sem o sentido predominantemente biológico de uma tradução literal como 'semente'.
- source_word: גּוֹיִם
  choice: nações
  rationale: É o sentido direto no contexto e evita introduzir a oposição posterior entre judeus e gentios.
- source_word: יִירָשׁ
  choice: possuirá
  rationale: Representa um sentido central de ירשׁ e mantém aberta, por meio da nota, a possível nuance de herdar ou desapossar.
- source_word: עָרִים נְשַׁמּוֹת
  choice: cidades desoladas
  rationale: Conserva de modo conciso o registro profético e a ideia de cidades devastadas ou abandonadas.
- source_word: יוֹשִׁיבוּ
  choice: repovoará
  rationale: Expressa em português natural o Hifil causativo, 'fazer habitar', aplicado a cidades que estavam desoladas.
theological_decisions:
- issue: Sentido de ירשׁ quando גּוֹיִם é o objeto
  choice: possuir nações
  alternative: herdar nações; desapossar nações
  rationale: O verbo admite posse, herança e, em certos contextos, desapossamento. 'Possuir' preserva a promessa concreta de expansão sem decidir além do necessário se a ênfase recai na herança recebida ou na retirada da posse de ocupantes anteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O tratamento feminino singular de Sião é expresso por “você”; “descendência” mantém o referente coletivo. As notas aparecem junto aos termos a que se referem.
