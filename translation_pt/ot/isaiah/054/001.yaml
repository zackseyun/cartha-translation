id: ISA.54.1
reference: Isaiah 54:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָנִּ֥י עֲקָרָ֖ה לֹ֣א יָלָ֑דָה פִּצְחִ֨י רִנָּ֤ה וְ/צַהֲלִי֙ לֹא חָ֔לָה כִּֽי רַבִּ֧ים בְּֽנֵי שׁוֹמֵמָ֛ה מִ/בְּנֵ֥י בְעוּלָ֖ה אָמַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/001.yaml
  text: Sing[a], barren woman, you who have not given birth; break forth into singing and shout for joy, you who have not been in labor. For the children of the desolate woman are more than the children of the married woman, says Yahweh.
translation:
  language: pt
  text: Cante, ó mulher estéril, você que não deu à luz; rompa em cânticos e grite de alegria, você que não sentiu dores de parto. Pois os filhos da mulher desolada são mais numerosos do que os filhos da mulher casada, diz Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָנִּי
  choice: Cante
  rationale: O imperativo feminino singular de רנן convoca a uma expressão vocal de júbilo; “cante” é natural e preserva a forma poética.
- source_word: עֲקָרָה
  choice: ó mulher estéril
  rationale: Explicita a destinatária feminina e traduz com clareza a incapacidade de gerar filhos, mantendo o tom vocativo.
- source_word: לֹא יָלָדָה
  choice: você que não deu à luz
  rationale: Embora a forma seja terceira pessoa feminina singular, descreve a mulher interpelada; a segunda pessoa é natural em português nesse vocativo.
- source_word: פִּצְחִי רִנָּה
  choice: irrompa em canto
  rationale: Preserva a imagem de começar subitamente uma manifestação vocal jubilosa, em linguagem poética compreensível.
- source_word: וְצַהֲלִי
  choice: e grite de alegria
  rationale: Comunica tanto a intensidade sonora como o caráter alegre do verbo צהל.
- source_word: לֹא חָלָה
  choice: você que não sentiu dores de parto
  rationale: Expressa de modo corrente o sentido contextual de contorcer-se ou sofrer no trabalho de parto.
- source_word: כִּי רַבִּים ... מִן
  choice: Pois ... são mais numerosos do que
  rationale: A construção com מן estabelece a comparação; esta formulação a torna explícita e natural em português.
- source_word: בְּנֵי שׁוֹמֵמָה
  choice: os filhos da mulher desolada
  rationale: “Filhos” pode abranger a descendência em geral, e “mulher desolada” conserva a imagem feminina de abandono e devastação.
- source_word: מִבְּנֵי בְעוּלָה
  choice: do que os filhos da mulher casada
  rationale: O מן marca comparação, e בעולה designa aqui a mulher unida a um marido.
- source_word: אָמַר יְהוָה
  choice: diz Yahweh
  rationale: O presente preserva a força da fórmula profética, e “Yahweh” representa diretamente o nome divino יהוה.
theological_decisions:
- issue: Tradução de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Identidade figurada das mulheres
  choice: Manter as figuras como “mulher desolada” e “mulher casada”
  alternative: Identificá-las explicitamente com Sião, Israel ou outra realidade teológica
  rationale: O versículo apresenta imagens femininas sem nomeá-las diretamente; a tradução preserva essa abertura contextual e não impõe uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “você que” mantém clara a interpelação direta; “ó” sustenta o tom poético sem arcaísmo excessivo.
