base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/005.yaml
  text: For your husband is your Maker[a]; Yahweh of Armies is his name. And your Redeemer is the Holy One of Israel[b]; he is called the God of all the earth.
translation:
  language: pt
  text: Pois os seus maridos são os seus Criadores[a]; Yahweh dos Exércitos é o seu nome. O seu Redentor é o Santo de Israel; ele é chamado Deus de toda a terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “maridos” e “criadores” no plural; no contexto, os plurais podem ter força intensiva ou majestática. Tradicionalmente, “o SENHOR dos Exércitos” para “Yahweh dos Exércitos”.
    reason: source_form_and_lexical_alternative
  - marker: b
    text: 'Ou: “ele será chamado Deus de toda a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da consolação expressa no contexto anterior e mantém clara a ligação explicativa.
- source_word: בֹעֲלַיִךְ
  choice: o seu marido
  rationale: No discurso dirigido a Sião como mulher, o sentido conjugal de בעל é o mais adequado; evita diluir a metáfora em “senhor” ou “dono”.
- source_word: עֹשַׂיִךְ
  choice: o seu Criador
  rationale: O particípio de עשה com sufixo funciona como título divino. “Criador” é natural, conciso e dignificado em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título, preservando sua condição de nome pessoal no texto-fonte.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Expressa de forma transparente para o leitor moderno a ideia de forças ou exércitos, ao contrário do tradicional e hoje menos claro “dos Exércitos celestiais” ou “dos Hosts”.
- source_word: שְׁמוֹ
  choice: é o nome dele
  rationale: Reproduz com naturalidade a fórmula titular hebraica e mantém sua cadência solene.
- source_word: וְגֹאֲלֵךְ
  choice: O seu Redentor
  rationale: גאל designa aquele que resgata, com possíveis conotações de parentesco e aliança. “Redentor” preserva o título sem explicitar além do que este versículo afirma.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Conserva literalmente o título divino característico de Isaías.
- source_word: אֱלֹהֵי כָל הָאָרֶץ
  choice: o Deus de toda a terra
  rationale: Mantém o alcance universal da construção hebraica em português natural.
- source_word: יִקָּרֵא
  choice: ele é chamado
  rationale: O nifal imperfeito pode ter valor geral ou presente neste enunciado titular. A nota preserva a leitura futura igualmente possível.
theological_decisions:
- issue: Metáfora conjugal entre Yahweh e Sião
  choice: Manter explicitamente “o seu marido”.
  alternative: Traduzir como “seu senhor” ou “seu dono”.
  rationale: O contexto personifica Sião como mulher, e o sentido conjugal preserva a imagem relacional e de aliança sem acrescentar desenvolvimentos doutrinários posteriores.
- issue: Título divino יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos
  rationale: A escolha mantém o nome pessoal e torna inteligível o sentido militar do título, enquanto a nota registra a forma tradicional.
- issue: Valor temporal de יִקָּרֵא
  choice: 'Presente geral: “ele é chamado”.'
  alternative: 'Futuro: “ele será chamado”.'
  rationale: O título pode declarar a identidade reconhecida de Deus no presente, mas a forma verbal hebraica também admite leitura futura; a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é solene sem arcaísmos; os pronomes femininos referem-se a Sião, personificada no contexto. A ordem “o seu Criador é o seu marido” soa mais idiomática em português e preserva a identificação metafórica do hebraico.
