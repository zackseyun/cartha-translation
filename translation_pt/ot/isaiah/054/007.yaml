  yaml_path: translation/ot/isaiah/054/007.yaml
  text: For a brief moment I abandoned you[a], but with great compassion I will gather you.
translation:
  language: pt
  text: Por um breve momento, eu a abandonei[a], mas, com grande compaixão, eu a reunirei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por um curto instante, eu a desamparei”.'
    reason: Alternativa lexical para “por um breve momento” e “abandonei”, preservando os sentidos possíveis de בְּרֶגַע קָטֹן e עֲזַבְתִּיךְ.
lexical_decisions:
- source_word: בְּרֶגַע קָטֹן
  choice: por um breve momento
  rationale: A combinação expressa uma duração muito curta. “Por um breve momento” é natural em português e preserva tanto a ideia temporal de רֶגַע como a limitação indicada por קָטֹן.
- source_word: עֲזַבְתִּיךְ
  choice: abandonei você
  rationale: עזב pode significar deixar, desamparar ou abandonar. “Abandonei” mantém a força direta e emocional do hebraico sem suavizar o juízo divino.
- source_word: וּבְרַחֲמִים
  choice: mas, com grande compaixão
  rationale: Embora ו seja normalmente aditivo, aqui a segunda oração contrasta o abandono breve com a restauração; por isso, “mas” comunica naturalmente a relação discursiva. רַחֲמִים, embora formalmente plural, funciona como substantivo abstrato.
- source_word: גְּדֹלִים
  choice: grande
  rationale: O adjetivo intensifica a compaixão. “Grande” preserva de modo simples a amplitude expressa no hebraico.
- source_word: אֲקַבְּצֵךְ
  choice: reunirei você
  rationale: O Piel de קבץ significa reunir ou ajuntar, frequentemente no contexto profético de restauração. “Reunirei você” conserva a imagem do texto sem explicitar além dela de onde ou com quem ocorre a reunião.
theological_decisions:
- issue: Juízo divino e restauração compassiva
  choice: Apresentar o abandono como real, porém breve, seguido pela reunião motivada por grande compaixão.
  alternative: Tratar o abandono como apenas aparente ou suavizar o verbo para evitar atribuí-lo a Deus.
  rationale: 'O verbo עזב é direto. A tradução preserva a tensão do próprio texto: Deus afirma ter abandonado a destinatária, mas limita esse abandono a um breve momento e promete restaurá-la com grande compaixão.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “você” evita alternância pronominal e mantém explícita a destinatária coletiva feminina do contexto, embora o gênero não fique marcado nessa forma portuguesa.
