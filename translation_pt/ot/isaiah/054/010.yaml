id: ISA.54.10
reference: Isaiah 54:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י הֶֽ/הָרִים֙ יָמ֔וּשׁוּ וְ/הַ/גְּבָע֖וֹת תְּמוּטֶ֑נָה וְ/חַסְדִּ֞/י מֵ/אִתֵּ֣/ךְ לֹֽא יָמ֗וּשׁ וּ/בְרִ֤ית שְׁלוֹמִ/י֙ לֹ֣א תָמ֔וּט אָמַ֥ר מְרַחֲמֵ֖/ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/010.yaml
  text: For the mountains may depart and the hills may be shaken[a], but my steadfast love will not depart from you, and my covenant of peace will not be shaken, says Yahweh[c][b], who has compassion on you.
translation:
  language: pt
  text: Pois os montes podem se afastar[a], e as colinas podem ser abaladas, mas o meu amor leal[b] não se afastará de você, e a minha aliança de paz[c] não será abalada — diz Yahweh, que tem compaixão de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser removidos”. O mesmo verbo hebraico, מוּשׁ, aparece depois em “não se afastará”.
    reason: lexical_alternative
  - marker: b
    text: “Amor leal” traduz חֶסֶד, termo que também pode transmitir a ideia de amor constante ou amor ligado à aliança.
    reason: lexical_alternative
  - marker: c
    text: Ou “minha aliança de bem-estar”. “Paz” (shalom) inclui plenitude, integridade e bem-estar, não apenas a ausência de conflito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Preserva a força explicativa ou de fundamento da partícula no contexto, ligando esta garantia à promessa anterior.
- source_word: הֶהָרִים
  choice: os montes
  rationale: Reproduz o artigo definido hebraico e mantém a imagem de estabilidade cósmica.
- source_word: יָמוּשׁוּ / לֹא יָמוּשׁ
  choice: podem se afastar / não se afastará
  rationale: O verbo מוּשׁ expressa afastamento ou remoção. A repetição de “afastar” conserva o elo verbal entre os montes e o amor de Yahweh.
- source_word: הַגְּבָעוֹת
  choice: as colinas
  rationale: Equivalente corrente e natural de גְּבָעוֹת, em paralelo com “os montes”.
- source_word: תְּמוּטֶנָה / לֹא תָמוּט
  choice: podem ser abaladas / não será abalada
  rationale: מוֹט comunica perda de estabilidade, oscilação ou deslocamento. A repetição de “abalada” preserva o paralelo entre as colinas e a aliança, sem confundir este verbo com מוּשׁ.
- source_word: וְחַסְדִּי
  choice: mas o meu amor leal
  rationale: חֶסֶד reúne amor, lealdade e compromisso duradouro. “Amor leal” é claro em português atual, enquanto “mas” explicita o contraste presente no contexto.
- source_word: מֵאִתֵּךְ
  choice: de você
  rationale: Expressa diretamente a separação da destinatária feminina singular, Sião/Jerusalém personificada, sem tornar a frase artificial em português.
- source_word: וּבְרִית שְׁלוֹמִי
  choice: e a minha aliança de paz
  rationale: Mantém בְּרִית como “aliança” e שָׁלוֹם como “paz”, formulação natural e reconhecível, deixando em nota a amplitude semântica de shalom.
- source_word: אָמַר
  choice: diz
  rationale: O perfeito profético funciona aqui como fórmula de declaração divina; o presente é idiomático em português.
- source_word: מְרַחֲמֵךְ
  choice: que tem compaixão de você
  rationale: A forma participial apresenta Yahweh como aquele que demonstra compaixão continuamente; a oração relativa soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: amor constante; amor de aliança; misericórdia
  rationale: “Amor leal” preserva tanto a afeição quanto a fidelidade duradoura do termo, sem reduzi-lo a uma fórmula doutrinária específica; a menção seguinte à aliança reforça sua dimensão pactual.
- issue: Amplitude de שָׁלוֹם
  choice: paz
  alternative: bem-estar; plenitude
  rationale: “Paz” mantém a formulação bíblica reconhecível, enquanto a nota esclarece que שָׁלוֹם abrange integridade e bem-estar, não apenas ausência de conflito.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração conserva o nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Foram preservadas as duas repetições verbais do hebraico: “afastar” para מוּשׁ e “abalar” para מוֹט. A construção com “podem” mantém a imagem concessiva como possibilidade extrema sem substituir a força explicativa inicial de כִּי.'
