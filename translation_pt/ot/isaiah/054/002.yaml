  text: הַרְחִ֣יבִי מְק֣וֹם אָהֳלֵ֗/ךְ וִ/ירִיע֧וֹת מִשְׁכְּנוֹתַ֛יִ/ךְ יַטּ֖וּ אַל תַּחְשֹׂ֑כִי הַאֲרִ֨יכִי֙ מֵֽיתָרַ֔יִ/ךְ וִ/יתֵדֹתַ֖יִ/ךְ חַזֵּֽקִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/002.yaml
  text: Enlarge the place of your tent[a], and let the curtains of your dwellings be stretched out; do not hold back. Lengthen your cords[b], and strengthen your stakes.
translation:
  language: pt
  text: Amplie o espaço da sua tenda, e que se estendam as cortinas das suas habitações; não se contenha.[a] Alongue as suas cordas e reforce as suas estacas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não poupe” ou “não restrinja”.'
    reason: lexical_alternative
  - marker: b
    text: As “cortinas” eram os panos que formavam e cobriam a tenda; as “estacas” eram os pinos que a prendiam ao chão.
    reason: cultural_note
lexical_decisions:
- source_word: הַרְחִיבִי
  choice: Amplie
  rationale: O imperativo hifil feminino singular de רחב ordena tornar mais amplo. “Amplie” é atual, natural e preserva a força do comando dirigido a Sião.
- source_word: מְקוֹם אָהֳלֵךְ
  choice: o espaço da sua tenda
  rationale: מְקוֹם pode designar lugar ou espaço; “espaço” comunica com clareza a área ocupada pela tenda, mantendo a imagem concreta e o singular do hebraico.
- source_word: וִירִיעוֹת מִשְׁכְּנוֹתַיִךְ
  choice: as cortinas das suas moradas
  rationale: יְרִיעוֹת são os grandes panos ou cortinas que formavam uma tenda, enquanto מִשְׁכְּנוֹת é plural e significa moradas ou habitações. A formulação conserva ambos os elementos da metáfora.
- source_word: יַטּוּ
  choice: que se estendam
  rationale: O hifil imperfeito na sequência tem valor exortativo. “Que se estendam” expressa esse sentido e apresenta as cortinas como aquilo que deve ser estendido.
- source_word: אַל תַּחְשֹׂכִי
  choice: não se contenha
  rationale: חשׂך pode significar reter, poupar ou restringir. No chamado à expansão, “não se contenha” é idiomático e preserva a ideia de não limitar a ação.
- source_word: הַאֲרִיכִי מֵיתָרַיִךְ
  choice: Alongue as suas cordas
  rationale: O hifil de ארך significa tornar comprido ou alongar, e מֵיתָרִים são as cordas que sustentam a tenda. A tradução é direta e mantém a imagem.
- source_word: וִיתֵדֹתַיִךְ חַזֵּקִי
  choice: reforce as suas estacas
  rationale: יָתֵד designa uma estaca ou pino de tenda, e o piel de חזק ordena torná-la firme ou forte. “Reforce” soa natural em português e preserva a ação de assegurar a tenda ampliada.
theological_decisions:
- issue: Linguagem metafórica da habitação de Sião
  choice: Manter literalmente a imagem da tenda, de suas cortinas, cordas e estacas.
  alternative: Explicitar no texto principal o crescimento da população ou a restauração de Sião.
  rationale: O hebraico apresenta uma série de ordens concretas baseadas na ampliação de uma tenda. Preservar a metáfora permite que seu alcance profético e teológico seja percebido pelo contexto, sem impor uma interpretação na tradução.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento na terceira pessoa do singular. Os imperativos permanecem no feminino singular, de acordo com o hebraico e com Sião como destinatária personificada. A colocação dos marcadores foi ajustada para corresponder ao conteúdo de cada nota.
