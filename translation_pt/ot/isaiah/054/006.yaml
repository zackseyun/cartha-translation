base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/006.yaml
  text: For Yahweh has called you like a wife forsaken and grieved in spirit[a], like a wife of youth when she is rejected[b], says your God.
translation:
  language: pt
  text: Pois Yahweh chamou você como uma esposa abandonada e de espírito aflito[a], como uma esposa que se casou jovem, quando é rejeitada[b] — diz o seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma mulher abandonada e de espírito aflito”. O hebraico אִשָּׁה pode significar “mulher” ou “esposa”; o contexto matrimonial favorece “esposa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como uma esposa que se casou jovem, embora seja rejeitada” ou “quando é desprezada”. A oração hebraica é compacta e admite pequenas diferenças de nuance.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da garantia anterior e preserva a ligação argumentativa do contexto.
- source_word: כְאִשָּׁה
  choice: como uma esposa
  rationale: אִשָּׁה pode significar “mulher” ou “esposa”; a metáfora matrimonial do contexto favorece “esposa”.
- source_word: עֲזוּבָה
  choice: abandonada
  rationale: Expressa de modo natural e forte a condição relacional de quem foi deixada, sem arcaísmo desnecessário.
- source_word: וַעֲצוּבַת רוּחַ
  choice: e de espírito aflito
  rationale: Preserva a referência hebraica ao espírito como sede da dor interior, em português atual e digno.
- source_word: קְרָאָךְ
  choice: chamou você
  rationale: Mantém o qatal como ação realizada e o sufixo feminino dirigido a Sião; “você” oferece ampla legibilidade brasileira.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְאֵשֶׁת נְעוּרִים
  choice: como a esposa da juventude
  rationale: Conserva a imagem compacta da mulher desposada na juventude; o segundo “como” explicita a relação comparativa sugerida pelo paralelismo.
- source_word: כִּי תִמָּאֵס
  choice: quando é rejeitada
  rationale: Representa o sentido passivo do nifal e uma nuance temporal natural, sem eliminar a dificuldade sintática da oração.
- source_word: אָמַר אֱלֹהָיִךְ
  choice: diz o seu Deus
  rationale: Emprega o presente convencional da fórmula profética e mantém a relação pactual indicada por “seu Deus”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Metáfora matrimonial aplicada a Sião
  choice: Manter explicitamente “esposa”
  alternative: Generalizar como “mulher” ou substituir por “povo/cidade”
  rationale: A linguagem matrimonial pertence ao próprio texto e comunica sua força relacional sem impor uma identificação doutrinária posterior.
- issue: Ambiguidade de כִּי תִמָּאֵס
  choice: quando é rejeitada
  alternative: embora seja rejeitada; se for rejeitada; quando é desprezada
  rationale: A construção hebraica é compacta e admite nuances diferentes; a tradução principal escolhe uma leitura contextual plausível, enquanto a nota conserva as alternativas.
translation_notes:
  register: Português moderno, digno e de leitura amplamente acessível, com preferência brasileira em “você”. A formulação conserva o paralelismo poético, a metáfora matrimonial e a ambiguidade relevante da oração final por meio de nota.
