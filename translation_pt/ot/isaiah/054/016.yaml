source:
  edition: WLC
  text: הן אָֽנֹכִי֙ בָּרָ֣אתִי חָרָ֔שׁ נֹפֵ֨חַ֙ בְּ/אֵ֣שׁ פֶּחָ֔ם וּ/מוֹצִ֥יא כְלִ֖י לְ/מַעֲשֵׂ֑/הוּ וְ/אָנֹכִ֛י בָּרָ֥אתִי מַשְׁחִ֖ית לְ/חַבֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/016.yaml
  text: Look[a], I myself have created the craftsman who blows on the fire of coals and brings out a weapon for his work[c][b]; and I myself have created the destroyer to destroy.
translation:
  language: pt
  text: Eis que eu mesmo criei o artesão[a] que sopra sobre o fogo de carvão e produz uma arma[b] para o seu trabalho[c]; e eu mesmo criei o destruidor para destruir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ferreiro”. O termo hebraico pode designar um artesão em geral, mas o contexto do fogo de carvão e da fabricação de uma arma aponta para um trabalhador de metais.
    reason: lexical_alternative
  - marker: b
    text: Ou “utensílio” ou “objeto”. A palavra hebraica é ampla, mas neste contexto provavelmente se refere a um instrumento de guerra.
    reason: lexical_alternative
  - marker: c
    text: O sufixo hebraico pode referir-se ao artesão (“para o trabalho dele”) ou ao objeto produzido (“para sua função”).
    reason: alternative_reading
lexical_decisions:
- source_word: הן
  choice: Eis que
  rationale: Partícula que chama a atenção e introduz com ênfase a declaração divina; “eis que” preserva essa força de modo conciso e digno.
- source_word: אָנֹכִי / וְאָנֹכִי
  choice: eu mesmo / e eu mesmo
  rationale: O pronome independente é enfático e sua repetição ressalta que Deus é o criador das duas figuras mencionadas.
- source_word: בָּרָאתִי
  choice: criei
  rationale: O perfeito qal na primeira pessoa declara a ação criadora de Deus de maneira direta; o pretérito perfeito é natural em português.
- source_word: חָרָשׁ
  choice: artesão
  rationale: O substantivo pode designar um artífice em sentido amplo, embora o fogo das brasas e a fabricação de uma arma apontem, no contexto, para um ferreiro.
- source_word: נֹפֵחַ בְּאֵשׁ פֶּחָם
  choice: que sopra o fogo das brasas
  rationale: Mantém a imagem concreta do artífice que sopra ou atiça o fogo alimentado por carvão.
- source_word: וּמוֹצִיא כְלִי
  choice: e produz uma arma
  rationale: כְלִי é amplo, podendo significar objeto, utensílio ou arma; o contexto do destruidor favorece “arma”.
- source_word: לְמַעֲשֵׂהוּ
  choice: para o seu trabalho
  rationale: A formulação portuguesa preserva a concisão e a ambiguidade do sufixo hebraico, que pode remeter ao artesão ou ao objeto produzido.
- source_word: מַשְׁחִית
  choice: o destruidor
  rationale: O particípio hifil substantivado designa diretamente aquele que destrói.
- source_word: לְחַבֵּל
  choice: para destruir
  rationale: O infinitivo expressa finalidade; a repetição “destruidor para destruir” reflete com transparência a formulação hebraica.
theological_decisions:
- issue: A criação divina tanto do fabricante da arma quanto do destruidor
  choice: Afirmar diretamente que Deus criou ambas as figuras
  alternative: Atenuar ou tornar indireta a relação de Deus com o destruidor
  rationale: O hebraico repete enfaticamente “eu mesmo criei”. A tradução preserva essa tensão teológica sem acrescentar uma explicação filosófica sobre o mal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a função enfática da partícula inicial; a repetição “eu mesmo criei” e a tensão teológica do original foram mantidas.
