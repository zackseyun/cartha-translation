id: ISA.54.11
reference: Isaiah 54:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֲנִיָּ֥ה סֹעֲרָ֖ה לֹ֣א נֻחָ֑מָה הִנֵּ֨ה אָנֹכִ֜י מַרְבִּ֤יץ בַּ/פּוּךְ֙ אֲבָנַ֔יִ/ךְ וִ/יסַדְתִּ֖י/ךְ בַּ/סַּפִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/054/011.yaml
  text: O afflicted one[a], storm-tossed and not comforted, behold[b], I am setting your stones in antimony and laying your foundations with sapphires.
translation:
  language: pt
  text: Ó aflita, açoitada pela tempestade e não consolada, eis que eu assentarei as suas pedras em antimônio[a] e lançarei os seus alicerces com safiras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “em antimônio” provavelmente se refere a um material escuro e decorativo no qual as pedras seriam assentadas; alguns entendem que se trata de uma argamassa escura ou de uma incrustação.
    reason: cultural_note
  - marker: b
    text: Ou “com lápis-lazúli”; o termo hebraico tradicionalmente traduzido por “safiras” talvez designe uma pedra preciosa azul diferente da safira moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנִיָּה
  choice: Ó aflita
  rationale: O adjetivo feminino singular funciona como vocativo e personifica Sião/Jerusalém. “Ó aflita” preserva o tratamento direto e o sentido de sofrimento sem restringi-lo à pobreza material.
- source_word: סֹעֲרָה
  choice: açoitada pela tempestade
  rationale: O particípio retrata alguém submetido à violência de uma tempestade. A expressão é natural em português e mantém viva a imagem poética.
- source_word: לֹא נֻחָמָה
  choice: não consolada
  rationale: Reproduz diretamente o sentido passivo, sem acrescentar quem deixou de oferecer consolo.
- source_word: הִנֵּה אָנֹכִי
  choice: eis que eu
  rationale: Mantém a ênfase da declaração divina e o registro elevado da profecia, com o pronome explícito refletindo אָנֹכִי.
- source_word: מַרְבִּיץ
  choice: assentarei
  rationale: No contexto arquitetônico, o verbo descreve a colocação das pedras. O futuro em português comunica adequadamente a ação divina iminente apresentada de modo vívido pelo particípio hebraico.
- source_word: בַּפּוּךְ
  choice: em antimônio
  rationale: פּוּךְ designa normalmente o antimônio ou um mineral cosmético escuro. A tradução conserva o termo concreto e deixa em nota sua provável função como material decorativo de assentamento.
- source_word: אֲבָנַיִךְ
  choice: as suas pedras
  rationale: Mantém o sentido comum de “pedras” dentro da metáfora arquitetônica da restauração de Sião, sem transformá-las indevidamente em joias.
- source_word: וִיסַדְתִּיךְ
  choice: e lançarei os seus alicerces
  rationale: O verbo יסד significa fundar ou lançar alicerces. A formulação explicita de modo idiomático em português o elemento arquitetônico implícito.
- source_word: בַּסַּפִּירִים
  choice: com safiras
  rationale: “Safiras” preserva a tradução tradicional, enquanto a identificação mineralógica incerta do termo antigo é registrada em nota.
theological_decisions:
- issue: Identidade da destinatária
  choice: O versículo se dirige à Sião/Jerusalém personificada como uma mulher aflita.
  alternative: Uma mulher aflita em sentido genérico ou, de modo mais abstrato, a comunidade da aliança.
  rationale: As formas femininas singulares e o contexto imediato de Isaías 54 favorecem a personificação de Sião/Jerusalém. A tradução preserva esse tratamento sem acrescentar uma identificação eclesiológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo e as imagens arquitetônicas e poéticas foram preservados. Os marcadores de nota foram posicionados junto aos termos que efetivamente explicam.
