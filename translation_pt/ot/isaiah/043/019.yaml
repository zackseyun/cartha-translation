base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/019.yaml
  text: Look[a], I am doing a new thing; now it springs up—do you not perceive it? I will even make a way in the wilderness[b], rivers in the wasteland.
translation:
  language: pt
  text: Vejam! Estou fazendo algo novo; agora está brotando — vocês não percebem?[a] Também abrirei um caminho no deserto[b] e farei rios na terra árida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reconhecem?” ou “sabem disso?”
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega dois termos relacionados, mas distintos, para terras estéreis: aqui, “deserto” e, no fim do versículo, “terra árida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Vejam!
  rationale: Introduz com vivacidade o anúncio divino e chama a atenção dos destinatários. O plural combina com o público indicado por תֵדָעוּהָ, sem recorrer ao mais solene e menos corrente “eis que”.
- source_word: עֹשֶׂה חֲדָשָׁה
  choice: Estou fazendo algo novo
  rationale: O particípio apresenta a ação divina como presente ou já em curso, e o adjetivo feminino substantivado é expresso naturalmente por “algo novo”.
- source_word: עַתָּה תִצְמָח
  choice: agora mesmo está brotando
  rationale: “Brotando” preserva a metáfora orgânica do verbo צמח; “agora mesmo” realça a imediatez de עַתָּה sem transformar a frase em mera previsão futura.
- source_word: תֵדָעוּהָ
  choice: percebem
  rationale: Embora ידע costume significar “conhecer” ou “saber”, neste contexto a pergunta trata de notar e reconhecer a ação divina que começa a brotar.
- source_word: אַף אָשִׂים
  choice: Sim, abrirei ... e farei
  rationale: אַף introduz enfaticamente a concretização surpreendente da promessa. O verbo שׂים significa literalmente “pôr”, mas “abrir um caminho” e “fazer rios” são construções naturais em português; a repetição verbal evita que “abrir rios” soe inadequado.
- source_word: בַּמִּדְבָּר דֶּרֶךְ
  choice: um caminho no deserto
  rationale: “Caminho” mantém tanto a imagem concreta quanto suas possíveis ressonâncias temáticas em Isaías, sem impor uma interpretação alegórica.
- source_word: בִּישִׁמוֹן נְהָרוֹת
  choice: rios na terra árida
  rationale: “Terra árida” comunica uma região desolada e improdutiva e permite distingui-la de מִדְבָּר, traduzido como “deserto”.
theological_decisions:
- issue: Alcance metafórico e redentor de “algo novo”
  choice: Manter as imagens concretas de renovação — broto, caminho e rios — sem identificar na tradução um único cumprimento doutrinário.
  alternative: Explicitar o retorno do exílio, uma renovação escatológica ou uma antecipação tipológica da salvação messiânica.
  rationale: O texto hebraico permite que essas imagens tenham mais de uma camada de realização na teologia de Isaías. A tradução preserva essa amplitude e tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural sobretudo para brasileiros e amplamente compreensível no mundo lusófono. “Vejam!” conserva a força de chamada de atenção; “agora mesmo está brotando” mantém a vivacidade e a metáfora do hebraico.
