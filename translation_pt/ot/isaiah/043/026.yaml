  text: הַזְכִּירֵ֕/נִי נִשָּׁפְטָ֖ה יָ֑חַד סַפֵּ֥ר אַתָּ֖ה לְמַ֥עַן תִּצְדָּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/026.yaml
  text: Remind me[a]; let us argue the case together. State your case[b], so that you may be proved right.
translation:
  language: pt
  text: Faça-me lembrar; vamos juntos a juízo.[a] Exponha a sua causa, para que você seja reconhecido como justo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “discutamos juntos a causa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que você seja justificado”, “vindicado” ou “tenha sua razão comprovada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְכִּירֵנִי
  choice: Faça-me lembrar
  rationale: O imperativo hifil de זכר com sufixo de primeira pessoa significa literalmente causar alguém a lembrar. A formulação preserva o desafio direto e a tensão de Deus pedir que lhe façam lembrar.
- source_word: נִשָּׁפְטָה יָחַד
  choice: discutamos juntos a causa
  rationale: A forma coortativa nifal de שפט tem aqui sentido forense e recíproco. A expressão comunica em português corrente que as partes apresentam seus argumentos numa controvérsia judicial; a alternativa mais formal é registrada em nota.
- source_word: סַפֵּר
  choice: Exponha a sua causa
  rationale: O imperativo piel de ספר pode significar contar, declarar ou expor. No contexto judicial, 'exponha a sua causa' expressa naturalmente a apresentação dos argumentos.
- source_word: אַתָּה
  choice: você
  rationale: O pronome independente dá ênfase ao destinatário. Em português, sua presença explícita na oração final ajuda a manter essa focalização sem a construção pouco natural 'exponha você'.
- source_word: לְמַעַן
  choice: para que
  rationale: Conjunção de propósito ou resultado, vertida pela correspondência portuguesa direta.
- source_word: תִּצְדָּק
  choice: você seja reconhecido como justo
  rationale: No cenário forense, o qal de צדק indica ser considerado ou demonstrado justo, isto é, estar com a razão. A escolha conserva a linguagem jurídica sem impor uma formulação doutrinária posterior.
theological_decisions:
- issue: Sentido forense de צדק
  choice: seja reconhecido como justo
  alternative: seja justificado; seja vindicado; fique provado que você tem razão
  rationale: O contexto é o de uma controvérsia judicial divina. A tradução mantém a possibilidade de declaração favorável sem reduzir 'justo' apenas a 'ter razão' nem carregar o verbo, no texto principal, com associações doutrinárias posteriores.
- issue: Convite divino à controvérsia judicial
  choice: discutamos juntos a causa
  alternative: entremos juntos em juízo
  rationale: A forma hebraica apresenta Deus e o interlocutor participando juntos da demanda. A tradução conserva esse caráter recíproco, sem decidir antecipadamente qual parte será julgada ou vindicada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo imperativo foi preservado, e as notas registram alternativas formais e forenses genuínas do hebraico.
