  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַתֶּ֤ם עֵדַ/י֙ נְאֻם יְהוָ֔ה וְ/עַבְדִּ֖/י אֲשֶׁ֣ר בָּחָ֑רְתִּי לְמַ֣עַן תֵּ֠דְעוּ וְ/תַאֲמִ֨ינוּ לִ֤/י וְ/תָבִ֨ינוּ֙ כִּֽי אֲנִ֣י ה֔וּא לְ/פָנַ/י֙ לֹא נ֣וֹצַר אֵ֔ל וְ/אַחֲרַ֖/י לֹ֥א יִהְיֶֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/010.yaml
  text: You are my witnesses[a], declares Yahweh, and my servant whom I have chosen, so that you may know and believe in me and understand that I am he. Before me no god was formed[c][b], and after me there will be none.
translation:
  language: pt
  text: Vocês são minhas testemunhas — declara Yahweh — e meu servo, a quem escolhi, para que vocês saibam, creiam em mim[a] e entendam que eu sou ele.[b] Antes de mim nenhum deus foi formado, e depois de mim não haverá nenhum.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “acreditem em mim” ou “confiem em mim”. O hebraico pode expressar tanto crença quanto confiança quando uma pessoa é o objeto.
    reason: lexical_alternative
  - marker: b
    text: Ou “que eu sou aquele”. O hebraico diz literalmente “que eu sou ele”, uma fórmula breve de autoidentificação divina usada em Isaías.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico é elíptico: “e depois de mim não haverá”. Pelo paralelismo, o sentido é “não haverá nenhum deus” ou “não haverá nenhum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדַי
  choice: minhas testemunhas
  rationale: O substantivo está no plural, com sufixo de primeira pessoa do singular; Israel é interpelado coletivamente como testemunhas.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Mantém a fórmula profética solene e preserva o nome divino expresso no hebraico.
- source_word: וְעַבְדִּי
  choice: e meu servo
  rationale: Conserva o singular hebraico e a designação pactual usada para Israel/Jacó no contexto, sem impor a ideia de escravidão.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: a quem escolhi
  rationale: Traduz diretamente a oração relativa e a ação divina concluída, com formulação natural em português.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa de modo claro a finalidade introduzida pela preposição hebraica.
- source_word: תֵּדְעוּ
  choice: vocês saibam
  rationale: O imperfeito após לְמַעַן indica finalidade ou resultado pretendido, e não mero futuro.
- source_word: וְתַאֲמִינוּ לִי
  choice: creiam em mim
  rationale: A construção de אמן no hiphil com ל pode indicar crer ou confiar em alguém; esta formulação é natural em português e mantém Deus como objeto da fé/confiança.
- source_word: וְתָבִינוּ
  choice: e entendam
  rationale: Preserva a sequência cognitiva de saber, crer e entender em linguagem corrente.
- source_word: כִּי אֲנִי הוּא
  choice: que eu sou ele
  rationale: Mantém a fórmula compacta de autoidentificação divina em Isaías, sem ampliá-la para uma interpretação teológica mais específica.
- source_word: לֹא נוֹצַר אֵל
  choice: nenhum deus foi formado
  rationale: Reproduz o passivo de יצר e a afirmação temporal e polêmica de que nenhum deus veio a existir antes de Yahweh.
- source_word: וְאַחֲרַי לֹא יִהְיֶה
  choice: e depois de mim não haverá nenhum
  rationale: Supre em português o referente elíptico do hebraico, entendido pelo paralelismo como 'deus' ou 'nenhum'.
theological_decisions:
- issue: Referente de “meu servo”
  choice: Manter o singular “meu servo”, permitindo a referência coletiva a Israel/Jacó no contexto imediato
  alternative: Explicitar um servo individual ou uma figura messiânica
  rationale: O discurso se dirige a um grupo no plural, enquanto o hebraico designa esse povo coletivamente no singular. A tradução preserva ambas as formas sem resolver além do texto.
- issue: Sentido de אֲנִי הוּא
  choice: eu sou ele
  alternative: eu sou; eu sou aquele
  rationale: A opção retém a concisão e o peso da autoidentificação hebraica, evitando tanto apagar o pronome quanto importar associações posteriores não explicitadas no versículo.
- issue: Afirmação sobre outros deuses
  choice: nenhum deus foi formado
  alternative: Deus não foi formado; nenhum ídolo foi fabricado
  rationale: “Deus” aqui é nome comum no singular e integra uma declaração de exclusividade divina. Traduzir por “ídolo” estreitaria indevidamente o alcance, enquanto usar maiúscula poderia sugerir que Yahweh foi formado.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para marcar claramente o plural do destinatário. A colocação de travessões em “declara Yahweh” mantém a fluidez da frase profética. “Nenhum deus” usa minúscula por se tratar do substantivo comum em contraste com Yahweh.
