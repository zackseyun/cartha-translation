  text: אָנֹכִ֞י הִגַּ֤דְתִּי וְ/הוֹשַׁ֨עְתִּי֙ וְ/הִשְׁמַ֔עְתִּי וְ/אֵ֥ין בָּ/כֶ֖ם זָ֑ר וְ/אַתֶּ֥ם עֵדַ֛/י נְאֻם יְהוָ֖ה וַֽ/אֲנִי אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/012.yaml
  text: I myself declared and saved and announced[a], and there was no foreign god among you; and you are my witnesses, declares Yahweh, and I am God.
translation:
  language: pt
  text: Eu mesmo anunciei, salvei e dei a conhecer; e não havia entre vocês nenhum deus estrangeiro.[a] Vocês são minhas testemunhas — declara Yahweh —, e eu sou Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não havia entre vocês nenhum estranho”. A palavra hebraica pode significar “estranho” ou “estrangeiro”, mas, neste contexto, provavelmente se refere a um deus estrangeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Eu mesmo
  rationale: O pronome independente é enfático; “Eu mesmo” preserva a ênfase sem acrescentar uma exclusividade que a forma, por si só, não explicita.
- source_word: הִגַּדְתִּי
  choice: anunciei
  rationale: O hifil de נגד significa declarar ou dar a conhecer. “Anunciei” é natural em português e mantém o tom solene.
- source_word: וְהוֹשַׁעְתִּי
  choice: salvei
  rationale: O hifil de ישׁע tem o sentido usual de salvar ou livrar; “salvei” é direto e conserva sua ressonância teológica.
- source_word: וְהִשְׁמַעְתִּי
  choice: fiz ouvir
  rationale: A tradução mais formal do hifil de שׁמע conserva a sequência verbal e a possível nuance causativa, evitando fundi-lo por completo com הִגַּדְתִּי.
- source_word: וְאֵין בָכֶם זָר
  choice: não havia entre vocês nenhum deus estrangeiro
  rationale: No contexto da atuação salvadora exclusiva de Yahweh e do testemunho de Israel, זָר provavelmente designa uma divindade estrangeira; “deus” explicita o referente implícito, enquanto a nota preserva a alternativa lexical.
- source_word: עֵדַי
  choice: minhas testemunhas
  rationale: 'O substantivo com sufixo de primeira pessoa é naturalmente possessivo: o povo é apresentado como testemunha de Yahweh.'
- source_word: נְאֻם יְהוָה
  choice: declaração de Yahweh
  rationale: A fórmula profética נְאֻם é nominal. “Declaração de Yahweh” preserva sua forma solene e funciona naturalmente como inciso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino representado pelo Tetragrama.
- source_word: וַאֲנִי אֵל
  choice: e eu sou Deus
  rationale: אֵל funciona aqui como título ou substantivo comum, “Deus”, e não exige transliteração como nome próprio; não se acrescenta “único”, ausente da cláusula.
theological_decisions:
- issue: Sentido de זָר em וְאֵין בָכֶם זָר
  choice: deus estrangeiro
  alternative: estranho ou estrangeiro
  rationale: O contexto contrasta a declaração e a salvação realizadas por Yahweh com possíveis divindades alheias. A leitura “deus estrangeiro” comunica melhor essa força, mas a nota mantém a ambiguidade lexical do hebraico.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O original emprega diretamente o Tetragrama; “Yahweh” conserva o nome da aliança sem substituí-lo por um título.
- issue: Força de וַאֲנִי אֵל
  choice: e eu sou Deus
  alternative: e eu sou o único Deus
  rationale: A afirmação é enfática no contexto, mas esta cláusula não contém uma palavra equivalente a “único”; a tradução evita tornar explícito o que permanece contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A coordenação concisa reproduz a solenidade da série hebraica. “Fiz ouvir” foi mantido por sua precisão causativa, apesar de ser um pouco mais formal; o inciso “declaração de Yahweh” preserva a fórmula profética nominal.
