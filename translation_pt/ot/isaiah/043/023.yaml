base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/023.yaml
  text: You have not brought me sheep for your burnt offerings[a], nor have you honored me with your sacrifices. I have not burdened you with grain offerings, nor wearied you with frankincense.
translation:
  language: pt
  text: Você não me trouxe animal do seu gado miúdo para os seus holocaustos, nem me honrou com os seus sacrifícios. Não sobrecarreguei você com ofertas de cereal[a], nem cansei você com olíbano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Não fiz você prestar serviço com ofertas de cereal”. A expressão hebraica pode transmitir a ideia de impor um serviço pesado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂה
  choice: animal do seu rebanho
  rationale: O termo pode designar uma unidade do gado miúdo, seja ovelha, seja cabra. A formulação evita restringi-lo indevidamente a uma ovelha ou a um cordeiro e permanece compreensível em português corrente.
- source_word: עֹלֹתֶיךָ
  choice: seus holocaustos
  rationale: עֹלָה é o termo sacrificial habitual para a oferta inteiramente queimada. “Holocaustos” é a designação cultual consagrada e concisa em português bíblico.
- source_word: זְבָחֶיךָ
  choice: seus sacrifícios
  rationale: זֶבַח designa amplamente um sacrifício, em especial uma oferta abatida. “Sacrifícios” comunica o sentido cultual com naturalidade.
- source_word: כִבַּדְתָּנִי
  choice: me honrou
  rationale: No piel, כבד significa normalmente “honrar”. A escolha exprime de modo direto que Israel não deu a Deus a honra devida por meio dos sacrifícios.
- source_word: הֶעֱבַדְתִּיךָ
  choice: sobrecarreguei você
  rationale: O hiphil de עבד pode significar “fazer servir” ou impor trabalho. Em paralelo com “cansei”, “sobrecarreguei” transmite a ideia contextual de serviço oneroso sem apagar a formulação mais literal, registrada em nota.
- source_word: מִנְחָה
  choice: ofertas de cereal
  rationale: Neste contexto sacrificial, מִנְחָה se refere especificamente à oferta de cereal, e não apenas a uma oferta genérica.
- source_word: הוֹגַעְתִּיךָ
  choice: cansei você
  rationale: O hiphil de יגע significa causar cansaço. A expressão é clara e conserva o paralelismo com “sobrecarreguei”.
- source_word: לְבוֹנָה
  choice: olíbano
  rationale: לְבוֹנָה designa especificamente o olíbano, resina aromática usada no culto, e não incenso em sentido genérico.
- source_word: לִי
  choice: me
  rationale: O dativo indica direção ou benefício. “Me trouxe” é a construção portuguesa natural e preserva adequadamente a relação expressa pela preposição.
theological_decisions:
- issue: Sentido da declaração de Deus sobre o serviço sacrificial
  choice: Deus afirma que não sobrecarregou Israel com um serviço ritual opressivo.
  alternative: Deus afirma que nunca exigiu ofertas; ou apenas contrasta exigências leves com a falta de honra demonstrada por Israel.
  rationale: 'O paralelismo entre “sobrecarreguei” e “cansei” sugere uma censura retórica: Israel negligenciou Deus, embora ele não lhe tenha imposto um culto opressivo. A tradução não transforma a frase numa negação geral da legitimidade das ofertas e preserva a tensão do texto.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para o singular hebraico e mantém termos cultuais reconhecíveis. “Olíbano” preserva a especificidade lexical; “animal do seu rebanho” mantém a abrangência de שֵׂה, que pode indicar ovelha ou cabra.
