  text: אָנֹכִ֥י אָנֹכִ֖י יְהוָ֑ה וְ/אֵ֥ין מִ/בַּלְעָדַ֖/י מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/011.yaml
  text: I[a], I am Yahweh, and besides me there is no savior.
translation:
  language: pt
  text: Eu, eu sou Yahweh, e além de mim não há salvador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fora de mim não há quem salve”.'
    reason: Alternativa lexical que explicita o valor participial de מוֹשִׁיעַ e outra tradução natural de מִבַּלְעָדַי.
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: Eu, eu sou
  rationale: A repetição do pronome independente é enfática. A formulação preserva tanto a repetição quanto sua força, de modo natural e solene em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְאֵין
  choice: e ... não há
  rationale: אֵין expressa inexistência; “não há” é a forma idiomática e direta em português.
- source_word: מִבַּלְעָדַי
  choice: além de mim
  rationale: Comunica a exclusividade da expressão hebraica de maneira concisa. “Fora de mim” também é uma tradução possível.
- source_word: מוֹשִׁיעַ
  choice: salvador
  rationale: O particípio hifil de ישׁע designa aquele que salva ou livra; “salvador” preserva o sentido substantivado e a abrangência da afirmação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Exclusividade da salvação
  choice: além de mim não há salvador
  alternative: fora de mim não há salvador
  rationale: A tradução mantém sem atenuação a afirmação exclusiva do hebraico, sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática do hebraico foi mantida; a ordem da frase conserva sua solenidade e concisão.
