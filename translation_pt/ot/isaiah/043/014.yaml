  naturalness: O registro é claro e solenemente moderno. “Em seus navios de júbilo” é mais idiomático e conserva a imagem poética sem transformar o júbilo em lamento ou em mero orgulho.
  terminology: “Yahweh”, “Redentor” e “o Santo de Israel” são escolhas consistentes e apropriadas. “Por amor de vocês” comunica bem o valor benefactivo de לְמַעַנְכֶם.
