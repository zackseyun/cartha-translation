source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה גֹּאַלְ/כֶ֖ם קְד֣וֹשׁ יִשְׂרָאֵ֑ל לְמַעַנְ/כֶ֞ם שִׁלַּ֣חְתִּי בָבֶ֗לָ/ה וְ/הוֹרַדְתִּ֤י בָֽ/רִיחִים֙ כֻּלָּ֔/ם וְ/כַשְׂדִּ֖ים בָּ/אֳנִיּ֥וֹת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/014.yaml
  text: 'Thus says Yahweh[a], your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon and brought them all down as fugitives, even the Chaldeans[b], in the ships of their rejoicing.'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Redentor de vocês, o Santo de Israel:


    “Por amor de vocês, enviei à Babilônia[a]

    e fiz todos eles descer como fugitivos[b],

    inclusive os caldeus, em seus navios de júbilo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enviei contra a Babilônia”. O hebraico diz literalmente “enviei à Babilônia” e não declara quem ou o que foi enviado.'
    reason: alternative_reading
  - marker: b
    text: 'Termo hebraico de sentido incerto. Também pode ser traduzido: “e fiz todos eles descer como ferrolhos” ou “como barras”; com menor probabilidade, pode referir-se a “nobres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: גֹּאַלְכֶם
  choice: o Redentor de vocês
  rationale: Preserva a força de libertação e restauração de גאל em Isaías; “de vocês” comunica de modo claro o plural do sufixo hebraico.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Mantém o título recorrente e solene característico de Isaías.
- source_word: לְמַעַנְכֶם
  choice: Por amor de vocês
  rationale: Expressa naturalmente que a ação é realizada em benefício do povo, sem sugerir que eles sejam a causa culpável da ação.
- source_word: שִׁלַּחְתִּי בָבֶלָה
  choice: enviei à Babilônia
  rationale: Conserva a direção indicada pelo hebraico, inclusive o objeto não expresso do verbo; a possível leitura “enviei contra a Babilônia” fica registrada em nota.
- source_word: וְהוֹרַדְתִּי
  choice: e fiz ... descerem
  rationale: Representa o sentido causativo da forma hifil de ירד sem decidir se a descida é física, política ou metafórica.
- source_word: בָרִיחִים
  choice: como fugitivos
  rationale: Adota a leitura contextual ligada à fuga, mas reconhece em nota a dificuldade lexical e a importante alternativa “ferrolhos” ou “barras”.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Mantém a abrangência total da expressão hebraica.
- source_word: וְכַשְׂדִּים
  choice: até os caldeus
  rationale: 'Entende a conjunção com valor enfático ou explicativo: os próprios caldeus estão incluídos entre os que são humilhados.'
- source_word: בָּאֳנִיּוֹת רִנָּתָם
  choice: nos navios dos seus gritos de alegria
  rationale: Mantém a imagem compacta e a associação entre os navios e o clamor jubiloso dos caldeus, sem substituir a alegria por “orgulho” ou transformar o clamor em lamento.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio sem importar uma substituição confessional.
- issue: Sentido do termo difícil בָרִיחִים
  choice: como fugitivos
  alternative: como ferrolhos/barras; como nobres
  rationale: A leitura relacionada à fuga produz sentido coerente no anúncio da queda babilônica, mas a incerteza lexical é genuína e, por isso, a principal alternativa é explicitada em nota.
- issue: Objeto implícito de שִׁלַּחְתִּי
  choice: 'manter o objeto não expresso: “enviei à Babilônia”'
  alternative: enviei contra a Babilônia
  rationale: A forma בָבֶלָה indica movimento em direção à Babilônia, enquanto o agente ou objeto enviado permanece implícito; a tradução evita identificá-lo sem apoio explícito.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com “vocês” para tornar inequívoco o plural hebraico. A construção incomum “enviei à Babilônia” é mantida deliberadamente para não preencher o objeto omitido na fonte. A disposição em linhas acompanha o caráter poético do oráculo.
