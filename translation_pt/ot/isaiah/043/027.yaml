base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/027.yaml
  text: Your first father sinned[b][a], and your spokesmen rebelled against me.
translation:
  language: pt
  text: Seu primeiro pai pecou[a], e seus porta-vozes[b] se rebelaram contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu ancestral mais antigo pecou”. A expressão não identifica especificamente esse ancestral.'
    reason: lexical_alternative
  - marker: b
    text: “Porta-vozes” também pode ser traduzido por “intérpretes” ou “mediadores”; o termo hebraico pode designar representantes que falam em nome de outros.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיךָ הָרִאשׁוֹן
  choice: seu primeiro pai
  rationale: Reproduz diretamente a imagem hebraica e mantém em aberto se a expressão aponta para Adão, Jacó ou outro ancestral representativo de Israel.
- source_word: חָטָא
  choice: pecou
  rationale: É a tradução natural e consagrada do verbo neste contexto moral e religioso.
- source_word: מְלִיצֶיךָ
  choice: seus porta-vozes
  rationale: Expressa a ideia de representantes que falam em nome do povo sem restringir o termo a intérpretes linguísticos ou a mediadores sacerdotais.
- source_word: פָּשְׁעוּ
  choice: se rebelaram
  rationale: Preserva a força deliberada e relacional de פשע, mais intensa que a noção genérica de cometer um pecado.
- source_word: בִי
  choice: contra mim
  rationale: Com פשע, a preposição indica o alvo da rebelião; esta é a formulação idiomática em português.
theological_decisions:
- issue: Identidade do “primeiro pai”
  choice: Manter a designação genérica, sem identificar a pessoa.
  alternative: Explicitar Adão, Abraão ou Jacó.
  rationale: O hebraico não nomeia o ancestral, e a tradução deve conservar essa ambiguidade interpretativa.
- issue: Função dos מְלִיצֶיךָ
  choice: porta-vozes
  alternative: intérpretes ou mediadores
  rationale: “Porta-vozes” preserva o sentido representativo amplo sem impor uma função linguística ou sacerdotal específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A ordem e o paralelismo do hebraico foram preservados, assim como a distinção entre “pecou” e a forma mais forte “se rebelaram”.
