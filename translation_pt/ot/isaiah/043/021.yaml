  text: This people I formed for myself[a]; they will declare my praise.
translation:
  language: pt
  text: Este povo formei para mim; eles proclamarão o meu louvor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַם
  choice: povo
  rationale: “Povo” traduz naturalmente o grupo humano em vista, preservando o sentido coletivo e pactual sem sugerir necessariamente um Estado-nação moderno.
- source_word: זוּ
  choice: este
  rationale: O demonstrativo retoma de modo direto o povo mencionado no contexto; “este” conserva sua força proximal.
- source_word: יָצַרְתִּי
  choice: formei
  rationale: O verbo יצר comunica formar ou modelar intencionalmente. “Formei” preserva essa nuance de modo claro e digno.
- source_word: לִי
  choice: para mim
  rationale: A preposição com sufixo de primeira pessoa expressa relação e propósito. “Para mim” é direta e natural em português, sem ampliar indevidamente o hebraico.
- source_word: תְּהִלָּתִי
  choice: o meu louvor
  rationale: תְּהִלָּה designa louvor; o sufixo indica que esse louvor pertence a Deus ou lhe é dirigido. “O meu louvor” conserva a formulação concisa do original.
- source_word: יְסַפֵּרוּ
  choice: proclamarão
  rationale: No piel, ספר pode significar contar, relatar ou declarar. “Proclamarão” combina naturalmente com “louvor” e mantém o registro profético elevado.
theological_decisions:
- issue: Nuance de propósito ou resultado na segunda oração
  choice: 'Manter duas orações coordenadas por ponto e vírgula: “eles proclamarão o meu louvor”'
  alternative: “para que proclamassem o meu louvor”
  rationale: O hebraico não apresenta uma conjunção final explícita. O futuro após a declaração da formação do povo permite perceber propósito ou resultado sem tornar essa relação mais explícita do que no texto-fonte.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A formulação mantém a concisão e o paralelismo do hebraico.
