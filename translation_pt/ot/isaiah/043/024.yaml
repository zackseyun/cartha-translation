  text: לֹא קָנִ֨יתָ לִּ֤/י בַ/כֶּ֨סֶף֙ קָנֶ֔ה וְ/חֵ֥לֶב זְבָחֶ֖י/ךָ לֹ֣א הִרְוִיתָ֑/נִי אַ֗ךְ הֶעֱבַדְתַּ֨/נִי֙ בְּ/חַטֹּאותֶ֔י/ךָ הוֹגַעְתַּ֖/נִי בַּ/עֲוֺנֹתֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/024.yaml
  text: You did not buy me sweet cane with silver[a], or satisfy me with the fat of your sacrifices; instead, you burdened me with your sins[b]; you wearied me with your iniquities.
translation:
  language: pt
  text: Você não comprou para mim cana aromática com prata[a], nem me satisfez com a gordura dos seus sacrifícios. Em vez disso, você me sobrecarregou com os seus pecados[b] e me cansou com as suas iniquidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cálamo” ou “cana perfumada”. O termo hebraico designa uma cana fragrante e valiosa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “você me fez servir com os seus pecados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ לִּי בַכֶּסֶף קָנֶה
  choice: comprou para mim cana aromática com prata
  rationale: O verbo קנה, junto de בַכֶּסֶף, tem sentido comercial de comprar. 'Cana aromática' comunica de modo claro o referente provável de קָנֶה, uma cana fragrante e valiosa, sem depender do termo técnico menos conhecido 'cálamo'.
- source_word: חֵלֶב זְבָחֶיךָ
  choice: a gordura dos seus sacrifícios
  rationale: Mantém o sentido concreto de חֵלֶב e a imagem cultual das porções de gordura oferecidas nos sacrifícios.
- source_word: הִרְוִיתָנִי
  choice: me satisfez
  rationale: O hifil de רוה expressa fazer ficar saciado ou plenamente provido; no contexto sacrificial, 'satisfazer' preserva a linguagem figurada sem explicá-la em excesso.
- source_word: אַךְ
  choice: Em vez disso
  rationale: Marca o forte contraste entre aquilo que Israel não ofereceu e o que, ao contrário, fez a Deus por meio de seus pecados.
- source_word: הֶעֱבַדְתַּנִי
  choice: você me fez servir
  rationale: Reproduz de perto o hifil de עבד, 'fazer servir/trabalhar', e conserva a inversão deliberadamente surpreendente da imagem hebraica.
- source_word: בְּחַטֹּאותֶיךָ
  choice: com os seus pecados
  rationale: A preposição indica meio ou instrumento; a formulação é natural em português e mantém a ligação direta dos pecados com o serviço imposto.
- source_word: הוֹגַעְתַּנִי
  choice: me cansou
  rationale: O hifil de יגע significa causar cansaço. 'Me cansou' é atual, claro e preserva a personificação antropomórfica.
- source_word: בַּעֲוֺנֹתֶיךָ
  choice: com as suas iniquidades
  rationale: '''Iniquidades'' preserva o peso moral de עָוֹן e o distingue de חטאות, traduzido como ''pecados''.'
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus ser satisfeito, posto a servir e cansado
  choice: Manter as expressões 'me satisfez', 'me fez servir' e 'me cansou' sem suavização doutrinária.
  alternative: Parafrasear como 'não me honrou' e 'me ofendeu com seus pecados'.
  rationale: O hebraico apresenta deliberadamente Deus como afetado pelas ofertas omitidas e pelas transgressões de Israel. A tradução conserva essa tensão e a inversão retórica, sem convertê-las em abstrações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução segue uma equivalência ótima, preservando as imagens sacrificiais e a forte linguagem antropomórfica do hebraico. O marcador [b] acompanha a formulação literal no texto e registra em nota sua natureza idiomática e enfática.
