  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תְּכַבְּדֵ֨/נִי֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה תַּנִּ֖ים וּ/בְנ֣וֹת יַֽעֲנָ֑ה כִּֽי נָתַ֨תִּי בַ/מִּדְבָּ֜ר מַ֗יִם נְהָרוֹת֙ בִּֽ/ישִׁימֹ֔ן לְ/הַשְׁק֖וֹת עַמִּ֥/י בְחִירִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/020.yaml
  text: The beasts of the field will honor me[a], jackals and ostriches, because I give water in the wilderness, rivers in the wasteland, to give drink to my people[c][b], my chosen ones.
translation:
  language: pt
  text: Os animais selvagens me honrarão — os chacais e os avestruzes —, pois ponho água no deserto e rios na terra árida, para dar de beber ao meu povo, o meu escolhido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu povo escolhido”. O hebraico diz literalmente “meu povo, meu escolhido”, usando o singular para se referir coletivamente a Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַבְּדֵנִי
  choice: me honrarão
  rationale: O piel de כבד significa “honrar” ou “glorificar”. “Honrarão” é natural em português e preserva a ideia de reconhecer o valor e a grandeza de Deus.
- source_word: חַיַּת הַשָּׂדֶה
  choice: os animais selvagens
  rationale: A expressão designa os animais que vivem fora do espaço domesticado. Esta forma é mais corrente e clara em português moderno do que “animais do campo” ou “feras do campo”.
- source_word: תַּנִּים
  choice: os chacais
  rationale: No paralelismo da fauna do deserto, o termo provavelmente se refere a chacais, não aos “dragões” da tradição antiga.
- source_word: בְנוֹת יַעֲנָה
  choice: os avestruzes
  rationale: Literalmente “filhas do avestruz”, expressão idiomática que designa avestruzes. A tradução direta do referente é natural em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual os animais honram a Deus e mantém um tom poético e digno.
- source_word: נָתַתִּי
  choice: ponho
  rationale: Embora a forma hebraica seja perfeita, no contexto profético apresenta a ação divina como certa e vívida. O presente português conserva essa imediatez.
- source_word: בַמִּדְבָּר מַיִם
  choice: água no deserto
  rationale: “Deserto” comunica com clareza a região árida e desabitada evocada neste contexto.
- source_word: נְהָרוֹת בִּישִׁימוֹן
  choice: rios na terra árida
  rationale: ישימון indica uma região desolada ou estéril. “Terra árida” é clara, evita repetir “deserto” e mantém o paralelismo.
- source_word: לְהַשְׁקוֹת
  choice: para dar de beber
  rationale: Expressa naturalmente em português a finalidade concreta da provisão de água para o povo.
- source_word: עַמִּי בְחִירִי
  choice: ao meu povo, o meu escolhido
  rationale: Preserva a justaposição hebraica entre o substantivo coletivo “meu povo” e o qualificativo masculino singular “meu escolhido”.
theological_decisions:
- issue: Singular coletivo de בְחִירִי em referência a Israel
  choice: o meu povo, o meu escolhido
  alternative: o meu povo escolhido; os meus escolhidos
  rationale: O hebraico usa בְחִירִי no singular em aposição a עַמִּי, um substantivo coletivo também formalmente singular. Manter “o meu escolhido” preserva a gramática e a personificação corporativa de Israel, sem transformar silenciosamente o termo em plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões destacam a aposição dos dois grupos de animais sem alterar a relação sintática. A nota preserva a tensão entre a forma singular hebraica e o referente coletivo.
