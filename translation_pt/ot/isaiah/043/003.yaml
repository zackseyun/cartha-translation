id: ISA.43.3
reference: Isaiah 43:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֗י אֲנִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ קְד֥וֹשׁ יִשְׂרָאֵ֖ל מוֹשִׁיעֶ֑/ךָ נָתַ֤תִּי כָפְרְ/ךָ֙ מִצְרַ֔יִם כּ֥וּשׁ וּ/סְבָ֖א תַּחְתֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/003.yaml
  text: For I am Yahweh your God[a], the Holy One of Israel, your Savior; I have given Egypt as your ransom[b], Cush and Seba in exchange for you.
translation:
  language: pt
  text: Pois eu sou Yahweh, seu Deus, o Santo de Israel, seu Salvador. Dei o Egito como resgate por você, Cuxe[a] e Sebá em seu lugar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cuxe era uma antiga região ao sul do Egito, geralmente associada à Núbia e à Etiópia.
    reason: cultural_note
  - marker: b
    text: 'Ou: “em troca de você”. A expressão hebraica indica substituição ou troca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração de consolo no contexto anterior e mantém clara a ligação explicativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal e sua força pactual, seguindo a forma transliterada adotada pelo projeto.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz de modo natural o substantivo com sufixo masculino singular de segunda pessoa.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Mantém o conhecido título isaiano, com formulação digna e corrente em português.
- source_word: מוֹשִׁיעֶךָ
  choice: seu Salvador
  rationale: O particípio substantivado caracteriza Yahweh como aquele que salva, e o possessivo conserva a relação pessoal expressa pelo sufixo.
- source_word: נָתַתִּי
  choice: Dei
  rationale: O perfeito hebraico apresenta a ação divina como completa; o pretérito perfeito é direto e natural em português.
- source_word: כָפְרְךָ
  choice: como resgate por você
  rationale: כֹּפֶר indica aqui o preço compensatório dado pela preservação de alguém. A expressão conserva a imagem de resgate sem introduzir uma noção cultual de expiação.
- source_word: מִצְרַיִם
  choice: Egito
  rationale: É a forma portuguesa estabelecida do nome geográfico.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Translitera o nome da antiga região sem identificá-la de maneira anacrônica com um Estado moderno.
- source_word: סְבָא
  choice: Sebá
  rationale: Forma transliterada clara em português, distinta de Sabá.
- source_word: תַּחְתֶּיךָ
  choice: em seu lugar
  rationale: Expressa com naturalidade a ideia hebraica de substituição; a alternativa de troca é registrada em nota para preservar a amplitude semântica.
theological_decisions:
- issue: Sentido da entrega do Egito, de Cuxe e de Sebá em favor de Israel
  choice: A linguagem descreve nações dadas por Deus como resgate ou substituição em favor da preservação de Israel.
  alternative: A expressão pode ser entendida de modo mais amplo como compensação política, sem enfatizar a imagem de resgate.
  rationale: O contexto imediato trata da libertação e proteção nacional de Israel. A tradução mantém a forte linguagem de resgate e substituição do hebraico, sem impor ao texto uma teoria posterior de expiação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “seu/você” para a segunda pessoa masculina singular e conserva os títulos divinos em formulação reconhecível. Os marcadores foram posicionados junto aos termos a que as notas efetivamente se referem.
