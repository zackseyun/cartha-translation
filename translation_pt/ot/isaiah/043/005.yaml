  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַל תִּירָ֖א כִּ֣י אִתְּ/ךָ אָ֑נִי מִ/מִּזְרָח֙ אָבִ֣יא זַרְעֶ֔/ךָ וּ/מִֽ/מַּעֲרָ֖ב אֲקַבְּצֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/005.yaml
  text: Do not fear[a], for I am with you; from the east I will bring your offspring[b], and from the west I will gather you.
translation:
  language: pt
  text: Não tenha medo, pois eu estou com você; do leste trarei a sua descendência[a], e do oeste reunirei você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega um substantivo coletivo no singular; também pode ser traduzido por “seus descendentes”.
    reason: lexical_alternative
  - marker: b
    text: O singular “você” se dirige coletivamente a Jacó/Israel.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: A partícula negativa com o imperfeito de ירא forma uma proibição. Esta expressão é natural em português atual e mantém a força direta do hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para não temer e preserva de modo claro a ligação explicativa.
- source_word: אִתְּךָ אָנִי
  choice: eu estou com você
  rationale: Expressa diretamente a presença divina; o pronome explícito ajuda a refletir a ênfase da ordem hebraica sem tornar a frase artificial.
- source_word: מִמִּזְרָח
  choice: do leste
  rationale: Embora o substantivo se relacione etimologicamente ao nascer do sol, aqui designa de modo idiomático a direção leste.
- source_word: אָבִיא
  choice: trarei
  rationale: O hifil de בוא significa fazer vir ou trazer. 'Trarei' é natural e não acrescenta a ideia de retorno, que não está explicitamente presente no verbo.
- source_word: זַרְעֶךָ
  choice: a sua descendência
  rationale: זֶרַע é um singular coletivo que pode indicar os descendentes. 'Descendência' preserva esse caráter coletivo e é digna e compreensível em português moderno.
- source_word: וּמִמַּעֲרָב
  choice: e do oeste
  rationale: É o correspondente geográfico de 'do leste'; 'oeste' comunica naturalmente o sentido contextual.
- source_word: אֲקַבְּצֶךָּ
  choice: reunirei você
  rationale: O piel de קבץ significa reunir ou ajuntar. A formulação mantém o objeto na segunda pessoa do singular, como no hebraico, embora Israel seja o referente coletivo.
theological_decisions:
- issue: Referente dos pronomes de segunda pessoa do singular
  choice: Manter 'você' no singular e explicar seu sentido coletivo em nota.
  alternative: Empregar uma forma plural, como 'vocês', ou explicitar 'seu povo'.
  rationale: O hebraico se dirige a Jacó/Israel como uma unidade coletiva no singular. Preservar o singular conserva o estilo profético e evita inserir uma expansão interpretativa no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A tradução conserva o paralelismo entre leste e oeste e a alternância entre 'descendência' e o destinatário coletivo singular.
