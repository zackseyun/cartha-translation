reference: Isaiah 43:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּֽל הַ/גּוֹיִ֞ם נִקְבְּצ֣וּ יַחְדָּ֗ו וְ/יֵאָֽסְפוּ֙ לְאֻמִּ֔ים מִ֤י בָ/הֶם֙ יַגִּ֣יד זֹ֔את וְ/רִֽאשֹׁנ֖וֹת יַשְׁמִיעֻ֑/נוּ יִתְּנ֤וּ עֵֽדֵי/הֶם֙ וְ/יִצְדָּ֔קוּ וְ/יִשְׁמְע֖וּ וְ/יֹאמְר֥וּ אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/009.yaml
  text: Let all the nations be gathered together[a], and let the peoples be assembled. Who among them can declare this and make the former things heard? Let them present their witnesses, that they may be justified; and let them hear and say[b], “It is true.”
translation:
  language: pt
  text: 'Que todas as nações se reúnam juntas, e que os povos se congreguem. Quem entre eles pode anunciar isto e nos fazer ouvir as coisas passadas[a]? Que apresentem suas testemunhas, para que se prove que têm razão[b]; que ouçam e digam: “É verdade”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as primeiras coisas”. Em Isaías, a expressão pode se referir a acontecimentos anteriores ou a declarações prévias que demonstram a soberania do SENHOR.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que sejam declarados justos” ou “para que se reconheça que estão com a razão”. O verbo hebraico tem sentido forense nesta cena de tribunal.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: גּוֹיִם designa aqui as nações do mundo reunidas na cena judicial, não especificamente os gentios em contraste com Israel.
- source_word: נִקְבְּצוּ יַחְדָּו
  choice: reúnam-se
  rationale: O nifal de קבץ expressa a reunião conjunta; a forma pronominal portuguesa transmite com naturalidade o sentido passivo-reflexivo e a ideia de יַחְדָּו.
- source_word: וְיֵאָסְפוּ לְאֻמִּים
  choice: e congreguem-se os povos
  rationale: Mantém o paralelismo com a primeira oração e distingue לְאֻמִּים, “povos”, de גּוֹיִם, “nações”.
- source_word: יַגִּיד זֹאת
  choice: pode anunciar isto
  rationale: O hifil de נגד tem o sentido de anunciar ou declarar; “pode” explicita em português o desafio retórico da pergunta.
- source_word: וְרִאשֹׁנוֹת יַשְׁמִיעֻנוּ
  choice: e nos fazer ouvir as coisas passadas
  rationale: Preserva tanto o sentido causativo de שמע no hifil quanto o sufixo de primeira pessoa plural, “nos”, presente em יַשְׁמִיעֻנוּ. “Coisas passadas” mantém aberta a referência a atos anteriores ou declarações prévias.
- source_word: יִתְּנוּ עֵדֵיהֶם
  choice: Que apresentem suas testemunhas
  rationale: Na cena de tribunal, נתן com “testemunhas” significa apresentá-las ou trazê-las como prova.
- source_word: וְיִצְדָּקוּ
  choice: para que se prove que têm razão
  rationale: 'Comunica o valor forense de צדק nesta disputa: ser reconhecido ou demonstrado como estando com a razão, sem recorrer desnecessariamente a terminologia doutrinária técnica.'
- source_word: וְיִשְׁמְעוּ וְיֹאמְרוּ אֱמֶת
  choice: 'que ouçam e digam: “É verdade”'
  rationale: Mantém a sequência exortativa e verte אֱמֶת de modo predicativo e idiomático em português.
theological_decisions:
- issue: Imagem forense no desafio dirigido às nações
  choice: Expressar o versículo como convocação judicial e desafio probatório, traduzindo וְיִצְדָּקוּ como “para que se prove que têm razão”.
  alternative: “para que sejam justificados” ou “para que sejam declarados justos”
  rationale: O contexto é uma controvérsia judicial entre o SENHOR e as nações e seus deuses. A formulação escolhida preserva esse sentido jurídico sem introduzir uma acepção técnica posterior de justificação.
- issue: Referente de “as coisas passadas”
  choice: Conservar a expressão ampla “as coisas passadas”.
  alternative: “as primeiras coisas” ou uma explicitação como “as antigas predições”
  rationale: רִאשֹׁנוֹת pode aludir a acontecimentos anteriores, anúncios prévios ou ambos; a tradução não resolve uma ambiguidade que o hebraico mantém.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Reúnam-se” e “congreguem-se” preservam o paralelismo sem soar excessivamente arcaicos. O sufixo hebraico de primeira pessoa plural em יַשְׁמִיעֻנוּ foi explicitamente mantido em “nos fazer ouvir”.
