base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/018.yaml
  text: Do not remember the former things[a], and do not consider the things of old.
translation:
  language: pt
  text: Não se lembrem das coisas passadas[a], nem reflitam sobre as coisas de tempos antigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das primeiras coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּזְכְּרוּ
  choice: Não se lembrem
  rationale: A partícula negativa אַל com a forma verbal seguinte expressa proibição. “Não se lembrem” preserva a força direta e o valor básico de זכר.
- source_word: רִאשֹׁנוֹת
  choice: das coisas passadas
  rationale: O substantivo adjetival plural designa coisas ou acontecimentos anteriores. “Coisas passadas” é natural em português e mantém o provável contraste com a “coisa nova” do versículo seguinte.
- source_word: וְ ... אַל
  choice: nem
  rationale: No paralelismo negativo, “nem” liga naturalmente as duas proibições em português, correspondendo ao hebraico וְ seguido de אַל.
- source_word: קַדְמֹנִיּוֹת
  choice: as coisas de tempos antigos
  rationale: A expressão aponta para coisas antigas ou de outrora. A formulação preserva a distinção poética em relação a רִאשֹׁנוֹת sem soar arcaica demais.
- source_word: תִּתְבֹּנָנוּ
  choice: reflitam sobre
  rationale: A forma verbal de בין comunica consideração atenta ou reflexão. “Reflitam sobre” expressa esse foco mental melhor do que um simples “considerem” neste contexto.
