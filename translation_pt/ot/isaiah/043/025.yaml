  text: אָנֹכִ֨י אָנֹכִ֥י ה֛וּא מֹחֶ֥ה פְשָׁעֶ֖י/ךָ לְמַעֲנִ֑/י וְ/חַטֹּאתֶ֖י/ךָ לֹ֥א אֶזְכֹּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/025.yaml
  text: I[a], I am he who blots out your transgressions for my own sake[c][b], and your sins I will not remember.
translation:
  language: pt
  text: Eu, eu mesmo, sou aquele que apaga suas transgressões por minha própria causa e não me lembrarei dos seus pecados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «não me lembrarei» significa que Deus não os terá em conta contra o seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: Eu, eu mesmo, sou aquele
  rationale: A repetição do pronome é enfática, e הוּא reforça a autoidentificação divina. Esta formulação preserva a ênfase e soa natural em português.
- source_word: מֹחֶה
  choice: apaga
  rationale: O particípio de מחה comunica a imagem de eliminar ou apagar algo escrito; «apaga» mantém a metáfora com clareza e naturalidade.
- source_word: פְשָׁעֶיךָ
  choice: suas transgressões
  rationale: פשע designa violações graves, frequentemente com a nuance de rebelião; «transgressões» preserva sua força moral e sua distinção de «pecados».
- source_word: לְמַעֲנִי
  choice: por amor de mim
  rationale: A expressão fundamenta a ação no próprio Deus, em seus propósitos e em seu nome; «por amor de mim» é uma formulação corrente e digna em português.
- source_word: וְחַטֹּאתֶיךָ
  choice: e ... dos seus pecados
  rationale: חטאות é o termo comum para pecados. A escolha preserva o paralelismo sem apagar a distinção lexical em relação a פשעים.
- source_word: לֹא אֶזְכֹּר
  choice: não me lembrarei
  rationale: Traduz diretamente o imperfeito hebraico como resolução futura, sem explicar dentro do texto todas as implicações judiciais ou relacionais do não recordar.
theological_decisions:
- issue: Fundamento divino do perdão
  choice: «por amor de mim», apresentando o perdão como fundado no próprio Deus e em seus propósitos
  alternative: Apresentar o perdão como motivado principalmente pelo arrependimento ou mérito humano
  rationale: O hebraico לְמַעֲנִי declara explicitamente a motivação divina e não menciona neste versículo mérito ou condição humana.
- issue: Deus não se lembrar dos pecados
  choice: Manter a linguagem direta «não me lembrarei», com nota que esclarece seu sentido relacional e judicial
  alternative: Parafrasear no texto como «não os levarei em conta contra vocês»
  rationale: A tradução direta preserva a imagem e a tensão da linguagem bíblica, enquanto a nota evita que seja entendida simplesmente como falha de memória.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição enfática do hebraico foi preservada por «Eu, eu mesmo»; evitou-se vocabulário excessivamente arcaico. O marcador [a] aparece no texto principal e corresponde à nota.
