  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/נּוֹתֵ֥ן בַּ/יָּ֖ם דָּ֑רֶךְ וּ/בְ/מַ֥יִם עַזִּ֖ים נְתִיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/016.yaml
  text: 'Thus says Yahweh[a], who makes a way in the sea and a path in the mighty waters:'
translation:
  language: pt
  text: 'Assim diz Yahweh, que faz um caminho no mar e uma vereda em águas poderosas:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Reproduz de modo natural e digno a fórmula profética de mensageiro, usando o presente convencional em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הַנּוֹתֵן
  choice: que abre
  rationale: Embora o particípio signifique literalmente 'que dá/põe', 'abre' forma uma colocação portuguesa natural com 'caminho' e comunica, sem explicação excessiva, a criação de uma passagem no contexto alusivo ao êxodo.
- source_word: בַּיָּם
  choice: no mar
  rationale: Mantém o sentido mais direto da preposição בְּ, 'em/no', preservando a imagem hebraica sem explicitar necessariamente movimento através do mar.
- source_word: דָּרֶךְ
  choice: um caminho
  rationale: Equivalente corrente que preserva tanto a imagem concreta quanto suas possíveis ressonâncias metafóricas.
- source_word: וּבְמַיִם עַזִּים
  choice: e uma vereda em águas poderosas
  rationale: Traduz עַזִּים por 'poderosas', sem especificar indevidamente que sejam 'revoltas'; a estrutura mantém o paralelismo poético.
- source_word: נְתִיבָה
  choice: uma vereda
  rationale: Distingue este termo de דָּרֶךְ e conserva o paralelismo por meio de um sinônimo natural e de registro digno.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio divino. A transliteração 'Yahweh' preserva essa condição e evita substituí-lo por um título.
- issue: Possível alusão à travessia do mar no êxodo
  choice: Preservar a imagem sem identificar explicitamente o episódio
  alternative: Expandir como 'que abriu um caminho através do mar'
  rationale: O contexto evoca o êxodo, mas o versículo formula a ação de modo poético e participial; a tradução não acrescenta uma identificação ausente do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação mantém dignidade profética e paralelismo poético, sem arcaísmos desnecessários. Não se acrescenta nota para 'através', pois em português 'no mar' e 'em águas poderosas' são naturais e refletem diretamente a preposição hebraica.
