  text: הַ/מּוֹצִ֥יא רֶֽכֶב וָ/ס֖וּס חַ֣יִל וְ/עִזּ֑וּז יַחְדָּ֤ו יִשְׁכְּבוּ֙ בַּל יָק֔וּמוּ דָּעֲכ֖וּ כַּ/פִּשְׁתָּ֥ה כָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/017.yaml
  text: who brings out chariot and horse[a], army and mighty one together; they lie down, they do not rise; they are extinguished, quenched like flax.
translation:
  language: pt
  text: que faz sair carros de guerra e cavalos, exército e poderosos juntos; eles jazem e não se levantam; apagaram-se, extinguiram-se como o linho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma mecha de linho”. O hebraico diz literalmente “como o linho”, evocando algo que se apaga com facilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: que faz sair
  rationale: Preserva o valor causativo do particípio hifil e sua função relativa no contexto, sem limitar a ação a um passado simples.
- source_word: רֶכֶב וָסוּס
  choice: carros de guerra e cavalos
  rationale: Os singulares hebraicos têm sentido coletivo; o plural é mais natural em português, e 'carros de guerra' explicita o sentido militar de רֶכֶב.
- source_word: חַיִל וְעִזּוּז
  choice: exército e poderosos
  rationale: חַיִל designa a força militar; עִזּוּז é mantido como substantivo pessoal genérico, sem acrescentar 'guerreiros', ausente do hebraico.
- source_word: יַחְדָּו יִשְׁכְּבוּ בַּל יָקוּמוּ
  choice: juntos; eles jazem e não se levantam
  rationale: '''Jazem'' conserva a imagem de estarem deitados e sugere, pelo contexto, a derrota mortal; o presente vívido preserva a tensão aspectual da poesia.'
- source_word: דָּעֲכוּ ... כָבוּ
  choice: apagam-se, extinguem-se
  rationale: Os dois verbos pertencem ao campo semântico de uma chama que se apaga; a dupla formulação mantém o paralelismo e a imagem do fogo.
- source_word: כַּפִּשְׁתָּה
  choice: como o linho
  rationale: Tradução direta de פִּשְׁתָּה; a possível imagem específica de uma mecha fica em nota para não tornar explícito o que o hebraico deixa implícito.
theological_decisions:
- issue: Apresentação temporal da ação do SENHOR e da derrota dos inimigos
  choice: 'Presente vívido: ''faz sair... jazem... não se levantam'''
  alternative: Passado simples, destacando exclusivamente o acontecimento do êxodo
  rationale: A construção hebraica permite uma descrição poética vívida que alude ao êxodo sem resolver se a afirmação é apenas retrospectiva ou também caracteriza a ação de Deus.
- issue: Identidade das forças derrotadas
  choice: Manter as designações militares genéricas do hebraico
  alternative: Identificá-las explicitamente como o exército do faraó ou os egípcios
  rationale: O contexto evoca fortemente o êxodo, mas este versículo não nomeia o Egito nem o faraó; a tradução preserva a alusão sem acrescentar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Jazem' mantém o tom poético sem arcaísmo excessivo; 'carros de guerra' evita a ambiguidade moderna de 'carros'.
