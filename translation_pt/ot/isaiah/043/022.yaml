  text: וְ/לֹא אֹתִ֥/י קָרָ֖אתָ יַֽעֲקֹ֑ב כִּֽי יָגַ֥עְתָּ בִּ֖/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/022.yaml
  text: Yet you have not called on me[a], Jacob, because you have grown weary of me[b], Israel.
translation:
  language: pt
  text: Contudo, você não me invocou[a], Jacó, porque se cansou de mim[b], Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não me chamou”. O verbo hebraico significa literalmente “chamar”, mas, em contextos de oração ou culto, pode significar “invocar”.
    reason: lexical_alternative
  - marker: b
    text: Ou “se cansou em relação a mim”. A preposição hebraica permite uma formulação mais ampla, embora “se cansou de mim” seja mais natural no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Contudo, ... não
  rationale: A conjunção com a negação introduz contraste com o contexto anterior; “Contudo” preserva de modo natural o tom de repreensão.
- source_word: אֹתִי קָרָאתָ
  choice: você não me invocou
  rationale: קרא significa literalmente “chamar”, mas, quando Deus é o objeto em contexto de oração ou culto, “invocar” comunica com clareza o sentido semântico e preserva a relação direta marcada por אֹתִי.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Nome próprio empregado como vocativo para o povo da aliança.
- source_word: כִּי
  choice: porque
  rationale: Introduz aqui a razão da acusação anterior, embora em outros contextos possa ter outros valores discursivos.
- source_word: יָגַעְתָּ בִּי
  choice: se cansou de mim
  rationale: יגע denota cansaço ou fadiga; com בִּי, “de mim” expressa naturalmente em português o cansaço em relação a Deus, mantendo em nota a alternativa mais próxima da preposição hebraica.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Segundo vocativo, paralelo a “Jacó”, que reforça a interpelação ao povo.
theological_decisions:
- issue: Natureza da falha de Israel para com Deus
  choice: Israel é repreendido por não invocar Deus e por ter se cansado dele.
  alternative: Israel não chamou Deus, mas o cansou.
  rationale: A morfologia mantém Israel como sujeito de קָרָאתָ e יָגַעְתָּ, ambos na segunda pessoa masculina singular. A tradução evita transformar Deus em objeto do verbo “cansar”, leitura que não corresponde à sintaxe.
- issue: Relação expressa por בִּי
  choice: “de mim”, indicando que Israel se cansou de Deus ou da relação com ele
  alternative: “comigo”, preservando mais diretamente a amplitude da preposição ב
  rationale: “Cansar-se de mim” é o sentido contextual mais natural em português, mas a alternativa permanece legítima e é registrada em nota para não eliminar a ambiguidade da preposição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” traduz a segunda pessoa singular dirigida coletivamente a Jacó/Israel. A ordem dos vocativos e o paralelismo do hebraico foram preservados.
