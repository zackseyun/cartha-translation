source:
  edition: WLC
  text: וַ/אֲחַלֵּ֖ל שָׂ֣רֵי קֹ֑דֶשׁ וְ/אֶתְּנָ֤ה לַ/חֵ֨רֶם֙ יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל לְ/גִדּוּפִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/028.yaml
  text: So I profaned the princes of the sanctuary[a], and I gave Jacob over to destruction, and Israel to reviling.
translation:
  language: pt
  text: Por isso, profanei os líderes do santuário e entreguei Jacó à destruição[a], e Israel, aos insultos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à interdição”, isto é, à condição de algo destinado à destruição. O termo hebraico חֵרֶם refere-se aqui ao que é colocado sob interdição para destruição no juízo divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחַלֵּל
  choice: profanei
  rationale: O piel de חלל expressa tratar como profano, profanar ou dessacralizar. “Profanei” preserva a força cultual do verbo e, no contexto, o valor passado/resultativo.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: os líderes do santuário
  rationale: שָׂרֵי designa governantes, chefes ou autoridades; o construto com קֹדֶשׁ os vincula à esfera sagrada. “Líderes” é claro em português atual, enquanto “do santuário” evita identificá-los explicitamente como sacerdotes, algo que o hebraico não declara.
- source_word: וְאֶתְּנָה
  choice: e entreguei
  rationale: נתן significa normalmente “dar”, mas neste contexto judicial tem o sentido idiomático de entregar ou dar em poder de um destino de juízo.
- source_word: לַחֵרֶם
  choice: à destruição
  rationale: חֵרֶם indica aqui aquilo que é posto sob interdição e destinado à destruição em juízo divino. A formulação é natural e mantém a severidade do original; a nuance técnica é registrada em nota.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome próprio tradicional, usado metonimicamente para o povo da aliança.
- source_word: וְיִשְׂרָאֵל
  choice: e Israel
  rationale: Mantém o nome próprio tradicional e o paralelismo poético com Jacó.
- source_word: לְגִדּוּפִים
  choice: aos insultos
  rationale: גִדּוּפִים denota insultos, ultrajes ou palavras de desprezo. “Aos insultos” conserva o plural hebraico e comunica naturalmente a humilhação pública, sem sugerir necessariamente blasfêmia dirigida contra Deus.
theological_decisions:
- issue: Natureza do juízo divino expresso por חֵרֶם
  choice: entreguei Jacó à destruição
  alternative: entreguei Jacó à interdição; destinei Jacó à destruição
  rationale: A tradução mantém a linguagem severa do juízo da aliança, sem suavizá-la nem importar categorias doutrinárias posteriores. A nota preserva o valor técnico de algo colocado sob interdição para destruição.
- issue: Referente de שָׂרֵי קֹדֶשׁ
  choice: líderes do santuário
  alternative: príncipes do santuário; líderes sagrados; sacerdotes
  rationale: O hebraico associa essas autoridades à esfera sagrada, mas não as chama explicitamente de sacerdotes. “Líderes do santuário” comunica a provável função cultual sem tornar a identificação mais específica do que o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Líderes” evita o tom arcaico de “príncipes” para autoridades cultuais; “aos insultos” preserva o plural e soa mais natural do que “às injúrias” ou “aos ultrajes”. O marcador [a] aparece imediatamente após a expressão explicada.
