base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/007.yaml
  text: everyone who is called by my name[a], whom I created for my glory, whom I formed, indeed whom I made.
translation:
  language: pt
  text: todo aquele que é chamado pelo meu nome[a], a quem criei para a minha glória, a quem formei, sim, a quem fiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “todo aquele que é chamado pelo meu nome, e para a minha glória eu o criei; eu o formei, sim, eu o fiz”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: כֹּל
  choice: todo aquele
  rationale: No contexto, refere-se às pessoas reunidas por Deus (vv. 5–6). A expressão distributiva “todo aquele” comunica naturalmente o coletivo singular e combina com os sufixos masculinos singulares que seguem.
- source_word: הַנִּקְרָא
  choice: é chamado
  rationale: O nifal de קרא significa aqui “ser chamado/denominado”. “É chamado” preserva a voz passiva e se ajusta naturalmente à expressão seguinte.
- source_word: בִשְׁמִי
  choice: pelo meu nome
  rationale: A construção נקרא בשם expressa ser chamado pelo nome de alguém e, no contexto, sugere identificação e pertencimento, sem explicitar além do hebraico.
- source_word: וְלִכְבוֹדִי
  choice: para a minha glória
  rationale: כבוד pode significar glória, honra ou esplendor. “Glória” preserva a força teológica e é idiomática neste contexto.
- source_word: בְּרָאתִיו
  choice: a quem criei
  rationale: O qatal é vertido pelo pretérito perfeito. A oração relativa representa de modo natural o sufixo de objeto singular sem exigir a repetição de um pronome masculino.
- source_word: יְצַרְתִּיו
  choice: a quem formei
  rationale: יצר comunica formar ou modelar, frequentemente com imagem artesanal. “Formei” mantém sua distinção em relação a “criei” e “fiz”.
- source_word: אַף
  choice: sim
  rationale: Aqui אַף reforça a oração final. “Sim” transmite a ênfase de maneira atual e digna, sem sugerir mera adição.
- source_word: עֲשִׂיתִיו
  choice: a quem fiz
  rationale: עשה é o verbo amplo “fazer”. “Fiz” conserva o terceiro termo da sequência sem o fundir com “criei” ou “formei”.
theological_decisions:
- issue: Referente e tratamento dos sufixos singulares
  choice: Usar “todo aquele” e retomar o referente por orações relativas com “a quem”.
  alternative: “todos os que são chamados pelo meu nome... eu os criei... eu os formei... eu os fiz” ou a formulação mais rígida “todo aquele... eu o criei”.
  rationale: O hebraico começa com uma expressão coletiva singular e mantém sufixos masculinos singulares. “Todo aquele... a quem” conserva esse perfil gramatical, evita uma formulação pesada e não restringe o referente a homens.
- issue: Relação da expressão de propósito
  choice: Ligar “para a minha glória” diretamente a “criei”.
  alternative: 'Manter mais visível a ordem hebraica: “e para a minha glória eu o criei; eu o formei, sim, eu o fiz”.'
  rationale: A ligação proposta comunica naturalmente que a glória de Deus é o propósito da criação dessas pessoas, sem alterar o conteúdo semântico; a nota preserva a estrutura mais formal e sua possível abertura sintática.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “a quem” conserva a cadência tríplice dos atos divinos; “sim” expressa a força enfática de אַף. A nota registra a ordem e a construção pronominal mais formais do hebraico.
