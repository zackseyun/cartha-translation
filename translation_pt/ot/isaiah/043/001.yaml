source:
  edition: WLC
  text: וְ/עַתָּ֞ה כֹּֽה אָמַ֤ר יְהוָה֙ בֹּרַאֲ/ךָ֣ יַעֲקֹ֔ב וְ/יֹצֶרְ/ךָ֖ יִשְׂרָאֵ֑ל אַל תִּירָא֙ כִּ֣י גְאַלְתִּ֔י/ךָ קָרָ֥אתִי בְ/שִׁמְ/ךָ֖ לִ/י אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/001.yaml
  text: 'But now[a], thus says Yahweh, he who created you, Jacob, and he who formed you, Israel: Do not fear, for I have redeemed you; I have called you by name; you are mine.'
translation:
  language: pt
  text: 'Mas agora, assim diz Yahweh, aquele que criou você, ó Jacó, e que formou você, ó Israel: “Não tenha medo, pois eu redimi você; chamei você pelo nome[a]; você é meu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “convoquei você pelo nome”.'
    reason: Alternativa lexical para קָרָאתִי; no contexto, o verbo também pode ser traduzido como “convocar”.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino como nome próprio, em vez de substituí-lo por um título. A forma preserva a política de transliteração indicada pela evidência de consulta.
- source_word: בֹּרַאֲךָ
  choice: aquele que criou você
  rationale: Traduz verbalmente o particípio de ברא e conserva sua associação característica com a atividade criadora de Deus.
- source_word: וְיֹצֶרְךָ
  choice: e que formou você
  rationale: Distingue יצר de ברא e preserva a ideia de dar forma, com possível imagem artesanal.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: ó Jacó ... ó Israel
  rationale: Entende os nomes como vocativos dirigidos ao povo da aliança; “ó” torna essa função clara em português sem acrescentar conteúdo interpretativo.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: É uma proibição direta, natural e amplamente compreensível em português moderno.
- source_word: גְאַלְתִּיךָ
  choice: eu redimi você
  rationale: “Redimi” preserva a força de גאל, que envolve libertação e reivindicação no âmbito de uma relação de aliança, sem especificar um mecanismo não expresso no texto.
- source_word: קָרָאתִי בְשִׁמְךָ
  choice: chamei você pelo nome
  rationale: Expressa de modo idiomático o chamado pessoal e específico; a nota registra a possível nuance de convocação.
- source_word: לִי אָתָּה
  choice: você é meu
  rationale: Reproduz de maneira breve e enfática a oração nominal hebraica e sua afirmação de pertencimento.
- source_word: וְעַתָּה כֹּה אָמַר
  choice: Mas agora, assim diz
  rationale: “Mas agora” marca a mudança de direção no discurso, enquanto “assim diz” conserva a fórmula profética solene.
theological_decisions:
- issue: Força pactual e redentora de גאל
  choice: eu redimi você
  alternative: eu resgatei você
  rationale: “Redimi” mantém tanto a ideia de libertação quanto a reivindicação relacional associada ao redentor, sem reduzir o termo apenas ao pagamento de um resgate.
- issue: Afirmação de pertencimento em לִי אָתָּה
  choice: você é meu
  alternative: você pertence a mim
  rationale: A forma escolhida conserva a concisão e a força da declaração hebraica, sem explicar além do que o texto afirma.
- issue: Sentido de קרא com בְשֵׁם
  choice: chamei você pelo nome
  alternative: convoquei você pelo nome
  rationale: O verbo pode ressaltar tanto o ato de chamar quanto o de convocar. O texto principal usa a formulação portuguesa mais natural, e a nota preserva a nuance alternativa.
translation_notes:
  register: Português moderno, digno e claro, com uso de “você” para boa legibilidade brasileira. Os vocativos “ó Jacó” e “ó Israel” preservam a estrutura do hebraico e evitam que os nomes sejam lidos como simples apostos. A pontuação destaca a fórmula profética e a fala divina.
