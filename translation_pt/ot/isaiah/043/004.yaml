  yaml_path: translation/ot/isaiah/043/004.yaml
  text: Because you are precious in my eyes[a], honored, and I love you, I give men in exchange for you[b], and peoples in place of your life.
translation:
  language: pt
  text: Porque você é precioso aos meus olhos[a] e honrado, e eu amo você, dou pessoas em troca de você[b] e povos em lugar da sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Porque você foi precioso aos meus olhos, foi honrado e eu amei você”. Neste contexto, os verbos hebraicos podem ser entendidos com força passada ou presente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “darei pessoas em troca de você e povos em lugar da sua vida”. Neste contexto profético, o verbo hebraico pode ter força futura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֲשֶׁר
  choice: Porque
  rationale: A locução introduz, neste contexto, a razão da ação salvadora de YHWH. “Porque” expressa com clareza a relação causal, embora uma nuance temporal seja possível.
- source_word: יָקַרְתָּ
  choice: você é precioso
  rationale: O qatal pode ter força presente no contexto e descreve o valor contínuo do destinatário diante de Deus. “Precioso” preserva a ideia de algo valioso e querido.
- source_word: בְעֵינַי
  choice: aos meus olhos
  rationale: Mantém a imagem do idioma hebraico de avaliação e estima, sendo também natural em português.
- source_word: נִכְבַּדְתָּ
  choice: é honrado
  rationale: O nifal de כבד indica que o destinatário é honrado ou estimado. A formulação preserva o paralelismo com “é precioso” sem transformar a expressão em uma qualidade abstrata.
- source_word: וַאֲנִי אֲהַבְתִּיךָ
  choice: e eu amo você
  rationale: O presente comunica a realidade contínua do amor de YHWH no contexto; a ordem explícita com “eu” preserva a ênfase do pronome hebraico.
- source_word: וְאֶתֵּן
  choice: entrego
  rationale: O yiqtol admite valor presente-futuro nesta declaração profética. “Entrego” expressa de modo natural o ato de dar pessoas em uma troca; a leitura futura é registrada em nota.
- source_word: אָדָם
  choice: pessoas
  rationale: O substantivo singular tem aqui sentido coletivo, referindo-se a seres humanos. “Pessoas” evita sugerir exclusivamente indivíduos do sexo masculino e forma um contraste inteligível com “povos”.
- source_word: תַּחְתֶּיךָ
  choice: em troca de você
  rationale: תחת tem sentido substitutivo, não espacial, neste contexto. A expressão explicita a ideia de troca.
- source_word: וּלְאֻמִּים
  choice: e povos
  rationale: O termo designa grupos humanos ou nações. “Povos” preserva o plural e o paralelismo com “pessoas”.
- source_word: תַּחַת נַפְשֶׁךָ
  choice: em lugar da sua vida
  rationale: נפש se refere aqui à vida ou à própria pessoa, não necessariamente a uma alma imaterial. A tradução preserva o sentido concreto e substitutivo.
theological_decisions:
- issue: Sentido coletivo de אָדָם
  choice: pessoas
  alternative: homens; humanidade
  rationale: No verso, o termo aponta para seres humanos entregues em troca de Israel. “Pessoas” comunica o coletivo sem restringir indevidamente o referente a homens nem recorrer ao abstrato “humanidade”.
- issue: Sentido de נֶפֶשׁ
  choice: vida
  alternative: alma; pessoa
  rationale: O contexto trata da preservação da vida do destinatário mediante substituição. “Vida” evita impor ao termo uma antropologia dualista posterior.
- issue: Valor temporal dos verbos יָקַרְתָּ, נִכְבַּדְתָּ e אֲהַבְתִּיךָ
  choice: força presente
  alternative: força passada
  rationale: O contexto permite entender os verbos como descrição da condição e do amor vigentes. A possibilidade de leitura passada é preservada em nota.
- issue: Valor temporal de וְאֶתֵּן
  choice: presente profético
  alternative: futuro
  rationale: A forma pode apresentar vividamente a ação divina como presente ou indicar uma ação futura. O texto principal usa o presente, e a nota mantém a alternativa futura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “você” torna explícito o singular do hebraico; “eu amo você” é natural no português brasileiro. A redação conserva as imagens “aos meus olhos”, “em troca” e “em lugar”, bem como a tensão temporal dos verbos por meio das notas.
