source:
  edition: WLC
  text: אֲנִ֥י יְהוָ֖ה קְדֽוֹשְׁ/כֶ֑ם בּוֹרֵ֥א יִשְׂרָאֵ֖ל מַלְכְּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/015.yaml
  text: I am Yahweh[a], your Holy One, the Creator of Israel, your King.
translation:
  language: pt
  text: Eu sou Yahweh[a], o Santo de vocês, o Criador de Israel, o Rei de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também grafado “Javé”; o hebraico traz o nome divino יהוה (YHWH).
    reason: Registra uma transliteração portuguesa corrente e identifica a forma presente no texto hebraico.
lexical_decisions:
- source_word: אֲנִי
  choice: Eu sou
  rationale: O pronome independente tem força enfática; em português, “Eu sou” expressa naturalmente a identificação feita pela oração nominal hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: קְדוֹשְׁכֶם
  choice: o Santo de vocês
  rationale: Preserva o título divino e o sufixo de segunda pessoa do plural em linguagem atual e amplamente compreensível.
- source_word: בּוֹרֵא יִשְׂרָאֵל
  choice: o Criador de Israel
  rationale: O particípio apresenta a criação como papel característico de Yahweh e, no contexto, tem força de título.
- source_word: מַלְכְּכֶם
  choice: o Rei de vocês
  rationale: Mantém o substantivo com o sufixo de segunda pessoa do plural e seu paralelismo com “o Santo de vocês”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo pelo título “SENHOR”; a nota registra a forma portuguesa alternativa.
- issue: Uso de maiúsculas nos títulos divinos
  choice: Santo, Criador e Rei
  alternative: santo, criador e rei
  rationale: No verso, os termos estão em aposição a Yahweh e funcionam como títulos divinos. As maiúsculas tornam essa função clara sem alterar o sentido.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A estrutura em aposição conserva o paralelismo conciso do hebraico.
