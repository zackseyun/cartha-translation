id: ISA.43.13
reference: Isaiah 43:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם מִ/יּוֹם֙ אֲנִ֣י ה֔וּא וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּ֑יל אֶפְעַ֖ל וּ/מִ֥י יְשִׁיבֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/013.yaml
  text: Indeed[a], from that day on I am he, and there is none who can deliver from my hand; I act[b], and who can turn it back?
translation:
  language: pt
  text: De fato, desde aquele dia[a], eu sou ele, e não há quem livre da minha mão. Eu ajo, e quem pode fazer isso voltar atrás?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde hoje”, “desde os dias antigos” ou, de modo mais interpretativo, “desde a eternidade”. A expressão hebraica é concisa e pode ser entendida em mais de um sentido temporal.
    reason: alternative_reading
  - marker: b
    text: Ou “quem pode reverter isso?”. O hebraico diz literalmente “quem pode fazê-la voltar?”, referindo-se à ação de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: De fato
  rationale: Neste contexto, a partícula tem força enfática, não apenas aditiva. “De fato” introduz naturalmente a afirmação solene.
- source_word: מִיּוֹם
  choice: desde aquele dia
  rationale: A expressão hebraica é concisa e indica duração a partir de um ponto temporal não especificado. A tradução evita defini-la como referência inequívoca à eternidade.
- source_word: אֲנִי הוּא
  choice: eu sou ele
  rationale: Preserva de perto a fórmula enfática de autoidentificação característica de Isaías e sua ressonância teológica, sem ampliá-la interpretativamente.
- source_word: וְאֵין
  choice: e não há quem
  rationale: Expressa com naturalidade em português a construção existencial negativa seguida do particípio.
- source_word: מִיָּדִי
  choice: da minha mão
  rationale: Mantém a metáfora hebraica da mão como expressão de poder, domínio e controle.
- source_word: מַצִּיל
  choice: livre
  rationale: O particípio designa quem livra ou resgata. A construção “não há quem livre” preserva a ausência de objeto expresso no hebraico.
- source_word: אֶפְעַל
  choice: Eu ajo
  rationale: O verbo פעל é amplo, com o sentido de fazer, operar ou agir. “Eu ajo” comunica uma ação divina decisiva e combina com a pergunta seguinte.
- source_word: יְשִׁיבֶנָּה
  choice: fazer isso voltar atrás
  rationale: A forma causativa de שוב descreve fazer a ação retornar, isto é, anulá-la ou revertê-la. A redação mantém a imagem verbal concreta do hebraico.
theological_decisions:
- issue: Alcance temporal de מִיּוֹם
  choice: desde aquele dia
  alternative: desde hoje; desde os dias antigos; desde a eternidade
  rationale: O hebraico não explicita o ponto temporal e admite mais de uma compreensão. A escolha comunica continuidade sem transformar a frase, por si só, numa afirmação metafísica explícita sobre a eternidade.
- issue: Fórmula de autoidentificação אֲנִי הוּא
  choice: eu sou ele
  alternative: eu sou aquele; eu sou
  rationale: A tradução conserva a forma distintiva e teologicamente significativa da declaração em Isaías, sem a reduzir nem lhe impor formulação doutrinária posterior.
- issue: Referente do sufixo feminino em יְשִׁיבֶנָּה
  choice: isso, referindo-se à ação de Deus
  alternative: tratar o objeto apenas de modo implícito ou traduzir por “revertê-la”
  rationale: O referente é uma ação ou obra implícita. “Isso” mantém a referência ampla e evita inserir um substantivo que não aparece expressamente no texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A metáfora da mão e a fórmula “eu sou ele” foram preservadas; a ambiguidade temporal foi sinalizada em nota.
