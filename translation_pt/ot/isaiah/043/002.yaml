source:
  edition: WLC
  text: כִּֽי תַעֲבֹ֤ר בַּ/מַּ֨יִם֙ אִתְּ/ךָ אָ֔נִי וּ/בַ/נְּהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/ךָ כִּֽי תֵלֵ֤ךְ בְּמוֹ אֵשׁ֙ לֹ֣א תִכָּוֶ֔ה וְ/לֶהָבָ֖ה לֹ֥א תִבְעַר בָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/002.yaml
  text: When you pass through the waters[a], I am with you; and through the rivers, they will not sweep over you. When you walk through fire, you will not be scorched[b], and the flame will not burn you.
translation:
  language: pt
  text: Quando você passar pelas águas, eu estarei com você; e, quando atravessar os rios, eles não o arrastarão[a]. Quando você andar pelo fogo, não ficará chamuscado[b], e a chama não o queimará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não o encobrirão” ou “não o dominarão”. O verbo hebraico pode indicar inundar, passar por cima, arrastar ou subjugar.
    reason: lexical_alternative
  - marker: b
    text: Ou “não será queimado”. O hebraico usa aqui um verbo diferente daquele da oração seguinte, que diz de modo mais direto que a chama não o queimará.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto, כִּי introduz circunstâncias temporais paralelas. “Quando” expressa isso naturalmente, sem sugerir mera possibilidade (“se”) nem uma relação causal (“pois”).
- source_word: תַעֲבֹר בַּמַּיִם
  choice: você passar pelas águas
  rationale: עבר descreve passar ou atravessar, e o plural “águas” preserva a imagem poética concreta do hebraico.
- source_word: אִתְּךָ אָנִי
  choice: eu estarei com você
  rationale: A oração nominal hebraica afirma a presença de Deus. O futuro é natural em português dentro da sequência temporal do versículo, sem alterar o sentido da promessa.
- source_word: וּבַנְּהָרוֹת
  choice: e, quando atravessar os rios
  rationale: A preposição hebraica é literalmente “em/nos”, mas “atravessar os rios” expressa com clareza o movimento indicado pelo verbo subentendido e mantém o paralelismo.
- source_word: לֹא יִשְׁטְפוּךָ
  choice: eles não o arrastarão
  rationale: שטף pode descrever águas que inundam, cobrem ou arrastam. “Não o arrastarão” conserva a força concreta da correnteza sem reduzir a expressão a uma abstração.
- source_word: תֵלֵךְ בְּמוֹ אֵשׁ
  choice: você andar pelo fogo
  rationale: הלך significa ir ou andar. “Andar pelo fogo” é natural, preserva o movimento dentro do perigo e corresponde ao paralelismo com passar pelas águas.
- source_word: לֹא תִכָּוֶה
  choice: não ficará chamuscado
  rationale: O nifal de כוה significa ser queimado ou chamuscado. “Chamuscado” distingue esta oração da seguinte, que emprega outro verbo para dizer que a chama não queimará a pessoa.
- source_word: וְלֶהָבָה לֹא תִבְעַר בָּךְ
  choice: e a chama não o queimará
  rationale: A formulação portuguesa comunica de modo direto a imagem de a chama não arder sobre a pessoa nem queimá-la.
theological_decisions:
- issue: Natureza da promessa nas imagens de água e fogo
  choice: Uma promessa da presença e proteção de Deus em meio a perigos extremos, mantida em imagens poéticas concretas.
  alternative: Entender as imagens apenas como provações espirituais ou como garantia absoluta de que os fiéis jamais sofrerão dano físico.
  rationale: O texto afirma a presença preservadora de Deus mediante imagens vívidas, mas não explica o alcance da promessa para todas as formas de sofrimento. A tradução mantém essa tensão sem espiritualizar as imagens nem formular uma doutrina de invulnerabilidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo poético foi preservado sem reproduzir de maneira rígida a sintaxe hebraica. O tratamento “você” favorece compreensão imediata e mantém o singular do texto-fonte.
