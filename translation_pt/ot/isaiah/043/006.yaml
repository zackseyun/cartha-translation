id: ISA.43.6
reference: Isaiah 43:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֹמַ֤ר לַ/צָּפוֹן֙ תֵּ֔נִי וּ/לְ/תֵימָ֖ן אַל תִּכְלָ֑אִי הָבִ֤יאִי בָנַ/י֙ מֵ/רָח֔וֹק וּ/בְנוֹתַ֖/י מִ/קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/006.yaml
  text: I will say to the north[a], ‘Give them up,’ and to the south, ‘Do not hold them back.’ Bring my sons from far away[b], and my daughters from the end of the earth.
translation:
  language: pt
  text: 'Direi ao norte[a]: “Entregue-os”, e ao sul: “Não os retenha”. Traga os meus filhos de longe e as minhas filhas da extremidade da terra[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dê” / “Não retenha”. O hebraico deixa implícito o objeto, que no contexto é o povo disperso de Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da extremidade da terra”. Também se pode traduzir pela expressão idiomática “dos confins da terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Direi
  rationale: 'O imperfeito qal na primeira pessoa do singular tem sentido naturalmente futuro nesta declaração profética: Deus anuncia a ordem que dará.'
- source_word: לַצָּפוֹן
  choice: ao norte
  rationale: O substantivo direcional é tratado como região personificada à qual Deus se dirige.
- source_word: תֵּנִי
  choice: Entregue-os
  rationale: O imperativo feminino singular concorda com o norte personificado. O objeto está implícito no hebraico e é recuperado pelo contexto como o povo disperso de Deus.
- source_word: וּלְתֵימָן
  choice: e ao sul
  rationale: Em paralelo com “norte”, תֵימָן designa aqui a direção ou região sul, e não o topônimo Temã.
- source_word: אַל תִּכְלָאִי
  choice: Não os retenha
  rationale: A proibição no feminino singular dirige-se ao sul personificado; o pronome explicita em português o objeto contextual sem alterar o referente.
- source_word: הָבִיאִי
  choice: Traga
  rationale: O imperativo hifil feminino singular dá continuidade à personificação das regiões e é expresso naturalmente por “Traga”.
- source_word: בָנַי
  choice: os meus filhos
  rationale: Preserva o plural masculino específico, em paralelo deliberado com “minhas filhas”.
- source_word: מֵרָחוֹק
  choice: de longe
  rationale: Expressão portuguesa corrente e digna para a origem distante indicada pelo hebraico.
- source_word: וּבְנוֹתַי
  choice: e as minhas filhas
  rationale: Preserva o plural feminino específico e o paralelismo de gênero do texto hebraico.
- source_word: מִקְצֵה הָאָרֶץ
  choice: da extremidade da terra
  rationale: Mantém o singular hebraico קְצֵה e comunica com clareza a ideia do limite mais remoto da terra.
theological_decisions:
- issue: Referente das ordens dadas ao norte e ao sul
  choice: O norte e o sul são regiões personificadas, às quais Deus ordena que libertem e tragam de volta seu povo disperso.
  alternative: As direções seriam apenas forças cósmicas metafóricas, sem referência específica ao exílio e à reunião do povo.
  rationale: O contexto imediato trata da restauração e reunião de Israel; os imperativos femininos singulares correspondem às regiões personificadas, e “meus filhos” e “minhas filhas” identificam os que são reunidos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A personificação do norte e do sul foi preservada, assim como o paralelismo explícito entre filhos e filhas.
