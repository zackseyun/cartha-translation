base_translation:
  language: en
  yaml_path: translation/ot/isaiah/043/008.yaml
  text: Bring out a blind people[a], though they have eyes, and the deaf, though they have ears.
translation:
  language: pt
  text: Conduza para fora um povo cego[a], embora tenha olhos, e os surdos, embora tenham ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Traga para fora um povo cego, que, no entanto, tem olhos; e os surdos, que, no entanto, têm ouvidos.”'
    reason: Alternativa lexical para o imperativo הוֹצִיא e alternativa sintática para expressar o contraste das construções coordenadas.
lexical_decisions:
- source_word: הוֹצִיא
  choice: Faça sair
  rationale: O hifil imperativo masculino singular de יצא ordena que alguém faça o grupo sair ou o apresente. “Faça sair” preserva tanto a força causativa quanto a imperativa em português atual.
- source_word: עַם
  choice: um povo
  rationale: O substantivo עם designa coletivamente um povo. O artigo indefinido reflete a ausência de determinação explícita no hebraico e evita o sentido predominantemente político de “nação”.
- source_word: עִוֵּר
  choice: cego
  rationale: Mantém o termo sensorial direto do hebraico e conserva a ironia profética, sem explicitar no texto principal se a cegueira é física ou metafórica.
- source_word: וְעֵינַיִם יֵשׁ
  choice: embora tenha olhos
  rationale: A expressão significa literalmente “e há olhos”. “Embora tenha olhos” torna natural em português o contraste concessivo implícito entre ser cego e possuir olhos.
- source_word: וְחֵרְשִׁים
  choice: e os surdos
  rationale: O adjetivo plural é usado como substantivo. O artigo definido produz uma formulação natural e mantém o paralelismo com o povo cego.
- source_word: וְאָזְנַיִם לָמוֹ
  choice: embora tenham ouvidos
  rationale: Literalmente, “e ouvidos [há] para eles”. A construção concessiva expressa em português a ironia de serem surdos apesar de possuírem ouvidos.
theological_decisions:
- issue: Natureza da cegueira e da surdez
  choice: Manter os termos sensoriais literais, permitindo que o contexto profético sugira insensibilidade espiritual.
  alternative: Explicitar no texto principal que o povo é espiritualmente cego e surdo.
  rationale: O hebraico emprega os termos comuns para cegueira e surdez. Embora o contexto possa lhes dar sentido metafórico, explicitá-lo eliminaria uma ambiguidade intencional e acrescentaria interpretação à tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Faça sair” conserva a ordem no singular e a causatividade do hebraico; “embora” comunica naturalmente o contraste retórico sem explicar além do texto.
