  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הָ/עֲנִיִּ֨ים וְ/הָ/אֶבְיוֹנִ֜ים מְבַקְשִׁ֥ים מַ֨יִם֙ וָ/אַ֔יִן לְשׁוֹנָ֖/ם בַּ/צָּמָ֣א נָשָׁ֑תָּה אֲנִ֤י יְהוָה֙ אֶעֱנֵ֔/ם אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֹ֥א אֶעֶזְבֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/017.yaml
  text: The poor and needy seek water[a], but there is none; their tongue is parched with thirst. I, Yahweh, will answer them; I, the God of Israel, will not forsake them.
translation:
  language: pt
  text: Os pobres e necessitados procuram água, mas não há nenhuma; a língua deles está ressequida de sede. Eu, Yahweh[a], lhes responderei; eu, o Deus de Israel, não os abandonarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: Explica a forma do nome divino e registra a tradução tradicional.
lexical_decisions:
- source_word: הָעֲנִיִּים וְהָאֶבְיוֹנִים
  choice: Os pobres e necessitados
  rationale: Os dois termos descrevem pessoas aflitas pela pobreza e pela carência. A formulação preserva o paralelismo sem acrescentar uma interpretação exclusivamente espiritual.
- source_word: מְבַקְשִׁים מַיִם וָאַיִן
  choice: procuram água, mas não há nenhuma
  rationale: O particípio comunica uma busca em curso; a conjunção adversativa explicita naturalmente o contraste implícito, e “nenhuma” retoma “água” sem repetição pesada.
- source_word: לְשׁוֹנָם בַּצָּמָא נָשָׁתָּה
  choice: a língua deles está ressequida de sede
  rationale: Mantém a imagem corporal e o singular coletivo do hebraico. “Ressequida” expressa uma secura intensa e é natural neste contexto poético.
- source_word: אֲנִי יְהוָה אֶעֱנֵם
  choice: Eu, Yahweh, lhes responderei
  rationale: O pronome independente é enfático; a construção com aposto conserva essa ênfase. “Responderei” traduz diretamente a promessa de reação divina à necessidade deles.
- source_word: אֱלֹהֵי יִשְׂרָאֵל לֹא אֶעֶזְבֵם
  choice: eu, o Deus de Israel, não os abandonarei
  rationale: A repetição de “eu” reproduz o paralelismo enfático. “Abandonarei” comunica com clareza atual o peso relacional de עזב.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino YHWH. “Yahweh” o apresenta como nome, enquanto a nota registra a convenção tradicional “SENHOR” sem substituir o nome no texto principal.
- issue: Sentido da resposta divina
  choice: lhes responderei
  alternative: atenderei ao pedido deles
  rationale: O hebraico afirma que Deus responderá, mas não explicita aqui uma oração ou pedido verbal. A tradução evita resolver essa abertura interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético e a ênfase dos dois usos de “eu” foram preservados; evitou-se linguagem excessivamente arcaica.
