base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/002.yaml
  text: Who has stirred up one from the east[a], calling him in righteousness to his feet? He gives nations before him and subdues kings; he gives them like dust to his sword[b], like driven stubble to his bow.
translation:
  language: pt
  text: 'Quem despertou alguém do Oriente,

    chamando-o em justiça para segui-lo?[a]

    Ele entrega nações diante dele

    e lhe sujeita reis;[b]

    entrega-os como pó à sua espada,

    como palha levada pelo vento ao seu arco.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele a quem a justiça chama para segui-la”. O hebraico é difícil; “justiça” também pode ter aqui o sentido de vindicação, causa justa ou vitória, e a expressão traduzida por “para segui-lo” significa literalmente “ao seu pé”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico desta expressão é sintaticamente difícil. Outras possibilidades são: “faz com que ele domine reis” ou “faz reis descerem diante dele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵעִיר
  choice: despertou
  rationale: O hifil de עור indica fazer alguém despertar ou levantar-se para agir. “Despertou” conserva o valor causativo e a imagem do hebraico.
- source_word: מִמִּזְרָח
  choice: vindo do Oriente
  rationale: מִזְרָח designa o lugar do nascer do sol e, por extensão, o Oriente. A formulação indica a procedência da pessoa despertada.
- source_word: צֶדֶק
  choice: com justiça
  rationale: Mantém o núcleo semântico de justiça ou retidão sem decidir se, no contexto, o termo também sugere vindicação ou vitória.
- source_word: יִקְרָאֵהוּ לְרַגְלוֹ
  choice: o chamou para segui-lo
  rationale: O verbo significa chamar ou convocar; a expressão “ao seu pé” pode indicar acompanhamento ou serviço. “Para segui-lo” comunica esse sentido em português natural, e a dificuldade sintática é registrada em nota.
- source_word: יִתֵּן לְפָנָיו גּוֹיִם
  choice: entrega nações diante dele
  rationale: נתן com לְפָנָיו retrata as nações sendo postas ou entregues diante do conquistador. “Entrega” torna explícito o valor contextual sem perder a imagem espacial.
- source_word: וּמְלָכִים יַרְדְּ
  choice: e lhe sujeita reis
  rationale: A forma hebraica é sintaticamente difícil, mas o contexto favorece o domínio ou a subjugação de reis. A nota preserva leituras alternativas plausíveis.
- source_word: יִתֵּן כֶּעָפָר חַרְבּוֹ
  choice: faz com que sejam como pó diante de sua espada
  rationale: O objeto elíptico é recuperado das nações e dos reis mencionados antes. A formulação conserva a comparação com o pó e associa a derrota à espada do personagem.
- source_word: כְּקַשׁ נִדָּף קַשְׁתּוֹ
  choice: como palha levada pelo vento diante de seu arco
  rationale: קַשׁ é palha ou restolho, e נִדָּף indica algo impelido ou disperso. A menção do vento torna natural em português a imagem de algo levado, sem alterar a força da comparação.
theological_decisions:
- issue: Identidade daquele que vem do Oriente
  choice: Deixar a pessoa sem nome, usando “alguém”
  alternative: Identificá-la como Ciro, Abraão ou um conquistador ideal levantado por Deus
  rationale: O próprio versículo não identifica a figura; nomeá-la resolveria no texto uma questão interpretativa que deve permanecer aberta.
- issue: Função de צֶדֶק na convocação
  choice: Entender Deus como sujeito implícito de “chamou” e “com justiça” como expressão de modo ou fundamento
  alternative: 'Entender “justiça” personificada como sujeito: “a quem a justiça chamou”'
  rationale: A leitura escolhida produz português coerente e corresponde a uma análise plausível da sequência verbal, enquanto a nota reconhece a ambiguidade sintática e semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado em linhas curtas. Evitaram-se tanto o literalismo obscuro de “aos seus pés” quanto a identificação interpretativa da figura oriental.
