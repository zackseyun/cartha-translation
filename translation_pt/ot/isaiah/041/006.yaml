  text: אִ֥ישׁ אֶת רֵעֵ֖/הוּ יַעְזֹ֑רוּ וּ/לְ/אָחִ֖י/ו יֹאמַ֥ר חֲזָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/006.yaml
  text: Each man helps his neighbor[a], and says to his brother[b], “Be strong!”
translation:
  language: pt
  text: 'Cada homem ajuda o seu próximo[a] e diz ao seu irmão[b]: “Seja forte!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu companheiro” ou “seu amigo”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, “irmão” também pode ter o sentido mais amplo de alguém do mesmo povo ou grupo, ou de um parente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Cada um
  rationale: O singular אִישׁ tem aqui valor distributivo. “Cada um” expressa naturalmente essa função coletiva em português sem acrescentar uma especificação ausente do contexto imediato.
- source_word: אֶת רֵעֵהוּ
  choice: o seu próximo
  rationale: רֵעַ pode designar próximo, companheiro ou amigo. “Próximo” preserva o sentido interpessoal amplo sem pressupor intimidade.
- source_word: יַעְזֹרוּ
  choice: ajuda
  rationale: Embora o verbo hebraico esteja no plural por causa do sentido coletivo do sujeito, o presente singular concorda naturalmente com “cada um” e retrata vividamente a ação.
- source_word: וּלְאָחִיו
  choice: e diz ao seu irmão
  rationale: אָח significa diretamente “irmão”, mas pode ter sentido social mais amplo. A tradução literal mantém o paralelismo, e a nota registra a amplitude possível.
- source_word: יֹאמַר
  choice: diz
  rationale: O imperfeito hebraico integra a descrição vívida da cena; o presente é natural em português.
- source_word: חֲזָק
  choice: Seja forte!
  rationale: O imperativo de חזק exorta à força e à firmeza. “Seja forte!” conserva de modo direto sua forma e força exortativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção distributiva natural. Conserva o paralelismo hebraico entre “próximo” e “irmão” e mantém a exortação breve e enfática.
