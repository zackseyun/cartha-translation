id: ISA.41.5
reference: Isaiah 41:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רָא֤וּ אִיִּים֙ וְ/יִירָ֔אוּ קְצ֥וֹת הָ/אָ֖רֶץ יֶחֱרָ֑דוּ קָרְב֖וּ וַ/יֶּאֱתָיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/005.yaml
  text: The coastlands have seen and fear[a]; the ends of the earth tremble[b]. They draw near and come.
translation:
  language: pt
  text: As regiões costeiras viram e têm medo; os confins da terra tremem. Aproximam-se e vêm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּ
  choice: viram
  rationale: O perfeito hebraico apresenta a percepção como fato consumado; o pretérito perfeito é natural em português e mantém a sequência narrativa.
- source_word: אִיִּים
  choice: as regiões costeiras
  rationale: Em Isaías, o termo pode abranger ilhas, litorais e terras marítimas distantes; esta formulação preserva a amplitude sem restringi-lo a ilhas literais.
- source_word: וְיִירָאוּ
  choice: e ficaram com medo
  rationale: O verbo ירא indica aqui temor diante do que foi visto, sem exigir a ideia de reverência religiosa; a expressão é clara e corrente em português.
- source_word: קְצוֹת הָאָרֶץ
  choice: os confins da terra
  rationale: Expressão portuguesa consagrada para as regiões mais remotas do mundo e equivalente natural do idioma hebraico.
- source_word: יֶחֱרָדוּ
  choice: tremem
  rationale: חרד reúne reação física e emocional de medo ou agitação; “tremem” conserva essa força sem explicá-la em excesso.
- source_word: קָרְבוּ
  choice: Aproximam-se
  rationale: Mantém o movimento indicado pelo verbo e o tom profético, sem definir o propósito da aproximação.
- source_word: וַיֶּאֱתָיוּן
  choice: e vêm
  rationale: O verbo poético significa “vir”; a formulação preserva a repetição enfática e o paralelismo compacto do hebraico.
theological_decisions:
- issue: Natureza da reação das nações distantes
  choice: A reação é expressa como medo e tremor, enquanto sua aproximação permanece sem propósito explicitado.
  alternative: Entender o temor como reverência ou a aproximação como submissão ou reunião hostil.
  rationale: O texto sustenta medo e tremor, mas não esclarece por si só se a aproximação é reverente, submissa ou preparatória para a cena de fabricação de ídolos que se segue; a tradução preserva essa tensão.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira. “Regiões costeiras” comunica melhor o alcance geográfico amplo de אִיִּים do que uma tradução estritamente literal por “ilhas”. O paralelismo final foi mantido de modo conciso: “Aproximam-se e vêm”.'
