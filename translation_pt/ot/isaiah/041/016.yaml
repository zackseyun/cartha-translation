base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/016.yaml
  text: You will winnow them[a], and the wind will carry them away, and the storm will scatter them; but you will rejoice in Yahweh[c][b]; in the Holy One of Israel you will boast.
translation:
  language: pt
  text: Você os joeirará[a], e o vento os levará; a tempestade os espalhará. Mas você se alegrará em Yahweh[b] e se gloriará[c] no Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os espalhará”. O verbo hebraico pode indicar dispersão em geral, mas “joeirar” preserva a imagem da debulha presente no contexto.'
    reason: lexical_alternative
  - marker: b
    text: O nome hebraico יהוה, tradicionalmente representado por “SENHOR”, é aqui transliterado como “Yahweh”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “se orgulhará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרֵם
  choice: você os joeirará
  rationale: O verbo זרה pode significar espalhar, mas, neste contexto, descreve a joeira e preserva a imagem agrícola da debulha iniciada no versículo anterior.
- source_word: רוּחַ
  choice: vento
  rationale: O paralelismo com a tempestade e a ação de levar embora favorecem o sentido meteorológico, não “espírito” ou “sopro”.
- source_word: תִּשָּׂאֵם
  choice: os levará
  rationale: נשׂא exprime levantar ou carregar; aqui, o vento leva embora aquilo que foi joeirado.
- source_word: סְעָרָה
  choice: tempestade
  rationale: O termo indica vento tempestuoso e violento; “tempestade” é claro e atual sem restringir indevidamente o sentido a um redemoinho.
- source_word: תָּפִיץ
  choice: os espalhará
  rationale: O hifil de פוץ significa fazer dispersar ou espalhar, adequado à figura da palha levada pelo vento.
- source_word: תָּגִיל
  choice: você se alegrará
  rationale: גיל denota alegria exultante; “se alegrará” é natural e mantém a força positiva do verbo.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב marca Yahweh como objeto ou esfera da alegria, e o nome divino יהוה é transliterado.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: no Santo de Israel
  rationale: Mantém integralmente o importante título divino de Isaías e preserva o paralelismo preposicional com “em Yahweh”.
- source_word: תִּתְהַלָּל
  choice: se gloriará
  rationale: O hitpael de הלל pode significar gloriar-se ou orgulhar-se. “Gloriar-se” comunica exultação e confiança cujo centro é Deus, sem sugerir necessariamente arrogância pecaminosa.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome da aliança יהוה. “Yahweh” o representa como nome próprio, em vez de substituí-lo por um título; a nota esclarece a tradição de vertê-lo como “SENHOR”.
- issue: Sentido da linguagem de gloriar-se
  choice: se gloriará
  alternative: se orgulhará
  rationale: A confiança exultante tem Deus como centro, não o próprio ser humano. A formulação preserva a linguagem teológica positiva sem apagar a possibilidade lexical indicada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. “Joeirar” é mantido por precisão imagética, acompanhado de nota; “se gloriará” conserva o tom elevado sem soar arcaico.
