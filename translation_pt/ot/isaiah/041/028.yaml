  text: וְ/אֵ֨רֶא֙ וְ/אֵ֣ין אִ֔ישׁ וּ/מֵ/אֵ֖לֶּה וְ/אֵ֣ין יוֹעֵ֑ץ וְ/אֶשְׁאָלֵ֖/ם וְ/יָשִׁ֥יבוּ דָבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/028.yaml
  text: And I looked[a], but there was no man; among these there was no counselor, that I might ask them[b] and they would answer a word.
translation:
  language: pt
  text: Olhei, mas não havia homem algum[a]; entre estes, não havia conselheiro — alguém a quem eu pudesse perguntar e que respondesse uma palavra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia ninguém”. O hebraico traz “homem” no singular masculino, que aqui pode ter sentido representativo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “respondesse alguma coisa”. Literalmente, o hebraico diz: “respondessem uma palavra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרֶא
  choice: Olhei
  rationale: O imperfeito qal de ראה pode ter valor narrativo no discurso profético. “Olhei” preserva a ideia de uma busca ou inspeção retrospectiva.
- source_word: וְאֵין אִישׁ
  choice: mas não havia homem algum
  rationale: אִישׁ é masculino singular, “homem”, embora possa representar qualquer pessoa. “Homem algum” conserva a forma do hebraico e comunica a inexistência de alguém capaz de responder.
- source_word: וּמֵאֵלֶּה
  choice: entre estes
  rationale: 'A preposição מִן tem aqui provável sentido partitivo: dentre os que acabam de ser examinados. “Entre estes” é idiomático em português sem explicitar se o referente são os ídolos, seus representantes ou, mais amplamente, os envolvidos no desafio.'
- source_word: וְאֵין יוֹעֵץ
  choice: não havia conselheiro
  rationale: יוֹעֵץ é um particípio substantivado de יעץ e designa alguém que aconselha. “Conselheiro” preserva sua forma concisa.
- source_word: וְאֶשְׁאָלֵם
  choice: para que eu lhes perguntasse
  rationale: O imperfeito com o sufixo de terceira pessoa masculina plural admite força intencional ou potencial no contexto. A formulação mantém o referente plural de “lhes” sem convertê-lo em ação passada consumada.
- source_word: וְיָשִׁיבוּ דָבָר
  choice: e eles respondessem uma palavra
  rationale: O hifil de שוב pode significar “responder”, e דָבָר significa literalmente “palavra”. A tradução conserva a concisão e a força retórica do hebraico; a nota oferece o sentido idiomático.
theological_decisions:
- issue: Referente de “estes” e identidade do conselheiro ausente
  choice: Manter o demonstrativo sem identificar expressamente seu referente
  alternative: Explicitar “entre os ídolos” ou “entre seus representantes”
  rationale: Isaías 41:21–29 apresenta um desafio judicial aos ídolos, mas o versículo não nomeia de novo o referente. A tradução preserva essa abertura textual e não restringe a expressão além do hebraico.
- issue: Sentido representativo de אִישׁ
  choice: homem algum
  alternative: ninguém; pessoa alguma
  rationale: A escolha conserva o substantivo masculino singular do hebraico, enquanto a nota esclarece seu possível emprego representativo.
- issue: Relação sintática dos verbos finais
  choice: para que eu lhes perguntasse e eles respondessem
  alternative: quando eu lhes perguntasse, eles responderiam; eu lhes perguntaria, e eles responderiam
  rationale: A construção hebraica é tersa e permite nuance potencial ou intencional. A tradução evita transformá-la em uma ação passada indicativa e conserva a expectativa frustrada de obter resposta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem e a concisão do hebraico foram preservadas na medida possível; as notas esclarecem os dois pontos em que uma tradução estritamente formal soaria menos idiomática.
