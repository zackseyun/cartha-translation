base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/024.yaml
  text: Look[a], you are from nothing, and your work is from nonexistence; whoever chooses you is an abomination.
translation:
  language: pt
  text: 'Vejam: vocês não são nada, e a obra de vocês é menos que nada[a]; quem escolhe vocês é uma abominação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “menos que nada” é raro e de sentido incerto; também pode indicar “nada” ou “não existência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição dêitica que introduz uma declaração enfática. “Vejam” é atual, claro e conserva a força do chamado de atenção.
- source_word: מֵאַיִן
  choice: não são nada
  rationale: Embora a forma contenha a preposição “de”, no contexto da polêmica contra os ídolos ela declara sua nulidade, não necessariamente sua origem. A formulação idiomática evita sugerir que foram criados a partir do nada.
- source_word: וּפָעָלְכֶם
  choice: e a obra de vocês
  rationale: Mantém o substantivo singular e amplo do hebraico, que pode abranger a ação, o efeito ou o feito atribuído aos ídolos.
- source_word: מֵאָפַע
  choice: é menos que nada
  rationale: O termo é raro e obscuro. No paralelismo com מֵאַיִן, a leitura contextual mais provável intensifica a afirmação de nulidade; a incerteza lexical é registrada em nota.
- source_word: תּוֹעֵבָה
  choice: uma abominação
  rationale: Preserva a forma nominal e a forte linguagem de repulsa moral e religiosa do hebraico.
- source_word: יִבְחַר בָּכֶם
  choice: quem escolhe vocês
  rationale: Traduz naturalmente a construção genérica no singular e mantém os ídolos como objeto da escolha.
theological_decisions:
- issue: Referente dos pronomes na segunda pessoa do plural
  choice: Os pronomes se dirigem aos deuses ou ídolos desafiados no contexto imediato.
  alternative: Podem ser entendidos metonimicamente como referência aos fabricantes de ídolos.
  rationale: O contexto desafia diretamente os deuses das nações a anunciar e realizar algo, enquanto a cláusula final condena quem os escolhe. A tradução mantém o referente direto sem acrescentar explicação interpretativa ao versículo.
- issue: Identidade da “abominação” na cláusula final
  choice: A pessoa que escolhe os ídolos é chamada de “uma abominação”.
  alternative: A expressão poderia ser parafraseada dizendo que essa pessoa é “abominável”.
  rationale: A ordem hebraica apresenta תּוֹעֵבָה como predicativo enfático; conservar o substantivo mantém a força e a tensão da formulação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” torna explícito o número do hebraico sem recorrer a formas arcaicas. A pontuação destaca a declaração enfática e o paralelismo profético.
