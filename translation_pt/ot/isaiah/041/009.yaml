base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/009.yaml
  text: you whom I took hold of from the ends of the earth[a], and called from its farthest corners, and said to you, ‘You are my servant; I have chosen you and not rejected you,’
translation:
  language: pt
  text: 'você, a quem trouxe desde os confins da terra e a quem chamei dos seus lugares mais remotos[a], a quem disse: “Você é meu servo; eu o escolhi e não o rejeitei”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “das suas extremidades”. O termo hebraico é discutido. Alguns o entendem como “dos seus nobres”, mas o sentido geográfico corresponde melhor ao paralelismo com “dos confins da terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזַקְתִּיךָ
  choice: a quem tomei
  rationale: O hifil de חזק pode expressar agarrar ou tomar. Aqui, com a expressão de origem geográfica, “tomei” preserva a ideia de Deus ir buscar e tomar para si, sem sugerir indevidamente fortalecimento interior nem força excessiva.
- source_word: מִקְצוֹת הָאָרֶץ
  choice: dos confins da terra
  rationale: “Confins da terra” é uma expressão portuguesa natural e digna para as regiões mais distantes, preservando a amplitude geográfica do hebraico.
- source_word: וּמֵאֲצִילֶיהָ
  choice: dos seus lugares mais remotos
  rationale: A expressão foi entendida geograficamente em paralelo com “confins da terra”. Esta formulação comunica distância sem impor a imagem específica de cantos; a alternativa lexical “dos seus nobres” é registrada em nota.
- source_word: קְרָאתִיךָ
  choice: chamei
  rationale: “Chamei” conserva a amplitude do verbo hebraico e comporta tanto convocação quanto escolha divina.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: “Servo” é a forma idiomática e contextualmente adequada para o papel de Israel/Jacó nesta passagem, sem apagar a relação de sujeição expressa pelo termo.
- source_word: בְּחַרְתִּיךָ
  choice: eu o escolhi
  rationale: O pretérito perfeito traduz naturalmente a ação divina já realizada e ainda válida no contexto. O pronome “o” mantém o referente masculino singular de “servo”.
- source_word: מְאַסְתִּיךָ
  choice: não o rejeitei
  rationale: מאס expressa rejeitar ou recusar. “Rejeitei” é claro em português atual e se ajusta à garantia da contínua eleição de Israel.
theological_decisions:
- issue: Referente da segunda pessoa do singular
  choice: Manter o singular “você” e os pronomes correspondentes, entendendo Israel/Jacó como um servo coletivo.
  alternative: Empregar uma forma plural para explicitar a coletividade.
  rationale: O hebraico usa consistentemente a segunda pessoa masculina singular e apresenta Israel/Jacó corporativamente como um único servo. Preservar o singular mantém a forma literária e a tensão teológica do texto sem redefinir o destinatário.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna explícito o singular do hebraico; “meu servo” conserva o vocabulário teológico e literário de Isaías. A pontuação final mantém o caráter de oração subordinada do versículo no contexto imediato.
