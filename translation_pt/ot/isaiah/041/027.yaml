base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
translation:
  language: pt
  text: 'Primeiro, a Sião[a]: “Vejam, aqui estão eles!”[b] E a Jerusalém darei[c] um mensageiro de boas notícias[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é muito conciso. Também pode ser entendido, suprindo elementos implícitos, como “Eu fui o primeiro a dizer a Sião” ou “O primeiro diz a Sião”.
    reason: alternative_reading
  - marker: b
    text: O hebraico não identifica explicitamente quem são “eles”; a expressão pode apontar para pessoas ou acontecimentos anteriormente anunciados.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “dou”. A forma verbal hebraica pode ser entendida como presente vívido ou futuro no discurso profético.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “alguém que anuncia boas notícias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִאשׁוֹן
  choice: O primeiro
  rationale: Conserva o sentido básico de “primeiro” e a formulação nominal e concisa do hebraico, sem acrescentar explicitamente “eu sou”, sujeito que o texto não declara.
- source_word: לְצִיּוֹן
  choice: a Sião
  rationale: 'A preposição לְ é entendida em sentido direcional: a declaração se dirige a Sião.'
- source_word: הִנֵּה הִנָּם
  choice: Vejam, aqui estão eles!
  rationale: A expressão dêitica enfática chama a atenção e inclui um sufixo plural masculino. O referente permanece sem identificação explícita.
- source_word: וְלִירוּשָׁלִַם
  choice: E a Jerusalém
  rationale: Mantém o paralelismo com “a Sião” e apresenta Jerusalém como destinatária da dádiva ou do anúncio.
- source_word: מְבַשֵּׂר
  choice: um mensageiro de boas notícias
  rationale: O particípio de בשׂר designa alguém que anuncia boas notícias; “mensageiro de boas notícias” comunica tanto a função quanto o teor positivo da mensagem.
- source_word: אֶתֵּן
  choice: darei
  rationale: O imperfeito na primeira pessoa do singular admite valor futuro no discurso profético. “Darei” soa natural em português, embora o presente vívido também seja possível.
theological_decisions:
- issue: Referente do pronome plural em הִנָּם (“aqui estão eles”)
  choice: O referente fica implícito, como no hebraico.
  alternative: Identificá-lo como os exilados que retornam, os acontecimentos anunciados ou os agentes da libertação.
  rationale: O texto não especifica quem ou o que está sendo apontado. Preservar essa indefinição evita impor uma interpretação teológica mais estreita.
- issue: Sujeito e construção elíptica de רִאשׁוֹן לְצִיּוֹן
  choice: “O primeiro diz a Sião”, conservando “o primeiro” sem identificá-lo expressamente.
  alternative: “Eu fui o primeiro a dizer a Sião” ou “Primeiro, a Sião”.
  rationale: O contexto pode favorecer Deus como aquele que primeiro anuncia, mas o hebraico é muito condensado e não traz explicitamente “eu sou” nem o verbo “dizer”. A tradução principal mantém a elipse tanto quanto o português permite, e a nota registra as principais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A concisão poética e a ambiguidade sintática do hebraico foram preservadas no texto principal, enquanto as expansões interpretativas ficaram nas notas.
