  terminology: Sião e Jerusalém estão corretos. “Mensageiro de boas notícias” transmite bem מְבַשֵּׂר sem impor uma identificação teológica. “Vejam, aqui estão eles!” preserva o apelo enfático e o referente plural indeterminado.
