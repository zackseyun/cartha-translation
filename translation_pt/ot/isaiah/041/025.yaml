source:
  edition: WLC
  text: הַעִיר֤וֹתִי מִ/צָּפוֹן֙ וַ/יַּ֔את מִ/מִּזְרַח שֶׁ֖מֶשׁ יִקְרָ֣א בִ/שְׁמִ֑/י וְ/יָבֹ֤א סְגָנִים֙ כְּמוֹ חֹ֔מֶר וּ/כְמ֥וֹ יוֹצֵ֖ר יִרְמָס טִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/025.yaml
  text: I have stirred up one from the north[a], and he has come; from the rising of the sun he calls on my name. He will come upon rulers as upon clay[c][b], and like a potter he treads mud.
translation:
  language: pt
  text: Eu despertei alguém do norte, e ele veio; do nascente do sol[a], ele invoca o meu nome[b]. Ele avançará contra governantes como se fossem barro, como o oleiro que pisa o barro úmido.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, desde o leste.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida por “chama pelo meu nome” ou “proclama o meu nome”.
    reason: lexical_alternative
  - marker: c
    text: A pessoa despertada por Deus é muitas vezes entendida como Ciro, mas o texto hebraico deste versículo não a identifica pelo nome.
    reason: cross_reference
lexical_decisions:
- source_word: הַעִירוֹתִי
  choice: Eu despertei
  rationale: O hifil de עור indica despertar ou incitar alguém para agir. “Despertei” preserva a ação divina e soa natural em português.
- source_word: מִצָּפוֹן
  choice: do norte
  rationale: Tradução direta da indicação geográfica.
- source_word: וַיַּאת
  choice: e ele veio
  rationale: O wayyiqtol após o perfeito dá continuidade à ação apresentada profeticamente como realizada; o pretérito preserva essa sequência.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: desde o nascente do sol
  rationale: Preserva a imagem hebraica literal e comunica naturalmente a direção leste; a equivalência geográfica é explicitada em nota.
- source_word: יִקְרָא בִשְׁמִי
  choice: ele invoca o meu nome
  rationale: קרא בשם pode significar invocar, chamar pelo nome ou proclamar. “Invoca” conserva o sentido idiomático sem determinar plenamente a postura religiosa da figura.
- source_word: וְיָבֹא סְגָנִים
  choice: Ele avançará contra governantes
  rationale: O verbo de movimento com o objeto seguinte sugere aproximação hostil. “Avançará contra” torna clara a relação sintática sem exagerar o sentido.
- source_word: סְגָנִים
  choice: governantes
  rationale: O termo designa altos oficiais ou governantes; esta opção é ampla, clara e apropriada ao contexto político.
- source_word: כְּמוֹ חֹמֶר
  choice: como se fossem barro
  rationale: Explicita que os governantes são o termo comparado ao barro, evitando em português a leitura obscura de que ele simplesmente caminha sobre barro.
- source_word: וּכְמוֹ יוֹצֵר
  choice: como o oleiro
  rationale: יוֹצֵר designa aquele que dá forma, especialmente o oleiro; é a equivalência tradicional e natural.
- source_word: יִרְמָס טִיט
  choice: que pisa o barro úmido
  rationale: רמס exprime pisar ou calcar, e טיט é lama ou barro molhado. “Barro úmido” mantém a imagem do trabalho do oleiro e distingue este material do primeiro חֹמֶר.
theological_decisions:
- issue: Identidade e postura religiosa da figura despertada por Deus
  choice: Manter a figura sem nome e traduzir יִקְרָא בִשְׁמִי por “invoca o meu nome”.
  alternative: Identificá-la explicitamente como Ciro ou traduzir a expressão de modo categórico como “proclama o meu nome”.
  rationale: Embora a figura seja frequentemente entendida como Ciro, o hebraico deste versículo não a identifica pelo nome. A expressão קרא בשם admite invocação, uso ou proclamação do nome; a tradução e a nota preservam essa tensão sem julgar definitivamente sua piedade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conserva a imagem poética “nascente do sol” e a ambiguidade de “invoca o meu nome”, enquanto esclarece a comparação dos governantes com barro.
