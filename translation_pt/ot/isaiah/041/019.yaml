base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/019.yaml
  text: I will put in the wilderness cedar[a], acacia, myrtle, and olive tree; I will set in the desert cypress, plane tree, and pine together[b],
translation:
  language: pt
  text: Porei no deserto o cedro, a acácia, a murta e a oliveira[a]; colocarei na terra árida o cipreste, o plátano e o pinheiro, todos juntos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “árvore de óleo”; em hebraico, literalmente, “árvore de óleo”.
    reason: lexical_alternative
  - marker: b
    text: A identificação exata das espécies traduzidas por “cipreste”, “plátano” e “pinheiro” é incerta; entre as alternativas propostas estão “zimbro” ou “abeto”, “olmo” e “buxo”, respectivamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֵּן
  choice: Porei
  rationale: Embora נָתַן tenha frequentemente o sentido de “dar”, aqui descreve árvores sendo postas em determinado lugar; “porei” é natural em português e conserva essa imagem concreta.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região desabitada ou não cultivada e, neste contexto de transformação da paisagem árida, “deserto” comunica o sentido com clareza.
- source_word: אֶרֶז
  choice: cedro
  rationale: Equivalente tradicional e lexicalmente bem estabelecido, provavelmente o cedro-do-líbano no uso bíblico.
- source_word: שִׁטָּה
  choice: acácia
  rationale: Identificação botânica amplamente aceita e termo corrente em português.
- source_word: הֲדַס
  choice: murta
  rationale: Equivalente botânico convencional e compreensível em português.
- source_word: עֵץ שָׁמֶן
  choice: oliveira
  rationale: A expressão significa literalmente “árvore de óleo”; “oliveira” é a identificação tradicional e provável, sem ocultar em nota a possibilidade da tradução mais literal.
- source_word: אָשִׂים
  choice: colocarei
  rationale: Reproduz o sentido de posicionar ou estabelecer e oferece uma variação portuguesa natural em paralelo com “porei”.
- source_word: בָּעֲרָבָה
  choice: na terra árida
  rationale: עֲרָבָה pode indicar uma estepe desértica ou a região da Arabá. O paralelismo favorece aqui o sentido comum de terreno árido, não necessariamente o topônimo.
- source_word: בְּרוֹשׁ
  choice: cipreste
  rationale: É uma tradução tradicional possível para a conífera, embora a espécie exata permaneça incerta; essa incerteza é registrada em nota.
- source_word: תִּדְהָר
  choice: plátano
  rationale: Identificação adotada em diversas traduções modernas, mas não segura; “olmo” continua sendo uma alternativa possível.
- source_word: תְאַשּׁוּר
  choice: pinheiro
  rationale: Designação contextual plausível entre as árvores enumeradas, embora “buxo” e outras identificações também tenham sido propostas.
- source_word: יַחְדָּו
  choice: todos juntos
  rationale: Expressa com naturalidade a ênfase coletiva do advérbio hebraico.
theological_decisions: []
