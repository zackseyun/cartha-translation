id: ISA.41.23
reference: Isaiah 41:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַגִּ֨ידוּ֙ הָ/אֹתִיּ֣וֹת לְ/אָח֔וֹר וְ/נֵ֣דְעָ֔ה כִּ֥י אֱלֹהִ֖ים אַתֶּ֑ם אַף תֵּיטִ֣יבוּ וְ/תָרֵ֔עוּ וְ/נִשְׁתָּ֖עָה ו/נרא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/023.yaml
  text: Declare to us the things to come afterward[a], that we may know that you are gods; indeed, do good or do harm[c][b], that we may be dismayed and see together.
translation:
  language: pt
  text: Anunciem as coisas que virão depois[a], para que saibamos que vocês são deuses. Sim, façam o bem ou o mal[b], para que fiquemos alarmados[c] e vejamos juntos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as coisas posteriores”. No contexto, a expressão se refere ao que acontecerá no futuro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “façam o bem e façam o mal”. O sentido é um desafio para que demonstrem algum poder real, seja para beneficiar, seja para prejudicar.
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico é raro e também pode transmitir a ideia de olhar com assombro ou de contemplar ao redor com temor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Anunciem
  rationale: O imperativo plural de נגד exige que os ídolos deem a conhecer algo. “Anunciem” conserva o tom público e solene do desafio profético.
- source_word: הָאֹתִיּוֹת לְאָחוֹר
  choice: as coisas que virão depois
  rationale: A expressão designa literalmente as coisas posteriores e, no contexto, desafia os ídolos a predizer o futuro. A formulação é clara sem eliminar o sentido literal.
- source_word: וְנֵדְעָה
  choice: para que saibamos
  rationale: O coortativo na primeira pessoa do plural, após o imperativo, expressa finalidade ou resultado.
- source_word: כִּי אֱלֹהִים אַתֶּם
  choice: que vocês são deuses
  rationale: O pronome e o contexto são plurais; “deuses” preserva a ironia da controvérsia contra os ídolos.
- source_word: אַף
  choice: Sim
  rationale: A partícula intensifica e faz avançar o desafio. “Sim” é enfático, natural e digno em português.
- source_word: תֵּיטִיבוּ וְתָרֵעוּ
  choice: façam o bem ou o mal
  rationale: O par desafia os ídolos a demonstrar poder efetivo, benéfico ou nocivo. “Ou” comunica em português a abrangência do par, embora o hebraico use a conjunção “e”.
- source_word: וְנִשְׁתָּעָה
  choice: para que fiquemos alarmados
  rationale: A forma verbal é rara e parece descrever uma reação de espanto, temor ou alarme diante de uma demonstração de poder. “Fiquemos alarmados” se ajusta ao desafio, enquanto a nota registra a incerteza.
- source_word: וְנִרְאֶה
  choice: e vejamos
  rationale: Mantém o verbo sem acrescentar objeto explícito, acompanhando a construção concisa do hebraico.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Reproduz diretamente o advérbio que descreve a reação coletiva dos observadores.
theological_decisions:
- issue: Tradução de אֱלֹהִים na polêmica contra os ídolos
  choice: deuses
  alternative: seres divinos; Deus
  rationale: A segunda pessoa do plural e o contexto de desafio aos ídolos favorecem claramente “deuses”. O singular “Deus” distorceria a polêmica do texto.
- issue: Natureza do desafio em “façam o bem ou o mal”
  choice: Apresentar o par como demonstração abrangente de poder
  alternative: Entender as palavras como atribuição de capacidade moral legítima aos ídolos
  rationale: O profeta desafia ironicamente os ídolos a produzir qualquer efeito, benéfico ou nocivo; a tradução não lhes concede divindade real nem resolve a ironia fora do próprio contexto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O plural “vocês” torna explícita a concordância do hebraico sem recorrer ao registro regional de “vós”. A ordem e a concisão do desafio profético foram preservadas; as ambiguidades lexicais relevantes aparecem em notas.
