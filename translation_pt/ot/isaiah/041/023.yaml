  terminology: “Deuses” é necessário no contexto polémico contra ídolos e evita a distorção de um singular teológico. “Façam o bem ou o mal” comunica idiomaticamente o desafio abrangente do par hebraico, enquanto a nota informa com precisão a coordenação literal por “e”. As notas são pertinentes, proporcionais e estão corretamente ancoradas.
