  source_fidelity: 'A tradução preserva adequadamente o desafio dirigido aos ídolos: o imperativo plural (“Anunciem”), a referência às coisas futuras, o propósito expresso pelo coortativo (“para que saibamos”), o plural “deuses” e a provocação para que produzam efeito benéfico ou nocivo. “Fiquemos alarmados” é uma opção defensável para a forma rara וְנִשְׁתָּעָה, sem ocultar a incerteza, que é registrada em nota. “Vejamos juntos” mantém a ausência de objeto expresso e o advérbio coletivo do hebraico.'
