  text: מִֽי הִגִּ֤יד מֵ/רֹאשׁ֙ וְ/נֵדָ֔עָה וּ/מִ/לְּ/פָנִ֖ים וְ/נֹאמַ֣ר צַדִּ֑יק אַ֣ף אֵין מַגִּ֗יד אַ֚ף אֵ֣ין מַשְׁמִ֔יעַ אַ֥ף אֵין שֹׁמֵ֖עַ אִמְרֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/026.yaml
  text: Who declared it from the beginning[a], so that we might know, and beforehand, so that we might say, ‘He is right’? But there was no one declaring it, no one making it heard[b], no one hearing your words.
translation:
  language: pt
  text: 'Quem anunciou desde o princípio[a], para que soubéssemos, e de antemão, para que disséssemos: “Ele tem razão”[b]? Mas não houve ninguém que anunciasse, ninguém que fizesse ouvir, ninguém que ouvisse as palavras de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde o começo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “Ele está certo”; tradicionalmente, “Ele é justo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הִגִּיד
  choice: Quem anunciou
  rationale: Mantém a força direta da pergunta retórica e o sentido do hifil de נגד, que é tornar algo conhecido ou anunciá-lo.
- source_word: מֵרֹאשׁ
  choice: desde o princípio
  rationale: Expressa a ideia temporal de uma declaração feita desde o começo, com linguagem corrente e digna.
- source_word: וְנֵדָעָה
  choice: para que soubéssemos
  rationale: O coortativo indica finalidade ou resultado; esta construção o comunica naturalmente em português.
- source_word: וּמִלְּפָנִים
  choice: ou de antemão
  rationale: Conserva o paralelismo temporal e destaca uma predição feita antecipadamente; “ou” torna clara em português a reformulação paralela implícita.
- source_word: וְנֹאמַר
  choice: para que disséssemos
  rationale: Reproduz o segundo coortativo em paralelo com “para que soubéssemos”.
- source_word: צַדִּיק
  choice: Ele tem razão
  rationale: Neste desafio de caráter judicial, o adjetivo expressa um veredito de acerto ou vindicação, não principalmente uma qualidade moral.
- source_word: אַף אֵין מַגִּיד
  choice: Mas não houve ninguém que anunciasse
  rationale: Marca a virada enfática para a negação e mantém o campo semântico da declaração pública.
- source_word: מַשְׁמִיעַ
  choice: ninguém que fizesse ouvir
  rationale: Preserva o valor causativo do hifil de שמע sem acrescentar um conteúdo que o hebraico deixa implícito.
- source_word: שֹׁמֵעַ אִמְרֵיכֶם
  choice: ninguém que ouvisse as palavras de vocês
  rationale: Mantém o particípio em paralelismo com os anteriores e traduz diretamente o plural אִמְרֵיכֶם em registro amplamente compreensível.
theological_decisions:
- issue: Referente do objeto implícito no desafio sobre a predição
  choice: Não explicitar objeto depois de “anunciou” e “anunciasse”
  alternative: “Quem anunciou isso” ou “Quem o anunciou”
  rationale: O hebraico não expressa o objeto. A omissão é possível em português e evita identificar indevidamente uma pessoa, um acontecimento ou uma declaração específica.
- issue: Sentido de צַדִּיק neste contexto
  choice: “Ele tem razão”
  alternative: “Ele é justo” ou “Ele está com a razão”
  rationale: O contexto pede um veredito sobre a veracidade de quem teria predito os fatos. A tradução escolhida conserva a dimensão de vindicação sem transformar o trecho numa afirmação sobre justiça moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A sequência repetida “ninguém que...” conserva o paralelismo enfático do hebraico. Os marcadores [a] e [b] aparecem no texto junto às expressões a que se referem.
