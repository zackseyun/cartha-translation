  text: קָרְב֥וּ רִֽיבְ/כֶ֖ם יֹאמַ֣ר יְהוָ֑ה הַגִּ֨ישׁוּ֙ עֲצֻמ֣וֹתֵי/כֶ֔ם יֹאמַ֖ר מֶ֥לֶךְ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/021.yaml
  text: Present your case,” says Yahweh[c][b][a]; “bring forward your strong arguments,” says the King of Jacob.
translation:
  language: pt
  text: “Apresentem a sua causa”, diz Yahweh[a]; “tragam seus argumentos mais fortes[b]”, diz o Rei de Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
  - marker: b
    text: Ou “apresentem suas razões mais fortes”, “suas provas” ou “suas defesas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבוּ רִיבְכֶם
  choice: Apresentem a sua causa
  rationale: A expressão reúne um imperativo de aproximação com רִיב, termo de sentido jurídico. Em português corrente, “apresentem a sua causa” comunica naturalmente a convocação forense sem perder a força imperativa.
- source_word: יֹאמַר
  choice: diz
  rationale: O imperfeito hebraico empregado como fórmula de fala profética é vertido pelo presente idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַגִּישׁוּ
  choice: tragam
  rationale: O imperativo hifil significa fazer aproximar ou apresentar. “Tragam” é claro e natural, enquanto o complemento mantém o cenário judicial.
- source_word: עֲצֻמוֹתֵיכֶם
  choice: seus argumentos mais fortes
  rationale: No contexto forense, o termo difícil aponta para razões, provas ou defesas de peso. A formulação preserva a ideia de força sem sugerir força física.
- source_word: מֶלֶךְ יַעֲקֹב
  choice: o Rei de Jacó
  rationale: Mantém a forma e a ressonância pactual da construção hebraica, sem substituir Jacó por Israel.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o caráter de nome próprio e uma nota registra a tradição de vertê-lo por “SENHOR”.
- issue: Imagem jurídica da convocação divina
  choice: Apresentem a sua causa ... tragam seus argumentos mais fortes
  alternative: Aproximem a sua disputa ... façam chegar suas coisas fortes
  rationale: A tradução explicita de modo idiomático o cenário de tribunal indicado pela combinação dos termos hebraicos, sem resolver além do necessário a variedade de sentidos possível em עֲצֻמוֹתֵיכֶם.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo e o tom de desafio judicial foram preservados; as notas registram o nome divino e a incerteza lexical relevante.
