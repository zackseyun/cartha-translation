source:
  edition: WLC
  text: מִֽי פָעַ֣ל וְ/עָשָׂ֔ה קֹרֵ֥א הַ/דֹּר֖וֹת מֵ/רֹ֑אשׁ אֲנִ֤י יְהוָה֙ רִאשׁ֔וֹן וְ/אֶת אַחֲרֹנִ֖ים אֲנִי הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/004.yaml
  text: Who has acted and done this[a], calling the generations from the beginning? I, Yahweh, am the first, and with the last ones—I am he.
translation:
  language: pt
  text: Quem agiu e fez isso, chamando as gerações desde o princípio? Eu, Yahweh, sou o primeiro e, com os últimos, sou o mesmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, com os últimos, sou eu”. A expressão hebraica é elíptica e também tem sido entendida como uma afirmação de que Yahweh está presente desde a primeira geração até as últimas.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica.
- source_word: פָעַל וְעָשָׂה
  choice: agiu e fez isso
  rationale: Mantém os dois verbos hebraicos, que juntos enfatizam uma ação eficaz; “isso” é uma explicitação idiomática que aponta para os acontecimentos anteriores.
- source_word: קֹרֵא
  choice: chamando
  rationale: O particípio hebraico expressa ação contínua ou característica; “chamando” preserva a ideia de convocar as gerações na história.
- source_word: הַדֹּרוֹת
  choice: as gerações
  rationale: Equivalente direto e natural, adequado à sucessão histórica indicada pelo contexto.
- source_word: מֵרֹאשׁ
  choice: desde o princípio
  rationale: Expressa o sentido temporal de origem ou início da história.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: רִאשׁוֹן
  choice: o primeiro
  rationale: Preserva o adjetivo predicativo que afirma a primazia e precedência de Deus.
- source_word: וְאֶת אַחֲרֹנִים
  choice: e com os últimos
  rationale: Conserva a construção elíptica, o possível sentido associativo de אֵת e o plural do hebraico, sem convertê-lo silenciosamente em “o último”.
- source_word: אֲנִי הוּא
  choice: eu sou o mesmo
  rationale: Reproduz a fórmula enfática de autoidentificação e sua ideia de identidade constante em português natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Relação de Deus com אַחֲרֹנִים (“os últimos”)
  choice: com os últimos
  alternative: eu sou o último; com a última geração
  rationale: A construção hebraica é elíptica e difícil. A tradução escolhida mantém o plural e a possível noção de presença junto às gerações finais, sem resolver a tensão como se Deus fosse explicitamente chamado de “o último” neste versículo.
- issue: Sentido de אֲנִי הוּא
  choice: eu sou o mesmo
  alternative: eu sou ele; sou eu
  rationale: “Eu sou o mesmo” comunica em português a autoidentificação enfática e a continuidade do sujeito, evitando a estranheza ou ambiguidade referencial de “eu sou ele”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação preserva o caráter retórico e solene. A formulação mantém a ambiguidade da expressão hebraica sobre “os últimos” e explica a alternativa em nota.
