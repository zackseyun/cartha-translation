revisions:
- from: Eis que fiz de você um trenó de debulhar novo e afiado, com muitas lâminas[a]. Você debulhará os montes e os triturará; reduzirá as colinas a palha.
  to: Eis que fiz de você um trenó de debulhar novo e afiado, com muitos gumes[a]. Você debulhará os montes e os triturará; tornará as colinas como a palha miúda.
  rationale: A revisão evita especificar «lâminas», mantendo a ambiguidade lexical de פִּיפִיּוֹת, e restitui tanto a comparação quanto o sentido de palha miúda de מֹץ. Não altera a imagem metafórica nem identifica os montes e as colinas com referentes extratextuais.
