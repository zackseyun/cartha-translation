  revision_rationale: A revisão evita especificar «lâminas», mantendo a ambiguidade lexical de פִּיפִיּוֹת, e restitui tanto a comparação quanto o sentido de palha miúda de מֹץ. Não altera a imagem metafórica nem identifica os montes e as colinas com referentes extratextuais.
