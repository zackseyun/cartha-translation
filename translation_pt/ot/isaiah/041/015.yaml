review_pass:
  verdict: revise
  source_fidelity: A metáfora agrícola e a sequência verbal são preservadas com precisão geral. Contudo, «reduzirá as colinas a palha» transforma a comparação hebraica («fará/pôrá as colinas como palha miúda») numa predicação mais direta e «palha» isoladamente pode sugerir palha longa, não a matéria leve resultante da debulha (מֹץ). «Muitos gumes» é mais fielmente cauteloso que «muitas lâminas», pois o hebraico não especifica lâminas como tais.
  naturalness: «Eis que», «trenó de debulhar», «debulhará» e «triturará» são claros e condizem com o registro profético. «Tornará as colinas como a palha miúda» mantém uma formulação elevada, mas inteligível, e expressa a comparação sem a interpretar além do necessário.
  terminology: «Trenó de debulhar» comunica adequadamente מוֹרַג. «Gumes» conserva a imagem de elementos cortantes sem decidir indevidamente entre bordas, dentes ou lâminas. «Palha miúda» torna explícito em linguagem acessível o sentido de מֹץ, isto é, a palha leve separada na debulha.
  issues:
  - severity: medium
    issue: «muitas lâminas» especifica demais a construção do instrumento.
    rationale: בַּעַל פִּיפִיּוֹת designa literalmente um implemento que possui «bocas/gumes»; a referência exata pode ser a bordas, dentes ou elementos serrilhados. «Gumes» preserva o dado seguro, deixando as alternativas para a nota.
  - severity: medium
    issue: «reduzirá as colinas a palha» não preserva plenamente a comparação com מֹץ.
    rationale: O hebraico diz que as colinas serão feitas como מֹץ. Além disso, «palha» pode ser entendida como o talo seco, enquanto מֹץ é a palha miúda/chaff, o resíduo leve da debulha.
  revised_text: Eis que fiz de você um trenó de debulhar novo e afiado, com muitos gumes[a]. Você debulhará os montes e os triturará; tornará as colinas como a palha miúda.
  revised_footnotes:
