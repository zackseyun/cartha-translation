source:
  edition: WLC
  text: הִנֵּ֣ה שַׂמְתִּ֗י/ךְ לְ/מוֹרַג֙ חָר֣וּץ חָדָ֔שׁ בַּ֖עַל פִּֽיפִיּ֑וֹת תָּד֤וּשׁ הָרִים֙ וְ/תָדֹ֔ק וּ/גְבָע֖וֹת כַּ/מֹּ֥ץ תָּשִֽׂים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/015.yaml
  text: Behold[a], I have made you a new sharp threshing sledge with double edges; you will thresh the mountains and crush them, and you will make the hills like chaff.
translation:
  language: pt
  text: Eis que fiz de você um trenó de debulhar novo e afiado, com muitos gumes[a]. Você debulhará os montes e os triturará; tornará as colinas como a palha miúda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “possuidor de bocas/gumes”; também pode ser entendido como “com muitos gumes cortantes” ou “com dentes serrilhados”.'
    reason: A forma e o número exatos dos elementos cortantes do instrumento não são totalmente claros; a nota preserva alternativas lexicais plausíveis.
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Marcador enfático que chama a atenção para o anúncio; conserva a força profética em português digno e corrente.
- source_word: שַׂמְתִּיךְ
  choice: fiz de você
  rationale: Expressa naturalmente a transformação metafórica indicada por שׂוּם com לְ, mantendo o resultado presente do perfeito.
- source_word: לְמוֹרַג
  choice: um trenó de debulhar
  rationale: מוֹרַג designa um implemento de debulha, especificamente uma espécie de prancha ou trenó provido de peças cortantes.
- source_word: חָרוּץ חָדָשׁ
  choice: novo e afiado
  rationale: Preserva os dois qualificativos do instrumento e sua capacidade cortante.
- source_word: בַּעַל פִּיפִיּוֹת
  choice: com muitas lâminas
  rationale: A expressão significa literalmente algo como 'possuidor de bocas/gumes'. No contexto do trenó de debulhar, 'muitas lâminas' comunica sua superfície munida de numerosos elementos cortantes sem impor a ideia incerta de apenas dois gumes.
- source_word: תָּדוּשׁ
  choice: você debulhará
  rationale: Mantém o verbo agrícola דּוּשׁ e prolonga coerentemente a metáfora do instrumento de debulha.
- source_word: הָרִים וְתָדֹק
  choice: os montes e os triturará
  rationale: Conserva a imagem concreta dos montes e traduz דקק como redução violenta a partículas pequenas.
- source_word: וּגְבָעוֹת כַּמֹּץ תָּשִׂים
  choice: reduzirá as colinas a palha
  rationale: Expressa de modo natural o resultado de שׂוּם e preserva a comparação com מֹץ, a palha leve separada na debulha.
theological_decisions:
- issue: Imagem metafórica de Israel como instrumento de debulha
  choice: Manter literalmente os montes, as colinas e a ação de debulhar.
  alternative: Explicitar os elementos como inimigos, nações ou obstáculos.
  rationale: O hebraico não identifica os referentes da metáfora neste versículo; interpretá-los no texto eliminaria uma ambiguidade genuína e reduziria sua força poética e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a solenidade profética; “trenó de debulhar” mantém a especificidade histórica do instrumento, e a nota esclarece sua característica cortante.
