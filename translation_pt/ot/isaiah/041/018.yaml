source:
  edition: WLC
  text: אֶפְתַּ֤ח עַל שְׁפָיִים֙ נְהָר֔וֹת וּ/בְ/ת֥וֹךְ בְּקָע֖וֹת מַעְיָנ֑וֹת אָשִׂ֤ים מִדְבָּר֙ לַ/אֲגַם מַ֔יִם וְ/אֶ֥רֶץ צִיָּ֖ה לְ/מוֹצָ֥אֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/018.yaml
  text: I will open rivers on the bare heights[a], and springs in the midst of the valleys; I will make the wilderness into a pool of water[b], and the dry land into springs of water.
translation:
  language: pt
  text: Abrirei rios nas colinas nuas[a] e fontes no meio dos vales; transformarei o deserto numa lagoa[b] e a terra ressequida em nascentes de água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “colinas áridas” ou “elevações sem vegetação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “num lago” ou “num charco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתַּח
  choice: Abrirei
  rationale: O qal imperfeito na primeira pessoa expressa diretamente a promessa divina; “abrirei” mantém a imagem hebraica e soa natural em português.
- source_word: שְׁפָיִים
  choice: altos desnudos
  rationale: O termo indica elevações expostas e sem vegetação; a expressão preserva tanto a altitude quanto a aridez, sem a possível conotação cultual de “lugares altos”.
- source_word: נְהָרוֹת
  choice: rios
  rationale: É o equivalente lexical comum e comunica a abundância de água evocada pelo texto.
- source_word: וּבְתוֹךְ בְּקָעוֹת
  choice: no meio dos vales
  rationale: Preserva בְּתוֹךְ, “no meio de”, e entende בְּקָעוֹת como vales ou depressões, em paralelo com os altos.
- source_word: מַעְיָנוֹת
  choice: fontes
  rationale: Designa fontes naturais de água; “fontes” é claro e corrente, além de permitir distinguir o termo de מוֹצָאֵי no segundo hemistíquio.
- source_word: אָשִׂים
  choice: transformarei
  rationale: Embora o verbo signifique literalmente “porei/farei”, no contexto com לְ ele descreve uma mudança de estado; “transformarei” expressa isso naturalmente sem acrescentar uma interpretação teológica.
- source_word: מִדְבָּר
  choice: deserto
  rationale: No contraste com a abundância de água, “deserto” comunica de modo claro uma região árida, sem exigir que seja um deserto arenoso.
- source_word: לַאֲגַם מַיִם
  choice: num lago de águas
  rationale: אֲגַם pode indicar uma massa de água, lago ou charco. “Lago de águas” mantém a imagem concreta e deixa alternativas lexicais em nota.
- source_word: אֶרֶץ צִיָּה
  choice: terra ressequida
  rationale: Comunica uma terra marcada por aridez intensa com linguagem natural e expressiva.
- source_word: לְמוֹצָאֵי מָיִם
  choice: em nascentes de água
  rationale: מוֹצָאֵי refere-se aos pontos de onde a água sai. “Nascentes de água” preserva essa noção e evita a formulação menos idiomática “saídas de água”.
theological_decisions:
- issue: Natureza das imagens de transformação
  choice: Manter a promessa divina como transformação concreta de lugares áridos mediante água abundante, em linguagem profético-poética.
  alternative: Explicitar uma renovação espiritual ou uma nova criação escatológica.
  rationale: O hebraico apresenta imagens ambientais concretas sem definir no próprio versículo se devem ser lidas literal, simbólica ou escatologicamente. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido, assim como a primeira pessoa da promessa divina. As notas registram alternativas lexicais reais sem sobrecarregar o texto principal.
