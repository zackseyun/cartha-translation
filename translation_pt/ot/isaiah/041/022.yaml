  text: יַגִּ֨ישׁוּ֙ וְ/יַגִּ֣ידוּ לָ֔/נוּ אֵ֖ת אֲשֶׁ֣ר תִּקְרֶ֑ינָה הָ/רִאשֹׁנ֣וֹת מָ֣ה הֵ֗נָּה הַגִּ֜ידוּ וְ/נָשִׂ֤ימָה לִבֵּ֨/נוּ֙ וְ/נֵדְעָ֣ה אַחֲרִיתָ֔/ן א֥וֹ הַ/בָּא֖וֹת הַשְׁמִיעֻֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/022.yaml
  text: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
translation:
  language: pt
  text: Que eles os apresentem e nos digam o que acontecerá.[a] Digam quais são as coisas passadas, para que lhes prestemos atenção[b] e conheçamos o seu desfecho;[c] ou anunciem-nos as coisas que estão por vir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que eles os tragam para a frente e nos declarem o que ocorrerá”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ponhamos o nosso coração”; a expressão significa prestar cuidadosa atenção ou consideração.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “conheçamos o seu fim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּישׁוּ
  choice: Que eles os apresentem
  rationale: O hifil de נגשׁ, no cenário de tribunal do contexto, convoca os adversários a apresentar seus ídolos ou sua causa. O objeto implícito é retomado por “os”, sem especificá-lo além do hebraico.
- source_word: וְיַגִּידוּ לָנוּ
  choice: e nos digam
  rationale: נגד no hifil significa dizer, declarar ou anunciar. “Nos digam” é natural em português moderno e mantém a força do desafio.
- source_word: אֵת אֲשֶׁר תִּקְרֶינָה
  choice: o que acontecerá
  rationale: קרה denota aquilo que acontece ou ocorre; a formulação concisa reproduz o sentido do plural implícito de modo idiomático.
- source_word: הָרִאשֹׁנוֹת מָה הֵנָּה
  choice: quais são as coisas passadas
  rationale: ראשׁון aponta aqui para acontecimentos anteriores, em contraste com os que estão por vir. A construção preserva a pergunta nominal “quais/o que são elas” sem acrescentar uma explicação interpretativa.
- source_word: הַגִּידוּ
  choice: Digam
  rationale: O imperativo de נגד é mantido com o mesmo verbo usado anteriormente, preservando a repetição retórica.
- source_word: וְנָשִׂימָה לִבֵּנוּ
  choice: para que lhes dediquemos o coração
  rationale: A tradução conserva a imagem hebraica de pôr ou aplicar o coração, mas usa uma expressão portuguesa compreensível; a nota esclarece seu valor idiomático de atenção cuidadosa.
- source_word: וְנֵדְעָה אַחֲרִיתָן
  choice: e conheçamos o seu desfecho
  rationale: אַחֲרִית pode significar fim, parte final ou resultado. “Desfecho” comunica o resultado final dos acontecimentos sem impor aqui um sentido escatológico.
- source_word: אוֹ הַבָּאוֹת
  choice: ou ... as coisas que estão por vir
  rationale: O particípio de בוא descreve as coisas vindouras e preserva o contraste temporal com “as coisas passadas”.
- source_word: הַשְׁמִיעֻנוּ
  choice: anunciem-nos
  rationale: O hifil de שׁמע é literalmente “façam-nos ouvir”, mas neste contexto significa anunciar ou dar a conhecer. “Anunciem-nos” mantém o tom formal do desafio.
