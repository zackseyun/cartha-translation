  source_fidelity: 'A tradução preserva adequadamente a sequência verbal do hebraico: perseguição, avanço sem oposição e a imagem do caminho relacionado aos pés. «Em segurança» transmite de modo idiomático o uso adverbial de שָׁלוֹם, sem reduzir o sentido a uma paz meramente subjetiva. A cláusula final, reconhecidamente difícil, é vertida segundo uma leitura contextual plausível, e a nota informa a dificuldade.'
