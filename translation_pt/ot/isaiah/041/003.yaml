base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/003.yaml
  text: He pursues them and passes on safely[a], by a path his feet had not traveled.
translation:
  language: pt
  text: Ele os persegue e avança em segurança[a], por uma vereda na qual seus pés nunca haviam passado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele os persegue e passa adiante em paz; por uma vereda pela qual seus pés não haviam passado”. A oração final em hebraico é difícil e pode destacar tanto o avanço seguro quanto o movimento por uma rota ainda não percorrida.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְדְּפֵם
  choice: Ele os persegue
  rationale: O qal imperfeito, com sufixo de terceira pessoa masculina plural, integra uma descrição profética vívida; o presente mantém a sequência narrativa e o sentido ativo de perseguição.
- source_word: יַעֲבוֹר
  choice: e avança
  rationale: O verbo עבר significa passar, atravessar ou seguir adiante. Neste contexto de progresso militar, “avança” expressa a continuação do movimento sem especificar indevidamente o que é atravessado.
- source_word: שָׁלוֹם
  choice: em segurança
  rationale: Embora o sentido básico seja “paz”, o uso adverbial aqui indica avanço seguro, sem dano nem impedimento. “Em segurança” é natural em português e conserva essa ideia.
- source_word: אֹרַח
  choice: por uma vereda
  rationale: אֹרַח designa caminho, senda ou trilha. “Vereda” preserva a imagem concreta e oferece uma ligação natural com a referência aos pés.
- source_word: בְּרַגְלָיו
  choice: seus pés
  rationale: A expressão significa literalmente “com/por seus pés”. Incorporá-la como sujeito da oração relativa mantém a imagem corporal sem produzir uma construção artificial em português.
- source_word: לֹא יָבוֹא
  choice: nunca haviam passado
  rationale: Literalmente, “não vem/entra”. Em conexão com “vereda” e “seus pés”, a frase provavelmente indica um caminho pelo qual ele antes não havia passado. “Nunca haviam passado” torna inteligível a expressão hebraica comprimida sem eliminar sua dificuldade, registrada em nota.
theological_decisions:
- issue: Interpretação de אֹרַח בְּרַגְלָיו לֹא יָבוֹא
  choice: O conquistador avança por uma vereda nunca antes percorrida por seus pés.
  alternative: Ele avança por uma vereda que seus pés não tocam, ou vem por um caminho sem usar os pés.
  rationale: O hebraico é comprimido e difícil. No contexto do avanço vitorioso do conquistador suscitado por YHWH, a leitura escolhida comunica mais naturalmente um progresso inédito e desimpedido, mas a nota preserva a formulação mais literal e a incerteza interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vereda” para conservar a imagem poética. O presente dá vivacidade à descrição profética; a nota explicita a ambiguidade real sem impor uma interpretação denominacional.
