base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/013.yaml
  text: For I am Yahweh your God[a], who takes hold of your right hand, who says to you, ‘Do not fear; I will help you.’
translation:
  language: pt
  text: 'Pois eu sou Yahweh, seu Deus, que segura a sua mão direita e lhe diz: “Não tenha medo; eu ajudarei você.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, o verbo está na forma perfeita: “eu ajudei você” ou “eu tenho ajudado você”. Aqui ele é traduzido como “eu ajudarei você” por causa da força de promessa no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da exortação anterior e preserva de modo natural a força explicativa do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Preserva a construção possessiva e a relação de aliança no discurso direto.
- source_word: מַחֲזִיק
  choice: que segura
  rationale: O particípio hifil de חזק descreve Yahweh tomando e mantendo firmemente a mão; 'segura' comunica a imagem concreta com naturalidade.
- source_word: יְמִינֶךָ
  choice: sua mão direita
  rationale: Mantém a imagem corporal específica do texto hebraico.
- source_word: הָאֹמֵר לְךָ
  choice: e lhe diz
  rationale: Reproduz a descrição participial coordenada de Yahweh em português corrente, sem perder a continuidade da ação.
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Equivalente idiomático moderno da proibição hebraica, claro e digno para leitores de diferentes regiões lusófonas.
- source_word: עֲזַרְתִּיךָ
  choice: eu ajudarei você
  rationale: Embora a forma seja morfologicamente perfeita, no contexto de garantia divina tem força promissória; o futuro comunica essa função em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Aspecto de עֲזַרְתִּיךָ na fórmula de encorajamento
  choice: 'sentido futuro-promissório: “eu ajudarei você”'
  alternative: “eu ajudei você”; “eu tenho ajudado você”
  rationale: O perfeito hebraico pode apresentar a ajuda prometida como certa. O futuro português expressa melhor a promessa no contexto, enquanto a forma verbal literal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Emprega 'você' no discurso direto para evitar a ambiguidade regional de 'te' e mantém a imagem concreta da mão direita.
