source:
  edition: WLC
  text: אַל תִּירָא֙ כִּ֣י עִמְּ/ךָ אָ֔נִי אַל תִּשְׁתָּ֖ע כִּֽי אֲנִ֣י אֱלֹהֶ֑י/ךָ אִמַּצְתִּ֨י/ךָ֙ אַף עֲזַרְתִּ֔י/ךָ אַף תְּמַכְתִּ֖י/ךָ בִּ/ימִ֥ין צִדְקִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/010.yaml
  text: Do not fear[a], for I am with you; do not look around in dread, for I am your God. I will strengthen you; surely I will help you[b]; surely I will uphold you with my righteous right hand.
translation:
  language: pt
  text: Não tenha medo, pois eu estou com você; não olhe ao redor com ansiedade,[a] pois eu sou o seu Deus. Eu o fortalecerei; sim, eu o ajudarei; sim, eu o sustentarei com a minha mão direita de justiça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fique desanimado”. O verbo hebraico provavelmente inclui a ideia de olhar ao redor com ansiedade ou alarme.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “com a minha mão direita justa”. A expressão hebraica é, literalmente, “com a mão direita da minha justiça”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Não tenha medo
  rationale: Expressa de modo direto, natural e corrente a proibição formada com ירא.
- source_word: כִּי עִמְּךָ אָנִי
  choice: pois eu estou com você
  rationale: Preserva a relação causal de כִּי e a promessa da presença divina em português claro.
- source_word: אַל תִּשְׁתָּע
  choice: não olhe ao redor, apavorado
  rationale: Conserva a provável imagem concreta de olhar em volta com ansiedade ou alarme, sem reduzi-la apenas ao estado abstrato de desânimo.
- source_word: אֲנִי אֱלֹהֶיךָ
  choice: eu sou o seu Deus
  rationale: Tradução direta da identificação pactual; אֱלֹהִים tem sentido singular neste contexto.
- source_word: אִמַּצְתִּיךָ
  choice: eu o fortalecerei
  rationale: O futuro comunica a função promissória da forma verbal no fluxo profético, mantendo o sentido de אמץ.
- source_word: אַף
  choice: sim
  rationale: A repetição de 'sim' reproduz de maneira natural a intensificação e o acúmulo retórico das garantias divinas.
- source_word: עֲזַרְתִּיךָ
  choice: eu o ajudarei
  rationale: Mantém o sentido simples de עזר e, pelo futuro, a força de promessa no contexto.
- source_word: תְּמַכְתִּיךָ
  choice: eu o sustentarei
  rationale: '''Sustentar'' expressa o apoio contínuo indicado por תמך e combina naturalmente com a imagem da mão direita.'
- source_word: בִּימִין צִדְקִי
  choice: com a minha mão direita de justiça
  rationale: Preserva de perto a relação construta do hebraico e mantém aberta a amplitude de צֶדֶק, que pode envolver justiça, retidão e fidelidade.
theological_decisions:
- issue: Sentido da expressão final בִּימִין צִדְקִי
  choice: com a minha mão direita de justiça
  alternative: com a minha mão direita justa
  rationale: A formulação principal preserva a estrutura e a tensão semântica do hebraico sem restringir צִדְקִי a uma única qualidade adjetiva; a nota oferece a expressão portuguesa mais idiomática.
- issue: Aspecto dos três verbos de garantia
  choice: 'promessas no futuro: ''fortalecerei'', ''ajudarei'', ''sustentarei'''
  alternative: 'ações perfeitas ou presentes: ''fortaleci'', ''ajudei'', ''sustentei'''
  rationale: Embora as formas hebraicas sejam formalmente perfeitas, no contexto funcionam como garantias firmes da ação divina; o futuro transmite essa força de promessa no português contemporâneo.
- issue: Gênero gramatical do destinatário singular
  choice: 'formas masculinas não marcadas no contexto: ''apavorado'', ''o fortalecerei'''
  alternative: reformular com expressões sem marca de gênero
  rationale: O hebraico dirige-se a um destinatário masculino singular, Israel/Jacó no contexto. A tradução preserva essa referência gramatical sem introduzir linguagem inclusiva ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A segunda pessoa é expressa por 'você', natural no Brasil, enquanto a cadência paralela e a repetição enfática do hebraico são preservadas.
