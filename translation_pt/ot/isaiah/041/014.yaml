  text: אַל תִּֽירְאִי֙ תּוֹלַ֣עַת יַֽעֲקֹ֔ב מְתֵ֖י יִשְׂרָאֵ֑ל אֲנִ֤י עֲזַרְתִּי/ךְ֙ נְאֻם יְהוָ֔ה וְ/גֹאֲלֵ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/014.yaml
  text: Do not fear[a], worm Jacob, men of Israel; I myself help you, declares Yahweh, your Redeemer[c][b], the Holy One of Israel.
translation:
  language: pt
  text: Não tenha medo, verme Jacó,[a] homens de Israel;[b] eu mesmo ajudo você[c] — declaração de Yahweh, seu Redentor, o Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “verme Jacó”. É uma metáfora de fraqueza, pequenez e condição humilde, não uma descrição literal.'
    reason: cultural_note
  - marker: b
    text: Ou “mortais de Israel” ou “povo de Israel”. A expressão hebraica é poética e pode destacar a fragilidade humana.
    reason: lexical_alternative
  - marker: c
    text: Ou “ajudei você”, “tenho ajudado você” ou “ajudarei você”. A forma hebraica é um perfeito, mas, neste contexto, pode funcionar como garantia profética de auxílio certo.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: A combinação de אַל com o imperfeito expressa proibição. A forma feminina singular dirige-se a Israel/Jacó como entidade coletiva; em português, a construção permanece singular e é natural.
- source_word: תּוֹלַעַת יַעֲקֹב
  choice: verme Jacó
  rationale: Preserva a metáfora direta de fraqueza e pequenez e entende יַעֲקֹב como aposto vocativo, sem suavizá-la para uma simples comparação.
- source_word: מְתֵי יִשְׂרָאֵל
  choice: homens de Israel
  rationale: מְתֵי é uma forma poética que designa homens ou mortais. A tradução direta mantém o paralelismo com 'verme Jacó'; a nota registra tanto o possível sentido coletivo como a ênfase na fragilidade humana.
- source_word: אֲנִי עֲזַרְתִּיךְ
  choice: Eu mesmo ajudo você
  rationale: O pronome explícito אֲנִי recebe valor enfático em 'Eu mesmo'. Embora עֲזַרְתִּיךְ seja formalmente perfeito, no contexto funciona como garantia profética; o presente português comunica ajuda certa sem limitá-la ao passado.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: נְאֻם é a fórmula profética de declaração, e o nome da aliança יְהוָה é transliterado como Yahweh.
- source_word: וְגֹאֲלֵךְ קְדוֹשׁ יִשְׂרָאֵל
  choice: seu Redentor, o Santo de Israel
  rationale: גֹאֵל designa aquele que resgata e reivindica como protetor ligado por obrigação. A sequência é apresentada naturalmente como títulos em aposição a Yahweh, preservando o título isaiano 'o Santo de Israel'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. A transliteração preserva o nome pessoal da aliança, em vez de substituí-lo por um título.
- issue: Força temporal de עֲזַרְתִּיךְ
  choice: ajudo você
  alternative: ajudei você; tenho ajudado você; ajudarei você
  rationale: O perfeito pode ser lido formalmente como passado, mas neste oráculo de salvação também pode expressar uma garantia profética de ação certa. A tradução principal usa o presente e a nota conserva as demais leituras legítimas.
- issue: Metáfora תּוֹלַעַת יַעֲקֹב
  choice: verme Jacó
  alternative: Jacó, fraco como um verme
  rationale: A imagem afirma de modo contundente a condição humilde e indefesa de Jacó/Israel. Mantê-la como metáfora evita reduzir sua tensão teológica a uma explicação.
- issue: Número e gênero do destinatário
  choice: Não tenha medo ... ajudo você
  alternative: Não tenham medo ... ajudo vocês
  rationale: Os verbos e sufixos hebraicos estão no feminino singular porque Jacó/Israel é tratado como coletividade personificada. O singular em português conserva essa estrutura, apesar do aposto plural 'homens de Israel'.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conservou-se o singular coletivo do hebraico e a metáfora abrupta “verme Jacó”. “Você” evita uma flexão de gênero inexistente nessa forma portuguesa e mantém a referência coletiva personificada; os títulos divinos permanecem solenes e reconhecíveis.
