  text: הֵ֣ן כֻּלָּ֔/ם אָ֥וֶן אֶ֖פֶס מַעֲשֵׂי/הֶ֑ם ר֥וּחַ וָ/תֹ֖הוּ נִסְכֵּי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/029.yaml
  text: Look[a], all of them are nothing; their works are nothing[b]. Their cast images are wind and emptiness.
translation:
  language: pt
  text: 'Vejam: todos eles não são nada; suas obras não valem coisa alguma. Suas imagens de metal fundido são vento e vazio.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Vejam
  rationale: Interjeição dêitica que chama a atenção para uma conclusão enfática; “Vejam” é atual e preserva essa força.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Mantém tanto a abrangência coletiva quanto a força pronominal explícita do hebraico, sem definir em excesso se o referente inclui ídolos, fabricantes ou ambos.
- source_word: אָוֶן
  choice: não são nada
  rationale: Neste contexto de polêmica contra os ídolos, expressa nulidade e falta de valor, mais do que perversidade ou sofrimento.
- source_word: אֶפֶס מַעֲשֵׂיהֶם
  choice: suas obras não valem coisa alguma
  rationale: Formulação predicativa natural em português que comunica a absoluta inutilidade das obras, evitando a repetição pouco idiomática de “nada”.
- source_word: רוּחַ
  choice: vento
  rationale: Em paralelo com תֹהוּ, indica algo inconsistente e fugaz; “espírito” poderia gerar uma associação teológica indevida.
- source_word: תֹהוּ
  choice: vazio
  rationale: Comunica nulidade e inutilidade neste contexto, sem restringir o termo ao caos primordial ou à ausência de forma.
- source_word: נִסְכֵּיהֶם
  choice: suas imagens de metal fundido
  rationale: Refere-se a imagens feitas por fundição ou derramamento de metal; a expressão é clara em português moderno e explicita o processo indicado pelo substantivo.
theological_decisions:
- issue: Referente da denúncia
  choice: A redação mantém “todos eles” e “suas obras” suficientemente amplos, enquanto a frase final explicita o foco nas imagens idólatras.
  alternative: Entender a denúncia como dirigida exclusivamente aos ídolos, ou conjuntamente aos fabricantes e aos ídolos.
  rationale: O contexto imediato condena a incapacidade dos ídolos de agir ou predizer, mas os sufixos plurais permitem referência mais ampla ao sistema de fabricação e culto. A tradução não resolve além do que o hebraico permite.
- issue: Natureza da nulidade atribuída aos ídolos
  choice: “não são nada” e “não valem coisa alguma” expressam sua completa impotência e inutilidade.
  alternative: Traduzir אָוֶן como “perversidade”, “desgraça” ou “vaidade”.
  rationale: O paralelismo com אֶפֶס, רוּחַ e תֹהוּ favorece aqui o sentido de nulidade e falta de valor, sem transformar a linguagem poética em uma tese metafísica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “Vejam” reproduz naturalmente o chamado público à atenção. Preserva-se o paralelismo enfático por meio de “não são nada”, “não valem coisa alguma” e “vento e vazio”.
