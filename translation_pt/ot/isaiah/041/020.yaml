  text: לְמַ֧עַן יִרְא֣וּ וְ/יֵדְע֗וּ וְ/יָשִׂ֤ימוּ וְ/יַשְׂכִּ֨ילוּ֙ יַחְדָּ֔ו כִּ֥י יַד יְהוָ֖ה עָ֣שְׂתָה זֹּ֑את וּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל בְּרָאָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/020.yaml
  text: so that they may see and know[a], and may consider and understand together, that the hand of Yahweh has done this, and the Holy One of Israel has created it.
translation:
  language: pt
  text: para que vejam e saibam, considerem e compreendam juntos, que a mão de Yahweh fez isto e que o Santo de Israel o criou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vejam e saibam, reflitam sobre isso e adquiram entendimento juntos”. Os verbos hebraicos também podem transmitir as ideias de reflexão interior e aquisição de discernimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa naturalmente propósito ou resultado em português.
- source_word: יִרְאוּ וְיֵדְעוּ
  choice: vejam e saibam
  rationale: Preserva os sentidos básicos e a progressão entre percepção e conhecimento.
- source_word: וְיָשִׂימוּ וְיַשְׂכִּילוּ
  choice: considerem e compreendam
  rationale: Transmite a reflexão interior sugerida por שׂים e a percepção inteligente de שׂכל, sem eliminar a distinção entre os verbos.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Mantém o valor coletivo ou simultâneo do advérbio hebraico.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Conserva a imagem hebraica da mão como expressão da ação e do poder divinos, bem como o nome próprio.
- source_word: עָשְׂתָה זֹּאת
  choice: fez isto
  rationale: Reproduz de modo direto o verbo amplo עשה e o demonstrativo feminino זֹאת.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: e que o Santo de Israel
  rationale: Preserva o título característico de Isaías e entende a segunda oração como conteúdo adicional do reconhecimento.
- source_word: בְּרָאָהּ
  choice: o criou
  rationale: Mantém o verbo distinto ברא, 'criar'. O pronome masculino é exigido pelo uso idiomático português ao retomar de modo geral o que foi feito, embora o hebraico tenha sufixo feminino concordante com זֹאת.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Representa o nome divino presente no texto, sem substituí-lo por um título.
- issue: Relação entre עשה e ברא
  choice: manter distintamente “fez” e “criou”
  alternative: fundir as duas expressões em uma única ação
  rationale: O hebraico emprega dois verbos diferentes, cuja plenitude retórica deve ser preservada sem impor uma distinção doutrinária adicional.
- issue: Sequência dos quatro verbos cognitivos
  choice: vejam e saibam, considerem e compreendam
  alternative: vejam e reconheçam, levem a sério e adquiram entendimento
  rationale: Mantém a acumulação e a progressão cognitiva do original em português natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Todos” torna natural em português o sujeito plural implícito e o caráter coletivo de יַחְדָּו; a nota registra nuances lexicais sem resolver excessivamente a sobreposição dos verbos.
