  source_fidelity: 'A tradução preserva adequadamente a progressão do hebraico: a partícula de chamada de atenção (הֵן), a dupla de vergonha/humilhação, o particípio de hostilidade irada, a imagem de se tornarem «como nada» e o perecimento dos homens envolvidos na contenda. Os futuros portugueses refletem bem o anúncio profético.'
