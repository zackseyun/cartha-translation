  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵ֤ן יֵבֹ֨שׁוּ֙ וְ/יִכָּ֣לְמ֔וּ כֹּ֖ל הַ/נֶּחֱרִ֣ים בָּ֑/ךְ יִֽהְי֥וּ כְ/אַ֛יִן וְ/יֹאבְד֖וּ אַנְשֵׁ֥י רִיבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/011.yaml
  text: Behold[a], all who are enraged against you will be put to shame and humiliated; they will become as nothing, and the men who contend with you will perish.
translation:
  language: pt
  text: Eis que todos os que se enfurecem contra você[a] ficarão envergonhados e serão humilhados; serão como nada, e os homens que contendem com você perecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que estão irados com você”. O particípio hebraico tem o sentido literal de “os que ardem contra você”, expressão idiomática para ira.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Mantém a função de chamar a atenção e reforçar a certeza do anúncio profético, em linguagem digna e ainda corrente.
- source_word: יֵבֹשׁוּ
  choice: ficarão envergonhados
  rationale: Expressa o resultado público de vergonha e desonra indicado por בוש, sem o limitar a um sentimento interior.
- source_word: וְיִכָּלְמוּ
  choice: e serão humilhados
  rationale: Preserva o segundo verbo e a intensificação paralela, distinguindo-o do primeiro sem recorrer a vocabulário arcaico.
- source_word: הַנֶּחֱרִים בָּךְ
  choice: os que se enfurecem contra você
  rationale: O particípio de חרה evoca literalmente o ardor da ira; a formulação portuguesa transmite sua intensidade e o sentido hostil da preposição.
- source_word: יִהְיוּ כְאַיִן
  choice: serão como nada
  rationale: Reproduz de perto tanto o verbo futuro quanto a comparação introduzida por כ, preservando a imagem hebraica de nulidade.
- source_word: וְיֹאבְדוּ
  choice: perecerão
  rationale: Mantém o sentido intransitivo comum do qal de אבד e evita introduzir explicitamente um agente destruidor.
- source_word: אַנְשֵׁי רִיבֶךָ
  choice: os homens que contendem com você
  rationale: Conserva o substantivo masculino אַנְשֵׁי e comunica a nuance de disputa ou conflito presente em ריב.
theological_decisions:
- issue: Expressão marcada por gênero em אַנְשֵׁי רִיבֶךָ
  choice: os homens que contendem com você
  alternative: os que contendem com você
  rationale: O hebraico emprega explicitamente o substantivo masculino plural 'homens'; a tradução o preserva, pois o contexto não exige sua neutralização.
- issue: Força da promessa de reversão divina
  choice: 'futuros indicativos: “ficarão”, “serão” e “perecerão”'
  alternative: formas modais como “que fiquem” ou “talvez venham a ser”
  rationale: As formas verbais hebraicas apresentam o resultado anunciado com certeza profética; a tradução não enfraquece nem explicita além do texto a agência divina.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Eis que” preserva a força profética; “contendem” mantém a nuance de conflito de ריב sem soar excessivamente técnico. O tratamento por “você” também evita impor em português uma interpretação à alternância formal do hebraico entre sufixos de segunda pessoa feminino e masculino.
