source:
  edition: WLC
  text: הַחֲרִ֤ישׁוּ אֵלַ/י֙ אִיִּ֔ים וּ/לְאֻמִּ֖ים יַחֲלִ֣יפוּ כֹ֑חַ יִגְּשׁוּ֙ אָ֣ז יְדַבֵּ֔רוּ יַחְדָּ֖ו לַ/מִּשְׁפָּ֥ט נִקְרָֽבָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/001.yaml
  text: Be silent before me[a], coastlands; let the peoples renew their strength. Let them come near; then let them speak[c][b]. Together let us draw near for judgment.
translation:
  language: pt
  text: “Calem-se diante de mim, terras costeiras[a]; que os povos renovem as suas forças[b]. Que se aproximem e então falem. Juntos, aproximemo-nos para o julgamento[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilhas” ou “litorais distantes”; o termo hebraico pode designar amplamente terras marítimas ou regiões costeiras distantes.
    reason: lexical_alternative
  - marker: b
    text: Ou “adquiram novas forças”; a expressão hebraica envolve literalmente trocar ou renovar a força.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica reflete um contexto jurídico ou de tribunal, sem especificar se “julgamento” se refere ao processo, à decisão ou à justiça exercida.
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲרִישׁוּ אֵלַי
  choice: Calem-se diante de mim
  rationale: O imperativo plural exige silêncio no contexto de uma convocação divina. “Diante de mim” expressa naturalmente em português a relação indicada por אֵלַי sem acrescentar explicitamente a ideia de escutar.
- source_word: אִיִּים
  choice: terras costeiras
  rationale: Em Isaías, o termo pode abranger ilhas, litorais e regiões marítimas distantes. “Terras costeiras” comunica esse alcance melhor do que apenas “ilhas”.
- source_word: וּלְאֻמִּים
  choice: os povos
  rationale: O plural designa povos ou nações. “Os povos” preserva o paralelismo e evita restringir a referência a Estados nacionais.
- source_word: יַחֲלִיפוּ כֹחַ
  choice: renovem as suas forças
  rationale: A expressão idiomática indica renovação ou substituição da força; a formulação escolhida é clara e mantém a imagem do hebraico.
- source_word: יִגְּשׁוּ
  choice: Que se aproximem
  rationale: O imperfeito tem força volitiva ou jussiva na sequência da convocação, não sendo mero futuro.
- source_word: אָז יְדַבֵּרוּ
  choice: e então falem
  rationale: 'Mantém a sequência explícita: primeiro os povos se aproximam, depois falam, sem ampliar o verbo para “apresentem sua causa”.'
- source_word: יַחְדָּו
  choice: Juntos
  rationale: Preserva a ideia de ação conjunta e sua ligação natural com a exortação seguinte.
- source_word: לַמִּשְׁפָּט
  choice: para o julgamento
  rationale: O termo tem aqui sentido forense, mas pode envolver o processo judicial, a decisão ou o exercício da justiça; “julgamento” preserva essa amplitude relativa.
- source_word: נִקְרָבָה
  choice: aproximemo-nos
  rationale: A forma coortativa na primeira pessoa do plural inclui o locutor e conserva a força de convite solene.
theological_decisions:
- issue: Cenário forense do versículo
  choice: Traduzir como uma convocação divina para um confronto judicial, sem inserir uma paráfrase explícita de tribunal.
  alternative: Entender apenas como um chamado geral para que as nações escutem, ou traduzir diretamente como “compareçamos ao tribunal”.
  rationale: A sequência de silêncio, fortalecimento, aproximação, fala e julgamento sustenta o cenário forense. A redação mantém esse cenário sem definir além do que o hebraico declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” está implícito nas formas verbais, e evitou-se tanto linguagem arcaica quanto uma explicitação excessiva do cenário judicial.
