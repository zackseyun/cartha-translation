id: ISA.41.8
reference: Isaiah 41:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּה֙ יִשְׂרָאֵ֣ל עַבְדִּ֔/י יַעֲקֹ֖ב אֲשֶׁ֣ר בְּחַרְתִּ֑י/ךָ זֶ֖רַע אַבְרָהָ֥ם אֹהֲבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/008.yaml
  text: But you[a], Israel, my servant, Jacob, whom I have chosen, offspring of Abraham, my friend—
translation:
  language: pt
  text: Mas você, Israel, meu servo, Jacó, a quem escolhi, descendência de Abraão, meu amigo[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “aquele que me ama”.
    reason: Leitura alternativa possível da forma hebraica אֹהֲבִי.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas você
  rationale: A conjunção seguida do pronome independente assinala contraste enfático com as nações e os idólatras do contexto; “Mas você” expressa isso com naturalidade em português.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém-se a forma tradicional do nome próprio em português.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Embora עבד também possa indicar escravo, aqui funciona como título da relação de Israel com Deus; “servo” é natural e contextualmente apropriado.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Emprega-se a forma tradicional portuguesa do nome, em aposição a Israel.
- source_word: אֲשֶׁר בְּחַרְתִּיךָ
  choice: a quem escolhi
  rationale: A oração relativa se refere a Jacó/Israel. O pretérito perfeito comunica adequadamente em português a ação concluída de Deus sem excluir seus efeitos contínuos.
- source_word: זֶרַע אַבְרָהָם
  choice: descendência de Abraão
  rationale: זֶרַע é um singular coletivo. “Descendência” preserva esse caráter coletivo e soa mais natural no português atual do que “semente”.
- source_word: אֹהֲבִי
  choice: meu amigo
  rationale: O particípio com sufixo de primeira pessoa pode significar literalmente “aquele que me ama”, mas, ao caracterizar Abraão, também exprime idiomaticamente uma relação de amizade. A leitura literal é preservada em nota.
theological_decisions:
- issue: Sentido de אֹהֲבִי em referência a Abraão
  choice: meu amigo
  alternative: aquele que me ama
  rationale: “Meu amigo” comunica de modo claro o sentido relacional provável no contexto sem acrescentar doutrina. Como a forma hebraica também admite a leitura mais literal “aquele que me ama”, a ambiguidade genuína é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura apositiva do hebraico foi mantida, bem como o travessão final, que deixa a declaração em continuidade com o versículo seguinte.
