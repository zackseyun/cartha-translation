  yaml_path: translation/ot/isaiah/041/012.yaml
  text: You will seek them and not find them—those men who contend with you[a]. The men who wage war against you will become like nothing[b], like nonexistence.
translation:
  language: pt
  text: Você os procurará e não os encontrará — os homens que contendem com você[a]. Os homens que fazem guerra contra você se tornarão como nada[b], como inexistência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os homens da sua contenda”; isto é, os que contendem ou discutem com você.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “como nada e como אֶפֶס”; o segundo termo também pode ser traduzido como “completa nulidade” ou “inexistência”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַקְשֵׁם
  choice: Você os procurará
  rationale: O piel de בקש expressa procurar ou buscar. “Procurará” forma um par natural e claro com “não os encontrará” em português.
- source_word: וְלֹא תִמְצָאֵם
  choice: mas não os encontrará
  rationale: מצא no qal significa “encontrar”. A conjunção adversativa “mas” explicita em português o contraste inerente entre procurar e não encontrar.
- source_word: אַנְשֵׁי מַצֻּתֶךָ
  choice: os homens que contendem com você
  rationale: A expressão construta significa literalmente “homens da sua contenda”. A formulação verbal preserva tanto a referência pessoal quanto o sentido de disputa ou contenda.
- source_word: יִהְיוּ
  choice: se tornarão
  rationale: היה pode significar “ser” ou “tornar-se”. Neste contexto, “se tornarão” comunica a mudança de condição dos inimigos reduzidos a nada.
- source_word: כְאַיִן
  choice: como nada
  rationale: אַיִן denota ausência, inexistência ou nada; “como nada” conserva a partícula comparativa כ e soa natural.
- source_word: וּכְאֶפֶס
  choice: como se não existissem
  rationale: אֶפֶס pode indicar inexistência, nulidade ou completa insignificância. A oração idiomática preserva a intensificação do paralelismo sem repetir simplesmente “nada”.
- source_word: אַנְשֵׁי מִלְחַמְתֶּךָ
  choice: Os homens que guerreiam contra você
  rationale: Literalmente, “homens da sua guerra”; no contexto, são os que travam guerra contra o destinatário. “Guerreiam contra você” torna clara essa relação adversativa.
theological_decisions:
- issue: Grau de literalidade nas expressões paralelas sobre o desaparecimento dos inimigos
  choice: Preservar a imagem concreta de procurá-los sem encontrá-los e distinguir os dois termos finais como “como nada” e “como se não existissem”.
  alternative: Traduzir ambos os substantivos por “nada” ou parafrasear como “desaparecerão completamente”.
  rationale: A tradução mantém o paralelismo crescente do hebraico e a retórica de julgamento, sem transformar a linguagem poética numa afirmação metafísica mais específica sobre aniquilação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão mantém a aposição explicativa da primeira metade, e a repetição de “os homens” preserva a estrutura poética hebraica.
