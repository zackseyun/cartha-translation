source:
  edition: WLC
  text: וַ/יְחַזֵּ֤ק חָרָשׁ֙ אֶת צֹרֵ֔ף מַחֲלִ֥יק פַּטִּ֖ישׁ אֶת ה֣וֹלֶם פָּ֑עַם אֹמֵ֤ר לַ/דֶּ֨בֶק֙ ט֣וֹב ה֔וּא וַ/יְחַזְּקֵ֥/הוּ בְ/מַסְמְרִ֖ים לֹ֥א יִמּֽוֹט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/007.yaml
  text: The craftsman strengthens the metalworker[a]; the one who smooths with the hammer strengthens the one who strikes the anvil, saying of the soldering, “It is good”[b]; then he fastens it with nails so that it will not totter.
translation:
  language: pt
  text: 'O artesão fortalece o trabalhador de metais; o que alisa com o martelo fortalece o que golpeia a bigorna, dizendo a respeito da soldagem: “Está boa”[a]. Depois, fixa-o com pregos, para que não vacile[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da junção”, “da solda” ou, menos provavelmente, “da cola”. O termo hebraico pode indicar o processo ou o material usado para unir as partes do objeto.
    reason: lexical_alternative
  - marker: b
    text: Ou “para que não se mova” ou “para que não tombe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: fortalece
  rationale: Preserva o sentido básico intensivo de חזק e permite tanto a ideia de apoio entre os artífices quanto a de reforço prático, sem reduzir o verbo apenas a encorajamento verbal.
- source_word: חָרָשׁ
  choice: artesão
  rationale: Termo amplo e natural para um trabalhador especializado, mantendo a distinção em relação ao profissional de metal mencionado em seguida.
- source_word: צֹרֵף
  choice: trabalhador de metais
  rationale: Expressa de modo abrangente quem funde, refina ou trabalha metais, sem especificar indevidamente que se trata de um ourives.
- source_word: מַחֲלִיק פַּטִּישׁ
  choice: o que alisa com o martelo
  rationale: Traduz a ação participial com clareza e conserva a imagem concreta da oficina.
- source_word: הוֹלֶם פָּעַם
  choice: o que golpeia a bigorna
  rationale: A leitura de פעם como bigorna ou superfície de impacto se ajusta ao cenário de trabalho em metal; 'golpeia' comunica os golpes repetidos.
- source_word: לַדֶּבֶק
  choice: a respeito da soldagem
  rationale: No contexto metalúrgico, 'soldagem' comunica naturalmente o processo de unir as partes, embora o hebraico também possa designar a junção ou o material de união.
- source_word: טוֹב הוּא
  choice: Está boa
  rationale: Mantém a avaliação breve e direta; a concordância feminina decorre do substantivo português 'soldagem'.
- source_word: וַיְחַזְּקֵהוּ בְמַסְמְרִים
  choice: Depois, fixa-o com pregos
  rationale: O segundo emprego de חזק descreve a estabilização física do objeto. O pronome masculino preserva o referente implícito do hebraico sem inserir 'ídolo' no texto.
- source_word: לֹא יִמּוֹט
  choice: para que não vacile
  rationale: '''Vacile'' preserva a noção de perder a firmeza ou oscilar e mantém a ironia de um objeto fabricado que precisa ser estabilizado.'
theological_decisions:
- issue: Representação satírica da fabricação de uma imagem
  choice: Descrever a cooperação dos artífices e a fixação do objeto sem acrescentar a palavra 'ídolo'.
  alternative: Explicitar 'ídolo' ou 'imagem' para identificar o objeto.
  rationale: O contexto identifica o objeto, mas o versículo hebraico deixa seu referente implícito. Manter o pronome preserva tanto a concisão quanto a ironia profética sem expansão interpretativa.
- issue: Sentido da cooperação expressa por חזק
  choice: Usar 'fortalece', preservando a amplitude entre encorajar e dar firmeza.
  alternative: Usar 'encoraja', limitando a ação ao apoio verbal ou moral.
  rationale: O contexto anterior favorece a ideia de incentivo mútuo, enquanto o ambiente de fabricação também admite um matiz prático. A tradução conserva essa tensão lexical.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela dos dois artífices foi preservada; 'trabalhador de metais' evita a especificação não exigida de 'ourives', e o pronome em 'fixa-o' mantém implícito o objeto, como no hebraico.
