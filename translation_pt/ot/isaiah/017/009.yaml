  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִהְי֣וּ עָרֵ֣י מָעֻזּ֗/וֹ כַּ/עֲזוּבַ֤ת הַ/חֹ֨רֶשׁ֙ וְ/הָ֣/אָמִ֔יר אֲשֶׁ֣ר עָזְב֔וּ מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיְתָ֖ה שְׁמָמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/009.yaml
  text: In that day his fortified cities will be like the deserted places of the forest and the treetop[a], which they abandoned before the sons of Israel[b]; and it will become a desolation.
translation:
  language: pt
  text: Naquele dia, suas cidades fortificadas serão como os lugares abandonados no bosque e nas copas das árvores[a], que abandonaram diante dos filhos de Israel[b]; e se tornarão uma desolação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no ramo mais alto”. O termo hebraico designa o topo ou a parte mais alta de uma árvore.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa dos filhos de Israel”. A expressão hebraica pode indicar que alguém se retirou da presença deles.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי מָעֻזּוֹ
  choice: suas cidades fortificadas
  rationale: O construto significa literalmente “cidades de sua fortaleza”; a forma adjetival é natural em português e preserva o sufixo masculino singular, cujo referente contextual é a entidade nacional mencionada anteriormente.
- source_word: כַּעֲזוּבַת
  choice: como os lugares abandonados
  rationale: A forma derivada de עזב expressa abandono ou algo deixado. O plural idiomático em português comunica claramente a imagem espacial sem eliminar a ideia de abandono.
- source_word: הַחֹרֶשׁ
  choice: no bosque
  rationale: חֹרֶשׁ pode designar bosque, mata ou vegetação cerrada. “Bosque” conserva a imagem arbórea e combina naturalmente com o termo seguinte.
- source_word: וְהָאָמִיר
  choice: e no alto das árvores
  rationale: אָמִיר designa a parte superior de uma árvore, seu topo ou ramo mais alto. A expressão portuguesa é compreensível e mantém a referência arbórea; a alternativa mais literal consta em nota.
- source_word: אֲשֶׁר עָזְבוּ
  choice: que foram deixados
  rationale: Embora o hebraico tenha verbo ativo plural com sujeito não expresso, o passivo em português evita introduzir um agente não identificado e permite que a oração retome naturalmente os lugares. A indeterminação do agente é preservada.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: diante dos filhos de Israel
  rationale: מִפְּנֵי pode indicar afastamento da presença de alguém e também assumir nuance causal. “Diante de” preserva mais diretamente a imagem espacial, enquanto a leitura causal é registrada em nota.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: e haverá desolação
  rationale: A construção predicativa anuncia o estado resultante de devastação. “Haverá desolação” é natural em português, mantém o valor futuro e evita forçar se o sentido é simplesmente estado ou transição.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: É a fórmula temporal profética corrente e sua correspondência natural em português.
theological_decisions:
- issue: Expressão étnica בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel / israelitas
  rationale: A tradução conserva a forma masculina e a ressonância intertextual da expressão hebraica tradicional, sem negar que ela funciona como designação coletiva do povo.
- issue: Relação expressa por מִפְּנֵי
  choice: diante dos filhos de Israel
  alternative: por causa dos filhos de Israel
  rationale: A opção principal preserva a linguagem de retirada perante a presença de Israel. Como o hebraico também pode ser entendido causalmente, essa possibilidade é mantida em nota, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom profético e a ambiguidade da locução hebraica מִפְּנֵי. Todos os marcadores de nota aparecem no texto principal.
