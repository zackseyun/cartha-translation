  naturalness: A revisão mantém português moderno e claro. «No alto das árvores» é compreensível, mas «nas copas das árvores» torna mais natural a imagem de אָמִיר sem perder a nota para a alternativa mais literal.
  terminology: «Cidades fortificadas», «filhos de Israel» e «desolação» são adequados e consistentes com o hebraico e com o registro profético. A nota b preserva corretamente a possível nuance causal de מִפְּנֵי.
