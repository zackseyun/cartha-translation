  naturalness: «Não voltará os olhos para» é compreensível, mas «não olhará com atenção para» é mais natural no português moderno e comunica melhor o sentido contextual de atenção devocional. «Nem considerará» mantém um paralelismo fluente e solene sem repetir «olhar».
  terminology: «Aserá» é uma forma portuguesa adequada. Para חַמָּנִים, «colunas solares» conserva a provável referência solar e continua suficientemente cautelosa, enquanto a nota registra as alternativas discutidas. Não se deve afirmar «altares de incenso» como sentido principal, pois isso é incerto.
