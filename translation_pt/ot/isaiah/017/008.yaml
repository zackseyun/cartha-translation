  text: וְ/לֹ֣א יִשְׁעֶ֔ה אֶל הַֽ/מִּזְבְּח֖וֹת מַעֲשֵׂ֣ה יָדָ֑י/ו וַ/אֲשֶׁ֨ר עָשׂ֤וּ אֶצְבְּעֹתָי/ו֙ לֹ֣א יִרְאֶ֔ה וְ/הָ/אֲשֵׁרִ֖ים וְ/הָ/חַמָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/008.yaml
  text: And he will not look to the altars[a], the work of his hands[b], and he will not regard what his fingers have made—the Asherim and the incense altars.
translation:
  language: pt
  text: 'Ele não olhará com atenção para os altares, obra de suas mãos, nem considerará o que seus dedos fizeram: os objetos de culto de Aserá[a] e as colunas solares[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico asherim, plural de um termo que designa objetos ligados ao culto de Aserá; talvez postes sagrados.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é incerto, mas provavelmente se refere a objetos relacionados ao sol; pode designar colunas ou imagens solares, ou altares de incenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁעֶה
  choice: voltará os olhos para
  rationale: Neste contexto, o verbo indica dirigir a atenção, a confiança ou a devoção a algo, e não apenas vê-lo. A expressão é natural em português e conserva essa dimensão relacional.
- source_word: הַמִּזְבְּחוֹת
  choice: os altares
  rationale: O substantivo designa diretamente altares; não é necessário acrescentar uma especificação ausente no hebraico.
- source_word: מַעֲשֵׂה יָדָיו
  choice: obra de suas mãos
  rationale: Mantém a imagem hebraica e a ênfase profética em objetos fabricados pelo próprio ser humano.
- source_word: וַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: o que seus dedos fizeram
  rationale: Reproduz de modo claro e natural a imagem concreta do texto hebraico.
- source_word: יִרְאֶה
  choice: dará atenção
  rationale: Embora o sentido básico seja “ver”, o paralelismo com יִשְׁעֶה indica olhar com consideração ou interesse. Esta formulação evita uma repetição mecânica e preserva o sentido contextual.
- source_word: הָאֲשֵׁרִים
  choice: os objetos de culto de Aserá
  rationale: O plural se refere a objetos ligados ao culto de Aserá, mas sua forma exata não é certa. A tradução comunica sua função sem limitá-los necessariamente a postes.
- source_word: הַחַמָּנִים
  choice: as colunas de culto
  rationale: O termo designa objetos cúlticos cuja forma e função exatas são discutidas, possivelmente colunas ou imagens solares, ou ainda altares de incenso. A escolha mantém a concretude sem apresentar como certa uma identificação incerta.
theological_decisions:
- issue: Representação dos objetos de culto pagão na denúncia profética
  choice: Nomear os objetos concretos de culto sem substituí-los genericamente por “ídolos” e explicitar em notas a incerteza lexical.
  alternative: Traduzir interpretativamente como “postes de Aserá” e “altares de incenso”, ou generalizar ambos como “ídolos”.
  rationale: O versículo condena a atenção devocional dada a obras humanas. Manter os objetos concretos e a linguagem das mãos e dos dedos deixa a própria formulação profética expressar essa crítica, sem importar uma identificação arqueológica ou teológica mais específica do que a evidência permite.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção “voltará os olhos para” comunica atenção devocional; as notas preservam a incerteza dos dois termos cúlticos.
