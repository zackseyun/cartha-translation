  text: וְ/הָיָ֗ה כֶּֽ/אֱסֹף֙ קָצִ֣יר קָמָ֔ה וּ/זְרֹע֖/וֹ שִׁבֳּלִ֣ים יִקְצ֑וֹר וְ/הָיָ֛ה כִּ/מְלַקֵּ֥ט שִׁבֳּלִ֖ים בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/005.yaml
  text: And it will be as when one gathers standing grain at harvest[a], and his arm reaps the ears[b]; and it will be as when one gleans ears in the Valley of Rephaim.
translation:
  language: pt
  text: Será como quando alguém ajunta o cereal em pé na colheita, e seu braço ceifa as espigas[a]; será como quando alguém respiga espigas no vale de Refaim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cabeças de cereal”.'
    reason: lexical_alternative
  - marker: b
    text: Refaim é um nome geográfico; alternativamente, o nome tem sido relacionado a “gigantes”.
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּאֱסֹף
  choice: como quando alguém ajunta
  rationale: O infinitivo construto com כְּ introduz uma comparação. O sujeito indefinido torna a expressão natural em português sem especificar uma pessoa ausente do hebraico.
- source_word: קָצִיר
  choice: na colheita
  rationale: Neste contexto, o termo indica a ocasião da colheita; a locução preserva o cenário agrícola e evita identificar explicitamente um ceifeiro onde o texto pode permanecer genérico.
- source_word: קָמָה
  choice: o cereal em pé
  rationale: Designa a plantação de cereal ainda erguida no campo. A formulação é clara e evita o sentido moderno mais restrito de termos como “milho”.
- source_word: וּזְרֹעוֹ
  choice: e seu braço
  rationale: Mantém a referência corporal explícita e a imagem vívida do trabalho de ceifar.
- source_word: שִׁבֳּלִים
  choice: as espigas
  rationale: O substantivo designa espigas ou cabeças de cereal. “Espigas” é a forma agrícola mais natural e reconhecível em português.
- source_word: יִקְצוֹר
  choice: ceifa
  rationale: É o verbo próprio para cortar e colher cereais, preservando a imagem e o paralelismo verbal.
- source_word: כִּמְלַקֵּט
  choice: como quando alguém recolhe
  rationale: O particípio de לקט descreve a coleta do que resta no campo. “Recolhe” comunica naturalmente a ação; o contexto das espigas sugere a respiga sem exigir um termo técnico pouco corrente.
- source_word: בְּעֵמֶק רְפָאִים
  choice: no vale de Refaim
  rationale: Refaim é tratado como topônimo e transliterado segundo a forma portuguesa usual, sem incorporar ao texto uma interpretação etimológica.
theological_decisions:
- issue: Sentido de רְפָאִים no topônimo
  choice: Refaim
  alternative: Gigantes
  rationale: Como a expressão é um nome geográfico, a transliteração preserva o topônimo e evita decidir no texto por uma possível associação etimológica com “gigantes”.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A repetição “será como quando” conserva a estrutura comparativa hebraica; “cereal em pé” mantém a precisão da imagem agrícola.
