  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/עֵ֥ת עֶ֨רֶב֙ וְ/הִנֵּ֣ה בַלָּהָ֔ה בְּ/טֶ֥רֶם בֹּ֖קֶר אֵינֶ֑/נּוּ זֶ֚ה חֵ֣לֶק שׁוֹסֵ֔י/נוּ וְ/גוֹרָ֖ל לְ/בֹזְזֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/014.yaml
  text: At evening time, look—terror! Before morning, he is no more. This is the portion of those who plunder us, and the lot of those who loot us.
translation:
  language: pt
  text: 'Ao cair da tarde, eis: terror! Antes do amanhecer, ele já não existe. Essa é a porção dos que nos saqueiam e o destino dos que nos despojam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵת עֶרֶב
  choice: Ao cair da tarde
  rationale: Expressa com naturalidade o momento do entardecer indicado pelo hebraico, sem alterar a progressão temporal do verso.
- source_word: וְהִנֵּה בַלָּהָה
  choice: 'vejam: terror!'
  rationale: Preserva a partícula de chamada de atenção e o impacto abrupto de בַלָּהָה.
- source_word: אֵינֶנּוּ
  choice: eles já não existem
  rationale: O sufixo hebraico é formalmente singular, mas pode retomar coletivamente o inimigo descrito no contexto; o plural torna explícita essa referência coletiva em português sem introduzir identidade específica.
- source_word: חֵלֶק
  choice: porção
  rationale: Mantém a imagem distributiva de aquilo que cabe aos saqueadores.
- source_word: גוֹרָל
  choice: destino
  rationale: Comunica o resultado que lhes cabe; neste paralelismo, é mais natural em português do que o literal 'sorte'.
- source_word: שׁוֹסֵינוּ ... בֹזְזֵינוּ
  choice: os que nos saqueiam ... os que nos despojam
  rationale: Reproduz o paralelismo com dois verbos portugueses próximos, mas distintos, ligados à pilhagem.
theological_decisions:
- issue: Número do referente em אֵינֶנּוּ
  choice: eles já não existem
  alternative: ele já não existe
  rationale: Embora a forma seja singular, o contexto anterior descreve povos/inimigos como uma massa coletiva. O plural idiomático evita um referente masculino individual pouco claro em português, preservando o sentido coletivo.
- issue: Sentido de גוֹרָל
  choice: destino
  alternative: sorte
  rationale: Aqui o termo indica aquilo que foi determinado ou reservado aos saqueadores, sem exigir uma formulação técnica sobre predestinação nem sugerir mero acaso.
translation_notes:
  register: Português moderno, claro e solene, com cadência breve e enfática. A exclamação central preserva a virada súbita entre o terror noturno e o desaparecimento dos inimigos antes da manhã.
