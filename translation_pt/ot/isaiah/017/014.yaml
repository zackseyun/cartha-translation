  naturalness: '«Ao cair da tarde» e o paralelismo «nos saqueiam ... nos despojam» são naturais e adequados. «Eis: terror!» reproduz melhor, em português solene e idiomático, a interjeição demonstrativa וְהִנֵּה do que o imperativo plural «vejam».'
