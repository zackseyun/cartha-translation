  text: בְּ/י֤וֹם נִטְעֵ/ךְ֙ תְּשַׂגְשֵׂ֔גִי וּ/בַ/בֹּ֖קֶר זַרְעֵ֣/ךְ תַּפְרִ֑יחִי נֵ֥ד קָצִ֛יר בְּ/י֥וֹם נַחֲלָ֖ה וּ/כְאֵ֥ב אָנֽוּשׁ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/011.yaml
  text: On the day you plant[a], you make it grow luxuriantly; and in the morning you make your seed sprout[b]. But the harvest flees away in a day of grief and incurable pain.
translation:
  language: pt
  text: No dia do seu plantio, você o fará crescer viçoso; pela manhã, fará sua semente brotar. Mas a colheita desaparecerá[a] num dia de aflição[b] e de dor incurável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “um monte de colheita”. A expressão hebraica é difícil; נֵד pode indicar um “monte”, mas também é entendido aqui como referência ao desaparecimento ou à remoção da colheita.
    reason: lexical_alternative
  - marker: b
    text: Ou “num dia de enfermidade” ou “num dia de sofrimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְעֵךְ
  choice: seu plantio
  rationale: O hebraico traz um substantivo com sufixo de segunda pessoa do singular. “Seu plantio” preserva essa forma e mantém a imagem agrícola com naturalidade em português.
- source_word: תְּשַׂגְשֵׂגִי
  choice: você o fará crescer viçoso
  rationale: A forma verbal se dirige a uma pessoa no feminino singular e descreve crescimento exuberante. O pronome “o” retoma “plantio”; “viçoso” comunica a ideia de florescimento abundante.
- source_word: זַרְעֵךְ תַּפְרִיחִי
  choice: fará sua semente brotar
  rationale: O hifil de פרח é causativo. “Fará [...] brotar” é natural no contexto de sementes e conserva o sentido de crescimento provocado e rápido.
- source_word: נֵד קָצִיר
  choice: a colheita desaparecerá
  rationale: נֵד é difícil neste contexto. A tradução principal entende a expressão como a remoção ou perda repentina da colheita esperada; a leitura concreta “montão de colheita” é preservada em nota.
- source_word: בְּיוֹם נַחֲלָה
  choice: num dia de aflição
  rationale: Aqui נַחֲלָה provavelmente denota calamidade, enfermidade ou sofrimento, em paralelo com “dor incurável”. “Aflição” mantém a amplitude sem limitar o sentido à doença física.
- source_word: וּכְאֵב אָנֽוּשׁ
  choice: e de dor incurável
  rationale: כאב significa “dor”, e אנושׁ pode indicar algo grave, desesperador ou incurável. “Dor incurável” expressa a intensidade e a falta de esperança da frase.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A segunda pessoa feminina do hebraico não é marcada em “você”, evitando acrescentar uma identificação não explicitada neste versículo. A ambiguidade de נֵד קָצִיר é mantida por meio de nota.
