  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִשְׁאַר בּ֤/וֹ עֽוֹלֵלֹת֙ כְּ/נֹ֣קֶף זַ֔יִת שְׁנַ֧יִם שְׁלֹשָׁ֛ה גַּרְגְּרִ֖ים בְּ/רֹ֣אשׁ אָמִ֑יר אַרְבָּעָ֣ה חֲמִשָּׁ֗ה בִּ/סְעִפֶ֨י/הָ֙ פֹּֽרִיָּ֔ה נְאֻם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/006.yaml
  text: 'Yet gleanings will be left in it[a], as when an olive tree is beaten: two or three berries at the top of the highest bough, four or five on its fruitful branches, declares Yahweh, the God of Israel.'
translation:
  language: pt
  text: 'Contudo, restarão nele[a] algumas sobras da colheita, como quando se sacode uma oliveira: duas ou três azeitonas no alto do ramo mais elevado, quatro ou cinco nos seus ramos frutíferos — declara Yahweh, o Deus de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre ele”. O antecedente do pronome deve ser inferido do contexto.'
    reason: A preposição בְּ com o sufixo pronominal permite mais de uma formulação em português, e o antecedente não é nomeado neste versículo.
lexical_decisions:
- source_word: וְנִשְׁאַר
  choice: Contudo, restarão
  rationale: O nifal de שׁאר indica aquilo que permanece ou é deixado. “Contudo” expressa o valor adversativo do contexto, e “restarão” é natural em português.
- source_word: בּוֹ
  choice: nele
  rationale: Mantém a referência pronominal masculina do hebraico sem definir de modo indevido seu antecedente contextual.
- source_word: עֹלֵלֹת
  choice: algumas sobras da colheita
  rationale: O termo designa frutos deixados para trás após a colheita. A expressão comunica com clareza tanto a imagem agrícola quanto a ideia de um pequeno remanescente.
- source_word: כְּנֹקֶף זַיִת
  choice: como quando se sacode uma oliveira
  rationale: נֹקֶף descreve o ato de golpear ou sacudir a oliveira durante a colheita. “Sacode” reproduz o método sem sugerir dano intencional à árvore.
- source_word: גַּרְגְּרִים
  choice: azeitonas
  rationale: Embora o substantivo possa designar bagas ou frutos individuais, o contexto da oliveira torna “azeitonas” a opção mais clara e idiomática.
- source_word: בְּרֹאשׁ אָמִיר
  choice: no alto do ramo mais elevado
  rationale: רֹאשׁ significa “alto” ou “topo”, e אָמִיר indica o ramo superior ou mais alto da árvore.
- source_word: בִּסְעִפֶיהָ פֹּרִיָּה
  choice: nos seus ramos frutíferos
  rationale: A tradução conserva o plural “ramos”, o sufixo feminino referente à oliveira e a qualificação de que produzem fruto.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: A fórmula profética é vertida de modo digno e corrente, enquanto o nome divino é transliterado em vez de substituído por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta, preservando a identificação de Yahweh com Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio. “Yahweh” preserva de forma transparente o nome divino e evita substituí-lo silenciosamente por um título.
- issue: Valor figurado das sobras da colheita
  choice: Manter apenas a imagem agrícola no corpo do versículo
  alternative: Explicitar que os frutos representam um remanescente do povo
  rationale: O contexto sugere um remanescente após o juízo, mas o versículo o comunica por meio da comparação agrícola. A tradução não transforma a metáfora em interpretação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem numérica enfática do hebraico (“duas ou três... quatro ou cinco”) e a imagem concreta da oliveira foram preservadas.
