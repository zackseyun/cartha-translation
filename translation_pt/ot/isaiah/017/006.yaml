  source_fidelity: 'A tradução preserva corretamente a estrutura e a imagem do hebraico: o que resta após a colheita/sacudidura da oliveira, os números «duas ou três» e «quatro ou cinco», a posição no ramo mais alto e nos ramos frutíferos, e a fórmula final de declaração divina. «Nele» mantém de modo prudente a referência contextual não explicitada de בּוֹ. «Azeitonas» é uma especificação contextual legítima de גַּרְגְּרִים.'
  naturalness: O texto é fluente, moderno e suficientemente internacional, com boa legibilidade brasileira. «Sobras da colheita» comunica de forma clara o sentido de frutos deixados após a colheita; «como quando se sacode uma oliveira» transmite naturalmente a prática evocada pelo comparativo hebraico.
  terminology: «Yahweh, o Deus de Israel» traduz integralmente e com consistência יהוה אֱלֹהֵי יִשְׂרָאֵל. O registro de «declara» é apropriado para a fórmula profética. A nota em [a] registra adequadamente a possibilidade locativa de «sobre ele», sem resolver indevidamente o antecedente.
