revisions:
- from: Ah![a] O estrondo de muitos povos! Rugem como o bramido dos mares; e o tumulto das nações! Fazem estrondo como o fragor de águas impetuosas.[b]
  to: Ah,[a] o rugido de muitos povos — eles rugem como o rugido dos mares; e o estrondo das nações — elas estrondeiam como o estrondo de águas poderosas.[b]
  rationale: A revisão preserva a ambiguidade de הוֹי em nota, mantém a distinção poética entre “povos” e “nações” e reproduz mais visivelmente as repetições acústicas do hebraico nos dois membros. A pontuação foi ajustada para tornar clara a progressão entre as expressões nominais iniciais e seus verbos correspondentes.
