  text: ה֗וֹי הֲמוֹן֙ עַמִּ֣ים רַבִּ֔ים כַּ/הֲמ֥וֹת יַמִּ֖ים יֶהֱמָי֑וּ/ן וּ/שְׁא֣וֹן לְאֻמִּ֔ים כִּ/שְׁא֛וֹן מַ֥יִם כַּבִּירִ֖ים יִשָּׁאֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/012.yaml
  text: Ah[a], the roar of many peoples— they roar like the roaring of the seas[b]; and the rushing of nations— they rush like the rushing of mighty waters.
translation:
  language: pt
  text: Ah,[a] o rugido de muitos povos — eles rugem como o rugido dos mares; e o estrondo das nações — elas estrondeiam como o estrondo de águas poderosas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ai! O tumulto de muitos povos...” A interjeição hebraica pode expressar lamento, advertência ou um chamado enfático à atenção; “multidão” também é uma possibilidade para a palavra traduzida aqui por “rugido”.'
    reason: alternative_reading
  - marker: b
    text: O hebraico repete termos relacionados a rugido, estrondo e ruído, intensificando a imagem das nações caóticas como mares agitados.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ah!
  rationale: Interjeição exclamativa que aqui chama a atenção para o tumulto; evita restringir o sentido a uma sentença de condenação, embora a nuance de lamento ou ameaça continue possível.
- source_word: הֲמוֹן עַמִּים רַבִּים
  choice: o estrondo de muitos povos
  rationale: הֲמוֹן pode indicar multidão, tumulto ou ruído; a comparação imediata com os mares favorece o valor sonoro, enquanto “muitos povos” representa diretamente עַמִּים רַבִּים.
- source_word: כַּהֲמוֹת יַמִּים יֶהֱמָיוּן
  choice: rugem como o bramido dos mares
  rationale: Mantém a comparação e procura reproduzir a repetição da raiz הָמָה por meio de “rugem/bramido”, com linguagem poética natural em português.
- source_word: וּשְׁאוֹן לְאֻמִּים
  choice: e o tumulto das nações
  rationale: שָׁאוֹן denota ruído intenso, fragor ou tumulto; “nações” distingue לְאֻמִּים de “povos” no primeiro membro sem desfazer o paralelismo.
- source_word: כִּשְׁאוֹן מַיִם כַּבִּירִים יִשָּׁאוּן
  choice: fazem estrondo como o fragor de águas impetuosas
  rationale: A formulação conserva o componente acústico de שָׁאוֹן e do verbo relacionado, enquanto “águas impetuosas” comunica a força de מַיִם כַּבִּירִים sem sugerir apenas tamanho físico.
theological_decisions:
- issue: Força da interjeição הוֹי
  choice: Ah!
  alternative: Ai! Uma multidão de muitos povos...
  rationale: O contexto admite exclamação de atenção, lamento ou anúncio ameaçador. O texto principal não fixa a expressão como fórmula inequívoca de juízo, e a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. “Bramido”, “estrondo” e “fragor” preservam a forte textura sonora do hebraico; “águas impetuosas” é amplamente compreensível e comunica potência e movimento.
