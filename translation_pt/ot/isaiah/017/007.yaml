  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִשְׁעֶ֥ה הָ/אָדָ֖ם עַל עֹשֵׂ֑/הוּ וְ/עֵינָ֕י/ו אֶל קְד֥וֹשׁ יִשְׂרָאֵ֖ל תִּרְאֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/007.yaml
  text: In that day man will look to his Maker[b][a], and his eyes will look to the Holy One of Israel.
translation:
  language: pt
  text: Naquele dia, o ser humano[a] olhará para aquele que o fez, e seus olhos olharão para o Santo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa aqui um singular representativo, referindo-se à humanidade em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal natural em português, que preserva a fórmula profética sem definir além do texto quando esse dia ocorrerá.
- source_word: יִשְׁעֶה
  choice: olhará para
  rationale: O verbo indica dirigir a atenção ou consideração a alguém. A formulação conserva essa ideia sem explicitar confiança ou arrependimento, conceitos apenas implícitos no contexto.
- source_word: הָאָדָם
  choice: o ser humano
  rationale: O hebraico emprega um singular representativo com sentido genérico. Esta escolha mantém o singular e comunica claramente que a referência é à humanidade, não apenas ao sexo masculino.
- source_word: עַל
  choice: para
  rationale: Com o verbo de olhar ou prestar atenção, esta preposição direcional produz a construção portuguesa natural «olhar para».
- source_word: עֹשֵׂהוּ
  choice: aquele que o fez
  rationale: Reproduz de perto o particípio com sufixo masculino singular e mantém a relação pessoal entre o ser humano e quem o criou, sem converter necessariamente a expressão em título formal.
- source_word: וְעֵינָיו
  choice: e seus olhos
  rationale: Preserva a imagem corporal e o paralelismo poético do hebraico.
- source_word: אֶל קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Mantém o título divino característico de Isaías em sua forma consagrada e inteligível em português.
- source_word: תִּרְאֶינָה
  choice: contemplarão
  rationale: O plural concorda com «olhos» e expressa visão dirigida e atenta. A escolha também evita uma repetição pouco natural em português, sem romper o paralelismo com o primeiro membro.
theological_decisions:
- issue: Sentido representativo de הָאָדָם
  choice: o ser humano
  alternative: o homem
  rationale: O substantivo está no singular, mas representa a humanidade em geral. «O ser humano» preserva esse valor singular e genérico com clareza no português atual.
- issue: Explicitar confiança ou arrependimento
  choice: olhará para
  alternative: confiará em / se voltará para
  rationale: A orientação renovada para Deus pode sugerir confiança e arrependimento, mas o verbo hebraico fala diretamente de olhar ou dar atenção. A tradução preserva a implicação sem transformá-la em afirmação explícita.
- issue: Identidade divina daquele que fez o ser humano
  choice: aquele que o fez
  alternative: seu Criador
  rationale: O contexto identifica Deus como o agente, mas a forma hebraica é participial, «aquele que o fez». A tradução conserva essa formulação e sua relação com o título divino no segundo membro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura em dois membros e a imagem dos olhos foram preservadas; «contemplarão» mantém o tom poético sem recorrer a linguagem arcaica.
