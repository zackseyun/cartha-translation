source:
  edition: WLC
  text: לְאֻמִּ֗ים כִּ/שְׁא֞וֹן מַ֤יִם רַבִּים֙ יִשָּׁא֔וּ/ן וְ/גָ֥עַר בּ֖/וֹ וְ/נָ֣ס מִ/מֶּרְחָ֑ק וְ/רֻדַּ֗ף כְּ/מֹ֤ץ הָרִים֙ לִ/פְנֵי ר֔וּחַ וּ/כְ/גַלְגַּ֖ל לִ/פְנֵ֥י סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/013.yaml
  text: The peoples roar like the roaring of many waters[a], but he rebukes it, and it flees far away, chased like chaff on the mountains before the wind[d][c][b], and like whirling dust before the storm.
translation:
  language: pt
  text: Os povos rugem como o rugido de muitas águas[a]; mas ele repreende esse tumulto, e este foge para longe[b], perseguido como a palha miúda nos montes diante do vento e como poeira que rodopia[c] diante da tempestade[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As nações rugem como o rugido de muitas águas”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico tem o sufixo singular em “ele o repreende” e o verbo singular em “ele foge”, tratando os muitos povos como uma única massa ou como um só tumulto.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “como algo que gira” ou “como uma planta seca que rola”. O termo hebraico identifica algo leve, girando ou rolando ao vento, mas seu referente exato é incerto.'
    reason: lexical_alternative
  - marker: d
    text: “Tempestade” também pode ser traduzido por “redemoinho”, “vendaval” ou “tormenta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֻמִּים
  choice: os povos
  rationale: O plural designa grupos humanos ou nacionais. “Povos” preserva o sentido coletivo sem restringi-lo à ideia política moderna de Estados-nação.
- source_word: כִּשְׁאוֹן ... יִשָּׁאוּן
  choice: rugem como o rugido
  rationale: A combinação expressa um estrondo forte e contínuo. A repetição mantém a intensidade sonora e a comparação poética do hebraico.
- source_word: מַיִם רַבִּים
  choice: muitas águas
  rationale: Conserva a imagem hebraica tradicional de águas abundantes e poderosas, em linguagem clara e poética.
- source_word: וְגָעַר בּוֹ
  choice: mas ele repreende esse tumulto
  rationale: “Repreende” comunica a intervenção enérgica do verbo. “Esse tumulto” torna inteligível o sufixo masculino singular, que trata a multidão ruidosa como uma massa coletiva, sem nomear o agente implícito.
- source_word: וְנָס מִמֶּרְחָק
  choice: e este foge para longe
  rationale: Mantém o verbo no singular e retoma o tumulto coletivo personificado. “Para longe” expressa de modo natural o afastamento indicado pela construção hebraica.
- source_word: וְרֻדַּף
  choice: perseguido
  rationale: Preserva a forma passiva e a imagem de uma força posta em fuga e impelida adiante.
- source_word: כְּמֹץ הָרִים
  choice: como a palha nos montes
  rationale: “Palha” comunica o material leve levado pelo vento; “nos montes” apresenta naturalmente a imagem de sua exposição nas alturas, embora a relação sintática seja compacta.
- source_word: לִפְנֵי רוּחַ
  choice: diante do vento
  rationale: Equivalente formal e idiomático para algo impelido à frente do vento.
- source_word: וּכְגַלְגַּל
  choice: e como poeira que rodopia
  rationale: O termo pode indicar algo leve que gira ou rola. A escolha transmite o movimento sem identificar com certeza um objeto botânico específico.
- source_word: לִפְנֵי סוּפָה
  choice: diante da tempestade
  rationale: “Tempestade” é acessível e cobre a força violenta do termo, que também pode sugerir redemoinho ou vendaval.
theological_decisions:
- issue: Referência dos verbos e pronomes singulares depois de “povos”
  choice: 'Tratar o tumulto dos povos como uma unidade coletiva singular: “esse tumulto, e este foge”.'
  alternative: 'Regularizar para o plural: “ele os repreende, e eles fogem”.'
  rationale: Embora o primeiro verbo seja plural, בּוֹ e וְנָס são singulares. A tradução conserva essa mudança gramatical e a tensão poética, evitando corrigir o hebraico para concordar com “povos”.
- issue: Identidade daquele que repreende
  choice: Manter apenas o pronome implícito “ele”, sem inserir o nome de Deus.
  alternative: Explicitar “o Senhor os repreende”.
  rationale: O contexto aponta para a ação divina, mas o versículo não nomeia o agente. A tradução não torna explícito o que o hebraico deixa implícito.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente internacional. A repetição “rugem como o rugido” preserva o efeito poético do original; a explicitação mínima de “tumulto” evita uma sequência ambígua de pronomes masculinos sem apagar o singular coletivo hebraico.
