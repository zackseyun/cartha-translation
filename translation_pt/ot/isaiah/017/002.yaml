  text: עֲזֻב֖וֹת עָרֵ֣י עֲרֹעֵ֑ר לַ/עֲדָרִ֣ים תִּֽהְיֶ֔ינָה וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/002.yaml
  text: The cities of Aroer are abandoned[a]; they will be for flocks[b], and they will lie down with no one to make them afraid.
translation:
  language: pt
  text: As cidades de Aroer estão abandonadas[a]; serão para os rebanhos[b], que se deitarão sem que ninguém os amedronte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desertas” ou “deixadas ao abandono”.
    reason: lexical_alternative
  - marker: b
    text: “Rebanhos” também pode ser traduzido por “manadas”; a imagem é a de assentamentos abandonados que passam a servir de lugar de pastagem e descanso para animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזֻבוֹת
  choice: estão abandonadas
  rationale: O particípio passivo feminino plural de עזב descreve o estado das cidades, deixadas vazias; “estão abandonadas” é natural e preserva esse valor resultativo.
- source_word: עָרֵי
  choice: as cidades de
  rationale: O plural construto de עִיר pode designar cidades ou povoados; “as cidades de” é a forma convencional e adequada ao contexto profético.
- source_word: עֲרֹעֵר
  choice: Aroer
  rationale: Nome próprio geográfico, transliterado segundo a forma tradicional em português.
- source_word: לַעֲדָרִים
  choice: entregues aos rebanhos
  rationale: עֵדֶר designa coletivos de animais de pastoreio. A formulação explicita naturalmente que os assentamentos abandonados passam a servir aos rebanhos, sem perder a imagem do hebraico.
- source_word: תִּהְיֶינָה
  choice: serão
  rationale: Futuro feminino plural de היה; liga as cidades à expressão לַעֲדָרִים de modo conciso e idiomático.
- source_word: וְרָבְצוּ
  choice: que se deitarão
  rationale: רבץ é usado tipicamente para animais que se deitam. O relativo deixa claro que o sujeito passa a ser “os rebanhos”, mudança implícita no hebraico.
- source_word: וְאֵין מַחֲרִיד
  choice: sem que ninguém os amedronte
  rationale: Expressa a ausência de quem perturbe ou assuste os animais; o pronome masculino plural retoma “rebanhos” e torna explícito o objeto implícito.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a transição implícita de sujeito entre as cidades e os rebanhos, mas a sinaliza por meio de oração relativa para evitar ambiguidade acidental.
