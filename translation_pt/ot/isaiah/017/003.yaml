source:
  edition: WLC
  text: וְ/נִשְׁבַּ֤ת מִבְצָר֙ מֵֽ/אֶפְרַ֔יִם וּ/מַמְלָכָ֥ה מִ/דַּמֶּ֖שֶׂק וּ/שְׁאָ֣ר אֲרָ֑ם כִּ/כְב֤וֹד בְּנֵֽי יִשְׂרָאֵל֙ יִֽהְי֔וּ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/003.yaml
  text: And the fortress will cease from Ephraim[a], and the kingdom from Damascus; and the remnant of Aram will be like the glory of the sons of Israel[b], declares Yahweh of hosts.
translation:
  language: pt
  text: A fortaleza deixará de existir em Efraim, e o reino em Damasco; e o remanescente de Arã será como a glória dos filhos de Israel[a] — declara o SENHOR dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não explicita o ponto da comparação. No contexto, ela pode sugerir que o remanescente de Arã compartilhará a diminuição da glória de Israel; “glória” também pode significar “honra” ou “esplendor”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּת
  choice: desaparecerá
  rationale: O nifal de שׁבת indica que algo cessará ou deixará de existir. “Desaparecerá” expressa de modo natural o fim da fortaleza sem acrescentar a ideia específica de destruição.
- source_word: מִבְצָר
  choice: a fortaleza
  rationale: Preserva o singular e o sentido concreto de um lugar fortificado.
- source_word: מֵאֶפְרַיִם
  choice: de Efraim
  rationale: Mantém o nome regional e tribal explícito no hebraico, sem substituí-lo pela interpretação política “Israel”.
- source_word: וּמַמְלָכָה מִדַּמֶּשֶׂק
  choice: e o reino, de Damasco
  rationale: 'A elipse verbal do hebraico é preservada de forma inteligível em português: tanto a fortaleza de Efraim quanto o reino de Damasco deixarão de existir.'
- source_word: וּשְׁאָר אֲרָם
  choice: e o remanescente de Arã
  rationale: “Remanescente” conserva o registro profético de שׁאר, e “Arã” reproduz o nome próprio hebraico em vez de interpretá-lo como Síria.
- source_word: כִּכְבוֹד
  choice: será como a glória
  rationale: כבוד pode significar glória, honra ou esplendor. “Glória” preserva a amplitude semântica e não define indevidamente o ponto da comparação.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Representa diretamente a expressão masculina plural do hebraico e mantém a designação bíblica tradicional em português.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: declara o SENHOR dos Exércitos
  rationale: “Declara” comunica a fórmula profética נְאֻם; “SENHOR” segue a convenção para o nome divino, e “dos Exércitos” é uma forma corrente e compreensível do título.
theological_decisions:
- issue: Sentido da comparação entre o remanescente de Arã e a glória dos filhos de Israel
  choice: Manter a comparação formalmente aberta no texto principal.
  alternative: Explicitar que Arã sofrerá a mesma redução ou perda de glória que Israel.
  rationale: O hebraico não declara qual é precisamente o ponto de semelhança. O contexto favorece a ideia de declínio, mas inseri-la no texto resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura coordenada e a elipse poética foram mantidas sem sacrificar a clareza; o travessão destaca naturalmente a fórmula profética final.
