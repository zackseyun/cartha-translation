  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִדַּ֖ל כְּב֣וֹד יַעֲקֹ֑ב וּ/מִשְׁמַ֥ן בְּשָׂר֖/וֹ יֵרָזֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/004.yaml
  text: And in that day the glory of Jacob will become thin[b][a], and the fatness of his flesh will waste away.
translation:
  language: pt
  text: Naquele dia, a glória de Jacó minguará[a], e a gordura de sua carne se consumirá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficará reduzida” ou “enfraquecerá”. O verbo hebraico pode indicar tornar-se pequeno, fraco, escasso ou magro; aqui, ele introduz a imagem corporal desenvolvida na frase seguinte.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficará magra”. O hebraico usa a gordura e o emagrecimento como imagem da perda de vigor e prosperidade de Jacó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa com naturalidade a fórmula temporal profética; o valor futuro da construção aparece nos verbos seguintes.
- source_word: יִדַּל
  choice: minguará
  rationale: O verbo indica tornar-se pequeno, fraco, escasso ou reduzido. “Minguará” preserva a ideia de perda gradual e combina naturalmente com “glória”, sem eliminar a imagem de emagrecimento desenvolvida no paralelismo.
- source_word: כְּבוֹד
  choice: glória
  rationale: Mantém a amplitude do hebraico, que pode abranger esplendor, honra, importância e prosperidade.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Conserva o nome empregado no texto hebraico, sem substituí-lo interpretativamente por “Israel”.
- source_word: וּמִשְׁמַן בְּשָׂרוֹ
  choice: e a gordura de sua carne
  rationale: Retém a imagem corporal concreta do hebraico e sua representação figurada de vigor e prosperidade.
- source_word: יֵרָזֶה
  choice: se consumirá
  rationale: Comunica em português natural a perda de gordura e vigor indicada pelo verbo “tornar-se magro, definhar”, embora a construção hebraica tenha literalmente a gordura como sujeito.
theological_decisions:
- issue: Referente de “Jacó” no anúncio de juízo
  choice: Manter “Jacó” como nome coletivo e pactual
  alternative: Israel; o povo de Jacó
  rationale: O contexto aponta para a humilhação e o enfraquecimento do povo, mas o hebraico diz “Jacó”. Preservar o nome conserva sua ressonância profética sem explicitar no texto principal uma interpretação.
- issue: Sentido figurado da imagem de emagrecimento
  choice: Preservar a linguagem corporal de perda de gordura e vigor
  alternative: Explicitar como perda de força, população ou prosperidade
  rationale: A imagem pode abranger diferentes dimensões da redução de Jacó. Não especificá-las mantém a abrangência e a tensão poética do original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Minguará” mantém o tom poético-profético sem soar arcaico demais; “se consumirá” torna natural a segunda oração, preservando sua imagem concreta.
