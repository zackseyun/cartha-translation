  text: מַשָּׂ֖א דַּמָּ֑שֶׂק הִנֵּ֤ה דַמֶּ֨שֶׂק֙ מוּסָ֣ר מֵ/עִ֔יר וְ/הָיְתָ֖ה מְעִ֥י מַפָּלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/001.yaml
  text: 'An oracle concerning Damascus: Behold[a], Damascus will be removed from being a city[b], and it will become a heap of ruins.'
translation:
  language: pt
  text: 'Oráculo sobre Damasco:[a]


    Vejam! Damasco deixará de ser uma cidade[b]

    e se tornará um monte de ruínas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Peso sobre Damasco” ou “Pronunciamento sobre Damasco”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “removida de cidade”, isto é, deixará de ser uma cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: oráculo
  rationale: Em títulos proféticos, o termo introduz uma declaração solene, frequentemente de juízo. “Oráculo” é corrente no registro bíblico em português e preserva a função formal do cabeçalho; “sentença” e “pronunciamento” também são possíveis.
- source_word: דַּמָּשֶׂק
  choice: Damasco
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: A interjeição dirige a atenção e dá vivacidade ao anúncio profético. “Vejam!” comunica essa força em português moderno, sem o tom arcaizante de “Eis”.
- source_word: מוּסָר מֵעִיר
  choice: deixará de ser cidade
  rationale: O particípio passivo com a preposição מן descreve Damasco sendo afastada da condição de cidade. A formulação natural explicita o sentido idiomático sem sugerir deslocamento geográfico.
- source_word: וְהָיְתָה
  choice: e se tornará
  rationale: Neste contexto resultativo, היה indica a transição para uma nova condição, não apenas existência estática.
- source_word: מְעִי מַפָּלָה
  choice: um monte de ruínas
  rationale: A expressão construta retrata um amontoado produzido por queda ou destruição. “Monte de ruínas” preserva a imagem e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A disposição em linhas destaca o cabeçalho e o paralelismo do anúncio profético.
