  terminology: «Rocha» é uma boa preservação da metáfora divina. «Fortaleza» comunica adequadamente מָעוֹז no registro do versículo. «Videira estrangeira» é uma solução natural para זְמֹרַת זָר, sem tornar a alusão potencialmente cultual explícita.
