source:
  edition: WLC
  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
translation:
  language: pt
  text: Pois você se esqueceu do Deus da sua salvação e não se lembrou da Rocha da sua fortaleza. Por isso, planta plantas agradáveis[a] e as semeia com uma videira estrangeira[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “plantações escolhidas”. A expressão talvez aluda a plantas cultivadas em práticas religiosas estrangeiras.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um broto estrangeiro” ou “uma muda de origem estrangeira”.'
    reason: lexical_alternative
  - marker: c
    text: A imagem agrícola pode sugerir confiança em cultos ou alianças estrangeiras em vez de confiança no SENHOR, mas o hebraico não diz isso explicitamente.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁכַחַתְּ
  choice: você se esqueceu
  rationale: O qal perfeito na segunda pessoa feminina descreve uma ação consumada com consequências presentes. Em português corrente, a forma pronominal é natural; o gênero do destinatário não pode ser expresso aqui sem acréscimo interpretativo.
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  choice: o Deus da sua salvação
  rationale: Preserva a cadeia construta e o substantivo יֵשַׁע, sem transformar a expressão em paráfrase verbal.
- source_word: צוּר מָעֻזֵּךְ
  choice: a Rocha da sua fortaleza
  rationale: Mantém a metáfora tradicional de צוּר e traduz מָעוֹז pelo sentido de lugar ou fonte de proteção e força. A formulação conserva a construção compacta do hebraico.
- source_word: לֹא זָכָרְתְּ
  choice: não se lembrou
  rationale: Reproduz o paralelismo com 'se esqueceu' e mantém o valor do perfeito hebraico.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Conector causal-consecutivo claro e natural no português moderno.
- source_word: תִּטְּעִי
  choice: planta
  rationale: O imperfeito pode apresentar vividamente a conduta resultante no presente; o contexto também admite valor futuro.
- source_word: נִטְעֵי נַעֲמָנִים
  choice: plantas agradáveis
  rationale: Conserva a imagem agrícola e o sentido de algo agradável ou desejável, sem tornar explícita uma referência cultual incerta.
- source_word: זְמֹרַת זָר
  choice: um ramo de videira estrangeira
  rationale: זְמֹרָה designa ramo ou broto de videira, e זָר indica o que é estrangeiro ou alheio. A expansão mínima 'de videira' torna a imagem compreensível em português.
- source_word: תִּזְרָעֶנּוּ
  choice: semeia entre elas
  rationale: Preserva o verbo זרע, 'semear'. 'Entre elas' explicita de modo natural a relação comprimida entre o ramo e as plantas, sem definir além do necessário o referente do sufixo masculino singular.
theological_decisions:
- issue: Se a imagem agrícola deve ser explicitamente identificada com idolatria, cultos estrangeiros ou alianças políticas
  choice: Manter no texto principal apenas a imagem agrícola
  alternative: Traduzir como jardins idólatras, plantas cultuais ou dependência de potências estrangeiras
  rationale: O contexto de esquecimento de Deus favorece uma leitura religiosa ou política negativa, mas o hebraico não identifica expressamente cultos nem alianças. A nota registra a possibilidade sem resolver a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com construção legível no Brasil e compreensível internacionalmente. Emprega 'você' para representar a segunda pessoa singular do discurso profético sem recorrer a formas verbais regionais; mantém 'Rocha' com inicial maiúscula como título metafórico de Deus e conserva deliberadamente a estranheza moderada da imagem agrícola.
