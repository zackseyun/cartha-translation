revisions:
- from: E o Senhor lhes dará pão de angústia e água de opressão[a]; contudo, aquele que os ensina não se esconderá mais[b], e os olhos de vocês verão aquele que os ensina.
  to: E o Senhor lhes dará pão de angústia e água de opressão[a], mas seu mestre não se esconderá mais[b], e seus olhos verão seu mestre.
  rationale: A revisão restaura «mestre» como equivalente direto e repetido de מוֹרֶיךָ, evita explicitar um plural não expresso pelos sufixos dessa expressão e preserva a ambiguidade entre um mestre singular e mestres na nota. Mantêm-se as escolhas lexicais centrais e a leitura não doutrinária do referente.
