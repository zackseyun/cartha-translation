  yaml_path: translation/ot/isaiah/030/020.yaml
  text: And the Lord will give you bread of distress and water of oppression[a], yet your teacher will no longer hide himself[b], and your eyes will see your teacher.
translation:
  language: pt
  text: E o Senhor lhes dará pão de angústia e água de opressão[a], mas seu mestre não se esconderá mais[b], e seus olhos verão seu mestre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pão de adversidade e água de aflição”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico também pode ser entendido como “seus mestres não ficarão mais escondidos” ou, segundo a tradução tradicional, “seu mestre não será mais posto num canto”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Tradução corrente do título divino, natural em português e sem introduzir uma identificação além da expressa no texto.
- source_word: לֶחֶם צָר
  choice: pão de angústia
  rationale: Preserva a metáfora hebraica e expressa a condição de aflição ou adversidade associada ao alimento.
- source_word: מַיִם לָחַץ
  choice: água de opressão
  rationale: Mantém o paralelismo com «pão de angústia» e conserva o sentido concreto de pressão, opressão ou aflição de לָחַץ.
- source_word: יִכָּנֵף
  choice: não se esconderá mais
  rationale: Representa de modo natural o nifal de כנף como ocultar-se ou ficar escondido, sem incorporar ao texto principal a interpretação tradicional de ser posto num canto.
- source_word: מוֹרֶיךָ
  choice: aquele que os ensina
  rationale: A forma hebraica admite discussão entre singular e plural. Esta formulação portuguesa preserva a leitura singular adotada pelo contexto imediato sem usar maiúscula nem identificar o referente como Deus.
- source_word: עֵינֶיךָ רֹאוֹת
  choice: os olhos de vocês verão
  rationale: Reproduz a ênfase hebraica na percepção direta e mantém a referência corporal explícita.
theological_decisions:
- issue: Identidade e número de מוֹרֶיךָ («aquele que os ensina» / «os seus mestres»).
  choice: Referente singular não especificado, expresso como «aquele que os ensina», sem maiúscula.
  alternative: «os seus mestres» ou um referente divino implícito.
  rationale: O contexto e a forma hebraica permitem mais de uma compreensão. A tradução principal evita decidir se se trata de Deus ou de um instrutor humano, enquanto a nota registra a leitura plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. «Aquele que os ensina» evita a ambiguidade de gênero e número que «seu mestre» poderia criar e não força uma identificação teológica.
