base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/025.yaml
  text: And on every high mountain and on every lofty hill there will be streams[a], channels of water, on the day of great slaughter, when the towers fall.
translation:
  language: pt
  text: E sobre todo monte alto e sobre toda colina elevada haverá riachos, cursos de água[a], no dia da grande matança, quando as torres caírem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “canais de água”. O termo hebraico é relativamente raro, e sua nuance exata pode ser “filetes de água” ou “ribeiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: haverá
  rationale: Expressa de modo natural em português o valor existencial futuro da construção hebraica.
- source_word: הַר גָּבֹהַ
  choice: monte alto
  rationale: Tradução topográfica direta e corrente, adequada à imagem profética.
- source_word: גִּבְעָה נִשָּׂאָה
  choice: colina elevada
  rationale: Preserva o sentido de algo erguido ou exaltado, com formulação natural no contexto da paisagem.
- source_word: פְּלָגִים
  choice: riachos
  rationale: No contexto de água abundante nas elevações, designa correntes ou divisões de água; “riachos” é claro e distingue o termo da expressão seguinte.
- source_word: יִבְלֵי מָיִם
  choice: cursos de água
  rationale: Mantém a expressão paralela e a imagem de água corrente. O substantivo hebraico é raro, por isso sua nuance exata é indicada em nota.
- source_word: בְּיוֹם הֶרֶג רָב
  choice: no dia da grande matança
  rationale: Preserva com clareza e solenidade a linguagem profética de juízo.
- source_word: בִּנְפֹל מִגְדָּלִים
  choice: quando as torres caírem
  rationale: Traduz naturalmente o infinitivo hebraico com valor temporal e mantém “torres” sem especificar além do texto.
theological_decisions:
- issue: Relação entre a abundância de água e as imagens de juízo
  choice: Manter lado a lado a imagem de bênção (“riachos, cursos de água”) e a imagem de juízo (“dia da grande matança, quando as torres caírem”).
  alternative: Interpretar explicitamente a água como restauração posterior ao juízo ou como provisão em meio ao juízo.
  rationale: O hebraico justapõe fertilidade e destruição sem explicar sua relação temporal ou teológica; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial com “E” preserva a continuidade profética; o paralelismo e a tensão do original foram mantidos sem explicação interpretativa.
