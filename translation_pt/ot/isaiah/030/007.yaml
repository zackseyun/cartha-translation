base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/007.yaml
  text: For Egypt’s help is utterly empty and worthless[a]; therefore I call her[b], “Rahab Who Sits Still.”
translation:
  language: pt
  text: 'Pois o auxílio do Egito é vazio e inútil. Por isso, dei-lhe este nome: “Raabe, aquela que fica parada”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Raabe — eles ficam parados” ou “a arrogante que nada faz”. “Raabe” é um nome poético dado ao Egito e também pode sugerir arrogância ou jactância. A expressão hebraica é condensada e ridiculariza o Egito como orgulhoso, mas inativo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִצְרַיִם
  choice: Pois o auxílio do Egito
  rationale: A conjunção introduz a razão da advertência anterior. A reestruturação nominal explicita de modo natural em português que está em vista a ajuda prestada pelo Egito.
- source_word: הֶבֶל וָרִיק
  choice: vazio e inútil
  rationale: Os dois termos expressam falta de substância e de eficácia. A dupla tradução preserva a intensificação hebraica sem repetir a mesma palavra.
- source_word: יַעְזֹרוּ
  choice: auxílio
  rationale: O verbo significa ajudar. A forma plural pode tratar o Egito coletivamente ou apontar para seus agentes; a nominalização comunica naturalmente a ideia geral de sua assistência.
- source_word: לָכֵן קָרָאתִי לָזֹאת
  choice: Por isso, eu o chamo de
  rationale: לָכֵן marca a conclusão, e קָרָאתִי introduz uma designação profética. Embora לָזֹאת seja feminino em hebraico, o pronome masculino concorda naturalmente com o nome português “Egito”.
- source_word: רַהַב
  choice: Raabe
  rationale: Mantém o epíteto poético dado ao Egito, preservando também sua associação bíblica e sua possível conotação de arrogância ou jactância.
- source_word: הֵם שָׁבֶת
  choice: que fica parada
  rationale: A expressão comprimida é entendida como uma sátira à inatividade do Egito. O feminino concorda com “Raabe”, mantendo a personificação e a imagem de permanecer sem agir.
theological_decisions:
- issue: Sentido do nome satírico רַהַב הֵם שָׁבֶת
  choice: “Raabe, que fica parada”
  alternative: “Raabe — eles ficam parados”; “a arrogante que nada faz”
  rationale: A opção principal preserva o possível nome poético de Egito e o contraste irônico entre sua fama orgulhosa e sua inação. A nota registra a ambiguidade gramatical e semântica sem impor uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. Conserva-se “Raabe” como epíteto poético, e a dificuldade do hebraico é indicada em nota.
