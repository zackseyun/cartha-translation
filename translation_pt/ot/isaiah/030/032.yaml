    rationale: O verbo descreve fazer repousar, assentar ou impor sobre alguém. “Fizer cair” torna a ação mais violenta e concreta do que o hebraico exige; “impuser sobre ele” mantém a imagem judicial sem essa especificação.
  - severity: low
    issue: “Em combates de armas brandidas”
    rationale: A construção é pouco idiomática. O hebraico é elíptico e difícil, mas a ideia de ação marcial de brandir pode ser expressa naturalmente como “em combates com armas brandidas”, sem resolver indevidamente o referente final.
