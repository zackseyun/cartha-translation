  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֤ל מַֽעֲבַר֙ מַטֵּ֣ה מֽוּסָדָ֔ה אֲשֶׁ֨ר יָנִ֤יחַ יְהוָה֙ עָלָ֔י/ו בְּ/תֻפִּ֖ים וּ/בְ/כִנֹּר֑וֹת וּ/בְ/מִלְחֲמ֥וֹת תְּנוּפָ֖ה נִלְחַם ב/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/032.yaml
  text: And every stroke of the appointed rod that Yahweh lays on him will be with tambourines and lyres[b][a]; and with battles of brandishing he will fight against them.
translation:
  language: pt
  text: E cada golpe[a] da vara determinada que Yahweh impuser sobre ele será acompanhado de tamborins e liras; e ele lutará contra ela[b] em combates com armas brandidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cada passagem da vara determinada”. A expressão hebraica é difícil; “golpe” entende a imagem como cada movimento ou pancada da vara.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “contra ela”, com um pronome feminino singular, mas seu referente é incerto. Pode referir-se à Assíria ou à potência inimiga; algumas traduções trazem “contra eles”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כֹּל מַעֲבַר
  choice: E cada golpe
  rationale: מַעֲבַר normalmente expressa passagem ou movimento, mas, junto de “vara” neste contexto de juízo, indica provavelmente cada passagem ou golpe da vara. “Golpe” torna a imagem inteligível sem ocultar a dificuldade, registrada em nota.
- source_word: מַטֵּה מוּסָדָה
  choice: vara decretada
  rationale: “Vara” preserva a imagem de instrumento de disciplina; o particípio passivo מוּסָדָה sugere algo estabelecido ou fixado de antemão, aqui expresso por “decretada”.
- source_word: אֲשֶׁר יָנִיחַ יְהוָה עָלָיו
  choice: que Yahweh fizer cair sobre ele
  rationale: O hifil de נוח descreve Yahweh fazendo a vara repousar ou descer sobre o destinatário do juízo. “Fizer cair sobre ele” comunica naturalmente a ação punitiva em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בְּתֻפִּים וּבְכִנֹּרוֹת
  choice: acompanhado de tamborins e liras
  rationale: A preposição ב introduz o acompanhamento musical. “Tamborins” e “liras” são designações modernas e reconhecíveis dos instrumentos.
- source_word: וּבְמִלְחֲמוֹת תְּנוּפָה
  choice: em combates de armas brandidas
  rationale: תְּנוּפָה denota movimento de erguer, agitar ou brandir. O contexto marcial favorece a imagem de armas brandidas; “combates” traduz o plural מִלְחָמוֹת de modo natural.
- source_word: נִלְחַם בָהּ
  choice: ele lutará contra ela
  rationale: O sujeito mais provável continua sendo Yahweh. O pronome sufixado é feminino singular; “ela” preserva essa forma e sua referência incerta, em vez de convertê-la silenciosamente em plural.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração mantém o nome próprio presente no hebraico e evita substituí-lo por um título.
- issue: Sujeito e objeto da oração final נִלְחַם בָהּ
  choice: 'Yahweh é o sujeito implícito, e o objeto permanece no feminino singular: “contra ela”'
  alternative: “lutará contra eles”, entendendo o sufixo coletivamente como referência aos assírios; ou “lutará contra ele/isso”
  rationale: O contexto imediato apresenta Yahweh combatendo a potência assíria, mas o sufixo hebraico é feminino singular e seu referente exato não é seguro. A tradução mantém essa tensão, com nota explicativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a imagem poética e marcial, enquanto as notas registram as duas dificuldades principais do hebraico.
