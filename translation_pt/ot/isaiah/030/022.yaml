source:
  edition: WLC
  text: וְ/טִמֵּאתֶ֗ם אֶת צִפּוּי֙ פְּסִילֵ֣י כַסְפֶּ֔/ךָ וְ/אֶת אֲפֻדַּ֖ת מַסֵּכַ֣ת זְהָבֶ֑/ךָ תִּזְרֵ/ם֙ כְּמ֣וֹ דָוָ֔ה צֵ֖א תֹּ֥אמַר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/022.yaml
  text: And you will defile the silver overlay of your carved idols and the gold plating of your cast images. You will scatter them like a menstrual cloth; you will say to them, “Go out!”
translation:
  language: pt
  text: 'Vocês profanarão o revestimento de prata das suas imagens esculpidas e a cobertura de ouro das suas imagens de metal fundido. Vocês as jogarão fora como um pano menstrual e dirão a ele: “Fora!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico muda do plural (“as jogarão fora”) para o singular masculino (“a ele” e “Fora!”). O singular pode tratar o conjunto dos ídolos como uma unidade ou dirigir-se a cada ídolo individualmente.
    reason: Preserva a alternância gramatical e a ambiguidade do texto hebraico sem impor uma interpretação.
lexical_decisions:
- source_word: וְטִמֵּאתֶם
  choice: Vocês profanarão
  rationale: O piel de טמא indica tornar ritualmente impuro ou tratar como impuro; “profanar” comunica aqui a rejeição deliberada dos objetos idolátricos sem exigir uma explicação no corpo do versículo.
- source_word: צִפּוּי פְּסִילֵי כַסְפֶּךָ
  choice: o revestimento de prata das suas imagens esculpidas
  rationale: 'Preserva a relação construta: prata usada como revestimento das imagens talhadas.'
- source_word: אֲפֻדַּת מַסֵּכַת זְהָבֶךָ
  choice: a cobertura de ouro das suas imagens de metal fundido
  rationale: אֲפֻדָּה designa aqui uma cobertura ou revestimento, enquanto מַסֵּכָה se refere ao objeto moldado/fundido; a formulação evita confundir a cobertura com a própria imagem.
- source_word: תִּזְרֵם
  choice: Vocês as espalharão
  rationale: O verbo זרה significa dispersar ou lançar fora. O sufixo masculino plural retoma naturalmente os objetos idolátricos mencionados.
- source_word: כְּמוֹ דָוָה
  choice: como um pano menstrual
  rationale: דָוָה evoca impureza menstrual; no contexto, a comparação parece envolver algo associado à menstruação e descartado como impuro. “Pano menstrual” torna explícita a imagem implícita, em consonância com a evidência contextual.
- source_word: צֵא
  choice: Fora!
  rationale: O imperativo singular masculino significa literalmente “Sai!”. Como ordem de repúdio dirigida coletivamente aos ídolos, “Fora!” preserva a força e funciona naturalmente em português.
theological_decisions:
- issue: O referente dos pronomes em תִּזְרֵם e לֽוֹ
  choice: 'Traduzir de modo coletivo no plural: “as” e “lhes”'
  alternative: Manter a oscilação gramatical com “as” e depois “lhe”
  rationale: O hebraico passa de um sufixo plural em תִּזְרֵם para um singular em לֽוֹ e no imperativo צֵא, provavelmente tratando o conjunto dos ídolos coletivamente. O plural em português evita uma mudança de referente artificial, sem alterar o sentido de rejeição total.
- issue: Natureza da impureza expressa por טמא e דוה
  choice: Conservar a linguagem concreta de impureza menstrual
  alternative: Generalizar como “coisa impura” ou “objeto imundo”
  rationale: A imagem forte faz parte do contraste teológico entre a santidade de Deus e os ídolos rejeitados; generalizá-la apagaria a concretude retórica do texto.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para o plural hebraico. A formulação mantém o paralelismo entre imagens esculpidas e fundidas e conserva a contundência da ordem final.
