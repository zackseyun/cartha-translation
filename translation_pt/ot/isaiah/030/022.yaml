  verdict: revise
  source_fidelity: A tradução reproduz adequadamente os dois revestimentos preciosos, a rejeição ritual dos ídolos e a imagem menstrual forte. Contudo, o hebraico alterna de um sufixo plural em תִּזְרֵם para o singular masculino em לוֹ e no imperativo צֵא. O texto atual regulariza essa mudança com “lhes”, eliminando uma ambiguidade/formulação singular presente na fonte.
  naturalness: O português é moderno e claro. “Jogar fora” expressa mais diretamente, neste contexto de descarte, o valor de תִּזְרֵם do que “espalhar”, sem perder a ideia de lançar/dispersar.
  terminology: “Imagens esculpidas”, “imagens de metal fundido”, “revestimento de prata” e “cobertura de ouro” são escolhas adequadas. “Pano menstrual” preserva de modo compreensível a imagem concreta tradicionalmente entendida em כְּמוֹ דָוָה.
  issues:
  - severity: medium
    issue: O pronome final foi pluralizado.
    rationale: O hebraico tem לֽוֹ, “a ele/para ele”, seguido de צֵא, imperativo masculino singular, após o plural תִּזְרֵם. A tradução por “lhes dirão” harmoniza a gramática, mas não preserva a oscilação singular da fonte. Uma nota permite manter um português legível sem ocultar o dado textual.
  - severity: low
    issue: “Espalharão” é menos contextual que “jogarão fora”.
    rationale: זרה pode significar dispersar, mas, no quadro de repúdio de objetos contaminados e da ordem final para que saiam, o sentido de descartar/lançar fora é mais natural e preciso em português.
  revised_text: 'Vocês profanarão o revestimento de prata das suas imagens esculpidas e a cobertura de ouro das suas imagens de metal fundido. Vocês as jogarão fora como um pano menstrual e dirão a ele: “Fora!”[a]'
