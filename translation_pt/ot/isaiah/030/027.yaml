  text: הִנֵּ֤ה שֵׁם יְהוָה֙ בָּ֣א מִ/מֶּרְחָ֔ק בֹּעֵ֣ר אַפּ֔/וֹ וְ/כֹ֖בֶד מַשָּׂאָ֑ה שְׂפָתָי/ו֙ מָ֣לְאוּ זַ֔עַם וּ/לְשׁוֹנ֖/וֹ כְּ/אֵ֥שׁ אֹכָֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/027.yaml
  text: Look[a], the name of Yahweh comes from afar, burning with his anger, and with dense smoke; his lips are full of wrath, and his tongue is like a consuming fire.
translation:
  language: pt
  text: Vejam! O nome de Yahweh vem de longe, com sua ira ardendo e com densa fumaça.[a] Seus lábios estão cheios de indignação, e sua língua é como fogo consumidor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil e pode ser entendida como uma densa massa ou coluna de fumaça. Mais literalmente, pode significar algo como “e peso de elevação” ou “e peso de uma carga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Emprega uma chamada de atenção natural no português atual e preserva a força de apresentação vívida da partícula hebraica.
- source_word: שֵׁם יְהוָה
  choice: o nome de Yahweh
  rationale: Mantém explicitamente “o nome” como sujeito, sem reduzir a expressão ao próprio Yahweh, preservando a nuance de sua presença e poder manifestos.
- source_word: בָּא מִמֶּרְחָק
  choice: vem de longe
  rationale: Reproduz de modo direto e idiomático a aproximação retratada na visão profética.
- source_word: בֹּעֵר אַפּוֹ
  choice: com sua ira ardendo
  rationale: Traduz אַף segundo seu sentido idiomático de ira, preservando a imagem de ardor.
- source_word: וְכֹבֶד מַשָּׂאָה
  choice: e envolto em densa fumaça que se eleva
  rationale: Adota a leitura contextual de uma massa espessa de fumaça ascendente na teofania de fogo, enquanto a nota registra a grande dificuldade lexical e as alternativas mais literais.
- source_word: שְׂפָתָיו מָלְאוּ זַעַם
  choice: Seus lábios estão cheios de indignação
  rationale: Conserva a imagem corporal e exprime זַעַם com linguagem digna e corrente, adequada ao juízo divino.
- source_word: וּלְשׁוֹנוֹ כְּאֵשׁ אֹכָלֶת
  choice: e sua língua é como fogo consumidor
  rationale: Preserva o símile e a força destrutiva do particípio אֹכָלֶת numa expressão bíblica natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto, em vez de substituí-lo por um título.
- issue: Manutenção de “o nome” como sujeito da ação
  choice: o nome de Yahweh vem
  alternative: Yahweh vem
  rationale: O hebraico torna שֵׁם o sujeito explícito. Mantê-lo preserva a tensão entre a identidade transcendente de Deus e a manifestação de sua presença em juízo.
- issue: Interpretação de וְכֹבֶד מַשָּׂאָה
  choice: imagem de densa fumaça ascendente, com nota de ambiguidade
  alternative: peso de uma carga; peso de elevação
  rationale: O contexto favorece uma manifestação ígnea acompanhada de fumaça, mas a expressão hebraica é obscura e não deve ser apresentada como inequívoca.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Vejam!” evita o arcaísmo de “Eis”, enquanto “indignação” e “fogo consumidor” mantêm a dignidade profética. A pontuação divide a longa sequência hebraica sem desfazer suas imagens paralelas.
