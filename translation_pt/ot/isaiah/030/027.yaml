review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente «o nome de Yahweh» como sujeito, a vinda «de longe», a ira ardente e as imagens corporais de lábios e língua. Porém, «envolto em densa fumaça que se eleva» vai além do hebraico difícil וְכֹבֶד מַשָּׂאָה: introduz explicitamente que o sujeito está envolto e torna inequívoca a ideia de fumaça ascendente. A leitura de fumaça é contextual e possível, mas deve permanecer mais contida no texto principal e ser qualificada em nota.'
  naturalness: O português é claro e solene. «Vejam!» funciona como chamado de atenção moderno. A formulação «com sua ira ardendo e envolto em...» cria uma coordenação algo desequilibrada e pode fazer «envolto» parecer predicado de «Yahweh» ou de «o nome»; «sua ira ardendo, e com densa fumaça» é mais direto.
  terminology: «Yahweh», «o nome de Yahweh», «indignação» e «fogo consumidor» são adequados ao registro profético e mantêm os termos teologicamente relevantes sem interpretação confessional adicional.
  issues:
  - severity: medium
    issue: A expressão «envolto em densa fumaça que se eleva» explicita elementos não inequívocos no hebraico.
    rationale: וְכֹבֶד מַשָּׂאָה é uma expressão obscura. Embora possa aludir a uma massa de fumaça no contexto, o hebraico não declara de modo explícito que o sujeito esteja «envolto» nem inclui de forma segura a oração «que se eleva». Uma tradução principal mais concisa, acompanhada de nota, preserva melhor a incerteza.
  - severity: low
    issue: A coordenação de «com sua ira ardendo e envolto...» é sintaticamente ambígua.
    rationale: «Envolto» concorda implicitamente com «o nome», mas a construção pode momentaneamente deslocar o foco da sequência descritiva hebraica. A revisão torna os dois elementos paralelos.
