revisions:
- from: Vejam! O nome de Yahweh vem de longe, com sua ira ardendo e envolto em densa fumaça que se eleva.[a] Seus lábios estão cheios de indignação, e sua língua é como fogo consumidor.
  to: Vejam! O nome de Yahweh vem de longe, com sua ira ardendo e com densa fumaça.[a] Seus lábios estão cheios de indignação, e sua língua é como fogo consumidor.
  rationale: A revisão conserva a leitura contextual de fumaça, mas remove as explicitações «envolto» e «que se eleva», que excediam o grau de certeza do hebraico. Também ajusta a sintaxe para manter em paralelo a ira ardente e a expressão difícil subsequente. A nota continua a registrar tanto a leitura contextual quanto as alternativas mais literais.
