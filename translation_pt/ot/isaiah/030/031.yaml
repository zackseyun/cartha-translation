source:
  edition: WLC
  text: כִּֽי מִ/קּ֥וֹל יְהוָ֖ה יֵחַ֣ת אַשּׁ֑וּר בַּ/שֵּׁ֖בֶט יַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/031.yaml
  text: For at the voice of Yahweh Assyria will be shattered[b][a]; with a rod he will strike.
translation:
  language: pt
  text: Pois, ao som da voz de Yahweh, a Assíria será destroçada[a]; com a vara, ele a golpeará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficará apavorada” ou “será abatida”. O verbo hebraico pode indicar terror, colapso ou destruição.
    reason: lexical_alternative
  - marker: b
    text: O hebraico não explicita o sujeito nem o objeto de “golpeará”. Pelo contexto, eles são entendidos naturalmente como Yahweh e a Assíria, respectivamente.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou razão ligada ao contexto anterior, com fluidez natural em português.
- source_word: מִקּוֹל
  choice: ao som da voz de
  rationale: A preposição מן indica aqui ocasião ou causa. A formulação mantém a imagem vívida da voz divina e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יֵחַת
  choice: será destroçada
  rationale: O nifal de חתת pode expressar terror, abatimento, colapso ou destruição. No contexto do juízo militar contra a Assíria, “será destroçada” comunica bem o colapso, sem ocultar em nota as demais possibilidades.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: Emprega a forma portuguesa consagrada para o império mencionado no contexto.
- source_word: בַּשֵּׁבֶט
  choice: com a vara
  rationale: שֵׁבֶט pode designar vara, bastão ou cetro; como instrumento de golpe e juízo, “vara” é a opção mais clara e direta.
- source_word: יַכֶּה
  choice: ele a golpeará
  rationale: O hifil de נכה significa golpear. O sujeito masculino singular e o objeto não são expressos, mas o contexto aponta naturalmente para Yahweh como agente e a Assíria como alvo; os pronomes tornam a frase idiomática em português, com a inferência documentada em nota.
theological_decisions:
- issue: Referente do sujeito e do objeto implícitos em יַכֶּה
  choice: 'Yahweh é entendido como sujeito, e a Assíria como objeto: “ele a golpeará”.'
  alternative: Manter a formulação mais elíptica, “com a vara, ele golpeará”, ou adotar outra análise sintática da cláusula.
  rationale: O hebraico não nomeia novamente o sujeito nem expressa o objeto, mas Yahweh e a Assíria são, respectivamente, os referentes contextuais mais naturais. A nota conserva a transparência quanto à elipse do original sem acrescentar uma afirmação doutrinária.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Ao som da voz” preserva a força poética; “destroçada” mantém a imagem de juízo e colapso, enquanto as alternativas semânticas são registradas em nota.
