  text: כִּי עַ֛ם בְּ/צִיּ֥וֹן יֵשֵׁ֖ב בִּ/ירֽוּשָׁלִָ֑ם בָּכ֣וֹ לֹֽא תִבְכֶּ֗ה חָנ֤וֹן יָחְנְ/ךָ֙ לְ/ק֣וֹל זַעֲקֶ֔/ךָ כְּ/שָׁמְעָת֖/וֹ עָנָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/019.yaml
  text: For a people in Zion will dwell in Jerusalem[a]; you will surely weep no more. He will surely be gracious to you at the sound of your cry; when he hears it[b], he will answer you.
translation:
  language: pt
  text: Pois um povo habitará em Sião, em Jerusalém; você não chorará mais, de modo algum.[a] Ele certamente lhe mostrará favor[b] ao som do seu clamor; quando o ouvir, lhe responderá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “chorando, você não chorará” — construção enfática que significa “você certamente não chorará” ou “você não chorará mais”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “mostrando favor, ele lhe mostrará favor” — construção enfática que ressalta a certeza do favor do SENHOR.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da promessa anterior e mantém uma ligação discursiva natural em português.
- source_word: עַם
  choice: um povo
  rationale: Preserva o sentido coletivo e a forma indefinida do substantivo sem especificar além do hebraico.
- source_word: בְּצִיּוֹן ... בִּירוּשָׁלִָם
  choice: em Sião, em Jerusalém
  rationale: Mantém os dois nomes geográficos e a aposição compacta do texto hebraico.
- source_word: יֵשֵׁב
  choice: habitará
  rationale: Neste contexto de restauração e residência, ישׁב significa habitar ou viver estabelecido, não apenas sentar-se.
- source_word: בָּכוֹ לֹא תִבְכֶּה
  choice: você não chorará mais, de modo algum
  rationale: A formulação reproduz de maneira idiomática tanto a negação quanto a ênfase do infinitivo absoluto seguido do verbo finito.
- source_word: חָנוֹן יָחְנְךָ
  choice: Ele certamente lhe mostrará favor
  rationale: A raiz חנן expressa a concessão de favor ou graça, e 'certamente' comunica a ênfase da construção hebraica.
- source_word: לְקוֹל זַעֲקֶךָ
  choice: ao som do seu clamor
  rationale: Conserva a imagem auditiva e a relação direta entre o clamor do povo e a resposta divina.
- source_word: כְּשָׁמְעָתוֹ
  choice: assim que o ouvir
  rationale: Expressa naturalmente o valor temporal da construção; o pronome retoma 'clamor'.
- source_word: עָנָךְ
  choice: lhe responderá
  rationale: O futuro se ajusta ao contexto de promessa, enquanto 'responder' representa diretamente o verbo ענה.
theological_decisions:
- issue: Sujeito divino implícito nas últimas orações
  choice: Explicitar o sujeito como 'Ele', com referência ao SENHOR no contexto
  alternative: Manter o sujeito sem expressão explícita ou repetir 'o SENHOR'
  rationale: O hebraico identifica o sujeito verbal pelo contexto. O pronome torna a frase clara em português sem inserir um título divino ausente nesta oração.
- issue: Sentido de חנן
  choice: Traduzir como 'mostrar favor'
  alternative: Traduzir como 'ter compaixão', 'ser misericordioso' ou 'ser gracioso'
  rationale: '''Mostrar favor'' conserva o campo semântico de graça/favor sem confundi-lo com outra raiz hebraica específica para compaixão e sem recorrer a uma formulação pouco natural.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O singular 'você' representa a forma hebraica singular dirigida coletivamente ao povo. A pontuação mantém 'em Jerusalém' ligado à habitação, mas sem eliminar por completo a compactação sintática do hebraico.
