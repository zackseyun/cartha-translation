id: ISA.30.30
reference: Isaiah 30:30
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִשְׁמִ֨יעַ יְהוָ֜ה אֶת ה֣וֹד קוֹל֗/וֹ וְ/נַ֤חַת זְרוֹע/וֹ֙ יַרְאֶ֔ה בְּ/זַ֣עַף אַ֔ף וְ/לַ֖הַב אֵ֣שׁ אוֹכֵלָ֑ה נֶ֥פֶץ וָ/זֶ֖רֶם וְ/אֶ֥בֶן בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/030.yaml
  text: And Yahweh will make the majesty of his voice heard[a], and will show the descending blow of his arm, in furious anger and a flame of consuming fire[b], with cloudburst and storm and hailstones.
translation:
  language: pt
  text: E Yahweh fará ouvir a majestade da sua voz e mostrará o golpe descendente do seu braço[a], com ira furiosa e chama de fogo consumidor, com aguaceiro violento[b], tempestade e pedras de granizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a descida do seu braço”. A expressão hebraica é difícil e pode destacar o movimento descendente do braço de Yahweh no juízo, em vez do impacto do golpe.
    reason: lexical_alternative
  - marker: b
    text: Ou “chuva torrencial”. O termo hebraico provavelmente se refere a uma tempestade que irrompe com violência.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal de forma transliterada e coerente com a convenção do projeto.
- source_word: הִשְׁמִיעַ
  choice: fará ouvir
  rationale: Preserva de modo natural em português a força causativa do hifil de שׁמע.
- source_word: הוֹד קוֹלוֹ
  choice: a majestade da sua voz
  rationale: הוֹד expressa majestade ou esplendor; “majestade” se ajusta ao contexto teofânico e soa natural com “voz”.
- source_word: נַחַת זְרוֹעוֹ
  choice: o golpe descendente do seu braço
  rationale: A expressão é difícil. No contexto de juízo, pode indicar tanto o movimento para baixo quanto o impacto do braço; esta formulação mantém ambos em vista.
- source_word: יַרְאֶה
  choice: mostrará
  rationale: Expressa de maneira idiomática o sentido causativo de “fazer ver, exibir”.
- source_word: בְּזַעַף אַף
  choice: com ira furiosa
  rationale: Reproduz a intensificação da ira divina sem uma repetição pouco natural em português.
- source_word: לַהַב אֵשׁ אֹכֵלָה
  choice: chama de fogo consumidor
  rationale: Conserva a imagem poética vívida e a força ativa do particípio “que consome”.
- source_word: נֶפֶץ
  choice: aguaceiro violento
  rationale: Na sequência meteorológica, provavelmente designa uma precipitação súbita e impetuosa; a escolha é clara e corrente em português.
- source_word: זֶרֶם
  choice: tempestade
  rationale: Comunica o fenômeno impetuoso indicado pelo substantivo e funciona naturalmente junto de aguaceiro e granizo.
- source_word: אֶבֶן בָּרָד
  choice: pedras de granizo
  rationale: Mantém a imagem concreta do hebraico, literalmente “pedra de granizo”, em forma idiomática portuguesa.
theological_decisions:
- issue: Linguagem antropomórfica do braço e da ira de Yahweh no juízo
  choice: Conservar a imagem concreta do braço que desce para golpear e da ira furiosa.
  alternative: Abstrair a linguagem como simples manifestação do poder divino.
  rationale: O hebraico apresenta imagens corporais e emocionais vívidas como linguagem poética de teofania e juízo; preservá-las mantém a força profética sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade para leitores brasileiros. A estrutura conserva o paralelismo profético e as imagens concretas do hebraico, esclarecendo em notas duas expressões lexicalmente difíceis.
