id: ISA.30.18
reference: Isaiah 30:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָ/כֵ֞ן יְחַכֶּ֤ה יְהוָה֙ לַֽ/חֲנַנְ/כֶ֔ם וְ/לָ/כֵ֥ן יָר֖וּם לְ/רַֽחֶמְ/כֶ֑ם כִּֽי אֱלֹהֵ֤י מִשְׁפָּט֙ יְהוָ֔ה אַשְׁרֵ֖י כָּל ח֥וֹכֵי לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/018.yaml
  text: Therefore Yahweh waits to be gracious to you[a], and therefore he rises up to show you mercy; for Yahweh is a God of justice. Blessed are all who wait for him.
translation:
  language: pt
  text: Por isso, Yahweh espera para lhes conceder graça; e, por isso, ele se levanta para ter compaixão de vocês.[a] Pois Yahweh é um Deus de justiça. Felizes todos os que esperam por ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, por isso, ele é exaltado para ter compaixão de vocês” ou “e, por isso, ele se exalta para ter compaixão de vocês”.'
    reason: O hebraico יָרוּם pode indicar que Yahweh se levanta para agir ou que é exaltado ou se exalta; o contexto não elimina completamente essas possibilidades.
lexical_decisions:
- source_word: וְלָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a relação inferencial ou resultativa e mantém sua repetição enfática nas duas orações.
- source_word: יְחַכֶּה
  choice: espera
  rationale: Preserva o sentido básico de חכה e a tensão do adiamento deliberado, além do eco com חוֹכֵי no fim do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לַחֲנַנְכֶם
  choice: para lhes conceder graça
  rationale: Comunica o favor imerecido expresso por חנן e o distingue da compaixão indicada em seguida por רחם.
- source_word: יָרוּם
  choice: ele se levanta
  rationale: Mantém a imagem verbal concreta de רום e, no paralelismo, sugere que Yahweh se dispõe a agir; a possível referência à exaltação é conservada em nota.
- source_word: לְרַחֶמְכֶם
  choice: para ter compaixão de vocês
  rationale: Representa רחם de modo claro e atual, sem fundi-lo lexicalmente com a graça da oração anterior.
- source_word: כִּי
  choice: Pois
  rationale: Introduz de maneira natural a razão que fundamenta as afirmações anteriores.
- source_word: אֱלֹהֵי מִשְׁפָּט
  choice: um Deus de justiça
  rationale: Apresenta מִשְׁפָּט como atributo do governo justo de Deus, sentido mais adequado aqui do que o ato específico de julgar.
- source_word: אַשְׁרֵי
  choice: Felizes
  rationale: Verte a fórmula sapiencial de bem-aventurança em português corrente e digno, descrevendo a condição favorecida dos que esperam em Deus.
- source_word: כָּל חוֹכֵי לוֹ
  choice: todos os que esperam por ele
  rationale: Mantém o alcance universal, a orientação relacional e a repetição literária do verbo 'esperar' usado antes a respeito de Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; a transliteração preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido de יָרוּם no contexto
  choice: ele se levanta
  alternative: ele é exaltado; ele se exalta
  rationale: O paralelismo com a espera para conceder graça favorece uma imagem de movimento rumo à ação misericordiosa, mas o verbo também admite a ideia de exaltação; a ambiguidade genuína é explicitada em nota.
- issue: Relação entre justiça e a espera divina
  choice: Preservar a afirmação sem explicar o motivo do adiamento
  alternative: Explicitar que a justiça exige ou determina a demora
  rationale: O hebraico associa o agir e o tempo de Yahweh ao fato de ele ser Deus de justiça, mas não define com precisão como essa relação opera; a tradução evita impor uma solução teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “Por isso” e “espera/esperam” foi mantida por sua função retórica. Empregou-se “lhes” junto de “vocês”, combinação corrente no português brasileiro amplo, e “Felizes” para uma fórmula de bem-aventurança natural sem perder solenidade.
