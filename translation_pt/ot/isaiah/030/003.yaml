  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָ֥ה לָ/כֶ֛ם מָע֥וֹז פַּרְעֹ֖ה לְ/בֹ֑שֶׁת וְ/הֶ/חָס֥וּת בְּ/צֵל מִצְרַ֖יִם לִ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/003.yaml
  text: Then Pharaoh’s stronghold will become your shame[b][a], and refuge in Egypt’s shadow your humiliation.
translation:
  language: pt
  text: Então, a fortaleza de Faraó se tornará motivo de vergonha para vocês, e o abrigo à sombra do Egito, motivo de humilhação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “À sombra do Egito” é uma metáfora para buscar proteção no Egito. O termo traduzido por “fortaleza” também pode significar “refúgio” ou “lugar de proteção”.
    reason: Nota cultural e alternativa lexical.
lexical_decisions:
- source_word: וְהָיָה
  choice: Então ... se tornará
  rationale: No contexto da advertência profética, o waw com qatal tem valor consequencial e futuro. A formulação expressa naturalmente o resultado da confiança no Egito.
- source_word: לָכֶם
  choice: para vocês
  rationale: O pronome preposicionado indica que a vergonha e a humilhação recairão sobre os destinatários; a expressão é incorporada de modo idiomático em 'motivo de vergonha para vocês'.
- source_word: מָעוֹז
  choice: fortaleza
  rationale: O substantivo designa uma fonte ou lugar de força e proteção. 'Fortaleza' conserva a imagem concreta e mantém distinção em relação a חָסוּת, traduzido por 'abrigo'.
- source_word: פַּרְעֹה
  choice: Faraó
  rationale: Forma tradicional e amplamente reconhecida em português para o título real egípcio.
- source_word: לְבֹשֶׁת
  choice: motivo de vergonha
  rationale: בֹּשֶׁת denota vergonha ou desonra. A expressão portuguesa comunica com clareza que aquilo em que confiavam produziria vergonha.
- source_word: וְהֶחָסוּת
  choice: e o abrigo
  rationale: O substantivo indica abrigo ou busca de proteção. 'Abrigo' preserva a ideia nominal e evita repetir 'fortaleza'.
- source_word: בְּצֵל מִצְרַיִם
  choice: à sombra do Egito
  rationale: Mantém a metáfora hebraica da sombra como proteção, em formulação natural e inteligível em português.
- source_word: לִכְלִמָּה
  choice: motivo de humilhação
  rationale: כְּלִמָּה é semanticamente próximo de בֹּשֶׁת, mas pode salientar desonra ou humilhação. A escolha preserva uma distinção retórica entre os dois termos paralelos.
theological_decisions:
- issue: Preservação dos dois termos paralelos ligados à desonra
  choice: Traduzir בֹּשֶׁת por 'vergonha' e כְּלִמָּה por 'humilhação'
  alternative: Empregar 'vergonha' ou 'desonra' em ambos os membros
  rationale: O hebraico usa substantivos distintos, embora semanticamente próximos. Diferenciá-los preserva o paralelismo com variação lexical sem acrescentar uma interpretação teológica.
- issue: Sentido da sombra do Egito
  choice: Conservar a metáfora 'à sombra do Egito'
  alternative: Explicitar no texto principal como 'sob a proteção do Egito'
  rationale: A imagem hebraica é compreensível em português e conserva a força poética e a ambiguidade figurativa; seu sentido protetor é esclarecido em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O paralelismo poético foi preservado, assim como a metáfora da sombra; a elipse verbal no segundo membro foi mantida de forma natural.
