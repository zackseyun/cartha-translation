base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/029.yaml
  text: The song will be for you as in the night when a feast is consecrated[a], and gladness of heart as when one goes with the flute to come to the mountain of Yahweh[d][c][b], to the Rock of Israel.
translation:
  language: pt
  text: Vocês terão um cântico como na noite em que se consagra uma festa[a], e alegria no coração como a de quem caminha ao som da flauta[b] para ir ao monte de Yahweh[c], à Rocha de Israel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como na noite de uma festa consagrada”. A comparação hebraica pode se referir especificamente à noite de uma festa, provavelmente no contexto de uma peregrinação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com uma flauta” ou “ao som de instrumentos de sopro”. O termo hebraico designa uma flauta ou um instrumento semelhante, usado em procissões festivas.'
    reason: lexical_alternative
  - marker: c
    text: O nome divino hebraico YHWH é aqui representado por “Yahweh”; tradicionalmente, também se traduz por “SENHOR”, e a forma “Javé” é comum em português.
    reason: alternative_reading
  - marker: d
    text: 'Ou: “à Rocha que é de Israel”. “Rocha” é um título divino que ressalta força, estabilidade e refúgio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁיר יִהְיֶה לָכֶם
  choice: Vocês terão um cântico
  rationale: Expressa de modo natural em português a construção idiomática hebraica, segundo a qual o cântico 'será para vocês', preservando o valor futuro e a ideia de posse ou experiência.
- source_word: כְּלֵיל הִתְקַדֶּשׁ חָג
  choice: como na noite em que se consagra uma festa
  rationale: Mantém a comparação e o caráter sagrado da celebração. O presente 'se consagra' pode descrever o rito característico dessa noite sem determinar uma festa específica.
- source_word: וְשִׂמְחַת לֵבָב
  choice: e alegria no coração
  rationale: Reproduz a expressão antropológica hebraica em linguagem corrente e digna, mantendo o paralelismo com o cântico.
- source_word: כַּהוֹלֵךְ בֶּחָלִיל
  choice: como a de quem caminha ao som da flauta
  rationale: O particípio tem sentido genérico, e בֶּחָלִיל pode indicar acompanhamento instrumental. 'Ao som da flauta' comunica naturalmente uma procissão festiva.
- source_word: לָבוֹא בְהַר יְהוָה
  choice: para ir ao monte de Yahweh
  rationale: O infinitivo indica finalidade ou direção. Em português, 'ir ao' é natural na perspectiva dos peregrinos e o movimento permite que בְ seja vertido direcionalmente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל צוּר יִשְׂרָאֵל
  choice: à Rocha de Israel
  rationale: Preserva a metáfora divina e sua força titular, que comunica estabilidade, força e refúgio.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo silenciosamente por um título; a nota registra alternativas tradicionais em português.
- issue: Nuance cultual de הִתְקַדֶּשׁ חָג
  choice: em que se consagra uma festa
  alternative: em que se santifica uma festa; na noite de uma festa consagrada
  rationale: A formulação conserva a ideia de separar a celebração como santa e a possível referência a uma noite de peregrinação, sem identificar além do que o texto declara.
- issue: Metáfora divina צוּר יִשְׂרָאֵל
  choice: Rocha de Israel
  alternative: Rocha de Israel sem inicial maiúscula; Rochedo de Israel
  rationale: A inicial maiúscula sinaliza o uso titular, sem desfazer a metáfora nem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Vocês' torna explícito o plural de לָכֶם; 'cântico' conserva o tom litúrgico, enquanto 'ao som da flauta' oferece fluidez sem eliminar a alternativa instrumental literal. Os marcadores aparecem junto aos elementos correspondentes no texto.
