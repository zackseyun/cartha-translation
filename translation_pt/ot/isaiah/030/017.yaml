  to: Mil fugirão diante da repreensão de um só; diante da repreensão de cinco, vocês fugirão, até ficarem como um mastro[a] no topo de uma montanha e como um estandarte[b] numa colina.
  rationale: A revisão evita a possível implicação de abandono introduzida por “sejam deixados”, mantendo a ideia hebraica de um remanescente que resta após a debandada. Também substitui “monte” por “montanha” para maior clareza lexical, sem alterar a imagem ou interpretar além do texto.
