  source_fidelity: 'A tradução reproduz com precisão a construção numérica e o paralelismo: mil fogem perante um, e o povo foge perante cinco. Também conserva adequadamente as imagens finais de תֹּרֶן e נֵס. Contudo, “sejam deixados” pode sugerir que alguém os abandona, enquanto o nifal נוֹתַרְתֶּם descreve mais diretamente o resultado de restarem após a derrota. “Montanha” corresponde mais claramente a הָהָר em português moderno.'
  naturalness: O texto é claro e de registro apropriado. “Até ficarem” é mais natural que “até que sejam deixados” neste contexto e mantém a relação com o sujeito expresso “vocês”. “No topo de uma montanha” tem leitura mais imediata e internacional do que “no topo de um monte”.
  terminology: “Repreensão”, “mastro” e “estandarte” são escolhas semanticamente defensáveis e mantêm a sobriedade da imagem hebraica. As notas preservam corretamente as alternativas lexicais sem impor uma interpretação da metáfora.
