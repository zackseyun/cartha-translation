  text: אֶ֣לֶף אֶחָ֗ד מִ/פְּנֵי֙ גַּעֲרַ֣ת אֶחָ֔ד מִ/פְּנֵ֛י גַּעֲרַ֥ת חֲמִשָּׁ֖ה תָּנֻ֑סוּ עַ֣ד אִם נוֹתַרְתֶּ֗ם כַּ/תֹּ֨רֶן֙ עַל רֹ֣אשׁ הָ/הָ֔ר וְ/כַ/נֵּ֖ס עַל הַ/גִּבְעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/017.yaml
  text: A thousand will flee at the rebuke of one[a]; at the rebuke of five you will flee, until you are left like a signal pole on the top of a mountain[b], and like a banner on a hill.
translation:
  language: pt
  text: Mil fugirão diante da repreensão de um só; diante da repreensão de cinco, vocês fugirão, até ficarem como um mastro[a] no topo de uma montanha e como um estandarte[b] numa colina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um poste alto”. O termo hebraico תֹּרֶן pode designar um mastro ou um poste elevado.
    reason: lexical_alternative
  - marker: b
    text: Ou “como uma bandeira de sinalização”. O termo hebraico נֵס designa uma bandeira ou um estandarte erguido como sinal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אֶחָד
  choice: Mil
  rationale: A expressão hebraica significa literalmente “mil, um”, isto é, “um milhar”; “mil” é a forma natural e direta em português.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Preserva a imagem relacional e causal de fugir perante alguém, sem reduzir a preposição apenas a uma indicação temporal.
- source_word: גַּעֲרַת
  choice: repreensão
  rationale: Mantém o núcleo lexical de uma censura ou palavra ameaçadora, ao mesmo tempo que permite ao contexto militar comunicar seu efeito aterrorizante.
- source_word: אֶחָד
  choice: um só
  rationale: “Só” torna explícito, de maneira natural em português, o contraste retórico entre um perseguidor e mil fugitivos, sem alterar o numeral.
- source_word: חֲמִשָּׁה
  choice: cinco
  rationale: Reproduz diretamente o numeral que intensifica a desproporção da derrota.
- source_word: תָּנֻסוּ
  choice: vocês fugirão
  rationale: Verte o imperfeito qal na segunda pessoa do plural com linguagem corrente e preserva a interpelação direta ao povo.
- source_word: עַד אִם
  choice: até que
  rationale: Expressa naturalmente em português o limite resultante introduzido pela locução hebraica.
- source_word: נוֹתַרְתֶּם
  choice: sejam deixados
  rationale: Preserva a forma passiva e a ideia de restarem após a debandada.
- source_word: כַּתֹּרֶן
  choice: como um mastro
  rationale: תֹּרֶן pode designar um mastro ou poste alto. “Mastro” é uma equivalência lexical concreta e mantém a figura de algo isolado e visível no alto.
- source_word: עַל רֹאשׁ הָהָר
  choice: no topo de um monte
  rationale: Tradução natural da expressão locativa; o artigo hebraico não exige referência a um monte específico nesta comparação.
- source_word: וְכַנֵּס
  choice: e como um estandarte
  rationale: נֵס designa um estandarte ou bandeira erguida como sinal. “Estandarte” preserva tanto o objeto elevado quanto sua função pública e visível.
- source_word: עַל הַגִּבְעָה
  choice: sobre uma colina
  rationale: Reproduz com naturalidade a localização elevada da segunda imagem paralela.
theological_decisions:
- issue: Sentido da comparação final
  choice: Conservar as imagens concretas do mastro e do estandarte, permitindo que comuniquem isolamento, exposição e visibilidade depois da derrota.
  alternative: Explicitar no texto que o remanescente ficará sozinho ou servirá de sinal de advertência.
  rationale: O paralelismo sugere um remanescente solitário e conspícuo, mas não define um único aspecto da metáfora. A tradução evita resolver a tensão ao acrescentar uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “diante da repreensão” conserva a força retórica do hebraico; “vocês” comunica de modo inequívoco a segunda pessoa do plural.
