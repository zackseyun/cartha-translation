source:
  edition: WLC
  text: ס֚וּרוּ מִנֵּי דֶ֔רֶךְ הַטּ֖וּ מִנֵּי אֹ֑רַח הַשְׁבִּ֥יתוּ מִ/פָּנֵ֖י/נוּ אֶת קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/011.yaml
  text: Turn aside from the way[a]; depart from the path; remove the Holy One of Israel from before us.
translation:
  language: pt
  text: Saiam do caminho; desviem-se da vereda; tirem da nossa presença o Santo de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “façam o Santo de Israel cessar de diante de nós”.'
    reason: Preserva como alternativa a força causativa de הַשְׁבִּיתוּ e a expressão espacial מִפָּנֵינוּ.
lexical_decisions:
- source_word: סוּרוּ מִנֵּי דֶרֶךְ
  choice: Saiam do caminho
  rationale: O imperativo plural de סור indica afastamento de uma rota. “Saiam do caminho” é natural em português e preserva a imagem espacial e metafórica do hebraico.
- source_word: הַטּוּ מִנֵּי אֹרַח
  choice: desviem-se da vereda
  rationale: O imperativo de נטה pede que os destinatários se desviem, enquanto אֹרַח forma um paralelismo poético com דֶרֶךְ. “Vereda” mantém a distinção entre os dois termos sem perder clareza.
- source_word: הַשְׁבִּיתוּ מִפָּנֵינוּ
  choice: tirem da nossa presença
  rationale: 'O hifil de שבת tem força causativa: fazer cessar ou deixar de estar presente. No contexto, “tirem da nossa presença” comunica com naturalidade a exigência hostil, sem reduzir o sentido a mero afastamento visual.'
- source_word: אֶת קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Título divino recorrente em Isaías, preservado integralmente para manter tanto a linguagem de santidade quanto a identificação do Deus de Israel.
theological_decisions:
- issue: Referente de “o Santo de Israel”
  choice: Título divino que designa o Deus de Israel
  alternative: Referência metonímica à mensagem profética de Isaías ou à santidade divina em sentido abstrato
  rationale: 'Em Isaías, a expressão funciona repetidamente como título do próprio Deus. A tradução direta conserva a tensão do texto: os ouvintes querem afastar de sua presença aquele cuja palavra os confronta, sem substituir o título por uma interpretação.'
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético entre “caminho” e “vereda”. “Tirem da nossa presença” privilegia naturalidade sem ocultar a formulação hebraica, registrada na nota.
