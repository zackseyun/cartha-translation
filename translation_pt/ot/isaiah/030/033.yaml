source:
  edition: WLC
  text: כִּֽי עָר֤וּךְ מֵֽ/אֶתְמוּל֙ תָּפְתֶּ֔ה גַּם הוא לַ/מֶּ֥לֶךְ הוּכָ֖ן הֶעְמִ֣יק הִרְחִ֑ב מְדֻרָתָ֗/הּ אֵ֤שׁ וְ/עֵצִים֙ הַרְבֵּ֔ה נִשְׁמַ֤ת יְהוָה֙ כְּ/נַ֣חַל גָּפְרִ֔ית בֹּעֲרָ֖ה בָּֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/033.yaml
  text: For Topheth has long been prepared[a]; indeed, it is made ready for the king. He has made it deep and wide, with a pyre of fire and wood in abundance. The breath of Yahweh, like a stream of sulfur[c][b], kindles it.
translation:
  language: pt
  text: Pois o Tofete[a] está preparado há muito tempo[b]; sim, está pronto para o rei. Ele o fez fundo e largo; sua pira, com fogo e lenha em abundância. O sopro de Yahweh, como uma torrente de enxofre, o incendeia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tofet”. O hebraico apresenta um nome de lugar associado a imagens de queima e juízo.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “desde ontem”, expressão que aqui indica que o lugar foi preparado de antemão ou há muito tempo.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “arde nela”. A expressão hebraica também pode ser entendida de modo mais estritamente locativo.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: תָּפְתֶּה
  choice: Tofete
  rationale: Transliteração portuguesa corrente do nome do lugar, preservando-o como nome próprio em vez de traduzir sua associação com fogo e juízo.
- source_word: עָרוּךְ מֵאֶתְמוּל
  choice: está preparado há muito tempo
  rationale: עָרוּךְ expressa o estado resultante de algo preparado; מֵאֶתְמוּל é literalmente “desde ontem”, mas funciona aqui como expressão de anterioridade remota.
- source_word: גַּם הוּא לַמֶּלֶךְ הוּכָן
  choice: sim, está pronto para o rei
  rationale: “Sim” transmite a ênfase de גַּם הוּא, enquanto “está pronto” representa o hophal de כון sem repetir exatamente “preparado”.
- source_word: הֶעְמִיק הִרְחִב
  choice: Ele o fez fundo e largo
  rationale: Os dois verbos hiphil indicam que um sujeito masculino singular tornou o lugar profundo e amplo. O pronome “Ele” mantém o sujeito implícito do hebraico sem identificá-lo em nota explicativa.
- source_word: מְדֻרָתָהּ
  choice: sua fogueira
  rationale: O substantivo designa o local ou monte preparado para a queima. “Fogueira” é corrente e combina naturalmente com o fogo e a lenha mencionados em seguida.
- source_word: אֵשׁ וְעֵצִים הַרְבֵּה
  choice: tem fogo e lenha em abundância
  rationale: A formulação comunica com naturalidade tanto os materiais da fogueira quanto a ideia de grande quantidade expressa por הַרְבֵּה.
- source_word: נִשְׁמַת יְהוָה
  choice: O sopro de Yahweh
  rationale: “Sopro” é a correspondência direta e preserva a imagem da força que procede de Yahweh; o nome divino é transliterado.
- source_word: כְּנַחַל גָּפְרִית
  choice: como uma torrente de enxofre
  rationale: נַחַל pode indicar um curso de água ou torrente; “torrente” comunica melhor a força da imagem. “Enxofre” é o termo moderno comum para גָּפְרִית.
- source_word: בֹּעֲרָה בָּהּ
  choice: o incendeia
  rationale: No contexto da fogueira preparada, a expressão retrata o sopro de Yahweh fazendo o Tofete arder. A nota conserva a possibilidade mais estritamente locativa de “arde nele”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Identidade de לַמֶּלֶךְ, “o rei”
  choice: para o rei
  alternative: para o rei da Assíria; para Moloque
  rationale: Embora o contexto possa sugerir o rei assírio e haja propostas de associação com Moloque, o hebraico diz apenas “o rei”; a tradução não resolve uma identificação que o versículo deixa implícita.
- issue: Sujeito de “Ele o fez fundo e largo”
  choice: Ele
  alternative: Yahweh; alguém; foi feito fundo e largo
  rationale: Os verbos hebraicos têm sujeito masculino singular não expresso. O pronome mantém essa forma sem inserir explicitamente uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas naturais para leitores brasileiros. “Tofete” segue a transliteração portuguesa corrente; “enxofre” evita vocabulário arcaico. O paralelismo e a imagem intensa do hebraico foram preservados sem identificar além do texto o rei nem o sujeito implícito dos verbos.
