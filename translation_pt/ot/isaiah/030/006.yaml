source:
  edition: WLC
  text: מַשָּׂ֖א בַּהֲמ֣וֹת נֶ֑גֶב בְּ/אֶרֶץ֩ צָרָ֨ה וְ/צוּקָ֜ה לָבִ֧יא וָ/לַ֣יִשׁ מֵ/הֶ֗ם אֶפְעֶה֙ וְ/שָׂרָ֣ף מְעוֹפֵ֔ף יִשְׂאוּ֩ עַל כֶּ֨תֶף עֲיָרִ֜ים חֵֽילֵ/הֶ֗ם וְ/עַל דַּבֶּ֤שֶׁת גְּמַלִּים֙ אֽוֹצְרֹתָ֔/ם עַל עַ֖ם לֹ֥א יוֹעִֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/006.yaml
  text: 'An oracle concerning the beasts of the Negev: through a land of distress and hardship[a], of lioness and lion, of viper and flying fiery serpent, they carry their wealth on the shoulders of donkeys and their treasures on the humps of camels[c][b], to a people who cannot profit them.'
translation:
  language: pt
  text: 'Oráculo sobre os animais do Neguebe:


    Por uma terra de aflição e angústia,


    onde há leoa e leão,[b] víbora e serpente ardente voadora,


    eles levam suas riquezas sobre os ombros de jumentos


    e seus tesouros sobre as corcovas de camelos,


    para um povo que não lhes será de proveito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para um povo que não os ajudará”. O verbo hebraico pode significar trazer proveito, ser útil ou ajudar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “leão e leão”. Os dois termos hebraicos para leão são distintos, mas sua diferença exata neste contexto é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Sentença
  rationale: Em títulos proféticos, o termo introduz uma declaração solene. “Sentença” conserva esse caráter sem impor o sentido material de “peso”; “oráculo” também seria possível.
- source_word: בַּהֲמוֹת נֶגֶב
  choice: os animais do Neguebe
  rationale: Mantém a referência geográfica provável e abrange os animais de carga mencionados no versículo.
- source_word: בְּאֶרֶץ צָרָה וְצוּקָה
  choice: Por uma terra de aflição e angústia
  rationale: A preposição é entendida como percurso; os dois substantivos próximos em sentido são preservados como um par enfático.
- source_word: לָבִיא וָלַיִשׁ
  choice: leoa e leão
  rationale: Distingue os dois termos hebraicos para leão, embora a diferença zoológica exata permaneça incerta.
- source_word: אֶפְעֶה
  choice: víbora
  rationale: Equivalente moderno e claro para uma serpente venenosa.
- source_word: שָׂרָף מְעוֹפֵף
  choice: serpente ardente voadora
  rationale: Preserva a imagem incomum e a ambiguidade do referente zoológico, sem a reduzir a uma espécie moderna específica.
- source_word: יִשְׂאוּ
  choice: eles levam
  rationale: Expressa naturalmente o transporte de bens pelos emissários com animais de carga.
- source_word: עַל כֶּתֶף עֲיָרִים
  choice: sobre os ombros de jumentos
  rationale: Conserva a imagem literal de “ombro” e o paralelismo com as corcovas dos camelos.
- source_word: חֵילֵהֶם
  choice: suas riquezas
  rationale: No contexto de bens enviados ao Egito, o sentido econômico de recursos ou riqueza é o mais adequado.
- source_word: עַל דַּבֶּשֶׁת גְּמַלִּים
  choice: sobre as corcovas de camelos
  rationale: Traduz especificamente o termo hebraico para a corcova do camelo.
- source_word: אֹצְרֹתָם
  choice: seus tesouros
  rationale: Representa os objetos valiosos armazenados e transportados como presentes diplomáticos.
- source_word: עַל עַם לֹא יוֹעִילוּ
  choice: para um povo que não lhes trará proveito
  rationale: Mantém tanto a direção do envio quanto o sentido de beneficiar ou ser útil, sem decidir de modo excessivo entre proveito e ajuda.
theological_decisions:
- issue: Natureza da lista de criaturas perigosas no Neguebe
  choice: Traduzir os animais como elementos do percurso perigoso pelo deserto.
  alternative: Interpretá-los como símbolos de poderes políticos ou generalizá-los como feras e serpentes.
  rationale: O texto destaca o perigo e a inutilidade da missão. A tradução direta preserva a força profética sem acrescentar uma identificação alegórica não explicitada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A disposição em linhas acompanha o movimento poético. “Neguebe” preserva o topônimo; “Sentença” dá ao cabeçalho força profética sem recorrer ao menos transparente “peso”.
