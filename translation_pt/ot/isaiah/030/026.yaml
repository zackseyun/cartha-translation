source:
  edition: WLC
  text: וְ/הָיָ֤ה אֽוֹר הַ/לְּבָנָה֙ כְּ/א֣וֹר הַֽ/חַמָּ֔ה וְ/א֤וֹר הַֽ/חַמָּה֙ יִהְיֶ֣ה שִׁבְעָתַ֔יִם כְּ/א֖וֹר שִׁבְעַ֣ת הַ/יָּמִ֑ים בְּ/י֗וֹם חֲבֹ֤שׁ יְהוָה֙ אֶת שֶׁ֣בֶר עַמּ֔/וֹ וּ/מַ֥חַץ מַכָּת֖/וֹ יִרְפָּֽא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/026.yaml
  text: And the light of the moon will be like the light of the sun[a], and the light of the sun will be sevenfold, like the light of seven days, on the day when Yahweh binds up the fracture of his people and heals the wound from his blow.
translation:
  language: pt
  text: E a luz da lua será como a luz do sol, e a luz do sol será sete vezes mais intensa, como a luz de sete dias, no dia em que Yahweh enfaixar a fratura do seu povo e curar a ferida causada pelo golpe que ele deu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir a expressão relativa à lesão como “a contusão causada pelo seu golpe” ou “o esmagamento causado pelo seu golpe”. O hebraico admite imagens um pouco diferentes para o ferimento, mas o sentido é que Yahweh cura o dano associado ao golpe que ele deu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E ... será
  rationale: Introduz o estado futuro anunciado e permite uma formulação natural em português sem reproduzir mecanicamente a construção hebraica.
- source_word: אוֹר
  choice: luz
  rationale: É o equivalente direto e natural para a luminosidade da lua e do sol, além de preservar a repetição poética.
- source_word: הַלְּבָנָה
  choice: a lua
  rationale: Embora o termo tenha associação etimológica com a brancura, aqui é a designação poética comum da lua.
- source_word: כְּאוֹר הַחַמָּה
  choice: como a luz do sol
  rationale: Mantém a comparação explícita e a repetição de “luz” em linguagem portuguesa clara.
- source_word: הַחַמָּה
  choice: o sol
  rationale: Neste contexto, o substantivo designa o astro solar, não o calor em sentido abstrato.
- source_word: שִׁבְעָתַיִם
  choice: sete vezes mais forte
  rationale: Expressa a multiplicação por sete em português corrente; “mais forte” qualifica a intensidade da luz sem introduzir uma imagem diferente.
- source_word: כְּאוֹר שִׁבְעַת הַיָּמִים
  choice: como a luz de sete dias
  rationale: Preserva a imagem poética e sua possível ambiguidade, sem explicitar se a luz dos dias é cumulativa.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: Conserva a referência temporal específica e o registro profético.
- source_word: חֲבֹשׁ
  choice: enfaixar
  rationale: Retém a imagem concreta de envolver ou ligar uma lesão para tratá-la, em vez de reduzi-la ao sentido genérico de cuidar.
- source_word: שֶׁבֶר
  choice: fratura
  rationale: O termo pode indicar quebra ou fratura e se ajusta à metáfora médica formada por “enfaixar”.
- source_word: עַמּוֹ
  choice: seu povo
  rationale: É a tradução natural da expressão com o sufixo de terceira pessoa masculina singular e preserva sua dimensão coletiva.
- source_word: וּמַחַץ מַכָּתוֹ
  choice: e curar a ferida causada pelo golpe que ele deu
  rationale: Apresenta a lesão resultante do golpe em português compreensível e mantém Yahweh como aquele que primeiro fere e depois cura.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança e evita ocultá-lo sob um título, em conformidade com a prática do projeto.
- issue: Referente do sufixo em מַכָּתוֹ
  choice: o golpe que ele deu
  alternative: sua ferida; o golpe sofrido pelo povo
  rationale: No contexto, a leitura mais coerente entende que Yahweh cura o dano causado por seu próprio ato de ferir. A formulação mantém a tensão entre juízo divino e restauração, sem suavizar sua agência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “luz” e a imagem médica foram preservadas; evitou-se explicar se “a luz de sete dias” é cumulativa.
