base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/010.yaml
  text: who say to the seers[a], “Do not see,” and to the visionaries, “Do not envision for us what is right; speak to us smooth things[b]; envision illusions.”
translation:
  language: pt
  text: 'que dizem aos videntes: “Não vejam”; e aos visionários: “Não tenham visões para nós do que é reto[a]. Falem-nos coisas suaves[b]; tenham visões de ilusões[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do que é franco” ou “do que é verdadeiro”. O termo hebraico designa aquilo que é reto, direito ou correto.
    reason: lexical_alternative
  - marker: b
    text: Isto é, palavras agradáveis ou lisonjeiras; literalmente, “coisas lisas”.
    reason: lexical_clarification
  - marker: c
    text: Ou “enganos” ou “delírios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים / תִרְאוּ
  choice: videntes / vejam
  rationale: רֹאִים é o particípio substantivado de ראה e designa figuras proféticas. A combinação “videntes / vejam” comunica em português a repetição semântica do hebraico, embora não reproduza a mesma raiz morfológica.
- source_word: חֹזִים / תֶחֱזוּ
  choice: os que têm visões / tenham visões
  rationale: A formulação preserva a relação cognata entre o título e o verbo derivados de חזה e mantém alguma distinção em relação ao par anterior.
- source_word: נְכֹחוֹת
  choice: do que é reto
  rationale: O termo denota aquilo que é direito, correto ou franco. “O que é reto” conserva a dimensão moral e factual sem restringi-la apenas à verdade proposicional.
- source_word: חֲלָקוֹת
  choice: coisas suaves
  rationale: A tradução mantém a imagem concreta de palavras lisas ou suaves, isto é, mensagens agradáveis, lisonjeiras e sem confronto.
- source_word: מַהֲתַלּוֹת
  choice: ilusões
  rationale: O substantivo se refere a coisas enganosas ou ilusórias. “Ilusões” combina naturalmente com o contexto de visões e preserva a acusação de falsidade.
- source_word: אֲשֶׁר אָמְרוּ
  choice: os quais dizem
  rationale: A oração relativa continua a caracterização do povo rebelde no contexto anterior; o presente comunica uma atitude característica.
theological_decisions:
- issue: Natureza da mensagem profética rejeitada
  choice: “do que é reto”
  alternative: “coisas verdadeiras” ou “coisas francas”
  rationale: A expressão hebraica abrange retidão, correção e franqueza. A tradução evita reduzir a rejeição do povo a uma categoria apenas intelectual ou apenas moral.
- issue: Distinção entre as duas designações proféticas
  choice: “videntes” e “os que têm visões”
  alternative: traduzir ambas como “videntes” ou como “profetas”
  rationale: O hebraico emprega em paralelo dois termos relacionados, mas lexicalmente distintos, para a percepção profética. A diferenciação torna essa estrutura visível sem introduzir funções teológicas diferentes.
- issue: Caráter das visões solicitadas
  choice: “ilusões”
  alternative: “enganos” ou “delírios”
  rationale: O texto apresenta o desejo por mensagens visionárias falsas ou enganosas. “Ilusões” preserva essa censura sem decidir se os mensageiros enganam deliberadamente ou estão eles próprios iludidos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “visões” é deliberada para refletir o jogo lexical do hebraico; “coisas suaves” conserva sua imagem concreta, esclarecida em nota.
