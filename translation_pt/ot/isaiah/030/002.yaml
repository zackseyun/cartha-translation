base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/002.yaml
  text: who set out to go down to Egypt, but have not asked my mouth, to seek refuge in Pharaoh’s stronghold and to take shelter in the shadow of Egypt.
translation:
  language: pt
  text: que partem para descer ao Egito sem consultar a minha boca, para buscar refúgio na fortaleza do faraó e para abrigar-se à sombra do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִי לֹא שָׁאָלוּ
  choice: sem consultar a minha boca
  rationale: Preserva a expressão concreta e incomum do hebraico, na qual a “boca” representa a palavra ou orientação direta de Deus, sem explicá-la além do texto.
- source_word: לָעוֹז בְּמָעוֹז פַּרְעֹה
  choice: buscando proteção na fortaleza do faraó
  rationale: Reproduz a relação entre o verbo עוז e o substantivo מָעוֹז, comunicando a procura de segurança no poder defensivo do faraó. Evita a repetição artificial “fortalecer-se na fortaleza” em português.
- source_word: וְלַחְסוֹת בְּצֵל מִצְרָיִם
  choice: e abrigo à sombra do Egito
  rationale: Mantém a metáfora bíblica da sombra como lugar de amparo e proteção, em formulação natural e digna em português.
- source_word: הַהֹלְכִים לָרֶדֶת מִצְרַיִם
  choice: que partem para descer ao Egito
  rationale: Mantém tanto a ideia de pôr-se a caminho quanto o uso geográfico tradicional de “descer” ao Egito.
theological_decisions:
- issue: Sentido de “minha boca”
  choice: Manter literalmente “a minha boca”
  alternative: “sem me consultar” ou “sem pedir a minha orientação”
  rationale: 'O referente divino decorre do contexto, e a formulação literal conserva a força da denúncia: buscaram conselho político sem recorrer à palavra de Deus.'
- issue: Natureza da confiança no faraó e no Egito
  choice: Expressar como busca de proteção e abrigo
  alternative: Explicitar como aliança política ou confiança militar
  rationale: Embora o contexto envolva política e poder militar, o versículo usa imagens de segurança e refúgio; a tradução não deve tornar explícito o que permanece figurado.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sintaxe acompanha a oração relativa iniciada no versículo anterior. Preservam-se as imagens hebraicas “minha boca”, “fortaleza” e “sombra”, evitando paráfrase doutrinária.
