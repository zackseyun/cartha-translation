base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/014.yaml
  text: and its breaking is like the breaking of a potter’s jar[a], smashed without pity[b], so that among its shattered pieces not a shard is found with which to take fire from the hearth or to scoop water from a cistern.
translation:
  language: pt
  text: e a sua quebra será como a quebra de um jarro de oleiro, despedaçado sem piedade, de modo que, entre os seus fragmentos, não se achará um caco que sirva para tirar fogo da lareira[a] ou para tirar água de uma cisterna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “para tirar fogo do lugar da queima”. Também se pode entender: “para retirar carvões ou brasas da lareira”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “de um reservatório” ou “de uma poça”. O termo hebraico pode designar, de modo mais geral, um lugar onde a água se acumula.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁבָרָהּ
  choice: e a sua quebra será
  rationale: Mantém a construção nominal e a referência feminina ao que vem sendo descrito no contexto; o futuro é natural em português dentro do anúncio profético.
- source_word: כְּשֵׁבֶר
  choice: como a quebra de
  rationale: Reproduz a repetição cognata do hebraico e preserva a força retórica da comparação.
- source_word: נֵבֶל יוֹצְרִים
  choice: um jarro de oleiro
  rationale: Expressa de modo concreto e corrente um recipiente de barro produzido por oleiro.
- source_word: כָּתוּת
  choice: despedaçado
  rationale: Comunica a destruição violenta e completa do recipiente sem ampliar indevidamente o sentido.
- source_word: לֹא יַחְמֹל
  choice: sem piedade
  rationale: Traduz diretamente a ideia de não poupar ou não ter compaixão e soa natural ligada ao ato de despedaçar.
- source_word: וְלֹא יִמָּצֵא
  choice: de modo que ... não se achará
  rationale: Torna clara a consequência da destruição total, preservando o valor resultativo da sequência.
- source_word: בִמְכִתָּתוֹ
  choice: entre os seus fragmentos
  rationale: Representa de forma inteligível o resultado do esmagamento ou despedaçamento.
- source_word: חֶרֶשׂ
  choice: um caco
  rationale: É o termo português comum e concreto para um fragmento de cerâmica.
- source_word: לַחְתּוֹת אֵשׁ
  choice: para apanhar brasas
  rationale: No contexto do uso de um caco, explicita naturalmente o material ardente que seria retirado, sem perder a imagem do fogo.
- source_word: מִיָּקוּד
  choice: da lareira
  rationale: Equivalente natural para o lugar onde arde o fogo; a nota registra a formulação mais literal.
- source_word: וְלַחְשֹׂף מַיִם
  choice: ou para tirar água
  rationale: Descreve de modo idiomático a ação de recolher água com o caco.
- source_word: מִגֶּבֶא
  choice: de uma cisterna
  rationale: A cisterna se ajusta bem ao cenário de água acumulada, enquanto a amplitude lexical é preservada em nota.
