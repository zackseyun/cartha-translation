  yaml_path: translation/ot/isaiah/030/004.yaml
  text: For his officials are in Zoan, and his envoys reach Hanes.
translation:
  language: pt
  text: Pois os seus oficiais estão em Zoã, e os seus enviados chegam a Hanes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרָיו
  choice: os seus oficiais
  rationale: O termo שׂרים pode designar príncipes, chefes ou altos funcionários. No contexto de uma missão política egípcia, “oficiais” comunica naturalmente a função sem impor título nobiliárquico.
- source_word: מַלְאָכָיו
  choice: os seus enviados
  rationale: מַלְאָכִים significa mensageiros ou enviados; aqui se refere a emissários humanos em missão diplomática, por isso “enviados” é adequado.
- source_word: יַגִּיעוּ
  choice: chegam
  rationale: O verbo נגע no hifil pode significar alcançar, chegar a ou fazer chegar. Com destino geográfico, “chegam a” é claro e idiomático, preservando o sentido do imperfeito hebraico no fluxo profético.
- source_word: צֹעַן / חָנֵס
  choice: Zoã / Hanes
  rationale: Transliterações tradicionais e reconhecíveis dos topônimos egípcios, sem acrescentar identificação geográfica incerta ao texto.
theological_decisions:
- issue: Referente do sufixo masculino singular em שָׂרָיו e מַלְאָכָיו
  choice: seus
  alternative: os oficiais e enviados dele, explicitando que se trata do rei ou do povo
  rationale: O hebraico conserva o referente apenas pelo contexto. O pronome “seus” mantém essa dependência contextual e evita resolver além do texto se o referente é o povo, Judá ou seu governante.
translation_notes:
  register: Português moderno, digno e direto, com estrutura paralela próxima do hebraico. “Pois” representa כִּי e liga o versículo à afirmação anterior; os topônimos seguem formas bíblicas correntes.
