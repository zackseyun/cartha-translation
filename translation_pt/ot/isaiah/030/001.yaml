  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֣וֹי בָּנִ֤ים סֽוֹרְרִים֙ נְאֻם יְהוָ֔ה לַ/עֲשׂ֤וֹת עֵצָה֙ וְ/לֹ֣א מִ/נִּ֔י וְ/לִ/נְסֹ֥ךְ מַסֵּכָ֖ה וְ/לֹ֣א רוּחִ֑/י לְמַ֛עַן סְפ֥וֹת חַטָּ֖את עַל חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/001.yaml
  text: Woe to the rebellious children[a], declares Yahweh, who carry out a plan, but not from me, and who pour out a libation, but not by my Spirit, so as to add sin to sin.
translation:
  language: pt
  text: “Ai dos filhos rebeldes”, declara Yahweh, “que põem em prática um plano, mas não vindo de mim, e derramam uma libação[a], mas não pelo meu Espírito, para acrescentar pecado a pecado!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e tecem uma cobertura”; alguns entendem a expressão de maneira mais ampla, neste contexto, como “e fazem uma aliança”. O texto hebraico, conforme vocalizado, lê-se mais naturalmente como “e derramam uma libação”.'
    reason: Registra leituras alternativas de uma expressão hebraica difícil, preservando no texto principal o sentido mais direto da vocalização massorética.
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Introduz uma denúncia profética com tom de lamento e ameaça; “Ai” preserva essa força em português bíblico atual.
- source_word: בָּנִים סוֹרְרִים
  choice: filhos rebeldes
  rationale: Mantém a imagem relacional e pactual de filhos que resistem deliberadamente à autoridade divina.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Reproduz com solenidade a fórmula profética e translitera o nome divino conforme a orientação do projeto.
- source_word: לַעֲשׂוֹת עֵצָה
  choice: põem em prática um plano
  rationale: Expressa a execução de uma política ou linha de ação, e não apenas a formulação abstrata de um conselho.
- source_word: וְלֹא מִנִּי
  choice: mas não da minha parte
  rationale: Comunica que o plano não tem em Yahweh sua origem nem sua autorização, sem acrescentar uma explicação ao texto.
- source_word: וְלִנְסֹךְ מַסֵּכָה
  choice: e derramam uma libação
  rationale: Segue a vocalização massorética, segundo a qual a expressão se refere mais naturalmente ao derramamento de uma oferta líquida; leituras contextuais alternativas ficam registradas em nota.
- source_word: וְלֹא רוּחִי
  choice: mas não pelo meu Espírito
  rationale: Preserva o Espírito de Yahweh como fonte ou agência ausente da ação, sem reduzir רוּחַ apenas a disposição ou vontade.
- source_word: לְמַעַן סְפוֹת
  choice: para acrescentar
  rationale: Mantém a relação de propósito ou resultado e introduz naturalmente a expressão cumulativa seguinte.
- source_word: חַטָּאת עַל חַטָּאת
  choice: pecado a pecado
  rationale: Conserva a repetição hebraica e comunica o acúmulo progressivo de culpa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva a identificação do nome pactual e segue a orientação declarada do projeto.
- issue: Interpretação de וְלִנְסֹךְ מַסֵּכָה
  choice: manter no texto principal o sentido massorético “derramam uma libação”
  alternative: “tecem uma cobertura” ou, em sentido contextual mais amplo, “fazem uma aliança”
  rationale: A vocalização massorética favorece a referência a uma libação, embora o contexto político permita outras interpretações. A leitura textual mais direta permanece no corpo, e a ambiguidade é documentada em nota.
- issue: Sentido de רוּחִי
  choice: meu Espírito
  alternative: meu espírito, no sentido de vontade ou disposição
  rationale: A formulação mantém a referência possível ao Espírito de Yahweh sem eliminar a amplitude semântica do hebraico nem explicar além do necessário.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sempre que naturais. O marcador [a] foi colocado junto à expressão efetivamente discutida na nota.
