  verdict: revise
  source_fidelity: 'O texto preserva bem a estrutura e os elementos centrais do hebraico: a denúncia introdutória (הוֹי), a designação relacional “filhos rebeldes”, a fórmula profética com Yahweh, o plano humano, a libação segundo a vocalização massorética, o “meu Espírito” e o acúmulo de “pecado a pecado”. A nota registra adequadamente a dificuldade de וְלִנְסֹךְ מַסֵּכָה sem substituir no corpo a leitura massorética.'
