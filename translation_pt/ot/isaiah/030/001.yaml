  terminology: “Yahweh”, “Espírito”, “libação” e “pecado a pecado” são escolhas adequadas e consistentes com o registro bíblico moderno. A capitalização de “Espírito” é defensável aqui, sem resolver de modo indevido toda a amplitude semântica de רוּחַ.
