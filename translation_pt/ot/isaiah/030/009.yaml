id: ISA.30.9
reference: Isaiah 30:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י עַ֤ם מְרִי֙ ה֔וּא בָּנִ֖ים כֶּחָשִׁ֑ים בָּנִ֕ים לֹֽא אָב֥וּ שְׁמ֖וֹעַ תּוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/009.yaml
  text: For they are a rebellious people[a], lying children, children unwilling to hear the law of Yahweh[b],
translation:
  language: pt
  text: Pois são um povo rebelde, filhos mentirosos[a], filhos que não querem ouvir a lei de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filhos enganadores” ou “filhos que mentem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “filhos que se recusam a ouvir” ou “filhos que não querem escutar a instrução de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da avaliação profética anterior e preserva naturalmente o valor causal-explicativo da conjunção.
- source_word: עַם מְרִי
  choice: um povo rebelde
  rationale: O substantivo מְרִי denota rebelião ou obstinação; em aposição a עַם, a formulação adjetiva comunica com clareza a acusação moral e pactual.
- source_word: בָּנִים
  choice: filhos
  rationale: O termo apresenta metaforicamente o povo como descendência; “filhos” preserva a imagem familiar repetida no hebraico.
- source_word: כֶּחָשִׁים
  choice: mentirosos
  rationale: Descreve pessoas caracterizadas pela falsidade. “Filhos mentirosos” mantém a acusação direta, sem ampliar indevidamente o sentido.
- source_word: לֹא אָבוּ
  choice: não querem
  rationale: A expressão enfatiza falta de disposição e recusa voluntária; “não querem” é corrente e conserva o aspecto volitivo.
- source_word: שְׁמוֹעַ
  choice: ouvir
  rationale: Preserva o sentido básico de ouvir ou escutar, deixando implícita, sem explicitá-la em excesso, a dimensão contextual de acolher e obedecer.
- source_word: תּוֹרַת
  choice: a lei
  rationale: Embora תּוֹרָה também possa significar instrução ou ensino, “lei” conserva aqui o peso autoritativo e pactual da palavra de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o caráter de nome pessoal e pactual.
- issue: Alcance de תּוֹרָה no contexto profético
  choice: lei
  alternative: instrução; ensino
  rationale: “Lei” mantém o peso pactual e normativo, enquanto a nota registra “instrução” como possibilidade lexical legítima.
- issue: Relação entre ouvir e obedecer em שׁמע
  choice: ouvir
  alternative: escutar; obedecer
  rationale: O sentido básico é receptivo-auditivo, embora no contexto pactual implique resposta obediente; a tradução evita resolver essa tensão por explicitação.
translation_notes:
  register: Português moderno, claro e digno, com estrutura profética concisa. A repetição de “filhos” foi mantida por corresponder à ênfase retórica do hebraico. “Não querem ouvir” soa natural em português e conserva tanto a volição quanto a receptividade sem traduzir diretamente como “obedecer”.
