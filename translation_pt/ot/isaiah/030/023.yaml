  text: וְ/נָתַן֩ מְטַ֨ר זַרְעֲ/ךָ֜ אֲשֶׁר תִּזְרַ֣ע אֶת הָ/אֲדָמָ֗ה וְ/לֶ֨חֶם֙ תְּבוּאַ֣ת הָֽ/אֲדָמָ֔ה וְ/הָיָ֥ה דָשֵׁ֖ן וְ/שָׁמֵ֑ן יִרְעֶ֥ה מִקְנֶ֛י/ךָ בַּ/יּ֥וֹם הַ/ה֖וּא כַּ֥ר נִרְחָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/023.yaml
  text: And he will give rain for your seed with which you sow the ground[a], and bread from the produce of the ground; and it will be rich and plentiful[b]. On that day your livestock will graze in a broad pasture.
translation:
  language: pt
  text: Ele dará chuva para a semente com que você semear a terra e pão da colheita da terra[a]; esse alimento será farto e substancioso[b]. Naquele dia, o seu gado pastará num pasto amplo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pão, o produto da terra». O hebraico também pode ser entendido como uma construção apositiva.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «gordo e rico», expressão que indica abundância e fertilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Ele dará
  rationale: O perfeito com waw, no contexto profético, expressa naturalmente uma ação futura. O sujeito implícito continua sendo o SENHOR, mencionado no contexto anterior; o pronome preserva a continuidade do hebraico.
- source_word: מְטַר זַרְעֲךָ
  choice: chuva para a semente
  rationale: מְטַר designa chuva, e זֶרַע, neste contexto agrícola, é a semente destinada ao plantio. A preposição «para» comunica a chuva concedida em benefício da semente.
- source_word: אֲשֶׁר תִּזְרַע אֶת הָאֲדָמָה
  choice: com que você semear a terra
  rationale: O hebraico apresenta a semente como instrumento com que a terra é semeada. Esta formulação conserva essa relação e soa natural em português.
- source_word: לֶחֶם תְּבוּאַת הָאֲדָמָה
  choice: pão produzido pela terra
  rationale: לֶחֶם é mantido concretamente como «pão», enquanto תְּבוּאַת הָאֲדָמָה indica o produto ou fruto da terra. A formulação explicita em português a relação entre ambos sem eliminar a possível leitura apositiva, registrada em nota.
- source_word: וְהָיָה דָשֵׁן וְשָׁמֵן
  choice: esse alimento será farto e substancioso
  rationale: Os adjetivos evocam literalmente gordura e riqueza, funcionando como linguagem de abundância e fertilidade. «Farto e substancioso» transmite a imagem agrícola sem a estranheza de uma tradução rigidamente literal; «esse alimento» torna claro o referente em português.
- source_word: יִרְעֶה מִקְנֶיךָ
  choice: o seu gado pastará
  rationale: מִקְנֶה é um termo coletivo amplo para animais domésticos, e «gado» preserva esse valor coletivo. יִרְעֶה descreve os animais alimentando-se no pasto.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Mantém a fórmula temporal profética em linguagem portuguesa corrente e digna.
- source_word: כַּר נִרְחָב
  choice: num pasto amplo
  rationale: כַּר indica pastagem ou prado, e נִרְחָב destaca sua extensão e espaço. «Pasto amplo» preserva a imagem de abundante área para o gado.
theological_decisions:
- issue: Sujeito implícito do verbo inicial
  choice: Usar «Ele», referindo-se ao SENHOR no contexto imediato
  alternative: Repetir explicitamente «o SENHOR»
  rationale: O hebraico não repete o sujeito, embora o contexto anterior identifique o SENHOR como agente. O pronome mantém o fluxo do texto sem introduzir uma repetição ausente no original.
- issue: Referente de וְהָיָה, «será»
  choice: Explicitar o referente como «esse alimento»
  alternative: Usar apenas «ele», possivelmente referido ao pão ou ao produto da terra
  rationale: A forma masculina singular provavelmente retoma לֶחֶם, «pão», em sentido alimentar. «Esse alimento» evita ambiguidade gramatical criada em português pela expressão anterior, sem impor uma distinção teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Mantêm-se as imagens agrícolas concretas do hebraico; expressões idiomáticas são vertidas de modo natural, com as alternativas literais relevantes preservadas em notas.
