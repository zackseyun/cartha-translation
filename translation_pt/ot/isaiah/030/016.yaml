  text: וַ/תֹּ֨אמְר֥וּ לֹא כִ֛י עַל ס֥וּס נָנ֖וּס עַל כֵּ֣ן תְּנוּס֑וּ/ן וְ/עַל קַ֣ל נִרְכָּ֔ב עַל כֵּ֖ן יִקַּ֥לּוּ רֹדְפֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/016.yaml
  text: But you said[a], “No, for we will flee on horses”—therefore you will flee; and, “We will ride on swift horses”—therefore your pursuers will be swift.
translation:
  language: pt
  text: 'Mas vocês disseram: “Não, pois fugiremos a cavalo”; por isso, vocês fugirão; e: “Cavalgaremos montarias velozes”[a]; por isso, velozes serão os seus perseguidores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cavalgaremos cavalos velozes” ou “cavalgaremos montarias rápidas”. O hebraico traz apenas “sobre [o] veloz”, com o substantivo subentendido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמְרוּ
  choice: Mas vocês disseram
  rationale: O waw faz o discurso avançar, enquanto “Mas” expressa o contraste contextual entre a orientação divina anterior e a resposta do povo.
- source_word: לֹא כִּי
  choice: Não!
  rationale: A combinação introduz uma rejeição enfática. Em português, a exclamação comunica naturalmente essa recusa; a oração seguinte apresenta a alternativa escolhida pelo povo.
- source_word: עַל סוּס
  choice: a cavalo
  rationale: Embora “cavalo” esteja no singular hebraico, a expressão é genérica e coletiva; “a cavalo” é idiomático e mantém esse valor.
- source_word: נָנוּס
  choice: fugiremos
  rationale: Traduz diretamente o sentido usual de נוּס e preserva a repetição irônica com תְּנוּסוּן.
- source_word: עַל כֵּן
  choice: por isso
  rationale: Mantém, nas duas ocorrências, a relação de consequência e a ironia judicial do paralelismo.
- source_word: תְּנוּסוּן
  choice: vocês fugirão
  rationale: Preserva a segunda pessoa do plural e o jogo verbal pelo qual a fuga planejada se torna fuga imposta.
- source_word: עַל קַל
  choice: em animais velozes
  rationale: קַל significa “ligeiro/veloz”, com o substantivo elíptico. “Animais” explicita apenas o referente exigido pelo contexto de cavalgar, sem restringi-lo necessariamente a “cavalos”.
- source_word: נִרְכָּב
  choice: cavalgaremos
  rationale: No contexto de montarias, “cavalgar” é natural e semanticamente preciso.
- source_word: יִקַּלּוּ
  choice: velozes serão
  rationale: Preserva a correspondência lexical e irônica entre a velocidade das montarias e a dos perseguidores.
- source_word: רֹדְפֵיכֶם
  choice: os seus perseguidores
  rationale: O particípio substantivado designa de modo direto aqueles que perseguem o povo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de “fugir” e “velozes” foi mantida para conservar a ironia e o paralelismo do hebraico; “vocês” torna explícita a segunda pessoa do plural.
