source:
  edition: WLC
  text: לָ/כֵ֗ן יִֽהְיֶ֤ה לָ/כֶם֙ הֶ/עָוֺ֣ן הַ/זֶּ֔ה כְּ/פֶ֣רֶץ נֹפֵ֔ל נִבְעֶ֖ה בְּ/חוֹמָ֣ה נִשְׂגָּבָ֑ה אֲשֶׁר פִּתְאֹ֥ם לְ/פֶ֖תַע יָב֥וֹא שִׁבְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/013.yaml
  text: Therefore this iniquity will be to you like a falling breach, bulging out in a high wall, whose breaking comes suddenly, in an instant.
translation:
  language: pt
  text: Por isso, esta iniquidade será para vocês como uma brecha prestes a desabar, uma saliência num muro alto, cuja ruptura vem de repente, num instante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָוֺן הַזֶּה
  choice: esta iniquidade
  rationale: Preserva o sentido moral e religioso de עָוֹן e a referência direta à culpa/rebeldia denunciada no contexto.
- source_word: כְּפֶרֶץ נֹפֵל
  choice: como uma brecha prestes a desabar
  rationale: פֶּרֶץ é uma brecha ou ruptura no muro; נֹפֵל descreve a queda iminente ou em curso. A formulação portuguesa torna natural a imagem sem reduzir נֹפֵל a mero adjetivo estático.
- source_word: נִבְעֶה
  choice: uma saliência
  rationale: O particípio sugere algo abaulado, estufado ou projetado para fora; 'saliência' comunica a deformação perigosa do muro.
- source_word: בְּחוֹמָה נִשְׂגָּבָה
  choice: num muro alto
  rationale: נִשְׂגָּב pode indicar altura ou elevação; no contexto físico do muro, 'alto' é claro e idiomático.
- source_word: פִּתְאֹם לְפֶתַע
  choice: de repente, num instante
  rationale: Mantém a intensificação produzida pelos dois termos de súbita ocorrência, sem fundi-los numa única expressão.
- source_word: שִׁבְרָהּ
  choice: sua ruptura
  rationale: O sufixo feminino retoma a brecha/deformação figurada; 'ruptura' conserva o campo semântico de quebrar e colapsar.
theological_decisions:
- issue: Relação entre a iniquidade e o juízo
  choice: Manter 'esta iniquidade será para vocês como...'
  alternative: Explicitar que o castigo decorrente da iniquidade será como o colapso do muro
  rationale: O hebraico identifica figurativamente a própria iniquidade com a brecha perigosa. A tradução não explica além do texto nem separa culpa e consequência de modo artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção imagética natural. 'Vocês' favorece legibilidade brasileira sem regionalismo marcado; a dupla expressão temporal preserva a força retórica do hebraico.
