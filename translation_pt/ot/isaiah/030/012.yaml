id: ISA.30.12
reference: Isaiah 30:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ קְד֣וֹשׁ יִשְׂרָאֵ֔ל יַ֥עַן מָֽאָסְ/כֶ֖ם בַּ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/תִּבְטְחוּ֙ בְּ/עֹ֣שֶׁק וְ/נָל֔וֹז וַ/תִּֽשָּׁעֲנ֖וּ עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/012.yaml
  text: 'Therefore thus says the Holy One of Israel: Because you have rejected this word[a], and have trusted in oppression and perversity, and have relied on it[b],'
translation:
  language: pt
  text: 'Por isso, assim diz o Santo de Israel: “Visto que vocês rejeitaram esta palavra[a], confiaram na opressão e na perversidade e se apoiaram nisso[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta mensagem” ou “este assunto”.
    reason: lexical_alternative
  - marker: b
    text: “Opressão” também pode ser traduzido como “extorsão”; “perversidade”, como “tortuosidade”. O pronome hebraico está no singular e seu referente pode ser entendido de mais de uma maneira.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a consequência da repreensão anterior e preserva a lógica profética.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Fórmula profética tradicional, clara e digna em português moderno.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Traduz diretamente o título característico de Isaías e conserva sua força teológica.
- source_word: יַעַן
  choice: Visto que
  rationale: Introduz a causa do juízo anunciado; evita uma sequência pouco natural de 'Por isso... porque'.
- source_word: מָאַסְכֶם
  choice: vocês rejeitaram
  rationale: Expressa repúdio deliberado sem acrescentar necessariamente a ideia emocional de desprezo.
- source_word: בַּדָּבָר הַזֶּה
  choice: esta palavra
  rationale: Preserva a amplitude de דָּבָר e, no contexto, aponta naturalmente para a mensagem profética.
- source_word: וַתִּבְטְחוּ
  choice: confiaram
  rationale: Comunica diretamente a ideia de depositar confiança e mantém o paralelismo com a oração seguinte.
- source_word: בְּעֹשֶׁק
  choice: na opressão
  rationale: Representa o sentido amplo de injustiça opressiva, sem restringi-lo indevidamente a extorsão ou fraude.
- source_word: וְנָלוֹז
  choice: e na perversidade
  rationale: Verte a ideia do que é tortuoso ou moralmente desviado em expressão natural e solene.
- source_word: וַתִּשָּׁעֲנוּ עָלָיו
  choice: e se apoiaram nisso
  rationale: Conserva a imagem de apoiar-se em algo e o pronome hebraico singular sem fixar excessivamente seu referente.
theological_decisions:
- issue: Referente de “esta palavra”
  choice: A palavra ou mensagem profética recém-proferida
  alternative: Este assunto ou esta orientação
  rationale: O contexto favorece a rejeição da advertência divina, mas a nota mantém aberta a amplitude lexical de דָּבָר.
- issue: Caracterização moral do objeto da confiança
  choice: opressão e perversidade
  alternative: extorsão e tortuosidade
  rationale: A formulação preserva a denúncia ética ampla do hebraico sem identificar um mecanismo histórico ou uma categoria doutrinária específica.
- issue: Referente do pronome singular עָלָיו
  choice: nisso
  alternative: nela ou nelas
  rationale: “Nisso” mantém o número singular do hebraico e permite que o pronome retome o conjunto daquilo em que o povo confiou, sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” para o plural e conserva uma formulação profética digna. As notas registram alternativas lexicais e a ambiguidade do pronome sem sobrecarregar o texto principal.
