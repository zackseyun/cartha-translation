  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה קְד֣וֹשׁ יִשְׂרָאֵ֗ל בְּ/שׁוּבָ֤ה וָ/נַ֨חַת֙ תִּוָּ֣שֵׁע֔וּ/ן בְּ/הַשְׁקֵט֙ וּ/בְ/בִטְחָ֔ה תִּהְיֶ֖ה גְּבֽוּרַתְ/כֶ֑ם וְ/לֹ֖א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/015.yaml
  text: 'For thus says the Lord GOD[a], the Holy One of Israel: “In returning and rest you will be saved[b]; in quietness and trust will be your strength.” But you were unwilling.'
translation:
  language: pt
  text: 'Pois assim diz o Senhor DEUS, o Santo de Israel: “É retornando[a] e descansando que vocês serão salvos[b]; na tranquilidade e na confiança estará a força de vocês”. Mas vocês não quiseram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arrependendo-se”; o hebraico fala mais literalmente de retornar, o que pode incluir arrependimento e volta para Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “serão libertos”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor DEUS
  rationale: 'Representa os dois elementos do título divino: “Senhor” traduz אֲדֹנָי, e “DEUS” em versaletes representa o nome divino יהוה sem fundir os termos.'
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Preserva com clareza o título recorrente em Isaías e sua relação com Israel.
- source_word: בְּשׁוּבָה
  choice: retornando
  rationale: Mantém a imagem concreta de voltar, que no contexto pode incluir arrependimento e retorno a Deus, sem restringi-la antecipadamente a um único sentido teológico.
- source_word: וָנַחַת
  choice: descansando
  rationale: Expressa o repouso sereno indicado por נַחַת e forma, em português natural, um par com “retornando”.
- source_word: תִּוָּשֵׁעוּן
  choice: vocês serão salvos
  rationale: Reflete diretamente o nifal de ישׁע e conserva a amplitude entre salvação e livramento concreto.
- source_word: בְּהַשְׁקֵט
  choice: na tranquilidade
  rationale: Comunica quietude, calma e ausência de agitação em linguagem portuguesa atual.
- source_word: וּבְבִטְחָה
  choice: na confiança
  rationale: Preserva o sentido relacional de confiar, especialmente em Deus, em vez de indicar apenas uma condição de segurança.
- source_word: תִּהְיֶה גְּבוּרַתְכֶם
  choice: estará a força de vocês
  rationale: Mantém “força” como equivalente natural de גְּבוּרָה e apresenta a confiança tranquila como a verdadeira fonte de força.
- source_word: וְלֹא אֲבִיתֶם
  choice: Mas vocês não quiseram
  rationale: Traduz de modo direto e natural a falta de disposição ou consentimento expressa por אָבָה.
theological_decisions:
- issue: Se בְּשׁוּבָה deve ser explicitado como “arrependimento”
  choice: retornando
  alternative: arrependendo-se
  rationale: A raiz שׁוב pode envolver arrependimento, mas também comunica o retorno a Deus e o abandono de estratégias autossuficientes. A tradução mantém essa amplitude.
- issue: Alcance soteriológico de תִּוָּשֵׁעוּן
  choice: serão salvos
  alternative: serão libertos
  rationale: ישע pode indicar tanto salvação em sentido amplo quanto livramento histórico. “Salvos” conserva o peso teológico sem excluir o resgate concreto, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “É retornando e descansando que...” torna natural a relação instrumental das expressões hebraicas sem convertê-las numa condição explícita. “Tranquilidade” evita a possível conotação negativa de “quietismo”, enquanto “confiança” preserva a dependência de Deus sugerida pelo contexto.
