  text: And the oxen and the donkeys that work the ground will eat seasoned fodder[b][a], which has been winnowed with shovel and fork.
translation:
  language: pt
  text: Os bois e os jumentos que trabalham a terra comerão forragem temperada[a], joeirada com pá e forcado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «forragem salgada»; o termo hebraico pode indicar mais especificamente uma forragem melhorada com sal ou outro preparo.
    reason: lexical_alternative
  - marker: b
    text: O hebraico menciona dois utensílios agrícolas usados para joeirar, tradicionalmente traduzidos por «pá e forcado» ou «pá e forquilha de joeirar».
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲלָפִים
  choice: os bois
  rationale: No paralelo com os jumentos e em relação ao trabalho agrícola, o termo designa bovinos de tração; «bois» comunica isso naturalmente.
- source_word: הָעֲיָרִים
  choice: os jumentos
  rationale: Equivalente moderno e claro para os animais de trabalho mencionados no hebraico.
- source_word: עֹבְדֵי הָאֲדָמָה
  choice: que trabalham a terra
  rationale: Preserva a função agrícola dos animais e a imagem concreta do cultivo em linguagem corrente.
- source_word: בְּלִיל
  choice: forragem
  rationale: Designa alimento preparado ou misturado para animais; «forragem» é corrente e adequado ao contexto.
- source_word: חָמִיץ
  choice: temperada
  rationale: Expressa uma forragem especialmente preparada ou melhorada sem determinar indevidamente se o processo era salga, acidificação ou fermentação.
- source_word: יֹאכֵלוּ
  choice: comerão
  rationale: O futuro simples se ajusta ao contexto de abundância prometida.
- source_word: אֲשֶׁר זֹרֶה
  choice: peneirada
  rationale: Embora a construção hebraica seja ativa, o particípio descreve o tratamento dado à forragem. «Peneirada» transmite o processamento agrícola de separar ou limpar lançando o material ao ar.
- source_word: בָרַחַת
  choice: com pá
  rationale: Refere-se a um utensílio agrícola usado para lançar o material durante a joeira; «pá» é o equivalente reconhecível e conciso.
- source_word: וּבַמִּזְרֶה
  choice: e forcado
  rationale: Designa o segundo utensílio de joeirar, semelhante a uma forquilha; «forcado» é compreensível no contexto, esclarecido pela nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça junto ao termo que explica. A redação conserva a imagem agrícola e deixa em nota a incerteza lexical de חָמִיץ.
