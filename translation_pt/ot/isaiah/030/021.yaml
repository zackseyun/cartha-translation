review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a imagem dos ouvidos que ouvem uma palavra vinda de trás, a declaração sobre o caminho e o imperativo plural. Contudo, “se desviem” introduz a noção de afastar-se de um rumo, que não é expressa pelos verbos finais e pode sugerir desvio do caminho indicado. O valor mais seguro, diante do crux hebraico, é “se voltarem para” ou “forem para” a direita/esquerda.
  naturalness: O português é claro e de registro apropriado. “Quando vocês se voltarem” é mais direto e natural que a construção concessiva “quer vocês se desviem..., quer...”, além de refletir melhor o sentido temporal apresentado pela tradução de referência.
  terminology: “Ouvidos”, “palavra”, “caminho” e “andem por ele” são escolhas fiéis e idiomáticas. “Vinda de trás de você” torna explícito o valor de origem de מֵאַחֲרֶיךָ sem perder a imagem espacial.
