base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/021.yaml
  text: And your ears shall hear a word behind you[a], saying, “This is the way; walk in it,” when you turn to the right and when you turn to the left.
translation:
  language: pt
  text: 'E os seus ouvidos ouvirão uma palavra vinda de trás de você, dizendo: “Este é o caminho; andem por ele”, quando vocês se voltarem para a direita e quando se voltarem para a esquerda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando forem para a direita e quando forem para a esquerda”. Os verbos hebraicos desta cláusula final são difíceis; o sentido é que a orientação virá sempre que estiverem prestes a tomar uma direção ou outra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנֶיךָ
  choice: os seus ouvidos
  rationale: Mantém o plural concreto do hebraico e a imagem corporal de ouvir a orientação.
- source_word: תִּשְׁמַעְנָה
  choice: ouvirão
  rationale: O imperfeito indica aqui uma promessa futura e concorda com o plural feminino 'ouvidos' no hebraico.
- source_word: דָבָר
  choice: uma palavra
  rationale: É a correspondência mais direta e preserva a expressão concisa sem especificar indevidamente a natureza da comunicação.
- source_word: מֵאַחֲרֶיךָ
  choice: atrás de você
  rationale: Reproduz de modo natural a imagem espacial de uma palavra ouvida às costas do destinatário.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma corrente para introduzir o discurso direto.
- source_word: זֶה הַדֶּרֶךְ
  choice: Este é o caminho
  rationale: Preserva tanto o possível sentido concreto de rota quanto o sentido figurado de conduta.
- source_word: לְכוּ בוֹ
  choice: andem por ele
  rationale: O imperativo está no plural; 'andar pelo caminho' é natural em português e conserva a dimensão literal e metafórica.
- source_word: כִּי תַאֲמִינוּ
  choice: quer vocês se desviem para a direita
  rationale: O verbo é uma dificuldade lexical. No paralelismo, indica inclinar-se ou tomar a direção da direita; a formulação preserva a ideia de orientação em qualquer mudança de rumo.
- source_word: וְכִי תַשְׂמְאִילוּ
  choice: quer se desviem para a esquerda
  rationale: O Hiphil de שׂמאל significa ir ou voltar-se para a esquerda e forma um paralelo direto com a cláusula anterior.
theological_decisions:
- issue: Natureza da 'palavra' orientadora
  choice: Uma palavra orientadora dada por Deus, sem especificar o meio
  alternative: A voz de um mestre, uma percepção interior da consciência ou uma instrução profética
  rationale: O contexto atribui a orientação a Deus, mas esta cláusula não identifica explicitamente o falante nem o mecanismo; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular 'você' em 'atrás de você' reflete o sufixo hebraico singular, enquanto 'andem' e os verbos finais reproduzem as formas plurais do discurso citado, preservando a mudança de número presente no texto.
