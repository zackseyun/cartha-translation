  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/רוּח֞/וֹ כְּ/נַ֤חַל שׁוֹטֵף֙ עַד צַוָּ֣אר יֶֽחֱצֶ֔ה לַ/הֲנָפָ֥ה גוֹיִ֖ם בְּ/נָ֣פַת שָׁ֑וְא וְ/רֶ֣סֶן מַתְעֶ֔ה עַ֖ל לְחָיֵ֥י עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/028.yaml
  text: and his breath is like an overflowing stream[a]; it reaches up to the neck, to sift nations with a sieve of emptiness[c][b], and a misleading bridle is on the jaws of the peoples.
translation:
  language: pt
  text: e seu sopro é como uma torrente transbordante[a], que chega até o pescoço, para peneirar as nações com a peneira da inutilidade[b]; e um freio que as faz se desviar[c] está nas mandíbulas dos povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu espírito” ou “seu vento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com uma peneira de vazio”, “com uma peneira de falsidade” ou “com uma peneira sem valor”.
    reason: lexical_alternative
  - marker: c
    text: Ou “um freio enganador” ou “um freio que conduz ao erro”. “Mandíbulas” também pode ser traduzido por “faces”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחוֹ
  choice: seu sopro
  rationale: רוּחַ pode significar sopro, vento ou espírito. No contexto da manifestação do SENHOR em juízo e da imagem que procede de sua boca, “sopro” preserva melhor a força concreta da metáfora.
- source_word: כְּנַחַל שׁוֹטֵף
  choice: como uma torrente transbordante
  rationale: נחל designa um curso de água ou torrente, e שׁוֹטֵף acrescenta a ideia de inundar, transbordar ou arrastar. A formulação transmite uma corrente impetuosa em português natural.
- source_word: עַד צַוָּאר יֶחֱצֶה
  choice: que chega até o pescoço
  rationale: Embora חצה tenha normalmente o sentido de dividir ou cortar, na imagem de inundação a expressão é entendida como a água que alcança o nível do pescoço. A tradução comunica claramente a extensão ameaçadora da enchente.
- source_word: לַהֲנָפָה
  choice: para peneirar
  rationale: A forma derivada de נוף indica agitar ou sacudir, especialmente no processo de joeirar ou peneirar. A menção imediata de uma peneira favorece “peneirar”.
- source_word: גוֹיִם
  choice: as nações
  rationale: O termo refere-se aqui às nações como grupos políticos e humanos sujeitos ao juízo divino.
- source_word: בְּנָפַת שָׁוְא
  choice: com a peneira da inutilidade
  rationale: נפה significa peneira, enquanto שָׁוְא pode expressar inutilidade, vazio, falsidade ou coisa sem valor. “Inutilidade” conserva a imagem difícil sem determinar excessivamente seu sentido.
- source_word: רֶסֶן
  choice: freio
  rationale: רסן é o instrumento colocado na boca ou mandíbula de um animal para controlá-lo. Em português, “freio” combina naturalmente com “mandíbulas” e preserva a metáfora de condução forçada.
- source_word: מַתְעֶה
  choice: que as faz se desviar
  rationale: 'O particípio derivado de תעה tem sentido causativo: fazer errar, desviar ou desencaminhar. A oração relativa deixa clara essa ação em português corrente.'
- source_word: עַל לְחָיֵי עַמִּים
  choice: está nas mandíbulas dos povos
  rationale: לְחִי pode indicar face, queixo ou mandíbula. Em associação com um freio, “mandíbulas” torna a imagem corporal mais coerente; עַמִּים é mantido como “povos”, distinto de “nações”.
theological_decisions:
- issue: Referente do pronome em “seu sopro”
  choice: O pronome refere-se ao SENHOR no contexto imediato do juízo divino.
  alternative: Uma força impessoal semelhante a uma tempestade.
  rationale: Os versículos próximos descrevem a vinda do SENHOR em ira e a atuação de sua voz. Manter “seu” preserva a agência divina pessoal sem acrescentar afirmações doutrinárias ao texto.
- issue: Relação do “freio” com os povos
  choice: O sufixo implícito em “as faz se desviar” retoma as nações/povos coletivamente.
  alternative: 'Traduzir de modo mais nominal: “um freio enganador” ou “um freio que conduz ao erro”.'
  rationale: O hebraico mantém a construção metafórica compacta e permite entender מַתְעֶה como aquilo que faz os povos se desviarem. A tradução explicita apenas o necessário para a fluidez, enquanto a nota conserva alternativas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e imagens concretas. “Torrente transbordante”, “peneira” e “freio” preservam a sequência metafórica do hebraico. As notas registram as ambiguidades genuínas de רוּחַ, שָׁוְא, מַתְעֶה e לְחִי.
