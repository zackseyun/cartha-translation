revisions:
- from: Agora venha, escreva isso diante deles numa tabuinha e registre-o num rolo, para que permaneça para um dia futuro[a], como testemunho[b] para todo o sempre.
  to: Agora, venha, escreva isto diante deles numa tabuinha e registre-o num rolo, para que permaneça para um dia futuro[a], para todo o sempre.
  rationale: A revisão conserva as escolhas materiais e o sentido futuro da redação, mas restitui ao texto principal a força temporal de לָעַד e עַד עוֹלָם, sem acrescentar «testemunho». A nota sobre alternativas para לְיוֹם אַחֲרוֹן é mantida; a antiga nota b é removida porque dependia da leitura interpretativa retirada e a alternativa temporal agora está no texto.
