  text: עַתָּ֗ה בּ֣וֹא כָתְבָ֥/הּ עַל ל֛וּחַ אִתָּ֖/ם וְ/עַל סֵ֣פֶר חֻקָּ֑/הּ וּ/תְהִי֙ לְ/י֣וֹם אַחֲר֔וֹן לָ/עַ֖ד עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/008.yaml
  text: Now come[a], write it before them on a tablet, and inscribe it in a scroll, that it may stand for a later day[b], as a witness forever and ever.
translation:
  language: pt
  text: Agora, venha, escreva isto diante deles numa tabuinha e registre-o num rolo, para que permaneça para um dia futuro[a], para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para um dia posterior” ou “para o último dia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה בּוֹא
  choice: Agora venha
  rationale: Mantém o advérbio temporal e o imperativo singular como convocação direta e imediata.
- source_word: כָתְבָהּ
  choice: escreva isso
  rationale: O sufixo feminino singular retoma a mensagem ou profecia a ser registrada; “isso” evita especificar além do hebraico.
- source_word: עַל לוּחַ
  choice: numa tabuinha
  rationale: לוּחַ designa uma superfície física para escrita; “tabuinha” é clara e historicamente adequada.
- source_word: אִתָּם
  choice: diante deles
  rationale: Embora a forma possa significar literalmente “com eles”, o contexto de um registro público favorece o sentido “na presença deles”.
- source_word: וְעַל סֵפֶר חֻקָּהּ
  choice: e registre-o num rolo
  rationale: סֵפֶר é um documento escrito, provavelmente um rolo, e חקק comunica a ideia de inscrição ou registro duradouro. “Registre-o” soa natural sem sugerir que um rolo fosse literalmente gravado.
- source_word: וּתְהִי
  choice: para que permaneça
  rationale: Expressa o valor resultativo ou final da forma verbal e a permanência pretendida para o registro.
- source_word: לְיוֹם אַחֲרוֹן
  choice: para um dia futuro
  rationale: A expressão aponta para um tempo posterior, sem exigir que se trate do “último dia” em sentido escatológico.
- source_word: לָעַד
  choice: como testemunho
  rationale: No contexto de um registro escrito público, a expressão pode ter força testemunhal; a leitura estritamente temporal é preservada em nota.
- source_word: עַד עוֹלָם
  choice: para todo o sempre
  rationale: Transmite de modo natural a duração enfática e indefinida da expressão hebraica.
theological_decisions:
- issue: Possível força escatológica de לְיוֹם אַחֲרוֹן
  choice: para um dia futuro
  alternative: para o último dia; para um dia posterior
  rationale: O hebraico permite referência geral ao futuro e não obriga a leitura técnica escatológica; a alternativa mais forte fica preservada em nota.
- issue: Sentido testemunhal ou temporal de לָעַד
  choice: como testemunho
  alternative: para sempre
  rationale: O contexto favorece a função do escrito como testemunho duradouro, mas a expressão também pode ser entendida temporalmente; a nota conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tabuinha” e “rolo” preservam o cenário material antigo; as notas mantêm as ambiguidades temporal, escatológica e testemunhal do hebraico.
