review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o sentido contextual de desonra decorrente da confiança num povo incapaz de beneficiar. Contudo, «passam vergonha» é coloquial para o registro do texto e «mas só lhes traz» introduz uma construção verbal possessiva que não está expressa no hebraico; uma formulação mais próxima preserva melhor o paralelismo final.
  naturalness: A redação é compreensível, mas «ficam envergonhados» é mais sóbria e amplamente internacional do que «passam vergonha». «Não lhes serve de ajuda nem de proveito» mantém boa fluência e o paralelismo.
  terminology: «Benefício», «ajuda» e «proveito» reproduzem de modo consistente o campo lexical de utilidade. Para חֶרְפָּה, «desonra» é uma opção moderna e natural que conserva a ideia de opróbrio público sem sugerir necessariamente um ato específico de humilhação.
  issues:
  - severity: low
    issue: Registro de «passam vergonha»
    rationale: A expressão é idiomática, sobretudo no Brasil, mas é mais coloquial do que o registro profético requer. «Ficam envergonhados» conserva o resultado de desonra sem reduzi-lo a sentimento íntimo.
  - severity: low
    issue: Expansão em «mas só lhes traz vergonha e humilhação»
    rationale: O hebraico conclui com construções nominais, «para vergonha e também para opróbrio/desonra». A expansão com «lhes traz» é interpretativamente aceitável, mas desnecessária e enfraquece o paralelismo.
  revised_text: Todos ficam envergonhados por causa de um povo que não lhes traz benefício algum, que não lhes serve de ajuda nem de proveito, mas para vergonha e também para desonra.
  revised_footnotes:
  - marker: a
    text: O verbo hebraico הבאיש é difícil. Pode transmitir a ideia de tornar-se repugnante ou exalar mau cheiro; porém, neste contexto de uma aliança fracassada e em paralelo com “vergonha” e “desonra”, prefere-se o sentido de cair em desgraça ou ficar envergonhado.
    reason: lexical_alternative
  revision_rationale: A revisão eleva levemente o registro, mantém a consequência pública de desonra assinalada pelo contexto e restabelece, no final, a estrutura concisa e paralela do hebraico. Também substitui «humilhação» por «desonra», que corresponde mais diretamente ao opróbrio público de חֶרְפָּה.
