base_translation:
  language: en
  yaml_path: translation/ot/isaiah/030/005.yaml
  text: Everyone is put to shame because of a people that cannot profit them[a]—who are not for help and not for profit, but for shame and also for reproach.
translation:
  language: pt
  text: Todos ficam envergonhados por causa de um povo que não lhes traz benefício algum, que não lhes serve de ajuda nem de proveito, mas para vergonha e também para desonra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל
  choice: Todos
  rationale: Expressa de modo distributivo e natural a totalidade das pessoas envolvidas.
- source_word: הבאיש
  choice: passam vergonha
  rationale: O verbo é difícil; no paralelismo com בֹּשֶׁת e חֶרְפָּה, a ideia contextual é de cair em desgraça pública, não simplesmente sentir vergonha.
- source_word: עַל
  choice: por causa de
  rationale: A preposição indica aqui a causa ou ocasião da vergonha.
- source_word: עַם
  choice: um povo
  rationale: Preserva o singular coletivo indefinido do hebraico sem explicitar no versículo que se trata do Egito.
- source_word: לֹא יוֹעִילוּ לָמוֹ
  choice: não lhes traz benefício algum
  rationale: Comunica com naturalidade que esse povo não é útil aos envolvidos, mantendo a noção de benefício de יעל.
- source_word: לְעֵזֶר וְלֹא לְהוֹעִיל
  choice: não lhes serve nem de ajuda nem de proveito
  rationale: Preserva a construção paralela e a repetição semântica relativa a utilidade e benefício.
- source_word: כִּי
  choice: mas só
  rationale: Marca o contraste entre a ajuda esperada e o resultado efetivo; 'só' explicita de modo natural a força excludente do contraste contextual.
- source_word: לְבֹשֶׁת
  choice: vergonha
  rationale: É o equivalente direto e corrente, associado aqui à desonra objetiva.
- source_word: וְגַם לְחֶרְפָּה
  choice: e humilhação
  rationale: חרפה denota desonra, afronta ou opróbrio público; 'humilhação' é claro e idiomático no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o paralelismo e a desonra externa do contexto, evitando interpretar o verbo apenas como sentimento interior.
