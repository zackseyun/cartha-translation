- source_word: הַשֵּׁירוֹת
  choice: os braceletes
  rationale: Este termo raro designa algum tipo de adorno, talvez braceletes, correntes ou tornozeleiras. “Braceletes” se encaixa naturalmente na lista, enquanto a incerteza lexical é registrada em nota.
- source_word: הָרְעָלוֹת
  choice: os véus
  rationale: O termo indica uma peça de cobertura, provavelmente um véu; esta é a tradução mais direta e reconhecível no contexto dos adornos femininos.
