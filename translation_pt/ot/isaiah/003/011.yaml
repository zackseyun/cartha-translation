source:
  edition: WLC
  text: א֖וֹי לְ/רָשָׁ֣ע רָ֑ע כִּֽי גְמ֥וּל יָדָ֖י/ו יֵעָ֥שֶׂה לּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/011.yaml
  text: Woe to the wicked! It will go badly for him[a], for the work of his hands will be done to him.
translation:
  language: pt
  text: Ai do perverso! Mal lhe irá[a], pois o que suas mãos fizeram será feito a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Ai do perverso! Mal para ele, pois a retribuição de suas mãos lhe será feita.”'
    reason: Alternativa lexical que conserva mais diretamente a forma compacta e a ambiguidade do hebraico.
lexical_decisions:
- source_word: א֖וֹי
  choice: Ai
  rationale: Preserva a fórmula profética de lamento e ameaça em português natural e solene.
- source_word: לְ/רָשָׁ֣ע
  choice: do perverso
  rationale: Com «Ai», a construção idiomática portuguesa «Ai de...» marca o alvo da denúncia e mantém o singular representativo.
- source_word: רָ֑ע
  choice: Tudo lhe irá mal
  rationale: Entende רַע predicativamente como resultado adverso, não apenas como o conceito abstrato de mal moral.
- source_word: כִּֽי
  choice: pois
  rationale: Introduz naturalmente a razão da sentença anunciada.
- source_word: גְמ֥וּל יָדָ֖י/ו
  choice: o que suas mãos fizeram
  rationale: Comunica a ideia de retribuição correspondente aos atos, preservando a imagem concreta das mãos e preparando a repetição verbal.
- source_word: יֵעָ֥שֶׂה לּֽ/וֹ
  choice: será feito a ele
  rationale: Mantém a forma passiva e a reciprocidade do juízo, além de reproduzir a ligação com «fizeram».
theological_decisions:
- issue: Singular masculino representativo na declaração de juízo
  choice: Mantido o singular em «do perverso», «lhe», «suas» e «a ele».
  alternative: Pluralizar como «dos perversos» e «a eles».
  rationale: O hebraico apresenta uma figura representativa no singular; a tradução conserva essa forma sem acrescentar especificação de sexo além da gramática do texto.
- issue: Formulação da justiça retributiva
  choice: «o que suas mãos fizeram será feito a ele»
  alternative: «ele receberá a recompensa de seus atos»
  rationale: A formulação escolhida preserva a reciprocidade medida por medida e a repetição ligada a עשה, sem impor terminologia doutrinária mais técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ai do perverso» conserva a força profética; «a ele» evita possível ambiguidade de «lhe» na oração final.
