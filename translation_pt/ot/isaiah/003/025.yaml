  yaml_path: translation/ot/isaiah/003/025.yaml
  text: Your men will fall by the sword[a], and your mighty men in battle.
translation:
  language: pt
  text: Seus homens cairão à espada, e seus valentes, na batalha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְתַיִךְ
  choice: seus homens
  rationale: Em uso poético, o substantivo designa homens ou pessoas, não cadáveres; no contexto, refere-se aos homens de Sião/Jerusalém, provavelmente em idade de combater.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: A preposição tem valor instrumental; a expressão portuguesa consagrada e natural indica morte causada pela espada.
- source_word: יִפֹּלוּ
  choice: cairão
  rationale: O imperfeito qal, neste anúncio profético, comunica o resultado futuro e mantém o idioma de cair em combate.
- source_word: וּגְבוּרָתֵךְ
  choice: seus valentes
  rationale: Embora o substantivo possa significar força ou poder, o paralelismo com 'seus homens' favorece a referência metonímica aos homens fortes ou guerreiros da cidade.
- source_word: בַּמִּלְחָמָה
  choice: na batalha
  rationale: A opção é natural no paralelismo e expressa o cenário concreto de combate.
theological_decisions:
- issue: Referente dos sufixos femininos da segunda pessoa do singular
  choice: A fala dirige-se a Sião/Jerusalém personificada, preservada apenas por 'seus' sem explicitação no versículo.
  alternative: As filhas de Sião coletivamente.
  rationale: O contexto imediato favorece Sião/Jerusalém como figura feminina singular; como o possessivo português não marca gênero, a tradução conserva a referência sem acrescentar interpretação.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. 'Valentes' é compreensível no registro bíblico e evita limitar indevidamente o termo a uma categoria militar técnica.
