base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/017.yaml
  text: therefore the Lord will strike the crown of the daughters of Zion with scabs[a], and Yahweh will lay bare their private parts.
translation:
  language: pt
  text: Por isso, o Senhor afligirá com sarna o alto da cabeça das filhas de Sião, e Yahweh deixará à mostra as partes íntimas delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a nudez delas». O termo hebraico é difícil; alguns o entendem mais especificamente como um eufemismo para as partes íntimas, enquanto outros propõem «as testas delas».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׂפַּח
  choice: cobrirá de feridas
  rationale: O verbo indica causar uma afecção no couro cabeludo, possivelmente crostas ou feridas. A formulação é natural em português e conserva o caráter punitivo sem especificar além do que o termo permite.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino como designação de soberania e o distingue do nome יהוה na oração seguinte.
- source_word: קָדְקֹד
  choice: o alto da cabeça
  rationale: Expressa claramente a parte superior da cabeça ou couro cabeludo; evita a possível ambiguidade de «coroa» em português.
- source_word: בְּנוֹת צִיּוֹן
  choice: as filhas de Sião
  rationale: Preserva a expressão poética e profética do hebraico sem substituí-la pela interpretação «mulheres de Sião».
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: Translitera o nome divino e preserva a distinção formal entre יהוה e o título אֲדֹנָי usado anteriormente.
- source_word: פָּתְהֵן
  choice: as partes íntimas delas
  rationale: No contexto de humilhação e exposição, representa a provável referência eufemística aos órgãos íntimos. Como o substantivo é raro e difícil, outras leituras são registradas em nota.
- source_word: יְעָרֶה
  choice: deixará à mostra
  rationale: Comunica de modo corrente o ato de descobrir ou expor, adequado ao contexto de vergonha pública.
theological_decisions:
- issue: Distinção entre אֲדֹנָי e יהוה no mesmo versículo
  choice: «o Senhor» para אֲדֹנָי e «Yahweh» para יהוה
  alternative: Traduzir ambos por «o Senhor»
  rationale: O hebraico emprega deliberadamente duas designações divinas distintas; mantê-las diferenciadas preserva a forma e o paralelismo da fonte.
- issue: Sentido de פָּתְהֵן no anúncio de humilhação
  choice: Referência eufemística às partes íntimas
  alternative: «a nudez delas» em sentido geral; ou, segundo outra interpretação, «a testa delas»
  rationale: O verbo «deixar à mostra» e o contexto de humilhação favorecem uma referência à exposição íntima, mas a dificuldade lexical exige que as alternativas não sejam ocultadas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura poética preservada. «Por isso» torna explícita a ligação discursiva; «filhas de Sião» conserva a imagem profética. A nota registra a incerteza lexical real sem sobrecarregar o texto principal.
