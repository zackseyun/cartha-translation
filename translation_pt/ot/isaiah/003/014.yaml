  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָה֙ בְּ/מִשְׁפָּ֣ט יָב֔וֹא עִם זִקְנֵ֥י עַמּ֖/וֹ וְ/שָׂרָ֑י/ו וְ/אַתֶּם֙ בִּֽעַרְתֶּ֣ם הַ/כֶּ֔רֶם גְּזֵלַ֥ת הֶֽ/עָנִ֖י בְּ/בָתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/014.yaml
  text: 'Yahweh enters into judgment with the elders of his people and its princes: “It is you who have devoured the vineyard[d][c][b][a]; the plunder of the poor is in your houses.”'
translation:
  language: pt
  text: 'Yahweh entra em juízo com os anciãos do seu povo e seus príncipes: “Foram vocês que consumiram a vinha[a]; o que foi roubado dos pobres está nas casas de vocês.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devoraram”, “queimaram” ou “devastaram a vinha”. O verbo hebraico transmite a ideia de consumo ou destruição. A vinha provavelmente representa o povo ou a comunidade.'
    reason: lexical_alternative; cross_reference
  - marker: b
    text: A expressão também pode ser traduzida como “o despojo dos pobres está nas casas de vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּמִשְׁפָּט יָבוֹא
  choice: entra em juízo
  rationale: Expressa de modo natural em português a entrada em um procedimento judicial e mantém a vividez profética do imperfeito hebraico.
- source_word: עִם
  choice: com
  rationale: Reproduz a preposição hebraica sem explicitar como 'contra' a relação adversativa, que já fica clara pela acusação subsequente.
- source_word: זִקְנֵי עַמּוֹ
  choice: os anciãos do seu povo
  rationale: Mantém o sentido de líderes reconhecidos da comunidade, e não apenas de homens idosos.
- source_word: וְשָׂרָיו
  choice: e seus príncipes
  rationale: O sufixo pode referir-se a Yahweh ou ao povo; 'seus' preserva em português essa ambiguidade referencial. 'Príncipes' mantém o registro elevado e político de שׂרים.
- source_word: וְאַתֶּם
  choice: Foram vocês
  rationale: Comunica a ênfase acusatória do pronome independente, com concordância natural diante das ações passadas mencionadas.
- source_word: בִּעַרְתֶּם
  choice: consumiram
  rationale: O verbo pode indicar queimar, consumir, eliminar ou devastar. 'Consumiram' conserva a ideia ampla de consumo destrutivo sem limitar a imagem ao fogo ou resolvê-la como 'devoraram'.
- source_word: הַכֶּרֶם
  choice: a vinha
  rationale: É a designação portuguesa natural para a plantação de videiras e preserva a imagem profética sem interpretá-la no corpo do texto.
- source_word: גְּזֵלַת הֶעָנִי
  choice: o que foi roubado dos pobres
  rationale: Explicita de maneira clara e idiomática que se trata dos bens tomados por roubo às pessoas pobres; o hebraico usa o singular coletivo.
- source_word: בְּבָתֵּיכֶם
  choice: está nas casas de vocês
  rationale: Segue o plural hebraico e indica que os bens adquiridos injustamente se encontram nas residências dos líderes.
theological_decisions:
- issue: Força metafórica de 'a vinha'
  choice: Manter 'a vinha' sem identificá-la no texto principal.
  alternative: Traduzir interpretativamente como 'meu povo' ou 'a comunidade'.
  rationale: A imagem se relaciona com o uso da vinha em Isaías, mas o versículo não identifica expressamente seu referente; preservá-la evita transformar uma provável alusão em explicação textual.
- issue: Valor judicial de עִם
  choice: Traduzir por 'com'.
  alternative: Traduzir por 'contra'.
  rationale: Embora o contexto seja acusatório, a preposição significa literalmente 'com'; a formulação escolhida conserva a tensão do original e permite que a fala seguinte revele a postura adversativa.
- issue: Referente do sufixo em וְשָׂרָיו
  choice: Usar 'seus príncipes', preservando a ambiguidade do referente.
  alternative: Explicitar 'os príncipes do povo' ou 'os príncipes de Yahweh'.
  rationale: O sufixo masculino singular pode remeter a Yahweh ou a 'seu povo'. Como o português também admite ambas as leituras com 'seus', não é necessário resolver a referência silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para a segunda pessoa do plural, 'anciãos' como termo de liderança comunitária e 'príncipes' para conservar o tom elevado. Os marcadores de nota aparecem no texto principal em ordem alfabética.
