base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/024.yaml
  text: 'And it shall be: instead of perfume[a], rottenness; and instead of a belt, a rope; and instead of well-set hair, baldness; and instead of a rich robe, a girding of sackcloth[c][b]; branding instead of beauty.'
translation:
  language: pt
  text: E acontecerá que, em vez de perfume, haverá podridão; em vez de cinto, corda[a]; em vez de cabelo bem-arrumado[b], calvície; em vez de veste luxuosa, pano de saco amarrado à cintura; uma marca de queimadura em vez de beleza.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cordão”. O raro termo hebraico talvez indique uma corda no lugar do cinto ornamental ou uma marca semelhante à de uma corda, como sinal de humilhação.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é difícil e pode referir-se mais amplamente a um adorno elaborado ou a uma peça finamente trabalhada; o contraste com “calvície” favorece a referência ao cabelo arrumado.
    reason: lexical_alternative
  - marker: c
    text: A cláusula final é textual e lexicalmente difícil. Muitos entendem o sentido como “uma marca de queimadura em vez de beleza”; outros traduzem de modo mais geral, como “vergonha em vez de beleza”.
    reason: textual_variant
lexical_decisions:
- source_word: בֹּשֶׂם
  choice: perfume
  rationale: O substantivo designa perfume ou bálsamo aromático; “perfume” é claro e preserva o contraste com a podridão.
- source_word: מַק
  choice: podridão
  rationale: Expressa decomposição ou putrefação, mantendo a concretude da imagem hebraica sem reduzi-la apenas ao mau cheiro resultante.
- source_word: חֲגוֹרָה
  choice: cinto
  rationale: Termo geral para algo usado ao redor da cintura; “cinto” é natural no português contemporâneo.
- source_word: נִקְפָּה
  choice: corda
  rationale: O termo raro é geralmente entendido como corda ou cordão, em contraste humilhante com o cinto ornamental; a incerteza é registrada em nota.
- source_word: מַעֲשֶׂה מִקְשֶׁה
  choice: cabelo bem-arrumado
  rationale: A expressão é difícil, mas seu contraste direto com “calvície” favorece uma referência ao cabelo cuidadosamente penteado ou elaborado.
- source_word: קָרְחָה
  choice: calvície
  rationale: Equivalente direto do substantivo hebraico, apropriado ao contraste com o cabelo elaborado.
- source_word: פְּתִיגִיל
  choice: veste luxuosa
  rationale: O termo raro parece indicar uma roupa exterior rica ou festiva; a tradução comunica luxo sem especificar um corte incerto.
- source_word: מַחֲגֹרֶת שָׂק
  choice: pano de saco amarrado à cintura
  rationale: Reproduz de modo natural a imagem literal de cingir-se com pano de saco, sinal de luto e humilhação.
- source_word: כִּי תַחַת יֹפִי
  choice: uma marca de ferro em vez de beleza
  rationale: A cláusula final é lacônica e difícil; “marca de ferro” expressa a interpretação contextual tradicional de desfiguração substituindo beleza, sem ocultar a dificuldade textual, que é indicada em nota.
