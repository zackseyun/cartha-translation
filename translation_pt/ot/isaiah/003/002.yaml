source:
  edition: WLC
  text: גִּבּ֖וֹר וְ/אִ֣ישׁ מִלְחָמָ֑ה שׁוֹפֵ֥ט וְ/נָבִ֖יא וְ/קֹסֵ֥ם וְ/זָקֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/002.yaml
  text: the mighty man and the man of war[a], the judge and the prophet, the diviner and the elder.
translation:
  language: pt
  text: o homem valente e o homem de guerra, o juiz e o profeta, o adivinho[a] e o ancião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que pratica adivinhação”.'
    reason: Esclarece o sentido funcional do termo hebraico קֹסֵם e registra uma alternativa lexical sem alterar o texto principal.
lexical_decisions:
- source_word: גִּבּוֹר
  choice: o homem valente
  rationale: Expressa força e bravura, preserva o masculino singular e mantém essa figura distinta da função militar mencionada em seguida.
- source_word: אִישׁ מִלְחָמָה
  choice: o homem de guerra
  rationale: Reproduz de modo claro e digno o idioma hebraico e evita fundi-lo com גִּבּוֹר, embora “guerreiro” também seja possível.
- source_word: שׁוֹפֵט
  choice: o juiz
  rationale: É a correspondência direta para quem exerce julgamento em função cívica ou jurídica.
- source_word: נָבִיא
  choice: o profeta
  rationale: É a designação corrente e precisa para o ofício profético.
- source_word: קֹסֵם
  choice: o adivinho
  rationale: Designa alguém que pratica adivinhação; a tradução descreve a figura social citada sem sugerir aprovação dessa prática.
- source_word: זָקֵן
  choice: o ancião
  rationale: Neste catálogo de figuras de importância pública, comunica melhor posição e autoridade social do que uma referência apenas à idade.
- source_word: וְ
  choice: e
  rationale: A repetição da conjunção foi mantida entre os pares para preservar a cadência formal do catálogo sem tornar o português excessivamente rígido.
theological_decisions:
- issue: Sentido de קֹסֵם no contexto da denúncia profética
  choice: o adivinho
  alternative: o agoureiro; aquele que pratica adivinhação
  rationale: A tradução direta conserva o caráter descritivo da lista e não suaviza nem acrescenta uma avaliação doutrinária à referência.
translation_notes:
  register: Português moderno, claro e digno, com cadência de catálogo. “Homem de guerra” conserva o paralelismo e a distinção lexical do hebraico; “ancião” retém a provável dimensão social e institucional.
