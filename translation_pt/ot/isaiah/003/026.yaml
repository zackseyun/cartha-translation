  text: And her gates will lament and mourn[a], and she will be stripped bare and sit on the ground.
translation:
  language: pt
  text: E suas portas se lamentarão e estarão de luto, e ela, despojada[a], se sentará no chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esvaziada” ou “deixada nua”. O verbo hebraico pode indicar ser esvaziada ou despojada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנ֥וּ
  choice: se lamentarão
  rationale: O verbo אנה, em contexto de lamentação e em paralelo com אבל, expressa pesar audível; a formulação preserva a personificação poética dos portões.
- source_word: וְאָבְל֖וּ
  choice: e estarão de luto
  rationale: אבל denota luto diante de perda ou devastação. A expressão distingue este verbo do anterior sem desfazer o paralelismo.
- source_word: פְּתָחֶ֑י/הָ
  choice: os portões dela
  rationale: Embora o substantivo possa significar aberturas ou entradas, no retrato urbano personificado de Sião, “portões” é a opção natural.
- source_word: וְנִקָּ֖תָה
  choice: esvaziada
  rationale: O nifal de נקה pode indicar que ela foi esvaziada, despojada ou deixada sem nada. “Esvaziada” conserva o valor lexical sem limitar a imagem apenas à nudez ou aos adornos.
- source_word: לָ/אָ֥רֶץ
  choice: no chão
  rationale: Com ישב nesta cena de humilhação, ארץ indica naturalmente a superfície do chão, não a terra ou o país em sentido amplo.
- source_word: תֵּשֵֽׁב
  choice: se sentará
  rationale: Embora ישב também possa significar habitar ou permanecer, sua combinação com “no chão” favorece a postura concreta de sentar-se em humilhação.
theological_decisions:
- issue: Referente do sujeito feminino singular
  choice: Manter o referente como a cidade personificada mediante “dela” e “ela”, sem acrescentar um nome no versículo.
  alternative: Explicitar “Sião” ou “Jerusalém”, ou entender uma figura feminina urbana genérica.
  rationale: O contexto anterior identifica Sião/Jerusalém e sustenta a personificação, mas o hebraico deste versículo não repete o nome. Os pronomes preservam tanto a continuidade contextual quanto a forma do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Estarão de luto” evita a possível leitura de “chorarão” como simples derramamento de lágrimas e mantém a distinção poética entre os dois verbos. A ordem final preserva a coordenação hebraica e torna explícito em português que a cidade personificada é tanto esvaziada quanto sentada no chão.
