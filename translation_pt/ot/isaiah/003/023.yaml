base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/023.yaml
  text: and the mirrors[a], and the linen garments, and the turbans[b], and the veils.
translation:
  language: pt
  text: e os espelhos[a], as vestes de linho, os turbantes e os véus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “placas”. O termo hebraico pode designar, de modo mais amplo, objetos lisos e polidos; neste contexto, “espelhos” se ajusta melhor à lista de adornos de luxo.
    reason: lexical_alternative
  - marker: b
    text: Ou “xales” ou “coberturas”. A forma exata da peça é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְיֹנִים
  choice: espelhos
  rationale: No contexto da lista de adornos e artigos de luxo, o termo provavelmente designa objetos lisos e polidos usados como espelhos. Esta tradução é clara, embora o sentido exato permaneça incerto.
- source_word: סְּדִינִים
  choice: roupas de linho
  rationale: O termo indica peças feitas de linho, mas não define com segurança seu corte ou uso. A opção preserva a referência ao material sem especificar além do hebraico.
- source_word: צְּנִיפוֹת
  choice: turbantes
  rationale: A palavra designa algo enrolado em torno da cabeça. “Turbantes” é uma equivalência corrente e suficientemente precisa.
- source_word: רְדִידִים
  choice: véus
  rationale: Nesta lista de vestuário feminino, o termo parece indicar uma cobertura leve colocada sobre o corpo ou a cabeça. “Véus” preserva a interpretação tradicional, enquanto a nota registra alternativas plausíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Mantém a estrutura enumerativa do hebraico e evita especificar formas de vestuário que o texto não determina com segurança.
