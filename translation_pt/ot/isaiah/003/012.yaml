  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַמִּ/י֙ נֹגְשָׂ֣י/ו מְעוֹלֵ֔ל וְ/נָשִׁ֖ים מָ֣שְׁלוּ ב֑/וֹ עַמִּ/י֙ מְאַשְּׁרֶ֣י/ךָ מַתְעִ֔ים וְ/דֶ֥רֶךְ אֹֽרְחֹתֶ֖י/ךָ בִּלֵּֽעוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/012.yaml
  text: My people—his oppressors are children[a], and women rule over him. My people[b], your guides lead you astray and swallow up the course of your paths.
translation:
  language: pt
  text: Meu povo — seus opressores são crianças, e mulheres dominam sobre ele. Meu povo, os que te guiam[a] te fazem errar e engolem o rumo de teus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Os que te guiam” também pode ser entendido como “os que te declaram feliz” ou “os que te chamam de feliz”. “Engolem o rumo de teus caminhos” reproduz uma metáfora hebraica para apagar ou destruir o caminho correto do povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשָׂיו
  choice: seus opressores
  rationale: Traduz נגשׂ como opressão ou coerção e conserva o sufixo masculino singular, cujo referente é o coletivo singular “meu povo”.
- source_word: מְעוֹלֵל
  choice: são crianças
  rationale: A forma é difícil, mas, no contexto da denúncia contra governantes incapazes, provavelmente caracteriza os opressores como crianças; evita-se a interpretação adicional de “infantis”.
- source_word: וְנָשִׁים מָשְׁלוּ בוֹ
  choice: e mulheres dominam sobre ele
  rationale: Mantém o sentido direto de נָשִׁים e a construção de משל com ב, bem como a referência coletiva no masculino singular.
- source_word: מְאַשְּׁרֶיךָ
  choice: os que o guiam
  rationale: O paralelismo com “fazem andar perdido” favorece o sentido contextual de dirigentes ou guias, embora a forma também possa referir-se aos que declaram alguém feliz; essa ambiguidade é registrada em nota.
- source_word: מַתְעִים
  choice: o fazem andar perdido
  rationale: Expressa o valor causativo de תעה, “fazer errar ou vaguear”, e sustenta a imagem de orientação desviada.
- source_word: דֶרֶךְ אֹרְחֹתֶיךָ
  choice: o rumo de suas veredas
  rationale: Procura representar os dois termos hebraicos ligados a caminho sem produzir uma combinação excessivamente artificial em português.
- source_word: בִּלֵּעוּ
  choice: engolem
  rationale: Preserva a metáfora concreta de בלע, em vez de substituí-la por explicações como “destroem” ou “confundem”.
theological_decisions:
- issue: Referência potencialmente depreciativa a mulheres no governo
  choice: Conservar “mulheres dominam sobre ele” como parte da retórica profética específica de juízo e desordem social.
  alternative: Generalizar como “os fracos dominam sobre ele” ou adotar uma emenda que resulte em “credores”.
  rationale: O texto massorético diz explicitamente “mulheres”. A tradução não deve neutralizar esse dado nem ampliá-lo para uma afirmação doutrinária universal sobre as mulheres.
- issue: Concordância com o coletivo “meu povo”
  choice: 'Manter pronomes no masculino singular: “seus”, “ele” e “o”.'
  alternative: Usar o plural inclusivo “seus”, “eles” e “os”, tratando “povo” segundo seus integrantes.
  rationale: Os sufixos hebraicos tratam עַמִּי como coletivo singular; a opção portuguesa conserva essa estrutura, embora ocasione uma alternância marcada entre a interpelação direta e a referência em terceira pessoa.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. Conservam-se o coletivo singular, a repetição de “Meu povo” e a metáfora incomum de engolir o caminho. O marcador [a] reúne duas ambiguidades lexicais relacionadas ao modo como os dirigentes desorientam o povo.
