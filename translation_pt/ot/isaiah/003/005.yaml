base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/005.yaml
  text: And the people will oppress one another—man against man[a], and each against his neighbor; the youth will act arrogantly toward the elder[c][b], and the despised toward the honored.
translation:
  language: pt
  text: E o povo será oprimido, cada um pelo outro e cada um por seu próximo; o jovem agirá com arrogância contra o ancião[b], e o desprezado agirá com arrogância contra o respeitado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete expressões distributivas, literalmente, “cada um pelo outro e cada um por seu próximo”, para enfatizar a opressão generalizada entre as pessoas.
    reason: lexical_alternative
  - marker: b
    text: “Ancião” também pode ser traduzido como “idoso”; o termo hebraico pode indicar tanto idade avançada quanto senioridade social.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגַּשׂ
  choice: oprimirá uns aos outros
  rationale: O nifal de נגשׂ expressa aqui pressão hostil e opressão recíproca em meio ao colapso social, não mera aproximação física.
- source_word: הָעָם
  choice: o povo
  rationale: O singular coletivo se refere à sociedade como um todo; “o povo” é natural e mantém a forma do hebraico.
- source_word: אִישׁ בְּאִישׁ וְאִישׁ בְּרֵעֵהוּ
  choice: um contra o outro, cada um contra o seu próximo
  rationale: A formulação conserva as duas expressões distributivas e a ideia explícita de hostilidade mútua, evitando uma repetição pouco natural em português.
- source_word: יִרְהֲבוּ
  choice: tratará ... com insolência
  rationale: O verbo רהב neste contexto indica conduta arrogante, atrevida ou insolente; a escolha comunica claramente a afronta à ordem social.
- source_word: הַנַּעַר
  choice: o jovem
  rationale: O termo pode designar menino ou jovem, mas aqui funciona como classe social em contraste com o ancião.
- source_word: בַּזָּקֵן
  choice: o ancião
  rationale: זָקֵן pode indicar tanto idade avançada quanto posição de senioridade; “ancião” preserva as duas possibilidades.
- source_word: הַנִּקְלֶה
  choice: o desprezado
  rationale: O particípio descreve quem é tido em pouca conta ou socialmente desprezado, em contraste deliberado com o respeitado.
- source_word: בַּנִּכְבָּד
  choice: o respeitado
  rationale: A forma derivada de כבד denota alguém honrado ou socialmente considerado; “respeitado” é claro e corrente em português.
