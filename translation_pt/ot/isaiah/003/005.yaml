revisions:
- from: E o povo oprimirá uns aos outros — um contra o outro, cada um contra o seu próximo[a]; o jovem tratará o ancião com insolência[b], e o desprezado, o respeitado.
  to: E o povo será oprimido, cada um pelo outro e cada um por seu próximo; o jovem agirá com arrogância contra o ancião[b], e o desprezado agirá com arrogância contra o respeitado[a].
  rationale: A revisão segue mais de perto a voz passiva do nifal hebraico na primeira oração e substitui a construção pronominal inadequada por uma formulação distributiva natural. Nas duas cláusulas finais, explicita-se o mesmo verbo para que o paralelismo social e a direção da arrogância sejam imediatamente compreensíveis. As notas foram mantidas, com a nota a ajustada à redação e à voz revisadas.
