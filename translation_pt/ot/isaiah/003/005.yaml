review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração do rascunho verte o nifal de נגשׂ como ativa e usa uma construção pronominal pouco adequada (“o povo oprimirá uns aos outros”). Neste contexto, a forma hebraica é mais diretamente passiva: o povo sofrerá opressão, distribuída entre indivíduos e vizinhos. A revisão preserva essa voz e a força distributiva. As duas antíteses sociais finais são mantidas.'
  naturalness: “O povo será oprimido, cada um pelo outro e cada um por seu próximo” é claro e digno em português moderno. A repetição explícita de “agirá com arrogância contra” na última oração evita uma elipse que, no rascunho, poderia soar truncada ou deixar obscuro que a insolência também se dirige ao respeitado.
  terminology: “Ancião” preserva apropriadamente tanto a idade quanto a possível senioridade social de זָקֵן. “Desprezado” e “respeitado” refletem bem o contraste entre נִקְלֶה e נִכְבָּד. “Agirá com arrogância” reproduz naturalmente o valor de insolência/arrojo de יִרְהֲבוּ sem impor uma interpretação adicional.
  issues:
  - severity: medium
    issue: Voz e construção da primeira oração
    rationale: “O povo oprimirá uns aos outros” muda a forma nifal para uma construção ativa e é sintaticamente pouco natural, pois “o povo” é singular e “uns aos outros” exige referentes plurais explícitos. A leitura passiva corresponde mais diretamente ao hebraico.
  - severity: medium
    issue: Elipse final excessivamente abrupta
    rationale: “E o desprezado, o respeitado” depende da elipse de “tratará ... com insolência”; embora o paralelismo hebraico admita elipse, em português essa forma pode ser percebida como fragmentária. Repetir o predicado conserva o sentido com clareza.
  - severity: low
    issue: Nota a descreve como literal uma relação traduzida por “contra”
    rationale: Na construção com o nifal, a relação distributiva é melhor expressa em português por “pelo outro”/“por seu próximo”, em conformidade com a leitura passiva adotada no texto.
