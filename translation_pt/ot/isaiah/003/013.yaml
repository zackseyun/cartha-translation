  naturalness: “Toma posição” é claro e apropriado. “Litigar” oferece uma formulação jurídica moderna e natural para o infinitivo absoluto/contextual, sem especificar indevidamente os pormenores da ação legal. “Está de pé” conserva o paralelismo visual do hebraico.
  terminology: “Yahweh” reproduz de modo consistente o Tetragrama. “Os povos” mantém o plural hebraico e não restringe a referência a nações estrangeiras. “Litigar” comunica adequadamente a dimensão forense de ריב.
