  text: נִצָּ֥ב לָ/רִ֖יב יְהוָ֑ה וְ/עֹמֵ֖ד לָ/דִ֥ין עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/013.yaml
  text: Yahweh takes his stand to contend[b][a], and stands to judge the peoples.
translation:
  language: pt
  text: Yahweh toma posição para litigar[a] e está de pé para julgar os povos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contender”, “apresentar uma causa” ou “pleitear”; o verbo hebraico pode evocar uma disputa judicial.
    reason: lexical_alternative
  - marker: b
    text: Ou “as nações”; o hebraico está no plural e pode referir-se amplamente a vários povos.
    reason: alternative_reading
lexical_decisions:
- source_word: נִצָּב
  choice: toma posição
  rationale: O particípio nifal expressa uma postura firme e deliberada. “Toma posição” conserva a vivacidade da cena judicial e soa natural em português.
- source_word: לָרִיב
  choice: para contender
  rationale: ריב pode descrever uma disputa, especialmente de caráter jurídico. “Contender” preserva a dimensão adversarial sem definir em excesso o procedimento legal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְעֹמֵד
  choice: e se levanta
  rationale: O particípio de עמד sustenta a imagem de Yahweh assumindo formalmente a posição de juiz. A formulação distingue o segundo verbo do primeiro sem perder o paralelismo.
- source_word: לָדִין
  choice: para julgar
  rationale: Neste contexto forense, דין significa mais naturalmente exercer juízo. “Julgar” é claro e evita ampliar o sentido para governar ou executar a sentença.
- source_word: עַמִּים
  choice: os povos
  rationale: O plural hebraico aponta para vários povos ou grupos humanos. “Os povos” preserva essa pluralidade sem restringir a referência às nações gentias.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o nome divino. “Yahweh” procura representar o Tetragrama como nome próprio, sem substituí-lo por um título.
- issue: Alcance de עַמִּים
  choice: os povos
  alternative: as nações
  rationale: O plural pode referir-se amplamente a diversos povos. A opção escolhida mantém aberta a extensão da cena judicial, sem limitá-la de antemão às nações estrangeiras.
- issue: Força jurídica de ריב
  choice: contender
  alternative: apresentar uma causa
  rationale: O contexto sugere uma controvérsia judicial, mas o verbo não exige que se especifique uma etapa processual. “Contender” conserva tanto a linguagem jurídica quanto sua amplitude.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais de ampla compreensão. O paralelismo judicial do hebraico foi preservado, e as notas mantêm abertas as principais alternativas lexicais.
