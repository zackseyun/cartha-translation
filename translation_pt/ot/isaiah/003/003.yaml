  yaml_path: translation/ot/isaiah/003/003.yaml
  text: the captain of fifty[a], and the man of rank, and the counselor, and the skillful craftsman, and the expert enchanter.
translation:
  language: pt
  text: o comandante de cinquenta, o homem de prestígio, o conselheiro, o artesão habilidoso e o perito em encantamentos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o entendido em sussurros ou fórmulas de encantamento”. O hebraico pode se referir a alguém versado em encantamentos pronunciados em voz baixa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  choice: o comandante de cinquenta
  rationale: שַׂר designa um chefe ou oficial; com חֲמִשִּׁים, indica alguém que comanda cinquenta homens. A formulação mantém o número explícito e soa clara em português atual.
- source_word: נְשׂוּא פָנִים
  choice: o homem de prestígio
  rationale: A expressão significa literalmente alguém de “rosto levantado” e funciona como idioma para uma pessoa honrada ou de elevada posição social. “Homem de prestígio” comunica esse status sem reproduzir literalmente um idioma obscuro.
- source_word: יוֹעֵץ
  choice: o conselheiro
  rationale: O particípio designa aquele que dá conselhos; “conselheiro” é direto e natural nesta enumeração de figuras influentes.
- source_word: חֲכַם חֲרָשִׁים
  choice: o artesão habilidoso
  rationale: חֲכַם pode indicar sabedoria ou habilidade, enquanto חֲרָשִׁים se refere a artesãos. Neste contexto profissional, “habilidoso” expressa melhor a competência técnica.
- source_word: נְבוֹן לָחַשׁ
  choice: o perito em encantamentos
  rationale: נְבוֹן indica discernimento ou perícia, e לָחַשׁ pode denotar sussurro, fórmula mágica ou encantamento. A tradução comunica de modo natural a provável referência a alguém versado em fórmulas de encantamento, enquanto a nota preserva a imagem e a ambiguidade lexical.
theological_decisions:
- issue: Tradução de uma expressão associada a práticas mágicas
  choice: o perito em encantamentos
  alternative: o entendido em sussurros ou fórmulas de encantamento
  rationale: A expressão provavelmente se refere à perícia em encantamentos sussurrados. A tradução conserva esse sentido sem apresentar a prática como aprovada nem inserir uma condenação que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição hebraica da conjunção foi ajustada à coordenação idiomática portuguesa. O marcador da nota foi colocado junto à expressão que ele esclarece.
