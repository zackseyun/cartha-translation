id: ISA.3.10
reference: Isaiah 3:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִמְר֥וּ צַדִּ֖יק כִּי ט֑וֹב כִּֽי פְרִ֥י מַעַלְלֵי/הֶ֖ם יֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/010.yaml
  text: Say of the righteous that it will be well[a], for they will eat the fruit of their deeds.
translation:
  language: pt
  text: 'Digam a respeito do justo: “Tudo irá bem com ele”[a], pois eles comerão o fruto de seus atos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Digam a respeito do justo que é bom, pois eles comerão o fruto de seus atos”. O hebraico passa do singular representativo (“justo”) para formas plurais na oração final.'
    reason: Alternativa lexical e esclarecimento da mudança de número no hebraico.
lexical_decisions:
- source_word: אִמְרוּ
  choice: Digam
  rationale: Imperativo plural de אמר. “Digam” transmite de modo direto e natural a ordem dirigida a vários ouvintes.
- source_word: צַדִּיק
  choice: o justo
  rationale: Adjetivo substantivado no singular, aqui com valor representativo. “O justo” preserva o número e o sentido ético do hebraico.
- source_word: כִּי (primeiro)
  choice: introduz a declaração direta
  rationale: O primeiro כִּי apresenta o conteúdo do que deve ser dito. Em português, a citação direta evita uma construção pesada e mantém a concisão.
- source_word: טוֹב
  choice: Tudo irá bem com ele
  rationale: Embora טוֹב signifique formalmente “bom”, no contexto expressa que a situação do justo será boa. A formulação explicita idiomaticamente esse sentido sem eliminar a alternativa literal, registrada em nota.
- source_word: כִּי (segundo)
  choice: pois
  rationale: Marca a explicação causal para o bem anunciado ao justo.
- source_word: פְרִי
  choice: o fruto
  rationale: Mantém a metáfora concreta de resultado e retribuição presente no hebraico.
- source_word: מַעַלְלֵיהֶם
  choice: seus atos
  rationale: Refere-se às ações ou obras praticadas. “Atos” é atual, conciso e conserva o peso moral do termo.
- source_word: יֹאכֵלוּ
  choice: eles comerão
  rationale: Preserva literalmente o verbo plural e a imagem agrícola de usufruir o resultado das próprias ações.
theological_decisions:
- issue: Singular representativo e mudança de número
  choice: Manter “o justo” no singular representativo e “eles comerão” no plural na oração final.
  alternative: 'Uniformizar no singular: “ele comerá o fruto de seus atos”.'
  rationale: O hebraico começa com צַדִּיק, singular, mas termina com verbo e sufixo pronominal plurais. Conservar a mudança evita harmonizar silenciosamente a tensão gramatical do texto. A nota esclarece a forma.
- issue: Sentido de טוֹב
  choice: Traduzir idiomaticamente como “Tudo irá bem com ele”.
  alternative: Traduzir mais formalmente como “isso é bom” ou “ele é bom”.
  rationale: No contexto de retribuição, a expressão anuncia um bom desfecho para o justo. A tradução principal comunica essa força contextual, enquanto a nota preserva a formulação mais estritamente formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A citação direta torna natural a função do primeiro כִּי. A mudança hebraica do singular para o plural foi deliberadamente preservada, apesar da leve tensão em português.
