  naturalness: O português é moderno, claro e de registro bíblico sóbrio. A sequência “o justo ... com ele ... eles comerão” produz uma pequena tensão de número, mas ela é intencional, fiel à alternância do hebraico e está devidamente esclarecida em nota.
  terminology: “Justo”, “fruto” e “atos” são escolhas semanticamente adequadas e naturais. “Pois” expressa bem a relação causal do segundo כִּי. A nota apresenta, sem impor leitura doutrinária, a alternativa mais formal e a mudança de número.
