  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מ/ל/כם תְּדַכְּא֣וּ עַמִּ֔/י וּ/פְנֵ֥י עֲנִיִּ֖ים תִּטְחָ֑נוּ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/015.yaml
  text: What do you mean by crushing my people and grinding the faces of the poor? declares the Lord GOD of hosts[a][b].
translation:
  language: pt
  text: “Por que vocês esmagam o meu povo e moem os rostos dos pobres?”[a][b] — declara o Senhor Yahweh dos Exércitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “O que há para vocês, para que...?” Uma repreensão idiomática, traduzida aqui como “Por que vocês...?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “trituram os rostos dos pobres”. A imagem hebraica descreve vividamente uma opressão cruel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה־לָכֶם
  choice: Com que direito vocês
  rationale: A expressão elíptica מָה־לָכֶם introduz uma repreensão indignada. Em português corrente, “Com que direito vocês...?” comunica naturalmente essa força confrontadora; a forma mais literal é preservada em nota.
- source_word: תְּדַכְּאוּ
  choice: esmagam
  rationale: O piel de דכא transmite a ideia concreta de esmagar ou comprimir. “Esmagam” mantém a violência da imagem, em vez de reduzi-la ao termo abstrato “oprimem”.
- source_word: עַמִּי
  choice: o meu povo
  rationale: Reproduz a construção possessiva e preserva a identificação pactual de Yahweh com o povo maltratado.
- source_word: וּפְנֵי עֲנִיִּים
  choice: e trituram o rosto dos pobres
  rationale: פנים pode funcionar como plural formal com sentido coletivo ou distributivo. O singular coletivo “o rosto dos pobres” soa natural em português e mantém a imagem hebraica.
- source_word: תִּטְחָנוּ
  choice: trituram
  rationale: O verbo טחן significa literalmente moer. “Trituram” conserva a metáfora brutal e evita repetir “esmagam”.
- source_word: עֲנִיִּים
  choice: os pobres
  rationale: Embora o termo também possa indicar aflitos ou necessitados, o contexto de exploração social favorece “os pobres”.
- source_word: נְאֻם
  choice: declara
  rationale: Expressa com clareza a fórmula profética que introduz um pronunciamento divino autorizado.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, “Senhor”, do nome divino יהוה, transliterado “Yahweh”, evitando a repetição artificial “Senhor SENHOR”.
- source_word: צְבָאוֹת
  choice: dos Exércitos
  rationale: Mantém o título divino tradicional e sua imagem de Yahweh como comandante das hostes, sem restringi-las explicitamente a forças humanas ou celestes.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יהוה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A transliteração preserva o nome próprio presente no hebraico e distingue os dois elementos do título. “Senhor DEUS” é uma convenção tipográfica possível, mas oculta o nome divino.
- issue: Identificação dos oprimidos como “meu povo”
  choice: preservar literalmente “o meu povo”
  alternative: explicitar uma interpretação social ou pactual
  rationale: O texto afirma a relação de Yahweh com os maltratados sem explicar aqui todos os seus contornos; a tradução não resolve além do hebraico quem está incluído nessa designação.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outras regiões lusófonas. O paralelismo e as duas imagens concretas de violência foram preservados; a repreensão inicial foi vertida idiomaticamente e acompanhada de nota.
