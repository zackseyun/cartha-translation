translation:
  language: pt
  text: os toucados, as correntes de tornozelo, as faixas, os recipientes de perfume[a] e os amuletos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “casas da vida” ou “casas da alma”; provavelmente pequenos recipientes para perfume ou substâncias aromáticas.
    reason: lexical_alternative
  - marker: b
    text: Ou “encantos”. O termo hebraico está relacionado a sussurros ou encantamentos e pode indicar amuletos associados a fórmulas mágicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּאֵרִים
  choice: os toucados
  rationale: O termo designa adornos ou coberturas ornamentais para a cabeça. “Toucados” é natural, suficientemente amplo e adequado ao contexto de peças de luxo.
- source_word: הַצְּעָדוֹת
  choice: as correntes de tornozelo
  rationale: Derivado de uma raiz ligada a dar passos, o termo provavelmente indica adornos usados nos tornozelos. “Correntes de tornozelo” preserva a provável forma da joia.
- source_word: הַקִּשֻּׁרִים
  choice: as faixas
  rationale: A palavra deriva de uma raiz com o sentido de atar ou prender. “Faixas” comunica de modo atual uma peça ornamental usada para cingir ou prender.
- source_word: בָּתֵּי הַנֶּפֶשׁ
  choice: os recipientes de perfume
  rationale: A expressão significa literalmente “casas da vida/alma”, mas, nesta lista de adornos, provavelmente se refere a pequenos recipientes de perfume ou substâncias aromáticas. A nota preserva a expressão literal incomum.
- source_word: הַלְּחָשִׁים
  choice: os amuletos
  rationale: O substantivo está ligado a sussurros ou encantamentos e, em uma lista de objetos pessoais, provavelmente designa amuletos associados a fórmulas mágicas. A nota mantém visível essa conotação.
theological_decisions:
- issue: Possível conotação ocultista de הַלְּחָשִׁים
  choice: amuletos no texto principal, com explicação da ligação a encantamentos em nota
  alternative: encantos; encantamentos sussurrados
  rationale: O contexto enumera objetos retirados no julgamento, favorecendo um objeto concreto. A nota evita apagar a associação lexical com sussurros e práticas mágicas sem transformar o item em um ato meramente verbal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A enumeração conserva o caráter concreto dos adornos, enquanto as notas registram as expressões hebraicas obscuras e suas alternativas.
