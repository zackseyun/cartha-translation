source:
  edition: WLC
  text: כִּי֩ הִנֵּ֨ה הָ/אָד֜וֹן יְהוָ֣ה צְבָא֗וֹת מֵסִ֤יר מִ/ירוּשָׁלִַ֨ם֙ וּ/מִ֣/יהוּדָ֔ה מַשְׁעֵ֖ן וּ/מַשְׁעֵנָ֑ה כֹּ֚ל מִשְׁעַן לֶ֔חֶם וְ/כֹ֖ל מִשְׁעַן מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/001.yaml
  text: 'For look, the Lord, the LORD of Armies, is removing from Jerusalem and from Judah support and supply: all support of bread and all support of water.'
translation:
  language: pt
  text: 'Pois eis que o Senhor, o SENHOR dos Exércitos, está retirando de Jerusalém e de Judá todo sustento e todo apoio: todo sustento de pão e todo sustento de água.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Pois vejam
  rationale: כִּי introduz a explicação do juízo anunciado, e הִנֵּה chama enfaticamente a atenção para o que está prestes a ocorrer.
- source_word: הָאָדוֹן יְהוָה צְבָאוֹת
  choice: o Senhor, o SENHOR dos Exércitos
  rationale: Preserva a distinção entre o título אָדוֹן e o nome divino יהוה, representado pela convenção editorial SENHOR; צְבָאוֹת é vertido pela expressão portuguesa tradicional e inteligível.
- source_word: מֵסִיר
  choice: está retirando
  rationale: O particípio apresenta a ação divina como iminente ou em andamento, com força vívida no contexto profético.
- source_word: מַשְׁעֵן וּמַשְׁעֵנָה
  choice: todo sustento e todo apoio
  rationale: O par hebraico usa formas masculina e feminina da mesma raiz, provavelmente para expressar totalidade. A tradução mantém dois termos correlatos naturais em português, sem tentar reproduzir artificialmente o gênero gramatical.
- source_word: כֹּל מִשְׁעַן לֶחֶם וְכֹל מִשְׁעַן מָיִם
  choice: todo sustento de pão e todo sustento de água
  rationale: Mantém a imagem incomum do hebraico, na qual pão e água são os meios básicos de sustento, e preserva a repetição enfática de כֹּל.
theological_decisions:
- issue: Identidade e autoridade daquele que executa o juízo
  choice: o Senhor, o SENHOR dos Exércitos
  alternative: o Soberano, o SENHOR dos Exércitos
  rationale: A formulação conserva os dois títulos hebraicos sem fundi-los e mantém a associação explícita do juízo com יהוה, sem acrescentar interpretação confessional.
- issue: Alcance da remoção
  choice: todo sustento e todo apoio
  alternative: apoio e provisão
  rationale: A repetição de “todo” comunica a abrangência sugerida pelo par de formas hebraicas e pela enumeração seguinte, sem definir além do texto se a remoção é apenas material ou também social.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem e a repetição retórica do hebraico foram preservadas quando naturais. “SENHOR” em versaletes tipográficos simulados por maiúsculas representa o nome divino יהוה.
