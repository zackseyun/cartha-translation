  source_fidelity: A construção hebraica כי הנה introduz enfaticamente o anúncio do juízo. “Pois eis que” a reproduz de modo mais direto do que o imperativo plural “vejam”. O restante preserva adequadamente a designação dupla ha'adon YHWH tseva'ot, a ação expressa pelo particípio e a repetição de “todo” na descrição das provisões básicas.
  naturalness: “Pois eis que” é uma fórmula moderna e solene, natural no registro bíblico em português. “Sustento” e “apoio” são compreensíveis e mantêm a repetição enfática sem impor uma distinção técnica ao par masculino/feminino hebraico.
  terminology: “SENHOR” para יהוה e “dos Exércitos” para צבאות seguem convenções portuguesas reconhecíveis. “O Senhor, o SENHOR dos Exércitos” conserva os dois elementos da expressão hebraica, embora a repetição seja deliberadamente solene.
  issues:
