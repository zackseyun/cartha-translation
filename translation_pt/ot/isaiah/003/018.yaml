  yaml_path: translation/ot/isaiah/003/018.yaml
  text: In that day the Lord will take away the beauty of the anklets[a], the headbands[c][b], and the crescent ornaments.
translation:
  language: pt
  text: Naquele dia, o Senhor tirará o esplendor das tornozeleiras, das faixas de cabeça[a] e dos enfeites em forma de lua crescente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido exato do termo hebraico é incerto; também pode indicar toucas ou redes para o cabelo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, adornos em forma de crescente; talvez fossem colares.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Reproduz de modo natural a expressão temporal profética que introduz o momento do juízo.
- source_word: יָסִיר
  choice: tirará
  rationale: O hifil de סור indica fazer desaparecer ou remover; “tirará” é claro e adequado ao contexto em que os adornos são retirados.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Trata-se do título divino Adonai, e não do tetragrama; por isso, o título é traduzido.
- source_word: תִּפְאֶרֶת
  choice: o esplendor
  rationale: O substantivo pode indicar beleza, glória ou requinte. “Esplendor” preserva seu valor positivo e sua relação com os adornos enumerados.
- source_word: הָעֲכָסִים
  choice: das tornozeleiras
  rationale: O termo designa adornos usados nos tornozelos; “tornozeleiras” é o equivalente moderno mais direto.
- source_word: הַשְּׁבִיסִים
  choice: das faixas de cabeça
  rationale: O objeto exato é incerto, mas parece ser algum tipo de adorno ou cobertura para a cabeça. A formulação é legível sem ocultar a incerteza, explicitada em nota.
- source_word: הַשַּׂהֲרֹנִים
  choice: dos enfeites em forma de lua crescente
  rationale: O termo deriva da ideia de lua ou crescente e designa joias com esse formato, sem determinar exatamente como eram usadas.
