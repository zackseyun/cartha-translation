  text: כִּֽי יִתְפֹּ֨שׂ אִ֤ישׁ בְּ/אָחִי/ו֙ בֵּ֣ית אָבִ֔י/ו שִׂמְלָ֣ה לְ/כָ֔ה קָצִ֖ין תִּֽהְיֶה לָּ֑/נוּ וְ/הַ/מַּכְשֵׁלָ֥ה הַ/זֹּ֖את תַּ֥חַת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/006.yaml
  text: 'For a man will seize his brother in his father''s house: “You have a cloak[a]; you shall be our leader[b], and this ruin shall be under your hand.”'
translation:
  language: pt
  text: 'Pois um homem agarrará seu irmão na casa de seu pai e dirá: “Você tem um manto; seja o nosso líder, e que esta ruína[a] fique sob a sua mão[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este colapso” ou, mais literalmente, “este obstáculo”.
    reason: lexical_alternative
  - marker: b
    text: “Sob a sua mão” é uma expressão idiomática hebraica que significa sob a sua autoridade ou aos seus cuidados.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação ou ilustração da desintegração social descrita no contexto anterior.
- source_word: יִתְפֹּשׂ
  choice: agarrará
  rationale: Expressa o ato enérgico de pegar ou segurar alguém, mantendo a pressão presente na cena.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva a forma masculina singular e o indivíduo masculino retratado no exemplo.
- source_word: בְּאָחִיו
  choice: seu irmão
  rationale: É o sentido comum de אָח, reforçado pela referência imediata à casa paterna.
- source_word: בֵּית אָבִיו
  choice: na casa de seu pai
  rationale: Mantém naturalmente a localização da cena no âmbito da família paterna.
- source_word: שִׂמְלָה
  choice: um manto
  rationale: Designa uma veste, especialmente uma peça exterior; no contexto, sua posse sinaliza uma aparência mínima de respeitabilidade e recursos.
- source_word: לְכָה
  choice: Você tem
  rationale: A construção hebraica indica posse e requer esta formulação idiomática em português.
- source_word: קָצִין
  choice: líder
  rationale: Comunica autoridade sem impor um sentido especificamente militar.
- source_word: תִּהְיֶה לָּנוּ
  choice: seja o nosso líder
  rationale: O imperfeito assume aqui força volitiva, como apelo ou exigência para que o homem aceite a liderança.
- source_word: הַמַּכְשֵׁלָה
  choice: esta ruína
  rationale: O substantivo ligado à ideia de tropeço designa, no contexto, o colapso ou desastre social; a nota conserva as alternativas mais literais.
- source_word: תַּחַת יָדֶךָ
  choice: sob a sua mão
  rationale: Preserva a imagem idiomática hebraica de algo colocado sob a autoridade ou responsabilidade de alguém.
theological_decisions: []
