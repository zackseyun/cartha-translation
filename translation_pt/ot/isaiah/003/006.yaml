  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta usa “você”, corrente no português do Brasil e inteligível internacionalmente. Os marcadores foram colocados junto aos termos a que as notas efetivamente se referem: “ruína” e “sob a sua mão”.'
