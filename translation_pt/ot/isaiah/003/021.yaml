lexical_decisions:
- source_word: הַטַּבָּעוֹת
  choice: os anéis
  rationale: טַבָּעוֹת é o plural de טַבַּעַת e designa anéis. No contexto de uma lista de adornos femininos, o termo geral é natural e evita especificar sem necessidade se eram anéis de sinete ou de dedo.
- source_word: וְנִזְמֵי הָאָף
  choice: e os anéis de nariz
  rationale: נִזְמֵי designa anéis ou ornamentos e, com הָאָף, refere-se naturalmente a anéis usados no nariz. A formulação é clara e concreta em português moderno.
- source_word: הָאָף
  choice: nariz
  rationale: אָף tem aqui o sentido anatômico literal de “nariz”. “Narina” seria mais específico do que o hebraico exige.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa apropriada a uma lista de adornos. A repetição de “anéis” preserva a distinção entre o termo geral e os anéis especificamente usados no nariz.
