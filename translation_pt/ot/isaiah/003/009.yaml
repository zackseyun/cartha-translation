base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/009.yaml
  text: The look on their faces testifies against them[a], and they proclaim their sin like Sodom; they do not hide it. Woe to themselves[c][b], for they have brought evil on themselves.
translation:
  language: pt
  text: A expressão do rosto deles testemunha contra eles[a]; proclamam seu pecado como Sodoma[b] e não o escondem. Ai deles[c], pois fizeram o mal recair sobre si mesmos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O aspecto do rosto deles depõe contra eles”. O hebraico pode se referir ao semblante ou à expressão visível como evidência de culpa.'
    reason: lexical_alternative
  - marker: b
    text: “Como Sodoma” evoca uma maldade pública e descarada; veja Gênesis 13:13; 19:5.
    reason: cross_reference
  - marker: c
    text: 'Ou: “Ai de si mesmos” ou “Ai de suas vidas”. O hebraico néfesh pode significar “pessoa”, “vida” ou “ser”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכָּרַת פְּנֵיהֶם
  choice: A expressão do rosto deles
  rationale: O sintagma provavelmente se refere ao aspecto reconhecível do semblante ou à expressão facial como evidência. A formulação é natural em português e mantém a referência visível sem decidir além do que o hebraico permite.
- source_word: עָנְתָה בָּם
  choice: testemunha contra eles
  rationale: ענה com ב pode ter sentido forense de depor ou testemunhar contra alguém. A tradução comunica com clareza que o semblante serve de evidência acusatória.
- source_word: וְחַטָּאתָם ... הִגִּידוּ
  choice: proclamam seu pecado
  rationale: O substantivo singular coletivo חַטָּאתָם é objeto de הִגִּידוּ. “Proclamam” expressa a manifestação pública e descarada sugerida pelo contexto.
- source_word: כִּסְדֹם
  choice: como Sodoma
  rationale: Preserva a comparação breve e a alusão bíblica à maldade pública e notória, sem explicá-la excessivamente no corpo do texto.
- source_word: לֹא כִחֵדוּ
  choice: não o escondem
  rationale: כחד significa esconder ou ocultar. O pronome retoma “pecado”, e a expressão é direta e corrente em português.
- source_word: אוֹי לְנַפְשָׁם
  choice: Ai deles
  rationale: נפש aqui designa as próprias pessoas, vidas ou eus, não necessariamente uma “alma” imaterial em sentido técnico. “Ai deles” comunica naturalmente a condenação dirigida a eles mesmos.
- source_word: כִּי גָמְלוּ לָהֶם רָעָה
  choice: pois fizeram o mal recair sobre si mesmos
  rationale: גמל pode significar tratar, retribuir ou fazer recair uma consequência. A formulação conserva a ideia de que o mal praticado retorna sobre os próprios agentes, sem definir explicitamente o mecanismo.
theological_decisions:
- issue: Sentido de נֶפֶשׁ em לְנַפְשָׁם
  choice: “deles”, referindo-se às próprias pessoas
  alternative: “da alma deles” ou “da vida deles”
  rationale: Neste contexto, נפש pode indicar a pessoa ou o próprio ser. A tradução evita impor ao termo uma antropologia técnica de alma imaterial.
- issue: Força da oração final
  choice: consequência ou juízo provocado pelos próprios atos
  alternative: retribuição divina explicitada ou mera consequência social
  rationale: O hebraico afirma que eles fizeram o mal recair sobre si, mas não explicita nesta oração o modo pelo qual isso ocorre. A tradução mantém essa tensão sem acrescentar o agente ou o mecanismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo acusação–exposição–consequência, enquanto as notas registram as principais alternativas lexicais sem sobrecarregar o versículo.
