translation:
  language: pt
  text: os trajes de festa[a], os mantos[b], os xales[c] e as bolsas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trajes finos”. O hebraico provavelmente se refere a roupas especiais e caras, não a vestimentas comuns.
    reason: lexical_alternative
  - marker: b
    text: Ou “capas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “lenços” ou “véus”. Não se sabe ao certo que tipo de acessório de tecido está em vista.
    reason: lexical_alternative
  - marker: d
    text: Ou “bolsinhas” ou “sacos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַּחֲלָצוֹת
  choice: trajes de festa
  rationale: O termo parece indicar roupas especiais e valiosas, usadas em ocasiões festivas ou formais. “Trajes de festa” comunica esse caráter distintivo em português claro, sem sugerir um modelo específico de roupa.
- source_word: מַּעֲטָפוֹת
  choice: mantos
  rationale: Derivado de uma raiz ligada à ideia de envolver, o substantivo designa provavelmente uma peça exterior que cobre o corpo. “Mantos” é natural no contexto e mantém o sentido amplo.
- source_word: מִּטְפָּחוֹת
  choice: xales
  rationale: O termo designa algum tipo de tecido usado como cobertura ou adorno, mas sua forma exata é incerta. “Xales” se ajusta à lista de peças de vestuário sem afirmar que cobriam necessariamente o rosto.
- source_word: חֲרִיטִים
  choice: bolsas
  rationale: O substantivo se refere a recipientes portáteis para dinheiro ou objetos de valor. “Bolsas” é claro e adequado ao inventário de artigos luxuosos, embora “bolsinhas” ou “sacos” também sejam possíveis.
