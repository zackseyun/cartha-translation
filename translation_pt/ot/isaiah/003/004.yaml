base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/004.yaml
  text: And I will make youths their princes[a], and capricious children will rule over them.
translation:
  language: pt
  text: E farei dos jovens os seus príncipes, e crianças caprichosas[a] governarão sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “crianças”, “meninos” ou “bebês”; o termo hebraico é raro e pode destacar pouca idade, comportamento infantil ou atuação caprichosa e arbitrária.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E farei de
  rationale: Embora נָתַן signifique literalmente “dar”, aqui a construção tem sentido de colocar ou constituir alguém numa função. “Farei de” é natural em português e preserva a ação divina sem tornar explícito demais “nomearei”.
- source_word: נְעָרִים
  choice: jovens
  rationale: O termo designa pessoas jovens, especialmente do sexo masculino, e neste contexto sugere inexperiência ou imaturidade. “Jovens” evita restringir indevidamente o sentido a crianças pequenas.
- source_word: שָׂרֵיהֶם
  choice: os seus príncipes
  rationale: שַׂר pode indicar príncipe, chefe, autoridade ou alto oficial. “Príncipes” conserva a imagem elevada de governo e corresponde diretamente ao papel político indicado no texto.
- source_word: וְתַעֲלוּלִים
  choice: crianças caprichosas
  rationale: O termo raro e discutido evoca infantilidade, instabilidade ou conduta arbitrária. A expressão mantém tanto a imagem de pouca idade quanto a possível crítica ao comportamento dos governantes.
- source_word: יִמְשְׁלוּ בָם
  choice: governarão sobre eles
  rationale: מָשַׁל com בְּ expressa o exercício de domínio ou governo sobre pessoas. “Governarão sobre eles” é direto, claro e preserva a relação sintática.
theological_decisions:
- issue: Se a juventude dos governantes é literal ou figurada
  choice: Preservar simultaneamente a imagem de governantes jovens e a conotação de imaturidade e instabilidade.
  alternative: Entender os termos apenas como indicação literal de idade, ou apenas como metáfora de governantes incompetentes.
  rationale: A linguagem hebraica permite que o juízo divino envolva tanto governantes realmente jovens quanto autoridades de comportamento infantil. A tradução não elimina essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação e o paralelismo do hebraico foram mantidos; “príncipes” preserva a imagem política tradicional, enquanto a nota registra a incerteza lexical do segundo termo.
