  text: וַ/יֹּ֣אמֶר יְהוָ֗ה יַ֚עַן כִּ֤י גָֽבְהוּ֙ בְּנ֣וֹת צִיּ֔וֹן וַ/תֵּלַ֨כְנָה֙ נטוות גָּר֔וֹן וּֽ/מְשַׂקְּר֖וֹת עֵינָ֑יִם הָל֤וֹךְ וְ/טָפֹף֙ תֵּלַ֔כְנָה וּ/בְ/רַגְלֵי/הֶ֖ם תְּעַכַּֽסְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/016.yaml
  text: 'And Yahweh said: Because the daughters of Zion are haughty[a], and walk with outstretched necks, glancing with their eyes, walking and mincing as they go, and making a jingling with their feet[b],'
translation:
  language: pt
  text: 'E Yahweh disse: “Visto que as filhas de Sião são arrogantes, andam de pescoço erguido, lançando olhares[a], caminham a passos curtos e afetados e produzem um tilintar com os pés[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é rara. Pode indicar olhares sedutores, insinuantes ou dissimulados.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazem suas tornozeleiras tilintar com os pés”. O verbo hebraico provavelmente se refere a um som produzido por adornos nos tornozelos, embora as tornozeleiras não sejam mencionadas explicitamente neste versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: יַעַן כִּי
  choice: Visto que
  rationale: Introduz naturalmente, em português, a causa do juízo anunciado no versículo seguinte.
- source_word: גָבְהוּ
  choice: são arrogantes
  rationale: Expressa o sentido figurado contextual de altivez ou orgulho, e não a noção literal de altura.
- source_word: בְּנוֹת צִיּוֹן
  choice: as filhas de Sião
  rationale: Mantém a expressão hebraica e suas ressonâncias poéticas e coletivas.
- source_word: נטוות גָּרוֹן
  choice: de pescoço erguido
  rationale: Reproduz de modo natural a postura ostensiva e orgulhosa sugerida pela imagem hebraica.
- source_word: מְשַׂקְּרוֹת עֵינָיִם
  choice: lançando olhares com os olhos
  rationale: Adota uma formulação relativamente neutra diante de uma expressão hebraica rara, sem decidir no texto se os olhares são sedutores ou dissimulados.
- source_word: הָלוֹךְ וְטָפֹף תֵּלַכְנָה
  choice: caminham a passos curtos e afetados
  rationale: Comunica tanto o movimento em passinhos quanto o caráter ostensivo ou requebrado do andar.
- source_word: וּבְרַגְלֵיהֶם תְּעַכַּסְנָה
  choice: fazem tilintar com os pés
  rationale: Preserva o efeito sonoro provável sem inserir no texto as tornozeleiras, que não são mencionadas explicitamente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome próprio divino e evita substituí-lo por um título, de acordo com a política terminológica do projeto.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A construção permanece aberta porque a declaração causal continua no versículo seguinte. A repetição “olhares com os olhos” conserva algo da forma hebraica e evita resolver indevidamente a expressão rara.
