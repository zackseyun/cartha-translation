id: ISA.3.8
reference: Isaiah 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י כָשְׁלָה֙ יְר֣וּשָׁלִַ֔ם וִ/יהוּדָ֖ה נָפָ֑ל כִּֽי לְשׁוֹנָ֤/ם וּ/מַֽעַלְלֵי/הֶם֙ אֶל יְהוָ֔ה לַ/מְר֖וֹת עֵנֵ֥י כְבוֹדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/008.yaml
  text: For Jerusalem has stumbled[a], and Judah has fallen, because their tongue and their deeds are against Yahweh, rebelling before the eyes of his glory.
translation:
  language: pt
  text: Pois Jerusalém tropeçou, e Judá caiu, porque a língua deles e seus atos são contra Yahweh, em rebeldia diante dos olhos de sua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à vista de sua glória”. O hebraico diz literalmente “os olhos de sua glória”, expressão vívida para uma rebeldia aberta diante da presença gloriosa de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do juízo anunciado anteriormente, com valor explicativo natural em português.
- source_word: כָשְׁלָה
  choice: tropeçou
  rationale: Preserva a imagem de vacilar ou tropeçar sem ampliar o sentido para destruição total.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma tradicional e corrente do topônimo em português.
- source_word: וִיהוּדָה נָפָל
  choice: e Judá caiu
  rationale: Mantém o paralelismo poético com “Jerusalém tropeçou” e traduz diretamente o verbo comum para cair.
- source_word: כִּי
  choice: porque
  rationale: Explicita a relação causal entre a queda e a oposição a Yahweh.
- source_word: לְשׁוֹנָם
  choice: a língua deles
  rationale: Conserva a imagem concreta da língua como metonímia da fala, evitando reduzir o texto a uma paráfrase.
- source_word: וּמַעַלְלֵיהֶם
  choice: e seus atos
  rationale: Expressa de maneira atual e moralmente significativa as ações ou obras praticadas.
- source_word: אֶל יְהוָה
  choice: são contra Yahweh
  rationale: No contexto hostil, אֶל indica oposição dirigida a Yahweh; a formulação mantém essa força adversativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לַמְרוֹת
  choice: em rebeldia
  rationale: Comunica a ação de desafiar ou rebelar-se e liga naturalmente a expressão à língua e aos atos mencionados.
- source_word: עֵנֵי כְבוֹדוֹ
  choice: diante dos olhos de sua glória
  rationale: Mantém de perto a expressão hebraica vívida, embora incomum, sem dissolvê-la inteiramente em “presença gloriosa”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” preserva esse caráter sem o substituir por um título.
- issue: Relação da rebeldia com “os olhos de sua glória”
  choice: em rebeldia diante dos olhos de sua glória
  alternative: para desafiar os olhos de sua glória; em rebeldia na presença de sua glória
  rationale: A opção mantém a ideia de desafio aberto perante Deus e preserva a imagem hebraica, sem afirmar que os olhos em si sejam o objeto atacado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado, assim como a imagem concreta de “língua” e a formulação incomum “olhos de sua glória”.
