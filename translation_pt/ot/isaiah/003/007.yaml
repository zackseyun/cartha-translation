base_translation:
  language: en
  yaml_path: translation/ot/isaiah/003/007.yaml
  text: On that day he will cry out[a], saying, “I will not be a healer, for in my house there is no bread and there is no cloak[b]; you must not make me leader of the people.”
translation:
  language: pt
  text: 'Naquele dia, ele erguerá a voz[a], dizendo: “Não serei curador[b], pois em minha casa não há pão, e não há manto. Não me nomeiem líder do povo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “clamará”. Literalmente, “levantará” ou “erguerá”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quem enfaixa”, isto é, quem trata feridas.
    reason: lexical_alternative
  - marker: c
    text: Ou “chefe do povo” ou “governante do povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: protestará
  rationale: O verbo significa literalmente “levantar, erguer” e, nesta construção introdutória de fala, apresenta uma declaração enfática. “Protestará” comunica com naturalidade a recusa pública expressa no contexto sem acrescentar um objeto ausente no hebraico.
- source_word: חֹבֵשׁ
  choice: curador
  rationale: O particípio designa literalmente alguém que enfaixa ou trata feridas. “Curador” conserva a imagem de alguém capaz de remediar a condição do povo, sem reduzi-la diretamente ao exercício de governo.
- source_word: לֶחֶם
  choice: pão
  rationale: Mantém o sentido concreto básico do termo, embora “pão” também possa representar alimento em geral.
- source_word: שִׂמְלָה
  choice: manto
  rationale: O substantivo indica uma peça de roupa, especialmente uma veste exterior; “manto” preserva essa concretude.
- source_word: תְשִׂימֻנִי
  choice: não me nomeiem
  rationale: O verbo significa “pôr, estabelecer, designar”. No contexto de uma função pública, “nomear” expressa claramente a recusa da designação.
- source_word: קְצִין עָם
  choice: líder do povo
  rationale: קְצִין pode indicar chefe, dirigente ou autoridade. “Líder do povo” é natural em português atual e evita impor um sentido especificamente militar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de fala direta. A repetição “não há... e não há...” reproduz a repetição hebraica de וְאֵין. O plural em “não me nomeiem” representa naturalmente o destinatário coletivo implícito no contexto.
