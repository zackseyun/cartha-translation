  text: לֹֽא יִקָּרֵ֥א ע֛וֹד לְ/נָבָ֖ל נָדִ֑יב וּ/לְ/כִילַ֕י לֹ֥א יֵֽאָמֵ֖ר שֽׁוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/005.yaml
  text: No longer will the fool be called noble[d][c][b][a], nor will the scoundrel be called generous.
translation:
  language: pt
  text: O insensato[a] já não será chamado nobre[b], nem o avarento[c] será chamado ilustre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o homem desprezível”; o termo hebraico expressa baixeza moral, além de insensatez.
    reason: lexical_alternative
  - marker: b
    text: Ou “principesco” ou “generoso”.
    reason: lexical_alternative
  - marker: c
    text: Ou “o mesquinho” ou “o sovina”.
    reason: lexical_alternative
  - marker: d
    text: Ou “nobre”, “rico” ou “importante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: o insensato
  rationale: O termo descreve insensatez de caráter e baixeza moral, não mera falta de inteligência. “Insensato” é conciso, natural e mantém a linguagem sapiencial.
- source_word: נָדִיב
  choice: nobre
  rationale: Pode indicar alguém nobre, principesco ou generoso. Aqui funciona como designação pública honrosa e contrasta com o caráter do insensato.
- source_word: כִילַי
  choice: o avarento
  rationale: O vocábulo aponta especialmente para uma pessoa mesquinha ou sovina. “Avarento” conserva essa dimensão econômica e moral sem ampliar indevidamente o sentido.
- source_word: שׁוֹעַ
  choice: ilustre
  rationale: O termo pode denotar alguém de posição, riqueza ou importância. “Ilustre” preserva a ideia de elevada consideração social e evita fazê-lo significar diretamente “generoso”, sentido menos seguro para este vocábulo.
- source_word: יִקָּרֵא
  choice: será chamado
  rationale: O nifal de קרא expressa aqui uma designação passiva; “será chamado” é direto e idiomático.
- source_word: יֵאָמֵר
  choice: será chamado
  rationale: Embora derive de אמר, a construção indica o modo como alguém é referido ou designado. Repetir “será chamado” reproduz com naturalidade o paralelismo conciso do hebraico.
- source_word: עוֹד
  choice: já não
  rationale: Com a negação, indica a cessação de uma situação anterior. “Já não” é corrente e claro em português.
theological_decisions:
- issue: Natureza do contraste do versículo
  choice: Uma correção social e moral em que pessoas de caráter corrupto deixam de receber títulos honrosos.
  alternative: Uma declaração explicitamente messiânica ou apenas um provérbio geral sobre a fala verdadeira.
  rationale: O hebraico trata diretamente da designação pública de pessoas moralmente indignas. O contexto mais amplo pode ter horizonte futuro ou escatológico, mas o texto não deve receber uma explicitação messiânica ausente deste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo do hebraico e distingue os dois títulos honrosos para não apagar a variação lexical do original.
