  text: And it will hail when the forest falls[a], and the city will be utterly laid low in the lowland.
translation:
  language: pt
  text: E cairá granizo quando a floresta cair[a], e, na região baixa, a cidade será abatida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E granizo cairá quando a floresta descer.” O hebraico permite uma formulação mais literal, em que “granizo” aparece primeiro e a floresta é descrita como descendo ou caindo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרַד
  choice: E cairá granizo
  rationale: O hebraico pode ser entendido como expressão meteorológica ligada à raiz ברד. Em português, “cairá granizo” é natural e mantém “granizo” explícito, sem decidir rigidamente se a forma funciona como verbo impessoal ou como substantivo.
- source_word: בְּרֶדֶת
  choice: quando ... vier abaixo
  rationale: O infinitivo construto de ירד com בְּ tem valor temporal. “Quando ... vier abaixo” comunica descida ou queda e se liga naturalmente ao sujeito seguinte.
- source_word: הַיָּעַר
  choice: a floresta
  rationale: יער designa uma floresta ou região arborizada; “floresta” é o equivalente português mais direto.
- source_word: וּבַשִּׁפְלָה
  choice: e ... na planície
  rationale: שפלה indica terreno baixo ou região baixa. “Planície” é corrente e inteligível, enquanto a nota registra a possibilidade mais formal “região baixa”.
- source_word: תִּשְׁפַּל
  choice: será inteiramente rebaixada
  rationale: A forma de שׁפל descreve a cidade tornando-se baixa ou sendo abatida. “Inteiramente rebaixada” preserva o jogo com a região baixa e evita interpretar o termo como humildade moral.
- source_word: הָעִיר
  choice: a cidade
  rationale: עיר é o termo comum para “cidade”, com o artigo definido preservado.
