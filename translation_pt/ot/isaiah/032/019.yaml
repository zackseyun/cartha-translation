revisions:
- from: E cairá granizo quando a floresta vier abaixo[a], e a cidade será inteiramente rebaixada na planície.
  to: E cairá granizo quando a floresta cair[a], e, na região baixa, a cidade será abatida.
  rationale: A revisão substitui “planície” por “região baixa”, preservando o sentido topográfico de שְׁפֵלָה e a ressonância com o verbo aplicado à cidade. “Será abatida” é mais idiomático e semanticamente proporcional a תִּשְׁפַּל do que “será inteiramente rebaixada”. A nota foi ajustada para descrever com precisão a alternativa formal.
