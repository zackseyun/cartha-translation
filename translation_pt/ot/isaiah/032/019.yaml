    issue: “na planície” é menos preciso para שְׁפֵלָה.
    rationale: O termo designa uma terra ou região baixa; uma planície pode não ser baixa e perde a relação verbal/imagética com שׁפל, aplicado em seguida à cidade.
  - severity: medium
    issue: “será inteiramente rebaixada” é rígido e acrescenta “inteiramente”.
    rationale: תִּשְׁפַּל indica que a cidade será baixa/abatida, mas não contém um intensificador equivalente a “inteiramente”. Além disso, “rebaixada” soa mais administrativo ou social do que descritivo para uma cidade.
  - severity: low
    issue: A nota apresenta como contraste sintático algo que a redação principal portuguesa já expressa de modo semelhante.
    rationale: Tanto “cairá granizo” quanto “o granizo cairá” fazem de granizo o sujeito em português. A nota deve explicar que a alternativa conserva uma formulação mais próxima da ordem/imagem hebraica, sem alegar uma distinção que o texto principal não faz.
