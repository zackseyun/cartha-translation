id: ISA.32.14
reference: Isaiah 32:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי אַרְמ֣וֹן נֻטָּ֔שׁ הֲמ֥וֹן עִ֖יר עֻזָּ֑ב עֹ֣פֶל וָ/בַ֜חַן הָיָ֨ה בְעַ֤ד מְעָרוֹת֙ עַד עוֹלָ֔ם מְשׂ֥וֹשׂ פְּרָאִ֖ים מִרְעֵ֥ה עֲדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/014.yaml
  text: For the palace is abandoned[a], the crowded city is forsaken; Ophel and the watchtower have become caves forever, a joy for wild donkeys[c][b], a pasture for flocks.
translation:
  language: pt
  text: Pois o palácio foi abandonado, e a cidade movimentada[a] foi abandonada; Ofel[b] e a torre de vigia se tornaram cavernas para sempre[c], alegria dos jumentos selvagens, pasto dos rebanhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cidade tumultuada”. O hebraico fala da multidão ou do ruído da cidade.'
    reason: lexical_alternative
  - marker: b
    text: “Ofel” é um nome de lugar, provavelmente a colina ou elevação fortificada de Jerusalém.
    reason: cultural_note
  - marker: c
    text: 'Ou: “se tornaram tocas para sempre”. O hebraico pode retratar as fortificações arruinadas como abrigos de animais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְמוֹן
  choice: palácio
  rationale: É o equivalente natural para um edifício régio ou fortificado de destaque e se ajusta ao cenário de desolação urbana.
- source_word: נֻטָּשׁ
  choice: está abandonado
  rationale: Reproduz o sentido passivo de algo deixado para trás ou deserto.
- source_word: הֲמוֹן עִיר
  choice: a cidade movimentada
  rationale: A expressão envolve a multidão ou o ruído da cidade; “movimentada” comunica de modo natural a ideia de um centro populoso e agitado.
- source_word: עֻזָּב
  choice: desamparada
  rationale: Mantém o paralelismo com “abandonado” sem repetição rígida e expressa que a cidade foi deixada para trás.
- source_word: עֹפֶל
  choice: Ofel
  rationale: É melhor entendido como nome próprio da elevação ou área fortificada de Jerusalém, por isso foi transliterado.
- source_word: בַּחַן
  choice: torre de vigia
  rationale: Provavelmente designa uma torre de observação, em paralelo com a área fortificada de Ofel.
- source_word: הָיָה בְעַד מְעָרוֹת
  choice: se tornaram cavernas
  rationale: Expressa a transformação das fortificações arruinadas em lugares semelhantes a cavernas ou abrigos de animais; a concordância plural é natural em português.
- source_word: מְעָרוֹת
  choice: cavernas
  rationale: Preserva o sentido básico do substantivo, embora “tocas” seja possível no contexto de animais entre ruínas.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a tradução convencional do idiomatismo de duração prolongada e preserva a força da linguagem profética.
- source_word: מְשׂוֹשׂ פְּרָאִים
  choice: alegria dos jumentos selvagens
  rationale: Mantém a imagem poética de um lugar em que os jumentos selvagens encontram prazer.
- source_word: מִרְעֵה עֲדָרִים
  choice: pasto dos rebanhos
  rationale: Tradução direta e idiomática da expressão referente a terreno de pastagem para animais agrupados em rebanhos.
theological_decisions:
- issue: Duração expressa por עַד עוֹלָם
  choice: para sempre
  alternative: por muito tempo
  rationale: A tradução preserva a força aberta da expressão profética sem determinar se ela deve ser entendida de modo absoluto ou retórico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético claro. Empregou-se “jumentos selvagens”, mais transparente no português brasileiro, e preservou-se “Ofel” como topônimo.
