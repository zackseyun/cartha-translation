base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/010.yaml
  text: In little more than a year you will tremble[a], you complacent women, because the grape harvest will fail[c][b]; the fruit harvest will not come.
translation:
  language: pt
  text: Daqui a pouco mais de um ano, vocês tremerão, mulheres despreocupadas[a], pois a colheita das uvas terá acabado, e a colheita dos frutos não virá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «mulheres confiantes» ou «mulheres que se sentem seguras».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o ajuntamento da produção não virá».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל שָׁנָה
  choice: Daqui a pouco mais de um ano
  rationale: A expressão, literalmente «dias sobre um ano», indica um breve período além de um ano completo. A formulação comunica naturalmente em português tanto o ponto futuro quanto a proximidade.
- source_word: תִּרְגַּזְנָה
  choice: vocês tremerão
  rationale: O verbo רגז pode indicar tremor, agitação ou perturbação. «Tremerão» preserva a força concreta da advertência profética e a forma feminina plural fica clara pelo vocativo seguinte.
- source_word: בֹּטְחוֹת
  choice: mulheres despreocupadas
  rationale: O particípio feminino plural de בטח descreve quem se sente seguro ou confiante. No contexto de censura, «despreocupadas» expressa a falsa tranquilidade sem introduzir terminologia denominacional.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual as mulheres tremerão. «Pois» mantém com naturalidade a relação causal.
- source_word: כָּלָה
  choice: acabará
  rationale: Embora seja morfologicamente perfeito, no discurso profético apresenta como certa uma realidade futura. «Acabará» preserva mais diretamente o sentido de chegar ao fim, sem decidir além do hebraico se a colheita falhará por completo ou simplesmente cessará.
- source_word: בָצִיר
  choice: a colheita das uvas
  rationale: בציר designa especificamente a vindima, isto é, a colheita de uvas. A expressão escolhida é transparente para leitores modernos de diferentes regiões lusófonas.
- source_word: אֹסֶף
  choice: a colheita dos frutos
  rationale: O substantivo refere-se à coleta ou ao ajuntamento da produção agrícola. «Colheita dos frutos» explicita o referente provável, enquanto a nota registra a alternativa mais formal e abrangente.
- source_word: בְּלִי יָבוֹא
  choice: não virá
  rationale: A construção significa literalmente «sem vir». A tradução conserva a imagem concreta da colheita esperada que não chega.
theological_decisions: []
