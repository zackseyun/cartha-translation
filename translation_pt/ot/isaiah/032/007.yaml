base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/007.yaml
  text: And the rogue’s devices are evil[a]; he devises schemes to ruin the humble with lying words[c][b], even when the poor man speaks what is just.
translation:
  language: pt
  text: Quanto ao canalha, seus meios são maus[a]; ele trama planos para arruinar os humildes[b] com palavras mentirosas, mesmo quando o pobre fala o que é justo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrumentos”, “utensílios” ou “armas”; o termo hebraico pode indicar objetos concretos ou, em sentido figurado, métodos de ação.
    reason: lexical_alternative
  - marker: b
    text: Ou “mansos” ou “aflitos”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “e ao falar o pobre justiça/juízo”. A expressão também pode aludir a uma causa ou reivindicação justa do pobre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵלַי / כֵּלָיו
  choice: canalha / seus meios
  rationale: O primeiro termo designa o indivíduo de caráter vil; o segundo é כְּלִי com sufixo, literalmente seus utensílios ou instrumentos. No contexto, “meios” transmite naturalmente os métodos que ele emprega, sem restringir a referência a objetos físicos.
- source_word: רָעִים
  choice: maus
  rationale: O adjetivo predicativo caracteriza moralmente os meios do canalha e preserva a força ética da denúncia profética.
- source_word: זִמּוֹת יָעָץ
  choice: trama planos
  rationale: A combinação expressa a elaboração deliberada de planos maliciosos. “Trama” conserva a intenção perversa sem tornar a frase artificial em português.
- source_word: לְחַבֵּל
  choice: para arruinar
  rationale: O infinitivo indica o objetivo destrutivo dos planos; “arruinar” abrange dano social, jurídico e material sem necessariamente sugerir aniquilação.
- source_word: ענוים
  choice: os humildes
  rationale: O termo pode indicar humildes, mansos ou aflitos. “Humildes” mantém a dimensão moral e não o confunde com אֶבְיוֹן, que nomeia especificamente o pobre ou necessitado na oração seguinte.
- source_word: בְּאִמְרֵי שֶׁקֶר
  choice: com palavras mentirosas
  rationale: A preposição indica o meio empregado. A formulação é natural em português e conserva a referência explícita à falsidade verbal.
- source_word: אֶבְיוֹן
  choice: o pobre
  rationale: O substantivo masculino singular designa uma pessoa pobre ou necessitada. “O pobre” reproduz o singular representativo e é corrente em português.
- source_word: וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  choice: mesmo quando o pobre defende uma causa justa
  rationale: A construção com בְּ e infinitivo é entendida circunstancialmente. No contexto jurídico-social, מִשְׁפָּט pode designar justiça, juízo ou uma causa legítima; a formulação comunica que o canalha age contra o pobre apesar da legitimidade de sua reivindicação.
theological_decisions:
- issue: Singular masculino representativo em אֶבְיוֹן
  choice: o pobre
  alternative: a pessoa necessitada
  rationale: O hebraico emprega um substantivo masculino singular de valor representativo. A tradução mantém essa forma sem limitar a aplicação do princípio a homens.
- issue: Sentido jurídico de מִשְׁפָּט na oração final
  choice: defende uma causa justa
  alternative: fala o que é justo
  rationale: O contexto admite tanto a fala justa em sentido geral quanto a apresentação de uma reivindicação legítima. A opção escolhida explicita o provável cenário jurídico, enquanto a nota preserva a amplitude da expressão hebraica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com fluidez brasileira. “Canalha” comunica o caráter vil do referente sem importar terminologia confessional; “meios” preserva o uso metafórico de כְּלִי. As notas registram as principais alternativas lexicais e a ambiguidade sintática e jurídica da oração final.
