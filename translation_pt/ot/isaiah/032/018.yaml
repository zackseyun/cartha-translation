  text: וְ/יָשַׁ֥ב עַמִּ֖/י בִּ/נְוֵ֣ה שָׁל֑וֹם וּֽ/בְ/מִשְׁכְּנוֹת֙ מִבְטַחִ֔ים וּ/בִ/מְנוּחֹ֖ת שַׁאֲנַנּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/018.yaml
  text: And my people will dwell in a peaceful habitation[a], in secure dwellings[b], and in quiet resting places.
translation:
  language: pt
  text: O meu povo habitará numa morada de paz[a], em habitações seguras e em lugares tranquilos de descanso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa morada pacífica”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em lugares de descanso sem perturbação” ou “em lugares de repouso sossegados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: habitará
  rationale: ישׁב pode significar sentar-se, morar ou habitar. No contexto profético de estabilidade duradoura, “habitará” expressa de modo natural a residência estabelecida; a conjunção וְ é refletida pela continuidade do enunciado em português, sem necessidade de iniciar o versículo com “E” isoladamente.
- source_word: עַמִּי
  choice: o meu povo
  rationale: עם com sufixo de primeira pessoa singular é a expressão relacional habitual “meu povo”; “nação” seria menos apropriado neste contexto.
- source_word: בִּנְוֵה
  choice: numa morada
  rationale: נוה pode indicar morada, habitação ou local de pastagem. O paralelismo com habitações e lugares de descanso favorece aqui o sentido residencial.
- source_word: שָׁלוֹם
  choice: de paz
  rationale: שׁלום abrange paz, integridade e bem-estar. “Morada de paz” conserva a relação nominal do hebraico e sua amplitude sem reduzi-la apenas à ausência de conflito.
- source_word: וּבְמִשְׁכְּנוֹת
  choice: em habitações
  rationale: משׁכנות designa lugares onde se mora. “Habitações” é claro e evita a conotação cultual que “tabernáculos” poderia introduzir indevidamente.
- source_word: מִבְטַחִים
  choice: seguras
  rationale: מבטחים comunica segurança e proteção objetivas. No plural e em concordância com “habitações”, “seguras” é conciso e idiomático.
- source_word: וּבִמְנוּחֹת
  choice: em lugares ... de descanso
  rationale: מנוחות refere-se a lugares de repouso ou descanso. A formulação concreta “lugares de descanso” preserva o plural e o paralelismo.
- source_word: שַׁאֲנַנּוֹת
  choice: tranquilos
  rationale: שׁאננות descreve o que está em sossego, à vontade ou sem perturbação. “Tranquilos” transmite calma e segurança sem sugerir necessariamente complacência.
theological_decisions:
- issue: Natureza das condições prometidas
  choice: Apresentar condições concretas e comunitárias de paz, segurança e descanso para o povo de Deus, sem delimitar o horizonte de cumprimento.
  alternative: Interpretar explicitamente a promessa como restauração histórica de Judá ou como paz messiânica escatológica.
  rationale: O versículo promete habitação pacífica e segura, mas, considerado isoladamente, não define se o cumprimento é histórico, escatológico ou tipológico. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético hebraico foi preservado por meio de três expressões locativas coordenadas. “Morada de paz” mantém a densidade de שׁלום, enquanto “habitações seguras” e “lugares tranquilos de descanso” comunicam de forma natural a progressão entre paz, proteção e repouso.
