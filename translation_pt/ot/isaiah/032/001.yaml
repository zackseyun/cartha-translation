source:
  edition: WLC
  text: הֵ֥ן לְ/צֶ֖דֶק יִמְלָךְ מֶ֑לֶךְ וּ/לְ/שָׂרִ֖ים לְ/מִשְׁפָּ֥ט יָשֹֽׂרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/001.yaml
  text: Behold[a], a king will reign in righteousness[d][c][b], and princes will rule with justice.
translation:
  language: pt
  text: Eis que[a] um rei[d] reinará com justiça[b], e príncipes[c] governarão segundo o direito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Vejam” ou “Olhem”; a expressão inicial chama enfaticamente a atenção.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “um rei reinará justamente”; o hebraico emprega a expressão “em/para justiça”.'
    reason: lexical_alternative
  - marker: c
    text: “Príncipes” também pode ser traduzido por “governantes” ou “autoridades”.
    reason: lexical_alternative
  - marker: d
    text: Muitos leitores cristãos entendem esse rei como messiânico no contexto mais amplo, mas aqui o hebraico diz simplesmente “um rei”.
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: Eis que
  rationale: Introduz uma declaração enfática e chama a atenção do ouvinte, preservando o tom profético de forma digna e corrente em português.
- source_word: לְצֶדֶק
  choice: com justiça
  rationale: A preposição לְ indica aqui a maneira ou a norma do reinado. “Com justiça” preserva o substantivo e seu peso moral e jurídico, sem tornar a expressão artificial em português.
- source_word: יִמְלָךְ מֶלֶךְ
  choice: um rei reinará
  rationale: מֶלֶךְ não tem artigo, por isso “um rei” mantém a indefinição do hebraico. O yiqtol é expresso naturalmente pelo futuro “reinará”.
- source_word: וּלְשָׂרִים
  choice: e príncipes
  rationale: שָׂרִים pode designar príncipes, governantes ou altos oficiais. “Príncipes” se ajusta ao contexto régio e mantém o paralelismo com “rei”.
- source_word: לְמִשְׁפָּט
  choice: segundo o direito
  rationale: A expressão indica a norma pela qual os príncipes governam. “Segundo o direito” comunica a dimensão jurídica e ética de מִשְׁפָּט e evita a repetição imediata de “justiça”.
- source_word: יָשֹׂרוּ
  choice: governarão
  rationale: O verbo שׂרר denota o exercício de autoridade. “Governarão” é claro no contexto político e não acrescenta ao verbo uma ideia de retidão que vem dos complementos.
theological_decisions:
- issue: Identificar explicitamente o rei como o Messias
  choice: Manter a expressão indefinida “um rei”, sem identificá-lo no texto principal.
  alternative: Traduzir “o rei” ou inserir uma identificação explicitamente messiânica.
  rationale: Embora muitos leitores cristãos entendam o rei em sentido messiânico à luz do contexto mais amplo, o hebraico deste versículo diz simplesmente “um rei”, sem artigo e sem o título “Messias”. A tradução preserva essa forma e deixa a interpretação teológica aberta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a força profética; “segundo o direito” evita repetição estilística sem enfraquecer a dimensão jurídico-ética do paralelismo.
