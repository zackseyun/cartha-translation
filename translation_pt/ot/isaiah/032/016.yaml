  text: וְ/שָׁכַ֥ן בַּ/מִּדְבָּ֖ר מִשְׁפָּ֑ט וּ/צְדָקָ֖ה בַּ/כַּרְמֶ֥ל תֵּשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/016.yaml
  text: Then justice will dwell in the wilderness[b][a], and righteousness will abide in the fruitful field.
translation:
  language: pt
  text: Então a justiça habitará no deserto, e a retidão permanecerá no campo fértil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Carmelo”. O hebraico karmel pode indicar terra fértil e cultivada ou, em certos contextos, a região chamada Carmelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַן
  choice: Então... habitará
  rationale: O perfeito qal pode ter sentido profético de futuro no contexto. “Então” expressa naturalmente a progressão em relação ao versículo anterior.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa terra desértica ou não cultivada e contrasta aqui com a terra fértil.
- source_word: מִשְׁפָּט
  choice: justiça
  rationale: Neste contexto de restauração, refere-se à ordem justa estabelecida, não apenas a um ato de julgamento.
- source_word: וּצְדָקָה
  choice: e a retidão
  rationale: “Retidão” preserva a distinção semântica em relação a מִשְׁפָּט, traduzido como “justiça”, e mantém o paralelismo hebraico.
- source_word: בַּכַּרְמֶל
  choice: no campo fértil
  rationale: כַּרְמֶל pode indicar terra fértil e cultivada; esse sentido comum forma o contraste contextual mais claro com o deserto.
- source_word: תֵּשֵׁב
  choice: permanecerá
  rationale: Embora o verbo signifique literalmente “sentar-se”, aqui comunica residência estável. “Permanecerá” soa natural em português e conserva a personificação e o paralelismo com “habitará”.
theological_decisions:
- issue: Distinção entre מִשְׁפָּט e צְדָקָה
  choice: justiça ... retidão
  alternative: justiça ... justiça; juízo ... justiça
  rationale: A tradução conserva os conceitos relacionados, mas distintos, de ordem justa e retidão, sem reduzir ambos ao mesmo termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo poético e a personificação, evitando o literalismo pouco natural de “sentará”.
