id: ISA.32.2
reference: Isaiah 32:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה אִ֥ישׁ כְּ/מַֽחֲבֵא ר֖וּחַ וְ/סֵ֣תֶר זָ֑רֶם כְּ/פַלְגֵי מַ֣יִם בְּ/צָי֔וֹן כְּ/צֵ֥ל סֶֽלַע כָּבֵ֖ד בְּ/אֶ֥רֶץ עֲיֵפָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/002.yaml
  text: And a man will be like a hiding place from the wind[a], and a shelter from the storm, like streams of water in a dry place[c][b], like the shade of a massive rock in a weary land.
translation:
  language: pt
  text: E um homem será como esconderijo contra o vento[a] e abrigo contra a tempestade[b], como correntes de água em lugar seco, como a sombra de uma rocha imensa em terra exausta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “refúgio contra o vento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “abrigo contra o aguaceiro” ou “contra o temporal”.
    reason: lexical_alternative
  - marker: c
    text: A expressão “um homem” pode referir-se representativamente ao governante ideal do versículo anterior, a cada governante justo ou, tipologicamente, a alguém além deles.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: E ... será
  rationale: O perfeito qal com waw em discurso profético expressa naturalmente um estado futuro ou resultante; “E” mantém a ligação com o versículo anterior.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o singular masculino do hebraico e deixa em aberto seu alcance individual, representativo ou tipológico.
- source_word: מַחֲבֵא רוּחַ
  choice: esconderijo contra o vento
  rationale: מַחֲבֵא designa um lugar de ocultação ou refúgio; a formulação conserva a imagem concreta e expressa proteção diante do vento.
- source_word: סֵתֶר זָרֶם
  choice: abrigo contra a tempestade
  rationale: סֵתֶר é abrigo ou cobertura, enquanto זָרֶם pode indicar temporal, chuva torrencial ou aguaceiro; “tempestade” preserva a amplitude da ameaça climática.
- source_word: פַלְגֵי מַיִם
  choice: correntes de água
  rationale: A expressão designa cursos ou canais de água corrente; “correntes de água” é natural em português e mantém a imagem vivificante.
- source_word: בְּצָיוֹן
  choice: em lugar seco
  rationale: O substantivo indica secura, aridez ou região ressequida; a tradução é clara e não especifica além do hebraico.
- source_word: צֵל סֶלַע כָּבֵד
  choice: a sombra de uma rocha imensa
  rationale: צֵל pode ser sombra ou sombra protetora; כָּבֵד significa literalmente “pesada”, mas aqui comunica massa e imponência, expressas naturalmente por “imensa”.
- source_word: בְּאֶרֶץ עֲיֵפָה
  choice: em terra exausta
  rationale: עֲיֵפָה significa cansada, desfalecida ou exausta. Aplicado à terra, mantém-se a personificação poética do original.
theological_decisions:
- issue: Referente de “um homem” no contexto
  choice: Manter “um homem” sem identificar explicitamente seu referente.
  alternative: Entender a expressão como o rei do versículo anterior, cada governante justo de modo representativo ou uma referência tipológica ao Messias.
  rationale: O contexto imediato menciona um rei e príncipes, mas o singular hebraico não resolve sozinho o alcance da referência. A tradução preserva essa abertura interpretativa sem inserir uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as quatro comparações poéticas, o singular masculino אִישׁ e a personificação de uma “terra exausta”. Os marcadores foram posicionados junto às expressões a que se referem.
