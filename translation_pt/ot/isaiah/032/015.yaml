source:
  edition: WLC
  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
translation:
  language: pt
  text: até que um espírito do alto seja derramado sobre nós[a], e o deserto se torne terra fértil[b], e a terra fértil seja considerada uma floresta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito do alto”. A palavra hebraica רוּחַ pode significar “espírito” e, neste contexto, talvez se refira especificamente ao Espírito de Deus.'
    reason: alternative_reading
  - marker: b
    text: “Terra fértil” traduz o hebraico כַּרְמֶל (karmel), que aqui provavelmente significa terra fértil ou cultivada, e não o nome do monte Carmelo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: até que
  rationale: Marca o limite temporal da condição anterior e introduz o acontecimento que transforma a situação.
- source_word: יֵעָרֶה
  choice: seja derramado
  rationale: O nifal de ערה expressa ação passiva de derramar; a forma portuguesa preserva tanto a voz passiva quanto a imagem de efusão.
- source_word: עָלֵינוּ
  choice: sobre nós
  rationale: Com o verbo 'derramar', 'sobre nós' é a correspondência natural de עַל e mantém o sentido direcional.
- source_word: רוּחַ
  choice: um espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro. A renovação vinda do alto favorece 'espírito'; o artigo indefinido preserva a ausência de artigo no hebraico sem eliminar a possível referência ao Espírito de Deus.
- source_word: מִמָּרוֹם
  choice: do alto
  rationale: מָרוֹם designa altura ou lugar elevado; 'do alto' é natural em português e conserva a possível conotação celestial.
- source_word: וְהָיָה
  choice: e ... se torne
  rationale: A construção introduz a transformação resultante. O subjuntivo liga naturalmente o resultado futuro a 'até que'.
- source_word: מִדְבָּר
  choice: o deserto
  rationale: Traduz a região inculta e contrasta claramente com a terra cultivada, em linguagem comum e digna.
- source_word: לַכַּרְמֶל
  choice: terra fértil
  rationale: כַּרְמֶל funciona aqui provavelmente como substantivo comum para terra fértil ou cultivada, e não como o topônimo Carmelo.
- source_word: וְכַרְמֶל
  choice: e a terra fértil
  rationale: Mantém o mesmo sentido comum e a repetição lexical do hebraico.
- source_word: לַיַּעַר
  choice: uma floresta
  rationale: יַעַר significa floresta ou mata; após 'considerada', a expressão portuguesa comunica a classificação indicada pelo ל hebraico.
- source_word: יֵחָשֵׁב
  choice: seja considerada
  rationale: O nifal de חשב significa ser contado, reputado ou considerado; esta opção é clara e preserva a passividade.
theological_decisions:
- issue: Se רוּחַ deve ser explicitado como o Espírito Santo
  choice: um espírito do alto
  alternative: o Espírito do alto
  rationale: O contexto sugere fortemente uma ação divina vivificadora, mas o hebraico não traz artigo nem diz explicitamente 'Santo'. O texto principal mantém a indeterminação gramatical, enquanto a nota registra a leitura teologicamente específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de 'terra fértil' reproduz a coesão lexical do hebraico; a sintaxe mantém o versículo ligado à condição anterior por 'até que'.
