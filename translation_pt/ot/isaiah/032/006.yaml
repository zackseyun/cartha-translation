  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י נָבָל֙ נְבָלָ֣ה יְדַבֵּ֔ר וְ/לִבּ֖/וֹ יַעֲשֶׂה אָ֑וֶן לַ/עֲשׂ֣וֹת חֹ֗נֶף וּ/לְ/דַבֵּ֤ר אֶל יְהוָה֙ תּוֹעָ֔ה לְ/הָרִיק֙ נֶ֣פֶשׁ רָעֵ֔ב וּ/מַשְׁקֶ֥ה צָמֵ֖א יַחְסִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/006.yaml
  text: 'For a fool speaks folly[a], and his heart devises iniquity: to practice godlessness and to speak error against Yahweh[c][b], to leave the hungry person empty and to withhold drink from the thirsty.'
translation:
  language: pt
  text: 'Pois o insensato fala insensatez, e seu coração trama a iniquidade: praticar a impiedade[a], falar falsidades contra Yahweh[b], deixar o faminto sem alimento[c] e privar o sedento de bebida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hipocrisia”. O termo hebraico pode indicar impiedade manifestada como irreligiosidade ou como perversidade hipócrita.
    reason: lexical_alternative
  - marker: b
    text: Ou “falar falsidades a respeito de Yahweh”.
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “esvaziar o néfesh do faminto”. Aqui, נֶפֶשׁ refere-se à pessoa, vida ou apetite do faminto, e não necessariamente à “alma” em sentido restrito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל / נְבָלָה
  choice: insensato / insensatez
  rationale: Preserva o jogo de palavras hebraico e comunica falta de juízo em sentido moral, não mera deficiência intelectual.
- source_word: וְלִבּוֹ יַעֲשֶׂה אָוֶן
  choice: e seu coração produz iniquidade
  rationale: Mantém a imagem hebraica do coração como centro da vontade e do pensamento; “produz” expressa a ação deliberada indicada por יַעֲשֶׂה sem limitar o sentido a planejamento mental.
- source_word: חֹנֶף
  choice: impiedade
  rationale: No contexto, o termo designa perversidade irreligiosa, ligada a falsidades contra Yahweh e à opressão dos necessitados.
- source_word: אֶל יְהוָה תּוֹעָה
  choice: fala falsidades contra Yahweh
  rationale: Expressa tanto o conteúdo falso ou enganoso de תּוֹעָה quanto a força hostil possível da preposição אֶל neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְהָרִיק נֶפֶשׁ רָעֵב
  choice: deixa o faminto sem alimento
  rationale: Comunica em português natural a privação concreta sofrida pela pessoa faminta, sem interpretar נֶפֶשׁ como uma alma imaterial.
- source_word: וּמַשְׁקֶה צָמֵא יַחְסִיר
  choice: priva o sedento de bebida
  rationale: Traduz de modo claro a ação de fazer faltar ou reter aquilo que o sedento precisa beber.
theological_decisions:
- issue: Sentido ético-religioso de חֹנֶף
  choice: impiedade
  alternative: hipocrisia
  rationale: “Impiedade” preserva o sentido mais amplo de perversidade diante de Deus; “hipocrisia” poderia restringir indevidamente o pecado à falta de sinceridade.
- issue: Referente de נֶפֶשׁ na expressão sobre o faminto
  choice: a pessoa faminta, expressa como “o faminto”
  alternative: alma ou apetite
  rationale: O contexto trata da pessoa em sua necessidade corporal concreta, não de uma parte imaterial separada.
- issue: Relação de אֶל יְהוָה com a fala falsa
  choice: contra Yahweh
  alternative: a respeito de Yahweh
  rationale: “Contra” representa bem a força adversativa do contexto, enquanto a nota conserva a possibilidade de referência ao conteúdo falado acerca de Yahweh.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção paralela e direta. “Insensato/insensatez” conserva o jogo verbal do hebraico; “iniquidade” e “impiedade” mantêm o peso ético-religioso do verso sem recorrer a linguagem denominacional.
