  source_fidelity: 'A tradução preserva adequadamente a imagem de desolação: a terra do povo será tomada por vegetação espinhosa, alcançando também as casas ligadas à alegria na cidade exultante. “Espinhos e abrolhos” é uma boa representação não excessivamente específica de קוֹץ שָׁמִיר, e “cidade exultante” conserva o sentido de עַלִּיזָה. Contudo, “casas alegres” desloca levemente o constructo בָּתֵּי מָשׂוֹשׂ, que mais diretamente designa ‘casas de alegria’.'
  naturalness: A construção após o ponto e vírgula (“sim, sobre todas...”) fica como fragmento sintático em português. O travessão permite conservar de modo natural e deliberadamente poético a elipse do verbo, reproduzindo a extensão da vegetação sobre as casas.
  terminology: “Terra do meu povo”, “espinhos e abrolhos” e “cidade exultante” são adequados ao registro profético e ao português moderno. “Casas de alegria” é mais fiel à relação construtiva hebraica e permanece compreensível sem interpretação denominacional.
