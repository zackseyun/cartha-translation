  - severity: low
    issue: O ponto e vírgula introduz uma oração elíptica pouco fluida em português.
    rationale: O segundo ‘sobre’ retoma o alcance de ‘crescerão’, mas, depois de ponto e vírgula, a elipse parece truncada. Um travessão assinala melhor a ampliação poética e enfática.
  revised_text: Na terra do meu povo, crescerão[a] espinhos e abrolhos — sim, sobre todas as casas de alegria da cidade exultante[b].
