base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/013.yaml
  text: On the land of my people[a], thorn and brier will come up; indeed[b], over all the joyful houses in the exultant city.
translation:
  language: pt
  text: Na terra do meu povo, crescerão[a] espinhos e abrolhos — sim, sobre todas as casas de alegria da cidade exultante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brotarão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cidade jubilante”; o hebraico descreve uma cidade marcada por alegria ou celebração.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת עַמִּי
  choice: a terra do meu povo
  rationale: “Terra” comunica com naturalidade o solo ou território pertencente ao povo, mantendo a imagem concreta do hebraico.
- source_word: קוֹץ שָׁמִיר
  choice: espinhos e abrolhos
  rationale: A dupla expressão representa vegetação espinhosa que toma conta da terra desolada. “Espinhos e abrolhos” preserva o paralelismo sem identificar espécies botânicas específicas.
- source_word: תַּעֲלֶה
  choice: crescerão
  rationale: Neste contexto, o verbo descreve vegetação que surge do solo. O plural é natural em português com o sujeito composto “espinhos e abrolhos”.
- source_word: כִּי
  choice: sim
  rationale: Entendido como partícula enfática que amplia e reforça o alcance da devastação, e não necessariamente como conjunção causal.
- source_word: בָּתֵּי מָשׂוֹשׂ
  choice: casas alegres
  rationale: Expressa de forma natural a construção “casas de alegria”, deixando aberta a possibilidade de serem casas marcadas por festa ou prazer.
- source_word: קִרְיָה עַלִּיזָה
  choice: cidade exultante
  rationale: “Exultante” preserva o sentido explícito de júbilo ou regozijo sem acrescentar a ideia interpretativa mais forte de despreocupação ou complacência.
