  text: But a noble man plans noble things[b][a], and he stands on noble things.
translation:
  language: pt
  text: Mas o homem nobre planeja coisas nobres[a], e ele se mantém firme em coisas nobres.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “coisas generosas”. Em hebraico, נָדִיב e נְדִיבוֹת podem expressar tanto nobreza quanto generosidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “e por meio de coisas nobres ele se mantém firme” ou “e sobre coisas nobres ele se firma”. A expressão hebraica com עַל e יָקוּם é concisa e admite essas nuances próximas.
    reason: alternative_reading
lexical_decisions:
- source_word: נָדִיב
  choice: homem nobre
  rationale: O adjetivo substantivado masculino singular pode designar alguém nobre, digno ou generoso. “Homem nobre” conserva a forma representativa masculina e o contraste moral com o perverso e o insensato nos versículos anteriores, sem restringir o sentido a um príncipe.
- source_word: נְדִיבוֹת
  choice: coisas nobres
  rationale: O substantivo abstrato plural pode abranger planos, atos ou propósitos nobres e generosos. “Coisas nobres” preserva a repetição lexical com נָדִיב e evita limitar o referente apenas a atos de generosidade.
- source_word: יָעָץ
  choice: planeja
  rationale: Neste contexto, יעץ descreve a formulação de intenções ou propósitos, e não o ato de aconselhar outra pessoa; “planeja” é claro e corrente.
- source_word: עַל
  choice: nelas
  rationale: O pronome retoma “coisas nobres” e expressa de modo natural em português a ideia de apoiar-se ou manter-se nelas. A nota registra as nuances instrumentais e locativas possíveis da construção hebraica.
- source_word: יָקוּם
  choice: permanece firme
  rationale: קום significa literalmente levantar-se ou ficar de pé, mas aqui sugere estabilidade ou perseverança. “Permanece firme” comunica esse valor contextual sem apagar completamente a imagem de firmeza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição “nobre/coisas nobres” reproduz o vínculo lexical hebraico; “nelas permanece firme” evita uma construção excessivamente literal e pouco idiomática, enquanto a nota conserva a ambiguidade da segunda oração.
