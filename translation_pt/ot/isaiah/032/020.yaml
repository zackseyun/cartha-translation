  yaml_path: translation/ot/isaiah/032/020.yaml
  text: Blessed are you who sow beside all waters[a], who let the feet of the ox and the donkey range free.
translation:
  language: pt
  text: Felizes são vocês que semeiam junto a todas as águas e deixam o boi e o jumento andar livremente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “soltam o pé do boi e do jumento”, expressão que indica deixá-los circular ou pastar livremente.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיכֶם
  choice: Felizes são vocês
  rationale: A expressão plural apresenta os destinatários como felizes e dignos de felicitação. A formulação mantém a força de uma bem-aventurança em português atual, sem recorrer a um registro excessivamente eclesiástico.
- source_word: זֹרְעֵי
  choice: que semeiam
  rationale: A oração relativa traduz naturalmente o particípio, identificando os destinatários por sua atividade contínua.
- source_word: עַל כָּל מָיִם
  choice: junto a todas as águas
  rationale: A expressão evoca lugares abundantemente irrigados onde se pode semear; “junto a” é natural em português e preserva a imagem espacial.
- source_word: מְשַׁלְּחֵי רֶגֶל
  choice: deixam ... andar livremente
  rationale: A construção significa literalmente “soltam/enviam o pé” e, no contexto agrícola, descreve permitir que os animais circulem ou pastem livremente.
- source_word: הַשּׁוֹר
  choice: o boi
  rationale: “Boi” é a designação corrente do bovino usado no trabalho agrícola e forma o par esperado com “jumento”.
- source_word: וְהַחֲמוֹר
  choice: e o jumento
  rationale: “Jumento” é claro, atual e adequado ao contexto rural.
