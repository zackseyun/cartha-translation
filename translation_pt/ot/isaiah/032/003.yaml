  text: וְ/לֹ֥א תִשְׁעֶ֖ינָה עֵינֵ֣י רֹאִ֑ים וְ/אָזְנֵ֥י שֹׁמְעִ֖ים תִּקְשַֽׁבְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/003.yaml
  text: Then the eyes of those who see will not be dim[a], and the ears of those who hear will listen attentively.
translation:
  language: pt
  text: Então os olhos dos que veem não se turvarão[a], e os ouvidos dos que ouvem prestarão atenção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não desviarão o olhar”. O verbo hebraico pode indicar olhos turvos ou impedidos e também admite a ideia de desviar o olhar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא תִשְׁעֶינָה
  choice: Então... não ficarão obscurecidos
  rationale: O primeiro waw expressa naturalmente a sequência no contexto profético. A negação foi mantida de modo direto, e תִשְׁעֶינָה foi vertido como perda de obscurecimento ou impedimento visual, sem exagerá-lo como cegueira total.
- source_word: עֵינֵי רֹאִים
  choice: os olhos dos que veem
  rationale: Preserva a construção hebraica e a linguagem sensorial, sem transformar רֹאִים no termo técnico 'videntes'.
- source_word: וְ/אָזְנֵי שֹׁמְעִים
  choice: e os ouvidos dos que ouvem
  rationale: Mantém o paralelismo entre olhos e ouvidos e traduz o particípio substantivado com naturalidade.
- source_word: תִּקְשַׁבְנָה
  choice: prestarão atenção
  rationale: קשׁב indica escuta atenta, não apenas a capacidade de ouvir. A expressão é clara e idiomática em português amplo.
theological_decisions:
- issue: Natureza da percepção restaurada
  choice: Preservar as imagens concretas de olhos e ouvidos, permitindo que expressem discernimento e receptividade restaurados
  alternative: Explicitar uma cura estritamente física ou substituir as imagens por 'compreenderão' e 'obedecerão'
  rationale: O contexto de Isaías 32:1–4 favorece uma dimensão moral, espiritual e social, mas o texto formula a promessa por meio de linguagem sensorial. A tradução não elimina essa tensão nem restringe os participantes a líderes proféticos.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo preservado. 'Obscurecidos' mantém a ambiguidade da imagem visual; 'prestarão atenção' comunica escuta atenta de forma natural.
