  yaml_path: translation/ot/isaiah/032/009.yaml
  text: You complacent women[a], rise up; hear my voice. You confident daughters[c][b], listen to my word.
translation:
  language: pt
  text: Mulheres despreocupadas[a], levantem-se e ouçam a minha voz. Filhas confiantes[b], escutem a minha palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tranquilas” ou “seguras”; o hebraico pode descrever quem vive sem perturbação ou com segurança despreocupada. Neste contexto profético, a expressão tem tom de censura.
    reason: lexical_alternative
  - marker: b
    text: Ou “filhas seguras”; o hebraico destaca a sensação de segurança ou autoconfiança.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: mulheres
  rationale: O substantivo plural designa mulheres em sentido amplo; o paralelismo com “filhas” não favorece “esposas”.
- source_word: שַׁאֲנַנּוֹת
  choice: acomodadas
  rationale: No contexto de repreensão profética, expressa uma vida tranquila acompanhada de despreocupação censurável; “acomodadas” comunica essa nuance em português corrente.
- source_word: קֹמְנָה
  choice: levantem-se
  rationale: Imperativo feminino plural de קום, vertido de modo natural e com a urgência da convocação profética.
- source_word: שְׁמַעְנָה
  choice: ouçam
  rationale: Imperativo feminino plural que chama as destinatárias a ouvir; mantém o paralelismo verbal com “escutem”.
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Tradução direta e natural de קוֹלִי no contexto de discurso.
- source_word: בָּנוֹת
  choice: filhas
  rationale: Preserva a forma hebraica de tratamento e o paralelismo com “mulheres”, sem a reduzir a uma repetição.
- source_word: בֹּטְחוֹת
  choice: confiantes
  rationale: O particípio descreve mulheres que se sentem seguras. “Confiantes” preserva a segurança subjetiva sem sugerir necessariamente fé correta.
- source_word: הַאְזֵנָּה
  choice: escutem
  rationale: O imperativo hiphil pede atenção auditiva; “escutem” é claro, atual e distingue levemente o verbo do primeiro membro.
- source_word: אִמְרָתִי
  choice: a minha palavra
  rationale: Expressa uma declaração ou palavra proferida e forma um paralelo natural com “a minha voz”.
