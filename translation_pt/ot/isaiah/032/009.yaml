translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância feminina plural explícita. A repetição imperativa e o paralelismo hebraico foram preservados. “Acomodadas” foi preferido a “complacentes”, que em português pode sugerir condescendência com outras pessoas, embora a nota registre a amplitude semântica do termo hebraico.
