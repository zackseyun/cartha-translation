  text: עַל שָׁדַ֖יִם סֹֽפְדִ֑ים עַל שְׂדֵי חֶ֕מֶד עַל גֶּ֖פֶן פֹּרִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/012.yaml
  text: They beat their breasts in mourning over the delightful fields[b][a], over the fruitful vine.
translation:
  language: pt
  text: Batem no peito em lamento[a] pelos campos agradáveis, pela videira frutífera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico condensado; literalmente, “sobre os seios, lamentando”. Muitos entendem a expressão como referência ao gesto de bater no peito em sinal de tristeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁדַיִם
  choice: no peito
  rationale: O substantivo significa literalmente “seios”. Neste contexto de lamento, a expressão hebraica condensada provavelmente alude ao gesto de bater no peito; o singular coletivo é a forma idiomática natural em português.
- source_word: סֹפְדִים
  choice: em lamento
  rationale: O particípio expressa lamentar ou prantear. A formulação mantém o aspecto durativo sem acrescentar explicitamente uma referência temporal futura.
- source_word: שְׂדֵי חֶמֶד
  choice: campos agradáveis
  rationale: חֶמֶד comunica aquilo que é desejável, precioso ou agradável. “Campos agradáveis” conserva o valor positivo da terra e soa claro em português moderno.
- source_word: גֶּפֶן פֹּרִיָּה
  choice: videira frutífera
  rationale: 'Tradução direta e natural da imagem agrícola: גֶּפֶן é “videira”, e פֹּרִיָּה, “frutífera” ou “que dá fruto”.'
- source_word: עַל
  choice: pelos / pela
  rationale: A preposição repetida introduz o motivo ou objeto do lamento. Em português, “lamentar por” exige aqui as formas contraídas “pelos” e “pela”, preservando a repetição.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ritmo poético. A tradução evita inserir um sujeito expresso ou um tempo futuro, pois o hebraico usa um particípio masculino plural depois das formas femininas plurais do contexto anterior. A ambiguidade da expressão inicial é preservada em nota.
