  text: וְ/הָיָ֛ה מַעֲשֵׂ֥ה הַ/צְּדָקָ֖ה שָׁל֑וֹם וַֽ/עֲבֹדַת֙ הַ/צְּדָקָ֔ה הַשְׁקֵ֥ט וָ/בֶ֖טַח עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/017.yaml
  text: And the work of righteousness will be peace, and the service of righteousness, quietness and security forever.
translation:
  language: pt
  text: A obra da justiça será paz; e o trabalho da justiça, tranquilidade e segurança para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה (maʿăśê)
  choice: resultado
  rationale: Embora o termo possa significar “obra” ou “feito”, neste paralelismo ele aponta naturalmente para aquilo que a justiça produz.
- source_word: הַצְּדָקָה (haṣṣĕdāqâ)
  choice: justiça
  rationale: Mantém o sentido amplo de retidão e justiça presente no termo hebraico, sem restringi-lo a uma formulação doutrinária específica.
- source_word: עֲבֹדַת (ʿăḇōḏaṯ)
  choice: efeito
  rationale: O substantivo pode designar trabalho ou serviço; no paralelismo com מַעֲשֵׂה, expressa aqui o efeito produzido pela justiça.
- source_word: הַשְׁקֵט (hašqēṭ)
  choice: tranquilidade
  rationale: Comunica o estado de sossego e ausência de perturbação indicado pelo hebraico.
- source_word: בֶטַח (ḇeṭaḥ)
  choice: segurança
  rationale: Expressa confiança objetiva, estabilidade e condição segura; “segurança” se ajusta bem à coordenação com “tranquilidade”.
- source_word: עַד עוֹלָם (ʿaḏ ʿôlām)
  choice: para sempre
  rationale: Equivalente português natural para a duração indefinida ou perpétua indicada pela expressão.
theological_decisions:
- issue: Natureza da relação entre justiça, paz e segurança
  choice: Manter uma relação de resultado sem identificar doutrinariamente quem pratica a justiça ou de que modo ela se realiza.
  alternative: Explicitar que se trata de justiça humana, justiça divina ou justificação.
  rationale: O versículo afirma poeticamente que a justiça produz paz, tranquilidade e segurança, mas não especifica aqui uma formulação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. O ponto e vírgula deixa claro o paralelismo entre as duas orações. A repetição de “será” torna a segunda oração natural em português sem alterar a relação sintática do hebraico.
