  text: חִרְדוּ֙ שַֽׁאֲנַנּ֔וֹת רְגָ֖זָה בֹּֽטְח֑וֹת פְּשֹׁ֣טָֽה וְ/עֹ֔רָה וַ/חֲג֖וֹרָה עַל חֲלָצָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/011.yaml
  text: Tremble[a], you complacent women; shudder, you confident ones. Strip, make yourselves bare[c][b], and tie sackcloth around your waist.
translation:
  language: pt
  text: Tremam, mulheres acomodadas; estremeçam, as que se sentem seguras! Dispam-se e fiquem nuas; cinjam-se de pano de saco[a] à cintura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico não menciona explicitamente o pano de saco neste versículo; o objeto é subentendido pelo ato de se cingir em um contexto profético de luto.
    reason: cultural_note
  - marker: b
    text: Literalmente, “sobre os lombos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְדוּ
  choice: Tremam
  rationale: O imperativo plural de חרד expressa tremor causado por medo ou alarme. “Tremam” é direto, natural e mantém a força da ordem.
- source_word: שַׁאֲנַנּוֹת
  choice: mulheres acomodadas
  rationale: O adjetivo feminino plural descreve mulheres que vivem tranquilas e despreocupadas diante do perigo. “Acomodadas” comunica, no contexto profético, a censura à falsa tranquilidade sem tornar o termo excessivamente técnico.
- source_word: רְגָזָה
  choice: estremeçam
  rationale: O imperativo feminino plural de רגז indica agitação, estremecimento ou abalo. “Estremeçam” preserva o paralelismo com “Tremam” e distingue levemente os dois verbos.
- source_word: בֹּטְחוֹת
  choice: mulheres que se sentem seguras
  rationale: O particípio feminino plural de בטח caracteriza quem vive com sensação de segurança. A formulação explicita que se trata de segurança percebida, possivelmente falsa, sem resolver além do texto a ironia profética.
- source_word: פְּשֹׁטָה וְעֹרָה
  choice: Dispam-se e fiquem nuas
  rationale: Os dois imperativos ordenam retirar as roupas e ficar expostas. A tradução conserva a sequência intensificadora do hebraico em português natural.
- source_word: וַחֲגֹרָה
  choice: amarrem pano de saco
  rationale: חגר significa cingir ou atar algo ao corpo. O objeto não está expresso no verso; “pano de saco” é fornecido pelo contexto tradicional de luto e recebe nota para deixar transparente essa explicitação.
- source_word: עַל חֲלָצָיִם
  choice: em volta da cintura
  rationale: A expressão significa literalmente “sobre/ao redor dos lombos”. “Em volta da cintura” descreve de modo claro e corrente o ato de cingir, enquanto a forma literal é preservada em nota.
