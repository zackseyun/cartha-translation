  source_fidelity: A tradução preserva adequadamente o endereçamento feminino plural, a sucessão de imperativos e o tom de advertência. A explicitação de “pano de saco” é defensável no contexto de luto e está corretamente transparentada em nota. Contudo, “amarrem pano de saco” não expressa com precisão que o pano é cingido ao próprio corpo; “cinjam-se ... à cintura” reproduz melhor חגר e a locução relativa aos lombos.
  naturalness: “Tremam, mulheres acomodadas; estremeçam, mulheres que se sentem seguras” é compreensível, mas a repetição de “mulheres” torna o paralelismo menos fluente. “as que se sentem seguras” mantém o referente feminino já estabelecido. “Cinjam-se de pano de saco à cintura” é natural, claro e mais idiomático que “amarrem pano de saco em volta da cintura”.
  terminology: “Pano de saco” é termo tradicional e compreensível para o tecido de luto. “Acomodadas” é uma opção possível para שַׁאֲנַנּוֹת no contexto de repreensão; não exige alteração. A nota sobre o objeto elíptico deve permanecer, pois o hebraico não nomeia o material a ser cingido.
