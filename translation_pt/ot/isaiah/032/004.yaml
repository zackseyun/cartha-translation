id: ISA.32.4
reference: Isaiah 32:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְבַ֥ב נִמְהָרִ֖ים יָבִ֣ין לָ/דָ֑עַת וּ/לְשׁ֣וֹן עִלְּגִ֔ים תְּמַהֵ֖ר לְ/דַבֵּ֥ר צָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/004.yaml
  text: The heart of the hasty will understand knowledge[b][a], and the tongue of stammerers will hasten to speak clearly.
translation:
  language: pt
  text: O coração dos precipitados[a] compreenderá o conhecimento, e a língua dos que gaguejam se apressará a falar com clareza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos impulsivos”. O hebraico descreve pessoas apressadas ou rápidas em seus julgamentos.
    reason: lexical_alternative
  - marker: b
    text: Ou “estará pronta para falar de modo claro e distinto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַב
  choice: coração
  rationale: Preserva o termo antropológico hebraico, que aqui designa a faculdade interior de pensar e compreender, não apenas as emoções.
- source_word: נִמְהָרִים
  choice: os precipitados
  rationale: Expressa pessoas rápidas e impulsivas em seus juízos; mantém também a relação lexical com o verbo מהר na segunda oração.
- source_word: יָבִין לָדַעַת
  choice: compreenderá o conhecimento
  rationale: Mantém de perto a construção cognitiva do hebraico, na qual בין indica compreender ou discernir e לדעת funciona como complemento ligado ao saber.
- source_word: לְשׁוֹן
  choice: língua
  rationale: Conserva a imagem concreta e o paralelismo poético entre o coração e a língua.
- source_word: עִלְּגִים
  choice: os que gaguejam
  rationale: Comunica de modo natural e atual a ideia de fala impedida ou hesitante, sem transformar a característica em rótulo pessoal.
- source_word: תְּמַהֵר לְדַבֵּר
  choice: se apressará a falar
  rationale: Reproduz a ideia de prontidão expressa pelo Piel de מהר e preserva o contraste intencional com a fala hesitante.
- source_word: צָחוֹת
  choice: com clareza
  rationale: Traduz o sentido adverbial de fala clara, distinta ou desimpedida e estabelece contraste natural com a gagueira.
theological_decisions: []
