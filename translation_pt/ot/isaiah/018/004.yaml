id: ISA.18.4
reference: Isaiah 18:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֵלַ֔/י אשקוטה וְ/אַבִּ֣יטָה בִ/מְכוֹנִ֑/י כְּ/חֹ֥ם צַח֙ עֲלֵי א֔וֹר כְּ/עָ֥ב טַ֖ל בְּ/חֹ֥ם קָצִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/004.yaml
  text: 'For this is what Yahweh said to me: “I will remain quiet and look on from my dwelling place[a], like clear heat in sunshine[b], like a cloud of dew in the heat of harvest.”'
translation:
  language: pt
  text: 'Pois assim me disse Yahweh: “Ficarei quieto e observarei da minha morada[a], como o calor límpido à luz do sol[b], como uma nuvem de orvalho no calor da colheita.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficarei imóvel e observarei no meu lugar estabelecido”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “como o calor límpido sobre a luz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino da aliança por transliteração, em conformidade com a prática do projeto.
- source_word: אֵלַי
  choice: me disse
  rationale: Expressa naturalmente em português o objeto indireto explícito depois do verbo “dizer”.
- source_word: אשקוטה
  choice: Ficarei quieto
  rationale: שׁקט comunica quietude ou imobilidade deliberada; a formulação evita sugerir repouso por cansaço ou indiferença.
- source_word: וְאַבִּיטָה
  choice: e observarei
  rationale: נבט indica olhar ou contemplar; “observarei” transmite atenção continuada sem acrescentar uma ação interventora.
- source_word: בִמְכוֹנִי
  choice: da minha morada
  rationale: מָכוֹן designa um lugar estabelecido ou habitação. “Da” apresenta a morada como ponto de observação, enquanto a nota conserva a possibilidade mais formal de localização.
- source_word: כְחֹם צַח
  choice: como o calor límpido
  rationale: Mantém a combinação incomum de חֹם, “calor”, com צַח, “límpido, claro ou brilhante”, sem explicar excessivamente a imagem.
- source_word: עֲלֵי אוֹר
  choice: à luz do sol
  rationale: A expressão literal “sobre a luz” é incomum; “à luz do sol” comunica de modo natural a imagem meteorológica, sem apagar a literalidade, que é registrada em nota.
- source_word: כְעָב טַל
  choice: como uma nuvem de orvalho
  rationale: Preserva os dois substantivos concretos, עָב, “nuvem”, e טַל, “orvalho”, bem como a imagem poética pouco usual.
- source_word: בְחֹם קָצִיר
  choice: no calor da colheita
  rationale: Reproduz de forma clara e idiomática a circunstância agrícola e temporal do hebraico.
theological_decisions:
- issue: Postura divina de quietude e observação
  choice: Traduzir diretamente a quietude deliberada e a observação de Yahweh, sem definir a quietude como indiferença nem como preparação secreta para o juízo.
  alternative: “Descansarei e contemplarei”, com ênfase no repouso, ou uma paráfrase que explicite preparação para julgar.
  rationale: O hebraico apresenta Yahweh imóvel e atento por meio de comparações naturais. A tradução conserva essa tensão e não antecipa a ação descrita pelo contexto posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ficarei quieto” conserva a solenidade sem soar arcaico; “calor límpido” e “nuvem de orvalho” mantêm as imagens poéticas incomuns do hebraico. Todos os marcadores de nota aparecem no texto principal.
