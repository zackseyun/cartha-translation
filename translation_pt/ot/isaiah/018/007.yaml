  to: 'Naquele tempo, será levado um presente ao SENHOR dos Exércitos, da parte de um povo de estatura alta e pele lisa, de um povo temido por toda parte, uma nação de ordem após ordem e pisoteamento[a], cuja terra os rios dividem. O presente será levado ao lugar do nome do SENHOR dos Exércitos: o monte Sião.'
