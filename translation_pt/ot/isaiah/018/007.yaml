  terminology: “SENHOR dos Exércitos”, “presente” e “monte Sião” são escolhas adequadas. Para גּוֹי קַו־קָו וּמְבוּסָה, “ordem após ordem e pisoteamento” conserva a repetição e evita a expansão interpretativa “esmagar os outros”; a nota registra as alternativas lexicais relevantes.
