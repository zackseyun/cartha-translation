base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/007.yaml
  text: At that time a gift will be brought to the LORD of Armies from a people tall and smooth-skinned, from a people feared far and wide, a nation of command upon command and trampling, whose land rivers divide, to the place of the name of the LORD of Armies, Mount Zion.
translation:
  language: pt
  text: 'Naquele tempo, será levado um presente ao SENHOR dos Exércitos, da parte de um povo de estatura alta e pele lisa, de um povo temido por toda parte, uma nação de ordem após ordem e pisoteamento[a], cuja terra os rios dividem. O presente será levado ao lugar do nome do SENHOR dos Exércitos: o monte Sião.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil. A expressão também pode ser entendida como “uma nação de medida sobre medida e de pisoteamento”.
    reason: Registra a incerteza lexical e sintática de קַו־קָו וּמְבוּסָה sem introduzir um agente ou objeto não expresso.
lexical_decisions:
- source_word: שַׁי
  choice: presente
  rationale: O termo designa uma dádiva levada a uma autoridade ou divindade. “Presente” mantém amplitude maior que “tributo”, que poderia sugerir uma obrigação política não explicitada.
- source_word: יְהוָה צְבָאוֹת
  choice: SENHOR dos Exércitos
  rationale: Representa o nome divino segundo a convenção portuguesa de versaletes e traduz צְבָאוֹת de modo claro e tradicional.
- source_word: מְמֻשָּׁךְ וּמוֹרָט
  choice: alto e de pele lisa
  rationale: Segue uma compreensão antiga e contextual da descrição física do povo; a expressão hebraica admite outras análises, mas esta produz português inteligível e corresponde ao retrato adotado no contexto.
- source_word: נוֹרָא מִן־הוּא וָהָלְאָה
  choice: temido por toda parte
  rationale: Expressa em português natural a ideia espacial abrangente da frase difícil, sem restringir o temor apenas a perto ou longe.
- source_word: גּוֹי קַו־קָו וּמְבוּסָה
  choice: uma nação que dá ordens e mais ordens e esmaga os outros
  rationale: Reproduz a repetição enfática קַו־קָו e o sentido de pisotear de מְבוּסָה, ao mesmo tempo que evita uma construção nominal pouco natural em português.
- source_word: בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: cuja terra os rios dividem
  rationale: Adota a leitura contextual de rios que cortam ou repartem o território; o verbo é raro e seu sentido exato é incerto.
theological_decisions:
- issue: Natureza da oferta levada ao SENHOR
  choice: presente
  alternative: tributo
  rationale: O hebraico não exige que a dádiva seja pagamento compulsório; “presente” evita decidir uma questão político-teológica que o verso deixa aberta.
- issue: Destino e relação sintática da frase final
  choice: Explicitar que o presente será levado ao lugar do nome do SENHOR
  alternative: Ligar diretamente o povo ao destino sem repetir “o presente será levado”
  rationale: A explicitação em uma segunda frase esclarece a longa estrutura hebraica sem alterar o agente, o objeto ou o destino do ato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “ordens e mais ordens” conserva a força retórica do hebraico; a segunda frase reduz a sobrecarga sintática sem mudar o conteúdo.
