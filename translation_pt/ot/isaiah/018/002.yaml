base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/002.yaml
  text: 'sending envoys by sea[a], in papyrus vessels over the surface of the waters: Go, swift messengers, to a nation tall and smooth-skinned, to a people feared far and wide, a nation mighty and trampling down[d][c][b], whose land the rivers divide.'
translation:
  language: pt
  text: que envia emissários pelo mar, em embarcações de papiro sobre a superfície das águas.[a] Vão, mensageiros velozes, a uma nação de gente alta e de pele lisa,[b] a um povo temido por toda parte, uma nação poderosa[c] e que pisa aos pés, cuja terra os rios dividem.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e em barcos de junco” ou “de papiro”.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “uma nação estendida e polida”; a expressão provavelmente descreve a aparência física do povo.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, “uma nação de linha sobre linha” ou expressão semelhante; o sentido é obscuro.
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “cuja terra os rios saqueiam” ou “devastam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: que envia
  rationale: O artigo com o particípio dá continuidade à descrição iniciada no versículo anterior; a oração relativa soa natural em português e mantém essa ligação.
- source_word: צִירִים
  choice: emissários
  rationale: O termo designa representantes ou mensageiros em missão, provavelmente diplomática; “emissários” preserva essa nuance.
- source_word: בַּיָּם
  choice: pelo mar
  rationale: Expressa de modo idiomático a rota aquática pela qual os emissários são enviados.
- source_word: וּבִכְלֵי גֹמֶא
  choice: em embarcações de papiro
  rationale: גֹמֶא é papiro ou junco, e כְלֵי, neste contexto, refere-se a embarcações feitas desse material.
- source_word: עַל פְּנֵי מַיִם
  choice: sobre a superfície das águas
  rationale: Torna clara a expressão hebraica “sobre a face das águas” sem perder sua imagem.
- source_word: לְכוּ
  choice: Vão
  rationale: Imperativo plural direto, dirigido aos mensageiros.
- source_word: מַלְאָכִים קַלִּים
  choice: mensageiros velozes
  rationale: קַלִּים indica rapidez neste contexto, e não pouco peso.
- source_word: גּוֹי מְמֻשָּׁךְ וּמוֹרָט
  choice: uma nação alta e de pele lisa
  rationale: A frase difícil provavelmente descreve a aparência física do povo; a nota conserva o sentido mais formal e a incerteza.
- source_word: עַם נוֹרָא מִן הוּא וָהָלְאָה
  choice: um povo temido por toda parte
  rationale: Comunica naturalmente a extensão da reputação amedrontadora expressa pela locução hebraica difícil.
- source_word: גּוֹי קַו קָו
  choice: uma nação poderosa
  rationale: A expressão קַו קָו é obscura. “Poderosa” oferece um sentido contextual coerente, enquanto a nota registra a formulação literal sem fingir certeza.
- source_word: וּמְבוּסָה
  choice: e esmagadora
  rationale: Preserva a imagem de pisar ou subjugar e a entende, conforme o contexto, como característica ativa da nação.
- source_word: אֲשֶׁר בָּזְאוּ נְהָרִים אַרְצוֹ
  choice: cuja terra os rios dividem
  rationale: No cenário associado a Cuxe e ao sistema do Nilo, o verbo difícil pode descrever rios que cortam ou dividem a terra; a alternativa lexical mais dura é mantida em nota.
