  yaml_path: translation/ot/isaiah/018/001.yaml
  text: Ah[a], land of whirring wings, which is beyond the rivers of Cush[b],
translation:
  language: pt
  text: Ah[a], terra de asas zumbidoras, que fica além dos rios de Cuxe[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ai da terra de asas zumbidoras” ou “Ah, terra de asas farfalhantes”. A expressão hebraica é difícil e pode evocar o som de asas, insetos ou algo semelhante a asas em movimento.'
    reason: lexical_alternative
  - marker: b
    text: Cuxe designa a região ao sul do Egito, frequentemente associada à Núbia ou à antiga Etiópia.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹי
  choice: Ah
  rationale: A interjeição pode introduzir lamento, ameaça ou chamado. Aqui, “Ah” mantém a força exclamativa sem antecipar uma condenação inequívoca.
- source_word: אֶרֶץ
  choice: terra
  rationale: Designa uma região geográfica, não o planeta inteiro; “terra” é natural e suficientemente abrangente.
- source_word: צִלְצַל כְּנָפָיִם
  choice: asas zumbidoras
  rationale: A expressão hebraica é difícil e sugere um som produzido por asas ou algo semelhante em movimento. A tradução preserva tanto a imagem concreta quanto a indefinição do referente.
- source_word: אֲשֶׁר מֵעֵבֶר לְנַהֲרֵי
  choice: que fica além dos rios
  rationale: Explicita de modo natural em português a localização indicada pela construção hebraica, sem alterar seu sentido espacial.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Mantém o topônimo bíblico em forma portuguesa, evitando identificá-lo diretamente com um Estado moderno.
theological_decisions:
- issue: Identificação de כּוּשׁ
  choice: Cuxe, como nome de uma região histórica
  alternative: Etiópia ou Núbia
  rationale: O texto nomeia uma região do mundo antigo. Conservar o topônimo evita impor uma equivalência geopolítica moderna mais precisa do que a evidência permite.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Asas zumbidoras” conserva a imagem e a ambiguidade sonora do hebraico; “Cuxe” segue a forma bíblica portuguesa do topônimo.
