  text: יֵעָזְב֤וּ יַחְדָּו֙ לְ/עֵ֣יט הָרִ֔ים וּֽ/לְ/בֶהֱמַ֖ת הָ/אָ֑רֶץ וְ/קָ֤ץ עָלָי/ו֙ הָ/עַ֔יִט וְ/כָל בֶּהֱמַ֥ת הָ/אָ֖רֶץ עָלָ֥י/ו תֶּחֱרָֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/006.yaml
  text: They will all be left to the birds of prey of the mountains and to the beasts of the earth[a]; and the birds of prey will summer on them[b], and every beast of the earth will winter on them.
translation:
  language: pt
  text: Todos eles serão deixados às aves de rapina das montanhas e aos animais da terra[a]. As aves de rapina passarão o verão sobre eles[b], e todos os animais da terra passarão o inverno sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “juntos”: “Eles serão deixados juntos às aves de rapina das montanhas e aos animais da terra”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega substantivos e pronome no singular (“a ave de rapina”, “sobre ele”) com sentido coletivo; a tradução usa o plural em português para maior clareza.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָזְבוּ
  choice: serão deixados
  rationale: 'O nifal imperfeito de עזב tem sentido passivo neste contexto: os mortos ficam abandonados e expostos aos animais.'
- source_word: יַחְדָּו
  choice: todos eles
  rationale: Embora o sentido básico seja “juntos”, aqui o advérbio ressalta o caráter coletivo; “todos eles” é natural em português e mantém essa força.
- source_word: לְעֵיט הָרִים
  choice: às aves de rapina das montanhas
  rationale: עַיִט designa ave de rapina ou necrófaga; o plural em português expressa naturalmente o valor coletivo do singular hebraico, enquanto “das montanhas” preserva a imagem geográfica.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: e aos animais da terra
  rationale: בְּהֵמָה pode designar animais em sentido amplo. “Animais da terra” é claro, digno e evita restringir indevidamente a expressão a uma espécie específica.
- source_word: וְקָץ
  choice: passarão o verão
  rationale: Neste contexto, קוץ significa passar a estação do verão. A locução é mais natural no português moderno do que um verbo raro como “veranear” e conserva o paralelismo sazonal.
- source_word: הָעַיִט
  choice: as aves de rapina
  rationale: O substantivo está no singular hebraico, mas tem força coletiva; o plural torna esse sentido claro em português.
- source_word: עָלָיו
  choice: sobre eles
  rationale: O sufixo pronominal singular provavelmente retoma coletivamente os mortos abandonados ou o conjunto de cadáveres; o plural comunica essa referência em português.
- source_word: תֶּחֱרָף
  choice: passarão o inverno
  rationale: O verbo חרף significa aqui passar o inverno. A formulação preserva o paralelo com “passarão o verão” e a imagem de exposição prolongada.
theological_decisions: []
