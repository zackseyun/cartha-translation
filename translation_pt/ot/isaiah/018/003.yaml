id: ISA.18.3
reference: Isaiah 18:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֥י תֵבֵ֖ל וְ/שֹׁ֣כְנֵי אָ֑רֶץ כִּ/נְשֹׂא נֵ֤ס הָרִים֙ תִּרְא֔וּ וְ/כִ/תְקֹ֥עַ שׁוֹפָ֖ר תִּשְׁמָֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/003.yaml
  text: 'All you inhabitants of the world[a], and you dwellers on the earth: when a banner is raised on the mountains, you will see it; and when a trumpet is blown[b], you will hear it.'
translation:
  language: pt
  text: 'Todos vocês, habitantes do mundo e moradores da terra: quando uma bandeira[a] for erguida sobre os montes, vocês a verão; e, quando a trombeta[b] for tocada, vocês a ouvirão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sinal” ou “estandarte”. O termo hebraico נֵס indica um sinal erguido, visível de longe.
    reason: lexical_alternative
  - marker: b
    text: Ou “chifre”, possivelmente um chifre de carneiro. O termo hebraico é שׁוֹפָר.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: Todos vocês, habitantes do mundo
  rationale: Preserva o alcance universal do chamado e explicita naturalmente em português que todos os habitantes são interpelados.
- source_word: וְשֹׁכְנֵי אָרֶץ
  choice: e moradores da terra
  rationale: Mantém o paralelismo quase sinonímico e a variação poética do hebraico sem tornar a frase artificial.
- source_word: כִּנְשֹׂא נֵס
  choice: quando uma bandeira for erguida
  rationale: Entende כִּי em sentido temporal e conserva o agente não expresso mediante uma construção passiva natural.
- source_word: נֵס
  choice: bandeira
  rationale: Designa um sinal elevado e visível de longe; “bandeira” é claro e corrente, enquanto alternativas possíveis são registradas em nota.
- source_word: הָרִים
  choice: sobre os montes
  rationale: Mantém o plural e expressa a posição elevada do sinal; “montes” oferece dicção poética digna e amplamente compreensível.
- source_word: תִּרְאוּ
  choice: vocês a verão
  rationale: Reproduz a segunda pessoa do plural com forma natural no português de ampla legibilidade brasileira; o pronome retoma a bandeira implícita como objeto.
- source_word: וְכִתְקֹעַ שׁוֹפָר
  choice: e, quando a trombeta for tocada
  rationale: Preserva o paralelismo temporal e o agente não especificado. “Trombeta” comunica claramente a função pública de sinalização.
- source_word: שׁוֹפָר
  choice: trombeta
  rationale: É uma equivalência idiomática clara no contexto, embora o instrumento hebraico seja propriamente um chifre; essa precisão é preservada em nota.
- source_word: תִּשְׁמָעוּ
  choice: vocês a ouvirão
  rationale: Mantém a segunda pessoa do plural e fornece o objeto pronominal exigido pela fluência portuguesa, retomando a trombeta tocada.
theological_decisions: []
