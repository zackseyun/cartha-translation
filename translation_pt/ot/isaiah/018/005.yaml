  rationale: 'A revisão substitui duas formulações menos adequadas: «uva em formação» torna mais transparente a referência ao fruto ainda não maduro, e «cortará» evita o tom impróprio de «decepará» para ramos. Mantêm-se a ambiguidade controlada da imagem e as notas sobre as dificuldades lexicais.'
