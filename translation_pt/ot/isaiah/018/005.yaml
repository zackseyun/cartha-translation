base_translation:
  language: en
  yaml_path: translation/ot/isaiah/018/005.yaml
  text: For before the harvest[a], when the blossom is finished and the flower becomes a ripening grape, he will cut off the shoots with pruning knives[b], and he will remove and lop off the spreading branches.
translation:
  language: pt
  text: Pois, antes da colheita, quando a floração tiver terminado e a flor se tornar uma uva em formação[a], ele cortará os brotos com facas de poda[b] e removerá e cortará os ramos que se espalham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível: «quando a flor estiver completa e se tornar uma uva verde». O hebraico descreve a passagem da flor para o fruto ainda não maduro, mas a construção exata é difícil.'
    reason: lexical_alternative
  - marker: b
    text: Os termos hebraicos para as partes da videira são raros; também podem ser traduzidos por «ramos novos», «gavinhas» ou «ramos pendentes».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação da imagem anterior; «pois» expressa de modo natural o valor causal ou explicativo da conjunção.
- source_word: לִפְנֵי קָצִיר
  choice: antes da colheita
  rationale: Reproduz diretamente a indicação temporal e mantém a cena agrícola específica.
- source_word: כְּתָם פֶּרַח
  choice: quando a floração tiver terminado
  rationale: Expressa a conclusão do estágio da florada em português natural, sem sugerir que toda a imagem chegou ao fim.
- source_word: וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה
  choice: e a flor se tornar uma uva em amadurecimento
  rationale: Comunica a passagem da flor para a uva ainda não madura, preservando a progressão agrícola do hebraico; uma nota registra a dificuldade sintática e lexical.
- source_word: וְכָרַת
  choice: ele cortará
  rationale: O perfeito profético, depois da indicação temporal, descreve a ação futura dentro da cena anunciada.
- source_word: הַזַּלְזַלִּים
  choice: os brotos
  rationale: O termo designa provavelmente brotações ou pequenos ramos vigorosos da videira; «brotos» é claro e adequado ao contexto de poda.
- source_word: בַּמַּזְמֵרוֹת
  choice: com facas de poda
  rationale: Designa instrumentos usados para podar; a expressão é concreta e evita especificar indevidamente tesouras de formato moderno.
- source_word: הַנְּטִישׁוֹת
  choice: os ramos que se espalham
  rationale: O substantivo raro parece indicar partes alongadas, pendentes ou espalhadas da videira; a tradução preserva esse sentido provável sem alegar precisão excessiva.
- source_word: הֵסִיר הֵתַז
  choice: removerá e decepará
  rationale: Mantém os dois verbos hebraicos e a intensidade da eliminação completa dos ramos.
