  text: וְ/נָשָׂ֥א נֵס֙ לַ/גּוֹיִ֔ם וְ/אָסַ֖ף נִדְחֵ֣י יִשְׂרָאֵ֑ל וּ/נְפֻצ֤וֹת יְהוּדָה֙ יְקַבֵּ֔ץ מֵ/אַרְבַּ֖ע כַּנְפ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/012.yaml
  text: He will raise a banner for the nations[a], and gather the banished of Israel[c][b]; he will assemble the scattered of Judah from the four corners of the earth.
translation:
  language: pt
  text: Ele levantará um estandarte para as nações e reunirá os desterrados[a] de Israel; ajuntará os dispersos de Judá[b] dos quatro cantos da terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “expulsos” ou “banidos”.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “dispersos” está na forma feminina plural, provavelmente em concordância com Judá entendido coletivamente; a expressão não precisa referir-se apenas a mulheres.
    reason: grammatical_note
  - marker: c
    text: Literalmente, “das quatro asas da terra”, expressão que indica seus extremos mais distantes.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  choice: levantará um estandarte
  rationale: נשא, com נֵס, descreve erguer um sinal visível para convocação. “Levantar um estandarte” preserva a imagem concreta e soa natural em português.
- source_word: לַגּוֹיִם
  choice: para as nações
  rationale: גּוֹיִם significa normalmente “nações”, e ל indica aqui os destinatários do sinal convocatório.
- source_word: וְאָסַף נִדְחֵי יִשְׂרָאֵל
  choice: e reunirá os desterrados de Israel
  rationale: אָסַף expressa reunir, enquanto נִדְחֵי designa os que foram impelidos para longe ou expulsos. “Desterrados” conserva essa força sem limitar necessariamente a referência a uma situação política específica.
- source_word: וּנְפֻצוֹת יְהוּדָה יְקַבֵּץ
  choice: ajuntará os dispersos de Judá
  rationale: קבץ significa juntar ou congregar, e נְפֻצוֹת descreve os que foram espalhados. A forma é feminina plural, mas, no contexto, refere-se coletivamente ao povo de Judá, não especificamente a mulheres.
- source_word: מֵאַרְבַּע כַּנְפוֹת הָאָרֶץ
  choice: desde os quatro cantos da terra
  rationale: כַּנְפוֹת significa literalmente “asas”, podendo designar extremidades. “Os quatro cantos da terra” é o equivalente idiomático consagrado para os confins do mundo.
theological_decisions:
- issue: Referência da forma feminina וּנְפֻצוֹת
  choice: os dispersos de Judá
  alternative: as mulheres dispersas de Judá
  rationale: Embora נְפֻצוֹת seja morfologicamente feminino plural, a construção refere-se de modo coletivo aos dispersos pertencentes a Judá. Traduzir “mulheres” introduziria uma restrição semântica que o contexto não sustenta; a particularidade gramatical fica documentada em nota.
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país
  rationale: A menção às nações e aos quatro extremos favorece o alcance mundial de “terra”, embora הָאָרֶץ também possa significar “país” em outros contextos.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A alternância entre “reunirá” e “ajuntará” reflete os dois verbos hebraicos próximos sem criar uma distinção teológica indevida.
