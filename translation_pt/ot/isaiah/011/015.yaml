source:
  edition: WLC
  text: וְ/הֶחֱרִ֣ים יְהוָ֗ה אֵ֚ת לְשׁ֣וֹן יָם מִצְרַ֔יִם וְ/הֵנִ֥יף יָד֛/וֹ עַל הַ/נָּהָ֖ר בַּ/עְיָ֣ם רוּח֑/וֹ וְ/הִכָּ֨/הוּ֙ לְ/שִׁבְעָ֣ה נְחָלִ֔ים וְ/הִדְרִ֖יךְ בַּ/נְּעָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/015.yaml
  text: And Yahweh will utterly destroy the tongue of the sea of Egypt[a], and he will wave his hand over the River with the scorching of his wind; he will strike it into seven streams[c][b], and make people walk through in sandals.
translation:
  language: pt
  text: Yahweh destruirá por completo a língua do mar do Egito[a]. Agitará a mão sobre o Rio[b] com o calor abrasador do seu vento[c]; golpeará o Rio, transformando-o em sete riachos, e fará as pessoas atravessá-lo de sandálias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o golfo do Egito”; literalmente, “a língua do mar do Egito”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o rio Eufrates.
    reason: cross_reference
  - marker: c
    text: 'A expressão hebraica é rara. Outra tradução possível é: “com a força do seu sopro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִים
  choice: destruirá por completo
  rationale: O hifil de חרם expressa a entrega à destruição ou eliminação total. No contexto geográfico, a formulação comunica a remoção decisiva desse obstáculo sem substituir o verbo pela interpretação contextual “secará”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְשׁוֹן יָם מִצְרַיִם
  choice: a língua do mar do Egito
  rationale: Preserva a imagem concreta de לשון, que também pode designar uma faixa de água ou um golfo; a alternativa geográfica aparece em nota.
- source_word: וְהֵנִיף יָדוֹ
  choice: Agitará a mão
  rationale: Mantém o gesto profético de poder divino sobre as águas em linguagem portuguesa natural.
- source_word: הַנָּהָר
  choice: o Rio
  rationale: O hebraico emprega o substantivo definido sem nomeá-lo. A tradução conserva essa forma, enquanto a nota identifica a referência geográfica provável.
- source_word: בַּעְיָם רוּחוֹ
  choice: com o calor abrasador do seu vento
  rationale: בַּעְיָם é raro e provavelmente indica calor ardente; רוּחַ pode significar vento, sopro ou espírito. O contexto aquático favorece “vento”, sem ocultar a incerteza lexical, registrada em nota.
- source_word: וְהִכָּהוּ לְשִׁבְעָה נְחָלִים
  choice: golpeará o Rio, transformando-o em sete riachos
  rationale: 'Conserva tanto a ação de golpear quanto o resultado expresso por לְ: o rio passa a sete cursos de água. “Riachos” é claro e acessível para נְחָלִים neste contexto.'
- source_word: וְהִדְרִיךְ בַּנְּעָלִים
  choice: fará que as pessoas o atravessem de sandálias
  rationale: O hifil indica fazer caminhar ou atravessar. Como o hebraico não declara o objeto humano, “as pessoas” explicita apenas o participante implícito e “de sandálias” ressalta a facilidade da passagem.
theological_decisions:
- issue: Natureza da imagem da derrota do mar do Egito e do Rio
  choice: Apresentar uma ação divina sobre águas geográficas concretas por meio de elevada linguagem profética.
  alternative: Interpretar toda a cena apenas como símbolo político ou exclusivamente como tipologia do êxodo.
  rationale: O texto evoca a libertação do êxodo, mas a tradução deve preservar as imagens concretas e deixar sua significação teológica aberta à interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A imagem literal “língua do mar” e o título geográfico “o Rio” foram preservados no texto, com esclarecimentos em notas. A sintaxe foi levemente explicitada para tornar natural em português o objeto humano implícito de וְהִדְרִיךְ.
