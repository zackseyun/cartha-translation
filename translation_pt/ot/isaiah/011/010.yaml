id: ISA.11.10
reference: Isaiah 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא שֹׁ֣רֶשׁ יִשַׁ֗י אֲשֶׁ֤ר עֹמֵד֙ לְ/נֵ֣ס עַמִּ֔ים אֵלָ֖י/ו גּוֹיִ֣ם יִדְרֹ֑שׁוּ וְ/הָיְתָ֥ה מְנֻחָת֖/וֹ כָּבֽוֹד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/010.yaml
  text: And in that day the root of Jesse, who stands as a banner for the peoples—to him the nations will seek, and his resting place will be glory.
translation:
  language: pt
  text: Naquele dia, a raiz de Jessé estará erguida como estandarte para os povos; as nações a buscarão, e seu lugar de descanso será glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e seu lugar de descanso será glorioso”.'
    reason: Registra a tradução adjetival natural de כָּבוֹד, embora o texto hebraico empregue o substantivo 'glória'.
lexical_decisions:
- source_word: שֹׁרֶשׁ יִשַׁי
  choice: a raiz de Jessé
  rationale: Preserva a metáfora hebraica e sua ligação literária com o broto e a raiz de Isaías 11:1.
- source_word: עֹמֵד לְנֵס עַמִּים
  choice: estará erguida como estandarte para os povos
  rationale: Expressa o particípio עֹמֵד em construção futura no contexto de בַּיּוֹם הַהוּא e traduz נֵס como um sinal elevado e visível que reúne os povos.
- source_word: אֵלָיו גּוֹיִם יִדְרֹשׁוּ
  choice: as nações a buscarão
  rationale: יִדְרֹשׁוּ denota procurar, buscar ou consultar. O pronome português retoma 'raiz', gramaticalmente feminina, sem alterar o referente pessoal da imagem.
- source_word: מְנֻחָתוֹ
  choice: seu lugar de descanso
  rationale: O substantivo pode designar descanso ou local de repouso; 'lugar de descanso' comunica naturalmente o sentido locativo provável.
- source_word: כָּבוֹד
  choice: glória
  rationale: Mantém a construção nominal marcada do hebraico, em vez de suavizá-la para o adjetivo 'glorioso'.
theological_decisions:
- issue: Identidade da 'raiz de Jessé'
  choice: Manter a designação metafórica sem inserir 'Messias' ou outro título interpretativo.
  alternative: Explicitar 'o Messias, a raiz de Jessé'.
  rationale: O versículo apresenta a figura por meio da metáfora e do contexto davídico; a tradução não deve transformar a interpretação teológica em explicitação textual.
- issue: Sentido de כָּבוֹד na oração final
  choice: Traduzir predicativamente como 'será glória'.
  alternative: Traduzir 'será glorioso'.
  rationale: A forma nominal hebraica cria uma formulação forte e possivelmente aberta quanto à relação entre o repouso e a glória; preservá-la evita resolver essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem foi levemente ajustada à sintaxe portuguesa, preservando as metáforas centrais e a formulação nominal final.
