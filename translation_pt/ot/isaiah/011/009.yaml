  text: לֹֽא יָרֵ֥עוּ וְ/לֹֽא יַשְׁחִ֖יתוּ בְּ/כָל הַ֣ר קָדְשִׁ֑/י כִּֽי מָלְאָ֣ה הָ/אָ֗רֶץ דֵּעָה֙ אֶת יְהוָ֔ה כַּ/מַּ֖יִם לַ/יָּ֥ם מְכַסִּֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/009.yaml
  text: They will not do harm or bring destruction on all my holy mountain[a], for the earth will be full of the knowledge of Yahweh as the waters cover the sea.
translation:
  language: pt
  text: Não farão mal nem causarão destruição em todo o meu santo monte, pois a terra[a] ficará cheia do conhecimento de Yahweh, assim como as águas cobrem o mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o país ficará cheio do conhecimento de Yahweh”.'
    reason: 'Alternativa lexical: הָאָרֶץ pode designar tanto a terra em sentido amplo quanto uma terra ou país específico.'
lexical_decisions:
- source_word: יָרֵעוּ
  choice: farão mal
  rationale: Expressa de modo natural o sentido causativo de provocar mal ou dano e se ajusta ao contexto de paz.
- source_word: יַשְׁחִיתוּ
  choice: causarão destruição
  rationale: Preserva a força causativa do hifil e forma um paralelo claro com “farão mal”.
- source_word: בְּכָל הַר קָדְשִׁי
  choice: em todo o meu santo monte
  rationale: “Em” traduz naturalmente o valor locativo de ב em português, enquanto “todo” mantém כָל.
- source_word: מָלְאָה
  choice: ficará cheia
  rationale: O perfeito hebraico é entendido com valor futuro no discurso profético; esta formulação comunica um estado futuro sem sugerir que já esteja plenamente realizado.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém o sentido amplo favorecido pela imagem expansiva do contexto, sem ocultar a alternativa lexical “a terra do país/o país” indicada em nota.
- source_word: דֵּעָה אֶת יְהוָה
  choice: o conhecimento de Yahweh
  rationale: Indica conhecimento dirigido à pessoa de Yahweh, e não apenas informação a respeito dele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כַּמַּיִם לַיָּם מְכַסִּים
  choice: assim como as águas cobrem o mar
  rationale: Conserva a comparação, o plural “águas” e a imagem concreta do hebraico em português corrente.
theological_decisions:
- issue: Alcance do oráculo de paz
  choice: alcance universal sugerido por “a terra”
  alternative: alcance localizado, traduzindo הָאָרֶץ como “o país” ou “a terra” no sentido territorial
  rationale: A imagem abrangente da terra cheia do conhecimento de Yahweh favorece o sentido universal, mas a polissemia do termo hebraico é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém o paralelismo hebraico, o futuro profético e a imagem tradicional das águas cobrindo o mar.
