  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יוֹסִ֨יף אֲדֹנָ֤/י שֵׁנִית֙ יָד֔/וֹ לִ/קְנ֖וֹת אֶת שְׁאָ֣ר עַמּ֑/וֹ אֲשֶׁ֣ר יִשָּׁאֵר֩ מֵ/אַשּׁ֨וּר וּ/מִ/מִּצְרַ֜יִם וּ/מִ/פַּתְר֣וֹס וּ/מִ/כּ֗וּשׁ וּ/מֵ/עֵילָ֤ם וּ/מִ/שִּׁנְעָר֙ וּ/מֵ֣/חֲמָ֔ת וּ/מֵ/אִיֵּ֖י הַ/יָּֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/011.yaml
  text: And in that day the Lord will again extend his hand[a], a second time, to recover the remnant of his people who remain, from Assyria, from Egypt, from Pathros, from Cush, from Elam, from Shinar, from Hamath[c][b], and from the coastlands of the sea.
translation:
  language: pt
  text: E naquele dia o Senhor tornará a estender a mão, pela segunda vez, para recuperar o remanescente do seu povo que restar da Assíria, do Egito, de Patros, de Cuxe[c], de Elão, de Sinear, de Hamate e das terras costeiras do mar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para adquirir”. O verbo hebraico significa literalmente “adquirir” ou “obter”; neste contexto, muitas traduções entendem que se trata de recuperar ou reunir novamente o povo disperso.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “das ilhas do mar”. A expressão hebraica pode abranger tanto ilhas como regiões costeiras marítimas.'
    reason: lexical_alternative
  - marker: c
    text: Cuxe é um antigo nome geográfico geralmente associado a regiões ao sul do Egito; algumas traduções trazem “Etiópia”.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: E naquele dia
  rationale: Reproduz de modo natural a fórmula temporal profética, sem a rigidez de “e acontecerá naquele dia”.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino אֲדֹנָי; não se trata aqui do Tetragrama.
- source_word: יוֹסִיף ... יָדוֹ שֵׁנִית
  choice: tornará a estender a mão, pela segunda vez
  rationale: Preserva a imagem antropomórfica da mão e representa tanto a repetição expressa por יוֹסִיף quanto o valor ordinal de שֵׁנִית.
- source_word: לִקְנוֹת
  choice: para recuperar
  rationale: Embora o núcleo lexical seja “adquirir/obter”, neste contexto a ação recai sobre o remanescente anteriormente disperso; “recuperar” comunica naturalmente a ideia contextual de retomá-lo, sem acrescentar o peso teológico específico de “redimir”.
- source_word: שְׁאָר עַמּוֹ אֲשֶׁר יִשָּׁאֵר
  choice: o remanescente do seu povo que restar
  rationale: Mantém a repetição etimológica entre “remanescente” e “restar”, importante na formulação hebraica.
- source_word: פַּתְרוֹס / כּוּשׁ / עֵילָם / שִׁנְעָר / חֲמָת
  choice: Patros / Cuxe / Elão / Sinear / Hamate
  rationale: Emprega formas portuguesas reconhecíveis ou transliterações usuais dos topônimos antigos, evitando identificações modernas imprecisas.
- source_word: אִיֵּי הַיָּם
  choice: terras costeiras do mar
  rationale: A expressão pode designar ilhas ou regiões litorâneas; “terras costeiras” funciona bem no contexto geográfico amplo, com a alternativa preservada em nota.
theological_decisions:
- issue: Sentido contextual de לִקְנוֹת
  choice: recuperar
  alternative: adquirir; obter; redimir
  rationale: “Recuperar” expressa a reunião do povo disperso no contexto. “Adquirir” é lexicalmente mais direto, mas menos natural aqui; “redimir” introduziria uma conotação teológica que o verbo, por si só, não exige.
- issue: Preservação da imagem da mão divina
  choice: tornará a estender a mão, pela segunda vez
  alternative: recuperará pela segunda vez
  rationale: A redação conserva a metáfora explícita da atuação poderosa e deliberada do Senhor, sem reduzi-la apenas ao resultado.
- issue: Identificação de Cuxe
  choice: Cuxe
  alternative: Etiópia
  rationale: Mantém o antigo topônimo hebraico e evita equipará-lo sem ressalvas ao país moderno.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe profética e a imagem da mão foram preservadas; os topônimos seguem formas portuguesas tradicionais. As notas registram ambiguidades lexicais e geográficas sem sobrecarregar o versículo.
