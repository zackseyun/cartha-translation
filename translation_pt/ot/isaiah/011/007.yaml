  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/פָרָ֤ה וָ/דֹב֙ תִּרְעֶ֔ינָה יַחְדָּ֖ו יִרְבְּצ֣וּ יַלְדֵי/הֶ֑ן וְ/אַרְיֵ֖ה כַּ/בָּקָ֥ר יֹֽאכַל תֶּֽבֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/007.yaml
  text: The cow and the bear will graze[a]; together their young will lie down, and the lion, like the ox[b], will eat straw.
translation:
  language: pt
  text: A vaca e a ursa pastarão[a]; suas crias se deitarão juntas, e o leão comerá palha como o boi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se alimentarão”. O verbo hebraico pode ter o sentido mais geral de alimentar-se, embora “pastarão” preserve bem a imagem dos animais.
    reason: lexical_alternative
  - marker: b
    text: Ou “como o gado”. O termo hebraico בָּקָר pode referir-se coletivamente ao gado bovino, além de admitir aqui a comparação com um bovino individual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרָה
  choice: a vaca
  rationale: פָרָה designa uma vaca ou novilha; “vaca” é a correspondência singular mais natural e mantém o paralelismo entre os animais.
- source_word: וָדֹב
  choice: e a ursa
  rationale: דֹב significa “urso”; o verbo hebraico está no feminino plural, e “ursa” harmoniza com a vaca e com a referência posterior às crias de ambas.
- source_word: תִּרְעֶינָה
  choice: pastarão
  rationale: O Qal de רעה descreve aqui a alimentação de animais. “Pastarão” preserva a imagem concreta e surpreendente de vaca e ursa alimentando-se em paz.
- source_word: יַחְדָּו
  choice: juntas
  rationale: O advérbio significa “juntas”. O feminino concorda naturalmente com “suas crias”, seu referente na oração.
- source_word: יִרְבְּצוּ
  choice: se deitarão
  rationale: רבץ é usado com frequência para animais que se deitam ou repousam; “se deitarão” é claro e preserva a ação concreta.
- source_word: יַלְדֵיהֶן
  choice: suas crias
  rationale: Literalmente, “seus filhos/filhotes”; tratando-se de animais, “suas crias” é natural e mantém o sufixo feminino plural, isto é, as crias da vaca e da ursa.
- source_word: וְאַרְיֵה
  choice: e o leão
  rationale: Correspondência direta e corrente de אַרְיֵה.
- source_word: כַּבָּקָר
  choice: como o boi
  rationale: בָּקָר pode designar coletivamente o gado bovino; “como o boi” oferece em português uma comparação individual clara com “o leão”, sem eliminar a alternativa coletiva.
- source_word: יֹאכַל
  choice: comerá
  rationale: O imperfeito integra a descrição profética e é expresso naturalmente pelo futuro em português.
- source_word: תֶּבֶן
  choice: palha
  rationale: תֶּבֶן designa palha ou restolho empregado como alimento; “palha” é a equivalência corrente e adequada à imagem.
theological_decisions:
- issue: Natureza da imagem de paz entre os animais
  choice: Apresentar concretamente a criação reconciliada, sem determinar se o cumprimento é literal, simbólico ou reúne ambos os aspectos.
  alternative: Interpretar a cena como exclusivamente simbólica da paz humana e política, ou como descrição estritamente literal de uma transformação zoológica.
  rationale: O hebraico oferece uma cena animal vívida, mas o versículo não define seu modo de cumprimento. A tradução conserva essa tensão e evita inserir uma conclusão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem das orações segue o hebraico; o ponto e vírgula deixa claro que “juntas” introduz a ação das crias, não modifica necessariamente “pastarão”.
