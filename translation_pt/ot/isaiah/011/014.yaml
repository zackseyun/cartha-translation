id: ISA.11.14
reference: Isaiah 11:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עָפ֨וּ בְ/כָתֵ֤ף פְּלִשְׁתִּים֙ יָ֔מָּ/ה יַחְדָּ֖ו יָבֹ֣זּוּ אֶת בְּנֵי קֶ֑דֶם אֱד֤וֹם וּ/מוֹאָב֙ מִשְׁל֣וֹח יָדָ֔/ם וּ/בְנֵ֥י עַמּ֖וֹן מִשְׁמַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/014.yaml
  text: They will swoop down on the shoulder of the Philistines to the west[a]; together they will plunder the sons of the east. Edom and Moab will be the putting forth of their hand[d][c][b], and the sons of Ammon will obey them.
translation:
  language: pt
  text: Eles se lançarão sobre o flanco dos filisteus, a oeste[a]; juntos saquearão os povos do Oriente[b]. Edom e Moabe ficarão sob o domínio deles[c], e os amonitas lhes obedecerão[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sobre o ombro dos filisteus, em direção ao mar”. “Ombro” pode significar flanco, encosta ou região lateral, e “mar” indica o oeste.'
    reason: cultural_note
  - marker: b
    text: Literalmente, “os filhos do Oriente”; isto é, os povos orientais.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Edom e Moabe serão o estender da mão deles”. A expressão pode significar que estarão sob o poder deles ou que eles estenderão a mão contra Edom e Moabe.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “os amonitas estarão sujeitos a eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָפוּ
  choice: Eles se lançarão
  rationale: O verbo significa literalmente “voar”, mas, neste contexto militar, descreve um ataque rápido. “Se lançarão” comunica o movimento impetuoso sem tornar opaca a imagem.
- source_word: בְכָתֵף פְּלִשְׁתִּים
  choice: sobre o flanco dos filisteus
  rationale: כָּתֵף significa literalmente “ombro” e pode designar lado, encosta ou flanco. “Flanco” preserva a metáfora corporal e expressa com clareza o sentido geográfico ou militar.
- source_word: יָמָּה
  choice: a oeste
  rationale: O advérbio direcional, formado a partir de “mar”, normalmente indica a direção oeste na geografia bíblica.
- source_word: יַחְדָּו
  choice: juntos
  rationale: Expressa a ação conjunta dos grupos mencionados no contexto.
- source_word: יָבֹזּוּ
  choice: saquearão
  rationale: בזז é um verbo militar que significa tomar despojos ou saquear; a escolha mantém a força da imagem de conquista.
- source_word: בְּנֵי קֶדֶם
  choice: os povos do Oriente
  rationale: Literalmente, “os filhos do Oriente”; a expressão hebraica funciona como designação idiomática dos povos orientais.
- source_word: מִשְׁלוֹחַ יָדָם
  choice: ficarão sob o domínio deles
  rationale: A construção nominal comprimida significa literalmente algo como “o estender da mão deles” e indica alcance de poder, ataque ou controle. A formulação portuguesa transmite esse sentido sem fingir uma precisão ausente do hebraico.
- source_word: וּבְנֵי עַמּוֹן
  choice: os amonitas
  rationale: Equivalente português natural da expressão literal “os filhos de Amom”.
- source_word: מִשְׁמַעְתָּם
  choice: lhes obedecerão
  rationale: O substantivo derivado de שׁמע denota obediência ou sujeição à autoridade; a forma verbal é clara e idiomática em português.
theological_decisions:
- issue: Se a linguagem de conquista deve ser suavizada como mera influência política
  choice: Manter a linguagem explícita de ataque, saque, domínio e obediência
  alternative: Expressar apenas influência ou preeminência política
  rationale: O hebraico emprega imagens fortes de ataque, pilhagem e sujeição. O contexto profético não justifica atenuar essa linguagem.
- issue: Grau de precisão atribuído a מִשְׁלוֹחַ יָדָם
  choice: Traduzir pelo sentido geral de domínio e registrar a imagem literal em nota
  alternative: Escolher de modo exclusivo “atacarão Edom e Moabe” ou “estenderão a mão sobre Edom e Moabe”
  rationale: A construção hebraica é condensada e pode indicar exercício de poder, controle ou ataque. A tradução preserva a tensão sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação evita literalismos opacos no corpo do texto, enquanto as notas preservam as metáforas e ambiguidades relevantes do hebraico.
