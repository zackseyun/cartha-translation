source:
  edition: WLC
  text: וְ/שָׁפַ֤ט בְּ/צֶ֨דֶק֙ דַּלִּ֔ים וְ/הוֹכִ֥יחַ בְּ/מִישׁ֖וֹר לְ/עַנְוֵי אָ֑רֶץ וְ/הִֽכָּה אֶ֨רֶץ֙ בְּ/שֵׁ֣בֶט פִּ֔י/ו וּ/בְ/ר֥וּחַ שְׂפָתָ֖י/ו יָמִ֥ית רָשָֽׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/004.yaml
  text: but he will judge the poor with righteousness[a], and decide with equity for the humble of the earth; he will strike the earth with the rod of his mouth[e][d][c][b], and with the breath of his lips he will put the wicked to death.
translation:
  language: pt
  text: Mas julgará os pobres com justiça[a] e decidirá com equidade em favor dos humildes da terra[b]. Ferirá a terra[c] com a vara de sua boca e, com o sopro de seus lábios, fará morrer o perverso[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A conjunção também pode ser traduzida por “e”: “E julgará”. “Mas” ressalta o contraste com o versículo anterior. “Com justiça” também pode ser traduzido por “com retidão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em favor dos mansos [ou aflitos] do país”.'
    reason: lexical_alternative
  - marker: c
    text: “Terra” também pode ser traduzido por “país” ou “território”.
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “matará o perverso”. O singular hebraico pode designar genericamente os perversos ou referir-se a uma figura individual.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁפַט
  choice: Mas julgará
  rationale: O verbo mantém seu sentido judicial e régio. “Mas” explicita o contraste contextual com o versículo anterior, embora a conjunção hebraica também possa ser simplesmente “e”.
- source_word: בְּצֶדֶק
  choice: com justiça
  rationale: צֶדֶק reúne as ideias de justiça e retidão. “Com justiça” é natural em português e preserva a dimensão moral e judicial.
- source_word: דַּלִּים
  choice: os pobres
  rationale: דַּלִּים designa pessoas pobres, fracas ou socialmente vulneráveis. “Os pobres” é claro e adequado ao contexto de julgamento justo.
- source_word: וְהוֹכִיחַ
  choice: e decidirá
  rationale: No Hifil e em contexto judicial, o verbo pode indicar decidir uma causa, arbitrar ou dar uma sentença, não apenas repreender.
- source_word: בְּמִישׁוֹר
  choice: com equidade
  rationale: מִישׁוֹר evoca retidão, nivelamento e imparcialidade; “com equidade” comunica bem o sentido judicial.
- source_word: לְעַנְוֵי אָרֶץ
  choice: em favor dos humildes da terra
  rationale: עָנָו pode indicar humilde, manso ou aflito. “Humildes” preserva a amplitude ético-social, e a preposição é expressa naturalmente por “em favor de”.
- source_word: וְהִכָּה אֶרֶץ
  choice: Ferirá a terra
  rationale: נכה significa golpear ou ferir. “Ferirá” mantém a força da imagem, enquanto אֶרֶץ é vertido como “terra” sem excluir lexicalmente o sentido de território.
- source_word: בְּשֵׁבֶט פִּיו
  choice: com a vara de sua boca
  rationale: שֵׁבֶט pode ser vara, bastão ou cetro. “Vara” conserva a metáfora da palavra régia como instrumento de julgamento.
- source_word: וּבְרוּחַ שְׂפָתָיו
  choice: e, com o sopro de seus lábios
  rationale: רוּחַ pode significar sopro, vento ou espírito. No paralelismo entre boca e lábios, “sopro” é o sentido concreto mais imediato.
- source_word: יָמִית רָשָׁע
  choice: fará morrer o perverso
  rationale: O Hifil de מות significa causar a morte. “Fará morrer” reflete essa forma causativa, e “o perverso” permite uma leitura genérica do singular sem eliminar a possibilidade de referência individual.
theological_decisions:
- issue: Alcance de אֶרֶץ
  choice: terra
  alternative: país ou território
  rationale: “Terra” é um sentido lexical legítimo e se harmoniza com o horizonte amplo da passagem messiânica. Uma leitura territorial continua possível e é registrada em nota.
- issue: Valor do singular רָשָׁע
  choice: o perverso, entendido possivelmente de modo genérico ou representativo
  alternative: o perverso como indivíduo específico
  rationale: O singular hebraico pode representar toda uma categoria, mas também admite individualização. A tradução mantém o singular e a nota preserva as duas possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o paralelismo poético hebraico; termos judiciais correntes evitam linguagem excessivamente técnica, e as notas preservam ambiguidades lexicais e teológicas reais.
