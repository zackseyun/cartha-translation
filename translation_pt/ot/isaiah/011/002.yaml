  terminology: “Espírito de Yahweh” mantém de modo consistente o nome divino adotado pelo projeto. “Temor de Yahweh” preserva a força da expressão יִרְאַת יְהוָה sem reduzi-la a medo servil; a nota oferece de forma apropriada “reverência” como alternativa explicativa. A capitalização inicial de “Espírito” e as minúsculas nas expressões subsequentes comunicam naturalmente a leitura descritiva sem impor uma sistematização teológica.
