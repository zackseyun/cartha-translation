id: ISA.11.2
reference: Isaiah 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָחָ֥ה עָלָ֖י/ו ר֣וּחַ יְהוָ֑ה ר֧וּחַ חָכְמָ֣ה וּ/בִינָ֗ה ר֤וּחַ עֵצָה֙ וּ/גְבוּרָ֔ה ר֥וּחַ דַּ֖עַת וְ/יִרְאַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/002.yaml
  text: 'And the Spirit of Yahweh will rest on him: a spirit of wisdom and understanding[a], a spirit of counsel and might[c][b], a spirit of knowledge and the fear of Yahweh.'
translation:
  language: pt
  text: 'E o Espírito de Yahweh repousará sobre ele: espírito de sabedoria e entendimento[a], espírito de conselho e poder, espírito de conhecimento e temor de Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Depois de “o Espírito de Yahweh”, o hebraico repete “espírito” três vezes, destacando as qualidades ou atuações desse Espírito: sabedoria e entendimento, conselho e poder, conhecimento e temor de Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: Ou “reverência por Yahweh”. A expressão hebraica inclui reverência e profundo assombro, não apenas terror.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחָה
  choice: repousará
  rationale: O verbo נוח expressa pousar ou vir a repousar, com possível ideia de permanência. O futuro se ajusta ao contexto profético, e “repousará” mantém o tom poético e a presença duradoura.
- source_word: עָלָיו
  choice: sobre ele
  rationale: Tradução direta e natural da preposição עַל com sufixo pronominal.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: No contexto da capacitação do rei ideal, רוּחַ se refere ao Espírito de Deus. A inicial maiúscula sinaliza o referente divino, e Yahweh translitera o nome pessoal יהוה.
- source_word: רוּחַ חָכְמָה וּבִינָה
  choice: espírito de sabedoria e entendimento
  rationale: A repetição de רוּחַ foi preservada como expressão apositiva que descreve qualidades ou atuações do Espírito de Yahweh, sem impor a ideia de espíritos distintos.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e adequado para a sabedoria prática e piedosa neste contexto.
- source_word: בִינָה
  choice: entendimento
  rationale: Reproduz o sentido de compreensão ou discernimento e forma uma associação natural com “sabedoria”.
- source_word: רוּחַ עֵצָה וּגְבוּרָה
  choice: espírito de conselho e poder
  rationale: “Conselho” convém ao contexto régio de decisão e governo. “Poder” comunica de modo claro e digno a força ou capacidade expressa por גְבוּרָה.
- source_word: עֵצָה
  choice: conselho
  rationale: Aqui indica capacidade de formular orientação e decisões sábias, não mero conselho informal.
- source_word: גְבוּרָה
  choice: poder
  rationale: O termo pode significar força, poder ou valentia. “Poder” é claro no português moderno e combina com a capacitação régia em vista.
- source_word: רוּחַ דַּעַת וְיִרְאַת יְהוָה
  choice: espírito de conhecimento e temor de Yahweh
  rationale: “Conhecimento” traduz diretamente דַּעַת. “Temor de Yahweh” preserva a força e a amplitude da expressão hebraica, que inclui reverência profunda sem se limitar a ela.
theological_decisions:
- issue: Se as repetições de רוּחַ indicam vários espíritos ou aspectos descritivos do único Espírito de Yahweh
  choice: Manter as expressões como aposições descritivas do Espírito de Yahweh
  alternative: Entendê-las como enumeração de dons espirituais distintos ou como uma estrutura de sete espíritos
  rationale: A sintaxe apresenta “o Espírito de Yahweh” seguido de três expressões repetidas que caracterizam sua atuação. A tradução conserva a repetição hebraica sem resolver além do texto como a lista deve ser sistematizada.
- issue: Sentido de יִרְאַת יְהוָה
  choice: temor de Yahweh
  alternative: reverência por Yahweh
  rationale: “Temor” conserva a força lexical e a tensão própria da expressão bíblica; a nota esclarece que ela inclui reverência e assombro, não apenas terror.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura paralela e a repetição poética do hebraico foram preservadas; empregou-se “Yahweh” para o nome divino.
