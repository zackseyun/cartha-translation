source:
  edition: WLC
  text: וְ/הָיְתָ֣ה מְסִלָּ֔ה לִ/שְׁאָ֣ר עַמּ֔/וֹ אֲשֶׁ֥ר יִשָּׁאֵ֖ר מֵֽ/אַשּׁ֑וּר כַּ/אֲשֶׁ֤ר הָֽיְתָה֙ לְ/יִשְׂרָאֵ֔ל בְּ/י֥וֹם עֲלֹת֖/וֹ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/016.yaml
  text: And there will be a highway for the remnant of his people that remains from Assyria[b][a], as there was for Israel in the day of his coming up from the land of Egypt.
translation:
  language: pt
  text: E haverá uma estrada para o remanescente do seu povo que restar da Assíria[a], como houve para Israel no dia em que subiu da terra do Egito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tiver sobrado da Assíria”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão evoca a saída de Israel do Egito.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיְתָה
  choice: E haverá
  rationale: O waw seguido do qatal de היה expressa aqui um resultado futuro no discurso profético; “haverá” é natural e mantém o sentido preditivo.
- source_word: מְסִלָּה
  choice: uma estrada
  rationale: O termo designa uma via preparada ou elevada. “Estrada” comunica com clareza a imagem de uma rota providenciada para o retorno, sem sugerir necessariamente uma rodovia moderna.
- source_word: לִשְׁאָר עַמּוֹ
  choice: para o remanescente do seu povo
  rationale: “Remanescente” preserva o termo-chave de Isaías para a parcela sobrevivente do povo; “seu” mantém sem explicitação indevida a referência contextual do pronome.
- source_word: אֲשֶׁר יִשָּׁאֵר
  choice: que restar
  rationale: A forma verbal singular concorda com o coletivo singular “remanescente”; a expressão portuguesa conserva essa construção e o sentido de sobrevivência.
- source_word: מֵאַשּׁוּר
  choice: da Assíria
  rationale: A preposição מן indica procedência ou separação. A tradução concisa preserva a possibilidade de entender os sobreviventes como os que retornam ou ficam livres da Assíria.
- source_word: כַּאֲשֶׁר הָיְתָה
  choice: como houve
  rationale: Introduz a comparação com o êxodo e retoma elipticamente a estrada mencionada antes.
- source_word: לְיִשְׂרָאֵל
  choice: para Israel
  rationale: Mantém o nome coletivo do povo da aliança e corresponde diretamente ao hebraico.
- source_word: בְּיוֹם עֲלֹתוֹ
  choice: no dia em que subiu
  rationale: Expressa em português natural o infinitivo construto com sufixo, preservando tanto a referência temporal quanto o idioma bíblico de subir do Egito.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: da terra do Egito
  rationale: Mantém a fórmula plena ligada ao êxodo e sua ressonância literária.
theological_decisions:
- issue: Referência do possessivo em “seu povo”
  choice: Manter “seu povo” sem identificar expressamente o referente.
  alternative: “o povo do SENHOR” ou “o povo do Messias”
  rationale: O hebraico traz apenas o sufixo possessivo, cuja referência depende do contexto. Nomear o referente resolveria uma tensão que o versículo não explicita.
- issue: Tipologia do êxodo
  choice: Apresentar a comparação histórica com a saída de Israel do Egito.
  alternative: Explicitar “um novo êxodo” ou “um segundo êxodo”.
  rationale: O texto evoca claramente o padrão do êxodo, mas não lhe dá esse rótulo interpretativo; a tradução mantém a alusão sem acrescentar terminologia doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção singular “o remanescente... que restar” acompanha o coletivo hebraico. “Estrada” evita a associação excessivamente moderna de “rodovia”, sem perder a imagem de uma rota preparada.
