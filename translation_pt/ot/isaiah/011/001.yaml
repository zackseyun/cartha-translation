  naturalness: 'A redação é fluente, digna e facilmente compreensível no português brasileiro e internacional: “Então sairá um broto ... e um ramo ... dará fruto.” “Das raízes dele” é um pouco mais explícito e menos elegante que “de suas raízes”, mas é natural e justificado pela preservação deliberada do sufixo masculino.'
