source:
  edition: WLC
  text: וְ/יָצָ֥א חֹ֖טֶר מִ/גֵּ֣זַע יִשָׁ֑י וְ/נֵ֖צֶר מִ/שָּׁרָשָׁ֥י/ו יִפְרֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/001.yaml
  text: Then a shoot will come out from the stump of Jesse[d][c][b][a], and a branch from his roots will bear fruit.
translation:
  language: pt
  text: Então[a] sairá um broto[b] do tronco cortado de Jessé, e um ramo[c] das raízes dele[d] dará fruto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E sairá”. A conjunção hebraica pode ser traduzida simplesmente por “e”; “então” destaca a passagem do juízo anterior para a esperança renovada.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “rebento”, “vara” ou “raminho”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “renovo” ou “rebento”. A imagem tem ressonância messiânica, mas o texto principal conserva seu sentido botânico comum.'
    reason: lexical_alternative
  - marker: d
    text: 'Hebraico: “das raízes dele”. O sufixo é masculino singular e remete a Jessé dentro da metáfora; algumas traduções ajustam a imagem para “das raízes do tronco”.'
    reason: source_form
lexical_decisions:
- source_word: וְיָצָא
  choice: Então sairá
  rationale: יָצָא significa “sair”. “Então” expressa a passagem do juízo anterior para a esperança renovada, enquanto o futuro “sairá” preserva o movimento da imagem; a conjunção também pode ser traduzida simplesmente por “e”.
- source_word: חֹטֶר
  choice: broto
  rationale: חֹטֶר designa um rebento, broto ou pequeno ramo que surge de um tronco. “Broto” comunica com clareza a metáfora botânica em português atual.
- source_word: מִגֵּזַע
  choice: do tronco cortado
  rationale: גֵּזַע pode indicar o tronco remanescente, ou toco, de uma árvore derrubada. “Tronco cortado” torna explícita e compreensível a imagem de vida que nasce depois do corte, sem abandonar o sentido concreto.
- source_word: יִשָׁי
  choice: Jessé
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: וְנֵצֶר
  choice: e um ramo
  rationale: נֵצֶר designa um rebento, renovo ou ramo novo. “Ramo” mantém o paralelismo botânico e distingue o termo de חֹטֶר, traduzido por “broto”.
- source_word: מִשָּׁרָשָׁיו
  choice: das raízes dele
  rationale: O hebraico traz “raízes” com sufixo masculino singular. “Dele” preserva essa referência masculina e mantém a ligação com Jessé dentro da metáfora da árvore.
- source_word: יִפְרֶה
  choice: dará fruto
  rationale: פָּרָה significa ser fecundo ou produzir fruto. “Dará fruto” completa naturalmente a imagem vegetal e conserva a ideia de vitalidade produtiva.
theological_decisions:
- issue: Ressonância messiânica da imagem vegetal
  choice: Manter no texto principal o sentido botânico e dinástico de “broto” e “ramo”, sem transformar a expressão em título explícito.
  alternative: Empregar “Renovo” com inicial maiúscula para sinalizar diretamente um título messiânico.
  rationale: O versículo apresenta poeticamente um descendente da linhagem de Jessé. Sua leitura messiânica pode surgir do contexto canônico, mas o hebraico não exige que נֵצֶר seja grafado ou traduzido como título próprio.
- issue: Sufixo masculino em מִשָּׁרָשָׁיו
  choice: Traduzir por “das raízes dele”.
  alternative: Usar “de suas raízes”, que seria mais fluido, mas não deixaria explícito o gênero do referente; ou “das raízes do tronco”, suavizando a metáfora.
  rationale: A formulação escolhida preserva o sufixo masculino singular e a associação dinástica com Jessé, sem decidir além do que a imagem permite se o referente imediato é Jessé ou o tronco figurado.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Tronco cortado” foi preferido a “toco” por ser mais transparente em diferentes variedades do português, embora “toco” seja uma alternativa lexical possível. A ordem poética dos dois membros e a repetição da imagem vegetal foram preservadas.
