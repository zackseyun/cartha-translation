id: ISA.11.13
reference: Isaiah 11:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/סָ֨רָה֙ קִנְאַ֣ת אֶפְרַ֔יִם וְ/צֹרְרֵ֥י יְהוּדָ֖ה יִכָּרֵ֑תוּ אֶפְרַ֨יִם֙ לֹֽא יְקַנֵּ֣א אֶת יְהוּדָ֔ה וִֽ/יהוּדָ֖ה לֹֽא יָצֹ֥ר אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/013.yaml
  text: The jealousy of Ephraim will depart[a], and the adversaries of Judah will be cut off; Ephraim will not be jealous of Judah[b], and Judah will not harass Ephraim.
translation:
  language: pt
  text: A inveja de Efraim desaparecerá[a], e os adversários de Judá serão eliminados; Efraim não terá inveja de Judá, e Judá não hostilizará Efraim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ciúme de Efraim cessará”; o termo hebraico pode indicar ciúme, inveja ou rivalidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “não oprimirá Efraim” ou “não atacará Efraim”; o verbo hebraico pode indicar tratar alguém como inimigo, hostilizar, oprimir ou assediar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרָה
  choice: desaparecerá
  rationale: O verbo סור apresenta a inveja como algo que se afasta ou deixa de existir. “Desaparecerá” comunica essa cessação de modo natural em português.
- source_word: קִנְאַת / יְקַנֵּא
  choice: inveja / terá inveja
  rationale: קנאה e קנא podem indicar ciúme, inveja ou rivalidade zelosa. No contexto da rivalidade entre Efraim e Judá, “inveja” é clara e idiomática, sem excluir a ideia de rivalidade.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Mantém-se o nome próprio empregado pelo hebraico, sem expandi-lo interpretativamente para “reino do Norte”.
- source_word: וְצֹרְרֵי יְהוּדָה
  choice: os adversários de Judá
  rationale: O particípio derivado de צרר designa pessoas hostis ou inimigas. “Adversários” conserva a amplitude sem restringir o sentido a guerra ou opressão.
- source_word: יִכָּרֵתוּ
  choice: serão eliminados
  rationale: O nifal de כרת significa literalmente “ser cortado” e, neste contexto, indica remoção ou destruição. “Serão eliminados” transmite o sentido com naturalidade.
- source_word: וִיהוּדָה לֹא יָצֹר אֶת אֶפְרָיִם
  choice: e Judá não hostilizará Efraim
  rationale: O verbo pode exprimir tratar como inimigo, atacar, oprimir ou assediar. “Hostilizará” preserva a amplitude da antagonização ativa e corresponde bem ao paralelismo.
theological_decisions:
- issue: Referentes de Efraim e Judá
  choice: Manter os nomes tribais e nacionais “Efraim” e “Judá”.
  alternative: Explicitar “o reino do Norte” e “o reino do Sul”, ou substituir Efraim por “Israel”.
  rationale: O hebraico nomeia diretamente Efraim e Judá. Preservar os nomes mantém a textura histórica e poética e evita inserir uma identificação interpretativa no corpo do versículo.
- issue: Natureza da tensão entre Efraim e Judá
  choice: Traduzir com “inveja” e “hostilizar”, preservando tanto a rivalidade interior quanto sua manifestação ativa.
  alternative: Uniformizar as duas metades como mera “hostilidade” ou especificar opressão militar.
  rationale: O paralelismo emprega raízes diferentes e não deve ser nivelado; a primeira sugere inveja ou ciúme rival, e a segunda, ação hostil.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo equilibrado. “Hostilizará” é um pouco formal, mas corrente e semanticamente abrangente. Os marcadores [a] e [b] aparecem no texto junto às expressões a que se referem.
