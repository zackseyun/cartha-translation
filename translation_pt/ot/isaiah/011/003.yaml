base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/003.yaml
  text: And his delight shall be in the fear of Yahweh[a], and he shall not judge by what his eyes see, nor decide by what his ears hear.
translation:
  language: pt
  text: Ele terá prazer no temor de Yahweh[a]. Ele não julgará pelo que seus olhos veem, nem decidirá pelo que seus ouvidos ouvem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “seu olfato estará no temor de Yahweh” ou “sua percepção estará no temor de Yahweh”. O verbo hebraico é difícil e pode sugerir discernimento aguçado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרִיחוֹ
  choice: Seu prazer estará
  rationale: A forma hifil de ריח é difícil e, tomada literalmente, remete a cheirar ou perceber pelo olfato. No contexto, introduz a disposição e o discernimento do governante; a formulação idiomática comunica que ele encontra prazer e está profundamente sintonizado com o temor de Yahweh, enquanto a nota preserva a imagem lexical e a ambiguidade.
- source_word: בְּיִרְאַת
  choice: no temor de
  rationale: יִרְאָה denota temor reverente diante de Deus. A expressão tradicional e inteligível “temor de” conserva tanto a reverência quanto o peso teológico do hebraico, sem reduzi-lo a simples medo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמַרְאֵה עֵינָיו
  choice: pelo que seus olhos veem
  rationale: Conserva a imagem sensorial concreta e expressa naturalmente que seu julgamento não se baseará apenas na aparência visível.
- source_word: יִשְׁפּוֹט
  choice: julgará
  rationale: שׁפט tem aqui sentido judicial e governamental; “julgará” é a correspondência direta e natural.
- source_word: לְמִשְׁמַע אָזְנָיו
  choice: pelo que seus ouvidos ouvem
  rationale: Mantém o paralelismo com a visão e evita restringir a expressão ao sentido interpretativo de “boatos” ou “ouvir dizer”.
- source_word: יוֹכִיחַ
  choice: decidirá
  rationale: No hifil, יכח pode significar decidir, arbitrar, repreender ou proferir sentença. Em paralelo com “julgará”, predomina o sentido judicial; “decidirá” é claro sem tornar os dois verbos totalmente idênticos.
theological_decisions:
- issue: O discernimento do governante davídico vindouro
  choice: O governante se caracteriza pelo prazer reverente no temor de Yahweh e por decisões que não dependem meramente da aparência ou de relatos ouvidos.
  alternative: 'A primeira oração pode ressaltar de modo mais direto sua percepção extraordinária: “seu olfato/sua percepção estará no temor de Yahweh” ou “ele perceberá pelo olfato”.'
  rationale: O contexto apresenta o descendente de Jessé capacitado pelo Espírito. A tradução comunica sua disposição reverente e seu discernimento extraordinário sem definir de maneira especulativa o mecanismo dessa percepção; a nota conserva a dificuldade e a metáfora olfativa do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo entre olhos e ouvidos foi mantido, assim como o nome divino Yahweh. A pontuação em duas frases favorece a clareza sem alterar a relação entre as orações.
