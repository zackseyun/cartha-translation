  text: וְ/שִֽׁעֲשַׁ֥ע יוֹנֵ֖ק עַל חֻ֣ר פָּ֑תֶן וְ/עַל֙ מְאוּרַ֣ת צִפְעוֹנִ֔י גָּמ֖וּל יָד֥/וֹ הָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/008.yaml
  text: The nursing child will play over the cobra’s hole[b][a], and the weaned child will put his hand on the viper’s den.
translation:
  language: pt
  text: A criança que ainda mama brincará sobre o buraco da cobra[a], e a criança já desmamada estenderá a mão[b] sobre a toca da víbora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “áspide”. O termo hebraico designa uma serpente venenosa, tradicionalmente identificada como áspide ou cobra.
    reason: lexical_alternative
  - marker: b
    text: Ou “porá a mão”. O verbo hebraico também pode indicar colocar ou levar a mão até esse lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁעֲשַׁע
  choice: brincará
  rationale: No contexto, o verbo retrata a brincadeira despreocupada de uma criança em um lugar normalmente perigoso; “brincará” é natural e preserva a força da cena.
- source_word: יוֹנֵק
  choice: a criança que ainda mama
  rationale: O particípio designa uma criança em fase de amamentação. A expressão é clara em português moderno e mantém o contraste com a criança já desmamada.
- source_word: חֻר
  choice: buraco
  rationale: O substantivo indica um buraco, abertura ou cavidade; “buraco” é a forma mais direta neste contexto.
- source_word: פָּתֶן
  choice: cobra
  rationale: O termo designa uma serpente venenosa, tradicionalmente identificada como áspide ou cobra. “Cobra” é amplamente compreensível sem alegar precisão zoológica indevida.
- source_word: מְאוּרַת
  choice: toca
  rationale: O termo se refere ao abrigo ou covil do animal. “Toca” é natural em português e permite distingui-lo do “buraco” do primeiro membro poético.
- source_word: צִפְעוֹנִי
  choice: víbora
  rationale: A palavra denota uma serpente venenosa; “víbora” é um equivalente corrente, sem impor uma identificação zoológica excessivamente precisa.
- source_word: גָּמוּל
  choice: a criança já desmamada
  rationale: O termo se refere a uma criança que deixou de mamar. A inclusão de “já” torna o contraste de desenvolvimento claro e natural.
- source_word: יָדוֹ
  choice: a mão
  rationale: O hebraico traz “sua mão”, com sufixo masculino singular. Em português, como o referente “criança” já está expresso, “a mão” é idiomático e não perde informação referencial.
- source_word: הָדָה
  choice: estenderá
  rationale: Neste contexto, o verbo raro descreve o movimento de levar ou estender a mão em direção à toca. “Estenderá” preserva o movimento sem afirmar necessariamente que a criança tocará a serpente.
- source_word: עַל
  choice: junto ao / sobre
  rationale: A preposição tem alcance contextual amplo. “Junto ao” descreve naturalmente a brincadeira perto do buraco, enquanto “sobre” preserva a relação espacial da mão com a toca no segundo membro.
theological_decisions:
- issue: Natureza da imagem no contexto do reino de paz
  choice: Apresentar diretamente a extraordinária paz e segurança retratadas no verso, sem definir se a imagem é literal, simbólica ou ambas.
  alternative: Entender a cena exclusivamente como transformação literal da criação ou exclusivamente como símbolo da paz messiânica.
  rationale: O texto poético mostra crianças vulneráveis em segurança perto de serpentes mortíferas. A tradução preserva essa tensão imagética sem decidir uma questão interpretativa que o próprio verso não resolve.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “A criança que ainda mama” evita o tom arcaico de “lactente” ou “criança de peito”; o paralelismo com “a criança já desmamada” conserva a progressão do hebraico. A ordem poética foi mantida sem explicar a imagem no corpo do texto.
