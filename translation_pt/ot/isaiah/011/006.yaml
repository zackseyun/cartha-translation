  text: וְ/גָ֤ר זְאֵב֙ עִם כֶּ֔בֶשׂ וְ/נָמֵ֖ר עִם גְּדִ֣י יִרְבָּ֑ץ וְ/עֵ֨גֶל וּ/כְפִ֤יר וּ/מְרִיא֙ יַחְדָּ֔ו וְ/נַ֥עַר קָטֹ֖ן נֹהֵ֥ג בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/006.yaml
  text: And the wolf will dwell with the lamb[a], and the leopard will lie down with the young goat; and the calf and the young lion and the fattened calf will be together[d][c][b], and a little boy will lead them.
translation:
  language: pt
  text: O lobo viverá com o cordeiro, e o leopardo se deitará com o cabrito; o bezerro, o leão jovem e o animal engordado estarão juntos, e um menino pequeno os conduzirá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e uma criança pequena os guiará”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָר
  choice: viverá com
  rationale: O qal de גור pode indicar residir ou habitar como hóspede. Em português, “viverá com” expressa naturalmente a convivência pacífica sem tornar obrigatoriamente permanente uma nuance que o verbo pode deixar aberta.
- source_word: זְאֵב
  choice: lobo
  rationale: Equivalente português comum e direto do nome do animal.
- source_word: עִם
  choice: com / ao lado de
  rationale: A preposição indica associação ou proximidade. “Com” é a forma mais direta; “ao lado de” evita uma sequência pesada e explicita naturalmente a proximidade na segunda imagem.
- source_word: כֶּבֶשׂ
  choice: cordeiro
  rationale: No contraste poético com o lobo, “cordeiro” comunica com clareza a vulnerabilidade do animal e corresponde ao sentido contextual.
- source_word: וְנָמֵר
  choice: leopardo
  rationale: Equivalente português convencional do termo zoológico.
- source_word: גְּדִי
  choice: cabrito
  rationale: Designa o filhote da cabra; “cabrito” é claro e corrente em português.
- source_word: יִרְבָּץ
  choice: se deitará
  rationale: רבץ descreve um animal deitado ou em repouso. “Se deitará” preserva a imagem pacífica sem sugerir postura predatória.
- source_word: וְעֵגֶל
  choice: o bezerro
  rationale: Equivalente comum para um bovino jovem.
- source_word: וּכְפִיר
  choice: o leão novo
  rationale: כפיר designa um leão jovem. A expressão mantém o referente e um registro digno, sem reduzi-lo necessariamente a um filhote muito pequeno.
- source_word: וּמְרִיא
  choice: o animal cevado
  rationale: O substantivo indica um animal engordado ou bem alimentado, mas não especifica nesta forma qual espécie. “Animal cevado” evita acrescentar “bezerro”, ausente no hebraico.
- source_word: יַחְדָּו
  choice: estarão juntos
  rationale: O advérbio significa “juntos”. O verbo “estarão” completa naturalmente a oração nominal em português.
- source_word: וְנַעַר קָטֹן
  choice: um menino pequeno
  rationale: נַעַר é masculino e pode significar menino ou jovem; קָטֹן destaca que é pequeno ou novo. A tradução conserva tanto o gênero gramatical quanto a vividez da imagem.
- source_word: נֹהֵג בָּם
  choice: os conduzirá
  rationale: O particípio de נהג indica guiar ou conduzir animais. O futuro português acompanha o horizonte profético dos demais verbos e “os” retoma o conjunto.
theological_decisions:
- issue: Natureza da imagem do reino de paz
  choice: Manter literalmente as figuras concretas dos animais em convivência pacífica.
  alternative: Explicá-las como transformação zoológica estritamente literal ou como simples metáfora de reconciliação social e política.
  rationale: O hebraico apresenta poesia profética concreta, mas o versículo não determina por si só como a imagem deve ser relacionada ao seu cumprimento. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética moderada. A escolha “animal cevado” segue mais de perto a falta de espécie explícita em מְרִיא. O marcador de nota aparece no texto principal.
