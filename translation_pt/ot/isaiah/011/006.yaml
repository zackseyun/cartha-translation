revisions:
- from: O lobo viverá com o cordeiro, e o leopardo se deitará ao lado do cabrito; o bezerro, o leão novo e o animal cevado estarão juntos, e um menino pequeno os conduzirá.[a]
  to: O lobo viverá com o cordeiro, e o leopardo se deitará com o cabrito; o bezerro, o leão jovem e o animal engordado estarão juntos, e um menino pequeno os conduzirá.[a]
  rationale: A revisão uniformiza a tradução de עִם, melhora a naturalidade de duas expressões lexicais e conserva a imagem profética concreta, a ambiguidade interpretativa e a não especificação de espécie em מְרִיא. A nota permanece corretamente ancorada no sintagma final e apresenta uma alternativa lexical possível, sem impor interpretação.
