    rationale: A preposição hebraica significa simplesmente “com”; a repetição de “com” preserva melhor o paralelismo poético e a formulação da fonte.
  - severity: low
    issue: “Leão novo” é pouco natural no português moderno.
    rationale: “Leão jovem” comunica de modo mais corrente o sentido de כְּפִיר, sem especificar indevidamente um filhote recém-nascido.
  - severity: low
    issue: “Animal cevado” tem registro menos transparente para parte do público moderno internacional.
    rationale: “Animal engordado” transmite claramente o sentido de animal deliberadamente engordado, preservando a espécie não explicitada por מְרִיא.
