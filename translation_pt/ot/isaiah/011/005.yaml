  text: וְ/הָ֥יָה צֶ֖דֶק אֵז֣וֹר מָתְנָ֑י/ו וְ/הָ/אֱמוּנָ֖ה אֵז֥וֹר חֲלָצָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/011/005.yaml
  text: Righteousness will be the belt of his waist[b][a], and faithfulness the belt of his loins.
translation:
  language: pt
  text: 'A justiça[a] será o cinto da sua cintura,

    e a fidelidade[b], o cinto dos seus quadris.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão”, em vez de “justiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “constância”, em vez de “fidelidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: será
  rationale: O perfeito qal com waw em discurso profético admite sentido futuro; em português, «será» expressa isso naturalmente sem precisar representar a conjunção inicial.
- source_word: צֶדֶק
  choice: justiça
  rationale: צֶדֶק abrange justiça e retidão. No contexto do governo do rei prometido, «justiça» comunica com clareza tanto a qualidade moral quanto sua expressão no exercício do governo.
- source_word: אֵזוֹר
  choice: cinto
  rationale: Termo concreto para algo preso ao redor do corpo; «cinto» é atual, claro e preserva a metáfora hebraica.
- source_word: מָתְנָיו
  choice: sua cintura
  rationale: מָתְנַיִם designa a região da cintura ou dos lombos; «cintura» é natural em português e permite distinguir o segundo termo corporal.
- source_word: וְהָאֱמוּנָה
  choice: e a fidelidade
  rationale: אֱמוּנָה denota firmeza, constância ou fidelidade; aqui caracteriza a confiabilidade permanente do governante.
- source_word: חֲלָצָיו
  choice: seus quadris
  rationale: חֲלָצַיִם refere-se aos lombos ou quadris. «Quadris» mantém a imagem corporal e a distinção poética em relação a «cintura», sem o tom menos corrente de «lombos».
theological_decisions:
- issue: Tradução das virtudes paralelas na profecia sobre o governante prometido
  choice: «justiça» e «fidelidade» como qualidades que caracterizam o governante
  alternative: «retidão» e «firmeza»
  rationale: A formulação conserva a metáfora ética do hebraico e não acrescenta uma definição cristológica ou sistemática que o próprio versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo hebraico é preservado pela repetição de «o cinto», e a elipse verbal no segundo membro mantém o ritmo poético.
