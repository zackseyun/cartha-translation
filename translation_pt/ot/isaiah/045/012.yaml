id: ISA.45.12
reference: Isaiah 45:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָֽנֹכִי֙ עָשִׂ֣יתִי אֶ֔רֶץ וְ/אָדָ֖ם עָלֶ֣י/הָ בָרָ֑אתִי אֲנִ֗י יָדַ/י֙ נָט֣וּ שָׁמַ֔יִם וְ/כָל צְבָאָ֖/ם צִוֵּֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/012.yaml
  text: I made the earth[a], and I created man upon it; my hands stretched out the heavens, and I commanded all their host.
translation:
  language: pt
  text: Eu fiz a terra e criei o ser humano[a] sobre ela; foram as minhas mãos que estenderam os céus, e dei ordens a todo o seu exército.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a humanidade”. O hebraico ’adam é aqui um singular coletivo referente à raça humana.
    reason: Esclarece o valor coletivo do substantivo hebraico e registra uma alternativa natural em português.
lexical_decisions:
- source_word: אָֽנֹכִי עָשִׂיתִי
  choice: Eu fiz
  rationale: Expressa de modo direto a ação e a agência divina; a posição inicial de “Eu” conserva a ênfase do pronome hebraico independente sem tornar a frase artificial.
- source_word: אֶרֶץ
  choice: a terra
  rationale: O paralelismo com “os céus” indica o sentido cósmico de אֶרֶץ, não o de uma terra ou região específica.
- source_word: וְאָדָם
  choice: o ser humano
  rationale: אָדָם é aqui um singular coletivo que representa a humanidade. “O ser humano” mantém o singular e comunica naturalmente em português a referência genérica.
- source_word: עָלֶיהָ
  choice: sobre ela
  rationale: O sufixo feminino retoma “a terra”; a expressão preserva claramente a relação espacial.
- source_word: בָרָאתִי
  choice: criei
  rationale: Distingue ברא, verbo característico da criação divina, do anterior עשה, traduzido por “fiz”.
- source_word: אֲנִי יָדַי נָטוּ
  choice: foram as minhas mãos que estenderam
  rationale: Reproduz em português corrente a ênfase da construção hebraica, na qual o pronome independente destaca a atuação pessoal de Deus e “minhas mãos” é o sujeito plural de “estenderam”.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Mantém a forma plural e o alcance cósmico em paralelo com “a terra”.
- source_word: וְכָל־צְבָאָם
  choice: todo o seu exército
  rationale: Preserva a imagem coletiva de צָבָא e a referência pronominal aos céus, sem definir além do texto se o conjunto é astral, celestial ou ambos.
- source_word: צִוֵּיתִי
  choice: dei ordens a
  rationale: Comunica inequivocamente o sentido de ordenar ou comandar e evita que “ordenei” seja entendido apenas como “organizei”.
theological_decisions:
- issue: Sentido coletivo de אָדָם
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: O contexto fala da criação da raça humana em geral. A opção escolhida conserva o singular coletivo sem sugerir que somente o sexo masculino esteja em vista; a nota registra a alternativa coletiva abstrata.
- issue: Identidade de צְבָא הַשָּׁמַיִם
  choice: todo o seu exército
  alternative: toda a sua hoste; todos os seus astros
  rationale: O hebraico não especifica neste verso se o “exército” dos céus deve ser entendido estritamente como astros, seres celestiais ou a totalidade ordenada celeste. A tradução mantém essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção enfática “foram as minhas mãos que” evita o pouco natural “eu, minhas mãos” e preserva a ênfase do hebraico. “Exército” mantém a imagem poética e a ambiguidade referencial do texto-fonte.
