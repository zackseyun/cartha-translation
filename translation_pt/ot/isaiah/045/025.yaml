  text: בַּ/יהוָ֛ה יִצְדְּק֥וּ וְ/יִֽתְהַלְל֖וּ כָּל זֶ֥רַע יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/025.yaml
  text: In Yahweh all the offspring of Israel will be justified and will boast[a][b].
translation:
  language: pt
  text: Em Yahweh, todos os descendentes de Israel serão justificados[a] e se gloriarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão vindicados”. O verbo hebraico pode indicar tanto ser justificado como ter sua razão ou justiça reconhecida.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיהוָה
  choice: Em Yahweh
  rationale: A preposição בְּ pode indicar esfera, relação ou fundamento. “Em Yahweh” preserva a formulação compacta e deixa aberta essa amplitude, usando o nome divino presente no hebraico.
- source_word: יִצְדְּקוּ
  choice: será justificada
  rationale: O Qal de צדק pode expressar ser declarado justo, mostrar-se justo ou ser vindicado. “Será justificada” comunica de modo natural o sentido declarativo/resultativo, enquanto a alternativa contextual é preservada em nota.
- source_word: וְיִתְהַלְלוּ
  choice: e se gloriará
  rationale: O Hitpael de הלל indica gloriar-se ou vangloriar-se. “Se gloriará” mantém o valor reflexivo e, no contexto de “em Yahweh”, evita a conotação predominantemente negativa que “se vangloriará” pode ter em português.
- source_word: כָּל
  choice: toda
  rationale: כָּל modifica o substantivo coletivo זֶרַע; por isso, “toda a descendência” é natural e semanticamente fiel.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: a descendência de Israel
  rationale: זֶרַע significa literalmente “semente”, mas aqui designa coletivamente os descendentes. “Descendência” é atual, digna e clara; a imagem literal é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Nuance de צדק no contexto de salvação
  choice: será justificada
  alternative: será vindicada
  rationale: A escolha preserva o peso declarativo da raiz sem limitar o verso a um sistema doutrinário posterior. Como o hebraico também admite a ideia de ter sua justiça reconhecida ou ser vindicado, essa possibilidade aparece em nota.
- issue: Referente coletivo de זֶרַע יִשְׂרָאֵל
  choice: 'concordância no singular coletivo: “toda a descendência... será... se gloriará”'
  alternative: 'plural distributivo: “todos os descendentes... serão... se gloriarão”'
  rationale: O hebraico apresenta זֶרַע como substantivo coletivo singular, embora os verbos estejam no plural por referência aos integrantes do grupo. O português permite manter a imagem coletiva com concordância gramatical no singular, sem negar a pluralidade dos descendentes.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação é concisa e solene, sem arcaísmos desnecessários. “Se gloriará” foi preferido a “se vangloriará” para expressar uma exultação legítima em Yahweh, e “descendência” comunica com clareza o substantivo coletivo hebraico.
