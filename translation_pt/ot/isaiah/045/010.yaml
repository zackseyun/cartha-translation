  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֛וֹי אֹמֵ֥ר לְ/אָ֖ב מַה תּוֹלִ֑יד וּ/לְ/אִשָּׁ֖ה מַה תְּחִילִֽי/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/010.yaml
  text: Woe to one who says to a father[a], ‘What are you fathering?’ or to a woman[b], ‘What are you giving birth to?’
translation:
  language: pt
  text: 'Ai daquele que diz a um pai[a]: “O que você está gerando?”, ou a uma mulher[b]: “O que você está dando à luz?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O que você está procriando?”. O verbo hebraico, aqui dirigido ao pai, refere-se especificamente ao ato paterno de gerar.
    reason: lexical_alternative
  - marker: b
    text: Ou “Com o que você está em trabalho de parto?”. O hebraico evoca as dores e o processo do parto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai daquele
  rationale: Preserva a força profética de denúncia ou lamento e forma uma construção natural em português com o particípio substantivado seguinte.
- source_word: אֹמֵר
  choice: que diz
  rationale: O particípio funciona de modo substantivado; unido a “daquele”, mantém a referência genérica no singular.
- source_word: לְאָב
  choice: a um pai
  rationale: A preposição indica o destinatário da fala, e o hebraico não traz pronome possessivo; por isso, não se acrescenta “seu”.
- source_word: מַה
  choice: O que
  rationale: Mantém o valor interrogativo direto e a formulação deliberadamente absurda da pergunta.
- source_word: תּוֹלִיד
  choice: você está gerando
  rationale: O hiphil de ילד, dirigido a um homem, expressa a ação paterna de gerar. “Gerando” é corrente em português, embora sua especificidade paterna dependa do contexto e seja esclarecida em nota.
- source_word: וּלְאִשָּׁה
  choice: ou a uma mulher
  rationale: “Ou” apresenta naturalmente o segundo membro paralelo da construção; não há possessivo no texto que justifique “sua mãe”.
- source_word: תְּחִילִין
  choice: você está dando à luz
  rationale: A forma evoca as dores e o processo do parto. “Dando à luz” comunica a imagem de modo claro e idiomático, enquanto a nota preserva a nuance do trabalho de parto.
theological_decisions:
- issue: Força interpretativa da imagem de pai e mulher
  choice: Manter literalmente a imagem de um pai que gera e de uma mulher que dá à luz, sem explicitar no versículo que ela representa o questionamento do Criador.
  alternative: Empregar “pai e mãe” ou parafrasear a imagem como uma censura direta a quem questiona Deus.
  rationale: O contexto mais amplo identifica aquele que contende com seu Criador, mas este versículo apresenta a censura por meio de uma analogia concreta. Explicitar o referente aqui eliminaria a tensão retórica do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Ai daquele” conserva o tom oracular; o uso de “você” torna as perguntas diretas naturais sem perder solenidade. As notas registram nuances sexuais e corporais que não podem ser reproduzidas integralmente por um único verbo corrente em português.
