  text: וְ/נָתַתִּ֤י לְ/ךָ֙ אוֹצְר֣וֹת חֹ֔שֶׁךְ וּ/מַטְמֻנֵ֖י מִסְתָּרִ֑ים לְמַ֣עַן תֵּדַ֗ע כִּֽי אֲנִ֧י יְהוָ֛ה הַ/קּוֹרֵ֥א בְ/שִׁמְ/ךָ֖ אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/003.yaml
  text: And I will give you the treasures of darkness and the hidden riches of secret places[a], so that you may know that I am Yahweh, the one who calls you by name[c][b], the God of Israel.
translation:
  language: pt
  text: E eu lhe darei os tesouros das trevas[a] e as riquezas escondidas em lugares secretos[b], para que você saiba que eu sou Yahweh[c], aquele que o chama pelo nome, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os tesouros escondidos nas trevas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os tesouros ocultos dos esconderijos”.'
    reason: lexical_alternative
  - marker: c
    text: Yahweh é uma transliteração do nome divino hebraico YHWH, tradicionalmente representado por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E eu lhe darei
  rationale: O perfeito qal com conjunção, neste contexto profético de promessa dirigida a Ciro, tem sentido futuro; a construção também mantém a ligação com o versículo anterior.
- source_word: אוֹצְרוֹת חֹשֶׁךְ
  choice: os tesouros das trevas
  rationale: Reproduz a cadeia construta literalmente e preserva a imagem poética, sem excluir o provável sentido de tesouros guardados ou ocultos na escuridão.
- source_word: וּמַטְמֻנֵי מִסְתָּרִים
  choice: as riquezas escondidas em lugares secretos
  rationale: מַטְמֻנִים indica reservas ou bens ocultos, e מִסְתָּרִים, esconderijos ou lugares secretos. A formulação conserva tanto o valor material quanto a intensificação da ideia de ocultamento.
- source_word: לְמַעַן תֵּדַע
  choice: para que você saiba
  rationale: Expressa com naturalidade a finalidade indicada por לְמַעַן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: הַקּוֹרֵא בְשִׁמְךָ
  choice: aquele que o chama pelo nome
  rationale: Expressa de modo idiomático em português a convocação pessoal e específica de Ciro indicada pelo particípio e por בְשִׁמְךָ.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução clara e convencional da relação construta, preservando a identificação de Yahweh com Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Natureza dos tesouros prometidos
  choice: Riquezas materiais ocultas em lugares escuros ou secretos
  alternative: Tesouros espirituais metafóricos
  rationale: O contexto dirigido a Ciro, com nações, portas e poder político, favorece bens materiais escondidos. A tradução mantém a imagem concreta sem eliminar sua força teológica sobre a soberania divina.
- issue: Valor de הַקּוֹרֵא בְשִׁמְךָ
  choice: Yahweh chama Ciro pessoalmente pelo nome
  alternative: Yahweh atribui um novo nome ou título a Ciro
  rationale: No contexto, a expressão ressalta o conhecimento e a convocação específicos de Ciro; a tradução não acrescenta a ideia de renomeação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “você” torna explícito que a promessa se dirige singularmente a Ciro; “lhe” e “o” mantêm a referência pessoal sem repetição pesada. O paralelismo poético e a concretude das imagens hebraicas foram preservados.
