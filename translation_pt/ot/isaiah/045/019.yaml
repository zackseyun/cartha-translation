  source_fidelity: 'A tradução preserva bem as afirmações centrais do hebraico: a revelação não foi secreta, a descendência de Jacó não foi chamada a buscar Yahweh inutilmente, e Yahweh fala/declara retidão. Contudo, a coordenação negativa da segunda expressão locativa precisa ser explicitada. Em hebraico, «em segredo» e «num lugar de uma terra de trevas» estão ambos sob a negação; sem «nem», a redação atual em português pode fazer a segunda expressão soar apenas explicativa ou aposicional.'
  naturalness: O registro é moderno, digno e internacionalmente compreensível. «Em algum lugar de uma terra de trevas» é compreensível, mas fica mais natural e sintaticamente claro com «nem», que também reproduz adequadamente o alcance da negação. «Busquem-me» é uma boa forma plural não regionalizada.
  terminology: «Yahweh», «descendência de Jacó», «em vão», «o que é justo» e «o que é reto» são escolhas adequadas. O paralelismo final comunica bem צדק e מישרים sem impor uma leitura teológica estreita. As notas mantêm alternativas lexicais úteis; a nota de תֹהוּ deve formular a alternativa de modo mais idiomático em português.
  issues:
