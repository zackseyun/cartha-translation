  text: לֹ֧א בַ/סֵּ֣תֶר דִּבַּ֗רְתִּי בִּ/מְקוֹם֙ אֶ֣רֶץ חֹ֔שֶׁךְ לֹ֥א אָמַ֛רְתִּי לְ/זֶ֥רַע יַעֲקֹ֖ב תֹּ֣הוּ בַקְּשׁ֑וּ/נִי אֲנִ֤י יְהוָה֙ דֹּבֵ֣ר צֶ֔דֶק מַגִּ֖יד מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/019.yaml
  text: I did not speak in secret[a], in a land of darkness; I did not say to the offspring of Jacob, ‘Seek me in vain.’ I, Yahweh, speak righteousness[b], declaring what is upright.
translation:
  language: pt
  text: 'Não falei em segredo, nem em algum lugar de uma terra de trevas; não disse à descendência de Jacó: “Busquem-me em vão.”[a] Eu, Yahweh, falo o que é justo[b] e declaro o que é reto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Busquem-me inutilmente”. O hebraico תֹהוּ pode indicar vazio, inutilidade ou ausência de forma; aqui, o sentido é que buscar Yahweh não é inútil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “falo justiça” ou “falo o que é certo”. O hebraico צֶדֶק pode expressar justiça, retidão ou aquilo que é correto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: em segredo
  rationale: Expressa de modo natural a ideia de ocultação ou segredo e mantém o contraste com a revelação pública e confiável de Yahweh.
- source_word: בִּמְקוֹם אֶרֶץ חֹשֶׁךְ
  choice: em algum lugar de uma terra de trevas
  rationale: Preserva os elementos hebraicos “lugar”, “terra” e “trevas” sem produzir uma construção excessivamente rígida em português.
- source_word: לְזֶרַע יַעֲקֹב
  choice: à descendência de Jacó
  rationale: Representa o sentido coletivo de זֶרַע de forma clara e corrente.
- source_word: תֹּהוּ
  choice: em vão
  rationale: Neste contexto, indica inutilidade ou frustração, comunicando que buscar Yahweh não é algo sem propósito.
- source_word: בַקְּשׁוּנִי
  choice: Busquem-me
  rationale: Traduz diretamente o imperativo plural com o sufixo de primeira pessoa e é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: דֹּבֵר צֶדֶק
  choice: falo o que é justo
  rationale: Comunica a amplitude de צֶדֶק — justiça, retidão ou aquilo que é correto — com clareza, sem restringi-lo a um único sentido técnico.
- source_word: מַגִּיד מֵישָׁרִים
  choice: declaro o que é reto
  rationale: Preserva a imagem ética de retidão presente em מֵישָׁרִים e forma um paralelismo natural com a oração anterior.
theological_decisions:
- issue: Autodescrição divina no final do versículo
  choice: Eu, Yahweh, falo o que é justo e declaro o que é reto.
  alternative: Eu, Yahweh, falo justiça e anuncio coisas retas.
  rationale: A formulação escolhida conserva a ênfase na retidão e confiabilidade moral de Yahweh sem reduzir צֶדֶק exclusivamente a justiça jurídica, verdade proposicional ou justiça pactual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo plural “Busquem-me” evita formas regionais marcadas. O marcador [a] foi colocado junto de “em vão”, expressão à qual a nota lexical efetivamente se refere.
