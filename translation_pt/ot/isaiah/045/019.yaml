    issue: A segunda locução não está explicitamente coordenada à negação.
    rationale: «Não falei em segredo, em algum lugar...» pode ser lido em português como uma única descrição locativa ou como uma aposição. «Não falei em segredo, nem em algum lugar...» deixa claro que Yahweh nega ter falado em ambos os modos/lugares, conforme a sintaxe e o sentido do hebraico.
  - severity: low
    issue: A alternativa «Busquem-me para nada» na nota [a] é pouco idiomática.
    rationale: Embora reflita literalmente uma possibilidade semântica de תֹהוּ, «Busquem-me inutilmente» ou «Busquem-me em vão» comunica melhor em português moderno o sentido de busca fútil.
