  text: אָכֵ֕ן אַתָּ֖ה אֵ֣ל מִסְתַּתֵּ֑ר אֱלֹהֵ֥י יִשְׂרָאֵ֖ל מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/015.yaml
  text: Truly[a], you are a God who hides himself, the God of Israel, the Savior.
translation:
  language: pt
  text: De fato[a], tu és um Deus que se oculta, o Deus de Israel, o Salvador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tu és um Deus oculto». O particípio hebraico pode ser entendido em sentido reflexivo («que se oculta») ou mais estativo («que está oculto»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: De fato
  rationale: Introduz uma afirmação enfática ou uma constatação solene; é natural e digna em português.
- source_word: אַתָּה
  choice: tu
  rationale: Pronome de segunda pessoa masculina singular em discurso direto a Deus; mantém a forma singular e solene sem acrescentar conteúdo.
- source_word: אֵל
  choice: Deus
  rationale: No contexto, designa claramente o Deus de Israel; não há base para ampliar para «Deus poderoso».
- source_word: מִסְתַּתֵּר
  choice: que se oculta
  rationale: O particípio hitpael comporta sentido reflexivo ou médio. «Que se oculta» preserva a força verbal, enquanto a alternativa estativa é registrada em nota.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: A expressão funciona naturalmente como aposição que identifica o Deus interpelado, sem exigir a interjeição vocativa «ó», ausente do hebraico.
- source_word: מוֹשִׁיעַ
  choice: o Salvador
  rationale: O particípio hifil de ישׁע caracteriza Deus como aquele que salva. «O Salvador» é corrente, fiel e adequado à construção apositiva.
theological_decisions:
- issue: Sentido do ocultamento de Deus
  choice: Deus «se oculta»
  alternative: Deus «está oculto» ou é «um Deus oculto»
  rationale: A formulação principal conserva o possível sentido reflexivo do particípio sem explicar se o ocultamento diz respeito à inescrutabilidade, à providência escondida ou a outra ideia; a leitura estativa genuína permanece na nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. O uso de «tu» corresponde ao singular hebraico; os títulos em aposição mantêm a concisão do verso.
