base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/020.yaml
  text: Gather yourselves and come[a]; draw near together, you survivors of the nations. They have no knowledge[c][b], those who carry the wood of their carved image and pray to a god that cannot save.
translation:
  language: pt
  text: Reúnam-se e venham; aproximem-se juntos, sobreviventes das nações. Nada sabem os que carregam a madeira de sua imagem esculpida[a] e oram a um deus que não pode salvar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, seu ídolo de madeira.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que não salva”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִקָּבְצוּ וָבֹאוּ
  choice: Reúnam-se e venham
  rationale: Os dois imperativos convocam os ouvintes a se reunir e comparecer; a forma pronominal de “reúnam-se” expressa naturalmente em português a nuance do nifal.
- source_word: הִתְנַגְּשׁוּ יַחְדָּו
  choice: aproximem-se todos juntos
  rationale: O hitpael de נגש é uma convocação para chegar perto, e יַחְדָּו enfatiza a ação coletiva.
- source_word: פְּלִיטֵי הַגּוֹיִם
  choice: sobreviventes das nações
  rationale: פְּלִיטֵי designa os que escaparam ou sobreviveram; “sobreviventes” é claro e preserva o vocativo.
- source_word: לֹא יָדְעוּ
  choice: Nada sabem
  rationale: Mantém a caracterização enfática da ignorância dos adoradores de ídolos, com tom profético natural em português.
- source_word: הַנֹּשְׂאִים אֶת עֵץ פִּסְלָם
  choice: os que carregam a madeira de sua imagem esculpida
  rationale: Conserva a referência literal tanto à madeira quanto à imagem talhada, preservando a força polêmica contra um objeto fabricado.
- source_word: וּמִתְפַּלְלִים אֶל אֵל
  choice: e oram a um deus
  rationale: O particípio indica prática característica, e אֵל sem artigo tem sentido indefinido e polêmico neste contexto.
- source_word: לֹא יוֹשִׁיעַ
  choice: que não pode salvar
  rationale: O hifil de ישע significa salvar ou livrar; no contexto, a expressão ressalta a impotência do suposto deus.
theological_decisions:
- issue: Natureza da polêmica contra o ídolo em אֵל לֹא יוֹשִׁיעַ
  choice: um deus que não pode salvar
  alternative: um deus que não salva
  rationale: “Deus” preserva a designação irônica daquilo que as nações tratam como divindade, sem legitimá-lo como Deus verdadeiro; “não pode salvar” explicita a impotência ressaltada pelo contexto, enquanto a alternativa mantém mais diretamente a forma verbal hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem “Nada sabem os que...” mantém o impacto profético sem soar excessivamente arcaica. A imagem concreta da madeira foi preservada no texto principal.
