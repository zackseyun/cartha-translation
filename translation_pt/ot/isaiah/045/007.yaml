- from: Formo a luz e crio as trevas; faço a paz e crio a calamidade.[a] Eu sou Yahweh, que faz todas essas coisas.
  to: Formo a luz e crio as trevas; faço a paz e crio a calamidade.[a] Eu sou Yahweh, que faço todas essas coisas.
  rationale: A revisão limita-se a alinhar a oração final à primeira pessoa explícita do hebraico e a tornar a nota contextualmente mais precisa. Não altera o sentido nem elimina a alternativa lexical «mal».
