  yaml_path: translation/ot/isaiah/045/007.yaml
  text: forming light and creating darkness[a], making peace and creating calamity; I am Yahweh, who does all these things.
translation:
  language: pt
  text: Formo a luz e crio as trevas; faço a paz e crio a calamidade.[a] Eu sou Yahweh, que faço todas essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “crio o desastre” ou “crio o mal”. O hebraico רָע pode significar mal, dano, desastre ou calamidade; aqui, em contraste com “paz”, provavelmente se refere à calamidade ou à adversidade, em vez de ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצֵר
  choice: formo
  rationale: O particípio qal de יצר descreve formar ou modelar. A primeira pessoa, determinada pela declaração final אֲנִי יְהוָה, produz uma sequência natural em português e mantém o verbo distinto de ברא.
- source_word: אוֹר
  choice: a luz
  rationale: Equivalente lexical direto, preservando a oposição poética com 'as trevas'.
- source_word: וּבֹרֵא
  choice: e crio
  rationale: O particípio qal de ברא expressa atividade criadora divina. 'Crio' preserva o paralelismo e distingue este verbo de 'formo' e 'faço'.
- source_word: חֹשֶׁךְ
  choice: as trevas
  rationale: Forma portuguesa consagrada e natural para a escuridão em contraste cósmico e poético com a luz.
- source_word: עֹשֶׂה
  choice: faço
  rationale: עשה tem sentido amplo de fazer ou realizar. 'Faço' conserva a concisão da série verbal.
- source_word: שָׁלוֹם
  choice: a paz
  rationale: Embora possa abranger bem-estar, integridade e prosperidade, 'paz' mantém a antítese concisa com רָע e não restringe indevidamente o termo.
- source_word: רָע
  choice: a calamidade
  rationale: רָע pode designar mal, dano, adversidade ou desastre. Em oposição a שָׁלוֹם e no contexto profético, 'calamidade' comunica melhor a adversidade ou o juízo sem fazer o leitor entender necessariamente 'mal moral'.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: O pronome explícito marca ênfase na autoidentificação, e o nome divino é transliterado como 'Yahweh'.
- source_word: עֹשֶׂה כָל־אֵלֶּה
  choice: que faz todas essas coisas
  rationale: A oração participial final resume toda a série anterior e afirma de modo abrangente a agência de Yahweh.
theological_decisions:
- issue: Sentido de רָע sob a agência divina
  choice: calamidade
  alternative: mal; desastre; adversidade
  rationale: O texto afirma a soberania de Yahweh tanto sobre a paz como sobre acontecimentos adversos. 'Calamidade' preserva essa tensão e o alcance severo do enunciado, sem impor a leitura específica de que Deus cria o mal moral. Uma nota registra a amplitude genuína do hebraico.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração representa diretamente o nome próprio presente no texto hebraico e o distingue de títulos divinos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A primeira pessoa é usada ao longo da sequência para tornar explícito o sujeito indicado pela declaração final, sem alterar a estrutura poética de três pares verbais. Mantêm-se os verbos distintos 'formar', 'criar' e 'fazer'.
