  text: כֹּֽה אָמַ֧ר יְהוָ֛ה קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/יֹצְר֑/וֹ הָ/אֹתִיּ֣וֹת שְׁאָל֔וּ/נִי עַל בָּנַ֛/י וְ/עַל פֹּ֥עַל יָדַ֖/י תְּצַוֻּֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/011.yaml
  text: 'Thus says Yahweh[a], the Holy One of Israel and his Maker: Ask me about the things to come concerning my sons[c][b], and command me concerning the work of my hands.'
translation:
  language: pt
  text: 'Assim diz Yahweh, o Santo de Israel e aquele que o formou: “Perguntem-me sobre as coisas que estão por vir acerca de meus filhos[a]; quanto à obra de minhas mãos, deem-me ordens[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “meus filhos”; a expressão pode referir-se coletivamente a Israel como povo de Deus.
    reason: lexical_alternative
  - marker: b
    text: A expressão “deem-me ordens” é provavelmente intencionalmente provocativa neste contexto; alguns a entendem como uma censura retórica, e não como uma permissão literal.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e preserva sua força pactual, conforme a prática do projeto.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: o Santo de Israel
  rationale: Forma portuguesa consagrada e natural para este título profético.
- source_word: וְיֹצְרוֹ
  choice: e aquele que o formou
  rationale: Preserva o sufixo masculino singular do hebraico, cujo referente provável é Israel, sem substituí-lo pela formulação mais ambígua 'seu Criador'.
- source_word: הָאֹתִיּוֹת
  choice: as coisas que estão por vir
  rationale: No contexto profético, refere-se mais naturalmente aos acontecimentos vindouros; evita o sentido inadequado de 'letras' e não restringe a expressão a 'sinais'.
- source_word: שְׁאָלוּנִי
  choice: Perguntem-me
  rationale: Reproduz diretamente o imperativo plural com o sufixo de primeira pessoa.
- source_word: עַל בָּנַי
  choice: acerca de meus filhos
  rationale: Mantém o masculino plural do hebraico; no contexto, pode designar coletivamente Israel como povo de Deus.
- source_word: פֹּעַל יָדַי
  choice: a obra de minhas mãos
  rationale: Preserva a imagem concreta e o paralelismo da expressão hebraica.
- source_word: תְּצַוֻּנִי
  choice: deem-me ordens
  rationale: Comunica em português corrente a força provocativa de 'ordenar', sem atenuar a tensão do texto.
theological_decisions:
- issue: Se a cláusula final deve ser suavizada para evitar a ideia de seres humanos dando ordens a Deus
  choice: Manter a formulação direta 'deem-me ordens'
  alternative: 'Entender como pergunta ou censura retórica: ''vocês vão me dar ordens?'''
  rationale: O hebraico emprega linguagem deliberadamente forte. O contexto pode conferir ironia ou censura, mas a tradução deve preservar a tensão em vez de resolvê-la no texto principal.
- issue: Se בָּנַי deve ser neutralizado quanto ao gênero
  choice: Traduzir como 'meus filhos'
  alternative: meus filhos e filhas / meus descendentes
  rationale: O texto-fonte traz um plural masculino. Embora possa representar coletivamente todo Israel, a forma explícita deve ser mantida.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Mantêm-se o nome Yahweh, o paralelismo hebraico e a força desconcertante da cláusula final.
