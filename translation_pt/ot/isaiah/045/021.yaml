source:
  edition: WLC
  text: הַגִּ֣ידוּ וְ/הַגִּ֔ישׁוּ אַ֥ף יִֽוָּעֲצ֖וּ יַחְדָּ֑ו מִ֣י הִשְׁמִיעַ֩ זֹ֨את מִ/קֶּ֜דֶם מֵ/אָ֣ז הִגִּידָ֗/הּ הֲ/ל֨וֹא אֲנִ֤י יְהוָה֙ וְ/אֵֽין ע֤וֹד אֱלֹהִים֙ מִ/בַּלְעָדַ֔/י אֵֽל צַדִּ֣יק וּ/מוֹשִׁ֔יעַ אַ֖יִן זוּלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/021.yaml
  text: Declare it and present your case[a]; indeed, let them consult together. Who announced this from long ago? Who declared it from former times? Was it not I, Yahweh? There is no other God besides me, a righteous God and a Savior[c][b]; there is none except me.
translation:
  language: pt
  text: Declarem e apresentem sua causa[a]; sim, que eles deliberem juntos. Quem anunciou isso desde a antiguidade? Quem o declarou desde tempos antigos? Não fui eu, Yahweh[b]? Não há outro Deus além de mim, Deus justo e Salvador[c]; não há ninguém senão eu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tragam-na para perto” ou “apresentem-na”; neste contexto, o hebraico provavelmente tem sentido judicial: “apresentem sua causa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “Deus reto e Salvador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Declarem
  rationale: O imperativo plural pede uma declaração pública e formal, adequada ao contexto de contestação.
- source_word: וְהַגִּישׁוּ
  choice: apresentem sua causa
  rationale: No contexto forense, o hiphil de נגשׁ sugere trazer à frente uma causa ou evidência; a formulação explicita naturalmente essa imagem em português.
- source_word: אַף יִוָּעֲצוּ יַחְדָּו
  choice: sim, que eles deliberem juntos
  rationale: Preserva a ênfase da partícula אַף e o convite desafiador à deliberação coletiva.
- source_word: מִי הִשְׁמִיעַ זֹאת
  choice: Quem anunciou isso
  rationale: O hiphil de שׁמע tem aqui o sentido idiomático de tornar conhecido ou anunciar.
- source_word: מִקֶּדֶם
  choice: desde a antiguidade
  rationale: Expressa uma origem temporal remota em linguagem corrente e digna.
- source_word: מֵאָז הִגִּידָהּ
  choice: Quem o declarou desde tempos passados
  rationale: Reproduz o paralelismo interrogativo e mantém a referência a um ponto remoto no passado.
- source_word: הֲלוֹא אֲנִי יְהוָה
  choice: Não fui eu, Yahweh?
  rationale: A pergunta retórica identifica Yahweh como aquele que anunciou antecipadamente os acontecimentos; o nome divino é transliterado.
- source_word: וְאֵין עוֹד אֱלֹהִים מִבַּלְעָדַי
  choice: Não há outro Deus além de mim
  rationale: Formulação natural que preserva integralmente a afirmação de exclusividade.
- source_word: אֵל צַדִּיק
  choice: Deus justo
  rationale: צַדִּיק pode indicar retidão ou justiça; 'justo' é direto e idiomático em português, sem reduzir o alcance moral do termo.
- source_word: וּמוֹשִׁיעַ
  choice: e Salvador
  rationale: O particípio designa aquele que salva ou livra; 'Salvador' conserva a força titular e teológica da expressão.
- source_word: אַיִן זוּלָתִי
  choice: não há ninguém senão eu
  rationale: Mantém a segunda afirmação enfática de exclusividade sem repetir exatamente a formulação anterior.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de צַדִּיק aplicado a Deus
  choice: justo
  alternative: reto
  rationale: As duas nuances são possíveis. 'Justo' é natural em português e mantém em aberto tanto a dimensão judicial quanto a moral.
- issue: Relação entre Deus justo e Salvador
  choice: Deus justo e Salvador
  alternative: um Deus justo, que salva
  rationale: Mantém a coordenação hebraica entre justiça e salvação sem explicar ou resolver a tensão teológica entre esses atributos.
translation_notes:
  register: Português moderno, internacional e dignificado, com boa legibilidade brasileira. O plural alterna de modo deliberado entre a ordem direta ('Declarem') e a referência em terceira pessoa ('que eles deliberem'), acompanhando a mudança formal presente no hebraico. As notas registram alternativas genuínas sem sobrecarregar o texto.
