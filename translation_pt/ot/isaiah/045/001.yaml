base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/001.yaml
  text: 'Thus says Yahweh to his anointed[a], to Cyrus, whose right hand I have grasped, to subdue nations before him and to loosen the loins of kings, to open doors before him[c][b], and gates shall not be shut:'
translation:
  language: pt
  text: 'Assim diz Yahweh ao seu ungido[a], a Ciro, cuja mão direita segurei, para subjugar nações diante dele e descingir reis[b], para abrir diante dele portas[c], e os portões não se fecharão:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz «seu ungido», da mesma família de palavras associada posteriormente a «Messias»; aqui, o termo se refere a Ciro como alguém designado por Yahweh para esta missão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «soltar os lombos dos reis», isto é, descingi-los; a imagem pode indicar enfraquecê-los, desarmá-los ou deixá-los tomados de medo.
    reason: idiom_clarification
  - marker: c
    text: A palavra hebraica está na forma dual e pode indicar um par de portas ou portas de duas folhas; também se pode traduzir simplesmente por «portas».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva de modo natural e solene a fórmula profética hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e conserva sua força pactual, em conformidade com a camada de consulta fornecida.
- source_word: לִמְשִׁיחוֹ
  choice: ao seu ungido
  rationale: Mantém o sentido lexical de alguém consagrado ou designado para uma missão, sem converter o termo no título especializado «Messias».
- source_word: לְכוֹרֶשׁ
  choice: a Ciro
  rationale: Emprega a forma portuguesa tradicional do nome do rei persa.
- source_word: הֶחֱזַקְתִּי בִימִינוֹ
  choice: cuja mão direita tomei
  rationale: Conserva a imagem concreta de Yahweh tomando Ciro pela mão para sustentá-lo e capacitá-lo.
- source_word: לְרַד לְפָנָיו גּוֹיִם
  choice: para subjugar nações diante dele
  rationale: Expressa o sentido político-militar de רדה e mantém a relação espacial do original.
- source_word: וּמָתְנֵי מְלָכִים אֲפַתֵּחַ
  choice: e descingir reis
  rationale: Verte de forma concisa a imagem de soltar o que cinge os lombos dos reis, sugerindo enfraquecimento ou desarmamento sem apagar a metáfora.
- source_word: לִפְתֹּחַ לְפָנָיו דְּלָתַיִם
  choice: para abrir diante dele portas duplas
  rationale: Torna explícita a forma dual דְּלָתַיִם, provavelmente um par de folhas ou portas.
- source_word: וּשְׁעָרִים לֹא יִסָּגֵרוּ
  choice: de modo que os portões não se fechem
  rationale: A construção final iniciada por לְ pode abranger a abertura das portas e o fato de os portões não serem fechados; esta formulação é natural em português.
theological_decisions:
- issue: O uso de מָשִׁיחַ para Ciro
  choice: seu ungido
  alternative: seu Messias
  rationale: O referente imediato é Ciro, designado e capacitado por Yahweh para uma tarefa histórica. «Ungido» preserva tanto a identidade lexical com o termo posteriormente associado ao Messias quanto a tensão de sua aplicação a um rei persa, sem impor uma identificação cristológica direta.
- issue: Agente implícito em «não se fechem»
  choice: manter a construção passiva/reflexiva sem identificar o agente
  alternative: para que ninguém feche os portões
  rationale: O hebraico não nomeia quem deixará de fechar os portões; explicitar «ninguém» resolveria uma indeterminação que o texto mantém.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com boa legibilidade brasileira. «Descingir» é deliberadamente mais elevado, mas preserva a imagem hebraica; a nota esclarece o idioma. Os marcadores seguem a ordem de ocorrência no texto.
