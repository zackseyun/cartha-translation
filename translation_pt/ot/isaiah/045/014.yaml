id: ISA.45.14
reference: Isaiah 45:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה יְגִ֨יעַ מִצְרַ֥יִם וּֽ/סְחַר כּוּשׁ֮ וּ/סְבָאִים֮ אַנְשֵׁ֣י מִדָּה֒ עָלַ֤יִ/ךְ יַעֲבֹ֨רוּ֙ וְ/לָ֣/ךְ יִֽהְי֔וּ אַחֲרַ֣יִ/ךְ יֵלֵ֔כוּ בַּ/זִּקִּ֖ים יַעֲבֹ֑רוּ וְ/אֵלַ֤יִ/ךְ יִֽשְׁתַּחֲוּוּ֙ אֵלַ֣יִ/ךְ יִתְפַּלָּ֔לוּ אַ֣ךְ בָּ֥/ךְ אֵ֛ל וְ/אֵ֥ין ע֖וֹד אֶ֥פֶס אֱלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/014.yaml
  text: 'Thus says Yahweh: The wealth of Egypt and the merchandise of Cush and the Sabeans[a], men of great stature, will pass over to you and will be yours; they will walk behind you, they will pass over in chains; they will bow down to you, they will pray to you: ‘Surely God is in you, and there is no other[b]; there is no other god.’'
translation:
  language: pt
  text: 'Assim diz Yahweh:

    “A riqueza do Egito, as mercadorias de Cuxe[a]

    e os sebaítas, homens de grande estatura,

    passarão para você e serão seus.

    Andarão atrás de você;

    acorrentados, passarão.

    Eles se curvarão diante de você

    e orarão a você:[b]

    ‘De fato, Deus está em você,

    e não há outro;

    não existe nenhum outro deus.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cuxe é o antigo nome bíblico de uma região ao sul do Egito; não corresponde exatamente às fronteiras da Etiópia moderna.
    reason: cultural_note
  - marker: b
    text: Ou “suplicarão a você”. O verbo hebraico pode indicar oração ou uma súplica insistente.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o de títulos como “Senhor”.
- source_word: יְגִיעַ
  choice: riqueza
  rationale: No paralelismo com סְחַר, designa o fruto material do trabalho do Egito, isto é, seus recursos ou bens.
- source_word: סְחַר
  choice: mercadorias
  rationale: Expressa concretamente bens de comércio e mantém o paralelismo econômico com “riqueza”.
- source_word: כּוּשׁ
  choice: Cuxe
  rationale: Preserva o antigo topônimo hebraico sem identificá-lo de modo anacrônico com um país moderno.
- source_word: סְבָאִים
  choice: sebaítas
  rationale: Representa o povo de Sebá e evita confundi-lo com os sabeus associados a Sabá.
- source_word: אַנְשֵׁי מִדָּה
  choice: homens de grande estatura
  rationale: A expressão idiomática descreve homens de tamanho físico notável; a formulação é natural e mantém a referência masculina.
- source_word: עָלַיִךְ יַעֲבֹרוּ
  choice: passarão para você
  rationale: Comunica o movimento para a esfera ou posse da destinatária feminina singular, sem explicitar além do texto se ela é Sião, Jerusalém ou Israel.
- source_word: וְלָךְ יִהְיוּ
  choice: serão seus
  rationale: Expressa de forma concisa a relação de posse ou sujeição indicada pela construção hebraica.
- source_word: אַחֲרַיִךְ יֵלֵכוּ
  choice: andarão atrás de você
  rationale: Conserva a imagem espacial concreta do hebraico.
- source_word: בַּזִּקִּים
  choice: acorrentados
  rationale: Transmite em português corrente a condição indicada por “em correntes/grilhões”.
- source_word: וְאֵלַיִךְ יִשְׁתַּחֲוּוּ
  choice: eles se curvarão diante de você
  rationale: Preserva o gesto de submissão ou homenagem sem afirmar de antemão que se trata de adoração divina.
- source_word: אֵלַיִךְ יִתְפַּלָּלוּ
  choice: orarão a você
  rationale: Mantém a força usual do verbo e o complemento de segunda pessoa feminina singular, enquanto a nota registra a possibilidade de súplica.
- source_word: אַךְ בָּךְ אֵל
  choice: De fato, Deus está em você
  rationale: Preserva a afirmação enfática e a preposição “em”, central à confissão da presença divina.
- source_word: אֶפֶס אֱלֹהִים
  choice: não existe nenhum outro deus
  rationale: Entende אֱלֹהִים como substantivo comum na negação da existência de qualquer outra divindade.
theological_decisions:
- issue: Se o gesto de יִשְׁתַּחֲוּוּ deve ser apresentado como adoração ou como homenagem/submissão
  choice: eles se curvarão diante de você
  alternative: eles adorarão você
  rationale: A destinatária gramatical é feminina singular. “Curvar-se diante” preserva o ato descrito sem transformar implicitamente a destinatária em divindade; a confissão seguinte identifica Deus como presente nela.
- issue: Se יִתְפַּלָּלוּ descreve oração dirigida à destinatária ou uma súplica feita a ela
  choice: orarão a você, com alternativa em nota
  alternative: suplicarão a você
  rationale: O hebraico emprega um verbo normalmente associado à oração e traz explicitamente o complemento “a você”. Como o contexto também admite uma súplica em reconhecimento do Deus presente nela, a tradução mantém a tensão e registra a alternativa.
- issue: Sentido de בָּךְ na confissão
  choice: Deus está em você
  alternative: Deus está com você
  rationale: A preposição hebraica significa literalmente “em”. A opção evita substituir a imagem de presença interior/localizada pela ideia mais geral de acompanhamento.
- issue: Capitalização do último אֱלֹהִים
  choice: deus, em minúscula
  alternative: Deus, em maiúscula
  rationale: A frase nega a existência de qualquer outra divindade; em português, o substantivo comum “deus” expressa essa função, enquanto “Deus” poderia sugerir apenas a repetição de um nome próprio.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o nome Yahweh, os antigos topônimos e a repetição poética. “Você” reproduz a segunda pessoa feminina singular sem inserir no versículo uma identificação interpretativa da destinatária.
