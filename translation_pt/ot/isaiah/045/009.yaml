  source_fidelity: A tradução transmite corretamente a denúncia, a imagem do barro e a crítica insolente dirigida ao formador. Contudo, «aquilo que você fez» é mais explicativo e menos próximo de וּפָעָלְךָ («a sua obra»), e a nota alternativa está formulada de modo estruturalmente confuso, como se substituísse toda a segunda pergunta.
  naturalness: O registro é moderno, claro e apropriado. «Caco entre os cacos de barro da terra» preserva adequadamente a formulação imagética e elíptica do hebraico. «A sua obra» é natural neste registro e mantém melhor o paralelismo.
  terminology: «Ai», «contende», «barro», «forma» e «mãos» são escolhas adequadas. «A sua obra» preserva a ambiguidade de פָּעָל entre obra/produto, sem a explicitação temporal de «aquilo que você fez». A alternativa «alças» deve ser apresentada somente para a cláusula final e ancorada nela.
  issues:
