  text: ה֗וֹי רָ֚ב אֶת יֹ֣צְר֔/וֹ חֶ֖רֶשׂ אֶת חַרְשֵׂ֣י אֲדָמָ֑ה הֲ/יֹאמַ֨ר חֹ֤מֶר לְ/יֹֽצְר/וֹ֙ מַֽה תַּעֲשֶׂ֔ה וּ/פָעָלְ/ךָ֖ אֵין יָדַ֥יִם לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/009.yaml
  text: Woe to the one who contends with his Maker— a potsherd among the potsherds of the earth! Shall the clay say to the one who forms it[a], “What are you making?” or your work, “He has no hands”?
translation:
  language: pt
  text: 'Ai daquele que contende com quem o formou — um caco entre os cacos de barro da terra! Acaso o barro dirá a quem o forma: “O que você está fazendo?” Ou a sua obra dirá: “Ele não tem mãos[a]”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente, na última frase: “Não tem alças”, entendendo a crítica como dirigida à forma do objeto, e não à capacidade de quem o fez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai daquele
  rationale: Introduz uma denúncia ou advertência profética; a fórmula é natural, solene e clara em português.
- source_word: רָב אֶת יֹצְרוֹ
  choice: daquele que contende com quem o formou
  rationale: רָב expressa disputa ou contestação, e יֹצְרוֹ identifica aquele que o formou. A formulação preserva o vínculo lexical com a imagem posterior do oleiro, sem explicitar além do hebraico a referência a Deus.
- source_word: חֶרֶשׂ אֶת חַרְשֵׂי אֲדָמָה
  choice: um caco entre os cacos de barro da terra
  rationale: A construção é elíptica; “entre” comunica a relação provável. “Caco de barro” é mais acessível que “caco de cerâmica” ou “fragmento de vaso” e mantém a imagem material ligada à terra.
- source_word: הֲיֹאמַר חֹמֶר לְיֹצְרוֹ
  choice: Acaso o barro dirá a quem o forma
  rationale: A pergunta retórica exige resposta negativa. “Barro” e “quem o forma” mantêm a metáfora e a repetição da raiz יצר.
- source_word: מַה תַּעֲשֶׂה
  choice: O que você está fazendo?
  rationale: עשה pode significar fazer ou produzir. O aspecto contextual permite “está fazendo”, natural no diálogo entre a matéria e quem a molda.
- source_word: וּפָעָלְךָ
  choice: Ou aquilo que você fez dirá
  rationale: פֹּעַל designa a obra ou produto. A explicitação de “dirá”, elíptico no hebraico, torna claro o paralelismo sem alterar o sentido.
- source_word: אֵין יָדַיִם לוֹ
  choice: Ele não tem mãos
  rationale: A expressão literal atribui ausência de mãos ao formador e, no contexto, funciona como crítica insolente à sua capacidade. A alternativa “não tem alças” permanece possível e é registrada em nota.
theological_decisions:
- issue: A quem se refere “quem o formou”
  choice: Manter a designação funcional, sem substituir por “Criador” ou “Deus”
  alternative: “seu Criador”
  rationale: O contexto identifica o referente teológico, mas o hebraico usa o particípio “aquele que forma”. Preservar essa linguagem sustenta a metáfora do oleiro e evita explicitação desnecessária.
- issue: Sentido da cláusula final
  choice: 'A obra critica o formador: “Ele não tem mãos”'
  alternative: 'A obra critica sua própria forma: “Ela não tem alças”'
  rationale: A leitura com “mãos” se ajusta melhor à repreensão dirigida à criatura que questiona a competência de quem a formou. Como “alças” é lexicalmente possível no campo da cerâmica, a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” evita a artificialidade regional de “tu” nas formas verbais e mantém clara a fala dirigida ao formador. A pontuação explicita as duas perguntas retóricas e o paralelismo poético.
