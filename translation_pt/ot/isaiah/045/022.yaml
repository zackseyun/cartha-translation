  text: פְּנוּ אֵלַ֥/י וְ/הִוָּשְׁע֖וּ כָּל אַפְסֵי אָ֑רֶץ כִּ֥י אֲנִי אֵ֖ל וְ/אֵ֥ין עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/022.yaml
  text: Turn to me and be saved[a], all the ends of the earth; for I am God, and there is no other.
translation:
  language: pt
  text: Voltem-se para mim e sejam salvos[a], todos os confins da terra, pois eu sou Deus, e não há outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Olhem para mim e sejam salvos”. O verbo hebraico pode indicar voltar-se para alguém e, neste contexto, também pode incluir a ideia de dirigir o olhar para Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: Voltem-se
  rationale: O imperativo plural de פנה expressa voltar-se ou orientar-se em direção a alguém. “Voltem-se” comunica naturalmente o chamado direcional sem restringi-lo ao ato de olhar.
- source_word: אֵלַי
  choice: para mim
  rationale: A preposição אֶל com o sufixo da primeira pessoa indica direção ou orientação para o falante; “para mim” é claro e idiomático.
- source_word: וְהִוָּשְׁעוּ
  choice: e sejam salvos
  rationale: O imperativo plural no nifal de ישׁע é preservado como passivo, apresentando a salvação como algo recebido.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: todos os confins da terra
  rationale: A expressão hebraica designa as regiões mais distantes do mundo. “Todos os confins da terra” preserva a imagem e o alcance universal.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do chamado anterior em linguagem atual e digna.
- source_word: אֲנִי אֵל
  choice: eu sou Deus
  rationale: אֵל funciona aqui como título ou substantivo comum, “Deus”, e não requer transliteração nem a adição interpretativa de “somente”.
- source_word: וְאֵין עוֹד
  choice: e não há outro
  rationale: A formulação expressa exclusividade divina de modo direto, sem acrescentar “além de mim”, que está implícito, mas não aparece explicitamente nesta cláusula.
theological_decisions:
- issue: Exclusividade divina e afirmação monoteísta
  choice: e não há outro
  alternative: e não há nenhum além de mim
  rationale: A tradução mantém a afirmação absoluta da singularidade de Deus e evita explicitar “além de mim” onde o hebraico o deixa implícito.
- issue: Natureza do chamado à salvação
  choice: Voltem-se para mim e sejam salvos
  alternative: Olhem para mim e sejam salvos
  rationale: O verbo pode envolver dirigir o olhar, mas seu sentido mais amplo é voltar-se ou orientar-se para Deus. A formulação escolhida conserva essa amplitude sem definir além do texto a relação entre o voltar-se e a salvação.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sem produzir sintaxe artificial; “confins da terra” mantém a imagem bíblica tradicional e continua compreensível.
