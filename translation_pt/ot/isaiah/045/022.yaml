  source_fidelity: 'A tradução preserva adequadamente os dois imperativos plurais: פְּנוּ é expresso por “Voltem-se para mim”, sem reduzir indevidamente o verbo a um ato meramente visual, e וְהִוָּשְׁעוּ por “sejam salvos”, mantendo o sentido de salvação recebida. “Todos os confins da terra” comunica o alcance universal e a imagem geográfica da expressão hebraica. A cláusula final, “pois eu sou Deus, e não há outro”, reproduz com fidelidade tanto a fundamentação causal quanto a afirmação exclusiva de אֵל e וְאֵין עוֹד.'
