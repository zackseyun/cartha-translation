  terminology: “Deus”, “salvos” e “confins da terra” são escolhas terminológicas adequadas, reconhecíveis e semanticamente proporcionais ao hebraico. A nota lexical apresenta “Olhem para mim” como alternativa legítima, sem tratá-la como o único sentido possível.
