id: ISA.45.18
reference: Isaiah 45:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה בּוֹרֵ֨א הַ/שָּׁמַ֜יִם ה֣וּא הָ/אֱלֹהִ֗ים יֹצֵ֨ר הָ/אָ֤רֶץ וְ/עֹשָׂ/הּ֙ ה֣וּא כֽוֹנְנָ֔/הּ לֹא תֹ֥הוּ בְרָאָ֖/הּ לָ/שֶׁ֣בֶת יְצָרָ֑/הּ אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/018.yaml
  text: 'For thus says Yahweh[a], who created the heavens—he is God—who formed the earth and made it, he established it; he did not create it as a wasteland, but formed it to be inhabited: I am Yahweh, and there is no other.'
translation:
  language: pt
  text: 'Pois assim diz Yahweh, que criou os céus — ele é Deus —, que formou a terra e a fez, ele a estabeleceu; não a criou como uma desolação[a], mas a formou para ser habitada: “Eu sou Yahweh, e não há outro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não a criou vazia”, “não a criou para o caos” ou “não a criou sem forma”. O hebraico tohu pode indicar vazio, desolação ou ausência de forma; aqui, o contraste com “para ser habitada” favorece “desolação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: que criou os céus
  rationale: A oração relativa é natural em português e preserva a força verbal do particípio; o plural “céus” reflete a forma hebraica e o contexto cósmico.
- source_word: הוּא הָאֱלֹהִים
  choice: ele é Deus
  rationale: Mantém a identificação enfática sem acrescentar “somente”, pois a exclusividade é declarada no fim do versículo.
- source_word: יֹצֵר הָאָרֶץ וְעֹשָׂהּ
  choice: que formou a terra e a fez
  rationale: Distingue יצר, com sua nuance de dar forma, de עשה, o verbo mais geral “fazer”.
- source_word: כּוֹנְנָהּ
  choice: ele a estabeleceu
  rationale: Expressa a ideia de firmar ou colocar de modo estável.
- source_word: תֹהוּ
  choice: como uma desolação
  rationale: No contraste com “para ser habitada”, destaca o caráter desolado e inabitável, preservando em nota as demais possibilidades semânticas.
- source_word: לָשֶׁבֶת יְצָרָהּ
  choice: mas a formou para ser habitada
  rationale: Comunica naturalmente a finalidade da formação da terra e conserva a repetição lexical de יצר.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: Preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de תֹהוּ na declaração sobre o propósito da criação
  choice: desolação
  alternative: vazio; caos; sem forma
  rationale: O contraste explícito com a terra destinada a ser habitada favorece uma leitura ligada à desolação ou inabitabilidade, embora o termo hebraico admita outras nuances.
- issue: Força de הוּא הָאֱלֹהִים
  choice: ele é Deus
  alternative: ele é o Deus; somente ele é Deus
  rationale: Preserva a afirmação enfática sem antecipar ou ampliar a exclusividade, que aparece expressamente no encerramento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem sintática próxima do hebraico sem sacrificar a naturalidade. O travessão isola a afirmação enfática “ele é Deus”, e a fala divina final é marcada por aspas.
