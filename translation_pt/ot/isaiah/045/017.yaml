id: ISA.45.17
reference: Isaiah 45:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יִשְׂרָאֵל֙ נוֹשַׁ֣ע בַּ/יהוָ֔ה תְּשׁוּעַ֖ת עוֹלָמִ֑ים לֹא תֵבֹ֥שׁוּ וְ/לֹא תִכָּלְמ֖וּ עַד ע֥וֹלְמֵי עַֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/017.yaml
  text: Israel is saved by Yahweh with an everlasting salvation[b][a]; you will not be put to shame or disgraced forever and ever.
translation:
  language: pt
  text: Israel é salvo por Yahweh[a] com uma salvação eterna; vocês jamais serão envergonhados nem humilhados[b], por toda a eternidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Yahweh”; a preposição hebraica pode indicar tanto esfera quanto agência.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “jamais sentirão vergonha nem serão desonrados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹשַׁע
  choice: é salvo
  rationale: O nifal de ישׁע apresenta a libertação de Israel efetuada por Yahweh. O presente em português preserva o caráter resultativo da forma hebraica e evita restringi-la indevidamente ao passado ou ao futuro.
- source_word: בַּיהוָה
  choice: por Yahweh
  rationale: Com o verbo passivo, ב pode indicar o agente da salvação; “por Yahweh” é natural em português. A possível ideia de esfera, “em Yahweh”, é preservada em nota.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: תְּשׁוּעַת עוֹלָמִים
  choice: com uma salvação eterna
  rationale: A expressão construta significa literalmente uma salvação de duração indefinida ou perpétua. “Salvação eterna” comunica essa duração com naturalidade.
- source_word: לֹא תֵבֹשׁוּ
  choice: jamais serão envergonhados
  rationale: בושׁ pode descrever sofrer vergonha pública ou acabar envergonhado; a forma passiva conserva essa nuance resultativa.
- source_word: וְלֹא תִכָּלְמוּ
  choice: nem humilhados
  rationale: כלם se sobrepõe semanticamente a בושׁ, mas ressalta desonra ou humilhação. A tradução mantém distintos os dois membros do paralelismo.
- source_word: עַד עוֹלְמֵי עַד
  choice: por toda a eternidade
  rationale: A expressão intensifica a duração sem fim. Esta formulação é idiomática e digna em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome da aliança. “Yahweh” o representa como nome próprio sem substituí-lo por um título.
- issue: Nuance de agência ou esfera em בַּיהוָה
  choice: por Yahweh
  alternative: em Yahweh; mediante Yahweh
  rationale: A construção com o verbo passivo favorece a leitura de agência, mas a preposição hebraica também admite a ideia de esfera. A nota mantém essa ambiguidade legítima.
- issue: Valor temporal de נוֹשַׁע
  choice: é salvo
  alternative: foi salvo; será salvo
  rationale: A forma perfeita pode apresentar a salvação como realizada ou certa no discurso profético. O presente português conserva o aspecto resultativo sem fixar exclusivamente passado ou futuro.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no mundo lusófono. O plural “vocês” explicita que os verbos hebraicos se dirigem coletivamente a Israel.
