  text: לְמַ֨עַן֙ עַבְדִּ֣/י יַעֲקֹ֔ב וְ/יִשְׂרָאֵ֖ל בְּחִירִ֑/י וָ/אֶקְרָ֤א לְ/ךָ֙ בִּ/שְׁמֶ֔/ךָ אֲכַנְּ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/004.yaml
  text: For the sake of my servant Jacob[a], and Israel my chosen one, I called you by your name; I surnamed you, though you did not know me.
translation:
  language: pt
  text: Por causa de Jacó, meu servo, e de Israel, meu escolhido, eu o chamei pelo nome; dei-lhe um título[a], embora não me conhecesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: dei-lhe um nome, ou atribuí-lhe uma designação. O verbo hebraico pode indicar a concessão de um nome ou título.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Por causa de
  rationale: Expressa a razão ou o propósito da ação divina em favor de Jacó/Israel, de modo claro e natural em português.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Preserva a designação honrosa e pactual de Jacó sem salientar indevidamente a ideia de escravidão.
- source_word: בְּחִירִי
  choice: meu escolhido
  rationale: Reproduz o adjetivo substantivado aplicado a Israel e mantém seu caráter pessoal.
- source_word: וָאֶקְרָא לְךָ בִּשְׁמֶךָ
  choice: eu o chamei pelo nome
  rationale: Traduz a designação e convocação pessoal expressa pelo idioma hebraico, em formulação portuguesa natural.
- source_word: אֲכַנְּךָ
  choice: dei-lhe um título
  rationale: O piel de כנה indica atribuir uma designação, nome ou título. A formulação preserva esse sentido sem acrescentar explicitamente a noção interpretativa de honra.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: embora não me conhecesse
  rationale: 'A conjunção é entendida concessivamente no contexto: Deus chamou e designou Ciro apesar de este não o conhecer.'
theological_decisions:
- issue: A falta de conhecimento de Deus por parte do destinatário
  choice: O texto afirma que Deus chamou e designou o governante, embora este não o conhecesse.
  alternative: Entender a frase apenas como falta de pleno reconhecimento de Deus.
  rationale: O contexto identifica o destinatário como Ciro e mantém a tensão de Deus comissionar um governante estrangeiro que não o conhecia, sem sugerir uma conversão posterior.
- issue: Referência a Deus no sufixo de primeira pessoa
  choice: Traduzir simplesmente por “me”.
  alternative: Expandir para “o SENHOR”.
  rationale: O hebraico traz apenas o objeto de primeira pessoa; “me” é textualmente preciso, pois o contexto já identifica quem fala.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção pronominal de terceira pessoa adequada tanto à leitura brasileira quanto à internacional. A ambiguidade lexical de אֲכַנְּךָ é preservada por meio de nota.
