  text: אֲנִי֙ לְ/פָנֶ֣י/ךָ אֵלֵ֔ךְ וַ/הֲדוּרִ֖ים אושר דַּלְת֤וֹת נְחוּשָׁה֙ אֲשַׁבֵּ֔ר וּ/בְרִיחֵ֥י בַרְזֶ֖ל אֲגַדֵּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/002.yaml
  text: I myself will go before you[a], and I will level the rough places; I will break in pieces doors of bronze, and I will cut through bars of iron.
translation:
  language: pt
  text: Eu mesmo irei à sua frente e aplanarei os lugares acidentados;[a] despedaçarei as portas de bronze e cortarei as barras de ferro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e tornarei planos os lugares irregulares”. A expressão hebraica é textual e lexicalmente difícil; algumas traduções a entendem mais especificamente como “montanhas” ou “lugares elevados”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְפָנֶיךָ
  choice: à sua frente
  rationale: Expressa naturalmente em português a ideia espacial e antecipatória de ir adiante de alguém.
- source_word: אֵלֵךְ
  choice: irei
  rationale: O imperfeito na promessa profética tem sentido futuro.
- source_word: וַהֲדוּרִים אושר
  choice: e aplanarei os lugares acidentados
  rationale: A frase hebraica é textual e lexicalmente difícil. Esta formulação conserva o provável contraste entre terreno irregular ou elevado e sua nivelação, sem restringi-lo a montanhas.
- source_word: דַּלְתוֹת נְחוּשָׁה
  choice: portas de bronze
  rationale: דְּלָתוֹת significa literalmente 'portas', e נְחוּשָׁה designa bronze neste contexto.
- source_word: אֲשַׁבֵּר
  choice: despedaçarei
  rationale: O piel comunica uma ação intensa, mais forte que simplesmente 'quebrarei'.
- source_word: בְרִיחֵי בַרְזֶל
  choice: trancas de ferro
  rationale: בְּרִיחַ pode indicar a barra ou tranca que mantém uma porta fechada; 'trancas' é claro e natural em português.
- source_word: אֲגַדֵּעַ
  choice: cortarei
  rationale: O verbo denota cortar ou seccionar; com 'trancas', 'cortarei' comunica sua remoção decisiva sem acrescentar uma direção não explícita.
theological_decisions:
- issue: Ênfase na autoidentificação divina
  choice: Eu mesmo irei à sua frente
  alternative: Eu irei à sua frente
  rationale: O pronome explícito אֲנִי é enfático. 'Eu mesmo' preserva a ênfase no compromisso pessoal de YHWH sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém o paralelismo poético e sinaliza em nota a dificuldade da segunda oração.
