  text: בּ֥וֹשׁוּ וְ/גַֽם נִכְלְמ֖וּ כֻּלָּ֑/ם יַחְדָּו֙ הָלְכ֣וּ בַ/כְּלִמָּ֔ה חָרָשֵׁ֖י צִירִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/016.yaml
  text: They are put to shame and also humiliated[a], all of them together; the makers of idols go in disgrace.
translation:
  language: pt
  text: Todos eles serão envergonhados e até humilhados; os fabricantes de ídolos, todos juntos, cairão em desonra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os artesãos de imagens cairão em desonra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשׁוּ
  choice: serão envergonhados
  rationale: O perfeito profético apresenta como certa a vergonha pública futura; a forma passiva é natural em português e se ajusta ao contexto.
- source_word: וְגַם נִכְלְמוּ
  choice: e até humilhados
  rationale: “Até” preserva a força intensificadora de וְגַם, enquanto “humilhados” mantém a progressão paralela sem repetir “envergonhados”.
- source_word: כֻּלָּם יַחְדָּו
  choice: todos eles ... juntos
  rationale: Reproduz tanto a totalidade expressa pelo sufixo quanto o destino coletivo enfatizado por יַחְדָּו.
- source_word: הָלְכוּ בַכְּלִמָּה
  choice: cairão em desonra
  rationale: הלך com בַכְּלִמָּה descreve idiomaticamente a entrada num estado de ignomínia; “cairão em desonra” soa natural e conserva o valor profético.
- source_word: חָרָשֵׁי צִירִים
  choice: fabricantes de ídolos
  rationale: חָרָשֵׁי designa artesãos ou fabricantes, e צִירִים, no contexto da polêmica contra a idolatria, refere-se a imagens cultuais.
theological_decisions:
- issue: Referente de חָרָשֵׁי צִירִים
  choice: fabricantes de ídolos
  alternative: artesãos de imagens
  rationale: O contexto imediato contrasta o SENHOR com deuses fabricados; “ídolos” torna claro o referente cultual, enquanto a nota preserva a alternativa lexical mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com futuro profético explícito. A ordem foi levemente reorganizada para fluência, sem eliminar o paralelismo nem a ênfase coletiva do hebraico.
