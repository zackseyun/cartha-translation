reference: Isaiah 45:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְמַ֣עַן יֵדְע֗וּ מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ וּ/מִ/מַּ֣עֲרָבָ֔/הּ כִּי אֶ֖פֶס בִּלְעָדָ֑/י אֲנִ֥י יְהוָ֖ה וְ/אֵ֥ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/006.yaml
  text: so that they may know[a], from the rising of the sun and from its setting, that there is none besides me. I am Yahweh[b], and there is no other.
translation:
  language: pt
  text: para que saibam, desde o nascer do sol até o seu pôr,[a] que não há ninguém além de mim. Eu sou Yahweh,[b] e não há outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do leste ao oeste”; literalmente, “desde o nascer do sol e desde o seu pôr”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: para que saibam
  rationale: Expressa naturalmente em português a finalidade indicada por לְמַעַן com o imperfeito, sem convertê-la em simples afirmação futura.
- source_word: מִמִּזְרַח שֶׁמֶשׁ וּמִמַּעֲרָבָהּ
  choice: desde o nascer do sol até o seu pôr
  rationale: Preserva a imagem solar e a referência pronominal ao sol; “desde... até...” comunica em português o alcance geográfico entre os dois extremos.
- source_word: כִּי
  choice: que
  rationale: Introduz o conteúdo do conhecimento pretendido.
- source_word: אֶפֶס בִּלְעָדָי
  choice: não há ninguém além de mim
  rationale: Comunica a exclusividade pessoal no contexto de modo claro e atual; evita que “nada” sugira uma afirmação sobre a inexistência de toda a criação.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Mantém o pronome enfático e translitera o nome divino presente no hebraico.
- source_word: וְאֵין עוֹד
  choice: e não há outro
  rationale: Reproduz com concisão a fórmula enfática de exclusividade, sem acrescentar uma especificação ausente do texto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama; “Yahweh” conserva o nome próprio, enquanto a nota registra a convenção tradicional portuguesa.
- issue: Alcance da expressão geográfica
  choice: desde o nascer do sol até o seu pôr
  alternative: do leste ao oeste
  rationale: A formulação mantém a imagem poética hebraica e também torna perceptível seu sentido de abrangência geográfica.
- issue: Fórmula de exclusividade
  choice: não há ninguém além de mim ... não há outro
  alternative: nada há além de mim ... não existe mais nenhum
  rationale: Preserva a afirmação enfática da singularidade de Yahweh sem desenvolver o enunciado em categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A poesia solar foi preservada, mas a coordenação hebraica foi vertida como “desde... até...” para soar natural e explicitar os extremos abrangidos. Os marcadores foram alinhados ao conteúdo efetivo das notas, corrigindo a aparente inversão existente na camada inglesa fornecida.
