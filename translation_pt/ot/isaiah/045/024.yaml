  text: אַ֧ךְ בַּ/יהוָ֛ה לִ֥/י אָמַ֖ר צְדָק֣וֹת וָ/עֹ֑ז עָדָי/ו֙ יָב֣וֹא וְ/יֵבֹ֔שׁוּ כֹּ֖ל הַ/נֶּחֱרִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/024.yaml
  text: Only in Yahweh[a], it shall be said of me, are righteousness and strength; to him they shall come[b], and all who were enraged against him shall be put to shame.
translation:
  language: pt
  text: 'Certamente, dir-se-á: “Em Yahweh há para mim justiça[a] e força”. A ele virão, e todos os que se enfureceram contra ele ficarão envergonhados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz “justiças”, no plural, podendo também indicar atos de justiça ou vindicações. A fórmula inicial é sintaticamente condensada; também pode ser entendida como uma confissão pessoal: “Somente em Yahweh tenho justiça e força”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: 'Expressa aqui exclusividade e ênfase: justiça e força se encontram unicamente em Yahweh.'
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב indica a esfera ou fonte em que se acham justiça e força; o nome divino יהוה é transliterado como “Yahweh”.
- source_word: לִי אָמַר
  choice: A meu respeito se dirá
  rationale: A construção poética é sintaticamente condensada. A formulação conserva o pronome de primeira pessoa e o caráter impessoal ou reportivo sem identificar à força um sujeito para אָמַר.
- source_word: צְדָקוֹת
  choice: justiça
  rationale: Embora a forma hebraica seja plural, neste paralelismo com “força” o substantivo abstrato singular é natural em português e mantém a amplitude semântica; a nuance plural é registrada em nota.
- source_word: וָעֹז
  choice: e força
  rationale: עֹז designa força ou poder; “força” é claro, atual e adequado ao paralelismo.
- source_word: עָדָיו יָבוֹא
  choice: A ele virão
  rationale: עָדָיו indica movimento em direção a Yahweh. O verbo singular pode ter sentido coletivo, explicitado pelo grupo plural mencionado na continuação.
- source_word: וְיֵבֹשׁוּ
  choice: e ficarão envergonhados
  rationale: בוש descreve o resultado de vergonha ou desonra; a expressão portuguesa preserva esse valor resultativo.
- source_word: כֹּל הַנֶּחֱרִים בּוֹ
  choice: todos os que se enfureceram contra ele
  rationale: O particípio de חרה comunica ira intensa, e בּוֹ assinala que essa hostilidade é dirigida contra Yahweh.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de צְדָקוֹת atribuído a Yahweh
  choice: justiça
  alternative: atos de justiça; vindicações
  rationale: “Justiça” mantém a amplitude moral, relacional e judicial do termo, sem restringi-lo a um único aspecto; o plural e as alternativas são indicados em nota.
- issue: Fórmula ambígua לִי אָמַר
  choice: A meu respeito se dirá
  alternative: 'Alguém dirá: “Somente em Yahweh há justiça e força”; Ele me disse'
  rationale: A sintaxe hebraica admite mais de uma análise. A leitura principal preserva tanto a primeira pessoa quanto o caráter reportivo, e a nota mantém aberta a principal alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção direta e vocabulário corrente. A ordem da primeira oração foi ajustada para soar natural em português, sem eliminar a ambiguidade do hebraico, que é preservada na nota.
