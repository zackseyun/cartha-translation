- from: A meu respeito se dirá:[a] “Somente em Yahweh há justiça[b] e força”. A ele virão, e ficarão envergonhados todos os que se enfureceram contra ele.
  to: 'Certamente, dir-se-á: “Em Yahweh há para mim justiça[a] e força”. A ele virão, e todos os que se enfureceram contra ele ficarão envergonhados.'
  rationale: A revisão substitui “A meu respeito” por “para mim”, preservando de modo mais próximo o valor normal de לִי e mantendo a elipse do hebraico por meio de “dir-se-á”. A nota registra a possibilidade confessional sem impor uma identificação de falante ou uma análise sintática controversa. O restante do versículo é mantido, com leve ajuste de ordem para que “todos” seja inequivocamente o sujeito de “ficarão envergonhados”.
