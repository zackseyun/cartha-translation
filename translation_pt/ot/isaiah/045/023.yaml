base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/023.yaml
  text: 'By myself I have sworn[a]; from my mouth has gone out a righteous word, and it will not return: to me every knee will bow[b], every tongue will swear allegiance.'
translation:
  language: pt
  text: 'Por mim mesmo jurei; da minha boca saiu uma palavra justa[a], e ela não voltará: a mim todo joelho se dobrará, toda língua jurará[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma palavra proferida com justiça”. A expressão hebraica pode enfatizar tanto a justiça da palavra quanto o fato de ela ser proferida com justiça.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “prestará juramento”; no contexto, o juramento pode expressar lealdade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Por mim mesmo jurei
  rationale: A fórmula hebraica expressa que o próprio SENHOR é a garantia do juramento. A construção é natural em português e preserva a ênfase reflexiva.
- source_word: יָצָא מִפִּי
  choice: da minha boca saiu
  rationale: Mantém a imagem concreta da palavra que procede da boca divina, com ordem natural em português.
- source_word: צְדָקָה דָּבָר
  choice: uma palavra justa
  rationale: A expressão hebraica é compacta e admite mais de uma relação sintática. Esta opção conserva o sentido de justiça ou retidão sem reduzir a palavra apenas a uma afirmação verdadeira ou interpretá-la especificamente como decreto.
- source_word: וְלֹא יָשׁוּב
  choice: e ela não voltará atrás
  rationale: Preserva a metáfora hebraica do não retorno da palavra; o pronome explicita em português que o referente é 'palavra'.
- source_word: לִי תִּכְרַע כָּל בֶּרֶךְ
  choice: diante de mim todo joelho se dobrará
  rationale: Embora לִי seja literalmente 'a mim', 'diante de mim' comunica de modo idiomático em português o gesto corporal dirigido ao SENHOR, sem alterar sua natureza de submissão ou homenagem.
- source_word: תִּשָּׁבַע כָּל לָשׁוֹן
  choice: toda língua jurará
  rationale: Mantém a amplitude do verbo hebraico de jurar ou prestar juramento e evita tornar explícita uma lealdade que, embora plausível no contexto, não está lexicalmente especificada.
theological_decisions:
- issue: Natureza da submissão universal
  choice: todo joelho se dobrará, e toda língua jurará
  alternative: todo joelho se dobrará, e toda língua jurará lealdade
  rationale: A tradução afirma a homenagem e o juramento universais dirigidos ao SENHOR, mas não determina se a submissão é voluntária ou forçada nem acrescenta uma formulação doutrinária posterior.
- issue: Relação de צְדָקָה com דָּבָר
  choice: uma palavra justa
  alternative: uma palavra proferida com justiça
  rationale: A construção hebraica permite destacar tanto a retidão da palavra quanto a justiça com que é proferida. O texto principal adota a leitura adjetival natural, e a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantém as imagens concretas do hebraico e evita linguagem excessivamente arcaica. Os marcadores [a] e [b] aparecem no texto principal.
