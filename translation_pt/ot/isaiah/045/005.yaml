id: ISA.45.5
reference: Isaiah 45:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲנִ֤י יְהוָה֙ וְ/אֵ֣ין ע֔וֹד זוּלָתִ֖/י אֵ֣ין אֱלֹהִ֑ים אֲאַזֶּרְ/ךָ֖ וְ/לֹ֥א יְדַעְתָּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/005.yaml
  text: I am Yahweh[a], and there is no other; besides me there is no God. I strengthen you, though you have not known me.
translation:
  language: pt
  text: Eu sou Yahweh, e não há outro; além de mim não há Deus. Eu o fortaleço[a], embora você não me conheça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o armo”; ou: “Eu o cinjo”. O verbo hebraico pode indicar cingir ou equipar alguém com força.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְאֵין עוֹד
  choice: e não há outro
  rationale: Expressa de modo natural e direto a afirmação absoluta de exclusividade.
- source_word: זוּלָתִי
  choice: além de mim
  rationale: Preserva a ideia de exclusão em relação ao falante e o paralelismo da frase.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, a referência é ao único Deus verdadeiro; a inicial maiúscula comunica adequadamente a afirmação monoteísta.
- source_word: אֲאַזֶּרְךָ
  choice: Eu o fortaleço
  rationale: O piel de אזר pode significar cingir, equipar ou fortalecer. A opção escolhida comunica com clareza que Yahweh capacita Ciro para agir, sem eliminar as alternativas lexicais, registradas em nota.
- source_word: וְלֹא יְדַעְתָּנִי
  choice: embora você não me conheça
  rationale: 'A conjunção é entendida em sentido concessivo no contexto: Yahweh capacita Ciro apesar de ele não o conhecer. A formulação preserva o sentido relacional de ידע sem especificá-lo além do texto.'
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Valor da conjunção na oração final
  choice: embora você não me conheça
  alternative: e você não me conhece
  rationale: O valor concessivo se ajusta ao contexto da capacitação soberana de Ciro sem seu reconhecimento prévio de Yahweh, mantendo a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O pronome “você” torna explícito o destinatário singular masculino por meio de “o”, sem acrescentar seu nome ao versículo. A repetição de “não há” conserva o paralelismo enfático do hebraico.
