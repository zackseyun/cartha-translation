id: ISA.45.13
reference: Isaiah 45:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָנֹכִי֙ הַעִירֹתִ֣/הֽוּ בְ/צֶ֔דֶק וְ/כָל דְּרָכָ֖י/ו אֲיַשֵּׁ֑ר הֽוּא יִבְנֶ֤ה עִירִ/י֙ וְ/גָלוּתִ֣/י יְשַׁלֵּ֔חַ לֹ֤א בִ/מְחִיר֙ וְ/לֹ֣א בְ/שֹׁ֔חַד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/013.yaml
  text: I have stirred him up in righteousness[a], and I will make all his ways straight. He will rebuild my city and send my exiles away, not for a price and not for a bribe[c][b], says Yahweh of Armies.
translation:
  language: pt
  text: Eu o despertei em justiça[a] e endireitarei todos os seus caminhos. Ele reconstruirá a minha cidade[b] e libertará os meus exilados, sem pagamento nem suborno, diz Yahweh dos Exércitos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu o suscitei com justiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Ele construirá a minha cidade”. “Reconstruirá” reflete o contexto da restauração de Jerusalém.'
    reason: lexical_alternative
  - marker: c
    text: 'Tradução tradicional: “SENHOR dos Exércitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִירֹתִהוּ
  choice: Eu o despertei
  rationale: O hifil de עור expressa despertar, incitar ou mobilizar. “Despertei” conserva a ação causativa de Deus sem sugerir necessariamente elevação a um cargo.
- source_word: בְצֶדֶק
  choice: em justiça
  rationale: Mantém de forma concisa a amplitude moral e jurídica de צדק e preserva a possível relação instrumental ou qualificativa da preposição.
- source_word: וְכָל־דְּרָכָיו אֲיַשֵּׁר
  choice: e endireitarei todos os seus caminhos
  rationale: Reproduz a metáfora de tornar retos os caminhos, isto é, preparar ou dirigir favoravelmente o curso de sua missão.
- source_word: יִבְנֶה עִירִי
  choice: Ele reconstruirá a minha cidade
  rationale: Embora בנה signifique literalmente “construir”, o contexto da restauração de Jerusalém torna “reconstruirá” natural; a nota preserva a forma lexical simples.
- source_word: גָלוּתִי
  choice: os meus exilados
  rationale: Neste contexto, o substantivo pode designar a comunidade levada ao exílio, não apenas a condição abstrata de cativeiro.
- source_word: יְשַׁלֵּחַ
  choice: libertará
  rationale: No piel, שלח pode significar mandar embora, deixar ir ou soltar. Com pessoas exiladas, “libertará” comunica naturalmente a permissão de partir sem acrescentar um destino não expresso.
- source_word: לֹא בִמְחִיר וְלֹא בְשֹׁחַד
  choice: sem pagamento nem suborno
  rationale: 'Expressa em português corrente os dois meios negados: contraprestação econômica e incentivo corrupto.'
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צבאות de modo transparente, preservando sua força plural e militar.
theological_decisions:
- issue: Identidade do referente dos pronomes masculinos
  choice: Manter “o” e “ele” sem nomear Ciro
  alternative: Explicitar “Ciro” no texto principal
  rationale: O contexto identifica Ciro, mas o versículo emprega pronomes; mantê-los respeita a forma do texto hebraico.
- issue: Sentido de בְצֶדֶק
  choice: “em justiça”
  alternative: “para a justiça” ou “com justiça”
  rationale: A construção hebraica permite nuances de esfera, modo ou propósito. “Em justiça” preserva essa tensão sem restringi-la.
- issue: Representação do nome יהוה
  choice: “Yahweh”
  alternative: “SENHOR” ou “Jeová”
  rationale: O texto traz o nome próprio divino; “Yahweh” o representa diretamente, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o paralelismo hebraico sem soar artificial; as notas registram alternativas genuínas e evitam resolver ambiguidades além do necessário.
