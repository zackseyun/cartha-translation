source:
  edition: WLC
  text: הַרְעִ֤יפוּ שָׁמַ֨יִם֙ מִ/מַּ֔עַל וּ/שְׁחָקִ֖ים יִזְּלוּ צֶ֑דֶק תִּפְתַּח אֶ֣רֶץ וְ/יִפְרוּ יֶ֗שַׁע וּ/צְדָקָ֤ה תַצְמִ֨יחַ֙ יַ֔חַד אֲנִ֥י יְהוָ֖ה בְּרָאתִֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/045/008.yaml
  text: Drip down from above[a], O heavens, and let the clouds pour down righteousness; let the earth open, that salvation may sprout, and let righteousness spring up together. I, Yahweh, have created it.
translation:
  language: pt
  text: Destilai do alto, ó céus, e que as nuvens derramem justiça[a]; abra-se a terra, para que a salvação frutifique e a justiça brote juntamente. Eu, Yahweh, criei isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”; as palavras hebraicas צֶדֶק e צְדָקָה podem indicar justiça, retidão ou aquilo que é justo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְעִיפוּ
  choice: Destilai
  rationale: O imperativo plural de רָעַף descreve o gotejar ou destilar vindo de cima. “Destilai” preserva a imagem poética sem sugerir necessariamente uma tempestade.
- source_word: שָׁמַיִם מִמַּעַל
  choice: do alto, ó céus
  rationale: Mantém a invocação cósmica e a direção vertical do hebraico em português poético e inteligível.
- source_word: וּשְׁחָקִים יִזְּלוּ
  choice: e que as nuvens derramem
  rationale: שְׁחָקִים designa os céus carregados de nuvens, enquanto נזל expressa fluxo descendente; “derramem” comunica a imagem de precipitação com naturalidade.
- source_word: צֶדֶק / צְדָקָה
  choice: justiça
  rationale: Neste anúncio público e cósmico de salvação, “justiça” expressa de modo natural a ordem justa e salvadora de Deus. A repetição do mesmo radical é preservada nas duas ocorrências.
- source_word: תִּפְתַּח אֶרֶץ
  choice: abra-se a terra
  rationale: Reproduz a força volitiva da sequência poética e mantém a escala cósmica de אֶרֶץ.
- source_word: וְיִפְרוּ יֶשַׁע
  choice: e brote a salvação
  rationale: Embora פרה costume significar frutificar, aqui a terra que se abre e o paralelismo vegetal com צמח favorecem “brote”, sem eliminar a imagem de fecundidade.
- source_word: וּצְדָקָה תַצְמִיחַ יַחַד
  choice: e juntamente faça germinar a justiça
  rationale: A forma verbal feminina singular pode ter “terra” como sujeito; esta tradução preserva essa sintaxe possível e traduz יחד como simultaneidade.
- source_word: אֲנִי יְהוָה
  choice: Eu, Yahweh
  rationale: Preserva o nome divino explícito e a construção enfática por aposição.
- source_word: בְּרָאתִיו
  choice: criei isso
  rationale: Traduz ברא por “criar” e conserva a referência abrangente e não totalmente especificada do sufixo masculino singular mediante “isso”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio da aliança; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de צֶדֶק / צְדָקָה
  choice: justiça
  alternative: retidão
  rationale: Os termos abrangem tanto conformidade moral e relacional quanto justiça. O contexto de salvação que desce e germina favorece “justiça”, mas a alternativa legítima é registrada em nota.
- issue: Sujeito de תַצְמִיחַ
  choice: a terra faz germinar a justiça
  alternative: a justiça germina
  rationale: O verbo está no feminino singular e pode retomar אֶרֶץ, “terra”. A poesia comprimida também permite entender a justiça como aquilo que surge; a tradução mantém a leitura sintaticamente direta sem excluir a imagem alternativa.
- issue: Referente do sufixo em בְּרָאתִיו
  choice: o conjunto do acontecimento descrito
  alternative: a salvação
  rationale: O sufixo masculino singular não concorda com צְדָקָה, feminino, e pode resumir toda a realidade salvadora descrita. “Isso” evita especificar demais o referente.
translation_notes:
  register: Português moderno, solene e poético. A segunda pessoa plural em “Destilai” foi mantida por corresponder à invocação direta aos “céus”; as demais formas volitivas usam construções naturais com subjuntivo. A repetição de “justiça” conserva a ligação lexical e retórica do hebraico.
