revisions:
- from: Destilai do alto, ó céus, e que as nuvens derramem justiça[a]; abra-se a terra, e brote a salvação, e juntamente faça germinar a justiça. Eu, Yahweh, criei isso.
  to: Destilai do alto, ó céus, e que as nuvens derramem justiça[a]; abra-se a terra, para que a salvação frutifique e a justiça brote juntamente. Eu, Yahweh, criei isso.
  rationale: A revisão substitui “brote a salvação” por “a salvação frutifique”, distinguindo פרה de צמח. Também reformula a última oração para português mais claro, preservando a associação poética entre o surgimento da salvação e da justiça e sem tornar definitiva a relação sintática debatida entre “terra” e o verbo causativo feminino.
