  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשׁוּב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂיג֔וּ/ן נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/011.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing[a]; everlasting joy will be upon their heads; gladness and joy will overtake them[b]; sorrow and sighing will flee away.
translation:
  language: pt
  text: E os resgatados de Yahweh voltarão e chegarão a Sião com canto de alegria[a]. Alegria eterna estará sobre a cabeça deles; júbilo e alegria os alcançarão[b]; a tristeza e o gemido fugirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com gritos de alegria”; o termo hebraico pode indicar tanto canto jubiloso como aclamações de alegria.
    reason: lexical_alternative
  - marker: b
    text: Ou “os apanharão”; o verbo hebraico significa literalmente “alcançar” ou “apanhar” e retrata o júbilo e a alegria como se fossem atrás deles até alcançá-los.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְדוּיֵי
  choice: os resgatados
  rationale: O particípio passivo de פדה designa os que foram resgatados ou redimidos. “Os resgatados” é claro em português e mantém a imagem de libertação mediante resgate.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְשׁוּבוּן
  choice: voltarão
  rationale: שוב significa voltar ou retornar; o futuro se ajusta ao anúncio profético de restauração.
- source_word: וּבָאוּ
  choice: e chegarão
  rationale: בוא significa vir, chegar ou entrar. “Chegarão a Sião” expressa naturalmente em português o movimento até o destino, sem alterar a sequência hebraica.
- source_word: צִיּוֹן
  choice: Sião
  rationale: Mantém o nome próprio e sua ressonância geográfica, poética e teológica.
- source_word: בְּרִנָּה
  choice: com canto de alegria
  rationale: רִנָּה pode indicar canto jubiloso ou grito de alegria. A tradução comunica celebração vocal e a nota preserva a amplitude lexical.
- source_word: שִׂמְחַת עוֹלָם
  choice: alegria eterna
  rationale: A construção denota alegria duradoura, para sempre. “Alegria eterna” é conciso, natural e conserva a força temporal de עוֹלָם.
- source_word: עַל רֹאשָׁם
  choice: sobre a cabeça deles
  rationale: Preserva a imagem poética da alegria repousando sobre eles, como uma coroa.
- source_word: שָׂשׂוֹן
  choice: júbilo
  rationale: “Júbilo” diferencia este termo de שִׂמְחָה e mantém o paralelismo de sinônimos sem reduzi-los à mesma palavra.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: É a correspondência portuguesa mais direta e, ao lado de “júbilo”, forma uma dupla poética natural.
- source_word: יַשִּׂיגוּן
  choice: os alcançarão
  rationale: O hifil de נשׂג pode significar alcançar, apanhar ou sobrevir. “Os alcançarão” mantém a personificação do júbilo e da alegria como se fossem atrás deles.
- source_word: יָגוֹן וַאֲנָחָה
  choice: a tristeza e o gemido
  rationale: A dupla exprime sofrimento interior e sua manifestação audível. “Gemido” é natural e preserva a dimensão corporal de אֲנָחָה.
- source_word: נָסוּ
  choice: fugirão
  rationale: Embora seja uma forma qatal, no contexto profético funciona como resultado futuro da restauração e conserva a vívida personificação da tristeza e do gemido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração preserva o nome pessoal, sem substituí-lo por um título ou adotar outra forma tradicional.
- issue: Valor temporal de נָסוּ na poesia profética
  choice: 'futuro resultativo: “fugirão”'
  alternative: 'perfeito: “fugiram”; presente: “fogem”'
  rationale: A forma qatal aparece no quadro de uma restauração anunciada para o futuro e descreve seu resultado. O futuro em português mantém a coerência temporal do oráculo sem apagar a forma hebraica, cuja nuance é registrada aqui.
- issue: Personificação em יַשִּׂיגוּן
  choice: júbilo e alegria como sujeitos que “os alcançarão”
  alternative: eles obterão júbilo e alegria
  rationale: A ordem e a sintaxe hebraicas favorecem a leitura em que júbilo e alegria alcançam os resgatados. Essa leitura mantém a imagem poética sem transformar desnecessariamente as emoções em objetos adquiridos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e as personificações do hebraico foram mantidas. “Cabeça” permanece no singular distributivo, como no texto hebraico, e as notas registram alternativas lexicais genuínas sem sobrecarregar o versículo.
