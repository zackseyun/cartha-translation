  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אָשִׂ֤ים דְּבָרַ/י֙ בְּ/פִ֔י/ךָ וּ/בְ/צֵ֥ל יָדִ֖/י כִּסִּיתִ֑י/ךָ לִ/נְטֹ֤עַ שָׁמַ֨יִם֙ וְ/לִ/יסֹ֣ד אָ֔רֶץ וְ/לֵ/אמֹ֥ר לְ/צִיּ֖וֹן עַמִּ/י אָֽתָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/016.yaml
  text: And I have put my words in your mouth[a], and covered you with the shadow of my hand, to plant the heavens and to found the earth, and to say to Zion[b], ‘You are my people.’
translation:
  language: pt
  text: 'Pus as minhas palavras na sua boca e cobri você com a sombra da minha mão[a], para plantar os céus[b], lançar os fundamentos da terra e dizer a Sião: “Você é o meu povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobri você à sombra da minha mão” ou “sob a sombra da minha mão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estabelecer os céus”. O hebraico diz literalmente “plantar os céus”, imagem incomum que pode evocar a criação ou a restauração como nova criação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: Pus
  rationale: O verbo שׂים significa “pôr, colocar”. O perfeito em português expressa de modo conciso a ação apresentada como realizada ou assegurada no contexto, em paralelo com “cobri”.
- source_word: דְּבָרַי בְּפִיךָ
  choice: as minhas palavras na sua boca
  rationale: Mantém o plural hebraico “minhas palavras” e a imagem concreta de colocar a mensagem na boca do destinatário, própria de uma comissão profética.
- source_word: וּבְצֵל יָדִי כִּסִּיתִיךָ
  choice: e cobri você com a sombra da minha mão
  rationale: Preserva o sentido básico de כסה, “cobrir”, e a metáfora protetora da sombra da mão. A preposição ב pode ser entendida de modo instrumental ou locativo.
- source_word: לִנְטֹעַ שָׁמַיִם
  choice: para plantar os céus
  rationale: נטע normalmente significa “plantar”. A formulação conserva a imagem incomum e vigorosa do hebraico, sem substituí-la por “estender” nem limitar seu sentido à restauração.
- source_word: וְלִיסֹד אָרֶץ
  choice: lançar os fundamentos da terra
  rationale: יסד denota fundar, estabelecer ou lançar alicerces. Esta formulação portuguesa comunica com naturalidade a imagem de fundação presente no verbo.
- source_word: וְלֵאמֹר לְצִיּוֹן
  choice: e dizer a Sião
  rationale: Traduz diretamente o verbo comum אמר, sem elevar desnecessariamente o registro para “declarar”.
- source_word: עַמִּי אָתָּה
  choice: Você é o meu povo
  rationale: Reproduz a identificação pactual e mantém Sião personificada como destinatário singular, embora o predicativo “meu povo” seja coletivo.
theological_decisions:
- issue: Referente da segunda pessoa do singular
  choice: Mantida a referência singular por meio de “sua” e “você”, sem identificar o destinatário.
  alternative: Explicitar o servo, o profeta ou Israel/Sião personificado.
  rationale: O versículo hebraico não identifica expressamente o destinatário de “sua boca” e “cobri você”. A tradução conserva essa ambiguidade genuína.
- issue: 'Finalidade cósmica: plantar os céus e fundar a terra'
  choice: Mantida a linguagem de criação na formulação principal.
  alternative: Interpretar explicitamente as expressões como metáfora da restauração de Israel ou como descrição exclusivamente literal da criação cósmica.
  rationale: O texto entrelaça linguagem de criação e redenção sem explicar aqui a relação entre elas; a tradução não deve reduzir essa tensão a apenas uma leitura.
translation_notes:
  register: Português moderno, digno e de leitura natural sobretudo no Brasil, sem vocabulário confessional específico. O emprego de “você” torna inequívoco o destinatário singular no uso brasileiro. As metáforas incomuns do hebraico foram preservadas, enquanto “lançar os fundamentos” comunica de modo idiomático a imagem de fundar.
