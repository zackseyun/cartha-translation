  text: שִׁמְע֥וּ אֵלַ֛/י רֹ֥דְפֵי צֶ֖דֶק מְבַקְשֵׁ֣י יְהוָ֑ה הַבִּ֨יטוּ֙ אֶל צ֣וּר חֻצַּבְתֶּ֔ם וְ/אֶל מַקֶּ֥בֶת בּ֖וֹר נֻקַּרְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/001.yaml
  text: 'Listen to me[a], you who pursue righteousness, you who seek Yahweh: look to the rock from which you were cut[c][b], and to the quarry from which you were dug.'
translation:
  language: pt
  text: '“Escutem-me, vocês que perseguem a justiça[a], vocês que buscam Yahweh: olhem para a rocha da qual foram cortados[b] e para a cavidade da cova de onde foram extraídos.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “talhados”.'
    reason: lexical_alternative
  - marker: c
    text: O versículo 2 relaciona essas imagens a Abraão e Sara.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Escutem-me
  rationale: O imperativo plural convoca os destinatários a ouvir com atenção. “Escutem-me” é direto e natural em português atual.
- source_word: רֹדְפֵי צֶדֶק
  choice: vocês que perseguem a justiça
  rationale: Mantém a força ativa de רדף, “perseguir”, e traduz צֶדֶק por “justiça”, termo amplo em português que pode abranger conduta reta e ordem justa.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: vocês que buscam Yahweh
  rationale: Reproduz o paralelismo participial e preserva o nome divino pessoal representado pelo Tetragrama.
- source_word: הַבִּיטוּ אֶל צוּר
  choice: olhem para a rocha
  rationale: Conserva tanto o imperativo de atenção contemplativa quanto a imagem concreta da rocha.
- source_word: חֻצַּבְתֶּם
  choice: foram cortados
  rationale: O passivo de חצב descreve cortar ou talhar pedra. “Cortados” é claro e mantém a metáfora, enquanto “talhados” consta como alternativa em nota.
- source_word: מַקֶּבֶת בּוֹר
  choice: pedreira
  rationale: A expressão pertence ao campo da escavação e extração em uma cavidade ou cova. “Pedreira” comunica naturalmente em português o lugar de onde se extrai pedra e sustenta o paralelismo com “rocha”.
- source_word: נֻקַּרְתֶּם
  choice: foram extraídos
  rationale: Expressa a retirada por escavação sem repetir de modo pesado o substantivo “pedreira”; preserva a imagem de origem e extração.
theological_decisions:
- issue: Identificação da rocha e da pedreira com Abraão e Sara
  choice: Manter a metáfora no texto principal
  alternative: Identificar explicitamente a rocha como Abraão e a pedreira como Sara
  rationale: O versículo 1 apresenta a imagem sem nomear os antepassados; o versículo 2 a desenvolve com Abraão e Sara. A tradução não antecipa essa explicação.
- issue: Amplitude semântica de צֶדֶק
  choice: justiça
  alternative: retidão
  rationale: צֶדֶק pode denotar tanto justiça quanto retidão. “Justiça” preserva essa amplitude no contexto, e a alternativa moral “retidão” é registrada em nota.
- issue: Representação de יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o nome divino pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de boa legibilidade brasileira. O tratamento plural “vocês” torna explícito o número dos imperativos e particípios hebraicos sem recorrer a formas arcaicas. As imagens concretas de rocha, corte e extração foram preservadas.
