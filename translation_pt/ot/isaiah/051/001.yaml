  source_fidelity: A tradução preserva bem os imperativos, o paralelismo dos particípios, o nome Yahweh e a metáfora de extração. Contudo, «pedreira» não representa integralmente מַקֶּבֶת בּוֹר, pois omite בּוֹר («cova»/«poço»), elemento explícito do hebraico.
  naturalness: «Escutem-me», «vocês que perseguem a justiça» e «olhem para a rocha» são naturais em português moderno. «Cavidade da cova» conserva uma imagem hebraica deliberadamente concreta e algo intensificada; apesar de menos idiomática do que uma paráfrase, é clara no contexto e preferível para a equivalência formal.
  terminology: «Justiça» é uma opção legítima para צֶדֶק neste contexto e a nota registra adequadamente «retidão». «Yahweh» é consistente com a decisão editorial. A nota lexical para חֻצַּבְתֶּם deve ficar no termo correspondente, e a referência a Abraão e Sara deve ancorar a imagem completa ao final.
