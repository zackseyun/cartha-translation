id: ISA.51.12
reference: Isaiah 51:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אָנֹכִ֧י אָנֹכִ֛י ה֖וּא מְנַחֶמְ/כֶ֑ם מִֽי אַ֤תְּ וַ/תִּֽירְאִי֙ מֵ/אֱנ֣וֹשׁ יָמ֔וּת וּ/מִ/בֶּן אָדָ֖ם חָצִ֥יר יִנָּתֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/012.yaml
  text: I[a], I am he who comforts you. Who are you that you fear man, who dies, and the son of man, who is made like grass?
translation:
  language: pt
  text: “Eu, eu sou aquele que consola vocês. Quem é você, para ter medo de um mortal, que morrerá, e de um filho do homem[a], que será feito como a erva?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um ser humano”. Aqui, “filho do homem” é uma expressão hebraica para um membro comum da humanidade, não necessariamente um título messiânico.
    reason: Alternativa lexical e esclarecimento do sentido contextual de בֶּן אָדָם.
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי הוּא
  choice: Eu, eu sou aquele
  rationale: A repetição enfática do pronome é mantida, e הוּא integra a fórmula hebraica de autoidentificação. “Aquele” produz uma frase natural em português sem eliminar sua força retórica.
- source_word: מְנַחֶמְכֶם
  choice: que consola vocês
  rationale: O particípio descreve uma ação característica e contínua. “Consola” é corrente e digno; “vocês” reflete explicitamente o objeto plural do hebraico e tem ampla legibilidade brasileira.
- source_word: מִי אַתְּ
  choice: Quem é você
  rationale: Mantém a pergunta retórica direta. O pronome hebraico é feminino singular, referência indicada pelo contexto, embora “você” não marque gênero gramatical.
- source_word: וַתִּירְאִי
  choice: para ter medo
  rationale: Expressa de modo natural em português o temor diante de uma ameaça humana. A construção liga claramente a pergunta retórica à reação censurada.
- source_word: אֱנוֹשׁ יָמוּת
  choice: um mortal, que morrerá
  rationale: אֱנוֹשׁ salienta a fragilidade humana, enquanto יָמוּת declara a certeza de sua morte. A tradução conserva os dois elementos em vez de fundi-los.
- source_word: בֶּן אָדָם
  choice: um filho do homem
  rationale: A forma relativamente literal preserva o paralelismo e a textura poética hebraica. O artigo indefinido mostra que, neste contexto, se trata de um integrante da humanidade, sem apagar a expressão tradicional.
- source_word: חָצִיר
  choice: erva
  rationale: “Erva” transmite em português a imagem profética da vegetação breve e perecível, símbolo da transitoriedade humana.
- source_word: יִנָּתֵן
  choice: será feito como
  rationale: O nifal de נתן tem aqui sentido resultativo ou comparativo. “Será feito como” conserva a forma passiva e torna inteligível a comparação implícita com a erva.
theological_decisions:
- issue: Sentido de בֶּן אָדָם neste contexto profético
  choice: um filho do homem
  alternative: um ser humano
  rationale: A expressão está em paralelo com אֱנוֹשׁ e aqui designa a humanidade comum e frágil, não necessariamente um título messiânico. A tradução mantém a formulação hebraica e a nota esclarece o valor idiomático sem apagar possíveis ecos para leitores posteriores.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição enfática e o paralelismo poético foram preservados; “vocês” explicita o plural hebraico, enquanto “você” mantém o destinatário singular da pergunta.
