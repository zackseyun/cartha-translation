source:
  edition: WLC
  text: שְׂאוּ֩ לַ/שָּׁמַ֨יִם עֵֽינֵי/כֶ֜ם וְֽ/הַבִּ֧יטוּ אֶל הָ/אָ֣רֶץ מִ/תַּ֗חַת כִּֽי שָׁמַ֜יִם כֶּ/עָשָׁ֤ן נִמְלָ֨חוּ֙ וְ/הָ/אָ֨רֶץ֙ כַּ/בֶּ֣גֶד תִּבְלֶ֔ה וְ/יֹשְׁבֶ֖י/הָ כְּמוֹ כֵ֣ן יְמוּת֑וּ/ן וִ/ישֽׁוּעָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וְ/צִדְקָתִ֖/י לֹ֥א תֵחָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/006.yaml
  text: Lift up your eyes to the heavens[a], and look at the earth beneath; for the heavens will vanish like smoke, and the earth will wear out like a garment, and its inhabitants will die likewise. But my salvation will be forever[b], and my righteousness will not be shattered.
translation:
  language: pt
  text: Ergam os olhos para os céus e olhem para a terra abaixo, pois os céus se dissiparão como fumaça[a], a terra se gastará como uma veste, e seus habitantes morrerão do mesmo modo. Mas a minha salvação durará para sempre, e a minha justiça[b] não será desfeita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico é difícil. Também pode ser traduzido por “desaparecerão como fumaça”; o sentido é que os céus passarão.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”. A palavra hebraica pode incluir as ideias de justiça, retidão e fidelidade ao que é certo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ ... עֵינֵיכֶם
  choice: Ergam os olhos
  rationale: O imperativo plural com “olhos” como objeto forma uma expressão concreta e natural em português, preservando a imagem hebraica.
- source_word: לַשָּׁמַיִם
  choice: para os céus
  rationale: Mantém a forma plural do hebraico e o contraste cósmico com “a terra”.
- source_word: וְהַבִּיטוּ
  choice: e olhem
  rationale: Imperativo simples e atual, paralelo a “ergam”, sem coloração arcaica.
- source_word: אֶל הָאָרֶץ מִתַּחַת
  choice: para a terra abaixo
  rationale: Expressa claramente a posição inferior da terra em contraste com os céus.
- source_word: נִמְלָחוּ
  choice: se dissiparão
  rationale: O verbo hebraico é difícil; no contexto, indica o desaparecimento dos céus. “Dissipar-se” combina naturalmente com a comparação à fumaça e evita uma literalidade obscura.
- source_word: כֶּעָשָׁן
  choice: como fumaça
  rationale: Preserva diretamente a comparação hebraica.
- source_word: תִּבְלֶה כַּבֶּגֶד
  choice: se gastará como uma veste
  rationale: Reproduz a imagem de algo que envelhece e se desgasta pelo uso, mantendo a metáfora da roupa.
- source_word: וְיֹשְׁבֶיהָ
  choice: e seus habitantes
  rationale: Tradução concisa e natural do particípio substantivado referente aos que habitam a terra.
- source_word: כְּמוֹ כֵן
  choice: do mesmo modo
  rationale: Mantém a correspondência com as imagens anteriores de transitoriedade sem especificar além do hebraico.
- source_word: וִישׁוּעָתִי לְעוֹלָם תִּהְיֶה
  choice: Mas a minha salvação durará para sempre
  rationale: “Durará” comunica naturalmente a permanência expressa por “será para sempre”; “mas” explicita em português o contraste marcante entre a criação transitória e a salvação permanente.
- source_word: וְצִדְקָתִי לֹא תֵחָת
  choice: e a minha justiça não será desfeita
  rationale: “Justiça” preserva o alcance moral, judicial e salvador de צְדָקָה no contexto. “Não será desfeita” mantém a força da negação e a ideia de não ser quebrada ou anulada.
theological_decisions:
- issue: Sentido de צִדְקָתִי
  choice: a minha justiça
  alternative: a minha retidão
  rationale: O termo hebraico abrange justiça, retidão e fidelidade salvadora. No paralelismo com “minha salvação”, “justiça” é clara e ampla em português; a alternativa é registrada para preservar a extensão semântica.
- issue: Sentido de לֹא תֵחָת
  choice: não será desfeita
  alternative: não será quebrada; não falhará
  rationale: A forma verbal é incomum e admite nuances como ser quebrada, desanimar ou falhar. A tradução escolhida preserva a imagem de algo que não pode ser anulado sem resolver excessivamente a dificuldade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo poético e o contraste entre a transitoriedade dos céus, da terra e de seus habitantes e a permanência da salvação e da justiça divinas. Evita formas arcaicas e preserva em notas as dificuldades lexicais genuínas.
