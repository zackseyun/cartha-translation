id: ISA.51.10
reference: Isaiah 51:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/ל֤וֹא אַתְּ הִיא֙ הַ/מַּחֲרֶ֣בֶת יָ֔ם מֵ֖י תְּה֣וֹם רַבָּ֑ה הַ/שָּׂ֨מָה֙ מַֽעֲמַקֵּי יָ֔ם דֶּ֖רֶךְ לַ/עֲבֹ֥ר גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/010.yaml
  text: Was it not you who dried up the sea[a], the waters of the great deep[b], who made the depths of the sea a way for the redeemed to cross over?
translation:
  language: pt
  text: Não foste tu que secaste o mar, as águas do grande abismo,[a] e fizeste das profundezas do mar um caminho para os resgatados[b] atravessarem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as águas do vasto abismo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os remidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não foste tu
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa. A formulação no passado comunica naturalmente o caráter retrospectivo do versículo.
- source_word: אַתְּ הִיא
  choice: tu
  rationale: O hebraico é enfático e está no feminino singular. Em português, a ênfase é transmitida por “tu” na construção “Não foste tu”, sem impor gênero ao referente.
- source_word: הַמַּחֲרֶבֶת
  choice: que secaste
  rationale: O particípio causativo de חרב descreve a remoção das águas; “secar” é natural em português e preserva a alusão à travessia do mar.
- source_word: יָם
  choice: o mar
  rationale: Tradução direta que conserva a alusão ao êxodo sem identificar explicitamente o mar no texto.
- source_word: מֵי תְּהוֹם רַבָּה
  choice: as águas do grande abismo
  rationale: Preserva tanto a imagem aquática quanto a ressonância elevada e cósmica de תְּהוֹם, em linguagem compreensível.
- source_word: הַשָּׂמָה
  choice: e fizeste
  rationale: Expressa de modo idiomático a ação de transformar as profundezas em caminho e mantém o paralelismo verbal.
- source_word: מַעֲמַקֵּי יָם
  choice: das profundezas do mar
  rationale: Reproduz o plural hebraico e mantém viva a imagem das partes profundas do mar.
- source_word: דֶּרֶךְ
  choice: um caminho
  rationale: Termo natural que pode indicar tanto a passagem concreta pelo mar quanto o motivo mais amplo de libertação.
- source_word: לַעֲבֹר
  choice: atravessarem
  rationale: Comunica com clareza a travessia de um lado ao outro e se encaixa naturalmente na sintaxe portuguesa.
- source_word: גְּאוּלִים
  choice: os resgatados
  rationale: O particípio passivo de גאל designa pessoas libertadas mediante resgate ou ação de um redentor. “Resgatados” é claro e preserva essa nuance concreta.
theological_decisions:
- issue: Alusão ao êxodo e alcance da imagem de redenção
  choice: Manter a imagem histórica da travessia do mar sem identificar explicitamente o mar no texto principal.
  alternative: Explicitar “mar Vermelho” ou reduzir a frase a uma metáfora geral de libertação.
  rationale: O hebraico evoca claramente o êxodo, mas também integra essa lembrança à teologia mais ampla de restauração em Isaías. “O mar” preserva simultaneamente a alusão histórica e o alcance tipológico.
- issue: Identidade e gênero gramatical do destinatário
  choice: Usar a forma enfática “Não foste tu” sem marcar gênero.
  alternative: Empregar uma construção como “Não és tu aquela que”, marcando o feminino do hebraico.
  rationale: O feminino singular corresponde à gramática hebraica do contexto, mas marcá-lo em português poderia sugerir indevidamente que o referente é uma pessoa feminina. A forma verbal com “tu” conserva a interpelação e a ênfase sem resolver a identidade além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A pergunta retórica e o paralelismo poético foram preservados; “grande abismo” mantém o tom elevado sem soar arcaico.
