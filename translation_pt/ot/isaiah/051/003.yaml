id: ISA.51.3
reference: Isaiah 51:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי נִחַ֨ם יְהוָ֜ה צִיּ֗וֹן נִחַם֙ כָּל חָרְבֹתֶ֔י/הָ וַ/יָּ֤שֶׂם מִדְבָּרָ/הּ֙ כְּ/עֵ֔דֶן וְ/עַרְבָתָ֖/הּ כְּ/גַן יְהוָ֑ה שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יִמָּ֣צֵא בָ֔/הּ תּוֹדָ֖ה וְ/ק֥וֹל זִמְרָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/003.yaml
  text: For Yahweh comforts Zion[a]; he comforts all her ruins. He makes her wilderness like Eden, and her desert like the garden of Yahweh. Joy and gladness will be found in her[d][c][b], thanksgiving and the sound of song.
translation:
  language: pt
  text: Pois Yahweh consola Sião; consola todas as suas ruínas[a]. Ele torna o deserto dela semelhante ao Éden[b], e sua planície árida[c], semelhante ao jardim de Yahweh. Nela haverá alegria e júbilo, ação de graças e som de cântico[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus lugares devastados” ou “todos os seus lugares desolados”.
    reason: lexical_alternative
  - marker: b
    text: “Éden” evoca o jardim de Gênesis; compare “o jardim de Yahweh” na linha seguinte.
    reason: cross_reference
  - marker: c
    text: Ou “sua estepe” ou “sua região desértica”. O termo hebraico se refere a uma planície árida.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “voz de cântico”; também pode ser entendido como “som de canto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da promessa anterior e preserva naturalmente o valor causal.
- source_word: נִחַם
  choice: consola
  rationale: Expressa consolo restaurador dirigido a Sião e às suas ruínas. O presente comunica a vivacidade e a certeza da promessa profética sem fixar em excesso o tempo verbal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל חָרְבֹתֶיהָ
  choice: todas as suas ruínas
  rationale: חָרְבוֹת designa lugares arruinados ou devastados; “ruínas” é concreto, claro e adequado à restauração de Sião.
- source_word: וַיָּשֶׂם
  choice: Ele torna
  rationale: Retrata a ação restauradora com presente profético e mantém a ideia de fazer uma realidade ficar semelhante a outra.
- source_word: מִדְבָּרָהּ
  choice: o deserto dela
  rationale: מִדְבָּר significa deserto ou região erma; “deserto” é corrente e permite distingui-lo do termo seguinte.
- source_word: כְּעֵדֶן
  choice: semelhante ao Éden
  rationale: Preserva a comparação explícita e o nome próprio, mantendo a evocação de Gênesis.
- source_word: וְעַרְבָתָהּ
  choice: sua planície árida
  rationale: עֲרָבָה pode indicar estepe ou planície desértica. “Planície árida” comunica a topografia e evita repetir simplesmente “deserto”.
- source_word: כְּגַן יְהוָה
  choice: semelhante ao jardim de Yahweh
  rationale: Mantém a comparação, a construção genitiva e o paralelo com Éden.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: alegria e júbilo
  rationale: Reproduz o par de termos festivos com duas palavras naturais e distintas em português.
- source_word: יִמָּצֵא בָהּ
  choice: Nela haverá
  rationale: Verte naturalmente a ideia existencial de algo ser encontrado ou estar presente nela e explicita o horizonte futuro da restauração.
- source_word: תּוֹדָה וְקוֹל זִמְרָה
  choice: ação de graças e som de cântico
  rationale: Preserva tanto a expressão de gratidão quanto o elemento audível do canto, sem acrescentar agentes não expressos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Aspecto verbal na promessa profética de restauração
  choice: Presente profético em “consola” e “torna”, seguido do futuro existencial “haverá”
  alternative: Passado uniforme (“consolou”, “tornou”, “houve”) ou futuro uniforme (“consolará”, “tornará”, “haverá”)
  rationale: A sequência hebraica pode apresentar a restauração futura como certa e vividamente realizada. A combinação conserva essa tensão sem impor uma cronologia mais precisa do que o original.
- issue: Imagem de Éden e do jardim de Yahweh
  choice: Manter ambas as expressões e a comparação explícita
  alternative: Interpretar Éden como “paraíso” ou fundir as duas imagens
  rationale: A repetição paralela estabelece deliberadamente a restauração de Sião em termos edênicos; mantê-la evita diluir a alusão teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “consola” e o paralelismo das imagens foram mantidos. “Dela” esclarece que o deserto pertence à Sião personificada, enquanto “sua” permanece natural antes de “planície árida”.
