id: ISA.51.17
reference: Isaiah 51:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הִתְעוֹרְרִ֣י הִֽתְעוֹרְרִ֗י ק֚וּמִי יְר֣וּשָׁלִַ֔ם אֲשֶׁ֥ר שָׁתִ֛ית מִ/יַּ֥ד יְהוָ֖ה אֶת כּ֣וֹס חֲמָת֑/וֹ אֶת קֻבַּ֜עַת כּ֧וֹס הַ/תַּרְעֵלָ֛ה שָׁתִ֖ית מָצִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/017.yaml
  text: Awake[a], awake, rise up, Jerusalem, you who have drunk from the hand of Yahweh the cup of his wrath; you have drunk the bowl, the cup of staggering[c][b]; you have drained it dry.
translation:
  language: pt
  text: Desperte, desperte! Levante-se, Jerusalém, você que bebeu da mão de Yahweh[a] o cálice da sua ira. Você bebeu a taça[b], o cálice que faz cambalear[c]; esvaziou-o até a última gota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “da mão de Yahweh” indica que o sofrimento de Jerusalém veio da ação judicial dele.
    reason: cultural_note
  - marker: b
    text: Ou “a tigela”. O termo hebraico designa um recipiente de beber em forma de tigela.
    reason: lexical_alternative
  - marker: c
    text: Ou “o cálice da vertigem”; tradicionalmente, “o cálice do tremor”. O termo hebraico se refere ao efeito cambaleante da bebida.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוֹרְרִי ... הִתְעוֹרְרִי
  choice: Desperte, desperte
  rationale: O imperativo feminino singular repetido transmite urgência. “Desperte” é natural, digno e adequado ao chamado metafórico dirigido a Jerusalém; a repetição preserva a ênfase do hebraico.
- source_word: קוּמִי
  choice: Levante-se
  rationale: Expressa de modo corrente o imperativo de se erguer e combina naturalmente com o chamado anterior.
- source_word: מִיַּד יְהוָה
  choice: da mão de Yahweh
  rationale: Preserva a imagem hebraica da mão como fonte e agente da ação judicial, sem reduzi-la a uma paráfrase abstrata.
- source_word: כּוֹס חֲמָתוֹ
  choice: o cálice da sua ira
  rationale: Mantém a metáfora profética do cálice e o peso judicial de חֵמָה.
- source_word: קֻבַּעַת
  choice: a taça
  rationale: Designa um recipiente de beber em forma de tigela. “Taça” mantém a imagem de um vaso para bebida e soa natural em português.
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: o cálice que faz cambalear
  rationale: Traduz o efeito desorientador da bebida de maneira clara, sem adotar o tradicional “tremor”, que pode obscurecer a ideia de andar cambaleante.
- source_word: מָצִית
  choice: esvaziou-o até a última gota
  rationale: Comunica que Jerusalém bebeu por completo o conteúdo do recipiente, até o fim, em linguagem idiomática moderna.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Metáfora do cálice da ira
  choice: Manter a metáfora explícita
  alternative: Explicitar como “castigo” ou “juízo”
  rationale: A imagem profética associa beber o cálice dado por Yahweh a sofrer sua ira judicial. A tradução conserva essa imagem e sua tensão teológica em vez de interpretá-la no corpo do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tratamento por “você” torna explícita a segunda pessoa dirigida à cidade personificada. A pontuação preserva o paralelismo e a intensidade poética sem recorrer a formulações arcaicas.
