base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/019.yaml
  text: These two things have come upon you—who will mourn for you?—devastation and destruction[a], famine and sword[b]; who will comfort you?
translation:
  language: pt
  text: Estas duas coisas vieram sobre você — quem lamentará por você?[a] — devastação e ruína, fome e espada[b]; quem a consolará?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem se compadecerá de você?”. O verbo hebraico pode expressar lamento ou compaixão.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico fala em “duas coisas”, mas menciona quatro calamidades, provavelmente organizadas em dois pares: “devastação e ruína” e “fome e espada”.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁתַּיִם הֵנָּה
  choice: Estas duas coisas
  rationale: Preserva tanto o número explícito quanto a força demonstrativa da expressão hebraica.
- source_word: קֹרְאֹתַיִךְ
  choice: lhe sobrevieram
  rationale: Neste uso idiomático, o verbo descreve calamidades que sobrevêm ou atingem alguém, não um chamado literal.
- source_word: מִי יָנוּד לָךְ
  choice: quem se compadecerá de você?
  rationale: נוּד pode indicar lamentar por alguém, demonstrar solidariedade ou menear a cabeça diante de sua desgraça. A escolha comunica compaixão sem restringir indevidamente o sentido.
- source_word: הַשֹּׁד וְהַשֶּׁבֶר
  choice: devastação e ruína
  rationale: Reproduz a dupla de termos de destruição, distinguindo a devastação violenta do estado de colapso ou ruína.
- source_word: הָרָעָב וְהַחֶרֶב
  choice: fome e espada
  rationale: Equivalentes tradicionais e claros; “espada” funciona metonimicamente para guerra e morte violenta.
- source_word: מִי אֲנַחֲמֵךְ
  choice: quem a consolará?
  rationale: נחם no piel significa consolar; o pronome feminino retoma Sião/Jerusalém, destinatária do contexto.
theological_decisions:
- issue: O texto anuncia “duas coisas”, mas apresenta quatro substantivos de calamidade.
  choice: 'Manter “Estas duas coisas” e apresentar os quatro males como dois pares: “devastação e ruína, fome e espada”.'
  alternative: Reformular como “dupla calamidade” ou emendar o número.
  rationale: O hebraico traz explicitamente o número dois. A disposição em dois pares preserva a tensão e o paralelismo sem corrigir conjecturalmente o texto.
- issue: Amplitude semântica de מִי יָנוּד לָךְ.
  choice: quem se compadecerá de você?
  alternative: quem lamentará por você?
  rationale: A formulação escolhida conserva o elemento de solidariedade compassiva; a alternativa destaca mais diretamente o lamento. Nenhuma leitura doutrinária particular é imposta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. O tratamento alterna legitimamente entre “lhe/você” e “a” para representar a destinatária feminina implícita (Sião/Jerusalém), sem recorrer ao pouco natural “tu” nem perder o gênero no último verbo.
