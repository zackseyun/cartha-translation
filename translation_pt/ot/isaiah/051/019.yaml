    rationale: O verbo pode comunicar lamentar, condoer-se ou demonstrar solidariedade diante da desgraça. A tradução principal pode escolher “lamentará”, mas a possibilidade “se compadecerá” deve ser preservada em nota.
  - severity: low
    issue: O tratamento pronominal alterna “lhe”, “você” e “a”.
    rationale: Embora possível em registros brasileiros, a sequência fica menos fluida. A revisão uniformiza o início com “você” e conserva “a” apenas onde o feminino de Sião/Jerusalém é sintaticamente relevante.
