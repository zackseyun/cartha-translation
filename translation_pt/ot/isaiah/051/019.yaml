  source_fidelity: A enumeração de quatro calamidades como dois pares é preservada corretamente. Contudo, מִי יָנוּד לָךְ abrange lamento e compaixão; “quem se compadecerá de você?” privilegia uma possibilidade e não torna visível a alternativa de lamento. “Quem lamentará por você?” é uma tradução direta e natural, com a alternativa registrada em nota.
  naturalness: A alternância entre “lhe”, “você” e “a” é compreensível, mas torna a referência pessoal menos uniforme. “Vieram sobre você” mantém um tom bíblico digno e é mais coerente com o tratamento predominante por “você”; o pronome feminino “a” no fim retoma adequadamente Sião/Jerusalém.
  terminology: “Devastação e ruína”, “fome e espada” e “consolará” são escolhas claras, naturais e fiéis ao vocabulário profético. “Espada” preserva a metonímia hebraica para a violência da guerra.
