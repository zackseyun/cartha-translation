revisions:
- from: 'Eu a porei nas mãos dos que afligem você, dos que lhe disseram: “Curve-se, para que passemos por cima”. E você fez das costas como o chão, como a rua para os que passavam.'
  to: 'Eu a porei nas mãos dos que a afligem, que lhe disseram: “Curve-se, para que passemos por cima”. E você tornou as suas costas como o chão, como a rua para os que passavam.'
  rationale: A revisão corrige a sintaxe e explicita o possessivo exigido pela imagem hebraica, sem acrescentar interpretação. Também torna a primeira oração mais fluida, preservando o tratamento por “você” e a referência indireta natural em “lhe disseram”.
