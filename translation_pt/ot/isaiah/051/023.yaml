review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: o pronome feminino retoma a taça do contexto, os opressores ordenam a Sião que se curve, e a imagem de suas costas como solo/rua permanece. Contudo, a formulação portuguesa da última oração não expressa com clareza a construção hebraica ‘fizeste/tornaste as tuas costas como...’.'
  naturalness: “Você fez das costas como o chão” é pouco natural e sintaticamente incompleto em português, além de não deixar explícito que são as costas da destinatária. “Você tornou as suas costas como o chão” é idiomático, poético e fiel à imagem.
  terminology: “Afligem” é uma opção adequada para מוֹגַיִךְ e não intensifica indevidamente o termo. “Rua” é defensável para חוּץ no paralelismo com o chão e os que passam. Mantém-se “Curve-se” como imperativo claro e moderno.
  issues:
  - severity: medium
    issue: Construção incompleta na segunda metade do versículo
    rationale: O hebraico diz literalmente que Sião ‘pôs/tornou o seu dorso como a terra’. “Fez das costas como o chão” omite o possessivo e não constrói naturalmente o complemento comparativo em português.
  - severity: low
    issue: Alternância de referência pronominal
    rationale: “dos que afligem você, dos que lhe disseram” é compreensível, mas a repetição de “dos que” e a alternância entre “você” e “lhe” tornam o período menos fluido. Uma oração relativa única com “a afligem” mantém a coesão.
  revised_text: 'Eu a porei nas mãos dos que a afligem, que lhe disseram: “Curve-se, para que passemos por cima”. E você tornou as suas costas como o chão, como a rua para os que passavam.'
