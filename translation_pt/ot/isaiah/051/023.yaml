base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/023.yaml
  text: And I will put it into the hand of those who afflict you, who said to you, ‘Bow down, so that we may pass over’; and you made your back like the ground, and like the street for those passing by.
translation:
  language: pt
  text: 'Eu a porei nas mãos dos que a afligem, que lhe disseram: “Curve-se, para que passemos por cima”. E você tornou as suas costas como o chão, como a rua para os que passavam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹגַיִךְ
  choice: os que afligem você
  rationale: O particípio plural indica os opressores ou atormentadores de Sião; “afligem” conserva a abrangência do termo sem intensificá-lo indevidamente.
- source_word: לְנַפְשֵׁךְ
  choice: lhe
  rationale: Aqui נֶפֶשׁ funciona como referência à própria pessoa; em português natural, o pronome indireto comunica adequadamente “a você”.
- source_word: שְׁחִי
  choice: Curve-se
  rationale: Imperativo feminino singular dirigido a Sião; expressa a humilhação física imposta.
- source_word: וְנַעֲבֹרָה
  choice: para que passemos por cima
  rationale: A forma cohortativa indica a finalidade dos opressores, e o contexto das costas feitas como chão favorece explicitar “por cima”.
- source_word: גֵּוֵךְ
  choice: das costas
  rationale: O substantivo designa o dorso ou as costas, imagem corporal central da humilhação.
- source_word: כַחוּץ
  choice: como a rua
  rationale: חוּץ pode significar o espaço exterior ou a rua; o paralelismo com o chão e os transeuntes favorece “rua”.
theological_decisions:
- issue: Referente do pronome feminino em וְשַׂמְתִּיהָ
  choice: “a” retoma a taça da ira mencionada no contexto anterior
  alternative: Explicitar “a taça” no corpo do versículo
  rationale: O pronome hebraico depende do contexto imediato; mantê-lo como pronome preserva a coesão textual e evita repetição não presente neste versículo.
- issue: Imagem de os opressores passarem sobre Sião
  choice: Preservar a imagem concreta de curvar-se e servir de caminho
  alternative: Parafrasear como submissão ou humilhação
  rationale: A metáfora corporal forte pertence ao texto e não deve ser reduzida a uma interpretação abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o tratamento por “você” para a personificação feminina de Sião e conserva o paralelismo poético da segunda metade.
