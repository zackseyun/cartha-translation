source:
  edition: WLC
  text: קָר֤וֹב צִדְקִ/י֙ יָצָ֣א יִשְׁעִ֔/י וּ/זְרֹעַ֖/י עַמִּ֣ים יִשְׁפֹּ֑טוּ אֵלַ/י֙ אִיִּ֣ים יְקַוּ֔וּ וְ/אֶל זְרֹעִ֖/י יְיַחֵלֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/005.yaml
  text: My righteousness is near[a], my salvation has gone out, and my arms will judge the peoples; the coastlands will wait for me[c][b], and for my arm they will hope.
translation:
  language: pt
  text: Minha justiça está perto[a], minha salvação saiu, e meus braços[b] julgarão os povos; as terras costeiras[c] esperarão por mim e no meu braço depositarão sua esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Minha retidão está perto” ou “Minha vindicação está perto”. O hebraico צדק pode expressar justiça, retidão ou vindicação, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: Aqui o hebraico traz “meus braços”, no plural, mas depois, no mesmo versículo, “meu braço”, no singular. A imagem se refere ao poder ativo do SENHOR.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “as ilhas” ou “as costas distantes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: está perto
  rationale: Expressa de modo direto o adjetivo predicativo hebraico, sem acrescentar ideia de movimento ou aspecto não indicado.
- source_word: צִדְקִי
  choice: minha justiça
  rationale: Em português, “justiça” preserva bem a amplitude de צדק neste contexto, que abrange retidão, ação justa e vindicação salvadora; as alternativas são registradas em nota.
- source_word: יָצָא
  choice: já saiu
  rationale: Mantém a imagem concreta do verbo hebraico no perfeito e indica uma ação realizada com relevância presente. “Já” torna natural em português a relação temporal sem explicar além do texto.
- source_word: יִשְׁעִי
  choice: minha salvação
  rationale: É a correspondência mais transparente para o substantivo derivado de ישׁע e se ajusta ao contexto salvífico de Isaías.
- source_word: וּזְרֹעַי
  choice: e meus braços
  rationale: Conserva o plural morfológico hebraico e a metáfora corporal da atuação poderosa de Deus, sem reduzi-la ao abstrato “poder”.
- source_word: עַמִּים
  choice: os povos
  rationale: Preserva a referência coletiva plural a diferentes grupos humanos e soa natural em português.
- source_word: יִשְׁפֹּטוּ
  choice: julgarão
  rationale: Mantém o sentido judicial central de שׁפט e sua relação contextual com a justiça, sem restringir ou ampliar o verbo para “governar”.
- source_word: אֵלַי
  choice: por mim
  rationale: A preposição hebraica indica direção para o falante; com “esperar”, a construção idiomática portuguesa é “esperar por mim”.
- source_word: אִיִּים
  choice: as terras costeiras
  rationale: O termo pode designar ilhas, costas e, em Isaías, regiões marítimas distantes. “Terras costeiras” evita limitar indevidamente a referência apenas a ilhas.
- source_word: יְקַוּוּ
  choice: esperarão
  rationale: Comunica a espera expectante do verbo e permite distingui-lo, no paralelismo, do verbo seguinte de esperança.
- source_word: וְאֶל זְרֹעִי
  choice: e no meu braço
  rationale: Mantém o singular do hebraico e conserva a metáfora profética do braço como poder divino em ação.
- source_word: יְיַחֵלוּן
  choice: depositarão sua esperança
  rationale: Expressa de forma idiomática a espera esperançosa de יחל e preserva a diferença verbal em relação a “esperarão” na linha anterior.
theological_decisions:
- issue: Sentido de צדק em um oráculo de salvação
  choice: minha justiça
  alternative: minha retidão; minha vindicação
  rationale: O termo relaciona o caráter justo de Deus à sua ação salvadora e ao julgamento dos povos. “Justiça” mantém essa amplitude em português, enquanto a nota preserva os sentidos contextualmente possíveis sem escolher uma interpretação doutrinária estreita.
- issue: Metáfora antropomórfica do braço e dos braços de Deus
  choice: manter literalmente “braço/braços”
  alternative: poder; força
  rationale: A imagem corporal retrata o poder divino em ação e faz parte da textura poética do oráculo. Substituí-la por uma abstração eliminaria uma característica significativa do original.
- issue: Alternância entre plural e singular em זְרֹעַי / זְרֹעִי
  choice: preservar “meus braços” e depois “meu braço”
  alternative: uniformizar ambas as ocorrências no singular
  rationale: A tradução acompanha a alternância morfológica real do texto hebraico, sem harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A estrutura poética e as metáforas do hebraico foram conservadas; evitou-se linguagem arcaica e não se eliminou a ambiguidade de צדק nem a alternância entre “braços” e “braço”.
