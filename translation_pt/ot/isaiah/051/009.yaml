id: ISA.51.9
reference: Isaiah 51:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/009.yaml
  text: Awake[a], awake, put on strength, arm of Yahweh; awake, as in days of old, generations of long ago[b]. Was it not you who cut Rahab in pieces, who pierced the dragon?
translation:
  language: pt
  text: Desperta, desperta, reveste-te de força, braço de Yahweh; desperta, como nos dias antigos, como nas gerações de outrora. Não foste tu que despedaçaste Raabe[a], que traspassaste o dragão[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Raabe é um nome poético dado a uma potência inimiga orgulhosa, muitas vezes entendida aqui como o Egito.
    reason: cross_reference
  - marker: b
    text: Ou «monstro marinho».
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Desperta
  rationale: O imperativo repetido mantém o apelo poético solene. Embora a forma hebraica seja feminina por concordar com זְרוֹעַ, em português a concordância natural é masculina com «braço».
- source_word: לִבְשִׁי עֹז
  choice: reveste-te de força
  rationale: Preserva a metáfora hebraica de vestir-se de poder e soa natural em português atual e digno.
- source_word: זְרוֹעַ יְהוָה
  choice: braço de Yahweh
  rationale: Mantém a imagem do poder de Deus em ação e o vocativo do texto, além de representar diretamente o nome divino.
- source_word: כִּימֵי קֶדֶם
  choice: como nos dias antigos
  rationale: Expressa tempos antigos ou primordiais com clareza e tom poético.
- source_word: דֹּרוֹת עוֹלָמִים
  choice: nas gerações de tempos remotos
  rationale: Comunica a antiguidade distante indicada pela expressão sem transformá-la numa afirmação metafísica sobre eternidade.
- source_word: הֲלוֹא אַתְּ הִיא
  choice: Não foste tu
  rationale: Reproduz a pergunta retórica retrospectiva dirigida ao braço personificado.
- source_word: הַמַּחְצֶבֶת
  choice: que despedaçaste
  rationale: Transmite o sentido vigoroso de talhar ou cortar e se ajusta à derrota violenta do inimigo poético.
- source_word: רַהַב
  choice: Raabe
  rationale: Retém o nome poético e sua imagem complexa, provavelmente alusiva ao Egito, sem reduzir o referente a uma única interpretação.
- source_word: מְחוֹלֶלֶת
  choice: que traspassaste
  rationale: Conserva a ação forte de perfurar ou ferir e o paralelismo com «despedaçaste».
- source_word: תַּנִּין
  choice: o dragão
  rationale: No contexto poético, designa uma criatura monstruosa associada ao caos; «dragão» preserva melhor essa imagem, enquanto a alternativa «monstro marinho» é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pactual em vez de substituí-lo por um título.
- issue: Interpretação das imagens de Raabe e תַּנִּין
  choice: Manter «Raabe» e «dragão» no texto principal
  alternative: Explicitar «Egito» e/ou usar «monstro marinho» no texto principal
  rationale: As imagens sobrepõem a derrota de uma potência inimiga, provavelmente o Egito, à linguagem poética de combate contra o caos. Mantê-las evita resolver indevidamente essa tensão.
translation_notes:
  register: Português moderno, solene e amplamente inteligível, com boa legibilidade brasileira. A repetição e as imagens centrais do hebraico foram preservadas; a concordância gramatical segue o gênero masculino de «braço» em português.
