base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/002.yaml
  text: Look to Abraham your father and to Sarah who bore you; for I called him when he was one[a], and I blessed him and multiplied him.
translation:
  language: pt
  text: Olhem para Abraão, pai de vocês, e para Sara, que lhes deu à luz; pois eu o chamei quando ele era apenas um[a], eu o abençoei e o multipliquei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele estava sozinho”. O hebraico diz literalmente “um”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ
  choice: Olhem para
  rationale: Preserva a metáfora visual e a força da exortação no imperativo plural, apontando Abraão e Sara como exemplos a considerar.
- source_word: אַבְרָהָם אֲבִיכֶם
  choice: Abraão, seu pai
  rationale: Mantém a linguagem familiar e pactual do hebraico; “pai” é o sentido direto, aqui empregado em referência ancestral e representativa.
- source_word: שָׂרָה תְּחוֹלֶלְכֶם
  choice: Sara, que deu à luz vocês
  rationale: Comunica de modo natural e explícito a imagem materna do verbo, associado às dores do parto e ao ato de dar à luz.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a exortação anterior de forma concisa e natural.
- source_word: אֶחָד
  choice: quando ele era um só
  rationale: Conserva o sentido literal de “um” e destaca que o povo numeroso teve início em um único homem, sem eliminar a possível nuance de que ele estava sozinho.
- source_word: קְרָאתִיו
  choice: eu o chamei
  rationale: Tradução direta de קרא, preservando sua ressonância de chamado divino sem especificar além do texto.
- source_word: וַאֲבָרְכֵהוּ
  choice: o abençoei
  rationale: Expressa diretamente a ação divina e mantém sua relevância pactual.
- source_word: וְאַרְבֵּהוּ
  choice: o multipliquei
  rationale: Reproduz de modo conciso o hifil de רבה e evoca naturalmente a linguagem das promessas de multiplicação em Gênesis.
theological_decisions:
- issue: Sentido de אֶחָד na condição de Abraão ao ser chamado
  choice: quando ele era um só
  alternative: quando ele estava sozinho
  rationale: A formulação principal preserva a expressão compacta do hebraico, literalmente “um”, e o ponto de que Deus fez surgir muitos a partir de um único homem. A leitura “sozinho” é plausível, mas mais interpretativa, por isso aparece em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” torna explícitos os sufixos plurais hebraicos; a colocação pronominal mantém fluidez sem perder o tom solene.
