source:
  edition: WLC
  text: וַ/תִּשְׁכַּ֞ח יְהוָ֣ה עֹשֶׂ֗/ךָ נוֹטֶ֣ה שָׁמַיִם֮ וְ/יֹסֵ֣ד אָרֶץ֒ וַ/תְּפַחֵ֨ד תָּמִ֜יד כָּל הַ/יּ֗וֹם מִ/פְּנֵי֙ חֲמַ֣ת הַ/מֵּצִ֔יק כַּ/אֲשֶׁ֥ר כּוֹנֵ֖ן לְ/הַשְׁחִ֑ית וְ/אַיֵּ֖ה חֲמַ֥ת הַ/מֵּצִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/013.yaml
  text: and you forgot Yahweh your Maker[a], who stretched out the heavens and founded the earth, and you feared continually all day long because of the fury of the oppressor, when he set himself to destroy. But where is the fury of the oppressor?
translation:
  language: pt
  text: e você se esqueceu de Yahweh, seu Criador, que estendeu os céus e lançou os fundamentos da terra. Você teve medo sem cessar, o dia inteiro, por causa do furor do opressor, quando ele se preparou para destruir.[a] Mas onde está o furor do opressor?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se estivesse pronto para destruir”.'
    reason: A construção כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית admite uma leitura modal, além da leitura temporal adotada no texto.
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: você se esqueceu
  rationale: O qal wayyiqtol de שׁכח expressa naturalmente, neste contexto de repreensão profética, uma acusação perfectiva. A construção pronominal é idiomática no português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֹשֶׂךָ
  choice: seu Criador
  rationale: O particípio de עשה com sufixo de segunda pessoa tem força descritiva e quase titular. “Criador” comunica de modo natural aquele que fez o interlocutor.
- source_word: נוֹטֶה שָׁמַיִם
  choice: que estendeu os céus
  rationale: נטה, em contexto cosmológico, denota estender. A oração relativa integra naturalmente o particípio hebraico à descrição do Criador.
- source_word: וְיֹסֵד אָרֶץ
  choice: e lançou os fundamentos da terra
  rationale: יסד evoca fundar ou assentar fundamentos. A formulação preserva a imagem arquitetônica da criação e soa natural em português.
- source_word: וַתְּפַחֵד
  choice: Você teve medo
  rationale: פחד significa temer ou sentir pavor. “Teve medo” reflete diretamente o verbo sem acrescentar a manifestação física sugerida por “tremeu”.
- source_word: תָּמִיד כָּל הַיּוֹם
  choice: sem cessar, o dia inteiro
  rationale: A expressão conserva os dois elementos intensificadores de duração, mas em ordem idiomática no português contemporâneo.
- source_word: מִפְּנֵי חֲמַת הַמֵּצִיק
  choice: por causa do furor do opressor
  rationale: מִפְּנֵי tem valor causal no contexto; חֲמַת indica ira intensa, e מֵצִיק designa quem oprime ou aflige.
- source_word: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית
  choice: quando ele se preparava para destruir
  rationale: כּוֹנֵן pode indicar estar preparado ou fazer-se pronto. A formulação mantém o opressor como sujeito mais próximo e preserva o valor circunstancial da oração.
- source_word: וְאַיֵּה חֲמַת הַמֵּצִיק
  choice: Mas onde está o furor do opressor?
  rationale: אַיֵּה introduz uma pergunta retórica. “Mas” explicita com naturalidade o contraste implícito entre o medo contínuo e a ausência ou impotência presente do furor opressor.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sujeito de כּוֹנֵן לְהַשְׁחִית
  choice: O opressor
  alternative: 'Um sujeito indefinido, ou leitura modal: “como se estivesse pronto para destruir”'
  rationale: “O opressor” é o antecedente imediato e continua em foco na pergunta retórica seguinte. A nota preserva a possibilidade de uma leitura modal da oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” para a segunda pessoa masculina singular do hebraico sem introduzir marca de gênero desnecessária. A divisão em frases evita um período excessivamente longo, e a nota foi colocada junto à oração a que realmente se refere.
