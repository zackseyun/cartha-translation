  text: 'Por isso, ouça isto, por favor, ó aflita, embriagada, mas não de vinho:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Expressa naturalmente a inferência ou consequência introduzida pelo hebraico.
- source_word: שִׁמְעִי נָא
  choice: ouça agora
  rationale: O imperativo feminino singular dirige-se à figura feminina aflita; נָא acrescenta apelo ou insistência, aqui transmitida por “agora” sem tornar o pedido excessivamente cortês.
- source_word: עֲנִיָּה
  choice: ó aflita
  rationale: Mantém o vocativo feminino e o sentido de alguém humilhada ou afligida.
- source_word: וּשְׁכֻרַת
  choice: embriagada
  rationale: Preserva a imagem forte de intoxicação e concorda com a destinatária feminina.
- source_word: וְלֹא מִיָּיִן
  choice: mas não de vinho
  rationale: 'Reproduz o contraste explícito: a embriaguez é metafórica ou causada por algo distinto do vinho, sem antecipar sua explicação.'
theological_decisions:
- issue: Natureza da embriaguez
  choice: Manter “embriagada, mas não de vinho”
  alternative: Explicitar que se trata da ira ou do juízo divino
  rationale: O versículo preserva deliberadamente a imagem e só o contexto a esclarece; explicá-la no texto resolveria uma tensão que o hebraico mantém.
translation_notes:
  register: Português atual, digno e amplamente compreensível. O vocativo “ó aflita” conserva o tom poético e profético; os dois-pontos mantêm a abertura para a declaração seguinte.
