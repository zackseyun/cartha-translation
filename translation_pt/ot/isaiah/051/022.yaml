reference: Isaiah 51:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנַ֣יִ/ךְ יְהוָ֗ה וֵ/אלֹהַ֨יִ/ךְ֙ יָרִ֣יב עַמּ֔/וֹ הִנֵּ֥ה לָקַ֛חְתִּי מִ/יָּדֵ֖/ךְ אֶת כּ֣וֹס הַ/תַּרְעֵלָ֑ה אֶת קֻבַּ֨עַת֙ כּ֣וֹס חֲמָתִ֔/י לֹא תוֹסִ֥יפִי לִ/שְׁתּוֹתָ֖/הּ עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/022.yaml
  text: 'Thus says your Lord[a], Yahweh, and your God, who pleads the cause of his people: Behold, I have taken from your hand the cup of staggering, the bowl of the cup of my wrath[b]; you shall never again drink it.'
translation:
  language: pt
  text: 'Assim diz o teu Senhor, Yahweh, o teu Deus, que defende a causa do seu povo: “Eis que tirei da tua mão o cálice que faz cambalear[a], a taça do cálice da minha ira[b]. Nunca mais beberás dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o cálice da vertigem” ou “o cálice que faz vacilar”. O termo hebraico destaca o efeito entorpecente do juízo.
    reason: lexical_alternative
  - marker: b
    text: Ou “a tigela do cálice da minha ira”. O hebraico acumula imagens de recipientes para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנַיִךְ
  choice: o teu Senhor
  rationale: O título com sufixo feminino singular expressa autoridade sobre Sião; “Senhor” é natural e digno em português, sem reduzir o termo a uma relação doméstica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal no texto hebraico, distinguindo-o do título “Senhor” que o precede.
- source_word: וֵאלֹהַיִךְ
  choice: o teu Deus
  rationale: O singular contextual refere-se ao Deus de Sião. A aposição sem repetir “e” soa natural em português e conserva a sequência de designações divinas.
- source_word: יָרִיב עַמּוֹ
  choice: que defende a causa do seu povo
  rationale: 'ריב possui aqui sentido jurídico: assumir ou defender a causa de alguém. A formulação conserva essa nuance forense em linguagem corrente.'
- source_word: הִנֵּה
  choice: Eis que
  rationale: Mantém a força demonstrativa e a solenidade do anúncio profético.
- source_word: לָקַחְתִּי מִיָּדֵךְ
  choice: tirei da tua mão
  rationale: Reproduz de modo direto a ação concluída e preserva a imagem concreta de retirar o recipiente da mão de Sião.
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: o cálice que faz cambalear
  rationale: תַּרְעֵלָה descreve o efeito entorpecente que faz a pessoa cambalear. A oração relativa comunica esse efeito com clareza e mantém a metáfora do cálice.
- source_word: קֻבַּעַת
  choice: a taça
  rationale: O termo designa um recipiente de beber, provavelmente largo ou semelhante a uma tigela. “Taça” funciona naturalmente no paralelismo sem acrescentar associações litúrgicas indevidas.
- source_word: כּוֹס חֲמָתִי
  choice: o cálice da minha ira
  rationale: “Ira” preserva o peso do juízo divino expresso por חֵמָה e mantém uma importante imagem bíblica.
- source_word: לֹא תוֹסִיפִי לִשְׁתּוֹתָהּ עוֹד
  choice: Nunca mais beberás dele
  rationale: A expressão com יסף e עוֹד nega enfaticamente qualquer repetição futura; “nunca mais” transmite essa finalidade em português idiomático.
theological_decisions:
- issue: Sequência das designações divinas
  choice: o teu Senhor, Yahweh, o teu Deus
  alternative: o Soberano, Yahweh, teu Deus
  rationale: A tradução mantém distintos o título de autoridade, o nome pessoal divino e a relação de Deus com Sião, sem fundi-los nem substituir o nome por outro título.
- issue: Metáfora do cálice do juízo
  choice: Preservar literalmente as imagens do cálice e da taça
  alternative: Explicitar a metáfora como sofrimento ou castigo
  rationale: A imagem concreta pertence ao texto e se liga ao amplo motivo bíblico do cálice da ira divina. Interpretá-la diretamente como castigo eliminaria parte da força poética e da conexão intertextual.
- issue: Agente beneficiado na expressão jurídica
  choice: que defende a causa do seu povo
  alternative: que entra em contenda com o seu povo
  rationale: A construção ריב com referência ao povo admite linguagem de contenda, mas o contexto de consolo e retirada do cálice favorece Deus atuando em favor do seu povo. “Defende a causa” conserva o cenário forense sem transformar a frase numa formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “tu” coerente com os sufixos femininos dirigidos poeticamente a Sião. Conservou-se a solenidade profética de “Assim diz” e “Eis que”, evitando arcaísmos adicionais. As marcas [a] e [b] aparecem junto às expressões que as notas explicam.
