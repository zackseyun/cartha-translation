  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵין מְנַהֵ֣ל לָ֔/הּ מִ/כָּל בָּנִ֖ים יָלָ֑דָה וְ/אֵ֤ין מַחֲזִיק֙ בְּ/יָדָ֔/הּ מִ/כָּל בָּנִ֖ים גִּדֵּֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/018.yaml
  text: There is no one to guide her among all the sons she has borne[a], and no one to take her by the hand among all the sons she has raised.
translation:
  language: pt
  text: Não há quem a guie entre todos os filhos que ela deu à luz[a], nem quem a tome pela mão entre todos os filhos que ela criou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre todos os filhos que ela deu à luz [...] dentre todos os filhos que ela criou”. O hebraico diz especificamente “filhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנַהֵל
  choice: quem a guie
  rationale: O particípio de נהל indica conduzir ou guiar; “guie” expressa de modo natural tanto direção quanto cuidado no contexto do desamparo de Jerusalém personificada.
- source_word: לָהּ
  choice: a
  rationale: O sufixo pronominal feminino singular refere-se à cidade personificada, Sião/Jerusalém.
- source_word: מִכָּל בָּנִים
  choice: entre todos os filhos
  rationale: A construção מן com כל indica alguém dentre o grupo inteiro; “filhos” preserva o masculino plural explícito de בנים.
- source_word: יָלָדָה
  choice: ela deu à luz
  rationale: O verbo descreve Jerusalém como mãe que gerou seus filhos; “deu à luz” preserva claramente a imagem materna em português corrente.
- source_word: מַחֲזִיק בְּיָדָהּ
  choice: quem a tome pela mão
  rationale: A expressão envolve segurar ou fortalecer a mão e, neste contexto, comunica amparo e orientação; “tomar pela mão” mantém a imagem pessoal.
- source_word: גִּדֵּלָה
  choice: ela criou
  rationale: O piel de גדל significa criar ou educar filhos; “criou” é natural em português e forma um bom paralelo com “deu à luz”.
- source_word: אֵין ... וְאֵין
  choice: Não há quem ... nem quem
  rationale: A formulação preserva a dupla negação enfática e reproduz com fluidez o paralelismo hebraico.
theological_decisions:
- issue: Tradução marcada por gênero de בָּנִים
  choice: filhos
  alternative: crianças
  rationale: O hebraico emprega o masculino plural “filhos” na metáfora materna de Jerusalém; a tradução mantém essa especificidade sem neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo e a personificação feminina de Jerusalém foram preservados; “tomar pela mão” mantém a imagem concreta de orientação e amparo.
