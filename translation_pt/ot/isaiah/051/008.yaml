base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/008.yaml
  text: For the moth will eat them like a garment[a], and the worm will eat them like wool; but my righteousness will be forever, and my salvation to generation after generation.
translation:
  language: pt
  text: Pois a traça os comerá como se come uma roupa, e o verme os comerá como se come lã; mas a minha justiça[a] durará para sempre, e a minha salvação, de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. A palavra hebraica pode abranger tanto a retidão moral quanto a justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que sustenta a exortação anterior e preserva de modo natural a ligação causal.
- source_word: כַבֶּגֶד
  choice: como a uma roupa
  rationale: בֶּגֶד designa roupa ou peça de vestuário; esta formulação mantém a comparação poética em português corrente.
- source_word: יֹאכְלֵם
  choice: os comerá
  rationale: Mantém a imagem vívida do verbo אכל, literalmente 'comer', em vez de suavizá-la para 'consumir'.
- source_word: עָשׁ
  choice: a traça
  rationale: Refere-se à traça que destrói tecidos; o artigo definido expressa naturalmente a classe genérica em português.
- source_word: וְכַצֶּמֶר
  choice: e ... como à lã
  rationale: צֶמֶר significa 'lã'; a tradução conserva o paralelismo com a roupa.
- source_word: סָס
  choice: a larva
  rationale: O termo designa uma criatura que destrói tecido, provavelmente uma larva. 'Larva' distingue o segundo agente da traça sem especificar além da evidência lexical.
- source_word: וְצִדְקָתִי
  choice: mas a minha justiça
  rationale: צְדָקָה abrange retidão e justiça. 'Justiça' é natural neste contexto de ação divina salvadora, enquanto a nota preserva a alternativa 'retidão'; 'mas' explicita o contraste contextual.
- source_word: לְעוֹלָם תִּהְיֶה
  choice: durará para sempre
  rationale: Expressa em português idiomático a existência permanente indicada pelo hebraico, sem alterar seu sentido.
- source_word: וִישׁוּעָתִי
  choice: e a minha salvação
  rationale: יְשׁוּעָה denota salvação ou livramento; 'salvação' preserva a amplitude teológica e literária do termo em Isaías.
- source_word: לְדֹר דּוֹרִים
  choice: de geração em geração
  rationale: Reproduz de forma idiomática a duração contínua através de gerações sucessivas.
theological_decisions:
- issue: Tradução de צִדְקָה no contexto profético
  choice: justiça
  alternative: retidão
  rationale: O termo hebraico pode indicar tanto conformidade moral e fidelidade ao que é reto quanto justiça exercida. 'Justiça' se associa naturalmente à salvação divina neste contexto, e a nota mantém aberta a amplitude semântica genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora concreta de 'comer' e o paralelismo poético foram preservados; evitou-se linguagem excessivamente arcaica.
