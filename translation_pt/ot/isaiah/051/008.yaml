  to: Pois a traça os comerá como se come uma roupa, e o verme os comerá como se come lã; mas a minha justiça[a] durará para sempre, e a minha salvação, de geração em geração.
  rationale: A revisão substitui «larva» por «verme», preservando a incerteza lexical de סָס, e torna as duas comparações compreensíveis em português moderno por meio da elipse verbal explicitada. Mantêm-se o contraste introduzido por «mas», «justiça», «salvação» e a duração «de geração em geração».
