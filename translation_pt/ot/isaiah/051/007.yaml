  text: שִׁמְע֤וּ אֵלַ/י֙ יֹ֣דְעֵי צֶ֔דֶק עַ֖ם תּוֹרָתִ֣/י בְ/לִבָּ֑/ם אַל תִּֽירְאוּ֙ חֶרְפַּ֣ת אֱנ֔וֹשׁ וּ/מִ/גִּדֻּפֹתָ֖/ם אַל תֵּחָֽתּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/007.yaml
  text: 'Listen to me[a], you who know righteousness, people with my law in their hearts: do not fear the reproach of man[d][c][b], and do not be dismayed by their insults.'
translation:
  language: pt
  text: 'Escutem-me, vocês que conhecem a justiça, povo que tem a minha instrução no coração: não tenham medo da afronta de um mortal[a] nem fiquem abalados pelos insultos deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da afronta humana”. O termo hebraico está no singular e pode destacar o ser humano como mortal e frágil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Escutem-me
  rationale: O imperativo plural com אֶל convoca os destinatários a ouvir com atenção. “Escutem-me” é direto, natural e preserva o caráter de chamado.
- source_word: יֹדְעֵי צֶדֶק
  choice: vocês que conhecem a justiça
  rationale: צֶדֶק abrange justiça e retidão. “Justiça” é idiomático em português e mantém aqui a dimensão ética e pactual sem excluir a ideia de retidão.
- source_word: עַם תּוֹרָתִי בְלִבָּם
  choice: povo que tem a minha instrução no coração
  rationale: תּוֹרָה pode significar lei ou instrução. “Instrução” evita restringir o termo a legislação e expressa naturalmente a orientação divina interiorizada. O singular coletivo עַם e o singular idiomático “no coração” foram preservados.
- source_word: אַל תִּירְאוּ חֶרְפַּת אֱנוֹשׁ
  choice: não tenham medo da afronta dos mortais
  rationale: חֶרְפָּה designa afronta, desonra ou escárnio. אֱנוֹשׁ ressalta o ser humano em sua fragilidade; o plural genérico “mortais” comunica essa nuance em português natural.
- source_word: וּמִגִּדֻּפֹתָם
  choice: com os insultos deles
  rationale: גִּדֻּפוֹת refere-se a fala abusiva ou ultrajante. “Insultos” é claro e não introduz indevidamente o sentido específico de blasfêmia contra Deus.
- source_word: אַל תֵּחָתּוּ
  choice: nem fiquem abalados
  rationale: O nifal de חתת pode indicar ficar aterrorizado, desalentado ou interiormente quebrantado. “Fiquem abalados” preserva a força emocional e metafórica com naturalidade.
theological_decisions:
- issue: Amplitude semântica de צֶדֶק
  choice: justiça
  alternative: retidão
  rationale: As duas ideias pertencem ao campo semântico do termo. “Justiça” funciona naturalmente no chamado profético e conserva a dimensão moral e relacional, sem negar a nuance de retidão.
- issue: Sentido de תּוֹרָה
  choice: instrução
  alternative: lei
  rationale: Neste contexto, a palavra designa a orientação divina guardada interiormente. “Instrução” preserva essa amplitude, enquanto “lei” continua sendo uma alternativa legítima.
- issue: Caracterização de אֱנוֹשׁ
  choice: mortais
  alternative: ser humano
  rationale: O termo singular genérico frequentemente salienta a fragilidade humana. O plural “mortais” concorda naturalmente com o referente retomado por “deles” e mantém o contraste implícito entre a ameaça humana passageira e Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O discurso direto foi mantido no plural por meio de “vocês”; evitou-se tanto arcaísmo quanto explicitação doutrinária. O marcador [a] aparece junto ao termo que esclarece.
