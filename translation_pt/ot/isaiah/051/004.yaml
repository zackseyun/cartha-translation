  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַקְשִׁ֤יבוּ אֵלַ/י֙ עַמִּ֔/י וּ/לְאוּמִּ֖/י אֵלַ֣/י הַאֲזִ֑ינוּ כִּ֤י תוֹרָה֙ מֵ/אִתִּ֣/י תֵצֵ֔א וּ/מִשְׁפָּטִ֔/י לְ/א֥וֹר עַמִּ֖ים אַרְגִּֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/004.yaml
  text: Pay attention to me[a], my people, and give ear to me, my nation; for instruction will go out from me[c][b], and I will set my justice as a light for the peoples.
translation:
  language: pt
  text: Escutem-me com atenção, meu povo, e deem-me ouvidos, minha nação; pois de mim sairá a instrução[a], e estabelecerei[c] a minha justiça[b] como luz para os povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lei” ou “ensino” (hebraico תּוֹרָה).
    reason: lexical_alternative
  - marker: b
    text: Ou “o meu julgamento” (hebraico מִשְׁפָּטִי).
    reason: lexical_alternative
  - marker: c
    text: 'O verbo final também pode ser entendido como “farei repousar” ou “colocarei”, resultando em: “farei a minha justiça repousar como luz para os povos” ou “colocarei a minha justiça como luz para os povos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Escutem-me com atenção
  rationale: O imperativo de קשׁב convoca a uma escuta atenta. A expressão é natural em português atual e conserva a força do chamado.
- source_word: עַמִּי
  choice: meu povo
  rationale: Reproduz diretamente o vocativo coletivo e seu caráter pactual.
- source_word: וּלְאוּמִּי
  choice: minha nação
  rationale: Preserva a distinção poética entre עַם e לְאֹם sem perder o paralelismo.
- source_word: הַאֲזִינוּ
  choice: deem-me ouvidos
  rationale: Mantém o segundo imperativo como expressão paralela, porém lexicalmente distinta, em registro poético digno e compreensível.
- source_word: תּוֹרָה
  choice: instrução
  rationale: Neste contexto, designa o ensino autorizado de Deus que alcança os povos, sentido mais amplo que mera legislação. A nota registra “lei” e “ensino” como alternativas legítimas.
- source_word: תֵצֵא
  choice: sairá
  rationale: Expressa de modo conciso e idiomático o movimento da instrução que procede de Deus.
- source_word: וּמִשְׁפָּטִי
  choice: a minha justiça
  rationale: מִשְׁפָּט pode indicar justiça, julgamento ou decisão judicial. Em paralelo com תּוֹרָה e como luz para os povos, “justiça” comunica melhor a ordem justa de Deus, sem excluir a alternativa anotada.
- source_word: לְאוֹר עַמִּים
  choice: como luz para os povos
  rationale: Formulação natural em português que preserva a função da justiça divina e o alcance plural e internacional de עַמִּים.
- source_word: אַרְגִּיעַ
  choice: estabelecerei
  rationale: O hifil de רגע é difícil neste contexto. “Estabelecerei” comunica a ideia contextual de fazer a justiça permanecer firmemente posta, enquanto a nota preserva as possibilidades mais literais “farei repousar” e “colocarei”.
- source_word: עַמִּים
  choice: os povos
  rationale: Preserva a ligação lexical com “meu povo” e indica grupos humanos em sentido internacional.
theological_decisions:
- issue: Alcance de תּוֹרָה e מִשְׁפָּט em relação aos povos
  choice: O versículo apresenta a instrução autorizada e a justiça de Deus saindo dele para iluminar os povos.
  alternative: Entender a referência de modo mais restrito como a Lei mosaica e o julgamento dirigidos somente a Israel.
  rationale: A menção explícita aos “povos” favorece o horizonte universal, sem impor ao texto um sistema doutrinário posterior.
- issue: Sentido de מִשְׁפָּט
  choice: a minha justiça
  alternative: o meu julgamento
  rationale: A associação com “luz para os povos” favorece uma manifestação positiva da ordem justa de Deus, mas a nota conserva a possibilidade de “julgamento”.
- issue: Sentido do verbo אַרְגִּיעַ
  choice: estabelecerei
  alternative: farei repousar; colocarei
  rationale: A forma verbal admite mais de uma compreensão. O texto principal oferece uma formulação coerente e natural, e a nota mantém visível a incerteza lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado por “Escutem-me com atenção” e “deem-me ouvidos”; as ambiguidades lexicais relevantes foram mantidas em notas.
