  text: מִהַ֥ר צֹעֶ֖ה לְ/הִפָּתֵ֑חַ וְ/לֹא יָמ֣וּת לַ/שַּׁ֔חַת וְ/לֹ֥א יֶחְסַ֖ר לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/014.yaml
  text: The one bent low will soon be set free[a]; he will not die in the pit[b], and his bread will not be lacking.
translation:
  language: pt
  text: Aquele que está encurvado logo será libertado[a]; não morrerá na cova[b], nem lhe faltará o pão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o cativo logo será solto”. A expressão hebraica é difícil e pode evocar alguém curvado sob a opressão e depois libertado.
    reason: lexical_alternative
  - marker: b
    text: Ou “não morrerá no calabouço”. O termo hebraico pode indicar uma cova ou um calabouço e também pode se referir à sepultura ou à destruição.
    reason: alternative_reading
lexical_decisions:
- source_word: מִהַר
  choice: logo
  rationale: O verbo expressa pressa ou iminência; “logo” transmite naturalmente a promessa de libertação próxima.
- source_word: צֹעֶה
  choice: aquele que está encurvado
  rationale: O particípio é difícil. Esta opção preserva a imagem de alguém curvado ou humilhado sob opressão sem especificar indevidamente que se trata de um prisioneiro.
- source_word: לְהִפָּתֵחַ
  choice: será libertado
  rationale: Embora a forma de פתח signifique literalmente “ser aberto”, aqui indica idiomaticamente a libertação de confinamento ou opressão.
- source_word: וְלֹא יָמוּת
  choice: não morrerá
  rationale: Mantém diretamente a garantia expressa pelo imperfeito hebraico negado.
- source_word: לַשַּׁחַת
  choice: na cova
  rationale: שחת pode designar cova, calabouço, sepultura ou destruição. “Cova” conserva a imagem concreta e sua ressonância com morte e aprisionamento.
- source_word: וְלֹא יֶחְסַר לַחְמוֹ
  choice: nem lhe faltará o pão
  rationale: Formulação portuguesa natural que conserva a imagem concreta do pão e a promessa de provisão.
theological_decisions:
- issue: Identidade da figura oprimida
  choice: Uma pessoa singular oprimida, com linguagem suficientemente ampla para poder representar o povo exilado
  alternative: Um prisioneiro específico ou um sofredor generalizado
  rationale: A tradução mantém o singular da gramática hebraica, mas evita definir com excessiva precisão a identidade da pessoa.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão, com boa legibilidade brasileira. A construção preserva a ambiguidade lexical do hebraico mediante notas e mantém o paralelismo conciso do verso.
