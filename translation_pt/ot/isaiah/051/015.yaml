source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ רֹגַ֣ע הַ/יָּ֔ם וַ/יֶּהֱמ֖וּ גַּלָּ֑י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/015.yaml
  text: For I am Yahweh your God[b][a], who stirs up the sea so that its waves roar— Yahweh of hosts is his name.
translation:
  language: pt
  text: Pois eu sou Yahweh, seu Deus, aquele que agita o mar, de modo que suas ondas rugem[a] — Yahweh dos Exércitos é o nome dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que acalma o mar”. O particípio hebraico pode ser entendido como “agitar” ou “acalmar”, conforme o contexto; aqui, a menção ao rugido das ondas favorece “agita”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “é o nome dele”, na terceira pessoa. Algumas traduções ajustam a frase para “é o meu nome”, por causa da fala em primeira pessoa.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Pois eu sou
  rationale: O וְ com o pronome independente enfático dá continuidade à explicação e à reafirmação do contexto. “Pois eu sou” comunica de modo natural tanto a força explicativa como a ênfase pessoal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o substantivo com o sufixo de segunda pessoa masculina singular e conserva a relação direta da fala com o destinatário.
- source_word: רֹגַע הַיָּם
  choice: aquele que agita o mar
  rationale: Embora רֹגַע possa, conforme a análise lexical e o contexto, ser entendido como aquietar ou agitar, a oração seguinte, na qual as ondas rugem, favorece aqui a ideia de provocar a agitação do mar.
- source_word: וַיֶּהֱמוּ גַּלָּיו
  choice: e suas ondas rugem
  rationale: “Rugem” expressa com vivacidade o tumulto sonoro indicado por המה. O possessivo retoma naturalmente “o mar”; o presente combina com a caracterização participial de Deus.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Conserva o nome divino e traduz צְבָאוֹת por um título tradicional, inteligível e capaz de preservar sua conotação de forças ou exércitos.
- source_word: שְׁמוֹ
  choice: é o nome dele
  rationale: Mantém a terceira pessoa masculina singular do hebraico, sem harmonizá-la com a fala divina em primeira pessoa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e não o substitui por um título.
- issue: Sentido de רֹגַע em relação ao mar
  choice: agita o mar
  alternative: aquieta ou acalma o mar
  rationale: A referência imediata ao rugido das ondas favorece “agita”, mas a nota conserva a ambiguidade lexical genuína.
- issue: Pessoa gramatical de שְׁמוֹ na fala divina
  choice: é o nome dele
  alternative: é o meu nome
  rationale: Apesar de a primeira pessoa parecer mais esperada no discurso direto, o Texto Massorético apresenta sufixo de terceira pessoa; a tradução mantém essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Seu Deus” evita regionalismo excessivo; “Yahweh dos Exércitos” preserva o título solene. A formulação mantém tanto a ambiguidade de רֹגַע em nota quanto a mudança inesperada para a terceira pessoa em שְׁמוֹ.
