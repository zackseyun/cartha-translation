  source_fidelity: 'A tradução preserva adequadamente os elementos centrais do hebraico: os filhos, o desfalecimento, a imagem de estarem caídos nas ruas, o animal capturado em rede e a condição de estarem cheios da ira de Yahweh e da repreensão de seu Deus. A identificação de תּוֹא permanece prudentemente assinalada como incerta em nota. Contudo, “na entrada de todas as ruas” soa espacialmente impreciso em português e não representa com a mesma clareza a distribuição individual de בְּרֹאשׁ כָּל־חוּצוֹת.'
