source:
  edition: WLC
  text: בָּנַ֜יִ/ךְ עֻלְּפ֥וּ שָׁכְב֛וּ בְּ/רֹ֥אשׁ כָּל חוּצ֖וֹת כְּ/ת֣וֹא מִכְמָ֑ר הַֽ/מְלֵאִ֥ים חֲמַת יְהוָ֖ה גַּעֲרַ֥ת אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
translation:
  language: pt
  text: Seus filhos desfaleceram; jazem à entrada de cada rua[a], como um antílope preso numa rede[b], cheios da ira de Yahweh, da repreensão do seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em cada esquina”. Literalmente, “na cabeça de cada rua”.
    reason: lexical_alternative
  - marker: b
    text: Ou “como um boi selvagem preso numa rede”. A identificação exata do animal hebraico é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַיִךְ
  choice: Seus filhos
  rationale: O plural de בֵּן com sufixo feminino singular significa literalmente “seus filhos”; a referência masculina do hebraico é preservada.
- source_word: עֻלְּפוּ
  choice: desfaleceram
  rationale: A forma verbal descreve perda de forças ou desmaio causado por exaustão e aflição; “desfaleceram” expressa com naturalidade o colapso físico.
- source_word: שָׁכְבוּ
  choice: jazem
  rationale: O verbo indica que estão caídos ou deitados; o presente retrata vividamente o estado resultante.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: na entrada de todas as ruas
  rationale: רֹאשׁ é literalmente “cabeça, início”; no contexto urbano, provavelmente indica a entrada, extremidade ou esquina das ruas. A nota preserva a forma literal e outra leitura possível.
- source_word: כְּתוֹא
  choice: como um antílope
  rationale: A identificação exata do animal é incerta. “Antílope” preserva a imagem de um animal selvagem capturado sem sugerir precisão zoológica indevida.
- source_word: מִכְמָר
  choice: preso numa rede
  rationale: O substantivo designa uma rede de captura; acrescentar “preso” torna explícita em português a relação elíptica da comparação hebraica.
- source_word: הַמְלֵאִים
  choice: cheios
  rationale: O particípio plural retoma “filhos” e descreve a condição deles.
- source_word: חֲמַת יְהוָה
  choice: da ira de Yahweh
  rationale: חֵמָה denota ira ardente ou furor; “ira” mantém o peso judicial da expressão, e o nome divino é transliterado como Yahweh.
- source_word: גַּעֲרַת אֱלֹהָיִךְ
  choice: da repreensão do seu Deus
  rationale: גְּעָרָה indica uma censura forte e eficaz; “repreensão” é clara, solene e não arcaica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Identificação do animal תוא
  choice: antílope
  alternative: boi selvagem
  rationale: 'A espécie é lexicalmente incerta e a identificação não altera o ponto teológico da imagem: os filhos estão abatidos e indefesos como um animal capturado. A alternativa tradicional é registrada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Jazem” conserva a força poética e a imagem pública dos corpos caídos, enquanto “desfaleceram” comunica o colapso sem linguagem excessivamente técnica. As notas são colocadas junto às expressões a que de fato se referem, corrigindo a associação aparentemente trocada dos marcadores na camada inglesa.
