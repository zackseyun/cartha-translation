  text: אוֹקִ֥יר אֱנ֖וֹשׁ מִ/פָּ֑ז וְ/אָדָ֖ם מִ/כֶּ֥תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/012.yaml
  text: I will make mortal man rarer than fine gold[a], and mankind than the gold of Ophir.
translation:
  language: pt
  text: Tornarei o ser humano mais raro do que o ouro fino[a], e a humanidade mais rara do que o ouro de Ofir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tornarei o ser humano mais precioso do que o ouro fino». O verbo hebraico pode destacar preciosidade ou valor; neste contexto, isso provavelmente implica extrema escassez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹקִיר
  choice: tornarei ... mais raro
  rationale: O hifil de יקר pode indicar tornar precioso ou valioso. No contexto de juízo e despovoamento, a comparação com o ouro comunica sobretudo extrema escassez; «mais raro» expressa esse efeito com naturalidade, enquanto a nota preserva a alternativa ligada ao valor.
- source_word: אֱנוֹשׁ
  choice: o ser humano
  rationale: אֱנוֹשׁ designa o humano frágil e mortal. «O ser humano» mantém a referência genérica em português corrente; a mortalidade está implícita no termo e no contexto, sem a formulação menos natural «homem mortal».
- source_word: מִפָּז
  choice: do que o ouro fino
  rationale: פָּז denota ouro de qualidade elevada ou refinado. «Ouro fino» é expressão natural e digna em português.
- source_word: וְאָדָם
  choice: e a humanidade
  rationale: אָדָם funciona aqui coletivamente e em paralelismo com אֱנוֹשׁ. «A humanidade» preserva a referência genérica ao conjunto dos seres humanos e distingue os dois membros do paralelismo.
- source_word: מִכֶּתֶם אוֹפִיר
  choice: do que o ouro de Ofir
  rationale: כֶּתֶם designa ouro precioso, e אוֹפִיר é o lugar célebre por seu ouro. A formulação preserva de modo claro a alusão geográfica.
theological_decisions:
- issue: Sentido de אוֹקִיר no contexto do juízo
  choice: mais raro
  alternative: mais precioso
  rationale: O verbo permite uma leitura de valor ou preciosidade, mas o contexto de devastação favorece a consequência concreta da escassez humana. A nota mantém aberta a ambiguidade lexical genuína.
- issue: Referência humana genérica de אָדָם
  choice: a humanidade
  alternative: o homem
  rationale: O termo tem sentido coletivo neste paralelismo. «A humanidade» comunica esse alcance sem limitar a referência ao sexo masculino nem introduzir uma leitura doutrinária específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém o paralelismo poético, explicita «mais rara» no segundo membro para clareza em português e conserva «Ofir» como topônimo tradicional.
