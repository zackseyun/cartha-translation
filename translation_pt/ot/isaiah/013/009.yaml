revisions:
- from: Eis que o dia de Yahweh[a] vem — cruel, com indignação e ira ardente[b] — para tornar a terra[c] uma desolação; ele exterminará dela os seus pecadores.[d]
  to: Eis que o dia de Yahweh[a] vem — cruel, com furor e ira ardente[b] — para fazer da terra[c] uma desolação e destruir[d] os pecadores que nela há.
  rationale: A revisão substitui o termo excessivamente específico “exterminará” por “destruir”, torna a relação “pecadores ... nela” idiomática e emprega infinitivos coordenados para refletir o propósito expresso por לָשׂוּם e evitar decidir indevidamente o sujeito de יַשְׁמִיד. As notas foram ajustadas ao novo ponto de ancoragem e à ambiguidade sintática real.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:30:22Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a estrutura do anúncio e a ambiguidade de אֶרֶץ com “terra”. Contudo, “exterminará” é mais específico e historicamente carregado do que o hifil de שׁמד exige; “destruir” é o equivalente seguro. A construção “ele exterminará dela os seus pecadores” também é pouco natural em português e o pronome finito tende a orientar o leitor para um agente pessoal, embora o hebraico deixe o sujeito não expresso.
  naturalness: “Eis que”, “vem”, “cruel” e “desolação” são naturais no registro profético moderno. A revisão usa infinitivos coordenados (“fazer ... e destruir ...”), que refletem os infinitivos/propósito do hebraico e evitam a formulação pouco fluente “exterminará dela”.
  terminology: “Yahweh” corresponde ao nome divino no texto-fonte e à política indicada. “Furor e ira ardente” preserva adequadamente a acumulação de termos de ira; “destruir” traduz שׁמד sem a sobredeterminação de “exterminar”.
  issues:
  - severity: medium
    issue: “Exterminará” sobre-especifica יַשְׁמִיד.
    rationale: שׁמד denota destruição decisiva, mas não exige a conotação moderna mais específica de “extermínio”. “Destruir” mantém a força sem acrescentar essa nuance.
  - severity: medium
    issue: “Ele exterminará dela os seus pecadores” é sintaticamente pouco idiomático e reduz a ambiguidade do sujeito.
    rationale: A construção com pronome pessoal sugere mais diretamente Yahweh como sujeito. O hebraico não expressa o sujeito do verbo; a ligação com “o dia de Yahweh” é a leitura gramatical mais próxima, embora Yahweh possa ser entendido como agente. Os infinitivos coordenados preservam melhor a forma e evitam a dificuldade estilística.
