source:
  edition: WLC
  text: הִנֵּ֤ה יוֹם יְהוָה֙ בָּ֔א אַכְזָרִ֥י וְ/עֶבְרָ֖ה וַ/חֲר֣וֹן אָ֑ף לָ/שׂ֤וּם הָ/אָ֨רֶץ֙ לְ/שַׁמָּ֔ה וְ/חַטָּאֶ֖י/הָ יַשְׁמִ֥יד מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/009.yaml
  text: Behold[a], the day of Yahweh is coming—cruel, with wrath and fierce anger—to make the land a desolation[d][c][b], and he will destroy its sinners from it.
translation:
  language: pt
  text: Eis que o dia de Yahweh[a] vem — cruel, com furor e ira ardente[b] — para fazer da terra[c] uma desolação e destruir[d] os pecadores que nela há.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino YHWH, aqui transliterado como “Yahweh”.
    reason: divine_name
  - marker: b
    text: O hebraico acumula termos de cólera; também pode ser traduzido como “com indignação e ira ardente” ou “com fúria e furor”.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico pode designar tanto a terra em sentido amplo quanto um país ou território.
    reason: lexical_ambiguity
  - marker: d
    text: O sujeito não é expresso no hebraico. Gramaticalmente, pode referir-se ao dia de Yahweh; Yahweh também pode ser entendido como o agente de seu dia de juízo.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força dêitica e solene do anúncio profético em português natural e digno.
- source_word: יוֹם יְהוָה
  choice: o dia de Yahweh
  rationale: Mantém a fórmula profética e translitera o nome divino conforme a norma do projeto.
- source_word: בָּא
  choice: vem
  rationale: O perfeito hebraico apresenta o acontecimento futuro como iminente ou certo; o presente português conserva a vivacidade do anúncio.
- source_word: אַכְזָרִי
  choice: cruel
  rationale: Equivalente direto que descreve o dia como um tempo de juízo implacável, sem acrescentar interpretação.
- source_word: וְעֶבְרָה וַחֲרוֹן אָף
  choice: com indignação e ira ardente
  rationale: Conserva a acumulação de termos de cólera e expressa o elemento de calor presente na expressão חֲרוֹן אָף.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Em português, “terra” preserva melhor a amplitude lexical entre território e mundo habitado, deixando o contexto definir o alcance.
- source_word: לְשַׁמָּה
  choice: uma desolação
  rationale: Mantém o registro profético e a ideia de devastação completa.
- source_word: יַשְׁמִיד
  choice: ele exterminará
  rationale: O hifil de שׁמד indica destruição decisiva; “exterminará” comunica a força do verbo, enquanto “ele” mantém possível referência tanto a Yahweh quanto ao dia.
- source_word: וְחַטָּאֶיהָ ... מִמֶּנָּה
  choice: dela os seus pecadores
  rationale: Reproduz a relação dos pecadores com a terra e a ideia de sua remoção do meio dela de maneira idiomática.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva o nome próprio hebraico e segue a norma indicada pelo projeto, sem recorrer a uma substituição confessional.
- issue: Sujeito de יַשְׁמִיד
  choice: “ele”, com referente não explicitado além do hebraico
  alternative: “Yahweh exterminará” ou “o dia exterminará”
  rationale: Tanto “Yahweh” quanto “dia” podem servir de antecedente masculino singular. O pronome português conserva essa ambiguidade genuína em vez de resolvê-la silenciosamente.
- issue: Alcance de הָאָרֶץ
  choice: terra
  alternative: país; território; mundo
  rationale: O substantivo hebraico admite alcance local ou amplo. “Terra” preserva essa tensão lexical e se ajusta ao horizonte internacional e cósmico do contexto sem excluir uma referência territorial.
translation_notes:
  register: Português moderno, solene e acessível, com cadência própria de um oráculo profético. “Eis que” assinala o anúncio; os travessões destacam a caracterização intensa do dia. A redação evita arcaísmos desnecessários e preserva ambiguidades reais do hebraico.
