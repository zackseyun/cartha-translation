base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/007.yaml
  text: Therefore all hands will grow weak[a], and every human heart will melt.
translation:
  language: pt
  text: Por isso, todas as mãos perderão as forças, e todo coração humano[a] se derreterá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo coração mortal”. O termo hebraico אֱנוֹשׁ designa genericamente o ser humano, muitas vezes ressaltando sua fragilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural e conciso a relação de consequência com o anúncio de juízo precedente.
- source_word: כָּל יָדַיִם
  choice: todas as mãos
  rationale: Mantém a imagem corporal coletiva do hebraico, ligada à perda da capacidade de agir.
- source_word: תִּרְפֶּינָה
  choice: perderão as forças
  rationale: Comunica em português atual o sentido de ficar frouxo, débil ou sem força, preservando a ideia de colapso físico diante do temor.
- source_word: וְכָל לְבַב אֱנוֹשׁ
  choice: e todo coração humano
  rationale: Preserva o singular representativo e a referência genérica à humanidade; 'coração' conserva a imagem da coragem ou disposição interior.
- source_word: יִמָּס
  choice: se derreterá
  rationale: Mantém a metáfora hebraica de derretimento para a dissolução da coragem diante do medo.
theological_decisions:
- issue: Tradução de אֱנוֹשׁ numa expressão humana genérica
  choice: humano
  alternative: mortal; do homem
  rationale: '''Humano'' comunica a referência genérica sem restringi-la ao sexo masculino. A nota preserva a possível nuance de fragilidade e mortalidade presente em אֱנוֹשׁ.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as imagens paralelas das mãos enfraquecidas e do coração que se derrete.
