  to: Eu mesmo dei ordens aos meus consagrados; também convoquei os meus guerreiros para a minha ira, os que exultam na minha majestade.[a]
  rationale: A revisão recupera o particípio possessivado «meus consagrados» e não introduz o verbo «executar». Mantém «os que exultam na minha majestade» como leitura principal plausível da expressão final, enquanto a nota preserva alternativas relevantes em português idiomático.
