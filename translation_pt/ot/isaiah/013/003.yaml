  text: אֲנִ֥י צִוֵּ֖יתִי לִ/מְקֻדָּשָׁ֑/י גַּ֣ם קָרָ֤אתִי גִבּוֹרַ/י֙ לְ/אַפִּ֔/י עַלִּיזֵ֖י גַּאֲוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/003.yaml
  text: I myself have commanded my consecrated ones; I have also summoned my warriors for my anger[a], my proudly exulting ones.
translation:
  language: pt
  text: Eu mesmo dei ordens aos meus consagrados; também convoquei os meus guerreiros para a minha ira, os que exultam na minha majestade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que exultam no meu triunfo»; ou, possivelmente: «meus guerreiros que exultam orgulhosamente».'
    reason: A expressão hebraica עַלִּיזֵי גַּאֲוָתִי é compacta. Pode relacionar a exultação à majestade ou ao triunfo de Deus, ou caracterizar os guerreiros como exultantes e orgulhosos.
lexical_decisions:
- source_word: אֲנִי
  choice: Eu mesmo
  rationale: O pronome independente é enfático ao lado da forma verbal; «Eu mesmo» preserva essa ênfase.
- source_word: צִוֵּיתִי
  choice: dei ordens
  rationale: O piel de צוה significa normalmente dar ordem ou incumbência; a expressão é natural em português e mantém a ação divina declarada como realizada.
- source_word: לִמְקֻדָּשָׁי
  choice: aos que consagrei
  rationale: Expressa pessoas separadas por Deus para uma finalidade, sem sugerir necessariamente santidade moral.
- source_word: גַּם קָרָאתִי
  choice: também convoquei
  rationale: «Também» coordena a segunda ação, e «convoquei» se ajusta ao contexto de mobilização militar.
- source_word: גִּבּוֹרַי
  choice: os meus guerreiros
  rationale: No contexto bélico, גבור designa homens valentes ou poderosos como combatentes.
- source_word: לְאַפִּי
  choice: para executar a minha ira
  rationale: אף significa idiomaticamente ira; o complemento verbal explicita em português a finalidade indicada por ל sem alterar o referente.
- source_word: עַלִּיזֵי גַּאֲוָתִי
  choice: os que exultam na minha majestade
  rationale: A frase hebraica comprimida pode indicar pessoas jubilantes na majestade, exaltação ou triunfo de Deus; esta formulação é natural e mantém o vínculo genitivo.
theological_decisions:
- issue: Sentido de «os que consagrei»
  choice: Agentes separados por Deus para executar seu juízo
  alternative: Pessoas moralmente santas ou seres angélicos
  rationale: O contexto imediato descreve a mobilização de forças contra a Babilônia; a consagração é funcional e não afirma o caráter moral dos agentes.
- issue: Construção de עַלִּיזֵי גַּאֲוָתִי
  choice: os que exultam na minha majestade
  alternative: os meus exultantes orgulhosos; os que exultam no meu triunfo
  rationale: A construção admite mais de uma relação semântica. O texto principal adota uma leitura clara e plausível, enquanto a nota preserva as alternativas relevantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Dei ordens» evita uma construção rígida; «os que consagrei» comunica separação para uma tarefa sem implicar santidade moral. A nota conserva a ambiguidade genuína da frase final.
