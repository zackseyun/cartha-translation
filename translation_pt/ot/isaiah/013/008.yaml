base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/008.yaml
  text: They will be dismayed; pains and labor pangs will seize them[a]. They will writhe like a woman giving birth. Each man will stare at his neighbor; their faces will be faces of flame.
translation:
  language: pt
  text: Ficarão apavorados; dores e contrações se apoderarão deles. Vão se contorcer como a mulher que dá à luz. Cada um olhará atônito para o outro; seus rostos serão rostos de chamas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus rostos estarão em chamas”. O hebraico diz literalmente: “seus rostos são rostos de chamas”, imagem vívida que pode sugerir uma aparência ardente ou avermelhada, ou ainda o terror estampado no rosto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְהָלוּ
  choice: Ficarão apavorados
  rationale: O nifal de בהל expressa alarme súbito, perturbação ou pânico. “Ficarão apavorados” conserva o sentido incoativo e é claro em português atual.
- source_word: צִירִים וַחֲבָלִים
  choice: dores e contrações
  rationale: Os dois substantivos descrevem dores intensas e, à luz da comparação seguinte com uma mulher dando à luz, evocam de modo natural as dores e contrações do parto.
- source_word: יֹאחֵזוּן
  choice: se apoderarão deles
  rationale: O verbo אחז significa agarrar ou tomar posse. A expressão portuguesa comunica vividamente que as dores os dominarão sem soar mecânica.
- source_word: כַּיּוֹלֵדָה יְחִילוּן
  choice: Vão se contorcer como a mulher que dá à luz
  rationale: A comparação é com uma mulher no ato de dar à luz, e o verbo חיל/חול neste contexto descreve a reação corporal intensa própria das dores do parto.
- source_word: אִישׁ אֶל־רֵעֵהוּ יִתְמָהוּ
  choice: Cada um olhará atônito para o outro
  rationale: A construção distributiva hebraica é vertida de maneira natural. “Atônito” explicita o assombro contido no verbo תמה, sem acrescentar uma causa não declarada.
- source_word: פְּנֵי לְהָבִים פְּנֵיהֶם
  choice: seus rostos serão rostos de chamas
  rationale: A formulação conserva a metáfora nominal incomum e vívida do hebraico, sem decidir se ela descreve aparência ardente, rubor ou terror visível.
