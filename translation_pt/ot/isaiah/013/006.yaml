  text: הֵילִ֕ילוּ כִּ֥י קָר֖וֹב י֣וֹם יְהוָ֑ה כְּ/שֹׁ֖ד מִ/שַּׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/006.yaml
  text: Wail[a], for the day of Yahweh is near[b]; it will come like destruction from the Almighty.
translation:
  language: pt
  text: Uivem[a], pois o dia de Yahweh está próximo; ele virá como devastação da parte do Todo-Poderoso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lamentem”. O imperativo hebraico indica um clamor alto de dor ou terror.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, há um jogo sonoro entre “devastação” (shod) e “Todo-Poderoso” (Shaddai).
    reason: wordplay
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Lamentem-se
  rationale: O imperativo plural de ילל convoca a um clamor intenso de dor ou terror. “Lamentem-se” é natural e digno em português, embora a nota preserve a força mais áspera de “uivem”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior e mantém o estilo profético conciso.
- source_word: קָרוֹב
  choice: está próximo
  rationale: Expressa a iminência do acontecimento anunciado de modo claro e corrente.
- source_word: יוֹם יְהוָה
  choice: o dia de Yahweh
  rationale: Preserva a fórmula profética e translitera o nome divino pessoal.
- source_word: כְּשֹׁד
  choice: como devastação
  rationale: שֹׁד denota aqui destruição violenta; “devastação” comunica bem o sentido no contexto de juízo.
- source_word: מִשַּׁדַּי
  choice: da parte do Todo-Poderoso
  rationale: A preposição מן indica procedência, e שַׁדַּי é traduzido como título divino. “Da parte de” evita a possível leitura espacial de “do”.
- source_word: יָבֹוא
  choice: ele virá
  rationale: O verbo masculino singular retoma naturalmente “o dia” em português, sem excluir que a imagem focalize a devastação vindoura.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega o Tetragrama como nome pessoal; a transliteração “Yahweh” preserva essa função em vez de substituí-lo por um título.
- issue: Tradução de שַׁדַּי
  choice: o Todo-Poderoso
  alternative: Shaddai
  rationale: שַׁדַּי funciona como título divino e é traduzido de maneira inteligível e tradicional, enquanto a nota registra o jogo sonoro hebraico.
- issue: Referente de יָבֹוא
  choice: ele virá, retomando “o dia”
  alternative: ela virá, referindo-se à devastação
  rationale: A concordância masculina do hebraico favorece a retomada de יוֹם, também masculino. A construção comparativa mantém, contudo, a estreita associação com a devastação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O plural “lamentem-se” dirige a ordem a uma coletividade; “da parte do” explicita procedência sem ampliar o conteúdo.
