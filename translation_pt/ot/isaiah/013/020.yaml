  verdict: revise
  source_fidelity: 'O sentido central está corretamente representado: a cidade permanecerá desabitada, nenhum árabe armará tenda ali, e os pastores não farão seus rebanhos deitar-se ali. A nota preserva adequadamente a possível amplitude semântica de עֲרָבִי.'
  naturalness: “Haverá quem more nela de geração em geração” pode sugerir que uma mesma pessoa viveria por gerações. A construção impessoal “nela se morará” exprime mais diretamente a ocupação continuada da cidade. “Fazer os rebanhos repousar” é compreensível, mas “fazer ... deitar-se” reproduz com maior precisão a causatividade e a imagem concreta do hebraico.
  terminology: “Árabe” é a tradução lexical direta e apropriada, com a alternativa contextual devidamente indicada em nota. “Pastores” e “rebanhos” são claros e adequados.
