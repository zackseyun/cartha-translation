  text: לֹֽא תֵשֵׁ֣ב לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכֹּ֖ן עַד דּ֣וֹר וָ/ד֑וֹר וְ/לֹֽא יַהֵ֥ל שָׁם֙ עֲרָבִ֔י וְ/רֹעִ֖ים לֹא יַרְבִּ֥צוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/020.yaml
  text: It will never be inhabited[a], and it will not be dwelt in from generation to generation; no Arab will pitch his tent there, and shepherds will not make their flocks lie down there.
translation:
  language: pt
  text: Nunca mais será habitada, nem nela se morará de geração em geração. Nenhum árabe[a] armará ali a sua tenda, e os pastores não farão os seus rebanhos deitar-se ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nômade do deserto”. O termo hebraico pode designar especificamente um árabe ou, de modo mais amplo neste contexto, alguém que vive como nômade no deserto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵשֵׁב
  choice: será habitada
  rationale: Com uma cidade como sujeito, יָשַׁב tem o sentido idiomático de ser habitada; a formulação passiva é natural em português.
- source_word: לָנֶצַח
  choice: nunca mais
  rationale: Sob negação, expressa duração permanente. “Nunca mais” comunica naturalmente que a desolação não será revertida.
- source_word: תִשְׁכֹּן
  choice: haverá quem more nela
  rationale: שָׁכַן significa morar ou estabelecer-se. Esta formulação mantém alguma distinção em relação a “será habitada” e soa natural em português.
- source_word: עַד דּוֹר וָדוֹר
  choice: de geração em geração
  rationale: Reproduz o idioma hebraico de duração contínua através de gerações sucessivas.
- source_word: יַהֵל
  choice: armará ali a sua tenda
  rationale: A forma verbal indica acampar ou montar uma tenda; a expressão preserva a imagem concreta do hebraico.
- source_word: עֲרָבִי
  choice: árabe
  rationale: É o equivalente lexical mais direto, embora o termo possa, neste contexto, ser entendido mais amplamente como um nômade do deserto; essa possibilidade é registrada em nota.
- source_word: רֹעִים
  choice: pastores
  rationale: Designa pessoas que apascentam rebanhos; “pastores” é o equivalente corrente e claro.
- source_word: יַרְבִּצוּ
  choice: não farão seus rebanhos repousar
  rationale: A forma causativa significa fazer deitar ou fazer repousar. O objeto implícito são os animais dos pastores, explicitados como “seus rebanhos” para evitar a impressão de que os próprios pastores se deitam.
