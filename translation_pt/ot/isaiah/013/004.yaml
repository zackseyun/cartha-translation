id: ISA.13.4
reference: Isaiah 13:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֥וֹל הָמ֛וֹן בֶּֽ/הָרִ֖ים דְּמ֣וּת עַם רָ֑ב ק֠וֹל שְׁא֞וֹן מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים יְהוָ֣ה צְבָא֔וֹת מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/004.yaml
  text: The sound of a multitude in the mountains[a], like a great people! The sound of an uproar of kingdoms[b], of nations gathered together! Yahweh of hosts is mustering an army for battle.
translation:
  language: pt
  text: O som de uma multidão nas montanhas[a], como o de um povo numeroso! O som do tumulto de reinos, de nações reunidas[b]! Yahweh dos Exércitos está mobilizando um exército para a batalha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre as montanhas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de reinos, de nações que estão se reunindo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  choice: O som de
  rationale: קוֹל pode significar som, ruído ou voz. Neste cenário de agitação militar, “o som de” apresenta naturalmente a cena auditiva sem sugerir fala articulada; a repetição foi mantida por seu efeito retórico.
- source_word: הָמ֛וֹן
  choice: uma multidão
  rationale: הָמוֹן pode designar uma multidão ou uma massa ruidosa. Como קוֹל já expressa o aspecto sonoro e a frase seguinte compara o conjunto a um povo numeroso, “multidão” preserva melhor o sentido coletivo.
- source_word: בֶּֽהָרִ֖ים
  choice: nas montanhas
  rationale: A preposição בְּ é aqui entendida em sentido locativo. “Nas montanhas” é natural e mantém a imagem do relevo elevado; “sobre as montanhas” continua possível e é registrada em nota.
- source_word: דְּמ֣וּת
  choice: como o de
  rationale: Embora o substantivo signifique formalmente “semelhança”, neste contexto introduz uma comparação. “Como o de” explicita de modo natural que o som é comparado ao de um povo numeroso.
- source_word: עַם רָ֑ב
  choice: um povo numeroso
  rationale: עַם é “povo”, e רַב indica aqui grande número ou magnitude. “Povo numeroso” comunica com clareza o tamanho da força sem transformar o coletivo em indivíduos dispersos.
- source_word: שְׁא֞וֹן
  choice: tumulto
  rationale: שָׁאוֹן denota forte estrondo, alvoroço ou tumulto. “Tumulto” conserva tanto a agitação quanto sua dimensão sonora e combina com a reunião militar dos reinos.
- source_word: מַמְלְכ֤וֹת גּוֹיִם֙
  choice: de reinos, de nações
  rationale: A sequência acumula termos políticos e coletivos. A aposição “de reinos, de nações” preserva essa construção densa sem reduzi-la a uma única expressão interpretativa.
- source_word: נֶֽאֱסָפִ֔ים
  choice: reunidas
  rationale: O particípio nifal de אסף descreve as nações como reunidas ou congregadas. “Reunidas” mantém a forma resultativa/passiva, enquanto a possibilidade dinâmica “que estão se reunindo” aparece em nota.
- source_word: יְהוָ֣ה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio, não substituído por um título. A forma “Yahweh” preserva de maneira transparente a referência ao nome divino.
- source_word: צְבָא֔וֹת
  choice: dos Exércitos
  rationale: No título יְהוָה צְבָאוֹת, “dos Exércitos” é claro em português moderno e conserva a imagem de forças organizadas, sem limitar explicitamente o título a exércitos apenas humanos.
- source_word: מְפַקֵּ֖ד
  choice: está mobilizando
  rationale: פקד possui amplo campo semântico, incluindo contar, inspecionar, designar e reunir tropas. Diante de צְבָא מִלְחָמָה, “está mobilizando” expressa o sentido militar contextual sem impor a ideia mais específica de contagem ou revista.
- source_word: צְבָ֥א מִלְחָמָֽה
  choice: um exército para a batalha
  rationale: A expressão designa uma força militar preparada para combater. “Um exército para a batalha” é idiomático, claro e preserva a finalidade bélica da mobilização.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. A tradução mantém o nome próprio como “Yahweh”, em vez de substituí-lo por um título; formas tradicionais portuguesas são reconhecidas, mas não adotadas no texto principal.
- issue: Amplitude do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: Yahweh dos exércitos celestiais; Yahweh das hostes
  rationale: “Dos Exércitos” preserva a abertura do hebraico quanto à natureza das hostes, evitando restringi-las no próprio texto a forças celestiais ou humanas.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura exclamativa e a repetição de “O som” reproduzem o paralelismo e a intensidade auditiva do hebraico. Evitaram-se termos arcaicos como “hostes” no texto principal; “mobilizando” comunica com naturalidade a preparação militar.
