  text: עַל כֵּן֙ שָׁמַ֣יִם אַרְגִּ֔יז וְ/תִרְעַ֥שׁ הָ/אָ֖רֶץ מִ/מְּקוֹמָ֑/הּ בְּ/עֶבְרַת֙ יְהוָ֣ה צְבָא֔וֹת וּ/בְ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/013.yaml
  text: Therefore I will make the heavens tremble[a], and the earth will shake from its place, at the fury of Yahweh of Armies, in the day of his burning anger.
translation:
  language: pt
  text: Por isso, farei os céus tremer, e a terra tremerá, saindo do seu lugar, pela fúria de Yahweh dos Exércitos[a], no dia da sua ira ardente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma tradicional, “SENHOR dos Exércitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz de modo natural e conciso a consequência do anúncio de juízo precedente.
- source_word: שָׁמַיִם אַרְגִּיז
  choice: farei os céus tremerem
  rationale: Preserva o plural cósmico de שָׁמַיִם e a força causativa do hifil de רגז.
- source_word: וְתִרְעַשׁ הָאָרֶץ
  choice: e a terra será sacudida
  rationale: Comunica o abalo sísmico de רעשׁ e mantém a distinção verbal em relação a 'tremerem'.
- source_word: מִמְּקוֹמָהּ
  choice: para fora do seu lugar
  rationale: Expressa claramente o deslocamento desde a posição própria da terra.
- source_word: בְּעֶבְרַת
  choice: por causa da fúria de
  rationale: Neste contexto, בְּ marca a causa do abalo; 'fúria' transmite a intensidade de עֶבְרָה.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Translitera o nome divino e traduz צְבָאוֹת de forma transparente, preservando a força marcial do título.
- source_word: וּבְיוֹם חֲרוֹן אַפּוֹ
  choice: no dia da sua ira ardente
  rationale: Mantém a expressão temporal profética e a metáfora hebraica do calor intenso da ira.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome pessoal divino; 'Yahweh' o preserva como nome, sem substituí-lo por um título.
- issue: Sentido do título יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  alternative: SENHOR dos Exércitos; Yahweh das hostes
  rationale: '''Exércitos'' torna compreensível o sentido de צְבָאוֹת no contexto de juízo, sem limitar explicitamente quais exércitos estão em vista.'
translation_notes:
  register: Português moderno, digno e acessível, com cadência profética. A construção mantém a escala cósmica do paralelismo entre céus e terra e conserva a intensidade da linguagem de juízo.
