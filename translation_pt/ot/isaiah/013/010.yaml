id: ISA.13.10
reference: Isaiah 13:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי כוֹכְבֵ֤י הַ/שָּׁמַ֨יִם֙ וּ/כְסִ֣ילֵי/הֶ֔ם לֹ֥א יָהֵ֖לּוּ אוֹרָ֑/ם חָשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ בְּ/צֵאת֔/וֹ וְ/יָרֵ֖חַ לֹֽא יַגִּ֥יהַ אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/010.yaml
  text: For the stars of the heavens and their constellations will not give their light; the sun is darkened at its rising[a], and the moon will not make its light shine.
translation:
  language: pt
  text: Pois as estrelas dos céus e as suas constelações[a] não darão a sua luz; o sol escurece ao nascer, e a lua não fará brilhar a sua luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os seus Órions”. O termo hebraico pode designar especificamente Órion, mas aqui talvez seja usado de modo mais amplo para as constelações.'
    reason: Alternativa lexical para כְּסִילֵיהֶם.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do anúncio de juízo anterior e mantém a ligação discursiva de modo natural em português.
- source_word: כֹוכְבֵי הַשָּׁמַיִם
  choice: as estrelas dos céus
  rationale: Preserva a construção genitiva hebraica e o registro elevado da poesia profética.
- source_word: וּכְסִילֵיהֶם
  choice: e as suas constelações
  rationale: כְּסִיל pode designar especificamente Órion, mas o plural com sufixo favorece aqui uma referência mais ampla às constelações; a alternativa lexical é registrada em nota.
- source_word: לֹא יָהֵלּוּ אוֹרָם
  choice: não darão a sua luz
  rationale: Expressa com clareza e naturalidade a ideia causativa de emitir ou fazer aparecer luz.
- source_word: חָשַׁךְ הַשֶּׁמֶשׁ בְּצֵאתוֹ
  choice: o sol escurece ao nascer
  rationale: O perfeito hebraico apresenta vividamente o evento profético, enquanto בְּצֵאתוֹ indica o nascer do sol. O presente em português conserva essa vivacidade sem acrescentar uma voz passiva ausente do hebraico.
- source_word: וְיָרֵחַ לֹא יַגִּיהַ אוֹרוֹ
  choice: e a lua não fará brilhar a sua luz
  rationale: Mantém o valor causativo do hifil de נגה e produz uma formulação portuguesa clara e digna.
theological_decisions:
- issue: Natureza da linguagem de escurecimento cósmico
  choice: Manter diretamente a imagem cósmica do texto
  alternative: Interpretá-la explicitamente como colapso astronômico literal ou como metáfora da queda de poderes terrenos
  rationale: O hebraico emprega imagens cósmicas de des-criação num oráculo de juízo. A tradução conserva seu peso e sua tensão sem decidir, no próprio texto, entre leituras literal e figurativa.
- issue: Valor temporal do perfeito חָשַׁךְ
  choice: escurece
  alternative: escurecerá / ficou escuro
  rationale: O presente vívido reflete o perfeito profético em meio a formas de orientação futura, sem apagar a mudança aspectual do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “sua luz” preserva o paralelismo hebraico. O ponto e vírgula mantém a estrutura poética entre os corpos celestes.
