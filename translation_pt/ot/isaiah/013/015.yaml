  text: כָּל הַ/נִּמְצָ֖א יִדָּקֵ֑ר וְ/כָל הַ/נִּסְפֶּ֖ה יִפּ֥וֹל בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/015.yaml
  text: Everyone who is found will be pierced through[a], and everyone who is caught will fall by the sword.
translation:
  language: pt
  text: Todo aquele que for encontrado será traspassado, e todo aquele que for apanhado[a] cairá à espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “for arrastado”. O particípio hebraico derivado de ספה pode ter um sentido mais amplo do que simplesmente ser capturado ou apanhado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנִּמְצָא
  choice: Todo aquele que for encontrado
  rationale: A construção distributiva com o particípio nifal substantivado refere-se a cada pessoa encontrada. A formulação preserva a passividade e soa natural em português.
- source_word: יִדָּקֵר
  choice: será traspassado
  rationale: O nifal de דקר descreve alguém perfurado por uma arma. “Traspassado” mantém a força violenta e o registro digno do contexto profético.
- source_word: וְכָל הַנִּסְפֶּה
  choice: e todo aquele que for apanhado[a]
  rationale: O particípio passivo de ספה tem amplitude semântica e pode indicar alguém apanhado ou arrastado pela calamidade. No contexto militar imediato, “for apanhado” comunica adequadamente a ideia sem eliminar a alternativa lexical, registrada em nota.
- source_word: יִפּוֹל
  choice: cairá
  rationale: O qal imperfeito de נפל, em contexto de guerra, indica cair morto ou ser abatido; “cairá” conserva a imagem hebraica e permite que a expressão seguinte indique o meio.
- source_word: בֶּחָרֶב
  choice: à espada
  rationale: Expressão portuguesa estabelecida para morrer pela ação da espada, equivalente ao uso instrumental do hebraico no contexto bélico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado entre as duas orações. “Traspassado” e “cairá à espada” mantêm o caráter poético-profético sem recorrer a linguagem excessivamente arcaica.
