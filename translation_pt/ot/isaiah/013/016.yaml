base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/016.yaml
  text: Their infants will be dashed to pieces before their eyes; their houses will be plundered[a], and their wives raped.
translation:
  language: pt
  text: Seus bebês serão despedaçados diante de seus olhos; suas casas serão saqueadas e suas esposas serão estupradas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “violentadas”. O verbo hebraico é um termo cru para agressão sexual; “estupradas” evita um eufemismo no texto principal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלְלֵיהֶם
  choice: seus bebês
  rationale: עֹלֵל designa crianças muito pequenas. “Bebês” comunica de modo natural a pouca idade e a vulnerabilidade implicadas no contexto.
- source_word: יְרֻטְּשׁוּ
  choice: serão despedaçados
  rationale: A forma passiva de רטש descreve o ato brutal de esmagar ou arremessar até despedaçar, especialmente em cenas de guerra. A tradução não suaviza a violência do hebraico.
- source_word: לְעֵינֵיהֶם
  choice: diante dos seus olhos
  rationale: A expressão idiomática indica que o ato ocorrerá à vista deles; esta formulação é clara e natural em português.
- source_word: יִשַּׁסּוּ
  choice: serão saqueadas
  rationale: O verbo denota despojar ou saquear. Como “suas casas” é o sujeito, a construção passiva é a forma mais natural em português.
- source_word: בָּתֵּיהֶם
  choice: suas casas
  rationale: “Casas” é o equivalente direto de בַּיִת e se ajusta ao contexto concreto de saque em guerra.
- source_word: וּנְשֵׁיהֶם
  choice: suas esposas
  rationale: Neste plural construto com sufixo masculino plural, אִשָּׁה significa naturalmente “suas esposas”, opção mais específica que “suas mulheres”.
- source_word: תשגלנה
  choice: serão estupradas
  rationale: שגל é um termo cru para violência sexual. “Serão estupradas” expressa de maneira direta e contemporânea o sentido, sem recorrer a eufemismo.
theological_decisions:
- issue: Tradução do termo de violência sexual no contexto de um anúncio profético de juízo
  choice: suas esposas serão estupradas
  alternative: suas esposas serão violentadas
  rationale: A formulação direta preserva a brutalidade do termo hebraico e não ameniza o horror descrito no anúncio de juízo. O texto relata a atrocidade; não a aprova.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A frase conserva o paralelismo conciso do hebraico e emprega linguagem direta, sem arcaísmos nem suavização da violência.
