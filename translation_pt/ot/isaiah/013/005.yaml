  text: בָּאִ֛ים מֵ/אֶ֥רֶץ מֶרְחָ֖ק מִ/קְצֵ֣ה הַ/שָּׁמָ֑יִם יְהוָה֙ וּ/כְלֵ֣י זַעְמ֔/וֹ לְ/חַבֵּ֖ל כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/005.yaml
  text: They are coming from a distant land[c][b][a], from the end of the heavens— Yahweh and the weapons of his wrath— to destroy the whole earth.
translation:
  language: pt
  text: Eles vêm de uma terra distante, dos confins dos céus[a] — Yahweh e as armas da sua ira[b] — para destruir toda a terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da extremidade dos céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os instrumentos da sua ira”.'
    reason: lexical_alternative
  - marker: c
    text: “Toda a terra” também pode ser traduzido como “toda a região”; contudo, a linguagem cósmica do versículo favorece aqui o sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  choice: Eles vêm
  rationale: O particípio masculino plural apresenta vividamente a aproximação em curso; o pronome é suprido pelo contexto e torna a frase natural em português.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: de uma terra distante
  rationale: אֶרֶץ designa aqui uma terra ou região de origem, enquanto מֶרְחָק comunica distância ou afastamento.
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: dos confins dos céus
  rationale: קָצֶה indica extremidade, limite ou confim. A formulação idiomática mantém a grandiosidade e o alcance cósmico da expressão hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: וּכְלֵי זַעְמוֹ
  choice: e as armas da sua ira
  rationale: כְּלִי pode significar utensílio, instrumento ou arma; no contexto militar do juízo, “armas” é a opção mais específica. זַעַם denota ira intensa.
- source_word: לְחַבֵּל
  choice: para destruir
  rationale: O infinitivo indica propósito, e o verbo transmite a ideia de arruinar ou destruir.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: A expressão pode referir-se à totalidade da terra ou de uma região; a linguagem cósmica do verso favorece aqui o sentido mais amplo, sem eliminar a alternativa lexical.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico traz o nome próprio divino. A transliteração preserva essa função em vez de substituí-la por um título.
- issue: Alcance de כָּל הָאָרֶץ
  choice: toda a terra
  alternative: toda a região; toda a terra do país
  rationale: A expressão “dos confins dos céus” favorece o alcance cósmico, mas a nota mantém visível a possibilidade lexical de um território ou região.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Os travessões preservam a aposição enfática que identifica quem vem e com que meios.
