  yaml_path: translation/ot/isaiah/013/001.yaml
  text: The oracle concerning Babylon[a], which Isaiah son of Amoz saw.
translation:
  language: pt
  text: Oráculo sobre a Babilônia[a], que Isaías, filho de Amoz, viu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “O peso da Babilônia” ou “A proclamação contra a Babilônia”. O termo hebraico מַשָּׂא é um título profético para uma mensagem solene e de peso, muitas vezes de juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: sentença
  rationale: Como título profético, o termo apresenta uma mensagem solene e de peso, frequentemente associada ao juízo. “Sentença” é clara em português moderno e conserva essa força sem recorrer ao sentido literal potencialmente enganoso de “peso”.
- source_word: בָּבֶל
  choice: Babilônia
  rationale: Forma tradicional e amplamente reconhecida do nome geográfico em português.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente a oração relativa que modifica “sentença”.
- source_word: חָזָה
  choice: viu
  rationale: Preserva o verbo hebraico comum para “ver”, aqui empregado no contexto da percepção profética, sem explicitar além do texto “recebeu em visão”.
- source_word: יְשַׁעְיָהוּ
  choice: Isaías
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente natural da expressão genealógica hebraica.
- source_word: אָמֽוֹץ
  choice: Amoz
  rationale: Forma tradicional do nome pessoal em português bíblico.
theological_decisions:
- issue: Tradução do título profético מַשָּׂא
  choice: A sentença sobre a Babilônia
  alternative: O peso da Babilônia; A proclamação contra a Babilônia; O oráculo a respeito da Babilônia
  rationale: “Sentença” comunica uma declaração profética solene, frequentemente judicial, enquanto “sobre” mantém aberta a relação gramatical com Babilônia. Assim, não se restringe antecipadamente o título a “contra”, embora o conteúdo do capítulo seja de juízo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém a concisão de um título profético e preserva o verbo concreto “viu”.
