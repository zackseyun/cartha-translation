base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/018.yaml
  text: And their bows will dash young men to pieces[a]; they will show no compassion on the fruit of the womb[b]; their eyes will not spare children.
translation:
  language: pt
  text: Os seus arcos[a] despedaçarão os jovens; não terão compaixão do fruto do ventre; os seus olhos não pouparão as crianças[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os seus arcos esmagarão os jovens”. Alguns entendem “arcos” metonimicamente como “arqueiros”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos”; aqui, provavelmente no sentido mais amplo de “crianças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשָׁתוֹת
  choice: arcos
  rationale: O substantivo significa normalmente “arcos”, e o verbo no feminino plural concorda diretamente com ele. A tradução mantém os arcos como instrumentos da matança, sem excluir a possibilidade de uma referência metonímica aos arqueiros.
- source_word: נְעָרִים
  choice: jovens
  rationale: O termo pode designar meninos, rapazes ou homens jovens. “Jovens” preserva essa amplitude no contexto de violência indiscriminada.
- source_word: תְּרַטַּשְׁנָה
  choice: despedaçarão
  rationale: O Piel de רטש expressa a ação violenta de esmagar ou fazer em pedaços. “Despedaçarão” comunica essa brutalidade de maneira clara e digna.
- source_word: פְרִי בֶטֶן
  choice: fruto do ventre
  rationale: A expressão idiomática hebraica designa a descendência. A formulação portuguesa preserva a imagem concreta e seu contraste com a ausência de compaixão.
- source_word: יְרַחֵמוּ
  choice: não terão compaixão
  rationale: רחם denota compaixão ou misericórdia com forte dimensão afetiva. A expressão escolhida é natural em português atual.
- source_word: בָּנִים
  choice: crianças
  rationale: Embora o sentido formal seja “filhos”, o plural pode abranger a descendência em geral. O paralelismo com “fruto do ventre” favorece “crianças” neste contexto.
- source_word: תָחוּס עֵינָם
  choice: os seus olhos não pouparão
  rationale: A expressão hebraica emprega “olho” de modo coletivo e idiomático. O plural “olhos” soa natural em português, enquanto “não pouparão” preserva a ideia de não mostrar piedade nem preservar da morte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com construção paralela que acompanha o hebraico. O artigo em “os seus” favorece leitura natural e amplamente compreensível; a violência explícita do oráculo não foi suavizada.
