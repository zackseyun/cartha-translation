base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/022.yaml
  text: Hyenas will cry out in her palaces[a], and jackals in her luxurious halls. Her time is near to come[c][b], and her days will not be prolonged.
translation:
  language: pt
  text: Hienas[a] soltarão seus gritos nos palácios dela[b], e chacais em seus salões luxuosos. O tempo dela está próximo de chegar[c], e seus dias não se prolongarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «animais selvagens» ou «chacais» em vez de «hienas». A identificação zoológica exata do termo hebraico אִיִּים é incerta.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida por «palácios» é difícil; tomada mais literalmente, pode significar «viúvas», mas o contexto favorece uma referência a residências nobres ou edifícios abandonados.
    reason: lexical_alternative
  - marker: c
    text: Babilônia é personificada como mulher; por isso, o texto fala do «tempo dela» e de «seus dias».
    reason: cultural_note
lexical_decisions:
- source_word: וְעָנָה
  choice: soltarão seus gritos
  rationale: Embora o verbo possa significar «responder», com animais como sujeito num anúncio de desolação descreve suas vocalizações. A formulação conserva a imagem sonora sem determinar que se trate especificamente de uivos.
- source_word: אִיִּים
  choice: hienas
  rationale: A identificação zoológica exata é incerta. «Hienas» é uma opção plausível para animais necrófagos presentes em ruínas, e a incerteza é registrada em nota.
- source_word: בְּאַלְמנוֹתָיו
  choice: nos palácios dela
  rationale: A forma hebraica é difícil e, tomada literalmente, pode sugerir «viúvas». O paralelismo com os «salões luxuosos» favorece uma referência arquitetônica a residências nobres arruinadas. O feminino retoma Babilônia personificada.
- source_word: וְתַנִּים
  choice: chacais
  rationale: Em contextos proféticos de desolação, o termo provavelmente designa chacais, em vez de serpentes ou seres míticos.
- source_word: בְּהֵיכְלֵי עֹנֶג
  choice: em seus salões luxuosos
  rationale: A expressão indica grandes edifícios associados ao esplendor e ao prazer. «Salões luxuosos» comunica naturalmente o contraste entre a antiga opulência e a futura desolação.
- source_word: וְקָרוֹב לָבוֹא עִתָּהּ
  choice: Está próximo o tempo dela chegar
  rationale: A tradução mantém a construção concisa e a personificação feminina de Babilônia, sem explicitar indevidamente se «seu tempo» é o momento da destruição ou do fim.
- source_word: וְיָמֶיהָ לֹא יִמָּשֵׁכוּ
  choice: seus dias não se prolongarão
  rationale: Reproduz de modo claro e digno a ideia de que o tempo restante de Babilônia não será estendido.
theological_decisions:
- issue: Referência dos sufixos femininos em עִתָּהּ e יָמֶיהָ
  choice: dela / seus, referindo-se a Babilônia personificada
  alternative: formas neutras referentes à cidade sem destacar a personificação
  rationale: O hebraico emprega sufixos femininos, coerentes com Babilônia como cidade personificada; preservar isso mantém a imagem poética sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem poética e a personificação foram preservadas, enquanto «soltarão seus gritos» evita uma especificação zoológica excessiva. As dificuldades lexicais reais foram mantidas em nota.
