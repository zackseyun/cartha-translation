  text: הִנְ/נִ֛י מֵעִ֥יר עֲלֵי/הֶ֖ם אֶת מָדָ֑י אֲשֶׁר כֶּ֨סֶף֙ לֹ֣א יַחְשֹׁ֔בוּ וְ/זָהָ֖ב לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/017.yaml
  text: Behold[a], I am stirring up the Medes against them, who do not value silver and do not delight in gold.
translation:
  language: pt
  text: Eis que estou levantando contra eles os medos, que não dão valor à prata nem desejam ouro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não fazem caso da prata nem têm prazer no ouro”. O hebraico ressalta que os medos não são motivados por pagamento nem atraídos por riquezas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que estou
  rationale: A construção combina a partícula de apresentação com o pronome de primeira pessoa. “Eis que estou” preserva a força solene do anúncio profético e é inteligível em português atual.
- source_word: מֵעִיר
  choice: levantando
  rationale: O particípio hifil de עור indica fazer despertar ou entrar em ação. “Estou levantando” expressa a ação divina em curso ou iminente de mobilizar um povo.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: No contexto militar, על com o pronome tem sentido hostil, traduzido naturalmente por “contra eles”.
- source_word: אֶת מָדָי
  choice: os medos
  rationale: מָדַי designa aqui o povo da Média. “Os medos” é o gentílico tradicional e adequado ao contexto militar.
- source_word: כֶּסֶף לֹא יַחְשֹׁבוּ
  choice: não dão valor à prata
  rationale: חשב significa aqui considerar, estimar ou atribuir valor, não apenas pensar. A expressão comunica a indiferença deles à prata.
- source_word: וְזָהָב לֹא יַחְפְּצוּ בוֹ
  choice: nem desejam ouro
  rationale: חפץ pode significar desejar, ter prazer ou deleitar-se. “Desejam” é natural e preserva a ideia de que o ouro não os atrai; o pronome בוֹ é absorvido idiomaticamente pela construção portuguesa.
