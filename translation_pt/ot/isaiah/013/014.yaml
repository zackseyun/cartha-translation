reference: Isaiah 13:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ/צְבִ֣י מֻדָּ֔ח וּ/כְ/צֹ֖אן וְ/אֵ֣ין מְקַבֵּ֑ץ אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ אֶל אַרְצ֖/וֹ יָנֽוּסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/014.yaml
  text: And it will be like a hunted gazelle[a], and like sheep with no one to gather them; each man will turn to his own people[b], and each will flee to his own land.
translation:
  language: pt
  text: 'E será como a gazela afugentada[a] e como o rebanho que ninguém reúne: cada um se voltará para o seu povo[b], e cada um fugirá para a sua terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gazela perseguida” ou “gazela enxotada”; o particípio hebraico indica algo expulso ou posto em fuga.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cada homem”, em sentido distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E será
  rationale: No contexto do oráculo profético, a forma introduz o estado resultante futuro; a construção portuguesa é direta e preserva a ligação com o contexto anterior.
- source_word: כִּצְבִי מֻדָּח
  choice: como a gazela afugentada
  rationale: צְבִי designa a gazela, e o particípio passivo מֻדָּח indica que ela foi enxotada, expulsa ou posta em fuga. “Afugentada” conserva esse sentido sem restringir a imagem à caça.
- source_word: וּכְצֹאן וְאֵין מְקַבֵּץ
  choice: e como o rebanho que ninguém reúne
  rationale: צֹאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras. “Rebanho” mantém o valor coletivo e combina naturalmente com a falta de quem o reúna.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: cada um se voltará para o seu povo
  rationale: אִישׁ tem uso distributivo nesta construção, e o verbo פנה indica voltar-se ou dirigir-se para alguém. “Cada um” é natural em português e não perde a força distributiva.
- source_word: וְאִישׁ אֶל אַרְצוֹ יָנוּסוּ
  choice: e cada um fugirá para a sua terra
  rationale: נוּס significa fugir, enquanto אֶרֶץ, neste contexto, é a terra ou país de origem. A repetição de “cada um” reflete o paralelismo distributivo hebraico.
theological_decisions:
- issue: Uso distributivo do substantivo masculino אִישׁ
  choice: cada um
  alternative: cada homem
  rationale: Embora אִישׁ seja morfologicamente masculino, aqui funciona distributivamente para os indivíduos do grupo. “Cada um” preserva essa forma masculina em português, soa natural e evita restringir indevidamente a referência a homens adultos.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. O paralelismo foi preservado, e “rebanho” reproduz o caráter coletivo de צֹאן sem especificar apenas ovelhas.
