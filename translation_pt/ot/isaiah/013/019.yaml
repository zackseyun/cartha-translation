source:
  edition: WLC
  text: וְ/הָיְתָ֤ה בָבֶל֙ צְבִ֣י מַמְלָכ֔וֹת תִּפְאֶ֖רֶת גְּא֣וֹן כַּשְׂדִּ֑ים כְּ/מַהְפֵּכַ֣ת אֱלֹהִ֔ים אֶת סְדֹ֖ם וְ/אֶת עֲמֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/019.yaml
  text: And Babylon[a], the beauty of kingdoms, the glory of the Chaldeans’ pride, will be like God’s overthrow of Sodom and Gomorrah.
translation:
  language: pt
  text: E Babilônia[a], a beleza dos reinos, o esplendor do orgulho dos caldeus, será como Sodoma e Gomorra quando Deus as destruiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o esplendor da majestade dos caldeus”. A expressão hebraica também pode descrever de modo mais neutro a magnificência de Babilônia, em vez de seu orgulho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: será
  rationale: O perfeito com conjunção, em discurso profético, tem aqui referência futura; “será” expressa naturalmente o estado de Babilônia após o juízo.
- source_word: בָבֶל
  choice: Babilônia
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: צְבִי מַמְלָכוֹת
  choice: a joia dos reinos
  rationale: צְבִי denota beleza, ornamento ou esplendor. “Joia dos reinos” comunica com naturalidade a excelência superlativa da expressão construta e evita repetir “esplendor”.
- source_word: תִּפְאֶרֶת
  choice: o esplendor
  rationale: O substantivo denota beleza, glória ou esplendor; “esplendor” mantém o registro poético e distingue o termo de צְבִי.
- source_word: גְּאוֹן
  choice: orgulho
  rationale: Pode significar majestade ou orgulho. No contexto de um oráculo de juízo, “orgulho” preserva a provável conotação negativa sem eliminar a alternativa mais neutra, registrada em nota.
- source_word: כַּשְׂדִּים
  choice: dos caldeus
  rationale: Preserva o gentílico histórico do hebraico, em vez de generalizá-lo como “babilônios”.
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: como quando Deus destruiu
  rationale: A formulação portuguesa explicita com naturalidade a comparação e a agência divina. “Destruiu” transmite o sentido de subversão ou destruição catastrófica de מַהְפֵּכָה.
- source_word: אֶת סְדֹם וְאֶת עֲמֹרָה
  choice: Sodoma e Gomorra
  rationale: Formas portuguesas tradicionais dos nomes; os marcadores de objeto direto não precisam de representação separada.
theological_decisions:
- issue: Sentido de גְּאוֹן no oráculo de juízo
  choice: orgulho
  alternative: majestade
  rationale: Em Isaías e em contextos de juízo, o termo frequentemente sugere exaltação humana censurável. A nota mantém visível a leitura neutra possível, sem resolver indevidamente a ambiguidade lexical.
- issue: Agência divina na queda comparada à de Sodoma e Gomorra
  choice: “quando Deus destruiu”
  alternative: “a destruição causada por Deus”
  rationale: A construção preserva Deus como agente explícito da catástrofe, conforme o hebraico, sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Joia dos reinos” conserva a força poética e superlativa; “como quando Deus destruiu” evita uma construção nominal pesada, mantendo a comparação e a agência do texto hebraico.
