  naturalness: O português do rascunho é claro e de registro adequado. “A beleza dos reinos” é igualmente natural, mais direto e mais próximo do paralelismo poético hebraico. “Como na destruição que Deus fez de Sodoma e Gomorra” é compreensível, embora “a destruição de Sodoma e Gomorra causada por Deus” seja mais pesado; por isso, conserva-se uma formulação verbal subordinada apenas para tornar explícita a relação comparativa sem introduzir um sentido temporal independente.
  terminology: '“Babilônia”, “caldeus”, “orgulho”, “Sodoma” e “Gomorra” são adequados. A nota deve refletir precisamente a alternativa para גְּאוֹן: “majestade” em vez de “orgulho”; “glória da majestade” acrescenta uma duplicação interpretativa desnecessária.'
