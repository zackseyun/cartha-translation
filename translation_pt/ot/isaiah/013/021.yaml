  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/רָבְצוּ שָׁ֣ם צִיִּ֔ים וּ/מָלְא֥וּ בָתֵּי/הֶ֖ם אֹחִ֑ים וְ/שָׁ֤כְנוּ שָׁם֙ בְּנ֣וֹת יַֽעֲנָ֔ה וּ/שְׂעִירִ֖ים יְרַקְּדוּ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/021.yaml
  text: But desert creatures will lie down there[a], and their houses will be full of owls; ostriches will dwell there[b], and wild goats will dance there.
translation:
  language: pt
  text: Animais do deserto se deitarão ali, e suas casas ficarão cheias de corujas[a]; avestruzes habitarão ali, e bodes selvagens[b] dançarão naquele lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «criaturas uivantes» ou «chacais»; o sentido do termo hebraico אֹחִים é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou «demônios em forma de bode» ou «sátiros»; o hebraico שְׂעִירִים pode designar bodes peludos e, em alguns contextos, ter associações míticas ou demoníacas.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: se deitarão
  rationale: O verbo רבץ descreve com frequência animais que se deitam ou se acomodam num lugar; a escolha preserva a imagem concreta da ocupação das ruínas.
- source_word: צִיִּים
  choice: animais do deserto
  rationale: O termo designa de modo geral seres ou animais próprios de regiões áridas, sem permitir identificação segura de uma espécie.
- source_word: וּמָלְאוּ בָתֵּיהֶם
  choice: suas casas ficarão cheias de
  rationale: Mantém o possessivo do hebraico e expressa de modo natural o estado futuro das casas abandonadas.
- source_word: אֹחִים
  choice: corujas
  rationale: A identificação zoológica é incerta. A tradução tradicional «corujas» combina com casas em ruínas, mas outras possibilidades são registradas em nota.
- source_word: וְשָׁכְנוּ
  choice: habitarão
  rationale: שׁכן indica morar, instalar-se ou permanecer num lugar; «habitarão» conserva o tom profético e solene sem ser obscuro.
- source_word: בְּנוֹת יַעֲנָה
  choice: avestruzes
  rationale: A expressão hebraica, literalmente «filhas do avestruz», funciona como designação zoológica idiomática e é traduzida naturalmente pelo nome da ave.
- source_word: וּשְׂעִירִים
  choice: bodes selvagens
  rationale: O sentido básico é «peludos» ou «bodes». A escolha evita afirmar mais do que o contexto exige, enquanto a possível conotação mítica ou demoníaca é preservada em nota.
- source_word: יְרַקְּדוּ
  choice: dançarão
  rationale: רקד pode indicar dançar, saltitar ou pular. «Dançarão» preserva a imagem poética, vívida e inquietante.
- source_word: שָׁם
  choice: ali / naquele lugar
  rationale: A variação evita repetição pesada em português, preservando nas duas ocorrências a referência enfática ao mesmo local desolado.
theological_decisions:
- issue: Se שְׂעִירִים designa animais literais ou seres demoníacos
  choice: bodes selvagens no texto principal
  alternative: demônios em forma de bode; sátiros
  rationale: O termo tem como sentido básico «bodes» ou «seres peludos», embora em certos contextos possa apresentar associações míticas ou demoníacas. O texto principal conserva o sentido zoológico mais cauteloso, e a nota mantém aberta a alternativa sem impor uma interpretação demonológica.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e vocabulário amplamente compreensível. Os marcadores foram colocados imediatamente após os termos a que suas notas se referem; em especial, [b] acompanha «bodes selvagens», correspondente a שְׂעִירִים.
