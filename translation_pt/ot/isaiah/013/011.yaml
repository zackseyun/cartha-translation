  text: וּ/פָקַדְתִּ֤י עַל תֵּבֵל֙ רָעָ֔ה וְ/עַל רְשָׁעִ֖ים עֲוֺנָ֑/ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן זֵדִ֔ים וְ/גַאֲוַ֥ת עָרִיצִ֖ים אַשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/011.yaml
  text: And I will punish the world for its evil[a], and the wicked for their iniquity; I will put an end to the pride of the arrogant[b], and I will humble the haughtiness of the ruthless.
translation:
  language: pt
  text: 'Castigarei o mundo[a] por sua maldade

    e os perversos por sua iniquidade;

    porei fim ao orgulho dos arrogantes

    e abaterei a altivez dos violentos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mundo habitado”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “rebaixarei a arrogância dos violentos”. O hebraico emprega, nas linhas paralelas, duas expressões de sentido próximo para a exaltação arrogante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Castigarei
  rationale: Com עַל e tendo como alvos a maldade e os perversos, פקד expressa aqui visitação punitiva ou acerto de contas. “Castigarei” comunica de modo claro e digno essa força judicial.
- source_word: תֵּבֵל
  choice: o mundo
  rationale: תבל designa com frequência o mundo como terra habitada. “O mundo” é natural em português e mantém o alcance amplo do oráculo; a nuance de mundo habitado é registrada em nota.
- source_word: רָעָה
  choice: sua maldade
  rationale: O paralelismo com “os perversos” e “sua iniquidade” indica mal moral, não calamidade. O possessivo explicita naturalmente em português sua relação com “o mundo”.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: Tradução substantivada, concisa e corrente, que conserva a referência coletiva a pessoas caracterizadas pela perversidade.
- source_word: עֲוֺנָם
  choice: sua iniquidade
  rationale: עוון pode indicar iniquidade, culpa ou punição, mas aqui nomeia a falta moral pela qual os perversos são castigados. “Iniquidade” preserva seu peso ético.
- source_word: וְהִשְׁבַּתִּי
  choice: porei fim
  rationale: O hifil de שבת significa fazer cessar. “Porei fim” preserva o valor causativo em português natural.
- source_word: גְּאוֹן
  choice: o orgulho
  rationale: Embora o termo possa indicar majestade ou exaltação em outros contextos, sua associação com זדים lhe confere aqui sentido negativo de orgulho arrogante.
- source_word: זֵדִים
  choice: os arrogantes
  rationale: O termo descreve pessoas insolentes, presunçosas ou arrogantes. “Os arrogantes” conserva a caracterização moral sem acrescentar uma função social específica.
- source_word: וְגַאֲוַת
  choice: a altivez
  rationale: “Altivez” diferencia este quase sinônimo do גאון anterior e mantém o campo semântico de elevação orgulhosa.
- source_word: עָרִיצִים
  choice: os opressores
  rationale: עריצים designa pessoas violentas, cruéis ou tirânicas. “Opressores” comunica sua força moral e social sem restringir o termo a governantes formais.
- source_word: אַשְׁפִּיל
  choice: abaterei
  rationale: O hifil de שפל significa fazer baixar ou rebaixar. Com “altivez” como objeto, “abaterei” é idiomático e preserva a imagem de reversão e rebaixamento.
theological_decisions:
- issue: Alcance do juízo divino em תֵּבֵל
  choice: O texto fala do juízo de Deus sobre o mundo em sua ordem humana habitada, sem restringi-lo apenas à Babilônia.
  alternative: Entender o termo como “a terra” ou considerar a Babilônia, sozinha, como uma sinédoque do mundo.
  rationale: Embora Isaías 13 seja dirigido contra a Babilônia, תבל e a linguagem moral universal deste versículo ampliam o horizonte. A tradução mantém essa tensão contextual sem reduzir interpretativamente o alcance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido em quatro linhas; “orgulho/altivez” e “arrogantes/opressores” preservam a variação lexical do hebraico sem eliminar sua proximidade semântica.
