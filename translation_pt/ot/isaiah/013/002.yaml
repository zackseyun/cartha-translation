  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַ֤ל הַר נִשְׁפֶּה֙ שְֽׂאוּ נֵ֔ס הָרִ֥ימוּ ק֖וֹל לָ/הֶ֑ם הָנִ֣יפוּ יָ֔ד וְ/יָבֹ֖אוּ פִּתְחֵ֥י נְדִיבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/002.yaml
  text: On a bare mountain raise a signal[a]; lift up the voice to them; wave the hand[c][b], that they may enter the gates of the nobles.
translation:
  language: pt
  text: Sobre um monte sem vegetação, levantem um sinal[a]; levantem a voz para eles; acenem com a mão[b], para que entrem pelos portões dos nobres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estandarte”. O termo hebraico costuma designar um sinal militar elevado para reunir ou orientar tropas.
    reason: lexical_alternative
  - marker: b
    text: Ou “façam sinal com a mão”. O gesto provavelmente serve para convocar a força atacante.
    reason: lexical_alternative
  - marker: c
    text: Ou “dos príncipes”. O termo hebraico pode designar nobres, príncipes ou outros líderes de destaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁפֶּה
  choice: sem vegetação
  rationale: Expressa de modo natural a imagem de um monte despojado de árvores ou cobertura, isto é, um lugar exposto e visível para erguer o sinal.
- source_word: נֵס
  choice: sinal
  rationale: No contexto militar e profético, designa um objeto elevado para convocar ou orientar tropas. “Sinal” comunica claramente sua função; “estandarte” permanece como alternativa em nota.
- source_word: הָרִימוּ קוֹל
  choice: levantem a voz
  rationale: Preserva a expressão concreta do hebraico e continua natural em português, sem reduzir necessariamente a ação a um grito.
- source_word: לָהֶם
  choice: para eles
  rationale: A preposição indica naturalmente a direção da voz, mantendo sem acréscimo interpretativo a referência aos convocados.
- source_word: הָנִיפוּ יָד
  choice: acenem com a mão
  rationale: Reproduz o gesto visível de mover a mão; o possível sentido funcional de chamar ou fazer sinal é registrado na nota.
- source_word: וְיָבֹאוּ
  choice: para que entrem
  rationale: Após a série de ordens, a forma verbal pode exprimir finalidade ou resultado. “Entrem” é idiomático diante de “portões”.
- source_word: פִּתְחֵי
  choice: portões
  rationale: Embora o termo possa significar entradas ou aberturas, “portões” é natural no provável contexto de acesso a uma cidade ou fortaleza.
- source_word: נְדִיבִים
  choice: nobres
  rationale: Aqui denota pessoas de posição elevada ou dirigentes. “Nobres” preserva maior amplitude que a alternativa mais específica “príncipes”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “levantem” conserva o paralelismo hebraico; “sem vegetação” evita o possível sentido geológico de “monte nu” e torna explícita a imagem de uma altura despojada.
