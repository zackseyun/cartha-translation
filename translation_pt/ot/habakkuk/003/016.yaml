  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁמַ֣עְתִּי וַ/תִּרְגַּ֣ז בִּטְנִ֗/י לְ/קוֹל֙ צָלֲל֣וּ שְׂפָתַ֔/י יָב֥וֹא רָקָ֛ב בַּ/עֲצָמַ֖/י וְ/תַחְתַּ֣/י אֶרְגָּ֑ז אֲשֶׁ֤ר אָנ֨וּחַ֙ לְ/י֣וֹם צָרָ֔ה לַ/עֲל֖וֹת לְ/עַ֥ם יְגוּדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/016.yaml
  text: I heard[a], and my inward parts trembled; at the sound my lips quivered. Rot enters into my bones, and beneath me I tremble, as I wait quietly for the day of distress[b], for the coming up of the people who will invade us.
translation:
  language: pt
  text: Ouvi, e minhas entranhas estremeceram; ao som, meus lábios tremeram. A podridão entra nos meus ossos, e tremo onde estou, enquanto espero em silêncio[a] o dia da aflição, que virá sobre o povo que nos ataca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto descanso” ou “para que eu descanse”. O verbo hebraico pode significar descansar, aquietar-se ou permanecer quieto; o contexto favorece aqui a ideia de espera silenciosa diante da aflição que virá.
    reason: alternative_reading
  - marker: b
    text: A cláusula hebraica também pode ser entendida como “quando subir contra nós o povo que nos invadirá”. O verbo descreve ataque ou incursão, e a construção poética é compacta.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito na primeira pessoa introduz a reação do profeta ao que ouviu; o pretérito perfeito é direto e natural em português.
- source_word: וַתִּרְגַּז בִּטְנִי
  choice: minhas entranhas estremeceram
  rationale: בטן designa literalmente o ventre, mas aqui exprime o centro visceral do ser; “entranhas” conserva a imagem corporal sem reduzi-la a uma reação meramente emocional.
- source_word: לְקוֹל
  choice: ao som
  rationale: קול pode ser “voz” ou “som”; a opção mais abrangente preserva a referência auditiva sem especificar indevidamente sua origem.
- source_word: צָלֲלוּ שְׂפָתַי
  choice: meus lábios tremeram
  rationale: A expressão descreve uma reação física de tremor; “tremeram” é atual, clara e mantém o paralelismo corporal.
- source_word: יָבוֹא רָקָב בַּעֲצָמַי
  choice: A podridão entra nos meus ossos
  rationale: רקב é podridão ou decomposição. O presente conserva a vivacidade poética da forma hebraica e a forte imagem de colapso físico.
- source_word: וְתַחְתַּי אֶרְגָּז
  choice: e tremo onde estou
  rationale: תחתַי significa literalmente “debaixo de mim”; a formulação comunica a instabilidade do profeta no lugar em que está sem acrescentar explicitamente pernas ou joelhos.
- source_word: אֲשֶׁר אָנֻוּחַ
  choice: enquanto espero em silêncio
  rationale: נוח pode significar descansar, aquietar-se ou permanecer em repouso. No contexto de temor diante do juízo vindouro, “espero em silêncio” expressa expectativa quieta sem transformar a frase em promessa inequívoca de alívio.
- source_word: לְיוֹם צָרָה
  choice: o dia da aflição
  rationale: צרה denota aflição, angústia ou dificuldade; “aflição” preserva a gravidade e funciona naturalmente na linguagem poética bíblica.
- source_word: לַעֲלוֹת לְעַם יְגוּדֶנּוּ
  choice: quando ele vier sobre o povo que nos ataca
  rationale: A construção mais naturalmente permite que o dia de aflição venha sobre o povo invasor. A referência pronominal de “ele” retoma “o dia da aflição”; a nota registra a leitura alternativa segundo a qual o povo é o que avança contra nós.
theological_decisions:
- issue: Sentido de אֲשֶׁר אָנֻוּחַ diante do dia da aflição
  choice: O profeta espera em silêncio o dia da aflição.
  alternative: O profeta descansará no dia da aflição.
  rationale: A escolha mantém juntas sua reação de terror e sua espera confiante, sem converter o verbo em uma promessa mais definida de descanso ou livramento.
- issue: Direção do ataque na cláusula final
  choice: O dia da aflição vem sobre o povo que ataca o profeta e os seus.
  alternative: O povo invasor sobe ou avança contra nós.
  rationale: A sintaxe לַעֲלוֹת לְעַם favorece a ideia de algo vir sobre o povo, mas a construção é compacta e admite outra relação entre o infinitivo e “povo”; por isso, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens corporais fortes do hebraico e a tensão entre medo visceral e espera silenciosa. Evitaram-se arcaísmos como “meu ventre se comoveu” e explicitações doutrinárias do resultado do juízo.
