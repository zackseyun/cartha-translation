  text: תַּ֣חַת אָ֔וֶן רָאִ֖יתִי אָהֳלֵ֣י כוּשָׁ֑ן יִרְגְּז֕וּ/ן יְרִיע֖וֹת אֶ֥רֶץ מִדְיָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/007.yaml
  text: I saw the tents of Cushan under affliction; the tent curtains of the land of Midian were trembling.
translation:
  language: pt
  text: Vi as tendas de Cusã em aflição; tremiam as cortinas da terra de Midiã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת אָוֶן
  choice: em aflição
  rationale: A expressão descreve as tendas sob aflição ou calamidade. Em português, “em aflição” preserva essa condição sem impor uma causa específica.
- source_word: אָהֳלֵי כוּשָׁן
  choice: as tendas de Cusã
  rationale: Mantém o topônimo Cusã e o sentido concreto de tendas.
- source_word: יְרִיעוֹת
  choice: as cortinas
  rationale: Refere-se às peças de tecido que formavam ou cobriam as tendas; “cortinas” conserva a imagem poética e a ligação paralela com “tendas”.
- source_word: יִרְגְּזוּן
  choice: tremiam
  rationale: O verbo expressa tremor ou agitação, provavelmente personificando as cortinas diante da manifestação divina.
theological_decisions:
- issue: Natureza da aflição de Cusã
  choice: em aflição
  alternative: sob iniquidade
  rationale: אָוֶן pode denotar maldade, sofrimento ou calamidade. No paralelismo com o tremor de Midiã e no contexto da teofania, “aflição” comunica a calamidade sem transformar a frase em juízo moral explícito.
- issue: Relação sintática de תַּחַת אָוֶן
  choice: ligada à condição das tendas
  alternative: 'ligada ao ato de ver: “Em meio à aflição, vi...”'
  rationale: A ordem hebraica admite alguma tensão sintática. A tradução segue a leitura em que as tendas são vistas em estado de aflição, coerente com o paralelo das cortinas que tremem.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético conciso. “Cusã” e “Midiã” seguem formas bíblicas correntes em português; a inversão mais rígida do hebraico foi evitada para assegurar leitura natural.
