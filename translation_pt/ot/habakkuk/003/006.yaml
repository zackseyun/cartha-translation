  text: עָמַ֣ד וַ/יְמֹ֣דֶד אֶ֗רֶץ רָאָה֙ וַ/יַּתֵּ֣ר גּוֹיִ֔ם וַ/יִּתְפֹּֽצְצוּ֙ הַרְרֵי עַ֔ד שַׁח֖וּ גִּבְע֣וֹת עוֹלָ֑ם הֲלִיכ֥וֹת עוֹלָ֖ם לֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/006.yaml
  text: He stood and measured the earth[a]; he looked and made nations tremble. The ancient mountains were shattered; the everlasting hills sank low[b]. His ways are everlasting.
translation:
  language: pt
  text: Ele se pôs de pé e mediu a terra; olhou e fez as nações tremerem.[a] Os montes antigos se despedaçaram; as colinas eternas se curvaram. Seus caminhos são eternos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e sobressaltou as nações”; possivelmente, “e dispersou as nações”. O verbo hebraico é difícil, e seu sentido exato é discutido.
    reason: lexical_alternative
  - marker: b
    text: Ou “Suas marchas são eternas” ou “Suas veredas são eternas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמַד
  choice: Ele parou
  rationale: O verbo significa basicamente “estar de pé” ou “parar”. No contexto da manifestação divina, “parou” expressa de modo natural a tomada de posição sem acrescentar uma interpretação ausente do hebraico.
- source_word: וַיְמֹדֶד אֶרֶץ
  choice: e mediu a terra
  rationale: A leitura consonantal e o sentido comum de מדד favorecem “medir”. Traduções como “fez a terra tremer” são contextualmente possíveis, mas menos diretas.
- source_word: רָאָה
  choice: olhou
  rationale: “Olhou” preserva a sequência vívida das ações divinas e é natural em português.
- source_word: וַיַּתֵּר גּוֹיִם
  choice: e fez as nações tremerem
  rationale: O verbo é lexicalmente difícil. No contexto da teofania, indica que as nações são lançadas em agitação ou terror; a nota preserva outras possibilidades.
- source_word: וַיִּתְפֹּצְצוּ
  choice: se despedaçaram
  rationale: A forma verbal comunica ruptura violenta. “Se despedaçaram” mantém a força e a forma reflexiva da imagem poética.
- source_word: הַרְרֵי עַד
  choice: os montes antigos
  rationale: עַד indica aqui antiguidade duradoura. “Antigos” é claro e evita uma repetição rígida de “eternos” no paralelismo.
- source_word: שַׁחוּ
  choice: se curvaram
  rationale: O verbo pode descrever abaixar-se, curvar-se ou afundar. “Se curvaram” preserva tanto a imagem física quanto a possível personificação diante de Deus.
- source_word: גִּבְעוֹת עוֹלָם
  choice: as colinas eternas
  rationale: עוֹלָם ressalta a permanência ancestral atribuída às colinas; “eternas” conserva deliberadamente o contraste entre sua aparente permanência e sua submissão.
- source_word: הֲלִיכוֹת עוֹלָם לוֹ
  choice: Seus caminhos são eternos
  rationale: הֲלִיכוֹת pode significar “andanças”, “marchas” ou “caminhos”. “Caminhos” é digno e compreensível, enquanto a nota registra a leitura mais concreta ligada ao movimento teofânico.
theological_decisions:
- issue: Linguagem antropomórfica e de teofania cósmica
  choice: Manter a descrição poética de Deus aparecendo e agindo sobre a terra, as nações e os acidentes geográficos.
  alternative: Reduzir todas as ações a metáforas político-nacionais ou convertê-las em uma descrição cosmológica estritamente literal.
  rationale: Habacuque 3 emprega poesia teofânica elevada. A tradução conserva a tensão entre ação histórica e cósmica sem impor uma sistematização doutrinária.
- issue: Sentido de הֲלִיכוֹת עוֹלָם לוֹ
  choice: Seus caminhos são eternos
  alternative: Suas marchas vêm desde os tempos antigos
  rationale: A expressão admite tanto uma afirmação geral sobre os caminhos permanentes de Deus quanto uma referência mais concreta às suas marchas antigas. A tradução principal mantém a formulação ampla, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. “Montes” e “colinas” mantêm a distinção entre הַרְרֵי e גִּבְעוֹת. As ambiguidades lexicais relevantes são apresentadas em notas, sem resolver indevidamente a tensão do texto.
