source:
  edition: WLC
  text: הֲ/בִ/נְהָרִים֙ חָרָ֣ה יְהוָ֔ה אִ֤ם בַּ/נְּהָרִים֙ אַפֶּ֔/ךָ אִם בַּ/יָּ֖ם עֶבְרָתֶ֑/ךָ כִּ֤י תִרְכַּב֙ עַל סוּסֶ֔י/ךָ מַרְכְּבֹתֶ֖י/ךָ יְשׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/008.yaml
  text: Was your anger against the rivers[a], Yahweh? Was your wrath against the rivers, or your fury against the sea, that you rode on your horses, on your chariots of salvation?
translation:
  language: pt
  text: Foi contra os rios que se acendeu a tua ira, Yahweh? Foi contra os rios o teu furor? Foi contra o mar a tua indignação? Pois cavalgaste sobre os teus cavalos, sobre os teus carros de salvação[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sobre os teus carros vitoriosos». O hebraico também pode expressar aqui livramento ou vitória.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/בִ/נְהָרִים חָרָה
  choice: Foi contra os rios que se acendeu a tua ira
  rationale: Preserva a pergunta retórica, o objeto introduzido por בְּ e a imagem verbal de חרה como ira que se acende, em português natural e poético.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּנְּהָרִים אַפֶּךָ
  choice: contra os rios o teu furor
  rationale: אַף designa idiomaticamente a ira; «furor» mantém a intensidade e a estrutura paralela sem recorrer ao sentido literal «nariz».
- source_word: בַּיָּם עֶבְרָתֶךָ
  choice: contra o mar a tua indignação
  rationale: עֶבְרָה indica ira intensa; «indignação» distingue o termo dos vocábulos paralelos e conserva o tom elevado.
- source_word: כִּי תִרְכַּב עַל סוּסֶיךָ
  choice: quando cavalgaste sobre os teus cavalos
  rationale: כִּי pode introduzir aqui a circunstância ou explicação da manifestação divina. «Quando» liga naturalmente a cavalgada às perguntas sem afirmar que rios e mar fossem de fato os alvos da ira.
- source_word: מַרְכְּבֹתֶיךָ יְשׁוּעָה
  choice: os teus carros de salvação
  rationale: Mantém a justaposição nominal e o sentido amplo de יְשׁוּעָה como salvação ou livramento, sem reduzi-lo apenas à vitória militar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; «Yahweh» procura representá-lo diretamente, sem substituição por um título.
- issue: Sentido de יְשׁוּעָה na teofania guerreira
  choice: salvação
  alternative: vitória; livramento
  rationale: «Salvação» preserva a amplitude da ação divina de resgatar, embora o contexto também permita a nuance de vitória.
- issue: Relação de כִּי com as perguntas anteriores
  choice: quando
  alternative: pois; porque
  rationale: A partícula pode ser circunstancial ou explicativa. «Quando» preserva a cena poética da cavalgada divina e evita sugerir que ela prove uma ira dirigida literalmente às águas.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural no Brasil e compreensão internacional. A repetição retórica de «contra os rios» e o paralelismo entre rios, mar, cavalos e carros foram preservados.
