base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/011.yaml
  text: Sun and moon stood in their lofty place[a]; at the light of your arrows they went[c][b], at the brightness of the flash of your spear.
translation:
  language: pt
  text: O sol e a lua pararam em sua elevada morada[a]; à luz das tuas flechas, avançaram[b], ao fulgor lampejante da tua lança[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em sua morada”. O termo hebraico se refere a uma morada elevada ou a um lugar sublime.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico é condensado: “avançaram” pode referir-se ao sol e à lua ou, mais provavelmente, ao movimento das flechas e da lança de Deus.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “ao relâmpago da tua lança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ יָרֵחַ
  choice: O sol e a lua
  rationale: Mantém os dois luminares distintos e soa natural em português moderno, com os artigos normalmente exigidos pelo idioma.
- source_word: עָמַד
  choice: pararam
  rationale: O Qal de עמד pode significar ficar de pé ou permanecer parado; no contexto da teofania, «pararam» expressa claramente a cessação do movimento sem explicar seu mecanismo.
- source_word: זְבֻלָה
  choice: em sua elevada morada
  rationale: זְבוּל designa uma morada elevada ou lugar sublime. O singular «sua» acompanha a forma hebraica e pode referir-se à morada conjunta dos luminares, preservando a imagem sem impor uma cosmologia técnica.
- source_word: לְאוֹר חִצֶּיךָ
  choice: à luz das tuas flechas
  rationale: Reproduz a construção poética e conserva literalmente a imagem bélica central.
- source_word: יְהַלֵּכוּ
  choice: avançaram
  rationale: Expressa movimento de modo digno e poético, sem inserir no texto um sujeito explícito que o hebraico comprimido não identifica inequivocamente.
- source_word: לְנֹגַהּ
  choice: ao clarão
  rationale: נֹגַהּ indica brilho ou esplendor; «clarão» se harmoniza com a imagem luminosa e com o paralelismo.
- source_word: בְּרַק חֲנִיתֶךָ
  choice: do relâmpago da tua lança
  rationale: בָּרָק pode significar relâmpago ou brilho fulgurante. A formulação preserva a metáfora ousada e a possibilidade de a lança ser concebida como relampejante.
theological_decisions:
- issue: Referente do verbo יְהַלֵּכוּ («avançaram»)
  choice: O sujeito permanece implícito, como no hebraico, podendo ser entendido no fluxo poético como as flechas e a lança de Deus.
  alternative: Entender que o sol e a lua avançaram à luz das armas divinas.
  rationale: A sintaxe poética é comprimida e admite mais de uma vinculação. Não acrescentar um sujeito explícito preserva a ambiguidade genuína e evita resolver indevidamente a imagem teofânica.
translation_notes:
  register: Português moderno, digno e poético, com legibilidade brasileira e vocabulário amplamente internacional. Mantém o paralelismo luminoso e bélico, bem como a compressão sintática do hebraico.
