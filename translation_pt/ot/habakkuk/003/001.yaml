base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/001.yaml
  text: A prayer of Habakkuk the prophet[a], according to Shigionoth.
translation:
  language: pt
  text: Uma oração do profeta Habacuque, segundo sigionotes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sigionotes” é provavelmente um termo musical ou litúrgico; talvez indique um estilo, uma melodia ou um cântico intenso. O sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Uma oração
  rationale: O substantivo designa uma oração, possivelmente em forma de cântico. O artigo indefinido produz em português uma abertura natural para a rubrica.
- source_word: לַחֲבַקּוּק
  choice: do profeta Habacuque
  rationale: O לְ nas rubricas pode indicar autoria ou associação. A formulação portuguesa associa naturalmente a oração a Habacuque, sem excluir nuances de pertencimento.
- source_word: הַנָּבִיא
  choice: profeta
  rationale: Preserva o título definido e a identificação da função de Habacuque, integrando-os numa expressão idiomática em português.
- source_word: עַל
  choice: segundo
  rationale: Em rubricas musicais ou litúrgicas, עַל pode indicar estilo, melodia ou orientação de execução. “Segundo” mantém essa relação sem defini-la com precisão excessiva.
- source_word: שִׁגְיֹנוֹת
  choice: sigionotes
  rationale: O termo raro e plural é de sentido incerto, provavelmente musical ou litúrgico. A transliteração adaptada à ortografia portuguesa preserva a incerteza e o plural do hebraico.
theological_decisions: []
translation_notes:
  register: Rubrica breve, digna e clara, em português moderno de ampla compreensão. A transliteração evita atribuir ao termo técnico raro um significado mais específico do que as evidências permitem.
