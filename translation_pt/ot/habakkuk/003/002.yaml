source:
  edition: WLC
  text: יְהוָ֗ה שָׁמַ֣עְתִּי שִׁמְעֲ/ךָ֮ יָרֵאתִי֒ יְהוָ֗ה פָּֽעָלְ/ךָ֙ בְּ/קֶ֤רֶב שָׁנִים֙ חַיֵּ֔י/הוּ בְּ/קֶ֥רֶב שָׁנִ֖ים תּוֹדִ֑יעַ בְּ/רֹ֖גֶז רַחֵ֥ם תִּזְכּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/002.yaml
  text: Yahweh[a], I have heard the report of you; I stand in awe. Yahweh, revive your work in the midst of the years; in the midst of the years make it known[e][d][c][b]; in wrath remember mercy.
translation:
  language: pt
  text: SENHOR, ouvi o que se diz a teu respeito[a] e fiquei tomado de temor[b]. SENHOR, faze reviver a tua obra no meio dos anos[c]; no meio dos anos, torna-a conhecida. Na ira[d], lembra-te de ter compaixão[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouvi falar de ti”, “ouvi a tua fama” ou “ouvi o relato a teu respeito”. A expressão hebraica se refere ao que foi ouvido acerca do SENHOR.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fiquei com medo”. O hebraico pode expressar medo ou temor reverente.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “mantém-na viva” ou “renova-a”. O hebraico diz literalmente: “faze-a viver”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “na agitação” ou “no furor”.'
    reason: lexical_alternative
  - marker: e
    text: 'Hebraico: “lembra-te da compaixão” ou “lembra-te de ter misericórdia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: SENHOR
  rationale: Emprega a convenção portuguesa consagrada para representar o nome divino YHWH, com versaletes indicados aqui por maiúsculas.
- source_word: שָׁמַעְתִּי שִׁמְעֲךָ
  choice: ouvi o que se diz a teu respeito
  rationale: Expressa naturalmente o relato ou notícia ouvida acerca do SENHOR, sem limitar o sentido apenas à reputação.
- source_word: יָרֵאתִי
  choice: fiquei tomado de temor
  rationale: Mantém a amplitude entre medo e reverência solene, sem reduzir a reação do profeta a mero pânico nem resolvê-la somente como admiração.
- source_word: פָּעָלְךָ
  choice: a tua obra
  rationale: Preserva a referência ampla à ação ou aos feitos de Deus, sem especificar quais atos históricos estão em vista.
- source_word: בְּקֶרֶב שָׁנִים
  choice: no meio dos anos
  rationale: Conserva de modo inteligível a imagem temporal e a repetição poética do hebraico, evitando a interpretação mais específica 'em nosso tempo'.
- source_word: חַיֵּהוּ
  choice: faze reviver
  rationale: Traduz diretamente o imperativo causativo, literalmente 'faz viver', e mantém a imagem de dar nova vida ou renovar a obra divina.
- source_word: תּוֹדִיעַ
  choice: torna-a conhecida
  rationale: Reproduz o sentido causativo de 'fazer conhecer'; o pronome retoma naturalmente 'a tua obra'.
- source_word: בְּרֹגֶז
  choice: na ira
  rationale: No contexto do pedido por compaixão, 'ira' representa bem o provável sentido, embora o substantivo também possa indicar agitação ou furor.
- source_word: רַחֵם תִּזְכּוֹר
  choice: lembra-te de ter compaixão
  rationale: Preserva o valor verbal de 'ter compaixão' e sua ligação com 'lembrar', em formulação natural de oração em português.
theological_decisions:
- issue: Natureza da reação do profeta ao ouvir acerca do SENHOR
  choice: temor que preserva tanto o medo quanto a reverência
  alternative: admiração reverente sem conotação de medo; ou terror explícito
  rationale: O verbo ירא comporta medo, temor e reverência. 'Tomado de temor' mantém essa tensão no contexto de oração e súplica.
- issue: Sentido do pedido relativo à obra de Deus
  choice: pedido para que Deus faça sua própria obra reviver ou se renovar
  alternative: pedido para que Deus apenas preserve sua obra viva
  rationale: O sufixo remete à obra do próprio SENHOR, enquanto o imperativo חַיֵּהוּ conserva a imagem aberta de fazê-la viver, sem definir quais feitos divinos devem ser renovados.
- issue: Relação entre ira e compaixão
  choice: súplica para que, em meio à ira, Deus se lembre de agir com compaixão
  alternative: referência a tumulto ou agitação, sem especificar ira divina
  rationale: A tradução segue o sentido contextual provável de רֹגֶז, mas a nota registra sua amplitude lexical e evita eliminar a tensão entre juízo e misericórdia.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantêm-se a repetição poética de “no meio dos anos”, a metáfora de dar vida à obra divina e a tensão entre temor, ira e compaixão. O tratamento de segunda pessoa do singular acompanha o registro tradicional de oração sem recorrer a linguagem excessivamente arcaica.
