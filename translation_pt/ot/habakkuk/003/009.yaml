source:
  edition: WLC
  text: עֶרְיָ֤ה תֵעוֹר֙ קַשְׁתֶּ֔/ךָ שְׁבֻע֥וֹת מַטּ֖וֹת אֹ֣מֶר סֶ֑לָה נְהָר֖וֹת תְּבַקַּע אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/009.yaml
  text: Your bow is laid bare[a]; the rods are sworn by command. Selah[b]. You split the earth with rivers.
translation:
  language: pt
  text: Teu arco está completamente descoberto; as varas são juradas por ordem.[a] Selá. Com rios, fendes a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta frase é difícil. Também pode ser entendido como “juramentos às tribos foram pronunciados” ou de modo semelhante. A palavra traduzida por “varas” também pode significar “tribos”, e “por ordem” pode ser entendido como “pela palavra” ou “pelo decreto”.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְיָה תֵעוֹר
  choice: está completamente descoberto
  rationale: A combinação enfática expressa exposição total. Referida ao arco, indica que ele foi tirado da cobertura e está pronto para uso, sem adotar o possível sentido menos provável de “despertar”.
- source_word: קַשְׁתֶּךָ
  choice: teu arco
  rationale: Tradução direta, preservando a imagem bélica e a fala dirigida a Deus.
- source_word: שְׁבֻעוֹת
  choice: juramentos
  rationale: Mantém o sentido nominal mais comum e evita transformar em certeza uma relação sintática que, no hebraico poético, permanece obscura.
- source_word: מַטּוֹת
  choice: varas
  rationale: Preserva o sentido concreto de varas ou bordões, adequado à imagética bélica, embora “tribos” seja lexicalmente possível e conste na nota.
- source_word: אֹמֶר
  choice: conforme a palavra
  rationale: Conserva o valor básico de “palavra, declaração” e deixa aberta a relação exata entre os termos da cláusula comprimida.
- source_word: סֶלָה
  choice: Selá
  rationale: Transliteração tradicional, pois a função exata do termo é incerta.
- source_word: נְהָרוֹת
  choice: com rios
  rationale: Mantém o plural e entende os rios instrumentalmente em relação ao ato de fender a terra.
- source_word: תְּבַקַּע
  choice: fendes
  rationale: Expressa a ação intensa de abrir ou partir, em segunda pessoa do singular.
- source_word: אָרֶץ
  choice: a terra
  rationale: No contexto cósmico da teofania, “terra” comunica melhor a amplitude da imagem do que “país” ou “território”.
theological_decisions:
- issue: Interpretação de שְׁבֻעוֹת מַטּוֹת אֹמֶר
  choice: juramentos são as varas conforme a palavra
  alternative: juramentos às tribos foram pronunciados; as varas foram juradas por ordem; teus dardos vieram segundo a palavra
  rationale: A cláusula hebraica é extremamente condensada e sua sintaxe é disputada. A tradução principal retém os elementos lexicais “juramentos”, “varas” e “palavra” sem introduzir um referente ou vínculo teológico mais específico do que o texto permite; a nota registra leituras alternativas genuínas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com concisão poética. “Teu” e “fendes” preservam a fala direta a Deus sem soar excessivamente arcaicos. A formulação deliberadamente incomum da segunda linha reflete a obscuridade real do hebraico, explicada em nota.
