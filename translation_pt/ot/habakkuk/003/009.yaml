revisions:
- from: Teu arco está completamente descoberto; juramentos são as varas conforme a palavra.[a] Selá. Com rios, fendes a terra.
  to: Teu arco está completamente descoberto; as varas são juradas por ordem.[a] Selá. Com rios, fendes a terra.
  rationale: A revisão substitui uma identificação sintaticamente inadequada por uma formulação passiva que corresponde melhor à leitura-base da trilha inglesa («the rods are sworn by command»). Ela conserva, sem falsa precisão, os elementos de juramento, varas e palavra/ordem, enquanto a nota registra as alternativas relevantes.
