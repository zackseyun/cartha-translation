  text: יָצָ֨אתָ֙ לְ/יֵ֣שַׁע עַמֶּ֔/ךָ לְ/יֵ֖שַׁע אֶת מְשִׁיחֶ֑/ךָ מָחַ֤צְתָּ רֹּאשׁ֙ מִ/בֵּ֣ית רָשָׁ֔ע עָר֛וֹת יְס֥וֹד עַד צַוָּ֖אר סֶֽלָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/013.yaml
  text: You went out for the salvation of your people[a], for the salvation of your anointed one; you crushed the head of the house of the wicked, laying bare the foundation up to the neck[c][b]. Selah
translation:
  language: pt
  text: Saíste para salvar o teu povo[a], para salvar o teu ungido[b]; esmagaste a cabeça da casa do perverso, deixando exposto o alicerce até o pescoço[c]. Selá
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para a salvação do teu povo”. O hebraico repete a expressão “para a salvação” nas duas orações paralelas.
    reason: lexical_alternative
  - marker: b
    text: “Teu ungido” pode referir-se ao rei davídico, ao povo em forma representativa ou, tipologicamente, ao Messias; o hebraico não exige uma única interpretação aqui.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “desnudando o alicerce até o pescoço”. A imagem hebraica é difícil e pode combinar a demolição de uma casa com a exposição de um corpo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָאתָ
  choice: Saíste
  rationale: O qal perfeito na segunda pessoa masculina singular descreve a saída decisiva de Deus para agir. “Saíste” é direto e não acrescenta a ideia específica de marcha.
- source_word: לְיֵשַׁע
  choice: para salvar
  rationale: O substantivo יֵשַׁע indica salvação ou libertação. A formulação verbal é natural em português, e sua repetição conserva o paralelismo hebraico.
- source_word: עַמֶּךָ
  choice: o teu povo
  rationale: Reproduz de modo direto o substantivo coletivo com sufixo de segunda pessoa, mantendo seu sentido pactual sem explicitação adicional.
- source_word: לְיֵשַׁע אֶת מְשִׁיחֶךָ
  choice: para salvar o teu ungido
  rationale: Mantém a repetição de לְיֵשַׁע e traduz מְשִׁיחֶךָ descritivamente. “Ungido” preserva a ressonância régia e teológica sem transformar a expressão, de modo inequívoco, no título “Messias”.
- source_word: מָחַצְתָּ רֹאשׁ
  choice: esmagaste a cabeça
  rationale: מחץ expressa esmagar ou despedaçar em contexto de combate. A tradução literal de רֹאשׁ preserva a possível sobreposição entre imagem corporal, liderança e parte superior de uma construção.
- source_word: מִבֵּית רָשָׁע
  choice: da casa do perverso
  rationale: Conserva a sequência hebraica e a ambiguidade entre casa como construção, família ou domínio. O singular “perverso” não identifica necessariamente uma figura específica.
- source_word: עָרוֹת יְסוֹד
  choice: deixando exposto o alicerce
  rationale: Expressa a ação concomitante ou resultante de pôr a descoberto. “Alicerce” mantém a imagem da casa sem acrescentar a ideia de pedras, ausente do texto.
- source_word: עַד צַוָּאר
  choice: até o pescoço
  rationale: A tradução literal conserva a imagem abrupta e difícil do hebraico, sem decidir se se trata de demolição, exposição corporal ou combinação das duas figuras.
- source_word: סֶלָה
  choice: Selá
  rationale: Mantém a transliteração tradicional, pois a função exata do termo é incerta.
theological_decisions:
- issue: Referente de “teu ungido”
  choice: A expressão foi mantida de forma descritiva, sem identificar explicitamente seu referente.
  alternative: Poderia referir-se ao rei davídico, ao povo representado coletivamente ou, em leitura tipológica, ao Messias.
  rationale: O hebraico מְשִׁיחֶךָ possui ressonância régia e messiânica, mas o contexto imediato não obriga a escolher apenas um desses referentes. A tradução preserva essa tensão.
- issue: Identidade do “perverso”
  choice: Foi usado o substantivo adjetival singular “o perverso”, sem nomear um inimigo histórico ou escatológico.
  alternative: “O ímpio”, “um perverso” ou uma identificação com uma personagem específica.
  rationale: רָשָׁע é singular, mas o versículo não determina uma identidade específica. A formulação evita importar essa identificação.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa coerentes com o discurso dirigido a Deus. A repetição “para salvar” reproduz o paralelismo sem a rigidez de “para a salvação de”. A construção incomum “cabeça da casa” e a imagem “até o pescoço” foram preservadas por serem significativas e genuinamente ambíguas no hebraico.
