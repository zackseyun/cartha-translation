  text: Mas eu[a] me alegrarei em Yahweh; exultarei[b] no Deus da minha salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas, quanto a mim”. As palavras iniciais enfatizam a decisão pessoal de Habacuque, em contraste com a devastação descrita no versículo anterior.'
