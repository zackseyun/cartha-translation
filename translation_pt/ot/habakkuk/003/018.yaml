lexical_decisions:
- source_word: וַאֲנִי
  choice: Mas eu
  rationale: A conjunção ligada ao pronome independente destaca a decisão pessoal do profeta em contraste com a devastação do versículo anterior.
- source_word: בַּיהוָה
  choice: em Yahweh
  rationale: A preposição ב indica aquele em quem se encontra a alegria; o nome divino é transliterado como Yahweh.
- source_word: אֶעְלֹוזָה
  choice: me alegrarei
  rationale: O verbo expressa alegria intensa; esta formulação é natural em português e permite distinguir o verbo seguinte.
- source_word: אָגִילָה
  choice: exultarei
  rationale: גיל comunica alegria jubilosa; “exultarei” preserva a intensificação poética criada pelos dois verbos quase sinônimos.
- source_word: בֵּאלֹהֵי
  choice: no Deus da
  rationale: Representa a repetição da preposição ב e preserva a relação de construto com o substantivo seguinte.
- source_word: יִשְׁעִי
  choice: minha salvação
  rationale: O substantivo pode significar salvação, livramento ou resgate; “minha salvação” mantém o sentido e o registro poético-teológico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A oposição com o versículo anterior e o paralelismo dos dois verbos de alegria foram preservados.
