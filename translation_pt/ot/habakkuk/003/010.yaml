  text: רָא֤וּ/ךָ יָחִ֨ילוּ֙ הָרִ֔ים זֶ֥רֶם מַ֖יִם עָבָ֑ר נָתַ֤ן תְּהוֹם֙ קוֹל֔/וֹ ר֖וֹם יָדֵ֥י/הוּ נָשָֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/010.yaml
  text: The mountains saw you and writhed[a]; a torrent of waters swept by. The deep gave its voice[c][b]; it lifted its hands on high.
translation:
  language: pt
  text: Os montes te viram e se contorceram[a]; uma torrente de águas passou[b]. O abismo deu a sua voz; levantou as mãos ao alto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tremeram», «se angustiaram» ou «estremeceram». O verbo hebraico pode indicar tremor ou contorções semelhantes às dores do parto.
    reason: lexical_alternative
  - marker: b
    text: Ou «passou por» ou «passou adiante». O verbo hebraico é o termo comum para «passar»; a imagem da torrente comunica o seu movimento impetuoso.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «levantou as mãos ao alto». Alguns entendem as «mãos» como uma imagem das ondas que se levantam.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: te viram
  rationale: Tradução direta do qal perfeito de ראה com sufixo de segunda pessoa masculina singular; mantém a vívida personificação dos montes.
- source_word: יָחִילוּ
  choice: se contorceram
  rationale: O verbo חול/חיל pode expressar tremor, convulsão ou dores semelhantes às do parto. «Se contorceram» preserva a intensidade corporal e poética sem reduzir a imagem a mero tremor.
- source_word: הָרִים
  choice: os montes
  rationale: Equivalente direto do substantivo plural definido, natural no registro poético bíblico em português.
- source_word: זֶרֶם מַיִם
  choice: uma torrente de águas
  rationale: זֶרֶם designa uma corrente impetuosa, enxurrada ou aguaceiro; a formulação conserva tanto o plural «águas» quanto a força da imagem.
- source_word: עָבָר
  choice: passou impetuosa
  rationale: עבר significa basicamente «passar». O acréscimo contextual «impetuosa» comunica o movimento vigoroso da torrente sem transformar o verbo em «inundar».
- source_word: נָתַן תְּהוֹם קוֹלוֹ
  choice: As profundezas soltaram a sua voz
  rationale: A expressão mantém a personificação e reproduz de modo natural a ideia hebraica de «dar a sua voz». O plural coletivo «profundezas» é corrente em português para as águas profundas.
- source_word: תְּהוֹם
  choice: as profundezas
  rationale: Representa as águas profundas ou cósmicas do poema sem acrescentar as possíveis conotações teológicas posteriores de «abismo».
- source_word: רוֹם
  choice: bem alto
  rationale: O substantivo «altura» funciona aqui adverbialmente; «bem alto» é claro, natural e conserva a direção ascendente.
- source_word: יָדֵיהוּ נָשָׂא
  choice: ergueram ... as suas mãos
  rationale: Conserva literalmente a imagem antropomórfica das mãos das profundezas, em vez de interpretá-las no texto principal como ondas. A concordância plural acompanha naturalmente «as profundezas» em português.
theological_decisions:
- issue: Personificação cósmica numa teofania
  choice: Manter os montes e as profundezas como elementos da criação que reagem pessoalmente à manifestação de Deus.
  alternative: Explicar a linguagem em termos puramente naturais, como montes que tremem e ondas que se levantam.
  rationale: A poesia hebraica apresenta a criação personificada. Preservar essa linguagem mantém a tensão e a força teofânica sem impor uma explicação meteorológica.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. «Montes» e «profundezas» preservam o registro bíblico sem arcaísmo excessivo. A personificação do hebraico foi mantida; o plural em «as profundezas ... ergueram» é uma adaptação gramatical natural ao português.
