  text: וְ/נֹ֨גַהּ֙ כָּ/א֣וֹר תִּֽהְיֶ֔ה קַרְנַ֥יִם מִ/יָּד֖/וֹ ל֑/וֹ וְ/שָׁ֖ם חֶבְי֥וֹן עֻזֹּֽ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/004.yaml
  text: His brightness was like the light; rays were from his hand[a], and there his power was hidden.
translation:
  language: pt
  text: Seu brilho era como a luz; raios saíam de sua mão[a], e ali estava oculto o seu poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “chifres de sua mão”. Aqui, “chifres” é entendido metaforicamente como raios ou feixes de luz.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  choice: brilho
  rationale: O substantivo denota brilho ou resplendor; “brilho” é claro e natural e mantém o paralelo poético com a luz.
- source_word: כָּאוֹר
  choice: como a luz
  rationale: Preserva diretamente a comparação marcada por כ e o sentido comum de אוֹר.
- source_word: תִּהְיֶה
  choice: era
  rationale: Embora seja formalmente uma forma imperfeita, no relato poético da visão descreve naturalmente a manifestação em tempo passado.
- source_word: קַרְנַיִם
  choice: raios
  rationale: Literalmente “chifres”, mas aqui a imagem sugere projeções luminosas; a opção literal é conservada em nota.
- source_word: מִיָּדוֹ
  choice: saíam de sua mão
  rationale: יָד significa normalmente “mão”, e מִן indica origem. O verbo “saíam” explicita em português a relação nominal elíptica sem acrescentar a ideia mais específica de lampejar.
- source_word: לוֹ
  choice: seu
  rationale: O pronome retoma a figura divina; a relação exata é sintaticamente difícil, e a formulação portuguesa expressa a referência sem sobrecarregar o verso.
- source_word: וְשָׁם
  choice: e ali
  rationale: Mantém tanto a conjunção quanto o advérbio, ligando a radiância visível ao ocultamento do poder.
- source_word: חֶבְיוֹן
  choice: se escondia
  rationale: O substantivo significa esconderijo ou ocultamento. A construção verbal é idiomática em português e preserva o sentido de poder oculto naquele lugar.
- source_word: עֻזֹּה
  choice: o seu poder
  rationale: עֹז pode indicar força, poder ou vigor; “poder” se ajusta à teofania e à ideia de potência divina encoberta.
theological_decisions:
- issue: Imagem antropomórfica na teofania
  choice: Manter “sua mão” como a origem dos raios.
  alternative: Traduzir de modo mais abstrato, como “ao seu lado”, para reduzir a antropomorfização.
  rationale: O hebraico emprega deliberadamente linguagem corporal na descrição poética da manifestação divina. Preservá-la respeita a imagem do texto sem impor uma explicação doutrinária.
- issue: Relação entre a manifestação luminosa e o poder oculto
  choice: Preservar a tensão entre o brilho visível e o poder que permanece escondido.
  alternative: Explicar que a luz revela ou representa plenamente o poder divino.
  rationale: O verso justapõe revelação luminosa e ocultamento; a tradução não deve resolver essa tensão poética e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Seu brilho” evita uma escolha mais elevada como “resplendor”; “ali” soa mais natural no fluxo poético. O ponto e vírgula conserva as duas imagens estreitamente ligadas.
