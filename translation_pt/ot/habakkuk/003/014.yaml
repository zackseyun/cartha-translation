id: HAB.3.14
reference: Habakkuk 3:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נָקַ֤בְתָּ בְ/מַטָּי/ו֙ רֹ֣אשׁ פרז/ו יִסְעֲר֖וּ לַ/הֲפִיצֵ֑/נִי עֲלִ֣יצֻתָ֔/ם כְּמוֹ לֶ/אֱכֹ֥ל עָנִ֖י בַּ/מִּסְתָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/014.yaml
  text: You pierced the head of his warriors with his own staffs; they stormed out to scatter me[a], their exultation like one about to devour the poor in secret.
translation:
  language: pt
  text: Com as próprias varas dele, traspassaste a cabeça dos seus guerreiros[a]. Eles avançaram como um vendaval para me dispersar; a exultação deles era como a de quem está prestes a devorar o pobre às escondidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cabeça das suas aldeias” ou “a cabeça das suas hordas”. O termo hebraico é difícil, e muitos o entendem de modo mais geral como referência aos bandos ou líderes do inimigo.
    reason: alternative_reading
lexical_decisions:
- source_word: נָקַבְתָּ
  choice: traspassaste
  rationale: O qal de נקב expressa perfurar ou atravessar. “Traspassaste” preserva a imagem violenta e marcial em linguagem digna e compreensível.
- source_word: בְמַטָּיו
  choice: com as próprias varas dele
  rationale: מַטֶּה significa normalmente vara ou bastão. O sufixo masculino singular é explicitado por “dele”, e “próprias” ressalta a ironia de o inimigo ser vencido com seus próprios instrumentos sem transformar o termo diretamente em “lanças”.
- source_word: רֹאשׁ
  choice: a cabeça
  rationale: ראשׁ pode designar a cabeça literal ou, figuradamente, o chefe ou a vanguarda. A tradução literal conserva a imagem e não resolve indevidamente essa abertura.
- source_word: פרזיו
  choice: dos seus guerreiros
  rationale: A forma é difícil e disputada. No contexto de ataque militar, “guerreiros” oferece um referente coletivo coerente, enquanto outras leituras são registradas em nota.
- source_word: יִסְעֲרוּ
  choice: avançaram como um vendaval
  rationale: O verbo סער comunica movimento tempestuoso, impetuoso. A formulação conserva a imagem da tempestade e expressa com naturalidade o ímpeto dos atacantes.
- source_word: לַהֲפִיצֵנִי
  choice: para me dispersar
  rationale: No hiphil, פוץ significa espalhar ou dispersar. “Dispersar” reproduz diretamente o sentido e se ajusta ao contexto de ataque.
- source_word: עֲלִיצֻתָם
  choice: a exultação deles
  rationale: O substantivo indica alegria intensa ou exultação. A expressão preserva o júbilo arrogante dos agressores.
- source_word: כְּמוֹ לֶאֱכֹל
  choice: como a de quem está prestes a devorar
  rationale: A comparação retrata intenção predatória iminente. “Está prestes a devorar” comunica essa orientação prospectiva em português natural.
- source_word: עָנִי
  choice: o pobre
  rationale: עָנִי pode significar pobre, necessitado ou aflito. “O pobre” é conciso e mantém a dimensão de opressão social presente na imagem.
- source_word: בַּמִּסְתָּר
  choice: às escondidas
  rationale: O termo pode indicar segredo ou lugar oculto. “Às escondidas” exprime de modo idiomático a ação predatória clandestina.
theological_decisions:
- issue: Interpretação do substantivo difícil פרזיו no contexto marcial
  choice: seus guerreiros
  alternative: suas aldeias / suas hordas
  rationale: O contexto descreve agressores que avançam impetuosamente para dispersar o falante e devorar o pobre. Um referente militar se encaixa melhor, mas a dificuldade real do hebraico é preservada em nota, sem ocultar leituras alternativas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém-se a segunda pessoa do singular na fala dirigida a Deus. A imagem hebraica de “cabeça” e a metáfora tempestuosa são preservadas, enquanto a ambiguidade de פרזיו é explicitada em nota.
