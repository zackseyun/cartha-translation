base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/019.yaml
  text: 'The LORD, my Lord, is my strength; he makes my feet like the deer’s, and he causes me to tread on my heights.


    For the choir director: with my stringed instruments.'
translation:
  language: pt
  text: 'O SENHOR, o meu Senhor, é a minha força; ele torna os meus pés como os das corças e me faz caminhar nas minhas alturas.


    Ao mestre de música, com os meus instrumentos de cordas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָהּ אֲדֹנָי
  choice: O SENHOR, meu Senhor
  rationale: Mantém a distinção e a justaposição entre o nome divino YHWH e o título Adonai, seguindo a convenção portuguesa de representar o nome por SENHOR em versaletes.
- source_word: חֵילִי
  choice: é a minha força
  rationale: חַיִל, neste contexto, designa força ou vigor; a formulação é direta e natural em português.
- source_word: כָּאַיָּלוֹת
  choice: como os da corça
  rationale: O plural hebraico אַיָּלוֹת refere-se a corças ou cervas; em português, 'pés como os da corça' comunica agilidade e firmeza sem explicitar além do texto.
- source_word: בָּמוֹתַי
  choice: as minhas alturas
  rationale: Preserva o possessivo e a imagem espacial do hebraico. Evita interpretar as alturas especificamente como vitória, segurança ou lugares de culto.
- source_word: יַדְרִיכֵנִי
  choice: me faz caminhar
  rationale: O hifil de דרך expressa fazer alguém pisar, andar ou avançar; esta escolha mantém o sentido causativo em linguagem corrente.
- source_word: לַמְנַצֵּחַ בִּנְגִינוֹתָי
  choice: Ao regente do coro, com os meus instrumentos de cordas
  rationale: Traduz a indicação musical final como rubrica. 'Regente do coro' é uma equivalência acessível para לַמְנַצֵּחַ, e 'meus instrumentos de cordas' preserva o sufixo de primeira pessoa.
theological_decisions:
- issue: Relação entre YHWH e Adonai
  choice: O SENHOR, meu Senhor
  alternative: O SENHOR Deus / O Soberano SENHOR
  rationale: O hebraico apresenta dois termos distintos em aposição. A tradução escolhida conserva essa tensão lexical sem fundi-los nem acrescentar 'Deus'.
- issue: Sentido de 'minhas alturas'
  choice: Preservar literalmente a imagem
  alternative: me faz vencer nas alturas / me conduz em segurança pelos montes
  rationale: O referente pode envolver terreno elevado, segurança ou triunfo, mas o verso não resolve explicitamente a imagem; por isso, não se impõe uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético e separa visualmente a rubrica musical do cântico.
