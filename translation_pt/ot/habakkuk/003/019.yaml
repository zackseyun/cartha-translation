    rationale: «Sobre as minhas alturas» é compreensível, mas «nas minhas alturas» representa mais naturalmente o sentido de deslocar-se/pisar em lugares elevados.
  - severity: low
    issue: «Regente do coro»
    rationale: למנצח designa o responsável musical, mas o hebraico não menciona coro; «mestre de música» evita essa especificação.
