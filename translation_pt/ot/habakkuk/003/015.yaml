  source_fidelity: A tradução preserva a imagem teofânica de Deus avançando pelo mar com seus cavalos e traduz adequadamente מַיִם רַבִּים por “muitas águas”. Contudo, “turbilhão” especifica demais o sentido de חֹמֶר, termo difícil que provavelmente designa uma massa, amontoado ou volume revolto de águas, sem exigir a imagem particular de um redemoinho.
  naturalness: “Avançaste pelo mar com os teus cavalos” é natural, solene e compreensível no português internacional. “Massa das muitas águas” mantém um tom poético e é suficientemente natural neste contexto, sem a precisão excessiva de “turbilhão”.
  terminology: “Os teus cavalos” preserva a imagem concreta do hebraico; “muitas águas” é uma correspondência direta e poética. A segunda pessoa singular é apropriada à oração dirigida a Deus. O marcador de nota deve ficar junto ao termo lexicalmente explicado.
