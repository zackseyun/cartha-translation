  text: דָּרַ֥כְתָּ בַ/יָּ֖ם סוּסֶ֑י/ךָ חֹ֖מֶר מַ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/015.yaml
  text: You marched through the sea with your horses[a], through the heap of mighty waters.
translation:
  language: pt
  text: Avançaste pelo mar com os teus cavalos, pela massa[a] das muitas águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo turbilhão das muitas águas”. O termo hebraico é difícil e pode indicar uma massa de águas amontoada ou revolta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַכְתָּ
  choice: Avançaste
  rationale: O verbo דרך expressa literalmente pisar ou marchar. Aqui, “avançaste” preserva o movimento deliberado da teofania guerreira em português natural, sem sugerir necessariamente que os cavalos marchavam a pé pelo fundo do mar.
- source_word: בַיָּם
  choice: pelo mar
  rationale: Embora ב possa significar “em”, com um verbo de movimento “pelo mar” comunica naturalmente a travessia ou progressão através dele.
- source_word: סוּסֶיךָ
  choice: com os teus cavalos
  rationale: O hebraico diz “teus cavalos”; a preposição “com” explicita em português a companhia ou o meio associado ao avanço, sem alterar a imagem.
- source_word: חֹמֶר
  choice: turbilhão
  rationale: O substantivo é difícil neste contexto e pode indicar uma massa amontoada ou revolta. “Turbilhão” transmite poeticamente a massa agitada das águas, enquanto a alternativa mais literal é preservada em nota.
- source_word: מַיִם רַבִּים
  choice: muitas águas
  rationale: É a correspondência direta da expressão hebraica e mantém sua força poética sem decidir se רַבִּים enfatiza quantidade, extensão ou poder.
theological_decisions:
- issue: Imagem do guerreiro divino na teofania poética
  choice: Manter Deus avançando pelo mar com seus cavalos
  alternative: Interpretar os cavalos como nuvens ou seres celestiais, ou substituir a imagem por uma afirmação abstrata do poder divino
  rationale: O texto apresenta uma imagem concreta e poética do SENHOR como guerreiro. A tradução não a alegoriza nem a reduz a uma formulação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com forma verbal na segunda pessoa do singular para refletir o discurso direto a Deus. A ordem poética e a imagem concreta foram preservadas.
