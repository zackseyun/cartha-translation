  rationale: A revisão substitui “turbilhão” por “massa”, opção menos interpretativa para o difícil חֹמֶר e mais próxima de seu possível campo semântico de amontoado ou volume de águas. A alternativa dinâmica é mantida em nota, e o marcador é movido para junto da palavra explicada. O restante da redação conserva a imagem, o registro e a ambiguidade poética do hebraico.
