  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי תְאֵנָ֣ה לֹֽא תִפְרָ֗ח וְ/אֵ֤ין יְבוּל֙ בַּ/גְּפָנִ֔ים כִּחֵשׁ֙ מַעֲשֵׂה זַ֔יִת וּ/שְׁדֵמ֖וֹת לֹא עָ֣שָׂה אֹ֑כֶל גָּזַ֤ר מִ/מִּכְלָה֙ צֹ֔אן וְ/אֵ֥ין בָּקָ֖ר בָּ/רְפָתִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/017.yaml
  text: Though the fig tree does not blossom[a], and there is no produce on the vines; the yield of the olive fails, and the fields produce no food; the flock is cut off from the fold, and there is no herd in the stalls[b],
translation:
  language: pt
  text: Ainda que a figueira não floresça[a], nem haja fruto nas videiras; ainda que falhe a produção da oliveira[b], e os campos não produzam alimento; ainda que o rebanho seja eliminado do aprisco, e não haja gado nos currais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois a figueira não floresce...”. A partícula hebraica inicial pode ser entendida em sentido causal (“pois”) ou concessivo (“ainda que”); o sentido concessivo se ajusta ao contraste com a declaração de alegria no versículo seguinte.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “a produção da oliveira se mostra falsa”, expressão que indica o fracasso da colheita de azeitonas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ainda que
  rationale: A partícula pode ser causal ou concessiva; no fluxo poético para a declaração de alegria do versículo 18, a leitura concessiva é natural, sem ocultar a alternativa em nota.
- source_word: תְאֵנָה לֹא תִפְרָח
  choice: a figueira não floresça
  rationale: Mantém a árvore como sujeito e traduz o verbo de brotar ou florescer por uma expressão portuguesa clara e poética.
- source_word: וְאֵין יְבוּל בַּגְּפָנִים
  choice: nem haja fruto nas videiras
  rationale: Neste contexto, יְבוּל designa aquilo que as videiras produzem; “fruto” é mais natural em português do que “produção” nesta oração.
- source_word: כִּחֵשׁ מַעֲשֵׂה זַיִת
  choice: falhe a produção da oliveira
  rationale: כִּחֵשׁ pode significar literalmente “enganar” ou “mostrar-se falso”; aqui indica que a safra esperada não se concretiza. “Produção da oliveira” comunica o sentido de מַעֲשֵׂה זַיִת.
- source_word: וּשְׁדֵמוֹת לֹא עָשָׂה אֹכֶל
  choice: e os campos não produzam alimento
  rationale: Traduz naturalmente o hebraísmo literal “não façam alimento” e preserva a referência aos campos cultivados.
- source_word: גָּזַר מִמִּכְלָה צֹאן
  choice: o rebanho desapareça do aprisco
  rationale: O verbo expressa ser cortado ou eliminado. “Desapareça” transmite a ausência total do rebanho em português corrente, enquanto a nota lexical não é necessária para a compreensão.
- source_word: וְאֵין בָּקָר בָּרְפָתִים
  choice: e não haja gado nos currais
  rationale: בָּקָר refere-se ao gado bovino, e רְפָתִים aos locais onde é mantido; “gado nos currais” é claro e idiomático.
theological_decisions:
- issue: Valor discursivo de כִּי no início do versículo
  choice: 'Leitura concessiva: “Ainda que”'
  alternative: 'Leitura causal: “Pois” ou “Porque”'
  rationale: A sequência descreve perdas agrícolas que contrastam com “eu me alegrarei” no versículo seguinte. Contudo, como כִּי admite valor causal, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência poética marcada pela repetição de “ainda que”. Emprega “videiras”, “oliveira”, “aprisco” e “currais” como vocabulário agrícola preciso e reconhecível. A pontuação mantém o versículo aberto para sua continuação sintática e retórica no versículo 18.
