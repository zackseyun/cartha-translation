  text: בְּ/זַ֖עַם תִּצְעַד אָ֑רֶץ בְּ/אַ֖ף תָּד֥וּשׁ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/012.yaml
  text: In wrath you marched through the earth[b][a]; in anger you threshed the nations.
translation:
  language: pt
  text: Com indignação, marchaste pela terra[a]; com ira, trilhaste as nações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo país” ou “pela região”; o hebraico אֶרֶץ pode indicar tanto a terra em sentido amplo como um território específico.
    reason: lexical_alternative
  - marker: b
    text: Ou “pisoteaste as nações”; o verbo hebraico evoca o ato de trilhar ou debulhar cereais, muitas vezes por pisoteio.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזַעַם
  choice: Com indignação
  rationale: A construção com בְּ descreve a maneira ou o ímpeto da ação. “Com indignação” é natural em português e mantém o paralelismo poético com “com ira”.
- source_word: תִּצְעַד
  choice: marchaste
  rationale: O verbo צעד denota avançar a passos. “Marchaste” comunica movimento deliberado e vigoroso no contexto da manifestação divina.
- source_word: אָרֶץ
  choice: pela terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo como uma região específica. O alcance cósmico do hino favorece “terra”, sem eliminar a alternativa “país” ou “região”.
- source_word: בְּאַף
  choice: com ira
  rationale: אַף, literalmente “nariz”, é uma expressão idiomática para ira. A tradução evita o literalismo e conserva a intensidade e o paralelismo do hebraico.
- source_word: תָּדוּשׁ
  choice: trilhaste
  rationale: דושׁ descreve o ato de debulhar ou trilhar cereais, frequentemente por pisoteio. “Trilhaste” preserva a metáfora agrícola de modo conciso; a nota explicita o sentido associado de pisotear.
- source_word: גּוֹיִם
  choice: as nações
  rationale: גּוֹיִם refere-se aqui aos povos ou nações submetidos ao juízo divino. “As nações” é direto e não introduz o contraste posterior sugerido por “gentios”.
theological_decisions:
- issue: Alcance de אָרֶץ no contexto da manifestação divina e do juízo
  choice: a terra
  alternative: o país / a região
  rationale: A cena poética retrata a marcha de Deus em amplo juízo e a põe em paralelo com “as nações”; por isso, “a terra” se ajusta melhor ao contexto, enquanto a nota preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo “com indignação... com ira” e os pretéritos poéticos preservam a força do verso. Os marcadores seguem imediatamente os termos ambíguos a que se referem.
