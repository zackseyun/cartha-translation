  text: Before him goes pestilence[b][a], and plague comes out at his feet.
translation:
  language: pt
  text: Diante dele avança a peste, e a febre ardente[a] irrompe a seus pés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “praga abrasadora”, “peste” ou, possivelmente, “Resefe”, nome de uma divindade ligada à peste, evocado aqui em linguagem poética.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a seus pés”; a expressão também pode sugerir “atrás dele” ou “seguindo seus passos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Diante dele
  rationale: Expressa naturalmente a posição à frente de alguém e preserva a imagem espacial do cortejo divino.
- source_word: יֵלֶךְ
  choice: avança
  rationale: Comunica o movimento vívido da marcha poética com linguagem atual e digna.
- source_word: דָּבֶר
  choice: a peste
  rationale: O termo designa peste ou epidemia, especialmente em contextos de juízo; esta escolha é clara e evita repeti-lo como equivalente de רֶשֶׁף.
- source_word: וְיֵצֵא
  choice: e ... sai
  rationale: Mantém o sentido básico de sair ou ir para fora e acompanha de perto a construção hebraica.
- source_word: רֶשֶׁף
  choice: a febre ardente
  rationale: Preserva a associação lexical com calor, chama e enfermidade, além de distinguir o termo da peste mencionada no primeiro segmento. A ambiguidade entre febre, praga abrasadora e o possível nome Resefe é indicada em nota.
- source_word: לְרַגְלָיו
  choice: junto aos seus pés
  rationale: Conserva a imagem concreta dos pés sem excluir a possível ideia de algo que segue atrás dele ou acompanha seus passos.
theological_decisions:
- issue: Possível pano de fundo mitológico de רֶשֶׁף
  choice: Traduzir como substantivo comum, “febre ardente”, no texto principal.
  alternative: “Resefe”, como nome próprio de uma divindade associada à peste.
  rationale: O paralelismo com דָּבֶר favorece a descrição de uma força destrutiva. A tradução principal não afirma uma identificação mitológica incerta, mas a nota preserva essa possibilidade interpretativa.
translation_notes:
  register: Português moderno, claro e poético, com legibilidade brasileira ampla. “Avança” reforça a cena de marcha, enquanto “junto aos seus pés” preserva a imagem corporal e sua ambiguidade espacial.
