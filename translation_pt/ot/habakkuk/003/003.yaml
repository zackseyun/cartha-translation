id: HAB.3.3
reference: Habakkuk 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱל֨וֹהַ֙ מִ/תֵּימָ֣ן יָב֔וֹא וְ/קָד֥וֹשׁ מֵֽ/הַר פָּארָ֖ן סֶ֑לָה כִּסָּ֤ה שָׁמַ֨יִם֙ הוֹד֔/וֹ וּ/תְהִלָּת֖/וֹ מָלְאָ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/003/003.yaml
  text: God comes from Teman[a], and the Holy One from Mount Paran. Selah. His splendor covers the heavens[d][c][b], and his praise fills the earth.
translation:
  language: pt
  text: 'Deus vem de Temã[a],

    e o Santo, do monte Parã.

    Selá.[b]

    Seu esplendor[c] cobre os céus,

    e seu louvor enche a terra.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Temã também pode ser entendido, de modo mais geral, como “o sul”; aqui, porém, provavelmente é o nome do lugar, em paralelo com o monte Parã.
    reason: lexical_alternative
  - marker: b
    text: Selá é um termo litúrgico ou musical de significado incerto, tradicionalmente deixado sem tradução.
    reason: cultural_note
  - marker: c
    text: Ou “sua majestade” ou “sua glória”.
    reason: lexical_alternative
  - marker: d
    text: Ou “seu louvor encheu a terra” ou “seu louvor encherá a terra”. Neste contexto poético, a forma verbal hebraica admite diferentes perspectivas temporais.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלוֹהַ
  choice: Deus
  rationale: O substantivo singular designa Deus de modo direto; “Deus” é a equivalência natural, sem acrescentar nuances ausentes do hebraico.
- source_word: מִתֵּימָן
  choice: de Temã
  rationale: Embora תֵּימָן também possa indicar o sul, o paralelismo com o monte Parã favorece aqui o topônimo Temã.
- source_word: יָבוֹא
  choice: vem
  rationale: O imperfeito hebraico, nesta teofania poética, admite um presente vívido, que preserva a imediatez litúrgica sem limitar a cena ao passado ou ao futuro.
- source_word: וְקָדוֹשׁ
  choice: e o Santo
  rationale: O adjetivo substantivado funciona como título divino e é paralelo a “Deus” no primeiro membro.
- source_word: מֵהַר פָּארָן
  choice: do monte Parã
  rationale: Tradução geográfica direta; a elipse de “vem” no segundo membro produz paralelismo natural em português.
- source_word: סֶלָה
  choice: Selá
  rationale: Como o sentido exato do termo litúrgico ou musical é incerto, ele é transliterado em vez de interpretado.
- source_word: כִּסָּה
  choice: cobre
  rationale: O presente vívido mantém a unidade temporal da cena poética e expressa a extensão do esplendor divino.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: O plural tradicional e poético corresponde bem à forma hebraica e preserva o contraste cósmico com “a terra”.
- source_word: הוֹדוֹ
  choice: seu esplendor
  rationale: הוֹד pode denotar esplendor, majestade ou glória; “esplendor” combina especialmente com a imagem visual de cobrir os céus.
- source_word: וּתְהִלָּתוֹ
  choice: e seu louvor
  rationale: “Louvor” preserva a formulação hebraica e sua possível referência tanto ao louvor dirigido a Deus quanto ao louvor que lhe é devido.
- source_word: מָלְאָה הָאָרֶץ
  choice: enche a terra
  rationale: “A terra” mantém o alcance cósmico paralelo a “os céus”; o presente conserva a vivacidade da teofania.
theological_decisions:
- issue: Apresentação temporal da teofania
  choice: 'Presente vívido: “vem”, “cobre”, “enche”'
  alternative: Narrativa no passado (“veio”, “cobriu”, “encheu”) ou expectativa futura (“virá”, “cobrirá”, “encherá”)
  rationale: Habacuque 3 recorda e torna presente poeticamente a manifestação de Deus. O presente preserva essa tensão litúrgica sem reduzir o texto apenas a uma lembrança passada ou a uma previsão futura.
- issue: Referente de “o Santo”
  choice: Título divino paralelo a “Deus”
  alternative: Uma figura santa distinta
  rationale: O paralelismo poético indica fortemente o mesmo referente divino nos dois membros; a tradução evita introduzir uma distinção não exigida pelo hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A disposição em linhas conserva o paralelismo poético; “do monte Parã” emprega elipse natural do verbo. Os topônimos seguem formas portuguesas concisas, e “Selá” preserva a incerteza do termo original.
