id: HAB.2.2
reference: Habakkuk 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּעֲנֵ֤/נִי יְהוָה֙ וַ/יֹּ֔אמֶר כְּת֣וֹב חָז֔וֹן וּ/בָאֵ֖ר עַל הַ/לֻּח֑וֹת לְמַ֥עַן יָר֖וּץ ק֥וֹרֵא בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/002.yaml
  text: 'Then Yahweh answered me and said: “Write the vision; make it plain on tablets[a], so that one who reads it may run.”'
translation:
  language: pt
  text: 'Então Yahweh me respondeu e disse: “Escreva a visão e torne-a clara nas tábuas, para que quem a ler possa correr.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para que quem a ler possa correr com ela”, ou “para que se possa lê-la rapidamente, até correndo”. A expressão hebraica é compacta e admite mais de um sentido plausível.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעֲנֵנִי
  choice: me respondeu
  rationale: Equivalente direto e natural de ענה com o sufixo de primeira pessoa singular.
- source_word: וַיֹּאמֶר
  choice: e disse
  rationale: Mantém a sequência narrativa hebraica de modo claro e idiomático.
- source_word: כְּתוֹב חָזוֹן
  choice: Escreva a visão
  rationale: Traduz diretamente o imperativo כתב e entende חזון como a visão profética específica do contexto.
- source_word: וּבָאֵר
  choice: torne-a clara
  rationale: Expressa o sentido causativo de tornar claro ou bem legível, sem restringi-lo indevidamente a explicar ou gravar.
- source_word: עַל הַלֻּחוֹת
  choice: nas tábuas
  rationale: לֻחוֹת designa tábuas usadas para escrita; não se acrescenta o material, que o hebraico não especifica.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz naturalmente a finalidade ou o resultado em português moderno.
- source_word: יָרוּץ קוֹרֵא בוֹ
  choice: quem a ler possa correr
  rationale: Mantém o leitor como sujeito de 'correr' e preserva a formulação compacta e vívida do hebraico.
theological_decisions:
- issue: Sentido da oração לְמַעַן יָרוּץ קוֹרֵא בוֹ
  choice: para que quem a ler possa correr
  alternative: para que quem a ler possa correr com ela; para que se possa lê-la rapidamente, até correndo
  rationale: A sintaxe hebraica é compacta e admite mais de uma interpretação plausível. O texto principal conserva a leitura mais direta, na qual o leitor é sujeito de 'correr', enquanto a nota registra as alternativas sem resolver artificialmente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal em “torne-a” preserva um tom bíblico natural sem arcaísmo excessivo; “tábuas” mantém o meio de escrita sem acrescentar que fossem de pedra.
