  yaml_path: translation/ot/habakkuk/002/011.yaml
  text: For a stone will cry out from the wall, and a beam from the woodwork will answer it.
translation:
  language: pt
  text: Pois a pedra clamará da parede, e a viga de madeira lhe responderá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּזְעָק
  choice: clamará
  rationale: Expressa o grito acusador personificado da pedra, preservando a força do verbo hebraico צעק.
- source_word: כָפִיס
  choice: viga
  rationale: O termo raro designa aqui uma peça estrutural de madeira; “viga” é natural em português e mantém o contraste entre pedra e madeira.
- source_word: מֵעֵץ
  choice: de madeira
  rationale: Traduz literalmente a origem ou matéria da peça, sem acrescentar a ideia mais específica de acabamento ou revestimento.
- source_word: יַעֲנֶנָּה
  choice: lhe responderá
  rationale: Preserva a personificação e o sufixo feminino singular, cujo referente natural é “a pedra”.
theological_decisions:
- issue: Testemunho figurado dos materiais da construção
  choice: 'Manter a personificação: a pedra clama e a viga responde.'
  alternative: Explicitar que os materiais testemunham contra o construtor.
  rationale: O hebraico apresenta diretamente a imagem poética; explicá-la no corpo do versículo reduziria sua força e resolveria uma implicação que o texto deixa ao leitor.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo compacto. “Pois” liga o versículo à denúncia anterior; “clamará” mantém intensidade profética sem soar excessivamente arcaico.
