source:
  edition: WLC
  text: הֲ/ל֣וֹא פֶ֗תַע יָק֨וּמוּ֙ נֹשְׁכֶ֔י/ךָ וְ/יִקְצ֖וּ מְזַעְזְעֶ֑י/ךָ וְ/הָיִ֥יתָ לִ/מְשִׁסּ֖וֹת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/007.yaml
  text: Will not your creditors suddenly rise[a], and those who make you tremble awake? Then you will become plunder for them.
translation:
  language: pt
  text: Não se levantarão de repente os seus credores[a]? Não despertarão os que fazem você tremer? Então você se tornará despojo para eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os que mordem você”. A expressão talvez evoque de propósito tanto atacantes que mordem como credores que exigem pagamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não se... ?
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa; a construção negativa interrogativa é natural em português e combina com a sequência futura.
- source_word: פֶתַע
  choice: de repente
  rationale: Expressa a irrupção súbita do juízo de modo claro e idiomático.
- source_word: יָקוּמוּ
  choice: se levantarão
  rationale: Preserva o sentido básico de levantar-se, aqui com a implicação contextual de agir contra o opressor.
- source_word: נֹשְׁכֶיךָ
  choice: seus credores
  rationale: Embora derive do verbo 'morder', no contexto econômico pode designar quem cobra uma dívida ou juros. 'Credores' comunica a inversão sofrida por quem acumulou bens alheios, enquanto a imagem literal é preservada em nota.
- source_word: וְיִקְצוּ
  choice: despertarão
  rationale: Mantém a imagem de acordar e o paralelismo poético com 'se levantarão'.
- source_word: מְזַעְזְעֶיךָ
  choice: os que fazem você tremer
  rationale: Conserva a força causativa e a imagem vívida de abalo ou terror sem restringi-la a uma interpretação mais específica.
- source_word: וְהָיִיתָ
  choice: Então você se tornará
  rationale: '''Então'' explicita naturalmente a consequência, e ''se tornará'' expressa a mudança de condição.'
- source_word: לִמְשִׁסּוֹת
  choice: despojo
  rationale: Designa aquilo que é tomado como presa ou saque; 'despojo' preserva o tom poético e a reversão temática.
- source_word: לָמוֹ
  choice: para eles
  rationale: Retoma os agentes mencionados nas duas linhas anteriores e se encaixa naturalmente com 'despojo'.
