source:
  edition: WLC
  text: הִנֵּ֣ה עֻפְּלָ֔ה לֹא יָשְׁרָ֥ה נַפְשׁ֖/וֹ בּ֑/וֹ וְ/צַדִּ֖יק בֶּ/אֱמוּנָת֥/וֹ יִחְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/004.yaml
  text: 'Look: his soul is puffed up; it is not upright within him, but the righteous will live by his faithfulness.'
translation:
  language: pt
  text: 'Veja: sua alma está inchada; não é íntegra dentro dele, mas o justo viverá por sua fidelidade.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Interjeição que chama a atenção para o contraste; em português atual, “Veja” preserva essa função de modo natural e digno.
- source_word: עֻפְּלָה
  choice: está inchada
  rationale: A forma rara sugere inchaço ou arrogância. “Está inchada” conserva a imagem concreta e sua conotação de orgulho sem explicitar além do hebraico.
- source_word: נַפְשׁוֹ
  choice: sua alma
  rationale: Mantém o referente antropológico amplo de נֶפֶשׁ e acompanha a construção hebraica, sem reduzi-lo apenas a “ele” ou “seu íntimo”.
- source_word: יָשְׁרָה
  choice: é íntegra
  rationale: Expressa retidão moral e conformidade ao que é correto; “íntegra” soa natural quando aplicada à alma e evita uma formulação espacial excessivamente literal.
- source_word: בֶּאֱמוּנָתוֹ
  choice: por sua fidelidade
  rationale: אֱמוּנָה pode abranger firmeza, fidelidade e fé. No contexto imediato, “fidelidade” comunica constância leal, preservando a possibilidade de uma confiança perseverante.
- source_word: יִחְיֶה
  choice: viverá
  rationale: Reproduz o imperfeito hebraico com valor prospectivo ou resultativo e mantém aberta a extensão concreta e teológica de “viver”.
theological_decisions:
- issue: Sentido de אֱמוּנָה na afirmação sobre o justo
  choice: fidelidade
  alternative: fé
  rationale: O substantivo hebraico designa firmeza, confiabilidade ou fidelidade e, neste contexto, contrasta a perseverança do justo com a arrogância do opressor. A tradução não nega a dimensão de fé/confiança, mas evita impor retrospectivamente uma formulação doutrinária específica.
- issue: Referente do sufixo em בֶּאֱמוּנָתוֹ
  choice: sua fidelidade, referindo-se ao justo
  alternative: fidelidade de Deus
  rationale: A ligação gramatical mais imediata é com “o justo”. Mantém-se o pronome possessivo do hebraico sem converter o referente em Deus, embora a fidelidade do justo pressuponha sua relação de confiança com Deus.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A ordem e o paralelismo do hebraico foram preservados tanto quanto possível; a imagem incomum de uma alma “inchada” foi mantida para não apagar a força poética nem resolver a raridade lexical por paráfrase.
