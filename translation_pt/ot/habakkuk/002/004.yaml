  verdict: approve
  source_fidelity: 'A tradução acompanha fielmente o hebraico: a alma do personagem arrogante é descrita pela imagem de estar inchada, não íntegra nele, em contraste com o justo, que viverá por sua fidelidade. «Por sua fidelidade» é uma representação lexicalmente defensável de בֶּאֱמוּנָתוֹ e não fecha indevidamente a discussão entre fidelidade, firmeza e fé/confiança.'
  naturalness: O português é moderno, claro e suficientemente solene. «Veja:» introduz bem a chamada de atenção de הִנֵּה; «sua alma está inchada» preserva deliberadamente a imagem incomum do original, e «não é íntegra dentro dele» comunica o sentido moral de «não é reta nele» sem reproduzir uma construção espacial pouco natural.
  terminology: «Justo», «viverá» e «fidelidade» são escolhas consistentes e adequadas. A formulação evita impor uma leitura doutrinária posterior ao termo hebraico אֱמוּנָה.
