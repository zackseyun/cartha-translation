revisions:
- from: Você se fartou de vergonha em vez de glória. Beba também você e mostre a sua incircuncisão! O cálice da mão direita do SENHOR chegará à sua vez, e a mais completa desonra cairá sobre a sua glória.
  to: Você se fartou de vergonha em vez de glória. Beba também você e mostre a sua incircuncisão! O cálice da mão direita do SENHOR virá sobre você, e vergonha extrema sobre a sua glória.
  rationale: A revisão substitui uma expressão idiomática imprecisa por «virá sobre você», que reproduz de modo claro o movimento do cálice em direção ao condenado. Também torna a desonra final mais concisa e poeticamente ligada à vergonha inicial, preservando a intensificação sem resolver a etimologia incerta de קִיקָלוֹן.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:13Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de reversão, o imperativo para beber, a incircuncisão, o cálice associado à mão direita do SENHOR e a desonra sobre a glória. Contudo, «chegará à sua vez» não traduz com precisão nem naturalidade o verbo תִּסּוֹב («virará/rodeará, chegando sobre você»).
  naturalness: O texto é em geral claro e de registro apropriado. «O cálice ... chegará à sua vez» soa pouco idiomático em português e enfraquece a imagem concreta de o cálice voltar-se contra o destinatário.
  terminology: «SENHOR» corresponde à convenção para o Tetragrama; «incircuncisão» deve ser mantido. «A mais completa desonra» comunica a intensificação de קִיקָלוֹן, mas «vergonha extrema» é mais direta e preserva a conexão lexical e poética com a vergonha inicial.
  issues:
  - severity: medium
    issue: «chegará à sua vez» para תִּסּוֹב עָלֶיךָ
    rationale: A expressão portuguesa é pouco natural e desloca a imagem de um cálice que se volta ou vem sobre o destinatário para uma formulação temporal abstrata. «Virá sobre você» preserva a direção expressa por עָלֶיךָ e é natural.
  - severity: low
    issue: «a mais completa desonra» para קִיקָלוֹן
    rationale: É possível, mas a formulação superlativa é algo perifrástica. «Vergonha extrema» mantém a força intensiva do termo raro e cria a ligação literária com «vergonha» no início do versículo, sem alegar uma etimologia discutida.
  revised_text: Você se fartou de vergonha em vez de glória. Beba também você e mostre a sua incircuncisão! O cálice da mão direita do SENHOR virá sobre você, e vergonha extrema sobre a sua glória.
