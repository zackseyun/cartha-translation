  text: שָׂבַ֤עְתָּ קָלוֹן֙ מִ/כָּב֔וֹד שְׁתֵ֥ה גַם אַ֖תָּה וְ/הֵֽעָרֵ֑ל תִּסּ֣וֹב עָלֶ֗י/ךָ כּ֚וֹס יְמִ֣ין יְהוָ֔ה וְ/קִיקָל֖וֹן עַל כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/016.yaml
  text: You have had your fill of shame instead of glory. Drink, you also, and show your uncircumcision! The cup from the LORD’s right hand will come around to you, and utter disgrace will be upon your glory.
translation:
  language: pt
  text: Você se fartou de vergonha em vez de glória. Beba também você e mostre a sua incircuncisão! O cálice da mão direita do SENHOR virá sobre você, e vergonha extrema sobre a sua glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂבַעְתָּ קָלוֹן מִכָּבוֹד
  choice: Você se fartou de vergonha em vez de glória
  rationale: Mantém a imagem de saciedade expressa por שׂבע e entende a construção comparativa com מִן como contraste entre vergonha e glória, em conformidade com o contexto.
- source_word: וְהֵעָרֵל
  choice: e mostre a sua incircuncisão
  rationale: Reproduz a forma imperativa e a exposição pública da incircuncisão, sem substituir a imagem corporal e pactual do hebraico por uma explicação interpretativa.
- source_word: תִּסּוֹב עָלֶיךָ כּוֹס יְמִין יְהוָה
  choice: O cálice da mão direita do SENHOR chegará à sua vez
  rationale: Comunica o movimento circular ou a passagem do cálice até o destinatário. 'Da mão direita' preserva a relação hebraica, e o nome divino é representado pela convenção portuguesa 'SENHOR'.
- source_word: קִיקָלוֹן
  choice: a mais completa desonra
  rationale: O termo raro intensifica a ignomínia e possivelmente contém uma associação depreciativa com imundície ou vômito; a formulação escolhida preserva sua força sem impor uma etimologia incerta.
- source_word: עַל כְּבוֹדֶךָ
  choice: cairá sobre a sua glória
  rationale: Preserva a imagem de desonra vindo sobre a glória; o verbo 'cairá' é suprido naturalmente em português porque a oração hebraica é nominal.
theological_decisions:
- issue: O cálice como imagem do juízo divino
  choice: Manter a imagem concreta do cálice que chega à vez do opressor
  alternative: Explicitar no texto que se trata do castigo ou da ira de Deus
  rationale: O hebraico comunica o juízo por metáfora. Preservá-la mantém a força poética e evita acrescentar uma interpretação que o próprio versículo deixa implícita.
- issue: Incircuncisão como exposição vergonhosa
  choice: Conservar explicitamente 'incircuncisão'
  alternative: Substituir por 'nudez', 'vergonha' ou 'impureza'
  rationale: A referência pactual e corporal pertence ao texto e não deve ser apagada nem resolvida como simples nudez.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem enfática de 'também você' conserva a reversão dirigida ao opressor; 'chegará à sua vez' torna natural em português o movimento do cálice sem perder a ideia de retribuição.
