  source_fidelity: A tradução preserva adequadamente a denúncia profética de הוֹי, o alvo singular do particípio “aquele que diz”, os dois imperativos dirigidos ironicamente aos materiais do ídolo, a pergunta retórica לגבי capacidade de ensinar, o revestimento de ouro e prata e a ausência completa de sopro/vida no interior do ídolo. “Sopro algum” representa bem וְכָל רוּחַ אֵין בְּקִרְבּוֹ sem eliminar a amplitude semântica de רוּחַ.
