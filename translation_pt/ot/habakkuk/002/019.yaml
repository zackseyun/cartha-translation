id: HAB.2.19
reference: Habakkuk 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֣וֹי אֹמֵ֤ר לָ/עֵץ֙ הָקִ֔יצָ/ה ע֖וּרִי לְ/אֶ֣בֶן דּוּמָ֑ם ה֣וּא יוֹרֶ֔ה הִנֵּה ה֗וּא תָּפוּשׂ֙ זָהָ֣ב וָ/כֶ֔סֶף וְ/כָל ר֖וּחַ אֵ֥ין בְּ/קִרְבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/019.yaml
  text: Woe to the one who says to wood[a], “Wake up!” and to silent stone, “Arise!” Can it teach? Look— it is overlaid with gold and silver, yet there is no breath at all within it.
translation:
  language: pt
  text: 'Ai daquele que diz à madeira: “Acorde!” e à pedra silenciosa: “Levante-se!” Será que ela pode ensinar? Veja: ela está revestida de ouro e prata, mas não há nela sopro algum.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito”. A palavra hebraica também pode significar “vento”; aqui, ela enfatiza que o ídolo não tem vida em si.
    reason: Preserva a ambiguidade lexical de רוּחַ e explica seu sentido provável no contexto.
lexical_decisions:
- source_word: הוֹי
  choice: Ai
  rationale: Preserva a força de denúncia e juízo do oráculo profético em português natural.
- source_word: אֹמֵר
  choice: daquele que diz
  rationale: O particípio funciona como substantivo e caracteriza, no singular, a pessoa que fala ao ídolo.
- source_word: לָעֵץ
  choice: à madeira
  rationale: Refere-se ao material do ídolo, não necessariamente a uma árvore, e mantém o paralelo conciso com a pedra.
- source_word: הָקִיצָה
  choice: Acorde!
  rationale: Imperativo dirigido ironicamente a um objeto inanimado; é claro e corrente em português.
- source_word: עוּרִי
  choice: Levante-se!
  rationale: Mantém a variação poética em relação a “Acorde!” e a absurda expectativa de que a pedra aja como um ser vivo.
- source_word: לְאֶבֶן דּוּמָם
  choice: à pedra silenciosa
  rationale: דּוּמָם expressa silêncio ou mudez; “silenciosa” é natural e preserva a ironia.
- source_word: הוּא יוֹרֶה
  choice: Será que ela pode ensinar?
  rationale: Lê a frase como pergunta retórica, conforme o contexto de ridicularização do ídolo, sem atribuir-lhe capacidade real de instruir.
- source_word: הִנֵּה
  choice: 'Veja:'
  rationale: Chama a atenção do leitor para a condição visível do ídolo em linguagem moderna e digna.
- source_word: תָּפוּשׂ זָהָב וָכֶסֶף
  choice: ela está revestida de ouro e prata
  rationale: Expressa que o ídolo foi coberto ou recoberto com metais preciosos.
- source_word: וְכָל רוּחַ אֵין בְּקִרְבּוֹ
  choice: mas não há nela sopro algum
  rationale: “Sopro” comunica a ausência total de vida, enquanto “algum” preserva a ênfase de כָל; a conjunção adversativa torna explícito o contraste contextual.
theological_decisions:
- issue: Sentido de רוּחַ na frase final
  choice: sopro
  alternative: espírito
  rationale: No contexto da polêmica contra os ídolos, o foco é a falta de vida do objeto. “Sopro” comunica isso sem impor uma afirmação metafísica, enquanto a nota preserva a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação mantém tom profético e solene sem arcaísmos; os imperativos distintos preservam o paralelismo poético e a ironia do hebraico.
