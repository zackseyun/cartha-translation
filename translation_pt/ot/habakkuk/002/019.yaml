  terminology: “Madeira” e “pedra” comunicam corretamente os materiais empregados no ídolo. “Revestida” é apropriado para o objeto coberto de ouro e prata. A opção “sopro” evita introduzir uma leitura metafísica indevida, e a nota registra de forma suficiente a alternativa “espírito” e o sentido lexical “vento”.
