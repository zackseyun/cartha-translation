id: HAB.2.5
reference: Habakkuk 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַף֙ כִּֽי הַ/יַּ֣יִן בּוֹגֵ֔ד גֶּ֥בֶר יָהִ֖יר וְ/לֹ֣א יִנְוֶ֑ה אֲשֶׁר֩ הִרְחִ֨יב כִּ/שְׁא֜וֹל נַפְשׁ֗/וֹ וְ/ה֤וּא כַ/מָּ֨וֶת֙ וְ/לֹ֣א יִשְׂבָּ֔ע וַ/יֶּאֱסֹ֤ף אֵלָי/ו֙ כָּל הַ/גּוֹיִ֔ם וַ/יִּקְבֹּ֥ץ אֵלָ֖י/ו כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/005.yaml
  text: Moreover[a], wine betrays; an arrogant man does not remain at rest. He enlarges his appetite like Sheol, and he is like death and is never satisfied[c][b]. He gathers to himself all the nations and collects to himself all the peoples.
translation:
  language: pt
  text: Além disso[a], o vinho é traiçoeiro; o homem arrogante não sossega[b]. Ele alarga seu apetite como o Sheol[c]; é como a morte e nunca se satisfaz. Ajunta para si todas as nações e reúne para si todos os povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “De fato”. O hebraico é conciso e um tanto difícil; a frase também pode ser entendida como “o vinho engana”, e alguns relacionam toda a linha de modo mais amplo à arrogância embriagada do conquistador.
    reason: lexical_alternative
  - marker: b
    text: Ou “não permanece”, “não descansa” ou “não fica em casa”. O verbo hebraico é difícil; o texto principal expressa a inquietação sugerida pelo contexto.
    reason: lexical_alternative
  - marker: c
    text: Sheol é o domínio dos mortos; alternativamente, “a sepultura” ou “o mundo dos mortos”.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַף כִּי
  choice: Além disso
  rationale: A expressão funciona aqui como transição enfática e aditiva, introduzindo mais uma acusação; “Além disso” transmite esse valor sem impor uma relação causal.
- source_word: הַיַּיִן בּוֹגֵד
  choice: o vinho é traiçoeiro
  rationale: Mantém o substantivo explícito “vinho” e a personificação do particípio, que descreve ação pérfida, infiel ou enganadora.
- source_word: גֶּבֶר יָהִיר
  choice: o homem arrogante
  rationale: גֶּבֶר designa aqui o indivíduo em foco, enquanto יָהִיר expressa orgulho insolente; a formulação é natural e preserva o tom moral.
- source_word: וְלֹא יִנְוֶה
  choice: não sossega
  rationale: O verbo é difícil e pode envolver permanecer, habitar ou descansar. “Não sossega” comunica a inquietação aquisitiva do contexto sem restringir o sentido a não ficar em casa.
- source_word: הִרְחִיב ... נַפְשׁוֹ
  choice: alarga seu apetite
  rationale: O hifil de רחב significa alargar, e נֶפֶשׁ, neste contexto de desejo insaciável, refere-se à voracidade da pessoa. “Apetite” torna a imagem inteligível sem eliminar a metáfora.
- source_word: כִּשְׁאוֹל
  choice: como o Sheol
  rationale: Preserva o termo hebraico para o domínio dos mortos e sua imagem de voracidade insaciável, em vez de reduzi-lo apenas à sepultura física.
- source_word: וְהוּא כַמָּוֶת וְלֹא יִשְׂבָּע
  choice: é como a morte e nunca se satisfaz
  rationale: Conserva a comparação direta com a morte e expressa como condição contínua a insaciabilidade indicada pelo imperfeito.
- source_word: וַיֶּאֱסֹף ... וַיִּקְבֹּץ
  choice: Ajunta ... e reúne
  rationale: Os dois verbos próximos em sentido são traduzidos por verbos distintos, preservando o paralelismo e a ideia de acumulação de povos conquistados.
theological_decisions:
- issue: Sentido de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: O termo evoca o domínio dos mortos na linguagem israelita e, aqui, sua insaciabilidade. Mantê-lo transliterado preserva a imagem da fonte e evita limitá-la a um túmulo.
- issue: Relação entre o vinho e o homem arrogante
  choice: Manter duas afirmações justapostas
  alternative: Entender toda a linha como descrição da arrogância intoxicada do conquistador
  rationale: O hebraico é conciso e sintaticamente difícil. A tradução conserva o vinho como sujeito explícito da primeira afirmação e não resolve de modo definitivo como ela se liga ao homem arrogante.
translation_notes:
  register: Português contemporâneo, digno e amplamente inteligível, com boa legibilidade brasileira. “Não sossega” comunica de forma natural a instabilidade do personagem; “Sheol” é mantido como termo cultural e explicado em nota. O paralelismo final é preservado sem linguagem excessivamente arcaica.
