review_pass:
  verdict: revise
  source_fidelity: A tradução comunica adequadamente o oráculo de condenação, a acumulação do que não lhe pertence, a pergunta intercalada e a imagem final de fardo. Contudo, «com zombarias e enigmas» torna plurais e relativamente soltos os elementos hebraicos que funcionam como uma formulação de escárnio/enigma; uma redação mais próxima preserva melhor a relação entre eles. «Bens dados em garantia» também pode sugerir que o próprio opressor ofereceu os bens; no contexto, «bens tomados em garantia» representa mais precisamente a leitura econômica adotada.
  naturalness: «Não entoarão todos eles contra ele...» é uma pergunta retórica natural e solene em português. «Um dito de escárnio, cheio de enigmas» é claro, mantém o registro profético e evita a formulação um tanto abstrata «uma sátira, com zombarias e enigmas».
  terminology: «Ai» é apropriado para הוֹי. «Dito de escárnio» traduz de modo acessível a função zombeteira de מָשָׁל/מְלִיצָה sem restringi-la ao gênero moderno «sátira». «Enigmas» preserva חִידוֹת. «Bens tomados em garantia» mantém a opção lexical econômica para עַבְטִיט, enquanto a nota conserva a alternativa tradicional.
  issues:
  - severity: medium
    issue: A expressão «com zombarias e enigmas» não representa com precisão a construção hebraica e altera os substantivos para o plural.
    rationale: O texto apresenta um dito/expressão de escárnio associado a enigmas a respeito dele. A revisão preserva essa relação sem forçar uma identificação técnica do gênero literário.
  - severity: low
    issue: «Bens dados em garantia» é semanticamente ambíguo quanto a quem dá os bens.
    rationale: No contexto da denúncia contra quem acumula injustamente, «bens tomados em garantia» comunica melhor a leitura econômica adotada para o termo raro, sem eliminar a alternativa na nota.
