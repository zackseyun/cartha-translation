base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/006.yaml
  text: Will not all of these take up a taunt against him[a], with mockery and riddles about him, and say, “Woe to him who heaps up what is not his—how long?—and loads himself with pledged goods!”
translation:
  language: pt
  text: 'Não entoarão todos eles contra ele um dito de escárnio, cheio de enigmas a respeito dele, dizendo: “Ai daquele que acumula o que não é seu — até quando? — e se carrega de bens tomados em garantia![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e põe sobre si uma carga de barro espesso”. O termo hebraico é raro e pode conter um jogo de palavras entre bens tomados em garantia por uma dívida e uma massa pesada que sobrecarrega quem a acumula.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָשָׁל
  choice: sátira
  rationale: Neste contexto profético de juízo, o termo designa um dito figurado e mordaz dirigido contra o opressor. “Sátira” preserva tanto o caráter formal do dito quanto sua função de escárnio.
- source_word: יִשָּׂאוּ
  choice: levantarão
  rationale: Reproduz o idioma hebraico de levantar ou entoar um dito contra alguém, com formulação natural em português.
- source_word: מְלִיצָה
  choice: zombarias
  rationale: No paralelismo com מָשָׁל e חִידוֹת, comunica o tom de escárnio dos ditos dirigidos ao opressor.
- source_word: חִידוֹת
  choice: enigmas
  rationale: Mantém o caráter penetrante, figurado e potencialmente ambíguo dos ditos.
- source_word: הוֹי
  choice: Ai
  rationale: É a interjeição profética tradicional e natural em português, capaz de expressar simultaneamente lamento e condenação.
- source_word: הַמַּרְבֶּה לֹּא לוֹ
  choice: daquele que acumula o que não é seu
  rationale: Expressa com clareza a acumulação injusta indicada pelo particípio de רבה, preservando a acusação moral do hebraico.
- source_word: עַד מָתַי
  choice: até quando?
  rationale: Preserva a pergunta abrupta de protesto e impaciência no meio da declaração de condenação.
- source_word: וּמַכְבִּיד עָלָיו
  choice: e se sobrecarrega
  rationale: Conserva a imagem de tornar pesado sobre si mesmo aquilo que foi acumulado e soa idiomático em português.
- source_word: עַבְטִיט
  choice: bens dados em garantia
  rationale: O substantivo raro é entendido no contexto como bens empenhados ou tomados em garantia, coerentemente com a denúncia da exploração econômica. A leitura tradicional alternativa é preservada em nota.
theological_decisions:
- issue: Interpretação do termo raro עַבְטִיט
  choice: 'imagem econômica: “bens dados em garantia”'
  alternative: “barro espesso” ou “lama pesada”
  rationale: A leitura econômica se ajusta à denúncia contextual da acumulação exploradora e à provável associação do termo com penhores e dívidas. Como a leitura concreta ligada a barro tem antiga tradição e talvez reflita um jogo de palavras com o peso daquilo que se acumula, ela é mantida em nota sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção retórica e a pergunta intercalada preservam a força do oráculo; a nota mantém a genuína incerteza lexical do termo final.
