  text: הֲ/ל֣וֹא הִנֵּ֔ה מֵ/אֵ֖ת יְהוָ֣ה צְבָא֑וֹת וְ/יִֽיגְע֤וּ עַמִּים֙ בְּ/דֵי אֵ֔שׁ וּ/לְאֻמִּ֖ים בְּ/דֵי רִ֥יק יִעָֽפוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/013.yaml
  text: Is it not indeed from Yahweh of hosts that peoples labor for fire[b][a], and nations weary themselves for emptiness?
translation:
  language: pt
  text: Não é, de fato, da parte de Yahweh dos Exércitos que os povos trabalhem para o fogo[a] e as nações se cansem em vão[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para ser consumido pelo fogo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por nada” ou “pelo vazio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא הִנֵּה
  choice: Não vem, de fato, ...?
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e transmite a ênfase de הִנֵּה em português natural.
- source_word: מֵאֵת
  choice: vem de
  rationale: Expressa origem ou procedência e permite uma formulação idiomática da pergunta em português.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh dos Exércitos
  rationale: Mantém o nome divino e traduz צְבָאוֹת por um título tradicional, claro e abrangente.
- source_word: וְיִיגְעוּ עַמִּים
  choice: que os povos trabalhem
  rationale: Comunica esforço laborioso e conserva 'povos' em distinção paralela de 'nações'.
- source_word: בְּדֵי אֵשׁ
  choice: para o fogo
  rationale: Preserva a imagem concisa do trabalho destinado a ser consumido pelo fogo, sem explicitar no texto uma interpretação além do hebraico.
- source_word: וּלְאֻמִּים
  choice: e as nações
  rationale: Mantém o paralelismo e a distinção lexical em relação a עַמִּים, traduzido por 'povos'.
- source_word: בְּדֵי רִיק
  choice: por nada
  rationale: Expressa de modo natural a inutilidade e o vazio do esforço; 'em vão' seria possível, mas menos próximo da imagem nominal רִיק.
- source_word: יִעָפוּ
  choice: se cansem
  rationale: 'Transmite o resultado reflexivo do esforço: as nações levam a si mesmas ao cansaço.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Força causal de מֵאֵת
  choice: A realidade e o desfecho descritos vêm de Yahweh dos Exércitos
  alternative: Yahweh apenas toma conhecimento desse trabalho inútil
  rationale: מֵאֵת indica fonte ou procedência. A tradução mantém a atribuição do desfecho ao governo divino sem dizer que Deus seja o autor moral da maldade dos povos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para uma pergunta retórica natural, preservando o paralelismo entre 'povos' e 'nações' e entre 'fogo' e 'nada'.
