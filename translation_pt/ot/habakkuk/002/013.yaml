  naturalness: «Não vem, de fato, ... que os povos trabalhem» é compreensível, mas é uma construção pouco natural e deixa indefinido o sujeito de «vem». «Não é, de fato, da parte de...» reproduz de modo mais idiomático a pergunta retórica hebraica. «Se cansem em vão» é mais fluente que «se cansem por nada», sem perder a ideia de esforço que termina em inutilidade.
  terminology: «Yahweh dos Exércitos» é uma tradução adequada e consistente do nome e do título. «Povos» e «nações» preservam a distinção e o paralelismo dos termos hebraicos.
