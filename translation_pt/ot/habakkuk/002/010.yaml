  text: יָעַ֥צְתָּ בֹּ֖שֶׁת לְ/בֵיתֶ֑/ךָ קְצוֹת עַמִּ֥ים רַבִּ֖ים וְ/חוֹטֵ֥א נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/010.yaml
  text: You have devised shame for your house by cutting off many peoples[a], and have sinned against your own life.
translation:
  language: pt
  text: Você planejou vergonha para sua casa, eliminando muitos povos, e pecou contra sua própria vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra sua própria alma” ou “contra si mesmo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָעַצְתָּ
  choice: você planejou
  rationale: O qal perfeito de יעץ indica aqui a elaboração intencional de um plano. “Planejou” é natural em português e mantém a responsabilidade deliberada do acusado.
- source_word: בֹּשֶׁת
  choice: vergonha
  rationale: Expressa tanto desonra pública quanto reprovação moral, preservando a concisão do hebraico.
- source_word: לְבֵיתֶךָ
  choice: para a sua casa
  rationale: “Casa” conserva a amplitude de בַּיִת, que pode abranger residência, família ou dinastia, sem decidir indevidamente entre essas possibilidades.
- source_word: קְצוֹת
  choice: exterminando
  rationale: No contexto, a forma transmite a eliminação ou destruição de povos. O gerúndio exprime naturalmente o meio pelo qual o plano trouxe vergonha à casa.
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: “Povos” preserva o plural coletivo e evita as conotações modernas de Estados nacionais que “nações” pode sugerir.
- source_word: וְחוֹטֵא
  choice: e pecou
  rationale: O particípio ligado à oração anterior funciona verbalmente na sequência acusatória; o pretérito perfeito produz uma formulação portuguesa clara e coerente.
- source_word: נַפְשֶׁךָ
  choice: a sua própria vida
  rationale: נֶפֶשׁ pode designar vida, pessoa ou ser. Neste contexto de juízo, “a sua própria vida” comunica a consequência autodestrutiva sem impor uma antropologia dualista posterior.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto do juízo profético
  choice: vida
  alternative: alma; si mesmo
  rationale: “Vida” expressa concretamente que a violência do opressor se volta contra ele próprio. “Alma” e “si mesmo” continuam lexicalmente possíveis e são registradas em nota para preservar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o tom direto da acusação profética; “casa” e a nota sobre נֶפֶשׁ preservam a amplitude semântica do hebraico.
