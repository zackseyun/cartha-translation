id: HAB.2.8
reference: Habakkuk 2:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה שַׁלּ֨וֹתָ֙ גּוֹיִ֣ם רַבִּ֔ים יְשָׁלּ֖וּ/ךָ כָּל יֶ֣תֶר עַמִּ֑ים מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/008.yaml
  text: Because you have plundered many nations[a], all the remnant of the peoples will plunder you—because of human blood and violence done to the land, to the city, and to all who dwell in it.
translation:
  language: pt
  text: Porque você saqueou muitas nações, todos os povos restantes saquearão você, por causa do sangue humano[a] e da violência contra a terra, a cidade e todos os que nela habitam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derramamento de sangue humano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלּוֹתָ / יְשָׁלּוּךָ
  choice: saqueou / saquearão você
  rationale: “Saquear” expressa a tomada violenta de bens e preserva, nas duas ocorrências, a reversão do saqueador que será saqueado.
- source_word: גּוֹיִם רַבִּים
  choice: muitas nações
  rationale: “Nações” corresponde ao sentido internacional e político de גּוֹיִם neste contexto imperial.
- source_word: כָּל יֶתֶר עַמִּים
  choice: todos os povos restantes
  rationale: Formulação natural que mantém o sentido de povos que restam e preserva a mudança lexical de “nações” para “povos”.
- source_word: מִדְּמֵי אָדָם
  choice: por causa do sangue humano
  rationale: A preposição tem valor causal, e “sangue humano” preserva de modo claro e atual a expressão coletiva hebraica, sem restringi-la ao sexo masculino.
- source_word: וַחֲמַס
  choice: e da violência contra
  rationale: “Violência” representa o dano cruel e injusto de חָמָס; “contra” explicita naturalmente em português a relação com os objetos seguintes.
- source_word: אֶרֶץ
  choice: a terra
  rationale: “Terra” designa naturalmente o território devastado, sem necessariamente ampliar a referência ao planeta inteiro.
- source_word: קִרְיָה
  choice: a cidade
  rationale: “Cidade” é o equivalente corrente e adequado para o assentamento urbano indicado por קִרְיָה.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: e todos os que nela habitam
  rationale: Mantém a força verbal do particípio e a referência pronominal do hebraico em português digno e compreensível.
theological_decisions:
- issue: Sentido genérico de אָדָם na expressão דְּמֵי אָדָם
  choice: sangue humano
  alternative: sangue do homem
  rationale: אָדָם é coletivo e se refere a seres humanos em geral, não especificamente a homens; “humano” comunica esse alcance com precisão no português atual.
- issue: Valor da expressão plural דְּמֵי אָדָם
  choice: sangue humano
  alternative: derramamento de sangue humano
  rationale: O texto principal preserva a imagem concreta do sangue, enquanto a nota registra o sentido idiomático possível de sangue derramado.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “saquear” preserva a retaliação poética do hebraico; “nações” e “povos” mantêm a variação lexical do original. O pronome “nela” conserva a referência feminina e a possível ambiguidade da construção hebraica.
