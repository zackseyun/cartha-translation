  text: ה֚וֹי מַשְׁקֵ֣ה רֵעֵ֔/הוּ מְסַפֵּ֥חַ חֲמָתְ/ךָ֖ וְ/אַ֣ף שַׁכֵּ֑ר לְמַ֥עַן הַבִּ֖יט עַל מְעוֹרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/015.yaml
  text: Woe to him who makes his neighbor drink[a], pouring out your wrath and even making him drunk[c][b], in order to look on their nakedness.
translation:
  language: pt
  text: Ai daquele que faz seu próximo beber, derramando a tua ira[a] e até o embriagando[b], para contemplar a nudez deles[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derramando o teu veneno”. O hebraico é difícil; o termo traduzido por “ira” também pode transmitir a ideia de ardor ou veneno. Alguns entendem a expressão de outra forma, como “acrescentando a tua garrafa”, ou regularizam o possessivo como “a ira dele”.'
    reason: Alternativa lexical e leitura textual difícil; a nota também explica a mudança de pessoa preservada no texto.
  - marker: b
    text: Isto é, fazendo-o ficar bêbado.
    reason: Esclarecimento do sentido causativo do verbo hebraico.
  - marker: c
    text: 'Ou: “suas partes íntimas”. O hebraico traz literalmente “a nudez deles”, com sufixo plural apesar do antecedente singular imediato.'
    reason: Alternativa lexical e preservação da discordância de número no texto hebraico.
lexical_decisions:
- source_word: הוֹי
  choice: Ai daquele
  rationale: Introduz de modo natural e solene um oráculo profético de condenação.
- source_word: מַשְׁקֵה
  choice: que faz ... beber
  rationale: O particípio hifil de שׁקה expressa causação e, neste contexto, sugere coerção.
- source_word: רֵעֵהוּ
  choice: seu próximo
  rationale: רֵעַ pode designar o próximo, companheiro ou semelhante; “próximo” preserva a dimensão ética da violação.
- source_word: מְסַפֵּחַ
  choice: derramando
  rationale: A forma é difícil, mas no contexto pode descrever a adição ou o derramamento de algo à bebida; a opção mantém a imagem concreta sem eliminar a incerteza, registrada em nota.
- source_word: חֲמָתְךָ
  choice: a sua ira
  rationale: חֵמָה normalmente significa ira, furor ou ardor, embora possa também evocar veneno. O possessivo preserva a mudança para a segunda pessoa presente no texto massorético.
- source_word: וְאַף שַׁכֵּר
  choice: e até o embriagando
  rationale: וְאַף intensifica a ação seguinte, e שׁכר indica causar embriaguez; a formulação comunica a escalada do abuso.
- source_word: לְמַעַן הַבִּיט
  choice: para contemplar
  rationale: A construção expressa propósito deliberado; “contemplar” conserva a ideia de olhar atentamente sem acrescentar detalhes ausentes do hebraico.
- source_word: מְעוֹרֵיהֶם
  choice: a nudez dele
  rationale: O termo se refere à nudez exposta, possivelmente às partes íntimas. O hebraico apresenta sufixo plural, mas o referente imediato singular favorece em português uma concordância idiomática no singular, com a dificuldade indicada em nota.
theological_decisions:
- issue: Mudança de pessoa em חֲמָתְךָ dentro de uma denúncia inicialmente em terceira pessoa
  choice: Preservar a mudança com “a sua ira”
  alternative: Regularizar como “a ira dele” ou entender a expressão como referência à sua garrafa
  rationale: O texto massorético contém uma mudança retórica marcante para a segunda pessoa. A tradução não a corrige silenciosamente; as leituras que suavizam a construção ficam registradas em nota.
- issue: Imagem de exposição sexual e humilhação
  choice: Traduzir como “contemplar a nudez dele”
  alternative: “olhar para suas partes íntimas” ou “contemplar sua vergonha”
  rationale: A formulação preserva a denúncia da embriaguez usada para expor e observar a vítima, sem tornar a linguagem mais anatômica nem mais interpretativa que o original.
- issue: Discordância entre o vizinho singular e o sufixo plural de מְעוֹרֵיהֶם
  choice: Usar o singular idiomático no texto e registrar o plural hebraico em nota
  alternative: Manter “a nudez deles”
  rationale: Em português, “dele” liga claramente a nudez ao próximo embriagado; a forma plural do hebraico, porém, é genuína e não deve ser ocultada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem da frase acompanha o movimento do hebraico, e as notas preservam suas dificuldades lexicais, a mudança de pessoa e a discordância de número.
