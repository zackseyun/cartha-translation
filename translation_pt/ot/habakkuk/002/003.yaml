base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/003.yaml
  text: For the vision is still for the appointed time[a]; it hastens toward the end and will not lie. If it delays, wait for it, for it will surely come[b]; it will not be late.
translation:
  language: pt
  text: Pois a visão ainda se cumprirá no tempo determinado; ela se apressa para o fim[a] e não mentirá. Se demorar, espere por ela[b], pois certamente virá; não chegará tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico é difícil. Também pode ser traduzido como “ofega em direção ao fim” ou “fala do fim”. A tradução no texto expressa o movimento urgente da visão rumo ao seu cumprimento.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “espere por ele”. O pronome hebraico pode ser entendido de modo pessoal, embora, neste contexto, se refira mais naturalmente à “visão”. Hebreus 10:37 aplica a frase de modo pessoal.'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוֹן
  choice: visão
  rationale: É o termo usual para uma revelação profética recebida em visão e retoma naturalmente aquilo que Habacuque deve registrar por escrito.
- source_word: לַמּוֹעֵד
  choice: para o tempo determinado
  rationale: מוֹעֵד indica um tempo fixado ou designado. A formulação conserva a ideia de que a visão tem um momento definido para seu cumprimento.
- source_word: וְיָפֵחַ
  choice: ela avança rapidamente
  rationale: O verbo é difícil e pode sugerir ofegar, avançar com urgência ou, segundo outra análise, falar. A opção adotada expressa movimento urgente rumo ao cumprimento sem ocultar as alternativas, registradas em nota.
- source_word: לַקֵּץ
  choice: para o fim
  rationale: קֵץ designa aqui o ponto final ou o momento de cumprimento da visão. A preposição direcional combina com o movimento expresso na oração.
- source_word: וְלֹא יְכַזֵּב
  choice: e não mentirá
  rationale: O verbo significa mentir ou mostrar-se falso. A tradução direta mantém a personificação da visão presente no hebraico.
- source_word: אִם יִתְמַהְמָהּ
  choice: Se demorar
  rationale: O verbo denota tardar ou demorar. A formulação é concisa e natural em português.
- source_word: חַכֵּה לוֹ
  choice: espere por ela
  rationale: Embora o sufixo hebraico seja masculino singular, seu antecedente contextual mais próximo é חָזוֹן, também masculino em hebraico. Em português, a concordância natural com “visão” exige “ela”.
- source_word: כִּי בֹא יָבֹא
  choice: pois certamente virá
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a certeza da vinda. “Certamente virá” reproduz essa ênfase de modo idiomático.
- source_word: לֹא יְאַחֵר
  choice: não chegará tarde
  rationale: O verbo exprime atraso. Esta escolha mantém a distinção estilística em relação a “demorar” e comunica que o cumprimento ocorrerá no tempo fixado.
theological_decisions:
- issue: Referente dos pronomes na segunda metade do versículo
  choice: 'Os pronomes se referem, em primeiro plano, à visão e ao seu cumprimento: “ela”.'
  alternative: 'A frase pode ser entendida pessoalmente: “espere por ele”, leitura refletida em versões antigas e na aplicação de Hebreus 10:37.'
  rationale: No contexto hebraico, o antecedente mais próximo é חָזוֹן (“visão”), substantivo masculino singular; por isso o sufixo masculino não exige um referente pessoal. Em português, “ela” concorda naturalmente com “visão”. A leitura pessoal é relevante para a história da recepção, mas não deve ser introduzida silenciosamente no texto principal de Habacuque.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. Conserva-se a personificação da visão (“avança”, “não mentirá”, “virá”) e a tensão entre a aparente demora e a certeza de que ela não chegará tarde.
