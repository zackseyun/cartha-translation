  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל מִשְׁמַרְתִּ֣/י אֶעֱמֹ֔דָה וְ/אֶֽתְיַצְּבָ֖ה עַל מָצ֑וֹר וַ/אֲצַפֶּ֗ה לִ/רְאוֹת֙ מַה יְדַבֶּר בִּ֔/י וּ/מָ֥ה אָשִׁ֖יב עַל תּוֹכַחְתִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/001.yaml
  text: I will stand at my guard post and station myself on the rampart[a]; I will keep watch to see what he will speak in me[b], and what I should answer concerning my complaint.
translation:
  language: pt
  text: Ficarei de pé no meu posto de guarda e me posicionarei sobre a muralha; ficarei atento para ver o que ele falará em mim[a] e o que responderei a respeito da minha queixa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que ele me falará”. O hebraico diz literalmente “em mim” e pode referir-se à comunicação profética interior.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “a respeito da minha repreensão” ou “a respeito do meu argumento (ou da minha causa)”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמַרְתִּי
  choice: meu posto de guarda
  rationale: O substantivo pode indicar tanto a função de vigiar quanto o lugar onde se monta guarda. “Posto de guarda” preserva a imagem concreta do sentinela e soa natural em português.
- source_word: אֶעֱמֹדָה
  choice: Ficarei de pé
  rationale: A forma verbal expressa aqui a decisão do profeta de permanecer em seu lugar à espera da resposta.
- source_word: וְאֶתְיַצְּבָה
  choice: e me posicionarei
  rationale: O hitpael comunica a ação deliberada de tomar posição; a forma reflexiva portuguesa conserva essa nuance.
- source_word: מָצוֹר
  choice: a muralha
  rationale: Embora o termo também possa significar fortificação ou obra de cerco, neste contexto designa naturalmente uma posição defensiva elevada usada como ponto de observação.
- source_word: וַאֲצַפֶּה
  choice: ficarei atento
  rationale: O verbo descreve observação vigilante e expectante. “Ficarei atento” comunica essa espera continuada sem tornar a frase artificial.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: 'O infinitivo indica a finalidade da vigilância do profeta: perceber a resposta que virá.'
- source_word: מַה יְדַבֶּר בִּי
  choice: o que ele falará em mim
  rationale: A tradução conserva a preposição hebraica בְּ em sua forma mais direta e mantém aberta a possibilidade de fala profética interior. A leitura idiomática “a mim” é registrada em nota.
- source_word: אָשִׁיב
  choice: o que responderei
  rationale: O hifil de שוב pode indicar dar ou trazer uma resposta. O futuro português expressa a resposta que o profeta formulará depois de ouvir.
- source_word: עַל תּוֹכַחְתִּי
  choice: a respeito da minha queixa
  rationale: No contexto da contestação anterior de Habacuque, “queixa” comunica com clareza o protesto do profeta, enquanto a nota preserva os sentidos possíveis de repreensão e argumentação.
theological_decisions:
- issue: Sentido de בִּי na expressão מַה יְדַבֶּר בִּי
  choice: fala no interior do profeta (“em mim”)
  alternative: fala dirigida ao profeta (“a mim”)
  rationale: A preposição hebraica significa literalmente “em”, o que pode apontar para comunicação profética interior; no entanto, o contexto também permite entendê-la idiomaticamente como fala dirigida ao profeta. O texto principal conserva a construção formal e a nota mantém a alternativa contextual.
- issue: Sentido de תּוֹכַחְתִּי
  choice: a queixa ou contestação do profeta
  alternative: minha repreensão ou meu argumento/minha causa
  rationale: O contexto imediato apresenta o protesto de Habacuque e sua espera por uma resposta. “Queixa” torna essa relação discursiva clara sem eliminar em nota as nuances confrontadoras ou forenses do termo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A imagem do sentinela foi preservada, assim como a ambiguidade da fala divina “em mim/a mim” e a amplitude semântica da queixa, repreensão ou causa.
