id: HAB.2.17
reference: Habakkuk 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י חֲמַ֤ס לְבָנוֹן֙ יְכַסֶּ֔/ךָּ וְ/שֹׁ֥ד בְּהֵמ֖וֹת יְחִיתַ֑/ן מִ/דְּמֵ֤י אָדָם֙ וַ/חֲמַס אֶ֔רֶץ קִרְיָ֖ה וְ/כָל יֹ֥שְׁבֵי בָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/017.yaml
  text: For the violence done to Lebanon will cover you[a], and the destruction of beasts will terrify you, because of the blood of man and the violence done to the land, to the city[b], and to all who dwell in it.
translation:
  language: pt
  text: Pois a violência cometida contra o Líbano cobrirá você, e a destruição dos animais os aterrorizará[a], por causa do sangue humano[b] e da violência cometida contra a terra, contra a cidade e contra todos os seus habitantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os aterrorizará”. A referência mais próxima é aos animais; algumas traduções entendem “aterrorizará você”, em paralelo com a frase anterior.'
    reason: textual_ambiguity
  - marker: b
    text: Literalmente, “o sangue do homem”; o singular hebraico tem sentido representativo e se refere ao derramamento de sangue humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַס לְבָנוֹן
  choice: a violência cometida contra o Líbano
  rationale: חָמָס expressa violência ou grave injustiça; a formulação explicita naturalmente em português que o Líbano é o alvo da violência.
- source_word: יְכַסֶּךָּ
  choice: cobrirá você
  rationale: Preserva a imagem concreta de כסה, aplicada metaforicamente às consequências que alcançarão o destinatário.
- source_word: שֹׁד בְּהֵמוֹת
  choice: a destruição dos animais
  rationale: שֹׁד indica devastação ou destruição violenta, e בְּהֵמוֹת refere-se aqui aos animais em sentido amplo, sem restringir a animais domésticos.
- source_word: יְחִיתַן
  choice: os aterrorizará
  rationale: A forma consonantal massorética traz sufixo de terceira pessoa plural, naturalmente retomado por “animais”. Embora a construção seja difícil no contexto, a tradução preserva essa dificuldade em vez de substituir silenciosamente o objeto por “você”.
- source_word: מִדְּמֵי אָדָם
  choice: por causa do sangue humano
  rationale: מִן tem valor causal, e דְּמֵי אָדָם refere-se ao sangue derramado de seres humanos. “Sangue humano” conserva a imagem hebraica e comunica em português o valor representativo de אָדָם.
- source_word: וַחֲמַס אֶרֶץ
  choice: e da violência cometida contra a terra
  rationale: A repetição de חָמָס é mantida, e a terra é entendida como alvo da violência, em paralelo com o Líbano.
- source_word: קִרְיָה
  choice: contra a cidade
  rationale: O singular definido é natural à luz do contexto imediato e conserva a referência simples do hebraico.
- source_word: וְכָל יֹשְׁבֵי בָהּ
  choice: e contra todos os seus habitantes
  rationale: Expressa de modo atual e claro a locução participial “todos os que habitam nela”, sem perda de sentido.
theological_decisions:
- issue: Sentido representativo de אָדָם
  choice: sangue humano
  alternative: sangue do homem
  rationale: O singular אָדָם funciona representativamente. “Humano” mantém a referência à humanidade sem sugerir que apenas um indivíduo masculino esteja em vista.
- issue: Objeto de יְחִיתַן
  choice: os aterrorizará
  alternative: aterrorizará você
  rationale: A leitura com “os” segue o sufixo plural do texto massorético e mantém sua tensão sintática. A alternativa harmoniza a frase com o destinatário singular anterior, mas exige interpretar de outra maneira a forma transmitida.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. Mantiveram-se a repetição de “violência” e a metáfora de ser “coberto”, bem como a dificuldade real do objeto plural em יְחִיתַן.
