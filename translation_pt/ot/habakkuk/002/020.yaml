id: HAB.2.20
reference: Habakkuk 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָ֖ה בְּ/הֵיכַ֣ל קָדְשׁ֑/וֹ הַ֥ס מִ/פָּנָ֖י/ו כָּל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/020.yaml
  text: But Yahweh is in his holy temple[c][b][a]; let all the earth be silent before him.
translation:
  language: pt
  text: Mas Yahweh está em seu santo templo; cale-se diante dele toda a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o país” ou “toda a região”; o hebraico também pode ter esse sentido mais restrito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Mas Yahweh
  rationale: A conjunção וַ recebe valor adversativo no contexto, contrastando Yahweh com os ídolos sem vida do versículo anterior; o nome divino é transliterado como “Yahweh”.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: está em seu santo templo
  rationale: הֵיכָל pode indicar templo, palácio ou santuário. “Santo templo” preserva aqui a linguagem cultual e a possível tensão entre o templo terrestre e a morada celestial, sem especificar uma delas.
- source_word: הַס
  choice: cale-se
  rationale: A interjeição funciona como uma ordem solene de silêncio. “Cale-se” comunica em português atual a força imperativa e reverente do hebraico.
- source_word: מִפָּנָיו
  choice: diante dele
  rationale: Esta expressão idiomática, literalmente relacionada à face ou presença, é traduzida naturalmente por “diante dele”, mantendo a ideia de estar em sua presença.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: אֶרֶץ pode significar “terra” ou “país”; neste clímax, “toda a terra” expressa adequadamente o alcance universal, enquanto a nota registra a possibilidade contextual mais estreita.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Local indicado por הֵיכָל
  choice: templo
  alternative: palácio; santuário
  rationale: “Templo” preserva a dimensão sagrada e régia do termo sem decidir se a referência é exclusivamente ao templo terrestre ou à morada celestial.
- issue: Alcance de כָּל הָאָרֶץ
  choice: toda a terra
  alternative: todo o país; toda a região
  rationale: O contexto permite a leitura universal, especialmente como convocação climática diante de Yahweh, mas a polissemia de אֶרֶץ é mantida em nota.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A inversão “cale-se diante dele toda a terra” mantém o tom profético e dá destaque à ordem universal sem soar excessivamente arcaica.
