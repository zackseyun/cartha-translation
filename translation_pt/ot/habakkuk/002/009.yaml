  text: ה֗וֹי בֹּצֵ֛עַ בֶּ֥צַע רָ֖ע לְ/בֵית֑/וֹ לָ/שׂ֤וּם בַּ/מָּרוֹם֙ קִנּ֔/וֹ לְ/הִנָּצֵ֖ל מִ/כַּף רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/009.yaml
  text: Woe to him who gains evil profit for his house, to set his nest on high, to escape from the grasp of harm.
translation:
  language: pt
  text: Ai daquele que obtém lucro injusto para a sua casa, para pôr o seu ninho no alto e escapar do alcance do mal!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Ai daquele
  rationale: Mantém a fórmula profética de lamento e condenação em português natural e solene.
- source_word: בֹּצֵעַ בֶּצַע רָע
  choice: obtém lucro perverso
  rationale: Reproduz o jogo lexical em torno de ganho ilícito sem recorrer a uma formulação artificial; “perverso” expressa a qualificação moral de רָע.
- source_word: לְבֵיתוֹ
  choice: para a sua casa
  rationale: Preserva a amplitude de בַּיִת, que pode abranger família, patrimônio ou dinastia, sem restringir o sentido.
- source_word: לָשׂוּם בַּמָּרוֹם קִנּוֹ
  choice: a fim de pôr o seu ninho no alto
  rationale: Conserva a metáfora do ninho elevado como imagem de segurança e posição inacessível.
- source_word: לְהִנָּצֵל מִכַּף רָע
  choice: e escapar das garras do mal
  rationale: 'כַּף significa literalmente palma/mão, mas aqui indica poder ou alcance; “garras” preserva a imagem concreta e combina com a metáfora do ninho. רָע permanece deliberadamente amplo: mal, dano ou calamidade.'
theological_decisions:
- issue: Referência de “sua casa”
  choice: Manter “casa” sem explicação no texto
  alternative: Explicitar “família” ou “dinastia”
  rationale: O hebraico permite mais de uma dimensão, e a tradução não deve resolver essa amplitude indevidamente.
- issue: Sentido de רָע na expressão final
  choice: “mal”
  alternative: “dano”, “desgraça” ou “calamidade”
  rationale: “Mal” preserva a ambiguidade entre ameaça moral e calamidade sofrida, mantendo a tensão do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. A exclamação final reforça a fórmula de ai sem acrescentar conteúdo. Não há marcadores de nota porque nenhuma nota foi julgada necessária.
