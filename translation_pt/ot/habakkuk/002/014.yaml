id: HAB.2.14
reference: Habakkuk 2:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֚י תִּמָּלֵ֣א הָ/אָ֔רֶץ לָ/דַ֖עַת אֶת כְּב֣וֹד יְהוָ֑ה כַּ/מַּ֖יִם יְכַסּ֥וּ עַל יָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/014.yaml
  text: For the earth will be filled with the knowledge of the glory of Yahweh[a], as the waters cover the sea.
translation:
  language: pt
  text: Pois a terra se encherá do conhecimento da glória de Yahweh[a], assim como as águas cobrem o mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “a região” ou “o país”, se entendido em sentido mais localizado; aqui, “a terra” é preferível porque o alcance do versículo parece universal.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento em relação ao contexto anterior, preservando de modo natural a força conectiva do hebraico.
- source_word: תִּמָּלֵא
  choice: se encherá
  rationale: O nifal imperfeito de מלא expressa aqui um resultado futuro; a forma pronominal é idiomática em português e mantém o sentido de ficar cheia.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode significar tanto terra quanto país/região; neste contexto, a comparação abrangente com as águas do mar favorece o horizonte universal de 'a terra'.
- source_word: לָדַעַת
  choice: do conhecimento
  rationale: Depois de 'se encherá', o infinitivo construto com ל assume sentido substantivado, expresso naturalmente como 'do conhecimento'.
- source_word: כְּבוֹד
  choice: glória
  rationale: '''Glória'' é a equivalência consagrada e semanticamente ampla para כבוד quando se refere a Deus, abrangendo seu peso, esplendor e majestade.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título, preservando a distinção lexical presente no hebraico.
- source_word: כַּמַּיִם
  choice: assim como as águas
  rationale: O prefixo כ marca uma comparação; 'assim como' torna clara e natural a relação da imagem em português.
- source_word: יְכַסּוּ
  choice: cobrem
  rationale: Na comparação, o imperfeito descreve uma realidade característica; o presente genérico é a forma mais natural em português.
- source_word: עַל יָם
  choice: o mar
  rationale: Embora עַל tenha literalmente o sentido de 'sobre', o verbo português 'cobrir' rege objeto direto; 'cobrem o mar' preserva o sentido sem rigidez sintática.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: 'universal: ''a terra'''
  alternative: 'localizado: ''a região'' ou ''o país'''
  rationale: O substantivo admite ambos os sentidos, mas a imagem das águas cobrindo o mar e a amplitude da visão profética favorecem o alcance universal. A nota conserva a alternativa lexical genuína sem estreitar o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura poética e a comparação foram preservadas sem sacrificar a naturalidade. O nome divino foi transliterado como Yahweh.
