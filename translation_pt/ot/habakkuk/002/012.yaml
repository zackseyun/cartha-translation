id: HAB.2.12
reference: Habakkuk 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֛וֹי בֹּנֶ֥ה עִ֖יר בְּ/דָמִ֑ים וְ/כוֹנֵ֥ן קִרְיָ֖ה בְּ/עַוְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/012.yaml
  text: Woe to him who builds a city with bloodshed and establishes a town by injustice[a][b].
translation:
  language: pt
  text: Ai daquele que constrói uma cidade com derramamento de sangue[a] e estabelece uma povoação por meio da injustiça![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “com sangues”, expressão que pode indicar derramamento de sangue ou culpa de sangue.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e funda uma cidade na injustiça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ai daquele
  rationale: A interjeição profética introduz uma denúncia e um anúncio de juízo. “Ai daquele” preserva sua força e se liga naturalmente ao particípio substantivado seguinte.
- source_word: בֹּנֶה
  choice: que constrói
  rationale: O particípio qal descreve “aquele que constrói”; a oração relativa é clara e natural em português.
- source_word: עִיר
  choice: cidade
  rationale: É o equivalente comum do termo e mantém a referência à construção de um centro urbano.
- source_word: בְּדָמִים
  choice: com derramamento de sangue
  rationale: O plural hebraico “sangues” é uma expressão idiomática que pode indicar derramamento de sangue ou culpa de sangue; a formulação escolhida comunica com clareza os meios violentos empregados.
- source_word: וְכוֹנֵן
  choice: e estabelece
  rationale: O verbo expressa firmar, estabelecer ou fundar. “Estabelece” preserva a amplitude do termo e forma um paralelo natural com “constrói”.
- source_word: קִרְיָה
  choice: povoação
  rationale: É um quase sinônimo de עִיר. “Povoação” preserva a variação lexical do paralelismo sem sugerir necessariamente uma diferença rígida de tamanho.
- source_word: בְּעַוְלָה
  choice: por meio da injustiça
  rationale: O substantivo denota injustiça, perversidade ou ato errado; a expressão torna explícito o sentido instrumental da preposição sem alterar a acusação moral.
theological_decisions:
- issue: Natureza da denúncia
  choice: Um ai profético contra a edificação do poder urbano mediante violência e injustiça
  alternative: Um lamento geral sobre a corrupção de uma cidade
  rationale: O texto denuncia diretamente quem constrói e estabelece uma comunidade política por meios sanguinários e injustos. A tradução mantém essa acusação sem identificar além do que o versículo afirma o agente ou impor um sistema teológico posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Ai daquele” conserva o tom profético; “povoação” reproduz a variação entre os dois termos hebraicos para cidade. O ponto de exclamação reforça a força da denúncia já presente em הוֹי.
