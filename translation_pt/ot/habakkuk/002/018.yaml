  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מָֽה הוֹעִ֣יל פֶּ֗סֶל כִּ֤י פְסָל/וֹ֙ יֹֽצְר֔/וֹ מַסֵּכָ֖ה וּ/מ֣וֹרֶה שָּׁ֑קֶר כִּ֣י בָטַ֞ח יֹצֵ֤ר יִצְר/וֹ֙ עָלָ֔י/ו לַ/עֲשׂ֖וֹת אֱלִילִ֥ים אִלְּמִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/002/018.yaml
  text: What profit is an idol when its maker has carved it— a cast image and a teacher of lies? For the one who formed it trusts in it[d][c][b][a], making mute idols.
translation:
  language: pt
  text: De que serve um ídolo[a], se seu artífice o esculpiu — uma imagem de metal fundido[b] e um mestre de mentiras[c]? Pois aquele que o formou confia nele, fazendo ídolos[d] mudos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma imagem esculpida”. “Ídolo” explicita que a imagem é objeto de culto falso.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma imagem fundida”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “mestre de mentiras”; provavelmente uma personificação do ídolo como algo que engana seus adoradores.'
    reason: lexical_alternative
  - marker: d
    text: O termo hebraico também pode transmitir a ideia de “ídolos sem valor” ou “coisas que nada são”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הוֹעִיל
  choice: De que serve
  rationale: Expressa em português corrente a pergunta retórica sobre utilidade ou proveito, preservando sua força crítica.
- source_word: פֶּסֶל
  choice: um ídolo
  rationale: Identifica claramente o objeto como imagem de culto falso; o aspecto de escultura é explicitado pelo verbo seguinte.
- source_word: כִּי פְסָלוֹ יֹצְרוֹ
  choice: se seu artífice o esculpiu
  rationale: Toma כִּי em sentido explicativo e conserva a ironia de o objeto venerado ter sido produzido por um artesão humano.
- source_word: יֹצְרוֹ
  choice: seu artífice
  rationale: Designa naturalmente aquele que dá forma ao objeto e mantém em foco sua fabricação humana.
- source_word: מַסֵּכָה
  choice: uma imagem de metal fundido
  rationale: Torna explícito o processo de fundição associado ao termo hebraico, em linguagem clara e contemporânea.
- source_word: וּמוֹרֶה שָּׁקֶר
  choice: e um mestre de mentiras
  rationale: Preserva a personificação e a força metafórica da expressão hebraica, segundo a qual o ídolo transmite engano.
- source_word: כִּי בָטַח
  choice: Pois ... confia
  rationale: Mantém a relação explicativa e o presente característico da denúncia profética.
- source_word: יֹצֵר יִצְרוֹ ... עָלָיו
  choice: aquele que o formou confia nele
  rationale: 'Reflete de perto a ironia hebraica: quem formou o objeto passa a depositar confiança no próprio objeto formado.'
- source_word: לַעֲשׂוֹת
  choice: fazendo
  rationale: Mantém aberta a nuance de propósito ou resultado do infinitivo, sem sobrecarregar a frase.
- source_word: אֱלִילִים
  choice: ídolos
  rationale: É a designação mais clara no contexto; a possível nuance pejorativa de inutilidade é registrada em nota.
- source_word: אִלְּמִים
  choice: mudos
  rationale: Comunica diretamente a incapacidade de falar e reforça a ironia de chamar o ídolo de mestre.
theological_decisions:
- issue: Identidade do “mestre de mentiras”
  choice: A expressão personifica o ídolo como mestre que transmite engano por sua função religiosa.
  alternative: A expressão poderia ser entendida como referência ao artífice ou a um ensinador falso associado à imagem.
  rationale: A sintaxe liga mais naturalmente “imagem de metal fundido” e “mestre de mentiras” como descrições do ídolo; a tradução preserva essa personificação sem ampliar a afirmação além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva o tom retórico e irônico do hebraico, especialmente o contraste entre o artífice humano, o objeto que ele formou e a mudez dos ídolos.
