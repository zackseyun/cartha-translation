  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כֻּלֹּ/ה֙ בְּ/חַכָּ֣ה הֵֽעֲלָ֔ה יְגֹרֵ֣/הוּ בְ/חֶרְמ֔/וֹ וְ/יַאַסְפֵ֖/הוּ בְּ/מִכְמַרְתּ֑/וֹ עַל כֵּ֖ן יִשְׂמַ֥ח וְ/יָגִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/015.yaml
  text: He brings all of them up with a hook[a]; he drags him away with his net, and gathers him in with his dragnet[b]. Therefore he rejoices and exults.
translation:
  language: pt
  text: Ele tira todos com um anzol[a]; arrasta-o com sua rede e o recolhe com sua rede de arrasto[b]. Por isso, ele se alegra e exulta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa da totalidade coletiva para pronomes no singular nas ações seguintes, retratando as vítimas ao mesmo tempo como um conjunto e como uma única presa.
    reason: grammatical_ambiguity
  - marker: b
    text: 'O hebraico emprega aqui duas palavras diferentes para redes de pesca: “rede” e “rede de arrasto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: os... a todos
  rationale: A forma singular tem sentido coletivo no contexto, referindo-se às vítimas retratadas como peixes; a construção portuguesa comunica essa totalidade coletiva.
- source_word: בְּחַכָּה
  choice: com um anzol
  rationale: חַכָּה designa o instrumento usado para fisgar peixes; “anzol” preserva de modo claro e natural a metáfora.
- source_word: הֵעֲלָה
  choice: puxa
  rationale: O hifil de עלה descreve aqui fazer a presa subir da água. “Puxa” exprime naturalmente a ação no contexto da pesca.
- source_word: יְגֹרֵהוּ
  choice: arrasta-o
  rationale: O verbo indica puxar ou arrastar a presa. O pronome singular preserva a mudança do coletivo para o singular presente no hebraico.
- source_word: בְחֶרְמוֹ
  choice: com a sua rede
  rationale: חֵרֶם designa aqui uma rede de pesca. “Rede” é a equivalência corrente e mantém o possessivo.
- source_word: וְיַאַסְפֵהוּ
  choice: e o recolhe
  rationale: אָסַף significa reunir ou recolher. O pronome singular reflete o sufixo masculino singular do texto hebraico.
- source_word: בְּמִכְמַרְתּוֹ
  choice: com a sua rede de arrasto
  rationale: מִכְמֶרֶת é outro tipo de rede, provavelmente uma rede envolvente ou de arrasto. A expressão distingue este termo de חֵרֶם sem recorrer a vocabulário técnico obscuro.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: A locução introduz o resultado do êxito da captura e soa natural no português atual.
- source_word: יִשְׂמַח
  choice: ele se alegra
  rationale: שׂמח expressa alegria; “se alegra” mantém o registro profético com clareza.
- source_word: וְיָגִיל
  choice: e exulta
  rationale: גיל denota alegria intensa. “Exulta” preserva a intensificação em relação ao verbo anterior.
theological_decisions:
- issue: Referente da imagem da pesca
  choice: Manter a metáfora do conquistador caldeu que captura povos como se fossem peixes.
  alternative: Entender a linguagem apenas como uma cena literal de pesca.
  rationale: O contexto imediato de Habacuque 1:14–17 aplica a imagem da pesca à violência imperial. A tradução conserva a metáfora sem inserir a explicação no corpo do versículo.
- issue: Mudança entre referência coletiva e singular
  choice: Traduzir primeiro o conjunto no plural e depois conservar os pronomes singulares dos dois verbos seguintes.
  alternative: Uniformizar todos os pronomes no plural para maior fluidez em português.
  rationale: Os sufixos de יְגֹרֵהוּ e וְיַאַסְפֵהוּ são masculinos singulares. Preservá-los mantém uma mudança real e potencialmente significativa da imagem hebraica, esclarecida em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição dos pronomes e o contraste entre “rede” e “rede de arrasto” preservam os traços poéticos e lexicais do hebraico.
