  text: עַד אָ֧נָה יְהוָ֛ה שִׁוַּ֖עְתִּי וְ/לֹ֣א תִשְׁמָ֑ע אֶזְעַ֥ק אֵלֶ֛י/ךָ חָמָ֖ס וְ/לֹ֥א תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/002.yaml
  text: How long, O LORD, have I cried for help and you do not hear? I cry out to you, “Violence!” and you do not save.
translation:
  language: pt
  text: 'Até quando, SENHOR, clamarei por socorro sem que me ouças? Grito a ti: “Violência!”, e não salvas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Até quando
  rationale: Reproduz diretamente a fórmula hebraica de lamento, com naturalidade em português.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino pelo título em versaletes.
- source_word: שִׁוַּעְתִּי
  choice: clamarei por socorro
  rationale: O verbo expressa um clamor insistente por auxílio; o imperfeito no contexto de עַד־אָנָה indica ação continuada.
- source_word: וְלֹא תִשְׁמָע
  choice: sem que me ouças
  rationale: Expressa de modo natural a ausência persistente de resposta, sem acrescentar ao sentido do hebraico.
- source_word: חָמָס
  choice: Violência!
  rationale: Mantém a denúncia breve e enfática do hebraico, podendo abranger violência e injustiça opressiva.
- source_word: וְלֹא תוֹשִׁיעַ
  choice: mas não salvas
  rationale: Preserva o contraste e o sentido amplo de intervir para livrar, sem explicitar um objeto ausente no hebraico.
theological_decisions:
- issue: Forma do nome divino
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção bíblica portuguesa amplamente reconhecida sem alterar a identidade do referente no texto-fonte.
- issue: Aparente silêncio e inação de Deus
  choice: Mantida como acusação interrogativa do profeta
  alternative: Abrandar como mera percepção subjetiva
  rationale: O lamento hebraico apresenta deliberadamente essa tensão; a tradução não deve resolvê-la nem amenizá-la.
translation_notes:
  register: Linguagem atual, digna e direta. A primeira oração conserva o aspecto de clamor prolongado; a segunda mantém a denúncia abrupta e o paralelismo poético.
