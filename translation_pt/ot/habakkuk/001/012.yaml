  text: הֲ/ל֧וֹא אַתָּ֣ה מִ/קֶּ֗דֶם יְהוָ֧ה אֱלֹהַ֛/י קְדֹשִׁ֖/י לֹ֣א נָמ֑וּת יְהוָה֙ לְ/מִשְׁפָּ֣ט שַׂמְתּ֔/וֹ וְ/צ֖וּר לְ/הוֹכִ֥יחַ יְסַדְתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/012.yaml
  text: Are you not from of old, O Yahweh my God, my Holy One? We will not die.[a] O Yahweh, you have appointed him for judgment, and you, O Rock, have established him for reproof.
translation:
  language: pt
  text: Não és tu desde a antiguidade, ó Yahweh, meu Deus, meu Santo? Não morreremos.[a] Ó Yahweh, tu o designaste para o juízo; e tu, ó Rocha, o estabeleceste para corrigir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma leitura alternativa preservada em algumas tradições: “Tu não morres”. O Texto Massorético hebraico traz: “Não morreremos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלוֹא
  choice: Não és tu
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e mantém o apelo direto do profeta.
- source_word: מִקֶּדֶם
  choice: desde a antiguidade
  rationale: Exprime existência desde tempos remotos ou primordiais sem tornar explícita uma afirmação metafísica mais forte, como “desde a eternidade”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהַי
  choice: meu Deus
  rationale: Reproduz diretamente a forma possessiva de primeira pessoa e o caráter pessoal da invocação.
- source_word: קְדֹשִׁי
  choice: meu Santo
  rationale: Traduz o adjetivo substantivado com sufixo possessivo como um título reverente dirigido a Deus.
- source_word: לֹא נָמוּת
  choice: Não morreremos
  rationale: Segue a vocalização e a morfologia do Texto Massorético, na primeira pessoa do plural, preservando a confiança do profeta em meio ao juízo.
- source_word: לְמִשְׁפָּט
  choice: para o julgamento
  rationale: Comunica a finalidade judicial e punitiva da nomeação do agente caldeu.
- source_word: שַׂמְתּוֹ
  choice: tu o designaste
  rationale: No contexto de uma missão atribuída por Deus, “designaste” expressa naturalmente a ideia de colocar ou nomear alguém para determinado propósito.
- source_word: צוּר
  choice: Rocha
  rationale: Mantém o título divino que evoca firmeza, estabilidade e força.
- source_word: לְהוֹכִיחַ
  choice: para a repreensão
  rationale: Preserva a dimensão disciplinar e judicial do termo sem restringi-lo exclusivamente a castigo.
- source_word: יְסַדְתּוֹ
  choice: o estabeleceste
  rationale: Reflete a ideia de estabelecer firmemente o agente para a função determinada por Deus.
theological_decisions:
- issue: Sujeito e sentido de לֹא נָמוּת
  choice: Não morreremos
  alternative: Tu não morres
  rationale: A vocalização massorética e a morfologia apoiam a primeira pessoa do plural. A variante tradicional na segunda pessoa ressalta a imortalidade divina, mas não deve substituir silenciosamente a leitura do texto hebraico recebido; por isso, aparece em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais brasileiras correntes. A repetição de “tu” foi mantida para deixar claros os sujeitos e conservar a solenidade da invocação. “Yahweh” preserva o nome divino; “Rocha” e “Santo” recebem inicial maiúscula por funcionarem como títulos de Deus.
