    reason: alternative_reading
  revision_rationale: A revisão apenas torna mais natural e inequívoca a expressão da finalidade de לְהוֹכִיחַ e ajusta «julgamento» para o mais idiomático «juízo» no contexto. Mantêm-se a leitura massorética «Não morreremos», a nota da leitura alternativa e todos os demais elementos do texto.
