  text: אָיֹ֥ם וְ/נוֹרָ֖א ה֑וּא מִמֶּ֕/נּוּ מִשְׁפָּט֥/וֹ וּ/שְׂאֵת֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/007.yaml
  text: It is dreadful and fearsome; its justice and authority[a] come from itself.
translation:
  language: pt
  text: Esse povo é terrível e temível; sua justiça e sua autoridade[a] vêm dele mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu juízo e sua dignidade vêm dele mesmo”.'
    reason: Alternativa lexical que preserva sentidos possíveis de מִשְׁפָּט e שְׂאֵת.
lexical_decisions:
- source_word: אָיֹם
  choice: terrível
  rationale: Expressa aquilo que causa pavor no contexto ameaçador dos caldeus, em linguagem corrente e digna.
- source_word: וְנוֹרָא
  choice: temível
  rationale: Mantém a força adjetival e intensifica אָיֹם sem transformar o par em uma formulação excessivamente explicativa.
- source_word: הוּא
  choice: Esse povo é
  rationale: O pronome masculino singular retoma coletivamente o povo descrito no contexto. Explicitar “povo” preserva o singular hebraico e evita uma referência pronominal pouco clara em português.
- source_word: מִמֶּנּוּ
  choice: dele mesmo
  rationale: 'Indica origem: as normas e a posição de poder desse povo procedem dele próprio, não de uma autoridade superior.'
- source_word: מִשְׁפָּטוֹ
  choice: sua justiça
  rationale: מִשְׁפָּט pode designar juízo, direito ou justiça; aqui aponta para a ordem judicial e política estabelecida pelo próprio povo. “Juízo” permanece como alternativa legítima.
- source_word: וּשְׂאֵתוֹ
  choice: sua autoridade
  rationale: No paralelismo, o termo indica elevação, posição dominante ou poder reivindicado. “Autoridade” comunica naturalmente a força política do contexto, enquanto “dignidade” preserva mais diretamente o sentido de posição elevada.
- source_word: יֵצֵא
  choice: vêm
  rationale: O verbo singular hebraico rege conjuntamente os dois elementos coordenados; em português, o sujeito composto pede o plural “vêm” e comunica de modo natural a ideia de proceder ou ter origem.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o povo como referente coletivo singular e conserva a afirmação enfática de que sua justiça e autoridade têm origem nele próprio.
