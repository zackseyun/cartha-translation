base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/008.yaml
  text: His horses are swifter than leopards and fiercer than wolves at dusk[a]. His horsemen spread out; his horsemen come from far away. They fly like an eagle hurrying to devour.
translation:
  language: pt
  text: Seus cavalos são mais velozes que leopardos e mais ferozes que lobos ao anoitecer. Seus cavaleiros se espalham; seus cavaleiros vêm de longe. Voam como uma águia[a] que se apressa para devorar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como um abutre que se apressa para devorar». O termo hebraico נֶשֶׁר pode designar, de modo mais amplo, uma grande ave de rapina ou necrófaga, não necessariamente a águia na classificação zoológica moderna.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלּוּ מִנְּמֵרִים
  choice: são mais velozes que leopardos
  rationale: O verbo קלל expressa leveza ou rapidez; na comparação com leopardos, «mais velozes» comunica naturalmente o sentido contextual.
- source_word: סוּסָיו
  choice: seus cavalos
  rationale: Mantém de modo direto o substantivo plural com o sufixo possessivo, referente ao invasor descrito no contexto.
- source_word: וְחַדּוּ מִזְּאֵבֵי עֶרֶב
  choice: e mais ferozes que lobos ao anoitecer
  rationale: חדד transmite aqui agudeza figurada ou ferocidade. «Ao anoitecer» preserva a imagem temporal de עֶרֶב e sugere lobos famintos que saem para caçar.
- source_word: וּפָשׁוּ פָּרָשָׁיו
  choice: Seus cavaleiros se espalham
  rationale: פוש provavelmente descreve dispersão ou ampla movimentação da cavalaria; «se espalham» preserva essa nuance sem especificar demais a manobra militar.
- source_word: וּפָרָשָׁיו מֵרָחוֹק יָבֹאוּ
  choice: seus cavaleiros vêm de longe
  rationale: Reproduz a repetição enfática de «seus cavaleiros» e traduz de forma clara a procedência distante.
- source_word: יָעֻפוּ
  choice: Voam
  rationale: Mantém diretamente a metáfora de movimento aéreo rápido, cujo caráter predatório é desenvolvido na comparação seguinte.
- source_word: כְּנֶשֶׁר
  choice: como a águia
  rationale: נֶשֶׁר pode designar uma águia ou, mais amplamente, uma grande ave de rapina ou necrófaga. «Águia» é uma tradução tradicional e plausível; a alternativa zoológica é registrada em nota.
- source_word: חָשׁ לֶאֱכוֹל
  choice: que se apressa para devorar
  rationale: A construção expressa urgência em alcançar alimento ou presa. «Devorar» conserva a força predatória do contexto, enquanto «se apressa» reflete de perto חָשׁ.
