  yaml_path: translation/ot/habakkuk/001/009.yaml
  text: All of them come for violence[a]; the set of their faces is forward[c][b], and they gather captives like sand.
translation:
  language: pt
  text: Todos eles vêm para a violência; avançam com os rostos voltados para a frente[a] e ajuntam cativos como areia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os rostos voltados para o leste”. A expressão hebraica é difícil: קָדִימָה pode significar “para a frente” ou “para o leste”, e מְגַמַּת pode indicar “direção”, “orientação” ou “intento”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico emprega um verbo no singular, “e ele ajunta”, tratando a força invasora como uma unidade coletiva. Também se pode traduzir o objeto por “cativeiro”: “ajunta cativeiro como areia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלֹּה
  choice: Todos eles
  rationale: O sufixo masculino singular retoma coletivamente a força invasora do contexto; o plural em português comunica naturalmente os seus integrantes.
- source_word: לְחָמָס
  choice: para praticar violência
  rationale: חָמָס denota violência ou brutalidade. A formulação verbal explicita de modo natural em português a finalidade expressa por לְ, sem ampliar o sentido.
- source_word: יָבוֹא
  choice: vêm
  rationale: בוא significa diretamente “vir”. O plural concorda de maneira natural com “todos eles”, embora o hebraico trate a força como unidade coletiva.
- source_word: מְגַמַּת פְּנֵיהֶם
  choice: a direção de seus rostos
  rationale: O raro מְגַמַּת pode indicar direção, orientação ou intento. A tradução conserva a imagem concreta dos rostos e evita reduzir a expressão apenas a uma intenção mental.
- source_word: קָדִימָה
  choice: para a frente
  rationale: A forma pode indicar tanto avanço quanto direção oriental. No contexto militar, “para a frente” expressa bem o avanço, preservando em nota a alternativa geográfica.
- source_word: וַיֶּאֱסֹף
  choice: e ajuntam
  rationale: Embora o verbo hebraico esteja no singular e apresente o exército como unidade coletiva, o plural é a concordância mais natural em português com “todos eles”; a nuance coletiva é registrada em nota.
- source_word: כַּחוֹל
  choice: como areia
  rationale: Mantém a comparação hebraica de quantidade incontável em linguagem portuguesa concisa e natural.
- source_word: שֶׁבִי
  choice: cativos
  rationale: O substantivo pode designar “cativeiro” abstratamente ou as pessoas capturadas. Com “ajuntar”, o sentido pessoal é mais natural, sem eliminar a alternativa em nota.
