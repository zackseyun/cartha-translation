  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ֣/מָּה תַרְאֵ֤/נִי אָ֨וֶן֙ וְ/עָמָ֣ל תַּבִּ֔יט וְ/שֹׁ֥ד וְ/חָמָ֖ס לְ/נֶגְדִּ֑/י וַ/יְהִ֧י רִ֦יב וּ/מָד֖וֹן יִשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/003.yaml
  text: Why do you make me see wrongdoing[a], and why do you look at trouble? Destruction and violence are before me; strife comes to be[c][b], and contention rises up.
translation:
  language: pt
  text: Por que me fazes ver a injustiça[a] e por que contemplas a aflição? Destruição[b] e violência estão diante de mim; surge a disputa[c], e a discórdia se levanta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a iniquidade”.'
    reason: lexical_alternative
  - marker: b
    text: “Destruição” também pode ser traduzido por “devastação” ou “saque”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “passa a haver disputa, e a discórdia irrompe” ou “há disputa, e a discórdia se eleva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Por que
  rationale: Interrogativo direto de causa, adequado ao tom de lamento.
- source_word: תַרְאֵנִי
  choice: me fazes ver
  rationale: Preserva a força causativa do hifil de ראה com sufixo de primeira pessoa, sem suavizá-la como simples permissão.
- source_word: אָוֶן
  choice: injustiça
  rationale: No contexto de violência e conflito social, expressa com clareza a dimensão moral do termo; a alternativa mais tradicional é indicada em nota.
- source_word: וְעָמָל
  choice: a aflição
  rationale: Comunica sofrimento, dano e opressão, sentidos contextuais de עָמָל, sem reduzi-lo a trabalho ou esforço.
- source_word: תַּבִּיט
  choice: contemplas
  rationale: Mantém o sentido de olhar atentamente para algo e a tensão da queixa de que Deus observa o mal.
- source_word: שֹׁד
  choice: Destruição
  rationale: Representa a devastação causada pela opressão violenta; outros sentidos possíveis, como saque, são preservados em nota.
- source_word: חָמָס
  choice: violência
  rationale: Equivalente transparente para o termo profético que frequentemente designa violência injusta.
- source_word: לְנֶגְדִּי
  choice: estão diante de mim
  rationale: Reproduz de modo natural a ideia de algo continuamente presente perante o profeta.
- source_word: וַיְהִי
  choice: surge
  rationale: Expressa o aparecimento ou a ocorrência da situação, preservando melhor a força verbal do que a simples fórmula existencial 'há'.
- source_word: רִיב
  choice: a disputa
  rationale: Abrange tanto conflito social quanto controvérsia, sem impor exclusivamente um cenário judicial.
- source_word: מָדוֹן
  choice: a discórdia
  rationale: Mantém o paralelismo com רִיב, mas conserva uma distinção lexical entre a disputa manifesta e a discórdia que se intensifica.
- source_word: יִשָּׂא
  choice: se levanta
  rationale: Preserva a imagem de algo que se ergue e, no contexto, irrompe ou ganha força.
theological_decisions:
- issue: Se os verbos iniciais devem suavizar a relação de Deus com aquilo que o profeta presencia
  choice: 'Manter a interpelação direta e a força causativa: ''me fazes ver... contemplas''.'
  alternative: Traduzir 'deixas que eu veja' ou acrescentar a ideia de que Deus apenas tolera o mal.
  rationale: 'O hebraico apresenta uma queixa direta a Deus: o primeiro verbo é causativo, e o segundo descreve o ato de olhar. A tradução conserva a tensão do lamento sem explicar doutrinariamente a relação de Deus com o mal.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa do singular apropriadas à oração dirigida a Deus. A redação preserva o paralelismo poético, a aspereza da queixa profética e a ambiguidade lexical relevante sem impor uma interpretação confessional.
