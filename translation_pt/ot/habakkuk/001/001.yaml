  text: O oráculo que o profeta Habacuque viu:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “peso” ou “pronunciamento”. O termo hebraico massá é usado como título de uma mensagem profética de grande peso.
