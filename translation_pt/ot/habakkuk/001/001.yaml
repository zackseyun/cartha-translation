lexical_decisions:
- source_word: הַמַּשָׂא
  choice: a mensagem solene
  rationale: Em títulos proféticos, מַשָּׂא designa um pronunciamento de peso, muitas vezes ligado ao juízo. “Mensagem solene” comunica o caráter profético e grave em português corrente sem sugerir apenas um fardo emocional.
- source_word: אֲשֶׁר
  choice: que
  rationale: O pronome relativo liga naturalmente o título ao verbo em português.
- source_word: חָזָה
  choice: viu
  rationale: Preserva a metáfora profética do hebraico e não define além do texto o modo preciso da revelação.
- source_word: חֲבַקּוּק
  choice: Habacuque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Traduz diretamente o título que identifica a função de Habacuque.
theological_decisions:
- issue: Sentido do título profético מַשָּׂא
  choice: mensagem solene
  alternative: oráculo; peso; pronunciamento
  rationale: A expressão mantém o sentido amplo de uma revelação profética grave, sem limitar antecipadamente seu conteúdo exclusivamente ao juízo nem transformar a palavra em uma experiência emocional do profeta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção concisa preserva a forma de título do hebraico e mantém literalmente o verbo “viu”.
