  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תַּעֲשֶׂ֥ה אָדָ֖ם כִּ/דְגֵ֣י הַ/יָּ֑ם כְּ/רֶ֖מֶשׂ לֹא מֹשֵׁ֥ל בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/014.yaml
  text: You make man like the fish of the sea[a], like creeping things that have no ruler over them.
translation:
  language: pt
  text: Tu fazes o ser humano como os peixes do mar, como os animais rastejantes, que não têm quem os governe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲשֶׂה
  choice: Tu fazes
  rationale: O imperfeito com waw dirige-se a Deus e, no contexto da queixa profética, descreve a situação presente. «Tu fazes» preserva a acusação direta e é natural em português.
- source_word: אָדָם
  choice: o ser humano
  rationale: O substantivo singular tem aqui sentido coletivo e representativo. «O ser humano» conserva o singular e comunica claramente a referência à humanidade sem restringi-la ao sexo masculino.
- source_word: כִּדְגֵי הַיָּם
  choice: como os peixes do mar
  rationale: Reproduz de modo natural a comparação e preserva a formulação poética do hebraico.
- source_word: כְּרֶמֶשׂ
  choice: como os animais rastejantes
  rationale: רֶמֶשׂ designa coletivamente criaturas que se movem rente ao chão. «Animais rastejantes» é claro e digno no português atual.
- source_word: לֹא מֹשֵׁל בּוֹ
  choice: que não têm quem os governe
  rationale: O particípio מֹשֵׁל indica alguém que exerce domínio. A construção escolhida expressa essa ausência de governo e acomoda naturalmente os referentes coletivos da comparação.
theological_decisions:
- issue: Sentido genérico e coletivo de אָדָם
  choice: o ser humano
  alternative: o homem
  rationale: Embora אָדָם esteja no singular masculino, neste contexto representa coletivamente a humanidade. «O ser humano» preserva o singular representativo e evita que a referência universal seja entendida como exclusivamente masculina.
- issue: Identidade implícita de quem deveria governar
  choice: não têm quem os governe
  alternative: não têm governante
  rationale: O texto afirma apenas a ausência de alguém que governe, sem identificar essa figura nem explicar teologicamente por que ela falta. A tradução mantém essa abertura.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento «Tu» preserva a interpelação direta a Deus e o tom poético solene. A redação mantém o paralelismo das duas comparações.
