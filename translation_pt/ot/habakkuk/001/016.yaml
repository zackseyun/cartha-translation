base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/016.yaml
  text: Therefore he sacrifices to his net and burns incense to his dragnet[a], because by them his portion is rich and his food is plentiful.
translation:
  language: pt
  text: Por isso, oferece sacrifícios à sua rede e queima incenso à sua rede de arrasto,[a] pois por meio delas sua porção é farta, e seu alimento é abundante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pois por meio delas sua porção é gorda, e seu alimento é seleto». O hebraico usa a imagem da gordura para expressar fartura e prosperidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural a relação de consequência com o sucesso do conquistador descrito anteriormente.
- source_word: יְזַבֵּחַ
  choice: oferece sacrifícios
  rationale: O piel de זבח indica aqui o ato cultual de sacrificar, não apenas matar.
- source_word: לְחֶרְמוֹ
  choice: à sua rede
  rationale: חֵרֶם designa aqui uma rede de pesca no contexto da metáfora dos versículos anteriores.
- source_word: וִיקַטֵּר
  choice: e queima incenso
  rationale: Preserva a terminologia cultual explícita e a imagem de adoração idólatra.
- source_word: לְמִכְמַרְתּוֹ
  choice: à sua rede de arrasto
  rationale: מִכְמֶרֶת é uma rede ampla de pesca; 'rede de arrasto' mantém uma distinção compreensível em relação à primeira rede.
- source_word: כִּי בָהֵמָּה
  choice: pois, graças a elas
  rationale: O בְּ com o pronome plural tem sentido instrumental; 'graças a elas' comunica também que o conquistador atribui sua prosperidade a esses instrumentos.
- source_word: שָׁמֵן חֶלְקוֹ
  choice: sua porção é farta
  rationale: שָׁמֵן significa literalmente 'gorda', mas aqui comunica fartura e prosperidade; 'farta' preserva o sentido sem soar artificial.
- source_word: וּמַאֲכָלוֹ בְּרִיאָה
  choice: e seu alimento, abundante
  rationale: בְּרִיאָה descreve algo gordo, cevado ou rico; no contexto, 'abundante' exprime com clareza a fartura resultante.
theological_decisions:
- issue: Linguagem idólatra aplicada aos instrumentos de conquista
  choice: 'Manter os atos cultuais explícitos: oferecer sacrifícios e queimar incenso à rede e à rede de arrasto.'
  alternative: Parafrasear como confiança excessiva no poder militar ou nos próprios recursos.
  rationale: O hebraico emprega terminologia inequívoca de sacrifício e incenso. A possível dimensão figurada deve surgir dessa imagem, não substituí-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A vírgula antes do marcador encerra o segundo objeto coordenado, e a elipse de 'é' em 'seu alimento, abundante' evita repetição pesada sem perder clareza.
