source:
  edition: WLC
  text: כִּֽי הִנְ/נִ֤י מֵקִים֙ אֶת הַ/כַּשְׂדִּ֔ים הַ/גּ֖וֹי הַ/מַּ֣ר וְ/הַ/נִּמְהָ֑ר הַֽ/הוֹלֵךְ֙ לְ/מֶרְחֲבֵי אֶ֔רֶץ לָ/רֶ֖שֶׁת מִשְׁכָּנ֥וֹת לֹּא לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/006.yaml
  text: For behold[a], I am raising up the Chaldeans, that bitter and hasty nation[b], which marches through the broad places of the earth to seize dwelling places not its own.
translation:
  language: pt
  text: Pois eis que estou levantando[b] os caldeus[a], essa nação cruel[c] e impetuosa, que marcha pelos vastos espaços da terra para tomar posse de moradas que não lhe pertencem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os babilônios». O hebraico diz «os caldeus», povo historicamente associado ao poder neobabilônico.
    reason: lexical_alternative
  - marker: b
    text: Ou «incitando» ou «fazendo surgir». O hebraico pode indicar fazer uma potência surgir ou mobilizá-la para agir.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «amarga». Neste contexto, o termo descreve uma nação dura e cruel.
    reason: lexical_explanation
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou causal em relação à resposta divina precedente.
- source_word: הִנְנִי
  choice: 'vejam: estou'
  rationale: Reproduz de modo atual o chamado enfático à atenção e o pronome de primeira pessoa, sem recorrer ao arcaizante «eis».
- source_word: מֵקִים
  choice: levantando
  rationale: O hifil de קום indica fazer surgir ou pôr em ação; «levantando» conserva a agência divina e a possível ideia de suscitar um poder.
- source_word: הַכַּשְׂדִּים
  choice: os caldeus
  rationale: Preserva o etnônimo hebraico e sua referência histórica, em vez de substituí-lo diretamente por «babilônios».
- source_word: הַגּוֹי
  choice: essa nação
  rationale: Expressa o povo como entidade étnico-política e liga naturalmente a descrição ao etnônimo anterior.
- source_word: הַמַּר
  choice: cruel
  rationale: Embora o sentido lexical básico seja «amargo», aplicado a uma nação invasora o adjetivo comunica dureza ou ferocidade; «cruel» torna esse sentido contextual claro em português.
- source_word: וְהַנִּמְהָר
  choice: impetuosa
  rationale: Preserva tanto a rapidez quanto a ação precipitada ou arrebatada, com maior naturalidade que «apressada» neste contexto militar.
- source_word: הַהוֹלֵךְ
  choice: que marcha
  rationale: A forma participial descreve sua ação característica; «marcha» explicita apenas a ambientação militar já presente no contexto.
- source_word: לְמֶרְחֲבֵי אֶרֶץ
  choice: pelas vastidões da terra
  rationale: Representa os espaços amplos ou extensões da terra com linguagem natural e dignificada.
- source_word: לָרֶשֶׁת
  choice: para tomar
  rationale: ירשׁ pode indicar possuir ou tomar posse, muitas vezes por conquista; «tomar» preserva o sentido militar sem exagerá-lo.
- source_word: מִשְׁכָּנוֹת
  choice: moradas
  rationale: Termo claro e elevado para lugares habitados, adequado ao registro profético.
- source_word: לֹא לוֹ
  choice: que não lhe pertencem
  rationale: Torna explícita a posse ilegítima e mantém a concordância com o coletivo singular «nação».
theological_decisions:
- issue: Agência divina na ascensão dos caldeus
  choice: estou levantando os caldeus
  alternative: estou incitando os caldeus
  rationale: O hebraico atribui diretamente a Deus o surgimento ou a mobilização desse poder. A formulação conserva essa afirmação sem definir além do texto o modo da causalidade divina.
- issue: Caracterização moral da nação por הַמַּר
  choice: cruel
  alternative: amarga
  rationale: «Cruel» comunica o valor contextual de dureza e ferocidade, mas a nota preserva a imagem lexical mais literal para não ocultar a tensão semântica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O verso mantém tom profético solene sem arcaísmos; «vejam» funciona como chamado coletivo à atenção, enquanto «caldeus» preserva a designação histórica do texto-fonte.
