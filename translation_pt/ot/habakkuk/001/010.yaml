  text: וְ/הוּא֙ בַּ/מְּלָכִ֣ים יִתְקַלָּ֔ס וְ/רֹזְנִ֖ים מִשְׂחָ֣ק ל֑/וֹ ה֚וּא לְ/כָל מִבְצָ֣ר יִשְׂחָ֔ק וַ/יִּצְבֹּ֥ר עָפָ֖ר וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/010.yaml
  text: He mocks kings[a], and rulers are a laughingstock to him. He laughs at every fortress; he heaps up earth and captures it.
translation:
  language: pt
  text: Ele zomba dos reis, e os governantes são motivo de riso para ele. Ri de toda fortaleza; amontoa terra[a] e a conquista.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “amontoa pó/terra”; a imagem é a de erguer uma rampa de terra para tomar um lugar fortificado.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְקַלָּס
  choice: zomba
  rationale: O hitpael expressa zombaria desdenhosa; “zomba” é claro, conciso e corresponde ao paralelismo com os governantes como motivo de riso.
- source_word: רֹזְנִים
  choice: governantes
  rationale: O termo designa altos dirigentes ou dignitários; “governantes” preserva o sentido político em linguagem atual e abrangente.
- source_word: מִשְׂחָק לוֹ
  choice: são motivo de riso para ele
  rationale: A expressão apresenta os governantes como objeto de riso e desprezo. A formulação é natural em português sem atenuar a força depreciativa.
- source_word: מִבְצָר
  choice: fortaleza
  rationale: O substantivo indica um lugar fortificado; “fortaleza” mantém com clareza o contexto militar.
- source_word: יִשְׂחָק
  choice: ri de
  rationale: O qal de שׂחק descreve aqui riso de escárnio; “ri de” preserva a imagem concreta e o tom de desprezo.
- source_word: וַיִּצְבֹּר עָפָר
  choice: amontoa terra
  rationale: A tradução conserva a imagem literal de acumular terra, sem inserir no texto principal a explicação contextual de uma rampa de cerco.
- source_word: וַיִּלְכְּדָהּ
  choice: a conquista
  rationale: O verbo tem sentido militar de capturar ou tomar; o pronome feminino retoma naturalmente “fortaleza” em português.
- source_word: הוּא
  choice: Ele
  rationale: O pronome retoma o invasor coletivo singular personificado no contexto, preservando o padrão discursivo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a repetição semântica entre zombar e rir, bem como a imagem militar literal. O marcador da nota foi colocado após “terra”, expressão à qual a nota efetivamente se refere.
