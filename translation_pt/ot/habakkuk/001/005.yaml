base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/005.yaml
  text: Look among the nations and see[a]; be astonished, be astounded[b]. For I am doing a work in your days that you would not believe if it were told.
translation:
  language: pt
  text: Olhem para as nações e observem; fiquem pasmos, fiquem completamente espantados.[a] Pois realizo uma obra nos dias de vocês que não acreditariam, se lhes fosse contada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Olhem entre as nações e observem; fiquem pasmos, fiquem pasmos”. O hebraico repete o verbo de assombro para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Pois uma obra está sendo realizada nos dias de vocês, na qual não acreditariam se fosse relatada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בַגּוֹיִם וְהַבִּיטוּ
  choice: Olhem entre as nações e observem
  rationale: Preserva os imperativos plurais e a possível ideia espacial de בַגּוֹיִם. “Observem” comunica o olhar atento de הביט sem repetir de modo pouco natural o verbo “olhar”.
- source_word: וְהִתַּמְּהוּ תְּמָהוּ
  choice: fiquem pasmos, completamente assombrados
  rationale: A formulação reproduz os dois imperativos relacionados e torna explícita a intensificação produzida pela repetição hebraica, mantendo linguagem natural em português.
- source_word: פֹעַל פֹּעֵל
  choice: realizo uma obra
  rationale: Expressa de maneira concisa a construção enfática de substantivo e particípio. O sujeito divino em primeira pessoa é suprido pelo contexto discursivo.
- source_word: בִּימֵיכֶם
  choice: nos dias de vocês
  rationale: Mantém de perto a expressão temporal hebraica e é compreensível em português moderno.
- source_word: לֹא תַאֲמִינוּ כִּי יְסֻפָּר
  choice: na qual não acreditariam, mesmo que lhes fosse contada
  rationale: A forma condicional comunica naturalmente que o acontecimento seria inacreditável ainda que relatado; “lhes” conserva os destinatários plurais.
theological_decisions:
- issue: Sujeito implícito de פֹעַל פֹּעֵל
  choice: Pois realizo uma obra
  alternative: Pois uma obra está sendo realizada
  rationale: Embora não haja pronome expresso na oração hebraica, o contexto apresenta o SENHOR como locutor. A tradução em primeira pessoa oferece clareza sem acrescentar uma identificação estranha ao discurso.
- issue: Força dos imperativos enfáticos de assombro
  choice: fiquem pasmos, completamente assombrados
  alternative: fiquem pasmos, fiquem pasmos
  rationale: Preserva tanto a duplicação retórica quanto sua força intensificadora, evitando uma repetição mecânica em português.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. O plural “vocês” torna explícito o destinatário coletivo. A tradução conserva em notas as ambiguidades da preposição em בַגּוֹיִם e do sujeito não expresso em פֹעַל פֹּעֵל.
