id: HAB.1.13
reference: Habakkuk 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: טְה֤וֹר עֵינַ֨יִם֙ מֵ/רְא֣וֹת רָ֔ע וְ/הַבִּ֥יט אֶל עָמָ֖ל לֹ֣א תוּכָ֑ל לָ֤/מָּה תַבִּיט֙ בּֽוֹגְדִ֔ים תַּחֲרִ֕ישׁ בְּ/בַלַּ֥ע רָשָׁ֖ע צַדִּ֥יק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/013.yaml
  text: Your eyes are too pure to look on evil[a], and you cannot gaze at wrongdoing[c][b]. Why then do you look on the treacherous and keep silent when the wicked swallows up one more righteous than he?
translation:
  language: pt
  text: Teus olhos são puros demais para ver o mal[a], e não podes contemplar a injustiça[b]. Por que, então, contemplas os traiçoeiros e te calas quando o perverso devora alguém mais justo do que ele[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para olhar o mal”; literalmente, “puros de olhos para ver o mal”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “sofrimento”, “desgraça” ou “perversidade”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico faz uma comparação: a pessoa devorada é mais justa que o perverso, sem que isso necessariamente afirme que ela seja absolutamente justa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טְהוֹר עֵינַיִם מֵרְאוֹת רָע
  choice: Teus olhos são puros demais para ver o mal
  rationale: Preserva a imagem hebraica dos “olhos puros” e expressa em português natural a construção com מִן e infinitivo, sem transformar a linguagem poética numa afirmação filosófica de que Deus não percebe o mal.
- source_word: וְהַבִּיט אֶל עָמָל לֹא תוּכָל
  choice: e não podes contemplar a injustiça
  rationale: “Contemplar” mantém o paralelismo visual e a nuance de olhar atentamente; עָמָל, neste contexto de violência moral, é bem representado por “injustiça”, embora também possa indicar sofrimento, desgraça ou perversidade.
- source_word: לָמָּה תַבִּיט בּוֹגְדִים
  choice: Por que, então, contemplas os traiçoeiros
  rationale: “Então” torna explícito o contraste retórico já presente entre a afirmação anterior e a queixa. בּוֹגְדִים caracteriza pessoas desleais, pérfidas ou traiçoeiras.
- source_word: תַּחֲרִישׁ
  choice: te calas
  rationale: Traduz de modo direto e natural o silêncio atribuído a Deus diante da ação do perverso, sem explicar esse silêncio como aprovação ou inatividade absoluta.
- source_word: בְּבַלַּע רָשָׁע
  choice: quando o perverso devora
  rationale: A construção com בְּ e o infinitivo estabelece a circunstância temporal, enquanto “devora” conserva a imagem predatória vívida do hebraico.
- source_word: צַדִּיק מִמֶּנּוּ
  choice: alguém mais justo do que ele
  rationale: 'Mantém a comparação indicada por מִן: a vítima é relativamente mais justa que o perverso, sem ser necessariamente declarada absolutamente justa ou inocente.'
theological_decisions:
- issue: A relação de Deus com o mal na primeira metade do versículo
  choice: Conservar a afirmação retórica sobre a pureza moral de Deus — “puros demais para ver o mal” — em tensão com a pergunta que diz que ele contempla os traiçoeiros.
  alternative: Interpretar de modo explícito como “não podes tolerar o mal” ou, no extremo oposto, como negação absoluta de que Deus veja qualquer mal.
  rationale: A poesia da queixa afirma a incompatibilidade moral entre Deus e o mal, mas a pergunta seguinte emprega o mesmo campo semântico do olhar. A tradução deve preservar essa tensão sem resolver o texto por meio de uma formulação doutrinária acrescentada.
- issue: O grau de justiça da vítima
  choice: 'Traduzir comparativamente: “alguém mais justo do que ele”.'
  alternative: Chamar a vítima simplesmente de “o justo”, o que poderia sugerir justiça absoluta.
  rationale: O hebraico צַדִּיק מִמֶּנּוּ apresenta uma comparação explícita; a tradução não deve apagar essa relatividade.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa do singular para conservar o discurso direto a Deus. “Contemplar” preserva a repetição conceitual do olhar nas duas metades; “traidores” foi evitado por poder sugerir principalmente traição política, enquanto “traiçoeiros” abrange a deslealdade moral do particípio hebraico.
