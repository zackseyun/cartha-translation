  text: Then he sweeps by like the wind and passes on—he becomes guilty[b][a]; this strength of his is his god.
translation:
  language: pt
  text: Então ele passa como o vento[a] e segue adiante; torna-se culpado. Essa sua força é o seu deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida por “vento” também pode significar “espírito”; neste contexto, a imagem de movimento rápido e impetuoso favorece “vento”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “torna-se culpado, atribuindo essa força ao seu deus”, ou: “essa sua força pertence ao seu deus”. A oração final em hebraico é concisa e pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a etapa seguinte da descrição de modo temporal, natural e direto.
- source_word: חָלַף רוּחַ
  choice: passa como o vento
  rationale: A construção compacta retrata o avanço rápido e impetuoso do invasor. A comparação explicitada por “como” produz português claro sem eliminar a imagem hebraica.
- source_word: וַיַּעֲבֹר
  choice: e segue adiante
  rationale: Dá continuidade ao movimento veloz e preserva a progressão narrativa, evitando repetir “passa” de maneira pouco elegante.
- source_word: וְאָשֵׁם
  choice: torna-se culpado
  rationale: Preserva a força verbal de incorrer em culpa, em vez de expressar apenas uma condição estática.
- source_word: זוּ כֹחוֹ
  choice: Essa sua força
  rationale: O demonstrativo aponta para a força militar anteriormente descrita; a formulação é natural e mantém a ênfase do texto.
- source_word: לֵאלֹהוֹ
  choice: é o seu deus
  rationale: Entende a construção concisa com ל como a identificação funcional da própria força do invasor com seu deus, mas registra outras análises plausíveis em nota.
theological_decisions:
- issue: Interpretação de זוּ כֹחוֹ לֵאלֹהוֹ
  choice: O invasor incorre em culpa ao tratar sua própria força como seu deus.
  alternative: “torna-se culpado, atribuindo essa força ao seu deus” ou “sua força pertence ao seu deus”.
  rationale: O hebraico é extremamente conciso e permite mais de uma análise sintática. A leitura principal liga bem a declaração de culpa à arrogância e à autoconfiança idólatra do conquistador, enquanto as alternativas genuínas são preservadas em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem das notas acompanha a ocorrência dos marcadores no texto.
