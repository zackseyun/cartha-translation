source:
  edition: WLC
  text: עַל כֵּן֙ תָּפ֣וּג תּוֹרָ֔ה וְ/לֹֽא יֵצֵ֥א לָ/נֶ֖צַח מִשְׁפָּ֑ט כִּ֤י רָשָׁע֙ מַכְתִּ֣יר אֶת הַ/צַּדִּ֔יק עַל כֵּ֛ן יֵצֵ֥א מִשְׁפָּ֖ט מְעֻקָּֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/004.yaml
  text: Therefore the law grows numb, and justice never goes forth. For the wicked surrounds the righteous; therefore justice goes forth twisted.
translation:
  language: pt
  text: Por isso, a lei perde a força, e a justiça nunca se manifesta. Pois o perverso cerca o justo; por isso, a justiça se manifesta distorcida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּפוּג תּוֹרָה
  choice: a lei perde a força
  rationale: O verbo פוג descreve enfraquecimento, entorpecimento ou perda de eficácia; esta formulação natural preserva a ideia de que a instrução legal ficou sem vigor, sem afirmar que deixou de existir.
- source_word: וְלֹא יֵצֵא לָנֶצַח מִשְׁפָּט
  choice: e a justiça nunca prevalece
  rationale: יצא, literalmente 'sair', pode indicar que uma decisão justa se manifesta ou é efetivada. 'Prevalece' comunica aqui a ausência persistente de justiça eficaz, enquanto a repetição posterior de יצא é traduzida mais literalmente.
- source_word: מַכְתִּיר אֶת־הַצַּדִּיק
  choice: cerca o justo
  rationale: O particípio de כתר tem o sentido de rodear ou cercar. A tradução mantém a imagem espacial e a pressão exercida pelo perverso sobre o justo.
- source_word: מִשְׁפָּט מְעֻקָּל
  choice: a justiça sai distorcida
  rationale: O particípio מְעֻקָּל significa torcido ou deturpado. 'Distorcida' preserva a metáfora e descreve uma justiça corrompida em sua manifestação.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto
  choice: a lei
  alternative: a instrução
  rationale: No contexto de violência, litígio e decisões judiciais, 'lei' é clara e adequada, embora תּוֹרָה possa ter o sentido mais amplo de instrução. Não se especifica indevidamente se a referência é apenas à Lei mosaica ou à ordem jurídica em geral.
- issue: Relação entre o perverso e o justo
  choice: o perverso cerca o justo
  alternative: os perversos cercam os justos
  rationale: Mantém-se o singular coletivo do hebraico e sua tensão entre tipos representativos, sem identificar personagens ou grupos específicos.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de 'por isso' conserva a estrutura causal enfática do hebraico. 'Justiça' traduz מִשְׁפָּט de modo natural no contexto, abrangendo tanto o juízo quanto sua execução.
