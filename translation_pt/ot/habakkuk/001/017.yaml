source:
  edition: WLC
  text: הַ֥/עַל כֵּ֖ן יָרִ֣יק חֶרְמ֑/וֹ וְ/תָמִ֛יד לַ/הֲרֹ֥ג גּוֹיִ֖ם לֹ֥א יַחְמֽוֹל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/habakkuk/001/017.yaml
  text: Will he therefore keep emptying his net and continually slaughtering nations without mercy?[a][b]
translation:
  language: pt
  text: Será que, por isso, ele continuará esvaziando a sua rede[b] e massacrando nações sem cessar, sem ter piedade?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sem poupar ninguém». O verbo hebraico pode significar mais literalmente «poupar» ou «ter compaixão».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «rede de arrasto». O termo hebraico designa um apetrecho de pesca; «rede» mantém de modo natural a metáfora da pesca presente no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל כֵּן
  choice: Será que, por isso
  rationale: A combinação da partícula interrogativa com עַל־כֵּן introduz uma pergunta retórica ligada por inferência ao versículo anterior. A formulação preserva tanto a força interrogativa quanto o sentido de «por isso».
- source_word: יָרִיק
  choice: continuará esvaziando
  rationale: O hifil de ריק significa «esvaziar» ou «derramar». Na imagem do pescador, «esvaziar» é natural; o futuro com «continuará» comunica o aspecto repetido ou persistente sugerido pelo imperfeito e pelo contexto.
- source_word: חֶרְמוֹ
  choice: a sua rede
  rationale: O substantivo designa um apetrecho de pesca, provavelmente uma rede de arrasto. «Rede» mantém a metáfora com clareza e evita uma precisão técnica desnecessária no texto principal.
- source_word: וְתָמִיד
  choice: e ... sem cessar
  rationale: תָּמִיד expressa continuidade. «Sem cessar» transmite de modo natural em português a persistência implacável da ação e preserva a ligação coordenativa.
- source_word: לַהֲרֹג
  choice: massacrando
  rationale: Embora o verbo signifique basicamente «matar», neste contexto de violência imperial contra nações inteiras, «massacrar» comunica adequadamente a matança brutal e repetida.
- source_word: גּוֹיִם
  choice: nações
  rationale: Aqui גּוֹיִם se refere aos povos ou unidades políticas conquistados pelo opressor caldeu; «nações» é a equivalência contextual mais direta.
- source_word: לֹא יַחְמֹל
  choice: sem ter piedade
  rationale: חמל pode significar «poupar» ou «ter compaixão». A formulação negativa «sem ter piedade» é idiomática e mantém a ausência de compaixão sem excluir a alternativa lexical «sem poupar».
