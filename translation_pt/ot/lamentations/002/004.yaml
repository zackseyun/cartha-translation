base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/004.yaml
  text: He bent his bow like an enemy; his right hand stood ready like a foe[a], and he killed all who were pleasing to the eye in the tent of daughter Zion; he poured out his wrath like fire.
translation:
  language: pt
  text: 'Ele armou o seu arco como um inimigo;

    sua mão direita ficou a postos como um adversário.


    Matou, na tenda da filha de Sião,

    tudo o que era precioso aos olhos;

    derramou como fogo o seu furor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּרַךְ קַשְׁתּוֹ
  choice: armou o seu arco
  rationale: O verbo דָּרַךְ, quando usado com קֶשֶׁת, descreve preparar, vergar ou retesar o arco para atirar. “Armou o seu arco” é natural em português, conserva a imagem militar e não especifica além do necessário o estágio exato da ação.
- source_word: כְּאוֹיֵב
  choice: como um inimigo
  rationale: A preposição כְּ marca comparação. A formulação mantém explicitamente o símile perturbador do hebraico.
- source_word: נִצָּב יְמִינוֹ
  choice: sua mão direita ficou a postos
  rationale: נִצָּב expressa estar de pé, colocado ou em posição. “Ficou a postos” comunica prontidão hostil com naturalidade, preservando a mão direita como sujeito da imagem.
- source_word: כְּצָר
  choice: como um adversário
  rationale: צָר pode designar inimigo, adversário ou opressor. “Adversário” mantém o paralelismo sem repetir exatamente “inimigo”.
- source_word: וַיַּהֲרֹג
  choice: matou
  rationale: Equivalente moderno e direto do verbo comum para matar, sem recorrer a formas arcaizantes.
- source_word: כֹּל מַחֲמַדֵּי עָיִן
  choice: tudo o que era precioso aos olhos
  rationale: A expressão designa aquilo que é desejável, agradável ou precioso à vista. A formulação portuguesa preserva a possível referência tanto a pessoas queridas quanto a coisas belas ou valiosas, sem decidir silenciosamente entre elas.
- source_word: בְּאֹהֶל בַּת־צִיּוֹן
  choice: na tenda da filha de Sião
  rationale: Mantém literalmente “tenda” e conserva a personificação poética בַּת־צִיּוֹן, em vez de reduzi-la simplesmente a Jerusalém.
- source_word: שָׁפַךְ כָּאֵשׁ חֲמָתוֹ
  choice: derramou como fogo o seu furor
  rationale: “Derramou” conserva a metáfora de שָׁפַךְ; “como fogo” mantém o símile, e “furor” comunica a intensidade ardente de חֵמָה em registro solene e atual.
theological_decisions:
- issue: Deus é retratado agindo “como um inimigo” contra Sião
  choice: Manter diretamente os símiles “como um inimigo” e “como um adversário”.
  alternative: Suavizar para “parecia um inimigo” ou explicitar apenas que ele atacou o inimigo.
  rationale: O hebraico apresenta deliberadamente a ação divina em termos de hostilidade contra Sião. A tradução preserva essa tensão teológica sem atenuá-la nem transformá-la em mera aparência.
- issue: Personificação בַּת־צִיּוֹן
  choice: filha de Sião
  alternative: Sião; Jerusalém
  rationale: A personificação é parte essencial da poesia e do lamento pactual do livro; conservá-la evita achatar a imagem.
- issue: Referente de כֹּל מַחֲמַדֵּי עָיִן
  choice: 'Formulação abrangente: “tudo o que era precioso aos olhos”.'
  alternative: “todos os que eram agradáveis aos olhos”, restringindo a expressão a pessoas.
  rationale: Embora o verbo “matou” favoreça pessoas no contexto, a expressão hebraica pode abranger de modo mais amplo pessoas queridas ou coisas belas e preciosas. O texto principal conserva essa ambiguidade, e a nota a explicita.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. O paralelismo e as imagens militares foram preservados; evitou-se tanto o arcaísmo quanto a explicação doutrinária dentro do versículo.
