id: LAM.2.19
reference: Lamentations 2:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ק֣וּמִי רֹ֣נִּי ב/ליל לְ/רֹאשׁ֙ אַשְׁמֻר֔וֹת שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/019.yaml
  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
translation:
  language: pt
  text: Levante-se, clame durante a noite, no início das vigílias; derrame o seu coração como água diante da face do Senhor. Erga as mãos para ele pela vida de seus filhinhos, que desfalecem de fome na entrada de todas as ruas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “em cada esquina”.'
    reason: Alternativa lexical para a expressão hebraica literalmente relacionada à “cabeça” ou ao início das ruas.
lexical_decisions:
- source_word: ק֣וּמִי
  choice: Levante-se
  rationale: Imperativo feminino singular dirigido à Sião/Jerusalém personificada; comunica com naturalidade a convocação urgente.
- source_word: רֹ֣נִּי
  choice: clame
  rationale: Neste contexto de lamentação, indica um grito intenso, não canto de alegria; “clame” preserva a força sem especificar indevidamente o tipo de choro.
- source_word: ב/ליל
  choice: durante a noite
  rationale: Expressa de modo claro e natural a circunstância temporal.
- source_word: לְ/רֹאשׁ אַשְׁמֻרוֹת
  choice: no início das vigílias
  rationale: רֹאשׁ tem aqui o sentido de começo, e אַשְׁמֻרוֹת designa as divisões de vigília noturna; a formulação permanece próxima do hebraico e inteligível.
- source_word: שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ
  choice: derrame o seu coração como água
  rationale: Mantém tanto a metáfora tradicional de exteriorizar plenamente o íntimo quanto a comparação explícita com água.
- source_word: נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י
  choice: diante da face do Senhor
  rationale: Preserva a imagem hebraica da presença direta, embora “diante do Senhor” também fosse possível.
- source_word: שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ
  choice: Erga as mãos para ele
  rationale: Reproduz o gesto corporal de súplica e a direção da oração em português natural.
- source_word: עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ
  choice: pela vida de seus filhinhos
  rationale: עַל indica súplica em favor deles; נֶפֶשׁ refere-se aqui à vida, e עוֹלָלִים a crianças muito pequenas. “Filhinhos” preserva o tom comovente.
- source_word: הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב
  choice: que desfalecem de fome
  rationale: No contexto, o particípio descreve crianças enfraquecidas e prestes a perder os sentidos por causa da fome.
- source_word: בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת
  choice: na entrada de todas as ruas
  rationale: Conserva a imagem espacial de רֹאשׁ, “cabeça/início”, aplicada às ruas; a nota registra a expressão portuguesa mais idiomática.
theological_decisions:
- issue: Tradução de אֲדֹנָי
  choice: o Senhor
  alternative: meu Senhor
  rationale: O texto traz אֲדֹנָי, e não o Tetragrama. “O Senhor” verte o título divino sem introduzir a convenção reservada ao nome YHWH.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos femininos dirigidos à Sião personificada são naturais em português pelo contexto. Conservou-se a imagem vívida “diante da face do Senhor”, e a alternativa idiomática para a última expressão foi colocada em nota.
