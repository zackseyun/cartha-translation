  source_fidelity: A tradução preserva bem a sequência de imagens corporais e a catástrofe coletiva. Contudo, «meu fígado se derramou» enfraquece a voz passiva de נִשְׁפַּךְ; «foi derramado» a representa mais precisamente. A construção final pode refletir melhor o infinitivo hebraico בְּעָטֵף como circunstância de desfalecimento.
  naturalness: O português é em geral moderno e claro. «Bebês que ainda mamam» tem alcance internacional mais amplo e é mais transparente do que «bebês de peito». «Ao desfalecerem» mantém um tom literário natural e condizente com a poesia de lamento.
  terminology: «Entranhas», «fígado», «destruição» e «filha do meu povo» preservam adequadamente as imagens e a personificação hebraicas. A nota explica a expressão poética sem impor uma identificação exclusiva entre povo e cidade.
