  text: כָּל֨וּ בַ/דְּמָע֤וֹת עֵינַ/י֙ חֳמַרְמְר֣וּ מֵעַ֔/י נִשְׁפַּ֤ךְ לָ/אָ֨רֶץ֙ כְּבֵדִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּ֑/י בֵּֽ/עָטֵ֤ף עוֹלֵל֙ וְ/יוֹנֵ֔ק בִּ/רְחֹב֖וֹת קִרְיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/011.yaml
  text: My eyes are spent with tears[a]; my inward parts churn; my liver is poured out to the earth because of the destruction of the daughter of my people[d][c][b], because infant and nursing child faint in the streets of the city.
translation:
  language: pt
  text: Meus olhos se consumiram em lágrimas; minhas entranhas se agitam; meu fígado foi derramado por terra por causa da destruição da filha do meu povo,[a] ao desfalecerem crianças pequenas e bebês que ainda mamam nas ruas da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A filha do meu povo” é uma personificação poética hebraica do povo ou da cidade. A expressão traduzida por “destruição” também pode significar “ruína” ou “quebrantamento”.
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: כָּלוּ בַדְּמָעוֹת עֵינַי
  choice: Meus olhos se consumiram de tanto chorar
  rationale: Expressa o esgotamento causado pelas lágrimas em português natural, preservando a imagem corporal e a intensidade do lamento.
- source_word: חֳמַרְמְרוּ מֵעַי
  choice: minhas entranhas se agitam
  rationale: Mantém a imagem visceral hebraica de profunda angústia; “se agitam” comunica perturbação interna sem recorrer ao menos natural “fervem”.
- source_word: נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי
  choice: meu fígado se derramou por terra
  rationale: Preserva a metáfora corporal concreta e o movimento descendente de colapso presentes no hebraico.
- source_word: עַל שֶׁבֶר
  choice: por causa da destruição
  rationale: No contexto da devastação de Jerusalém, “destruição” comunica com clareza a catástrofe coletiva, embora “quebrantamento” ou “ruína” também sejam possíveis.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: Conserva a personificação poética convencional do hebraico, esclarecida em nota.
- source_word: בֵּעָטֵף
  choice: enquanto ... desfalecem
  rationale: O infinitivo descreve a circunstância concomitante que motiva o lamento; “desfalecem” retrata o colapso por privação sem afirmar necessariamente a morte.
- source_word: עוֹלֵל וְיוֹנֵק
  choice: crianças pequenas e bebês de peito
  rationale: Distingue a criança muito nova daquela que ainda mama, em linguagem corrente e compreensível.
- source_word: בִּרְחֹבוֹת קִרְיָה
  choice: nas ruas da cidade
  rationale: Tradução direta e natural da cena pública de sofrimento.
