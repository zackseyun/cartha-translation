  - severity: medium
    issue: “Meus jovens” para וּבַחוּרַי
    rationale: Em português contemporâneo, “jovens” pode ser inclusivo quanto ao sexo; o hebraico se refere especificamente a homens jovens. “Meus rapazes” preserva essa distinção e permanece natural.
