  text: שָׁכְב֨וּ לָ/אָ֤רֶץ חוּצוֹת֙ נַ֣עַר וְ/זָקֵ֔ן בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י נָפְל֣וּ בֶ/חָ֑רֶב הָרַ֨גְתָּ֙ בְּ/י֣וֹם אַפֶּ֔/ךָ טָבַ֖חְתָּ לֹ֥א חָמָֽלְתָּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/021.yaml
  text: Young and old lie on the ground in the streets[a]; my virgins and my young men have fallen by the sword. You killed them in the day of your anger[b]; you slaughtered without pity.
translation:
  language: pt
  text: Jovens e idosos jazem no chão, nas ruas; minhas virgens e meus rapazes caíram à espada. Tu os mataste no dia da tua ira; massacraste sem piedade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “massacraste, não poupaste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְבוּ לָאָרֶץ
  choice: jazem no chão
  rationale: O perfeito descreve vividamente o estado resultante dos mortos. “Jazem no chão” conserva a imagem concreta e soa natural e solene em português.
- source_word: חוּצוֹת
  choice: pelas ruas
  rationale: Designa os espaços públicos da cidade, como ruas ou praças. “Pelas ruas” é abrangente e idiomático neste contexto.
- source_word: נַעַר וְזָקֵן
  choice: Jovens e idosos
  rationale: O par funciona como merismo para pessoas de todas as idades. O plural idiomático comunica isso claramente.
- source_word: בְּתוּלֹתַי
  choice: minhas virgens
  rationale: Preserva o sentido lexical mais direto de בְּתוּלָה e a primeira pessoa de Sião/Jerusalém, sem generalizá-lo para “jovens mulheres”.
- source_word: וּבַחוּרַי
  choice: meus jovens
  rationale: Refere-se aos homens jovens no vigor da idade. Neste paralelismo, “meus jovens” é claro e evita a leitura indevida de “escolhidos”.
- source_word: נָפְלוּ בֶחָרֶב
  choice: caíram à espada
  rationale: Mantém a expressão hebraica tradicional para morte violenta, sem ampliá-la interpretativamente para “em batalha”.
- source_word: הָרַגְתָּ
  choice: Tu os mataste
  rationale: Mantém a segunda pessoa masculina singular dirigida diretamente a Deus; “os” explicita em português o objeto recuperável do contexto.
- source_word: בְּיוֹם אַפֶּךָ
  choice: no dia da tua ira
  rationale: אַף denota aqui ira. A formulação conserva tanto a referência temporal quanto o tom profético e poético.
- source_word: טָבַחְתָּ
  choice: massacraste
  rationale: Verbo mais forte e gráfico que הָרַגְתָּ; “massacraste” preserva a intensificação da violência em português corrente e digno.
- source_word: לֹא חָמָלְתָּ
  choice: sem piedade
  rationale: Expressa de modo conciso a ausência de compaixão ou de poupar; a nota registra a alternativa formal.
theological_decisions:
- issue: Atribuição direta da matança a Deus
  choice: “Tu os mataste... massacraste”
  alternative: Empregar uma construção passiva ou impessoal que atenue a agência divina
  rationale: O hebraico dirige-se diretamente a Deus e o apresenta como agente. A tradução preserva a tensão teológica do lamento, sem suavizá-la.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Registro poético e digno, com imagens concretas e paralelismo preservados. O tratamento por “tu” mantém a interpelação direta a Deus e concorda com os possessivos “tua”.
