source:
  edition: WLC
  text: וַ/יַּחְמֹ֤ס כַּ/גַּן֙ שֻׂכּ֔/וֹ שִׁחֵ֖ת מוֹעֲד֑/וֹ שִׁכַּ֨ח יְהוָ֤ה בְּ/צִיּוֹן֙ מוֹעֵ֣ד וְ/שַׁבָּ֔ת וַ/יִּנְאַ֥ץ בְּ/זַֽעַם אַפּ֖/וֹ מֶ֥לֶךְ וְ/כֹהֵֽן׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/006.yaml
  text: He has laid waste his shelter like a garden[a]; he has destroyed his appointed meeting place. Yahweh has caused appointed feast and Sabbath to be forgotten in Zion[c][b], and in the indignation of his anger he has spurned king and priest.
translation:
  language: pt
  text: Devastou o seu abrigo como se devasta um jardim[a]; destruiu o seu lugar de reunião[b]. Yahweh fez cair no esquecimento, em Sião, a festa fixada[c] e o sábado; na fúria da sua ira, rejeitou com desprezo rei e sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua cabana” ou “o seu tabernáculo”. O termo hebraico pode indicar abrigo, cabana ou cobertura; a imagem exata é debatida.
    reason: lexical_alternative
  - marker: b
    text: Ou “o seu lugar designado de assembleia”; possivelmente “a sua tenda do encontro”. O termo hebraico está relacionado à palavra traduzida em seguida como “festa fixada”.
    reason: lexical_alternative
  - marker: c
    text: Ou “tempo fixado” ou “festival”. Aqui, em par com “sábado”, o termo provavelmente designa as festas celebradas em tempos fixados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹס
  choice: devastou
  rationale: O piel expressa ação violenta e destrutiva; “devastou” comunica isso de modo natural e conciso.
- source_word: כַּגַּן
  choice: como a um jardim
  rationale: Mantém explicitamente a comparação do hebraico e, com o verbo transitivo, produz uma construção portuguesa clara.
- source_word: שֻׂכּוֹ
  choice: o seu abrigo
  rationale: “Abrigo” preserva a amplitude do termo, que pode designar cabana ou cobertura, sem impor uma referência técnica ao tabernáculo.
- source_word: שִׁחֵת
  choice: destruiu
  rationale: No contexto da devastação de Sião, o verbo indica destruição concreta.
- source_word: מוֹעֲדוֹ
  choice: o seu lugar de reunião determinado
  rationale: O objeto de “destruiu” favorece o sentido espacial de lugar de encontro ou assembleia. “Determinado” também mantém a ligação lexical com o segundo מוֹעֵד.
- source_word: שִׁכַּח
  choice: fez cair no esquecimento
  rationale: Expressa naturalmente o valor causativo do hiphil sem sugerir que Yahweh pessoalmente se esqueceu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: Tradução locativa direta e idiomática.
- source_word: מוֹעֵד
  choice: festa determinada
  rationale: Em paralelo com “sábado”, o termo provavelmente se refere a uma ocasião festiva fixada, sem eliminar as alternativas “tempo determinado” e “festival”.
- source_word: וְשַׁבָּת
  choice: e sábado
  rationale: Tradução simples do termo cultual, sem artigo, em correspondência com a construção hebraica.
- source_word: וַיִּנְאַץ
  choice: rejeitou com desprezo
  rationale: 'Explicita os dois componentes do verbo: rejeição e desdém. É mais transparente ao leitor comum que o isolado “desdenhou”.'
- source_word: בְּזַעַם אַפּוֹ
  choice: na indignação da sua ira
  rationale: Preserva a expressão intensificada formada pelos dois substantivos de ira, mantendo o registro poético.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido do primeiro מוֹעֵד
  choice: 'sentido espacial: “lugar de reunião determinado”'
  alternative: 'sentido temporal: “tempo/festa determinada”; sentido técnico: “tenda do encontro”'
  rationale: Como complemento de “destruiu”, o sentido espacial se ajusta melhor. A repetição posterior do termo junto de “sábado” cria um jogo poético entre o lugar e a ocasião determinados, que a tradução procura conservar.
- issue: Agente do esquecimento das celebrações
  choice: Yahweh fez que festa e sábado caíssem no esquecimento
  alternative: Yahweh esqueceu festa e sábado
  rationale: A forma causativa indica que a devastação promovida por Yahweh suprimiu a observância ou memória dessas ocasiões; não afirma simples falha de memória divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética clara. Mantiveram-se a repetição intensificadora referente à ira e a ambiguidade dos termos cultuais por meio de notas. “Rejeitou com desprezo” evita vocabulário excessivamente raro sem enfraquecer o sentido.
