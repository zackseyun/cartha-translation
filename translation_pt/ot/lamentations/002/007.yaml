source:
  edition: WLC
  text: זָנַ֨ח אֲדֹנָ֤/י מִזְבְּח/וֹ֙ נִאֵ֣ר מִקְדָּשׁ֔/וֹ הִסְגִּיר֙ בְּ/יַד אוֹיֵ֔ב חוֹמֹ֖ת אַרְמְנוֹתֶ֑י/הָ ק֛וֹל נָתְנ֥וּ בְּ/בֵית יְהוָ֖ה כְּ/י֥וֹם מוֹעֵֽד׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/007.yaml
  text: The Lord has rejected his altar[a]; he has abandoned his sanctuary. He has given the walls of her palaces into the hand of the enemy[c][b]. They raised a shout in the house of Yahweh as on the day of an appointed feast.
translation:
  language: pt
  text: O Senhor rejeitou seu altar; repudiou seu santuário.[a] Entregou nas mãos do inimigo as muralhas dos palácios dela.[b] Eles soltaram gritos na casa de Yahweh, como num dia de festa solene.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por “repudiou” é mais forte que o anterior e também pode ser entendido como “desprezou” ou “tratou com repulsa”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “entregou na mão do inimigo”, expressão que significa colocar sob o poder dele.
    reason: idiom_explanation
  - marker: c
    text: Ou “como em dia de festa marcada”; o termo hebraico indica um tempo determinado de reunião ou celebração.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: rejeitou
  rationale: Expressa repúdio ou afastamento no contexto do juízo, sem necessariamente implicar abandono absoluto; distingue-se do verbo seguinte.
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: É a forma portuguesa natural e tradicional para o título divino Adonai.
- source_word: מִזְבְּחוֹ
  choice: seu altar
  rationale: Tradução direta, mantendo o singular e o sufixo possessivo.
- source_word: נִאֵר
  choice: repudiou
  rationale: Mantém a intensificação poética em relação a 'rejeitou' e comunica uma rejeição enérgica sem impor a nuance extrema de 'abominou'.
- source_word: מִקְדָּשׁוֹ
  choice: seu santuário
  rationale: Equivalente corrente para o lugar santo no contexto do templo.
- source_word: הִסְגִּיר בְּיַד אוֹיֵב
  choice: entregou nas mãos do inimigo
  rationale: Reproduz de modo natural em português a imagem idiomática hebraica de colocar sob o poder do inimigo.
- source_word: חוֹמֹת אַרְמְנוֹתֶיהָ
  choice: as muralhas dos palácios dela
  rationale: Preserva a construção do hebraico e o sufixo feminino que remete à cidade personificada; 'palácios' mantém a referência a edifícios urbanos possivelmente fortificados.
- source_word: קוֹל נָתְנוּ
  choice: eles soltaram gritos
  rationale: Traduz idiomaticamente a expressão literal 'deram voz/som' e transmite o clamor hostil no templo.
- source_word: בְּבֵית יְהוָה
  choice: na casa de Yahweh
  rationale: Mantém a imagem literal de 'casa' e translitera o nome divino, distinguindo-o do título Adonai no início do versículo.
- source_word: כְּיוֹם מוֹעֵד
  choice: como num dia de festa solene
  rationale: Comunica o sentido cultual de um tempo festivo determinado e preserva a amarga comparação entre o clamor inimigo e as antigas celebrações.
theological_decisions:
- issue: Tradução do nome divino יְהוָה e do título אֲדֹנָי
  choice: Yahweh para יְהוָה e O Senhor para אֲדֹנָי
  alternative: Substituir ambos por Senhor, diferenciando tipograficamente o nome divino
  rationale: O hebraico emprega aqui tanto um título quanto o nome próprio divino; a tradução os distingue sem confundi-los.
- issue: Intensificação entre זָנַח e נִאֵר
  choice: rejeitou / repudiou
  alternative: rejeitou / desprezou ou usar o mesmo verbo nas duas orações
  rationale: Dois verbos diferentes preservam o paralelismo intensificado do hebraico; 'repudiou' é forte, mas não resolve de maneira excessiva a amplitude lexical de נִאֵר.
- issue: Identidade do sujeito plural em קוֹל נָתְנוּ
  choice: Eles soltaram gritos
  alternative: Os inimigos soltaram gritos
  rationale: O sujeito é inferido do inimigo mencionado antes, mas o texto hebraico não o repete explicitamente; o pronome conserva essa forma sem explicitação adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo poético, enquanto expressões idiomáticas são vertidas naturalmente. Os marcadores [a], [b] e [c] aparecem no texto na ordem correspondente às notas.
