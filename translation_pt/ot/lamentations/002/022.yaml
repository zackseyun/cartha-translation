base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/022.yaml
  text: You summoned my terrors from every side as on an appointed day[a], and on the day of Yahweh’s anger there was no survivor or remnant. Those whom I nurtured and raised[b], my enemy destroyed them.
translation:
  language: pt
  text: Convocaste, como para uma festa, os meus terrores de todos os lados[b]. No dia da ira de Yahweh, não houve sobrevivente nem remanescente. Aqueles que embalei e criei, o meu inimigo os destruiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou “os que me aterrorizavam de todos os lados”. O hebraico pode referir-se aos terrores que cercavam a narradora ou, de modo mais concreto, aos agentes que a aterrorizavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרָא
  choice: Convocaste
  rationale: O qal de קרא está dirigido a Yahweh e, neste contexto, descreve o chamado para que forças ameaçadoras se reúnam; “convocaste” expressa essa reunião melhor que o genérico “chamaste”.
- source_word: כְיוֹם מוֹעֵד
  choice: como para um dia de festa marcada
  rationale: מוֹעֵד designa um tempo determinado e pode indicar uma celebração ou assembleia festiva. A formulação conserva tanto a ideia de ocasião marcada quanto a comparação irônica com a reunião para uma festa.
- source_word: מְגוּרַי מִסָּבִיב
  choice: de todos os lados os meus terrores
  rationale: מְגוּרַי é entendido como “meus terrores”, enquanto מִסָּבִיב comunica cerco vindo de todas as direções. Uma nota registra a possível leitura concreta, “os que me aterrorizavam”.
- source_word: בְּיוֹם אַף יְהוָה
  choice: No dia da ira de Yahweh
  rationale: אַף denota ira neste contexto, e o nome divino יהוה é transliterado como “Yahweh”, preservando sua ocorrência explícita no hebraico.
- source_word: פָּלִיט וְשָׂרִיד
  choice: quem escapasse nem quem sobrevivesse
  rationale: 'Os dois substantivos formam um par enfático: ninguém conseguiu fugir e ninguém permaneceu vivo. A redação verbal é idiomática em português e mantém os dois aspectos.'
- source_word: טִפַּחְתִּי וְרִבִּיתִי
  choice: embalei e criei
  rationale: Os verbos evocam o cuidado terno e a criação de filhos. “Embalei” preserva a imagem afetiva do primeiro verbo, e “criei” comunica a ação de fazê-los crescer.
- source_word: אֹיְבִי כִלָּם
  choice: o meu inimigo os exterminou
  rationale: אֹיְבִי está no singular com sufixo de primeira pessoa, e o piel de כלה expressa levar completamente ao fim ou destruir. “Exterminou” transmite a totalidade trágica da ação.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome divino sem substituí-lo por um título.
- issue: Identidade dos “terrores” convocados
  choice: Manter a expressão figurada “meus terrores” no texto
  alternative: Explicitar “os que me aterrorizavam”
  rationale: O substantivo pode designar os próprios terrores ou, por extensão, os agentes que causam terror. O texto mantém a imagem e a nota preserva a leitura concreta possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da primeira frase foi ajustada para fluência sem perder a comparação irônica com uma convocação festiva. A voz é feminina no contexto literário de Sião/Jerusalém, embora as formas verbais desta frase em português não exijam marcação explícita de gênero.
