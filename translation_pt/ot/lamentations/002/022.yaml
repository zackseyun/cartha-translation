    reason: lexical_alternative
  revision_rationale: A revisão substitui uma construção pouco idiomática por “como para uma festa”, preservando a comparação irônica e registrando a amplitude de מוֹעֵד na nota. Também restaura o par nominal “sobrevivente nem remanescente” e torna a tradução de כלה mais lexicalmente neutra. A nota a permanece disponível como nota lexical, mas não recebe âncora no texto porque a formulação principal não exige desambiguação para compreensão; a âncora b continua corretamente ligada a “terrores”.
