review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração transmite adequadamente a denúncia de visões proféticas falsas e sem valor, e «não expuseram a sua iniquidade» corresponde bem ao hebraico. «Restaurar a sua sorte» é uma tradução defensável da expressão idiomática hebraica, com as alternativas mais literais preservadas em nota. Na última oração, porém, «visões de oráculos falsos» altera a relação sintática: o hebraico diz que os profetas viram oráculos falsos e coisas enganosas, não visões a respeito de oráculos. A revisão elimina essa ambiguidade.'
  naturalness: «Tiveram para você visões» é compreensível, mas pouco idiomático em português moderno. «Tiveram visões ... a seu respeito» mantém o sentido profético e a referência a Jerusalém/Sião com maior naturalidade. «Oráculos falsos e enganosos» é claro e evita a construção inadequada «visões de oráculos».
  terminology: «Profetas», «iniquidade», «oráculos» e «cargas» na nota mantêm registro bíblico digno e inteligível. «Enganosos» exprime de modo direto a força de מַדּוּחִים, isto é, aquilo que desencaminha.
  issues:
  - severity: medium
    issue: «visões de oráculos[b] falsos e ilusões»
    rationale: A preposição «de» faz os oráculos parecerem objeto ou conteúdo secundário das visões. No hebraico, מַשְׂאוֹת («oráculos») e מַדּוּחִים («coisas enganosas/que desencaminham») são o que os profetas viram; devem ser coordenados diretamente.
  - severity: low
    issue: «tiveram para você visões»
    rationale: A posição de «para você» é calcada no hebraico e soa artificial em português. «A seu respeito» comunica naturalmente a referência das visões sem restringir indevidamente a preposição hebraica.
