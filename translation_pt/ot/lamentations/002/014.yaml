  text: נְבִיאַ֗יִ/ךְ חָ֤זוּ לָ/ךְ֙ שָׁ֣וְא וְ/תָפֵ֔ל וְ/לֹֽא גִלּ֥וּ עַל עֲוֺנֵ֖/ךְ לְ/הָשִׁ֣יב שבית/ך וַ/יֶּ֣חֱזוּ לָ֔/ךְ מַשְׂא֥וֹת שָׁ֖וְא וּ/מַדּוּחִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/014.yaml
  text: Your prophets saw for you falsehood and folly[a], and they did not uncover your iniquity to restore your fortunes; instead[b], they saw for you false oracles and delusions.
translation:
  language: pt
  text: Seus profetas tiveram visões falsas e sem valor a seu respeito; não expuseram a sua iniquidade para restaurar a sua sorte[a]. Em vez disso, tiveram, a seu respeito, oráculos[b] falsos e enganosos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para reverter o seu cativeiro” ou “para trazer de volta os seus cativos”. A expressão hebraica muitas vezes se refere à restauração de um povo após calamidade ou exílio.
    reason: alternative_reading
  - marker: b
    text: Ou “cargas”, tradução tradicional deste termo profético.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאַיִךְ
  choice: seus profetas
  rationale: O substantivo plural com sufixo feminino singular se dirige a Sião/Jerusalém e designa os profetas que lhe falavam; “seus profetas” é natural e não introduz distinção de gênero ausente do contexto.
- source_word: חָזוּ ... וַיֶּחֱזוּ
  choice: tiveram ... visões
  rationale: O verbo חזה significa literalmente “ver”, especialmente em experiência profética. Em português, “ter visões” comunica naturalmente esse uso sem reduzi-lo simplesmente a “profetizar”.
- source_word: לָךְ
  choice: para você
  rationale: 'A preposição indica referência ou benefício: os profetas tinham visões dirigidas a Jerusalém ou a respeito dela. A formulação mantém o endereço retórico feminino singular sem precisar repetir “Jerusalém”.'
- source_word: שָׁוְא וְתָפֵל
  choice: falsas e sem valor
  rationale: שָׁוְא indica falsidade, vazio ou engano; תָפֵל descreve algo insípido, absurdo ou destituído de valor. A combinação portuguesa preserva tanto a falsidade quanto a inutilidade das visões.
- source_word: גִלּוּ עַל עֲוֺנֵךְ
  choice: expuseram a sua iniquidade
  rationale: A expressão retrata o ato de descobrir ou pôr a nu a culpa. “Expuseram” é idiomático em português, enquanto “iniquidade” conserva o peso moral de עָוֹן.
- source_word: לְהָשִׁיב שְׁבִיתֵךְ
  choice: para restaurar a sua sorte
  rationale: A expressão pode se referir literalmente à reversão do cativeiro ou à restauração mais ampla de uma condição arruinada. “Restaurar a sua sorte” conserva o sentido abrangente e recebe nota com as alternativas mais literais.
- source_word: מַשְׂאוֹת
  choice: oráculos
  rationale: מַשָּׂא designa aqui pronunciamentos proféticos, embora seu sentido tradicional literal seja “cargas”. “Oráculos” comunica com clareza o gênero do discurso, e a alternativa tradicional é registrada em nota.
- source_word: מַדּוּחִים
  choice: ilusões
  rationale: O termo deriva da ideia de desviar ou desencaminhar e denota coisas enganosas que levam ao erro. “Ilusões” preserva a natureza enganadora sem acrescentar explicitamente “visões” ao substantivo.
theological_decisions:
- issue: Sentido de לְהָשִׁיב שְׁבִיתֵךְ
  choice: restaurar a sua sorte
  alternative: reverter o seu cativeiro; trazer de volta os seus cativos
  rationale: A expressão hebraica admite uma leitura ligada especificamente ao cativeiro e também funciona como fórmula mais ampla de restauração. O contexto destaca a reversão da calamidade de Jerusalém, sem exigir que a tradução principal escolha apenas uma forma concreta dessa restauração.
- issue: Sentido de מַשְׂאוֹת
  choice: oráculos
  alternative: cargas
  rationale: No uso profético, o termo pode nomear um pronunciamento ou oráculo. A tradução principal torna essa função inteligível ao leitor moderno, enquanto a nota preserva a imagem lexical tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “tiveram ... visões” preserva o campo semântico profético de חזה de modo mais natural que o literal “viram para você”. Os marcadores foram colocados junto às expressões que suas respectivas notas explicam.
