revisions:
- from: Seus profetas tiveram para você visões falsas e sem valor; não expuseram a sua iniquidade para restaurar a sua sorte[a]. Em vez disso, tiveram para você visões de oráculos[b] falsos e ilusões.
  to: Seus profetas tiveram visões falsas e sem valor a seu respeito; não expuseram a sua iniquidade para restaurar a sua sorte[a]. Em vez disso, tiveram, a seu respeito, oráculos[b] falsos e enganosos.
  rationale: A revisão corrige a construção sintática da última oração, preservando os dois substantivos hebraicos como conteúdos coordenados da visão profética. Também torna mais natural a expressão da referência a Sião/Jerusalém. Os marcadores permanecem ancorados, respectivamente, na expressão idiomática de restauração e no termo «oráculos».
