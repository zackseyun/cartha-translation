  text: הָיָ֨ה אֲדֹנָ֤/י כְּ/אוֹיֵב֙ בִּלַּ֣ע יִשְׂרָאֵ֔ל בִּלַּע֙ כָּל אַרְמְנוֹתֶ֔י/הָ שִׁחֵ֖ת מִבְצָרָ֑י/ו וַ/יֶּ֨רֶב֙ בְּ/בַת יְהוּדָ֔ה תַּאֲנִיָּ֖ה וַ/אֲנִיָּֽה׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/005.yaml
  text: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
translation:
  language: pt
  text: O Senhor tornou-se como um inimigo; engoliu Israel. Engoliu todos os palácios dela; destruiu as fortalezas dele[a] e multiplicou o pranto e a lamentação na Filha de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «as fortalezas dele». Algumas traduções ajustam para «as fortalezas dela», em concordância com «os palácios dela», mas o Texto Massorético traz um sufixo masculino singular.'
    reason: textual_variant
lexical_decisions:
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: Tradução corrente do título divino, adequada ao português bíblico moderno e claramente referente a Deus neste contexto de juízo.
- source_word: הָיָה ... כְּאוֹיֵב
  choice: tornou-se como um inimigo
  rationale: Preserva tanto a possível mudança de postura expressa por הָיָה quanto a comparação explícita introduzida por כְּ, sem transformar a semelhança em identidade.
- source_word: בִּלַּע
  choice: engoliu
  rationale: Mantém a imagem concreta e vigorosa do hebraico, usada metaforicamente para devastação completa.
- source_word: כָּל אַרְמְנוֹתֶיהָ
  choice: todos os palácios dela
  rationale: אַרְמוֹן pode designar palácio ou cidadela; «palácios» é natural no contexto, e «dela» conserva o sufixo feminino referente a Israel personificada.
- source_word: שִׁחֵת
  choice: destruiu
  rationale: Equivalente claro e forte para a ação de arruinar ou devastar.
- source_word: מִבְצָרָיו
  choice: as fortalezas dele
  rationale: מִבְצָר designa lugares fortificados, e «dele» preserva o sufixo masculino singular do Texto Massorético, apesar da mudança em relação ao feminino anterior.
- source_word: וַיֶּרֶב
  choice: multiplicou
  rationale: 'Conserva de modo conciso o valor causativo da forma verbal: fez aumentar ou tornou abundante.'
- source_word: בְּבַת יְהוּדָה
  choice: na Filha de Judá
  rationale: Mantém a personificação poética do povo ou da cidade, sem reduzi-la simplesmente a «Judá».
- source_word: תַּאֲנִיָּה וַאֲנִיָּה
  choice: o pranto e a lamentação
  rationale: Reproduz o par intensificador de termos quase sinônimos em linguagem portuguesa natural e solene.
theological_decisions:
- issue: Se a relação entre o Senhor e o inimigo deve ser traduzida como identidade ou comparação
  choice: O Senhor tornou-se como um inimigo
  alternative: O Senhor tornou-se um inimigo; O Senhor era como um inimigo
  rationale: A partícula comparativa כְּ exige que se preserve a ideia de «como». «Tornou-se» comunica a mudança de postura percebida na lamentação, sem afirmar que Deus seja literalmente inimigo em essência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A imagem de «engolir» e a personificação «Filha de Judá» foram preservadas por seu valor poético. A alternância deliberadamente estranha entre «dela» e «dele» segue a forma do Texto Massorético e é explicada em nota.
