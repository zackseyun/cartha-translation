id: LAM.2.2
reference: Lamentations 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּלַּ֨ע אֲדֹנָ֜/י לא חָמַ֗ל אֵ֚ת כָּל נְא֣וֹת יַעֲקֹ֔ב הָרַ֧ס בְּ/עֶבְרָת֛/וֹ מִבְצְרֵ֥י בַת יְהוּדָ֖ה הִגִּ֣יעַ לָ/אָ֑רֶץ חִלֵּ֥ל מַמְלָכָ֖ה וְ/שָׂרֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/002.yaml
  text: The Lord has swallowed up[a], without pity, all the pastures of Jacob; in his wrath he has torn down the strongholds of daughter Judah; he has brought them down to the ground[c][b]; he has defiled the kingdom and its princes.
translation:
  language: pt
  text: O Senhor engoliu[a], sem piedade, todas as pastagens de Jacó; em sua ira, demoliu as fortalezas da filha de Judá[b] e as lançou por terra; profanou[c] o reino e seus príncipes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devorou”. A imagem hebraica é a de engolir ou consumir. O termo traduzido por “pastagens” também pode significar “moradas” ou “lugares habitados”.
    reason: lexical_alternative
  - marker: b
    text: “Filha de Judá” é uma personificação poética de Judá e de seu povo.
    reason: cultural_note
  - marker: c
    text: Ou “desonrou” ou “contaminou”. O verbo pode expressar profanação, violação ou perda de honra.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: engoliu
  rationale: Preserva a metáfora forte e concreta de engolir ou devorar, em vez de reduzi-la ao sentido genérico de destruir.
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: Traduz o título divino Adonai de modo natural em português, sem empregar a convenção reservada ao Tetragrama.
- source_word: לֹא חָמַל
  choice: sem piedade
  rationale: Expressa de forma concisa tanto a ausência de compaixão quanto a ideia de não poupar.
- source_word: נְאוֹת יַעֲקֹב
  choice: as pastagens de Jacó
  rationale: Mantém a imagem concreta de lugares de pastoreio; como o termo também pode designar moradas ou lugares habitados, essa possibilidade é registrada em nota.
- source_word: הָרַס
  choice: demoliu
  rationale: Comunica com precisão o ato de derrubar estruturas fortificadas e evita um verbo genérico como destruir.
- source_word: בְּעֶבְרָתוֹ
  choice: em sua ira
  rationale: Reproduz o sentido de indignação intensa em linguagem digna e corrente.
- source_word: מִבְצְרֵי
  choice: as fortalezas
  rationale: Conserva claramente o sentido militar de lugares fortificados.
- source_word: בַת יְהוּדָה
  choice: da filha de Judá
  rationale: Preserva a personificação poética hebraica em uma construção natural em português.
- source_word: הִגִּיעַ לָאָרֶץ
  choice: as lançou por terra
  rationale: Torna explícito o objeto retomado, as fortalezas, e expressa idiomaticamente o movimento causativo de fazê-las chegar ao chão.
- source_word: חִלֵּל
  choice: profanou
  rationale: Mantém a força de violação, desonra e dessacralização presente no piel de חלל.
- source_word: מַמְלָכָה
  choice: o reino
  rationale: Designa naturalmente a entidade política, em paralelo com seus príncipes.
- source_word: וְשָׂרֶיהָ
  choice: e seus príncipes
  rationale: Preserva o registro monárquico elevado e o sentido de governantes de alta posição.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: O Senhor
  alternative: Senhor
  rationale: O hebraico traz Adonai, um título, e não o Tetragrama YHWH; por isso, traduz-se o título sem usar a forma tipográfica especial associada ao nome divino.
- issue: Força cultual de חִלֵּל
  choice: profanou
  alternative: desonrou ou contaminou
  rationale: A escolha conserva a possibilidade de dessacralização sem limitar o verbo a uma leitura exclusivamente ritual; as alternativas semânticas são indicadas em nota.
translation_notes:
  register: Português moderno, solene e acessível, com paralelismo poético preservado. O pretérito perfeito apresenta os atos como consumados. Mantiveram-se as imagens fortes do hebraico — engolir, demolir e lançar por terra — sem suavizar a severidade do lamento.
