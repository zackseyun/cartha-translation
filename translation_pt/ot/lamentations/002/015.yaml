base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/015.yaml
  text: 'All who pass along the road clap their hands at you[a]; they hiss and shake their heads over daughter Jerusalem: “Is this the city that they called the perfection of beauty[c][b], the joy of all the earth?”'
translation:
  language: pt
  text: 'Todos os que passam pelo caminho batem palmas contra você; assobiam[a] e balançam a cabeça contra a filha Jerusalém[b]: “É esta a cidade que chamavam de perfeição da beleza[c], a alegria de toda a terra?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “silvam”. O verbo hebraico pode designar um som agudo de desprezo, traduzido como assobio ou silvo.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “filha Jerusalém”, personificação poética da cidade.
    reason: cultural_note
  - marker: c
    text: 'Ou: “perfeita em beleza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקוּ ... כַּפַּיִם
  choice: batem palmas
  rationale: A expressão descreve bater uma palma contra a outra. Em português atual, “bater palmas” é a forma natural; o contexto deixa claro que o gesto é de zombaria, não de aprovação.
- source_word: עָלַיִךְ
  choice: zombando de você
  rationale: A preposição dirige o gesto contra Jerusalém. A formulação explicita em português a orientação hostil que o contexto comunica, evitando que “bater palmas para você” pareça elogio.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: Todos os que passam pelo caminho
  rationale: Mantém a referência explícita ao caminho e descreve naturalmente os viajantes que passam.
- source_word: שָׁרְקוּ
  choice: assobiam
  rationale: O verbo pode indicar assobio ou silvo, aqui como som de desprezo. “Assobiam” é corrente e preserva a ação concreta; a nota registra a alternativa.
- source_word: וַיָּנִעוּ רֹאשָׁם
  choice: balançam a cabeça
  rationale: Expressa de modo idiomático o gesto de escárnio ou espanto, sem acrescentar uma interpretação mais específica.
- source_word: עַל בַּת יְרוּשָׁלָם
  choice: diante da filha Jerusalém
  rationale: “Filha Jerusalém” conserva a personificação poética da cidade. “Diante de” apresenta os gestos como dirigidos a ela sem repetir uma construção hostil pesada.
- source_word: הֲזֹאת הָעִיר
  choice: É esta a cidade
  rationale: Reproduz com naturalidade a pergunta retórica e desdenhosa.
- source_word: שֶׁיֹּאמְרוּ
  choice: que chamavam
  rationale: O imperfeito descreve aquilo que as pessoas costumavam dizer da cidade; “chamavam” comunica essa reputação anterior.
- source_word: כְּלִילַת יֹפִי
  choice: perfeição da beleza
  rationale: Preserva a construção nominal e a ideia de beleza completa ou consumada, deixando em nota a alternativa adjetival.
- source_word: מָשׂוֹשׂ לְכָל הָאָרֶץ
  choice: a alegria de toda a terra
  rationale: Tradução direta e idiomática que mantém a abrangência universal da expressão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A personificação “filha Jerusalém” e a pergunta retórica foram preservadas; formas excessivamente arcaicas, como “menear a cabeça”, foram evitadas.
