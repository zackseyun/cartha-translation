  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
translation:
  language: pt
  text: Yahweh decidiu destruir a muralha da filha de Sião[a]; estendeu o cordel de medir; não fez sua mão recuar de devorar[b]. Fez o baluarte e a muralha se lamentarem; juntos definham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica personifica Sião, isto é, Jerusalém, como uma filha.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de engolir”. O hebraico usa uma imagem vívida de destruição que consome por completo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁב
  choice: decidiu
  rationale: No contexto, expressa uma intenção deliberada e definida de Yahweh; “decidiu” é natural em português e conserva a ideia de propósito estabelecido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְהַשְׁחִית
  choice: destruir
  rationale: O infinitivo no hifil indica causar destruição; “destruir” é direto e idiomático.
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: a muralha da filha de Sião
  rationale: Preserva a relação construta e a personificação poética de Sião como filha, sem reduzi-la simplesmente a “Jerusalém”.
- source_word: נָטָה קָו
  choice: estendeu o cordel de medir
  rationale: Conserva a imagem de uma linha usada para medir e sugere a execução deliberada e precisa da destruição.
- source_word: לֹא הֵשִׁיב יָדוֹ מִבַּלֵּעַ
  choice: não retirou a mão de devorar
  rationale: Reproduz o idioma de não fazer a mão voltar e mantém a metáfora vívida de consumir ou engolir, com formulação compreensível em português.
- source_word: וַיַּאֲבֶל
  choice: Fez ... se lamentarem
  rationale: Expressa o sentido causativo da forma verbal e mantém a personificação das estruturas defensivas.
- source_word: חֵל
  choice: baluarte
  rationale: Designa uma defesa externa ou obra fortificada distinta da muralha principal.
- source_word: וְחוֹמָה
  choice: muralha
  rationale: Mantém o termo para a fortificação principal e o paralelismo poético com “baluarte”.
- source_word: יַחְדָּו אֻמְלָלוּ
  choice: juntos definham
  rationale: “Juntos” marca a condição compartilhada; “definham” comunica enfraquecimento e decadência e preserva a personificação.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Agência divina na destruição
  choice: “decidiu”, “não retirou a mão” e “fez” mantêm Yahweh como agente explícito
  alternative: Empregar formulações passivas ou atribuir a ação apenas aos invasores
  rationale: A sequência verbal hebraica atribui diretamente a Yahweh tanto a decisão quanto a execução do juízo; a tradução não atenua essa tensão teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade para leitores brasileiros. Mantêm-se o paralelismo, a personificação poética das fortificações e a imagem concreta do cordel de medir. “Baluarte” distingue a defesa externa da muralha principal sem recorrer ao mais técnico e menos corrente “antemuro”.
