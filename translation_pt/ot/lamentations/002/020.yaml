  to: 'Olha, ó Yahweh, e vê: a quem trataste assim? Acaso as mulheres devem comer seus próprios filhos,[a] as criancinhas que acalentaram?[b] Acaso sacerdote e profeta devem ser mortos no santuário do Senhor?'
  rationale: A revisão substitui a expressão “o fruto do próprio ventre” por “seus próprios filhos”, que comunica o referente idiomaticamente sem acrescentar “ventre”. A nota [a] mantém a imagem lexical hebraica de “fruto”. Os demais elementos refletem adequadamente o texto hebraico e não exigem alteração.
