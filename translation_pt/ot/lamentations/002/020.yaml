  naturalness: O registro é moderno, solene e natural. “Olha, ó Yahweh, e vê” e as perguntas com “Acaso” funcionam bem. “Seus próprios filhos” é mais direto e idiomático do que “o fruto do próprio ventre”, sem perda de sentido, pois a imagem literal fica preservada em nota.
  terminology: “Yahweh” para יהוה e “Senhor” para אֲדֹנָי preservam corretamente a distinção do texto. “Santuário”, “sacerdote” e “profeta” são adequados.
