  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה לְ/מִ֖י עוֹלַ֣לְתָּ כֹּ֑ה אִם תֹּאכַ֨לְנָה נָשִׁ֤ים פִּרְיָ/ם֙ עֹלֲלֵ֣י טִפֻּחִ֔ים אִם יֵהָרֵ֛ג בְּ/מִקְדַּ֥שׁ אֲדֹנָ֖/י כֹּהֵ֥ן וְ/נָבִֽיא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/020.yaml
  text: Look[a], O Yahweh, and see—to whom have you done this? Should women eat their offspring[b], the children they have cared for? Should priest and prophet be killed in the sanctuary of the Lord?
translation:
  language: pt
  text: 'Olha, ó Yahweh, e vê: a quem trataste assim? Acaso as mulheres devem comer seus próprios filhos,[a] as criancinhas que acalentaram?[b] Acaso sacerdote e profeta devem ser mortos no santuário do Senhor?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seu fruto”, isto é, seus próprios filhos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as criancinhas que carregaram nos braços” / “as crianças cuidadas com carinho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Olha ... e vê
  rationale: Preserva os dois imperativos paralelos e a urgência da súplica em português natural e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e o distingue de אֲדֹנָי no fim do versículo.
- source_word: לְמִי עוֹלַלְתָּ כֹּה
  choice: a quem trataste assim?
  rationale: O verbo pode indicar agir ou tratar alguém severamente; esta formulação conserva o objeto pessoal e torna explícito, sem exagero, o sentido contextual.
- source_word: אִם ... תֹּאכַלְנָה
  choice: Acaso ... devem comer
  rationale: Interpreta אִם como introdutor de uma pergunta retórica horrorizada, não como condição comum.
- source_word: פִּרְיָם
  choice: o fruto do próprio ventre
  rationale: Conserva a imagem de 'fruto' e comunica de modo imediatamente compreensível que se trata dos próprios filhos.
- source_word: עֹלֲלֵי טִפֻּחִים
  choice: as criancinhas que acalentaram
  rationale: Expressa tanto a pouca idade quanto o cuidado terno sugerido pelo termo relacionado a carregar, cuidar ou mimar.
- source_word: אִם יֵהָרֵג
  choice: Acaso ... devem ser mortos
  rationale: Mantém a segunda pergunta retórica e a voz passiva do hebraico.
- source_word: בְּמִקְדַּשׁ אֲדֹנָי
  choice: no santuário do Senhor
  rationale: Traduz מִקְדָּשׁ como 'santuário' e preserva אֲדֹנָי como título, em contraste com Yahweh.
theological_decisions:
- issue: As duas designações divinas no mesmo versículo
  choice: יְהוָה como “Yahweh” e אֲדֹנָי como “Senhor”
  alternative: Traduzir ambas por “Senhor”
  rationale: A distinção formal do hebraico é significativa e pode ser preservada claramente em português.
- issue: Força das orações introduzidas por אִם
  choice: Perguntas retóricas com “Acaso”
  alternative: Orações condicionais com “se” ou perguntas preditivas com “será que”
  rationale: O contexto de lamentação apresenta protesto e horror diante do que ocorreu, não uma condição hipotética neutra.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. “Ó” mantém o vocativo poético; “Acaso” comunica perguntas retóricas sem arcaísmo excessivo. Os marcadores [a] e [b] aparecem no texto principal.
