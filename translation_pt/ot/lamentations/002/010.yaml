id: LAM.2.10
reference: Lamentations 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֵשְׁב֨וּ לָ/אָ֤רֶץ יִדְּמוּ֙ זִקְנֵ֣י בַת צִיּ֔וֹן הֶֽעֱל֤וּ עָפָר֙ עַל רֹאשָׁ֔/ם חָגְר֖וּ שַׂקִּ֑ים הוֹרִ֤ידוּ לָ/אָ֨רֶץ֙ רֹאשָׁ֔/ן בְּתוּלֹ֖ת יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/010.yaml
  text: The elders of daughter Zion sit on the ground in silence[a]; they have thrown dust on their heads and put on sackcloth[b]; the virgins of Jerusalem have bowed their heads to the ground.
translation:
  language: pt
  text: Os anciãos da filha de Sião[a] estão sentados no chão, em silêncio; lançaram pó sobre a cabeça e cingiram-se de pano de saco. As virgens de Jerusalém[b] baixaram a cabeça até o chão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filha de Sião” é uma personificação poética de Sião ou Jerusalém.
    reason: cultural_note
  - marker: b
    text: Ou “as jovens de Jerusalém”. O termo hebraico se refere especificamente a virgens ou jovens não casadas, apresentadas aqui como um grupo social em luto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ לָאָרֶץ
  choice: estão sentados no chão
  rationale: Preserva a postura concreta de luto expressa por ישׁב com לָאָרֶץ; o presente descreve naturalmente a cena poética.
- source_word: יִדְּמוּ
  choice: em silêncio
  rationale: Expressa o silêncio ou a imobilidade causada pela dor sem decidir além do que o contexto permite.
- source_word: זִקְנֵי
  choice: os anciãos
  rationale: Comunica tanto idade quanto posição reconhecida na comunidade, sem reduzir o termo a simples velhice nem interpretá-lo apenas como liderança.
- source_word: בַת צִיּוֹן
  choice: da filha de Sião
  rationale: Mantém a personificação poética tradicional de Sião/Jerusalém em português, em vez de substituí-la por uma explicação.
- source_word: הֶעֱלוּ עָפָר עַל רֹאשָׁם
  choice: lançaram pó sobre a cabeça
  rationale: Reproduz com clareza o gesto público de luto; o singular distributivo 'a cabeça' é natural em português.
- source_word: חָגְרוּ שַׂקִּים
  choice: cingiram-se de pano de saco
  rationale: Conserva a imagem corporal do verbo 'cingir' e emprega a expressão portuguesa corrente para o tecido áspero usado no luto.
- source_word: הוֹרִידוּ לָאָרֶץ רֹאשָׁן
  choice: baixaram a cabeça até o chão
  rationale: Mantém o movimento físico de abaixar a cabeça, imagem de profunda aflição e humilhação, sem acrescentar sua interpretação ao texto.
- source_word: בְּתוּלֹת יְרוּשָׁלִָם
  choice: as virgens de Jerusalém
  rationale: Reflete diretamente o termo hebraico para virgens ou jovens não casadas, preservando sua especificidade lexical.
theological_decisions:
- issue: Personificação de Sião
  choice: Preservar 'filha de Sião' no texto
  alternative: Parafrasear como 'o povo de Sião' ou 'Jerusalém'
  rationale: A figura feminina coletiva integra a poesia de Lamentações e não deve ser dissolvida em uma interpretação referencial única.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e as imagens concretas de luto foram preservadas. Empregou-se 'ancião' por seu valor social e etário e 'cingiram-se' para manter a imagem hebraica sem recorrer a formulação excessivamente arcaica.
