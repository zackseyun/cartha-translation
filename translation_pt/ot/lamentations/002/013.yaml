base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/013.yaml
  text: What can I testify for you? What can I compare you to[a], daughter Jerusalem? What can I liken to you, so that I may comfort you, virgin daughter Zion? For your fracture is as great as the sea[b]; who can heal you?
translation:
  language: pt
  text: Que testemunho darei a seu respeito?[a] A que a compararei, ó filha de Jerusalém? A que a igualarei, para consolá-la, ó virgem filha de Sião? Pois sua ruína é vasta como o mar[b]; quem poderá curá-la?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que testemunho darei a você?” O verbo hebraico pode ter o sentido de dar testemunho; a expressão é difícil, e alguns a entendem de modo mais amplo: “Que direi a seu respeito?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua fratura”, “sua ferida” ou “sua destruição”. O termo hebraico indica quebra ou colapso; “ruína” expressa naturalmente, neste contexto, a calamidade da cidade e mantém a imagem da pergunta seguinte sobre cura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲעִידֵךְ
  choice: Que testemunho apresentarei em seu favor?
  rationale: Preserva o campo semântico de testemunho do hifil de עוד e representa o possível valor benefactivo de לָךְ. Como a expressão hebraica é difícil, outras leituras plausíveis são registradas em nota.
- source_word: מָה אֲדַמֶּה לָּךְ
  choice: A que compararei você?
  rationale: Expressa de maneira natural em português a pergunta comparativa introduzida por מָה, sem transformar a pergunta em explicação.
- source_word: הַבַּת יְרוּשָׁלִַם
  choice: ó filha de Jerusalém
  rationale: Mantém a personificação feminina da cidade e torna explícito o vocativo de modo idiomático em português.
- source_word: מָה אַשְׁוֶה לָּךְ
  choice: A que a igualarei?
  rationale: Conserva a segunda formulação comparativa e sua variação lexical, reproduzindo o acúmulo retórico do hebraico.
- source_word: וַאֲנַחֲמֵךְ
  choice: para poder consolá-la
  rationale: 'Comunica a relação de propósito ou resultado: encontrar algo comparável possibilitaria oferecer consolo.'
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: ó virgem filha de Sião
  rationale: Preserva בתולה em seu sentido direto e mantém a expressão tradicional de personificação cívica, sem acrescentar uma interpretação sobre pureza moral ou sexual.
- source_word: שִׁבְרֵךְ
  choice: a sua fratura
  rationale: Mantém a imagem concreta de quebra ou colapso e se liga coerentemente à pergunta seguinte sobre cura; a amplitude semântica do termo é indicada em nota.
- source_word: גָדוֹל כַּיָּם
  choice: grande como o mar
  rationale: Reproduz diretamente o símile e sua imagem de vastidão sem explicá-lo além do texto.
- source_word: מִי יִרְפָּא לָךְ
  choice: quem poderá curá-la?
  rationale: Mantém o verbo רפא como 'curar'; 'poderá' transmite a força retórica da pergunta diante da dimensão extrema da calamidade.
