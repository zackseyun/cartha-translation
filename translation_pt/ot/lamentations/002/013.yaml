translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas naturais para leitores brasileiros. Os vocativos com “ó” preservam o tom poético da lamentação. A alternância entre “compararei” e “igualarei” reflete os dois verbos hebraicos próximos, e as repetições interrogativas foram mantidas.
