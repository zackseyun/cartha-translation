id: LAM.2.3
reference: Lamentations 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גָּדַ֣ע בָּֽ/חֳרִי אַ֗ף כֹּ֚ל קֶ֣רֶן יִשְׂרָאֵ֔ל הֵשִׁ֥יב אָח֛וֹר יְמִינ֖/וֹ מִ/פְּנֵ֣י אוֹיֵ֑ב וַ/יִּבְעַ֤ר בְּ/יַעֲקֹב֙ כְּ/אֵ֣שׁ לֶֽהָבָ֔ה אָכְלָ֖ה סָבִֽיב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/003.yaml
  text: In burning anger he has cut down every horn of Israel[a]; he has drawn back his right hand from before the enemy[b], and he has burned in Jacob like a flaming fire that devours all around.
translation:
  language: pt
  text: No ardor da sua ira, ele cortou todo chifre de Israel[a]; retirou a sua mão direita diante do inimigo[b] e ardeu em Jacó como fogo em chamas, que devora tudo ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chifre” é uma metáfora hebraica de força, poder ou condição elevada.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fez a sua mão direita recuar diante do inimigo”. A imagem é a de Deus retirando seu poder ou sua proteção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַע
  choice: cortou
  rationale: O verbo expressa cortar ou decepar com força. “Cortou” é direto e natural, além de combinar com a imagem do chifre sem acrescentar a ideia específica de derrubar.
- source_word: בָּחֳרִי אַף
  choice: No ardor da sua ira
  rationale: A expressão reúne calor/ardor e ira. A formulação preserva a intensidade térmica e antecipa a imagem do fogo no fim do versículo.
- source_word: כֹּל קֶרֶן יִשְׂרָאֵל
  choice: todo chifre de Israel
  rationale: Mantém a metáfora hebraica do chifre como força, poder ou condição elevada. A nota esclarece a imagem sem substituí-la no texto.
- source_word: הֵשִׁיב אָחוֹר יְמִינוֹ
  choice: retirou a sua mão direita
  rationale: Expressa de modo natural o gesto de fazê-la recuar, preservando a imagem da retirada do poder ou da proteção divina.
- source_word: מִפְּנֵי אוֹיֵב
  choice: diante do inimigo
  rationale: Reproduz a relação espacial do hebraico sem decidir além do necessário se a ênfase recai na presença do inimigo ou no afastamento em relação a ele.
- source_word: וַיִּבְעַר בְּיַעֲקֹב
  choice: ardeu em Jacó
  rationale: Preserva a construção em que o incêndio destrutivo atua dentro de Jacó e conduz naturalmente à comparação explícita com o fogo.
- source_word: כְּאֵשׁ לֶהָבָה
  choice: como fogo em chamas
  rationale: Formulação corrente em português que conserva a intensificação produzida pela combinação de fogo e chama.
- source_word: אָכְלָה סָבִיב
  choice: que devora tudo ao redor
  rationale: “Devora” mantém a personificação vívida do fogo; “tudo” explicita naturalmente o alcance abrangente de סָבִיב no contexto.
theological_decisions:
- issue: Linguagem metafórica do juízo divino
  choice: Manter no texto as imagens do “chifre”, da “mão direita” e do fogo consumidor.
  alternative: Interpretar as imagens diretamente como força destruída, poder retirado e juízo devastador.
  rationale: As metáforas sobrepostas são parte essencial da poesia e da teologia do versículo. Preservá-las evita reduzir a tensão entre a ação direta de Deus, a retirada de sua proteção diante do inimigo e sua presença figurada como fogo em Jacó.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e as imagens centrais do hebraico foram preservadas, evitando tanto literalismo pouco natural quanto explicitação teológica excessiva.
