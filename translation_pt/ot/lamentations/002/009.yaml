  text: טָבְע֤וּ בָ/אָ֨רֶץ֙ שְׁעָרֶ֔י/הָ אִבַּ֥ד וְ/שִׁבַּ֖ר בְּרִיחֶ֑י/הָ מַלְכָּ֨/הּ וְ/שָׂרֶ֤י/הָ בַ/גּוֹיִם֙ אֵ֣ין תּוֹרָ֔ה גַּם נְבִיאֶ֕י/הָ לֹא מָצְא֥וּ חָז֖וֹן מֵ/יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/009.yaml
  text: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
translation:
  language: pt
  text: Seus portões afundaram na terra; ele destruiu e quebrou as suas barras. Seu rei e seus príncipes estão entre as nações; não há lei[a]. Até os seus profetas não encontraram visão da parte de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não há instrução”. O termo hebraico torá pode significar lei, instrução ou ensino.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ בָאָרֶץ
  choice: afundaram na terra
  rationale: Preserva a imagem poética dos portões tragados pelo solo; o perfeito hebraico descreve a devastação consumada.
- source_word: שְׁעָרֶיהָ
  choice: seus portões
  rationale: Designa os portões da cidade personificada; “portões” é corrente e claro em português.
- source_word: אִבַּד וְשִׁבַּר
  choice: ele destruiu e quebrou
  rationale: Mantém o sujeito masculino singular implícito como pronome, sem explicitar Yahweh além do que esta oração diz.
- source_word: בְּרִיחֶיהָ
  choice: as suas trancas
  rationale: Refere-se às barras ou ferrolhos que fechavam os portões; “trancas” comunica naturalmente sua função defensiva.
- source_word: מַלְכָּהּ וְשָׂרֶיהָ
  choice: Seu rei e seus príncipes
  rationale: “Príncipes” preserva o caráter político e aristocrático de שׂרים.
- source_word: בַגּוֹיִם
  choice: entre as nações
  rationale: Equivalente amplo e tradicional de גוים, sem introduzir explicitamente a ideia de exílio.
- source_word: אֵין תּוֹרָה
  choice: já não há lei
  rationale: “Lei” expressa de modo conciso a ausência da torá; “já” torna natural em português o estado resultante da catástrofe, sem alterar a negação.
- source_word: גַּם נְבִיאֶיהָ לֹא מָצְאוּ חָזוֹן
  choice: Até os seus profetas deixaram de receber visões
  rationale: O hebraico diz literalmente que não encontraram visão. A formulação portuguesa comunica a ausência continuada de revelação profética e conserva a força climática de גַּם.
- source_word: מֵיְהוָה
  choice: de Yahweh
  rationale: Representa o nome divino explícito no texto hebraico e indica a origem das visões.
theological_decisions:
- issue: Sujeito implícito de אִבַּד e וְשִׁבַּר
  choice: Manter “ele” sem identificar expressamente o agente.
  alternative: “Yahweh destruiu e quebrou”
  rationale: O contexto aponta para Yahweh, mas nesta oração o hebraico traz apenas verbos na terceira pessoa do singular. O pronome preserva essa forma e deixa o contexto fornecer o referente.
- issue: Sentido de תּוֹרָה no contexto
  choice: Traduzir por “lei” no texto principal.
  alternative: “instrução” ou “Torá”
  rationale: “Lei” conserva a associação com a ordem pactual e comunitária, enquanto a nota registra a amplitude lexical do termo.
- issue: Expressão profética לֹא מָצְאוּ חָזוֹן
  choice: Traduzir idiomaticamente como “deixaram de receber visões”.
  alternative: “não encontraram visão”
  rationale: As visões procedem de Yahweh; em português, “receber visões” expressa naturalmente a experiência profética sem especificar o mecanismo da revelação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A personificação feminina de Jerusalém é retomada pelos possessivos, sem necessidade de repetir “dela”. O paralelismo e a progressão da ruína física para o colapso político, legal e profético foram preservados.
