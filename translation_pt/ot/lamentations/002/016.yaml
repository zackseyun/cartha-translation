base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/016.yaml
  text: All your enemies open their mouths against you[a]; they hiss and gnash their teeth. They say, “We have swallowed you up! Surely this is the day we hoped for; we have found it[b], we have seen it.”
translation:
  language: pt
  text: 'Todos os seus inimigos escancaram a boca contra você; assobiam em sinal de desprezo[a] e rangem os dentes. Dizem: “Nós a engolimos[b]! Este é, sim, o dia que esperávamos; nós o encontramos, nós o vimos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode ser traduzido por “silvam” ou “assobiam”; aqui descreve um gesto de zombaria ou desprezo.
    reason: lexical_alternative
  - marker: b
    text: O objeto de “engolimos” está implícito no hebraico. Pode referir-se a Sião/Jerusalém, personificada no feminino (“a”), ou à destinatária (“você”). A imagem de engolir retrata destruição completa.
    reason: textual_ambiguity
lexical_decisions:
- source_word: פָּצוּ ... פִּיהֶם
  choice: escancaram a boca
  rationale: O verbo indica abrir bem ou escancarar, especialmente a boca. A formulação preserva a imagem vívida e hostil do hebraico.
- source_word: עָלַיִךְ
  choice: contra você
  rationale: A preposição, neste contexto de zombaria inimiga dirigida a Sião/Jerusalém, expressa oposição.
- source_word: כָּל אֹיְבַיִךְ
  choice: todos os seus inimigos
  rationale: Reprodução natural da totalidade expressa pelo hebraico.
- source_word: שָׁרְקוּ
  choice: assobiam com desprezo
  rationale: O verbo pode indicar assobiar ou sibilar como reação de escárnio ou espanto. A explicitação 'com desprezo' evita que o assobio seja entendido como elogio.
- source_word: וַיַּחַרְקוּ שֵׁן
  choice: rangem os dentes
  rationale: Equivalente idiomático corrente em português para o gesto hebraico de hostilidade e furor.
- source_word: בִּלָּעְנוּ
  choice: Nós a engolimos
  rationale: 'Preserva a metáfora de engolir como destruição completa. O objeto feminino, não expresso no verbo hebraico, é recuperado do contexto: Sião/Jerusalém, a destinatária personificada.'
- source_word: אַךְ
  choice: sim
  rationale: A partícula acrescenta ênfase triunfante à declaração dos inimigos; 'sim' soa natural no discurso direto sem enfraquecer a afirmação.
- source_word: זֶה הַיּוֹם
  choice: Este é ... o dia
  rationale: Tradução direta da identificação enfática do dia aguardado.
- source_word: שֶׁקִּוִּינֻהוּ
  choice: que esperávamos
  rationale: קוה reúne espera e expectativa; aqui os inimigos aguardavam esse dia com desejo.
- source_word: מָצָאנוּ
  choice: finalmente o alcançamos
  rationale: Embora o sentido básico seja 'encontramos', o objeto implícito é 'o dia'. 'Alcançamos' comunica em português que o momento esperado chegou, enquanto 'finalmente' torna explícito o valor culminante do paralelismo.
- source_word: רָאִינוּ
  choice: finalmente o vimos
  rationale: Mantém o verbo simples e a referência ao dia, além do paralelismo culminante com a oração anterior.
theological_decisions:
- issue: Referente do objeto implícito em בִּלָּעְנוּ
  choice: Pronome feminino 'a', retomando Sião/Jerusalém personificada
  alternative: '''Engolimos você'', harmonizando com a segunda pessoa do restante do discurso'
  rationale: O hebraico não traz sufixo de objeto nessa forma verbal. O feminino mantém a personificação contextual sem afirmar que o próprio verbo especifique gênero; a alternativa é registrada em nota para preservar a ambiguidade referencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “finalmente” procura transmitir a exultação culminante dos inimigos, sem eliminar o paralelismo hebraico. Os marcadores foram colocados junto às expressões que efetivamente explicam.
