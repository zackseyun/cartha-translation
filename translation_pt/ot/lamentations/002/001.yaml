source:
  edition: WLC
  text: אֵיכָה֩ יָעִ֨יב בְּ/אַפּ֤/וֹ אֲדֹנָ/י֙ אֶת בַּת צִיּ֔וֹן הִשְׁלִ֤יךְ מִ/שָּׁמַ֨יִם֙ אֶ֔רֶץ תִּפְאֶ֖רֶת יִשְׂרָאֵ֑ל וְ/לֹא זָכַ֥ר הֲדֹם רַגְלָ֖י/ו בְּ/י֥וֹם אַפּֽ/וֹ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/001.yaml
  text: How the Lord in his anger has clouded over daughter Zion! He has cast from heaven to earth the beauty of Israel[c][b][a], and he did not remember his footstool in the day of his anger.
translation:
  language: pt
  text: Como o Senhor, em sua ira, cobriu de nuvens a filha de Sião![a] Lançou do céu à terra o esplendor de Israel[c] e não se lembrou do estrado dos seus pés[b] no dia da sua ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escureceu” ou “envolveu numa nuvem”. O verbo hebraico evoca a imagem de encobrir com nuvens.
    reason: lexical_alternative
  - marker: b
    text: “O estrado dos seus pés” pode referir-se a Sião, ao templo ou à arca, como lugar associado à presença terrena de Deus.
    reason: alternative_reading
  - marker: c
    text: Ou “a glória de Israel” ou “a beleza de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Como
  rationale: Introduz uma exclamação de lamento, não uma pergunta informativa; preserva a força poética do hebraico sem acrescentar uma interjeição ausente.
- source_word: יָעִיב
  choice: cobriu de nuvens
  rationale: Preserva a imagem verbal de encobrir ou escurecer com uma nuvem, ainda que a formulação seja deliberadamente poética.
- source_word: בְּאַפּוֹ
  choice: em sua ira
  rationale: Traduz idiomaticamente אַף, literalmente associado ao nariz, mas usado aqui no sentido de ira.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino de maneira tradicional, clara e digna em português.
- source_word: בַּת צִיּוֹן
  choice: a filha de Sião
  rationale: Conserva a personificação poética da cidade e de seu povo; esta construção é mais natural em português do que a justaposição compacta do hebraico.
- source_word: הִשְׁלִיךְ
  choice: Lançou
  rationale: Mantém a força do verbo de arremessar e o contraste dramático entre céu e terra.
- source_word: מִשָּׁמַיִם אֶרֶץ
  choice: do céu à terra
  rationale: Reproduz de modo conciso o movimento de exaltação para humilhação expresso no original.
- source_word: תִּפְאֶרֶת יִשְׂרָאֵל
  choice: o esplendor de Israel
  rationale: תִּפְאֶרֶת admite beleza, glória ou esplendor; “esplendor” conserva a amplitude poética sem determinar se o referente é Jerusalém, o templo ou a posição honrosa de Israel.
- source_word: וְלֹא זָכַר
  choice: e não se lembrou
  rationale: É a correspondência lexical direta e preserva as possíveis ressonâncias pactuais de זכר sem parafrasear como “não levou em conta”.
- source_word: הֲדֹם רַגְלָיו
  choice: o estrado dos seus pés
  rationale: Mantém a metáfora hebraica em forma idiomática e compreensível em português, sem identificar seu referente no corpo do texto.
- source_word: בְּיוֹם אַפּוֹ
  choice: no dia da sua ira
  rationale: Preserva a expressão temporal solene e a repetição temática da ira.
theological_decisions:
- issue: Referente de “o estrado dos seus pés”
  choice: A metáfora foi mantida sem especificar o referente no texto principal.
  alternative: Traduzir interpretativamente como “o templo”, “Sião/Jerusalém” ou “a arca”.
  rationale: A expressão pode apontar para Sião, para o templo ou para a arca associada à presença terrena de Deus. O versículo não exige uma única identificação, por isso a ambiguidade foi preservada.
translation_notes:
  register: Português moderno, poético e solene, com ampla legibilidade brasileira. A sintaxe foi levemente ajustada para fluência, mas a imagem das nuvens, a queda do céu à terra, a repetição de “ira” e a ambiguidade de “estrado dos seus pés” foram conservadas.
