base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/018.yaml
  text: 'Their heart cried out to the Lord[a], O wall of daughter Zion: let tears run down like a stream day and night; give yourself no relief[c][b]; let not the apple of your eye rest.'
translation:
  language: pt
  text: O coração deles clamou ao Senhor[a]; ó muralha da filha de Sião, derrama lágrimas como uma torrente[b], dia e noite; não te dês trégua; não descanse a pupila do teu olho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os corações deles clamaram ao Senhor”. O hebraico traz “coração” no singular com um sufixo plural, provavelmente como expressão coletiva.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como um riacho” ou “como um uádi”. A palavra hebraica pode indicar um curso de água, o leito de um ribeiro sazonal ou uma torrente.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “não fique quieta a filha do teu olho”. A expressão hebraica se refere à pupila ou ao olho e, neste contexto, retrata um choro que não cessa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָעַק
  choice: clamou
  rationale: O perfeito qal expressa um clamor intenso; “clamou” é natural, digno e conserva essa força.
- source_word: לִבָּם
  choice: o coração deles
  rationale: Mantém o substantivo hebraico no singular com sufixo plural, refletindo a expressão coletiva sem normalizá-la silenciosamente para o plural.
- source_word: אֶל אֲדֹנָי
  choice: ao Senhor
  rationale: O título divino אֲדֹנָי refere-se aqui ao Deus de Israel; “Senhor” é a forma portuguesa corrente.
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: Ó muralha da filha de Sião
  rationale: Trata a expressão como vocativo, conserva o sentido comum de חוֹמָה e mantém a personificação hebraica “filha de Sião”.
- source_word: הוֹרִידִי
  choice: derrame
  rationale: O imperativo hifil feminino ordena fazer as lágrimas descerem; “derrame lágrimas” comunica isso naturalmente em português.
- source_word: כַנַּחַל דִּמְעָה
  choice: lágrimas como uma torrente
  rationale: נַחַל pode designar um curso de água, uádi ou torrente. “Torrente” preserva a imagem de fluxo abundante; o singular coletivo “lágrima” torna-se plural idiomático em português.
- source_word: יוֹמָם וָלַיְלָה
  choice: dia e noite
  rationale: Equivalente português natural do merismo que indica continuidade.
- source_word: אַל תִּתְּנִי פוּגַת לָךְ
  choice: não se permita nenhuma trégua
  rationale: פוּגָה indica pausa, alívio ou trégua. A formulação mantém a construção reflexiva e não restringe o sentido a sono.
- source_word: אַל תִּדֹּם
  choice: não descanse
  rationale: O verbo significa ficar quieto, calar-se ou cessar. Com a pupila como sujeito, “não descanse” expressa poeticamente que o choro não deve parar.
- source_word: בַּת עֵינֵךְ
  choice: a pupila dos seus olhos
  rationale: A expressão literal “filha do teu olho” designa a pupila ou o próprio olho. “Pupila dos seus olhos” conserva a referência corporal sem recorrer ao falso sentido afetivo que “menina dos olhos” pode assumir em português.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor
  rationale: Neste contexto, o título identifica o Deus de Israel. A leitura “meu Senhor” introduziria em português uma nuance possessiva que o contexto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva o singular coletivo “o coração deles”, a personificação “filha de Sião” e a ordem dirigida à muralha. Os pronomes femininos concordam com “muralha”; a pontuação explicita o vocativo sem eliminar a estranheza poética do hebraico.
