  text: לְ/אִמֹּתָ/ם֙ יֹֽאמְר֔וּ אַיֵּ֖ה דָּגָ֣ן וָ/יָ֑יִן בְּ/הִֽתְעַטְּפָ֤/ם כֶּֽ/חָלָל֙ בִּ/רְחֹב֣וֹת עִ֔יר בְּ/הִשְׁתַּפֵּ֣ךְ נַפְשָׁ֔/ם אֶל חֵ֖יק אִמֹּתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
translation:
  language: pt
  text: 'Dizem às suas mães: “Onde estão os grãos e o vinho?”, enquanto desfalecem como feridos[a] nas ruas da cidade, enquanto a vida deles[b] se derrama no colo de suas mães[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como mortos” ou “como os que foram traspassados”. O termo hebraico pode designar alguém ferido, traspassado ou morto em combate.
    reason: lexical_alternative
  - marker: b
    text: Hebraico néfesh, muitas vezes traduzido por “alma”; aqui significa a vida que se esvai.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “ao seio de suas mães”; a expressão hebraica também pode indicar o colo ou os braços maternos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִמֹּתָם
  choice: às suas mães
  rationale: A preposição לְ indica a quem as crianças dirigem a pergunta; o plural com sufixo possessivo é preservado de modo natural em português.
- source_word: יֹאמְרוּ
  choice: Dizem
  rationale: O imperfeito hebraico integra uma descrição vívida e contínua; o presente comunica a imediatez da lamentação.
- source_word: אַיֵּה דָּגָן וָיָיִן
  choice: Onde estão os grãos e o vinho?
  rationale: A pergunta concreta por provisões básicas é mantida. “Grãos” comunica melhor o sentido coletivo de דָּגָן no português atual do que “cereal”, que no uso brasileiro pode sugerir um produto industrializado.
- source_word: בְּהִתְעַטְּפָם
  choice: enquanto desfalecem
  rationale: O hitpael de עטף descreve o enfraquecimento até o desmaio; “desfalecem” é claro, digno e adequado à cena prolongada.
- source_word: כֶּחָלָל
  choice: como feridos
  rationale: חָלָל pode designar alguém ferido, traspassado ou morto. “Feridos” se ajusta às crianças que ainda falam, sem eliminar a associação com vítimas de guerra; a alternativa mais forte é registrada em nota.
- source_word: בִּרְחֹבוֹת עִיר
  choice: nas ruas da cidade
  rationale: רְחֹבוֹת pode indicar ruas largas ou praças abertas; a formulação escolhida é natural e conserva o cenário urbano público.
- source_word: בְּהִשְׁתַּפֵּךְ נַפְשָׁם
  choice: enquanto a vida deles se derrama
  rationale: נֶפֶשׁ aqui se refere à vida que se extingue. “Vida” comunica o sentido contextual, enquanto “se derrama” preserva a metáfora hebraica.
- source_word: אֶל חֵיק אִמֹּתָם
  choice: no colo de suas mães
  rationale: חֵיק pode significar seio ou colo. “Colo” conserva a imagem materna íntima e é mais natural no português contemporâneo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “enquanto” reproduz o encadeamento das duas construções temporais hebraicas e sustenta o ritmo da cena. A metáfora da vida sendo derramada foi mantida em vez de ser explicada no corpo do versículo.
