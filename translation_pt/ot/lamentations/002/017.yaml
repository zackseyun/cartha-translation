  to: Yahweh fez o que havia planejado; cumpriu[a] sua palavra, que havia ordenado desde os tempos antigos.[b] Demoliu sem ter compaixão; fez o inimigo alegrar-se por causa de você; ergueu o chifre[c] dos seus adversários.
  rationale: A única alteração necessária esclarece o referente de «você» e torna explícita a causação expressa pelo hiphil hebraico, sem introduzir explicação interpretativa adicional. As notas permanecem completas e seus marcadores continuam corretamente posicionados.
