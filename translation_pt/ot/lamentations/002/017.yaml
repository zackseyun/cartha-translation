id: LAM.2.17
reference: Lamentations 2:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עָשָׂ֨ה יְהוָ֜ה אֲשֶׁ֣ר זָמָ֗ם בִּצַּ֤ע אֶמְרָת/וֹ֙ אֲשֶׁ֣ר צִוָּ֣ה מִֽ/ימֵי קֶ֔דֶם הָרַ֖ס וְ/לֹ֣א חָמָ֑ל וַ/יְשַׂמַּ֤ח עָלַ֨יִ/ךְ֙ אוֹיֵ֔ב הֵרִ֖ים קֶ֥רֶן צָרָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/017.yaml
  text: Yahweh has done what he planned[a]; he has fulfilled his word, which he commanded from days of old. He has torn down and has not shown pity; he has made the enemy rejoice over you[c][b]; he has exalted the horn of your foes.
translation:
  language: pt
  text: Yahweh fez o que havia planejado; cumpriu[a] sua palavra, que havia ordenado desde os tempos antigos.[b] Demoliu sem ter compaixão; fez o inimigo alegrar-se por causa de você; ergueu o chifre[c] dos seus adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levou a cabo” ou “executou” sua palavra.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desde os dias antigos”, isto é, há muito tempo.'
    reason: lexical_alternative
  - marker: c
    text: “Chifre” é uma imagem bíblica de força, poder ou honra.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: זָמָם
  choice: havia planejado
  rationale: Expressa uma intenção deliberada anterior, agora realizada, e se encaixa naturalmente no contexto do juízo.
- source_word: בִּצַּע אֶמְרָתוֹ
  choice: cumpriu sua palavra
  rationale: Comunica que Yahweh levou seu pronunciamento à plena execução, sem restringir 'palavra' a uma promessa favorável.
- source_word: אֲשֶׁר צִוָּה
  choice: que havia ordenado
  rationale: Mantém a força direta do verbo 'ordenar' e indica anterioridade em relação ao cumprimento narrado.
- source_word: מִימֵי קֶדֶם
  choice: desde os tempos antigos
  rationale: Transmite com clareza o sentido temporal do idioma hebraico e conserva seu tom poético.
- source_word: הָרַס וְלֹא חָמָל
  choice: Demoliu sem ter compaixão
  rationale: Preserva tanto a imagem concreta de derrubada como a afirmação enfática de que não houve compaixão.
- source_word: וַיְשַׂמַּח עָלַיִךְ אוֹיֵב
  choice: deu ao inimigo motivo para se alegrar por sua causa
  rationale: Reproduz de modo natural em português a construção causativa e a alegria hostil do inimigo diante do que ocorreu a Sião, tratada no feminino singular.
- source_word: הֵרִים קֶרֶן
  choice: ergueu o chifre
  rationale: Conserva a metáfora bíblica concreta de força, poder e honra, esclarecida em nota.
- source_word: צָרָיִךְ
  choice: seus adversários
  rationale: Reflete o plural hebraico e evita confundi-lo com o inimigo singular mencionado antes.
theological_decisions:
- issue: A ação divina na destruição de Jerusalém
  choice: Yahweh permanece o sujeito explícito do planejamento, cumprimento, ato de demolir, ausência de compaixão e fortalecimento dos adversários.
  alternative: Atenuar a causalidade e apresentar os acontecimentos apenas como algo permitido por Deus.
  rationale: Os verbos hebraicos atribuem essas ações diretamente a Yahweh. A tradução preserva essa tensão teológica sem convertê-la em mera permissão indireta.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O paralelismo poético foi preservado por meio de orações breves separadas por ponto e vírgula. A metáfora do chifre foi mantida no texto e explicada em nota.
