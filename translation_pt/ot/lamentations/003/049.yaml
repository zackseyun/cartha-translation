base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/049.yaml
  text: My eye runs down and does not cease[a], without interruption,
translation:
  language: pt
  text: Meu olho se desfaz em lágrimas e não cessa[a], sem descanso,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Meu olho corre e não fica quieto, sem trégua”. O verbo hebraico traduzido por “cessa” também pode significar “ficar quieto”, e o substantivo final pode ser entendido como “pausa”, “trégua” ou “alívio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  choice: Meu olho
  rationale: Mantém o singular hebraico e sua imagem poética, sem suavizá-lo para o plural.
- source_word: נִגְּרָה
  choice: se desfaz em lágrimas
  rationale: Expressa naturalmente em português o olho que verte continuamente, tornando explícitas as lágrimas exigidas pelo contexto, embora não nomeadas no hebraico.
- source_word: וְלֹא תִדְמֶה
  choice: e não cessa
  rationale: Conserva a coordenação e comunica o sentido contextual de não parar; a possibilidade lexical de 'não fica quieto' é preservada na nota.
- source_word: מֵאֵין הֲפֻגוֹת
  choice: sem descanso
  rationale: Reproduz de modo conciso a ausência de pausa, trégua ou alívio no choro, com linguagem poética natural.
theological_decisions: []
translation_notes:
  register: Português moderno, poético e digno, com ampla legibilidade brasileira. O singular “meu olho” preserva a forma hebraica; “se desfaz em lágrimas” evita a expressão pouco natural “meu olho escorre”, enquanto mantém a imagem do choro contínuo.
