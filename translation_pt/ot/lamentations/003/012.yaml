  text: He bent his bow and set me up as a target for the arrow[a].
translation:
  language: pt
  text: 'Ele retesou o seu arco

    e me pôs como alvo da flecha.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele armou o seu arco e me colocou como alvo para a flecha.”'
    reason: Alternativas lexicais para דָּרַךְ, וַיַּצִּיבֵנִי e לַחֵץ, preservando a mesma imagem do hebraico.
lexical_decisions:
- source_word: דָּרַךְ
  choice: retesou
  rationale: Com קֶשֶׁת, o verbo descreve a ação de preparar o arco para disparar, isto é, retesá-lo ou armá-lo. “Retesou” preserva a imagem física e é natural em português.
- source_word: קַשְׁתּוֹ
  choice: o seu arco
  rationale: Mantém o substantivo e o sufixo possessivo masculino singular do hebraico.
- source_word: וַיַּצִּיבֵנִי
  choice: e me pôs
  rationale: O verbo יצב significa pôr, colocar ou posicionar. “Me pôs” é claro e idiomático, sem acrescentar ao texto a ideia de permanência.
- source_word: כַּמַּטָּרָא
  choice: como alvo
  rationale: A preposição כ marca comparação, e מַטָּרָא designa alvo. “Como alvo” reproduz diretamente a imagem.
- source_word: לַחֵץ
  choice: da flecha
  rationale: O singular é preservado. Neste contexto, a relação expressa por ל é vertida naturalmente como “alvo da flecha”, isto é, o alvo ao qual a flecha se destina.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação compreensível tanto no Brasil quanto em outros contextos lusófonos. O paralelismo poético foi disposto em duas linhas; a imagem militar e o singular “flecha” foram mantidos.
