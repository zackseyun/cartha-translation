base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/033.yaml
  text: For he does not afflict from his heart or grieve the sons of men[a][b].
translation:
  language: pt
  text: Pois não é de coração[a] que ele aflige nem entristece os filhos do homem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “voluntariamente”; literalmente, “do seu coração”.
    reason: lexical_alternative
  - marker: b
    text: “Os filhos do homem” é uma expressão hebraica que se refere aos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, mantendo com naturalidade o nexo causal do hebraico.
- source_word: לֹא
  choice: não
  rationale: Preserva diretamente a negação simples do texto hebraico.
- source_word: עִנָּה
  choice: aflige
  rationale: Expressa a ação de causar sofrimento ou aflição sem restringi-la a humilhar ou oprimir.
- source_word: מִלִּבּוֹ
  choice: de coração
  rationale: Mantém a imagem concreta do hebraico, literalmente 'do seu coração', em uma expressão portuguesa natural; o sentido possível de agir voluntariamente é indicado em nota.
- source_word: וַיַּגֶּה
  choice: nem entristece
  rationale: No contexto negativo, 'nem' coordena naturalmente os dois verbos; 'entristece' preserva a ideia de causar pesar e evita confundi-la com o verbo anterior.
- source_word: בְנֵי אִישׁ
  choice: os filhos do homem
  rationale: Conserva a expressão hebraica masculina e representativa, com 'homem' no singular conforme אִישׁ, enquanto a nota esclarece que ela se refere aos seres humanos em geral.
theological_decisions:
- issue: Expressão antropomórfica sobre a disposição divina
  choice: de coração
  alternative: voluntariamente; de boa vontade
  rationale: A formulação conserva a imagem hebraica e a tensão de que a aflição não procede do íntimo desejo de Deus, sem reduzir a expressão a uma única interpretação abstrata.
- issue: Expressão masculina representativa
  choice: os filhos do homem
  alternative: os seres humanos; as pessoas
  rationale: A tradução mantém a forma representativa do original, mas esclarece em nota sua referência abrangente à humanidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção preserva o paralelismo poético, a imagem antropomórfica e a expressão representativa do hebraico sem introduzir interpretação denominacional.
