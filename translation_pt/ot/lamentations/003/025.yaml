id: LAM.3.25
reference: Lamentations 3:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ט֤וֹב יְהוָה֙ לְ/קוָֹ֔/ו לְ/נֶ֖פֶשׁ תִּדְרְשֶֽׁ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/025.yaml
  text: Yahweh is good to those who wait for him[a], to the soul that seeks him.
translation:
  language: pt
  text: Yahweh é bom para os que esperam por ele[a], para a pessoa que o busca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para os que põem nele a esperança”; o verbo hebraico inclui a ideia de esperar com expectativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: bom
  rationale: Traduz diretamente o predicativo hebraico e mantém amplo o sentido da bondade e disposição favorável de Yahweh, sem restringi-lo apenas a “bondoso”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְקֹוָו
  choice: para os que esperam por ele
  rationale: קוה expressa espera acompanhada de expectativa. A formulação plural comunica naturalmente em português o valor genérico do particípio plural hebraico; a nuance de esperança é preservada em nota.
- source_word: לְנֶפֶשׁ
  choice: para a pessoa
  rationale: נפש pode designar a pessoa ou o próprio ser. Neste contexto, “pessoa” comunica o referente integral sem sugerir uma antropologia técnica que o texto não exige.
- source_word: תִּדְרְשֶׁנּוּ
  choice: que o busca
  rationale: דרש, tendo Deus como objeto, denota buscá-lo de modo relacional. A forma feminina concorda com נפש, relação preservada em “a pessoa que o busca”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Nuance de קוה
  choice: esperam por ele
  alternative: põem nele a esperança
  rationale: O verbo reúne as ideias de esperar e ter esperança. No contexto de sofrimento e perseverança de Lamentações, “esperam por ele” conserva a demora expectante, enquanto a nota registra explicitamente a nuance de esperança.
- issue: Sentido de נפש
  choice: pessoa
  alternative: alma
  rationale: Embora “alma” reproduza mais formalmente o substantivo, נפש aqui pode referir-se à pessoa inteira. “Pessoa” evita impor uma distinção entre alma e corpo e mantém o paralelismo referente aos que aguardam e buscam Yahweh.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem poética e o paralelismo hebraico foram preservados. “Esperam por ele” é natural e mantém a tensão entre espera e esperança; “a pessoa” comunica o uso amplo de נפש sem tecnicismo antropológico.
