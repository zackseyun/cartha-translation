base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/028.yaml
  text: Let him sit alone and be silent[a], for he has laid it on him.
translation:
  language: pt
  text: Que ele se sente sozinho e permaneça em silêncio, pois ele lhe impôs isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pois ele colocou isso sobre ele». O hebraico deixa implícitos os referentes tanto do sujeito («ele») como do objeto («isso»); também pode ser entendido como «pois ele lhe impôs um fardo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Que ele se sente
  rationale: O imperfeito do qal tem valor exortativo/jussivo no contexto. A construção com «Que ele...» transmite essa força sem converter a frase em simples afirmação ou previsão.
- source_word: בָּדָד
  choice: sozinho
  rationale: Expressa solidão ou isolamento de maneira natural, clara e emocionalmente adequada em português atual.
- source_word: וְיִדֹּם
  choice: e permaneça em silêncio
  rationale: דמם pode indicar silêncio ou quietude. «Permaneça em silêncio» se ajusta ao contexto de submissão na aflição e é mais explícito que «fique quieto».
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação, preservando de forma concisa o sentido causal.
- source_word: נָטַל עָלָיו
  choice: isso foi posto sobre ele
  rationale: A expressão comunica algo colocado ou imposto sobre alguém. A formulação passiva produz português natural sem identificar indevidamente o sujeito implícito nem especificar o objeto omitido.
theological_decisions:
- issue: Sujeito de נָטַל e objeto implícito
  choice: Manter sem identificação tanto quem impôs quanto o que foi imposto, usando «isso foi posto sobre ele».
  alternative: «pois o Senhor pôs isso sobre ele»; ou «pois ele tomou isso sobre si».
  rationale: O hebraico não nomeia explicitamente nem o sujeito de נָטַל nem seu objeto. A voz passiva em português preserva essa abertura sem inserir «o Senhor», sem definir o fardo e sem adotar a leitura reflexiva alternativa.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A construção jussiva foi preservada; a cláusula final usa a voz passiva para evitar uma sequência pronominal obscura e conservar a ambiguidade do hebraico.
