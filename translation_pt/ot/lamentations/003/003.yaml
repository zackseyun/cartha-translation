lexical_decisions:
- source_word: אַךְ
  choice: De fato
  rationale: A partícula tem aqui valor enfático, não restritivo; “De fato” introduz a queixa com naturalidade e dignidade.
- source_word: בִּי
  choice: contra mim
  rationale: No contexto de ação hostil, a preposição com o pronome de primeira pessoa expressa oposição.
- source_word: יָשֻׁב יַהֲפֹךְ
  choice: volta sua mão, vez após vez
  rationale: A sequência dos dois verbos de voltar/virar pode comunicar ação reiterada. A formulação preserva o movimento verbal e explicita naturalmente a repetição.
- source_word: יָדוֹ
  choice: sua mão
  rationale: Mantém a imagem concreta hebraica da mão como instrumento de poder ou ação, sem interpretá-la como “golpe” ou “poder”.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão portuguesa corrente que conserva a duração contínua indicada pelo hebraico.
