  text: רָאִ֤יתָה יְהוָה֙ עַוָּ֣תָתִ֔/י שָׁפְטָ֖/ה מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/059.yaml
  text: You have seen[a], O Yahweh, the wrong done to me[b]; judge my case.
translation:
  language: pt
  text: Tu viste, Yahweh, a injustiça cometida contra mim; julga a minha causa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Tu viste
  rationale: O qal perfeito, segunda pessoa masculina singular, dirige-se diretamente a Yahweh. Em português, o pretérito perfeito expressa com naturalidade a ação passada cuja relevância permanece no apelo presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: עַוָּתָתִי
  choice: a injustiça cometida contra mim
  rationale: O substantivo pode indicar distorção, agravo ou injustiça. O contexto é uma súplica por justiça diante do mal sofrido, não uma confissão de culpa do falante.
- source_word: שָׁפְטָה
  choice: julga
  rationale: O imperativo de שׁפט pede que Deus exerça ação judicial; «julga» preserva de modo direto a metáfora forense.
- source_word: מִשְׁפָּטִי
  choice: a minha causa
  rationale: Neste apelo judicial, מִשְׁפָּטִי designa a causa ou demanda do falante. «Minha causa» é corrente e mantém o sentido jurídico sem antecipar explicitamente um veredito favorável.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio divino. A transliteração preserva essa distinção em vez de substituí-la pelo título tradicional.
- issue: Sentido de עַוָּתָתִי
  choice: a injustiça cometida contra mim
  alternative: o meu agravo
  rationale: 'A construção é entendida objetivamente à luz do contexto: o falante apresenta a injustiça sofrida e pede julgamento. «Meu agravo» preservaria maior concisão, mas poderia soar ambíguo no português atual.'
- issue: Força do pedido שָׁפְטָה מִשְׁפָּטִי
  choice: julga a minha causa
  alternative: faz justiça à minha causa
  rationale: A formulação escolhida conserva o vocabulário judicial e não explicita antecipadamente a vindicação, embora ela seja pragmaticamente esperada no contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento direto por «tu» para refletir a segunda pessoa singular hebraica. A ordem vocativa foi mantida de forma natural. Não se acrescentaram notas porque as alternativas lexicais não são necessárias para compreender esta linha curta, e não há marcador no texto principal.
