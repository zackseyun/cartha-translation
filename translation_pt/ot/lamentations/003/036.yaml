  text: לְ/עַוֵּ֤ת אָדָם֙ בְּ/רִיב֔/וֹ אֲדֹנָ֖/י לֹ֥א רָאָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/036.yaml
  text: to deny a man justice in his case—the Lord does not approve[a][b].
translation:
  language: pt
  text: negar justiça a um homem em sua causa[a] — o Senhor não vê[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “perverter a causa de um homem”, “prejudicar uma pessoa em sua demanda” ou “torcer o direito de alguém em seu processo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o Senhor não vê”; a expressão também pode ter o sentido de “o Senhor não aprova”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְעַוֵּת
  choice: negar justiça
  rationale: O infinitivo piel de עוה expressa torcer, perverter ou lesar o que é justo. No contexto jurídico indicado por בְּרִיבוֹ, “negar justiça” comunica com naturalidade a injustiça praticada contra a pessoa, sem perder a força legal do hebraico.
- source_word: אָדָם
  choice: um homem
  rationale: O substantivo singular designa um ser humano individual envolvido numa causa. “Um homem” acompanha de perto a forma do texto hebraico, embora o referente possa ser entendido genericamente como uma pessoa.
- source_word: בְּרִיבוֹ
  choice: em sua causa
  rationale: רִיב pode indicar disputa, demanda ou causa judicial. “Em sua causa” é conciso, atual e preserva o sentido forense.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: É o título divino אֲדֹנָי, tradicional e naturalmente vertido em português como “o Senhor”.
- source_word: לֹא רָאָה
  choice: não vê
  rationale: A tradução mantém o verbo hebraico ראה, “ver”, e permite que permaneça aberta sua possível dimensão avaliativa, isto é, considerar ou aprovar. O perfeito pode exprimir aqui uma verdade geral, para a qual o presente português é natural.
theological_decisions:
- issue: Se לֹא רָאָה descreve percepção (“não vê”) ou desaprovação (“não aprova”)
  choice: 'Manter a expressão visual: “o Senhor não vê”.'
  alternative: “o Senhor não aprova” ou “o Senhor não consente nisso”.
  rationale: O hebraico emprega literalmente o verbo “ver”, que no contexto pode carregar o sentido de olhar com favor ou aprovar. Preservar “não vê” no texto principal mantém a tensão e a ambiguidade genuínas, enquanto a nota esclarece a implicação avaliativa sem a impor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção infinitiva foi preservada porque o versículo continua a enumeração iniciada nos versículos anteriores. O travessão conserva a mudança para a declaração final, e as notas registram tanto as alternativas jurídicas quanto a ambiguidade do verbo “ver”.
