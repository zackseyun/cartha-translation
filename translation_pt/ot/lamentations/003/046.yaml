base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/046.yaml
  text: All our enemies have opened their mouths against us[a].
translation:
  language: pt
  text: Todos os nossos inimigos escancararam a boca contra nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abriram bem a boca contra nós”. “Escancararam a boca” pode ressaltar o tom hostil ou zombeteiro da expressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצוּ
  choice: escancaram
  rationale: O qal perfeito de פצה, com “boca”, descreve abrir bem a boca e pode carregar força hostil ou zombeteira. O presente em português dá naturalidade ao perfeito hebraico no contexto poético, sem perder o aspecto vívido.
- source_word: עָלֵינוּ
  choice: contra nós
  rationale: Neste contexto de hostilidade, עַל tem sentido adversativo, expresso naturalmente por “contra nós”.
- source_word: פִּיהֶם
  choice: a boca
  rationale: O hebraico traz o substantivo no singular com sufixo plural (“a boca deles”); o singular distributivo “a boca” é natural em português com o sujeito plural.
- source_word: כָּל
  choice: Todos
  rationale: כָּל tem valor coletivo diante de “nossos inimigos”, correspondendo a “todos”.
- source_word: אֹיְבֵינוּ
  choice: os nossos inimigos
  rationale: Tradução direta de אֹיֵב com sufixo da primeira pessoa do plural, adequada à linguagem de lamentação.
