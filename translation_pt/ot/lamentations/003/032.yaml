  text: כִּ֣י אִם הוֹגָ֔ה וְ/רִחַ֖ם כְּ/רֹ֥ב חסד/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/032.yaml
  text: For if he causes grief[b][a], he will also show compassion according to the abundance of his steadfast love.
translation:
  language: pt
  text: Pois, se ele causa tristeza[a], também mostrará compaixão, conforme a abundância do seu amor fiel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, ainda que cause tristeza, terá compaixão conforme a abundância do seu amor fiel.” No contexto, a oração hebraica também pode ser entendida em sentido concessivo.'
    reason: alternative_reading
  - marker: b
    text: “Amor fiel” traduz o hebraico hesed, termo que, conforme o contexto, também pode ser expresso como “amor leal”, “amor de aliança” ou “misericórdia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Preserva tanto a força explicativa de כִּי quanto o valor condicional de אִם, sem eliminar a possível nuance concessiva indicada em nota.
- source_word: הוֹגָה
  choice: causa tristeza
  rationale: O hifil de יגה tem sentido causativo, isto é, provocar pesar ou aflição. “Causa tristeza” mantém essa força e se ajusta ao registro emotivo do lamento.
- source_word: וְרִחַם
  choice: também mostrará compaixão
  rationale: רחם expressa compaixão ou misericórdia. O futuro decorre naturalmente da construção condicional, e “também” torna perceptível o contraste equilibrado pelo waw sem o intensificar em excesso.
- source_word: כְּרֹב
  choice: conforme a abundância de
  rationale: A combinação da preposição כְּ com רֹב indica medida ou padrão; a formulação comunica correspondência e grande quantidade em português natural.
- source_word: חסדו
  choice: seu amor fiel
  rationale: חסד reúne ideias de amor, lealdade e misericórdia. “Amor fiel” é claro e digno, conserva a dimensão relacional do termo e evita confundi-lo com רחם.
theological_decisions:
- issue: Distinção entre רחם e חסד
  choice: Traduzir רחם por “mostrará compaixão” e חסד por “amor fiel”.
  alternative: Empregar linguagem de misericórdia para ambos, como “terá misericórdia” e “suas misericórdias”.
  rationale: Os termos são relacionados, mas não idênticos. Distingui-los preserva a textura hebraica e permite que a ação compassiva seja apresentada em relação à abundância do amor fiel de Deus, sem impor uma formulação doutrinária mais específica.
- issue: Valor condicional ou concessivo de כִּי אִם
  choice: Usar no texto principal a leitura condicional “Pois, se”.
  alternative: “Pois, ainda que cause tristeza, terá compaixão...”
  rationale: A leitura condicional conserva diretamente os elementos da expressão hebraica e sua ligação explicativa com o contexto anterior; a nota registra a legítima nuance concessiva sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A redação mantém o paralelismo entre causar tristeza e mostrar compaixão, distingue os dois termos hebraicos ligados à misericórdia e registra em nota a nuance concessiva possível.
