  source_fidelity: A tradução preserva adequadamente a imagem de água que desce dos olhos, a relação causal introduzida por עַל e a personificação em “a filha do meu povo”. Contudo, “rios de água descem dos meus olhos” é menos idiomático em português do que uma formulação com a ordem mais natural. A alternativa “quebrantamento” na nota pode sugerir contrição ou aflição interior, sentido que não é o mais adequado para שֶׁבֶר neste contexto de calamidade nacional.
  naturalness: “Dos meus olhos descem correntes de água” conserva a ordem poética e soa mais natural e fluente em português moderno. “Correntes de água” representa bem a imagem de fluxos de água sem a escala algo hiperbólica de “rios”.
  terminology: “Destruição” é uma boa opção contextual para שֶׁבֶר. “A filha do meu povo” deve ser mantido, com nota explicativa, pois preserva a personificação hebraica sem impor uma identificação exclusiva com Sião ou Judá.
