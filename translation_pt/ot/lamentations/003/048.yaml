base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/048.yaml
  text: Streams of water run down from my eyes over the destruction of the daughter of my people[a][b].
translation:
  language: pt
  text: Dos meus olhos descem correntes de água por causa da destruição da filha do meu povo[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da ruína” ou “da devastação da filha do meu povo”.
    reason: lexical_alternative
  - marker: b
    text: “A filha do meu povo” é uma expressão poética hebraica que personifica o povo, muitas vezes Sião ou Judá, como uma filha.
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: Rios de água
  rationale: A expressão designa canais ou correntes de água. Em contexto poético de lágrimas, “rios de água” mantém a metáfora vívida e soa natural em português, sem intensificá-la indevidamente.
- source_word: תֵּרַד
  choice: descem
  rationale: O verbo ירד significa literalmente “descer”. O presente “descem” preserva esse movimento e concorda naturalmente com “rios de água” em português.
- source_word: עֵינִי
  choice: dos meus olhos
  rationale: Embora a forma hebraica esteja morfologicamente no singular com sufixo de primeira pessoa, o singular pode representar coletivamente os dois olhos; o plural é mais idiomático em português.
- source_word: עַל
  choice: por causa de
  rationale: A preposição indica aqui a causa ou ocasião do pranto. “Por causa de” expressa essa relação com clareza, sem sugerir que as lágrimas caiam fisicamente sobre o povo.
- source_word: שֶׁבֶר
  choice: destruição
  rationale: No contexto de lamentação, שֶׁבֶר pode indicar ruína, colapso ou devastação. “Destruição” comunica claramente a catástrofe coletiva, enquanto a nota preserva alternativas legítimas.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: A tradução conserva a personificação poética hebraica da comunidade — frequentemente Sião ou Judá — em vez de substituí-la por uma paráfrase interpretativa.
