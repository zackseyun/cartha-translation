base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/042.yaml
  text: We have transgressed and rebelled[a]; you have not forgiven.
translation:
  language: pt
  text: Nós transgredimos e nos rebelamos; tu não perdoaste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַחְנוּ
  choice: Nós
  rationale: Mantém o pronome independente explícito e sua ênfase, além do contraste com o posterior “tu”.
- source_word: פָשַׁעְנוּ
  choice: transgredimos
  rationale: Expressa a violação moral e pactual sem apagar a nuance mais direta de rebeldia do verbo seguinte.
- source_word: וּמָרִינוּ
  choice: e nos rebelamos
  rationale: Preserva o paralelismo verbal e a intensificação produzida pela ideia de rebelião aberta.
- source_word: אַתָּה
  choice: tu
  rationale: Conserva o pronome explícito e enfático do hebraico, formando o contraste “nós...; tu...”.
- source_word: לֹא
  choice: não
  rationale: Reproduz diretamente a negação que modifica o verbo seguinte.
- source_word: סָלָחְתָּ
  choice: perdoaste
  rationale: “Perdoar” é o equivalente corrente e natural em português para o verbo hebraico comum, especialmente usado para o perdão divino; o pretérito perfeito traduz adequadamente a forma hebraica no contexto do lamento.
theological_decisions:
- issue: A ausência do perdão divino no lamento
  choice: tu não perdoaste
  alternative: tu não concedeste perdão
  rationale: A declaração é mantida em toda a sua força, sem atenuar nem explicar a tensão teológica. A tradução apresenta a queixa dirigida diretamente a Deus tal como aparece no texto.
translation_notes:
  register: Português atual, claro e digno, com uso de “tu” para preservar a forma singular e o contraste enfático entre “nós” e “tu”. A formulação concisa acompanha a estrutura poética hebraica.
