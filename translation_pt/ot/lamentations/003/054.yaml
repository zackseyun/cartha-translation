lexical_decisions:
- source_word: צָפוּ
  choice: subiram acima
  rationale: No contexto, o verbo descreve as águas avançando até cobrir ou ultrapassar a cabeça. “Subiram acima” comunica com naturalidade a progressão do afogamento e mantém a alternativa lexical em nota.
- source_word: מַיִם
  choice: as águas
  rationale: O plural “as águas” preserva a forma poética hebraica e soa natural no registro bíblico contemporâneo.
- source_word: עַל רֹאשִׁי
  choice: acima da minha cabeça
  rationale: Expressa concretamente que as águas já ultrapassaram a cabeça do falante, preservando a imagem de afogamento ou angústia extrema.
- source_word: אָמַרְתִּי
  choice: eu disse
  rationale: Tradução direta do verbo hebraico, sem decidir se a fala foi pronunciada ou interior.
- source_word: נִגְזָרְתִּי
  choice: Estou perdido
  rationale: Em português corrente, “estou perdido” comunica a conclusão de que não há mais escape, apropriada à cena de submersão. A imagem hebraica literal de ser cortado ou eliminado é preservada em nota.
theological_decisions:
- issue: Sentido de נִגְזָרְתִּי
  choice: Estou perdido
  alternative: Fui cortado / Estou eliminado / Estou condenado
  rationale: O contexto aponta para a convicção de morte ou ruína iminente, mas o hebraico conserva a metáfora de ser cortado. O texto principal privilegia clareza idiomática, e a nota registra a forma e a amplitude do original sem impor uma interpretação teológica específica.
