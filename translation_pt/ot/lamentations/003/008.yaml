  text: Even when I cry out and call for help[a], he shuts out my prayer.
translation:
  language: pt
  text: Mesmo quando clamo e peço socorro[a], ele bloqueia a minha oração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda que eu clame e grite por socorro, ele bloqueia a minha oração.”'
    reason: Alternativa lexical e sintática que torna mais explícito o valor concessivo de גַּם כִּי e traduz שׁוע por “gritar por socorro”.
lexical_decisions:
- source_word: גַּם כִּי
  choice: Mesmo quando
  rationale: 'A expressão tem força concessiva e intensificadora no contexto: ainda que o sofredor clame, a ação seguinte ocorre. “Mesmo quando” é natural em português e mantém aberta a nuance temporal-concessiva.'
- source_word: אֶזְעַק
  choice: clamo
  rationale: זעק descreve um clamor intenso em situação de aflição. “Clamo” preserva essa força e se ajusta ao registro digno do lamento.
- source_word: וַאֲשַׁוֵּעַ
  choice: e peço socorro
  rationale: No piel, שׁוע expressa um pedido urgente de ajuda. “Peço socorro” distingue o verbo do clamor anterior sem enfraquecer o paralelismo.
- source_word: שָׂתַם
  choice: bloqueia
  rationale: O verbo significa tapar, obstruir ou bloquear. Com “minha oração” como objeto, “bloqueia” comunica diretamente a imagem de uma oração impedida.
- source_word: תְּפִלָּתִי
  choice: a minha oração
  rationale: תְּפִלָּה significa diretamente “oração”; a forma sufixada indica “minha oração”.
theological_decisions:
- issue: Sujeito implícito de שָׂתַם (“bloqueia”)
  choice: Manter o pronome masculino singular “ele”, sem explicitar “Deus” ou “o SENHOR”.
  alternative: 'Identificar expressamente o sujeito como Deus, ou empregar uma construção passiva: “minha oração é bloqueada”.'
  rationale: O verbo hebraico está na terceira pessoa masculina singular, mas o sujeito não é nomeado neste versículo. O contexto identifica o referente; manter “ele” preserva a concisão e evita inserir um nome divino ausente da frase.
- issue: Nuance de גַּם כִּי
  choice: Traduzir por “Mesmo quando”, preservando uma relação temporal com força concessiva.
  alternative: “Ainda que” ou “mesmo que”, com valor concessivo mais explícito.
  rationale: A construção admite sobreposição entre valor temporal e concessivo. A redação principal conserva essa tensão, enquanto a nota registra a alternativa concessiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Clamo” mantém o tom poético do lamento; “peço socorro” e “bloqueia” comunicam o sentido de forma imediata. O pronome “ele” permanece em minúscula porque o texto hebraico não traz um nome ou título divino neste versículo.
