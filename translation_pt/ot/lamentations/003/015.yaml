  yaml_path: translation/ot/lamentations/003/015.yaml
  text: He has filled me with bitterness[a]; he has made me drink wormwood.
translation:
  language: pt
  text: Ele me encheu de amarguras; fez-me beber losna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encharcou-me de losna” ou “deu-me losna até eu me fartar”. O verbo hebraico pode transmitir a ideia de dar de beber abundantemente ou de saturar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׂבִּיעַנִי
  choice: me encheu
  rationale: O hifil de שׂבע significa saciar ou encher. Neste contexto de sofrimento, “me encheu” expressa naturalmente a ideia de receber algo desagradável em abundância, sem a conotação positiva que “me satisfez” poderia ter.
- source_word: בַמְּרוֹרִים
  choice: de amarguras
  rationale: O plural מְרוֹרִים pode designar coisas amargas ou amargura. O plural “amarguras” preserva a forma e comunica de maneira idiomática sofrimentos amargos.
- source_word: הִרְוַנִי
  choice: fez-me beber
  rationale: O hifil de רוה pode significar dar de beber abundantemente, ensopar ou saturar. “Fez-me beber” mantém a imagem concreta da ingestão e o paralelismo com o primeiro segmento.
- source_word: לַעֲנָה
  choice: losna
  rationale: לַעֲנָה refere-se à losna, planta de sabor muito amargo usada figuradamente para sofrimento ou aflição. “Losna” preserva a imagem botânica hebraica e sua ressonância bíblica.
