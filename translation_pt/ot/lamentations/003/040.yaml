  text: נַחְפְּשָׂ֤ה דְרָכֵ֨י/נוּ֙ וְֽ/נַחְקֹ֔רָה וְ/נָשׁ֖וּבָה עַד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/040.yaml
  text: Let us examine our ways and search them out[b][a], and let us return to Yahweh.
translation:
  language: pt
  text: Examinemos os nossos caminhos e os investiguemos, e voltemos para Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַחְפְּשָׂה
  choice: Examinemos
  rationale: O coortativo na primeira pessoa do plural expressa uma exortação coletiva. “Examinemos” comunica uma busca cuidadosa e se ajusta ao contexto de autoavaliação moral.
- source_word: דְרָכֵינוּ
  choice: os nossos caminhos
  rationale: Preserva a metáfora hebraica dos “caminhos” como modo de viver, sem reduzi-la ao sentido abstrato de “conduta”.
- source_word: וְנַחְקֹרָה
  choice: e os investiguemos
  rationale: O segundo coortativo acrescenta a ideia de sondar ou averiguar profundamente. O pronome “os” retoma naturalmente “caminhos” em português.
- source_word: וְנָשׁוּבָה
  choice: e voltemos
  rationale: Mantém o sentido fundamental de virar-se ou retornar, deixando presente, sem explicitação excessiva, sua dimensão de arrependimento e restauração.
- source_word: עַד
  choice: para
  rationale: Com o verbo “voltar”, indica movimento em direção a Yahweh; “para” é natural no português moderno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva como nome, sem substituí-lo pelo título “SENHOR”.
- issue: Sentido de שׁוּב
  choice: voltemos
  alternative: arrependamo-nos; retornemos
  rationale: “Voltemos” preserva a imagem concreta e relacional do hebraico, incluindo a possibilidade contextual de arrependimento sem restringir o verbo a esse sentido teológico.
translation_notes:
  register: Português moderno, claro e digno, com formas exortativas na primeira pessoa do plural. O paralelismo dos dois verbos de exame foi preservado com “examinemos” e “investiguemos”, evitando repetição pouco natural.
