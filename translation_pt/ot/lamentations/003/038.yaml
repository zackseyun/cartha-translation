  text: מִ/פִּ֤י עֶלְיוֹן֙ לֹ֣א תֵצֵ֔א הָ/רָע֖וֹת וְ/הַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/038.yaml
  text: Do not both calamities and good come from the mouth of the Most High?[a]
translation:
  language: pt
  text: Não procedem da boca do Altíssimo tanto as calamidades[a] como o bem?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os males” ou “os desastres”; o termo hebraico pode designar amplamente coisas danosas ou adversas. Aqui, “calamidades” evita restringir o sentido ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/פִּי
  choice: da boca de
  rationale: Preserva a imagem hebraica da boca como fonte de uma palavra, ordem ou decreto, sem reduzir a expressão a uma paráfrase interpretativa.
- source_word: עֶלְיוֹן
  choice: o Altíssimo
  rationale: É o título divino tradicional e natural em português, expressando adequadamente a ideia de supremacia contida no hebraico.
- source_word: לֹא
  choice: Não ...?
  rationale: Embora seja formalmente uma negação, o contexto de Lamentações 3:37–39 favorece sua leitura como pergunta retórica, forma que o português comunica naturalmente.
- source_word: תֵצֵא
  choice: procedem
  rationale: O verbo significa literalmente “sair”. Com “da boca”, “procedem” conserva o sentido de algo que tem nessa fala ou ordem sua origem e mantém um registro digno e natural.
- source_word: הָ/רָעוֹת
  choice: as calamidades
  rationale: O termo pode designar males, desastres ou circunstâncias adversas. “Calamidades” expressa aqui a adversidade sofrida sem determinar que se trate de mal moral.
- source_word: וְ/הַ/טּוֹב
  choice: como o bem
  rationale: O adjetivo singular substantivado abrange aquilo que é bom ou favorável. A construção “tanto... como...” torna clara sua coordenação com “calamidades”.
theological_decisions:
- issue: Se רָעוֹת deve ser traduzido de modo a sugerir mal moral ou acontecimentos adversos
  choice: calamidades
  alternative: males; desastres; coisas ruins
  rationale: O hebraico admite tanto uma referência ampla ao mal quanto, conforme o contexto, a desgraças e adversidades. “Calamidades” preserva a afirmação sobre acontecimentos danosos sob o governo do Altíssimo sem decidir que Deus seja apresentado como autor do mal moral; a nota registra a amplitude lexical.
- issue: Se o versículo deve ser apresentado como pergunta retórica ou como negação declarativa
  choice: pergunta retórica
  alternative: Da boca do Altíssimo não procedem as calamidades e o bem.
  rationale: A sequência de 3:37–39 afirma que nada ocorre sem a ordem do Senhor e conduz a uma exortação diante do sofrimento. Nesse contexto, a negação funciona naturalmente como pergunta retórica, embora a forma declarativa seja gramaticalmente possível quando isolada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem natural da pergunta foi preferida, enquanto “da boca do Altíssimo” conserva a imagem concreta do hebraico. A correlação “tanto... como...” explicita com fluidez a abrangência dos dois polos sem alterar a tensão teológica do texto.
