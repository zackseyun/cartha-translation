  text: קָרָ֤אתִי שִׁמְ/ךָ֙ יְהוָ֔ה מִ/בּ֖וֹר תַּחְתִּיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/055.yaml
  text: I called on your name[a], O Yahweh, from the depths of the pit.
translation:
  language: pt
  text: Invoquei o teu nome, ó Yahweh, das profundezas da cova.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “das partes mais baixas da cova”; ou: “da cova mais profunda”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: קָרָאתִי
  choice: Invoquei
  rationale: O Qal perfeito na primeira pessoa do singular de קרא, seguido de “o teu nome”, expressa aqui o ato de invocar Deus em oração. “Invoquei” comunica naturalmente esse sentido em português sem perder a concisão do hebraico.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Mantém literalmente o idioma hebraico da invocação do nome divino, em vez de reduzi-lo a “te chamei”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: מִבּוֹר
  choice: da cova
  rationale: בּוֹר pode designar cova, cisterna ou calabouço. “Cova” preserva a imagem ampla de um lugar fundo, aprisionador e associado à morte.
- source_word: תַּחְתִּיּוֹת
  choice: das profundezas
  rationale: O plural derivado de תחת indica as regiões inferiores ou mais baixas. Com “cova”, “das profundezas” é natural e conserva a intensidade espacial da expressão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: ó Yahweh
  alternative: ó SENHOR; ó Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança, enquanto “ó” marca com naturalidade o vocativo português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Invoquei” preserva o caráter de oração; “cova” mantém a imagem poética sem restringi-la indevidamente a uma cisterna ou prisão literal.
