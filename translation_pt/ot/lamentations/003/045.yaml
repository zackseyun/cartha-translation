  - severity: low
    issue: «Lixo» é mais coloquial e menos diretamente ligado ao valor de rejeição de מָאוֹס.
    rationale: «Refugo» conserva tanto a ideia de algo descartado como a de objeto desprezado, em registro adequado ao lamento poético.
