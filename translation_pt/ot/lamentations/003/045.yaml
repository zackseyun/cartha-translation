  source_fidelity: A construção hebraica apresenta Deus como aquele que faz/toma «nós» por dois termos de extrema abjeção, entre os povos. «Escória e lixo» transmite a degradação geral, mas «escória» sugere sobretudo resíduo de metal e é menos preciso para סְחִי; «imundície e refugo» representa melhor o par lexical e sua força depreciativa.
  naturalness: «Tu fizeste de nós imundície e refugo no meio dos povos» é português moderno, claro e solene sem arcaísmo excessivo. «No meio dos povos» preserva adequadamente בְּקֶרֶב.
  terminology: «Imundície» e «refugo» refletem de modo mais próximo os sentidos de sujeira/resíduo vil e coisa descartada ou desprezada. «Povos» é apropriado para הָעַמִּים; «nações» permanece uma alternativa contextual legítima.
  issues:
