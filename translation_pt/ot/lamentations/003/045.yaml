base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/045.yaml
  text: You have made us scum and refuse in the midst of the peoples[a][b].
translation:
  language: pt
  text: Tu fizeste de nós imundície e refugo no meio dos povos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escória e lixo”; os dois substantivos raros, usados em conjunto, expressam desprezo e degradação extremos.
    reason: lexical_alternative
  - marker: b
    text: Ou “entre as nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: סְחִי
  choice: escória
  rationale: O substantivo raro designa algo vil, como resíduo raspado ou removido. “Escória” é vívido e corrente em português, comunica degradação extrema e combina naturalmente com o termo seguinte.
- source_word: וּמָאוֹס
  choice: e lixo
  rationale: O termo está ligado à ideia de rejeição ou de algo repugnante. “Lixo” expressa de modo claro algo descartado e desprezado, sem recorrer a formulações artificiais como “coisa rejeitada”.
- source_word: תְּשִׂימֵנוּ
  choice: tu nos tornaste
  rationale: Embora שׂים signifique literalmente “pôr” ou “colocar”, nesta construção predicativa tem o sentido de “fazer/tornar”. O perfeito hebraico é expresso naturalmente pelo pretérito perfeito em português.
- source_word: בְּקֶרֶב
  choice: no meio de
  rationale: Preserva a imagem espacial e social da expressão hebraica e permanece natural no português atual.
- source_word: הָעַמִּים
  choice: os povos
  rationale: O plural עַמִּים refere-se a coletividades étnicas ou nacionais. “Os povos” é a correspondência mais direta, embora “as nações” também seja possível no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com forma de tratamento “tu” para conservar a interpelação direta a Deus. “Escória e lixo” mantém a força áspera e degradante do hebraico; as notas registram alternativas lexicais legítimas sem suavizar a imagem.
