  text: בָּנָ֥ה עָלַ֛/י וַ/יַּקַּ֖ף רֹ֥אשׁ וּ/תְלָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/005.yaml
  text: He has built against me and surrounded me with bitterness and hardship[a][b].
translation:
  language: pt
  text: Ele construiu contra mim[b] e me cercou de amargura[a] e sofrimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de veneno e sofrimento”; רֹאשׁ pode indicar uma substância venenosa ou amarga, tradicionalmente também traduzida por “fel”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “construiu contra mim”; a expressão provavelmente evoca a imagem de um cerco.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: construiu contra
  rationale: Preserva o sentido concreto de “construir” e a metáfora hostil, provavelmente ligada a obras de cerco, sem substituí-la pela interpretação mais explícita “sitiou”.
- source_word: עָלַי
  choice: contra mim
  rationale: Neste contexto hostil, a preposição tem força adversativa; “contra mim” é natural em português e mantém o alvo da ação.
- source_word: וַיַּקַּף
  choice: me cercou
  rationale: Expressa de modo claro e corrente a ação de rodear ou cercar; o objeto “me” é recuperado do contexto poético.
- source_word: רֹאשׁ
  choice: amargura
  rationale: O termo pode designar uma substância amarga ou venenosa e, poeticamente, a amarga aflição. “Amargura” é acessível, enquanto “veneno” permanece uma alternativa genuína indicada em nota.
- source_word: וּתְלָאָה
  choice: e sofrimento
  rationale: O substantivo abrange fadiga, dificuldade e aflição. “Sofrimento” comunica naturalmente a penosa experiência descrita sem restringi-la ao simples cansaço.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a metáfora concreta e incomum do hebraico, esclarecida em nota, e preserva a ambiguidade de רֹאשׁ.
