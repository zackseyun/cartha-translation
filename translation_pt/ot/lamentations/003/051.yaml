  yaml_path: translation/ot/lamentations/003/051.yaml
  text: My eye causes grief to my soul because of all the daughters of my city.
translation:
  language: pt
  text: O meu olho causa sofrimento à minha alma por causa de todas as filhas da minha cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que vejo faz minha alma sofrer por causa de todas as filhas da minha cidade.”'
    reason: Esclarece o provável sentido metonímico de “meu olho” sem substituir a imagem do texto hebraico na tradução principal.
lexical_decisions:
- source_word: עֵינִי
  choice: o meu olho
  rationale: Mantém o singular concreto do hebraico, que pode funcionar metonimicamente para aquilo que o poeta vê.
- source_word: עוֹלְלָה לְנַפְשִׁי
  choice: causa sofrimento à minha alma
  rationale: Expressa a ação danosa ou aflitiva do verbo sobre a vida interior do poeta, sem reduzir a frase a um sentimento específico.
- source_word: בְּנוֹת עִירִי
  choice: filhas da minha cidade
  rationale: Preserva a expressão hebraica, provavelmente referente às mulheres ou jovens da cidade, sem especificar além do texto.
theological_decisions:
- issue: Relação entre o olho e o sofrimento interior
  choice: O olho causa sofrimento à alma
  alternative: O que vejo faz minha alma sofrer
  rationale: A tradução principal conserva a personificação ou metonímia do hebraico; a alternativa explicita o sentido provável, mas elimina parte da imagem poética.
translation_notes:
  register: Português atual, digno e acessível. A construção conserva deliberadamente a imagem poética incomum do olho que causa sofrimento à alma; a nota oferece uma formulação idiomática.
