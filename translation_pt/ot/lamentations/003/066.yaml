    rationale: «De debaixo dos céus» é compreensível, mas é calcada e pesada em português. «De sob os céus» comunica o mesmo sentido espacial e poético de «debaixo de/sob» de modo idiomático.
  - severity: low
    issue: Redação imprecisa na nota b
    rationale: «A remoção total do mundo» pode sugerir que o mundo é removido. O sentido é a remoção deles do mundo que existe sob os céus de Deus.
