base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/066.yaml
  text: You will pursue them in anger and destroy them from under the heavens of Yahweh[a][b].
translation:
  language: pt
  text: Tu os perseguirás com ira e os destruirás de sob os céus de Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que tu os persigas com ira e os destruas”, refletindo a possível força de súplica dos verbos hebraicos no imperfeito.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “de debaixo dos céus de Yahweh”, expressão poética que retrata a remoção total deles do mundo sob os céus de Deus.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּרְדֹּף
  choice: Tu os perseguirás
  rationale: O qal imperfeito, na segunda pessoa masculina singular, dirige-se a Deus. O futuro preserva a forma direta e solene da oração, enquanto a possível força de pedido é indicada em nota.
- source_word: בְּאַף
  choice: com ira
  rationale: אַף significa literalmente “nariz”, mas neste uso idiomático expressa ira; a preposição בְּ indica modo ou circunstância concomitante. “Com ira” é natural e não intensifica indevidamente o termo.
- source_word: וְתַשְׁמִידֵם
  choice: e os destruirás
  rationale: O hifil imperfeito de שׁמד, com sufixo de terceira pessoa masculina plural, significa causar destruição. “Destruir” mantém a força do verbo sem as conotações modernas mais específicas de “exterminar”.
- source_word: מִתַּחַת
  choice: de debaixo
  rationale: Preserva a imagem espacial de remoção completa de tudo o que está sob os céus, embora a construção seja poeticamente incomum em português.
- source_word: שְׁמֵי
  choice: dos céus de
  rationale: O plural construto é mantido como “céus”, em registro poético elevado, em vez de ser reduzido a “céu” ou “firmamento”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Força dos verbos hebraicos no imperfeito em contexto de oração
  choice: 'Futuro direto: “Tu os perseguirás... e os destruirás”'
  alternative: 'Pedido volitivo: “Que tu os persigas... e os destruas”'
  rationale: Os imperfeitos podem soar como declaração futura ou como súplica dirigida a Deus. O texto principal conserva a forma direta e solene, e a nota mantém explícita a leitura volitiva genuinamente possível.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta o nome divino, não um título; “Yahweh” preserva essa distinção.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com preferência por formas claras também para leitores brasileiros. A repetição de “de” em “de debaixo” é mantida para preservar a imagem e a relação sintática do hebraico; as notas esclarecem tanto a força oracional dos verbos quanto a expressão poética final.
