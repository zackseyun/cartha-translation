base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/061.yaml
  text: You have heard their reproach[a], O Yahweh, all their schemes against me.
translation:
  language: pt
  text: Ouviste a afronta deles, Yahweh, e todos os seus planos[a] contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os pensamentos deles a meu respeito”. O substantivo hebraico pode significar “pensamentos” ou “planos”; neste contexto, provavelmente se refere a planos hostis.'
    reason: alternativa lexical
lexical_decisions:
- source_word: שָׁמַעְתָּ
  choice: Ouviste
  rationale: O qal perfeito na segunda pessoa masculina singular se dirige a Yahweh. O pretérito perfeito simples expressa com naturalidade em português uma ação concluída e relevante para a súplica.
- source_word: חֶרְפָּתָם
  choice: a afronta deles
  rationale: חֶרְפָּה abrange afronta, insulto, escárnio e a desonra resultante. “Afronta” conserva tanto a hostilidade verbal quanto a dimensão de vergonha, sem especificar indevidamente sua forma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título. A posição entre vírgulas marca o vocativo em português.
- source_word: כָּל
  choice: todos
  rationale: כָּל modifica o substantivo plural seguinte e é traduzido diretamente por “todos”.
- source_word: מַחְשְׁבֹתָם
  choice: os seus planos
  rationale: O substantivo pode indicar pensamentos, intenções ou planos. No contexto de hostilidade, “planos” comunica naturalmente a ideia de desígnios dirigidos contra o orador sem tornar explícita demais a noção de conspiração.
- source_word: עָלָי
  choice: contra mim
  rationale: Com planos hostis no contexto, עַל assume naturalmente sentido adversativo. A alternativa mais neutra, “a meu respeito”, é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título tradicional.
- issue: Natureza dos מַחְשְׁבוֹת dirigidos ao orador
  choice: planos contra mim
  alternative: pensamentos a meu respeito
  rationale: O contexto favorece intenção hostil, mas o substantivo e a preposição também permitem uma formulação mais neutra. A nota mantém essa ambiguidade lexical sem enfraquecer a leitura contextual no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ouviste” preserva o tom direto da oração; “a afronta deles” mantém o singular coletivo do hebraico, e “Yahweh” aparece como vocativo sem a partícula mais solene “ó”.
