  text: גָּדַ֧ר בַּעֲדִ֛/י וְ/לֹ֥א אֵצֵ֖א הִכְבִּ֥יד נְחָשְׁתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/007.yaml
  text: He has walled me in so that I cannot get out[a]; he has made my chain heavy.
translation:
  language: pt
  text: Ele ergueu um muro à minha volta, de modo que não posso sair; tornou pesada a minha corrente de bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «meu grilhão de bronze»; ou simplesmente: «minha corrente». O termo hebraico está relacionado a «bronze» e provavelmente se refere a uma corrente ou a outro instrumento metálico de restrição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: cercou com um muro
  rationale: O verbo descreve a ação de murar, vedar ou cercar. A expressão mantém a imagem concreta de confinamento e soa natural em português.
- source_word: בַּעֲדִי
  choice: me
  rationale: Com גָּדַר, a preposição e o sufixo indicam que o falante foi fechado ou cercado. Em português, o objeto direto em «me cercou» comunica essa relação de modo idiomático.
- source_word: וְלֹא אֵצֵא
  choice: para que eu não possa sair
  rationale: 'A construção significa literalmente «e não saio/sairei», mas, no contexto do confinamento, exprime o resultado: o falante não consegue sair. «Para que eu não possa sair» preserva essa força sem introduzir a ideia mais específica de fuga.'
- source_word: הִכְבִּיד
  choice: tornou pesada
  rationale: O hifil de כבד significa «fazer ficar pesado». A formulação conserva a imagem concreta e a estrutura verbal do hebraico.
- source_word: נְחָשְׁתִּי
  choice: minha corrente de bronze
  rationale: O substantivo está ligado a «bronze/cobre» e, neste contexto, provavelmente designa por metonímia uma corrente ou grilhão de metal. A tradução explicita tanto o objeto provável quanto a associação material, enquanto a nota registra a incerteza lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A imagem concreta do muro e o paralelismo do confinamento foram preservados; a ambiguidade do objeto metálico foi mantida em nota.
