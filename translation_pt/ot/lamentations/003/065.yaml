  text: תִּתֵּ֤ן לָ/הֶם֙ מְגִנַּת לֵ֔ב תַּאֲלָֽתְ/ךָ֖ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/065.yaml
  text: You will give them hardness of heart[b][a]; your curse will be upon them.
translation:
  language: pt
  text: Tu lhes darás dureza de coração[a][b]; a tua maldição estará sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Que lhes dês dureza de coração; a tua maldição sobre eles». O imperfeito hebraico pode ser entendido como uma imprecação.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, «uma cobertura» ou «um escudo do coração». A expressão é rara; «dureza de coração» traduz o sentido provável neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: Tu lhes darás
  rationale: O qal imperfeito na segunda pessoa masculina singular dirige-se a Deus. O futuro preserva tanto o tom solene da imprecação quanto a possibilidade de ser ouvido como expectativa, sem excluir a leitura volitiva indicada em nota.
- source_word: מְגִנַּת לֵב
  choice: dureza de coração
  rationale: A expressão rara significa literalmente algo como «cobertura/escudo do coração». No paralelismo de juízo, «dureza de coração» comunica de modo claro o provável sentido de insensibilidade ou endurecimento interior.
- source_word: תַּאֲלָתְךָ
  choice: a tua maldição
  rationale: O substantivo relacionado a אלה designa aqui uma maldição ou imprecação. «Maldição» é a forma portuguesa mais natural e direta.
- source_word: לָהֶם ... לָהֶם
  choice: lhes ... sobre eles
  rationale: A repetição hebraica assinala enfaticamente os destinatários. A variação portuguesa evita rigidez sem perder a referência repetida a eles.
theological_decisions:
- issue: O verso como oração imprecatória ou como declaração futura
  choice: Tu lhes darás...; a tua maldição estará sobre eles.
  alternative: Que lhes dês dureza de coração; que a tua maldição caia sobre eles.
  rationale: O imperfeito hebraico permite uma leitura futura e também uma força volitiva ou imprecatória. O texto principal mantém o futuro solene, enquanto a nota conserva explicitamente a alternativa em forma de pedido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de «tu» por se tratar de uma invocação direta e solene a Deus. O ponto e vírgula preserva o paralelismo, e «estará» torna natural em português a oração nominal hebraica final.
