lexical_decisions:
- source_word: דְּרָכַי
  choice: as minhas veredas
  rationale: Preserva o plural e a imagem concreta de caminhos que representam o curso da vida do eu lírico.
- source_word: סוֹרֵר
  choice: desviou
  rationale: Expressa de modo natural em português a ação de fazer as veredas saírem de seu rumo.
- source_word: וַיְפַשְּׁחֵנִי
  choice: me dilacerou
  rationale: O verbo raro comunica uma ação violenta de rasgar. “Dilacerou” mantém a força da imagem sem definir além do texto o modo exato do ataque.
- source_word: שָׂמַנִי
  choice: deixou-me
  rationale: Com o predicativo de estado, comunica naturalmente o resultado produzido, sem sugerir mera colocação espacial.
- source_word: שֹׁמֵם
  choice: desolado
  rationale: Retrata o eu lírico em estado de devastação e ruína, em harmonia com o contexto.
