  yaml_path: translation/ot/lamentations/003/011.yaml
  text: He turned my paths aside and tore me apart[a]; he made me desolate.
translation:
  language: pt
  text: Desviou as minhas veredas e me dilacerou[a]; deixou-me desolado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me despedaçou”. O verbo raro provavelmente descreve um dilaceramento violento, talvez mantendo a imagem de um animal predador presente no contexto.
