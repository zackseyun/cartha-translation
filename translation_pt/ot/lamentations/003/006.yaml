  text: בְּ/מַחֲשַׁכִּ֥ים הוֹשִׁיבַ֖/נִי כְּ/מֵתֵ֥י עוֹלָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/006.yaml
  text: He has made me dwell in darkness like those long dead[a].
translation:
  language: pt
  text: Ele me fez habitar em trevas, como os mortos de muito tempo atrás.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ele me fez sentar em lugares escuros, como os mortos de antigamente».'
    reason: Alternativas lexicais legítimas para בְּמַחֲשַׁכִּים, הוֹשִׁיבַנִי e עוֹלָם.
lexical_decisions:
- source_word: בְּמַחֲשַׁכִּים
  choice: em trevas
  rationale: O plural com a preposição בְּ indica localização, podendo significar «em trevas» ou «em lugares escuros». «Em trevas» é natural, dignificado e preserva a imagem de confinamento na escuridão.
- source_word: הוֹשִׁיבַנִי
  choice: me fez habitar
  rationale: 'O hifil de ישׁב com sufixo de primeira pessoa é causativo: «fez-me sentar/habitar». No contexto de confinamento imposto, «me fez habitar» comunica com naturalidade tanto a causação quanto a permanência.'
- source_word: כְּמֵתֵי
  choice: como os mortos
  rationale: A preposição comparativa כְּ seguida do plural construto de «morto» introduz uma comparação direta, preservada sem explicação adicional.
- source_word: עוֹלָם
  choice: de muito tempo atrás
  rationale: Neste contexto, עוֹלָם provavelmente aponta para um passado remoto, não para eternidade metafísica. A expressão deixa claro que se trata dos que morreram há muito tempo.
theological_decisions:
- issue: Sentido temporal de עוֹלָם aplicado aos mortos
  choice: os mortos de muito tempo atrás
  alternative: os mortos para sempre
  rationale: O contexto favorece antiguidade ou duração remota. A tradução evita introduzir uma afirmação doutrinária sobre o estado eterno dos mortos.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém o tom poético e sombrio do lamento, com sintaxe simples e dignificada.
