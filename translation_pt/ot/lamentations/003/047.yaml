lexical_decisions:
- source_word: פַּחַד
  choice: terror
  rationale: Expressa o medo intenso e ameaçador do hebraico, preservando o paralelismo sonoro com פַּחַת tanto quanto o português permite.
- source_word: פַּחַת
  choice: armadilha
  rationale: No contexto, indica uma cova ou fosso usado como laço; “armadilha” comunica naturalmente a imagem de perigo capturador.
- source_word: הַשֵּׁאת
  choice: devastação
  rationale: O substantivo pode denotar ruína ou desolação; “devastação” se ajusta ao contexto de calamidade coletiva.
- source_word: הַשָּׁבֶר
  choice: destruição
  rationale: Transmite a ideia de quebra, colapso ou ruína, formando um par enfático com “devastação”.
