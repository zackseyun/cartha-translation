  yaml_path: translation/ot/lamentations/003/056.yaml
  text: 'You heard my voice: do not hide your ear from my plea for relief[a], from my cry for help.'
translation:
  language: pt
  text: Ouviste a minha voz; não escondas o teu ouvido do meu pedido de alívio[a], do meu clamor por socorro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não feches o teu ouvido ao meu alívio, ao meu clamor por socorro”. As expressões hebraicas com preposição são difíceis, e podem ser entendidas como complemento de “ouvido” (“ao”) em vez de indicar aquilo de que o ouvido se esconde (“do”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלִי
  choice: a minha voz
  rationale: קוֹל significa normalmente “voz” ou “som”; no contexto de oração, “a minha voz” preserva o apelo pessoal e é natural em português.
- source_word: שָׁמָעְתָּ
  choice: ouviste
  rationale: O Qal perfeito na segunda pessoa masculina singular expressa uma ação passada. “Ouviste” é direto, solene sem ser arcaico e adequado à recordação poética.
- source_word: אַל תַּעְלֵם
  choice: não escondas
  rationale: אַל introduz uma proibição ou súplica negativa urgente, e o Hifil de עלם traz a ideia de esconder ou ocultar. A tradução mantém a metáfora hebraica ligada ao ouvido.
- source_word: אָזְנְךָ
  choice: o teu ouvido
  rationale: Preserva o substantivo concreto no singular e a imagem vívida da oração hebraica.
- source_word: לְרַוְחָתִי
  choice: do meu pedido de alívio
  rationale: רַוְחָה pode indicar alívio, folga ou espaço para respirar. A expressão hebraica é difícil e elíptica; “pedido de alívio” explicita com moderação o sentido provável no paralelismo com o clamor por socorro.
- source_word: לְשַׁוְעָתִי
  choice: do meu clamor por socorro
  rationale: שַׁוְעָה designa um clamor ou súplica urgente por ajuda. “Clamor por socorro” comunica naturalmente essa urgência.
