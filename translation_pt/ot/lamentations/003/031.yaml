  yaml_path: translation/ot/lamentations/003/031.yaml
  text: For the Lord will not reject forever[a].
translation:
  language: pt
  text: Pois o Senhor não rejeitará para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não abandonará” ou “não repudiará”. O verbo hebraico pode indicar rejeitar, repudiar ou abandonar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento do contexto anterior, preservando a força conectiva sem determinar de modo excessivo se é estritamente causal ou enfática.
- source_word: לֹא
  choice: não
  rationale: Negação simples que modifica diretamente o verbo.
- source_word: יִזְנַח
  choice: rejeitará
  rationale: O verbo זנח pode expressar rejeitar, repudiar ou abandonar. “Rejeitará” é claro e natural e mantém aberta a amplitude relacional do termo.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa duração contínua; sob negação, indica que a rejeição do Senhor não é permanente.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino אֲדֹנָי de modo convencional, digno e natural em português, sem confundi-lo com o tetragrama.
theological_decisions:
- issue: Tradução do título divino
  choice: o Senhor
  alternative: Senhor
  rationale: O hebraico traz אֲדֹנָי, um título divino, e não o tetragrama. O artigo produz uma formulação idiomática em português sem introduzir distinções alheias ao texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com legibilidade brasileira. A ordem da frase acompanha naturalmente o hebraico e preserva sua concisão.
