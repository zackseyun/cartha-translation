  text: רַ֧בְתָּ אֲדֹנָ֛/י רִיבֵ֥י נַפְשִׁ֖/י גָּאַ֥לְתָּ חַיָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/058.yaml
  text: You have defended the cause of my soul[a], O Lord; you have redeemed my life.
translation:
  language: pt
  text: Defendeste, ó Senhor, a causa da minha alma[a]; resgataste a minha vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pleiteaste a causa da minha alma” ou “lutaste pela minha vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבְתָּ
  choice: Defendeste
  rationale: O verbo ריב, construído aqui com רִיבֵי, descreve assumir ou conduzir uma causa, especialmente em contexto jurídico. “Defendeste” comunica com naturalidade que o Senhor tomou a causa do poeta para si, sem enfraquecer a imagem legal.
- source_word: אֲדֹנָי
  choice: ó Senhor
  rationale: אֲדֹנָי funciona como título divino e, neste verso, como vocativo. “Ó Senhor” preserva de modo claro e digno a invocação direta.
- source_word: רִיבֵי
  choice: a causa
  rationale: O plural de רִיב tem aqui sentido coletivo ou intensivo, referindo-se à causa ou ao conjunto de contendas do falante. O singular coletivo “a causa” é idiomático em português e mantém a figura jurídica.
- source_word: נַפְשִׁי
  choice: da minha alma
  rationale: נֶפֶשׁ pode significar alma, vida, pessoa ou o próprio eu. “Da minha alma” conserva a expressão hebraica e evita apagar a distinção poética em relação a חַיָּי, “minha vida”, no segundo membro.
- source_word: גָּאַלְתָּ
  choice: resgataste
  rationale: גאל descreve a ação de um resgatador que liberta ou reivindica o que lhe pertence. “Resgataste” é claro no português atual e preserva a imagem de redenção sem impor ao verso uma formulação doutrinária mais específica.
- source_word: חַיָּי
  choice: a minha vida
  rationale: A forma plural é usada idiomaticamente para a vida do falante. “A minha vida” é o equivalente natural em português.
theological_decisions:
- issue: Preservar separadamente as imagens jurídica e de resgate nos dois membros do verso
  choice: Manter “defendeste a causa” no primeiro membro e “resgataste a minha vida” no segundo
  alternative: Uniformizar os dois membros com linguagem geral de livramento, como “ajudaste-me e salvaste-me”
  rationale: 'O hebraico emprega verbos e imagens distintos: defesa de uma causa (ריב) e ação de resgate (גאל). Preservar ambos mantém a riqueza poética e teológica do texto sem acrescentar uma interpretação confessional específica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito perfeito reflete naturalmente as formas verbais hebraicas e o testemunho retrospectivo do contexto. A expressão “causa da minha alma” conserva deliberadamente a tensão poética do original, esclarecida pelas alternativas na nota.
