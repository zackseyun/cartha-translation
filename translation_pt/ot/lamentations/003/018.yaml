source:
  edition: WLC
  text: וָ/אֹמַר֙ אָבַ֣ד נִצְחִ֔/י וְ/תוֹחַלְתִּ֖/י מֵ/יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/018.yaml
  text: So I said[a], “My endurance has perished[b], and my hope from Yahweh.”
translation:
  language: pt
  text: 'Então eu disse: “Pereceu a minha resistência[a], e também a minha esperança de Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu esplendor”, caso נִצְחִי seja entendido no sentido de eminência ou glória, e não de resistência.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “a minha esperança de Yahweh”. A expressão elíptica pode indicar a esperança que vem de Yahweh ou a esperança depositada em Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Então eu disse
  rationale: O waw ligado a אָמַר dá continuidade à sequência e introduz a conclusão do falante. “Então eu disse” soa natural em português e preserva a progressão narrativa.
- source_word: אָבַד
  choice: Pereceu
  rationale: O verbo expressa perda completa, desaparecimento ou ruína. “Pereceu” mantém a força do hebraico e o tom solene da lamentação.
- source_word: נִצְחִי
  choice: a minha resistência
  rationale: נֵצַח pode indicar duração, constância ou capacidade de persistir e, em outros contextos, esplendor ou eminência. No paralelo com a perda da esperança, “resistência” comunica de modo claro a capacidade de continuar sem reduzi-la apenas à força física.
- source_word: וְתוֹחַלְתִּי
  choice: e também a minha esperança
  rationale: תּוֹחֶלֶת significa esperança ou expectativa. “Esperança” é a formulação mais natural no contexto da lamentação; “também” torna fluida em português a coordenação elíptica do hebraico.
- source_word: מֵיְהוָה
  choice: de Yahweh
  rationale: A preposição מִן significa primariamente “de” ou “desde”. A formulação concisa “de Yahweh” conserva a elipse do original, que pode apontar para a esperança procedente de Yahweh ou para a esperança depositada nele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando no texto o nome pessoal presente no hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A tradução mantém o nome próprio do texto hebraico por meio da transliteração amplamente reconhecida “Yahweh”.
- issue: Sentido contextual de נִצְחִי
  choice: a minha resistência
  alternative: o meu esplendor; a minha força
  rationale: O contexto descreve o colapso interior do falante e a perda da esperança. “Resistência” preserva a ideia de capacidade de persistir, enquanto a nota registra o sentido lexical alternativo sem apagar a tensão do termo.
- issue: Relação expressa por מֵיְהוָה
  choice: a minha esperança de Yahweh
  alternative: a minha esperança em Yahweh; a esperança que vem de Yahweh
  rationale: A construção hebraica é elíptica. A tradução principal conserva sua concisão, e a nota explicita as duas relações plausíveis sem escolher silenciosamente entre fonte e objeto da esperança.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para a fluidez, mas a concisão e a ambiguidade lexical e relacional do hebraico foram preservadas por meio do texto e das notas.
