  text: ט֣וֹב לַ/גֶּ֔בֶר כִּֽי יִשָּׂ֥א עֹ֖ל בִּ/נְעוּרָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/027.yaml
  text: It is good for a man that he bear the yoke in his youth[a][b].
translation:
  language: pt
  text: É bom para o homem[a] levar o jugo[b] na sua juventude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para uma pessoa»; o hebraico traz o substantivo masculino singular «homem», usado aqui de modo representativo.
    reason: lexical_alternative
  - marker: b
    text: Ou «carregar o jugo»; a imagem é a de assumir e suportar uma carga ou disciplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: É bom
  rationale: O adjetivo predicativo abre a declaração avaliativa; em português, a construção impessoal «É bom» expressa isso com naturalidade.
- source_word: לַגֶּבֶר
  choice: para o homem
  rationale: גֶּבֶר designa um homem e está no masculino singular; aqui tem valor representativo ou genérico, preservado no texto e esclarecido em nota.
- source_word: כִּי
  choice: '[expresso pela construção com infinitivo]'
  rationale: כִּי introduz aqui o conteúdo daquilo que é bom. Em português, «É bom para o homem levar...» comunica essa relação naturalmente, sem impor o sentido causal «porque».
- source_word: יִשָּׂא
  choice: levar
  rationale: נשׂא pode significar levantar, carregar ou suportar. Com «jugo», «levar» conserva tanto a imagem concreta quanto a ideia de assumir e suportar uma carga ou disciplina.
- source_word: עֹל
  choice: o jugo
  rationale: A tradução mantém a metáfora concreta do jugo, em vez de reduzi-la a «fardo» ou «disciplina». O artigo definido é idiomático em português para essa imagem genérica.
- source_word: בִּנְעוּרָיו
  choice: na juventude
  rationale: A forma plural com sufixo masculino singular designa o período da juventude. O português pode omitir o possessivo sem perder a referência ao mesmo homem.
theological_decisions:
- issue: Referência masculina com sentido representativo
  choice: para o homem ... na juventude
  alternative: para a pessoa ... enquanto jovem
  rationale: O hebraico emprega גֶּבֶר e formas masculinas singulares. Embora a máxima possa ter aplicação geral, o texto traduzido preserva sua forma masculina e a nota informa o possível alcance genérico, sem neutralizá-la silenciosamente.
- issue: Sentido metafórico do jugo
  choice: manter «jugo» sem explicitar quem o impõe ou qual disciplina representa
  alternative: substituir por «fardo», «sofrimento» ou «disciplina»
  rationale: O versículo não identifica de modo explícito o conteúdo do jugo. Preservar a metáfora mantém a abertura interpretativa e a tensão do contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação concisa acompanha o caráter proverbial do hebraico; «jugo» preserva a imagem tradicional ainda inteligível, e as notas registram as principais alternativas sem resolver a metáfora além do que o texto permite.
