  yaml_path: translation/ot/lamentations/003/037.yaml
  text: Who is this who speaks and it happens[b][a], unless the Lord has commanded it?
translation:
  language: pt
  text: Quem é que fala, e isso acontece[a], sem que o Senhor o tenha ordenado[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quem foi que disse, e aconteceu?”. O hebraico emprega formas passadas numa pergunta retórica que expressa uma verdade geral.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “sem que o Senhor o tenha mandado”. Também se pode traduzir: “decretado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי זֶה
  choice: Quem é que
  rationale: A construção interrogativa enfática é expressa de modo natural em português, preservando a força retórica.
- source_word: אָמַר
  choice: fala
  rationale: Embora a forma hebraica seja perfeita, o presente comunica naturalmente a verdade geral formulada pela pergunta retórica.
- source_word: וַתֶּהִי
  choice: e isso acontece
  rationale: Expressa a ocorrência do acontecimento implícito, em linguagem moderna, sem restringir o sentido a 'existir'.
- source_word: אֲדֹנָי
  choice: o Senhor
  rationale: Traduz o título divino אֲדֹנָי de maneira corrente e digna.
- source_word: לֹא צִוָּה
  choice: sem que ... o tenha ordenado
  rationale: No contexto de um acontecimento que se realiza, 'ordenado' comunica a determinação autorizadora de צוה; a tradução mais literal 'mandado' é preservada em nota.
theological_decisions:
- issue: Linguagem da soberania divina em צוה
  choice: ordenado
  alternative: mandado; decretado
  rationale: A tradução afirma que nenhum acontecimento se realiza sem a determinação do Senhor, mas evita fazer de 'decretado', termo teologicamente mais carregado, a única leitura possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação retórica e a generalidade do enunciado foram preservadas; todas as alternativas relevantes aparecem em notas.
