  text: It is good to wait quietly for the salvation of Yahweh[a].
translation:
  language: pt
  text: É bom esperar em silêncio pela salvação de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É bom esperar com esperança, em silêncio, pela salvação de Yahweh”. O verbo hebraico pode expressar uma espera cheia de esperança, e “em silêncio” também pode transmitir a ideia de quietude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: É bom
  rationale: O adjetivo funciona de modo predicativo numa oração sem verbo expresso. “É bom” é natural em português e preserva a avaliação de que essa atitude é benéfica ou apropriada.
- source_word: יָחִיל
  choice: esperar
  rationale: O verbo יחל pode indicar esperar com esperança ou expectativa. Neste contexto, “esperar” expressa com clareza a atitude diante da salvação de Yahweh, enquanto a nota preserva a nuance de esperança.
- source_word: דוּמָם
  choice: em silêncio
  rationale: O advérbio denota silêncio ou quietude. “Em silêncio” conserva de modo direto essa imagem e se liga naturalmente ao infinitivo “esperar”.
- source_word: לִתְשׁוּעַת
  choice: pela salvação
  rationale: תְּשׁוּעָה pode significar salvação, livramento ou vitória. “Salvação” preserva tanto o sentido contextual de resgate quanto a ressonância teológica mais ampla.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino representado pelo Tetragrama é transliterado como “Yahweh”, preservando o nome pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino e evita substituí-lo pelo título “SENHOR”.
- issue: Relação entre esperança, espera e silêncio
  choice: esperar em silêncio
  alternative: ter esperança e permanecer em silêncio
  rationale: A construção hebraica admite entender יָחִיל como espera esperançosa e וְדוּמָם como silêncio ou quietude. A tradução principal mantém uma formulação portuguesa concisa sem eliminar a alternativa lexical, registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação é concisa e mantém o paralelismo meditativo do contexto; a nota preserva a ambiguidade entre esperar e ter esperança, bem como entre silêncio e quietude.
