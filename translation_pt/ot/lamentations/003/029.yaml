  text: יִתֵּ֤ן בֶּֽ/עָפָר֙ פִּ֔י/הוּ אוּלַ֖י יֵ֥שׁ תִּקְוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/029.yaml
  text: Let him put his mouth in the dust—perhaps there is hope[a].
translation:
  language: pt
  text: Ponha a sua boca no pó — talvez haja esperança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Coloque a sua boca no pó”. A expressão retrata profunda humildade, rebaixamento ou submissão silenciosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Ponha
  rationale: O yiqtol de נתן tem aqui força volitiva na sequência exortativa dos vv. 27–30. “Ponha” transmite essa exortação de modo natural em português, sem transformar a frase em simples afirmação futura.
- source_word: בֶּעָפָר
  choice: no pó
  rationale: עָפָר designa pó ou terra solta. “No pó” preserva a imagem concreta e a ressonância bíblica, além de soar natural para a postura descrita.
- source_word: פִּיהוּ
  choice: a boca
  rationale: Tradução direta de “sua boca”. Em português, o sujeito implícito do imperativo permite omitir o possessivo sem perda de referência; a imagem corporal é mantida em vez de ser interpretativamente parafraseada.
- source_word: אוּלַי
  choice: talvez
  rationale: Expressa possibilidade e expectativa cautelosa, preservando a incerteza genuína do hebraico.
- source_word: יֵשׁ
  choice: haja
  rationale: O existencial יֵשׁ, sob o alcance de אוּלַי, é expresso naturalmente em português por “talvez haja”.
- source_word: תִּקְוָה
  choice: esperança
  rationale: Equivalente corrente e contextual de תִּקְוָה, adequado ao tema da possível restauração em meio à lamentação.
theological_decisions:
- issue: Postura figurada de humildade e submissão
  choice: Manter a imagem concreta “ponha a boca no pó”
  alternative: Curvar-se em humilhação; permanecer calado em submissão
  rationale: A expressão pode sugerir profunda humildade, rebaixamento ou submissão silenciosa, mas o hebraico comunica isso por meio de uma imagem corporal vívida. A tradução conserva a imagem e não fixa uma única interpretação.
- issue: Caráter incerto da esperança
  choice: “talvez ainda haja esperança”
  alternative: “pois há esperança”; “para que haja esperança”
  rationale: אוּלַי marca possibilidade, não certeza nem finalidade. “Talvez” preserva a tensão do lamento; “ainda” torna explícito o valor contextual de esperança remanescente sem eliminar essa incerteza.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém a concisão poética e a imagem concreta do hebraico. O travessão assinala a relação entre o gesto e a esperança cautelosa.
