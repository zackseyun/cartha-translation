id: LAM.3.22
reference: Lamentations 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חַֽסְדֵ֤י יְהוָה֙ כִּ֣י לֹא תָ֔מְנוּ כִּ֥י לֹא כָל֖וּ רַחֲמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/022.yaml
  text: Because of Yahweh’s steadfast love we are not consumed[a], for his mercies never come to an end.
translation:
  language: pt
  text: Por causa do amor leal de Yahweh, não fomos consumidos[a], pois suas misericórdias nunca se esgotam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos hebraicos e as versões antigas apoiam a leitura alternativa: “O amor leal de Yahweh nunca cessa”. Essa leitura toma “amor leal” como sujeito e lê o primeiro verbo de modo diferente.'
    reason: textual_alternative
lexical_decisions:
- source_word: חַסְדֵי יְהוָה
  choice: o amor leal de Yahweh
  rationale: O plural construto pode indicar manifestações repetidas do amor fiel da aliança. O singular abstrato é natural em português, e “amor leal” preserva a ideia de fidelidade e compromisso.
- source_word: כִּי לֹא תָמְנוּ
  choice: Por causa de ... não fomos consumidos
  rationale: Conforme vocalizada no WLC fornecido, תָמְנוּ está na primeira pessoa do plural. A formulação mantém essa leitura massorética e expressa em português natural a ideia de não termos sido exterminados.
- source_word: כִּי לֹא כָלוּ
  choice: pois ... nunca se esgotam
  rationale: A segunda partícula causal fundamenta a afirmação anterior, enquanto o verbo negado declara que as misericórdias de Yahweh não se acabam.
- source_word: רַחֲמָיו
  choice: suas misericórdias
  rationale: O plural comunica atos abundantes ou repetidos de compaixão. “Misericórdias” conserva essa forma poética e é amplamente compreensível.
theological_decisions:
- issue: Sujeito e sintaxe da primeira oração
  choice: Por causa do amor leal de Yahweh, não fomos consumidos.
  alternative: O amor leal de Yahweh nunca cessa.
  rationale: A forma massorética vocalizada תָמְנוּ está na primeira pessoa do plural e, por isso, rege a tradução principal. Alguns manuscritos hebraicos e as versões antigas apoiam outra leitura, na qual o amor leal de Yahweh é o sujeito; essa alternativa significativa é preservada na nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Yahweh” translitera o nome divino; “amor leal” comunica a fidelidade relacional de חֶסֶד sem impor terminologia denominacional. A ordem das orações preserva a causalidade e o paralelismo poético do hebraico.
