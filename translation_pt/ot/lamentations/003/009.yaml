base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/009.yaml
  text: He has walled in my ways with hewn stone[c][b][a]; he has made my paths crooked.
translation:
  language: pt
  text: Ele fechou os meus caminhos com pedras lavradas[a]; tornou tortuosas as minhas veredas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cercou os meus caminhos com pedras talhadas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “torceu as minhas veredas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: fechou
  rationale: O verbo descreve cercar ou fechar com uma barreira. “Fechou” expressa naturalmente o bloqueio em português, enquanto a menção a pedras lavradas preserva a imagem concreta de uma construção sólida.
- source_word: דְּרָכַי
  choice: os meus caminhos
  rationale: “Caminhos” mantém tanto o sentido concreto de vias quanto sua possível dimensão figurada e faz paralelo com “veredas”.
- source_word: בְּגָזִית
  choice: com pedras lavradas
  rationale: גָּזִית designa pedra talhada ou lavrada para construção. O plural idiomático “pedras lavradas” comunica com clareza uma barreira deliberadamente construída.
- source_word: נְתִיבֹתַי
  choice: as minhas veredas
  rationale: “Veredas” distingue o termo de “caminhos” e conserva o paralelismo poético entre duas palavras hebraicas próximas.
- source_word: עִוָּה
  choice: tornou tortuosas
  rationale: O verbo significa entortar ou torcer. Esta escolha preserva a imagem espacial das veredas e evita introduzir indevidamente um sentido moral.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com paralelismo poético entre “caminhos” e “veredas”. A ordem das notas foi ajustada para que cada marcador apareça junto à expressão correspondente.
