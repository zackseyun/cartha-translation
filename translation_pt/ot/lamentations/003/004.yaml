lexical_decisions:
- source_word: בִּלָּה
  choice: consumiu
  rationale: No piel, o verbo expressa fazer desgastar-se ou definhar. “Consumiu” comunica em português natural a deterioração física intensa, sem acrescentar uma causa não expressa.
- source_word: בְשָׂרִי
  choice: minha carne
  rationale: Tradução direta que preserva a imagem física e visceral do hebraico.
- source_word: וְעוֹרִי
  choice: e minha pele
  rationale: Mantém o sentido comum do substantivo e o paralelismo corporal do verso.
- source_word: שִׁבַּר
  choice: quebrou
  rationale: Equivalente português direto e natural, preservando a força do verbo sem intensificá-lo para “despedaçou”.
- source_word: עַצְמוֹתָי
  choice: meus ossos
  rationale: Tradução literal e idiomática que conserva a imagem poética corporal.
