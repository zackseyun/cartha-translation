base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/053.yaml
  text: They silenced my life in the pit[a], and threw a stone at me.
translation:
  language: pt
  text: Puseram fim à minha vida na cova e atiraram uma pedra contra mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atiraram uma pedra sobre mim”; talvez descrevendo a abertura da cova sendo fechada com uma pedra, e não apenas uma pedra lançada contra mim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְתוּ
  choice: puseram fim
  rationale: O verbo expressa fazer cessar, cortar ou destruir. “Puseram fim à minha vida” comunica esse sentido em português natural, sem especificar além do hebraico como isso teria ocorrido.
- source_word: בַבּוֹר
  choice: na cova
  rationale: בּוֹר pode designar uma cova, cisterna ou espaço semelhante usado como prisão. “Cova” preserva a imagem ampla de confinamento e proximidade da morte.
- source_word: חַיָּי
  choice: à minha vida
  rationale: A forma plural com sufixo de primeira pessoa funciona idiomaticamente com o sentido de “minha vida”.
- source_word: וַיַּדּוּ
  choice: atiraram
  rationale: O verbo significa lançar ou arremessar. “Atiraram” é claro e corrente no contexto.
- source_word: אֶבֶן
  choice: uma pedra
  rationale: O substantivo singular é traduzido de maneira direta e idiomática.
- source_word: בִּי
  choice: contra mim
  rationale: A preposição pode indicar contato ou ação hostil. “Contra mim” preserva a hostilidade sem excluir totalmente a possibilidade de a pedra ter sido lançada sobre a abertura da cova.
theological_decisions:
- issue: A afirmação de que deram fim à vida do poeta, embora ele continue falando
  choice: 'Preservar a linguagem absoluta e poética: “Puseram fim à minha vida”'
  alternative: “Tentaram pôr fim à minha vida”
  rationale: O hebraico não contém um verbo equivalente a “tentar”. A tradução mantém a tensão retórica do lamento sem explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com formulação natural para leitores brasileiros e compreensão internacional. A ordem das orações acompanha o hebraico, e a nota preserva a ambiguidade espacial da preposição final.
