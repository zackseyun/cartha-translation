  yaml_path: translation/ot/lamentations/003/016.yaml
  text: He has ground my teeth with gravel[b][a]; he has pressed me down into the ashes.
translation:
  language: pt
  text: Ele triturou meus dentes com cascalho[a]; fez-me encolher nas cinzas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quebrou meus dentes com pedrinhas”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido “fez-me encolher” é raro e também pode ser entendido como “humilhou-me”, “rebaixou-me” ou, de modo semelhante, “fez-me curvar nas cinzas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגְרֵס
  choice: triturou
  rationale: O verbo expressa a ideia de esmagar ou moer. “Triturou” preserva a violência concreta da imagem e combina naturalmente com os dentes e o cascalho.
- source_word: בֶּחָצָץ
  choice: com cascalho
  rationale: חָצָץ designa pedras pequenas ou cascalho. “Cascalho” comunica de modo claro a aspereza da imagem.
- source_word: שִׁנָּי
  choice: meus dentes
  rationale: A forma hebraica é plural e leva sufixo de primeira pessoa do singular.
- source_word: הִכְפִּישַׁנִי
  choice: fez-me baixar
  rationale: O verbo raro parece indicar rebaixamento, submissão forçada ou humilhação. Esta escolha preserva tanto a dimensão física quanto a humilhante sem fixar um sentido excessivamente específico.
- source_word: בָּאֵפֶר
  choice: até as cinzas
  rationale: אֵפֶר significa “cinzas”. “Até” expressa com naturalidade o movimento descendente sugerido pelo verbo precedente.
