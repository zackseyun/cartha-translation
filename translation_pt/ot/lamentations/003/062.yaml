  text: the lips of those who rise against me[b][a], and their muttering against me all day long.
translation:
  language: pt
  text: os lábios[a] dos que se levantam contra mim e o murmúrio[b] deles contra mim o dia inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as palavras dos que se levantam contra mim”. No hebraico, “lábios” é uma expressão concreta que representa a fala.
    reason: lexical_alternative
  - marker: b
    text: Ou “a meditação deles” ou “o sussurro deles”. O termo hebraico pode se referir tanto a uma reflexão interior quanto a uma fala em voz baixa; aqui, o contexto hostil favorece “murmúrio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: os lábios dos
  rationale: Mantém a imagem concreta do hebraico, em que “lábios” funciona metonimicamente para fala ou palavras.
- source_word: קָמַי
  choice: os que se levantam contra mim
  rationale: Reproduz de perto o particípio substantivado de קום com sufixo de primeira pessoa, deixando o sentido hostil claro em português.
- source_word: הֶגְיוֹנָם
  choice: o seu murmúrio
  rationale: O termo pode indicar reflexão interior ou emissão de voz baixa; no contexto hostil, “murmúrio” preserva essa amplitude melhor do que uma interpretação mais específica como “conspiração”.
- source_word: עָלַי
  choice: contra mim
  rationale: Em contexto de fala hostil, a preposição tem naturalmente sentido adversativo.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão portuguesa corrente que comunica duração contínua ao longo de todo o dia.
