  text: Why should a living man complain, a man, about his sins?
translation:
  language: pt
  text: Por que se queixaria uma pessoa viva — um homem — dos seus pecados[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto consonantal hebraico traz “do seu pecado” (singular); a leitura massorética tradicional (qere) traz “dos seus pecados” (plural).
    reason: Registra a diferença textual entre o ketiv e o qere sem ocultar a base da tradução plural.
lexical_decisions:
- source_word: מַה יִּתְאוֹנֵן
  choice: Por que se queixa
  rationale: A construção interrogativa com מַה tem valor de “por que?”, e o verbo expressa queixa ou lamentação.
- source_word: אָדָם חָי
  choice: o ser humano enquanto vive
  rationale: אָדָם é coletivo e inclusivo; חָי caracteriza a pessoa como viva. A formulação natural em português conserva a ênfase na condição de estar vivo.
- source_word: גֶּבֶר
  choice: cada um
  rationale: O segundo termo para ser humano retoma e particulariza אָדָם. “Cada um” evita a repetição pouco natural de “homem” e preserva o movimento do geral para o indivíduo.
- source_word: עַל חטאו
  choice: por causa dos seus pecados
  rationale: עַל pode indicar o assunto ou a causa da queixa. Neste contexto, “por causa de” conserva a relação sem determinar se a pessoa lamenta os pecados em si ou suas consequências. O substantivo consonantal pode ser vocalizado como singular coletivo ou plural; o plural é natural e condiz com a tradição massorética marginal.
theological_decisions:
- issue: Objeto ou causa da queixa
  choice: por causa dos seus pecados
  alternative: a respeito dos seus pecados
  rationale: A preposição עַל permite ambas as nuances. “Por causa de” preserva a tensão contextual entre culpa e sofrimento sem acrescentar que a pessoa esteja necessariamente se arrependendo.
- issue: Singular ou plural em חטאו
  choice: dos seus pecados
  alternative: do seu pecado
  rationale: A forma transmitida apresenta uma questão textual/massorética; o plural corresponde ao qere tradicional e é claro em português, sem alterar a afirmação teológica central.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A inversão leve em “se queixa o ser humano” mantém o tom poético e a força retórica do hebraico.
