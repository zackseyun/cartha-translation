review_pass:
  verdict: revise
  source_fidelity: A sequência exortativa está bem refletida, e «fique farto de humilhação» preserva adequadamente a metáfora de saciedade associada a חֶרְפָּה. Contudo, לֶחִי designa mais precisamente a face lateral/bochecha; «a sua face» é uma formulação portuguesa digna e idiomática que mantém a imagem sem a possível imprecisão de «a face» sem possessivo. «Quem o golpeia» representa mais diretamente o particípio de נכה do que «quem o fere», que pode sugerir ferimento em vez de golpe.
  naturalness: «Dê a sua face a quem o golpeia» é claro, natural e tem registro elevado, mas ainda corrente, adequado ao paralelismo exortativo do contexto. A segunda oração mantém concisão e força poética.
  terminology: «Humilhação» é uma boa tradução contextual de חֶרְפָּה. A nota conserva «afronta» como alternativa útil e explica a imagem hebraica sem introduzir interpretação doutrinária.
