  text: יִתֵּ֧ן לְ/מַכֵּ֛/הוּ לֶ֖חִי יִשְׂבַּ֥ע בְּ/חֶרְפָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/030.yaml
  text: Let him give his cheek to the one who strikes him[a]; let him be filled with reproach.
translation:
  language: pt
  text: Dê a sua face a quem o golpeia; fique farto de humilhação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fique cheio de afronta”. O hebraico fala literalmente de ficar saciado ou cheio de humilhação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: Dê
  rationale: O imperfeito de נתן tem aqui valor exortativo, em continuidade com as exortações do contexto. O imperativo português comunica isso de modo natural e conciso.
- source_word: לְמַכֵּהוּ
  choice: a quem o fere
  rationale: A preposição לְ com o particípio hifil de נכה e o sufixo de terceira pessoa masculina singular designa aquele que o golpeia. A formulação preserva tanto o agente quanto a ação em curso ou característica.
- source_word: לֶחִי
  choice: a face
  rationale: לֶחִי pode indicar face, bochecha ou maxilar. “Face” é natural em português e conserva a imagem de se expor ao golpe e à afronta.
- source_word: יִשְׂבַּע
  choice: fique farto
  rationale: שׂבע significa ficar satisfeito, saciado ou cheio. “Fique farto” preserva a metáfora forte e incomum de receber humilhação até a saciedade.
- source_word: בְּחֶרְפָּה
  choice: de humilhação
  rationale: חֶרְפָּה abrange afronta, insulto, vergonha e desonra pública. “Humilhação” expressa de modo claro a dimensão social e dolorosa do termo neste lamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção exortativa paralela. A imagem hebraica da saciedade foi mantida, sem explicar ou suavizar sua tensão no corpo do versículo.
