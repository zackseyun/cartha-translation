  yaml_path: translation/ot/lamentations/003/052.yaml
  text: My enemies hunted me like a bird[a], without cause.
translation:
  language: pt
  text: Meus inimigos me caçaram como se caça um pássaro[a], sem motivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega um infinitivo absoluto junto ao verbo conjugado (literalmente, “caçar, eles me caçaram”) para dar ênfase. Outra tradução possível: “Meus inimigos certamente me caçaram como se caça um pássaro, sem motivo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צ֥וֹד צָד֛וּנִי
  choice: me caçaram
  rationale: A raiz צוד descreve a caça ou captura de uma presa. A construção com infinitivo absoluto antes do verbo conjugado dá ênfase à ação; o texto principal mantém uma formulação portuguesa natural, e a nota registra essa intensificação.
- source_word: כַּצִּפּוֹר
  choice: como a um pássaro
  rationale: צִפּוֹר é aqui um termo genérico para ave ou pássaro, sem indicar uma espécie específica. A expressão preserva a imagem da pessoa perseguida como presa vulnerável.
- source_word: אֹיְבַי
  choice: Meus inimigos
  rationale: O substantivo designa diretamente os inimigos do orador. Esta é a forma mais clara e natural em português moderno.
- source_word: חִנָּם
  choice: sem motivo
  rationale: Neste contexto, חִנָּם expressa hostilidade injustificada, não ausência de pagamento. “Sem motivo” comunica de modo natural que a perseguição não tinha causa legítima.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para a sintaxe natural do português, sem perder a imagem da caça nem a afirmação de perseguição injustificada.
