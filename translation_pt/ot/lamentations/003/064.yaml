  text: תָּשִׁ֨יב לָ/הֶ֥ם גְּמ֛וּל יְהוָ֖ה כְּ/מַעֲשֵׂ֥ה יְדֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/064.yaml
  text: You will repay them[a], O Yahweh[b], according to the work of their hands.
translation:
  language: pt
  text: Tu lhes retribuirás[a], ó Yahweh, conforme a obra das mãos deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que tu lhes retribuas”. O verbo hebraico pode ser entendido tanto como um pedido quanto como uma declaração de confiança.'
    reason: alternative_reading
  - marker: b
    text: “A obra das mãos deles” é uma expressão hebraica que se refere ao que eles fizeram.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב לָהֶם גְּמוּל
  choice: Tu lhes retribuirás
  rationale: O hifil de שוב, combinado com גְּמוּל, expressa dar de volta a alguém o que lhe corresponde, isto é, retribuir. A formulação evita a redundância pouco natural de uma tradução como “devolverás a eles uma retribuição”.
- source_word: יְהוָה
  choice: ó Yahweh
  rationale: Mantém o nome divino do texto hebraico, com o vocativo indicado naturalmente em português.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: conforme a obra das mãos deles
  rationale: Preserva tanto a ideia de correspondência expressa por כְּ quanto a imagem concreta das mãos como metonímia dos atos praticados.
theological_decisions:
- issue: Valor modal de תָּשִׁיב no contexto de oração
  choice: Tu lhes retribuirás
  alternative: Que tu lhes retribuas
  rationale: O yiqtol pode ser entendido como declaração confiante acerca do futuro ou como pedido de força volitiva. O texto principal mantém a declaração de confiança, e a nota registra a leitura optativa sem eliminar a ambiguidade.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o tetragrama; a transliteração preserva o nome próprio em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso do singular “tu” coerente com a forma verbal e o vocativo dirigido a Yahweh. A imagem hebraica das mãos foi preservada, acompanhada de explicação em nota.
