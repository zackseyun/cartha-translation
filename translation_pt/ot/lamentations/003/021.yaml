  text: זֹ֛את אָשִׁ֥יב אֶל לִבִּ֖/י עַל כֵּ֥ן אוֹחִֽיל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/021.yaml
  text: This I call to mind[a]; therefore I have hope.
translation:
  language: pt
  text: Trago isto de volta à mente[a]; por isso, tenho esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Trago isto de volta ao meu coração; por isso, espero.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: isto
  rationale: O demonstrativo feminino singular pode remeter ao que precede ou ao que vem a seguir. “Isto” mantém essa referência aberta de modo natural em português.
- source_word: אָשִׁיב
  choice: trago de volta
  rationale: O hifil de שוב expressa literalmente fazer voltar ou trazer de volta. A formulação preserva a imagem do hebraico e se combina naturalmente com “ao coração”.
- source_word: אֶל לִבִּי
  choice: ao coração
  rationale: O hebraico לֵב abrange pensamento, memória, vontade e interioridade, não apenas emoção. Manter “coração” preserva a imagem antropológica da fonte, esclarecida pela nota alternativa idiomática.
- source_word: עַל כֵּן
  choice: por isso
  rationale: A locução introduz a consequência ou inferência resultante da recordação; “por isso” é claro, atual e fiel.
- source_word: אוֹחִיל
  choice: espero
  rationale: O hifil de יחל pode significar esperar com expectativa ou ter esperança. “Espero” preserva de forma concisa a possível tensão entre espera e esperança, sem reduzi-la a mero desejo.
theological_decisions:
- issue: Idioma antropológico אֶל־לִבִּי (“ao meu coração”)
  choice: Conservar a imagem como “ao coração” no texto principal.
  alternative: “Trago isto à memória” ou “recordo-me disto”.
  rationale: Na concepção hebraica, o coração é o centro do pensamento, da memória e da decisão. A tradução literal-natural evita restringi-lo ao sentido emocional moderno, enquanto a nota torna explícito o valor idiomático.
- issue: Sentido de אוֹחִיל
  choice: “espero”, permitindo tanto esperança quanto espera expectante.
  alternative: “tenho esperança”.
  rationale: O verbo comporta ambas as nuances. A escolha concisa conserva a ambiguidade genuína e a ligação causal com aquilo que o poeta traz de volta ao coração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a metáfora do hebraico foram preservadas sem produzir construção artificial; a nota oferece a equivalência idiomática.
