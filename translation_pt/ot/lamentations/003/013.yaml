  text: הֵבִיא֙ בְּ/כִלְיוֹתָ֔/י בְּנֵ֖י אַשְׁפָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/013.yaml
  text: He drove the sons of his quiver into my kidneys[a].
translation:
  language: pt
  text: Ele fez os filhos da sua aljava[a] penetrar nos meus rins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os filhos da sua aljava”; isto é, suas flechas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵבִיא
  choice: fez penetrar
  rationale: O hifil de בוא expressa aqui causação; com בְּ indicando o alvo corporal, “fez penetrar” comunica de modo natural e vívido a entrada forçada das flechas.
- source_word: בְּכִלְיוֹתָי
  choice: nos meus rins
  rationale: כִּלְיָה significa literalmente “rim” e também pode representar o íntimo da pessoa. Neste quadro de flechas que atravessam o corpo, preserva-se a imagem anatômica concreta.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Mantém o hebraísmo poético literal “filhos de”, que designa aquilo que procede da aljava, isto é, suas flechas; a nota esclarece o sentido.
- source_word: אַשְׁפָּתוֹ
  choice: da sua aljava
  rationale: אַשְׁפָּה é o recipiente em que se levam flechas; “aljava” é o termo português preciso e corrente no registro bíblico-poético.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, com sintaxe clara. A metáfora hebraica incomum foi preservada no texto e explicada em nota, sem substituir a imagem por uma interpretação.
