  text: סַכּ֤וֹתָה בֶֽ/עָנָן֙ לָ֔/ךְ מֵ/עֲב֖וֹר תְּפִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/044.yaml
  text: You have covered yourself with a cloud so that prayer cannot pass through[a].
translation:
  language: pt
  text: Tu te cobriste com uma nuvem, para impedir que a oração passasse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «Tu te cobriste com uma nuvem, impedindo a passagem da oração».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכּוֹתָה
  choice: te cobriste
  rationale: 'O qal perfeito na segunda pessoa masculina singular, complementado por לָךְ, tem aqui sentido reflexivo: Deus cobriu a si mesmo. A forma portuguesa preserva a ação concluída no contexto do lamento.'
- source_word: בֶעָנָן
  choice: com uma nuvem
  rationale: A preposição בְּ indica naturalmente o meio ou envoltório; o singular do hebraico é mantido.
- source_word: לָךְ
  choice: te
  rationale: Embora formalmente signifique «para ti», complementa o verbo com valor reflexivo, expresso de modo natural pelo pronome «te».
- source_word: מֵעֲבוֹר
  choice: para que ... não passasse
  rationale: A preposição מִן com o infinitivo construto de עבר expressa impedimento. A oração final/resultativa comunica naturalmente em português que a nuvem impede a passagem da oração.
- source_word: תְּפִלָּה
  choice: a oração
  rationale: O substantivo singular tem sentido genérico; «a oração» preserva esse valor de modo idiomático e digno em português.
theological_decisions:
- issue: Representação antropomórfica de Deus impedindo a oração
  choice: Manter a interpelação direta e a imagem de Deus cobrindo a si mesmo com uma nuvem que impede a passagem da oração.
  alternative: Abrandar a imagem como «tu te escondeste numa nuvem» ou apresentar a barreira de modo impessoal.
  rationale: O hebraico se dirige diretamente a Deus e emprega a imagem intensa própria do lamento. A tradução conserva a tensão entre ocultação divina e juízo, sem explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, claro e solene, com uso de «tu» coerente com a interpelação poética direta. A construção evita arcaísmos desnecessários e preserva a metáfora concreta do hebraico.
