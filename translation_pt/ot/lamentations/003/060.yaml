  text: רָאִ֨יתָה֙ כָּל נִקְמָתָ֔/ם כָּל מַחְשְׁבֹתָ֖/ם לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/060.yaml
  text: You have seen all their vengeance[a], all their schemes against me.
translation:
  language: pt
  text: Viste toda a vingança deles, todos os seus planos contra mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus planos a respeito de mim”. A expressão hebraica pode ser entendida de modo mais neutro, mas o contexto hostil favorece “contra mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: Viste
  rationale: O qal perfeito na segunda pessoa masculina singular dirige-se a Deus. O pretérito perfeito simples é natural em português e expressa diretamente que Deus tomou conhecimento do que ocorreu.
- source_word: כָּל
  choice: toda / todos
  rationale: O termo aparece duas vezes e indica totalidade; a flexão acompanha naturalmente o gênero e o número dos substantivos em português.
- source_word: נִקְמָתָם
  choice: a vingança deles
  rationale: נקמה designa vingança ou ação vingativa. A formulação conserva a força do hebraico e explicita de modo natural o sufixo de terceira pessoa plural.
- source_word: מַחְשְׁבֹתָם
  choice: os seus planos
  rationale: מחשבות pode significar pensamentos, planos ou maquinações. “Planos” preserva a amplitude lexical sem inserir no substantivo uma hostilidade que o contexto e a expressão “contra mim” já comunicam.
- source_word: לִי
  choice: contra mim
  rationale: A preposição ל pode indicar relação ou direção. No contexto adversarial de vingança e planejamento hostil, “contra mim” é a tradução idiomática mais provável, embora “a respeito de mim” permaneça possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Viste” mantém a forma singular dirigida a Deus e o paralelismo conciso do verso; a nota preserva a ambiguidade da preposição hebraica.
