  text: זְכָר עָנְיִ֥/י וּ/מְרוּדִ֖/י לַעֲנָ֥ה וָ/רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/019.yaml
  text: Remember my affliction and my wandering[b][a], the wormwood and the gall.
translation:
  language: pt
  text: Lembra-te da minha aflição e do meu vagar[a], do absinto e do veneno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da minha falta de moradia”; o termo hebraico sugere vagueação e vida sem paradeiro estável.
    reason: lexical_alternative
  - marker: b
    text: “Absinto e veneno” são imagens concretas de amargor e toxicidade; juntos, também podem representar metaforicamente uma experiência de extrema amargura.
    reason: cultural_note
lexical_decisions:
- source_word: זְכָר
  choice: Lembra-te
  rationale: Imperativo qal masculino singular de זכר, expresso como apelo direto. A forma pronominal é natural e digna em português.
- source_word: עָנְיִי
  choice: minha aflição
  rationale: Preserva o sentido de sofrimento e miséria sem restringi-lo a uma dimensão apenas emocional.
- source_word: מְרוּדִי
  choice: meu andar errante
  rationale: Expressa a ideia de vagueação e instabilidade contida no substantivo hebraico, sem limitar o sentido à falta de moradia.
- source_word: לַעֲנָה
  choice: absinto
  rationale: Mantém a imagem concreta da planta proverbialmente amarga, em vez de substituí-la pela abstração “amargura”.
- source_word: וָרֹאשׁ
  choice: veneno
  rationale: רֹאשׁ pode designar uma planta venenosa ou seu efeito tóxico. “Veneno” comunica com clareza a imagem concreta e forma um paralelo natural com “absinto”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem poética e as imagens concretas do hebraico foram preservadas; “andar errante” evita tanto o arcaísmo quanto uma interpretação excessivamente estreita.
