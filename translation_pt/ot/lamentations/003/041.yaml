  text: נִשָּׂ֤א לְבָבֵ֨/נוּ֙ אֶל כַּפָּ֔יִם אֶל אֵ֖ל בַּ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/041.yaml
  text: Let us lift up our hearts with our hands to God in heaven.
translation:
  language: pt
  text: Elevemos nosso coração com as mãos a Deus nos céus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשָּׂא
  choice: Elevemos
  rationale: 'O coortativo hebraico de primeira pessoa do plural expressa uma exortação coletiva: “elevemos”.'
- source_word: לְבָבֵנוּ
  choice: nosso coração
  rationale: Preserva o singular coletivo do hebraico, que apresenta o coração comum da comunidade, em vez de pluralizá-lo.
- source_word: אֶל־כַּפָּיִם
  choice: com as mãos
  rationale: Embora a preposição אֶל normalmente indique direção, a construção incomum associa o elevar do coração ao gesto das mãos erguidas. “Com as mãos” preserva essa ligação sem transformar coração e mãos em dois objetos coordenados.
- source_word: אֶל־אֵל בַּשָּׁמָיִם
  choice: a Deus nos céus
  rationale: Reproduz a direção do apelo e a localização celestial de Deus em português natural e solene.
theological_decisions:
- issue: Relação entre coração e mãos no gesto de oração
  choice: “nosso coração com as mãos”
  alternative: “nosso coração e nossas mãos”
  rationale: O texto hebraico não coordena explicitamente coração e mãos como dois objetos de נִשָּׂא. A formulação escolhida mantém a imagem de a disposição interior acompanhar o gesto exterior, sem impor uma leitura teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com forma exortativa adequada a uma oração comunitária. Mantém-se “coração” no singular coletivo e “céus” no plural, conforme o uso bíblico natural em português.
