  text: חֲדָשִׁים֙ לַ/בְּקָרִ֔ים רַבָּ֖ה אֱמוּנָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/023.yaml
  text: They are new every morning[a]; great is your faithfulness.
translation:
  language: pt
  text: Elas são novas a cada manhã[a]; grande é a tua fidelidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ela é nova a cada manhã”, se o sujeito implícito for entendido coletivamente a partir da linha anterior.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲדָשִׁים
  choice: se renovam
  rationale: O adjetivo plural significa literalmente “novas”. Em português, com o sujeito retomado do versículo anterior, “se renovam” expressa de modo natural que as misericórdias se apresentam novas, sem sugerir que antes fossem deficientes.
- source_word: לַבְּקָרִים
  choice: a cada manhã
  rationale: A construção temporal indica repetição, literalmente “pelas manhãs”. “A cada manhã” preserva com clareza o sentido distributivo.
- source_word: רַבָּה
  choice: grande
  rationale: Como predicativo do substantivo abstrato seguinte, “grande” traduz naturalmente a ideia de abundância ou magnitude.
- source_word: אֱמוּנָתֶךָ
  choice: a tua fidelidade
  rationale: אֱמוּנָה comunica firmeza, confiabilidade e fidelidade. Referida a Deus, “fidelidade” preserva a noção de constância confiável.
theological_decisions:
- issue: Sujeito implícito retomado do versículo anterior
  choice: Elas se renovam a cada manhã
  alternative: Ela se renova a cada manhã
  rationale: O hebraico começa com um adjetivo masculino plural, sem substantivo expresso. O plural aponta mais naturalmente para as manifestações da misericórdia ou compaixão mencionadas no contexto anterior. A nota preserva a possível compreensão coletiva no singular.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A inversão “grande é” conserva a ênfase e a cadência poética do hebraico.
