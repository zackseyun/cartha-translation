  text: סַכֹּ֤תָה בָ/אַף֙ וַֽ/תִּרְדְּפֵ֔/נוּ הָרַ֖גְתָּ לֹ֥א חָמָֽלְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/043.yaml
  text: You covered yourself with anger and pursued us[b][a]; you killed without pity.
translation:
  language: pt
  text: Tu te cobriste de ira[a] e nos perseguiste; mataste sem compaixão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de raiva” ou “em ira”. O hebraico usa literalmente “nariz” como expressão idiomática para ira.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não poupaste” ou “não tiveste compaixão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכֹּתָה
  choice: te cobriste
  rationale: Preserva a imagem de alguém que se envolve ou se encobre, entendendo o verbo reflexivamente pelo contexto, sem substituí-la por uma explicação interpretativa.
- source_word: בָאַף
  choice: de ira
  rationale: אַף significa literalmente “nariz”, mas neste idiomatismo denota ira. “Cobriste de ira” é natural em português e mantém a ira como aquilo com que o sujeito se cobre.
- source_word: וַתִּרְדְּפֵנוּ
  choice: e nos perseguiste
  rationale: רדף expressa perseguir ou ir no encalço. “Nos perseguiste” é direto e adequado ao tom da lamentação, sem acrescentar uma nuance técnica de perseguição religiosa.
- source_word: הָרַגְתָּ
  choice: mataste
  rationale: Traduz diretamente o verbo comum הרג, preservando a força da acusação na segunda pessoa.
- source_word: לֹא חָמָלְתָּ
  choice: sem compaixão
  rationale: חמל pode significar poupar ou ter compaixão. Após “mataste”, a formulação adverbial é concisa e vigorosa, enquanto a nota conserva as alternativas lexicais.
theological_decisions:
- issue: A lamentação dirige a Deus uma acusação direta a respeito do juízo divino
  choice: Manter a segunda pessoa e atribuir diretamente as ações ao interlocutor
  alternative: Atenuar com formulações como “permitiste que nos perseguissem” ou “parecia que matavas sem compaixão”
  rationale: O hebraico atribui diretamente ao interlocutor o cobrir-se de ira, perseguir e matar. O gênero da lamentação comporta essa linguagem ousada; suavizá-la resolveria indevidamente a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com o discurso direto. “Ira” preserva o registro poético e solene sem soar arcaico; “sem compaixão” mantém a concisão e a dureza do lamento.
