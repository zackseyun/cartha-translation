  text: אוֹתִ֥/י נָהַ֛ג וַ/יֹּלַ֖ךְ חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/002.yaml
  text: He has driven me and made me walk in darkness and not light[a].
translation:
  language: pt
  text: Ele me impeliu e me fez andar em trevas, e não na luz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele me conduziu e me fez ir em trevas, e não na luz.”'
    reason: 'Alternativa lexical: נָהַג pode significar “conduzir”, e a forma causativa de הלך também pode ser traduzida por “fazer ir”.'
lexical_decisions:
- source_word: אוֹתִי
  choice: me
  rationale: A partícula marca o objeto direto da primeira pessoa do singular; em português, é representada naturalmente pelo pronome “me”.
- source_word: נָהַג
  choice: impeliu
  rationale: O verbo pode significar conduzir, guiar ou impelir. No contexto de aflição, “impeliu” comunica a força coerciva sem recorrer a uma expressão pouco natural como “tocou-me adiante”.
- source_word: וַיֹּלַךְ
  choice: me fez andar
  rationale: A forma causativa de הלך indica fazer alguém ir ou andar. “Me fez andar” preserva claramente essa força causativa.
- source_word: חֹשֶׁךְ
  choice: trevas
  rationale: “Trevas” é uma equivalência poética, clara e tradicional para a escuridão, mantendo o contraste direto com a luz.
- source_word: וְלֹא אוֹר
  choice: e não na luz
  rationale: A formulação conserva o contraste abrupto e elíptico do hebraico, enquanto a preposição “na”, recuperada do primeiro membro, torna a frase natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e poético, de ampla compreensão internacional e com boa legibilidade brasileira. A repetição contrastiva “em trevas, e não na luz” preserva a concisão e a tensão da poesia hebraica.
