  yaml_path: translation/ot/lamentations/003/034.yaml
  text: to crush under his feet all the prisoners of the earth,[a]
translation:
  language: pt
  text: esmagar debaixo de seus pés todos os prisioneiros da terra,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os prisioneiros do país”. O hebraico אֶרֶץ pode significar tanto “terra” quanto “país”; aqui, “terra” preserva o alcance amplo e poético do verso.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַכֵּא
  choice: esmagar
  rationale: O infinitivo com לְ integra a sequência de injustiças dos vv. 34–36. דכא expressa a ideia de esmagar ou abater; “esmagar” preserva a imagem concreta reforçada por “debaixo de seus pés”.
- source_word: תַּחַת
  choice: debaixo de
  rationale: A preposição tem sentido espacial e rege “seus pés”. “Debaixo de” é natural em português e mantém a imagem vívida.
- source_word: רַגְלָיו
  choice: seus pés
  rationale: A forma hebraica é plural, com sufixo masculino singular. “Seus pés” reproduz naturalmente ambos os elementos.
- source_word: כֹּל
  choice: todos
  rationale: O plural “todos” concorda naturalmente com “os prisioneiros” e preserva a abrangência coletiva do hebraico.
- source_word: אֲסִירֵי
  choice: os prisioneiros de
  rationale: O substantivo designa pessoas presas ou cativas. “Prisioneiros” é claro, corrente e adequado ao contexto de injustiça.
- source_word: אָרֶץ
  choice: a terra
  rationale: אֶרֶץ pode designar tanto a terra em sentido amplo quanto uma terra ou região. No contexto poético, “a terra” preserva o alcance amplo sem excluir a ambiguidade, registrada em nota.
