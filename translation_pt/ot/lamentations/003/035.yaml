  yaml_path: translation/ot/lamentations/003/035.yaml
  text: to deny a man justice before the face of the Most High—
translation:
  language: pt
  text: negar justiça a um homem diante do Altíssimo—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת מִשְׁפַּט
  choice: negar justiça
  rationale: O infinitivo de נטה, literalmente “inclinar/desviar”, com מִשְׁפָּט descreve a distorção do direito ou a negação da justiça. “Negar justiça” comunica naturalmente em português o resultado jurídico da expressão.
- source_word: גָּבֶר
  choice: um homem
  rationale: Mantém o referente individual e o tom solene do substantivo hebraico, sem introduzir especificações ausentes no texto.
- source_word: נֶגֶד פְּנֵי עֶלְיוֹן
  choice: diante do Altíssimo
  rationale: Expressa idiomaticamente “perante a face do Altíssimo”, preservando a ideia de que o ato ocorre sob sua presença e seu olhar.
theological_decisions:
- issue: Sentido da presença do Altíssimo
  choice: diante do Altíssimo
  alternative: contra o Altíssimo
  rationale: נֶגֶד פְּנֵי denota mais diretamente algo feito perante ou diante de alguém. A tradução evita transformar a expressão em oposição explícita, embora essa implicação moral permaneça possível no contexto.
translation_notes:
  register: Português moderno, claro e digno. O travessão final preserva a continuidade sintática com os versículos adjacentes. A formulação segue o sentido jurídico do hebraico sem tornar excessivamente literal a imagem de “inclinar/desviar o direito”.
