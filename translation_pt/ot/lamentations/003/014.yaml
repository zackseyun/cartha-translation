  text: הָיִ֤יתִי שְּׂחֹק֙ לְ/כָל עַמִּ֔/י נְגִינָתָ֖/ם כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/014.yaml
  text: I have become a laughingstock to all my people[a], their song all day long.
translation:
  language: pt
  text: Tornei-me motivo de riso para todo o meu povo, a canção deles o dia inteiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a canção de zombaria deles» ou «a canção com que zombam de mim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיִיתִי
  choice: Tornei-me
  rationale: O perfeito qal na primeira pessoa pode expressar a entrada numa condição que continua no contexto do lamento; «tornei-me» conserva essa ideia com naturalidade.
- source_word: שְּׂחֹק
  choice: motivo de riso
  rationale: O substantivo designa aquilo ou aquele de que se ri, com sentido de escárnio; «motivo de riso» é claro, atual e adequado à construção predicativa.
- source_word: לְכָל עַמִּי
  choice: para todo o meu povo
  rationale: A preposição לְ marca aqui a relação com os que ridicularizam o falante; «para» é natural em português, e «meu povo» traduz diretamente o sufixo de primeira pessoa.
- source_word: נְגִינָתָם
  choice: a canção deles
  rationale: O termo pode significar canção, música ou canção de escárnio. A tradução principal mantém a formulação concisa e preserva parte da ambiguidade, enquanto o paralelismo indica o tom zombeteiro.
- source_word: כָּל הַיּוֹם
  choice: o dia inteiro
  rationale: Expressão idiomática corrente que transmite a duração contínua do hebraico.
