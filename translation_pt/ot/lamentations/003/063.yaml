  yaml_path: translation/ot/lamentations/003/063.yaml
  text: Look at their sitting down and their rising up[a]; I am their song.
translation:
  language: pt
  text: Observa quando eles se sentam e quando se levantam; eu sou a canção deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a canção de zombaria deles»; isto é, aquilo que eles cantam para ridicularizar o falante. O termo hebraico pode significar «canção» ou «música» e, neste contexto, provavelmente se refere a uma canção de escárnio sobre ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְתָּם וְקִימָתָם
  choice: quando eles se sentam e quando se levantam
  rationale: Preserva o par concreto e merismático do hebraico, que abrange a conduta cotidiana deles, em formulação natural no português moderno.
- source_word: הַבִּיטָה
  choice: Observa
  rationale: Imperativo dirigido a Deus; mantém o apelo direto e solene sem recorrer ao arcaísmo «eis».
- source_word: אֲנִי
  choice: eu
  rationale: 'Retém o pronome explícito e sua ênfase: o próprio falante é o alvo da canção.'
- source_word: מַנְגִּינָתָם
  choice: a canção deles
  rationale: Traduz diretamente o substantivo «canção/música» e preserva no texto principal a ambiguidade quanto ao caráter zombeteiro, esclarecido em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens concretas do hebraico foram mantidas, evitando explicitar no texto principal o sentido de escárnio que permanece provável, mas contextual.
