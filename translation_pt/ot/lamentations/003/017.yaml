  text: וַ/תִּזְנַ֧ח מִ/שָּׁל֛וֹם נַפְשִׁ֖/י נָשִׁ֥יתִי טוֹבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/017.yaml
  text: You have thrust my soul away from peace[c][b][a]; I have forgotten goodness.
translation:
  language: pt
  text: Tu me afastaste da paz[a]; esqueci-me do bem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo “minha alma” como sujeito: “Minha alma foi privada da paz”. “Paz” traduz o hebraico shalom, que também pode significar bem-estar ou integridade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “esqueci-me da prosperidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנַח
  choice: Tu me afastaste
  rationale: O verbo זנח expressa rejeitar, repudiar ou lançar para longe. Aqui, a construção poética com נַפְשִׁי é vertida idiomaticamente por “me”, e o feminino verbal pode ter נַפְשִׁי como sujeito posposto (“minha alma se afastou”) ou, conforme a leitura contextual tradicional, dirigir-se a Deus. A tradução principal segue esta última leitura, sem explicitar mais do que o contexto permite.
- source_word: מִשָּׁלוֹם
  choice: da paz
  rationale: שָׁלוֹם abrange paz, bem-estar e integridade. “Paz” mantém o termo central e soa natural em português; a amplitude semântica é registrada em nota.
- source_word: נַפְשִׁי
  choice: me
  rationale: נֶפֶשׁ pode designar alma, vida ou a própria pessoa. O pronome “me” comunica naturalmente a pessoa inteira em português, sem impor uma distinção antropológica ausente do uso hebraico.
- source_word: נָשִׁיתִי
  choice: esqueci-me
  rationale: O perfeito na primeira pessoa do singular, de נשׁה, é entendido diretamente como “esqueci-me”. Não se introduz a nuance causativa “fizeste-me esquecer”, que não está expressa pela forma.
- source_word: טוֹבָה
  choice: do que é bom
  rationale: טוֹבָה pode significar o bem, aquilo que é bom, bem-estar ou prosperidade. “Do que é bom” preserva a amplitude da expressão e produz português corrente, sem restringi-la à prosperidade material.
theological_decisions:
- issue: Sujeito de וַתִּזְנַח e possível tratamento dirigido a Deus
  choice: Tu me afastaste
  alternative: Minha alma se afastou / foi privada da paz
  rationale: A forma verbal é terceira pessoa feminina singular e pode concordar com נַפְשִׁי como sujeito, mas a poesia e o contexto admitem uma leitura em que o sofredor se dirige a Deus. A leitura direta a Deus foi mantida no texto, enquanto a alternativa gramaticalmente possível é preservada em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e poético, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. O uso de “tu” preserva o discurso direto tradicional sem recorrer a formas arcaicas; “me” representa idiomaticamente נַפְשִׁי.
