  - severity: low
    issue: “do que é bom” é uma paráfrase mais longa que o necessário para טוֹבָה.
    rationale: “Do bem” é natural em português, conserva a abstração do substantivo hebraico e harmoniza-se com o paralelismo conciso do lamento.
