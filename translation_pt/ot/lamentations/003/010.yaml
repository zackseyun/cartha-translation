  text: דֹּ֣ב אֹרֵ֥ב הוּא֙ לִ֔/י אריה בְּ/מִסְתָּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/010.yaml
  text: He is a bear lying in wait for me[a], a lion in hiding places.
translation:
  language: pt
  text: Ele é para mim como um urso à espreita, como um leão em esconderijos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּב
  choice: um urso
  rationale: O substantivo designa claramente o urso; o artigo indefinido é natural em português nesta comparação predicativa.
- source_word: אֹרֵב
  choice: à espreita
  rationale: O particípio de ארב descreve quem aguarda oculto para atacar; «à espreita» comunica de modo natural a ideia deliberada de emboscada.
- source_word: הוּא
  choice: Ele é
  rationale: O pronome independente está expresso no hebraico e recebe forma verbal em português para formar uma oração idiomática.
- source_word: לִי
  choice: para mim
  rationale: A preposição indica que o eu lírico é o alvo da ameaça. Sua colocação junto de «Ele é» também preserva a possibilidade de reger as duas imagens paralelas.
- source_word: אַרְיֵה
  choice: um leão
  rationale: O substantivo significa «leão»; o artigo indefinido mantém o paralelismo natural com «um urso».
- source_word: בְּמִסְתָּרִים
  choice: escondido
  rationale: A expressão plural indica lugares ocultos ou esconderijos. A formulação adverbial «escondido» soa natural em português e preserva a cena de um predador oculto.
theological_decisions:
- issue: Identidade do referente de הוּא
  choice: Manter apenas o pronome «Ele», sem explicitar o referente neste versículo.
  alternative: Substituir por «Deus» ou «o Senhor».
  rationale: Embora o contexto identifique o agente, o hebraico emprega somente o pronome; explicitar um nome divino resolveria no texto algo que o versículo deixa implícito.
- issue: Força metafórica da predicação
  choice: Usar «como» nas duas imagens.
  alternative: 'Tradução formal direta: «Ele é para mim um urso... um leão...»'
  rationale: Em português corrente, «como» sinaliza naturalmente a comparação metafórica sem alterar seu referente ou atenuar a ameaça.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura paralela «como um urso... como um leão...» conserva o ritmo poético e a dupla imagem predatória. Não há marcador de nota, pois a alternativa inglesa fornecida parece deslocada: «a lion in secret places» corresponde à segunda oração, não constitui alternativa textual à primeira.'
