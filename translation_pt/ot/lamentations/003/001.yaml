base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/001.yaml
  text: I am the man who has seen affliction under the rod of his wrath[a][b].
translation:
  language: pt
  text: Eu sou o homem que viu a aflição sob a vara da sua ira[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «pela vara da sua ira». A preposição hebraica pode indicar mais de uma relação.'
    reason: lexical_alternative
  - marker: b
    text: «Aflição» também pode ser traduzida por «miséria» ou «sofrimento».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי הַגֶּבֶר
  choice: Eu sou o homem
  rationale: A frase nominal hebraica começa com o pronome independente enfático e traz o substantivo masculino definido. Em português, «Eu sou o homem» comunica naturalmente a autodeclaração e preserva a definição e o gênero do original.
- source_word: רָאָה
  choice: que viu
  rationale: Mantém o sentido simples de «ver» e a forma verbal concluída do hebraico. No contexto, «ver» também pode implicar vivenciar, sem que essa interpretação seja inserida explicitamente na tradução.
- source_word: עֳנִי
  choice: a aflição
  rationale: «Aflição» abrange sofrimento e miséria sem restringir o termo à pobreza econômica.
- source_word: בְּשֵׁבֶט
  choice: sob a vara
  rationale: «Vara» preserva a imagem de instrumento de castigo. A preposição בְּ admite mais de uma relação; «sob» expressa sujeição à vara sem eliminar a alternativa instrumental «pela».
- source_word: עֶבְרָתוֹ
  choice: da sua ira
  rationale: «Ira» mantém o tom solene e a intensidade do substantivo hebraico. «Sua» conserva o sufixo masculino singular sem explicitar um referente que o versículo não nomeia.
theological_decisions:
- issue: Referente do pronome em «sua ira»
  choice: Manter «sua», sem acrescentar «Deus» ou «SENHOR».
  alternative: «da ira do SENHOR» ou «da ira de Deus»
  rationale: O hebraico contém apenas um sufixo pronominal masculino singular. Embora o contexto mais amplo indique o referente divino, nomeá-lo neste versículo eliminaria uma característica literária do texto e acrescentaria material não explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão poética, a imagem da vara e a ambiguidade da preposição e do referente pronominal.
