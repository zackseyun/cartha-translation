base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/057.yaml
  text: You came near on the day I called to you; you said[a], “Do not fear.”
translation:
  language: pt
  text: 'Tu te aproximaste no dia em que clamei a ti; disseste: “Não temas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרַבְתָּ
  choice: Tu te aproximaste
  rationale: O qal perfeito na segunda pessoa masculina singular indica que Deus se aproximou. “Aproximaste” preserva o sentido concreto de proximidade e soa natural em português.
- source_word: בְּיוֹם
  choice: no dia em que
  rationale: A construção tem sentido temporal. “No dia em que” conserva a imagem hebraica do dia, com fluidez em português.
- source_word: אֶקְרָאֶךָּ
  choice: clamei a ti
  rationale: A forma de קרא está na primeira pessoa singular com sufixo de segunda pessoa masculina singular. No contexto de oração, “clamei a ti” expressa adequadamente um chamado dirigido a Deus sem acrescentar conteúdo não declarado.
- source_word: אָמַרְתָּ
  choice: disseste
  rationale: Tradução direta da forma de אמר na segunda pessoa masculina singular, em harmonia com o tratamento por “tu”.
- source_word: אַל
  choice: não
  rationale: A partícula negativa diante do imperfeito/jussivo introduz uma proibição ou exortação negativa, representada diretamente por “não”.
- source_word: תִּירָא
  choice: temas
  rationale: A forma de ירא na segunda pessoa masculina singular, após אַל, é bem representada pelo presente do subjuntivo em “Não temas”, fórmula clara, digna e corrente.
theological_decisions:
- issue: Identificação do interlocutor e do falante
  choice: 'O versículo é traduzido como fala dirigida diretamente a Deus: “Tu te aproximaste... disseste”.'
  alternative: Uma leitura com sujeito impessoal ou não especificado é gramaticalmente menos provável no contexto.
  rationale: As formas verbais na segunda pessoa masculina singular indicam claramente um interlocutor singular; no contexto da oração circundante, trata-se de Deus. A tradução mantém essa relação direta sem acrescentar afirmações doutrinárias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento coerente por “tu”. A formulação poética mantém o paralelismo e a concisão do hebraico.
