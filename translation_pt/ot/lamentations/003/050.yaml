  text: until Yahweh looks down and sees from heaven[a].
translation:
  language: pt
  text: até que Yahweh olhe e veja dos céus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “olhe e veja”; os dois verbos formam uma expressão paralela que enfatiza a observação atenta de Yahweh dos céus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: até que
  rationale: Marca o ponto final da condição contínua descrita no versículo anterior e introduz naturalmente uma oração verbal em português.
- source_word: יַשְׁקִיף
  choice: olhe lá do alto
  rationale: O hifil de שׁקף expressa olhar de um lugar elevado; esta formulação preserva a perspectiva vertical sem antecipar de modo redundante a expressão final.
- source_word: וְיֵרֶא
  choice: e veja
  rationale: Mantém distinto o verbo comum ראה, “ver”, preservando os dois verbos hebraicos e sua intensificação poética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מִשָּׁמָיִם
  choice: desde os céus
  rationale: Preserva a imagem da observação procedente da morada celestial e reflete de maneira natural a forma hebraica שָׁמַיִם.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” conserva o nome pessoal, sem o substituir por um título.
translation_notes:
  register: Português moderno, digno e acessível. A formulação mantém a ligação sintática com o versículo anterior, os dois verbos do hebraico e a imagem vertical da observação divina.
