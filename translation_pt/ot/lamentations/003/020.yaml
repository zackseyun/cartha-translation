lexical_decisions:
- source_word: זָכוֹר תִּזְכּוֹר
  choice: se lembra disso sem cessar
  rationale: O infinitivo absoluto seguido do imperfeito intensifica a ideia verbal. “Sem cessar” comunica em português natural a lembrança insistente ou contínua. O pronome “disso” retoma o conteúdo do versículo anterior, objeto implícito do verbo no hebraico.
- source_word: וְתָשִׁיחַ
  choice: e se curva
  rationale: A forma verbal descreve a alma sendo abatida ou curvando-se. “Se curva” preserva a imagem concreta do hebraico sem explicá-la como mero estado emocional.
- source_word: עָלַי
  choice: dentro de mim
  rationale: Embora a preposição signifique literalmente “sobre mim”, neste contexto poético ela expressa o abatimento interior do falante. “Dentro de mim” reproduz naturalmente o sentido em português, enquanto a nota registra a forma literal.
- source_word: נַפְשִׁי
  choice: Minha alma
  rationale: נֶפֶשׁ pode indicar a pessoa, a vida ou o ser interior. “Minha alma” conserva a linguagem poética e a imagem antropológica do texto.
