  text: My soul continually remembers and is bowed down within me[a].
translation:
  language: pt
  text: Minha alma se lembra disso sem cessar e se curva dentro de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “Lembrar, ela lembra; e minha alma se curva sobre mim.” A repetição intensifica o ato de lembrar.'
