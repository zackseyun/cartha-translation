  text: חֶלְקִ֤/י יְהוָה֙ אָמְרָ֣ה נַפְשִׁ֔/י עַל כֵּ֖ן אוֹחִ֥יל לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/024.yaml
  text: “Yahweh is my portion,” says my soul[b][a]; “therefore I will hope in him.”
translation:
  language: pt
  text: “Yahweh é a minha porção[a]”, diz a minha alma; “por isso, nele esperarei[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha parte” ou “a minha herança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “terei esperança nele” ou “esperarei por ele com esperança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקִי
  choice: a minha porção
  rationale: חֵלֶק designa uma porção, parte ou herança recebida. “Minha porção” preserva a concisão e a força devocional da poesia hebraica sem restringir o sentido a uma herança jurídica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אָמְרָה
  choice: diz
  rationale: Embora a forma hebraica seja perfectiva, aqui ela introduz uma declaração confessional com valor presente; “diz” é natural em português.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Neste contexto, נֶפֶשׁ indica o próprio ser interior do poeta. “Minha alma” mantém o caráter poético sem impor uma antropologia técnica.
- source_word: עַל־כֵּן
  choice: por isso
  rationale: A locução assinala a consequência da confissão anterior; “por isso” reproduz a relação lógica em português corrente.
- source_word: אוֹחִיל
  choice: esperarei
  rationale: O hifil de יחל reúne as ideias de esperar, aguardar e manter esperança. “Esperarei” preserva essa amplitude melhor do que uma formulação que expresse apenas expectativa interior.
- source_word: לוֹ
  choice: nele
  rationale: Com יחל, o pronome introduz aquele em quem se deposita esperança ou por quem se espera. “Nele” expressa naturalmente a confiança pessoal em português, embora “por ele” também seja possível.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico emprega explicitamente o tetragrama יְהוָה. “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título “SENHOR”; “Javé” é uma forma portuguesa tradicional, mas a transliteração escolhida mantém continuidade editorial.
- issue: Sentido de חֶלְקִי aplicado a Yahweh
  choice: a minha porção
  alternative: a minha parte; a minha herança
  rationale: A metáfora pode evocar tanto a parte que cabe ao fiel quanto uma herança recebida. “Porção” mantém essa tensão sem tornar explícita apenas uma das imagens.
- issue: Relação entre esperança e espera em אוֹחִיל לוֹ
  choice: esperarei nele
  alternative: porei nele a minha esperança; aguardarei por ele com esperança
  rationale: O hebraico combina espera e expectativa confiante. A tradução principal conserva essa ambiguidade, e a nota explicita as duas nuances sem decidir entre elas.
translation_notes:
  register: Português moderno, claro e digno, com estrutura poética concisa. Conserva “minha alma” e “minha porção” por sua força literária, mas emprega sintaxe corrente e inteligível. Os marcadores [a] e [b] aparecem junto às expressões a que se referem.
