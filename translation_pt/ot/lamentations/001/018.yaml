  text: צַדִּ֥יק ה֛וּא יְהוָ֖ה כִּ֣י פִ֣י/הוּ מָרִ֑יתִי שִׁמְעוּ נָ֣א כָל עמים וּ/רְאוּ֙ מַכְאֹבִ֔/י בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י הָלְכ֥וּ בַ/שֶּֽׁבִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/018.yaml
  text: 'Yahweh is righteous[a], for I have rebelled against his word. Hear, please, all peoples[b], and see my pain: my virgins and my young men have gone into captivity.'
translation:
  language: pt
  text: 'Yahweh é justo, pois me rebelei contra o que ele disse.[a] Escutem, por favor, todos os povos, e vejam a minha dor: minhas moças[b] e meus jovens foram para o cativeiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “contra a sua boca”; isto é, contra aquilo que ele falou ou ordenou.
    reason: lexical_alternative
  - marker: b
    text: Ou “minhas virgens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: justo
  rationale: Como adjetivo predicativo, afirma que Yahweh age com retidão em seu julgamento; “justo” é natural em português e preserva o peso moral e teológico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão pela qual Jerusalém reconhece a justiça de Yahweh, mantendo o fluxo confessional e poético.
- source_word: פִּיהוּ
  choice: o que ele disse
  rationale: A expressão significa literalmente “a sua boca”, mas funciona aqui como metonímia para aquilo que Yahweh falou ou ordenou; a formulação escolhida é clara e natural.
- source_word: מָרִיתִי
  choice: me rebelei contra
  rationale: Preserva a ideia forte de rebeldia ou desafio à autoridade, bem como a confissão na primeira pessoa.
- source_word: שִׁמְעוּ נָא
  choice: Escutem, por favor
  rationale: Reproduz o imperativo plural e o tom suplicante da partícula נָא em português corrente.
- source_word: כָל עַמִּים
  choice: todos os povos
  rationale: Mantém o sentido amplo de grupos humanos ou nações aos quais a cidade personificada dirige seu apelo.
- source_word: וּרְאוּ
  choice: e vejam
  rationale: Imperativo direto, paralelo a “Escutem”, que conserva a estrutura do hebraico.
- source_word: מַכְאֹבִי
  choice: a minha dor
  rationale: Tradução concisa e concreta do sofrimento expresso pelo substantivo no contexto do lamento.
- source_word: בְּתוּלֹתַי
  choice: minhas jovens
  rationale: No contexto coletivo e em paralelo com os jovens, designa as moças da cidade; a nota registra o sentido lexical mais específico, “virgens”.
- source_word: וּבַחוּרַי
  choice: meus jovens
  rationale: Refere-se aos homens jovens da comunidade e forma um par natural em português com “minhas jovens”.
- source_word: הָלְכוּ בַשֶּׁבִי
  choice: foram levados para o cativeiro
  rationale: Embora הָלְכוּ seja literalmente “foram”, a expressão completa descreve a ida involuntária como cativos; a forma passiva comunica naturalmente esse sentido contextual sem sugerir partida voluntária.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome divino; “Yahweh” preserva sua função como nome pessoal, sem substituí-lo por um título.
- issue: Grau de literalidade de פִּיהוּ
  choice: o que ele disse
  alternative: a sua boca; a sua palavra; a sua ordem
  rationale: “Sua boca” é a forma literal, mas a expressão metonímica se refere à fala ou ordem divina. O texto principal comunica o sentido em português natural, e a nota preserva a imagem hebraica e sua amplitude.
- issue: Agência na ida ao cativeiro
  choice: foram levados para o cativeiro
  alternative: foram para o cativeiro
  rationale: A tradução explicita a coerção inerente ao contexto de deportação, sem identificar no versículo quem os levou; a alternativa mais formal preservaria mais de perto o verbo simples “ir”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala da Jerusalém personificada mantém tom confessional e suplicante. Preferiu-se “jovens” a “virgens” no texto principal por naturalidade coletiva, preservando-se a especificidade lexical na documentação; não foi acrescentada uma segunda nota porque o único marcador necessário no texto é [a].
