  terminology: «Yahweh» preserva corretamente o nome divino; «justo», «me rebelei contra o que ele disse» e «cativeiro» são escolhas apropriadas. «Moças» torna mais nítida a referência feminina em contraste com «jovens» (rapazes), enquanto a nota registra o valor mais específico de בְּתוּלֹתַי.
