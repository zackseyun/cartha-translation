revisions:
- from: Judá foi para o exílio por causa da aflição e da dura servidão. Ela habita entre as nações e não encontra descanso. Todos os seus perseguidores a alcançaram em lugares estreitos.[a]
  to: Judá foi para o exílio por causa da aflição e da grande servidão. Ela habita entre as nações e não encontra descanso. Todos os seus perseguidores a alcançaram em passagens estreitas.[a]
  rationale: A revisão substitui “dura” por “grande”, refletindo diretamente רֹב sem acrescentar uma qualificação não expressa. Também torna a imagem final mais natural em português e ajusta a nota para manter a alternativa literal e a ambiguidade sem especificação topográfica indevida.
