base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/003.yaml
  text: Judah has gone into exile because of affliction and because of great servitude; she dwells among the nations and finds no rest[a]. All her pursuers have overtaken her in the narrow places.
translation:
  language: pt
  text: Judá foi para o exílio por causa da aflição e da grande servidão. Ela habita entre as nações e não encontra descanso. Todos os seus perseguidores a alcançaram em passagens estreitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre lugares estreitos”; a expressão hebraica também pode evocar aflição, retratando Judá encurralada, sem saída.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְתָה
  choice: foi para o exílio
  rationale: O qal de גלה indica ir para o exílio. A formulação preserva o motivo central do exílio sem explicitar uma voz passiva que o hebraico não exige.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional do nome próprio; o contexto personifica Judá no feminino, retomado por “ela”.
- source_word: מֵעֹנִי
  choice: por causa da aflição
  rationale: מִן é entendido em sentido causal, e עֹנִי designa sofrimento ou miséria sem necessariamente se limitar à pobreza econômica.
- source_word: וּמֵרֹב עֲבֹדָה
  choice: e da dura servidão
  rationale: עֲבֹדָה pode indicar trabalho ou serviço imposto; no contexto, “servidão” comunica a opressão sem restringir indevidamente o termo a uma condição jurídica específica. “Dura” expressa de modo natural a intensidade de רֹב.
- source_word: הִיא יָשְׁבָה בַגּוֹיִם
  choice: Ela habita entre as nações
  rationale: ישב aqui significa habitar ou viver. “Habita” mantém o caráter poético e a condição de deslocamento entre povos estrangeiros.
- source_word: לֹא מָצְאָה מָנוֹחַ
  choice: não encontra descanso
  rationale: מָנוֹחַ pode designar descanso ou lugar de repouso. A tradução concisa conserva ambas as dimensões de forma natural.
- source_word: כָּל רֹדְפֶיהָ
  choice: Todos os seus perseguidores
  rationale: O particípio de רדף retrata aqueles que a perseguem, preservando a imagem concreta de uma caçada.
- source_word: הִשִּׂיגוּהָ
  choice: a alcançaram
  rationale: O hifil de נשׂג significa alcançar ou apanhar alguém perseguido. “Alcançaram” mantém diretamente a metáfora da perseguição.
- source_word: בֵּין הַמְּצָרִים
  choice: em lugares estreitos
  rationale: A expressão evoca espaços ou passagens apertadas onde não há fuga, podendo também sugerir aflição. A imagem espacial permanece no texto, e a ambiguidade é registrada em nota.
