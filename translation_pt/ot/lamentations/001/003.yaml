review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o hebraico e preserva a personificação feminina de Judá, o exílio, a ausência de descanso e a imagem da perseguição. Contudo, “dura servidão” desloca a ênfase explícita de רֹב (“grande”, “muita”) para uma qualificação de severidade que o texto não enuncia diretamente.
  naturalness: O português é claro, moderno e de registro apropriadamente literário. “Grande servidão” é natural o suficiente neste contexto poético e recupera melhor a intensidade quantitativa do original. “Em passagens estreitas” é mais idiomático que “em lugares estreitos” e preserva a imagem espacial.
  terminology: “Judá”, “exílio”, “aflição”, “servidão”, “nações”, “descanso” e “perseguidores” são escolhas adequadas. A nota deve apresentar como alternativa a construção literal com “entre”, sem tornar “desfiladeiros” uma especificação topográfica excessiva.
  issues:
  - severity: medium
    issue: “dura servidão” para וּמֵרֹב עֲבֹדָה
    rationale: רֹב significa “grandeza”, “abundância” ou “muito”. Embora a servidão possa ser dura no contexto, “dura” introduz uma nuance qualitativa e deixa de explicitar a intensidade indicada pelo hebraico.
  - severity: low
    issue: Nota alternativa “entre os desfiladeiros”
    rationale: “Desfiladeiros” restringe a imagem a um tipo específico de terreno. O hebraico se refere mais amplamente a lugares, passagens ou estreitezas; a alternativa literal deve conservar essa abertura.
