  text: מִ/מָּר֛וֹם שָֽׁלַח אֵ֥שׁ בְּ/עַצְמֹתַ֖/י וַ/יִּרְדֶּ֑/נָּה פָּרַ֨שׂ רֶ֤שֶׁת לְ/רַגְלַ/י֙ הֱשִׁיבַ֣/נִי אָח֔וֹר נְתָנַ֨/נִי֙ שֹֽׁמֵמָ֔ה כָּל הַ/יּ֖וֹם דָּוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/013.yaml
  text: From on high he sent fire into my bones[a], and it prevailed against them; he spread a net for my feet; he turned me back; he made me desolate[b], faint all day long.
translation:
  language: pt
  text: Do alto, ele enviou fogo para dentro dos meus ossos[a] e os subjugou; estendeu uma rede para os meus pés, fez-me voltar para trás; deixou-me desolada, enferma[b] o dia inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos meus ossos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “abatida o dia inteiro” ou “definhando o dia inteiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּרוֹם
  choice: Do alto
  rationale: Preserva a referência a um lugar elevado sem explicitar “céu”, que é mais específico do que o hebraico.
- source_word: שָׁלַח אֵשׁ
  choice: enviou fogo
  rationale: Tradução direta que mantém a imagem vívida e a agência do sujeito implícito.
- source_word: בְּעַצְמֹתַי
  choice: para dentro dos meus ossos
  rationale: Expressa de modo natural o caráter invasivo do fogo, embora a preposição também possa indicar “nos meus ossos”.
- source_word: וַיִּרְדֶּנָּה
  choice: e os subjugou
  rationale: O verbo רדה pode significar governar, dominar ou subjugar; o fogo é o sujeito feminino singular e “ossos” fornece o referente plural do objeto pronominal.
- source_word: פָּרַשׂ רֶשֶׁת לְרַגְלַי
  choice: estendeu uma rede para os meus pés
  rationale: Mantém literalmente a imagem corporal de uma armadilha preparada para impedir a fuga.
- source_word: הֱשִׁיבַנִי אָחוֹר
  choice: fez-me voltar para trás
  rationale: Reproduz a forma causativa de שוב e a ideia explícita de recuo expressa por אָחוֹר.
- source_word: נְתָנַנִי שֹׁמֵמָה
  choice: deixou-me desolada
  rationale: Comunica o estado resultante de devastação; o feminino concorda com a voz personificada de Jerusalém.
- source_word: כָּל־הַיּוֹם דָּוָה
  choice: enferma o dia inteiro
  rationale: דָּוָה denota enfermidade, fraqueza ou abatimento persistente; “enferma” preserva sua amplitude sem reduzir a expressão apenas ao cansaço.
theological_decisions:
- issue: Sujeito implícito da sequência verbal
  choice: Manter “ele” sem identificar explicitamente o sujeito pelo nome.
  alternative: Traduzir o sujeito como “o SENHOR”.
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular e o contexto aponta para a ação divina, mas este versículo não contém o nome divino; “ele” evita acrescentá-lo.
- issue: Gênero da voz que lamenta
  choice: Usar formas femininas em “desolada” e “enferma”.
  alternative: Empregar formulação sem marca explícita de gênero.
  rationale: A voz poética representa Sião/Jerusalém personificada como mulher, e as formas hebraicas שֹׁמֵמָה e דָּוָה são femininas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se o paralelismo poético, as imagens corporais e de armadilha e o sujeito não nomeado. A pontuação organiza as quatro ações sem eliminar sua progressão acumulativa.
