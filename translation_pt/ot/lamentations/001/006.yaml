  text: וַ/יֵּצֵ֥א מן בת צִיּ֖וֹן כָּל הֲדָרָ֑/הּ הָי֣וּ שָׂרֶ֗י/הָ כְּ/אַיָּלִים֙ לֹא מָצְא֣וּ מִרְעֶ֔ה וַ/יֵּלְכ֥וּ בְ/לֹא כֹ֖חַ לִ/פְנֵ֥י רוֹדֵֽף־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/006.yaml
  text: From daughter Zion all her splendor has departed[a]; her princes have become like deer that find no pasture[b]; they went without strength before the pursuer.
translation:
  language: pt
  text: Todo o esplendor da filha de Sião se foi[a]. Seus príncipes tornaram-se como cervos que não encontram pasto[b]; caminharam sem forças diante do perseguidor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Toda a sua majestade” ou “toda a sua beleza saiu da filha de Sião”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como veados que não acharam pastagem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מִן בַּת־צִיּוֹן
  choice: da filha de Sião se foi
  rationale: Conserva a imagem profética de Sião personificada como filha e expressa em português natural a ideia de que seu esplendor saiu dela ou a deixou.
- source_word: כָּל הֲדָרָהּ
  choice: todo o esplendor
  rationale: “Esplendor” abrange a beleza, a dignidade e a majestade visível indicadas por הָדָר, sem acrescentar a carga teológica que “glória” poderia sugerir.
- source_word: שָׂרֶיהָ
  choice: seus príncipes
  rationale: Mantém o sentido político e régio de שַׂר no contexto nacional e poético, embora “líderes” ou “autoridades” também sejam possíveis.
- source_word: כְּאַיָּלִים
  choice: como cervos
  rationale: אַיָּלִים designa cervos, possivelmente machos. “Cervos” é claro, digno e adequado à comparação poética.
- source_word: לֹא מָצְאוּ מִרְעֶה
  choice: que não encontram pasto
  rationale: O presente torna vívida a condição evocada pela comparação; “pasto” comunica de modo simples o lugar de alimentação dos animais.
- source_word: וַיֵּלְכוּ
  choice: caminharam
  rationale: Reproduz o verbo amplo הלך sem inserir explicitamente a ideia de fuga, embora o contexto seja de perseguição.
- source_word: בְלֹא כֹחַ
  choice: sem forças
  rationale: A expressão idiomática portuguesa transmite esgotamento físico e perda de vigor; o plural é natural em português.
- source_word: לִפְנֵי רוֹדֵף
  choice: diante do perseguidor
  rationale: Preserva a relação espacial e hostil de serem impelidos à frente de quem os persegue, mantendo o singular coletivo ou representativo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A personificação poética “filha de Sião” e o paralelismo do lamento foram preservados; evitou-se explicitar fuga onde o verbo hebraico diz apenas ir ou caminhar.
