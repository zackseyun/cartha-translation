  text: סִלָּ֨ה כָל אַבִּירַ֤/י אֲדֹנָ/י֙ בְּ/קִרְבִּ֔/י קָרָ֥א עָלַ֛/י מוֹעֵ֖ד לִ/שְׁבֹּ֣ר בַּחוּרָ֑/י גַּ֚ת דָּרַ֣ךְ אֲדֹנָ֔/י לִ/בְתוּלַ֖ת בַּת יְהוּדָֽה־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/015.yaml
  text: The Lord has rejected all my mighty men in my midst[a]; he has summoned an appointed time against me to crush my young men[b]. The Lord has trodden the winepress for the virgin daughter of Judah.
translation:
  language: pt
  text: O Senhor rejeitou todos os meus homens valentes que estavam em meu meio; convocou contra mim uma assembleia[a] para esmagar meus jovens. O Senhor pisou, como num lagar[b], a virgem filha de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “determinou contra mim um tempo marcado”. O hebraico מוֹעֵד pode indicar tanto um tempo determinado quanto uma reunião ou assembleia convocada.
    reason: lexical_alternative
  - marker: b
    text: Pisar uvas no lagar é aqui uma imagem de juízo severo e destruidor.
    reason: cultural_note
lexical_decisions:
- source_word: סִלָּה
  choice: rejeitou
  rationale: O piel, neste contexto de derrota e juízo, expressa rejeição ou descarte decisivo, e não simplesmente elevação.
- source_word: אַבִּירַי
  choice: meus homens valentes
  rationale: O termo designa os fortes ou poderosos, aqui provavelmente guerreiros; “homens valentes” preserva o sentido marcial em português claro.
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: Traduz o título divino אֲדֹנָי de modo tradicional e natural, sem tratá-lo como se fosse o nome divino יהוה.
- source_word: בְּקִרְבִּי
  choice: que estavam em meu meio
  rationale: 'Explicita o sentido espacial e comunitário: os guerreiros encontravam-se dentro de Jerusalém personificada, não no interior psicológico da narradora.'
- source_word: קָרָא עָלַי מוֹעֵד
  choice: convocou contra mim uma assembleia
  rationale: קרא com מועד pode indicar a convocação de uma reunião designada. A formulação preserva a ironia de uma assembleia convocada não para celebração, mas para juízo; a nota registra a possível leitura temporal.
- source_word: לִשְׁבֹּר
  choice: para esmagar
  rationale: Embora o verbo possa significar literalmente “quebrar”, “esmagar” transmite adequadamente a destruição violenta no contexto militar.
- source_word: בַּחוּרַי
  choice: meus jovens
  rationale: Designa homens jovens no vigor da idade, muitas vezes aptos para a guerra; o contexto torna desnecessário acrescentar “guerreiros”.
- source_word: גַּת דָּרַךְ
  choice: pisou no lagar
  rationale: Mantém a imagem concreta de pisar uvas no lagar, empregada como metáfora de juízo devastador.
- source_word: לִבְתוּלַת בַּת יְהוּדָה
  choice: a virgem, filha de Judá
  rationale: Preserva a personificação feminina de Judá. A construção da frase apresenta essa figura como quem é pisada no lagar, sem interpretar “virgem” como afirmação sobre uma pessoa histórica específica.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: O Senhor
  alternative: O Soberano
  rationale: “O Senhor” representa diretamente o título אֲדֹנָי e mantém a distinção em relação ao tetragrama יהוה, sem acrescentar uma nuance teológica ausente do termo.
- issue: Agência divina no juízo
  choice: Manter o Senhor como agente explícito da rejeição, convocação e ação no lagar
  alternative: Atenuar as ações como simples permissão divina
  rationale: A gramática hebraica atribui diretamente as três ações ao Senhor. A tradução conserva essa tensão teológica em vez de substituí-la por linguagem de mera permissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente explicitada em “que estavam em meu meio” para evitar que a personificação de Jerusalém pareça descrever um estado psicológico. A metáfora do lagar foi mantida, e a ambiguidade de מוֹעֵד foi preservada por meio de nota.
