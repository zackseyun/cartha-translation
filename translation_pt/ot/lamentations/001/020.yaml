  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: רְאֵ֨ה יְהוָ֤ה כִּֽי צַר לִ/י֙ מֵעַ֣/י חֳמַרְמָ֔רוּ נֶהְפַּ֤ךְ לִבִּ/י֙ בְּ/קִרְבִּ֔/י כִּ֥י מָר֖וֹ מָרִ֑יתִי מִ/ח֥וּץ שִׁכְּלָה חֶ֖רֶב בַּ/בַּ֥יִת כַּ/מָּֽוֶת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/020.yaml
  text: Look[a], O Yahweh, for I am in distress; my inward parts are churning; my heart is overturned within me, because I have been very rebellious[b]. Outside the sword bereaves[c]; inside the house it is like death.
translation:
  language: pt
  text: Olha, Yahweh, pois estou em angústia! Minhas entranhas se agitam[a]; meu coração se revira dentro de mim, porque me rebelei gravemente[b]. Lá fora, a espada deixa sem filhos; dentro de casa, é como a morte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “minhas entranhas”, expressão corporal para profunda angústia interior.'
    reason: cultural_note
  - marker: b
    text: 'Também pode ser traduzido: “porque fui muito rebelde” ou “porque me rebelei amargamente”. O hebraico intensifica o verbo “rebelar-se” combinando-o com uma forma da mesma raiz.'
    reason: lexical_alternative
  - marker: c
    text: 'A frase hebraica é breve e elíptica. Também se poderia entender: “dentro de casa, há morte”, embora a forma hebraica normalmente indique comparação: “como a morte”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה
  choice: Olha
  rationale: O imperativo introduz um apelo direto a Deus. “Olha” é atual e natural, sem o tom arcaico de “Eis”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: צַר לִי
  choice: estou em angústia
  rationale: Expressa de modo idiomático o estado pessoal de aflição indicado pela construção hebraica.
- source_word: מֵעַי חֳמַרְמָרוּ
  choice: minhas entranhas se agitam
  rationale: Mantém a imagem corporal hebraica e comunica a intensa perturbação interior sem sugerir apenas uma reação fisiológica.
- source_word: נֶהְפַּךְ לִבִּי בְּקִרְבִּי
  choice: meu coração se revira dentro de mim
  rationale: Preserva a metáfora de inversão ou reviramento interior e soa natural em português.
- source_word: כִּי מָרוֹ מָרִיתִי
  choice: porque me rebelei gravemente
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a rebelião; “gravemente” comunica essa ênfase sem apagar o caráter verbal da confissão.
- source_word: מִחוּץ
  choice: Lá fora
  rationale: Marca com clareza o contraste espacial e poético com “dentro de casa”.
- source_word: שִׁכְּלָה חֶרֶב
  choice: a espada deixa sem filhos
  rationale: O verbo denota causar perda e, frequentemente, privar de filhos. A formulação conserva essa força específica e a concisão poética.
- source_word: בַּבַּיִת כַּמָּוֶת
  choice: dentro de casa, é como a morte
  rationale: Conserva tanto o contraste exterior/interior quanto a comparação introduzida por כְּ, suprindo apenas o verbo exigido em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
- issue: Relação entre sofrimento e rebelião na confissão de Sião
  choice: 'manter a afirmação causal explícita: “porque me rebelei gravemente”'
  alternative: atenuar para uma associação menos direta entre a angústia e a rebelião
  rationale: A conjunção כִּי e a confissão enfática vinculam a perturbação interior à rebelião. A tradução mantém essa tensão teológica sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A fala poética conserva imagens corporais fortes, paralelismo espacial e concisão. Evitaram-se arcaísmos e explicações interpretativas no corpo do versículo.
