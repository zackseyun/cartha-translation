  terminology: “Yahweh” mantém de modo consistente o nome divino. “Angústia”, “entranhas”, “rebelei” e “espada” são escolhas adequadas ao registro de Lamentações. As notas explicam a antropologia corporal, a intensificação verbal e a elipse final de forma sóbria e não confessional.
