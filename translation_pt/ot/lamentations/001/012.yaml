  naturalness: “Não lhes importa, a todos vocês que passam pelo caminho?” é uma formulação mais idiomática e retoricamente adequada em português moderno. “Dor como a minha” evita uma repetição um pouco pesada sem perder a comparação enfática, já presente em “dor”.
  terminology: “Yahweh”, “dor”, “infligida”, “afligiu” e “ira ardente” são escolhas adequadas. O nome divino e a agência causativa do hebraico são preservados sem acréscimos interpretativos.
