  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ל֣וֹא אֲלֵי/כֶם֮ כָּל עֹ֣בְרֵי דֶרֶךְ֒ הַבִּ֣יטוּ וּ/רְא֗וּ אִם יֵ֤שׁ מַכְאוֹב֙ כְּ/מַכְאֹבִ֔/י אֲשֶׁ֥ר עוֹלַ֖ל לִ֑/י אֲשֶׁר֙ הוֹגָ֣ה יְהוָ֔ה בְּ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/012.yaml
  text: Is it nothing to you[a], all you who pass by on the road? Look and see whether there is any sorrow like my sorrow, which was dealt to me[b], with which Yahweh afflicted me in the day of his fierce anger.
translation:
  language: pt
  text: Não lhes importa, a todos vocês que passam pelo caminho? Olhem e vejam se há dor como a minha, que me foi infligida, com a qual Yahweh me afligiu no dia de sua ira ardente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוא אֲלֵיכֶם
  choice: Isso não significa nada para vocês
  rationale: A expressão hebraica é elíptica, literalmente «não para vocês». Em contexto, funciona como um apelo indignado à atenção e à compaixão dos que passam.
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: todos os que passam pelo caminho
  rationale: Preserva tanto o particípio «os que passam» quanto a imagem concreta do caminho, em português natural.
- source_word: הַבִּיטוּ וּרְאוּ
  choice: Olhem e vejam
  rationale: Os dois imperativos reforçam o apelo; a repetição é clara, direta e digna em português atual.
- source_word: אִם יֵשׁ
  choice: se há
  rationale: Depois dos imperativos, introduz uma pergunta indireta e comparativa. «Se há» mantém com naturalidade a forma do hebraico.
- source_word: מַכְאוֹב ... כְּמַכְאֹבִי
  choice: dor ... como a minha dor
  rationale: מַכְאוֹב pode designar dor, sofrimento ou pesar. «Dor» preserva sua amplitude física e emocional e permite manter a repetição enfática.
- source_word: אֲשֶׁר עוֹלַל לִי
  choice: a que me foi infligida
  rationale: O verbo descreve tratamento severo ou algo feito contra a pessoa. A construção passiva conserva o foco no sofrimento recebido sem antecipar explicitamente o agente.
- source_word: אֲשֶׁר הוֹגָה
  choice: com a qual ... me afligiu
  rationale: O hifil de יגה expressa causar pesar ou afligir. «Afligiu» tem o peso adequado e conserva a ligação relativa com a dor mencionada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיוֹם חֲרוֹן אַפּוֹ
  choice: no dia de sua ira ardente
  rationale: A expressão חֲרוֹן אַף evoca literalmente uma ira que arde. «Ira ardente» preserva sua intensidade e imagem em linguagem compreensível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. «Yahweh» preserva o caráter de nome pessoal sem substituir o hebraico por um título.
- issue: Agência divina no sofrimento de Sião
  choice: Yahweh me afligiu
  alternative: Yahweh permitiu que eu fosse afligida
  rationale: O hifil הוֹגָה atribui a Yahweh ação causativa direta. A tradução não atenua essa tensão teológica introduzindo mera permissão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso é direto e solene, com a repetição «dor ... minha dor» e a dupla ordem «Olhem e vejam» preservadas por sua força poética. A pontuação mantém a primeira frase como pergunta retórica.
