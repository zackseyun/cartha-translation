  to: Não lhes importa, a todos vocês que passam pelo caminho? Olhem e vejam se há dor como a minha, que me foi infligida, com a qual Yahweh me afligiu no dia de sua ira ardente.
  rationale: A revisão substitui uma formulação que sugere ‘falta de significado’ por uma pergunta que expressa mais precisamente o apelo retórico hebraico aos transeuntes. Mantém-se a ambiguidade elíptica por meio de nota, a repetição conceitual da dor, a intensidade da ira e a ação direta de Yahweh.
