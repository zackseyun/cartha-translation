  text: כָּל עַמָּ֤/הּ נֶאֱנָחִים֙ מְבַקְּשִׁ֣ים לֶ֔חֶם נָתְנ֧וּ מחמודי/הם בְּ/אֹ֖כֶל לְ/הָשִׁ֣יב נָ֑פֶשׁ רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה כִּ֥י הָיִ֖יתִי זוֹלֵלָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/011.yaml
  text: All her people groan[a], seeking bread; they have given their precious things for food to restore life. Look, O Yahweh, and see[c][b], for I have become despised.
translation:
  language: pt
  text: Todo o povo dela geme, à procura de pão. Entregaram seus bens preciosos[a] em troca de alimento, para restaurar a vida[b]. “Olha, ó Yahweh, e vê, pois me tornei desprezível[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus tesouros” ou “suas coisas desejáveis”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para restaurar a vida”. A expressão também pode indicar recuperar o vigor ou preservar a vida.
    reason: lexical_alternative
  - marker: c
    text: Ou “sem valor”, “vil” ou “digna de desprezo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָחִים
  choice: geme
  rationale: Expressa de modo natural e intenso o sofrimento audível do povo em meio à fome, sem acrescentar detalhes ao hebraico.
- source_word: מְבַקְּשִׁים לֶחֶם
  choice: à procura de pão
  rationale: Mantém o sentido literal de procurar pão, usado no contexto como alimento básico, em português corrente.
- source_word: מחמודיהם
  choice: seus bens preciosos
  rationale: Abrange posses estimadas ou valiosas sem restringir o termo hebraico a dinheiro ou tesouros específicos.
- source_word: בְּאֹכֶל
  choice: em troca de alimento
  rationale: 'Explicita com naturalidade o valor de troca da preposição: os bens foram entregues para obter comida.'
- source_word: לְהָשִׁיב נָפֶשׁ
  choice: para recobrar as forças
  rationale: No contexto de fome, נֶפֶשׁ designa a vida ou a própria pessoa; a expressão indica recuperar o vigor necessário para continuar vivendo. A formulação mais literal é preservada em nota.
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: Olha ... e vê
  rationale: Conserva os dois imperativos e a intensidade do apelo para que Deus preste atenção à aflição.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título “Senhor”.
- source_word: זוֹלֵלָה
  choice: desprezível
  rationale: No contexto, descreve Jerusalém como objeto de desprezo ou considerada indigna, e não como literalmente glutona.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: A transliteração “Yahweh” representa diretamente o nome divino no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na expressão לְהָשִׁיב נָפֶשׁ
  choice: forças/vida da pessoa inteira
  alternative: alma imaterial
  rationale: A fome e a obtenção de alimento indicam recuperação física e preservação da vida; o texto não exige uma distinção doutrinária entre corpo e alma.
- issue: Mudança da terceira para a primeira pessoa
  choice: marcar a fala personificada de Jerusalém com aspas
  alternative: deixar a mudança sem marca gráfica
  rationale: O hebraico passa de “o povo dela” para “eu me tornei”; as aspas tornam essa mudança de voz compreensível sem eliminar a personificação nem identificar além do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Todo o povo dela” preserva a referência feminina a Jerusalém; o singular “geme” concorda naturalmente com o coletivo “povo”. A repetição “Olha ... e vê” mantém o paralelismo enfático do hebraico.
