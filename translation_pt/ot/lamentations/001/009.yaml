source:
  edition: WLC
  text: טֻמְאָתָ֣/הּ בְּ/שׁוּלֶ֗י/הָ לֹ֤א זָֽכְרָה֙ אַחֲרִיתָ֔/הּ וַ/תֵּ֣רֶד פְּלָאִ֔ים אֵ֥ין מְנַחֵ֖ם לָ֑/הּ רְאֵ֤ה יְהוָה֙ אֶת עָנְיִ֔/י כִּ֥י הִגְדִּ֖יל אוֹיֵֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/009.yaml
  text: Her uncleanness was in her skirts[a]; she did not remember her end. So she came down astonishingly; there was no comforter for her. Look, O Yahweh, my affliction[c][b], for the enemy has magnified himself.
translation:
  language: pt
  text: Sua impureza estava nas barras de suas vestes; ela não se lembrou do seu fim.[a] Por isso, desceu de maneira espantosa,[b] e não havia quem a consolasse. Vê, ó Yahweh, a minha aflição, pois o inimigo se engrandeceu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não levou em conta o seu futuro” ou “não considerou qual seria o seu desfecho”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desceu de maneira espantosa”; a expressão descreve uma queda extraordinária e chocante.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “se exaltou” ou “agiu com arrogância”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתָהּ
  choice: sua impureza
  rationale: O substantivo pode indicar impureza ritual ou moral. “Impureza” preserva essa amplitude e a imagem forte de contaminação sem especificar indevidamente sua natureza.
- source_word: בְּשׁוּלֶיהָ
  choice: nas barras de suas vestes
  rationale: שׁוּל designa as extremidades inferiores ou barras de uma roupa. A formulação mantém a imagem concreta e é mais clara em português amplo do que o simples “em suas saias”.
- source_word: לֹא זָכְרָה אַחֲרִיתָהּ
  choice: ela não se lembrou do seu fim
  rationale: אַחֲרִית pode significar fim, desfecho ou futuro. “Seu fim” conserva a concisão e a ambiguidade do hebraico; a nota registra sentidos contextuais alternativos.
- source_word: וַתֵּרֶד פְּלָאִים
  choice: Por isso, desceu de maneira espantosa
  rationale: ירד mantém a metáfora de descida e humilhação, enquanto פְּלָאִים descreve aqui uma ocorrência extraordinária e chocante. “Por isso” explicita com moderação a consequência indicada pelo encadeamento do contexto.
- source_word: אֵין מְנַחֵם לָהּ
  choice: não há quem a console
  rationale: Expressa naturalmente em português o particípio substantivado “consolador”, preservando o refrão central do livro sem uma construção artificial.
- source_word: רְאֵה יְהוָה
  choice: Vê, ó Yahweh
  rationale: O imperativo é um apelo direto para que Deus atente à aflição. “Ó” marca a invocação solene, e o nome divino é transliterado como Yahweh.
- source_word: עָנְיִי
  choice: a minha aflição
  rationale: O substantivo abrange aflição, miséria e sofrimento. “Aflição” preserva o registro de lamento e o alcance do termo.
- source_word: כִּי הִגְדִּיל אוֹיֵב
  choice: pois o inimigo se engrandeceu
  rationale: O Hifil de גדל pode comunicar que o inimigo se fez grande, se exaltou ou agiu arrogantemente. A escolha reproduz a imagem de autoengrandecimento sem reduzir a expressão a um único aspecto psicológico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio em invocação direta. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Natureza da impureza de Jerusalém
  choice: impureza, sem especificação ritual ou moral
  alternative: imundícia; impureza menstrual
  rationale: O contexto e a metáfora das vestes permitem associações fortes, inclusive com contaminação menstrual, mas o termo não exige que a tradução principal resolva a imagem de modo exclusivo.
- issue: Sentido de אַחֲרִיתָהּ
  choice: seu fim
  alternative: seu futuro; seu desfecho
  rationale: “Fim” preserva a tensão entre destino final, consequência e futuro, evitando escolher silenciosamente apenas uma dessas dimensões.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. Conserva-se a personificação feminina de Jerusalém e a mudança súbita para a primeira pessoa na súplica. A imagem concreta das vestes, a metáfora da descida e a ambiguidade de “fim” foram mantidas; alternativas relevantes aparecem em notas.
