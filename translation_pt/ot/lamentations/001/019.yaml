source:
  edition: WLC
  text: קָרָ֤אתִי לַֽ/מְאַהֲבַ/י֙ הֵ֣מָּה רִמּ֔וּ/נִי כֹּהֲנַ֥/י וּ/זְקֵנַ֖/י בָּ/עִ֣יר גָּוָ֑עוּ כִּֽי בִקְשׁ֥וּ אֹ֨כֶל֙ לָ֔/מוֹ וְ/יָשִׁ֖יבוּ אֶת נַפְשָֽׁ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/019.yaml
  text: I called to my lovers[a]; they deceived me[b]. My priests and my elders perished in the city while they sought food for themselves to restore their lives.
translation:
  language: pt
  text: Chamei os meus amantes[a], mas eles me enganaram. Meus sacerdotes e meus anciãos morreram na cidade enquanto procuravam comida para si, a fim de recobrarem as forças.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meus amantes” é uma expressão metafórica que provavelmente se refere aos aliados políticos de Jerusalém ou a outros objetos de confiança mal depositada.
    reason: cultural_note
  - marker: b
    text: 'Ou: “pois procuravam comida para si, a fim de restaurarem a própria vida”. O hebraico também permite um sentido causal mais explícito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי
  choice: Chamei
  rationale: O qal perfeito na primeira pessoa do singular significa normalmente “chamei” ou “clamei”. “Chamei” preserva o apelo direto sem acrescentar intensidade emocional não expressa pelo verbo.
- source_word: לַמְאַהֲבַי
  choice: os meus amantes
  rationale: A expressão significa literalmente “meus amantes”. No contexto, funciona como metáfora para aliados ou outros objetos de confiança de Jerusalém; o texto principal preserva a imagem concreta.
- source_word: הֵמָּה רִמּוּנִי
  choice: mas eles me enganaram
  rationale: O piel de רמה expressa engano. A conjunção adversativa “mas” torna natural em português o contraste implícito entre pedir ajuda e ser enganada.
- source_word: כֹּהֲנַי וּזְקֵנַי
  choice: Meus sacerdotes e meus anciãos
  rationale: Mantém os plurais possessivos. “Anciãos” designa aqui os líderes da comunidade, não apenas homens idosos.
- source_word: בָּעִיר גָּוָעוּ
  choice: morreram na cidade
  rationale: גוע descreve morrer ou expirar. “Morreram” é claro, digno e natural, sem o tom arcaico ou excessivamente enfático de alternativas como “pereceram” ou “expiraram”.
- source_word: כִּי בִקְשׁוּ אֹכֶל לָמוֹ
  choice: enquanto procuravam comida para si
  rationale: כִּי admite valor causal, explicativo ou circunstancial. “Enquanto” comunica naturalmente a circunstância da morte sem eliminar a alternativa causal, registrada em nota.
- source_word: וְיָשִׁיבוּ אֶת נַפְשָׁם
  choice: a fim de recobrarem as forças
  rationale: A construção significa literalmente fazer voltar ou restaurar a נפש. Neste contexto de fome, נפש designa a vida ou a vitalidade da pessoa; “recobrar as forças” transmite o sentido idiomático em português sem sugerir uma doutrina da alma separada do corpo.
theological_decisions:
- issue: Sentido de נַפְשָׁם no contexto da fome
  choice: recobrarem as forças
  alternative: restaurarem a própria vida
  rationale: נפש aqui se refere à vida ou vitalidade dos que buscam alimento, não necessariamente a uma entidade imaterial. A tradução evita impor uma antropologia teológica específica e conserva em nota o sentido mais literal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A metáfora “meus amantes” foi preservada, enquanto o idioma sobre נפש foi expresso de modo corrente e explicado em nota.
