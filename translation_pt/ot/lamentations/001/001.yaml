source:
  edition: WLC
  text: אֵיכָ֣ה יָשְׁבָ֣ה בָדָ֗ד הָ/עִיר֙ רַבָּ֣תִי עָ֔ם הָיְתָ֖ה כְּ/אַלְמָנָ֑ה רַּבָּ֣תִי בַ/גּוֹיִ֗ם שָׂרָ֨תִי֙ בַּ/מְּדִינ֔וֹת הָיְתָ֖ה לָ/מַֽס׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
translation:
  language: pt
  text: Como está sentada sozinha a cidade outrora cheia de gente! Tornou-se como viúva, ela que era grande entre as nações; princesa entre as províncias, ficou sujeita a trabalhos forçados[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obrigada a pagar tributo”. A palavra hebraica מַס pode designar tanto o tributo imposto por um conquistador quanto trabalhos forçados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Como
  rationale: Introduz uma exclamação de lamento e espanto, não uma pergunta em busca de informação; preserva a força retórica da fórmula hebraica.
- source_word: יָשְׁבָה בָדָד
  choice: está sentada sozinha
  rationale: Mantém a imagem concreta da cidade personificada, sentada em abandono, e expressa em português atual o estado resultante indicado pelo perfeito hebraico.
- source_word: הָעִיר
  choice: a cidade
  rationale: Conserva a designação do hebraico sem inserir explicitamente o nome Jerusalém, identificado pelo contexto.
- source_word: רַבָּתִי עָם
  choice: outrora cheia de gente
  rationale: Comunica de modo natural que a cidade antes tinha uma população numerosa e reforça o contraste com sua solidão presente.
- source_word: הָיְתָה כְּאַלְמָנָה
  choice: tornou-se como viúva
  rationale: Destaca a mudança de condição e preserva o caráter comparativo do prefixo כ, sem transformar a imagem em identidade literal.
- source_word: רַבָּתִי בַגּוֹיִם
  choice: grande entre as nações
  rationale: Preserva a linguagem de destaque e prestígio, bem como o paralelismo do verso.
- source_word: שָׂרָתִי בַּמְּדִינוֹת
  choice: princesa entre as províncias
  rationale: Reproduz a personificação feminina e a posição elevada da cidade entre regiões administrativas.
- source_word: לָמַס
  choice: sujeita a trabalhos forçados
  rationale: מַס pode indicar tributo ou trabalho compulsório. O sentido laboral expressa com clareza a reversão da condição de princesa para a de subjugada, sem ocultar a alternativa lexical em nota.
theological_decisions: []
