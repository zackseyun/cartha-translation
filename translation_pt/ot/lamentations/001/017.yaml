base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/017.yaml
  text: Zion has spread out her hands; there is no one to comfort her[a]. Yahweh has commanded concerning Jacob that his enemies surround him; Jerusalem has become an unclean thing among them.
translation:
  language: pt
  text: Sião estendeu as mãos, mas não há quem a console. Yahweh ordenou, a respeito de Jacó, que os seus inimigos o cercassem. Jerusalém tornou-se impura[a] entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “como uma mulher menstruada” ou “como impureza menstrual”; o termo hebraico traz a imagem de impureza ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרְשָׂה צִיּוֹן בְּיָדֶיהָ
  choice: Sião estende as mãos
  rationale: O verbo פרשׂ descreve estender ou abrir, e a expressão retrata de modo natural um gesto de súplica desesperada sem defini-lo especificamente como oração. O presente narrativo comunica vividamente a condição retratada no lamento.
- source_word: אֵין מְנַחֵם לָהּ
  choice: não há quem a console
  rationale: Preserva a construção existencial e o motivo recorrente da ausência de consolador, em português corrente e digno.
- source_word: צִוָּה יְהוָה לְיַעֲקֹב
  choice: Yahweh ordenou a respeito de Jacó
  rationale: “Ordenou” conserva diretamente a ação divina expressa por צוה. “A respeito de” mantém a amplitude da preposição ל sem decidir indevidamente entre sentido adversativo e simples referência.
- source_word: סְבִיבָיו צָרָיו
  choice: que seus inimigos o cercassem
  rationale: Transforma a expressão adverbial hebraica em uma oração portuguesa natural e preserva a ideia de cerco hostil.
- source_word: הָיְתָה יְרוּשָׁלִַם לְנִדָּה
  choice: Jerusalém tornou-se impura
  rationale: “Tornou-se” expressa o estado resultante. “Impura” preserva a linguagem de impureza ritual e rejeição de נִדָּה sem tornar o texto principal excessivamente clínico.
- source_word: בֵּינֵיהֶם
  choice: entre eles
  rationale: Equivalente direto e natural que mantém Jerusalém em relação aos inimigos mencionados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama; “Yahweh” preserva o nome próprio divino sem substituí-lo por um título.
- issue: Especificidade da imagem de נִדָּה
  choice: impura no texto principal, com nota sobre a imagem menstrual
  alternative: como uma mulher menstruada; como impureza menstrual; objeto repugnante
  rationale: O termo evoca impureza menstrual e, por extensão, uma condição ritualmente impura e socialmente repelida. A tradução conserva a força básica sem limitar silenciosamente a metáfora, enquanto a nota registra sua especificidade provável.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. Mantém “Sião”, “Jacó” e “Jerusalém” como nomes tradicionais e conserva a tensão da linguagem ritual por meio de nota.
