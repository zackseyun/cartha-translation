source:
  edition: WLC
  text: זָֽכְרָ֣ה יְרוּשָׁלִַ֗ם יְמֵ֤י עָנְיָ/הּ֙ וּ/מְרוּדֶ֔י/הָ כֹּ֚ל מַחֲמֻדֶ֔י/הָ אֲשֶׁ֥ר הָי֖וּ מִ֣/ימֵי קֶ֑דֶם בִּ/נְפֹ֧ל עַמָּ֣/הּ בְּ/יַד צָ֗ר וְ/אֵ֤ין עוֹזֵר֙ לָ֔/הּ רָא֣וּ/הָ צָרִ֔ים שָׂחֲק֖וּ עַ֥ל מִשְׁבַּתֶּֽ/הָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/007.yaml
  text: Jerusalem remembered in the days of her affliction and her wanderings all her precious things that were from days of old[a]. When her people fell into the hand of the foe, and there was no one to help her, foes saw her[b]; they laughed at her ruin.
translation:
  language: pt
  text: Jerusalém se lembrou, nos dias da sua aflição e da sua vida errante[a], de tudo o que lhe era precioso desde os tempos antigos. Quando seu povo caiu nas mãos do adversário, e não havia ninguém para ajudá-la, os inimigos a viram e riram da sua ruína[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sua falta de moradia”; o termo hebraico é raro e seu sentido é discutido.
    reason: lexical_alternative
  - marker: b
    text: Ou “da sua desolação” ou “da sua queda”; o substantivo hebraico provavelmente se refere ao colapso ou à condição devastada de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה
  choice: se lembrou
  rationale: O qal perfeito, terceira pessoa feminina singular, refere-se à Jerusalém personificada. O passado corresponde ao contexto narrativo do lamento.
- source_word: יְמֵי עָנְיָהּ
  choice: nos dias da sua aflição
  rationale: עֳנִי denota aflição, miséria ou sofrimento. “Aflição” mantém a gravidade e o tom poético sem restringir indevidamente o sentido.
- source_word: וּמְרוּדֶיהָ
  choice: e da sua vida errante
  rationale: O substantivo raro e discutido parece relacionar-se a errância ou falta de moradia. “Vida errante” comunica de modo natural a condição concreta do exílio, enquanto a alternativa é registrada em nota.
- source_word: כֹּל מַחֲמֻדֶיהָ
  choice: de tudo o que lhe era precioso
  rationale: A expressão abrange bens, tesouros ou outras coisas estimadas. Esta formulação conserva essa amplitude e integra naturalmente o complemento de “se lembrou” em português.
- source_word: אֲשֶׁר הָיוּ מִימֵי קֶדֶם
  choice: desde os tempos antigos
  rationale: מִימֵי קֶדֶם aponta para tempos passados ou antigos. A construção portuguesa preserva a perspectiva temporal e o tom poético.
- source_word: בִּנְפֹל עַמָּהּ
  choice: Quando seu povo caiu
  rationale: O infinitivo construto com בְּ introduz a circunstância temporal. “Quando” expressa essa relação com clareza.
- source_word: בְּיַד צָר
  choice: nas mãos do adversário
  rationale: “Nas mãos de” preserva o conhecido idioma hebraico de sujeição ao poder de alguém. O singular צָר é mantido coletivamente como “o adversário”.
- source_word: וְאֵין עוֹזֵר לָהּ
  choice: e não havia ninguém para ajudá-la
  rationale: A formulação idiomática expressa diretamente o abandono completo de Jerusalém.
- source_word: רָאוּהָ צָרִים
  choice: os inimigos a viram
  rationale: O plural צָרִים designa os inimigos ou adversários. “Inimigos” é claro e corrente em português.
- source_word: שָׂחֲקוּ
  choice: riram
  rationale: O verbo descreve o riso, aqui evidentemente hostil ou zombeteiro. O objeto da zombaria é dado pela frase seguinte.
- source_word: עַל מִשְׁבַּתֶּהָ
  choice: da sua ruína
  rationale: O substantivo difícil pode indicar cessação, colapso, ruína ou desolação. “Ruína” se ajusta ao contexto da cidade devastada sem explicar além do texto; a incerteza lexical é preservada em nota.
