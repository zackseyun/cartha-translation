translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A personificação feminina de Jerusalém foi preservada pelos pronomes femininos. A ordem foi levemente ajustada para tornar claro, em português, que Jerusalém se lembrou de tudo o que lhe era precioso durante sua aflição, sem eliminar a tensão temporal do hebraico.
