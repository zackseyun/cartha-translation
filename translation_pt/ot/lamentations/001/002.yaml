base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/002.yaml
  text: She weeps bitterly in the night[a], with her tears on her cheeks; among all her lovers she has no comforter. All her companions have dealt treacherously with her[b]; they have become her enemies.
translation:
  language: pt
  text: 'Ela chora amargamente à noite,

    e suas lágrimas lhe correm pelas faces;

    entre todos os seus amantes[a],

    não há quem a console.

    Todos os seus companheiros[b] a traíram;

    tornaram-se seus inimigos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aliados”. O hebraico diz literalmente “amantes”, preservando a personificação da cidade como mulher e podendo também aludir a parceiros políticos.
    reason: lexical_alternative
  - marker: b
    text: Ou “amigos” ou “aliados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּכוֹ תִבְכֶּה
  choice: chora sem cessar
  rationale: O infinitivo absoluto seguido do imperfeito intensifica o verbo. “Chora sem cessar” comunica essa intensidade em português natural, sem acrescentar explicitamente a ideia de amargura.
- source_word: בַּלַּיְלָה
  choice: durante a noite
  rationale: Expressa com clareza o valor temporal da locução hebraica e conserva a ambientação poética.
- source_word: וְדִמְעָתָהּ עַל לֶחֱיָהּ
  choice: e as lágrimas lhe correm pelas faces
  rationale: O hebraico traz “lágrima” e “face” no singular coletivo. O plural é idiomático em português, e “correm pelas faces” preserva de modo vívido a imagem das lágrimas sobre o rosto.
- source_word: אֵין לָהּ מְנַחֵם
  choice: não há quem a console
  rationale: A construção existencial com particípio indica a ausência de qualquer pessoa que lhe dê consolo. A formulação é direta e natural no português moderno.
- source_word: מִכָּל אֹהֲבֶיהָ
  choice: entre todos os seus amantes
  rationale: “Amantes” mantém a personificação da cidade como mulher e não elimina a possível alusão a parceiros políticos ou religiosos.
- source_word: כָּל רֵעֶיהָ
  choice: todos os seus companheiros
  rationale: רֵעַ pode designar amigo, companheiro ou associado. “Companheiros” mantém essa amplitude e combina com o registro poético.
- source_word: בָּגְדוּ בָהּ
  choice: a traíram
  rationale: A forma concisa comunica a deslealdade e a ruptura relacional expressas pelo verbo בגד, sem tornar o verso excessivamente formal.
- source_word: הָיוּ לָהּ לְאֹיְבִים
  choice: tornaram-se seus inimigos
  rationale: A construção indica mudança de relação ou condição; “tornaram-se” torna essa transição explícita e natural.
theological_decisions:
- issue: Retrato metafórico de Jerusalém/Sião como mulher que tem “amantes”
  choice: Manter “amantes” no texto principal
  alternative: aliados; parceiros
  rationale: O contexto personifica a cidade como mulher, e a literatura profética pode empregar “amantes” para relações políticas, religiosas ou idólatras. A tradução conserva a tensão metafórica, enquanto a nota registra a dimensão política possível.
translation_notes:
  register: Português moderno, digno e acessível, com disposição poética. A repetição intensiva hebraica foi vertida por “sem cessar”; a metáfora relacional foi preservada, e as possíveis referências políticas foram indicadas em notas.
