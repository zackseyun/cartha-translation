  text: נִשְׂקַד֩ עֹ֨ל פְּשָׁעַ֜/י בְּ/יָד֗/וֹ יִשְׂתָּֽרְג֛וּ עָל֥וּ עַל צַוָּארִ֖/י הִכְשִׁ֣יל כֹּחִ֑/י נְתָנַ֣/נִי אֲדֹנָ֔/י בִּ/ידֵ֖י לֹא אוּכַ֥ל קֽוּם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/014.yaml
  text: The yoke of my transgressions is bound by his hand[a]; they are woven together, they have come up upon my neck; he has made my strength fail[c][b]. The Lord has given me into hands from which I cannot rise.
translation:
  language: pt
  text: O jugo das minhas transgressões foi atado por sua mão[a]; elas se entrelaçaram[b] e subiram sobre o meu pescoço. Ele fez a minha força fraquejar. O Senhor me entregou em mãos[c]; não posso me erguer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi vigiado” ou “foi preso”. O verbo hebraico é raro e difícil; o contexto favorece a ideia de que o jugo foi atado ou fixado.
    reason: lexical_alternative
  - marker: b
    text: Ou “foram tecidas umas nas outras” ou “se torceram juntas”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “em mãos”. A expressão não identifica aqueles em cujas mãos o eu lírico foi entregue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׂקַד
  choice: foi atado
  rationale: O verbo é raro e de sentido incerto. No contexto do jugo colocado sobre o pescoço, “foi atado” comunica melhor a ideia provável de algo preso ou fixado, sem ocultar a alternativa em nota.
- source_word: עֹל
  choice: jugo
  rationale: Preserva a metáfora central de carga opressiva e sujeição, além de ser um termo bíblico ainda compreensível em português moderno.
- source_word: פְּשָׁעַי
  choice: minhas transgressões
  rationale: Mantém o peso moral e a noção de violação ou rebeldia presentes em פשע.
- source_word: בידו
  choice: pela mão dele
  rationale: Expressa a agência indicada pela construção hebraica e mantém a referência masculina ligada ao Senhor no contexto.
- source_word: יִשְׂתָּרְגוּ
  choice: elas se entrelaçaram
  rationale: O verbo raro parece descrever elementos torcidos ou tecidos uns com os outros. O feminino plural retoma naturalmente “transgressões” em português.
- source_word: עָלוּ עַל צַוָּארִי
  choice: subiram sobre o meu pescoço
  rationale: Conserva a imagem física e o movimento do hebraico, sem transformar explicitamente o verbo em “foram colocadas”.
- source_word: הִכְשִׁיל כֹּחִי
  choice: fez a minha força fraquejar
  rationale: Reproduz a construção causativa e retém algo da imagem de fazer tropeçar, de modo idiomático quando o objeto é “força”.
- source_word: אֲדֹנָי
  choice: O Senhor
  rationale: É a forma portuguesa consagrada e natural para o título divino אֲדֹנָי.
- source_word: בידי
  choice: em mãos
  rationale: Preserva a ausência de um possuidor explícito no hebraico e deixa indefinidos os agentes humanos aos quais a cidade foi entregue.
- source_word: לֹא אוּכַל קוּם
  choice: não consigo me levantar
  rationale: Mantém o sentido de incapacidade para se erguer ou recuperar-se, sem especificar além do texto a relação sintática com as “mãos”.
theological_decisions:
- issue: Referência dos sufixos e verbos masculinos singulares
  choice: Entender “dele” e “ele” como referências ao Senhor, agente do juízo
  alternative: Tomar a primeira referência de modo impessoal ou relacioná-la, em parte, ao próprio jugo
  rationale: A declaração final nomeia o Senhor como aquele que entrega a cidade, e o contexto atribui a ele o juízo. A tradução mantém essa coerência sem acrescentar uma identificação mais específica.
- issue: Identidade daqueles em cujas mãos Jerusalém foi entregue
  choice: Deixar os agentes indefinidos como no hebraico
  alternative: Explicitar “inimigos”, “opressores” ou “aqueles contra quem não posso me levantar”
  rationale: O texto hebraico diz apenas “em mãos” e em seguida afirma a incapacidade de levantar-se. Não se deve completar silenciosamente a expressão com uma identificação ausente do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. A metáfora do jugo e o movimento sobre o pescoço foram preservados. A frase final mantém a formulação indefinida e paratática do hebraico, evitando inserir “inimigos” ou uma oração relativa que não aparece explicitamente no texto.
