id: LAM.1.4
reference: Lamentations 1:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דַּרְכֵ֨י צִיּ֜וֹן אֲבֵל֗וֹת מִ/בְּלִי֙ בָּאֵ֣י מוֹעֵ֔ד כָּל שְׁעָרֶ֨י/הָ֙ שֽׁוֹמֵמִ֔ין כֹּהֲנֶ֖י/הָ נֶאֱנָחִ֑ים בְּתוּלֹתֶ֥י/הָ נּוּג֖וֹת וְ/הִ֥יא מַר לָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/004.yaml
  text: The roads of Zion mourn[a], because no one comes to the appointed feast; all her gates are desolate, her priests groan, her virgins grieve[b], and she herself is bitter.
translation:
  language: pt
  text: Os caminhos de Sião estão de luto, pois ninguém vem para a festa marcada[a]. Todos os seus portões estão desolados; seus sacerdotes gemem, suas virgens[b] estão aflitas, e ela mesma vive em amargura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a festividade determinada” ou “para o tempo marcado”. O termo hebraico pode indicar um tempo determinado ou uma assembleia festiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas jovens”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי צִיּוֹן
  choice: Os caminhos de Sião
  rationale: O plural de דֶּרֶךְ pode indicar caminhos ou estradas. “Caminhos” é natural em português e evoca as vias de acesso a Sião antes percorridas pelos peregrinos.
- source_word: אֲבֵלוֹת
  choice: estão de luto
  rationale: A forma feminina plural descreve poeticamente os caminhos como enlutados; a expressão preserva a personificação e o tom fúnebre.
- source_word: מִבְּלִי בָּאֵי מוֹעֵד
  choice: pois ninguém vem para a festa marcada
  rationale: מִבְּלִי expressa ausência ou privação, בָּאֵי refere-se aos que vêm, e מוֹעֵד, neste contexto cultual, provavelmente designa uma festa em data determinada. A formulação mantém a relação causal e a noção de ocasião fixada.
- source_word: כָּל שְׁעָרֶיהָ שׁוֹמֵמִין
  choice: Todos os seus portões estão desolados
  rationale: “Portões” comunica claramente as entradas da cidade, e “desolados” preserva tanto a ausência de gente quanto o cenário de devastação.
- source_word: כֹּהֲנֶיהָ נֶאֱנָחִים
  choice: seus sacerdotes gemem
  rationale: Tradução direta que conserva o lamento audível e intenso expresso pelo particípio hebraico.
- source_word: בְּתוּלֹתֶיהָ נּוּגוֹת
  choice: suas virgens estão aflitas
  rationale: “Virgens” preserva o sentido lexical específico de בְּתוּלָה, enquanto “estão aflitas” representa o estado de sofrimento ou pesar indicado por נּוּגוֹת.
- source_word: וְהִיא מַר לָהּ
  choice: e ela mesma vive em amargura
  rationale: “Ela mesma” conserva a ênfase do pronome e a personificação feminina de Sião. “Vive em amargura” expressa naturalmente em português a amarga aflição do idiomatismo מַר לָהּ sem sugerir que a própria cidade tenha caráter amargo.
theological_decisions:
- issue: Referente dos sufixos femininos e do pronome singular
  choice: Manter Sião personificada como mulher por meio de “seus”, “suas” e “ela mesma”.
  alternative: Tratar a cidade de modo impessoal e verter o pronome como “ela” apenas por concordância gramatical, sem realçar a personificação.
  rationale: As formas femininas percorrem o versículo e integram a representação poética de Sião/Jerusalém como mulher enlutada; preservá-las é importante para a retórica de Lamentações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo poético, a personificação feminina de Sião e a intensidade do lamento, evitando construções excessivamente literais ou arcaicas.
