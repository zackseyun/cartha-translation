reference: Lamentations 1:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תָּבֹ֨א כָל רָעָתָ֤/ם לְ/פָנֶ֨י/ךָ֙ וְ/עוֹלֵ֣ל לָ֔/מוֹ כַּ/אֲשֶׁ֥ר עוֹלַ֛לְתָּ לִ֖/י עַ֣ל כָּל פְּשָׁעָ֑/י כִּֽי רַבּ֥וֹת אַנְחֹתַ֖/י וְ/לִבִּ֥/י דַוָּֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/022.yaml
  text: Let all their evil come before you[a], and deal with them as you have dealt with me because of all my transgressions; for my groans are many[c][b], and my heart is sick.
translation:
  language: pt
  text: Que toda a maldade deles chegue à tua presença[a], e trata-os como me trataste por causa de todas as minhas transgressões; pois muitos são os meus gemidos[b], e o meu coração está enfermo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o mal deles”. רָעָה também pode significar “calamidade” em certos contextos, mas aqui provavelmente se refere à maldade culpável.
    reason: lexical_alternative
  - marker: b
    text: Ou “os meus suspiros são muitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבֹא
  choice: Que ... chegue
  rationale: O imperfeito qal tem força volitiva neste contexto de oração; a construção portuguesa expressa uma súplica sem convertê-la em simples previsão.
- source_word: רָעָתָם
  choice: toda a maldade deles
  rationale: רָעָה pode indicar mal moral ou calamidade. A referência posterior às transgressões de Sião favorece aqui a culpa moral dos inimigos.
- source_word: לְפָנֶיךָ
  choice: à tua presença
  rationale: Reproduz naturalmente o idioma hebraico de algo ser trazido à vista e à consideração judicial de Deus.
- source_word: וְעוֹלֵל לָמוֹ ... כַּאֲשֶׁר עוֹלַלְתָּ לִי
  choice: e trata-os como me trataste
  rationale: Mantém em português a repetição do mesmo verbo hebraico nas duas orações e comunica a ideia de agir para com alguém, aqui em juízo.
- source_word: עַל כָּל פְּשָׁעַי
  choice: por causa de todas as minhas transgressões
  rationale: פשע designa transgressão ou rebelião; a formulação preserva tanto a culpa confessada como a relação causal com o julgamento.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada ao final da súplica e mantém a ligação argumentativa do hebraico.
- source_word: רַבּוֹת אַנְחֹתַי
  choice: muitos são os meus gemidos
  rationale: אַנְחָה indica suspiro ou gemido de sofrimento. A ordem escolhida preserva a ênfase inicial do hebraico na abundância deles sem soar artificial.
- source_word: לִבִּי דַוָּי
  choice: o meu coração está enfermo
  rationale: דַוָּי comunica enfermidade, fraqueza ou aflição; 'enfermo' conserva a metáfora de doença interior e o tom solene da lamentação.
theological_decisions:
- issue: Natureza do juízo pedido contra os inimigos
  choice: A fala pede que Deus leve em conta a maldade dos inimigos e os trate como tratou Sião por suas transgressões.
  alternative: Interpretar a primeira oração apenas como um pedido para Deus notar a conduta deles, ou intensificá-la como uma formulação explícita de vingança pessoal.
  rationale: O hebraico apresenta um apelo judicial a Deus e estabelece um paralelo com o julgamento já sofrido por Sião. A tradução não suaviza nem amplia a força imprecatória do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento por “tu” preserva o discurso direto a Deus; “trata-os como me trataste” conserva a repetição lexical do hebraico. Evitou-se acrescentar uma nota separada sobre essa repetição porque ela já está visível no próprio texto.
