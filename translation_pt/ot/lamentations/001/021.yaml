  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁמְע֞וּ כִּ֧י נֶאֱנָחָ֣ה אָ֗נִי אֵ֤ין מְנַחֵם֙ לִ֔/י כָּל אֹ֨יְבַ֜/י שָׁמְע֤וּ רָֽעָתִ/י֙ שָׂ֔שׂוּ כִּ֥י אַתָּ֖ה עָשִׂ֑יתָ הֵבֵ֥אתָ יוֹם קָרָ֖אתָ וְ/יִֽהְי֥וּ כָמֽוֹ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/021.yaml
  text: They have heard that I groan[a]; there is no one to comfort me. All my enemies have heard of my trouble; they rejoice that you have done it. You have brought the day you proclaimed[c][b]; let them become like me.
translation:
  language: pt
  text: Ouviram que estou gemendo; não há quem me console. Todos os meus inimigos ouviram falar da minha desgraça[a]; alegraram-se porque tu fizeste isso. Trouxeste o dia que proclamaste[b]; que eles se tornem como eu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “calamidade”, “aflição” ou “mal”. O termo hebraico pode designar tanto o mal quanto uma desgraça sofrida; aqui o contexto favorece o segundo sentido.
    reason: lexical_alternative
  - marker: b
    text: Ou “o dia que anunciaste”. Neste contexto, o verbo hebraico pode significar “proclamar” ou “anunciar”.
    reason: lexical_alternative
  - marker: c
    text: Ou “e eles serão como eu”. A forma hebraica pode ser entendida como um desejo — “que eles se tornem como eu” — ou como uma declaração futura; o contexto do lamento favorece o desejo.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: Ouviram
  rationale: O perfeito qal na terceira pessoa do plural indica uma ação já ocorrida. O sujeito permanece inicialmente implícito, como no hebraico, e depois é identificado como “todos os meus inimigos”.
- source_word: נֶאֱנָחָה אָ֗נִי
  choice: estou gemendo
  rationale: A forma de אנח expressa gemido ou suspiro causado por profunda aflição. A locução progressiva comunica com naturalidade uma dor presente e contínua.
- source_word: אֵין מְנַחֵם לִי
  choice: não há quem me console
  rationale: A construção existencial com אֵין e o particípio מְנַחֵם declara que não existe ninguém para oferecer consolo. A formulação é corrente, clara e mantém a força absoluta da ausência.
- source_word: כָּל אֹיְבַי
  choice: Todos os meus inimigos
  rationale: Tradução direta da expressão quantificada, preservando a abrangência de כָּל.
- source_word: שָׁמְעוּ רָעָתִי
  choice: ouviram falar da minha desgraça
  rationale: Neste contexto, רָעָה designa a calamidade ou aflição sofrida pela voz poética, não necessariamente maldade moral. “Ouviram falar de” é idiomático em português para a notícia de um acontecimento.
- source_word: שָׂשׂוּ
  choice: alegraram-se
  rationale: O perfeito expressa a reação dos inimigos diante da calamidade. “Alegraram-se” mantém tanto a ação concluída quanto a gravidade moral de seu prazer.
- source_word: כִּי אַתָּה עָשִׂיתָ
  choice: porque tu fizeste isso
  rationale: A oração atribui diretamente a Deus a ação que produziu a calamidade. O pronome “tu” preserva a ênfase explícita do hebraico, e “isso” mantém o objeto sem especificá-lo além do texto.
- source_word: הֵבֵאתָ יוֹם קָרָאתָ
  choice: Trouxeste o dia que proclamaste
  rationale: הביא com יוֹם apresenta Deus fazendo chegar um dia determinado, enquanto קרא, neste contexto profético, pode indicar sua proclamação ou anúncio prévio.
- source_word: וְיִהְיוּ כָמוֹנִי
  choice: que eles se tornem como eu
  rationale: O imperfeito pode funcionar contextualmente como desejo ou pedido de caráter imprecatório. “Que eles se tornem” preserva essa força e o sentido dinâmico de היה.
theological_decisions:
- issue: A ação divina na calamidade de Jerusalém
  choice: 'Preservar a atribuição direta a Deus: “tu fizeste isso” e “Trouxeste o dia”.'
  alternative: Empregar uma formulação mais vaga que atenue a ação divina.
  rationale: O hebraico se dirige a Deus na segunda pessoa e lhe atribui explicitamente tanto a calamidade quanto a chegada do dia proclamado. A tradução mantém essa tensão teológica sem suavizá-la.
- issue: Valor modal de וְיִהְיוּ כָמוֹנִי
  choice: 'Entender a oração como desejo: “que eles se tornem como eu”.'
  alternative: 'Entendê-la como afirmação futura: “e eles serão como eu”.'
  rationale: A morfologia permite uma leitura futura, mas o contexto de lamento e imprecação favorece o valor volitivo. A alternativa permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Ouviram” conserva a estrutura poética hebraica; “não há quem me console” soa natural sem perder a solenidade. Os pronomes de segunda pessoa singular mantêm a fala direta dirigida a Deus.
