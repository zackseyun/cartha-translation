source:
  edition: WLC
  text: הָי֨וּ צָרֶ֤י/הָ לְ/רֹאשׁ֙ אֹיְבֶ֣י/הָ שָׁל֔וּ כִּֽי יְהוָ֥ה הוֹגָ֖/הּ עַ֣ל רֹב פְּשָׁעֶ֑י/הָ עוֹלָלֶ֛י/הָ הָלְכ֥וּ שְׁבִ֖י לִ/פְנֵי צָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/005.yaml
  text: Her foes have become the head[a]; her enemies prosper, because Yahweh has afflicted her for the multitude of her transgressions[b]. Her children have gone away into captivity before the foe.
translation:
  language: pt
  text: Seus adversários se tornaram a cabeça[a]; seus inimigos vivem tranquilos[b], pois Yahweh a afligiu por causa de suas muitas transgressões. Seus pequeninos[c] foram para o cativeiro diante do adversário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, passaram a ocupar a posição de liderança ou domínio.
    reason: idiom_clarification
  - marker: b
    text: Ou “prosperam” ou “vivem seguros”. O verbo hebraico pode indicar tranquilidade, segurança ou prosperidade.
    reason: lexical_alternative
  - marker: c
    text: Ou “suas crianças pequenas” ou “seus bebês”. O termo hebraico destaca a pouca idade e a vulnerabilidade deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֶיהָ
  choice: seus adversários
  rationale: O termo צַר designa aqui os que hostilizam e oprimem Jerusalém. “Adversários” é natural e mantém o paralelismo com “inimigos”.
- source_word: לְרֹאשׁ
  choice: se tornaram a cabeça
  rationale: Preserva a imagem hebraica de ascendência e domínio, esclarecida em nota para leitores modernos.
- source_word: אֹיְבֶיהָ
  choice: seus inimigos
  rationale: Equivalente corrente de אֹיֵב em contexto de hostilidade e derrota militar.
- source_word: שָׁלוּ
  choice: vivem tranquilos
  rationale: O verbo שלה expressa tranquilidade, segurança ou prosperidade. “Vivem tranquilos” preserva a ironia da reversão sem limitar o sentido à riqueza material.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוֹגָהּ
  choice: a afligiu
  rationale: O hifil de יגה apresenta Yahweh como aquele que causa aflição ou pesar; a formulação conserva essa agência explícita.
- source_word: עַל רֹב פְּשָׁעֶיהָ
  choice: por causa de suas muitas transgressões
  rationale: Expressa de modo natural tanto a abundância indicada por רֹב quanto as violações ou rebeliões denotadas por פֶּשַׁע.
- source_word: עוֹלָלֶיהָ
  choice: seus pequeninos
  rationale: עוֹלָל se refere a crianças pequenas e ressalta sua vulnerabilidade; “pequeninos” evita a especificação excessiva de “bebês”.
- source_word: שְׁבִי
  choice: para o cativeiro
  rationale: O substantivo indica a condição ou destino de cativos e combina naturalmente com o verbo de movimento הלך.
- source_word: לִפְנֵי צָר
  choice: diante do adversário
  rationale: Mantém a imagem espacial do hebraico, que retrata as crianças seguindo como cativas sob o poder do adversário, sem acrescentar agentes ou ações não expressos.
theological_decisions:
- issue: Agência divina no sofrimento de Jerusalém
  choice: Yahweh a afligiu por causa de suas muitas transgressões
  alternative: Yahweh lhe causou pesar por suas numerosas rebeliões
  rationale: O hebraico atribui diretamente a aflição a Yahweh e a relaciona às transgressões de Jerusalém. A tradução conserva tanto a agência divina quanto a responsabilidade humana, sem atenuar a tensão.
- issue: Ascendência dos adversários como reversão da condição de Jerusalém
  choice: se tornaram a cabeça
  alternative: tornaram-se dominantes
  rationale: A imagem de “cabeça” comunica que os adversários passaram à posição superior. Preservá-la mantém a força concreta e a linguagem de reversão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção poética mantém o paralelismo entre “adversários” e “inimigos”, preserva a imagem hebraica de “cabeça” e evita explicitar além do texto como se deu a marcha dos pequeninos ao cativeiro.
