  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל אֵ֣לֶּה אֲנִ֣י בוֹכִיָּ֗ה עֵינִ֤/י עֵינִ/י֙ יֹ֣רְדָה מַּ֔יִם כִּֽי רָחַ֥ק מִמֶּ֛/נִּי מְנַחֵ֖ם מֵשִׁ֣יב נַפְשִׁ֑/י הָי֤וּ בָנַ/י֙ שֽׁוֹמֵמִ֔ים כִּ֥י גָבַ֖ר אוֹיֵֽב־׀׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/016.yaml
  text: For these things I am weeping; my eye[a], my eye runs down with water, because the comforter who restores my soul is far from me. My children have become desolate, because the enemy has prevailed.
translation:
  language: pt
  text: Por causa destas coisas, estou chorando; meu olho, meu olho verte água, pois está longe de mim aquele que me consola e restaura minha vida[a]. Meus filhos ficaram desolados, porque o inimigo prevaleceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “minha alma” ou “a mim”. O hebraico néfesh pode indicar a vida, a própria pessoa ou a alma, conforme o contexto.'
    reason: Preservar a amplitude semântica de נֶפֶשׁ e registrar a tradução tradicional alternativa.
lexical_decisions:
- source_word: עַל אֵלֶּה
  choice: Por causa destas coisas
  rationale: A expressão apresenta a causa ou o objeto do lamento; esta formulação é natural em português e mantém a relação causal sem acrescentar detalhes.
- source_word: בוֹכִיָּה
  choice: estou chorando
  rationale: O particípio feminino retrata uma ação contínua da Jerusalém personificada.
- source_word: עֵינִי עֵינִי
  choice: meu olho, meu olho
  rationale: Mantém o substantivo no singular e sua repetição enfática, em vez de regularizá-lo como plural.
- source_word: יֹרְדָה מַיִם
  choice: verte água
  rationale: Preserva a imagem hebraica de água, sem substituí-la interpretativamente por lágrimas, e produz uma expressão poética compreensível em português.
- source_word: מְנַחֵם מֵשִׁיב נַפְשִׁי
  choice: aquele que me consola e restaura minha vida
  rationale: Traduz os particípios como ações caracterizadoras da pessoa ausente. 'Vida' comunica aqui o ser vivo ou a própria pessoa, um sentido contextual de נֶפֶשׁ.
- source_word: רָחַק מִמֶּנִּי
  choice: está longe de mim
  rationale: Reproduz diretamente a distância e ausência lamentadas no texto.
- source_word: בָנַי
  choice: Meus filhos
  rationale: Embora a forma possa significar literalmente 'meus filhos homens', no discurso da Sião personificada refere-se coletivamente ao seu povo; 'filhos' mantém a metáfora familiar.
- source_word: שֹׁמֵמִים
  choice: ficaram desolados
  rationale: Expressa o estado resultante de devastação e mantém o vocabulário recorrente da desolação em Lamentações.
- source_word: גָבַר אוֹיֵב
  choice: o inimigo prevaleceu
  rationale: גבר indica que o inimigo se mostrou superior ou dominante; 'prevaleceu' comunica isso de modo conciso.
theological_decisions:
- issue: Sentido de נַפְשִׁי no contexto do lamento
  choice: minha vida
  alternative: minha alma; a mim mesmo
  rationale: נֶפֶשׁ pode designar vida, pessoa ou ser, e não exige aqui uma referência exclusiva a uma parte imaterial do ser humano. 'Minha vida' se ajusta à ideia de restauração, enquanto a nota conserva a alternativa tradicional.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência poética. Conserva-se a repetição incomum 'meu olho, meu olho' e a imagem literal da água para refletir a intensidade retórica do hebraico.
