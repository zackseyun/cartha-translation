source:
  edition: WLC
  text: יָד/וֹ֙ פָּ֣רַשׂ צָ֔ר עַ֖ל כָּל מַחֲמַדֶּ֑י/הָ כִּֽי רָאֲתָ֤ה גוֹיִם֙ בָּ֣אוּ מִקְדָּשָׁ֔/הּ אֲשֶׁ֣ר צִוִּ֔יתָה לֹא יָבֹ֥אוּ בַ/קָּהָ֖ל לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/010.yaml
  text: The enemy has stretched out his hand over all her precious things[c][b][a], for she has seen nations enter her sanctuary—those whom you commanded not to enter your assembly.
translation:
  language: pt
  text: O inimigo estendeu a mão sobre tudo o que ela tinha de precioso[a], pois ela viu nações[b] entrarem em seu santuário — aquelas a quem ordenaste que não entrassem em tua assembleia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seus tesouros” / “todas as suas coisas desejáveis”.
    reason: lexical_alternative
  - marker: b
    text: “Nações” também pode ser traduzido por “gentios”, isto é, povos estrangeiros que entraram no recinto sagrado.
    reason: lexical_alternative
  - marker: c
    text: Compare Deuteronômio 23, onde certos povos são proibidos de entrar na assembleia do SENHOR.
    reason: cross_reference
lexical_decisions:
- source_word: יָדוֹ ... פָּרַשׂ
  choice: estendeu a mão
  rationale: Preserva a imagem hebraica de uma ação hostil de apropriação e soa natural em português.
- source_word: צָר
  choice: o inimigo
  rationale: No contexto da devastação de Jerusalém, designa o opressor hostil; esta é a formulação moderna mais clara.
- source_word: מַחֲמַדֶּיהָ
  choice: tudo o que ela tinha de precioso
  rationale: Expressa de modo natural a amplitude do termo, que abrange objetos valorizados ou desejáveis sem se limitar a riquezas monetárias.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da calamidade precedente, mantendo uma ligação clara e digna.
- source_word: רָאֲתָה
  choice: ela viu
  rationale: O perfeito hebraico relata a profanação presenciada; o pretérito perfeito é direto e idiomático em português.
- source_word: גוֹיִם
  choice: nações
  rationale: É a correspondência mais direta e evita introduzir conotações posteriores que podem acompanhar 'gentios'.
- source_word: בָּאוּ מִקְדָּשָׁהּ
  choice: entrarem em seu santuário
  rationale: Depois de 'viu', o infinitivo flexionado é natural; 'santuário' comunica a invasão do espaço sagrado.
- source_word: אֲשֶׁר צִוִּיתָה
  choice: aqueles a quem ordenaste
  rationale: Explicita naturalmente em português que a oração relativa retoma as nações, preservando a segunda pessoa dirigida a Deus.
- source_word: לֹא יָבֹאוּ
  choice: que não entrassem
  rationale: A oração subordinada após 'ordenaste' transmite com clareza a proibição original.
- source_word: בַקָּהָל לָךְ
  choice: em tua assembleia
  rationale: קָהָל indica a comunidade reunida; 'assembleia' preserva sua amplitude e evita uma associação especificamente eclesiástica.
theological_decisions:
- issue: Referente da segunda pessoa
  choice: Deus é interpelado diretamente em 'ordenaste' e 'tua assembleia'.
  alternative: Entender a ordem de modo impessoal ou generalizado.
  rationale: A forma verbal na segunda pessoa e o sufixo pronominal favorecem a leitura como discurso direto a Deus, preservando o caráter de oração do lamento.
- issue: Identidade das nações proibidas
  choice: Manter a formulação geral no texto e remeter a Deuteronômio 23 em nota.
  alternative: Identificar no corpo do versículo povos específicos mencionados em Deuteronômio 23.
  rationale: O hebraico de Lamentações diz apenas 'nações'; especificá-las no texto resolveria além do que o versículo declara.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de 'tu' aparece apenas nas formas 'ordenaste' e 'tua', coerente com a interpelação solene a Deus; a imagem concreta de estender a mão e a ambiguidade ampla de מַחֲמַדֶּיהָ foram preservadas.
