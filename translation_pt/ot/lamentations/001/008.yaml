base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/008.yaml
  text: Jerusalem has sinned grievously[a]; therefore she has become unclean. All who honored her despise her, because they have seen her nakedness[c][b]. She herself also groans and turns backward.
translation:
  language: pt
  text: Jerusalém pecou gravemente; por isso, tornou-se impura.[a] Todos os que a honravam agora a desprezam, porque viram a sua nudez. Ela mesma geme e se volta para trás.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tornou-se como uma mulher em sua impureza menstrual” ou “tornou-se uma impureza”. O termo hebraico pode indicar impureza ritual e a consequente separação ou rejeição.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “volta-se para trás”; a expressão também pode ser entendida como “recua” ou “afasta-se”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵטְא חָטְאָה
  choice: pecou gravemente
  rationale: A construção intensiva com infinitivo absoluto e verbo finito reforça a ideia verbal. A formulação idiomática preserva tanto o pecado quanto sua gravidade.
- source_word: לְנִידָה
  choice: tornou-se impura
  rationale: O termo pode indicar impureza menstrual, impureza ritual ou uma condição de afastamento. No contexto, descreve Jerusalém como contaminada e socialmente rejeitada; a nota preserva as alternativas mais concretas.
- source_word: מְכַבְּדֶיהָ
  choice: os que a honravam
  rationale: O particípio de כבד expressa os que lhe davam honra ou consideração. O imperfeito em português comunica naturalmente a situação anterior, em contraste com o desprezo presente.
- source_word: הִזִּילוּהָ
  choice: agora a desprezam
  rationale: A forma verbal transmite a ideia de tratar alguém como vil ou sem valor. “Desprezam” é conciso; “agora” torna explícita, sem alterar o sentido, a inversão entre a antiga honra e o desprezo atual.
- source_word: עֶרְוָתָהּ
  choice: a sua nudez
  rationale: A tradução mantém a imagem concreta de exposição, incluindo suas conotações de vergonha e humilhação pública, sem reduzi-la apenas a um conceito abstrato.
- source_word: נֶאֶנְחָה
  choice: geme
  rationale: O verbo descreve uma manifestação audível de profunda aflição; “geme” é natural, expressivo e adequado ao registro poético.
- source_word: וַתָּשָׁב אָחוֹר
  choice: se volta para trás
  rationale: A expressão significa literalmente voltar-se ou recuar para trás. A formulação conserva o movimento e a possível ideia de retraimento por vergonha, sem determinar além do hebraico se ela foge, recua ou desvia o rosto.
theological_decisions:
- issue: Metáfora da impureza no julgamento de Jerusalém
  choice: tornou-se impura
  alternative: tornou-se como uma mulher em sua impureza menstrual; tornou-se objeto de repulsa
  rationale: A imagem comunica contaminação ritual, vergonha e exclusão como consequência do pecado. A tradução principal preserva essa força sem transformar o versículo em uma afirmação doutrinária sobre a menstruação; a nota registra a concretude e a ambiguidade lexical.
- issue: Sentido do movimento final de Jerusalém
  choice: se volta para trás
  alternative: recua; dá as costas; afasta-se
  rationale: O hebraico descreve literalmente um movimento para trás, mas não esclarece se é recuo, retirada ou desvio do rosto. A tradução mantém essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo poético, a personificação feminina de Jerusalém e as imagens concretas de impureza, nudez e retraimento. Os marcadores aparecem no texto em ordem [a], [b].
