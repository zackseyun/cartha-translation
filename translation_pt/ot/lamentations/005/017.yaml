base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/017.yaml
  text: Because of this our heart has become sick[a]; because of these things our eyes have grown dim.
translation:
  language: pt
  text: Por causa disso, nosso coração adoeceu[a]; por causa dessas coisas, nossos olhos escureceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por isso, nosso coração ficou abatido; por essas coisas, nossos olhos se obscureceram.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֶה
  choice: Por causa disso
  rationale: עַל com o demonstrativo זֶה expressa aqui causa ou motivo; a formulação é natural e mantém essa relação causal.
- source_word: הָיָה דָוֶה
  choice: adoeceu
  rationale: A construção com הָיָה e o predicativo דָוֶה descreve a entrada num estado de enfermidade ou fraqueza. O verbo conciso preserva a metáfora corporal aplicada ao coração.
- source_word: לִבֵּנוּ
  choice: nosso coração
  rationale: Mantém a imagem hebraica do coração como centro da vida interior, sem a reduzir apenas à mente ou às emoções.
- source_word: עַל אֵלֶּה
  choice: por causa dessas coisas
  rationale: A repetição de עַל conserva a estrutura causal paralela; 'coisas' torna idiomático em português o demonstrativo plural.
- source_word: חָשְׁכוּ
  choice: escureceram
  rationale: Reproduz diretamente a imagem de os olhos se tornarem escuros ou perderem o brilho, sem especificar se a causa é tristeza, exaustão ou visão debilitada.
- source_word: עֵינֵינוּ
  choice: nossos olhos
  rationale: A tradução literal preserva a imagem corporal e poética do lamento.
