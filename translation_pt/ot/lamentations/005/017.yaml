  source_fidelity: O texto preserva com precisão as duas relações causais introduzidas por עַל, a imagem hebraica do «coração» e dos «olhos», e o paralelismo do verso. «Adoeceu» comunica adequadamente o estado de languidez/enfermidade expresso por הָיָה דָוֶה, sem restringi-lo a tristeza meramente emocional. «Escureceram» corresponde diretamente a חָשְׁכוּ e mantém sua ambiguidade poética.
  naturalness: «Por causa disso, nosso coração adoeceu; por causa dessas coisas, nossos olhos escureceram» é português moderno, claro e digno. A repetição deliberada de «por causa de» reproduz o paralelismo causal hebraico sem soar artificial.
  terminology: «Coração» é a equivalência tradicional e semanticamente ampla para לֵב; «olhos» preserva a imagem corporal. Não há termos teológicos controversos nem nomes próprios neste verso. A nota oferece uma alternativa lexical legítima, sem alterar o sentido.
