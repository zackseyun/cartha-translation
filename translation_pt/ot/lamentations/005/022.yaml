translation:
  language: pt
  text: a não ser que nos tenhas rejeitado por completo e estejas muito irado conosco.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois tu nos rejeitaste por completo e estás muito irado conosco”, entendendo a frase como uma afirmação mais independente, e não como ressalva ao pedido do versículo anterior.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “irado contra nós” ou “sobre nós”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: a não ser que
  rationale: Em ligação com o pedido do versículo anterior, a locução introduz naturalmente uma ressalva. A formulação preserva a possibilidade de leitura condicional sem transformar o verso numa afirmação categórica.
- source_word: מָאֹס מְאַסְתָּנוּ
  choice: nos tenhas rejeitado por completo
  rationale: O infinitivo absoluto seguido do verbo da mesma raiz intensifica a ação. “Rejeitado por completo” comunica a ênfase e o sentido contextual de מאס sem optar pelo tom mais afetivo de “desprezado”.
- source_word: קָצַפְתָּ
  choice: estejas indignado
  rationale: Embora a forma hebraica seja qatal, no contexto ela pode descrever um estado resultante ou vigente. O subjuntivo harmoniza-se com a ressalva iniciada por “a não ser que”, e “indignado” preserva a força do termo sem soar excessivamente técnico.
- source_word: עָלֵינוּ
  choice: conosco
  rationale: Com um verbo de ira, “indignado conosco” é português natural. A noção mais literal de ira dirigida “contra nós” é preservada em nota.
- source_word: עַד מְאֹד
  choice: extremamente
  rationale: A expressão intensifica fortemente a indignação. “Extremamente” é atual, claro e suficientemente enfático para o registro poético.
theological_decisions:
- issue: Se o verso é uma ressalva ao pedido anterior ou uma afirmação mais independente
  choice: 'Ressalva: “a não ser que...”, dando continuidade ao pedido do versículo 21'
  alternative: 'Afirmação mais independente: “Pois tu nos rejeitaste por completo e estás extremamente indignado conosco.”'
  rationale: 'כִּי אִם admite aqui sentido exceptivo e, no contexto, mantém em aberto a tensão final do lamento: o pedido de restauração permanece, a menos que a rejeição seja definitiva. A nota registra a leitura afirmativa possível sem resolver indevidamente a ambiguidade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção em minúscula reflete a continuidade sintática com o versículo anterior. O texto conserva a conclusão aberta e tensa do poema.
