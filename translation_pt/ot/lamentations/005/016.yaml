  text: The crown has fallen from our head[a]. Woe to us[b], for we have sinned.
translation:
  language: pt
  text: A coroa da nossa cabeça caiu[a]. Ai de nós[b], pois pecamos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A coroa caiu da nossa cabeça». O hebraico emprega a expressão poética literalmente traduzida por «a coroa da nossa cabeça».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «Que desgraça para nós!» A expressão hebraica é um grito de lamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָפְלָה
  choice: caiu
  rationale: O qal perfeito, terceira pessoa feminina singular, concorda com עֲטֶרֶת e apresenta a queda como fato consumado. Em português, o pretérito perfeito simples é mais natural do que «tem caído» e mantém a força imediata do lamento.
- source_word: עֲטֶרֶת רֹאשֵׁנוּ
  choice: a coroa ... da nossa cabeça
  rationale: Conserva a cadeia construta hebraica, literalmente «a coroa da nossa cabeça», e sua imagem poética de honra, dignidade ou realeza perdidas, sem restringir o referente a uma só interpretação.
- source_word: רֹאשֵׁנוּ
  choice: nossa cabeça
  rationale: Mantém o singular coletivo do hebraico com o sufixo de primeira pessoa do plural, em vez de normalizá-lo como «nossas cabeças».
- source_word: אוֹי נָא לָנוּ
  choice: Ai de nós
  rationale: «Ai» expressa de modo natural e digno o grito de lamento אוֹי; נָא reforça a exclamação, sem exigir uma palavra separada na tradução.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão do lamento, preservando o nexo causal com a confissão que segue.
- source_word: חָטָאנוּ
  choice: pecamos
  rationale: Tradução direta do qal perfeito, primeira pessoa comum do plural, preservando a confissão coletiva e o sentido religioso habitual do verbo חטא.
theological_decisions:
- issue: Confissão e culpa coletivas
  choice: «pois pecamos»
  alternative: Tratar a frase apenas como lamento circunstancial, sem destacar a confissão
  rationale: O hebraico declara explicitamente o pecado comunitário como razão do «ai». A tradução mantém essa relação entre perda, lamento e culpa confessada, sem explicar além do que o versículo afirma.
- issue: Referente simbólico da coroa
  choice: Preservar simplesmente a imagem da «coroa»
  alternative: Explicitar como realeza, honra, templo ou glória nacional
  rationale: A imagem pode evocar honra, dignidade ou condição régia, mas o texto não identifica um único referente. Preservar a metáfora conserva sua amplitude e tensão poética.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O singular coletivo «nossa cabeça» e a metáfora da coroa foram mantidos para refletir a poesia hebraica; a exclamação final reforça o tom de confissão e lamento.
