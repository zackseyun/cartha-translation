  yaml_path: translation/ot/lamentations/005/020.yaml
  text: Why do you forget us forever? Why do you abandon us for so many days?[a]
translation:
  language: pt
  text: Por que te esqueces de nós para sempre? Por que nos abandonas por tantos dias?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “por extensão de dias”, expressão que significa “por muito tempo” ou “por muitos dias”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Por que
  rationale: Advérbio interrogativo que introduz a pergunta de lamento; a forma direta e natural em português é “Por que”.
- source_word: לָנֶצַח
  choice: para sempre
  rationale: נֶצַח com a preposição ל expressa duração contínua; “para sempre” preserva a força retórica do lamento.
- source_word: תִּשְׁכָּחֵנוּ
  choice: te esqueces de nós
  rationale: Qal imperfeito, segunda pessoa masculina singular, com objeto de primeira pessoa plural. O presente traduz naturalmente a queixa por uma situação percebida como contínua, sem eliminar por completo a projeção temporal própria do imperfeito.
- source_word: תַּעַזְבֵנוּ
  choice: nos abandonas
  rationale: עזב pode significar deixar, desamparar ou abandonar. “Abandonas” é atual, claro e mantém a intensidade emocional da súplica.
- source_word: לְאֹרֶךְ יָמִים
  choice: por tantos dias
  rationale: A expressão significa literalmente “por extensão de dias” e indica duração prolongada. “Por tantos dias” conserva a imagem concreta dos dias e soa natural no lamento.
