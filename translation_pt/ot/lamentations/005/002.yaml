  text: Our inheritance has been turned over to strangers[a], our houses to foreigners.
translation:
  language: pt
  text: Nossa herança passou para estranhos[a]; nossas casas, para estrangeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nossa herança foi transferida a estranhos; nossas casas, a estrangeiros”. O verbo hebraico significa mais literalmente “foi mudada” ou “foi virada”, mas, neste contexto, provavelmente indica mudança de posse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתֵנוּ
  choice: nossa herança
  rationale: נַחֲלָה designa herança, propriedade ou porção recebida. “Herança” preserva tanto o caráter concreto da terra e dos bens quanto sua possível ressonância pactual.
- source_word: נֶהֶפְכָה
  choice: foi entregue
  rationale: O nifal de הפך significa literalmente ser virado, mudado ou transformado. Neste contexto, em que propriedades passam ao domínio de outros, “foi entregue” comunica naturalmente o resultado da transferência sem usar o termo mais técnico “transferida”; a leitura mais literal é preservada em nota.
- source_word: לְזָרִים
  choice: a estranhos
  rationale: זָרִים refere-se a pessoas de fora do grupo ou da comunidade. “Estranhos” conserva essa ideia sem introduzir conotações modernas inadequadas.
- source_word: בָּתֵּינוּ
  choice: nossas casas
  rationale: בָּתִּים denota primariamente casas físicas. “Casas” mantém a correspondência formal e o paralelismo com “herança”.
- source_word: לְנָכְרִים
  choice: a estrangeiros
  rationale: נָכְרִים ressalta a condição estrangeira. “Estrangeiros” distingue este termo de זָרִים, traduzido como “estranhos”, preservando a variação vocabular do paralelismo hebraico.
