  yaml_path: translation/ot/lamentations/005/010.yaml
  text: Our skin is as hot as an oven because of the burning heat of famine[a].
translation:
  language: pt
  text: Nossa pele ficou quente como um forno por causa do calor abrasador da fome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nossa pele ficou abrasada como um forno por causa do calor ardente da fome”. Os termos hebraicos para o verbo e para “calor abrasador” são raros e podem enfatizar o efeito abrasador, em vez de um estado febril.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרֵנוּ
  choice: Nossa pele
  rationale: Em referência a seres humanos, עוֹר é traduzido naturalmente por “pele”; “couro” seria inadequadamente zoológico.
- source_word: כְתַנּוּר נִכְמָרוּ
  choice: ficou quente como um forno
  rationale: A combinação da comparação com “forno” e do raro verbo נִכְמָרוּ descreve o estado ardente ou abrasado da pele. A formulação é natural em português sem especificar além do necessário se há febre, queimadura ou escurecimento.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição introduz aqui a causa da condição física.
- source_word: זַלְעֲפוֹת
  choice: calor abrasador
  rationale: O termo raro pode indicar calor intenso, ardor febril ou efeitos abrasadores. “Calor abrasador” preserva a intensidade sem acrescentar explicitamente a ideia mais específica de febre.
- source_word: רָעָב
  choice: fome
  rationale: No contexto da calamidade coletiva, רָעָב pode designar fome extrema ou carestia. “Fome” é clara, natural e mantém tanto a experiência corporal quanto a crise mais ampla.
