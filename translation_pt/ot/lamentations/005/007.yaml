  text: אֲבֹתֵ֤י/נוּ חָֽטְאוּ֙ אינ/ם אנחנו עֲוֺנֹתֵי/הֶ֥ם סָבָֽלְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/007.yaml
  text: Our fathers sinned[a], and they are no more; but we bear their iniquities.
translation:
  language: pt
  text: Nossos pais pecaram e já não existem; nós, porém, carregamos as iniquidades deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregamos o castigo ou as consequências das iniquidades deles”. A palavra hebraica pode se referir à própria iniquidade, à culpa ou ao fardo que dela resulta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵינוּ
  choice: Nossos pais
  rationale: Preserva o sentido familiar direto e a ressonância coletiva do hebraico; no contexto, pode abranger as gerações anteriores.
- source_word: חָטְאוּ
  choice: pecaram
  rationale: O perfeito qal indica a ação passada de cometer pecado; o pretérito perfeito é natural em português.
- source_word: אֵינָם
  choice: já não existem
  rationale: A expressão significa literalmente que eles não estão e, no contexto, indica que já não vivem ou não estão presentes. A formulação mantém o tom solene.
- source_word: אֲנַחְנוּ
  choice: nós, porém
  rationale: O pronome independente é enfático e contrasta a geração atual com os pais; 'porém' torna esse contraste natural em português.
- source_word: עֲוֺנֹתֵיהֶם
  choice: as iniquidades deles
  rationale: עָוֹן pode designar iniquidade, culpa ou o castigo e as consequências decorrentes dela. A opção principal conserva a formulação mais direta, sem reduzir sua amplitude semântica.
- source_word: סָבָלְנוּ
  choice: carregamos
  rationale: O verbo significa levar, carregar ou suportar um fardo. 'Carregamos' preserva a metáfora concreta e permite a ambiguidade entre culpa e consequências.
theological_decisions:
- issue: Se o versículo ensina culpa herdada diretamente ou o sofrimento das consequências dos pecados das gerações anteriores
  choice: carregamos as iniquidades deles
  alternative: carregamos o castigo ou as consequências das iniquidades deles
  rationale: O hebraico עָוֹן pode abranger a própria iniquidade, a culpa e o fardo resultante. A tradução mantém essa tensão e não impõe uma conclusão doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Nossos pais' mantém a imagem familiar do original, enquanto 'já não existem' comunica idiomaticamente sua ausência ou morte. O contraste enfático é expresso por 'nós, porém'.
