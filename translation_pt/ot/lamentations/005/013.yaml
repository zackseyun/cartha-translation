  text: Young men carry millstones[b][a], and boys stagger under wood.
translation:
  language: pt
  text: 'Os jovens carregaram pedras de moinho[a],

    e os meninos cambalearam sob a madeira.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suportaram o trabalho de moer” ou “carregaram um moinho”. O termo hebraico está ligado à moagem e pode indicar tanto o trabalho quanto o aparelho usado para moer.
    reason: lexical_alternative
  - marker: b
    text: Ou “cambalearam com a madeira” ou “cambalearam na madeira”. A expressão provavelmente descreve meninos que fraquejavam sob uma carga de madeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: os jovens
  rationale: Designa homens jovens, na força da idade. “Os jovens” é natural em português e, em paralelo com “os meninos”, mantém a diferença provável de faixa etária.
- source_word: טְחוֹן
  choice: pedras de moinho
  rationale: O termo está ligado ao ato de moer e, como objeto de נָשָׂאוּ (“carregaram”), provavelmente indica o pesado aparato de moagem. A forma hebraica, porém, também permite entender o trabalho de moer ou o moinho, ambiguidade preservada em nota.
- source_word: נָשָׂאוּ
  choice: carregaram
  rationale: O verbo significa levantar, levar ou suportar. O pretérito traduz diretamente a forma verbal hebraica e combina com a descrição de trabalhos forçados no contexto.
- source_word: וּנְעָרִים
  choice: e os meninos
  rationale: O termo pode designar meninos ou rapazes. “Meninos” distingue este grupo dos jovens da primeira linha e intensifica, sem exceder o sentido possível, a imagem de menores submetidos ao peso.
- source_word: בָּעֵץ
  choice: sob cargas de lenha
  rationale: Literalmente, a expressão pode ser “sob/com a madeira”. No contexto de carregar peso, “sob cargas de lenha” torna explícita a relação física provável e usa o termo português natural para madeira destinada ao transporte e uso como combustível.
- source_word: כָּשָׁלוּ
  choice: tropeçaram
  rationale: O verbo descreve tropeçar, cambalear ou fraquejar. “Tropeçaram” mantém a imagem concreta sem afirmar que chegaram a cair ou desmaiar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético em duas linhas. O pretérito acompanha as formas verbais hebraicas. “Pedras de moinho” e “cargas de lenha” comunicam a dureza do trabalho forçado, enquanto as notas preservam as ambiguidades lexicais e preposicionais do original.
