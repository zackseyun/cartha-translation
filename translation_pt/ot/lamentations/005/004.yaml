  text: We drink our water for silver[b][a]; our wood comes at a price.
translation:
  language: pt
  text: Bebemos nossa água pagando com prata[a]; nossa madeira só é obtida mediante pagamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bebemos nossa água com dinheiro”. O hebraico diz literalmente “com/por prata”, empregando “prata” como meio de pagamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nossa madeira vem por um preço”. O verbo hebraico está no plural, literalmente “vêm”; em português, “madeira” normalmente pede concordância no singular.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  choice: nossa água
  rationale: O hebraico traz literalmente “nossas águas”, mas o singular coletivo “água” é o uso natural em português. O possessivo foi mantido porque ressalta que o povo precisa pagar até pela água que considera sua.
- source_word: בְּכֶסֶף
  choice: pagando com prata
  rationale: A preposição pode indicar meio ou preço, e כֶּסֶף significa “prata”, usada como meio de pagamento. A formulação explicita naturalmente a relação comercial sem substituir a imagem concreta por “dinheiro” no texto principal.
- source_word: שָׁתִינוּ
  choice: bebemos
  rationale: Embora a forma verbal seja qatal, no contexto da lamentação ela descreve vividamente uma condição presente e contínua; o presente português comunica bem esse valor.
- source_word: עֵצֵינוּ
  choice: nossa madeira
  rationale: O substantivo עֵץ pode designar madeira ou lenha. “Madeira” mantém a amplitude do termo hebraico, enquanto “lenha” seria uma especificação contextual possível.
- source_word: בִּמְחִיר
  choice: por um preço
  rationale: A expressão indica que a madeira só é obtida mediante pagamento. “Por um preço” é clara, idiomática e preserva a ênfase econômica da queixa.
- source_word: יָבֹאוּ
  choice: chega até nós
  rationale: O verbo hebraico está no plural, literalmente “vêm”, concordando com a forma plural de “madeira”. Em português, o substantivo coletivo singular pede “chega”; “até nós” explicita apenas o movimento implícito no verbo e evita a leitura de que a madeira simplesmente aparece.
