  text: נָשִׁים֙ בְּ/צִיּ֣וֹן עִנּ֔וּ בְּתֻלֹ֖ת בְּ/עָרֵ֥י יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/011.yaml
  text: Women in Zion were violated[a], virgins in the cities of Judah.
translation:
  language: pt
  text: Mulheres foram violentadas[a] em Sião, virgens nas cidades de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram estupradas”. O verbo hebraico também pode indicar humilhação ou aflição em sentido mais amplo, mas, neste contexto de mulheres e virgens, provavelmente se refere à violência sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: Mulheres
  rationale: O plural pode significar “mulheres” ou “esposas”. O paralelismo com “virgens” indica uma categoria ampla de vítimas, não especificamente mulheres casadas.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: A preposição בְּ marca o local; “em Sião” é a formulação natural e direta em português.
- source_word: עִנּוּ
  choice: foram violentadas
  rationale: No piel, ענה pode expressar humilhação, aflição ou violação. Neste contexto, envolvendo mulheres e virgens, a referência provável é à violência sexual. “Foram violentadas” comunica esse sentido sem eliminar por completo a amplitude lexical do verbo.
- source_word: בְּתֻלֹת
  choice: virgens
  rationale: O substantivo designa virgens ou donzelas. “Virgens” é o equivalente mais direto e preserva a condição sexual e social salientada pelo hebraico.
- source_word: בְּעָרֵי יְהוּדָה
  choice: nas cidades de Judá
  rationale: A expressão construta significa literalmente “nas cidades de Judá” e mantém o paralelismo geográfico com “em Sião”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada para evitar que “em Sião” pareça modificar apenas “violentadas”, sem perder o paralelismo poético do hebraico.
