base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/006.yaml
  text: We have given the hand to Egypt and to Assyria[a], to get enough bread.
translation:
  language: pt
  text: Estendemos a mão ao Egito e à Assíria[a] para obter pão suficiente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Demos a mão ao Egito e à Assíria”. A expressão pode indicar submissão, busca de aliança ou recurso a eles em busca de ajuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Egito
  rationale: Nome geográfico; usa-se a forma portuguesa consagrada.
- source_word: נָתַנּוּ
  choice: Estendemos
  rationale: O perfeito qal na primeira pessoa do plural descreve uma ação realizada. Em conjunto com יָד, a tradução idiomática «estendemos a mão» preserva a imagem hebraica em português natural.
- source_word: יָד
  choice: a mão
  rationale: Mantém a imagem concreta do hebraico. Na expressão נָתַן יָד, pode indicar submissão, aliança ou pedido de ajuda; a nota preserva essa amplitude sem fixar um único sentido.
- source_word: אַשּׁוּר
  choice: Assíria
  rationale: Nome geográfico; usa-se a forma portuguesa consagrada.
- source_word: לִשְׂבֹּעַ
  choice: para conseguir ... suficiente
  rationale: O infinitivo de שבע expressa a finalidade de obter saciedade. Esta formulação comunica naturalmente, em relação ao pão, a ideia de obter o bastante.
- source_word: לָחֶם
  choice: pão
  rationale: Conserva o substantivo concreto do hebraico, embora neste contexto também possa representar alimento em geral.
theological_decisions:
- issue: Sentido da expressão «dar/estender a mão»
  choice: Preservar no texto a imagem «estendemos a mão» e explicar sua amplitude em nota.
  alternative: Explicitar no texto «nós nos submetemos», «buscamos uma aliança» ou «pedimos ajuda».
  rationale: A expressão hebraica comporta mais de uma nuance contextual, e escolher apenas uma resolveria indevidamente uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem coordenada do hebraico foi expressa naturalmente com «ao Egito e à Assíria». A metáfora da mão e o termo concreto «pão» foram preservados.
