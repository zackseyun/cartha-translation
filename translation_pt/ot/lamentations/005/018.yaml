  text: עַ֤ל הַר צִיּוֹן֙ שֶׁ/שָּׁמֵ֔ם שׁוּעָלִ֖ים הִלְּכוּ בֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/018.yaml
  text: because Mount Zion lies desolate[a]; foxes walk on it.
translation:
  language: pt
  text: porque o monte Sião está desolado; raposas andam por ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chacais”, em vez de “raposas”; em alguns contextos, o termo hebraico pode designar esses animais ou ter sentido mais amplo, embora “raposas” seja a tradução adotada aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: porque
  rationale: Embora a preposição normalmente tenha sentido espacial, aqui ela liga o versículo à lamentação anterior e introduz sua causa; “porque” expressa naturalmente essa função.
- source_word: הַר צִיּוֹן
  choice: o monte Sião
  rationale: Forma corrente e clara em português para o nome geográfico, preservando a construção hebraica.
- source_word: שֶׁשָּׁמֵם
  choice: está desolado
  rationale: Expressa o estado presente e contínuo de Sião sem acrescentar explicitamente uma mudança de estado que o hebraico não exige.
- source_word: שׁוּעָלִים
  choice: raposas
  rationale: É o sentido lexical usual; “chacais” permanece uma alternativa possível para o termo hebraico neste contexto.
- source_word: הִלְּכוּ
  choice: andam
  rationale: Traduz de maneira direta o verbo comum de movimento, sem acrescentar a nuance de espreitar ou rondar.
- source_word: בוֹ
  choice: por ele
  rationale: Com “monte” como antecedente, “por ele” comunica naturalmente o deslocamento na área de Sião e mantém a referência masculina singular.
