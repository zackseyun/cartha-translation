  text: יְתוֹמִ֤ים הָיִ֨ינוּ֙ אין אָ֔ב אִמֹּתֵ֖י/נוּ כְּ/אַלְמָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/003.yaml
  text: We have become orphans[a], without a father; our mothers are like widows.
translation:
  language: pt
  text: Ficamos órfãos[a], sem pai; nossas mães são como viúvas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem pai”.
    reason: Alternativa lexical que explicita a ênfase frequente de יְתוֹמִים na perda ou ausência do pai.
lexical_decisions:
- source_word: יְתוֹמִים
  choice: órfãos
  rationale: O termo designa pessoas privadas de um dos pais e, no uso hebraico, frequentemente destaca a falta da proteção paterna. “Órfãos” é a forma mais natural em português; a nota registra a alternativa contextual mais específica.
- source_word: הָיִינוּ
  choice: ficamos
  rationale: Embora o qatal de היה possa significar simplesmente “éramos”, neste contexto de catástrofe ele apresenta uma condição resultante. “Ficamos” expressa de modo natural a passagem para esse estado.
- source_word: אֵין אָב
  choice: sem pai
  rationale: A construção existencial negativa significa literalmente “não há pai”. “Sem pai” preserva de maneira concisa a ausência paterna enfatizada pelo hebraico.
- source_word: אִמֹּתֵינוּ
  choice: nossas mães
  rationale: Tradução direta do substantivo plural com sufixo possessivo de primeira pessoa do plural.
- source_word: כְּאַלְמָנוֹת
  choice: como viúvas
  rationale: O prefixo כְּ introduz uma comparação. “Como viúvas” mantém o símile sem afirmar que todas eram literalmente viúvas.
theological_decisions:
- issue: Força da comparação referente às mães
  choice: Manter o símile “como viúvas”.
  alternative: “Nossas mães são viúvas.”
  rationale: O hebraico emprega explicitamente o prefixo comparativo כְּ. Preservar a comparação mantém a tensão retórica do lamento e evita fazer uma afirmação histórica mais forte do que o texto.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. “Ficamos” comunica a condição resultante sem pesar a frase; “sem pai” evita a formulação menos natural “não há pai”.
