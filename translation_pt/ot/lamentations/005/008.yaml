  text: עֲבָדִים֙ מָ֣שְׁלוּ בָ֔/נוּ פֹּרֵ֖ק אֵ֥ין מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/008.yaml
  text: Slaves rule over us[b][a]; there is no one to rescue us from their hand.
translation:
  language: pt
  text: Escravos[a] nos governam; não há quem nos livre da mão deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Servos”. O termo hebraico pode designar servos ou escravos; “escravos” preserva aqui a força da humilhação social expressa no lamento.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “da mão deles”, expressão que significa estar sob o poder ou controle deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים
  choice: Escravos
  rationale: O plural de עֶבֶד pode designar escravos ou servos. Aqui, “escravos” preserva com mais força a inversão social e a humilhação expressas no lamento, sem suavizar a condição indicada.
- source_word: מָשְׁלוּ בָנוּ
  choice: governam sobre nós
  rationale: A construção משל com ב indica exercer domínio sobre alguém. “Governam sobre nós” é natural em português contemporâneo e mantém a ideia de autoridade opressora.
- source_word: פֹּרֵק
  choice: quem nos livre
  rationale: O particípio funciona como substantivo, “aquele que livra/resgata”. A formulação “quem nos livre” é concisa e natural, comunicando a retirada do poder dos opressores.
- source_word: אֵין
  choice: não há
  rationale: A partícula existencial negativa é vertida por uma construção portuguesa direta e idiomática.
- source_word: מִיָּדָם
  choice: das mãos deles
  rationale: Mantém a imagem hebraica da mão como expressão de poder ou controle; o plural soa mais natural em português quando se refere a várias pessoas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem da frase conserva a ênfase inicial nos “escravos”, e a imagem hebraica das mãos é mantida no texto com esclarecimento em nota.
