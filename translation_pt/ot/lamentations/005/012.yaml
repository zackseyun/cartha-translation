  text: שָׂרִים֙ בְּ/יָדָ֣/ם נִתְל֔וּ פְּנֵ֥י זְקֵנִ֖ים לֹ֥א נֶהְדָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/012.yaml
  text: Princes were hung up by their hands[b][a]; the faces of elders were not honored.
translation:
  language: pt
  text: Príncipes foram pendurados pelas mãos[a]; os anciãos não foram tratados com respeito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Príncipes foram suspensos pelas mãos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “os rostos dos anciãos não foram honrados”, expressão hebraica que indica a recusa do respeito devido aos anciãos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: Príncipes
  rationale: O termo pode designar príncipes, autoridades ou líderes. “Príncipes” preserva a posição social elevada e a força tradicional da imagem, sem excluir a referência mais ampla aos homens de governo.
- source_word: בְּיָדָם
  choice: pelas mãos
  rationale: A preposição ב, neste contexto, indica mais naturalmente a parte do corpo pela qual eles foram suspensos, e não o agente da ação.
- source_word: נִתְלוּ
  choice: foram pendurados
  rationale: O nifal de תלה expressa ser pendurado ou suspenso. “Foram pendurados” mantém a imagem concreta sem afirmar de modo indevido que a morte por enforcamento era especificamente o meio de execução.
- source_word: פְּנֵי זְקֵנִים
  choice: os anciãos
  rationale: Embora a expressão seja literalmente “os rostos dos anciãos”, “os anciãos” comunica em português atual a referência metonímica às próprias pessoas; a forma literal é preservada em nota.
- source_word: לֹא נֶהְדָּרוּ
  choice: não foram tratados com respeito
  rationale: O verbo passivo indica que honra, dignidade ou respeito não lhes foi concedido. A formulação escolhida é natural e clara em português, conservando a ideia de desonra pública.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução mantém o paralelismo do verso, explicita em nota a expressão idiomática hebraica sobre o rosto dos anciãos e preserva a ambiguidade entre pendurar e suspender.
