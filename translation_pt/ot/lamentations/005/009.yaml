  yaml_path: translation/ot/lamentations/005/009.yaml
  text: At the risk of our lives we get our bread[b][a], because of the sword in the wilderness.
translation:
  language: pt
  text: Com risco de vida, conseguimos o nosso pão[a] por causa da espada no deserto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “trazemos o nosso pão com risco de vida”. O verbo hebraico pode ser entendido como “trazer” ou, em sentido mais geral, “obter, conseguir”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por causa da espada do deserto”, possivelmente referindo-se ao perigo da espada no deserto, e não a uma espada que pertença ao deserto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנַפְשֵׁנוּ
  choice: Arriscando a vida
  rationale: A expressão hebraica indica exposição a perigo mortal. Esta formulação comunica o sentido idiomático de modo natural e mantém a gravidade do lamento.
- source_word: נָבִיא
  choice: conseguimos
  rationale: O hifil de בוא pode significar “trazer” ou, neste contexto, “obter/prover”. “Conseguimos” é claro em português e preserva a alternativa lexical em nota.
- source_word: לַחְמֵנוּ
  choice: o nosso pão
  rationale: Mantém a imagem concreta do hebraico, em que “pão” também representa o sustento básico.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: A preposição expressa aqui causa ou motivo; “por causa de” é uma tradução direta e natural.
- source_word: חֶרֶב
  choice: a espada
  rationale: Preserva a imagem vívida da ameaça violenta sem explicitar interpretativamente “perigo” no texto principal.
- source_word: הַמִּדְבָּר
  choice: o deserto
  rationale: מִדְבָּר designa uma região erma, desértica ou não cultivada. “Deserto” é corrente e inteligível, enquanto a nota preserva a possível relação atributiva com “espada”.
