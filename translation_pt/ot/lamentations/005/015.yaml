  text: שָׁבַת֙ מְשׂ֣וֹשׂ לִבֵּ֔/נוּ נֶהְפַּ֥ךְ לְ/אֵ֖בֶל מְחֹלֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/015.yaml
  text: The joy of our heart has ceased[a]; our dancing has turned to mourning.
translation:
  language: pt
  text: A alegria do nosso coração cessou; nossa dança transformou-se em luto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: cessou
  rationale: O qal perfeito expressa a interrupção da alegria, com efeito presente; “cessou” é conciso e preserva o tom poético.
- source_word: מְשׂוֹשׂ
  choice: alegria
  rationale: O substantivo denota alegria ou exultação; “alegria” é claro, corrente e adequado ao contraste com o luto.
- source_word: לִבֵּנוּ
  choice: nosso coração
  rationale: Mantém o singular coletivo do hebraico e preserva a imagem poética da comunidade como um só coração.
- source_word: נֶהְפַּךְ
  choice: transformou-se
  rationale: O nifal perfeito indica mudança de estado; a forma pronominal comunica naturalmente em português a passagem da dança ao luto sem explicitar um agente.
- source_word: לְאֵבֶל
  choice: em luto
  rationale: אֵבֶל designa luto ou lamentação; “em luto” forma uma construção portuguesa natural com “transformou-se” e conserva o registro da lamentação.
- source_word: מְחֹלֵנוּ
  choice: nossa dança
  rationale: O substantivo se refere à dança festiva; o singular “dança” reproduz de perto a forma nominal hebraica e estabelece com clareza o contraste poético.
