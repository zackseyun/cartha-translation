  text: We are pursued at our necks[a]; we are weary[b]; no rest is given to us.
translation:
  language: pt
  text: Sobre os nossos pescoços, somos perseguidos[a]; estamos cansados; não nos é dado descanso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «Sobre os nossos pescoços somos perseguidos». O hebraico conserva a imagem vívida de inimigos que os pressionam de muito perto.'
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: «não nos é concedido descanso» ou «não nos deixam repousar».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל צַוָּארֵינוּ
  choice: de perto, sobre o nosso pescoço
  rationale: Preserva a imagem concreta e incomum do hebraico — a perseguição que pesa ou se fecha sobre o pescoço — enquanto «de perto» torna clara ao leitor moderno a pressão implacável dos perseguidores. O singular coletivo «nosso pescoço» acompanha a forma hebraica.
- source_word: נִרְדָּפְנוּ
  choice: somos perseguidos
  rationale: O nifal de רדף expressa perseguição sofrida. «Perseguidos» mantém o caráter concreto da cena sem a coloquialidade de «caçados» nem possíveis conotações mais abstratas.
- source_word: יָגַעְנוּ
  choice: estamos exaustos
  rationale: O verbo descreve o estado de cansaço produzido por esforço ou sofrimento. Neste contexto de perseguição incessante, «exaustos» comunica de modo natural a intensidade resultante.
- source_word: לֹא הוּנַח לָנוּ
  choice: não nos dão descanso
  rationale: 'O hofal de נוח tem sentido causativo-passivo: não se permite ou concede repouso. A construção portuguesa é natural e conserva a falta de descanso imposta por outros, sem precisar identificar os agentes.'
