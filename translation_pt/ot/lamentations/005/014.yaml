  text: זְקֵנִים֙ מִ/שַּׁ֣עַר שָׁבָ֔תוּ בַּחוּרִ֖ים מִ/נְּגִינָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/014.yaml
  text: The elders have ceased from the gate[a], the young men from their music.
translation:
  language: pt
  text: Os anciãos deixaram de estar à porta; os jovens, de fazer música.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de tocar” ou “de cantar”; o termo hebraico pode referir-se à execução musical, muitas vezes instrumental.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: os anciãos
  rationale: No contexto cívico da porta da cidade, o termo designa homens mais velhos que também exerciam função de liderança comunitária; “anciãos” preserva ambos os sentidos.
- source_word: מִשַּׁעַר
  choice: à porta da cidade
  rationale: Embora a preposição indique afastamento ou cessação a partir da porta, em português a construção com “deixaram de se reunir à” comunica naturalmente que os anciãos já não ocupam seu lugar público habitual. “Da cidade” explicita o sentido urbano de שַׁעַר sem alterar a imagem.
- source_word: שָׁבָתוּ
  choice: deixaram de se reunir
  rationale: O verbo significa cessar. A explicitação “se reunir” produz português natural com “à porta” e expressa a ausência dos anciãos de seu costumeiro espaço cívico, sem atribuir uma atividade específica como julgar.
- source_word: בַּחוּרִים
  choice: os jovens
  rationale: Refere-se a homens jovens; no paralelismo com “anciãos”, “os jovens” é claro, natural e suficientemente específico no português contemporâneo.
- source_word: מִנְּגִינָתָם
  choice: de fazer música
  rationale: נְגִינָה pode indicar música, canto ou execução instrumental. “Fazer música” preserva essa amplitude e funciona naturalmente após a elipse do verbo “deixaram”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado por meio da elipse na segunda oração. O ponto e vírgula marca as duas perdas paralelas da vida comunitária.
