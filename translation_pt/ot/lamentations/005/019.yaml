  text: אַתָּ֤ה יְהוָה֙ לְ/עוֹלָ֣ם תֵּשֵׁ֔ב כִּסְאֲ/ךָ֖ לְ/דֹ֥ר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/019.yaml
  text: But you[a], O Yahweh, sit enthroned forever; your throne is from generation to generation.
translation:
  language: pt
  text: 'Mas tu, ó Yahweh, estás entronizado[a] para sempre;

    teu trono, de geração em geração.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tu permaneces para sempre”. O verbo hebraico significa literalmente “sentar-se”; neste contexto, porém, a referência ao trono lhe confere sentido régio.'
    reason: alternativa lexical
lexical_decisions:
- source_word: אַתָּה
  choice: tu
  rationale: O pronome independente, colocado no início, recebe ênfase e estabelece contraste com a condição mutável descrita ao redor. “Tu” preserva essa força de modo natural e solene.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְעוֹלָם
  choice: para sempre
  rationale: Expressa de forma corrente e digna a perpetuidade indicada por עוֹלָם.
- source_word: תֵּשֵׁב
  choice: estás entronizado
  rationale: Embora ישׁב signifique literalmente “sentar-se” e também possa significar “permanecer” ou “habitar”, a menção paralela ao trono indica aqui o sentido régio de estar sentado no trono.
- source_word: כִּסְאֲךָ
  choice: teu trono
  rationale: Correspondência direta para o substantivo “trono” com sufixo pronominal masculino singular de segunda pessoa.
- source_word: לְדֹר וָדֹר
  choice: de geração em geração
  rationale: Reproduz o idioma hebraico que indica continuidade ao longo de gerações sucessivas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino. A transliteração “Yahweh” preserva sua função como nome próprio sem substituí-lo por um título.
- issue: Explicitação do sentido régio de ישׁב
  choice: estás entronizado
  alternative: estás sentado; permaneces
  rationale: O paralelismo imediato com “teu trono” favorece o sentido de entronização. A nota preserva a amplitude lexical do verbo e evita ocultar a alternativa interpretativa.
- issue: Verbo implícito na segunda linha
  choice: permanece
  alternative: é; sem verbo explícito
  rationale: O hebraico não apresenta um segundo verbo expresso, mas o português requer uma ligação natural. “Permanece” comunica a continuidade temporal do trono sem introduzir uma afirmação teológica estranha ao paralelismo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém “tu” por sua força poética e pela ênfase do pronome hebraico; emprega “ó” no vocativo e conserva o paralelismo em duas linhas.
