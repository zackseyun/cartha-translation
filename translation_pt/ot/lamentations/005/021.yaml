  text: הֲשִׁיבֵ֨/נוּ יְהוָ֤ה אֵלֶ֨י/ךָ֙ ו/נשוב חַדֵּ֥שׁ יָמֵ֖י/נוּ כְּ/קֶֽדֶם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/021.yaml
  text: Restore us to yourself[a], O Yahweh, that we may return[b]; renew our days as of old.
translation:
  language: pt
  text: Faze-nos voltar para ti, ó Yahweh, e voltaremos; renova os nossos dias como antigamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faze-nos voltar para ti, ó Yahweh, para que voltemos; renova os nossos dias como antes.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲשִׁיבֵנוּ
  choice: Faze-nos voltar
  rationale: O hifil imperativo de שוב com sufixo de primeira pessoa do plural pede que Yahweh cause o retorno. A formulação preserva diretamente a imagem verbal e sua relação com וְנָשׁוּב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלֶיךָ
  choice: para ti
  rationale: Traduz literalmente a direção relacional expressa por אֶל com sufixo de segunda pessoa masculina singular.
- source_word: וְנָשׁוּב
  choice: e voltaremos
  rationale: Mantém a coordenação formal do hebraico e a tensão entre a ação divina solicitada e a resposta humana, sem decidir se o waw exprime resultado, propósito ou simples consequência.
- source_word: חַדֵּשׁ
  choice: renova
  rationale: O piel imperativo de חדש significa renovar ou tornar novo; “renova” é direto, natural e adequado à linguagem de oração.
- source_word: יָמֵינוּ
  choice: os nossos dias
  rationale: Preserva a expressão concreta do hebraico, embora “dias” possa representar por metonímia a vida ou a situação do povo.
- source_word: כְּקֶדֶם
  choice: como antigamente
  rationale: Expressa de modo corrente e digno a ideia de “como antes” ou “como nos tempos antigos”.
theological_decisions:
- issue: Relação entre a ação divina e o retorno humano em וְנָשׁוּב
  choice: e voltaremos
  alternative: para que voltemos
  rationale: A construção hebraica admite coordenação, consequência ou finalidade. A tradução principal conserva a forma coordenada e a tensão teológica; a nota registra a leitura final/resultativa sem impor uma sistematização doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Faze-nos” mantém o imperativo culto e é amplamente compreensível; “como antigamente” comunica naturalmente כְּקֶדֶם. O marcador da nota aparece no texto principal.
