id: LAM.5.1
reference: Lamentations 5:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זְכֹ֤ר יְהוָה֙ מֶֽה הָ֣יָה לָ֔/נוּ הביט וּ/רְאֵ֥ה אֶת חֶרְפָּתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/001.yaml
  text: Remember[a], O Yahweh, what has happened to us; look, and see our disgrace.
translation:
  language: pt
  text: Lembra-te, ó Yahweh, do que nos aconteceu; olha e vê a nossa desonra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a nossa vergonha»; também «o nosso opróbrio».
    reason: Alternativas lexicais para חֶרְפָּה, que pode indicar desonra, vergonha ou opróbrio público.
lexical_decisions:
- source_word: זְכֹר
  choice: Lembra-te
  rationale: Imperativo masculino singular de זכר dirigido a Yahweh. «Lembra-te» é uma formulação natural e digna em português e preserva a força de súplica, sem reduzir o verbo a mera recordação mental.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֶה הָיָה לָנוּ
  choice: do que nos aconteceu
  rationale: Expressa de modo corrente a situação e os acontecimentos que sobrevieram ao povo, mantendo o sentido aberto da construção hebraica.
- source_word: הביט
  choice: olha
  rationale: Imperativo de נבט, aqui em paralelo com ראה. «Olha» conserva a urgência do apelo e a distinção entre os dois verbos.
- source_word: וּרְאֵה
  choice: e vê
  rationale: Mantém o segundo imperativo e o paralelismo enfático «olha e vê», sem fundir os dois verbos.
- source_word: אֶת חֶרְפָּתֵנוּ
  choice: a nossa desonra
  rationale: חֶרְפָּה abrange desonra, vergonha e opróbrio, sobretudo como humilhação pública. «Desonra» comunica esse aspecto com clareza no português atual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração preserva o nome pessoal da aliança, sem substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. «Lembra-te» mantém o tom de oração; «olha e vê» preserva o paralelismo hebraico. O marcador foi colocado após «desonra», termo ao qual a nota se refere.
