base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
translation:
  language: pt
  text: Alegre-se e exulte, filha de Edom, você que habita na terra de Uz; o cálice também chegará a você[a] — você ficará embriagada e se despirá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cálice também passará a você”. O cálice é uma imagem do juízo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e ficará exposta” ou “e se descobrirá”. O hebraico retrata nudez vergonhosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂישִׂי וְשִׂמְחִי
  choice: Alegre-se e exulte
  rationale: Os dois imperativos femininos singulares formam um paralelismo intensificador. A combinação é natural em português e preserva a força celebrativa, aqui usada com efeito irônico diante do juízo anunciado.
- source_word: בַּת אֱדוֹם
  choice: filha de Edom
  rationale: Mantém a personificação profética da nação como mulher e corresponde às formas femininas do versículo.
- source_word: יושבתי בְּאֶרֶץ עוּץ
  choice: você que habita na terra de Uz
  rationale: O particípio feminino descreve a filha de Edom como habitante de Uz. A formulação com 'você que' é clara e corrente, com boa legibilidade brasileira.
- source_word: גַּם עָלַיִךְ תַּעֲבָר כּוֹס
  choice: o cálice também passará até você
  rationale: Conserva o movimento expresso por עבר e a imagem profética do cálice, sem substituí-la diretamente por uma explicação de castigo.
- source_word: תִּשְׁכְּרִי
  choice: você ficará embriagada
  rationale: Expressa o ingresso no estado de embriaguez e mantém a concordância feminina com a nação personificada.
- source_word: וְתִתְעָרִי
  choice: e se despirá
  rationale: Preserva a forma reflexiva do hitpael e a imagem de nudez vergonhosa. A nota registra a possível ênfase resultativa em ficar exposta.
theological_decisions:
- issue: Imagem metafórica do cálice
  choice: Conservar 'o cálice' como imagem do juízo que alcançará Edom.
  alternative: Parafrasear como 'o castigo também virá sobre você'.
  rationale: A metáfora é literária e teologicamente significativa no contexto profético. Mantê-la evita reduzir a riqueza intertextual do hebraico.
- issue: Sentido reflexivo ou resultativo de וְתִתְעָרִי
  choice: Traduzir 'e se despirá'.
  alternative: Traduzir 'e ficará exposta'.
  rationale: A opção principal representa mais diretamente a morfologia reflexiva; a alternativa reconhece que, no contexto de juízo e vergonha, o resultado de ser exposta também pode estar em foco.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preservam-se a personificação feminina de Edom, a metáfora do cálice e a nudez como imagem de vergonha pública.
