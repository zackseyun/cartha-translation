base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/015.yaml
  text: “Turn aside! Unclean!” they cried to them[a]. “Turn aside, turn aside, do not touch!” For they have fled; they have even wandered. Among the nations they said[b], “They will stay no longer.”
translation:
  language: pt
  text: '“Afastem-se! Impuros!”, gritavam para eles. “Afastem-se, afastem-se! Não toquem!” Pois eles fugiram[a] e até andaram errantes. Entre as nações, diziam: “Eles não continuarão a residir como estrangeiros[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram expulsos”. O verbo hebraico é raro, e seu sentido exato neste contexto é discutido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eles não mais peregrinarão”. O verbo hebraico pode indicar residir como estrangeiro ou forasteiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: Afastem-se
  rationale: O imperativo plural funciona como uma ordem pública para manter distância. “Afastem-se” é natural em português e preserva a repetição enfática do hebraico.
- source_word: טָמֵא
  choice: Impuros
  rationale: O termo designa impureza ritual e social. O plural explicita que o grito se dirige ao grupo referido por “eles”, sem perder o valor de acusação pública.
- source_word: קָרְאוּ לָמוֹ
  choice: gritavam para eles
  rationale: קרא com ל indica fala dirigida a alguém; “gritavam” comunica a urgência e o caráter público da advertência.
- source_word: אַל תִּגָּעוּ
  choice: Não toquem
  rationale: Mantém o sentido direto de נגע, permitindo que o contexto comunique o perigo de contato contaminante.
- source_word: כִּי נָצוּ
  choice: Pois eles fugiram
  rationale: כִּי introduz uma explicação. נָצוּ é raro e discutido; “fugiram” se ajusta ao paralelismo com o vagar subsequente, enquanto a possibilidade passiva é registrada em nota.
- source_word: גַּם נָעוּ
  choice: e até andaram errantes
  rationale: נוע pode descrever movimento instável ou errante; neste contexto de dispersão, “andaram errantes” é claro, e “até” conserva a progressão enfática de גַּם.
- source_word: אָמְרוּ בַּגּוֹיִם
  choice: Entre as nações, diziam
  rationale: A formulação preserva o âmbito da declaração e deixa o sujeito de “diziam” tão indeterminado quanto no hebraico.
- source_word: לֹא יוֹסִיפוּ לָגוּר
  choice: Eles já não continuarão a viver como estrangeiros
  rationale: גור descreve residência na condição de forasteiro ou estrangeiro. A construção com יסף indica que essa permanência não continuará, sem acrescentar um lugar que não está expresso no texto massorético.
