  text: יְדֵ֗י נָשִׁים֙ רַחֲמָ֣נִיּ֔וֹת בִּשְּׁל֖וּ יַלְדֵי/הֶ֑ן הָי֤וּ לְ/בָרוֹת֙ לָ֔/מוֹ בְּ/שֶׁ֖בֶר בַּת עַמִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/010.yaml
  text: The hands of compassionate women cooked their own children[b][a]; they became food for them in the destruction of the daughter of my people.
translation:
  language: pt
  text: As mãos de mulheres compassivas cozinharam os próprios filhos[a]; eles lhes serviram de alimento durante a destruição da filha do meu povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ferveram os próprios filhos”. O verbo hebraico se refere a cozinhar, muitas vezes por fervura.'
    reason: lexical_alternative
  - marker: b
    text: “A filha do meu povo” é uma expressão poética hebraica que personifica o povo, especialmente Jerusalém/Sião, em sua devastação.
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי
  choice: As mãos de
  rationale: Preserva a imagem concreta e chocante do hebraico, em vez de simplificar o sujeito para “mulheres”.
- source_word: נָשִׁים
  choice: mulheres
  rationale: O substantivo é genérico; o contexto não exige o sentido mais restrito de “esposas”.
- source_word: רַחֲמָנִיּוֹת
  choice: compassivas
  rationale: Mantém o forte contraste entre a índole compassiva dessas mulheres e o ato extremo provocado pela calamidade.
- source_word: בִּשְּׁלוּ
  choice: cozinharam
  rationale: O verbo denota cozinhar, provavelmente por fervura; “cozinharam” é natural e deixa a especificidade provável para a nota.
- source_word: יַלְדֵיהֶן
  choice: os próprios filhos
  rationale: Expressa naturalmente em português a posse enfática e o horror implícito no contexto, sem alterar o referente.
- source_word: הָיוּ לְבָרוֹת לָמוֹ
  choice: eles lhes serviram de alimento
  rationale: Formulação idiomática que preserva os filhos como sujeito e indica que se tornaram alimento para as próprias mulheres.
- source_word: בְּשֶׁבֶר
  choice: durante a destruição
  rationale: O substantivo indica quebra, ruína ou colapso; “destruição” comunica claramente a catástrofe, e “durante” expressa bem a circunstância temporal.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: Conserva a personificação poética e profética do povo, associada especialmente a Jerusalém/Sião.
theological_decisions:
- issue: Preservar ou parafrasear a expressão בַּת עַמִּי
  choice: a filha do meu povo
  alternative: o meu povo
  rationale: A expressão tem valor poético e personifica o povo/cidade; mantê-la evita apagar sua força literária e teológica.
- issue: Grau de explicitação do horror descrito
  choice: cozinharam os próprios filhos; eles lhes serviram de alimento
  alternative: prepararam os filhos como alimento
  rationale: O hebraico é deliberadamente direto e não deve ser suavizado; a redação mantém o caráter terrível da cena sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a imagem concreta das mãos e a personificação poética, enquanto “serviram de alimento” evita uma construção rígida sem atenuar o horror do texto.
