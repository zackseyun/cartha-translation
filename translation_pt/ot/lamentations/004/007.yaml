base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
translation:
  language: pt
  text: Seus nobres eram mais puros que a neve[a], mais brancos que o leite; seus corpos eram mais corados que os corais[b], e sua aparência era como a safira[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus nazireus” ou “seus consagrados”. O termo hebraico pode designar pessoas separadas por voto, mas aqui talvez se refira aos nobres ou membros distintos da elite de Jerusalém.
    reason: alternative_reading
  - marker: b
    text: A palavra hebraica traduzida por “corais” é de identificação incerta; também pode indicar rubis, pérolas ou outra substância preciosa avermelhada.
    reason: lexical_alternative
  - marker: c
    text: A antiga pedra chamada aqui de “safira” talvez fosse o lápis-lazúli, não a safira conhecida hoje.
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  choice: seus nobres
  rationale: O termo designa literalmente pessoas separadas ou consagradas e pode referir-se a nazireus; neste contexto, porém, provavelmente indica os membros distintos da elite de Jerusalém. A ambiguidade é preservada em nota.
- source_word: זַכּוּ
  choice: eram mais puros
  rationale: O verbo comunica pureza ou limpidez, e a construção comparativa com a neve é natural em português.
- source_word: צַחוּ
  choice: mais brancos
  rationale: O verbo denota claridade ou brancura; a comparação com o leite favorece 'mais brancos'.
- source_word: אָדְמוּ
  choice: eram mais corados
  rationale: O verbo significa ser vermelho ou avermelhado. 'Corados' exprime aqui uma aparência saudável e mantém o contraste poético.
- source_word: עֶצֶם
  choice: seus corpos
  rationale: Embora o substantivo normalmente signifique 'osso', pode representar a substância ou estrutura corporal; 'corpos' evita uma leitura excessivamente anatômica.
- source_word: פְּנִינִים
  choice: corais
  rationale: A identificação do material precioso é incerta. 'Corais' combina bem com a referência à tonalidade avermelhada, enquanto outras possibilidades são registradas em nota.
- source_word: גִּזְרָתָם
  choice: sua aparência
  rationale: O substantivo pode indicar forma, figura ou contorno. 'Aparência' produz uma comparação compreensível sem eliminar a dimensão visual do hebraico.
- source_word: סַפִּיר
  choice: safira
  rationale: Mantém-se a designação tradicional, embora a pedra antiga talvez fosse lápis-lazúli; a incerteza histórica é indicada em nota.
