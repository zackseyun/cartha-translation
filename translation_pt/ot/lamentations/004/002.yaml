base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/002.yaml
  text: The precious sons of Zion[a], weighed out against fine gold—how they are regarded as clay jars[b], the work of a potter’s hands.
translation:
  language: pt
  text: Os preciosos filhos de Sião, estimados como ouro fino[a] — como são considerados vasos de barro[b], obra das mãos de um oleiro!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pesados em comparação com ouro fino”, “equivalentes a ouro fino” ou “estimados pelo valor do ouro fino”. A expressão hebraica pode enfatizar a avaliação do valor, mais do que a imagem concreta de uma pesagem.
    reason: lexical_alternative
  - marker: b
    text: Ou “jarros de barro” ou “recipientes de cerâmica”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי צִיּוֹן
  choice: os filhos de Sião
  rationale: Mantém a forma masculina e a expressão poética do hebraico, embora no contexto possa representar mais amplamente os habitantes de Sião.
- source_word: הַיְקָרִים
  choice: preciosos
  rationale: Expressa tanto o alto valor quanto o tom afetivo e doloroso do lamento.
- source_word: הַמְסֻלָּאִים בַּפָּז
  choice: avaliados em ouro fino
  rationale: Preserva a ideia provável de valoração em relação ao ouro sem impor exclusivamente a imagem concreta de pesagem; a nota registra alternativas legítimas.
- source_word: פָּז
  choice: ouro fino
  rationale: Designa ouro de alta qualidade ou refinado e conserva o registro poético elevado.
- source_word: אֵיכָה
  choice: como
  rationale: Introduz a exclamação de espanto e lamento de modo natural em português.
- source_word: נֶחְשְׁבוּ
  choice: agora são considerados
  rationale: Traduz o sentido passivo de serem tidos ou avaliados como algo; “agora” explicita em português o forte contraste temporal implícito, sem mudar o referente.
- source_word: לְנִבְלֵי חֶרֶשׂ
  choice: vasos de barro
  rationale: É uma expressão portuguesa natural e digna para recipientes de cerâmica, preservando o contraste entre o ouro valioso e o barro comum.
- source_word: מַעֲשֵׂה יְדֵי יוֹצֵר
  choice: obra das mãos de um oleiro
  rationale: Retém a concretude de “mãos” e identifica com precisão o artesão que molda o barro.
