  text: תַּם עֲוֺנֵ/ךְ֙ בַּת צִיּ֔וֹן לֹ֥א יוֹסִ֖יף לְ/הַגְלוֹתֵ֑/ךְ פָּקַ֤ד עֲוֺנֵ/ךְ֙ בַּת אֱד֔וֹם גִּלָּ֖ה עַל חַטֹּאתָֽיִ/ךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/022.yaml
  text: Your punishment is finished[a], daughter Zion; he will not exile you again. He has punished your iniquity, daughter Edom[c][b]; he has uncovered your sins.
translation:
  language: pt
  text: Seu castigo chegou ao fim[a], filha de Sião; ele não voltará a exilar você. Ele puniu sua iniquidade[b], filha de Edom; expôs os seus pecados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua iniquidade chegou ao fim” ou “Sua culpa acabou”. A palavra hebraica pode significar iniquidade, culpa ou o castigo resultante da culpa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “visitou sua iniquidade”. O sentido é que ele a chamou a prestar contas em julgamento.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “descobriu os seus pecados” ou “revelou os seus pecados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּם
  choice: chegou ao fim
  rationale: O qal perfeito expressa conclusão. A locução é natural em português e preserva a ideia de algo que se completou.
- source_word: עֲוֺנֵךְ (primeira ocorrência)
  choice: seu castigo
  rationale: עָוֹן pode indicar iniquidade, culpa ou a punição decorrente dela. A menção imediata ao fim do exílio favorece aqui o sentido de castigo, sem ocultar as alternativas em nota.
- source_word: בַּת צִיּוֹן
  choice: filha de Sião
  rationale: Preserva a personificação poética hebraica da cidade e de seu povo.
- source_word: לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  choice: ele não voltará a levar você para o exílio
  rationale: יָסַף com infinitivo comunica não tornar a fazer algo. Esta formulação é corrente e explicita o sentido de הגלה sem perder a referência ao exílio.
- source_word: פָּקַד
  choice: chamou ... a julgamento
  rationale: Neste contexto judicial, פקד significa voltar a atenção para a culpa a fim de exigir contas. A escolha preserva melhor a imagem do que simplesmente 'puniu' e evita a expressão pouco clara 'visitou a iniquidade'.
- source_word: עֲוֺנֵךְ (segunda ocorrência)
  choice: sua iniquidade
  rationale: Mantém aqui o núcleo moral do termo e a ligação com a exposição subsequente dos pecados de Edom.
- source_word: בַּת אֱדוֹם
  choice: filha de Edom
  rationale: Preserva a personificação poética paralela a 'filha de Sião'.
- source_word: גִּלָּה עַל חַטֹּאתָיִךְ
  choice: expôs os seus pecados
  rationale: O piel de גלה comunica descobrir, revelar ou expor. 'Expôs' é natural em português e conserva a imagem de tornar os pecados manifestos.
- source_word: חַטֹּאתָיִךְ
  choice: os seus pecados
  rationale: Tradução direta e clara do plural de חַטָּאת no sentido de pecados ou transgressões.
theological_decisions:
- issue: Amplitude semântica de עָוֹן na primeira oração
  choice: Traduzir como 'castigo'
  alternative: Traduzir como 'iniquidade' ou 'culpa'
  rationale: O anúncio de que Sião não será novamente levada ao exílio favorece o sentido consequencial de punição. A nota conserva a ambiguidade lexical genuína.
- issue: Sujeito implícito de יוֹסִיף, פָּקַד e גִּלָּה
  choice: Usar o pronome 'ele' sem identificar nominalmente o sujeito
  alternative: Explicitar 'o SENHOR'
  rationale: O sujeito divino é inferível no contexto, mas não aparece expresso neste versículo. O pronome mantém a inteligibilidade sem acrescentar um nome ausente do hebraico.
- issue: Força judicial de פקד aplicado à iniquidade de Edom
  choice: Traduzir como 'chamou sua iniquidade a julgamento'
  alternative: Traduzir como 'puniu sua iniquidade' ou, formalmente, 'visitou sua iniquidade'
  rationale: A formulação comunica a prestação de contas judicial inerente ao contexto sem sugerir que 'iniquidade' seja diretamente o objeto de uma punição de maneira pouco natural em português.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente internacional. As personificações 'filha de Sião' e 'filha de Edom' foram mantidas. Empregou-se 'você' por clareza no discurso direto singular feminino; a repetição pronominal foi controlada para preservar o ritmo poético.
