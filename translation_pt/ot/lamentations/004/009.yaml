base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/009.yaml
  text: Better were those slain by the sword than those slain by hunger[a], who waste away, pierced through for lack of the produce of the field.
translation:
  language: pt
  text: Melhor sorte tiveram os mortos pela espada do que os mortos pela fome[a], que definham, traspassados, por falta do que o campo produz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que definham, traspassados, porque não há produção no campo”. O hebraico desta oração é difícil, sobretudo o verbo traduzido por “definham” e o sentido da preposição na expressão “por falta do que o campo produz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבִים הָיוּ
  choice: Melhor sorte tiveram
  rationale: Expressa a comparação de condição, não bondade moral, e mantém um tom digno e natural em português.
- source_word: חַלְלֵי חֶרֶב
  choice: os mortos pela espada
  rationale: חָלָל designa normalmente quem foi morto; a construção indica a espada como instrumento.
- source_word: מֵחַלְלֵי רָעָב
  choice: do que os mortos pela fome
  rationale: O מ inicial marca comparação, e 'fome' comunica tanto a experiência da inanição quanto o contexto de escassez.
- source_word: שֶׁהֵם
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que descreve os mortos pela fome.
- source_word: יָזוּבוּ
  choice: definham
  rationale: O verbo é difícil, mas neste contexto sugere consumir-se ou esvair-se progressivamente; 'definham' comunica a morte lenta por inanição.
- source_word: מְדֻקָּרִים
  choice: como que traspassados
  rationale: Preserva a imagem vívida de דקר sem afirmar de modo indevido que essas vítimas foram literalmente perfuradas por uma arma.
- source_word: מִתְּנוּבֹת שָׂדָי
  choice: por falta do que o campo produz
  rationale: Interpreta מ em sentido privativo ou causal, adequado ao contexto, e verte a expressão agrícola de modo claro e corrente.
