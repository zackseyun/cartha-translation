  text: ר֤וּחַ אַפֵּ֨י/נוּ֙ מְשִׁ֣יחַ יְהוָ֔ה נִלְכַּ֖ד בִּ/שְׁחִיתוֹתָ֑/ם אֲשֶׁ֣ר אָמַ֔רְנוּ בְּ/צִלּ֖/וֹ נִֽחְיֶ֥ה בַ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/020.yaml
  text: The breath of our nostrils[a], Yahweh’s anointed, was captured in their pits—he of whom we said, “Under his shadow we will live among the nations.”
translation:
  language: pt
  text: 'O fôlego de nossas narinas, o ungido de Yahweh, foi capturado nas covas deles[a] — aquele de quem dizíamos: “À sua sombra viveremos entre as nações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em suas armadilhas” ou “em seus laços”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֤וּחַ
  choice: sopro
  rationale: No idioma “sopro de nossas narinas”, designa o fôlego vital; “sopro” preserva a imagem concreta e a força da dependência do povo em relação ao rei.
- source_word: אַפֵּינוּ
  choice: nossas narinas
  rationale: Mantém a expressão corporal hebraica, em vez de reduzi-la à paráfrase “nossa própria vida”.
- source_word: מְשִׁיחַ יְהוָה
  choice: o ungido de Yahweh
  rationale: Traduz o título régio literalmente e, no contexto, aponta para o rei davídico, sem converter o verso numa referência direta ao Messias escatológico.
- source_word: נִלְכַּד
  choice: foi capturado
  rationale: O nifal indica que ele foi apanhado ou capturado; a escolha se ajusta ao contexto político e militar.
- source_word: בִּשְׁחִיתוֹתָם
  choice: nas armadilhas deles
  rationale: O substantivo pode indicar covas ou dispositivos de captura e destruição. “Armadilhas” comunica naturalmente a ideia de aprisionamento sem eliminar a imagem alternativa de covas, registrada em nota.
- source_word: אֲשֶׁר אָמַרְנוּ
  choice: aquele de quem dizíamos
  rationale: Retoma claramente “o ungido de Yahweh”; o imperfeito português “dizíamos” expressa uma expectativa sustentada antes da captura.
- source_word: בְּצִלּוֹ
  choice: à sua sombra
  rationale: Preserva a metáfora hebraica de abrigo e proteção política, sem substituí-la por uma explicação.
- source_word: נִחְיֶה
  choice: viveremos
  rationale: Traduz diretamente o verbo “viver”; a nuance de sobrevivência permanece implícita no contexto.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Refere-se às nações estrangeiras em geral; evita a conotação especificamente neotestamentária que “gentios” pode assumir.
theological_decisions:
- issue: Se מְשִׁיחַ יְהוָה deve ser vertido de modo a sugerir diretamente o Messias ou Cristo escatológico
  choice: “o ungido de Yahweh”, referindo-se no contexto ao rei histórico de Judá
  alternative: “o Messias de Yahweh”
  rationale: Embora o termo pertença à mesma família lexical de “Messias”, o contexto imediato trata da captura do rei davídico. A tradução mantém o título teológico régio sem transformar o verso em predição messiânica direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva as metáforas hebraicas de fôlego vital e sombra protetora. O nome divino é apresentado como “Yahweh”, em consonância com a camada inglesa fornecida. O marcador [a] aparece no texto principal e corresponde à nota lexical.
