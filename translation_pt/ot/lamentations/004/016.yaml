id: LAM.4.16
reference: Lamentations 4:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: פְּנֵ֤י יְהוָה֙ חִלְּקָ֔/ם לֹ֥א יוֹסִ֖יף לְ/הַבִּיטָ֑/ם פְּנֵ֤י כֹהֲנִים֙ לֹ֣א נָשָׂ֔אוּ זקנים לֹ֥א חָנָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/016.yaml
  text: The face of Yahweh has scattered them[a]; he will no longer look on them. They showed no regard for priests[c][b]; they showed no favor to elders.
translation:
  language: pt
  text: A face de Yahweh os dispersou[a]; ele não voltará a olhar para eles. Não demonstraram consideração pelos sacerdotes[b] nem favoreceram os anciãos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «A presença de Yahweh os dividiu/dispersou».'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «Não levantaram a face dos sacerdotes», expressão idiomática que significa não lhes mostrar consideração ou favor.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «nem tiveram misericórdia dos anciãos».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  choice: A face de Yahweh
  rationale: Mantém a imagem antropomórfica concreta do hebraico e o nome divino, sem reduzir a expressão apenas a «presença».
- source_word: חִלְּקָם
  choice: os dispersou
  rationale: O piel de חלק pode significar dividir, distribuir ou dispersar; no contexto de juízo e desterro, «dispersou» comunica melhor o efeito pretendido.
- source_word: לֹא יוֹסִיף לְהַבִּיטָם
  choice: ele não voltará a olhar para eles
  rationale: A construção יסף + infinitivo, negada, indica que a ação não se repetirá; «olhar para» preserva o sentido básico de נבט sem explicitar indevidamente se se trata de atenção, cuidado ou favor.
- source_word: פְּנֵי כֹהֲנִים לֹא נָשָׂאוּ
  choice: Não demonstraram consideração pelos sacerdotes
  rationale: Traduz idiomaticamente a expressão literal «não levantaram a face dos sacerdotes», que indica não mostrar consideração, respeito ou favor.
- source_word: זקנים
  choice: anciãos
  rationale: No paralelismo com «sacerdotes», provavelmente designa líderes ou membros idosos respeitados da comunidade, embora também possa referir-se simplesmente aos mais velhos.
- source_word: לֹא חָנָנוּ
  choice: nem favoreceram
  rationale: חנן abrange mostrar favor, graça ou misericórdia. «Favoreceram» preserva a amplitude lexical e o paralelismo, enquanto a nota registra a leitura mais forte «tiveram misericórdia».
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Conservar «A face de Yahweh»
  alternative: «A presença de Yahweh» ou «O próprio Yahweh»
  rationale: O hebraico emprega uma imagem corporal vívida. Mantê-la preserva a força poética sem afirmar que Deus possua corpo físico.
- issue: Referente do sujeito nas duas últimas orações
  choice: Manter o sujeito humano indeterminado em «Não demonstraram... nem favoreceram...»
  alternative: Explicitar «os inimigos» ou fazer de Yahweh o sujeito
  rationale: As formas verbais estão no plural e o hebraico não identifica expressamente o grupo; inserir um referente resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. Conserva-se «Yahweh» como nome pessoal e «face» como imagem poética; as expressões sociais são vertidas de modo idiomático. A coordenação com «nem» reproduz com naturalidade o paralelismo negativo.
