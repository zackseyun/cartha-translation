revisions:
- from: Vagueavam cegos pelas ruas, contaminados de sangue[b], sem que pudessem tocar em suas roupas.[a]
  to: Vagueavam cegos pelas ruas, maculados de sangue[b], sem que se pudesse tocar em suas roupas.[a]
  rationale: A revisão conserva as escolhas lexicais centrais e a cadência poética do rascunho, mas substitui a atribuição explícita do sujeito de “tocar” por uma construção impessoal. Assim, o texto português não decide uma ambiguidade sintática do hebraico, enquanto a nota apresenta de modo transparente as duas principais possibilidades. “Maculados” melhora a naturalidade e preserva a conotação de impureza.
