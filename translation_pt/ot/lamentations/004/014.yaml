base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/014.yaml
  text: They wandered blind through the streets[a], defiled with blood[b], so that they could not touch their garments.
translation:
  language: pt
  text: Vagueavam cegos pelas ruas, maculados de sangue[b], sem que se pudesse tocar em suas roupas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vagueavam como cegos pelas ruas, maculados de sangue, sem que pudessem tocar em suas roupas” ou “de modo que ninguém podia tocar nas roupas deles”. O hebraico é condensado, e o sujeito de “tocar” não está explícito.'
    reason: alternative_reading
  - marker: b
    text: “Maculados de sangue” provavelmente expressa impureza, e não apenas o fato de estarem fisicamente manchados de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָעוּ
  choice: vagueavam
  rationale: O verbo נוע descreve movimento instável, errante ou sem direção. “Vagueavam” é natural no contexto do lamento e conserva a ideia de desorientação.
- source_word: עִוְרִים
  choice: cegos
  rationale: O hebraico diz literalmente “cegos” ou “pessoas cegas”, sem partícula comparativa. A construção predicativa “vagueavam cegos” preserva essa forma comprimida sem acrescentar explicitamente “como”.
- source_word: בַּחוּצוֹת
  choice: pelas ruas
  rationale: חוּצוֹת designa as ruas ou os espaços abertos da cidade. “Pelas ruas” combina naturalmente com o verbo de movimento.
- source_word: נְגֹאֲלוּ
  choice: contaminados
  rationale: O nifal de גאל, neste contexto, comunica poluição ou impureza, e não apenas uma mancha visível. “Contaminados” mantém essa dimensão.
- source_word: בַּדָּם
  choice: de sangue
  rationale: A preposição indica aquilo por meio do qual ocorre a contaminação. A expressão portuguesa “contaminados de sangue” é concisa e poética.
- source_word: בְּלֹא יֽוּכְלוּ יִגְּעוּ
  choice: sem que pudessem tocar
  rationale: A construção hebraica é condensada e admite incerteza quanto ao sujeito de “tocar”. A tradução principal acompanha a leitura em que o sujeito continua sendo o grupo mencionado, enquanto a nota registra a leitura impessoal.
- source_word: בִּלְבֻשֵׁיהֶם
  choice: em suas roupas
  rationale: O substantivo significa vestes ou roupas. “Roupas” é claro e atual; o possessivo preserva a referência plural do hebraico.
theological_decisions:
- issue: Impureza associada ao sangue
  choice: contaminados de sangue
  alternative: manchados de sangue
  rationale: A opção escolhida preserva a linguagem de impureza presente no verbo hebraico, sem restringir o sentido a manchas físicas nem impor uma explicação ritual específica.
- issue: Sujeito de “tocar”
  choice: sem que pudessem tocar em suas roupas
  alternative: de modo que ninguém podia tocar nas roupas deles
  rationale: A sintaxe hebraica é difícil. O texto principal mantém a continuidade mais imediata do sujeito, mas a nota conserva a leitura alternativa segundo a qual outras pessoas não podiam tocar nas roupas dos contaminados.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. “Vagueavam cegos” mantém a concisão e a ausência de uma comparação explícita no hebraico; “roupas” favorece compreensão ampla sem perder solenidade.
