source:
  edition: WLC
  text: גַּם תנין חָ֣לְצוּ שַׁ֔ד הֵינִ֖יקוּ גּוּרֵי/הֶ֑ן בַּת עַמִּ֣/י לְ/אַכְזָ֔ר כי ענים בַּ/מִּדְבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/003.yaml
  text: Even jackals offer the breast[a]; they nurse their young. The daughter of my people has become cruel[b], like ostriches in the wilderness.
translation:
  language: pt
  text: Até os chacais[a] oferecem o peito e amamentam suas crias; a filha do meu povo tornou-se cruel, como os avestruzes[b] no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “monstros marinhos” ou “dragões”. Aqui, “chacais” é preferível porque o versículo descreve animais amamentando suas crias, o que se ajusta melhor à comparação neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “corujas no deserto”. Tradicionalmente, o hebraico é entendido como “avestruzes”, sobretudo à luz de Jó 39:13–17.
    reason: lexical_alternative
lexical_decisions:
- source_word: תנין
  choice: chacais
  rationale: Neste contexto, o termo designa melhor chacais, animais terrestres que amamentam suas crias. Outras acepções do vocábulo não se ajustam tão naturalmente à imagem materna.
- source_word: חָלְצוּ שַׁד
  choice: oferecem o peito
  rationale: A expressão descreve o ato de expor ou apresentar o peito para amamentar. Esta formulação é natural em português e preserva a imagem concreta.
- source_word: הֵינִיקוּ
  choice: amamentam
  rationale: O hifil de ינק indica fazer a cria mamar; “amamentam” comunica essa ação materna de modo claro e atual.
- source_word: גּוּרֵיהֶן
  choice: suas crias
  rationale: O substantivo se refere aos filhotes de animais. “Crias” é conciso e não especifica além do que o texto exige.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: Mantém a personificação poética e profética da comunidade, sem substituí-la por uma paráfrase interpretativa.
- source_word: לְאַכְזָר
  choice: tornou-se cruel
  rationale: A construção expressa um estado resultante e sugere a transformação provocada pela calamidade.
- source_word: כִּי עֲנִים
  choice: como os avestruzes
  rationale: A leitura tradicional e o paralelo temático de Jó 39:13–17 favorecem os avestruzes, retratados como pouco cuidadosos com os filhotes.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: No contexto dos avestruzes e da desolação, “deserto” é uma tradução natural e concreta de מִדְבָּר.
theological_decisions: []
