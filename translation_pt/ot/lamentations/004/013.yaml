  terminology: «Profetas», «sacerdotes», «iniquidades», «sangue» e «justos» são escolhas consistentes, dignas e semanticamente apropriadas. A nota de «inocentes» registra uma alternativa legítima sem substituí-la pela leitura principal. A nota sobre «verteram» explica com precisão a alternativa idiomática para «derramaram».
