  source_fidelity: A tradução preserva adequadamente a relação causal de מֵחַטֹּאת, a distinção lexical entre «pecados» e «iniquidades», a referência possessiva à cidade e a imagem de derramar sangue «no meio dela». «Justos» corresponde bem a צַדִּיקִים e não reduz indevidamente o termo a mera inocência judicial. A oração relativa mantém, sem resolver de modo doutrinário ou excessivamente rígido, a relação do particípio plural com os líderes mencionados.
