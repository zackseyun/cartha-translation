id: LAM.4.13
reference: Lamentations 4:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מֵֽ/חַטֹּ֣את נְבִיאֶ֔י/הָ עֲוֺנ֖וֹת כֹּהֲנֶ֑י/הָ הַ/שֹּׁפְכִ֥ים בְּ/קִרְבָּ֖/הּ דַּ֥ם צַדִּיקִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/013.yaml
  text: Because of the sins of her prophets[a], the iniquities of her priests, who poured out in her midst the blood of the righteous[b],
translation:
  language: pt
  text: Por causa dos pecados de seus profetas e das iniquidades de seus sacerdotes, que derramaram[a] no meio dela o sangue dos justos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «verteram». O verbo hebraico descreve literalmente o ato de derramar; no contexto de sangue, «verter» é uma expressão idiomática possível.
    reason: lexical_alternative
  - marker: b
    text: Ou «inocentes». O hebraico צַדִּיקִים significa mais literalmente «os justos».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחַטֹּאת
  choice: Por causa dos pecados de
  rationale: A preposição מִן pode indicar causa ou origem. Aqui, o contexto apresenta a razão da calamidade de Jerusalém; por isso, «por causa de» transmite naturalmente a força causal.
- source_word: נְבִיאֶיהָ
  choice: seus profetas
  rationale: O sufixo feminino singular remete à cidade personificada; «seus profetas» preserva essa relação possessiva.
- source_word: עֲוֺנוֹת
  choice: as iniquidades de
  rationale: עָוֹן pode expressar perversidade, culpa ou iniquidade. «Iniquidades» mantém o peso moral do termo e o distingue de חַטֹּאת, traduzido como «pecados».
- source_word: כֹּהֲנֶיהָ
  choice: seus sacerdotes
  rationale: Tradução direta de כֹּהֵן com o sufixo feminino singular referente à cidade.
- source_word: הַשֹּׁפְכִים
  choice: que derramaram
  rationale: O particípio plural identifica os responsáveis pelo sangue derramado. A oração relativa é natural em português, e «derramaram» conserva a imagem concreta de שפך.
- source_word: בְּקִרְבָּהּ
  choice: no meio dela
  rationale: Preserva a ideia de que o derramamento de sangue ocorreu dentro da própria cidade personificada.
- source_word: דַּם
  choice: o sangue dos
  rationale: Tradução direta do objeto de הַשֹּׁפְכִים, em construção natural com o grupo seguinte.
- source_word: צַדִּיקִים
  choice: justos
  rationale: O adjetivo substantivado designa os que são justos. «Justos» preserva a categoria moral e teológica sem reduzi-la apenas à inocência judicial.
theological_decisions:
- issue: Se צַדִּיקִים deve ser entendido como categoria moral ou apenas como inocência judicial
  choice: justos
  alternative: inocentes
  rationale: O hebraico pode destacar pessoas justas e, no contexto do sangue derramado, também sugere vítimas inocentes. «Justos» conserva o sentido moral mais amplo e deixa a alternativa contextual em nota.
- issue: A quem se refere o particípio plural הַשֹּׁפְכִים
  choice: aos profetas e aos sacerdotes mencionados em conjunto
  alternative: somente aos sacerdotes, o antecedente mais próximo
  rationale: A forma plural pode retomar os dois grupos de líderes, e a estrutura poética atribui a calamidade aos pecados dos profetas e às iniquidades dos sacerdotes. A tradução mantém a relativa após ambos sem inserir uma delimitação ausente do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação com «e» torna natural em português a sequência assindética do hebraico, sem alterar a relação causal. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
