review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a comparação, os perseguidores, as águias, os montes e o deserto. Contudo, os dois verbos hebraicos finais estão em forma perfectiva e são mais bem representados aqui por pretérito perfeito. Além disso, אָרְבוּ לָנוּ descreve pôr-se à espreita/ficar de emboscada, não necessariamente realizar emboscadas.
  naturalness: O texto é claro e de registro bíblico moderno. “Mais velozes do que” é ligeiramente mais cuidado e internacional do que “mais velozes que”. “Ficaram à nossa espreita” é idiomático e reproduz com precisão a imagem estratégica do hebraico.
  terminology: “Perseguidores”, “águias dos céus”, “montes” e “deserto” são escolhas adequadas. A nota sobre נֶשֶׁר preserva de modo apropriado a alternativa lexical “abutre”.
  issues:
  - severity: medium
    issue: “perseguiam-nos” traduz o verbo דְּלָקֻנוּ no imperfeito.
    rationale: No paralelismo narrativo do versículo, a forma hebraica é perfectiva; “perseguiram-nos” conserva melhor a apresentação das ações como realizadas.
  - severity: medium
    issue: “armavam emboscadas contra nós” pode sugerir repetidas emboscadas efetivamente preparadas ou realizadas.
    rationale: אָרְבוּ לָנוּ significa mais diretamente “ficaram à espreita de nós/para nós”, isto é, puseram-se em posição de emboscada. A revisão preserva essa nuance sem acrescentar que as emboscadas ocorreram.
  revised_text: Nossos perseguidores eram mais velozes do que as águias dos céus[a]; sobre os montes, perseguiram-nos; no deserto, ficaram à nossa espreita.
  revised_footnotes:
