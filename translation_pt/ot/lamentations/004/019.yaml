  text: קַלִּ֤ים הָיוּ֙ רֹדְפֵ֔י/נוּ מִ/נִּשְׁרֵ֖י שָׁמָ֑יִם עַל הֶ/הָרִ֣ים דְּלָקֻ֔/נוּ בַּ/מִּדְבָּ֖ר אָ֥רְבוּ לָֽ/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/019.yaml
  text: Our pursuers were swifter than the eagles of the heavens[a]; on the mountains they pursued us; in the wilderness they lay in wait for us.
translation:
  language: pt
  text: Nossos perseguidores eram mais velozes do que as águias dos céus[a]; sobre os montes, perseguiram-nos; no deserto, ficaram à nossa espreita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que as águias do céu”; o termo hebraico נֶשֶׁר também pode designar um abutre em alguns contextos.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלִּים
  choice: mais velozes
  rationale: O contexto com מִן exige sentido comparativo; “mais velozes” é natural em português e preserva a força poética.
- source_word: רֹדְפֵינוּ
  choice: nossos perseguidores
  rationale: Traduz diretamente o particípio substantivado de רדף, mantendo a imagem concreta de perseguição sem ampliar o sentido para perseguição religiosa ou ideológica.
- source_word: מִנִּשְׁרֵי שָׁמָיִם
  choice: que as águias dos céus
  rationale: “Águias” expressa a imagem tradicional de rapidez; “dos céus” reproduz de perto o genitivo hebraico e conserva o registro poético. A possível referência a abutres é registrada em nota.
- source_word: עַל הֶהָרִים
  choice: sobre os montes
  rationale: Expressão locativa clara e poética; “montes” é corrente no registro bíblico sem ser arcaico.
- source_word: דְּלָקֻנוּ
  choice: perseguiam-nos
  rationale: דלק indica perseguir com intensidade. A repetição de “perseguir” é aceitável no paralelismo e evita uma expressão excessivamente interpretativa como “caçavam-nos”.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é a forma mais corrente e compreensível em português bíblico para מִדְבָּר, podendo abranger região erma ou estepe, e não apenas terreno arenoso.
- source_word: אָרְבוּ לָנוּ
  choice: armavam emboscadas contra nós
  rationale: Comunica a ação contínua ou reiterada de ficar à espreita para atacar, de maneira natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação poética. Mantém o paralelismo das três orações e a imagem de uma perseguição implacável. O pronome enclítico em “perseguiam-nos” é formal, mas ainda natural na leitura bíblica internacional.
