base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/005.yaml
  text: Those who used to eat delicacies are desolate in the streets[a]; those who were brought up on scarlet embrace ash heaps.
translation:
  language: pt
  text: Os que comiam iguarias estão desolados nas ruas; os que foram criados sobre tecidos escarlates abraçam montes de cinzas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “montes de lixo” ou “monturos”; o termo hebraico se refere a lugares onde se acumulavam resíduos e transmite extrema humilhação.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹכְלִים לְמַעֲדַנִּים
  choice: os que comiam iguarias
  rationale: O particípio substantivado descreve os que habitualmente desfrutavam alimentos requintados. O pretérito imperfeito expressa naturalmente em português esse antigo costume, agora perdido.
- source_word: נָשַׁמּוּ
  choice: definham
  rationale: No contexto, o verbo retrata o estado devastado e miserável dessas pessoas. “Definham” produz uma frase natural e preserva o quadro de ruína, embora o termo também possa significar que ficaram desoladas ou estarrecidas.
- source_word: בַּחוּצוֹת
  choice: pelas ruas
  rationale: O substantivo indica os espaços públicos da cidade; “pelas ruas” comunica exposição e abandono com naturalidade.
- source_word: הָאֱמֻנִים
  choice: os que foram criados
  rationale: O particípio passivo de אמן se refere a pessoas cuidadas e educadas desde pequenas, não a pessoas moralmente fiéis.
- source_word: עֲלֵי תוֹלָע
  choice: sobre tecidos escarlates
  rationale: תולע designa por metonímia o tecido escarlate tingido com corante obtido do inseto. A explicitação de “tecidos” evita a expressão pouco clara “sobre escarlate” e conserva a imagem de uma criação luxuosa.
- source_word: חִבְּקוּ
  choice: abraçam
  rationale: A tradução concreta e literal ressalta a inversão chocante entre o luxo de antes e a miséria presente.
- source_word: אַשְׁפַּתּוֹת
  choice: montes de lixo
  rationale: O termo designa depósitos de resíduos e pode incluir cinzas ou esterco. “Montes de lixo” é claro, atual e mantém a imagem de degradação extrema.
