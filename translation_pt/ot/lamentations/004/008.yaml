  text: חָשַׁ֤ךְ מִ/שְּׁחוֹר֙ תָּֽאֳרָ֔/ם לֹ֥א נִכְּר֖וּ בַּ/חוּצ֑וֹת צָפַ֤ד עוֹרָ/ם֙ עַל עַצְמָ֔/ם יָבֵ֖שׁ הָיָ֥ה כָ/עֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/008.yaml
  text: Their appearance is darker than soot[a]; they are not recognized in the streets. Their skin has shriveled on their bones[b]; it has become dry like wood.
translation:
  language: pt
  text: Sua aparência ficou mais escura que a fuligem[a]; eles não são reconhecidos nas ruas. Sua pele se contraiu sobre os ossos[b]; ficou seca como madeira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais escura que a própria escuridão”. O termo hebraico pode indicar a cor negra em geral; “fuligem” expressa a imagem de modo concreto.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua pele ficou agarrada aos ossos”. O verbo hebraico pode descrever a pele retraída e apertada sobre os ossos.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁךְ מִשְּׁחוֹר תָּאֳרָם
  choice: Sua aparência ficou mais escura que a fuligem
  rationale: O perfeito de חשׁך descreve a mudança que resultou no estado presente, enquanto o מִן comparativo introduz o padrão de comparação. “Fuligem” concretiza a possível referência de שׁחור e mantém a alternativa mais geral em nota.
- source_word: לֹא נִכְּרוּ
  choice: eles não são reconhecidos
  rationale: O nifal de נכר é vertido passivamente, preservando a ideia de que a transformação física os tornou irreconhecíveis.
- source_word: בַּחוּצוֹת
  choice: nas ruas
  rationale: חוּצוֹת designa as ruas ou espaços públicos da cidade; “ruas” é claro e natural em português atual.
- source_word: צָפַד עוֹרָם עַל עַצְמָם
  choice: Sua pele se contraiu sobre os ossos
  rationale: צָפַד descreve a pele ressequida que se retrai e fica apertada sobre os ossos. A formulação preserva a imagem física sem decidir além do que o verbo permite.
- source_word: יָבֵשׁ הָיָה כָעֵץ
  choice: ficou seca como madeira
  rationale: A construção expressa o estado resultante de ressecamento; עֵץ é entendido aqui como “madeira”, imagem de secura e rigidez, em vez de “árvore”.
