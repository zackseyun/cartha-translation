  to: Nem os reis da terra nem os habitantes do mundo acreditavam que um adversário e um inimigo entrariam pelos portões de Jerusalém.
  rationale: A revisão limita-se à construção coordenada da negação, para obter português moderno e natural. Mantêm-se o aspecto de incredulidade passado em «acreditavam», o par lexical distinto «adversário e inimigo» e a noção de ingresso pelos portões. A expressão plural genérica «os habitantes do mundo», sob «nem», preserva o valor universal de וְכָל.
