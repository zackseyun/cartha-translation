source:
  edition: WLC
  text: לֹ֤א הֶאֱמִ֨ינוּ֙ מַלְכֵי אֶ֔רֶץ ו/כל יֹשְׁבֵ֣י תֵבֵ֑ל כִּ֤י יָבֹא֙ צַ֣ר וְ/אוֹיֵ֔ב בְּ/שַׁעֲרֵ֖י יְרוּשָׁלִָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/012.yaml
  text: The kings of the earth did not believe[a], nor did any of the inhabitants of the world, that an adversary and an enemy would enter the gates of Jerusalem.
translation:
  language: pt
  text: Nem os reis da terra nem os habitantes do mundo acreditavam que um adversário e um inimigo entrariam pelos portões de Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ
  choice: não acreditavam
  rationale: O hifil de אמן expressa aqui considerar algo verdadeiro ou crível. O imperfeito em português se ajusta naturalmente à incredulidade vigente antes do acontecimento narrado.
- source_word: מַלְכֵי אֶרֶץ
  choice: os reis da terra
  rationale: Em paralelo com 'habitantes do mundo', אֶרֶץ tem alcance universal, e a formulação mantém o registro elevado do hebraico.
- source_word: וְכָל יֹשְׁבֵי תֵבֵל
  choice: nem nenhum dos habitantes do mundo
  rationale: Sob o alcance da negação precedente, a coordenação hebraica significa que nenhum dos habitantes acreditava; esta construção preserva a ênfase totalizante e soa natural em português.
- source_word: כִּי
  choice: que
  rationale: A conjunção introduz o conteúdo daquilo em que não acreditavam, não uma explicação causal.
- source_word: יָבֹא
  choice: entrariam
  rationale: O verbo significa literalmente 'viriam', mas, com a expressão relativa aos portões, descreve ingresso. O futuro do pretérito representa a ocorrência esperada a partir do ponto de vista passado sem acrescentar explicitamente a ideia de mera possibilidade.
- source_word: צַר
  choice: um adversário
  rationale: Preserva o valor próprio de צַר e o distingue do termo seguinte para 'inimigo'.
- source_word: וְאוֹיֵב
  choice: e um inimigo
  rationale: Mantém a coordenação e o par enfático de substantivos distintos no hebraico.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: pelos portões de Jerusalém
  rationale: Depois de um verbo de movimento, בְּ com 'portões' indica a via ou o ponto de ingresso. 'Entrar pelos portões' é claro e idiomático em português.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados sem sacrificar a naturalidade. Não foi necessária nota: ''entrariam pelos portões'' explicita de modo transparente o sentido contextual de יָבֹא com בְּשַׁעֲרֵי.'
