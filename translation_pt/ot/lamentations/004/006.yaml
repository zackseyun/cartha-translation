  text: וַ/יִּגְדַּל֙ עֲוֺ֣ן בַּת עַמִּ֔/י מֵֽ/חַטַּ֖את סְדֹ֑ם הַֽ/הֲפוּכָ֣ה כְמוֹ רָ֔גַע וְ/לֹא חָ֥לוּ בָ֖/הּ יָדָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/006.yaml
  text: For the iniquity of the daughter of my people has grown greater than the sin of Sodom[a], which was overthrown in a moment[b], though no hands labored against her.
translation:
  language: pt
  text: Pois a iniquidade da filha do meu povo tornou-se maior que o pecado de Sodoma[a], que foi destruída num instante[b], sem que mãos se empenhassem contra ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a culpa da filha do meu povo tornou-se maior que a culpa de Sodoma». A palavra hebraica traduzida por «iniquidade» também pode indicar culpa ou sua punição.'
    reason: lexical_alternative
  - marker: b
    text: 'A cláusula final é de difícil interpretação no hebraico. Outras possibilidades: «e não se torceram mãos por ela» ou «e nenhuma mão veio sobre ela».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: tornou-se maior
  rationale: O verbo גדל expressa tornar-se ou crescer em grandeza; no contexto comparativo, «tornou-se maior» preserva seu valor verbal e soa natural em português.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: עָוֹן pode indicar iniquidade, culpa ou a punição decorrente dela. A comparação imediata com o «pecado de Sodoma» favorece aqui o sentido moral, sem excluir a nuance de culpa.
- source_word: בַּת עַמִּי
  choice: a filha do meu povo
  rationale: Mantém a personificação convencional de Jerusalém/Judá e o tom poético do lamento, sem explicitar no texto algo que o hebraico deixa implícito.
- source_word: מֵחַטַּאת סְדֹם
  choice: maior que o pecado de Sodoma
  rationale: A preposição מִן assinala comparação. חַטָּאת, neste contexto, designa o pecado, embora «culpa» também seja lexicalmente possível.
- source_word: הַהֲפוּכָה
  choice: que foi subvertida
  rationale: A forma passiva remete à destruição de Sodoma em Gênesis. «Subvertida» conserva a ideia de ser virada ou derrubada e o eco intertextual.
- source_word: כְמוֹ רָגַע
  choice: num instante
  rationale: A expressão comunica a rapidez repentina da queda; «num instante» é conciso, idiomático e fiel ao valor temporal.
- source_word: וְלֹא חָלוּ בָהּ יָדָיִם
  choice: sem que mãos se empenhassem contra ela
  rationale: A cláusula é obscura. Esta tradução retém a imagem das mãos e expressa a leitura provável de que Sodoma caiu sem uma ação humana prolongada, evitando apresentar essa interpretação como plenamente certa.
theological_decisions:
- issue: Sentido de עָוֹן na comparação com Sodoma
  choice: iniquidade moral, com possível nuance de culpa
  alternative: punição pela iniquidade
  rationale: Embora עָוֹן possa abranger a consequência punitiva do pecado, a comparação com חַטָּאת, «pecado», favorece uma comparação moral. A nota preserva a alternativa lexical sem resolver indevidamente a tensão.
- issue: Interpretação da cláusula final
  choice: Sodoma foi destruída de repente, sem esforço humano prolongado contra ela
  alternative: não se torceram mãos por ela; ou nenhuma mão veio sobre ela
  rationale: O hebraico é comprimido e de interpretação incerta. O texto principal apresenta a leitura contextual provável, enquanto a nota registra alternativas importantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preserva-se a metáfora «filha do meu povo» e a ambiguidade da cláusula final é sinalizada em nota.
