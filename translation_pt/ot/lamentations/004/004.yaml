- from: A língua do bebê de peito gruda ao céu da boca de tanta sede; as crianças pedem pão, mas ninguém o reparte com elas.[a]
  to: A língua do bebê que mama fica presa ao céu da boca por causa da sede; as crianças pequenas pedem pão, mas não há ninguém que lhes reparta pão.[a]
