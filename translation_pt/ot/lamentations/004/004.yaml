review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o quadro de sede e fome. Contudo, “de tanta sede” explicita uma intensidade que o hebraico não formula, e “reparte com elas” é menos direto do que a construção hebraica, que indica não haver quem parta/distribua pão para elas.
  naturalness: “Gruda” é compreensível, mas tem registro coloquial para o tom poético e lamentoso do livro. “Fica presa” é natural, vívido e mais sóbrio. “Bebê que mama” é mais amplamente compreensível no português internacional do que “bebê de peito”.
  terminology: “Céu da boca”, “pão” e “crianças pequenas” comunicam bem os referentes hebraicos. A nota deve preservar a elipse de “não há para elas quem parta [pão]” e apresentar “partir” e “distribuir” como possibilidades contextuais.
  issues:
  - severity: medium
    issue: “De tanta sede” acrescenta intensidade explícita.
    rationale: בַּצָּמָא significa “por causa da sede”/“de sede”; embora a situação seja extrema no contexto, “tanta” não está expresso neste versículo.
  - severity: low
    issue: “Gruda” é coloquial para o registro do lamento.
    rationale: O verbo דבק descreve aderência; “fica presa” preserva a imagem física com tom mais digno e literário.
  - severity: low
    issue: “Bebê de peito” tem alcance internacional mais limitado.
    rationale: “Bebê que mama” mantém precisamente o sentido de יוֹנֵק e é mais transparente no português moderno amplo.
  - severity: low
    issue: “Reparte com elas” pode sugerir partilha conjunta.
    rationale: A construção hebraica indica que não há quem parta ou distribua pão para as crianças; “lhes reparta pão” explicita melhor a relação.
  revised_text: A língua do bebê que mama fica presa ao céu da boca por causa da sede; as crianças pequenas pedem pão, mas não há ninguém que lhes reparta pão.[a]
