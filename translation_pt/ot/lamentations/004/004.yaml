base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/004.yaml
  text: The tongue of the nursing infant sticks to the roof of his mouth because of thirst[a]; children ask for bread[b], but no one breaks it for them.
translation:
  language: pt
  text: A língua do bebê que mama fica presa ao céu da boca por causa da sede; as crianças pequenas pedem pão, mas não há ninguém que lhes reparta pão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não há para elas quem parta [pão]”. O verbo pode referir-se a partir ou distribuir o pão.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבַק
  choice: gruda
  rationale: Expressa de modo natural e vívido a ideia de aderir firmemente, adequada ao efeito físico da sede extrema.
- source_word: לְשׁוֹן
  choice: língua
  rationale: Mantém a referência corporal direta do hebraico.
- source_word: יוֹנֵק
  choice: bebê de peito
  rationale: Designa com clareza uma criança que ainda mama e preserva a vulnerabilidade evocada no texto.
- source_word: אֶל חכּוֹ
  choice: ao céu da boca
  rationale: חֵךְ pode indicar o palato; “céu da boca” é preciso e amplamente compreensível em português.
- source_word: בַּצָּמָא
  choice: de tanta sede
  rationale: Comunica naturalmente a relação causal ou circunstancial da sede intensa sem alterar a imagem.
- source_word: עוֹלָלִים
  choice: as crianças
  rationale: Refere-se a crianças pequenas; a forma simples é clara, e o contexto já ressalta sua fragilidade.
- source_word: שָׁאֲלוּ
  choice: pedem
  rationale: Preserva o sentido básico de pedir sem intensificá-lo indevidamente como “implorar”.
- source_word: לֶחֶם
  choice: pão
  rationale: Conserva o substantivo concreto e a força da imagem de fome.
- source_word: פֹּרֵשׂ
  choice: reparte
  rationale: No contexto, o particípio descreve partir e distribuir pão; “reparte” transmite de modo conciso ambas as dimensões práticas.
- source_word: אֵין לָהֶם
  choice: ninguém ... com elas
  rationale: Transforma naturalmente a construção existencial hebraica em português, indicando que não há quem distribua pão às crianças.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com imagens concretas preservadas. “Bebê de peito” favorece compreensão internacional com boa legibilidade brasileira; “reparte com elas” evita a leitura menos natural de simplesmente quebrar o pão, sem ocultar a forma literal, registrada em nota.
