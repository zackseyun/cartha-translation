  text: צָד֣וּ צְעָדֵ֔י/נוּ מִ/לֶּ֖כֶת בִּ/רְחֹבֹתֵ֑י/נוּ קָרַ֥ב קִצֵּ֛י/נוּ מָלְא֥וּ יָמֵ֖י/נוּ כִּי בָ֥א קִצֵּֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/018.yaml
  text: They hunted our steps[a], so that we could not walk in our streets. Our end drew near; our days were fulfilled[c][b], for our end had come.
translation:
  language: pt
  text: Espreitavam os nossos passos[a], impedindo-nos de andar pelas nossas ruas. O nosso fim se aproximou; os nossos dias se completaram[b], pois o nosso fim chegou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Seguiam os nossos passos” ou “Ficavam à espreita dos nossos passos”. O verbo hebraico expressa perseguição hostil.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os nossos dias se encheram”, expressão hebraica que indica que o tempo concedido chegou ao fim.
    reason: cultural_note
lexical_decisions:
- source_word: צָדוּ
  choice: Caçaram
  rationale: O verbo expressa perseguição hostil, possivelmente a ideia de seguir ou ficar à espreita; “caçaram” preserva a força predatória da imagem.
- source_word: צְעָדֵינוּ
  choice: os nossos passos
  rationale: Mantém a imagem concreta do hebraico e comunica que todos os movimentos eram vigiados ou perseguidos.
- source_word: מִלֶּכֶת
  choice: impedindo-nos de andar
  rationale: A preposição com o infinitivo expressa impedimento. Esta formulação explicita naturalmente em português o resultado da perseguição.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: pelas nossas ruas
  rationale: O termo pode indicar ruas, praças ou espaços públicos largos; “ruas” é natural no contexto urbano, e “pelas” corresponde ao movimento de andar por elas.
- source_word: קָרַב
  choice: se aproximou
  rationale: Reproduz o sentido de chegar perto e conserva o avanço ominoso do fim.
- source_word: קִצֵּינוּ
  choice: o nosso fim
  rationale: Traduz diretamente קֵץ e preserva a repetição hebraica, deixando que o contexto comunique a ideia de ruína.
- source_word: מָלְאוּ יָמֵינוּ
  choice: os nossos dias se completaram
  rationale: A expressão literalmente diz que os dias “se encheram”, um idiomatismo para o esgotamento do tempo concedido. “Se completaram” transmite o sentido sem produzir uma expressão obscura em português.
- source_word: כִּי בָא קִצֵּינוּ
  choice: pois o nosso fim chegou
  rationale: כִּי apresenta a razão da declaração anterior; “pois” mantém essa relação e a repetição de “fim” reproduz a ênfase do original.
theological_decisions:
- issue: Sentido de קִצֵּינוּ no contexto de juízo e destruição
  choice: o nosso fim
  alternative: a nossa ruína
  rationale: “Fim” conserva a amplitude lexical e a repetição do hebraico sem restringir o termo à interpretação contextual de destruição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição poética do hebraico foram preservadas, enquanto o idiomatismo relativo aos dias foi expresso naturalmente.
