  text: אֵיכָה֙ יוּעַ֣ם זָהָ֔ב יִשְׁנֶ֖א הַ/כֶּ֣תֶם הַ/טּ֑וֹב תִּשְׁתַּפֵּ֨כְנָה֙ אַבְנֵי קֹ֔דֶשׁ בְּ/רֹ֖אשׁ כָּל חוּצֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/001.yaml
  text: How the gold has grown dim[b][a], how the fine gold has changed! The holy stones are poured out at the head of every street.
translation:
  language: pt
  text: Como o ouro perdeu o brilho, como o ouro fino mudou! As pedras sagradas[a] são derramadas à entrada de cada rua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras santas” ou “pedras do santuário”. A expressão hebraica pode indicar pedras consagradas do templo ou pedras preciosas sagradas usadas como imagem poética.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “na cabeça de cada rua”; a expressão pode indicar as entradas ou as esquinas das ruas.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיכָה
  choice: Como
  rationale: Introduz a exclamação de lamento de modo natural e digno, preservando a forma poética sem acrescentar uma interjeição ausente.
- source_word: יוּעַם זָהָב
  choice: o ouro perdeu o brilho
  rationale: Expressa o escurecimento ou ofuscamento do ouro em português corrente, sem restringir a imagem à corrosão física.
- source_word: יִשְׁנֶא הַכֶּתֶם הַטּוֹב
  choice: mudou o ouro fino
  rationale: Mantém o paralelismo e traduz o verbo em seu sentido amplo de mudar ou alterar-se; “ouro fino” distingue este termo do vocábulo mais geral para ouro.
- source_word: תִּשְׁתַּפֵּכְנָה
  choice: estão espalhadas
  rationale: Para pedras, comunica naturalmente o resultado visual da imagem hebraica de terem sido derramadas ou lançadas por toda parte.
- source_word: אַבְנֵי קֹדֶשׁ
  choice: as pedras sagradas
  rationale: Preserva a formulação poética e a ambiguidade entre pedras consagradas, pedras do santuário e possível linguagem figurada.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: à entrada de cada rua
  rationale: Transmite em português natural o provável valor espacial de “na cabeça de cada rua”, sem esconder em nota a imagem literalmente subjacente.
theological_decisions:
- issue: Referente de אַבְנֵי קֹדֶשׁ (“pedras sagradas”)
  choice: Manter a expressão sem identificar seu referente
  alternative: pedras do santuário; pedras preciosas consagradas; representação figurada do povo de Sião
  rationale: O hebraico é poeticamente ambíguo, e o contexto não exige que a tradução escolha entre os referentes possíveis.
translation_notes:
  register: Português moderno, claro e solene, com cadência de lamento. A repetição de “Como” conserva o paralelismo exclamativo; “ouro fino” e “pedras sagradas” mantêm a linguagem elevada sem recorrer a vocabulário arcaico.
