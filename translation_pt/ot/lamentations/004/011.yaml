source:
  edition: WLC
  text: כִּלָּ֤ה יְהוָה֙ אֶת חֲמָת֔/וֹ שָׁפַ֖ךְ חֲר֣וֹן אַפּ֑/וֹ וַ/יַּצֶּת אֵ֣שׁ בְּ/צִיּ֔וֹן וַ/תֹּ֖אכַל יְסוֹדֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/011.yaml
  text: Yahweh has exhausted his wrath[a]; he has poured out his burning anger. He kindled a fire in Zion[b], and it consumed her foundations.
translation:
  language: pt
  text: Yahweh esgotou a sua ira[a]; derramou o ardor da sua ira. Acendeu um fogo em Sião, e o fogo consumiu os alicerces dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levou a sua ira até o fim” ou “despendeu por completo a sua ira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּה
  choice: esgotou
  rationale: O verbo expressa levar algo até o fim ou consumi-lo por completo. “Esgotou” preserva a ideia de que a ira foi plenamente despendida, sem reduzir o sentido ao mais neutro “terminou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: חֲמָתוֹ
  choice: a sua ira
  rationale: חֵמָה denota ira ou furor; “ira” é claro, solene e apropriado ao contexto do juízo divino.
- source_word: שָׁפַךְ
  choice: derramou
  rationale: Mantém a imagem concreta do verbo hebraico e a metáfora tradicional do derramamento da indignação divina.
- source_word: חֲרוֹן אַפּוֹ
  choice: o ardor da sua indignação
  rationale: A expressão hebraica evoca o calor intenso da ira. “Ardor” conserva essa imagem, e “indignação” evita uma repetição pouco elegante sem apagar o paralelismo.
- source_word: וַיַּצֶּת אֵשׁ
  choice: Acendeu um fogo
  rationale: Reproduz de modo natural a ação de atear ou acender fogo e preserva a imagem verbal do hebraico.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: A preposição localiza o fogo em Sião; a tradução mantém o sentido normal de ב neste contexto.
- source_word: וַתֹּאכַל
  choice: que consumiu
  rationale: “Consumiu” é idiomático para a ação destrutiva do fogo. A oração relativa explicita naturalmente em português que o fogo é o sujeito.
- source_word: יְסוֹדֹתֶיהָ
  choice: os alicerces dela
  rationale: O sufixo feminino singular remete a Sião personificada. “Dela” preserva essa referência com clareza e evita a possível leitura de que “seus” se refira a Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Imagens paralelas do juízo divino
  choice: Manter “ira” e “ardor da sua indignação” como expressões paralelas distintas
  alternative: Fundir ambas numa única referência à ira
  rationale: O hebraico emprega duas expressões relacionadas, mas distintas, intensificando poeticamente a descrição do juízo. A tradução conserva tanto o paralelismo quanto a imagem de calor.
- issue: Alcance de כִּלָּה aplicado à ira
  choice: esgotou
  alternative: completou ou levou até o fim
  rationale: “Esgotou” comunica que a ira chegou à sua plena medida ou foi inteiramente despendida, sem decidir além do que permite a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se o nome Yahweh, a metáfora de derramar a indignação, a imagem do fogo e a personificação feminina de Sião. A pontuação mantém as duas linhas poéticas em progressão.
