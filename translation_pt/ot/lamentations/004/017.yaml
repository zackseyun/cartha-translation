  text: עוד/ינה תִּכְלֶ֣ינָה עֵינֵ֔י/נוּ אֶל עֶזְרָתֵ֖/נוּ הָ֑בֶל בְּ/צִפִּיָּתֵ֣/נוּ צִפִּ֔ינוּ אֶל גּ֖וֹי לֹ֥א יוֹשִֽׁעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/017.yaml
  text: Still our eyes failed[a], looking in vain for our help; in our watching we watched for a nation that could not save.
translation:
  language: pt
  text: Ainda se consumiam os nossos olhos, à espera de socorro — em vão. Em nossa vigília, esperávamos por uma nação que não podia salvar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma nação que não salvou”. A expressão hebraica pode indicar incapacidade de salvar ou o fato de que a nação esperada não trouxe salvação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶינָה
  choice: Ainda
  rationale: Expressa a continuidade da espera e do esgotamento, de modo natural em português.
- source_word: תִּכְלֶינָה עֵינֵינוּ
  choice: se consumiam os nossos olhos
  rationale: Preserva a imagem poética dos olhos que se esgotam devido à expectativa prolongada.
- source_word: אֶל־עֶזְרָתֵנוּ הָבֶל
  choice: à espera de socorro — em vão
  rationale: Comunica a direção da expectativa e a inutilidade do socorro esperado, mantendo a sintaxe poética comprimida.
- source_word: בְּצִפִּיָּתֵנוּ צִפִּינוּ
  choice: Em nossa vigília, esperávamos
  rationale: Reproduz, na medida do possível, a repetição da raiz hebraica por meio de termos ligados à espera vigilante, sem criar uma formulação artificial.
- source_word: גּוֹי
  choice: uma nação
  rationale: O contexto aponta para uma potência estrangeira da qual se esperava auxílio político ou militar.
- source_word: לֹא יוֹשִׁעַ
  choice: não podia salvar
  rationale: Mantém o sentido de salvar ou livrar e apresenta a leitura modal adotada, sem ocultar a alternativa de simples resultado negativo.
