  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: pt
  text: 'E, dos filhos de Paate-Moabe: Adna, Quelal, Benaia, Maaséias, Matanias, Bezalel, Binuí e Manassés.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: E, dos filhos de
  rationale: Reproduz a conjunção וּ, a preposição מִן e o sentido genealógico de בְּנֵי, preservando a estrutura da lista.
- source_word: פַּחַת מוֹאָב
  choice: Paate-Moabe
  rationale: Transliteração portuguesa tradicional do nome do grupo familiar, com hífen para indicar sua forma composta.
- source_word: עַדְנָא
  choice: Adna
  rationale: Transliteração direta e corrente em português do nome próprio.
- source_word: וּ/כְלָל
  choice: Quelal
  rationale: Transliteração adaptada à ortografia portuguesa, na qual «qu» antes de «e» representa adequadamente o som consonantal inicial.
- source_word: בְּנָיָה
  choice: Benaia
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Forma portuguesa tradicional, reconhecível e próxima da estrutura do nome hebraico.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Forma portuguesa tradicional do nome, sem reproduzir artificialmente na escrita a geminação hebraica.
- source_word: בְצַלְאֵל
  choice: Bezalel
  rationale: Transliteração portuguesa amplamente reconhecida do nome próprio.
- source_word: וּ/בִנּוּי
  choice: Binuí
  rationale: Transliteração portuguesa com acento para indicar naturalmente a tonicidade final.
- source_word: וּ/מְנַשֶּׁה
  choice: e Manassés
  rationale: Emprega a forma portuguesa consagrada do nome e conserva a conjunção que introduz o último item.
