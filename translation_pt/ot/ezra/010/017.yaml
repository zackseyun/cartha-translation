base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: pt
  text: E terminaram de tratar dos casos de todos os homens que haviam tomado mulheres estrangeiras até o primeiro dia do primeiro mês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no primeiro dia do primeiro mês”. A expressão hebraica pode indicar o limite até o qual o processo se estendeu ou a data em que foi concluído.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ בַכֹּל
  choice: terminaram de tratar dos casos de todos
  rationale: O verbo כלה indica a conclusão do processo, e בַכֹּל expressa a abrangência total dos casos examinados. A formulação explicita naturalmente em português o sentido processual do contexto sem acrescentar o resultado de cada caso.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O substantivo é masculino plural e, neste contexto, designa especificamente os homens envolvidos.
- source_word: הַהֹשִׁיבוּ
  choice: haviam tomado
  rationale: A forma causativa de ישב significa literalmente fazer habitar; no contexto, é uma expressão para acolher mulheres no lar como esposas. “Haviam tomado” conserva o caráter idiomático e evita tornar “casado” mais explícito do que o hebraico.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mulheres estrangeiras
  rationale: A expressão significa literalmente “mulheres estrangeiras”. O contexto deixa claro que foram tomadas como esposas, mas a tradução mantém a forma lexical do hebraico e evita duplicar essa interpretação.
- source_word: עַד יוֹם אֶחָד
  choice: até o primeiro dia
  rationale: עַד marca o limite temporal alcançado pelo processo. “Até” preserva diretamente a expressão hebraica, embora o contexto permita entendê-la como a data-limite em que o exame foi concluído.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: do primeiro mês
  rationale: Tradução natural e direta da expressão calendárica hebraica.
