- source_word: מִ/בְּנֵי
  choice: Dos filhos de
  rationale: A preposição מִן com o construto בְּנֵי introduz um grupo pertencente à família mencionada; “Dos filhos de” é natural em português e preserva o sentido partitivo da lista.
- source_word: בָנִי
  choice: Bani
  rationale: Nome próprio, transliterado em vez de traduzido.
- source_word: מַעֲדַי
  choice: Maadai
  rationale: Nome próprio, representado por transliteração direta e legível do hebraico.
- source_word: עַמְרָם
  choice: Anrão
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida deste nome bíblico.
- source_word: וְ/אוּאֵל
  choice: e Uel
  rationale: A conjunção וְ é traduzida por “e”, e o nome אוּאֵל é transliterado como “Uel”.
