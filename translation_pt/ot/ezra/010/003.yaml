  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: pt
  text: Agora, pois, façamos uma aliança com o nosso Deus para mandar embora todas essas mulheres e os filhos que delas nasceram, conforme o conselho do meu senhor e dos que tremem diante do mandamento do nosso Deus; e que se faça de acordo com a Lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: façamos uma aliança
  rationale: A expressão hebraica é literalmente “cortemos uma aliança”, mas “fazer uma aliança” comunica naturalmente em português o mesmo sentido idiomático.
- source_word: לְהוֹצִיא
  choice: mandaremos embora
  rationale: No contexto, o infinitivo indica retirar ou despedir as mulheres; “mandar embora” preserva a ação sem acrescentar uma formulação jurídica não expressa.
- source_word: כָל נָשִׁים
  choice: todas essas mulheres
  rationale: Embora o hebraico não traga artigo antes de “mulheres”, o grupo em questão já está definido pelo contexto; “essas” torna a referência natural sem classificá-las no próprio versículo como estrangeiras.
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: e os filhos que delas nasceram
  rationale: A forma substantivada singular coletiva significa literalmente “o que nasceu delas”; o contexto humano é expresso de modo claro e natural por “os filhos”.
- source_word: אֲדֹנָי
  choice: meu senhor
  rationale: A forma consonantal e a tradição massorética neste ponto permitem entendê-la como referência respeitosa a um interlocutor humano, distinguindo-a do nome divino; mantém-se a opção refletida no texto de consulta auditado.
- source_word: הַחֲרֵדִים בְּמִצְוַת
  choice: os que tremem diante do mandamento
  rationale: Preserva a imagem hebraica de temor reverente e submissão séria ao mandamento.
- source_word: כַתּוֹרָה
  choice: de acordo com a Lei
  rationale: Neste contexto, תּוֹרָה aponta para a norma legal ou instrução divina; “a Lei” é conciso e reconhecível em português bíblico atual.
theological_decisions:
- issue: Identidade de אֲדֹנָי
  choice: meu senhor
  alternative: Senhor
  rationale: O sufixo de primeira pessoa favorece a leitura como tratamento respeitoso dirigido a Esdras ou a outro líder. A tradução evita transformar silenciosamente essa referência humana em título divino.
- issue: Descrição das mulheres
  choice: essas mulheres
  alternative: mulheres estrangeiras
  rationale: O contexto identifica as mulheres como estrangeiras, mas o substantivo qualificativo não aparece neste versículo. A tradução não importa para o texto uma explicitação contextual desnecessária.
- issue: Formulação da separação familiar
  choice: mandaremos embora todas essas mulheres e os filhos que delas nasceram
  alternative: expulsaremos as mulheres com seus filhos
  rationale: A redação conserva a severidade da proposta sem intensificá-la com “expulsar” nem suavizá-la. Também mantém mulheres e filhos como objetos coordenados da ação proposta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a tensão ética do texto nem apresentar a proposta humana como fala direta de Deus.
