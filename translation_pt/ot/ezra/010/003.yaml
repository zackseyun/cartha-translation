  naturalness: O texto é claro, moderno e de registro apropriado. «Para mandar embora» e «que se faça» soam naturais e refletem mais de perto a construção hebraica.
  terminology: «Aliança», «meu senhor», «os que tremem diante do mandamento» e «a Lei» são escolhas adequadas. «Meu senhor» preserva corretamente a referência humana possível e favorecida pela forma massorética, sem convertê-la em título divino.
