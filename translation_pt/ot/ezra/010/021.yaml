  text: 'And from the sons of Harim: Maaseiah[a], Elijah, Shemaiah, Jehiel, and Uzziah.'
translation:
  language: pt
  text: 'E dos filhos de Harim: Maaséias, Elias, Semaías, Jeiel e Uzias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: E dos filhos de
  rationale: A combinação da conjunção ו com a preposição partitiva מִן e בְּנֵי introduz outro subgrupo familiar na lista. Em português, “E dos filhos de” preserva de modo natural tanto a conexão quanto a ideia de procedência ou pertencimento ao grupo.
- source_word: חָרִם
  choice: Harim
  rationale: Nome próprio de pessoa ou família, transliterado segundo a forma bíblica corrente em português.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: וְ/אֵלִיָּה
  choice: Elias
  rationale: Forma bíblica consagrada em português para o nome hebraico; a conjunção é representada pela estrutura da enumeração.
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: Semaías
  rationale: Transliteração adaptada às convenções e à pronúncia do português bíblico.
- source_word: וִ/יחִיאֵל
  choice: Jeiel
  rationale: Forma bíblica corrente em português, clara e reconhecível.
- source_word: וְ/עֻזִיָּה
  choice: Uzias
  rationale: Forma tradicional portuguesa do nome hebraico; a conjunção final é traduzida por “e”.
