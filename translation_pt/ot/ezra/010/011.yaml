  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: pt
  text: Agora, deem louvor a Yahweh[a], o Deus de seus pais, e façam a vontade dele. Separem-se dos povos da terra e das mulheres estrangeiras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confessem diante de Yahweh”. A expressão hebraica traduzida como “deem louvor” pode, neste contexto, também transmitir a ideia de confissão.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “esposas estrangeiras”. O contexto mais amplo trata de casamentos, embora o hebraico deste versículo diga “mulheres estrangeiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: deem louvor
  rationale: A expressão hebraica pode indicar louvor ou confissão. “Deem louvor” é natural em português e mantém no texto principal o sentido escolhido, enquanto a possível ideia de confissão é preservada em nota.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, conforme a camada inglesa fornecida, sem substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Preserva a linguagem ancestral e pactual do hebraico; “pais” corresponde formalmente a אבותיכם.
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: e façam a vontade dele
  rationale: Expressão corrente e clara que conserva a força imperativa de cumprir a vontade divina.
- source_word: וְהִבָּדְלוּ
  choice: Separem-se
  rationale: Reproduz com naturalidade a força reflexiva do imperativo nifal.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: dos povos desta terra
  rationale: Mantém o plural “povos” e expressa de modo natural o sintagma definido hebraico, sem identificar além do texto quais povos estão em vista.
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: e das mulheres estrangeiras
  rationale: Traduz precisamente o substantivo “mulheres”; o contexto matrimonial permite “esposas estrangeiras”, registrado como alternativa em nota.
theological_decisions:
- issue: Se תְּנוּ תוֹדָה deve ser entendido como louvor/ação de graças ou confissão
  choice: deem louvor
  alternative: confessem diante de Yahweh
  rationale: O idioma hebraico admite os dois matizes. O contexto de culpa e mudança favorece a ideia de confissão, mas o valor lexical de louvor ou gratidão permanece genuíno; a nota conserva essa tensão.
- issue: Se הַנָּשִׁים deve ser explicitado como esposas
  choice: mulheres estrangeiras
  alternative: esposas estrangeiras
  rationale: O versículo diz literalmente “mulheres”, embora o contexto imediato trate de casamentos. A tradução principal evita inserir a especificação contextual no texto.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural e leitura natural para o público brasileiro. O nome divino é transliterado como “Yahweh”. As notas preservam ambiguidades lexicais reais sem resolver indevidamente o contexto.
