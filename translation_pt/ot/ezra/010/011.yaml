    issue: «dos povos desta terra»
    rationale: O demonstrativo «desta» não corresponde ao artigo definido em מֵעַמֵּי הָאָרֶץ e especifica indevidamente a perspectiva espacial. «Dos povos da terra» preserva a expressão hebraica sem acrescentar essa nuance.
