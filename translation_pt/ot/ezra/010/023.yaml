base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: pt
  text: 'E, dentre os levitas: Josabade, Simei, Quelaías (isto é, Quelita)[a], Petaías, Judá e Eliezer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Quelaías, ele é Quelita”, indicando que Quelita é outro nome, ou uma forma alternativa do nome, da mesma pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: E, dentre os levitas
  rationale: Preserva a ligação com a lista anterior e o sentido partitivo de מִן, indicando alguns membros do grupo dos levitas.
- source_word: יוֹזָבָד
  choice: Josabade
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: וְשִׁמְעִי
  choice: Simei
  rationale: Forma portuguesa corrente do nome hebraico.
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: Quelaías (isto é, Quelita)
  rationale: A construção hebraica identifica Quelita como nome alternativo ou variante do nome da mesma pessoa; a formulação mantém essa identificação sem explicar além do texto.
- source_word: פְּתַחְיָה
  choice: Petaías
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa estabelecida; neste contexto designa uma pessoa, não a tribo ou a região.
- source_word: וֶאֱלִיעֶזֶר
  choice: e Eliezer
  rationale: A vocalização hebraica corresponde a Eliezer; a conjunção final é reproduzida naturalmente em português.
