base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: pt
  text: 'E dos filhos de Zatu: Elioenai, Eliasibe, Matanias, Jeremote, Zabade e Aziza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: E dos filhos de
  rationale: Preserva a conjunção que dá continuidade à lista, a preposição e o plural construto de בֵּן. Neste contexto genealógico, “filhos de” é direto e convencional, embora possa abranger descendentes ou membros do clã.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Nome próprio transliterado segundo uma forma natural e reconhecível em português.
- source_word: אֶלְיוֹעֵנַי
  choice: Elioenai
  rationale: Transliteração convencional do nome próprio, inteligível em português e próxima da forma hebraica.
- source_word: אֶלְיָשִׁיב
  choice: Eliasibe
  rationale: Forma portuguesa convencional do nome hebraico, com vogal final para adequação fonológica.
- source_word: מַתַּנְיָה
  choice: Matanias
  rationale: Forma tradicional portuguesa que representa o nome e seu elemento teofórico final sem traduzir seu significado.
- source_word: וִֽ/ירֵמ֔וֹת
  choice: Jeremote
  rationale: Transliteração adaptada à fonologia portuguesa; a conjunção prefixada é absorvida pela pontuação normal da enumeração.
- source_word: וְ/זָבָד
  choice: Zabade
  rationale: Transliteração portuguesa convencional; a conjunção hebraica é expressa pela estrutura da lista.
- source_word: וַ/עֲזִיזָא
  choice: e Aziza
  rationale: O nome é transliterado diretamente, e a conjunção prefixada é preservada como “e” diante do último item.
