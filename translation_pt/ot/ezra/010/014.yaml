  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: pt
  text: Que os nossos líderes, por favor, representem toda a assembleia, e que todos os que, em nossas cidades, tomaram mulheres estrangeiras como esposas[a] compareçam em datas marcadas, acompanhados dos anciãos e dos juízes de cada cidade, até que a ira ardente do nosso Deus se afaste de nós neste assunto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fizeram habitar mulheres estrangeiras”; a expressão se refere a recebê-las no lar como esposas. Também pode ser traduzida por “casaram-se com mulheres estrangeiras”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até que se afaste de nós a ira ardente do nosso Deus quanto a este assunto”. A construção hebraica da frase final é incomum.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: Que ... por favor, representem
  rationale: O jussivo com נָא expressa uma proposta ou solicitação cortês. Neste contexto administrativo, “representem” comunica naturalmente a função dos líderes perante toda a assembleia, sem reproduzir de modo obscuro o literal “fiquem de pé”.
- source_word: שָׂרֵינוּ
  choice: os nossos líderes
  rationale: שָׂרִים designa autoridades ou dirigentes. “Líderes” é atual, claro e evita o arcaísmo e a possível conotação monárquica de “príncipes”.
- source_word: לְכָל הַקָּהָל
  choice: toda a assembleia
  rationale: A preposição indica que os líderes atuariam em relação à assembleia, provavelmente como seus representantes. A formulação escolhida torna essa função inteligível em português.
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: tomaram mulheres estrangeiras como esposas
  rationale: A expressão com ישׁב significa literalmente fazer habitar ou instalar mulheres estrangeiras no lar, mas, no contexto, refere-se a recebê-las como esposas. A tradução explicita a relação conjugal sem reduzi-la necessariamente a uma fórmula jurídica moderna de casamento.
- source_word: יָבֹא
  choice: compareçam
  rationale: Embora esteja no singular, o verbo concorda distributivamente com “todos os que”. “Compareçam” se ajusta ao comparecimento formal para a apreciação dos casos.
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: em datas marcadas
  rationale: A expressão indica ocasiões previamente designadas. “Datas marcadas” é natural em português e preserva o caráter organizado do procedimento.
- source_word: וְעִמָּהֶם זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: acompanhados dos anciãos e dos juízes de cada cidade
  rationale: עִיר וָעִיר tem sentido distributivo, “cada cidade”. A formulação deixa claro que as autoridades locais acompanhariam os respectivos envolvidos.
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: a ira ardente do nosso Deus
  rationale: A expressão hebraica retrata uma ira intensa e abrasadora. “Ira ardente” conserva a força e a imagem do original sem suavizar a linguagem teológica.
- source_word: מִמֶּנּוּ
  choice: de nós
  rationale: O sufixo preposicional se refere à comunidade sobre a qual recai a ira divina.
- source_word: עַד לַדָּבָר הַזֶּה
  choice: por causa deste assunto
  rationale: A expressão final relaciona a ira divina ao caso em questão. O segundo עַד é incomum e admite mais de uma análise; a escolha comunica a provável relação causal, com a alternativa mais formal registrada em nota.
theological_decisions:
- issue: Como expressar a ira divina sem suavizá-la nem sistematizá-la além do texto
  choice: a ira ardente do nosso Deus
  alternative: a ira intensa do nosso Deus
  rationale: O hebraico atribui explicitamente a Deus חֲרוֹן אַף em resposta à transgressão comunitária. “Ira ardente” preserva essa afirmação e sua metáfora, sem acrescentar categorias doutrinárias externas.
- issue: Sentido da cláusula final עַד לְהָשִׁיב ... עַד לַדָּבָר הַזֶּה
  choice: até que a ira ardente do nosso Deus se afaste de nós por causa deste assunto
  alternative: até que se afaste de nós a ira ardente do nosso Deus quanto a este assunto
  rationale: A sintaxe final é difícil, especialmente o segundo עַד. A leitura principal entende o assunto como a causa ou esfera da ira; a nota preserva uma tradução mais formal que não decide completamente essa relação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Compareçam” e “datas marcadas” refletem o contexto administrativo; “anciãos” preserva o título comunitário tradicional. A ordem da frase foi ajustada para fluência, e as notas mantêm a idiomaticidade matrimonial e a ambiguidade da cláusula final.
