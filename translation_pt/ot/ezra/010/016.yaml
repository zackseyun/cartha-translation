base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: pt
  text: Os filhos do exílio fizeram assim[a]. E Esdras, o sacerdote, e homens que eram chefes de casas paternas — segundo as suas casas paternas, todos eles identificados pelo nome[c] — foram separados[b]. No primeiro dia do décimo mês, eles se reuniram para investigar o assunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os exilados”. Literalmente, “os filhos do exílio”, designação coletiva da comunidade que havia retornado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “se separaram”. A forma hebraica é plural e pode ter sentido passivo (“foram separados”) ou reflexivo; no contexto, refere-se à constituição de representantes para essa tarefa.'
    reason: alternative_reading
  - marker: c
    text: Literalmente, “chefes das casas dos pais, segundo a casa de seus pais”; refere-se aos líderes de clãs ou famílias ancestrais.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: os filhos do exílio
  rationale: Preserva a forma corporativa hebraica e sua referência à comunidade que retornou do exílio; a nota esclarece o idioma.
- source_word: וַיִּבָּדְלוּ
  choice: separou
  rationale: Mantém a ideia lexical de separação do nifal de בדל. Embora a forma verbal seja plural e admita leitura reflexiva, a construção também pode apresentar Esdras como agente que separou os homens; a ambiguidade é registrada em nota.
- source_word: עֶזְרָא הַכֹּהֵן
  choice: Esdras, o sacerdote
  rationale: Traduz somente o título expresso neste versículo, sem acrescentar “escriba” com base no contexto próximo.
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת
  choice: homens que eram chefes de famílias paternas
  rationale: Retém o sentido explícito de אֲנָשִׁים e apresenta de modo compreensível a unidade social ancestral indicada por רָאשֵׁי הָאָבוֹת.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo suas famílias paternas
  rationale: Expressa a classificação dos representantes por casa ancestral paterna e conserva a repetição conceitual do hebraico.
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: todos eles designados pelo nome
  rationale: Comunica que cada representante foi identificado nominalmente.
- source_word: וַיֵּשְׁבוּ
  choice: eles se reuniram
  rationale: No contexto administrativo, o ato literal de sentar-se indica a instalação ou reunião do grupo para deliberar; a formulação natural em português comunica essa função.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הָעֲשִׂירִי
  choice: no primeiro dia do décimo mês
  rationale: É a forma idiomática corrente em português para a data hebraica literalmente expressa como “dia um”.
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: para investigar o assunto
  rationale: דרש neste contexto administrativo significa examinar ou averiguar cuidadosamente uma questão.
theological_decisions:
- issue: Agência e valor do nifal plural וַיִּבָּדְלוּ
  choice: Esdras separou homens
  alternative: Esdras, o sacerdote, e certos homens se separaram
  rationale: 'A sintaxe hebraica é difícil: o verbo plural pode incluir Esdras e os homens como sujeito composto, mas o contexto favorece a constituição de representantes por Esdras. A nota preserva a leitura formal alternativa sem decidir uma questão doutrinária.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Famílias paternas” evita o arcaísmo pouco transparente de “casas paternas”, enquanto a nota conserva a forma cultural hebraica. “Reuniram-se” torna explícita a função administrativa de ישב sem alterar o propósito declarado da reunião.
