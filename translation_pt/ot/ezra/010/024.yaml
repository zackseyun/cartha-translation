lexical_decisions:
- source_word: וּמִן
  choice: E dentre
  rationale: A conjunção com a preposição introduz novos integrantes dentro de subgrupos da lista; “e dentre” preserva tanto a progressão aditiva quanto o sentido partitivo.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio substantivado de שׁיר designa os que serviam como cantores, especialmente no contexto do culto; “cantores” é claro e preciso.
- source_word: אֶלְיָשִׁיב
  choice: Eliasibe
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: הַשֹּׁעֲרִים
  choice: os porteiros
  rationale: No contexto do templo, refere-se aos encarregados das portas ou portões; “porteiros” é a designação bíblica corrente e natural em português.
- source_word: שַׁלֻּם
  choice: Salum
  rationale: Transliteração portuguesa tradicional do nome hebraico.
- source_word: טֶלֶם
  choice: Telem
  rationale: Transliteração direta e corrente do nome hebraico.
- source_word: אוּרִי
  choice: Uri
  rationale: Transliteração direta e corrente do nome hebraico.
