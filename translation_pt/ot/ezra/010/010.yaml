  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: pt
  text: 'Então o sacerdote Esdras se levantou e lhes disse: “Vocês agiram com infidelidade e tomaram mulheres estrangeiras por esposas[a], aumentando assim a culpa de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “casaram-se com mulheres estrangeiras”. O hebraico diz literalmente “fizeram habitar mulheres estrangeiras”; neste contexto, a expressão se refere a recebê-las no lar como esposas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Expressa de modo natural a ação pública de Esdras ao pôr-se de pé diante da assembleia.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Mantém o título em aposição a Esdras, conforme o hebraico.
- source_word: מְעַלְתֶּם
  choice: agiram com infidelidade
  rationale: O verbo מעל indica quebra de fidelidade, frequentemente com dimensão pactual; a formulação preserva essa força moral e relacional sem recorrer a linguagem técnica.
- source_word: וַתֹּשִׁיבוּ
  choice: tomaram ... por esposas
  rationale: O hifil de ישב significa literalmente fazer habitar ou instalar; neste contexto, descreve trazer essas mulheres para o lar em vínculo matrimonial. A expressão portuguesa comunica o sentido contextual sem apagar inteiramente o caráter idiomático do hebraico.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mulheres estrangeiras
  rationale: Preserva os termos explícitos do hebraico; o complemento 'por esposas' esclarece a relação matrimonial exigida pelo contexto.
- source_word: לְהוֹסִיף
  choice: aumentando assim
  rationale: Comunica o resultado da conduta anterior e liga naturalmente a ação ao acréscimo da culpa coletiva.
- source_word: אַשְׁמַת
  choice: a culpa
  rationale: Neste contexto, אַשְׁמָה designa culpa ou culpabilidade, não uma oferta pela culpa.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a referência coletiva ao povo da aliança.
theological_decisions:
- issue: Culpabilidade coletiva da comunidade da aliança
  choice: aumentando assim a culpa de Israel
  alternative: acrescentando à culpa de Israel
  rationale: A tradução conserva a afirmação de que a conduta individual ou grupal aumenta a culpa atribuída corporativamente a Israel, sem explicar além do que o hebraico declara.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O tratamento plural 'vocês' evita solenidade artificial; 'agiram com infidelidade' preserva a dimensão pactual do verbo sem jargão confessional.
