base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: pt
  text: Somente Jônatas, filho de Asael, e Jazeías[a], filho de Ticvá, se opuseram a isso[b]; e Mesulão e Sabetai, o levita, os apoiaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Jaazias».
    reason: lexical_alternative
  - marker: b
    text: Ou «tomaram posição quanto a este assunto». A expressão hebraica é discutida e pode não indicar oposição.
    reason: source_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: A partícula tem aqui força restritiva, introduzindo as exceções ao acordo coletivo mencionado no contexto.
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: Jônatas, filho de Asael
  rationale: Os nomes seguem formas bíblicas naturais em português, e בֶּן é traduzido de modo explícito como “filho de”.
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: Jaazias, filho de Ticvá
  rationale: A escolha representa a forma consonantal hebraica em grafia portuguesa legível; a variante “Jazias” é registrada em nota.
- source_word: עָמְדוּ עַל זֹאת
  choice: se posicionaram contra isso
  rationale: No contexto, a expressão indica mais provavelmente uma tomada de posição contrária à proposta. “Se posicionaram” preserva em português a imagem de tomar posição, sem tornar a formulação artificial.
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: e Mesulão e Sabetai, o levita
  rationale: A ordem e a construção hebraicas indicam que a designação “o levita” modifica mais naturalmente apenas Sabetai.
- source_word: עֲזָרֻם
  choice: os apoiaram
  rationale: O verbo significa “ajudar, auxiliar”; neste contexto deliberativo, “apoiaram” comunica naturalmente que Mesulão e Sabetai deram respaldo aos dois homens.
