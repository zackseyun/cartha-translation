base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/012.yaml
  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: pt
  text: 'Então toda a assembleia respondeu em alta voz: “Sim! Cabe a nós fazer conforme você disse.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Sim, conforme as suas palavras, assim cabe a nós fazer.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ כָל־הַקָּהָל
  choice: toda a assembleia respondeu
  rationale: O verbo ענה introduz a resposta coletiva, e קָהָל designa a comunidade reunida. A concordância no singular com “assembleia” é natural em português, sem alterar o sentido de unanimidade expresso por כָל.
- source_word: וַיֹּאמְרוּ קוֹל גָּדוֹל
  choice: em alta voz
  rationale: A expressão hebraica, literalmente “disseram [com] grande voz”, indica uma resposta forte e pública. “Em alta voz” comunica esse sentido de modo claro e digno, evitando a repetição pouco natural “respondeu e disse”.
- source_word: כֵּן
  choice: Sim!
  rationale: Neste contexto, כֵּן expressa a concordância enfática da assembleia com a determinação apresentada.
- source_word: כִדְבָרֶיךָ
  choice: conforme você disse
  rationale: A expressão significa literalmente “conforme as suas palavras”. A formulação escolhida é atual e natural em português, preservando a referência direta ao que Ezra acabara de dizer.
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: Cabe a nós fazer
  rationale: A construção apresenta a ação como uma obrigação ou responsabilidade que recai sobre os falantes. “Cabe a nós fazer” conserva essa ideia sem acrescentar uma avaliação teológica.
