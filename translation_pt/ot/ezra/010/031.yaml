  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: pt
  text: 'E dos filhos de Harim[a]: Eliezer, Jesias, Malquias, Semaías e Simeão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os filhos de Harim: Eliezer, Jesias, Malquias, Semaías e Simeão”, entendendo a expressão apenas como o cabeçalho da lista, sem explicitar a ideia de “dentre” o grupo.'
