lexical_decisions:
- source_word: וּ/בְנֵי
  choice: E, dos filhos de
  rationale: A conjunção וּ liga o versículo à lista anterior, e בְנֵי introduz o grupo familiar. No contexto, “dos filhos de” indica naturalmente que os homens nomeados pertenciam ao clã de Harim, sem tornar explícito mais do que o hebraico permite.
- source_word: חָרִם
  choice: Harim
  rationale: Nome próprio de família, conservado em transliteração corrente e clara em português.
- source_word: אֱלִיעֶזֶר
  choice: Eliezer
  rationale: Forma tradicional e reconhecível em português para o nome hebraico.
- source_word: יִשִּׁיָּה
  choice: Issias
  rationale: Forma portuguesa legível que representa o nome hebraico e se harmoniza com a tradição bíblica lusófona.
- source_word: מַלְכִּיָּה
  choice: Malquias
  rationale: Forma portuguesa tradicional, com “qu” representando adequadamente o som consonantal do hebraico.
- source_word: שְׁמַעְיָה
  choice: Semaías
  rationale: Forma portuguesa tradicional e facilmente reconhecível do nome hebraico.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma consagrada em português para o nome hebraico, preferida a uma transliteração menos familiar como “Shimeon”.
