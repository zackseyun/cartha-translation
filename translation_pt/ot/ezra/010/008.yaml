  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: pt
  text: E todo aquele que não comparecesse dentro de três dias, conforme a decisão dos oficiais e dos anciãos, teria todos os seus bens confiscados[a] e seria separado da assembleia dos exilados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “postos sob interdição” ou “consagrados à destruição”. O verbo hebraico indica que os bens seriam colocados sob ḥerem, uma interdição ou consagração irrevogável que, conforme o contexto, podia envolver destruição ou confisco.
    reason: Preservar a amplitude e a força técnica de חרם, cuja aplicação exata aos bens neste contexto admite mais de uma formulação.
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: E todo aquele que não comparecesse
  rationale: A construção introduz uma classe geral sujeita à sanção. “Comparecesse” expressa naturalmente o ato de atender à convocação, e o imperfeito do subjuntivo se ajusta ao decreto relatado no contexto narrativo.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: dentro de três dias
  rationale: Indica o prazo para o comparecimento sem especificar além do que o hebraico permite.
- source_word: כַּעֲצַת
  choice: conforme a decisão de
  rationale: עֵצָה pode significar conselho, parecer ou decisão; neste contexto administrativo, trata-se da determinação autorizada dos dirigentes.
- source_word: הַשָּׂרִים וְהַזְּקֵנִים
  choice: os oficiais e os anciãos
  rationale: “Oficiais” comunica o papel administrativo de שׂרים no período pós-exílico; “anciãos” é a designação corrente de זקנים.
- source_word: יָחֳרַם כָּל רְכוּשׁוֹ
  choice: teria todos os seus bens confiscados
  rationale: חרם designa a colocação sob interdição ou consagração irrevogável; aplicado aos bens nesta sanção administrativa, seu efeito contextual é a perda ou o confisco. A nota preserva a força técnica e as alternativas do termo.
- source_word: וְהוּא יִבָּדֵל
  choice: e seria separado
  rationale: Mantém o sentido passivo de בדל e evita importar a categoria eclesiástica posterior de excomunhão.
- source_word: מִקְּהַל הַגּוֹלָה
  choice: da assembleia dos exilados
  rationale: “Assembleia” traduz קהל de modo claro e não eclesiástico; “exilados” reproduz diretamente הגולה, a comunidade ligada ao exílio.
theological_decisions:
- issue: Sentido da pena expressa por חרם sobre os bens
  choice: confiscados no texto, com a noção técnica de interdição explicitada em nota
  alternative: consagrados à destruição; postos sob interdição
  rationale: No contexto administrativo, “confiscados” comunica com clareza o efeito provável da pena, enquanto a nota evita reduzir חרם a uma simples categoria jurídica moderna e conserva sua possível força de interdição ou devoção irrevogável.
- issue: Natureza da separação da comunidade
  choice: seria separado da assembleia
  alternative: seria excluído; seria excomungado
  rationale: O texto afirma separação da assembleia dos exilados, mas não define a medida por categorias eclesiásticas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe de decreto relatado emprega “comparecesse”, “teria” e “seria”; evitam-se arcaísmos e terminologia eclesiástica interpretativa.
