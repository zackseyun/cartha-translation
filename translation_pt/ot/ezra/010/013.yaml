source:
  edition: WLC
  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: pt
  text: Mas o povo é numeroso, e é tempo de chuvas;[a] não há forças para permanecer ao ar livre. Além disso, este trabalho não é para um dia nem para dois,[b] pois temos transgredido gravemente nesta questão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “e o tempo é de chuvas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “este trabalho não pode ser feito em um ou dois dias”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “temos pecado gravemente nesta questão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: Mas
  rationale: Marca o contraste com a proposta do versículo anterior de maneira natural e direta.
- source_word: הָעָם רָב
  choice: o povo é numeroso
  rationale: Preserva o adjetivo predicativo רָב com o substantivo coletivo עָם; em português, “numeroso” é mais natural que “muitos” nessa construção.
- source_word: וְהָעֵת גְּשָׁמִים
  choice: e esta é a estação das chuvas
  rationale: Expressa idiomaticamente o hebraico literal “e o tempo [é] de chuvas”, sem acrescentar que as chuvas sejam necessariamente fortes.
- source_word: וְאֵין כֹּחַ לַעֲמוֹד בַּחוּץ
  choice: não temos forças para ficar do lado de fora
  rationale: Transmite a falta de capacidade para permanecer exposto ao ar livre; a primeira pessoa é inferida do discurso coletivo e soa natural em português.
- source_word: וְהַמְּלָאכָה
  choice: Além disso, este trabalho
  rationale: מְלָאכָה designa aqui a tarefa prática de examinar e resolver a situação. “Além disso” comunica o valor aditivo de וְ na progressão do argumento.
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: não é para um dia nem para dois
  rationale: Mantém de perto a estrutura hebraica e indica que a tarefa não pode ser concluída rapidamente, sem explicitar no corpo do texto aquilo que fica implícito.
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: pois temos transgredido gravemente
  rationale: O hifil de רבה com o infinitivo intensifica a transgressão. “Gravemente” preserva essa força com naturalidade, sem sugerir necessariamente que o verbo signifique “muitos de nós”.
- source_word: בַּדָּבָר הַזֶּה
  choice: nesta questão
  rationale: Tradução contextual e idiomática de דָּבָר, referindo-se ao assunto em discussão.
theological_decisions:
- issue: Natureza da falta expressa por לִפְשֹׁעַ
  choice: transgredido
  alternative: pecado; agido com rebeldia
  rationale: “Transgredido” conserva a gravidade da violação da aliança sem impor uma classificação teológica mais específica do que o próprio versículo fornece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação hebraica foi preservada em grande parte, mas a pontuação e “Além disso” tornam a sequência argumentativa natural. Todos os marcadores de nota aparecem no texto junto ao trecho correspondente.
