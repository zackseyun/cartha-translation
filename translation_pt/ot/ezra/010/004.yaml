lexical_decisions:
- source_word: קוּם
  choice: Levante-se
  rationale: O imperativo exige ação imediata. “Levante-se” é natural no português moderno e preserva a força exortativa do hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem anterior de maneira concisa e natural.
- source_word: עָלֶיךָ הַדָּבָר
  choice: esta questão está sob sua responsabilidade
  rationale: A expressão idiomática com עַל indica que o encargo de tratar da questão recai sobre Esdras. A formulação comunica isso claramente sem acrescentar uma interpretação teológica.
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: e nós estamos com você
  rationale: Expressa solidariedade e apoio de modo direto e corrente.
- source_word: חֲזַק
  choice: Seja forte
  rationale: Mantém a imagem de força presente no imperativo hebraico e sua força exortativa.
- source_word: וַעֲשֵׂה
  choice: e faça isso
  rationale: O objeto está implícito no hebraico e é recuperado naturalmente do contexto como “esta questão”.
