  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: pt
  text: Levante-se[a], pois esta questão está sob sua responsabilidade, e nós estamos com você. Seja forte e faça isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ponha-se de pé”. A expressão seguinte também pode ser traduzida literalmente como “esta questão está sobre você”; isto é, cabe a você a responsabilidade de resolvê-la.'
