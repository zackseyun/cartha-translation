base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: pt
  text: Enquanto Esdras orava e confessava, chorando e lançando-se por terra diante da Casa de Deus, reuniu-se a ele, dentre Israel, uma assembleia muito numerosa de homens, mulheres e crianças, pois o povo chorava muito[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “pois o povo chorava com muito choro”.'
    reason: A nota registra a construção enfática hebraica הַרְבֵּה בֶכֶה, vertida de modo idiomático no texto principal.
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא
  choice: Enquanto Esdras orava
  rationale: A construção com כְּ apresenta a oração de Esdras como ação simultânea e contínua em relação ao ajuntamento do povo.
- source_word: וּכְהִתְוַדֹּתוֹ
  choice: e confessava
  rationale: O hitpael de ידה expressa o ato penitencial de confessar; a forma verbal coordenada é natural em português e mantém a ação em curso.
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: chorando e lançando-se por terra
  rationale: Os particípios descrevem ações contínuas. “Lançando-se por terra” preserva o valor reflexivo e intenso de נפל sem determinar uma postura ritual específica.
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: diante da Casa de Deus
  rationale: Mantém a expressão hebraica para o templo e seu tom reverente, com capitalização editorial que deixa claro o uso titular.
- source_word: נִקְבְּצוּ אֵלָיו מִיִּשְׂרָאֵל
  choice: reuniu-se a ele, dentre Israel
  rationale: Preserva tanto o movimento da assembleia em direção a Esdras quanto sua procedência dentre a comunidade de Israel.
- source_word: קָהָל רַב מְאֹד
  choice: uma assembleia muito numerosa
  rationale: “Assembleia” traduz קהל sem impor conotações eclesiásticas posteriores; “muito numerosa” comunica claramente o grande número de presentes.
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: de homens, mulheres e crianças
  rationale: Preserva integralmente os três grupos explicitamente mencionados no hebraico.
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: pois o povo chorava muito
  rationale: “Pois” mantém a relação explicativa. “Chorava muito” comunica a intensidade da construção enfática hebraica sem acrescentar a nuance interpretativa de amargura.
