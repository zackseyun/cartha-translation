base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: pt
  text: 'Entre os filhos dos sacerdotes que haviam tomado mulheres estrangeiras por esposas[a], foram encontrados, dentre os filhos de Jesua, filho de Jozadaque, e de seus irmãos: Maaseias, Eliezer, Jaribe e Gedalias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que haviam se casado com mulheres estrangeiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: foram encontrados
  rationale: Embora a forma verbal hebraica seja singular, ela introduz uma lista de vários homens; o plural em português expressa naturalmente esse sentido coletivo.
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: entre os filhos dos sacerdotes
  rationale: Preserva a linguagem genealógica de בְּנֵי e comunica participação no grupo sacerdotal.
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: que haviam tomado mulheres estrangeiras por esposas
  rationale: Expressa o sentido matrimonial do contexto sem reduzir נָשִׁים a 'esposas' no corpo do texto; a formulação é clara e mantém proximidade com o idioma hebraico.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mulheres estrangeiras
  rationale: É a correspondência lexical direta, enquanto 'por esposas' explicita a relação indicada pelo contexto e pelo verbo.
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: dos filhos de Jesua, filho de Jozadaque
  rationale: Mantém a expressão genealógica repetida e usa formas portuguesas tradicionais e reconhecíveis dos nomes.
- source_word: וְאֶחָיו
  choice: e de seus irmãos
  rationale: O sufixo remete a Jesua; 'irmãos' conserva o equivalente direto, sem ampliar desnecessariamente para 'parentes'.
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: Maaseias, Eliezer, Jaribe e Gedalias
  rationale: Os nomes próprios são transliterados em formas correntes na tradição bíblica em português.
