base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: pt
  text: 'E, dos israelitas, dos descendentes de Parós: Ramias, Izias, Malquias, Miamim, Eleazar, Malquias[a] e Benaia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico repete o nome Malquias nesta lista, provavelmente referindo-se a dois homens diferentes com o mesmo nome.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִֽיִּשְׂרָאֵל
  choice: E, dentre os israelitas
  rationale: A conjunção mantém a continuidade da lista, e a expressão preposicional é vertida naturalmente como a introdução de um grupo pertencente a Israel.
- source_word: מִבְּנֵי
  choice: dos descendentes de
  rationale: Embora a expressão signifique literalmente “dos filhos de”, neste contexto de lista familiar ou clânica ela designa os descendentes ou membros da linhagem de Parós.
- source_word: פַרְעֹשׁ
  choice: Parós
  rationale: Transliteração do nome próprio ajustada às convenções e à pronúncia natural em português.
- source_word: רַמְיָה
  choice: Ramias
  rationale: Forma portuguesa tradicional e reconhecível para o nome hebraico.
- source_word: יִזִּיָּה
  choice: Izias
  rationale: Transliteração aportuguesada que representa de modo claro o nome hebraico.
- source_word: מַלְכִּיָּה
  choice: Malquias
  rationale: Forma portuguesa consagrada; foi mantida nas duas ocorrências, conforme o texto hebraico.
- source_word: מִיָּמִן
  choice: Miamim
  rationale: Transliteração portuguesa próxima da forma hebraica.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: בְנָיָה
  choice: Benaia
  rationale: Forma portuguesa corrente do nome hebraico.
