  text: All these had married foreign women, and some of them had wives by whom they had children.
translation:
  language: pt
  text: Todos esses tinham se casado com mulheres estrangeiras, e alguns deles tinham esposas de quem tiveram filhos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e havia entre eles esposas, e puseram filhos”. O hebraico no fim do versículo é conciso e de interpretação difícil.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos”; neste contexto, a palavra pode referir-se de modo mais amplo à descendência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נשא/י
  choice: tinham se casado
  rationale: O contexto e o objeto “mulheres” indicam o uso matrimonial de נשׂא; a formulação comunica isso naturalmente em português.
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: mulheres estrangeiras
  rationale: Preserva a referência a mulheres de fora do povo/comunidade da aliança sem recorrer ao ambíguo e antiquado “mulheres estranhas”.
- source_word: וְיֵשׁ מֵהֶם
  choice: e alguns deles
  rationale: Equivalência idiomática e concisa para a construção existencial hebraica com מֵהֶם.
- source_word: נָשִׁים
  choice: esposas
  rationale: Neste segundo uso, o sentido relacional é favorecido pelo contexto matrimonial.
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: com quem tiveram filhos
  rationale: O hebraico final é conciso e difícil; esta tradução expressa de modo natural a ideia contextual de descendência dessas uniões, sem reproduzir literalmente uma expressão obscura.
- source_word: בָּנִים
  choice: filhos
  rationale: Em português, “filhos” pode abranger a descendência de ambos os sexos; mantém ainda correspondência formal próxima com o plural masculino hebraico.
