  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: pt
  text: Assim, todos os homens[b] de Judá e Benjamim se reuniram[a] em Jerusalém no prazo de três dias. Era o nono mês, no vigésimo dia do mês. Todo o povo se sentou na praça aberta[c] da casa de Deus, tremendo por causa desse assunto e das chuvas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se juntaram”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “todos os homens de Judá e Benjamim”; a expressão é gramaticalmente masculina e provavelmente se refere aos homens ou representantes convocados para a assembleia.
    reason: lexical_alternative
  - marker: c
    text: Ou “na praça diante da casa de Deus”. O hebraico indica uma área ampla e aberta, não necessariamente um pátio interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: se reuniram
  rationale: O nifal de קבץ indica que se juntaram ou se reuniram. “Se reuniram” é natural em português e mantém o sentido coletivo.
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: todos os homens de Judá e Benjamim
  rationale: אַנְשֵׁי é gramaticalmente masculino e significa literalmente “homens de”. O contexto aponta para os membros ou representantes masculinos convocados, sem que isso deva ser nivelado para “todo o povo” nesta primeira oração.
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: dentro dos três dias
  rationale: A expressão indica que a reunião ocorreu dentro do prazo de três dias anteriormente estabelecido.
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי
  choice: Era o nono mês
  rationale: Forma direta e natural de introduzir a data segundo o calendário mencionado no texto.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: no vigésimo dia do mês
  rationale: Reproduz com clareza a fórmula hebraica de data.
- source_word: וַיֵּשְׁבוּ
  choice: se sentou
  rationale: ישׁב significa aqui sentar-se. O singular concorda naturalmente em português com o coletivo “todo o povo”.
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: na praça aberta da casa de Deus
  rationale: רְחוֹב designa um espaço amplo e aberto, como uma praça, sem especificar necessariamente um pátio interior do templo.
- source_word: מַרְעִידִים
  choice: tremendo
  rationale: O particípio expressa tremor físico, causado tanto pela questão em pauta quanto pelas chuvas.
- source_word: עַל הַדָּבָר
  choice: por causa desse assunto
  rationale: הַדָּבָר remete à questão concreta que motivou a assembleia; “desse assunto” preserva essa referência contextual.
- source_word: וּמֵהַגְּשָׁמִים
  choice: e das chuvas
  rationale: A preposição indica causa, e o plural גְּשָׁמִים é preservado sem acrescentar explicitamente uma intensidade ausente do texto hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa e a distinção entre “todos os homens” e “todo o povo” foram preservadas; evitou-se acrescentar “fortes” a “chuvas”, pois a intensidade não está expressa lexicalmente no hebraico.
