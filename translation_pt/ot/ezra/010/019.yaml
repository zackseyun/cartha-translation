  text: וַ/יִּתְּנ֥וּ יָדָ֖/ם לְ/הוֹצִ֣יא נְשֵׁי/הֶ֑ם וַ/אֲשֵׁמִ֥ים אֵֽיל צֹ֖אן עַל אַשְׁמָתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: pt
  text: Eles se comprometeram a mandar embora suas esposas[a] e, sendo culpados, ofereceram um carneiro do rebanho por sua culpa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deram a mão”, expressão idiomática hebraica usada para assumir um compromisso ou acordo vinculante.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de modo mais explícito: “ofereceram um carneiro do rebanho como oferta pela culpa, por causa de sua culpa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: Eles se comprometeram
  rationale: A expressão literalmente significa “deram a mão”, mas funciona como um idioma hebraico para assumir um compromisso solene. “Se comprometeram” comunica esse sentido com naturalidade em português.
- source_word: לְהוֹצִיא
  choice: a mandar embora
  rationale: O infinitivo no hifil de יצא significa fazer sair. Neste contexto conjugal, “mandar embora” preserva a ação expressa no hebraico sem acrescentar um termo jurídico não presente no texto.
- source_word: נְשֵׁיהֶם
  choice: suas esposas
  rationale: Embora o substantivo possa significar “mulheres”, o contexto é claramente matrimonial; “esposas” exprime o sentido pretendido.
- source_word: וַאֲשֵׁמִים
  choice: e, sendo culpados
  rationale: O adjetivo descreve o estado de culpa dos homens. A formulação mantém a ligação verbalmente implícita com a frase sacrificial seguinte sem transformá-la numa confissão explícita.
- source_word: אֵיל צֹאן
  choice: um carneiro do rebanho
  rationale: A expressão designa concretamente um carneiro pertencente ao rebanho e destinado ao sacrifício. A tradução é clara e próxima da forma hebraica.
- source_word: עַל אַשְׁמָתָם
  choice: por sua culpa
  rationale: A preposição עַל com אַשְׁמָה indica que o sacrifício era apresentado em razão da culpa deles. “Por sua culpa” é conciso e preserva a conexão lexical com “culpados”.
theological_decisions:
- issue: Explicitar no texto principal o termo técnico “oferta pela culpa”
  choice: Manter “ofereceram um carneiro do rebanho por sua culpa”
  alternative: “ofereceram um carneiro do rebanho como oferta pela culpa, por causa de sua culpa”
  rationale: O hebraico menciona o carneiro e a culpa, mas nesta oração não traz separadamente o substantivo técnico para “oferta”. O verbo “ofereceram” é suprido para tornar clara a construção elíptica, enquanto a possível explicitação sacrificial fica registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução evita tanto o literalismo pouco natural de “deram a mão” no corpo do versículo quanto a inserção não marcada de terminologia sacrificial técnica.
