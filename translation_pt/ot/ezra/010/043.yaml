base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/043.yaml
  text: 'From the sons of Nebo: Jeiel[a], Mattithiah, Zabad, Zebina, Jaddai, Joel, and Benaiah.'
translation:
  language: pt
  text: 'Dos filhos de Nebo: Jeiel, Matitias, Zabade, Zebina, Jadai[a], Joel e Benaia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome hebraico traduzido como Jadai é incerto; também pode ser transliterado como Ido ou Jedo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: Dos filhos de
  rationale: A preposição מִן com בְּנֵי introduz um grupo dentro da lista maior; “Dos filhos de” é natural em português e preserva a função genealógica.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: יְעִיאֵל
  choice: Jeiel
  rationale: Forma convencional do nome hebraico em português bíblico.
- source_word: מַתִּתְיָה
  choice: Matitias
  rationale: Forma portuguesa reconhecível e convencional do nome hebraico.
- source_word: זָבָד
  choice: Zabade
  rationale: Transliteração adaptada à fonologia e à tradição ortográfica portuguesa.
- source_word: זְבִינָא
  choice: Zebina
  rationale: Transliteração direta e clara do nome próprio.
- source_word: ידו
  choice: Jadai
  rationale: O nome no texto consonantal é incerto; “Jadai” segue uma representação tradicional possível, com alternativas registradas em nota.
- source_word: וְ/יוֹאֵל
  choice: Joel
  rationale: O nome é transliterado na forma portuguesa convencional; a conjunção hebraica é representada naturalmente antes do último item da enumeração portuguesa.
- source_word: בְּנָיָה
  choice: Benaia
  rationale: Forma portuguesa convencional do nome hebraico.
