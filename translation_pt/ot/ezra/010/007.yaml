base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/007.yaml
  text: And they made a proclamation throughout Judah and Jerusalem to all the sons of the exile[a], that they should gather in Jerusalem.
translation:
  language: pt
  text: Então fizeram uma proclamação por todo o Judá e toda Jerusalém, dirigida a todos os filhos do exílio[a], para que se reunissem em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a todos os exilados» / «a todos os que voltaram do exílio». Literalmente, «a todos os filhos do exílio».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: fizeram uma proclamação
  rationale: A construção causativa com קוֹל é idiomática e descreve a divulgação pública de um aviso; esta formulação preserva o caráter oficial com naturalidade em português.
- source_word: בִּיהוּדָה וִירוּשָׁלַם
  choice: por todo o Judá e Jerusalém
  rationale: A preposição indica a área pela qual a proclamação circulou; «por todo» comunica seu alcance distributivo.
- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: a todos os filhos do exílio
  rationale: Mantém de perto a expressão hebraica e sua forma masculina, sem eliminar a referência à comunidade definida pelo exílio; uma nota esclarece o sentido idiomático.
- source_word: לְהִקָּבֵץ
  choice: para que se reunissem
  rationale: O infinitivo nifal expressa o propósito ou conteúdo da convocação; a oração final é natural em português.
- source_word: יְרוּשָׁלַם
  choice: em Jerusalém
  rationale: Com o verbo «reunir-se», «em Jerusalém» expressa naturalmente o local da assembleia.
