  terminology: «Fomos infiéis ao nosso Deus» conserva bem a noção de quebra de fidelidade de מָעַלְנוּ. «Tomamos por esposas mulheres estrangeiras» é fiel ao contexto e evita reduzir נשים a «esposas» como se fosse o termo lexical explícito.
