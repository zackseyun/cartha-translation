  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: pt
  text: 'Então Secanias, filho de Jeiel, um dos filhos de Elão, tomou a palavra e disse a Esdras: “Nós fomos infiéis ao nosso Deus e tomamos por esposas mulheres estrangeiras dentre os povos da terra. Agora, porém, há esperança para Israel quanto a isso.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apesar disso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: tomou a palavra e disse
  rationale: A fórmula hebraica literalmente combina ‘respondeu’ e ‘disse’. A expressão portuguesa comunica de modo natural o início da fala sem sugerir necessariamente que havia uma pergunta explícita.
- source_word: שְׁכַנְיָה בֶן־יְחִיאֵל
  choice: Secanias, filho de Jeiel
  rationale: Emprega formas tradicionais e reconhecíveis dos nomes bíblicos em português e mantém explicitamente a relação filial.
- source_word: מִבְּנֵי עוֹלָם
  choice: um dos filhos de Elão
  rationale: Neste contexto, עוֹלָם representa o nome próprio Elão e a expressão identifica o grupo familiar ou clã; ‘um dos filhos de Elão’ preserva esse modo bíblico de identificação.
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: fomos infiéis ao nosso Deus
  rationale: O verbo מעל indica infidelidade ou quebra de lealdade, especialmente perante Deus. ‘Fomos infiéis’ mantém esse peso relacional e pactual sem reduzi-lo ao termo genérico ‘pecamos’.
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: tomamos por esposas mulheres estrangeiras
  rationale: O uso verbal no contexto se refere a estabelecer união conjugal. A formulação deixa claro o sentido matrimonial, ao mesmo tempo que traduz נָשִׁים נָכְרִיּוֹת como ‘mulheres estrangeiras’.
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: dentre os povos desta terra
  rationale: Mantém o plural ‘povos’ e expressa com naturalidade que as mulheres procediam das populações da terra.
- source_word: וְעַתָּה יֵשׁ מִקְוֶה לְיִשְׂרָאֵל
  choice: Contudo, ainda há esperança para Israel
  rationale: ‘Contudo’ marca a virada retórica da confissão para a esperança; ‘ainda há esperança’ é português corrente e preserva a afirmação existencial do hebraico.
- source_word: עַל־זֹאת
  choice: quanto a isso
  rationale: A expressão pode indicar o assunto em questão ou, contextualmente, uma esperança que permanece apesar da situação. ‘Quanto a isso’ conserva a referência ampla e evita decidir em excesso.
theological_decisions:
- issue: A dimensão de quebra de fidelidade em מָעַלְנוּ
  choice: fomos infiéis ao nosso Deus
  alternative: pecamos contra o nosso Deus; traímos a confiança do nosso Deus
  rationale: A escolha conserva a gravidade relacional e pactual do verbo sem acrescentar uma formulação doutrinária não expressa no versículo.
- issue: A natureza das uniões com נָשִׁים נָכְרִיּוֹת
  choice: tomamos por esposas mulheres estrangeiras
  alternative: casamos com mulheres estrangeiras; fizemos morar conosco mulheres estrangeiras
  rationale: O contexto imediato trata de uniões matrimoniais. A tradução torna esse sentido inteligível, mas mantém ‘mulheres estrangeiras’ em vez de substituir o substantivo por uma caracterização teológica mais específica.
- issue: A relação semântica de עַל־זֹאת com a esperança de Israel
  choice: quanto a isso
  alternative: apesar disso
  rationale: O hebraico admite uma referência ao assunto ou situação presente, enquanto o contexto pode favorecer uma nuance concessiva. A tradução principal preserva a formulação menos resolutiva, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém expressões bíblicas reconhecíveis como ‘filhos de Elão’, mas evita o hebraísmo pouco natural ‘respondeu e disse’. A única nota registra a ambiguidade real da expressão final.
