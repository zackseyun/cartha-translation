base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/033.yaml
  text: 'From the sons of Hashum: Mattenai[a], Mattattah, Zabad, Eliphelet, Jeremai, Manasseh, and Shimei.'
translation:
  language: pt
  text: 'Dos filhos de Hasum: Matenai, Matatá, Zabade, Elifelete, Jeremai, Manassés e Simeí.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי חָשֻׁם
  choice: Dos filhos de Hasum
  rationale: A construção introduz, no contexto da lista, membros pertencentes à família de Hasum. “Dos filhos de” preserva de modo natural em português a força genealógica.
- source_word: מַתְּנַי
  choice: Matenai
  rationale: Transliteração do nome próprio segundo convenções legíveis em português.
- source_word: מַתַּתָּה
  choice: Matatá
  rationale: Forma aportuguesada que representa a pronúncia massorética do nome e distingue este nome de Matenai.
- source_word: זָבָד
  choice: Zabade
  rationale: Transliteração aportuguesada do nome próprio, com vogal final de apoio conforme uso bíblico corrente em português.
- source_word: אֱלִיפֶלֶט
  choice: Elifelete
  rationale: Forma tradicional e legível em português para o nome hebraico.
- source_word: יְרֵמַי
  choice: Jeremai
  rationale: Transliteração direta e natural do nome próprio em português.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma consagrada nas traduções bíblicas em português.
- source_word: שִׁמְעִי
  choice: Simeí
  rationale: Forma tradicional em português, com acento para indicar corretamente a tonicidade.
