base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/028.yaml
  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: pt
  text: 'E dos filhos de Bebai[a]: Jeoanã[b], Hananias, Zabai e Atlai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “filhos de” pode referir-se, de modo mais amplo, aos descendentes ou membros da família de Bebai.
    reason: lexical_alternative
  - marker: b
    text: O nome Jeoanã também aparece em forma abreviada como “Joanã”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: E dos filhos de
  rationale: Mantém a forma hebraica — conjunção, preposição e plural construto — em português natural. Neste contexto de lista familiar, “filhos” também pode designar descendentes ou membros de uma linhagem.
- source_word: בֵּבָי
  choice: Bebai
  rationale: Nome próprio de pessoa ou família, transliterado de modo claro em português.
- source_word: יְהוֹחָנָן
  choice: Jeoanã
  rationale: Transliteração portuguesa que preserva a forma mais completa do nome hebraico e seu elemento teofórico, em vez da forma abreviada “Joanã”.
- source_word: חֲנַנְיָה
  choice: Hananias
  rationale: Forma tradicional e reconhecível em português para este nome hebraico.
- source_word: זַבַּי
  choice: Zabai
  rationale: Transliteração direta e legível do nome hebraico em português.
- source_word: עַתְלָי
  choice: Atlai
  rationale: Transliteração direta do nome hebraico, com grafia natural em português.
