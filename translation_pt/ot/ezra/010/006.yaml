  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: pt
  text: Então Esdras se levantou de diante da casa de Deus e foi à câmara de Jeoanã, filho de Eliasibe.[a] Ele foi para lá e não comeu pão nem bebeu água, pois estava de luto por causa da infidelidade dos exilados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome também pode ser transliterado “Joanã”.
    reason: lexical_alternative
  - marker: b
    text: “Os exilados” refere-se aqui à comunidade que havia retornado do exílio. “Infidelidade” também pode ser traduzida por “traição” ou “quebra de fidelidade”.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: de diante da casa de Deus
  rationale: Preserva a expressão espacial hebraica e a designação literal do templo, em linguagem compreensível e solene.
- source_word: לִשְׁכַּת
  choice: à câmara
  rationale: O termo designa uma sala ou dependência de um complexo religioso ou oficial; “câmara” conserva esse sentido arquitetônico.
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: Jeoanã, filho de Eliasibe
  rationale: Emprega formas portuguesas reconhecíveis e próximas da transliteração dos nomes hebraicos.
- source_word: וַיֵּלֶךְ שָׁם
  choice: Ele foi para lá
  rationale: Mantém a repetição e a formulação abrupta do hebraico, sem interpretar o verbo como “entrou” ou “permaneceu”.
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: não comeu pão nem bebeu água
  rationale: Conserva os objetos concretos do hebraico e a expressão de jejum total.
- source_word: מִתְאַבֵּל
  choice: estava de luto
  rationale: Expressa o estado continuado de lamentação, ao qual o jejum está ligado.
- source_word: מַעַל
  choice: infidelidade
  rationale: Comunica quebra de fidelidade, inclusive em seu peso comunitário e pactual, sem restringi-la a uma categoria apenas jurídica.
- source_word: הַגּוֹלָה
  choice: os exilados
  rationale: Traduz concisamente o coletivo hebraico; no contexto de Esdras, refere-se à comunidade que retornou do exílio.
theological_decisions:
- issue: Sentido de מַעַל no contexto da quebra de fidelidade da comunidade
  choice: infidelidade
  alternative: traição; transgressão; quebra de fidelidade
  rationale: “Infidelidade” preserva o peso moral e pactual do termo sem explicitar além do que o versículo afirma.
- issue: Tradução de בֵּית הָאֱלֹהִים
  choice: casa de Deus
  alternative: templo de Deus
  rationale: A formulação literal é clara em português e mantém a expressão reverente do texto hebraico.
- issue: Identidade de הַגּוֹלָה
  choice: os exilados
  alternative: a comunidade dos exilados; os exilados que voltaram
  rationale: A forma breve preserva a designação do texto; uma nota esclarece que se trata da comunidade pós-exílica retornada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém a repetição do verbo “ir”, a expressão “casa de Deus” e as imagens concretas de não comer pão nem beber água.
