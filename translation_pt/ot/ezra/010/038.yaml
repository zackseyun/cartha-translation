- source_word: וּ/בִנּוּי
  choice: Binui
  rationale: בִנּוּי é nome próprio, transliterado na forma portuguesa convencional “Binui”. Embora o hebraico tenha וּ, em português a coordenação seriada fica natural com a conjunção antes do último nome.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: שִׁמְעִי é nome próprio, vertido pela forma portuguesa consagrada “Simei”. A conjunção portuguesa antes do último item explicita naturalmente a coordenação já presente na sequência hebraica.
