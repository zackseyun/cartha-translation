base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: pt
  text: Então Esdras se levantou e fez os chefes dos sacerdotes, os levitas e todo o Israel jurarem que fariam conforme esta palavra[a]; e eles juraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «conforme este assunto» ou «conforme esta proposta». A palavra hebraica pode se referir tanto a uma palavra dita quanto ao assunto em discussão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Traduz o wayyiqtol de קום com naturalidade e conserva o movimento narrativo decidido de Esdras.
- source_word: וַיַּשְׁבַּע
  choice: fez ... jurarem
  rationale: 'Preserva a força causativa do hifil de שׁבע: Esdras levou os grupos mencionados a prestar juramento.'
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: os chefes dos sacerdotes
  rationale: Expressa de modo direto que שָׂרֵי designa os dirigentes entre os sacerdotes, sem necessariamente importar o título técnico posterior «sumos sacerdotes».
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: É a designação portuguesa tradicional e precisa do grupo לְוִיִּם.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico, em formulação natural em português.
- source_word: לַעֲשׂוֹת
  choice: que fariam
  rationale: Representa o infinitivo de propósito/conteúdo ligado ao juramento e produz uma construção idiomática em português.
- source_word: כַּדָּבָר הַזֶּה
  choice: conforme esta palavra
  rationale: Mantém a proximidade lexical com דָּבָר e preserva sua possível referência tanto ao que foi dito quanto ao assunto ou proposta em discussão.
- source_word: וַיִּשָּׁבֵעוּ
  choice: e eles juraram
  rationale: Conserva a repetição enfática do verbo שׁבע e declara diretamente que o juramento foi prestado.
