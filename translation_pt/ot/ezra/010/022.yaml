  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: pt
  text: 'E dos filhos de Pasur: Elioenai, Maaseias, Ismael, Natanael, Jozabade e Elasa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: E dos filhos de
  rationale: A combinação da conjunção, da preposição e do plural construto de בֵּן introduz outro grupo dentro da lista; «E dos filhos de» preserva a ligação e o sentido partitivo de modo natural em português.
- source_word: פַּשְׁחוּר
  choice: Pasur
  rationale: Nome próprio transliterado segundo a forma bíblica portuguesa corrente e com boa legibilidade em português.
- source_word: אֶלְיוֹעֵינַי
  choice: Elioenai
  rationale: Transliteração portuguesa reconhecível do nome próprio hebraico.
- source_word: מַעֲשֵׂיָה
  choice: Maaseias
  rationale: Forma tradicional e reconhecível em português para o nome próprio hebraico.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Forma bíblica portuguesa consagrada para o nome próprio.
- source_word: נְתַנְאֵל
  choice: Natanael
  rationale: Forma bíblica portuguesa corrente e reconhecível para o nome próprio.
- source_word: יוֹזָבָד
  choice: Jozabade
  rationale: Transliteração adaptada à ortografia e à pronúncia usuais em português.
- source_word: וְ/אֶלְעָשָׂה
  choice: e Elasa
  rationale: A conjunção prefixada é expressa por «e», e o nome próprio é transliterado em forma natural para leitores de português.
