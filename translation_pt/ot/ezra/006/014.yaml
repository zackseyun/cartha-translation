revisions:
- from: E os anciãos dos judeus continuavam construindo e prosperando por meio da profecia do profeta Ageu e de Zacarias, filho de Ido.[a] Eles construíram e terminaram a obra por decreto do Deus de Israel e por decreto de Ciro, Dario e Artaxerxes, rei da Pérsia.[b][c]
  to: E os anciãos dos judeus construíam e prosperavam[a] por meio da profecia do profeta Ageu e de Zacarias, filho de Ido. Eles construíram e concluíram a obra por decreto[b] do Deus de Israel e por decreto de Ciro, Dario e Artaxerxes, rei da Pérsia.[c]
  rationale: A revisão elimina a nuance adicional de continuidade em “continuavam construindo”, usando o imperfeito simples para o particípio de ação em curso. Mantém-se a representação dos dois verbos finais como “construíram e concluíram a obra”, com “a obra” como objeto contextualmente recuperável. As âncoras das notas foram reposicionadas para corresponderem aos termos que explicam.
