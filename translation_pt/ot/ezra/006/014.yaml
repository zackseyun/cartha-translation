  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: pt
  text: E os anciãos dos judeus construíam e prosperavam[a] por meio da profecia do profeta Ageu e de Zacarias, filho de Ido. Eles construíram e concluíram a obra por decreto[b] do Deus de Israel e por decreto de Ciro, Dario e Artaxerxes, rei da Pérsia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo sucesso” ou “fazendo progresso”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por ordem de”, tanto aqui como na ocorrência seguinte.
    reason: lexical_alternative
  - marker: c
    text: O versículo atribui a conclusão da obra tanto ao decreto de Deus quanto aos decretos dos reis persas, mencionando primeiro o decreto de Deus.
    reason: cross_reference
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: os anciãos dos judeus
  rationale: Expressa de modo transparente a função comunitária dos líderes e a designação étnica, sem restringi-los geograficamente a Judá.
- source_word: בָּנַיִן
  choice: continuavam construindo
  rationale: O particípio aramaico indica ação em andamento; “continuavam construindo” preserva esse aspecto no contexto narrativo.
- source_word: וּמַצְלְחִין
  choice: e prosperando
  rationale: Mantém o campo semântico de prosperar e ter êxito, deixando em aberto as alternativas “tendo sucesso” e “fazendo progresso”.
- source_word: בִּנְבוּאַת
  choice: por meio da profecia de
  rationale: 'A preposição indica meio ou instrumentalidade: a atuação profética foi o meio pelo qual a obra prosperou.'
- source_word: חַגַּי נביאה
  choice: do profeta Ageu
  rationale: Tradução natural da aposição entre o nome e o título.
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: e de Zacarias, filho de Ido
  rationale: “Filho de” é o equivalente português normal do marcador filial aramaico בַּר.
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: Eles construíram e terminaram a obra
  rationale: Preserva os dois verbos coordenados do aramaico — construir e completar — de maneira natural, explicitando como “a obra” o objeto recuperável do contexto.
- source_word: מִן טַעַם
  choice: por decreto de
  rationale: No aramaico imperial, a expressão pode designar decreto, ordem ou autorização oficial; “por decreto de” funciona tanto para Deus quanto para os reis.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reprodução direta e tradicional do título genitivo.
- source_word: וּמִטְּעֵם כּוֹרֶשׁ וְדָרְיָוֶשׁ וְאַרְתַּחְשַׁשְׂתְּא
  choice: e por decreto de Ciro, Dario e Artaxerxes
  rationale: Repete a estrutura da autorização divina e apresenta de forma idiomática a lista dos reis persas.
- source_word: מֶלֶךְ פָּרָס
  choice: rei da Pérsia
  rationale: Conserva o título singular do texto e sua ligação formal mais imediata com o último nome da lista, sem alterar para o plural.
theological_decisions:
- issue: Relação entre a autorização divina e a imperial
  choice: A conclusão da obra é atribuída ao decreto do Deus de Israel e também aos decretos dos reis persas, com Deus mencionado primeiro.
  alternative: Entender os decretos reais explicitamente como simples expressões subordinadas do decreto divino.
  rationale: O versículo apresenta ambas as autorizações, mas não explica diretamente a relação teológica entre elas; a tradução conserva essa tensão sem acrescentar uma hierarquia além da ordem textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “anciãos”, “profecia” e “decreto” por serem termos bíblicos correntes e claros. A pontuação evita uma cadeia pesada de conjunções, sem apagar a coordenação do original.
