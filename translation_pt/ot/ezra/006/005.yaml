base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: pt
  text: Além disso, os utensílios de ouro e de prata da casa de Deus, que Nabucodonosor retirou do templo de Jerusalém e levou para a Babilônia, sejam devolvidos e levados ao templo de Jerusalém, cada um para o seu lugar[a]; e você os colocará na casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sejam restituídos, e sigam para o templo de Jerusalém, cada um para o seu lugar». A formulação aramaica neste trecho é um tanto difícil, mas o sentido é que os utensílios do templo devem ser restituídos aos seus devidos lugares em Jerusalém.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: Além disso
  rationale: Introduz mais uma determinação do decreto e preserva a força aditiva em português natural.
- source_word: מָאנֵי
  choice: utensílios
  rationale: Designa de modo amplo os objetos usados ou guardados no templo; é mais claro no português atual do que «vasos».
- source_word: בֵית אֱלָהָא
  choice: casa de Deus
  rationale: Mantém a expressão literal e a distingue de הֵיכְלָא, traduzido por «templo».
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: de ouro e de prata
  rationale: Expressa naturalmente em português o material de que eram feitos os utensílios.
- source_word: הַנְפֵּק
  choice: retirou
  rationale: Comunica o sentido causativo de fazer sair ou remover do templo.
- source_word: הֵיכְלָא
  choice: templo
  rationale: No contexto, refere-se inequivocamente ao templo de Jerusalém e preserva a distinção lexical em relação a «casa de Deus».
- source_word: וְהֵיבֵל
  choice: levou
  rationale: Descreve com naturalidade o transporte dos utensílios de Jerusalém para a Babilônia.
- source_word: יַהֲתִיבוּן
  choice: sejam devolvidos
  rationale: Reproduz a ordem de restituição dos utensílios sob a forma passiva.
- source_word: וִיהָךְ
  choice: e levados
  rationale: A forma aramaica é difícil; no contexto, dá continuidade ao movimento de restituição em direção ao templo de Jerusalém sem resolver excessivamente a construção.
- source_word: לְאַתְרֵהּ
  choice: cada um para o seu lugar
  rationale: 'O singular sufixado favorece uma leitura distributiva: cada utensílio deve voltar ao lugar que lhe corresponde.'
- source_word: וְתַחֵת
  choice: e você os colocará
  rationale: Mantém a segunda pessoa masculina singular dirigida ao oficial responsável e a força normativa do decreto.
- source_word: בְּבֵית אֱלָהָא
  choice: na casa de Deus
  rationale: Repete a formulação da fonte e enquadra o templo como a casa de Deus.
