  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: pt
  text: E que o Deus que fez o seu nome habitar ali[a] derrube qualquer rei ou povo que estenda a mão para alterar isto e destruir esta casa de Deus que está em Jerusalém. Eu, Dario, promulguei o decreto; que ele seja cumprido com toda a diligência.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôs ali o seu nome”. A expressão aramaica associa o nome de Deus ao templo como o lugar associado ao seu nome.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem demora”. O advérbio pode enfatizar a execução rápida; “com toda a diligência” também comunica o cuidado exigido no cumprimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: fez seu nome habitar ali
  rationale: Preserva a construção causativa e a expressão bíblica que associa o nome de Deus ao templo, sem afirmar que Deus esteja espacialmente limitado a ele.
- source_word: יְמַגַּר
  choice: derrube
  rationale: Expressa a queda imposta em juízo e se ajusta ao tom de maldição da fórmula régia.
- source_word: כָּל מֶלֶךְ וְעַם
  choice: qualquer rei ou povo
  rationale: Transmite naturalmente o alcance distributivo da ameaça contra quem quer que se oponha ao decreto.
- source_word: יִשְׁלַח יְדֵהּ
  choice: estenda a mão
  rationale: Mantém a metáfora semítica de tomar medidas contra algo e é inteligível em português.
- source_word: לְהַשְׁנָיָה
  choice: para mudar isso
  rationale: Conserva a referência concisa e um tanto aberta ao que foi estabelecido no decreto, sem explicitar um antecedente que o aramaico não nomeia.
- source_word: לְחַבָּלָה בֵּית אֱלָהָא דֵךְ
  choice: e destruir esta casa de Deus
  rationale: Comunica a gravidade do ato visado e mantém o demonstrativo referente ao templo em questão.
- source_word: שָׂמֶת טְעֵם
  choice: promulguei o decreto
  rationale: Equivalente português claro para a fórmula administrativa imperial de emitir oficialmente uma ordem.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: que ele seja cumprido com toda a diligência
  rationale: Reproduz a força exortativa da fórmula final e abrange tanto a pronta execução quanto o cumprimento cuidadoso.
theological_decisions:
- issue: Teologia do nome divino associada ao templo
  choice: fez seu nome habitar ali
  alternative: pôs ali o seu nome
  rationale: A formulação mantém a expressão bíblica da identificação pactual de Deus com o templo, sem reduzi-la a mera posse nem sugerir que a própria essência de Deus esteja confinada ao lugar.
- issue: Objeto implícito de לְהַשְׁנָיָה
  choice: mudar isso
  alternative: mudar este decreto
  rationale: O aramaico não explicita o objeto da mudança; conservar “isso” evita resolver indevidamente se a referência imediata é ao decreto, ao arranjo estabelecido ou à situação do templo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe direta. Mantém-se a metáfora “estenda a mão”, a expressão teológica do nome que habita no templo e a concisão oficial da conclusão do decreto.
