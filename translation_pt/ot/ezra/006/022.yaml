  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: pt
  text: Celebraram a Festa dos Pães sem Fermento durante sete dias, com alegria, pois Yahweh os havia alegrado[a] e fizera o coração do rei da Assíria[b] voltar-se para eles[c], a fim de fortalecer as mãos deles[d] no trabalho da casa de Deus, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os havia feito alegrar-se”.'
    reason: Alternativa lexical que explicita a força causativa do verbo hebraico.
  - marker: b
    text: 'Hebraico: “rei da Assíria”. Embora o governante dos dias de Esdras fosse persa, o texto emprega essa designação imperial mais antiga, possivelmente com referência ao domínio que abrangia o antigo território assírio.'
    reason: Nota histórico-cultural que preserva no texto principal a designação hebraica sem harmonização.
  - marker: c
    text: 'Ou: “havia inclinado o coração do rei da Assíria em direção a eles”.'
    reason: Alternativa lexical que conserva a imagem de inclinar ou voltar o coração e a direção expressa no hebraico, sem explicitar interpretativamente a ideia de favor.
  - marker: d
    text: “Fortalecer as mãos” é uma expressão hebraica que significa dar força, apoio ou ânimo.
    reason: Esclarecimento de uma metáfora hebraica preservada na tradução.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Celebraram
  rationale: Com uma festa como objeto, עשה significa idiomaticamente celebrar ou observar, não simplesmente “fazer”.
- source_word: חַג מַצּוֹת
  choice: a Festa dos Pães sem Fermento
  rationale: Forma clara e corrente em português para o nome da festa; evita o termo menos transparente “ázimos” no texto principal.
- source_word: בְּשִׂמְחָה
  choice: com alegria
  rationale: Preserva o substantivo hebraico e funciona naturalmente como expressão adverbial.
- source_word: שִׂמְּחָם
  choice: os havia alegrado
  rationale: 'Expressa de modo conciso a força causativa do piel: Yahweh foi quem lhes causou alegria.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: וְהֵסֵב לֵב
  choice: e fizera o coração ... voltar-se
  rationale: Conserva a imagem hebraica de mudar ou redirecionar a disposição interior, com sintaxe natural em português.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: o rei da Assíria
  rationale: Mantém a designação histórica explícita do hebraico, sem harmonizá-la silenciosamente com o contexto persa.
- source_word: עֲלֵיהֶם
  choice: para eles
  rationale: Com “voltar-se”, indica direção e conserva a formulação sem explicitar além do texto que se tratava de favor, embora isso esteja implícito.
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: a fim de fortalecer as mãos deles
  rationale: Mantém tanto a relação de finalidade quanto a metáfora hebraica de conceder força, apoio ou ânimo.
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: no trabalho da casa de Deus
  rationale: Reproduz a relação entre o fortalecimento e a obra realizada na casa de Deus.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva em vez de substituí-lo por um título.
- issue: Designação “rei da Assíria” em contexto do período persa
  choice: Manter “o rei da Assíria” no texto principal
  alternative: o rei persa; o rei que governava a Assíria
  rationale: O hebraico diz expressamente “rei da Assíria”. Alterar a designação para harmonizá-la historicamente eliminaria uma tensão real do texto; a observação histórica fica na nota.
- issue: Agência divina na alegria e no apoio à obra
  choice: Preservar Yahweh como aquele que lhes causou alegria e fez o coração do rei voltar-se para eles
  alternative: Formulações passivas ou impessoais
  rationale: A sintaxe hebraica atribui diretamente a Yahweh as duas ações, sem explicar o mecanismo pelo qual influenciou o rei.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Pães sem Fermento” privilegia transparência para leitores comuns. A ordem foi levemente ajustada para fluência, mas foram mantidas a agência divina, a finalidade da ação e as imagens centrais do hebraico.
