base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/019.yaml
  text: And the sons of the exile kept the Passover on the fourteenth day of the first month[a].
translation:
  language: pt
  text: Os exilados[a] celebraram a Páscoa no décimo quarto dia do primeiro mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «os filhos do exílio»; também se pode traduzir por «os filhos do cativeiro». A expressão hebraica designa coletivamente os exilados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: celebraram
  rationale: Embora o verbo signifique literalmente «fizeram», quando tem הַפֶּסַח por objeto expressa a realização da observância pascal. «Celebraram» é idiomático e claro em português.
- source_word: בְנֵי הַגּוֹלָה
  choice: os exilados
  rationale: A expressão hebraica, literalmente «os filhos do exílio», é um idiomatismo coletivo que designa a comunidade exilada. «Os exilados» comunica naturalmente essa identidade sem restringir o grupo aos homens nem acrescentar explicitamente que já haviam retornado.
- source_word: הַפָּסַח
  choice: a Páscoa
  rationale: No contexto, o termo abrange a observância pascal sem exigir que a tradução especifique apenas o sacrifício, a refeição ou a festa.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: no décimo quarto dia
  rationale: O hebraico emprega o cardinal «catorze» numa fórmula de data; em português, a inclusão de «dia» e o uso do ordinal tornam a data clara e natural.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: do primeiro mês
  rationale: Completa naturalmente a fórmula de data e representa de perto a relação expressa no hebraico.
