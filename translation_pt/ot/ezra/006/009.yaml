base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: pt
  text: E tudo o que for necessário — novilhos, carneiros e cordeiros para holocaustos ao Deus dos céus, trigo, sal, vinho e azeite, conforme a palavra[a] dos sacerdotes que estão em Jerusalém — seja dado a eles, dia após dia, sem falta[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme a instrução dos sacerdotes que estão em Jerusalém”. A expressão aramaica diz literalmente “conforme a palavra dos sacerdotes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sem interrupção” ou “sem que haja omissão”. A frase final enfatiza que o fornecimento diário não deveria cessar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: E tudo o que for necessário
  rationale: A expressão aramaica reúne o indefinido “tudo o que” com a ideia de necessidade; esta formulação é natural em português e mantém o caráter abrangente da ordem administrativa.
- source_word: בְנֵי תוֹרִין
  choice: novilhos
  rationale: A expressão literalmente significa “filhos de bois” e designa bovinos machos jovens apropriados para o sacrifício; “novilhos” é conciso e preciso.
- source_word: דִכְרִין
  choice: carneiros
  rationale: O termo designa ovinos machos adultos, especialmente adequado à lista sacrificial.
- source_word: אִמְּרִין
  choice: cordeiros
  rationale: Equivalente direto e natural para os animais jovens mencionados na lista.
- source_word: לַעֲלָוָן
  choice: para holocaustos
  rationale: Designa ofertas inteiramente queimadas; “holocaustos” é o termo bíblico consagrado em português e preserva a especificidade cultual.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: ao Deus dos céus
  rationale: Preserva o título divino característico do aramaico de Esdras e se ajusta naturalmente ao destino dos sacrifícios.
- source_word: חִנְטִין מְלַח חֲמַר וּמְשַׁח
  choice: trigo, sal, vinho e azeite
  rationale: Mantém os itens específicos da provisão; “azeite” é o equivalente contextual mais natural para óleo alimentar e cultual no português bíblico.
- source_word: כְּמֵאמַר
  choice: conforme a palavra
  rationale: Mantém de perto o sentido literal de “segundo a palavra”, sem eliminar a possível nuance administrativa de instrução ou determinação.
- source_word: יוֹם בְּיוֹם
  choice: dia após dia
  rationale: Expressa com naturalidade a distribuição diária e contínua exigida pelo decreto.
- source_word: דִי לָא שָׁלוּ
  choice: sem falta
  rationale: Formulação idiomática que comunica que as provisões não deveriam faltar nem sofrer interrupção.
