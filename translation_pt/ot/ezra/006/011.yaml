id: EZR.6.11
reference: Ezra 6:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: pt
  text: 'Também decreto o seguinte: se alguém alterar este édito, uma viga será arrancada de sua casa, e essa pessoa será empalada nela[a]; e, por causa disso, sua casa será transformada num monte de lixo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será pendurada nela”. O aramaico descreve a pessoa erguida ou fixada na madeira, sem detalhar o método exato.'
    reason: alternative_reading
  - marker: b
    text: 'Tradicionalmente: “monturo” ou “esterqueira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: Também decreto o seguinte
  rationale: A expressão administrativa aramaica significa literalmente estabelecer uma ordem ou decreto. A formulação portuguesa é natural, conserva a autoridade pessoal do rei indicada por וּמִנִּי e introduz claramente o conteúdo da sanção.
- source_word: יְהַשְׁנֵא
  choice: alterar
  rationale: No contexto de um édito imperial, o verbo indica mudar ou adulterar o texto oficial, não apenas desobedecer-lhe.
- source_word: פִּתְגָמָא דְנָה
  choice: este édito
  rationale: O termo aramaico designa aqui uma determinação oficial. “Édito” mantém o caráter jurídico e imperial do documento.
- source_word: כָל אֱנָשׁ
  choice: alguém
  rationale: 'Embora a expressão esteja no singular, seu alcance é genérico: qualquer indivíduo que altere o édito. “Alguém” comunica esse sentido com naturalidade no português atual.'
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: uma viga será arrancada de sua casa
  rationale: A frase descreve a retirada de uma peça de madeira da própria casa do infrator. “Viga” é concreta e adequada à construção, enquanto “arrancada” preserva a força da remoção.
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: essa pessoa será empalada nela
  rationale: A construção descreve a pessoa erguida ou fixada na madeira retirada da casa. “Empalada” representa melhor a punição antiga do que uma formulação que sugira especificamente o enforcamento por corda; a alternativa permanece em nota.
- source_word: נְוָלוּ
  choice: monte de lixo
  rationale: O substantivo indica um lugar de imundície, rejeitos e desonra. A expressão escolhida é clara no português moderno e mantém a degradação pública da casa.
- source_word: יִתְעֲבֵד
  choice: será transformada
  rationale: A forma passiva integra uma fórmula legal de punição. “Será transformada” expressa naturalmente que a casa sofrerá essa destinação.
theological_decisions:
- issue: Natureza da pena expressa pela linguagem imperial
  choice: Traduzir no texto principal como “será empalada nela”
  alternative: “será pendurada nela”
  rationale: O aramaico indica que a pessoa seria levantada ou fixada na peça de madeira extraída de sua casa, mas não especifica com precisão técnica todos os detalhes do procedimento. “Empalada” situa melhor a cena nas práticas punitivas antigas e evita a imagem moderna de enforcamento por corda; a alternativa mais ampla é registrada em nota para preservar a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe própria de decreto real. Evitou-se linguagem jurídica excessivamente arcaica. “Essa pessoa” retoma o referente genérico sem introduzir distinção de gênero ausente do alcance da proibição.
