base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: pt
  text: Pois os sacerdotes e os levitas haviam se purificado em conjunto; todos estavam puros. Eles abateram o cordeiro pascal para todos os filhos do exílio, para seus irmãos, os sacerdotes, e para si mesmos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: como um só
  rationale: Preserva a expressão hebraica de unidade coletiva, em vez de reduzi-la apenas ao sentido temporal de “juntos”.
- source_word: בְנֵי הַגּוֹלָה
  choice: os exilados
  rationale: Expressa em português natural o grupo dos que pertenciam à comunidade do exílio; a tradução literal “filhos do exílio” seria menos clara ao leitor comum.
- source_word: הַפֶּסַח
  choice: o cordeiro da Páscoa
  rationale: No contexto, o termo designa o animal sacrificial pascal que foi morto, não simplesmente a festa.
- source_word: וַיִּשְׁחֲטוּ
  choice: mataram
  rationale: Verbo claro e corrente para o abate ritual do animal; evita uma formulação excessivamente técnica.
theological_decisions:
- issue: Identidade do sujeito que matou o cordeiro pascal
  choice: Mantém “eles” retomando conjuntamente sacerdotes e levitas
  alternative: Entender o sujeito como apenas os levitas
  rationale: A forma verbal plural retoma naturalmente os dois grupos mencionados, e o verso não restringe explicitamente a ação somente aos levitas.
- issue: Sentido de כְאֶחָד
  choice: como um só
  alternative: juntos
  rationale: Conserva a ênfase textual na unidade dos sacerdotes e levitas sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A estrutura preserva a repetição enfática de que todos estavam puros e mantém a sequência dos beneficiários do sacrifício.
