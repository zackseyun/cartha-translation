base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/016.yaml
  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: pt
  text: Os filhos de Israel, os sacerdotes, os levitas e os demais exilados[a] celebraram com alegria a dedicação desta casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os demais filhos do exílio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: celebraram
  rationale: No contexto cerimonial, o verbo indica realizar ou observar a dedicação; “celebraram” é natural em português e se ajusta ao objeto direto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo inteligível a expressão aramaica e apresenta o grupo abrangente, especificado pelos termos seguintes.
- source_word: כָּהֲנַיָּא
  choice: os sacerdotes
  rationale: Equivalente português padrão para a classe sacerdotal.
- source_word: וְלֵוָיֵא
  choice: os levitas
  rationale: Equivalente português padrão para os levitas ligados ao serviço do templo.
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: e os demais exilados
  rationale: Expressa naturalmente o sentido da construção literal “o restante dos filhos do exílio”, referindo-se aos demais membros da comunidade exilada.
- source_word: חֲנֻכַּת
  choice: a dedicação
  rationale: Tradução direta do substantivo que designa a dedicação de uma casa ou altar.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: desta casa de Deus
  rationale: Mantém a terminologia concreta “casa de Deus” sem substituí-la pela interpretação “templo”.
- source_word: בְּחֶדְוָה
  choice: com alegria
  rationale: Reproduz claramente a construção preposição mais substantivo e o modo jubiloso da celebração.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões deixam claro que sacerdotes, levitas e demais exilados especificam os “filhos de Israel”, evitando a impressão de quatro grupos independentes. A formulação preserva “casa de Deus” e registra em nota a expressão aramaica mais literal.
