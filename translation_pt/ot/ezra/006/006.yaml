source:
  edition: WLC
  text: כְּעַ֡ן תַּ֠תְּנַי פַּחַ֨ת עֲבַֽר נַהֲרָ֜/ה שְׁתַ֤ר בּוֹזְנַי֙ וּ/כְנָוָ֣תְ/ה֔וֹן אֲפַרְסְכָיֵ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה רַחִיקִ֥ין הֲו֖וֹ מִן תַּמָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: pt
  text: Agora, Tatenai, governador do Além do Rio[a], Setar-Bozenai e seus colegas, os afarsaquitas[b] que estão no Além do Rio, mantenham-se longe dali.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Além do Rio” era a designação administrativa persa para o território situado a oeste do rio Eufrates.
    reason: cultural_note
  - marker: b
    text: 'Ou: “os funcionários persas”. O sentido exato do termo aramaico é incerto.'
    reason: alternative_reading
  - marker: c
    text: 'Mais literalmente: “estejam longe dali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Agora
  rationale: Marca a transição para a ordem real de modo natural, sem impor uma relação estritamente conclusiva.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Transliteração portuguesa clara do nome próprio aramaico.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: governador do Além do Rio
  rationale: פַּחַת designa um governador imperial, e עֲבַר נַהֲרָה funciona como designação administrativa persa do território a oeste do Eufrates. A tradução evita acrescentar no corpo do texto a palavra 'província', que está implícita, mas não expressa.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Setar-Bozenai
  rationale: Transliteração portuguesa do nome próprio composto.
- source_word: וּכְנָוָתְהוֹן
  choice: e seus colegas
  rationale: O substantivo indica companheiros ou associados, e o sufixo de segunda pessoa do plural corresponde ao discurso direto dirigido aos destinatários.
- source_word: אֲפַרְסְכָיֵא
  choice: os afarsaquitas
  rationale: O sentido exato do termo administrativo ou gentílico é incerto. A transliteração preserva essa incerteza, enquanto a nota apresenta a interpretação possível como funcionários persas.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: que estão no Além do Rio
  rationale: A oração relativa localiza os afarsaquitas no distrito imperial chamado Além do Rio.
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: mantenham-se longe dali
  rationale: Reproduz como ordem natural em português a construção aramaica de sentido literal 'estejam longe dali'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a designação imperial “Além do Rio” e preserva-se, por transliteração acompanhada de nota, a incerteza lexical de אֲפַרְסְכָיֵא.
