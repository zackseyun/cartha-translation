review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a ordem de não interferir, a identificação do governador e dos anciãos, a autorização em forma jussiva para reconstruir e a localização da reconstrução. Contudo, «próprio» acrescenta uma ênfase possessiva que não está expressa em עַל אַתְרֵהּ, e a âncora da nota está ligada a «casa de Deus», embora a nota trate de יְהוּדָיֵא («judeus»).
  naturalness: «Deixem em paz a obra desta casa de Deus» e «Que ... reconstruam» são formulações naturais, claras e adequadas ao tom administrativo do decreto. «Em seu lugar» é mais direto e idiomático do que «no seu próprio local», sem introduzir ênfase adicional.
  terminology: «Governador», «anciãos», «casa de Deus» e «judeus» são escolhas adequadas. A alternativa «judeanos» deve ser apresentada como alternativa de tradução do termo aramaico e a âncora deve incidir sobre a ocorrência relevante de «judeus».
  issues:
