base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: pt
  text: Deixem em paz a obra desta casa de Deus. Que o governador dos judeus[a] e os anciãos dos judeus reconstruam esta casa de Deus em seu lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos judeanos». O termo aramaico pode designar o povo de Judá em sentido étnico ou regional.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: Deixem em paz a obra
  rationale: O imperativo plural de שׁבק ordena que os destinatários parem de interferir. A expressão corrente «deixem em paz» comunica essa força com clareza, enquanto עֲבִידָה designa aqui o trabalho de reconstrução.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: desta casa de Deus
  rationale: O demonstrativo דֵךְ identifica o templo específico em questão. «Desta casa de Deus» preserva essa referência próxima e integra-se naturalmente à construção portuguesa.
- source_word: פַּחַת יְהוּדָיֵא
  choice: o governador dos judeus
  rationale: פַּחַת designa um governador ou administrador provincial; «governador» é claro sem impor o sentido mais específico de «sátrapa». יְהוּדָיֵא admite sentido étnico ou regional.
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: e os anciãos dos judeus
  rationale: שָׂבֵי refere-se aos anciãos como líderes da comunidade, não simplesmente a homens idosos.
- source_word: יִבְנוֹן
  choice: reconstruam
  rationale: O imperfeito plural em linguagem de decreto tem força jussiva. «Que ... reconstruam» expressa autorização e ordem, e o prefixo «re-» torna explícito o contexto de restauração do templo.
- source_word: עַל אַתְרֵהּ
  choice: no seu próprio local
  rationale: אַתַר significa lugar ou local. A formulação indica que o templo deve ser reconstruído no lugar que lhe pertence, isto é, em seu local anterior.
