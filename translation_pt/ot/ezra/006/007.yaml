    issue: Âncora da nota lexical em posição semanticamente incorreta.
    rationale: O marcador [a] aparece após «casa de Deus», mas a nota explica a possível tradução de יְהוּדָיֵא, vertido por «judeus». A âncora deve acompanhar «judeus».
  - severity: low
    issue: «Seu próprio local» introduz uma ênfase não explicitada no aramaico.
    rationale: עַל אַתְרֵהּ significa «em/no seu lugar» ou «em/no seu local». «Próprio» não é necessário e pode sugerir uma ênfase adicional.
  revised_text: Deixem em paz a obra desta casa de Deus. Que o governador dos judeus[a] e os anciãos dos judeus reconstruam esta casa de Deus em seu lugar.
  revised_footnotes:
