base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: pt
  text: 'No primeiro ano do rei Ciro, o rei Ciro promulgou este decreto: “Quanto à casa de Deus em Jerusalém, que a casa seja reconstruída, o lugar onde se oferecem sacrifícios, e que seus fundamentos sejam assentados.[a] Sua altura será de sessenta côvados, e sua largura, de sessenta côvados,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que seus fundamentos sejam mantidos” ou “retidos”. A expressão aramaica é difícil, e as traduções variam; “sejam assentados” se ajusta melhor ao contexto de construção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: promulgou este decreto
  rationale: A expressão administrativa aramaica significa emitir ou promulgar uma determinação oficial. “Promulgou este decreto” é natural em português e conserva o tom formal.
- source_word: בֵּית אֱלָהָא
  choice: casa de Deus
  rationale: Mantém a expressão literal do aramaico e sua repetição de “casa”, embora o referente seja o templo.
- source_word: יִתְבְּנֵא
  choice: seja reconstruída
  rationale: O contexto do decreto dá à forma verbal força de ordem. Embora o verbo signifique literalmente “seja construída”, “reconstruída” explicita adequadamente a restauração do templo destruído.
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: como lugar onde se oferecem sacrifícios
  rationale: Expressa em português corrente a construção cognata aramaica, evitando a repetição pouco natural “sacrificam sacrifícios”.
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: e que seus alicerces sejam assentados
  rationale: A expressão aramaica é difícil. Esta opção se ajusta ao contexto de construção sem ocultar, por meio da nota, outras análises possíveis.
- source_word: רוּמֵהּ
  choice: Sua altura
  rationale: É o termo arquitetônico direto e natural para a dimensão vertical.
- source_word: אַמִּין שִׁתִּין
  choice: sessenta côvados
  rationale: Preserva a unidade antiga de medida em vez de introduzir uma conversão moderna aproximada.
- source_word: פְּתָיֵהּ
  choice: sua largura
  rationale: “Largura” comunica de modo claro e atual a dimensão horizontal indicada pelo substantivo aramaico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tom administrativo apropriado a um decreto real. Conservou-se “casa de Deus” em vez de “templo de Deus” para refletir o aramaico. O marcador da nota foi colocado junto à frase difícil sobre os alicerces, à qual a nota de fato se refere.
