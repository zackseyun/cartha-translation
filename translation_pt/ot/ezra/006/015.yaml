  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: pt
  text: E esta casa[a] foi concluída até o terceiro dia do mês de Adar[b], no sexto ano do reinado do rei Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este templo”. O aramaico diz literalmente “esta casa”, uma designação comum do templo em Esdras.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no terceiro dia do mês de Adar”. A expressão também pode indicar diretamente a data em que a obra foi concluída.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: foi concluída
  rationale: O verbo aramaico neste contexto indica que a obra foi levada à conclusão. A forma passiva mantém o foco na casa e soa natural em português.
- source_word: בַּיְתָה דְנָה
  choice: esta casa
  rationale: Reproduz literalmente o aramaico; em Esdras, “casa” é uma designação comum do templo.
- source_word: עַד יוֹם תְּלָתָה
  choice: até o terceiro dia
  rationale: Preserva o valor básico de עַד e a possível ideia de limite temporal, sem eliminar a leitura de que a conclusão ocorreu nessa data.
- source_word: לִירַח אֲדָר
  choice: do mês de adar
  rationale: Equivalência direta e idiomática da expressão aramaica de datação.
- source_word: דִּי הִיא שְׁנַת שֵׁת
  choice: no sexto ano
  rationale: Expressa com naturalidade em português a identificação da data com o sexto ano régio.
- source_word: לְמַלְכוּת
  choice: do reinado de
  rationale: No contexto cronológico, o substantivo se refere ao período de governo do rei.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: rei Dario
  rationale: Ordem corrente em português, mantendo explicitamente o título real presente no aramaico.
