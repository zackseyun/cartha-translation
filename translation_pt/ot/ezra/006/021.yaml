  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: pt
  text: Os filhos de Israel[a] que haviam voltado do exílio comeram, juntamente com todos os que se haviam separado da impureza dos povos da terra para se unir a eles[c] e buscar o SENHOR, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os israelitas”. Em hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “a eles”; isto é, à comunidade dos que haviam retornado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: comeram
  rationale: O verbo significa simplesmente “comeram”; o objeto, a refeição ou o cordeiro da Páscoa, está implícito no contexto anterior e não precisa ser acrescentado.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a expressão hebraica, sem sugerir que apenas homens tenham participado; a alternativa idiomática é “os israelitas”.
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: que haviam voltado do exílio
  rationale: Expressa naturalmente o particípio que identifica os judeus retornados; “exílio” é preciso no contexto.
- source_word: וְכֹל הַנִּבְדָּל
  choice: juntamente com todos os que se haviam separado
  rationale: O particípio nifal descreve os que se separaram; o plural em português comunica naturalmente o singular coletivo hebraico.
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: da impureza dos povos da terra
  rationale: “Impureza” mantém as ressonâncias rituais e morais de טֻמְאָה; “povos da terra” preserva o plural e evita reduzi-lo a uma única nação.
- source_word: אֲלֵהֶם
  choice: para se unir a eles
  rationale: O hebraico diz literalmente “a eles”; no contexto, indica associação com a comunidade dos que retornaram. A explicitação é mantida, com nota registrando a forma literal.
- source_word: לִדְרֹשׁ
  choice: buscar
  rationale: Preserva o sentido amplo de voltar-se devotamente para Deus, sem restringi-lo a “adorar” ou “consultar”.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução natural da construção hebraica, preservando a identificação pactual.
theological_decisions:
- issue: Identidade dos participantes adicionais da Páscoa
  choice: 'A descrição permanece ampla: eram pessoas que se separaram da impureza dos povos da terra, associaram-se aos retornados e buscaram Yahweh.'
  alternative: Entendê-las especificamente como convertidos dentre os povos vizinhos ou, em sentido mais restrito, como israelitas que já viviam na terra.
  rationale: O hebraico não identifica explicitamente essas pessoas como prosélitos nem como israelitas; a tradução evita impor uma categoria étnica ou religiosa mais estreita.
- issue: Relação sintática de אֲלֵהֶם
  choice: Entender “a eles” como associação aos filhos de Israel retornados.
  alternative: Conservar apenas a formulação literal “a eles”, sem explicitar o verbo de associação.
  rationale: A preposição indica aproximação ou adesão no contexto, mas a nota preserva a literalidade e torna visível a pequena margem interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém “filhos de Israel” por transparência formal, usa “impureza” pelo valor ritual e moral do termo e conserva o nome divino como “Yahweh”. A marcação das notas segue a sequência efetivamente usada no texto.
