id: EZR.6.10
reference: Ezra 6:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: pt
  text: para que ofereçam aromas agradáveis ao Deus dos céus[a] e orem pela vida do rei e de seus filhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aromas suaves”. O termo aramaico se refere ao aroma agradável de sacrifícios aceitos.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo bem-estar do rei e de seus filhos”. Literalmente, “pela vida do rei e de seus filhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי לֶהֱוֺן
  choice: para que
  rationale: A partícula de finalidade, juntamente com a forma verbal e os particípios seguintes, introduz o propósito das provisões reais; “para que” expressa isso naturalmente em português.
- source_word: מְהַקְרְבִין
  choice: ofereçam
  rationale: No contexto sacrificial, o verbo designa a apresentação de ofertas; “ofereçam” é corrente e preserva o sentido cultual.
- source_word: נִיחוֹחִין
  choice: aromas agradáveis
  rationale: O termo evoca o aroma aprazível de sacrifícios aceitos. A escolha mantém a imagem sensorial sem reduzi-la simplesmente a “sacrifícios”.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: ao Deus dos céus
  rationale: A preposição indica o destinatário das ofertas, e “Deus dos céus” preserva o título característico empregado em Esdras.
- source_word: וּמְצַלַּיִן
  choice: e orem
  rationale: O particípio coordenado exprime a ação de orar dentro da mesma finalidade; o subjuntivo português concorda naturalmente com “para que”.
- source_word: לְחַיֵּי
  choice: pela vida de
  rationale: É a representação mais próxima da expressão aramaica, embora no contexto também possa abranger o bem-estar e a preservação da pessoa.
- source_word: מַלְכָּא
  choice: o rei
  rationale: O termo aramaico comum significa “rei”; não é necessário explicitar “imperador”, embora se refira ao soberano persa.
- source_word: וּבְנוֹהִי
  choice: e de seus filhos
  rationale: O substantivo é masculino plural e designa especificamente os filhos homens do rei; a tradução preserva essa especificidade.
theological_decisions:
- issue: Expressão cultual נִיחוֹחִין no decreto persa sobre as ofertas do templo
  choice: aromas agradáveis
  alternative: sacrifícios aceitáveis; aromas suaves
  rationale: A formulação conserva a imagem sacrificial do aroma considerado agradável, sem substituir a expressão por uma interpretação teológica mais explícita.
- issue: Alcance de לְחַיֵּי na oração pelo rei
  choice: pela vida do rei
  alternative: pelo bem-estar do rei
  rationale: A tradução mantém o sentido literal de “vida”, enquanto a nota registra a possível extensão contextual a bem-estar ou preservação, sem eliminar a ambiguidade.
- issue: Termo filial masculino aplicado à descendência do rei
  choice: seus filhos
  alternative: seus descendentes; suas crianças
  rationale: O original especifica filhos homens; a tradução mantém essa referência em vez de neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe “para que... ofereçam... e orem” reproduz naturalmente a finalidade do aramaico. O título “Deus dos céus” e a imagem sacrificial foram preservados.
