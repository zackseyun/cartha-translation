translation:
  language: pt
  text: com três fiadas de pedras lavradas[a] e uma fiada de madeira nova; e que a despesa seja paga pela casa do rei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “três camadas de pedra lavrada”.'
    reason: lexical_alternative
  - marker: b
    text: “A casa do rei” provavelmente se refere ao tesouro real ou aos recursos da coroa.
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין
  choice: fileiras
  rationale: Designa fiadas ou camadas estruturais de alvenaria. “Fileiras” é claro para leitores comuns e se ajusta à repetição no singular.
- source_word: אֶבֶן גְּלָל
  choice: pedras lavradas
  rationale: No contexto de construção, a expressão provavelmente indica pedras preparadas ou trabalhadas para alvenaria; evita-se a tradução literal pouco clara “pedras roladas”.
- source_word: תְּלָתָא
  choice: três
  rationale: Mantém diretamente o numeral cardinal aramaico.
- source_word: וְנִדְבָּךְ
  choice: e uma fileira
  rationale: Reproduz no singular o mesmo termo estrutural usado anteriormente no plural.
- source_word: אָע חֲדַת
  choice: madeira nova
  rationale: “Madeira” é natural e abrangente em português para material de construção, e “nova” preserva חֲדַת.
- source_word: נִפְקְתָא
  choice: a despesa
  rationale: Expressa naturalmente o gasto ou desembolso mencionado no decreto administrativo.
- source_word: מִן בֵּית מַלְכָּא
  choice: pela casa do rei
  rationale: Preserva a expressão literal aramaica, enquanto a nota esclarece que ela provavelmente designa o tesouro ou os recursos reais.
- source_word: תִּתְיְהִב
  choice: que ... seja paga
  rationale: Conserva a força diretiva do decreto e forma uma expressão administrativa natural com “despesa” em português.
