revisions:
- from: E organizaram os sacerdotes em suas divisões e os levitas em suas turmas[a], para o serviço de Deus em Jerusalém, conforme está escrito[b] no Livro de Moisés.
  to: E organizaram os sacerdotes em suas divisões e os levitas em suas divisões para o serviço do Deus que está em Jerusalém, conforme está escrito no Livro de Moisés.
  rationale: A revisão torna explícita a oração relativa que caracteriza Deus como aquele que está em Jerusalém, conforme o aramaico, e substitui “turmas” por “divisões”, termo mais adequado ao registro e à organização do serviço cultual. As notas são mantidas como alternativas lexicais e idiomáticas, mas não recebem âncoras no texto porque as opções adotadas não exigem esclarecimento para a leitura corrente.
