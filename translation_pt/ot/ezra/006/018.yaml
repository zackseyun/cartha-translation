base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: pt
  text: E organizaram os sacerdotes em suas divisões e os levitas em suas divisões para o serviço do Deus que está em Jerusalém, conforme está escrito no Livro de Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: organizaram
  rationale: A forma causativa de קום indica pôr de pé, estabelecer ou designar. No contexto, trata-se de dispor sacerdotes e levitas em suas respectivas unidades de serviço; “organizaram” comunica isso com naturalidade, sem acrescentar a ideia de uma nova ordenação sacerdotal.
- source_word: כָהֲנַיָּא
  choice: os sacerdotes
  rationale: Equivalente português direto do substantivo aramaico definido, referente ao corpo sacerdotal conhecido no contexto.
- source_word: בִּפְלֻגָּתְהוֹן
  choice: em suas divisões
  rationale: O substantivo designa seções ou divisões organizadas. “Divisões” é claro e preserva o caráter institucional do arranjo.
- source_word: וְלֵוָיֵא
  choice: e os levitas
  rationale: Tradução direta do termo aramaico para os levitas ligados ao serviço do templo.
- source_word: בְּמַחְלְקָתְהוֹן
  choice: em suas turmas
  rationale: O substantivo indica grupos ou classes organizadas para o serviço. “Turmas” distingue naturalmente o termo do substantivo paralelo aplicado aos sacerdotes, sem sugerir uma diferença rígida que o texto não explicita.
- source_word: עַל עֲבִידַת אֱלָהָא
  choice: para o serviço de Deus
  rationale: A combinação da preposição com o substantivo expressa designação para uma tarefa. “Para o serviço de Deus” transmite de modo idiomático a função cultual no templo.
- source_word: דִּי בִירוּשְׁלֶם
  choice: em Jerusalém
  rationale: Em português, a forma concisa identifica naturalmente o local do serviço de Deus. Uma reprodução mais explícita, “que está em Jerusalém”, seria possível, mas menos fluente.
- source_word: כִּכְתָב
  choice: conforme está escrito
  rationale: A expressão assinala conformidade com uma norma escrita. “Conforme está escrito” preserva a referência à autoridade documental e soa natural em português.
- source_word: סְפַר מֹשֶׁה
  choice: o Livro de Moisés
  rationale: סְפַר pode designar livro, rolo ou documento escrito. “Livro de Moisés” é claro e mantém a formulação do texto sem especificar além dela a extensão exata do corpus referido.
theological_decisions:
- issue: Relação entre a organização do serviço do templo e a autoridade mosaica escrita
  choice: A organização dos sacerdotes e levitas é apresentada como estando de acordo com o que está escrito no Livro de Moisés.
  alternative: Entender a frase final apenas como referência genérica a um costume tradicional.
  rationale: A expressão כִּכְתָב סְפַר מֹשֶׁה vincula explicitamente o arranjo a uma instrução escrita. A tradução conserva essa ligação normativa sem desenvolver afirmações posteriores sobre cânon, autoria ou formas específicas de ordenação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Organizaram” evita a possível impressão moderna de que o texto descreve uma cerimônia de ordenação, enquanto “divisões” e “turmas” preservam o paralelismo e a leve variação lexical do aramaico.
