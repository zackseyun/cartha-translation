  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בֵּ/אדַ֛יִן דָּרְיָ֥וֶשׁ מַלְכָּ֖/א שָׂ֣ם טְעֵ֑ם וּ/בַקַּ֣רוּ בְּ/בֵ֣ית סִפְרַיָּ֗/א דִּ֧י גִנְזַיָּ֛/א מְהַחֲתִ֥ין תַּמָּ֖ה בְּ/בָבֶֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: pt
  text: Então o rei Dario deu uma ordem[a], e fizeram uma busca na casa dos documentos[b], onde os tesouros[c] estavam guardados, ali na Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rei Dario promulgou um decreto”. Mais literalmente, o aramaico diz “estabeleceu uma ordem”.'
    reason: alternative_reading
  - marker: b
    text: “Casa dos documentos” é, literalmente, “casa dos livros”, isto é, um repositório oficial de registros.
    reason: lexical_alternative
  - marker: c
    text: “Tesouros” também pode designar, em sentido mais amplo, bens valiosos ou depósitos guardados no complexo dos arquivos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte na sequência narrativa; “Então” é natural e claro em português.
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: o rei Dario
  rationale: Emprega a forma portuguesa tradicional do nome e a ordem idiomática moderna de título e nome.
- source_word: שָׂם טְעֵם
  choice: deu uma ordem
  rationale: A expressão significa literalmente algo como “estabeleceu uma ordem/decreto”. “Deu uma ordem” comunica com naturalidade a ação administrativa régia sem exigir que טְעֵם denote especificamente um decreto formal.
- source_word: וּבַקַּרוּ
  choice: e fizeram uma busca
  rationale: O verbo está na terceira pessoa do plural, mas pode ter sentido impessoal. A construção portuguesa preserva a indefinição dos agentes sem transformar explicitamente a oração em passiva.
- source_word: בְּבֵית סִפְרַיָּא
  choice: na casa dos documentos
  rationale: Representa de perto a expressão concreta “casa dos livros/documentos” e, no contexto administrativo, indica um repositório oficial de registros.
- source_word: דִּי
  choice: onde
  rationale: Traduz naturalmente o valor locativo do pronome relativo que introduz a oração seguinte.
- source_word: גִנְזַיָּא
  choice: os tesouros
  rationale: Mantém o sentido lexical direto de bens preciosos ou depósitos guardados, sem restringi-lo indevidamente a documentos valiosos.
- source_word: מְהַחֲתִין
  choice: estavam guardados
  rationale: 'Expressa o estado resultante indicado pelo particípio passivo: itens depositados ou mantidos em armazenamento.'
- source_word: תַּמָּה
  choice: ali
  rationale: Conserva o advérbio locativo explícito do aramaico e sua ênfase, apesar de alguma redundância após “onde”.
- source_word: בְּבָבֶל
  choice: na Babilônia
  rationale: Forma corrente em português para a localização geográfica.
theological_decisions: []
