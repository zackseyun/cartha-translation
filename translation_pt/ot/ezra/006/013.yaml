  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: pt
  text: Então Tatenai, governador de Além do Rio[a], Setar-Bozenai e seus associados fizeram exatamente assim[b], de acordo com o que o rei Dario havia enviado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Além do Rio” era a designação administrativa persa da região situada a oeste do rio Eufrates.
    reason: cultural_note
  - marker: b
    text: Ou “agiram com cuidado” ou “cumpriram tudo com a máxima exatidão”. A expressão aramaica enfatiza o cumprimento preciso da determinação do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marcador narrativo aramaico que introduz o acontecimento seguinte; “Então” preserva com naturalidade a sequência do relato.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: governador do Além do Rio
  rationale: פַּחַת designa um governador provincial, e עֲבַר נַהֲרָה é a designação administrativa persa da região a oeste do Eufrates. A formulação mantém o caráter de nome regional do original.
- source_word: שְׁתַר בּוֹזְנַי
  choice: Setar-Bozenai
  rationale: Transliteração do nome próprio em forma clara e adequada ao português.
- source_word: וּכְנָוָתְהוֹן
  choice: e seus colegas
  rationale: O termo se refere aos que estavam associados a eles, provavelmente em função oficial; “colegas” comunica bem esse vínculo administrativo.
- source_word: לָקֳבֵל דִּי
  choice: conforme o que
  rationale: A expressão indica conformidade com uma determinação anterior sem explicitar se aquilo que foi enviado era carta, decreto ou ordem.
- source_word: שְׁלַח
  choice: havia enviado
  rationale: O verbo significa literalmente “enviar”. O mais-que-perfeito composto esclarece que o envio de Dario precedeu o cumprimento, sem substituir o termo por “decretar” ou “ordenar”.
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: exatamente assim
  rationale: A expressão adverbial intensifica a ideia de cumprimento preciso e cuidadoso. “Exatamente assim” preserva a ligação com a determinação do rei, enquanto a nota registra alternativas possíveis.
- source_word: עֲבַדוּ
  choice: fizeram
  rationale: Verbo amplo correspondente a “fazer”. Junto de “exatamente assim”, expressa que eles cumpriram a determinação sem introduzir um objeto ausente do texto.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com nomes próprios em formas legíveis para o público lusófono. A ordem da frase foi levemente ajustada para fluência, sem explicitar como “ordem” ou “decreto” aquilo que Dario havia enviado. Os marcadores das notas foram posicionados junto às expressões que efetivamente explicam.
