  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: pt
  text: 'Além disso, decreto o seguinte a respeito do que vocês devem fazer em favor destes anciãos judeus na reconstrução desta casa de Deus: as despesas deverão ser pagas prontamente a esses homens, com as receitas reais — isto é, com o tributo arrecadado no território de Além do Rio[a] —, para que a obra não seja interrompida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Além do Rio” era a designação administrativa persa para os territórios a oeste do rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: Além disso, decreto
  rationale: A expressão aramaica estabelece uma decisão oficial. A forma ativa mantém o rei como locutor e comunica com naturalidade a força administrativa do decreto.
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: estes anciãos judeus
  rationale: A expressão identifica os líderes da comunidade judaica; esta formulação é concisa e natural em português.
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: enquanto reconstroem esta casa de Deus
  rationale: דֵךְ é o demonstrativo “esta”, não o possessivo “de vocês”. O infinitivo descreve a atividade de reconstrução realizada pelos anciãos.
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: com as receitas reais — o tributo arrecadado na região Além do Rio
  rationale: מִדַּת designa tributo ou imposto, e não uma província. A aposição esclarece que o tributo do território transeufratino é a fonte fiscal do pagamento real.
- source_word: אָסְפַּרְנָא
  choice: prontamente
  rationale: Neste contexto administrativo de pagamento, o termo ressalta execução expedita e cuidadosa; “prontamente” expressa isso sem exagero.
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: as despesas deles serão pagas
  rationale: A construção passiva exige que os custos do projeto sejam fornecidos aos anciãos. A formulação portuguesa é clara e evita repetir “estes homens”.
- source_word: דִּי לָא לְבַטָּלָא
  choice: para que a obra não seja interrompida
  rationale: A oração final visa impedir a paralisação. “A obra” explicita com moderação o referente contextual não expresso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o tom de decreto real sem reproduzir de modo rígido a ordem aramaica. “Casa de Deus” mantém o termo do texto-fonte, sem substituí-lo interpretativamente por “templo”.
