revisions:
- from: 'Além disso, decreto o que vocês devem fazer por estes anciãos judeus enquanto reconstroem esta casa de Deus: as despesas deles serão pagas prontamente com as receitas reais — o tributo arrecadado na região Além do Rio[a] —, para que a obra não seja interrompida.'
  to: 'Além disso, decreto o seguinte a respeito do que vocês devem fazer em favor destes anciãos judeus na reconstrução desta casa de Deus: as despesas deverão ser pagas prontamente a esses homens, com as receitas reais — isto é, com o tributo arrecadado no território de Além do Rio[a] —, para que a obra não seja interrompida.'
  rationale: A revisão conserva o sentido do decreto real e todas as decisões lexicais fundamentadas no texto-fonte, ao mesmo tempo que melhora a formulação portuguesa e torna explícito que os recursos devem ser fornecidos aos anciãos. «Território de Além do Rio» torna a referência geográfica mais fluente sem transformar מִדַּת, «tributo», em nome de província.
