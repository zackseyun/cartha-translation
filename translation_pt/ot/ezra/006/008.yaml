    issue: Formulação inicial levemente elíptica
    rationale: «Decreto o que vocês devem fazer» pode sugerir que o rei decreta o próprio conteúdo da ação sem introduzir claramente a determinação. «Decreto o seguinte a respeito do que vocês devem fazer» preserva a construção administrativa do aramaico.
  - severity: medium
    issue: O destinatário da provisão não está expresso
    rationale: A construção aramaica determina que a despesa seja dada a «estes homens». «As despesas deles serão pagas» é compreensível, mas deixa implícito esse elemento; «as despesas deverão ser pagas prontamente a esses homens» o conserva.
