  text: וְ/הַקְרִ֗בוּ לַ/חֲנֻכַּת֮ בֵּית אֱלָהָ֣/א דְנָה֒ תּוֹרִ֣ין מְאָ֔ה דִּכְרִ֣ין מָאתַ֔יִן אִמְּרִ֖ין אַרְבַּ֣ע מְאָ֑ה וּ/צְפִירֵ֨י עִזִּ֜ין ל/חטיא עַל כָּל יִשְׂרָאֵל֙ תְּרֵֽי עֲשַׂ֔ר לְ/מִנְיָ֖ן שִׁבְטֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: pt
  text: E ofereceram, para a dedicação desta casa de Deus, cem touros, duzentos carneiros, quatrocentos cordeiros e doze bodes como oferta pelo pecado por todo o Israel[a], conforme o número das tribos de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em favor de todo o Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Os doze bodes correspondem às doze tribos de Israel, indicando o alcance representativo da oferta.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: E ofereceram
  rationale: A forma causativa de קרב, neste contexto cultual, indica apresentar animais em sacrifício; “ofereceram” é natural e preciso em português.
- source_word: לַחֲנֻכַּת
  choice: para a dedicação
  rationale: חנכה designa a dedicação ou inauguração cerimonial, e a preposição ל marca aqui a finalidade da oferta.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: desta casa de Deus
  rationale: Preserva a expressão aramaica “casa de Deus”; “templo” seria contextual, mas menos formalmente correspondente.
- source_word: תּוֹרִין
  choice: touros
  rationale: No inventário sacrificial, o termo designa bovinos machos oferecidos em sacrifício.
- source_word: דִּכְרִין
  choice: carneiros
  rationale: O termo aramaico designa ovelhas adultas do sexo masculino; “carneiros” é a forma corrente em português.
- source_word: אִמְּרִין
  choice: cordeiros
  rationale: Designa cordeiros ou ovelhas jovens; “cordeiros” é a tradução mais natural neste contexto sacrificial.
- source_word: וּצְפִירֵי עִזִּין
  choice: doze bodes
  rationale: A expressão especifica caprinos machos; “bodes” é conciso e idiomático em português.
- source_word: לחטיא
  choice: como oferta pelo pecado
  rationale: Trata-se de terminologia sacrificial ligada ao pecado ou à purificação; “oferta pelo pecado” mantém a designação tradicional sem ampliar sua interpretação.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: por todo o Israel
  rationale: A preposição expressa benefício ou representação. A formulação preserva o alcance corporativo e admite a nuance “em favor de”.
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: conforme o número das tribos de Israel
  rationale: A frase explica o total de doze bodes e reproduz de modo natural a relação numérica declarada no aramaico.
theological_decisions:
- issue: Alcance corporativo de “todo o Israel” no período pós-exílico
  choice: Manter “por todo o Israel”, sem restringir a expressão aos exilados que retornaram.
  alternative: “pelos exilados que retornaram” ou uma explicitação de que se trata do povo inteiro representado simbolicamente
  rationale: O texto afirma expressamente “todo o Israel” e relaciona os doze bodes às tribos de Israel. A tradução conserva esse alcance e a tensão histórica e teológica sem impor uma interpretação restritiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos elementos foi ajustada para fluência, sem alterar o conteúdo da lista sacrificial.
