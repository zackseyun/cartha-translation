  text: וְ/הִשְׁתְּכַ֣ח בְּ/אַחְמְתָ֗א בְּ/בִֽירְתָ֛/א דִּ֛י בְּ/מָדַ֥י מְדִינְתָּ֖/ה מְגִלָּ֣ה חֲדָ֑ה וְ/כֵן כְּתִ֥יב בְּ/גַוַּ֖/הּ דִּכְרוֹנָֽ/ה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/002.yaml
  text: 'And in Ecbatana[a], the fortress that is in the province of Media, a scroll was found[c][b], and this was written in it as a record:'
translation:
  language: pt
  text: 'E, em Ecbátana[a], na fortaleza[b] que fica na província da Média, foi encontrado um rolo, no qual estava escrito o seguinte registro[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Acmeta”, transliteração mais próxima do nome aramaico de Ecbátana.
    reason: lexical_alternative
  - marker: b
    text: Ou “cidadela”. O termo aramaico se refere a um complexo real ou administrativo fortificado.
    reason: lexical_alternative
  - marker: c
    text: Ou “memorando”. O termo indica uma lembrança oficial escrita ou uma nota de arquivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁתְּכַח
  choice: foi encontrado
  rationale: Reproduz diretamente o sentido passivo do verbo aramaico e se ajusta naturalmente ao contexto de busca em arquivos.
- source_word: אַחְמְתָא
  choice: Ecbátana
  rationale: É a forma histórica consagrada em português para a capital da Média e permite reconhecimento mais imediato que uma transliteração estrita do aramaico.
- source_word: בִּירְתָא
  choice: fortaleza
  rationale: Designa com clareza um complexo real ou administrativo fortificado, preservando a amplitude do termo aramaico.
- source_word: דִּי בְּמָדַי מְדִינְתָּה
  choice: que fica na província da Média
  rationale: Mantém explícita a oração relativa e a designação administrativa, em português atual e natural.
- source_word: מְגִלָּה חֲדָה
  choice: um rolo
  rationale: O numeral aramaico funciona aqui naturalmente como marcador indefinido; “um rolo” evita enfatizar sem necessidade a quantidade.
- source_word: וְכֵן כְּתִיב
  choice: estava escrito o seguinte
  rationale: Introduz de modo idiomático o conteúdo documental que vem a seguir e conserva a força apresentativa da expressão.
- source_word: בְּגַוַּהּ
  choice: no qual
  rationale: Retoma claramente “rolo” e expressa de modo fluente que o texto se encontrava nele.
- source_word: דִּכְרוֹנָה
  choice: registro
  rationale: No contexto administrativo, refere-se a um documento de memória oficial ou nota de arquivo; “registro” é claro e abrangente.
theological_decisions: []
