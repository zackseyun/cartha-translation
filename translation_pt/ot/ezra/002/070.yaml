  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: pt
  text: Assim, os sacerdotes, os levitas, parte do povo, os cantores, os guardas dos portões e os servidores do templo[a] se estabeleceram em suas cidades; e todo o Israel se estabeleceu em suas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os netinins”, termo técnico para uma classe destinada ao serviço do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: se estabeleceram
  rationale: Neste contexto de retorno e reassentamento, o verbo יָשַׁב indica que esses grupos passaram a residir em suas localidades. “Se estabeleceram” expressa naturalmente esse sentido narrativo em português.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português consagrado para o grupo sacerdotal no contexto pós-exílico.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Mantém a designação tradicional do grupo levítico, distinto dos sacerdotes.
- source_word: וּמִן הָעָם
  choice: parte do povo
  rationale: 'A preposição מִן tem sentido partitivo: refere-se a uma parcela do povo, não ao povo inteiro.'
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: Designa os encarregados do canto, especialmente no serviço do templo; “cantores” é direto e corrente.
- source_word: הַשּׁוֹעֲרִים
  choice: os guardas dos portões
  rationale: Expressa a função de vigiar ou cuidar dos portões, com mais clareza para o leitor moderno do que uma tradução excessivamente literal.
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: O termo técnico designa uma classe destinada ao serviço do templo. A tradução funcional comunica seu papel, enquanto a nota preserva a designação hebraica tradicional.
- source_word: בְּעָרֵיהֶם
  choice: em suas cidades
  rationale: עִיר pode indicar cidade ou povoação; “cidades” preserva o uso geográfico bíblico corrente e a repetição enfática do texto.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Preserva a expressão coletiva hebraica, que apresenta a comunidade restaurada sob o nome de Israel.
theological_decisions:
- issue: Tradução do termo técnico הַנְּתִינִים
  choice: os servidores do templo
  alternative: os netinins
  rationale: A opção funcional torna compreensível o papel do grupo sem impor uma interpretação denominacional. A transliteração tradicional é conservada em nota para transparência lexical.
- issue: Alcance da expressão וְכָל יִשְׂרָאֵל
  choice: todo o Israel
  alternative: todo o povo de Israel
  rationale: A formulação mais próxima do hebraico preserva o caráter coletivo e a possível tensão histórica da expressão, sem explicar além do que o verso afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A repetição de “se estabeleceu” e “em suas cidades” preserva a estrutura enfática do hebraico sem soar arcaica.
