lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: Toda a assembleia
  rationale: A combinação de כָּל com o substantivo definido expressa a totalidade do grupo reunido. “Toda a assembleia” é clara, digna e evita possíveis conotações eclesiásticas de “congregação”.
- source_word: כְּאֶחָד
  choice: reunida
  rationale: Literalmente, “como um só”. Neste contexto de recenseamento, o termo apresenta a assembleia como um conjunto; “reunida” comunica essa força idiomática em português natural, enquanto a forma literal é preservada em nota.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת שִׁשִּׁים
  choice: quarenta e dois mil trezentos e sessenta
  rationale: 'A sequência numérica hebraica totaliza 42.360: quatro dezenas de milhares, dois milhares, três centenas e sessenta.'
theological_decisions: []
