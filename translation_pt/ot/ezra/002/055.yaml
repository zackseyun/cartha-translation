base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/055.yaml
  text: 'the sons of Solomon’s servants: the sons of Sotai[a], the sons of Hassophereth, the sons of Peruda.'
translation:
  language: pt
  text: 'os descendentes dos servos de Salomão: os descendentes de Sotai, os descendentes de Hasoferete e os descendentes de Peruda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico de Esdras traz “Peruda”; a lista paralela em Neemias 7:57 traz “Perida”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: os descendentes de
  rationale: Nesta lista genealógica e administrativa, a expressão designa linhagens ou grupos familiares, não necessariamente filhos imediatos. “Os descendentes de” comunica esse sentido corporativo com clareza em português moderno e preserva a repetição do hebraico.
- source_word: עַבְדֵי
  choice: servos
  rationale: Embora עֶבֶד também possa significar “escravo”, aqui a expressão funciona como a designação histórica de uma classe conhecida, “os servos de Salomão”, sem destacar especificamente a condição jurídica de escravidão.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Emprega-se a forma portuguesa consagrada do nome próprio.
- source_word: סֹטַי
  choice: Sotai
  rationale: Transliteração simples do nome hebraico, adequada às convenções e à leitura em português.
- source_word: הַסֹּפֶרֶת
  choice: Hassoferete
  rationale: Transliteração do nome tal como aparece no texto hebraico, incluindo o elemento inicial ligado ao artigo e adaptando a terminação à leitura natural em português.
- source_word: פְרוּדָא
  choice: Peruda
  rationale: Segue a leitura do texto massorético de Esdras; a forma diferente na lista paralela de Neemias é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência de lista preservada. “Descendentes” evita sugerir que todos fossem filhos imediatos. O marcador da nota foi colocado após “Peruda”, termo ao qual a variante textual realmente se refere.
