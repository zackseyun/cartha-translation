  text: the sons of Bakbuk[a], the sons of Hakupha, the sons of Harhur.
translation:
  language: pt
  text: os filhos de Bacbuque[a], os filhos de Hacufa e os filhos de Harhur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de”, em cada ocorrência de “filhos de”; a fórmula genealógica hebraica pode indicar uma linhagem ou um clã, e não apenas filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de בֵּן numa lista genealógica. A formulação preserva de modo formal a expressão hebraica, embora aqui possa designar descendentes ou membros de um grupo familiar, e não apenas filhos imediatos.
- source_word: בַקְבּוּק
  choice: Bacbuque
  rationale: Nome próprio transliterado de forma natural para leitores de língua portuguesa, representando aproximadamente as consoantes e a vocalização hebraicas.
- source_word: חֲקוּפָא
  choice: Hacufa
  rationale: Nome próprio transliterado segundo convenções legíveis em português, mantendo o som inicial representado por ח e a sequência vocálica do hebraico.
- source_word: חַרְחוּר
  choice: Harur
  rationale: Nome próprio transliterado em forma legível em português; o hebraico apresenta duas consoantes ח, representadas de modo simplificado por h.
