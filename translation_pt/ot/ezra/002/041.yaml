  yaml_path: translation/ot/ezra/002/041.yaml
  text: 'The singers: the sons of Asaph, one hundred twenty-eight.'
translation:
  language: pt
  text: 'Os cantores: os filhos de Asafe, cento e vinte e oito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O particípio substantivado da raiz שׁיר designa os que cantam. “Os cantores” é direto e natural; “os músicos” seria amplo demais, e “os cantores do templo” acrescentaria uma especificação contextual não expressa neste versículo.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em listas genealógicas e de grupos familiares, בְּנֵי introduz uma linhagem ou corporação. “Os filhos de” preserva a forma do hebraico e é uma expressão bíblica clara em português, embora aqui possa incluir descendentes ou membros do grupo.
- source_word: אָסָף
  choice: Asafe
  rationale: Adota-se a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: cento e vinte e oito
  rationale: A sequência cardinal hebraica é 100 + 20 + 8; esta é a formulação corrente e clara em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura concisa própria de uma lista. Mantém-se “filhos de” para refletir de perto o hebraico sem inserir no texto uma interpretação mais específica como “descendentes” ou “membros”.
