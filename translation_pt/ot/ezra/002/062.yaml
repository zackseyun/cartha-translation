  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: pt
  text: Estes procuraram seu registro entre os inscritos por genealogia, mas não foram encontrados e foram excluídos do sacerdócio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram considerados impuros, excluídos do sacerdócio” ou “foram desqualificados do sacerdócio”. O verbo hebraico pode indicar que foram tratados como impróprios para a condição sacerdotal porque sua genealogia não pôde ser comprovada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes
  rationale: O demonstrativo plural retoma os que reivindicavam condição sacerdotal no contexto anterior; a forma simples preserva a concisão do hebraico.
- source_word: בִּקְשׁוּ
  choice: procuraram
  rationale: Expressa naturalmente a busca por comprovação documental.
- source_word: כְתָבָם
  choice: seu registro
  rationale: כְּתָב designa um escrito ou documento; aqui, trata-se do registro oficial que comprovaria a ascendência.
- source_word: הַמִּתְיַחְשִׂים
  choice: entre os inscritos por genealogia
  rationale: Preserva o sentido participial e administrativo de pessoas registradas segundo sua linhagem.
- source_word: וְלֹא נִמְצָאוּ
  choice: mas não foram encontrados
  rationale: 'Mantém o sujeito plural do hebraico e sua formulação elíptica: eles não constavam entre os genealogicamente registrados.'
- source_word: וַיְגֹאֲלוּ
  choice: foram considerados inaptos
  rationale: Comunica a declaração de desqualificação decorrente da falta de comprovação genealógica, preservando a nuance de impureza no rodapé.
- source_word: מִן הַכְּהֻנָּה
  choice: para o sacerdócio
  rationale: Em combinação com 'inaptos', esta formulação traduz de modo idiomático a exclusão da condição ou função sacerdotal.
theological_decisions:
- issue: Sentido de וַיְגֹאֲלוּ quanto à condição sacerdotal
  choice: foram considerados inaptos para o sacerdócio
  alternative: foram considerados impuros e excluídos do sacerdócio
  rationale: O verbo envolve uma declaração de impureza ou desqualificação. A tradução principal expressa o efeito institucional sem afirmar mais do que o contexto permite, enquanto a nota conserva a nuance lexical de impureza.
translation_notes:
  register: Português moderno, claro e digno, com terminologia administrativa compreensível. A tradução conserva o plural hebraico em “não foram encontrados” e evita resolver silenciosamente a tensão entre impureza e desqualificação institucional.
