lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a fórmula repetida da lista hebraica. Neste contexto, a expressão designa integrantes ou descendentes de uma linhagem familiar, não necessariamente filhos imediatos.
- source_word: בַצְלוּת
  choice: Bazlute
  rationale: Transliteração legível do nome próprio, em forma tradicionalmente reconhecível em português.
- source_word: מְחִידָא
  choice: Meída
  rationale: Transliteração do nome próprio com acento gráfico para indicar de modo natural a pronúncia em português.
- source_word: חַרְשָׁא
  choice: Harsa
  rationale: Transliteração simplificada e legível do nome próprio; não se representa separadamente o álef final.
