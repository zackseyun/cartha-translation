- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista dos que voltaram, בְּנֵי introduz um grupo familiar ou clã associado a um antepassado masculino. “Os filhos de” preserva de modo claro e conciso a forma genealógica do hebraico.
- source_word: חָשֻׁם
  choice: Hasum
  rationale: O nome próprio hebraico é transliterado segundo uma forma natural em português, com “s” representando o som de שׁ e sem acrescentar elementos ausentes no texto.
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: duzentos e vinte e três
  rationale: A sequência numérica hebraica expressa o total de 223. A forma por extenso, com as conjunções usuais em português, é natural, legível e fiel ao original.
