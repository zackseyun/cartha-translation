  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: pt
  text: Alguns dos chefes das casas paternas[a], ao chegarem à casa de Yahweh, em Jerusalém, deram ofertas voluntárias[b] para a casa de Deus, a fim de estabelecê-la em seu lugar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «chefes das famílias». A expressão hebraica designa líderes de unidades israelitas de parentesco ancestral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «contribuíram espontaneamente». O verbo enfatiza que deram por livre vontade.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «sobre seu alicerce» ou «em seu local». O hebraico pode se referir à base do templo ou ao lugar fixado para ele.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Alguns dos chefes das famílias paternas
  rationale: A preposição מִן tem sentido partitivo, indicando alguns dentre os chefes. A expressão designa líderes de unidades de parentesco israelitas; «famílias paternas» preserva essa estrutura social em português compreensível.
- source_word: בְּבוֹאָם
  choice: ao chegarem
  rationale: A preposição בְּ com infinitivo construto e sufixo tem valor temporal. «Ao chegarem» reproduz esse sentido com naturalidade.
- source_word: לְבֵית יְהוָה
  choice: à casa de Yahweh
  rationale: בַּיִת significa literalmente «casa» e aqui se refere ao templo. Manter «casa» conserva o paralelismo com «casa de Deus»; o nome יהוה é transliterado como «Yahweh».
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: em Jerusalém
  rationale: A oração relativa localiza a casa de Yahweh. Em português, a aposição locativa concisa expressa naturalmente a mesma informação.
- source_word: הִתְנַדְּבוּ
  choice: deram ofertas voluntárias
  rationale: O hitpael de נדב salienta uma contribuição espontânea. O contexto permite explicitar que se trata de ofertas, sem perder a ênfase na voluntariedade.
- source_word: לְבֵית הָאֱלֹהִים
  choice: para a casa de Deus
  rationale: A preposição לְ indica o destinatário ou propósito das contribuições. «Casa de Deus» mantém a repetição lexical do hebraico.
- source_word: לְהַעֲמִידוֹ
  choice: a fim de estabelecê-la
  rationale: O hifil de עמד significa fazer ficar de pé, estabelecer ou erigir. «Estabelecer» evita especificar além do texto se a ação é reconstrução, ereção ou restauração.
- source_word: עַל מְכוֹנוֹ
  choice: em seu lugar
  rationale: מָכוֹן pode indicar lugar fixo, local estabelecido ou base. «Em seu lugar» conserva a referência locativa e deixa a possível ideia de fundação para a nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido da expressão social רָאשֵׁי הָאָבוֹת
  choice: chefes das famílias paternas
  alternative: chefes de família; chefes das casas paternas
  rationale: A tradução conserva a natureza ancestral e patrilinear da unidade de parentesco israelita sem transformar a expressão em uma designação genérica moderna.
- issue: Referente de עַל מְכוֹנוֹ
  choice: em seu lugar
  alternative: sobre seu alicerce; em seu local
  rationale: O substantivo pode designar tanto uma base ou fundação quanto um lugar fixo. A formulação principal preserva a amplitude locativa, e a nota registra a leitura física possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. «Casa» conserva a repetição hebraica; «Yahweh» mantém o nome divino. As três notas preservam a estrutura social antiga, a nuance voluntária da oferta e a ambiguidade de מָכוֹן.
