base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: pt
  text: E o governador[a] lhes disse que não comessem das coisas santíssimas[b] até que se apresentasse um sacerdote com Urim e Tumim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o Tirsata», título administrativo persa.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as porções sacerdotais das ofertas consideradas especialmente santas; não o recinto interior do santuário, chamado Santo dos Santos.
    reason: cultural_note
  - marker: c
    text: Urim e Tumim eram meios sagrados de consulta sacerdotal; sua forma e o procedimento exato são incertos.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: o governador
  rationale: O termo é um título administrativo persa. Traduzir pela função comunica seu sentido ao leitor moderno; a transliteração tradicional «Tirsata» é preservada em nota.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: que não comessem
  rationale: A construção introduz o conteúdo da ordem dada pelo governador. O imperfeito do subjuntivo expressa naturalmente em português a ordem indireta no passado.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: das coisas santíssimas
  rationale: A expressão tem força superlativa e, neste contexto de aptidão sacerdotal e alimentação, designa porções comestíveis das ofertas especialmente sagradas, não o recinto chamado Santo dos Santos.
- source_word: עַד עֲמֹד כֹּהֵן
  choice: até que se apresentasse um sacerdote
  rationale: A construção com עַד assinala o ponto futuro até o qual a proibição vigoraria. «Se apresentasse» é natural em português e não pressupõe que o sacerdote ainda inexistisse.
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: com Urim e Tumim
  rationale: Os termos cúlticos são transliterados, pois sua forma exata não é conhecida. «Com» traduz de maneira idiomática a preposição e indica um sacerdote habilitado a realizar essa consulta.
theological_decisions:
- issue: Sentido de קֹדֶשׁ הַקֳּדָשִׁים neste contexto
  choice: Refere-se às porções sacerdotais santíssimas das ofertas.
  alternative: Entender a expressão como o Santo dos Santos, isto é, o recinto interior do santuário.
  rationale: O contexto trata de pessoas cuja genealogia sacerdotal não pôde ser comprovada, e a proibição diz respeito a comer. Portanto, a expressão designa alimento sagrado, não entrada em um espaço.
- issue: Tradução de Urim e Tumim
  choice: Preservar os termos técnicos por transliteração.
  alternative: Traduzi-los interpretativamente como «luzes e perfeições».
  rationale: Os objetos e o procedimento preciso de consulta permanecem incertos. A transliteração conserva a especificidade histórica sem criar uma interpretação etimológica indevidamente segura.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem indireta foi formulada com o imperfeito do subjuntivo; os termos cúlticos foram mantidos por transliteração, e as notas esclarecem sem resolver além da evidência as incertezas históricas.
