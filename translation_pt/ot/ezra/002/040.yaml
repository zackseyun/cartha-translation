base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: pt
  text: 'Os levitas: os filhos de Jesua e Cadmiel, dos filhos de Hodavias[a], setenta e quatro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “Hodavias”; o texto paralelo em Neemias 7:43 traz “Hodeva”.
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Os levitas
  rationale: O artigo definido e a designação do grupo introduzem uma nova categoria do recenseamento; a formulação funciona naturalmente como cabeçalho em português.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em contexto genealógico e censitário, a expressão indica os membros ou descendentes de uma família; a tradução formal preserva a estrutura hebraica.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliteração portuguesa tradicional e reconhecível do nome pós-exílico, distinguindo-o da forma usual Josué.
- source_word: וְקַדְמִיאֵל
  choice: e Cadmiel
  rationale: Conjunção simples seguida de nome próprio, transliterado segundo o uso português.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: O לְ é entendido em sentido genealógico ou classificatório, ligando Jesua e Cadmiel ao grupo familiar mencionado em seguida.
- source_word: הוֹדַוְיָה
  choice: Hodavias
  rationale: Reproduz a forma do Texto Massorético de Esdras; a forma diferente do paralelo em Neemias é registrada em nota.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: setenta e quatro
  rationale: Forma cardinal natural no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa própria de uma lista censitária. Mantém-se a formulação genealógica “filhos de”, em vez de explicitar “descendentes”, e a nota é posicionada após “Hodavias”, o nome ao qual se refere.
