lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: A expressão significa literalmente “filhos de” e, nesta lista de repatriados, funciona como designação de família ou clã. A formulação preserva a estrutura recorrente do registro e é clara em português.
- source_word: גִבָּר
  choice: Gibar
  rationale: Nome próprio transliterado segundo a forma hebraica apresentada. Em português, “Gibar” representa adequadamente as consoantes e a vocalização, sem recorrer à grafia inglesa “Gibbar”.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: noventa e cinco
  rationale: Equivalente idiomático exato da construção hebraica, que literalmente coordena “noventa” e “cinco”.
