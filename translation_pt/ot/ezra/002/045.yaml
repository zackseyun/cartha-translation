  text: os filhos de Lebana[a], os filhos de Hagaba, os filhos de Acube.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como “filhos de” pode indicar uma linhagem familiar ou um clã, e não apenas filhos homens imediatos.
