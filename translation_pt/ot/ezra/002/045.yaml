lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a forma hebraica e a estrutura repetitiva da lista, embora neste contexto possa designar descendentes ou membros de um grupo familiar.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Transliteração natural em português do nome próprio hebraico, sem representar o he final por uma consoante não pronunciada.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Transliteração natural em português do nome próprio hebraico; o h inicial representa a consoante gutural hebraica, e o he final não recebe representação consonantal.
- source_word: עַקּוּב
  choice: Acube
  rationale: Forma aportuguesada tradicional e legível do nome próprio hebraico, refletindo a consoante enfática duplicada sem impor grafia inglesa.
