lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista genealógica dos que retornaram, a fórmula hebraica introduz famílias ou clãs. A tradução direta «os filhos de» é convencional e, neste contexto, pode abranger descendentes posteriores.
- source_word: בַרְקוֹס
  choice: Barcos
  rationale: Nome próprio transliterado de modo natural em português, usando «c» para representar o som /k/ antes de «o».
- source_word: סִיסְרָא
  choice: Sísera
  rationale: Forma tradicional e reconhecível em português para o nome próprio hebraico; aqui designa o antepassado de uma família.
- source_word: תָמַח
  choice: Temá
  rationale: Transliteração que acompanha a vocalização massorética e recebe acento gráfico para preservar em português a tonicidade final.
