lexical_decisions:
- source_word: בְּנֵי
  choice: os descendentes de
  rationale: Na lista genealógica de Esdras, a expressão apresenta clãs ou grupos ligados a um ancestral ou epônimo, não necessariamente filhos imediatos. “Os descendentes de” comunica esse sentido coletivo com clareza em português atual.
- source_word: אַסְנָה
  choice: Asná
  rationale: Nome próprio transliterado segundo a forma massorética, com acento gráfico para indicar naturalmente a tonicidade em português.
- source_word: מעינים
  choice: Meunim
  rationale: Nome de grupo transliterado, mantendo uma forma reconhecível na tradição bíblica em português. A variante Maonim é registrada em nota.
- source_word: נפיסים
  choice: Nefisim
  rationale: Nome de grupo transliterado de acordo com a vocalização massorética apresentada. A variante tradicional Nefusim é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A repetição de “os descendentes de” preserva o caráter formular da lista, enquanto evita sugerir que todos fossem filhos biológicos imediatos. Os nomes próprios são transliterados e as variantes relevantes ficam nas notas.
