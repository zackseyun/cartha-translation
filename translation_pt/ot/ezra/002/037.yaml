lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em listas genealógicas e censitárias do período pós-exílico, בְּנֵי introduz com frequência um grupo familiar ou clã. “Os filhos de” preserva de modo natural e direto o idioma hebraico.
- source_word: אִמֵּר
  choice: Imer
  rationale: Nome próprio de pessoa e, neste contexto, de família; emprega-se a transliteração portuguesa corrente, com consoante única por não haver necessidade de representar graficamente a geminação.
- source_word: אֶלֶף חֲמִשִּׁים וּשְׁנָיִם
  choice: '1.052'
  rationale: A sequência cardinal significa literalmente “mil, cinquenta e dois”. O uso de algarismos é claro e apropriado ao contexto de uma lista censitária, seguindo a convenção portuguesa de ponto como separador de milhares.
theological_decisions: []
translation_notes:
  register: Formulação concisa e digna, própria de uma lista censitária. Mantém-se o hebraísmo inteligível “os filhos de”, sem explicitação interpretativa como “descendentes” ou “membros da família”.
