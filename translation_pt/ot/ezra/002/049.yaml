  text: os filhos de Uzá[a], os filhos de Paseia, os filhos de Besai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de” também pode indicar uma linhagem familiar ou descendentes, não apenas filhos imediatos.
