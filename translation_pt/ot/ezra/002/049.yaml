lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de בֵּן. Preserva a estrutura repetida e concisa da lista hebraica; neste contexto genealógico, pode designar uma linhagem ou grupo familiar, e não apenas filhos imediatos.
- source_word: עֻזָּא
  choice: Uzá
  rationale: Transliteração do nome próprio hebraico em forma natural para leitores de português, com acento para indicar a tonicidade final.
- source_word: פָסֵחַ
  choice: Paseá
  rationale: Transliteração do nome próprio hebraico, representando a consoante final ח de modo não técnico e indicando a tonicidade final.
- source_word: בֵסָי
  choice: Besai
  rationale: Transliteração direta e legível do nome próprio hebraico, preservando o ditongo final sugerido pelo yod.
