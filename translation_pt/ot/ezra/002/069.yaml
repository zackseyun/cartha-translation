base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: pt
  text: Conforme seus recursos, deram para o tesouro da obra 61.000 dáricos de ouro[a], 5.000 minas de prata[b] e 100 túnicas dos sacerdotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “moedas de ouro”; o termo hebraico se refere especificamente a dáricos persas.
    reason: lexical_alternative
  - marker: b
    text: A mina era uma antiga unidade de peso e de valor monetário.
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: Conforme as suas posses
  rationale: A expressão indica proporção segundo os recursos ou a capacidade de cada um. “Conforme as suas posses” comunica naturalmente a capacidade material no contexto de contribuições.
- source_word: נָתְנוּ
  choice: deram
  rationale: Equivalente direto e natural do verbo hebraico נתן, sem acrescentar nuances ausentes no texto.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: ao tesouro destinado à obra
  rationale: אוֹצָר designa um tesouro ou depósito, e מְלָאכָה se refere à obra em andamento. A formulação explicita de modo natural a destinação dos recursos sem confundir o tesouro com a própria obra.
- source_word: דַּרְכְּמוֹנִים
  choice: dáricos
  rationale: O empréstimo persa designa especificamente dáricos, moedas de ouro persas; a transliteração preserva a precisão histórica.
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: '61.000'
  rationale: O número hebraico, literalmente “seis dezenas de milhares e um milhar”, corresponde a 61.000. Algarismos favorecem a leitura da lista.
- source_word: מָנִים
  choice: minas
  rationale: מָנֶה é uma antiga unidade de peso e valor. “Minas” conserva a unidade histórica sem substituí-la por uma equivalência moderna inexata.
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: '5.000'
  rationale: Representação numérica clara e coerente com os demais valores da lista.
- source_word: כָתְנֹת כֹּהֲנִים
  choice: túnicas sacerdotais
  rationale: כֻּתֹּנֶת designa uma túnica ou veste longa. “Sacerdotais” preserva a relação genitiva com os sacerdotes, embora o hebraico possa indicar túnicas pertencentes ou destinadas a eles.
- source_word: מֵאָה
  choice: '100'
  rationale: Representação numérica clara e coerente com o estilo adotado no restante do versículo.
