source:
  edition: WLC
  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: pt
  text: 'os quais vieram com Zorobabel: Jesua, Neemias, Seraías, Reelaías[a], Mardoqueu, Bilsã, Mispar[b], Bigvai, Reum[c] e Baaná. O número[d] dos homens do povo de Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na lista paralela de Neemias 7:7, “Reelaías” aparece como “Raamias”.
    reason: alternative_reading
  - marker: b
    text: Na lista paralela de Neemias 7:7, “Mispar” aparece como “Misperete”.
    reason: alternative_reading
  - marker: c
    text: Na lista paralela de Neemias 7:7, “Reum” aparece como “Neum”.
    reason: alternative_reading
  - marker: d
    text: Esta expressão introduz a enumeração do recenseamento nos versículos seguintes.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: os quais
  rationale: O pronome relativo dá continuidade à oração iniciada no versículo anterior; esta forma mantém a ligação sintática sem acrescentar informação.
- source_word: בָּאוּ
  choice: vieram
  rationale: Traduz o sentido básico do qal perfeito de בוא; 'voltaram' explicitaria uma inferência do contexto do exílio que não está contida no verbo.
- source_word: עִם
  choice: com
  rationale: Preposição simples de companhia.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Representa a forma hebraica pós-exílica e distingue este nome, na forma portuguesa, de Josué.
- source_word: נְחֶמְיָה
  choice: Neemias
  rationale: Forma portuguesa consagrada do nome.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Segue a leitura do texto massorético, sem substituí-la pela variante da lista paralela.
- source_word: רְעֵלָיָה
  choice: Reelaías
  rationale: Translitera a forma do texto massorético; a forma diferente de Neemias 7:7 é registrada em nota.
- source_word: מָרְדֳּכַי
  choice: Mardoqueu
  rationale: Forma portuguesa tradicional e reconhecível do nome.
- source_word: בִּלְשָׁן
  choice: Bilsã
  rationale: Transliteração natural em português do nome próprio.
- source_word: מִסְפָּר
  choice: Mispar
  rationale: Neste ponto, a palavra funciona como nome próprio, não como o substantivo comum 'número'; a variante paralela é preservada em nota.
- source_word: בִּגְוַי
  choice: Bigvai
  rationale: Transliteração direta e legível do nome próprio.
- source_word: רְחוּם
  choice: Reum
  rationale: Translitera o nome conforme o texto massorético; a forma divergente da lista paralela é indicada em nota.
- source_word: בַּעֲנָה
  choice: Baaná
  rationale: Transliteração portuguesa clara do nome próprio.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: 'O número dos homens do povo de Israel foi:'
  rationale: Mantém o valor nominal de מִסְפַּר e reproduz a função da cláusula como introdução à enumeração que começa no versículo seguinte; 'foi' torna a introdução natural em português.
