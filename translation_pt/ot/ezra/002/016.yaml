lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em uma lista genealógica e censitária, o plural construto de בֵּן indica os membros ou descendentes de uma linhagem. “Os filhos de” preserva a forma tradicional e permanece compreensível no contexto.
- source_word: אָטֵר
  choice: Ater
  rationale: Nome próprio de pessoa ou família, transliterado de modo convencional em português.
- source_word: לִיחִזְקִיָּה
  choice: da família de Ezequias
  rationale: 'O לְ prefixado marca aqui afiliação ou subdivisão: identifica o ramo de Ater associado a Ezequias. A explicitação “da família de” comunica essa relação naturalmente e evita que “de Ezequias” pareça indicar filiação direta inequívoca.'
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: noventa e oito
  rationale: A expressão cardinal hebraica é vertida na forma numérica idiomática do português.
