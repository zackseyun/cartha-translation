- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista dos que retornaram em Esdras, בְּנֵי introduz repetidamente um grupo ligado a uma família, clã ou localidade. “Os filhos de” preserva a forma hebraica e continua clara em português; “os descendentes de” ou “os homens de” seriam possíveis, mas interpretariam de modo mais específico a relação do grupo.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nome próprio transliterado de acordo com o uso consagrado em português. Neste contexto, pode designar uma localidade ou o grupo associado a ela.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: cinquenta e dois
  rationale: Forma natural e exata, em português contemporâneo, do numeral cardinal hebraico.
