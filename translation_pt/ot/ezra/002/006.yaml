  text: 'os filhos de Paate-Moabe, dos filhos de Jesua e Joabe: 2.812.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Em listas genealógicas de Esdras, a expressão introduz um grupo familiar ou clã. “Os filhos de” preserva o idioma genealógico hebraico e é compreensível em português, podendo abranger descendentes.
- source_word: פַחַת מוֹאָב
  choice: Paate-Moabe
  rationale: Nome próprio composto, transliterado segundo formas correntes em português bíblico; o hífen evidencia a unidade do nome.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: O ל prefixed relaciona o grupo de Paate-Moabe às linhagens de Jesua e Joabe. A formulação conserva essa relação sem decidir além do que o hebraico explicita.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliteração portuguesa adequada da forma pós-exílica יֵשׁוּעַ, distinguindo-a da forma tradicional “Josué”.
- source_word: יוֹאָב
  choice: Joabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: '2.812'
  rationale: O número hebraico corresponde a dois mil oitocentos e doze. Algarismos favorecem a leitura de uma lista censitária, e o ponto segue a convenção portuguesa de separação de milhares.
