  text: besides their male and female slaves[a], these were 7,337; and they had 200 male and female singers.
translation:
  language: pt
  text: Além dos seus escravos e escravas[a], que eram 7.337, eles tinham 200 cantores e cantoras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos e servas”. Os termos hebraicos podem designar empregados domésticos em sentido mais amplo, mas, neste contexto censitário, “escravos e escravas” expressa melhor sua condição de dependência.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Além de
  rationale: Introduz um grupo adicional, não incluído no total anterior, de forma natural em português.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: seus escravos e escravas
  rationale: Os termos podem designar servos domésticos, mas, neste contexto censitário de dependentes e na combinação explícita das formas masculina e feminina, “escravos e escravas” comunica com mais clareza a condição social implicada.
- source_word: אֵלֶּה
  choice: que eram
  rationale: Retoma os escravos e as escravas e introduz naturalmente seu total em português, sem alterar o referente do pronome hebraico.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: '7.337'
  rationale: Mantém o número exato e usa a convenção portuguesa de ponto para separar milhares.
- source_word: וְלָהֶם
  choice: eles tinham
  rationale: Traduz idiomaticamente a construção possessiva hebraica; o antecedente são os membros da comunidade mencionados no contexto, não os escravos.
- source_word: מְשֹׁרְרִים וּמְשֹׁרְרוֹת
  choice: cantores e cantoras
  rationale: Preserva a distinção explícita de gênero do par hebraico em linguagem natural e concisa.
- source_word: מָאתָיִם
  choice: '200'
  rationale: Algarismos favorecem a leitura numa lista censitária.
