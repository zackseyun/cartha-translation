  naturalness: O texto é claro e de registro apropriado. «Família ancestral» é compreensível, mas «casa de seus pais»/«linhagem paterna» exprime mais diretamente o termo técnico; «casa de seus antepassados» mantém boa legibilidade e evita a ambiguidade de uma família meramente antiga.
  terminology: Os nomes transliterados são aceitáveis e consistentes com a forma portuguesa do rascunho. «Descendência» é adequado para זרע neste contexto. A nota deve refletir a redação efetivamente adotada e não introduzir «documentada» como se fosse uma afirmação lexical explícita; trata-se de uma inferência contextual legítima, que pode ser expressa com cautela.
