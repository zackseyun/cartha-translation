  text: וְ/אֵ֗לֶּה הָֽ/עֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדָּ֖ן אִמֵּ֑ר וְ/לֹ֣א יָֽכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: pt
  text: Estes foram os que subiram de Tel-Melá, Tel-Harsa, Querube, Adã e Imer, mas não puderam declarar sua casa de seus antepassados e sua descendência, se eram de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «a casa de seus pais e sua descendência». A expressão «casa de seus pais» designa a linhagem ou grupo familiar pelo lado paterno.'
    reason: Esclarece a expressão genealógica técnica e a formulação mais literal do hebraico, sem alterar a ambiguidade quanto à origem israelita.
lexical_decisions:
- source_word: הָעֹלִים
  choice: os que subiram
  rationale: Preserva o movimento expresso por עלה e a linguagem geográfica tradicional da subida para a terra, sem explicitar além do texto que eram retornados.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: de Tel-Melá, Tel-Harsa, Querube, Adã e Imer
  rationale: Translitera os topônimos ou nomes de grupos em formas legíveis e usuais em português, sem tentar traduzir seus possíveis significados.
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: não puderam declarar
  rationale: Expressa de modo direto a incapacidade de apresentar ou informar a genealogia no contexto administrativo do recenseamento.
- source_word: בֵּית אֲבוֹתָם
  choice: sua família ancestral
  rationale: Comunica em português corrente a unidade genealógica paterna designada literalmente como a 'casa de seus pais', evitando a expressão pouco transparente 'casa paterna' no texto principal.
- source_word: וְזַרְעָם
  choice: e sua descendência
  rationale: Neste contexto, זרע designa linhagem ou descendência, não 'semente' em sentido concreto.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: nem se eram de Israel
  rationale: Mantém a incerteza do hebraico quanto à origem ou pertença genealógica israelita; 'de Israel' evita decidir entre ascendência étnica e pertença comunitária.
theological_decisions:
- issue: Natureza da relação com Israel
  choice: se eram de Israel
  alternative: se pertenciam a Israel
  rationale: A formulação escolhida conserva a amplitude do hebraico, que no contexto pode se referir à descendência israelita comprovável, sem reduzir a questão a pertença institucional ou religiosa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de registro histórico-administrativo. Conserva-se o verbo tradicional “subiram”, enquanto a expressão genealógica é apresentada de modo compreensível no texto e esclarecida literalmente em nota.
