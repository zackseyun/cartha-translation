- source_word: בְּנֵי
  choice: os filhos de
  rationale: É o plural construto de בֵּן, literalmente “filhos de”. No contexto desta lista, pode designar pessoas vinculadas a uma família ou localidade; a formulação preserva o estilo registral do hebraico sem explicitar além do texto.
- source_word: בֵית לָחֶם
  choice: Belém
  rationale: É o topônimo conhecido em português; emprega-se sua forma tradicional, em vez de traduzir literalmente os elementos do nome.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: cento e vinte e três
  rationale: A sequência cardinal hebraica totaliza 123; esta é a expressão numérica natural no português moderno.
