lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista genealógica e familiar de Esdras, a expressão designa filhos, descendentes ou membros de uma linhagem. “Os filhos de” preserva a fórmula repetida do hebraico e é convencional em português, enquanto a nota esclarece sua amplitude contextual.
- source_word: קֵרֹס
  choice: Queros
  rationale: Nome próprio transliterado segundo uma forma natural em português, usando “qu” para representar o som consonantal antes de “e”.
- source_word: סִיעֲהָא
  choice: Siaá
  rationale: Transliteração portuguesa do nome próprio conforme a forma massorética; o acento final representa de modo legível sua terminação vocálica.
- source_word: פָדוֹן
  choice: Padom
  rationale: Transliteração adaptada à ortografia portuguesa, na qual “m” final representa naturalmente a nasalização correspondente à terminação do nome.
