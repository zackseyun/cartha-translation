  text: os filhos de Queros[a], os filhos de Siaá e os filhos de Padom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em listas genealógicas, “filhos de” também pode significar “descendentes de” ou membros de uma linhagem familiar, e não apenas filhos homens imediatos.
