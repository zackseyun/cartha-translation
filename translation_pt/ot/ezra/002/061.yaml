  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: pt
  text: 'E, dentre os filhos dos sacerdotes: os filhos de Habaías, os filhos de Hacoz e os filhos de Barzilai, que havia tomado por esposa uma das filhas de Barzilai, o gileadita, e foi chamado pelo nome deles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “e adotou o nome deles”. O hebraico diz literalmente “e foi chamado pelo nome deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: E, dentre os filhos dos sacerdotes
  rationale: A combinação de וּ com מִן tem sentido partitivo. “Filhos” preserva o registro genealógico do hebraico, embora no contexto indique descendentes.
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: os filhos de Habaías, os filhos de Hacoz e os filhos de Barzilai
  rationale: Mantém-se a repetição de בְּנֵי para refletir a estrutura formal da lista. Os nomes seguem formas portuguesas bíblicas legíveis.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: que havia tomado por esposa uma das filhas de
  rationale: “Havia tomado” expressa a anterioridade da ação, e “uma das filhas” torna explícito em português o sentido partitivo de מִן sem alterar o conteúdo.
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai, o gileadita
  rationale: O gentílico hebraico é vertido diretamente por “gileadita”, forma tradicional e clara em português.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: e passou a ser chamado pelo nome deles
  rationale: A formulação conserva a voz passiva do nifal e o sufixo plural “deles”, sem definir além do hebraico o mecanismo social da adoção do nome.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com transparência genealógica. A construção “tomado por esposa” preserva o sabor do idioma hebraico sem soar obscura; “passou a ser chamado” comunica naturalmente o resultado da mudança de nome.
