lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de בֵּן; numa lista genealógica e censitária, indica os membros ou descendentes de uma linhagem. A formulação preserva a estrutura hebraica e o padrão da lista.
- source_word: עֵילָם
  choice: Elão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio bíblico.
- source_word: אַחֵר
  choice: outro
  rationale: Distingue este grupo de Elão daquele mencionado anteriormente no capítulo, sem eliminar a ambiguidade sintática do hebraico.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1.254'
  rationale: A sequência cardinal hebraica totaliza 1.254; algarismos favorecem a leitura de uma lista censitária e preservam a quantidade exata.
