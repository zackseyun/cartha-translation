lexical_decisions:
- source_word: סוּסֵיהֶם
  choice: os cavalos deles
  rationale: סוּס significa “cavalo”; o plural com sufixo de terceira pessoa masculina plural expressa posse. “Os cavalos deles” é claro e natural em português amplo.
- source_word: שְׁבַע מֵאוֹת שְׁלֹשִׁים וְשִׁשָּׁה
  choice: setecentos e trinta e seis
  rationale: A sequência cardinal hebraica indica o total de 736, expresso segundo a forma numérica corrente em português.
- source_word: פִּרְדֵיהֶם
  choice: as mulas
  rationale: פֶּרֶד designa especificamente uma mula; a elipse do verbo na segunda oração reproduz com naturalidade a estrutura concisa do hebraico.
- source_word: מָאתַיִם אַרְבָּעִים וַחֲמִשָּׁה
  choice: duzentas e quarenta e cinco
  rationale: A sequência numérica indica 245; o feminino concorda naturalmente com “mulas” em português.
