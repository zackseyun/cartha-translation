  text: the sons of Ramah and Geba[a], six hundred twenty-one.
translation:
  language: pt
  text: os filhos de Ramá e Geba[a], seiscentos e vinte e um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “os descendentes de Ramá e Geba”. Nesta lista do recenseamento, a expressão hebraica “filhos de” pode indicar um grupo familiar ou comunitário mais amplo, e não apenas filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a forma do hebraico que estrutura esta lista, embora aqui a expressão possa designar um grupo familiar ou comunitário mais amplo, e não apenas filhos imediatos.
- source_word: הָרָמָה
  choice: Ramá
  rationale: Nome próprio de lugar, transliterado segundo a forma tradicional e natural em português.
- source_word: וָגָבַע
  choice: e Geba
  rationale: O waw é traduzido como “e”; o topônimo hebraico é transliterado como “Geba”, forma corrente em português bíblico.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: seiscentos e vinte e um
  rationale: Expressa de modo natural em português o total indicado pelo numeral cardinal hebraico.
