  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], 973.'
translation:
  language: pt
  text: 'Os sacerdotes: os filhos de Jedaías[a], da casa de Jesua[b], 973.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de Jedaías”. O hebraico diz literalmente “os filhos de Jedaías”, expressão genealógica comum.
    reason: lexical_alternative
  - marker: b
    text: Jesua é um nome pessoal do período pós-exílico, relacionado também ao nome Josué.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Os sacerdotes
  rationale: O substantivo definido plural significa diretamente “os sacerdotes” e, neste recenseamento, introduz o grupo sacerdotal enumerado.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a forma literal e o estilo genealógico do hebraico; neste contexto, pode abranger descendentes ou membros da linhagem familiar.
- source_word: יְדַעְיָה
  choice: Jedaías
  rationale: Transliteração portuguesa corrente do nome hebraico, com acento gráfico para orientar a pronúncia.
- source_word: לְבֵית
  choice: da casa de
  rationale: A preposição com “casa” indica pertença ou vinculação a uma linhagem familiar; “da casa de” é natural e mantém a estrutura genealógica.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliteração portuguesa da forma pós-exílica do nome hebraico; evita substituí-la pela forma relacionada “Josué”.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: '973'
  rationale: A sequência numérica hebraica totaliza 973; algarismos facilitam a leitura da lista sem alterar o sentido.
