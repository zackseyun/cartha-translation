- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista censitária de Esdras, a expressão introduz um grupo familiar ou clã. A tradução formalmente transparente preserva o modo de expressão hebraico, enquanto a nota esclarece seu sentido mais amplo.
- source_word: חָרִם
  choice: Harim
  rationale: Nome próprio pessoal ou familiar, transliterado em vez de traduzido.
- source_word: אֶלֶף וְשִׁבְעָה עָשָׂר
  choice: '1.017'
  rationale: O numeral hebraico significa literalmente “mil e dezessete”. Algarismos favorecem a leitura nesta lista censitária; usa-se o ponto como separador de mil conforme a convenção predominante em português.
