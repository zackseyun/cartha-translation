lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: O plural construto de בֵּן pode designar, em listas genealógicas e censitárias, os integrantes de uma linhagem ou clã. “Os filhos de” preserva a forma hebraica, enquanto a nota esclarece seu sentido mais amplo possível.
- source_word: עַזְמָוֶת
  choice: Azmavete
  rationale: O nome próprio é transliterado segundo uma forma natural em português. No contexto, pode identificar uma casa ancestral ou uma localidade associada ao grupo, ambiguidade que o texto não resolve.
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: quarenta e dois
  rationale: Tradução direta do numeral hebraico em português contemporâneo.
