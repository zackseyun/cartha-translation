lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן funciona nesta lista como fórmula de pertencimento familiar ou clânico. “Os filhos de” preserva a forma hebraica e é natural em português bíblico; a nota registra o sentido possível de descendência mais ampla.
- source_word: רְצִין
  choice: Rezim
  rationale: Nome próprio transliterado segundo uma forma corrente e legível em português, com -m final representando a consoante hebraica final נ.
- source_word: נְקוֹדָא
  choice: Necoda
  rationale: Nome próprio transliterado de modo próximo à forma hebraica e adaptado à ortografia e leitura portuguesas.
- source_word: גַזָּם
  choice: Gazão
  rationale: Nome próprio apresentado em forma tradicionalmente adaptada ao português; a nasalização final representa a terminação consonantal hebraica, enquanto a duplicação fonética indicada pelo daguesh não precisa ser reproduzida graficamente.
