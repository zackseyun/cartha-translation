  register: Português moderno, digno e acessível, com a cadência repetitiva própria de um registro genealógico. Mantém-se «os filhos de» para refletir a forma do hebraico, embora a expressão possa abranger descendentes ou membros das respectivas famílias. Os nomes seguem formas aportuguesadas correntes.
