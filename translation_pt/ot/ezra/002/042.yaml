base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: pt
  text: 'Os filhos dos porteiros: os filhos de Salum, os filhos de Ater, os filhos de Talmom, os filhos de Acube, os filhos de Hatita e os filhos de Sobai; ao todo, cento e trinta e nove.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: No contexto desta lista genealógica e administrativa, a expressão indica descendência ou pertencimento a um grupo familiar. A tradução formal preserva a estrutura repetitiva do hebraico sem impedir que seja entendida coletivamente.
- source_word: הַשֹּׁעֲרִים
  choice: os porteiros
  rationale: Designa os encarregados de guardar e atender as portas, particularmente as do templo. «Porteiros» é a designação bíblica corrente e clara em português; aqui não significa carregadores de bagagem.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Transliteração adaptada às convenções usuais dos nomes bíblicos em português.
- source_word: אָטֵר
  choice: Ater
  rationale: Transliteração direta do nome próprio, conforme o uso bíblico corrente em português.
- source_word: טַלְמוֹן
  choice: Talmom
  rationale: Forma portuguesa tradicional, com adaptação da consoante nasal final.
- source_word: עַקּוּב
  choice: Acube
  rationale: Forma adaptada à ortografia e à pronúncia usuais em português, preservando a consoante duplicada do hebraico apenas por seu valor fonético.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Transliteração simples do nome próprio segundo a vocalização massorética.
- source_word: שֹׁבָי
  choice: Sobai
  rationale: Transliteração que representa a vocalização massorética do nome próprio em ortografia portuguesa.
- source_word: הַכֹּל
  choice: ao todo
  rationale: Em uma lista censitária, a expressão introduz a soma conjunta dos grupos anteriores; «ao todo» é natural e preciso em português.
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: cento e trinta e nove
  rationale: Forma cardinal padrão em português para o total apresentado no texto hebraico.
