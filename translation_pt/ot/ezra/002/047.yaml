  text: the sons of Giddel[a], the sons of Gahar, the sons of Reaiah.
translation:
  language: pt
  text: os filhos de Gidel, os filhos de Gahar, os filhos de Reaías[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Raías».'
    reason: Alternativa de transliteração para o nome רְאָיָה, correspondente à nota lexical da trilha de auditoria inglesa.
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Plural construto de בֵּן em uma lista genealógica. A formulação preserva a estrutura repetitiva do hebraico e, neste contexto, pode designar os descendentes ou o grupo familiar ligado ao ancestral mencionado.
- source_word: גִדֵּל
  choice: Gidel
  rationale: Nome próprio transliterado segundo uma forma natural em português, com consoante simples entre vogais para representar a pronúncia pretendida.
- source_word: גַחַר
  choice: Gaar
  rationale: Nome próprio transliterado; o h hebraico representa uma consoante gutural que não possui equivalente direto e natural na ortografia portuguesa, por isso não foi reproduzido.
- source_word: רְאָיָה
  choice: Reaías
  rationale: Nome próprio transliterado de modo legível em português; o acento e o s final seguem uma forma portuguesa corrente para este nome bíblico e ajudam a indicar a pronúncia.
theological_decisions: []
translation_notes:
  register: Registro conciso e solene, apropriado a uma lista de famílias. Conserva-se a repetição de “os filhos de”, em correspondência direta com o hebraico, sem explicitar “descendentes”, embora esse seja o sentido coletivo provável no contexto.
