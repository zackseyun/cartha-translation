  text: בְּנֵי יַעְלָ֥ה בְנֵי דַרְק֖וֹן בְּנֵ֥י גִדֵּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/056.yaml
  text: the sons of Jaalah, the sons of Darkon, the sons of Giddel.
translation:
  language: pt
  text: os filhos de Jaalá, os filhos de Darcom e os filhos de Gidel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן, repetido nesta lista genealógica, designa os membros ou descendentes de uma família. “Os filhos de” preserva a forma hebraica e é claro em português.
- source_word: יַעְלָה
  choice: Jaalá
  rationale: Nome próprio transliterado conforme a vocalização massorética, com acento gráfico para indicar naturalmente a tonicidade final em português.
- source_word: דַרְקוֹן
  choice: Darcom
  rationale: 'Transliteração adaptada à ortografia portuguesa: o ק é representado por c, e o נ final por m, de acordo com a grafia natural diante de pausa.'
- source_word: גִדֵּל
  choice: Gidel
  rationale: Nome próprio transliterado; a duplicação consonantal indicada pelo daguesh não precisa ser reproduzida na grafia portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. Mantém-se a estrutura repetitiva da lista hebraica; acrescenta-se apenas a conjunção “e” antes do último item, de modo natural em português, sem alterar o sentido.
