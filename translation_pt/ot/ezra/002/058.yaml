base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/058.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: pt
  text: Todos os servidores do templo[a] e os descendentes dos servos de Salomão eram trezentos e noventa e dois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico נְתִינִים (netinins), termo técnico para uma classe designada ao serviço do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: Introduz o total conjunto dos dois grupos e corresponde de modo direto e natural ao quantificador hebraico.
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: נְתִינִים é um termo técnico pós-exílico para uma classe designada ao serviço do templo. A tradução funcional é clara ao leitor moderno, enquanto a transliteração obscureceria o sentido.
- source_word: וּבְנֵי
  choice: e os descendentes de
  rationale: Embora בְּנֵי signifique literalmente «filhos de», aqui designa um grupo de linhagem; «descendentes de» expressa naturalmente essa função em português sem sugerir apenas filhos imediatos.
- source_word: עַבְדֵי
  choice: servos de
  rationale: עֶבֶד pode significar servo ou escravo. Nesta lista administrativa, o termo faz parte da designação tradicional do grupo ligado a Salomão; «servos» preserva a ambiguidade social sem acentuar indevidamente a escravidão.
- source_word: שְׁלֹמֹה
  choice: Salomão
  rationale: Forma consagrada e amplamente reconhecida do nome hebraico em português.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: trezentos e noventa e dois
  rationale: Equivalente cardinal direto, em conformidade com a construção numérica natural do português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. «Servidores do templo» comunica a função institucional; «descendentes» torna explícito o valor genealógico de בְּנֵי neste contexto.
