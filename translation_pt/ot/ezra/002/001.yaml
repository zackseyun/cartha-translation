id: EZR.2.1
reference: Ezra 2:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָֽ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֥ר הֶגְלָ֛ה נבוכדנצור מֶֽלֶךְ בָּבֶ֖ל לְ/בָבֶ֑ל וַ/יָּשׁ֛וּבוּ לִ/ירוּשָׁלִַ֥ם וִֽ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/001.yaml
  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: pt
  text: Estes são os filhos da província[a] que subiram do cativeiro dos exilados[b], os quais Nabucodonosor, rei da Babilônia, havia deportado para a Babilônia; eles voltaram para Jerusalém e Judá, cada um para a sua cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “filhos da província” significa os membros ou habitantes da província.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do exílio” ou “do cativeiro”. A expressão hebraica é mais completa e diz literalmente “do cativeiro dos exilados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: filhos da província
  rationale: Mantém o idiomatismo hebraico e sua textura formal. Aqui, “filhos” designa os membros ou habitantes da província, não descendentes literais; a nota esclarece esse sentido.
- source_word: הָעֹלִים
  choice: que subiram
  rationale: Preserva a linguagem de subida em direção a Judá e Jerusalém e evita confundi-la com וַיָּשׁוּבוּ, que depois declara explicitamente o retorno.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: do cativeiro dos exilados
  rationale: 'Representa os dois elementos da expressão hebraica: שְׁבִי, “cativeiro”, e גּוֹלָה, entendido coletivamente como a comunidade dos exilados. A formulação mantém a expressão enfática sem se tornar ininteligível em português.'
- source_word: הֶגְלָה
  choice: havia deportado
  rationale: Expressa com precisão o causativo de גלה, isto é, enviar à força para o exílio. O mais-que-perfeito situa a deportação antes do retorno narrado.
- source_word: נבוכדנצור
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיָּשׁוּבוּ
  choice: eles voltaram
  rationale: Traduz diretamente o retorno e o distingue da subida mencionada anteriormente.
- source_word: לִירוּשָׁלַם וִיהוּדָה
  choice: para Jerusalém e Judá
  rationale: Reproduz diretamente os dois destinos indicados pelo texto hebraico.
- source_word: אִישׁ לְעִירוֹ
  choice: cada um para a sua cidade
  rationale: Preserva o valor distributivo de אִישׁ e o vínculo de cada pessoa com sua respectiva cidade, em português natural.
theological_decisions: []
