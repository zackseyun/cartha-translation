translation:
  language: pt
  text: 'Os filhos de Lod[a], Hadid e Ono: setecentos e vinte e cinco.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Os descendentes de Lod, Hadid e Ono”. Nesta lista de repatriados, “filhos de” pode indicar um grupo familiar ou comunitário mais amplo, não apenas filhos homens imediatos. Lod ficou conhecida mais tarde como Lida.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Preserva a forma do hebraico e, neste contexto de lista de repatriados, pode designar descendentes, um grupo familiar ou uma comunidade ligada às localidades mencionadas.
- source_word: לֹד
  choice: Lod
  rationale: Nome de lugar transliterado diretamente do hebraico; a forma posterior é Lida.
- source_word: חָדִיד
  choice: Hadid
  rationale: Nome de lugar transliterado do hebraico.
- source_word: וְאוֹנוֹ
  choice: e Ono
  rationale: Traduz a conjunção hebraica e translitera o nome da localidade.
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: setecentos e vinte e cinco
  rationale: Reproduz exatamente o total de 725 em formulação portuguesa natural.
