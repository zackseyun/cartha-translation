base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/043.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[c][b], the sons of Tabbaoth.'
translation:
  language: pt
  text: 'Os servidores do templo: os filhos[a] de Zia, os filhos de Hasufa[b], os filhos de Tabaote.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em cada ocorrência, “filhos de” também pode ser entendido como “descendentes de”; a fórmula hebraica pode indicar uma linhagem familiar, não apenas filhos imediatos.
    reason: lexical_alternative
  - marker: b
    text: O nome também aparece grafado como “Hasupha” em diferentes tradições de transliteração.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: O termo designa uma classe ligada ao serviço do santuário. A tradução funcional é clara em português moderno e evita a transliteração pouco compreensível “netinins”.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a fórmula repetida do registro hebraico, embora neste contexto genealógico também possa significar “descendentes de”.
- source_word: צִיחָא
  choice: Zia
  rationale: Transliteração adaptada ao uso bíblico corrente em português, sem acrescentar significado ao nome próprio.
- source_word: חֲשׂוּפָא
  choice: Hasufa
  rationale: Transliteração portuguesa do nome próprio, representando a consoante inicial hebraica por H e o שׂ por s.
- source_word: טַבָּעוֹת
  choice: Tabaote
  rationale: O vocábulo funciona como nome próprio ou nome de clã nesta lista; por isso, é transliterado em vez de traduzido.
