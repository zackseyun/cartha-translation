lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: O plural construto de בֵּן, neste contexto genealógico e censitário, designa os membros ou descendentes de uma linhagem. “Os filhos de” preserva a forma concisa e repetitiva da lista de Esdras e é natural em português bíblico moderno.
- source_word: יוֹרָה
  choice: Jorá
  rationale: O nome próprio é transliterado segundo a forma hebraica presente em Esdras 2:18. A acentuação gráfica torna clara a pronúncia em português; a forma variante em Neemias 7:24 é registrada em nota.
- source_word: מֵאָה וּשְׁנֵים עָשָׂר
  choice: cento e doze
  rationale: Tradução direta do numeral cardinal, em formulação padrão, clara e adequada ao registro de uma lista censitária.
