- source_word: עַזְגָּד
  choice: Azgade
  rationale: Nome próprio transliterado segundo uma forma portuguesa clara, com vogal final de apoio para tornar pronunciável o encontro consonantal final do hebraico.
- source_word: אֶלֶף מָאתַיִם עֶשְׂרִים וּשְׁנָיִם
  choice: '1.222'
  rationale: A sequência cardinal hebraica totaliza 1.222. Algarismos combinam com o gênero censitário e, em português, o ponto separa os milhares.
