  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pokereth-hazzebaim, the sons of Ami.
translation:
  language: pt
  text: os filhos de Sefatias, os filhos de Hatil, os filhos de Poquerete-Hazebaim[a] e os filhos de Ami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou talvez: “Poquerete de Zebaim”; o hebraico pode ser entendido como um nome familiar composto ou como um nome seguido de uma qualificação.'
    reason: alternativa lexical
lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Neste contexto de lista genealógica, a expressão introduz grupos familiares ou clãs. A tradução preserva a estrutura repetitiva do hebraico e continua clara em português.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Nome próprio transliterado na forma tradicional e reconhecível em português.
- source_word: חַטִּיל
  choice: Hatil
  rationale: Nome próprio ou de clã, transliterado em português sem tentativa de traduzir seu possível significado.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Poquerete-Hazebaim
  rationale: A forma hifenizada conserva a ligação estreita entre os dois elementos e evita decidir de modo categórico se constituem um nome familiar composto ou um nome seguido de qualificação.
- source_word: אָמִי
  choice: Ami
  rationale: Nome próprio ou de clã, transliterado em português.
