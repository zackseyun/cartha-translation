lexical_decisions:
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Na lista genealógica dos que retornaram, a expressão construta designa uma linhagem ou grupo familiar. “Os filhos de” preserva a forma repetitiva e genealógica do hebraico, sem excluir o sentido mais amplo de descendentes.
- source_word: חָגָב
  choice: Hagabe
  rationale: Nome próprio ou de clã, transliterado segundo uma forma corrente e natural em português.
- source_word: שמלי
  choice: Shamlai
  rationale: Nome próprio transliterado de modo a refletir de perto a sequência consonantal do texto hebraico. A forma alternativa “Shalmai” é registrada em nota.
- source_word: חָנָן
  choice: Hanã
  rationale: Nome próprio ou de clã transliterado em forma natural para leitores de língua portuguesa.
