source:
  edition: WLC
  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: pt
  text: 'Assim diz Ciro, rei da Pérsia: “Yahweh, o Deus dos céus, me deu todos os reinos da terra e me incumbiu[a] de construir para ele uma casa[b] em Jerusalém, que fica em Judá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me encarregou” ou “me ordenou”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo de Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula solene de proclamação do hebraico em linguagem bíblica natural e atual.
- source_word: כֹּרֶשׁ מֶלֶךְ פָּרַס
  choice: Ciro, rei da Pérsia
  rationale: Emprega a forma portuguesa convencional do nome e mantém o título real em aposição.
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: todos os reinos da terra
  rationale: Mantém o plural מַמְלְכוֹת e entende הָאָרֶץ em seu alcance amplo, apropriado à retórica imperial.
- source_word: נָתַן לִי
  choice: me deu
  rationale: O pretérito perfeito expressa de modo natural em português a concessão passada que fundamenta a autoridade presente de Ciro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: o Deus dos céus
  rationale: Reproduz o plural hebraico e corresponde a uma designação natural e reconhecível em português.
- source_word: פָקַד עָלַי
  choice: me incumbiu
  rationale: Comunica a atribuição de uma responsabilidade ou missão, sem tornar o verbo mais coercitivo do que o hebraico exige.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: construir para ele uma casa
  rationale: Mantém o sentido lexical de בַיִת, deixando a identificação contextual com o templo para a nota.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: em Jerusalém, que fica em Judá
  rationale: Conserva explicitamente a oração relativa e apresenta a localização de forma corrente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz o nome divino, não apenas um título; a transliteração preserva essa distinção sem substituí-la interpretativamente.
- issue: Sentido contextual de בַיִת
  choice: casa
  alternative: templo
  rationale: A tradução principal preserva o termo hebraico concreto, enquanto a nota esclarece seu referente cultual no contexto.
- issue: Força de פָקַד עָלַי
  choice: me incumbiu
  alternative: me encarregou; me ordenou
  rationale: O verbo pode indicar comissão, encargo ou ordem. “Incumbiu” mantém essa amplitude melhor do que uma formulação inequivocamente imperativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade no Brasil e compreensão internacional. A fórmula régia conserva dignidade bíblica sem arcaísmos; “casa” mantém a imagem do original, e a nota fornece o referente contextual.
