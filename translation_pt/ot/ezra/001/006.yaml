base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: pt
  text: E todos os que viviam ao redor deles os ajudaram[a] com objetos de prata, ouro, bens, animais de criação e coisas preciosas, além de tudo o que foi oferecido voluntariamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fortaleceram as mãos deles”; isto é, deram-lhes apoio.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “além de toda oferta voluntária”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: os que moravam ao redor deles
  rationale: Expressa as pessoas das áreas vizinhas sem restringir o sentido a vizinhos imediatos.
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: os ajudaram
  rationale: O hebraísmo literal, “fortaleceram as mãos deles”, indica aqui apoio prático e material; a formulação natural comunica esse sentido, enquanto a nota preserva a imagem original.
- source_word: בִּכְלֵי כֶסֶף
  choice: com objetos de prata
  rationale: כְּלִי é amplo e pode designar objeto, utensílio ou recipiente; “objetos” evita restringir indevidamente a natureza dos presentes.
- source_word: בַּזָּהָב
  choice: ouro
  rationale: Mantém o substantivo simples do hebraico e dá continuidade natural à lista de contribuições.
- source_word: בָּרְכוּשׁ
  choice: bens
  rationale: Designa bens ou propriedade móvel, adequado ao contexto de recursos fornecidos aos que retornavam.
- source_word: וּבַבְּהֵמָה
  choice: animais
  rationale: O substantivo coletivo se refere a animais domésticos possuídos; “animais” é claro e abrangente no português atual.
- source_word: וּבַמִּגְדָּנוֹת
  choice: coisas preciosas
  rationale: Preserva a amplitude de מִגְדָּנוֹת, que pode indicar objetos valiosos, presentes especiais ou iguarias, sem limitar o referente a alimentos.
- source_word: לְבַד עַל כָּל הִתְנַדֵּב
  choice: além de tudo o que foi oferecido voluntariamente
  rationale: Reproduz a ideia adicional de לְבַד עַל e a oferta espontânea expressa pela forma de נדב, sem inserir um sujeito ausente no texto.
