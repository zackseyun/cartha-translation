  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: pt
  text: E o rei Ciro tirou os utensílios da casa de Yahweh[a], que Nabucodonosor havia tirado de Jerusalém e colocado na casa de seu deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “templo de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: o rei Ciro
  rationale: Segue a ordem idiomática do português para título real e nome próprio.
- source_word: הוֹצִיא
  choice: mandou trazer
  rationale: O hifil de יצא expressa fazer sair ou trazer para fora. No contexto, Ciro provavelmente ordena que os objetos sejam retirados; esta formulação comunica naturalmente a causatividade sem acrescentar um agente específico.
- source_word: כְּלֵי
  choice: utensílios
  rationale: No contexto do templo, designa objetos usados no culto; “utensílios” é corrente e não especifica indevidamente sua forma.
- source_word: בֵית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica literal e o paralelismo com “casa de seu deus”; a nota registra a alternativa contextual “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הוֹצִיא ... מִירוּשָׁלִַם
  choice: havia tirado de Jerusalém
  rationale: O mesmo verbo recebe aqui uma formulação portuguesa natural para remover objetos de um lugar; o mais-que-perfeito composto marca a anterioridade em relação à ação de Ciro.
- source_word: וַיִּתְּנֵם
  choice: e colocado
  rationale: Com a indicação de lugar seguinte, נתן tem o sentido contextual de pôr ou colocar. O objeto “os” fica naturalmente subentendido após a oração relativa.
- source_word: בְּבֵית אֱלֹהָיו
  choice: na casa de seu deus
  rationale: Mantém o singular do hebraico e o paralelismo lexical com a casa de Yahweh, sem ampliar a referência ao panteão babilônico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Identidade e número da divindade de Nabucodonosor
  choice: seu deus
  alternative: seus deuses
  rationale: אֱלֹהָיו está construído aqui com referente singular e sufixo masculino singular. A tradução mantém a forma do texto sem harmonizá-la com informações gerais sobre o politeísmo babilônico.
- issue: Relação entre “casa” e “templo”
  choice: casa
  alternative: templo
  rationale: “Casa” conserva o paralelismo deliberado entre a casa de Yahweh e a casa do deus de Nabucodonosor; “templo” explicita corretamente o sentido contextual e aparece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Mandou trazer” torna explícito apenas o valor causativo do verbo hebraico, enquanto “utensílios” evita o tom arcaico de “vasos” e a vagueza de “objetos”.
