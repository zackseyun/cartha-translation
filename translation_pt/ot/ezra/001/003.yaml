base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: pt
  text: Quem, dentre todo o povo dele, estiver entre vocês, que o seu Deus esteja com ele e que suba a Jerusalém, que fica em Judá, e reconstrua[a] a casa de Yahweh, o Deus[b] de Israel. Ele é o Deus que está em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “construa”. O verbo hebraico significa simplesmente “construir”; “reconstrua” explicita o contexto de restauração.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Ele é Deus”. O hebraico pode ser traduzido de modo mais conciso, embora o artigo favoreça “o Deus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: Quem, dentre todo o povo dele, estiver entre vocês
  rationale: Preserva a forma indefinida do convite, a referência pronominal de עַמּוֹ e os dois elementos locativos do hebraico, sem identificar explicitamente o referente de “dele” além do que o texto diz.
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: que o seu Deus esteja com ele
  rationale: Traduz o jussivo como bênção ou desejo e mantém o tom da proclamação real.
- source_word: וְיַעַל
  choice: suba
  rationale: Mantém o uso convencional de עלה para a viagem a Jerusalém, com sua nuance geográfica e cultual.
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: a Jerusalém, que fica em Judá
  rationale: Conserva a identificação geográfica em português natural e atual.
- source_word: וְיִבֶן
  choice: e reconstrua
  rationale: Embora o verbo signifique literalmente “construir”, “reconstruir” explicita adequadamente o contexto de restauração do templo após sua destruição; a forma mais literal é registrada em nota.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a metáfora hebraica “casa” e verte diretamente o nome divino.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz diretamente a construção hebraica e sua identificação pactual.
- source_word: הוּא הָאֱלֹהִים
  choice: Ele é o Deus
  rationale: O artigo em הָאֱלֹהִים favorece “o Deus”, mantendo também a ênfase identificadora do hebraico.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: que está em Jerusalém
  rationale: Mantém sem suavização a formulação locativa histórica da proclamação de Ciro.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Cláusula que situa Deus em Jerusalém
  choice: Ele é o Deus que está em Jerusalém
  alternative: Ele é Deus, que está em Jerusalém; suavizar ou omitir a localização
  rationale: A formulação histórica da proclamação associa o Deus de Israel a Jerusalém e à sua casa. A tradução retém essa tensão sem importar uma harmonização teológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura conserva a estrutura inclusiva do convite sem a rigidez de uma reprodução palavra por palavra. Os travessões isolam naturalmente a bênção parentética, e os marcadores de nota foram colocados junto às expressões a que efetivamente se referem.
