  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: pt
  text: E todo aquele que restar, em qualquer lugar onde estiver morando[a], os homens daquele lugar[b] o sustentem com prata, ouro, bens e animais domésticos[c], juntamente com a oferta voluntária para a casa de Deus que está em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde estiver residindo como estrangeiro”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é literalmente “os homens do seu lugar” e pode referir-se de modo mais amplo aos habitantes locais ou aos vizinhos.
    reason: lexical_alternative
  - marker: c
    text: “Animais domésticos” pode também ser traduzido por “rebanhos” ou “animais”. O verbo traduzido por “sustentem” significa literalmente “levantem” ou “carreguem”; neste contexto, indica auxílio material.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: aquele que restar
  rationale: O particípio nifal de שׁאר designa quem permanece ou é deixado; a formulação preserva a referência a cada integrante do povo que não parte de imediato.
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: em qualquer lugar onde estiver morando
  rationale: A expressão indica o local de residência na dispersão. גּוּר pode significar residir ou viver como estrangeiro; o texto principal usa uma formulação portuguesa natural, mantendo a nuance alternativa em nota.
- source_word: יְנַשְּׂאֻהוּ
  choice: seja sustentado
  rationale: Embora נשׂא signifique literalmente levantar ou carregar, aqui os complementos materiais indicam auxílio ou provisão prática; 'sustentado' comunica esse sentido contextual.
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: os homens daquele lugar
  rationale: Preserva a forma masculina explícita do hebraico, sem excluir a possibilidade contextual de uma referência mais ampla aos habitantes locais.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: com prata, ouro
  rationale: Mantém os termos tradicionais para os metais preciosos sem restringir prata ao sentido de moeda.
- source_word: וּבִרְכוּשׁ
  choice: bens
  rationale: רְכוּשׁ designa bens, posses ou propriedade móvel; 'bens' é conciso e natural na enumeração.
- source_word: וּבִבְהֵמָה
  choice: animais
  rationale: בְּהֵמָה é um coletivo de animais domésticos. 'Animais' é amplamente compreensível; o sentido específico de rebanhos ou animais domésticos é indicado em nota.
- source_word: עִם הַנְּדָבָה
  choice: além da oferta voluntária
  rationale: עִם introduz a oferta adicional destinada à casa de Deus. נְדָבָה é uma contribuição espontânea, portanto 'oferta voluntária' preserva o caráter não compulsório.
- source_word: לְבֵית הָאֱלֹהִים
  choice: para a casa de Deus
  rationale: Reproduz a expressão hebraica sem substituí-la interpretativamente por 'templo'.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: que está em Jerusalém
  rationale: Traduz diretamente a oração relativa que localiza a casa de Deus.
theological_decisions:
- issue: Linguagem de gênero em אַנְשֵׁי מְקֹמוֹ
  choice: os homens daquele lugar
  alternative: os habitantes daquele lugar; seus vizinhos
  rationale: A tradução conserva o substantivo masculino plural do hebraico, enquanto a nota reconhece que a expressão pode funcionar socialmente como referência mais ampla à comunidade local.
- issue: Sentido contextual de יְנַשְּׂאֻהוּ
  choice: seja sustentado
  alternative: seja auxiliado; seja carregado
  rationale: A tradução literal 'carregado' sugeriria transporte físico. A enumeração de prata, ouro, bens e animais mostra que o decreto ordena apoio material, mas uma nota conserva a imagem lexical do verbo.
- issue: Relação de עִם הַנְּדָבָה com os recursos dados ao repatriado
  choice: além da oferta voluntária
  alternative: juntamente com a oferta voluntária
  rationale: A oferta para a casa de Deus acompanha, mas é conceitualmente distinta, dos recursos destinados a sustentar quem retorna. 'Além de' torna essa relação clara sem eliminar a possibilidade de coordenação expressa por עִם.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção passiva evita uma sequência pesada de sujeitos e mantém o caráter prescritivo do decreto. As notas preservam as nuances de residência estrangeira, do referente masculino potencialmente coletivo e da imagem literal de auxílio do verbo hebraico.
