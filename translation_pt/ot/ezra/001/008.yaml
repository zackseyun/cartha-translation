    issue: «os entregou, depois de contá-los» acrescenta a entrega como ação verbal explícita.
    rationale: וַיִּסְפְּרֵם significa ‘contou-os/enumerou-os’; no contexto, a contagem está ligada à transferência, mas o texto não usa um verbo independente para ‘entregar’. Uma redação que diga diretamente que foi feita a contagem preserva melhor o enunciado.
  - severity: low
    issue: A forma do nome «Mitredate» não segue a forma portuguesa mais usual.
    rationale: «Mitrídates» é a transliteração convencional em português nas referências bíblicas a esse nome persa.
  - severity: low
    issue: A nota sobre «príncipe» está incompleta em relação à amplitude lexical relevante.
    rationale: Além de ‘líder’, o termo pode ser vertido mais genericamente como ‘governante’; registrar isso informa a alternativa sem impor ‘governador’ como título técnico.
