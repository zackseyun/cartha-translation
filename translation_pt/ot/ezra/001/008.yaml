  text: וַ/יּֽוֹצִיאֵ֗/ם כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס עַל יַ֖ד מִתְרְדָ֣ת הַ/גִּזְבָּ֑ר וַֽ/יִּסְפְּרֵ/ם֙ לְ/שֵׁשְׁבַּצַּ֔ר הַ/נָּשִׂ֖יא לִ/יהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: pt
  text: Ciro, rei da Pérsia, mandou retirar esses objetos por meio de Mitrídates, o tesoureiro, e fez a contagem deles para Sesbazar, o príncipe de Judá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o líder de Judá” ou “o governante de Judá”. O termo hebraico pode indicar, de modo mais geral, um chefe ou governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: mandou retirar esses objetos
  rationale: O hifil de יצא expressa causação. O contexto do versículo anterior mostra que o pronome se refere aos utensílios do templo; explicitar “objetos” evita que o leitor pense em pessoas, e “mandou retirar” preserva a ação causativa de Ciro.
- source_word: עַל יַד
  choice: por meio de
  rationale: A expressão idiomática hebraica indica agência ou intermediação. “Por meio de” é natural em português e comunica essa função sem reproduzir literalmente “pela mão de”.
- source_word: מִתְרְדָת
  choice: Mitredate
  rationale: Forma portuguesa tradicional e reconhecível do nome persa.
- source_word: הַגִּזְבָּר
  choice: o tesoureiro
  rationale: Designa um funcionário ligado ao tesouro; “tesoureiro” é conciso e adequado ao contexto dos utensílios reais.
- source_word: וַיִּסְפְּרֵם
  choice: os entregou, depois de contá-los
  rationale: ספר significa contar ou enumerar. A formulação portuguesa expressa naturalmente a contagem associada à transferência dos objetos a Sesbazar, sem perder o valor verbal explícito.
- source_word: לְשֵׁשְׁבַּצַּר
  choice: a Sesbazar
  rationale: O nome próprio é transliterado segundo forma corrente em português, e a preposição marca o destinatário.
- source_word: הַנָּשִׂיא
  choice: o príncipe
  rationale: נָשִׂיא pode designar príncipe, chefe ou líder. “Príncipe” mantém uma tradução tradicional sem impor o título administrativo mais específico de governador.
- source_word: לִיהוּדָה
  choice: de Judá
  rationale: Na expressão titular, a relação de Sesbazar com Judá é comunicada naturalmente por “de Judá”.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Ciro, rei da Pérsia
  rationale: A ordem e a aposição são naturais em português e preservam o nome, o título e o domínio do monarca.
theological_decisions:
- issue: Sentido do título נָשִׂיא aplicado a Sesbazar
  choice: príncipe de Judá
  alternative: líder de Judá; governador de Judá
  rationale: O termo hebraico é amplo. “Príncipe” preserva essa designação tradicional, enquanto “governador” poderia importar uma função administrativa persa mais específica do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção explicita que o pronome se refere aos objetos do templo, recuperando o antecedente imediato. O hebraísmo “pela mão de” foi vertido idiomaticamente como “por meio de”.
