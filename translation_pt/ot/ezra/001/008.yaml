revisions:
- from: Ciro, rei da Pérsia, mandou retirar esses objetos por meio de Mitredate, o tesoureiro, e os entregou, depois de contá-los, a Sesbazar, o príncipe de Judá.[a]
  to: Ciro, rei da Pérsia, mandou retirar esses objetos por meio de Mitrídates, o tesoureiro, e fez a contagem deles para Sesbazar, o príncipe de Judá.[a]
  rationale: A revisão substitui a entrega explicitada por uma formulação que traduz diretamente a contagem dos objetos para Sesbazar, adota a forma portuguesa corrente «Mitrídates» e completa a nota lexical de נָשִׂיא. Mantêm-se a explicitação contextual de que o pronome se refere aos objetos e a tradução idiomática de עַל־יַד como «por meio de».
