  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּק֜וּמוּ רָאשֵׁ֣י הָ/אָב֗וֹת לִֽ/יהוּדָה֙ וּ/בִנְיָמִ֔ן וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/כֹ֨ל הֵעִ֤יר הָ/אֱלֹהִים֙ אֶת רוּח֔/וֹ לַ/עֲל֣וֹת לִ/בְנ֔וֹת אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: pt
  text: Então se levantaram os chefes das casas paternas de Judá e Benjamim, os sacerdotes e os levitas — todos aqueles cujo espírito Deus havia despertado[a] —, para subir e construir a casa de Yahweh[b], que está em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujo espírito Deus havia estimulado” ou “a quem Deus havia movido interiormente”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: se levantaram
  rationale: Preserva o movimento narrativo do qal de קום e indica o início da ação em resposta ao decreto, sem antecipar a partida.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: os chefes das casas paternas
  rationale: Mantém visível a estrutura hebraica de parentesco e comunica a função de liderança dos grupos familiares ancestrais.
- source_word: לִיהוּדָה וּבִנְיָמִן
  choice: de Judá e Benjamim
  rationale: O לְ indica aqui filiação ou pertencimento tribal, expresso naturalmente em português pela preposição “de”.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os sacerdotes e os levitas
  rationale: São as designações correntes e precisas dos respectivos grupos cultuais.
- source_word: לְכֹל הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: todos aqueles cujo espírito Deus havia despertado
  rationale: A formulação distributiva inclui todos os indivíduos interiormente impelidos por Deus. “Havia despertado” conserva a imagem do verbo עור e apresenta a ação divina como anterior à resposta deles.
- source_word: רוּחַ
  choice: espírito
  rationale: Preserva o termo hebraico e sua ressonância teológica, referindo-se aqui à disposição ou impulso interior.
- source_word: לַעֲלוֹת
  choice: para subir
  rationale: Conserva o modo convencional de falar da viagem a Jerusalém, com sua dimensão geográfica e religiosa.
- source_word: לִבְנוֹת
  choice: construir
  rationale: O hebraico diz literalmente “construir”. Embora o contexto envolva reconstrução, não se acrescenta ao verbo uma ideia que ele não explicita.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Preserva a imagem hebraica de “casa” em vez de substituí-la diretamente pela explicação “templo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: que está em Jerusalém
  rationale: A oração relativa identifica a localização da casa. O presente evita sugerir que a casa deixou de ter identidade ou localização por estar em ruínas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem o substituir por um título.
- issue: Grau de interpretação da ação divina em הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ
  choice: cujo espírito Deus havia despertado
  alternative: a quem Deus havia inspirado; a quem Deus havia impulsionado
  rationale: A tradução atribui explicitamente a Deus o despertar interior, como faz o hebraico, mas não define um mecanismo teológico ou uma experiência específica além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as expressões fonte “casas paternas”, “espírito”, “subir” e “casa de Yahweh” para conservar a textura histórica e teológica do hebraico; os travessões esclarecem a relação entre os grupos mencionados e todos os que foram despertados por Deus.
