  source_fidelity: 'A tradução reproduz com precisão a sequência e as relações sintáticas do hebraico: os chefes das casas paternas de Judá e Benjamim, os sacerdotes e os levitas respondem ao despertar de seu espírito por Deus, a fim de subir e construir a casa de Yahweh em Jerusalém. «Para subir» preserva adequadamente עלה, sem antecipar a viagem, e «construir» não introduz indevidamente «reconstruir».'
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. «Casas paternas» é uma formulação um pouco técnica, mas justificadamente transparente ao hebraico e inteligível no contexto. A construção parentética com travessões comunica adequadamente que o despertar divino abrange os participantes mencionados.
  terminology: «Sacerdotes», «levitas», «espírito», «casa de Yahweh» e «Yahweh» são consistentes com o texto-fonte e com as decisões terminológicas apresentadas. A nota a preserva alternativas legítimas para o verbo עור; a nota b esclarece «casa» como templo sem substituir a expressão no texto.
