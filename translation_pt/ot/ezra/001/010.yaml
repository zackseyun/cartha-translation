lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: tigelas
  rationale: O substantivo designa um tipo de recipiente. “Tigelas” é claro e natural em português, sem especificar excessivamente seu formato; “bacias” também seria possível.
- source_word: זָהָב
  choice: de ouro
  rationale: Termo comum para o material; em português, a construção atributiva natural é “tigelas de ouro”.
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: O numeral foi apresentado em algarismos para facilitar a leitura desta lista de inventário.
- source_word: כְּפוֹרֵי כֶסֶף
  choice: tigelas de prata
  rationale: Mantém de modo coerente a tradução do mesmo termo usado anteriormente e identifica o material dos recipientes.
- source_word: מִשְׁנִים
  choice: de uma segunda categoria
  rationale: A expressão é incerta neste contexto. Esta opção indica uma distinção no inventário sem impor o sentido matemático de “em dobro”.
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: O numeral composto foi apresentado em algarismos para clareza e coerência na lista.
- source_word: כֵּלִים
  choice: utensílios
  rationale: O termo é amplo e designa objetos ou artigos, inclusive os empregados no templo. “Utensílios” é natural em português e adequado ao contexto.
- source_word: אֲחֵרִים
  choice: outros
  rationale: Distingue diretamente estes objetos dos recipientes enumerados antes.
- source_word: אָלֶף
  choice: '1.000'
  rationale: O numeral foi apresentado em algarismos, com a convenção portuguesa de separação de milhares, para manter a clareza da lista.
