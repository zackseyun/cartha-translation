base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: pt
  text: Todos os objetos[a] de ouro e prata eram, ao todo, cinco mil e quatrocentos. Sesbazar os levou para Jerusalém junto com os exilados[c], quando estes foram levados[b] da Babilônia para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “utensílios” ou “peças”. O termo hebraico é amplo e pode designar utensílios, recipientes ou objetos, especialmente os usados no templo.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa duas vezes o verbo “subir” neste versículo, refletindo a maneira habitual de falar da ida a Jerusalém.
    reason: cultural_note
  - marker: c
    text: Ou “a comunidade exilada” ou “os deportados”. O termo hebraico pode designar coletivamente os que estavam no exílio.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: objetos
  rationale: כֵּלִים é um termo amplo que pode designar utensílios, recipientes ou outros objetos. No contexto do tesouro do templo, “objetos” é natural e não restringe indevidamente o tipo de peças.
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: de ouro e de prata
  rationale: Os prefixos classificam os objetos segundo o material; a formulação portuguesa é idiomática e concisa.
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת הַכֹּל
  choice: Ao todo, eram cinco mil e quatrocentos
  rationale: הַכֹּל apresenta a soma total; “ao todo” expressa naturalmente essa função em português.
- source_word: הֶעֱלָה
  choice: levou para cima
  rationale: O hifil de עלה significa fazer subir ou levar para cima. A tradução conserva a linguagem de subida associada à ida a Jerusalém sem empregar o pouco natural “fez subir” para objetos.
- source_word: שֵׁשְׁבַּצַּר
  choice: Sesbazar
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: הַגּוֹלָה
  choice: os exilados
  rationale: Neste contexto, o substantivo coletivo se refere às pessoas que regressavam, embora também possa designar a comunidade do exílio ou o próprio exílio.
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: quando estes foram levados
  rationale: A oração temporal comunica a circunstância expressa pelo infinitivo construto hifil e conserva sua forma passiva/causativa sem especificar um agente ausente no hebraico.
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: da Babilônia para Jerusalém
  rationale: Tradução direta da origem e do destino do movimento.
theological_decisions:
- issue: Linguagem de subida a Jerusalém em עלה
  choice: Conservar a ideia de subida em “levou para cima” e explicá-la em nota
  alternative: “levou” ou “transportou”
  rationale: O hebraico emprega a raiz עלה duas vezes e reflete a expressão convencional de subir a Jerusalém. A escolha preserva a nuance geográfica e literária sem lhe acrescentar uma interpretação doutrinária.
- issue: Referência de הַגּוֹלָה
  choice: “os exilados”, entendendo o termo como coletivo de pessoas
  alternative: “a comunidade exilada”, “os deportados” ou “o exílio”
  rationale: O contexto descreve o grupo que regressa da Babilônia. A nota mantém visível a amplitude semântica do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da primeira oração foi levemente ajustada para fluência. “Levou para cima” preserva uma repetição significativa da raiz hebraica, enquanto a nota esclarece a expressão cultural.
