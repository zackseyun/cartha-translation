id: EZR.1.1
reference: Ezra 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה מִ/פִּ֣י יִרְמְיָ֑ה הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כֹּ֣רֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: pt
  text: 'No primeiro ano de Ciro, rei da Pérsia, para que se cumprisse[a] a palavra de Yahweh vinda da boca de Jeremias[b], Yahweh despertou o espírito de Ciro, rei da Pérsia. Então ele fez circular uma proclamação por todo o seu reino, também por escrito[c], que dizia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «para completar a palavra de Yahweh». Aqui, completar a palavra significa levá-la à sua realização.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica «da boca de Jeremias» apresenta Jeremias como o porta-voz humano por meio de quem veio a palavra de Yahweh.
    reason: idiom_explanation
  - marker: c
    text: A expressão hebraica também pode ser traduzida mais literalmente como «fez passar uma proclamação». Refere-se à circulação pública de um anúncio oficial, neste caso igualmente em forma escrita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: No primeiro ano
  rationale: A expressão temporal situa o início da narrativa. O וּ funciona como ligação discursiva e não exige um «agora» explícito em português.
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: de Ciro, rei da Pérsia
  rationale: Reproduz naturalmente a fórmula de datação e mantém o título real em aposição.
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: para que se cumprisse a palavra de Yahweh
  rationale: 'O infinitivo indica finalidade ou resultado pretendido: a palavra profética chega à sua realização. «Cumprisse» comunica isso em português sem perder a ideia básica de completar.'
- source_word: מִפִּי יִרְמְיָה
  choice: vinda da boca de Jeremias
  rationale: Preserva a imagem hebraica da boca e apresenta Jeremias como o porta-voz humano, sem transformar a palavra em autoria independente dele.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֵעִיר
  choice: despertou
  rationale: O hifil descreve Yahweh despertando ou impelindo interiormente Ciro à ação; «despertou» mantém a metáfora e a iniciativa divina.
- source_word: אֶת רוּחַ כֹּרֶשׁ
  choice: o espírito de Ciro
  rationale: «Espírito» preserva a amplitude de רוּחַ, que pode abranger a disposição, o impulso ou a dimensão interior de Ciro.
- source_word: וַיַּעֲבֶר קוֹל
  choice: fez circular uma proclamação
  rationale: A expressão idiomática descreve a circulação pública de um anúncio oficial. A formulação portuguesa é clara e conserva a ideia causativa.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: por todo o seu reino
  rationale: Expressa a difusão do anúncio pela totalidade do domínio real.
- source_word: וְגַם בְּמִכְתָּב
  choice: também por escrito
  rationale: Indica que o anúncio oficial não foi apenas proclamado, mas igualmente apresentado em forma escrita.
- source_word: לֵאמֹר
  choice: 'que dizia:'
  rationale: Introduz de modo natural em português o discurso direto que começa no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. «Yahweh» o representa diretamente, sem substituí-lo pelo título «SENHOR».
- issue: Relação entre a palavra profética e os acontecimentos no reinado de Ciro
  choice: para que se cumprisse a palavra de Yahweh
  alternative: para completar a palavra de Yahweh
  rationale: «Cumprisse» expressa a realização histórica da palavra profética, enquanto a nota conserva a formulação lexical mais próxima de «completar».
- issue: Ação divina sobre Ciro
  choice: Yahweh despertou o espírito de Ciro
  alternative: Yahweh moveu a disposição de Ciro
  rationale: A tradução mantém «espírito», evitando decidir se רוּחַ designa especificamente mente, disposição ou impulso interior, e conserva a iniciativa atribuída a Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura foi dividida em duas frases para evitar um período excessivamente longo, sem alterar a sequência lógica do hebraico. Mantiveram-se «Yahweh», «espírito» e a imagem da «boca de Jeremias» por sua relevância lexical e teológica.
