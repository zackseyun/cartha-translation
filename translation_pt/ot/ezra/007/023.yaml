id: EZR.7.23
reference: Ezra 7:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: pt
  text: Tudo o que for ordenado pelo Deus dos céus seja feito com diligência em favor da casa do Deus dos céus[a], para que não venha ira sobre o reino do rei e seus filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “casa do Deus dos céus” refere-se ao templo.
    reason: cultural_note
  - marker: b
    text: 'Ou, mais literalmente: “pois por que haveria ira sobre o reino do rei e seus filhos?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: Tudo o que
  rationale: Introduz uma oração relativa totalizante e indefinida. “Tudo o que” é natural em português e preserva a abrangência da expressão aramaica.
- source_word: מִן טַעַם
  choice: for ordenado pelo
  rationale: טַעַם pode designar ordem, decreto ou decisão; neste contexto administrativo, “ordenado” comunica com clareza a autoridade da determinação, enquanto מִן indica sua procedência.
- source_word: אֱלָהּ שְׁמַיָּא
  choice: o Deus dos céus
  rationale: Preserva o título característico do aramaico de Esdras e sua forma determinada. “Dos céus” é uma formulação portuguesa consagrada e inteligível.
- source_word: יִתְעֲבֵד
  choice: seja feito
  rationale: A forma passiva imperfeita tem força diretiva no contexto. O subjuntivo português conserva essa injunção sem definir em excesso sua modalidade.
- source_word: אַדְרַזְדָּא
  choice: com diligência
  rationale: O advérbio transmite execução cuidadosa, exata e solícita. “Com diligência” mantém o tom administrativo e solene.
- source_word: לְבֵית
  choice: em favor da casa
  rationale: A preposição aponta para o beneficiário ou finalidade, e “casa” preserva a imagem concreta do original, embora aqui designe o templo.
- source_word: דִּי לְמָה
  choice: para que não
  rationale: No contexto, a expressão introduz a consequência negativa que se pretende evitar. A tradução principal comunica essa força de finalidade preventiva; a forma interrogativa mais literal é registrada em nota.
- source_word: לֶהֱוֵא קְצַף
  choice: venha ira
  rationale: A construção expressa que a ira venha a existir ou se manifeste. “Venha ira” preserva a ideia de juízo iminente sem acrescentar um agente não expresso.
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: sobre o reino do rei
  rationale: Mantém tanto a referência ao domínio real quanto a repetição formal do original, de modo claro em português.
- source_word: וּבְנוֹהִי
  choice: e seus filhos
  rationale: É o sentido direto do substantivo. Uma possível implicação dinástica não justifica substituir a referência explícita aos filhos.
theological_decisions:
- issue: Tradução de בֵית אֱלָהּ שְׁמַיָּא
  choice: a casa do Deus dos céus
  alternative: o templo do Deus dos céus
  rationale: A tradução mantém a metáfora “casa” do texto aramaico, enquanto uma nota esclarece que a expressão se refere ao templo. Assim se evita transformar uma explicação contextual em substituição lexical.
- issue: Forma da advertência introduzida por דִּי לְמָה
  choice: para que não venha ira sobre o reino do rei e seus filhos
  alternative: pois por que haveria ira sobre o reino do rei e seus filhos?
  rationale: A expressão admite uma representação mais literal como pergunta retórica, mas no contexto funciona como advertência para evitar a ira. A tradução principal conserva essa função, e a nota preserva a ambiguidade formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o tom de decreto administrativo, o título “Deus dos céus” e a imagem original de “casa”, esclarecida em nota.
