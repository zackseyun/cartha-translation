id: EZR.7.11
reference: Ezra 7:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: pt
  text: 'Esta é a cópia do documento[a] que o rei Artaxerxes deu a Esdras, o sacerdote, o escriba, escriba das palavras dos mandamentos de Yahweh e dos seus estatutos para Israel[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a transcrição da carta” ou “a transcrição do documento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a respeito de Israel” ou “sobre Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Esta é
  rationale: Introduz a transcrição que segue. Em português, a conjunção hebraica não precisa ser expressa aqui, e não há no original uma palavra temporal que exija «agora».
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: a cópia do documento
  rationale: פַּרְשֶׁגֶן designa uma cópia ou transcrição, e הַנִּשְׁתְּוָן uma comunicação oficial escrita. «Documento» mantém a amplitude do termo sem defini-lo estritamente como carta ou decreto.
- source_word: נָתַן
  choice: deu
  rationale: Preserva o sentido básico do verbo hebraico sem substituí-lo por uma formulação administrativa mais interpretativa, como «expediu».
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: o rei Artaxerxes
  rationale: Traduz o título e translitera o nome próprio segundo o uso português estabelecido.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: o sacerdote, o escriba
  rationale: Mantém os dois títulos de Esdras e a estrutura em aposição do hebraico.
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה
  choice: escriba das palavras dos mandamentos de Yahweh
  rationale: Conserva a repetição de «escriba» e a ênfase hebraica nas palavras escritas dos mandamentos, sem interpretar o título apenas como «especialista».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְחֻקָּיו
  choice: e dos seus estatutos
  rationale: «Estatutos» comunica adequadamente o sentido jurídico e instrutivo de חֻקִּים; a preposição retoma a construção anterior.
- source_word: עַל יִשְׂרָאֵל
  choice: para Israel
  rationale: Expressa de modo natural a provável ideia de referência ou aplicação a Israel, mantendo em nota as outras relações possíveis de עַל.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal por transliteração, sem substituí-lo por «SENHOR».
- issue: Relação dos mandamentos e estatutos com Israel
  choice: para Israel
  alternative: a respeito de Israel; sobre Israel
  rationale: A preposição עַל pode indicar referência, aplicação ou autoridade. A tradução principal favorece a aplicação a Israel, enquanto a nota preserva as demais possibilidades sem decidir além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição «o escriba, escriba» é mantida deliberadamente por refletir a aposição e a ênfase do hebraico. Os marcadores foram colocados junto às expressões às quais as variantes realmente se referem.
