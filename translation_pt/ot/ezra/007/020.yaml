base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: pt
  text: E qualquer outra necessidade da casa do seu Deus que lhe caiba suprir, você a suprirá com recursos do tesouro do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “da casa dos tesouros do rei”. A expressão se refere ao tesouro ou complexo de depósitos reais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: E qualquer outra necessidade
  rationale: A expressão introduz necessidades adicionais, não especificadas, além das já mencionadas. “Qualquer outra necessidade” comunica isso de modo claro e natural.
- source_word: בֵּית אֱלָהָךְ
  choice: da casa do seu Deus
  rationale: Preserva a designação aramaica tradicional do templo como “casa”, sem substituir a metáfora por uma explicação.
- source_word: דִּי יִפֶּל לָךְ לְמִנְתַּן
  choice: que lhe caiba suprir
  rationale: A construção idiomática expressa algo que passa a ser responsabilidade de Esdras fornecer. “Lhe caiba” conserva a ideia de incumbência, e “suprir” se ajusta ao contexto de necessidades materiais.
- source_word: תִּנְתֵּן
  choice: você a suprirá
  rationale: O verbo repete enfaticamente a ideia de dar ou fornecer. O pronome “a” retoma “necessidade” e torna a frase natural em português.
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: com recursos do tesouro do rei
  rationale: A expressão indica a fonte dos recursos. Esta formulação transmite em português corrente o sentido administrativo do original, cuja forma mais literal é preservada em nota.
