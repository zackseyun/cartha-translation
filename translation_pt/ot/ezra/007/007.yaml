  register: Português moderno, claro e digno, com legibilidade brasileira. A enumeração foi suavizada segundo o uso natural do português, sem perder as categorias cultuais. O marcador relativo aos netineus foi colocado junto de “servidores do templo”, termo ao qual pertence.
