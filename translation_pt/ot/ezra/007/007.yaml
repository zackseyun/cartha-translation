base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/007.yaml
  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: pt
  text: Subiram a Jerusalém alguns dos filhos de Israel[a], alguns dos sacerdotes, os levitas, os cantores, os porteiros e os servidores do templo[b], no sétimo ano do rei Artaxerxes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alguns dos israelitas”. O hebraico diz literalmente “dos filhos de Israel”; a preposição tem sentido partitivo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os netineus”, termo técnico para uma classe de servidores do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Também subiram
  rationale: O verbo עלה expressa a subida a Jerusalém, com sua nuance geográfica e cultual. “Também” liga o versículo ao contexto e representa naturalmente a conjunção hebraica.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: alguns dos filhos de Israel
  rationale: 'A preposição מִן tem sentido partitivo: somente parte do grupo subiu. “Filhos de Israel” preserva a expressão hebraica, enquanto a nota oferece a forma portuguesa mais corrente.'
- source_word: וּמִן הַכֹּהֲנִים
  choice: alguns dos sacerdotes
  rationale: O segundo מִן também é partitivo; repetir “alguns” torna esse sentido claro em português.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e precisa da classe tribal e cultual.
- source_word: הַמְשֹׁרְרִים
  choice: os cantores
  rationale: O termo designa especificamente os responsáveis pelo canto no serviço do templo, não músicos em geral.
- source_word: הַשֹּׁעֲרִים
  choice: os porteiros
  rationale: Termo corrente para os oficiais encarregados das portas do templo.
- source_word: הַנְּתִינִים
  choice: os servidores do templo
  rationale: Tradução funcional que comunica a função desse grupo cultual melhor que uma transliteração pouco conhecida.
- source_word: אֶל יְרוּשָׁלִָם
  choice: a Jerusalém
  rationale: Forma direcional natural em português, mantendo a ideia de destino.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: no sétimo ano
  rationale: Equivalente temporal idiomático em português.
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: do rei Artaxerxes
  rationale: Ordem natural em português, preservando nome e título reais.
theological_decisions: []
