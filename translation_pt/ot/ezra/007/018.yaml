id: EZR.7.18
reference: Ezra 7:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/מָ֣ה דִי֩ עלי/ך וְ/עַל אחי/ך יֵיטַ֗ב בִּ/שְׁאָ֛ר כַּסְפָּ֥/א וְ/דַהֲבָ֖/ה לְ/מֶעְבַּ֑ד כִּ/רְע֥וּת אֱלָהֲ/כֹ֖ם תַּעַבְדֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: pt
  text: E tudo o que parecer bom a você e a seus irmãos fazer com o restante da prata e do ouro[a], façam conforme a vontade do seu Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o que restar da prata e do ouro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conforme o desejo do seu Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: E tudo o que
  rationale: A combinação aramaica introduz uma oração relativa indefinida; “tudo o que” expressa naturalmente seu caráter aberto em português.
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: parecer bom a você e a seus irmãos
  rationale: A construção com יטב e על indica aquilo que alguém considera bom ou apropriado, preservando o tom deliberativo da autorização.
- source_word: אַחַיִךְ
  choice: seus irmãos
  rationale: Mantém o termo de parentesco do texto, sem restringi-lo interpretativamente a parentes, judeus ou colaboradores.
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: com o restante da prata e do ouro
  rationale: שְׁאָר designa o que sobra; a formulação remete claramente aos recursos mencionados antes.
- source_word: לְמֶעְבַּד
  choice: fazer
  rationale: O infinitivo de עבד tem aqui sentido amplo de fazer ou realizar algo com os recursos; “fazer” conserva essa generalidade.
- source_word: כִּרְעוּת
  choice: conforme a vontade
  rationale: O substantivo pode significar vontade, desejo ou agrado; “vontade” é natural no registro formal do decreto e não elimina a alternativa lexical.
- source_word: אֱלָהֲכֹם
  choice: seu Deus
  rationale: O referente específico é o Deus de Esdras e de seus companheiros; a maiúscula identifica o referente sem acrescentar uma afirmação doutrinária.
- source_word: תַּעַבְדוּן
  choice: façam
  rationale: O imperfeito plural funciona como autorização ou instrução. O imperativo português comunica a diretiva com naturalidade.
theological_decisions:
- issue: Uso de maiúscula na referência divina אֱלָהֲכֹם
  choice: seu Deus
  alternative: seu deus
  rationale: A expressão se refere especificamente ao Deus adorado por Esdras e seus companheiros; a maiúscula marca essa referência definida, sem importar conteúdo doutrinário adicional.
- issue: Sentido de כִּרְעוּת aplicado a Deus
  choice: conforme a vontade do seu Deus
  alternative: conforme o desejo do seu Deus
  rationale: “Vontade” se ajusta ao tom do decreto, enquanto a nota preserva o sentido igualmente possível de “desejo” ou “agrado”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, mantendo o caráter aberto da autorização e o plural final dirigido a Esdras e seus irmãos.
