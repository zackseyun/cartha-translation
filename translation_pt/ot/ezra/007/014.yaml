base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: pt
  text: pois você foi enviado da presença do rei e de seus sete conselheiros para investigar a respeito de Judá e Jerusalém, segundo a lei do seu Deus, que você tem em mãos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da parte do rei”. Literalmente, “de diante do rei”; a expressão cortesã aramaica indica que a missão de Esdras procede da presença real.
    reason: lexical_alternative
  - marker: b
    text: Ou “que está em seu poder” ou “que lhe foi confiada”. Literalmente, “que está em sua mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: pois
  rationale: A expressão aramaica introduz a razão da determinação. “Pois” preserva a força causal e se encaixa naturalmente na continuidade da frase.
- source_word: מִן קֳדָם מַלְכָּא
  choice: da presença do rei
  rationale: Preserva a imagem da expressão cortesã aramaica, literalmente “de diante do rei”, e ressalta que a comissão procede da presença real.
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: e de seus sete conselheiros
  rationale: O substantivo designa assessores do rei; “conselheiros” é claro, digno e adequado ao contexto da corte.
- source_word: שְׁלִיחַ
  choice: você foi enviado
  rationale: Expressa de modo direto o estado passivo de Esdras como enviado oficial, sem acrescentar ao texto a ideia mais específica de investidura formal.
- source_word: לְבַקָּרָא
  choice: para investigar
  rationale: O verbo denota procurar, examinar ou averiguar. “Investigar” comunica bem a tarefa administrativa confiada a Esdras.
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: a respeito de Judá e Jerusalém
  rationale: Neste contexto, a preposição indica o objeto da investigação. A formulação evita sugerir, sem necessidade, domínio direto “sobre” esses lugares.
- source_word: בְּדָת אֱלָהָךְ
  choice: segundo a lei do seu Deus
  rationale: A preposição apresenta a lei como norma ou referência da investigação; “segundo” preserva essa relação sem resolver além do que o aramaico exige.
- source_word: דִּי בִידָךְ
  choice: que está em suas mãos
  rationale: Mantém a imagem literal “em tua mão”, com concordância idiomática em português com “lei”, e deixa abertas as nuances de posse, custódia e encargo.
