  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: pt
  text: Este Esdras subiu da Babilônia. Ele era um escriba hábil na Lei de Moisés, que Yahweh, o Deus de Israel, havia dado. E o rei lhe concedeu tudo o que pediu, segundo a mão de Yahweh, seu Deus, sobre ele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “segundo a mão de Yahweh, seu Deus, sobre ele”; expressão que pode indicar o favor, o poder ou o auxílio providencial de Yahweh.
    reason: Esclarece o idiomatismo hebraico preservado no texto e sua amplitude semântica, sem impor uma interpretação única.
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: subiu da Babilônia
  rationale: Preserva o verbo direcional hebraico e a perspectiva tradicional de subida rumo a Jerusalém.
- source_word: סֹפֵר מָהִיר
  choice: escriba hábil
  rationale: סֹפֵר designa aqui alguém versado nos textos e na lei, enquanto מָהִיר comunica aptidão e competência, não rapidez física.
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: na Lei de Moisés
  rationale: No contexto pós-exílico, 'Lei' comunica de modo claro e adequado o sentido jurídico e pactual de תּוֹרָה, sem excluir sua dimensão de instrução.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: que Yahweh, o Deus de Israel, havia dado
  rationale: A oração relativa modifica a Lei de Moisés; o mais-que-perfeito explicita naturalmente em português que essa dádiva precedeu a atuação de Esdras.
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: O rei lhe concedeu tudo o que ele pediu
  rationale: '''Concedeu'' é idiomático para o atendimento de um pedido, e ''tudo o que ele pediu'' expressa naturalmente a totalidade indicada por כֹּל בַּקָּשָׁתוֹ.'
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: conforme a mão de Yahweh, seu Deus, estava sobre ele
  rationale: Mantém a metáfora concreta da mão divina e evita reduzi-la exclusivamente a favor, poder ou providência; 'conforme' representa כְּ sem transformar implicitamente a expressão em mera causalidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; 'Yahweh' preserva o nome próprio e segue a orientação lexical fornecida.
- issue: Interpretação da mão de Yahweh sobre Esdras
  choice: Manter a metáfora no texto principal
  alternative: porque Yahweh, seu Deus, o favorecia; pelo poder de Yahweh, seu Deus
  rationale: A expressão pode abranger favor, poder e auxílio providencial. A formulação escolhida conserva essa amplitude em vez de fixar uma única interpretação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A divisão em três frases reduz a sobrecarga sintática do hebraico sem alterar suas relações principais. O marcador da nota foi colocado junto à expressão que a nota explica.
