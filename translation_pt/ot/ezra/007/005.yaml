source:
  edition: WLC
  text: בֶּן אֲבִישׁ֗וּעַ בֶּן פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן הָ/רֹֽאשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/005.yaml
  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: pt
  text: filho de Abisua[a], filho de Fineias, filho de Eleazar, filho de Arão, o sacerdote principal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em genealogias, «filho de» também pode ter o sentido mais amplo de «descendente de».
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, «o sumo sacerdote». O hebraico diz literalmente «o sacerdote, o cabeça/principal», e não emprega aqui a expressão mais comum para «sumo sacerdote».
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: filho de
  rationale: Na fórmula genealógica repetida, a tradução direta é «filho de». Genealogias hebraicas, porém, podem omitir gerações, razão pela qual a nota registra o sentido mais amplo de descendência.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: פִּינְחָס
  choice: Fineias
  rationale: Forma portuguesa bíblica corrente do nome próprio hebraico.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Transliteração tradicional e corrente em português.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: o sacerdote principal
  rationale: Reproduz a construção hebraica «o sacerdote, o cabeça/principal» em português natural, sem substituí-la pelo título hebraico mais habitual para «sumo sacerdote».
theological_decisions:
- issue: Título sacerdotal de Arão
  choice: o sacerdote principal
  alternative: o sumo sacerdote
  rationale: רֹאשׁ significa literalmente «cabeça» e, neste contexto, indica primazia. «Sacerdote principal» preserva esse valor e evita importar sem indicação a expressão técnica mais comum הַכֹּהֵן הַגָּדוֹל, embora «sumo sacerdote» seja a tradução tradicional.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com formas de nomes bíblicos familiares ao público lusófono. A estrutura genealógica repetitiva do hebraico foi preservada.
