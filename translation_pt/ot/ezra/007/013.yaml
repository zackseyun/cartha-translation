  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: pt
  text: Por mim se decreta que todo aquele que, em meu reino, dentre o povo de Israel, seus sacerdotes[b] e os levitas, se oferecer voluntariamente para ir com você a Jerusalém poderá ir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estiver disposto a ir”. O particípio aramaico ressalta que a decisão é livre e voluntária.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e seus sacerdotes”, entendendo o sufixo de outra maneira; o contexto favorece “os sacerdotes de Israel”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: Por mim se decreta
  rationale: Reproduz de modo natural e solene a fórmula administrativa aramaica, indicando que o decreto procede do rei.
- source_word: כָל מִתְנַדַּב
  choice: todo aquele que ... se oferecer voluntariamente
  rationale: Preserva a força reflexiva e volitiva do particípio Hitpael, sem reduzir a expressão a mera disposição interior.
- source_word: בְּמַלְכוּתִי
  choice: em meu reino
  rationale: Expressa claramente o domínio territorial sujeito ao rei.
- source_word: מִן עַמָּה יִשְׂרָאֵל
  choice: dentre o povo de Israel
  rationale: Identifica o grupo do qual podem proceder os voluntários e se integra naturalmente à sintaxe portuguesa.
- source_word: וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: seus sacerdotes e os levitas
  rationale: O sufixo em 'sacerdotes' é entendido contextualmente como referência ao povo de Israel; o artigo antes de 'levitas' torna clara a coordenação dos grupos.
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: para ir com você a Jerusalém
  rationale: Mantém o movimento em direção a Jerusalém e a ideia de acompanhar Esdras, em ordem idiomática portuguesa.
- source_word: יְהָךְ
  choice: poderá ir
  rationale: No contexto do decreto, a forma concede autorização; 'poderá ir' comunica permissão oficial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência de decreto real. 'Você' oferece legibilidade brasileira sem perder a solenidade. A relação do sufixo em 'seus sacerdotes' com o povo de Israel foi mantida no texto; não se acrescentou uma nota sobre 'seus sacerdotes' no sentido de sacerdotes do rei, pois essa alternativa é gramaticalmente possível, mas menos provável no contexto.
