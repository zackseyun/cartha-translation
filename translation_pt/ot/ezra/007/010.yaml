source:
  edition: WLC
  text: כִּ֤י עֶזְרָא֙ הֵכִ֣ין לְבָב֔/וֹ לִ/דְר֛וֹשׁ אֶת תּוֹרַ֥ת יְהוָ֖ה וְ/לַ/עֲשֹׂ֑ת וּ/לְ/לַמֵּ֥ד בְּ/יִשְׂרָאֵ֖ל חֹ֥ק וּ/מִשְׁפָּֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: pt
  text: Pois Esdras havia decidido, em seu coração,[b] buscar[c] a Lei de Yahweh[a], praticá-la e ensinar em Israel estatutos e juízos[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh é o nome divino representado no hebraico pelas quatro letras YHWH, tradicionalmente substituído por “SENHOR” nas traduções.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “havia preparado [ou firmado] o seu coração”; a expressão hebraica indica determinação interior deliberada.
    reason: lexical_alternative
  - marker: c
    text: Ou “estudar” ou “investigar”. O verbo hebraico também pode abranger a ideia de buscar com dedicação.
    reason: lexical_alternative
  - marker: d
    text: Também se pode traduzir “decretos e normas”. No hebraico, os dois termos estão no singular, mas têm sentido coletivo neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da boa mão de Deus sobre Esdras mencionada no contexto anterior; “pois” conserva essa função explicativa com naturalidade.
- source_word: הֵכִין לְבָבוֹ
  choice: havia decidido de coração
  rationale: A expressão hebraica comunica determinação interior deliberada. A formulação escolhida é natural em português e preserva tanto a decisão quanto sua dimensão interior.
- source_word: לִדְרוֹשׁ
  choice: buscar
  rationale: O verbo pode significar buscar, investigar ou estudar. “Buscar” mantém juntas as dimensões intelectual e devocional da dedicação de Esdras à Lei.
- source_word: תּוֹרַת יְהוָה
  choice: a Lei de Yahweh
  rationale: Neste contexto sacerdotal e escribal, תּוֹרָה se refere à Lei da aliança, não apenas a uma instrução genérica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, distinguindo-o de um título como “Senhor”.
- source_word: וְלַעֲשֹׂת
  choice: praticá-la
  rationale: O objeto implícito é a Lei. “Praticá-la” expressa de modo conciso e natural a ideia de pô-la em ação, sem reduzir o verbo a mera observância ritual.
- source_word: וּלְלַמֵּד
  choice: e ensinar
  rationale: O Piel de למד significa ensinar ou instruir. “Ensinar” é direto e corrente.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Indica a esfera comunitária em que Esdras ensinaria.
- source_word: חֹק וּמִשְׁפָּט
  choice: estatutos e juízos
  rationale: Os substantivos singulares hebraicos funcionam coletivamente. O plural soa natural em português e conserva o registro jurídico da dupla expressão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título; a nota informa a tradição alternativa.
- issue: Âmbito de תּוֹרָה na missão de Esdras
  choice: Lei
  alternative: instrução; Torá
  rationale: No contexto pós-exílico, sacerdotal e escribal, o termo aponta para a Lei da aliança. “Lei” comunica essa referência canônica e comunitária de modo claro.
- issue: Relação entre conhecer e cumprir a Lei
  choice: buscar a Lei, praticá-la e ensinar
  alternative: estudar a Lei, obedecer-lhe e ensinar
  rationale: A sequência coordenada do hebraico foi preservada, sem fundir investigação, prática e ensino nem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção evita um hebraísmo rígido em “preparou o coração”, mas o preserva em nota. Mantém-se o paralelismo entre buscar, praticar e ensinar, e emprega-se vocabulário jurídico reconhecível sem arcaísmo excessivo.
