  text: וּ/מָֽאנַיָּ/א֙ דִּֽי מִתְיַהֲבִ֣ין לָ֔/ךְ לְ/פָלְחָ֖ן בֵּ֣ית אֱלָהָ֑/ךְ הַשְׁלֵ֕ם קֳדָ֖ם אֱלָ֥הּ יְרוּשְׁלֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: pt
  text: E os utensílios que lhe são entregues para o serviço da casa do seu Deus, entregue-os integralmente diante do Deus de Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apresente-os integralmente diante do Deus de Jerusalém”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: os utensílios
  rationale: O termo aramaico designa objetos ou implementos; no contexto do templo, “utensílios” é natural, claro e não sugere apenas recipientes.
- source_word: דִּי
  choice: que
  rationale: Partícula relativa que introduz a oração referente aos utensílios.
- source_word: מִתְיַהֲבִין לָךְ
  choice: forem entregues a você
  rationale: Preserva a voz passiva e expressa com naturalidade, no contexto do decreto, os objetos postos sob a responsabilidade de Esdras.
- source_word: לְפָלְחָן
  choice: para o serviço
  rationale: O substantivo pode indicar serviço cultual; “serviço” mantém a amplitude lexical sem restringi-lo explicitamente a “adoração”.
- source_word: בֵּית אֱלָהָךְ
  choice: da casa do seu Deus
  rationale: Reproduz de modo claro a cadeia construta e a referência ao templo pertencente ao Deus de Esdras.
- source_word: הַשְׁלֵם
  choice: entregue-os por completo
  rationale: O imperativo de שלם comunica completar ou entregar integralmente; o pronome retoma os utensílios e torna a frase natural em português.
- source_word: קֳדָם
  choice: diante de
  rationale: Equivalente corrente de “perante” ou “na presença de”, com registro digno e acessível.
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: o Deus de Jerusalém
  rationale: Mantém a associação direta de Deus com Jerusalém característica da formulação administrativa persa, sem reinterpretá-la como simples localização.
theological_decisions:
- issue: Terminologia relativa ao culto no templo
  choice: para o serviço da casa do seu Deus
  alternative: para a adoração na casa do seu Deus
  rationale: “Serviço” preserva a dimensão cultual sem reduzir o campo semântico do termo aramaico a atos explícitos de adoração.
- issue: Relação de Deus com Jerusalém
  choice: diante do Deus de Jerusalém
  alternative: diante de Deus, em Jerusalém
  rationale: A construção aramaica associa diretamente Deus a Jerusalém; a tradução mantém essa formulação potencialmente significativa em vez de convertê-la, sem necessidade, em indicação puramente locativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Utensílios” comunica melhor que “vasos” a variedade de objetos do templo. A colocação do marcador após a frase inteira vincula a nota à alternativa para הַשְׁלֵם.
