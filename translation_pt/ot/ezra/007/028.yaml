revisions:
- from: e que estendeu a mim seu amor leal diante do rei, dos seus conselheiros e de todos os poderosos oficiais do rei.[a] Eu me enchi de coragem, pois a mão de Yahweh, meu Deus, estava sobre mim,[b] e reuni chefes[c] de Israel para subirem comigo.
  to: e que me estendeu amor leal diante do rei, de seus conselheiros e de todos os poderosos oficiais do rei.[a] Tomei coragem, pois a mão de Yahweh, meu Deus, estava sobre mim,[b] e reuni chefes[c] de Israel para subirem comigo.
  rationale: A revisão elimina o possessivo não expresso no hebraico, melhora a fluência de «estendeu-me», e troca «Eu me enchi de coragem» por «Tomei coragem», uma equivalência idiomática apropriada ao contexto. A nota sobre כְּיַד é formulada como alternativa formal, preservando a incerteza sintática sem impor uma análise.
