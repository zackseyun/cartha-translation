  text: וְ/עָלַ֣/י הִטָּה חֶ֗סֶד לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/יֽוֹעֲצָ֔י/ו וּ/לְ/כָל שָׂרֵ֥י הַ/מֶּ֖לֶךְ הַ/גִּבֹּרִ֑ים וַ/אֲנִ֣י הִתְחַזַּ֗קְתִּי כְּ/יַד יְהוָ֤ה אֱלֹהַ/י֙ עָלַ֔/י וָ/אֶקְבְּצָ֧/ה מִ/יִּשְׂרָאֵ֛ל רָאשִׁ֖ים לַ/עֲל֥וֹת עִמִּֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: pt
  text: e que me estendeu amor leal diante do rei, de seus conselheiros e de todos os poderosos oficiais do rei.[a] Tomei coragem, pois a mão de Yahweh, meu Deus, estava sobre mim,[b] e reuni chefes[c] de Israel para subirem comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mostrou-me favor”, em vez de “me estendeu amor leal”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu me fortaleci segundo a mão de Yahweh, meu Deus, sobre mim”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cabeças”; isto é, chefes ou homens de liderança em Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: estendeu a mim seu amor leal
  rationale: Preserva a imagem verbal de estender e traduz חֶסֶד com uma expressão que comunica bondade fiel e relacional. O possessivo explicita naturalmente em português que esse amor leal procede de Deus, sujeito retomado do contexto.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Equivalente direto e natural para a ideia de estar na presença ou aos olhos do rei e de sua corte.
- source_word: יֹעֲצָיו
  choice: seus conselheiros
  rationale: Termo corrente e apropriado ao contexto da corte persa.
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: os poderosos oficiais do rei
  rationale: Oficiais representa adequadamente os altos agentes da administração persa, enquanto poderosos conserva a força de הַגִּבֹּרִים.
- source_word: הִתְחַזַּקְתִּי
  choice: eu me enchi de coragem
  rationale: Expressa de modo idiomático o sentido de ser fortalecido ou encorajado, sem atribuir a força exclusivamente ao próprio Esdras, pois a oração seguinte indica sua origem divina.
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  choice: pois a mão de Yahweh, meu Deus, estava sobre mim
  rationale: Mantém a metáfora da mão divina e comunica o valor explicativo ou causal da construção no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וָאֶקְבְּצָה
  choice: reuni
  rationale: Verbo simples e natural para a ação de congregar pessoas com um propósito comum.
- source_word: רָאשִׁים
  choice: chefes
  rationale: O sentido literal é cabeças, usado aqui para pessoas reconhecidas como dirigentes. Chefes conserva esse uso concreto e a referência pessoal masculina.
- source_word: לַעֲלוֹת עִמִּי
  choice: para subirem comigo
  rationale: Preserva a linguagem bíblica de subir, tradicionalmente usada para a viagem em direção a Jerusalém, e deixa claro que os chefes acompanhariam Esdras.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal revelado a Israel, sem trocá-lo por um título.
- issue: Relação entre a coragem de Esdras e a mão divina
  choice: Eu me enchi de coragem, pois a mão de Yahweh, meu Deus, estava sobre mim
  alternative: Eu me fortaleci conforme a mão de Yahweh, meu Deus, estava sobre mim
  rationale: A redação principal comunica a força explicativa da presença da mão divina sem eliminar a forma reflexiva do verbo. A alternativa mais formal é registrada em nota para preservar a ambiguidade da construção כְּיַד.
- issue: Valor de חֶסֶד no contexto da corte persa
  choice: amor leal
  alternative: favor
  rationale: Amor leal mantém o peso relacional e teológico de חֶסֶד, ao passo que favor descreve com maior imediatismo seu efeito diante do rei. A alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A continuação inicial com “e que” foi mantida para refletir a ligação sintática com o versículo anterior. A ordem dos marcadores segue os elementos a que se referem no texto.
