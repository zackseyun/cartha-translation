    text: 'Ou: “mostrou-me favor”, em vez de “me estendeu amor leal”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu me fortaleci segundo a mão de Yahweh, meu Deus, sobre mim”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “cabeças”; isto é, chefes ou homens de liderança em Israel.'
    reason: lexical_alternative
  revision_rationale: A revisão elimina o possessivo não expresso no hebraico, melhora a fluência de «estendeu-me», e troca «Eu me enchi de coragem» por «Tomei coragem», uma equivalência idiomática apropriada ao contexto. A nota sobre כְּיַד é formulada como alternativa formal, preservando a incerteza sintática sem impor uma análise.
