source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דְּנָה֩ אָסְפַּ֨רְנָא תִקְנֵ֜א בְּ/כַסְפָּ֣/א דְנָ֗ה תּוֹרִ֤ין דִּכְרִין֙ אִמְּרִ֔ין וּ/מִנְחָתְ/ה֖וֹן וְ/נִסְכֵּי/ה֑וֹן וּ/תְקָרֵ֣ב הִמּ֔וֹ עַֽל מַדְבְּחָ֔/ה דִּ֛י בֵּ֥ית אֱלָהֲ/כֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: pt
  text: Portanto, com esta prata, comprem cuidadosamente touros, carneiros e cordeiros, com as ofertas de cereal e as ofertas de bebida correspondentes, e ofereçam tudo no altar da casa do seu Deus, que está em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o templo do seu Deus”. Literalmente: “a casa do seu Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: Portanto
  rationale: Expressa de modo conciso e natural a força conclusiva da locução aramaica.
- source_word: אָסְפַּרְנָא
  choice: cuidadosamente
  rationale: Comunica a ideia de execução diligente, cuidadosa ou exata, sem recorrer a uma formulação arcaica.
- source_word: תִקְנֵא
  choice: comprem
  rationale: O verbo significa comprar ou adquirir. O plural concorda naturalmente em português com os destinatários indicados pelo possessivo plural 'seu Deus' no aramaico.
- source_word: בְּכַסְפָּא דְנָה
  choice: com esta prata
  rationale: Mantém o sentido literal de 'prata', embora no contexto ela funcione como dinheiro destinado às compras.
- source_word: תּוֹרִין דִּכְרִין אִמְּרִין
  choice: touros, carneiros e cordeiros
  rationale: Emprega os equivalentes sacrificiais comuns e claros para os três tipos de animais.
- source_word: מִנְחָתְהוֹן
  choice: as ofertas de cereal correspondentes
  rationale: No contexto sacrificial, o termo designa ofertas de cereal; o sufixo pronominal indica que acompanham os animais mencionados.
- source_word: נִסְכֵּיהוֹן
  choice: as ofertas de bebida correspondentes
  rationale: Traduz o termo cultual referente às ofertas líquidas e torna explícita, sem ampliar o sentido, sua relação com os sacrifícios.
- source_word: וּתְקָרֵב הִמּוֹ
  choice: e ofereçam tudo
  rationale: O verbo é usado para apresentar ou oferecer sacrifícios. 'Tudo' representa naturalmente o pronome plural que retoma o conjunto recém-enumerado.
- source_word: בֵּית אֱלָהֲכֹם
  choice: a casa do seu Deus
  rationale: Preserva a expressão literal aramaica e sua imagem bíblica, em vez de substituí-la diretamente por 'templo'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a relação entre os animais e as ofertas que os acompanham. O plural verbal reflete os destinatários plurais do aramaico.
