  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: pt
  text: E você, Esdras, segundo a sabedoria do seu Deus que está em sua mão[a], nomeie magistrados e juízes para julgarem todo o povo da região Além do Rio[b], todos os que conhecem as leis do seu Deus; e vocês deverão ensinar os que não as conhecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que você possui”. A expressão aramaica significa literalmente “que está em sua mão” e pode indicar posse ou autoridade confiada.'
    reason: lexical_alternative
  - marker: b
    text: “Além do Rio” era a designação administrativa persa para o território a oeste do rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: segundo a sabedoria do seu Deus
  rationale: A preposição כְּ indica conformidade ou acordo. “Segundo” conserva essa relação e soa natural em português.
- source_word: דִּי בִידָךְ
  choice: que está em suas mãos
  rationale: Mantém a imagem do idioma aramaico, que pode indicar posse, capacidade ou autoridade confiada, sem decidir entre essas nuances.
- source_word: מֶנִּי
  choice: nomeie
  rationale: No contexto administrativo, o verbo ordena que Esdras designe autoridades; “nomeie” é claro e corrente.
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: magistrados e juízes
  rationale: Preserva os dois termos para autoridades judiciais sem reduzi-los a uma única categoria.
- source_word: דִּי לֶהֱוֺן דאנין
  choice: para julgarem
  rationale: Expressa de modo natural a função ou finalidade das autoridades nomeadas.
- source_word: לְכָל עַמָּה
  choice: todo o povo
  rationale: Reproduz o sentido coletivo da expressão aramaica.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: da região Além do Rio
  rationale: A expressão funciona como designação administrativa persa do território a oeste do Eufrates; a formulação com “região” torna essa função clara.
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: todos os que conhecem as leis do seu Deus
  rationale: Conserva o plural דָּתֵי e comunica com clareza o contexto jurídico-religioso.
- source_word: וְדִי לָא יָדַע
  choice: os que não as conhecem
  rationale: O pronome “as” retoma naturalmente “as leis”, objeto implícito no aramaico.
- source_word: תְּהוֹדְעוּן
  choice: vocês deverão ensinar
  rationale: O causativo de ידע significa “fazer conhecer”; em relação às leis, “ensinar” é natural. O plural “vocês” preserva a mudança do singular dirigido a Esdras para a forma verbal plural.
theological_decisions:
- issue: Mudança do destinatário singular para o plural na ordem final
  choice: “vocês deverão ensinar”
  alternative: “você deverá ensinar”
  rationale: O texto começa dirigindo-se a Esdras no singular, mas תְּהוֹדְעוּן é plural. A tradução preserva essa mudança, permitindo que a ordem final inclua Esdras e/ou os oficiais nomeados, sem resolver a tensão textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A imagem “em suas mãos” foi mantida, e a designação imperial “Além do Rio” foi tratada como nome administrativo. A alternância entre “você” e “vocês” é intencional e reflete o singular e o plural do texto aramaico.
