  text: עַד כְּסַף֮ כַּכְּרִ֣ין מְאָה֒ וְ/עַד חִנְטִין֙ כֹּרִ֣ין מְאָ֔ה וְ/עַד חֲמַר֙ בַּתִּ֣ין מְאָ֔ה וְ/עַד בַּתִּ֥ין מְשַׁ֖ח מְאָ֑ה וּ/מְלַ֖ח דִּי לָ֥א כְתָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: pt
  text: até cem talentos de prata, até cem coros de trigo, até cem batos de vinho, até cem batos de óleo e sal sem limite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sal que não está escrito”, isto é, sem quantidade especificada.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: até
  rationale: Neste contexto administrativo, indica o limite máximo da quantidade autorizada; em português, “até” expressa isso com clareza e concisão.
- source_word: כְּסַף
  choice: prata
  rationale: O termo designa literalmente prata, aqui quantificada por talentos; preservar o metal é mais preciso do que generalizar como “dinheiro”.
- source_word: כַּכְּרִין
  choice: talentos
  rationale: Mantém a antiga unidade de peso, sem impor uma conversão moderna incerta.
- source_word: חִנְטִין
  choice: trigo
  rationale: O substantivo designa especificamente trigo, e não cereais em geral.
- source_word: כֹּרִין
  choice: coros
  rationale: Preserva por transliteração a antiga medida de capacidade para secos.
- source_word: חֲמַר
  choice: vinho
  rationale: Equivalente direto do termo aramaico neste inventário de provisões.
- source_word: בַּתִּין
  choice: batos
  rationale: Preserva por transliteração a antiga medida de capacidade para líquidos.
- source_word: מְשַׁח
  choice: óleo
  rationale: O texto diz “óleo” sem especificar expressamente que seja de oliva; a tradução evita explicitar o que permanece implícito.
- source_word: מְלַח
  choice: sal
  rationale: Equivalente direto do produto mencionado ao fim da lista.
- source_word: דִּי לָא כְתָב
  choice: sem limite
  rationale: A expressão literalmente afirma que a quantidade não foi registrada ou estipulada; no contexto do decreto, comunica que não havia quantidade máxima especificada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência administrativa concisa. As unidades antigas “talentos”, “coros” e “batos” foram preservadas. O marcador da nota foi colocado após a expressão a que efetivamente se refere, corrigindo a aparente posição equivocada na camada inglesa de consulta.
