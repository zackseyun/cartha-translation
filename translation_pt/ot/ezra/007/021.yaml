base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: pt
  text: 'E, de minha parte, eu, o rei Artaxerxes, decreto o seguinte a todos os tesoureiros da região Além do Rio[b]: tudo o que Esdras, o sacerdote, escriba da Lei do Deus dos céus, pedir a vocês deverá ser feito com toda a diligência.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deverá ser feito com exatidão” ou “prontamente”. O advérbio aramaico enfatiza o cumprimento cuidadoso e integral da ordem.'
    reason: lexical_alternative
  - marker: b
    text: “Além do Rio” era o nome administrativo persa da região situada a oeste do rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: E, de minha parte, eu
  rationale: Preserva a autorização pessoal e a ênfase do pronome explícito, em português natural e solene.
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: o rei Artaxerxes
  rationale: Emprega a ordem corrente do título real e do nome em português.
- source_word: שִׂים טְעֵם
  choice: decreto
  rationale: Expressa de modo conciso o ato formal de emitir uma ordem oficial.
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: a todos os tesoureiros
  rationale: Mantém o título dos responsáveis pelo tesouro no contexto administrativo persa.
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: da região Além do Rio
  rationale: Trata a expressão como designação administrativa persa e acrescenta 'região' para clareza em português.
- source_word: כָל דִּי יִשְׁאֲלֶנְכוֹן
  choice: tudo o que ... pedir a vocês
  rationale: Reproduz a construção relativa abrangente sem atribuir ao verbo 'pedir' uma força coercitiva que vem do decreto real.
- source_word: עֶזְרָא כָהֲנָה סָפַר דָּתָא
  choice: Esdras, o sacerdote e escriba da Lei
  rationale: Conserva os dois títulos de Esdras e o alcance administrativo e erudito de 'escriba'.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: do Deus dos céus
  rationale: Usa a forma portuguesa consagrada do título divino, mantendo o plural presente na expressão aramaica.
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: deverá ser feito com toda a diligência
  rationale: Comunica a ordem de cumprimento cuidadoso e integral, sem limitar o advérbio somente à exatidão ou à rapidez.
