base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/015.yaml
  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: pt
  text: e para levar a prata e o ouro que o rei e seus conselheiros ofereceram voluntariamente ao Deus de Israel[a], cuja morada está em Jerusalém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que habita em Jerusalém”. Mais literalmente, o aramaico diz: “cuja morada está em Jerusalém”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: e para levar
  rationale: O infinitivo aramaico, com a conjunção e a preposição prefixadas, expressa a finalidade no contexto da comissão real. “Levar” comunica naturalmente o transporte dos recursos até Jerusalém.
- source_word: כְּסַף וּדְהַב
  choice: a prata e o ouro
  rationale: Os artigos são naturais em português porque a oração relativa seguinte identifica a prata e o ouro específicos oferecidos pelo rei e seus conselheiros.
- source_word: דִּי
  choice: que
  rationale: A partícula relativa introduz a oração que descreve a prata e o ouro; “que” é o equivalente natural em português.
- source_word: מַלְכָּא
  choice: o rei
  rationale: Tradução direta do substantivo aramaico em estado enfático, com sentido definido.
- source_word: וְיָעֲטוֹהִי
  choice: e seus conselheiros
  rationale: O termo designa os integrantes do conselho real. “Conselheiros” preserva com clareza o contexto da corte.
- source_word: הִתְנַדַּבוּ
  choice: ofereceram voluntariamente
  rationale: O verbo indica uma contribuição espontânea e disposta. A formulação preserva tanto a ação de oferecer como seu caráter voluntário.
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: ao Deus de Israel
  rationale: Tradução corrente da designação divina; a preposição “a”, contraída com o artigo, expressa que a oferta foi dedicada ao Deus de Israel.
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: cuja morada está em Jerusalém
  rationale: Preserva a construção nominal do aramaico, que fala da morada de Deus, sem substituí-la diretamente pelo verbo “habitar” nem especificar indevidamente “tabernáculo”.
theological_decisions:
- issue: Relação de Deus com Jerusalém em מִשְׁכְּנֵהּ
  choice: cuja morada está em Jerusalém
  alternative: que habita em Jerusalém
  rationale: A formulação mantém a expressão nominal do aramaico e sua ênfase na morada vinculada ao templo. Não acrescenta uma explicação sobre a presença divina nem elimina a tensão espacial presente no próprio texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário acessível. “Conselheiros” mantém o cenário da corte; “morada” conserva a forma e a tensão teológica do aramaico. A pontuação final com vírgula reflete que o versículo integra uma oração mais extensa.
