  text: וְ/אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/מַלְכ֖וּת אַרְתַּחְשַׁ֣סְתְּא מֶֽלֶךְ פָּרָ֑ס עֶזְרָא֙ בֶּן שְׂרָיָ֔ה בֶּן עֲזַרְיָ֖ה בֶּן חִלְקִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: pt
  text: Depois dessas coisas, no reinado de Artaxerxes, rei da Pérsia, Esdras, filho de Seraías[a], filho de Azarias, filho de Hilquias —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nas genealogias, a expressão hebraica “filho de” também pode indicar um descendente mais remoto, e não apenas uma relação imediata entre pai e filho.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: Depois
  rationale: A combinação liga a nova seção ao relato anterior e estabelece a sequência temporal. Em português, “Depois” transmite isso naturalmente, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: dessas coisas
  rationale: A expressão pode referir-se aos acontecimentos ou assuntos anteriores. “Dessas coisas” preserva a formulação ampla e idiomática do hebraico.
- source_word: בְּמַלְכוּת
  choice: no reinado de
  rationale: Neste contexto, o substantivo indica o período em que o rei governava, e não o território do reino.
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: Artaxerxes
  rationale: Forma tradicional e amplamente reconhecida do nome real em português.
- source_word: מֶלֶךְ פָּרָס
  choice: rei da Pérsia
  rationale: A expressão em construção identifica Artaxerxes por seu título e domínio; a aposição com vírgulas é natural em português.
- source_word: עֶזְרָא
  choice: Esdras
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: בֶּן
  choice: filho de
  rationale: Mantém a fórmula genealógica hebraica. Como בֶּן pode também indicar descendência não imediata, essa possibilidade é explicitada em nota sem alterar a forma da genealogia.
- source_word: שְׂרָיָה
  choice: Seraías
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Forma portuguesa tradicional do nome hebraico.
- source_word: חִלְקִיָּה
  choice: Hilquias
  rationale: Forma portuguesa tradicional do nome hebraico.
