  text: וּ/לְ/כֹ֣ם מְהוֹדְעִ֗ין דִּ֣י כָל כָּהֲנַיָּ֣/א וְ֠/לֵוָיֵ/א זַמָּ֨רַיָּ֤/א תָרָֽעַיָּ/א֙ נְתִ֣ינַיָּ֔/א וּ/פָ֣לְחֵ֔י בֵּ֖ית אֱלָהָ֣/א דְנָ֑ה מִנְדָּ֤ה בְלוֹ֙ וַ/הֲלָ֔ךְ לָ֥א שַׁלִּ֖יט לְ/מִרְמֵ֥א עֲלֵי/הֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: pt
  text: Também fazemos saber a vocês que não é permitido impor tributo, imposto ou pedágio[a] a nenhum dos sacerdotes, levitas, cantores, porteiros, servidores do templo[b] ou dos que servem nesta casa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os três termos fiscais provavelmente designam diferentes tipos de cobrança imperial. “Tributo, imposto ou pedágio” também pode ser traduzido como “tributo, taxa aduaneira ou tarifa de trânsito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “netineus”, transliteração tradicional do aramaico נְתִינַיָּא.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: fazemos saber
  rationale: Preserva a fórmula aramaica de notificação oficial e seu tom administrativo, em português natural e solene.
- source_word: כָל
  choice: a nenhum dos
  rationale: No contexto da proibição legal, a construção negativa comunica com clareza que nenhuma pessoa pertencente às classes enumeradas pode receber a cobrança.
- source_word: כָהֲנַיָּא
  choice: sacerdotes
  rationale: Equivalente corrente para a classe sacerdotal.
- source_word: לֵוָיֵא
  choice: levitas
  rationale: Designação tradicional e amplamente compreendida da classe levítica.
- source_word: זַמָּרַיָּא
  choice: cantores
  rationale: Expressa diretamente a função musical exercida por esse grupo no culto do templo.
- source_word: תָרָעַיָּא
  choice: porteiros
  rationale: Designa os encarregados dos portões; é uma forma breve, corrente e tradicional em listas de pessoal do templo.
- source_word: נְתִינַיָּא
  choice: servidores do templo
  rationale: Comunica a função do grupo de modo mais acessível do que a transliteração tradicional e evita a tradução etimológica pouco natural 'dados'.
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: os que servem nesta casa de Deus
  rationale: Mantém o sentido amplo do particípio, sem acrescentar 'outros', palavra não expressa no aramaico, e distingue naturalmente esta descrição da classe técnica anterior.
- source_word: מִנְדָּה
  choice: tributo
  rationale: Representa uma contribuição ou exação imposta no vocabulário administrativo persa e conserva sua distinção dentro da fórmula fiscal tríplice.
- source_word: בְלוֹ
  choice: imposto
  rationale: Termo fiscal geral adequado ao segundo elemento da série, sem fundi-lo com os outros dois.
- source_word: וַהֲלָךְ
  choice: pedágio
  rationale: Reflete a provável cobrança ligada a trânsito, estrada ou alfândega e mantém a distinção entre as três exações.
- source_word: לָא שַׁלִּיט לְמִרְמֵא עֲלֵיהֹם
  choice: não é permitido impor ... a
  rationale: Transmite naturalmente a falta de autorização legal para lançar essas cobranças sobre as pessoas enumeradas.
theological_decisions: []
translation_notes:
  register: 'Português moderno, formal e acessível, com tom compatível com um decreto administrativo. A repetição de ideias ligadas ao serviço foi mantida porque o texto distingue os נְתִינַיָּא da categoria mais ampla dos que servem na casa de Deus. As notas foram associadas aos termos correspondentes no texto: a nota fiscal à tríade de cobranças e a nota de transliteração aos servidores do templo.'
