  naturalness: O português é moderno, claro e mantém o registro administrativo do decreto. “A vocês” favorece a legibilidade brasileira sem comprometer a compreensão internacional; a enumeração e a construção negativa são naturais.
  terminology: “Sacerdotes”, “levitas”, “cantores”, “porteiros”, “servidores do templo” e “casa de Deus” são adequados. “Tributo, imposto ou pedágio” preserva prudentemente a distinção da tríade fiscal; a nota registra alternativas sem alegar certeza indevida. A nota sobre “netineus” está corretamente ancorada em “servidores do templo”.
