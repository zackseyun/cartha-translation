base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: pt
  text: Pois, no primeiro dia do primeiro mês, ele iniciou a subida da Babilônia; e, no primeiro dia do quinto mês, chegou a Jerusalém, conforme a boa mão de seu Deus sobre ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: iniciou a viagem de subida
  rationale: A construção incomum emprega literalmente uma forma de יסד, “fundar/estabelecer”, com מעלה, “subida”. No contexto, indica o início ou a organização da subida da Babilônia a Jerusalém; esta formulação comunica o sentido natural sem reproduzir em português uma metáfora obscura.
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: porque a boa mão de seu Deus estava sobre ele
  rationale: A expressão idiomática atribui a chegada bem-sucedida ao favor e à atuação providencial de Deus. “Porque” expressa aqui o valor causal provável de כְּ, enquanto “a boa mão” preserva a imagem hebraica.
theological_decisions:
- issue: Relação entre a boa mão de Deus e a chegada de Esdras
  choice: porque a boa mão de seu Deus estava sobre ele
  alternative: segundo a boa mão de seu Deus sobre ele
  rationale: A tradução causal é idiomática e coerente com o uso recorrente da expressão em Esdras, sem definir além do texto o modo da providência divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com preferência por “Babilônia” na grafia brasileira. A pontuação mantém a sequência cronológica e destaca a causa teológica apresentada no fim do versículo.
