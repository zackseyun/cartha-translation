revisions:
- from: Pois, no primeiro dia do primeiro mês, ele iniciou a viagem de subida desde a Babilônia; e, no primeiro dia do quinto mês, chegou a Jerusalém, porque a boa mão de seu Deus estava sobre ele.
  to: Pois, no primeiro dia do primeiro mês, ele iniciou a subida da Babilônia; e, no primeiro dia do quinto mês, chegou a Jerusalém, conforme a boa mão de seu Deus sobre ele.
  rationale: A revisão restitui o valor formal de conformidade de כְּיַד e preserva a expressão hebraica «a boa mão de seu Deus sobre ele», sem converter a formulação em uma explicação causal. Também simplifica a expressão da partida/subida de Babilônia, mantendo a sequência cronológica e o sentido do original.
