source:
  edition: WLC
  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: pt
  text: e toda a prata e todo o ouro que você encontrar em toda a província da Babilônia, juntamente com a oferta voluntária[a] do povo e dos sacerdotes, que oferecem espontaneamente para a casa de seu Deus[b], que está em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a oferta espontânea”. O termo aramaico indica uma dádiva feita de livre vontade, especialmente em contexto de culto.
    reason: lexical_alternative
  - marker: b
    text: A “casa de seu Deus” é o templo em Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל כְּסַף וּדְהַב
  choice: e toda a prata e todo o ouro
  rationale: Preserva a coordenação com o contexto anterior e a abrangência de כֹל; a repetição de “toda/todo” é natural em português e deixa claro que o termo abrange ambos os metais.
- source_word: דִּי תְהַשְׁכַּח
  choice: que você encontrar
  rationale: Traduz diretamente a oração relativa dirigida a Esdras, com linguagem atual e sem transformar desnecessariamente a construção em passiva.
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: em toda a província da Babilônia
  rationale: מְדִינָה designa aqui uma província administrativa; a formulação mantém o sentido abrangente do aramaico.
- source_word: עִם הִתְנַדָּבוּת
  choice: juntamente com a oferta voluntária
  rationale: “Juntamente com” marca a adição de outra fonte de recursos, e “oferta voluntária” preserva tanto a espontaneidade quanto o contexto religioso do substantivo.
- source_word: עַמָּא וְכָהֲנַיָּא מִתְנַדְּבִין
  choice: que o povo e os sacerdotes fizerem espontaneamente
  rationale: Expressa de modo idiomático a ação voluntária atribuída ao povo e aos sacerdotes. O futuro do subjuntivo se ajusta à referência ao que Esdras vier a encontrar sem eliminar a noção de livre disposição.
- source_word: לְבֵית אֱלָהֲהֹם
  choice: para a casa de seu Deus
  rationale: Mantém literalmente a expressão semítica “casa de Deus”, enquanto “para” comunica que a oferta é destinada ao templo.
- source_word: דִּי בִירוּשְׁלֶם
  choice: que está em Jerusalém
  rationale: Conserva a oração relativa que localiza a casa de Deus.
theological_decisions:
- issue: Sentido de “casa de seu Deus”
  choice: Manter a expressão literal no texto e explicar que ela designa o templo
  alternative: Traduzir diretamente como “templo de seu Deus”
  rationale: A forma literal preserva a imagem do original, enquanto a nota evita dificuldade para leitores modernos sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível a leitores brasileiros e amplamente compreensível em outras variedades. A tradução preserva a expressão bíblica “casa de seu Deus”, explicando-a em nota, e usa “você” porque o decreto se dirige diretamente a Esdras.
