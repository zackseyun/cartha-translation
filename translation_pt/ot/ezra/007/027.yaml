  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: pt
  text: Bendito seja Yahweh, o Deus de nossos pais, que pôs isto no coração do rei para embelezar[a] a casa de Yahweh que está em Jerusalém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ornamentar” ou “glorificar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Bendito seja
  rationale: Preserva a fórmula doxológica hebraica e expressa naturalmente louvor em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: o Deus de nossos pais
  rationale: Mantém a expressão pactual tradicional e a referência masculina explícita de אָבוֹת, com linguagem clara em português.
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: que pôs isto no coração do rei
  rationale: Verte idiomaticamente נתן ... בלב como a implantação de uma intenção, enquanto 'isto' preserva o demonstrativo singular כָּזֹאת.
- source_word: לְפָאֵר
  choice: embelezar
  rationale: No contexto do templo, o piel indica torná-lo belo ou esplêndido; 'embelezar' conserva esse sentido concreto sem impor uma leitura excessivamente abstrata.
- source_word: בֵּית יְהוָה
  choice: a casa de Yahweh
  rationale: Mantém a imagem hebraica literal de 'casa', embora o referente seja o templo.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: que está em Jerusalém
  rationale: Reproduz de modo direto e natural a oração relativa locativa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de לְפָאֵר aplicado à casa de Yahweh
  choice: embelezar
  alternative: ornamentar; glorificar
  rationale: O contexto favorece tornar o templo belo ou esplêndido, mas a nota preserva a amplitude semântica e a possível nuance de glorificação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Os dois-pontos tornam explícita a relação entre “isto” e o propósito expresso pelo infinitivo, sem apagar o demonstrativo hebraico. A vírgula final preserva a continuidade sintática com o versículo seguinte.
