  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: pt
  text: Ele chegou a Jerusalém no quinto mês[a], no sétimo ano do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele chegou a Jerusalém no quinto mês; era o sétimo ano do rei.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ele chegou
  rationale: O wayyiqtol de בוא dá continuidade à sequência narrativa. “Chegou” expressa naturalmente, em português, a chegada ao destino sem acrescentar conteúdo.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma consagrada do nome próprio em português.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: no quinto mês
  rationale: A preposição ב tem sentido temporal, e esta formulação preserva diretamente a referência calendárica.
- source_word: הִיא
  choice: 'no'
  rationale: A relação temporal indicada pelo pronome feminino é expressa de modo idiomático pela justaposição “no quinto mês, no sétimo ano”; a nota registra uma forma mais explícita.
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: o sétimo ano
  rationale: A construção indica o sétimo ano de reinado; o ordinal é a formulação portuguesa natural.
- source_word: לַמֶּלֶךְ
  choice: do rei
  rationale: O ל marca a relação própria da datação régia. Não se acrescenta “Artaxerxes”, pois o nome não aparece neste versículo.
