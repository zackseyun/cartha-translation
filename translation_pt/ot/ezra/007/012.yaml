  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַ֨רְתַּחְשַׁ֔סְתְּא מֶ֖לֶךְ מַלְכַיָּ֑/א לְ/עֶזְרָ֣א כָ֠הֲנָ/א סָפַ֨ר דָּתָ֜/א דִּֽי אֱלָ֧הּ שְׁמַיָּ֛/א גְּמִ֖יר וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: pt
  text: 'Artaxerxes, rei dos reis, a Esdras, o sacerdote e escriba da lei[a] do Deus dos céus: paz completa[b]. E agora—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escriba do decreto”, caso דָּתָא seja entendido no sentido administrativo mais amplo de “decreto”, e não de “lei”.
    reason: lexical_alternative
  - marker: b
    text: A saudação aramaica é formular e muito concisa; literalmente, traz o termo “completa” ou “perfeita”, com “paz” subentendida. Também poderia ser traduzida de modo mais idiomático como “saudações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: Artaxerxes
  rationale: Nome próprio do rei, transliterado na forma tradicional e corrente em português.
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: rei dos reis
  rationale: Reproduz diretamente o título real aramaico em linguagem natural e solene.
- source_word: לְעֶזְרָ֣א
  choice: a Esdras
  rationale: A preposição aramaica identifica o destinatário do documento.
- source_word: כָהֲנָא
  choice: o sacerdote
  rationale: A forma determinada é representada pelo artigo definido em português.
- source_word: סָפַר דָּתָא
  choice: escriba da lei
  rationale: סָפַר designa um escriba, e דָּתָא, embora também possa significar decreto, refere-se mais provavelmente aqui à lei divina na qual Esdras era versado.
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: do Deus dos céus
  rationale: Mantém o título bíblico e a relação genitiva expressa por דִּי; 'Deus dos céus' é a formulação portuguesa consagrada e natural.
- source_word: גְּמִיר
  choice: completa
  rationale: O adjetivo significa 'completo, perfeito'; na fórmula epistolar, entende-se que qualifica a saudação de paz subentendida.
- source_word: וּכְעֶנֶת
  choice: E agora—
  rationale: É uma fórmula de transição para o corpo do decreto; o travessão indica que o enunciado prossegue no versículo seguinte.
theological_decisions:
- issue: Sentido de דָּתָא na descrição da função de Esdras
  choice: lei
  alternative: decreto
  rationale: O termo pode designar uma lei, norma ou decreto. Neste contexto, ligado ao Deus dos céus e à função sacerdotal de Esdras, 'lei' expressa melhor a referência à instrução divina, sem eliminar a alternativa lexical, registrada em nota.
- issue: Interpretação da fórmula epistolar גְּמִיר וּכְעֶנֶת
  choice: paz completa. E agora—
  alternative: saudações. E agora—
  rationale: A tradução conserva o valor literal de גְּמִיר e explicita a saudação de paz entendida na fórmula. A nota registra que uma tradução mais idiomática também é possível, sem resolver indevidamente a concisão do aramaico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura de cabeçalho oficial foi preservada; o travessão final assinala a continuação no versículo seguinte. Os marcadores de nota foram posicionados junto às expressões a que efetivamente se referem.
