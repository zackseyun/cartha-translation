base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: pt
  text: 'E todo aquele que não obedecer à lei do seu Deus e à lei do rei, que lhe seja aplicada prontamente a sentença: quer seja morte, quer banimento[a], quer confisco de bens, quer prisão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “expulsão”; mais literalmente, “desenraizamento”. O termo aramaico é raro e pode indicar o banimento de uma pessoa de seu lugar ou de sua comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: E todo aquele que
  rationale: Introduz uma oração relativa indefinida com valor distributivo; a formulação é natural em português e apropriada ao contexto jurídico.
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: não obedecer
  rationale: Embora a expressão seja literalmente 'não fizer/cumprir', com 'lei' indica falta de observância; 'obedecer' comunica com clareza sua força jurídica.
- source_word: דָּתָא
  choice: lei
  rationale: O termo aramaico pode significar lei, decreto ou regulamento; 'lei' preserva o paralelismo entre a autoridade divina e a real.
- source_word: אֱלָהָךְ
  choice: seu Deus
  rationale: Reproduz o possessivo de segunda pessoa singular dirigido a Esdras.
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: e à lei do rei
  rationale: Mantém a coordenação e o paralelismo formal com 'à lei do seu Deus'.
- source_word: אָסְפַּרְנָא
  choice: prontamente
  rationale: O advérbio exprime prontidão, diligência ou rigor; 'prontamente' se ajusta ao contexto de execução judicial sem acrescentar uma ideia específica de severidade.
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: seja prontamente julgado e punido
  rationale: A expressão passiva trata da aplicação de uma decisão ou pena judicial contra o infrator. A dupla verbal explicita em português corrente tanto o julgamento quanto sua execução, em harmonia com a lista de penas.
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: seja ... seja ... seja ... seja
  rationale: A construção enumera penas alternativas; a repetição de 'seja' conserva o ritmo jurídico e funciona naturalmente em português.
- source_word: לְמוֹת
  choice: com a morte
  rationale: Apresenta a morte como uma das penas possíveis sem recorrer ao termo mais interpretativo 'pena capital'.
- source_word: לשרשו
  choice: com o banimento
  rationale: O termo raro parece derivar da ideia de 'desarraigar' e, neste contexto penal, provavelmente indica expulsão ou desterro; a incerteza é registrada em nota.
- source_word: לַעֲנָשׁ נִכְסִין
  choice: com o confisco de bens
  rationale: A expressão indica punição incidente sobre propriedades ou posses; 'confisco de bens' oferece uma formulação jurídica clara, embora também possa envolver multa ou perda patrimonial.
- source_word: וְלֶאֱסוּרִין
  choice: com a prisão
  rationale: O substantivo pode denotar vínculos ou encarceramento; na lista de sanções, 'prisão' expressa naturalmente o resultado jurídico.
theological_decisions:
- issue: Relação entre a lei divina e a lei real no decreto
  choice: 'Apresentar as duas de maneira coordenada: “à lei do seu Deus e à lei do rei”.'
  alternative: Subordinar uma lei à outra ou interpretar a lei do rei apenas como instrumento de aplicação da lei de Deus.
  rationale: O texto coordena explicitamente as duas autoridades jurídicas no decreto persa. A tradução mantém essa tensão sem impor uma hierarquia teológica que o versículo não enuncia.
translation_notes:
  register: Português moderno, claro e digno, com tom jurídico compatível com um decreto real. Emprega construções amplamente compreensíveis no Brasil e em outros contextos lusófonos. A repetição de “seja” dá coesão à enumeração das penas.
