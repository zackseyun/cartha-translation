base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: pt
  text: Então Zorobabel, filho de Sealtiel, e Jesua, filho de Jozadaque, levantaram-se e começaram a construir a casa de Deus[a] que está em Jerusalém. Com eles estavam os profetas de Deus, dando-lhes apoio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o templo de Deus”. Em aramaico, literalmente: “a casa de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ajudando-os” ou “auxiliando-os”. O particípio indica apoio ativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Marcador discursivo aramaico que introduz o acontecimento seguinte; “Então” preserva com naturalidade a progressão narrativa.
- source_word: קָמוּ
  choice: levantaram-se
  rationale: Mantém o sentido concreto e idiomático de tomar a iniciativa para agir.
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: Zorobabel, filho de Sealtiel
  rationale: Emprega as formas dos nomes consagradas em português e traduz diretamente o patronímico aramaico.
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: Jesua, filho de Jozadaque
  rationale: Preserva a forma curta do nome יֵשׁוּעַ e usa formas portuguesas legíveis, sem substituí-la pela forma relacionada “Josué”.
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: e começaram a construir
  rationale: Reproduz de modo idiomático a construção aramaica com o verbo “começar” seguido do infinitivo “construir”.
- source_word: בֵּית אֱלָהָא
  choice: a casa de Deus
  rationale: Conserva a expressão literal aramaica; no contexto, ela designa o templo, indicado em nota como alternativa esclarecedora.
- source_word: דִּי בִירוּשְׁלֶם
  choice: que está em Jerusalém
  rationale: Traduz a oração relativa locativa sem acrescentar informação temporal não expressa.
- source_word: נביאיא די אלהא מסעדין להון
  choice: os profetas de Deus, dando-lhes apoio
  rationale: Expressa o particípio aramaico como ação concomitante e ativa de apoiar ou ajudar.
theological_decisions:
- issue: Designação do santuário de Jerusalém
  choice: a casa de Deus
  alternative: o templo de Deus
  rationale: A formulação literal preserva o idioma bíblico e evita substituir no texto principal a expressão da fonte por sua identificação contextual.
- issue: Natureza da atuação dos profetas
  choice: dando-lhes apoio
  alternative: ajudando-os; auxiliando-os
  rationale: Mantém a amplitude do particípio, que descreve apoio ativo sem especificar se ele foi material, verbal ou espiritual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes bíblicos em formas correntes no uso lusófono. A ordem da última oração foi ajustada para fluência, sem alterar a relação entre os profetas e os construtores.
