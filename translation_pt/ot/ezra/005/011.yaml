  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: pt
  text: 'E esta foi a resposta que nos deram[a]: “Nós somos servos do Deus dos céus e da terra e estamos reconstruindo[b] o templo que foi edificado há muitos anos por um grande rei de Israel, que o construiu e o completou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E assim foi a mensagem que nos devolveram”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estamos construindo”. O particípio aramaico indica uma ação em andamento; “reconstruindo” explicita, pelo contexto, que esse templo já existira anteriormente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: E esta foi a resposta que nos deram
  rationale: A expressão aramaica introduz o conteúdo da resposta. Em português, “a resposta que nos deram” comunica naturalmente tanto פִתְגָמָא quanto o sentido idiomático de הֲתִיבוּנָא, sem reproduzir de modo artificial a imagem de “devolver” uma palavra.
- source_word: עַבְדוֹהִי
  choice: servos
  rationale: No contexto, o termo expressa serviço e lealdade ao Deus de Israel, não enfatizando escravidão como condição social.
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: Deus dos céus e da terra
  rationale: Preserva o título aramaico e sua afirmação de soberania universal. “Céus”, no plural, corresponde à forma da língua-fonte e é natural no registro bíblico português.
- source_word: וּבָנַיִן
  choice: estamos reconstruindo
  rationale: O particípio indica uma ação em andamento. “Reconstruindo” explicita pelo contexto que o edifício existira antes, embora “construindo” seja lexicalmente possível.
- source_word: בַּיְתָא
  choice: templo
  rationale: Embora o sentido literal seja “casa”, o referente inequívoco é o templo. A escolha torna o texto imediatamente claro ao leitor moderno.
- source_word: מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: há muitos anos
  rationale: É a forma idiomática em português para o sentido literal de “muitos anos antes disto”.
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: um grande rei de Israel
  rationale: רַב indica grandeza ou eminência; a construção identifica o rei como pertencente a Israel sem nomeá-lo.
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: o construiu e o completou
  rationale: 'Mantém os dois verbos do aramaico: a edificação e sua condução até a conclusão.'
theological_decisions:
- issue: Título divino na correspondência imperial
  choice: Deus dos céus e da terra
  alternative: Deus do céu e da terra
  rationale: A tradução preserva a reivindicação textual de soberania universal, sem reduzir o Deus de Israel a uma divindade local. O plural “céus” também reflete diretamente a forma aramaica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da última oração foi ajustada para evitar a impressão de que o templo, e não o rei, fosse o sujeito de “construiu e completou”. As notas preservam alternativas lexicais reais do aramaico.
