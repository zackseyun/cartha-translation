base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: pt
  text: Os profetas Ageu e Zacarias, filho de Ido, profetizaram aos judeus[a] que estavam em Judá e em Jerusalém, em nome[b] do Deus de Israel, que estava sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos judeanos”. O termo aramaico pode designar o povo judeu ou, em sentido mais geográfico, o povo de Judá.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pela autoridade do Deus de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: profetizaram
  rationale: O perfeito peal aramaico apresenta a ação narrativa. O plural em português concorda naturalmente com os dois profetas; o waw inicial não exige um marcador temporal como “então” ou “ora”.
- source_word: חַגַּי נביאה וּזְכַרְיָה בַר עִדּוֹא נביאיא
  choice: Os profetas Ageu e Zacarias, filho de Ido
  rationale: A formulação reúne de modo natural a designação singular de Ageu e a aposição plural que identifica ambos como profetas. Os nomes seguem as formas portuguesas tradicionais, e בַר é traduzido por “filho de”.
- source_word: עַל
  choice: aos
  rationale: Com o verbo “profetizar”, a preposição indica aqui os destinatários da mensagem, sem impor o sentido hostil de “contra”.
- source_word: יְהוּדָיֵא
  choice: judeus
  rationale: O termo pode designar o povo judeu ou, com nuance geográfica, os habitantes de Judá. “Judeus” é claro e corrente; a alternativa “judeus da Judeia”/“judeanos” é indicada em nota.
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: que estavam em Judá e em Jerusalém
  rationale: דִּי introduz a oração relativa. “Judá” é apropriado para a realidade territorial e provincial do período pós-exílico.
- source_word: בְּשֻׁם
  choice: em nome
  rationale: A expressão indica que os profetas falavam como representantes de Deus e sob sua autoridade. “Em nome” preserva o idioma bíblico corrente, enquanto a nuance de autoridade é explicitada em nota.
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia de relação, definida pelo contexto.
- source_word: עֲלֵיהוֹן
  choice: que estava sobre eles
  rationale: A oração relativa liga a expressão ao Deus de Israel e conserva a imagem espacial e relacional do aramaico sem restringi-la a uma única noção, como governo, proteção ou presença.
theological_decisions:
- issue: Referente e sentido de עֲלֵיהוֹן
  choice: “que estava sobre eles”, modificando “o Deus de Israel”
  alternative: 'A expressão pode ser entendida de modo mais comprimido como “sobre eles” ou ligada mais diretamente à mensagem profética: “em nome do Deus de Israel para eles”.'
  rationale: A sintaxe favorece a ligação com “o Deus de Israel”. A tradução literal e idiomática o bastante preserva a tensão entre autoridade, cuidado e presença divina, sem escolher apenas uma dessas ideias.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção “Os profetas Ageu e Zacarias” evita uma aposição redundante e pouco natural em português, preservando a identificação de ambos como profetas. Os marcadores de nota foram posicionados junto às expressões a que de fato se referem.
