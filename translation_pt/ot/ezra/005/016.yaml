id: EZR.5.16
reference: Ezra 5:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱדַ֨יִן֙ שֵׁשְׁבַּצַּ֣ר דֵּ֔ךְ אֲתָ֗א יְהַ֧ב אֻשַּׁיָּ֛/א דִּי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/מִן אֱדַ֧יִן וְ/עַד כְּעַ֛ן מִתְבְּנֵ֖א וְ/לָ֥א שְׁלִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: pt
  text: Então esse Sesbazar veio e lançou os alicerces da casa de Deus que está em Jerusalém[a]. Desde então até agora, ela vem sendo construída[b], mas ainda não foi concluída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de maneira mais formal, “estabeleceu os alicerces”. O idioma aramaico diz literalmente “deu alicerces”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ela está sendo construída”. O verbo aramaico pode ser traduzido como um processo passivo em andamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo direto e natural em português.
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: esse Sesbazar
  rationale: Translitera o nome próprio segundo a forma portuguesa corrente e preserva a força anafórica do demonstrativo, que retoma a pessoa mencionada.
- source_word: אֲתָא
  choice: veio
  rationale: Equivalente direto do verbo narrativo aramaico.
- source_word: יְהַב אֻשַּׁיָּא
  choice: lançou os alicerces
  rationale: Expressa naturalmente em português o idioma aramaico, literalmente 'deu/pôs alicerces', sem perder a ação construtiva.
- source_word: בֵית אֱלָהָא
  choice: casa de Deus
  rationale: Preserva a expressão concreta do aramaico; 'templo' seria uma explicitação interpretativa.
- source_word: דִּי בִירוּשְׁלֶם
  choice: que está em Jerusalém
  rationale: Reproduz a oração relativa locativa em português natural.
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: Desde então até agora
  rationale: Mantém claramente o intervalo temporal iniciado com o lançamento dos alicerces e prolongado até o presente dos falantes.
- source_word: מִתְבְּנֵא
  choice: ela vem sendo construída
  rationale: A perífrase portuguesa comunica o processo passivo e continuado indicado pela forma aramaica no contexto.
- source_word: וְלָא שְׁלִם
  choice: mas ainda não foi concluída
  rationale: Expressa a não conclusão até o momento referido; 'ainda' torna natural a relação com 'até agora' sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém “casa de Deus” em vez de explicitar “templo” e usa “vem sendo construída” para conservar o aspecto durativo passivo.
