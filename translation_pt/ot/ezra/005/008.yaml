base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: pt
  text: Que o rei seja informado de que fomos à província de Judá, à casa do grande Deus. Ela está sendo construída com pedras grandes[a], e madeira está sendo colocada nas paredes. Essa obra está sendo realizada diligentemente[b] e prospera nas mãos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com pedras muito grandes”. A expressão aramaica pode referir-se, de modo geral, a pedras de construção grandes ou maciças.
    reason: lexical_alternative
  - marker: b
    text: Ou “cuidadosamente” ou, possivelmente, “rapidamente”. A nuance do advérbio é discutida, mas ele indica que a obra avançava de maneira eficaz.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: Que o rei seja informado
  rationale: Reproduz de modo natural e digno a fórmula administrativa aramaica que introduz o relatório oficial.
- source_word: לִיהוּד מְדִינְתָּא
  choice: à província de Judá
  rationale: מְדִינְתָּא designa uma província imperial; “Judá” é a forma portuguesa tradicional de Yehud.
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: à casa do grande Deus
  rationale: Preserva literalmente “casa”, embora o referente seja o templo, e mantém o tom reverente do texto.
- source_word: אֶבֶן גְּלָל
  choice: com pedras enormes
  rationale: A expressão parece indicar pedras de construção muito grandes ou maciças; “enormes” comunica isso com clareza sem adotar a tradução literal e potencialmente enganosa “pedras roladas”.
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  choice: e madeira está sendo colocada nas paredes
  rationale: “Madeira” é natural no contexto de construção, e a forma passiva preserva a descrição aramaica do material inserido na estrutura das paredes.
- source_word: אָסְפַּרְנָא
  choice: diligentemente
  rationale: O advérbio tem nuance discutida, podendo sugerir cuidado ou rapidez; “diligentemente” expressa execução ativa e eficaz sem restringir indevidamente o sentido.
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: e prospera nas mãos deles
  rationale: Mantém a imagem idiomática do original e comunica que a obra avança com êxito sob a responsabilidade deles.
theological_decisions: []
