base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/006.yaml
  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: pt
  text: Esta é uma cópia da carta que Tatenai, governador de Além do Rio, Setar-Bozenai e seus associados, os afarsaquitas[a] que estavam em Além do Rio, enviaram ao rei Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os oficiais”, se o termo for entendido como uma designação funcional, em vez de nome de um povo ou grupo administrativo.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: cópia
  rationale: O substantivo aramaico designa uma cópia ou transcrição de um documento; “cópia” é claro e natural neste contexto oficial.
- source_word: אִגַּרְתָּא
  choice: carta
  rationale: Refere-se a uma comunicação escrita oficial; “carta” é a forma corrente e adequada em português.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Transliteração portuguesa clara do nome próprio aramaico.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: governador da região Além do Rio
  rationale: “Governador” expressa o cargo persa, e “Além do Rio” preserva a designação administrativa da região a oeste do Eufrates; “região” esclarece que se trata de um território.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Setar-Bozenai
  rationale: Transliteração do nome próprio em forma legível para o público lusófono.
- source_word: וּכְנָוָתֵהּ
  choice: e seus companheiros
  rationale: O termo indica pessoas associadas a Setar-Bozenai; “companheiros” preserva o sentido amplo sem lhes atribuir um cargo específico.
- source_word: אֲפַרְסְכָיֵא
  choice: os afarsequeus
  rationale: O termo aramaico é incerto. A transliteração preserva a possível referência a um povo ou grupo administrativo, sem decidir que se trata necessariamente de um título funcional.
- source_word: שְׁלַח ... עַל דָּרְיָוֶשׁ מַלְכָּא
  choice: enviaram ao rei Dario
  rationale: A forma plural é exigida naturalmente em português pelo sujeito composto; “ao rei Dario” expressa de modo idiomático o destinatário.
theological_decisions: []
