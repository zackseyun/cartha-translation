base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/013.yaml
  text: However[a], in the first year of Cyrus king of Babylon, Cyrus the king issued a decree to rebuild this house of God.
translation:
  language: pt
  text: Contudo, no primeiro ano de Ciro, rei da Babilônia, o rei Ciro emitiu um decreto para reconstruir esta casa de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para construir esta casa de Deus”. O verbo aramaico significa propriamente “construir”; “reconstruir” reflete o contexto de restauração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַם
  choice: Contudo
  rationale: Conjunção adversativa aramaica que introduz contraste com a declaração anterior; “Contudo” preserva a transição discursiva em português natural e digno.
- source_word: בִּשְׁנַת חֲדָה
  choice: no primeiro ano
  rationale: Expressão idiomática de datação pelo ano de reinado; esta é a forma corrente em português.
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: de Ciro, rei da Babilônia
  rationale: O lamed com o nome real, em fórmula cronológica, indica o reinado de referência; a aposição conserva a identificação dada pelo aramaico.
- source_word: שָׂם טְעֵם
  choice: emitiu um decreto
  rationale: Embora שָׂם signifique literalmente “pôs/estabeleceu”, sua combinação com o termo administrativo טְעֵם denota a promulgação de uma ordem oficial.
- source_word: בֵּית אֱלָהָא דְנָה
  choice: esta casa de Deus
  rationale: Tradução formal da expressão aramaica, preservando a imagem bíblica de “casa” sem substituí-la diretamente por “templo”.
- source_word: לִבְנֵא
  choice: para reconstruir
  rationale: O infinitivo significa literalmente “construir”; “reconstruir” explicita naturalmente o contexto de restauração após a destruição, enquanto a nota preserva a alternativa lexical direta.
