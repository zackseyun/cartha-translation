base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/015.yaml
  text: And he said to him[a], ‘Take these vessels, go and put them in the temple that is in Jerusalem, and let the house of God be rebuilt on its site.’
translation:
  language: pt
  text: 'E ele lhe disse: “Pegue estes utensílios, vá e coloque-os no templo que fica em Jerusalém; e que a casa de Deus seja reconstruída em seu lugar[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja construída em seu lugar”. O aramaico enfatiza que a casa de Deus deveria ser erguida novamente no lugar que lhe pertencia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר לֵהּ
  choice: E ele lhe disse
  rationale: Reproduz a introdução narrativa e explicita naturalmente, em português, o sujeito masculino singular e o objeto indireto.
- source_word: אֵלֶּה מָאנַיָּא
  choice: estes utensílios
  rationale: No contexto, o termo designa os objetos usados no templo; “utensílios” é claro e evita limitar indevidamente a referência a recipientes.
- source_word: שֵׂא
  choice: Pegue
  rationale: Expressa de modo natural o imperativo de tomar consigo os utensílios para transportá-los.
- source_word: אֵזֶל אֲחֵת הִמּוֹ
  choice: vá e coloque-os
  rationale: Mantém a sequência dos dois imperativos e identifica claramente os utensílios como objeto do segundo.
- source_word: בְּהֵיכְלָא דִּי בִירוּשְׁלֶם
  choice: no templo que fica em Jerusalém
  rationale: O contexto exige “templo”, e a oração relativa com דִּי é preservada em português corrente.
- source_word: וּבֵית אֱלָהָא
  choice: e que a casa de Deus
  rationale: Conserva a designação literal do templo como “casa de Deus” e introduz naturalmente a construção passiva volitiva.
- source_word: יִתְבְּנֵא
  choice: seja reconstruída
  rationale: A forma verbal significa “seja construída”; “reconstruída” torna explícito o contexto histórico de restauração sem alterar a voz passiva.
- source_word: עַל אַתְרֵהּ
  choice: em seu lugar
  rationale: Traduz a ideia de localização própria ou anterior da casa de Deus; a alternativa “no seu local” seria possível, mas menos natural neste registro.
