base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: pt
  text: Mas o olho do Deus deles estava sobre os anciãos dos judeus[a], e as autoridades não os fizeram parar até que uma decisão fosse levada a Dario[b]; então, enviariam de volta uma carta sobre esse assunto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Deus deles vigiava os anciãos dos judeus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até que um decreto” ou “uma ordem” fosse levado(a) a Dario.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “então enviariam uma resposta por escrito a respeito disso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: Mas os olhos do Deus deles estavam sobre
  rationale: Preserva em português a metáfora concreta do olhar divino e o sufixo possessivo explícito. Embora o aramaico use o singular coletivo, o plural idiomático “os olhos” soa natural em português sem apagar a imagem.
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: os anciãos dos judeus
  rationale: Traduz שָׂבֵי especificamente como “anciãos”, evitando o termo mais genérico “líderes”.
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: e as autoridades não os fizeram parar
  rationale: Mantém a força causativa do Pael. O sujeito implícito é explicitado pelo contexto como as autoridades mencionadas anteriormente, evitando em português a ambiguidade pouco natural entre os dois pronomes.
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: até que a questão fosse levada a Dario
  rationale: טַעְמָא pode designar assunto, decisão ou ordem administrativa; no fluxo narrativo, a ideia é o encaminhamento da questão ao rei. A nota preserva a leitura mais literal ligada a decisão ou ordem.
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל דְּנָה
  choice: e, então, recebessem uma resposta por escrito a esse respeito
  rationale: Entende יְתִיבוּן no sentido de devolver ou responder e נִשְׁתְּוָנָא como comunicação escrita oficial. A formulação portuguesa expressa naturalmente que se aguardaria uma resposta escrita sobre o caso.
theological_decisions:
- issue: Descrição antropomórfica da supervisão divina
  choice: Manter no texto principal a imagem “os olhos do Deus deles estavam sobre”
  alternative: “o Deus deles cuidava dos anciãos dos judeus”
  rationale: A metáfora concreta comunica vigilância e proteção providencial sem transformar a tradução em explicação doutrinária.
- issue: Identidade do agente que não interrompeu a obra
  choice: Explicitar “as autoridades” com base no contexto imediato
  alternative: Manter apenas “eles”, como no aramaico
  rationale: O aramaico permite recuperar o sujeito dos oficiais do contexto. A explicitação torna a frase inteligível em português sem atribuir a ação a um novo agente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a metáfora divina, o título sociopolítico “anciãos” e o tom administrativo da passagem. Todos os marcadores de nota aparecem no texto principal.
