base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: pt
  text: 'Enviaram-lhe um relatório[a], e nele estava escrito o seguinte: “Ao rei Dario: paz completa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma mensagem”, “um documento” ou “uma carta”. O termo aramaico pode designar uma comunicação oficial de diferentes tipos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “toda paz”; era uma saudação formal que expressava o desejo de paz e completo bem-estar.
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: relatório
  rationale: No contexto administrativo, o termo aramaico designa uma comunicação oficial escrita; “relatório” expressa bem essa função, embora “mensagem”, “documento” ou “carta” também sejam possíveis.
- source_word: שְׁלַחוּ עֲלוֹהִי
  choice: Enviaram-lhe
  rationale: Reproduz de modo natural o verbo no perfeito, na terceira pessoa do plural, e entende a preposição com o sufixo como indicação do destinatário.
- source_word: וְכִדְנָה כְּתִיב בְּגַוֵּהּ
  choice: no qual estava escrito
  rationale: Introduz o conteúdo exato do documento em português corrente, preservando o sentido passivo de כְּתִיב e a referência ao que estava dentro dele.
- source_word: לְדָרְיָוֶשׁ מַלְכָּא
  choice: Ao rei Dario
  rationale: A preposição assinala o destinatário, e a ordem portuguesa “rei Dario” apresenta naturalmente o título e o nome.
- source_word: שְׁלָמָא כֹלָּא
  choice: plena paz
  rationale: A expressão é uma saudação epistolar que deseja paz ou bem-estar em toda a sua plenitude. “Plena paz” conserva o conteúdo lexical sem soar tão artificial quanto “toda paz”.
theological_decisions: []
