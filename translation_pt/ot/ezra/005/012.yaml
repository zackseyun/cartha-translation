  - severity: high
    issue: “Seu povo” traduz וְעַמָּה.
    rationale: A expressão está no estado determinado e significa “o povo”. O possessivo não está expresso e pode atribuir o povo a Nabucodonosor, distorcendo o referente.
  - severity: low
    issue: A nota c não corresponde precisamente à formulação principal.
    rationale: Se o texto principal diz que Nabucodonosor levou o povo para a Babilônia, a alternativa deve conservar “o povo”, sem o possessivo introduzido.
