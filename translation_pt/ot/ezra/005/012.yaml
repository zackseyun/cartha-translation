  source_fidelity: A tradução de לָהֵן como “Mas” não preserva o valor inferencial do marcador, que introduz a consequência (“Portanto”/“Por isso”). Além disso, וְעַמָּה é “o povo”, não “seu povo”; o possessivo introduzido pode sugerir indevidamente que se trata do povo de Nabucodonosor.
  naturalness: O texto é em geral claro e de registro adequado. “Portanto, como” é uma forma natural de conservar, em português moderno, a relação inferencial e causal expressa pelos dois conectores aramaicos. Repetir “Nabucodonosor” na segunda oração elimina com naturalidade qualquer ambiguidade quanto ao agente humano.
  terminology: “Antepassados”, “Deus dos céus”, “Nabucodonosor”, “o caldeu” e “esta casa” são escolhas apropriadas. A nota que identifica “casa” como o templo é pertinente.
