  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָהֵ֗ן מִן דִּ֨י הַרְגִּ֤זוּ אֲבָהֳתַ֨/נָא֙ לֶ/אֱלָ֣הּ שְׁמַיָּ֔/א יְהַ֣ב הִמּ֔וֹ בְּ/יַ֛ד נְבוּכַדְנֶצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל כסדי/א וּ/בַיְתָ֤/ה דְנָה֙ סַתְרֵ֔/הּ וְ/עַמָּ֖/ה הַגְלִ֥י לְ/בָבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: pt
  text: Portanto, como nossos antepassados provocaram[a] a ira do Deus dos céus, ele os entregou nas mãos de Nabucodonosor, rei da Babilônia, o caldeu. Nabucodonosor destruiu esta casa[b] e levou o povo para a Babilônia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “irritaram o Deus dos céus”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo.
    reason: cultural_note
  - marker: c
    text: 'Ou: “deportou o povo para a Babilônia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: Mas
  rationale: 'No contexto, o marcador aramaico introduz um contraste explicativo com a grandeza anterior do templo: apesar disso, a rebeldia dos antepassados trouxe o juízo. “Mas” expressa essa transição de modo natural em português.'
- source_word: מִן דִּי
  choice: visto que
  rationale: A locução funciona como conjunção causal. “Visto que” mantém clareza e um registro digno sem soar arcaico.
- source_word: הַרְגִּזוּ
  choice: provocaram a ira
  rationale: O causativo de רגז indica causar ira ou indignação. A expressão preserva tanto a causalidade quanto a solenidade do juízo divino.
- source_word: אֲבָהֳתַנָא
  choice: nossos antepassados
  rationale: Embora o sentido literal seja “nossos pais”, aqui o termo designa gerações ancestrais. “Antepassados” evita uma leitura restrita aos pais imediatos e é corrente em português.
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: o Deus dos céus
  rationale: Reproduz o título divino pós-exílico de forma idiomática e reconhecível em português.
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: ele os entregou nas mãos de
  rationale: Mantém a atribuição direta da ação a Deus e comunica naturalmente o sentido idiomático de colocar alguém sob o poder de outro.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל
  choice: Nabucodonosor, rei da Babilônia
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português, com o título real expresso diretamente.
- source_word: כסדיא
  choice: o caldeu
  rationale: O gentílico singular está em aposição a Nabucodonosor. “O caldeu” traduz sua forma sem substituí-la pela interpretação “o babilônio”.
- source_word: וּבַיְתָה דְנָה
  choice: esta casa
  rationale: Conserva o termo concreto “casa”, usado aqui para o templo, sem tornar explícita no texto principal uma identificação que fica clara pelo contexto e pela nota.
- source_word: סַתְרֵהּ
  choice: destruiu
  rationale: O verbo denota derrubar ou destruir uma construção. “Destruiu” é claro, abrangente e apropriado ao contexto.
- source_word: וְעַמָּה הַגְלִי
  choice: levou seu povo para o exílio
  rationale: O sufixo em “seu povo” retoma esta casa/templo como centro representativo da comunidade, enquanto o causativo de גלה indica conduzir ao exílio. A formulação torna explícito o sentido de exílio sem perder a ideia de deslocamento forçado.
- source_word: לְבָבֶל
  choice: na Babilônia
  rationale: Com “levou ... para o exílio”, “na Babilônia” expressa naturalmente o destino e lugar do exílio em português.
theological_decisions:
- issue: Ação divina no juízo
  choice: ele os entregou nas mãos de Nabucodonosor
  alternative: ele permitiu que caíssem nas mãos de Nabucodonosor
  rationale: O aramaico atribui diretamente a Deus o ato de entregá-los como resposta à provocação. A tradução não reduz essa causalidade a mera permissão.
- issue: Identificação da casa
  choice: esta casa
  alternative: este templo
  rationale: Embora o referente seja o templo, o texto-fonte diz “casa”. A tradução preserva essa linguagem teológica e fornece a identificação em nota.
- issue: Referente do sujeito após Nabucodonosor
  choice: Este destruiu esta casa
  alternative: e ele destruiu esta casa
  rationale: A sequência atribui naturalmente a destruição e o exílio a Nabucodonosor, o agente humano a quem Deus entregou os antepassados. “Este” evita que o pronome português seja entendido como referência a Deus, sem alterar a relação entre a soberania divina e a ação do rei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Antepassados” evita ambiguidade geracional; “provocaram a ira” preserva a força do causativo; e a divisão em duas frases esclarece que Nabucodonosor é o agente humano da destruição e do exílio.
