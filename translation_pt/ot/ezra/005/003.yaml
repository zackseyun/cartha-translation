base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: pt
  text: 'Naquele tempo, Tatenai, governador de Além do Rio[a], e Setar-Bozenai, juntamente com seus associados, foram até eles e lhes perguntaram: “Quem lhes deu ordem para construir este templo e concluir esta estrutura[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Além do Rio” era o nome administrativo persa da região situada a oeste do rio Eufrates.
    reason: cultural_note
  - marker: b
    text: O termo aramaico traduzido como “estrutura” é incerto e pode se referir mais especificamente à obra do templo; também pode ser entendido como “muro” ou “armação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: Naquele tempo
  rationale: Expressão temporal aramaica vertida de modo natural, preservando o enquadramento narrativo.
- source_word: אֲתָא עֲלֵיהוֹן
  choice: foram até eles
  rationale: Comunica claramente a aproximação dos oficiais aos construtores, sem sugerir ataque ou hostilidade não expressa.
- source_word: תַּתְּנַי
  choice: Tatenai
  rationale: Transliteração do nome próprio adaptada à ortografia portuguesa.
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: governador da região Além do Rio
  rationale: פַּחַת designa um governador provincial, e עֲבַר נַהֲרָה era a designação administrativa persa da região a oeste do Eufrates. A inserção de 'região' torna o título inteligível em português.
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: Setar-Bozenai
  rationale: Transliteração portuguesa do nome composto.
- source_word: וּכְנָוָתְהוֹן
  choice: e seus associados
  rationale: Termo amplo e natural para as pessoas vinculadas aos dois oficiais.
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: e lhes perguntaram
  rationale: A fórmula introduz uma fala direta cujo conteúdo é interrogativo; a tradução natural explicita essa função sem alterar o sentido.
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: Quem deu a vocês autorização
  rationale: טְעֵם pode designar ordem, decreto ou decisão oficial. 'Autorização' expressa naturalmente, no contexto da pergunta, a autoridade oficial para executar a obra, sem limitar o termo a um documento formal.
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: para construir este templo
  rationale: Embora בַּיְתָא signifique literalmente 'casa', o referente contextual é o templo. 'Templo' evita ambiguidade para o leitor moderno sem acrescentar a ideia de reconstrução ao verbo.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: esta estrutura
  rationale: O sentido preciso do substantivo é incerto; 'estrutura' preserva melhor a amplitude entre obra, edificação, armação e possível referência ao muro.
- source_word: לְשַׁכְלָלָה
  choice: concluir
  rationale: Expressa o ato de levar a obra à conclusão e se combina naturalmente com 'estrutura'.
theological_decisions: []
translation_notes:
