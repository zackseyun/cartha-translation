  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: pt
  text: 'Então lhes dissemos: “Quais são os nomes dos homens que estão construindo este edifício?”[a]


    [a] Mais formalmente: “Então dissemos a eles o seguinte: ‘Quais são os nomes dos homens que estão construindo este edifício?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “Então dissemos a eles o seguinte: ‘Quais são os nomes dos homens que estão construindo este edifício?’”'
    reason: Registra de forma explícita o advérbio כְּנֵמָא (“assim/deste modo”) e a construção literal “dissemos a eles”.
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio temporal e sequencial que introduz a ação seguinte; “Então” preserva com naturalidade o andamento da narrativa.
- source_word: כְּנֵמָא
  choice: (incorporado na introdução da fala)
  rationale: Significa “assim/deste modo”. Em português corrente, diante de uma citação direta, seu sentido pode ser expresso naturalmente pelos dois-pontos; a nota registra a forma explícita “o seguinte”.
- source_word: אֲמַרְנָא לְּהֹם
  choice: lhes dissemos
  rationale: Mantém a primeira pessoa do plural e o sentido básico de “dizer a eles”, sem substituir o verbo por “perguntar”, embora a fala introduzida seja interrogativa.
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: Quais são os nomes
  rationale: Formulação idiomática em português para a pergunta de identificação, preservando a referência explícita aos nomes.
- source_word: גֻּבְרַיָּא
  choice: dos homens
  rationale: O substantivo aramaico é masculino e se refere aos homens envolvidos; a tradução conserva essa especificidade.
- source_word: דִּי
  choice: que
  rationale: Pronome relativo natural em português ligando “homens” à ação contínua.
- source_word: דְנָה בִנְיָנָא
  choice: este edifício
  rationale: O demonstrativo é preservado, e “edifício” expressa de modo claro e natural a estrutura que está sendo construída.
- source_word: בָּנַיִן
  choice: estão construindo
  rationale: O particípio aramaico indica ação em andamento; a locução progressiva portuguesa conserva esse aspecto sem acrescentar a ideia não expressa de “reconstruir”.
theological_decisions: []
