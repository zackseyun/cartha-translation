  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַ֧ף שְׁמָהָתְ/הֹ֛ם שְׁאֵ֥לְנָא לְּ/הֹ֖ם לְ/הוֹדָעוּתָ֑/ךְ דִּ֛י נִכְתֻּ֥ב שֻׁם גֻּבְרַיָּ֖/א דִּ֥י בְ/רָאשֵׁי/הֹֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/010.yaml
  text: We also asked them their names[a], to make them known to you[b], that we might write down the names of the men who were at their head.
translation:
  language: pt
  text: Também lhes perguntamos seus nomes, para levá-los ao teu conhecimento[a], a fim de escrevermos os nomes dos homens que estavam à frente deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais direto, “para te informar”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que estavam à cabeça deles”; isto é, os principais homens do grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Também
  rationale: Mantém a força aditiva da expressão aramaica e se encaixa naturalmente na sequência do relatório.
- source_word: שְׁמָהָתְהֹם
  choice: seus nomes
  rationale: Expressa de modo claro e corrente o substantivo plural com sufixo possessivo de terceira pessoa do plural.
- source_word: שְׁאֵלְנָא לְּהֹם
  choice: lhes perguntamos
  rationale: Reproduz diretamente o verbo aramaico de perguntar ou indagar com seu complemento pessoal.
- source_word: לְהוֹדָעוּתָךְ
  choice: para levá-los ao teu conhecimento
  rationale: Conserva tanto a finalidade da pergunta quanto a referência aos nomes como objeto da comunicação, em português natural.
- source_word: דִּי נִכְתֻּב
  choice: a fim de escrevermos
  rationale: A locução explicita a finalidade da ação sem acrescentar ao verbo simples 'escrever' uma noção não exigida pelo texto.
- source_word: שֻׁם גֻּבְרַיָּא
  choice: os nomes dos homens
  rationale: O singular aramaico 'nome' tem aqui valor coletivo, confirmado pelo referente plural 'homens' e pela menção anterior aos nomes.
- source_word: דִּי בְרָאשֵׁיהֹם
  choice: que estavam à frente deles
  rationale: Preserva a metáfora espacial do original e comunica com clareza que esses homens exerciam liderança.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O tratamento na segunda pessoa do singular preserva o destinatário singular do aramaico, e a formulação evita substituir silenciosamente a imagem de liderança presente no original.
