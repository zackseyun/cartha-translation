source:
  edition: WLC
  text: וּ/כְעַ֞ן הֵ֧ן עַל מַלְכָּ֣/א טָ֗ב יִ֠תְבַּקַּר בְּ/בֵ֨ית גִּנְזַיָּ֜/א דִּי מַלְכָּ֣/א תַמָּה֮ דִּ֣י בְּ/בָבֶל֒ הֵ֣ן אִיתַ֗י דִּֽי מִן כּ֤וֹרֶשׁ מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/מִבְנֵ֛א בֵּית אֱלָהָ֥/א דֵ֖ךְ בִּ/ירוּשְׁלֶ֑ם וּ/רְע֥וּת מַלְכָּ֛/א עַל דְּנָ֖ה יִשְׁלַ֥ח עֲלֶֽי/נָא־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: pt
  text: E agora, se parecer bem ao rei, que se faça uma busca na tesouraria real, ali na Babilônia, para verificar se há, de fato, um decreto emitido pelo rei Ciro para reconstruir[a] esta casa de Deus em Jerusalém. E que o rei nos envie sua decisão[b] sobre este assunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “construir”. O verbo aramaico significa literalmente “construir”; “reconstruir” reflete o contexto da restauração do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua vontade” ou “seu agrado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: Agora
  rationale: Marca a transição para o pedido conclusivo; “Agora” é natural em português e mantém a progressão do discurso.
- source_word: הֵן עַל מַלְכָּא טָב
  choice: se parecer bem ao rei
  rationale: Preserva a fórmula cortês da linguagem oficial da corte sem soar excessivamente arcaica.
- source_word: יִתְבַּקַּר
  choice: que se faça uma busca
  rationale: Expressa o valor passivo e volitivo do verbo no contexto de uma consulta aos registros reais.
- source_word: בְּבֵית גִּנְזַיָּא דִּי מַלְכָּא
  choice: na tesouraria real
  rationale: A expressão significa literalmente “casa dos tesouros do rei” e designa o local onde se guardavam bens e documentos oficiais; “tesouraria real” é conciso e idiomático.
- source_word: תַמָּה דִּי בְּבָבֶל
  choice: ali na Babilônia
  rationale: Mantém a indicação locativa enfática ligada à tesouraria real.
- source_word: הֵן אִיתַי דִּי
  choice: para verificar se de fato
  rationale: Comunica a finalidade da busca e a força confirmatória da construção aramaica, sem pressupor o resultado.
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: o rei Ciro emitiu um decreto
  rationale: טְעֵם denota aqui uma ordem ou decisão oficial, e a construção com שִׂים descreve sua promulgação.
- source_word: לְמִבְנֵא
  choice: reconstruir
  rationale: O verbo significa formalmente “construir”, mas “reconstruir” torna explícito o contexto histórico de restauração; a alternativa mais literal é preservada em nota.
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: esta casa de Deus
  rationale: Conserva tanto o demonstrativo quanto a expressão aramaica “casa de Deus”, evitando substituir o termo por “templo” no texto principal.
- source_word: וּרְעוּת מַלְכָּא
  choice: a decisão do rei
  rationale: No contexto administrativo, refere-se à vontade ou determinação soberana; “decisão” é clara e natural em português atual.
- source_word: עַל דְּנָה
  choice: sobre este assunto
  rationale: Explicita de modo idiomático que o demonstrativo retoma a questão oficial apresentada.
- source_word: יִשְׁלַח עֲלֵינָא
  choice: que o rei nos envie
  rationale: Mantém o pedido volitivo e o sujeito real explícito, com a decisão como objeto expresso na frase.
