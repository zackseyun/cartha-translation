source:
  edition: WLC
  text: וְ֠/אַף מָאנַיָּ֣/א דִֽי בֵית אֱלָהָ/א֮ דִּ֣י דַהֲבָ֣/ה וְ/כַסְפָּ/א֒ דִּ֣י נְבוּכַדְנֶצַּ֗ר הַנְפֵּק֙ מִן הֵֽיכְלָ/א֙ דִּ֣י בִֽ/ירוּשְׁלֶ֔ם וְ/הֵיבֵ֣ל הִמּ֔וֹ לְ/הֵיכְלָ֖/א דִּ֣י בָבֶ֑ל הַנְפֵּ֨ק הִמּ֜וֹ כּ֣וֹרֶשׁ מַלְכָּ֗/א מִן הֵֽיכְלָ/א֙ דִּ֣י בָבֶ֔ל וִ/יהִ֨יבוּ֙ לְ/שֵׁשְׁבַּצַּ֣ר שְׁמֵ֔/הּ דִּ֥י פֶחָ֖ה שָׂמֵֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: pt
  text: Além disso, os utensílios de ouro e de prata da casa de Deus, que Nabucodonosor havia retirado do templo que estava em Jerusalém e levado ao templo na Babilônia, o rei Ciro os retirou do templo na Babilônia e os entregou a um homem chamado Sesbazar[a], a quem havia nomeado governador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “e os entregou a Sesbazar — esse era o nome dele —, a quem havia constituído governador”.'
    reason: Registra a formulação mais literal de שְׁמֵהּ e a alternativa formal para שָׂמֵהּ, sem tornar pesada a redação principal.
lexical_decisions:
- source_word: וְאַף
  choice: Além disso
  rationale: Preserva a força aditiva do conectivo aramaico e introduz naturalmente mais um elemento do relato.
- source_word: מָאנַיָּא
  choice: utensílios
  rationale: Designa objetos ou implementos usados no templo; é concreto, claro e mais corrente em português do que 'vasos' neste contexto.
- source_word: בֵית אֱלָהָא
  choice: casa de Deus
  rationale: Mantém a expressão literal e a distingue de הֵיכְלָא, traduzido por 'templo' no restante do versículo.
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: de ouro e de prata
  rationale: Expressa naturalmente em português os materiais de que eram feitos os utensílios.
- source_word: הַנְפֵּק
  choice: havia retirado / retirou
  rationale: O mais-que-perfeito composto marca a ação anterior de Nabucodonosor; o pretérito perfeito apresenta depois a ação de Ciro na sequência narrativa.
- source_word: הֵיכְלָא
  choice: templo
  rationale: No contexto, refere-se tanto ao santuário de Jerusalém quanto ao templo da Babilônia; 'templo' é claro e adequado.
- source_word: וְהֵיבֵל הִמּוֹ
  choice: e levado
  rationale: O objeto 'os utensílios' permanece claramente subentendido em português, evitando repetição pesada sem eliminar a referência do pronome aramaico.
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: o rei Ciro
  rationale: É a ordem mais idiomática em português para o título e o nome.
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: e os entregou a um homem chamado Sesbazar
  rationale: Reproduz de modo natural a fórmula aramaica de identificação, literalmente relacionada a 'seu nome', e mantém explícito o objeto plural.
- source_word: פֶחָה
  choice: governador
  rationale: Equivalente claro e tradicional do título administrativo persa.
- source_word: שָׂמֵהּ
  choice: havia nomeado
  rationale: Comunica a designação oficial para o cargo e apresenta essa nomeação como anterior à entrega dos utensílios.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a distinção lexical entre 'casa de Deus' e 'templo', bem como a longa estrutura sintática e a retomada pronominal do aramaico, sem rigidez desnecessária.
