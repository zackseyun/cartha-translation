- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: e lhes dissemos o seguinte
  rationale: Introduz naturalmente em português o conteúdo da pergunta citada.
- source_word: מַן
  choice: Quem
  rationale: Mantém a pergunta pela pessoa ou autoridade responsável.
- source_word: שָׂם לְכֹם טְעֵם
  choice: deu a vocês a ordem
  rationale: טְעֵם designa aqui uma determinação oficial; “ordem” preserva o sentido administrativo sem tornar obrigatório o tecnicismo “decreto”.
- source_word: בַּיְתָא דְנָה
  choice: esta casa
  rationale: Preserva o substantivo aramaico literal; no contexto, a casa é o templo.
- source_word: לְמִבְנְיָה
  choice: de construir
  rationale: O verbo significa construir; “reconstruir” acrescentaria uma nuance contextual não expressa pelo verbo nesta oração.
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: esta estrutura
  rationale: O substantivo raro pode indicar a construção, sua estrutura ou seu conjunto material; a escolha mantém essa abrangência.
- source_word: לְשַׁכְלָלָה
  choice: concluir
  rationale: Comunica levar a obra à plena conclusão e conserva o tom administrativo do relato.
