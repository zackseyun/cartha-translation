lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência da narrativa de forma natural e direta em português.
- source_word: שְׁאֵלְנָא
  choice: perguntamos
  rationale: Expressa de modo claro e neutro o ato de interrogar os anciãos.
- source_word: לְשָׂבַיָּא אִלֵּךְ
