    issue: A nota a altera a relação entre os dois sons ao dizer «em meio ao som».
    rationale: O hebraico descreve incapacidade de distinguir/reconhecer um som do outro, não um som ocorrido em meio ao outro. A alternativa deve manter essa comparação.
  - severity: low
    issue: «Gritava com um grande brado» é uma combinação menos idiomática em português.
    rationale: O sentido é compreensível, mas «soltava um grande brado» expressa naturalmente a ação de emitir uma aclamação, preservando a intensidade indicada por תְּרוּעָה גְדוֹלָה.
  - severity: low
    issue: «De longe» pode focalizar a posição de quem ouve, em vez de o som alcançar uma distância.
    rationale: «Até bem longe» exprime mais claramente o alcance espacial de עַד לְמֵרָחוֹק.
  revised_text: E o povo não conseguia distinguir o som do grito de alegria do som do choro do povo[a], pois o povo soltava um grande brado[b], e o som era ouvido até bem longe.
