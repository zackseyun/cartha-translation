  text: וְ/אֵ֣ין הָ/עָ֗ם מַכִּירִים֙ ק֚וֹל תְּרוּעַ֣ת הַ/שִּׂמְחָ֔ה לְ/ק֖וֹל בְּכִ֣י הָ/עָ֑ם כִּ֣י הָ/עָ֗ם מְרִיעִים֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וְ/הַ/קּ֥וֹל נִשְׁמַ֖ע עַד לְ/מֵ/רָחֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: pt
  text: E o povo não conseguia distinguir o som do grito de alegria do som do choro do povo[a], pois o povo soltava um grande brado[b], e o som era ouvido até bem longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não conseguia reconhecer o som do grito de alegria do som do choro do povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “com um grande brado”; também pode ser traduzido como “com um brado alto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכִּירִים
  choice: não conseguia distinguir
  rationale: O hifil de נכר expressa aqui a incapacidade de diferenciar dois sons; «distinguir» comunica isso de modo natural e preciso.
- source_word: קוֹל
  choice: som
  rationale: O termo designa aqui um fenômeno audível, não conteúdo verbal; «som» funciona naturalmente nas três ocorrências.
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: o som dos gritos de alegria
  rationale: A expressão preserva a ideia de aclamação jubilosa e forma um contraste claro com o som do choro; o plural «gritos» é natural para a aclamação coletiva.
- source_word: לְקוֹל בְּכִי הָעָם
  choice: do som do choro do povo
  rationale: O לְ comparativo é expresso por «do» após «distinguir... de», e «choro» conserva a força emocional de בְּכִי.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da impossibilidade de distinguir os sons e mantém uma ligação causal clara.
- source_word: מְרִיעִים
  choice: gritava
  rationale: O hifil de רוע indica levantar uma aclamação ou grito; o singular concorda com o coletivo «povo» em português.
- source_word: תְּרוּעָה גְדוֹלָה
  choice: com um grande brado
  rationale: Preserva a intensidade de גְדוֹלָה e, por meio de «brado», mantém de forma legível a construção cognata com מְרִיעִים.
- source_word: נִשְׁמַע
  choice: era ouvido
  rationale: Reproduz naturalmente a forma passiva do nifal e o aspecto da cena em andamento.
- source_word: עַד לְמֵרָחוֹק
  choice: de longe
  rationale: Expressa de modo idiomático que o som alcançava uma grande distância.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «som» e «povo» foi mantida para refletir a estrutura enfática do hebraico. «Brado» evita uma repetição portuguesa excessivamente áspera de «gritar/grito», sem apagar a construção cognata, explicitada também na nota.
