    issue: Redundância e acréscimo possessivo em «vestidos com suas vestes».
    rationale: O hebraico diz apenas «vestidos/trajados» e não contém um substantivo para vestes nem o possessivo «suas». A formulação portuguesa é tautológica.
  - severity: low
    issue: Âncora da nota deve ficar junto de «segundo as instruções de Davi, rei de Israel».
    rationale: A nota explica especificamente a expressão hebraica עַל־יְדֵי («pela mão de»), traduzida por essa locução; a colocação imediata melhora a precisão da ancoragem.
