  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: pt
  text: Quando os construtores lançaram os alicerces do templo de Yahweh, puseram em seus postos os sacerdotes, trajados e com trombetas, e os levitas, filhos de Asafe, com címbalos, para louvar Yahweh segundo as instruções de Davi, rei de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Davi, rei de Israel”, expressão idiomática que aqui significa segundo a orientação ou prescrição de Davi.'
    reason: Registra a forma literal e a possível nuance de agência da expressão עַל יְדֵי, enquanto o texto principal comunica seu sentido contextual.
lexical_decisions:
- source_word: וְיִסְּדוּ
  choice: lançaram os alicerces
  rationale: O verbo יסד, neste contexto de construção, refere-se ao assentamento dos alicerces. A expressão é natural em português e preserva o sentido concreto.
- source_word: הַבֹּנִים
  choice: os construtores
  rationale: O particípio substantivado designa as pessoas encarregadas da construção.
- source_word: הֵיכַל יְהוָה
  choice: o templo de Yahweh
  rationale: הֵיכָל designa aqui o edifício do templo; o nome divino é transliterado como Yahweh.
- source_word: וַיַּעֲמִידוּ
  choice: colocaram em seus postos
  rationale: O hifil de עמד indica que os sacerdotes e levitas foram dispostos em seus lugares para o serviço litúrgico.
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים
  choice: os sacerdotes, vestidos com suas vestes
  rationale: Mantém o sentido explícito de 'vestidos' sem especificar além do hebraico a natureza exata das vestes.
- source_word: בַּחֲצֹצְרוֹת
  choice: munidos de trombetas
  rationale: חֲצֹצְרוֹת são trombetas cerimoniais; 'munidos de' deixa clara sua ligação com os sacerdotes.
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף
  choice: e os levitas, filhos de Asafe
  rationale: Preserva a designação familiar e corporativa do hebraico.
- source_word: בַּמְצִלְתַּיִם
  choice: com címbalos
  rationale: O termo designa címbalos empregados na música do templo.
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: para louvar Yahweh
  rationale: O infinitivo expressa a finalidade da disposição litúrgica.
- source_word: עַל יְדֵי דָּוִיד
  choice: segundo as instruções de Davi
  rationale: A expressão idiomática, literalmente 'pela mão de Davi', aponta neste contexto para a orientação ou prescrição davídica.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: rei de Israel
  rationale: Tradução direta do título real.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva no texto o nome pessoal da aliança e distingue-o de um título.
- issue: Sentido de עַל יְדֵי דָּוִיד no contexto do culto
  choice: segundo as instruções de Davi
  alternative: pela mão de Davi; por meio de Davi; conforme prescrito por Davi
  rationale: O sentido contextual é o de conformidade com a orientação davídica. A nota conserva a forma concreta do idioma hebraico, sem sugerir a presença física de Davi nessa ocasião.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservam-se os termos cultuais reconhecíveis e a estrutura cerimonial da cena, evitando linguagem excessivamente técnica.
