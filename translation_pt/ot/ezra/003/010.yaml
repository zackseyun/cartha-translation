  to: Quando os construtores lançaram os alicerces do templo de Yahweh, puseram em seus postos os sacerdotes, trajados e com trombetas, e os levitas, filhos de Asafe, com címbalos, para louvar Yahweh segundo as instruções de Davi, rei de Israel.[a]
