base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: pt
  text: Celebraram a Festa das Cabanas, conforme está escrito, e ofereceram, dia após dia, os holocaustos no número prescrito, segundo a norma para cada dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: Festa das Cabanas
  rationale: Traduz o nome da festa de modo claro e corrente, preservando a imagem das habitações temporárias; “Festa dos Tabernáculos” seria uma alternativa tradicional.
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: e ofereceram, dia após dia, os holocaustos
  rationale: O substantivo singular coletivo עֹלַת refere-se às ofertas totalmente queimadas, enquanto יוֹם בְּיוֹם enfatiza sua apresentação diária.
- source_word: בְּמִסְפָּר
  choice: no número prescrito
  rationale: O contexto indica que as ofertas eram apresentadas na quantidade determinada, não meramente contadas.
- source_word: כְּמִשְׁפַּט דְּבַר יוֹם בְּיוֹמוֹ
  choice: segundo a norma para cada dia
  rationale: Expressa de modo natural a ideia de cumprir a regulamentação e a exigência própria de cada dia.
theological_decisions:
- issue: Natureza da observância da festa
  choice: conforme está escrito
  alternative: como está prescrito
  rationale: Mantém a referência explícita ao texto escrito sem identificar além do que o versículo declara qual documento ou passagem estava em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a sequência do hebraico e evita redundância artificial ao representar as duas expressões diárias como “dia após dia” e “para cada dia”.
