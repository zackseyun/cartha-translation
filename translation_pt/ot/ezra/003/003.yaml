source:
  edition: WLC
  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: pt
  text: Eles ergueram o altar sobre os seus alicerces[a], pois estavam tomados de medo por causa dos povos daquelas terras[b]. Sobre ele ofereceram holocaustos a Yahweh, holocaustos de manhã e à tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre as suas bases” ou “no lugar que lhe fora fixado”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pois o medo estava sobre eles, vindo dos povos das terras”; isto é, eles temiam os povos das regiões ao redor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: ergueram
  rationale: O hifil de כון indica aqui instalar ou deixar o altar pronto em seu lugar. “Ergueram” é natural em português para a colocação de um altar e se harmoniza com a menção aos alicerces.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente corrente e preciso de מִזְבֵּחַ em contexto sacrificial.
- source_word: עַל מְכֹנוֹתָיו
  choice: sobre os seus alicerces
  rationale: מְכוֹנוֹתָיו pode designar bases, fundamentos ou o lugar fixado. “Sobre os seus alicerces” mantém a imagem concreta e sugere a reinstalação do altar em sua posição própria, sem eliminar as alternativas lexicais registradas em nota.
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם
  choice: pois estavam tomados de medo
  rationale: A expressão hebraica é literalmente “pois medo estava sobre eles”. A formulação escolhida conserva a ideia de um medo que se apodera deles, mas soa natural em português atual.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: por causa dos povos daquelas terras
  rationale: Depois de uma expressão de temor, מִן pode indicar fonte ou causa. “Por causa de” comunica com clareza a relação causal; o plural “terras” e o demonstrativo preservam a referência aos povos das regiões ao redor.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: Sobre ele ofereceram holocaustos
  rationale: O hifil de עלה com עֹלוֹת é a expressão convencional para oferecer holocaustos. O plural em português mantém o sujeito coletivo/plural do contexto; “sobre ele” deixa explícito que as ofertas eram queimadas no altar.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A transliteração “Yahweh” representa diretamente o nome divino יהוה e preserva sua função como nome próprio no texto.
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: holocaustos de manhã e à tarde
  rationale: A repetição de “holocaustos” reproduz a retomada de עֹלוֹת, enquanto “de manhã e à tarde” expressa de modo natural os dois momentos regulares do sacrifício diário.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa de forma direta, sem substituí-lo por um título e sem introduzir uma forma denominacional tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção idiomática hebraica sobre o medo foi naturalizada no corpo do texto e preservada literalmente em nota. “Holocaustos” mantém o termo bíblico corrente para ofertas inteiramente queimadas.
