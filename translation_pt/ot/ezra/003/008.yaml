  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: pt
  text: No segundo ano depois que chegaram à casa de Deus em Jerusalém, no segundo mês, Zorobabel, filho de Sealtiel, Jesua, filho de Jozadaque, os demais irmãos deles — os sacerdotes e os levitas — e todos os que tinham vindo do cativeiro[a] para Jerusalém começaram a trabalhar e designaram os levitas de vinte anos ou mais para supervisionar o trabalho da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do exílio”.'
    reason: Alternativa lexical legítima para מֵהַשְּׁבִי, que pode ser vertido tanto por “do cativeiro” como por “do exílio”.
lexical_decisions:
- source_word: לְבוֹאָם
  choice: depois que chegaram
  rationale: O infinitivo construto com לְ e sufixo de terceira pessoa do plural tem valor temporal; a formulação é natural em português e preserva a relação temporal.
- source_word: בֵּית הָאֱלֹהִים
  choice: casa de Deus
  rationale: Mantém a expressão concreta e pactual do hebraico sem substituí-la pela interpretação explícita “templo”.
- source_word: הֵחֵלּוּ
  choice: deram início à obra
  rationale: O verbo significa “começar”, mas seu complemento está implícito. Em português, explicitar “à obra” evita uma construção truncada e recupera o referente do fim do versículo.
- source_word: וַיַּעֲמִידוּ
  choice: designaram
  rationale: O hifil de עמד indica colocar alguém numa função; “designaram” comunica adequadamente a nomeação para uma responsabilidade.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos ou mais
  rationale: Expressão corrente e clara em português para o limiar etário indicado pelo hebraico.
- source_word: לְנַצֵּחַ
  choice: para supervisionar
  rationale: Neste contexto, o verbo descreve responsabilidade de supervisão da obra, não direção musical.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: o trabalho da casa de Yahweh
  rationale: “Trabalho” preserva o sentido amplo de מְלָאכָה, enquanto a relação genitiva do hebraico é mantida.
- source_word: אֲחֵיהֶם
  choice: irmãos deles
  rationale: Conserva o substantivo masculino plural do texto, sem determinar além do hebraico se se trata de parentesco ou associação comunitária.
- source_word: מֵהַשְּׁבִי
  choice: do cativeiro
  rationale: Representa de perto o substantivo hebraico, que pode designar a condição ou realidade coletiva do cativeiro; a alternativa “do exílio” é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio e evita convertê-lo silenciosamente em título.
- issue: Natureza da “casa de Deus”
  choice: casa de Deus
  alternative: templo de Deus
  rationale: Embora o referente seja o local do templo, a tradução mantém a formulação hebraica e não torna explícita uma identificação apenas contextual.
translation_notes:
  register: 'Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O longo período hebraico foi dividido em duas frases para clareza, sem alterar a sequência dos acontecimentos. Os nomes seguem formas bíblicas correntes em português: Zorobabel, Sealtiel, Jesua e Jozadaque.'
