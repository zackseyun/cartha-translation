  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּ֨תְּנוּ כֶ֔סֶף לַ/חֹצְבִ֖ים וְ/לֶ/חָרָשִׁ֑ים וּ/מַאֲכָ֨ל וּ/מִשְׁתֶּ֜ה וָ/שֶׁ֗מֶן לַ/צִּֽדֹנִים֙ וְ/לַ/צֹּרִ֔ים לְ/הָבִיא֩ עֲצֵ֨י אֲרָזִ֤ים מִן הַ/לְּבָנוֹן֙ אֶל יָ֣ם יָפ֔וֹא כְּ/רִשְׁי֛וֹן כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרַ֖ס עֲלֵי/הֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: pt
  text: Então deram dinheiro aos cortadores de pedra e aos artesãos[a], e deram comida, bebida e azeite aos sidônios e aos tírios, para que trouxessem madeira de cedro do Líbano até o mar de Jope[b], conforme a autorização que Ciro, rei da Pérsia, lhes havia concedido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “àqueles que trabalhavam a pedra e aos trabalhadores especializados”. O segundo termo hebraico pode designar artesãos de diferentes ofícios.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “até o mar de Jope”; isto é, até o litoral ou porto de Jope.
    reason: lexical_alternative
  - marker: c
    text: Ou “conforme a permissão que Ciro, rei da Pérsia, lhes dera”. A expressão hebraica descreve uma autorização ou concessão real.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Então deram
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão de modo natural em português.
- source_word: כֶסֶף
  choice: dinheiro
  rationale: Embora o termo também possa significar literalmente “prata”, neste contexto de pagamento seu sentido econômico é “dinheiro”.
- source_word: לַחֹצְבִים
  choice: aos cortadores de pedra
  rationale: O particípio de חצב designa trabalhadores que cortam ou extraem pedra; a expressão é clara e adequada ao contexto da construção.
- source_word: וְלֶחָרָשִׁים
  choice: e aos artesãos
  rationale: חָרָשׁ designa um trabalhador habilidoso sem necessariamente especificar seu ofício ou material.
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: comida, bebida e azeite
  rationale: Mantém a enumeração concreta de mantimentos; “azeite” é a forma corrente de designar esse óleo no contexto, sem necessidade de explicitar “de oliva”.
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: aos sidônios e aos tírios
  rationale: Reproduz de modo direto os gentílicos referentes aos habitantes de Sidom e Tiro.
- source_word: לְהָבִיא
  choice: para que trouxessem
  rationale: Expressa naturalmente em português a finalidade do fornecimento dos mantimentos e ajusta a relação sintática com os sidônios e tírios.
- source_word: עֲצֵי אֲרָזִים
  choice: madeira de cedro
  rationale: No contexto de construção, traduz com naturalidade a expressão hebraica, sem determinar que se tratava especificamente de toras já preparadas.
- source_word: מִן הַלְּבָנוֹן
  choice: do Líbano
  rationale: Indica diretamente a origem geográfica da madeira.
- source_word: אֶל יָם יָפוֹא
  choice: até o mar de Jope
  rationale: Preserva de perto a formulação literal hebraica, deixando em nota a interpretação contextual como porto de Jope.
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: conforme a autorização que Ciro, rei da Pérsia, lhes havia concedido
  rationale: Comunica em português natural a autorização régia que recaía sobre eles, sem reproduzir de modo obscuro o uso idiomático de עֲלֵיהֶם.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “deram” esclarece que dinheiro foi destinado aos trabalhadores, enquanto mantimentos foram destinados aos fornecedores fenícios. A ordem das notas acompanha sua ocorrência no texto.
