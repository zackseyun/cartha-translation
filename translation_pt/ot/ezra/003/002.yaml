id: EZR.3.2
reference: Ezra 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּקָם֩ יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וּ/זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ וְ/אֶחָ֔י/ו וַ/יִּבְנ֕וּ אֶת מִזְבַּ֖ח אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/הַעֲל֤וֹת עָלָי/ו֙ עֹל֔וֹת כַּ/כָּת֕וּב בְּ/תוֹרַ֖ת מֹשֶׁ֥ה אִישׁ הָ/אֱלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: pt
  text: Então Jesua, filho de Jozadaque, levantou-se com seus irmãos, os sacerdotes[a], e Zorobabel, filho de Sealtiel, com seus irmãos; e construíram o altar do Deus de Israel para nele oferecer holocaustos, conforme está escrito na Lei de Moisés[b], homem de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus parentes” ou “seus companheiros”. O hebraico diz literalmente “seus irmãos”; a expressão seguinte identifica o grupo de Jesua como “os sacerdotes”.
    reason: lexical_alternative
  - marker: b
    text: “Lei” traduz o hebraico torá, que também pode significar “instrução”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: O verbo קום no encadeamento narrativo assinala o início de uma ação decidida. “Levantou-se” preserva o movimento do hebraico sem reduzi-lo ao simples ato físico de ficar em pé.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: Transliteração portuguesa convencional da forma pós-exílica do nome hebraico, distinguindo-a adequadamente de Josué.
- source_word: וְאֶחָיו
  choice: seus irmãos
  rationale: Preserva o sentido básico de אָח e a forma masculina do texto. No primeiro grupo, a aposição “os sacerdotes” esclarece a relação contextual; o termo também pode designar parentes ou companheiros.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente direto da aposição que identifica o grupo ligado a Jesua.
- source_word: זְרֻבָּבֶל
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: שְׁאַלְתִּיאֵל
  choice: Sealtiel
  rationale: Forma portuguesa tradicional correspondente ao nome hebraico.
- source_word: וַיִּבְנוּ
  choice: construíram
  rationale: Traduz בנה sem acrescentar a ideia explícita de reconstrução, que o verbo hebraico por si só não marca.
- source_word: מִזְבַּח
  choice: o altar
  rationale: Termo português corrente e preciso para o altar sacrificial.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reprodução direta e natural da construção hebraica.
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: para nele oferecer holocaustos
  rationale: Expressa naturalmente o idioma sacrificial do hifil de עלה com עֹלוֹת e mantém explícita a referência ao altar.
- source_word: עֹלוֹת
  choice: holocaustos
  rationale: Termo bíblico português estabelecido para ofertas inteiramente consumidas pelo fogo; não traz aqui o sentido histórico moderno associado ao nome próprio “Holocausto”.
- source_word: כַּכָּתוּב
  choice: conforme está escrito
  rationale: Fórmula portuguesa natural que comunica conformidade com a prescrição escrita.
- source_word: תּוֹרַת מֹשֶׁה
  choice: Lei de Moisés
  rationale: No contexto de uma prescrição sacrificial escrita, “Lei” comunica bem a força normativa de תּוֹרָה, sem excluir seu sentido mais amplo de instrução.
- source_word: אִישׁ הָאֱלֹהִים
  choice: homem de Deus
  rationale: Título hebraico tradicional ligado a Moisés, preservado de modo direto e digno.
theological_decisions:
- issue: Sentido de אחים nos dois grupos representativos
  choice: seus irmãos
  alternative: seus parentes; seus companheiros; seus colegas
  rationale: A tradução conserva o parentesco lexical e a forma masculina do hebraico, sem decidir além do texto se se trata de irmãos literais, parentes ou associados. A nota registra a extensão semântica e explica a identificação sacerdotal do primeiro grupo.
- issue: Sentido de תּוֹרָה em uma referência cultual normativa
  choice: Lei de Moisés
  alternative: instrução de Moisés; Torá de Moisés
  rationale: O contexto destaca uma prescrição sacrificial escrita. “Lei” é natural e reconhecível em português, enquanto a nota preserva o alcance semântico de “instrução”.
- issue: Relação de אִישׁ הָאֱלֹהִים com Moisés
  choice: Lei de Moisés, homem de Deus
  alternative: Lei de Moisés, o homem de Deus
  rationale: A ausência do artigo antes de אִישׁ favorece a reprodução simples “homem de Deus”; a aposição qualifica Moisés sem introduzir uma interpretação adicional.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantêm-se nomes bíblicos consagrados em português, paralelismo narrativo próximo ao hebraico e terminologia cultual reconhecível. As notas preservam ambiguidades lexicais reais sem sobrecarregar o texto principal.
