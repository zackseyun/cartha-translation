base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: pt
  text: 'E eles responderam[a] com louvores e ações de graças a Yahweh: “Pois ele é bom, pois seu amor leal para com Israel dura para sempre[b].” E todo o povo deu um grande brado em louvor a Yahweh, porque a casa de Yahweh havia sido fundada[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “responderam”. O verbo hebraico pode indicar uma resposta, provavelmente em louvor antifonal ou responsivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois seu amor leal dura para sempre sobre Israel”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “porque a casa de Yahweh havia sido fundada”; neste contexto, a expressão se refere ao lançamento dos alicerces do templo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: cantavam em resposta
  rationale: O verbo ענה significa literalmente responder; neste contexto litúrgico, provavelmente descreve canto responsivo ou antifonal. A formulação explicita o caráter musical sugerido pelo contexto sem apagar a ideia de resposta.
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: louvando e dando graças
  rationale: 'A tradução verbal é natural em português e preserva as duas ações distintas expressas no hebraico: louvor e ação de graças.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: כִּי טוֹב
  choice: Pois ele é bom
  rationale: Reproduz de modo idiomático a fórmula confessional hebraica, suprindo o pronome e o verbo implícitos.
- source_word: חַסְדּוֹ
  choice: seu amor leal
  rationale: חסד reúne as ideias de amor, fidelidade e compromisso duradouro. “Amor leal” preserva essa amplitude em linguagem atual, sem restringir o termo apenas a misericórdia.
- source_word: עַל יִשְׂרָאֵל
  choice: para com Israel
  rationale: Expressa de maneira natural a orientação desse amor em relação a Israel, preservando a função da preposição עַל.
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: soltou um grande brado
  rationale: O hebraico emprega verbo e substantivo da mesma raiz para intensificar a aclamação. A expressão portuguesa comunica essa força sem recorrer a uma repetição pouco natural.
- source_word: בְּהַלֵּל לַיהוָה
  choice: em louvor a Yahweh
  rationale: Mantém o valor modal da preposição e deixa claro que o brado era uma expressão de louvor dirigida a Yahweh.
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: porque a casa de Yahweh havia sido fundada
  rationale: Preserva de perto o hofal de יסד, “ser fundada”, e a construção causal com עַל. O contexto mostra que se trata do lançamento dos alicerces do templo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio da aliança. “Yahweh” o representa diretamente e o distingue do título “Senhor”.
- issue: Sentido de חסד na fórmula de louvor
  choice: amor leal
  alternative: misericórdia; amor da aliança; bondade
  rationale: A escolha preserva conjuntamente afeto, fidelidade e compromisso constante, sem reduzir o campo semântico a uma única dimensão teológica.
- issue: Alcance de עַל יִשְׂרָאֵל em relação a לְעוֹלָם
  choice: seu amor leal para com Israel dura para sempre
  alternative: seu amor leal dura para sempre sobre Israel
  rationale: A ordem adotada é natural em português e associa Israel ao amor de Yahweh, embora a sintaxe hebraica permita conservar uma formulação mais próxima de “para sempre... sobre Israel”.
- issue: Sentido de הוּסַד בֵּית יְהוָה
  choice: a casa de Yahweh havia sido fundada
  alternative: os alicerces da casa de Yahweh haviam sido lançados
  rationale: A tradução principal acompanha a forma verbal do hebraico, enquanto a alternativa explicita o acontecimento concreto indicado pelo contexto da reconstrução do templo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o paralelismo litúrgico, evita arcaísmos e conserva o nome Yahweh. A repetição hebraica intensiva do brado foi vertida de modo natural, e ambiguidades relevantes foram registradas em notas.
