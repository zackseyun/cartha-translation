  naturalness: «Deram um grande brado» é mais idiomático e solene que «soltou um grande brado», e preserva bem a intensidade da construção hebraica. «Com louvores e ações de graças» é natural, mantém os dois elementos cultuais e evita atribuir ao verbo, sem ressalva, o sentido específico de cantar.
  terminology: «Yahweh» reproduz de modo consistente o nome divino. «Amor leal» é uma boa representação moderna de חַסְדּוֹ. «Casa de Yahweh» preserva o termo hebraico; a nota contextual esclarece, sem substituir no texto a referência à fundação da casa pela formulação mais explícita sobre seus alicerces.
