  text: וַ/יַּעֲמֹ֣ד יֵשׁ֡וּעַ בָּנָ֣י/ו וְ֠/אֶחָי/ו קַדְמִיאֵ֨ל וּ/בָנָ֤י/ו בְּנֵֽי יְהוּדָה֙ כְּ/אֶחָ֔ד לְ/נַצֵּ֛חַ עַל עֹשֵׂ֥ה הַ/מְּלָאכָ֖ה בְּ/בֵ֣ית הָ/אֱלֹהִ֑ים בְּנֵי֙ חֵֽנָדָ֔ד בְּנֵי/הֶ֥ם וַ/אֲחֵי/הֶ֖ם הַ/לְוִיִּֽם־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: pt
  text: Então Jesua, seus filhos e seus irmãos, e Cadmiel e seus filhos, os filhos de Judá[a], posicionaram-se juntos, como um só, para supervisionar os que faziam a obra na casa de Deus, juntamente com os filhos de Henadade, os filhos e os irmãos deles, os levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Judá”. Algumas versões antigas e traduções modernas trazem “os filhos de Hodavias”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: posicionaram-se
  rationale: O verbo עמד significa literalmente “ficar de pé” ou “tomar posição”. Neste contexto, indica que os levitas assumiram seu posto de supervisão; “posicionaram-se” preserva essa imagem e soa natural em português.
- source_word: יֵשׁוּעַ
  choice: Jesua
  rationale: O nome próprio é transliterado segundo uma forma convencional e reconhecível em português para o personagem de Esdras.
- source_word: בָּנָיו וְאֶחָיו
  choice: seus filhos e seus irmãos
  rationale: Mantém os termos masculinos de parentesco e a estrutura familiar explícita do hebraico.
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: e Cadmiel e seus filhos
  rationale: Preserva a coordenação simples e o paralelismo com o grupo familiar de Jesua.
- source_word: בְּנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Traduz diretamente o texto massorético fornecido. A leitura alternativa “os filhos de Hodavias” é registrada em nota.
- source_word: כְּאֶחָד
  choice: juntos, como um só
  rationale: Expressa tanto a ação conjunta quanto a unidade enfatizada pela expressão hebraica.
- source_word: לְנַצֵּחַ
  choice: para supervisionar
  rationale: Neste contexto de construção, o piel de נצח indica direção ou supervisão dos trabalhadores, não liderança musical.
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: os que faziam a obra
  rationale: O particípio com artigo tem sentido coletivo. A formulação preserva sua nuance verbal sem especificar além do texto.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: na casa de Deus
  rationale: Mantém a expressão bíblica referente ao templo em linguagem digna, clara e corrente.
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: juntamente com os filhos de Henadade, os filhos e os irmãos deles, os levitas
  rationale: Apresenta o grupo levítico adicional como participante da supervisão e conserva “os levitas” como identificação final. “Deles” esclarece a referência do plural hebraico sem eliminar a estrutura da lista.
theological_decisions:
- issue: Incerteza textual ou interpretativa em בְּנֵי יְהוּדָה
  choice: Traduzir o Texto Massorético diretamente como “os filhos de Judá”.
  alternative: “os filhos de Hodavias”
  rationale: A fonte fornecida, WLC, traz “Judá”. Como versões antigas e algumas traduções modernas refletem outra leitura, a variante é preservada em nota, sem substituir silenciosamente o texto-base.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi levemente organizada para tornar inteligível a longa enumeração hebraica, sem apagar sua estrutura nem resolver a variante textual.
