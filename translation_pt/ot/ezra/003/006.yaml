base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: pt
  text: A partir do primeiro dia do sétimo mês, começaram a oferecer holocaustos a Yahweh, embora os alicerces do templo de Yahweh ainda não tivessem sido lançados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e os alicerces do templo de Yahweh ainda não tinham sido lançados”. A conjunção hebraica pode ser traduzida simplesmente como “e” ou, pelo contexto, em sentido concessivo como “embora”; os sacrifícios começaram antes do lançamento dos alicerces do templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד
  choice: Desde o primeiro dia
  rationale: A preposição מִן indica o ponto inicial no tempo. “Desde” preserva essa nuance melhor que a simples indicação pontual “no primeiro dia”.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: do sétimo mês
  rationale: Expressa de maneira direta e natural a relação entre o primeiro dia e o mês ao qual ele pertence.
- source_word: הֵחֵלּוּ
  choice: começaram
  rationale: O hifil de חלל, nesta construção, significa “começar”; a forma portuguesa é clara e corrente.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: a oferecer holocaustos
  rationale: No contexto sacrificial, o infinitivo de עלה com עֹלוֹת forma uma expressão idiomática para oferecer sacrifícios inteiramente queimados. “Holocaustos” é o termo bíblico tradicional e ainda inteligível em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário das ofertas, e o tetragrama é transliterado como “Yahweh”, preservando o nome divino.
- source_word: וְהֵיכַל יְהוָה
  choice: embora os alicerces do templo de Yahweh
  rationale: הֵיכָל designa aqui o templo. A conjunção וְ admite valor concessivo no contexto; “embora” explicita naturalmente que os sacrifícios começaram antes da construção da base do templo.
- source_word: לֹא יֻסָּד
  choice: ainda não tivessem sido lançados
  rationale: O passivo de יסד refere-se ao lançamento dos alicerces. O plural “alicerces” permite uma formulação idiomática em português, e “ainda” torna clara a relação temporal implícita.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Relação entre o início dos sacrifícios e a ausência dos alicerces
  choice: embora
  alternative: e; mas
  rationale: A conjunção hebraica וְ pode ser simples ou adversativo-concessiva. O contexto sugere que os sacrifícios começaram apesar de os alicerces ainda não terem sido lançados, mas a nota registra a alternativa mais formal para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Holocaustos” conserva a terminologia sacrificial bíblica; “alicerces” e “lançados” formam uma expressão natural. O marcador de nota aparece no texto principal.
