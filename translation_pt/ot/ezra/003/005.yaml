base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: pt
  text: Depois disso, ofereceram o holocausto regular[a], as ofertas das luas novas[b] e de todas as festividades determinadas por Yahweh e consagradas[c], bem como as ofertas voluntárias de todos os que se dispunham a oferecê-las a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o holocausto contínuo» ou «o holocausto diário».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «luas novas», isto é, as celebrações sagradas mensais realizadas no início de cada mês.'
    reason: cultural_note
  - marker: c
    text: Ou «todos os tempos determinados de Yahweh, os consagrados» ou «todas as festas fixadas por Yahweh, as santas».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressa com naturalidade a transição temporal e a sequência em relação aos sacrifícios mencionados anteriormente.
- source_word: עֹלַת תָּמִיד
  choice: o holocausto regular
  rationale: עֹלָה designa a oferta totalmente queimada, tradicionalmente chamada de holocausto; תָּמִיד indica sua recorrência regular ou contínua sem exigir que se explicite aqui «diário».
- source_word: וְלֶחֳדָשִׁים
  choice: as ofertas das luas novas
  rationale: Neste contexto cultual, חֹדֶשׁ se refere às observâncias mensais realizadas no início de cada mês. «Ofertas» é suprido pelo contexto e pela estrutura elíptica hebraica.
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה
  choice: de todas as festas estabelecidas por Yahweh
  rationale: מוֹעֵד designa tempos fixados para celebração religiosa. «Festas estabelecidas» comunica tanto o caráter festivo quanto sua determinação divina.
- source_word: הַמְקֻדָּשִׁים
  choice: e consagradas
  rationale: O particípio passivo indica que essas festas foram separadas como sagradas. A coordenação evita sugerir que a oração restrinja apenas parte das festas de Yahweh.
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: bem como as ofertas de todo aquele que apresentava voluntariamente uma oferta
  rationale: Preserva a ideia de disposição espontânea expressa pelo particípio hitpael e evita em português a repetição pouco natural «oferecia uma oferta voluntária».
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יְהוָה, preservando sua condição de nome próprio no texto-fonte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. «Yahweh» o apresenta como nome próprio e não o substitui por um título.
- issue: Caráter voluntário da oferta
  choice: aquele que apresentava voluntariamente uma oferta
  alternative: aquele que apresentava uma oferta voluntária
  rationale: A formulação mantém a iniciativa espontânea do ofertante sem transformar a expressão em uma categoria técnica mais rígida do que o contexto exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O verbo «ofereceram» e o substantivo «ofertas» foram supridos para tornar explícita a elipse do hebraico à luz do contexto imediato. Mantém-se «holocausto» por ser o termo bíblico corrente para a oferta inteiramente queimada, acompanhado de nota que preserva a nuance de תָּמִיד.
