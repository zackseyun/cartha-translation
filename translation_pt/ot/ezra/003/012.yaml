revisions:
- from: Mas muitos dos sacerdotes, dos levitas e dos chefes das casas paternas[a] — os idosos que tinham visto a primeira Casa[b] — choravam em alta voz quando esta Casa foi fundada diante dos seus olhos[c], enquanto muitos erguiam a voz com gritos de alegria.
  to: Mas muitos dos sacerdotes, dos levitas e dos chefes das casas paternas[a] — os idosos que tinham visto a primeira Casa[b] — choravam em alta voz quando se lançavam os alicerces desta Casa[c] diante dos seus olhos, enquanto muitos erguiam a voz com gritos de alegria.
  rationale: A revisão substitui “quando esta Casa foi fundada” por “quando se lançavam os alicerces desta Casa”, que reflete com maior precisão o sentido de יסד neste contexto e harmoniza a formulação principal com a ação descrita no versículo anterior. A nota lexical correspondente conserva a alternativa mais ampla. Os demais elementos foram mantidos por serem fiéis ao hebraico e naturais em português.
