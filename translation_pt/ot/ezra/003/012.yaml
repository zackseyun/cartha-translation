base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: pt
  text: Mas muitos dos sacerdotes, dos levitas e dos chefes das casas paternas[a] — os idosos que tinham visto a primeira Casa[b] — choravam em alta voz quando se lançavam os alicerces desta Casa[c] diante dos seus olhos, enquanto muitos erguiam a voz com gritos de alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chefes das casas paternas” eram líderes de grupos familiares ancestrais ou clãs.
    reason: cultural_note
  - marker: b
    text: Ou “a Casa anterior”. O hebraico diz literalmente “a primeira Casa” e se refere ao templo anterior.
    reason: lexical_alternative
  - marker: c
    text: Ou “quando esta Casa foi fundada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים
  choice: Mas muitos
  rationale: A conjunção pode significar simplesmente “e”, mas “mas” expressa com naturalidade o contraste com os gritos alegres do versículo anterior.
- source_word: מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: dos sacerdotes, dos levitas e dos chefes das casas paternas
  rationale: 'A preposição מִן tem sentido partitivo: “muitos dentre”. “Casas paternas” preserva a estrutura social de grupos familiares ancestrais, com nota explicativa.'
- source_word: הַזְּקֵנִים
  choice: os idosos
  rationale: Neste contexto, o termo destaca a idade dos que ainda podiam lembrar-se da Casa anterior, e não necessariamente um cargo oficial de ancião.
- source_word: אֲשֶׁר רָאוּ אֶת הַבַּיִת הָרִאשׁוֹן
  choice: que tinham visto a primeira Casa
  rationale: O mais-que-perfeito situa essa visão antes da cena narrada. “Casa” mantém o termo hebraico para o templo, e “primeira” preserva a expressão literal.
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: quando esta Casa foi fundada
  rationale: O infinitivo de יסד descreve o ato de fundar ou lançar os alicerces. A formulação escolhida é idiomática e mantém essa amplitude, enquanto a alternativa mais explícita consta em nota.
- source_word: בְּעֵינֵיהֶם
  choice: diante dos seus olhos
  rationale: Preserva a imagem hebraica de testemunho visual direto.
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: choravam em alta voz
  rationale: O particípio indica ação contínua, e a expressão conserva o elemento vocal explícito de בְּקוֹל גָּדוֹל.
- source_word: וְרַבִּים בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: enquanto muitos erguiam a voz com gritos de alegria
  rationale: “Enquanto” comunica simultaneidade e contraste sem acrescentar explicitamente “outros”. O plural “gritos” soa natural em português para a aclamação coletiva e mantém tanto תְּרוּעָה quanto שִׂמְחָה.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Casa” recebe inicial maiúscula para deixar claro seu uso como designação do templo sem substituir o termo hebraico por uma explicação. Os travessões delimitam o aposto referente aos idosos e evitam ambiguidade sintática.
