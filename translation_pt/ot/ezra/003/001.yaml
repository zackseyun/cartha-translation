  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בֶּ/עָרִ֑ים וַ/יֵּאָסְפ֥וּ הָ/עָ֛ם כְּ/אִ֥ישׁ אֶחָ֖ד אֶל יְרוּשָׁלִָֽםס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: pt
  text: Quando chegou o sétimo mês, e os filhos de Israel[a] estavam nas cidades, o povo se reuniu em Jerusalém como um só homem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Em hebraico, literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Expressão idiomática hebraica que indica ação unida ou pleno acordo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: chegou
  rationale: Com uma expressão de tempo como sujeito, נגע tem aqui o sentido idiomático de o mês chegar. “Chegou” é natural em português e mantém a imagem verbal do hebraico sem explicitação desnecessária.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: o sétimo mês
  rationale: Tradução direta da expressão temporal, sem substituir a designação hebraica por um nome posterior de mês.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: e os filhos de Israel
  rationale: Mantém a forma masculina e genealógica explícita do hebraico. A alternativa idiomática “os israelitas” é registrada em nota.
- source_word: בֶּעָרִים
  choice: estavam nas cidades
  rationale: O hebraico apresenta uma construção elíptica; “estavam” explicita em português a cópula implícita. Não se acrescenta “suas”, ausente do texto-fonte.
- source_word: וַיֵּאָסְפוּ
  choice: se reuniu
  rationale: O nifal de אסף indica reunião ou ajuntamento. A concordância no singular com “o povo” é idiomática em português.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente coletivo direto de העם, referente à comunidade reunida.
- source_word: כְּאִישׁ אֶחָד
  choice: como um só homem
  rationale: Preserva a expressão hebraica concreta e masculina, que comunica ação unida. “Só” torna clara em português a unidade indicada por אֶחָד.
- source_word: אֶל יְרוּשָׁלִָם
  choice: em Jerusalém
  rationale: Embora אֶל normalmente marque direção, com o verbo de reunir-se o português corrente prefere “reunir-se em” para indicar o ponto de convergência. O sentido de movimento para Jerusalém permanece implícito.
theological_decisions:
- issue: Linguagem corporativa masculina em בְּנֵי יִשְׂרָאֵל e כְּאִישׁ אֶחָד
  choice: Manter “filhos de Israel” e “como um só homem” no texto principal
  alternative: “israelitas” e “como um só” ou “em perfeita união”
  rationale: As duas expressões masculinas estão explicitamente presentes no hebraico e funcionam de modo corporativo. Mantê-las dá transparência ao texto-fonte sem impor linguagem neutra nem uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva “filhos de Israel” e a imagem “como um só homem”, mas usa a construção portuguesa natural “o povo se reuniu em Jerusalém”. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
