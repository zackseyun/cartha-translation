  text: מִ/בְּנֵ֣י שְׁכַנְיָ֔ה מִ/בְּנֵ֥י פַרְעֹ֖שׁ זְכַרְיָ֑ה וְ/עִמּ֛/וֹ הִתְיַחֵ֥שׂ לִ/זְכָרִ֖ים מֵאָ֥ה וַ/חֲמִשִּֽׁיםס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/003.yaml
  text: 'From the sons of Shecaniah[a], from the sons of Parosh: Zechariah, and with him were enrolled by genealogy 150 males.'
translation:
  language: pt
  text: 'Dos filhos de Secanias, dos filhos de Parós: Zacarias; com ele foram registrados genealogicamente[a] 150 indivíduos do sexo masculino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram inscritos no registro genealógico”. O verbo hebraico se refere ao arrolamento ou cômputo formal segundo a genealogia.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: Dos filhos de
  rationale: A combinação de מִן com בְּנֵי introduz grupos familiares dentro da lista; “dos filhos de” preserva de modo natural a estrutura genealógica concisa.
- source_word: שְׁכַנְיָה
  choice: Secanias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: פַרְעֹשׁ
  choice: Parós
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas do nome de família.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: וְעִמּוֹ
  choice: com ele
  rationale: Preserva a associação direta entre Zacarias e os demais integrantes do registro, sem ampliar o sentido.
- source_word: הִתְיַחֵשׂ
  choice: foram registrados genealogicamente
  rationale: O hitpael de יחס indica inscrição ou arrolamento formal segundo a genealogia, e não apenas descendência biológica.
- source_word: לִזְכָרִים
  choice: indivíduos do sexo masculino
  rationale: O hebraico especifica o sexo, não necessariamente a idade adulta; esta formulação evita traduzir de modo impreciso por “homens”.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: '150'
  rationale: O numeral mantém a contagem exata e favorece a leitura de uma lista censitária.
theological_decisions: []
