  text: וָ/אֶשְׁקֲלָ֨/ה עַל יָדָ֜/ם כֶּ֗סֶף כִּכָּרִים֙ שֵֽׁשׁ מֵא֣וֹת וַ/חֲמִשִּׁ֔ים וּ/כְלֵי כֶ֥סֶף מֵאָ֖ה לְ/כִכָּרִ֑ים זָהָ֖ב מֵאָ֥ה כִכָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/026.yaml
  text: And I weighed out into their hands six hundred and fifty talents of silver[a], and one hundred talents worth of silver vessels, and one hundred talents of gold.
translation:
  language: pt
  text: E pesei e entreguei a eles seiscentos e cinquenta talentos de prata, utensílios de prata no valor de cem talentos[a] e cem talentos de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é elíptico neste ponto. O sentido provável é que os utensílios de prata, em conjunto, correspondiam a cem talentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֲלָה
  choice: pesei e entreguei
  rationale: O verbo descreve a pesagem dos bens no ato de confiá-los aos responsáveis; a expressão explicita naturalmente em português tanto a medição quanto a transferência indicada pelo contexto.
- source_word: עַל יָדָם
  choice: a eles
  rationale: O idioma hebraico, literalmente relacionado às mãos, indica entrega à guarda de alguém. Em português corrente, «entreguei a eles» comunica esse sentido sem artificialidade.
- source_word: כֶּסֶף
  choice: prata
  rationale: O contexto trata de metal precioso pesado, não de moeda cunhada.
- source_word: כִּכָּרִים
  choice: talentos
  rationale: É a designação tradicional e reconhecível da grande unidade antiga de peso.
- source_word: שֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: seiscentos e cinquenta
  rationale: Tradução direta do numeral que quantifica os talentos de prata.
- source_word: וּכְלֵי כֶסֶף
  choice: utensílios de prata
  rationale: כְּלִי é um termo amplo para objetos, recipientes ou utensílios; «utensílios» é natural em um inventário de bens do templo.
- source_word: מֵאָה לְכִכָּרִים
  choice: no valor de cem talentos
  rationale: A construção é elíptica, mas neste inventário a leitura mais plausível é que os utensílios de prata totalizavam cem talentos em peso ou valor. A nota preserva a dificuldade textual.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto do nome do metal precioso.
- source_word: מֵאָה כִכָּר
  choice: cem talentos
  rationale: Tradução direta do numeral e da unidade de peso referentes ao ouro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor comum. A formulação evita sugerir que havia exatamente cem utensílios, pois o hebraico provavelmente indica o peso ou valor total deles.
