  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: pt
  text: No décimo segundo dia do primeiro mês, partimos do rio Aava para ir a Jerusalém. A mão do nosso Deus estava sobre nós, e ele nos livrou da mão do inimigo e de quem armava emboscadas pelo caminho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e das emboscadas pelo caminho”. O particípio hebraico pode indicar quem fica à espreita ou, por extensão, o perigo da emboscada.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: partimos
  rationale: No contexto de viagem, נסע indica levantar acampamento e pôr-se a caminho. “Partimos” expressa isso de modo natural e digno em português.
- source_word: מִנְּהַר אֲהֲוָא
  choice: do rio Aava
  rationale: נָהָר significa “rio”; o topônimo é transliterado na forma portuguesa tradicional e legível “Aava”.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: No décimo segundo dia do primeiro mês
  rationale: O hebraico deixa “dia” implícito; o termo é explicitado em português para clareza.
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: para ir a Jerusalém
  rationale: O infinitivo expressa a finalidade da partida; “para ir” reproduz diretamente essa relação.
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: A mão do nosso Deus estava sobre nós
  rationale: Mantém a imagem hebraica recorrente da mão de Deus como expressão de sua atuação favorável e protetora.
- source_word: וַיַּצִּילֵנוּ
  choice: e ele nos livrou
  rationale: נצל descreve o resgate de um perigo; “livrou” é corrente, claro e apropriado ao registro narrativo.
- source_word: מִכַּף אוֹיֵב
  choice: da mão do inimigo
  rationale: כַּף denota literalmente a mão e, por extensão, poder ou domínio. A tradução literal preserva o contraste literário com “a mão do nosso Deus”.
- source_word: וְאוֹרֵב
  choice: e de quem armava emboscadas
  rationale: O particípio singular pode designar a pessoa que fica à espreita. A formulação portuguesa mantém esse valor pessoal sem a rigidez de “emboscador”.
- source_word: עַל הַדָּרֶךְ
  choice: pelo caminho
  rationale: A expressão localiza a ameaça na rota da viagem e soa natural em português.
theological_decisions:
- issue: Linguagem antropomórfica para a proteção divina
  choice: Preservar “A mão do nosso Deus estava sobre nós”
  alternative: Nosso Deus nos protegeu
  rationale: A imagem da mão de Deus é explícita no hebraico e constitui um motivo literário e teológico recorrente em Esdras–Neemias. Mantê-la conserva a força do texto sem impor uma interpretação adicional.
- issue: Paralelo entre a mão de Deus e a mão do inimigo
  choice: Manter “mão” nas duas expressões
  alternative: Traduzir מִכַּף אוֹיֵב como “do poder do inimigo”
  rationale: A repetição estabelece um contraste significativo entre a atuação protetora de Deus e o poder hostil do inimigo; o português permite conservar esse paralelo com clareza.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A ordem temporal foi trazida para o início da frase. Preservaram-se as imagens concretas do hebraico e a ambiguidade do particípio final foi registrada em nota.
