  text: הַ֠/בָּאִים מֵֽ/הַ/שְּׁבִ֨י בְנֵֽי הַ/גּוֹלָ֜ה הִקְרִ֥יבוּ עֹל֣וֹת לֵ/אלֹהֵ֣י יִשְׂרָאֵ֗ל פָּרִ֨ים שְׁנֵים עָשָׂ֤ר עַל כָּל יִשְׂרָאֵל֙ אֵילִ֣ים תִּשְׁעִ֣ים וְ/שִׁשָּׁ֗ה כְּבָשִׂים֙ שִׁבְעִ֣ים וְ/שִׁבְעָ֔ה צְפִירֵ֥י חַטָּ֖את שְׁנֵ֣ים עָשָׂ֑ר הַ/כֹּ֖ל עוֹלָ֥ה לַ/יהוָֽה־׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: pt
  text: 'Os que tinham vindo do cativeiro, os exilados[a], ofereceram holocaustos ao Deus de Israel: doze novilhos por todo o Israel[b], noventa e seis carneiros, setenta e sete cordeiros e doze bodes como oferta pelo pecado. Tudo isso foi holocausto para Yahweh.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos do exílio”, expressão que se refere aos exilados que retornaram.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “em favor de todo o Israel”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico diz: “Tudo isso foi holocausto para Yahweh”, embora o versículo também mencione bodes como oferta pelo pecado. A formulação do texto-fonte foi mantida.'
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: Os que tinham vindo do cativeiro
  rationale: O particípio substantivado identifica o grupo já chegado no contexto narrativo; o mais-que-perfeito composto expressa isso naturalmente. “Cativeiro” preserva o sentido concreto de שְׁבִי.
- source_word: בְנֵי הַגּוֹלָה
  choice: os exilados
  rationale: A expressão hebraica literal, “filhos do exílio”, é idiomática. “Os exilados” comunica com clareza a identidade do grupo sem sugerir descendência biológica; a forma literal é registrada em nota.
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: ofereceram holocaustos
  rationale: Em contexto sacrificial, הִקְרִיבוּ significa “ofereceram”, e עֹלוֹת designa sacrifícios integralmente queimados. “Holocaustos” é o termo bíblico português consagrado e conciso.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: ao Deus de Israel
  rationale: A preposição ל marca aqui o destinatário da oferta; “ao Deus de Israel” é fiel e natural.
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: doze novilhos por todo o Israel
  rationale: פָּרִים refere-se a bovinos machos destinados ao sacrifício; “novilhos” é corrente nesse contexto. עַל pode indicar referência ou representação, preservada de modo conciso por “por”, com a alternativa explicitada em nota.
- source_word: אֵילִים תִּשְׁעִים וְשִׁשָּׁה
  choice: noventa e seis carneiros
  rationale: Tradução direta do substantivo sacrificial e do numeral.
- source_word: כְּבָשִׂים שִׁבְעִים וְשִׁבְעָה
  choice: setenta e sete cordeiros
  rationale: כְּבָשִׂים normalmente designa cordeiros em listas de sacrifícios; a forma por extenso se ajusta ao registro literário.
- source_word: צְפִירֵי חַטָּאת שְׁנֵים עָשָׂר
  choice: doze bodes como oferta pelo pecado
  rationale: צְפִירֵי especifica caprinos machos, e חַטָּאת nomeia aqui a categoria sacrificial. A formulação torna clara a função sem acrescentar interpretação.
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: Tudo isso foi holocausto para Yahweh
  rationale: A tradução mantém a declaração abrangente do hebraico, inclusive sua tensão com a oferta pelo pecado mencionada imediatamente antes. O singular “holocausto” acompanha o substantivo coletivo singular עוֹלָה.
- source_word: יהוה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome pessoal divino expresso pelo Tetragrama.
theological_decisions:
- issue: Representação de todo o Israel
  choice: por todo o Israel
  alternative: em favor de todo o Israel
  rationale: A preposição עַל admite uma força representativa ou benefactiva no contexto sacrificial. A redação principal conserva essa abertura de maneira breve, e a nota explicita a alternativa.
- issue: Nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Tensão entre a oferta pelo pecado e a declaração final de que tudo foi holocausto
  choice: Preservar literalmente o alcance da declaração final
  alternative: Restringir “tudo” apenas aos animais anteriormente destinados a holocaustos
  rationale: O hebraico contém tanto a referência aos bodes como oferta pelo pecado quanto o resumo abrangente. A tradução não harmoniza nem restringe silenciosamente o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega terminologia sacrificial bíblica estabelecida (“holocausto”, “oferta pelo pecado”), evita construções excessivamente literais e conserva em notas os idiomatismos e ambiguidades relevantes.
