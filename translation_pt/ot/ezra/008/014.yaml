  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: pt
  text: 'E dos filhos de Bigvai: Utai e Zabude[b]; e com ele, setenta homens[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “com ele”, no singular, embora algumas traduções empreguem “com eles” por terem sido mencionados dois nomes.
    reason: lexical_alternative
  - marker: b
    text: Algumas tradições textuais e versões antigas apresentam aqui outro nome; o Texto Massorético traz “Zabude”.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: E dos filhos de
  rationale: Mantém de forma direta a estrutura genealógica da lista; aqui, “filhos” também pode abranger descendentes ou membros do clã.
- source_word: בִגְוַי
  choice: Bigvai
  rationale: Transliteração do nome próprio segundo uma forma corrente em português.
- source_word: עוּתַי
  choice: Utai
  rationale: Transliteração natural do nome próprio para leitores de língua portuguesa.
- source_word: ו/זבוד
  choice: e Zabude
  rationale: Segue a leitura do Texto Massorético e adapta o nome à forma portuguesa, mantendo também a conjunção.
- source_word: וְ/עִמּ/וֹ
  choice: e com ele
  rationale: Preserva o sufixo hebraico masculino singular, sem harmonizá-lo silenciosamente com os dois nomes anteriores.
- source_word: שִׁבְעִים
  choice: setenta
  rationale: Equivalente direto do numeral cardinal hebraico.
- source_word: הַ/זְּכָרִים
  choice: homens
  rationale: No contexto de uma relação de viajantes, “homens” comunica naturalmente que se trata de pessoas do sexo masculino; “machos” seria pouco digno e soaria zoológico no português atual.
