  text: וּ/מִן הַ/נְּתִינִ֗ים שֶׁ/נָּתַ֨ן דָּוִ֤יד וְ/הַ/שָּׂרִים֙ לַ/עֲבֹדַ֣ת הַ/לְוִיִּ֔ם נְתִינִ֖ים מָאתַ֣יִם וְ/עֶשְׂרִ֑ים כֻּלָּ֖/ם נִקְּב֥וּ בְ/שֵׁמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: pt
  text: E, dentre os servidores do templo que Davi e os líderes tinham designado para o serviço dos levitas[a], havia 220 servidores do templo; todos eles foram registrados por nome[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa נְתִינִים (netinim), termo técnico para uma classe de servidores do templo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «todos eles foram identificados pelo nome».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: servidores do templo
  rationale: Traduz de modo claro a função dessa classe reconhecida ligada ao serviço do templo, evitando o termo técnico opaco «netineus».
- source_word: שֶׁנָּתַן
  choice: haviam designado
  rationale: Embora o verbo signifique literalmente «dar», neste contexto administrativo indica que Davi e os líderes destinaram essas pessoas a uma função específica.
- source_word: וְהַשָּׂרִים
  choice: os líderes
  rationale: Expressa naturalmente a posição de autoridade indicada pelo hebraico, sem o sentido monárquico que «príncipes» pode sugerir em português.
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: para o serviço dos levitas
  rationale: Preserva a formulação hebraica e sua possível abrangência, sem definir excessivamente se serviam aos levitas ou os auxiliavam no trabalho.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: Mantém a quantidade exata em formato numérico de leitura imediata.
- source_word: כֻּלָּם
  choice: todos
  rationale: Reproduz a inclusão enfática de cada integrante do grupo.
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: foram identificados pelo nome
  rationale: Comunica a identificação nominal explícita sugerida pela expressão hebraica, preservando em nota a possibilidade de referência a um registro ou lista.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura coordenada preserva a continuidade do contexto; «vieram» é suprido pelo fluxo da lista no trecho, enquanto o hebraico apresenta a categoria e o total de forma elíptica.
