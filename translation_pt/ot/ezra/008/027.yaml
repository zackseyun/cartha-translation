  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: pt
  text: e vinte tigelas de ouro, no valor de mil dáricos[a], e dois recipientes de bronze fino e reluzente[b], preciosos como o ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vinte tigelas de ouro que valiam, ao todo, mil dáricos”. O hebraico pode indicar o valor total das tigelas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dois recipientes de bom bronze polido”. A rara expressão que descreve o bronze provavelmente se refere à sua qualidade superior e ao seu acabamento brilhante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: tigelas
  rationale: O substantivo designa recipientes em forma de tigela; “tigelas” é claro, natural e apropriado ao contexto de um inventário do templo.
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: no valor de mil dáricos
  rationale: אֲדַרְכֹנִים refere-se aos dáricos persas, e a preposição לְ provavelmente introduz aqui a avaliação monetária. A formulação conserva o termo histórico e expressa o sentido com naturalidade.
- source_word: וּכְלֵי
  choice: e dois recipientes
  rationale: כְּלִי é um termo amplo para objeto, utensílio ou recipiente. “Recipientes” se ajusta ao inventário e evita linguagem excessivamente técnica.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze; para recipientes trabalhados neste contexto antigo, “bronze” é a opção mais provável e idiomática.
- source_word: מֻצְהָב טוֹבָה
  choice: fino e reluzente
  rationale: A expressão rara parece descrever bronze de qualidade superior e aparência brilhante. A tradução comunica tanto a excelência do material ou trabalho quanto seu brilho, sem afirmar que os recipientes fossem revestidos de ouro.
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: preciosos como o ouro
  rationale: חֲמוּדֹת exprime algo desejável ou valioso, e כַּזָּהָב estabelece uma comparação explícita com o ouro.
