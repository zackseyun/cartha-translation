source:
  edition: WLC
  text: וַֽ/יִּתְּנ֣וּ אֶת דָּתֵ֣י הַ/מֶּ֗לֶךְ לַ/אֲחַשְׁדַּרְפְּנֵי֙ הַ/מֶּ֔לֶךְ וּ/פַחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר וְ/נִשְּׂא֥וּ אֶת הָ/עָ֖ם וְ/אֶת בֵּֽית הָ/אֱלֹהִֽים׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: pt
  text: Eles entregaram os decretos do rei aos sátrapas do rei e aos governadores de Além do Rio[a]; e eles deram apoio[b] ao povo e à casa de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Além do Rio” era a designação administrativa persa para a região a oeste do rio Eufrates.
    reason: cultural_note
  - marker: b
    text: Ou “ajudaram” ou “assistiram”. O verbo hebraico significa literalmente “levantaram” ou “carregaram” e, aqui, indica a prestação de apoio.
    reason: lexical_alternative
  - marker: c
    text: Ou “ao templo de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: entregaram
  rationale: Embora נתן signifique literalmente “dar”, aqui se refere à transmissão formal de documentos oficiais às autoridades imperiais; “entregaram” expressa esse ato com naturalidade.
- source_word: דָּתֵי הַמֶּלֶךְ
  choice: os decretos do rei
  rationale: No contexto administrativo do período persa, דָּת designa determinações oficiais; “decretos” é mais preciso que “leis”, que poderia sugerir um código legal completo.
- source_word: אֲחַשְׁדַּרְפְּנֵי
  choice: sátrapas
  rationale: É o título histórico dos governantes das grandes divisões provinciais do Império Persa e tem equivalente estabelecido em português.
- source_word: פַחֲוֹת
  choice: governadores
  rationale: O termo designa administradores ou governantes regionais; “governadores” é claro e adequado ao contexto.
- source_word: עֵבֶר הַנָּהָר
  choice: Além do Rio
  rationale: Trata-se da designação administrativa persa para a região a oeste do Eufrates; as maiúsculas indicam seu uso como nome territorial.
- source_word: וְנִשְּׂאוּ
  choice: deram apoio
  rationale: נשא significa literalmente “levantar”, “carregar” ou “sustentar”, mas aqui tem o sentido contextual de prestar ajuda ou apoio. A locução é natural em português sem apagar a imagem lexical, registrada em nota.
- source_word: הָעָם
  choice: o povo
  rationale: O hebraico diz simplesmente “o povo”; a tradução evita acrescentar uma identificação não expressa no texto.
- source_word: בֵּית הָאֱלֹהִים
  choice: a casa de Deus
  rationale: Mantém a expressão hebraica literal e inteligível, embora neste contexto ela designe o templo.
theological_decisions:
- issue: Referente do sujeito em וְנִשְּׂאוּ (“e eles deram apoio”)
  choice: Manter o pronome “eles” sem identificar explicitamente o referente
  alternative: “e essas autoridades deram apoio”
  rationale: O hebraico não nomeia novamente o sujeito. O contexto favorece os sátrapas e governadores como aqueles que prestaram apoio, mas explicitar “essas autoridades” resolveria uma referência que o texto deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Sátrapas” preserva a precisão histórica; “casa de Deus” conserva a formulação hebraica. O ponto e vírgula ajuda a sinalizar a possível mudança implícita de sujeito sem a impor.
