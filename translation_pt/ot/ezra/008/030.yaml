  terminology: «Sacerdotes», «levitas», «prata», «ouro», «utensílios» e «casa do nosso Deus» são adequados. «Utensílios» conserva a amplitude de כֵּלִים. A nota sobre «templo» deve receber marcador próprio, e convém registrar a alternativa lexical de מִשְׁקַל.
