base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: pt
  text: Assim, os sacerdotes e os levitas receberam o peso da prata, do ouro e dos utensílios,[a] para levá-los a Jerusalém, à casa do nosso Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quantidade pesada de prata, ouro e utensílios”. O termo hebraico pode referir-se ao peso propriamente dito ou à quantidade pesada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao templo do nosso Deus”. Literalmente, “à casa do nosso Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: receberam
  rationale: O qal perfeito de קבל indica que os sacerdotes e os levitas receberam os bens sob sua responsabilidade; “receberam” é natural e preserva a transferência de custódia.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os sacerdotes e os levitas
  rationale: Tradução direta dos substantivos definidos, mantendo a coordenação do hebraico.
- source_word: מִשְׁקַל
  choice: por peso
  rationale: A expressão comunica que os bens foram entregues segundo seu peso, preservando a ideia administrativa de mensuração sem sugerir que apenas a prata foi pesada.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: a prata, o ouro e os utensílios
  rationale: “Prata” e “ouro” traduzem literalmente os metais; “utensílios” é suficientemente amplo para כֵּלִים e adequado aos objetos destinados ao serviço da casa de Deus.
- source_word: לְהָבִיא
  choice: para levá-los
  rationale: O infinitivo com ל expressa finalidade. O pronome retoma de modo natural a prata, o ouro e os utensílios.
- source_word: לִירוּשָׁלַם
  choice: a Jerusalém
  rationale: Forma portuguesa corrente do topônimo com a preposição direcional.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: à casa do nosso Deus
  rationale: Preserva a expressão hebraica literal e inteligível; “templo do nosso Deus” seria uma explicitação contextual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. “Por peso” preserva a abrangência sintática de מִשְׁקַל sobre a prata, o ouro e os utensílios.
