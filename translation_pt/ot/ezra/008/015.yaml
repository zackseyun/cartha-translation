  text: וָֽ/אֶקְבְּצֵ֗/ם אֶל הַ/נָּהָר֙ הַ/בָּ֣א אֶֽל אַהֲוָ֔א וַ/נַּחֲנֶ֥ה שָׁ֖ם יָמִ֣ים שְׁלֹשָׁ֑ה וָ/אָבִ֤ינָ/ה בָ/עָם֙ וּ/בַ/כֹּ֣הֲנִ֔ים וּ/מִ/בְּנֵ֥י לֵוִ֖י לֹא מָצָ֥אתִי שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: pt
  text: Eu os reuni junto ao rio que corre para Aava[a], e acampamos ali durante três dias. Então examinei o povo e os sacerdotes, mas não encontrei ali nenhum dos filhos de Levi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «junto ao canal que vai para Aava». Neste contexto, o termo hebraico pode designar um rio ou um curso de água construído pelo ser humano.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, nenhum levita.
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: Eu os reuni
  rationale: קבץ significa reunir ou ajuntar. «Reuni» é natural em português e preserva o papel ativo de Esdras.
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: o rio que corre para Aava
  rationale: נָהָר normalmente designa um rio, mas neste contexto também pode indicar um canal. A expressão «que corre para» transmite naturalmente o movimento indicado por הַבָּא אֶל sem decidir além do texto qual era a natureza do curso de água.
- source_word: וַנַּחֲנֶה
  choice: acampamos
  rationale: חנה significa acampar. Esta é a forma moderna e direta em português.
- source_word: יָמִים שְׁלֹשָׁה
  choice: durante três dias
  rationale: A inclusão de «durante» expressa com naturalidade a duração da permanência indicada pelo contexto.
- source_word: וָאָבִינָה
  choice: examinei
  rationale: Aqui בין indica atenção cuidadosa ou discernimento mediante inspeção. «Examinei» comunica que Esdras verificou a composição do grupo.
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: o povo e os sacerdotes
  rationale: Tradução direta das duas categorias que Esdras passou em revista.
- source_word: וּמִבְּנֵי לֵוִי
  choice: nenhum dos filhos de Levi
  rationale: A expressão hebraica é literalmente «dos filhos de Levi» e designa os descendentes levíticos. A formulação preserva sua dimensão genealógica.
- source_word: לֹא מָצָאתִי שָׁם
  choice: não encontrei ali nenhum
  rationale: Expressa de modo idiomático a negação hebraica e a ausência completa de levitas no grupo.
theological_decisions: []
