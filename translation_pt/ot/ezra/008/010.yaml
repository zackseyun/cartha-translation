base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/010.yaml
  text: And from the sons of Shelomith[a], the son of Josiphiah, and with him 160 males.
translation:
  language: pt
  text: E dos filhos de Selomite[a], filho de Josifias, vieram com ele 160 homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Selomite”; literalmente, “filhos de Selomite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dos filhos de
  rationale: A expressão hebraica combina a conjunção, a preposição partitiva e o substantivo “filhos”. Em listas genealógicas, “filhos de” pode designar descendentes ou membros de um clã; a formulação literal é preservada, e a alternativa é indicada em nota.
- source_word: שְׁלוֹמִית
  choice: Selomite
  rationale: Forma portuguesa clara e tradicional do nome hebraico Shelomith.
- source_word: בֶּן יוֹסִפְיָה
  choice: filho de Josifias
  rationale: Mantém a relação filial expressa pelo hebraico e emprega formas portuguesas reconhecíveis para os nomes.
- source_word: וְ/עִמּוֹ
  choice: vieram com ele
  rationale: “Com ele” traduz diretamente a expressão hebraica. O verbo “vieram” é suprido em português para completar naturalmente a frase elíptica da lista, sem alterar seu sentido.
- source_word: מֵאָה וְשִׁשִּׁים
  choice: '160'
  rationale: Os algarismos oferecem leitura clara e moderna sem mudança de sentido.
- source_word: הַזְּכָרִים
  choice: homens
  rationale: O hebraico especifica pessoas do sexo masculino. “Homens” é a forma corrente e digna em português neste contexto de recenseamento e viagem, evitando uma expressão excessivamente técnica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe ajustada à naturalidade do idioma. Conserva-se a estrutura genealógica e a possível amplitude de “filhos” por meio de nota.
