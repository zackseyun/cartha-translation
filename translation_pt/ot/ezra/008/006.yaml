  text: וּ/מִ/בְּנֵ֣י עָדִ֔ין עֶ֖בֶד בֶּן יוֹנָתָ֑ן וְ/עִמּ֖/וֹ חֲמִשִּׁ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/006.yaml
  text: 'And from the sons of Adin: Ebed son of Jonathan[a], and with him fifty males.'
translation:
  language: pt
  text: 'e dos filhos de Adim: Ebede, filho de Jônatas, e com ele cinquenta homens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cinquenta machos”. O hebraico emprega um termo que especifica o sexo masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: e dos filhos de
  rationale: A combinação da conjunção, preposição e בְּנֵי introduz o grupo familiar seguinte. “Filhos de” preserva a forma genealógica hebraica e é natural neste contexto de lista.
- source_word: עָדִין
  choice: Adim
  rationale: Nome próprio transliterado segundo a forma tradicional e reconhecível em português.
- source_word: עֶבֶד
  choice: Ebede
  rationale: Neste contexto, עֶבֶד é nome próprio, não o substantivo comum “servo” ou “escravo”. “Ebede” representa adequadamente o hebraico em português.
- source_word: בֶּן
  choice: filho de
  rationale: Marcador genealógico direto e corrente em português.
- source_word: יוֹנָתָן
  choice: Jônatas
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio hebraico.
- source_word: וְ/עִמּוֹ
  choice: e com ele
  rationale: Mantém tanto a conjunção quanto a expressão que associa ao líder nomeado o número dos que o acompanhavam.
- source_word: חֲמִשִּׁים
  choice: cinquenta
  rationale: Equivalente direto do numeral cardinal hebraico.
- source_word: הַזְּכָרִים
  choice: homens
  rationale: Em português corrente, “homens” é a forma natural neste registro de recenseamento; a nota preserva a especificidade lexical do hebraico, que diz literalmente “machos”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e legível, com estrutura concisa própria de uma lista genealógica. Os nomes seguem formas portuguesas reconhecíveis. A formulação natural “homens” evita a estranheza de “machos” aplicada a pessoas, enquanto a nota registra com transparência a precisão sexual do termo hebraico.
