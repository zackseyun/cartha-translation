  text: וַ/נָּב֖וֹא יְרוּשָׁלִָ֑ם וַ/נֵּ֥שֶׁב שָׁ֖ם יָמִ֥ים שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/032.yaml
  text: So we came to Jerusalem and stayed there three days.
translation:
  language: pt
  text: Assim, chegamos a Jerusalém e ficamos ali três dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּבוֹא
  choice: Assim, chegamos
  rationale: O wayyiqtol de בוא dá continuidade à sequência narrativa. “Chegamos” expressa naturalmente a conclusão da viagem, enquanto “Assim” liga este acontecimento ao contexto anterior.
- source_word: יְרוּשָׁלָם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome da cidade em português.
- source_word: וַנֵּשֶׁב
  choice: e ficamos
  rationale: Neste contexto de viagem, ישב indica permanência temporária após a chegada. “Ficamos” é mais natural e preciso do que a tradução literal “sentamos”.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que retoma Jerusalém. “Ali” é corrente e natural neste relato.
- source_word: יָמִים שְׁלֹשָׁה
  choice: três dias
  rationale: A expressão funciona como acusativo de duração. Em português, “ficamos ali três dias” comunica a duração de modo claro e idiomático, sem exigir a preposição “por”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluência narrativa e ampla legibilidade brasileira. A ordem simples do hebraico foi preservada sem literalismo inadequado.
