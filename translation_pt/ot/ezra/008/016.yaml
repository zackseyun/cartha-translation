  text: וָ/אֶשְׁלְחָ֡/ה לֶ/אֱלִיעֶ֡זֶר לַ/אֲרִיאֵ֡ל לִֽ֠/שְׁמַעְיָה וּ/לְ/אֶלְנָתָ֨ן וּ/לְ/יָרִ֜יב וּ/לְ/אֶלְנָתָ֧ן וּ/לְ/נָתָ֛ן וְ/לִ/זְכַרְיָ֥ה וְ/לִ/מְשֻׁלָּ֖ם רָאשִׁ֑ים וּ/לְ/יוֹיָרִ֥יב וּ/לְ/אֶלְנָתָ֖ן מְבִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: pt
  text: Então mandei chamar Eliézer, Ariel, Semaías, Elnatã, Jaribe, Elnatã, Natã, Zacarias e Mesulão, chefes[a], e Joiaribe e Elnatã, homens de entendimento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líderes”; em hebraico, literalmente “cabeças”.
    reason: lexical_alternative
  - marker: b
    text: “Homens de entendimento” também pode ser traduzido como “homens de discernimento” ou “homens instruídos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Então mandei chamar
  rationale: O wayyiqtol dá sequência à narrativa. Neste contexto, שלח com a lista de pessoas introduzida por ל indica que Esdras mandou chamá-las; esta formulação é natural em português e evita sugerir apenas o envio de uma mensagem.
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: Eliézer ... e Elnatã
  rationale: Com a expressão portuguesa “mandei chamar”, a relação marcada pelo ל já está contida no verbo, de modo que não é necessário repetir uma preposição diante de cada nome.
- source_word: רָאשִׁים
  choice: chefes
  rationale: O substantivo significa literalmente “cabeças”, mas aqui designa homens em posição de liderança. “Chefes” conserva a imagem lexical convencional e funciona naturalmente como aposto.
- source_word: מְבִינִים
  choice: homens de entendimento
  rationale: O particípio de בין descreve pessoas dotadas de entendimento, discernimento ou instrução. A escolha preserva a amplitude do hebraico sem impor uma função oficial como “mestres”.
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: e Joiaribe e Elnatã, homens de entendimento
  rationale: O aposto final modifica mais naturalmente os dois últimos nomes. A estrutura nominal concisa acompanha a sintaxe hebraica e mantém distinta essa descrição da designação anterior “chefes”.
- source_word: אֶלְנָתָן
  choice: Elnatã
  rationale: O nome aparece três vezes no texto hebraico e é mantido em todas as ocorrências, sem harmonização, pois provavelmente identifica pessoas diferentes com o mesmo nome.
- source_word: יוֹיָרִיב
  choice: Joiaribe
  rationale: Forma portuguesa clara e reconhecível do nome hebraico, coerente com a transliteração bíblica tradicional em português.
theological_decisions: []
