  text: וּ/מִ/בְּנֵ֣י עֵילָ֔ם יְשַֽׁעְיָ֖ה בֶּן עֲתַלְיָ֑ה וְ/עִמּ֖/וֹ שִׁבְעִ֥ים הַ/זְּכָרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/007.yaml
  text: 'And from the sons of Elam: Jeshaiah son of Athaliah[a], and with him seventy males.'
translation:
  language: pt
  text: 'E dos descendentes de Elão: Jesaías, filho de Atalias, e com ele setenta homens[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os do sexo masculino”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: Dos descendentes de
  rationale: No contexto desta lista genealógica, בְּנֵי designa membros da linhagem ou família de Elão, não necessariamente filhos imediatos. “Descendentes de” comunica esse sentido com clareza em português atual; a conjunção hebraica é naturalmente absorvida pela estrutura da enumeração.
- source_word: עֵילָם
  choice: Elão
  rationale: Forma tradicional e reconhecível em português para este nome próprio.
- source_word: יְשַׁעְיָה
  choice: Jesaías
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Nesta construção patronímica direta, “filho de” reproduz de modo natural e exato a relação expressa pelo hebraico.
- source_word: עֲתַלְיָה
  choice: Atalias
  rationale: Forma portuguesa tradicional do nome próprio masculino neste contexto.
- source_word: וְ/עִמּוֹ
  choice: e com ele
  rationale: 'Preserva tanto a conjunção quanto a ideia de acompanhamento e mantém o ritmo da lista: o líder nomeado, seguido pelo número dos que o acompanhavam.'
- source_word: שִׁבְעִים
  choice: setenta
  rationale: Correspondência direta do numeral cardinal hebraico.
- source_word: הַזְּכָרִים
  choice: homens
  rationale: “Homens” é a expressão natural em português para contar integrantes masculinos de um grupo. Uma nota preserva a formulação mais específica e administrativa do hebraico, literalmente “os do sexo masculino”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência adequada a uma lista genealógica. “Descendentes” evita sugerir filhos imediatos, enquanto a nota registra a especificidade lexical de הַזְּכָרִים. O marcador foi colocado após “homens”, termo ao qual a nota se refere.
