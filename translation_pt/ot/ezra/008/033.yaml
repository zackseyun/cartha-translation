base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: pt
  text: No quarto dia, a prata, o ouro e os utensílios[a] foram pesados na casa do nosso Deus e entregues aos cuidados[b] de Meremote, o sacerdote, filho de Urias. Com ele estava Eleazar, filho de Fineias; e com eles estavam Jozabade, filho de Jesua, e Noadias, filho de Binui, os levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os objetos ou artigos usados no templo.
    reason: cultural_note
  - marker: b
    text: Literalmente, “sobre a mão de”; a expressão hebraica indica que os bens foram confiados à responsabilidade de Meremote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: No quarto dia
  rationale: Expressa naturalmente a sequência narrativa indicada pela conjunção e pela locução temporal, sem acrescentar uma referência temporal ausente do hebraico.
- source_word: נִשְׁקַל
  choice: foram pesados
  rationale: Mantém a voz passiva do nifal. Embora a forma verbal hebraica seja singular, a concordância plural é natural em português com o sujeito composto.
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: a prata, o ouro e os utensílios
  rationale: “Utensílios” comunica de modo claro que כֵּלִים designa objetos do inventário do templo, sem restringi-los indevidamente a recipientes.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: na casa do nosso Deus
  rationale: Conserva a expressão hebraica e seu tom comunitário; no contexto, a casa é o templo.
- source_word: עַל יַד
  choice: entregues aos cuidados de
  rationale: Traduz o sentido idiomático de transferência à custódia ou responsabilidade de alguém. O acréscimo de “entregues” torna explícita em português a função da expressão ligada à pesagem formal dos bens.
- source_word: מְרֵמוֹת בֶּן אֽוּרִיָּה הַכֹּהֵן
  choice: Meremote, o sacerdote, filho de Urias
  rationale: A disposição em português identifica claramente Meremote como o sacerdote, leitura mais natural no contexto, ao mesmo tempo que preserva sua filiação.
- source_word: וְעִמּוֹ אֶלְעָזָר בֶּן פִּינְחָס
  choice: Com ele estava Eleazar, filho de Fineias
  rationale: Reproduz de forma natural a coordenação hebraica e identifica o primeiro acompanhante.
- source_word: וְעִמָּהֶם יוֹזָבָד בֶּן יֵשׁוּעַ וְנוֹעַדְיָה בֶן בִּנּוּי הַלְוִיִּם
  choice: e com eles estavam Jozabade, filho de Jesua, e Noadias, filho de Binui, os levitas
  rationale: O plural “os levitas” identifica coletivamente os dois últimos homens mencionados, conforme a sintaxe hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes bíblicos em formas correntes. A frase longa do hebraico foi dividida em duas para maior clareza, sem alterar a sequência nem as relações entre os participantes.
