lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: E dos filhos de
  rationale: Preserva a forma hebraica e a estrutura da lista. Neste contexto genealógico, “filhos de” pode designar uma linhagem ou clã mais amplo, não apenas filhos imediatos.
- source_word: שְׁפַטְיָה
  choice: Sefatias
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico.
- source_word: זְבַדְיָה
  choice: Zebadias
  rationale: Transliteração portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Diante de um nome próprio que identifica o pai, o sentido genealógico comum e mais natural é “filho de”.
- source_word: מִיכָאֵל
  choice: Micael
  rationale: Transliteração direta do nome hebraico, distinta da forma portuguesa mais adaptada “Miguel”.
- source_word: וְ/עִמּוֹ
  choice: e com ele
  rationale: Mantém a conjunção e reproduz naturalmente a estrutura cumulativa da lista.
- source_word: שְׁמֹנִים
  choice: oitenta
  rationale: Equivalente direto do numeral cardinal hebraico.
- source_word: הַזְּכָרִים
  choice: homens
  rationale: No contexto da relação dos que retornaram, “homens” expressa de modo natural em português o grupo masculino contado pelo texto; a nota registra a especificidade lexical do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes em formas portuguesas reconhecíveis. A sintaxe concisa preserva o caráter de lista do original. O marcador [a] foi colocado após “homens”, termo ao qual a nota se refere.
