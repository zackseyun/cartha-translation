  yaml_path: translation/ot/ezra/008/008.yaml
  text: 'And from the sons of Shephatiah: Zebadiah son of Michael[a], and with him eighty males.'
translation:
  language: pt
  text: 'E dos filhos de Sefatias: Zebadias, filho de Micael, e com ele oitenta homens.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa um termo que especifica o sexo masculino.
