  text: 'From the sons of Pahath-moab: Eliehoenai son of Zerahiah[a], and with him two hundred males.'
translation:
  language: pt
  text: 'Dos filhos de Paate-Moabe: Elioenai, filho de Zeraías, e com ele duzentos homens[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “indivíduos do sexo masculino”. O hebraico diz especificamente “os machos”, destacando o sexo, em vez de empregar um termo mais geral para pessoas.
