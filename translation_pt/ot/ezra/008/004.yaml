lexical_decisions:
- source_word: מִבְּנֵי
  choice: Dos filhos de
  rationale: Preserva a preposição מִן e a expressão hebraica de filiação usada como designação de família ou clã; em português, “dos filhos de” é natural neste tipo de lista.
- source_word: פַּחַת מוֹאָב
  choice: Paate-Moabe
  rationale: Nome próprio de família ou clã, transliterado segundo formas correntes em português e unido por hífen para indicar a unidade do nome.
- source_word: אֶלְיְהוֹעֵינַי
  choice: Elioenai
  rationale: Transliteração portuguesa clara do nome hebraico, compatível com o uso bíblico corrente.
- source_word: בֶּן זְרַחְיָה
  choice: filho de Zeraías
  rationale: Reproduz diretamente a relação filial expressa no hebraico, com forma natural em português.
- source_word: וְעִמּוֹ
  choice: e com ele
  rationale: Mantém tanto a conjunção quanto a expressão preposicional que introduz o grupo acompanhado pelo líder nomeado.
- source_word: מָאתַיִם
  choice: duzentos
  rationale: Tradução direta do numeral cardinal.
- source_word: הַזְּכָרִים
  choice: homens[a]
  rationale: “Homens” é mais natural numa lista de participantes em português, enquanto a nota registra que o termo hebraico especifica indivíduos do sexo masculino.
