base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/009.yaml
  text: 'From the sons of Joab: Obadiah son of Jehiel[a], and with him 218 males.'
translation:
  language: pt
  text: 'Dos descendentes de Joabe: Obadias, filho de Jeiel, e, com ele, 218[a] pessoas do sexo masculino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, duzentas e dezoito pessoas do sexo masculino.
    reason: Apresenta por extenso o numeral expresso em algarismos no texto principal.
lexical_decisions:
- source_word: מִ/בְּנֵי יוֹאָב
  choice: Dos descendentes de Joabe
  rationale: A construção introduz um grupo pertencente à linhagem de Joabe. “Descendentes” comunica naturalmente o sentido genealógico sem sugerir que todos eram filhos imediatos.
- source_word: עֹבַדְיָה בֶּן יְחִיאֵל
  choice: Obadias, filho de Jeiel
  rationale: Emprega as formas tradicionais portuguesas dos nomes e traduz בֶּן pelo marcador filial direto “filho de”.
- source_word: וְ/עִמּוֹ
  choice: e, com ele
  rationale: Preserva a coordenação hebraica e indica que o número seguinte corresponde aos que acompanhavam Obadias.
- source_word: מָאתַיִם וּ/שְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: O numeral hebraico significa literalmente “duzentos e dezoito”; algarismos favorecem a leitura desta lista sem alterar o sentido.
- source_word: הַ/זְּכָרִים
  choice: pessoas do sexo masculino
  rationale: O termo designa especificamente indivíduos do sexo masculino, sem afirmar que todos eram homens adultos; a formulação preserva essa precisão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes familiares a leitores brasileiros e compreensíveis internacionalmente. A sintaxe concisa conserva o formato enumerativo do contexto. “Pessoas do sexo masculino” é mais preciso que “homens”, embora um pouco mais explícito, pois evita restringir o grupo a adultos.
