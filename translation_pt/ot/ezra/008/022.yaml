  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: pt
  text: 'Pois envergonhei-me de pedir ao rei tropas e cavaleiros para nos ajudarem contra o inimigo no caminho[a], porque tínhamos dito ao rei: “A mão do nosso Deus está sobre todos os que o buscam, para o bem deles[b], mas a sua força e a sua ira estão contra todos os que o abandonam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para nos ajudarem do inimigo no caminho”. O hebraico pode ser traduzido mais literalmente assim; “contra o inimigo no caminho” expressa de modo mais natural em português a proteção militar solicitada.'
    reason: lexical_alternative
  - marker: b
    text: “A mão do nosso Deus” é uma expressão hebraica que representa sua ação poderosa e favorável.
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: tive vergonha
  rationale: Expressa vergonha e desonra, não mero constrangimento social; é natural e suficientemente forte em português.
- source_word: לִשְׁאוֹל
  choice: pedir
  rationale: No contexto, significa solicitar algo ao rei; “pedir ao rei” é a construção portuguesa mais natural.
- source_word: חַיִל
  choice: tropas
  rationale: Refere-se a uma força armada fornecida pelo rei, sem sugerir necessariamente o exército inteiro.
- source_word: פָרָשִׁים
  choice: cavaleiros
  rationale: Designa combatentes montados e conserva a imagem concreta do hebraico.
- source_word: לְעָזְרֵנוּ
  choice: para nos ajudarem
  rationale: Traduz claramente o infinitivo de finalidade e concorda naturalmente com “tropas e cavaleiros”.
- source_word: מֵאוֹיֵב
  choice: contra o inimigo
  rationale: Embora a preposição possa ser vertida literalmente por “do inimigo”, o pedido de proteção militar favorece “contra o inimigo” em português.
- source_word: בַּדָּרֶךְ
  choice: no caminho
  rationale: Expressão concisa que pode indicar tanto o percurso quanto a viagem.
- source_word: יַד אֱלֹהֵינוּ
  choice: A mão do nosso Deus
  rationale: Mantém a metáfora hebraica da ação, do poder e do favor divinos.
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: está sobre todos os que o buscam, para o bem deles
  rationale: Preserva a preposição e explicita de modo natural que a ação divina resulta em benefício para os que o buscam.
- source_word: וְעֻזּוֹ
  choice: a sua força
  rationale: Mantém distinto o substantivo que expressa força ou poder.
- source_word: וְאַפּוֹ
  choice: a sua ira
  rationale: Traduz o sentido idiomático do termo e conserva a intensidade da oposição divina.
- source_word: עַל כָּל עֹזְבָיו
  choice: estão contra todos os que o abandonam
  rationale: “Abandonam” comunica com clareza a ruptura relacional implicada pelo verbo, sem arcaísmo desnecessário.
theological_decisions:
- issue: Expressão antropomórfica יַד אֱלֹהֵינוּ
  choice: Conservar “A mão do nosso Deus”.
  alternative: Traduzir interpretativamente como “o poder do nosso Deus” ou “o favor do nosso Deus”.
  rationale: A imagem corporal é intencional e abrange ação, poder e favor; mantê-la evita reduzir a expressão a apenas uma dessas ideias.
- issue: Relação de לְטוֹבָה com a mão de Deus e com os que o buscam
  choice: “está sobre todos os que o buscam, para o bem deles”.
  alternative: “favorece todos os que o buscam” ou “está para o bem sobre todos os que o buscam”.
  rationale: A formulação conserva a metáfora e a ambiguidade estrutural básica, ao mesmo tempo que comunica em português que a mão divina atua beneficamente.
- issue: Dois aspectos da oposição divina em וְעֻזּוֹ וְאַפּוֹ
  choice: 'Manter os dois substantivos: “a sua força e a sua ira”.'
  alternative: Fundir os termos como “a força da sua ira”.
  rationale: O hebraico coordena força e ira como conceitos distintos; preservá-los mantém tanto a capacidade ativa quanto a indignação divina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservam-se a metáfora hebraica da mão de Deus e a distinção entre força e ira; evita-se vocabulário excessivamente arcaico.
