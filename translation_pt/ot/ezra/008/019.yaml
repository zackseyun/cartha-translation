id: EZR.8.19
reference: Ezra 8:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת חֲשַׁבְיָ֔ה וְ/אִתּ֥/וֹ יְשַֽׁעְיָ֖ה מִ/בְּנֵ֣י מְרָרִ֑י אֶחָ֥י/ו וּ/בְנֵי/הֶ֖ם עֶשְׂרִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: pt
  text: e Hasabias, e com ele Jesaías, dos descendentes de Merari[a], os irmãos dele[b] e os filhos deles, num total de vinte;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dos filhos de Merari”; isto é, da linhagem ou do clã de Merari.
    reason: lexical_alternative
  - marker: b
    text: “Irmãos” pode designar aqui parentes próximos ou membros do mesmo clã merarita, e não necessariamente apenas irmãos biológicos.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת
  choice: e
  rationale: A conjunção seguida do marcador de objeto dá continuidade à lista do versículo anterior; em português, o marcador não é traduzido separadamente.
- source_word: חֲשַׁבְיָה
  choice: Hasabias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico, adequada a uma tradução bíblica moderna.
- source_word: וְאִתּוֹ
  choice: e com ele
  rationale: Preserva tanto a coordenação hebraica quanto a ideia de acompanhamento expressa pela preposição com sufixo masculino singular.
- source_word: יְשַׁעְיָה
  choice: Jesaías
  rationale: Transliteração portuguesa usual deste nome, distinguindo-o da forma normalmente usada para o profeta Isaías.
- source_word: מִבְּנֵי מְרָרִי
  choice: dos descendentes de Merari
  rationale: Comunica naturalmente em português a pertença à linhagem de Merari; a expressão hebraica literal é esclarecida em nota.
- source_word: אֶחָיו
  choice: os irmãos dele
  rationale: Mantém o substantivo comum 'irmãos' e explicita o sufixo hebraico masculino singular sem decidir silenciosamente se se trata de irmãos biológicos ou parentes do mesmo clã.
- source_word: וּבְנֵיהֶם
  choice: e os filhos deles
  rationale: Preserva o plural masculino e o sufixo plural da expressão hebraica.
- source_word: עֶשְׂרִים
  choice: num total de vinte
  rationale: O número funciona naturalmente como total do grupo mencionado; 'num total de' torna clara em português a função elíptica do numeral.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas de boa legibilidade no contexto bíblico. A construção conserva o sufixo singular em “os irmãos dele” e evita identificar de modo definitivo seu referente, enquanto “os filhos deles” mantém o plural do hebraico.
