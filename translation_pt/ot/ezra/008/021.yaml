  text: וָ/אֶקְרָ֨א שָׁ֥ם צוֹם֙ עַל הַ/נָּהָ֣ר אַהֲוָ֔א לְ/הִתְעַנּ֖וֹת לִ/פְנֵ֣י אֱלֹהֵ֑י/נוּ לְ/בַקֵּ֤שׁ מִמֶּ֨/נּוּ֙ דֶּ֣רֶךְ יְשָׁרָ֔ה לָ֥/נוּ וּ/לְ/טַפֵּ֖/נוּ וּ/לְ/כָל רְכוּשֵֽׁ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: pt
  text: Então proclamei ali um jejum, junto ao rio Aava, para nos humilharmos diante do nosso Deus e lhe pedirmos um caminho reto para nós, para nossas crianças e para todos os nossos bens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: Então proclamei
  rationale: Neste contexto, קרא indica o anúncio público de um jejum; “então” expressa com naturalidade a progressão narrativa.
- source_word: צוֹם
  choice: um jejum
  rationale: O substantivo designa a prática ou observância anunciada.
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: junto ao rio Aava
  rationale: עַל, com um rio, indica localização junto a ele. Aava translitera o nome hebraico אַהֲוָא de modo legível em português.
- source_word: לְהִתְעַנּוֹת
  choice: para nos humilharmos
  rationale: O hitpael de ענה, especialmente no contexto de jejum, comunica auto-humilhação e renúncia diante de Deus, sem sugerir necessariamente dano físico.
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: diante do nosso Deus
  rationale: Expressão relacional natural e digna para indicar a postura assumida na presença de Deus.
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: e lhe pedirmos
  rationale: בקש com מִן pode expressar pedir ou buscar algo da parte de alguém. Em português, “lhe pedirmos” transmite claramente o caráter de súplica a Deus.
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: um caminho reto
  rationale: Preserva a imagem literal do hebraico e sua possível amplitude entre direção correta e viagem favorável ou segura.
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: para nós, para nossas crianças e para todos os nossos bens
  rationale: טף se refere sobretudo às crianças pequenas do grupo, enquanto רְכוּשׁ designa os bens ou haveres transportados.
theological_decisions:
- issue: Sentido do idioma de jejum לְהִתְעַנּוֹת
  choice: para nos humilharmos diante do nosso Deus
  alternative: para nos afligirmos diante do nosso Deus
  rationale: “Humilharmos” comunica a postura penitencial e de abnegação ligada ao jejum; “afligirmos” é mais literal, mas pode sugerir indevidamente dano físico deliberado.
- issue: Amplitude de דֶּרֶךְ יְשָׁרָה
  choice: um caminho reto
  alternative: um bom caminho; uma viagem segura
  rationale: A formulação mantém a metáfora hebraica e não restringe o pedido apenas à segurança física nem apenas à orientação moral.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e compreensão internacional. A sintaxe conserva o encadeamento do hebraico sem soar rígida; não foram necessárias notas de rodapé.
