base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: pt
  text: 'E dos descendentes de Adonicão[a], os últimos — estes eram os seus nomes: Elifelete, Jeiel e Semaías; e, com eles, sessenta homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os posteriores” ou “os que vieram por último”. O hebraico provavelmente identifica este como o grupo final da linhagem de Adonicão, talvez em contraste com um grupo anterior mencionado em outro lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: E dos descendentes de
  rationale: Em listas genealógicas, בְּנֵי pode designar não apenas filhos imediatos, mas descendentes ou membros de uma linhagem. “Descendentes” comunica esse sentido com clareza em português atual.
- source_word: אֲדֹנִיקָם
  choice: Adonicão
  rationale: Transliteração tradicional e reconhecível do nome hebraico em português.
- source_word: אַחֲרֹנִים
  choice: os últimos
  rationale: O adjetivo pode significar “últimos”, “posteriores” ou “os que vieram depois”. “Os últimos” preserva a provável identificação deste como o grupo final da linhagem de Adonicão sem eliminar a ambiguidade, registrada em nota.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: estes eram os seus nomes
  rationale: Fórmula de introdução de lista sem verbo explícito no hebraico; “eram” é suprido naturalmente no contexto narrativo em português.
- source_word: אֱלִיפֶלֶט
  choice: Elifelete
  rationale: Forma portuguesa reconhecível do nome próprio hebraico.
- source_word: יְעִיאֵל
  choice: Jeiel
  rationale: Transliteração portuguesa corrente do nome próprio.
- source_word: וּשְׁמַעְיָה
  choice: e Semaías
  rationale: Forma portuguesa do nome próprio, mantendo a conjunção da enumeração hebraica.
- source_word: וְעִמָּהֶם
  choice: e, com eles
  rationale: Expressa diretamente o acompanhamento indicado por עִם e preserva a coordenação hebraica.
- source_word: שִׁשִּׁים
  choice: sessenta
  rationale: Equivalente direto do numeral cardinal.
- source_word: הַזְּכָרִים
  choice: homens
  rationale: O hebraico especifica pessoas do sexo masculino. Neste recenseamento de viajantes, “homens” é natural e suficientemente preciso em português, evitando o tom clínico ou categorial de “machos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O travessão organiza a fórmula de lista sem transformar a expressão ambígua “os últimos” em uma afirmação mais específica do que o hebraico permite.
