base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: pt
  text: Assim, jejuamos e buscamos o nosso Deus a respeito disso, e ele atendeu à nossa súplica.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: jejuamos
  rationale: O verbo צום relata diretamente a ação coletiva de jejuar; não afirma que um jejum foi proclamado.
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: buscamos o nosso Deus
  rationale: בקשׁ significa com frequência “buscar” e, neste contexto de oração, inclui a ideia de pedir. A formulação preserva a expressão hebraica e soa natural em português.
- source_word: עַל זֹאת
  choice: a respeito disso
  rationale: A expressão remete à questão mencionada no contexto anterior e explicita naturalmente a relação indicada por עַל.
- source_word: וַיֵּעָתֵר לָנוּ
  choice: ele atendeu à nossa súplica
  rationale: No nifal, עתר indica uma resposta favorável a uma súplica. Esta tradução comunica o sentido sem recorrer ao passivo pouco natural “deixou-se suplicar por nós”.
theological_decisions:
- issue: Sentido da resposta divina em וַיֵּעָתֵר
  choice: ele atendeu à nossa súplica
  alternative: ele se deixou suplicar por nós
  rationale: A opção escolhida expressa uma resposta favorável de Deus ao pedido, sem especificar além do que o verbo hebraico afirma nem tornar a frase obscura em português.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Assim” liga a ação à decisão do contexto precedente; “súplica” conserva o caráter de oração fervorosa.
