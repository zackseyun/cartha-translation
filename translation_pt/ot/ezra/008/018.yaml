base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: pt
  text: 'E, pela boa mão do nosso Deus sobre nós[a], eles nos trouxeram um homem de discernimento dentre os filhos de Mali, filho de Levi, filho de Israel: Serebias, seus filhos e seus irmãos, dezoito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como a boa mão do nosso Deus estava sobre nós”. A expressão hebraica descreve o favor e a ação providencial de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ לָנוּ
  choice: eles nos trouxeram
  rationale: O hifil de בוא significa normalmente “trazer” ou “fazer vir”. A formulação é natural em português e preserva o sujeito plural não especificado.
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: como a boa mão do nosso Deus estava sobre nós
  rationale: Preserva a imagem hebraica da mão divina e comunica, em português corrente, o favor e a ação providencial de Deus. A nota registra uma alternativa mais formal para כְּיַד.
- source_word: אִישׁ שֶׂכֶל
  choice: um homem de discernimento
  rationale: שֶׂכֶל denota entendimento, prudência ou discernimento. “Homem de discernimento” conserva a forma masculina singular e evita reduzir o sentido a mera habilidade técnica.
- source_word: מִבְּנֵי מַחְלִי
  choice: dentre os filhos de Mali
  rationale: בְּנֵי significa literalmente “filhos”, embora aqui possa abranger descendentes. A tradução mantém a forma genealógica hebraica sem perder a compreensão contextual.
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: filho de Levi, filho de Israel
  rationale: Mantém a fórmula genealógica repetida e sua ligação explícita com Levi e Israel.
- source_word: וְשֵׁרֵבְיָה
  choice: Serebias
  rationale: O waw pode introduzir, neste contexto, a identificação do homem anteriormente descrito. Os dois-pontos em português expressam essa aposição com clareza sem acrescentar conteúdo.
- source_word: וּבָנָיו וְאֶחָיו
  choice: com seus filhos e seus irmãos
  rationale: “Com” apresenta naturalmente em português as pessoas associadas a Serebias, preservando as relações familiares do hebraico.
- source_word: שְׁמֹנָה עָשָׂר
  choice: dezoito ao todo
  rationale: O número conclui a lista e indica naturalmente o total do grupo. “Ao todo” torna explícita em português a função sintática do numeral, sem inserir uma nova categoria de pessoas.
theological_decisions:
- issue: Expressão da ação providencial de Deus por meio da imagem de sua mão
  choice: como a boa mão do nosso Deus estava sobre nós
  alternative: segundo a boa mão do nosso Deus sobre nós
  rationale: A tradução conserva a metáfora bíblica da mão de Deus e a noção de favor providencial, sem expandi-la em uma formulação doutrinária abstrata.
- issue: Identificação do “homem de discernimento”
  choice: Serebias é apresentado em aposição, após dois-pontos
  alternative: manter a coordenação literal “e Serebias”, que poderia sugerir outra pessoa não nomeada
  rationale: No contexto, Serebias é naturalmente entendido como o homem de discernimento trazido dentre os descendentes de Mali. A pontuação torna essa relação legível, sem atribuir-lhe um título ou função ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora “boa mão” e as fórmulas genealógicas foram preservadas; a ordem foi ajustada apenas o necessário para clareza natural.
