lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: E dos filhos de
  rationale: Reproduz de perto a forma hebraica e mantém o padrão da lista; neste contexto, “filhos” pode abranger descendentes ou membros de uma linhagem familiar.
- source_word: בֵבַי
  choice: Bebai
  rationale: Transliteração consagrada do nome próprio em português.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Na construção patronímica imediata, esta é a tradução mais direta e natural.
- source_word: וְעִמּוֹ
  choice: e com ele
  rationale: Preserva a conjunção e expressa naturalmente que o grupo acompanhava Zacarias.
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: vinte e oito
  rationale: Tradução direta e idiomática do numeral cardinal.
- source_word: הַזְּכָרִים
  choice: homens
  rationale: Em uma lista de retornados, “homens” é natural e compreensível em português; o termo hebraico especifica pessoas do sexo masculino, sem necessariamente indicar apenas adultos.
