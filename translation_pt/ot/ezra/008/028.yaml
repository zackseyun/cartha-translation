base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: pt
  text: 'E eu lhes disse: “Vocês são santos para Yahweh, e os utensílios são santos; a prata e o ouro são uma oferta voluntária a Yahweh, o Deus de seus pais.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: E eu lhes disse
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; a formulação preserva a sequência e introduz naturalmente o discurso direto.
- source_word: אַתֶּם קֹדֶשׁ לַיהוָה
  choice: Vocês são santos para Yahweh
  rationale: O pronome é masculino plural, e קֹדֶשׁ predica a condição de pessoas consagradas e pertencentes a Yahweh. “Santos para” preserva a linguagem cultual sem expandi-la interpretativamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: No contexto do templo, כֵּלִים designa objetos ou instrumentos destinados ao serviço sagrado; “utensílios” é claro e natural em português.
- source_word: וְהַכֵּלִים קֹדֶשׁ
  choice: e os utensílios também são santos
  rationale: “Também” explicita em português o paralelismo entre a santidade dos destinatários e a dos utensílios, sem alterar a relação sintática do hebraico.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: a prata e o ouro
  rationale: Mantém os artigos definidos presentes diante dos dois substantivos e a cadência equilibrada da fonte.
- source_word: נְדָבָה
  choice: uma oferta voluntária
  rationale: O termo indica uma dádiva apresentada espontaneamente, não por compulsão; “oferta voluntária” comunica essa nuance de modo corrente.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Preserva a fórmula pactual e o referente masculino plural do hebraico, sem neutralizá-lo como “antepassados”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em transliteração, sem substituí-lo por um título.
- issue: Sentido cultual de קֹדֶשׁ aplicado a pessoas e objetos
  choice: santos
  alternative: consagrados; sagrados
  rationale: “Santos” mantém a repetição lexical e a tensão entre santidade pessoal e consagração cultual. O contexto comunica que ambos foram separados para Yahweh.
- issue: Fórmula אֱלֹהֵי אֲבֹתֵיכֶם
  choice: o Deus de seus pais
  alternative: o Deus de seus antepassados
  rationale: A opção conserva a forma masculina plural e a fórmula histórica da aliança, sem impor uma reformulação inclusiva ou uma interpretação adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” deixa claro o plural do hebraico. A repetição de “santos” preserva o paralelismo da fonte; “utensílios” evita o tom excessivamente arcaico de “vasos” e se ajusta ao contexto do templo.
