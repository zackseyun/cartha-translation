base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: pt
  text: 'Eu os enviei a Ido, o chefe em Casifia, e lhes dei instruções sobre o que dizer a Ido e aos irmãos dele, os servidores do templo[a] que estavam em Casifia: que nos trouxessem pessoas para servir[b] na casa do nosso Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os netineus”, nome de uma classe reconhecida de servidores ligados ao serviço do templo.'
    reason: lexical_alternative
  - marker: b
    text: A expressão se refere a pessoas que prestariam serviço no templo, não necessariamente a ocupantes de um cargo religioso formal posterior.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה
  choice: Eu os enviei
  rationale: O hifil de יצא significa literalmente “fazer sair”, mas, neste contexto de comissionamento de emissários, “enviei” expressa com naturalidade a ação pretendida.
- source_word: אִדּוֹ הָרֹאשׁ
  choice: Ido, o chefe
  rationale: רֹאשׁ, literalmente “cabeça”, funciona aqui como título de quem estava encarregado ou exercia liderança.
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: do lugar chamado Casifia
  rationale: A formulação preserva מָקוֹם, “lugar”, e apresenta Casifia naturalmente como nome da localidade.
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: lhes dei instruções sobre o que dizer
  rationale: A expressão hebraica, literalmente “pus palavras na boca deles”, significa confiar uma mensagem ou instruir alguém sobre o que deve dizer. A tradução comunica o idioma com clareza sem sugerir manipulação.
- source_word: אֶל אִדּוֹ אָחִיו
  choice: a Ido e aos irmãos dele
  rationale: O grupo plural indicado pelo contexto favorece a leitura coletiva de אָחִיו. “Irmãos” mantém a linguagem relacional do hebraico sem especificar se eram irmãos de sangue ou membros do mesmo grupo.
- source_word: הַנְּתוּנִים
  choice: os servidores do templo
  rationale: Em Esdras-Neemias, o termo designa uma classe reconhecida ligada ao serviço do santuário. A tradução funcional é mais transparente que a simples transliteração, preservada em nota.
- source_word: מְשָׁרְתִים
  choice: pessoas para servir
  rationale: O particípio designa pessoas que prestariam serviço na casa de Deus. Esta formulação evita que “ministros” seja entendido como título eclesiástico posterior e mantém distinção suficiente em relação ao nome da classe dos servidores do templo.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: na casa do nosso Deus
  rationale: A expressão conserva a imagem hebraica de “casa de Deus” e é clara no contexto do templo.
theological_decisions:
- issue: Tradução de הַנְּתוּנִים no contexto do serviço do templo
  choice: os servidores do templo
  alternative: os netineus
  rationale: Trata-se de uma designação histórico-institucional, não de uma afirmação doutrinária. A tradução funcional torna o sentido acessível, enquanto a nota registra o nome tradicional da classe.
- issue: Sentido de מְשָׁרְתִים
  choice: pessoas para servir
  alternative: ministros
  rationale: A opção descreve a função no templo sem importar a noção de um cargo religioso formal de época posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção idiomática “pus palavras na boca deles” foi traduzida pelo seu sentido comunicativo; “casa do nosso Deus” foi mantida para conservar a imagem do hebraico. Os marcadores de nota aparecem junto aos termos que efetivamente explicam.
