  text: וָ/אַבְדִּ֛ילָ/ה מִ/שָּׂרֵ֥י הַ/כֹּהֲנִ֖ים שְׁנֵ֣ים עָשָׂ֑ר לְ/שֵׁרֵֽבְיָ֣ה חֲשַׁבְיָ֔ה וְ/עִמָּ/הֶ֥ם מֵ/אֲחֵי/הֶ֖ם עֲשָׂרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: pt
  text: 'Então separei doze dentre os chefes dos sacerdotes: Serebias, Hasabias e, com eles, dez de seus irmãos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” também pode designar, de modo mais amplo, parentes ou companheiros do mesmo grupo; o hebraico emprega o termo familiar masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: Então separei
  rationale: O hifil de בדל indica separar ou pôr à parte. “Separei” é natural em português e mantém a ideia de designação para uma responsabilidade específica; “Então” expressa a sequência narrativa do ו־.
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: dentre os chefes dos sacerdotes
  rationale: 'שָׂרֵי designa chefes ou líderes, e מִן tem sentido partitivo: os doze foram separados dentre esse grupo.'
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Tradução direta do numeral cardinal.
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: Serebias, Hasabias
  rationale: Os nomes pessoais são transliterados em formas correntes na tradição bíblica portuguesa. No contexto, identificam os primeiros dois integrantes do total de doze; os dois-pontos tornam clara essa função sem reproduzir de modo artificial a preposição לְ.
- source_word: וְעִמָּהֶם
  choice: e, com eles
  rationale: Conserva explicitamente a estrutura aditiva do hebraico e associa os dez homens a Serebias e Hasabias.
- source_word: מֵאֲחֵיהֶם
  choice: de seus irmãos
  rationale: Traduz diretamente o termo familiar masculino אָח, sem decidir se aqui indica irmãos de sangue, parentes ou companheiros do mesmo grupo sacerdotal.
- source_word: עֲשָׂרָה
  choice: dez
  rationale: Tradução direta do numeral cardinal; somados a Serebias e Hasabias, completa o total de doze.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o total de doze — Serebias, Hasabias e mais dez — e mantém a possível amplitude semântica de “irmãos” em nota.
