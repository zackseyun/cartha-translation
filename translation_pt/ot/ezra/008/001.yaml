  text: וְ/אֵ֛לֶּה רָאשֵׁ֥י אֲבֹתֵי/הֶ֖ם וְ/הִתְיַחְשָׂ֑/ם הָ/עֹלִ֣ים עִמִּ֗/י בְּ/מַלְכ֛וּת אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ מִ/בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/001.yaml
  text: 'These are the heads of their fathers’ houses[a], and their genealogy, of those who went up with me from Babylon in the reign of King Artaxerxes:'
translation:
  language: pt
  text: 'Estes são os chefes de suas famílias paternas e o registro genealógico[a] dos que subiram comigo da Babilônia durante o reinado do rei Artaxerxes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a genealogia” ou “a inscrição genealógica”. O termo hebraico se refere a um registro ou cadastramento segundo a genealogia, e não apenas à ascendência em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: Introduz uma nova seção e sua lista. Em português, a abertura direta é natural; o contexto já comunica a ligação discursiva de וְ sem exigir “E” ou “Ora”.
- source_word: רָאשֵׁי אֲבֹתֵיהֶם
  choice: os chefes de suas famílias paternas
  rationale: רָאשֵׁי designa os principais representantes, e אֲבֹתֵיהֶם, neste contexto administrativo e genealógico, refere-se às unidades familiares ancestrais organizadas pela linhagem paterna.
- source_word: וְהִתְיַחְשָׂם
  choice: e o registro genealógico[a]
  rationale: O termo aponta para inscrição ou documentação genealógica, não apenas para ascendência em sentido abstrato. “Registro genealógico” preserva esse aspecto concreto e se encaixa no contexto da lista.
- source_word: הָעֹלִים עִמִּי
  choice: dos que subiram comigo
  rationale: עלה é o verbo tradicional para a subida à terra de Judá e a Jerusalém. O pretérito é exigido pelo contexto narrativo, e a primeira pessoa de עִמִּי é mantida.
- source_word: בְּמַלְכוּת
  choice: durante o reinado
  rationale: Aqui o substantivo indica o período em que o rei governava; “durante o reinado” é a equivalência idiomática em português.
- source_word: אַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: do rei Artaxerxes
  rationale: Emprega a forma portuguesa convencional do nome e reorganiza naturalmente a expressão hebraica “Artaxerxes, o rei”, sem alterar o sentido.
- source_word: מִבָּבֶל
  choice: da Babilônia
  rationale: Tradução geográfica convencional, indicando o lugar de onde o grupo partiu.
