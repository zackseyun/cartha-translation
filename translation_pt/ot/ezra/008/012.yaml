  yaml_path: translation/ot/ezra/008/012.yaml
  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: pt
  text: 'E dos filhos de Azgade: Joanã, filho de Hacatã[a], e, com ele, 110 homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filho do mais novo”, se הַקָּטָן for entendido como descrição, e não como o nome próprio Hacatã.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: E dos filhos de
  rationale: Mantém a fórmula genealógica e a estrutura da lista; em hebraico, “filhos de” também pode designar descendentes ou membros de um clã.
- source_word: עַזְגָּד
  choice: Azgade
  rationale: Transliteração portuguesa tradicional e inteligível do nome próprio hebraico.
- source_word: יוֹחָנָן
  choice: Joanã
  rationale: Forma portuguesa corrente do nome hebraico, adequada ao registro bíblico moderno.
- source_word: בֶּן הַ/קָּטָן
  choice: filho de Hacatã
  rationale: No contexto desta lista, a expressão funciona mais naturalmente como patronímico; a possível leitura descritiva é preservada em nota.
- source_word: וְ/עִמּוֹ
  choice: e, com ele
  rationale: Reproduz a fórmula hebraica que introduz o número dos que acompanhavam o líder citado.
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: '110'
  rationale: Representação moderna e clara do cardinal hebraico “cento e dez”.
- source_word: הַ/זְּכָרִים
  choice: homens
  rationale: No contexto do recenseamento de um grupo que viajava, “homens” é natural em português; o hebraico especifica pessoas do sexo masculino.
