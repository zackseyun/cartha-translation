lexical_decisions:
- source_word: מִבְּנֵי
  choice: Dos filhos de
  rationale: Mantém a fórmula genealógica da lista e expressa naturalmente em português o grupo proveniente dessa linhagem.
- source_word: שְׁכַנְיָה
  choice: Secanias
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן
  choice: seu filho
  rationale: Explicita que Jaaziel é filho de Secanias e evita a leitura de que Secanias seja o homem contado como líder do grupo.
- source_word: יַחֲזִיאֵל
  choice: Jaaziel
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: וְעִמּוֹ
  choice: e com ele
  rationale: Preserva a coordenação hebraica e indica que o grupo numerado acompanhava Jaaziel.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: trezentos
  rationale: Correspondência direta do numeral cardinal hebraico.
- source_word: הַזְּכָרִים
  choice: homens
  rationale: É a forma natural em português para pessoas do sexo masculino neste contexto de recenseamento; a especificidade lexical do hebraico é preservada em nota.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe de lista genealógica. Os dois-pontos tornam explícita a estrutura fragmentária do hebraico: Jaaziel é o representante mencionado entre os filhos de Secanias. A nota mantém a precisão de הַזְּכָרִים sem recorrer no texto principal ao termo português pouco natural “machos” aplicado a pessoas.'
