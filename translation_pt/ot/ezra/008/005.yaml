  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: pt
  text: Dos filhos de Secanias, filho de Jaaziel, e com ele trezentos homens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz especificamente “indivíduos do sexo masculino”, destacando o sexo, não a idade nem a posição social.
