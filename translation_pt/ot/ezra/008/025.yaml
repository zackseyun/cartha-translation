base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: pt
  text: Pesei-lhes a prata, o ouro e os utensílios — a contribuição[a] para a casa do nosso Deus, que o rei, seus conselheiros, seus oficiais e todo o Israel que estava presente haviam oferecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a oferta para a casa do nosso Deus”. O termo hebraico pode designar uma contribuição separada para uso sagrado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: Pesei e entreguei a eles
  rationale: O verbo significa literalmente “pesar”, e לָהֶם indica os destinatários. No contexto, a pesagem formal acompanha a transferência dos bens à custódia deles; a formulação portuguesa explicita essa relação sem perder o ato concreto de pesar.
- source_word: הַכֶּסֶף וְאֶת־הַזָּהָב
  choice: a prata, o ouro
  rationale: Os termos designam aqui os metais preciosos entre os bens destinados ao templo, não dinheiro em sentido genérico.
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: כֵּלִים é um termo amplo para objetos e implementos. “Utensílios” é natural em português e adequado aos objetos de uso no templo, sem especificar além do texto.
- source_word: תְּרוּמַת
  choice: a contribuição
  rationale: O substantivo designa algo separado e doado, muitas vezes para uso sagrado. “Contribuição” expressa a doação dos bens sem sugerir um rito sacrificial específico.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: a casa do nosso Deus
  rationale: Mantém a imagem concreta e a forma do hebraico; no contexto, a expressão se refere ao templo.
- source_word: הֵרִימוּ
  choice: haviam oferecido
  rationale: No hiphil, o verbo pode indicar a apresentação de uma contribuição. O mais-que-perfeito deixa claro que a oferta ocorreu antes da pesagem.
- source_word: יֹעֲצָיו וְשָׂרָיו
  choice: seus conselheiros, seus oficiais
  rationale: “Conselheiros” traduz os que aconselhavam o rei; “oficiais” comunica a função administrativa de שָׂרִים no contexto persa sem pressupor ascendência real.
- source_word: וְכָל־יִשְׂרָאֵל הַנִּמְצָאִים
  choice: e todos os israelitas ali presentes
  rationale: A expressão coletiva “todo Israel” é vertida de modo natural em português, e הַנִּמְצָאִים identifica os que se encontravam presentes.
theological_decisions:
- issue: Sentido cultual de תְּרוּמָה
  choice: a contribuição
  alternative: a oferta
  rationale: “Contribuição” preserva a ideia de bens doados e separados para uso sagrado sem transformar a expressão numa categoria sacrificial mais específica do que o contexto permite.
- issue: Imagem de בֵּית אֱלֹהֵינוּ
  choice: a casa do nosso Deus
  alternative: o templo do nosso Deus
  rationale: Embora o referente seja o templo, “casa” conserva a imagem do texto hebraico e evita substituir a expressão por sua interpretação contextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da lista e a aposição explicativa da contribuição foram preservadas; o travessão ajuda a mostrar que a prata, o ouro e os utensílios constituíam a contribuição.
