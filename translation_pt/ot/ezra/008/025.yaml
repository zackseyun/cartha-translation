revisions:
- from: Pesei e entreguei a eles a prata, o ouro e os utensílios — a contribuição para a casa do nosso Deus que o rei, seus conselheiros, seus oficiais e todos os israelitas ali presentes haviam oferecido.
  to: Pesei-lhes a prata, o ouro e os utensílios — a contribuição[a] para a casa do nosso Deus, que o rei, seus conselheiros, seus oficiais e todo o Israel que estava presente haviam oferecido.
  rationale: A revisão remove a ação adicional de “entregar”, preservando o ato literal de pesar e o dativo “a eles” em “pesei-lhes”. Também mantém a expressão coletiva “todo o Israel” e fornece uma nota lexical para “contribuição”, em consonância com a ambiguidade semântica de תְּרוּמָה.
