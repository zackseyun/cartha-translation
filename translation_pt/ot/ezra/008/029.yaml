id: EZR.8.29
reference: Ezra 8:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: pt
  text: Fiquem atentos[a] e guardem essas coisas até que as pesem diante dos chefes dos sacerdotes e dos levitas e dos chefes das casas paternas de Israel, em Jerusalém, nas câmaras da casa de Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Sejam diligentes e guardem essas coisas”. Os dois imperativos hebraicos enfatizam o cuidado vigilante com os bens confiados.
    reason: lexical_alternative
  - marker: c
    text: A “casa de Yahweh” é o templo.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁקְדוּ
  choice: Fiquem atentos
  rationale: O imperativo plural expressa atenção vigilante e diligente. A formulação é natural em português e se ajusta à responsabilidade de cuidar dos bens confiados.
- source_word: וְשִׁמְרוּ
  choice: e guardem essas coisas
  rationale: שׁמר tem o sentido de guardar, proteger ou vigiar. O objeto, não expresso neste versículo, é retomado do contexto anterior como “essas coisas”.
- source_word: עַד תִּשְׁקְלוּ
  choice: até que as pesem
  rationale: שׁקל descreve a pesagem dos objetos valiosos para prestação de contas. O pronome feminino plural retoma naturalmente “essas coisas”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa que a pesagem deveria ocorrer na presença das autoridades mencionadas.
- source_word: שָׂרֵי הַכֹּהֲנִים וְהַלְוִיִּם
  choice: os chefes dos sacerdotes e dos levitas
  rationale: A construção hebraica permite entender שָׂרֵי como regendo os dois grupos coordenados, isto é, os dirigentes tanto dos sacerdotes como dos levitas.
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: e os chefes das casas paternas de Israel
  rationale: A expressão designa líderes de grupos familiares ou casas ancestrais. “Casas paternas” preserva a imagem e a estrutura social do hebraico.
- source_word: הַלִּשְׁכוֹת
  choice: nas câmaras
  rationale: O termo indica salas ou aposentos no complexo do templo. “Câmaras” mantém o caráter arquitetônico sem especificar indevidamente que fossem depósitos.
- source_word: בֵּית יְהוָה
  choice: casa de Yahweh
  rationale: Preserva a expressão hebraica “casa de” e representa diretamente o nome divino יהוה como Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome pessoal, enquanto a nota esclarece que a “casa” é o templo.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com legibilidade brasileira. Mantém a linguagem institucional do contexto e a expressão concreta “casa de Yahweh”, explicada em nota.
