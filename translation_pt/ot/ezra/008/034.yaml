  text: Everything was counted by number and by weight, and the total weight was recorded at that time.
translation:
  language: pt
  text: Tudo foi conferido por número e por peso, e o peso total foi registrado naquela ocasião.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: por número
  rationale: מִסְפָּר indica número ou contagem. A expressão mantém a forma procedural do hebraico e, com «foi conferido», comunica naturalmente a verificação dos objetos.
- source_word: בְּמִשְׁקָל
  choice: por peso
  rationale: מִשְׁקָל significa «peso». A tradução conserva o paralelismo hebraico «por número e por peso».
- source_word: לַכֹּל
  choice: Tudo
  rationale: A expressão indica que o procedimento abrangia a totalidade dos bens. Anteposta, «Tudo» produz uma frase clara e idiomática em português.
- source_word: וַיִּכָּתֵב
  choice: foi registrado
  rationale: O nifal de כתב é passivo, literalmente «foi escrito». No contexto administrativo, «foi registrado» expressa com precisão a documentação formal.
- source_word: כָּל הַמִּשְׁקָל
  choice: o peso total
  rationale: Literalmente, «todo o peso». Em português corrente, «o peso total» comunica de modo claro o valor global anotado, sem sugerir que apenas alguns pesos foram registrados.
- source_word: בָּעֵת הַהִיא
  choice: naquela ocasião
  rationale: A expressão temporal remete ao momento da entrega e verificação. «Naquela ocasião» preserva o demonstrativo e soa natural no contexto narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Conferido» reúne naturalmente as ações administrativas de contar e pesar sem apagar os dois critérios explicitados em seguida. Não há questão teológica específica neste versículo nem ambiguidade que exija nota.
