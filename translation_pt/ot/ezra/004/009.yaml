  text: אֱדַ֜יִן רְח֣וּם בְּעֵל טְעֵ֗ם וְ/שִׁמְשַׁי֙ סָֽפְרָ֔/א וּ/שְׁאָ֖ר כְּנָוָתְ/ה֑וֹן דִּ֠ינָיֵ/א וַ/אֲפַרְסַתְכָיֵ֞/א טַרְפְּלָיֵ֣/א אֲפָֽרְסָיֵ֗/א ארכוי בָבְלָיֵ/א֙ שֽׁוּשַׁנְכָיֵ֔/א ד/הוא עֵלְמָיֵֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: pt
  text: Então Reum, o alto funcionário[a], Sinsai, o escriba, e o restante de seus associados — os dinaítas[b], os afarsatequitas[c], os tarpelitas, os persas, os habitantes de Ereque, os babilônios e os habitantes de Susã (isto é, os elamitas) —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sentido exato do título aramaico é incerto. Também pode ser traduzido por “comandante”, “chanceler” ou “encarregado de decretos”.
    reason: alternative_rendering
  - marker: b
    text: Ou “os juízes”. O termo aramaico pode ser entendido como nome de um povo ou como título administrativo.
    reason: alternative_reading
  - marker: c
    text: Nome de identificação incerta. Alguns entendem o termo aramaico como uma designação de funcionários.
    reason: textual_or_lexical_uncertainty
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Advérbio aramaico que assinala a etapa seguinte da narrativa ou da fórmula documental; “Então” preserva a sequência com naturalidade.
- source_word: רְחוּם
  choice: Reum
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio aramaico.
- source_word: בְּעֵל טְעֵם
  choice: o alto funcionário
  rationale: O título administrativo é incerto. A expressão indica alguém investido de autoridade; “alto funcionário” comunica essa condição sem atribuir uma função específica que o aramaico não estabelece com segurança.
- source_word: שִׁמְשַׁי
  choice: Sinsai
  rationale: Forma aportuguesada e reconhecível do nome próprio, adequada à leitura corrente em português.
- source_word: סָפְרָא
  choice: o escriba
  rationale: Designa um escriba ou secretário no contexto administrativo. “Escriba” é literal, conciso e familiar aos leitores da Bíblia.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: os demais colegas deles
  rationale: Expressa o restante das pessoas vinculadas aos dois funcionários; “colegas” se ajusta ao contexto oficial e é natural em português.
- source_word: דִּינָיֵא
  choice: os dinaítas
  rationale: No contexto de uma série de grupos populacionais, a transliteração conserva a leitura étnica tradicional e evita transformar em certeza a possível interpretação administrativa “juízes”.
- source_word: אֲפַרְסַתְכָיֵא
  choice: os afarsatequitas
  rationale: Termo de identificação incerta. A transliteração evita impor o sentido conjectural de “funcionários” e preserva a ambiguidade do aramaico.
- source_word: טַרְפְּלָיֵא
  choice: os tarpelitas
  rationale: Nome de grupo cuja identificação é incerta; a transliteração é a opção mais transparente.
- source_word: אֲפָרְסָיֵא
  choice: os persas
  rationale: Designação étnica normalmente entendida como referência aos persas.
- source_word: ארכוי
  choice: os habitantes de Ereque
  rationale: Gentílico ligado a Ereque (Uruk); a forma descritiva é mais clara em português do que um gentílico raro.
- source_word: בָבְלָיֵא
  choice: os babilônios
  rationale: Gentílico inequívoco referente à Babilônia.
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: os habitantes de Susã, isto é, os elamitas
  rationale: Reproduz a identificação explicativa do texto aramaico entre os habitantes de Susã e os elamitas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A enumeração mantém o caráter documental do aramaico. O travessão final foi preservado porque a frase continua no versículo seguinte. Os nomes obscuros foram transliterados em vez de receberem sentidos administrativos conjecturais.
