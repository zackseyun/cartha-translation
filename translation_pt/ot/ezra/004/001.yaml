  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: pt
  text: 'Os adversários de Judá e Benjamim ouviram que os filhos do exílio[a] estavam construindo um templo para Yahweh, o Deus de Israel.


    [a] Hebraico: “os filhos do exílio”; isto é, a comunidade daqueles que haviam sido levados para o exílio e retornado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos do exílio”; isto é, a comunidade daqueles que haviam sido levados para o exílio e retornado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ouviram
  rationale: O wayyiqtol de שׁמע relata um acontecimento passado simples. “Ouviram” traduz diretamente o verbo sem acrescentar um marcador temporal ausente no hebraico.
- source_word: צָרֵי
  choice: adversários
  rationale: O plural construto de צַר designa pessoas ou grupos hostis. “Adversários” mantém esse sentido sem sugerir necessariamente conflito militar.
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: Judá e Benjamim
  rationale: São nomes tribais e regionais, vertidos segundo suas formas portuguesas consagradas.
- source_word: כִּי
  choice: que
  rationale: Aqui כִּי introduz o conteúdo daquilo que os adversários ouviram, e não uma causa.
- source_word: בְנֵי הַגּוֹלָה
  choice: os filhos do exílio
  rationale: A tradução conserva a expressão hebraica, que identifica a comunidade vinculada ao grupo deportado. A nota esclarece o sentido coletivo sem inserir “retornados” no texto principal.
- source_word: בּוֹנִים
  choice: estavam construindo
  rationale: O particípio expressa uma ação em andamento no contexto da narrativa passada. “Construindo”, em vez de “reconstruindo”, evita acrescentar ao verbo uma ideia não explicitada lexicalmente.
- source_word: הֵיכָל
  choice: templo
  rationale: Embora הֵיכָל também possa significar “palácio”, a referência explícita a Yahweh, Deus de Israel, estabelece aqui o sentido de templo.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica para quem o templo estava sendo construído; “para” é natural em português.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta que identifica Yahweh como o Deus de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título, sem impor ao versículo uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação “filhos do exílio” preserva deliberadamente o idioma hebraico e é explicada em nota. Não se acrescenta “Agora” no início, pois o texto-fonte não contém um advérbio temporal explícito.
