  text: וְ/סֹכְרִ֧ים עֲלֵי/הֶ֛ם יוֹעֲצִ֖ים לְ/הָפֵ֣ר עֲצָתָ֑/ם כָּל יְמֵ֗י כּ֚וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס וְ/עַד מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: pt
  text: E contrataram conselheiros contra eles, a fim de frustrar o plano deles[a], durante todo o tempo de Ciro, rei da Pérsia, até o reinado de Dario, rei da Pérsia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “frustrar o conselho deles” ou “frustrar o propósito deles”. A palavra hebraica עֵצָה pode significar “conselho”, “plano” ou “propósito”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֹכְרִים
  choice: E contrataram
  rationale: O verbo שׂכר, neste contexto, indica pagar pelos serviços de alguém. “Contrataram” é natural em português e não introduz a ideia mais específica de suborno.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: O contexto hostil e a finalidade expressa em seguida conferem à preposição sentido adversativo.
- source_word: יוֹעֲצִים
  choice: conselheiros
  rationale: O termo derivado de יעץ designa pessoas que dão conselho e se ajusta ao contexto político-administrativo.
- source_word: לְהָפֵר
  choice: a fim de frustrar
  rationale: הפר pode significar romper, anular ou fazer fracassar; com “plano” como objeto, “frustrar” comunica claramente a obstrução pretendida.
- source_word: עֲצָתָם
  choice: seu plano
  rationale: עֵצָה admite os sentidos de conselho, plano ou propósito. “Plano” é claro no contexto da reconstrução, enquanto a nota preserva a alternativa lexical genuína.
- source_word: כָּל יְמֵי
  choice: durante todo o tempo de
  rationale: A expressão temporal indica a duração integral do período, e esta formulação é corrente e clara em português moderno.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: Ciro, rei da Pérsia
  rationale: O nome é transliterado em sua forma portuguesa consagrada e o título real é traduzido.
- source_word: וְעַד
  choice: até
  rationale: A construção marca a continuidade da oposição desde o tempo de Ciro até o reinado de Dario; “até” expressa isso naturalmente sem acrescentar ênfase desnecessária.
- source_word: מַלְכוּת
  choice: o reinado
  rationale: Nesta construção temporal, מַלְכוּת se refere ao período de governo do rei, não ao território do reino.
- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: Dario, rei da Pérsia
  rationale: O nome aparece em sua forma portuguesa consagrada, acompanhado do título traduzido.
