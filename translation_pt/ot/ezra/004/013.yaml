base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: pt
  text: Agora, saiba o rei que, se esta cidade for reconstruída e suas muralhas forem concluídas, eles não pagarão tributo, imposto nem pedágio, e, por fim, isso prejudicará os reis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, por fim, isso causará prejuízo às receitas dos reis”. A expressão aramaica é concisa, e a referência específica às receitas é inferida do contexto de tributos, impostos e pedágios não pagos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Agora
  rationale: Advérbio discursivo aramaico que introduz a advertência; “Agora” preserva naturalmente sua força de transição.
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: saiba o rei
  rationale: Reproduz de modo digno e conciso a fórmula oficial de notificação, sem recorrer ao menos natural “seja conhecido ao rei”.
- source_word: דִּי הֵן
  choice: que, se
  rationale: Introduz o conteúdo da notificação por meio de uma condição.
- source_word: קִרְיְתָא דָךְ
  choice: esta cidade
  rationale: Mantém a força dêitica do demonstrativo aramaico referente a Jerusalém.
- source_word: תִּתְבְּנֵא
  choice: for reconstruída
  rationale: O passivo no contexto condicional indica a eventual reconstrução da cidade.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: e suas muralhas forem concluídas
  rationale: Expressa que as fortificações da cidade seriam levadas à conclusão.
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: tributo, imposto nem pedágio
  rationale: Preserva três categorias fiscais distintas da terminologia administrativa persa; “nem” é natural após a negação verbal em português.
- source_word: לָא יִנְתְּנוּן
  choice: eles não pagarão
  rationale: Embora o verbo signifique literalmente “dar”, “pagar” é o equivalente idiomático no contexto fiscal; o sujeito plural permanece indeterminado.
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: e por fim isso causará prejuízo às receitas dos reis
  rationale: Traduz a expressão concisa segundo o contexto de arrecadação perdida, deixando em nota a alternativa mais literal e menos específica.
