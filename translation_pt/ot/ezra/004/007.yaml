base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: pt
  text: Nos dias de Artaxerxes, Bislão, Mitredate, Tabeel e os demais companheiros dele[a] escreveram a Artaxerxes, rei da Pérsia. O texto da carta foi escrito em aramaico e traduzido em aramaico.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e os demais companheiros deles”. O sufixo de “companheiros” está no singular, mas pode referir-se coletivamente ao grupo.
    reason: lexical_alternative
  - marker: b
    text: Ou “O documento foi escrito com caracteres aramaicos e traduzido para o aramaico”. A formulação hebraico-aramaica é difícil. Pode distinguir entre a escrita e a língua, ou entre o ato de escrever e o de traduzir ou interpretar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: Nos dias de
  rationale: Preserva o idiomatismo temporal e a ligação narrativa sem convertê-lo, de modo interpretativo, numa fórmula técnica de reinado.
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: Artaxerxes
  rationale: Forma tradicional e amplamente reconhecida do nome real em português.
- source_word: כָּתַב
  choice: escreveram
  rationale: O verbo significa simplesmente “escrever”; não se acrescenta “acusação” nem outro objeto que o versículo não explicita.
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: Bislão, Mitredate, Tabeel
  rationale: Transliterações portuguesas claras dos nomes pessoais, em consonância com o uso bíblico corrente.
- source_word: וּשְׁאָר כנותו
  choice: e os demais companheiros dele
  rationale: “Companheiros” comunica o sentido provável do substantivo raro; “dele” conserva o sufixo singular do texto, sem ocultar a possibilidade de referência coletiva.
- source_word: עַל
  choice: a
  rationale: Com o verbo “escrever” neste contexto administrativo, a preposição introduz naturalmente o destinatário da comunicação.
- source_word: מֶלֶךְ פָּרָס
  choice: rei da Pérsia
  rationale: Mantém o título real em aposição ao nome de Artaxerxes.
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: O texto da carta
  rationale: Expressa de modo natural a referência ao conteúdo escrito do documento, sem insistir em um valor incerto como “cópia”.
- source_word: כָּתוּב אֲרָמִית וּמְתֻרְגָּם אֲרָמִית
  choice: foi escrito em aramaico e traduzido em aramaico
  rationale: Mantém a repetição e a dificuldade do original, em vez de decidir silenciosamente se a primeira expressão se refere à escrita aramaica e a segunda à língua, ou se há uma distinção entre redação e tradução/interpretação.
