base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: pt
  text: Fique o rei sabendo que os judeus[a] que subiram de junto do rei até nós chegaram a Jerusalém. Eles estão reconstruindo a cidade rebelde e perversa, concluindo as muralhas e reparando os alicerces[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeanos”. O termo aramaico pode designar o povo de Judá/Judeia, bem como os judeus em sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “assentando os alicerces”. A expressão aramaica é um tanto difícil e pode se referir tanto ao reparo de alicerces existentes quanto à sua colocação.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: Fique o rei sabendo
  rationale: Reproduz de modo natural e digno a fórmula epistolar aramaica usada para apresentar uma informação oficial ao rei.
- source_word: יְהוּדָיֵא
  choice: os judeus
  rationale: É a designação mais reconhecível em português; o termo também pode indicar especificamente os habitantes ou naturais de Judá/Judeia, alternativa preservada em nota.
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא
  choice: subiram de onde o rei está até nós
  rationale: Preserva o sentido ascendente de סלק e os pontos de referência do remetente e do destinatário, evitando o uso ambíguo ou excessivamente arcaico de pronomes de segunda pessoa para o rei.
- source_word: אֲתוֹ לִירוּשְׁלֶם
  choice: chegaram a Jerusalém
  rationale: Expressa claramente a chegada ao destino específico, retomada pelo segundo verbo de movimento no aramaico.
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: a cidade rebelde e perversa
  rationale: Mantém o caráter hostil e acusatório dos qualificativos empregados pelos autores da carta.
- source_word: בָּנַיִן
  choice: estão reconstruindo
  rationale: O contexto é a restauração de uma cidade anteriormente existente; 'reconstruindo' comunica isso naturalmente.
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: concluindo as muralhas
  rationale: O substantivo designa as muralhas da cidade, e o verbo comunica a ideia de completar ou levar a termo.
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: reparando os alicerces
  rationale: A expressão aramaica é difícil; esta opção se ajusta ao contexto de restauração sem ocultar em nota a possibilidade de se tratar de assentar ou colocar os alicerces.
