translation_notes:
  register: Português atual, formal e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação mantém o tom oficial e acusatório da carta. O marcador [a] foi colocado junto de “judeus”, e [b] junto de “alicerces”, os termos efetivamente explicados pelas respectivas notas.
