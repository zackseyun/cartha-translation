base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/004.yaml
  text: Then the people of the land kept weakening the hands of the people of Judah and frightening them from building[a][b].
translation:
  language: pt
  text: Então o povo da terra continuou enfraquecendo as mãos[a] do povo de Judá e amedrontando-o para que não construísse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «enfraquecendo as mãos de», expressão que significa desanimar ou minar a determinação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «e o fazia ter medo de construir».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Então
  rationale: Introduz a etapa seguinte da narrativa de modo natural, sem recorrer à fórmula arcaica «e aconteceu que».
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Preserva a expressão hebraica e designa, no contexto, a população local que se opunha aos repatriados.
- source_word: מְרַפִּים יְדֵי
  choice: continuou enfraquecendo as mãos de
  rationale: Mantém a imagem idiomática hebraica de reduzir a força e a determinação; «continuou» comunica o caráter persistente expresso pela construção verbal.
- source_word: עַם יְהוּדָה
  choice: o povo de Judá
  rationale: Tradução direta da expressão que identifica a comunidade judaíta empenhada na reconstrução.
- source_word: וּמְבַלְהִים
  choice: e amedrontando
  rationale: O verbo expressa causar medo, perturbação ou pânico; «amedrontando» é claro e adequado ao paralelismo.
- source_word: אוֹתָם
  choice: -o
  rationale: O pronome retoma coletivamente «o povo de Judá»; a concordância no singular torna a frase natural em português.
- source_word: לִבְנוֹת
  choice: para que não construísse
  rationale: Explicita, conforme o contexto, que o medo tinha por efeito dissuadir a comunidade de construir, sem transformar a finalidade hostil em uma ordem para construir.
