base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/008.yaml
  text: Rehum the commander and Shimshai the scribe wrote a letter against Jerusalem to King Artaxerxes as follows:[a]
translation:
  language: pt
  text: Reum, o alto funcionário, e Sinsai, o escriba, escreveram uma carta contra Jerusalém ao rei Artaxerxes, nos seguintes termos:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o chanceler”. O título aramaico בְּעֵל טְעֵם é uma designação oficial cujo equivalente exato na administração persa é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵל טְעֵם
  choice: o alto funcionário
  rationale: Trata-se de um título administrativo aramaico cujo equivalente persa exato é incerto. “Alto funcionário” comunica autoridade oficial sem atribuir um cargo específico não demonstrável.
- source_word: סָפְרָא
  choice: o escriba
  rationale: O termo designa um oficial com funções de escrita ou secretaria; “escriba” preserva a ligação lexical e é corrente no registro bíblico em português.
- source_word: כְּתַבוּ
  choice: escreveram
  rationale: Reproduz diretamente o sentido verbal, sem acrescentar a ideia de envio ou composição formal.
- source_word: אִגְּרָה חֲדָה
  choice: uma carta
  rationale: Embora חֲדָה possa significar literalmente “uma”, no aramaico imperial a expressão introduz naturalmente uma carta; “uma carta” evita uma ênfase indevida na quantidade.
- source_word: עַל יְרוּשְׁלֶם
  choice: contra Jerusalém
  rationale: O contexto é acusatório e hostil, favorecendo o sentido adversativo de עַל em vez do mais neutro “sobre”.
- source_word: לְאַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: ao rei Artaxerxes
  rationale: Segue a ordem idiomática natural do português e preserva título e nome.
- source_word: כְּנֵמָא
  choice: 'nos seguintes termos:'
  rationale: A expressão introduz o teor da carta apresentado na sequência; esta formulação é natural e clara em português.
- source_word: רְחוּם
  choice: Reum
  rationale: Transliteração portuguesa tradicional e reconhecível do nome pessoal.
- source_word: שִׁמְשַׁי
  choice: Sinsai
  rationale: Transliteração adaptada à fonologia e às convenções ortográficas do português.
- source_word: אַרְתַּחְשַׁשְׂתְּא
  choice: Artaxerxes
  rationale: Forma tradicional do nome real em português.
