  source_fidelity: 'A tradução reproduz fielmente a progressão e o sentido do hebraico: a aproximação a Zorobabel e aos líderes familiares, a proposta volitiva de construir junto, a alegação de buscar o Deus dos destinatários e a referência aos sacrifícios desde os dias de Esar-Hadom. “Chefes das famílias” é uma equivalência natural para a expressão de liderança dos grupos parentais, sem alterar seu referente. “Que nos trouxe para cá” comunica adequadamente o particípio causativo final.'
