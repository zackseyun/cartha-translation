  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ אֶל זְרֻבָּבֶ֜ל וְ/אֶל רָאשֵׁ֣י הָֽ/אָב֗וֹת וַ/יֹּאמְר֤וּ לָ/הֶם֙ נִבְנֶ֣ה עִמָּ/כֶ֔ם כִּ֣י כָ/כֶ֔ם נִדְר֖וֹשׁ לֵֽ/אלֹהֵי/כֶ֑ם ו/לא אֲנַ֣חְנוּ זֹבְחִ֗ים מִ/ימֵי֙ אֵסַ֤ר חַדֹּן֙ מֶ֣לֶךְ אַשּׁ֔וּר הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ פֹּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: pt
  text: 'Então eles se aproximaram de Zorobabel e dos chefes das famílias e lhes disseram: “Vamos construir com vocês, pois, assim como vocês, buscamos o Deus de vocês[b] e temos oferecido sacrifícios a ele[a] desde os dias de Esar-Hadom, rei da Assíria, que nos trouxe para cá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico escrito traz literalmente “e não nós oferecemos sacrifícios”, mas a leitura tradicional indica “e a ele nós oferecemos sacrifícios”; o contexto também favorece o sentido afirmativo.
    reason: textual_variant
  - marker: b
    text: Ou “adoramos o Deus de vocês” ou “consultamos o Deus de vocês”. O verbo hebraico traduzido como “buscamos” pode ter essas conotações religiosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: eles se aproximaram
  rationale: Expressa naturalmente o movimento em direção a Zorobabel e aos líderes, preservando a sequência narrativa do hebraico.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: chefes das famílias
  rationale: Comunica em português atual a função dos líderes dos grupos ancestrais sem recorrer à expressão pouco natural “chefes dos pais”.
- source_word: נִבְנֶה עִמָּכֶם
  choice: Vamos construir com vocês
  rationale: O imperfeito da primeira pessoa do plural tem sentido volitivo; “vamos construir” preserva a proposta ou convite, sem acrescentar a ideia explícita de mera ajuda.
- source_word: כִּי כָכֶם
  choice: pois, assim como vocês
  rationale: Introduz a semelhança alegada como fundamento da proposta e liga naturalmente a comparação ao verbo seguinte.
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: buscamos o Deus de vocês
  rationale: “Buscar” preserva a amplitude de דרשׁ, que neste contexto pode envolver devoção, culto ou consulta religiosa, sem resolver a ambiguidade em favor de apenas um desses sentidos.
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: e temos oferecido sacrifícios a ele
  rationale: A tradução segue o sentido afirmativo indicado pelo contexto e pela leitura tradicional, enquanto a dificuldade do texto hebraico escrito é explicitada em nota.
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: desde os dias de Esar-Hadom
  rationale: A preposição com “dias” indica o ponto inicial de uma prática que os falantes afirmam continuar; “desde os dias de” é idiomático e mantém a forma temporal do hebraico.
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: que nos trouxe para cá
  rationale: Reproduz de modo natural o sentido causativo do particípio e o destino expresso por “aqui”, sem impor ao português uma direção vertical que pode ser apenas idiomática no hebraico.
theological_decisions:
- issue: Alegação religiosa dos colonos
  choice: Relatar de modo neutro que eles “buscam” o Deus de Israel e lhe oferecem sacrifícios.
  alternative: Traduzir como “adoramos o Deus de vocês” ou formular a declaração de modo a negar sua sinceridade.
  rationale: O versículo registra a alegação dos próprios falantes. A narrativa mais ampla cria tensão quanto à natureza de sua devoção, mas a tradução deste enunciado não deve confirmar nem rejeitar antecipadamente sua legitimidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Chefes das famílias” evita um hebraísmo opaco; “o Deus de vocês” deixa claro que o possessivo hebraico é plural. Os marcadores foram colocados junto às expressões a que suas respectivas notas se referem.
