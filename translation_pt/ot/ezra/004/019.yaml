base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: pt
  text: E eu ordenei que investigassem, e descobriram que esta cidade, desde tempos antigos, tem se levantado contra reis[a], e que nela são praticadas rebelião e sedição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tem se exaltado contra reis”. O verbo aramaico pode sugerir autoexaltação, mas, neste contexto, tem o sentido de levantar-se em oposição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nela são praticadas rebelião e insurreição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: E dei ordem
  rationale: A expressão administrativa aramaica significa literalmente que uma ordem foi estabelecida e procedeu do rei. A formulação ativa é natural em português e mantém explícita a autoridade do remetente.
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: para que se fizesse uma investigação. Verificou-se
  rationale: Os verbos descrevem uma pesquisa oficial nos registros e seu resultado. A redação portuguesa comunica com clareza tanto o exame quanto a constatação.
- source_word: קִרְיְתָא דָךְ
  choice: essa cidade
  rationale: O demonstrativo aponta para a cidade em discussão na correspondência real; “essa” é a escolha dêitica mais natural neste contexto em português.
- source_word: מִן יוֹמָת עָלְמָא
  choice: desde os tempos antigos
  rationale: Expressão idiomática aramaica de antiguidade, vertida de modo atual e digno.
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: tem se levantado contra os reis
  rationale: A forma reflexiva pode sugerir exaltação própria, mas no contexto político indica erguer-se em oposição. A escolha preserva essa nuance sem antecipar o substantivo explícito “rebelião”.
- source_word: וּמְרַד וְאֶשְׁתַּדּוּר
  choice: rebeliões e sedições
  rationale: Os dois termos políticos são próximos, mas distintos. “Rebeliões” expressa revolta contra a autoridade real, enquanto “sedições” conserva a ideia de atividade subversiva.
- source_word: מִתְעֲבֶד בַּהּ
  choice: nela têm ocorrido
  rationale: A construção passiva ou impessoal indica que tais atos se davam na cidade. “Têm ocorrido” é natural em português e não força uma agência ausente do texto.
