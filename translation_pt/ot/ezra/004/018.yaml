  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: pt
  text: O documento que vocês nos enviaram foi lido claramente diante de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A carta que vocês nos enviaram foi lida claramente diante de mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: o documento
  rationale: Termo do aramaico imperial para uma comunicação oficial escrita. “Documento” preserva a amplitude administrativa do termo; “carta” também é possível.
- source_word: דִּי
  choice: que
  rationale: Partícula relativa que introduz a oração modificadora de “documento”; “que” é a forma natural em português.
- source_word: שְׁלַחְתּוּן
  choice: vocês enviaram
  rationale: Perfeito aramaico na segunda pessoa masculina plural. O pretérito perfeito exprime naturalmente a ação concluída no contexto da resposta real.
- source_word: עֲלֶינָא
  choice: nos
  rationale: No contexto epistolar, a preposição indica que o documento foi enviado ao rei e à corte, e não “contra nós”.
- source_word: מְפָרַשׁ
  choice: claramente
  rationale: Expressa que a leitura foi feita de modo claro ou distinto, sem decidir se houve também tradução ou explicação.
- source_word: קֱרִי
  choice: foi lido
  rationale: 'A forma tem sentido passivo no contexto: o documento foi lido, provavelmente em voz alta, na presença do rei.'
- source_word: קָדָמָי
  choice: diante de mim
  rationale: Expressão de corte que indica uma ação realizada na presença do rei; “diante de mim” mantém o tom formal e conciso.
