  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o caráter fragmentário de uma lista de remetentes e a transição formal para o corpo da carta. Os títulos de Osnapar mantêm o tom cortesão sem arcaísmo excessivo.
