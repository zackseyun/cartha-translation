base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/010.yaml
  text: 'and the rest of the peoples whom the great and noble Osnappar deported and settled in the city of Samaria[c][b][a], and in the rest of Beyond the River—and now:'
translation:
  language: pt
  text: e o restante dos povos que o grande e ilustre Osnapar[a] deportou e assentou na cidade de Samaria, e os demais em Além do Rio[b] — e agora:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Osnapar é frequentemente identificado com o rei assírio Assurbanípal, mas a tradução mantém a forma aramaica do nome encontrada no texto.
    reason: cross_reference
  - marker: b
    text: 'Ou: “além do Rio”. “Além do Rio” era uma designação administrativa persa para a região a oeste do rio Eufrates.'
    reason: cultural_note
  - marker: c
    text: A expressão final é uma fórmula epistolar aramaica. Outras traduções possíveis são “e assim por diante” ou “em tal tempo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָר אֻמַּיָּא
  choice: o restante dos povos
  rationale: Preserva o sentido coletivo de grupos populacionais que completam a enumeração iniciada no versículo anterior.
- source_word: הַגְלִי
  choice: deportou
  rationale: Exprime de modo conciso e historicamente apropriado a remoção forçada de populações para o exílio.
- source_word: אָסְנַפַּר
  choice: Osnapar
  rationale: Mantém em português a forma aramaica do nome próprio apresentada pelo texto, sem substituí-la por uma identificação histórica provável.
- source_word: רַבָּא וְיַקִּירָא
  choice: o grande e ilustre
  rationale: Reproduz os títulos honoríficos em linguagem elevada, natural e não excessivamente arcaica.
- source_word: וְהוֹתֵב הִמּוֹ
  choice: e estabeleceu
  rationale: O verbo causativo descreve o reassentamento dos povos; o objeto permanece claro a partir da oração anterior.
- source_word: בְּקִרְיָה דִּי שָׁמְרָיִן
  choice: na cidade de Samaria
  rationale: Conserva o singular do texto massorético aramaico, sem a harmonização contextual para “cidades” encontrada em algumas tradições.
- source_word: עֲבַר נַהֲרָה
  choice: Além do Rio
  rationale: A capitalização assinala a designação administrativa persa da região a oeste do Eufrates, ao mesmo tempo que preserva sua forma literal.
- source_word: וּכְעֶנֶת
  choice: 'e agora:'
  rationale: Traduz a fórmula epistolar aramaica como transição para o corpo da carta; os dois-pontos tornam essa função clara.
