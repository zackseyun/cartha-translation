base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: pt
  text: Então, a obra da casa de Deus que está em Jerusalém[a] foi interrompida e permaneceu interrompida[b] até o segundo ano do reinado de Dario, rei da Pérsia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do templo de Deus». Literalmente, «da casa de Deus».'
    reason: lexical_alternative
  - marker: b
    text: A expressão indica que a obra continuou paralisada, e não apenas menciona de novo a interrupção.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: Então
  rationale: Advérbio aramaico de sequência narrativa; «Então» liga naturalmente o versículo aos acontecimentos anteriores.
- source_word: בְּטֵלַת עֲבִידַת
  choice: parou a obra
  rationale: O verbo בטל indica cessar ou ser interrompido. A formulação natural preserva a chegada da obra a uma paralisação sem especificar aqui se a construção é gramaticalmente ativa ou passiva.
- source_word: בֵּית אֱלָהָא
  choice: casa de Deus
  rationale: Tradução transparente da expressão aramaica; «templo de Deus» seria uma alternativa contextualmente correta, mas mais interpretativa.
- source_word: דִּי בִּירוּשְׁלֶם
  choice: que está em Jerusalém
  rationale: A oração relativa identifica a localização da casa de Deus; o presente soa natural em português e não introduz contraste temporal.
- source_word: וַהֲוָת בָּטְלָא
  choice: e ela permaneceu interrompida
  rationale: A combinação verbal expressa a continuidade do estado de paralisação, não uma simples repetição do primeiro verbo.
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: até o segundo ano
  rationale: Equivalente idiomático da datação ordinal aramaica.
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: do reinado de Dario
  rationale: Expressa claramente a datação pelo ano régio.
- source_word: מֶלֶךְ פָּרָס
  choice: rei da Pérsia
  rationale: Preserva o título real em aposição e segue o uso corrente em português.
