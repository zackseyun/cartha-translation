  text: כְּעַ֗ן כָּ/ל קֳבֵל֙ דִּֽי מְלַ֤ח הֵֽיכְלָ/א֙ מְלַ֔חְנָא וְ/עַרְוַ֣ת מַלְכָּ֔/א לָ֥א אֲֽרִֽיךְ לַ֖/נָא לְ/מֶֽחֱזֵ֑א עַ֨ל דְּנָ֔ה שְׁלַ֖חְנָא וְ/הוֹדַ֥עְנָא לְ/מַלְכָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: pt
  text: 'Como comemos o sal do palácio e não nos convém ver a desonra do rei, por isso enviamos e informamos o rei:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: comemos o sal do palácio
  rationale: Preserva literalmente a expressão idiomática aramaica, que indica receber sustento do palácio e, por consequência, dever-lhe lealdade.
- source_word: עַרְוַת מַלְכָּא
  choice: a desonra do rei
  rationale: Neste contexto, עַרְוָה denota desonra, prejuízo ou situação vergonhosa, não a acepção corporal literal.
- source_word: לָא אֲרִיךְ לַנָא
  choice: não nos convém
  rationale: Expressa naturalmente a ideia de que não seria apropriado ou admissível para os remetentes.
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא
  choice: enviamos esta mensagem para informar
  rationale: Torna explícito em português o objeto contextual de 'enviamos' e representa a relação coordenada com sentido de finalidade, sem alterar a ação relatada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A expressão cultural 'comemos o sal do palácio' foi mantida para preservar a imagem do original. O versículo continua sintaticamente no seguinte, por isso termina com dois-pontos.
