  text: מְהוֹדְעִ֤ין אֲנַ֨חְנָה֙ לְ/מַלְכָּ֔/א דִּ֠י הֵ֣ן קִרְיְתָ֥/א דָךְ֙ תִּתְבְּנֵ֔א וְ/שׁוּרַיָּ֖/ה יִֽשְׁתַּכְלְל֑וּן לָ/קֳבֵ֣ל דְּנָ֔ה חֲלָק֙ בַּ/עֲבַ֣ר נַהֲרָ֔/א לָ֥א אִיתַ֖י לָֽ/ךְ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: pt
  text: Informamos ao rei que, se esta cidade for reconstruída e suas muralhas forem concluídas, por causa disso o rei não terá parte[a] em Além do Rio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O aramaico também pode ser traduzido como “porção” ou, conforme o sentido administrativo do contexto, “posse” ou “receita”.
    reason: lexical_alternative
  - marker: b
    text: “Além do Rio” era a designação oficial persa para a região a oeste do rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: מְהוֹדְעִין אֲנַחְנָה
  choice: Informamos
  rationale: O particípio aramaico funciona verbalmente no estilo epistolar oficial; “Informamos” é formal, claro e natural em português moderno.
- source_word: לְמַלְכָּא
  choice: ao rei
  rationale: A preposição לְ marca o destinatário da informação; a contração “ao” expressa isso naturalmente.
- source_word: דִּי הֵן
  choice: que, se
  rationale: As partículas introduzem o conteúdo comunicado e a condição, sem necessidade de reproduzir de modo rígido um possível valor enfático de הֵן.
- source_word: קִרְיְתָא דָךְ
  choice: esta cidade
  rationale: Mantém o valor dêitico do demonstrativo aramaico e a perspectiva dos remetentes.
- source_word: תִּתְבְּנֵא
  choice: for reconstruída
  rationale: O passivo imperfeito aparece numa condição futura; o futuro do subjuntivo é a forma idiomática portuguesa nesse contexto.
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: e suas muralhas forem concluídas
  rationale: “Muralhas” expressa as fortificações urbanas, e “forem concluídas” conserva a ideia de serem levadas à conclusão.
- source_word: לָקֳבֵל דְּנָה
  choice: por causa disso
  rationale: Preserva tanto a relação de consequência quanto o demonstrativo explícito da expressão aramaica.
- source_word: חֲלָק
  choice: parte
  rationale: É o equivalente amplo e lexicalmente próximo de “porção/parte”, evitando restringir sem necessidade o sentido a receita tributária ou domínio territorial.
- source_word: בַּעֲבַר נַהֲרָא
  choice: em Além do Rio
  rationale: Trata a expressão como a designação administrativa persa da região a oeste do Eufrates, sem inserir “província” no texto principal.
- source_word: לָא אִיתַי לָךְ
  choice: o rei não terá
  rationale: A construção existencial com dativo indica posse. Repetir “o rei” evita o ambíguo “você” e mantém um tratamento formal e natural em português brasileiro.
