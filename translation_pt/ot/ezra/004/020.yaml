base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: pt
  text: Houve reis poderosos que governavam Jerusalém e dominavam toda a região do Além do Rio[a]; e o tributo, o imposto e o pedágio[b] lhes eram pagos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o Além do Rio”. A expressão era uma designação oficial do território imperial a oeste do rio Eufrates.'
    reason: cultural_note
  - marker: b
    text: Os três termos designam categorias distintas de receita imperial. Outras traduções possíveis incluem “tributo, taxa e pedágio” ou “tributo, imposto e tarifa alfandegária”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: reis poderosos
  rationale: Traduz diretamente o substantivo plural e o adjetivo aramaicos; “poderosos” comunica força e autoridade política em português atual.
- source_word: הֲווֹ עַל יְרוּשְׁלֶם
  choice: Houve reis poderosos que governaram Jerusalém
  rationale: A preposição indica autoridade sobre Jerusalém, não apenas localização. A formulação verbal é natural em português e preserva o sentido de governo.
- source_word: שַׁלִּיטִין
  choice: dominaram
  rationale: Expressa o exercício efetivo de domínio. O pretérito perfeito concorda naturalmente com a apresentação histórica dos reis, embora o particípio aramaico também permita a ideia de “exerciam domínio”.
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: toda a região do Além do Rio
  rationale: “Além do Rio” conserva a designação administrativa imperial, enquanto “região” esclarece para o leitor moderno que se trata de um território.
- source_word: מִדָּה בְלוֹ וַהֲלָךְ
  choice: o tributo, o imposto e o pedágio
  rationale: Mantém três categorias distintas de receita imperial. “Pedágio” comunica adequadamente uma cobrança ligada a trânsito ou transporte.
- source_word: מִתְיְהֵב לְהוֹן
  choice: lhes eram pagos
  rationale: Preserva a construção passiva e identifica os reis como destinatários das receitas.
