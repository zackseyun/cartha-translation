  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: pt
  text: 'Mas Zorobabel, Jesua e os demais chefes das famílias de Israel lhes disseram: “Vocês não têm parte conosco na construção de uma casa[b] para o nosso Deus, pois somente nós[a] a construiremos para Yahweh, o Deus de Israel, conforme nos ordenou o rei Ciro, rei da Pérsia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “nós juntos a construiremos”. Neste contexto, “juntos” contrasta os construtores israelitas com os que se ofereceram para participar.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “casa” se refere ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: Zorobabel, Jesua
  rationale: Emprega as formas tradicionais e reconhecíveis em português; “Jesua” distingue a forma hebraica יֵשׁוּעַ de “Josué”.
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: e os demais chefes das famílias paternas de Israel
  rationale: Expressa a liderança dos grupos familiares sem recorrer ao pouco natural “cabeças dos pais”, preservando a estrutura social indicada pelo hebraico.
- source_word: לֹא לָכֶם וָלָנוּ
  choice: Vocês não têm parte conosco
  rationale: 'Comunica de modo natural a força excludente da expressão hebraica: os interlocutores não participariam com os líderes de Israel nessa obra.'
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  choice: na construção de uma casa para o nosso Deus
  rationale: Mantém o sentido básico de בַּיִת, “casa”, deixando em nota sua referência contextual ao templo.
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: pois somente nós a construiremos
  rationale: No contraste do contexto, יַחַד indica o grupo israelita agindo em conjunto, sem os parceiros que se ofereceram; a nota preserva a forma mais literal “juntos”.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: para Yahweh, o Deus de Israel
  rationale: Translitera o nome divino expresso pelo Tetragrama e conserva o aposto identificador.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: conforme nos ordenou
  rationale: Preserva tanto a ideia de conformidade quanto a força oficial do verbo צוה.
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: o rei Ciro, rei da Pérsia
  rationale: Mantém a repetição solene do título real presente no hebraico, em formulação natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Sentido excludente de לֹא לָכֶם וָלָנוּ e יַחַד
  choice: Vocês não têm parte conosco... somente nós
  alternative: Não cabe a vocês e a nós... nós juntos
  rationale: O contexto imediato indica recusa de uma obra conjunta. A tradução explicita essa força sem atribuir ao texto uma razão teológica não declarada, e a nota conserva a possibilidade de uma versão mais literal de יַחַד.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se “casa” e a repetição de “rei” para refletir o hebraico, enquanto expressões sociais e idiomáticas foram vertidas de modo natural.
