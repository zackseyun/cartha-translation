source:
  edition: WLC
  text: אֱדַ֗יִן מִן דִּ֞י פַּרְשֶׁ֤גֶן נִשְׁתְּוָנָ/א֙ דִּ֚י ארתחששתא מַלְכָּ֔/א קֱרִ֧י קֳדָם רְח֛וּם וְ/שִׁמְשַׁ֥י סָפְרָ֖/א וּ/כְנָוָתְ/ה֑וֹן אֲזַ֨לוּ בִ/בְהִיל֤וּ לִ/ירֽוּשְׁלֶם֙ עַל יְה֣וּדָיֵ֔/א וּ/בַטִּ֥לוּ הִמּ֖וֹ בְּ/אֶדְרָ֥ע וְ/חָֽיִל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: pt
  text: Então, assim que a cópia da carta do rei Artaxerxes foi lida diante de Reum, de Sinsai, o escriba, e dos seus companheiros, eles foram depressa a Jerusalém, contra os judeus[a], e os obrigaram a parar pela força e pelo poder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até os judeus”. A preposição aramaica também pode indicar simples direção, embora o contexto seguinte favoreça o sentido hostil.
    reason: lexical_alternative
  - marker: b
    text: Ou “com força e vigor”; literalmente, a primeira expressão contém a ideia de “braço”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e claro em português.
- source_word: מִן דִּי
  choice: assim que
  rationale: Neste contexto temporal, introduz a ação imediatamente posterior à leitura da carta.
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: a cópia da carta
  rationale: פַּרְשֶׁגֶן indica cópia ou transcrição, e נִשְׁתְּוָנָא designa uma comunicação oficial escrita.
- source_word: קֱרִי קֳדָם
  choice: foi lida diante de
  rationale: Expressa a leitura do documento na presença dos oficiais, preservando a construção passiva do contexto.
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: Reum, Sinsai, o escriba, e seus companheiros
  rationale: Usa formas portuguesas tradicionais dos nomes; סָפְרָא é vertido de modo transparente por “escriba”, e כְנָוָתְהוֹן por “companheiros” no sentido de associados.
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: foram depressa
  rationale: Conserva tanto o movimento quanto a urgência em linguagem portuguesa corrente.
- source_word: עַל יְהוּדָיֵא
  choice: contra os judeus
  rationale: עַל pode marcar movimento hostil; a ação coercitiva que vem em seguida favorece “contra”, embora a ideia simples de direção também seja possível.
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: os obrigaram a parar
  rationale: 'Reproduz explicitamente o valor causativo: fizeram os judeus cessar a atividade mencionada no contexto.'
- source_word: בְּאֶדְרָע וְחָיִל
  choice: pela força e pelo poder
  rationale: Comunica coerção e superioridade de força sem reduzir a expressão a persuasão ou mera autoridade administrativa.
