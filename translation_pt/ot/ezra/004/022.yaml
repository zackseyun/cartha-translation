base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/022.yaml
  text: And be careful not to neglect doing this[b][a]. Why should the damage increase to the detriment of kings?
translation:
  language: pt
  text: Tenham cuidado para não serem negligentes em fazer isto.[a] Por que o dano haveria de aumentar, em prejuízo dos reis?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tenham cuidado de não negligenciar a execução disto.”'
    reason: lexical_alternative
  - marker: b
    text: O aramaico traz literalmente “reis”, no plural, possivelmente em referência mais ampla aos interesses da realeza ou da dinastia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְהִירִין הֱווֹ
  choice: Tenham cuidado
  rationale: A combinação do adjetivo aramaico com o verbo auxiliar tem força de exortação ou ordem. “Tenham cuidado” é natural, atual e preserva o tom de advertência.
- source_word: שָׁלוּ לְמֶעְבַּד עַל דְּנָה
  choice: para não ser negligentes no cumprimento desta ordem
  rationale: שָׁלוּ expressa negligência ou falta de diligência, enquanto לְמֶעְבַּד עַל דְּנָה se refere à execução da determinação anterior. “Desta ordem” explicita o referente contextual sem alterar o sentido.
- source_word: לְמָה יִשְׂגֵּא
  choice: Por que permitir que ... aumente?
  rationale: A frase introduz uma pergunta retórica. Esta formulação comunica naturalmente em português a ideia de evitar que o dano venha a crescer.
- source_word: חֲבָלָא
  choice: o dano
  rationale: O termo designa dano, prejuízo ou perda no contexto administrativo e político.
- source_word: לְהַנְזָקַת מַלְכִין
  choice: para prejuízo dos reis
  rationale: Mantém tanto a noção de detrimento indicada por לְהַנְזָקַת quanto o plural explícito מַלְכִין, sem reduzi-lo a “o rei”.
