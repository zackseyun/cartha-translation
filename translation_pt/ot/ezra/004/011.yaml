base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: pt
  text: 'Esta é a cópia da carta que eles enviaram ao rei Artaxerxes: “Teus servos, os homens de Além do Rio[a], e agora—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Além do Rio” era a designação administrativa persa da região a oeste do rio Eufrates, também chamada de Transeufratênia.
    reason: contextual_clarification
  - marker: b
    text: A expressão aramaica é uma fórmula epistolar, tradicionalmente traduzida por “e em tal tempo” ou entendida como “e assim por diante”. A carta continua no versículo seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה פַּרְשֶׁגֶן אִגַּרְתָּא
  choice: Esta é a cópia da carta
  rationale: A fórmula apresenta a transcrição de um documento oficial. “Cópia da carta” é clara, natural e preserva o caráter documental do aramaico.
- source_word: דִּי שְׁלַחוּ עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא
  choice: que eles enviaram ao rei Artaxerxes
  rationale: As preposições funcionam aqui na fórmula epistolar para indicar o destinatário. A ordem portuguesa “rei Artaxerxes” é natural e mantém o título real.
- source_word: עַבְדָיךְ
  choice: Teus servos
  rationale: Preserva a autodesignação deferente de subordinados perante o rei, sem substituí-la pela interpretação mais específica “oficiais”.
- source_word: אֱנָשׁ עֲבַר נַהֲרָה
  choice: os homens da província de Além do Rio
  rationale: “Homens” reflete o substantivo coletivo masculino, enquanto “província” explicita com moderação que “Além do Rio” era uma designação administrativa persa.
- source_word: וּכְעֶנֶת
  choice: E agora...
  rationale: Expressão formular aramaica de correspondência. “E agora” conserva sua forma e função aproximadas; as reticências indicam que a carta prossegue no versículo seguinte.
