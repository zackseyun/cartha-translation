translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantém-se o tratamento de segunda pessoa singular (“Teus”) por fazer parte da saudação formal dirigida ao rei. O nome provincial literal é preservado e esclarecido em nota.
