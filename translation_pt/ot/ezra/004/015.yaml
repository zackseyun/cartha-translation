revisions:
- from: para que se faça uma busca no livro dos registros de seus antepassados[a]. Você encontrará no livro dos registros e saberá que esta cidade é uma cidade rebelde, prejudicial aos reis e às províncias, e que nela se promovem revoltas desde os tempos antigos[b]. Por essa razão, esta cidade foi destruída.
  to: para que se faça uma busca no livro dos registros de teus antepassados[a], e possas encontrar no livro dos registros e saber que esta cidade é uma cidade rebelde, prejudicial a reis e províncias, e que nela se promove sedição desde os tempos antigos[b]; por essa razão, esta cidade foi devastada.
  rationale: A revisão restaura uma única sequência de finalidade, substitui o tratamento por «Você» por uma forma de segunda pessoa compatível com o tom da carta e ajusta a descrição da sedição para abranger a alegação histórica sem impor uma análise única da expressão aramaica. Também emprega «devastada» para refletir a desolação da cidade.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:56:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente os principais elementos do aramaico: a busca nos registros, os antepassados do destinatário, a acusação contra a cidade, o dano a reis e províncias e a desolação resultante. Contudo, «Você encontrará» introduz uma mudança abrupta de registro e de construção após «para que», e «se promovem revoltas» soa como presente habitual, atenuando a alegação histórica expressa pela construção aramaica difícil.'
  naturalness: O texto é geralmente claro, mas o ponto final após «antepassados[a]» rompe a sequência sintática do pedido. O tratamento por «Você» é pouco adequado ao tom administrativo dirigido a um soberano e é inconsistente com a formulação impessoal inicial. Uma construção de finalidade com subjuntivo mantém melhor o tom formal e é natural em português moderno.
  terminology: «Livro dos registros», «cidade rebelde», «reis e províncias» e «tempos antigos» são escolhas adequadas. Para אֶשְׁתַּדּוּר עָבְדִין, «se promova sedição» conserva a natureza político-administrativa da acusação e não fixa indevidamente se se trata de uma revolta específica ou de atividade sediciosa recorrente. «Devastada» reproduz com maior precisão a ideia de cidade reduzida à desolação.
  issues:
  - severity: medium
    issue: Ruptura sintática e mudança de registro em «Você encontrará».
    rationale: A oração aramaica continua a petição iniciada pela solicitação de busca. Em português, o ponto final e o tratamento direto por «Você» quebram essa dependência e enfraquecem o registro formal da carta.
  - severity: medium
    issue: «Se promovem revoltas» apresenta a acusação como ação presente habitual.
    rationale: No contexto, a frase é uma alegação sobre a história da cidade «desde os tempos antigos». Uma construção que indique sedição fomentada ou praticada ao longo desse período representa melhor a acusação sem solucionar além do necessário a expressão aramaica difícil.
  - severity: low
    issue: «Foi destruída» é menos específico que a ideia de desolação.
    rationale: O verbo final descreve a cidade como arruinada ou devastada; «foi devastada» mantém melhor essa nuance.
  revised_text: para que se faça uma busca no livro dos registros de teus antepassados[a], e possas encontrar no livro dos registros e saber que esta cidade é uma cidade rebelde, prejudicial a reis e províncias, e que nela se promove sedição desde os tempos antigos[b]; por essa razão, esta cidade foi devastada.
  revised_footnotes:
  - marker: a
    text: Ou “teus pais” ou “teus predecessores”; literalmente, “teus pais”.
    reason: lexical_alternative
  - marker: b
    text: A expressão aramaica é difícil e pode referir-se a sedição ou revolta fomentada ou praticada dentro da cidade.
    reason: lexical_alternative
