  text: דִּ֡י יְבַקַּר֩ בִּֽ/סְפַר דָּכְרָ֨נַיָּ֜/א דִּ֣י אֲבָהָתָ֗/ךְ וּ֠/תְהַשְׁכַּח בִּ/סְפַ֣ר דָּכְרָנַיָּ/א֮ וְ/תִנְדַּע֒ דִּי֩ קִרְיְתָ֨/א דָ֜ךְ קִרְיָ֣א מָֽרָדָ֗א וּֽ/מְהַנְזְקַ֤ת מַלְכִין֙ וּ/מְדִנָ֔ן וְ/אֶשְׁתַּדּוּר֙ עָבְדִ֣ין בְּ/גַוַּ֔/הּ מִן יוֹמָ֖ת עָלְמָ֑/א עַ֨ל דְּנָ֔ה קִרְיְתָ֥/א דָ֖ךְ הָֽחָרְבַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: pt
  text: para que se faça uma busca no livro dos registros de teus antepassados[a], e possas encontrar no livro dos registros e saber que esta cidade é uma cidade rebelde, prejudicial a reis e províncias, e que nela se promove sedição desde os tempos antigos[b]; por essa razão, esta cidade foi devastada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teus pais” ou “teus predecessores”; literalmente, “teus pais”.
    reason: lexical_alternative
  - marker: b
    text: A expressão aramaica é difícil e pode referir-se a sedição ou revolta fomentada ou praticada dentro da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: se faça uma busca
  rationale: Preserva o caráter impessoal e o tom administrativo do pedido, sem introduzir um sujeito que o aramaico não explicita.
- source_word: סְפַר דָּכְרָנַיָּא
  choice: livro dos registros
  rationale: Designa um registro escrito oficial e mantém a imagem concreta de um livro ou arquivo documental.
- source_word: אֲבָהָתָךְ
  choice: seus antepassados
  rationale: Embora o sentido literal seja “seus pais”, no contexto a expressão pode referir-se aos reis ou governantes anteriores; “antepassados” preserva a relação histórica sem sugerir apenas paternidade biológica.
- source_word: וּתְהַשְׁכַּח
  choice: você encontrará
  rationale: Expressa o resultado esperado da busca em português natural, mantendo a sequência argumentativa da carta.
- source_word: וְתִנְדַּע
  choice: e saberá
  rationale: Traduz diretamente a ideia de chegar ao conhecimento por meio da consulta aos registros.
- source_word: קִרְיְתָא דָךְ
  choice: esta cidade
  rationale: Mantém a referência dêitica a Jerusalém conforme a perspectiva dos autores da carta.
- source_word: קִרְיָא מָרָדָא
  choice: uma cidade rebelde
  rationale: Reproduz de modo idiomático a acusação de insubordinação à autoridade imperial.
- source_word: מְהַנְזְקַת
  choice: prejudicial aos
  rationale: Abrange danos políticos, administrativos ou econômicos causados a reis e províncias.
- source_word: מַלְכִין וּמְדִנָן
  choice: reis e províncias
  rationale: “Províncias” é o equivalente claro e historicamente apropriado para as divisões administrativas do império.
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: se promovem revoltas
  rationale: A construção aramaica é difícil e descreve a prática ou o fomento de sedição; esta formulação comunica a atividade recorrente sem resolver além do necessário a nuance entre sedição, rebelião e revolta.
- source_word: בְּגַוַּהּ
  choice: nela
  rationale: Indica de forma concisa que a atividade ocorria dentro da cidade ou de sua comunidade.
- source_word: מִן יוֹמָת עָלְמָא
  choice: desde os tempos antigos
  rationale: Traduz o idioma como referência a uma antiguidade histórica prolongada, não à eternidade em sentido metafísico.
- source_word: הָחָרְבַת
  choice: foi destruída
  rationale: Expressa o estado de devastação ou ruína imposto à cidade no passado, com formulação corrente e digna em português.
