base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: pt
  text: E, no reinado de Assuero, no início do seu reinado, escreveram uma acusação[a] contra os habitantes de Judá e de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma denúncia” ou “uma acusação hostil”. O termo hebraico transmite a ideia de oposição expressa numa acusação formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: E, no reinado de
  rationale: A conjunção e a preposição introduzem o contexto temporal; a formulação é natural em português e preserva a ligação com o contexto anterior.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuero
  rationale: Mantém a forma tradicional portuguesa baseada no nome hebraico, sem substituir o nome pela identificação histórica frequentemente proposta, Xerxes.
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: no início do seu reinado
  rationale: Expressa de modo claro e atual o período inicial do governo do rei.
- source_word: כָּתְבוּ
  choice: escreveram
  rationale: Reproduz o verbo simples do hebraico e mantém o sujeito não expresso, sem identificar além do que o texto declara.
- source_word: שִׂטְנָה
  choice: uma acusação
  rationale: O substantivo indica oposição manifestada como denúncia ou acusação, provavelmente por escrito neste contexto administrativo; a escolha preserva o caráter hostil e formal sem definir em excesso o gênero do documento.
- source_word: עַל
  choice: contra
  rationale: Com 'acusação', a preposição indica naturalmente o alvo da ação hostil.
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: os habitantes de Judá e de Jerusalém
  rationale: Traduz o particípio substantivado como referência às pessoas que moravam nesses lugares, em linguagem clara e dignificada.
