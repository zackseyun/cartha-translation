base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/021.yaml
  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: pt
  text: Agora, emitam uma ordem para fazer esses homens pararem, e esta cidade não seja reconstruída até que eu emita uma ordem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «até que uma ordem seja estabelecida por mim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: Agora
  rationale: Introduz a ordem imediata do rei com naturalidade e preserva sua urgência.
- source_word: שִׂימוּ טְּעֵם
  choice: emitam uma ordem
  rationale: O idioma aramaico significa literalmente “estabeleçam uma ordem/decisão”; esta formulação é natural no contexto administrativo.
- source_word: לְבַטָּלָא גֻּבְרַיָּא אִלֵּךְ
  choice: para fazer esses homens pararem
  rationale: Preserva o sentido causativo do infinitivo e traduz literalmente o referente masculino plural.
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: e esta cidade não seja reconstruída
  rationale: Mantém a conjunção, a proibição administrativa e a voz passiva do aramaico.
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: até que eu emita nova ordem
  rationale: Expressa em português natural o idioma literalmente passivo, “até que da minha parte seja estabelecida uma ordem”; “nova” torna claro que se trata de uma ordem posterior sem alterar o sentido contextual.
