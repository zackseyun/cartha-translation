base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: pt
  text: 'O rei enviou uma resposta a Reum, o alto funcionário[a], a Sinsai, o escriba, aos outros associados deles que moravam em Samaria e aos demais além do Rio[b]: “Paz!”[c] E agora—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “chanceler” ou “comandante”; o sentido exato do título aramaico é incerto.
    reason: lexical_alternative
  - marker: b
    text: “Além do Rio” era a designação persa para a região a oeste do rio Eufrates.
    reason: cultural_note
  - marker: c
    text: 'Ou: “Saudações!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: uma resposta
  rationale: No contexto da correspondência oficial, indica uma comunicação escrita; como responde à carta anterior, “resposta” expressa naturalmente sua função.
- source_word: בְּעֵל טְעֵם
  choice: o alto funcionário
  rationale: O título administrativo aramaico, literalmente relacionado a autoridade ou discernimento, tem sentido exato incerto. “Alto funcionário” evita atribuir um cargo específico sem suficiente evidência.
- source_word: סָפְרָא
  choice: o escriba
  rationale: Preserva o título administrativo e literário tradicional, ainda compreensível em português atual.
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: os demais companheiros deles
  rationale: Designa os outros associados aos oficiais mencionados; “companheiros” conserva a amplitude do termo sem restringi-lo a colegas burocráticos.
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: que moravam em Samaria
  rationale: A construção participial indica residência; o imperfeito se harmoniza com a narração histórica em português.
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: e no restante da região além do Rio
  rationale: O original não contém uma palavra explícita para “província”. “Região” torna inteligível a referência territorial sem impor uma designação administrativa ausente, e “Rio” refere-se ao Eufrates.
- source_word: שְׁלָם
  choice: Paz!
  rationale: Preserva o conteúdo lexical da saudação epistolar aramaica; em português, a pontuação a apresenta naturalmente como fórmula de saudação.
- source_word: וּכְעֶת
  choice: E agora—
  rationale: Fórmula que introduz o corpo da resposta. O travessão sinaliza que a frase prossegue no versículo seguinte.
