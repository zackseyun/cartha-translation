base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are slaves[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: pt
  text: Pois somos escravos; contudo, mesmo em nossa escravidão, o nosso Deus não nos abandonou. Pelo contrário, estendeu sobre nós seu amor leal[a] diante dos reis da Pérsia, para nos dar novo alento, reerguer a casa do nosso Deus, restaurar suas ruínas e nos dar um muro[b] em Judá e em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bondade constante”, “favor” ou “fidelidade à aliança”. O termo hebraico חֶסֶד expressa amor, bondade e lealdade comprometida.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma cerca protetora” ou “uma barreira de proteção”. A imagem pode se referir, de modo mais amplo, à segurança concedida a Judá e Jerusalém, e não apenas a um muro literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: escravos / em nossa escravidão
  rationale: Preserva a ligação entre os termos cognatos e a força da sujeição contínua da comunidade sob o domínio imperial, sem suavizá-la para “servos”.
- source_word: עֲזָבָנוּ
  choice: não nos abandonou
  rationale: Expressa com naturalidade atual o sentido de deixar ou desamparar, adequado ao contexto de oração e à relação de Deus com seu povo.
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: estendeu sobre nós seu amor leal
  rationale: “Estendeu sobre nós” conserva a imagem verbal de נטה, enquanto “amor leal” comunica a bondade constante e comprometida de חֶסֶד sem restringir o termo a uma única formulação teológica.
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: diante dos reis da Pérsia
  rationale: Representa diretamente a relação ou presença indicada por לִפְנֵי e é idiomático em português.
- source_word: מִחְיָה
  choice: novo alento
  rationale: Comunica preservação e renovação da vida da comunidade no contexto pós-exílico, em linguagem natural e digna.
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: reerguer a casa do nosso Deus
  rationale: “Reerguer” conserva a imagem de levantar e, no contexto, comunica a restauração do templo; “casa do nosso Deus” mantém a expressão hebraica transparente.
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: restaurar suas ruínas
  rationale: O causativo de עמד indica fazer ficar de pé ou restabelecer. Com “ruínas”, “restaurar” transmite claramente o resultado pretendido em português sem produzir uma combinação pouco natural.
- source_word: גָדֵר
  choice: um muro
  rationale: Mantém a imagem concreta de uma barreira ou cerca, enquanto a nota registra que o contexto pode apontar mais amplamente para proteção e segurança.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: em Judá e em Jerusalém
  rationale: Segue o valor locativo das preposições e evita interpretar o muro como necessariamente circundando ambos os lugares.
theological_decisions:
- issue: Sentido de חֶסֶד
  choice: amor leal
  alternative: fidelidade à aliança; bondade; favor
  rationale: “Amor leal” preserva a combinação de graça, constância e compromisso relacional do termo. A nota mantém alternativas legítimas sem impor uma formulação confessional mais estreita.
- issue: Caráter literal ou metafórico de גָדֵר
  choice: muro
  alternative: cerca protetora; barreira de proteção
  rationale: O texto principal conserva a metáfora concreta hebraica. A nota reconhece que, sob o domínio persa, a expressão pode designar proteção e segurança em sentido mais amplo, e não apenas uma fortificação literal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição “escravos/escravidão” foi mantida por sua força retórica; “contudo” e “pelo contrário” explicitam naturalmente o contraste sintático. Os marcadores de nota foram posicionados junto aos termos efetivamente comentados.
