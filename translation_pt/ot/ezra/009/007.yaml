id: EZR.9.7
reference: Ezra 9:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: pt
  text: Desde os dias dos nossos antepassados até hoje, temos carregado grande culpa. Por causa das nossas iniquidades, nós, nossos reis e nossos sacerdotes fomos entregues nas mãos dos reis das terras, à espada, ao cativeiro, ao saque e à humilhação pública[a], como é hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vergonha de rosto”; isto é, desonra ou humilhação visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: Desde os dias dos nossos antepassados
  rationale: A preposição מִן marca o ponto inicial no tempo. “Antepassados” comunica naturalmente o sentido coletivo de אָבוֹת sem restringi-lo aos pais imediatos.
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: temos carregado grande culpa
  rationale: אַשְׁמָה indica culpa objetiva, não apenas vergonha sentida. O perfeito composto expressa a continuidade desde o passado até o presente, e “carregado” torna natural em português a construção hebraica de estar sob culpa.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Expressa de modo corrente e fiel a continuidade temporal até o momento da oração.
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: Por causa das nossas iniquidades
  rationale: O בְּ tem força causal neste contexto, e עָוֹן conserva a noção de perversidade moral e culpa, distinta de אַשְׁמָה.
- source_word: נִתַּנּוּ
  choice: fomos entregues
  rationale: O nifal de נָתַן é passivo. “Entregues” comunica melhor em português o ato de colocar alguém sob o poder de inimigos.
- source_word: בְּיַד מַלְכֵי הָאֲרָצוֹת
  choice: nas mãos dos reis de outras terras
  rationale: Mantém a imagem hebraica da mão como poder ou domínio. “Outras terras” esclarece que se trata de reinos estrangeiros, e não de toda a terra.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Preserva a fórmula concisa de juízo, referente à morte e à devastação pela guerra.
- source_word: בַּשְּׁבִי
  choice: ao cativeiro
  rationale: שְׁבִי designa a condição de ser levado ou mantido cativo; “cativeiro” é direto e não reduz o sentido apenas ao exílio.
- source_word: וּבַבִּזָּה
  choice: ao saque
  rationale: בִּזָּה é o despojo ou saque efetuado pelo inimigo. “Saque” é atual e claro.
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: à humilhação pública
  rationale: A expressão literal “vergonha de rosto” descreve desonra visível e pública. A formulação escolhida transmite seu sentido em português natural, enquanto a imagem literal é preservada em nota.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: como acontece hoje
  rationale: Reproduz o valor comparativo e presente da expressão hebraica em linguagem idiomática.
theological_decisions:
- issue: Distinção entre אַשְׁמָה e עָוֹן
  choice: “culpa” para אַשְׁמָה e “iniquidades” para עָוֹן
  alternative: Traduzir ambos de modo geral por “pecado(s)”
  rationale: 'A distinção preserva as camadas da confissão: a comunidade se encontra sob grande culpa por causa de suas iniquidades, sem impor uma sistematização teológica externa.'
- issue: Solidariedade coletiva na confissão
  choice: Manter “nós, nossos reis e nossos sacerdotes” sob o mesmo verbo passivo
  alternative: Reformular a frase de modo a separar o povo de seus líderes
  rationale: O hebraico inclui explicitamente a comunidade e suas lideranças na mesma experiência histórica de juízo.
- issue: Agência implícita no passivo נִתַּנּוּ
  choice: Manter “fomos entregues” sem nomear o agente
  alternative: Explicitar “Deus nos entregou”
  rationale: Embora o contexto teológico sugira a ação divina, o texto hebraico usa uma forma passiva e não identifica expressamente o agente; a tradução preserva essa formulação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução preserva o paralelismo da lista de juízos, mantém a imagem de estar “nas mãos” dos reis e evita formas excessivamente arcaicas. O marcador [a] aparece no texto principal e corresponde à única nota.
