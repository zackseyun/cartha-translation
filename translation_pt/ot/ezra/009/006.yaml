  text: וָ/אֹמְרָ֗/ה אֱלֹהַ/י֙ בֹּ֣שְׁתִּי וְ/נִכְלַ֔מְתִּי לְ/הָרִ֧ים אֱלֹהַ֛/י פָּנַ֖/י אֵלֶ֑י/ךָ כִּ֣י עֲוֺנֹתֵ֤י/נוּ רָבוּ֙ לְ/מַ֣עְלָ/ה רֹּ֔אשׁ וְ/אַשְׁמָתֵ֥/נוּ גָדְלָ֖ה עַ֥ד לַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: pt
  text: 'E eu disse: “Meu Deus, estou envergonhado e humilhado demais para erguer o rosto para ti, meu Deus, pois as nossas iniquidades se multiplicaram acima da nossa cabeça[a], e a nossa culpa cresceu até os céus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acima das nossas cabeças”. O hebraico traz “cabeça” no singular, com sentido coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: E eu disse
  rationale: Mantém a continuação narrativa marcada pelo waw e traduz diretamente o verbo de fala.
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: estou envergonhado e humilhado demais
  rationale: Os dois verbos expressam vergonha e desonra intensificadas. O presente comunica naturalmente o estado de Esdras; “demais” liga essa intensidade ao infinitivo seguinte sem eliminar a dupla expressão hebraica.
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: para erguer o rosto para ti
  rationale: Conserva a imagem explícita do rosto e a ideia de apresentar-se abertamente diante de Deus.
- source_word: עֲוֺנֹתֵינוּ
  choice: as nossas iniquidades
  rationale: Preserva o peso moral de עָוֹן e mantém distinção em relação a אַשְׁמָה, traduzido depois por “culpa”.
- source_word: רָבוּ
  choice: se multiplicaram
  rationale: Representa o sentido verbal de tornar-se numeroso ou aumentar, adequado ao caráter cumulativo da confissão.
- source_word: לְמַעְלָה רֹאשׁ
  choice: acima da nossa cabeça
  rationale: Mantém a metáfora vertical e o singular coletivo do hebraico; a alternativa idiomática no plural é registrada em nota.
- source_word: אַשְׁמָתֵנוּ
  choice: a nossa culpa
  rationale: No contexto, designa culpabilidade ou responsabilidade moral, não uma oferta pela culpa.
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: cresceu até os céus
  rationale: Reproduz de modo natural a imagem hiperbólica de crescimento vertical e conserva o plural hebraico “céus”.
- source_word: אֱלֹהַי
  choice: Meu Deus
  rationale: A forma de tratamento direta e repetida preserva a ênfase e o tom pessoal do hebraico.
theological_decisions: []
