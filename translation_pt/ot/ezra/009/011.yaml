  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: pt
  text: 'que ordenaste por meio dos teus servos, os profetas, dizendo: “A terra em que vocês estão entrando para tomar posse é uma terra de impureza[b] por causa da impureza dos povos dessas terras, por causa das abominações com que eles a encheram de uma extremidade à outra[a], com a sua imundícia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico literalmente: “de boca a boca”, expressão que aqui indica toda a extensão da terra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma terra impura”. O termo hebraico pode abranger tanto impureza ritual quanto contaminação moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: por meio de
  rationale: Expressa naturalmente em português o idioma hebraico de agência, sem sugerir uma mão literal.
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: teus servos, os profetas
  rationale: Preserva o título honorífico dos agentes proféticos de Deus e a aposição do hebraico.
- source_word: לְרִשְׁתָּהּ
  choice: para tomar posse
  rationale: Comunica o sentido de adquirir a posse da terra e mantém a ressonância da linguagem de herança territorial.
- source_word: אֶרֶץ נִדָּה
  choice: uma terra de impureza
  rationale: Mantém a formulação abstrata e a linguagem de contaminação, sem restringi-la exclusivamente ao âmbito ritual ou moral.
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: por causa da impureza dos povos dessas terras
  rationale: Interpreta o beth como causal no contexto; 'dessas terras' preserva o plural e soa mais claro em português do que a repetição rígida de 'das terras'.
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: por causa das abominações
  rationale: Preserva a força moral e religioso-covenantal do termo, sem substituí-lo por uma paráfrase mais estreita.
- source_word: מִלְאוּהָ
  choice: eles a encheram
  rationale: Reproduz diretamente o perfeito hebraico e identifica de modo natural os povos como agentes.
- source_word: מִפֶּה אֶל־פֶּה
  choice: de uma extremidade à outra
  rationale: Traduz o sentido espacial do idioma hebraico, cujo teor literal é 'de boca a boca'.
- source_word: בְּטֻמְאָתָם
  choice: com a sua imundícia
  rationale: Mantém a imagem forte de contaminação e distingue lexicalmente este termo do anterior נִדָּה, sem eliminar a sobreposição semântica.
theological_decisions:
- issue: Natureza da contaminação da terra
  choice: Usar linguagem de impureza, imundícia e abominações sem definir a contaminação como exclusivamente ritual ou exclusivamente moral.
  alternative: Uniformizar todos os termos como linguagem apenas ritual ou parafraseá-los somente como corrupção moral.
  rationale: נִדָּה, טֻמְאָה e תּוֹעֵבָה podem reunir dimensões rituais, morais e pactuais; a tradução preserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'vocês' para o plural e mantém o registro bíblico forte de 'abominações'. Os marcadores foram colocados ao final da declaração, embora tratem, respectivamente, de 'de uma extremidade à outra' e 'terra de impureza'.
