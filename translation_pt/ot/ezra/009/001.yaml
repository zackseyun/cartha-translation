source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: pt
  text: 'Quando essas coisas foram concluídas, os oficiais se aproximaram de mim e disseram: “O povo de Israel, os sacerdotes e os levitas não se separaram dos povos das terras, conforme as abominações dos cananeus, dos hititas, dos ferezeus, dos jebuseus, dos amonitas, dos moabitas, dos egípcios e dos amorreus[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme as práticas detestáveis deles”. O termo hebraico é forte e muitas vezes se refere a práticas religiosas ofensivas ou idólatras.'
    reason: Alternativa lexical para «abominações» e esclarecimento da relação de conformidade expressa pela preposição hebraica.
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: Depois que essas coisas terminaram
  rationale: A conjunção, a preposição temporal e o infinitivo de כלה formam uma oração temporal. A formulação preserva a sequência narrativa sem acrescentar um marcador equivalente a “agora”.
- source_word: נִגְּשׁוּ אֵלַי
  choice: se aproximaram de mim
  rationale: O nifal de נגשׁ indica aproximação; esta é uma formulação corrente e fiel em português.
- source_word: הַשָּׂרִים
  choice: os oficiais
  rationale: No contexto administrativo do período persa, שׂרים designa autoridades ou dirigentes; “oficiais” evita a conotação monárquica ou aristocrática de “príncipes”.
- source_word: לֵאמֹר
  choice: e disseram
  rationale: O infinitivo citativo hebraico introduz discurso direto. Em português narrativo, “e disseram” é mais natural do que o decalque “dizendo”.
- source_word: לֹא נִבְדְּלוּ
  choice: não se separaram
  rationale: O nifal de בדל tem aqui sentido separativo ou reflexivo, preservado sem especificar indevidamente intenção ou mecanismo.
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: O povo de Israel, os sacerdotes e os levitas
  rationale: Os três grupos são coordenados sob a mesma acusação. A concordância verbal no plural torna explícita essa coordenação em português.
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: dos povos das terras
  rationale: Mantém os dois plurais do hebraico e não acrescenta a ideia de que se trata especificamente de terras vizinhas.
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: seguindo as abominações deles
  rationale: A preposição כ indica conformidade ou correspondência. “Seguindo” torna inteligível a relação sintática, enquanto “abominações” conserva a forte carga moral e religiosa de תועבות; a nota oferece uma alternativa mais idiomática.
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: dos cananeus, dos hititas, dos ferezeus, dos jebuseus, dos amonitas, dos moabitas, dos egípcios e dos amorreus
  rationale: Embora os gentílicos hebraicos estejam formalmente no singular coletivo, o plural é a maneira natural de designar esses povos em português. A repetição de “dos” esclarece que a lista identifica os povos mencionados.
theological_decisions:
- issue: Força moral e religiosa de תועבות
  choice: abominações
  alternative: práticas detestáveis
  rationale: “Abominações” preserva a severidade pactual e religiosa do termo sem restringi-lo exclusivamente à idolatria. A alternativa idiomática é registrada em nota.
- issue: Abrangência da acusação
  choice: O povo de Israel, os sacerdotes e os levitas são coordenados como sujeitos da mesma acusação
  alternative: Entender a acusação como dirigida principalmente ao povo leigo, com sacerdotes e levitas apenas anexados
  rationale: A sintaxe hebraica coordena os três grupos sob o mesmo verbo; a tradução não reduz a abrangência da denúncia.
- issue: Relação expressa por כ em כְּתוֹעֲבֹתֵיהֶם
  choice: seguindo as abominações deles
  alternative: conforme as abominações deles
  rationale: O hebraico permite uma relação de conformidade. “Seguindo” comunica essa relação em português natural sem afirmar que todos os indivíduos praticaram cada ato atribuído aos povos enumerados.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “ferezeus”, forma tradicional e ainda reconhecível em português bíblico, e evita tanto arcaísmos como “príncipes” quanto expansões geográficas não expressas no texto.
