base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: pt
  text: Será que voltaremos a violar os teus mandamentos e a nos casar com os povos que praticam estas abominações?[a] Não ficarias irado conosco até nos destruir por completo, sem deixar remanescente nem sobrevivente?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “com os povos destas abominações”. A expressão hebraica provavelmente caracteriza esses povos pelas práticas abomináveis associadas a eles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem deixar remanescente nem quem escapasse”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: Será que voltaremos a
  rationale: O verbo שׁוב significa literalmente “voltar”, mas, seguido dos infinitivos que descrevem a reincidência, exprime aqui a ideia de tornar a praticar o pecado. A formulação preserva tanto a imagem de retorno quanto o caráter retórico da pergunta.
- source_word: לְהָפֵר
  choice: violar
  rationale: No contexto jurídico e pactual, הפר significa quebrar ou transgredir uma obrigação. “Violar” é claro em português atual e combina naturalmente com “mandamentos”.
- source_word: מִצְוֺתֶיךָ
  choice: os teus mandamentos
  rationale: Mantém o sentido direto do substantivo plural com sufixo de segunda pessoa e conserva o tom solene da oração dirigida a Deus.
- source_word: וּלְהִתְחַתֵּן
  choice: e a nos casar com gente de
  rationale: O hitpael de חתן indica entrar em relações matrimoniais com outro grupo. Esta formulação evita o pouco natural “casar-nos entre nós” e comunica claramente o sentido coletivo.
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: com gente dos povos que praticam estas abominações
  rationale: A construção hebraica é literalmente “com os povos destas abominações”. A redação principal explicita a caracterização pelas práticas, sem transformar a expressão em juízo étnico essencialista; a forma mais literal é preservada em nota.
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: Não ficarias irado conosco
  rationale: A partícula הֲלוֹא introduz uma pergunta retórica que espera resposta afirmativa, e אנף denota ira. “Ficar irado” mantém a intensidade e soa natural no registro da oração.
- source_word: עַד כַּלֵּה
  choice: até nos destruir por completo
  rationale: כלה aqui descreve levar ao fim ou consumir totalmente. A formulação expressa com clareza a destruição completa implícita no hebraico.
- source_word: לְאֵין שְׁאֵרִית וּפְלֵיטָה
  choice: sem deixar remanescente nem sobrevivente
  rationale: לְאֵין marca a ausência resultante; שְׁאֵרִית conserva o importante termo “remanescente”, enquanto פְלֵיטָה, em paralelo, é representado concretamente por “sobrevivente”.
theological_decisions:
- issue: Caracterização dos povos em relação às “abominações”
  choice: Entender a expressão como referência a povos caracterizados por tais práticas abomináveis.
  alternative: “com os povos destas abominações”
  rationale: A construção hebraica compacta admite a tradução literal, mas o contexto liga a proibição às práticas religiosas e morais. O texto principal evita sugerir inferioridade étnica, e a nota conserva a ambiguidade formal do original.
- issue: Preservação da linguagem de “remanescente”
  choice: Manter “remanescente” no texto principal.
  alternative: “os que restassem”
  rationale: Embora possua ressonância bíblica tradicional, “remanescente” continua compreensível e mantém a conexão lexical e teológica com os temas de juízo e preservação em Esdras e no restante das Escrituras.
- issue: Força da pergunta retórica sobre a ira divina
  choice: Usar “Não ficarias irado conosco...?”
  alternative: “Acaso não te irarias contra nós...?”
  rationale: Ambas refletem a expectativa afirmativa de הֲלוֹא. A escolhida é corrente e digna, sem reduzir a força do termo de ira nem converter a pergunta em declaração.
translation_notes:
  register: Português moderno de leitura ampla, com boa naturalidade no Brasil e registro digno de oração. Emprega “teus” para manter a interlocução direta e solene sem arcaísmo excessivo. A ordem das notas foi regularizada para que [a] acompanhe a expressão sobre os povos e [b] a cláusula final.
