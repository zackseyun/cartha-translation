id: EZR.9.12
reference: Ezra 9:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: pt
  text: E agora, não deem suas filhas aos filhos deles, nem tomem as filhas deles para os seus filhos. Jamais busquem a paz nem o bem-estar deles[a], para que vocês se fortaleçam, comam o que há de bom na terra e a deixem como herança aos seus filhos para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não busquem a paz deles nem o bem deles para sempre”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e façam que seus filhos a herdem para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Reproduz diretamente a transição hebraica, ligando a proibição ao que precede sem acrescentar uma relação causal não expressa.
- source_word: בְּנוֹתֵיכֶם אַל תִּתְּנוּ לִבְנֵיהֶם
  choice: não deem suas filhas aos filhos deles
  rationale: Mantém a formulação concreta e o paralelismo do hebraico; no contexto, dar uma filha a um filho indica casamento.
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: nem tomem as filhas deles para os seus filhos
  rationale: O verbo נשׂא integra aqui uma expressão matrimonial. A formulação preserva o paralelismo e mantém explícita a expressão 'para os seus filhos'.
- source_word: תִדְרְשׁוּ
  choice: busquem
  rationale: דרשׁ significa procurar ou buscar e, com os objetos seguintes, comunica empenho ativo em favor da paz e do bem-estar alheios.
- source_word: שְׁלֹמָם
  choice: a paz deles
  rationale: Preserva o equivalente mais direto de שָׁלוֹם, sem excluir suas conotações mais amplas de segurança e bem-estar.
- source_word: וְטוֹבָתָם
  choice: nem o bem-estar deles
  rationale: טוֹבָה designa aqui o bem, benefício ou prosperidade deles. 'Bem-estar' é natural em português e evita limitar o termo à riqueza material.
- source_word: עַד עוֹלָם
  choice: jamais
  rationale: Na proibição, a duração indefinida e absoluta da expressão é comunicada idiomaticamente por 'jamais'.
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: para que vocês se fortaleçam
  rationale: Preserva a relação de finalidade de לְמַעַן e o valor dinâmico possível do Qal de חזק, 'tornar-se forte'.
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: comam o que há de bom na terra
  rationale: Conserva a imagem concreta de comer, tornando natural em português a expressão hebraica 'comer o bem da terra'.
- source_word: וְהוֹרַשְׁתֶּם
  choice: e a deixem como herança
  rationale: O Hifil de ירשׁ é causativo e indica fazer que a terra passe aos descendentes. O pronome feminino retoma naturalmente 'a terra'.
- source_word: לִבְנֵיכֶם
  choice: aos seus filhos
  rationale: Mantém o masculino plural específico do hebraico, embora no contexto a continuidade dos descendentes esteja em vista.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: No encerramento, a expressão descreve a duração da herança através das gerações; 'para sempre' é a equivalência portuguesa mais direta.
theological_decisions:
- issue: Linguagem de separação étnica e religiosa no contexto pactual pós-exílico
  choice: Traduzir diretamente a proibição de casamentos mistos e de buscar a paz e o bem-estar desses povos, sem suavizá-la.
  alternative: Converter a fala numa advertência geral contra alianças espiritualmente nocivas ou ampliá-la como mandamento universal sobre todos os estrangeiros.
  rationale: O versículo pertence à situação histórica e pactual narrada em Esdras. A tradução deve conservar a severidade e a tensão do texto, sem inserir uma aplicação doutrinária mais ampla que ele não explicita.
- issue: Referente implícito de וְהוֹרַשְׁתֶּם
  choice: Entender que a terra é deixada como herança aos filhos.
  alternative: 'Entender de modo menos específico: ''façam que seus filhos herdem isso''.'
  rationale: O verbo não traz objeto expresso, mas 'a terra' é o antecedente contextual mais natural. A nota preserva a forma causativa alternativa sem impor uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se o paralelismo das duas proibições matrimoniais, a imagem concreta de comer o bem da terra e a força duradoura de עַד עוֹלָם. As notas estão posicionadas junto às expressões que esclarecem.
