    rationale: לְהַשְׁאִיר לָנוּ פְּלֵיטָה significa deixar-nos sobreviventes/um remanescente que escapou; “entre nós” não está expresso, e a oração finita enfraquece o paralelismo com “dar-nos uma estaca”.
  - severity: medium
    issue: “vida nova” interpreta além do grau necessário.
    rationale: מִחְיָה designa vida, preservação ou revigoramento; “nova” não é expresso. “Um pouco de vida” conserva a concisão e a imagem do hebraico.
