source:
  edition: WLC
  text: וְ/עַתָּ֡ה כִּ/מְעַט רֶגַע֩ הָיְתָ֨ה תְחִנָּ֜ה מֵ/אֵ֣ת יְהוָ֣ה אֱלֹהֵ֗י/נוּ לְ/הַשְׁאִ֥יר לָ֨/נוּ֙ פְּלֵיטָ֔ה וְ/לָ/תֶת לָ֥/נוּ יָתֵ֖ד בִּ/מְק֣וֹם קָדְשׁ֑/וֹ לְ/הָאִ֤יר עֵינֵ֨י/נוּ֙ אֱלֹהֵ֔י/נוּ וּ/לְ/תִתֵּ֛/נוּ מִֽחְיָ֥ה מְעַ֖ט בְּ/עַבְדֻתֵֽ/נוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: pt
  text: Mas agora, por um breve momento, houve favor da parte de Yahweh, nosso Deus, para nos deixar sobreviventes e nos dar uma estaca[a] em seu lugar santo, para que nosso Deus ilumine os nossos olhos[b] e nos dê um pouco de vida em nossa escravidão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um ponto de apoio seguro”. O hebraico mantém a imagem concreta de algo firmemente fixado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dar luz aos nossos olhos”; a expressão indica vitalidade e esperança renovadas.
    reason: idiom_explanation
  - marker: c
    text: Ou “em nossa servidão” ou “em nossa sujeição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: favor
  rationale: Neste contexto, o substantivo indica o favor concedido por Yahweh, e não o ato de Israel suplicar. “Favor” comunica a misericórdia recebida sem acrescentar conotações teológicas alheias ao contexto.
- source_word: פְּלֵיטָה
  choice: um remanescente que escapou
  rationale: A expressão preserva tanto a ideia concreta de sobrevivência ao desastre e ao exílio quanto a noção histórica de um remanescente preservado.
- source_word: יָתֵד
  choice: uma estaca
  rationale: Mantém a imagem concreta hebraica de algo firmemente fixado, em vez de substituí-la no texto principal por sua interpretação metafórica, como “ponto de apoio seguro”.
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: em seu lugar santo
  rationale: Tradução direta que comporta a referência ao templo sem especificá-la além do que diz a frase hebraica.
- source_word: לְהָאִיר עֵינֵינוּ
  choice: dar brilho aos nossos olhos
  rationale: Conserva a metáfora hebraica e comunica de modo natural a renovação da vitalidade e da esperança.
- source_word: מִחְיָה
  choice: vida nova
  rationale: O substantivo denota preservação ou restauração da vida. “Vida nova” expressa com clareza o alento concedido à comunidade depois do exílio.
- source_word: בְּעַבְדֻתֵנוּ
  choice: em nossa escravidão
  rationale: Preserva a força do termo, que descreve a condição de sujeição do povo sob domínio imperial, sem suavizá-lo para mero “serviço”.
- source_word: כִּמְעַט רֶגַע
  choice: por um breve momento
  rationale: Formulação portuguesa natural que conserva a ênfase na curta duração da trégua.
- source_word: הָיְתָה ... מֵאֵת יְהוָה אֱלֹהֵינוּ
  choice: recebemos favor da parte de Yahweh, nosso Deus
  rationale: Torna natural em português a construção existencial hebraica e preserva a ênfase em Yahweh como fonte do favor.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome divino pessoal, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente reorganizada para fluidez, explicitando “ele” como sujeito das ações divinas sem alterar o referente. As imagens hebraicas centrais foram mantidas no texto, e suas possíveis interpretações foram indicadas em notas.
