id: EZR.9.10
reference: Ezra 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: pt
  text: E agora[a], que diremos, nosso Deus, depois disso? Pois abandonamos os teus mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Mas agora». A conjunção hebraica também pode marcar aqui um contraste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção ו quanto o advérbio temporal עתה, funcionando naturalmente como transição discursiva na oração.
- source_word: מַה נֹּאמַר
  choice: que diremos
  rationale: O imperfeito na primeira pessoa do plural tem força deliberativa neste contexto; a formulação mantém a abertura formal do hebraico e a impotência retórica de Esdras.
- source_word: אֱלֹהֵינוּ
  choice: nosso Deus
  rationale: Reproduz a forma possessiva e, pela pontuação, seu uso vocativo na oração, sem acrescentar uma interjeição ausente do texto.
- source_word: אַחֲרֵי זֹאת
  choice: depois disso
  rationale: Expressão temporal portuguesa natural que remete ao pecado e à crise relatados anteriormente, sem explicitação interpretativa.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da pergunta retórica e preserva a relação explicativa entre as orações.
- source_word: עָזַבְנוּ
  choice: abandonamos
  rationale: Comunica a gravidade de עזב no contexto de infidelidade às obrigações da aliança, em linguagem portuguesa atual e digna.
- source_word: מִצְוֺתֶיךָ
  choice: os teus mandamentos
  rationale: Correspondência tradicional, clara e teologicamente adequada para מצוות, preservando o caráter autoritativo da instrução divina.
theological_decisions:
- issue: Tom da confissão de Esdras
  choice: Pergunta retórica de culpa e falta de palavras diante de Deus
  alternative: Pedido simples de orientação sobre o que dizer em seguida
  rationale: A explicação «Pois abandonamos os teus mandamentos» mostra que a pergunta é penitencial e retórica. A tradução conserva essa tensão sem ampliar o texto.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Que diremos» preserva a concisão e a força deliberativa do hebraico; «abandonamos» evita o tom arcaizante de «desamparamos» sem atenuar a culpa confessada.
