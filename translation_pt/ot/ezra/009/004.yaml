source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: pt
  text: Então todos os que tremiam diante das palavras do Deus de Israel por causa da infidelidade[a] da comunidade dos exilados reuniram-se a mim, enquanto eu permanecia sentado, estarrecido, até a oferta da tarde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da transgressão da comunidade do exílio”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “oferta da tarde” traduz minḥah, termo que muitas vezes designa especificamente uma oferta de cereal; aqui ela também indica o horário da oferta regular no templo.
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: reuniram-se
  rationale: O nifal de אסף descreve pessoas que se ajuntam a Esdras. A forma pronominal é natural em português e mantém o valor médio ou coletivo sem impor uma passiva.
- source_word: כֹּל חָרֵד
  choice: todos os que tremiam
  rationale: O adjetivo singular depois de כֹּל tem sentido coletivo. A formulação portuguesa conserva a reação pessoal de temor reverente.
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: diante das palavras do Deus de Israel
  rationale: Com חָרֵד, a preposição ב marca aquilo que provoca ou inspira temor. “Diante das palavras” soa natural em português e preserva o plural hebraico.
- source_word: עַל מַעַל הַגּוֹלָה
  choice: por causa da infidelidade da comunidade dos exilados
  rationale: מַעַל indica quebra de fidelidade, com forte dimensão relacional e pactual. הַגּוֹלָה designa coletivamente a comunidade ligada ao exílio; a expressão escolhida evita tratar o termo como uma abstração.
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: permaneci sentado, estarrecido
  rationale: A combinação participial comunica tanto a continuidade da postura de Esdras quanto seu estado de choque e consternação. “Estarrecido” expressa isso em português atual e digno.
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: até a oferta da tarde
  rationale: מִנְחָה pode designar especificamente uma oferta de cereal, mas nesta expressão também assinala o horário do culto regular. “Oferta da tarde” preserva a referência cultual sem estreitá-la indevidamente.
theological_decisions:
- issue: Sentido de מַעַל em contexto de pecado contra Deus
  choice: infidelidade
  alternative: transgressão; quebra de fidelidade
  rationale: “Infidelidade” comunica que se trata de uma violação da lealdade devida a Deus, não apenas de um erro genérico, sem acrescentar uma categoria doutrinária posterior.
- issue: Referente de הַגּוֹלָה
  choice: comunidade dos exilados
  alternative: os exilados; comunidade do exílio; cativeiro
  rationale: O substantivo pode referir-se coletivamente aos que foram levados ao exílio e agora se encontram de volta. A tradução explicita o caráter comunitário sem resolver em excesso a tensão entre identidade passada e situação presente.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Diante das palavras” preserva o temor reverente; “estarrecido” comunica choque profundo sem arcaísmo. Os marcadores foram colocados junto às expressões que explicam.
