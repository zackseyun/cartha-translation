base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: pt
  text: Assim que ouvi sobre este assunto[a], rasguei minha roupa e meu manto, arranquei alguns cabelos da minha cabeça e da minha barba[b] e me sentei horrorizado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando ouvi este relato, rasguei minha roupa e meu manto [...] e me sentei estarrecido”.'
    reason: lexical_alternative
  - marker: b
    text: Rasgar as vestes e arrancar cabelos eram formas costumeiras de expressar profunda tristeza, horror ou luto.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: Assim que ouvi falar
  rationale: A construção temporal introduz a reação imediata de Esdras; “ouvi falar” soa natural em português diante de um assunto que lhe foi relatado.
- source_word: הַדָּבָר הַזֶּה
  choice: desse assunto
  rationale: דָּבָר pode significar palavra, relato, coisa ou assunto. Aqui se refere à situação que acabara de ser comunicada; “assunto” preserva a amplitude sem reduzi-la apenas ao relato verbal.
- source_word: קָרַעְתִּי
  choice: rasguei
  rationale: Expressa diretamente o ato convencional de rasgar a roupa em sinal de profunda aflição.
- source_word: בִּגְדִי
  choice: minha túnica
  rationale: בֶּגֶד é um termo geral para peça de roupa. “Túnica” diferencia com clareza essa peça do manto exterior, embora “roupa” também seja possível.
- source_word: וּמְעִילִי
  choice: e meu manto
  rationale: מְעִיל designa normalmente uma veste exterior; “manto” é claro, digno e distinto de “túnica”.
- source_word: וָאֶמְרְטָה
  choice: arranquei
  rationale: O verbo indica remover os cabelos à força; “arranquei” comunica de modo natural e vívido a intensidade do gesto.
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: alguns cabelos da cabeça e da barba
  rationale: A preposição מִן tem sentido partitivo, indicando cabelos retirados dentre os da cabeça e da barba, não necessariamente todos.
- source_word: וָאֵשְׁבָה
  choice: e me sentei
  rationale: Traduz de modo direto a sequência narrativa e é mais natural em português do que simplesmente “sentei” neste contexto.
- source_word: מְשׁוֹמֵם
  choice: horrorizado
  rationale: O particípio descreve alguém atônito e devastado diante do ocorrido. “Horrorizado” comunica o choque moral e emocional sem o tom potencialmente neutro de “admirado” ou “espantado”.
