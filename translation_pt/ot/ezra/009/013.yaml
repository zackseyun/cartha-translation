base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: pt
  text: E, depois de tudo o que veio sobre nós por causa de nossas más ações e de nossa grande culpa — embora tu, nosso Deus, nos tenhas castigado menos do que nossas iniquidades mereciam[a] e nos tenhas dado um remanescente como este[b] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos tenhas poupado mais do que nossas iniquidades mereciam”. O hebraico expressa que Deus reteve o juízo abaixo da medida da culpa do povo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sobreviventes” ou “um escape”. O termo se refere aos que foram preservados através do juízo; “remanescente” ressalta o contexto pós-exílico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: E, depois de
  rationale: Mantém a conjunção hebraica e o vínculo da oração de Esdras com o contexto anterior, em formulação natural em português.
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: tudo o que veio sobre nós
  rationale: Conserva a imagem hebraica da calamidade que sobrevém ao povo, sem reduzi-la ao sentido mais genérico de mero acontecimento.
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים
  choice: por causa de nossas más ações
  rationale: Explicita o valor causal da preposição ב neste contexto e mantém o caráter moral dos atos.
- source_word: וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: e de nossa grande culpa
  rationale: אַשְׁמָה indica culpa objetiva ou responsabilidade moral, não apenas um sentimento subjetivo de culpa.
- source_word: כִּי
  choice: embora
  rationale: 'Expressa a nuance concessiva do contexto: apesar da culpa e das calamidades, Deus tratou o povo com misericórdia.'
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: nos tenhas castigado menos do que nossas iniquidades mereciam
  rationale: 'Comunica de modo claro o sentido do idioma hebraico: Deus reteve a plena medida do juízo correspondente à culpa do povo.'
- source_word: עָוֺן
  choice: iniquidades
  rationale: Preserva a gravidade do termo, que pode abranger tanto a perversidade cometida quanto a culpa decorrente dela.
- source_word: וְנָתַתָּה לָּנוּ
  choice: e nos tenhas dado
  rationale: O pretérito perfeito composto do subjuntivo harmoniza-se com a construção concessiva e apresenta a ação passada com relevância para a situação presente.
- source_word: פְּלֵיטָה
  choice: um remanescente
  rationale: No contexto pós-exílico, designa a comunidade sobrevivente preservada através do juízo, sem excluir os sentidos lexicais de escape ou sobreviventes.
- source_word: כָּזֹאת
  choice: como este
  rationale: Mantém a força demonstrativa, apontando para o grupo preservado que está diante de Esdras.
theological_decisions:
- issue: A misericórdia divina em relação ao juízo merecido
  choice: nos tenhas castigado menos do que nossas iniquidades mereciam
  alternative: nos tenhas poupado além do que nossas iniquidades permitiriam
  rationale: 'A tradução principal torna explícito o resultado do ato divino de reter: o juízo sofrido foi menor que o merecido. A nota preserva a forma alternativa mais próxima do verbo hebraico “reter/poupar”, sem impor uma formulação doutrinária posterior.'
- issue: Sentido de פְּלֵיטָה no contexto pós-exílico
  choice: um remanescente
  alternative: sobreviventes; escape
  rationale: “Remanescente” comunica adequadamente a comunidade preservada após o juízo e o exílio, enquanto a nota registra a amplitude lexical do termo hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção permanece aberta, terminando com travessão, porque o pensamento prossegue no versículo seguinte. Os pronomes e formas verbais na segunda pessoa do singular preservam o discurso direto e solene dirigido a Deus.
