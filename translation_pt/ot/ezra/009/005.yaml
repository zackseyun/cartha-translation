base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: pt
  text: 'Na hora da oferta da tarde, levantei-me do meu jejum[a], com minha veste e meu manto rasgados. Então me ajoelhei, estendi as mãos para Yahweh, meu Deus:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “oferta de cereal da tarde”. O termo hebraico muitas vezes designa uma oferta de cereal, embora aqui também possa indicar, de modo mais geral, o horário do sacrifício da tarde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: Na hora da oferta da tarde
  rationale: מִנְחָה pode designar uma dádiva ou, no culto, uma oferta de cereal; com “da tarde”, também pode indicar de modo mais amplo o horário sacrificial vespertino. A formulação preserva essa amplitude no texto, com a especificação em nota.
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: levantei-me do meu jejum
  rationale: קום indica levantar-se, e תַּעֲנִיתִי provavelmente se refere concretamente ao jejum de Esdras como expressão de aflição e humilhação.
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: ainda com minha túnica e meu manto rasgados
  rationale: A construção com בְּ expressa circunstância concomitante. “Ainda” torna claro que as peças permaneciam rasgadas, enquanto “túnica” e “manto” mantêm a distinção entre בֶּגֶד e מְעִיל.
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: Então me ajoelhei
  rationale: כרע significa dobrar-se ou pôr-se de joelhos. “Me ajoelhei” é natural em português e evita a redundância menos idiomática de “ajoelhei-me sobre os joelhos”.
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: estendi as mãos
  rationale: פרשׂ com כַּפַּיִם descreve o gesto de abrir ou estender as mãos em oração. “Estendi as mãos” comunica naturalmente a imagem.
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: para Yahweh, meu Deus
  rationale: A preposição אֶל indica a direção do gesto e da oração. O nome divino יהוה é transliterado “Yahweh”, preservando seu caráter de nome próprio.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome divino em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Natureza de תַּעֲנִיתִי
  choice: meu jejum
  alternative: minha humilhação / minha aflição
  rationale: O substantivo pode envolver auto-humilhação ou aflição, mas neste contexto designa provavelmente a prática concreta do jejum. A tradução mantém essa ação sem apagar seu sentido penitencial contextual.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade no Brasil e internacionalmente. A oração foi dividida em duas frases para clareza narrativa; a vírgula final foi preservada porque o discurso de Esdras continua no versículo seguinte.
