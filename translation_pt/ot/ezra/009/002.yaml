base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: pt
  text: Pois eles tomaram para si e para seus filhos algumas das filhas desses povos[a], e a descendência santa[b] se misturou com os povos das terras. A atuação dos oficiais e dos delegados foi a principal nesta infidelidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomaram algumas das filhas desses povos em casamento”. O hebraico diz literalmente “tomaram dentre as filhas deles”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a semente santa”. A expressão preserva a linguagem de linhagem e pertencimento à comunidade da aliança.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, mais literalmente: “a mão dos oficiais e dos delegados foi a primeira nesta infidelidade”. A expressão indica envolvimento ativo e pode indicar responsabilidade principal, com possível nuance de prioridade.'
    reason: ambiguity
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: tomaram algumas das filhas deles
  rationale: O verbo significa literalmente “tomar” e, neste contexto, refere-se a tomar mulheres em casamento. “Algumas das” expressa de modo natural o valor partitivo de מִן, preservando a formulação hebraica sem ocultar o sentido matrimonial.
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: para si e para seus filhos
  rationale: A preposição לְ indica aqui beneficiário ou destinatário; a formulação deixa claro que os próprios homens e também seus filhos participaram dessas uniões.
- source_word: וְהִתְעָרְבוּ
  choice: se misturou
  rationale: O hitpael exprime mistura ou entrelaçamento. A concordância no singular acompanha o sujeito coletivo “descendência”.
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: a descendência santa
  rationale: “Descendência” conserva o sentido genealógico e pactual de זֶרַע em português corrente, sem sugerir uma teoria racial nem reduzir a expressão a uma abstração.
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: com os povos das terras
  rationale: “Com” comunica a ideia de mistura, enquanto “povos das terras” preserva os plurais e a linguagem própria do contexto pós-exílico.
- source_word: וְיַד
  choice: E a mão
  rationale: Mantém a metáfora hebraica de agência e participação ativa; a nota esclarece seu valor idiomático.
- source_word: הַשָּׂרִים וְהַסְּגָנִים
  choice: os líderes e os oficiais
  rationale: Os termos designam responsáveis políticos e administrativos. Esta tradução é clara e contemporânea sem lhes atribuir necessariamente posição monárquica.
- source_word: מַּעַל
  choice: infidelidade
  rationale: מעל denota quebra de confiança ou de fidelidade, frequentemente em sentido pactual; “infidelidade” preserva melhor essa dimensão do que o termo genérico “transgressão”.
- source_word: רִאשׁוֹנָה
  choice: esteve à frente
  rationale: O termo funciona predicativamente e indica protagonismo ou responsabilidade principal, não apenas prioridade cronológica.
theological_decisions:
- issue: Sentido de “descendência santa” no contexto dos casamentos com povos vizinhos
  choice: Manter a expressão pactual “descendência santa”, explicando a alternativa lexical em nota.
  alternative: Traduzir como “semente santa” ou interpretar a frase explicitamente em termos de pureza étnica.
  rationale: A tradução preserva a forte linguagem genealógica e pactual do texto no contexto da comunidade pós-exílica, sem importar categorias raciais posteriores nem diluir a tensão do original.
- issue: Responsabilidade dos dirigentes
  choice: Preservar a imagem da “mão” e traduzir רִאשׁוֹנָה como “esteve à frente”.
  alternative: Parafrasear diretamente como “os líderes foram os principais culpados” ou entender “primeira” apenas em sentido cronológico.
  rationale: A formulação mantém a metáfora hebraica e comunica que os dirigentes tiveram papel de liderança e responsabilidade destacada nessa infidelidade, sem eliminar a possível nuance temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva as imagens centrais do hebraico, usando notas apenas onde a literalidade poderia ocultar o sentido matrimonial, pactual ou idiomático.
