  source_fidelity: A tradução reproduz com fidelidade o apelo a Yahweh, a confissão de sua justiça, a preservação passiva de um remanescente, a apresentação do povo em culpa e a impossibilidade impessoal de permanecer diante de Deus por causa disso. «Ninguém pode permanecer» comunica adequadamente o sentido idiomático de אֵין לַעֲמֹד, sem restringir indevidamente o sujeito a «nós».
