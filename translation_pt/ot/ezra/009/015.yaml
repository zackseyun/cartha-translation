  terminology: «Yahweh», «Deus de Israel», «justo», «remanescente» e «culpa» são escolhas consistentes e adequadas ao hebraico e ao registro bíblico. A nota explicativa é pertinente e está corretamente ancorada no segmento idiomático final.
