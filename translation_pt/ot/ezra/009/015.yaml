id: EZR.9.15
reference: Ezra 9:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: pt
  text: Ó Yahweh, Deus de Israel, tu és justo, pois fomos deixados como um remanescente, como hoje se vê. Aqui estamos diante de ti com a nossa culpa, pois ninguém pode permanecer diante de ti por causa disso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não há como permanecer diante de ti por causa disso”; isto é, ninguém consegue subsistir em sua presença sob essa culpa.'
    reason: Esclarece a forma impessoal e o sentido idiomático da expressão hebraica.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Deus de Israel
  rationale: Reproduz de modo direto e natural a construção hebraica.
- source_word: צַדִּיק
  choice: justo
  rationale: Abrange aqui a retidão moral e judicial de Deus; é também a formulação mais natural em português neste tipo de declaração.
- source_word: כִּי
  choice: pois
  rationale: Preserva em ambas as ocorrências a relação explicativa ou causal indicada pelo hebraico.
- source_word: נִשְׁאַרְנוּ פְלֵיטָה
  choice: fomos deixados como um remanescente
  rationale: Mantém a nuance passiva do nifal e o sentido coletivo de pessoas que escaparam ao juízo e sobreviveram.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: como hoje se vê
  rationale: Expressa em português atual a referência hebraica à situação presente e constatável.
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: Aqui estamos diante de ti
  rationale: Transmite a força apresentativa de הִנְנוּ sem recorrer ao arcaico 'eis-nos'.
- source_word: בְּאַשְׁמָתֵינוּ
  choice: com a nossa culpa
  rationale: Descreve o povo comparecendo perante Deus carregando sua culpa; a expressão é clara e idiomática em português.
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ עַל זֹאת
  choice: pois ninguém pode permanecer diante de ti por causa disso
  rationale: Torna natural a construção existencial impessoal do hebraico e conserva a ideia de não poder subsistir na presença de Deus por causa da culpa confessada.
theological_decisions:
- issue: Sentido da justiça divina no contexto
  choice: tu és justo
  alternative: tu és reto
  rationale: A declaração reconhece a retidão de Deus sem restringi-la apenas ao castigo nem explicar como a preservação do remanescente demonstra essa justiça.
- issue: Sujeito implícito em אֵין לַעֲמוֹד
  choice: ninguém pode permanecer
  alternative: não podemos permanecer
  rationale: A construção hebraica é impessoal. A tradução escolhida preserva essa generalidade, embora o contexto a aplique diretamente aos confessantes.
- issue: Relação lógica do segundo כִּי
  choice: pois
  alternative: embora
  rationale: O hebraico introduz uma explicação da gravidade de comparecer diante de Deus em culpa; não é necessário converter essa relação em concessão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa do singular por se tratar de oração direta a Deus. Evitou-se linguagem excessivamente arcaica, preservando-se a solenidade e a tensão entre a justiça divina, a sobrevivência do remanescente e a culpa que impede permanecer diante de Deus.
