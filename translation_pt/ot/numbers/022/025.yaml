  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: pt
  text: Quando a jumenta viu o anjo de Yahweh[a], espremiu-se contra o muro e apertou o pé de Balaão contra o muro. Então ele tornou a bater nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Yahweh”. Neste contexto, o ser é claramente sobrenatural; por isso, usa-se “anjo” no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: a jumenta
  rationale: O substantivo אָתוֹן designa especificamente uma fêmea do jumento; “jumenta” é natural, claro e preserva essa informação em português.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”; neste contexto, trata-se claramente de um ser sobrenatural, por isso “anjo” é a tradução principal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama no texto hebraico.
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: encostou-se contra o muro
  rationale: A forma verbal descreve a jumenta comprimindo o próprio corpo junto ao muro; esta formulação é natural em português e prepara com clareza a consequência para o pé de Balaão.
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: e apertou o pé de Balaão contra o muro
  rationale: O verbo indica que o movimento da jumenta prendeu ou comprimiu o pé de Balaão contra o muro; “apertou” comunica esse efeito sem exagerá-lo como “esmagou”.
- source_word: רֶגֶל
  choice: pé
  rationale: “Pé” é o sentido normal e contextualmente apropriado do termo neste episódio.
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: Então ele tornou a bater nela
  rationale: A construção יָסַף com infinitivo indica repetição da ação. “Tornou a bater nela” expressa de modo natural que Balaão bateu novamente na jumenta.
theological_decisions:
- issue: Tradução de מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  alternative: o mensageiro de Yahweh
  rationale: Embora מַלְאַךְ seja lexicalmente ambíguo, o contexto narrativo identifica uma entidade sobrenatural. A alternativa literal é preservada em nota.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Jumenta” preserva naturalmente o sexo do animal; “muro” e “tornou a bater” mantêm clareza narrativa sem linguagem excessivamente técnica.
