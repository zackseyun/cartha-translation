  text: וַ/יָּ֤קָם בִּלְעָם֙ בַּ/בֹּ֔קֶר וַ/יֹּ֨אמֶר֙ אֶל שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל אַרְצְ/כֶ֑ם כִּ֚י מֵאֵ֣ן יְהוָ֔ה לְ/תִתִּ֖/י לַ/הֲלֹ֥ךְ עִמָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: pt
  text: 'Então Balaão se levantou pela manhã e disse aos oficiais de Balaque[a]: “Vão para a terra de vocês, pois Yahweh se recusou a permitir que eu fosse com vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “príncipes de Balaque” ou “chefes de Balaque”.
    reason: Alternativas lexicais legítimas para שָׂרֵי, cujo sentido abrange oficiais, príncipes e líderes.
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal narrativo de קום introduz a ação seguinte; “se levantou” é natural e preserva o sentido do hebraico.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Expressão temporal corrente e natural em português, sem acrescentar a ideia de que foi muito cedo.
- source_word: שָׂרֵי בָלָק
  choice: oficiais de Balaque
  rationale: שָׂרִים pode designar príncipes, chefes ou oficiais. No contexto, são representantes do rei; “oficiais” comunica essa função sem pressupor nobreza hereditária.
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: Voltem para a terra de vocês
  rationale: Embora לְכוּ signifique literalmente “vão”, o contexto indica o retorno dos emissários ao seu território. “Voltem” torna explícita essa direção contextual, e “terra de vocês” preserva אֶרֶץ.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem de Balaão. “Pois” é claro, digno e natural neste discurso.
- source_word: מֵאֵן
  choice: se recusou
  rationale: O piel perfeito de מאן expressa uma recusa decidida; o pretérito perfeito português representa naturalmente essa decisão já manifestada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: לְתִתִּי
  choice: a permitir que eu fosse
  rationale: נתן seguido de infinitivo tem aqui o sentido idiomático de permitir. A oração finita é a forma mais natural em português.
- source_word: לַהֲלֹךְ עִמָּכֶם
  choice: fosse com vocês
  rationale: הלך com עִם indica acompanhar a delegação. “Ir com vocês” é o sentido, ajustado para “fosse” após “permitir que”.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Equivalente narrativo padrão e natural do verbo hebraico de fala.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O versículo emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação evita arcaísmos; “vocês” representa de modo inequívoco o plural hebraico. O marcador [a] aparece imediatamente após a expressão anotada.
