  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: pt
  text: 'Então Deus veio a Balaão e disse: “Quem são estes homens que estão com você?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O qal wayyiqtol de בוא dá continuidade à narrativa e, neste contexto, significa naturalmente “veio”; “entrou” acrescentaria uma especificidade ausente no hebraico.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Com verbo no singular e neste contexto narrativo, o termo designa Deus como agente pessoal.
- source_word: אֶל בִּלְעָם
  choice: a Balaão
  rationale: A preposição אֶל indica direção, e o nome próprio segue a forma tradicional e amplamente reconhecida em português.
- source_word: וַיֹּאמֶר
  choice: e perguntou
  rationale: Embora אמר signifique literalmente “disse”, a fala introduzida é uma pergunta; “perguntou” expressa com naturalidade a função comunicativa sem alterar o conteúdo.
- source_word: מִי
  choice: Quem
  rationale: O interrogativo pede a identificação de pessoas.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: estes homens
  rationale: O substantivo masculino plural refere-se aos emissários homens presentes, e o demonstrativo aponta para eles de modo específico.
- source_word: עִמָּךְ
  choice: que estão com você
  rationale: A expressão indica companhia ou associação. A forma expandida é idiomática em português e evita a construção menos natural “estes homens com você”.
- source_word: וַ
  choice: Então
  rationale: O waw ligado ao wayyiqtol faz a narrativa avançar; “Então” comunica essa sequência com fluidez em português.
theological_decisions:
- issue: Referente de אֱלֹהִים na narrativa de Balaão
  choice: Deus
  alternative: um deus; um ser divino
  rationale: O verbo no singular e o contexto narrativo identificam o referente como Deus. Essa tradução preserva o sentido do texto sem acrescentar uma explicação doutrinária.
- issue: A pergunta divina e o conhecimento de Deus
  choice: Manter a pergunta direta sem explicação interpretativa
  alternative: Parafrasear como uma pergunta meramente retórica ou como indicação de desconhecimento
  rationale: O hebraico registra apenas a pergunta. A tradução não deve resolver a possível tensão teológica acrescentando uma motivação que o versículo não declara.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Você” representa naturalmente o sufixo de segunda pessoa masculina singular no uso brasileiro contemporâneo. Não há necessidade de nota de rodapé neste versículo.
