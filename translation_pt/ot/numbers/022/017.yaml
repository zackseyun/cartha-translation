base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: pt
  text: Pois eu lhe darei grandes honras[a] e farei tudo o que você me disser. Venha, por favor, e amaldiçoe este povo para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu certamente o honrarei muito” ou “eu o recompensarei generosamente”. O hebraico combina um infinitivo absoluto com um verbo finito para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a promessa de Balaque como fundamento de seu pedido renovado, preservando a ligação explicativa do hebraico.
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: eu lhe darei grandes honras
  rationale: Preserva a linguagem de honra da raiz כבד e expressa naturalmente em português a forte ênfase produzida pelo infinitivo absoluto, pelo verbo finito e por מְאֹד.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: e farei tudo o que você me disser
  rationale: Mantém a abrangência de כֹל אֲשֶׁר em ordem idiomática portuguesa, sem restringir o alcance da promessa.
- source_word: וּלְכָה נָּא
  choice: Venha, por favor
  rationale: Traduz o imperativo de movimento e a partícula נָא como um pedido insistente e cortês. A nova oração dispensa um conectivo acrescentado.
- source_word: קָבָה לִּי
  choice: amaldiçoe ... para mim
  rationale: Expressa diretamente o pedido de pronunciar uma maldição em benefício de Balaque e conserva o interesse pessoal indicado por לִּי.
- source_word: אֵת הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o substantivo coletivo singular עָם em português natural.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” é claro e natural; “lhe” evita repetição pesada. A tradução conserva a ênfase da promessa sem substituir silenciosamente a linguagem de honra pela ideia contextual de recompensa.
