base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: pt
  text: 'Então a jumenta disse a Balaão: “Não sou eu a sua jumenta, na qual você tem montado durante toda a sua vida até hoje? Alguma vez tive o costume de agir assim com você?” Ele respondeu: “Não.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: a jumenta / a sua jumenta
  rationale: O substantivo אָתוֹן designa especificamente uma fêmea do jumento; “jumenta” é natural em português e preserva essa informação lexical sem necessidade de nota.
- source_word: הֲלוֹא אָנֹכִי
  choice: Não sou eu
  rationale: Reproduz a pergunta retórica que espera resposta afirmativa e mantém a ênfase do pronome אָנֹכִי.
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: na qual você tem montado
  rationale: Expressa claramente a ação continuada de montar sobre o animal, em linguagem portuguesa corrente e digna.
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: durante toda a sua vida até hoje
  rationale: Transmite naturalmente o sentido temporal do hebraico, desde o início da experiência de Balaão até o presente.
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: Alguma vez tive o costume
  rationale: A construção intensiva com infinitivo absoluto e verbo finito pergunta por um comportamento habitual; “alguma vez” preserva a força retórica.
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: de agir assim com você
  rationale: “Agir assim” representa de modo natural o hebraico כֹּה, que aponta para o comportamento incomum da jumenta.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Ele respondeu: “Não.”'
  rationale: Embora o hebraico diga literalmente “e ele disse”, “respondeu” explicita naturalmente a função da fala no diálogo sem alterar seu conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. Emprega “você” para o singular, evita arcaísmos e preserva o tom direto da argumentação da jumenta. A especificidade feminina de אָתוֹן é mantida no próprio texto por “jumenta”, dispensando a nota lexical do inglês.
