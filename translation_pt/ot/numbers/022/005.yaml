  text: וַ/יִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל בִּלְעָ֣ם בֶּן בְּע֗וֹר פְּ֠תוֹרָ/ה אֲשֶׁ֧ר עַל הַ/נָּהָ֛ר אֶ֥רֶץ בְּנֵי עַמּ֖/וֹ לִ/קְרֹא ל֑/וֹ לֵ/אמֹ֗ר הִ֠נֵּה עַ֣ם יָצָ֤א מִ/מִּצְרַ֨יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/ה֥וּא יֹשֵׁ֖ב מִ/מֻּלִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: pt
  text: 'Então ele enviou mensageiros a Balaão, filho de Beor, em Petor, que fica junto ao Rio[a], na terra dos filhos do seu povo[b], para chamá-lo, dizendo: “Eis que um povo saiu do Egito. Eis que ele cobriu a face da terra[c] e está instalado diante de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Rio”; provavelmente o Eufrates.'
    reason: cross_reference
  - marker: b
    text: 'Ou: “na terra do seu povo”. A expressão hebraica “a terra dos filhos do seu povo” é difícil, e o pronome “seu” pode ser entendido de diferentes maneiras.'
    reason: alternative_reading
  - marker: c
    text: Literalmente, “cobriu o olho da terra”; a expressão se refere à face ou superfície visível da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ele enviou
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto diplomático, o termo designa enviados humanos, não anjos.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaão, filho de Beor
  rationale: Emprega as formas tradicionais e reconhecíveis dos nomes em português.
- source_word: פְּתוֹרָה
  choice: em Petor
  rationale: A terminação direcional pode indicar movimento para o lugar, mas a construção completa localiza Balaão ali; esta formulação é natural sem apagar a referência geográfica.
- source_word: אֲשֶׁר עַל־הַנָּהָר
  choice: que fica junto ao Rio
  rationale: Mantém “o Rio” no texto principal, como no hebraico, sem explicitar ali a provável identificação com o Eufrates.
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: na terra dos filhos do seu povo
  rationale: Preserva a construção difícil e a ambiguidade do pronome, evitando substituí-la silenciosamente por uma interpretação específica.
- source_word: לִקְרֹא לוֹ
  choice: para chamá-lo
  rationale: Expressa de modo direto a finalidade do envio, sem a nuance mais forte de “convocá-lo”.
- source_word: הִנֵּה
  choice: Eis que
  rationale: A repetição mantém a força enfática e de chamada de atenção do hebraico em registro digno e ainda corrente.
- source_word: יָצָא מִמִּצְרַיִם
  choice: saiu do Egito
  rationale: O perfeito hebraico apresenta o acontecimento como fato consumado; o pretérito perfeito é natural em português.
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  choice: cobriu a face da terra
  rationale: “Face da terra” comunica o sentido idiomático de עֵין, literalmente “olho”, preservando parte da imagem sem produzir obscuridade.
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: e está estabelecido diante de mim
  rationale: Representa o sentido durativo de יֹשֵׁב e a posição expressa por מִמֻּלִי sem acrescentar explicitamente a ideia de acampamento.
theological_decisions:
- issue: Referente do pronome em אֶרֶץ בְּנֵי עַמּוֹ
  choice: Manter “seu” sem identificar o referente
  alternative: “na terra do povo de Balaão” ou “na terra do seu próprio povo”
  rationale: O hebraico é difícil e permite mais de uma compreensão; a tradução principal não deve resolver uma ambiguidade textual genuína.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi suavizada apenas onde necessário, preservando as repetições enfáticas, a imagem de “face da terra” e a dificuldade textual de “terra dos filhos do seu povo”.
