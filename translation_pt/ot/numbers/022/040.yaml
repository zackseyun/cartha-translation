revisions:
- from: Então Balaque sacrificou bois e animais do rebanho[a] e enviou uma parte[b] a Balaão e às autoridades que estavam com ele.
  to: Então Balaque sacrificou gado e animais do rebanho[a] e enviou parte deles[b] a Balaão e às autoridades que estavam com ele.
  rationale: A revisão substitui “bois” por “gado”, para não limitar o coletivo בקר a machos, e ajusta “enviou uma parte” para “enviou parte deles”, uma formulação portuguesa mais natural que mantém a inferência contextual sem apresentar o objeto como expresso no texto hebraico. As notas continuam adequadas e os seus marcadores permanecem corretamente ancorados.
