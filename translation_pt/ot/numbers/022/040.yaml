base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: pt
  text: Então Balaque sacrificou gado e animais do rebanho[a] e enviou parte deles[b] a Balaão e às autoridades que estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ovelhas e cabras”. O termo hebraico designa coletivamente animais de pequeno porte criados em rebanhos.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “enviou”. O contexto sugere que foram enviadas partes dos animais sacrificados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: sacrificou
  rationale: O verbo זבח normalmente indica abate sacrificial; “sacrificou” preserva de modo conciso o sentido cultual.
- source_word: בָּקָר
  choice: bois
  rationale: בקר é um coletivo para bovinos. “Bois” é a formulação bíblica corrente e natural em português, sem exigir uma expressão técnica.
- source_word: צֹאן
  choice: animais do rebanho
  rationale: צאן pode abranger ovelhas e cabras; esta tradução preserva a extensão coletiva do termo sem restringi-lo apenas a ovelhas.
- source_word: וַיְשַׁלַּח
  choice: enviou uma parte
  rationale: O verbo significa literalmente “enviou”, sem objeto expresso. Pelo contexto do sacrifício, entende-se que Balaque enviou parte dos animais sacrificados; a nota registra a concisão e a ambiguidade do hebraico.
- source_word: לְבִלְעָם
  choice: a Balaão
  rationale: O nome pessoal é vertido segundo sua forma tradicional e amplamente reconhecida em português.
- source_word: לַשָּׂרִים
  choice: às autoridades
  rationale: שׂרים designa pessoas de posição elevada ou oficiais; “autoridades” comunica a função sem sugerir necessariamente príncipes hereditários.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: Mantém a oração relativa e o pronome do hebraico. O antecedente mais natural é Balaão, sem tornar explícito o que o original deixa pronominal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Então” dá continuidade natural à narrativa; “animais do rebanho” preserva o alcance de צאן, e as notas mantêm visíveis as alternativas lexicais e a elipse do objeto de “enviou”.
