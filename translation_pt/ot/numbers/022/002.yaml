  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: pt
  text: Balaque, filho de Zipor, viu tudo o que Israel havia feito aos amorreus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “ao amorreu”; o termo étnico no singular tem sentido coletivo, isto é, “aos amorreus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: O wayyiqtol de ראה dá continuidade à narrativa. O pretérito perfeito é natural em português, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: בָּלָק
  choice: Balaque
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן צִפּוֹר
  choice: filho de Zipor
  rationale: Reproduz naturalmente a cadeia construta hebraica que indica filiação.
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: Expressa de modo idiomático a totalidade do objeto direto introduzido por אֵת.
- source_word: עָשָׂה
  choice: havia feito
  rationale: O mais-que-perfeito composto deixa clara a anterioridade das ações de Israel em relação ao momento em que Balaque as percebeu, sem alterar o sentido contextual do perfeito hebraico.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma padrão em português para o nome do povo.
- source_word: לָאֱמֹרִי
  choice: aos amorreus
  rationale: A preposição ל indica aquilo que foi feito ao grupo; o substantivo é singular coletivo no hebraico, mas o plural étnico é a forma natural em português.
