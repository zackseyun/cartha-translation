    rationale: O contexto permite inferir que os emissários retornavam, mas וַיָּבֹאוּ אֶל־בָּלָק enuncia apenas que foram/chegaram a Balaque. A tradução deve evitar transformar a inferência contextual em afirmação explícita.
  - severity: medium
    issue: «vir conosco» altera a direção expressa pelo infinitivo hebraico.
    rationale: הֲלֹךְ עִמָּנוּ significa «ir conosco». Embora «vir» possa ocorrer idiomaticamente em relato indireto, «ir» preserva a orientação do texto-fonte sem custo de naturalidade.
