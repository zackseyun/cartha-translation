  yaml_path: translation/ot/numbers/022/014.yaml
  text: So the officials of Moab got up and went to Balak, and said, “Balaam refused to go with us.”
translation:
  language: pt
  text: 'Então as autoridades de Moabe se levantaram, foram até Balaque e disseram: “Balaão se recusou a ir conosco.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי מוֹאָב
  choice: os líderes de Moabe
  rationale: שָׂרִים designa autoridades ou altos representantes; “líderes” é natural e suficientemente amplo no contexto.
- source_word: וַיָּק֨וּמוּ
  choice: se levantaram
  rationale: Preserva o sentido concreto e idiomático do verbo קום ao iniciar a partida.
- source_word: וַיָּבֹאוּ אֶל־בָּלָק
  choice: voltaram a Balaque
  rationale: Embora בוא signifique literalmente “foram/chegaram”, o contexto indica o retorno dos enviados àquele que os mandou; “voltaram a” expressa naturalmente esse movimento sem alterar seu destino.
- source_word: מֵאֵן
  choice: se recusou
  rationale: Traduz diretamente a recusa deliberada expressa pelo verbo מאן.
- source_word: הֲלֹךְ עִמָּנוּ
  choice: a vir conosco
  rationale: Na fala dos emissários a Balaque, o movimento é apresentado de modo natural em português como “vir conosco”; o infinitivo absoluto associado ao verbo reforça a ação recusada, sem exigir intensificação explícita.
