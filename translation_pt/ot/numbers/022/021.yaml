base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/021.yaml
  text: So Balaam rose in the morning[a], saddled his donkey, and went with the princes of Moab.
translation:
  language: pt
  text: Então Balaão se levantou pela manhã, selou sua jumenta e foi com os príncipes de Moabe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal wayyiqtol de קום dá sequência à narrativa; “se levantou” é natural em português e expressa diretamente a ação.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Traduz a expressão temporal sem acrescentar a ideia de que era muito cedo, não explicitada no hebraico.
- source_word: וַיַּחֲבֹשׁ
  choice: selou
  rationale: Neste contexto, חבש designa preparar o animal para montaria, isto é, colocar-lhe a sela.
- source_word: אֶת אֲתֹנוֹ
  choice: sua jumenta
  rationale: אָתוֹן designa especificamente uma fêmea do jumento; “jumenta” é claro, natural e preserva no texto a precisão lexical relevante para a narrativa.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Equivalente direto e idiomático de הלך na sequência narrativa.
- source_word: עִם
  choice: com
  rationale: Expressa de modo direto a relação de acompanhamento.
- source_word: שָׂרֵי מוֹאָב
  choice: os príncipes de Moabe
  rationale: שָׂרִים pode indicar governantes ou altos dignitários; “príncipes” preserva seu status elevado e a continuidade literária do relato.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e fluente, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A especificidade feminina de אָתוֹן foi mantida diretamente como “jumenta”, tornando desnecessária uma nota lexical.
