base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: pt
  text: A jumenta me viu e se desviou diante de mim estas três vezes. Se ela não tivesse se desviado de diante de mim[a], a esta altura eu certamente teria matado você e a teria deixado viva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “talvez ela tenha se desviado de diante de mim”. Em geral, a frase é entendida como uma condição contrafactual: “se ela não tivesse se desviado de diante de mim”, sentido que corresponde ao contexto e à declaração seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַ֨נִי֙
  choice: me viu
  rationale: O verbo ראה indica percepção visual direta; “me viu” é a formulação mais simples e natural.
- source_word: הָאָתוֹן
  choice: a jumenta
  rationale: אָתוֹן designa especificamente uma fêmea do jumento. “Jumenta” é corrente e preserva essa informação lexical em português.
- source_word: וַתֵּט לְפָנַי
  choice: se desviou de diante de mim
  rationale: נטה expressa desvio de direção; a formulação também mantém a relação espacial indicada por לְפָנַי.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: estas três vezes
  rationale: A expressão é idiomática e conta três ocorrências; “estas três vezes” comunica isso com clareza.
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: Se ela não tivesse se desviado de diante de mim
  rationale: Embora אוּלַי costume significar “talvez” e o texto massorético não traga negação explícita, a lógica narrativa exige aqui uma condição contrafactual negativa. A dificuldade é registrada em nota.
- source_word: כִּי עַתָּה
  choice: a esta altura ... certamente
  rationale: A expressão introduz o resultado contrafactual com força temporal e enfática; a construção portuguesa distribui naturalmente esses dois elementos.
- source_word: גַּם אֹתְכָה הָרַגְתִּי
  choice: eu certamente teria matado você
  rationale: O perfeito funciona no resultado de uma condição irreal e por isso é expresso pelo futuro do pretérito composto. “Certamente” transmite a ênfase contextual associada a גַּם e כִּי.
- source_word: וְאוֹתָהּ הֶחֱיֵיתִי
  choice: e deixado que ela vivesse
  rationale: O hifil de חיה significa conservar com vida ou deixar viver; a escolha preserva o contraste direto com a morte de Balaão.
theological_decisions:
- issue: Condição contrafactual apesar da ausência aparente de negação explícita no texto massorético
  choice: “Se ela não tivesse se desviado de diante de mim”
  alternative: “Talvez ela tenha se desviado de diante de mim”
  rationale: A continuação afirma que, de outro modo, Balaão teria sido morto e a jumenta teria vivido. Portanto, o desvio da jumenta é aquilo que impediu a morte dele. A tradução explicita a condição negativa exigida pelo contexto, mas a nota conserva a forma e a ambiguidade do hebraico transmitido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Jumenta” preserva o sexo do animal indicado pelo substantivo hebraico. A estrutura contrafactual é idiomática em português, enquanto a nota documenta a forma incomum do texto hebraico.
