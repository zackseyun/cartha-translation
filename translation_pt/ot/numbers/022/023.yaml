  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: pt
  text: Quando a jumenta viu o anjo de Yahweh[a] parado no caminho, com a espada desembainhada na mão, desviou-se do caminho e foi para o campo. Então Balaão bateu na jumenta para fazê-la voltar ao caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o mensageiro de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: a jumenta
  rationale: אָתוֹן designa especificamente uma fêmea do jumento; “jumenta” é natural em português e preserva o gênero do termo hebraico.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar “mensageiro” ou “anjo”; neste contexto, a figura sobrenatural com a espada desembainhada favorece “anjo”, sem apagar a alternativa lexical, registrada em nota.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: parado no caminho
  rationale: O particípio נִצָּב descreve a posição do anjo, e בַּדֶּרֶךְ o situa no caminho, obstruindo a passagem. “Parado no caminho” é direto e idiomático.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: com a espada desembainhada na mão
  rationale: שְׁלוּפָה indica que a espada estava tirada da bainha. A construção com “com” preserva a imagem em português natural.
- source_word: וַתֵּט הָאָתוֹן מִן הַדֶּרֶךְ
  choice: desviou-se do caminho
  rationale: נָטָה indica aqui afastar-se ou sair da rota; “desviou-se” expressa com clareza o movimento da jumenta.
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: foi para o campo
  rationale: שָׂדֶה pode designar campo ou terreno aberto. “Campo” mantém a concretude da cena e contrasta com o caminho.
- source_word: וַיַּךְ
  choice: bateu
  rationale: נכה é um verbo amplo para golpear. “Bateu” é corrente e claro, sem pressupor por si só uma série de golpes.
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: para fazê-la voltar ao caminho
  rationale: O infinitivo causativo com sufixo feminino indica que Balaão quis fazer a jumenta mudar de direção. Como ela havia acabado de sair do caminho, “voltar ao caminho” explicita naturalmente a direção implícita no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino יְהוָה. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de מַלְאַךְ em מַלְאַךְ יְהוָה
  choice: anjo
  alternative: mensageiro
  rationale: A aparição invisível a Balaão, mas vista pela jumenta, e a espada desembainhada indicam um ser celestial; contudo, a amplitude lexical de מַלְאָךְ é preservada em nota, sem definir além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “jumenta” para preservar o sexo do animal, “bateu” como verbo comum sem intensificação indevida e “Yahweh” como transliteração do nome divino.
