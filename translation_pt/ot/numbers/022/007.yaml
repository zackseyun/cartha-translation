  text: וַ/יֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְ/זִקְנֵ֣י מִדְיָ֔ן וּ/קְסָמִ֖ים בְּ/יָדָ֑/ם וַ/יָּבֹ֨אוּ֙ אֶל בִּלְעָ֔ם וַ/יְדַבְּר֥וּ אֵלָ֖י/ו דִּבְרֵ֥י בָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: pt
  text: Então os anciãos de Moabe e os anciãos de Midiã partiram, com o pagamento pela adivinhação nas mãos[a]. Chegaram a Balaão e falaram a ele as palavras de Balaque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com adivinhações nas mãos»; a expressão hebraica pode referir-se a atos, objetos ou presságios divinatórios, embora, neste contexto, seja mais provável que indique o pagamento levado pela adivinhação.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: anciãos de
  rationale: No construto com nomes de povos, o termo designa os anciãos reconhecidos ou dirigentes mais velhos do grupo; «anciãos» preserva melhor esse papel sociopolítico do que o termo mais amplo «líderes».
- source_word: וּקְסָמִים בְּיָדָם
  choice: levando nas mãos o pagamento pela adivinhação
  rationale: קְסָמִים pode indicar adivinhações, meios divinatórios ou presságios, mas, neste contexto, provavelmente se refere por metonímia ao pagamento levado para obter o serviço divinatório de Balaão. A formulação mantém a imagem hebraica de algo levado «nas mãos».
- source_word: וַיָּבֹאוּ אֶל
  choice: Eles chegaram a
  rationale: בוא com אֶל expressa vir, chegar ou apresentar-se junto de alguém. Depois de «partiram», «chegaram a» comunica com naturalidade a sequência narrativa.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: lhe transmitiram
  rationale: דבר com אֶל significa falar a alguém. No contexto de emissários que levam palavras alheias, «transmitiram» é uma equivalência natural, sem pressupor citação direta.
- source_word: דִּבְרֵי בָלָק
  choice: as palavras de Balaque
  rationale: A expressão em construto significa literalmente «as palavras de Balaque» e deixa em aberto se eram palavras exatas ou uma mensagem comissionada.
- source_word: וַיֵּלְכוּ
  choice: Então ... partiram
  rationale: O wayyiqtol faz avançar a narrativa e decorre da ordem do versículo anterior. «Então» e «partiram» oferecem fluxo natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição «os anciãos de Moabe e os anciãos de Midiã» preserva a estrutura e a distinção dos dois grupos no hebraico. A nota mantém a ambiguidade lexical de קְסָמִים.
