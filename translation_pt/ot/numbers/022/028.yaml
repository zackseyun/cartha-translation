    rationale: A pergunta hebraica é literalmente «O que fiz a você?». Embora o contexto seja uma queixa por maus-tratos, «contra» explicita uma noção de ofensa que não está lexicalmente marcada no original.
  - severity: medium
    issue: «para que me batesse» deixa o sujeito implícito e enfraquece a apresentação direta de «você me golpeou/bateu».
    rationale: O hebraico traz explicitamente o verbo na segunda pessoa («você me golpeou»). A revisão preserva o encadeamento interrogativo idiomático em português e explicita o agente.
