  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: pt
  text: 'Então Yahweh abriu a boca da jumenta, e ela disse a Balaão: “O que fiz a você para que você me batesse estas três vezes?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: abriu
  rationale: O qal wayyiqtol de פתח expressa diretamente a ação de abrir; “abriu” é natural e preserva a ação divina explícita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פִּי הָאָתוֹן
  choice: a boca da jumenta
  rationale: Reproduz naturalmente a construção hebraica e torna claro pelo substantivo feminino que o animal é fêmea.
- source_word: וַתֹּאמֶר לְבִלְעָם
  choice: e ela disse a Balaão
  rationale: O verbo está no feminino singular; o pronome “ela” identifica naturalmente a jumenta como quem fala. “Balaão” é a forma portuguesa consagrada do nome.
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: O que eu fiz contra você
  rationale: A expressão pergunta que ofensa a jumenta teria cometido contra Balaão. “Contra você” comunica essa relação de modo claro e idiomático.
- source_word: כִּי הִכִּיתַנִי
  choice: para que me batesse
  rationale: No contexto da pergunta, כִּי introduz a consequência que motiva a queixa. “Batesse” é natural para golpes repetidos contra um animal e não aumenta indevidamente a intensidade.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: estas três vezes
  rationale: רְגָלִים, literalmente associado a “pés”, funciona aqui idiomaticamente como “vezes” ou “ocasiões”; a tradução apresenta diretamente o sentido no contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome divino, não um título. “Yahweh” preserva essa distinção e representa uma transliteração amplamente reconhecida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Jumenta” comunica naturalmente o sexo feminino indicado pelo hebraico. A locução idiomática final foi traduzida pelo sentido, sem nota, pois a literalidade envolvendo “pés” não acrescenta informação necessária ao leitor nesta unidade.
