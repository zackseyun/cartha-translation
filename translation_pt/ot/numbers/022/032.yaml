base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: pt
  text: 'E o anjo de Yahweh lhe disse: “Por que você bateu na sua jumenta estas três vezes? Veja, eu saí como seu adversário[a], porque o seu caminho é temerário diante de mim[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa aqui a palavra שָׂטָן, que significa “adversário” ou “oponente”; neste contexto, ela não é necessariamente o nome próprio “Satanás”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido como “é temerário” é raro e de sentido incerto; também pode ser entendido como “é perverso”, “é contrário” ou “é precipitado”.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar mensageiro ou anjo; neste contexto, trata-se do ser sobrenatural que confronta Balaão. O nome divino é transliterado como Yahweh.
- source_word: הִכִּיתָ אֶת אֲתֹנְךָ
  choice: você bateu na sua jumenta
  rationale: נכה significa bater ou golpear; 'bateu' é direto e natural. אֲתוֹן designa especificamente uma jumenta, distinção fácil de preservar em português.
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: estas três vezes
  rationale: A expressão idiomática significa 'três vezes' ou 'três ocasiões', não literalmente 'três pés'.
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: Veja, eu saí
  rationale: '''Veja'' preserva a função de chamar a atenção de הִנֵּה, e ''saí'' representa de modo simples o perfeito de יצא.'
- source_word: לְשָׂטָן
  choice: para me opor a você
  rationale: שָׂטָן funciona aqui como substantivo comum, 'adversário/oponente'. A formulação verbal é natural em português e explicita o alvo implícito da oposição sem identificar a palavra como nome próprio.
- source_word: יָרַט הַדֶּרֶךְ
  choice: o seu caminho é temerário
  rationale: יָרַט é raro e de sentido incerto; 'temerário' comunica um proceder imprudente e perigoso, mantendo a avaliação do caminho de Balaão sem encerrar as alternativas possíveis.
- source_word: לְנֶגְדִּי
  choice: diante de mim
  rationale: Preserva tanto a dimensão relacional quanto a avaliativa da expressão, sem intensificá-la para 'contra mim'.
theological_decisions:
- issue: Sentido de לְשָׂטָן
  choice: substantivo comum, expresso como 'para me opor a você'
  alternative: '''como adversário''; ou, inadequadamente neste contexto, ''como Satanás'''
  rationale: O anjo de Yahweh está descrevendo sua função de opositor no episódio. Tratar שָׂטָן como nome próprio importaria uma identificação teológica que o contexto não exige.
- issue: Sentido do raro verbo יָרַט
  choice: '''é temerário'' no texto, com a incerteza registrada em nota'
  alternative: '''é perverso'', ''é contrário'' ou ''é precipitado'''
  rationale: A forma hebraica é lexicalmente difícil. A tradução deve comunicar a censura ao proceder de Balaão sem apresentar como certa uma nuance discutida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você' na fala direta e preserva 'jumenta' por corresponder ao sexo específico indicado pelo hebraico. Todos os marcadores de nota aparecem no texto.
