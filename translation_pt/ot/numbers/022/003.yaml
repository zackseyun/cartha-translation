  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: pt
  text: Moabe teve muito medo por causa do povo, pois era numeroso; e Moabe ficou tomado de pavor por causa dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sentiu aversão” ou “ficou angustiado”. O verbo hebraico pode expressar aversão, perturbação ou um pavor visceral; neste contexto, o medo parece predominar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: teve muito medo
  rationale: O verbo גּוּר, neste contexto, expressa medo ou temor; מְאֹד fornece a intensificação. A expressão é natural e clara em português moderno.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: A expressão significa literalmente “de diante da face de” e, no contexto, indica a presença que provoca medo. “Diante de” preserva a imagem hebraica sem soar artificial.
- source_word: הָעָם
  choice: daquele povo
  rationale: O substantivo coletivo singular refere-se ao povo de Israel já presente no contexto. “Daquele povo” é idiomático e mantém o referente coletivo.
- source_word: כִּי רַב הוּא
  choice: porque era numeroso
  rationale: O hebraico mantém o pronome no singular em concordância com “povo”; “era numeroso” preserva essa construção e comunica que a causa do medo era o grande número de israelitas.
- source_word: וַיָּקָץ
  choice: sentiu pavor
  rationale: O verbo קוּץ pode exprimir repulsa, aflição ou um temor visceral. “Sentiu pavor” se ajusta ao contexto imediato de medo, enquanto a nota conserva a amplitude lexical.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Tradução formal e inteligível da expressão hebraica, que designa coletivamente os descendentes de Israel.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e corrente do nome em português bíblico.
