  source_fidelity: 'O texto traduz todos os elementos relevantes do hebraico: a ira divina, a causal קצרה e aspectualmente contínua de «porque ele estava indo», o posicionamento deliberado do anjo de Yahweh no caminho, «como adversário dele», a jumenta e os dois jovens que estavam com Balaão. A tensão narrativa é preservada sem explicação interpretativa.'
