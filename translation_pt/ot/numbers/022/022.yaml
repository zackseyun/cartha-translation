language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: pt
  text: Mas a ira de Deus se acendeu porque ele estava indo, e o anjo de Yahweh tomou posição no caminho como adversário dele[a]. Ele ia montado em sua jumenta, e seus dois jovens estavam com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, a palavra hebraica שָׂטָן (satan) significa “adversário” ou “oponente”; não é necessariamente o nome próprio Satanás.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: a ira de Deus se acendeu
  rationale: Preserva a imagem hebraica da ira que arde, usando uma expressão natural e digna em português.
- source_word: כִּי הוֹלֵךְ הוּא
  choice: porque ele estava indo
  rationale: Mantém tanto o valor causal de כִּי quanto o aspecto contínuo do particípio הוֹלֵךְ, sem tentar explicar a tensão narrativa com a permissão divina anterior.
- source_word: וַיִּתְיַצֵּב
  choice: tomou posição
  rationale: Expressa o posicionamento deliberado e confrontador indicado pela forma hitpael, com mais força do que simplesmente 'ficou'.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: Neste contexto, מַלְאַךְ designa um ser celestial, e o nome divino é transliterado como Yahweh.
- source_word: בַּדֶּרֶךְ
  choice: no caminho
  rationale: Representa concretamente o lugar em que o anjo bloqueia o trajeto, em português natural.
- source_word: לְשָׂטָן לוֹ
  choice: como adversário dele
  rationale: Conserva a força nominal de שָׂטָן e evita transformar o termo comum no nome próprio 'Satanás'.
- source_word: אֲתֹנוֹ
  choice: sua jumenta
  rationale: O substantivo hebraico se refere especificamente a uma fêmea; 'jumenta' comunica essa informação de modo natural em português.
- source_word: שְׁנֵי נְעָרָיו
  choice: seus dois jovens
  rationale: Mantém o sentido lexical direto de נַעַר sem decidir indevidamente entre jovens, servos ou acompanhantes.
theological_decisions:
- issue: Sentido de שָׂטָן neste contexto
  choice: 'substantivo comum: “adversário”'
  alternative: 'nome próprio ou título: “Satanás”'
  rationale: A sintaxe e o contexto descrevem o papel de oposição desempenhado pelo anjo de Yahweh. O texto não exige a identificação com Satanás.
- issue: Tensão entre a ira de Deus e a partida de Balaão
  choice: preservar “porque ele estava indo” sem explicação adicional
  alternative: explicitar que a ira se devia às intenções, à maneira ou ao propósito com que Balaão foi
  rationale: O hebraico declara a causa de forma breve, e qualquer explicação motivacional resolveria uma tensão que o próprio versículo deixa aberta.
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome divino presente no texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva a repetição pronominal e a tensão narrativa do hebraico; emprega “jumenta” para explicitar naturalmente o sexo do animal, sem necessidade de nota.
