  terminology: «Yahweh» corresponde ao tetragrama conforme a diretriz do projeto. «Anjo», «adversário» e «jumenta» são escolhas fiéis e naturais. A nota esclarece corretamente que שָׂטָן é substantivo comum neste contexto, sem impor identificação com Satanás.
