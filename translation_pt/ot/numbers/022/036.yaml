  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: pt
  text: Quando Balaque ouviu que Balaão tinha chegado, saiu ao encontro dele na cidade de Moabe[a], situada junto à fronteira do Arnom, na extremidade do território[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa cidade de Moabe”. A expressão hebraica pode indicar uma cidade específica, conhecida como cidade de Moabe, ou uma cidade pertencente a Moabe.
    reason: lexical_alternative
  - marker: b
    text: Ou “na extremidade da fronteira”. A palavra hebraica pode significar tanto “fronteira” como “território”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O verbo שׁמע tem como sentido básico “ouvir”; aqui indica que Balaque recebeu a notícia, sem especificar como ela lhe chegou.
- source_word: כִּי בָא בִלְעָם
  choice: que Balaão tinha chegado
  rationale: A oração apresenta o conteúdo do que Balaque ouviu. O mais-que-perfeito composto esclarece naturalmente em português que a chegada precedeu a saída de Balaque.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: saiu ao encontro dele
  rationale: A expressão preserva o movimento indicado por יצא e traduz de modo idiomático e neutro לִקְרָאתוֹ, sem acrescentar a ideia mais calorosa de recepção ou saudação.
- source_word: אֶל עִיר מוֹאָב
  choice: na cidade de Moabe
  rationale: Depois de “saiu ao encontro dele”, “na” expressa com naturalidade o local do encontro. A construção pode designar uma cidade conhecida como “cidade de Moabe”, embora a indefinição também seja possível.
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: situada junto à fronteira do Arnom
  rationale: עַל גְּבוּל indica localização sobre ou junto a um limite. “Arnom” é mantido como referência geográfica, provavelmente ao rio ou vale que marcava a fronteira.
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: na extremidade do território
  rationale: קצה significa “extremidade” ou “limite”, e גבול pode denotar tanto a linha de fronteira quanto o território delimitado. “Extremidade do território” evita a expressão pouco natural “extremidade da fronteira” e preserva o sentido geográfico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Balaque”, “Balaão”, “Moabe” e “Arnom” seguem formas bíblicas amplamente reconhecíveis em português. A repetição hebraica de גבול foi parcialmente variada entre “fronteira” e “território” para manter clareza idiomática, com a alternativa literal registrada em nota.
