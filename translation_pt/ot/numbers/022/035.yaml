  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: pt
  text: 'Então o anjo de Yahweh[a] disse a Balaão: “Vá com os homens; porém, você falará somente a palavra[b] que eu lhe disser.” E Balaão foi com os oficiais[c] de Balaque.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mensageiro de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a palavra”; também pode significar “a mensagem” ou “o assunto”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “príncipes” ou “chefes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”; neste contexto narrativo, trata-se do ser sobrenatural que confronta Balaão. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: Vá com os homens
  rationale: Preserva o imperativo e a referência masculina plural específica aos integrantes da comitiva.
- source_word: וְאֶפֶס
  choice: porém ... somente
  rationale: Expressa a forte restrição que acompanha a permissão concedida, de maneira natural em português.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: No contexto de fala e em ligação com as formas do verbo דבר, “palavra” é a opção mais direta, embora “mensagem” ou “assunto” também sejam lexicalmente possíveis.
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: que eu lhe disser
  rationale: O valor futuro/relativo da forma verbal é expresso naturalmente em português por “disser”; “lhe” representa o destinatário singular.
- source_word: אֹתוֹ תְדַבֵּר
  choice: você falará somente
  rationale: A colocação enfática do objeto restringe Balaão a comunicar exclusivamente a palavra recebida. O futuro mantém o tom diretivo sem acrescentar explicitamente um verbo modal.
- source_word: שָׂרֵי בָלָק
  choice: os oficiais de Balaque
  rationale: שָׂרִים pode designar príncipes, chefes ou oficiais; “oficiais” se ajusta à comitiva diplomática sem sugerir necessariamente filhos do rei.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico contém o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Identidade lexical de מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: O contexto apresenta uma figura sobrenatural; “anjo” comunica isso naturalmente, enquanto a nota preserva a amplitude lexical de מַלְאַךְ.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Balaão” e “Balaque” seguem as formas portuguesas consagradas. A formulação conserva a restrição enfática do hebraico sem reproduzir uma ordem de palavras artificial.
