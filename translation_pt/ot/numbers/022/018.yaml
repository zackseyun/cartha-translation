base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: pt
  text: 'Balaão respondeu aos servos de Balaque: “Mesmo que Balaque me desse sua casa cheia de prata e ouro, eu não poderia ir além do que Yahweh, meu Deus, disse,[a] para fazer qualquer coisa, pequena ou grande.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ir além da boca de Yahweh, meu Deus”, expressão que significa ultrapassar ou violar o que ele disse. Outra tradução possível: “transgredir a ordem de Yahweh, meu Deus”.'
    reason: Explica o idioma hebraico e registra uma tradução alternativa legítima.
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Balaão respondeu
  rationale: A combinação narrativa hebraica pode ser vertida naturalmente por “respondeu”, sem reproduzir de modo redundante “respondeu e disse”.
- source_word: עַבְדֵי בָלָק
  choice: servos de Balaque
  rationale: “Servos” preserva o termo social amplo e se ajusta aos emissários de Balaque sem especificar indevidamente escravidão ou cargo oficial.
- source_word: אִם יִתֶּן לִי בָלָק
  choice: Mesmo que Balaque me desse
  rationale: O condicional tem força hipotética e concessiva no contexto; esta formulação é natural em português e mantém essa nuance.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: sua casa cheia de prata e ouro
  rationale: Preserva a imagem concreta de uma casa repleta de enorme riqueza.
- source_word: לֹא אוּכַל
  choice: eu não poderia
  rationale: Mantém a ideia expressa de incapacidade, em harmonia com a hipótese anterior, em vez de reduzi-la a mera recusa.
- source_word: לַעֲבֹר אֶת פִּי
  choice: ir além do que ... disse
  rationale: Comunica com clareza o idioma literal “passar além da boca de”, conservando a metáfora de ultrapassar a palavra pronunciada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera diretamente o nome divino representado pelo Tetragrama.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Reproduz diretamente a construção possessiva usada por Balaão, sem acrescentar implicações teológicas.
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: para fazer coisa pequena ou grande
  rationale: Preserva o merismo hebraico, isto é, qualquer coisa, seja de menor ou maior importância.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Natureza da declaração de Balaão
  choice: incapacidade de ultrapassar o que Yahweh disse
  alternative: recusa em desobedecer a uma ordem de Yahweh
  rationale: O hebraico emprega o verbo “poder/ser capaz” e o idioma “passar além da boca”; a tradução mantém a incapacidade declarada e não a transforma apenas em disposição moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi ajustada para naturalidade, e o idioma hebraico foi mantido no texto em forma clara, com a imagem literal explicada em nota.
