base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: pt
  text: '“Veja: o povo que saiu do Egito cobriu a face da terra[a]. Agora, venha e amaldiçoe-o para mim. Talvez eu consiga lutar contra ele e expulsá-lo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “o olho da terra”, expressão que indica a superfície visível, ou a face, da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Introduz a citação com força de chamada de atenção. O plural se ajusta aos mensageiros que reproduzem as palavras de Balaque, e é corrente em português.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o substantivo coletivo singular que se refere a Israel e permite preservar a concordância do hebraico ao longo do versículo.
- source_word: הַיֹּצֵא מִמִּצְרַיִם
  choice: que saiu do Egito
  rationale: A construção participial identifica o povo pelo êxodo; uma oração relativa é a forma mais clara e natural em português.
- source_word: וַיְכַס
  choice: cobriu
  rationale: Preserva o aspecto narrativo e a concordância singular com o coletivo 'povo', indicando a extensão já alcançada por ele.
- source_word: עֵין הָאָרֶץ
  choice: a face da terra
  rationale: Traduz o sentido idiomático da expressão hebraica, literalmente 'o olho da terra', conservando uma metáfora compreensível em português.
- source_word: עַתָּה לְכָה
  choice: Agora venha
  rationale: Expressa a transição urgente para o pedido e verte naturalmente a forma exortativa hebraica.
- source_word: קָבָה לִּי אֹתוֹ
  choice: amaldiçoe-o para mim
  rationale: Mantém a força específica do verbo 'amaldiçoar', o dativo de vantagem e o referente coletivo singular do texto hebraico.
- source_word: אוּלַי אוּכַל
  choice: Talvez eu consiga
  rationale: Preserva a incerteza e a esperança de Balaque em formulação atual e natural.
- source_word: לְהִלָּחֶם בּוֹ
  choice: lutar contra ele
  rationale: Representa o sentido de entrar em combate contra o povo e mantém o referente coletivo singular.
- source_word: וְגֵרַשְׁתִּיו
  choice: e expulsá-lo
  rationale: Traduz de modo direto o objetivo de remover o povo da terra, preservando a referência pronominal singular.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservou-se 'povo' como coletivo singular, inclusive nos pronomes, em correspondência mais próxima com o hebraico. A forma 'Vejam' reflete que as palavras são transmitidas aos anciãos mensageiros no contexto imediato.
