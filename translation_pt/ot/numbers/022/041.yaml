  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: pt
  text: Na manhã seguinte, Balaque levou consigo Balaão e o fez subir a Bamote-Baal[a]. De lá, Balaão viu a extremidade do povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os altos de Baal», se a expressão for entendida como descrição, e não como o nome do lugar Bamote-Baal.
    reason: lexical_alternative
  - marker: b
    text: Isto é, dali só era visível a parte mais externa de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Na manhã seguinte
  rationale: A fórmula narrativa introduz o acontecimento subsequente; esta expressão comunica naturalmente em português a progressão temporal sem reproduzir de modo rígido o hebraísmo.
- source_word: וַיִּקַּח
  choice: levou consigo
  rationale: לקח significa normalmente tomar ou levar; no contexto, Balaque conduz Balaão a outro lugar, e «levou consigo» torna clara essa relação sem acrescentar uma ideia de coerção.
- source_word: וַיַּעֲלֵהוּ
  choice: o fez subir
  rationale: O hifil de עלה tem sentido causativo, «fazer subir» ou «levar para cima»; a escolha preserva tanto a causatividade como a subida ao lugar elevado.
- source_word: בָּמוֹת בָּעַל
  choice: Bamote-Baal
  rationale: A expressão funciona aqui provavelmente como topônimo composto. A transliteração portuguesa preserva o nome do lugar, enquanto a nota registra a leitura descritiva possível.
- source_word: וַיַּרְא
  choice: Balaão viu
  rationale: ראה é o verbo comum «ver». Embora o hebraico apenas flexione o verbo na terceira pessoa masculina, o contexto favorece Balaão como sujeito; explicitar o nome evita ambiguidade pronominal pouco natural em português.
- source_word: מִשָּׁם
  choice: De lá
  rationale: Equivalente locativo direto que indica o ponto de observação.
- source_word: קְצֵה הָעָם
  choice: a extremidade do povo
  rationale: קצה designa a ponta, borda ou parte extrema. «Extremidade do povo» mantém a formulação do hebraico sem substituir «povo» por «acampamento» e indica que apenas a parte mais externa estava à vista.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O topônimo foi adaptado à transliteração portuguesa, e a repetição de «Balaão» esclarece o sujeito sem resolver indevidamente qualquer questão teológica.
