  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: pt
  text: 'Então Balaão disse a Balaque: “Eis que agora vim até você. Será que sou mesmo capaz de dizer qualquer coisa? Só direi a palavra que Deus puser em minha boca.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Eis que
  rationale: Preserva a força apresentativa e enfática da expressão hebraica em registro bíblico digno, sem recorrer a uma formulação excessivamente arcaica.
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: agora vim até você
  rationale: Mantém a referência explícita à chegada de Balaão e a imediaticidade marcada por עַתָּה, em ordem natural no português.
- source_word: הֲיָכוֹל אוּכַל
  choice: Será que sou mesmo capaz
  rationale: A construção enfática com infinitivo absoluto e verbo finito intensifica a ideia de capacidade; “mesmo” comunica essa ênfase com naturalidade.
- source_word: דַּבֵּר מְאוּמָה
  choice: de dizer alguma coisa
  rationale: Expressa de modo corrente o sentido abrangente de מְאוּמָה, isto é, qualquer coisa que seja, dentro da pergunta retórica.
- source_word: הַדָּבָר
  choice: a palavra
  rationale: No contexto de fala profética, “a palavra” preserva o singular concreto e o sentido de mensagem verbal dada por Deus.
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: que Deus puser em minha boca
  rationale: Conserva a metáfora hebraica da fala concedida por Deus e soa natural em português.
- source_word: אֹתוֹ אֲדַבֵּר
  choice: Direi a palavra
  rationale: A retomada explícita de “a palavra” preserva a referência do pronome hebraico e, no contexto da incapacidade declarada de falar por conta própria, comunica a limitação sem acrescentar “somente”, que não aparece lexicalmente no texto.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma seja morfologicamente plural, o verbo singular e o contexto indicam o Deus de Israel como referente singular.
theological_decisions:
- issue: Controle divino sobre a fala de Balaão
  choice: Balaão nega ser capaz de dizer algo por iniciativa própria e afirma que dirá a palavra que Deus lhe puser na boca.
  alternative: Balaão teria liberdade para dizer qualquer coisa, mas decidiria voluntariamente limitar sua fala.
  rationale: A pergunta retórica enfática seguida da declaração sobre a palavra posta por Deus em sua boca apresenta uma fala profética constrangida. A tradução conserva essa tensão sem definir além do texto o mecanismo da ação divina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” retém a solenidade enfática do hebraico; “você” evita regionalismo e mantém clareza contemporânea. Não foram necessárias notas de rodapé.
