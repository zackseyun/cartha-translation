source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: pt
  text: Agora, por favor, venha e amaldiçoe este povo para mim, pois ele é mais forte do que eu. Talvez eu consiga golpeá-lo[a] e expulsá-lo da terra, pois sei que aquele a quem você abençoa é abençoado, e aquele a quem você amaldiçoa é amaldiçoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «feri-lo». No contexto militar, o verbo também pode ser entendido como «derrotá-lo».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição imediata para o pedido de Balaque; em português, “Agora” expressa a conexão discursiva sem exigir um “e” pouco natural.
- source_word: לְכָה נָּא
  choice: por favor, venha
  rationale: Preserva o imperativo acompanhado da partícula de súplica, com urgência cortês em português corrente.
- source_word: אָרָה לִּי אֶת הָעָם הַזֶּה
  choice: amaldiçoe este povo para mim
  rationale: “Amaldiçoar” traduz diretamente a invocação de dano; “para mim” conserva o interesse expresso por לִּי, e “este povo” mantém o coletivo singular.
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: pois ele é mais forte do que eu
  rationale: O adjetivo exprime força ou poder superior; o pronome singular retoma o coletivo “povo”, preservando a concordância hebraica de modo natural em português.
- source_word: אוּלַי אוּכַל נַכֶּה בּוֹ
  choice: Talvez eu consiga derrotá-lo
  rationale: “Talvez eu consiga” conserva incerteza e capacidade. No contexto militar, “derrotar” comunica naturalmente o efeito pretendido de נכה, embora o verbo tenha o sentido básico de “ferir/golpear”; a alternativa literal é registrada em nota.
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: e expulsá-lo desta terra
  rationale: “Expulsar” transmite o ato de fazer sair à força; o singular retoma “povo”. “Desta terra” explicita naturalmente o território do qual Balaque deseja removê-lo.
- source_word: כִּי יָדַעְתִּי
  choice: pois sei
  rationale: Introduz a razão de Balaque recorrer a Balaão; o presente português expressa adequadamente o estado resultante do perfeito hebraico.
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: aquele a quem você abençoa é abençoado
  rationale: Conserva a construção relativa genérica e o paralelismo, bem como o resultado passivo expresso pelo particípio.
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: e aquele a quem você amaldiçoa é amaldiçoado
  rationale: Mantém o paralelismo formal com a bênção e preserva a voz passiva e o sentido resultativo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância no singular para preservar “povo” como coletivo. Evitou-se “tu” para manter legibilidade brasileira ampla; “você” não reduz a solenidade neste discurso direto. O paralelismo final foi mantido de forma explícita.
