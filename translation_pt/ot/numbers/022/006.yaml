  to: Agora, por favor, venha e amaldiçoe este povo para mim, pois ele é mais forte do que eu. Talvez eu consiga golpeá-lo[a] e expulsá-lo da terra, pois sei que aquele a quem você abençoa é abençoado, e aquele a quem você amaldiçoa é amaldiçoado.
