base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: pt
  text: Então Balaão foi com Balaque, e eles chegaram a Quiriate-Huzote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quiriate-Huzote provavelmente significa “cidade de ruas” ou “cidade de lugares abertos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: O qal wayyiqtol de הלך dá sequência à narrativa com o sentido simples de movimento; “foi” é natural e não especifica o modo da viagem.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: עִם
  choice: com
  rationale: A preposição indica acompanhamento de modo direto; “com” é a equivalência idiomática mais simples.
- source_word: בָּלָק
  choice: Balaque
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: וַיָּבֹאוּ
  choice: eles chegaram
  rationale: O plural wayyiqtol de בוא apresenta a ação narrativa seguinte. “Chegaram” expressa naturalmente o movimento até o lugar sem sugerir necessariamente entrada nele.
- source_word: קִרְיַת חֻצוֹת
  choice: Quiriate-Huzote
  rationale: Como a expressão funciona como nome próprio de lugar, ela é transliterada no texto; seu provável sentido lexical é apresentado em nota.
