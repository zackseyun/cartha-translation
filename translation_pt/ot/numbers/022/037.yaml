base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: pt
  text: 'Então Balaque disse a Balaão: “Não mandei, de fato, chamar você?[a] Por que você não veio até mim?[b] Será que eu realmente não posso honrar você?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico usa um infinitivo absoluto junto ao verbo conjugado para dar ênfase: “Não mandei, de fato, chamar você?”. No contexto, alguns entendem que a ênfase pode sugerir envios repetidos ou urgentes.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Por que você não foi até mim?”.'
    reason: lexical_alternative
  - marker: c
    text: Aqui, “honrar você” pode incluir conceder recompensa ou posição elevada, e não apenas demonstrar respeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa sequência de modo natural em português.
- source_word: הֲלֹא
  choice: Por acaso eu não
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa e preserva o tom de censura de Balaque.
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: mandei ... com toda a insistência
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. A formulação comunica a ênfase sem afirmar necessariamente que houve vários envios.
- source_word: לִקְרֹא לָךְ
  choice: chamar você
  rationale: No contexto, קרא significa chamar ou convocar alguém; esta opção é clara e corrente em português.
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: Por que você não veio até mim?
  rationale: Embora הלך signifique literalmente “ir”, da perspectiva de Balaque a expressão idiomática em português é “vir até mim”.
- source_word: הַאֻמְנָם
  choice: realmente
  rationale: A partícula marca uma interrogação enfática e incrédula.
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: Será que eu realmente não posso honrar você?
  rationale: Preserva a ideia de capacidade em יכל e a amplitude de כבד, que pode abranger honra, posição e recompensa.
