  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: pt
  text: 'Moabe disse aos anciãos de Midiã: “Agora esta assembleia lamberá tudo o que está ao nosso redor[a], como o boi lambe a vegetação verde do campo[b]”. Naquele tempo, Balaque, filho de Zipor, era rei de Moabe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esta multidão devorará tudo ao nosso redor”. O verbo hebraico significa literalmente “lamber”; o texto principal conserva a imagem da comparação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a erva do campo”. O termo hebraico pode referir-se de modo mais amplo à vegetação verde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo e território, aqui personificado como sujeito singular.
- source_word: זִקְנֵי מִדְיָן
  choice: os anciãos de Midiã
  rationale: Reproduz com clareza a construção hebraica e emprega as formas consagradas dos nomes em português.
- source_word: עַתָּה
  choice: Agora
  rationale: Expressa a urgência imediata e o avanço do discurso.
- source_word: יְלַחֲכוּ
  choice: lamberá
  rationale: Preserva o sentido concreto de לחך e a imagem desenvolvida logo depois na comparação com o boi.
- source_word: הַקָּהָל
  choice: esta assembleia
  rationale: Mantém o sentido coletivo de um grupo reunido sem reduzi-lo simplesmente a uma multidão desorganizada; o demonstrativo explicita a referência contextual ao povo próximo.
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: tudo o que está ao nosso redor
  rationale: Equivalente idiomático de 'tudo ao redor de nós', abrangendo o que se encontra nas imediações.
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: como o boi lambe
  rationale: Conserva a comparação agrícola e repete o verbo 'lamber', como faz o hebraico.
- source_word: יֶרֶק הַשָּׂדֶה
  choice: a vegetação verde do campo
  rationale: יֶרֶק designa vegetação verde ou verdura em sentido amplo, não apenas grama; a expressão mantém essa amplitude sem perder naturalidade.
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: Naquele tempo, Balaque, filho de Zipor
  rationale: A construção introduz informação de fundo sobre o rei; a formulação portuguesa integra naturalmente o marcador temporal do fim da oração.
- source_word: מֶלֶךְ לְמוֹאָב
  choice: era rei de Moabe
  rationale: Tradução direta e idiomática do predicado nominal hebraico.
- source_word: בָּעֵת הַהִוא
  choice: Naquele tempo
  rationale: Expressão temporal natural em português que situa a informação narrativa de fundo.
theological_decisions: []
