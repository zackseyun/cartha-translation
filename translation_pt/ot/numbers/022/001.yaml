base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: pt
  text: Então os filhos de Israel partiram e acamparam nas planícies de Moabe[a], do outro lado do Jordão, na altura de Jericó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Em hebraico, literalmente, “os filhos de Israel”, designação habitual do povo como um todo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, nas planícies de Moabe, a leste do Jordão, diante de Jericó.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: No contexto das jornadas pelo deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e comunica o deslocamento sem tom arcaico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica literalmente e mantém sua função como designação coletiva do povo.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: Equivalente corrente e direto de חנה, indicando que estabeleceram acampamento.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: עַרְבוֹת designa a região plana ou de estepe; “planícies de Moabe” é claro, geograficamente adequado e consagrado em português.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: A expressão indica o lado além do Jordão segundo uma perspectiva geográfica relativa, sem que o português precise fixar explicitamente o ponto de vista.
- source_word: יְרֵחוֹ
  choice: na altura de Jericó
  rationale: Jericó funciona como ponto de referência do outro lado do rio. “Na altura de Jericó” expressa com naturalidade que o acampamento ficava diante ou defronte da cidade, sem sugerir que estivesse dentro dela.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a designação hebraica “filhos de Israel”; “na altura de Jericó” evita a impressão geograficamente incorreta de que o povo acampou na própria cidade.
