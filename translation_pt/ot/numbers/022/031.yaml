revisions:
- from: Então Yahweh desvendou os olhos de Balaão[a], e ele viu o anjo de Yahweh[b] parado no caminho, com a espada desembainhada na mão. Então Balaão se curvou e se prostrou com o rosto em terra.[c]
  to: Então Yahweh abriu os olhos de Balaão[a], e ele viu o anjo de Yahweh[b] de pé no caminho, com a espada desembainhada na mão. Então Balaão se curvou e se prostrou com o rosto em terra.[c]
  rationale: A revisão melhora a idiomaticidade e a precisão visual sem alterar o sentido. “Abriu os olhos” é a expressão portuguesa corrente para o idiomático hebraico, e a nota conserva a imagem lexical de descobrir/desvendar. “De pé” representa de modo mais direto a postura do anjo.
