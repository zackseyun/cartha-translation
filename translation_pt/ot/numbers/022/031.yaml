    rationale: Embora “desvendar” possa refletir a noção literal de retirar uma cobertura, em português moderno normalmente se diz que alguém “abre os olhos” de outra pessoa. A nota pode registrar “descobriu/desvendou” como valor mais literal.
  - severity: low
    issue: “Parado no caminho” é menos preciso do que “de pé no caminho”.
    rationale: O particípio נִצָּב descreve o anjo em posição de pé/estacionado. “Parado” é possível, mas pode focalizar a interrupção de movimento, não a postura visualmente enfatizada no texto.
