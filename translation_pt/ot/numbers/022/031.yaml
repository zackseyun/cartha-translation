  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: pt
  text: Então Yahweh abriu os olhos de Balaão[a], e ele viu o anjo de Yahweh[b] de pé no caminho, com a espada desembainhada na mão. Então Balaão se curvou e se prostrou com o rosto em terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “descobriu” ou “desvendou os olhos de Balaão”. O verbo hebraico significa literalmente “descobriu” ou “desvendou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o mensageiro de Yahweh”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “se curvou e caiu com o rosto em terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: desvendou
  rationale: O verbo גלה expressa literalmente a ideia de descobrir ou retirar algo que encobre. “Desvendou os olhos” preserva essa imagem e, em português, comunica que Yahweh removeu o impedimento à percepção de Balaão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar “mensageiro”, mas “anjo” é natural e adequado ao ser sobrenatural visto por Balaão neste contexto.
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: parado no caminho
  rationale: O particípio indica uma posição fixa, e בַּדֶּרֶךְ designa o caminho onde o anjo bloqueava a passagem.
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: com a espada desembainhada na mão
  rationale: שְׁלֻפָה descreve a espada tirada da bainha; a construção portuguesa apresenta a expressão como circunstância concomitante de modo natural.
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: se curvou e se prostrou com o rosto em terra
  rationale: Mantém os dois verbos hebraicos e explicita a postura corporal indicada pelo idioma לְאַפָּיו, sem transformar necessariamente o gesto em uma declaração explícita de adoração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto emprega diretamente o nome divino; a transliteração preserva sua condição de nome próprio sem substituí-lo por um título.
- issue: Sentido de וַיִּשְׁתַּחוּ
  choice: se prostrou
  alternative: adorou
  rationale: O verbo pode denotar adoração, mas o contexto descreve explicitamente a reação corporal de Balaão. “Se prostrou” conserva a ação e não resolve além do texto sua possível dimensão cultual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Desvendou os olhos” retém a imagem incomum do hebraico, esclarecida em nota; “com o rosto em terra” é uma formulação bíblica ainda corrente e compreensível.
