id: NUM.22.19
reference: Numbers 22:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: pt
  text: Agora, por favor, fiquem também vocês aqui esta noite, para que eu saiba o que mais Yahweh me dirá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que Yahweh ainda falará comigo”.'
    reason: Alternativa mais literal para מַה יֹּסֵף יְהוָה דַּבֵּר עִמִּי, preservando tanto a ideia de acréscimo quanto a construção “falar comigo”.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Funciona como marcador discursivo que introduz a instrução seguinte de Balaão; a conjunção inicial não precisa ser reproduzida separadamente em português.
- source_word: שְׁבוּ נָא
  choice: por favor, fiquem
  rationale: Neste contexto, ישׁב significa permanecer ou ficar, não simplesmente sentar-se; נָא acrescenta cortesia ou apelo.
- source_word: בָזֶה
  choice: aqui
  rationale: O demonstrativo com preposição tem sentido locativo e é expresso naturalmente por “aqui”.
- source_word: גַּם אַתֶּם
  choice: também vocês
  rationale: 'Mantém a ênfase aditiva: esta delegação deve ficar, assim como a anterior.'
- source_word: הַלָּיְלָה
  choice: esta noite
  rationale: O substantivo funciona como expressão temporal referente à noite que se aproxima; “esta noite” é claro e idiomático em português internacional.
- source_word: וְאֵדְעָה
  choice: para que eu saiba
  rationale: 'O coortativo ligado à instrução anterior exprime propósito: eles devem ficar para que Balaão venha a saber a resposta divina.'
- source_word: מַה יֹּסֵף
  choice: o que mais
  rationale: 'A construção com יסף comunica algo adicional: o que Yahweh ainda acrescentará à mensagem já dada.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: דַּבֵּר עִמִּי
  choice: me dirá
  rationale: Expressa de modo natural o conteúdo da comunicação esperada; a forma hebraica também pode ser vertida mais literalmente como “falará comigo”, possibilidade registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e segue uma transliteração amplamente reconhecida, sem substituí-lo por “Senhor”.
- issue: Expectativa de Balaão por uma comunicação adicional
  choice: “o que mais Yahweh me dirá”
  alternative: “o que Yahweh ainda falará comigo”
  rationale: A tradução preserva a expectativa expressa por Balaão sem avaliar aqui se ela é correta ou legítima; a forma alternativa mantém mais de perto a construção verbal hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Fiquem” evita o literalismo inadequado de “sentem-se”; “esta noite” é preferível ao brasileirismo potencialmente ambíguo “hoje à noite”. A colocação “também vocês” conserva a ênfase do hebraico sem soar excessivamente rígida.
