base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: pt
  text: 'Então Balaão disse a Deus: “Balaque, filho de Zipor, rei de Moabe, enviou-me:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então” expressa essa sequência com naturalidade em português.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אֶל הָאֱלֹהִים
  choice: a Deus
  rationale: O artigo e o contexto indicam o Deus que falou com Balaão no versículo anterior; em português, a expressão idiomática é “a Deus”.
- source_word: בָּלָק בֶּן צִפֹּר
  choice: Balaque, filho de Zipor
  rationale: A relação de filiação é vertida de modo claro e natural, com as formas tradicionais dos nomes em português.
- source_word: מֶלֶךְ מוֹאָב
  choice: rei de Moabe
  rationale: A cadeia construta identifica a função de Balaque e funciona naturalmente como aposto em português.
- source_word: שָׁלַח אֵלַי
  choice: enviou uma mensagem para mim
  rationale: O hebraico diz literalmente “enviou a mim”, deixando implícito aquilo que foi enviado. Como a fala de Balaque vem a seguir, “uma mensagem” torna a frase natural em português sem adotar a interpretação mais específica de que Balaque mandou chamar Balaão.
theological_decisions:
- issue: Referência de הָאֱלֹהִים
  choice: o único Deus a quem Balaão se dirige
  alternative: um deus ou deuses em sentido genérico
  rationale: O contexto narrativo imediato apresenta Balaão respondendo ao encontro divino do versículo anterior. “Deus” preserva essa identificação contextual sem acrescentar elaboração doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O sinal de dois-pontos preserva a continuidade da fala no versículo seguinte.
