  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: pt
  text: Quando a jumenta viu o anjo de Yahweh[a], deitou-se debaixo de Balaão. Então Balaão ficou irado e bateu na jumenta[b] com a vara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mensageiro de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico designa especificamente uma jumenta, isto é, a fêmea do jumento.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָאָתוֹן
  choice: a jumenta
  rationale: O substantivo hebraico אָתוֹן designa especificamente a fêmea do jumento. “Jumenta” é uma forma natural e precisa em português.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar “mensageiro” ou “anjo”; neste contexto, trata-se claramente de um mensageiro sobrenatural, por isso “anjo” é a opção mais adequada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַתִּרְבַּץ
  choice: deitou-se
  rationale: רבץ significa deitar-se ou agachar-se. Aqui, “deitou-se” descreve com naturalidade a ação do animal sob seu cavaleiro sem acrescentar a ideia de queda.
- source_word: תַּחַת בִּלְעָם
  choice: debaixo de Balaão
  rationale: תַּחַת significa literalmente “debaixo de” ou “sob”. A expressão indica que a jumenta se deitou enquanto Balaão estava montado nela.
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: Balaão ficou irado
  rationale: A expressão idiomática hebraica diz literalmente que a ira de Balaão “se acendeu”. “Ficou irado” comunica o sentido claramente em português atual.
- source_word: וַיַּךְ
  choice: bateu
  rationale: נכה é um verbo amplo para golpear. “Bateu” é direto e natural, sem sugerir mais golpes do que o texto especifica nesta oração.
- source_word: בַּמַּקֵּל
  choice: com a vara
  rationale: מַקֵּל pode designar uma vara, um bastão ou um cajado. “Vara” é natural no contexto e mantém o artigo definido do hebraico sem acrescentar um possessivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo pelo título “SENHOR”.
- issue: Sentido de מַלְאָךְ em מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  alternative: mensageiro de Yahweh
  rationale: Embora מַלְאָךְ possa indicar qualquer mensageiro, o contexto narrativo apresenta um ser sobrenatural. A nota conserva a alternativa lexical sem diluir esse dado contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Jumenta” preserva naturalmente o sexo do animal; “ficou irado” traduz a expressão idiomática de ira ardente sem literalismo artificial. A sequência narrativa e a ambiguidade lexical de מַלְאָךְ são mantidas.
