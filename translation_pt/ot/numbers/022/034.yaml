  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: pt
  text: 'Então Balaão disse ao anjo de Yahweh[a]: “Pequei, pois não sabia que estavas postado no caminho para me enfrentar. Agora, se isto é mau aos teus olhos[b], voltarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mensageiro de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “se isto é mau aos teus olhos”; ou: “se isto te parece errado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anjo de Yahweh
  rationale: מַלְאַךְ pode significar “mensageiro” ou “anjo”; neste contexto, trata-se de um ser sobrenatural que se opõe visivelmente a Balaão, por isso “anjo” é a opção mais natural. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: חָטָאתִי
  choice: Pequei
  rationale: O perfeito hebraico expressa a confissão direta de culpa de Balaão; “Pequei” é natural e preciso em português.
- source_word: כִּי לֹא יָדַעְתִּי
  choice: pois não sabia
  rationale: כִּי introduz a explicação da confissão, e “pois” mantém de modo conciso essa relação causal.
- source_word: נִצָּב לִקְרָאתִי
  choice: estavas no caminho para me enfrentar
  rationale: נִצָּב indica estar postado ou tomar posição, enquanto לִקְרָאתִי pode significar vir ao encontro de alguém. O contexto da espada desembainhada dá à expressão força adversativa, preservada por “para me enfrentar”.
- source_word: בַּדָּרֶךְ
  choice: no caminho
  rationale: Tradução locativa direta e natural para o cenário da viagem.
- source_word: וְעַתָּה
  choice: Agora
  rationale: Marca a transição da confissão para a disposição de Balaão de retornar; a conjunção hebraica não precisa ser representada separadamente em português.
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: se isto é mau aos teus olhos
  rationale: Preserva a expressão idiomática hebraica e seu peso moral, sem reduzi-la a simples desagrado.
- source_word: אָשׁוּבָה לִּי
  choice: voltarei
  rationale: O coortativo comunica intenção ou disposição de retornar. “Voltarei” expressa isso naturalmente; o dativo ético לִּי não exige tradução independente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Força de לִקְרָאתִי no contexto
  choice: para me enfrentar
  alternative: para me encontrar
  rationale: Embora a expressão possa indicar simplesmente ir ao encontro de alguém, a figura postada com espada desembainhada estabelece uma oposição clara. “Enfrentar” transmite essa força contextual sem identificar além do texto a natureza exata da ameaça.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a fala direta em registro natural; usa a segunda pessoa do singular para refletir o discurso dirigido ao anjo e conserva a expressão semítica “mau aos teus olhos” no texto principal, esclarecendo-a em nota.
