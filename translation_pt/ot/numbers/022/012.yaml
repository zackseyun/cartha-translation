  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: pt
  text: 'E Deus disse a Balaão: “Não vá com eles. Não amaldiçoe o povo, pois ele é abençoado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “E ... disse” preserva essa ligação de modo natural e digno em português.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Neste contexto, אֱלֹהִים designa o Deus verdadeiro que fala diretamente a Balaão.
- source_word: לֹא תֵלֵךְ
  choice: Não vá
  rationale: O imperfeito com לֹא tem força proibitiva. O presente do subjuntivo em uma ordem negativa é a forma corrente e clara em português.
- source_word: עִמָּהֶם
  choice: com eles
  rationale: Tradução direta da preposição com sufixo pronominal, referente aos mensageiros de Balaque.
- source_word: לֹא תָאֹר
  choice: Não amaldiçoe
  rationale: אָרַר significa “amaldiçoar”; a construção com לֹא expressa aqui uma proibição direta.
- source_word: אֶת הָעָם
  choice: o povo
  rationale: הָעָם refere-se a Israel como povo coletivo; “o povo” reproduz naturalmente o sentido e o número gramatical.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão das proibições. “Pois” é claro, corrente e adequado ao registro bíblico moderno.
- source_word: בָרוּךְ הוּא
  choice: ele é abençoado
  rationale: O adjetivo e o pronome estão no masculino singular e retomam הָעָם, também masculino singular e coletivo. Em português, “o povo” é naturalmente retomado por “ele”, preservando sem estranheza a concordância hebraica.
theological_decisions:
- issue: Referente e número na oração בָרוּךְ הוּא
  choice: “ele é abençoado”, referindo-se coletivamente ao povo de Israel
  alternative: “eles são abençoados”
  rationale: O hebraico emprega formas masculinas singulares com o substantivo coletivo “povo”. Como o português também permite retomar “o povo” pelo pronome singular “ele”, mantém-se a forma coletiva singular sem individualizar o referente nem converter desnecessariamente a frase para o plural.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. As proibições são expressas pelo subjuntivo negativo corrente (“Não vá”, “Não amaldiçoe”), evitando tanto arcaísmo quanto paráfrase modal. O singular coletivo hebraico pode ser preservado naturalmente em português por meio de “o povo ... ele”.
