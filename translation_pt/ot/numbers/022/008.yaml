  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: pt
  text: 'Ele lhes disse: “Passem a noite aqui, e eu lhes trarei uma resposta[a], conforme o que Yahweh[b] falar comigo”. Então os líderes[c] de Moabe ficaram com Balaão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu lhes trarei uma mensagem” ou “voltarei com uma resposta para vocês”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz o nome divino YHWH, aqui representado por “Yahweh”; tradicionalmente, também se traduz por “SENHOR”.
    reason: alternative_reading
  - marker: c
    text: 'Ou: “autoridades”, “oficiais” ou “príncipes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: Passem a noite aqui
  rationale: O imperativo plural de לון/לין convida os emissários a permanecer ali durante a noite. A formulação é natural em português e conserva tanto a duração quanto o lugar.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: eu lhes trarei uma resposta
  rationale: A construção com o hifil de שוב e דָּבָר expressa a ideia de trazer de volta uma palavra, mensagem ou resposta. A tradução mantém o sentido de comunicar posteriormente a resposta recebida sem reproduzir de modo artificial o idioma hebraico.
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: conforme o que Yahweh falar comigo
  rationale: כַּאֲשֶׁר indica correspondência, e יְדַבֵּר אֵלָי significa literalmente que Yahweh falará com Balaão. A formulação preserva tanto a relação de conformidade quanto o ato de falar.
- source_word: וַיֵּשְׁבוּ
  choice: ficaram
  rationale: Embora ישב possa significar sentar-se ou habitar, neste contexto indica que os emissários permaneceram com Balaão, em resposta ao convite para passar a noite.
- source_word: שָׂרֵי מוֹאָב
  choice: os líderes de Moabe
  rationale: שָׂרִים pode designar príncipes, autoridades, oficiais ou líderes. “Líderes” comunica de modo amplo e atual a posição elevada dos emissários sem definir indevidamente um título nobiliárquico específico.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e reconhecível em português para o nome hebraico בִּלְעָם.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título, enquanto a nota reconhece a convenção tradicional de representá-lo por “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta é natural sem perder a correspondência com a sintaxe hebraica; “líderes” evita sugerir com certeza um título nobiliárquico que o termo hebraico não exige.
