  text: וַ/יֹּ֥סֶף ע֖וֹד בָּלָ֑ק שְׁלֹ֣חַ שָׂרִ֔ים רַבִּ֥ים וְ/נִכְבָּדִ֖ים מֵ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: pt
  text: Então Balaque tornou a enviar autoridades, mais numerosas e mais distinguidas do que as anteriores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: tornou a enviar
  rationale: A construção idiomática com יָסַף, reforçada por עוֹד e seguida do infinitivo, indica repetição. “Tornou a enviar” expressa isso de modo natural e digno em português.
- source_word: בָּלָק
  choice: Balaque
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: שָׂרִים
  choice: autoridades
  rationale: No contexto diplomático, o termo designa representantes de alta posição. “Autoridades” é atual e evita o sentido hereditário que “príncipes” poderia sugerir.
- source_word: רַבִּים
  choice: mais numerosas
  rationale: A expressão comparativa מֵאֵלֶּה indica que a nova delegação tinha um número maior que a anterior.
- source_word: וְנִכְבָּדִים
  choice: mais importantes
  rationale: O termo derivado de כבד comunica peso social, prestígio ou alta posição. “Mais importantes” transmite claramente esse status no contexto.
- source_word: מֵאֵלֶּה
  choice: do que as anteriores
  rationale: O demonstrativo retoma as autoridades enviadas antes. A explicitação do referente é natural em português e não acrescenta uma identificação estranha ao contexto.
