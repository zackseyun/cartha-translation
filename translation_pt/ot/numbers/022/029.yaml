base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: pt
  text: 'E Balaão disse à jumenta: “Porque você zombou de mim! Quem dera eu tivesse uma espada na mão, pois agora mesmo eu mataria você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém o avanço narrativo típico do wayyiqtol hebraico de modo natural em português.
- source_word: לָאָתוֹן
  choice: à jumenta
  rationale: אָתוֹן designa especificamente uma jumenta; em português, a forma feminina é natural e preserva a precisão lexical do hebraico.
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: você zombou de mim
  rationale: O hitpael de עלל pode indicar tratar alguém de modo abusivo, humilhante ou escarnecedor. A formulação preserva a acusação irada de Balaão sem acrescentar uma nuance excessivamente específica.
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: Quem dera eu tivesse uma espada na mão
  rationale: לוּ introduz um desejo contrário à realidade presente. “Quem dera” expressa esse desejo, enquanto “tivesse uma espada na mão” reproduz naturalmente a imagem hebraica.
- source_word: כִּי עַתָּה
  choice: pois agora mesmo
  rationale: No contexto da ameaça, a expressão indica que Balaão a mataria imediatamente, naquele mesmo instante.
- source_word: הֲרַגְתִּיךְ
  choice: eu mataria você
  rationale: No contexto irrealis introduzido por לוּ, o perfeito expressa a ação que Balaão realizaria se tivesse a espada; o futuro do pretérito é idiomático e mantém o caráter imediato da ameaça.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Jumenta” preserva naturalmente o sexo explícito do animal. A construção “Quem dera eu tivesse...” comunica o desejo irreal sem arcaísmo excessivo; “você” corresponde às formas femininas de segunda pessoa do hebraico em registro corrente.
