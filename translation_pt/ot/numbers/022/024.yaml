base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: pt
  text: Então o anjo de Yahweh se pôs num caminho estreito entre as vinhas[a], com um muro de um lado e outro do outro lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mensageiro de Yahweh». A palavra hebraica pode significar tanto «mensageiro» como «anjo», mas aqui o contexto da narrativa favorece o sentido sobrenatural.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Então ... se pôs
  rationale: O wayyiqtol faz a narrativa avançar; «então» marca naturalmente a sequência, e «se pôs» expressa a tomada de posição.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאָךְ pode significar «mensageiro» ou «anjo»; o contexto narrativo indica um ser sobrenatural. O nome divino יהוה é transliterado como «Yahweh».
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: num caminho estreito entre as vinhas
  rationale: מִשְׁעוֹל designa uma trilha ou passagem estreita; «entre as vinhas» comunica com clareza o espaço delimitado pelos muros dos dois lados.
- source_word: גָּדֵר
  choice: muro
  rationale: O termo designa um muro ou cerca delimitadora. «Muro» é natural no contexto de vinhas, sem acrescentar material não especificado no hebraico.
- source_word: מִזֶּה וְגָדֵר מִזֶּה
  choice: de um lado e ... do outro
  rationale: A formulação reproduz de maneira idiomática a disposição de um muro em cada lado do caminho.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva o nome pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- issue: Sentido de מַלְאָךְ
  choice: anjo
  alternative: mensageiro
  rationale: Embora o substantivo admita ambos os sentidos, neste episódio o contexto sobrenatural favorece «anjo»; a alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Vinhas» preserva o plural hebraico e soa mais natural que «vinhedos» neste contexto; não se especifica que os muros eram de pedra, pois o texto hebraico não informa o material.
