  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: pt
  text: 'Deus veio a Balaão durante a noite e lhe disse: “Se os homens vieram chamar você[a], levante-se e vá com eles. Mas faça somente aquilo que eu lhe disser[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se foi para chamar você que os homens vieram”.'
    reason: Alternativa sintática que torna mais explícita a ideia de finalidade presente na construção hebraica.
  - marker: b
    text: 'Mais literalmente: “Mas somente a palavra que eu falar a você, essa você fará”.'
    reason: Registra a formulação enfática do hebraico e o sentido lexical de דָּבָר como “palavra” ou “assunto”.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: veio
  rationale: O verbo בוא descreve a aproximação de Deus a Balaão. “Veio” mantém o sentido narrativo sem acrescentar a ideia de uma aparição, que o texto não explicita.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: O texto hebraico emprega אֱלֹהִים, não o nome divino YHWH; por isso, preserva-se a designação específica deste versículo.
- source_word: לַיְלָה
  choice: durante a noite
  rationale: Expressão temporal natural em português, que comunica claramente o cenário noturno.
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: Se os homens vieram chamar você
  rationale: Mantém a condição e traduz לקרוא לך de maneira clara e corrente. A nota registra uma formulação alternativa que realça a finalidade da vinda.
- source_word: קוּם לֵךְ
  choice: levante-se e vá
  rationale: Preserva os dois imperativos da sequência hebraica em português natural.
- source_word: אִתָּם
  choice: com eles
  rationale: Tradução direta e inequívoca da preposição com o sufixo pronominal.
- source_word: וְאַךְ
  choice: Mas ... somente
  rationale: 'A combinação expressa contraste e restrição: Balaão pode ir, porém deve agir exclusivamente segundo o que Deus lhe disser.'
- source_word: הַדָּבָר אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: aquilo que eu lhe disser
  rationale: Formulação idiomática que conserva o vínculo entre דָּבָר e o verbo דבר sem produzir uma repetição artificial em português. A nota oferece uma tradução mais formal com “palavra”.
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: faça ... aquilo
  rationale: O imperativo contextual comunica a força obrigatória da forma verbal, enquanto “aquilo” retoma enfaticamente o conteúdo que Deus comunicará.
theological_decisions:
- issue: Designação divina neste versículo
  choice: Deus
  alternative: SENHOR
  rationale: O hebraico deste versículo traz אֱלֹהִים, e não YHWH. A tradução conserva essa distinção em vez de harmonizá-la com designações presentes no contexto próximo.
- issue: Limite imposto à ação de Balaão
  choice: Mas faça somente aquilo que eu lhe disser
  alternative: Mas somente a palavra que eu falar a você, essa você fará
  rationale: A tradução mantém a restrição absoluta expressa por אַךְ sem explicar por que Deus permite a viagem nem resolver a tensão narrativa dos versículos seguintes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita solenidade arcaica; “levante-se e vá” conserva a sequência de ordens. A redação mantém a tensão do relato sem acrescentar explicações teológicas.
