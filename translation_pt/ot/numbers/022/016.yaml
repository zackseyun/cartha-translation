base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: pt
  text: 'Eles chegaram até Balaão e lhe disseram: “Assim diz Balaque, filho de Zipor: Por favor, não deixe de vir até mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל בִּלְעָם
  choice: Eles chegaram até Balaão
  rationale: בוא descreve a chegada dos mensageiros a Balaão; em português, “chegaram até” expressa naturalmente o movimento e o destino.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: e lhe disseram
  rationale: Reproduz de modo claro e idiomático a introdução do discurso com objeto indireto.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula formal de mensageiro e o valor verbal do hebraico.
- source_word: בָּלָק בֶּן צִפּוֹר
  choice: Balaque, filho de Zipor
  rationale: Translitera os nomes em formas portuguesas reconhecíveis e conserva a relação filial.
- source_word: אַל נָא
  choice: Por favor, não
  rationale: אַל marca a proibição, e נָא acrescenta súplica ou cortesia.
- source_word: תִמָּנַע מֵהֲלֹךְ אֵלָי
  choice: se recuse a vir até mim
  rationale: מנע com a construção infinitiva comunica impedir-se, abster-se ou recusar-se a realizar a ação. “Recusar-se a vir” é natural em português e, com “até mim”, transmite o apelo para que Balaão faça a viagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala de Balaque foi colocada entre aspas simples dentro da fala dos mensageiros para tornar transparentes os níveis de citação. Não se acrescentou nota para “vir”, pois o português, como o contexto, admite naturalmente a perspectiva do destino expressa por אֵלָי.
