  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: pt
  text: Então o anjo de Yahweh seguiu adiante[a] e parou num lugar estreito, onde não havia como desviar nem para a direita nem para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “continuou avançando” ou “passou adiante”. A expressão hebraica transmite a ideia de continuar a avançar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: seguiu adiante
  rationale: A construção idiomática com יסף seguido do infinitivo de עבר expressa a continuação do movimento. “Seguiu adiante” comunica isso com naturalidade em português; o waw narrativo é representado por “Então”.
- source_word: מַלְאַךְ יְהוָה
  choice: o anjo de Yahweh
  rationale: מַלְאַךְ pode designar mensageiro ou anjo; neste relato sobrenatural, “anjo” é a opção contextual mais natural. O nome divino é preservado como “Yahweh”.
- source_word: וַיַּעֲמֹד
  choice: parou
  rationale: Embora עמד tenha o sentido básico de ficar de pé ou tomar posição, após o movimento do anjo “parou” expressa naturalmente que ele se colocou naquele ponto.
- source_word: בְּמָקוֹם צָר
  choice: num lugar estreito
  rationale: A expressão descreve um espaço fisicamente apertado ou constrito; “lugar estreito” conserva essa imagem.
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: onde não havia como desviar
  rationale: A oração não afirma que inexistia estrada, mas que não havia espaço ou possibilidade de sair para um dos lados. “Não havia como desviar” transmite o sentido da unidade em português corrente.
- source_word: יָמִין וּשְׂמֹאול
  choice: nem para a direita nem para a esquerda
  rationale: A correlação “nem... nem...” é natural após a negação e preserva as duas direções explicitadas no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva de modo transparente o nome divino, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de ampla compreensão internacional e leitura natural no Brasil. “Num” mantém fluidez narrativa sem reduzir a formalidade. A formulação preserva a progressão espacial e a impossibilidade de desvio para ambos os lados.
