base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: pt
  text: 'E para a tribo dos filhos de Aser, um líder: Aíude, filho de Selomi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: E, para a tribo de
  rationale: Neste contexto de distribuição territorial, מַטֶּה designa uma tribo, não um bastão ou ramo; os prefixos וּ e לְ são naturalmente expressos por “E, para”.
- source_word: בְנֵי אָשֵׁר
  choice: os filhos de Aser
  rationale: Preserva a forma hebraica da designação tribal e continua clara em português como referência ao grupo descendente de Aser.
- source_word: נָשִׂיא
  choice: um líder
  rationale: O termo identifica o representante oficialmente designado da tribo para a divisão da terra. “Líder” é atual e evita as conotações monárquicas que “príncipe” poderia sugerir.
- source_word: אֲחִיהוּד
  choice: Aiúde
  rationale: Forma portuguesa inteligível do nome hebraico, com a consoante gutural não representada e tonicidade indicada pelo acento.
- source_word: בֶּן שְׁלֹמִי
  choice: filho de Selomi
  rationale: Tradução natural da construção patronímica hebraica, mantendo o nome pessoal em transliteração portuguesa.
