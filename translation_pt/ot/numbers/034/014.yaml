  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: pt
  text: Pois a tribo dos filhos de Rúben, segundo suas casas paternas[a], e a tribo dos filhos de Gade, segundo suas casas paternas, e a meia tribo de Manassés tomaram sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As “casas paternas” eram divisões ancestrais ou clânicas dentro de cada tribo. “Filhos de Rúben” e “filhos de Gade” também podem ser traduzidos de modo mais idiomático como “rubenitas” e “gaditas”.
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da declaração anterior, preservando a força causal e discursiva do hebraico.
- source_word: לָקְחוּ
  choice: já tomaram
  rationale: Traduz o perfeito qal como ação concluída no contexto da distribuição territorial; “tomaram” permanece próximo do verbo hebraico, e “já” torna natural em português a relação temporal com o contexto.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto de repartição da terra, designa claramente uma unidade tribal.
- source_word: בְנֵי הָראוּבֵנִי / בְנֵי הַגָּדִי
  choice: filhos de Rúben / filhos de Gade
  rationale: Preserva a formulação genealógica do hebraico, embora “rubenitas / gaditas” seja uma alternativa mais idiomática.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo suas casas paternas
  rationale: Expressa a distribuição conforme as subdivisões ancestrais ou clânicas de cada tribo, mantendo a imagem do original.
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: e a meia tribo de Manassés
  rationale: Formulação convencional e clara para indicar que apenas metade da tribo está em vista.
- source_word: נַחֲלָתָם
  choice: sua herança
  rationale: No contexto, refere-se à porção territorial recebida como herança, preservando suas conotações jurídicas e pactuais.
