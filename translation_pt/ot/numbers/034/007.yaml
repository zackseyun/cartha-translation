base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: pt
  text: 'E esta será a fronteira norte de vocês: desde o Mar Grande, vocês traçarão a fronteira até o monte Hor[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “vocês demarcarão a fronteira até o monte Hor”. Neste contexto geográfico, o verbo pode indicar traçar ou demarcar uma linha de fronteira.'
    reason: lexical_alternative
  - marker: b
    text: O “Mar Grande” é o mar Mediterrâneo.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: E esta será ... de vocês
  rationale: Mantém a conjunção e o valor futuro/prescritivo da descrição territorial; a construção com «de vocês» expressa naturalmente o dativo possessivo.
- source_word: גְּבוּל צָפוֹן
  choice: fronteira norte
  rationale: Expressão corrente e clara em português para o limite territorial situado ao norte.
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: desde o Mar Grande
  rationale: Preserva a designação geográfica hebraica, sem substituir no texto principal pelo nome moderno Mediterrâneo; «desde» indica com clareza o ponto inicial do traçado.
- source_word: תְּתָאוּ לָ/כֶם
  choice: vocês traçarão a fronteira
  rationale: No contexto geográfico, o verbo indica traçar ou demarcar uma linha territorial. A explicitação de «a fronteira» produz português natural, enquanto «vocês» representa o referente plural e o dativo de interesse.
- source_word: הֹר הָ/הָר
  choice: monte Hor
  rationale: Emprega a forma tradicional e inteligível do topônimo, embora a construção hebraica seja literalmente incomum.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase conserva o fluxo sequencial e normativo do hebraico; «Mar Grande» mantém a forma antiga no texto, explicada em nota.
