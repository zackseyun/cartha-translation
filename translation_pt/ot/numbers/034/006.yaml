base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/006.yaml
  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: pt
  text: Quanto à fronteira ocidental, o Grande Mar será para vocês como fronteira[a]; esta será a fronteira ocidental de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fronteira do mar”. Neste contexto de delimitação territorial, o hebraico יָם (yam, “mar”) também pode funcionar como termo direcional para o oeste; daí “fronteira ocidental”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: fronteira
  rationale: O substantivo indica o limite territorial; “fronteira” é natural e claro no contexto da delimitação da terra.
- source_word: יָם
  choice: ocidental
  rationale: Na expressão גְּבוּל יָם, “mar” tem valor direcional e designa o lado voltado para o mar, isto é, o oeste.
- source_word: הַיָּם הַגָּדוֹל
  choice: o mar Grande
  rationale: Preserva a designação geográfica hebraica do Mediterrâneo, com “Grande” como parte do título tradicional.
- source_word: וְהָיָה לָכֶם
  choice: servirá ... para vocês
  rationale: Expressa naturalmente em português a função atribuída ao mar como limite territorial, preservando o sentido prospectivo da construção.
- source_word: וּגְבוּל
  choice: de fronteira
  rationale: Torna explícita a função appositiva do termo após “o mar Grande”, sem acrescentar conteúdo.
- source_word: זֶה יִהְיֶה לָכֶם
  choice: essa será ... de vocês
  rationale: Reproduz de forma idiomática a fórmula conclusiva e sua força possessiva.
- source_word: גְּבוּל יָם
  choice: fronteira ocidental
  rationale: Comunica o valor direcional contextual da expressão, evitando o pouco natural “fronteira do mar”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “fronteira” preserva a estrutura enfática do hebraico; “Quanto à” introduz naturalmente o tópico inicial. Foi mantida a designação “mar Grande” em vez de substituir o nome pelo identificador moderno “Mediterrâneo”.
