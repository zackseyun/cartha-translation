  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: pt
  text: E vocês designarão um líder de cada tribo para distribuir a terra como herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para tomar posse da terra como herança». O verbo hebraico pode referir-se a receber uma herança ou, conforme o contexto, à sua atribuição; aqui, a função dos líderes no processo de distribuição favorece o sentido de distribuir a terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: líder
  rationale: Designa um chefe ou representante reconhecido. Neste contexto administrativo, «líder» é claro e evita a conotação monárquica que «príncipe» poderia sugerir.
- source_word: אֶחָד ... אֶחָד
  choice: um ... de cada
  rationale: A repetição distributiva indica um representante por tribo; esta formulação transmite isso naturalmente em português.
- source_word: מִמַּטֶּה
  choice: de cada tribo
  rationale: מַטֶּה pode significar literalmente «bastão», mas aqui designa uma tribo; o contexto e a construção distributiva justificam «de cada tribo».
- source_word: תִּקְחוּ
  choice: vocês escolherão
  rationale: O imperfeito tem força diretiva e se dirige a um grupo. «Escolherão» expressa, neste contexto, a designação dos representantes de modo natural, embora o sentido lexical básico seja «tomarão».
- source_word: לִנְחֹל
  choice: para tomar posse ... como herança
  rationale: O infinitivo pertence ao campo semântico de herdar, receber ou tomar posse de uma herança. A tradução preserva o sentido direto sem inserir explicitamente a ideia de repartir, que não é inequívoca na forma verbal deste versículo.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se à terra destinada a Israel e corresponde à expressão portuguesa tradicional e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural explícito («vocês»). A formulação mantém a ambiguidade lexical de לִנְחֹל no texto e na nota, sem transformar de modo inequívoco os líderes em distribuidores nem apenas em beneficiários.
