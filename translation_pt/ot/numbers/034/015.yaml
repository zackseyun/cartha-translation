base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: pt
  text: As duas tribos e a meia tribo tomaram sua herança do outro lado do Jordão, na altura de Jericó, para o leste, rumo ao nascente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para o leste, rumo ao nascente”, expressão dupla que enfatiza o lado oriental.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: as duas tribos
  rationale: Embora מַטֶּה possa significar literalmente “vara” ou “cajado”, no contexto da distribuição territorial designa idiomaticamente uma tribo.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: e a meia tribo
  rationale: A expressão se refere à unidade reconhecida de meia tribo, aqui a de Manassés; “meia tribo” é a formulação natural em português.
- source_word: לָקְחוּ
  choice: receberam
  rationale: O qal perfeito indica uma ação concluída. Embora o sentido mais direto seja “tomaram”, no contexto de uma herança territorial concedida, “receberam” comunica com naturalidade a aquisição sem sugerir apropriação indevida.
- source_word: נַחֲלָתָם
  choice: sua herança
  rationale: נַחֲלָה designa, neste contexto, a porção territorial herdada; “herança” conserva a dimensão pactual da terra.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: do outro lado do Jordão
  rationale: A expressão localiza o território além ou do outro lado do Jordão segundo o ponto de referência do discurso; esta forma é clara e idiomática em português.
- source_word: יְרֵחוֹ
  choice: na altura de Jericó
  rationale: O nome do lugar qualifica a região do Jordão diante ou nas proximidades de Jericó; “na altura de Jericó” evita sugerir que a herança ficava dentro da cidade.
- source_word: קֵדְמָה
  choice: para o leste
  rationale: A forma direcional indica orientação para o leste.
- source_word: מִזְרָחָה
  choice: em direção ao nascente
  rationale: A palavra evoca o lugar do nascer do sol. A tradução distinta preserva a expressão hebraica dupla e sua ênfase no lado oriental.
