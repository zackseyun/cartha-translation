  source_fidelity: A redação identifica corretamente as duas tribos e a meia tribo, a herança e a localização oriental além do Jordão, junto a Jericó. Contudo, «receberam» interpreta לָקְחוּ («tomaram») em vez de traduzir diretamente o verbo. A formulação direcional pode também ser mais idiomática sem perder a duplicação enfática do hebraico.
