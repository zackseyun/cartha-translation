  text: וַ/יְצַ֣ו מֹשֶׁ֔ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֹ֣את הָ/אָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָ/הּ֙ בְּ/גוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהוָ֔ה לָ/תֵ֛ת לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: pt
  text: 'Então Moisés ordenou aos filhos de Israel: “Esta é a terra que vocês receberão por herança mediante sorteio, a qual o SENHOR ordenou dar às nove tribos e à meia tribo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a designação coletiva tradicional do hebraico, compreensível em português bíblico moderno.
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: vocês receberão por herança
  rationale: 'Expressa naturalmente o sentido do hitpael de נחל neste contexto: tomar ou receber a terra como posse hereditária.'
- source_word: בְּגוֹרָל
  choice: mediante sorteio
  rationale: Indica o meio pelo qual a terra seria distribuída, sem sugerir acaso desordenado.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino pelo título em versaletes.
- source_word: תִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: as nove tribos e a meia tribo
  rationale: Reproduz de modo direto a contagem tribal do texto hebraico.
theological_decisions:
- issue: Agente e forma verbal na concessão da terra
  choice: a qual o SENHOR ordenou dar
  alternative: a qual o SENHOR ordenou que fosse dada
  rationale: Mantém a construção ativa e a ambiguidade do infinitivo hebraico לָתֵת quanto ao agente humano encarregado da distribuição, sem acrescentar um sujeito não expresso.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “vocês”. A fórmula introdutória foi condensada naturalmente com dois-pontos, sem perda de conteúdo. “Mediante sorteio” evita a possível leitura coloquial de “por sorte”.
