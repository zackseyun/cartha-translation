base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: pt
  text: 'Para os filhos de José[a], para a tribo dos filhos de Manassés: o líder Haniel, filho de Éfode.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de José [...] descendentes de Manassés”. O hebraico emprega repetidamente “filhos de” em linguagem tribal e genealógica.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Para os filhos de José
  rationale: בְּנֵי significa literalmente “filhos de”; neste contexto tribal e genealógico, inclui os descendentes. A formulação preserva a expressão hebraica, enquanto a nota esclarece seu alcance.
- source_word: לְמַטֵּה
  choice: para a tribo de
  rationale: Embora מַטֶּה também possa significar “bastão” ou “vara”, em listas administrativas e contextos de repartição territorial designa uma tribo.
- source_word: בְנֵי מְנַשֶּׁה
  choice: os filhos de Manassés
  rationale: Mantém o paralelismo genealógico do hebraico com “filhos de José”; aqui a expressão se refere aos descendentes ou membros tribais de Manassés.
- source_word: נָשִׂיא
  choice: um líder
  rationale: Neste contexto, designa o representante ou chefe nomeado de uma tribo. “Líder” é claro e evita as conotações monárquicas que “príncipe” poderia sugerir.
- source_word: חַנִּיאֵל
  choice: Haniel
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: בֶּן אֵפֹד
  choice: filho de Efode
  rationale: Construção patronímica hebraica comum. Efode é aqui um nome pessoal, não a veste sacerdotal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem e a repetição do hebraico foram preservadas por fazerem parte da estrutura administrativa da lista; a vírgula em “Haniel, filho de Efode” favorece a leitura natural.
