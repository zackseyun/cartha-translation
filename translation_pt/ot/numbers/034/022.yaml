lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: E, pela tribo de
  rationale: Neste contexto de repartição territorial, מַטֶּה designa uma tribo; a conjunção e a preposição são traduzidas naturalmente por “E, pela”.
- source_word: בְנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a expressão hebraica de parentesco e descendência tribal, com uma nota para esclarecer seu caráter literal.
- source_word: נָשִׂיא
  choice: o líder
  rationale: Designa o representante tribal incumbido da divisão da terra; “líder” é claro e atual, sem sugerir necessariamente dignidade monárquica.
- source_word: בֻּקִּי
  choice: Buqui
  rationale: Transliteração portuguesa tradicional e reconhecível do nome pessoal hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente direto e esperado da expressão hebraica de filiação.
- source_word: יָגְלִי
  choice: Jogli
  rationale: Forma portuguesa reconhecível do nome pessoal, representando o yod inicial segundo a convenção tradicional dos nomes bíblicos.
