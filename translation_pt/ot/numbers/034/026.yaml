- source_word: בְנֵי
  choice: os filhos de
  rationale: Tradução direta da expressão hebraica que constitui a designação tribal tradicional, preservando sua forma masculina.
- source_word: יִשָׂשכָר
  choice: Issacar
  rationale: Forma consagrada e amplamente reconhecida em português para o nome próprio.
- source_word: נָשִׂיא
  choice: um líder
  rationale: No contexto, refere-se ao representante designado da tribo; “líder” é claro, atual e evita as conotações monárquicas de “príncipe”.
- source_word: פַּלְטִיאֵל
  choice: Paltiel
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Tradução direta e natural do marcador patronímico.
- source_word: עַזָּן
  choice: Azã
  rationale: Forma adaptada à fonologia e à ortografia portuguesas do nome próprio hebraico.
