  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: pt
  text: O lado sul de vocês será desde o deserto de Zim, ao longo de Edom, e a fronteira sul de vocês será desde a extremidade[a] do mar Salgado[b], em direção ao leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “borda” ou “ponta”.'
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “mar Morto”; em hebraico, “mar Salgado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: lado sul
  rationale: No contexto de delimitação territorial, פְּאַת indica um lado ou uma margem, e נֶגֶב tem sentido direcional. “Lado sul” é claro e preserva a formulação geográfica.
- source_word: מִמִּדְבַּר צִן
  choice: desde o deserto de Zim
  rationale: מִדְבָּר designa uma região desértica ou erma. “Deserto” é natural em português, e “Zim” segue a forma tradicional portuguesa do topônimo hebraico צִן.
- source_word: עַל יְדֵי אֱדוֹם
  choice: junto a Edom
  rationale: A expressão idiomática indica proximidade lateral, isto é, “ao lado de” ou “junto a”. A tradução evita interpretar a frase como referência técnica à fronteira formal de Edom.
- source_word: גְּבוּל נֶגֶב
  choice: fronteira sul
  rationale: גְּבוּל é o limite de um território; “fronteira” expressa com clareza esse sentido no contexto da distribuição da terra.
- source_word: מִקְצֵה יָם הַמֶּלַח
  choice: desde a extremidade do mar Salgado
  rationale: קָצֶה denota o extremo, a ponta ou a borda. “Extremidade” mantém o sentido espacial sem especificar além do hebraico qual ponto do mar está em vista.
- source_word: יָם הַמֶּלַח
  choice: mar Salgado
  rationale: A tradução reproduz diretamente o nome hebraico, em vez de substituí-lo pelo nome tradicional “mar Morto”.
- source_word: קֵדְמָה
  choice: em direção ao leste
  rationale: O advérbio direcional indica orientação para o leste. A formulação portuguesa preserva esse movimento sem convertê-lo em “extremidade oriental”.
- source_word: וְהָיָה לָכֶם ... וְהָיָה לָכֶם
  choice: será ... será
  rationale: A repetição preserva a estrutura legal e descritiva do hebraico, mantendo correspondência formal sem soar obscura em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva a repetição do hebraico e a direção “em direção ao leste”, evitando resolver a expressão como se significasse necessariamente “a extremidade oriental” do mar.
