base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: pt
  text: '“Ordene aos israelitas[a] e diga-lhes: ‘Quando vocês entrarem na terra de Canaã, esta terra lhes caberá como herança: a terra de Canaã, segundo os seus limites.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “aos filhos de Israel”. Aqui, a expressão hebraica designa coletivamente os israelitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Dê esta ordem
  rationale: O imperativo expressa uma determinação com autoridade. A formulação é firme, natural e digna em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos israelitas
  rationale: Equivalente corrente e inclusivo para o nome coletivo hebraico, sem a possível ambiguidade moderna de “filhos de Israel”.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz de modo direto a sequência de imperativos do hebraico.
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: Quando vocês entrarem
  rationale: Neste contexto, כִּי introduz a circunstância futura da entrada. O futuro do subjuntivo é idiomático em português.
- source_word: הָאָרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Forma consagrada e natural para a aposição hebraica.
- source_word: זֹאת הָאָרֶץ
  choice: esta é a terra
  rationale: Mantém a força demonstrativa que introduz a delimitação territorial.
- source_word: אֲשֶׁר תִּפֹּל לָכֶם
  choice: que lhes caberá
  rationale: “Caber” comunica naturalmente o sentido idiomático de uma porção territorial atribuída, enquanto a imagem literal de “cair” é registrada em nota.
- source_word: בְּנַחֲלָה
  choice: como herança
  rationale: Expressa a terra recebida como patrimônio hereditário ou porção concedida.
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: a terra de Canaã, conforme os seus limites
  rationale: Preserva a repetição formal e indica que os limites territoriais serão especificados a seguir.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” torna explícito o plural hebraico; “diga-lhes” e “conforme” preservam um tom formal moderado. As notas mantêm visíveis o hebraísmo “filhos de Israel” e a imagem concreta de uma porção que “cai” a alguém.
