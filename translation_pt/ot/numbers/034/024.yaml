lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: E para a tribo de
  rationale: מַטֶּה pode significar literalmente “cajado” ou “vara”, mas, nesta lista administrativa, designa uma tribo; os prefixos וּ e לְ são expressos naturalmente por “E para”.
- source_word: בְנֵי אֶפְרַיִם
  choice: os filhos de Efraim
  rationale: Preserva a construção hebraica literal, que neste contexto se refere aos descendentes ou integrantes da tribo de Efraim.
- source_word: נָשִׂיא
  choice: um líder
  rationale: Designa o representante ou chefe nomeado da tribo; “líder” é atual e claro, sem as possíveis conotações monárquicas de “príncipe”.
- source_word: קְמוּאֵל
  choice: Quemuel
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Forma natural em português para a construção patronímica hebraica.
- source_word: שִׁפְטָן
  choice: Siftã
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas, com marcação da tonicidade final.
