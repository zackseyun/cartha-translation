  text: 'E para a tribo dos filhos de Efraim[a], um líder: Quemuel, filho de Siftã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Efraim”; isto é, os integrantes ou descendentes da tribo de Efraim.'
