  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: pt
  text: 'Estes são os nomes dos homens que repartirão a terra entre vocês como herança: Eleazar, o sacerdote, e Josué, filho de Num[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “darão a vocês a terra como herança” ou “farão vocês herdarem a terra”. O verbo hebraico transmite a ideia de fazer alguém receber uma herança ou de distribuí-la.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Estes são os nomes
  rationale: A oração nominal hebraica é expressa naturalmente em português com o verbo copulativo “são”.
- source_word: הָאֲנָשִׁים
  choice: dos homens
  rationale: O substantivo masculino plural designa os líderes do sexo masculino identificados pelo nome no versículo.
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: que repartirão a terra entre vocês como herança
  rationale: 'O Hifil de נחל tem sentido causativo: esses líderes administrarão a distribuição pela qual o povo receberá a terra como herança. “Repartirão... entre vocês como herança” preserva tanto a ação distributiva quanto a linguagem de herança.'
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Eleazar, o sacerdote
  rationale: Emprega a forma tradicional portuguesa do nome e traduz o título, com pontuação idiomática de aposto.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: e Josué, filho de Num
  rationale: Emprega as formas tradicionais portuguesas dos nomes e verte diretamente a expressão patronímica.
theological_decisions:
- issue: Agência humana na concessão da herança
  choice: repartirão a terra entre vocês como herança
  alternative: farão vocês herdarem a terra
  rationale: A tradução mantém os homens como administradores da distribuição, sem sugerir que sejam a fonte última da herança nem apagar o valor causativo do verbo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” comunica naturalmente o plural de לָכֶם; “repartirão” é corrente e expressa o ato administrativo de distribuir a terra.
