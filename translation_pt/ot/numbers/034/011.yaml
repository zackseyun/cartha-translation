  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: pt
  text: Então, a fronteira descerá de Sefã até Ribla, a leste de Aim[a]; descerá e atingirá a encosta do mar de Quinerete, a leste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica também pode ser vertida: “do lado leste de Aim”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tocará o ombro do mar de Quinerete, para o leste”. Em linguagem geográfica, “ombro” pode indicar o lado, o flanco ou a encosta junto ao mar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: descerá
  rationale: Preserva o sentido direcional e topográfico de ירד e se ajusta ao estilo descritivo das delimitações territoriais.
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: a fronteira
  rationale: גְּבוּל designa o limite territorial; “fronteira” é natural e clara neste contexto geográfico.
- source_word: מִשְּׁפָם
  choice: de Sefã
  rationale: Transliteração portuguesa do topônimo hebraico, com a preposição de origem exigida pelo contexto.
- source_word: הָרִבְלָה
  choice: até Ribla
  rationale: Transliteração portuguesa do topônimo; “até” expressa o movimento em direção ao lugar.
- source_word: מִקֶּדֶם לָעָיִן
  choice: a leste de Aim
  rationale: Expressa de modo direto a localização de Ribla em relação a Aim, sem eliminar o valor espacial do hebraico.
- source_word: וּמָחָה
  choice: chegará
  rationale: Neste contexto de demarcação, o verbo indica que a linha da fronteira alcança ou toca um acidente geográfico; “chegará” comunica isso naturalmente.
- source_word: עַל כֶּתֶף
  choice: à encosta
  rationale: כֶּתֶף significa literalmente “ombro”, mas em uso topográfico pode indicar o lado, flanco ou encosta de uma formação geográfica.
- source_word: יָם כִּנֶּרֶת
  choice: o mar de Quinerete
  rationale: Mantém a designação hebraica do corpo de água, em vez de substituí-la pelo nome posterior “mar da Galileia”.
- source_word: קֵדְמָה
  choice: no lado leste
  rationale: Torna explícita, em português natural, a orientação oriental indicada pelo advérbio hebraico.
