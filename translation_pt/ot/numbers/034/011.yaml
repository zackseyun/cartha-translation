  register: Português atual, digno e amplamente compreensível, com grafia de topônimos adequada à leitura brasileira. A repetição integral de “a fronteira” na segunda oração foi evitada por fluidez, sem perda de referente. Os marcadores de nota foram posicionados junto às expressões que efetivamente explicam.
