  text: וְ/יָצָ֤א הַ/גְּבֻל֙ זִפְרֹ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו חֲצַ֣ר עֵינָ֑ן זֶֽה יִהְיֶ֥ה לָ/כֶ֖ם גְּב֥וּל צָפֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: pt
  text: A fronteira se estenderá até Zifrom, e seu ponto final será Hazar-Enã. Essa será a fronteira norte de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא הַגְּבֻל
  choice: A fronteira se estenderá
  rationale: Em descrições territoriais, יצא indica o percurso ou a extensão da linha de fronteira; “se estenderá” comunica esse sentido geográfico com naturalidade.
- source_word: זִפְרֹנָה
  choice: até Zifrom
  rationale: O sufixo direcional indica movimento em direção ao local; “até” é natural no traçado de uma fronteira. O topônimo é transliterado.
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: e seu ponto final será
  rationale: A expressão plural hebraica designa aqui o término da linha fronteiriça. O singular coletivo produz português claro sem alterar a referência geográfica.
- source_word: חֲצַר עֵינָן
  choice: Hazar-Enã
  rationale: Topônimo composto transliterado do hebraico, com hífen para conservar sua unidade.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל צָפוֹן
  choice: Essa será a fronteira norte de vocês
  rationale: Formulação direta e atual que identifica toda a linha descrita como a fronteira situada ao norte do território.
