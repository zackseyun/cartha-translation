base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/008.yaml
  text: From Mount Hor you shall mark out the border to Lebo-hamath[a], and the end points of the border shall be at Zedad.
translation:
  language: pt
  text: Do Monte Hor, vocês traçarão a fronteira até Lebo-Hamate[a], e os pontos extremos da fronteira ficarão em Zedade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente, “à entrada de Hamate”; provavelmente é um nome geográfico fixo: Lebo-Hamate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֹר הָהָר
  choice: Do monte Hor
  rationale: A construção hebraica é o topônimo tradicional “monte Hor”, com a preposição מִן indicando o ponto de partida.
- source_word: תְּתָאוּ
  choice: vocês traçarão
  rationale: No contexto de demarcação territorial, o verbo indica traçar ou delinear o percurso da fronteira; “traçarão” é natural e preciso em português.
- source_word: לְבֹא חֲמָת
  choice: até Lebo-Hamate
  rationale: Embora a expressão possa ser entendida literalmente como “à entrada de Hamate”, ela funciona provavelmente como designação geográfica fixa; a transliteração preserva essa força toponímica.
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: os pontos extremos da fronteira
  rationale: Em descrições territoriais, תּוֹצְאֹת designa limites ou pontos terminais. A formulação mantém o plural hebraico sem recorrer ao pouco natural “saídas”.
- source_word: צְדָדָה
  choice: em Zedade
  rationale: O nome de lugar indica onde ficarão os pontos terminais da fronteira; “em” expressa naturalmente essa localização.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e legibilidade brasileira. O plural “vocês” explicita o destinatário coletivo da forma verbal hebraica. A redação preserva a possível natureza toponímica de Lebo-Hamate e registra em nota a leitura literal.
