base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: pt
  text: Então a fronteira de vocês fará uma curva ao sul da subida de Acrabim[a] e passará por Zim. Suas extremidades ficarão ao sul de Cades-Barneia; dali, ela se estenderá até Hazar-Adar e seguirá até Azmom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Acrabim provavelmente significa “escorpiões”; o nome também poderia ser traduzido como “subida dos Escorpiões” ou “passo dos Escorpiões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב לָכֶם הַגְּבוּל
  choice: a fronteira de vocês fará uma curva
  rationale: נָסַב descreve a mudança de direção da linha de fronteira; “fará uma curva” expressa isso com naturalidade, enquanto לָכֶם é preservado por “de vocês”.
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: ao sul da subida de Acrabim
  rationale: מִנֶּגֶב indica o lado sul do ponto geográfico. מַעֲלֵה é traduzido como “subida”, e o topônimo Acrabim é transliterado.
- source_word: וְעָבַר צִנָה
  choice: e seguirá até Zim
  rationale: Em itinerários de fronteira, עָבַר descreve o avanço da linha; o hê direcional em צִנָה indica movimento em direção a Zim.
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: Seu limite ficará
  rationale: תּוֹצְאוֹת, embora morfologicamente plural, designa aqui a extremidade ou o limite da linha fronteiriça; o singular coletivo é mais natural em português sem alterar o referente.
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: ao sul de Cades-Barneia
  rationale: A expressão situa o limite no lado sul de Cades-Barneia.
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: dali, ela se estenderá até Hazar-Adar
  rationale: יָצָא, em descrições territoriais, indica que a fronteira prossegue ou se estende até outro ponto. “Dali” esclarece a sequência sem acrescentar conteúdo geográfico.
- source_word: וְעָבַר עַצְמֹנָה
  choice: e seguirá até Azmom
  rationale: עָבַר volta a descrever o percurso da fronteira, e a terminação direcional do topônimo indica movimento até Azmom.
