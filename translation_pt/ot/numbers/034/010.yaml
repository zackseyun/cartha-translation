base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/010.yaml
  text: And you shall mark out for yourselves the eastern border from Hazar-enan to Shepham[a].
translation:
  language: pt
  text: E vocês traçarão para si a fronteira oriental, desde Hazar-Enã até Sefã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “demarcarão para si a fronteira oriental”. O verbo hebraico é incomum e, neste contexto, refere-se a traçar ou marcar uma linha de fronteira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: traçarão
  rationale: Neste contexto de delimitação territorial, o verbo incomum indica traçar ou demarcar a linha da fronteira, não o sentido mais comum de desejar.
- source_word: לָכֶם
  choice: para si
  rationale: Preserva a nuance reflexiva-benefactiva do pronome dativo, indicando que a delimitação é feita para os próprios israelitas.
- source_word: לִגְבוּל קֵדְמָה
  choice: a fronteira oriental
  rationale: גְּבוּל designa o limite territorial, e קֵדְמָה identifica o lado leste; a formulação adjetival é clara e natural em português.
- source_word: מֵחֲצַר עֵינָן
  choice: desde Hazar-Enã
  rationale: Translitera o topônimo e marca o ponto inicial deste trecho da fronteira.
- source_word: שְׁפָמָה
  choice: até Sefã
  rationale: Translitera o topônimo e expressa seu papel como ponto final deste trecho; o ה direcional admite a ideia de movimento em direção a esse lugar.
