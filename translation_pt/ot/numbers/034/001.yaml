  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”. Outra forma: “Jeová”.'
    reason: Registra a forma hebraica e as principais convenções portuguesas para representar o nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol de דבר faz a narrativa avançar. “Então” expressa a sequência em português natural, e “falou” preserva a ideia verbal da fórmula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: 'Equivalente direcional natural neste contexto: “falou a Moisés”.'
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala que vem a seguir. Em português atual, os dois-pontos reproduzem naturalmente essa função, evitando a construção menos idiomática “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título; a nota registra a tradição de tradução.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula hebraica de introdução ao discurso foi vertida de modo idiomático; os dois-pontos preparam a fala do versículo seguinte.
