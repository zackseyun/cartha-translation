  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: pt
  text: 'E, para a tribo dos filhos de Zebulom, um líder: Elisafã, filho de Parnaque.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: E, para a tribo de
  rationale: Neste contexto de distribuição tribal, מַטֶּה designa uma tribo, não um bastão ou ramo. A conjunção e a preposição prefixadas são expressas naturalmente por “E, para”.
- source_word: בְנֵי זְבוּלֻן
  choice: os filhos de Zebulom
  rationale: Preserva a forma genealógica do hebraico בְנֵי, que aqui funciona também como designação coletiva da tribo.
- source_word: נָשִׂיא
  choice: um líder
  rationale: נָשִׂיא indica o chefe ou representante reconhecido da tribo. “Líder” é claro e atual, sem a possível conotação monárquica de “príncipe”.
- source_word: אֱלִיצָפָן
  choice: Elisafã
  rationale: Transliteração portuguesa corrente do nome hebraico, ajustada à fonologia e à ortografia do português.
- source_word: בֶּן פַּרְנָךְ
  choice: filho de Parnaque
  rationale: בֶּן é o marcador genealógico usual, traduzido diretamente por “filho de”; o nome próprio é transliterado em forma natural para leitores de português.
