  text: Then Yahweh spoke to Moses, saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa naturalmente a sequência, e “falou” representa דבר nesta fórmula introdutória.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, sem substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Marca o destinatário da fala; em português, “falar a alguém” preserva de modo claro e digno essa relação.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto iniciado no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal em forma transliterada, em vez de substituí-lo por um título ou adotar a forma híbrida tradicional.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima à fórmula hebraica. “Então” mantém a progressão narrativa; os dois-pontos indicam que o conteúdo da fala vem a seguir.
