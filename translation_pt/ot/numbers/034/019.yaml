  text: 'And these are the names of the men: for the tribe of Judah, Caleb son of Jephunneh.'
translation:
  language: pt
  text: 'E estes são os nomes dos homens: da tribo de Judá, Calebe, filho de Jefoné.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: O וְ dá continuidade ao discurso anterior, enquanto אֵלֶּה apresenta a identificação; a formulação é natural em português e explicita a cópula subentendida na oração nominal hebraica.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: os nomes dos homens
  rationale: שְׁמוֹת está no construto com הָאֲנָשִׁים. Neste contexto, o plural masculino designa os representantes homens nomeados.
- source_word: לְמַטֵּה
  choice: pela tribo de
  rationale: Neste contexto de repartição tribal, מַטֶּה significa «tribo», não «cajado». A preposição לְ apresenta o representante correspondente à tribo; «pela tribo de» conserva essa relação de representação de modo conciso.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כָּלֵב
  choice: Calebe
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בֶּן
  choice: filho de
  rationale: Tradução natural da construção patronímica hebraica.
- source_word: יְפֻנֶּה
  choice: Jefoné
  rationale: Forma tradicional do nome hebraico em traduções portuguesas, com acentuação adequada à leitura moderna.
