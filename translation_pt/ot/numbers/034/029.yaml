  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: pt
  text: Estes são os que Yahweh ordenou que repartissem a herança entre os filhos de Israel na terra de Canaã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estes são os que Yahweh ordenou que dessem a herança aos filhos de Israel na terra de Canaã.”'
    reason: Alternativa lexical para לְנַחֵל, que pode destacar o ato de dar ou fazer receber a terra como herança.
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Foram esses os homens a quem
  rationale: A expressão identifica, em conclusão, as pessoas nomeadas nos versículos anteriores. “Esses os homens” explicita naturalmente em português o referente masculino plural sem alterar seu sentido.
- source_word: צִוָּה
  choice: ordenou
  rationale: Preserva o sentido normal de צוה; a tarefa ordenada é expressa pelo infinitivo seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְנַחֵל
  choice: que repartissem a herança
  rationale: O hifil de נחל, neste contexto de distribuição territorial, indica fazer receber por herança ou atribuir parcelas hereditárias. “Repartissem a herança” comunica tanto a distribuição quanto seu caráter de herança.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Com o verbo português “repartir”, “entre” é a regência idiomática adequada. “Filhos de Israel” conserva a forma coletiva e genealógica do hebraico.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Tradução natural e formalmente próxima da expressão geográfica hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Sentido de לְנַחֵל
  choice: repartir a herança entre os filhos de Israel
  alternative: dar a herança aos filhos de Israel
  rationale: O contexto trata da distribuição da terra pelos líderes designados. A leitura escolhida preserva essa dimensão, enquanto a nota registra a alternativa lexical mais geral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A inversão moderada em “Foram esses os homens” mantém o caráter conclusivo do versículo. O marcador [a] aparece no texto principal.
