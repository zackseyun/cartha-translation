  text: וְ/יָרַ֤ד הַ/גְּבוּל֙ הַ/יַּרְדֵּ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו יָ֣ם הַ/מֶּ֑לַח זֹאת֩ תִּהְיֶ֨ה לָ/כֶ֥ם הָ/אָ֛רֶץ לִ/גְבֻלֹתֶ֖י/הָ סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: pt
  text: Então, a fronteira descerá até o rio Jordão, e suas extremidades[a] ficarão no Mar Salgado[b]. Esta será a terra de vocês, com os limites que a cercam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu ponto terminal ficará no Mar Salgado”. O termo hebraico pode designar as extremidades ou o ponto terminal de uma fronteira.'
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “Mar Salgado”; isto é, o corpo de água comumente chamado Mar Morto.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: Então, ... descerá
  rationale: O verbo ירד significa “descer”. O futuro é adequado ao caráter prescritivo da delimitação, e “Então” expressa com naturalidade a sequência introduzida pela conjunção.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: גְּבוּל designa uma fronteira ou linha de limite territorial; “fronteira” é claro e natural neste itinerário geográfico.
- source_word: הַיַּרְדֵּנָה
  choice: até o rio Jordão
  rationale: A terminação direcional indica movimento em direção ao Jordão. “Rio” é uma explicitação geográfica natural em português, sem alterar o referente.
- source_word: תוֹצְאֹתָיו
  choice: terminará
  rationale: Em descrições de fronteiras, o substantivo plural pode indicar as saídas, extremidades ou o ponto terminal da linha. A forma verbal “terminará” comunica com clareza essa função geográfica; a alternativa mais formal é preservada em nota.
- source_word: יָם הַמֶּלַח
  choice: Mar Salgado
  rationale: A tradução conserva o nome hebraico, literalmente “Mar de Sal/Mar Salgado”, em vez de substituí-lo no texto pelo nome moderno “Mar Morto”.
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: Esta será a terra de vocês
  rationale: A formulação reproduz de maneira natural a declaração resumitiva da terra atribuída aos destinatários.
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: com os limites que a cercam
  rationale: A expressão descreve a terra segundo as fronteiras que a delimitam por todos os lados. A redação evita a rigidez de “segundo os seus limites ao redor” sem perder o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se o nome geográfico hebraico “Mar Salgado”, enquanto uma nota fornece o nome moderno mais conhecido. A construção nominal difícil de תוֹצְאֹתָיו é vertida idiomaticamente por “terminará”, com a alternativa mais formal registrada em nota.
