  yaml_path: translation/ot/numbers/034/005.yaml
  text: Then the border shall turn from Azmon to the Brook of Egypt[b][a], and its end shall be at the sea.
translation:
  language: pt
  text: Então a fronteira mudará de direção desde Azmon até o ribeiro do Egito[a], e seu ponto final será no mar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o uádi do Egito”. O termo hebraico נחל muitas vezes designa um curso de água sazonal ou seu leito.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “suas saídas” ou “suas extremidades”; a forma plural designa o ponto terminal da fronteira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Então ... mudará de direção
  rationale: No contexto de demarcação territorial, נסב indica que a linha da fronteira muda de rumo. A formulação é natural em português e mantém o valor prospectivo da descrição.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: גְּבוּל designa aqui a linha que delimita o território; “fronteira” é clara e corrente em português.
- source_word: מֵעַצְמוֹן
  choice: desde Azmom
  rationale: O topônimo é transliterado; “desde” apresenta Azmom como o ponto a partir do qual a fronteira muda de direção.
- source_word: נַחְלָה מִצְרָיִם
  choice: até o ribeiro do Egito
  rationale: נחל costuma designar um curso de água, muitas vezes sazonal, ou seu leito. “Ribeiro do Egito” mantém legibilidade e continuidade tradicional sem sugerir o Nilo.
- source_word: תּוֹצְאֹתָיו
  choice: seu ponto final
  rationale: Em descrições de fronteiras, o plural hebraico refere-se à terminação ou ao ponto extremo da linha. O singular idiomático em português comunica esse sentido sem forçar a morfologia hebraica.
- source_word: הַיָּמָּה
  choice: no mar
  rationale: A forma direcional significa literalmente “para o mar”; neste contexto, indica que a fronteira termina junto ao mar. Não se explicita “Mediterrâneo”, pois o hebraico diz apenas “o mar”.
