  yaml_path: translation/ot/numbers/034/028.yaml
  text: 'And for the tribe of the sons of Naphtali[a], a leader: Pedahel son of Ammihud.'
translation:
  language: pt
  text: 'E, para a tribo dos filhos de Naftali[a], um líder: Pedael, filho de Amiúde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de Naftali”, designação tribal comum que significa os descendentes de Naftali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: E, para a tribo de
  rationale: Neste contexto de divisão territorial, מַטֶּה designa uma tribo, não uma vara ou cajado; os prefixos são naturalmente traduzidos por “E, para”.
- source_word: בְנֵי
  choice: os filhos de
  rationale: Preserva a forma masculina literal da expressão tribal hebraica, embora aqui ela designe de modo coletivo os descendentes de Naftali.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: נָשִׂיא
  choice: um líder
  rationale: No contexto desta lista administrativa, indica o chefe ou representante designado da tribo; “líder” é claro e evita conotações monárquicas de “príncipe”.
- source_word: פְּדַהְאֵל
  choice: Pedael
  rationale: Transliteração portuguesa natural do nome próprio hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Tradução direta e natural da fórmula patronímica hebraica.
- source_word: עַמִּיהוּד
  choice: Amiúde
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
