base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: pt
  text: 'E, para a tribo dos filhos de Simeão: Semuel, filho de Amiúde.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Do hebraico «Shemuel»; tradicionalmente, «Samuel».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: E, para a tribo de
  rationale: Neste contexto administrativo de distribuição da terra, מַטֶּה designa uma unidade tribal, não um bastão ou ramo literal; a conjunção e a preposição são vertidas naturalmente por “E, para”.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a forma hebraica do construto plural e a designação tribal tradicional, embora aqui também tenha o sentido coletivo de descendentes.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: שְׁמוּאֵל
  choice: Semuel
  rationale: Transliteração portuguesa próxima da forma hebraica deste nome, distinguindo-a da forma tradicional “Samuel”, mais conhecida.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente direto e natural do marcador genealógico nesta lista de líderes tribais.
- source_word: עַמִּיהוּד
  choice: Amiúde
  rationale: Forma portuguesa tradicional do nome hebraico, com acentuação gráfica que orienta a pronúncia.
