  yaml_path: translation/ot/numbers/025/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”. Outras formas usadas em português incluem “Javé” e “Jeová”.'
    reason: Registra o Tetragrama hebraico e as principais alternativas de tradução ou transliteração.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, nesta fórmula narrativa de discurso divino, é traduzido naturalmente por “falou”; o waw consecutivo faz avançar a narrativa sem exigir que se acrescente “então”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; “a Moisés” é a formulação portuguesa corrente.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz as palavras que vêm a seguir, com clareza e dignidade em português.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” o apresenta como nome próprio e evita substituir o Tetragrama por um título; a nota registra a tradição de tradução e outras formas portuguesas conhecidas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “falou a Moisés, dizendo” conserva a fórmula solene do hebraico e prepara a fala subsequente.
