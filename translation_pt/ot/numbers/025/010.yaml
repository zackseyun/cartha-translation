base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “SENHOR”; também transliterado “Yahweh”.
    reason: Registra a forma hebraica e a tradução tradicional do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência com naturalidade, e “falou” traduz דּבר de modo corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; em português, a construção natural é “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz a fala direta que vem no versículo seguinte. Em português moderno, os dois-pontos cumprem essa função com mais naturalidade do que o literal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; a nota registra a tradição de vertê-lo como “SENHOR”.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A sequência narrativa é indicada por “Então”; a fórmula introdutória לֵאמֹר é representada por dois-pontos, evitando a rigidez de “dizendo” sem perder sua função discursiva.
