source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔י/ו הַ/נִּצְמָדִ֖ים לְ/בַ֥עַל פְּעֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: pt
  text: 'Então Moisés disse aos juízes de Israel: “Cada um de vocês mate os homens sob sua autoridade que se uniram a Baal de Peor[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Baal-Peor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: juízes
  rationale: O substantivo designa aqui pessoas que exerciam autoridade judicial e governamental em Israel; “juízes” é a correspondência mais direta e adequada ao contexto.
- source_word: הִרְגוּ
  choice: mate
  rationale: O imperativo plural expressa uma ordem direta. A construção distributiva seguinte permite em português o singular “Cada um de vocês mate”, sem acrescentar a nuance jurídica mais específica de “execute”.
- source_word: אִישׁ אֲנָשָׁיו
  choice: Cada um de vocês ... os homens sob sua autoridade
  rationale: A construção distributiva, literalmente “cada homem, seus homens”, dirige a cada juiz a responsabilidade pelos homens ligados à sua esfera de autoridade. A formulação explicita essa relação de modo natural, sem sugerir posse pessoal.
- source_word: הַנִּצְמָדִים
  choice: que se uniram
  rationale: O particípio nifal de צמד indica ligação ou adesão estreita e, neste contexto, voluntária; “se uniram” preserva a imagem sem definir além do texto a natureza exata dessa adesão.
- source_word: לְבַעַל פְּעוֹר
  choice: a Baal de Peor
  rationale: A expressão identifica a divindade associada a Peor. “Baal de Peor” comunica claramente essa relação em português; a forma composta tradicional é registrada em nota.
theological_decisions:
- issue: Natureza da morte ordenada
  choice: Traduzir diretamente a ordem de Moisés para que os juízes matem os homens sob sua autoridade que aderiram a Baal de Peor.
  alternative: Usar “executem” para salientar uma pena judicial, ou acrescentar uma explicação sobre juízo da aliança.
  rationale: O versículo apresenta uma ordem severa no contexto da apostasia, mas não especifica aqui o procedimento jurídico ou a interpretação ritual. “Mate” preserva a força do hebraico sem acrescentar enquadramento não expresso.
- issue: Referência masculina em אִישׁ אֲנָשָׁיו
  choice: Manter “os homens”, com referência masculina explícita.
  alternative: Empregar uma formulação neutra, como “as pessoas sob sua autoridade”.
  rationale: O hebraico é explicitamente masculino e, no contexto, refere-se aos homens envolvidos; neutralizar a expressão apagaria essa informação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Então” representa naturalmente o wayyiqtol narrativo; “sob sua autoridade” esclarece a construção distributiva hebraica sem transformar “matar” em terminologia jurídica mais específica.
