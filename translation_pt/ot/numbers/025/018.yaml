id: NUM.25.18
reference: Numbers 25:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י צֹרְרִ֥ים הֵם֙ לָ/כֶ֔ם בְּ/נִכְלֵי/הֶ֛ם אֲשֶׁר נִכְּל֥וּ לָ/כֶ֖ם עַל דְּבַר פְּע֑וֹר וְ/עַל דְּבַ֞ר כָּזְבִּ֨י בַת נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔/ם הַ/מֻּכָּ֥ה בְ/יוֹם הַ/מַּגֵּפָ֖ה עַל דְּבַר פְּעֽוֹר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: pt
  text: Pois eles são hostis a vocês por meio de suas artimanhas[b], com as quais os enganaram no caso de Peor[a] e no caso de Cozbi, filha de um líder de Midiã, irmã deles[c], que foi abatida no dia da praga por causa do caso de Peor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peor se refere ao episódio envolvendo Baal-Peor, narrado anteriormente neste capítulo.
    reason: cross_reference
  - marker: b
    text: Ou “por meio de seus ardis” ou “por meio de sua traição”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “irmã deles”; provavelmente uma mulher do próprio povo ou grupo de parentesco deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: são hostis
  rationale: O particípio expressa hostilidade contínua. A formulação predicativa preserva essa força sem restringi-la a inimizade militar.
- source_word: בְּנִכְלֵיהֶם
  choice: por meio de suas artimanhas
  rationale: O substantivo designa recursos astutos e enganosos, e a preposição tem valor instrumental. “Artimanhas” é claro e natural em português atual.
- source_word: נִכְלוּ
  choice: enganaram
  rationale: O verbo, cognato do substantivo anterior, descreve uma ação ardilosa dirigida contra Israel. “Enganaram” comunica de modo direto o efeito dessa ação.
- source_word: עַל דְּבַר פְּעוֹר
  choice: no caso de Peor / por causa do caso de Peor
  rationale: A expressão idiomática admite valor temático ou causal. Na primeira ocorrência, “no caso de” indica o episódio envolvido; na última, o contexto favorece a relação causal com a praga.
- source_word: כָּזְבִּי
  choice: Cozbi
  rationale: Transliteração do nome próprio, sem acrescentar identificação ausente do texto hebraico.
- source_word: בַת נְשִׂיא מִדְיָן
  choice: filha de um líder de Midiã
  rationale: נשיא indica uma autoridade ou chefe. “Líder” evita conotações monárquicas indevidas e é amplamente compreensível.
- source_word: אֲחֹתָם
  choice: irmã deles
  rationale: Mantém a expressão familiar literal do hebraico e deixa em aberto se indica parentesco imediato ou pertencimento ao mesmo povo ou grupo de parentesco.
- source_word: הַמֻּכָּה
  choice: que foi abatida
  rationale: Preserva a imagem verbal passiva de נכה e comunica, no contexto, que ela foi morta, sem reduzir a expressão a uma paráfrase.
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: no dia da praga
  rationale: Tradução temporal direta e idiomática, mantendo a referência concreta ao dia em que ocorreu a praga.
theological_decisions:
- issue: Referente de “Peor”
  choice: Manter “Peor” como nome próprio no texto e explicar em nota sua ligação com Baal-Peor.
  alternative: Traduzir diretamente como “Baal-Peor”.
  rationale: O hebraico traz apenas “Peor”. A expansão no corpo do texto acrescentaria uma identificação interpretativa, embora contextual.
- issue: Força das duas ocorrências de עַל דְּבַר פְּעוֹר
  choice: Usar “no caso de Peor” na primeira ocorrência e “por causa do caso de Peor” na última.
  alternative: Empregar a mesma formulação nas duas ocorrências.
  rationale: A primeira ocorrência identifica o episódio em que ocorreu o engano; a segunda se liga à praga e apresenta nuance causal. A variação preserva a flexibilidade contextual da expressão hebraica.
- issue: Sentido de “irmã deles”
  choice: Conservar a formulação literal no texto, com nota explicativa.
  alternative: Interpretar no texto como “uma mulher do povo deles” ou “parenta deles”.
  rationale: O hebraico permite que a linguagem de parentesco designe pertencimento étnico ou ao grupo de parentesco, mas não obriga a eliminar o sentido literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa, “Midiã” na forma portuguesa corrente e mantém a repetição de “caso de Peor” para refletir a estrutura do hebraico.
