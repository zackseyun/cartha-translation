id: NUM.25.7
reference: Numbers 25:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: pt
  text: Quando Fineias, filho de Eleazar, filho de Arão, o sacerdote, viu aquilo,[a] levantou-se do meio da congregação[b] e tomou uma lança na mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «viu isso». O hebraico diz simplesmente «viu»; o objeto é subentendido pelo contexto anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou «dentre a congregação» ou «do meio da assembleia».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu aquilo
  rationale: O hebraico diz literalmente apenas «viu», deixando o objeto implícito pelo contexto anterior. Em português, «viu aquilo» torna a frase natural sem especificar além do que a narrativa permite.
- source_word: פִּינְחָס
  choice: Fineias
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: filho de Eleazar, filho de Arão, o sacerdote
  rationale: Reproduz diretamente a identificação genealógica e mantém «o sacerdote», sem acrescentar «sumo», ausente do hebraico.
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: Expressa de modo natural o ato de se erguer e preserva o impulso narrativo da ação.
- source_word: מִתּוֹךְ הָעֵדָה
  choice: do meio da congregação
  rationale: Reflete tanto a ideia espacial de תּוֹךְ, «meio», como o sentido corporativo de עֵדָה, a comunidade reunida de Israel.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Equivalente direto e digno do verbo comum «tomar/pegar», sem intensificar indevidamente a ação como faria «arrebatou».
- source_word: רֹמַח
  choice: uma lança
  rationale: Termo português claro e geral para a arma indicada pelo hebraico.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Mantém a expressão concreta do hebraico, indicando que Fineias se armou com a lança.
theological_decisions:
- issue: Tradução de הָעֵדָה
  choice: congregação
  alternative: assembleia; comunidade
  rationale: «Congregação» conserva o sentido do povo de Israel reunido, característico do Pentateuco, sem transformar o termo em referência técnica a uma instituição religiosa posterior.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira. A sintaxe genealógica foi mantida sem rigidez excessiva; «tomou uma lança na mão» preserva a concretude do hebraico.
