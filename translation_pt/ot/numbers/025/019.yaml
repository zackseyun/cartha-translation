lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu
  rationale: A forma narrativa de היה funciona aqui como fórmula de transição. “E aconteceu” preserva essa função em português atual, sem recorrer à formulação mais tradicional e menos corrente “E sucedeu”.
- source_word: אַחֲרֵי
  choice: depois de
  rationale: A preposição indica diretamente sequência temporal; “depois de” é a equivalência mais natural e clara.
- source_word: הַמַּגֵּפָה
  choice: a praga
  rationale: מַגֵּפָה designa aqui a praga mortal do contexto imediato. “A praga” é claro, idiomático e mantém a ligação com o juízo narrado em Números 25.
theological_decisions:
- issue: Fórmula narrativa como versículo completo
  choice: Traduzir a breve oração como frase de transição autônoma.
  alternative: TratÁ-la apenas como o início sintático da frase que continua no versículo seguinte.
  rationale: O texto hebraico deste versículo contém somente a transição breve e uma pausa de seção. A frase autônoma respeita a divisão textual recebida sem eliminar sua função de ligação; não há questão doutrinária envolvida.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula depois de “aconteceu” realça a natureza transitória e incompleta da fórmula diante da seção seguinte.
