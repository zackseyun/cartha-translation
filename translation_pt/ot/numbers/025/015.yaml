base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: pt
  text: E o nome da mulher midianita que foi morta era Cosbi, filha de Zur, que era chefe dos clãs[a] de uma casa paterna[b] em Midiã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos povos”. O termo hebraico pode significar “povos”, mas, neste contexto de parentesco, também pode designar grupos de clãs.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “casa de pai”, expressão de parentesco que designa uma família extensa ou unidade familiar ancestral.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם
  choice: E o nome
  rationale: Mantém a ligação narrativa expressa pela conjunção hebraica e traduz o substantivo de modo direto.
- source_word: הָאִשָּׁה הַמֻּכָּה הַמִּדְיָנִית
  choice: da mulher midianita que foi ferida de morte
  rationale: A formulação natural em português conserva tanto a identificação étnica quanto a imagem verbal do particípio passivo de נכה; “de morte” deixa claro o resultado indicado pelo contexto sem reduzir o verbo simplesmente a “morta”.
- source_word: כָּזְבִּי בַת צ֑וּר
  choice: Cosbi, filha de Zur
  rationale: Emprega formas correntes dos nomes em português e traduz de maneira transparente a relação de filiação.
- source_word: רֹאשׁ
  choice: chefe
  rationale: No contexto social, רֹאשׁ designa liderança; “chefe” comunica naturalmente em português o sentido metafórico de “cabeça”.
- source_word: אֻמּוֹת
  choice: clãs
  rationale: Embora o termo possa significar “povos”, a associação com “casa paterna” favorece aqui grupos de parentesco.
- source_word: בֵּית אָב
  choice: uma casa paterna
  rationale: Preserva o termo técnico hebraico de parentesco, referente a uma família extensa ou unidade ancestral.
- source_word: בְּמִדְיָן
  choice: em Midiã
  rationale: Traduz naturalmente o sentido locativo da preposição.
- source_word: הוּא
  choice: Ele era
  rationale: O pronome masculino retoma Zur. A frase separada evita que o relativo em português pareça referir-se a Cosbi.
