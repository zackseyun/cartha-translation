id: NUM.25.4
reference: Numbers 25:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés[a]: “Pegue todos os líderes do povo e empale-os para Yahweh em plena luz do dia[b], para que a ira ardente de Yahweh se afaste de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Reúna todos os líderes do povo e mande que executem os culpados para Yahweh em plena luz do dia”. O pronome hebraico traduzido por “os” aponta mais diretamente para os líderes, mas alguns entendem que eles recebem a ordem de executar os culpados.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “diante do sol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: קַח
  choice: Pegue
  rationale: Traduz diretamente o imperativo de לקח e soa natural no contexto da ordem dada a Moisés.
- source_word: כָּל רָאשֵׁי הָעָם
  choice: todos os líderes do povo
  rationale: רָאשֵׁי significa literalmente “cabeças de”, mas aqui designa os chefes ou líderes; “líderes” evita uma leitura anatômica equivocada e comunica claramente a função.
- source_word: וְהוֹקַע אֹתָם
  choice: e empale-os
  rationale: O hifil de יקע indica execução e exposição pública severa, provavelmente por empalamento ou suspensão. “Empale-os” preserva a violência e o caráter exemplar do ato sem reduzi-lo ao genérico “execute-os”.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל expressa aqui relação, destinação ou dedicação; “para Yahweh” reproduz essa força sem introduzir o sentido locativo de לִפְנֵי, “diante de”.
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: em plena luz do dia
  rationale: A expressão significa literalmente “diante do sol” e indica exposição aberta e pública durante o dia.
- source_word: וְיָשֹׁב
  choice: para que ... se afaste
  rationale: 'No encadeamento após a ordem, expressa a finalidade ou o resultado pretendido: o afastamento da ira divina.'
- source_word: חֲרוֹן אַף יְהוָה
  choice: a ira ardente de Yahweh
  rationale: Mantém a imagem hebraica do calor intenso da ira, com formulação digna e compreensível em português.
- source_word: מִיִּשְׂרָאֵל
  choice: de Israel
  rationale: A preposição מן marca separação; com “se afaste”, “de Israel” comunica naturalmente esse sentido.
theological_decisions:
- issue: Referente de “os” em “empale-os”
  choice: O pronome se refere, pela sintaxe imediata, a “todos os líderes do povo”.
  alternative: Os líderes seriam os encarregados de executar os israelitas culpados, e não as pessoas a serem executadas.
  rationale: O antecedente plural mais próximo de אֹתָם é “todos os líderes do povo”, favorecendo a leitura adotada no texto. Contudo, o versículo seguinte manda os juízes matarem os homens ligados a Baal-Peor, o que sustenta a leitura alternativa. A nota preserva essa tensão interpretativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o nome Yahweh, a severidade do verbo de execução e a ambiguidade sintática por meio de nota, sem resolver indevidamente a tensão com o versículo seguinte.
