  yaml_path: translation/ot/numbers/025/009.yaml
  text: And those who died in the plague were twenty-four thousand.
translation:
  language: pt
  text: E os que morreram na praga foram vinte e quatro mil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: O verbo היה, nesta construção narrativa, funciona como cópula que introduz o total. “Foram” é natural e preserva de perto a estrutura hebraica.
- source_word: הַמֵּתִים
  choice: os que morreram
  rationale: O particípio de מות pode significar literalmente “os mortos”; “os que morreram” é mais natural em português e explicita adequadamente a referência às pessoas falecidas.
- source_word: בַּמַּגֵּפָה
  choice: na praga
  rationale: מַגֵּפָה designa uma praga ou surto mortal. A expressão “na praga” mantém a construção com ב e deixa aberta a nuance entre morrer durante o acontecimento e em consequência dele.
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: vinte e quatro mil
  rationale: É a forma numérica idiomática do português moderno para o hebraico “quatro e vinte mil”.
