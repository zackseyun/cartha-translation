    rationale: בְּקַנְאוֹ אֶת־קִנְאָתִי associa diretamente a ação de Fineias ao ciúme de Deus por meio de termos cognatos. “Movido por” apresenta sobretudo uma causa interior, e “próprio” não corresponde a um elemento explícito do texto.
