revisions:
- from: Fineias, filho de Eleazar, filho de Arão, o sacerdote, afastou de sobre os filhos de Israel a minha ira, pois, no meio deles, agiu movido pelo meu próprio ciúme.[a] Assim, em meu ciúme, não exterminei os filhos de Israel.
  to: Fineias, filho de Eleazar, filho de Arão, o sacerdote, desviou a minha ira dos filhos de Israel, por ter demonstrado entre eles o meu ciúme.[a] Assim, não destruí os filhos de Israel em meu ciúme.
  rationale: A revisão substitui o calque pouco natural “afastou de sobre” por uma formulação portuguesa corrente e elimina “próprio”, que acrescentava ênfase. “Por ter demonstrado entre eles o meu ciúme” conserva a relação entre o ato de Fineias e o ciúme divino, sem impor uma explicação psicológica. “Não destruí” comunica claramente o sentido de כִלִּיתִי no contexto e evita a conotação contemporânea específica de “exterminei”.
