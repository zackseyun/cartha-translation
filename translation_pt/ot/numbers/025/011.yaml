source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: pt
  text: Fineias, filho de Eleazar, filho de Arão, o sacerdote, desviou a minha ira dos filhos de Israel, por ter demonstrado entre eles o meu ciúme.[a] Assim, não destruí os filhos de Israel em meu ciúme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ter demonstrado entre eles o meu zelo [...] em meu zelo”. O hebraico emprega formas da mesma raiz para a ação de Fineias e para a reação de Deus; essa raiz pode expressar tanto ciúme quanto zelo.'
    reason: Alternativa lexical e preservação da ligação entre os termos cognatos hebraicos.
lexical_decisions:
- source_word: הֵשִׁיב
  choice: afastou
  rationale: O hifil de שוב indica aqui fazer a ira recuar ou desviá-la. “Afastou” expressa de modo natural em português essa ação causativa.
- source_word: חֲמָתִי
  choice: a minha ira
  rationale: חֵמָה denota ira intensa ou furor. “Ira” conserva a força judicial do termo sem soar excessivamente rebuscado.
- source_word: מֵעַל
  choice: de sobre
  rationale: A formulação preserva a imagem hebraica da ira que estava sobre Israel, embora seja um pouco mais formal que o simples “de”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão pactual hebraica e sua forma masculina, em vez de substituí-la pelo gentílico mais idiomático “os israelitas”.
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: agiu movido pelo meu próprio ciúme
  rationale: A construção associa a ação de Fineias ao קִנְאָה de Deus. Esta formulação comunica que ele encarnou o ciúme pactual divino, evitando em português a expressão pouco natural “teve ciúme com o meu ciúme”.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Reproduz de maneira clara a ideia de que a ação ocorreu dentro da comunidade de Israel.
- source_word: כִלִּיתִי
  choice: exterminei
  rationale: No piel, כלה pode indicar consumir por completo ou destruir. “Exterminei” deixa claro o sentido de destruição total ameaçada, mas contida.
- source_word: בְּקִנְאָתִי
  choice: em meu ciúme
  rationale: Mantém a repetição do substantivo קִנְאָה e seu sentido de ciúme pactual, ligado à exigência de lealdade exclusiva.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: O título em aposição identifica Arão de modo direto e tradicional.
theological_decisions:
- issue: A linguagem de קנא / קִנְאָה aplicada a Fineias e a Deus
  choice: ciúme
  alternative: zelo
  rationale: “Ciúme” preserva a dimensão pactual de lealdade exclusiva e a ligação entre a ação de Fineias e a reação divina. Como “zelo” também é semanticamente possível e frequente na tradição de tradução, a alternativa é registrada em nota.
- issue: A expressão בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução conserva a expressão pactual e a forma gramatical do hebraico, sem neutralizá-la ou convertê-la em gentílico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De sobre” conserva deliberadamente a imagem hebraica, enquanto “agiu movido pelo meu próprio ciúme” evita uma reprodução cognata artificial em português. O marcador da nota foi colocado junto à expressão que ele explica.
