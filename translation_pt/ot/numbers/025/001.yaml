  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: pt
  text: Enquanto Israel permanecia em Sitim, o povo começou a se prostituir com as filhas de Moabe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “começou a praticar imoralidade sexual com as mulheres moabitas”; literalmente, “começou a prostituir-se com as filhas de Moabe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: permanecia
  rationale: O verbo יׁשב pode significar sentar-se, habitar ou permanecer. Neste contexto de acampamento, “permanecia” expressa uma estadia continuada sem sugerir assentamento definitivo.
- source_word: בַּשִּׁטִּים
  choice: em Sitim
  rationale: Sitim é a transliteração tradicional e reconhecível do topônimo hebraico em português; a preposição “em” é natural para indicar o local da permanência.
- source_word: וַיָּחֶל
  choice: começou
  rationale: Neste uso, a forma verbal introduz o início da ação; “começou” é clara e direta.
- source_word: הָעָם
  choice: o povo
  rationale: O substantivo designa coletivamente os israelitas e é traduzido naturalmente por “o povo”.
- source_word: לִזְנוֹת
  choice: a se prostituir
  rationale: O verbo זנה denota conduta sexual ilícita e conserva a imagem forte da prostituição. “Se prostituir” mantém essa força, em vez de reduzi-la a uma formulação moral genérica.
- source_word: אֶל
  choice: com
  rationale: Embora אֶל costume indicar direção, com זנה e referente pessoal expressa aqui envolvimento sexual; “com” comunica essa relação de modo idiomático.
- source_word: בְּנוֹת מוֹאָב
  choice: as filhas de Moabe
  rationale: A tradução formal preserva a expressão hebraica e continua inteligível em português; “mulheres moabitas” seria uma alternativa mais dinâmica.
theological_decisions:
- issue: Natureza do pecado de Israel na segunda oração
  choice: Empregar linguagem explícita de prostituição sexual.
  alternative: “começou a praticar imoralidade sexual com as mulheres moabitas”
  rationale: זנה é vívido e mais forte que uma abstração moral genérica. A formulação escolhida preserva a gravidade sexual e a possível ressonância de infidelidade, sem antecipar explicações teológicas dos versículos seguintes.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura conserva a relação temporal e a linguagem incisiva do hebraico. O marcador foi colocado após a expressão que a nota explica.
