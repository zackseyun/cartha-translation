base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: pt
  text: Ele foi atrás do homem israelita até o aposento[a] e traspassou ambos — o homem israelita e a mulher — pelo ventre dela[b]. Então a praga cessou de sobre os filhos de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “compartimento da tenda”, “alcova” ou “pavilhão”. O termo hebraico é raro e se refere a um compartimento ou aposento interior.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo abdômen dela”. O hebraico se refere especificamente ao ventre ou à cavidade abdominal da mulher.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “filhos de Israel”, expressão pactual tradicional que aqui se refere ao povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: o aposento
  rationale: O substantivo raro designa algum tipo de compartimento ou recinto interior. “Aposento” é natural e preserva a imprecisão quanto à forma arquitetônica.
- source_word: וַיִּדְקֹר
  choice: atravessou
  rationale: Expressa o golpe penetrante de דקר e, com “os dois”, comunica naturalmente que ambos foram traspassados pelo golpe.
- source_word: שְׁנֵיהֶם
  choice: os dois
  rationale: Reproduz diretamente a referência conjunta ao homem e à mulher.
- source_word: אֶל קֳבָתָהּ
  choice: atingindo-a no ventre
  rationale: Preserva a referência concreta ao ventre ou à cavidade abdominal da mulher, sem suavizar o detalhe, e evita a construção pouco natural “atravessou os dois... através do ventre dela”.
- source_word: וַתֵּעָצַר
  choice: cessou
  rationale: O nifal indica que a praga foi detida. “Cessou” é claro e idiomático em português, mantendo o resultado da ação.
- source_word: הַמַּגֵּפָה
  choice: a praga
  rationale: É a designação corrente e adequada para מַגֵּפָה neste contexto de juízo.
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: que estava sobre os filhos de Israel
  rationale: Preserva a imagem espacial de מֵעַל e a expressão hebraica בְּנֵי יִשְׂרָאֵל em português compreensível.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: o homem israelita
  rationale: Mantém tanto a referência explícita a um homem quanto sua identidade israelita.
theological_decisions:
- issue: Expressão coletiva marcada por gênero בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A tradução conserva a forma pactual tradicional e explicitamente masculina do hebraico, embora a expressão possa designar coletivamente todo o povo.
- issue: Detalhe anatômico gráfico na cena de juízo
  choice: atingindo-a no ventre
  alternative: atingindo-a no abdômen
  rationale: O texto hebraico apresenta um detalhe corporal concreto; ele é preservado sem eufemismo nem ampliação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi tornada idiomática sem apagar a violência concreta, a referência feminina de קֳבָתָהּ nem a imagem de a praga estar sobre Israel.
