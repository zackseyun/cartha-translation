  terminology: 'A terminologia está consistente: «midianita», «Moisés», «congregação», «filhos de Israel» e «tenda do encontro» são adequados. A nota sobre o feminino substantivado e a definitude hebraica é pertinente e está corretamente ancorada em [b].'
