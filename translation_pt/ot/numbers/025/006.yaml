  source_fidelity: 'A tradução reproduz adequadamente os elementos centrais do hebraico: o marcador enfático «E eis que», a origem israelita do homem, a ação de trazer/aproximar, a mulher midianita, a dupla expressão pública «diante dos olhos», o choro em curso e o local cultual. «Filhos de Israel», «irmãos» e «tenda do encontro» são escolhas fiéis e apropriadas.'
