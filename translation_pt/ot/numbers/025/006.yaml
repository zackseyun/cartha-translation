source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: pt
  text: E eis que um homem dentre os filhos de Israel veio e trouxe uma mulher midianita[b] para perto de seus irmãos, diante dos olhos de Moisés e diante dos olhos de toda a congregação dos filhos de Israel, enquanto eles choravam à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hebraico: “a midianita”. O português normalmente diz “uma mulher midianita” ao introduzi-la na narrativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o marcador discursivo que chama atenção para uma ação súbita e chocante, em registro bíblico ainda compreensível.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dentre os filhos de Israel
  rationale: Mantém a expressão familiar masculina do hebraico, com formulação natural em português.
- source_word: וַיַּקְרֵב
  choice: trouxe para perto
  rationale: Reflete o hifil de קרב, que expressa fazer aproximar ou trazer para perto, sem acrescentar a ideia interpretativa de apresentação formal.
- source_word: אֶל אֶחָיו
  choice: de seus irmãos
  rationale: Conserva literalmente a linguagem familiar do hebraico; no contexto, os irmãos são seus compatriotas israelitas.
- source_word: הַמִּדְיָנִית
  choice: uma mulher midianita
  rationale: O adjetivo feminino substantivado designa uma mulher; o artigo hebraico pode ser vertido idiomaticamente pelo indefinido ao introduzi-la na cena.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: diante dos olhos de ... e diante dos olhos de
  rationale: Preserva tanto o forte idioma visual quanto a repetição, ressaltando o caráter público e afrontoso do ato.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a congregação dos filhos de Israel
  rationale: Congregação comunica a comunidade reunida e mantém a linguagem pactual de filhos de Israel.
- source_word: וְהֵמָּה בֹכִים
  choice: enquanto eles choravam
  rationale: Expressa a ação contínua de fundo, simultânea à chegada do homem.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Tradução clara e culticamente específica do local do santuário; 'tenda do encontro' comunica a função da expressão hebraica.
theological_decisions:
- issue: Linguagem familiar masculina em בְּנֵי יִשְׂרָאֵל e אֶחָיו
  choice: Manter 'filhos de Israel' e 'irmãos' no texto principal
  alternative: israelitas; compatriotas; outros israelitas
  rationale: O hebraico emprega termos familiares masculinos. A tradução os preserva sem neutralizá-los nem restringir indevidamente a referência contextual.
- issue: Identidade definida ou introdução narrativa da midianita
  choice: uma mulher midianita
  alternative: a mulher midianita; a midianita
  rationale: Embora a forma hebraica seja definida, o português normalmente usa o artigo indefinido ao introduzir uma participante ainda não identificada; a nota conserva a forma mais estrita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leve solenidade bíblica. A repetição 'diante dos olhos' e as expressões familiares foram mantidas por sua força no hebraico. Não se incluiu a nota [a], pois 'irmãos' foi preservado literalmente e seu sentido contextual não exige uma alternativa para compreender o versículo.
