  to: E eis que um homem dentre os filhos de Israel veio e trouxe uma mulher midianita[b] para perto de seus irmãos, diante dos olhos de Moisés e diante dos olhos de toda a congregação dos filhos de Israel, enquanto eles choravam à entrada da tenda do encontro.
  rationale: A revisão limita-se a reordenar «uma mulher midianita» e «para perto de seus irmãos» para obter português mais natural e imediatamente claro. Mantêm-se todas as escolhas de fidelidade lexical e de registro do rascunho, bem como a nota [b].
