base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: pt
  text: Elas convidaram o povo para os sacrifícios dos deuses delas; o povo comeu e se prostrou diante dos deuses delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adorou os deuses delas”. O verbo hebraico indica literalmente curvar-se ou prostrar-se, muitas vezes como ato de adoração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: Elas convidaram
  rationale: O qal narrativo na terceira pessoa do plural feminino de קרא, construído com לְ, expressa aqui um convite. O pronome feminino retoma naturalmente as mulheres moabitas do versículo anterior.
- source_word: לָעָם
  choice: o povo
  rationale: Traduz diretamente עָם com artigo. O contexto identifica o povo como Israel, mas o texto hebraico não repete o nome.
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: para os sacrifícios dos deuses delas
  rationale: Preserva a construção de estado construto, “sacrifícios de”, e o sufixo feminino plural. “Delas” evita que “seus” seja entendido como referência ao povo.
- source_word: וַיֹּאכַל
  choice: o povo comeu
  rationale: O verbo está no singular, em concordância com o substantivo coletivo הָעָם. A formulação portuguesa mantém essa concordância e a simplicidade narrativa.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prostrou
  rationale: O verbo descreve concretamente o ato de curvar-se ou prostrar-se, frequentemente como gesto de culto. “Se prostrou” conserva a ação física sem apagar sua evidente dimensão religiosa no contexto.
- source_word: לֵאלֹהֵיהֶן
  choice: diante dos deuses delas
  rationale: A preposição לְ marca o objeto da reverência. Em português, “prostrar-se diante de” é a construção natural; “delas” preserva a referência feminina do sufixo hebraico.
theological_decisions:
- issue: Como representar o ato idólatra expresso por וַיִּשְׁתַּחֲווּ
  choice: se prostrou diante dos deuses delas
  alternative: adorou os deuses delas
  rationale: A tradução principal conserva o gesto corporal explicitado pelo verbo hebraico e permite que seu sentido cultual surja do contexto dos sacrifícios. A nota registra a tradução funcional legítima sem substituir a imagem concreta.
translation_notes:
  register: Português moderno, claro e digno, com concordância singular para o coletivo “o povo”. A repetição de “deuses delas” reproduz a repetição do hebraico e evita a ambiguidade pronominal de “seus deuses”.
