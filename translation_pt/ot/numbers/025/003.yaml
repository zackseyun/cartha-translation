  text: וַ/יִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְ/בַ֣עַל פְּע֑וֹר וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/003.yaml
  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: pt
  text: Assim, Israel se uniu a Baal de Peor[a], e a ira de Yahweh ardeu contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se ligou a Baal-Peor” ou “se atrelou a Baal de Peor”.
    reason: Registra alternativas legítimas para o verbo צמד e para a forma do nome composto, preservando sua imagem de ligação estreita.
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: se uniu a
  rationale: O nifal de צמד expressa união ou ligação estreita. “Se uniu a” preserva o sentido reflexivo e a força da vinculação idólatra sem ampliar indevidamente o texto.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma consagrada do nome nacional em português.
- source_word: לְבַעַל פְּעוֹר
  choice: a Baal de Peor
  rationale: “Baal de Peor” apresenta בעל como nome ou título da divindade local associada a Peor e preserva de modo claro a relação entre os termos.
- source_word: וַיִּחַר אַף
  choice: a ira ... ardeu
  rationale: A expressão hebraica associa a ira ao calor ou ao fogo. “A ira ... ardeu” conserva essa metáfora de maneira natural e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיִשְׂרָאֵל
  choice: contra Israel
  rationale: Com a expressão de ira, a preposição בְּ marca o alvo da ira; “contra Israel” é a formulação idiomática em português.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal mediante transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A metáfora hebraica da ira que arde foi mantida; a ordem da frase acompanha de perto o texto-fonte sem soar artificial.
