  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: pt
  text: E será para ele e para a sua descendência depois dele uma aliança de sacerdócio perpétuo[b], porque ele agiu com zelo por seu Deus[a] e fez expiação pelos filhos de Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teve ciúme por seu Deus”. O verbo hebraico pode expressar tanto zelo quanto ciúme ligado à fidelidade exclusiva da aliança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sacerdócio para sempre”.'
    reason: alternative_reading
  - marker: c
    text: “Filhos de Israel” é a designação nacional hebraica tradicional e se refere ao povo de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: E será
  rationale: Mantém a conjunção e o valor futuro do verbo; o sujeito conceitual é a aliança concedida no contexto.
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: para ele e para a sua descendência depois dele
  rationale: “Descendência” preserva o sentido coletivo singular de זֶרַע, e “depois dele” expressa a continuidade sucessória.
- source_word: בְּרִית
  choice: uma aliança
  rationale: “Aliança” é a tradução corrente e adequada para um compromisso divino dessa natureza.
- source_word: כְּהֻנַּת עוֹלָם
  choice: de sacerdócio perpétuo
  rationale: Expressa o conteúdo da aliança e o caráter duradouro da instituição, sem impor necessariamente uma noção filosófica abstrata de eternidade.
- source_word: תַּחַת אֲשֶׁר
  choice: porque
  rationale: Introduz de modo claro e conciso o fundamento da concessão.
- source_word: קִנֵּא לֵאלֹהָיו
  choice: agiu com zelo por seu Deus
  rationale: É português natural e comunica a dedicação intensa em defesa da honra de Deus; a nuance possível de ciúme de aliança é preservada em nota.
- source_word: וַיְכַפֵּר
  choice: fez expiação
  rationale: Mantém a terminologia acessível e tradicional do contexto sacerdotal e cultual.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: pelos filhos de Israel
  rationale: Preserva a forma masculina da designação nacional hebraica, esclarecida em nota como referência coletiva ao povo.
theological_decisions:
- issue: Sentido de קנא na ação de Fineias
  choice: agiu com zelo por seu Deus
  alternative: teve ciúme por seu Deus
  rationale: O verbo pode indicar tanto zelo ardente quanto ciúme ligado à exclusividade da aliança. A leitura principal prioriza a naturalidade em português, sem eliminar a outra nuance.
- issue: Alcance de עוֹלָם na promessa sacerdotal
  choice: sacerdócio perpétuo
  alternative: sacerdócio para sempre
  rationale: “Perpétuo” comunica continuidade institucional duradoura sem determinar além do texto a natureza metafísica dessa duração.
- issue: Referência de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel
  rationale: A forma do hebraico é mantida no texto, enquanto a nota esclarece que se trata da designação nacional coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura permanece próxima do hebraico, mas “agiu com zelo” evita uma formulação pouco idiomática; as ambiguidades relevantes são conservadas nas notas.
