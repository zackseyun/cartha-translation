source:
  edition: WLC
  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: pt
  text: O nome do homem israelita que foi morto[a], que foi morto com a mulher midianita, era Zimri, filho de Salu, líder de uma casa paterna[b] entre os simeonitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “que foi golpeado, que foi golpeado com a mulher midianita”. O hebraico repete o verbo para dar ênfase; neste contexto, os golpes resultaram em morte.
    reason: lexical_alternative
  - marker: b
    text: “Casa paterna” era uma unidade familiar ou clânica organizada segundo a linhagem do pai dentro da tribo.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: O nome
  rationale: Introduz a identificação do homem mencionado na narrativa anterior. Em português, o artigo definido mantém a ligação discursiva sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: o homem israelita
  rationale: Preserva a referência masculina singular explícita de אִישׁ e expressa naturalmente a identidade nacional.
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: que foi morto, que foi morto
  rationale: O contexto indica morte, e a repetição deliberada das duas formas de נכה é mantida para preservar a ênfase do hebraico.
- source_word: אֶת הַ/מִּדְיָנִית
  choice: com a mulher midianita
  rationale: 'Neste contexto, אֶת após o passivo indica associação: ele foi morto juntamente com ela. O substantivo ''mulher'' torna explícito em português o gênero feminino expresso pela forma hebraica.'
- source_word: זִמְרִי בֶּן סָלוּא
  choice: Zinri, filho de Salu
  rationale: Emprega formas portuguesas tradicionais e reconhecíveis para os nomes próprios, sem lhes atribuir significado interpretativo.
- source_word: נְשִׂיא
  choice: líder
  rationale: Expressa a posição elevada ou representativa sem sugerir indevidamente realeza, como poderia ocorrer com 'príncipe'.
- source_word: בֵית אָב
  choice: casa paterna
  rationale: Preserva o termo social técnico referente a uma unidade familiar ou clânica organizada pela linhagem paterna.
- source_word: לַ/שִּׁמְעֹנִי
  choice: entre os simeonitas
  rationale: Indica de modo natural sua pertença e posição dentro da tribo de Simeão.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção repete “que foi morto” para conservar a ênfase incomum do hebraico, embora a repetição seja marcada em português. “Casa paterna” mantém o termo cultural técnico, esclarecido em nota.
