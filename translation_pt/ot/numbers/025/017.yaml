  text: Harass the Midianites and strike them down,[a]
translation:
  language: pt
  text: Hostilizem os midianitas e golpeiem-nos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Tratem os midianitas como inimigos e ataquem-nos”. O verbo hebraico צָרוֹר pode expressar a ideia de tratar alguém como adversário ou agir com hostilidade contra ele. No hebraico, o primeiro imperativo está no singular e o segundo, no plural; o português usa o plural nos dois para manter uma formulação natural.'
    reason: alternativa lexical e observação gramatical
lexical_decisions:
- source_word: צָרוֹר
  choice: Hostilizem
  rationale: O verbo צרר, aqui com força imperativa, expressa tratar alguém como adversário ou agir com hostilidade contra ele. “Hostilizem” preserva esse sentido amplo sem limitá-lo a uma tática militar específica.
- source_word: הַמִּדְיָנִים
  choice: os midianitas
  rationale: Forma portuguesa tradicional e amplamente reconhecida do gentílico referente ao povo de Midiã.
- source_word: וְהִכִּיתֶם
  choice: e golpeiem-nos
  rationale: O hifil de נכה pode significar golpear, ferir ou derrotar. “Golpeiem-nos” conserva a violência explícita do verbo sem especificar necessariamente morte ou vitória completa.
- source_word: אוֹתָם
  choice: -nos
  rationale: Pronome de objeto direto que retoma “os midianitas”, expresso naturalmente pela forma enclítica portuguesa.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Partícula hebraica que marca o objeto direto definido; sua função é representada pela sintaxe portuguesa.
theological_decisions:
- issue: Como traduzir uma ordem divina de hostilidade e violência sem suavizá-la nem ampliá-la
  choice: Hostilizem os midianitas e golpeiem-nos
  alternative: Tratem os midianitas como inimigos e ataquem-nos
  rationale: 'O hebraico apresenta duas ordens diretas: uma de hostilidade contínua e outra de ação violenta. A tradução mantém a severidade do texto sem acrescentar justificativas teológicas nem tornar o segundo verbo especificamente uma ordem de matar.'
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Hostilizem” reproduz a ordem de inimizade sem a possível estreiteza tática de “fustiguem”; “golpeiem-nos” mantém a força física de נכה e evita tanto o abrandamento de “derrotem” quanto a especificidade excessiva de “matem”.
