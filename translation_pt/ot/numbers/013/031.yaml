base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: pt
  text: 'Mas os homens que tinham subido com ele disseram: “Não podemos subir contra esse povo, porque ele é mais forte do que nós.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Mas os homens
  rationale: A conjunção introduz contraste com a declaração de Calebe no contexto anterior; “mas” expressa naturalmente essa função discursiva, e “os homens” preserva o substantivo concreto.
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: que tinham subido com ele
  rationale: O mais-que-perfeito composto deixa claro que a subida ocorreu antes da fala e identifica os companheiros de Calebe.
- source_word: לֹא נוּכַל לַעֲלוֹת
  choice: Não podemos subir
  rationale: Preserva tanto a ideia explícita de incapacidade em יכל quanto o sentido básico de עלה, “subir”, enquanto o contexto comunica o avanço militar.
- source_word: אֶל הָעָם
  choice: contra esse povo
  rationale: Embora אֶל costume significar “a/para”, aqui o contexto de confronto militar pede “contra”. O demonstrativo “esse” remete com naturalidade ao povo mencionado no relatório.
- source_word: כִּי חָזָק הוּא מִמֶּנּוּ
  choice: porque ele é mais forte do que nós
  rationale: Mantém o singular gramatical do hebraico, no qual o pronome retoma o substantivo coletivo “povo”, e preserva a comparação expressa por מִן.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o singular coletivo do hebraico (“esse povo... ele”) sem perder naturalidade e mantém “subir” em vez de explicitar “atacar”, preservando a imagem e o valor contextual do verbo original.
