translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura conserva a sequência narrativa hebraica, mas emprega construções naturais como “comunidade” e “lhes mostraram”. O marcador da nota foi colocado junto à expressão que ela esclarece.
