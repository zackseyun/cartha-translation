base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: pt
  text: Eles foram e chegaram a Moisés, a Arão e a toda a comunidade dos filhos de Israel[a], no deserto de Parã, em Cades. Apresentaram um relato a eles e a toda a comunidade e lhes mostraram o fruto da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a comunidade dos israelitas”. O hebraico diz literalmente “a comunidade dos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Eles foram e chegaram
  rationale: Preserva os dois verbos coordenados da sequência narrativa hebraica, distinguindo o deslocamento da chegada, sem tornar a frase incompreensível em português.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: a comunidade dos filhos de Israel
  rationale: “Comunidade” expressa naturalmente עֵדָה no português atual, enquanto “filhos de Israel” mantém a forma concreta do hebraico; a alternativa mais idiomática aparece em nota.
- source_word: מִדְבַּר פָּארָן
  choice: o deserto de Parã
  rationale: “Deserto” é uma tradução corrente e clara de מִדְבָּר neste contexto geográfico e preserva o nome próprio Parã.
- source_word: קָדֵשָׁה
  choice: em Cades
  rationale: Embora a terminação direcional possa ser vertida por “até Cades”, o contexto apresenta Cades como o local da chegada; “em Cades” é natural e preserva essa relação locativa.
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: Trouxeram um relato a eles
  rationale: A expressão hebraica descreve a devolução de uma palavra ou informação após a missão. “Trouxeram um relato” comunica esse sentido em português atual sem reduzir דָּבָר a mera fala casual.
- source_word: וְאֶת כָּל הָעֵדָה
  choice: e a toda a comunidade
  rationale: Repõe em português a relação exigida pelo verbo e mantém “comunidade” de modo coerente com a ocorrência anterior de עֵדָה.
- source_word: וַיַּרְאוּם
  choice: lhes mostraram
  rationale: 'Traduz diretamente o valor causativo do hifil de ראה: fazer ver, mostrar.'
- source_word: פְּרִי הָאָרֶץ
  choice: o fruto da terra
  rationale: Mantém a imagem concreta do hebraico e se ajusta ao contexto imediato, no qual os enviados exibem aquilo que a terra produzia.
