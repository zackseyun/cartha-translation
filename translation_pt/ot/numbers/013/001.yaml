  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também transliterado “Javé”.'
    reason: Esclarece a forma hebraica do nome divino e registra uma transliteração alternativa corrente em português.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, na forma narrativa com waw consecutivo, apresenta o ato de fala e preserva sua distinção em relação a אמר, representado em seguida por “dizendo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título como “SENHOR”.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “falou a Moisés” é uma construção clara e corrente em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz a fórmula hebraica que introduz o conteúdo do discurso e mantém a distinção lexical entre דבר e אמר.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz diretamente o nome divino. “Yahweh” preserva sua função de nome próprio e sua forma transliterada, sem substituí-lo por um título; a nota registra a forma portuguesa alternativa.
translation_notes:
  register: Português moderno, claro e digno. A estrutura “falou... dizendo” conserva a fórmula hebraica e sua distinção verbal, enquanto os dois-pontos sinalizam naturalmente que o discurso vem a seguir.
