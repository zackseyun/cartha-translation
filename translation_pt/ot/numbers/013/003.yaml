source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: pt
  text: Assim, Moisés os enviou do deserto de Parã, por ordem de Yahweh[a]. Todos eles eram homens, chefes dos filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a palavra de Yahweh”. Literalmente, “sobre a boca de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “líderes dos israelitas”. Hebraico: “chefes dos filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: O verbo narrativo שׁלח descreve uma ação passada; “enviou” é a equivalência portuguesa natural e concisa.
- source_word: מִמִּדְבַּר פָּארָן
  choice: do deserto de Parã
  rationale: מִדְבָּר designa uma região erma ou não cultivada; “deserto” é corrente e mantém o estilo geográfico bíblico. פָּארָן é transliterado como Parã.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: A expressão idiomática, literalmente “sobre a boca de Yahweh”, indica conformidade com uma ordem ou determinação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כֻּלָּם אֲנָשִׁים
  choice: Todos eles eram homens
  rationale: Preserva tanto a totalidade enfatizada por כֻּלָּם quanto a referência masculina de אֲנָשִׁים neste contexto.
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: chefes dos filhos de Israel
  rationale: “Chefes” comunica o sentido de רָאשֵׁי e “filhos de Israel” conserva a expressão familiar e pactual do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; “Yahweh” preserva essa função e reflete uma transliteração amplamente aceita.
- issue: Linguagem masculina em אֲנָשִׁים e בְנֵי יִשְׂרָאֵל
  choice: homens ... filhos de Israel
  alternative: líderes dos israelitas
  rationale: O contexto identifica representantes tribais masculinos. A formulação principal mantém essa informação e a imagem familiar hebraica, enquanto a nota oferece a equivalência portuguesa mais fluente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações acompanha o hebraico sem rigidez; “Assim” liga o versículo ao comando anterior. As notas preservam o idioma concreto hebraico e registram alternativas naturais.
