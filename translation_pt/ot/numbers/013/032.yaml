revisions:
- from: 'Então eles espalharam entre os filhos de Israel[c] um relato negativo[a] sobre a terra que haviam explorado[b], dizendo: “A terra pela qual passamos para explorá-la é uma terra que devora os seus habitantes[d], e todo o povo que vimos nela era composto de homens de grande porte[e]”.'
  to: 'Então eles divulgaram aos filhos de Israel[c] um relato desfavorável[a] acerca da terra que haviam explorado[b], dizendo: “A terra pela qual passamos para explorá-la é uma terra que devora os seus habitantes[d], e todo o povo que vimos nela consistia de homens de grande porte[e].”'
  rationale: A revisão restitui a relação direcional de אֶל com «aos filhos de Israel», substitui uma expressão algo genérica por «divulgaram ... um relato desfavorável», que reproduz bem o idiomatismo וַיּוֹצִיאוּ דִּבַּת, e torna a cláusula final mais direta, sem acrescentar explicação. As notas foram mantidas e a nota b foi ajustada para corresponder às duas formas verbais ancoradas.
