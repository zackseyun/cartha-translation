  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: pt
  text: 'Então eles divulgaram aos filhos de Israel[c] um relato desfavorável[a] acerca da terra que haviam explorado[b], dizendo: “A terra pela qual passamos para explorá-la é uma terra que devora os seus habitantes[d], e todo o povo que vimos nela consistia de homens de grande porte[e].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram circular um relato ruim”; em sentido mais forte, “difamaram a terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “espiar” / “ter espiado”, ou “reconhecer” / “ter reconhecido”.'
    reason: lexical_alternative
  - marker: c
    text: “Filhos de Israel” é a expressão hebraica e uma designação coletiva tradicional do povo de Israel.
    reason: cultural_note
  - marker: d
    text: 'Ou: “uma terra que consome os seus habitantes”.'
    reason: lexical_alternative
  - marker: e
    text: 'Ou: “homens de grande estatura”, referindo-se aqui ao tamanho físico impressionante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: espalharam ... um relato negativo
  rationale: A combinação idiomática significa fazer sair ou circular um relato desfavorável. “Espalharam ... um relato negativo” é natural em português, preserva a ideia de divulgação e evita afirmar no texto principal, de modo inequívoco, a acusação mais forte de calúnia.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: “Terra” é a equivalência corrente e adequada ao contexto geográfico e pactual da narrativa.
- source_word: תָּרוּ / לָתוּר
  choice: haviam explorado / para explorá-la
  rationale: O verbo denota percorrer uma região para examiná-la. “Explorar” é claro e não limita a ação à espionagem, embora “espiar” e “reconhecer” sejam alternativas possíveis.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a forma hebraica da designação coletiva do povo e usa “entre” de modo natural com o verbo português “espalhar”.
- source_word: עָבַרְנוּ בָהּ
  choice: pela qual passamos
  rationale: Reproduz de modo idiomático o movimento expresso pelo verbo עבר com a preposição.
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: uma terra que devora os seus habitantes
  rationale: “Devora” conserva a imagem vívida e ameaçadora do particípio hebraico, sem explicar como a terra faria isso.
- source_word: וְכָל הָעָם אֲשֶׁר רָאִינוּ בְתוֹכָהּ
  choice: e todo o povo que vimos nela
  rationale: Mantém o substantivo coletivo “povo” e traduz בְתוֹכָהּ de maneira concisa e natural como “nela”.
- source_word: אַנְשֵׁי מִדּוֹת
  choice: homens de grande porte
  rationale: A expressão indica dimensões físicas impressionantes. “Grande porte” comunica isso com clareza e evita que “estatura” seja entendida figuradamente como prestígio.
theological_decisions:
- issue: Expressão coletiva marcada por gênero בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução conserva a forma explicitamente masculina do hebraico e sua função como designação coletiva tradicional do povo, sem restringir artificialmente a referência apenas aos homens.
- issue: Caráter retórico de אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: terra que devora os seus habitantes
  alternative: terra que consome os seus habitantes
  rationale: A imagem é mantida sem decidir se a declaração deve ser entendida literalmente, como hipérbole ou como parte do relato difamatório dos exploradores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente ajustada para soar natural, enquanto as imagens fortes, a designação “filhos de Israel” e a possível gradação entre relato negativo e difamação foram preservadas.
