base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: pt
  text: Vejam como é a terra[a] e se o povo que habita nela é forte ou fraco, pouco ou numeroso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “o que ela é”. A expressão pede uma avaliação das características ou condições da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Vejam
  rationale: O verbo ראה introduz uma instrução dirigida ao grupo enviado. “Vejam” é claro e natural, incluindo no contexto a ideia de observar e avaliar.
- source_word: הָאָרֶץ מַה הִוא
  choice: como é a terra
  rationale: A expressão pergunta pela natureza ou condição da terra, não por sua identidade. “Como é a terra” conserva esse sentido avaliativo em português corrente.
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: o povo que habita nela
  rationale: Embora עָלֶיהָ seja literalmente “sobre ela”, a construção descreve quem reside na terra. “Habita nela” é idiomático em português e mantém a ideia de residência.
- source_word: הֶחָזָק
  choice: forte
  rationale: חזק denota força ou poder; “forte” é a equivalência direta e adequada à avaliação do povo.
- source_word: הֲרָפֶה
  choice: fraco
  rationale: רפה contrasta aqui com חזק e indica falta de força. “Fraco” reproduz claramente a oposição.
- source_word: הַמְעַט
  choice: pouco
  rationale: O termo indica pequena quantidade e se refere coletivamente a “povo”. Em português, “o povo é pouco” preserva a construção quantitativa sem transformar o referente em indivíduos.
- source_word: רָב
  choice: numeroso
  rationale: רָב contrasta com הַמְעַט e indica grande número. “Numeroso” é natural com o substantivo coletivo “povo” e torna inequívoco o sentido quantitativo.
- source_word: אִם
  choice: ou
  rationale: Na pergunta indireta alternativa, אִם introduz o segundo termo da oposição. Em português, a sequência “se... forte ou fraco, pouco ou numeroso” expressa naturalmente essa estrutura.
