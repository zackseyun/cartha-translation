lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: da tribo de
  rationale: Neste elenco de representantes, a preposição לְ com מַטֶּה introduz a tribo representada pelo homem nomeado. “Da tribo de” é natural em português e expressa adequadamente essa associação.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida em português para o nome tribal.
- source_word: יִגְאָל
  choice: Igal
  rationale: Transliteração corrente em Bíblias portuguesas, clara e próxima da forma hebraica.
- source_word: בֶּן
  choice: filho de
  rationale: Na identificação genealógica בֶּן יוֹסֵף, o sentido direto é “filho de”; o contexto não exige a acepção mais ampla de “descendente de”.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
