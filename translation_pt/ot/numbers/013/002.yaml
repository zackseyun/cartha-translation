id: NUM.13.2
reference: Numbers 13:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׁלַח לְ/ךָ֣ אֲנָשִׁ֗ים וְ/יָתֻ֨רוּ֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר אֲנִ֥י נֹתֵ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְ/מַטֵּ֤ה אֲבֹתָי/ו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: pt
  text: Envie homens[a] para explorar[b] a terra de Canaã, que eu estou dando aos filhos de Israel[c]. Vocês enviarão um homem de cada tribo de seus antepassados[d], cada um deles um líder entre os seus[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico acrescenta literalmente “para você”. A expressão pode indicar interesse pessoal, autorização ou simples ênfase.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “reconhecer”, “inspecionar” ou “espiar”.
    reason: lexical_alternative
  - marker: c
    text: “Filhos de Israel” é uma expressão hebraica tradicional para o povo de Israel como um todo.
    reason: cultural_note
  - marker: d
    text: 'Hebraico: “tribo de seus pais”, isto é, sua tribo ancestral.'
    reason: cultural_note
  - marker: e
    text: O termo hebraico também pode significar “chefe” ou “príncipe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: Envie homens[a]
  rationale: O imperativo singular é traduzido diretamente. O dativo לְךָ não recebe uma equivalência rígida no corpo do texto, pois expressões como “para você” ou “por sua conta” soariam pouco naturais ou definiriam em excesso sua nuance; a nota preserva sua presença e ambiguidade.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O substantivo masculino plural designa aqui os representantes masculinos escolhidos entre as tribos.
- source_word: וְיָתֻרוּ
  choice: para explorar
  rationale: Neste contexto, תור indica percorrer a terra para conhecê-la e avaliá-la. “Explorar” é corrente e mantém aberto o componente de reconhecimento, sem limitar o sentido a espionagem.
- source_word: אֶרֶץ כְּנַעַן
  choice: a terra de Canaã
  rationale: Reproduz naturalmente em português a construção hebraica e mantém explícito אֶרֶץ, “terra”.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: que eu estou dando
  rationale: A forma participial apresenta a dádiva divina como ação em curso ou já encaminhada.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a expressão familiar e pactual do hebraico, que designa coletivamente o povo de Israel.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: um homem de cada
  rationale: A repetição hebraica tem força distributiva. A formulação portuguesa comunica essa distribuição sem artificialidade.
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: tribo de seus antepassados
  rationale: מַטֶּה significa “tribo” neste contexto, e אֲבֹתָיו aponta para a linhagem ancestral. “Antepassados” comunica essa relação em português atual.
- source_word: תִּשְׁלָחוּ
  choice: Vocês enviarão
  rationale: O imperfeito plural tem força instrutiva. O pronome explícito conserva a mudança do singular no primeiro imperativo para o plural nesta oração.
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: cada um deles um líder entre os seus
  rationale: נָשִׂיא pode significar líder, chefe ou príncipe. “Líder” é claro e adequado para representantes reconhecidos dentro de seus respectivos grupos.
theological_decisions:
- issue: Nuance de לְךָ na ordem divina
  choice: Não fixar uma interpretação no corpo do versículo; registrar a expressão na nota [a]
  alternative: Traduzir “envie para você”, “envie por sua conta” ou omitir qualquer indicação
  rationale: O dativo pode marcar interesse pessoal, autorização ou ênfase idiomática. A nota mantém essa tensão sem impor uma leitura específica nem produzir português obscuro.
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha conserva a forma familiar e coletiva da expressão hebraica, sem sugerir que somente homens estejam incluídos no povo que receberá a terra.
- issue: Mudança de número entre שְׁלַח e תִּשְׁלָחוּ
  choice: Conservar a passagem de “Envie” (singular) para “Vocês enviarão” (plural)
  alternative: Uniformizar ambos os verbos no singular ou no plural
  rationale: A mudança está no hebraico e pode refletir a ordem dirigida primeiro a Moisés e depois a um grupo participante. A tradução não elimina essa possível distinção.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O texto evita arcaísmos, conserva a expressão pactual “filhos de Israel” e mantém visível a mudança do singular para o plural nos verbos de envio.
