base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: pt
  text: E como é a terra em que esse povo habita? É boa ou ruim? E como são as cidades em que ele habita? São acampamentos ou lugares fortificados?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em acampamentos ... em fortalezas». O hebraico contrasta assentamentos semelhantes a acampamentos com lugares fortificados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: E como é a terra
  rationale: O interrogativo pergunta pela natureza ou condição da terra; «como é» comunica isso de modo natural em português.
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: em que esse povo habita
  rationale: O hebraico usa o singular com sentido coletivo para os habitantes mencionados no contexto. «Esse povo» torna o referente claro sem alterar o sentido coletivo.
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: É boa ou ruim?
  rationale: Preserva a avaliação ampla dos adjetivos hebraicos, sem restringi-la indevidamente à fertilidade.
- source_word: וּמָה הֶעָרִים
  choice: E como são as cidades
  rationale: «Cidades» é o equivalente comum de עָרִים, e «como são» expressa naturalmente a pergunta sobre sua condição.
- source_word: אֲשֶׁר הוּא יוֹשֵׁב בָּהֵנָּה
  choice: em que ele habita
  rationale: Mantém o singular coletivo do hebraico; o antecedente explícito «esse povo» permite que «ele» seja compreendido naturalmente.
- source_word: הַבְּמַחֲנִים
  choice: em acampamentos
  rationale: מַחֲנִים designa acampamentos ou assentamentos semelhantes a acampamentos, em contraste com lugares defendidos.
- source_word: בְּמִבְצָרִים
  choice: em lugares fortificados
  rationale: מִבְצָרִים refere-se a locais protegidos por fortificações; a formulação é clara e preserva o contraste militar-defensivo.
theological_decisions: []
