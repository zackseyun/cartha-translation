  text: from the tribe of Benjamin[a], Palti son of Raphu.
translation:
  language: pt
  text: da tribo de Benjamim[a], Palti, filho de Rafu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a tribo de Benjamim” ou “pertencente à tribo de Benjamim”. A construção hebraica indica afiliação tribal nesta lista.
