lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: da tribo de
  rationale: Neste contexto de uma lista de representantes, a construção com לְ e מַטֶּה indica a tribo à qual o homem nomeado pertence. “Da tribo de” é natural em português e mantém a relação de afiliação.
- source_word: בִנְיָמִן
  choice: Benjamim
  rationale: Nome próprio de pessoa e de tribo, empregado em sua forma tradicional e amplamente reconhecida em português.
- source_word: פַּלְטִי
  choice: Palti
  rationale: Nome próprio transliterado de modo direto do hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente natural da construção genealógica hebraica, adequado ao estilo conciso da lista.
- source_word: רָפוּא
  choice: Rafu
  rationale: Transliteração direta do nome hebraico, ajustada à ortografia e à pronúncia naturais do português.
