  text: from the tribe of Ephraim[a], Hoshea son of Nun[b];
translation:
  language: pt
  text: da tribo de Efraim, Oseias, filho de Num.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este Oseias é o homem a quem Moisés deu mais tarde o nome de Josué (ver Números 13:16).
    reason: cross_reference
lexical_decisions:
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Neste elenco de representantes, a preposição לְ com מַטֶּה identifica a tribo à qual o homem pertence ou que representa. “Da tribo de” é natural em português e preserva essa relação.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: הוֹשֵׁעַ
  choice: Oseias
  rationale: Transliteração tradicional portuguesa deste nome hebraico. Aqui designa o homem que mais tarde recebe o nome de Josué, e não o profeta homônimo.
- source_word: בִּן
  choice: filho de
  rationale: Equivalente direto e natural da construção genealógica hebraica.
- source_word: נוּן
  choice: Num
  rationale: Forma tradicional do nome próprio em traduções portuguesas da Bíblia.
