  text: from the tribe of Naphtali[a], Nahbi the son of Vophsi;
translation:
  language: pt
  text: da tribo de Naftali, Naabi, filho de Vofsi[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Vafsi”. As transliterações deste nome hebraico variam.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Neste elenco de representantes, a preposição לְ com מַטֶּה indica a vinculação tribal. “Da tribo de” é natural em português e preserva a concisão do hebraico.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Forma portuguesa corrente do nome próprio da tribo.
- source_word: נַחְבִּי
  choice: Naabi
  rationale: Transliteração portuguesa corrente do nome hebraico, representando a consoante gutural ח por meio do hiato vocálico tradicional.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente direto e idiomático da construção genealógica hebraica.
- source_word: וָפְסִי
  choice: Vofsi
  rationale: Forma tradicional e reconhecível em português; “Vafsi” permanece uma transliteração possível da vocalização massorética e é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, conciso e digno, adequado ao formato de lista. Mantém a estrutura fragmentária do versículo no contexto e usa formas de nomes familiares ao leitor lusófono. O marcador da nota foi colocado após “Vofsi”, o nome ao qual a variante se refere.
