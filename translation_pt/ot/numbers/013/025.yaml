base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/025.yaml
  text: They returned from scouting out the land at the end of forty days[a].
translation:
  language: pt
  text: Ao fim de quarenta dias, eles voltaram de explorar a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de reconhecer a terra” ou “de espionar a terra”. O verbo hebraico se refere a examinar o território numa missão de reconhecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻבוּ
  choice: eles voltaram
  rationale: O qal wayyiqtol de שׁוב dá continuidade à narrativa. Em português, a sequência é expressa naturalmente sem traduzir de modo obrigatório o וַ por “e”.
- source_word: מִתּוּר
  choice: de reconhecer
  rationale: O infinitivo construto de תור com מִן indica o retorno de uma atividade de exame ou exploração. “Reconhecer” comunica aqui uma missão de reconhecimento do território sem a conotação necessariamente hostil de “espionar”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Neste contexto, אֶרֶץ designa o território que os homens foram examinar; “a terra” preserva a formulação contextual e tradicional.
- source_word: מִקֵּץ
  choice: Ao fim de
  rationale: A expressão idiomática מִן + קֵץ marca o término de um período. “Ao fim de” conserva essa relação temporal com clareza.
- source_word: אַרְבָּעִים יוֹם
  choice: quarenta dias
  rationale: A construção hebraica usa o substantivo singular após o numeral, enquanto o português idiomático exige o plural.
