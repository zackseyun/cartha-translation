base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: pt
  text: Contudo, o povo que habita na terra é forte, e as cidades são fortificadas e muito grandes; também vimos ali os descendentes de Anaque[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os filhos de Anaque». A expressão hebraica se refere aos descendentes de Anaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: Contudo
  rationale: A expressão introduz uma forte ressalva ao relato positivo do versículo anterior; «Contudo» preserva com naturalidade sua força adversativa.
- source_word: עַז
  choice: forte
  rationale: Descreve o poder ou caráter formidável do povo sem acrescentar a ideia de ferocidade ou hostilidade.
- source_word: הָעָם הַיֹּשֵׁב בָּאָרֶץ
  choice: o povo que habita na terra
  rationale: Reproduz naturalmente a construção participial e mantém um registro narrativo digno e acessível.
- source_word: בְּצֻרוֹת
  choice: fortificadas
  rationale: Expressa a proteção militar das cidades de modo mais abrangente que «muradas».
- source_word: גְּדֹלֹת מְאֹד
  choice: muito grandes
  rationale: Preserva tanto a descrição do tamanho das cidades quanto a intensificação de מְאֹד.
- source_word: וְגַם
  choice: também
  rationale: Marca o acréscimo de outro detalhe alarmante, com sintaxe natural em português.
- source_word: יְלִדֵי הָעֲנָק
  choice: os descendentes de Anaque
  rationale: A expressão construta indica linhagem; «descendentes» comunica esse sentido claramente, enquanto «filhos» permanece como alternativa mais literal em nota.
- source_word: רָאִינוּ שָׁם
  choice: vimos ali
  rationale: O passado simples é adequado ao relato, e «ali» mantém a indicação enfática do lugar.
theological_decisions: []
