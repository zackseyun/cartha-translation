base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: pt
  text: e se a terra é fértil ou pobre, se nela há árvores[a] ou não. Sejam fortes e peguem alguns dos frutos da terra”. Era a época das primeiras uvas maduras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “se nela há madeira ou não”; a palavra hebraica pode significar “árvore” ou “madeira”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os dias eram os dias das primeiras uvas maduras”, isto é, o começo da época da colheita das uvas.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: fértil ou pobre
  rationale: Os adjetivos significam literalmente “gorda” e “magra”. Aplicados à terra, descrevem sua produtividade; “fértil ou pobre” transmite esse contraste em português natural.
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: se nela há árvores ou não
  rationale: עֵץ pode designar árvore ou madeira. “Árvores” é a leitura mais direta na descrição das características da terra, sem eliminar a alternativa lexical, registrada em nota.
- source_word: וְהִתְחַזַּקְתֶּם
  choice: Sejam fortes
  rationale: Mantém de perto a exortação reflexiva/intensiva do verbo, entendida como chamado à firmeza e à coragem para cumprir a tarefa.
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: peguem alguns dos frutos da terra
  rationale: A preposição מִן indica uma parte dos frutos. “Peguem alguns” preserva o sentido sem explicitar que deveriam trazê-los de volta, embora isso seja inferido pelo contexto.
- source_word: וְהַיָּמִים יְמֵי בִּכּוּרֵי עֲנָבִים
  choice: Naquele tempo, começavam a amadurecer as primeiras uvas
  rationale: Expressa com naturalidade a nota temporal hebraica e o início da época de maturação das uvas, enquanto a formulação literal é preservada em nota.
