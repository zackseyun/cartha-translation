base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: pt
  text: 'Então Calebe fez o povo calar-se diante de Moisés[a] e disse: “Subamos, sim[b], e tomemos posse dela, pois certamente somos capazes de conquistá-la[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “silenciou o povo diante de Moisés”. O verbo hebraico pode significar fazer ficar quieto, acalmar ou silenciar.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “subir, subiremos”, uma construção enfática.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pois sem dúvida prevaleceremos contra ela”. O pronome se refere à terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: fez o povo calar-se
  rationale: O verbo descreve fazer uma multidão ficar quieta. A formulação é natural em português e mantém a ação causativa sem sugerir necessariamente repressão severa.
- source_word: אֶת־הָעָם
  choice: o povo
  rationale: עם designa aqui a comunidade israelita reunida; “o povo” é a forma corrente e adequada ao contexto.
- source_word: אֶל־מֹשֶׁה
  choice: diante de Moisés
  rationale: Embora אֶל normalmente indique direção, neste contexto a expressão situa a ação na presença de Moisés; “diante de Moisés” preserva essa relação sem afirmar que Calebe silenciou o povo para que ouvisse Moisés.
- source_word: עָלֹה נַעֲלֶה
  choice: Subamos, sim
  rationale: O infinitivo absoluto seguido do verbo conjugado dá forte ênfase. “Subamos, sim” comunica determinação sem acrescentar a ideia temporal de “agora” ou “imediatamente”.
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: e tomemos posse dela
  rationale: ירשׁ, no contexto da entrada na terra, indica assumir sua posse. A tradução conserva o referente feminino, a terra, e a dimensão ativa da ocupação.
- source_word: כִּי יָכוֹל נוּכַל
  choice: pois certamente somos capazes
  rationale: A segunda construção com infinitivo absoluto é enfática; “certamente” reproduz a confiança vigorosa expressa por Calebe.
- source_word: לָהּ
  choice: de conquistá-la
  rationale: O pronome feminino retoma a terra. Como “somos capazes dela” não é natural em português, o complemento explicita de modo contextual a capacidade de tomar a terra, embora “prevalecer contra ela” também seja possível.
theological_decisions:
- issue: Natureza da capacidade afirmada por Calebe
  choice: certamente somos capazes de conquistá-la
  alternative: certamente poderemos vencê-la
  rationale: O texto ressalta enfaticamente a capacidade em relação à terra, sem explicar neste versículo se essa capacidade é humana, divina ou ambas. A tradução mantém a afirmação confiante sem inserir uma explicação teológica ausente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As duas construções enfáticas do hebraico foram distinguidas naturalmente por “sim” e “certamente”. Os marcadores seguem a ordem em que aparecem no texto.
