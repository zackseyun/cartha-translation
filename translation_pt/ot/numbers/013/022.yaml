base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: pt
  text: Eles subiram pelo Neguebe, e ele chegou até Hebrom. Ali estavam Aimã, Sesai e Talmai, descendentes de Anaque. Hebrom havia sido construída sete anos antes de Zoã, no Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: pelo Neguebe
  rationale: Mantém o topônimo regional hebraico e expressa naturalmente o percurso pela região.
- source_word: וַיָּבֹא
  choice: e ele chegou
  rationale: Preserva a mudança genuína do plural para o singular no texto massorético, sem a harmonizar silenciosamente.
- source_word: יְלִידֵי הָעֲנָק
  choice: descendentes de Anaque
  rationale: Comunica a relação de linhagem indicada pela expressão hebraica, em português corrente.
- source_word: נִבְנְתָה לִפְנֵי
  choice: havia sido construída ... antes de
  rationale: Expressa a anterioridade temporal da construção de Hebrom em relação a Zoã.
- source_word: צֹעַן מִצְרָיִם
  choice: Zoã, no Egito
  rationale: Identifica a cidade e explicita com naturalidade sua localização indicada pelo hebraico.
theological_decisions:
- issue: Mudança de número verbal entre וַיַּעֲלוּ e וַיָּבֹא
  choice: Eles subiram ... e ele chegou
  alternative: Eles subiram ... e chegaram
  rationale: A tradução conserva a tensão gramatical do texto hebraico recebido em vez de harmonizá-la com o sujeito plural ou com versões antigas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e topônimos em formas correntes. A anomalia singular/plural do hebraico foi preservada deliberadamente.
