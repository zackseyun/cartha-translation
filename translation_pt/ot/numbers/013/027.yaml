base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: pt
  text: 'Eles lhe relataram e disseram: “Entramos na terra para a qual você nos enviou. De fato, ela mana leite e mel, e este é o seu fruto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפְּרוּ לוֹ וַיֹּאמְרוּ
  choice: Eles lhe deram o relatório, dizendo
  rationale: O piel de ספר indica relatar ou contar. A formulação evita a redundância pouco natural de “relataram... e disseram”, sem perder a ideia de que apresentaram oralmente seu relatório.
- source_word: בָּאנוּ אֶל הָאָרֶץ
  choice: Entramos na terra
  rationale: בוא pode significar vir ou entrar; neste contexto, “entramos” expressa naturalmente a chegada dos enviados ao interior da terra.
- source_word: אֲשֶׁר שְׁלַחְתָּנוּ
  choice: para a qual você nos enviou
  rationale: Preserva a oração relativa e a noção de destino, em português claro e digno.
- source_word: וְגַם
  choice: De fato
  rationale: A expressão confirma enfaticamente a abundância da terra. “De fato” comunica essa força sem acrescentar uma conclusão além do hebraico.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: mana leite e mel
  rationale: A expressão hebraica descreve fertilidade e abundância. “Manar leite e mel” conserva a imagem tradicional e é compreensível em português.
- source_word: וְזֶה פִּרְיָהּ
  choice: e este é o seu fruto
  rationale: Tradução direta que mantém o demonstrativo, provavelmente acompanhado da apresentação visível do fruto como prova.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tratamento “você” oferece clareza contemporânea na fala dirigida a Moisés; o tom permanece digno. Não foi necessária nota textual ou teológica.
