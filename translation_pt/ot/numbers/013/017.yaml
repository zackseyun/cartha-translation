base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: pt
  text: 'Moisés os enviou para explorar a terra de Canaã[a] e lhes disse: “Subam por aqui, pelo Neguebe[b], e subam à região montanhosa[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fazer o reconhecimento da terra de Canaã” ou “para espionar a terra de Canaã”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o Neguebe”, a região árida do sul.'
    reason: cultural_note
  - marker: c
    text: 'Ou: “às montanhas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Verbo narrativo comum de שׁלח; “enviou” é natural e preserva diretamente a ação de Moisés.
- source_word: לָתוּר
  choice: para explorar
  rationale: תור indica percorrer e examinar a terra em missão de reconhecimento. “Explorar” comunica isso em português corrente sem impor necessariamente a ideia clandestina de espionagem.
- source_word: אֶרֶץ כְּנָעַן
  choice: a terra de Canaã
  rationale: Preserva de modo natural a expressão hebraica que designa o território de Canaã.
- source_word: עֲלוּ זֶה
  choice: Subam por aqui
  rationale: O imperativo de עלה mantém a ideia de subida, enquanto זֶה tem provável força adverbial, indicando a rota.
- source_word: בַּנֶּגֶב
  choice: pelo Neguebe
  rationale: נֶגֶב funciona aqui como nome geográfico da região árida meridional; “pelo” expressa naturalmente a indicação de rota sem definir em excesso se o movimento é para dentro ou através da região.
- source_word: וַעֲלִיתֶם
  choice: e depois subam
  rationale: Embora formalmente seja uma forma verbal com waw, no encadeamento das instruções continua o valor diretivo; “depois” torna clara a sequência em português.
- source_word: הָהָר
  choice: à região montanhosa
  rationale: Neste contexto, הָהָר designa a zona elevada ou montanhosa, não necessariamente uma única montanha.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Explorar” evita uma conotação clandestina excessiva, preservando em nota as alternativas. A ordem dos marcadores segue sua primeira ocorrência no texto.
