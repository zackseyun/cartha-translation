base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/011.yaml
  text: 'from the tribe of Joseph[a], from the tribe of Manasseh: Gaddi son of Susi.'
translation:
  language: pt
  text: 'da tribo de José, da tribo de Manassés: Gadi, filho de Susi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Neste contexto de lista, a construção com לְ identifica a afiliação tribal do representante. “Da tribo de” é natural em português e preserva o sentido.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: da tribo de Manassés
  rationale: Mantém a repetição do hebraico e esclarece que Manassés é o ramo específico de José indicado neste versículo.
- source_word: גַּדִּי
  choice: Gadi
  rationale: Transliteração portuguesa simples do nome hebraico, com uma só consoante medial, pois o dígito não precisa ser representado na grafia portuguesa.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente genealógico direto e idiomático em português.
- source_word: סוּסִי
  choice: Susi
  rationale: Transliteração natural do nome hebraico para o português.
