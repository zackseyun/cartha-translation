lexical_decisions:
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: מַטֶּה, nesta lista de representantes tribais, significa “tribo”. A preposição לְ introduz a vinculação de cada representante à respectiva tribo; “da tribo de” é natural em português e preserva a função da expressão no contexto.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do patriarca e da tribo.
- source_word: שָׁפָט
  choice: Safate
  rationale: Transliteração adaptada à fonologia e à tradição ortográfica bíblica em português.
- source_word: בֶּן
  choice: filho de
  rationale: Expressa diretamente a relação filial usada na identificação genealógica hebraica.
- source_word: חוֹרִי
  choice: Hori
  rationale: Transliteração clara do nome próprio hebraico, mantendo o h inicial tradicional.
