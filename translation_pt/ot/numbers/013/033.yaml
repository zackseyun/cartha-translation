  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: pt
  text: E ali vimos os nefilins — os filhos de Anaque[a], oriundos dos nefilins — e, aos nossos próprios olhos, parecíamos gafanhotos; e assim também parecíamos aos olhos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, «gigantes», em lugar de «nefilins». O sentido exato do termo hebraico é incerto; por isso, ele foi transliterado no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: os nefilins
  rationale: Mantém transliterado o termo hebraico de referência incerta, sem impor as interpretações tradicionais «gigantes» ou «caídos».
- source_word: בְּנֵי עֲנָק
  choice: os filhos de Anaque
  rationale: Preserva de perto a expressão filial hebraica, que no contexto pode indicar descendência ou pertencimento a um clã.
- source_word: מִן הַנְּפִלִים
  choice: descendentes dos nefilins
  rationale: Neste aposto, מן provavelmente expressa origem ou descendência. A formulação esclarece a relação sintática sem identificar indevidamente a natureza dos nefilins.
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: aos nossos próprios olhos, parecíamos
  rationale: Expressa em português natural o sentido perceptivo do idioma hebraico e ressalta que se trata da avaliação dos próprios espias.
- source_word: כַּחֲגָבִים
  choice: gafanhotos
  rationale: É a designação portuguesa convencional do inseto na comparação, comunicando a pequenez percebida.
- source_word: וְכֵן הָיִינוּ בְּעֵינֵיהֶם
  choice: e assim também parecíamos aos olhos deles
  rationale: Mantém o paralelismo retórico com a percepção dos espias e reproduz naturalmente a expressão hebraica.
theological_decisions:
- issue: Sentido de נְפִילִים
  choice: nefilins
  alternative: gigantes; caídos
  rationale: A identidade e a etimologia do grupo são discutidas, inclusive em relação a Gênesis 6:4. A transliteração conserva a ambiguidade do hebraico; a interpretação tradicional é indicada em nota.
- issue: Relação entre os filhos de Anaque e os nefilins
  choice: descendentes dos nefilins
  alternative: dos nefilins; entre os nefilins
  rationale: מן favorece aqui origem ou descendência, mas o texto não explica a natureza dessa relação. «Descendentes» torna a leitura provável compreensível sem desenvolver uma genealogia além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Anaque» segue a forma bíblica portuguesa corrente; «aos olhos» preserva a imagem e o paralelismo hebraicos.
