  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: pt
  text: Assim, eles subiram e fizeram o reconhecimento da terra, desde o deserto de Zim até Reobe, em Lebo-Hamate.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até Reobe, à entrada de Hamate”. A expressão hebraica também pode ser entendida de modo descritivo, em vez de como o topônimo Lebo-Hamate.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: eles subiram
  rationale: Preserva o sentido direcional de עלה e soa natural no contexto de deslocamento geográfico.
- source_word: וַיָּתֻרוּ
  choice: fizeram o reconhecimento
  rationale: Neste contexto, תור descreve a missão de reconhecimento da terra. A expressão evita a conotação moderna excessivamente clandestina de “espionaram”, sem reduzir a ação a uma exploração casual.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a forma corrente e contextualmente precisa para a terra de Canaã examinada pelos enviados.
- source_word: מִמִּדְבַּר צִן
  choice: desde o deserto de Zim
  rationale: “Deserto” comunica naturalmente מִדְבָּר em português; “Zim” é a forma tradicional portuguesa do topônimo hebraico צִן.
- source_word: עַד רְחֹב
  choice: até Reobe
  rationale: עַד assinala o limite da área percorrida, e “até” expressa isso com clareza.
- source_word: לְבֹא חֲמָת
  choice: junto a Lebo-Hamate
  rationale: Mantém a provável leitura toponímica de לְבֹא חֲמָת e entende a preposição לְ como indicação geográfica da localização de Reobe, sem ocultar a possível leitura descritiva, registrada na nota.
