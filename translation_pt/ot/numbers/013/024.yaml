base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/024.yaml
  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: pt
  text: Aquele lugar foi chamado Vale de Escol[a], por causa do cacho que os filhos de Israel[b] cortaram dali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uádi de Escol”, “ravina de Escol” ou “leito de um curso d’água sazonal de Escol”. O hebraico náhal pode indicar o leito de um curso d’água sazonal ou o vale associado a ele. Escol corresponde à palavra hebraica que significa “cacho”.
    reason: lexical_alternative_and_wordplay
  - marker: b
    text: Ou “os israelitas” ou “os descendentes de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: Aquele lugar
  rationale: Preserva a referência definida e demonstrativa ao local mencionado no contexto anterior, em português natural.
- source_word: קָרָא
  choice: foi chamado
  rationale: Embora a forma hebraica seja ativa na terceira pessoa do singular, o sujeito não expresso tem função impessoal; a passiva é a equivalência idiomática mais natural em português.
- source_word: נַחַל
  choice: vale
  rationale: O termo pode designar um leito de curso d’água sazonal, a ravina ou o vale associado. “Vale” é claro e adequado como elemento de um topônimo, enquanto a nota preserva as alternativas geográficas.
- source_word: אֶשְׁכּוֹל
  choice: Escol
  rationale: Na primeira ocorrência, funciona como nome do lugar. A transliteração portuguesa “Escol” também permite explicar na nota o jogo com o substantivo hebraico que significa “cacho”.
- source_word: עַל אֹדוֹת
  choice: por causa de
  rationale: 'Expressa claramente a relação causal: o cacho foi a razão do nome dado ao lugar.'
- source_word: הָאֶשְׁכּוֹל
  choice: o cacho
  rationale: Traduz o substantivo comum sem acrescentar “de uvas”, informação fornecida pelo contexto imediato, mas não repetida no hebraico deste versículo.
- source_word: אֲשֶׁר כָּרְתוּ
  choice: que ... cortaram
  rationale: “Cortaram” é uma formulação concisa e natural para a retirada do cacho, preservando o sentido básico do verbo hebraico.
- source_word: מִשָּׁם
  choice: dali
  rationale: Mantém de modo natural e conciso a referência dêitica ao lugar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e etnonímica do hebraico. Em português bíblico corrente, é clara e digna, sem exigir a forma menos literal “os israelitas”.
theological_decisions:
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A expressão hebraica é literalmente familiar, embora funcione como designação coletiva do povo. A tradução conserva essa textura sem introduzir uma distinção doutrinária.
- issue: Identificação de נַחַל
  choice: vale
  alternative: uádi; ravina; leito de torrente
  rationale: O referente geográfico exato permanece lexicalmente amplo. O texto principal usa a opção portuguesa mais acessível, e a nota explicita a ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva-se “filhos de Israel” por transparência ao hebraico; “Escol” segue a forma tradicional portuguesa do topônimo. As notas preservam a amplitude geográfica de נַחַל e o jogo etimológico do nome.
