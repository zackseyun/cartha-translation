  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/הוֹשֵׁ֥עַ בִּן נ֖וּן יְהוֹשֻֽׁעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: pt
  text: Estes são os nomes dos homens que Moisés enviou para reconhecer a terra.[a] Moisés chamou Oseias, filho de Num, de Josué.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para explorar a terra” ou “para fazer o reconhecimento da terra”. O verbo hebraico indica percorrer uma região a fim de examiná-la e obter informações.
    reason: lexical_alternative
  - marker: b
    text: Oseias era o nome anterior de Josué; aqui Moisés passa a chamá-lo de Josué.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Estes são os nomes
  rationale: Reproduz naturalmente em português a fórmula que retoma a lista anterior, mantendo o demonstrativo e o presente do enunciado hebraico.
- source_word: הָאֲנָשִׁים
  choice: dos homens
  rationale: O termo se refere, neste contexto, aos representantes masculinos que acabaram de ser nomeados.
- source_word: שָׁלַח
  choice: enviou
  rationale: Equivalente corrente e direto do verbo hebraico no contexto narrativo.
- source_word: לָתוּר
  choice: para reconhecer
  rationale: O verbo indica percorrer a terra com o objetivo de examiná-la e obter informações. “Reconhecer” comunica a ideia de exploração e reconhecimento do terreno sem impor a conotação mais estreita de espionagem.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a forma bíblica natural em português e, no contexto, designa a terra de Canaã.
- source_word: וַיִּקְרָא
  choice: chamou ... de
  rationale: Mantém de perto o verbo hebraico de chamar ou dar nome, enquanto a construção portuguesa deixa claro que Josué passa a ser o nome pelo qual Oseias é chamado.
- source_word: הוֹשֵׁעַ
  choice: Oseias
  rationale: Forma tradicional e amplamente reconhecível em português para este nome hebraico.
- source_word: בִּן נוּן
  choice: filho de Num
  rationale: Forma natural do patronímico em português, usando a grafia bíblica tradicional de Num.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma portuguesa consagrada e imediatamente reconhecível do nome hebraico.
