base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: pt
  text: Eles chegaram ao vale de Escol[a] e ali cortaram um ramo com um único cacho de uvas, que dois deles carregaram numa vara[b]; também levaram algumas romãs e alguns figos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uádi de Escol”, “ravina de Escol” ou “ribeiro de Escol”. O hebraico נַחַל pode designar uma ravina ou um curso d’água sazonal, além de um vale.
    reason: lexical_alternative
  - marker: b
    text: Ou “um ramo de videira com um cacho de uvas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: vale de Escol
  rationale: נַחַל pode indicar vale, ravina ou leito de curso d’água sazonal. “Vale” é natural e amplamente compreensível em português; a nota preserva as alternativas geográficas.
- source_word: זְמוֹרָה
  choice: ramo
  rationale: O termo designa um ramo de videira. Como o cacho de uvas aparece imediatamente depois, “ramo” evita redundância sem perder o sentido contextual.
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: um único cacho de uvas
  rationale: Preserva a ênfase quantitativa em um só cacho e soa natural em português moderno.
- source_word: וַיִּשָּׂאֻהוּ
  choice: que dois deles carregaram
  rationale: O sufixo masculino singular retoma o conjunto formado pelo ramo e pelo cacho. A oração relativa torna essa referência clara e natural.
- source_word: בַמּוֹט
  choice: numa vara
  rationale: מוֹט designa uma vara ou haste usada para transportar uma carga. “Numa vara” comunica de modo simples a imagem do objeto levado suspenso ou apoiado nela.
- source_word: בִּשְׁנָיִם
  choice: dois deles
  rationale: Literalmente, “por dois”. O contexto identifica os agentes como integrantes do grupo, por isso “dois deles” explicita apenas o que está implícito.
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: também levaram algumas romãs e alguns figos
  rationale: O hebraico acrescenta outros frutos, deixando o verbo subentendido. Repetir a ação como “levaram” produz uma frase clara sem alterar o conteúdo.
