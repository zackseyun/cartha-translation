  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: pt
  text: Amaleque habita na terra do Neguebe[a]; os hititas, os jebuseus e os amorreus habitam na região montanhosa; e os cananeus habitam junto ao mar e ao longo do Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Neguebe» também pode ser traduzido como «região sul»; aqui, provavelmente designa a região árida específica ao sul de Canaã.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Transliteração portuguesa tradicional do nome próprio e designação coletiva.
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: habita / habitam
  rationale: O particípio de ישב indica residência estabelecida; «habitar» é claro, digno e conserva essa nuance.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: na terra do Neguebe
  rationale: Preserva אֶרֶץ e trata נֶגֶב como a região geográfica específica do sul de Canaã.
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: os hititas / os jebuseus / os amorreus / os cananeus
  rationale: Os gentílicos hebraicos no singular coletivo são vertidos naturalmente como grupos humanos no plural em português.
- source_word: בָּהָר
  choice: na região montanhosa
  rationale: No contexto geográfico, הַר designa a zona elevada do interior, não necessariamente uma única montanha.
- source_word: עַל הַיָּם
  choice: junto ao mar
  rationale: Reproduz a relação espacial sem especificar além do hebraico que se trate propriamente da costa.
- source_word: עַל יַד הַיַּרְדֵּן
  choice: ao longo do Jordão
  rationale: Expressa em português natural o idioma hebraico «ao lado de», indicando a faixa adjacente ao rio.
