lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” expressa de modo natural e conciso a saída do local anterior.
- source_word: מֵחֲרָדָה
  choice: de Harada
  rationale: A preposição מִן marca o ponto de partida. O topônimo חֲרָדָה é transliterado segundo uma forma clara e corrente em português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, neste contexto de itinerário, significa instalar ou montar acampamento. “Acamparam” é natural, preciso e adequado ao registro narrativo.
- source_word: בְּמַקְהֵלֹת
  choice: em Maquelote
  rationale: A preposição בְ indica o local do acampamento. O topônimo מַקְהֵלֹת é transliterado como “Maquelote”, com grafia legível em português.
