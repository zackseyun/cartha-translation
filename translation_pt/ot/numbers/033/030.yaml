  yaml_path: translation/ot/numbers/033/030.yaml
  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: pt
  text: Partiram de Hasmona e acamparam em Moserote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e montaram acampamento em Moserote”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a partida de uma etapa. “Partiram” é natural e claro em português, preservando a sequência de deslocamentos.
- source_word: מֵחַשְׁמֹנָה
  choice: de Hasmona
  rationale: A preposição מֵ é traduzida por “de”. חַשְׁמֹנָה é nome de lugar e, por isso, é transliterado.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: Nesse contexto de itinerário, חנה significa montar ou estabelecer acampamento. “Acamparam” conserva a ação concreta em linguagem atual.
- source_word: בְּמֹסֵרוֹת
  choice: em Moserote
  rationale: A preposição בְ marca o local da parada e é naturalmente traduzida por “em”. מֹסֵרוֹת é transliterado como nome de lugar.
