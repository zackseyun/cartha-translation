lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural, conciso e preserva o sentido de saída.
- source_word: מִפּוּנֹן
  choice: de Punom
  rationale: A preposição מִן marca a origem do deslocamento. O topônimo פּוּנֹן é transliterado na forma portuguesa tradicional e legível “Punom”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, neste contexto de itinerário, significa montar ou estabelecer acampamento. “Acamparam” é a formulação corrente em português.
- source_word: בְּאֹבֹת
  choice: em Obote
  rationale: A preposição בְּ introduz o local do acampamento e é naturalmente traduzida por “em”. O topônimo אֹבֹת é transliterado como “Obote”, forma adequada à ortografia portuguesa.
