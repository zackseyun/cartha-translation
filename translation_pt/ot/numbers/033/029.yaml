lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a partida de um acampamento rumo ao seguinte. “Partiram” é natural e expressa claramente esse movimento.
- source_word: מִמִּתְקָה
  choice: de Mitca
  rationale: A preposição מִן significa “de”, e o topônimo מִתְקָה é transliterado em forma adequada ao português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento. “Acamparam” é claro, atual e fiel ao contexto.
- source_word: בְּחַשְׁמֹנָה
  choice: em Hasmona
  rationale: A preposição בְּ introduz o lugar do acampamento e é naturalmente vertida por “em”. O topônimo חַשְׁמֹנָה é transliterado em forma legível em português.
