base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: pt
  text: Partiram de Etã e voltaram para Pi-Hairote[a], que fica diante de Baal-Zefom, e acamparam diante de Migdol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retornaram a Pi-Hairote”. O verbo hebraico pode indicar tanto um retorno como uma mudança de direção; aqui, provavelmente descreve uma alteração da rota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: Partiram de Etã
  rationale: Na fórmula dos itinerários, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso; Etã é transliterado como topônimo.
- source_word: וַיָּשָׁב
  choice: voltaram em direção a
  rationale: שׁוב pode expressar retorno ou mudança de direção. A formulação conserva a ideia básica de voltar sem afirmar que chegaram novamente a um ponto anterior.
- source_word: עַל פִּי הַחִירֹת
  choice: em direção a Pi-Hairote
  rationale: Neste contexto de itinerário, a expressão assinala o local para o qual mudaram a rota. O topônimo é transliterado.
- source_word: אֲשֶׁר עַל פְּנֵי בַּעַל צְפֹן
  choice: que fica diante de Baal-Zefom
  rationale: עַל־פְּנֵי descreve uma relação espacial que pode ser entendida como “diante de”, “em frente de” ou “defronte de”. “Diante de” preserva essa amplitude.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה designa concretamente o ato de estabelecer acampamento; “acamparam” é claro e corrente.
- source_word: לִפְנֵי מִגְדֹּל
  choice: diante de Migdol
  rationale: לִפְנֵי indica posição em relação ao local. Migdol é mantido como topônimo, em vez de ser traduzido como “torre”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomes próprios transliterados segundo formas reconhecíveis para leitores lusófonos. A repetição de “diante de” reflete as duas relações espaciais do hebraico sem impor precisão geográfica ausente no texto.
