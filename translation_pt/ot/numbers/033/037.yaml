  yaml_path: translation/ot/numbers/033/037.yaml
  text: They set out from Kadesh and camped at Mount Hor[b][a], on the edge of the land of Edom.
translation:
  language: pt
  text: Partiram de Cades[a] e acamparam no monte Hor[b], na extremidade da terra de Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Cades”. Algumas traduções ampliam o nome para “Cades-Barneia” com base no contexto mais amplo, mas aqui o texto traz a forma mais curta.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente, em hebraico: “em Hor, o monte”; tradicionalmente traduzido como “monte Hor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a saída de um acampamento. “Partiram” é natural e direto em português.
- source_word: מִקָּדֵשׁ
  choice: de Cades
  rationale: O texto hebraico traz apenas o topônimo Cades, sem a ampliação “Cades-Barneia”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para montar ou estabelecer acampamento; “acamparam” preserva a ação concreta em linguagem atual.
- source_word: בְּהֹר הָהָר
  choice: no monte Hor
  rationale: A construção hebraica é literalmente “em Hor, o monte”; “monte Hor” é a forma toponímica convencional e natural em português.
- source_word: בִּקְצֵה
  choice: nos limites de
  rationale: קצה pode indicar extremidade, borda ou limite. “Nos limites de” expressa a localização na parte limítrofe do território sem afirmar necessariamente uma fronteira política formal.
- source_word: אֶרֶץ אֱדוֹם
  choice: a terra de Edom
  rationale: Tradução direta e idiomática de אֶרֶץ אֱדוֹם no contexto geográfico da narrativa.
