base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/051.yaml
  text: Speak to the sons of Israel and say to them, ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a] e diga-lhes: “Quando vocês atravessarem[b] o Jordão e entrarem na terra de Canaã,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “vocês estão atravessando” ou “vocês estão prestes a atravessar”. O particípio hebraico pode indicar uma travessia em curso ou prospectiva; neste contexto, a travessia está próxima.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel ordena comunicação direta; “fale” preserva sua força e mantém a distinção em relação ao verbo seguinte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar hebraica de modo tradicional e inteligível; a alternativa idiomática é registrada em nota.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Mantém os dois verbos hebraicos, דבר e אמר, sem fundi-los numa única ordem.
- source_word: כִּי אַתֶּם עֹבְרִים
  choice: Quando vocês atravessarem
  rationale: Neste contexto de instruções prospectivas, כִּי com o pronome e o particípio introduz naturalmente a ocasião iminente; o futuro do subjuntivo é idiomático em português após “quando”.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma portuguesa corrente para o nome do rio; “rio” não precisa ser acrescentado.
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: e entrarem na terra de Canaã
  rationale: A formulação explicita idiomaticamente o movimento para dentro da terra, preservando אֶרֶץ e evitando a construção menos natural “atravessar o Jordão para a terra”.
theological_decisions:
- issue: Valor temporal ou explicativo de כִּי
  choice: Quando vocês atravessarem
  alternative: Pois vocês estão atravessando / quando vocês estiverem para atravessar
  rationale: A sequência narrativa aponta para uma travessia ainda iminente e para as ordens que valerão ao entrar na terra. A tradução temporal comunica isso sem transformar a declaração em explicação causal, embora o particípio hebraico também permita destacar a iminência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural hebraico. A duplicação “fale... diga-lhes” preserva a estrutura da fonte; “e entrarem” expressa com naturalidade o destino introduzido por אֶל.
