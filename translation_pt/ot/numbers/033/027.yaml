  text: They set out from Tahath and camped at Terah.
translation:
  language: pt
  text: Partiram de Taate e acamparam em Tera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural em português e expressa com clareza o início do deslocamento.
- source_word: מִתָּחַת
  choice: de Taate
  rationale: A preposição מִן indica origem, por isso é traduzida por “de”. O topônimo תָּחַת é transliterado como “Taate”, forma legível em português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: O verbo חנה, neste contexto de itinerário, significa instalar ou montar acampamento. “Acamparam” é a forma corrente e direta em português.
- source_word: בְּתָרַח
  choice: em Tera
  rationale: A preposição בְּ introduz o lugar do acampamento e é naturalmente traduzida por “em”. O topônimo תָּרַח é transliterado como “Tera”, distinguindo-se de תֶּרַח, nome normalmente vertido como “Terá” em Gênesis.
