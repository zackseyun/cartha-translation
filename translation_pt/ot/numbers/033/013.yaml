  text: Partiram de Dofca e acamparam em Alus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: O verbo נסע, na fórmula dos itinerários do deserto, indica a partida de um acampamento para prosseguir viagem. “Partiram” é natural e claro em português.
- source_word: מִדָּפְקָה
  choice: de Dofca
  rationale: A preposição מִן indica origem (“de”). O topônimo דָּפְקָה é transliterado segundo formas correntes em português.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: O verbo חנה, neste contexto de itinerário, significa estabelecer acampamento. “Acamparam” expressa isso de forma contemporânea e direta.
- source_word: בְּאָלוּשׁ
  choice: em Alus
  rationale: A preposição בְּ marca localização. “Em” é a construção idiomática natural em português diante do nome do lugar; אָלוּשׁ é transliterado como “Alus”.
