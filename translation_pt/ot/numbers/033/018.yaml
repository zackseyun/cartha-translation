  text: They set out from Hazeroth and camped at Rithmah.
translation:
  language: pt
  text: Partiram de Hazerote e acamparam em Ritmá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português, preservando o movimento narrativo.
- source_word: מֵחֲצֵרֹת
  choice: de Hazerote
  rationale: O prefixo מִן indica origem (“de”), e o topônimo חֲצֵרֹת é transliterado como “Hazerote”, forma clara e legível em português.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: חנה é o verbo habitual para instalar acampamento. “Acamparam” é corrente e adequado ao registro narrativo.
- source_word: בְּרִתְמָה
  choice: em Ritmá
  rationale: O prefixo בְּ marca o local do acampamento. “Em” é idiomático em português, e “Ritmá” translitera o topônimo רִתְמָה com acento indicativo da tonicidade final.
