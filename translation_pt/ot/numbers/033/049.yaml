base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: pt
  text: E acamparam junto ao Jordão, desde Bete-Jesimote até Abel-Sitim, nas planícies[a] de Moabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estepes”. O termo hebraico se refere à região plana e aberta de Moabe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: E acamparam
  rationale: O wayyiqtol de חנה dá sequência ao itinerário. “Acamparam” é natural, claro e preserva o valor narrativo da forma hebraica.
- source_word: עַל הַיַּרְדֵּן
  choice: junto ao Jordão
  rationale: Com um rio, עַל indica localização à margem ou nas proximidades, não literalmente sobre ele. “Junto ao Jordão” expressa isso com naturalidade.
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: desde Bete-Jesimote
  rationale: O prefixo מִן assinala o ponto inicial da extensão geográfica. O topônimo é transliterado em forma adaptada à leitura portuguesa.
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: até Abel-Sitim
  rationale: עַד marca o limite final da área ocupada pelo acampamento. “Até” comunica a extensão de modo direto; o topônimo é transliterado.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies[a] de Moabe
  rationale: עֲרָבוֹת designa as terras planas e abertas, de caráter estepe, na região de Moabe. “Planícies” é claro e tradicional, enquanto a nota preserva a alternativa lexical mais específica.
