base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/005.yaml
  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: pt
  text: Os filhos de Israel partiram de Ramessés e acamparam em Sucote.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”; tradicionalmente, “os filhos de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ramessés também aparece como “Raamsés” em algumas traduções.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: No contexto de um itinerário, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e atual em português, expressando claramente o início do deslocamento.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto a expressão hebraica literal e preserva sua forma masculina, sem substituí-la silenciosamente pelo gentílico mais amplo “os israelitas”.
- source_word: מֵרַעְמְסֵס
  choice: de Ramessés
  rationale: A preposição מִן marca o ponto de partida. “Ramessés” é uma transliteração portuguesa corrente do topônimo.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: חנה significa montar ou estabelecer acampamento. “Acamparam” é claro, moderno e adequado à narrativa de viagem.
- source_word: בְּסֻכֹּת
  choice: em Sucote
  rationale: A preposição בְּ marca o local onde o grupo acampou. “Em” é idiomático em português, e “Sucote” é uma transliteração portuguesa corrente do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples própria de um itinerário. Mantém-se a expressão formal “os filhos de Israel”, enquanto os topônimos seguem formas portuguesas reconhecíveis.
