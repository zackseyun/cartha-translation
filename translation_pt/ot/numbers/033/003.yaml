  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: pt
  text: 'Partiram de Ramessés no primeiro mês, no décimo quinto dia do primeiro mês. No dia seguinte à Páscoa, os filhos de Israel[a] saíram de mão erguida[b], à vista de todos os egípcios.


    [a] Ou: “os israelitas”. Literalmente: “os filhos de Israel”.

    [b] “De mão erguida” é uma expressão hebraica que indica uma saída pública e ousada, diante de todos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Literalmente: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “De mão erguida” é uma expressão hebraica que indica uma saída pública e ousada, diante de todos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto de um itinerário, נסע indica levantar acampamento e pôr-se a caminho. “Partiram” é natural e conciso em português.
- source_word: מֵרַעְמְסֵס
  choice: de Ramessés
  rationale: Mantém o topônimo transliterado em sua forma portuguesa reconhecível.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro mês
  rationale: Reproduz diretamente a expressão temporal hebraica.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הָרִאשׁוֹן
  choice: no décimo quinto dia do primeiro mês
  rationale: É a formulação idiomática da data em português, sem perder nenhum elemento do hebraico.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: No dia seguinte à Páscoa
  rationale: מָחֳרַת designa o dia seguinte, e הַפֶּסַח se refere à Páscoa.
- source_word: יָצְאוּ
  choice: saíram
  rationale: Conserva o sentido básico de יצא e a associação narrativa com a saída do Egito.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a forma masculina representativa do hebraico; a nota apresenta o equivalente coletivo mais idiomático.
- source_word: בְּיָד רָמָה
  choice: de mão erguida
  rationale: Mantém a imagem concreta do idioma hebraico, enquanto a nota esclarece seu sentido de ação pública e ousada sem restringi-lo indevidamente a “triunfante” ou “desafiadora”.
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: à vista de todos os egípcios
  rationale: Expressa naturalmente em português a visibilidade pública indicada pelo hebraico, entendendo מִצְרַיִם aqui como os egípcios.
theological_decisions:
- issue: Tradução de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal conserva a forma da expressão pactual hebraica, enquanto a nota registra seu sentido coletivo natural.
- issue: Tradução da expressão בְיָד רָמָה
  choice: de mão erguida
  alternative: ousadamente; triunfantemente; desafiadoramente
  rationale: A imagem hebraica admite nuances de ousadia, publicidade e possível desafio. Preservar a expressão concreta evita escolher silenciosamente apenas uma dessas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem temporal foi preservada, e as expressões hebraicas relevantes foram mantidas quando inteligíveis, com notas breves para esclarecimento.
