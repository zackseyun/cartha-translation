base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: pt
  text: Moisés registrou os pontos de partida deles[b] segundo as suas jornadas, por ordem de Yahweh[a]; e estas foram as suas jornadas segundo os seus pontos de partida[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela boca de Yahweh”, expressão idiomática que significa “por ordem de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as saídas deles” ou “as partidas deles”.
    reason: lexical_alternative
  - marker: c
    text: 'O versículo inverte deliberadamente os termos: “pontos de partida [...] segundo as suas jornadas” e, depois, “jornadas segundo os seus pontos de partida”.'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: registrou
  rationale: Expressa o ato de escrever como registro de um itinerário, de modo natural e sem acrescentar conteúdo.
- source_word: מוֹצָאֵיהֶם
  choice: os pontos de partida deles
  rationale: מוֹצָא pode indicar a saída, a partida ou o lugar de onde se sai. No contexto do itinerário, “pontos de partida” comunica o sentido concreto e permite preservar a inversão com “jornadas”.
- source_word: לְמַסְעֵיהֶם
  choice: segundo as suas jornadas
  rationale: O לְ estabelece aqui uma relação entre as partidas registradas e as jornadas sucessivas. “Segundo” mantém essa relação sem a reduzir necessariamente a finalidade ou origem.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: עַל־פִּי significa literalmente “sobre/pela boca de”, mas funciona como expressão idiomática de comando ou determinação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: וְאֵלֶּה
  choice: e estas foram
  rationale: Introduz retrospectivamente o itinerário que vem a seguir; o verbo suprido torna a frase natural em português.
- source_word: מַסְעֵיהֶם
  choice: as suas jornadas
  rationale: מַסָּע designa uma jornada ou etapa de deslocamento, frequentemente associada ao ato de levantar acampamento. “Jornadas” é claro e preserva a correspondência formal do versículo.
- source_word: לְמוֹצָאֵיהֶם
  choice: segundo os seus pontos de partida
  rationale: Espelha a primeira metade e preserva a inversão deliberada entre pontos de partida e jornadas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome divino sem substituí-lo por um título.
