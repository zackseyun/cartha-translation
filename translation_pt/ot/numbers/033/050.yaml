  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés nas planícies[a] de Moabe, junto ao Jordão, na altura de Jericó, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas estepes”.'
    reason: Alternativa lexical legítima para עֲרָבוֹת, que pode designar planícies áridas ou terras de estepe.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O waw consecutivo dá continuidade à narrativa, e “falou” traduz דבר sem confundi-lo com אמר, representado no fim do versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: Forma portuguesa natural para indicar o destinatário da fala divina.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: ערבות designa terras planas ou de estepe; “planícies” é claro, natural e adequado à expressão geográfica.
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: junto ao Jordão, na altura de Jericó
  rationale: A expressão localiza as planícies ao lado do Jordão, na região correspondente a Jericó; a formulação evita sugerir que estavam dentro da cidade.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Preserva o infinitivo hebraico que introduz, além do limite do versículo, as palavras divinas seguintes.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título e segue a transliteração adotada para esta tradução.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a coordenação narrativa e a fórmula introdutória “dizendo”, além da precisão geográfica sem explicitação excessiva.
