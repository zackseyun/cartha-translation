lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: Arão
  rationale: O nome próprio é apresentado em sua forma portuguesa tradicional, e a conjunção ו não é explicitada porque, em português, o versículo funciona naturalmente como continuação narrativa sem «e» inicial.
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: tinha cento e vinte e três anos
  rationale: A expressão hebraica בן + numeral + שנה indica idade; «tinha ... anos» é a formulação portuguesa natural e preserva exatamente o valor numérico.
- source_word: בְּ/מֹת/וֹ
  choice: quando morreu
  rationale: A preposição בְּ com o substantivo verbal e o sufixo de terceira pessoa tem sentido temporal neste contexto; a oração portuguesa comunica isso de modo claro e natural.
- source_word: בְּ/הֹר הָ/הָר
  choice: no monte Hor
  rationale: הֹר הָהָר designa o lugar conhecido como monte Hor; «no» expressa naturalmente a localização do falecimento.
