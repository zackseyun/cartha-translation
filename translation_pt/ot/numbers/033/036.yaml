lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: Em listas de itinerário, נסע indica levantar acampamento e seguir viagem; “partiram” expressa isso de modo natural e conciso em português.
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: de Eziom-Geber
  rationale: O topônimo é transliterado conforme a forma tradicional e reconhecível em português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה significa montar ou estabelecer acampamento; “acamparam” preserva o sentido concreto em linguagem atual.
- source_word: בְמִדְבַּר צִן
  choice: no deserto de Zim
  rationale: מִדְבָּר designa uma região erma; “deserto” é uma forma geográfica tradicional e clara em português, sem exigir que se entenda um mar de areia.
- source_word: הִוא
  choice: isto é
  rationale: O pronome feminino introduz aqui uma identificação apositiva da localidade anterior; “isto é” comunica essa função naturalmente.
- source_word: קָדֵשׁ
  choice: Cades
  rationale: O topônimo é transliterado segundo a forma tradicional em português.
