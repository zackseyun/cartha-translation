  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: pt
  text: Então acontecerá que farei a vocês o que planejei fazer a eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: Então acontecerá
  rationale: A expressão introduz a consequência futura da advertência anterior, em português natural e solene.
- source_word: כַּאֲשֶׁר
  choice: que ... o que
  rationale: A construção liga o que Deus planejou fazer aos habitantes àquilo que fará a Israel; a formulação portuguesa reorganiza a oração sem eliminar essa correspondência.
- source_word: דִּמִּיתִי
  choice: planejei
  rationale: No piel e neste contexto, o verbo expressa propósito ou intenção definida; “planejei” comunica essa força sem sugerir mera reflexão.
- source_word: לַעֲשׂוֹת ... אֶעֱשֶׂה
  choice: fazer ... farei
  rationale: Mantém a repetição lexical e o paralelismo incisivo do hebraico.
- source_word: לָהֶם ... לָכֶם
  choice: a eles ... a vocês
  rationale: Preserva os objetos indiretos do hebraico; o contexto deixa clara a natureza punitiva da ação sem ser necessário acrescentar “contra”.
theological_decisions:
- issue: Força da fórmula de advertência
  choice: 'Advertência divina direta de juízo correspondente: Deus fará a Israel aquilo que havia planejado fazer aos habitantes da terra.'
  alternative: Declaração mais branda de consequência, sem ênfase na intenção divina.
  rationale: A primeira pessoa e o paralelismo explícito apresentam Deus como agente do juízo. A tradução conserva a solenidade sem acrescentar pormenores não expressos no versículo.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A ordem foi ajustada para evitar a construção pesada “acontecerá que aquilo que...”, preservando integralmente o sentido, o paralelismo e a tensão da advertência.
