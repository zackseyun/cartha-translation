  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: pt
  text: Partiram de Sucote e acamparam em Etã, que fica na extremidade do deserto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto de um itinerário, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מִסֻּכֹּת
  choice: de Sucote
  rationale: Topônimo transliterado em forma corrente e legível em português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה significa montar ou estabelecer acampamento; “acamparam” é a equivalência moderna e direta.
- source_word: בְאֵתָם
  choice: em Etã
  rationale: O ב locativo é naturalmente expresso por “em” diante de um topônimo em português; “Etã” translitera o nome hebraico.
- source_word: אֲשֶׁר
  choice: que fica
  rationale: Introduz uma oração relativa sobre Etã; acrescentar “fica” torna natural em português a descrição da localização, sem alterar o sentido.
- source_word: בִּקְצֵה
  choice: na extremidade de
  rationale: קָצֶה denota extremidade, limite ou borda. “Na extremidade” preserva o sentido geográfico sem sugerir necessariamente uma fronteira política.
- source_word: הַמִּדְבָּר
  choice: do deserto
  rationale: מִדְבָּר designa uma região erma e pouco cultivada. “Deserto” é claro e corrente em português, sem exigir que o terreno seja arenoso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação concisa própria de uma lista de etapas. Os topônimos seguem formas transliteradas usuais em português. Não se incluiu a nota inglesa porque nela “at the border of the wilderness” parece ser uma alternativa para בִּקְצֵה, não para “Etã”; a tradução principal já preserva essa amplitude com “extremidade”.
