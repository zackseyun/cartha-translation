lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a saída de uma etapa. “Partiram” é natural e conciso em português e preserva a sequência narrativa.
- source_word: מֵחֹר הַגִּדְגָּד
  choice: de Hor-Hagidgade
  rationale: A preposição מִן indica origem. O topônimo é transliterado, e o hífen mantém a ligação entre seus elementos.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: Em contextos de itinerário, חנה significa estabelecer acampamento. “Acamparam” é a equivalência corrente e digna em português.
- source_word: בְּיָטְבָתָה
  choice: em Jotbatá
  rationale: A preposição בְּ tem sentido locativo. “Em” é a forma idiomática portuguesa diante do nome da estação, que é transliterado.
