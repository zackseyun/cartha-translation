lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No itinerário do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” exprime isso de modo natural e conciso em português.
- source_word: מִמֹּסֵרֹות
  choice: de Moserote
  rationale: A preposição מִן é traduzida por “de”. O topônimo hebraico é transliterado; “Moserote” representa em português a forma מֹסֵרוֹת.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: Neste contexto itinerário, חנה significa estabelecer acampamento. “Acamparam” é claro, atual e adequado à fórmula repetida do capítulo.
- source_word: בִּבְנֵי יַעֲקָן
  choice: em Benê-Jaacã
  rationale: Embora a expressão signifique literalmente “filhos de Jaacã”, aqui funciona como nome de lugar. A preposição ב é vertida naturalmente por “em” com o local do acampamento.
