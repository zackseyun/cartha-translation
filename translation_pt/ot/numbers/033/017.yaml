  text: They set out from Kibroth-hattaavah and camped at Hazeroth[a].
translation:
  language: pt
  text: Partiram de Quibrote-Hataavá e acamparam em Hazerote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quibrote-Hataavá provavelmente significa “Sepulturas do Desejo” ou “Sepulturas da Cobiça”.
