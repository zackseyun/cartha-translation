lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto da fórmula de itinerário no deserto, נסע indica a partida de uma etapa. “Partiram” é natural e claro em português moderno.
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: de Quibrote-Hataavá
  rationale: O topônimo é transliterado, enquanto a preposição מִן é traduzida por “de”. O sentido lexical do nome é preservado em nota.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: Em relatos de itinerário, חנה significa estabelecer acampamento; “acamparam” é a equivalência corrente e precisa.
- source_word: בַּחֲצֵרֹת
  choice: em Hazerote
  rationale: O nome do lugar é transliterado, e a preposição ב é naturalmente expressa por “em” neste contexto.
