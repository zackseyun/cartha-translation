id: NUM.33.1
reference: Numbers 33:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: pt
  text: Estas são as etapas da jornada dos filhos de Israel[a], que saíram da terra do Egito organizados em seus grupos[b], sob a liderança de Moisés e Arão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo os seus exércitos” ou “em suas divisões”. O termo hebraico pode indicar grupos organizados e também ter sentido militar.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “pela mão de Moisés e Arão”, expressão hebraica que indica ação, direção ou liderança exercida por eles.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas são
  rationale: O demonstrativo introduz a lista que vem a seguir; em português, a cópula no presente forma uma abertura natural.
- source_word: מַסְעֵי
  choice: as etapas da jornada
  rationale: O substantivo designa os sucessivos deslocamentos ou pontos de partida do itinerário; a formulação comunica a sequência sem a restringir apenas às partidas.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar do hebraico, natural e tradicional em português, sem a reduzir simplesmente a 'israelitas'.
- source_word: אֲשֶׁר יָצְאוּ מֵאֶרֶץ מִצְרַיִם
  choice: que saíram da terra do Egito
  rationale: Preserva a oração relativa, o movimento para fora e a menção explícita à terra do Egito.
- source_word: לְצִבְאֹתָם
  choice: organizados em seus grupos
  rationale: Expressa a disposição coletiva e ordenada indicada por צָבָא sem impor necessariamente um sentido de exércitos combatentes.
- source_word: בְּיַד מֹשֶׁה וְאַהֲרֹן
  choice: sob a liderança de Moisés e Arão
  rationale: Traduz de modo idiomático a expressão hebraica de agência, literalmente 'pela mão de', neste contexto de condução do povo.
theological_decisions:
- issue: Caráter militar de לְצִבְאֹתָם
  choice: organizados em seus grupos
  alternative: segundo os seus exércitos / em suas divisões
  rationale: O termo admite uma conotação militar, mas também designa agrupamentos organizados. A tradução principal preserva a organização sem transformar inequivocamente todo o povo em força combatente; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva 'filhos de Israel' por sua forma familiar e mantém em notas tanto a possível força militar de צָבָא quanto o idioma hebraico בְּיַד.
