  yaml_path: translation/ot/numbers/033/028.yaml
  text: They set out from Terah and camped at Mithkah.
translation:
  language: pt
  text: Partiram de Terá e acamparam em Mitca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” expressa de modo natural e conciso a saída de uma etapa.
- source_word: מִתָּרַח
  choice: de Terá
  rationale: A preposição מִן marca o ponto de origem, e תָּרַח é um topônimo, aqui transliterado como “Terá” conforme o uso português tradicional.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: O verbo חנה, neste contexto de itinerário, significa montar ou estabelecer acampamento. “Acamparam” conserva o sentido concreto em português atual.
- source_word: בְּמִתְקָה
  choice: em Mitca
  rationale: A preposição בְּ indica localização. Com topônimos, “em” é a formulação idiomática em português; מִתְקָה é transliterado como “Mitca”.
