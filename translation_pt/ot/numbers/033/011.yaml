base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: pt
  text: Partiram do mar Vermelho[a] e acamparam no deserto de Sim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mar dos Juncos”. O nome hebraico yam suf é tradicionalmente traduzido como “mar Vermelho”, mas uma tradução mais literal frequentemente proposta é “mar dos Juncos”.'
    reason: lexical_alternative
  - marker: b
    text: “Sim” é o nome de uma região desértica.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário de itinerário de Números 33, נסע indica a saída de um local de acampamento. “Partiram” é natural e conciso em português moderno.
- source_word: מִיַּם סוּף
  choice: do mar Vermelho
  rationale: יַם־סוּף funciona aqui como topônimo geográfico e é tradicionalmente conhecido em português como “mar Vermelho”. A tradução mais literal possível, “mar dos Juncos”, é preservada em nota.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual dos itinerários do deserto para estabelecer acampamento; “acamparam” conserva o sentido concreto em linguagem corrente.
- source_word: בְּמִדְבַּר סִין
  choice: no deserto de Sim
  rationale: מִדְבָּר designa uma região desértica ou erma; “deserto” é claro e idiomático. סִין é um nome geográfico, aqui transliterado como “Sim” segundo o uso bíblico português.
