translation_notes:
  register: Português moderno, claro e digno, com formulação concisa própria de um itinerário. Mantém o topônimo tradicional “mar Vermelho” no texto e registra a alternativa lexical em nota; usa “Sim” para evitar confusão com a palavra portuguesa de afirmação apenas mediante esclarecimento contextual na nota.
