lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto da fórmula de itinerário no deserto, נסע indica a partida de um acampamento. “Partiram” é natural, claro e preserva o sentido de deslocamento.
- source_word: מִמַּקְהֵלֹת
  choice: de Maquelote
  rationale: O prefixo מִן é traduzido por “de”, e o topônimo é transliterado em forma adequada ao português, em vez de ser traduzido.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: Neste itinerário, חנה significa instalar acampamento no local seguinte. “Acamparam” é corrente e preciso em português moderno.
- source_word: בְּתָחַת
  choice: em Taate
  rationale: O prefixo בְּ é vertido idiomaticamente por “em” diante do lugar do acampamento, e תָחַת é tratado como topônimo transliterado.
