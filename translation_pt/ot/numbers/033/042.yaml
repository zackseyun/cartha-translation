lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מִצַּלְמֹנָה
  choice: de Zalmona
  rationale: A preposição מִן indica origem, “de”. O topônimo צַלְמֹנָה é transliterado na forma portuguesa tradicional e fonologicamente adequada “Zalmona”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, neste contexto itinerante, significa estabelecer acampamento; “acamparam” é corrente e claro.
- source_word: בְּפוּנֹן
  choice: em Punom
  rationale: A preposição בְּ marca o local onde o povo acampou. “Em” é a regência natural em português, e פּוּנֹן é transliterado como “Punom”, com -m final segundo a ortografia portuguesa.
