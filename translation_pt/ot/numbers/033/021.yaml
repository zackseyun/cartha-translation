  text: They set out from Libnah and camped at Rissah.
translation:
  language: pt
  text: Partiram de Libna e acamparam em Rissa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural em português e expressa claramente a saída do local anterior.
- source_word: מִלִּבְנָה
  choice: de Libna
  rationale: A preposição מִן indica origem, e לִבְנָה é nome de lugar; por isso, o nome é transliterado, não traduzido.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento. “Acamparam” é claro, atual e adequado ao contexto de itinerário.
- source_word: בְּרִסָּה
  choice: em Rissa
  rationale: A preposição בְּ marca localização. Em português, “acamparam em” é a construção idiomática com nome de lugar, que é transliterado.
