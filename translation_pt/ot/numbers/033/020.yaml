lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a saída de uma etapa. “Partiram” é natural em português e mantém a sequência narrativa.
- source_word: מֵרִמֹּן פָּרֶץ
  choice: de Rimom-Perez
  rationale: A preposição מִן expressa procedência. O topônimo composto é transliterado conforme a forma tradicional e ligado por hífen.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, neste contexto de itinerário, significa montar ou estabelecer acampamento; “acamparam” é claro, atual e preciso.
- source_word: בְּלִבְנָה
  choice: em Libna
  rationale: A preposição בְּ marca o local da parada. “Em” é a formulação mais natural em português, e Libna é mantido como topônimo transliterado.
