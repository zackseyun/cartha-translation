lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário do itinerário do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural, conciso e adequado à fórmula repetida em Números 33.
- source_word: מִדִּיבֹן גָּד
  choice: de Dibom-Gade
  rationale: O topônimo composto foi transliterado segundo formas correntes em português bíblico, sem interpretar a relação como “Dibom de Gade”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה designa montar ou estabelecer acampamento; “acamparam” é claro e corrente em português moderno.
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: em Almom-Diblataim
  rationale: O nome de lugar foi transliterado e apresentado como topônimo composto; a preposição בְּ foi vertida por “em”, forma natural para indicar o local do acampamento.
