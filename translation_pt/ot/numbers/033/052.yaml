  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: pt
  text: Expulsem de diante de vocês todos os habitantes da terra. Destruam todas as suas pedras com figuras[a], destruam todas as suas imagens de metal fundido[b] e arrasem todos os seus lugares altos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as suas imagens esculpidas”. O termo hebraico se refere a representações figuradas, mas sua forma e seu material exatos são discutidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “imagens moldadas por fundição”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, locais de culto, muitas vezes construídos em elevações.
    reason: cultural_clarification
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Expulsem
  rationale: O hifil de ירשׁ indica fazer os habitantes perderem a posse e serem removidos. “Expulsem” expressa isso de modo direto e natural, sem reduzir a ordem a uma simples transferência jurídica de propriedade.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: A construção participial designa os que moram na terra; “habitantes” é conciso, corrente e fiel.
- source_word: מִפְּנֵיכֶם
  choice: de diante de vocês
  rationale: Mantém a imagem da expressão idiomática hebraica e é compreensível em português moderno.
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: Destruam / destruam
  rationale: O piel de אבד ordena a destruição dos objetos cultuais. A repetição de “destruam” conserva a repetição e a força retórica do hebraico.
- source_word: מַשְׂכִּיֹּתָם
  choice: as pedras com figuras deles
  rationale: O termo se refere a representações figuradas, provavelmente gravadas ou esculpidas em pedra, embora sua forma e seu material exatos sejam discutidos. A formulação mantém o sentido concreto provável e o distingue das imagens metálicas mencionadas em seguida.
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: as suas imagens de metal fundido
  rationale: צֶלֶם significa “imagem”, e מַסֵּכָה indica algo produzido pela fundição de metal. A tradução explicita o material e o processo em linguagem atual.
- source_word: בָּמֹתָם
  choice: os seus lugares altos
  rationale: בָּמוֹת é o termo usual para locais de culto, muitas vezes situados em elevações. “Lugares altos” preserva a expressão bíblica estabelecida, com nota explicativa.
- source_word: תַּשְׁמִידוּ
  choice: arrasem
  rationale: O hifil de שׁמד comunica destruição completa. Aplicado a locais de culto, “arrasem” é concreto e idiomático, além de evitar uma terceira repetição estilística não necessária de “destruam”.
theological_decisions:
- issue: Ordens relativas aos habitantes e ao culto cananeu
  choice: Traduzir diretamente a ordem de expulsar os habitantes e destruir objetos e locais de culto específicos.
  alternative: Atenuar o primeiro verbo para uma transferência meramente territorial ou generalizar os termos cultuais.
  rationale: O hebraico apresenta tanto a remoção dos habitantes quanto a eliminação de seus objetos e locais de culto. A tradução não suaviza essas ordens nem acrescenta ao versículo uma justificativa teológica que ele próprio não enuncia.
- issue: Força verbal das formas coordenadas
  choice: 'Usar imperativos diretos no plural: “Expulsem”, “Destruam” e “arrasem”.'
  alternative: Empregar futuros prescritivos, como “vocês expulsarão” e “destruirão”.
  rationale: No contexto legal e exortativo, as formas hebraicas têm força de ordem. O imperativo é a maneira mais natural e inequívoca de comunicá-la no português moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas dirigidas a “vocês”. Os imperativos comunicam naturalmente a força prescritiva do hebraico. “De diante de vocês” conserva a imagem do original; “lugares altos” mantém o termo cultual tradicional, esclarecido em nota.
