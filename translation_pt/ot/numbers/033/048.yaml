  text: וַ/יִּסְע֖וּ מֵ/הָרֵ֣י הָ/עֲבָרִ֑ים וַֽ/יַּחֲנוּ֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: pt
  text: Partiram dos montes de Abarim e acamparam nas planícies de Moabe[a], junto ao Jordão, na altura de Jericó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas estepes de Moabe”. O termo hebraico pode designar terras de estepe ou planícies.
    reason: lexical_alternative
  - marker: b
    text: Ou “junto ao Jordão, em frente de Jericó”. Algumas traduções entendem a expressão final mais especificamente como uma indicação da região situada do outro lado, diante de Jericó.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário de itinerário, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: dos montes de Abarim
  rationale: Traduz diretamente o plural construto הָרֵי e mantém Abarim como nome geográfico transliterado.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, neste contexto, significa estabelecer acampamento; “acamparam” é corrente e fiel.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: עַרְבֹת designa terras planas ou de estepe. “Planícies” é claro e acessível, enquanto Moabe segue a forma portuguesa tradicional do topônimo.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: junto ao Jordão, na altura de Jericó
  rationale: עַל junto a um curso de água indica localização às suas margens. A relação genitiva/locativa com Jericó é compacta no hebraico; “na altura de Jericó” preserva a referência geográfica sem inserir explicitamente “em frente de”, termo ausente do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação natural para um itinerário. A vírgula antes da expressão referente a Jericó torna legível a sequência geográfica sem eliminar a concisão nem a ambiguidade do hebraico.
