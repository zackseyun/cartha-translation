base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/040.yaml
  text: And the Canaanite king of Arad[a], who lived in the Negev in the land of Canaan[b], heard when the sons of Israel came.
translation:
  language: pt
  text: E o rei cananeu de Arade, que habitava no Neguebe, na terra de Canaã, ouviu quando os filhos de Israel vieram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas”. O hebraico diz literalmente “dos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu falar
  rationale: O qal narrativo significa literalmente “ouviu”; como o objeto está implícito e בְּבֹא introduz a circunstância conhecida, “ouviu falar da chegada” expressa naturalmente em português que ele recebeu a notícia, sem acrescentar um objeto específico como “notícias”.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: o rei cananeu de Arade
  rationale: Preserva a identificação étnica e o título do governante numa ordem natural em português; o artigo hebraico é representado por “o”.
- source_word: וְהוּא יֹשֵׁב
  choice: que habitava
  rationale: O pronome com particípio fornece informação descritiva de fundo. A oração relativa reproduz essa função com clareza e dignidade.
- source_word: בַּנֶּגֶב
  choice: no Neguebe
  rationale: Aqui נֶגֶב funciona adequadamente como designação geográfica da região meridional; a transliteração portuguesa evita reduzi-la genericamente a “sul”.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém o substantivo explícito אֶרֶץ e a ênfase geográfica do hebraico.
- source_word: בְּבֹא
  choice: da chegada
  rationale: A preposição ב com o infinitivo construto de בוא indica a ocasião temporal. A construção nominal com “ouviu falar” é idiomática em português e não especifica um destino ausente do texto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: É a correspondência formal mais transparente para a expressão hebraica, preservando a formulação histórica do texto; a alternativa idiomática é indicada em nota.
