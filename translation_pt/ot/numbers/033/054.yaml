base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: pt
  text: Vocês repartirão a terra por sorteio, segundo os seus clãs. Ao grupo maior, aumentarão a sua herança; ao grupo menor, diminuirão a sua herança. O lugar que o sorteio indicar para cada um será dele.[a] Vocês receberão suas heranças segundo as tribos de seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Onde a sorte sair para ele, ali será sua [porção]”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: Vocês repartirão
  rationale: O hitpael de נחל, neste contexto de distribuição territorial, tem sentido distributivo. “Repartirão” comunica naturalmente a atribuição da terra, enquanto a ideia de herança é preservada nas ocorrências de נַחֲלָה e no verbo final.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Equivalente corrente e adequado para o território prometido no contexto de Números.
- source_word: בְּגוֹרָל
  choice: por sorteio
  rationale: גורל designa o meio de atribuir parcelas mediante sortes. “Por sorteio” é claro em português moderno e não sugere uma loteria comercial.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה indica aqui uma subdivisão social da tribo, mais ampla que a família nuclear moderna; “clãs” preserva essa especificidade.
- source_word: לָרַב
  choice: Ao grupo maior
  rationale: No contexto da distribuição, refere-se ao grupo mais numeroso, que deve receber uma porção maior. A inclusão de “grupo” torna o contraste inteligível sem especificar além do contexto.
- source_word: תַּרְבּוּ אֶת נַחֲלָתוֹ
  choice: aumentarão a sua herança
  rationale: Preserva o causativo de רבה e o termo teologicamente significativo נַחֲלָה, que neste contexto designa a porção territorial recebida como herança.
- source_word: וְלַמְעַט
  choice: ao grupo menor
  rationale: Forma o contraponto de לָרַב e se refere ao grupo menos numeroso na distribuição.
- source_word: תַּמְעִיט אֶת נַחֲלָתוֹ
  choice: diminuirão a sua herança
  rationale: Reproduz o paralelismo antitético do hebraico e mantém “herança” para נַחֲלָה.
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל
  choice: O lugar que o sorteio indicar para cada um
  rationale: Expressa em português natural a direção e o resultado da fórmula hebraica, segundo a qual a sorte “sai” para alguém em determinado lugar. A formulação mais literal é preservada em nota.
- source_word: לוֹ יִהְיֶה
  choice: será dele
  rationale: Equivalente possessivo conciso e natural, indicando que a porção determinada pertencerá ao destinatário.
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: segundo as tribos de seus antepassados
  rationale: מַטּוֹת designa as tribos, e אֲבֹתֵיכֶם indica a linhagem ancestral. “Antepassados” evita que “pais” seja entendido apenas como os genitores imediatos.
- source_word: תִּתְנֶחָלוּ
  choice: Vocês receberão suas heranças
  rationale: O verbo conclui a instrução retomando a ideia de posse hereditária. A tradução conserva o tema da herança e se ajusta ao contexto de múltiplas porções tribais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa plural em “vocês”. “Clãs”, “tribos” e “herança” preservam a estrutura social e jurídica do texto. O paralelismo entre o grupo maior e o menor foi mantido.
