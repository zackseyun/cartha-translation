lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto de um itinerário, נסע descreve levantar acampamento e seguir viagem. “Partiram” é natural, conciso e adequado à fórmula repetida da lista.
- source_word: מֵהֹר הָהָר
  choice: do monte Hor
  rationale: הֹר הָהָר é o topônimo tradicionalmente expresso em português como “monte Hor”; a preposição מִן indica o ponto de partida.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה indica montar ou estabelecer acampamento. “Acamparam” preserva com clareza o sentido e usa linguagem portuguesa atual.
- source_word: בְּצַלְמֹנָה
  choice: em Zalmona
  rationale: A preposição בְּ tem sentido locativo diante do nome da parada. “Em Zalmona” é a construção idiomática em português.
