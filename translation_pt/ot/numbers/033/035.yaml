lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto formular do itinerário no deserto, נסע indica a saída de um acampamento. “Partiram” é natural e atual em português.
- source_word: מֵעַבְרֹנָה
  choice: de Abrona
  rationale: A preposição מֵ expressa origem, traduzida por “de”; עַבְרֹנָה é transliterado como nome de lugar.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: No itinerário, חנה significa estabelecer acampamento; “acamparam” comunica isso de modo claro e conciso.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: em Eziom-Geber
  rationale: A preposição בְּ marca o local e é traduzida por “em”; o topônimo composto é transliterado segundo uma forma portuguesa legível.
