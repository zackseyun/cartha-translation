lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a saída de um acampamento rumo ao seguinte. “Partiram” é natural e claro em português.
- source_word: מֵרִסָּה
  choice: de Rissa
  rationale: O nome próprio רִסָּה é transliterado como “Rissa”, com a preposição מֵ־ traduzida por “de”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה designa o ato concreto de montar ou estabelecer acampamento. “Acamparam” preserva esse sentido em linguagem atual.
- source_word: בִּקְהֵלָתָה
  choice: em Queelata
  rationale: O topônimo קְהֵלָתָה é transliterado como “Queelata”; a preposição בְּ־ é vertida naturalmente por “em” para indicar o local da parada.
