  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: pt
  text: Partiram do monte Sefer e acamparam em Harada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Safer”, como forma alternativa do nome do lugar שָׁפֶר.
