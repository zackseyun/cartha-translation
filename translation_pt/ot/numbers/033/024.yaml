lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a saída de um acampamento rumo ao seguinte. “Partiram” é natural e conciso em português.
- source_word: מֵהַר
  choice: do monte
  rationale: A preposição מן com הַר expressa procedência. Antes de um nome próprio, “do monte” é a construção portuguesa natural.
- source_word: שָׁפֶר
  choice: Sefer
  rationale: O topônimo é transliterado, não traduzido. “Sefer” representa de modo legível em português a vocalização hebraica Šāfer; a forma alternativa “Safer” é registrada em nota.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: Em contextos de itinerário, חנה significa instalar acampamento. “Acamparam” é claro, atual e preserva o sentido.
- source_word: בַּחֲרָדָה
  choice: em Harada
  rationale: A preposição בְּ com o topônimo marca o lugar da parada; “em” é idiomático em português. Harada translitera o nome próprio חֲרָדָה.
