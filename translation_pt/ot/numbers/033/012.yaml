  yaml_path: translation/ot/numbers/033/012.yaml
  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: pt
  text: Partiram do deserto de Sim e acamparam em Dofca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto da fórmula de itinerário, נסע indica levantar acampamento e seguir viagem; “partiram” é natural e conciso em português.
- source_word: מִמִּדְבַּר
  choice: do deserto de
  rationale: מִדְבָּר designa região desértica ou erma; “deserto” é claro, corrente e adequado ao topônimo composto.
- source_word: סִין
  choice: Sim
  rationale: É um nome geográfico hebraico, transliterado segundo a forma tradicional e legível em português; não se trata do vocábulo inglês “sin”, de modo que a nota inglesa não é necessária.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo usual para estabelecer acampamento; “acamparam” preserva com naturalidade a ação da fórmula itinerária.
- source_word: בְּדָפְקָה
  choice: em Dofca
  rationale: A preposição ב marca o local onde acamparam. “Em” é a regência natural em português, e “Dofca” translitera o topônimo.
