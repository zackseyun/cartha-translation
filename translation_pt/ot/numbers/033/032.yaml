lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a partida de uma etapa. “Partiram” é natural, claro e preserva a sequência de deslocamentos.
- source_word: מִבְּנֵי יַעֲקָן
  choice: de Benê-Jaacã
  rationale: A expressão funciona aqui como topônimo, correspondente a Beerote-Benê-Jaacã em Deuteronômio 10:6. A transliteração preserva o nome do lugar sem ocultar seu sentido literal, indicado em nota.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento no formulário do itinerário. “Acamparam” é corrente e digno em português moderno.
- source_word: בְּחֹר הַגִּדְגָּד
  choice: em Hor-Hagidgade
  rationale: Trata-se de um topônimo, portanto foi transliterado. A preposição בְ marca o local da parada e foi traduzida naturalmente por “em”; o artigo hebraico foi incorporado ao segundo elemento do nome.
