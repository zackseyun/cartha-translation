  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: pt
  text: Partiram de Benê-Jaacã e acamparam em Hor-Hagidgade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, Benê-Jaacã provavelmente é um nome de lugar, embora a expressão signifique literalmente “filhos de Jaacã”.
