  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: pt
  text: Partiram de diante de Hairote[a] e atravessaram pelo meio do mar para o deserto. Percorreram uma jornada de três dias[b] no deserto de Etã e acamparam em Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “Hairote”, sem o elemento “Pi-” que aparece com mais frequência no nome “Pi-Hairote” em Êxodo. A forma mais curta deste versículo foi mantida.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “caminharam durante três dias”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto de um itinerário, נסע indica levantar acampamento e seguir viagem; “partiram” é natural e conciso em português.
- source_word: מִפְּנֵי הַחִירֹת
  choice: de diante de Hairote
  rationale: Preserva a construção hebraica com מִפְּנֵי e mantém a forma mais curta do topônimo presente neste versículo, sem harmonizá-la com “Pi-Hairote” em Êxodo.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: atravessaram pelo meio do mar
  rationale: Expressa o movimento de passagem e conserva o sentido explícito de בְתוֹךְ, “no meio de”.
- source_word: הַמִּדְבָּרָה
  choice: em direção ao deserto
  rationale: O ה direcional indica movimento rumo ao deserto; a formulação evita transformar indevidamente o termo em simples localização.
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: Percorreram uma jornada de três dias
  rationale: Mantém a imagem hebraica de um caminho ou jornada medido em três dias, em português claro e digno.
- source_word: בְּמִדְבַּר אֵתָם
  choice: no deserto de Etã
  rationale: Reproduz naturalmente em português a cadeia construta hebraica e translitera o topônimo conforme o uso português.
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: acamparam em Mara
  rationale: חנה descreve o estabelecimento de um acampamento; “acamparam em” é a expressão corrente para uma parada em local nomeado.
