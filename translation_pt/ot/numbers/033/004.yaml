source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: pt
  text: enquanto os egípcios sepultavam aqueles que Yahweh havia ferido entre eles — todos os primogênitos —, Yahweh havia executado juízos contra os deuses deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: enquanto os egípcios sepultavam
  rationale: A conjunção seguida do substantivo e do particípio forma uma oração circunstancial de ação em curso; “enquanto... sepultavam” expressa isso naturalmente em português.
- source_word: אֵת אֲשֶׁר הִכָּה יְהוָה בָּהֶם
  choice: aqueles que Yahweh havia ferido entre eles
  rationale: Mantém a construção relativa hebraica e o verbo נכה como “ferir”, deixando que a ação de sepultar torne claro o resultado mortal. O mais-que-perfeito composto situa o golpe antes do sepultamento.
- source_word: כָּל בְּכוֹר
  choice: todos os primogênitos
  rationale: Traduz a aposição que identifica de modo abrangente aqueles que foram feridos, sem acrescentar um possessivo ausente no hebraico.
- source_word: וּבֵאלֹהֵיהֶם
  choice: também ... contra os deuses deles
  rationale: A preposição ב com a expressão עשה שפטים tem sentido adversativo, bem expresso por “contra”. “Também” representa a conjunção e liga esse juízo ao golpe contra os primogênitos.
- source_word: עָשָׂה יְהוָה שְׁפָטִים
  choice: Yahweh executava juízos
  rationale: “Executar juízos” comunica a expressão idiomática de realizar atos judiciais. O imperfeito acompanha a perspectiva circunstancial da oração, sem negar que os juízos foram efetivamente realizados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino; a transliteração “Yahweh” preserva essa característica.
- issue: Referência de אֱלֹהֵיהֶם
  choice: os deuses deles
  alternative: os ídolos deles; os governantes deles
  rationale: A tradução conserva a referência direta aos deuses do Egito e não a reduz interpretativamente a ídolos materiais ou autoridades humanas.
- issue: Relação entre os golpes nos primogênitos e os juízos contra os deuses
  choice: manter as duas ações ligadas, mas distintas
  alternative: entender os juízos contra os deuses como mera explicação do golpe nos primogênitos
  rationale: A coordenação hebraica apresenta o juízo contra os deuses como afirmação própria, relacionada ao que ocorreu com os primogênitos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os travessões preservam com clareza a aposição “todos os primogênitos”. Não há marcador de nota, pois nenhuma nota é necessária para esta redação.
