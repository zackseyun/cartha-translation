lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário de itinerário de Números 33, נסע indica levantar acampamento e seguir viagem. “Partiram” expressa isso de modo natural e conciso em português.
- source_word: מִמִּדְבַּר סִינָי
  choice: do deserto do Sinai
  rationale: מִדְבָּר designa uma região erma ou desértica. “Deserto do Sinai” conserva a relação geográfica do hebraico e é a forma corrente e clara em português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual dos itinerários para montar ou estabelecer acampamento. “Acamparam” é moderno, direto e fiel.
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: em Quibrote-Hataavá
  rationale: O hebraico emprega a expressão como topônimo. A transliteração preserva o nome geográfico, enquanto seu significado é informado em nota.
