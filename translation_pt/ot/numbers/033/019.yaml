- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע descreve levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מֵרִתְמָה
  choice: de Ritma
  rationale: A preposição מִן indica origem, traduzida por “de”. O topônimo é transliterado em forma corrente e legível em português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento. “Acamparam” preserva o sentido e soa natural no português moderno.
- source_word: בְּרִמֹּן פָּרֶץ
  choice: em Rimom-Perez
  rationale: A preposição בְּ marca o local da parada. “Em” é a construção idiomática portuguesa; o nome composto é transliterado com hífen.
