  text: They set out from Alush and camped at Rephidim, but there was no water there for the people to drink.
translation:
  language: pt
  text: Partiram de Alus e acamparam em Refidim, mas ali não havia água para o povo beber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מֵאָלוּשׁ
  choice: de Alus
  rationale: Topônimo transliterado segundo uma forma portuguesa clara, sem traduzir o nome.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento; “acamparam” é corrente e preserva a sequência do itinerário.
- source_word: בִּרְפִידִם
  choice: em Refidim
  rationale: Topônimo transliterado; a preposição “em” é idiomática em português para o local onde se acampa.
- source_word: וְלֹא הָיָה שָׁם
  choice: mas ali não havia
  rationale: O waw introduz aqui uma circunstância adversa. “Mas” explicita naturalmente esse contraste, e “ali” evita uma construção pesada.
- source_word: מַיִם
  choice: água
  rationale: Equivalente comum e direto de מַיִם neste contexto.
- source_word: לָעָם
  choice: para o povo
  rationale: עַם designa coletivamente o povo israelita; “o povo” é a formulação simples e contextual.
- source_word: לִשְׁתּוֹת
  choice: beber
  rationale: O infinitivo expressa a finalidade da água em relação ao povo; “água para o povo beber” é uma construção natural em português.
