base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: pt
  text: Partiram de Mara e chegaram a Elim. Em Elim havia doze fontes de água e setenta palmeiras, e eles acamparam ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário de itinerário, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e claro em português.
- source_word: מִמָּרָה
  choice: de Mara
  rationale: Nome próprio de lugar transliterado segundo a forma tradicional e corrente em português.
- source_word: וַיָּבֹאוּ
  choice: e chegaram
  rationale: בוא pode significar vir, entrar ou chegar; neste itinerário, “chegaram” expressa naturalmente a chegada ao destino sem acrescentar informação.
- source_word: אֵילִמָה / בְאֵילִם
  choice: a Elim / Em Elim
  rationale: A primeira forma marca direção para o lugar; a segunda localiza nele as fontes e palmeiras. O topônimo é transliterado.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: doze
  rationale: Tradução direta e idiomática do numeral cardinal.
- source_word: עֵינֹת מַיִם
  choice: fontes de água
  rationale: עַיִן designa aqui nascentes ou fontes naturais de água, não poços escavados. “Fontes de água” preserva a expressão hebraica com clareza.
- source_word: וְשִׁבְעִים
  choice: e setenta
  rationale: Tradução direta do numeral cardinal, mantendo sua coordenação com o elemento anterior.
- source_word: תְּמָרִים
  choice: palmeiras
  rationale: O termo se refere a palmeiras, possivelmente tamareiras; “palmeiras” evita especificidade maior que a explicitada no texto.
- source_word: וַיַּחֲנוּ שָׁם
  choice: e eles acamparam ali
  rationale: חנה, em itinerários no deserto, significa montar acampamento. O pronome explícito favorece a fluidez após a descrição das fontes e palmeiras, e “ali” retoma Elim naturalmente.
