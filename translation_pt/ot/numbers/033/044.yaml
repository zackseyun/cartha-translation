base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: pt
  text: Partiram de Obote e acamparam em Ijé-Abarim[a], na fronteira de Moabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Iyê-Abarim”; o nome hebraico talvez contenha elementos relacionados a “ruínas” e a “Abarim”, possivelmente “regiões do outro lado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מֵאֹבֹת
  choice: de Obote
  rationale: A preposição מֵ indica origem, e אֹבֹת é nome de lugar; por isso, o topônimo é transliterado.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento; “acamparam” conserva o sentido concreto em linguagem atual.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: em Ijé-Abarim
  rationale: A expressão funciona como topônimo neste itinerário. A transliteração evita converter em tradução uma etimologia que permanece incerta.
- source_word: בִּגְבוּל
  choice: na fronteira de
  rationale: גְּבוּל pode indicar limite, fronteira ou território. Aqui, “na fronteira de” expressa diretamente a localização sem afirmar que o acampamento ficava no interior de Moabe.
- source_word: מוֹאָב
  choice: Moabe
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome geográfico.
