lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a partida de uma etapa. “Partiram” é natural e direto em português.
- source_word: מִיָּטְבָתָה
  choice: de Jotbatá
  rationale: A preposição מִן indica origem, traduzida por “de”. O topônimo יָטְבָתָה é transliterado na forma portuguesa Jotbatá.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, neste contexto de itinerário, significa estabelecer acampamento na etapa seguinte. “Acamparam” é corrente e preciso.
- source_word: בְּעַבְרֹנָה
  choice: em Abrona
  rationale: A preposição בְּ tem sentido locativo. Em português, “em” é a forma natural diante do nome do local; עַבְרֹנָה é transliterado como Abrona.
