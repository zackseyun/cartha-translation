source:
  edition: WLC
  text: וַ/יַּעַל֩ אַהֲרֹ֨ן הַ/כֹּהֵ֜ן אֶל הֹ֥ר הָ/הָ֛ר עַל פִּ֥י יְהוָ֖ה וַ/יָּ֣מָת שָׁ֑ם בִּ/שְׁנַ֣ת הָֽ/אַרְבָּעִ֗ים לְ/צֵ֤את בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִׁ֖י בְּ/אֶחָ֥ד לַ/חֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: pt
  text: Arão, o sacerdote, subiu ao monte Hor por ordem de Yahweh[a] e morreu ali, no quadragésimo ano depois que os israelitas saíram da terra do Egito, no quinto mês, no primeiro dia do mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a palavra de Yahweh”; literalmente, “sobre a boca de Yahweh”.
    reason: Registra a formulação alternativa e a imagem literal da expressão hebraica עַל פִּי.
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: O verbo עלה expressa movimento para cima; “subiu” é direto e natural em português.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do título כהן, mantido em aposição a Arão.
- source_word: אֶל הֹר הָהָר
  choice: ao monte Hor
  rationale: Emprega a forma geográfica consagrada em português e preserva Hor como nome próprio.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: A expressão significa literalmente “sobre a boca de Yahweh”, mas funciona idiomaticamente como obediência à sua palavra ou ordem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּמָת שָׁם
  choice: e morreu ali
  rationale: Reproduz de modo conciso o verbo e o advérbio locativo; o sujeito permanece claro em português.
- source_word: בִּשְׁנַת הָאַרְבָּעִים
  choice: no quadragésimo ano
  rationale: Forma portuguesa natural para a fórmula cronológica hebraica.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: depois que os israelitas saíram
  rationale: O infinitivo estabelece o êxodo como ponto de referência cronológico; “os israelitas” comunica o sentido nacional de בני ישראל.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Preserva o substantivo “terra” e expressa naturalmente em português a procedência.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: no quinto mês
  rationale: Tradução direta da indicação calendárica.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: Explicita com clareza a fórmula hebraica que indica o primeiro dia do mês.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Sentido de עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  alternative: segundo a palavra de Yahweh; literalmente, sobre a boca de Yahweh
  rationale: A opção principal transmite o valor idiomático de autorização ou mandamento, enquanto a nota preserva a imagem literal e a alternativa lexical.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A construção cronológica foi mantida próxima do hebraico sem soar artificial; o nome divino aparece como Yahweh de modo consistente.
