lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário de itinerário de Números, נסע indica a partida de um acampamento. “Partiram” é natural em português e expressa claramente o início da etapa seguinte.
- source_word: מֵעִיִּים
  choice: de Iim
  rationale: A preposição מֵ é traduzida por “de”. O topônimo עִיִּים é transliterado segundo a forma portuguesa corrente “Iim”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: O verbo חנה, nas fórmulas de itinerário, significa estabelecer ou montar acampamento. “Acamparam” é claro, atual e fiel ao sentido.
- source_word: בְּדִיבֹן גָּד
  choice: em Dibom-Gade
  rationale: A preposição בְּ diante de um lugar é naturalmente vertida por “em”. O nome composto é mantido como topônimo e adaptado à ortografia portuguesa.
