  text: וַ/יִּסְע֖וּ מֵ/אֵילִ֑ם וַֽ/יַּחֲנ֖וּ עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: pt
  text: Partiram de Elim e acamparam junto ao mar Vermelho[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mar dos Juncos”. O nome hebraico Yam Suf é tradicionalmente traduzido como “mar Vermelho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários do deserto, נסע indica a saída de um ponto de parada. “Partiram” é natural em português e preserva a sequência de deslocamentos.
- source_word: מֵאֵילִם
  choice: de Elim
  rationale: A preposição מִן indica origem, e אֵילִם é um nome de lugar, transliterado como “Elim”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: O verbo חנה é o termo habitual do itinerário para montar ou estabelecer acampamento. “Acamparam” é claro e corrente.
- source_word: עַל
  choice: junto ao
  rationale: Embora עַל frequentemente signifique “sobre”, neste contexto de acampamento à margem de uma extensão de água expressa proximidade; “junto ao” transmite naturalmente essa relação.
- source_word: יַם סוּף
  choice: mar Vermelho
  rationale: A expressão hebraica é tradicionalmente vertida como “mar Vermelho” e funciona aqui como designação geográfica reconhecida. A alternativa lexical “mar dos Juncos” é mantida em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com a fórmula concisa própria da lista de itinerários. Emprega-se “mar Vermelho” com inicial minúscula em “mar”, conforme uso corrente em textos bíblicos, e preserva-se a alternativa lexical em nota.
