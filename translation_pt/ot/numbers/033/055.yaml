base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: pt
  text: Mas, se vocês não expulsarem de diante de vocês os habitantes da terra, aqueles dentre eles que vocês deixarem permanecer serão como farpas nos seus olhos[a] e espinhos nos seus flancos[b]; eles os hostilizarão[c] na terra em que vocês estiverem morando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objetos pontiagudos nos seus olhos”. O substantivo hebraico é raro e designa algo agudo que perfura.
    reason: lexical_alternative
  - marker: b
    text: Ou “ganchos nos seus flancos”. As duas imagens descrevem uma aflição persistente e dolorosa causada pelos habitantes que permanecessem.
    reason: lexical_alternative
  - marker: c
    text: Ou “os afligirão” ou “os oprimirão”. O verbo hebraico pode abranger diferentes formas de hostilidade e sofrimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: expulsarem
  rationale: O hifil de ירשׁ indica fazer os habitantes perderem a posse e serem removidos. “Expulsar” expressa com naturalidade a remoção no contexto da ocupação da terra.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: os habitantes da terra
  rationale: Tradução direta e corrente da construção participial, com registro digno e claro.
- source_word: מִפְּנֵיכֶם
  choice: de diante de si
  rationale: Conserva a imagem espacial do hebraico, referente à remoção diante do avanço de Israel, sem soar excessivamente literal em português.
- source_word: תּוֹתִירוּ
  choice: deixarem ficar
  rationale: Expressa o sentido causativo de deixar alguém permanecer, sem acrescentar a ideia de misericórdia que “poupar” poderia sugerir.
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: como farpas nos seus olhos
  rationale: O substantivo raro denota algo agudo e perfurante. “Farpas” mantém a imagem dolorosa e a distingue dos “espinhos” da expressão seguinte.
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: espinhos nos seus flancos
  rationale: “Espinhos” comunica objetos pontiagudos que ferem; “flancos” preserva a metáfora corporal de צדים de modo compreensível e digno.
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: eles os hostilizarão
  rationale: צרר abrange hostilizar, afligir ou oprimir. “Hostilizar” preserva a amplitude da ação adversa sem intensificá-la necessariamente até “oprimir”.
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: na terra em que vocês estiverem morando
  rationale: Em português, “na terra” é a forma idiomática para עַל הָאָרֶץ neste contexto; a locução progressiva reflete o valor circunstancial e contínuo do particípio.
