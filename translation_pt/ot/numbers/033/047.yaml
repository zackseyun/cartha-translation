base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: pt
  text: Partiram de Almon-Diblataim e acamparam nos montes de Abarim, diante de Nebo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em frente a Nebo” ou “defronte de Nebo”. A preposição hebraica indica uma relação espacial, sem especificar com precisão a orientação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário de itinerário de Números 33, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: de Almon-Diblataim
  rationale: Trata-se de um topônimo, por isso foi transliterado. O hífen apresenta os elementos como um único nome de lugar.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento; “acamparam” é corrente e preserva a fórmula do itinerário.
- source_word: בְּהָרֵי
  choice: nos montes de
  rationale: O plural construto de הַר pode designar montes ou uma região montanhosa. “Nos montes de” reproduz de modo direto a expressão geográfica.
- source_word: הָעֲבָרִים
  choice: Abarim
  rationale: Aqui funciona como nome geográfico próprio, portanto é transliterado, sem traduzir sua associação etimológica com regiões do outro lado.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A expressão indica relação espacial de estar diante ou em frente, sem determinar por si só a orientação exata.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nome próprio geográfico transliterado conforme o uso tradicional e inteligível em português.
