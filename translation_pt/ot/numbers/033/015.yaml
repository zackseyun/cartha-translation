lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No formulário dos itinerários, נסע indica levantar acampamento e sair de uma etapa. “Partiram” é natural em português e expressa com clareza o movimento sem acrescentar detalhes.
- source_word: מֵרְפִידִם
  choice: de Refidim
  rationale: A preposição מִן, aqui assimilada, marca a origem. O topônimo רְפִידִם é transliterado segundo a forma portuguesa corrente “Refidim”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, neste contexto de itinerário, significa estabelecer acampamento. “Acamparam” é a forma corrente e concreta em português.
- source_word: בְּמִדְבַּר סִינָי
  choice: no deserto do Sinai
  rationale: מִדְבָּר designa uma região erma ou desértica, não necessariamente um areal. “Deserto” é a expressão portuguesa corrente neste topônimo bíblico, e a construção hebraica é representada por “do Sinai”.
