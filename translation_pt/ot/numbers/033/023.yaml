lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: No contexto dos itinerários, נסע indica levantar acampamento e seguir viagem. “Partiram” expressa isso com naturalidade e concisão em português.
- source_word: מִקְּהֵלָתָה
  choice: de Queelata
  rationale: O nome próprio é transliterado, e o prefixo מִן é traduzido por “de”.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה, nas fórmulas de itinerário do deserto, significa montar ou estabelecer acampamento; “acamparam” é claro e corrente.
- source_word: בְּהַר
  choice: no monte
  rationale: הַר seguido de nome próprio designa aqui um monte; a preposição ב é naturalmente vertida por “em”, contraída em “no”.
- source_word: שָׁפֶר
  choice: Sefer
  rationale: Transliteração portuguesa aproximada do nome hebraico שָׁפֶר, ajustada à leitura natural em português.
