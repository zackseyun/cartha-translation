  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: pt
  text: Tomem posse da terra e habitem nela, pois eu lhes dei a terra para que tomem posse dela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que a herdem”. O verbo hebraico ירשׁ pode significar tanto tomar posse como herdar, especialmente em contextos ligados à promessa da terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: Tomem posse da
  rationale: Embora o hifil de ירשׁ possa expressar desapossar ou expulsar, o objeto direto aqui é “a terra”, não seus habitantes. “Tomem posse da terra” comunica em português natural o resultado pretendido, sem sugerir que a própria terra seja expulsa.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: É a designação habitual do território prometido neste contexto e preserva a linguagem bíblica da promessa da terra.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: e habitem nela
  rationale: ישׁב indica morar, habitar ou estabelecer-se. “Habitem nela” é claro, digno e mantém a ideia de ocupação permanente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem. “Pois” preserva de maneira natural e concisa a força causal.
- source_word: לָכֶם נָתַתִּי
  choice: eu lhes dei
  rationale: O perfeito apresenta a dádiva divina como ato realizado que fundamenta a ordem. O pretérito perfeito português expressa isso naturalmente.
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: para que tomem posse dela
  rationale: O infinitivo expressa a finalidade da dádiva. A locução explicita essa relação e reproduz o sentido de posse territorial de ירשׁ.
theological_decisions:
- issue: Sentido de ירשׁ no contexto da promessa da terra
  choice: tomar posse
  alternative: herdar
  rationale: O contexto imediato enfatiza a ocupação efetiva da terra dada por Deus. “Herdar” é uma possibilidade lexical legítima e conserva ressonâncias da aliança, mas poderia destacar uma noção sucessória que não é explícita; por isso, fica registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural para reproduzir a força de ordem da construção hebraica. “Habitem” é corrente em registro bíblico sem ser arcaico; “lhes” favorece ampla legibilidade, especialmente brasileira.
