id: NUM.8.16
reference: Numbers 8:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: pt
  text: Pois eles me foram inteiramente dados dentre os filhos de Israel[a]. Em lugar de todo aquele que abre o ventre — todo primogênito entre os filhos de Israel[b][c] —, eu os tomei para mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certamente dados a mim” ou “dados por completo a mim”; o hebraico repete “dados” para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “todo aquele que abre o ventre”, expressão que se refere ao primogênito.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou “entre o povo de Israel” ou “entre os israelitas”; hebraico: “entre os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: inteiramente dados
  rationale: A repetição do particípio passivo de נתן intensifica a ideia. “Inteiramente dados” comunica essa ênfase em português natural, sem reproduzir uma repetição pouco idiomática.
- source_word: לִי
  choice: me
  rationale: O primeiro לִי indica que os levitas foram entregues e consagrados a Deus; “me foram ... dados” expressa isso com clareza.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dentre os filhos de Israel
  rationale: מִתּוֹךְ indica seleção no interior de um grupo. “Dentre” é conciso e preciso, e “filhos de Israel” conserva a expressão familiar masculina do hebraico.
- source_word: תַּחַת
  choice: em lugar de
  rationale: 'Neste contexto, תַּחַת assinala substituição: os levitas são tomados no lugar dos primogênitos.'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: todo aquele que abre o ventre
  rationale: A tradução preserva a imagem do idioma hebraico, que designa aquele que primeiro sai do ventre, isto é, o primogênito.
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: todo primogênito entre os filhos de Israel
  rationale: A frase funciona em aposição e esclarece o idioma anterior. O travessão torna essa relação clara sem apagar a formulação hebraica.
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: eu os tomei para mim
  rationale: O perfeito expressa a ação divina consumada, e o לִי final reforça a apropriação pessoal; “para mim” preserva essa ênfase.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel; israelitas
  rationale: A expressão hebraica é literalmente masculina e familiar. Mantê-la conserva a forma do texto, embora no contexto designe Israel coletivamente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem e a imagem do hebraico foram preservadas onde permanecem compreensíveis; o travessão explicita a aposição entre a expressão idiomática e “primogênito”.
