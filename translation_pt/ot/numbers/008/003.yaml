base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: pt
  text: 'Arão fez assim: dispôs as suas lâmpadas[b] voltadas para a frente do candelabro[a], exatamente como Yahweh havia ordenado a Moisés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em frente ao candelabro” ou “em direção à frente do candelabro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “acendeu as suas lâmpadas”. O verbo hebraico significa literalmente fazê-las subir e, neste contexto, pode se referir a dispô-las ou a acendê-las.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: Arão fez assim
  rationale: Reproduz naturalmente o sentido idiomático de que Arão cumpriu a instrução anterior, preservando a retomada marcada por כֵּן.
- source_word: אֶל מוּל פְּנֵי
  choice: diante da parte da frente de
  rationale: Expressa a orientação das lâmpadas em relação à face ou parte frontal do candelabro sem definir em excesso a disposição espacial; a nota registra alternativas possíveis.
- source_word: הַמְּנוֹרָה
  choice: o candelabro
  rationale: É o equivalente português comum e inteligível para o suporte de lâmpadas do santuário, evitando uma transliteração desnecessária.
- source_word: הֶעֱלָה
  choice: colocou
  rationale: O hifil de עלה significa literalmente fazer subir e, com lâmpadas, pode indicar dispô-las/instalá-las ou acendê-las. No contexto imediato, 'colocou' comunica a disposição prescrita sem eliminar a alternativa contextual 'acendeu', registrada em nota.
- source_word: נֵרֹתֶיהָ
  choice: as suas lâmpadas
  rationale: Mantém o referente concreto de נֵר e o sufixo feminino singular, que remete ao candelabro.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exatamente como Yahweh havia ordenado a Moisés
  rationale: Comunica a conformidade precisa com a ordem divina e usa uma sequência verbal natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de traduzir o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; 'Yahweh' preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Sentido de הֶעֱלָה em relação às lâmpadas
  choice: colocou, com nota alternativa 'acendeu'
  alternative: acendeu
  rationale: A forma causativa admite a ideia de fazer subir, instalar ou pôr em funcionamento as lâmpadas. O contexto enfatiza sua disposição e orientação, mas não permite excluir com segurança o sentido de acendê-las.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das notas segue a ocorrência dos marcadores no texto. 'Candelabro' foi preferido a 'menorá' por ser vocabulário comum; a ambiguidade do verbo relativo às lâmpadas foi preservada por nota.
