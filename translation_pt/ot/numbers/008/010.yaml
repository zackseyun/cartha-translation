  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: pt
  text: Você apresentará os levitas diante de Yahweh, e os filhos de Israel[a] imporão as mãos sobre os levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. O hebraico diz literalmente “os filhos de Israel”, expressão coletiva comum para o povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Você fará ... se aproximarem
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. A formulação mantém a nuance causativa e soa natural no contexto ritual.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Equivalente português corrente da designação plural definida.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica estar diante de ou na presença de alguém; “diante de” preserva de modo conciso a dimensão espacial e ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: וְסָמְכוּ ... אֶת יְדֵיהֶם עַל
  choice: imporão as mãos sobre
  rationale: No contexto ritual, סמך com “mãos” e עַל corresponde à expressão portuguesa estabelecida “impor as mãos sobre”.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma hebraica masculina plural e sua expressão coletiva convencional, sem ocultar a construção original.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido coletivo de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução principal conserva a forma explícita do hebraico, enquanto a nota esclarece seu uso coletivo convencional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Impor as mãos” mantém a linguagem ritual consagrada sem arcaísmo excessivo.
