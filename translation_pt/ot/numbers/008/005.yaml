  text: 'E Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com a forma narrativa prefixada por ו, introduz a fórmula convencional de discurso. “Falou” mantém a distinção lexical e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: אֶל
  choice: a
  rationale: Marca o destinatário da fala; “a” é uma equivalência clara e natural neste contexto.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma portuguesa convencional do nome próprio.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz o discurso direto que vem a seguir. “Dizendo” preserva a fórmula hebraica e conecta naturalmente este versículo ao próximo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome pessoal sem substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da fórmula hebraica. Mantém-se “dizendo” porque o versículo funciona como introdução ao discurso subsequente.
