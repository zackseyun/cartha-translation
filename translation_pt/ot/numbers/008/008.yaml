base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: pt
  text: Depois, eles pegarão um novilho e sua oferta de cereal, feita de farinha fina misturada com azeite; e você pegará um segundo novilho como oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como oferta de purificação”. Em contextos rituais sacerdotais, o termo hebraico חַטָּאת pode designar a oferta pelo pecado ou a oferta de purificação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Depois, eles pegarão
  rationale: O perfeito qal com waw dá continuidade à sequência de instruções; o futuro expressa naturalmente a força prescritiva em português, e “Depois” explicita a progressão.
- source_word: פַּר בֶּן בָּקָר
  choice: um novilho
  rationale: A expressão idiomática hebraica, literalmente “touro, filho do gado”, designa um bovino macho jovem. “Novilho” é conciso e natural.
- source_word: וּמִנְחָתוֹ
  choice: e, como oferta de cereal que o acompanha
  rationale: No contexto sacrificial, מִנְחָה é uma oferta de cereal. O sufixo masculino singular remete ao primeiro novilho; a formulação torna clara essa relação sem sugerir que a farinha pertence fisicamente ao animal.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo cultual usual para farinha de moagem fina empregada nas ofertas.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: misturada com azeite
  rationale: Reproduz com clareza a fórmula de preparo sacrificial; “azeite” é a designação natural do óleo de oliva nesse contexto.
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: e você pegará um segundo novilho
  rationale: Preserva a mudança do plural para a segunda pessoa masculina singular em תִּקַּח e traduz שֵׁנִי pelo ordinal “segundo”.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: Mantém a designação tradicional e amplamente reconhecida do sacrifício, enquanto a possível ênfase ritual na purificação é registrada em nota.
theological_decisions:
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo hebraico pode designar tanto o pecado quanto o sacrifício associado à sua remoção e à purificação ritual. O texto principal conserva a tradução tradicional sem excluir a alternativa funcional, apresentada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Novilho”, “oferta de cereal”, “farinha fina” e “azeite” mantêm o vocabulário ritual claro. A mudança de pessoa verbal do hebraico foi preservada.
