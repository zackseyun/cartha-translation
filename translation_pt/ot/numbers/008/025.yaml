base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: pt
  text: A partir dos cinquenta anos de idade, ele se retirará do serviço do trabalho e não servirá mais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retornará do serviço do trabalho”. O verbo hebraico significa literalmente “voltar” ou “retornar”, mas aqui tem o sentido de retirar-se do serviço ativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: A partir dos cinquenta anos de idade
  rationale: A expressão hebraica indica o limiar de idade a partir do qual a determinação passa a valer; esta formulação é clara e natural em português.
- source_word: יָשׁוּב
  choice: ele se retirará
  rationale: Embora o verbo signifique literalmente “voltar/retornar”, com מִן neste contexto administrativo indica afastar-se ou retirar-se do serviço ativo, sem ocultar a alternativa literal, registrada em nota.
- source_word: מִצְּבָא
  choice: do serviço
  rationale: צָבָא pode designar hoste, dever ou serviço; aqui se refere ao serviço atribuído aos levitas, não à atividade militar.
- source_word: הָעֲבֹדָה
  choice: do trabalho
  rationale: Mantém distinto o sentido de עֲבֹדָה e preserva a combinação hebraica entre serviço e trabalho, apesar de sua leve redundância em português.
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: e não servirá mais
  rationale: No contexto levítico, עבד designa o exercício do serviço atribuído; “não servirá mais” comunica de modo natural a cessação da função ativa.
