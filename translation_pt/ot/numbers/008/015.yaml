base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: pt
  text: Depois disso, os levitas virão para servir na tenda do encontro. Você os purificará[a] e os apresentará como oferta movida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os tornará ritualmente puros”. O verbo hebraico se refere à purificação cerimonial.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, você os apresentará cerimonialmente diante do SENHOR no rito da oferta movida.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: Depois disso
  rationale: Marca com naturalidade a sequência temporal explícita após os ritos anteriores.
- source_word: יָבֹ֣אוּ הַ/לְוִיִּ֔ם
  choice: os levitas entrarão
  rationale: בוא pode significar vir ou entrar; aqui indica que os levitas se aproximam da tenda para iniciar o serviço. “Entrarão” se ajusta bem ao local mencionado.
- source_word: לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד
  choice: para servir na tenda do encontro
  rationale: עבד designa serviço cultual, sem implicar necessariamente funções sacerdotais. A construção portuguesa explicita de modo idiomático o âmbito desse serviço.
- source_word: וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם
  choice: Você os purificará
  rationale: טהר indica purificação ritual. “Purificará” comunica diretamente esse sentido cerimonial.
- source_word: וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה
  choice: e os moverá como oferta movida
  rationale: Preserva a imagem ritual marcante do Hifil de נוף com תְּנוּפָה e mantém os próprios levitas como objeto da ação, sem reduzir o rito a uma apresentação genérica.
theological_decisions:
- issue: Linguagem ritual da consagração dos levitas
  choice: 'Manter termos cultuais explícitos: “purificará” e “oferta movida”.'
  alternative: Parafrasear como “consagrará e apresentará”.
  rationale: O texto descreve atos rituais específicos, não apenas uma nomeação ou comissão genérica. A formulação conserva a tensão da imagem em que os próprios levitas são movidos como oferta.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. “Tenda do encontro” mantém a designação cultual tradicional em forma compreensível; “oferta movida” preserva o vocabulário ritual e a imagem concreta do hebraico.
