review_pass:
  verdict: revise
  source_fidelity: A sequência temporal, os levitas, o serviço ligado à tenda do encontro e a purificação ritual foram bem representados. Contudo, «entrarão» restringe indevidamente יָבֹאוּ («virão/irão»), e «os moverá» não é uma formulação portuguesa natural nem comunica com clareza o rito de apresentação indicado pelo hebraico.
  naturalness: «Oferta movida» é terminologia cultual compreensível, mas o verbo «mover» aplicado a pessoas soa mecânico e pouco idiomático em português. «Os apresentará como oferta movida» preserva o fato marcante de que os levitas são o objeto da ação ritual, com redação natural.
  terminology: «Levitas», «tenda do encontro», «purificará» e «oferta movida» são adequados. A nota de purificação ritual é útil; a nota cultural deve explicar que «oferta movida» designa uma apresentação ritual, sem substituir o sentido no texto.
  issues:
  - severity: medium
    issue: «entrarão» para יָבֹאוּ
    rationale: O verbo hebraico significa primariamente «virão» neste contexto. «Entrarão» acrescenta a noção espacial de entrada e pode ser inadequado, pois o serviço levítico não deve ser formulado como uma entrada no santuário.
  - severity: medium
    issue: «os moverá como oferta movida»
    rationale: Embora procure conservar a imagem de תנופה, «mover» nesse uso não é idiomático em português e obscurece o caráter de apresentação ritual. «Os apresentará como oferta movida» transmite o ato cultual de modo claro, sem apagar os levitas como objeto do rito.
  revised_text: Depois disso, os levitas virão para servir na tenda do encontro. Você os purificará[a] e os apresentará como oferta movida[b].
