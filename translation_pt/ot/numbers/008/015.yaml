  rationale: A revisão troca «entrarão» por «virão», evitando uma especificação espacial não exigida pelo hebraico, e substitui o pouco natural «os moverá» por «os apresentará como oferta movida». Esta última formulação conserva a apresentação ritual dos próprios levitas e o termo cultual estabelecido, enquanto a nota explicita o sentido do rito.
