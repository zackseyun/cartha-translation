  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: pt
  text: Os levitas se purificaram e lavaram suas roupas. Então Arão os apresentou como oferta movida diante de Yahweh e fez expiação por eles, a fim de purificá-los.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: se purificaram
  rationale: O hitpael de חטא, neste contexto sacerdotal, indica que os levitas passaram por purificação ritual. A tradução reflexiva preserva a forma verbal sem acrescentar explicitamente “do pecado”, elemento não expresso de modo separado no hebraico.
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: lavaram suas roupas
  rationale: Expressão natural e atual em português para a lavagem ritual das vestes, sem perder o sentido concreto de בגד.
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: os apresentou como oferta movida
  rationale: A construção é uma expressão ritual de apresentação perante Yahweh. “Oferta movida” conserva o termo cultual tradicional, enquanto “apresentou” evita sugerir com excessiva certeza como os levitas foram fisicamente movimentados.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a ideia de apresentação na presença divina e translitera o nome da aliança expresso pelo Tetragrama.
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: fez expiação por eles
  rationale: Em contexto sacerdotal, כפר designa o ato ritual de fazer expiação. A formulação é clara, consagrada e não impõe uma teoria posterior específica da expiação.
- source_word: לְטַהֲרָם
  choice: a fim de purificá-los
  rationale: O infinitivo indica a finalidade ou o resultado da ação expiatória de Arão. “Purificá-los” mantém a linguagem de pureza ritual de טהר.
theological_decisions:
- issue: Relação entre purificação, expiação e pureza ritual
  choice: Distinguir “se purificaram”, “fez expiação” e “purificá-los”
  alternative: Empregar “limpar” ou “purificar” para todos os verbos
  rationale: O texto reúne conceitos sacerdotais relacionados, mas não idênticos. A redação mantém a ação reflexiva dos levitas, a ação expiatória de Arão e a finalidade purificadora, sem definir além do texto como esses atos se relacionam.
- issue: Sentido da apresentação dos levitas como תְּנוּפָה
  choice: “os apresentou como oferta movida”
  alternative: “os moveu como oferta movida”
  rationale: A tradução preserva a categoria ritual e a possível noção de movimento, mas não transforma em descrição física inequívoca uma expressão cultual cujo modo exato de execução não é declarado neste versículo.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome próprio e segue a orientação fornecida.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A coordenação hebraica foi suavizada com divisão em duas frases e “Então”, sem alterar a sequência dos atos. “Roupas” foi preferido a “vestes” por ser mais corrente; os termos cultuais “oferta movida” e “expiação” foram mantidos por sua importância no contexto.
