  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: pt
  text: “Separe os levitas do meio dos filhos de Israel e purifique-os.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas” ou “do povo de Israel”. Literalmente, “dos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Separe
  rationale: Embora o sentido básico seja “tomar”, neste contexto o imperativo ordena que os levitas sejam retirados do conjunto de Israel para uma função específica; “separe” expressa naturalmente essa ação em português.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designa o grupo tribal destinado ao serviço do santuário; “os levitas” é a forma tradicional, clara e precisa em português.
- source_word: מִתּוֹךְ
  choice: do meio de
  rationale: Preserva a ideia espacial e corporativa de retirar um grupo de dentro de outro, em linguagem portuguesa natural.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica literalmente e conserva sua nuance familiar e pactual, sem impedir que o leitor entenda a referência coletiva ao povo israelita.
- source_word: וְטִהַרְתָּ אֹתָם
  choice: e purifique-os
  rationale: O verbo טהר, neste contexto ritual, indica tornar ritualmente puros; “purifique-os” comunica isso com clareza e dignidade.
theological_decisions:
- issue: Sentido corporativo de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução mantém a forma masculina plural e a imagem de descendência presentes no hebraico. Uma nota registra equivalentes coletivos naturais sem apagar a formulação familiar do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Separe” evita a possível impressão de simples posse transmitida por “tome” e explicita a separação indicada pelo contexto e por מִתּוֹךְ; a nota preserva a literalidade e as alternativas idiomáticas de בְּנֵי יִשְׂרָאֵל.
