  text: וָ/אֶקַּח֙ אֶת הַ/לְוִיִּ֔ם תַּ֥חַת כָּל בְּכ֖וֹר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/018.yaml
  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: pt
  text: E tomei os levitas no lugar de cada primogênito entre os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os israelitas”. O hebraico diz literalmente “entre os filhos de Israel”.'
    reason: Alternativa lexical que esclarece o sentido corporativo da expressão hebraica sem apagar sua forma no texto principal.
lexical_decisions:
- source_word: וָאֶקַּח
  choice: E tomei
  rationale: O qal wayyiqtol na primeira pessoa do singular de לקח tem o sentido narrativo normal de “e tomei”. Preserva a concretude do verbo sem explicitar além do hebraico a função para a qual os levitas foram tomados.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Plural definido que designa especificamente os levitas; esta é a forma tradicional, precisa e natural em português.
- source_word: תַּחַת
  choice: no lugar de
  rationale: Neste contexto, תַּחַת indica substituição, não posição espacial. “No lugar de” comunica claramente essa relação representativa.
- source_word: כָּל בְּכוֹר
  choice: cada primogênito
  rationale: Com o substantivo singular בְּכוֹר, כָּל tem força distributiva. “Cada primogênito” reproduz isso sem acrescentar “homem” ou “do sexo masculino”, ausente neste versículo.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Preserva a expressão hebraica literalmente masculina בְּנֵי יִשְׂרָאֵל, enquanto “entre” expressa de modo idiomático o sentido social ou partitivo da preposição בְּ.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: O hebraico diz literalmente “filhos de Israel”. A tradução principal conserva essa forma e sua referência corporativa ao povo da aliança, enquanto a nota registra a alternativa portuguesa mais idiomática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a concisão do hebraico foram preservadas; “E tomei” mantém a continuidade narrativa, e “no lugar de” comunica naturalmente a substituição.
