  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: pt
  text: 'E assim você fará com eles para purificá-los: asperja sobre eles a água para purificação[a]; que eles passem uma navalha por todo o corpo[b], lavem as suas roupas e se purifiquem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a água de purificação”; literalmente, “água de pecado”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por toda a carne deles”; isto é, eles deviam raspar o corpo inteiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: E assim você fará com eles
  rationale: Mantém a ligação com o contexto anterior e o tom de prescrição ritual, reproduzindo de modo natural a construção diretiva hebraica.
- source_word: לְטַהֲרָם
  choice: para purificá-los
  rationale: Em contexto ritual, טהר indica tornar ritualmente puro. “Purificar” comunica essa dimensão cultual com clareza em português.
- source_word: הַזֵּה עֲלֵיהֶם
  choice: asperja sobre eles
  rationale: O verbo no hifil descreve a aspersão ritual; “aspergir” é preciso, corrente em contextos cerimoniais e mantém um registro digno.
- source_word: מֵי חַטָּאת
  choice: a água para purificação do pecado
  rationale: A expressão significa literalmente “água de pecado”, mas designa água empregada numa purificação ligada ao pecado ou à impureza. A formulação explicita a função sem acrescentar a palavra “oferta”, ausente no hebraico.
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: que eles passem uma navalha por todo o corpo
  rationale: Preserva a imagem concreta de fazer uma navalha passar, enquanto “corpo” transmite naturalmente o referente contextual de בשר em português.
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: lavem as suas roupas
  rationale: כבס designa especificamente lavar peças de tecido; “roupas” é moderno e natural.
- source_word: וְהִטֶּהָרוּ
  choice: e se purifiquem
  rationale: A forma reflexiva é representada por “se purifiquem”, mantendo a conclusão ritual da sequência sem convertê-la apenas em limpeza física.
theological_decisions:
- issue: Natureza da purificação na consagração dos levitas
  choice: Usar linguagem de purificação ritual sem reduzi-la à limpeza física nem defini-la exclusivamente como purificação moral.
  alternative: Traduzir toda a linguagem como “limpar” ou interpretar חטאת explicitamente como “oferta pelo pecado”.
  rationale: O contexto descreve um rito concreto de consagração. “Purificar” preserva seu caráter cultual, e “água para purificação do pecado” mantém a relação ambígua com pecado e impureza sem inserir um sacrifício que o versículo não menciona expressamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para o destinatário singular e formas no plural para os levitas. A pontuação organiza as etapas do rito sem alterar sua sequência.
