revisions:
- from: E depois disso, os levitas vieram prestar seu serviço na tenda do encontro, diante de Arão e de seus filhos. Assim como Yahweh havia ordenado a Moisés a respeito dos levitas, assim fizeram por eles.[a]
  to: E depois disso, os levitas vieram prestar seu serviço na tenda do encontro, diante de Arão e de seus filhos. Assim como Yahweh havia ordenado a Moisés a respeito dos levitas, assim fizeram com eles.[a]
  rationale: A única alteração substitui «por eles» por «com eles», que expressa de modo mais neutro e natural a relação indicada pelo dativo לָהֶם e preserva a elipse do hebraico. A nota mantém uma alternativa dativa próxima da forma hebraica e explica a referência ritual contextual.
