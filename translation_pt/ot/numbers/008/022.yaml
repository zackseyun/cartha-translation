base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: pt
  text: E depois disso, os levitas vieram prestar seu serviço na tenda do encontro, diante de Arão e de seus filhos. Assim como Yahweh havia ordenado a Moisés a respeito dos levitas, assim fizeram com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim lhes fizeram”. O hebraico é conciso e pode referir-se à realização dos ritos prescritos em relação aos levitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: E depois disso
  rationale: Preserva tanto o conectivo quanto a sequência temporal em português natural.
- source_word: בָּאוּ הַלְוִיִּם
  choice: os levitas vieram
  rationale: Traduz diretamente o verbo comum de movimento sem especificar indevidamente que entraram na tenda.
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: prestar seu serviço
  rationale: Expressa de modo idiomático o serviço cultual e evita a repetição pouco natural de 'servir seu serviço'.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Mantém a preposição e traduz de maneira clara a designação do santuário.
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: diante de Arão e de seus filhos
  rationale: Preserva o sentido espacial ou relacional de לִפְנֵי sem explicitar como supervisão aquilo que o hebraico deixa implícito.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Assim como Yahweh havia ordenado a Moisés
  rationale: Reproduz a relação de conformidade e situa naturalmente a ordem antes de seu cumprimento.
- source_word: עַל הַלְוִיִּם
  choice: a respeito dos levitas
  rationale: Apresenta os levitas como assunto ou referente da ordem sem restringir excessivamente a relação indicada por עַל.
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: assim fizeram por eles
  rationale: Mantém a concisão e o sujeito plural implícito do hebraico; 'por eles' preserva uma possível ideia de benefício, enquanto a nota registra a alternativa mais literal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração 'Yahweh' o preserva em vez de substituí-lo por um título.
- issue: Referente do sujeito em כֵּן עָשׂוּ לָהֶם
  choice: 'manter o plural não explicitado: ''assim fizeram por eles'''
  alternative: explicitar Arão e seus filhos como sujeito; usar construção passiva
  rationale: O hebraico não repete o sujeito. A tradução preserva essa concisão e evita resolver silenciosamente uma referência contextual implícita.
- issue: Valor de לָהֶם
  choice: por eles
  alternative: a eles
  rationale: O dativo pode indicar benefício ou relação com as pessoas submetidas aos ritos. A leitura principal usa 'por eles', mas a nota conserva a alternativa e a tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Prestar seu serviço' soa natural no contexto cultual; 'tenda do encontro' mantém a transparência da expressão hebraica. O marcador [a] aparece no texto imediatamente após a oração a que se refere.
