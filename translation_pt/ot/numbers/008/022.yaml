review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem a sequência, o serviço cultual, a designação da Tenda do Encontro, a relação diante de Arão e seus filhos e o nome divino. Contudo, no fecho, «por eles» introduz em português uma noção de benefício que não é exigida por לָהֶם e enfraquece a formulação concisa «fizeram a/com eles» do hebraico.
  naturalness: «Prestar seu serviço» e «tenda do encontro» são naturais e adequados ao registro. «Assim fizeram por eles», porém, soa pouco idiomático neste contexto e pode sugerir que algo foi feito em favor dos levitas, em vez de atos realizados com relação a eles.
  terminology: «Levitas», «tenda do encontro», «Arão» e «Yahweh» estão consistentes e apropriados. «Serviço» comunica adequadamente a função cultual sem impor linguagem eclesiástica posterior.
  issues:
  - severity: medium
    issue: «assim fizeram por eles» traduz לָהֶם com um beneficiário excessivamente específico.
    rationale: O dativo hebraico é elíptico e, no contexto dos ritos relativos aos levitas, admite mais diretamente «com eles» ou «a eles». «Por eles» pode ser possível em certos contextos, mas em português desloca o sentido para benefício/intercessão. «Com eles» preserva a referência aos levitas sem resolver além do necessário a natureza exata das ações.
  revised_text: E depois disso, os levitas vieram prestar seu serviço na tenda do encontro, diante de Arão e de seus filhos. Assim como Yahweh havia ordenado a Moisés a respeito dos levitas, assim fizeram com eles.[a]
  revised_footnotes:
