  yaml_path: translation/ot/numbers/008/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O wayyiqtol faz a narrativa avançar e pode ser representado naturalmente por “E”; o verbo דבר é vertido por “falou”, enquanto לֵאמֹר introduz o conteúdo da fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca aqui a pessoa a quem a fala é dirigida; “a” é natural em português com “falar”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz diretamente a fala apresentada no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente pelo título tradicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve preservação da cadência narrativa hebraica. A construção “falou a Moisés, dizendo” mantém a fórmula da fonte sem soar arcaica.
