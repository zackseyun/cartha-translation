base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: pt
  text: 'A obra do candelabro era esta: ouro trabalhado a martelo[a]; da sua base até às suas flores, era todo trabalhado a martelo. Conforme o modelo que Yahweh havia mostrado a Moisés[b], assim ele fez o candelabro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouro batido”. O hebraico destaca que o candelabro foi trabalhado por martelagem; alguns também entendem o termo como indicando que era feito de uma só peça.'
    reason: lexical_alternative
  - marker: b
    text: “Conforme o modelo” também pode ser traduzido por “conforme a aparência” ou “conforme a visão” que Yahweh mostrou a Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: feitura
  rationale: Expressa a forma de fabricação e o trabalho artesanal do candelabro. A construção “tinha esta feitura” é digna e compreensível em português, sem acrescentar um marcador temporal inexistente no hebraico.
- source_word: הַמְּנֹרָה
  choice: o candelabro
  rationale: Traduz o nome do objeto cultual em vez de transliterá-lo; “candelabro” é a designação bíblica corrente e clara em português.
- source_word: מִקְשָׁה
  choice: obra de ouro batido / obra batida
  rationale: O termo descreve metal trabalhado a martelo. A repetição de “obra” e “batida” preserva a ênfase repetida do hebraico; a possível noção de peça única fica registrada em nota, sem ser imposta ao texto.
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: da base até a flor
  rationale: O par delimita toda a extensão do candelabro. יָרֵךְ designa aqui sua parte inferior ou base, e פֶּרַח, no singular, sua ornamentação em forma de flor.
- source_word: כַּמַּרְאֶה
  choice: conforme o modelo
  rationale: No contexto da construção do santuário, refere-se à forma visual mostrada a Moisés. “Modelo” comunica esse sentido com clareza, enquanto “aparência” e “visão” permanecem como alternativas legítimas em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal em forma reconhecível e coerente com a política do projeto.
- source_word: כֵּן עָשָׂה
  choice: assim ele fez
  rationale: Preserva a correlação “conforme... assim...” e a voz ativa do verbo hebraico. O sujeito continua sem identificação expressa, como no original.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: A forma “Yahweh” representa o nome próprio no texto em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Sujeito implícito de עָשָׂה
  choice: assim ele fez
  alternative: assim foi feito
  rationale: O hebraico emprega verbo ativo singular, mas não nomeia o agente. A tradução mantém a voz ativa e o pronome sem identificar além do que o contexto permite; a alternativa passiva apagaria essa característica.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de “obra... batida” é deliberada para refletir a repetição enfática do hebraico; “feitura” mantém o sentido artesanal sem recorrer a linguagem excessivamente técnica.
