  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: pt
  text: Arão apresentará os levitas como oferta movida diante de Yahweh, dentre os filhos de Israel[a][b], e eles serão para realizar o serviço de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos filhos de Israel». A expressão hebraica indica que os levitas são tomados dentre os filhos de Israel.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ter, no contexto, o sentido de «em favor dos filhos de Israel», indicando que os levitas são apresentados como seus representantes no serviço de Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: apresentará ... como oferta movida
  rationale: O verbo no hifil e o substantivo cognato descrevem uma apresentação ritual. “Apresentará” evita sugerir que Arão tenha de agitar fisicamente os levitas, enquanto “oferta movida” conserva o termo ritual tradicional.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação corrente e clara do grupo tribal.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Reproduz naturalmente o idioma hebraico de presença cultual e mantém o nome divino.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: da parte dos filhos de Israel
  rationale: A expressão pode indicar procedência ou representação. “Da parte de” preserva essa abertura melhor que uma formulação exclusivamente espacial.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: e eles ficarão encarregados de realizar o serviço de Yahweh
  rationale: Expressa o resultado e a finalidade da apresentação em português natural, conservando a ênfase no serviço cultual atribuído aos levitas.
theological_decisions:
- issue: Os levitas descritos como oferta movida
  choice: apresentará os levitas como oferta movida
  alternative: moverá os levitas como oferta movida
  rationale: Mantém a categoria ritual sem dar a entender que os levitas seriam sacrificados ou necessariamente agitados de modo literal.
- issue: Sentido de מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: da parte dos filhos de Israel
  alternative: dentre os filhos de Israel / em favor dos filhos de Israel
  rationale: O hebraico admite uma nuance de origem e, no contexto, também de representação; a tradução não deve eliminar essa tensão.
- issue: Designação בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas / povo de Israel
  rationale: Conserva a forma da designação coletiva hebraica sem impor uma reformulação interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem sintática natural. Mantém “Yahweh”, “oferta movida” e “filhos de Israel” por sua relevância lexical e cultual.
