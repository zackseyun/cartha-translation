base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol de דבר introduz o acontecimento seguinte na narrativa. “Então ... falou” expressa naturalmente a progressão e mantém o verbo de fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; em português, “falou a Moisés” é uma construção natural e clara.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula de introdução do discurso, os dois-pontos comunicam de modo natural em português que a fala direta vem a seguir, evitando o pouco idiomático “falou... dizendo” no fim isolado do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo pelo título tradicional, enquanto a nota informa essa tradição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos reproduzem funcionalmente a fórmula לֵאמֹר e preparam a fala iniciada no versículo seguinte.
