base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: pt
  text: 'Isto é o que se aplica aos levitas: dos vinte e cinco anos de idade em diante, o levita se apresentará para cumprir seu dever[a] no serviço da tenda do encontro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para prestar serviço”. A expressão hebraica descreve o cumprimento de uma função organizada e contém conotações militares.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר
  choice: Isto é o que se aplica
  rationale: Introduz uma norma referente aos levitas, preservando a força instrutiva da construção hebraica em português natural.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Tradução direta da designação do grupo.
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: a partir dos vinte e cinco anos de idade
  rationale: Expressa com clareza e naturalidade o limite mínimo de idade indicado pelo idioma hebraico.
- source_word: יָבוֹא
  choice: se apresentará
  rationale: No contexto de assumir uma função oficial, comunica o movimento de comparecer ou entrar para o serviço sem reduzir o verbo a uma simples indicação espacial.
- source_word: לִצְבֹא צָבָא
  choice: para cumprir seu dever
  rationale: Representa a expressão idiomática de prestação de serviço organizado, mantendo no termo “dever” um leve matiz de convocação ou disciplina; a alternativa mais literal é registrada em nota.
- source_word: בַּעֲבֹדַת
  choice: no serviço da
  rationale: עֲבֹדָה designa aqui o trabalho ou serviço oficialmente atribuído no santuário.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Forma clara e tradicional para a designação hebraica da tenda sagrada onde se dava o encontro determinado por Deus.
theological_decisions:
- issue: Verbo no singular com referente coletivo
  choice: o levita se apresentará
  alternative: os levitas se apresentarão
  rationale: O hebraico passa da referência coletiva aos levitas para um verbo no singular. A formulação portuguesa mantém a aplicação individual da norma sem tornar o referente obscuro.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição pouco natural de termos equivalentes a “servir/serviço” foi evitada, sem apagar o caráter formal e organizado da função levítica.
