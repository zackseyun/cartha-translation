base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: pt
  text: Ele, porém, poderá servir junto com seus irmãos na tenda do encontro, para cumprir o encargo[a], mas não realizará o trabalho de serviço[b]. Assim você fará com os levitas em seus encargos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guardar o encargo” ou “cumprir o dever”. A expressão hebraica indica a observância de uma responsabilidade atribuída e não exige, por si só, o sentido restrito de guarda física.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “mas não fará serviço” ou “mas não trabalhará”. A construção hebraica contrasta o serviço ainda permitido com a atividade de serviço da qual o levita mais velho estava dispensado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: Ele, porém, poderá servir
  rationale: שרת denota serviço ou ministério, especialmente em contexto sagrado. O valor permissivo decorre do contraste contextual com a aposentadoria do serviço regular no versículo anterior; “porém” explicita esse contraste sem transformar a participação permitida em obrigação absoluta.
- source_word: אֶת־אֶחָיו
  choice: junto com seus irmãos
  rationale: 'Após שרת, a expressão é entendida de modo associativo: o levita mais velho continua atuando ao lado dos demais levitas. “Irmãos” preserva o termo de parentesco masculino do hebraico.'
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução direta e consagrada da designação hebraica do santuário móvel, אֹהֶל מוֹעֵד.
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: cumprindo a responsabilidade que lhe foi confiada
  rationale: O infinitivo com o substantivo cognato indica manter ou cumprir um encargo confiado. A formulação comunica esse sentido em português atual sem restringi-lo necessariamente à vigilância física.
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: mas não executará o trabalho regular
  rationale: A combinação enfática do substantivo עֲבֹדָה com o verbo עבד proíbe o trabalho normal do serviço levítico. “Trabalho regular” distingue essa atividade da participação auxiliar ainda permitida.
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם
  choice: Assim você fará com os levitas
  rationale: Reproduz de maneira natural a fórmula instrutiva que encerra a regulamentação.
- source_word: בְּמִשְׁמְרֹתָם
  choice: quanto às responsabilidades deles
  rationale: O plural מִשְׁמְרֹתָם refere-se aos encargos ou deveres atribuídos aos levitas; “responsabilidades” é claro e mantém o vínculo lexical com a expressão anterior.
theological_decisions:
- issue: Distinção entre a participação permitida após a idade de afastamento e o trabalho levítico proibido
  choice: O levita mais velho pode continuar servindo ao lado de seus irmãos no cumprimento dos encargos, mas não executa o trabalho regular.
  alternative: Entender que ele deve cessar toda forma de serviço, ou que somente pode exercer uma função estrita de vigilância.
  rationale: O contraste entre שרת e עֲבֹדָה...עבד aponta para duas modalidades de atividade, não para a cessação absoluta de toda participação. A tradução mantém essa distinção sem definir em excesso quais tarefas permaneciam permitidas.
- issue: Força modal de וְשֵׁרֵת
  choice: poderá servir
  alternative: servirá
  rationale: A forma verbal, isoladamente, pode ser traduzida como declaração ou instrução; no contexto imediato, ela descreve o que continua permitido ao levita depois de deixar o trabalho regular. “Poderá” torna clara essa relação contextual, enquanto a alternativa mais formal permanece possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A escolha de “servir” e “trabalho regular” preserva o contraste lexical e funcional do hebraico; “tenda do encontro” mantém a designação bíblica sem arcaísmo desnecessário.
