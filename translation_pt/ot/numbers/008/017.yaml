  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: pt
  text: Pois todo primogênito entre os filhos de Israel — tanto entre os seres humanos como entre os animais[a] — é meu. No dia em que feri todo primogênito na terra do Egito, eu os consagrei para mim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “no ser humano e no animal”, usando substantivos singulares em sentido coletivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu os separei para mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração anterior e conserva de modo natural a força explicativa da conjunção.
- source_word: לִי
  choice: é meu
  rationale: A preposição expressa posse; a formulação predicativa é idiomática em português.
- source_word: כָל בְּכוֹר
  choice: todo primogênito
  rationale: Reproduz o singular coletivo hebraico sem acrescentar explicitamente “do sexo masculino”, ausente neste versículo.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a expressão familiar e pactual do hebraico em linguagem bíblica ainda clara no português moderno.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: tanto entre os seres humanos como entre os animais
  rationale: Expressa com clareza o contraste entre a categoria humana e a animal, preservando a coordenação e o sentido coletivo.
- source_word: בְּיוֹם הַכֹּתִי
  choice: No dia em que feri
  rationale: Forma temporal natural em português; “feri” traduz diretamente נכה sem explicitar além do verbo a morte indicada pelo contexto.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Conserva a expressão hebraica completa, inclusive “terra”.
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: eu os consagrei para mim
  rationale: “Consagrei” preserva a dimensão sagrada do hifil de קדשׁ, enquanto “para mim” traduz naturalmente לִי.
theological_decisions:
- issue: Sentido coletivo de אָדָם no contraste entre humanos e animais
  choice: seres humanos
  alternative: homem; humanidade
  rationale: Neste contexto, אָדָם designa a categoria humana em contraste com os animais. “Seres humanos” comunica esse valor coletivo sem sugerir que o texto esteja falando de um único homem.
- issue: Força sacral de הִקְדַּשְׁתִּי
  choice: eu os consagrei para mim
  alternative: eu os separei para mim; eu os santifiquei para mim
  rationale: “Consagrei” mantém a ideia de separação para Deus com caráter sagrado, sem perder clareza nem introduzir terminologia técnica desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “filhos de Israel” conserva a forma pactual do original; os travessões tornam clara a relação entre “todo primogênito” e as duas categorias que se seguem.
