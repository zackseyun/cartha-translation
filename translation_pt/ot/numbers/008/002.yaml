translation:
  language: pt
  text: 'Fale a Arão e diga-lhe: “Quando você colocar as lâmpadas[a], as sete lâmpadas lançarão luz para a frente do candelabro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Quando você acender as lâmpadas”. O verbo hebraico significa literalmente “fazer subir” e, neste contexto, pode referir-se tanto a acender as lâmpadas como a colocá-las de modo que lancem luz para a frente.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo introduz uma ordem divina direta; “Fale” preserva o registro formal e distingue este verbo do seguinte.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: e diga-lhe
  rationale: Mantém os dois verbos da fórmula hebraica de fala sem produzir uma construção artificial em português.
- source_word: בְּהַעֲלֹתְךָ
  choice: Quando você colocar
  rationale: O hifil de עלה significa literalmente “fazer subir” e, neste contexto, pode referir-se a colocar ou preparar as lâmpadas, ou a acendê-las. “Colocar” conserva a relação com a orientação indicada na oração seguinte sem eliminar a alternativa lexical, registrada em nota.
- source_word: הַנֵּרֹת
  choice: as lâmpadas
  rationale: נֵר designa as lâmpadas concretas do candelabro, não a luz em sentido abstrato.
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: para a frente do candelabro
  rationale: A expressão indica direção ou orientação diante da face/frente do candelabro. A formulação portuguesa preserva esse valor direcional com naturalidade.
- source_word: יָאִירוּ
  choice: deverão lançar luz
  rationale: O hifil de אור tem sentido causativo, “dar/produzir luz”; “lançar luz” comunica esse valor e combina naturalmente com a indicação de direção.
- source_word: שִׁבְעַת הַנֵּרוֹת
  choice: as sete lâmpadas
  rationale: Tradução direta da construção numeral hebraica, sem acrescentar uma ideia de totalidade não explicitada.
- source_word: הַמְּנוֹרָה
  choice: candelabro
  rationale: Traduz o objeto cultual por um termo português corrente e compreensível, em vez de simplesmente transliterar “menorá”.
