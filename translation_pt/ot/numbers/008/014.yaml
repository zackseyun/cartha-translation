id: NUM.8.14
reference: Numbers 8:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִבְדַּלְתָּ֙ אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: pt
  text: Assim, você separará os levitas do meio dos filhos de Israel[a], e os levitas serão meus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”; em hebraico, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pertencerão a mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: Assim, você separará
  rationale: O hifil de בדל indica separar ou pôr à parte. “Separará” reproduz diretamente a ação, enquanto “Assim” expressa com naturalidade a sequência do procedimento no contexto.
- source_word: אֶת הַלְוִיִּם
  choice: os levitas
  rationale: O marcador de objeto direto seguido do substantivo definido plural é traduzido pela designação tradicional e transparente “os levitas”.
- source_word: מִתּוֹךְ
  choice: do meio de
  rationale: A expressão indica separação de dentro de um grupo maior. “Do meio de” é natural em português e mantém essa relação espacial e coletiva.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma familiar concreta do hebraico, em vez de a nivelar simplesmente para “israelitas”.
- source_word: וְהָיוּ לִי
  choice: e ... serão meus
  rationale: A construção com היה e לִי expressa posse ou pertencimento especial. “Serão meus” é conciso, natural e não acrescenta vocabulário explícito de consagração.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: A repetição nominal do hebraico é mantida, preservando sua ênfase em vez de substituí-la por um pronome.
theological_decisions:
- issue: Se a condição dos levitas deve ser expressa como pertencimento ou como consagração cultual
  choice: os levitas serão meus
  alternative: os levitas pertencerão a mim; os levitas serão consagrados a mim
  rationale: Embora o contexto trate da separação dos levitas para o serviço sagrado, לִי com היה afirma diretamente que eles pertencem a Deus. A tradução conserva essa formulação sem introduzir aqui um termo explícito para consagração.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A sintaxe preserva a repetição enfática de “os levitas” e a expressão hebraica “filhos de Israel”, registrando em nota a alternativa idiomática.
