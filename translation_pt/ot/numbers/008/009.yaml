  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: pt
  text: Então, você apresentará os levitas diante da tenda do encontro e reunirá toda a congregação dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os israelitas”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Então você fará ... se aproximarem
  rationale: O hifil de קרב expressa fazer chegar ou trazer para perto. A formulação preserva o movimento de aproximação no contexto ritual, enquanto “Então” comunica a sequência das instruções.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e clara dos membros da tribo de Levi separados para o serviço do santuário.
- source_word: לִפְנֵי
  choice: da tenda do encontro
  rationale: Na construção “aproximar-se diante de”, o português natural pode expressar a relação espacial por “aproximar-se da”; isso mantém a ideia de comparecer diante da tenda sem produzir uma formulação artificial.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução consagrada e semanticamente adequada do termo que designa o santuário, conservando a noção de encontro sem paráfrase excessiva.
- source_word: וְהִקְהַלְתָּ
  choice: e reunirá
  rationale: O hifil de קהל indica fazer uma comunidade reunir-se. “Reunirá” é atual, claro e apropriado para a convocação pública.
- source_word: כָּל עֲדַת
  choice: toda a congregação
  rationale: עֵדָה designa aqui a comunidade reunida de Israel. “Toda” traduz כָּל, e “congregação” preserva o caráter corporativo e formal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma filial e masculina explícita do hebraico, que designa coletivamente o povo da aliança; a alternativa idiomática é registrada em nota.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A expressão hebraica é masculina plural e filial, embora se refira corporativamente ao povo. O texto principal conserva essa forma e a nota oferece a equivalência coletiva mais idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro do presente comunica instrução solene sem recorrer ao mais arcaizante “tu”. A ordem hebraica e a progressão ritual foram preservadas de modo natural.
