revisions:
- from: Moisés, Arão e toda a congregação dos filhos de Israel fizeram aos levitas tudo conforme Yahweh havia ordenado a Moisés a respeito dos levitas; assim fizeram a eles os filhos de Israel.
  to: Moisés, Arão e toda a congregação dos filhos de Israel fizeram aos levitas conforme tudo o que Yahweh havia ordenado a Moisés a respeito dos levitas; assim os filhos de Israel lhes fizeram.
  rationale: 'A revisão ajusta apenas a sintaxe portuguesa: posiciona “conforme tudo o que” de modo idiomático e substitui a retomada final pouco natural por um pronome dativo. Mantêm-se a generalidade de “fizeram”, a repetição dos participantes e levitas, o nome Yahweh e o sentido abrangente de conformidade com a ordem divina.'
