  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: pt
  text: Moisés, Arão e toda a congregação dos filhos de Israel fizeram aos levitas conforme tudo o que Yahweh havia ordenado a Moisés a respeito dos levitas; assim os filhos de Israel lhes fizeram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: fizeram
  rationale: O verbo עשה é amplo, com o sentido de fazer ou realizar. “Fizeram” preserva essa generalidade sem especificar indevidamente os atos rituais envolvidos.
- source_word: עֲדַת
  choice: congregação
  rationale: עֵדָה designa a comunidade pactual reunida. “Congregação” mantém o tom formal e comunitário do uso no Pentateuco.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: A expressão familiar masculina do hebraico é preservada com sua forma tradicional e ainda inteligível em português, sem neutralizá-la como “israelitas”.
- source_word: לַלְוִיִּם / לָהֶם
  choice: aos levitas / a eles
  rationale: A preposição ל marca os levitas como aqueles a quem se dirigiram as ações. “Aos levitas” e “a eles” mantêm essa relação sem reduzi-la apenas a benefício ou assunto.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo conforme
  rationale: A formulação expressa conformidade abrangente com a ordem divina. “Tudo conforme” comunica de modo natural tanto a totalidade quanto a correspondência exata.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa claro, em português corrente, que a ordem precedeu seu cumprimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: a Moisés a respeito dos levitas
  rationale: A construção apresenta Moisés como destinatário da ordem e os levitas como seu referente. “A respeito dos levitas” preserva essa relação sem afirmar que a ordem era apenas em benefício deles.
- source_word: כֵּן
  choice: assim
  rationale: “Assim” retoma o padrão descrito e enfatiza que os filhos de Israel agiram em correspondência com a ordem recebida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal pactual em vez de substituí-lo por um título.
- issue: Expressão corporativa marcada por gênero בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha mantém a expressão familiar masculina do hebraico. Embora “israelitas” seja mais fluente, perderia a imagem de filiação presente na fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe formal moderada. A repetição de “levitas” e “filhos de Israel” foi preservada por refletir a ênfase e a estrutura do hebraico. Não se acrescentou nota, pois a alternativa “israelitas” não é necessária para compreender o texto e “filhos de Israel” é natural no registro bíblico português.
