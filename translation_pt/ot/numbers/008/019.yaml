  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: pt
  text: E dei os levitas como dádiva a Arão e a seus filhos, dentre os filhos de Israel,[a] para realizarem o serviço dos filhos de Israel na tenda do encontro e fazerem expiação pelos filhos de Israel, para que não haja praga entre os filhos de Israel quando eles se aproximarem do lugar santo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os levitas, que são dados a Arão e a seus filhos”. O hebraico repete a raiz de “dar” para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o santuário”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: E dei
  rationale: O wayyiqtol situa a ação na sequência do discurso divino. O pretérito perfeito é natural em português e mantém o ato de entrega realizado.
- source_word: הַלְוִיִּם נְתֻנִים
  choice: os levitas como dádiva
  rationale: 'A formulação procura conservar, de modo idiomático, a repetição enfática da raiz נתן: Deus deu os levitas como pessoas entregues para esse serviço.'
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: a Arão e a seus filhos
  rationale: A preposição marca os destinatários ou beneficiários da entrega.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dentre os filhos de Israel
  rationale: Indica que os levitas foram separados do interior do conjunto de Israel; mantém também a expressão formal בְּנֵי יִשְׂרָאֵל.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: para realizarem o serviço
  rationale: Conserva o sentido de desempenhar a função cultual designada, evitando a repetição pouco natural 'servir o serviço'.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução transparente da designação do santuário móvel; 'encontro' expressa מוֹעֵד neste contexto.
- source_word: וּלְכַפֵּר עַל
  choice: e fazerem expiação por
  rationale: Mantém o sentido cultual de כפר sem especificar além do texto o mecanismo ou a extensão da expiação.
- source_word: נֶגֶף
  choice: praga
  rationale: No contexto de aproximação indevida do sagrado, designa uma aflição ou golpe divinamente imposto; 'praga' é conciso e tradicional.
- source_word: בְּגֶשֶׁת
  choice: quando ... se aproximarem
  rationale: O infinitivo construto com ב tem valor temporal, expresso naturalmente por uma oração com 'quando'.
- source_word: הַקֹּדֶשׁ
  choice: lugar santo
  rationale: Preserva o referente concreto e sagrado sem restringi-lo mais do que o hebraico permite; 'santuário' continua sendo alternativa possível.
theological_decisions:
- issue: Função dos levitas em relação a Israel e aos sacerdotes
  choice: Os levitas são dados a Arão e a seus filhos para realizar o serviço devido pelos filhos de Israel e fazer expiação por eles.
  alternative: Entender os levitas apenas como auxiliares em tarefas práticas, sem função relacionada à expiação.
  rationale: O hebraico atribui explicitamente aos levitas tanto o serviço na tenda quanto o כפר em favor dos filhos de Israel. A tradução mantém essa tensão sem impor distinções teológicas posteriores.
- issue: Referente de עֲבֹדַת בְּנֵי יִשְׂרָאֵל
  choice: o serviço dos filhos de Israel
  alternative: o serviço em lugar dos filhos de Israel
  rationale: O genitivo hebraico permite compreender que se trata do serviço pertencente ou devido a Israel. A tradução formal preserva essa relação sem explicitar como substituição aquilo que o verso deixa implícito.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: Mantém a designação pactual formal e gramaticalmente masculina do hebraico, de modo compreensível em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'tenda do encontro' e 'lugar santo' como expressões transparentes. A repetição de 'filhos de Israel' é mantida por corresponder à ênfase estrutural do hebraico; na última ocorrência, o pronome 'eles' reduz apenas uma repetição que seria pesada em português sem alterar o referente.
