revisions:
- from: Então os levitas porão as mãos sobre a cabeça dos novilhos, e você oferecerá um como oferta pelo pecado[a] e o outro como holocausto a Yahweh, para fazer expiação pelos levitas.
  to: Então os levitas porão as mãos sobre as cabeças dos novilhos, e oferecerá um como oferta pelo pecado[a] e o outro como holocausto a Yahweh, para fazer expiação pelos levitas.
  rationale: A revisão torna natural em português o sentido distributivo de “cabeças dos novilhos” e remove o pronome explícito “você”, mantendo o verbo no singular, conforme o destinatário singular do hebraico. As demais escolhas são mantidas por serem fiéis ao texto-fonte e adequadas ao registro.
