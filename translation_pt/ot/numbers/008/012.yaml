review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a sequência ritual, os dois animais, as duas ofertas e a expiação em favor dos levitas. Contudo, o hebraico traz um substantivo singular em construção com plural, idiomaticamente distributivo: cada levita põe as mãos sobre as cabeças dos novilhos. Em português, “sobre a cabeça dos novilhos” soa como se ambos tivessem uma única cabeça e não comunica bem esse sentido distributivo.'
  naturalness: O registro é moderno, claro e apropriado. “Você oferecerá” é compreensível, mas é menos adequado em uma instrução cultual solene e cria uma alternância de tratamento com o sujeito plural anterior. “Oferecerá” preserva o singular hebraico sem introduzir esse efeito coloquial.
  terminology: “Oferta pelo pecado”, “holocausto”, “Yahweh” e “fazer expiação” são escolhas fiéis e consistentes. A nota sobre חַטָּאת preserva corretamente a alternativa lexical “oferta de purificação”.
  issues:
  - severity: medium
    issue: “sobre a cabeça dos novilhos”
    rationale: Embora רֹאשׁ esteja formalmente no singular no hebraico, a construção com “novilhos” é distributiva. Em português, o singular é pouco natural e pode sugerir uma anatomia compartilhada. “sobre as cabeças dos novilhos” comunica o referente pretendido com clareza, sem perda relevante de fidelidade formal.
  - severity: low
    issue: “você oferecerá”
    rationale: O verbo hebraico está no singular e deve ser mantido, mas o pronome explícito tem tom mais conversacional e não é necessário. “oferecerá” mantém o destinatário singular e se ajusta melhor ao registro da passagem.
  revised_text: Então os levitas porão as mãos sobre as cabeças dos novilhos, e oferecerá um como oferta pelo pecado[a] e o outro como holocausto a Yahweh, para fazer expiação pelos levitas.
  revised_footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar, em contextos sacerdotais, a oferta relacionada tanto ao pecado quanto à purificação.
    reason: lexical_alternative
  revision_rationale: A revisão torna natural em português o sentido distributivo de “cabeças dos novilhos” e remove o pronome explícito “você”, mantendo o verbo no singular, conforme o destinatário singular do hebraico. As demais escolhas são mantidas por serem fiéis ao texto-fonte e adequadas ao registro.
