base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: pt
  text: Então os levitas porão as mãos sobre as cabeças dos novilhos, e oferecerá um como oferta pelo pecado[a] e o outro como holocausto a Yahweh, para fazer expiação pelos levitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar, em contextos sacerdotais, a oferta relacionada tanto ao pecado quanto à purificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: porão as mãos
  rationale: No contexto sacrificial, סמך descreve o gesto ritual de impor ou pôr as mãos sobre o animal. A formulação é clara e natural em português.
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: sobre a cabeça dos novilhos
  rationale: Mantém o singular hebraico רֹאשׁ, que pode ter sentido distributivo em relação aos dois animais, sem apagar essa característica do texto-fonte.
- source_word: וַעֲשֵׂה
  choice: você oferecerá
  rationale: Embora עשה signifique literalmente “fazer”, com animais sacrificiais como objeto o sentido contextual é “oferecer”. A forma verbal conserva o destinatário singular.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: É a designação tradicional e amplamente compreensível para o sacrifício חטאת; a possível nuance de purificação é preservada em nota.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo cultual português estabelecido para a oferta inteiramente queimada, sem necessidade de explicitação adicional no corpo do versículo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Traduz diretamente o nome divino יהוה e expressa naturalmente o destinatário da oferta.
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: para fazer expiação pelos levitas
  rationale: Preserva a linguagem ritual e teológica de כפר sem impor uma teoria específica sobre o mecanismo da expiação.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A expressão tradicional permanece imediatamente reconhecível, enquanto a alternativa evidencia a dimensão purificadora possível no uso sacerdotal e é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém a terminologia sacrificial reconhecível e o nome divino Yahweh. O singular “a cabeça dos novilhos” acompanha a forma hebraica e permite sua leitura distributiva.
