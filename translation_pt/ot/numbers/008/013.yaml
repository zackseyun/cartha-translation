source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: pt
  text: Você colocará os levitas diante de Arão e de seus filhos e os apresentará como oferta movida a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “você os moverá como oferta movida”. O hebraico emprega juntos o verbo que designa o ato ritual de mover ou apresentar e o substantivo correspondente, “oferta movida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: Você colocará
  rationale: 'O hifil de עמד é causativo: fazer ficar de pé, posicionar. “Colocará” comunica naturalmente o posicionamento ritual dos levitas.'
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e precisa do grupo tribal, com o artigo definido preservado.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa tanto a posição espacial quanto a apresentação formal na presença de Arão e de seus filhos.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma consagrada do nome em português.
- source_word: בָנָיו
  choice: seus filhos
  rationale: בנים refere-se aqui aos filhos homens de Arão, que exercem função sacerdotal.
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: e os apresentará como oferta movida
  rationale: A construção reúne o verbo ritual נוף e o substantivo técnico תְּנוּפָה. A tradução comunica a apresentação cerimonial, preservando a categoria cultual “oferta movida”; a repetição etimológica hebraica é explicada em nota.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário da apresentação, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva no texto o nome pessoal da aliança representado pelo Tetragrama, sem substituí-lo por um título.
- issue: Natureza do ato ritual aplicado aos levitas
  choice: os apresentará como oferta movida
  alternative: os moverá como oferta movida
  rationale: Mantém a classificação ritual de תְּנוּפָה sem sugerir com certeza um movimento físico específico de pessoas, detalhe que a expressão hebraica pode evocar, mas não descreve de modo inequívoco.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. “Oferta movida” conserva a terminologia ritual tradicional, enquanto a nota registra a formulação hebraica mais literal e sua repetição lexical.
