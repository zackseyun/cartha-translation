  source_fidelity: A enumeração das quatro categorias de ofertas, a expressão de máxima santidade, o verbo “devolverem” para o hifil de שוב e “filhos” para בניו refletem adequadamente o hebraico. Contudo, “a parte reservada do fogo” é sintaticamente ambíguo em português e pode sugerir uma porção pertencente ao fogo, em vez de uma porção separada dele.
  naturalness: O texto é claro e de registro apropriado, mas “a parte reservada do fogo” não soa idiomático nem comunica com precisão a relação cultual pretendida. “Separadas do fogo” é mais natural e preserva a concisão e a ambiguidade controlada da expressão hebraica.
  terminology: “Coisas santíssimas”, “oferta de cereal”, “oferta pelo pecado”, “oferta pela culpa” e “santíssimo” são terminologia consistente, compreensível e adequada ao contexto sacerdotal. As notas alternativas para as duas últimas categorias são pertinentes.
