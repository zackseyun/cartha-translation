  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: pt
  text: 'Isto será seu dentre as coisas santíssimas, separadas do fogo[a]: todas as ofertas deles, todas as ofertas de cereal, todas as ofertas pelo pecado[b] e todas as ofertas pela culpa[c] que devolverem a mim. Isso será santíssimo para você e para seus filhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “do fogo”. A expressão pode indicar as porções separadas daquilo que era apresentado no fogo.'
    reason: lexical_alternative
  - marker: b
    text: “Oferta pelo pecado” também pode ser traduzido como “oferta de purificação”.
    reason: lexical_alternative
  - marker: c
    text: “Oferta pela culpa” também pode ser traduzido como “oferta de reparação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: dentre as coisas santíssimas
  rationale: A construção superlativa designa aqui a categoria sacrificial de maior santidade, não o compartimento interior do santuário.
- source_word: מִן הָאֵשׁ
  choice: a parte reservada do fogo
  rationale: A expressão significa literalmente “do fogo”. No contexto, refere-se à porção das ofertas santíssimas destinada ao sacerdote, em contraste com o que era consumido pelo fogo; a nota preserva a forma literal e sua concisão ambígua.
- source_word: קָרְבָּנָם
  choice: todas as ofertas deles
  rationale: קָרְבָּן é o termo geral para algo apresentado ou aproximado de Deus; “oferta” é claro e corrente.
- source_word: מִנְחָתָם
  choice: todas as ofertas de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa normalmente a oferta feita de cereal; a formulação evita o menos preciso “oferta de alimentos”.
- source_word: חַטָּאתָם
  choice: todas as ofertas pelo pecado
  rationale: Na lista sacrificial, חַטָּאת designa a oferta relacionada ao pecado e à purificação. A tradução tradicional e reconhecível fica no texto, com a alternativa ritual preservada em nota.
- source_word: אֲשָׁמָם
  choice: todas as ofertas pela culpa
  rationale: אָשָׁם designa a oferta ligada à culpa, frequentemente com aspecto reparador. A expressão convencional fica no texto, e a alternativa é registrada em nota.
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: que devolverem a mim
  rationale: O hifil de שׁוב conserva a ideia de fazer voltar, devolver ou restituir. “Devolverem a mim” mantém essa imagem sem restringi-la apenas à compensação financeira.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: santíssimo
  rationale: O predicado assinala o grau máximo de santidade ritual dessas porções; “santíssimo” é conciso e natural.
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: para você e para seus filhos
  rationale: O destinatário é Arão, e “filhos” preserva a referência masculina específica aos seus descendentes sacerdotais.
theological_decisions:
- issue: Terminologia do grau de santidade sacerdotal
  choice: coisas santíssimas / santíssimo
  alternative: Santo dos Santos
  rationale: Neste versículo, a expressão hebraica classifica ofertas e porções sacrificiais, não nomeia o recinto interior do santuário.
- issue: Referência de gênero aos descendentes de Arão
  choice: seus filhos
  alternative: seus descendentes
  rationale: O hebraico menciona explicitamente os filhos de Arão no contexto do sacerdócio masculino, portanto a especificidade textual foi mantida.
- issue: Sentido de אֲשֶׁר יָשִׁיבוּ לִי
  choice: que devolverem a mim
  alternative: que apresentarem a mim
  rationale: A opção conserva a imagem lexical de retorno ou restituição sem decidir se a frase destaca genericamente a entrega das ofertas ou, em especial, seu aspecto reparador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. A repetição de “todas as ofertas” acompanha a enumeração enfática do hebraico. Os termos sacrificiais tradicionais foram mantidos no texto, e alternativas semanticamente relevantes aparecem em notas.
