  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: pt
  text: Todo primogênito[a] de qualquer ser vivo que apresentarem a Yahweh, seja humano ou animal, será seu. Contudo, certamente resgatará o primogênito humano e resgatará o primogênito do animal impuro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que abre o ventre”. A expressão hebraica refere-se ao primeiro nascido que sai do ventre.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto hebraico repete o verbo “resgatar”, mas emprega uma construção intensiva apenas na primeira ocorrência: “certamente resgatará”.'
    reason: source_form
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: primeiro filho que abre o ventre
  rationale: Preserva a imagem da expressão idiomática hebraica e explicita naturalmente que se trata da primeira cria a sair do ventre.
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: Todo ... de todo ser vivo
  rationale: Expressa o alcance abrangente da construção; neste contexto, 'ser vivo' comunica com clareza a referência conjunta a seres humanos e animais.
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: que apresentarem a Yahweh
  rationale: O verbo significa aproximar ou apresentar em contexto cultual. 'Apresentarem' evita sugerir que tanto humanos quanto todos os animais eram sacrificados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: seja humano ou animal
  rationale: Reproduz de modo corrente e conciso os dois âmbitos abrangidos pela norma.
- source_word: יִהְיֶה לָּךְ
  choice: será seu
  rationale: Indica diretamente o direito sacerdotal expresso pelo hebraico.
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz a ressalva decisiva à declaração precedente.
- source_word: פָּדֹה תִפְדֶּה
  choice: certamente resgatará
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a obrigação; 'certamente' preserva essa ênfase sem tornar a frase artificial.
- source_word: בְּכוֹר הָאָדָם
  choice: o primogênito humano
  rationale: Mantém o contraste entre pessoa e animal com clareza e naturalidade em português.
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: o primogênito do animal impuro
  rationale: Conserva a categoria ritual hebraica e deixa claro que se trata de animal impróprio para sacrifício.
theological_decisions:
- issue: Sentido de אָדָם em contraste com בְּהֵמָה
  choice: humano
  alternative: homem; ser humano
  rationale: Aqui אָדָם designa a categoria humana em contraste com a animal, não especificamente o sexo masculino. 'Humano' preserva esse contraste sem acrescentar uma especificação de gênero ausente do contexto.
- issue: Natureza do direito sacerdotal sobre os primogênitos
  choice: Os primogênitos são apresentados a Yahweh e pertencem ao sacerdote, mas os humanos e os animais impuros têm de ser resgatados.
  alternative: Entender 'apresentar' como sacrifício em todos os casos.
  rationale: A própria ressalva do versículo exclui a ideia de que todos os primogênitos mencionados fossem literalmente sacrificados.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega 'ventre', 'primogênito', 'resgatar' e 'impuro' como vocabulário bíblico ainda corrente; evita 'carne' em 'todo ser vivo', pois nesse contexto a tradução literal seria menos transparente.
