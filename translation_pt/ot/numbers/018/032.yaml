source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: pt
  text: Vocês não incorrerão em pecado por causa dele quando separarem dele a sua melhor parte[a]. Não profanarão as coisas santas dos filhos de Israel[b] e não morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua gordura” ou “a sua parte mais excelente”. O hebraico חֵלֶב significa literalmente “gordura”, mas, em contextos de ofertas, muitas vezes designa a porção mais rica ou melhor.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”, expressão convencional que designa o povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: não incorrerão em pecado
  rationale: A construção נשא חטא expressa assumir culpa ou tornar-se culpado. “Incorrer em pecado” comunica essa responsabilidade moral com naturalidade, sem reduzir o termo a mera culpa subjetiva.
- source_word: עָלָיו
  choice: por causa dele
  rationale: A preposição com sufixo retoma o dízimo mencionado no contexto e indica responsabilidade relacionada a ele.
- source_word: בַּהֲרִימְכֶם
  choice: quando separarem
  rationale: O Hifil de רום pode descrever elevar ou retirar uma porção como contribuição. “Separarem” torna claro o ato de reservar a oferta, preservando seu sentido cultual.
- source_word: חֶלְבּוֹ
  choice: a sua melhor parte
  rationale: Embora חֵלֶב signifique literalmente “gordura”, em contextos de ofertas designa frequentemente a porção mais rica ou excelente; aqui o referente é o dízimo de produtos.
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: Retoma o dízimo do qual é separada a melhor porção.
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: as coisas santas dos filhos de Israel
  rationale: “Coisas santas” conserva a abrangência de קָדְשֵׁי, enquanto “filhos de Israel” reproduz a expressão étnica convencional בני ישראל.
- source_word: תְחַלְּלוּ
  choice: profanarão
  rationale: O Piel de חלל significa tratar como comum ou profanar aquilo que é santo. “Profanar” mantém diretamente o contraste entre santidade e uso indevido.
- source_word: וְלֹא תָמֻתוּ
  choice: e não morrerão
  rationale: A tradução mantém a coordenação simples do hebraico e não transforma explicitamente a cláusula em finalidade ou ameaça condicional, embora esse valor possa ser inferido no contexto legal.
theological_decisions:
- issue: Sentido cultual de חֶלֶב
  choice: a sua melhor parte
  alternative: a sua gordura; a sua parte mais excelente
  rationale: A referência contextual é à porção retirada do dízimo, não especificamente à gordura animal. A tradução comunica que a porção de melhor qualidade deve ser consagrada, sem introduzir um referente inadequado.
- issue: Forma de בני ישראל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A forma tradicional e transparente preserva a expressão hebraica coletiva. Uma nota esclarece que ela designa o povo de Israel, sem restringir o referente aos homens.
- issue: Relação da cláusula final וְלֹא תָמֻתוּ
  choice: e não morrerão
  alternative: para que não morram; sob pena de morrerem
  rationale: A coordenação do texto hebraico é preservada, deixando aberta a relação exata entre o mandamento e a consequência, em vez de explicitar finalidade ou condição.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais em “vocês” para refletir os destinatários levíticos. O futuro com valor normativo preserva o tom legal do versículo e a coordenação hebraica da cláusula final.
