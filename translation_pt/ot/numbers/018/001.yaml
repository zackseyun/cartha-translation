  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: pt
  text: 'Então Yahweh disse a Arão: “Você, seus filhos e a casa de seu pai com você levarão sobre si a iniquidade do santuário[a]; e você e seus filhos com você levarão sobre si a iniquidade do sacerdócio de vocês[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levarão sobre si a culpa do santuário”. A expressão hebraica também pode indicar responsabilidade pelas transgressões relacionadas ao santuário.
    reason: lexical_alternative
  - marker: b
    text: Ou “levarão sobre si a culpa do sacerdócio de vocês”. A expressão hebraica também pode indicar responsabilidade pelas transgressões relacionadas ao ofício sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa essa sequência em português atual.
- source_word: בֵית אָבִיךָ
  choice: a casa de seu pai
  rationale: Mantém a expressão hebraica de parentesco, que se refere à família ou linhagem paterna mais ampla, e não a um edifício.
- source_word: אִתָּךְ
  choice: com você
  rationale: Preserva a ideia de acompanhamento e sua repetição enfática nas duas orações.
- source_word: תִּשְׂאוּ אֶת עֲוֺן
  choice: levarão sobre si a iniquidade
  rationale: Conserva o idioma teológico hebraico e sua amplitude sem reduzi-lo apenas a culpa, punição ou responsabilidade.
- source_word: הַמִּקְדָּשׁ
  choice: o santuário
  rationale: É a designação portuguesa natural e consagrada para o âmbito sagrado confiado aos sacerdotes.
- source_word: כְּהֻנַּתְכֶם
  choice: o sacerdócio de vocês
  rationale: Expressa a função e o serviço sacerdotais atribuídos coletivamente a Arão e seus filhos, preservando o sufixo plural.
theological_decisions:
- issue: Sentido de “levar sobre si a iniquidade” no contexto sacerdotal
  choice: Manter o idioma “levar sobre si a iniquidade”.
  alternative: “Levar sobre si a culpa” ou “ser responsável pelas transgressões”.
  rationale: A expressão hebraica pode abranger culpa, sujeição às consequências e responsabilidade por violações relacionadas ao serviço sagrado. A formulação escolhida preserva essa tensão sem impor uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “com você” e o paralelismo das duas orações foram mantidos por refletirem a estrutura enfática do hebraico. “Casa de seu pai” preserva deliberadamente o idioma de parentesco do texto-fonte.
