    text: Literalmente, “a gordura” do azeite, do vinho novo e dos cereais; expressão idiomática para a parte mais rica ou de melhor qualidade.
    reason: lexical_alternative
  revision_rationale: A revisão explicita “as” para representar o sufixo pronominal plural de נְתַתִּים, retomando “as primícias”, e substitui o futuro “derem” pelo presente genérico “dão”. Não altera o sentido nem a ambiguidade do texto-fonte.
