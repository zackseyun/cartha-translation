  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: pt
  text: Tudo o que há de melhor no azeite[a] e tudo o que há de melhor no vinho novo e nos cereais — as primícias deles, que dão a Yahweh — eu as dei a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a gordura” do azeite, do vinho novo e dos cereais; expressão idiomática para a parte mais rica ou de melhor qualidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: o que há de melhor
  rationale: Embora signifique literalmente “gordura”, neste contexto agrícola o termo designa idiomaticamente a parte mais rica ou de melhor qualidade. A formulação escolhida comunica esse sentido com naturalidade em português.
- source_word: יִצְהָר
  choice: azeite
  rationale: O termo se refere a óleo fresco, normalmente de oliva. “Azeite” é claro e adequado ao contexto israelita, sem precisar explicitar “de oliva”.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: Preserva a referência a vinho recém-produzido e a distinção lexical em relação a termos hebraicos mais gerais para vinho.
- source_word: דָגָן
  choice: cereais
  rationale: O substantivo coletivo abrange a produção de grãos. O plural “cereais” soa natural em português e mantém o sentido amplo.
- source_word: רֵאשִׁיתָם
  choice: as primícias deles
  rationale: No contexto agrícola e cultual, רֵאשִׁית designa a primeira porção da produção oferecida. “Primícias” é preciso e corrente no registro bíblico.
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: que derem a Yahweh
  rationale: Mantém o sentido básico de נתן, “dar”, e deixa indeterminado o sujeito humano plural, como no hebraico.
- source_word: לְךָ נְתַתִּים
  choice: eu dei a você
  rationale: O perfeito apresenta a concessão como estabelecida. O objeto já foi expresso na frase, portanto não é necessário repeti-lo com um pronome.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino, e “Yahweh” o representa de modo explícito, sem substituí-lo por um título. Isso também corresponde à camada de consulta inglesa fornecida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção “tudo o que há de melhor” evita o literalismo obscuro de “gordura”, enquanto a nota preserva a imagem hebraica. Os travessões reproduzem a aposição enfática das primícias sem tornar a frase artificial.
