  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: pt
  text: Todas as contribuições das coisas sagradas que os filhos de Israel apresentam ao SENHOR eu as dei a você, a seus filhos e a suas filhas, juntamente com você, como estatuto permanente. É uma aliança perpétua de sal diante do SENHOR, para você e para a sua descendência, juntamente com você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּרוּמֹת
  choice: contribuições
  rationale: Expressa as porções separadas e entregues para uso sagrado sem restringir o termo a um único tipo de oferta.
- source_word: יָרִימוּ
  choice: apresentarem
  rationale: No contexto cultual, o verbo literalmente associado a erguer designa a apresentação ou separação de uma contribuição; 'apresentarem' comunica naturalmente essa função em português.
- source_word: חָק עוֹלָם
  choice: estatuto permanente
  rationale: Preserva o caráter normativo de חָק e o sentido duradouro de עוֹלָם.
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: aliança perpétua de sal
  rationale: Mantém a imagem cultural e jurídica do hebraico, sem substituir a metáfora por uma interpretação explicativa.
- source_word: זַרְעֲךָ
  choice: sua descendência
  rationale: Representa o substantivo coletivo hebraico de forma natural e inclusiva em português.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes.
theological_decisions:
- issue: Sentido da expressão 'aliança de sal'
  choice: Preservar literalmente 'aliança perpétua de sal'.
  alternative: Explicitar como 'aliança perpétua e inviolável'.
  rationale: A imagem é genuína no texto e pode evocar permanência, fidelidade ou ratificação; traduzi-la por uma interpretação única eliminaria sua riqueza e possível ambiguidade.
- issue: Duração do estatuto e da aliança
  choice: Traduzir עוֹלָם por 'permanente' e 'perpétua', conforme cada construção.
  alternative: Usar 'para sempre' em ambos os casos.
  rationale: As escolhas refletem o caráter duradouro afirmado no verso sem inserir uma definição sistemática sobre seu alcance teológico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, preservando o destinatário singular e a inclusão explícita de filhos, filhas e descendência.
