revisions:
- from: Todas as contribuições das coisas sagradas que os filhos de Israel apresentarem ao SENHOR, eu as dei a você, a seus filhos e às suas filhas que estiverem com você, como estatuto permanente. É uma aliança perpétua de sal diante do SENHOR, para você e para a sua descendência com você.
  to: Todas as contribuições das coisas sagradas que os filhos de Israel apresentam ao SENHOR eu as dei a você, a seus filhos e a suas filhas, juntamente com você, como estatuto permanente. É uma aliança perpétua de sal diante do SENHOR, para você e para a sua descendência, juntamente com você.
  rationale: A revisão substitui o futuro do subjuntivo por um presente de valor geral e corrige o escopo de «com você», preservando a estrutura legal, os destinatários singulares e familiares, e a imagem deliberadamente não explicada da aliança de sal.
