source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: pt
  text: 'E fale aos levitas e diga-lhes: “Quando receberem dos filhos de Israel o dízimo que lhes dei, da parte deles, como herança de vocês, deverão separar dele uma contribuição para Yahweh[a], o dízimo do dízimo.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido como “uma contribuição de Yahweh”. Tradicionalmente: “uma oferta alçada para Yahweh”.'
    reason: Registra a ambiguidade da relação genitiva e a tradução cultual tradicional de תְּרוּמָה.
  - marker: b
    text: Isto é, a décima parte do dízimo recebido pelos levitas.
    reason: Esclarece o sentido partitivo da expressão hebraica “dízimo do dízimo”.
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional, precisa e natural em português para os membros da tribo de Levi.
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: fale ... e diga-lhes
  rationale: Preserva os dois verbos da fórmula hebraica de instrução, com fluência em português moderno.
- source_word: כִּי תִקְחוּ
  choice: Quando receberem
  rationale: כִּי introduz aqui a circunstância prevista. No contexto, os levitas recebem dos israelitas o dízimo que Deus lhes atribuiu; “receber” expressa isso mais naturalmente que “tomar”, sem alterar a relação indicada pelo texto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma masculina explícita da expressão hebraica e sua formulação tradicional, sem a neutralizar.
- source_word: הַמַּעֲשֵׂר
  choice: o dízimo
  rationale: Equivalente consagrado e exato para a décima parte prescrita.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: que dei a vocês, procedente deles
  rationale: Preserva tanto a dádiva divina aos levitas quanto a origem do dízimo entre os israelitas; “procedente deles” evita a possível impressão de que Deus apenas o recebeu deles antes de o dar.
- source_word: בְּנַחֲלַתְכֶם
  choice: como sua herança
  rationale: Expressa a porção atribuída aos levitas como herança, em lugar de uma posse territorial.
- source_word: וַהֲרֵמֹתֶם
  choice: deverão separar
  rationale: No contexto cultual, o Hifil de רום indica retirar e destinar uma porção como contribuição; “separar” é claro e atual, embora “apresentar” também seja possível.
- source_word: תְּרוּמַת יְהוָה
  choice: uma contribuição para Yahweh
  rationale: תְּרוּמָה designa uma porção separada ou contribuição. “Para Yahweh” conserva a plausível relação de destinação do genitivo sem recorrer ao tradicional, porém pouco transparente, “oferta alçada”.
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: o dízimo do dízimo
  rationale: 'Formulação portuguesa concisa e natural para a relação partitiva: uma décima parte do dízimo recebido.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” translitera o nome pactual e evita substituí-lo por um título.
- issue: Relação expressa em תְּרוּמַת יְהוָה
  choice: contribuição para Yahweh
  alternative: contribuição de Yahweh; oferta alçada de Yahweh
  rationale: A construção pode indicar pertença ou destinação. O contexto favorece uma porção destinada a Yahweh, mas a nota registra a alternativa para não ocultar a ambiguidade do genitivo.
- issue: Expressão masculina בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: Conserva a forma lexical do hebraico e a designação coletiva tradicional, sem importar uma leitura doutrinária sobre a composição do grupo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural, evita terminologia cultual opaca no corpo do texto e mantém a estrutura de instrução direta do hebraico.
