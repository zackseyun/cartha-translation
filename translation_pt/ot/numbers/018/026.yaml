  - marker: b
    text: Isto é, a décima parte do dízimo recebido pelos levitas.
    reason: Esclarece o sentido partitivo da expressão hebraica “dízimo do dízimo”.
  revision_rationale: 'A revisão limita-se a tornar idiomática a expressão da procedência do dízimo: “da parte deles” preserva a origem nos filhos de Israel e a dádiva divina aos levitas, sem o tom burocrático de “procedente deles”. Mantêm-se as demais escolhas, inclusive a ambiguidade do genitivo em nota e os respectivos marcadores.'
