revisions:
- from: 'E fale aos levitas e diga-lhes: “Quando receberem dos filhos de Israel o dízimo que dei a vocês, procedente deles, como sua herança, deverão separar dele uma contribuição para Yahweh,[a] o dízimo do dízimo.[b]”'
  to: 'E fale aos levitas e diga-lhes: “Quando receberem dos filhos de Israel o dízimo que lhes dei, da parte deles, como herança de vocês, deverão separar dele uma contribuição para Yahweh[a], o dízimo do dízimo.[b]”'
  rationale: 'A revisão limita-se a tornar idiomática a expressão da procedência do dízimo: “da parte deles” preserva a origem nos filhos de Israel e a dádiva divina aos levitas, sem o tom burocrático de “procedente deles”. Mantêm-se as demais escolhas, inclusive a ambiguidade do genitivo em nota e os respectivos marcadores.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:01:51Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a estrutura instrucional, os destinatários levitas, a origem israelita do dízimo, sua atribuição divina como herança e a obrigação de separar uma porção para Yahweh. “Separar” é uma opção segura e clara para o Hifil de רום no contexto de תְּרוּמָה. Convém, porém, substituir “procedente deles”, que soa burocrático e pouco natural no registro do versículo, por uma formulação portuguesa mais idiomática que retenha a relação “de/da parte deles”.
  naturalness: O texto é claro e de registro digno. A sequência “que dei a vocês, procedente deles” é a única aspereza relevante; “que lhes dei, da parte deles” é mais natural, preservando a redundância deliberada do hebraico sem prejudicar a compreensão. O restante, incluindo “o dízimo do dízimo”, é inteligível, e a nota explica seu valor partitivo.
  terminology: “Levitas”, “filhos de Israel”, “dízimo”, “herança” e “Yahweh” são escolhas consistentes com o texto-fonte e com o registro adotado. “Contribuição para Yahweh” comunica a destinação cultual de תְּרוּמַת יְהוָה; a nota preserva a possibilidade de entender o genitivo de outra maneira e registra a designação tradicional.
  issues:
  - severity: low
    issue: “Procedente deles” é pouco idiomático neste contexto.
    rationale: Embora transmita corretamente a origem do dízimo, a expressão tem tom administrativo e interrompe a fluência de uma instrução cultual. “Da parte deles” conserva a relação expressa por מֵאִתָּם de modo mais natural em português.
