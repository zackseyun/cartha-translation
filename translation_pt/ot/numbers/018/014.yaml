lexical_decisions:
- source_word: כָּל
  choice: Tudo o que
  rationale: Expressa a totalidade da categoria e forma, em português natural, uma construção coletiva com o termo técnico seguinte.
- source_word: חֵרֶם
  choice: consagrado irrevogavelmente
  rationale: Preserva a ideia central de algo retirado do uso comum e entregue de modo irreversível a Deus, sem impor no texto principal o sentido contextual mais restrito de destruição.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Reproduz diretamente a esfera indicada pela preposição ב e se ajusta ao contexto jurídico e cultual.
- source_word: לְךָ
  choice: seu
  rationale: Indica de maneira concisa a atribuição legal a Arão, destinatário do discurso.
- source_word: יִהְיֶה
  choice: será
  rationale: O imperfeito de היה exprime aqui uma determinação de efeito futuro no contexto legislativo.
theological_decisions:
- issue: Sentido do termo cultual חֵרֶם
  choice: consagrado irrevogavelmente
  alternative: posto sob interdição; destinado à destruição
  rationale: O termo pode designar aquilo que foi entregue irrevogavelmente a Deus e retirado do uso comum, podendo, conforme o contexto, envolver destruição. O texto principal conserva o sentido mais abrangente, e a nota registra a alternativa sem resolver indevidamente a tensão lexical.
