  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: pt
  text: 'Yahweh disse a Arão: “Na terra deles, você não terá herança, e nenhuma parte lhe caberá entre eles. Eu sou a sua parte e a sua herança entre os filhos de Israel.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre o povo de Israel” ou “entre os israelitas”. O hebraico diz literalmente “entre os filhos de Israel”.
    reason: Registra alternativas coletivas naturais para a expressão hebraica בְּנֵי יִשְׂרָאֵל sem retirar do texto principal sua forma familiar.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאַרְצָם
  choice: na terra deles
  rationale: O termo se refere ao território dado como herança a Israel; «terra» conserva esse sentido territorial e pactual.
- source_word: תִנְחָל
  choice: você não terá herança
  rationale: Expressa de modo natural em português a ideia de receber ou possuir uma herança e mantém a ligação com נַחֲלָתְךָ na frase seguinte.
- source_word: חֵלֶק
  choice: parte
  rationale: «Parte» comunica uma parcela ou porção atribuída e permite repetir o mesmo termo na declaração enfática «Eu sou a sua parte».
- source_word: בְּתוֹכָם
  choice: entre eles
  rationale: Indica a posição de Arão no âmbito da comunidade israelita, não apenas uma localização espacial.
- source_word: אֲנִי חֶלְקְךָ
  choice: Eu sou a sua parte
  rationale: Mantém a formulação direta e a afirmação teológica central, sem explicar além do que o hebraico declara.
- source_word: נַחֲלָתְךָ
  choice: a sua herança
  rationale: Conserva o sentido jurídico e territorial de נַחֲלָה e o vínculo lexical com a primeira oração.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Reproduz a expressão hebraica masculina e sua imagem familiar e pactual; a nota registra equivalentes coletivos naturais em português.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé ou SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido da declaração «Eu sou a sua parte e a sua herança»
  choice: Tradução direta, sem explicitação interpretativa
  alternative: Paráfrases como «Eu cuidarei de você» ou «Eu lhe darei sustento»
  rationale: A metáfora de herança deve permanecer, pois relaciona a falta de uma porção territorial de Arão com o próprio Yahweh como sua parte e herança.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: povo de Israel ou israelitas
  rationale: A escolha conserva a forma e a textura familiar do hebraico, enquanto a nota reconhece o valor coletivo tradicional da expressão.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. O uso de «você» evita uma conjugação arcaizante, enquanto «lhe caberá» expressa naturalmente a atribuição de uma parte. A repetição de «parte» e «herança» preserva a coesão lexical e a força retórica do hebraico.
