base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: pt
  text: As primícias de tudo o que há na terra deles e que eles trouxerem ao SENHOR serão suas. Toda pessoa da sua casa que estiver pura[a] poderá comê-las.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, ritualmente pura.
    reason: Esclarece o sentido cultual de טָהוֹר no contexto da legislação sacerdotal.
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: As primícias
  rationale: Expressa de modo conciso e consagrado o primeiro produto da colheita oferecido a Deus, preservando o sentido cultual do termo hebraico.
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: de tudo o que houver na terra deles
  rationale: Mantém o alcance abrangente e a localização expressa pelo hebraico sem acrescentar uma especificação agrícola ausente do texto.
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: e que trouxerem ao SENHOR
  rationale: Traduz diretamente o verbo 'trazer'; o contexto já deixa clara a apresentação cultual. O nome divino é vertido pela forma portuguesa tradicional em versaletes.
- source_word: לְךָ יִהְיֶה
  choice: serão suas
  rationale: A locução atribui as primícias a Arão. O plural concorda naturalmente em português com 'primícias', embora o hebraico use uma construção coletiva.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Toda pessoa da sua casa que estiver pura
  rationale: Torna explícito o referente pessoal implícito em 'todo puro' e preserva no texto principal o termo simples 'pura'; a nota esclarece seu sentido ritual.
- source_word: יֹאכֲלֶנּוּ
  choice: poderá comê-las
  rationale: O imperfeito indica permissão ou direito no contexto. O pronome plural retoma naturalmente 'primícias' em português.
theological_decisions:
- issue: Sentido de טָהוֹר na legislação sacerdotal
  choice: pureza ritual da pessoa pertencente à casa de Arão
  alternative: pureza moral em sentido geral
  rationale: O contexto trata das porções sacerdotais e das condições cultuais para consumi-las; por isso, a pureza ritual é o sentido mais provável, sem transformar essa explicitação em paráfrase no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega 'primícias' por sua precisão bíblico-cultual, 'casa' para preservar a imagem do hebraico e 'poderá' para comunicar a permissão. O marcador da nota foi colocado junto de 'pura', termo ao qual a explicação se refere.
