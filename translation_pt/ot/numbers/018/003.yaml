source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: pt
  text: Eles cumprirão o seu encargo e o encargo de toda a Tenda. Contudo, não se aproximarão dos utensílios sagrados[a] nem do altar, para que nem eles nem vocês morram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos objetos sagrados” ou “dos utensílios do santuário”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e não morrerão, tanto eles como vocês”; no contexto negativo, “nem eles nem vocês” expressa naturalmente em português a inclusão dos dois grupos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: cumprirão
  rationale: Com מִשְׁמֶרֶת, o verbo שׁמר indica observar ou cumprir uma responsabilidade confiada; “cumprirão” é natural em português e comunica o dever, sem reduzir o sentido à vigilância física.
- source_word: מִשְׁמַרְתְּךָ
  choice: as responsabilidades que têm para com você
  rationale: מִשְׁמֶרֶת designa encargo, obrigação ou responsabilidade. A formulação explicita de modo natural que os levitas têm deveres em relação a Arão, a quem o sufixo masculino singular se dirige.
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: e as responsabilidades relativas a toda a Tenda
  rationale: Mantém a repetição de מִשְׁמֶרֶת e representa כָּל. “Tenda”, com inicial maiúscula, conserva o sentido lexical de אֹהֶל e sinaliza que se trata da Tenda sagrada do contexto, sem substituir o termo por “Tabernáculo”.
- source_word: אַךְ
  choice: Contudo
  rationale: Marca a forte limitação imposta ao encargo mencionado antes e introduz com clareza a proibição.
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: dos utensílios sagrados
  rationale: כְּלֵי pode designar utensílios, objetos ou peças de equipamento, e הַקֹּדֶשׁ qualifica sua pertença à esfera sagrada. “Utensílios sagrados” é concreto, claro e próximo da construção hebraica.
- source_word: וְאֶל הַמִּזְבֵּחַ
  choice: nem do altar
  rationale: Sob a negação, “nem” liga naturalmente em português os dois objetos dos quais não se devem aproximar.
- source_word: לֹא יִקְרָבוּ
  choice: não se aproximarão
  rationale: Preserva o sentido espacial de קרב e a força normativa da forma verbal neste contexto.
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַּם אַתֶּם
  choice: para que nem eles nem vocês morram
  rationale: Expressa a consequência fatal que deve ser evitada e verte idiomaticamente גַם...גַם sob negação como “nem...nem”, incluindo os dois grupos.
theological_decisions:
- issue: Destinatário singular e grupo incluído no aviso final
  choice: “você” representa Arão no primeiro membro, enquanto “vocês” inclui Arão e os sacerdotes no aviso final
  alternative: Usar plural em toda a frase ou entender a referência apenas aos sacerdotes em geral
  rationale: O sufixo de מִשְׁמַרְתְּךָ é masculino singular e, no contexto, dirige-se a Arão; אַתֶּם é plural no final. A tradução conserva essa mudança gramatical e não apaga a distinção entre Arão, os sacerdotes e os levitas.
- issue: Alcance do aviso de morte
  choice: A morte é apresentada como risco tanto para os levitas quanto para Arão e os sacerdotes caso os limites sagrados sejam violados
  alternative: Entender que somente os levitas estão sujeitos à morte
  rationale: A construção גַם הֵם גַּם אַתֶּם inclui expressamente ambos os grupos, sem especificar além disso como a culpa seria distribuída.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tenda” recebe inicial maiúscula para indicar a Tenda sagrada específica sem importar “Tabernáculo” para o corpo do texto. A repetição de “responsabilidades” reproduz a repetição lexical hebraica, enquanto “para com” e “relativas a” tornam claras as relações sintáticas em português.
