  terminology: “Encargo” corresponde bem a מִשְׁמֶרֶת no contexto cultual. “Utensílios sagrados”, “altar” e “Tenda” são escolhas naturais e fiéis. A alternância entre “você” e “vocês” preserva a mudança do singular para o plural no hebraico.
