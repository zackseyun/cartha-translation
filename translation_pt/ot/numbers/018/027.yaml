  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: pt
  text: E a contribuição de vocês será considerada como o cereal da eira e como a produção do lagar.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será contada para vocês”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a oferta de vocês”; tradicionalmente, “a oferta alçada de vocês”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a plenitude do lagar”, isto é, toda a produção do lagar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: será considerada
  rationale: O nifal de חשׁב indica que algo é contado ou tido como equivalente. “Será considerada” comunica naturalmente essa equivalência no contexto legal e cultual.
- source_word: תְּרוּמַתְכֶם
  choice: a contribuição de vocês
  rationale: תְּרוּמָה designa uma porção separada para uso sagrado. “Contribuição” é clara e específica no contexto da parte do dízimo entregue pelos levitas.
- source_word: כַּדָּגָן
  choice: como o cereal
  rationale: דָּגָן refere-se à produção de cereais. “Cereal” preserva a imagem agrícola e concorda com a referência coletiva à colheita proveniente da eira.
- source_word: מִן הַגֹּרֶן
  choice: da eira
  rationale: גֹּרֶן é o lugar onde os cereais eram debulhados. “Eira” é o termo português preciso e tradicional, ainda compreensível no registro bíblico.
- source_word: וְכַמְלֵאָה
  choice: e como a produção
  rationale: מְלֵאָה significa literalmente “plenitude” e, neste paralelismo agrícola, indica o produto ou rendimento pleno. “Produção” torna a metonímia compreensível sem mudar seu referente.
- source_word: מִן הַיָּקֶב
  choice: do lagar
  rationale: יֶקֶב designa o lagar ou seu tanque. “Lagar” é o equivalente português convencional e mantém o paralelismo agrícola com a eira.
