source:
  edition: WLC
  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: pt
  text: 'Pois dei aos levitas, como herança, o dízimo dos filhos de Israel, que eles apresentam ao SENHOR como contribuição. Por isso lhes disse: “No meio dos filhos de Israel, eles não terão herança.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: dízimo
  rationale: Equivalente português tradicional e exato para a décima parte destinada no contexto cultual.
- source_word: יָרִימוּ
  choice: apresentam
  rationale: O verbo רום no hifil significa literalmente 'erguer', mas aqui integra a expressão cultual de separar e apresentar uma oferta; 'apresentam' comunica naturalmente essa função sem perder o caráter de ato oferecido ao SENHOR.
- source_word: תְּרוּמָה
  choice: contribuição
  rationale: Expressa algo separado e apresentado como oferta; neste versículo, distingue adequadamente o dízimo entregue ao SENHOR e concedido aos levitas.
- source_word: נַחֲלָה
  choice: herança
  rationale: Preserva a repetição deliberada do hebraico e o contraste entre o dízimo como herança dos levitas e a ausência de herança territorial entre Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a designação coletiva e genealógica do texto hebraico em forma corrente e reconhecível em português bíblico.
theological_decisions:
- issue: Natureza da herança levítica
  choice: Manter 'herança' nas duas ocorrências
  alternative: Traduzir a segunda ocorrência como 'propriedade' ou 'território'
  rationale: 'O texto cria uma tensão intencional: os levitas recebem o dízimo como herança, mas não recebem herança no meio de Israel. A tradução preserva esse jogo teológico e não explicita além do hebraico que a segunda referência é principalmente territorial.'
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama por SENHOR em versaletes, sem acrescentar uma vocalização ao texto consonantal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente para leitores brasileiros e compreensão internacional. A repetição de 'herança' foi preservada por sua importância literária e teológica; a formulação evita arcaísmos desnecessários.
