base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: pt
  text: E os filhos de Israel não se aproximarão mais da tenda do encontro, para que não carreguem pecado[a] e morram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não incorram em culpa». O hebraico diz literalmente «carregar pecado», uma expressão sacerdotal e jurídica que pode indicar assumir a responsabilidade ou as consequências de uma transgressão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: se aproximarão
  rationale: Expressa de modo natural o sentido de קרב, preservando aqui a ideia cultual de aproximar-se do espaço sagrado.
- source_word: עוֹד
  choice: mais
  rationale: Com a negação, forma a expressão idiomática «não... mais», correspondente a «não mais» ou «nunca mais».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de forma transparente a expressão hebraica, que designa coletivamente o povo de Israel.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Reproduz os componentes do termo hebraico e é compreensível em português moderno, sem recorrer ao tradicionalismo menos transparente «tabernáculo».
- source_word: לָשֵׂאת חֵטְא
  choice: para que não levem sobre si o pecado
  rationale: Preserva a imagem hebraica de «carregar/levar pecado», enquanto «sobre si» torna natural em português a ideia de assumir responsabilidade ou consequência.
- source_word: לָמוּת
  choice: e morram
  rationale: Conserva a sequência concisa do hebraico e apresenta a morte como consequência do pecado associado à aproximação indevida.
theological_decisions:
- issue: Se deve ser explicitado que se trata de aproximação não autorizada ao espaço sagrado e da culpa resultante
  choice: 'Manter a formulação concisa: «não se aproximarão mais da tenda do encontro, para que não levem sobre si o pecado e morram».'
  alternative: «não se aproximarão mais da tenda do encontro, para que não incorram em culpa e morram»
  rationale: O contexto atribui aos levitas a responsabilidade pela tenda e restringe a aproximação dos demais israelitas. A tradução não acrescenta «indevidamente» ou «sem autorização», mas conserva a linguagem jurídico-sacerdotal e sua tensão entre pecado, responsabilidade e morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Tenda do encontro» preserva a transparência do hebraico; «filhos de Israel» mantém a forma coletiva da expressão original. A construção final evita explicar além do que o versículo afirma.
