  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: pt
  text: Eles se unirão a você e cumprirão a incumbência da tenda do encontro em todo o serviço da tenda; mas nenhuma pessoa não autorizada[a] se aproximará de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhuma pessoa de fora”. O hebraico זָר refere-se aqui a alguém que não pertence à função autorizada no santuário, não necessariamente a um estrangeiro por origem étnica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְוּוּ עָלֶיךָ
  choice: Eles se unirão a você
  rationale: O nifal de לוה com עַל expressa associação ou ligação a Arão para prestar apoio; esta formulação preserva o sentido relacional e funcional em português natural.
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: cumprirão as responsabilidades relativas a
  rationale: A combinação שׁמר + מִשְׁמֶרֶת designa o cumprimento de uma incumbência confiada. No plural, “responsabilidades” comunica de modo atual o dever formal sem sugerir apenas vigilância física.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução direta e inteligível da designação do santuário, mantendo a ideia de encontro estabelecida pelo hebraico.
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: em todo o serviço da tenda
  rationale: עֲבֹדָה, neste contexto, indica o serviço cultual atribuído aos levitas; “serviço” preserva melhor essa nuance do que o termo genérico “trabalho”.
- source_word: וְזָר
  choice: mas nenhuma pessoa não autorizada
  rationale: זָר designa aqui alguém alheio à função autorizada no santuário, e não necessariamente um estrangeiro em sentido étnico. A adversativa “mas” explicita naturalmente o contraste contextual.
- source_word: יִקְרַב אֲלֵיכֶם
  choice: se aproximará de vocês
  rationale: קרב denota aproximação à esfera sagrada. “De vocês” também torna explícito o plural de אֲלֵיכֶם, dirigido ao grupo envolvido no serviço.
theological_decisions:
- issue: Sentido de זָר na legislação do santuário
  choice: pessoa não autorizada, isto é, alguém fora da função permitida no santuário
  alternative: estranho; estrangeiro; pessoa de fora
  rationale: O contraste diz respeito à autorização para o serviço e à proximidade do santuário, não à origem étnica. A tradução evita transformar uma restrição cultual em distinção nacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Tenda do encontro” mantém a designação tradicional em forma natural; “vocês” preserva explicitamente o plural final do hebraico.
