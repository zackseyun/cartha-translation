  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: pt
  text: Vocês cumprirão o encargo referente ao santuário e o encargo referente ao altar, para que nunca mais haja ira contra os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: Vocês cuidarão do que é devido
  rationale: A construção idiomática combina guardar/cumprir com uma responsabilidade cultual confiada. Em português corrente, “cuidarão do que é devido” comunica tanto o encargo quanto a vigilância, sem a rigidez pouco natural de “guardarão a guarda”.
- source_word: הַקֹּדֶשׁ
  choice: ao santuário
  rationale: No contexto sacerdotal e em paralelo com o altar, o termo designa o âmbito sagrado, aqui expresso naturalmente como “santuário”.
- source_word: הַמִּזְבֵּחַ
  choice: ao altar
  rationale: Equivalente português padrão e preciso para o altar sacrificial.
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: para que nunca mais haja
  rationale: Explicita com naturalidade a relação de finalidade ou resultado sugerida pelo contexto. “Nunca mais” expressa a cessação indicada por עוֹד sob negação.
- source_word: קֶצֶף
  choice: ira
  rationale: Preserva a intensidade do termo em um contexto de juízo, sem acrescentar explicitamente quem exerce essa ira.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de perto a expressão hebraica tradicional e sua forma masculina, enquanto a nota esclarece o sentido coletivo.
theological_decisions:
- issue: Relação entre o cuidado sacerdotal e a ausência de ira
  choice: 'Finalidade/resultado: “para que nunca mais haja ira”'
  alternative: 'Predição coordenada: “e não haverá mais ira”'
  rationale: O contexto liga as responsabilidades sacerdotais à prevenção de nova ira contra Israel; a formulação mantém essa lógica sem afirmar além do que a sequência hebraica e o contexto permitem.
- issue: Origem da ira
  choice: 'Manter o agente implícito: “ira”'
  alternative: 'Explicitar: “ira de Deus”'
  rationale: Embora o contexto indique ira divina, o hebraico não nomeia Deus nesta oração; a tradução preserva essa contenção.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” representa a segunda pessoa masculina plural do hebraico. A repetição paralela do encargo relativo ao santuário e ao altar foi preservada semanticamente.
