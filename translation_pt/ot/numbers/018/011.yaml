  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: pt
  text: 'E isto pertence a você: a contribuição[a] das dádivas deles, juntamente com todas as ofertas apresentadas com movimento ritual dos filhos de Israel. Eu as dei a você, a seus filhos e a suas filhas que estão com você, como estatuto permanente. Todo aquele da sua casa que estiver puro[b] poderá comê-la.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta alçada”. O termo hebraico se refere a uma porção separada para uso sagrado.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “puro” significa ritualmente puro, e não apenas fisicamente limpo ou moralmente íntegro.
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת
  choice: a contribuição
  rationale: תְּרוּמָה designa uma porção separada para uso sagrado. “Contribuição” é claro e atual, enquanto a nota preserva a alternativa cultual tradicional.
- source_word: מַתָּנָם
  choice: das dádivas deles
  rationale: מַתָּנָה significa “dádiva” ou “presente”, e o sufixo indica “deles”. “Dádivas” conserva o sentido básico sem transformar o termo em uma designação sacrificial mais técnica.
- source_word: תְּנוּפֹת
  choice: ofertas movidas
  rationale: תְּנוּפָה é o termo técnico para ofertas apresentadas mediante movimento ritual diante de Deus. “Ofertas movidas” preserva essa prática cultual.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma coletiva convencional e marcada por gênero presente no hebraico, sem substituí-la por uma expressão interpretativamente neutra.
- source_word: נְתַתִּים
  choice: Eu as dei
  rationale: O perfeito indica uma concessão já estabelecida e ainda válida. O pronome plural retoma as porções e ofertas mencionadas.
- source_word: וּלְבָנֶיךָ וְלִבְנֹתֶיךָ אִתָּךְ
  choice: a seus filhos e a suas filhas que estão com você
  rationale: O hebraico menciona explicitamente filhos e filhas. “Que estão com você” exprime sua inclusão na esfera doméstica de Arão.
- source_word: לְחָק עוֹלָם
  choice: como estatuto permanente
  rationale: חֹק denota uma norma ou porção prescrita, e עוֹלָם indica continuidade duradoura dentro da ordem da aliança.
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: Todo aquele da sua casa que estiver puro
  rationale: A formulação natural em português mantém a referência aos integrantes da casa e deixa a nota esclarecer que a pureza é ritual.
- source_word: יֹאכַל אֹתוֹ
  choice: poderá comê-la
  rationale: O imperfeito expressa permissão ou direito de comer. O singular feminino retoma “a contribuição”, acompanhando o singular do objeto hebraico após a referência plural anterior.
theological_decisions:
- issue: Linguagem de pureza ritual
  choice: “puro” entendido no sentido ritual e esclarecido em nota
  alternative: moralmente puro; fisicamente limpo
  rationale: O contexto regula quem, na casa sacerdotal de Arão, pode consumir porções sagradas. Portanto, טָהוֹר pertence à categoria levítica de pureza ritual, não a uma avaliação geral de moralidade ou higiene.
- issue: Alternância entre referentes plurais e singular
  choice: “Eu as dei” seguido de “poderá comê-la”
  alternative: uniformizar tudo no plural ou tudo no singular
  rationale: O hebraico passa de um objeto pronominal plural em נְתַתִּים para um objeto singular em אֹתוֹ. A tradução preserva essa mudança, permitindo que o singular final retome a contribuição como porção coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos cultuais necessários sem linguagem arcaica; as notas esclarecem o tecnicismo de “contribuição” e o sentido ritual de “puro”.
