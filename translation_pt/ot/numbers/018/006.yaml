  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: pt
  text: Quanto a mim, eis que tomei os levitas, irmãos de vocês, do meio dos filhos de Israel[a]. Eles são uma dádiva para vocês, dados a Yahweh para realizar o serviço da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do meio dos israelitas”. O hebraico diz literalmente “do meio dos filhos de Israel”.'
    reason: Alternativa idiomática para a expressão hebraica בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Quanto a mim, eis que
  rationale: Preserva a ênfase no pronome divino e a força apresentativa de הִנֵּה, em registro solene e inteligível.
- source_word: לָקַחְתִּי
  choice: tomei
  rationale: Mantém o sentido básico de לקח sem acrescentar a interpretação mais específica de “escolhi”; o perfeito hebraico apresenta a ação como realizada.
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: os levitas, irmãos de vocês
  rationale: Conserva a linguagem familiar de “irmãos” e deixa claro, por aposição natural em português, que ela se refere aos levitas.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: do meio dos filhos de Israel
  rationale: Reproduz a imagem de separação do conjunto de Israel e preserva a forma masculina e familiar do hebraico, registrando em nota a alternativa idiomática.
- source_word: לָכֶם מַתָּנָה נְתֻנִים לַיהוָה
  choice: Eles são uma dádiva para vocês, dados a Yahweh
  rationale: 'Mantém a relação entre מַתָּנָה (“dádiva”) e נְתֻנִים (“dados”), bem como a dupla relação: destinados aos sacerdotes como dádiva e entregues a Yahweh.'
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: para realizar o serviço
  rationale: Expressa naturalmente em português a construção cognata hebraica sem a repetição pouco idiomática “servir o serviço”.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução direta e consagrada da designação do santuário, preservando a ideia de encontro estabelecido.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Referente de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A tradução principal mantém a expressão familiar e masculina do hebraico, enquanto a nota oferece a equivalência coletiva mais corrente sem mudar o referente.
- issue: Relação dos levitas com os sacerdotes e com Yahweh
  choice: uma dádiva para vocês, dados a Yahweh
  alternative: entregues a vocês como dádiva do Senhor
  rationale: Preserva as duas relações dativas presentes no texto e evita transformar “a Yahweh” em “do Senhor”, interpretação que eliminaria a tensão sintática.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” mantém a solenidade de הִנֵּה; “dádiva” preserva o campo lexical de dar sem soar excessivamente técnico. A divisão em duas frases torna clara a sintaxe densa do hebraico sem apagar a repetição intencional entre dádiva e dados.
