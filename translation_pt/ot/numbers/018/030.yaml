  text: וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בַּ/הֲרִֽימְ/כֶ֤ם אֶת חֶלְבּ/וֹ֙ מִמֶּ֔/נּוּ וְ/נֶחְשַׁב֙ לַ/לְוִיִּ֔ם כִּ/תְבוּאַ֥ת גֹּ֖רֶן וְ/כִ/תְבוּאַ֥ת יָֽקֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: pt
  text: 'E diga-lhes: “Quando vocês separarem da contribuição de vocês a melhor parte[a], a contribuição de vocês será considerada para os levitas como o produto da eira e como o produto do lagar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sua gordura”; aqui, a expressão se refere figuradamente à parte mais rica ou melhor da produção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: E diga-lhes
  rationale: Reproduz a instrução direta, no singular, dada a Moisés, com formulação natural e digna em português.
- source_word: בַּהֲרִימְכֶם
  choice: Quando vocês separarem
  rationale: O Hifil de רום pode indicar levantar ou apresentar uma contribuição. No contexto, “separarem” comunica com clareza o ato de retirar a porção destinada à oferta, sem obscurecer a função cultual.
- source_word: חֶלְבּוֹ
  choice: a melhor parte
  rationale: Literalmente, “sua gordura”; aplicado a produtos agrícolas, o termo designa idiomaticamente a parte mais rica ou excelente.
- source_word: מִמֶּנּוּ
  choice: dela
  rationale: O pronome retoma a porção previamente mencionada no contexto, preservando a relação de procedência de modo conciso.
- source_word: וְנֶחְשַׁב
  choice: ela será considerada
  rationale: Mantém a forma passiva e o sentido jurídico-contábil de atribuir ou reconhecer determinado valor à contribuição.
- source_word: לַלְוִיִּם
  choice: para os levitas
  rationale: 'Expressa naturalmente a relação dativa: é assim que a porção será contabilizada em favor dos levitas.'
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: como o produto da eira
  rationale: Preserva a imagem agrícola e o sentido de תבואה como produto ou colheita, em paralelo com a expressão seguinte.
- source_word: וְכִתְבוּאַת יָקֶב
  choice: e como o produto do lagar
  rationale: “Lagar” é o equivalente português tradicional e inteligível para יֶקֶב, preservando o paralelismo com “eira”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e respeitoso, com leitura natural no Brasil e compreensão internacional. O plural “vocês” explicita que a ordem, embora dirigida a Moisés no singular, deve ser comunicada aos levitas. O marcador da nota foi colocado junto de “a melhor parte”, expressão à qual a nota lexical se refere.
