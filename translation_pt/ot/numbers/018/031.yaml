id: NUM.18.31
reference: Numbers 18:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: pt
  text: Vocês e os membros da sua casa[b] podem comê-lo[a] em qualquer lugar, pois ele é o pagamento[c] pelo serviço que vocês prestam na tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devem comê-lo”. Neste contexto legal, a forma hebraica pode indicar instrução ou ação permitida, em vez de simples tempo passado.
    reason: lexical_alternative
  - marker: b
    text: Lit. “sua casa”; aqui, a expressão se refere à unidade doméstica, não apenas ao edifício.
    reason: cultural_note
  - marker: c
    text: Ou “salário”, “recompensa” ou “compensação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: podem comê-lo
  rationale: Neste contexto legal, a forma hebraica expressa ação autorizada ou prescrita, não simples passado narrativo. A formulação comunica com naturalidade a permissão de consumir a porção.
- source_word: בְּכָל מָקוֹם
  choice: em qualquer lugar
  rationale: A expressão indica que o consumo não está restrito ao santuário e preserva o valor distributivo do hebraico.
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: vocês e os membros da sua casa
  rationale: בית designa aqui a unidade doméstica, não o edifício. Esta formulação é natural em português e suficientemente abrangente sem reduzir o sentido apenas à família nuclear.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da permissão. “Pois” mantém a ligação explicativa com dignidade e clareza.
- source_word: שָׂכָר
  choice: pagamento
  rationale: O substantivo denota remuneração pelo trabalho. “Pagamento” é claro e evita sugerir uma recompensa meramente honorífica.
- source_word: חֵלֶף
  choice: pelo
  rationale: Com “pagamento”, a construção idiomática “pagamento pelo serviço” comunica a relação de compensação expressa pelo hebraico חֵלֶף.
- source_word: עֲבֹדַתְכֶם
  choice: serviço que vocês prestam
  rationale: “Serviço” preserva a nuance de trabalho cultual designado; a oração verbal torna a relação natural em português.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: É uma tradução direta e reconhecível da designação do santuário, mantendo a preposição hebraica sem tornar a frase artificial.
theological_decisions:
- issue: Natureza da porção dos levitas
  choice: O alimento é apresentado como remuneração legítima pelo serviço levítico e pode ser consumido em qualquer lugar.
  alternative: Entender a porção mais estritamente como refeição sagrada limitada a um espaço cultual.
  rationale: A expressão explícita בְּכָל מָקוֹם, “em qualquer lugar”, afasta uma restrição ao recinto do santuário e distingue esta porção de ofertas cujo consumo era espacialmente limitado.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”. “Membros da sua casa” representa a unidade doméstica de modo compreensível e evita que “casa” seja entendida apenas como residência física. Os marcadores foram posicionados imediatamente após as expressões às quais se referem.
