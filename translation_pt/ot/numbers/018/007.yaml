base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: pt
  text: Mas você e seus filhos com você cuidarão do seu sacerdócio em tudo o que diz respeito ao altar e ao que está dentro do véu, e prestarão serviço. Eu lhes dou o sacerdócio como um serviço concedido de presente[a]. Mas a pessoa não autorizada[b] que se aproximar será morta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lhes concedo o sacerdócio como dádiva para o serviço” ou “como um serviço dado de presente”. A expressão hebraica pode enfatizar tanto o serviço como dádiva quanto o sacerdócio concedido para servir.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o estranho” ou “o de fora”; aqui, refere-se a qualquer pessoa não autorizada a exercer as funções sacerdotais, e não especificamente a um estrangeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: cuidarão
  rationale: No contexto, שׁמר denota guardar uma responsabilidade ou exercer fielmente um encargo. “Cuidarão do seu sacerdócio” é natural em português e conserva a ideia de custódia responsável.
- source_word: כְּהֻנַּתְכֶם
  choice: seu sacerdócio
  rationale: Refere-se ao ofício e à função sacerdotal, não apenas a atos isolados.
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: em tudo o que diz respeito ao altar
  rationale: דבר tem aqui sentido amplo de assunto ou incumbência relacionada ao altar, sem exigir a especificação de atos rituais concretos.
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: e ao que está para dentro do véu
  rationale: A expressão indica o âmbito no lado interior da cortina do santuário. “Para dentro do véu” mantém a referência espacial e o registro digno.
- source_word: וַעֲבַדְתֶּם
  choice: e servirão
  rationale: עבד, em contexto cultual, significa prestar ou executar serviço. A formulação preserva a amplitude do verbo sem importar terminologia eclesiástica posterior.
- source_word: עֲבֹדַת מַתָּנָה
  choice: um serviço concedido de presente
  rationale: A construção hebraica é condensada e permite relacionar a dádiva tanto ao serviço quanto ao sacerdócio. A escolha é inteligível, mantém os dois substantivos e não elimina a ambiguidade, explicitada em nota.
- source_word: אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: Eu lhes dou o sacerdócio
  rationale: O imperfeito expressa aqui a concessão divina do sacerdócio. O presente em discurso direto soa natural e conserva a força declarativa.
- source_word: הַזָּר
  choice: a pessoa não autorizada
  rationale: Na legislação sacerdotal, זָר designa quem não pertence ao grupo autorizado a exercer a função sagrada; não significa necessariamente estrangeiro.
- source_word: הַקָּרֵב
  choice: que se aproximar
  rationale: קרב é o termo usual para aproximar-se do espaço ou serviço sagrado e conserva aqui simultaneamente a dimensão física e cultual.
- source_word: יוּמָת
  choice: será morta
  rationale: A forma hofal é causativa-passiva e exprime imposição de morte, não simples previsão de que a pessoa morrerá.
theological_decisions:
- issue: Sentido de זָר na legislação sacerdotal
  choice: a pessoa não autorizada
  alternative: o estranho; o de fora; qualquer leigo
  rationale: A expressão identifica quem está fora da autorização sacerdotal para esse serviço. A tradução evita a leitura étnica indevida de “estrangeiro” e preserva a restrição legal.
- issue: Relação sintática em עֲבֹדַת מַתָּנָה
  choice: o sacerdócio é dado como serviço concedido de presente
  alternative: o serviço é uma dádiva; o sacerdócio é uma dádiva destinada ao serviço
  rationale: O hebraico comprimido pode enfatizar a dádiva do serviço ou a concessão do sacerdócio para servir. O texto mantém a formulação compacta, e a nota registra as possibilidades sem decidir além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Véu” preserva o termo tradicional para a cortina interna do santuário. A repetição de “sacerdócio” acompanha a estrutura e a ênfase do hebraico. Os futuros mantêm o tom prescritivo da legislação.
