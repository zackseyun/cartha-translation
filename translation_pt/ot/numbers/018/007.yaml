  - severity: low
    issue: Pontuação e formulação do serviço sacerdotal
    rationale: O ponto e vírgula antes de “e servirão” separa uma sequência verbal coordenada. “E prestarão serviço” é uma expressão portuguesa mais natural para o verbo cultual עבד, sem impor terminologia eclesiástica.
