  to: Mas você e seus filhos com você cuidarão do seu sacerdócio em tudo o que diz respeito ao altar e ao que está dentro do véu, e prestarão serviço. Eu lhes dou o sacerdócio como um serviço concedido de presente[a]. Mas a pessoa não autorizada[b] que se aproximar será morta.
