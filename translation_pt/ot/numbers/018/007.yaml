  source_fidelity: A tradução transmite adequadamente a incumbência sacerdotal, o âmbito do altar e do interior do véu, a concessão divina do sacerdócio e a pena para quem se aproxima sem autorização. Contudo, “para dentro do véu” é pouco natural em português para a localização indicada pelo hebraico; “dentro do véu” expressa melhor o referente espacial sem acrescentar sentido.
  naturalness: O texto é claro e de registro apropriado, mas a locução “ao que está para dentro do véu” soa artificial. A ligação por ponto e vírgula antes de “e servirão” também interrompe desnecessariamente uma única instrução. “Prestarão serviço” torna explícito, de maneira idiomática, o sentido cultual de עבד.
  terminology: “Sacerdócio”, “altar” e “véu” são terminologia adequada. “Pessoa não autorizada” comunica corretamente que זָר não se refere necessariamente a alguém estrangeiro. “Será morta” preserva a força passiva-causativa legal de יוּמָת.
