revisions:
- from: 'Então Yahweh disse a Arão: “Quanto a mim, eis que lhe confiei a responsabilidade pelas minhas contribuições[a], por todas as coisas sagradas dos filhos de Israel[b]. Eu as dei a você como sua porção devida à unção[c] e a seus filhos, como prescrição permanente.”'
  to: 'Então Yahweh disse a Arão: “Quanto a mim, eis que lhe confiei a responsabilidade pelas minhas contribuições[a], por todas as coisas sagradas dos filhos de Israel[b]. Eu as dei a você como porção ligada à sua unção[c] e a seus filhos, como estatuto perpétuo.”'
  rationale: A revisão reduz uma explicitação interpretativa em «devida à unção» e substitui «prescrição permanente» por «estatuto perpétuo», mantendo o sentido da concessão sacerdotal e a ambiguidade lexical relevante do hebraico. As âncoras de nota permanecem corretamente vinculadas aos termos comentados.
