review_pass:
  verdict: revise
  source_fidelity: A tradução preserva o destinatário, a ênfase divina, as contribuições sagradas e a concessão hereditária. Contudo, «porção devida à unção» explicita demais uma relação causal que o hebraico לְמָשְׁחָה deixa mais concisa e lexicalmente aberta.
  naturalness: O texto é em geral claro e de registro adequado. «Porção ligada à sua unção» soa natural em português e mantém melhor a relação sem transformar a expressão em linguagem de direito adquirido.
  terminology: «Yahweh», «Arão», «contribuições», «coisas sagradas», «filhos de Israel» e «estatuto perpétuo» são escolhas consistentes e compreensíveis. «Estatuto perpétuo» corresponde mais diretamente a חֹק עוֹלָם do que «prescrição permanente».
  issues:
  - severity: medium
    issue: «como sua porção devida à unção»
    rationale: «Devida à» torna explícito que a unção é a causa jurídica da porção. Embora seja uma interpretação contextual plausível, לְמָשְׁחָה é mais breve e admite formulações como «para unção» ou «como porção ligada à unção». A formulação revisada conserva o vínculo sacerdotal sem fechar a ambiguidade.
  - severity: low
    issue: «prescrição permanente» para לְחָק עוֹלָם
    rationale: A expressão hebraica designa um estatuto, regulamento fixo ou direito estabelecido de duração contínua. «Estatuto perpétuo» é mais idiomático no registro bíblico moderno e mais próximo da força legal de חֹק.
