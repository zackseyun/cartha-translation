  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: pt
  text: 'Então Yahweh disse a Arão: “Quanto a mim, eis que lhe confiei a responsabilidade pelas minhas contribuições[a], por todas as coisas sagradas dos filhos de Israel[b]. Eu as dei a você como porção ligada à sua unção[c] e a seus filhos, como estatuto perpétuo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minhas ofertas” ou, em linguagem mais técnica, “minhas ofertas alçadas”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”, designação pactual usual do povo de Israel.'
    reason: cultural_note
  - marker: c
    text: Ou “para unção”. O hebraico provavelmente se refere à porção que cabia a Arão em virtude de seu ofício sacerdotal ungido.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְדַבֵּר
  choice: disse
  rationale: Em português, “disse” introduz naturalmente o discurso direto sem perder o valor narrativo de דבר.
- source_word: וַאֲנִי הִנֵּה
  choice: Quanto a mim, eis que
  rationale: Reproduz tanto a ênfase do pronome independente quanto a força de chamada de atenção de הִנֵּה, em formulação digna e compreensível.
- source_word: נָתַתִּי לְךָ אֶת מִשְׁמֶרֶת
  choice: lhe confiei a responsabilidade
  rationale: Expressa o resultado presente do perfeito e o sentido de encargo ou custódia de מִשְׁמֶרֶת; “confiei” torna clara a natureza do encargo sem alterar seu conteúdo.
- source_word: תְּרוּמֹתַי
  choice: minhas contribuições
  rationale: Mantém o sentido específico de dádivas separadas e apresentadas a Yahweh, sem recorrer ao termo técnico e pouco transparente “ofertas alçadas”.
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: por todas as coisas sagradas dos filhos de Israel
  rationale: “Coisas sagradas” preserva a amplitude de קָדְשֵׁי, enquanto “filhos de Israel” mantém a designação pactual formal do hebraico.
- source_word: לְמָשְׁחָה
  choice: como sua porção devida à unção
  rationale: Comunica que a concessão pertence a Arão em conexão com sua unção sacerdotal, preservando em nota a possibilidade mais estritamente formal.
- source_word: לְחָק עוֹלָם
  choice: como prescrição permanente
  rationale: “Prescrição” expressa uma determinação fixa ou direito estabelecido, e “permanente” comunica a duração continuada no âmbito da legislação pactual.
theological_decisions:
- issue: Sentido da concessão sacerdotal em לְמָשְׁחָה
  choice: como sua porção devida à unção
  alternative: para unção; como porção de sua unção
  rationale: O contexto associa as dádivas ao ofício ungido de Arão, mas a nota conserva a concisão e a ambiguidade da expressão hebraica, sem fazê-la indicar uma nova cerimônia de unção.
- issue: Forma da designação בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: Mantém a forma masculina e genealógica da designação pactual hebraica, sem sugerir que apenas homens contribuíam; uma nota esclarece seu uso coletivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém a ênfase incomum de וַאֲנִי הִנֵּה sem imitar rigidamente a ordem hebraica. Os termos cultuais são claros no corpo do texto, e as alternativas mais técnicas ou ambíguas ficam registradas em notas.
