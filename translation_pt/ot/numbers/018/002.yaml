  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: pt
  text: Traga também para junto de você seus irmãos da tribo de Levi, a tribo de seu pai, para que se unam a você[a] e o sirvam, enquanto você e seus filhos estiverem diante da tenda do testemunho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o acompanhem” ou “se vinculem a você”. O verbo hebraico também faz um jogo de palavras com o nome Levi.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “tenda do testemunho”. Muitas traduções trazem aqui “tenda do encontro”, por influência de expressões semelhantes e mais frequentes relacionadas ao tabernáculo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: também
  rationale: Preserva a força aditiva da expressão inicial de modo natural em português.
- source_word: אַחֶיךָ
  choice: seus irmãos
  rationale: Mantém a linguagem familiar do hebraico; no contexto, refere-se aos demais levitas aparentados com Arão.
- source_word: מַטֵּה לֵוִי
  choice: a tribo de Levi
  rationale: מַטֶּה designa aqui a unidade tribal, e não um bastão físico.
- source_word: שֵׁבֶט אָבִיךָ
  choice: a tribo de seu pai
  rationale: Conserva a expressão apositiva que identifica Levi como a tribo ancestral de Arão.
- source_word: הַקְרֵב אִתָּךְ
  choice: Traga também para junto de você
  rationale: Expressa a ideia causativa de aproximar ou apresentar para o serviço, com linguagem corrente e digna.
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: para que se unam a você
  rationale: O verbo no nifal comunica união ou vinculação e também produz uma associação sonora e semântica com o nome Levi.
- source_word: וִישָׁרְתוּךָ
  choice: e o sirvam
  rationale: שרת denota serviço ou assistência; “sirvam” é claro e evita uma formulação excessivamente eclesiástica.
- source_word: וְאַתָּה וּבָנֶיךָ אִתָּךְ
  choice: enquanto você e seus filhos estiverem
  rationale: A formulação explicita em português a relação circunstancial entre o serviço dos levitas e a posição sacerdotal de Arão e seus filhos, sem acrescentar uma função doutrinária.
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: diante da tenda do testemunho
  rationale: Segue o texto hebraico específico deste versículo, que diz “testemunho”, sem harmonizá-lo com a expressão mais comum “tenda do encontro”.
theological_decisions:
- issue: Tradução de אֹהֶל הָעֵדֻת
  choice: tenda do testemunho
  alternative: tenda do encontro
  rationale: O hebraico deste versículo traz עֵדֻת, “testemunho”. A tradução preserva essa leitura e sua associação com o testemunho da aliança, em vez de substituí-la pela expressão tabernacular mais familiar.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. A repetição de “tribo” foi mantida por refletir a aposição hebraica, e os marcadores de nota foram posicionados junto às expressões que explicam.
