  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: pt
  text: 'Você resgatará os que devem ser resgatados, a partir de um mês de idade, pelo valor que você determinar: cinco siclos de prata, segundo o siclo do santuário; ele equivale a vinte geras.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “ele é vinte geras”. O pronome “ele” se refere ao siclo do santuário como padrão de peso.'
    reason: A nota preserva a forma pronominal concisa do hebraico e esclarece seu referente.
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: os que devem ser resgatados
  rationale: O particípio passivo com sufixo masculino singular é sintaticamente difícil e tem sentido genérico no contexto dos primogênitos sujeitos a resgate. A formulação plural em português expressa com naturalidade a regra geral sem alterar seu referente.
- source_word: מִבֶּן חֹדֶשׁ
  choice: a partir de um mês de idade
  rationale: A expressão indica o limiar de idade desde o qual o resgate deve ocorrer.
- source_word: תִּפְדֶּה
  choice: você resgatará
  rationale: O imperfeito na instrução legal expressa obrigação. O futuro do indicativo preserva o tom normativo e dirige a ordem ao sacerdote.
- source_word: בְּעֶרְכְּךָ
  choice: pelo valor que você determinar
  rationale: ערך designa uma avaliação fixada em contexto sacerdotal e legal; a redação explicita de modo natural o sufixo de segunda pessoa.
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: cinco siclos de prata
  rationale: É a forma corrente e clara de expressar em português a quantidade e o material.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão identifica o padrão oficial de peso usado para calcular o valor.
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: ele equivale a vinte geras
  rationale: O pronome hebraico retoma o siclo do santuário. 'Equivale a' comunica naturalmente que se trata de uma correspondência de peso, preservando o pronome e esclarecendo-o em nota.
