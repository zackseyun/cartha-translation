source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: pt
  text: Mas não resgate o primogênito de um animal bovino, de uma ovelha ou de uma cabra; eles são santos. Asperja o sangue deles sobre o altar e queime a gordura como oferta feita pelo fogo[a], de aroma agradável a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta pelo fogo”.'
    reason: Registra uma formulação mais concisa para o termo cultual אִשֶּׁה, sem equipará-lo ao holocausto.
lexical_decisions:
- source_word: אַךְ
  choice: Mas
  rationale: Introduz uma exceção à legislação anterior de modo natural, preservando a força restritiva e adversativa.
- source_word: בְּכוֹר
  choice: primogênito
  rationale: Expressa com precisão o primeiro nascido, aqui com significado cultual.
- source_word: שׁוֹר
  choice: vaca
  rationale: O substantivo pode designar um animal bovino de modo genérico; como o sexo do primogênito não é especificado pelo termo, “vaca” funciona em português como nome corrente da espécie, sem restringir a um touro castrado.
- source_word: כֶּשֶׂב
  choice: ovelha
  rationale: Designa genericamente um animal do rebanho ovino; “ovelha” mantém a referência à espécie sem limitar a idade a um cordeiro.
- source_word: עֵז
  choice: cabra
  rationale: É o termo comum e claro para a espécie caprina.
- source_word: לֹא תִפְדֶּה
  choice: não resgate
  rationale: פדה, em contexto legal e sacerdotal, indica libertar mediante pagamento ou substituição; “resgatar” conserva esse sentido técnico em linguagem compreensível.
- source_word: קֹדֶשׁ הֵם
  choice: eles são santos
  rationale: Mantém a afirmação predicativa que fundamenta a proibição e preserva o registro cultual de קֹדֶשׁ.
- source_word: אֶת דָּמָם תִּזְרֹק
  choice: asperja o sangue deles
  rationale: זרק descreve a aplicação ritual do sangue ao altar. “Aspergir” é o verbo português estabelecido para esse rito, embora o gesto possa envolver lançar ou salpicar o sangue.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Tradução direta e idiomática da localização do rito sacrificial.
- source_word: וְאֶת חֶלְבָּם תַּקְטִיר
  choice: e queime a gordura
  rationale: No contexto sacrificial, o hifil de קטר indica fazer a gordura subir em fumaça no altar; “queimar” comunica o ato com clareza.
- source_word: אִשֶּׁה
  choice: oferta queimada
  rationale: Designa uma oferta apresentada por meio do fogo. “Oferta queimada” é clara em português, enquanto a alternativa mais formal fica registrada em nota.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma agradável
  rationale: Reproduz o idioma cultual sem explicar além do texto nem reduzir sua linguagem antropomórfica.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta explicitamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido do termo cultual אִשֶּׁה
  choice: oferta queimada
  alternative: oferta feita pelo fogo
  rationale: A formulação principal comunica em português atual que a oferta é apresentada mediante queima, e a nota preserva a forma estruturalmente mais próxima do hebraico sem definir de maneira excessiva a categoria sacrificial.
translation_notes:
  register: Português moderno, claro e digno, com formas imperativas dirigidas ao interlocutor singular sem explicitar o pronome. Conserva-se o vocabulário cultual tradicional onde ele continua inteligível, evitando arcaísmos desnecessários.
