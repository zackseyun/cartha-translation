  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: pt
  text: Mas a carne deles[a] será sua, assim como o peito da oferta de apresentação[b] e a coxa direita também serão seus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a porção de carne deles”. O hebraico diz literalmente “a carne deles”, referindo-se à parte comestível do sacrifício.
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente, “oferta movida”: uma porção apresentada ritualmente diante do SENHOR, ao que parece mediante um movimento cerimonial.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: Mas a carne deles
  rationale: בָּשָׂר significa literalmente “carne” e, neste contexto sacrificial, designa a porção comestível. “Carne” conserva a linguagem concreta do hebraico. A conjunção foi traduzida por “Mas” para expressar o contraste contextual com o sangue e a gordura mencionados no versículo anterior.
- source_word: יִהְיֶה לָּךְ / לְךָ יִהְיֶה
  choice: será sua / será sua
  rationale: A construção היה + ל indica posse ou direito de receber. A repetição foi mantida para refletir a ênfase jurídica do hebraico na porção atribuída ao sacerdote.
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: assim como o peito da oferta de apresentação
  rationale: חָזֶה é o “peito” do animal, e תְּנוּפָה designa uma oferta ou porção apresentada ritualmente diante do SENHOR, possivelmente mediante um movimento cerimonial. “Oferta de apresentação” comunica a função do rito com mais clareza no português corrente.
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: e a coxa direita
  rationale: שׁוֹק designa a parte da perna, aqui a porção sacrificial geralmente entendida como a coxa. “Coxa direita” é claro, natural e adequado ao contexto de distribuição sacerdotal.
theological_decisions:
- issue: Referente das formas pronominais da segunda pessoa
  choice: Traduzir ambas por “sua”, entendendo a fala como dirigida a Arão enquanto representante do sacerdócio.
  alternative: Explicitar “será de vocês”, referindo-se coletivamente aos sacerdotes, ou inserir o nome de Arão.
  rationale: O hebraico apresenta primeiro um sufixo formalmente feminino em לָּךְ e depois um masculino em לְךָ. A irregularidade não exige dois destinatários distintos no contexto. “Sua” conserva a atribuição a Arão sem acrescentar um referente que o texto não explicita.
- issue: Natureza da תְּנוּפָה
  choice: “oferta de apresentação”
  alternative: “oferta movida” ou “oferta ritualmente agitada”
  rationale: O termo se refere à apresentação ritual de uma porção diante do SENHOR. A tradução escolhida evita afirmar mais sobre o movimento exato do rito do que a evidência permite, enquanto a nota registra a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a repetição final “será sua” para reproduzir a ênfase do hebraico, e emprega-se “oferta de apresentação” no texto com a designação tradicional explicada em nota.
