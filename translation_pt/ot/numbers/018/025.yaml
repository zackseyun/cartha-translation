  yaml_path: translation/ot/numbers/018/025.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O wayyiqtol de דבר introduz o passo seguinte da narrativa. “E ... falou” preserva o valor do verbo e corresponde naturalmente à fórmula hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; em português, “falar a alguém” é uma formulação clara e digna neste contexto.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto e mantém a ligação com o versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do hebraico. O uso de “dizendo” conserva a fórmula introdutória, embora seja mais formal do que a expressão cotidiana “disse”.
