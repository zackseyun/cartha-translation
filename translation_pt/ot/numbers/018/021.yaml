source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: pt
  text: E aos filhos de Levi, eis que dei todos os dízimos em Israel como herança, em troca do serviço que prestam, o serviço da tenda do encontro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי
  choice: E aos filhos de Levi
  rationale: Preserva a formulação genealógica hebraica e a ligação do versículo com o contexto anterior; «levitas» seria uma alternativa natural, mas menos formalmente transparente.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a função enfática e de chamada de atenção do marcador hebraico em registro bíblico digno e compreensível.
- source_word: נָתַתִּי
  choice: dei
  rationale: O perfeito apresenta a concessão divina como estabelecida. O pretérito perfeito é natural em português e não exige explicitar um valor resultativo além do hebraico.
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: todos os dízimos em Israel
  rationale: Expressa naturalmente o possível valor distributivo de כָּל com o substantivo singular coletivo; também evita a forma pouco idiomática «todo dízimo» neste contexto.
- source_word: לְנַחֲלָה
  choice: como herança
  rationale: Conserva a linguagem de porção atribuída e recebida, central no contexto da distribuição tribal.
- source_word: חֵלֶף
  choice: em troca de
  rationale: Comunica a relação de correspondência ou compensação expressa pelo hebraico, sem reduzi-la a uma transação comercial estrita.
- source_word: עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים
  choice: o serviço que prestam
  rationale: Reproduz tanto o substantivo quanto a ação verbal de modo idiomático, evitando a repetição artificial «o serviço que servem».
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: o serviço da tenda do encontro
  rationale: Mantém de perto a cadeia construta hebraica e a designação institucional אֹהֶל מוֹעֵד, sem acrescentar uma localização não explicitada.
theological_decisions:
- issue: Relação entre os dízimos, a herança levítica e o serviço
  choice: Os dízimos são dados aos filhos de Levi como herança em troca de seu serviço.
  alternative: Os dízimos apenas substituem uma herança territorial, sem ênfase compensatória.
  rationale: O texto combina explicitamente לְנַחֲלָה, «como herança», e חֵלֶף עֲבֹדָתָם, «em troca do serviço deles»; a tradução conserva as duas ideias sem fazer uma absorver a outra.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Conserva «filhos de Levi» e «eis que» por sua função textual, mas usa construções correntes como «serviço que prestam». Não foram incluídas notas porque nenhuma é necessária para compreender o versículo; o material inglês fornecido apresenta marcadores e conteúdos desalinhados, por isso não foi reproduzido mecanicamente.
