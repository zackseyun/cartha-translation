  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: pt
  text: Mas o próprio levita fará o serviço da tenda do encontro, e eles arcarão com sua iniquidade.[a] É um estatuto permanente ao longo de suas gerações. Entre os filhos de Israel,[b] eles não receberão herança alguma.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregarão sua culpa”. A expressão hebraica pode indicar carregar culpa ou iniquidade, bem como a responsabilidade ou as consequências ligadas a ela.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre os israelitas”. O hebraico diz literalmente “entre os filhos de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “não herdarão herança”. A repetição de palavras da mesma raiz em hebraico enfatiza que eles não receberiam uma porção territorial tribal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: fará
  rationale: No contexto legal, a forma verbal tem força prescritiva e prospectiva. “Fará” exprime a obrigação de modo natural em português.
- source_word: הַלֵּוִי הוּא
  choice: o próprio levita
  rationale: O pronome independente acrescenta ênfase; “o próprio levita” preserva essa força sem introduzir exclusividade indevida.
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: o serviço da tenda do encontro
  rationale: עֲבֹדָה designa aqui o serviço ou dever cultual. “Tenda do encontro” traduz אֹהֶל מוֹעֵד com clareza e dignidade.
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: e eles levarão sobre si a sua iniquidade
  rationale: A expressão preserva o idioma jurídico-cultual נשא עון e sua amplitude, que pode envolver culpa, iniquidade ou a responsabilidade e consequências ligadas a ela.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: A formulação comunica uma ordenança duradoura dentro da ordem da aliança de Israel sem impor ao termo uma definição metafísica de eternidade.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão indica vigência contínua ao longo das gerações sucessivas e soa natural em português.
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a expressão masculina do hebraico e traduz בְּתוֹךְ de acordo com seu sentido relacional neste contexto.
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: não receberão herança alguma
  rationale: A redação portuguesa evita uma repetição pouco natural, enquanto “alguma” conserva a ênfase da construção cognata hebraica que nega aos levitas uma porção territorial tribal.
theological_decisions:
- issue: O sentido da responsabilidade ligada ao serviço levítico
  choice: “levarão sobre si a sua iniquidade”
  alternative: “carregarão a sua culpa” ou “sofrerão as consequências do seu pecado”
  rationale: A opção preserva a tensão do idioma hebraico, sem decidir indevidamente se a ênfase recai sobre culpa, pecado, responsabilidade jurídica ou consequências.
- issue: A duração do estatuto
  choice: “estatuto permanente por todas as suas gerações”
  alternative: “estatuto perpétuo” ou “estatuto eterno”
  rationale: A tradução mantém a força duradoura da fórmula no contexto da ordem da aliança de Israel, sem ampliar ou limitar além do que o versículo afirma.
- issue: A herança negada aos levitas
  choice: “não receberão herança alguma”
  alternative: “não herdarão herança”
  rationale: O contexto trata da ausência de uma porção territorial tribal entre Israel. A formulação escolhida comunica a negação enfática sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente ajustada para fluidez, preservando o tom jurídico-cultual e as ambiguidades relevantes do hebraico.
