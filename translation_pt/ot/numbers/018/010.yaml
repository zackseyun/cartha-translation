id: NUM.18.10
reference: Numbers 18:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/קֹ֥דֶשׁ הַ/קֳּדָשִׁ֖ים תֹּאכֲלֶ֑/נּוּ כָּל זָכָר֙ יֹאכַ֣ל אֹת֔/וֹ קֹ֖דֶשׁ יִֽהְיֶה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: pt
  text: Você deverá comer isso em lugar santíssimo[a]; todo homem poderá comer disso. Isso será santo para você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “no Santo dos Santos”. Aqui, a expressão designa o lugar santíssimo estabelecido para essa refeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: em lugar santíssimo
  rationale: Preserva a força locativa de בְּ e comunica naturalmente o superlativo hebraico sem sugerir, de modo indevido, que a refeição ocorria exclusivamente no recinto interior chamado Santo dos Santos.
- source_word: תֹּאכֲלֶנּוּ
  choice: Você deverá comer isso
  rationale: Mantém a segunda pessoa do singular, dirigida a Arão como representante, e expressa o caráter prescritivo da instrução sacerdotal.
- source_word: כָּל זָכָר
  choice: todo homem
  rationale: Indica claramente pessoas do sexo masculino, como exige זָכָר, em português corrente e sem a formulação burocrática 'todo indivíduo do sexo masculino'.
- source_word: יֹאכַל אֹתוֹ
  choice: poderá comer disso
  rationale: O imperfeito, após a restrição por sexo, expressa autorização ou elegibilidade. 'Poderá' distingue essa permissão da obrigação formulada na primeira oração.
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: Isso será santo para você
  rationale: Preserva o termo cultual קֹדֶשׁ e a relação expressa por לָּךְ, sem acrescentar uma explicação teológica ao texto.
theological_decisions:
- issue: Referente e alcance da instrução sacerdotal
  choice: A segunda pessoa do singular dirige-se a Arão de modo representativo, enquanto a oração seguinte estende a permissão a todo homem qualificado no âmbito sacerdotal.
  alternative: Entender a forma singular como instrução limitada pessoalmente a Arão.
  rationale: O contexto imediato trata das porções sacerdotais dadas a Arão e a seus filhos; a mudança para 'todo homem' esclarece o alcance sem apagar a forma singular do hebraico.
- issue: Sentido de בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: Entender a expressão como referência ao lugar ou âmbito santíssimo designado para o consumo sacerdotal.
  alternative: Entendê-la como referência exclusiva ao recinto interior do santuário, o Santo dos Santos, ou como classificação não locativa da oferta.
  rationale: A preposição בְּ favorece o sentido locativo, mas o contexto de consumo sacerdotal torna improvável uma referência exclusiva ao recinto interior. A tradução conserva a localização sem identificar além do que o texto permite.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega-se 'você' para a segunda pessoa singular dirigida a Arão. 'Isso/disso' evita impor ao referente hebraico um gênero gramatical dependente do contexto anterior, e 'todo homem' mantém explícita a restrição masculina.
