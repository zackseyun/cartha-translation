  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: pt
  text: 'De todas as dádivas de vocês, apresentem toda a contribuição para Yahweh: a porção consagrada, tirada delas, de tudo o que houver de melhor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de toda a sua gordura”; no contexto, “gordura” designa a parte melhor ou mais seleta.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: De todas as dádivas que vocês receberem
  rationale: A expressão indica a totalidade das dádivas destinadas aos levitas. O acréscimo contextual de “que vocês receberem” torna natural em português a referência aos bens recebidos, sem alterar sua procedência.
- source_word: תָּרִימוּ
  choice: apresentem
  rationale: O hifil de רוּם pertence à linguagem técnica das contribuições separadas ou elevadas. “Apresentem” comunica naturalmente o ato cultual em português; o sentido de separação também é explicitado na oração seguinte.
- source_word: אֵת כָּל תְּרוּמַת יְהוָה
  choice: toda contribuição devida a Yahweh
  rationale: תְּרוּמָה designa uma contribuição separada para fins sagrados. “Devida a Yahweh” expressa o destinatário e a obrigação no contexto, evitando a possível leitura de que a oferta pertença originalmente a Yahweh como agente doador.
- source_word: מִכָּל חֶלְבּוֹ
  choice: de tudo o que houver de melhor nelas
  rationale: חֵלֶב significa literalmente “gordura”, mas aqui designa idiomaticamente a parte melhor ou mais seleta das dádivas. O plural “nelas” retoma naturalmente “dádivas” em português.
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: separem a parte consagrada
  rationale: מִקְדָּשׁוֹ pode indicar sua parte santa ou consagrada; מִמֶּנּוּ assinala que ela é retirada do conjunto. A tradução reúne esses elementos numa construção portuguesa clara, sem repetir de modo artificial “dela”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o translitera, em vez de substituí-lo por um título.
- issue: Sentido de מִקְדְּשׁוֹ
  choice: a parte consagrada
  alternative: a sua parte santa; o seu santuário
  rationale: O contexto trata da porção retirada das dádivas, favorecendo o sentido de parte consagrada. A formulação evita entender o termo como referência ao edifício do santuário.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural. A redação prioriza naturalidade sem perder o vocabulário cultual nem resolver além do necessário a relação entre a melhor parte e a parte consagrada.
