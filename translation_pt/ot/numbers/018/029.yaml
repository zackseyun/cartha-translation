review_pass:
  verdict: revise
  source_fidelity: A redação acrescenta “que vocês receberem”, elemento ausente do hebraico. Também reestrutura a segunda metade como um novo imperativo (“separem”), embora ela especifique a contribuição que deve ser apresentada. A revisão preserva a relação entre as dádivas, sua melhor parte e a porção consagrada.
  naturalness: A formulação revista permanece natural em português atual e evita a repetição mecânica dos pronomes possessivos hebraicos, sem eliminar a informação de que a porção é retirada das dádivas.
  terminology: “Contribuição para Yahweh” transmite adequadamente תְּרוּמַת יְהוָה; “porção consagrada” expressa מִקְדְּשׁוֹ no contexto cultual. “O que houver de melhor” traduz o uso idiomático de חֵלֶב, com nota para o sentido literal alternativo.
  issues:
  - severity: medium
    issue: Acréscimo de “que vocês receberem”
    rationale: O hebraico diz apenas “de todas as dádivas de vocês”. Embora o contexto trate de bens recebidos pelos levitas, essa qualificação não é expressa neste versículo e não deve ser introduzida no texto principal.
  - severity: medium
    issue: A segunda oração transforma uma especificação em novo imperativo
    rationale: Após “apresentem”, o hebraico descreve a contribuição como a porção consagrada retirada da melhor parte. “Separem” torna essa descrição uma ordem independente e deixa menos explícita sua função de identificar a oferta.
  revised_text: 'De todas as dádivas de vocês, apresentem toda a contribuição para Yahweh: a porção consagrada, tirada delas, de tudo o que houver de melhor.[a]'
  revised_footnotes:
