    text: Ou “de toda a sua gordura”; no contexto, “gordura” designa a parte melhor ou mais seleta.
    reason: lexical_alternative
  revision_rationale: 'A revisão remove a informação contextual não expressa no hebraico e faz da porção consagrada uma aposição explicativa da contribuição para Yahweh. Assim, conserva a sequência e a relação sintática do original: a contribuição é retirada da melhor parte das dádivas. A nota está ancorada em “melhor”, termo ao qual a alternativa literal se refere.'
