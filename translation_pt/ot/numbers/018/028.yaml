source:
  edition: WLC
  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: pt
  text: Assim, vocês também separarão, de todos os dízimos que receberem dos filhos de Israel[a], uma contribuição destinada a Yahweh; e dela darão ao sacerdote Arão a contribuição destinada a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos israelitas”. A expressão hebraica é literalmente “dos filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Introduz a instrução como correspondente ao mandamento anterior, preservando de modo natural a força de 'desse modo'.
- source_word: תָּרִימוּ
  choice: separarão
  rationale: No contexto de תְּרוּמָה, o hifil de רום indica retirar ou reservar uma porção como contribuição sagrada; 'separarão' comunica isso sem impor a imagem literal de erguer.
- source_word: גַם אַתֶּם
  choice: vocês também
  rationale: Mantém a ênfase de que os levitas, assim como os israelitas, devem reservar uma contribuição.
- source_word: תְּרוּמַת יְהוָה
  choice: uma contribuição para Yahweh / a contribuição de Yahweh
  rationale: תְּרוּמָה designa uma porção separada e entregue; a primeira ocorrência enfatiza a dedicação a Yahweh, enquanto a segunda conserva naturalmente a expressão identificadora recorrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: de todos os dízimos
  rationale: '''Dízimos'' é o equivalente corrente de מַעְשְׂרוֹת, e ''de todos'' preserva o sentido partitivo da preposição.'
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: que receberem dos filhos de Israel
  rationale: Embora לקח possa significar 'tomar', 'receber' expressa melhor a obtenção legítima dos dízimos neste contexto administrativo e cultual; 'filhos de Israel' preserva a forma hebraica.
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: e, deles, darão
  rationale: O pronome hebraico é formalmente singular, mas retoma o conjunto da contribuição ou dos dízimos; o plural português torna claro que a porção é retirada dos dízimos recebidos.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ao sacerdote Arão
  rationale: A preposição indica o destinatário, e esta ordem é idiomática e digna em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz explicitamente o Tetragrama; 'Yahweh' preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido relacional de תְּרוּמַת יְהוָה
  choice: contribuição para Yahweh / contribuição de Yahweh
  alternative: oferta do Senhor
  rationale: A construção pode caracterizar a porção como pertencente ou dedicada a Yahweh. A tradução evita restringi-la a um sacrifício e conserva ambas as nuances por formulações naturais no contexto.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A opção mantém a expressão pactual e a forma masculina representativa do hebraico; a nota oferece o equivalente coletivo corrente.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por 'vocês' para o plural. A sintaxe foi levemente reorganizada para fluência brasileira e compreensão internacional, sem eliminar o caráter ritual da contribuição nem a referência formal aos filhos de Israel.
