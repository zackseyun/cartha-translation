revisions:
- from: Estes são os estatutos que Yahweh ordenou a Moisés a respeito de um homem e sua mulher, e de um pai e sua filha[a], enquanto ela ainda é jovem e vive na casa de seu pai.[b]
  to: Estes são os estatutos que Yahweh ordenou a Moisés entre um homem e sua mulher e entre um pai e sua filha, em sua juventude, na casa de seu pai.
  rationale: A revisão restitui a estrutura concisa das duas relações introduzidas por בֵּין e traduz בִּנְעֻרֶיהָ בֵּית אָבִיהָ sem acrescentar um verbo de residência ou uma explicação jurídica não expressa. Como a redação principal já transmite diretamente esses elementos, as notas e seus marcadores deixam de ser necessárias.
