base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: pt
  text: Estes são os estatutos que Yahweh ordenou a Moisés entre um homem e sua mulher e entre um pai e sua filha, em sua juventude, na casa de seu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: Estes são os estatutos
  rationale: A frase nominal hebraica introduz um resumo das normas anteriores. “Estatutos” preserva o registro jurídico de חֻקִּים.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: que Yahweh ordenou a Moisés
  rationale: Reproduz naturalmente a oração relativa e expressa em português o destinatário da ordem, embora מֹשֶׁה seja marcado como objeto direto no hebraico.
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: a respeito de um homem e sua mulher
  rationale: בֵּין significa literalmente “entre”, mas aqui delimita o âmbito relacional regulado pelos estatutos. “A respeito de” evita sugerir uma posição espacial ou uma disputa específica.
- source_word: בֵּין אָב לְבִתּוֹ
  choice: e de um pai e sua filha
  rationale: Mantém o paralelismo com a relação anterior em português corrente, sem apagar os termos familiares específicos do hebraico.
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: enquanto ela ainda é jovem e vive na casa de seu pai
  rationale: Explicita de modo natural a circunstância temporal e doméstica expressa de forma compacta no hebraico. “Vive” comunica o sentido contextual de residência sem transformar a casa apenas em edifício.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz o nome próprio divino. “Yahweh” o representa por transliteração, em vez de substituí-lo por um título; “Javé” é uma forma portuguesa tradicional possível.
- issue: Termos relacionais marcados por gênero no contexto jurídico
  choice: um homem e sua mulher; um pai e sua filha
  alternative: um marido e sua esposa; um pai e sua filha
  rationale: A tradução conserva os pares relacionais específicos do hebraico. “Homem e sua mulher” mantém a amplitude lexical de אִישׁ e אִשָּׁה, enquanto o contexto deixa clara a relação conjugal.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário jurídico acessível. A formulação segue de perto o hebraico, mas usa “a respeito de” para dar naturalidade às duas construções com בֵּין. Os marcadores aparecem junto aos trechos que esclarecem.
