base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: pt
  text: E o voto de uma viúva ou de uma mulher divorciada — tudo aquilo com que ela se obrigou — permanecerá obrigatório para ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permanecerá válido para ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: voto
  rationale: Em contexto legal e religioso, נדר designa normalmente um voto feito a Deus; “voto” é o equivalente português preciso e tradicional.
- source_word: אַלְמָנָה
  choice: viúva
  rationale: Equivalente direto e natural para a mulher cujo marido morreu.
- source_word: גְרוּשָׁה
  choice: mulher divorciada
  rationale: O particípio passivo indica uma mulher que foi despedida ou divorciada; a expressão é clara e adequada ao tom legal.
- source_word: כֹּל אֲשֶׁר
  choice: tudo aquilo com que
  rationale: Preserva a abrangência da expressão e introduz naturalmente a ideia de uma obrigação que a mulher impôs a si mesma.
- source_word: אָסְרָה עַל נַפְשָׁהּ
  choice: ela se obrigou
  rationale: Expressa em português corrente a obrigação autoimposta; o hebraico emprega literalmente a imagem de prender ou vincular a própria pessoa.
- source_word: יָקוּם
  choice: permanecerá válido
  rationale: No contexto jurídico, קום significa permanecer em vigor ou conservar validade; a formulação comunica claramente essa força legal.
- source_word: עָלֶיהָ
  choice: para ela
  rationale: Indica que a obrigação permanece aplicável à mulher. A nota registra a alternativa mais explicitamente vinculante.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A abertura com “Mas” representa o וְ contextual, que introduz um caso contrastante em relação às disposições anteriores. A metáfora hebraica de a obrigação “ficar de pé sobre ela” foi vertida pelo sentido jurídico “permanecerá válido para ela”, enquanto a nota preserva a formulação explicitamente vinculante.
