  source_fidelity: 'O sentido jurídico central é preservado: a oposição paterna no dia em que toma conhecimento impede que os votos e as obrigações autoimpostas tenham vigência, e Yahweh lhe perdoa. Contudo, «se opuser a ela» pode sugerir oposição pessoal à filha, em vez do ato legal de proibir/restringir que o hebraico expressa neste contexto.'
  naturalness: O texto é claro e de registro adequado, mas a repetição de «se opôs a ela» soa pouco natural em português e deixa impreciso o alvo jurídico da ação. «A proibir» é mais idiomático e mais claro no contexto imediato de votos.
  terminology: «Votos», «compromissos vinculantes», «permanecerá em vigor» e «lhe perdoará» são escolhas adequadas. A manutenção de «Yahweh» é consistente dentro do rascunho e reproduz o nome divino presente no hebraico.
