  to: Mas, se o pai dela a proibir no dia em que ouvir falar disso, nenhum dos votos dela nem dos compromissos vinculantes[a] pelos quais ela se obrigou permanecerá em vigor[b]; e Yahweh lhe perdoará, porque o pai dela a proibiu.
  rationale: A revisão substitui a expressão potencialmente ambígua «se opuser a ela» por «a proibir», que é natural em português e comunica com maior precisão a ação paterna prevista na norma sobre votos. O restante do texto e as notas são mantidos, pois preservam adequadamente o sentido e as ambiguidades do hebraico.
