id: NUM.30.6
reference: Numbers 30:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: pt
  text: Mas, se o pai dela a proibir no dia em que ouvir falar disso, nenhum dos votos dela nem dos compromissos vinculantes[a] pelos quais ela se obrigou permanecerá em vigor[b]; e Yahweh lhe perdoará, porque o pai dela a proibiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “obrigações”, “vínculos” ou “promessas vinculantes”. O termo hebraico designa compromissos que obrigam a pessoa, especialmente no contexto de votos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não ficará de pé” ou “não se manterá”; isto é, não terá validade obrigatória.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso anterior; a formulação é natural em português e preserva essa relação contextual.
- source_word: הֵנִיא אָבִיהָ אֹתָהּ
  choice: o pai dela se opuser a ela
  rationale: O verbo indica que o pai impede ou invalida o compromisso da filha. A construção preserva o pronome feminino como objeto, sem antecipar de modo excessivo o efeito jurídico explicitado na oração seguinte.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: no dia em que ouvir falar disso
  rationale: Mantém tanto o ato de ouvir quanto a especificidade temporal relevante para a validade jurídica da oposição paterna.
- source_word: כָּל נְדָרֶיהָ וֶאֱסָרֶיהָ
  choice: nenhum dos votos dela nem dos compromissos vinculantes
  rationale: A negação da oração rege os dois grupos. 'Compromissos vinculantes' comunica a ideia de obrigações autoimpostas no contexto de votos.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: pelos quais ela se obrigou
  rationale: Expressa de maneira clara e atual a ideia hebraica de impor sobre si mesma uma obrigação.
- source_word: לֹא יָקוּם
  choice: não permanecerá em vigor
  rationale: Transmite o sentido jurídico de que os votos não subsistirão como obrigatórios, preservando a imagem de algo que não se mantém.
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em conformidade com a camada de consulta fornecida.
- source_word: יִסְלַח לָהּ
  choice: lhe perdoará
  rationale: Tradução direta e natural do verbo סלח com objeto pessoal.
- source_word: כִּי
  choice: porque
  rationale: Introduz claramente a razão apresentada pelo texto para o perdão.
theological_decisions:
- issue: Sentido do perdão divino no contexto de votos invalidados
  choice: Manter simplesmente a afirmação de que Yahweh perdoará a mulher porque o pai se opôs a ela.
  alternative: Explicar o perdão como absolvição específica pelo pecado de deixar de cumprir o voto.
  rationale: O texto associa o perdão à intervenção paterna, mas não define com precisão a natureza ou a extensão da culpa. A tradução conserva essa tensão jurídico-teológica sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita linguagem jurídica excessivamente técnica, mas conserva a precisão legal do contexto. Os marcadores [a] e [b] foram posicionados junto às expressões que suas notas explicam.
