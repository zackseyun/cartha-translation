base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: pt
  text: E, se o marido dela ouvir e não lhe disser nada, e não anular o voto dela,[a] todos os votos dela permanecerão válidos, e toda obrigação que ela impôs a si mesma permanecerá válida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “e não a anular”. Pelo contexto, o sentido é não invalidar o voto ou a obrigação dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: E, se ... ouvir
  rationale: No estilo jurídico casuístico do contexto, a construção introduz uma condição; o presente do subjuntivo expressa isso naturalmente em português.
- source_word: אִישָׁהּ
  choice: o marido dela
  rationale: Neste contexto de legislação matrimonial, אִישׁ com sufixo feminino refere-se ao marido.
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: ficar calado diante dela
  rationale: A expressão indica que o marido não se manifesta em resposta. A formulação preserva a imagem hebraica e soa natural em português.
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: sem anular o voto dela
  rationale: O verbo indica impedir, invalidar ou anular, e neste capítulo o objeto implícito em português é o voto ou a obrigação. A formulação explicita o sentido jurídico sem sugerir que a própria mulher seja anulada.
- source_word: וְקָמוּ כָּל נְדָרֶיהָ
  choice: todos os votos dela permanecerão válidos
  rationale: קום, em contexto jurídico, comunica que algo continua em vigor. 'Permanecerão válidos' transmite esse sentido com clareza moderna.
- source_word: וְכָל אִסָּר
  choice: e toda obrigação
  rationale: אִסָּר designa uma obrigação ou restrição vinculante assumida pela pessoa. 'Obrigação' é claro em português, enquanto o restante da oração expressa seu caráter autoimposto.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: que ela impôs a si mesma
  rationale: A expressão hebraica fala literalmente de ligar algo sobre si. Em português, 'impôs a si mesma' comunica com naturalidade a obrigação autoassumida.
- source_word: יָקוּם
  choice: permanecerá válida
  rationale: Repete o resultado jurídico da primeira oração e mantém o paralelismo, com concordância singular com 'toda obrigação'.
