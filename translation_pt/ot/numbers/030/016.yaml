- from: Mas, se ele de fato os anular depois de ter ouvido falar deles[a], levará sobre si a culpa dela.[b]
  to: Mas, se ele de fato os anular depois de ouvi-los[a], levará sobre si a culpa dela.[b]
  rationale: A revisão substitui “ouvido falar deles” por “ouvi-los”, preservando o objeto direto e evitando uma nuance de conhecimento indireto não expressa pelo texto hebraico. A nota a registra a alternativa contextual sem alterar o sentido básico. O restante da tradução conserva a ênfase verbal e a ambiguidade jurídico-moral da expressão final.
  reviewer_model: gpt-5.6-terra
