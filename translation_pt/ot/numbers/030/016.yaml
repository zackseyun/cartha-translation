source:
  edition: WLC
  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: pt
  text: Mas, se ele de fato os anular depois de ouvi-los[a], levará sobre si a culpa dela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de tomar conhecimento deles”. O hebraico diz literalmente “depois de os ouvir”; no contexto, “os” se refere aos votos ou compromissos dela.
    reason: alternative_reading
  - marker: b
    text: “Levará sobre si a culpa dela” também pode ser entendido como “assumirá a responsabilidade pela iniquidade dela” ou “sofrerá a punição pela culpa dela”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso apresentado no versículo anterior; “mas, se” expressa naturalmente essa relação.
- source_word: הָפֵר יָפֵר
  choice: de fato os anular
  rationale: A combinação do infinitivo absoluto com o verbo finito dá ênfase à ação. “De fato” preserva a intensificação, e “anular” corresponde ao contexto jurídico dos votos.
- source_word: אֹתָם
  choice: os
  rationale: O pronome masculino plural retoma os votos ou compromissos mencionados no contexto.
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: depois de ter ouvido falar deles
  rationale: Expressa que a anulação ocorre depois de ele tomar conhecimento dos votos; a forma composta marca com clareza a anterioridade.
- source_word: וְנָשָׂא
  choice: levará sobre si
  rationale: Preserva o sentido idiomático de assumir ou carregar culpa e responsabilidade, em português natural e digno.
- source_word: עֲוֺנָהּ
  choice: a culpa dela
  rationale: Mantém a força jurídico-moral do termo sem decidir se se trata especificamente da culpabilidade, da responsabilidade ou da punição decorrente.
theological_decisions:
- issue: Sentido de levar a culpa/iniquidade no contexto jurídico
  choice: Ele levará sobre si a culpa dela.
  alternative: Ele será responsável pela iniquidade dela; ou sofrerá a punição correspondente à culpa dela.
  rationale: A expressão hebraica pode indicar carregar culpa, responsabilidade ou as consequências punitivas. A tradução preserva essa tensão sem definir o mecanismo penal.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica acessível. A construção enfática hebraica foi mantida por “de fato”, e a ambiguidade da expressão final foi preservada no texto e explicada em nota.
