    text: Ou “depois de tomar conhecimento deles”. O hebraico diz literalmente “depois de os ouvir”; no contexto, “os” se refere aos votos ou compromissos dela.
    reason: alternative_reading
  - marker: b
    text: “Levará sobre si a culpa dela” também pode ser entendido como “assumirá a responsabilidade pela iniquidade dela” ou “sofrerá a punição pela culpa dela”.
    reason: alternative_reading
  revision_rationale: A revisão substitui “ouvido falar deles” por “ouvi-los”, preservando o objeto direto e evitando uma nuance de conhecimento indireto não expressa pelo texto hebraico. A nota a registra a alternativa contextual sem alterar o sentido básico. O restante da tradução conserva a ênfase verbal e a ambiguidade jurídico-moral da expressão final.
