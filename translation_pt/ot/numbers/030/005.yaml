base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: pt
  text: Mas, se o pai ouvir o voto dela e o compromisso vinculante pelo qual ela se obrigou, e não lhe disser nada[a], todos os votos dela permanecerão válidos[b], e todo compromisso vinculante pelo qual ela se obrigou permanecerá válido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «e o pai dela ficar calado para com ela». Nesse contexto, o silêncio indica que ele não apresentou objeção.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «ficarão de pé», isto é, continuarão em vigor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: voto / votos
  rationale: Em contexto legal e cultual, נדר designa um voto, normalmente feito a Deus; “voto” é o equivalente português corrente e preserva sua distinção em relação a אִסָּר.
- source_word: אֱסָרָהּ / אִסָּר
  choice: compromisso
  rationale: אִסָּר indica uma obrigação ou restrição assumida pela própria pessoa. “Compromisso” comunica a força vinculante sem usar linguagem arcaica, enquanto a oração seguinte explicita que ela se obrigou.
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: ela se obrigou
  rationale: A expressão hebraica descreve literalmente impor um vínculo sobre si mesma; “se obrigou” conserva de modo natural em português o caráter reflexivo e autoimposto.
- source_word: וְהֶחֱרִישׁ לָהּ אָבִיהָ
  choice: não lhe disser nada
  rationale: O verbo significa ficar calado. Esta formulação idiomática preserva o silêncio do pai sem explicar no corpo do texto todas as suas consequências jurídicas.
- source_word: וְקָמוּ ... יָקוּם
  choice: permanecerão válidos / permanecerá válido
  rationale: Neste contexto jurídico, קום significa continuar em vigor. A formulação explicita naturalmente em português a validade legal expressa pela imagem hebraica de “ficar de pé”.
- source_word: כָּל
  choice: todos / todo
  rationale: “Todos” concorda naturalmente com o plural “votos”, e “todo” com o singular “compromisso”, preservando a abrangência de כָּל.
- source_word: וְ
  choice: Mas, se
  rationale: A conjunção introduz, no contexto, a alternativa ao caso anterior e uma condição jurídica. “Mas, se” torna clara essa relação discursiva em português.
