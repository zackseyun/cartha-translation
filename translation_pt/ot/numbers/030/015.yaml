revisions:
- from: Mas, se o marido dela permanecer em silêncio de um dia para o outro, confirmará todos os votos dela e todos os compromissos que pesam sobre ela; ele os terá confirmado, pois permaneceu em silêncio no dia em que os ouviu.
  to: Mas, se o marido dela de fato permanecer em silêncio dia após dia, confirmará todos os votos dela ou todos os compromissos[a] que a vinculam; ele os confirmou, pois permaneceu em silêncio no dia em que os ouviu.
