base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: pt
  text: Mas, se o marido dela de fato permanecer em silêncio dia após dia, confirmará todos os votos dela ou todos os compromissos[a] que a vinculam; ele os confirmou, pois permaneceu em silêncio no dia em que os ouviu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todos os seus compromissos vinculantes». O termo hebraico se refere a compromissos que vinculam a pessoa que os assume.
    reason: Alternativa lexical para אֱסָרֶיהָ, preservando a nota do rastro de auditoria inglês.
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: permanecer em silêncio
  rationale: A construção com infinitivo absoluto intensifica a ideia verbal. Em português, o contexto e a continuidade expressa por “de um dia para o outro” comunicam a persistência do silêncio sem uma formulação artificial.
- source_word: אִישָׁהּ
  choice: o marido dela
  rationale: No contexto jurídico matrimonial, esta é a forma natural e exata de expressar אִישׁ com o sufixo feminino singular.
- source_word: מִיּוֹם אֶל יוֹם
  choice: de um dia para o outro
  rationale: Preserva o sentido de silêncio continuado além do dia em que o marido tomou conhecimento, com linguagem portuguesa natural.
- source_word: וְהֵקִים
  choice: confirmará
  rationale: 'O hifil de קום tem aqui força jurídica: fazer com que os votos permaneçam válidos. O futuro expressa naturalmente a consequência jurídica da condição introduzida por “se”.'
- source_word: נְדָרֶיהָ
  choice: os votos dela
  rationale: “Votos” é o equivalente consagrado e preciso de נדר neste contexto jurídico e religioso.
- source_word: אֱסָרֶיהָ
  choice: os compromissos
  rationale: O substantivo derivado de אסר designa compromissos autoimpostos que vinculam a pessoa. “Compromissos” mantém o sentido sem sugerir meras restrições externas.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: que pesam sobre ela
  rationale: Conserva a metáfora hebraica de algo posto sobre a pessoa e transmite sua força obrigatória em português claro.
- source_word: הֵקִים אֹתָם
  choice: ele os terá confirmado
  rationale: A formulação resume o efeito jurídico resultante do silêncio anterior e mantém a repetição enfática do verbo.
- source_word: כִּי
  choice: pois
  rationale: Introduz com naturalidade a causa ou fundamento da confirmação jurídica.
- source_word: הֶחֱרִשׁ לָהּ
  choice: permaneceu em silêncio
  rationale: Mantém o motivo jurídico do silêncio como ausência de objeção; o pronome indireto hebraico fica implícito em português para evitar uma construção pouco natural.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: no dia em que os ouviu
  rationale: Segue de perto a fórmula temporal hebraica. O objeto plural é explicitado pelo contexto — votos e compromissos — para produzir português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia jurídica clara. A repetição de “confirmar” e “permanecer em silêncio” foi mantida por sua função no raciocínio legal. Evitou-se a forma pouco idiomática “ficar em silêncio para com ela”.
