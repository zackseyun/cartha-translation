base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: pt
  text: Mas, se ela se casar[a], e seus votos estiverem sobre ela, ou houver uma declaração precipitada de seus lábios, pela qual se obrigou[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “vier a ser de um homem”; isto é, casar-se ou tornar-se esposa de um homem.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma declaração de seus lábios pela qual se vinculou”. A expressão pode indicar uma obrigação assumida impulsivamente, distinta de um voto formal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz um novo caso condicional em continuidade e leve contraste com a legislação anterior.
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: ela se casar
  rationale: Expressa em português natural o idioma hebraico היה לְאִישׁ, que indica passar a estar em relação matrimonial com um homem, sem recorrer à formulação possessiva potencialmente enganosa 'pertencer a um marido'.
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: enquanto seus votos estiverem sobre ela
  rationale: Conserva a imagem hebraica das obrigações que repousam sobre a mulher e não antecipa a decisão legal dos versículos seguintes.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: uma declaração precipitada de seus lábios
  rationale: Distingue a expressão verbal impulsiva de um voto formal, preservando ao mesmo tempo a referência explícita aos lábios.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: pela qual se obrigou
  rationale: Transmite o sentido jurídico de impor a si mesma uma obrigação; נֶפֶשׁ tem aqui valor reflexivo e não exige a tradução 'alma'.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto jurídico dos votos
  choice: se obrigou
  alternative: obrigou sua alma / sua vida
  rationale: O contexto trata de uma obrigação assumida pela própria pessoa, não de uma afirmação antropológica sobre a alma.
- issue: Estado matrimonial em היה לְאִישׁ
  choice: se casar
  alternative: pertencer a um marido / tornar-se esposa de um homem
  rationale: A formulação traduz a relação matrimonial indicada pelo idioma hebraico sem introduzir uma tese teológica sobre posse, mantendo em nota a alternativa mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém a frase condicional inacabada do versículo, que prossegue no contexto seguinte, e preserva a imagem de obrigações estarem 'sobre' a mulher.
