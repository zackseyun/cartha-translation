source:
  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: pt
  text: Mas, se o marido de fato os anular no dia em que souber deles, nada do que saiu dos lábios dela[a] — quer sejam os seus votos, quer seja a obrigação que impôs a si mesma[b] — terá validade. O marido os anulou, e Yahweh[c] a perdoará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tudo o que saiu dos lábios dela”, expressão jurídica que abrange todos os compromissos proferidos.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o compromisso pelo qual se obrigou”.'
    reason: lexical_alternative
  - marker: c
    text: Hebraico YHWH; tradicionalmente traduzido por “o SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso anterior, preservando tanto a conexão quanto a força adversativa do contexto.
- source_word: הָפֵר יָפֵר
  choice: de fato os anular
  rationale: A construção hebraica com infinitivo absoluto intensifica o verbo; “de fato” comunica a ênfase sem repetição artificial em português.
- source_word: אִישָׁהּ
  choice: o marido
  rationale: No contexto jurídico matrimonial, esta é a equivalência natural e precisa.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: no dia em que souber deles
  rationale: Preserva o prazo juridicamente relevante indicado pelo hebraico, usando uma formulação corrente em português para tomar conhecimento dos votos.
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: nada do que saiu dos lábios dela
  rationale: A expressão é literalmente “tudo o que sai dos lábios dela”; com a negação de validade que vem depois, “nada do que saiu” comunica naturalmente a abrangência de todos os compromissos proferidos.
- source_word: לִנְדָרֶיהָ
  choice: os seus votos
  rationale: “Votos” é o termo estabelecido e claro para compromissos solenes de caráter religioso ou jurídico.
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: a obrigação que impôs a si mesma
  rationale: Expressa o caráter vinculante e reflexivo da locução hebraica sem recorrer a uma formulação técnica obscura.
- source_word: לֹא יָקוּם
  choice: terá validade
  rationale: O verbo funciona aqui como expressão jurídica para algo permanecer de pé, válido ou em vigor.
- source_word: הֲפֵרָם
  choice: os anulou
  rationale: Resume a ação decisiva do marido e seu efeito jurídico sobre os compromissos mencionados.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, distinguindo-o de um título; a nota registra a alternativa tradicional.
- source_word: יִסְלַח לָהּ
  choice: a perdoará
  rationale: Reproduz diretamente a declaração de perdão, sem especificar além do texto a natureza exata da culpa envolvida.
theological_decisions:
- issue: Sentido do perdão divino após a anulação dos votos
  choice: 'Manter a sequência textual: os compromissos são anulados, perdem a validade, e Yahweh perdoa a mulher.'
  alternative: Explicar que o perdão diz respeito especificamente ao não cumprimento do voto ou, de modo mais geral, à imprudência ao fazê-lo.
  rationale: O versículo associa juridicamente a anulação e o perdão, mas não define de maneira explícita se a culpa decorre do possível descumprimento, da formulação precipitada do voto ou de outro aspecto. A tradução preserva essa tensão sem acrescentar uma conclusão doutrinária.
- issue: Representação do nome divino יהוה
  choice: Yahweh no texto, com nota explicativa
  alternative: o SENHOR
  rationale: A forma transliterada representa o nome próprio presente no hebraico; a nota informa ao leitor a convenção tradicional sem ocultar a forma da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom jurídico do versículo sem literalismos pouco naturais; “terá validade” torna explícito o valor legal idiomático de “ficará de pé”.
