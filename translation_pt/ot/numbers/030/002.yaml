  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: pt
  text: 'Então Moisés falou aos chefes das tribos dos filhos de Israel[a], dizendo: “Esta é a palavra que Yahweh ordenou[b]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “dos israelitas”. O hebraico diz literalmente “dos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Isto é o que Yahweh ordenou”. O hebraico diz literalmente: “Esta é a palavra que Yahweh ordenou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar; “Então ... falou” expressa com naturalidade a sequência do discurso.
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: os chefes das tribos
  rationale: “Chefes” preserva a metáfora social de רָאשֵׁי, e “tribos” é o sentido contextual de מַטּוֹת nas divisões de Israel.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém a expressão familiar e pactual do hebraico, em vez de substituí-la silenciosamente pelo equivalente idiomático “israelitas”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz de modo formal e claro o infinitivo hebraico que introduz o discurso direto.
- source_word: זֶה הַדָּבָר
  choice: Esta é a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “coisa”; “palavra” preserva aqui a forma da declaração autoritativa, sem eliminar a alternativa mais idiomática.
- source_word: צִוָּה
  choice: ordenou
  rationale: O perfeito apresenta a ordem divina como ato concluído que Moisés agora transmite; o pretérito perfeito é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; “Yahweh” preserva essa distinção sem substituí-lo pelo título “Senhor”.
- issue: Expressão pactual בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução principal conserva a formulação familiar e masculina do hebraico; a nota registra a forma coletiva mais idiomática sem apagar a expressão da fonte.
- issue: Amplitude semântica de זֶה הַדָּבָר
  choice: Esta é a palavra
  alternative: Isto é o que
  rationale: “Palavra” mantém a forma hebraica e o caráter de pronunciamento, enquanto a nota oferece a leitura idiomática possível sem resolver indevidamente a amplitude de דָּבָר.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e as expressões formais do hebraico foram preservadas quando naturais; notas registram alternativas mais idiomáticas. As aspas e os dois-pontos mantêm a função introdutória da fórmula de discurso.
