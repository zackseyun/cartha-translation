  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: pt
  text: Moisés falou aos filhos de Israel[a] conforme tudo o que Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”, expressão tradicional que designa o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: falou
  rationale: Embora o verbo possa ser traduzido formalmente por “disse”, não há aqui uma citação direta. “Falou” expressa com naturalidade o ato de transmitir as ordens divinas aos israelitas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a expressão hebraica convencional e sua forma masculina plural, usada como designação pactual e nacional do povo de Israel.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: “Conforme” preserva o valor de correspondência do prefixo כְּ, enquanto “tudo o que” representa o alcance integral da expressão.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da ordem de Yahweh em relação à fala de Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Em português, “ordenar algo a alguém” expressa naturalmente Moisés como destinatário da ordem. A repetição do nome, em vez de um pronome, acompanha a formulação hebraica.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título.
- issue: Designação pactual בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A tradução principal conserva a forma concreta e masculina plural do hebraico, reconhecendo que a expressão funciona como designação nacional do povo inteiro, sem restringi-la apenas aos homens.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. “Conforme” preserva a relação de correspondência do hebraico; a repetição de “Moisés” mantém a formulação enfática do original sem tornar a frase obscura.
