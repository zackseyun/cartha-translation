  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: pt
  text: E, se uma mulher fizer um voto[a] a Yahweh e, ainda jovem na casa de seu pai, assumir uma obrigação que a vincule[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “votar um voto”, usando um verbo e um substantivo da mesma raiz para ressaltar o ato formal de fazer um voto.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “impor sobre si uma obrigação vinculante”. O hebraico emprega um verbo e um substantivo relacionados para expressar que a pessoa se coloca sob um compromisso obrigatório.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: E, se uma mulher
  rationale: A conjunção introduz um novo caso na sequência legal, e כִּי tem valor condicional nesse contexto. A formulação mantém a ligação com o versículo anterior e soa natural em português jurídico-narrativo.
- source_word: תִדֹּר נֶדֶר
  choice: fizer um voto
  rationale: A construção hebraica combina verbo e substantivo cognatos para destacar o ato formal de votar. Em português, a reprodução literal seria pouco natural; “fizer um voto” conserva com clareza o sentido jurídico e solene.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה como Yahweh, preservando seu caráter de nome próprio no texto-fonte.
- source_word: וְאָסְרָה אִסָּר
  choice: assumir uma obrigação que a vincule
  rationale: O verbo e o substantivo relacionados exprimem a imposição de um compromisso vinculante sobre si mesma. A escolha preserva tanto o caráter reflexivo quanto a força obrigatória, sem confundir אִסָּר com o voto נֶדֶר já mencionado.
- source_word: בְּבֵית אָבִיהָ
  choice: na casa de seu pai
  rationale: Mantém diretamente o âmbito doméstico indicado pelo hebraico, sem explicitar além do texto a estrutura de autoridade pressuposta na legislação.
- source_word: בִּנְעֻרֶיהָ
  choice: ainda jovem
  rationale: Expressa de modo atual e natural o período da juventude. Evita acrescentar explicitamente “solteira”, condição sugerida pelo contexto, mas não lexicalizada nesta expressão.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança como nome próprio, sem substituí-lo por um título.
- issue: Relação entre נֶדֶר e אִסָּר
  choice: Distinguir “voto” de “obrigação que a vincule”
  alternative: Traduzir ambos como “voto” ou “promessa”
  rationale: 'O versículo emprega termos relacionados, mas distintos: נֶדֶר designa o voto, enquanto אִסָּר destaca a obrigação vinculante assumida. A tradução conserva essa tensão jurídica sem fundir os conceitos.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico acessível. A ordem foi levemente ajustada para ligar “ainda jovem” de modo inequívoco à situação da mulher na casa paterna. A vírgula final preserva o fato de que a frase continua no versículo seguinte.
