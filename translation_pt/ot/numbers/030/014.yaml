  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: pt
  text: Todo voto e todo juramento vinculante de afligir a si mesma[a], seu marido poderá confirmar ou anular.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “afligir a alma”. Esta expressão hebraica também pode referir-se a negar algo a si mesma ou a humilhar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: voto
  rationale: Em contexto legal e cultual, נֵדֶר designa normalmente um voto assumido diante de Deus; “voto” é o equivalente português preciso e corrente.
- source_word: שְׁבֻעַת אִסָּר
  choice: juramento que imponha uma obrigação
  rationale: A expressão combina “juramento” com a ideia de vínculo ou obrigação restritiva. A formulação explicita ambos os elementos em português natural.
- source_word: לְעַנֹּת נָפֶשׁ
  choice: para afligir a si mesma
  rationale: A expressão hebraica descreve aflição ou privação de si, muitas vezes relacionada ao jejum. A tradução mantém a força de “afligir” sem empregar “alma” de modo potencialmente enganoso em português moderno.
- source_word: נָפֶשׁ
  choice: a si mesma
  rationale: Neste idiomatismo, נֶפֶשׁ refere-se à própria pessoa, não necessariamente a uma entidade imaterial distinta; o feminino decorre do contexto da mulher cujo voto está sob consideração.
- source_word: אִישָׁהּ
  choice: seu marido
  rationale: No contexto matrimonial desta legislação, אִישׁ com sufixo feminino singular significa claramente “marido dela”.
- source_word: יְקִימֶנּוּ
  choice: poderá confirmá-lo
  rationale: O Hifil de קום significa fazer o voto permanecer válido; “confirmar” comunica com clareza essa força jurídica.
- source_word: יְפֵרֶנּוּ
  choice: anulá-lo
  rationale: O Hifil de פרר, nesta legislação sobre votos, significa invalidar ou tornar sem efeito.
- source_word: כָּל ... וְכָל
  choice: Todo ... e todo ...
  rationale: A repetição preserva a abrangência distributiva das duas categorias mencionadas.
