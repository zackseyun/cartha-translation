revisions:
- from: Mas, se no dia em que o marido dela ouvir falar disso ele a impedir e anular o voto que está sobre ela ou a declaração impensada de seus lábios, pela qual ela se obrigou, então Yahweh a perdoará.[a]
  to: Mas, se, no dia em que o marido dela ouvir falar disso, ele a impedir e anular o voto que está sobre ela e a declaração de seus lábios[a], pela qual ela se obrigou, Yahweh a perdoará.
  rationale: A revisão segue a coordenação explícita do hebraico («e ... e ...»), evita fixar como certa uma nuance lexical disputada e reposiciona a âncora da nota junto ao termo explicado. Mantêm-se a estrutura jurídica, a metáfora de um voto «sobre ela», o nome divino e a consequência do perdão.
