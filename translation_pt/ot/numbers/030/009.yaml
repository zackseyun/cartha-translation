source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: pt
  text: Mas, se, no dia em que o marido dela ouvir falar disso, ele a impedir e anular o voto que está sobre ela e a declaração de seus lábios[a], pela qual ela se obrigou, Yahweh a perdoará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a declaração impensada de seus lábios» ou «a declaração vinculante de seus lábios».'
    reason: 'A nuance precisa de מִבְטָא neste contexto é debatida: pode designar uma declaração em sentido neutro ou, no contexto de compromissos assumidos, sugerir uma fala precipitada ou de caráter obrigatório.'
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o caso anterior, preservando tanto a conjunção quanto sua força adversativa contextual.
- source_word: בְּיוֹם שְׁמֹעַ אִישָׁהּ
  choice: no dia em que o marido dela ouvir falar disso
  rationale: Expressa naturalmente o valor temporal da construção hebraica e explicita o objeto implícito da audição sem acrescentar conteúdo substantivo.
- source_word: יָנִיא אֹתָהּ
  choice: ele a impedir
  rationale: No contexto jurídico dos votos, o hifil de נוא indica impedir ou não permitir que o compromisso tenha efeito; 'impedir' evita sugerir apenas uma proibição verbal.
- source_word: וְהֵפֵר
  choice: e anular
  rationale: Traduz a invalidação formal do voto em linguagem jurídica clara e atual.
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: o voto que está sobre ela
  rationale: Mantém a metáfora hebraica da obrigação que repousa sobre a pessoa, ainda compreensível em português.
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: a declaração impensada de seus lábios
  rationale: Preserva a referência explícita aos lábios e comunica a possível nuance de fala precipitada, sem fazer dela uma certeza lexical incontestável.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: pela qual ela se obrigou
  rationale: Reproduz de modo natural o sentido idiomático de impor a si mesma uma obrigação.
- source_word: וַיהוָה יִסְלַח לָהּ
  choice: então Yahweh a perdoará
  rationale: Mantém o nome divino e apresenta com clareza a consequência jurídica enunciada no texto.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' representa o nome próprio diretamente, em vez de substituí-lo por um título.
- issue: Nuance moral de מִבְטָא
  choice: declaração impensada
  alternative: declaração; declaração vinculante
  rationale: O contexto permite a nuance de uma fala precipitada, mas ela não é lexicalmente indiscutível; a alternativa mais neutra é preservada em nota.
- issue: Relação entre יָנִיא e וְהֵפֵר
  choice: impedir e anular
  alternative: proibir e invalidar
  rationale: A tradução conserva os dois verbos do hebraico, sem fundi-los nem definir além do texto o mecanismo preciso pelo qual o marido impede e invalida o compromisso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe jurídica do original foi preservada sem rigidez excessiva; manteve-se a metáfora 'o voto que está sobre ela'. O marcador [a] foi colocado após a frase a que a nota lexical se refere.
