    issue: «ou» em vez de «e» entre os dois objetos de «anular»
    rationale: O texto hebraico tem וְאֵת («e [o]») antes de מִבְטָא שְׂפָתֶיהָ, coordenando «o voto» e «a declaração de seus lábios» como objetos de וְהֵפֵר. A alternativa inglesa «or» não deve prevalecer contra a coordenação explícita do original.
  - severity: low
    issue: «declaração impensada» no texto principal
    rationale: Embora «fala precipitada» seja uma interpretação contextual possível de מִבְטָא, o termo em si pode ser mais neutro, «declaração/expressão». A tradução principal deve conservar essa margem, registrando a nuance em nota.
  - severity: low
    issue: Âncora da nota distante da expressão comentada
    rationale: O marcador deve seguir «declaração de seus lábios», expressão à qual a nota lexical se refere, e não encerrar toda a frase.
