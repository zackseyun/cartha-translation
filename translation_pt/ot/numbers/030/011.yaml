  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: pt
  text: E, se na casa de seu marido ela fez um voto ou se impôs uma obrigação por meio de juramento,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: E, se
  rationale: A conjunção seguida da partícula condicional dá continuidade à sequência de casos legais; «E, se» conserva essa ligação.
- source_word: בֵּית אִישָׁהּ
  choice: na casa de seu marido
  rationale: Reproduz naturalmente o sentido locativo e doméstico da construção hebraica sem ampliar seu significado.
- source_word: נָדָרָה
  choice: ela fez um voto
  rationale: O verbo indica fazer um voto; esta formulação é corrente, clara e adequada ao contexto jurídico.
- source_word: אוֹ
  choice: ou
  rationale: Mantém a disjunção simples entre as duas formas relacionadas de compromisso.
- source_word: אָסְרָה אִסָּר עַל נַפְשָׁהּ
  choice: se impôs uma obrigação
  rationale: A construção cognata de verbo e substantivo expressa a imposição, sobre si mesma, de um vínculo obrigatório. A formulação portuguesa preserva o caráter reflexivo e jurídico sem literalismo obscuro.
- source_word: בִּשְׁבֻעָה
  choice: por meio de juramento
  rationale: A preposição indica o meio pelo qual a obrigação foi assumida; «por meio de juramento» torna essa relação inequívoca e natural em português.
