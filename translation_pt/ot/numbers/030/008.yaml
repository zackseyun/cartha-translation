  naturalness: A construção “souber disso no dia em que o ouvir” é compreensível, mas a alternância entre “souber” e “ouvir” deixa o referente de “o” levemente ambíguo e soa menos fluida. “tomar conhecimento disso no dia em que o ouvir” mantém a repetição hebraica de ouvir/conhecer e melhora a leitura. “Não lhe disser nada” é uma formulação portuguesa natural para o silêncio dirigido a ela.
  terminology: “Votos” é adequado para נְדָרֶיהָ. “Compromissos vinculantes” comunica adequadamente אֱסָרֶיהָ e conserva distinção em relação a “votos”. “Continuarão válidos” reproduz com naturalidade o valor jurídico repetido de קוּם.
