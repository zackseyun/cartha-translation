base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: pt
  text: E, se o marido dela tomar conhecimento disso no dia em que o ouvir[a] e não lhe disser nada, os votos dela continuarão válidos, e os compromissos vinculantes que ela impôs a si mesma[b] continuarão válidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no dia em que tomar conhecimento disso”. O hebraico repete o verbo “ouvir”, aqui no sentido de tomar conhecimento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os vínculos dela”. O hebraico se refere a compromissos obrigatórios que ela assumiu sobre si mesma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: E, se ... souber
  rationale: O qatal com conjunção dá continuidade à formulação jurídica condicional. Em português, “se ... souber” expressa naturalmente essa relação; “disso” explicita apenas o objeto recuperável do contexto.
- source_word: אִישָׁהּ
  choice: o marido dela
  rationale: No contexto da legislação matrimonial, אִישׁ com sufixo feminino singular significa “marido”.
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: no dia em que o ouvir
  rationale: Preserva a referência ao dia juridicamente relevante em que o marido toma conhecimento, bem como a repetição da raiz שׁמע.
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: e ficar calado diante dela
  rationale: Mantém a imagem hebraica do silêncio dirigido a ela, que neste contexto implica não apresentar objeção.
- source_word: וְקָמוּ ... יָקֻמוּ
  choice: permanecerão válidos / permanecerão válidas
  rationale: קוּם, neste contexto jurídico, indica que os compromissos continuam em vigor. A repetição da formulação preserva a ênfase do hebraico, com concordância nominal natural em português.
- source_word: נְדָרֶיהָ
  choice: os votos dela
  rationale: “Votos” é o equivalente português corrente para compromissos solenes expressos por נדר.
- source_word: וֶאֱסָרֶהָ
  choice: as obrigações
  rationale: O substantivo derivado de אסר designa vínculos ou compromissos obrigatórios; “obrigações” comunica claramente sua força jurídica.
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: que ela impôs a si mesma
  rationale: Expressa em português natural o ato de assumir um vínculo sobre si, sem interpretar נֶפֶשׁ como referência específica à alma.
