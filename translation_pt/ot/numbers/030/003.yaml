source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: pt
  text: Se um homem fizer um voto a Yahweh ou jurar, impondo a si mesmo uma obrigação[a], não deverá violar sua palavra[b]; deverá cumprir tudo o que saiu de sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “para vincular sobre si mesmo uma obrigação vinculante”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não deverá profanar sua palavra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo masculino singular do texto hebraico neste contexto jurídico.
- source_word: כִּי
  choice: se
  rationale: Introduz uma condição típica de formulação legal casuística.
- source_word: יִדֹּר נֶדֶר
  choice: fizer um voto
  rationale: Expressa naturalmente em português a construção hebraica de verbo e substantivo cognatos.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando o nome da aliança presente no texto.
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: jurar
  rationale: O verbo português já comunica o ato solene de prestar juramento; evita a expressão menos natural 'jurar um juramento'.
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: impondo a si mesmo uma obrigação
  rationale: Comunica a ideia jurídica de vincular a própria pessoa por uma obrigação, sem reproduzir de modo artificial a repetição cognata hebraica.
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: não deverá violar sua palavra
  rationale: O Hifil de חלל tem o sentido subjacente de profanar; neste contexto, significa não transgredir nem tornar sem efeito a palavra empenhada.
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: deverá cumprir tudo o que saiu de sua boca
  rationale: Preserva a imagem concreta da fala que sai da boca e verte יַעֲשֶׂה idiomaticamente como cumprimento da obrigação assumida.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido sacral de לֹא יַחֵל דְּבָרוֹ
  choice: não deverá violar sua palavra
  alternative: não deverá profanar sua palavra
  rationale: A tradução principal comunica o efeito jurídico em português corrente, enquanto a nota conserva o campo semântico religioso de חלל e evita apagar essa nuance.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o caráter jurídico do versículo, conserva a imagem hebraica de algo que sai da boca e usa notas para registrar as construções mais literais.
