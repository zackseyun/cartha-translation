  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: pt
  text: Então o sacerdote fará a mulher ficar em pé diante de Yahweh, soltará o cabelo dela[a] e colocará nas mãos dela a oferta de cereal para lembrança — é uma oferta de cereal de ciúmes —, enquanto na mão do sacerdote estarão as águas amargas que trazem maldição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descobrirá a cabeça da mulher” ou “deixará solto o cabelo da mulher”. A expressão hebraica diz literalmente algo como “soltar” ou “desatar” a cabeça da mulher e provavelmente se refere a desamarrar o cabelo como parte do ritual.
    reason: lexical_alternative
  - marker: b
    text: Ou “as águas amargas que trazem a maldição”. O particípio hebraico pode descrever águas que efetivam ou carregam uma maldição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: fará a mulher ficar de pé
  rationale: O hifil de עמד indica fazer alguém ficar de pé ou apresentá-lo formalmente. A formulação mantém a ação ritual concreta e soa natural em português.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressão cultual que indica comparecer na presença divina; o nome próprio יְהוָה é transliterado como Yahweh.
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: soltará o cabelo dela
  rationale: O idioma hebraico menciona literalmente a cabeça, mas provavelmente descreve o ato ritual de desatar ou deixar solto o cabelo. A nota preserva as alternativas possíveis.
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: colocará nas mãos dela
  rationale: Embora o hebraico diga literalmente 'sobre as palmas dela', esta é a expressão idiomática clara para o gesto ritual em português.
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: a oferta de cereal para lembrança
  rationale: מִנְחָה, neste contexto sacerdotal, é uma oferta de cereal, e זִכָּרוֹן expressa lembrança ou memorial. 'Para lembrança' mantém aberta a função exata da oferta.
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: é uma oferta de cereal por ciúmes
  rationale: קְנָאֹת está no plural formal, mas tem sentido abstrato. 'Por ciúmes' comunica a relação da oferta com a suspeita motivada por ciúmes sem apagar a tensão do termo.
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: Na mão do sacerdote estarão
  rationale: Mantém o singular 'mão' do hebraico e apresenta com clareza a circunstância concomitante do rito.
- source_word: מֵי הַמָּרִים
  choice: as águas amargas
  rationale: Reproduz de modo natural a construção hebraica e conserva o plural 'águas'.
- source_word: הַמְאָרֲרִים
  choice: que trazem maldição
  rationale: O particípio de ארר caracteriza as águas como portadoras ou causadoras de maldição. A formulação conserva essa força sem decidir se a referência é a uma maldição específica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. 'Yahweh' preserva de maneira direta o nome da aliança sem substituí-lo por um título.
- issue: Sentido de קְנָאֹת no rito
  choice: por ciúmes
  alternative: de ciúmes; de zelo
  rationale: O contexto imediato trata do ciúme do marido, mas o termo pode abranger ciúme ou zelo. A escolha é natural neste contexto e não acrescenta um juízo sobre a culpa da mulher.
- issue: Efeito das águas amaldiçoadoras
  choice: que trazem maldição
  alternative: que trazem a maldição
  rationale: O hebraico permite entendê-las como águas que efetivam ou carregam uma maldição. O artigo indefinido evita identificar além do que o verso isoladamente explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a solenidade e a sequência do rito sem recorrer a vocabulário arcaico. Os marcadores [a] e [b] aparecem no texto principal.
