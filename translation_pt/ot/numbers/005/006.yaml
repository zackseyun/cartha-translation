  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: pt
  text: '“Fale aos filhos de Israel: Quando um homem ou uma mulher cometer qualquer dos pecados próprios do ser humano[a], agindo com infidelidade contra o SENHOR, essa pessoa se tornará culpada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qualquer dos pecados da humanidade”. O hebraico usa aqui “ser humano” em sentido genérico, referindo-se às pessoas em geral.'
    reason: Registra uma tradução alternativa para הָאָדָם e esclarece seu sentido inclusivo e genérico.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel introduz uma ordem divina direta; “Fale” é claro, digno e natural em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a formulação familiar e pactual do hebraico, sem reduzi-la simplesmente a um gentílico.
- source_word: אִישׁ אֽוֹ אִשָּׁה
  choice: um homem ou uma mulher
  rationale: Mantém explicitamente o par masculino e feminino e indica que a norma se aplica a ambos.
- source_word: כִּי יַעֲשׂוּ
  choice: Quando ... cometer
  rationale: Embora o verbo hebraico esteja no plural por concordância distributiva, o singular é mais natural em português depois de “um homem ou uma mulher”; “quando” convém ao estilo jurídico casuístico.
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: qualquer dos pecados próprios do ser humano
  rationale: Expressa הָאָדָם em sentido genérico, referente à humanidade, e conserva a ideia de pecados ou transgressões humanos sem sugerir exclusividade masculina.
- source_word: לִמְעֹל מַעַל
  choice: agindo com infidelidade
  rationale: A construção com infinitivo e substantivo cognato enfatiza uma quebra de fidelidade; a escolha comunica a dimensão relacional e pactual em português corrente.
- source_word: בַּיהוָה
  choice: contra o SENHOR
  rationale: A preposição, com מעל, indica que a infidelidade é dirigida contra YHWH; “SENHOR” segue a convenção reverente tradicional.
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: essa pessoa se tornará culpada
  rationale: נֶפֶשׁ designa aqui a pessoa, não uma alma imaterial em sentido técnico; o verbo descreve a entrada num estado de culpa ou responsabilidade.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Emprega a convenção tradicional de representar o tetragrama por “SENHOR”, sem confundi-lo com o substantivo comum “Senhor”.
- issue: Sentido genérico de הָאָדָם
  choice: ser humano
  alternative: humanidade
  rationale: O termo não designa especificamente um homem, mas seres humanos em geral. “Ser humano” preserva o singular coletivo da expressão e evita uma leitura exclusivamente masculina.
- issue: Natureza da culpa em וְאָשְׁמָה
  choice: se tornará culpada
  alternative: será culpada
  rationale: A formulação expressa o estado resultante de culpa sem definir além do texto se a ênfase recai sobre culpa moral, responsabilidade legal ou ambas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura jurídica foi mantida, mas a concordância foi ajustada ao uso idiomático do português. “Filhos de Israel” conserva a imagem familiar do original; “pessoa” evita interpretar נֶפֶשׁ como termo técnico antropológico.
