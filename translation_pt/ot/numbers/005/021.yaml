  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: pt
  text: 'Então o sacerdote fará a mulher jurar com o juramento da maldição[a] e dirá a ela: “Que Yahweh faça de você uma maldição e um juramento entre o seu povo[b], quando Yahweh fizer sua coxa definhar[c] e seu abdômen inchar[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “juramento de maldição” ou “juramento acompanhado de maldição”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ela se tornaria entre o povo um exemplo invocado ao proferir maldições e prestar juramentos.
    reason: idiomatic_clarification
  - marker: c
    text: “Fizer sua coxa definhar” traduz uma expressão hebraica difícil. “Coxa” pode ser um eufemismo relacionado aos órgãos reprodutivos, e o efeito descrito também pode ser entendido como murchamento, atrofia ou colapso dessa parte do corpo.
    reason: lexical_alternative
  - marker: d
    text: “Abdômen” também pode ser traduzido como “barriga” ou “ventre” e, segundo algumas interpretações, pode referir-se ao útero. O efeito médico ou reprodutivo exato da maldição é discutido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: fará ... jurar
  rationale: 'O hifil de שׁבע tem sentido causativo: o sacerdote leva a mulher a prestar juramento. A formulação é clara e preserva a força jurídico-ritual.'
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: com o juramento da maldição
  rationale: Mantém os dois elementos da construção hebraica, שְׁבֻעָה (“juramento”) e אָלָה (“maldição”), sem reduzir a fórmula a apenas um deles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: uma maldição e um juramento
  rationale: 'Reproduz formalmente o par hebraico e deixa em nota o sentido idiomático provável: a mulher se tornaria um exemplo citado em maldições e juramentos.'
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: entre o seu povo
  rationale: Expressão natural em português que conserva a dimensão pública e comunitária.
- source_word: בְּתֵת
  choice: quando ... fizer
  rationale: A construção com infinitivo indica a circunstância em que a mulher se tornaria uma fórmula de maldição; “quando” comunica esse valor naturalmente.
- source_word: יְרֵכֵךְ
  choice: sua coxa
  rationale: “Coxa” é o sentido corporal direto de יָרֵךְ. O termo pode ter valor eufemístico relacionado aos órgãos reprodutivos, possibilidade indicada em nota sem ser imposta ao texto.
- source_word: נֹפֶלֶת
  choice: definhar
  rationale: No contexto da maldição, o particípio de נפל parece descrever colapso, perda ou definhamento da parte do corpo. “Definhar” expressa o efeito sem propor um diagnóstico médico específico.
- source_word: בִּטְנֵךְ
  choice: seu abdômen
  rationale: בֶּטֶן pode designar barriga, abdômen ou ventre. “Abdômen” preserva a referência corporal sem restringi-la necessariamente ao útero.
- source_word: צָבָה
  choice: inchar
  rationale: Expressa de modo claro e conciso a ideia de inchaço ou distensão presente na forma hebraica.
theological_decisions:
- issue: Grau de especificidade da maldição corporal
  choice: Conservar as imagens de a coxa definhar e o abdômen inchar, sem identificá-las no texto principal com aborto, infertilidade ou outra condição médica específica.
  alternative: Traduzir explicitamente em termos de aborto espontâneo, queda do útero ou infertilidade.
  rationale: O hebraico é difícil e admite possível conotação reprodutiva, mas não nomeia inequivocamente um diagnóstico. A tradução preserva a ambiguidade e registra as interpretações possíveis em notas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe ritual clara. A repetição de “Yahweh” e os termos formais “juramento” e “maldição” foram mantidos para refletir a solenidade e a estrutura do hebraico; as ambiguidades anatômicas foram preservadas no texto e explicadas em notas.
