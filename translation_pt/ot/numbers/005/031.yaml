  text: וְ/נִקָּ֥ה הָ/אִ֖ישׁ מֵ/עָוֺ֑ן וְ/הָ/אִשָּׁ֣ה הַ/הִ֔וא תִּשָּׂ֖א אֶת עֲוֺנָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: pt
  text: Então o homem ficará livre de culpa[a], mas aquela mulher levará sobre si a sua culpa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o marido ficará livre de culpa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “levará sobre si a sua iniquidade”; a expressão hebraica também pode incluir sofrer as consequências da culpa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: ficará livre
  rationale: O nifal de נקה, construído com מִן, expressa estar livre ou isento de culpa ou responsabilidade; “ficará livre” é natural e preserva a dimensão jurídica sem impor a ideia mais técnica de absolvição formal.
- source_word: הָאִישׁ
  choice: o homem
  rationale: אִישׁ significa literalmente “homem”; no contexto, trata-se do marido, alternativa explicitada em nota.
- source_word: מֵעָוֺן
  choice: de culpa
  rationale: עָוֹן pode indicar transgressão, culpa ou suas consequências. Com נקה, “de culpa” comunica adequadamente a isenção de responsabilidade moral e jurídica.
- source_word: וְהָאִשָּׁה הַהִוא
  choice: mas aquela mulher
  rationale: Embora וְ seja normalmente “e”, aqui a relação entre as orações é contrastiva. “Aquela mulher” conserva a força do demonstrativo הַהִוא.
- source_word: תִּשָּׂא אֶת־עֲוֺנָהּ
  choice: levará sobre si a sua culpa
  rationale: A expressão נשׂא עָוֹן descreve suportar ou carregar a própria culpa, podendo abranger suas consequências. A formulação preserva a imagem do hebraico sem explicá-la em excesso.
theological_decisions:
- issue: Sentido de עָוֹן nas duas orações
  choice: culpa em ambas as ocorrências
  alternative: iniquidade; castigo pela iniquidade
  rationale: 'A repetição preserva o paralelo moral e jurídico: o homem fica livre da culpa, enquanto a mulher leva sobre si a sua. Isso mantém aberta a possibilidade de a expressão incluir as consequências da culpa, sem reduzir עָוֹן apenas ao castigo.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e o contraste do hebraico foram preservados; as notas registram a identificação contextual de “homem” como marido e a amplitude semântica de עָוֹן.
