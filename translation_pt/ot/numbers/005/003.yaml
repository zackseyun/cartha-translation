id: NUM.5.3
reference: Numbers 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: pt
  text: Tanto os homens como as mulheres, vocês os mandarão para fora do acampamento; vocês os mandarão para fora, para que não tornem impuros os seus acampamentos[a], no meio dos quais eu habito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o plural “seus acampamentos”, talvez em referência às divisões ou diferentes áreas do acampamento de Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “entre eles eu habito”, caso a expressão se refira às pessoas associadas aos acampamentos, e não aos próprios acampamentos.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: Tanto os homens como as mulheres
  rationale: A expressão hebraica indica inclusivamente toda a extensão, do sexo masculino ao feminino. Esta formulação é natural em português e deixa claro que ambos estão abrangidos.
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: vocês os mandarão ... vocês os mandarão para fora
  rationale: A repetição do Piel de שלח é mantida para preservar a ênfase do original, sem intensificar indevidamente o sentido para uma expulsão punitiva.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: Expressa de modo corrente o deslocamento para além dos limites do acampamento.
- source_word: יְטַמְּאוּ
  choice: tornem impuros
  rationale: No contexto sacerdotal, טמא se refere à impureza ritual. A escolha preserva essa categoria cultual sem sugerir apenas contaminação física ou moral.
- source_word: מַחֲנֵיהֶם
  choice: os seus acampamentos
  rationale: Mantém o substantivo plural e o sufixo de terceira pessoa do plural do hebraico, possivelmente alusivos às divisões ou áreas do acampamento de Israel.
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: no meio dos quais eu habito
  rationale: Conserva a imagem solene da presença divina residente no meio dos acampamentos, ao mesmo tempo que uma nota registra a possível referência às pessoas neles reunidas.
theological_decisions:
- issue: Referente de אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: 'A oração é ligada gramaticalmente a “acampamentos”: “no meio dos quais eu habito”.'
  alternative: “entre eles eu habito”, referindo-se às pessoas associadas aos acampamentos.
  rationale: O sufixo hebraico é masculino plural e permite entender como referente tanto os acampamentos quanto, por associação, o povo. A tradução principal segue o antecedente expresso mais próximo, e a nota preserva a ambiguidade e a tensão teológica da presença de Deus no acampamento e entre Israel.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de “vocês” torna explícito o sujeito plural da ordem. A repetição verbal e o plural “acampamentos” preservam traços relevantes do hebraico; as notas conservam a ambiguidade do referente final.
