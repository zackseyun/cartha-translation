  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: pt
  text: 'Então o sacerdote fará a mulher prestar juramento e lhe dirá: “Se nenhum homem se deitou com você, e se você não se desviou, tornando-se impura enquanto estava casada[a], fique livre destas águas amargas que trazem maldição[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sob seu marido”, expressão que se refere à condição da mulher dentro do vínculo matrimonial.'
    reason: cultural_note
  - marker: b
    text: 'Literalmente: “as águas amargas, as que trazem maldição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ אֹתָהּ
  choice: fará a mulher prestar juramento
  rationale: O hifil de שבע expressa fazer alguém jurar ou colocá-lo sob juramento; esta formulação preserva a força causativa em português natural.
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: Se nenhum homem se deitou com você
  rationale: שכב funciona aqui como eufemismo convencional para relação sexual. “Deitou-se com você” mantém o eufemismo e o registro digno.
- source_word: שָׂטִית טֻמְאָה
  choice: se desviou, tornando-se impura
  rationale: Preserva tanto a metáfora de desvio em שׂטה quanto a noção de impureza ritual e moral de טֻמְאָה, sem reduzir a expressão simplesmente a “cometeu adultério”.
- source_word: תַּחַת אִישֵׁךְ
  choice: enquanto estava casada
  rationale: A expressão literalmente diz “sob seu marido”, mas, neste contexto jurídico, indica a condição e o vínculo matrimonial. A tradução comunica o sentido idiomático sem introduzir uma afirmação geral sobre hierarquia conjugal.
- source_word: הִנָּקִי
  choice: fique livre
  rationale: A forma de נקה comunica isenção ou ausência dos efeitos adversos da prova; “fique livre” preserva a formulação imperativa sem declarar antecipadamente um veredito abstrato.
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: destas águas amargas que trazem maldição
  rationale: Mantém o plural hebraico “águas”, o adjetivo “amargas” e a função causadora de maldição expressa pelo particípio de ארר.
theological_decisions:
- issue: Natureza da possível transgressão da mulher
  choice: Conservar a linguagem de relação sexual, desvio e impureza
  alternative: Explicitar diretamente “cometeu adultério”
  rationale: O contexto trata de suspeita de infidelidade conjugal, mas o hebraico emprega expressões distintas e carregadas de sentido ritual e jurídico. Explicitá-las como “adultério” eliminaria parte dessa textura e poderia exceder a formulação do versículo.
- issue: Sentido de תַּחַת אִישֵׁךְ
  choice: Traduzir idiomaticamente como “enquanto estava casada” e registrar o literal em nota
  alternative: Manter no texto “sob seu marido”
  rationale: O literal pode soar em português moderno como uma declaração abstrata de subordinação, enquanto aqui a expressão assinala sobretudo a condição da mulher dentro do vínculo matrimonial. A nota preserva a forma hebraica.
- issue: Efeito das águas
  choice: Dizer que as águas “trazem maldição”
  alternative: “águas amargas, as que causam a maldição”
  rationale: A formulação mantém a associação eficaz entre as águas rituais e a maldição sem definir além do texto o mecanismo de seu efeito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de leitura natural no Brasil. A sintaxe jurídica do original foi preservada sem rigidez excessiva; os eufemismos e a linguagem ritual foram mantidos.
