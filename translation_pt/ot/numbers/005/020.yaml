  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: pt
  text: Mas, se você se desviou enquanto era casada com seu marido[a], se tornou impura e um homem que não é seu marido teve relações sexuais com você—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sob seu marido”, expressão idiomática referente ao vínculo ou à condição conjugal.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׂטִית
  choice: se desviou
  rationale: Preserva a metáfora hebraica de desvio e, no contexto, indica afastamento da fidelidade conjugal sem substituir a imagem por uma explicação.
- source_word: תַּחַת אִישֵׁךְ
  choice: enquanto estava sob a autoridade de seu marido
  rationale: Torna compreensível em português o sentido jurídico-conjugal de תַּחַת, cujo significado literal é «debaixo de/sob», sem sugerir localização física.
- source_word: נִטְמֵאת
  choice: ficou impura
  rationale: Expressa a categoria de impureza presente no nifal de טמא e mantém sua dimensão ritual e moral no contexto legal.
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: outro homem [...] teve relações sexuais com você
  rationale: Comunica claramente o sentido do eufemismo hebraico, literalmente «um homem deu em você o seu deitar», em linguagem moderna e digna.
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: outro homem, que não o seu marido
  rationale: Expressa com naturalidade a exclusão marcada por מִבַּלְעֲדֵי e evita a possível ambiguidade de «além de seu marido».
theological_decisions:
- issue: Como traduzir a linguagem de infidelidade conjugal sem dizer mais do que o hebraico
  choice: Manter «se desviou» na primeira oração e explicitar o ato sexual na última
  alternative: Traduzir desde o início como «foi infiel ao seu marido»
  rationale: O hebraico combina uma metáfora de desvio com um eufemismo sexual. A opção escolhida conserva a metáfora inicial, mas deixa inequívoco o ato descrito depois, sem acrescentar uma categoria doutrinária.
- issue: Sentido da expressão marital תַּחַת אִישֵׁךְ
  choice: sob a autoridade de seu marido
  alternative: debaixo de seu marido; ligada a seu marido
  rationale: A expressão aponta para a condição ou vínculo conjugal da mulher, não para uma posição física. A tradução explicita esse valor cultural-jurídico sem apagar a imagem de «sob».
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Você» acompanha a interpelação direta no feminino; «relações sexuais» esclarece o eufemismo hebraico sem vulgaridade. O travessão final preserva a frase suspensa, que continua no versículo seguinte.
