  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: pt
  text: Mas, se a mulher não se contaminou e está pura, ela será declarada inocente e conceberá filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “será semeada com semente”, expressão idiomática referente a conceber ou ter filhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção introduz o caso contrário ao juízo descrito no versículo anterior; “Mas, se” expressa naturalmente esse contraste.
- source_word: לֹא נִטְמְאָה
  choice: não se contaminou
  rationale: O nifal de טמא pode indicar tornar-se impura ou contaminada. Neste contexto de suspeita de adultério, a forma reflexiva comunica a contaminação moral e sexual sem especificar além do hebraico.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Tradução direta do substantivo definido.
- source_word: וּטְהֹרָה הִוא
  choice: e está pura
  rationale: טָהוֹר denota pureza ou limpeza. “Pura” é natural em português e, em contraste com “contaminou”, preserva o sentido ritual e moral do contexto.
- source_word: וְנִקְּתָה
  choice: ela será declarada inocente
  rationale: O nifal de נקה pode significar ficar livre, isento ou sem culpa. No contexto da prova, a expressão comunica sua vindicação; “declarada” explicita o resultado público sem transformar a cena num tribunal formal.
- source_word: וְנִזְרְעָה זָרַע
  choice: e conceberá descendência
  rationale: A expressão literalmente ligada a ser semeada com semente é uma formulação idiomática de fertilidade ou concepção. A tradução mantém a afirmação direta do hebraico, sem acrescentar apenas capacidade potencial.
theological_decisions:
- issue: Natureza do resultado prometido após a vindicação
  choice: A mulher inocente é vindicada e conceberá descendência.
  alternative: A mulher permanecerá fértil ou será capaz de conceber.
  rationale: A construção וְנִזְרְעָה זָרַע afirma o resultado em linguagem de concepção. Traduzir diretamente como “conceberá descendência” evita reduzir a frase a mera capacidade, embora a formulação idiomática possa também ser entendida em sentido mais geral de fertilidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A tradução preserva o contraste, a linguagem de pureza e a afirmação direta sobre concepção; a forma literal incomum da última expressão é registrada em nota.
