  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: pt
  text: e um homem se deitar com ela, com emissão de sêmen[a], e isso permanecer oculto aos olhos do marido dela, e ela permanecer oculta, e se tornar impura, sem que haja testemunha contra ela[b], e ela não for apanhada[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deitar de semente” ou “leito de semente”, expressão referente à relação sexual com emissão seminal.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sem que haja testemunha a respeito dela”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “não for agarrada”; alguns entendem que isso implica “não for forçada”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: e um homem se deitar com ela
  rationale: Preserva a expressão sexual direta do hebraico שׁכב אֶת sem recorrer a um eufemismo e encaixa a oração na construção condicional e jurídica do contexto.
- source_word: שִׁכְבַת זֶרַע
  choice: com emissão de sêmen
  rationale: Representa de modo claro e relativamente formal a expressão hebraica ligada à relação sexual e à emissão seminal, relevante no contexto das leis de pureza.
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: e isso ficar oculto aos olhos do marido dela
  rationale: Mantém a voz passiva e a imagem hebraica de algo estar oculto aos olhos do marido, usando “isso” para retomar o ato descrito.
- source_word: וְנִסְתְּרָה
  choice: e ela ficar oculta
  rationale: Conserva a ambiguidade passiva ou reflexiva do nifal, sem decidir se ela se escondeu deliberadamente ou se o fato apenas permaneceu secreto.
- source_word: וְהִיא נִטְמָאָה
  choice: e tiver se tornado impura
  rationale: Mantém a linguagem de pureza do texto legal e o aspecto resultante do verbo, sem intensificar a expressão com uma formulação moralizante.
- source_word: וְעֵד אֵין בָּהּ
  choice: sem haver testemunha contra ela
  rationale: Expressa naturalmente a ausência de testemunho incriminador no cenário jurídico; a amplitude possível da preposição é registrada em nota.
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: e ela não tiver sido pega
  rationale: No contexto, a formulação comunica de modo natural que ela não foi descoberta ou apanhada; a possibilidade lexical de “agarrada” ou “forçada” permanece em nota.
theological_decisions:
- issue: Linguagem de impureza em נִטְמָאָה
  choice: tiver se tornado impura
  alternative: tiver sido contaminada
  rationale: “Impura” preserva a categoria própria das leis de pureza e evita introduzir uma carga retórica maior do que a do texto.
- issue: Sentido de לֹא נִתְפָּשָׂה
  choice: não tiver sido pega
  alternative: não tiver sido agarrada; não tiver sido forçada
  rationale: A leitura principal entende a cláusula como ausência de flagrante ou descoberta, coerente com a falta de testemunha. Como o verbo também pode denotar ser agarrada, a possível implicação de coerção é preservada sem ser imposta ao texto principal.
- issue: Agência em וְנִסְתְּרָה
  choice: ela ficar oculta
  alternative: ela se esconder; o caso permanecer em segredo
  rationale: A forma hebraica permite nuance passiva ou reflexiva. A tradução evita determinar indevidamente se a mulher ocultou o ato de propósito.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe jurídica condicional adequada ao contexto. A formulação mantém o caráter de oração iniciada no versículo anterior e, por isso, termina com travessão. Evitam-se tanto eufemismos vagos quanto linguagem excessivamente clínica.
