base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica do nome divino e a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com waw consecutivo, introduz uma nova unidade de discurso. “Falou” reproduz com naturalidade a fórmula narrativa de comunicação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “a” é a forma natural em português na construção “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula, o infinitivo introduz o conteúdo do discurso que vem a seguir. Em português atual, os dois-pontos expressam essa função de modo mais natural do que o decalque “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; a nota registra a tradução tradicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A coordenação inicial com “E” preserva a continuidade narrativa. Os dois-pontos introduzem naturalmente, em português, a fala que começa no versículo seguinte.
