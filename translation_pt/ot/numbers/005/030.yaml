  text: א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛י/ו ר֥וּחַ קִנְאָ֖ה וְ/קִנֵּ֣א אֶת אִשְׁתּ֑/וֹ וְ/הֶעֱמִ֤יד אֶת הָֽ/אִשָּׁה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/עָ֤שָׂה לָ/הּ֙ הַ/כֹּהֵ֔ן אֵ֥ת כָּל הַ/תּוֹרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: pt
  text: ou quando um espírito de ciúme vier sobre um homem[a], e ele tiver ciúme de sua mulher, e apresentar a mulher diante de Yahweh, o sacerdote cumprirá, em relação a ela, toda esta instrução[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vier sobre”; literalmente, “passar sobre ele”.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda esta lei”, “todo este procedimento” ou “todo este ritual”.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: ou quando
  rationale: Introduz a segunda alternativa da formulação iniciada no contexto anterior; mantém a força disjuntiva com naturalidade em português.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o termo hebraico comum para homem; a expressão seguinte, 'sua mulher', explicita a relação conjugal.
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: um espírito de ciúme vier sobre
  rationale: Conserva a imagem hebraica de algo que passa ou vem sobre o homem, sem decidir se se trata apenas de um estado psicológico ou de uma força espiritual.
- source_word: רוּחַ
  choice: espírito
  rationale: Mantém a amplitude semântica do hebraico e a ambiguidade entre disposição interior e impulso avassalador.
- source_word: קִנְאָה
  choice: ciúme
  rationale: No contexto de suspeita de infidelidade conjugal, 'ciúme' é o sentido mais adequado.
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: e ele tiver ciúme de sua mulher
  rationale: Reproduz o verbo cognato do substantivo anterior e soa natural em português; 'mulher' preserva a correspondência lexical e, com o possessivo, significa esposa no contexto.
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: e apresentar a mulher diante de Yahweh
  rationale: O causativo de עמד significa fazer ficar de pé ou apresentar; 'apresentar' comunica com clareza o ato formal diante de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino conforme a opção do projeto, em vez de substituí-lo por um título.
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: o sacerdote lhe aplicará
  rationale: Em português, 'aplicar' expressa naturalmente que o sacerdote executará em relação a ela a instrução ritual prescrita, evitando o pouco idiomático 'fará a ela'.
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: toda esta instrução
  rationale: תּוֹרָה pode significar instrução, lei ou procedimento; aqui designa o conjunto de prescrições anteriormente descrito, e 'instrução' preserva sua amplitude.
theological_decisions:
- issue: Natureza do 'espírito de ciúme'
  choice: Mantida a expressão literal 'um espírito de ciúme'.
  alternative: um acesso de ciúme; um impulso de ciúme
  rationale: O hebraico não determina se a expressão descreve somente uma disposição psicológica ou alguma força espiritual; a tradução preserva essa ambiguidade.
- issue: Sentido de תּוֹרָה no rito
  choice: instrução
  alternative: lei; procedimento; ritual
  rationale: O termo possui alcance maior que uma lei isolada e, neste contexto, refere-se à prescrição ritual completa sem deixar de ter força normativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a estrutura alternativa do contexto legal, enquanto 'apresentar' e 'aplicará' tornam a ação ritual natural em português. Todos os marcadores de nota aparecem no texto principal.
