source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: pt
  text: 'Então o homem levará sua mulher ao sacerdote e levará a oferta dela em favor dela: um décimo de efa de farinha de cevada. Não derramará azeite sobre a oferta nem colocará incenso sobre ela, pois é uma oferta de cereal por ciúmes, uma oferta memorial que traz a culpa à memória.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma oferta de lembrança que traz a iniquidade à memória”. O termo hebraico traduzido como “culpa” também pode indicar iniquidade ou a responsabilidade decorrente de uma transgressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: levará
  rationale: Em contexto legal, a forma verbal tem força de instrução; o futuro em português conserva o tom legislativo de modo natural e digno.
- source_word: הָאִישׁ ... אִשְׁתּוֹ
  choice: o homem ... sua mulher
  rationale: Mantém o sentido literal de הָאִישׁ, enquanto 'sua mulher' expressa naturalmente a relação conjugal indicada pelo contexto.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente direto do ofício cultual hebraico.
- source_word: קָרְבָּנָהּ עָלֶיהָ
  choice: por ela a oferta dela
  rationale: Conserva tanto o sufixo feminino de 'oferta' quanto a ideia de que o homem a apresenta em favor ou a respeito dela.
- source_word: עֲשִׂירִת הָאֵיפָה
  choice: um décimo de efa
  rationale: Preserva a antiga unidade de medida sem impor uma conversão moderna imprecisa.
- source_word: קֶמַח שְׂעֹרִים
  choice: farinha de cevada
  rationale: Tradução corrente e lexicalmente adequada da expressão construta.
- source_word: לֹא יִצֹק עָלָיו שֶׁמֶן
  choice: Não derramará azeite sobre a oferta
  rationale: O referente pronominal foi explicitado para evitar a ambiguidade gramatical que 'sobre ela' criaria em português após 'cevada'.
- source_word: וְלֹא יִתֵּן עָלָיו לְבֹנָה
  choice: nem colocará incenso sobre ela
  rationale: נתן admite 'colocar'; 'incenso' é a designação portuguesa corrente da resina aromática לְבֹנָה neste contexto ritual.
- source_word: מִנְחַת קְנָאֹת
  choice: uma oferta de cereal por ciúmes
  rationale: מִנְחָה designa aqui uma oferta cerealífera; 'por ciúmes' comunica a relação da oferta com o caso de ciúmes sem transformar o plural abstrato hebraico em mera emoção individual.
- source_word: מִנְחַת זִכָּרוֹן
  choice: uma oferta memorial
  rationale: Expressa de modo conciso a função de lembrança indicada por זִכָּרוֹן.
- source_word: מַזְכֶּרֶת עָוֹן
  choice: que traz a culpa à memória
  rationale: Reproduz a força causativa do particípio e escolhe 'culpa' como sentido contextual possível de עָוֹן, sem presumir antecipadamente o resultado do rito.
theological_decisions:
- issue: Se a descrição da oferta pressupõe a culpa da mulher
  choice: Traduzir a função memorial da oferta sem declarar antecipadamente que a mulher é culpada
  alternative: Traduzir de modo que a oferta já estabeleça a iniquidade da mulher
  rationale: O versículo descreve a composição e a função ritual da oferta, mas não determina por si só o resultado da prova; a tradução preserva essa tensão.
- issue: Valor de עָוֹן em מַזְכֶּרֶת עָוֹן
  choice: culpa
  alternative: iniquidade
  rationale: '''Culpa'' preserva neste contexto a possível responsabilidade ou condição judicial evocada pelo rito, enquanto a nota registra a amplitude semântica do termo hebraico.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O futuro verbal mantém o tom jurídico. A repetição 'por ela a oferta dela' preserva distinções do hebraico; 'sobre a oferta' explicita o referente para evitar ambiguidade em português.
