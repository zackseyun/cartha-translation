  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כָל תְּרוּמָ֞ה לְ/כָל קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל אֲשֶׁר יַקְרִ֥יבוּ לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/009.yaml
  text: And every contribution from all the holy gifts of the sons of Israel, which they bring near to the priest, shall be his.
translation:
  language: pt
  text: E toda contribuição dentre todas as ofertas sagradas dos filhos de Israel[a], que eles apresentarem ao sacerdote, pertencerá a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: contribuição
  rationale: Designa algo separado e entregue, muitas vezes como porção devida ao sacerdote. “Contribuição” é atual e preserva essa ideia sem recorrer ao termo técnico e menos claro “oferta alçada”.
- source_word: קָדְשֵׁי
  choice: ofertas sagradas
  rationale: O plural construto de קֹדֶשׁ se refere aqui a bens consagrados apresentados como ofertas. “Ofertas sagradas” é claro e natural no contexto cultual.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a forma familiar masculina do hebraico, em vez de substituí-la silenciosamente pelo gentílico “israelitas”.
- source_word: יַקְרִיבוּ
  choice: apresentarem
  rationale: No contexto sacrificial, o hifil de קרב significa fazer chegar perto e, por extensão, apresentar uma oferta. “Apresentarem” comunica naturalmente o valor cultual; o sentido literal consta em nota.
- source_word: לַכֹּהֵן
  choice: ao sacerdote
  rationale: A preposição indica o destinatário da oferta, e a oração seguinte esclarece que ela passa a pertencer ao sacerdote.
- source_word: לוֹ יִהְיֶה
  choice: pertencerá a ele
  rationale: Expressa posse jurídica de modo claro e natural em português, preservando o valor futuro-normativo da construção hebraica.
theological_decisions:
- issue: Designação da comunidade da aliança בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução conserva o termo familiar masculino efetivamente presente no hebraico, sem transformar a expressão em uma designação étnica mais genérica. Não se pretende excluir mulheres da comunidade referida.
- issue: Relação entre a contribuição consagrada e o sacerdote
  choice: pertencerá a ele
  alternative: será dele
  rationale: A formulação mantém o sentido legal de posse sem especificar além do texto como essa norma se relaciona com outras categorias de ofertas e porções sacerdotais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Contribuição” evita o tecnicismo “oferta alçada”; “apresentarem” soa natural no contexto sacrificial. Todos os marcadores das notas aparecem no texto principal.
