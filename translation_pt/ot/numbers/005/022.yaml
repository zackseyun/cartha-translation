  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: pt
  text: 'e que estas águas que trazem maldição entrem em suas entranhas[a], para fazer o ventre inchar e a coxa definhar. E a mulher dirá: “Amém, amém”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para inchar o ventre e fazer cair a coxa”. A expressão hebraica é difícil e pode ser um eufemismo para uma aflição reprodutiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: e que ... entrem
  rationale: No contexto da imprecação ritual, a forma expressa o efeito invocado da maldição, não apenas um futuro simples.
- source_word: הַמַּיִם הַמְאָרְרִים
  choice: estas águas que trazem maldição
  rationale: Preserva o plural hebraico e comunica que as águas carregam ou produzem a maldição, sem confundir o termo com 'amargas'.
- source_word: בְּמֵעַיִךְ
  choice: em suas entranhas
  rationale: Expressão corporal concreta e solene para as partes interiores, natural em português e menos clínica que 'abdômen'.
- source_word: לַצְבּוֹת בֶּטֶן
  choice: para fazer o ventre inchar
  rationale: Reproduz o infinitivo de resultado e mantém בֶּטֶן como 'ventre', termo que conserva alguma abertura entre barriga e região reprodutiva.
- source_word: וְלַנְפִּל יָרֵךְ
  choice: e a coxa definhar
  rationale: A expressão é idiomática e difícil. 'Definhar' comunica deterioração corporal de modo inteligível, enquanto 'coxa' preserva o eufemismo hebraico.
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: E a mulher dirá
  rationale: Futuro simples adequado à prescrição do rito, com continuação narrativa natural.
- source_word: אָמֵן אָמֵן
  choice: Amém, amém
  rationale: Mantém a resposta litúrgica duplicada e sua força de confirmação solene.
theological_decisions:
- issue: Natureza exata dos efeitos corporais da maldição
  choice: ventre inchar e coxa definhar
  alternative: útero abortar; órgãos genitais definharem; coxa cair
  rationale: O hebraico provavelmente contém um eufemismo ligado à aflição reprodutiva, mas não identifica com certeza um resultado médico específico. A tradução preserva essa ambiguidade em vez de impor aborto, infertilidade ou prolapso.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva o caráter ritual da imprecação e evita explicitar além do hebraico a possível referência aos órgãos reprodutivos.
