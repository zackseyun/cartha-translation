base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/016.yaml
  text: Then the priest shall bring her near and make her stand before Yahweh[a].
translation:
  language: pt
  text: Então o sacerdote a conduzirá para perto e a colocará de pé diante de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido por “SENHOR”. “Yahweh” é a forma usada neste texto; “Jeová” é uma forma alternativa do nome.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: fará com que ela se aproxime
  rationale: O hifil de קרב expressa fazer alguém chegar perto ou apresentar. A formulação conserva o sentido espacial e a força causativa, sem sugerir que a mulher seja uma oferta.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן neste contexto ritual e jurídico.
- source_word: וְהֶעֱמִדָהּ
  choice: a colocará de pé
  rationale: O hifil de עמד é causativo, literalmente fazer ficar de pé. Esta formulação é natural em português e preserva a postura explicitada pelo hebraico.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa de modo conciso tanto a posição quanto a presença perante alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. A transliteração Yahweh preserva o caráter de nome próprio; a nota registra a tradição de substituí-lo por SENHOR e a forma alternativa Jeová.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo verbal e a sequência ritual do hebraico foram preservados sem tecnicismo excessivo.
