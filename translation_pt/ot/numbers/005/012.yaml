  terminology: «Filhos de Israel» conserva a expressão hebraica, com a alternativa idiomática corretamente indicada na nota. «Esposa» é o termo necessário para a relação conjugal explicitada pelo hebraico. A nota b explica corretamente a construção cognata e não antecipa indevidamente os pormenores do caso nos versículos seguintes.
