base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a] e diga-lhes: Se a esposa de um homem se desviar e cometer uma infidelidade contra ele[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “aos israelitas”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: “Cometer uma infidelidade” traduz uma expressão hebraica formada por palavras cognatas, que indica agir de modo infiel ou traiçoeiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo introduz a instrução divina dada a Moisés; “Fale” preserva de modo natural a fórmula de comunicação.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a expressão familiar masculina do hebraico; a forma idiomática “aos israelitas” é registrada em nota.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz a continuação da fórmula de fala em português claro e digno.
- source_word: אִישׁ אִישׁ
  choice: de qualquer homem
  rationale: A repetição distributiva hebraica significa “qualquer homem”; a construção foi ajustada à sintaxe portuguesa por causa de “sua mulher”.
- source_word: כִּי
  choice: Se
  rationale: No contexto de legislação casuística, introduz uma condição, não apenas uma circunstância temporal.
- source_word: תִשְׂטֶה
  choice: se desviar
  rationale: Preserva a imagem de afastamento moral sem antecipar os detalhes apresentados nos versículos seguintes.
- source_word: אִשְׁתּוֹ
  choice: a mulher de qualquer homem
  rationale: “Mulher” é uma designação portuguesa corrente para a esposa e permite incorporar naturalmente o possessivo hebraico à construção distributiva.
- source_word: וּמָעֲלָה ... מָעַל
  choice: cometer uma infidelidade
  rationale: Expressa a violação de confiança indicada pela construção hebraica de verbo e substantivo cognatos, sem recorrer a uma formulação artificial em português.
- source_word: בּוֹ
  choice: contra ele
  rationale: Apresenta o marido como a pessoa contra quem é cometida a violação de fidelidade.
theological_decisions:
- issue: Forma de designar o povo da aliança
  choice: filhos de Israel
  alternative: israelitas
  rationale: O texto principal conserva a expressão masculina de parentesco presente no hebraico, enquanto a nota oferece o equivalente coletivo mais idiomático.
- issue: Natureza da falta conjugal
  choice: cometer uma infidelidade contra ele
  alternative: ser infiel a ele
  rationale: A escolha retém algo da ênfase da construção hebraica com verbo e substantivo cognatos e da ideia de violação de confiança, sem especificar antes da hora o ato descrito na sequência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A formulação conserva a cadência da instrução legal e evita explicitar o adultério antes dos detalhes fornecidos pelos versículos seguintes.
