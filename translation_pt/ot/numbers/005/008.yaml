  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: pt
  text: Mas, se o homem não tiver parente resgatador[a] a quem devolver a reparação pela culpa, a reparação pela culpa que for restituída ao SENHOR pertencerá ao sacerdote[b], além do carneiro da expiação, com o qual se fará expiação por esse homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “resgatador” ou “parente mais próximo”. O hebraico גֹּאֵל designa um membro da família com responsabilidade legal em questões de resgate ou restituição.
    reason: lexical_alternative
  - marker: b
    text: O hebraico אָשָׁם refere-se aqui à reparação ou compensação pela culpa, não ao próprio carneiro; o carneiro é mencionado separadamente em seguida.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: parente resgatador
  rationale: Expressa tanto o vínculo familiar quanto a responsabilidade jurídica do parente que poderia receber a restituição; é mais preciso aqui do que apenas “resgatador” ou “parente”.
- source_word: הָאָשָׁם
  choice: reparação pela culpa
  rationale: Neste contexto, designa a compensação devida pelo dano, distinguida do carneiro sacrificial mencionado depois. “Reparação” comunica de modo natural a restauração jurídica e material.
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: a reparação pela culpa que for restituída
  rationale: Mantém explícita a força passiva do particípio de שׁוב e a ação legal de devolver o valor devido.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a forma tradicional portuguesa para o Tetragrama e preserva a ideia de que a reparação é entregue ao SENHOR, passando legalmente ao sacerdote.
- source_word: לַכֹּהֵן
  choice: pertencerá ao sacerdote
  rationale: Acrescenta o predicado exigido pela sintaxe natural do português e comunica claramente o destinatário legal da reparação.
- source_word: מִלְּבַד
  choice: além de
  rationale: Indica que o carneiro é adicional à reparação, e não idêntico a ela.
- source_word: אֵיל הַכִּפֻּרִים
  choice: o carneiro da expiação
  rationale: Forma natural e digna em português que conserva a função sacrificial do animal.
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: com o qual se fará expiação por ele
  rationale: Apresenta o carneiro como meio da expiação e evita explicitar um agente que a oração portuguesa pode deixar implícito, como ocorre no contexto ritual.
- source_word: לָאִישׁ
  choice: o homem
  rationale: Preserva o masculino singular do hebraico sem neutralizá-lo desnecessariamente.
theological_decisions:
- issue: Relação entre a reparação e o sacrifício
  choice: A reparação material e o carneiro da expiação são elementos distintos; o carneiro é oferecido além da reparação.
  alternative: Entender אָשָׁם neste ponto como a própria oferta sacrificial pela culpa.
  rationale: מִלְּבַד (“além de”) separa a reparação entregue ao sacerdote do carneiro usado para a expiação, impedindo que os dois sejam confundidos.
- issue: Representação do Tetragrama
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção tradicional em português para יהוה, com versaletes representados aqui por maiúsculas.
translation_notes:
  register: Português moderno, claro e solene, com vocabulário jurídico compreensível. A repetição de “reparação pela culpa” preserva a coesão lexical do hebraico; a voz impessoal em “se fará expiação” mantém o foco no rito sem inserir no texto um sujeito expresso.
