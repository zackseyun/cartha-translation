  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: pt
  text: Esta é a lei do ciúme[a], para o caso em que uma esposa se desvia, estando sob o vínculo matrimonial com seu marido[b], e se torna impura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente “ciúmes”, no plural, provavelmente como designação técnica desta lei e de seu procedimento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “debaixo de seu marido”, expressão idiomática que indica estar sob o vínculo conjugal com ele.
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Esta é a lei
  rationale: A fórmula demonstrativa introduz um resumo jurídico; “lei” comunica naturalmente o sentido de תּוֹרָה neste contexto.
- source_word: הַקְּנָאֹת
  choice: do ciúme
  rationale: Embora o hebraico use o plural, a expressão funciona como designação técnica do procedimento motivado por ciúme; o singular é mais natural em português, e a forma hebraica é registrada em nota.
- source_word: אֲשֶׁר
  choice: para o caso em que
  rationale: A partícula relativa introduz a situação abrangida pela lei; esta formulação explicita com naturalidade a relação jurídica.
- source_word: תִּשְׂטֶה
  choice: se desvia
  rationale: Preserva a metáfora hebraica de afastar-se ou desencaminhar-se, sem substituir o termo por uma acusação mais específica de adultério.
- source_word: אִשָּׁה
  choice: uma esposa
  rationale: O contexto conjugal indicado por אִישָׁהּ exige aqui o sentido de “esposa”, não apenas “mulher”.
- source_word: תַּחַת אִישָׁהּ
  choice: embora esteja casada
  rationale: A expressão literalmente espacial é um idioma que descreve a mulher sob o vínculo conjugal com seu marido. A tradução comunica esse vínculo sem reproduzir uma formulação portuguesa potencialmente enganosa.
- source_word: וְנִטְמָאָה
  choice: e se contamina
  rationale: Mantém a linguagem de impureza do hebraico e a nuance de entrada em estado de contaminação, sem reduzi-la à impureza ritual nem explicitar “comete adultério”.
theological_decisions:
- issue: Natureza da linguagem de impureza na lei sobre suspeita de infidelidade
  choice: e se contamina
  alternative: e comete adultério; e fica impura
  rationale: O contexto é de possível infidelidade sexual, mas o hebraico emprega a linguagem de טמא. “Se contamina” conserva essa categoria e não transforma a suspeita contextual numa formulação explícita ausente do versículo.
- issue: Sentido de תַּחַת אִישָׁהּ
  choice: embora esteja casada
  alternative: sob seu marido; sob a autoridade de seu marido
  rationale: A expressão indica o vínculo conjugal, possivelmente com conotação de posição marital. A tradução principal evita decidir que o foco seja especificamente autoridade, enquanto a nota preserva a forma e a amplitude do idioma.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação jurídica “para o caso em que” dá fluidez ao período. As notas preservam o plural hebraico e o idioma conjugal sem sobrecarregar o texto principal.
