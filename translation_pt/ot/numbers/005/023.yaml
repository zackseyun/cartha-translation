  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: pt
  text: Então o sacerdote escreverá estas maldições no rolo e as apagará na água amarga.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estas maldições de juramento”. O termo hebraico pode indicar uma maldição associada a um juramento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as removerá” ou “as apagará, lavando-as”. O verbo hebraico se refere a apagar, limpar ou remover as palavras escritas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: Então ... escreverá
  rationale: O perfeito qal com conjunção, nesta sequência de instruções rituais, tem valor procedimental e prospectivo. “Então ... escreverá” expressa naturalmente a ação seguinte.
- source_word: הָאָלֹת הָאֵלֶּה
  choice: essas maldições
  rationale: אָלָה pode designar uma maldição ligada a um juramento. Neste contexto, refere-se às sanções pronunciadas e registradas; a nuance de juramento é preservada em nota.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e adequado para o oficiante cultual neste ritual.
- source_word: בַּסֵּפֶר
  choice: no rolo
  rationale: סֵפֶר designa aqui o suporte escrito antigo, não um livro encadernado moderno. “Rolo” comunica adequadamente o objeto material.
- source_word: וּמָחָה
  choice: e as apagará
  rationale: מחה significa apagar, remover por fricção ou obliterar o que foi escrito. “Apagará” preserva o sentido central sem especificar além do hebraico o modo físico exato.
- source_word: אֶל
  choice: na
  rationale: Neste contexto, a preposição indica que as palavras apagadas passam para a água. Em português, “apagará na água” descreve de modo natural o meio e o destino da escrita removida.
- source_word: מֵי הַמָּרִים
  choice: a água amarga
  rationale: A expressão construta significa literalmente “águas de amargura” ou “águas amargas”. O singular coletivo “água amarga” é natural em português e mantém a caracterização ritual do líquido.
