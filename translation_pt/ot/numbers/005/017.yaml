id: NUM.5.17
reference: Numbers 5:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּ/כְלִי חָ֑רֶשׂ וּ/מִן הֶֽ/עָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּ/קַרְקַ֣ע הַ/מִּשְׁכָּ֔ן יִקַּ֥ח הַ/כֹּהֵ֖ן וְ/נָתַ֥ן אֶל הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: pt
  text: Então o sacerdote pegará água santa[a] num recipiente de barro[b]; depois pegará um pouco do pó que estiver no chão[c] do tabernáculo e o colocará na água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água sagrada”. O hebraico indica água separada como santa para uso ritual.
    reason: lexical_alternative
  - marker: b
    text: Ou “num vaso de cerâmica”.
    reason: lexical_alternative
  - marker: c
    text: Ou “no solo”. O termo hebraico pode designar tanto o solo como o piso; “chão” se ajusta bem ao contexto do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: água santa
  rationale: Traduz diretamente o substantivo e o adjetivo hebraicos, que indicam água separada como santa para uso ritual; a nota evita que associações eclesiásticas posteriores determinem o sentido no contexto.
- source_word: בִּכְלִי חָרֶשׂ
  choice: num recipiente de barro
  rationale: כְּלִי designa um recipiente ou utensílio, e חָרֶשׂ indica barro ou cerâmica; esta formulação é clara e natural em português moderno.
- source_word: מִן הֶעָפָר
  choice: um pouco do pó
  rationale: 'עָפָר pode significar pó ou terra solta, e מִן tem aqui valor partitivo: o sacerdote pega parte do pó, não necessariamente todo ele.'
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: no chão do tabernáculo
  rationale: קַרְקַע designa a superfície do solo ou piso; “chão” é natural e preserva a amplitude entre solo e piso no espaço do tabernáculo.
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: pegará ... pegará ... e colocará
  rationale: O futuro em português expressa de modo natural a ação prescrita na instrução ritual. “Colocará” traduz נָתַן com אֶל neste contexto.
- source_word: הַמָּיִם
  choice: a água
  rationale: O artigo remete à água santa já mencionada no início do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com futuro prescritivo adequado à instrução ritual. “Tabernáculo” preserva a designação cultual convencional; “recipiente de barro” evita arcaísmo desnecessário.
