base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: pt
  text: As ofertas sagradas de cada homem lhe pertencerão[a]; tudo o que um homem der ao sacerdote pertencerá ao sacerdote.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “as coisas sagradas de cada homem”. A expressão se refere a coisas consagradas como ofertas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “lhe pertencerá”. No contexto, o referente é o sacerdote.
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: cada homem / um homem
  rationale: O substantivo masculino singular tem valor distributivo neste contexto legal. A tradução mantém a referência masculina explícita do hebraico.
- source_word: קֳדָשָׁיו
  choice: suas ofertas sagradas
  rationale: O plural de קֹדֶשׁ designa aqui coisas consagradas, isto é, ofertas separadas para uso sagrado. A expressão é clara e natural em português.
- source_word: לוֹ יִהְיוּ
  choice: lhe pertencerão
  rationale: A construção hebraica expressa posse. Esta formulação comunica o sentido com naturalidade, sem acrescentar a ideia mais específica de que permanecerão em sua posse.
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: tudo o que um homem der ao sacerdote
  rationale: A oração relativa tem alcance geral. “Tudo o que” expressa adequadamente essa força legal aberta, preservando o sacerdote no singular.
- source_word: לוֹ יִהְיֶה
  choice: pertencerá ao sacerdote
  rationale: O pronome hebraico significa literalmente “lhe”, e seu referente contextual é o sacerdote. A repetição explícita evita ambiguidade pronominal pouco natural em português.
theological_decisions:
- issue: Referente de לוֹ na primeira oração
  choice: entendido como o sacerdote, conforme esclarecido na nota
  alternative: entendido como o homem que apresenta as ofertas
  rationale: A sequência do versículo e o paralelo com a cláusula final favorecem o sacerdote como referente, embora a forma pronominal hebraica seja concisa e permita que a ambiguidade seja percebida; por isso, ela é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção jurídica natural. “Ofertas sagradas” comunica o sentido cultual de קֳדָשָׁיו; a nota preserva tanto a forma mais literal quanto a concisão pronominal do hebraico.
