id: NUM.5.25
reference: Numbers 5:25
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: pt
  text: Então o sacerdote pegará da mão da mulher a oferta de cereal por ciúmes, moverá a oferta de cereal diante de Yahweh e a levará para junto do altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw com qatal dá continuidade à sequência ritual prescrita; “Então” e o futuro expressam naturalmente o próximo passo do procedimento.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente para o oficiante do culto, mantendo o artigo definido.
- source_word: מִיַּד הָאִשָּׁה
  choice: da mão da mulher
  rationale: Preserva a imagem concreta do hebraico e indica que o sacerdote recebe diretamente dela a oferta.
- source_word: מִנְחַת הַקְּנָאֹת
  choice: a oferta de cereal por ciúmes
  rationale: “Oferta de cereal” comunica a categoria sacrificial de מִנְחָה; “por ciúmes” expressa de modo natural a relação com o ciúme que dá origem ao rito, sem reduzir a expressão a um nome genérico.
- source_word: וְהֵנִיף
  choice: moverá
  rationale: O hifil de נוף designa o movimento ritual da oferta. “Moverá” preserva a ação sem acrescentar uma direção não especificada no texto.
- source_word: הַמִּנְחָה
  choice: a oferta de cereal
  rationale: A repetição conserva a especificidade lexical e sacrificial de מִנְחָה.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Equivalente natural da expressão cultual, preservando a ideia de apresentação na presença divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente pelo Tetragrama, em conformidade com a decisão do projeto.
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: e a levará para junto do altar
  rationale: Expressa o sentido causativo de aproximar a oferta do altar, preservando a nuance cultual sem sugerir que ela já seja queimada nesse momento.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal e segue a orientação fornecida pelo projeto, sem substituí-lo por um título.
- issue: Sentido de מִנְחַת הַקְּנָאֹת
  choice: oferta de cereal por ciúmes
  alternative: oferta de cereal de ciúmes; oferta de ciúmes
  rationale: A formulação mantém a categoria sacrificial e liga a oferta à situação de ciúme do rito. Evita definir além do texto se os “ciúmes” são apenas a emoção do marido ou uma designação ritual mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a sequência ritual, repete “oferta de cereal” como no hebraico e mantém linguagem concreta. Não há notas de rodapé neste versículo.
