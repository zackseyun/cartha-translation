  text: וְ/קָמַ֨ץ הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/אַחַ֛ר יַשְׁקֶ֥ה אֶת הָ/אִשָּׁ֖ה אֶת הַ/מָּֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: pt
  text: Então o sacerdote tirará da oferta de cereal um punhado, a porção memorial dela, e o queimará no altar. Depois, fará a mulher beber a água[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a água amarga»; o contexto mais amplo identifica a água dessa forma, mas este versículo diz apenas «a água».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמַץ
  choice: pegará ... um punhado
  rationale: Em contexto sacrificial, קמץ designa o ato ritual de retirar um punhado da oferta. A forma verbal com waw expressa a sequência da instrução legal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente padrão e claro de כֹּהֵן em contexto cultual.
- source_word: מִן הַמִּנְחָה
  choice: da oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה refere-se especificamente à oferta composta de cereal, e não apenas a uma oferta genérica.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: a porção memorial dela
  rationale: אַזְכָּרָה é a porção da oferta queimada no altar como memorial; o sufixo feminino retoma a oferta de cereal.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: e o queimará no altar
  rationale: No uso sacrificial, הקטיר indica queimar a oferta, fazendo-a subir em fumaça. O pronome retoma o punhado entendido como porção memorial, e o he direcional em מִּזְבֵּחָה é expresso naturalmente por “no altar”.
- source_word: וְאַחַר
  choice: Depois
  rationale: Marca a etapa seguinte da sequência ritual de modo natural em português.
- source_word: יַשְׁקֶה
  choice: fará ... beber
  rationale: O hifil de שׁקה é causativo; “fará a mulher beber” preserva essa força sem enfraquecê-la para apenas “dará de beber”.
- source_word: אֶת הָאִשָּׁה
  choice: a mulher
  rationale: Tradução direta do objeto definido do verbo causativo.
- source_word: אֶת הַמָּיִם
  choice: a água
  rationale: O hebraico deste versículo diz somente “a água”; o qualificativo “amarga” pertence ao contexto mais amplo e não deve ser acrescentado ao texto principal.
theological_decisions:
- issue: Se a água deve ser especificada como “água amarga” com base no contexto do ritual
  choice: Manter apenas “a água”
  alternative: a água amarga
  rationale: O texto hebraico do versículo traz somente הַמָּיִם, “a água”. Acrescentar “amarga” importaria para este versículo uma qualificação presente no contexto, resolvendo além do que sua redação imediata afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a terminologia ritual “oferta de cereal” e “porção memorial”, preserva a força causativa de יַשְׁקֶה e não acrescenta qualificações ausentes do hebraico.
