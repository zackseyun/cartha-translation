  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: pt
  text: e um espírito de ciúme vier sobre ele, e ele tiver ciúme de sua mulher, e ela se tiver tornado impura; ou se um espírito de ciúme vier sobre ele, e ele tiver ciúme de sua mulher, e ela não se tiver tornado impura,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: vier sobre ele
  rationale: A expressão עבר על com רוּחַ descreve a irrupção de um impulso ou estado interior. «Vier sobre ele» é natural em português e conserva a imagem hebraica.
- source_word: רוּחַ קִנְאָה
  choice: um espírito de ciúme
  rationale: רוּחַ pode indicar espírito, vento ou disposição; neste contexto, designa um impulso que toma o marido. קִנְאָה refere-se aqui a ciúme, não a zelo.
- source_word: וְקִנֵּא
  choice: ele tiver ciúme
  rationale: O Piel de קנא expressa a reação ciumenta do marido. A formulação condicional harmoniza-se com a sintaxe legal do período e evita sugerir mais do que o texto afirma.
- source_word: אֶת אִשְׁתּוֹ
  choice: de sua mulher
  rationale: Com «ter ciúme», a regência idiomática portuguesa pede «de». «Mulher» mantém o sentido conjugal explícito no contexto.
- source_word: נִטְמָאָה
  choice: tiver se contaminado
  rationale: O verbo emprega linguagem de impureza aplicada, neste contexto, à possível infidelidade sexual. «Ter se contaminado» preserva a sobreposição moral e ritual sem tornar explícito além do hebraico o ato suspeitado.
- source_word: אוֹ
  choice: ou se
  rationale: A partícula apresenta o segundo caso alternativo da disposição legal; «ou se» explicita naturalmente essa relação em português.
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: mas ela não tiver se contaminado
  rationale: Embora וְ seja literalmente «e», o segundo cenário contrasta a suspeita do marido com a inocência da mulher; «mas» torna esse valor adversativo claro sem alterar o conteúdo.
theological_decisions:
- issue: Natureza da linguagem de impureza na lei sobre suspeita de adultério
  choice: tiver se contaminado
  alternative: tiver se tornado impura
  rationale: O contexto associa a impureza à possível infidelidade conjugal, mas o verbo hebraico continua sendo linguagem de impureza. «Ter se contaminado» preserva essa dimensão moral-ritual e evita reduzi-la a impureza meramente cerimonial.
- issue: Contraste entre suspeita e inocência
  choice: mas ela não tiver se contaminado
  alternative: e ela não tiver se contaminado
  rationale: O hebraico usa a conjunção comum וְ, que pode assumir valor adversativo pelo contexto. «Mas» comunica com naturalidade a alternativa em que o ciúme não corresponde a uma contaminação real.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe própria de uma disposição legal. A repetição do segundo cenário foi mantida por refletir deliberadamente a estrutura hebraica. Não foram necessárias notas de rodapé, pois as alternativas relevantes podem ser registradas nas decisões lexicais sem sobrecarregar o versículo.
