    issue: «mas ela não tiver se contaminado» para וְהִיא לֹא נִטְמָאָה
    rationale: Embora o contexto estabeleça contraste, a conjunção hebraica é o simples «e». O português pode conservar essa coordenação, deixando o contraste decorrer dos dois cenários legais, como no original.
  - severity: low
    issue: «ela tiver se contaminado» para נִטְמָאָה
    rationale: O nifal hebraico descreve o estado de tornar-se impura/ser contaminada, sem explicitar reflexivamente a ação da mulher. «Se tiver tornado impura» é mais próximo da voz e preserva melhor a amplitude da linguagem de impureza.
