  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: pt
  text: Então confessarão o pecado que cometeram, e ele restituirá integralmente o valor devido por sua culpa[a], acrescentando-lhe um quinto, e o entregará à pessoa a quem prejudicou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser traduzida como “restituirá integralmente a compensação por sua culpa” ou “pagará integralmente o que deve”. Neste contexto, refere-se ao montante principal da restituição, não a uma oferta sacrificial pela culpa.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “àquele em relação a quem incorreu em culpa”, isto é, à pessoa que sofreu o dano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Então confessarão
  rationale: O hitpael de ידה indica confessar ou reconhecer abertamente a transgressão. “Então” expressa a sequência do waw no contexto, e o futuro mantém o tom prescritivo.
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: o pecado que cometeram
  rationale: חַטָּאת designa aqui o pecado ou delito confessado; “cometer” é a combinação idiomática natural em português.
- source_word: וְהֵשִׁיב אֶת אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: ele restituirá integralmente o valor devido por sua culpa
  rationale: O hifil de שׁוב tem sentido de devolver ou restituir. אָשָׁם, neste contexto, indica a obrigação ou compensação decorrente da culpa, enquanto בְּרֹאשׁוֹ se refere ao montante principal, pago integralmente.
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: acrescentando-lhe um quinto
  rationale: A expressão determina o acréscimo de um quinto, isto é, vinte por cento, ao montante principal.
- source_word: וְנָתַן
  choice: e o entregará
  rationale: Traduz concretamente נתן e retoma o valor total da restituição, incluindo o acréscimo.
- source_word: לַאֲשֶׁר אָשַׁם לוֹ
  choice: à pessoa que prejudicou
  rationale: A formulação idiomática identifica claramente o destinatário como a pessoa contra quem se incorreu em culpa, sem reproduzir uma construção pouco natural em português.
theological_decisions:
- issue: Sentido de אָשָׁם no contexto da restituição
  choice: obrigação ou valor devido em consequência da culpa, não oferta sacrificial
  alternative: oferta pela culpa
  rationale: A menção ao montante principal, ao acréscimo de um quinto e à entrega à pessoa lesada mostra que o termo se refere aqui à responsabilidade reparatória. A nota preserva a amplitude lexical sem introduzir terminologia sacrificial inadequada ao ato descrito neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A alternância entre o plural “confessarão” e o singular “ele restituirá” foi preservada porque corresponde à mudança de número no hebraico e retoma o indivíduo culpado mencionado no contexto. A redação evita juridiquês excessivo, mas conserva o caráter legal e reparatório do versículo.
