source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: pt
  text: Ordene aos filhos de Israel que afastem do acampamento toda pessoa com uma doença de pele[a], toda pessoa que tenha um corrimento e toda pessoa impura por causa de um morto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma afecção de pele”. O termo hebraico, tradicionalmente traduzido por “lepra”, abrange afecções cutâneas nas leis de pureza e não indica necessariamente a hanseníase moderna.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “impura por uma pessoa”. Neste contexto, a expressão hebraica se refere à impureza ligada a uma pessoa morta, normalmente decorrente do contato com um cadáver.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Ordene
  rationale: O imperativo singular dirigido a Moisés tem força de ordem; “ordene” a preserva em português natural e digno.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma hebraica tradicional e a referência coletiva ao povo da aliança, sem substituir a expressão por uma designação interpretativa.
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: que mandem para fora do acampamento
  rationale: Expressa naturalmente o afastamento indicado por שלח e pela preposição מן, sem acrescentar uma conotação punitiva.
- source_word: כָּל צָרוּעַ
  choice: toda pessoa com uma doença de pele
  rationale: צרוע designa alguém afetado pela condição cutânea tratada nas leis de pureza e não corresponde necessariamente à hanseníase moderna.
- source_word: וְכָל זָב
  choice: toda pessoa que tenha um corrimento
  rationale: זב refere-se, neste contexto legal, a quem apresenta fluxo ou corrimento corporal; a formulação é clara sem especificar além do texto.
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: toda pessoa impura por causa de um morto
  rationale: A expressão idiomática indica impureza associada a uma pessoa morta. “Por causa de um morto” comunica a relação sem exigir que o contato, embora normalmente pressuposto no contexto legal, seja explicitado no corpo do versículo.
theological_decisions:
- issue: Terminologia da impureza ritual
  choice: impura
  alternative: contaminada; ritualmente impura
  rationale: “Impura” preserva o sentido cultual de טמא sem sugerir necessariamente culpa moral. Não se acrescenta “ritualmente” ao texto, pois o contexto legal já determina o sentido.
- issue: Natureza da afecção expressa por צרוע
  choice: doença de pele com nota explicativa
  alternative: lepra; pessoa leprosa
  rationale: A tradução evita identificar anacronicamente a categoria ritual hebraica com a hanseníase moderna, mas registra em nota a tradução tradicional.
- issue: Sentido de טמא לנפש
  choice: impura por causa de um morto
  alternative: impura por contato com um cadáver
  rationale: A opção preserva algo da concisão e da abrangência formal do idioma hebraico, enquanto a nota esclarece que se trata da impureza decorrente de um morto, normalmente por contato com o cadáver.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação foi suavizada sem perder a estrutura tríplice do hebraico. “Corrimento” é usado no sentido corporal próprio das leis de pureza. Todos os marcadores de nota aparecem no texto principal.
