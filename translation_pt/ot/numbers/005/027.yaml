  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: pt
  text: Quando ele a fizer beber a água, se ela tiver se contaminado e tiver sido infiel ao marido, a água que traz a maldição entrará nela para amargura[a]; seu ventre inchará, sua coxa definhará[b], e a mulher se tornará uma maldição no meio do seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a água que traz a maldição entrará nela como água amarga”. A expressão hebraica traduzida por “para amargura” é difícil e pode descrever o efeito ou a qualidade da água.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sua coxa cairá”. A expressão provavelmente é um eufemismo para uma grave aflição corporal que atinge os órgãos reprodutivos, mas o sentido exato é incerto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: Quando ele a fizer beber a água
  rationale: O hifil de שׁקה é causativo, “fazer beber”. A oração temporal conduz naturalmente, em português, à consequência condicional.
- source_word: נִטְמְאָה
  choice: tiver se contaminado
  rationale: O nifal pode indicar tornar-se impura ou contaminada. “Tiver se contaminado” preserva neste contexto as dimensões moral e ritual sem recorrer a linguagem técnica.
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: tiver sido infiel ao marido
  rationale: A construção cognata com מעל expressa grave quebra de fidelidade; “ser infiel” é natural e adequado à relação conjugal indicada por אִישָׁהּ.
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: a água que traz a maldição
  rationale: O particípio descreve a água como portadora ou agente da maldição; a formulação mantém essa força causal com clareza.
- source_word: לְמָרִים
  choice: para lhe causar amargura
  rationale: A expressão hebraica é difícil e parece indicar resultado ou efeito amargo. A formulação é inteligível sem definir precisamente a natureza desse efeito.
- source_word: וְצָבְתָה בִטְנָהּ
  choice: seu ventre inchará
  rationale: בטן designa ventre ou abdômen. “Ventre” é direto e digno, sem especificar indevidamente o útero.
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: sua coxa definhará
  rationale: Literalmente, a coxa “cairá”. Como a expressão provavelmente é eufemística, “definhará” comunica uma grave aflição corporal, enquanto “coxa” preserva a imagem hebraica e sua ambiguidade.
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה
  choice: a mulher se tornará objeto de maldição
  rationale: A mulher passa a servir como exemplo ou fórmula de maldição; “objeto de maldição” evita sugerir que ela própria se transforme literalmente numa maldição.
- source_word: בְּקֶרֶב עַמָּהּ
  choice: no meio do seu povo
  rationale: A expressão conserva a dimensão pública e comunitária do juízo.
theological_decisions:
- issue: Sentido exato da aflição corporal descrita pela fórmula da prova
  choice: seu ventre inchará, sua coxa definhará
  alternative: seu ventre inchará e seus órgãos reprodutivos definharão; ou seu útero abortará
  rationale: O hebraico apresenta linguagem concreta, mas parcialmente eufemística, cujo referente fisiológico exato é discutido. A tradução mantém os termos corporais do texto sem impor uma interpretação médica ou reprodutiva específica.
- issue: Função de לְמָרִים
  choice: para lhe causar amargura
  alternative: como água amarga; ou com efeito amargo
  rationale: A construção pode descrever a qualidade da água ou o efeito que ela produz. O texto principal expressa o provável resultado, e a nota preserva as demais possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavizada sem apagar a sequência condicional hebraica. As notas registram as ambiguidades lexicais reais, especialmente em לְמָרִים e na fórmula corporal וְנָפְלָה יְרֵכָהּ.
