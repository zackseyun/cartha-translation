  terminology: “Água que traz a maldição”, “ventre”, “coxa” e “infiel ao marido” são escolhas adequadas. “Tornar-se uma maldição” reproduz melhor לְאָלָה do que “tornar-se objeto de maldição”, sem exigir uma interpretação específica.
