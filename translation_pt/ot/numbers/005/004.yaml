  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: pt
  text: 'E os filhos de Israel fizeram assim[a]: mandaram-nos para fora do acampamento. Assim como Yahweh havia falado a Moisés, assim fizeram os filhos de Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Israel”; a expressão designa coletivamente os israelitas.'
    reason: Esclarecer que a expressão familiar hebraica tem sentido corporativo neste contexto.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram assim
  rationale: Reproduz de modo natural a expressão עשה + כן, indicando que cumpriram a ordem anterior.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar hebraica e sua repetição no versículo; no contexto, ela designa coletivamente o povo de Israel.
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: mandaram-nos
  rationale: Expressa diretamente o ato de enviar ou retirar as pessoas mencionadas; a frase seguinte esclarece que foram removidas do acampamento.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: Representa com clareza tanto o movimento para fora quanto a exclusão espacial indicada pela expressão hebraica.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: Assim como ... havia falado
  rationale: Mantém a comparação que destaca a conformidade exata com a ordem divina anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֵּן עָשׂוּ
  choice: assim fizeram
  rationale: Conserva a repetição conclusiva do hebraico, que enfatiza a obediência de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. A forma “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, embora “SENHOR” e “Jeová” sejam tradições conhecidas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das frases e a repetição final preservam a ênfase hebraica na obediência, sem produzir sintaxe excessivamente rígida.
