  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O wayyiqtol de דבר inicia uma nova unidade de discurso. “Falou” é a formulação natural e digna em português para a fala divina, preservando a distinção possível em relação ao verbo אמר que vem na fórmula seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “a” é idiomático na construção portuguesa “falar a alguém”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o conteúdo da fala a seguir, de maneira clara e natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. A forma “Yahweh” preserva o nome próprio e evita substituí-lo por um título; “Jeová” reflete uma vocalização híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da fórmula hebraica. Mantém-se “dizendo” porque o conteúdo da fala começa no versículo seguinte.
