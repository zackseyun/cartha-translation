base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: pt
  text: Então ele fará a mulher beber a água amarga que traz maldição[a], e a água que traz maldição entrará nela para amargura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a água de amargura que traz maldição». O hebraico emprega «águas» no plural, forma comum para se referir à água.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: Então ele fará ... beber
  rationale: 'O hifil de שׁקה tem sentido causativo: fazer alguém beber ou dar de beber. A formulação preserva essa força e soa natural em português.'
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: Tradução direta do substantivo definido.
- source_word: מֵי הַמָּרִים
  choice: a água amarga
  rationale: A construção significa literalmente «águas de amargura». Em português, o singular coletivo «água» é mais natural, e «amarga» preserva o sentido semântico.
- source_word: הַמְאָרֲרִים
  choice: que traz maldição
  rationale: O particípio derivado de ארר caracteriza a água por seu efeito mediador da maldição, não necessariamente como água que tenha sido amaldiçoada.
- source_word: וּבָאוּ בָהּ
  choice: entrará nela
  rationale: בוא com ב indica entrada no corpo da mulher. O plural hebraico concorda com «águas», mas o singular português concorda naturalmente com «água».
- source_word: לְמָרִים
  choice: para causar amargura
  rationale: O ל pode exprimir resultado ou efeito. Esta formulação preserva a ideia de amargura ou dano resultante sem especificar uma fisiologia além do texto.
theological_decisions:
- issue: Natureza da linguagem de maldição no ritual
  choice: Descrever a água como aquela «que traz maldição»
  alternative: «água amaldiçoada»
  rationale: O particípio hebraico pode indicar o papel da água em trazer ou efetivar a maldição. Esta escolha preserva a força judicial e ritual sem sugerir que a água seja intrinsecamente mágica.
- issue: Sentido de לְמָרִים
  choice: «para causar amargura»
  alternative: «amargamente» ou «para amargura»
  rationale: A expressão hebraica é compacta e pode indicar resultado. A tradução mantém a ambiguidade quanto à natureza exata do efeito, mas comunica em português que a entrada da água resulta em amargura ou aflição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de «água que traz maldição» acompanha a repetição enfática do hebraico; evitou-se «água amaldiçoada» para não resolver indevidamente a função do particípio.
