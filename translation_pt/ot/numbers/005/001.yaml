  yaml_path: translation/ot/numbers/005/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com דבר introduz um novo ato narrativo de fala. “Falou” é a forma natural e digna desta fórmula de comunicação divina em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino (YHWH), preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição assinala o destinatário da fala; em “falou a Moisés”, “a” é a construção portuguesa natural.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula hebraica que introduz a fala citada no versículo seguinte, os dois-pontos expressam de modo idiomático e conciso a função de לֵאמֹר, evitando o pouco natural “dizendo” antes de uma citação ainda não apresentada neste versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome divino e não o substitui pelo título tradicional “SENHOR”; a nota informa as convenções alternativas.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. A fórmula introdutória foi vertida de maneira idiomática; os dois-pontos sinalizam que a fala prossegue no versículo seguinte.
