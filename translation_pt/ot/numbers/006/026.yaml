  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: pt
  text: Que Yahweh levante o rosto em sua direção e lhe dê paz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida como “paz” (shalom) também pode transmitir a ideia de integridade ou bem-estar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: levante
  rationale: O verbo נָשָׂא significa literalmente “levantar, erguer, carregar”. Com “rosto” como objeto, a expressão comunica atenção favorável; “levante” preserva a imagem hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: פָּנָיו
  choice: o seu rosto
  rationale: Mantém a imagem concreta do hebraico פָּנִים, evitando tanto o arcaísmo “semblante” quanto a interpretação abstrata “favor”.
- source_word: אֵלֶיךָ
  choice: para você
  rationale: A preposição אֶל expressa direção. “Para você” é natural em português e conserva esse sentido direcional.
- source_word: וְיָשֵׂם
  choice: e lhe dê
  rationale: Embora שׂים signifique literalmente “pôr” ou “colocar”, na expressão “pôr paz para alguém” o português idiomático pede “dar paz”.
- source_word: לְךָ
  choice: lhe
  rationale: Representa de modo natural o beneficiário ou objeto indireto indicado pela preposição לְ.
- source_word: שָׁלוֹם
  choice: paz
  rationale: “Paz” é a equivalência tradicional e adequada à fórmula de bênção, enquanto uma nota registra a amplitude de שָׁלוֹם, que inclui integridade e bem-estar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Preservação da expressão antropomórfica “levantar o rosto”
  choice: Manter “levante o seu rosto para você”
  alternative: mostre favor a você; olhe para você com favor
  rationale: A formulação conserva a imagem corporal e a textura poética do hebraico, sem ocultar sua conotação de atenção favorável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O subjuntivo optativo “Que ...” expressa naturalmente a bênção; “você” torna explícito o destinatário singular masculino do hebraico sem introduzir solenidade arcaica.
