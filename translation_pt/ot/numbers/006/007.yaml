source:
  edition: WLC
  text: לְ/אָבִ֣י/ו וּ/לְ/אִמּ֗/וֹ לְ/אָחִי/ו֙ וּ/לְ/אַ֣חֹת֔/וֹ לֹא יִטַּמָּ֥א לָ/הֶ֖ם בְּ/מֹתָ֑/ם כִּ֛י נֵ֥זֶר אֱלֹהָ֖י/ו עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: pt
  text: Nem mesmo por seu pai ou por sua mãe, por seu irmão ou por sua irmã, ele não se tornará impuro por causa deles quando morrerem[a], pois a consagração[b] do seu Deus está sobre a sua cabeça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa deles por ocasião da morte deles”.'
    reason: Alternativa que preserva mais de perto a forma nominal do hebraico.
  - marker: b
    text: Hebraico nezer; no contexto do nazireado, designa a condição ou o sinal de consagração e separação para Deus, simbolizado pelo cabelo sobre a cabeça.
    reason: Nota lexical e cultural necessária para explicitar a amplitude do termo hebraico.
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: Nem mesmo por seu pai ou por sua mãe, por seu irmão ou por sua irmã
  rationale: A colocação inicial preserva a ênfase das expressões hebraicas antepostas. “Nem mesmo” comunica naturalmente que a proibição inclui os parentes mais próximos.
- source_word: לֹא יִטַּמָּא
  choice: ele se tornará impuro
  rationale: A forma reflexiva indica que o nazireu não deve incorrer em impureza ritual. “Tornar-se impuro” evita a conotação predominantemente moral que “profanar-se” ou “corromper-se” poderia sugerir.
- source_word: לָהֶם בְּמֹתָם
  choice: por causa deles quando morrerem
  rationale: A expressão identifica os parentes falecidos como a ocasião da impureza. A formulação é clara em português e mantém a referência pronominal plural.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo natural e explícito a razão da proibição.
- source_word: נֵזֶר
  choice: consagração
  rationale: No contexto do nazireado, o termo designa a condição ou sinal de separação e dedicação a Deus, visivelmente associado ao cabelo, e não apenas uma coroa física.
- source_word: אֱלֹהָיו
  choice: do seu Deus
  rationale: Preserva o sufixo possessivo explícito e a força pessoal da expressão hebraica.
- source_word: עַל רֹאשׁוֹ
  choice: está sobre a sua cabeça
  rationale: Mantém a imagem concreta do hebraico e sua provável alusão ao cabelo do nazireu como sinal visível de consagração.
theological_decisions:
- issue: Natureza da impureza na legislação do nazireado
  choice: Expressar a proibição como aquisição de impureza ritual
  alternative: Empregar linguagem moralmente carregada, como “profanar-se”, sem esclarecimento
  rationale: O contexto trata da impureza cultual causada pelo contato com a morte. A tradução não deve acrescentar uma afirmação de culpa moral que o versículo não faz.
- issue: Sentido de נֵזֶר no contexto nazireu
  choice: consagração
  alternative: coroa ou cabelo
  rationale: O termo abrange a condição e o sinal da dedicação a Deus. Traduzir apenas como “coroa” ou “cabelo” estreitaria indevidamente o sentido, enquanto a nota conserva a imagem cultural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe inicial enfática acompanha a ordem do hebraico sem soar excessivamente literal; a terminologia evita confundir impureza ritual com culpa moral.
