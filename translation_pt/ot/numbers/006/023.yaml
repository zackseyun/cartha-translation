  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר כֹּ֥ה תְבָרֲכ֖וּ אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: pt
  text: 'Fale a Arão e a seus filhos: “Assim vocês abençoarão os filhos de Israel[a]. Digam-lhes:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “os israelitas” ou “o povo de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Fale a
  rationale: O imperativo piel masculino singular dirige a Moisés uma ordem direta; “Fale a” é natural e preserva a fórmula de instrução.
- source_word: וְאֶל בָּנָיו
  choice: e a seus filhos
  rationale: No contexto sacerdotal, בָּנָיו se refere aos filhos homens de Arão, não genericamente a seus descendentes ou filhos de ambos os sexos.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo hebraico é representado naturalmente pelos dois-pontos em português, evitando o pouco idiomático “dizendo” sem perder sua função discursiva.
- source_word: כֹּה תְבָרֲכוּ
  choice: Assim vocês abençoarão
  rationale: “Assim” introduz a fórmula prescrita, e o futuro do presente comunica a força diretiva do imperfeito hebraico sem intensificá-la indevidamente.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma familiar e pactual da expressão hebraica, embora ela também funcione como designação convencional de todo o povo de Israel.
- source_word: אָמֹר לָהֶם
  choice: Digam-lhes
  rationale: O infinitivo absoluto usado imperativamente introduz as palavras exatas da bênção; o plural corresponde a Arão e seus filhos como agentes da fala.
theological_decisions:
- issue: Expressão pactual בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução mantém a imagem genealógica do hebraico e sua nuance pactual, enquanto a nota esclarece o sentido nacional inclusivo sem restringir a bênção apenas aos homens.
- issue: Caráter prescritivo da bênção sacerdotal
  choice: Assim vocês abençoarão
  alternative: É assim que vocês devem abençoar
  rationale: A formulação conserva o tom litúrgico e autoritativo da instrução, sem tornar explícita uma modalidade mais forte do que a forma hebraica exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para marcar claramente o plural dirigido a Arão e seus filhos; mantém “filhos de Israel” no texto por fidelidade à expressão hebraica, com alternativa idiomática em nota.
