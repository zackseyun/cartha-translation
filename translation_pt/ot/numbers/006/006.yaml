  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: pt
  text: Durante todos os dias de sua consagração ao SENHOR[a], não se aproximará de cadáver algum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua separação” ou “seu voto de nazireu”. O termo hebraico se refere ao estado ou período em que alguém está separado como nazireu.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma nefesh morta”; isto é, uma pessoa morta ou um cadáver humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Durante todos os dias
  rationale: Expressa naturalmente em português a duração completa do período indicado pelo hebraico.
- source_word: הַזִּירוֹ
  choice: sua consagração
  rationale: O termo da raiz נזר designa aqui o estado ou período em que o nazireu está separado; “consagração” comunica essa dedicação sem acrescentar explicitamente “voto” ao texto.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: A preposição indica dedicação ao YHWH; “ao SENHOR” conserva esse sentido dedicatório e segue a convenção portuguesa tradicional para o nome divino.
- source_word: עַל נֶפֶשׁ מֵת
  choice: de nenhum morto
  rationale: A expressão hebraica significa literalmente “uma nefesh morta”, mas, no contexto das leis de pureza, refere-se a uma pessoa morta, isto é, a um cadáver humano.
- source_word: לֹא יָבֹא
  choice: não se aproximará
  rationale: O imperfeito negado tem força proibitiva em instrução legal; a forma reflexiva é natural e clara em português.
theological_decisions:
- issue: Terminologia do nazireado sem especificar em excesso o substantivo
  choice: sua consagração
  alternative: sua separação; seu voto de nazireu
  rationale: “Consagração” preserva a ideia de dedicação e separação própria do nazireado, ao passo que “voto” explicitaria algo que não está lexicalmente presente neste substantivo.
- issue: Representação de יהוה
  choice: SENHOR
  alternative: Yahweh; Javé
  rationale: A forma em versaletes, aqui representada por maiúsculas, segue a convenção reverente e amplamente reconhecida em traduções bíblicas portuguesas.
- issue: Sentido de נֶפֶשׁ מֵת
  choice: nenhum morto
  alternative: um cadáver; uma pessoa morta
  rationale: O contexto exige referência a um cadáver humano; a formulação escolhida mantém linguagem digna e natural sem interpretar נֶפֶשׁ como “alma”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação legal conserva a força proibitiva do hebraico, e as notas preservam as alternativas lexicais relevantes.
