base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como «SENHOR». Outras formas incluem «Yahweh» e «Jeová».'
    reason: Registra a forma hebraica e as principais tradições de tradução do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O wayyiqtol faz a narrativa avançar; «E» preserva a ligação com o contexto anterior, e «falou» introduz naturalmente uma fala divina formal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; «falar a alguém» é uma construção natural e digna em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo hebraico anuncia o conteúdo que vem a seguir. Em português atual, os dois-pontos expressam essa função com naturalidade, evitando o pouco idiomático «dizendo» no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal e evita substituí-lo silenciosamente por um título, sem negar as formas tradicionais alternativas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação inicial foi preservada; a fórmula לֵאמֹר foi vertida funcionalmente por dois-pontos.
