  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: pt
  text: Então o nazireu raspará a cabeça consagrada à entrada da tenda do encontro e pegará o cabelo de sua cabeça consagrada, colocando-o sobre o fogo que está debaixo do sacrifício de comunhão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifício pacífico” ou “sacrifício de bem-estar”.
    reason: Alternativas lexicais legítimas para o termo ritual hebraico שְׁלָמִים.
lexical_decisions:
- source_word: נָּזִיר
  choice: nazireu
  rationale: Termo técnico tradicional em português para a pessoa submetida ao voto específico descrito neste capítulo; evita reduzi-lo genericamente a alguém consagrado.
- source_word: גִלַּח
  choice: raspará
  rationale: Expressa diretamente a remoção do cabelo e mantém o caráter prescritivo da sequência ritual.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Reproduz o local do rito de modo claro e corrente; 'tenda do encontro' comunica a função de מוֹעֵד sem recorrer a vocabulário arcaico.
- source_word: רֹאשׁ נִזְרוֹ
  choice: a cabeça de sua consagração
  rationale: Preserva a construção incomum do hebraico e a ligação entre a cabeça, o cabelo e o estado de dedicação do nazireu, sem explicá-la como se o substantivo significasse simplesmente 'voto'.
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: o cabelo da cabeça de sua consagração
  rationale: Mantém a repetição deliberada da expressão hebraica e a associação ritual do cabelo com a consagração.
- source_word: נִזְרוֹ
  choice: sua consagração
  rationale: Neste contexto, designa a dedicação ou separação especial do nazireu; 'consagração' transmite naturalmente seu caráter sagrado.
- source_word: הָאֵשׁ
  choice: o fogo
  rationale: Equivalente direto e não figurado no contexto ritual.
- source_word: תַּחַת
  choice: debaixo de
  rationale: Mantém o sentido espacial concreto da preposição.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: sacrifício de comunhão
  rationale: Designa de maneira compreensível a categoria sacrificial de שְׁלָמִים, sem limitar o termo à ideia abstrata de paz; outras traduções plausíveis são registradas em nota.
theological_decisions:
- issue: Tradução do termo sacrificial שְׁלָמִים
  choice: sacrifício de comunhão
  alternative: sacrifício pacífico; sacrifício de bem-estar
  rationale: A expressão nomeia uma categoria ritual, não uma formulação doutrinária. 'Comunhão' é clara no português bíblico moderno, mas não esgota as ideias de paz, integridade e bem-estar associadas ao termo; por isso, as alternativas permanecem explícitas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se 'nazireu' como termo ritual estabelecido e a expressão marcada 'cabeça de sua consagração' para não apagar a formulação e a tensão semântica do hebraico.
