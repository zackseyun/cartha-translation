  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: pt
  text: Durante todo o período de seu voto de nazireu, não comerá nenhum produto da videira, das sementes à casca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “das sementes até a casca”, uma forma de incluir todas as partes da uva.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי נִזְרוֹ
  choice: Durante todo o período de seu voto de nazireu
  rationale: A expressão abrange toda a duração do estado de consagração nazireia. “Voto de nazireu” explicita naturalmente a instituição em vista no contexto, sem reduzir נֵזֶר a uma separação genérica.
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: nenhum produto
  rationale: A construção hebraica designa tudo o que é feito ou produzido, enquanto a negação posterior estabelece a proibição. “Nenhum produto” comunica isso com clareza e concisão em português.
- source_word: מִגֶּפֶן הַיַּיִן
  choice: da videira
  rationale: Literalmente, “da videira do vinho”; “videira” é o equivalente idiomático claro para a planta que produz uvas.
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: das sementes à casca
  rationale: A expressão indica os extremos e, assim, inclui todas as partes da uva. “Sementes” e “casca” refletem os sentidos mais prováveis dos termos hebraicos e mantêm a figura abrangente.
- source_word: לֹא יֹאכֵל
  choice: não comerá
  rationale: O imperfeito negado em contexto legal tem força proibitiva. O futuro simples preserva o tom normativo com linguagem bíblica corrente e compreensível.
