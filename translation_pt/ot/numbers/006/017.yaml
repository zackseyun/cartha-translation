revisions:
- from: Ele oferecerá o carneiro como sacrifício de paz[a] a Yahweh, junto com o cesto de pães sem fermento; e o sacerdote oferecerá a oferta de cereal e a oferta derramada que acompanham o sacrifício.
  to: Ele oferecerá o carneiro como sacrifício de paz[a] a Yahweh, junto com o cesto de pães sem fermento; e o sacerdote oferecerá as respectivas ofertas de cereal e de bebida.
  rationale: A revisão substitui «oferta derramada» por «oferta de bebida», o equivalente terminológico claro de נֶסֶךְ, e elimina a oração explicativa não expressa no hebraico. «As respectivas ofertas de cereal e de bebida» preserva a ligação indicada pelos sufixos com o carneiro/sacrifício, evitando a ambiguidade de «suas» em português. A nota foi harmonizada com o singular da tradução e com a forma plural do termo hebraico.
