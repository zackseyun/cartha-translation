  naturalness: «Oferta de bebida» é claro, corrente em português bíblico e mais natural que «oferta derramada». A formulação «as respectivas ofertas» conserva a vinculação das ofertas ao carneiro/sacrifício sem sugerir que pertencem ao sacerdote.
  terminology: «Sacrifício de paz» é uma designação estabelecida e adequada para זֶבַח שְׁלָמִים. A nota deve corresponder ao singular usado no texto, embora possa indicar que o hebraico tem forma plural. «Oferta de cereal» e «oferta de bebida» representam adequadamente מִנְחָה e נֶסֶךְ.
  issues:
  - severity: medium
    issue: «Oferta derramada» para נִסְכּוֹ
    rationale: O termo hebraico designa a oferta líquida acompanhante, normalmente chamada «oferta de bebida» em português. «Derramada» focaliza o gesto ritual e não nomeia com precisão a categoria da oferta.
  - severity: low
    issue: Explicitação por «que acompanham o sacrifício»
    rationale: O hebraico usa sufixos possessivos singulares («sua oferta de cereal e sua oferta de bebida»), sem a oração relativa explicativa. A expansão é dispensável e torna a tradução menos direta.
  - severity: low
    issue: Incongruência de número na nota
    rationale: O texto traduz «sacrifício de paz» no singular, mas a nota apresenta apenas alternativas no plural. A nota pode registrar a forma plural hebraica sem deixar de oferecer alternativas que correspondam à redação portuguesa.
