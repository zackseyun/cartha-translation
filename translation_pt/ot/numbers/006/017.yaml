  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: pt
  text: Ele oferecerá o carneiro como sacrifício de paz[a] a Yahweh, junto com o cesto de pães sem fermento; e o sacerdote oferecerá as respectivas ofertas de cereal e de bebida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sacrifício de comunhão». O hebraico שְׁלָמִים, de forma plural, também pode ser traduzido como «ofertas de paz» ou «ofertas de comunhão».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: o carneiro
  rationale: Em contexto sacrificial, אַיִל designa especificamente um carneiro adulto; esta é a equivalência portuguesa natural e precisa.
- source_word: יַעֲשֶׂה
  choice: oferecerá
  rationale: Embora עשה tenha o sentido geral de “fazer”, neste contexto ritual indica a realização da oferta sacrificial; “oferecerá” expressa isso com clareza.
- source_word: זֶבַח שְׁלָמִים
  choice: sacrifício de paz
  rationale: A expressão preserva זֶבַח como “sacrifício” e mantém a designação tradicional da categoria שְׁלָמִים. A alternativa “sacrifício de comunhão” é registrada em nota para não eliminar a amplitude semântica do termo.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário ou a dedicação do sacrifício, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: עַל סַל הַמַּצּוֹת
  choice: junto com o cesto de pães sem fermento
  rationale: Neste contexto, עַל indica acompanhamento ritual, não apenas posição espacial. “Pães sem fermento” é uma forma clara e corrente de expressar מַצּוֹת.
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: e o sacerdote oferecerá
  rationale: O segundo uso de עשה também se refere à execução ritual das ofertas associadas; “oferecerá” mantém clareza e coerência.
- source_word: מִנְחָתוֹ
  choice: a oferta de cereal que acompanha o sacrifício
  rationale: Em textos sacerdotais, מִנְחָה designa normalmente a oferta de cereal. A formulação liga o sufixo masculino singular ao sacrifício sem criar, em português, a impressão de que a oferta pertence pessoalmente ao sacerdote.
- source_word: נִסְכּוֹ
  choice: a oferta derramada que acompanha o sacrifício
  rationale: נֶסֶךְ designa a oferta líquida derramada no rito. “Oferta derramada” é compreensível e conserva a ação ritual melhor do que um termo erudito como “libação”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o Tetragrama. “Yahweh” preserva o nome próprio da aliança em vez de substituí-lo por um título.
- issue: Sentido de שְׁלָמִים
  choice: sacrifício de paz
  alternative: sacrifício de comunhão
  rationale: “Paz” mantém a associação lexical tradicional do termo, enquanto “comunhão” ressalta a participação e a refeição compartilhada ligadas à oferta. Como o hebraico comporta ambas as ênfases, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A redação evita o possessivo ambíguo “sua” no final e explicita apenas o referente gramatical das ofertas associadas, sem acrescentar uma interpretação teológica.
