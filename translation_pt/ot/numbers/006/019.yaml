base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: pt
  text: Então o sacerdote pegará a espádua cozida do carneiro, um pão sem fermento do cesto e uma obreia sem fermento, e os colocará sobre as palmas das mãos do nazireu, depois de ele ter rapado o cabelo de sua consagração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “depois de ele ter rapado sua consagração”. Neste contexto, a expressão se refere ao cabelo que assinalava sua consagração como nazireu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw seguido de qatal, neste contexto de instruções rituais sequenciais, é expresso naturalmente como a próxima ação prescrita.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente para o oficiante do culto, preservando a determinação do hebraico.
- source_word: הַזְּרֹעַ בְּשֵׁלָה
  choice: a espádua cozida
  rationale: זְרוֹעַ designa aqui a porção dianteira do animal, e בְּשֵׁלָה indica que foi cozida; “espádua” é um termo preciso para esse corte.
- source_word: מִן הָאַיִל
  choice: do carneiro
  rationale: Expressa de modo natural a procedência da porção retirada do animal.
- source_word: חַלַּת מַצָּה אַחַת
  choice: um pão sem fermento
  rationale: חַלָּה é um pão ou bolo de pão; a formulação escolhida é clara em português atual e preserva a ausência de fermento indicada por מַצָּה.
- source_word: מִן הַסַּל
  choice: do cesto
  rationale: Tradução direta e natural da expressão de procedência.
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: e uma obreia sem fermento
  rationale: רָקִיק designa um pão fino; “obreia” comunica uma lâmina fina de massa assada e mantém a distinção em relação ao pão anterior.
- source_word: וְנָתַן עַל כַּפֵּי
  choice: e os colocará sobre as palmas das mãos
  rationale: O verbo é vertido no mesmo encadeamento prescritivo, enquanto כַּפֵּי preserva a imagem específica das palmas, não apenas das mãos em geral. O pronome plural explicita naturalmente os três itens.
- source_word: הַנָּזִיר
  choice: o nazireu
  rationale: Termo português tradicional e conciso para a pessoa submetida ao voto nazireu.
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: depois de ele rapar
  rationale: A construção com infinitivo e sufixo é expressa por uma oração temporal; o infinitivo composto indica que a ação está concluída antes da colocação das ofertas nas mãos.
- source_word: אֶת נִזְרוֹ
  choice: o cabelo da sua consagração
  rationale: נֵזֶר significa literalmente consagração ou sinal de consagração; no rito nazireu, refere-se concretamente ao cabelo que a representa. A formulação mantém tanto o elemento físico quanto o sentido ritual.
theological_decisions:
- issue: Sentido concreto de נִזְרוֹ no rito nazireu
  choice: o cabelo da sua consagração
  alternative: a sua consagração; a sua cabeça consagrada
  rationale: O hebraico emprega literalmente o termo ligado à consagração, mas o objeto rapado no contexto é o cabelo. A tradução conserva a ligação entre o cabelo e a consagração sem transformar o termo em uma afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia ritual clara. “Nazireu” preserva o termo bíblico estabelecido; “espádua” e “obreia” mantêm a precisão dos objetos rituais sem recorrer a paráfrases extensas.
