- from: Então o sacerdote pegará a espádua cozida do carneiro, um pão sem fermento do cesto e uma obreia sem fermento, e os colocará sobre as palmas das mãos do nazireu, depois de ele rapar o cabelo da sua consagração.[a]
  to: Então o sacerdote pegará a espádua cozida do carneiro, um pão sem fermento do cesto e uma obreia sem fermento, e os colocará sobre as palmas das mãos do nazireu, depois de ele ter rapado o cabelo de sua consagração.[a]
  rationale: A revisão limita-se a explicitar, por meio do infinitivo composto, que o ato de raspar já ocorreu antes de os itens serem postos nas mãos do nazireu. Mantêm-se as escolhas lexicais e a nota que registra a expressão literal hebraica e sua referência ritual contextual.
