  text: And on the eighth day he shall bring two turtledoves or two young pigeons to the priest[a], to the entrance of the tent of meeting.
translation:
  language: pt
  text: No oitavo dia, levará ao sacerdote duas rolas ou dois pombinhos[a], à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dois filhotes de pomba»; a expressão hebraica diz literalmente «dois filhos de pomba», um modo idiomático de se referir a pombos ou pombas jovens.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: No oitavo dia
  rationale: Expressa de modo natural em português a sequência temporal marcada pela conjunção e pela preposição hebraicas; a ausência de «E» evita uma ligação pesada sem perder o sentido sequencial no contexto.
- source_word: יָבִא
  choice: levará
  rationale: O imperfeito hifil de בוא tem aqui força prescritiva. O futuro do indicativo é uma forma corrente e digna de exprimir instrução legal em português.
- source_word: שְׁתֵּי תֹרִים
  choice: duas rolas
  rationale: תֹרִים designa especificamente rolas, termo tradicional e ainda claro em português para essas aves.
- source_word: אוֹ
  choice: ou
  rationale: Mantém diretamente a alternativa permitida pelo texto.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dois pombinhos
  rationale: A expressão hebraica, literalmente «dois filhos de pomba», é um idiomatismo para aves jovens; «pombinhos» comunica isso com naturalidade e concisão.
- source_word: אֶל הַ/כֹּהֵן
  choice: ao sacerdote
  rationale: Traduz diretamente o destinatário a quem as aves devem ser levadas.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: «Entrada» traduz פֶּתַח com clareza, e «tenda do encontro» preserva o sentido de אֹהֶל מוֹעֵד sem substituir o termo por uma designação interpretativa.
