id: NUM.6.20
reference: Numbers 6:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: pt
  text: O sacerdote os moverá como oferta movida diante de Yahweh. Essa é uma porção santa destinada ao sacerdote, além do peito da oferta movida e da coxa da oferta de contribuição[a]. Depois disso, o nazireu poderá beber vinho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a coxa da oferta alçada”. “Oferta alçada” é a expressão tradicional para תְּרוּמָה; “oferta de contribuição” comunica com mais clareza atual a ideia de uma porção separada e apresentada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “o nazireu beberá vinho”. No contexto, a forma hebraica indica que ele volta a ter permissão para beber depois de concluir o voto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: os moverá como oferta movida
  rationale: Preserva a construção cognata hebraica e o termo sacrificial tradicional, indicando o gesto ritual de apresentação diante de Yahweh.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Traduz diretamente a expressão cultual e conserva o nome divino pessoal representado pelo Tetragrama.
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: Essa é uma porção santa destinada ao sacerdote
  rationale: Expressa em português natural o singular hebraico e esclarece que a porção apresentada é consagrada para o sacerdote, sem alterar sua função legal.
- source_word: עַל
  choice: além de
  rationale: Neste contexto distributivo, indica acréscimo às porções sacerdotais já estabelecidas, e não posição física.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: o peito da oferta movida
  rationale: Mantém a designação técnica da porção sacrificial e a ligação lexical com תְּנוּפָה.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: a coxa da oferta de contribuição
  rationale: ‘Coxa’ representa a parte superior da perna, enquanto ‘oferta de contribuição’ comunica com clareza moderna uma porção separada e apresentada.
- source_word: וְאַחַר יִשְׁתֶּה
  choice: Depois disso ... poderá beber
  rationale: Marca a sequência temporal e comunica a restauração da permissão após a conclusão do rito, sem transformar o ato de beber em obrigação.
- source_word: הַנָּזִיר
  choice: o nazireu
  rationale: É o termo bíblico consagrado em português para a pessoa submetida ao voto descrito em Números 6.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; ‘Yahweh’ preserva o nome pactual sem substituí-lo por um título.
- issue: Força modal de יִשְׁתֶּה
  choice: poderá beber vinho
  alternative: beberá vinho
  rationale: No contexto, a proibição do vinho termina com o rito. A formulação permissiva comunica esse sentido jurídico, enquanto a alternativa mais literal permanece registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a terminologia cultual reconhecível (‘oferta movida’, ‘nazireu’), mas esclarece expressões potencialmente opacas. Os marcadores de nota foram posicionados junto às expressões às quais suas notas efetivamente se referem.
