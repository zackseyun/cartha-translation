base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: pt
  text: E, se alguém morrer de repente[a] junto dele e contaminar a cabeça consagrada dele[b], o nazireu raspará a cabeça no dia de sua purificação; no sétimo dia raspará a cabeça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega uma expressão enfática, literalmente algo como “de súbito, inesperadamente”, indicando uma morte abrupta e imprevista na presença imediata do nazireu.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a cabeça da sua consagração”. A expressão liga a cabeça, especialmente o cabelo não cortado, à consagração do nazireu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Introduz uma situação condicional dentro da legislação do nazireado e conserva tanto a ligação com o contexto quanto o valor condicional.
- source_word: יָמוּת מֵת
  choice: alguém morrer
  rationale: A construção cognata hebraica, literalmente algo como “um morto morrer”, é uma expressão idiomática para a morte de uma pessoa.
- source_word: עָלָיו
  choice: junto dele
  rationale: No contexto da impureza causada por um cadáver, indica proximidade imediata ao nazireu, sem exigir a ideia de contato físico expressa por “sobre ele”.
- source_word: בְּפֶתַע פִּתְאֹם
  choice: de repente
  rationale: A combinação intensifica a ideia de uma morte abrupta e inesperada; a formulação portuguesa é concisa e natural.
- source_word: וְטִמֵּא
  choice: e contaminar
  rationale: Mantém a forma transitiva e a sequência do hebraico. O sujeito gramatical pode ser entendido em ligação com a pessoa que morre, enquanto o sentido ritual é que a morte inesperada torna impura a consagração representada pela cabeça do nazireu.
- source_word: רֹאשׁ נִזְרוֹ
  choice: sua cabeça consagrada
  rationale: Expressa em português natural a ligação entre a cabeça, especialmente o cabelo não cortado, e a consagração do nazireu, sem reduzir נזר apenas ao voto.
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: ele raspará a cabeça
  rationale: Apresenta com clareza a ação ritual exigida após a contaminação.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: no dia da sua purificação
  rationale: Refere-se à purificação ritual após a impureza; “purificação” conserva o sentido cultual e permanece compreensível.
- source_word: בַּיּוֹם הַשְּׁבִיעִי יְגַלְּחֶנּוּ
  choice: no sétimo dia, deverá raspá-la
  rationale: Identifica o momento da raspagem e faz o pronome retomar naturalmente “a cabeça” em português.
theological_decisions:
- issue: Natureza da contaminação do nazireu
  choice: Traduzir נזר em termos de consagração ritual e apresentar a cabeça como contaminada pela morte ocorrida junto ao nazireu.
  alternative: “a cabeça da sua separação” ou “a cabeça do seu voto”
  rationale: O contexto trata da impureza ritual que interrompe a consagração nazireia. “Cabeça consagrada” preserva a função cultual do cabelo sem importar categorias teológicas posteriores nem identificar נזר exclusivamente com o voto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário ritual amplamente compreensível. A construção conserva a sequência jurídica do hebraico e evita explicitar além do texto a mecânica da contaminação.
