  yaml_path: translation/ot/numbers/006/015.yaml
  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: pt
  text: 'e um cesto de pães sem fermento: bolos de farinha fina, misturados com azeite, e bolachas sem fermento, untadas com azeite, além da sua oferta de cereal e das suas ofertas de bebida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַל
  choice: cesto
  rationale: Designa o recipiente que contém os produtos sem fermento; “cesto” é claro e natural.
- source_word: מַצּוֹת
  choice: pães sem fermento
  rationale: O termo abrange produtos de pão sem fermento. A expressão genérica introduz as duas formas especificadas em seguida.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo sacrificial usual para farinha finamente moída.
- source_word: חַלֹּת
  choice: bolos
  rationale: No contexto das ofertas, refere-se a peças de pão moldadas, não necessariamente a pães grandes.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: misturada com azeite
  rationale: Indica que a farinha dos bolos foi combinada com azeite; a concordância no singular liga naturalmente a descrição à farinha.
- source_word: רְקִיקֵי מַצּוֹת
  choice: lâminas sem fermento
  rationale: רְקִיקִים designa peças finas e achatadas. “Lâminas” comunica a forma sem sugerir os biscoitos doces que “bolachas” pode evocar.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: ungidas com azeite
  rationale: Preserva o sentido usual do verbo משׁח e, neste contexto culinário-ritual, descreve a aplicação de azeite às lâminas.
- source_word: מִנְחָתָם
  choice: a oferta de cereal que os acompanha
  rationale: מִנְחָה, na legislação sacrificial, designa a oferta de cereal. O sufixo plural é explicitado naturalmente como relação de acompanhamento.
- source_word: נִסְכֵּיהֶם
  choice: as ofertas derramadas que os acompanham
  rationale: O substantivo designa ofertas líquidas vertidas. “Ofertas derramadas” é transparente e evita o registro menos acessível de “libações”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com preferência por “azeite” no contexto ritual. A formulação explicita de modo natural que a oferta de cereal e as ofertas derramadas acompanham os sacrifícios mencionados no contexto, sem tentar resolver além disso o referente plural dos sufixos hebraicos.
