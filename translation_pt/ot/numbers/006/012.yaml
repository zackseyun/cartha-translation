id: NUM.6.12
reference: Numbers 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: pt
  text: Ele consagrará novamente ao SENHOR os dias do seu voto de nazireu[a] e trará um cordeiro de um ano como oferta pela culpa. Mas os dias anteriores não contarão[b], porque seu voto de nazireu foi contaminado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os dias da sua separação» ou «os dias da sua consagração».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «os primeiros dias cairão»; isto é, os dias anteriores do voto deixam de ser contados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזִּיר
  choice: consagrará novamente
  rationale: O hifil de נזר, neste contexto, indica que a pessoa recomeça seu período de separação consagrada após a interrupção; «novamente» explicita essa retomada.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a forma tradicional portuguesa para o nome divino יהוה, em versaletes.
- source_word: יְמֵי נִזְרוֹ
  choice: os dias do seu voto de nazireu
  rationale: Identifica com clareza o período legal e ritual do nazireado, preservando em nota os sentidos lexicais mais amplos.
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: um cordeiro de um ano
  rationale: Expressa naturalmente o animal e a idade especificados pelo idioma hebraico.
- source_word: לְאָשָׁם
  choice: como oferta pela culpa
  rationale: Mantém a categoria sacrificial אָשָׁם em linguagem bíblica portuguesa corrente.
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: Mas os dias anteriores não contarão
  rationale: 'Traduz o efeito jurídico da expressão literalmente equivalente a «os primeiros dias cairão»: o período anterior deixa de ser computado.'
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: porque seu voto de nazireu foi contaminado
  rationale: Preserva a noção ritual de contaminação e mantém a referência técnica ao nazireado.
theological_decisions:
- issue: Sentido de נזר no regulamento do nazireado
  choice: voto de nazireu
  alternative: separação; consagração
  rationale: Em Números 6, o termo designa especificamente a instituição ritual do nazireado, embora retenha as ideias de separação e consagração, registradas na nota.
- issue: Representação de יהוה
  choice: SENHOR
  alternative: Yahweh; Javé
  rationale: A forma tradicional em versaletes oferece ampla legibilidade em português sem confundir o nome próprio com o título comum.
- issue: Força contextual de יִפְּלוּ
  choice: não contarão
  alternative: cairão; serão anulados; serão perdidos
  rationale: A formulação comunica diretamente a consequência legal sem ocultar a expressão hebraica literal, fornecida na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém o tom prescritivo do contexto legal e usa terminologia ritual reconhecível.
