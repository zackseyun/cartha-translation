  text: וְ/הִקְרִ֥יב הַ/כֹּהֵ֖ן לִ/פְנֵ֣י יְהוָ֑ה וְ/עָשָׂ֥ה אֶת חַטָּאת֖/וֹ וְ/אֶת עֹלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: pt
  text: O sacerdote os apresentará[a] diante de Yahweh e oferecerá a sua oferta pelo pecado[b] e o seu holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os fará chegar à presença de Yahweh”. O verbo hebraico pode enfatizar a aproximação ou apresentação diante de Deus antes da realização do sacrifício.'
    reason: lexical_alternative
  - marker: b
    text: “Oferta pelo pecado” também pode ser entendida como “oferta de purificação” na linguagem sacerdotal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: os apresentará
  rationale: O hifil de קרב significa fazer chegar, aproximar ou apresentar. Como וְעָשָׂה expressa em seguida a realização dos sacrifícios, “apresentará” distingue a apresentação prévia diante de Deus do ato de oferecer. O pronome “os” retoma os itens sacrificiais do versículo anterior, embora o objeto esteja implícito no hebraico.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente e preciso de כֹּהֵן no contexto do culto israelita.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי indica presença ou posição perante Deus; “diante de” conserva de modo natural essa relação cultual.
- source_word: וְעָשָׂה
  choice: e oferecerá
  rationale: Embora עשה signifique literalmente “fazer”, com nomes de sacrifícios é uma expressão idiomática para realizar ou oferecer a oferta.
- source_word: אֶת חַטָּאתוֹ
  choice: a sua oferta pelo pecado
  rationale: No vocabulário sacrificial, חַטָּאת designa a oferta relacionada ao pecado. “Oferta pelo pecado” é clara e tradicional, sem excluir a função purificadora do sacrifício.
- source_word: וְאֶת עֹלָתוֹ
  choice: e o seu holocausto
  rationale: עֹלָה designa a oferta inteiramente queimada; “holocausto” é o termo bíblico português consagrado para esse sacrifício.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome divino, não um título. “Yahweh” o representa por transliteração e evita substituí-lo por “SENHOR”.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode destacar tanto a relação com o pecado quanto a função purificadora do rito. A tradução principal mantém a expressão amplamente reconhecida, e a nota registra a alternativa contextual sem resolver além do texto a tensão lexical.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e terminologia sacrificial reconhecível. Os possessivos reproduzem os sufixos masculinos singulares do hebraico e dependem do contexto imediato para identificar o ofertante.
