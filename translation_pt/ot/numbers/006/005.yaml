id: NUM.6.5
reference: Numbers 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: pt
  text: Durante todos os dias do seu voto de nazireu[a], nenhuma navalha passará sobre a sua cabeça. Até que se completem os dias durante os quais ele se consagra a Yahweh, será santo; deixará crescer o cabelo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu voto de separação”. A palavra hebraica relacionada a “nazireu” traz a ideia de separação ou consagração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: seu voto de nazireu
  rationale: Preserva o termo técnico ligado ao nazireado e soa natural em português; a nota explicita a ideia de separação e consagração presente na raiz hebraica.
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: nenhuma navalha passará sobre a sua cabeça
  rationale: Mantém a imagem idiomática hebraica de modo claro e digno, sem reduzi-la diretamente à interpretação 'não raspará a cabeça'.
- source_word: עַד מְלֹאת הַיָּמִים
  choice: até que se completem os dias
  rationale: Expressa naturalmente a conclusão do período estipulado, preservando a formulação temporal e jurídica do hebraico.
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: durante os quais ele se consagra a Yahweh
  rationale: O hifil de נזר indica separar-se ou dedicar-se em relação a Yahweh. 'Consagra-se' comunica essa dedicação em português sem perder o vínculo com o voto.
- source_word: קָדֹשׁ יִהְיֶה
  choice: será santo
  rationale: Conserva o termo teologicamente significativo קָדוֹשׁ e a força normativa do enunciado.
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: deixará crescer livremente o cabelo da sua cabeça
  rationale: Representa o valor causativo ou permissivo de גַּדֵּל e a ideia de cabelo solto, não aparado, contida em פֶּרַע, com português corrente.
theological_decisions:
- issue: Representação do nome da aliança יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome divino em vez de substituí-lo por um título.
- issue: Manutenção de קָדֹשׁ como termo teológico
  choice: será santo
  alternative: será consagrado; será separado
  rationale: O hebraico emprega explicitamente 'santo'. As alternativas explicam aspectos do contexto, mas enfraquecem a transparência lexical e o peso teológico do termo.
- issue: Sentido de נזר na dedicação do nazireu
  choice: ele se consagra a Yahweh
  alternative: ele se separa para Yahweh
  rationale: '''Consagra-se'' expressa a separação religiosa voluntária implicada pelo voto, sem resolver a santidade do nazireu como mera separação externa.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão literal sobre a navalha foi preservada no texto, e 'livremente' comunica o crescimento não aparado indicado por פֶּרַע. Não se acrescentou nota [b], pois a nota inglesa associada a esse marcador explica a frase da navalha, mas o marcador aparece indevidamente depois de 'santo'; uma nota deslocada não deve ser reproduzida.
