  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: pt
  text: Que Yahweh faça o seu rosto brilhar sobre você e lhe conceda graça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que Yahweh faça o seu rosto brilhar em sua direção e lhe conceda favor.”'
    reason: Registra de modo mais explícito o valor direcional de אֵלֶיךָ e uma tradução alternativa de חנן.
lexical_decisions:
- source_word: יָאֵר
  choice: Que ... faça ... brilhar
  rationale: O hifil jussivo de אור expressa um desejo ou bênção e tem sentido causativo; a construção portuguesa preserva ambos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: פָּנָיו
  choice: o seu rosto
  rationale: Mantém a imagem concreta do hebraico sem reduzi-la interpretativamente a “presença” ou “favor”.
- source_word: אֵלֶיךָ
  choice: sobre você
  rationale: Embora אֶל tenha valor básico de direção, “fazer o rosto brilhar sobre alguém” é uma formulação natural e solene em português para a imagem hebraica.
- source_word: וִיחֻנֶּךָּ
  choice: e lhe conceda favor
  rationale: חנן significa tratar com graça ou favor. “Conceda favor” comunica o sentido com clareza atual, evitando que “tenha misericórdia” restrinja a ideia à compaixão diante da aflição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O versículo emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal no texto.
- issue: Imagem antropomórfica do rosto divino que brilha
  choice: Preservar literalmente a imagem no texto principal
  alternative: Que a sua presença resplandeça sobre você
  rationale: A formulação concreta é parte da poesia e da teologia da bênção; explicá-la como mera presença ou disposição favorável eliminaria sua força imagética.
- issue: Sentido de וִיחֻנֶּךָּ
  choice: lhe conceda favor
  alternative: tenha compaixão de você
  rationale: O verbo abrange a concessão graciosa de favor e não exige que o contexto seja entendido especificamente como socorro à miséria.
translation_notes:
  register: Português moderno, digno e acessível, com construção optativa própria de uma bênção. O singular “você” representa os sufixos hebraicos masculinos singulares sem introduzir marca de gênero desnecessária em português.
