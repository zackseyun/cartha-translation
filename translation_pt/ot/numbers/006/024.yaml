  yaml_path: translation/ot/numbers/006/024.yaml
  text: May Yahweh bless you and keep you[a].
translation:
  language: pt
  text: Que Yahweh[a] abençoe você e o proteja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: Leitura alternativa tradicional do nome divino.
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Que ... abençoe você
  rationale: O piel jussivo de ברך, com sufixo de segunda pessoa masculina singular, expressa aqui um desejo de bênção. A construção portuguesa com “Que” comunica naturalmente essa força volitiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino YHWH. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- source_word: וְיִשְׁמְרֶךָ
  choice: e o proteja
  rationale: O qal jussivo de שמר, com sufixo de segunda pessoa masculina singular, denota guardar, vigiar ou preservar. “Proteja” é claro e natural em português moderno e conserva o sentido de cuidado protetor.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o hebraico emprega diretamente o Tetragrama, a tradução mantém o nome divino transliterado, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com formulação direta. O singular hebraico dirigido a um homem é vertido pelo tratamento amplamente compreensível “você”; “o proteja” retoma esse referente sem explicitar gênero no substantivo.
