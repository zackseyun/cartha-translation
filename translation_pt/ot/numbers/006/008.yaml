  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ קָדֹ֥שׁ ה֖וּא לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/008.yaml
  text: All the days of his separation he is holy to Yahweh[a].
translation:
  language: pt
  text: Todos os dias de sua separação, ele é santo para Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de seu voto de nazireu” ou “de sua consagração”. O termo hebraico se refere ao estado de separação como nazireu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: Durante todos os dias
  rationale: Expressa naturalmente em português o período completo indicado pelo quantificador כֹּל e pelo construto temporal יְמֵי.
- source_word: נִזְרוֹ
  choice: da sua separação
  rationale: Refere-se ao estado ou período em que o nazireu está separado; evita identificar o termo apenas com o ato de fazer o voto.
- source_word: קָדֹשׁ הוּא
  choice: ele é santo
  rationale: Preserva o valor teológico de קָדֹשׁ e representa explicitamente a oração nominal hebraica.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica relação ou dedicação, e o nome divino יהוה é transliterado como Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança em vez de substituí-lo por um título.
- issue: Sentido de נִזְרוֹ na legislação do nazireado
  choice: sua separação
  alternative: seu voto de nazireu; sua consagração
  rationale: O contexto destaca a duração do estado de separação do nazireu. A formulação conserva essa nuance sem reduzir o termo ao voto nem criar repetição semântica com “santo”.
translation_notes:
  register: Português moderno, claro e digno, com estrutura temporal natural. “Nazireu” aparece na nota para explicitar o contexto técnico sem sobrecarregar o texto principal.
