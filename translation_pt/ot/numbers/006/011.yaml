  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: pt
  text: O sacerdote oferecerá uma como oferta pelo pecado[a] e a outra como holocausto. Assim, fará expiação por ele, porque pecou em relação à pessoa morta[b], e consagrará a cabeça dele naquele mesmo dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta pelo pecado ou a oferta de purificação, especialmente em contextos de impureza ritual.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em relação à נפשׁ”. Neste contexto, a palavra se refere a uma pessoa morta, isto é, ao cadáver cuja presença causou a impureza ritual.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: O sacerdote oferecerá
  rationale: Embora עשה signifique literalmente “fazer”, no contexto sacrificial indica a apresentação das ofertas; “oferecerá” expressa naturalmente esse uso cultual.
- source_word: אֶחָד לְחַטָּאת
  choice: uma das aves como oferta pelo pecado
  rationale: חַטָּאת designa aqui uma categoria sacrificial. A inclusão de “das aves” retoma com clareza os dois pássaros do versículo anterior sem acrescentar um novo referente.
- source_word: וְאֶחָד לְעֹלָה
  choice: a outra como holocausto
  rationale: עֹלָה é a oferta inteiramente queimada; “holocausto” é o termo bíblico português reconhecível para essa categoria sacrificial.
- source_word: וְכִפֶּר עָלָיו
  choice: fará expiação por ele
  rationale: Preserva a força cultual de כפר sem impor uma teoria específica da expiação.
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: porque pecou em relação à pessoa morta
  rationale: A construção apresenta a razão da expiação. Neste contexto, נֶפֶשׁ refere-se a uma pessoa morta, enquanto “em relação a” mantém a formulação hebraica sem especificar além do necessário a natureza do pecado ritual.
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: e consagrará a cabeça dele
  rationale: O hebraico diz literalmente “consagrará a sua cabeça”; no contexto nazireu, a cabeça e o cabelo representam a consagração do voto. Evita-se “reconsagrará”, pois a ideia de renovação vem do contexto, não do verbo em si.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele mesmo dia
  rationale: Traduz a referência temporal de forma natural e comunica a imediaticidade contextual do rito.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial sacerdotal
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode designar uma oferta relacionada ao pecado ou, particularmente neste contexto de impureza ritual, uma oferta de purificação. A expressão tradicional e amplamente compreensível fica no texto, e a alternativa lexical é preservada em nota.
- issue: Referente de הַנָּפֶשׁ
  choice: pessoa morta
  alternative: cadáver
  rationale: Embora נֶפֶשׁ normalmente signifique “pessoa”, “vida” ou “ser”, neste contexto legal refere-se ao morto que ocasionou a contaminação ritual. “Pessoa morta” conserva o referente humano e evita o sentido incorreto de “alma”.
- issue: Natureza do pecado mencionado
  choice: pecou em relação à pessoa morta
  alternative: pecou por causa do cadáver
  rationale: A formulação mantém a tensão do texto, que chama de pecado uma ocorrência ligada à contaminação por morte, inclusive quando súbita, sem explicar o grau de culpa ou reduzir חטא a mera impureza ritual.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A divisão em duas frases evita uma sequência excessiva de coordenações. Os marcadores [a] e [b] aparecem no texto exatamente junto aos termos explicados.
