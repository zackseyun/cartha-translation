id: NUM.6.14
reference: Numbers 6:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: pt
  text: 'E apresentará sua oferta a Yahweh: um cordeiro macho de um ano, sem defeito, como holocausto; uma cordeira de um ano, sem defeito, como oferta pelo pecado[a]; e um carneiro, sem defeito, como ofertas de comunhão[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode designar tanto o pecado quanto o sacrifício ligado à purificação de impureza ou de uma falta.
    reason: alternative_reading
  - marker: b
    text: Ou “ofertas de paz” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: e apresentará
  rationale: O hifil de קרב, no contexto sacrificial, indica levar ou apresentar uma oferta. O futuro mantém o caráter prescritivo, e a conjunção inicial dá continuidade ao procedimento.
- source_word: קָרְבָּנוֹ
  choice: sua oferta
  rationale: Designa de modo amplo a dádiva sacrificial apresentada; “oferta” é claro e corrente em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino explícito יהוה em vez de substituí-lo por um título.
- source_word: כֶּבֶשׂ ... בֶּן שְׁנָתוֹ
  choice: um cordeiro macho de um ano
  rationale: כֶּבֶשׂ indica um cordeiro macho, e a expressão idiomática בֶּן שְׁנָתוֹ indica a idade de um ano; a ordem é natural em português e conserva a distinção de sexo.
- source_word: תָמִים / תְּמִימָה
  choice: sem defeito
  rationale: Na legislação sacrificial, o adjetivo descreve um animal livre de defeito físico; a mesma formulação é mantida nas três ocorrências pertinentes.
- source_word: לְעֹלָה
  choice: como holocausto
  rationale: עֹלָה é a categoria sacrificial tradicionalmente chamada “holocausto”, isto é, a oferta inteiramente queimada.
- source_word: וְכַבְשָׂה ... בַּת שְׁנָתָהּ
  choice: uma cordeira de um ano
  rationale: כַבְשָׂה é especificamente uma cordeira, e בַּת שְׁנָתָהּ é a forma feminina da indicação de idade.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: חַטָּאת designa aqui uma categoria de sacrifício. “Oferta pelo pecado” é reconhecível e direta, sem ocultar em nota a possível nuance de purificação.
- source_word: וְאַיִל אֶחָד
  choice: e um carneiro
  rationale: אַיִל designa especificamente um carneiro adulto; o artigo indefinido português expressa naturalmente o numeral hebraico neste inventário.
- source_word: לִשְׁלָמִים
  choice: como oferta de comunhão
  rationale: שְׁלָמִים designa um sacrifício associado à paz, ao bem-estar e à comunhão. “Oferta de comunhão” é natural e mantém em nota alternativas lexicais relevantes.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio da aliança. A transliteração “Yahweh” preserva sua presença explícita, sem o substituir por um título.
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode salientar tanto o pecado quanto a purificação ritual resultante do sacrifício. A leitura tradicional permanece no texto, e a alternativa é registrada para preservar a amplitude semântica.
- issue: Sentido sacrificial de שְׁלָמִים
  choice: oferta de comunhão
  alternative: oferta de paz; oferta de bem-estar
  rationale: O termo hebraico comporta ideias de paz, integridade, bem-estar e comunhão. Nenhuma equivalência portuguesa isolada esgota o sentido; as alternativas são preservadas em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém a conjunção inicial do hebraico e usa ponto e vírgula para tornar clara a enumeração dos três animais e de suas funções sacrificiais.
