  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: pt
  text: de vinho e de bebida forte se absterá; não beberá vinagre de vinho nem vinagre de bebida forte, nem beberá qualquer infusão de uvas[a]; não comerá uvas frescas nem secas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «qualquer líquido de uvas deixadas de molho» ou «qualquer suco de uva». O termo hebraico pode indicar de modo amplo o líquido obtido de uvas deixadas de molho ou processadas.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, uvas passas. O hebraico diz literalmente «uvas frescas e secas».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: de vinho e de bebida forte se absterá
  rationale: O hifil de נזר expressa afastamento ou abstinência no contexto do nazireado. A formulação mantém a construção com מִן e distingue יַיִן, vinho, de שֵׁכָר, outra bebida alcoólica ou embriagante.
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: vinagre de vinho nem vinagre de bebida forte
  rationale: חֹמֶץ designa líquido azedo ou avinagrado. A construção com «de» reproduz de modo natural a relação dos termos hebraicos sem limitar o sentido a um condimento moderno.
- source_word: מִשְׁרַת עֲנָבִים
  choice: infusão de uvas
  rationale: מִשְׁרָה se refere propriamente ao líquido em que algo foi deixado de molho ou ao líquido assim obtido. «Infusão de uvas» conserva esse sentido mais precisamente que «suco de uva», sem excluir outras formas de líquido derivado das uvas.
- source_word: עֲנָבִים לַחִים וִיבֵשִׁים
  choice: uvas frescas nem secas
  rationale: לַחִים contrasta com יְבֵשִׁים e, neste contexto alimentar, corresponde naturalmente a «frescas» em oposição a «secas».
- source_word: לֹא יִשְׁתֶּה ... לֹא יֹאכֵל
  choice: não beberá ... não comerá
  rationale: Os imperfeitos sob negação expressam as proibições legais de forma direta e digna em português.
theological_decisions: []
