  register: Português moderno, claro e solene, com ordem sintática natural e paralelismo legal preservado. «Bebida forte» mantém a distinção lexical tradicional sem especificar indevidamente o tipo de bebida; «infusão de uvas» preserva a particularidade do hebraico.
