  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: pt
  text: 'E esta é a lei do nazireu: no dia em que se completarem os dias de sua separação[a], ele será levado[b] à entrada da tenda do encontro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “os dias de seu voto de nazireu”, “os dias de sua consagração” ou “o período de seu nazireado”.
    reason: lexical_alternative
  - marker: b
    text: 'Mais formalmente: “ele o levará à entrada da tenda do encontro”. O verbo hebraico está na voz ativa, mas o sujeito não é explicitado no versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: E esta é
  rationale: Preserva a força conectiva de ו e o estilo formal que introduz uma prescrição legal.
- source_word: תּוֹרַת
  choice: a lei do
  rationale: Em contexto sacerdotal e ritual, תּוֹרָה designa uma norma ou instrução autorizada; “lei” conserva bem esse caráter formal.
- source_word: הַנָּזִיר
  choice: nazireu
  rationale: É o termo técnico tradicional e compreensível em português para a instituição específica descrita em Números 6.
- source_word: בְּיוֹם מְלֹאת
  choice: no dia em que se completarem
  rationale: Mantém a expressão temporal formal e comunica naturalmente a conclusão do período determinado.
- source_word: יְמֵי נִזְרוֹ
  choice: os dias da sua consagração
  rationale: נֵזֶר neste contexto denota o estado ou período em que a pessoa foi separada para Deus. “Consagração” é natural em português e evita a estranheza de “dias da sua separação”, enquanto a nota registra alternativas mais formais.
- source_word: יָבִיא אֹתוֹ
  choice: ele será levado
  rationale: A forma hebraica é ativa, literalmente “ele o levará”, mas o sujeito não está expresso no versículo. A passiva preserva o foco ritual no nazireu sem identificar indevidamente o agente.
- source_word: אֶל פֶּתַח
  choice: à entrada
  rationale: פֶּתַח indica a entrada ou abertura; “à entrada” é idiomático e adequado ao registro do santuário.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Reproduz de modo claro a designação hebraica do santuário, sem interpretar מוֹעֵד apenas como reunião humana.
theological_decisions:
- issue: Sentido da terminologia נָזִיר/נֵזֶר em Números 6
  choice: Manter “nazireu” como termo técnico e traduzir o período como “consagração”
  alternative: “separação”, “nazireado” ou “voto de nazireu”
  rationale: “Nazireu” preserva a instituição israelita específica. “Consagração” comunica que se trata de uma separação religiosa para Deus, sem acrescentar uma doutrina denominacional; a nota conserva a amplitude lexical.
- issue: Voz de יָבִיא אֹתוֹ
  choice: Usar a passiva “ele será levado”
  alternative: Traduzir formalmente “ele o levará” ou usar “alguém o levará”
  rationale: O hebraico emprega verbo ativo, mas não explicita quem é o sujeito. A passiva evita resolver essa ambiguidade, e a nota apresenta a forma literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom jurídico-ritual do hebraico. “Tenda do encontro” foi preferido a formas menos transparentes, e as ambiguidades relevantes foram preservadas em notas.
