source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: pt
  text: '“Fale aos filhos de Israel e diga-lhes: Quando um homem ou uma mulher fizer um voto especial[a], o voto de nazireu, para se consagrar a Yahweh[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se separar por meio de um voto de nazireu”.'
    reason: lexical_alternative
  - marker: b
    text: “Nazireu” designa uma pessoa especialmente separada para Yahweh mediante um voto.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão familiar hebraica de modo tradicional e ainda natural em português bíblico moderno.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: um homem ou uma mulher
  rationale: Mantém a inclusão explícita de ambos os sexos presente no hebraico.
- source_word: כִּי יַפְלִא לִנְדֹּר נֶדֶר
  choice: quando ... fizer um voto especial
  rationale: Em contexto legal, כִּי introduz o caso previsto; a forma causativa de פלא, junto da construção cognata de נדר, indica um voto excepcional ou especial.
- source_word: נֶדֶר נָזִיר
  choice: o voto de nazireu
  rationale: Preserva a relação construta e o termo técnico da instituição descrita em Números 6.
- source_word: לְהַזִּיר
  choice: para se consagrar
  rationale: Comunica a dedicação mediante separação religiosa sem reduzir o verbo apenas ao afastamento físico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino do texto hebraico como Yahweh.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração Yahweh preserva o caráter de nome próprio.
- issue: Inclusão de homens e mulheres no voto
  choice: manter “um homem ou uma mulher” e usar a forma reflexiva não marcada “se consagrar”
  alternative: qualquer pessoa; repetir “ele ou ela”
  rationale: A formulação conserva a inclusão explícita do hebraico, enquanto o reflexivo português evita introduzir um pronome masculino que poderia obscurecê-la.
- issue: Relação entre nazireado, separação e consagração
  choice: “para se consagrar” no texto, com explicação em nota
  alternative: para se separar; para tornar-se nazireu
  rationale: A raiz נזר envolve separação dedicada a Deus; “consagrar” expressa bem a finalidade religiosa, e a nota mantém visível a dimensão de separação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Fale” e “diga-lhes” mantêm o imperativo dirigido a Moisés; “nazireu” conserva o termo técnico tradicional. Os marcadores [a] e [b] aparecem no texto principal.
