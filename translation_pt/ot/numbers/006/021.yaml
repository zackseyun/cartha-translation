revisions:
- from: 'Esta é a lei do nazireu que fizer voto: sua oferta a Yahweh por seu nazireado, além daquilo que estiver ao alcance de suas posses.[a] Conforme o voto que fizer, assim deverá cumprir, além do que exige a lei do seu nazireado.'
  to: Esta é a lei do nazireu que prometer a Yahweh uma oferta por seu nazireado, além do que puder prover.[a] Conforme o voto que fizer, assim deverá cumprir, segundo a lei do seu nazireado.
  rationale: A revisão corrige o valor da oração final, que remete à lei que regula o nazireado em vez de acrescentar algo a ela. Também explicita a construção hebraica em que o nazireu promete a sua oferta a Yahweh, mantendo a repetição formal de «voto» e a ambiguidade econômica do idiomatismo, esclarecida pela nota.
