source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: pt
  text: Esta é a lei do nazireu que prometer a Yahweh uma oferta por seu nazireado, além do que puder prover.[a] Conforme o voto que fizer, assim deverá cumprir, segundo a lei do seu nazireado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “além do que sua mão alcançar”. A expressão se refere ao que seus recursos lhe permitirem oferecer.'
    reason: Preserva a imagem idiomática hebraica e esclarece seu sentido econômico.
lexical_decisions:
- source_word: תּוֹרַת
  choice: a lei do
  rationale: Neste contexto, תּוֹרָה designa a norma que rege o nazireado; “lei” preserva a fórmula jurídica e é clara em português.
- source_word: הַנָּזִיר
  choice: nazireu
  rationale: Termo técnico tradicional e compreensível para a pessoa submetida ao voto especial descrito no capítulo.
- source_word: אֲשֶׁר יִדֹּר
  choice: que fizer voto
  rationale: Expressa naturalmente o ato de assumir um voto e mantém a repetição do hebraico na segunda ocorrência.
- source_word: קָרְבָּנוֹ
  choice: sua oferta
  rationale: קָרְבָּן é o termo geral para uma oferta apresentada a Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino explícito e traduz ל como direção ou dedicação da oferta.
- source_word: עַל נִזְרוֹ
  choice: por seu nazireado
  rationale: נֵזֶר refere-se aqui ao estado ou período de separação consagrada do nazireu; “nazireado” evita confundi-lo apenas com o ato verbal do voto.
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: além daquilo que estiver ao alcance de suas posses
  rationale: A expressão idiomática descreve os recursos ou meios da pessoa. A formulação comunica o sentido e conserva parcialmente a imagem de alcance.
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: Conforme o voto que fizer
  rationale: Preserva a conformidade exigida entre o compromisso assumido e seu cumprimento, bem como a repetição de נדר.
- source_word: כֵּן יַעֲשֶׂה
  choice: assim deverá cumprir
  rationale: Comunica a força normativa da fórmula jurídica em português atual.
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: além do que exige a lei do seu nazireado
  rationale: Neste encadeamento, עַל pode indicar algo acrescentado à obrigação regulamentar; a formulação distingue o voto pessoal das exigências já estabelecidas para o nazireado.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio יהוה; “Yahweh” preserva sua função como nome da aliança sem substituí-lo por um título.
- issue: Relação entre o voto voluntário e a lei do nazireado
  choice: O conteúdo particular do voto deve ser cumprido além das exigências regulamentares do nazireado
  alternative: A frase final significa apenas “segundo a lei do seu nazireado”
  rationale: O segundo עַל pode ter valor aditivo, coerente com מִלְּבַד e com a distinção entre aquilo que a pessoa promete conforme seus recursos e a oferta prescrita. Como a construção admite leitura relacional mais geral, a alternativa é registrada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência jurídica moderada. “Nazireu” e “nazireado” são mantidos como termos técnicos. A ordem foi ajustada para tornar legível a sintaxe hebraica condensada, sem eliminar a repetição intencional de “voto”.
