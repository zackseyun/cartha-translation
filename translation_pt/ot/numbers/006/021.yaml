  verdict: revise
  source_fidelity: A tradução identifica corretamente a moldura jurídica, o nazireu, a oferta a Yahweh e a limitação pelos recursos da pessoa. Contudo, a expressão final עַל תּוֹרַת נִזְרוֹ significa aqui «segundo/conforme a lei do seu nazireado», não «além do que exige» essa lei. O hebraico não estabelece uma segunda adição nessa última oração.
  naturalness: 'O registro é claro e adequadamente jurídico. A revisão torna explícito que o nazireu promete uma oferta, evitando a pequena quebra sintática em «que fizer voto: sua oferta».'
  terminology: «Nazireu», «nazireado», «oferta», «lei» e «Yahweh» são escolhas adequadas e consistentes. «Puder prover» comunica naturalmente o idiomatismo hebraico sobre os recursos disponíveis.
  issues:
  - severity: high
    issue: A oração final foi traduzida como «além do que exige a lei do seu nazireado».
    rationale: O segundo עַל introduz a referência normativa («segundo/conforme a lei do seu nazireado»); não repete o sentido aditivo de מִלְּבַד («além de»). A redação atual acrescenta uma relação de obrigações que o versículo não afirma.
  - severity: medium
    issue: '«o nazireu que fizer voto: sua oferta» deixa pouco clara a relação entre o voto e a oferta.'
    rationale: O objeto de יִדֹּר é «sua oferta a Yahweh». Explicitar «que prometer a Yahweh uma oferta» preserva essa relação e melhora a leitura sem ampliar o sentido.
  revised_text: Esta é a lei do nazireu que prometer a Yahweh uma oferta por seu nazireado, além do que puder prover.[a] Conforme o voto que fizer, assim deverá cumprir, segundo a lei do seu nazireado.
