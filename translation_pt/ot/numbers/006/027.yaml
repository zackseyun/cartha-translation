  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: pt
  text: Assim, eles porão o meu nome sobre[b] os filhos de Israel[a], e eu mesmo os abençoarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os israelitas” ou “o povo de Israel”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “pôr o meu nome sobre” provavelmente indica invocar sobre eles o nome da aliança do SENHOR e assinalá-los como pertencentes a ele.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: Assim, eles porão
  rationale: שׂוּם significa normalmente “pôr, colocar”. “Assim” liga o versículo à bênção sacerdotal precedente, e o futuro preserva a força prospectiva da forma hebraica.
- source_word: אֶת שְׁמִי
  choice: o meu nome
  rationale: Mantém literalmente “meu nome”, expressão de forte alcance representativo e pactual, sem reduzi-la a uma paráfrase interpretativa.
- source_word: עַל
  choice: sobre
  rationale: “Sobre” preserva a metáfora concreta de colocar o nome divino sobre o povo e é natural em português neste contexto solene.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica tradicional e sua continuidade no Pentateuco; no contexto, designa coletivamente todo o povo de Israel.
- source_word: וַאֲנִי
  choice: e eu mesmo
  rationale: O pronome independente אֲנִי é enfático; “eu mesmo” torna essa ênfase perceptível em português.
- source_word: אֲבָרֲכֵם
  choice: os abençoarei
  rationale: Traduz diretamente ברך, “abençoar”, no futuro; o pronome retoma coletivamente os filhos de Israel.
theological_decisions:
- issue: Sentido de colocar o nome de Deus sobre Israel
  choice: Preservar a expressão concreta “porão o meu nome sobre”
  alternative: “invocarão o meu nome sobre” ou “os marcarão como pertencentes a mim”
  rationale: A expressão pode envolver invocação do nome pactual, identificação, pertença e bênção, mas o hebraico não explicita apenas uma dessas dimensões. A formulação literal conserva essa amplitude teológica.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: “os israelitas” ou “o povo de Israel”
  rationale: A expressão hebraica é literalmente masculina plural e funciona como designação coletiva do povo da aliança. A tradução preserva sua forma tradicional, enquanto a nota esclarece o alcance coletivo.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A ordem dos marcadores [b][a] acompanha cada elemento pertinente: [b] após a expressão idiomática e [a] após “filhos de Israel”.'
