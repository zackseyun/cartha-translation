base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: pt
  text: 'Dos filhos de Berias: de Héber, o clã dos heberitas; de Malquiel, o clã dos malquielitas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי בְרִיעָה
  choice: Dos filhos de Berias
  rationale: A construção introduz as subdivisões genealógicas pertencentes à linhagem de Berias. “Dos filhos de” mantém a forma recorrente do censo e soa natural em português.
- source_word: בְרִיעָה
  choice: Berias
  rationale: Nome próprio transliterado segundo a forma portuguesa bíblica corrente.
- source_word: לְ/חֶבֶר
  choice: de Héber
  rationale: Neste padrão censitário, o לְ antes do ancestral indica a linhagem que procede dele; “de Héber” expressa essa relação com concisão.
- source_word: מִשְׁפַּחַת
  choice: o clã de
  rationale: No contexto genealógico e censitário, o termo designa uma subdivisão de parentesco dentro da tribo; “clã” é mais preciso do que o sentido doméstico comum de “família”.
- source_word: הַֽ/חֶבְרִי
  choice: os heberitas
  rationale: A forma patronímica identifica o grupo descendente de Héber; o gentílico português preserva o padrão genealógico.
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: de Malquiel
  rationale: Como no caso de Héber, a preposição introduz o ancestral do qual procede o clã.
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: os malquielitas
  rationale: A forma patronímica designa o grupo descendente de Malquiel e é vertida por um gentílico claro em português.
