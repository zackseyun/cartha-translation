  yaml_path: translation/ot/numbers/026/019.yaml
  text: 'The sons of Judah: Er and Onan[a]. But Er and Onan died in the land of Canaan.'
translation:
  language: pt
  text: 'Os filhos de Judá: Er e Onã. Mas[a] Er e Onã morreram na terra de Canaã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Er e Onã morreram na terra de Canaã”. A conjunção hebraica também pode ser traduzida simplesmente por “e”; no texto, “mas” explicita o sentido contrastivo do contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Os filhos de Judá
  rationale: O plural construto de בֵּן introduz uma lista genealógica; “filhos de” preserva diretamente o sentido masculino e genealógico.
- source_word: עֵר וְאוֹנָן
  choice: Er e Onã
  rationale: Nomes próprios transliterados em suas formas portuguesas usuais; a conjunção é traduzida naturalmente por “e”.
- source_word: וַיָּמָת
  choice: Mas ... morreram
  rationale: A forma narrativa de מוּת relata um acontecimento passado. Embora וַ possa ser traduzido literalmente por “e”, “mas” expressa em português o contraste contextual entre a inclusão dos dois na lista e a notícia de sua morte.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Tradução idiomática da expressão geográfica formada pela preposição בְּ, אֶרֶץ e o nome do lugar.
