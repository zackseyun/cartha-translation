revisions:
- from: e a terra abriu a sua boca e engoliu a eles e a Corá, quando aquela congregação morreu, quando o fogo consumiu duzentos e cinquenta homens; e eles se tornaram um sinal.[a]
  to: E a terra abriu a boca e engoliu-os e a Corá, quando morreu a congregação, quando o fogo consumiu duzentos e cinquenta homens; e eles se tornaram um sinal.[a]
  rationale: A revisão elimina uma regência não idiomática e remove o demonstrativo que não tem correspondente explícito no hebraico. Preserva-se a sintaxe coordenada «eles e Corá», as duas orações temporais, o número, e a referência plural ambígua de «eles».
