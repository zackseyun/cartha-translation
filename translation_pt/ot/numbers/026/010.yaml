review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente as imagens e a sequência temporal do hebraico, bem como conserva a coordenação potencialmente difícil entre «eles» e Corá e a ambiguidade do plural final. Contudo, «engoliu a eles» não é uma construção natural para objeto direto em português e enfraquece desnecessariamente a qualidade da redação.
  naturalness: «A terra abriu a boca» é mais idiomático que «abriu a sua boca», e «engoliu-os e a Corá» preserva exatamente a coordenação hebraica com português natural. «Quando aquela congregação morreu» é compreensível, mas o demonstrativo acrescenta uma ênfase que não está expressa no hebraico; «quando morreu a congregação» é mais próximo e permite que o contexto determine o grupo referido.
  terminology: «Terra», «Corá», «congregação», «consumiu», «duzentos e cinquenta homens» e «sinal» são escolhas adequadas. «Sinal» mantém melhor a amplitude de נֵס do que explicitar «sinal de advertência» no corpo do texto; esta última pode permanecer como alternativa em nota.
  issues:
  - severity: medium
    issue: Objeto direto preposicionado em «engoliu a eles»
    rationale: Em português moderno, «engolir» rege objeto direto sem a preposição «a». «Engoliu-os e a Corá» é natural e ainda espelha a coordenação explícita do hebraico («eles e Corá»).
  - severity: low
    issue: Demonstrativo acrescentado em «aquela congregação»
    rationale: O hebraico traz o artigo definido, não um demonstrativo. Embora «aquela» procure delimitar o grupo, introduz uma nuance deíctica não necessária; o contexto e a formulação original devem conservar a referência sem esclarecimento adicional.
  revised_text: E a terra abriu a boca e engoliu-os e a Corá, quando morreu a congregação, quando o fogo consumiu duzentos e cinquenta homens; e eles se tornaram um sinal.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: «um sinal de advertência». O termo hebraico pode indicar um sinal, emblema ou estandarte; neste contexto, o sinal tem função de advertência.'
    reason: lexical_alternative
  revision_rationale: A revisão elimina uma regência não idiomática e remove o demonstrativo que não tem correspondente explícito no hebraico. Preserva-se a sintaxe coordenada «eles e Corá», as duas orações temporais, o número, e a referência plural ambígua de «eles».
