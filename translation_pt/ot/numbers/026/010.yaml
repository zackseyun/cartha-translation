  text: וַ/תִּפְתַּ֨ח הָ/אָ֜רֶץ אֶת פִּ֗י/הָ וַ/תִּבְלַ֥ע אֹתָ֛/ם וְ/אֶת קֹ֖רַח בְּ/מ֣וֹת הָ/עֵדָ֑ה בַּ/אֲכֹ֣ל הָ/אֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ וַ/יִּהְי֖וּ לְ/נֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: pt
  text: E a terra abriu a boca e engoliu-os e a Corá, quando morreu a congregação, quando o fogo consumiu duzentos e cinquenta homens; e eles se tornaram um sinal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um sinal de advertência». O termo hebraico pode indicar um sinal, emblema ou estandarte; neste contexto, o sinal tem função de advertência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: a terra abriu a sua boca
  rationale: אֶרֶץ pode significar “terra” ou “território”; a imagem do solo que se abre favorece “terra”. A referência à boca preserva a personificação vívida do hebraico.
- source_word: וַתִּבְלַע
  choice: engoliu
  rationale: בלע significa normalmente “engolir”; a escolha conserva a imagem concreta sem intensificá-la.
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: a eles e a Corá
  rationale: O hebraico coordena explicitamente “eles” e “Corá”. A tradução mantém essa formulação sem harmonizá-la com outros detalhes narrativos.
- source_word: בְּמוֹת הָעֵדָה
  choice: quando aquela congregação morreu
  rationale: ב com o infinitivo construto de מות tem valor temporal. “Aquela congregação” identifica naturalmente, em português, o grupo julgado mencionado no contexto, sem fazê-lo coincidir com toda a congregação de Israel.
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: quando o fogo consumiu
  rationale: A construção é temporal. Embora אכל signifique literalmente “comer”, com o fogo como sujeito “consumir” é a expressão idiomática adequada.
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: duzentos e cinquenta homens
  rationale: Tradução direta do numeral e de אִישׁ, com a forma numérica natural no português moderno.
- source_word: וַיִּהְיוּ לְנֵס
  choice: eles se tornaram um sinal
  rationale: נֵס pode designar sinal, emblema ou estandarte. “Sinal” preserva a amplitude lexical e evita explicitar como advertência uma função apenas inferida do contexto.
theological_decisions:
- issue: Referente do verbo plural final (“eles se tornaram um sinal”)
  choice: Manter o pronome plural sem limitar expressamente seu referente.
  alternative: Identificar apenas os duzentos e cinquenta homens ou todo o episódio como o sinal.
  rationale: O plural hebraico admite alguma ambiguidade quanto ao antecedente; a tradução não a resolve artificialmente.
- issue: Relação de Corá com o ato de ser engolido neste versículo
  choice: Manter “a eles e a Corá” conforme a sintaxe imediata.
  alternative: Separar interpretativamente Corá dos que foram engolidos para harmonizar o versículo com outros detalhes narrativos.
  rationale: A primazia do texto hebraico imediato exige conservar sua formulação e a tensão narrativa, sem importar uma harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preservaram-se a coordenação incomum “a eles e a Corá”, as duas orações temporais e a ambiguidade do pronome plural final. O marcador de nota foi colocado após “sinal”, termo ao qual a nota se refere.
