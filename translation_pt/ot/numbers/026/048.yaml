base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: pt
  text: 'Os filhos de Naftali, segundo os seus clãs: de Jazeel, o clã dos jazeelitas; de Guni, o clã dos gunitas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Os filhos de
  rationale: Preserva a forma genealógica hebraica do construto e é natural em português neste contexto censitário.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Transliteração consagrada em português do nome pessoal e tribal.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Expressa a classificação distributiva da tribo; «clãs» representa adequadamente מִשְׁפָּחָה no contexto genealógico e censitário.
- source_word: לְיַחְצְאֵל
  choice: de Jazeel
  rationale: O לְ introduz o ancestral do qual se conta o clã; «de» é a formulação genealógica mais natural em português.
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: o clã dos jazeelitas
  rationale: O gentílico hebraico designa coletivamente o grupo descendente de Jazeel; o plural português torna esse sentido explícito sem alterar a estrutura.
- source_word: לְגוּנִי
  choice: de Guni
  rationale: Mantém o mesmo valor genealógico e distributivo de לְ empregado anteriormente no versículo.
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: o clã dos gunitas
  rationale: O gentílico designa coletivamente os descendentes de Guni, representados de modo natural pelo plural em português.
