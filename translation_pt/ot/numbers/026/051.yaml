base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: pt
  text: 'Estes são os recenseados[b] dos filhos de Israel[a]: seiscentos e um mil setecentos e trinta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os israelitas» ou «os descendentes de Israel». Literalmente, «os filhos de Israel».
    reason: lexical_alternative
  - marker: b
    text: Ou «os que foram contados»; o hebraico se refere às pessoas registradas no recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes foram
  rationale: O demonstrativo plural introduz o total do recenseamento; em português, a cópula no passado torna a frase natural no contexto narrativo.
- source_word: פְּקוּדֵי
  choice: os recenseados
  rationale: O termo deriva de פקד e, neste contexto, designa as pessoas registradas e contadas no recenseamento, não apenas um total abstrato.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Preserva a expressão familiar hebraica e usa «entre» para indicar naturalmente o grupo do qual procedem os recenseados.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: seiscentos e um mil setecentos e trinta
  rationale: 'Reproduz em português corrente a soma hebraica: 600.000 + 1.000 + 700 + 30 = 601.730.'
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A opção mantém a formulação familiar e masculina do hebraico sem reduzi-la silenciosamente a um simples etnônimo; no contexto, a expressão tem sentido corporativo.
- issue: Sentido de פְּקוּדֵי no contexto do recenseamento
  choice: os recenseados
  alternative: os contados; o total do recenseamento
  rationale: A forma hebraica aponta para as pessoas registradas no censo. «Os recenseados» conserva essa referência pessoal sem transformar o termo em um número abstrato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Recenseados» comunica com precisão o contexto censitário; a ordem numérica segue o uso português natural. A expressão tradicional «filhos de Israel» foi preservada, com alternativas esclarecidas em nota.
