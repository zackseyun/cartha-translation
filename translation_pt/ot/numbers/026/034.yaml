  text: These are the clans of Manasseh, and those numbered from them were fifty-two thousand seven hundred.
translation:
  language: pt
  text: Estes são os clãs de Manassés, e os seus recenseados eram cinquenta e dois mil e setecentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que foram recenseados dentre eles” ou “os seus alistados”. A fórmula hebraica do censo emprega uma forma de פקד, referindo-se aos que foram contados ou inscritos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas são
  rationale: O demonstrativo plural introduz o resumo da lista; o presente é natural nessa fórmula censitária.
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: Designa grupos de parentesco dentro da tribo. Em português bíblico corrente, “famílias” comunica esse sentido de modo claro e digno, sem sugerir apenas o núcleo doméstico no contexto imediato.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וּפְקֻדֵיהֶם
  choice: e os que foram contados entre elas
  rationale: A forma de פקד pertence à linguagem do recenseamento e se refere aos inscritos ou contados. “Entre elas” liga os recenseados às famílias sem acrescentar aqui o substantivo “homens”, implícito no contexto mais amplo.
- source_word: שְׁנַיִם וַחֲמִשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: cinquenta e dois mil e setecentos
  rationale: Expressa de maneira idiomática em português o total hebraico exato de 52.700.
