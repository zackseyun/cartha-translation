base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: pt
  text: de Jezer, o clã dos jezeritas; de Silém, o clã dos silemitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: de Jezer
  rationale: Na fórmula censitária, a preposição לְ introduz o ancestral que dá nome ao clã; em português, «de» expressa essa relação de modo natural. O nome segue a forma portuguesa tradicional «Jezer».
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo, não apenas uma família nuclear; «clã» comunica melhor essa estrutura.
- source_word: הַ/יִּצְרִי
  choice: os jezeritas
  rationale: O gentílico hebraico identifica os descendentes ou membros do clã de Jezer. «Jezeritas» mantém clara a relação com o nome do ancestral.
- source_word: לְ/שִׁלֵּם
  choice: de Silém
  rationale: Como no primeiro membro do versículo, לְ introduz o ancestral epônimo do clã e é vertido naturalmente por «de». «Silém» representa o nome hebraico com acento gráfico para indicar a tonicidade final.
- source_word: הַ/שִּׁלֵּמִי
  choice: os silemitas
  rationale: O gentílico designa os descendentes ou membros do clã de Silém; «silemitas» é uma formação portuguesa clara e natural.
