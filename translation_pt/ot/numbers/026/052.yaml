lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol de דבר faz a narrativa avançar. “Então ... falou” expressa com naturalidade essa progressão e preserva a fórmula que introduz a fala divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “falar a Moisés” é uma construção clara e corrente em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz o conteúdo da fala seguinte; “dizendo” preserva a fórmula hebraica de modo natural e digno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto a nota informa a tradução tradicional por título sem impor essa substituição ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, e a fórmula introdutória da fala foi preservada.
