base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: pt
  text: 'Estes são os filhos de Efraim, segundo os seus clãs: de Sutela, o clã dos sutelaítas; de Bequer, o clã dos bequeritas; de Taã, o clã dos taanitas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה בְנֵי אֶפְרַיִם
  choice: Estes são os filhos de Efraim
  rationale: Preserva a fórmula genealógica demonstrativa e o sentido formal de בְנֵי, com construção natural em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto censitário de Números, מִשְׁפָּחָה designa subdivisões tribais; “clãs” comunica essa organização com maior precisão do que “famílias”.
- source_word: לְשׁוּתֶלַח מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: de Sutela, o clã dos sutelaítas
  rationale: O לְ indica aqui agrupamento por ancestral, e a forma gentílica hebraica é vertida por um gentílico coletivo português.
- source_word: לְבֶכֶר מִשְׁפַּחַת הַבַּכְרִי
  choice: de Bequer, o clã dos bequeritas
  rationale: Mantém o paralelismo genealógico e translitera o nome e o gentílico de modo legível em português.
- source_word: לְתַחַן מִשְׁפַּחַת הַתַּחֲנִי
  choice: de Taã, o clã dos taanitas
  rationale: Reproduz a mesma fórmula de descendência e emprega formas portuguesas naturais para o nome próprio e o gentílico.
