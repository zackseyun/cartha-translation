source:
  edition: WLC
  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: pt
  text: Ao grupo mais numeroso, aumentarás a sua herança, e ao menos numeroso, reduzirás a sua herança; a cada um[a] será dada a sua herança conforme o número dos seus recenseados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cada homem”, expressão masculina singular usada distributivamente; no contexto, refere-se a cada grupo ao qual se atribui uma porção conforme o número de seus recenseados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב
  choice: ao grupo mais numeroso
  rationale: רַב funciona aqui como substantivo e, no contexto do recenseamento e da distribuição da terra, indica o grupo com maior população.
- source_word: תַּרְבֶּה
  choice: aumentarás
  rationale: O hifil de רבה expressa fazer aumentar; a formulação mantém de modo natural a relação proporcional com o tamanho do grupo.
- source_word: נַחֲלָתוֹ
  choice: a sua herança
  rationale: נַחֲלָה designa a propriedade recebida por direito ou por partilha, aqui especificamente a porção de terra; “herança” preserva o termo bíblico e o sentido jurídico.
- source_word: וְלַמְעַט
  choice: e ao menos numeroso
  rationale: מְעַט contrasta com רַב e indica o grupo de população menor; “menos numeroso” explicita a comparação exigida pelo contexto censitário.
- source_word: תַּמְעִיט
  choice: reduzirás
  rationale: O hifil de מעט significa fazer menor ou diminuir; “reduzirás” é conciso e adequado à atribuição de uma porção menor.
- source_word: אִישׁ
  choice: a cada um
  rationale: O masculino singular tem valor distributivo. “A cada um” preserva esse valor sem sugerir indevidamente que a terra é aqui repartida a cada indivíduo isoladamente.
- source_word: לְפִי
  choice: conforme
  rationale: A locução significa “segundo” ou “em proporção a”; “conforme” é natural e mantém a relação direta com o total recenseado.
- source_word: פְקֻדָיו
  choice: o número dos seus recenseados
  rationale: O termo deriva de פקד e se refere aos que foram contados no recenseamento. A inclusão de “número” torna explícito em português o sentido quantitativo já presente na construção e no contexto.
- source_word: יֻתַּן
  choice: será dada
  rationale: O passivo de נתן significa “ser dada”; a forma preserva a voz passiva e soa natural em português.
theological_decisions:
- issue: Referente distributivo de אִישׁ e dos sufixos masculinos singulares
  choice: Traduzir como “a cada um” e entender o referente como cada grupo representado no recenseamento
  alternative: “a cada homem”, entendido como distribuição individual
  rationale: O contexto imediato trata da distribuição proporcional entre grupos maiores e menores. A forma singular distributiva pode representar cada unidade coletiva, sem exigir uma leitura de concessão individual da terra.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A sintaxe conserva o paralelismo entre o grupo mais numeroso e o menos numeroso, enquanto “recenseados” mantém a ligação explícita com o censo do capítulo.
