  yaml_path: translation/ot/numbers/026/056.yaml
  text: According to the lot[a], his inheritance shall be divided between the larger and the smaller.
translation:
  language: pt
  text: A herança de cada um será repartida por sorteio[a] entre o grupo maior e o menor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A herança de cada um será distribuída conforme o sorteio entre os muitos e os poucos”. O hebraico contrasta um grupo mais numeroso com outro menos numeroso no processo de distribuição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי הַגּוֹרָל
  choice: por sorteio
  rationale: A expressão indica que a distribuição é determinada pelo lote lançado. “Por sorteio” é a forma natural em português para esse procedimento, sem perder a função decisória do גּוֹרָל.
- source_word: תֵּחָלֵק
  choice: será repartida
  rationale: 'O nifal expressa ação passiva: a herança será dividida ou distribuída. “Será repartida” preserva essa voz e se ajusta ao contexto de terras.'
- source_word: נַחֲלָתוֹ
  choice: a herança de cada um
  rationale: O hebraico traz literalmente “sua herança”, com sufixo masculino singular, usado aqui de modo distributivo. A formulação explicita em português que se trata da parte correspondente a cada grupo, sem fixar um antecedente masculino individual inadequado ao contexto.
- source_word: בֵּין רַב לִמְעָט
  choice: entre o grupo maior e o menor
  rationale: רַב e מְעָט contrastam grupos relativamente mais e menos numerosos no processo de distribuição. A inclusão de “grupo” torna claro o referente implícito sem definir além do contexto se a comparação diz respeito a tribos ou clãs.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. “Por sorteio” comunica melhor o procedimento antigo do que o literal “segundo a sorte”; “grupo” esclarece os adjetivos substantivados do hebraico.
