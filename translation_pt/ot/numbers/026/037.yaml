base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: pt
  text: Estes são os clãs dos filhos de Efraim; o total dos recenseados entre eles era de trinta e dois mil e quinhentos[a]. Estes são os filhos de José, segundo os seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo o registro deles”, “pelo seu número” ou, de modo mais idiomático, “conforme foram contados”. O hebraico emprega linguagem de registro censitário.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: clãs
  rationale: No contexto do recenseamento tribal, designa subdivisões de parentesco dentro da tribo; “clãs” é mais preciso que o sentido amplo de “famílias”.
- source_word: בְּנֵי אֶפְרַיִם
  choice: filhos de Efraim
  rationale: Preserva a formulação genealógica hebraica e continua clara em português, sem substituir explicitamente a expressão por “descendentes”.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo os que foram recenseados entre eles
  rationale: Reproduz a linguagem de registro censitário ligada a פקד e expressa que o total corresponde aos membros contados.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: trinta e dois mil e quinhentos
  rationale: Apresenta o total exato na ordem numérica natural do português contemporâneo.
- source_word: בְנֵי יוֹסֵף
  choice: filhos de José
  rationale: Mantém a fórmula genealógica repetida no hebraico e a ligação formal entre Efraim e José.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Mantém a terminologia usada no início do versículo e representa a organização segundo as subdivisões tribais.
