base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/042.yaml
  text: 'These were the sons of Dan by their clans: of Shuham[a], the clan of the Shuhamites. These were the clans of Dan by their families.'
translation:
  language: pt
  text: 'Estes foram os filhos de Dã[a], segundo os seus clãs: de Suã, o clã dos suamitas. Estes foram os clãs de Dã, segundo as suas famílias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de Dã”; nesta fórmula genealógica do censo, “filhos” também pode designar os descendentes da tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes foram
  rationale: O demonstrativo introduz e depois resume a relação do censo; o pretérito se ajusta ao contexto narrativo em português sem perder a força de identificação.
- source_word: בְנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a forma literal e formular do hebraico. No contexto genealógico e tribal, “filhos” pode abranger descendentes, esclarecimento registrado em nota.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No censo de Números, מִשְׁפָּחָה designa uma subdivisão tribal; “clãs” comunica esse nível social com clareza.
- source_word: לְשׁוּחָם
  choice: de Suã
  rationale: Na fórmula genealógica, a preposição לְ introduz o ancestral do qual deriva o clã; “de Suã” é a formulação portuguesa mais natural.
- source_word: מִשְׁפַּחַת הַשּׁוּחָמִי
  choice: o clã dos suamitas
  rationale: O gentílico singular hebraico tem valor coletivo e nomeia o grupo descendente de Suã; o plural português explicita naturalmente esse sentido.
- source_word: מִשְׁפְּחֹת דָּן
  choice: os clãs de Dã
  rationale: Tradução direta da expressão de resumo, mantendo a terminologia tribal do versículo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo as suas famílias
  rationale: Na frase conclusiva, “famílias” evita a repetição pouco natural “clãs... segundo seus clãs”, sem apagar o sentido de agrupamentos de parentesco do mesmo termo hebraico.
