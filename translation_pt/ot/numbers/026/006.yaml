  language: en
  yaml_path: translation/ot/numbers/026/006.yaml
  text: from Hezron[a], the clan of the Hezronites; from Carmi, the clan of the Carmites.
translation:
  language: pt
  text: de Hezrom, o clã dos hezronitas; de Carmi, o clã dos carmitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/חֶצְרֹן
  choice: de Hezrom
  rationale: Na fórmula censitária e genealógica, a preposição לְ indica pertencimento ou derivação de linhagem. “De Hezrom” expressa isso naturalmente em português.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: Neste contexto, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo. “Clã” é mais preciso que “família” para essa unidade coletiva.
- source_word: הַחֶצְרוֹנִי
  choice: hezronitas
  rationale: A forma gentílica identifica coletivamente os descendentes associados a Hezrom; o plural português preserva esse sentido.
- source_word: לְ/כַרְמִי
  choice: de Carmi
  rationale: Como no primeiro membro, לְ tem sentido genealógico de pertencimento ou derivação. “De Carmi” mantém o paralelismo.
- source_word: הַכַּרְמִי
  choice: carmitas
  rationale: A forma gentílica denota o grupo descendente de Carmi; o plural coletivo é natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela adequada a uma lista censitária. Os nomes seguem as formas portuguesas tradicionais Hezrom e Carmi. Não se acrescentou nota, pois o valor genealógico de לְ é adequadamente comunicado por “de” sem perda relevante.
