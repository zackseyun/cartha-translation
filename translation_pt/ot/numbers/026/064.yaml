  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: pt
  text: Mas, entre estes, não havia nenhum homem dos que foram contados por Moisés e pelo sacerdote Arão, os quais contaram os filhos de Israel no deserto do Sinai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, entre estes”; a conjunção hebraica também pode ser traduzida simplesmente por “e”, embora aqui provavelmente expresse contraste com o versículo anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: Mas, entre estes
  rationale: A conjunção ו pode assumir valor contrastivo no contexto, enquanto בְ indica inclusão no grupo; a formulação comunica naturalmente o contraste com o versículo anterior.
- source_word: לֹא הָיָה אִישׁ
  choice: não havia nenhum homem
  rationale: A expressão nega que qualquer indivíduo masculino do recenseamento anterior estivesse entre os recém-contados; “nenhum homem” preserva o singular masculino e a ênfase.
- source_word: מִפְּקוּדֵי
  choice: dos que foram contados por
  rationale: O termo designa as pessoas incluídas no recenseamento anterior, não apenas um registro censitário abstrato.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: O hebraico traz apenas “o sacerdote”; não se acrescenta “sumo”.
- source_word: אֲשֶׁר פָּקְדוּ
  choice: os quais contaram
  rationale: O verbo plural retoma Moisés e Arão como os responsáveis pelo recenseamento. “Os quais” evita a possível leitura de que o antecedente seja somente Arão.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a designação familiar tradicional do hebraico e sua forma masculina, apropriada ao contexto censitário.
- source_word: בְּמִדְבַּר סִינָי
  choice: no deserto do Sinai
  rationale: “Deserto” é uma tradução corrente e clara de מִדְבָּר em português, preservando a relação com Sinai.
theological_decisions:
- issue: Linguagem masculina em אִישׁ e בְּנֵי יִשְׂרָאֵל
  choice: Manter “homem” e “filhos de Israel”
  alternative: “pessoa” e “israelitas” ou “povo de Israel”
  rationale: O contexto trata da geração masculina anteriormente recenseada, e as formas hebraicas são masculinas; a tradução não neutraliza essa especificidade.
- issue: Identificação de Arão
  choice: “o sacerdote”
  alternative: “o sumo sacerdote”
  rationale: Embora Arão exercesse o sumo sacerdócio, este versículo emprega somente הַכֹּהֵן; acrescentar “sumo” iria além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, sem eliminar o contraste, a referência ao recenseamento anterior nem a linguagem masculina do contexto.
