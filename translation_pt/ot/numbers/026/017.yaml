  text: From Arod[a], the clan of the Arodites; from Areli, the clan of the Arelites.
translation:
  language: pt
  text: De Arode[a], o clã dos aroditas; de Areli, o clã dos arelitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de maneira mais formal: “A Arode pertencia o clã dos aroditas; a Areli, o clã dos arelitas”. A preposição hebraica לְ introduz cada nome ancestral nesta fórmula censitária.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲרוֹד
  choice: De Arode
  rationale: Na fórmula censitária, a preposição לְ introduz o antepassado que dá nome ao clã. “De Arode” expressa naturalmente em português a descendência ou procedência, enquanto “Arode” segue a forma tradicional portuguesa do nome.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo; “clã” comunica esse sentido com clareza e concisão.
- source_word: הָאֲרוֹדִי
  choice: os aroditas
  rationale: A forma gentílica com artigo identifica coletivamente os descendentes de Arode; o plural gentílico português preserva essa função.
- source_word: לְאַרְאֵלִי
  choice: de Areli
  rationale: Como na primeira metade do versículo, a preposição לְ introduz o antepassado epônimo. “De Areli” mantém o paralelismo da fórmula e indica descendência.
- source_word: הָאַרְאֵלִי
  choice: os arelitas
  rationale: A forma gentílica designa coletivamente o clã descendente de Areli; “arelitas” é uma forma portuguesa natural para o grupo.
