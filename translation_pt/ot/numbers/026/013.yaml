  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: pt
  text: de Zerá, o clã dos zeraítas; de Saul, o clã dos saulitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: de Zerá
  rationale: Na fórmula censitária, a preposição לְ introduz o antepassado do qual o grupo descende; “de Zerá” expressa naturalmente essa relação genealógica em português.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: Neste contexto tribal e censitário, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo; “clã” é mais preciso que “família”.
- source_word: הַזַּרְחִי
  choice: zeraítas
  rationale: A forma gentílica/patronímica identifica os descendentes de Zerá; “zeraítas” reproduz essa formação de modo claro e tradicional em português.
- source_word: לְ/שָׁאוּל
  choice: de Saul
  rationale: Como na primeira ocorrência, לְ marca a vinculação genealógica ao antepassado mencionado.
- source_word: הַשָּׁאוּלִי
  choice: saulitas
  rationale: A forma gentílica/patronímica refere-se ao grupo descendente de Saul; “saulitas” é conciso e preserva o paralelismo hebraico.
