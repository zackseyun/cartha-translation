base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: pt
  text: Estes são os clãs dos rubenitas, e os seus recenseados eram quarenta e três mil setecentos e trinta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: clãs
  rationale: No contexto tribal e censitário de Números, o termo indica subdivisões de parentesco dentro da tribo, não apenas famílias nucleares.
- source_word: הָרֻאוּבֵנִי
  choice: dos rubenitas
  rationale: O gentílico designa os membros ou descendentes da tribo de Rúben; “rubenitas” é claro e corrente em português bíblico.
- source_word: פְקֻדֵיהֶם
  choice: os recenseados entre eles
  rationale: Derivado de פקד em contexto censitário, refere-se às pessoas contadas ou registradas. “Recenseados” comunica esse sentido de modo conciso, sem acrescentar “homens”, que não é repetido explicitamente neste versículo.
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: A forma simples introduz naturalmente o total numérico em português.
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: quarenta e três mil setecentos e trinta
  rationale: Mantém por extenso o número cardinal apresentado no hebraico e combina com o estilo literário da lista censitária.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A divisão em duas frases evita uma coordenação pesada sem alterar a relação entre a identificação dos clãs e o total do recenseamento.
