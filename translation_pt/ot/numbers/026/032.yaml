  text: וּ/שְׁמִידָ֕ע מִשְׁפַּ֖חַת הַ/שְּׁמִידָעִ֑י וְ/חֵ֕פֶר מִשְׁפַּ֖חַת הַֽ/חֶפְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: pt
  text: de Semida, o clã dos semidaítas; e de Héfer, o clã dos heferitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: de Semida
  rationale: 'A fórmula censitária é elíptica: o nome do antepassado introduz o clã que procede dele. Em português, “de Semida” explicita naturalmente essa relação, enquanto o וּ liga este item ao anterior.'
- source_word: מִשְׁפַּחַת
  choice: o clã de
  rationale: Neste recenseamento tribal, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo; “clã” é mais preciso do que “família” no português atual.
- source_word: הַ/שְּׁמִידָעִי
  choice: os semidaítas
  rationale: O gentílico hebraico identifica o grupo descendente ou associado a Semida. “Semidaítas” preserva essa forma coletiva e distingue o clã do antepassado.
- source_word: וְ/חֵפֶר
  choice: e de Héfer
  rationale: A conjunção introduz o item seguinte da fórmula censitária; “de” é suprido em português para expressar com clareza a relação de descendência implícita.
- source_word: הַֽ/חֶפְרִי
  choice: os heferitas
  rationale: O gentílico designa o clã descendente ou associado a Héfer; “heferitas” oferece uma forma coletiva clara e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela à fórmula hebraica. Os nomes seguem formas portuguesas legíveis; “Héfer” recebe acento para preservar a pronúncia, enquanto os gentílicos são grafados em minúscula.
