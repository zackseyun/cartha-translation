  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: pt
  text: 'Os filhos de Zebulom[a], segundo os seus clãs[b]: de Serede, o clã dos sereditas; de Elom, o clã dos elonitas; de Jaleel, o clã dos jaleelitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste recenseamento, «filhos de Zebulom» refere-se aos descendentes tribais de Zebulom.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por seus clãs».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: Os filhos de Zebulom
  rationale: Preserva a expressão genealógica hebraica, embora, no contexto do recenseamento, ela abranja os descendentes tribais de Zebulom.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui uma subdivisão tribal mais ampla que a família doméstica; a preposição לְ tem sentido distributivo ou classificatório.
- source_word: לְסֶרֶד
  choice: de Serede
  rationale: A preposição לְ introduz o ancestral do qual procede o clã; «de» expressa naturalmente essa relação em português.
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: o clã dos sereditas
  rationale: O gentílico hebraico designa coletivamente o clã derivado de Serede.
- source_word: לְאֵלֹן ... מִשְׁפַּחַת הָאֵלֹנִי
  choice: de Elom, o clã dos elonitas
  rationale: Mantém a fórmula repetida do hebraico e usa formas onomásticas correntes em português.
- source_word: לְיַחְלְאֵל ... מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: de Jaleel, o clã dos jaleelitas
  rationale: Translitera o nome em forma natural para leitores de português e verte o gentílico como designação coletiva do clã.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia tribal consistente. «Clã» foi preferido a «família» para distinguir as subdivisões tribais das famílias domésticas; os nomes seguem formas portuguesas legíveis.
