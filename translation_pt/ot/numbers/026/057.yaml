base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: pt
  text: 'E estes foram os levitas recenseados[a], segundo os seus clãs: de Gérson, o clã dos gersonitas; de Coate, o clã dos coatitas; de Merari, o clã dos meraritas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os contados” ou “os registrados”. O hebraico se refere às pessoas incluídas no recenseamento, e não apenas ao ato abstrato de contar.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: os recenseados
  rationale: A forma nominal designa concretamente as pessoas registradas e contadas no recenseamento, não apenas o ato abstrato de contar. “Os recenseados” é natural em português e preserva esse sentido.
- source_word: הַלֵּוִי
  choice: de Levi
  rationale: O singular com artigo funciona aqui como designação tribal ligada ao ancestral Levi. “De Levi” conserva a forma genealógica do hebraico sem introduzir explicitamente o plural interpretativo “levitas”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה indica uma subdivisão de linhagem mais ampla que a família nuclear moderna; “clãs” comunica adequadamente essa unidade social.
- source_word: לְגֵרְשׁוֹן
  choice: de Gérson
  rationale: O לְ introduz aqui pertencimento ou descendência no elenco genealógico; “de Gérson” é a formulação portuguesa mais direta.
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי
  choice: o clã dos gersonitas
  rationale: O gentílico designa coletivamente os descendentes de Gérson; o plural “gersonitas” soa natural e mantém a referência ao grupo.
- source_word: לִקְהָת
  choice: de Coate
  rationale: Mantém a mesma relação genealógica expressa pelo לְ nas três partes paralelas da lista.
- source_word: מִשְׁפַּחַת הַקְּהָתִי
  choice: o clã dos coatitas
  rationale: O gentílico hebraico nomeia coletivamente o clã descendente de Coate; “coatitas” é a forma portuguesa tradicional e inteligível.
- source_word: לִמְרָרִי
  choice: de Merari
  rationale: Reproduz de modo claro e uniforme a construção genealógica paralela do original.
- source_word: מִשְׁפַּחַת הַמְּרָרִי
  choice: o clã dos meraritas
  rationale: O gentílico refere-se ao grupo descendente de Merari; o plural português expressa naturalmente esse valor coletivo.
- source_word: וְאֵלֶּה
  choice: E estes foram
  rationale: A conjunção liga o versículo ao material censitário anterior, enquanto “estes foram” introduz naturalmente a enumeração.
