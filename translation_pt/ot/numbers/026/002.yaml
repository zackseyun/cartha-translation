  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: pt
  text: Façam o recenseamento de toda a comunidade dos filhos de Israel[a], de vinte anos para cima, segundo suas casas paternas, de todos os que saem para a guerra em Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “façam o recenseamento” significa literalmente “levantem a cabeça”; é um idiomatismo que quer dizer contar ou recensear.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: Façam o recenseamento
  rationale: A expressão literalmente relacionada a “levantar a cabeça” é um idiomatismo hebraico para contar ou recensear; a formulação escolhida comunica esse sentido com clareza em português atual.
- source_word: כָּל עֲדַת
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel; “comunidade” é natural e preserva o sentido coletivo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar masculina do hebraico, relevante também no contexto deste recenseamento militar.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Reproduz naturalmente em português a fórmula hebraica que estabelece a idade mínima.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo suas casas paternas
  rationale: Preserva a organização por unidades familiares ou ancestrais da linha paterna indicada no texto.
- source_word: כָּל יֹצֵא צָבָא
  choice: todos os que saem para a guerra
  rationale: Segue de perto a expressão hebraica sem explicitar além do texto a ideia de aptidão; no contexto, refere-se aos que prestam serviço militar.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Tradução direta que situa o grupo no âmbito do povo de Israel.
theological_decisions:
- issue: Expressão familiar e marcada por gênero em בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha conserva a forma familiar masculina do original, que tem pertinência contextual em um recenseamento voltado ao serviço militar.
- issue: Elegibilidade militar implícita em כָּל יֹצֵא צָבָא
  choice: todos os que saem para a guerra
  alternative: todos os aptos para o serviço militar
  rationale: A redação mantém a forma verbal concreta do hebraico e não transforma em afirmação explícita a aptidão militar apenas implícita no contexto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Façam o recenseamento” é claro e corrente; “casas paternas” preserva a estrutura social do original, embora tenha registro um pouco mais formal.
