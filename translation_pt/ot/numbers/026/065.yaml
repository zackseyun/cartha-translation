revisions:
- from: 'Pois Yahweh havia dito a respeito deles: “Certamente morrerão no deserto”[a]. E nenhum deles restou, exceto Calebe, filho de Jefoné, e Josué, filho de Num.[b]'
  to: 'Pois Yahweh lhes havia dito: “Certamente morrerão no deserto.” E nenhum deles restou[a], exceto Calebe, filho de Jefoné, e Josué, filho de Num.'
  rationale: 'A formulação foi ajustada para traduzir de modo mais direto לָהֶם como «lhes», e a pontuação da fala direta foi regularizada. A nota sobre a construção enfática permanece necessária, mas sua âncora deve estar junto de «Certamente morrerão»; por isso, no texto final ela deve ser marcada como [b] após essa expressão, e a nota literal sobre «nenhum deles restou» como [a] após «restou». Texto final com ambas as âncoras: «Pois Yahweh lhes havia dito: “Certamente morrerão[b] no deserto.” E nenhum deles restou[a], exceto Calebe, filho de Jefoné, e Josué, filho de Num.»'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:01:58Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a relação explicativa de כִּי, o mais-que-perfeito contextual, a ênfase de מוֹת יָמֻתוּ, o cenário do deserto e as duas exceções nomeadas. Contudo, לָהֶם é mais diretamente expresso por «lhes»/«a eles» do que por «a respeito deles».
  naturalness: O português é moderno, claro e de registro bíblico sóbrio. «Nenhum deles restou» é natural neste contexto. Ajusta-se a pontuação da fala direta e a posição do marcador b para que a nota incida sobre a oração que ela explica.
  terminology: «Yahweh», «deserto», «Calebe», «Jefoné», «Josué» e «Num» são formas adequadas e reconhecíveis em português. A reprodução da ênfase verbal em «Certamente morrerão» é apropriada.
  issues:
  - severity: medium
    issue: O marcador da nota b está ancorado após «Num», embora a nota explique a oração «nenhum deles restou».
    rationale: A âncora deve acompanhar a expressão objeto da nota, não o último nome próprio do versículo.
  - severity: low
    issue: «A respeito deles» suaviza a direção imediata de לָהֶם.
    rationale: O hebraico diz que Yahweh havia falado «a eles»; «lhes havia dito» é simultaneamente mais direto e natural em português.
  revised_text: 'Pois Yahweh lhes havia dito: “Certamente morrerão no deserto.” E nenhum deles restou[a], exceto Calebe, filho de Jefoné, e Josué, filho de Num.'
