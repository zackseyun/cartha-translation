  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּֽי אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּ/מִּדְבָּ֑ר וְ/לֹא נוֹתַ֤ר מֵ/הֶם֙ אִ֔ישׁ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: pt
  text: 'Pois Yahweh lhes havia dito: “Certamente morrerão no deserto.” E nenhum deles restou[a], exceto Calebe, filho de Jefoné, e Josué, filho de Num.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “e não restou deles homem algum”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do resultado do recenseamento relatado no contexto anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אָמַר לָהֶם
  choice: havia dito a respeito deles
  rationale: O mais-que-perfeito situa a declaração antes do resultado agora constatado; 'a respeito deles' comunica naturalmente que eles eram o objeto da sentença, sem excluir a possibilidade gramatical de 'a eles'.
- source_word: מוֹת יָמֻתוּ
  choice: Certamente morrerão
  rationale: Reproduz em português corrente a ênfase do infinitivo absoluto hebraico seguido do verbo finito.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: '''Deserto'' é natural e amplamente compreensível em português para o מִדְבָּר da peregrinação de Israel, sem implicar necessariamente apenas dunas de areia.'
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: E nenhum deles restou
  rationale: 'Expressa de modo natural o sentido distributivo da construção: nem sequer um indivíduo daquela geração permaneceu.'
- source_word: כִּי אִם
  choice: exceto
  rationale: Introduz claramente as duas únicas exceções à afirmação negativa anterior.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Calebe, filho de Jefoné
  rationale: Emprega as formas portuguesas tradicionais e inteligíveis dos nomes e traduz o patronímico.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: e Josué, filho de Num
  rationale: Emprega as formas portuguesas tradicionais dos nomes e traduz naturalmente a construção patronímica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino; a transliteração 'Yahweh' o preserva e evita substituí-lo por um título.
- issue: Alcance da sentença de morte no deserto
  choice: nenhum deles restou, exceto Calebe e Josué
  alternative: nenhum homem dentre eles restou
  rationale: A formulação conserva a afirmação abrangente e suas exceções explícitas sem acrescentar uma delimitação teológica além do contexto do recenseamento.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência. Mantiveram-se o nome divino transliterado, a ênfase da sentença e as exceções expressas. Os marcadores aparecem junto às expressões que explicam.
