  yaml_path: translation/ot/numbers/026/022.yaml
  text: 'These were the clans of Judah according to those numbered of them: seventy-six thousand five hundred[a].'
translation:
  language: pt
  text: 'Estes foram os clãs de Judá, segundo os seus recenseados: setenta e seis mil e quinhentos[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo o número deles”; a expressão hebraica לִפְקֻדֵיהֶם refere-se aos que foram registrados ou contados no recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes foram
  rationale: O demonstrativo plural introduz o resumo dos clãs; o pretérito se ajusta ao contexto narrativo do recenseamento.
- source_word: מִשְׁפְּחֹת
  choice: clãs
  rationale: No contexto tribal, o termo designa subdivisões de parentesco dentro da tribo; “clãs” é mais preciso que o sentido doméstico comum de “famílias”.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome tribal e pessoal.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo os que neles foram contados
  rationale: Preserva o sentido censitário da raiz פקד e relaciona os recenseados aos clãs mencionados, em português natural.
- source_word: שִׁשָּׁה וְשִׁבְעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: setenta e seis mil e quinhentos
  rationale: Expressa em ordem idiomática portuguesa o total hebraico exato de 76.500.
