  text: אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָ/אִֽיעֶזְרִ֑י לְ/חֵ֕לֶק מִשְׁפַּ֖חַת הַֽ/חֶלְקִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: pt
  text: 'Estes são os filhos de Gileade[a]: de Jezer, o clã dos jezeritas; de Heleque, o clã dos helequitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “filhos de Gileade” pode designar descendentes pela linhagem masculina ou os clãs que dele procedem, e não apenas filhos imediatos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo hebraico é temporalmente neutro; o presente introduz com naturalidade a lista censitária em português.
- source_word: בְּנֵי גִלְעָד
  choice: os filhos de Gileade
  rationale: Preserva a formulação genealógica hebraica; neste contexto, “filhos” pode abranger descendentes pela linhagem masculina e fundadores de clãs.
- source_word: אִיעֶזֶר
  choice: Iezer
  rationale: Transliteração do nome próprio hebraico, sem traduzir seu possível sentido etimológico.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No censo de Números, designa uma subdivisão tribal; “clã” é mais preciso do que “família” no português atual.
- source_word: הָאִיעֶזְרִי
  choice: iezeritas
  rationale: A forma gentílica identifica os membros do clã descendente de Iezer; o sufixo português “-ita” expressa essa relação naturalmente.
- source_word: לְחֵלֶק
  choice: de Heleque
  rationale: Nesta fórmula repetitiva do censo, a preposição לְ introduz o descendente ou fundador do clã seguinte.
- source_word: הַחֶלְקִי
  choice: helequitas
  rationale: Forma gentílica derivada de Heleque, vertida com o sufixo português convencional “-ita”.
