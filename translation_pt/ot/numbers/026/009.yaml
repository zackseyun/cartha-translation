base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: pt
  text: 'E os filhos de Eliabe: Nemuel, Datã e Abirão. Estes são Datã e Abirão, convocados da congregação[a], que contenderam contra Moisés e contra Arão no grupo de Corá, quando contenderam contra Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “homens escolhidos da congregação”.'
    reason: קרואי העדה pode descrever pessoas convocadas/chamadas ou homens escolhidos e reconhecidos pela congregação.
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: Em uma lista genealógica, בנים designa naturalmente os filhos homens nomeados.
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: Estes são aquele Datã e Abirão
  rationale: הוּא tem função identificadora e enfática; a formulação mantém a referência aos dois nomes e a ênfase demonstrativa, embora a construção hebraica seja incomum em português.
- source_word: קרואי הָעֵדָה
  choice: convocados da congregação
  rationale: O particípio passivo de קרא pode indicar pessoas chamadas, convocadas ou reconhecidas pela comunidade. A tradução conserva a concisão e a ambiguidade quanto a serem convocados pela congregação ou homens destacados dela.
- source_word: הָעֵדָה
  choice: a congregação
  rationale: עֵדָה designa aqui a comunidade reunida de Israel; 'congregação' é claro e adequado ao contexto do deserto.
- source_word: הִצּוּ / בְּהַצֹּתָם
  choice: contenderam / quando contenderam
  rationale: As duas formas vêm da mesma raiz נצה. Repetir 'contenderam' preserva a correspondência lexical e o caráter adversativo.
- source_word: בַּעֲדַת קֹרַח
  choice: no grupo de Corá
  rationale: Neste ponto, עֲדַת identifica o grupo associado a Corá; 'grupo' evita confundi-lo com toda a congregação de Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. 'Yahweh' preserva sua condição de nome e representa de modo amplamente aceito a provável vocalização.
- issue: Sentido de קרואי העדה
  choice: convocados da congregação
  alternative: homens escolhidos da congregação
  rationale: O hebraico admite tanto o sentido mais lexical de pessoas chamadas/convocadas quanto o sentido contextual de representantes escolhidos ou reconhecidos. A alternativa interpretativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes próprios nas formas tradicionais em português. Mantém-se a repetição de 'contenderam' e uma leve estranheza em 'aquele Datã e Abirão' para refletir a identificação enfática do hebraico.
