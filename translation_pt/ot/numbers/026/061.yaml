  text: וַ/יָּ֥מָת נָדָ֖ב וַ/אֲבִיה֑וּא בְּ/הַקְרִיבָ֥/ם אֵשׁ זָרָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: pt
  text: Mas Nadabe e Abiú morreram quando apresentaram fogo não autorizado diante de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fogo estranho” ou “fogo estrangeiro”. Neste contexto, o hebraico se refere a fogo que não era autorizado para ser apresentado diante de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreram
  rationale: Embora o verbo hebraico esteja no singular por preceder um sujeito composto, o português exige naturalmente o plural com “Nadabe e Abiú”.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadabe e Abiú
  rationale: Formas portuguesas tradicionais e amplamente reconhecíveis dos nomes próprios hebraicos.
- source_word: בְּהַקְרִיבָם
  choice: quando apresentaram
  rationale: A preposição בְּ com o infinitivo construto e o sufixo tem valor temporal; “apresentaram” expressa com naturalidade o ato cultual sem acrescentar um objeto ausente do texto.
- source_word: אֵשׁ זָרָה
  choice: fogo não autorizado
  rationale: No contexto cultual, זָרָה caracteriza o fogo como impróprio ou não permitido. A formulação comunica esse sentido ao leitor moderno, enquanto a nota preserva as alternativas mais literais.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” conserva o sentido espacial e cultual de לִפְנֵי, e “Yahweh” representa diretamente o nome divino יהוה.
- source_word: וַ
  choice: Mas
  rationale: Neste contexto genealógico, “Mas” assinala de modo natural o contraste introduzido pela observação excepcional sobre a morte dos dois filhos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Natureza do “fogo” apresentado
  choice: não autorizado
  alternative: estranho; estrangeiro
  rationale: O contexto indica uma oferta cultual imprópria, mas a nota mantém a amplitude lexical de זָרָה e evita ocultar as traduções mais formais.
translation_notes:
  register: 'Português moderno, claro e digno, com formas nominais reconhecíveis no uso bíblico lusófono. A tradução busca equivalência ótima: explicita no texto o valor contextual de אֵשׁ זָרָה e registra em nota suas alternativas mais literais.'
