  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: pt
  text: 'Os filhos de Gade, segundo os seus clãs: de Zefom[a], o clã dos zefonitas; de Hagi, o clã dos hagitas; de Suni, o clã dos sunitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas tradições trazem “Zifiom” e “zifionitas” aqui (compare Gênesis 46:16), mas o Texto Massorético neste versículo traz “Zefom” (צפון); por isso, “Zefom” foi mantido no texto principal.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: Os filhos de Gade
  rationale: Preserva a fórmula genealógica hebraica e usa a forma portuguesa tradicional e reconhecível do nome tribal.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto censitário, מִשְׁפָּחָה designa subdivisões de uma tribo; “clãs” comunica essa organização com precisão.
- source_word: לִצְפוֹן
  choice: de Zefom
  rationale: O לְ da fórmula indica pertencimento ou descendência; “de” é natural em listas genealógicas. Zefom representa a leitura צפון do Texto Massorético.
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: o clã dos zefonitas
  rationale: Expressa em português o gentílico coletivo derivado do ancestral Zefom.
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: de Hagi, o clã dos hagitas
  rationale: Mantém a estrutura paralela do hebraico e forma um gentílico português claro a partir de Hagi.
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: de Suni, o clã dos sunitas
  rationale: Mantém a estrutura genealógica repetida e emprega formas de nome e gentílico naturais em português bíblico moderno.
theological_decisions: []
