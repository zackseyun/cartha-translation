base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: pt
  text: Os recenseados dentre eles eram vinte e três mil, todos os do sexo masculino, de um mês de idade para cima, pois não foram recenseados entre os filhos de Israel, porque não lhes foi dada herança entre os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os israelitas”, nas duas ocorrências de “entre os filhos de Israel”.
    reason: Alternativa lexical para בְּתוֹךְ בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: os recenseados entre eles
  rationale: No contexto do censo, designa os que foram registrados e contados; a formulação mantém o sentido nominal e a referência ao grupo.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: vinte e três mil
  rationale: Equivalente cardinal natural e exato em português.
- source_word: כָּל זָכָר
  choice: todos os do sexo masculino
  rationale: Inclui com precisão tanto crianças quanto adultos, conforme o limite etário que vem em seguida; evita o sentido adulto de “homens”.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: de um mês de idade para cima
  rationale: Expressão portuguesa clara e corrente para o limite mínimo de idade indicado pelo hebraico.
- source_word: הָתְפָּקְדוּ
  choice: foram recenseados
  rationale: Preserva a ligação lexical com פְקֻדֵיהֶם e deixa explícito o contexto censitário.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a expressão familiar e pactual do hebraico, sem perder naturalidade em português.
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: não lhes foi dada herança
  rationale: Preserva a voz passiva e traduz נַחֲלָה pelo termo tradicional e contextualmente adequado à distribuição da terra.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A opção principal conserva a formulação familiar do texto hebraico. A alternativa idiomática é registrada em nota para não ocultar a equivalência possível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Recenseados” mantém o contexto técnico sem soar excessivamente especializado; “do sexo masculino” é usado porque o grupo inclui bebês.
