base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: pt
  text: 'Estes eram os clãs de Levi: o clã dos libnitas[a], o clã dos hebronitas, o clã dos malitas, o clã dos musitas e o clã dos coraítas. E Coate gerou Anrão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “famílias” ou “grupos familiares”; o termo hebraico מִשְׁפָּחָה indica uma subdivisão de parentesco dentro da tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: clãs / o clã dos
  rationale: No contexto censitário e tribal, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo. “Clã” evita a ideia restrita da família nuclear moderna.
- source_word: לֵוִי
  choice: Levi
  rationale: Nome próprio tradicionalmente estabelecido em português.
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: libnitas / hebronitas / malitas / musitas / coraítas
  rationale: As formas gentílicas hebraicas nomeiam grupos descendentes ou associados a Libni, Hebrom, Mali, Musi e Corá. Gentílicos plurais são naturais em português depois de “clã dos” e preservam o caráter genealógico.
- source_word: וּקְהָת
  choice: Coate
  rationale: O nome próprio segue a forma portuguesa bíblica corrente. A conjunção hebraica não precisa ser reproduzida mecanicamente após a lista, pois a nova frase mantém a ligação discursiva com naturalidade.
- source_word: הוֹלִיד
  choice: gerou
  rationale: O hifil de ילד, em fórmula genealógica, significa gerar ou tornar-se pai de. “Gerou” é conciso, atual e conserva o sentido genealógico masculino.
- source_word: עַמְרָם
  choice: Anrão
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אֵלֶּה
  choice: Estes eram
  rationale: Embora a oração hebraica não expresse o verbo, o pretérito é naturalmente suprido em português no relato retrospectivo do censo.
