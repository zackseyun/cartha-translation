translation:
  language: pt
  text: 'E estes foram os filhos de Sutela: de Erã[a], o clã dos eranitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “E estes [foram] os filhos de Sutela: de Erã, o clã do eranita”. Aqui, “filhos de” é linguagem genealógica para descendentes ou linhagens de clã, não necessariamente apenas filhos imediatos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: E estes foram
  rationale: A conjunção e o demonstrativo dão continuidade à lista do censo. O pretérito soa natural em português neste contexto genealógico.
- source_word: בְּנֵי
  choice: os filhos de
  rationale: Preserva a fórmula genealógica hebraica, embora aqui possa abranger descendentes ou linhagens, e não apenas filhos imediatos.
- source_word: שׁוּתָלַח
  choice: Sutela
  rationale: Transliteração portuguesa simples e corrente do nome hebraico.
- source_word: לְ/עֵרָן
  choice: de Erã
  rationale: O לְ introduz o membro ou ramo no padrão censitário; “de Erã” expressa a procedência do clã sem o literalismo pouco natural de “para Erã”.
- source_word: מִשְׁפַּחַת
  choice: o clã
  rationale: Neste material censitário, o termo designa uma subdivisão de parentesco dentro da tribo; “clã” é preciso e natural.
- source_word: הָ/עֵרָנִי
  choice: dos eranitas
  rationale: A forma gentílica designa coletivamente o grupo descendente de Erã; o plural português comunica essa referência coletiva.
