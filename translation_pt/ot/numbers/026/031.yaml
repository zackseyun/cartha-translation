base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/031.yaml
  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: pt
  text: de Asriel, o clã dos asrielitas; e de Siquém, o clã dos siquemitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: Asriel
  rationale: Forma portuguesa corrente do nome bíblico, adequada à transliteração do hebraico e à tradição onomástica em português.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto censitário e genealógico, designa uma subdivisão de parentesco dentro da tribo; “clã” expressa essa unidade social com clareza.
- source_word: הָאַשְׂרִיאֵלִי
  choice: os asrielitas
  rationale: O gentílico com artigo identifica coletivamente os descendentes de Asriel; em português, o artigo e o plural comunicam naturalmente esse sentido.
- source_word: וְ
  choice: e
  rationale: Conjunção simples que liga as entradas da lista censitária.
- source_word: שֶׁכֶם
  choice: Siquém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio; aqui designa o ancestral, não o lugar.
- source_word: הַשִּׁכְמִי
  choice: os siquemitas
  rationale: Gentílico derivado de Siquém, usado coletivamente para o grupo de seus descendentes.
