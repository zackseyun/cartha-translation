base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/039.yaml
  text: Of Shupham[a], the clan of the Shuphamites; of Hupham, the clan of the Huphamites.
translation:
  language: pt
  text: De Sufã[a], o clã dos sufamitas; de Hufã, o clã dos hufamitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico Sufã corresponde à grafia deste nome neste versículo; algumas tradições refletem grafias relacionadas, influenciadas por outras tradições textuais ou por listas paralelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפוּפָם
  choice: De Sufã
  rationale: Na fórmula censitária, a preposição לְ indica vinculação ou descendência e é traduzida naturalmente por “de”. O nome hebraico שְׁפוּפָם é transliterado como “Sufã”, em forma corrente e legível em português.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo; “clã” é mais preciso que “família”. A construção hebraica é expressa idiomaticamente como “o clã dos” antes do gentílico coletivo.
- source_word: הַשּׁוּפָמִי
  choice: sufamitas
  rationale: O gentílico com artigo identifica coletivamente os descendentes de Sufã; o plural português em “-itas” transmite com naturalidade esse sentido.
- source_word: לְחוּפָם
  choice: de Hufã
  rationale: A preposição לְ mantém a mesma função de descendência ou filiação ao grupo. חוּפָם é transliterado como “Hufã”.
- source_word: הַחוּפָמִי
  choice: hufamitas
  rationale: O gentílico hebraico designa coletivamente o clã descendente de Hufã; “hufamitas” preserva essa relação e o paralelismo da frase.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela preservada. Emprega “clã” pela precisão no contexto censitário e translitera os nomes segundo formas legíveis em português. Não há ambiguidade teológica relevante nem necessidade de nota textual neste versículo.
