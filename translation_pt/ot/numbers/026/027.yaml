  yaml_path: translation/ot/numbers/026/027.yaml
  text: 'These are the clans of the Zebulunites according to those numbered from them: sixty thousand and five hundred.'
translation:
  language: pt
  text: 'Estas são as famílias dos zebulonitas, segundo os que foram contados entre eles: sessenta mil e quinhentos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas são
  rationale: O demonstrativo plural introduz a declaração resumida; o presente preserva de modo natural a fórmula censitária.
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: No contexto tribal, designa grupos extensos de parentesco. “Famílias” é claro em português e mantém a terminologia recorrente do capítulo sem sugerir apenas núcleos domésticos.
- source_word: הַזְּבוּלֹנִי
  choice: dos zebulonitas
  rationale: O gentílico singular com artigo tem sentido coletivo e se refere aos descendentes tribais de Zebulom; o plural gentílico é idiomático em português.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo os que foram contados entre eles
  rationale: A forma derivada de פקד tem sentido censitário. A redação conserva a referência às pessoas contadas e a relação delas com o grupo.
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: sessenta mil e quinhentos
  rationale: O numeral é expresso por extenso, preservando o estilo formal do relatório censitário.
