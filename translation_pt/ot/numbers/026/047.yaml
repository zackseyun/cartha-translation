base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/047.yaml
  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: pt
  text: 'Estas são as famílias dos filhos de Aser, segundo os seus recenseados: cinquenta e três mil e quatrocentos[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “segundo os seus recenseados”. O hebraico emprega terminologia de censo derivada do verbo פקד, referindo-se aos alistados ou contados.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas são
  rationale: O demonstrativo plural introduz a declaração resumitiva; em português, a cópula expressa produz uma frase natural.
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: O termo designa grupos extensos de parentesco dentro da tribo. “Famílias” é a forma bíblica corrente e amplamente compreensível em português, embora não se limite à família nuclear.
- source_word: בְּנֵי אָשֵׁר
  choice: filhos de Aser
  rationale: Preserva a forma genealógica hebraica e a linguagem de linhagem; no contexto, refere-se aos descendentes tribais de Aser.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo os que foram recenseados entre eles
  rationale: Mantém o sentido censitário oficial de פקד e representa o sufixo pronominal, ao mesmo tempo que evita uma formulação excessivamente rígida em português.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquenta e três mil e quatrocentos
  rationale: Expressa o total exato na ordem numérica natural do português contemporâneo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com boa legibilidade brasileira. “Famílias” preserva o vocabulário tradicional e natural; “recenseados” explicita o contexto do censo sem reduzir a expressão a um mero total abstrato.
