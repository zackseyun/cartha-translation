base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: pt
  text: 'Os filhos de Issacar, segundo os seus clãs: de Tolá, o clã dos tolaítas; de Puvá,[a] o clã dos punitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em algumas passagens relacionadas e em certas traduções, Puvá aparece como “Puá”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: Os filhos de Issacar
  rationale: Preserva a fórmula genealógica hebraica e, neste contexto censitário, abrange os descendentes organizados como tribo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui as subdivisões da tribo; “clãs” é mais preciso que o termo mais amplo “famílias”.
- source_word: תּוֹלָע
  choice: Tolá
  rationale: Nome próprio transliterado segundo uma forma portuguesa natural, sem o interpretar pelo sentido do substantivo comum homógrafo.
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: o clã dos tolaítas
  rationale: O gentílico hebraico identifica o grupo descendente de Tolá; o plural coletivo é idiomático em português.
- source_word: לְפֻוָה
  choice: de Puvá
  rationale: A preposição introduz distributivamente o ancestral de cada clã. A forma consonantal e vocálica deste versículo sustenta “Puvá”.
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: o clã dos punitas
  rationale: O gentílico hebraico designa o clã descendente de Puvá; “punitas” reproduz naturalmente essa formação em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com a estrutura repetitiva própria de um registro censitário. Os nomes foram aportuguesados com acentuação que orienta a pronúncia. O marcador [a] foi colocado imediatamente após “Puvá”, ao qual a nota se refere.
