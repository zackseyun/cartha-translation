  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/צְלָפְחָ֣ד בֶּן חֵ֗פֶר לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/שֵׁם֙ בְּנ֣וֹת צְלָפְחָ֔ד מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: pt
  text: Zelofeade, filho de Héfer, não teve filhos homens[a], mas somente filhas. Os nomes das filhas de Zelofeade eram Maalá, Noa[b], Hogla, Milca e Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “não havia para ele filhos, a não ser filhas”.'
    reason: lexical_alternative
  - marker: b
    text: “Noa” é aqui o nome de uma das filhas de Zelofeade, não o nome de Noé, do relato do dilúvio.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד
  choice: Zelofeade
  rationale: O nome próprio é transliterado segundo a forma tradicional e reconhecível em português; o ו inicial não exige aqui um marcador discursivo explícito.
- source_word: בֶּן חֵפֶר
  choice: filho de Héfer
  rationale: Reproduz diretamente a relação genealógica e usa formas portuguesas correntes dos nomes.
- source_word: לֹא הָיוּ לֹו בָּנִים
  choice: não teve filhos homens
  rationale: A formulação idiomática preserva o sentido masculino de בָּנִים, necessário para o contraste explícito com as filhas.
- source_word: כִּי אִם בָּנוֹת
  choice: mas somente filhas
  rationale: Expressa com naturalidade a exclusão e o contraste da construção hebraica כִּי אִם.
- source_word: וְשֵׁם בְּנוֹת צְלָפְחָד
  choice: Os nomes das filhas de Zelofeade eram
  rationale: Embora שֵׁם esteja no singular, seu uso coletivo diante da lista é vertido idiomaticamente pelo plural em português.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Maalá, Noa, Hogla, Milca e Tirza
  rationale: Empregam-se transliterações portuguesas reconhecíveis dos cinco nomes femininos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão “filhos homens” evita que o português inclusivo “filhos” sugira ausência total de descendentes, preservando o contraste hebraico entre filhos do sexo masculino e filhas.
