  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: pt
  text: 'Os filhos de Belá foram Arde e Naamã: de Arde, o clã dos arditas; de Naamã, o clã dos naamanitas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי
  choice: Os filhos de ... foram
  rationale: Reproduz diretamente a fórmula genealógica e mantém a continuidade da lista, sem acrescentar ênfase.
- source_word: בֶלַע
  choice: Belá
  rationale: Transliteração do nome hebraico com acento gráfico para indicar a pronúncia natural em português.
- source_word: אַרְדְּ
  choice: Arde
  rationale: Forma portuguesa clara do nome próprio, evitando uma terminação consonantal pouco natural na leitura em português.
- source_word: נַעֲמָן
  choice: Naamã
  rationale: Transliteração tradicional e inteligível em português do nome hebraico.
- source_word: מִשְׁפַּחַת
  choice: o clã
  rationale: No contexto censitário de Números, designa uma unidade de parentesco dentro da tribo; “clã” é mais preciso que o sentido doméstico comum de “família”.
- source_word: הָאַרְדִּי
  choice: dos arditas
  rationale: O gentílico hebraico identifica coletivamente os membros do clã descendente de Arde; o plural português expressa essa função com naturalidade.
- source_word: לְנַעֲמָן ... הַנַּעֲמִי
  choice: de Naamã, o clã dos naamitas
  rationale: A preposição marca filiação ou procedência, e o gentílico nomeia coletivamente o grupo descendente de Naamã.
