  text: בְּנֵ֥י יוֹסֵ֖ף לְ/מִשְׁפְּחֹתָ֑/ם מְנַשֶּׁ֖ה וְ/אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/028.yaml
  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: pt
  text: 'Os filhos de José, segundo os seus clãs: Manassés e Efraim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: filhos de
  rationale: O plural construto de בֵּן designa os filhos de José e, neste contexto censitário, também encabeça as linhagens deles. “Filhos de” preserva de modo claro a formulação genealógica do hebraico.
- source_word: יוֹסֵף
  choice: José
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה, na organização tribal e censitária, indica um clã, não apenas a família nuclear moderna. A preposição לְ expressa aqui classificação ou distribuição; “segundo os seus clãs” reproduz naturalmente essa relação.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida do nome próprio e tribal em português.
- source_word: וְאֶפְרָיִם
  choice: e Efraim
  rationale: A conjunção וְ coordena diretamente os dois filhos e ramos tribais de José; os nomes são vertidos nas formas portuguesas tradicionais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia censitária precisa. Preferiu-se “clãs” a “famílias” para evitar a ideia restrita de família nuclear. Não se acrescentou nota, pois a tradução formal “segundo os seus clãs” cabe naturalmente no texto principal.
