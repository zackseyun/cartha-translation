  text: אַךְ בְּ/גוֹרָ֕ל יֵחָלֵ֖ק אֶת הָ/אָ֑רֶץ לִ/שְׁמ֥וֹת מַטּוֹת אֲבֹתָ֖/ם יִנְחָֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: pt
  text: A terra será repartida somente por sorteio; eles receberão a herança de acordo com os nomes das tribos de seus pais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus antepassados”. O hebraico diz literalmente “seus pais”, referindo-se às linhagens paternas dentro das tribos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: somente
  rationale: 'Neste contexto, a partícula tem força restritiva: o sorteio é o meio exclusivo pelo qual a terra deve ser repartida.'
- source_word: בְּגוֹרָל
  choice: por sorteio
  rationale: O substantivo גוֹרָל designa a sorte empregada para tomar uma decisão de distribuição; a expressão portuguesa comunica naturalmente o valor instrumental da preposição.
- source_word: יֵחָלֵק
  choice: será repartida
  rationale: O nifal expressa sentido passivo. “Repartida” se ajusta ao contexto de distribuição territorial e mantém linguagem clara.
- source_word: אֶת הָאָרֶץ
  choice: a terra
  rationale: Tradução direta do objeto definido, que no contexto é a terra destinada à herança de Israel.
- source_word: לִשְׁמוֹת
  choice: de acordo com os nomes
  rationale: A preposição introduz o padrão ou a referência segundo a qual a herança será recebida.
- source_word: מַטּוֹת
  choice: tribos
  rationale: Embora o termo também possa significar “varas” ou “cajados”, aqui designa inequivocamente as divisões tribais.
- source_word: אֲבֹתָם
  choice: seus pais
  rationale: Preserva o termo masculino explícito do hebraico e a referência às linhagens paternas das tribos.
- source_word: יִנְחָלוּ
  choice: eles receberão a herança
  rationale: Expressa com naturalidade o sentido de receber ou possuir algo como herança, sem tornar explícito um objeto que o hebraico deixa implícito.
theological_decisions:
- issue: Terminologia ancestral masculina em אֲבֹתָם
  choice: seus pais
  alternative: seus antepassados
  rationale: O hebraico emprega literalmente “pais” no contexto das linhagens tribais paternas. O texto principal conserva essa especificidade, enquanto a nota oferece a alternativa sem neutralizar silenciosamente a formulação original.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a passiva hebraica e o vínculo explícito com as linhagens paternas. O marcador [a] aparece no texto principal junto à expressão comentada.
