source:
  edition: WLC
  text: בְּנֵ֣י שִׁמְעוֹן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/נְמוּאֵ֗ל מִשְׁפַּ֨חַת֙ הַ/נְּמ֣וּאֵלִ֔י לְ/יָמִ֕ין מִשְׁפַּ֖חַת הַ/יָּמִינִ֑י לְ/יָכִ֕ין מִשְׁפַּ֖חַת הַ/יָּכִינִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: pt
  text: 'Os filhos de Simeão, segundo os seus clãs[a]: de Nemuel, o clã dos nemuelitas; de Jamim, o clã dos jaminitas; de Jaquim[b], o clã dos jaquinitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo as suas famílias”. Neste recenseamento, “clãs” traduz o sentido de agrupamentos de parentesco do hebraico מִשְׁפָּחוֹת.
    reason: lexical_alternative
  - marker: b
    text: O nome hebraico também pode ser transliterado “Yakhin”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שִׁמְעוֹן
  choice: Os filhos de Simeão
  rationale: Mantém a expressão genealógica masculina literal do hebraico, apropriada à fórmula do recenseamento, sem ampliá-la silenciosamente para “descendentes”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto do recenseamento, מִשְׁפָּחָה designa subdivisões de parentesco dentro da tribo; “clãs” comunica melhor esse sentido do que o termo mais amplo “famílias”.
- source_word: לִנְמוּאֵל
  choice: de Nemuel
  rationale: A preposição לְ introduz aqui o ancestral que dá nome ao clã; “de” exprime naturalmente a relação genealógica em português.
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי
  choice: o clã dos nemuelitas
  rationale: O gentílico hebraico nomeia coletivamente os integrantes do clã descendente de Nemuel; o plural português torna isso claro.
- source_word: לְיָמִין
  choice: de Jamim
  rationale: “De” preserva a estrutura enumerativa e indica o ancestral epônimo; “Jamim” segue a transliteração portuguesa corrente do nome יָמִין.
- source_word: מִשְׁפַּחַת הַיָּמִינִי
  choice: o clã dos jaminitas
  rationale: O gentílico é vertido como nome coletivo plural do grupo de descendência, em paralelo com os demais itens.
- source_word: לְיָכִין
  choice: de Jaquim
  rationale: “Jaquim” é uma transliteração consolidada e legível em português para יָכִין, enquanto “de” indica a origem genealógica do clã.
- source_word: מִשְׁפַּחַת הַיָּכִינִי
  choice: o clã dos jaquinitas
  rationale: O plural gentílico português representa o grupo descendente de Jaquim e mantém o paralelismo da fórmula censitária.
