base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: pt
  text: 'Os filhos de Judá[a], segundo os seus clãs, eram estes: de Selá, o clã dos selanitas; de Perez, o clã dos perezitas; de Zerá, o clã dos zeraítas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto de recenseamento, “filhos de Judá” se refere aos descendentes de Judá pela linhagem masculina, organizados em clãs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: eram estes
  rationale: Neste recenseamento, a forma de היה introduz a lista de modo copulativo. “Eram estes” é natural em português e explicita, sem acrescentar conteúdo, que a enumeração vem a seguir.
- source_word: בְנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: בְּנֵי significa literalmente “filhos de” e, neste contexto genealógico, abrange os descendentes de Judá pela linhagem masculina. A formulação preserva a expressão hebraica, com nota explicativa para evitar uma leitura restrita aos filhos imediatos.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui agrupamentos internos da tribo. “Clãs” é mais preciso do que “famílias”, e “segundo” expressa a função classificatória da preposição לְ.
- source_word: לְשֵׁלָה
  choice: de Selá
  rationale: A preposição לְ introduz o ancestral do qual o clã descende. “De Selá” reproduz essa relação de modo idiomático em português.
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי
  choice: o clã dos selanitas
  rationale: A tradução conserva tanto מִשְׁפַּחַת, “clã”, quanto o gentílico derivado de Selá, mantendo o padrão repetitivo do registro censitário.
- source_word: לְפֶרֶץ / מִשְׁפַּחַת הַפַּרְצִי
  choice: de Perez, o clã dos perezitas
  rationale: “Perez” translitera diretamente פֶרֶץ, e “perezitas” representa de modo claro o gentílico hebraico correspondente.
- source_word: לְזֶרַח / מִשְׁפַּחַת הַזַּרְחִי
  choice: de Zerá, o clã dos zeraítas
  rationale: “Zerá” reflete o nome hebraico זֶרַח em forma natural para leitores de português, enquanto “zeraítas” traduz o gentílico e preserva sua ligação com o ancestral.
