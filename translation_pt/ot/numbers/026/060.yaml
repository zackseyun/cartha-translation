translation:
  language: pt
  text: De Arão nasceram[a] Nadabe e Abiú, Eleazar e Itamar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: «A Arão nasceu Nadabe e Abiú, Eleazar e Itamar»; a fórmula genealógica emprega um verbo no singular antes de uma lista composta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּלֵד
  choice: nasceram
  rationale: O nifal de ילד expressa aqui o nascimento em fórmula genealógica. Embora o verbo hebraico esteja morfologicamente no singular, a lista contém quatro filhos; o plural é a concordância natural em português.
- source_word: לְאַהֲרֹן
  choice: de Arão
  rationale: A preposição ל indica o progenitor a quem os filhos nasceram. Em português atual, «de Arão nasceram» comunica essa relação de modo mais natural do que o literal e pouco idiomático «a Arão nasceu», sem converter a frase em uma construção ativa como «Arão gerou».
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: '[marcadores de objeto direto não traduzidos separadamente]'
  rationale: As ocorrências repetidas de אֶת introduzem os nomes da lista e não têm equivalente lexical direto em português.
- source_word: נָדָב
  choice: Nadabe
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֲבִיהוּא
  choice: Abiú
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
