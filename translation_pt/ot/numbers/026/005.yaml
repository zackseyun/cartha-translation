  text: רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַ/חֲנֹכִ֔י לְ/פַלּ֕וּא מִשְׁפַּ֖חַת הַ/פַּלֻּאִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/005.yaml
  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: pt
  text: 'Rúben, o primogênito de Israel: os filhos de Rúben: de Enoque, o clã dos enoquitas; de Palu, o clã dos paluítas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹר
  choice: o primogênito
  rationale: O construto com יִשְׂרָאֵל identifica Rúben como o primogênito de Israel. A formulação preserva tanto a relação familiar quanto a condição de primogenitura sem acrescentar “filho”, já implícito.
- source_word: בְּנֵי רְאוּבֵן
  choice: os filhos de Rúben
  rationale: Mantém o sentido literal de “filhos” e, no contexto do recenseamento genealógico, introduz os descendentes masculinos que deram nome aos clãs.
- source_word: חֲנוֹךְ
  choice: Enoque
  rationale: Emprega a forma tradicional portuguesa do nome hebraico, reconhecível na leitura bíblica em português.
- source_word: מִשְׁפַּחַת
  choice: o clã de
  rationale: Neste recenseamento tribal, o termo designa uma subdivisão de parentesco dentro da tribo; “clã” é mais preciso do que “família”.
- source_word: הַחֲנֹכִי
  choice: os enoquitas
  rationale: A forma gentílica identifica os membros do clã descendente de Enoque; o plural português em “-itas” reproduz naturalmente essa função.
- source_word: לְפַלּוּא
  choice: de Palu
  rationale: O לְ introduz o fundador seguinte na enumeração e expressa aqui relação genealógica, não direção ou finalidade.
- source_word: הַפַּלֻּאִי
  choice: os paluítas
  rationale: A forma gentílica denomina os integrantes do clã descendente de Palu; “paluítas” conserva a relação nominal e o padrão da lista.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura breve e nominal do hebraico foi preservada; os dois-pontos introduzem a enumeração dos clãs, e o padrão paralelo “de..., o clã dos...” evita explicitar relações que o original deixa implícitas.
