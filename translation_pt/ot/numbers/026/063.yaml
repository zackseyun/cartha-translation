base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: pt
  text: Estes são os que foram contados por Moisés e pelo sacerdote Eleazar, os quais contaram os filhos de Israel[a] nas planícies de Moabe, junto ao Jordão, na altura de Jericó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “junto ao Jordão, diante de Jericó”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: os que foram contados
  rationale: O particípio passivo em construção refere-se às pessoas incluídas na contagem; esta formulação é clara e mantém a referência pessoal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Reproduz o título expresso no hebraico sem acrescentar “sumo”, embora Eleazar exercesse esse ofício no contexto.
- source_word: פָּקְדוּ
  choice: contaram
  rationale: Mantém a repetição da raiz פקד e comunica diretamente o contexto censitário.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma genealógica e masculina do hebraico; a nota registra alternativas idiomáticas de alcance coletivo.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: É a designação geográfica tradicional, clara e natural em português moderno.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: junto ao Jordão, na altura de Jericó
  rationale: Expressa com naturalidade a localização junto ao Jordão em relação a Jericó, sem fechar totalmente a questão geográfica; a alternativa “diante de Jericó” consta em nota.
theological_decisions:
- issue: Expressão genealógica e pactual בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução mantém a forma genealógica do texto hebraico sem neutralizá-la, enquanto a nota esclarece o referente coletivo.
- issue: Título oficial de Eleazar
  choice: o sacerdote
  alternative: o sumo sacerdote
  rationale: O texto diz literalmente “o sacerdote”; não se acrescenta um título mais específico com base apenas no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, e todos os marcadores de nota aparecem no texto.
