base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: pt
  text: 'Os filhos de Aser, segundo os seus clãs[a]: de Imna, o clã dos imnitas; de Isvi, o clã dos isvitas; de Berias, o clã dos beritas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “famílias”; neste contexto de recenseamento, o termo se refere às divisões de clãs dentro da tribo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: Os filhos de Aser
  rationale: Mantém a expressão genealógica formal do hebraico, na qual os nomes seguintes representam filhos e fundadores de clãs.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Neste recenseamento, מִשְׁפָּחָה designa subdivisões da tribo, mais amplas que a família doméstica moderna; “clãs” comunica esse nível social com clareza.
- source_word: לְיִמְנָה ... לְיִשְׁוִי ... לִבְרִיעָה
  choice: de Imna ... de Isvi ... de Berias
  rationale: A preposição לְ introduz aqui cada ancestral de modo idiomático. Os nomes próprios são transliterados em formas portuguesas reconhecíveis.
- source_word: מִשְׁפַּחַת הַיִּמְנָה
  choice: o clã dos imnitas
  rationale: O gentílico hebraico identifica os membros do clã descendente de Imna; “imnitas” reproduz essa função naturalmente em português.
- source_word: מִשְׁפַּחַת הַיִּשְׁוִי
  choice: o clã dos isvitas
  rationale: Traduz a designação gentílica derivada de Isvi e mantém o paralelismo da lista.
- source_word: מִשְׁפַּחַת הַבְּרִיעִי
  choice: o clã dos beritas
  rationale: “Beritas” representa o gentílico hebraico derivado de Berias, preservando a distinção entre o ancestral e seus descendentes.
