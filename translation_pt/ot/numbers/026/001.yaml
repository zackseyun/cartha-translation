  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: pt
  text: 'Yahweh disse a Moisés e a Eleazar, filho de Arão, o sacerdote:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O verbo אָמַר significa normalmente “dizer”. Em português, “disse ...:” introduz a fala direta com naturalidade e representa também a função discursiva de לֵאמֹר, sem a redundância pouco idiomática “disse, dizendo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה וְאֶל אֶלְעָזָר
  choice: a Moisés e a Eleazar
  rationale: Preserva os dois destinatários coordenados da fala divina em português natural.
- source_word: בֶּן־אַהֲרֹן הַכֹּהֵן
  choice: filho do sacerdote Arão
  rationale: A posição do artigo em הַכֹּהֵן favorece a leitura de “sacerdote” como qualificativo definido de Arão; esta formulação é clara e natural em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz o conteúdo da fala no versículo seguinte. Em português atual, os dois-pontos cumprem essa função de modo idiomático.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” procura representá-lo diretamente, sem substituí-lo pelo título “SENHOR”.
- issue: Referente de הַכֹּהֵן (“o sacerdote”)
  choice: 'Arão: “filho do sacerdote Arão”'
  alternative: 'Eleazar: “Eleazar, filho de Arão, o sacerdote”'
  rationale: No hebraico, הַכֹּהֵן vem imediatamente depois de אַהֲרֹן e o artigo definido se ajusta naturalmente a Arão como “o sacerdote”. Como a pontuação isolada pode deixar a vinculação menos transparente em português, a nota registra a alternativa formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Depois disso” dá fluência narrativa ao וַ־ inicial; os dois-pontos introduzem naturalmente a fala que começa no versículo seguinte.
