  text: 'These are the clans of Issachar according to those numbered from them: sixty-four thousand and three hundred.'
translation:
  language: pt
  text: 'Estes são os clãs de Issacar, segundo o número dos seus recenseados[a]: sessenta e quatro mil e trezentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme os que foram recenseados entre eles” ou “conforme o seu registro”. A expressão hebraica refere-se à contagem censitária dos membros registrados desses clãs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas são
  rationale: O demonstrativo plural introduz uma declaração resumitiva; em português, a cópula é necessária para formar uma oração natural.
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: No contexto tribal e censitário, designa grupos extensos de parentesco. “Famílias” é a forma bíblica corrente e amplamente compreensível em português, embora “clãs” também seja possível.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo os seus recenseados
  rationale: A expressão, formada com ל e um termo derivado de פקד, refere-se aos integrantes registrados e contados no censo. A formulação preserva a referência às pessoas recenseadas sem ampliar o sentido.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: sessenta e quatro mil e trezentos
  rationale: Reproduz o total de 64.300 na ordem numérica natural do português moderno.
