base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: pt
  text: 'Os filhos de Benjamim, segundo os seus clãs: de Belá, o clã dos belaítas; de Asbel, o clã dos asbelitas; de Airã[a], o clã dos airamitas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O Texto Massorético traz “Airã”; algumas tradições textuais e versões apresentam “Aião”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: Os filhos de Benjamim
  rationale: Mantém a forma genealógica literal “filhos de”, que neste contexto também abrange os descendentes e introduz a lista tribal com clareza.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui uma subdivisão da tribo; “clãs” evita a possível impressão de famílias nucleares e se ajusta ao contexto do recenseamento.
- source_word: לְבֶלַע
  choice: de Belá
  rationale: A preposição לְ introduz a linhagem ligada ao ancestral nomeado; em português, “de” expressa naturalmente essa relação genealógica.
- source_word: מִשְׁפַּחַת הַבַּלְעִי
  choice: o clã dos belaítas
  rationale: O gentílico hebraico identifica os membros do clã derivado de Belá; “belaítas” preserva essa formação.
- source_word: לְאַשְׁבֵּל
  choice: de Asbel
  rationale: “De” representa de modo idiomático a relação genealógica indicada por לְ, enquanto “Asbel” é uma forma portuguesa clara do nome hebraico.
- source_word: מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: o clã dos asbelitas
  rationale: Reproduz o gentílico derivado de Asbel e mantém o paralelismo da enumeração.
- source_word: לַאֲחִירָם
  choice: de Airã
  rationale: Segue a leitura אֲחִירָם do Texto Massorético em forma portuguesa tradicional e usa “de” para marcar a linhagem.
- source_word: מִשְׁפַּחַת הָאֲחִירָמִי
  choice: o clã dos airamitas
  rationale: Verte o gentílico hebraico como a designação coletiva dos descendentes de Airã, em paralelo com os demais nomes de clãs.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia de recenseamento tribal. A repetição de “clã” preserva a estrutura formal do hebraico. O marcador da nota foi colocado após “Airã”, pois é esse o nome ao qual a variante textual se refere.
