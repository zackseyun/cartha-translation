base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: pt
  text: Estes são os clãs de Naftali, segundo os seus clãs, e os que foram recenseados dentre eles eram quarenta e cinco mil e quatrocentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas são
  rationale: O demonstrativo plural introduz a fórmula de resumo; o presente é natural em português e corresponde à construção nominal hebraica.
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: No contexto do recenseamento tribal, designa grupos amplos de parentesco. “Famílias” é a forma corrente e inteligível em português bíblico moderno, embora não se limite à família nuclear.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Transliteração portuguesa corrente do nome tribal e pessoal.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo as suas famílias
  rationale: A preposição לְ expressa aqui classificação ou distribuição, isto é, o agrupamento conforme as subdivisões de parentesco.
- source_word: וּפְקֻדֵיהֶם
  choice: os que foram contados entre eles
  rationale: A forma derivada de פקד tem sentido censitário e se refere às pessoas registradas. A tradução preserva a referência pessoal sem acrescentar “homens”, ausente nesta cláusula.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: quarenta e cinco mil e quatrocentos
  rationale: Representação direta do numeral cardinal em ordem idiomática portuguesa.
