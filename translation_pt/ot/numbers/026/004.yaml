  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: pt
  text: De vinte anos de idade para cima, conforme Yahweh ordenou a Moisés e aos israelitas que saíram da terra do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: A partir dos vinte anos de idade
  rationale: Expressa naturalmente em português o limiar etário da fórmula hebraica, literalmente “desde um filho de vinte anos e para cima”.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Introduz a correspondência com a ordem divina e se encaixa de modo natural na construção portuguesa.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto explicita a anterioridade da ordem em relação ao recenseamento em curso, sem enfraquecer a força de צוה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino apresentado diretamente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: e aos israelitas
  rationale: בני ישראל é o nome coletivo convencional do povo; “israelitas” é claro, atual e inclui o conjunto da comunidade.
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: que saíram da terra do Egito
  rationale: A oração relativa reproduz o valor identificador do particípio e mantém a expressão geográfica completa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega o Tetragrama como nome próprio; “Yahweh” preserva essa função sem substituí-la por um título.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A frase conserva a forma elíptica do versículo hebraico em seu contexto, sem acrescentar um verbo como “recenseiem” ou “contem” que não aparece neste versículo. A relação sintática mais direta foi mantida: Yahweh ordenou tanto a Moisés como aos israelitas, e a oração “que saíram...” qualifica os israelitas.'
