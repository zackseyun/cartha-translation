base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: pt
  text: 'Os filhos de Manassés: de Maquir, o clã dos maquiritas; e Maquir gerou Gileade; de Gileade, o clã dos gileaditas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Os filhos de Manassés
  rationale: Preserva a forma genealógica hebraica “filhos de”, que neste contexto censitário também abrange os descendentes e é natural em português bíblico atual.
- source_word: לְמָכִיר
  choice: de Maquir
  rationale: O לְ introduz aqui o ramo genealógico ao qual pertence o clã; “de Maquir” reproduz essa relação de modo conciso e idiomático.
- source_word: מִשְׁפַּחַת הַמָּכִירִי
  choice: o clã dos maquiritas
  rationale: No censo tribal, מִשְׁפָּחָה designa uma subdivisão do povo maior que a família doméstica; “clã” é preciso, e o gentílico coletivo é vertido no plural.
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: Maquir gerou Gileade
  rationale: “Gerou” é a forma portuguesa corrente e digna para o verbo genealógico causativo הוֹלִיד, sem o arcaísmo de “engendrou”.
- source_word: לְגִלְעָד
  choice: de Gileade
  rationale: Mantém o paralelismo com “de Maquir” e expressa o ramo descendente introduzido pelo לְ.
- source_word: מִשְׁפַּחַת הַגִּלְעָדִי
  choice: o clã dos gileaditas
  rationale: “Clã” corresponde ao nível social indicado por מִשְׁפָּחָה neste censo, enquanto “gileaditas” traduz naturalmente o gentílico coletivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomenclatura genealógica tradicional e legível no Brasil. A pontuação preserva a estrutura enumerativa do hebraico. A conjunção antes de “Maquir gerou” foi omitida por fluidez em português, sem alterar a relação entre as orações.
