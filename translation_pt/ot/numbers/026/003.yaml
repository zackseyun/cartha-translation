base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: pt
  text: 'Moisés e Eleazar, o sacerdote, falaram-lhes nas planícies de Moabe, junto ao Jordão, na altura de Jericó[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto ao Jordão, defronte de Jericó”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falaram
  rationale: O singular hebraico com sujeito composto pode ser expresso naturalmente pelo plural em português. “Falaram” mantém a distinção em relação a לֵאמֹר, traduzido por “dizendo”.
- source_word: מֹשֶׁה וְאֶלְעָזָר
  choice: Moisés e Eleazar
  rationale: Formas consagradas em português para os nomes hebraicos; constituem o sujeito composto.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Preserva o título definido em aposição a Eleazar, sem acrescentar “sumo”, que não aparece no texto.
- source_word: אֹתָם
  choice: com eles
  rationale: O marcador de objeto com sufixo identifica os destinatários. Com o verbo “falar”, “falaram com eles” é idiomático e não pressupõe aqui uma preposição hebraica explícita.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: עַרְבוֹת designa a região plana ou de estepe; “planícies” é claro, natural e adequado à expressão geográfica.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: junto ao Jordão, na altura de Jericó
  rationale: A formulação situa as planícies junto ao Jordão e em relação geográfica a Jericó. “Na altura de Jericó” preserva essa relação sem afirmar que o local ficava na própria cidade.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula hebraica que introduz o conteúdo da fala no versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A vírgula em “Eleazar, o sacerdote,” explicita a aposição. A alternativa geográfica genuína foi preservada em nota.
