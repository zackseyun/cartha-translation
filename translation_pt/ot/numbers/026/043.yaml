  yaml_path: translation/ot/numbers/026/043.yaml
  text: All the families of the Shuhamites[a], according to those numbered among them, were sixty-four thousand four hundred.
translation:
  language: pt
  text: Todas as famílias dos suamitas[a], segundo os que foram contados entre eles, eram sessenta e quatro mil e quatrocentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os clãs dos suamitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todas
  rationale: Expressa de maneira direta a totalidade das famílias resumidas no censo.
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: No contexto tribal e censitário, o termo designa grupos genealógicos e pode significar “famílias” ou “clãs”; “famílias” é natural e tradicional em português.
- source_word: הַשּׁוּחָמִי
  choice: dos suamitas
  rationale: O gentílico identifica os descendentes ou o clã ligado a Suã; a forma portuguesa “suamitas” comunica a identidade coletiva.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo os que foram contados entre eles
  rationale: Preserva o sentido censitário de פקד, referindo-se às pessoas registradas e contadas como base do total.
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: sessenta e quatro mil e quatrocentos
  rationale: Apresenta o total exato na forma numérica corrente do português.
