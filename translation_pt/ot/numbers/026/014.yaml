lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O pronome demonstrativo plural introduz o resumo do recenseamento; a construção apresentativa no presente reproduz naturalmente a oração nominal hebraica.
- source_word: מִשְׁפְּחֹת
  choice: clãs
  rationale: No contexto tribal e censitário, o termo designa subdivisões de parentesco dentro da tribo; «clãs» é mais preciso que «famílias».
- source_word: הַשִּׁמְעֹנִי
  choice: dos simeonitas
  rationale: O gentílico singular com artigo tem sentido coletivo e se refere aos integrantes da tribo de Simeão; o plural português expressa isso naturalmente.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: vinte e dois mil e duzentos
  rationale: Forma cardinal corrente em português para o total do recenseamento, 22.200.
