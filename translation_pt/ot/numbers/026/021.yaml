base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: pt
  text: 'Os filhos de Perez foram estes: de Hezrom, o clã dos hezronitas; de Hamul, o clã dos hamulitas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram estes
  rationale: No contexto da fórmula genealógica do censo, o verbo introduz a lista dos filhos e seus clãs. “Foram estes” é natural em português e explicita a função apresentativa sem acrescentar conteúdo.
- source_word: בְנֵי
  choice: filhos de
  rationale: O contexto apresenta os filhos homens de Perez como antepassados dos clãs; “filhos de” preserva a forma genealógica do hebraico.
- source_word: פֶרֶץ
  choice: Perez
  rationale: Forma corrente e reconhecível do nome hebraico em português moderno.
- source_word: לְחֶצְרֹן
  choice: de Hezrom
  rationale: Nesta fórmula censitária, לְ indica a pessoa da qual procede o clã. A preposição “de” comunica essa relação de descendência de modo idiomático.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: Em Números, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo; “clã” distingue adequadamente essa unidade da família doméstica.
- source_word: הַחֶצְרֹנִי
  choice: hezronitas
  rationale: A forma gentílica identifica coletivamente os descendentes de Hezrom; o plural português expressa o grupo com clareza.
- source_word: לְחָמוּל
  choice: de Hamul
  rationale: Como no caso de Hezrom, לְ marca aqui a linhagem ou o agrupamento derivado de Hamul.
- source_word: הֶחָמוּלִי
  choice: hamulitas
  rationale: A forma gentílica designa o grupo descendente de Hamul; “hamulitas” reproduz naturalmente essa função em português.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe de lista adequada ao contexto censitário. Mantêm-se “filhos” e “clã” para preservar, respectivamente, a relação genealógica masculina imediata e a unidade social indicada no hebraico. Os nomes seguem formas portuguesas correntes: Perez, Hezrom e Hamul.'
