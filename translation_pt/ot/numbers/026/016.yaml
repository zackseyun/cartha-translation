  yaml_path: translation/ot/numbers/026/016.yaml
  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: pt
  text: de Ozni[a], o clã dos oznitas; de Eri[b], o clã dos eritas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a família do oznita”. O hebraico emprega um termo de clã e uma forma gentílica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a família do erita”. O hebraico emprega um termo de clã e uma forma gentílica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: de Ozni
  rationale: Nesta fórmula censitária, לְ introduz a linhagem do ancestral; em português, “de” expressa isso de maneira natural. O nome pessoal é transliterado.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה designa uma subdivisão de parentesco mais ampla que a família nuclear; “clã” preserva melhor esse sentido.
- source_word: הָ/אָזְנִי
  choice: os oznitas
  rationale: A forma gentílica com artigo identifica o grupo descendente de Ozni; o plural gentílico português é claro e natural.
- source_word: לְ/עֵרִי
  choice: de Eri
  rationale: Como na expressão anterior, לְ tem função genealógica e é vertido naturalmente por “de”. O nome pessoal é transliterado.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: A repetição mantém uniforme a fórmula da lista de clãs.
- source_word: הָ/עֵרִי
  choice: os eritas
  rationale: A forma gentílica com artigo indica o grupo descendente de Eri; o plural gentílico português comunica esse valor.
