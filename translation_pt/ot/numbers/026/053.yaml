  yaml_path: translation/ot/numbers/026/053.yaml
  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: pt
  text: A estes a terra será repartida como herança, de acordo com o número dos nomes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de acordo com o número de pessoas”; literalmente, “de acordo com o número de nomes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: A estes
  rationale: A preposição לְ com o demonstrativo plural indica os destinatários da distribuição; “A estes” preserva esse sentido dativo de modo natural.
- source_word: תֵּחָלֵק
  choice: será repartida
  rationale: O nifal imperfeito de חלק expressa a divisão da terra. “Será repartida” comunica claramente a distribuição em porções e se ajusta ao contexto de herança.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da distribuição territorial entre Israel, “a terra” é a correspondência direta, tradicional e natural.
- source_word: בְּנַחֲלָה
  choice: como herança
  rationale: נַחֲלָה designa propriedade herdada ou possessão atribuída; “como herança” conserva tanto o aspecto jurídico quanto o pactual.
- source_word: בְּמִסְפַּר
  choice: de acordo com o número de
  rationale: A preposição בְּ indica aqui critério ou medida; a expressão portuguesa transmite que a repartição deve seguir a contagem.
- source_word: שֵׁמוֹת
  choice: nomes
  rationale: O hebraico diz literalmente “nomes”. A manutenção desse termo preserva a formulação da fonte, enquanto a nota esclarece seu sentido contextual de pessoas contadas.
