  text: וְ/שֵׁ֣ם אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֨בֶד֙ בַּת לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛/הּ לְ/לֵוִ֖י בְּ/מִצְרָ֑יִם וַ/תֵּ֣לֶד לְ/עַמְרָ֗ם אֶֽת אַהֲרֹן֙ וְ/אֶת מֹשֶׁ֔ה וְ/אֵ֖ת מִרְיָ֥ם אֲחֹתָֽ/ם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: pt
  text: O nome da esposa de Anrão era Joquebede, filha de Levi[a], que nasceu para Levi no Egito[b]. Ela deu à luz, para Anrão, Arão e Moisés, e Miriã, irmã deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filha de Levi”. Em contextos genealógicos, “filha” às vezes pode ter o sentido mais amplo de descendente do sexo feminino.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “a quem ela deu à luz para Levi no Egito”; a mãe não é identificada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: O nome da mulher de Anrão
  rationale: Reproduz com naturalidade a fórmula nominal e a relação de posse; a conjunção inicial pode ser omitida em português sem perda do vínculo narrativo.
- source_word: יוֹכֶבֶד
  choice: Joquebede
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: בַּת לֵוִי
  choice: filha de Levi
  rationale: Mantém a expressão hebraica sem substituí-la interpretativamente por “descendente”.
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: a qual sua mãe deu à luz a Levi no Egito
  rationale: Preserva a construção ativa do hebraico, inclusive o sujeito materno implícito, explicitando-o apenas pronominalmente para que a frase seja inteligível em português.
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: Ela deu a Anrão
  rationale: Expressa de modo conciso a maternidade e a relação dos filhos com Anrão, evitando a repetição pouco natural de “deu à luz a Anrão” imediatamente após a oração anterior.
- source_word: וְאֵת מִרְיָם אֲחֹתָם
  choice: e Miriã, irmã deles
  rationale: Conserva a ordem da aposição hebraica em português claro e natural.
theological_decisions:
- issue: Sentido genealógico de בַּת לֵוִי (“filha de Levi”)
  choice: Manter “filha de Levi” no texto principal.
  alternative: “descendente de Levi”
  rationale: A tradução não resolve por paráfrase a possível tensão cronológica ou genealógica, preservando a formulação da fonte.
- issue: Identidade da mulher que deu Joquebede à luz
  choice: Referi-la apenas como “sua mãe”.
  alternative: 'Reformular na voz passiva: “que nasceu a Levi no Egito”.'
  rationale: O verbo hebraico é ativo e feminino, mas não identifica a mãe; a tradução preserva essa indeterminação sem inventar um nome ou vínculo adicional.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas bíblicas consagradas dos nomes. A formulação mantém a tensão genealógica do hebraico e evita harmonização interpretativa.
