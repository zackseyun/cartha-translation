  rationale: Forma tradicional e amplamente reconhecida em português para o nome próprio hebraico קֹרַח.
- source_word: לֹא
  choice: não
  rationale: Negação direta do verbo, expressa de modo natural em português.
- source_word: מֵתוּ
  choice: morreram
  rationale: Forma perfeita plural do verbo מות, “morrer”; o pretérito perfeito comunica de modo claro a afirmação narrativa de que eles não morreram.
