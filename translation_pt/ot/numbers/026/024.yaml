base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: pt
  text: de Jasube, o clã dos jasubitas; de Sinrom, o clã dos sinronitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: de Jasube
  rationale: Neste recenseamento, לְ diante do nome pessoal introduz o antepassado do qual o clã recebe seu nome; “de” reproduz naturalmente essa relação em português.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro da tribo; “clã” é mais preciso do que “família”.
- source_word: הַ/יָּשׁוּבִי
  choice: jasubitas
  rationale: A forma gentílica identifica os descendentes de Jasube; o gentílico plural português expressa o nome coletivo de modo conciso.
- source_word: לְ/שִׁמְרֹן
  choice: de Sinrom
  rationale: Como no primeiro membro do versículo, לְ introduz o antepassado epônimo do clã; “de” mantém o paralelismo da fórmula.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: A mesma expressão é mantida no segundo membro para preservar a estrutura repetitiva da lista censitária.
- source_word: הַ/שִּׁמְרֹנִי
  choice: sinronitas
  rationale: A forma gentílica designa o grupo descendente de Sinrom; o plural gentílico é natural e claro em português.
