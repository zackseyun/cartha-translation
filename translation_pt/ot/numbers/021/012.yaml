  yaml_path: translation/ot/numbers/021/012.yaml
  text: From there they set out and camped by the Wadi Zered[a].
translation:
  language: pt
  text: Dali partiram e acamparam no vale de Zerede[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na ravina de Zerede”, “no uádi de Zerede” ou “junto ao ribeiro de Zerede”. O termo hebraico náhal pode indicar um vale, uma ravina, um leito de curso de água sazonal ou o próprio ribeiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Dali
  rationale: A expressão adverbial indica a partida do local anterior; “Dali” é natural, conciso e mantém a sequência narrativa.
- source_word: נָסָעוּ
  choice: partiram
  rationale: Em relatos de viagem, נסע descreve levantar acampamento e seguir viagem. “Partiram” comunica com clareza o movimento a partir do acampamento anterior.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה significa montar ou estabelecer acampamento; “acamparam” é a forma corrente e adequada ao contexto de viagem.
- source_word: בְּנַחַל
  choice: junto ao vale
  rationale: נַחַל pode designar um vale estreito, uma ravina, um leito sazonal ou o curso de água associado. “Junto ao vale” oferece uma leitura natural sem pressupor que houvesse água corrente, enquanto a nota preserva a amplitude do termo.
- source_word: זָרֶד
  choice: Zerede
  rationale: Nome geográfico próprio, apresentado na forma transliterada tradicional e facilmente pronunciável em português.
