base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: pt
  text: 'Então o povo foi até Moisés e disse: “Pecamos, pois falamos contra Yahweh e contra você. Ore a Yahweh para que ele afaste de nós a serpente[a].” E Moisés orou pelo povo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as serpentes”. O substantivo hebraico está no singular, mas pode representar coletivamente a praga de serpentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: Então o povo foi
  rationale: O waw consecutivo faz a narrativa avançar. “Então” preserva a sequência, e “foi a Moisés” é natural em português para o movimento em direção a ele.
- source_word: חָטָאנוּ
  choice: Pecamos
  rationale: O perfeito expressa a ação reconhecida na confissão. O pretérito perfeito é a forma idiomática e direta em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a confissão, mantendo clara a relação causal.
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: falamos contra Yahweh e contra você
  rationale: דבר com ב tem aqui o sentido de fala hostil. A repetição de “contra” mantém o paralelismo e evita ambiguidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, em vez de substituí-lo por um título.
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: Ore a Yahweh
  rationale: O hitpael de פלל significa orar ou interceder; “ore a” é direto e corrente, e o contexto deixa clara a natureza intercessória do pedido.
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: para que ele afaste de nós
  rationale: Após o imperativo, a forma verbal expressa o resultado pretendido da oração. “Afaste de nós” comunica de maneira natural a remoção da ameaça.
- source_word: אֶת הַנָּחָשׁ
  choice: a serpente
  rationale: Preserva o substantivo singular do hebraico e um registro narrativo digno; o singular pode representar coletivamente a praga de serpentes.
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: E Moisés orou pelo povo
  rationale: בְּעַד indica ação em favor de alguém. “Orou pelo povo” expressa naturalmente a intercessão.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o tetragrama. “Yahweh” conserva no texto o caráter de nome próprio sem impor uma substituição tradicional por título.
- issue: Singular de הַנָּחָשׁ no contexto da praga
  choice: a serpente, com nota sobre o possível sentido coletivo
  alternative: as serpentes
  rationale: Mantém a forma singular da fonte e preserva a ambiguidade entre uma referência singular representativa e a praga entendida coletivamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome “você” torna explícita a referência singular a Moisés sem arcaísmo; a sintaxe conserva a concisão e a progressão narrativa do hebraico.
