  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: pt
  text: 'Pois fogo saiu de Hesbom,

    uma chama saiu da cidade de Seom;

    consumiu Ar de Moabe[a],

    os senhores dos lugares altos do Arnom[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cidade de Moabe”. O hebraico עָר pode ser entendido aqui como o nome próprio Ar ou como “cidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os donos das alturas do Arnom”. A expressão hebraica também pode designar os possuidores ou habitantes das elevações da região do Arnom.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou explicação do verso anterior, preservando a ligação causal do cântico.
- source_word: אֵשׁ יָצְאָה מֵחֶשְׁבּוֹן
  choice: de Hesbom saiu fogo
  rationale: Mantém a imagem concreta e a ordem poética marcada, em português natural. Hesbom é a forma portuguesa tradicional do topônimo.
- source_word: לֶהָבָה מִקִּרְיַת סִיחֹן
  choice: uma chama, da cidade de Seom
  rationale: Reproduz o paralelismo com o primeiro verso; קִרְיַת é entendido como o substantivo comum 'cidade', e Seom é a forma portuguesa do nome.
- source_word: אָכְלָה
  choice: consumiu
  rationale: Expressa de modo natural a metáfora hebraica de o fogo devorar, sem acrescentar um pronome cujo referente seria menos claro em português.
- source_word: עָר מוֹאָב
  choice: Ar de Moabe
  rationale: Toma עָר como o topônimo conhecido Ar, e não simplesmente como o substantivo 'cidade'; a alternativa é registrada em nota.
- source_word: בַּעֲלֵי בָּמוֹת אַרְנֹן
  choice: os senhores dos lugares altos do Arnom
  rationale: Traduz diretamente בַּעֲלֵי como 'senhores' e preserva בָּמוֹת como 'lugares altos', sem eliminar a possibilidade geográfica de 'alturas'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com disposição em linhas para preservar o paralelismo poético. Empregam-se as formas portuguesas Hesbom, Seom, Moabe e Arnom. A formulação mantém a construção difícil do hebraico em vez de identificar interpretativamente quem seriam os “senhores”.
