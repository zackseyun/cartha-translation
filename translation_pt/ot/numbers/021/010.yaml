lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: No contexto dos itinerários pelo deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e comunica o início da etapa seguinte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a expressão hebraica literal e seu sentido coletivo como designação do povo.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: חנה é o verbo habitual para estabelecer acampamento; “acamparam” é claro e corrente em português.
- source_word: בְּאֹבֹת
  choice: em Obote
  rationale: O nome geográfico é transliterado, e a preposição “em” soa natural em português com o verbo “acampar”.
- source_word: וַ
  choice: Então
  rationale: O waw narrativo faz avançar a sequência do itinerário; “Então” expressa essa progressão de modo natural.
