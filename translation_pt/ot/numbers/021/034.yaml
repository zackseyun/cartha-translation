  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Não tenha medo dele, pois eu o entreguei em sua mão[a], com todo o seu povo e a sua terra. Você fará com ele o mesmo que fez com Seom, rei dos amorreus, que morava em Hesbom.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dei em sua mão”, expressão que significa entregar alguém ao poder de outra pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Não tenha medo dele
  rationale: Expressa em português atual e natural a proibição direta do verbo ירא no qal.
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: eu o entreguei em suas mãos
  rationale: Preserva a imagem hebraica da mão e comunica a entrega de alguém ao poder de outro; o perfeito é mantido para refletir a certeza da ação anunciada por Deus.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: com todo o seu povo e a sua terra
  rationale: Mantém os três objetos da entrega — o rei, o povo e a terra — com coordenação natural em português.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Você fará com ele o mesmo que fez
  rationale: Reproduz claramente a comparação entre o tratamento futuro de Ogue, implícito no contexto, e o tratamento anterior de Seom.
- source_word: סִיחֹן
  choice: Seom
  rationale: Emprega a forma tradicional e reconhecível do nome em português.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: que morava em Hesbom
  rationale: O particípio יוֹשֵׁב descreve residência; 'morava' é corrente e adequado ao referente passado.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o nome próprio divino. Mantê-lo como Yahweh preserva essa distinção sem substituir o nome por um título.
- issue: Perfeito profético em נָתַתִּי
  choice: eu o entreguei
  alternative: eu o entregarei; eu o estou entregando
  rationale: A forma perfeita apresenta a vitória como já assegurada da perspectiva de Yahweh; o pretérito perfeito conserva essa tensão entre declaração concluída e realização futura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais no Brasil. O tratamento singular dirigido a Moisés é expresso por “você”, e a imagem hebraica das mãos é preservada com esclarecimento em nota.
