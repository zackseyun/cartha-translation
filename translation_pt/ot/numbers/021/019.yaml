base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: pt
  text: E de Mataná a Naaliel, e de Naaliel a Bamote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico Bamote também pode significar “alturas” ou “lugares altos”, mas aqui é mais provável que seja o nome de um lugar no itinerário de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: e de Mataná
  rationale: A conjunção וּ é traduzida por “e”, e a preposição מִן, por “de”. מַתָּנָה é tratado como topônimo e transliterado na forma portuguesa Mataná.
- source_word: נַחֲלִיאֵל
  choice: a Naaliel
  rationale: Embora não haja preposição expressa antes do nome, o estilo elíptico do itinerário indica deslocamento entre etapas; acrescenta-se “a” para clareza natural em português. O topônimo é transliterado como Naaliel.
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: e de Naaliel
  rationale: A conjunção e a preposição são vertidas por “e de”, mantendo-se de modo consistente a transliteração do topônimo.
- source_word: בָּמֽוֹת
  choice: Bamote
  rationale: No contexto do itinerário, בָּמוֹת funciona como nome de lugar. A forma Bamote segue uma transliteração adaptada ao português, enquanto o possível sentido lexical comum é preservado em nota.
