  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: pt
  text: Então partiram do monte Hor pelo caminho do mar Vermelho[a], para contornar a terra de Edom, e o povo ficou impaciente no caminho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “pelo caminho do mar dos Juncos”. Hebraico: yam suf.'
    reason: lexical_alternative
  - marker: b
    text: Ou “o povo ficou desanimado no caminho” ou “perdeu o ânimo por causa do caminho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: No formulário dos itinerários do deserto, נסע indica levantar acampamento e seguir viagem. “Partiram” é natural e conciso em português.
- source_word: מֵהֹר הָהָר
  choice: do monte Hor
  rationale: É a forma corrente e idiomática do topônimo הֹר הָהָר em português.
- source_word: דֶּרֶךְ יַם סוּף
  choice: pelo caminho do mar Vermelho
  rationale: דֶּרֶךְ designa aqui a rota; “mar Vermelho” preserva a designação tradicional de יַם סוּף, enquanto a tradução lexical alternativa é registrada em nota.
- source_word: לִסְבֹב
  choice: para contornar
  rationale: O infinitivo expressa finalidade. “Contornar” comunica de modo claro e natural a ideia de seguir ao redor do território de Edom.
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: a terra de Edom
  rationale: אֶרֶץ com um nome geográfico ou de povo significa naturalmente “terra” ou “território”; a formulação escolhida é direta e tradicional.
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: o povo ficou impaciente
  rationale: O idioma hebraico, literalmente relacionado a a vida ou o ânimo tornar-se curto, pode exprimir impaciência, desânimo ou perda de coragem sob pressão. “Ficou impaciente” se ajusta bem ao contexto imediato sem apagar as alternativas.
- source_word: בַּדָּרֶךְ
  choice: no caminho
  rationale: A leitura locativa é a mais direta, embora a preposição também possa sugerir que a jornada ou rota foi a causa do estado do povo; essa possibilidade é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A conjunção “mas” representa o valor contextual contrastivo do waw narrativo sem alterar a sequência. As notas preservam a ambiguidade lexical de יַם סוּף, do idioma קצר נפש e da possível nuance causal de בַּדָּרֶךְ.
