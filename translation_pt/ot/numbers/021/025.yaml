  text: וַ/יִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כָּל הֶ/עָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּ/כָל עָרֵ֣י הָֽ/אֱמֹרִ֔י בְּ/חֶשְׁבּ֖וֹן וּ/בְ/כָל בְּנֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: pt
  text: Israel tomou todas essas cidades e se estabeleceu em todas as cidades dos amorreus, em Hesbom e em todas as localidades que dependiam dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e em todas as suas filhas”; expressão usada para os povoados menores que pertenciam a uma cidade principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: O verbo לקח significa literalmente “tomar”. No contexto militar, “tomou” comunica a conquista sem explicitar além do que o hebraico afirma.
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: todas essas cidades
  rationale: Mantém tanto o sentido usual de עִיר quanto o demonstrativo explícito “essas”.
- source_word: וַיֵּשֶׁב
  choice: se estabeleceu
  rationale: ישׁב pode significar sentar-se, habitar ou estabelecer-se. Aqui descreve Israel passando a ocupar e habitar as cidades conquistadas; “se estabeleceu” expressa naturalmente esse movimento.
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: em todas as cidades dos amorreus
  rationale: Reproduz com clareza a relação de posse ou associação da construção hebraica e usa a forma portuguesa corrente do gentílico.
- source_word: בְּחֶשְׁבּוֹן
  choice: em Hesbom
  rationale: Transliteração portuguesa tradicional e reconhecível do nome próprio חֶשְׁבּוֹן.
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: e em todas as localidades que dependiam dela
  rationale: A expressão idiomática chama de “filhas” os assentamentos menores subordinados a uma cidade principal. A tradução comunica o referente com naturalidade, enquanto a nota preserva a metáfora hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Israel” no hebraico foi reduzida por meio do sujeito implícito na segunda oração, recurso natural em português e sem perda de referência. “Localidades” abrange os assentamentos dependentes sem impor uma classificação moderna rígida entre cidade, vila e povoado.
