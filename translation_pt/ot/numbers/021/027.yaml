base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/027.yaml
  text: Therefore the poets say, “Come to Heshbon; let the city of Sihon be built and established.”
translation:
  language: pt
  text: 'Por isso, os poetas[a] dizem:

    “Venham a Hesbom!

    Que a cidade de Seom seja construída e estabelecida!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que proferem provérbios”, “os bardos”; tradicionalmente, “os governantes”. O particípio hebraico provavelmente se refere aqui a compositores ou recitadores de um cântico proverbial, não a governantes políticos.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Mantém a força conclusiva ou explicativa da locução hebraica e soa natural em português moderno.
- source_word: יֹאמְרוּ
  choice: dizem
  rationale: O imperfeito introduz aqui uma citação proverbial de modo habitual ou gnômico; o presente português comunica bem essa função.
- source_word: הַמֹּשְׁלִים
  choice: os poetas
  rationale: Neste contexto, o particípio designa provavelmente compositores ou recitadores de um dito poético ou proverbial, não governantes. “Poetas” é claro e natural, enquanto a nota preserva as alternativas lexicais.
- source_word: בֹּאוּ
  choice: Venham
  rationale: Traduz diretamente o imperativo masculino plural e preserva o chamado que abre o cântico.
- source_word: חֶשְׁבּוֹן
  choice: Hesbom
  rationale: Emprega a forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: תִּבָּנֶה
  choice: seja construída
  rationale: Representa a forma poética de valor volitivo sem convertê-la indevidamente em simples previsão.
- source_word: וְתִכּוֹנֵן
  choice: e estabelecida
  rationale: Preserva o paralelismo e a ideia de tornar a cidade firme, segura ou consolidada.
- source_word: עִיר סִיחוֹן
  choice: a cidade de Seom
  rationale: Reproduz com clareza a relação do estado construto, usando a forma portuguesa tradicional do nome próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com disposição em versos para evidenciar a citação poética. O imperativo plural “Venham” tem ampla legibilidade brasileira, e o paralelismo hebraico foi mantido sem explicar além do texto.
