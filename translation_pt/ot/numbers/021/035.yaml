base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: pt
  text: Assim, mataram Og, seus filhos e todo o seu povo, sem lhe deixar nenhum sobrevivente, e tomaram posse de sua terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ אֹתוֹ
  choice: mataram Og
  rationale: נכה, neste contexto militar e seguido pela afirmação de que não restou sobrevivente, indica um golpe fatal. O pronome אֹתוֹ retoma Og, identificado no versículo anterior; explicitar o nome torna o referente claro em português.
- source_word: בָּנָיו
  choice: seus filhos
  rationale: O plural masculino בנים designa os filhos homens de Og; “filhos” conserva essa referência de modo natural.
- source_word: כָּל עַמּוֹ
  choice: todo o seu povo
  rationale: עַם significa normalmente “povo” e, aqui, é mais abrangente que “exército”.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: sem lhe deixar nenhum sobrevivente
  rationale: A expressão idiomática comunica a destruição total. Esta formulação natural preserva לוֹ (“lhe”) e traduz שָׂרִיד como “sobrevivente”, adequado ao cenário de guerra.
- source_word: וַיִּירְשׁוּ אֶת אַרְצוֹ
  choice: tomaram posse de sua terra
  rationale: ירשׁ, após uma vitória militar, descreve a tomada e ocupação do território, não uma herança pacífica.
