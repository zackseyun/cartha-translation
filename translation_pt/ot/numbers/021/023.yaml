  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹא נָתַ֨ן סִיחֹ֣ן אֶת יִשְׂרָאֵל֮ עֲבֹ֣ר בִּ/גְבֻל/וֹ֒ וַ/יֶּאֱסֹ֨ף סִיחֹ֜ן אֶת כָּל עַמּ֗/וֹ וַ/יֵּצֵ֞א לִ/קְרַ֤את יִשְׂרָאֵל֙ הַ/מִּדְבָּ֔רָ/ה וַ/יָּבֹ֖א יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: pt
  text: Mas Seom não permitiu que Israel passasse pelo seu território[a]. Então Seom reuniu todo o seu povo[b] e saiu ao encontro de Israel no deserto. Chegou a Jaza[c] e lutou contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «atravessasse a sua fronteira».'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz «todo o seu povo»; embora o contexto militar sugira uma força armada, o texto não diz explicitamente «exército».
    reason: lexical_alternative
  - marker: c
    text: O nome deste lugar também pode ser transliterado como «Jaaz».
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַן
  choice: não permitiu
  rationale: Na construção com o infinitivo עֲבֹר, o verbo tem sentido idiomático de conceder permissão; «não permitiu» é natural e fiel em português.
- source_word: עֲבֹר
  choice: que Israel passasse
  rationale: Expressa o trânsito de Israel pelas terras de Seom de forma corrente em português.
- source_word: בִּגְבֻלוֹ
  choice: pelo seu território
  rationale: גְּבוּל pode indicar limite, fronteira ou território; aqui, o contexto de passagem por uma região favorece «território».
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: reuniu todo o seu povo
  rationale: Preserva a formulação hebraica sem substituir «povo» por «exército», embora o contexto seja militar.
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: ao encontro de Israel
  rationale: Mantém o sentido básico da expressão; a hostilidade é explicitada depois pelo verbo «lutou».
- source_word: הַמִּדְבָּרָה
  choice: no deserto
  rationale: O ה direcional indica movimento rumo ao deserto; em português, a combinação com «saiu ao encontro» permite «no deserto» de modo natural, situando o encontro sem negar o movimento.
- source_word: יָהְצָה
  choice: Jaza
  rationale: Forma portuguesa tradicional e clara do topônimo hebraico יַהַץ/יָהְצָה.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: lutou contra Israel
  rationale: A construção de לחם com ב indica combate hostil; «contra» torna essa relação inequívoca em português.
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção introduz contraste com o pedido anterior de passagem, bem expresso por «Mas».
