  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: pt
  text: 'o poço que os príncipes cavaram,

    que os nobres do povo escavaram

    com o cetro do governante,[a]

    com os seus cajados.

    E do deserto foram para Mataná.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo legislador”, caso מְחֹקֵק seja entendido como pessoa, e não como o cetro de um governante.'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico diz literalmente apenas: “e do deserto, Mataná”; pelo contexto, trata-se provavelmente de uma transição no itinerário: “e do deserto para Mataná”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: o poço
  rationale: Embora não haja artigo explícito, o contexto retoma o poço celebrado no versículo anterior; o artigo definido é natural em português.
- source_word: חֲפָרוּהָ
  choice: cavaram
  rationale: O verbo חפר significa cavar; o sufixo feminino retoma בְּאֵר, e o objeto já está antecipado no verso.
- source_word: שָׂרִים
  choice: príncipes
  rationale: Preserva o sentido de dirigentes de posição elevada e o registro poético, sem reduzir o termo ao mais genérico 'líderes'.
- source_word: כָּרוּהָ
  choice: escavaram
  rationale: Distingue em português os dois verbos hebraicos paralelos de escavação sem alterar seu sentido básico.
- source_word: נְדִיבֵי הָעָם
  choice: os nobres do povo
  rationale: Em paralelo com שָׂרִים, נְדִיבֵי designa mais provavelmente pessoas de posição elevada, não apenas pessoas generosas ou dispostas.
- source_word: בִּמְחֹקֵק
  choice: com o cetro do governante
  rationale: O paralelismo com 'com os seus cajados' favorece um instrumento ligado ao governo. 'Cetro' comunica de modo conciso essa dupla noção de objeto e autoridade.
- source_word: בְּמִשְׁעֲנֹתָם
  choice: com os seus cajados
  rationale: מִשְׁעֵנָה denota um cajado ou apoio; 'cajados' é claro, concreto e apropriado ao paralelismo.
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: E do deserto foram para Mataná
  rationale: O contexto prossegue com uma lista de etapas da viagem. O verbo e a preposição de destino são supridos para tornar explícito em português o movimento elíptico do hebraico.
theological_decisions:
- issue: Sentido de בִּמְחֹקֵק na frase poética
  choice: 'leitura instrumental: ''com o cetro do governante'''
  alternative: 'leitura pessoal: ''pelo legislador''; ou abstrata: ''por decreto'''
  rationale: O paralelo imediato com os cajados favorece um objeto usado como instrumento. A alternativa pessoal permanece possível e é registrada em nota, sem associar a expressão a uma figura teológica posterior.
- issue: Função de וּמִמִּדְבָּר מַתָּנָה
  choice: 'transição de itinerário: ''do deserto foram para Mataná'''
  alternative: 'formulação nominal elíptica: ''e do deserto, Mataná'''
  rationale: Os versículos seguintes enumeram etapas de viagem; a formulação escolhida comunica essa progressão, enquanto a nota preserva a concisão e a elipse do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com disposição em versos para preservar o paralelismo do cântico. 'Príncipes', 'nobres', 'cetro' e 'cajados' mantêm a elevação poética sem linguagem arcaica excessiva. O topônimo מַתָּנָה é transliterado como 'Mataná', com acento para orientar a pronúncia portuguesa.
