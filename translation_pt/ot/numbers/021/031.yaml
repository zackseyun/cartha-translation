  text: So Israel lived in the land of the Amorites[a].
translation:
  language: pt
  text: Assim, Israel viveu na terra dos amorreus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «Assim, Israel habitou na terra dos amorreus».'
    reason: Alternativa lexical para וַיֵּשֶׁב; «habitou» reproduz de modo mais formal o sentido de residir.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: passou a viver
  rationale: O verbo יָשַׁב pode significar sentar-se, habitar, viver ou estabelecer-se. Neste resumo narrativo, «passou a viver» expressa naturalmente a entrada de Israel numa situação de residência no território, sem sugerir necessariamente um estabelecimento definitivo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do povo da aliança.
- source_word: בְּאֶרֶץ
  choice: na terra
  rationale: אֶרֶץ designa aqui uma região ou território definido; «terra» é natural e mantém a linguagem bíblica corrente em português.
- source_word: הָאֱמֹרִי
  choice: dos amorreus
  rationale: Embora a forma hebraica seja singular gentílica, ela tem sentido coletivo neste contexto. O plural «amorreus» é a maneira natural de designar o povo e sua terra em português.
