  text: וַ/יִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽ/יהוָ֖ה וַ/יֹּאמַ֑ר אִם נָתֹ֨ן תִּתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/הַֽחֲרַמְתִּ֖י אֶת עָרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: pt
  text: 'Então Israel fez um voto ao SENHOR, dizendo: “Se de fato entregares[a] este povo em minhas mãos, consagrarei as cidades deles à destruição[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se certamente entregares”. O hebraico intensifica o verbo, literalmente: “se entregar, entregares”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “porei as cidades deles sob o anátema”. O hebraico se refere a destiná-las irrevogavelmente à destruição como ato de ḥerem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: fez um voto
  rationale: A construção cognata hebraica, literalmente “votou um voto”, expressa o ato formal de assumir um compromisso solene; “fez um voto” é a forma natural em português.
- source_word: לַיהוָה
  choice: ao SENHOR
  rationale: Emprega a convenção portuguesa consolidada de representar o nome divino יהוה por “SENHOR” em versaletes.
- source_word: אִם נָתֹן תִּתֵּן
  choice: Se de fato entregares
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “De fato” comunica essa ênfase sem reproduzir de modo artificial a repetição hebraica.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o substantivo coletivo singular e o demonstrativo do hebraico.
- source_word: בְּיָדִי
  choice: em minhas mãos
  rationale: Mantém a imagem hebraica de entregar alguém à mão, isto é, ao poder de outro, usando a forma idiomática corrente em português.
- source_word: וְהַחֲרַמְתִּי
  choice: consagrarei ... à destruição
  rationale: O hifil de חרם indica colocar algo sob ḥerem, destinando-o irrevogavelmente à destruição. A formulação conserva tanto o aspecto de consagração quanto o resultado destrutivo.
- source_word: עָרֵיהֶם
  choice: as cidades deles
  rationale: É a tradução direta de עָרֵיהֶם e deixa claro que as cidades pertencem ao povo mencionado.
theological_decisions:
- issue: A linguagem de חרם no voto de guerra
  choice: consagrarei as cidades deles à destruição
  alternative: destruirei completamente as cidades deles; porei as cidades deles sob o anátema
  rationale: A escolha preserva a dimensão formal e sacral do ḥerem sem reduzir o termo à simples destruição militar nem depender do vocábulo técnico e pouco transparente “anátema”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala coletiva de Israel permanece na primeira pessoa, como no hebraico. Os marcadores de nota foram colocados junto às expressões que explicam.
