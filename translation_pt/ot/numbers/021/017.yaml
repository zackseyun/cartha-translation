  yaml_path: translation/ot/numbers/021/017.yaml
  text: 'Then Israel sang this song: “Spring up[a], O well! Answer it!”'
translation:
  language: pt
  text: 'Então Israel cantou este cântico:


    “Brota[a], ó poço!

    Respondam-lhe!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Sobe, ó poço! Respondam-lhe!” A expressão hebraica provavelmente pertence a uma fórmula de canto responsivo ou antifonal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Advérbio temporal que dá sequência à narrativa; “Então” é o conector mais natural em português.
- source_word: יָשִׁיר
  choice: cantou
  rationale: Embora a forma verbal seja imperfeita, com אָז neste contexto narrativo ela tem valor passado.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio tradicional do povo, mantido na forma portuguesa consagrada.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: este cântico
  rationale: Reproduz o substantivo definido com demonstrativo e preserva o registro poético sem soar arcaico em excesso.
- source_word: עֲלִי
  choice: Brota
  rationale: Imperativo feminino singular dirigido ao poço. No contexto da água, “Brota” expressa de modo natural e vívido o movimento ascendente, enquanto a nota preserva a forma mais literal.
- source_word: בְאֵר
  choice: ó poço
  rationale: O vocativo poético é marcado por “ó”; “poço” é o equivalente corrente para a fonte escavada ou poço mencionado no contexto.
- source_word: עֱנוּ לָהּ
  choice: Respondam-lhe
  rationale: O imperativo plural significa responder. A formulação mantém a possível ideia de resposta coletiva ou antifonal sem substituí-la explicitamente por “cantem”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com disposição em versos para assinalar a citação poética. “Cântico” preserva o tom elevado, enquanto “Brota” comunica naturalmente a imagem da água. O plural “Respondam-lhe” reproduz a mudança do apelo dirigido ao poço para a convocação da comunidade.
