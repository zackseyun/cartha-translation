  language: pt
  text: e a encosta dos uádis[a], que se estende até o local de Ar[b] e se apoia na fronteira de Moabe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vales” ou “ravinas”; o hebraico נְחָלִים frequentemente se refere a leitos de cursos de água sazonais (uádis).
    reason: lexical_alternative
  - marker: b
    text: Ou “até a habitação de Ar” ou “até onde Ar está situada”. A expressão hebraica é difícil e pode indicar o local ou o povoado de Ar.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: encosta
  rationale: Expressa a ideia de declive ou vertente ligada aos cursos de água, com linguagem geográfica natural em português.
- source_word: הַנְּחָלִים
  choice: dos uádis
  rationale: Neste contexto topográfico, נְחָלִים designa provavelmente leitos de cursos de água sazonais; “uádis” preserva essa precisão, enquanto alternativas mais familiares são dadas em nota.
- source_word: אֲשֶׁר נָטָה
  choice: que se estende
  rationale: נָטָה pode significar estender-se ou inclinar-se; aqui a descrição espacial favorece “se estende”.
- source_word: לְשֶׁבֶת עָר
  choice: até o local de Ar
  rationale: A expressão hebraica é difícil. No contexto topográfico, esta formulação indica naturalmente o lugar onde Ar se situa sem excluir a leitura mais literal, registrada em nota.
- source_word: עָר
  choice: Ar
  rationale: Nome geográfico transliterado.
- source_word: וְנִשְׁעַן
  choice: e se apoia
  rationale: Preserva a metáfora de שׁען, “apoiar-se/encostar-se”, aplicada aqui a uma configuração territorial.
- source_word: לִגְבוּל מוֹאָב
  choice: na fronteira de Moabe
  rationale: גְּבוּל indica limite ou fronteira territorial; “fronteira de Moabe” é claro e adequado ao contexto.
