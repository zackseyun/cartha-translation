  terminology: “Estrada do rei” é uma boa tradução de בְּדֶרֶךְ הַמֶּלֶךְ, e a nota oferece de modo útil a alternativa mais literal e a formulação tradicional. “Terra” para אֶרֶץ e “fronteira” para גְּבוּל mantêm adequadamente a distinção terminológica do hebraico.
