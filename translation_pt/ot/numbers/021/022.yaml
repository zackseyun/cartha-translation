base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: pt
  text: “Deixe-me passar pela sua terra. Não nos desviaremos para nenhum campo nem nenhuma vinha e não beberemos água de poço. Seguiremos pela estrada do rei[a] até atravessarmos a sua fronteira.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “pelo caminho do rei”; tradicionalmente, “pela estrada real”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Deixe-me passar
  rationale: O coortativo qal na primeira pessoa do singular expressa aqui um pedido diplomático; a formulação preserva tanto a pessoa gramatical quanto o tom respeitoso.
- source_word: בְאַרְצְךָ
  choice: pela sua terra
  rationale: אֶרֶץ designa a terra sob o domínio do rei; a preposição portuguesa comunica naturalmente a ideia de atravessá-la.
- source_word: לֹא נִטֶּה
  choice: Não nos desviaremos
  rationale: נטה, neste contexto de viagem, indica sair da rota; “desviar-se” é claro e mantém a imagem do percurso.
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: para nenhum campo nem vinha
  rationale: Os substantivos singulares têm sentido genérico/distributivo. “Nenhum... nem...” torna explícita em português a abrangência da negativa sem alterar o sentido.
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: não beberemos água de poço
  rationale: A expressão construta significa literalmente “águas de poço”; a tradução escolhida é natural e indica que não consumiriam os recursos hídricos locais.
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: pela estrada do rei
  rationale: A expressão é literalmente “pelo caminho do rei” e provavelmente designa a via principal ou oficial; “estrada do rei” preserva a forma concreta do hebraico.
- source_word: נֵלֵךְ
  choice: Seguiremos
  rationale: הלך é o verbo comum para ir; no contexto, “seguiremos” combina naturalmente com uma estrada e comunica a continuidade do trajeto.
- source_word: עַד אֲשֶׁר נַעֲבֹר
  choice: até atravessarmos
  rationale: A oração assinala o ponto final do percurso e é expressa de modo direto e idiomático em português.
- source_word: גְּבֻלֶךָ
  choice: o seu território
  rationale: Embora גְּבוּל possa significar “fronteira” ou “limite”, aqui o movimento é através da extensão delimitada do domínio; “território” evita a ideia inadequada de atravessar apenas uma linha fronteiriça.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O discurso direto conserva a passagem do singular no pedido (“Deixe-me”) ao plural nas promessas (“nos”, “beberemos”, “seguiremos”), conforme o hebraico.
