  source_fidelity: A tradução preserva bem o pedido diplomático no singular seguido das garantias no plural, bem como a recusa de se desviar da rota e de beber água de poço. Contudo, גְּבוּלֶךָ significa propriamente “sua fronteira/seu limite”, não “seu território”; o contexto é a saída após atravessar a terra.
