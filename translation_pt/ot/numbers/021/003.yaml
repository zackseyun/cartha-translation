  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: pt
  text: Yahweh ouviu a voz de Israel e entregou os cananeus a Israel. Israel os consagrou à destruição, juntamente com suas cidades. Por isso, o lugar recebeu o nome de Hormá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Hormá está relacionado com a palavra hebraica que significa “consagrado à destruição” ou “colocado sob interdição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: ouviu a voz de
  rationale: Conserva a expressão hebraica e comunica que Yahweh atendeu ao clamor de Israel.
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: lhe entregou os cananeus
  rationale: O verbo נתן, neste contexto hostil, indica entregar alguém ao poder de outro. O singular gentílico hebraico tem sentido coletivo; o plural é mais natural e inequívoco em português.
- source_word: וַיַּחֲרֵם
  choice: consagrou à destruição
  rationale: 'Preserva o sentido técnico de חרם: destinar irrevogavelmente à destruição, sem reduzi-lo ao simples verbo ''destruir''.'
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: os ... juntamente com suas cidades
  rationale: Representa ambos os objetos do verbo e mantém clara a relação entre o povo e suas cidades.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: o lugar recebeu o nome
  rationale: A formulação passiva evita identificar além do texto o sujeito implícito do ato de nomear.
- source_word: חָרְמָה
  choice: Hormá
  rationale: Translitera o topônimo e usa acento para orientar a pronúncia natural em português; a ligação etimológica com חרם é explicada em nota.
theological_decisions:
- issue: Terminologia de guerra associada a חרם
  choice: Israel os consagrou à destruição
  alternative: Israel os destruiu completamente / colocou-os sob interdição
  rationale: A redação conserva o conceito específico de dedicação irrevogável à destruição, evita eufemismo e não acrescenta uma explicação teológica denominacional.
- issue: Sujeito implícito de וַיַּחֲרֵם
  choice: Israel
  alternative: ele / eles
  rationale: O verbo hebraico está no singular, e 'Israel' funciona no contexto como sujeito coletivo. Repetir o nome em português esclarece a referência sem alterar o sentido.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém 'Yahweh', a expressão 'ouviu a voz' e a força técnica de חרם, enquanto verte o gentílico coletivo hebraico no plural natural em português.
