source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: pt
  text: Israel o feriu ao fio da espada e tomou posse de sua terra, desde o Arnom até o Jaboque, até os filhos de Amom[a], pois a fronteira dos filhos de Amom era forte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “até os amonitas”; e, no fim do versículo, “a fronteira dos amonitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: o feriu
  rationale: נכה significa, em sentido básico, “ferir” ou “golpear”. A formulação preserva a força direta do verbo sem afirmar além do texto que ele foi morto.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: A expressão hebraica traz literalmente a imagem da “boca” da espada. “Ao fio da espada” é uma expressão portuguesa natural que mantém essa imagem.
- source_word: וַיִּירַשׁ
  choice: tomou posse de
  rationale: ירש pode indicar a tomada de posse, frequentemente mediante a expulsão dos ocupantes. No contexto militar e com “terra” como objeto, esta opção comunica com clareza a aquisição do território.
- source_word: אַרְצוֹ
  choice: sua terra
  rationale: “Terra” é o equivalente mais direto de אֶרֶץ e se ajusta ao contexto territorial sem introduzir a noção política moderna de “país”.
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: desde o Arnom até o Jaboque
  rationale: O par de preposições delimita a extensão territorial. As formas Arnom e Jaboque seguem o uso bíblico corrente em português.
- source_word: עַד בְּנֵי עַמּוֹן
  choice: até os filhos de Amom
  rationale: A tradução mantém a expressão hebraica de parentesco, embora ela funcione etnicamente como referência aos amonitas. A nota oferece a forma portuguesa mais idiomática.
- source_word: כִּי
  choice: pois
  rationale: Aqui כִּי introduz a razão pela qual a conquista de Israel se estendeu somente até esse limite.
- source_word: עַז
  choice: forte
  rationale: עַז denota força ou poder. “Forte” preserva a amplitude do adjetivo sem especificar que a fronteira era fortificada ou militarmente intransponível.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto, גְּבוּל designa o limite territorial dos filhos de Amom; “fronteira” é natural e mantém esse sentido geográfico.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: A repetição da mesma expressão preserva a coesão lexical do hebraico e sua formulação baseada em parentesco.
theological_decisions:
- issue: Tradução de בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  alternative: os amonitas / o povo de Amom
  rationale: A expressão masculina de parentesco tem força étnica coletiva. O texto principal conserva a forma hebraica de maneira transparente, enquanto a nota esclarece o equivalente étnico idiomático, sem transformar a questão em distinção doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantêm-se a imagem idiomática “ao fio da espada”, a expressão de parentesco “filhos de Amom” e o adjetivo amplo “forte”, sem explicitar além do hebraico a natureza da resistência oferecida pela fronteira.
