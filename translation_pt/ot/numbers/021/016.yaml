  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: pt
  text: 'E dali foram para Beer[a]. Esse é o poço a respeito do qual Yahweh disse a Moisés: “Reúna o povo, e eu lhes darei água.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer é o nome do lugar; em hebraico, esse nome tem a mesma forma da palavra que significa “poço”.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: E dali
  rationale: Mantém a conjunção narrativa e indica a continuação do itinerário de forma natural em português.
- source_word: בְּאֵרָה
  choice: foram para Beer
  rationale: Beer é entendido como nome de lugar. O ה direcional indica movimento para o local; o verbo “foram” é explicitado em português a partir desse elemento e do contexto do itinerário.
- source_word: הִוא הַבְּאֵר
  choice: Esse é o poço
  rationale: Conserva a identificação explicativa entre o lugar chamado Beer e o poço mencionado.
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: a respeito do qual Yahweh disse a Moisés
  rationale: Liga naturalmente o poço à declaração divina que vem em seguida, sem alterar a relação sintática do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱסֹף אֶת־הָעָם
  choice: Reúna o povo
  rationale: Expressa com clareza o imperativo dirigido a Moisés e preserva o sentido coletivo de עָם.
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: e eu lhes darei água
  rationale: O coortativo de primeira pessoa após o imperativo comunica aqui a intenção ou determinação divina; o futuro é a formulação mais natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o tetragrama. “Yahweh” preserva o nome pessoal divino sem o substituir pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível a leitores brasileiros e compreensível internacionalmente. A explicitação de “foram” evita uma frase truncada e traduz o movimento indicado pela terminação direcional hebraica. Não se reproduziu a nota alternativa inglesa marcada como [b], pois ela não corresponde à posição do marcador e não apresenta uma leitura distinta necessária do texto hebraico.
