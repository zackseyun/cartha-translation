base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: pt
  text: 'E o povo falou contra Deus e contra Moisés: “Por que vocês nos fizeram sair do Egito para morrermos no deserto? Pois não há pão nem água, e detestamos este pão desprezível[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este pão miserável” ou “este pão sem valor”. O adjetivo hebraico é raro e expressa desprezo pelo alimento que Deus forneceu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: E o povo falou contra Deus e contra Moisés
  rationale: O verbo דּבר com ב pode ser mais neutro, mas o teor acusatório da fala exige aqui o sentido adversativo “falar contra”, sem ampliar para “blasfemar”.
- source_word: לָמָה הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: Por que vocês nos fizeram sair do Egito
  rationale: O plural do verbo hebraico dirige a acusação a Deus e a Moisés. “Fizeram sair” transmite naturalmente o Hifil de עלה em português, embora não reproduza literalmente a imagem de “subir”.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: para morrermos no deserto
  rationale: Preserva a construção de finalidade e usa “deserto”, termo corrente e adequado ao מִדְבָּר do percurso israelita.
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: Pois não há pão nem água
  rationale: Mantém “pão” para לֶחֶם e conserva a repetição lexical com a última oração, apesar da aparente tensão com a provisão que o povo logo despreza.
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: e estamos fartos
  rationale: A expressão idiomática denota forte aversão ou repulsa. “Estamos fartos” é natural em português, preserva o estado expresso no hebraico e evita o literalismo estranho “nossa alma está desgostosa”.
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: deste pão miserável
  rationale: “Deste” torna idiomática a referência ao alimento presente. O adjetivo raro קְלֹקֵל expressa desprezo; “miserável” preserva essa avaliação sem impor a ideia mais específica de inutilidade.
theological_decisions:
- issue: Caráter da fala do povo contra Deus
  choice: “falou contra Deus e contra Moisés”
  alternative: “falou com Deus e com Moisés” ou “falou de Deus e de Moisés”
  rationale: Embora a construção preposicional possa admitir sentidos mais neutros, a acusação citada torna inequívoca a oposição do povo. A tradução preserva essa força contextual sem acrescentar uma classificação doutrinária.
- issue: Número do sujeito acusado em “vocês nos fizeram sair”
  choice: plural, referindo-se a Deus e a Moisés
  alternative: singular, dirigido somente a Moisés
  rationale: A forma הֶעֱלִיתֻנוּ é plural e retoma os dois alvos mencionados. O português explicita o plural por meio de “vocês”, preservando a acusação dirigida a ambos.
- issue: Tensão entre “não há pão” e “deste pão”
  choice: manter “pão” nas duas ocorrências
  alternative: traduzir a primeira ocorrência por “comida”
  rationale: 'A repetição e a tensão pertencem à formulação da queixa: o povo nega ter pão aceitável enquanto despreza o alimento recebido. A tradução não harmoniza silenciosamente essa retórica.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” comunica de modo natural a forma verbal hebraica dirigida a Deus e a Moisés. Mantiveram-se a repetição de “pão”, a força adversativa da fala e a rara qualificação depreciativa, esclarecida em nota.
