  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: pt
  text: Ai de você[a], Moabe! Você está arruinado, povo de Camos! Ele tornou seus filhos fugitivos e suas filhas cativas de Seom, rei dos amorreus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele tornou os filhos de Moabe fugitivos e as filhas de Moabe cativas de Seom”, entendendo que os sufixos se referem a Moabe, e não a Camos.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: Ai de você
  rationale: Preserva a exclamação poética de lamento e desgraça, com força natural em português.
- source_word: אָבַדְתָּ
  choice: Você está arruinado
  rationale: Expressa a perda catastrófica anunciada no perfeito hebraico sem exigir aniquilação absoluta.
- source_word: עַם כְּמוֹשׁ
  choice: povo de Camos
  rationale: Reproduz a relação construta que identifica Moabe como o povo ligado a Camos.
- source_word: נָתַן
  choice: fez de ... e entregou ... como
  rationale: O verbo literalmente significa 'deu/entregou', mas os complementos descrevem estados resultantes; a formulação portuguesa conserva a agência e produz paralelismo natural.
- source_word: בָּנָיו פְּלֵיטִם
  choice: seus filhos fugitivos
  rationale: Mantém o sufixo masculino singular e o sentido de pessoas que fugiram ou escaparam após a derrota.
- source_word: וּבְנֹתָיו בַּשְּׁבִית
  choice: suas filhas como cativas
  rationale: Conserva o paralelismo entre filhos e filhas e comunica claramente a condição de cativeiro.
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: a Seom, rei dos amorreus
  rationale: Representa o destino ou beneficiário marcado pelo lamed e mantém a identificação apositiva de Seom.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares em בָּנָיו e וּבְנֹתָיו
  choice: 'Referência a Camos: ''seus filhos'' e ''suas filhas''.'
  alternative: 'Referência coletiva a Moabe: ''os filhos de Moabe'' e ''as filhas de Moabe''.'
  rationale: Camos é o antecedente imediato, e a personificação poética apresenta o povo do deus como seus filhos e filhas. A nota preserva a alternativa gramatical real sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Camos' e 'Seom' seguem formas portuguesas bíblicas usuais; a estrutura conserva o caráter de cântico de escárnio e a ambiguidade referencial é registrada em nota.
