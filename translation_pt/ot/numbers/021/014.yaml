id: NUM.21.14
reference: Numbers 21:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּן֙ יֵֽאָמַ֔ר בְּ/סֵ֖פֶר מִלְחֲמֹ֣ת יְהוָ֑ה אֶת וָהֵ֣ב בְּ/סוּפָ֔ה וְ/אֶת הַ/נְּחָלִ֖ים אַרְנֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: pt
  text: 'Por isso se diz no Livro das Guerras de Yahweh: “Vaebe[a] em Sufá[b] e os vales do Arnom”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta linha citada é obscuro; alguns entendem “Vaebe” de outra maneira, até mesmo como parte de uma oração verbal, e não como nome de lugar.
    reason: lexical_alternative
  - marker: b
    text: Ou, possivelmente, “Vaebe na tempestade”, caso Sufá seja entendido como substantivo comum, e não como nome de lugar.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Expressa de modo natural a relação inferencial da fórmula hebraica que introduz a citação.
- source_word: יֵאָמַר
  choice: se diz
  rationale: O nifal tem aqui sentido impessoal e introduz uma citação de uma fonte conhecida.
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: no Livro das Guerras de Yahweh
  rationale: Mantém a construção de título, o plural “Guerras” e o nome divino pessoal.
- source_word: אֶת וָהֵב
  choice: Vaebe
  rationale: Trata וָהֵב, com cautela, como nome próprio e evita impor um sentido verbal conjectural a uma linha obscura.
- source_word: בְּסוּפָה
  choice: em Sufá
  rationale: A transliteração como topônimo preserva a leitura provável sem eliminar a possibilidade de o termo significar “tempestade”.
- source_word: וְאֶת הַנְּחָלִים
  choice: e os vales
  rationale: נְחָלִים pode designar vales ou leitos de cursos de água sazonais; “vales” é claro em português e adequado ao contexto geográfico.
- source_word: אַרְנוֹן
  choice: do Arnom
  rationale: Emprega a forma portuguesa tradicional do nome geográfico e relaciona os vales ao sistema do Arnom.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: Preserva o nome pessoal divino no título da obra citada, em vez de substituí-lo por um título.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas onomásticas de boa legibilidade brasileira. A estrutura concisa de citação foi mantida, e as incertezas lexicais do hebraico foram preservadas em notas sem resolver indevidamente o texto.
