  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: pt
  text: Quando o cananeu, rei de Arade, que habitava no Neguebe, soube que Israel vinha pelo caminho de Atarim[a], lutou contra Israel e levou alguns israelitas como prisioneiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pelo caminho de Atarim”. O sentido de “Atarim” é incerto. Alguns o entendem como nome de lugar; outros, com base em versões antigas, como “os espiões” ou “os batedores”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: soube
  rationale: No contexto narrativo, שׁמע indica que o rei recebeu a notícia; “soube” expressa isso naturalmente em português.
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: o cananeu, rei de Arade
  rationale: Preserva a designação étnica definida e o título geográfico em aposição, sem transformar “cananeu” em mero adjetivo.
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: que habitava no Neguebe
  rationale: O particípio denota residência; “habitava” mantém um registro digno e claro, e “Neguebe” preserva o nome da região.
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: que Israel vinha
  rationale: Após “soube”, כִּי introduz o conteúdo da notícia; “vinha” representa a aproximação em curso sugerida pelo contexto.
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: pelo caminho de Atarim
  rationale: Mantém conservadoramente o termo incerto como possível topônimo e registra outras interpretações em nota.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: lutou contra Israel
  rationale: Tradução direta da expressão de combate, sem ampliar indevidamente a escala do conflito.
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: levou alguns israelitas como prisioneiros
  rationale: Expressa em português natural a tomada de pessoas dentre o Israel coletivo como cativos de guerra.
