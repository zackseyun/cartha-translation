  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: pt
  text: Então Moisés fez uma serpente de bronze[a] e a colocou sobre a haste[b]. E acontecia que, se a serpente mordia alguém[c], essa pessoa olhava para a serpente de bronze[d] e vivia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de cobre”. O termo hebraico pode designar cobre ou bronze.
    reason: lexical_alternative
  - marker: b
    text: Ou “estandarte” ou “sinal”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “um homem”, empregado aqui em sentido representativo para qualquer pessoa mordida.'
    reason: lexical_alternative
  - marker: d
    text: Este acontecimento é retomado tipologicamente em João 3:14–15.
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: serpente
  rationale: Preserva a repetição lexical do hebraico entre a serpente feita por Moisés e a serpente que mordia, com tom narrativo digno e natural.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: É a designação tradicional e corrente em português neste contexto, embora o termo hebraico também possa referir-se a cobre.
- source_word: הַנֵּס
  choice: a haste
  rationale: Expressa naturalmente o suporte erguido sobre o qual a serpente foi colocada, sem restringir o termo ao sentido militar de estandarte.
- source_word: וְהָיָה
  choice: E acontecia que
  rationale: 'O aspecto e o contexto descrevem uma circunstância repetida: sempre que alguém era mordido e olhava, vivia.'
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: se uma serpente mordia alguém
  rationale: Em português natural, o indefinido representa qualquer serpente do contexto e 'alguém' comunica a função genérica de אִישׁ sem sugerir que apenas homens estavam incluídos.
- source_word: וְהִבִּיט אֶל
  choice: olhava para
  rationale: Traduz diretamente o ato de dirigir o olhar, sem acrescentar ao texto uma nuance teológica de confiança.
- source_word: וָחָי
  choice: vivia
  rationale: No quadro habitual introduzido por 'acontecia', o imperfeito português comunica o resultado reiterado sem interpretar excessivamente como mera sobrevivência.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ
  choice: alguém
  alternative: um homem
  rationale: אִישׁ tem forma masculina singular, mas aqui é representativo de qualquer pessoa mordida. 'Alguém' preserva esse alcance natural em português sem alterar o referente.
- issue: Possível leitura tipológica de וְהִבִּיט אֶל
  choice: olhava para
  alternative: punha os olhos em
  rationale: A formulação neutra preserva o sentido imediato do hebraico. A associação tipológica posterior com João 3:14–15 é informada em nota, não inserida na tradução.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção iterativa 'acontecia que... mordia... olhava... vivia' reflete melhor o valor contextual da sequência hebraica do que uma série de pretéritos perfeitos. Todos os marcadores de nota aparecem no texto principal.
