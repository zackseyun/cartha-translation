review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite corretamente a sequência central: Moisés faz uma serpente de bronze, coloca-a sobre um suporte erguido, e a pessoa mordida que olha para ela vive. Contudo, o artigo definido em הַנָּחָשׁ é mais bem preservado por “a serpente” no segundo enunciado; não se trata de introduzir uma serpente qualquer, mas da serpente no cenário já estabelecido. A formulação condicional-habitual com “acontecia que” e imperfeitos é defensável no contexto e preserva o resultado reiterado sem acrescentar interpretação teológica.'
  naturalness: O texto é claro e de registro adequado. Porém, “se uma serpente mordia alguém[c], e essa pessoa olhava...” é sintaticamente pouco fluente em português atual, sobretudo pelo “e” após a oração introduzida por “se” e pelo demonstrativo “essa pessoa”. “Se a serpente mordia alguém, essa pessoa olhava ... e vivia” resolve a fluência e mantém o valor habitual.
  terminology: “Serpente”, “bronze” e “haste” são escolhas adequadas. A nota de “bronze/cobre” é precisa. Para נֵס, “estandarte” e “sinal” são alternativas lexicais seguras; “poste” descreve o suporte físico inferido pelo contexto, mas é menos diretamente uma alternativa lexical do substantivo hebraico. A nota tipológica é fiel ao registro de João 3:14–15 e permanece fora do texto principal.
  issues:
  - severity: low
    issue: Artigo indefinido em “se uma serpente mordia alguém”
    rationale: O hebraico traz הַנָּחָשׁ, “a serpente”. O definido mantém melhor a referência ao agente já presente no episódio e à formulação da fonte.
  - severity: low
    issue: Coordenação pouco natural após a condição
    rationale: A sequência “se ..., e essa pessoa ...” é compreensível, mas desnecessariamente calcada na coordenação hebraica. Em português, retirar o “e” melhora a leitura sem perda de conteúdo.
  - severity: low
    issue: “Poste” como alternativa de nota para נֵס
    rationale: O termo pode significar sinal, estandarte ou bandeira; “poste” é uma concretização contextual do suporte, não a alternativa lexical mais direta. A nota pode limitar-se às alternativas semanticamente mais próximas.
