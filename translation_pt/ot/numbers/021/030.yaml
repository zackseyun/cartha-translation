  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: pt
  text: E atiramos contra eles[a]; Hesbom pereceu até Dibom, e devastamos até Nofá[b], que se estende até Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da oração inicial é difícil e tem sido entendido de várias maneiras, entre elas: “nós os derrotamos” ou “o domínio deles pereceu”.'
    reason: textual_variant
  - marker: b
    text: A forma traduzida por “devastamos” também é incerta; alguns a interpretam de outra maneira, mas o contexto favorece um verbo de devastação neste cântico de vitória.
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: E atiramos contra eles
  rationale: A forma hebraica é notoriamente difícil. A leitura como forma verbal ligada à ideia de atirar, com sujeito na primeira pessoa do plural e sufixo de terceira pessoa do plural, produz uma imagem militar vívida adequada ao cântico de vitória; a incerteza é preservada em nota.
- source_word: אָבַד
  choice: pereceu
  rationale: Expressa perecimento ou destruição e preserva de modo natural o aspecto perfectivo no registro poético.
- source_word: חֶשְׁבּוֹן
  choice: Hesbom
  rationale: Forma portuguesa tradicional e reconhecível do topônimo bíblico.
- source_word: עַד דִּיבוֹן
  choice: até Dibom
  rationale: עַד indica o limite ou alcance territorial; 'até' é a formulação portuguesa mais natural.
- source_word: וַנַּשִּׁים
  choice: e devastamos
  rationale: Embora a forma seja difícil, o contexto de conquista favorece uma forma verbal na primeira pessoa do plural referente à devastação. A incerteza é assinalada em nota.
- source_word: עַד נֹפַח
  choice: até Nofá
  rationale: עַד marca extensão, e Nofá é uma transliteração portuguesa clara do topônimo.
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: que se estende até Medeba
  rationale: Traduz a oração relativa como uma indicação geográfica de extensão, sem eliminar a dificuldade sintática do hebraico.
- source_word: מֵידְבָא
  choice: Medeba
  rationale: Forma portuguesa tradicional do topônimo bíblico.
theological_decisions: []
