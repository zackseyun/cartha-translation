  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: pt
  text: 'Então Israel enviou mensageiros a Seom, rei dos amorreus[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o rei amorreu». A construção hebraica pode ser entendida como «rei dos amorreus» ou como «rei amorreu».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O imperfeito consecutivo com waw faz a narrativa avançar; “então” expressa essa progressão com naturalidade em português, enquanto “enviou” traduz o sentido central de שלח.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio que aqui designa o povo de Israel; mantém-se a forma portuguesa consagrada.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto diplomático, o termo se refere claramente a representantes humanos, não a seres celestiais. “Mensageiros” preserva o sentido amplo sem acrescentar a especificidade política de “emissários”.
- source_word: אֶל
  choice: a
  rationale: A preposição indica direção ou destinatário; “a” é uma formulação natural com o verbo “enviar” neste contexto.
- source_word: סִיחֹן
  choice: Seom
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecível do nome próprio.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: rei dos amorreus
  rationale: A construção hebraica identifica Seom como rei do povo amorreu. O plural coletivo “dos amorreus” é claro e idiomático em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo hebraico introduz a fala direta do versículo seguinte; “dizendo” mantém essa função narrativa de modo natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e continuidade narrativa. Não se acrescentou nota à expressão “rei dos amorreus”, pois a alternativa “rei amorreu” pode sugerir apenas a etnia do rei, enquanto a construção contextual indica de modo mais direto seu domínio sobre os amorreus.
