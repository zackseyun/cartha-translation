source:
  edition: WLC
  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: pt
  text: Pois Hesbom era a cidade de Seom, rei dos amorreus, e ele havia lutado contra o rei anterior de Moabe e tomado toda a terra desse rei de seu poder[a], até o Arnom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de sua mão”.
    reason: Registra a imagem do idioma hebraico por trás da tradução contextual “de seu poder”.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação precedente sobre Hesbom, preservando naturalmente a força causal-explicativa.
- source_word: עִיר סִיחֹן
  choice: a cidade de Seom
  rationale: Mantém a construção possessiva do hebraico e o papel de Hesbom como centro régio de Seom.
- source_word: הִוא
  choice: era
  rationale: A oração nominal hebraica não marca tempo explicitamente, mas o contexto narrativo histórico pede o pretérito imperfeito em português.
- source_word: נִלְחַם
  choice: havia guerreado contra
  rationale: Expressa combate contra um adversário e, com o mais-que-perfeito composto, situa a guerra antes do quadro narrativo explicado no versículo.
- source_word: הָרִאשׁוֹן
  choice: anterior
  rationale: No contexto, identifica um rei precedente de Moabe; evita sugerir necessariamente o primeiro rei de toda a história moabita.
- source_word: וַיִּקַּח
  choice: tomado
  rationale: Coordenado com 'havia guerreado', conserva a anterioridade da conquista sem repetir desnecessariamente o auxiliar.
- source_word: כָּל אַרְצוֹ
  choice: toda a terra dele
  rationale: O sufixo remete ao rei de Moabe. 'Terra' preserva o termo comum do hebraico, e 'dele' reduz a possível confusão criada por 'sua' em português.
- source_word: מִיָּדוֹ
  choice: de seu poder
  rationale: Traduz o sentido idiomático de retirada do domínio ou controle de alguém; a imagem literal é registrada em nota.
- source_word: עַד אַרְנֹן
  choice: até o Arnom
  rationale: Indica o limite territorial alcançado pela conquista de modo conciso e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém a função explicativa do versículo, distingue com clareza Seom do rei anterior de Moabe e preserva em nota a metáfora hebraica da mão como poder ou controle.
