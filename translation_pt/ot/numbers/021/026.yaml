review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a relação explicativa de כי, a identificação de Hesbom como cidade de Seom, a anterioridade do conflito e o limite no Arnom. Contudo, a sequência “tomado de seu poder[a] toda a terra dele” deixa menos claro em português que tanto o poder quanto a terra se referem ao rei moabita anterior; a formulação também é algo pesada.
  naturalness: “Havia guerreado contra” é compreensível, mas “havia lutado contra” é mais corrente neste contexto. A revisão torna explícito o referente sem perder a concisão nem o tom histórico.
  terminology: Hesbom, Seom, amorreus, Moabe e Arnom são formas portuguesas estabelecidas e adequadas. “Rei anterior” reproduz com sobriedade o valor contextual de הראשון. A nota conserva corretamente a imagem hebraica de “mão”.
  issues:
  - severity: medium
    issue: Ambiguidade e construção pouco fluida em “tomado de seu poder toda a terra dele”.
    rationale: O hebraico atribui a terra e a “mão”/domínio ao rei de Moabe anterior. Em português, os pronomes podem ser momentaneamente associados a Seom, e a ordem dos complementos soa marcada. Nomear o rei anterior resolve o referente e melhora a leitura.
  revised_text: Pois Hesbom era a cidade de Seom, rei dos amorreus, e ele havia lutado contra o rei anterior de Moabe e tomado toda a terra desse rei de seu poder[a], até o Arnom.
