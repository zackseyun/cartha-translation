    text: Literalmente, “de sua mão”.
    reason: Registra a imagem do idioma hebraico por trás da tradução contextual “de seu poder”.
  revision_rationale: A revisão mantém o sentido e a anterioridade expressos no original, mas substitui uma construção menos natural e potencialmente ambígua por uma redação que identifica de modo inequívoco o rei moabita anterior como aquele de cujo domínio Seom tomou a terra.
