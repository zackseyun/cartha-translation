- from: Pois Hesbom era a cidade de Seom, rei dos amorreus. Ele havia guerreado contra o rei anterior de Moabe e tomado de seu poder[a] toda a terra dele, até o Arnom.
  to: Pois Hesbom era a cidade de Seom, rei dos amorreus, e ele havia lutado contra o rei anterior de Moabe e tomado toda a terra desse rei de seu poder[a], até o Arnom.
  rationale: A revisão mantém o sentido e a anterioridade expressos no original, mas substitui uma construção menos natural e potencialmente ambígua por uma redação que identifica de modo inequívoco o rei moabita anterior como aquele de cujo domínio Seom tomou a terra.
