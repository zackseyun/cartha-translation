  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: pt
  text: Partiram de Obote e acamparam em Ijé-Abarim[a], no deserto que fica em frente de Moabe, a leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ijé-Abarim também pode ser entendido pelo sentido como “as ruínas de Abarim” ou “os montões de Abarim”, embora aqui funcione como nome de lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Partiram
  rationale: Na fórmula dos itinerários, נסע indica levantar acampamento e seguir viagem; “partiram” expressa isso de modo natural e conciso.
- source_word: מֵאֹבֹת
  choice: de Obote
  rationale: Nome geográfico transliterado em forma legível em português.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: חנה significa instalar-se em acampamento; “acamparam” é corrente e concreto.
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: em Ijé-Abarim
  rationale: A expressão funciona aqui como topônimo. Sua possível transparência lexical é preservada em nota, sem substituir o nome no texto.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר pode designar região árida ou estepe desabitada; “deserto” é claro e natural neste contexto geográfico.
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: que fica diante de Moabe
  rationale: עַל־פְּנֵי, em descrição geográfica, indica uma localização defronte ou em face de Moabe; “diante de” conserva essa relação sem precisão excessiva.
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: do lado do nascer do sol
  rationale: A formulação mantém a imagem hebraica do nascer do sol e comunica a localização oriental em português compreensível.
