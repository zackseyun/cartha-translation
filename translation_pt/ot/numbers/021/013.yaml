  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: pt
  text: Dali partiram e acamparam do outro lado do Arnom[a], no deserto que se estende desde a fronteira dos amorreus[b], pois o Arnom é a fronteira de Moabe, entre Moabe e os amorreus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além do Arnom”. A expressão hebraica pode indicar o lado oposto ou a região além de um limite, conforme o ponto de vista.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “que sai da fronteira do amorreu”. Aqui, a expressão parece descrever o deserto estendendo-se desde a fronteira dos amorreus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Dali
  rationale: Expressão adverbial natural em português que retoma o local anterior e mantém a sequência narrativa.
- source_word: נָסָעוּ
  choice: partiram
  rationale: No contexto de itinerário, נסע indica levantar acampamento e seguir viagem; “partiram” comunica de modo conciso o movimento de saída.
- source_word: וַיַּחֲנוּ
  choice: e acamparam
  rationale: Traduz diretamente a ação de estabelecer acampamento em linguagem moderna.
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: do outro lado do Arnom
  rationale: עֵבֶר designa o lado ou a região além de um limite. A formulação preserva a perspectiva relativa sem afirmar explicitamente que atravessaram o rio.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: no deserto
  rationale: A oração relativa situa o acampamento do outro lado do Arnom dentro da região desértica; a forma condensada evita uma construção pesada em português.
- source_word: הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: que se estende desde a fronteira dos amorreus
  rationale: O particípio de יצא, literalmente “que sai”, descreve aqui a extensão geográfica do deserto a partir da fronteira amorreia.
- source_word: גְּבוּל
  choice: fronteira
  rationale: Em ambas as ocorrências, o substantivo indica a linha divisória territorial entre Moabe e os amorreus.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: Embora formalmente singular, o gentílico hebraico tem sentido coletivo; o plural é idiomático em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação geográfica que fundamenta a descrição precedente.
- source_word: אַרְנוֹן גְּבוּל מוֹאָב
  choice: o Arnom é a fronteira de Moabe
  rationale: A oração nominal hebraica apresenta uma realidade geográfica; o presente reproduz adequadamente esse valor.
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: entre Moabe e os amorreus
  rationale: A repetição hebraica de בֵּין identifica os dois lados separados pelo Arnom; a construção simples é natural em português.
