id: NUM.21.8
reference: Numbers 21:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: pt
  text: 'Então Javé disse a Moisés: “Faça para você uma serpente ardente[a] e coloque-a sobre uma haste[b]. Todo aquele que for mordido e olhar para ela viverá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um ser ardente”; o termo hebraico também está na origem de “serafim” e, neste contexto, refere-se à serpente mortal.
    reason: lexical_alternative
  - marker: b
    text: Ou “um poste de sinalização” ou “um estandarte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome divino, em vez de substituí-lo por um título como “SENHOR”.
- source_word: עֲשֵׂה לְךָ
  choice: Faça para você
  rationale: Preserva tanto o imperativo dirigido a Moisés quanto o pronome dativo, sem atribuir a ele uma nuance além da expressa no hebraico.
- source_word: שָׂרָף
  choice: serpente ardente
  rationale: No contexto, o termo designa uma serpente ligada à praga anterior. “Ardente” mantém a imagem lexical de algo que queima, sem reduzi-la interpretativamente a “venenosa” nem usar o opaco “serafim”.
- source_word: נֵס
  choice: haste
  rationale: O termo pode designar um estandarte ou o suporte de um sinal; aqui, “haste” comunica de modo concreto o objeto elevado sobre o qual a serpente seria colocada.
- source_word: הַנָּשׁוּךְ
  choice: todo aquele que for mordido
  rationale: O particípio passivo definido tem valor genérico. A formulação portuguesa expressa naturalmente qualquer pessoa que viesse a ser mordida.
- source_word: וְרָאָה אֹתוֹ
  choice: e olhar para ela
  rationale: “Olhar” é mais preciso no contexto do que a simples percepção de “ver”, e a coordenação preserva a sequência hebraica sem explicitar além dela uma relação condicional.
- source_word: וָחָי
  choice: viverá
  rationale: Expressa de maneira direta e solene o resultado prometido, deixando em aberto se o sentido contextual é sobreviver ou recuperar a vida.
theological_decisions:
- issue: Referente e imagem de שָׂרָף
  choice: serpente ardente
  alternative: serafim; serpente venenosa
  rationale: A narrativa exige uma figura de serpente em resposta à praga. “Serpente ardente” conserva a imagem verbal hebraica e evita tanto associações angelológicas posteriores quanto a interpretação mais específica de que o termo significa simplesmente “venenosa”.
- issue: Natureza do resultado expresso por וָחָי
  choice: viverá
  alternative: sobreviverá; continuará vivo
  rationale: A forma simples mantém a amplitude do verbo hebraico e não decide desnecessariamente se a pessoa é curada após estar à beira da morte ou preservada da morte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. “Javé” torna explícito o nome divino; “haste” evita a ambiguidade moderna de “poste” e mantém a ideia de um suporte elevado. Os marcadores foram colocados junto aos termos a que suas notas realmente se referem.
