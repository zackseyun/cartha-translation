id: NUM.21.33
reference: Numbers 21:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּפְנוּ֙ וַֽ/יַּעֲל֔וּ דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתָ֜/ם ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: pt
  text: Então eles mudaram de direção e subiram pelo caminho de Basã. Ogue, rei de Basã, saiu ao encontro deles[a], ele e todo o seu povo, para a batalha em Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «contra eles». A expressão hebraica pode significar simplesmente «ao encontro deles», mas, neste contexto, a frase «para a batalha» deixa claro que se trata de um encontro hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: mudaram de direção
  rationale: פנה indica aqui uma mudança de direção na sequência narrativa; a formulação é clara e natural em português.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido direcional ou topográfico comum de עלה sem recorrer ao mais formal «ascenderam».
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: pelo caminho de Basã
  rationale: דרך com o nome do lugar designa a rota ou estrada associada à região; esta tradução mantém a concisão e a proximidade com o hebraico.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogue, rei de Basã
  rationale: Usa a forma portuguesa tradicional e reconhecível do nome próprio e traduz diretamente o título em aposição.
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: יצא significa literalmente sair e, neste contexto militar, descreve a saída para o confronto sem acrescentar a ideia não expressa de marchar.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: Reproduz o valor lexical da expressão, que por si só pode ser neutra; a finalidade hostil é explicitada pela frase seguinte.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: ele e todo o seu povo
  rationale: Mantém o sentido literal de עם e evita substituir «povo» por «exército» ou «tropas», termos mais específicos que o hebraico.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: Expressa a finalidade do encontro e torna inequívoco seu caráter militar.
- source_word: אֶדְרֶעִי
  choice: em Edrei
  rationale: O nome do lugar é transliterado, e «em» indica naturalmente o local da batalha sem impor uma direção não explicitada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa sem alterar a progressão narrativa. Conserva-se «povo», em vez de interpretar o grupo especificamente como exército.
