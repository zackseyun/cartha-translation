source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: pt
  text: Então Yahweh enviou entre o povo as serpentes ardentes[a]. Elas morderam o povo, e muitos israelitas morreram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “serpentes venenosas” ou “serpentes abrasadoras”. Em hebraico, literalmente: “as serpentes, as ardentes”.'
    reason: Registra alternativas lexicais para הַשְּׂרָפִים e preserva a imagem e a ambiguidade da expressão hebraica.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: enviou
  rationale: O verbo שׁלח, nesta forma narrativa, significa diretamente “enviou”; a escolha preserva a sequência verbal do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בָּעָם
  choice: para o meio do povo
  rationale: 'Expressa naturalmente em português o sentido locativo da preposição ב: as serpentes foram enviadas para estar entre o povo.'
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: as serpentes abrasadoras
  rationale: “Serpentes” traduz נְחָשִׁים, enquanto “abrasadoras” conserva a imagem de שְׂרָפִים e sua possível referência ao efeito ardente da picada, sem reduzi-la à explicação “venenosas”.
- source_word: וַיְנַשְּׁכוּ
  choice: morderam
  rationale: נשׁך significa “morder”; o pretérito perfeito acompanha a narrativa hebraica.
- source_word: וַיָּמָת
  choice: morreram
  rationale: מות é o verbo comum para “morrer”; o plural é exigido naturalmente em português pelo sujeito “muitos israelitas”.
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: muitos israelitas
  rationale: Comunica de modo idiomático “muitos dentre Israel”, evitando a construção pouco natural “muito povo de Israel” sem alterar o referente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o nome divino. “Yahweh” preserva esse nome como nome próprio, sem substituí-lo por um título.
- issue: Sentido de הַשְּׂרָפִים neste contexto
  choice: abrasadoras
  alternative: venenosas; ardentes
  rationale: “Abrasadoras” mantém a imagem hebraica e a ambiguidade entre a aparência das serpentes e o efeito ardente de sua mordida; “venenosas” explicaria mais do que o texto diz explicitamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A divisão em duas frases evita uma cadeia excessiva de orações coordenadas. “Muitos israelitas” é mais natural do que “muitos de Israel” e transmite o sentido partitivo do hebraico.
