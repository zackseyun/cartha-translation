  - severity: low
    issue: «serpentes abrasadoras»
    rationale: «Abrasadoras» é semanticamente possível, mas pouco usual como qualificativo de serpentes. «Ardentes» é mais idiomático, conserva melhor a formulação hebraica e mantém a ambiguidade.
