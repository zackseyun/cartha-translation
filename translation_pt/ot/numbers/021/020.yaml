base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: pt
  text: E de Bamote ao vale que fica no campo de Moabe, até o cume de Pisga, que se eleva diante da terra desolada.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “sobre a face da terra desolada”, expressão que pode indicar a região diante da qual o cume se eleva ou que ele domina.'
    reason: cultural_note
  - marker: b
    text: Ou “Jesimom”, se o termo hebraico for entendido como nome de uma região, e não como substantivo descritivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: e de Bamote
  rationale: A conjunção e a preposição são preservadas. בָּמוֹת funciona aqui como topônimo no itinerário, por isso é transliterado como “Bamote”, e não traduzido como “lugares altos”.
- source_word: הַגַּיְא
  choice: o vale
  rationale: גַּיְא pode designar vale ou ravina; “vale” é natural no contexto geográfico e mantém a formulação ampla do hebraico.
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: que fica no campo de Moabe
  rationale: שָׂדֶה significa literalmente “campo”, embora também possa indicar uma região ou território aberto. “Campo de Moabe” preserva a imagem hebraica sem perder clareza.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: o cume de Pisga
  rationale: רֹאשׁ é literalmente “cabeça”, mas, em referência ao relevo, “cume” comunica naturalmente o ponto mais alto. Pisga é tratado como nome próprio.
- source_word: וְנִשְׁקָפָה
  choice: de onde se avista
  rationale: A forma verbal apresenta o cume como ponto de observação voltado para a região abaixo ou adiante. A construção relativa é idiomática em português e mantém a ligação com “cume de Pisga”.
- source_word: עַל פְּנֵי
  choice: se avista
  rationale: A expressão significa literalmente “sobre a face de”, podendo indicar aquilo que fica diante ou à vista. A tradução integra esse sentido ao verbo para produzir português natural; a imagem literal é registrada em nota.
- source_word: הַיְשִׁימֹן
  choice: a extensão desolada
  rationale: יְשִׁימוֹן designa uma região erma ou desolada. “Extensão desolada” expressa tanto a aridez quanto o caráter geográfico, preservando em nota a possibilidade de entender o termo como topônimo.
