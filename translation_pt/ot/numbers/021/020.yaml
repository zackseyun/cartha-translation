  naturalness: «E de Bamote ao vale ... até o cume de Pisga, que se eleva diante da terra desolada» é natural em português moderno e preserva melhor a relação topográfica e a coordenação do hebraico.
  terminology: «Bamote», «Moabe» e «Pisga» são formas portuguesas legíveis e consistentes. «Terra desolada» traduz adequadamente הַיְשִׁימֹן; a alternativa «Jesimom» pode ser mantida em nota. «Campo de Moabe» é uma tradução literal aceitável de שְׂדֵה מוֹאָב.
