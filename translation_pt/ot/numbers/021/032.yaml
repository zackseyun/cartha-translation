  yaml_path: translation/ot/numbers/021/032.yaml
  text: Then Moses sent men to spy out Jazer[a], and they captured its villages and dispossessed the Amorites who were there.
translation:
  language: pt
  text: Então Moisés enviou homens para fazer o reconhecimento de Jazer. Eles conquistaram os povoados que dependiam dela[a] e desalojaram os amorreus que estavam ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as filhas dela”, expressão hebraica que designa os povoados ou assentamentos dependentes de uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Forma narrativa de שׁלח; “enviou” é a expressão natural e direta em português.
- source_word: לְרַגֵּל
  choice: para explorar
  rationale: O infinitivo piel de רגל indica reconhecimento do local. “Explorar” comunica a missão de levantamento e observação sem sugerir necessariamente espionagem clandestina.
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: וַיִּלְכְּדוּ
  choice: conquistaram
  rationale: לכד denota tomar ou capturar em contexto militar; “conquistaram” é natural para a tomada de povoados.
- source_word: בְּנֹתֶיהָ
  choice: os povoados que dependiam dela
  rationale: Literalmente “suas filhas”; no uso geográfico hebraico, designa assentamentos subordinados a uma cidade principal. A formulação torna explícita essa relação e preserva o gênero do referente Jazer.
- source_word: וַיִּירַשׁ
  choice: expulsaram
  rationale: ירש, em contexto de conquista, pode indicar desalojar os habitantes para tomar posse. “Expulsaram” expressa aqui a remoção dos amorreus, embora não explicite por si só a tomada de posse.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: O singular coletivo hebraico é expresso naturalmente pelo plural do gentílico em português.
- source_word: אֲשֶׁר שָׁם
  choice: que estavam ali
  rationale: Retoma os amorreus presentes naquele lugar em português claro e natural.
