review_pass:
  verdict: revise
  source_fidelity: A sequência narrativa e os referentes estão bem representados. Contudo, “explorar” é mais amplo em português e pode sugerir exploração de território, enquanto לְרַגֵּל designa especificamente reconhecimento/espionagem militar. “Expulsaram” transmite a remoção, mas deixa de expressar a nuance possessória de ירש, melhor refletida por “desalojaram” neste contexto.
  naturalness: O texto é claro e moderno. “Fazer o reconhecimento de Jazer” é uma formulação idiomática e precisa em português contemporâneo, e “desalojaram os amorreus” é natural em registro narrativo-militar.
  terminology: “Jazer”, “amorreus” e a explicação de בְּנֹתֶיהָ estão adequados. A nota preserva corretamente o idiomatismo hebraico sem o impor ao texto principal.
  issues:
  - severity: medium
    issue: “explorar” é semanticamente amplo para לְרַגֵּל.
    rationale: O termo hebraico refere-se a reconhecimento militar de uma localidade. “Fazer o reconhecimento” evita a possível leitura de exploração territorial ou de recursos.
  - severity: low
    issue: “expulsaram” não conserva plenamente a nuance de desalojamento ligada à tomada de posse em וַיִּירַשׁ.
    rationale: “Desalojaram” mantém o foco nos habitantes removidos e é mais próximo do valor de ירש em contexto de conquista, sem acrescentar detalhes não expressos.
  revised_text: Então Moisés enviou homens para fazer o reconhecimento de Jazer. Eles conquistaram os povoados que dependiam dela[a] e desalojaram os amorreus que estavam ali.
  revised_footnotes:
