base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: pt
  text: 'Balaão respondeu a Balaque: “Eu não lhe disse: ‘Farei tudo o que Yahweh disser’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: Balaão respondeu
  rationale: A fórmula hebraica combina “respondeu” e “disse”; em português atual, “respondeu” comunica naturalmente ambos sem a redundância pouco idiomática “respondeu e disse”.
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ
  choice: Eu não lhe disse
  rationale: Preserva a pergunta retórica que espera concordância. Embora דִּבַּרְתִּי signifique literalmente “falei”, “disse” introduz de modo natural o conteúdo citado em português.
- source_word: לֵאמֹר
  choice: introdução direta da citação após dois-pontos
  rationale: O infinitivo quotativo hebraico é representado idiomaticamente pela pontuação, sem o pesado “dizendo”.
- source_word: כֹּל אֲשֶׁר יְדַבֵּר יְהוָה
  choice: tudo o que Yahweh disser
  rationale: “Tudo o que” conserva a abrangência da expressão; o futuro do subjuntivo português expressa adequadamente a referência geral e prospectiva do imperfeito hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: farei
  rationale: O objeto pronominal retoma todo o conteúdo anterior; em português, ele já está naturalmente expresso por “tudo o que”, evitando a repetição marcada “isso farei”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” preserva essa distinção sem inserir uma interpretação denominacional.
- issue: Alcance da declaração de Balaão
  choice: Farei tudo o que Yahweh disser
  alternative: Só posso fazer o que Yahweh disser
  rationale: A tradução mantém a declaração positiva do hebraico e não acrescenta explicitamente a ideia de incapacidade, embora ela possa ser inferida do contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem da fala foi levemente ajustada para soar natural, sem alterar a pergunta retórica nem a força abrangente da declaração.
