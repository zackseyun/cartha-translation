  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם לְכָ/ה נָּא֙ אֶקָּ֣חֲ/ךָ֔ אֶל מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים וְ/קַבֹּ֥ת/וֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: pt
  text: 'Então Balaque disse a Balaão: “Por favor, venha; deixe-me levá-lo a outro lugar. Talvez isso seja agradável aos olhos de Deus[a], e de lá amaldiçoe-o para mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja correto aos olhos de Deus”. A expressão hebraica pode indicar aquilo que é correto ou agradável aos olhos de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: Por favor, venha comigo
  rationale: O imperativo de הלך, suavizado por נָא, funciona como convite ou apelo. “Venha comigo” liga naturalmente o convite ao deslocamento proposto por Balaque.
- source_word: אֶקָּחֲךָ
  choice: vou levá-lo
  rationale: O imperfeito na primeira pessoa tem aqui força volitiva. A formulação é atual e comunica com clareza a iniciativa de Balaque.
- source_word: מָקוֹם אַחֵר
  choice: outro lugar
  rationale: Tradução direta e natural que preserva a mudança concreta de local.
- source_word: אוּלַי
  choice: Talvez
  rationale: Mantém a incerteza e a esperança de Balaque sem sugerir certeza.
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: isso seja agradável aos olhos de Deus
  rationale: Preserva a imagem do idioma hebraico e expressa o sentido de algo ser aceitável ou correto diante de Deus. “Isso” retoma a ação proposta, pois o hebraico não explicita o sujeito.
- source_word: הָאֱלֹהִים
  choice: Deus
  rationale: No contexto narrativo, a referência é ao Deus que orienta Balaão; “Deus” é a forma portuguesa mais natural, sem introduzir uma divindade genérica.
- source_word: וְקַבֹּתוֹ לִי
  choice: e de lá você amaldiçoe esse povo para mim
  rationale: A forma verbal dá continuidade ao pedido de Balaque. O sufixo singular retoma Israel como coletividade; “esse povo” esclarece o referente em português sem individualizá-lo.
- source_word: מִשָּׁם
  choice: de lá
  rationale: Conserva o sentido espacial ligado ao novo lugar.
theological_decisions:
- issue: Referência de הָאֱלֹהִים na fala de Balaque
  choice: Deus, isto é, o Deus que Balaão consulta no contexto narrativo
  alternative: o deus; uma divindade
  rationale: O contexto imediato apresenta Balaão sob a palavra do Deus de Israel. A tradução “Deus” identifica naturalmente o referente, sem acrescentar uma leitura politeísta.
- issue: Sentido de יִישַׁר בְּעֵינֵי
  choice: seja agradável aos olhos de Deus
  alternative: seja correto aos olhos de Deus
  rationale: O idioma admite tanto a ideia de ser correto quanto a de ser agradável ou aceitável. A opção principal se ajusta à esperança de Balaque de que Deus permita a maldição, enquanto a nota preserva a alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tom insistente, mas cortês, de Balaque. A expressão hebraica “aos olhos de Deus” foi preservada, e a ambiguidade entre “agradável” e “correto” foi registrada em nota.
