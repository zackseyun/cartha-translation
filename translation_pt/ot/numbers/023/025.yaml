  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: pt
  text: 'E Balaque disse a Balaão: “Não o amaldiçoe de modo nenhum, nem o abençoe de modo nenhum!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “amaldiçoar, não o amaldiçoe... abençoar, não o abençoe”. Em cada oração, um infinitivo absoluto vem antes do verbo conjugado para dar forte ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: A forma narrativa com waw consecutivo dá sequência ao relato; “E ... disse” preserva esse fluxo de modo natural em português.
- source_word: בָּלָק ... בִּלְעָם
  choice: Balaque ... Balaão
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: גַּם ... גַּם
  choice: não ... nem
  rationale: Na estrutura proibitiva paralela, a correlação portuguesa “não ... nem” comunica naturalmente a proibição das duas ações.
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: Não o amaldiçoe de modo nenhum
  rationale: “Amaldiçoar” é o equivalente corrente de קבב neste contexto. O infinitivo absoluto seguido do verbo finito intensifica a proibição, expressa por “de modo nenhum”.
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: nem o abençoe de modo nenhum
  rationale: “Abençoar” traduz naturalmente ברך. A repetição de “de modo nenhum” conserva o paralelismo e a ênfase do hebraico.
