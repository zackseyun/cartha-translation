  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: pt
  text: 'Yahweh encontrou Balaão e pôs uma palavra em sua boca[a]. Então disse: “Volte a Balaque e fale assim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pôs uma mensagem em sua boca”.
    reason: Alternativa lexical para דָּבָר neste contexto de fala transmitida.
lexical_decisions:
- source_word: וַיִּקָּר
  choice: encontrou
  rationale: O verbo קָרָה aqui descreve um encontro direto. “Encontrou” é natural em português e não acrescenta a ideia mais específica de uma aparição ou visão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: pôs uma palavra em sua boca
  rationale: Preserva de perto o idioma hebraico de fala concedida por Deus e mantém o singular דָּבָר.
- source_word: דָּבָר
  choice: palavra
  rationale: Neste contexto, refere-se ao pronunciamento específico que Balaão deve transmitir; “palavra” conserva tanto o sentido quanto a formulação profética.
- source_word: שׁוּב
  choice: Volte
  rationale: Expressa de modo claro e atual a ordem para Balaão retornar a Balaque.
- source_word: וְכֹה תְדַבֵּר
  choice: e fale assim
  rationale: Reproduz com naturalidade a fórmula que introduz a fala a ser pronunciada, sem tornar explícito demais se כֹה indica conteúdo ou maneira.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Natureza do encontro entre Yahweh e Balaão
  choice: encontrou Balaão
  alternative: veio ao encontro de Balaão; apareceu a Balaão
  rationale: “Encontrou” mantém a amplitude lexical de קָרָה sem definir o acontecimento como aparição visionária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação hebraica foi levemente ajustada com “Então disse” para evitar uma sequência pesada de conjunções, sem alterar a progressão narrativa.
