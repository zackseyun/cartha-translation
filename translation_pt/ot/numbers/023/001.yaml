base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: pt
  text: 'Então Balaão disse a Balaque: “Construa aqui sete altares para mim e prepare aqui sete novilhos e sete carneiros para mim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: בִּלְעָם ... בָּלָק
  choice: Balaão ... Balaque
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: בְּנֵה
  choice: Construa
  rationale: Imperativo de בנה; “construir” é natural e preciso para altares.
- source_word: לִי
  choice: para mim
  rationale: Preserva a ideia de benefício ou destinação expressa pela preposição com sufixo de primeira pessoa.
- source_word: בָּזֶה
  choice: aqui
  rationale: No contexto, a expressão literalmente equivalente a “neste [lugar]” é dêitica; “aqui” é natural e mantém a ênfase local, inclusive por sua repetição.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: sete altares
  rationale: Correspondência direta e idiomática da expressão numérica.
- source_word: וְהָכֵן
  choice: e prepare
  rationale: O imperativo causativo de כון significa pôr ou deixar pronto; “prepare” é adequado aos animais destinados ao sacrifício.
- source_word: פָרִים
  choice: novilhos
  rationale: פַּר designa um bovino macho, frequentemente jovem, em contextos sacrificiais; “novilhos” é a forma bíblica portuguesa precisa e inteligível.
- source_word: וְשִׁבְעָה אֵילִים
  choice: e sete carneiros
  rationale: אֵילִים designa carneiros adultos, isto é, machos das ovelhas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas nominais tradicionais. A repetição de “aqui” foi mantida para reproduzir a ênfase espacial do hebraico. Não há necessidade de nota, pois a formulação traduz diretamente essa repetição.
