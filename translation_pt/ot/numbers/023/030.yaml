base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: pt
  text: Então Balaque fez como Balaão havia dito e ofereceu um touro e um carneiro sobre o altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Com כַּאֲשֶׁר אָמַר, o verbo עשה expressa agir em conformidade com o que foi dito; “fez como” é natural e fiel em português.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz conformidade entre a ação de Balaque e a instrução anterior de Balaão.
- source_word: אָמַר
  choice: havia dito
  rationale: O mais-que-perfeito composto explicita naturalmente em português que a fala de Balaão precedeu a ação de Balaque.
- source_word: וַיַּעַל
  choice: ofereceu
  rationale: No contexto sacrificial, עלה significa fazer subir/oferecer uma vítima no altar. “Ofereceu” comunica com clareza o sentido cultual sem acrescentar detalhes não expressos.
- source_word: פָּר
  choice: um novilho
  rationale: פָּר designa um bovino macho usado como vítima sacrificial; “novilho” é uma designação corrente e adequada neste contexto.
- source_word: אַיִל
  choice: um carneiro
  rationale: Equivalente português preciso e comum para o macho adulto da ovelha em contexto sacrificial.
- source_word: בַּמִּזְבֵּחַ
  choice: sobre o altar
  rationale: A preposição ב־ indica aqui o lugar da oferta; “sobre o altar” preserva de modo natural essa relação espacial.
- source_word: וַ
  choice: Então
  rationale: O waw inicial dá continuidade à narrativa e, neste contexto, apresenta a execução da instrução anterior; “Então” reproduz bem esse fluxo.
