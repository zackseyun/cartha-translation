id: NUM.23.23
reference: Numbers 23:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: pt
  text: 'Pois não há agouro contra Jacó[a], nem adivinhação contra Israel. Agora[b] se dirá a Jacó e a Israel: “O que Deus fez!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não há agouro em Jacó, nem adivinhação em Israel”. A preposição hebraica admite ambas as leituras; o contexto favorece “contra”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “No tempo oportuno” ou “Neste tempo”.'
    reason: lexical_alternative
  - marker: c
    text: 'Também é possível entender a frase como pergunta: “O que Deus fez?”'
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: agouro
  rationale: O termo designa a busca ou interpretação de sinais ocultos. “Agouro” preserva sua relação com presságios e o distingue de קֶסֶם.
- source_word: קֶסֶם
  choice: adivinhação
  rationale: Refere-se à obtenção de conhecimento por meios ocultos. “Adivinhação” é claro em português atual e evita ampliar indevidamente o sentido para toda forma de feitiçaria.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: contra Jacó / contra Israel
  rationale: No contexto do oráculo de Balaão, a preposição בְּ pode indicar o alvo contra o qual agouros e adivinhações seriam empregados. “Contra” destaca a ineficácia dessas práticas diante da bênção divina, enquanto a leitura locativa permanece registrada em nota.
- source_word: כָּעֵת
  choice: agora
  rationale: A expressão temporal significa literalmente “neste tempo” e, neste contexto, pode ser vertida de modo direto por “agora”. A possível nuance de tempo apropriado é preservada em nota.
- source_word: יֵאָמֵר
  choice: se dirá
  rationale: A construção impessoal com “se” reproduz naturalmente em português o passivo impessoal do hebraico e mantém o valor prospectivo do imperfeito.
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: a Jacó e a Israel
  rationale: Mantém o valor dativo mais direto de לְ, sem excluir que Jacó e Israel sejam também o assunto da proclamação.
- source_word: מַה פָּעַל אֵל
  choice: O que Deus fez!
  rationale: A frase é entendida como exclamação admirativa acerca da ação divina. A pontuação comunica essa força sem acrescentar palavras ausentes do hebraico.
- source_word: אֵל
  choice: Deus
  rationale: Aqui אֵל funciona como título divino comum; “Deus” é a tradução direta e não exige expansão interpretativa.
theological_decisions:
- issue: Se o versículo nega a presença de práticas ocultas em Israel ou sua eficácia contra Israel
  choice: Declara que agouros e adivinhações não prevalecem contra Jacó/Israel.
  alternative: Declara que não existem agouros nem adivinhação em Jacó/Israel.
  rationale: O contexto imediato é a incapacidade de Balaão de amaldiçoar o povo que Deus abençoou. Contudo, como a preposição hebraica admite leitura locativa, essa alternativa é preservada em nota.
- issue: Se מַה פָּעַל אֵל é pergunta ou exclamação
  choice: 'Exclamação: “O que Deus fez!”'
  alternative: 'Pergunta: “O que Deus fez?”'
  rationale: A linha culmina na proclamação admirada da ação de Deus em favor de Israel. A forma hebraica, porém, também pode ser pontuada como pergunta, possibilidade registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe adequada à leitura pública. “Agouro” e “adivinhação” mantêm uma distinção lexical útil sem recorrer a vocabulário denominacional. As ambiguidades da preposição, da expressão temporal e da frase final são explicitadas em notas.
