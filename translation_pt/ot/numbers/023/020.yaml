  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: pt
  text: Eis que recebi para abençoar[a]; ele abençoou[b], e não posso reverter isso.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «para abençoar recebi»; o hebraico deixa implícito o objeto de «recebi».
    reason: lexical_alternative
  - marker: b
    text: O sujeito de «ele abençoou» está implícito no hebraico; o contexto indica Deus.
    reason: alternative_reading
  - marker: c
    text: 'Ou: «não posso revogar isso» ou «não posso fazê-lo voltar atrás».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Interjeição que chama a atenção dos ouvintes; o plural é natural no discurso dirigido aos presentes e evita o arcaísmo de «eis».
- source_word: בָרֵךְ לָקָחְתִּי
  choice: recebi a ordem de abençoar
  rationale: לָקַחְתִּי significa literalmente «recebi/tomei», com o objeto implícito, enquanto בָרֵךְ indica o conteúdo ou propósito. A formulação explicita de modo comedido a incumbência profética exigida pelo contexto.
- source_word: וּבֵרֵךְ
  choice: ele abençoou
  rationale: O perfeito masculino singular tem sujeito implícito; o contexto aponta para Deus. Manter «ele» preserva a concisão e a implicitude do hebraico.
- source_word: אֲשִׁיבֶנָּה
  choice: não posso revogar isso
  rationale: O hifil de שוב significa fazer voltar ou reverter; no contexto, refere-se a retirar ou anular a bênção já pronunciada. «Revogar» é claro e digno em português.
theological_decisions:
- issue: Sujeito implícito de וּבֵרֵךְ
  choice: Manter o sujeito como «ele», entendendo-o contextualmente como Deus.
  alternative: Explicitar «Deus abençoou» ou usar uma construção impessoal.
  rationale: A forma verbal hebraica não nomeia o sujeito. O contexto aponta fortemente para Deus, mas «ele» conserva a concisão e não acrescenta um substantivo ausente do texto.
- issue: Natureza do que Balaão recebeu
  choice: «recebi a ordem de abençoar»
  alternative: «recebi para abençoar» ou «recebi uma bênção»
  rationale: O objeto de «recebi» fica implícito no hebraico. «Ordem» comunica a incumbência profética sugerida pelo contexto, enquanto a nota registra a forma mais literal e a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Vejam» funciona como chamada de atenção dirigida aos ouvintes. A pontuação mantém as três afirmações compactas do oráculo, e as notas preservam os elementos implícitos e as alternativas lexicais do hebraico.
