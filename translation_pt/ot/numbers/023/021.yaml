source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: pt
  text: Ele não contemplou desgraça em Jacó, nem viu sofrimento em Israel.[a] Yahweh, seu Deus, está com ele,[b] e a aclamação de um rei está no meio deles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não contemplou iniquidade em Jacó, nem viu aflição (ou perversidade) em Israel”. Os termos hebraicos podem ter sentido moral ou referir-se a desgraça, sofrimento e aflição.'
    reason: alternative_reading
  - marker: b
    text: Jacó e Israel são personificados no singular como um só povo.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, literalmente, “a aclamação de um rei está nele”. A expressão pode indicar uma aclamação régia no meio de Israel e talvez aluda à presença de Yahweh como rei.
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: contemplou
  rationale: Expressa o olhar atento ou a consideração indicada por נבט e mantém a distinção poética em relação a ראה.
- source_word: אָוֶן
  choice: desgraça
  rationale: O termo pode indicar maldade, iniquidade, desgraça ou calamidade. No contexto da bênção, “desgraça” preserva o sentido de dano ou adversidade sem excluir em nota a leitura moral.
- source_word: רָאָה
  choice: viu
  rationale: Tradução direta de ראה, em paralelismo com “contemplou”.
- source_word: עָמָל
  choice: sofrimento
  rationale: Abrange aflição, fadiga e miséria, diferenciando o termo de אָוֶן sem romper o paralelismo.
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: em Jacó / em Israel
  rationale: Mantém o valor locativo da preposição e o paralelismo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהָיו ... עִמּוֹ
  choice: seu Deus, está com ele
  rationale: Preserva os sufixos masculinos singulares e a personificação coletiva de Jacó/Israel.
- source_word: תְרוּעַת מֶלֶךְ
  choice: a aclamação de um rei
  rationale: תְרוּעָה pode designar grito, toque ou aclamação. “Aclamação” comunica adequadamente o contexto régio sem identificar de modo explícito o rei.
- source_word: בּוֹ
  choice: está no meio deles
  rationale: Embora a forma hebraica seja literalmente “nele”, o referente é Israel como coletivo; a formulação portuguesa explicita o sentido corporativo, enquanto a nota preserva a forma gramatical.
theological_decisions:
- issue: Se o verso declara ausência de pecado moral em Israel ou ausência de desgraça e sofrimento
  choice: O texto principal fala de desgraça e sofrimento não contemplados em Jacó-Israel.
  alternative: “Não contemplou iniquidade em Jacó, nem viu perversidade/aflição em Israel.”
  rationale: אָוֶן e עָמָל admitem tanto nuances morais quanto sentidos ligados a calamidade, aflição e sofrimento. O contexto favorece a proteção e a presença favorável de Deus, mas a leitura moral permanece possível e é registrada em nota.
- issue: Identidade do rei em תְרוּעַת מֶלֶךְ
  choice: Mantém-se a expressão indefinida “a aclamação de um rei”.
  alternative: “a aclamação do Rei” ou “o brado por seu rei”
  rationale: O hebraico não identifica explicitamente o rei. A expressão pode aludir à presença régia de Yahweh, mas a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção poética conserva o paralelismo, a personificação coletiva no singular e as ambiguidades lexicais e teológicas do hebraico.
