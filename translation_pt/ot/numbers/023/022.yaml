  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: pt
  text: Deus os tira do Egito; sua força é como a de um boi selvagem[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele tem chifres como os de um boi selvagem”. A expressão hebraica é difícil; ela pode conservar a imagem concreta dos chifres, em vez de expressar a ideia de força de modo abstrato.'
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “unicórnio”; mais provavelmente, um boi selvagem ou auroque.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Deus
  rationale: O substantivo funciona como sujeito da oração. “Deus” é a tradução direta e natural, sem acrescentar a qualificação “poderoso”.
- source_word: מוֹצִיאָם
  choice: os tira
  rationale: O particípio no hifil, com sufixo da terceira pessoa do plural, apresenta Deus vividamente como aquele que os faz sair. O presente preserva a força poética e característica da forma hebraica.
- source_word: מִמִּצְרָיִם
  choice: do Egito
  rationale: Com o verbo “tirar”, “do Egito” expressa de modo natural a procedência e evoca claramente o êxodo.
- source_word: כְּתוֹעֲפֹת
  choice: chifres como os de
  rationale: O termo plural é difícil e pode indicar chifres, projeções elevadas, imponência ou força. A formulação conserva a imagem concreta do animal sem reduzir o sentido apenas à ideia abstrata de força.
- source_word: רְאֵם
  choice: boi selvagem
  rationale: O termo designa provavelmente um bovino selvagem poderoso, talvez o auroque. “Boi selvagem” é claro para leitores atuais e evita o tradicional, mas zoologicamente improvável, “unicórnio”.
- source_word: לוֹ
  choice: ele tem
  rationale: O sufixo hebraico está no singular. A construção portuguesa mantém essa mudança do plural (“os”) para o singular (“ele”), provavelmente tratando Israel coletivamente, embora o referente permaneça algo ambíguo.
theological_decisions:
- issue: Imagem de רְאֵם
  choice: boi selvagem
  alternative: auroque; unicórnio
  rationale: A imagem comunica poder por meio de um bovino selvagem, não afirma a existência de um animal mitológico. “Boi selvagem” reflete melhor o provável referente hebraico e continua acessível.
- issue: Mudança do plural para o singular
  choice: preservar “os” e depois “ele”
  alternative: uniformizar tudo no singular ou no plural
  rationale: O texto hebraico traz objeto plural em מוֹצִיאָם e pronome singular em לוֹ. A tradução preserva essa tensão gramatical, em vez de decidir silenciosamente se Israel deve ser tratado apenas como povo singular ou como conjunto plural.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe concisa adequada à poesia oracular. A mudança de “os” para “ele” foi mantida deliberadamente para refletir o hebraico, e as notas registram tanto a dificuldade lexical de תּוֹעֲפֹת quanto a identificação provável de רְאֵם.
