  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: pt
  text: Deus não é homem, para que minta, nem filho de homem[a], para que mude de ideia[b]. Será que ele diz e não faz? Será que fala e não cumpre o que disse[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “filho de homem” é uma expressão hebraica que significa simplesmente “ser humano”; não é um título messiânico.
    reason: cultural_note
  - marker: b
    text: Ou “volte atrás”. Tradicionalmente, “se arrependa”. O verbo hebraico pode indicar mudança de rumo ou de intenção; aqui, o assunto é a confiabilidade de Deus, não arrependimento moral.
    reason: lexical_alternative
  - marker: c
    text: Ou “não o faz valer” ou “não o confirma”. O hebraico diz literalmente “não o faz ficar de pé”; o pronome retoma o que foi dito, isto é, sua palavra ou declaração.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Deus
  rationale: No contexto, designa o Deus de Israel e estabelece o contraste direto entre Deus e o ser humano.
- source_word: אִישׁ
  choice: homem
  rationale: Preserva o termo masculino do hebraico e o paralelismo poético com “filho de homem”.
- source_word: וִיכַזֵּב
  choice: para que minta
  rationale: כזב expressa mentira ou falsidade; esta formulação comunica de modo natural a confiabilidade de Deus.
- source_word: בֶן אָדָם
  choice: filho de homem
  rationale: Mantém a expressão hebraica e o paralelismo do verso. A nota esclarece que aqui ela significa simplesmente um ser humano, sem função titular.
- source_word: וְיִתְנֶחָם
  choice: para que mude de ideia
  rationale: O hitpael de נחם pode indicar mudança de intenção ou recuo. “Mude de ideia” é claro e evita sugerir arrependimento moral da parte de Deus.
- source_word: הַהוּא אָמַר
  choice: Acaso ele diz
  rationale: A forma declarativa hebraica participa de uma pergunta retórica; “acaso” transmite essa força naturalmente em português.
- source_word: יַעֲשֶׂה
  choice: não faz
  rationale: עשה é amplo, e “faz” preserva sua formulação simples e direta, tendo como objeto implícito aquilo que Deus diz.
- source_word: וְדִבֶּר
  choice: Acaso fala
  rationale: “Fala” mantém o paralelismo com “diz” e introduz naturalmente a segunda pergunta retórica.
- source_word: יְקִימֶנָּה
  choice: não cumpre
  rationale: O hiphil de קום significa literalmente fazer ficar de pé e, neste contexto, fazer valer ou cumprir a palavra proferida. “Cumpre” expressa o sentido contextual em português corrente.
theological_decisions:
- issue: Linguagem sobre a constância divina em וְיִתְנֶחָם
  choice: mude de ideia
  alternative: volte atrás; se arrependa
  rationale: A formulação ressalta a confiabilidade de Deus em contraste com a inconstância humana, sem impor ao texto uma definição filosófica mais ampla nem sugerir arrependimento moral.
- issue: Sentido de בֶן אָדָם
  choice: expressão comum para um ser humano
  alternative: título messiânico
  rationale: Neste contexto poético, a expressão é paralela a “homem” e designa a humanidade; não funciona como título messiânico.
- issue: Força de יְקִימֶנָּה
  choice: cumprir a palavra proferida
  alternative: estabelecê-la; confirmá-la; fazê-la valer
  rationale: O contexto trata da correspondência entre a fala de Deus e sua ação. “Cumpre” comunica essa relação sem eliminar, na nota, a imagem concreta do hebraico.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O paralelismo hebraico foi preservado, enquanto as perguntas retóricas receberam forma natural em português.
