base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: pt
  text: Então ele o levou ao Campo de Zofim[a], ao topo de Pisga, construiu sete altares e ofereceu um novilho e um carneiro sobre cada altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao Campo dos Vigias”. A expressão hebraica pode ser entendida como um nome de lugar preservado, “Zofim”, ou como uma descrição traduzida, “campo dos vigias” ou “dos observadores”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: Então ele o levou
  rationale: O wayyiqtol de לקח com sufixo de objeto masculino singular dá continuidade à narrativa. “Então” expressa naturalmente a sequência, e “levou” é idiomático para o deslocamento até outro local.
- source_word: שְׂדֵה צֹפִים
  choice: ao Campo de Zofim[a]
  rationale: A construção pode designar um lugar chamado Zofim ou significar literalmente “campo dos vigias/observadores”. O texto principal preserva o provável topônimo, enquanto a nota mantém a ambiguidade lexical.
- source_word: אֶל רֹאשׁ הַפִּסְגָּה
  choice: ao topo do Pisga
  rationale: Em contexto geográfico, רֹאשׁ significa “topo” ou “cume”. Pisga é tratado como topônimo, conforme seu uso em Números e Deuteronômio.
- source_word: וַיִּבֶן שִׁבְעָה מִזְבְּחֹת
  choice: construiu sete altares
  rationale: Tradução direta e natural de בנה seguido do objeto “sete altares”.
- source_word: וַיַּעַל
  choice: ofereceu
  rationale: No contexto sacrificial, עלה significa fazer subir ou apresentar uma oferta. “Ofereceu” comunica a ação cultual sem explicação excessiva.
- source_word: פָּר וָאַיִל
  choice: um novilho e um carneiro
  rationale: Os substantivos singulares indicam um animal de cada espécie. “Novilho” representa adequadamente פָּר como bovino macho destinado ao sacrifício, e “carneiro” traduz אַיִל.
- source_word: בַּמִּזְבֵּחַ
  choice: sobre cada altar
  rationale: 'Embora o hebraico empregue o singular, os sete altares recém-mencionados e o padrão ritual do contexto favorecem um sentido distributivo: um novilho e um carneiro em cada altar.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se o topônimo Zofim no texto e registra-se em nota sua possível tradução. A coordenação verbal foi ligeiramente simplificada para soar natural sem perder a sequência narrativa.
