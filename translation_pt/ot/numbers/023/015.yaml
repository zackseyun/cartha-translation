base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: pt
  text: 'E ele disse a Balaque: “Fique de pé aqui, junto à sua oferta queimada, e eu irei ao encontro dele ali[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eu o encontrarei ali” ou “ali terei um encontro”. O verbo hebraico é conciso e não explicita o objeto do encontro.
    reason: Alternativa lexical e preservação do objeto implícito no hebraico.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: E ele disse a Balaque
  rationale: Mantém o fluxo narrativo do wayyiqtol e identifica naturalmente o destinatário da fala.
- source_word: הִתְיַצֵּב
  choice: Fique
  rationale: O imperativo pede que Balaque permaneça em determinada posição; “fique” é natural em português e, com “aqui”, comunica o sentido contextual de tomar e conservar seu lugar.
- source_word: כֹּה
  choice: aqui
  rationale: Neste contexto espacial, o primeiro כֹּה indica o lugar em que Balaque deve permanecer.
- source_word: עַל עֹלָתֶךָ
  choice: junto à sua oferta queimada
  rationale: עַל tem aqui sentido locativo de proximidade, e עֹלָה designa uma oferta inteiramente consumida pelo fogo. “Oferta queimada” é clara e evita depender do sentido moderno extrabíblico de “holocausto”.
- source_word: וְאָנֹכִי
  choice: e eu
  rationale: Preserva a coordenação e a ênfase do pronome explícito, em contraste leve com Balaque, que deve ficar onde está.
- source_word: אִקָּרֶה
  choice: irei ao encontro dele
  rationale: Expressa em português corrente a ideia contextual de dirigir-se a um encontro. O pronome “dele” é suprido pelo contexto, mas a concisão e a ambiguidade do hebraico são registradas em nota.
- source_word: כֹּה
  choice: ali
  rationale: O segundo כֹּה aponta para o local do encontro e mantém o contraste espacial natural entre “aqui” e “ali”.
theological_decisions:
- issue: Objeto implícito do encontro pretendido por Balaão
  choice: “irei ao encontro dele”, sem nomear explicitamente o referente
  alternative: “encontrarei ali” ou “terei um encontro ali”, sem objeto pessoal expresso
  rationale: O contexto aponta para um encontro divino, mas este versículo não nomeia o objeto. O pronome torna a frase natural em português sem inserir “o SENHOR” no texto; a nota preserva a concisão e a ambiguidade genuínas do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Balaque” segue a forma bíblica portuguesa consolidada; “oferta queimada” comunica diretamente o tipo de sacrifício.
