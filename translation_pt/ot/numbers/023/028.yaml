  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: pt
  text: Então Balaque levou Balaão ao topo de Peor, de onde se avista a região desolada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “o deserto”; o hebraico também pode ser entendido como o nome de um lugar: “Jesimom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então ... levou
  rationale: O waw consecutivo faz a narrativa avançar. Neste contexto de deslocamento, “levou” expressa naturalmente o sentido de tomar/conduzir alguém a um lugar.
- source_word: בָּלָק
  choice: Balaque
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: אֶת בִּלְעָם
  choice: Balaão
  rationale: O marcador de objeto direto não é traduzido; emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: רֹאשׁ הַפְּעוֹר
  choice: ao topo de Peor
  rationale: Em contexto topográfico, רֹאשׁ indica o topo ou cume. O artigo hebraico diante do nome geográfico não precisa ser reproduzido em português.
- source_word: הַנִּשְׁקָף עַל־פְּנֵי
  choice: de onde se avista
  rationale: O particípio nifal descreve um ponto elevado com vista para uma região. A formulação portuguesa é clara e natural sem reproduzir de modo rígido o idiomatismo “sobre a face de”.
- source_word: הַיְשִׁימֹן
  choice: a região desolada
  rationale: יְשִׁימֹן pode designar uma extensão desértica e desolada ou ser entendido como topônimo. A tradução principal comunica o sentido lexical, enquanto a nota preserva a alternativa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas tradicionais dos nomes bíblicos. A construção “de onde se avista” transmite naturalmente a perspectiva topográfica do hebraico; a nota conserva a ambiguidade entre descrição geográfica e topônimo.
