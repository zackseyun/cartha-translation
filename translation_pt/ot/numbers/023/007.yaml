base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: pt
  text: 'Então Balaão proferiu seu pronunciamento[a] e disse:


    “De Arã, Balaque, rei de Moabe, me trouxe,


    das montanhas do Oriente[b]:


    ‘Venha, amaldiçoe Jacó para mim;


    venha, execre Israel[c].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu oráculo”. O hebraico diz literalmente “levantou seu mashal”, expressão que introduz uma declaração poética formal.
    reason: lexical_alternative
  - marker: b
    text: Ou “das montanhas orientais”. A expressão hebraica provavelmente se refere à região situada a leste de Moabe.
    reason: lexical_alternative
  - marker: c
    text: O segundo verbo hebraico não é o mesmo traduzido por “amaldiçoe”. Também pode ser vertido por “amaldiçoe” ou “lance sua ira contra”; “execre” preserva a distinção e a força hostil do termo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Balaão proferiu seu pronunciamento
  rationale: A expressão idiomática hebraica introduz uma declaração poética formal. “Proferiu seu pronunciamento” comunica o caráter elevado sem restringir מָשָׁל a “provérbio”. O nome explícito esclarece naturalmente o sujeito em português no início da unidade poética.
- source_word: מִן אֲרָם
  choice: De Arã
  rationale: Mantém o topônimo hebraico, sem substituí-lo pelo nome geopolítico posterior “Síria”.
- source_word: יַנְחֵנִי
  choice: me trouxe
  rationale: O hifil de נחה pode significar conduzir ou trazer alguém. No contexto da convocação de Balaão, “me trouxe” é natural em português e preserva o movimento dirigido por Balaque.
- source_word: מֵהַרְרֵי קֶדֶם
  choice: das montanhas do Oriente
  rationale: קֶדֶם é entendido espacialmente, em paralelo com Arã, como referência à região a leste. A formulação preserva a expressão geográfica hebraica.
- source_word: לְכָה
  choice: Venha
  rationale: O imperativo funciona como convite ou convocação direta e é idiomaticamente expresso por “venha”.
- source_word: אָרָה
  choice: amaldiçoe
  rationale: Expressa diretamente o pedido de lançar maldição, com verbo corrente e preciso em português.
- source_word: לִּי
  choice: para mim
  rationale: 'Preserva o dativo de interesse: Balaque solicita a ação em seu benefício.'
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome pessoal e nacional segundo a forma portuguesa consagrada.
- source_word: זֹעֲמָה
  choice: condene
  rationale: Mantém distinção lexical em relação a אָרָה. “Condene” comunica uma declaração hostil contra Israel em linguagem moderna; a nota registra alternativas de força imprecatória mais explícita.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome pessoal e nacional segundo a forma portuguesa consagrada.
theological_decisions:
- issue: Relação entre Jacó e Israel no pedido citado por Balaque
  choice: Preservar os dois nomes como designações paralelas do povo da aliança.
  alternative: Substituir ambos por uma única expressão coletiva, como “os israelitas”.
  rationale: O paralelismo poético hebraico emprega deliberadamente “Jacó” e “Israel”. Preservá-los conserva a ressonância literária e da aliança sem impor interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e acessível, com disposição em versos para refletir a forma poética. Empregou-se “Balaão” em vez do pronome inicial para clareza fora do contexto imediato. “Arã”, “Balaque”, “Moabe”, “Jacó” e “Israel” seguem formas portuguesas consagradas.
