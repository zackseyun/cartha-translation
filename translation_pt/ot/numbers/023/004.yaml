base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: pt
  text: 'Deus encontrou Balaão[a], e ele lhe disse: “Dispus os sete altares e ofereci um novilho e um carneiro sobre o altar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus veio ao encontro de Balaão”. O verbo hebraico pode indicar um encontro e, em alguns contextos, deparar-se com alguém ou ocorrer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: encontrou-se com
  rationale: O verbo קָרָה pode indicar encontro ou ocorrência. Aqui, com Deus como sujeito, “encontrou-se com” comunica um encontro divino real sem sugerir mero acaso; a nota preserva a alternativa lexical.
- source_word: אֱלֹהִים
  choice: Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, o verbo no singular e o contexto indicam o título divino singular.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: e ele lhe disse
  rationale: O pronome explícito ajuda a indicar que Balaão é o sujeito de “disse”, como demonstra a fala em primeira pessoa que se segue.
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: os sete altares
  rationale: A expressão definida se refere ao conjunto específico de altares já conhecido pelo contexto.
- source_word: עָרַכְתִּי
  choice: Preparei
  rationale: עָרַךְ significa pôr em ordem, dispor ou preparar. No contexto dos altares, “preparei” é natural e preserva a ideia de disposição deliberada.
- source_word: וָאַעַל
  choice: e ofereci
  rationale: Em contexto sacrificial, עָלָה no causativo significa fazer subir ou oferecer em sacrifício; “ofereci” expressa naturalmente o uso idiomático.
- source_word: פָּר
  choice: um novilho
  rationale: Em contextos sacrificiais, פַּר designa um bovino macho, frequentemente jovem; “novilho” é a forma bíblica portuguesa corrente e adequada.
- source_word: וָאַיִל
  choice: e um carneiro
  rationale: “Carneiro” é o equivalente português usual de אַיִל em contexto sacrificial.
- source_word: בַּמִּזְבֵּחַ
  choice: sobre o altar
  rationale: Mantém o singular definido do hebraico sem introduzir no texto principal a interpretação distributiva “sobre cada altar”.
theological_decisions:
- issue: Natureza do encontro divino em וַיִּקָּר
  choice: Traduzir como um encontro real entre Deus e Balaão, sem conotação necessária de acaso
  alternative: “Deus veio ao encontro de Balaão” ou, com nuance mais eventual, “Deus deparou com Balaão”
  rationale: A raiz pode, em certos contextos, carregar a ideia de acontecer ou deparar, mas a narrativa descreve uma interação divina intencional. A tradução principal evita sugerir casualidade, enquanto a nota registra a amplitude lexical.
- issue: Singular בַּמִּזְבֵּחַ após a menção dos sete altares
  choice: Preservar “sobre o altar”
  alternative: “sobre cada altar”
  rationale: O contexto pode favorecer uma compreensão distributiva, mas o hebraico emprega o singular definido. Preservá-lo evita resolver silenciosamente essa tensão textual.
translation_notes:
  register: 'Português moderno, digno e de leitura natural, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A sintaxe mantém clara a mudança implícita de sujeito: Deus encontra Balaão, e Balaão fala com Deus.'
