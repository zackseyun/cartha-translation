  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: pt
  text: 'Então Balaque lhe disse: “Por favor, venha comigo a outro lugar, de onde você verá Israel. Você verá apenas uma parte dele[a], sem vê-lo por inteiro; amaldiçoe-o para mim dali”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “apenas a extremidade dele” ou “apenas a parte mais distante dele”; isto é, somente uma visão parcial de Israel.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa pronomes no singular (“dele”, “vê-lo”, “amaldiçoe-o”) para se referir coletivamente ao povo de Israel. Também se poderia traduzir com formas no plural.
    reason: alternative_reading
lexical_decisions:
- source_word: לך־נא אִתִּי
  choice: Por favor, venha comigo
  rationale: O imperativo com נָא expressa um pedido cortês. Em português, “venha comigo” é natural quando o falante convida alguém a acompanhá-lo.
- source_word: מָקוֹם אַחֵר
  choice: outro lugar
  rationale: Tradução direta e natural da mudança concreta de local.
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: de onde você poderá ver Israel
  rationale: A oração descreve o novo ponto de observação. O referente implícito é explicitado como Israel para evitar a ambiguidade pouco natural de “vê-lo” sem antecedente nominal no versículo.
- source_word: אֶפֶס קָצֵהוּ
  choice: apenas uma parte dele
  rationale: קָצֶה pode indicar extremidade, borda ou parte periférica. Neste contexto, a ideia é uma visão parcial do povo; “uma parte dele” comunica isso naturalmente, enquanto a nota preserva as imagens alternativas.
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: sem vê-lo por inteiro
  rationale: Preserva o contraste entre visão parcial e total, mantendo o referente coletivo no singular.
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: amaldiçoe-o para mim dali
  rationale: קבב significa amaldiçoar neste relato. “Dali” conserva a lógica espacial da estratégia de Balaque.
theological_decisions:
- issue: Referente dos sufixos pronominais singulares aplicados a Israel
  choice: Explicitar “Israel” uma vez e manter depois os pronomes masculinos singulares
  alternative: Empregar o plural (“eles”, “amaldiçoe-os”) ou repetir “o povo”
  rationale: O hebraico apresenta Israel coletivamente no singular. A formulação portuguesa preserva essa unidade retórica sem deixar o primeiro pronome sem antecedente claro.
- issue: Sentido contextual do imperativo הלך
  choice: “venha comigo” como convite
  alternative: “vá comigo”
  rationale: Embora o verbo possa significar “ir”, o português favorece “venha comigo” quando o próprio falante convida o interlocutor a acompanhá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi naturalizada sem apagar o singular coletivo do hebraico; “você” oferece leitura corrente e internacionalmente inteligível.
