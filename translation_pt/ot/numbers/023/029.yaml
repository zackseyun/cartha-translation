  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: pt
  text: 'Então Balaão disse a Balaque: “Construa aqui sete altares para mim e prepare aqui sete novilhos e sete carneiros.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa com naturalidade a sequência em português.
- source_word: בִּלְעָם אֶל בָּלָק
  choice: Balaão disse a Balaque
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português, com a regência natural de “dizer a”.
- source_word: בְּנֵה
  choice: Construa
  rationale: Imperativo de בנה; “construir” é claro e idiomático para erguer altares.
- source_word: לִי
  choice: para mim
  rationale: 'O ל marca benefício ou finalidade: os altares e animais seriam providenciados para o uso de Balaão.'
- source_word: בָּזֶה
  choice: aqui
  rationale: Equivalente locativo natural de “neste lugar”; a repetição foi preservada nas duas ocorrências.
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: sete altares
  rationale: Correspondência direta e corrente do sintagma numeral.
- source_word: וְהָכֵן
  choice: e prepare
  rationale: O imperativo hifil de כון significa deixar pronto ou providenciar; “prepare” se ajusta ao contexto sacrificial.
- source_word: שִׁבְעָה פָרִים
  choice: sete novilhos
  rationale: פָּר designa um bovino macho, frequentemente jovem, oferecido em sacrifício; “novilhos” é a forma bíblica corrente e precisa em português.
- source_word: וְשִׁבְעָה אֵילִים
  choice: e sete carneiros
  rationale: אֵילִים são ovinos machos adultos; “carneiros” é o equivalente português natural no contexto sacrificial.
