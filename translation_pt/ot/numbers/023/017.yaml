  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: pt
  text: 'Balaão foi até ele e, eis que Balac estava de pé junto ao seu holocausto, acompanhado dos líderes de Moabe[a]. Então Balac lhe perguntou: “O que Yahweh disse?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “autoridades de Moabe”.
    reason: שָׂרִים abrange líderes ou autoridades de posição elevada; “autoridades” é uma alternativa lexical válida.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: Balaão foi até ele
  rationale: בוא significa normalmente “vir”, “ir” ou “entrar”. O contexto identifica Balaão como quem se aproxima; “foi até ele” evita interpretar o verbo especificamente como “voltou”, sem deixar a frase artificialmente obscura em português.
- source_word: וְהִנּוֹ
  choice: e, eis que
  rationale: A partícula chama vividamente a atenção para a cena encontrada por Balaão. “Eis que” conserva essa função discursiva e o tom digno do relato.
- source_word: נִצָּב
  choice: estava de pé
  rationale: O particípio descreve a posição contínua de Balac no momento da chegada de Balaão.
- source_word: עַל עֹלָתוֹ
  choice: junto ao seu holocausto
  rationale: עַל pode indicar proximidade espacial neste contexto. “Junto a” é natural em português e não sugere que Balac estivesse literalmente sobre a oferta.
- source_word: עֹלָתוֹ
  choice: seu holocausto
  rationale: עֹלָה é o termo sacrificial para a oferta inteiramente queimada; “holocausto” é o equivalente bíblico estabelecido em português.
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: acompanhado dos líderes de Moabe
  rationale: שָׂרִים pode designar líderes, chefes, príncipes ou autoridades. A formulação transmite naturalmente que eles estavam com Balac, sem alterar a relação expressa no hebraico.
- source_word: וַיֹּאמֶר לוֹ בָּלָק
  choice: Então Balac lhe perguntou
  rationale: Embora אמר seja literalmente “disse”, a fala introduzida é uma pergunta direta; “perguntou” é a forma idiomática em português. “Então” mantém a progressão narrativa.
- source_word: מַה דִּבֶּר
  choice: O que ... disse?
  rationale: דבר significa “falar” ou “dizer”. Nesta pergunta, “o que disse?” é direto, corrente e preserva a referência à mensagem divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O texto traz o nome divino יהוה, não um título. A transliteração “Yahweh” preserva o nome pessoal presente no hebraico.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega explicitamente o Tetragrama. “Yahweh” representa o nome em vez de substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Referente de “seu holocausto”
  choice: Manter o possessivo na formulação do texto
  alternative: Explicitar “o holocausto de Balac”
  rationale: O sufixo hebraico é masculino singular e, pelo contexto, refere-se naturalmente a Balac; manter “seu” conserva a forma do original e sua leve ambiguidade gramatical.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Os nomes Balaão e Balac esclarecem os referentes exigidos pela sintaxe portuguesa e pelo contexto imediato; conserva-se “eis que” para reproduzir a vivacidade narrativa do hebraico.
