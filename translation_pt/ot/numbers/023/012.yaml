  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: pt
  text: 'Ele respondeu e disse[a]: “Não devo ter o cuidado de falar aquilo que Yahweh põe na minha boca?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Não devo guardar para falar aquilo que Yahweh põe na minha boca?” O verbo hebraico pode indicar guardar, observar ou ater-se cuidadosamente ao que deve ser dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: Ele respondeu e disse
  rationale: Preserva a fórmula narrativa hebraica que introduz a resposta de Balaão; embora redundante em português corrente, ela continua clara e digna.
- source_word: הֲלֹא
  choice: Não devo
  rationale: Expressa a pergunta retórica que espera resposta afirmativa e comunica a obrigação de Balaão sem tornar sua fala mecanicamente compulsória.
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: aquilo que
  rationale: Representa o objeto antecipado e retomado por pronome no hebraico de modo natural em português.
- source_word: יָשִׂים
  choice: põe
  rationale: Mantém a imagem hebraica de palavras colocadas na boca e soa natural no presente contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּפִי
  choice: na minha boca
  rationale: Conserva a metáfora concreta hebraica da fala concedida por Deus.
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: ter o cuidado de falar
  rationale: Comunica o sentido de guardar, observar ou ater-se cuidadosamente ao falar, sem recorrer à construção excessivamente literal e pouco natural 'guardar para falar'.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino; a transliteração preserva sua função como nome próprio.
- issue: Grau de obrigação e observância na fala de Balaão
  choice: Não devo ter o cuidado de falar
  alternative: Não devo falar; Não devo dizer somente
  rationale: A formulação preserva tanto a força retórica de הֲלֹא quanto a nuance de observância cuidadosa de שׁמר com infinitivo, sem acrescentar 'somente', que não aparece explicitamente.
translation_notes:
  register: Português moderno, claro e reverente, com ampla legibilidade brasileira. A fórmula “respondeu e disse” foi mantida para refletir a estrutura narrativa hebraica; “ter o cuidado de falar” conserva uma nuance lexical real que uma versão mais curta poderia apagar.
