  terminology: “Retos” é uma opção lexical defensável para יְשָׁרִים, mantendo a ideia de integridade/retidão sem antecipar a alternativa interpretativa “justos”. “Quarta parte” traduz diretamente רֹבַע e a nota registra, sem resolver no texto, a possibilidade de entender a expressão em termos de divisões ou de uma fração de Israel.
