  source_fidelity: 'A tradução preserva adequadamente as imagens e a sintaxe poética do hebraico: o “pó de Jacó”, a expressão difícil “a quarta parte de Israel”, “minha alma” como sujeito do desejo, o plural “dos retos” e a referência final singular. “Ou calcular” representa de modo natural o paralelismo retórico introduzido por waw, sem alegar uma distinção lógica rígida que o hebraico não exige.'
