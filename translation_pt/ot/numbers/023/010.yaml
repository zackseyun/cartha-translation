  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: pt
  text: 'Quem pode contar o pó de Jacó

    ou calcular a quarta parte de Israel[a]?

    Que a minha alma morra a morte dos retos[b],

    e que o meu fim seja como o dele[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contar as divisões de Israel”; mais interpretativamente, “contar sequer a quarta parte de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos justos”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico traz uma forma singular, literalmente “como ele”. Ela pode se referir a uma pessoa reta representativa, embora “os retos” esteja no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי מָנָה
  choice: Quem pode contar
  rationale: A pergunta é retórica; “pode” explicita em português a impossibilidade sugerida pelo contexto, sem alterar a força poética.
- source_word: עֲפַר יַעֲקֹב
  choice: o pó de Jacó
  rationale: Mantém a imagem do pó como figura de uma descendência incontável e conserva “Jacó” no paralelismo poético com “Israel”.
- source_word: וּמִסְפָּר
  choice: ou calcular
  rationale: Embora מִסְפָּר tenha forma nominal, o paralelismo pede valor verbal. “Calcular” evita a repetição imediata de “contar” e comunica a ideia de determinar numericamente.
- source_word: אֶת רֹבַע יִשְׂרָאֵל
  choice: a quarta parte de Israel
  rationale: Preserva o sentido mais direto de רֹבַע e deixa aberta a referência exata, em vez de substituí-la por uma interpretação como “multidão”.
- source_word: תָּמֹת נַפְשִׁי
  choice: Que a minha alma morra
  rationale: Conserva נַפְשִׁי como sujeito e a dicção poética do hebraico; a forma optativa “Que...” expressa naturalmente o desejo de Balaão.
- source_word: מוֹת יְשָׁרִים
  choice: a morte dos retos
  rationale: “Retos” reproduz o sentido de pessoas moralmente íntegras sem impor ao termo uma formulação teológica mais técnica.
- source_word: וּתְהִי אַחֲרִיתִי
  choice: e que o meu fim seja
  rationale: “Fim” expressa de modo conciso אַחֲרִית no paralelismo com a morte.
- source_word: כָּמֹהוּ
  choice: como o dele
  rationale: Mantém o sufixo masculino singular do hebraico e, em português, relaciona a comparação diretamente com “meu fim”.
theological_decisions:
- issue: Sentido de יְשָׁרִים
  choice: os retos
  alternative: os justos
  rationale: “Retos” acompanha mais de perto a ideia lexical de ישר e preserva a dimensão moral e religiosa sem transformar o termo numa categoria forense mais específica.
- issue: Interpretação de רֹבַע יִשְׂרָאֵל
  choice: a quarta parte de Israel
  alternative: a multidão de Israel
  rationale: A tradução formal preserva a imagem difícil e a ambiguidade do texto hebraico; a leitura contextual de que nem sequer um quarto de Israel poderia ser contado fica disponível em nota, sem ser incorporada ao texto.
- issue: Número gramatical em כָּמֹהוּ
  choice: como o dele
  alternative: como o deles
  rationale: O hebraico traz um sufixo singular, possivelmente referindo-se ao reto representativo, embora יְשָׁרִים seja plural coletivo. O texto conserva essa tensão, esclarecida em nota.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. Mantiveram-se “minha alma”, “quarta parte” e o singular final para refletir as formas e tensões do hebraico, com notas breves onde a expressão pode soar menos imediata.
