  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: pt
  text: 'Então Balaque disse a Balaão: “O que você fez comigo? Eu trouxe você para amaldiçoar meus inimigos, mas veja: você os abençoou de fato[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser traduzido por “você certamente os abençoou” ou “você realmente os abençoou”; emprega um verbo conjugado junto com um infinitivo absoluto para dar ênfase.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá prosseguimento à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: מֶה עָשִׂיתָ לִי
  choice: O que você fez comigo?
  rationale: Tradução direta e idiomática da pergunta, preservando a indignação de Balaque.
- source_word: לָקֹב
  choice: amaldiçoar
  rationale: Neste contexto, קבב significa pronunciar uma maldição contra alguém; “amaldiçoar” é o equivalente português mais claro.
- source_word: אֹיְבַי
  choice: meus inimigos
  rationale: Reproduz diretamente o substantivo plural com sufixo possessivo.
- source_word: לְקַחְתִּיךָ
  choice: Eu trouxe você
  rationale: Embora לקח signifique literalmente “tomar/pegar”, aqui descreve Balaque fazendo Balaão vir para sua missão. “Trouxe você” é natural em português e evita sugerir explicitamente uma contratação, ideia não expressa pelo verbo neste versículo.
- source_word: וְהִנֵּה
  choice: mas veja
  rationale: “Veja” comunica a surpresa enfática de הִנֵּה em linguagem moderna; “mas” torna explícito o contraste exigido pelo contexto.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: você os abençoou de fato
  rationale: A combinação de verbo finito e infinitivo absoluto intensifica a ação. “De fato” preserva essa ênfase sem introduzir a ideia adicional de abundância; “os” explicita em português o objeto implícito, retomando “meus inimigos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. “Veja” foi preferido a “eis que” para conservar a força dêitica sem elevar desnecessariamente o registro.
