source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: pt
  text: Eis que um povo se levanta como uma leoa e se ergue como um leão; não se deitará até comer a presa e beber o sangue dos mortos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶן
  choice: Vejam
  rationale: Interjeição dêitica que introduz uma observação enfática. “Vejam” é atual, vívido e adequado ao discurso dirigido aos presentes.
- source_word: עָם
  choice: um povo
  rationale: Mantém o sentido coletivo e poético referente a Israel, sem introduzir as conotações políticas modernas de “nação”.
- source_word: כְּלָבִיא
  choice: como uma leoa
  rationale: לָבִיא pode designar leão ou leoa; “leoa” preserva uma possível distinção lexical em relação a אֲרִי na linha paralela, sem ocultar a alternativa.
- source_word: יָקוּם
  choice: se levanta
  rationale: O imperfeito qal de קום retrata o animal que se põe de pé; a forma reflexiva é natural em português.
- source_word: וְכַאֲרִי
  choice: como um leão
  rationale: אֲרִי é um termo comum para leão. A tradução evita acrescentar ideias de tamanho, idade ou ferocidade não expressas pelo termo.
- source_word: יִתְנַשָּׂא
  choice: se ergue
  rationale: O hitpael de נשׂא comunica elevar-se ou assumir postura imponente; “se ergue” conserva a imagem concreta e evita o sentido abstrato de autoexaltação.
- source_word: לֹא יִשְׁכַּב
  choice: não se deitará
  rationale: O futuro é apropriado ao caráter profético-poético do enunciado e mantém a imagem concreta do leão.
- source_word: עַד יֹאכַל טֶרֶף
  choice: até comer a presa
  rationale: Traduz יֹאכַל diretamente por “comer”, sem intensificá-lo como “devorar”, e verte טֶרֶף pelo termo natural “presa”.
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: e beber o sangue dos mortos
  rationale: חֲלָלִים, neste contexto de conflito, designa os mortos ou abatidos. “Dos mortos” é claro e preserva a imagem deliberadamente forte.
theological_decisions:
- issue: Imagem de violência no oráculo de Balaão
  choice: Manter sem suavização a imagem predatória de comer a presa e beber o sangue dos mortos.
  alternative: Substituir a imagem por linguagem geral de vitória ou triunfo.
  rationale: O hebraico emprega intencionalmente uma metáfora forte de leão para retratar poder irresistível e triunfo militar. A tradução deve conservar essa tensão sem entendê-la como prescrição de beber sangue literalmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “Vejam” torna natural a interjeição dirigida aos ouvintes; o paralelismo e a imagem poética forte do hebraico foram preservados.
