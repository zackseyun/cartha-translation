base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: pt
  text: 'Então ele proferiu sua declaração[a] e disse:


    “Levante-se, Balaque, e ouça;

    escute-me, filho de Zipor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu oráculo” ou “seu provérbio”. O termo hebraico מָשָׁל pode designar um provérbio ou uma declaração poética formal; aqui introduz o pronunciamento solene de Balaão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: ele proferiu sua declaração
  rationale: A combinação idiomática introduz uma fala formal e poética. “Proferiu” expressa naturalmente o ato de enunciar, enquanto “declaração” preserva a solenidade sem definir o termo exclusivamente como profecia ou provérbio.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Forma narrativa comum que introduz discurso direto; a tradução simples mantém a sequência hebraica.
- source_word: קוּם
  choice: Levante-se
  rationale: Imperativo dirigido a Balaque. É atual, digno e menos coloquial que “fique de pé” em contexto poético.
- source_word: וּשֲׁמָע
  choice: e ouça
  rationale: “Ouça” conserva o paralelismo com o verbo seguinte e corresponde ao sentido básico de escutar/ouvir.
- source_word: הַאֲזִינָה עָדַי
  choice: escute-me
  rationale: O verbo pede atenção auditiva e intensifica o chamado anterior. “Escute-me” é natural em português e inclui adequadamente a direção expressa por עָדַי.
- source_word: בְּנוֹ צִפֹּר
  choice: filho de Zipor
  rationale: Mantém a identificação patronímica e a forma solene de tratamento do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura em versos para refletir o caráter poético. A formulação preserva o paralelismo entre “ouça” e “escute-me” e evita atribuir a מָשָׁל um sentido mais específico do que o contexto exige.
