  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: pt
  text: 'Então Yahweh pôs uma palavra na boca de Balaão e disse: “Volte a Balaque e fale assim.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: pôs
  rationale: שׂוּם significa pôr, colocar ou estabelecer. “Pôs” preserva de modo natural a imagem concreta do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דָּבָר
  choice: uma palavra
  rationale: Mantém o singular do hebraico e a expressão que apresenta a fala concedida por Deus; “mensagem” seria possível, mas mais interpretativo.
- source_word: בְּפִי בִלְעָם
  choice: na boca de Balaão
  rationale: Reproduz com clareza e naturalidade a imagem hebraica da palavra colocada na boca do falante.
- source_word: שׁוּב אֶל בָּלָק
  choice: Volte a Balaque
  rationale: O imperativo שׁוּב ordena retornar; “volte” é direto e corrente em português. A preposição “a” conserva a direção para Balaque.
- source_word: וְכֹה תְדַבֵּר
  choice: e fale assim
  rationale: כֹה significa “assim/deste modo”, e תְדַבֵּר é uma forma verbal de “falar”. A construção transmite naturalmente a ordem sem tornar explícito um conteúdo que o hebraico deixa para a fala seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Natureza da palavra dada a Balaão
  choice: uma palavra
  alternative: uma mensagem
  rationale: A tradução conserva o singular e a metáfora do texto, sem definir além do necessário se דָּבָר deve ser entendido tecnicamente como uma mensagem profética.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação concisa preserva a sequência narrativa e o idioma concreto do hebraico sem arcaísmo.
