  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: pt
  text: Como posso amaldiçoar quem Deus não amaldiçoou? E como posso condenar quem Yahweh não condenou?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E como posso indignar-me contra quem Yahweh não se indignou?” O verbo hebraico da segunda linha pode enfatizar tanto a indignação como sua expressão em condenação ou denúncia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Como posso
  rationale: Na pergunta retórica, introduz uma impossibilidade, não um simples pedido de informação; a formulação é natural em português.
- source_word: אֶקֹּב / קַבֹּה
  choice: amaldiçoar / amaldiçoou
  rationale: Preserva a correspondência lexical e o sentido explícito de lançar uma maldição no contexto do oráculo de Balaão.
- source_word: אֵל
  choice: Deus
  rationale: Traduz o título divino אֵל de modo claro e corrente, mantendo-o distinto do nome próprio na segunda linha.
- source_word: אֶזְעֹם / זָעַם
  choice: condenar / condenou
  rationale: Expressa o ato hostil de denunciar ou reprovar sob indignação e mantém a repetição lexical dentro da segunda linha, sem confundi-lo com o verbo 'amaldiçoar'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e conserva a distinção poética entre אֵל e יהוה.
theological_decisions:
- issue: Distinção entre os nomes divinos אֵל e יְהוָה
  choice: Deus e Yahweh
  alternative: Traduzir ambos como Deus, ou substituir יהוה por SENHOR
  rationale: O hebraico emprega deliberadamente um título divino na primeira linha e o nome pessoal na segunda; a tradução preserva essa distinção.
- issue: Força semântica de זעם
  choice: condenar
  alternative: indignar-se contra
  rationale: O verbo pode denotar tanto indignação quanto sua expressão em denúncia ou condenação. O texto principal usa uma formulação natural ligada ao discurso hostil, enquanto a nota preserva a alternativa afetiva.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo retórico preservado. A construção 'Como posso' comunica a impossibilidade implícita; 'quem' mantém sem especificar no texto aquilo que o hebraico deixa contextual.
