translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Então” representa a progressão narrativa do segundo וַ sem acrescentar conteúdo teológico. O marcador [a] foi colocado após a oração sacrificial à qual a nota se refere.
