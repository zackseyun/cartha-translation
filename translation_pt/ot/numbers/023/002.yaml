revisions:
- from: Balaque fez conforme Balaão havia dito. Então Balaque e Balaão ofereceram um novilho e um carneiro sobre o altar.[a]
  to: Balaque fez conforme Balaão havia dito, e Balaque e Balaão ofereceram um touro e um carneiro sobre o altar.[a]
  rationale: A revisão substitui «novilho» por «touro» para evitar uma especificação etária ausente no hebraico, corrige o singular da glosa literal da nota e torna a ligação narrativa mais diretamente correspondente ao waw hebraico. O plural em «ofereceram» é português natural para os dois nomes coordenados e preserva o sentido expresso pela tradução inglesa de auditoria.
