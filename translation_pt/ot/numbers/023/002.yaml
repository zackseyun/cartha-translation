  text: וַ/יַּ֣עַשׂ בָּלָ֔ק כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בִּלְעָ֑ם וַ/יַּ֨עַל בָּלָ֧ק וּ/בִלְעָ֛ם פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/002.yaml
  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: pt
  text: Balaque fez conforme Balaão havia dito, e Balaque e Balaão ofereceram um touro e um carneiro sobre o altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fez subir”; no contexto sacrificial, a expressão significa “ofereceu” ou “ofereceu em sacrifício”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: Na construção עשה כאשר דבר, o verbo indica fazer ou cumprir aquilo que foi dito; “fez” é natural e direto em português.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: conforme Balaão havia dito
  rationale: A oração indica conformidade com a instrução anterior de Balaão. “Havia dito” explicita naturalmente a anterioridade no relato.
- source_word: וַיַּעַל
  choice: ofereceram
  rationale: O hifil de עלה, com animais sacrificiais e altar, é uma expressão cultual que significa oferecer em sacrifício. O plural concorda com os sujeitos coordenados Balaque e Balaão.
- source_word: פָּר
  choice: um novilho
  rationale: פָּר designa um bovino macho usado em sacrifício. “Novilho” é uma designação corrente e adequada em português bíblico, embora “touro” também seja possível.
- source_word: וָאַיִל
  choice: e um carneiro
  rationale: אַיִל é o termo comum para o carneiro adulto, especialmente em contexto sacrificial.
- source_word: בַּמִּזְבֵּחַ
  choice: sobre o altar
  rationale: A preposição ב, neste contexto sacrificial, indica o local onde a oferta foi apresentada; “sobre o altar” preserva essa relação espacial.
