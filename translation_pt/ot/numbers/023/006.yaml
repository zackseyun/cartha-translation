base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: pt
  text: Então Balaão voltou a Balaque, e eis que ele estava de pé junto ao seu holocausto, ele e todos os líderes de Moabe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: Então Balaão voltou a Balaque
  rationale: 'Os pronomes hebraicos podem ser explicitados pelo contexto imediato: Balaão é quem volta, e Balaque é aquele a quem ele retorna. A explicitação evita ambiguidade artificial em português.'
- source_word: וְהִנֵּה
  choice: Ele ainda estava
  rationale: Aqui a partícula apresenta a situação encontrada por Balaão; em português corrente, “ainda estava” comunica naturalmente que Balaque permanecia onde havia sido deixado.
- source_word: נִצָּב עַל־עֹלָתוֹ
  choice: em pé junto ao seu holocausto
  rationale: נִצָּב indica estar ou permanecer em pé; עַל, neste contexto espacial, significa junto a ou ao lado de. “Holocausto” conserva o termo tradicional para a oferta inteiramente queimada.
- source_word: שָׂרֵי מוֹאָב
  choice: líderes de Moabe
  rationale: שָׂרִים designa autoridades ou chefes. “Líderes” é claro, digno e menos sujeito a sugerir um título nobiliárquico europeu do que “príncipes”.
