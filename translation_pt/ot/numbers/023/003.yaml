  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: pt
  text: 'Então Balaão disse a Balaque: “Fique junto ao seu holocausto, e eu irei. Talvez Yahweh venha ao meu encontro; o que quer que ele me mostre, eu contarei a você.” E Balaão foi até uma elevação descampada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma elevação árida” ou “uma colina descampada”. O termo hebraico é raro e provavelmente indica um lugar alto, nu e exposto.'
    reason: Alternativa lexical para שֶׁפִי; o sentido topográfico exato é incerto.
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: Fique junto do seu holocausto
  rationale: O imperativo hitpael de יצב indica tomar posição ou permanecer em determinado lugar. Com עַל e a oferta, “junto de” expressa a relação espacial sem sugerir que Balaque devesse ficar sobre o sacrifício. עֹלָה designa especificamente o holocausto, oferta inteiramente queimada.
- source_word: וְאֵלְכָה
  choice: enquanto eu vou
  rationale: A forma coortativa exprime a ação pretendida por Balaão. Neste contexto, “enquanto eu vou” liga naturalmente a ordem dada a Balaque à saída de Balaão, sem acrescentar destino não expresso.
- source_word: אוּלַי יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: Talvez Yahweh venha ao meu encontro
  rationale: אוּלַי preserva a incerteza de Balaão. O nifal de קרה com לִקְרָאתִי descreve um encontro que ocorre; “venha ao meu encontro” é idiomático em português e mantém a expectativa de uma manifestação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino representado pelo Tetragrama é transliterado como “Yahweh”, em vez de ser substituído por um título.
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: o que quer que ele me mostre
  rationale: A construção hebraica é condensada. מַה com o hifil de ראה comunica o conteúdo que Deus fizer Balaão ver; a formulação portuguesa preserva a abrangência indefinida sem inserir “palavra” de modo artificial.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: eu contarei a você
  rationale: O hifil de נגד significa contar, comunicar ou declarar. “Contarei a você” é claro, corrente e adequado ao registro narrativo.
- source_word: שֶׁפִי
  choice: um lugar alto e descampado
  rationale: O termo raro provavelmente designa uma elevação nua, aberta ou sem vegetação. A expressão escolhida torna a referência topográfica compreensível e conserva tanto a altura quanto o caráter exposto do local.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Como o texto hebraico emprega o nome próprio divino, a tradução o conserva por transliteração, sem substituí-lo por um título.
- issue: Grau de certeza do encontro divino
  choice: Talvez Yahweh venha ao meu encontro
  alternative: Yahweh virá ao meu encontro
  rationale: A partícula אוּלַי apresenta a expectativa de Balaão como possibilidade, não como certeza. A tradução mantém essa tensão e não transforma sua esperança em promessa divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais no Brasil. “Holocausto” preserva o termo sacrificial tradicional e preciso. O pronome explícito em “ele me mostre” evita ambiguidade, e a nota mantém visível a incerteza lexical do termo topográfico final.
