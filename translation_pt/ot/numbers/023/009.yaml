  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: pt
  text: 'Pois, do alto dos rochedos, eu o vejo,

    e das colinas eu o contemplo.

    Eis um povo que habita à parte

    e não se conta entre as nações.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e não será contado entre as nações”. O verbo hebraico pode ser entendido em sentido passivo, bem como reflexivo ou médio.'
    reason: Leitura alternativa permitida pela forma verbal hebraica.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a força explicativa e conectiva da partícula no desenvolvimento do oráculo, sem tornar a relação estritamente causal.
- source_word: מֵרֹאשׁ צֻרִים
  choice: do alto dos rochedos
  rationale: Expressa de modo natural a imagem topográfica de um ponto de observação elevado; “rochedos” comunica melhor as elevações rochosas do que o genérico “pedras”.
- source_word: אֶרְאֶנּוּ
  choice: eu o vejo
  rationale: Preserva o objeto pronominal masculino singular, que retoma coletivamente Israel como povo.
- source_word: וּמִגְּבָעוֹת
  choice: e das colinas
  rationale: Conserva o paralelismo poético com os rochedos e traduz diretamente a referência às elevações.
- source_word: אֲשׁוּרֶנּוּ
  choice: eu o contemplo
  rationale: Distingue este verbo poético do anterior “ver” e sugere observação atenta sem recorrer a linguagem arcaica.
- source_word: הֶן
  choice: Eis
  rationale: Partícula que chama a atenção para a declaração seguinte; “Eis” é conciso, digno e corrente no registro bíblico em português.
- source_word: עָם
  choice: um povo
  rationale: Representa uma comunidade coletiva e preserva o contraste com “as nações”.
- source_word: לְבָדָד יִשְׁכֹּן
  choice: que habita à parte
  rationale: Comunica a condição característica de separação ou distinção sem sugerir necessariamente solidão emocional; o presente também permite uma descrição proverbial sem excluir a projeção do oráculo.
- source_word: וּבַגּוֹיִם
  choice: entre as nações
  rationale: Expressa naturalmente a classificação de Israel em relação aos demais povos.
- source_word: לֹא יִתְחַשָּׁב
  choice: não se considera
  rationale: Conserva a leitura reflexiva ou média possível do hitpael de חשׁב e produz uma frase clara em português.
theological_decisions:
- issue: Se יִתְחַשָּׁב deve ser entendido reflexivamente ou passivamente
  choice: não se considera entre as nações
  alternative: não será contado entre as nações
  rationale: A forma hitpael admite sentido reflexivo/médio, adotado no texto, mas também pode ser compreendida passivamente. A alternativa é registrada em nota para preservar a ambiguidade genuína sem transformar a distinção de Israel em afirmação de superioridade étnica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O paralelismo poético foi mantido em quatro linhas; “Eis” conserva a elevação literária sem tornar o texto excessivamente arcaico.
