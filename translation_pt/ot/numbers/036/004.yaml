  source_fidelity: A tradução preserva adequadamente a força prospectiva de וְאִם («E, quando»), o evento do Jubileu, a repetição enfática de «herança» e o contraste entre a tribo receptora e a tribo ancestral dos falantes. «Será acrescentada» e «será retirada» exprimem com fidelidade as consequências jurídicas dos nifais וְנוֹסְפָה e יִגָּרַע. A formulação «à qual elas passarem a pertencer» é uma boa explicitação contextual da relação das filhas com a tribo em que se integrarão por casamento, sem introduzir afirmação doutrinária ou histórica indevida.
  naturalness: O português é moderno, claro e apropriado ao registro jurídico-narrativo do contexto. «Chegar o Jubileu», «a herança delas» e «a tribo de nossos pais» soam naturais e inteligíveis para leitores brasileiros e internacionais. A repetição de «herança» é justificadamente mantida, pois reproduz a ênfase e a cadeia sintática do hebraico.
  terminology: «Jubileu», «filhos de Israel», «herança» e «tribo» são termos consistentes com o vocabulário bíblico e com o contexto de repartição territorial. A nota em [a] fornece de modo suficiente a alternativa idiomática «israelitas», preservando no texto a expressão familiar do hebraico.
