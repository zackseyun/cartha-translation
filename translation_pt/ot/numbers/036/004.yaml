source:
  edition: WLC
  text: וְ/אִם יִהְיֶ֣ה הַ/יֹּבֵל֮ לִ/בְנֵ֣י יִשְׂרָאֵל֒ וְ/נֽוֹסְפָה֙ נַחֲלָתָ֔/ן עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִֽ/נַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔י/נוּ יִגָּרַ֖ע נַחֲלָתָֽ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: pt
  text: E, quando chegar o Jubileu para os filhos de Israel[a], a herança delas será acrescentada à herança da tribo à qual elas passarem a pertencer, e a herança delas será retirada da herança da tribo de nossos pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para os israelitas»; tradicionalmente, «para os filhos de Israel». O hebraico diz literalmente «para os filhos de Israel».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: E, quando
  rationale: Embora a expressão possa ser condicional, «e, se», o argumento jurídico trata o Jubileu como uma eventualidade futura prevista. «E, quando» comunica essa força contextual sem eliminar por completo o pano de fundo condicional.
- source_word: יִהְיֶה הַיֹּבֵל
  choice: chegar o Jubileu
  rationale: O verbo היה, aplicado a esse acontecimento do calendário, é expresso naturalmente em português por «chegar». «Jubileu» é o termo consagrado para יוֹבֵל.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Preserva a expressão familiar explícita do hebraico. Uma nota registra a alternativa idiomática «para os israelitas».
- source_word: וְנוֹסְפָה
  choice: será acrescentada
  rationale: O nifal apresenta a herança como sendo adicionada ao patrimônio territorial de outra tribo; o futuro convém à consequência jurídica prevista.
- source_word: נַחֲלָתָן
  choice: a herança delas
  rationale: נחלה designa aqui a propriedade territorial herdada. O possessivo feminino plural remete às filhas discutidas no contexto e é explicitado naturalmente em português.
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: à herança da tribo
  rationale: Com יסף, a preposição על indica acréscimo a outro quinhão territorial. «À herança» é idiomático e mantém o sentido jurídico.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: à qual elas passarem a pertencer
  rationale: A oração se refere à tribo à qual as mulheres ficarão vinculadas por casamento. A formulação conserva o valor relacional e futuro sem recorrer a uma tradução portuguesa rígida.
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: da herança da tribo de nossos pais
  rationale: Mantém a distinção entre a tribo que receberia a terra e a tribo ancestral dos falantes, preservando a linguagem patriarcal concreta do texto.
- source_word: יִגָּרַע
  choice: será retirada
  rationale: O nifal de גרע indica redução ou remoção. «Será retirada» expressa claramente a transferência que diminuiria o território da tribo ancestral.
