id: NUM.36.5
reference: Numbers 36:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: pt
  text: 'Então Moisés ordenou aos filhos de Israel, segundo a palavra de Yahweh[a]: “A tribo dos filhos de José tem razão no que diz[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “segundo a boca de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fala corretamente” ou “está certa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ordenou
  rationale: Preserva a força de autoridade do verbo צוה, que indica dar uma ordem ou determinação.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém de modo transparente a expressão familiar hebraica, sem impedir a compreensão em português atual.
- source_word: עַל פִּי יְהוָה
  choice: segundo a palavra de Yahweh
  rationale: Expressa naturalmente a ideia de conformidade com a declaração ou ordem divina, enquanto a nota registra a imagem literal da boca.
- source_word: לֵאמֹר
  choice: dois-pontos antes da fala direta
  rationale: Em português, os dois-pontos introduzem a citação de forma mais natural do que o calque 'dizendo', sem perda de conteúdo.
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: a tribo dos filhos de José
  rationale: Neste contexto de organização tribal, מַטֶּה significa 'tribo'; a construção familiar 'filhos de José' preserva a forma hebraica.
- source_word: כֵּן ... דֹּבְרִים
  choice: tem razão no que diz
  rationale: Reproduz em português idiomático tanto o ato de falar expresso por דֹּבְרִים quanto a avaliação afirmativa de כֵּן.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino, não um título; a transliteração 'Yahweh' preserva essa distinção sem substituir o nome por 'SENHOR'.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A formulação 'tem razão no que diz' evita uma construção artificial, preservando simultaneamente a referência à fala e o juízo de que a reivindicação da tribo estava correta.
