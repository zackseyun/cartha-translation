source:
  edition: WLC
  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: pt
  text: Elas se casaram com homens dos clãs dos filhos de Manassés, filho de José[a], e a herança delas permaneceu na tribo do clã de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre as famílias dos filhos de Manassés, filho de José”. O termo hebraico de parentesco pode ser traduzido por “famílias” ou “clãs”, conforme o grau de especificidade dado à estrutura tribal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: com homens dos clãs de
  rationale: A construção indica que os maridos vieram dentre os clãs de Manassés. Em português, “casaram-se com homens dos clãs de” comunica naturalmente essa origem sem sugerir que elas se casaram com clãs como coletividades.
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: dos filhos de Manassés, filho de José
  rationale: Preserva a expressão genealógica do hebraico e mantém visível a estrutura tribal, com pontuação natural em português.
- source_word: הָיוּ לְנָשִׁים
  choice: Elas se casaram
  rationale: A expressão literal “tornaram-se esposas” é vertida pela formulação portuguesa corrente, mantendo as mulheres como sujeito e expressando claramente o casamento.
- source_word: נַחֲלָתָן
  choice: a herança delas
  rationale: Neste contexto legal, o termo designa a propriedade territorial herdada. “Herança” é claro e preserva a linguagem recorrente do livro.
- source_word: וַתְּהִי
  choice: permaneceu
  rationale: Embora o verbo possa significar simplesmente “foi” ou “veio a ficar”, o contexto ressalta que a herança continuou vinculada à tribo correta depois dos casamentos.
- source_word: עַל מַטֵּה
  choice: na tribo
  rationale: Aqui מַטֶּה designa a tribo, e a preposição expressa vinculação territorial ou jurídica. “Permaneceu na tribo” é idiomático em português.
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: do clã de seu pai
  rationale: O singular coletivo identifica o clã paterno pertinente. “Clã” distingue essa unidade interna da tribo de uma família doméstica comum.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A explicitação de “homens” torna natural a relação matrimonial implícita no hebraico, sem alterar o sentido. “Clã” foi mantido para representar uma subdivisão tribal, e “herança” conserva o vocabulário jurídico-territorial do contexto.
