base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: pt
  text: 'E disseram: “Yahweh ordenou ao meu senhor que desse a terra por herança, mediante sorteio, aos filhos de Israel[a]; e meu senhor recebeu de Yahweh a ordem de dar às filhas de Zelofeade, nosso irmão, a herança dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Israel” ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: É uma forma respeitosa de tratamento dirigida a Moisés, não um título divino; “meu senhor” conserva a deferência sem sugerir servidão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָתֵת אֶת הָאָרֶץ
  choice: desse a terra
  rationale: Expressa diretamente a concessão divina da terra; o sentido hereditário é explicitado pela expressão seguinte.
- source_word: בְּנַחֲלָה
  choice: por herança
  rationale: Conserva o sentido jurídico de propriedade territorial transmitida ou atribuída como herança.
- source_word: בְּגוֹרָל
  choice: mediante sorteio
  rationale: Indica de modo natural em português o procedimento usado para distribuir a terra.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a formulação masculina plural do hebraico e sua expressão pactual tradicional, embora a referência coletiva possa abranger todo o povo.
- source_word: צֻוָּה בַיהוָה
  choice: recebeu de Yahweh a ordem
  rationale: Traduz naturalmente o passivo intensivo e entende a preposição como fonte ou agente, sem produzir em português uma construção passiva pesada.
- source_word: נַחֲלַת צְלָפְחָד
  choice: a herança dele
  rationale: No contexto imediato, o pronome retoma Zelofeade com clareza e evita uma repetição pouco natural do nome.
- source_word: אָחִינוּ
  choice: nosso irmão
  rationale: Mantém literalmente a linguagem de parentesco empregada pelos chefes do clã, sem interpretá-la como mera relação tribal.
- source_word: לִבְנֹתָיו
  choice: às filhas de Zelofeade
  rationale: Explicita o referente do pronome para assegurar clareza na ordem dos complementos em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem corporativa de gênero em לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: descendentes de Israel; israelitas
  rationale: A opção conserva a forma masculina plural da fonte e sua formulação tradicional, enquanto a nota registra alternativas que tornam explícito o alcance coletivo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para evitar rigidez, mantendo o tom jurídico e respeitoso do discurso dirigido a Moisés.
