revisions:
- from: Estes são os mandamentos e as ordenanças que Yahweh deu por meio de Moisés aos filhos de Israel, nas planícies de Moabe, junto ao Jordão, diante de Jericó.[a][b]
  to: Estes são os mandamentos e as ordenanças que Yahweh ordenou, por meio de Moisés, aos filhos de Israel, nas planícies de Moabe, junto ao Jordão, defronte de Jericó.[a][b]
  rationale: A revisão substitui «deu» por «ordenou», refletindo diretamente צִוָּה e preservando o tom normativo da fórmula conclusiva. Também ajusta a indicação geográfica e a nota alternativa para maior precisão e naturalidade, sem eliminar a concisão nem impor uma interpretação além do texto.
