source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: pt
  text: Estes são os mandamentos e as ordenanças que Yahweh ordenou, por meio de Moisés, aos filhos de Israel, nas planícies de Moabe, junto ao Jordão, defronte de Jericó.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de Israel”; esta expressão da aliança refere-se coletivamente ao povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “junto ao Jordão de Jericó”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes são
  rationale: O demonstrativo plural introduz a fórmula conclusiva; em português, a cópula expressa produz uma frase natural.
- source_word: הַמִּצְוֺת
  choice: os mandamentos
  rationale: Preserva o tom jurídico e a ligação lexical com o verbo צִוָּה.
- source_word: וְהַמִּשְׁפָּטִים
  choice: e as ordenanças
  rationale: No contexto legal, מִשְׁפָּטִים designa determinações ou normas jurídicas; “ordenanças” evita que “julgamentos” seja entendido apenas como decisões judiciais.
- source_word: צִוָּה
  choice: deu
  rationale: Com “mandamentos e ordenanças” como objeto, “deu” é português natural e mantém a ideia de disposições autorizadas por Yahweh; a força de ordenar já está explícita em “mandamentos”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Traduz naturalmente o idioma hebraico literal “pela mão de Moisés”, preservando a função mediadora de Moisés.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico, esclarecida em nota para evitar uma leitura exclusivamente masculina.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: Expressa com clareza a região plana ou de estepe associada a Moabe.
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: junto ao Jordão, diante de Jericó
  rationale: Representa a localização à margem do Jordão, no lado oposto a Jericó, sem sugerir que o lugar ficava dentro da cidade.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva por transliteração, enquanto “SENHOR” o substitui por um título; “Javé” é uma adaptação portuguesa possível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico bíblico acessível. A ordem da frase segue de perto a fórmula conclusiva hebraica, mas evita literalismos pouco naturais.
