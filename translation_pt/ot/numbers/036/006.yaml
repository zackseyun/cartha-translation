  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: pt
  text: 'Esta é a palavra que Yahweh ordenou a respeito das filhas de Zelofeade: “Elas podem se casar com quem lhes parecer melhor[a]; contudo, devem se casar dentro do clã da tribo de seu pai[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com quem for bom aos olhos delas”; isto é, com quem elas julgarem melhor.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dentro da família da tribo de seu pai”. O hebraico combina os termos para clã ou família extensa e para tribo, enfatizando a preservação da herança na linhagem tribal paterna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Esta é a palavra
  rationale: דָּבָר pode significar “palavra”, “assunto” ou “coisa”. Aqui introduz uma determinação divina formal; “palavra” conserva sua força autoritativa.
- source_word: צִוָּה יְהוָה
  choice: Yahweh ordenou
  rationale: צוה expressa uma ordem, e o perfeito hebraico é vertido naturalmente pelo pretérito perfeito. O nome próprio יְהוָה é transliterado como “Yahweh”.
- source_word: לִבְנוֹת צְלָפְחָד
  choice: a respeito das filhas de Zelofeade
  rationale: A preposição ל pode indicar tanto as destinatárias como aquelas a quem a determinação diz respeito. “A respeito de” se ajusta ao contexto, no qual Moisés anuncia uma decisão referente a elas.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo quotativo hebraico introduz o conteúdo da ordem. Em português atual, os dois-pontos desempenham essa função com mais naturalidade do que “dizendo”.
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: com quem lhes parecer melhor
  rationale: A expressão significa literalmente “com o bom aos olhos delas”. A formulação escolhida comunica a liberdade de escolha matrimonial sem perder o sentido avaliativo do idioma hebraico.
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: se casar
  rationale: Embora a construção seja literalmente “ser/tornar-se esposas”, “casar-se” é a forma idiomática e clara em português, sem alterar o sentido.
- source_word: אַךְ
  choice: contudo
  rationale: אַךְ introduz aqui uma restrição à liberdade enunciada antes. “Contudo” assinala claramente essa limitação.
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: dentro do clã da tribo de seu pai
  rationale: A expressão reúne מִשְׁפָּחָה, “clã/família extensa”, e מַטֶּה, “tribo”. A tradução mantém ambos os níveis da organização social e a referência à linhagem paterna.
- source_word: תִּהְיֶינָה לְנָשִׁים (segunda ocorrência)
  choice: devem se casar
  rationale: Na repetição, a forma verbal está sob a força restritiva de אַךְ e expressa obrigação. “Devem” torna explícito esse valor prescritivo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança como nome próprio, sem substituí-lo por um título.
- issue: Equilíbrio entre liberdade de escolha e restrição tribal
  choice: “podem se casar com quem lhes parecer melhor”; “devem se casar dentro do clã”
  alternative: Transformar toda a frase numa ordem uniforme ou suavizar a restrição
  rationale: O hebraico mantém juntas uma permissão ampla e uma limitação obrigatória. A tradução preserva essa tensão jurídica sem ampliá-la nem resolvê-la teologicamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “clã” para distinguir a família extensa da tribo e usa formas verbais naturais em vez de reproduzir rigidamente o hebraísmo “tornar-se esposas”.
