  source_fidelity: A tradução reproduz com precisão a determinação de Yahweh relativa às filhas de Zelofeade. Mantém tanto a permissão de se casarem com quem lhes parecer melhor quanto a restrição obrigatória de casamento no âmbito do clã pertencente à tribo paterna. A expressão idiomática hebraica “o bom aos olhos delas” é adequadamente comunicada e explicada em nota.
