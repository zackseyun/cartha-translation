  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: pt
  text: Então se aproximaram os chefes das casas paternas[a] do clã dos filhos de Gileade, filho de Maquir, filho de Manassés, dentre os clãs dos filhos de José. E falaram diante de Moisés e diante dos líderes, os chefes das casas paternas dos filhos de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes das famílias” ou “chefes das casas ancestrais”. A expressão hebraica se refere aos líderes reconhecidos de unidades de parentesco na estrutura tribal de Israel.
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Israel” é a expressão formal do hebraico; também pode ser traduzida por “israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: se aproximaram
  rationale: O verbo קרב introduz aqui a aproximação formal de quem vem apresentar uma questão. “Aproximaram-se” preserva tanto o movimento quanto o contexto solene, sem explicitar além do hebraico.
- source_word: רָאשֵׁי הָאָבוֹת / רָאשֵׁי אָבוֹת
  choice: os chefes das casas paternas
  rationale: A expressão designa líderes reconhecidos de unidades de parentesco na organização tribal de Israel. “Casas paternas” mantém visível a estrutura social hebraica, e “chefes” expressa sua função de liderança.
- source_word: לְמִשְׁפַּחַת
  choice: do clã
  rationale: A preposição לְ marca relação ou pertencimento neste contexto. “Do clã” é natural em português e conserva a ligação genealógica.
- source_word: בְּנֵי גִלְעָד
  choice: os filhos de Gileade
  rationale: Mantém-se a fórmula genealógica hebraica “filhos de”, em vez de substituí-la por “descendentes”, para preservar a forma da linhagem.
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: filho de Maquir, filho de Manassés
  rationale: A repetição de “filho de” reproduz de maneira clara a sequência genealógica do texto hebraico.
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: pertencente aos clãs dos filhos de José
  rationale: A preposição מִן situa esse clã dentro do conjunto maior dos clãs de José. “Pertencente aos” explicita em português a relação classificatória indicada pelo hebraico sem alterar a genealogia.
- source_word: וַיְדַבְּרוּ
  choice: falaram
  rationale: דבר é o verbo comum para falar. A escolha evita acrescentar ênfase não expressa no original.
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂיאִם
  choice: diante de Moisés e diante dos líderes
  rationale: לִפְנֵי indica que falaram na presença dessas autoridades. “Diante de” preserva o caráter formal, e “líderes” comunica com clareza o papel dos נְשִׂיאִים.
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: os chefes das casas paternas dos filhos de Israel
  rationale: A frase funciona como aposto que identifica os líderes. “Filhos de Israel” conserva a expressão étnico-genealógica formal do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação conserva as expressões genealógicas “filhos de” e “casas paternas”, mas divide o longo período hebraico em duas frases para facilitar a leitura sem mudar suas relações sintáticas.
