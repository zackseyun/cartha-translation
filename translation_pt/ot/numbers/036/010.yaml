source:
  edition: WLC
  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלָפְחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: pt
  text: Assim como Yahweh havia ordenado a Moisés, assim fizeram as filhas de Zelofeade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Introduz a correspondência entre a ordem dada e a ação das filhas; a expressão é natural em português e preserva a ideia de conformidade.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O verbo expressa uma ordem. O pretérito mais-que-perfeito composto deixa clara, em português corrente, a anterioridade da ordem em relação à ação das filhas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Embora אֶת marque o objeto direto em hebraico, o verbo português 'ordenar', aplicado a uma pessoa, rege naturalmente a preposição 'a'.
- source_word: כֵּן
  choice: assim
  rationale: Retoma a comparação e indica que elas agiram em conformidade com a ordem.
- source_word: עָשׂוּ
  choice: fizeram
  rationale: Preserva o sentido simples de 'fazer' na construção correlativa כַּאֲשֶׁר... כֵּן, sem explicitar além do texto.
- source_word: בְּנוֹת צְלָפְחָד
  choice: as filhas de Zelofeade
  rationale: Reproduz com clareza a construção hebraica e usa a forma portuguesa tradicional e reconhecível do nome.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama; 'Yahweh' preserva o nome pessoal em transliteração, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura correlativa 'Assim como... assim...' conserva a ênfase e o paralelismo do hebraico, ainda que soe ligeiramente solene.
