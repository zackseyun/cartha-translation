source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: pt
  text: Se elas se casarem com algum dos filhos das tribos dos filhos de Israel, a herança delas será subtraída da herança de nossos pais e acrescentada à herança da tribo à qual elas passarem a pertencer; e será subtraída da porção de nossa herança que nos coube por sorteio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “do lote de nossa herança”; “lote” refere-se aqui à porção atribuída por sorteio.'
    reason: Preserva o sentido literal de גּוֹרָל e esclarece sua referência ao processo de distribuição da terra.
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: Se elas se casarem
  rationale: Embora a construção seja literalmente “e forem/tornarem-se esposas”, o contexto apresenta uma hipótese; em português, “se elas se casarem” exprime naturalmente tanto a condição quanto a ideia matrimonial.
- source_word: לְאֶחָד מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: com algum dos filhos das tribos dos filhos de Israel
  rationale: “Algum” traduz idiomaticamente o numeral indefinido אֶחָד, enquanto a formulação mantém a estrutura tribal e genealógica deliberadamente repetida do hebraico.
- source_word: וְנִגְרְעָה נַחֲלָתָן
  choice: a herança delas será subtraída
  rationale: O nifal de גרע indica que a propriedade deixará de integrar a herança tribal original; “será subtraída” preserva o sentido jurídico de perda ou redução.
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: da herança de nossos pais
  rationale: Mantém a referência masculina explícita aos antepassados tribais e a repetição temática de “herança”.
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: e acrescentada à herança da tribo
  rationale: A formulação conserva o contraste jurídico entre a retirada de uma herança e sua incorporação à de outra tribo.
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: à qual elas passarem a pertencer
  rationale: O feminino plural aponta para as mulheres e descreve sua nova vinculação tribal pelo casamento; “passarem a pertencer” explicita o valor resultante sem identificar além do que o contexto permite.
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: da porção de nossa herança que nos coube por sorteio
  rationale: גּוֹרָל significa literalmente “sorte” ou “lote” e, neste contexto, designa a porção territorial determinada por sorteio. A tradução comunica a prática de distribuição de terras com clareza.
