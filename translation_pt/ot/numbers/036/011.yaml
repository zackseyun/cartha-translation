base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: pt
  text: Maalá, Tirza, Hogla, Milca e Noa, filhas de Zelofeade, tornaram-se esposas dos filhos de seus tios[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “dos filhos dos irmãos de seu pai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: tornaram-se
  rationale: A forma narrativa de היה introduz o estado resultante do casamento; “tornaram-se” expressa naturalmente a transição sem acrescentar informação.
- source_word: בְּנוֹת
  choice: filhas
  rationale: Sentido genealógico direto, identificando as mulheres como filhas de Zelofeade.
- source_word: צְלָפְחָד
  choice: Zelofeade
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: No contexto da fórmula matrimonial, o conjunto לִבְנֵי ... לְנָשִׁים indica os homens de quem elas se tornaram esposas; esta construção é idiomática em português.
- source_word: דֹדֵיהֶן
  choice: seus tios
  rationale: דּוֹד designa aqui os tios paternos, conforme esclarecido pelo contexto do clã e pela nota; o texto principal mantém a formulação concisa.
- source_word: לְנָשִׁים
  choice: esposas
  rationale: Na fórmula matrimonial, o plural נָשִׁים com לְ significa “como esposas”; “tornaram-se esposas” comunica esse sentido com naturalidade.
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: Maalá, Tirza, Hogla, Milca e Noa
  rationale: Empregam-se formas portuguesas reconhecíveis dos nomes, preservando a ordem hebraica.
