  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: pt
  text: Assim, nenhuma herança dos filhos de Israel passará de uma tribo para outra, pois os filhos de Israel se apegarão, cada um, à herança da tribo de seus pais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: passará
  rationale: Neste contexto jurídico, סבב descreve a herança mudando de vinculação tribal; “passará” comunica essa transferência sem sugerir mero movimento físico.
- source_word: נַחֲלָה
  choice: herança
  rationale: É o termo jurídico tradicional e natural para a terra patrimonial recebida por alocação dentro de Israel.
- source_word: מַטֶּה ... אֶל מַטֶּה
  choice: de uma tribo para outra
  rationale: מַטֶּה significa claramente “tribo” neste contexto; a formulação explicita de modo natural que a herança não deve mudar de tribo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão genealógica e pactual masculina do hebraico, em linguagem bíblica corrente e compreensível em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão que fundamenta a proibição, com fluidez adequada ao discurso legal.
- source_word: אִישׁ
  choice: cada um
  rationale: Expressa o valor distributivo do substantivo singular sem produzir a rigidez de “um homem” neste contexto corporativo.
- source_word: יִדְבְּקוּ
  choice: permanecerá ligado a
  rationale: דבק denota apego firme e continuidade de vínculo; aqui se refere à manutenção da ligação com a herança tribal.
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: à herança da tribo de seus pais
  rationale: Mantém a estrutura genealógica do hebraico e identifica a terra como patrimônio da tribo paterna.
theological_decisions:
- issue: Linguagem genealógica masculina numa norma jurídica coletiva
  choice: os filhos de Israel ... cada um ... seus pais
  alternative: os israelitas ... cada pessoa ... seus antepassados
  rationale: O hebraico emprega termos masculinos e genealógicos (בני, איש, אבתיו). A tradução os preserva onde são semanticamente relevantes, mas verte אִישׁ distributivamente como “cada um” para conservar naturalidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A redação conserva a forma jurídica e genealógica do original sem arcaísmos desnecessários. Não se acrescentou nota, pois a alternativa lexical não representa ambiguidade substantiva necessária à publicação.
