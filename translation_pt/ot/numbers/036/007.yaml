  to: Assim, nenhuma herança dos filhos de Israel passará de uma tribo para outra, pois os filhos de Israel se apegarão, cada um, à herança da tribo de seus pais.
  rationale: A revisão substitui uma expressão de vínculo meramente estático por «se apegarão», que reproduz melhor a força de דבק, e restitui o plural do sujeito coletivo, conservando «cada um» para o caráter distributivo de איש. Não é necessária nota, pois não há variante ou ambiguidade textual relevante que exija esclarecimento.
