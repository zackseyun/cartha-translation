review_pass:
  verdict: revise
  source_fidelity: A redação transmite corretamente a proibição de uma herança mudar de tribo e a obrigação de conservar o vínculo com a herança tribal paterna. Contudo, «permanecerá ligado» enfraquece o valor de דבק («apegar-se/aderir firmemente») e emprega singular onde o verbo hebraico está no plural, ainda que a distribuição seja explicitada por איש.
  naturalness: O português do rascunho é claro e adequado, mas «os filhos de Israel se apegarão, cada um» reproduz com mais naturalidade a construção coletiva seguida de distribuição individual e mantém o tom jurídico solene.
  terminology: «Herança», «tribo» e «filhos de Israel» são escolhas apropriadas. «Se apegarão» representa melhor יִדְבְּקוּ do que «permanecerá ligado». «Pais» preserva adequadamente אבותיו no contexto genealógico.
  issues:
  - severity: medium
    issue: «Permanecerá ligado» para יִדְבְּקוּ
    rationale: O verbo דבק denota apego firme, adesão ou ligação estreita. «Permanecer ligado» expressa continuidade estática, mas atenua a imagem verbal de apegar-se/aferrar-se.
  - severity: low
    issue: Singular «permanecerá» após «cada um dos filhos de Israel»
    rationale: Embora possível como construção distributiva em português, o hebraico formula o sujeito coletivo «os filhos de Israel» com verbo plural e introduz «cada homem» como distributivo. A revisão preserva mais de perto essa relação.
  revised_text: Assim, nenhuma herança dos filhos de Israel passará de uma tribo para outra, pois os filhos de Israel se apegarão, cada um, à herança da tribo de seus pais.
  revised_footnotes: []
