  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: pt
  text: Nenhuma herança passará de uma tribo para outra,[a] pois cada uma das tribos dos filhos de Israel se apegará à sua própria herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as tribos de Israel». Hebraico: «as tribos dos filhos de Israel».'
    reason: Alternativa lexical
lexical_decisions:
- source_word: תִסֹּב
  choice: passará
  rationale: Neste contexto jurídico, סבב descreve a mudança da vinculação tribal de uma herança; “passará” comunica naturalmente essa transferência sem tornar explícito mais do que o hebraico.
- source_word: נַחֲלָה
  choice: herança
  rationale: O termo designa a propriedade territorial recebida por herança dentro da estrutura tribal de Israel; “herança” é corrente e preserva sua dimensão jurídica.
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: de uma tribo para outra
  rationale: Embora מַטֶּה também possa significar “bastão”, aqui denota claramente uma tribo; a formulação portuguesa expressa com naturalidade a passagem entre unidades tribais.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição precedente, em registro jurídico claro e digno.
- source_word: אִישׁ
  choice: cada uma
  rationale: O singular distributivo é aplicado às tribos mencionadas a seguir; “cada uma” preserva essa força e concorda naturalmente com “tribos”.
- source_word: בְּנַחֲלָתוֹ
  choice: à sua própria herança
  rationale: Com דבק, a preposição integra a ideia de ligação ou apego; “à sua própria herança” transmite a relação de cada tribo com seu território.
- source_word: יִדְבְּקוּ
  choice: permanecerá ligada
  rationale: דבק significa apegar-se ou manter-se unido. No contexto de preservação territorial, “permanecerá ligada” conserva a imagem e explicita adequadamente a continuidade pretendida.
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: as tribos dos filhos de Israel
  rationale: Preserva a forma explícita do hebraico בְּנֵי יִשְׂרָאֵל e mantém uma expressão bíblica compreensível em português.
theological_decisions:
- issue: Expressão pactual de gênero בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas / povo de Israel
  rationale: A tradução conserva a expressão masculina e genealógica do hebraico, que aqui designa corporativamente o povo de Israel, sem neutralizá-la nem restringi-la apenas aos homens.
translation_notes:
  register: Português moderno, digno e acessível, com cadência jurídica. A formulação preserva a proibição de transferência intertribal e a metáfora de ligação à herança, evitando a personificação masculina pouco natural de cada tribo.
