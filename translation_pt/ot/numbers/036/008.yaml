revisions:
- from: E toda filha que possuir uma herança entre as tribos dos filhos de Israel[a] deverá casar-se com alguém do clã da tribo de seu pai[b], para que cada um dos filhos de Israel conserve a herança de seus pais.[c]
  to: E toda filha que possuir uma herança[a] das tribos dos filhos de Israel deverá casar-se com um homem do clã da tribo de seu pai[b], para que os filhos de Israel possuam, cada um, a herança de seus pais.[c]
  rationale: A revisão torna explícita a procedência expressa por מִן (“das tribos”), representa o homem singular pressuposto pela fórmula matrimonial e aproxima a cláusula final do verbo ירשׁ como posse hereditária. Também corrige a redação e a posição da nota a, preservando as alternativas lexicais sem alterar o sentido da norma.
