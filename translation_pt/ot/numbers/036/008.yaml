  naturalness: O registro é moderno, claro e apropriadamente jurídico. “Um homem do clã” explicita de modo natural o referente masculino singular exigido pela expressão “ser por esposa”.
  terminology: “Herança”, “clã”, “tribo”, “filhos de Israel” e “pais” preservam bem as distinções sociais e a moldura patrilinear do hebraico. A nota a no rascunho contém uma formulação portuguesa inadequada (“que herdar uma herança”) e estava ancorada depois de “filhos de Israel”, embora diga respeito a “possuir uma herança”.
