  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: pt
  text: E toda filha que possuir uma herança[a] das tribos dos filhos de Israel deverá casar-se com um homem do clã da tribo de seu pai[b], para que os filhos de Israel possuam, cada um, a herança de seus pais.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que esteja herdando uma herança”; o particípio hebraico também pode destacar sua condição de herdeira.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “da família da tribo de seu pai”; o termo hebraico indica um grupo de parentesco, ou clã, dentro da tribo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para que os filhos de Israel herdem, cada um, a herança de seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: possuir uma herança
  rationale: O particípio de ירשׁ descreve aqui a condição jurídica da filha como detentora de terras herdadas. Em português, “possuir uma herança” comunica esse estado sem a redundância de “herdar uma herança”.
- source_word: נַחֲלָה
  choice: herança
  rationale: No contexto da posse da terra tribal, designa o patrimônio territorial transmitido dentro da linhagem.
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: entre as tribos dos filhos de Israel
  rationale: מַטֶּה indica a divisão tribal; “filhos de Israel” conserva a forma masculina e a expressão pactual do hebraico.
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: do clã da tribo de seu pai
  rationale: “Clã” distingue מִשְׁפָּחָה, o grupo de parentesco interno, da unidade maior, a tribo.
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: deverá casar-se
  rationale: É a expressão portuguesa natural para o idioma hebraico “será por esposa”, preservando a força normativa da lei.
- source_word: יִירְשׁוּ ... אִישׁ
  choice: cada um ... conserve
  rationale: 'Neste contexto, ירשׁ aponta para a manutenção da posse hereditária; “conserve” expressa o resultado pretendido pela norma, enquanto אִישׁ tem força distributiva: “cada um”.'
- source_word: נַחֲלַת אֲבֹתָיו
  choice: a herança de seus pais
  rationale: Mantém a referência patrilinear explícita do hebraico, em vez de ampliá-la para “antepassados”.
theological_decisions:
- issue: Linguagem jurídica e pactual marcada pelo gênero
  choice: Manter “filhos de Israel” e “seus pais” no texto principal.
  alternative: Usar “israelitas” e “antepassados”.
  rationale: As formas masculinas fazem parte da estrutura patrilinear da lei de herança descrita no versículo e não devem ser neutralizadas silenciosamente.
- issue: Sentido de ירשׁ na cláusula final
  choice: Traduzir pelo sentido contextual de conservar a posse hereditária.
  alternative: Traduzir literalmente como “herdar”.
  rationale: O propósito da regra não é que cada israelita receba novamente a terra, mas que a herança ancestral permaneça em sua unidade tribal; “conserve” torna clara essa dimensão durativa sem eliminar a alternativa lexical.
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídica clara. A sintaxe foi aliviada sem apagar a organização tribal e patrilinear do texto hebraico; todos os marcadores de nota aparecem no texto principal.
