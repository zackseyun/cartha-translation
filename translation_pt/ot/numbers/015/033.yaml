  text: וַ/יַּקְרִ֣יבוּ אֹת֔/וֹ הַ/מֹּצְאִ֥ים אֹת֖/וֹ מְקֹשֵׁ֣שׁ עֵצִ֑ים אֶל מֹשֶׁה֙ וְ/אֶֽל אַהֲרֹ֔ן וְ/אֶ֖ל כָּל הָ/עֵדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/033.yaml
  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: pt
  text: E aqueles que o encontraram apanhando lenha o levaram a Moisés, a Arão e a toda a congregação[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recolhendo gravetos”. O hebraico עֵצִים pode se referir à madeira em geral ou a pedaços de madeira, como gravetos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: o levaram
  rationale: O hifil de קרב indica fazer aproximar ou apresentar. Neste contexto, “o levaram a” expressa naturalmente o movimento e a apresentação do homem às autoridades e à congregação.
- source_word: הַמֹּצְאִים
  choice: aqueles que o encontraram
  rationale: O particípio com artigo tem função substantivada e designa as pessoas que encontraram o homem; esta formulação é clara e natural em português.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: apanhando lenha
  rationale: O particípio descreve a ação em curso quando o homem foi encontrado. “Apanhando” comunica a ideia de recolher, e “lenha” é uma expressão portuguesa natural para madeira recolhida como combustível, sem excluir pedaços ou gravetos.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: a Moisés, a Arão e a toda a congregação
  rationale: A preposição אֶל indica direção. Em português, a coordenação com “levaram” conserva com clareza os três destinatários, ainda que não repita a preposição diante de cada nome.
- source_word: עֵדָה
  choice: congregação
  rationale: No contexto do Pentateuco, o termo designa a coletividade reunida de Israel. “Congregação” preserva o sentido comunitário e formal.
