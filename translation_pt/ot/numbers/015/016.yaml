  text: תּוֹרָ֥ה אַחַ֛ת וּ/מִשְׁפָּ֥ט אֶחָ֖ד יִהְיֶ֣ה לָ/כֶ֑ם וְ/לַ/גֵּ֖ר הַ/גָּ֥ר אִתְּ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: pt
  text: Uma só lei e uma só norma haverá para vocês e para o estrangeiro que reside com vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estrangeiro residente”. O hebraico גֵּר designa uma pessoa não nativa que vivia no meio de Israel sob a ordem da comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: lei
  rationale: Neste contexto jurídico, designa uma determinação vinculante; “lei” é natural e mantém a distinção em relação a מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: norma
  rationale: Aqui indica uma regra ou padrão jurídico prescrito. “Norma” comunica o sentido legal sem sugerir apenas uma sentença judicial.
- source_word: אַחַת / אֶחָד
  choice: uma só / uma só
  rationale: A repetição do numeral ressalta a unidade e a igualdade do padrão, e foi preservada em português.
- source_word: יִהְיֶה
  choice: haverá
  rationale: O imperfeito tem força prescritiva no contexto legal; “haverá” soa digno e natural em português e não reduz a frase a mera previsão.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Refere-se a uma pessoa não nativa que vive no meio de Israel sob a ordem da comunidade. A expressão é mais clara hoje do que “forasteiro” e evita conotações inadequadas de “alienígena”.
- source_word: הַגָּר
  choice: residente
  rationale: O particípio descreve o estrangeiro como alguém que reside com Israel. A construção portuguesa evita a repetição pouco natural “estrangeiro que estrangeira”, embora não reproduza integralmente o eco lexical hebraico.
- source_word: אִתְּכֶם
  choice: entre vocês
  rationale: Embora a preposição tenha o sentido básico de “com vocês”, neste caso “entre vocês” expressa com naturalidade a residência no âmbito da comunidade.
theological_decisions:
- issue: Igualdade jurídica entre Israel e o estrangeiro residente nas disposições cultuais
  choice: A formulação declara uma única lei e uma única norma para ambos.
  alternative: A abrangência poderia ser entendida de modo mais restrito, limitada às normas sacrificiais do contexto imediato.
  rationale: A tradução conserva a formulação ampla do versículo sem decidir além do texto até onde ela se estende fora da seção legal imediata.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Uma só” preserva a ênfase repetida do hebraico; “norma” mantém o campo jurídico e distingue מִשְׁפָּט de תּוֹרָה.
