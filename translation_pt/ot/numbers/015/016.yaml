  source_fidelity: A tradução transmite corretamente a unidade da lei e da norma aplicáveis tanto aos destinatários israelitas quanto ao גֵּר. Contudo, o texto hebraico especifica o estrangeiro pelo particípio הַגָּר, literalmente alguém que reside/sojorna «com vocês». A formulação «estrangeiro residente entre vocês» é aceitável em sentido geral, mas desloca «com vocês» para «entre vocês» e torna menos explícita a construção participial.
  naturalness: «Uma só lei e uma só norma haverá» é claro, jurídico e natural em português moderno. «Estrangeiro que reside com vocês» é igualmente natural e torna explícito o elemento descritivo presente no hebraico.
  terminology: «Lei» para תּוֹרָה e «norma» para מִשְׁפָּט preservam adequadamente a distinção jurídica sem criar uma diferença técnica excessiva. «Estrangeiro» é uma opção contemporânea clara para גֵּר; a nota pode oferecer «estrangeiro residente» como alternativa concisa.
  issues:
