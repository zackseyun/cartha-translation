  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: pt
  text: Da primeira porção da massa de vocês[a], vocês apresentarão um pão como contribuição[b]; como se apresenta a contribuição da eira, assim vocês o apresentarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da primeira porção do que vocês amassarem”; o termo hebraico pode designar a própria massa ou, por extensão, a vasilha ou masseira em que ela é amassada.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “oferta alçada”. O termo hebraico designa uma contribuição separada e apresentada.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: da primeira porção
  rationale: Expressa o sentido partitivo de começo ou primeira parte, indicando que uma porção da massa deve ser apresentada.
- source_word: עֲרִסֹתֵיכֶם
  choice: da massa de vocês
  rationale: Neste contexto, o termo designa mais provavelmente a massa que está sendo preparada, embora também possa referir-se ao recipiente de amassar.
- source_word: חַלָּה
  choice: um pão
  rationale: Designa uma porção de pão formada ou assada; “pão” é claro e natural, sem a conotação moderna de sobremesa que “bolo” poderia sugerir.
- source_word: תָּרִימוּ
  choice: apresentem / apresentarão
  rationale: No contexto cultual, o hifil de רום indica erguer ou apresentar algo como oferta. “Apresentar” comunica a ação ritual de modo natural em português.
- source_word: תְרוּמָה
  choice: contribuição
  rationale: Refere-se a uma porção separada e apresentada para uso sagrado. “Contribuição” preserva essa ideia sem recorrer ao termo tradicional e pouco transparente “oferta alçada”.
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: assim como a contribuição da eira
  rationale: Mantém a comparação com a porção separada dos produtos processados na eira e corresponde de perto à construção hebraica.
- source_word: גֹּרֶן
  choice: eira
  rationale: É o termo português tradicional e preciso para o local onde os cereais eram debulhados e limpos.
- source_word: כֵּן
  choice: assim como ...
  rationale: A construção comparativa em português transmite naturalmente a relação marcada por כִּ...כֵּן no hebraico.
- source_word: אֹתָהּ
  choice: o
  rationale: Retoma “um pão” na formulação portuguesa. No hebraico, o pronome feminino pode retomar חַלָּה ou תְרוּמָה, ambos femininos; a referência prática permanece à porção apresentada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Massa de vocês” evita ambiguidade excessiva no corpo do texto, enquanto a nota preserva a alternativa lexical. “Apresentar” comunica o gesto cultual sem o caráter artificial de “levantar” em português atual.
