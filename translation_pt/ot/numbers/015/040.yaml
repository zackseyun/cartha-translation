source:
  edition: WLC
  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: pt
  text: para que vocês se lembrem de todos os meus mandamentos, os cumpram e sejam santos para o seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade da instrução anterior de modo natural e preserva a força final da expressão hebraica.
- source_word: תִּזְכְּרוּ
  choice: vocês se lembrem
  rationale: O imperfeito qal na oração de finalidade expressa o propósito de recordar; a forma com «vocês» é clara e amplamente compreensível.
- source_word: וַעֲשִׂיתֶם
  choice: os cumpram
  rationale: Neste contexto, עשה significa pôr os mandamentos em prática. «Cumpram» é idiomático em português e evita sugerir mera lembrança sem obediência.
- source_word: אֶת כָּל מִצְוֺתָי
  choice: todos os meus mandamentos
  rationale: Preserva כָּל, o sufixo de primeira pessoa e o sentido jurídico-covenantal de מִצְוֺת.
- source_word: וִהְיִיתֶם
  choice: e sejam
  rationale: Expressa naturalmente o estado resultante ou pretendido sem acrescentar a ideia mais forte de um processo contida em «tornem-se».
- source_word: קְדֹשִׁים
  choice: santos
  rationale: Mantém toda a amplitude de קדוש — ética, cultual e de pertencimento pactual — sem reduzi-la apenas a separação ou consagração.
- source_word: לֵאלֹהֵיכֶם
  choice: para o seu Deus
  rationale: A preposição ל marca aqui relação ou pertencimento orientado a Deus. «Para o seu Deus» é natural em português e preserva essa relação sem a explicar em excesso.
theological_decisions:
- issue: Sentido da linguagem de santidade no contexto da aliança
  choice: santos para o seu Deus
  alternative: separados para o seu Deus; consagrados ao seu Deus
  rationale: «Santos» conserva a tensão e a amplitude teológica do hebraico, abrangendo separação, consagração e conduta ética, sem reduzir o termo a uma só dimensão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A construção foi reorganizada levemente («de todos... os cumpram») para evitar em português a sequência menos fluida «lembrem e cumpram todos», sem alterar a relação coordenada entre recordar e praticar.
