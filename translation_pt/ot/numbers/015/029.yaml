  text: הָֽ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם לָ/עֹשֶׂ֖ה בִּ/שְׁגָגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/029.yaml
  text: For the native among the sons of Israel and for the sojourner who sojourns among them[a], there shall be one law for you[d][c][b], for the one who acts unintentionally.
translation:
  language: pt
  text: Para o israelita de nascimento[a] e para o estrangeiro residente[b] que vive no meio deles, haverá uma só lei[c] para vocês, para quem agir sem intenção[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o natural entre os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Estrangeiro residente” designa uma pessoa não israelita que vivia no meio da comunidade de Israel.
    reason: cultural_note
  - marker: c
    text: Ou “uma só instrução” ou “uma só norma”.
    reason: lexical_alternative
  - marker: d
    text: Ou “por engano”, “por inadvertência” ou “involuntariamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: o israelita de nascimento
  rationale: אֶזְרָח designa o membro nativo da comunidade, em contraste com o estrangeiro residente. A formulação explicita de modo natural em português sua pertença aos filhos de Israel sem perder o contraste jurídico.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: e para o estrangeiro residente que vive no meio deles
  rationale: גֵּר, neste contexto legal, é o estrangeiro que reside de modo estável dentro da comunidade israelita. A oração participial הַגָּר בְּתוֹכָם reforça essa residência e foi mantida.
- source_word: תּוֹרָה אַחַת
  choice: uma só lei
  rationale: No contexto, תּוֹרָה indica a norma ou instrução jurídica aplicável ao caso. “Uma só lei” comunica com clareza a unidade da regra para os dois grupos.
- source_word: יִהְיֶה לָכֶם
  choice: haverá ... para vocês
  rationale: A construção expressa uma norma válida para a comunidade destinatária. O futuro com “haverá” conserva a força prescritiva sem recorrer a linguagem jurídica arcaica.
- source_word: לָעֹשֶׂה
  choice: para quem agir
  rationale: O particípio substantivado identifica qualquer pessoa que pratique o ato em questão. “Quem agir” é conciso, natural e mantém o caráter geral da formulação.
- source_word: בִּשְׁגָגָה
  choice: sem intenção
  rationale: O termo descreve uma ação inadvertida, por engano ou sem propósito deliberado, especialmente em contexto legal e sacrificial. “Sem intenção” torna clara a distinção jurídica central.
theological_decisions:
- issue: Alcance da igualdade jurídica entre o israelita de nascimento e o estrangeiro residente nos casos de atos não intencionais
  choice: O versículo declara que a mesma norma se aplica aos dois grupos quando alguém age sem intenção.
  alternative: תּוֹרָה אַחַת também pode ser vertido como “uma só instrução” ou “uma só norma”.
  rationale: A tradução preserva a aplicação igual da regra prescrita no contexto imediato, sem ampliar a declaração para além deste caso legal específico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Vocês” representa o plural לָכֶם de maneira corrente; evitou-se juridiquês arcaico. A repetição semântica ligada ao estrangeiro residente foi preservada de modo idiomático.
