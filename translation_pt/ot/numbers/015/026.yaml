  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: pt
  text: E toda a comunidade dos filhos de Israel será perdoada[a], bem como o estrangeiro que reside no meio deles[b], porque todo o povo agiu sem intenção[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a assembleia dos israelitas”. Hebraico: “toda a comunidade dos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “estrangeiro” é o não israelita que residia entre o povo e vivia sob as leis e a proteção da comunidade.
    reason: cultural_note
  - marker: c
    text: 'A frase hebraica é concisa e não contém verbo expresso. Também pode ser entendida como: “pois todo o povo estava em erro” ou, mais literalmente, “pois, para todo o povo, foi por inadvertência”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: será perdoada
  rationale: 'O nifal de סלח tem aqui sentido passivo: o perdão é concedido à comunidade. A concordância feminina com “comunidade” produz uma formulação natural em português.'
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a comunidade dos filhos de Israel
  rationale: “Comunidade” traduz עֵדָה com clareza atual, preservando o sentido corporativo; “filhos de Israel” mantém de perto a expressão hebraica בְּנֵי יִשְׂרָאֵל.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: bem como o estrangeiro que reside no meio deles
  rationale: גֵּר designa um estrangeiro residente integrado à vida jurídica da comunidade. A formulação evita o sentido moderno de simples visitante e traduz naturalmente a repetição cognata גֵּר/גור, sem reproduzir em português uma redundância artificial.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão pela qual o perdão alcança a comunidade e o estrangeiro residente.
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: todo o povo agiu sem intenção
  rationale: A frase hebraica é elíptica e associa a totalidade do povo à inadvertência. A tradução explicita apenas o verbo necessário em português e preserva a distinção legal entre ato involuntário e deliberado.
theological_decisions:
- issue: Alcance comunitário do perdão
  choice: O perdão abrange toda a comunidade de Israel e também o estrangeiro residente entre eles.
  alternative: Entender a referência ao estrangeiro de modo mais geral, como qualquer forasteiro de passagem.
  rationale: גֵּר indica normalmente o estrangeiro residente sujeito às obrigações e amparado pelas proteções da comunidade, não um visitante ocasional.
- issue: Natureza involuntária da transgressão
  choice: A cláusula final afirma que todo o povo agiu sem intenção.
  alternative: 'Traduzir de modo mais literal e elíptico: “pois, para todo o povo, foi por inadvertência”, ou entender: “pois todo o povo estava em erro”.'
  rationale: O hebraico é compacto e não traz verbo expresso na cláusula final. A tradução corrente torna a relação inteligível, enquanto a nota preserva a ambiguidade formal sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Comunidade” evita um tom excessivamente eclesiástico, enquanto “filhos de Israel” preserva a forma tradicional e concreta do hebraico. A expressão “sem intenção” comunica com clareza a categoria jurídico-cultual da inadvertência.
