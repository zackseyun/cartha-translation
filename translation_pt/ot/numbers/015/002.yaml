base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: pt
  text: 'Fale aos filhos de Israel e diga-lhes: “Quando vocês entrarem na terra de suas moradas[a], que eu lhes dou,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na terra em que habitarão” ou “na terra de seus assentamentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Fale aos
  rationale: O imperativo piel introduz a instrução divina que Moisés deve comunicar; “fale aos” preserva o tom formal e direto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar e masculina explícita do hebraico, de uso consagrado e compreensível em português.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz a fórmula sequencial de ordem de modo natural e digno.
- source_word: כִּי תָבֹאוּ
  choice: Quando vocês entrarem
  rationale: כִּי introduz aqui uma circunstância futura esperada, e בוא com אֶל é expresso naturalmente por “entrar em” em português.
- source_word: אֶרֶץ מוֹשְׁבֹתֵיכֶם
  choice: na terra em que habitarão
  rationale: Expressa de modo claro o constructo hebraico incomum, sem restringi-lo indevidamente a assentamentos específicos.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: a qual eu lhes dou
  rationale: O presente português comunica a ação divina vigente e certa, preservando o valor participial sem impor uma forma progressiva pouco natural.
theological_decisions:
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha conserva a formulação filial do hebraico, embora no contexto a expressão designe a comunidade da aliança.
- issue: Aspecto da dádiva divina em נֹתֵן
  choice: eu lhes dou
  alternative: estou dando a vocês; darei a vocês
  rationale: O presente preserva a atualidade e a certeza da dádiva sem converter explicitamente o particípio em futuro nem recorrer a uma construção progressiva menos idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para explicitar o plural de תָבֹאוּ e “lhes” como objeto indireto conciso. A pontuação mantém o versículo como introdução à fala e à legislação que prossegue nos versículos seguintes.
