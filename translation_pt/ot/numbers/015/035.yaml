  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “O homem certamente deve ser morto[a]. Toda a comunidade deve apedrejá-lo com pedras[b], fora do acampamento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “morrendo será morto”, construção hebraica enfática que indica que ele deve, sem falta, ser morto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “apedreje-o com pedras”, expressão judicial enfática para a execução por apedrejamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama.
- source_word: מוֹת יוּמַת
  choice: certamente deve ser morto
  rationale: Reproduz a construção intensiva do infinitivo absoluto com verbo finito, mantendo também o sentido passivo da sentença.
- source_word: הָאִישׁ
  choice: esse homem
  rationale: Retoma de modo natural em português o homem identificado no contexto anterior.
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: deverá apedrejá-lo
  rationale: Comunica com clareza o mandato judicial de execução por apedrejamento; a formulação hebraica enfática é registrada em nota.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a comunidade reunida de Israel; “comunidade” é atual, clara e mantém o caráter coletivo.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Expressa de maneira natural e precisa o local determinado para a execução.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Força normativa e enfática da pena em מוֹת יוּמַת
  choice: certamente deve ser morto
  alternative: será morto; deve ser executado
  rationale: A tradução conserva tanto a ênfase da construção hebraica quanto sua forma passiva, sem reduzir a frase a mera previsão nem explicitar além do texto quem realizará a morte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa e a solenidade jurídica foram preservadas sem arcaísmos; as duas construções enfáticas do hebraico foram representadas no texto e esclarecidas em notas.
