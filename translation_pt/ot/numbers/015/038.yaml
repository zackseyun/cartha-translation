source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: pt
  text: Fale aos filhos de Israel e diga-lhes que façam para si borlas[a] nas pontas de suas roupas, por todas as suas gerações, e que ponham um cordão azul[b] na borla de cada ponta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «franjas» (hebraico צִיצִת).
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica תְּכֵלֶת refere-se a um corante ou a uma cor azul, possivelmente azul-arroxeada, usada nos materiais sagrados de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva de modo natural e transparente o termo hebraico masculino de parentesco, sem substituí-lo por um coletivo neutro.
- source_word: וְעָשׂוּ לָהֶם
  choice: que façam para si
  rationale: A construção comunica a ordem transmitida por Moisés e preserva לָהֶם, indicando que as borlas seriam feitas para uso dos próprios israelitas.
- source_word: צִיצִת
  choice: borlas
  rationale: Designa adequadamente os feixes de fios pendentes presos à roupa; «franjas» continua possível e é registrado em nota.
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: nas pontas de suas roupas
  rationale: כָּנָף significa literalmente «asa», mas aqui indica a extremidade ou ponta de uma peça de roupa.
- source_word: לְדֹרֹתָם
  choice: por todas as suas gerações
  rationale: Expressa a vigência da instrução ao longo das sucessivas gerações e permanece próxima da formulação hebraica.
- source_word: עַל צִיצִת הַכָּנָף
  choice: na borla de cada ponta
  rationale: 'Explicita em português o sentido distributivo do singular hebraico no contexto: a borla correspondente a cada ponta.'
- source_word: פְּתִיל
  choice: cordão
  rationale: O termo denota um fio torcido ou cordão; «cordão» comunica melhor um elemento visível preso à borla.
- source_word: תְּכֵלֶת
  choice: azul
  rationale: É a tradução mais clara e estabelecida para a cor do corante, enquanto a possível tonalidade azul-arroxeada é preservada em nota.
