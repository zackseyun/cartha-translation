  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: pt
  text: Para a comunidade, haverá um só estatuto para vocês e para o estrangeiro residente[a]. Será um estatuto permanente[b] ao longo de suas gerações. O estrangeiro residente será, diante de Yahweh, como vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forasteiro” ou “residente estrangeiro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estatuto perpétuo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: a comunidade
  rationale: קָהָל designa a comunidade reunida. “Comunidade” é atual e clara em português, sem a possível conotação eclesiástica mais estreita de “congregação”.
- source_word: חֻקָּה אַחַת
  choice: um só estatuto
  rationale: חֻקָּה indica uma norma prescrita com força legal; “um só” preserva a ênfase na mesma norma aplicável aos dois grupos.
- source_word: לָכֶם וְלַגֵּר
  choice: para vocês e para o estrangeiro residente
  rationale: גֵּר refere-se aqui a um não israelita que reside entre o povo, não meramente a um desconhecido ou visitante. “Estrangeiro residente” comunica esse status com precisão.
- source_word: הַגָּר
  choice: que vive entre vocês
  rationale: O particípio de גור retoma a ideia de residência contínua. Em português, “que vive entre vocês” expressa isso naturalmente, embora não reproduza a repetição da raiz hebraica.
- source_word: חֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: Na fórmula legal, עוֹלָם indica vigência duradoura através das gerações. “Permanente” preserva essa força sem impor uma noção filosófica de eternidade.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão assinala aplicabilidade contínua ao longo das gerações sucessivas.
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: o estrangeiro residente será como vocês
  rationale: A construção comparativa afirma paridade entre os destinatários israelitas e o estrangeiro residente no âmbito desta norma.
- source_word: לִפְנֵי יְהוָה
  choice: Diante de Yahweh
  rationale: לִפְנֵי significa “diante de/na presença de”. “Diante de Yahweh” é idiomático e mantém o contexto de responsabilidade cultual perante Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Status do estrangeiro residente na legislação de culto de Israel
  choice: O versículo declara que a mesma norma se aplica à comunidade israelita e ao estrangeiro residente neste assunto.
  alternative: A afirmação pode ser entendida estritamente em relação às normas sacrificiais do contexto imediato, não como uma declaração irrestrita sobre todo aspecto da vida de Israel.
  rationale: A tradução mantém a paridade explícita “diante de Yahweh”, mas não amplia seu alcance para além do que o contexto legal permite estabelecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura “Quanto à comunidade” representa o tópico destacado no hebraico. Os marcadores foram posicionados junto aos termos a que as notas efetivamente se referem.
