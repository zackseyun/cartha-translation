review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a norma única, sua vigência duradoura e a paridade do estrangeiro residente perante Yahweh. Contudo, “que vive entre vocês” introduz “entre vocês”, elemento que não está expresso no hebraico deste versículo; além disso, a repetição do particípio hebraico pode ser representada sem essa ampliação.
  naturalness: O registro é moderno, claro e apropriado. “Para a comunidade” é mais direto do que “Quanto à comunidade”, e “ao longo de suas gerações” soa mais natural neste enunciado jurídico do que “por todas as suas gerações”.
  terminology: “Estatuto”, “estrangeiro residente” e “Yahweh” são escolhas adequadas. A nota “imigrante residente” é menos indicada, pois “imigrante” introduz uma categoria administrativa moderna que não corresponde necessariamente ao termo hebraico גֵּר.
  issues:
  - severity: low
    issue: Ampliação em “que vive entre vocês”
    rationale: O hebraico diz literalmente “o estrangeiro que reside/está residindo”, sem o complemento “entre vocês” neste versículo. O contexto pressupõe residência no meio de Israel, mas a tradução deve evitar acrescentar essa localização aqui.
  - severity: low
    issue: Alternativa de nota excessivamente moderna
    rationale: “Imigrante residente” pode sugerir uma classificação migratória contemporânea. “Residente estrangeiro” preserva melhor a dimensão não nativa e residente de גֵּר.
  revised_text: Para a comunidade, haverá um só estatuto para vocês e para o estrangeiro residente[a]. Será um estatuto permanente[b] ao longo de suas gerações. O estrangeiro residente será, diante de Yahweh, como vocês.
  revised_footnotes:
