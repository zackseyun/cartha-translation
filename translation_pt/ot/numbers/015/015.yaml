revisions:
- from: Quanto à comunidade, haverá um só estatuto para vocês e para o estrangeiro residente[a] que vive entre vocês. Será um estatuto permanente[b] por todas as suas gerações. Diante de Yahweh, o estrangeiro residente será como vocês.
  to: Para a comunidade, haverá um só estatuto para vocês e para o estrangeiro residente[a]. Será um estatuto permanente[b] ao longo de suas gerações. O estrangeiro residente será, diante de Yahweh, como vocês.
  rationale: A revisão elimina o complemento não expresso “entre vocês”, conserva a equivalência jurídica marcada pela construção comparativa hebraica e melhora levemente a formulação portuguesa. As notas continuam ancoradas nos termos correspondentes e evitam uma alternativa administrativa anacrônica.
