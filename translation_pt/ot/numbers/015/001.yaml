base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר com waw consecutivo faz a narrativa avançar e integra a fórmula habitual de comunicação divina. “Falou” é natural em português e preserva melhor essa fórmula do que “disse” neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica aqui o destinatário da fala; “a Moisés” é uma construção portuguesa clara e corrente.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala que vem a seguir. Em português atual, os dois-pontos expressam essa função de modo mais natural e evitam a fórmula redundante “falou... dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal e a opção transliterativa da edição de consulta, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A fórmula hebraica de introdução do discurso foi vertida idiomaticamente com dois-pontos.
