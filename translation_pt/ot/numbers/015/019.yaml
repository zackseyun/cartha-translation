  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: pt
  text: Quando vocês comerem do pão da terra, apresentarão uma contribuição a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levantarão uma contribuição”. O hebraico usa aqui linguagem ritual para algo separado e apresentado a Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: Quando vocês comerem
  rationale: A construção com וְהָיָה e o infinitivo temporal introduz uma circunstância futura. Em português, “Quando vocês comerem” comunica isso de modo natural e mantém o vínculo com a instrução anterior.
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: do pão da terra
  rationale: Preserva tanto o valor de origem ou partitivo de מִן quanto a expressão concreta “pão da terra”, que no contexto se refere ao alimento produzido na terra em que Israel entraria.
- source_word: תָּרִימוּ תְרוּמָה
  choice: apresentarão uma contribuição
  rationale: A combinação pertence à linguagem ritual de separar e apresentar algo a Deus. “Apresentarão uma contribuição” é clara e digna em português, sem recorrer ao pouco natural “levantarão uma contribuição” no texto principal.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário ou a dedicação da contribuição, e o nome divino יהוה é transliterado como “Yahweh”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome da aliança. “Yahweh” o representa como nome próprio, sem substituí-lo por um título.
- issue: Caráter ritual da expressão תָּרִימוּ תְרוּמָה
  choice: apresentarão uma contribuição
  alternative: levantarão uma contribuição; apresentarão uma oferta
  rationale: A formulação escolhida conserva a ideia de uma porção separada e entregue a Deus, sem impor uma interpretação denominacional nem apagar a imagem literal, que é indicada em nota.
translation_notes:
  register: Português atual, claro e digno, com “vocês” para a segunda pessoa do plural. A sintaxe é natural, enquanto a nota preserva a imagem concreta da expressão cultual hebraica.
