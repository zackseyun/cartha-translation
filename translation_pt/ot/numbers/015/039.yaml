base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: pt
  text: Isso será para vocês uma borla[a]. Quando a virem, vocês se lembrarão de todos os mandamentos de Yahweh e os cumprirão. Não andarão atrás do coração de vocês nem dos seus olhos[b], atrás dos quais vocês se prostituem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “franja”. O termo hebraico se refere à franja em forma de borla presa às extremidades da roupa.
    reason: lexical_alternative
  - marker: b
    text: Ou “não seguirão o coração de vocês nem os seus olhos”. O verbo hebraico sugere buscar, explorar ou correr atrás deles.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega uma imagem de prostituição ou infidelidade sexual como metáfora da infidelidade à aliança. Uma tradução menos literal seria: “pelos quais vocês se desviam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיצִת
  choice: borla
  rationale: Designa a franja em forma de borla presa às extremidades da roupa. “Borla” identifica bem o objeto específico, enquanto a nota preserva a alternativa mais ampla “franja”.
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: Isso servirá de borla para vocês
  rationale: Expressa naturalmente em português a construção predicativa hebraica e retoma o referente singular do versículo anterior sem especificá-lo além do texto.
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: Quando a virem
  rationale: 'Transmite o valor temporal e sequencial da oração: ver a borla deve levar o povo a recordar os mandamentos.'
- source_word: מִצְוֺת
  choice: mandamentos
  rationale: Mantém o sentido jurídico e pactual do termo hebraico em linguagem corrente e digna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: e os cumprirão
  rationale: Em relação a mandamentos, “cumprir” comunica de modo natural o sentido de fazê-los ou colocá-los em prática.
- source_word: תָתֻרוּ
  choice: andarão atrás
  rationale: Preserva a ideia de percorrer, buscar ou seguir algo, com uma expressão portuguesa natural, sem reduzir o verbo simplesmente a “desviar-se”.
- source_word: לְבַבְכֶם
  choice: o coração de vocês
  rationale: “Coração” conserva a linguagem antropológica hebraica, que abrange desejos, intenções e decisões interiores.
- source_word: עֵינֵיכֶם
  choice: os seus olhos
  rationale: Mantém a imagem concreta do hebraico sem explicitar no corpo do texto aquilo que os olhos desejam.
- source_word: זֹנִים
  choice: vocês se prostituem
  rationale: Retém a metáfora forte de infidelidade sexual empregada para a deslealdade à aliança, evitando suavizá-la como mero desvio.
- source_word: אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: atrás dos quais vocês se prostituem
  rationale: Conserva a ligação da oração relativa com o coração e os olhos, bem como a repetição da ideia de ir atrás deles, apesar da formulação deliberadamente forte.
theological_decisions:
- issue: Forma portuguesa do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Intensidade da metáfora de זנה
  choice: manter a imagem explícita com “vocês se prostituem”
  alternative: “vocês se desviam” ou “vocês são infiéis”
  rationale: A imagem sexual é parte da força teológica do texto sobre infidelidade à aliança. A tradução a mantém sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A redação mantém tom bíblico digno, mas evita inversões e arcaísmos. A metáfora final permanece deliberadamente forte, como no hebraico.
