  source_fidelity: 'O texto traduz com fidelidade os elementos centrais do hebraico: o sacerdote como agente, a expiação em favor da pessoa, a referência a Yahweh, o caráter não intencional do pecado, a repetição deliberada da ideia e o resultado passivo do perdão. “Pela pessoa” comunica adequadamente נֶפֶשׁ neste contexto, sem sugerir uma antropologia específica.'
