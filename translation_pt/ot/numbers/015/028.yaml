  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: pt
  text: E o sacerdote fará expiação diante de Yahweh pela pessoa que pecar sem intenção, quando pecar sem intenção, para fazer expiação por ela; e ela será perdoada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: O piel de כפר, em contexto sacerdotal, indica efetuar expiação. A expressão preserva o sentido ritual sem impor uma teoria específica da expiação.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente direto e natural para o agente cultual que realiza o rito.
- source_word: עַל הַנֶּפֶשׁ
  choice: pela pessoa
  rationale: נֶפֶשׁ designa aqui a pessoa individual, não especificamente uma alma imaterial; a preposição עַל, com כפר, é expressa naturalmente por “por/pela”.
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: que pecar sem intenção, quando pecar sem intenção
  rationale: A formulação mantém a repetição enfática ligada à ideia de erro involuntário presente no hebraico, embora resulte em alguma redundância deliberada.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de/na presença de”; o tetragrama é transliterado como Yahweh, preservando o nome divino no texto-fonte.
- source_word: לְכַפֵּר עָלָיו
  choice: para fazer expiação por ela
  rationale: O infinitivo expressa propósito ou resultado e repete a linguagem de כפר do início do versículo; o pronome é vertido de modo concordante com “pessoa” em português.
- source_word: וְנִסְלַח לוֹ
  choice: e ela será perdoada
  rationale: A forma passiva de סלח apresenta o perdão como resultado concedido; a concordância feminina retoma naturalmente “a pessoa” sem restringir o referente por sexo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido de expiação em כפר
  choice: fazer expiação
  alternative: expiar; obter perdão
  rationale: A escolha conserva a linguagem cultual e a relação entre o rito sacerdotal e o perdão, sem definir além do texto o mecanismo teológico da expiação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição “pecar sem intenção... pecar sem intenção” foi preservada por corresponder à repetição do hebraico. O futuro “fará/será” expressa a prescrição legal. Não há marcadores de nota no texto porque nenhuma nota de rodapé foi necessária.
