base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: pt
  text: Enquanto os filhos de Israel estavam no deserto, encontraram um homem recolhendo lenha[a] no dia de sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ajuntando gravetos”.'
    reason: Alternativa lexical para מְקֹשֵׁשׁ עֵצִים, que pode indicar a coleta de pequenos pedaços de madeira.
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: estavam
  rationale: A forma narrativa de היה estabelece a circunstância da cena; “estavam” expressa isso naturalmente em português, sem sugerir mudança de estado.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica tradicional e transparente, sem substituí-la pelo coletivo mais idiomático “os israelitas”.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa a região erma da peregrinação de Israel; “deserto” é a forma corrente e compreensível em português, sem exigir que se trate de um cenário exclusivamente arenoso.
- source_word: וַיִּמְצְאוּ
  choice: encontraram
  rationale: Equivalente direto e natural de מצא neste contexto narrativo.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo identifica explicitamente um indivíduo masculino, por isso “um homem” é mais preciso do que “alguém”.
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: recolhendo lenha
  rationale: A combinação do particípio de קשש com עֵצִים descreve a coleta de pedaços de madeira. “Recolhendo lenha” é idiomático e mantém a finalidade coletiva do ato; “ajuntando gravetos” permanece como alternativa lexical em nota.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: no dia de sábado
  rationale: Mantém o substantivo יוֹם (“dia”) e traduz שַׁבָּת pela designação portuguesa corrente, sem acrescentar explicação teológica.
theological_decisions:
- issue: Designação do povo da aliança em בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A opção conserva a forma da expressão hebraica e evita transformar silenciosamente a designação patronímica em outro tipo de rótulo coletivo.
- issue: Terminologia do sábado
  choice: no dia de sábado
  alternative: no sábado
  rationale: A tradução preserva a referência temporal explícita, incluindo “dia”, e não introduz interpretação sobre a natureza ou a aplicação da lei sabática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Enquanto” introduz naturalmente a circunstância de fundo; “recolhendo lenha” evita uma construção excessivamente literal. O marcador foi colocado junto à expressão a que a alternativa lexical se refere.
