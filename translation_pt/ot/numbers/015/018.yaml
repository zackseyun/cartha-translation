  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בְּ/בֹֽאֲ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֛י מֵבִ֥יא אֶתְ/כֶ֖ם שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/018.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: pt
  text: 'Fale aos filhos de Israel e diga-lhes: Quando vocês entrarem na terra para a qual eu os estou levando,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos descendentes de Israel” ou “aos israelitas”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel de דבר introduz uma instrução divina que Moisés deve comunicar; “Fale” mantém a forma direta e solene.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a expressão familiar literal do hebraico e sua formulação pactual, sem reduzi-la simplesmente a “israelitas”.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz a fórmula sequencial comum após “fale”, em português natural e digno.
- source_word: בְּבֹאֲכֶם
  choice: Quando vocês entrarem
  rationale: O infinitivo construto com ב tem valor temporal. “Entrarem” expressa naturalmente a chegada ao interior da terra, implícita na construção com אֶל.
- source_word: אֶל הָאָרֶץ
  choice: na terra
  rationale: Com o verbo “entrar”, a preposição portuguesa “em” expressa de modo idiomático o movimento para dentro da terra.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: para a qual eu os estou levando
  rationale: Mantém o aspecto progressivo e futuro do particípio מֵבִיא e integra o advérbio resumptivo שָׁמָּה à oração relativa sem redundância artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento plural “vocês” torna explícito o referente coletivo das formas hebraicas plurais; “diga-lhes” conserva um tom digno e conciso.
