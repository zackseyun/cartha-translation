source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: pt
  text: Se isso tiver sido feito sem intenção e tiver passado despercebido à comunidade, toda a comunidade oferecerá um novilho do rebanho como oferta queimada, de aroma agradável a Yahweh, com a sua oferta de cereal e a sua oferta de bebida, conforme prescrito, e um bode como oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como oferta de purificação”. O hebraico חַטָּאת pode designar a oferta relacionada ao pecado e ao seu efeito ritual de purificação.
    reason: alternativa lexical
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: tiver passado despercebido à comunidade
  rationale: A expressão significa literalmente “dos olhos da comunidade”, mas funciona como idioma para algo que não foi percebido. A formulação escolhida comunica esse sentido em português natural.
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: tiver sido feito sem intenção
  rationale: שְׁגָגָה indica inadvertência ou erro não deliberado, em contraste com a transgressão intencional no contexto próximo.
- source_word: כָל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a comunidade de Israel. “Comunidade” é corrente, abrangente e preserva o valor coletivo do termo.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: um novilho do rebanho
  rationale: A expressão especifica um bovino macho destinado ao sacrifício. “Novilho do rebanho” é conciso e idiomático em português.
- source_word: לְעֹלָה
  choice: como oferta queimada
  rationale: עֹלָה designa a oferta inteiramente queimada. A expressão explicita o caráter do sacrifício em linguagem moderna e evita depender do sentido técnico de “holocausto”.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Mantém a metáfora cultual hebraica de uma oferta aceita e agradável a Deus sem explicá-la além do texto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama e preserva sua função de nome próprio.
- source_word: וּמִנְחָתוֹ וְנִסְכּוֹ
  choice: acompanhado da oferta de cereal e da oferta de bebida
  rationale: Neste contexto, מִנְחָה é a oferta de cereal e נֶסֶךְ é a oferta líquida associada. “Acompanhado” torna clara a relação ritual dos complementos com o novilho.
- source_word: כַּמִּשְׁפָּט
  choice: conforme prescrito
  rationale: מִשְׁפָּט se refere aqui à norma ou ao procedimento ritual estabelecido. “Conforme prescrito” transmite essa força legal de modo natural.
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: e um bode
  rationale: שְׂעִיר עִזִּים indica especificamente um caprino macho; “bode” preserva essa especificidade sem redundância.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: חַטָּאת é o termo sacrificial tradicionalmente associado ao pecado. A tradução mantém essa relação, enquanto a possível ênfase purificadora é registrada em nota.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial sacerdotal
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode destacar tanto a relação da oferta com o pecado quanto seu efeito ritual de purificação. O texto principal conserva a terminologia mais reconhecível, e a nota registra a alternativa sem eliminar a tensão lexical.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. Emprega “oferta queimada”, “oferta de cereal” e “oferta de bebida” para tornar a terminologia ritual transparente sem diluir sua precisão.
