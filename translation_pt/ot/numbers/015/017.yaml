base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com דבר introduz um novo ato narrativo de fala. “Falou” é a forma natural e digna da fórmula recorrente de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição assinala o destinatário da fala; “a” é idiomático na construção portuguesa “falar a alguém”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala, que começa no versículo seguinte. Em português atual, os dois-pontos reproduzem naturalmente essa função sem a fórmula menos idiomática “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pontuação substitui de modo idiomático a fórmula hebraica לֵאמֹר e indica que o conteúdo da fala vem a seguir.
