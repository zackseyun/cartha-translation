  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִ֑ים אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: pt
  text: Eu sou Yahweh, o Deus de vocês, que os tirei da terra do Egito para ser o Deus de vocês. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Embora אֱלֹהִים tenha forma plural, aqui designa o único Deus de Israel; a construção com o sufixo plural indica a relação de Deus com toda a comunidade.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: os tirei
  rationale: O hifil de יצא tem sentido causativo, 'fazer sair, tirar'; esta formulação é clara e natural em português e preserva a fórmula do êxodo.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém explicitamente אֶרֶץ, preservando a cadência e o conteúdo da fórmula hebraica.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: para ser o Deus de vocês
  rationale: Expressa de modo natural em português a finalidade e a relação pactual da construção hebraica, literalmente 'para ser para vocês por Deus'.
- source_word: אֲנִי
  choice: Eu sou
  rationale: A oração nominal hebraica requer a cópula em português; a repetição mantém a ênfase do original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Fórmula pactual לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: para ser o Deus de vocês
  alternative: para ser Deus para vocês
  rationale: A opção escolhida comunica em português corrente a relação pactual expressa no hebraico, sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se 'vocês' para o plural כֶם e a colocação pronominal natural 'os tirei'. A repetição final e a referência explícita à 'terra do Egito' preservam a solenidade e a estrutura do hebraico.
