base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: pt
  text: E você apresentará um terço de him[b] de vinho como oferta derramada[a], como aroma agradável[c] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como libação”; o termo hebraico se refere a uma oferta líquida vertida junto ao sacrifício.
    reason: lexical_alternative
  - marker: b
    text: O him era uma antiga unidade de medida para líquidos.
    reason: cultural_note
  - marker: c
    text: Ou “aroma suave” ou “aroma apaziguador”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַיִן
  choice: E ... de vinho
  rationale: יַיִן é o termo comum para “vinho”; a conjunção וְ liga esta instrução às ofertas descritas anteriormente. A ordem foi ajustada para soar natural em português.
- source_word: לַנֶּסֶךְ
  choice: como oferta derramada
  rationale: נֶסֶךְ designa uma oferta líquida vertida junto ao sacrifício. “Oferta derramada” comunica o ato ritual com mais clareza ao leitor comum do que o termo técnico “libação”.
- source_word: שְׁלִשִׁית הַהִין
  choice: um terço de him
  rationale: A expressão indica a quantidade. Mantém-se “him” como unidade antiga, sem convertê-la para uma medida moderna incerta.
- source_word: תַּקְרִיב
  choice: você apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer. “Apresentará” preserva a forma verbal e evita repetir “oferta”.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma agradável
  rationale: A expressão sacrificial fixa comunica aceitação e agrado. A formulação concisa preserva a imagem olfativa e a relação apositiva do hebraico.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: O nome divino יהוה é transliterado como “Yahweh”, preservando o nome pessoal presente no texto hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A transliteração “Yahweh” mantém explicitamente o nome da aliança usado no hebraico, sem substituí-lo por um título.
- issue: Sentido de רֵיחַ נִיחֹחַ na linguagem sacrificial
  choice: aroma agradável
  alternative: aroma apaziguador; aroma suave
  rationale: “Aroma agradável” preserva a metáfora e a ideia de aceitação sem explicar além do que o texto afirma nem sugerir necessariamente apaziguamento.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível no Brasil e compreensível internacionalmente. Conserva-se a unidade antiga “him” e a imagem sacrificial do aroma; a ordem dos constituintes foi ajustada à sintaxe natural do português.
