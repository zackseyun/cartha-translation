  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: pt
  text: E você preparará um quarto de him de vinho para a oferta de bebida, junto com o holocausto ou para o sacrifício, para cada cordeiro.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “sobre o holocausto”. A preposição hebraica pode ser traduzida assim, mas neste contexto provavelmente indica acompanhamento no rito sacrificial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para o único cordeiro” ou “para um cordeiro”; “para cada cordeiro” explicita o sentido distributivo da instrução.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: E ... de vinho
  rationale: A conjunção liga a instrução ao versículo anterior, e יַיִן é o termo comum para vinho; a ordem foi ajustada à sintaxe natural do português.
- source_word: לַ/נֶּסֶךְ
  choice: para a oferta derramada
  rationale: No contexto sacrificial, נֶסֶךְ designa a oferta líquida vertida. A expressão é clara em português e conserva a natureza ritual do ato.
- source_word: רְבִיעִית הַ/הִין
  choice: um quarto de him
  rationale: Preserva exatamente a proporção e mantém a antiga unidade de medida sem uma conversão moderna incerta.
- source_word: תַּעֲשֶׂה
  choice: você preparará
  rationale: Embora עשה signifique de modo geral fazer, no contexto de instruções sacrificiais 'preparar' expressa naturalmente a ação requerida sem acrescentar o verbo 'oferecer' ao texto.
- source_word: עַל הָ/עֹלָה
  choice: junto com o holocausto
  rationale: עַל pode significar literalmente 'sobre', mas aqui provavelmente indica associação ou acompanhamento no rito; 'junto com' comunica essa relação em português corrente.
- source_word: א֣וֹ לַ/זָּבַח
  choice: ou para o sacrifício
  rationale: זֶבַח é um termo sacrificial geral, distinto de עֹלָה; 'sacrifício' mantém essa distinção sem impor uma categoria mais específica.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: por cada cordeiro
  rationale: A forma literal é 'para o cordeiro, o único/um'; no contexto normativo, a expressão tem força distributiva e estabelece a quantidade correspondente a cada animal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se a unidade antiga “him” e o termo sacrificial tradicional “holocausto”; “oferta derramada” evita o registro menos acessível de “libação”.
