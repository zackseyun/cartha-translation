  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: pt
  text: E você apresentará vinho para a oferta de bebida, meio him, como oferta feita pelo fogo, de aroma agradável a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta pelo fogo”; também se propõe “oferta de alimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן תַּקְרִיב
  choice: E você apresentará ... vinho
  rationale: O substantivo יַיִן significa diretamente “vinho”, e o hifil de קרב indica fazê-lo chegar ou apresentá-lo em contexto sacrificial.
- source_word: לַ/נֶּסֶךְ
  choice: como oferta de bebida
  rationale: נֶסֶךְ designa uma oferta líquida derramada. “Oferta de bebida” é clara e acessível; “libação” seria correta, mas menos comum.
- source_word: חֲצִי הַ/הִין
  choice: meio him
  rationale: Conserva a antiga unidade de medida sem introduzir uma conversão moderna imprecisa.
- source_word: אִשֵּׁה
  choice: oferta queimada
  rationale: O termo sacerdotal está associado a uma oferta feita no fogo. A expressão concisa mantém essa referência sem pressupor que toda a oferta líquida fosse diretamente queimada; a construção hebraica permanece sintaticamente tensa.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Expressa de modo natural a fórmula sacrificial que indica a aceitação da oferta por Deus.
- source_word: לַ/יהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino expresso pelo tetragrama e a direção da apresentação indicada pela preposição.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração comunica explicitamente o nome próprio presente no texto hebraico, sem substituí-lo por um título.
- issue: Sentido de אִשֵּׁה
  choice: oferta queimada
  alternative: oferta feita pelo fogo; oferta de alimento
  rationale: A escolha preserva a associação tradicional e lexical com o fogo. A nota registra alternativas porque o termo sacerdotal pode destacar a oferta consumida no altar ou sua função como alimento ofertado a Deus, e sua relação com a libação neste versículo é compacta e ambígua.
translation_notes:
  register: Português moderno, claro e digno, com ordem levemente ajustada para evitar que “meio him” pareça medir outra coisa que não o vinho. Mantém “him” como unidade antiga e “Yahweh” como nome próprio. O marcador [a] aparece no texto principal.
