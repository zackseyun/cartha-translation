source:
  edition: WLC
  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: pt
  text: 'Ou, para um carneiro, prepare uma oferta de cereal: dois décimos[a] de farinha fina, misturada com um terço de um him de óleo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente “dois décimos”; a unidade, a efa, fica subentendida no sistema de medidas dos sacrifícios. Compare a expressão completa em outras passagens: “dois décimos de uma efa”.'
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Ou
  rationale: Mantém a partícula disjuntiva que liga esta instrução às alternativas sacrificiais anteriores, sem acrescentar uma condição que não está explícita.
- source_word: לָ/אַ֨יִל֙
  choice: para um carneiro
  rationale: אַיִל designa um carneiro, e o prefixo ל indica aqui relação ou destinação; o indefinido soa natural numa instrução geral.
- source_word: תַּעֲשֶׂ֣ה
  choice: prepare
  rationale: Embora עשה seja amplo ('fazer'), neste contexto ritual 'preparar' expressa com naturalidade a ação prescrita.
- source_word: מִנְחָ֔ה
  choice: oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה é a oferta feita de produto cerealífero, não uma oferta genérica.
- source_word: סֹ֖לֶת
  choice: farinha fina
  rationale: סֹלֶת indica farinha fina ou refinada, o material especificado para a oferta.
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: dois décimos de uma efa
  rationale: O hebraico diz literalmente 'dois décimos', deixando a unidade subentendida pelo sistema sacrificial. Explicitar 'de uma efa' torna a medida compreensível em português sem alterar seu valor.
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: misturada com ... azeite
  rationale: O particípio passivo descreve a farinha misturada com óleo. 'Azeite' é a forma natural de indicar o óleo de oliva neste contexto bíblico.
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: um terço de um him
  rationale: Preserva exatamente a fração e mantém a antiga unidade de capacidade, sem conversão especulativa.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe de instrução ritual. Emprega 'oferta de cereal', 'farinha fina', 'azeite', 'efa' e 'him' como termos bíblicos amplamente reconhecíveis. A unidade subentendida foi explicitada no texto para evitar a expressão obscura 'dois décimos', e a nota registra a forma literal do hebraico.
