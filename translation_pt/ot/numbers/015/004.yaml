  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: pt
  text: Então aquele que apresentar sua oferta a Yahweh apresentará como oferta de cereal um décimo de efa[a] de farinha fina, misturada com um quarto de him de azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um décimo”; neste contexto sacrificial, isso designa um décimo de efa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: então ... apresentará
  rationale: O waw com o verbo perfeito dá continuidade à sequência legal do versículo anterior; “então” expressa naturalmente essa progressão, e “apresentará” comunica o sentido sacrificial do hifil de קרב.
- source_word: הַמַּקְרִיב
  choice: aquele que apresentar
  rationale: O particípio hifil identifica a pessoa que apresenta a oferta; esta formulação é clara, atual e evita um termo excessivamente técnico.
- source_word: קָרְבָּנוֹ
  choice: sua oferta
  rationale: קָרְבָּן é o termo geral para algo apresentado a Deus como oferta.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém a preposição ל e representa diretamente o nome divino יהוה como Yahweh.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Na legislação sacrificial, מִנְחָה designa normalmente uma oferta preparada com produtos de cereal, embora em outros contextos possa significar presente ou tributo.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: סֹלֶת indica farinha de boa qualidade e finamente moída, própria para as ofertas.
- source_word: עִשָּׂרוֹן
  choice: um décimo de efa
  rationale: A palavra significa literalmente “um décimo”; neste contexto cultual, trata-se convencionalmente de um décimo de efa. A unidade implícita é explicitada no texto para tornar a medida compreensível.
- source_word: בָּלוּל
  choice: misturada
  rationale: O particípio passivo descreve a farinha combinada com o azeite; a concordância feminina segue “farinha” em português.
- source_word: בִּרְבִעִית הַהִין
  choice: com um quarto de him
  rationale: Traduz diretamente a quantidade e conserva a unidade de medida antiga. “Him” é a forma tradicional em português para o hebraico הִין.
- source_word: שָׁמֶן
  choice: azeite
  rationale: No contexto sacrificial israelita, שֶׁמֶן se refere normalmente ao azeite; esta é a designação natural em português, sem acrescentar no corpo do texto a especificação “de oliva”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação terminológica fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com estrutura jurídica prospectiva. “Oferta de cereal” é compreensível internacionalmente; “efa” e “him” preservam as medidas da cultura-fonte. O marcador [a] aparece imediatamente após o sintagma explicado.
