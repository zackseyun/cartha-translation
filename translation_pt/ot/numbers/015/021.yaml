  text: מֵ/רֵאשִׁית֙ עֲרִסֹ֣תֵי/כֶ֔ם תִּתְּנ֥וּ לַ/יהוָ֖ה תְּרוּמָ֑ה לְ/דֹרֹ֖תֵי/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: pt
  text: Da primeira porção da massa de vocês,[a] deem a Yahweh uma contribuição[b] ao longo de todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «das suas masseiras»; o termo hebraico pode indicar a massa ou, por associação, o recipiente em que ela é amassada.
    reason: lexical_alternative
  - marker: b
    text: Ou «uma oferta»; tradicionalmente, «uma oferta alçada».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: Da primeira porção
  rationale: O substantivo רֵאשִׁית indica aqui a parte inicial retirada da massa. A formulação explicita naturalmente em português o sentido partitivo, sem transformá-lo necessariamente no termo técnico «primícias».
- source_word: עֲרִסֹתֵיכֶם
  choice: da massa de vocês
  rationale: עֲרִסָה pode designar a massa ou, por associação, o recipiente usado para amassá-la. Como se retira uma porção para a contribuição, «massa» expressa melhor o referente imediato.
- source_word: תִּתְּנוּ
  choice: deem
  rationale: נתן é o verbo comum «dar». O imperativo português comunica de modo direto a força normativa da forma hebraica, cujo imperfeito tem valor injuntivo neste contexto.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama no texto hebraico.
- source_word: תְּרוּמָה
  choice: uma contribuição
  rationale: תְּרוּמָה designa algo separado ou retirado e entregue para uso sagrado. «Contribuição» é atual e clara, evitando a expressão técnica e pouco transparente «oferta alçada».
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: A expressão indica a continuidade da obrigação ao longo das sucessivas gerações; esta formulação é natural e preserva a duração pactual.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. «Yahweh» preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Natureza de תְּרוּמָה
  choice: contribuição
  alternative: oferta; oferta alçada
  rationale: A tradução mantém a ideia de uma porção separada e entregue a Yahweh, sem impor uma descrição ritual mais específica do que o termo exige neste verso.
translation_notes:
  register: Português moderno, digno e acessível, com construção de boa legibilidade brasileira. O pronome «vocês» explicita o plural do hebraico. Os marcadores foram colocados no fim da frase, junto ao conjunto das alternativas lexicais relevantes.
