  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: pt
  text: tudo o que Yahweh ordenou a vocês por meio de Moisés[a], desde o dia em que Yahweh ordenou e daí em diante, ao longo de suas gerações—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés”, expressão que significa “por meio de Moisés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: tudo o que
  rationale: Expressa de modo natural e abrangente a totalidade introduzida por כָּל אֲשֶׁר.
- source_word: צִוָּה
  choice: ordenou / deu essas ordens
  rationale: “Ordenou” traduz diretamente o verbo; na segunda ocorrência, “deu essas ordens” evita repetição pesada sem mudar o sentido e retoma o conjunto de mandamentos mencionado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
- source_word: אֲלֵיכֶם
  choice: a vocês
  rationale: Preserva explicitamente o destinatário plural e é natural no português de ampla compreensão, especialmente no Brasil.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Transmite o sentido idiomático de mediação ou agência de “pela mão de Moisés” em português atual.
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: desde o dia em que
  rationale: Marca com clareza o ponto inicial temporal indicado pelo hebraico.
- source_word: וָהָלְאָה
  choice: e daí em diante
  rationale: Representa o avanço temporal a partir do dia mencionado.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Conserva a ideia de continuidade ao longo das sucessivas gerações dos destinatários.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Mediação de Moisés em בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  alternative: pela mão de Moisés
  rationale: A expressão hebraica é literalmente “pela mão de Moisés”, mas funciona como idioma de agência ou mediação; a tradução escolhida comunica isso sem sugerir indevidamente uma ação manual.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O travessão final foi mantido porque o versículo continua a construção sintática iniciada no contexto anterior.
