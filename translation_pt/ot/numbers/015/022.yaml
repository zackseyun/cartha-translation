base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: pt
  text: Mas, se vocês se desviarem sem intenção e não cumprirem todos estes mandamentos que Yahweh falou a Moisés,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “errarem” ou “pecarem sem intenção”. O verbo hebraico transmite a ideia de desviar-se ou cometer um erro e, neste contexto, refere-se ao descumprimento involuntário dos mandamentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Mas, se
  rationale: Introduz a hipótese legal em continuidade com o contexto anterior, com leve valor contrastivo; esta formulação é natural em português.
- source_word: תִשְׁגּוּ
  choice: vocês se desviarem sem intenção
  rationale: שׁגה expressa desviar-se ou errar. No contexto jurídico-sacrificial, trata-se de uma falha involuntária, em contraste com o pecado deliberado mencionado depois.
- source_word: וְלֹא תַעֲשׂוּ
  choice: e não cumprirem
  rationale: Embora עשה signifique literalmente “fazer”, com “mandamentos” o verbo “cumprir” comunica em português natural a ideia de pô-los em prática, sem acrescentar uma noção estranha ao texto.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: todos estes mandamentos
  rationale: Preserva a abrangência de כָּל, o demonstrativo e o sentido jurídico-aliancista de מִצְוֺת.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: que Yahweh comunicou a Moisés
  rationale: O hebraico usa o verbo “falar” com a preposição אֶל. “Comunicou a Moisés” evita a possível impressão, em português, de que os mandamentos foram apenas ditos a ele, preservando a transmissão da instrução divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa convencional do nome hebraico.
theological_decisions:
- issue: Sentido de שׁגה neste contexto legal
  choice: desviarem sem intenção
  alternative: errarem; pecarem sem intenção
  rationale: A formulação conserva a imagem lexical de desvio e explicita a involuntariedade exigida pelo contexto, sem transformar o verbo diretamente no termo teológico “pecar”.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém no texto o nome pessoal divino presente no hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com plural explícito em “vocês”. “Cumprirem” é idiomático na combinação com “mandamentos”. A vírgula final reflete que o versículo continua sintaticamente no seguinte.
