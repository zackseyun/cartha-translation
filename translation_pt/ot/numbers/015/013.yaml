  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: pt
  text: Todo natural da terra fará essas coisas dessa maneira, para apresentar uma oferta pelo fogo, de aroma agradável a Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: Todo natural da terra
  rationale: כָּל tem força distributiva com o substantivo singular; אֶזְרָח designa o natural do país ou da comunidade, em contraste com o estrangeiro residente no contexto. A formulação mantém o singular representativo sem acrescentar referência explícita a sexo.
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: fará assim estas coisas
  rationale: O imperfeito tem força prescritiva no texto legal. A ordem próxima ao hebraico preserva a remissão aos procedimentos e itens já determinados.
- source_word: לְהַקְרִיב
  choice: ao apresentar
  rationale: No contexto sacrificial, o verbo significa trazer ou apresentar uma oferta. O infinitivo exprime a circunstância ou finalidade da execução das prescrições.
- source_word: אִשֵּׁה
  choice: oferta queimada
  rationale: O termo sacrificial denota uma oferta destinada ao fogo. Esta tradução é transparente em português e evita adotar a interpretação lexical discutida de 'oferta de alimento'.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma agradável
  rationale: Expressão sacrificial que comunica aceitação ou agrado; esta é uma formulação corrente, clara e digna em português.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Alcance do masculino singular הָאֶזְרָח
  choice: Todo natural da terra
  alternative: Todo homem natural da terra
  rationale: Embora a forma hebraica seja masculina singular, a instrução legal tem força representativa e genérica. O português permite conservar o singular gramatical sem afirmar que apenas homens estão incluídos.
- issue: Sentido de אִשֵּׁה
  choice: oferta queimada
  alternative: oferta de alimento
  rationale: A relação tradicional do termo com o fogo é mantida no texto; a alternativa 'oferta de alimento' depende de uma análise lexical discutida e poderia resolver indevidamente a questão.
- issue: Representação de יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino; a transliteração preserva sua condição de nome próprio.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. Registro legal e cultual digno, com sintaxe relativamente formal, mas compreensível. O singular 'natural' é representativo; não se acrescentou 'homem' nem se explicitou 'pessoa'.
