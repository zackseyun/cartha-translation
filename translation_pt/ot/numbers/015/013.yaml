  source_fidelity: 'A expressão «oferta queimada» é excessivamente específica: em hebraico, אִשֶּׁה designa uma oferta apresentada pelo fogo, não necessariamente um holocausto/oferta totalmente queimada. «Para apresentar» exprime melhor a finalidade de לְהַקְרִיב do que «ao apresentar».'
  naturalness: «Natural da terra» é uma formulação bíblica compreensível, mas «fará assim estas coisas» soa calcada no hebraico. «Fará essas coisas dessa maneira» preserva todos os elementos e é mais natural em português moderno.
  terminology: «Oferta pelo fogo» mantém o caráter técnico e genérico de אִשֶּׁה sem decidir a etimologia discutida como «oferta de alimento» nem restringir o termo a uma «oferta queimada». «Yahweh» preserva adequadamente o Tetragrama.
