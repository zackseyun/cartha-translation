    rationale: No contexto, o infinitivo introduz o propósito da observância prescrita; «para apresentar» o comunica diretamente.
  - severity: low
    issue: A ordem «fará assim estas coisas» é pouco idiomática.
    rationale: A reorganização proposta mantém «essas coisas» e «dessa maneira», mas evita uma construção excessivamente literal.
  revised_text: Todo natural da terra fará essas coisas dessa maneira, para apresentar uma oferta pelo fogo, de aroma agradável a Yahweh.
