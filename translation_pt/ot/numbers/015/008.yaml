  text: וְ/כִֽי תַעֲשֶׂ֥ה בֶן בָּקָ֖ר עֹלָ֣ה אוֹ זָ֑בַח לְ/פַלֵּא נֶ֥דֶר אֽוֹ שְׁלָמִ֖ים לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: pt
  text: Quando você preparar um novilho como holocausto ou sacrifício, para cumprir um voto ou como ofertas de comunhão a Yahweh,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כִי
  choice: Quando
  rationale: Neste contexto de instrução ritual, introduz o caso a ser tratado; “quando” é natural em português e mantém o valor temporal-condicional sem tornar a hipótese excessivamente incerta.
- source_word: תַעֲשֶׂה
  choice: você preparar
  rationale: O verbo עשה é amplo, “fazer”; no contexto sacrificial, “preparar” expressa naturalmente a ação sem especificar mais do que o hebraico.
- source_word: בֶן בָּקָר
  choice: um novilho
  rationale: A expressão designa um bovino do rebanho. “Novilho” é uma forma corrente e adequada ao contexto sacrificial, embora a idade exata não seja explicitada.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo tradicional, conciso e reconhecível em português para a oferta inteiramente queimada.
- source_word: אוֹ זָבַח
  choice: ou sacrifício
  rationale: זבח é um termo sacrificial amplo; “sacrifício” preserva essa generalidade.
- source_word: לְ/פַלֵּא נֶדֶר
  choice: para cumprir um voto
  rationale: A expressão idiomática indica levar a efeito aquilo que foi prometido; “cumprir um voto” comunica isso com clareza.
- source_word: אוֹ שְׁלָמִים
  choice: ou como oferta de comunhão
  rationale: שׁלמים designa uma categoria sacrificial associada à paz, ao bem-estar e à comunhão. “Oferta de comunhão” é clara em português, sem eliminar as alternativas legítimas.
- source_word: לַ/יהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino explícito do texto hebraico e traduz naturalmente a preposição no contexto da apresentação da oferta.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido de שְׁלָמִים
  choice: oferta de comunhão
  alternative: oferta pacífica; oferta de bem-estar
  rationale: A expressão admite mais de uma nuance. A escolha comunica a dimensão compartilhada do sacrifício, enquanto as demais possibilidades permanecem reconhecidas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. A frase conserva a continuidade sintática do versículo seguinte e, por isso, termina com vírgula.
