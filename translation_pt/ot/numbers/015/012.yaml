  text: כַּ/מִּסְפָּ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּ֛כָה תַּעֲשׂ֥וּ לָ/אֶחָ֖ד כְּ/מִסְפָּרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/012.yaml
  text: According to the number that you prepare[a], so you shall prepare for each one according to their number.
translation:
  language: pt
  text: Conforme o número que prepararem[a], assim farão para cada um, segundo o número deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Conforme o número que fizerem, assim farão para cada um, segundo o número deles”. O verbo hebraico עשה geralmente significa “fazer”; aqui, “preparar” esclarece o contexto das ofertas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמִּסְפָּר
  choice: Conforme o número
  rationale: A preposição כְּ expressa conformidade ou proporção, e מִסְפָּר significa “número, quantidade”. A formulação conserva a estrutura comparativa do hebraico.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz de modo natural em português a oração relativa ligada a “número”.
- source_word: תַּעֲשׂוּ
  choice: prepararem / farão
  rationale: O verbo עשה tem o sentido amplo de “fazer”. Na primeira ocorrência, “prepararem” esclarece o contexto das ofertas; na segunda, “farão” preserva a retomada instrutiva e a amplitude lexical do hebraico.
- source_word: כָּכָה
  choice: assim
  rationale: Retoma a expressão inicial de conformidade e reproduz com naturalidade a correlação “conforme... assim...”.
- source_word: לָאֶחָד
  choice: para cada um
  rationale: Embora literalmente possa ser “para o um”, a expressão tem força distributiva no contexto e se refere a cada item oferecido.
- source_word: כְמִסְפָּרָם
  choice: segundo o número deles
  rationale: Mantém tanto a ideia de conformidade expressa por כְּ quanto o sufixo plural “deles”, sem explicitar além do texto quais elementos estão sendo contados.
theological_decisions: []
