source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: pt
  text: O sacerdote fará expiação por toda a comunidade dos filhos de Israel, e eles serão perdoados, porque foi um erro involuntário, e eles trouxeram sua oferta, uma oferta queimada a Yahweh[a], e sua oferta pelo pecado diante de Yahweh[b], por seu erro involuntário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma oferta pelo fogo a Yahweh”. O termo hebraico designa uma oferta associada ao fogo sacrificial; em alguns contextos também é traduzido como “oferta de alimento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sua oferta de purificação”. O termo hebraico tradicionalmente traduzido como “oferta pelo pecado” também pode enfatizar a purificação realizada pelo sacrifício.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: fará expiação
  rationale: O piel de כפר, em contexto sacrificial, indica realizar expiação. A expressão preserva o sentido cultual e teológico sem acrescentar uma explicação interpretativa.
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: por toda a comunidade dos filhos de Israel
  rationale: עַל após כפר indica o beneficiário da expiação; עֲדָה é “comunidade/congregação”. “Filhos de Israel” preserva a forma tradicional e reconhecível do nome coletivo hebraico.
- source_word: וְנִסְלַח לָהֶם
  choice: e eles serão perdoados
  rationale: O nifal de סלח com o pronome plural expressa o resultado do perdão. A construção passiva é natural em português e não acrescenta um sujeito agente ausente no hebraico.
- source_word: כִּי שְׁגָגָה הִוא
  choice: porque foi um erro involuntário
  rationale: שְׁגָגָה designa erro, pecado ou ato cometido por inadvertência. “Erro involuntário” mantém juntas as dimensões jurídica e não intencional.
- source_word: וְהֵם הֵבִיאוּ
  choice: e porque trouxeram
  rationale: A coordenação é entendida como continuação da razão introduzida por כִּי, sem esconder em nota a possibilidade de lê-la como uma nova oração coordenada.
- source_word: אֶת קָרְבָּנָם
  choice: sua oferta
  rationale: קָרְבָּן é o termo geral para aquilo que é apresentado ou aproximado de Deus como oferta.
- source_word: אִשֶּׁה לַיהוָה
  choice: uma oferta feita pelo fogo a Yahweh
  rationale: אִשֶּׁה é uma designação cultual ligada ao fogo. A tradução evita confundi-la com o holocausto, que era integralmente queimado, e preserva a referência explícita ao fogo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְחַטָּאתָם
  choice: e sua oferta pelo pecado
  rationale: Neste contexto, חַטָּאת é algo apresentado diante de Yahweh e, portanto, designa a oferta sacrificial relacionada ao pecado; “oferta de purificação” permanece uma alternativa lexical válida.
- source_word: עַל שִׁגְגָתָם
  choice: por causa do erro involuntário que cometeram
  rationale: Repete o sentido da raiz שׁגג e torna explícita em português a relação possessiva de “seu erro”, sem mudar sua natureza não intencional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o tetragrama como nome próprio. “Yahweh” preserva esse nome, sem substituí-lo pelo título “Senhor”.
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A sintaxe exige aqui uma oferta apresentada diante de Yahweh, não apenas o conceito abstrato de pecado. A alternativa ressalta a função purificadora e é registrada em nota.
- issue: Relação lógica de וְהֵם הֵבִיאוּ com כִּי
  choice: e porque trouxeram
  alternative: e eles trouxeram
  rationale: 'A tradução principal lê os dois elementos como razões estreitamente ligadas ao perdão: a falta foi involuntária e a oferta exigida foi trazida. A coordenação hebraica também permite uma apresentação menos explicitamente causal, preservada em nota.'
translation_notes:
  register: Português moderno, claro e solene, com construção jurídica-sacrificial compreensível. Mantém “expiação” e “oferta pelo pecado” como termos bíblicos reconhecíveis, explicando em notas as alternativas relevantes. O nome divino é transliterado como “Yahweh”.
