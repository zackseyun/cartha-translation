  naturalness: O registro é claro e solene. "Oferta queimada" é uma expressão cultual mais idiomática em português do que "oferta feita pelo fogo", sem deixar de receber esclarecimento em nota para evitar que seja confundida com uma categoria sacrificial mais restrita.
  terminology: '"Fará expiação", "comunidade dos filhos de Israel", "Yahweh" e "oferta pelo pecado" são adequados. A alternativa "oferta de purificação" deve ser mantida em nota. A nota c torna-se desnecessária depois de se preservar a coordenação simples do hebraico.'
