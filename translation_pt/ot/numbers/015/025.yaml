revisions:
- from: O sacerdote fará expiação por toda a comunidade dos filhos de Israel, e eles serão perdoados, porque foi um erro involuntário[c] e porque trouxeram sua oferta, uma oferta feita pelo fogo a Yahweh[a], e sua oferta pelo pecado diante de Yahweh[b], por causa do erro involuntário que cometeram.
  to: O sacerdote fará expiação por toda a comunidade dos filhos de Israel, e eles serão perdoados, porque foi um erro involuntário, e eles trouxeram sua oferta, uma oferta queimada a Yahweh[a], e sua oferta pelo pecado diante de Yahweh[b], por seu erro involuntário.
  rationale: A revisão remove a segunda conjunção causal acrescentada ao hebraico, preservando "e eles trouxeram". Também substitui "oferta feita pelo fogo" por "oferta queimada", expressão mais natural no registro bíblico português, mantendo a alternativa lexical explicativa. A nota c é removida, pois a tradução já não adota a leitura causal explícita nem necessita de uma nota de pontuação.
