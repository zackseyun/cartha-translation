  - severity: low
    issue: Formulação pouco natural de אִשֶּׁה
    rationale: '"Uma oferta feita pelo fogo" é compreensível, mas soa menos idiomática em português bíblico moderno. "Uma oferta queimada" é uma formulação mais estabelecida; a nota especifica que o termo se refere a uma oferta associada ao fogo sacrificial.'
