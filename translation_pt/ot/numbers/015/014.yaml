revisions:
- from: E, se um estrangeiro residente morar com vocês, ou qualquer pessoa que estiver no meio de vocês ao longo das suas gerações, e oferecer uma oferta queimada[a], de aroma agradável a Yahweh, deverá fazer exatamente como vocês fazem.
  to: E, se um estrangeiro residente morar com vocês, ou qualquer pessoa que estiver entre vocês, por todas as suas gerações, e apresentar uma oferta apresentada pelo fogo, de aroma agradável a Yahweh, deverá fazer como vocês fazem.
  rationale: Substituí «oferta queimada» por «oferta apresentada pelo fogo», pois o hebraico אִשֶּׁה não identifica necessariamente uma oferta queimada específica. Também retirei «exatamente», que intensificava a comparação além do texto. A nota foi atualizada para refletir a alternativa lexical e a amplitude do termo hebraico.
