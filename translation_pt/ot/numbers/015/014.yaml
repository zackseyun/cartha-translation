source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: pt
  text: E, se um estrangeiro residente morar com vocês, ou qualquer pessoa que estiver entre vocês, por todas as suas gerações, e apresentar uma oferta apresentada pelo fogo, de aroma agradável a Yahweh, deverá fazer como vocês fazem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Preserva tanto a ligação com a legislação anterior quanto a introdução da condição.
- source_word: יָגוּר ... גֵּר
  choice: um estrangeiro residente morar
  rationale: Expressa a residência de uma pessoa não nativa e mantém a categoria social e jurídica indicada pelo hebraico, sem recorrer ao arcaico «peregrino» nem ao vago «estranho».
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Reflete diretamente a preposição hebraica e distingue esta expressão do subsequente «no meio de vocês».
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם
  choice: ou qualquer pessoa que estiver no meio de vocês
  rationale: Mantém a formulação abrangente e a relativa hebraica sem restringir indevidamente sua referência.
- source_word: לְדֹרֹתֵיכֶם
  choice: ao longo das suas gerações
  rationale: Comunica a vigência continuada da norma entre as gerações sucessivas.
- source_word: וְעָשָׂה
  choice: e oferecer
  rationale: No contexto sacrificial, «oferecer» transmite naturalmente o sentido contextual de fazer ou preparar a oferta.
- source_word: אִשֵּׁה
  choice: uma oferta queimada
  rationale: Representa o vínculo lexical do termo com o fogo e evita a possível impressão, em «oferta de alimento», de que a oferta necessariamente consista em comida.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Preserva a metáfora sacrificial e comunica que a oferta é agradável, sem linguagem arcaica.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera explicitamente o nome divino presente no texto hebraico.
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: deverá fazer exatamente como vocês fazem
  rationale: Reproduz a fórmula comparativa e seu valor prescritivo em português natural.
theological_decisions:
- issue: Participação do não israelita no culto sacrificial
  choice: A mesma prática sacrificial prescrita aos israelitas aplica-se à pessoa mencionada que vive entre eles.
  alternative: Entender a norma de modo mais restrito, apenas quanto ao estrangeiro residente já integrado à vida da aliança.
  rationale: A fórmula «como vocês fazem» estabelece igualdade de procedimento neste caso, mas o texto não define aqui todas as condições nem as implicações mais amplas da condição de aliança dessa pessoa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «vocês» para a segunda pessoa do plural. «Estrangeiro residente» preserva a categoria jurídica de גֵּר; «deverá» comunica a força normativa da legislação.
