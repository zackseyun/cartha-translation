review_pass:
  verdict: revise
  source_fidelity: A expressão אִשֶּׁה designa de modo geral uma oferta apresentada pelo fogo; «oferta queimada» a identifica indevidamente com um holocausto, categoria sacrificial mais específica. O restante reproduz adequadamente a condição, a categoria do estrangeiro residente e a fórmula de paridade ritual.
  naturalness: A revisão mantém português atual e claro, com «vocês», e ajusta a construção final para uma formulação jurídica natural sem o intensificador não expresso «exatamente».
  terminology: «Estrangeiro residente» é uma boa representação funcional de גֵּר. «Oferta apresentada pelo fogo» preserva o caráter sacrificial de אִשֶּׁה sem especificar o tipo de sacrifício. «Yahweh» corresponde ao nome divino explicitamente presente no hebraico.
  issues:
  - severity: medium
    issue: «Oferta queimada» traduz אִשֶּׁה de forma excessivamente específica.
    rationale: A palavra hebraica se refere a uma oferta por fogo, não necessariamente ao holocausto/oferta totalmente queimada. A tradução atual pode alterar a referência ritual do versículo.
  - severity: low
    issue: «Exatamente» acrescenta ênfase não explicitada na fórmula comparativa.
    rationale: «Como vocês fazem» já comunica a equivalência de procedimento exigida pelo hebraico.
  revised_text: E, se um estrangeiro residente morar com vocês, ou qualquer pessoa que estiver entre vocês, por todas as suas gerações, e apresentar uma oferta apresentada pelo fogo, de aroma agradável a Yahweh, deverá fazer como vocês fazem.
  revised_footnotes:
  - marker: a
    text: 'Ou: «uma oferta pelo fogo». O termo hebraico designa uma oferta apresentada pelo fogo e não especifica, por si só, um tipo particular de sacrifício.'
    reason: lexical_alternative
  revision_rationale: Substituí «oferta queimada» por «oferta apresentada pelo fogo», pois o hebraico אִשֶּׁה não identifica necessariamente uma oferta queimada específica. Também retirei «exatamente», que intensificava a comparação além do texto. A nota foi atualizada para refletir a alternativa lexical e a amplitude do termo hebraico.
