  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Então toda a congregação o levou para fora do acampamento e o apedrejou com pedras; e ele morreu, exatamente como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: toda a congregação
  rationale: עֵדָה designa aqui o conjunto reunido da comunidade de Israel. “Congregação” preserva o sentido corporativo e pactual, enquanto “toda” traduz כָּל.
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: o levou para fora
  rationale: No hifil, יצא significa fazer sair, levar ou trazer para fora. Com o destino expresso em seguida, “o levou para fora” é claro e natural em português.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: A construção indica movimento até um lugar exterior ao acampamento; “para fora do acampamento” conserva essa direção.
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: o apedrejou com pedras
  rationale: רגם descreve o apedrejamento, e בָּאֲבָנִים explicita o instrumento. Embora haja redundância estilística em português, a formulação preserva a ênfase concreta do hebraico.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: מות é o verbo comum para morrer. A tradução direta evita substituir o resultado narrado por uma formulação interpretativa como “foi executado”.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exatamente como Yahweh havia ordenado a Moisés
  rationale: כַּאֲשֶׁר expressa correspondência entre o ato e a ordem anterior; o mais-que-perfeito “havia ordenado” deixa clara essa anterioridade. A preposição “a” marca naturalmente em português o destinatário da ordem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” translitera o nome pactual e não o substitui por um título; “SENHOR” reflete a tradição de leitura, e “Jeová” resulta de uma forma híbrida posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura narrativa foi mantida próxima do hebraico, inclusive a menção explícita às pedras, sem suavizar o caráter judicial do episódio.
