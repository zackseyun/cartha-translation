  source_fidelity: 'O texto traduz com fidelidade todos os elementos do hebraico: a totalidade da congregação, a retirada para fora do acampamento, o apedrejamento com pedras, a morte resultante e a conformidade com a ordem previamente dada por Yahweh a Moisés. A forma singular dos verbos em português concorda naturalmente com o sujeito coletivo singular “toda a congregação”, sem alterar o referente coletivo de כָּל־הָעֵדָה.'
  naturalness: O português é claro, moderno e apropriado ao registro narrativo solene. “Para fora do acampamento” expressa bem o movimento para uma localização externa. “Apedrejou com pedras” é deliberadamente mais explícito do que o uso português mais idiomático “apedrejou”, mas é aceitável e reproduz o instrumento expresso no hebraico. O ponto e vírgula antes de “e ele morreu” é estilístico e não prejudica a leitura.
  terminology: “Congregação” é uma boa equivalência para עֵדָה neste contexto; “acampamento”, “apedrejou” e “ordenado a Moisés” são precisos. “Yahweh” corresponde à decisão editorial informada para o Tetragrama e é usado de modo consistente.
