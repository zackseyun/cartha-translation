  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: pt
  text: Então apresentará, com o novilho, uma oferta de cereal de três décimos[a] de efa de farinha fina, misturada com meio him de azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “três décimos”; neste contexto sacrificial, entende-se que a medida é três décimos de efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Então apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa trazer à presença, apresentar ou oferecer; “Então” expressa a sequência procedimental do waw.
- source_word: עַל
  choice: com
  rationale: 'Neste contexto, indica acompanhamento ou acréscimo: a oferta de cereal é apresentada junto com o novilho.'
- source_word: בֶּן הַבָּקָר
  choice: o novilho
  rationale: A expressão literal “filho do gado” designa um bovino jovem destinado ao sacrifício; “novilho” é conciso, natural e mantém essa nuance.
- source_word: מִנְחָה
  choice: uma oferta de cereal
  rationale: Na legislação sacerdotal, o termo designa especificamente uma oferta feita de produto cerealífero, não uma oferta genérica.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente corrente e claro para a farinha refinada usada nas ofertas.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: três décimos de efa
  rationale: A expressão hebraica diz literalmente “três décimos”; no contexto das medidas sacrificiais, subentende-se o efa.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: misturada com ... azeite
  rationale: O particípio descreve a farinha combinada com óleo; “azeite” é a designação portuguesa natural para o óleo empregado nesse contexto.
- source_word: חֲצִי הַהִין
  choice: meio him
  rationale: Mantém por transliteração a antiga unidade de capacidade líquida, sem impor uma conversão moderna incerta.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preservam-se as unidades antigas “efa” e “him”; a sintaxe foi ajustada para deixar claro que “três décimos” quantifica a farinha fina.
