base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: pt
  text: Assim se fará para cada touro, ou para cada carneiro, ou para cada animal do rebanho, das ovelhas ou das cabras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode designar uma cabeça de gado miúdo, não apenas um cordeiro; a expressão seguinte especifica que o animal pode ser das ovelhas ou das cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: Assim
  rationale: Introduz de modo natural e conciso a maneira prescrita no contexto legal.
- source_word: יֵעָשֶׂה
  choice: se fará
  rationale: A forma passiva/impessoal preserva a força prescritiva sem explicitar um agente.
- source_word: לַשּׁוֹר הָאֶחָד
  choice: com cada touro
  rationale: O artigo com אֶחָד destaca o animal individual; em português, “cada” comunica naturalmente a aplicação distributiva da regra. “Touro” evita acrescentar uma idade não expressa pelo hebraico.
- source_word: לָאַיִל הָאֶחָד
  choice: com cada carneiro
  rationale: אַיִל designa o macho adulto das ovelhas; “cada” conserva a aplicação individual da prescrição.
- source_word: שֶׂה
  choice: um animal do rebanho
  rationale: O termo pode designar genericamente um exemplar do gado miúdo, tanto ovino quanto caprino; a continuação explicita essas duas categorias.
- source_word: בַכְּבָשִׂים
  choice: das ovelhas
  rationale: A preposição indica pertencimento à categoria dos ovinos; a formulação é idiomática em português.
- source_word: בָעִזִּים
  choice: das cabras
  rationale: Expressa, em paralelo, o pertencimento à categoria dos caprinos.
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: ou ... ou ... ou ... ou
  rationale: Mantém a estrutura disjuntiva da lista de animais alternativos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção impessoal adequada ao contexto legal. A repetição de “ou” preserva a enumeração hebraica; “animal do rebanho” mantém a abrangência de שֶׂה sem impor espécie ou idade.
