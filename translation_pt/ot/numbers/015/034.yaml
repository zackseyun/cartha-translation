base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: pt
  text: E o colocaram sob custódia, porque não havia sido esclarecido[a] o que deveria ser feito com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não havia sido especificado o que deveria ser feito com ele”.'
    reason: Alternativa lexical para לֹא פֹרַשׁ, que pode salientar que a medida a tomar não havia sido declarada ou especificada.
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: colocaram
  rationale: No hifil, נוח pode significar pôr, colocar ou deixar. “Colocaram” expressa de modo natural a ação de manter o homem detido, sem acrescentar a ideia de uma sentença formal.
- source_word: אֹתוֹ
  choice: o
  rationale: Pronome de objeto direto masculino singular, referente ao homem encontrado recolhendo lenha no contexto anterior.
- source_word: בַּמִּשְׁמָר
  choice: sob custódia
  rationale: מִשְׁמָר pode indicar guarda, custódia ou lugar de detenção. “Sob custódia” comunica uma detenção provisória sem pressupor uma prisão formal.
- source_word: כִּי
  choice: porque
  rationale: Introduz a razão pela qual o homem foi mantido sob custódia.
- source_word: לֹא פֹרַשׁ
  choice: ainda não havia sido esclarecido
  rationale: A forma passiva de פרש indica que a providência a tomar não havia sido declarada ou especificada claramente. “Ainda” torna explícito o valor contextual de uma decisão pendente, sem resolver a natureza exata da incerteza.
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: o que deveria ser feito com ele
  rationale: A formulação preserva o sentido passivo e a força deliberativa e jurídica da pergunta sobre a providência a ser tomada em relação ao homem.
theological_decisions:
- issue: Natureza da incerteza no processo jurídico
  choice: O texto afirma que a providência exigida ainda não havia sido claramente determinada.
  alternative: A frase pode ser entendida mais especificamente como uma referência à pena que ainda não havia sido declarada.
  rationale: A construção passiva לֹא פֹרַשׁ enfatiza a ausência de uma especificação clara. A tradução mantém essa incerteza processual sem afirmar que toda a lei era desconhecida nem restringir o sentido apenas à pena.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Sob custódia” evita tanto o coloquialismo quanto a inferência excessiva de encarceramento formal; a ordem da frase permanece natural em português.
