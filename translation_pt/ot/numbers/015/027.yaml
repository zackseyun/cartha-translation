  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: pt
  text: Mas, se uma pessoa pecar sem intenção, apresentará uma cabra de um ano como oferta pelo pecado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «oferta de purificação». O termo hebraico חַטָּאת pode designar a oferta que trata do pecado ou da impureza, e não apenas o pecado em si.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A conjunção introduz, em contraste moderado com a legislação anterior, o caso de uma única pessoa; «Mas, se» expressa naturalmente essa transição.
- source_word: נֶפֶשׁ אַחַת
  choice: uma pessoa
  rationale: Em contexto jurídico, נֶפֶשׁ designa a pessoa ou o indivíduo, não apenas a «alma»; «uma pessoa» preserva a singularidade e soa natural.
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: pecar sem intenção
  rationale: A expressão indica pecado cometido inadvertidamente, em oposição deliberada à transgressão intencional; a formulação é clara e corrente.
- source_word: וְהִקְרִיבָה
  choice: apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa trazer ou apresentar a oferta. O futuro exprime adequadamente a consequência jurídica da condição.
- source_word: עֵז בַּת שְׁנָתָהּ
  choice: uma cabra de um ano
  rationale: עֵז especifica uma fêmea caprina, e o idioma בַּת שְׁנָתָהּ indica um animal de um ano ou no primeiro ano de vida.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: No sistema sacrificial, חַטָּאת designa a oferta que trata do pecado e/ou da impureza; «oferta pelo pecado» é clara e amplamente reconhecida.
theological_decisions:
- issue: Gênero da pessoa que peca
  choice: Não se empregou pronome pessoal; «uma pessoa» é retomada pelo verbo no singular.
  alternative: Usar explicitamente «ela», seguindo as formas femininas do hebraico.
  rationale: As formas femininas concordam gramaticalmente com נֶפֶשׁ, substantivo feminino, sem restringir a lei às mulheres. Em português, o sujeito expresso «uma pessoa» e o verbo sem pronome preservam o singular e evitam criar uma ênfase sexual inexistente no referente.
- issue: Sentido de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: «Oferta pelo pecado» continua sendo a designação mais reconhecível, enquanto «oferta de purificação» explicita uma possível ênfase ritual do termo. A alternativa é preservada em nota para não eliminar a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção jurídica é concisa; «cabra» comunica naturalmente o sexo do animal, e a nota preserva a alternativa ritual de חַטָּאת.
