id: NUM.15.31
reference: Numbers 15:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: pt
  text: Pois desprezou a palavra de Yahweh e violou o seu mandamento; essa pessoa certamente será eliminada[a]; a sua culpa está sobre ela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é enfática, literalmente “será de fato cortada”. O verso não especifica aqui a forma exata desse juízo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “a sua iniquidade está sobre ela”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da sentença anterior e preserva a ligação explicativa com o contexto.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: דָּבָר designa aqui a palavra ou determinação divina; o nome da aliança é transliterado como Yahweh.
- source_word: בָּזָה
  choice: desprezou
  rationale: Expressa desdém ativo, e não mera negligência.
- source_word: מִצְוָתוֹ
  choice: o seu mandamento
  rationale: Mantém o singular hebraico e o peso jurídico e pactual da expressão.
- source_word: הֵפַר
  choice: violou
  rationale: No contexto legal, comunica com naturalidade a transgressão do mandamento sem sugerir que a pessoa o tenha anulado em sentido absoluto.
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: certamente será eliminada
  rationale: O advérbio reproduz a intensificação formada pelo infinitivo absoluto com o verbo finito; 'eliminada' mantém aberta a forma exata do juízo.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: essa pessoa
  rationale: Em legislação, נֶפֶשׁ refere-se ao indivíduo; 'pessoa' evita uma leitura antropológica indevida de 'alma'.
- source_word: עֲוֺנָהּ בָּהּ
  choice: a sua culpa recai sobre ela
  rationale: Reproduz o sentido judicial de culpa ou responsabilidade que permanece sobre a própria pessoa, em português natural.
theological_decisions:
- issue: Forma de representar o nome יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da pena expressa por הִכָּרֵת תִּכָּרֵת
  choice: 'Manter uma formulação não específica: ''certamente será eliminada'''
  alternative: será executada; será expulsa da comunidade; morrerá sem descendência
  rationale: O verso afirma solenemente a eliminação da pessoa, mas não especifica se o meio é morte, expulsão ou outro juízo; a tradução não resolve essa tensão.
- issue: Sentido de עָוֹן na cláusula final
  choice: culpa
  alternative: iniquidade; castigo pela iniquidade
  rationale: A expressão pode abranger tanto a iniquidade quanto a responsabilidade decorrente dela. 'Culpa' preserva melhor o caráter judicial sem definir explicitamente a consequência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância inclusiva motivada pelo substantivo 'pessoa'. A divisão em duas frases favorece a clareza sem romper a relação causal introduzida por 'Pois'.
