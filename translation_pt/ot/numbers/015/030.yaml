language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: pt
  text: Mas a pessoa que agir de modo desafiador[a], seja israelita de nascimento, seja estrangeiro residente, está insultando Yahweh; essa pessoa será removida do meio do seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com mão levantada”; isto é, de modo presunçoso ou abertamente rebelde.
    reason: Preserva a imagem do idioma hebraico e registra alternativas semânticas relevantes.
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: a pessoa
  rationale: Em contexto jurídico, נֶפֶשׁ designa a pessoa inteira, não apenas a “alma”; “pessoa” é natural e preciso em português moderno.
- source_word: תַּעֲשֶׂה
  choice: agir
  rationale: O verbo עשה é amplo (“fazer, agir”); aqui, “agir” comunica a conduta sem especificar além do texto qual foi a infração.
- source_word: בְּיָד רָמָה
  choice: de modo desafiador
  rationale: O idioma, literalmente “com mão levantada/erguida”, expressa ação ostensiva, arrogante e deliberadamente rebelde. A tradução comunica seu sentido no corpo do texto, enquanto a nota preserva a imagem hebraica e alternativas legítimas.
- source_word: הָאֶזְרָח
  choice: israelita de nascimento
  rationale: No contraste jurídico com o גֵּר, refere-se ao membro nativo da comunidade de Israel. A explicitação “israelita” torna o referente claro em português.
- source_word: הַגֵּר
  choice: estrangeiro residente
  rationale: גֵּר indica o não israelita que vive de forma estável no meio da comunidade e está sujeito à sua ordem legal; “estrangeiro residente” evita tanto a vagueza de “estrangeiro” quanto o arcaísmo de “peregrino”.
- source_word: אֶת יְהוָה הוּא מְגַדֵּף
  choice: está insultando Yahweh
  rationale: גדף denota tratar com desprezo, ultrajar ou insultar. “Insultando” preserva o objeto divino e não restringe a ação apenas a uma blasfêmia verbal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, conforme a prática do projeto, em vez de substituí-lo por um título.
- source_word: וְנִכְרְתָה
  choice: será eliminada
  rationale: A fórmula jurídica כרת no nifal anuncia exclusão ou juízo severo. “Será eliminada” mantém a força da sanção sem decidir se ocorre por execução humana, expulsão ou ação divina.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: do meio do seu povo
  rationale: A expressão descreve a remoção da comunidade. “Seu” acompanha naturalmente “pessoa” sem marcar gênero.
theological_decisions:
- issue: Natureza da conduta descrita por בְּיָד רָמָה
  choice: A tradução apresenta uma ação aberta e desafiadora.
  alternative: “Presunçosamente” ou a forma literal “com mão levantada”.
  rationale: O idioma contrapõe esta conduta aos pecados involuntários dos versículos anteriores. “De modo desafiador” comunica rebeldia deliberada sem transformar o texto numa categoria doutrinária mais estreita.
- issue: Alcance de מְגַדֵּף contra Yahweh
  choice: “Está insultando Yahweh”.
  alternative: “Está blasfemando contra Yahweh” ou “está afrontando Yahweh”.
  rationale: O verbo pode envolver desprezo expresso por palavras ou atos. “Insultando” conserva essa amplitude e a gravidade da afronta sem limitá-la necessariamente à fala.
- issue: Natureza da pena de ser “eliminado”
  choice: A formulação permanece sem especificar o agente ou o mecanismo da pena.
  alternative: Execução, expulsão da comunidade ou juízo divino direto.
  rationale: O versículo declara a sanção, mas não resolve por si só como ela se realiza. A tradução preserva essa tensão jurídica e teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. “Israelita de nascimento” e “estrangeiro residente” tornam inteligível o contraste jurídico. A repetição de “pessoa” preserva a ênfase legal do hebraico; “seu” evita impor gênero ao referente.
