  text: וּ/פָרְשׂ֣וּ עֲלֵי/הֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: pt
  text: Estenderão sobre eles um tecido escarlate e o cobrirão com uma cobertura de pele de táhax[a]; colocarão no lugar as suas varas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico táhax; não se sabe ao certo qual era o animal ou material. Traduções tradicionais incluem “pele de texugo”, “pele de golfinho” ou, de modo mais geral, “couro fino”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: Estenderão sobre eles
  rationale: Preserva a ação concreta de estender uma cobertura sobre os objetos mencionados no versículo anterior.
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: um pano de tecido escarlate
  rationale: בֶּגֶד designa aqui um pano de cobertura, não uma peça de roupa; 'tecido escarlate' comunica o material tingido sem especificar indevidamente que se trata de fio.
- source_word: וְכִסּוּ אֹתוֹ
  choice: e o cobrirão
  rationale: Mantém a mudança do referente plural ('eles') para o objeto singular, provavelmente a mesa como unidade.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: com uma cobertura de pele de táhax
  rationale: Mantém a repetição entre o verbo 'cobrir' e o substantivo 'cobertura' e translitera תחשׁ porque a identificação exata do animal ou material é incerta.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: depois, colocarão no lugar as suas varas
  rationale: As varas são as usadas para transportar o móvel sagrado; 'no lugar' explicita naturalmente a colocação indicada pelo contexto de preparação para o transporte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A transliteração 'táhax' conserva a incerteza lexical do hebraico; a nota apresenta alternativas tradicionais sem escolher uma identificação especulativa.
