  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: pt
  text: Porão sobre ela uma cobertura de couro fino[a], estenderão por cima um pano inteiramente azul e colocarão no lugar as suas varas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תַּחַשׁ (táhash) é incerto; pode designar a pele de um animal específico, tradicionalmente identificada de várias maneiras, como pele de cabra, de toninha ou de dugongo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Porão sobre ela
  rationale: A forma verbal tem valor sequencial e instrutivo no contexto. “Sobre ela” expressa a colocação da cobertura sobre a arca, retomada no feminino natural do português.
- source_word: כְּסוּי עוֹר תַּחַשׁ
  choice: uma cobertura de couro fino
  rationale: כְּסוּי designa uma cobertura, enquanto a identificação exata de תַּחַשׁ é incerta. “Couro fino” oferece uma formulação clara sem adotar como certa uma espécie animal discutida; a incerteza é registrada em nota.
- source_word: וּפָרְשׂוּ
  choice: estenderão
  rationale: O verbo descreve o ato de abrir e estender um tecido sobre algo; “estenderão” é natural em instruções desse tipo.
- source_word: בֶגֶד כְּלִיל תְּכֵלֶת
  choice: um pano inteiramente azul
  rationale: בֶגֶד, neste uso, é um tecido empregado como cobertura, não uma peça de roupa. כְּלִיל enfatiza a totalidade, e תְּכֵלֶת designa a cor azul característica dos materiais do santuário.
- source_word: מִלְמָעְלָה
  choice: por cima
  rationale: No encadeamento das camadas, a expressão indica que o pano azul fica na parte superior da cobertura de couro.
- source_word: וְשָׂמוּ בַּדָּיו
  choice: e colocarão no lugar as suas varas
  rationale: בַּדָּיו são as varas usadas para transportar a arca. “No lugar” torna idiomática em português a instrução de pô-las ou ajustá-las, sem acrescentar uma localização específica.
