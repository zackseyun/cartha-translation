base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/009.yaml
  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: pt
  text: Então pegarão um pano azul[a] e cobrirão o candelabro destinado à iluminação, juntamente com suas lâmpadas, suas tenazes, seus braseiros e todos os utensílios para o seu azeite, com os quais prestarão serviço para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um pano de azul” ou “um pano azul-púrpura”. O hebraico תְּכֵלֶת se refere ao característico tecido tingido usado nos móveis e utensílios do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: um pano azul
  rationale: בֶּגֶד pode designar uma peça de tecido e, neste contexto, “pano” é mais adequado que “veste”. תְּכֵלֶת indica o tecido tingido de azul ou azul-púrpura característico dos utensílios do santuário; “azul” é a forma mais clara no texto, com a nuance cromática registrada em nota.
- source_word: מְנֹרַת הַמָּאוֹר
  choice: o candelabro destinado à iluminação
  rationale: מְנוֹרָה é o candelabro que sustenta as lâmpadas, e הַמָּאוֹר expressa aqui sua função de iluminação. A formulação preserva o sentido funcional do genitivo sem confundir o suporte com a própria luz.
- source_word: נֵרֹתֶיהָ
  choice: suas lâmpadas
  rationale: נֵר designa uma lâmpada ou sua chama; “lâmpadas” identifica naturalmente as unidades individuais associadas ao candelabro.
- source_word: מַלְקָחֶיהָ
  choice: suas tenazes
  rationale: O termo designa instrumentos usados no manejo dos pavios ou das chamas. “Tenazes” mantém a referência geral sem impor a função mais específica e incerta de espevitadeiras.
- source_word: מַחְתֹּתֶיהָ
  choice: seus braseiros
  rationale: מַחְתָּה pode indicar recipiente para brasas, pá de brasas ou incensário. No contexto do cuidado das lâmpadas, “braseiros” evita sugerir indevidamente o uso de incenso.
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: todos os utensílios para o seu azeite
  rationale: כְּלִים abrange recipientes e instrumentos, enquanto שֶׁמֶן, no contexto do candelabro, é o azeite usado nas lâmpadas. “Utensílios” preserva essa amplitude melhor que “recipientes” apenas.
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: com os quais prestam serviço junto a ele
  rationale: שׁרת tem sentido de serviço cultual; בָּהֶם retoma os utensílios como meios do serviço, e לָהּ retoma a מְנוֹרָה, substantivo feminino em hebraico. A tradução conserva tanto o instrumento plural quanto o candelabro como referente do serviço.
