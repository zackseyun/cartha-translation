  yaml_path: translation/ot/numbers/004/029.yaml
  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: pt
  text: Quanto aos filhos de Merari[a], conte-os segundo os seus clãs e segundo as suas casas paternas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Merari” ou “meraritas”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pela casa de seus pais”; expressão genealógica que indica agrupamentos familiares definidos pela linhagem paterna.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: filhos de Merari
  rationale: A expressão significa literalmente “filhos de Merari” e, neste contexto genealógico, abrange os descendentes de sua linhagem. A forma literal preserva a estrutura familiar do hebraico sem perder clareza em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui as subdivisões de parentesco dentro do grupo tribal. “Clãs” comunica melhor esse sentido do que o termo mais amplo “famílias”.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo as suas casas paternas
  rationale: A expressão hebraica designa agrupamentos genealógicos organizados pela linhagem paterna. “Casas paternas” conserva a imagem e a estrutura social da expressão de modo compreensível em português.
- source_word: תִּפְקֹד
  choice: conte-os
  rationale: Neste contexto censitário, פקד indica contar ou registrar pessoas. “Conte-os” é direto, atual e não acrescenta uma conotação militar que não está explícita nesta frase.
- source_word: אֹתָם
  choice: -os
  rationale: O pronome de objeto direto retoma “os filhos de Merari” e é expresso naturalmente em português pela forma enclítica “-os”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A construção inicial “Quanto aos” preserva o tópico destacado no hebraico; “conte-os” transmite a força diretiva do verbo no contexto.
