  yaml_path: translation/ot/numbers/004/044.yaml
  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: pt
  text: E os que foram contados dentre eles, segundo os seus clãs, foram três mil e duzentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: O verbo היה com waw consecutivo dá continuidade ao relato e introduz o total apurado; em português, a forma verbal «foram» expressa isso naturalmente, sem necessidade de reproduzir mecanicamente a conjunção.
- source_word: פְקֻדֵיהֶם
  choice: os que foram contados entre eles
  rationale: Neste contexto censitário, a forma derivada de פקד designa os integrantes recenseados. «Os que foram contados entre eles» preserva a referência ao grupo anterior sem acrescentar «homens», palavra não expressa neste versículo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui a subdivisão familiar ou clânica dentro da tribo. «Clãs» é claro e adequado à organização social descrita em Números, enquanto «segundo» representa o valor classificatório da preposição לְ.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: três mil e duzentos
  rationale: É a expressão cardinal direta do total; a conjunção antes das centenas é natural no português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação natural para um registro censitário. A opção «clãs» mantém a estrutura social do texto e evita a possível imprecisão de «famílias».
