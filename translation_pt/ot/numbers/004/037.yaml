  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: pt
  text: Estes foram os homens recenseados das famílias dos coatitas, todos os que serviam na tenda do encontro, os quais Moisés e Arão recensearam por ordem de Yahweh, pela mão de Moisés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por intermédio de Moisés”.
    reason: Alternativa idiomática para בְּיַד מֹשֶׁה, que pode indicar agência ou mediação.
lexical_decisions:
- source_word: פְקוּדֵי
  choice: os homens recenseados
  rationale: O termo deriva de פקד em contexto de recenseamento. A formulação identifica os integrantes masculinos contados para o serviço, em vez de designar apenas o recenseamento como procedimento.
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: das famílias dos coatitas
  rationale: מִשְׁפָּחָה pode indicar família ou clã; “famílias” é claro e natural, e “coatitas” expressa o grupo descendente de Coate.
- source_word: כָּל הָעֹבֵד
  choice: todos os que serviam
  rationale: O particípio עֹבֵד descreve os que se dedicavam ao serviço. O imperfeito português ajusta-se naturalmente à descrição desse grupo no contexto narrativo.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Mantém a designação cultual e o valor locativo ou esférico de בְּ, em português atual e compreensível.
- source_word: אֲשֶׁר פָּקַד
  choice: os quais ... recensearam
  rationale: A repetição de פקד continua a referir-se à contagem oficial, e a oração relativa retoma os homens recenseados.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: A expressão idiomática, literalmente “segundo a boca de”, indica que o recenseamento foi feito por ordem divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: pela mão de Moisés
  rationale: Preserva a imagem hebraica de mão como meio ou agência e mantém a tensão da formulação após a menção conjunta de Moisés e Arão; a alternativa idiomática é registrada em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e corresponde de modo mais próximo à vocalização acadêmica amplamente aceita.
- issue: Agência na expressão בְּיַד מֹשֶׁה
  choice: pela mão de Moisés
  alternative: por intermédio de Moisés
  rationale: A tradução formal conserva a expressão do texto e não elimina a possível tensão entre Moisés e Arão como recenseadores e Moisés como mediador da ordem divina.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Recenseados” mantém o contexto oficial da contagem; “tenda do encontro” evita uma formulação excessivamente tradicional sem perder o sentido cultual. A expressão mais formal “pela mão de Moisés” foi mantida no texto e esclarecida por nota.
