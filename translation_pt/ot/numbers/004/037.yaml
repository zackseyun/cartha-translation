  source_fidelity: 'O texto traduz com precisão a estrutura e os termos centrais do hebraico: פְקוּדֵי é adequadamente expresso como “homens recenseados” no contexto do recenseamento de homens destinados ao serviço; “famílias dos coatitas” preserva o vínculo clânico; “todos os que serviam” representa bem כָּל הָעֹבֵד; e a dupla referência a Moisés e Arão como agentes do recenseamento é mantida. “Por ordem de Yahweh” traduz naturalmente עַל־פִּי יְהוָה. “Pela mão de Moisés” conserva, sem resolver indevidamente, o idiomatismo de mediação/agência em בְּיַד מֹשֶׁה.'
