base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: pt
  text: Sobre a mesa da Presença, estenderão um pano azul e colocarão nele os pratos, as taças, as tigelas e os jarros para a libação; e o pão contínuo[a] estará sobre ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “os pães da proposição”. A expressão hebraica significa literalmente “o pão contínuo” e se refere ao pão mantido regularmente diante do SENHOR sobre a mesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: mesa da Presença
  rationale: Preserva a expressão hebraica literalmente ligada à face/presença e seu sentido cultual, sem substituí-la pela designação tradicional mais interpretativa.
- source_word: יִפְרְשׂוּ
  choice: estenderão
  rationale: Expressa naturalmente a ação de abrir e dispor o pano sobre a mesa.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: um pano azul
  rationale: É uma formulação clara e atual, sem precisar em excesso o matiz azul ou azul-violeta de תְּכֵלֶת.
- source_word: הַקְּעָרֹת
  choice: os pratos
  rationale: Designa de modo natural recipientes rasos usados à mesa.
- source_word: הַכַּפֹּת
  choice: as taças
  rationale: Mantém uma designação ampla e inteligível para pequenos utensílios de mesa, sem impor uma forma exata incerta.
- source_word: הַמְּנַקִּיֹּת
  choice: as tigelas
  rationale: Reflete a provável função como recipiente e evita termos arcaicos ou excessivamente específicos.
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: os jarros para a oferta derramada
  rationale: Comunica tanto a natureza dos recipientes quanto sua função na libação, em linguagem compreensível.
- source_word: לֶחֶם הַתָּמִיד
  choice: o pão contínuo
  rationale: Preserva a força de תָּמִיד, indicando o pão mantido continuamente diante do SENHOR, sem reduzi-la à ideia de mera regularidade.
- source_word: עָלָיו יִהְיֶה
  choice: estará sobre ela
  rationale: Segue diretamente a afirmação hebraica de que o pão estará sobre a mesa, sem acrescentar explicitamente a noção de permanecer.
