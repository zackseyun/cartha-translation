  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: pt
  text: Estes são os recenseados das famílias dos filhos de Merari, que Moisés e Arão contaram por ordem de Yahweh[a], por meio de Moisés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “segundo a boca de Yahweh”, isto é, “por ordem de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “pela mão de Moisés”, isto é, “por meio de Moisés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Estes são os recenseados
  rationale: A expressão apresenta o total registrado no recenseamento. “Recenseados” é natural em português e preserva o sentido contextual de פקד.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: das famílias dos filhos de Merari
  rationale: Mantém a cadeia de parentesco do hebraico e a terminologia usada no contexto levítico.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: que Moisés e Arão contaram
  rationale: O verbo פקד, neste contexto censitário, indica contar ou registrar; “contaram” evita repetição pouco natural de “recensearam”.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: O idioma literalmente ligado à “boca” expressa comando ou determinação; a forma idiomática comunica com clareza o sentido em português, enquanto a nota registra a imagem hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: O idioma hebraico “pela mão de” marca mediação ou agência; “por meio de” transmite esse valor naturalmente, e a nota preserva a formulação literal.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino; “Yahweh” o representa diretamente sem trocá-lo por um título.
- issue: Relação entre a ordem divina e a mediação de Moisés
  choice: “por ordem de Yahweh, por meio de Moisés”
  alternative: “segundo a boca de Yahweh, pela mão de Moisés”
  rationale: 'A tradução mantém as duas relações: Yahweh é a fonte da ordem, e Moisés é o mediador. As notas preservam as metáforas corporais do hebraico sem tornar o texto principal obscuro.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação evita literalismos opacos no texto principal, mas conserva em notas as imagens hebraicas “boca” e “mão”.
