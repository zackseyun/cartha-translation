  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: pt
  text: 'Dos trinta anos de idade para cima, até os cinquenta anos, você os recenseará: todos os que se apresentarem para o serviço[a], para realizar o trabalho da tenda do encontro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido como “serviço” também pode designar um exército ou uma hoste; aqui se refere ao dever organizado dos levitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: Dos trinta anos de idade para cima
  rationale: Expressa naturalmente em português o limite etário inferior indicado pelo idioma hebraico מִן + בֶּן + número + שָׁנָה, sem reproduzir literalmente a construção “filho de trinta anos”.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: até os cinquenta anos
  rationale: Completa com clareza o intervalo de idade e corresponde diretamente a וְעַד.
- source_word: תִּפְקְדֵם
  choice: você os recenseará
  rationale: No contexto do censo levítico, פקד indica contar e registrar as pessoas aptas para o serviço. “Recenseará” comunica melhor essa ação oficial do que o simples “contará”.
- source_word: כָּל הַבָּא
  choice: todos os que ingressarem
  rationale: O singular distributivo hebraico abrange cada pessoa qualificada. O plural é idiomático em português e concorda naturalmente com o antecedente “os”.
- source_word: לַצָּבָא
  choice: no serviço
  rationale: Aqui צָבָא designa o serviço levítico organizado, não combate militar. “Serviço” preserva o sentido funcional sem eliminar totalmente a ideia de dever estruturado, explicada em nota.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: para realizar o trabalho
  rationale: Evita a repetição pouco natural “servir o serviço” e transmite a ação de desempenhar o trabalho designado.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução direta e reconhecível da designação do santuário, em linguagem clara e não sacralizante.
theological_decisions:
- issue: Possível nuance militar de צָבָא no serviço levítico
  choice: serviço
  alternative: hoste, exército ou dever organizado
  rationale: O contexto trata do trabalho designado aos levitas na tenda do encontro, e não de combate. “Serviço” comunica o sentido contextual, enquanto a nota preserva a extensão semântica do termo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para o destinatário singular implícito na forma verbal hebraica e mantém a estrutura de recenseamento seguida da descrição dos aptos.
