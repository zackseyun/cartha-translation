base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: pt
  text: Faça o recenseamento dos filhos de Coate dentre os filhos de Levi[a], segundo os seus clãs e as suas casas paternas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “levante a cabeça dos filhos de Coate”, expressão idiomática que significa contá-los ou fazer o recenseamento deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Façam o recenseamento
  rationale: A expressão significa literalmente “levantar a cabeça”, mas, neste contexto administrativo, é um modo de dizer “contar” ou “fazer o recenseamento”. O plural imperativo é natural em português, pois a ordem se dirige a Moisés e Arão no contexto imediato.
- source_word: בְּנֵי קְהָת
  choice: os filhos de Coate
  rationale: Preserva a formulação genealógica do hebraico e mantém o paralelismo com “filhos de Levi”.
- source_word: מִתּוֹךְ
  choice: dentre
  rationale: Indica a seleção de um grupo no interior de outro, aqui os descendentes de Coate dentro da tribo de Levi.
- source_word: בְּנֵי לֵוִי
  choice: os filhos de Levi
  rationale: Mantém a forma genealógica do original, sem substituí-la pelo gentílico “levitas”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה designa divisões de parentesco no nível do clã.
- source_word: לְבֵית אֲבֹתָם
  choice: as suas casas paternas
  rationale: Reproduz a expressão israelita de parentesco e organização social sem reduzi-la simplesmente a “famílias” ou “lares”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário genealógico próximo do hebraico. “Recenseamento” comunica com precisão o sentido administrativo da expressão idiomática, e “casas paternas” preserva a estrutura social indicada no original.
