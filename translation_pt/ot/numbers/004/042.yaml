lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: E os homens contados
  rationale: O substantivo passivo plural designa os recenseados; “homens” fica implícito no contexto do levantamento e torna a formulação natural em português.
- source_word: מִשְׁפְּחֹת
  choice: clãs
  rationale: Representa grupos de parentesco extensos dentro da tribo, distinguindo-os das casas paternas.
- source_word: בְּנֵי מְרָרִי
  choice: filhos de Merari
  rationale: Preserva a expressão genealógica hebraica e identifica o ramo levítico descendente de Merari.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: A preposição לְ indica aqui classificação ou organização conforme os clãs.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo as suas casas paternas
  rationale: Mantém a unidade social e genealógica menor expressa pelo hebraico בֵּית אָבוֹת.
