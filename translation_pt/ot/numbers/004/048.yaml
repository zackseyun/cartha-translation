  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: pt
  text: Os homens recenseados entre eles foram oito mil quinhentos e oitenta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que foram contados entre eles” ou “os seus recenseados”. O hebraico se refere aos inscritos no recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Neste total de recenseamento, a forma de היה funciona como verbo copulativo no passado; “foram” preserva de modo natural a estrutura do hebraico.
- source_word: פְּקֻדֵיהֶם
  choice: os homens recenseados entre eles
  rationale: Derivado de פקד em contexto de recenseamento, o termo designa os que foram contados e registrados. “Homens” explicita com precisão o referente masculino estabelecido pelo contexto de Números 4, enquanto “recenseados entre eles” comunica a relação expressa pelo sufixo hebraico sem sugerir posse.
- source_word: שְׁמֹנַת אֲלָפִים
  choice: oito mil
  rationale: Tradução direta da construção cardinal hebraica.
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: quinhentos
  rationale: Reproduz naturalmente em português a parcela seguinte da sequência numérica aditiva.
- source_word: וּשְׁמֹנִים
  choice: e oitenta
  rationale: Preserva o último elemento da sequência aditiva e a conjunção hebraica.
theological_decisions:
- issue: Terminologia de gênero no recenseamento
  choice: os homens recenseados entre eles
  alternative: os recenseados entre eles; os que foram contados entre eles
  rationale: O contexto imediato conta levitas do sexo masculino dentro da faixa etária determinada para o serviço da Tenda do Encontro. A formulação escolhida representa com exatidão o referente, sem tornar a expressão artificialmente neutra.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Recenseados” mantém o tom administrativo do contexto sem soar excessivamente técnico.
