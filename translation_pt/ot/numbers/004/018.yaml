  text: אַל תַּכְרִ֕יתוּ אֶת שֵׁ֖בֶט מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֑י מִ/תּ֖וֹךְ הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/018.yaml
  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: pt
  text: Não eliminem, do meio dos levitas, a tribo das famílias dos coatitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não destruam do meio dos levitas o clã das famílias dos coatitas”. O verbo hebraico pode significar “eliminar” ou “destruir”; “famílias” também pode ser traduzido por “clãs”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּכְרִיתוּ
  choice: Não eliminem
  rationale: A partícula negativa com o hifil de כרת expressa uma proibição dirigida a mais de uma pessoa. “Não eliminem” comunica naturalmente a ideia causativa de levar o grupo ao desaparecimento, sem explicitar o mecanismo.
- source_word: שֵׁבֶט
  choice: tribo
  rationale: No contexto genealógico, designa um agrupamento dentro de Levi; “tribo” preserva a formulação hebraica, embora “clã” também seja possível.
- source_word: מִשְׁפְּחֹת
  choice: famílias
  rationale: O plural em estado construto indica os grupos familiares que compõem a linhagem coatita. “Famílias” é claro e próximo da forma hebraica.
- source_word: הַקְּהָתִי
  choice: dos coatitas
  rationale: O gentílico singular hebraico tem sentido coletivo. Em português, o plural “coatitas” exprime esse grupo com naturalidade.
- source_word: מִתּוֹךְ
  choice: do meio de
  rationale: Expressa retirada ou desaparecimento de dentro de um grupo maior, conservando a relação dos coatitas com os levitas.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Forma portuguesa tradicional e amplamente reconhecida para o nome do grupo tribal.
theological_decisions:
- issue: Sentido da proibição sobre o destino dos coatitas
  choice: Uma ordem para não causar a eliminação do grupo coatita do meio dos levitas.
  alternative: Uma ordem geral para não destruir o clã coatita.
  rationale: O versículo não especifica por si só como essa eliminação ocorreria; o contexto seguinte a relaciona ao perigo de morte no serviço das coisas santíssimas. A tradução mantém a proibição ampla e não insere essa explicação contextual no texto.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. O plural verbal “não eliminem” preserva a pessoa e o número do hebraico. A construção algo incomum “tribo das famílias” foi mantida por refletir a sobreposição dos termos genealógicos no original, com alternativas esclarecidas em nota.
