base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: pt
  text: 'Dos trinta anos em diante, até os cinquenta anos, conte-os: todos os que vierem prestar serviço[a], para realizar o trabalho na tenda do encontro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumprir seu dever”. A expressão hebraica emprega metaforicamente linguagem de serviço militar para o serviço organizado na tenda do encontro.'
    reason: Registra a alternativa lexical e a coloração militar da construção hebraica sem transformar a tarefa levítica em combate literal.
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: Dos trinta anos para cima até os cinquenta anos
  rationale: Expressa de modo natural o intervalo etário indicado pelo idioma hebraico e conserva explicitamente a ideia de “para cima”.
- source_word: תִּפְקֹד אוֹתָם
  choice: conte-os
  rationale: No contexto do recenseamento dos levitas, פקד significa contar ou registrar. “Conte-os” é claro, direto e mantém o objeto pronominal do hebraico.
- source_word: כָּל הַבָּא
  choice: todos os que vierem
  rationale: O particípio substantivado com כָּל abrange cada pessoa que se apresenta para a função; o futuro do subjuntivo é idiomático em português.
- source_word: לִצְבֹא צָבָא
  choice: prestar serviço
  rationale: A construção cognata descreve o ingresso em serviço organizado. A formulação comunica o sentido cultual sem sugerir combate literal, enquanto a nota registra a coloração militar.
- source_word: לַעֲבֹד עֲבֹדָה
  choice: para realizar o trabalho
  rationale: Traduz naturalmente a construção cognata que enfatiza a execução do trabalho designado, preservando sua distinção em relação à expressão anterior.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução consagrada e semanticamente transparente do nome do santuário móvel como lugar de encontro determinado.
theological_decisions:
- issue: Se a linguagem de צבא deve ser traduzida com terminologia militar explícita
  choice: prestar serviço
  alternative: cumprir serviço militar; entrar em campanha
  rationale: O contexto trata das tarefas levíticas na tenda do encontro, não de combate. A tradução mantém o sentido de serviço organizado e a nota preserva a metáfora militar genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tenda do encontro” preserva a designação tradicional sem arcaísmo excessivo; “prestar serviço” é corrente e adequado ao contexto institucional e cultual.
