  yaml_path: translation/ot/numbers/004/017.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés e a Arão, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol de דבר faz a narrativa avançar. “Então ... falou” expressa naturalmente a sequência e mantém o sentido do ato de fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição אֶל assinala os destinatários da fala. Em português, a repetição diante do segundo nome pode ser omitida naturalmente sem perder a indicação de que ambos são destinatários diretos.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reproduz a fórmula hebraica que introduz o discurso direto, cujo conteúdo começa no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém a sequência narrativa e a fórmula introdutória do hebraico.
