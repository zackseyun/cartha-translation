  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: pt
  text: Esta é a tarefa dos filhos de Coate na Tenda do Encontro, quanto às coisas santíssimas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Santo dos Santos” ou “o lugar santíssimo”. Aqui, a expressão provavelmente se refere aos objetos mais sagrados, e não apenas ao recinto interior do santuário.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת
  choice: Este é
  rationale: O demonstrativo feminino singular introduz a oração; em português, a cópula implícita em hebraico precisa ser expressa.
- source_word: עֲבֹדַת
  choice: o serviço
  rationale: Neste contexto, o termo designa trabalho ou encargo cultual atribuído; “serviço” conserva seu caráter sagrado e formal.
- source_word: בְּנֵי קְהָת
  choice: dos filhos de Coate
  rationale: Preserva a expressão hebraica de parentesco e continua clara em português; no contexto, refere-se aos descendentes de Coate.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução natural da designação do santuário móvel, mantendo a preposição locativa do hebraico.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: às coisas santíssimas
  rationale: O contexto imediato trata dos objetos sagrados confiados aos coatitas. O plural explicita o referente contextual sem ocultar que a expressão hebraica também pode designar o espaço santíssimo.
theological_decisions:
- issue: Referente de קֹדֶשׁ הַקֳּדָשִׁים
  choice: As coisas ou objetos santíssimos confiados aos filhos de Coate
  alternative: O Santo dos Santos, isto é, o lugar santíssimo
  rationale: Números 4 descreve o cuidado e o transporte dos utensílios do santuário pelos coatitas, favorecendo aqui uma referência funcional aos objetos mais sagrados. A possível leitura espacial é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Tenda do encontro” mantém a designação bíblica de modo transparente; “relacionado às” liga naturalmente o serviço aos objetos santíssimos sem tratá-los como simples aposto.
