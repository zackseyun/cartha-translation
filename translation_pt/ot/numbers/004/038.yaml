lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: E os recenseados
  rationale: O particípio passivo substantivado indica os que foram contados ou registrados no recenseamento; a formulação preserva a continuidade sintática e não acrescenta explicitamente «homens», ausente neste versículo.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: dos filhos de Gérson
  rationale: Mantém a expressão genealógica hebraica tradicional e inteligível em português.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחוֹת designa as subdivisões de parentesco do grupo tribal; «clãs» é claro e distingue o termo das casas paternas.
- source_word: וּלְבֵית אֲבֹתָם
  choice: e segundo as suas casas paternas
  rationale: Reproduz a categoria social e genealógica בֵּית אָבוֹת sem reduzi-la simplesmente a «famílias».
