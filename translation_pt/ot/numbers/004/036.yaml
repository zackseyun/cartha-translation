lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: E ... foram
  rationale: O waw consecutivo faz avançar o relato e introduz o resultado do recenseamento; a construção copulativa simples é preservada de modo natural em português.
- source_word: פְקֻדֵיהֶם
  choice: os que foram contados dentre eles
  rationale: No contexto de recenseamento, a forma derivada de פקד designa os registrados ou contados. A tradução conserva o sentido passivo e não acrescenta explicitamente «homens», ausente neste versículo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה indica aqui as subdivisões familiares ou clânicas de Israel; «clãs» comunica com clareza essa organização social, e «segundo» representa adequadamente a classificação expressa por לְ.
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: dois mil setecentos e cinquenta
  rationale: Reproduz exatamente o total hebraico por extenso, em formulação portuguesa corrente.
