  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: pt
  text: Estes foram os recenseados das famílias dos filhos de Gérson[a], todos os que serviam na tenda do encontro, os quais Moisés e Arão contaram por ordem de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estes são os que foram contados dentre as famílias dos filhos de Gérson, todos os que serviam na tenda do encontro.”'
    reason: Alternativa lexical e sintática que preserva mais formalmente o valor de אֵלֶּה e פְקוּדֵי.
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: Estes foram os recenseados
  rationale: O demonstrativo introduz o resumo do recenseamento; o passado se ajusta ao contexto narrativo, e “recenseados” expressa פְקוּדֵי de modo claro e conciso.
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: das famílias dos filhos de Gérson
  rationale: Mantém a expressão hebraica de parentesco e a organização por famílias, sem substituí-la pelo gentílico “gersonitas”.
- source_word: כָּל הָעֹבֵד
  choice: todos os que serviam
  rationale: O particípio indica o conjunto dos que exerciam serviço; o imperfeito português comunica essa atividade contínua no contexto passado.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução transparente da designação cultual אֹהֶל מוֹעֵד; “encontro” preserva o sentido sem depender de terminologia eclesiástica tradicional.
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: os quais Moisés e Arão contaram
  rationale: Conserva a oração relativa e repete a ideia censitária da raiz פקד, com agentes expressos como no hebraico.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: Verte idiomaticamente a expressão hebraica “segundo a boca de” como autoridade de uma ordem, preservando o nome divino.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama; a transliteração “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a estrutura censitária do hebraico e usa “tenda do encontro” como designação transparente do santuário.
