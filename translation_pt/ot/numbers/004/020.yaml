  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: pt
  text: Mas eles não devem entrar para ver as coisas sagradas nem sequer por um instante[a], senão morrerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto as coisas sagradas estão sendo cobertas”. A expressão hebraica é difícil e pode indicar tanto um olhar muito breve quanto o momento em que os objetos são cobertos.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְלֹא
  choice: Mas ... não
  rationale: A conjunção com a negação dá continuidade à instrução em forma de proibição; “Mas” expressa naturalmente o contraste com o procedimento anterior.
- source_word: יָבֹאוּ
  choice: entrarão
  rationale: O verbo pode significar vir, ir ou entrar. Neste contexto, refere-se à entrada dos coatitas para ver os objetos sagrados, e o futuro com negação tem força proibitiva.
- source_word: לִרְאוֹת
  choice: para ver
  rationale: Tradução direta e natural do infinitivo, sem acrescentar necessariamente a ideia de contemplação intencional.
- source_word: כְבַלַּע
  choice: nem por um instante
  rationale: A expressão hebraica é difícil e idiomática. Esta opção comunica a leitura tradicional de duração mínima, enquanto a nota preserva a alternativa contextual de ver os objetos enquanto são cobertos.
- source_word: אֶת הַקֹּדֶשׁ
  choice: as coisas sagradas
  rationale: Embora a forma hebraica seja singular, o contexto aponta coletivamente para os utensílios e objetos sagrados do santuário.
- source_word: וָמֵתוּ
  choice: para que não morram
  rationale: A construção expressa a consequência fatal a ser evitada e mantém, em português natural, a força solene da advertência.
theological_decisions:
- issue: Referente de הַקֹּדֶשׁ
  choice: referência coletiva aos objetos sagrados
  alternative: o santuário ou aquilo que é santo em sentido abstrato
  rationale: O contexto imediato trata dos móveis e utensílios do tabernáculo que deveriam ser cobertos antes de serem transportados; a tradução coletiva evita transformar o termo em referência ao local.
- issue: Sentido de כְבַלַּע
  choice: por um instante
  alternative: enquanto as coisas sagradas estão sendo cobertas
  rationale: A expressão admite análise idiomática e contextual incerta. O texto principal adota a leitura temporal tradicional, e a nota registra a outra possibilidade sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Coisas sagradas” é acessível e preserva o valor coletivo do hebraico; a nota mantém a ambiguidade genuína de כְבַלַּע.
