  text: from thirty years old and upward[a], up to fifty years old, everyone who comes to perform the work of service and the service of carrying loads in the tent of meeting.
translation:
  language: pt
  text: dos trinta anos de idade para cima, até os cinquenta anos de idade, todos os que vêm para realizar o trabalho de serviço e o serviço de transportar cargas na Tenda do Encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o trabalho de serviço e o trabalho de transportar cargas”. O hebraico repete formas do mesmo substantivo, possivelmente para dar ênfase ou distinguir categorias de trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: desde os trinta anos de idade para cima
  rationale: A expressão estabelece o limite mínimo de idade. A tradução conserva a estrutura do hebraico e permanece clara em português corrente.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: até os cinquenta anos
  rationale: Expressa de modo natural o limite superior da faixa etária.
- source_word: כָּל הַבָּא
  choice: todos os que vêm
  rationale: Preserva o valor substantivado do particípio de בוא, sem introduzir ideias interpretativas como qualificação ou designação.
- source_word: לַעֲבֹד
  choice: para realizar
  rationale: Marca a finalidade da vinda e evita confundir o verbo com os substantivos repetidos derivados de עבד.
- source_word: עֲבֹדַת עֲבֹדָה
  choice: o trabalho do serviço
  rationale: Mantém os dois elementos da construção hebraica e sua repetição deliberada, embora a formulação seja incomum em português.
- source_word: וַעֲבֹדַת מַשָּׂא
  choice: e o serviço de transportar cargas
  rationale: מַשָּׂא designa aquilo que é carregado, uma carga ou peso; a formulação torna concreta a tarefa sem perder a linguagem de serviço.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na Tenda do Encontro
  rationale: Tradução tradicional e transparente da designação hebraica; a preposição 'na' representa בְּ e indica o âmbito do trabalho levítico.
