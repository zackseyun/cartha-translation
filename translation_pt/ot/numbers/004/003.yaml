  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: pt
  text: Desde os trinta anos até os cinquenta anos, todos os que vêm para o serviço[a], para realizar trabalho na tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “serviço” também pode significar “dever”, “tropa” ou “hoste”. Aqui se refere ao serviço levítico organizado.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: desde os trinta anos de idade para cima
  rationale: A construção idiomática בֶּן + número + שָׁנָה indica idade; וָמַעְלָה estabelece o limite inferior inclusivo. A formulação conserva a expressão ascendente do hebraico e permanece clara em português.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: até os cinquenta anos
  rationale: Expressa com clareza o limite superior da faixa etária sem acrescentar uma interpretação sobre inclusão ou exclusão além da fórmula hebraica.
- source_word: כָּל בָּא
  choice: todos os que entram
  rationale: O particípio בָּא descreve os que vêm ou entram para a função; “entram” preserva sua força verbal e se liga naturalmente ao serviço.
- source_word: לַצָּבָא
  choice: no serviço
  rationale: Embora צָבָא possa designar exército, hoste ou dever organizado, neste contexto refere-se ao serviço levítico estruturado, não ao combate militar.
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: para realizar o trabalho
  rationale: A construção infinitiva indica finalidade. “Realizar o trabalho” comunica de modo natural a execução da tarefa designada.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução direta e inteligível do nome do santuário אֹהֶל מוֹעֵד; a preposição “na” mantém o valor locativo do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe mantém o caráter regulamentar do versículo sem soar excessivamente literal. Emprega-se “tenda do encontro” como tradução transparente do hebraico, e não “tenda da reunião”, para destacar o encontro designado sem impor uma interpretação teológica adicional.
