  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: pt
  text: dos trinta anos de idade para cima, até os cinquenta anos de idade, todos os que se apresentavam para o serviço[a][b], para realizar o trabalho na Tenda do Encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os que ingressavam no serviço para realizar o trabalho”.'
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica traduzida por “serviço” também pode indicar dever organizado, ressaltando a estrutura do trabalho levítico.
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: dos trinta anos para cima
  rationale: Reproduz de modo natural o ponto inicial da faixa etária e preserva a expressão hebraica וָמַעְלָה, “para cima”.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: até os cinquenta anos
  rationale: Expressa com clareza o limite superior indicado por עַד.
- source_word: כָּל הַבָּא
  choice: todos os que vinham
  rationale: O particípio substantivado de בוא descreve cada pessoa que se apresentava ou ingressava nessa categoria de serviço; o plural é mais natural em português depois da indicação do grupo.
- source_word: לַצָּבָא
  choice: para o serviço
  rationale: Neste contexto levítico, צָבָא designa serviço organizado ou dever designado, não necessariamente atividade militar.
- source_word: לַעֲבֹדָה
  choice: para realizar o trabalho
  rationale: Distingue עֲבֹדָה do termo precedente e comunica sua função concreta sem recorrer ao eclesiasticamente carregado “ministério”.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na Tenda do Encontro
  rationale: Tradução transparente e tradicional da designação hebraica; “na” apresenta a tenda como esfera do trabalho.
