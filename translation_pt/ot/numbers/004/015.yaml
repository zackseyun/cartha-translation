source:
  edition: WLC
  text: וְ/כִלָּ֣ה אַֽהֲרֹן וּ֠/בָנָי/ו לְ/כַסֹּ֨ת אֶת הַ/קֹּ֜דֶשׁ וְ/אֶת כָּל כְּלֵ֣י הַ/קֹּדֶשׁ֮ בִּ/נְסֹ֣עַ הַֽ/מַּחֲנֶה֒ וְ/אַחֲרֵי כֵ֗ן יָבֹ֤אוּ בְנֵי קְהָת֙ לָ/שֵׂ֔את וְ/לֹֽא יִגְּע֥וּ אֶל הַ/קֹּ֖דֶשׁ וָ/מֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי קְהָ֖ת בְּ/אֹ֥הֶל מוֹעֵֽד־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: pt
  text: Quando Arão e seus filhos terminarem de cobrir o santuário e todos os utensílios do santuário, e o acampamento partir, os filhos de Coate virão depois para carregá-los. Mas não tocarão nas coisas sagradas, para que não morram.[a][b] Esta é a carga dos filhos de Coate na tenda do encontro.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tocarão no santuário”. O hebraico “o que é sagrado” pode referir-se coletivamente aos objetos sagrados ou, de modo mais amplo, ao santuário.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “e morrerão”. O hebraico declara a consequência diretamente.'
    reason: lexical_alternative
  - marker: c
    text: “Carga” também pode ter o sentido de encargo de transporte, isto é, aquilo que os filhos de Coate deviam carregar.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְכִלָּה ... לְכַסֹּת
  choice: terminarem de cobrir
  rationale: A construção expressa a conclusão da ação. O futuro do subjuntivo após “quando” é natural em português para a sequência procedural futura.
- source_word: הַקֹּדֶשׁ (primeira ocorrência)
  choice: o santuário
  rationale: Neste primeiro uso, o termo designa de modo abrangente aquilo que é sagrado e deve ser coberto; “santuário” preserva o sentido cultual sem restringi-lo a um único objeto.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: todos os utensílios do santuário
  rationale: כְּלֵי designa objetos, utensílios ou equipamentos. “Utensílios” é claro e adequado aos objetos usados no culto.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: quando o acampamento partir
  rationale: A construção infinitiva é temporal. “Partir” comunica naturalmente o início do deslocamento do acampamento.
- source_word: בְנֵי קְהָת
  choice: os filhos de Coate
  rationale: Mantém a forma genealógica literal do hebraico e o nome tradicionalmente reconhecível em português.
- source_word: לָשֵׂאת
  choice: para carregá-los
  rationale: O verbo indica a tarefa de transportar; o pronome retoma naturalmente os elementos sagrados já cobertos.
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: Mas não tocarão nas coisas sagradas
  rationale: No contexto imediato, o termo provavelmente se refere aos objetos sagrados a transportar. O plural em português torna natural esse valor coletivo, enquanto a nota preserva a alternativa “santuário”.
- source_word: וָמֵתוּ
  choice: para que não morram
  rationale: Expressa em português a força de advertência e a consequência fatal da transgressão. A nota registra a formulação hebraica mais direta.
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: Essa é a carga dos filhos de Coate
  rationale: מַשָּׂא pode indicar tanto a carga concreta quanto o encargo de transportá-la. “Carga” conserva essa relação com o transporte; o demonstrativo singular concorda naturalmente com “carga” em português.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Reproduz o valor locativo ou de esfera do hebraico e usa uma designação transparente para o local do encontro cultual.
theological_decisions:
- issue: Referente de הַקֹּדֶשׁ na proibição
  choice: as coisas sagradas
  alternative: o santuário
  rationale: Os objetos e utensílios cobertos são o referente contextual mais imediato da proibição de tocar. Como o substantivo hebraico também pode ser entendido de forma mais ampla como “o santuário”, a alternativa é mantida em nota.
- issue: Força de וָמֵתוּ
  choice: para que não morram
  alternative: e morrerão / e morrerão por isso
  rationale: A tradução principal comunica a função de advertência no contexto, sem negar que o hebraico enuncia diretamente a consequência; essa forma direta é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se “filhos de Coate” em vez de “coatitas” por proximidade à expressão genealógica hebraica. “Tenda do encontro” mantém de forma transparente o nome hebraico do santuário móvel. Todos os marcadores de nota aparecem no texto principal.
