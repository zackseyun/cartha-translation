  naturalness: O registro é adequado e compreensível. A reordenação da oração temporal melhora sensivelmente a fluidez em português moderno, sem perder a sequência procedimental do texto.
  terminology: «Arão», «Coate», «utensílios», «coisas sagradas» e «tenda do encontro» são escolhas adequadas. «Filhos de Coate» preserva legitimamente a formulação genealógica hebraica. A nota sobre a alternativa «santuário» preserva a ambiguidade de הַקֹּדֶשׁ.
