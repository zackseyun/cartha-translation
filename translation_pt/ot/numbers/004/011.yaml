  text: וְ/עַ֣ל מִזְבַּ֣ח הַ/זָּהָ֗ב יִפְרְשׂוּ֙ בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אֹת֔/וֹ בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/שָׂמ֖וּ אֶת בַּדָּֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/011.yaml
  text: And over the golden altar they shall spread a blue cloth[a], and cover it with a covering of fine leather, and put its poles in place.
translation:
  language: pt
  text: Sobre o altar de ouro estenderão um pano azul e o cobrirão com uma cobertura de couro de táhash[a]; colocarão no lugar as suas varas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O significado de táhash é incerto. Pode referir-se a um animal cuja pele era usada como cobertura; entre as identificações propostas estão o dugongo e outros animais de couro resistente.
    reason: Preserva a incerteza lexical de תָּחַשׁ sem atribuir ao termo uma identificação animal ou uma qualidade de couro não comprovadas.
lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: altar de ouro
  rationale: Reproduz naturalmente a construção hebraica, literalmente “altar do ouro”, sem alterar a referência ao altar revestido de ouro.
- source_word: יִפְרְשׂוּ
  choice: estenderão
  rationale: O verbo פרשׂ indica estender ou desdobrar algo sobre uma superfície; “estenderão” é claro e adequado à ação ritual.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: um pano azul
  rationale: בֶּגֶד pode designar pano ou tecido, e תְּכֵלֶת indica a cor azul ou azul-arroxeada característica dos tecidos do santuário. “Pano azul” é compreensível sem precisar o matiz antigo além da evidência.
- source_word: וְכִסּוּ אֹתוֹ
  choice: e o cobrirão
  rationale: O perfeito com waw prossegue a sequência de instruções; o pronome retoma o altar.
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: com uma cobertura de couro fino[a]
  rationale: מִכְסֶה significa “cobertura” e עוֹר, “pele/couro”. Como a identificação de תָּחַשׁ é incerta, “couro fino” evita afirmar como certo um animal específico, enquanto a nota preserva a dificuldade lexical.
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: depois colocarão no lugar as suas varas
  rationale: בַּדִּים são as varas usadas para transportar os utensílios do santuário. “Colocarão no lugar” expressa naturalmente a ação indicada no contexto.
