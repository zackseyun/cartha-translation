  text: וּ/פְקֻדַּ֞ת אֶלְעָזָ֣ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן שֶׁ֤מֶן הַ/מָּאוֹר֙ וּ/קְטֹ֣רֶת הַ/סַּמִּ֔ים וּ/מִנְחַ֥ת הַ/תָּמִ֖יד וְ/שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה פְּקֻדַּ֗ת כָּל הַ/מִּשְׁכָּן֙ וְ/כָל אֲשֶׁר בּ֔/וֹ בְּ/קֹ֖דֶשׁ וּ/בְ/כֵלָֽי/ו׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: pt
  text: Ficarão a cargo[a] de Eleazar, filho de Arão, o sacerdote, o óleo para a iluminação, o incenso aromático, a oferta regular de cereal[b] e o óleo da unção. Também ficarão a seu cargo todo o tabernáculo e tudo o que nele há, no santuário[c] e em seus utensílios[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode ser traduzido como “encargo”, “incumbência”, “responsabilidade” ou “supervisão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta contínua de cereal”. O hebraico indica uma oferta apresentada de modo recorrente, sem empregar aqui a palavra específica para “diária”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou “lugar santo”. Em hebraico, a expressão é literalmente locativa: “no santuário e em seus utensílios”. A ligação exata dessa frase final com o restante da oração é elíptica e pode ser entendida de mais de uma maneira.'
    reason: textual_ambiguity
  - marker: d
    text: Ou “objetos”, “vasos” ou “instrumentos”. O termo hebraico abrange diferentes peças do equipamento sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: responsabilidade
  rationale: O substantivo indica uma incumbência de supervisão confiada a Eleazar. “Responsabilidade” é natural em português e abrange tanto o encargo quanto a supervisão, sem introduzir uma função não expressa no hebraico.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: óleo para a iluminação
  rationale: Reproduz de modo claro a finalidade do óleo sem restringir explicitamente a referência à lâmpada ou ao candelabro.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: incenso aromático
  rationale: Expressa naturalmente o incenso composto de substâncias aromáticas.
- source_word: מִנְחַת הַתָּמִיד
  choice: oferta regular de cereal
  rationale: “Oferta de cereal” comunica o sentido cultual de מִנְחָה, enquanto “regular” preserva a recorrência de תָּמִיד sem especificar além do texto que ela era diária.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: óleo da unção
  rationale: Formulação corrente e precisa para o óleo usado na unção ritual.
- source_word: כָּל הַמִּשְׁכָּן
  choice: todo o tabernáculo
  rationale: “Tabernáculo” é a designação contextual adequada de מִשְׁכָּן, e “todo” mantém a abrangência de כָּל.
- source_word: בְּקֹדֶשׁ
  choice: pelo santuário
  rationale: No contexto, קֹדֶשׁ tem referência espacial e cultual. A preposição “por” integra a expressão à responsabilidade de Eleazar, evitando a leitura abstrata “em santidade”.
- source_word: וּבְכֵלָיו
  choice: e por seus utensílios
  rationale: כֵּלִים pode abranger vasos, instrumentos e demais objetos de uso sagrado. “Utensílios” é compreensível e mantém essa amplitude melhor que uma designação demasiadamente específica.
theological_decisions:
- issue: Função e repetição de פְקֻדַּת
  choice: Apresentar os itens sagrados sob a responsabilidade de Eleazar e repetir “responsabilidade” na afirmação mais abrangente sobre o tabernáculo.
  alternative: 'Manter uma única frase nominal e tomar a segunda ocorrência como uma aposição resumidora: “a responsabilidade por todo o tabernáculo...”'
  rationale: O hebraico é nominal e admite uma relação apositiva. A divisão em duas frases torna a construção clara em português, mas a repetição de “responsabilidade” conserva o movimento do texto e não transforma a incumbência em domínio ou propriedade.
- issue: Relação sintática de בְּקֹדֶשׁ וּבְכֵלָיו
  choice: Entender “pelo santuário e por seus utensílios” como explicação do âmbito da responsabilidade.
  alternative: 'Traduzir locativamente: “no santuário e em seus utensílios”, ou entender a expressão como vinculada a “tudo o que nele há”.'
  rationale: As preposições hebraicas permitem uma formulação locativa, mas, no encadeamento nominal do versículo, a tradução com “por” produz sentido coerente e natural. A nota registra a ambiguidade sintática e lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente reorganizada para evitar a construção pouco natural “a responsabilidade será o óleo...”, mantendo-se a repetição temática do hebraico e sua possível relação apositiva.
