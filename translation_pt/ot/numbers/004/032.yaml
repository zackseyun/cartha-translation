  text: וְ/עַמּוּדֵי֩ הֶ/חָצֵ֨ר סָבִ֜יב וְ/אַדְנֵי/הֶ֗ם וִֽ/יתֵדֹתָ/ם֙ וּ/מֵ֣יתְרֵי/הֶ֔ם לְ/כָל כְּלֵי/הֶ֔ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/בְ/שֵׁמֹ֣ת תִּפְקְד֔וּ אֶת כְּלֵ֖י מִשְׁמֶ֥רֶת מַשָּׂאָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: pt
  text: e as colunas ao redor do pátio, com suas bases, suas estacas e suas cordas, todos os seus equipamentos e tudo o que pertence ao seu serviço. Vocês designarão nominalmente os objetos pelos quais eles serão responsáveis no transporte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “os objetos do encargo da carga deles”. A expressão hebraica é condensada e se refere aos objetos pelos quais eles seriam responsáveis durante o transporte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: as colunas ao redor do pátio
  rationale: עַמּוּדִים designa colunas ou postes estruturais; חָצֵר é o pátio, e סָבִיב indica sua disposição ao redor do perímetro. A formulação é clara e preserva a relação espacial.
- source_word: אַדְנֵיהֶם
  choice: suas bases
  rationale: אֶדֶן, no contexto do tabernáculo, é a base ou encaixe que sustenta uma peça estrutural. “Bases” é natural e compreensível em português moderno.
- source_word: יְתֵדֹתָם
  choice: suas estacas
  rationale: יָתֵד designa a estaca ou pino usado para firmar uma estrutura. “Estacas” combina naturalmente com as cordas e comunica bem sua função.
- source_word: מֵיתְרֵיהֶם
  choice: suas cordas
  rationale: מֵיתָר refere-se a cordas usadas para sustentar ou firmar a estrutura.
- source_word: לְכָל כְּלֵיהֶם
  choice: todos os seus utensílios
  rationale: כְּלִים é um termo amplo para objetos, implementos ou equipamento. “Utensílios” mantém a referência aos diversos artigos associados às colunas, sem restringi-los a vasos cultuais.
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: e tudo o que pertence ao seu serviço
  rationale: עֲבֹדָה pode indicar trabalho, serviço ou dever designado. A formulação preserva a ideia do serviço levítico e se integra naturalmente à enumeração.
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: Vocês designarão nominalmente
  rationale: פקד, com בְשֵׁמוֹת, indica atribuição individual por nome, e não apenas contagem ou elaboração de uma lista.
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: os objetos que ficarão sob a responsabilidade deles no transporte
  rationale: A expressão hebraica reúne “objetos”, “responsabilidade/encargo” e “carga/transporte”. A tradução comunica a obrigação de transportar os artigos designados sem impor que “cada homem”, não expresso diretamente, apareça no texto.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por “pátio”, “bases”, “estacas” e “cordas”. O plural “vocês” representa naturalmente a forma verbal hebraica na segunda pessoa do plural. A construção final foi levemente explicitada para transmitir em português a relação comprimida entre objetos, responsabilidade e transporte.
