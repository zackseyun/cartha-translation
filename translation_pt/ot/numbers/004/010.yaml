  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: pt
  text: Eles a colocarão, com todos os seus utensílios, numa cobertura de couro[a] e a colocarão sobre a vara de transporte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תַּחַשׁ (táḥash) tem significado incerto; talvez se refira à pele de determinado animal ou a um tipo de couro durável. Traduções tradicionais propõem identificações como “pele de golfinho” ou semelhantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: colocarão
  rationale: O perfeito qal com waw, nesta sequência de instruções, expressa a próxima ação prescrita; o futuro do indicativo é natural em português.
- source_word: אֹתָהּ
  choice: a
  rationale: O pronome feminino singular retoma o candelabro mencionado no versículo anterior; o pronome oblíquo preserva essa referência de modo natural.
- source_word: כָּל כֵּלֶיהָ
  choice: todos os seus utensílios
  rationale: כֵּלִים designa objetos ou instrumentos; “utensílios” é claro e apropriado ao equipamento do santuário.
- source_word: אֶל מִכְסֵה
  choice: dentro de uma cobertura
  rationale: Após נתן, אֶל pode indicar colocação para dentro ou no interior de algo; a formulação comunica que os objetos seriam envolvidos pela cobertura.
- source_word: עוֹר תַּחַשׁ
  choice: couro resistente
  rationale: A identificação de תַּחַשׁ é incerta. “Couro resistente” evita atribuir o material a um animal específico e comunica sua provável função protetora, mantendo a incerteza em nota.
- source_word: עַל הַמּוֹט
  choice: sobre a armação de transporte
  rationale: מוֹט pode designar uma vara ou estrutura usada para transporte. No contexto do conjunto envolvido, “armação de transporte” produz sentido claro, embora “vara” permaneça uma alternativa lexical possível.
