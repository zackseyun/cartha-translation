  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'Yahweh[a] falou a Moisés e a Arão, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; uma forma portuguesa alternativa é “Javé”.'
    reason: Esclarece a forma hebraica do nome divino e registra uma forma portuguesa alternativa sem caracterizá-la imprecisamente como transliteração direta.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O imperfeito consecutivo de דבר introduz a fala divina na narrativa; “falou” é natural e preserva a distinção em relação à fórmula seguinte לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A repetição hebraica da preposição identifica claramente os dois destinatários. Em português, uma única preposição antes dos nomes coordenados transmite isso com naturalidade, sem perda de sentido.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz o conteúdo do discurso e corresponde ao tom narrativo formal do contexto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o preserva por transliteração, sem o substituir pelo título tradicional “SENHOR”; “Javé” é uma forma portuguesa difundida, indicada em nota.
translation_notes:
  register: Português moderno, claro e digno. A construção “falou... dizendo” conserva a fórmula hebraica, embora seja mais solene do que a conversação cotidiana. O marcador da nota foi colocado junto de “Yahweh”, o termo ao qual a nota se refere.
