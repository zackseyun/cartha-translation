base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: pt
  text: Por ordem de Yahweh, foram recenseados por meio de Moisés[a], cada homem conforme seu serviço e sua carga; e sua incumbência[b] foi conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela mão de Moisés”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico desta expressão é difícil. Também pode ser entendido como “os registrados por ele”, “sua designação” ou “sua responsabilidade”.
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: Por ordem de Yahweh
  rationale: A expressão idiomática significa literalmente “segundo a boca de Yahweh”, mas aqui indica que o recenseamento foi realizado por sua ordem.
- source_word: פָּקַד אֹתָם
  choice: eles foram recenseados
  rationale: No contexto de Números 4, פקד designa o registro ou recenseamento dos levitas aptos para o serviço, embora também possa ter sentidos como designar ou convocar.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: O idioma “pela mão de Moisés” expressa mediação ou agência; a formulação escolhida é natural em português e mantém esse sentido.
- source_word: אִישׁ אִישׁ
  choice: cada homem
  rationale: A repetição distributiva indica que cada homem foi considerado individualmente.
- source_word: עַל עֲבֹדָתוֹ
  choice: conforme o seu serviço
  rationale: עֲבֹדָה refere-se ao trabalho ou dever cultual atribuído a cada levita.
- source_word: וְעַל מַשָּׂאוֹ
  choice: e a carga que devia levar
  rationale: מַשָּׂא é a carga transportada; a explicitação verbal produz português natural e deixa claro o sentido concreto no transporte do tabernáculo.
- source_word: וּפְקֻדָיו
  choice: assim foram registrados sob a direção dele
  rationale: A forma derivada de פקד é difícil e pode indicar os registrados por Moisés, seu registro ou sua incumbência. A escolha retoma o recenseamento e entende o sufixo como referência à atuação de Moisés, sem transformar o termo em uma designação individual certa.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: Neste contexto, אֲשֶׁר funciona naturalmente com valor conformativo, resumindo que o procedimento correspondeu à ordem divina dada a Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado como nome próprio, em vez de ser substituído por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama; “Yahweh” preserva sua função de nome pessoal sem substituir o termo por um título.
- issue: Sentido administrativo de פקד neste contexto
  choice: recensear/registrar
  alternative: designar; convocar
  rationale: O capítulo trata da contagem dos levitas aptos e de seus deveres. A tradução mantém esse enquadramento administrativo, sem negar a associação contextual com a atribuição de tarefas.
- issue: Interpretação de וּפְקֻדָיו
  choice: retomada do registro sob a direção de Moisés
  alternative: sua incumbência; os registrados por ele; sua designação
  rationale: A forma e a sintaxe admitem mais de uma análise. O texto principal segue a retomada do recenseamento, enquanto a nota conserva as alternativas reais sem decidir uma questão teológica por meio da tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluente para leitores brasileiros. “Recenseados” e “registrados” preservam o contexto administrativo; “a carga que devia levar” torna concreto o dever de transporte. As duas ocorrências de Yahweh mantêm o nome divino.
