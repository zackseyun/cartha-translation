base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: pt
  text: 'E esta é a responsabilidade[a] deles quanto ao que devem carregar em todo o seu serviço na tenda do encontro: as armações[b] do tabernáculo, suas travessas, suas colunas e suas bases[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encargo”. O termo hebraico enfatiza uma responsabilidade atribuída.
    reason: lexical_alternative
  - marker: b
    text: Ou “tábuas do tabernáculo”. O termo hebraico designa peças estruturais que também podem ser descritas como tábuas ou pranchas.
    reason: lexical_alternative
  - marker: c
    text: Ou “encaixes”, termo mais técnico para as peças de fundação nas quais se fixavam partes da estrutura do tabernáculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: E esta é
  rationale: Preserva tanto a ligação com o contexto anterior quanto a forma hebraica de introduzir a especificação seguinte.
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: a responsabilidade deles quanto ao que deverão carregar
  rationale: Expressa de modo natural a responsabilidade atribuída e mantém o sentido concreto de transporte de מַשָּׂא, sem sugerir apenas um fardo abstrato.
- source_word: לְכָל עֲבֹדָתָם
  choice: em todo o seu serviço
  rationale: Mantém a abrangência da expressão e a nuance de serviço relacionado ao santuário.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução clara e tradicional da designação do santuário, compreensível no português moderno.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: as armações do tabernáculo
  rationale: Comunica a função estrutural das peças; o termo hebraico também pode ser entendido mais concretamente como tábuas ou pranchas.
- source_word: וּבְרִיחָיו
  choice: suas travessas
  rationale: Indica as barras horizontais empregadas para unir ou firmar as peças estruturais do tabernáculo.
- source_word: וְעַמּוּדָיו
  choice: suas colunas
  rationale: Designa com naturalidade os suportes verticais da estrutura.
- source_word: וַאֲדָנָיו
  choice: suas bases
  rationale: É uma designação clara para as peças de fundação nas quais se encaixavam elementos estruturais; evita tecnicismo desnecessário no texto principal.
