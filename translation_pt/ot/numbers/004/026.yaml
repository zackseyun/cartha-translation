revisions:
- from: as cortinas do pátio, a cortina da entrada do portão do pátio que fica ao redor do tabernáculo e do altar, as suas cordas[a], todos os utensílios usados no serviço deles e tudo o que deve ser feito com eles[b]. Assim eles prestarão serviço.
  to: as cortinas do pátio que circunda o tabernáculo e o altar, a cortina da entrada do portão desse pátio, as suas cordas[a], todos os utensílios para o serviço deles e tudo o que deve ser feito com eles[b]; e eles prestarão serviço.
  rationale: A revisão elimina a inferência não expressa por «Assim», esclarece que o pátio é o elemento que circunda o tabernáculo e o altar e aproxima «utensílios para o serviço deles» da construção hebraica. Mantém-se, em nota, a ambiguidade de לָהֶם.
