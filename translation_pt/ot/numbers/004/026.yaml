source:
  edition: WLC
  text: וְ/אֵת֩ קַלְעֵ֨י הֶֽ/חָצֵ֜ר וְ/אֶת מָסַ֣ךְ פֶּ֣תַח שַׁ֣עַר הֶ/חָצֵ֗ר אֲשֶׁ֨ר עַל הַ/מִּשְׁכָּ֤ן וְ/עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב וְ/אֵת֙ מֵֽיתְרֵי/הֶ֔ם וְ/אֶֽת כָּל כְּלֵ֖י עֲבֹדָתָ֑/ם וְ/אֵ֨ת כָּל אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָ/הֶ֖ם וְ/עָבָֽדוּ־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: pt
  text: as cortinas do pátio que circunda o tabernáculo e o altar, a cortina da entrada do portão desse pátio, as suas cordas[a], todos os utensílios para o serviço deles e tudo o que deve ser feito com eles[b]; e eles prestarão serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cordões”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tudo o que deve ser feito para eles”. O hebraico pode referir-se tanto às tarefas realizadas com esses objetos quanto às tarefas feitas para eles durante o serviço.
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: cortinas
  rationale: Designa os tecidos que formavam o fechamento do pátio; “cortinas” é claro e natural em português.
- source_word: חָצֵר
  choice: pátio
  rationale: Refere-se à área externa cercada do santuário; “pátio” é corrente e amplamente compreensível.
- source_word: מָסַךְ
  choice: cortina
  rationale: Neste contexto, indica o tecido que fechava a entrada; “cortina” comunica melhor sua natureza material e função.
- source_word: פֶּתַח שַׁעַר
  choice: entrada do portão
  rationale: Preserva os dois elementos da cadeia hebraica sem produzir uma formulação excessivamente pesada.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: que fica ao redor do tabernáculo e do altar
  rationale: Expressa de modo natural a relação espacial do pátio com o tabernáculo e o altar, preservando סָבִיב.
- source_word: מֵיתְרֵיהֶם
  choice: as suas cordas
  rationale: “Cordas” é um equivalente claro para os elementos de fixação dos tecidos; “cordões” permanece possível.
- source_word: כְּלֵי עֲבֹדָתָם
  choice: todos os utensílios usados no serviço deles
  rationale: “Utensílios” abrange os objetos e implementos, enquanto “serviço” conserva o sentido laboral e cultual de עֲבֹדָה.
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: tudo o que deve ser feito com eles
  rationale: Representa a construção passiva e entende לָהֶם como referente às tarefas realizadas com os objetos, sem ocultar a alternativa possível.
- source_word: וְעָבָדוּ
  choice: Assim eles prestarão serviço
  rationale: “Prestar serviço” conserva a nuance de dever atribuído aos meraritas; “assim” liga a cláusula à lista de responsabilidades sem acrescentar conteúdo teológico.
theological_decisions:
- issue: Referência de לָהֶם em כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: com eles
  alternative: para eles
  rationale: O contexto favorece tarefas executadas com os objetos enumerados, mas a construção hebraica também permite entender tarefas feitas para eles; a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com terminologia concreta do santuário. A coordenação da lista foi mantida, mas com omissão natural de conjunções repetitivas em português. “Tabernáculo” foi preservado por ser termo bíblico estabelecido; a conclusão foi formulada como “Assim eles prestarão serviço” para soar natural sem perder a sequência do hebraico.
