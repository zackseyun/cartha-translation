  text: נָשֹׂ֗א אֶת רֹ֛אשׁ בְּנֵ֥י גֵרְשׁ֖וֹן גַּם הֵ֑ם לְ/בֵ֥ית אֲבֹתָ֖/ם לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/022.yaml
  text: Take a census of the sons of Gershon also[a], by their fathers' houses, by their clans.
translation:
  language: pt
  text: Faça também o recenseamento[a] dos filhos de Gérson, segundo suas casas paternas, segundo seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “levante a cabeça dos filhos de Gérson”; essa expressão significa contá-los ou fazer o recenseamento deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: Faça o recenseamento
  rationale: A expressão hebraica significa literalmente “levantar a cabeça”, mas funciona aqui como idioma administrativo para contar ou recensear. A tradução comunica naturalmente o sentido e mantém a força imperativa.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: os filhos de Gérson
  rationale: Preserva a construção genealógica explícita do hebraico, em harmonia com as referências seguintes à linhagem e aos clãs.
- source_word: גַּם הֵם
  choice: também
  rationale: Indica que os filhos de Gérson devem ser incluídos no recenseamento, assim como o grupo mencionado anteriormente. Em português, “também” expressa essa inclusão com naturalidade.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo suas casas paternas
  rationale: “Casas paternas” designa as unidades de parentesco organizadas pela linhagem ancestral masculina e evita a possível confusão de “casas de seus pais” com residências particulares.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo seus clãs
  rationale: No contexto tribal e censitário, מִשְׁפָּחָה indica uma subdivisão ampla de parentesco, não apenas a família nuclear moderna; “clãs” representa melhor essa estrutura social.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia genealógica adequada ao contexto censitário. A repetição de “segundo” conserva o paralelismo estrutural do hebraico.
