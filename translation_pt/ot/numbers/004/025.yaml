  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: pt
  text: Levarão as cortinas do tabernáculo, a tenda do encontro com a sua cobertura, a cobertura de couro de táhax[a] que fica por cima dela e a cortina da entrada da tenda do encontro,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תַּחַשׁ (táhax) designa um material ou couro cuja identificação é incerta. Traduções tradicionais incluem “pele de texugo”, enquanto outras mantêm a transliteração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Levarão
  rationale: No contexto do transporte dos componentes do santuário, נשׂא significa carregar ou transportar; “levarão” é natural em português e mantém o valor futuro/injuntivo da forma verbal.
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: as cortinas do tabernáculo
  rationale: יְרִיעֹת designa os grandes painéis ou cortinas de tecido, e “tabernáculo” preserva a terminologia tradicional e reconhecível para מִשְׁכָּן.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução direta que preserva tanto a estrutura física, “tenda”, quanto a função indicada por מוֹעֵד, o encontro designado.
- source_word: מִכְסֵהוּ
  choice: a sua cobertura
  rationale: O sufixo pronominal remete à tenda; a formulação não especifica indevidamente qual camada é mencionada.
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: a cobertura de couro de táhax
  rationale: A identificação de תַּחַשׁ é incerta. A transliteração preserva essa incerteza, enquanto “couro” explicita que se trata do material de uma cobertura sem atribuí-lo a uma espécie não comprovada.
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: que fica por cima dela
  rationale: Expressa em português natural a posição superior da cobertura, evitando a redundância pouco idiomática de uma reprodução palavra por palavra.
- source_word: מָסַךְ פֶּתַח
  choice: a cortina da entrada
  rationale: מָסָךְ é uma peça de tecido que fecha ou resguarda a entrada; “cortina” é claro e adequado ao contexto do tabernáculo.
