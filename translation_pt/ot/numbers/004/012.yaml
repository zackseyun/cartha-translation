base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: pt
  text: Depois, pegarão todos os utensílios do serviço com os quais servem no santuário, os colocarão em um pano azul, os cobrirão com uma cobertura de couro fino[a] e os colocarão sobre a vara de transporte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico תָּחַשׁ (táhash) é incerto; pode indicar a pele de determinado animal ou um tipo de couro fino ou resistente.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sobre a barra”. O hebraico emprega o singular “vara” ou “barra”, possivelmente em referência a um elemento do aparato de transporte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Depois, pegarão
  rationale: O perfeito consecutivo introduz a ação seguinte nas instruções. “Depois” expressa a progressão do procedimento, e o futuro mantém o caráter prescritivo da sequência.
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: todos os utensílios do serviço
  rationale: כְּלִי designa utensílios, objetos ou recipientes; הַשָּׁרֵת especifica sua função no serviço sagrado. A formulação é clara e preserva essa relação.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: com os quais servem
  rationale: שרת descreve aqui o serviço ritual realizado com esses objetos. “Servem” é corrente e mantém a ligação instrumental indicada por בָם.
- source_word: בַּקֹּדֶשׁ
  choice: no santuário
  rationale: A expressão significa literalmente “no lugar santo” ou “no âmbito sagrado”. Neste contexto, “santuário” comunica naturalmente a área sagrada em que os utensílios eram usados, sem restringi-la necessariamente ao compartimento interior.
- source_word: בֶּגֶד תְּכֵלֶת
  choice: um pano azul
  rationale: בֶּגֶד pode designar tecido, pano ou veste; no contexto de acondicionamento, “pano” é o termo mais natural. תְּכֵלֶת indica o tecido ou cor azul característica dos materiais do tabernáculo.
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: uma cobertura de couro fino
  rationale: A identificação de תָּחַשׁ é incerta. “Couro fino” oferece uma descrição funcional inteligível sem adotar uma identificação zoológica especulativa; a incerteza é explicitada em nota.
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: e os colocarão sobre a armação de transporte
  rationale: מוֹט, no singular, pode significar vara ou barra de transporte. “Armação de transporte” expressa a provável função do objeto no contexto e evita sugerir certeza indevida de que vários utensílios eram postos literalmente sobre uma única vara; a alternativa literal consta em nota.
theological_decisions:
- issue: Extensão espacial de בַּקֹּדֶשׁ
  choice: no santuário
  alternative: no lugar santo
  rationale: “Santuário” preserva a referência geral ao espaço sagrado sem identificar de modo categórico o compartimento específico, evitando resolver além do texto uma possível ambiguidade cultual.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com vocabulário compreensível em âmbito internacional. A sequência verbal foi mantida de forma clara e prescritiva, sem arcaísmos. As incertezas lexicais de תָּחַשׁ e מוֹט foram preservadas em notas.
