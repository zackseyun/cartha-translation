  language: pt
  text: dos trinta anos de idade em diante, até os cinquenta anos de idade, todos os que vêm para o serviço, para o trabalho na tenda do encontro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: desde os trinta anos de idade para cima
  rationale: A construção בֶּן + numeral + שָׁנָה indica idade; a formulação portuguesa expressa naturalmente o limite inferior inclusivo.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: até os cinquenta anos
  rationale: Expressa de modo claro e corrente o limite superior da faixa etária.
- source_word: כָּל הַבָּא לַצָּבָא
  choice: todos os que vêm prestar serviço
  rationale: Preserva o valor participial de בוא e traduz צָבָא, neste contexto levítico, como serviço organizado, sem sugerir indevidamente atividade militar.
- source_word: לַעֲבֹדָה
  choice: para o trabalho
  rationale: Mantém distinto o segundo termo referente ao trabalho, sem fundi-lo com צָבָא.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução direta e tradicionalmente inteligível da expressão cultual, com a preposição בְּ representada por 'na'.
