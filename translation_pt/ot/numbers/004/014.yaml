  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: pt
  text: 'Então colocarão sobre ele todos os seus utensílios com os quais prestam serviço nele: os braseiros, os garfos, as pás e as bacias — todos os utensílios do altar. Depois estenderão sobre ele uma cobertura de couro de táhax[a] e colocarão as suas varas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação do termo hebraico táhax, provavelmente o nome de um animal, é incerta. A expressão também tem sido traduzida como “couro fino”, “pele de cabra”, “pele de golfinho” ou, de modo mais geral, “couro resistente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: Então colocarão sobre ele
  rationale: Mantém a sequência das instruções e o sentido concreto de pôr os utensílios sobre o altar.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: “Utensílios” comunica de modo claro o conjunto de instrumentos usados no serviço do altar.
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: com os quais prestam serviço junto ao altar
  rationale: Preserva o sentido cultual de שרת; explicitar “altar” evita uma sequência pouco natural de pronomes e esclarece o referente sem alterar o conteúdo.
- source_word: הַמַּחְתֹּת
  choice: os braseiros
  rationale: Designa recipientes empregados para transportar brasas ou fogo, sem restringi-los indevidamente ao uso de incenso.
- source_word: הַמִּזְלָגֹת
  choice: os garfos
  rationale: Equivalente atual e direto para instrumentos em forma de garfo usados no altar.
- source_word: הַיָּעִים
  choice: as pás
  rationale: Termo natural para os instrumentos usados na remoção de cinzas.
- source_word: הַמִּזְרָקֹת
  choice: as bacias
  rationale: Expressa recipientes de uso ritual, inclusive para líquidos ou sangue, melhor que uma palavra de associação predominantemente doméstica.
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: todos os utensílios do altar
  rationale: Conserva a recapitulação enfática do hebraico e a consistência lexical com כֵּלָיו.
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: Depois estenderão sobre ele uma cobertura
  rationale: Mantém tanto a ação de estender quanto o substantivo “cobertura”, preservando a forma procedural da frase.
- source_word: עוֹר תַּחַשׁ
  choice: couro de táhax
  rationale: Como a identificação do animal תחש é incerta, a transliteração evita escolher sem fundamento entre espécies propostas; a nota registra a incerteza.
- source_word: וְשָׂמוּ בַדָּיו
  choice: e colocarão as suas varas no lugar
  rationale: “Varas” é claro para as peças usadas no transporte; “no lugar” expressa naturalmente que deveriam ser instaladas para o deslocamento.
