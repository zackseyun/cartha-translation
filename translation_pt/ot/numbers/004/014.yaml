  verdict: revise
  source_fidelity: A enumeração dos utensílios, a recapitulação e a cobertura correspondem bem ao hebraico. Contudo, «junto ao altar» enfraquece e desloca o referente de עָלָיו («nele/sobre ele»), que é o altar. «No lugar» em relação às varas é uma explicitação contextual possível, mas não é expressa pelo hebraico e pode ser omitida sem perda.
  naturalness: O texto é claro e tem registro apropriado. «Prestam serviço nele» é natural e conserva o valor cultual sem introduzir a relação espacial menos precisa de «junto ao altar».
  terminology: «Braseiros», «garfos», «pás», «bacias» e «varas» são escolhas adequadas. Manter «couro de táhax» com nota é uma solução prudente para a incerteza de תחש; a nota deve indicar que a identificação do termo/animal é incerta, sem apresentá-la como resolvida.
