base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: pt
  text: Quando o acampamento partir, Arão e seus filhos virão, retirarão o véu do anteparo e, com ele, cobrirão a arca do testemunho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, segundo a forma tradicional, «a arca da aliança». Aqui, porém, o hebraico diz «testemunho».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: virão
  rationale: Embora a forma verbal esteja no singular, o sujeito composto «Arão e seus filhos» e os verbos plurais seguintes indicam sentido coletivo e instrucional; o futuro expressa naturalmente a orientação em português.
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: Quando o acampamento partir
  rationale: A construção com infinitivo marca a circunstância temporal. «Partir» comunica de modo natural o início da jornada do acampamento.
- source_word: וְהוֹרִדוּ
  choice: retirarão
  rationale: No contexto da desmontagem e preparação do santuário para transporte, o verbo descreve tirar o véu de seu lugar; «retirarão» é claro sem acrescentar detalhes.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: o véu da cortina
  rationale: Mantém os dois termos hebraicos e a relação de construção entre eles. «Véu» preserva a especificidade cultual de פָּרֹכֶת, enquanto «cortina» representa o sentido de anteparo de מָסָךְ.
- source_word: וְכִסּוּ בָהּ
  choice: e, com ele, cobrirão
  rationale: Preserva o sentido básico de כסה, «cobrir», e torna explícito o valor instrumental do pronome feminino hebraico, cujo antecedente é o véu.
- source_word: אֲרֹן הָעֵדֻת
  choice: a arca do testemunho
  rationale: O hebraico traz עֵדוּת, «testemunho», e não בְּרִית, «aliança»; a tradução segue a expressão efetivamente presente no texto-fonte.
theological_decisions:
- issue: Tradução tradicional de אֲרֹן הָעֵדֻת
  choice: a arca do testemunho
  alternative: a arca da aliança
  rationale: A expressão hebraica deste versículo diz literalmente «arca do testemunho». A formulação tradicional «arca da aliança» é familiar, mas substituiria o substantivo empregado no texto e reduziria uma distinção lexical potencialmente significativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O futuro mantém o tom de instrução ritual. O marcador da nota foi colocado junto de «arca do testemunho», expressão à qual a nota se refere.
