  - severity: low
    issue: “Itamar, filho do sacerdote Arão” é menos direta do que a ordem da aposição hebraica.
    rationale: “Itamar, filho de Arão, o sacerdote” deixa mais claramente explícito que “o sacerdote” qualifica Arão e segue a estrutura da fonte.
