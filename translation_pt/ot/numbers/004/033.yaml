  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/033.yaml
  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: pt
  text: Este é o serviço dos clãs dos filhos de Merari para todo o seu serviço na tenda do encontro, sob a direção de Itamar, filho de Arão, o sacerdote.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “pela mão de Itamar”, expressão que indica supervisão ou direção administrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Este é o serviço
  rationale: O demonstrativo introduz uma declaração resumitiva; em português, acrescenta-se naturalmente o verbo de ligação. “Serviço” preserva o sentido cultual e administrativo de עֲבֹדָה.
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: dos clãs dos filhos de Merari
  rationale: “Clãs” expressa os agrupamentos genealógicos internos da tribo, enquanto “filhos de Merari” mantém a forma genealógica hebraica com sentido coletivo.
- source_word: לְכָל עֲבֹדָתָם
  choice: em todas as suas tarefas
  rationale: A expressão abrange a totalidade dos encargos atribuídos aos meraritas. “Tarefas” evita em português a repetição pouco natural de “serviço” sem perder o sentido contextual.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução transparente da designação cultual אֹהֶל מוֹעֵד, mantendo a localização ou esfera em que o serviço era realizado.
- source_word: בְּיַד
  choice: sob a direção de
  rationale: O hebraísmo literalmente significa “pela mão de”, mas neste contexto comunica supervisão ou direção administrativa.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Itamar, filho do sacerdote Arão
  rationale: A construção hebraica identifica Itamar por sua filiação; a ordem portuguesa deixa claro que Arão é o sacerdote.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A tradução mantém a terminologia levítica, mas usa “tarefas” na segunda ocorrência de עֲבֹדָה para evitar repetição rígida. O marcador da nota foi colocado após a oração a que se refere.
