  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: pt
  text: Todos os recenseados[a] que Moisés, Arão e os líderes de Israel contaram entre os levitas, segundo os seus clãs e as suas casas paternas[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os numerados» ou «os registrados». O hebraico emprega linguagem de recenseamento derivada do verbo פקד.
    reason: lexical_alternative
  - marker: b
    text: «Casas paternas» eram unidades familiares ancestrais dentro dos clãs.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Todos os recenseados
  rationale: O particípio passivo de פקד ocorre em contexto censitário. “Recenseados” expressa de modo natural e preciso as pessoas oficialmente contadas, sem acrescentar “homens”, que não aparece explicitamente aqui.
- source_word: אֲשֶׁר פָּקַד
  choice: que ... contaram
  rationale: Mantém a oração relativa e a repetição da raiz פקד, embora o português use naturalmente “recenseados” no particípio e “contaram” no verbo finito.
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: e os líderes de Israel
  rationale: נְשִׂיאִים designa chefes ou representantes tribais. “Líderes” é claro, atual e evita as conotações monárquicas de “príncipes”.
- source_word: אֶת הַלְוִיִּם
  choice: entre os levitas
  rationale: אֵת marca “os levitas” como objeto do recenseamento. Nesta construção portuguesa, “entre os levitas” identifica idiomaticamente o grupo do qual os recenseados faziam parte.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה indica aqui uma divisão de parentesco no interior da tribo; “clãs” preserva melhor esse nível organizacional do que o termo mais genérico “famílias”.
- source_word: וּלְבֵית אֲבֹתָם
  choice: e as suas casas paternas
  rationale: בֵּית אָבוֹת é uma expressão técnica de organização genealógica e doméstica. “Casas paternas” conserva a forma cultural do hebraico, com explicação em nota.
