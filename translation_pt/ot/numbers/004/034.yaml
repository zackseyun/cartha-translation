base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: pt
  text: Assim, Moisés, Arão e os líderes da comunidade contaram[a] os filhos de Coate[b], segundo seus clãs e suas casas paternas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recensearam” ou “registraram”. Neste contexto, o verbo hebraico refere-se à contagem de pessoas para o serviço.
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Coate” refere-se ao grupo de descendentes de Coate.
    reason: lexical_alternative
  - marker: c
    text: Ou “casas ancestrais”. “Casas paternas” é uma expressão tradicional israelita para unidades familiares ou divisões de parentesco ligadas aos antepassados.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: contaram
  rationale: Neste contexto censitário de Números 4, פקד indica contar ou registrar pessoas para o serviço, e não designá-las para um cargo.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: os líderes da comunidade
  rationale: נְשִׂיאִים designa os chefes reconhecidos do povo; 'líderes' é claro em português atual, e 'comunidade' expressa עֵדָה naturalmente neste contexto do deserto.
- source_word: בְּנֵי הַקְּהָתִי
  choice: os filhos de Coate
  rationale: Preserva o idioma genealógico explícito בְּנֵי e identifica o grupo como os descendentes de Coate, sem a forma menos transparente 'coatitas'.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Em contextos genealógicos e censitários, מִשְׁפָּחָה indica uma subdivisão de parentesco; 'clãs' distingue esse nível das casas paternas.
- source_word: וּלְבֵית אֲבֹתָם
  choice: e segundo as suas casas paternas
  rationale: Mantém o termo técnico israelita בֵית אָבוֹת e sua distinção em relação aos clãs, com formulação compreensível em português.
