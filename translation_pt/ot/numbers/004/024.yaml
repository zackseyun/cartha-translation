  text: זֹ֣את עֲבֹדַ֔ת מִשְׁפְּחֹ֖ת הַ/גֵּרְשֻׁנִּ֑י לַ/עֲבֹ֖ד וּ/לְ/מַשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: pt
  text: 'Este é o serviço das famílias dos gersonitas: servir e transportar cargas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servir e carregar fardos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Este é
  rationale: O demonstrativo feminino singular introduz uma oração nominal; em português, a cópula explícita produz uma frase natural.
- source_word: עֲבֹדַת
  choice: o serviço
  rationale: עֲבֹדָה pode indicar serviço, trabalho ou tarefa; “serviço” se ajusta ao contexto levítico sem restringir o termo ao trabalho braçal.
- source_word: מִשְׁפְּחֹת
  choice: das famílias
  rationale: O plural construto designa os agrupamentos familiares dos descendentes de Gérson; “famílias” é claro e próximo da forma hebraica.
- source_word: הַגֵּרְשֻׁנִּי
  choice: dos gersonitas
  rationale: O gentílico coletivo refere-se aos descendentes de Gérson; o plural é idiomático depois de “famílias”.
- source_word: לַעֲבֹד
  choice: servir
  rationale: O infinitivo com ל expressa função ou finalidade. “Servir” conserva a relação lexical com “serviço” e soa natural na enumeração.
- source_word: וּלְמַשָּׂא
  choice: e transportar cargas
  rationale: מַשָּׂא pode denotar carga, fardo ou aquilo que é levado. No contexto das tarefas do tabernáculo, “transportar cargas” comunica claramente a atividade sem determinar quais objetos são transportados.
