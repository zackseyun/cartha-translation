base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: pt
  text: Todo o serviço dos filhos de Gérson será realizado sob as ordens de Arão e de seus filhos[a], em tudo o que carregam e em todo o seu serviço. Vocês lhes designarão, como encargo[b], todas as suas cargas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «sobre a boca de Arão e de seus filhos»; expressão hebraica que significa agir conforme suas ordens ou instruções.
    reason: lexical_alternative
  - marker: b
    text: Ou «como responsabilidade». O termo hebraico pode indicar uma responsabilidade ou obrigação atribuída.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: sob as ordens de
  rationale: O idioma hebraico significa literalmente «sobre a boca de» e indica que o serviço é realizado conforme as ordens ou instruções de alguém. A formulação escolhida é natural em português e preserva o sentido de autoridade.
- source_word: תִּהְיֶה
  choice: estará
  rationale: O futuro do verbo copulativo se ajusta à instrução administrativa e mantém seu caráter normativo sem recorrer a uma construção excessivamente solene.
- source_word: עֲבֹדַת
  choice: serviço
  rationale: No contexto levítico e do tabernáculo, o termo designa o trabalho ou serviço atribuído aos levitas. «Serviço» abrange tanto a atividade prática quanto a responsabilidade cultual.
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: os filhos de Gérson
  rationale: A expressão identifica os descendentes do clã de Gérson. «Filhos de Gérson» preserva a linguagem genealógica hebraica e é uma designação bíblica clara e natural em português.
- source_word: לְכָל מַשָּׂאָם
  choice: quanto a tudo o que tiverem de carregar
  rationale: מַשָּׂא denota aqui concretamente a carga transportada no deslocamento do tabernáculo. A formulação verbal comunica com clareza o escopo da supervisão e evita a possível leitura metafórica de «cargas».
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: e a todo o seu serviço
  rationale: Mantém «serviço» para עֲבֹדָה e expressa o segundo âmbito da direção exercida por Arão e seus filhos.
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: Vocês lhes atribuirão
  rationale: Neste contexto, פקד indica atribuir ou confiar uma responsabilidade. O plural «vocês» reproduz a forma verbal hebraica, cujo referente imediato inclui Arão e seus filhos.
- source_word: בְּמִשְׁמֶרֶת
  choice: como responsabilidade
  rationale: מִשְׁמֶרֶת pode indicar encargo, obrigação confiada ou responsabilidade de guarda. «Como responsabilidade» é corrente e conserva a ideia de uma incumbência formal.
- source_word: אֵת כָּל מַשָּׂאָם
  choice: tudo o que deverão carregar
  rationale: Reproduz a repetição do hebraico e torna explícito, sem mudar o sentido, que o objeto atribuído é o conjunto dos itens sob responsabilidade de transporte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a repetição de «serviço» e do conteúdo a transportar, evita linguagem denominacional e explicita em construção natural o sentido concreto de מַשָּׂא. O plural «vocês» reflete o verbo hebraico plural e se refere, no contexto, a Arão e seus filhos.
