review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a autoridade de Arão e de seus filhos sobre o serviço dos gersonitas e a atribuição das cargas. Contudo, «quanto a tudo o que tiverem de carregar» introduz uma nuance de obrigação futura que não está expressa no substantivo hebraico «suas cargas», e a construção da primeira frase pode ser mais direta e idiomática.
  naturalness: «Todo o serviço ... estará sob as ordens ..., quanto a ...» é compreensível, mas pouco fluente. «Será realizado sob as ordens ... em tudo o que carregam e em todo o seu serviço» mantém o paralelismo e soa mais natural em português moderno.
  terminology: '«Filhos de Gérson», «Arão», «serviço» e «encargo» são adequados. «Cargas» preserva o substantivo concreto hebraico e, neste contexto de transporte do tabernáculo, não cria ambiguidade relevante. A nota a deve corrigir sua alegação de literalidade: על־פי é literalmente «sobre a boca de», não «segundo a boca de».'
  issues:
