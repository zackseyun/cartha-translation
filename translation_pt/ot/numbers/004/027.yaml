    issue: A primeira oração é algo truncada e «tiverem de carregar» é mais interpretativo do que o hebraico.
    rationale: O texto hebraico usa «todas as suas cargas», sem a perífrase de obrigação. Uma formulação com «em tudo o que carregam» preserva a referência concreta e melhora a fluência.
  - severity: low
    issue: A nota a chama «segundo a boca» de tradução literal.
    rationale: A expressão על־פי é literalmente «sobre a boca de»; «segundo» já é uma adaptação idiomática interpretativa.
