base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/039.yaml
  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: pt
  text: dos trinta anos para cima, até os cinquenta anos, todos os que vinham para o serviço, para o trabalho na tenda do encontro —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: dos trinta anos para cima
  rationale: Expressa de modo natural em português o limite mínimo de idade e preserva a estrutura ascendente do hebraico.
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: até os cinquenta anos
  rationale: Indica claramente o limite superior da faixa etária.
- source_word: כָּל הַבָּא
  choice: todos os que ingressavam
  rationale: O particípio de בוא pode significar vir ou entrar; no contexto do recenseamento para o serviço, “ingressavam” comunica a entrada no corpo de serviço sem impor sentido militar.
- source_word: לַצָּבָא
  choice: no serviço
  rationale: Embora צבא possa designar exército ou hoste, aqui se refere ao serviço organizado dos levitas; “serviço” é claro e apropriado ao contexto.
- source_word: לַעֲבֹדָה
  choice: para trabalhar
  rationale: Distingue עֲבֹדָה do צבא anterior e reproduz naturalmente a finalidade expressa pela preposição ל.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução transparente da designação cultual אֹהֶל מוֹעֵד, mantendo a preposição locativa.
