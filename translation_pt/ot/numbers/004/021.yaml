  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: A forma narrativa com waw consecutivo dá continuidade à sequência; “Então” expressa essa progressão com naturalidade, e “falou” representa adequadamente דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, em vez de substituí-lo por um título tradicional.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל introduz o destinatário da fala; em português, “falar a Moisés” é uma construção clara e digna.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória de discurso, os dois-pontos cumprem naturalmente em português a função de anunciar as palavras que seguem, evitando o pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título; “Jeová” reflete uma forma tradicional híbrida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português, e os dois-pontos introduzem o discurso que começa no versículo seguinte.
