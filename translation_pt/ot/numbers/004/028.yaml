source:
  edition: WLC
  text: זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹ֛ת בְּנֵ֥י הַ/גֵּרְשֻׁנִּ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד וּ/מִ֨שְׁמַרְתָּ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: pt
  text: Este é o serviço das famílias dos descendentes de Gérson na tenda do encontro. A responsabilidade deles[a] ficará sob a direção de Itamar[b], filho do sacerdote Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o encargo deles”; o termo hebraico pode indicar uma responsabilidade ou obrigação atribuída.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sob a mão de Itamar”, expressão que indica sua supervisão ou autoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲבֹדַת
  choice: Este é o serviço
  rationale: A formulação identifica a tarefa atribuída. “Serviço” expressa o trabalho organizado no santuário sem introduzir a conotação eclesiástica posterior que “ministério” poderia ter.
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: das famílias dos descendentes de Gérson
  rationale: “Famílias” conserva a organização genealógica, e “descendentes de Gérson” comunica em português natural o sentido coletivo da construção hebraica.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução consagrada e transparente; a preposição indica a esfera em que o serviço era realizado, não necessariamente apenas o interior da tenda.
- source_word: וּמִשְׁמַרְתָּם
  choice: A responsabilidade deles
  rationale: O substantivo designa um encargo ou obrigação atribuída. “Responsabilidade” é claro no português atual e mantém o caráter administrativo da tarefa.
- source_word: בְּיַד
  choice: sob a direção de
  rationale: A expressão significa literalmente “na/sob a mão de” e funciona aqui como idioma de supervisão ou autoridade. A tradução comunica diretamente esse sentido, enquanto a nota preserva a imagem hebraica.
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Itamar, filho do sacerdote Arão
  rationale: Mantém os nomes e a identificação genealógica; a colocação de “sacerdote” junto de Arão reflete naturalmente que o título hebraico qualifica Arão.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. A tradução usa equivalência ótima: preserva a estrutura de atribuição de tarefas, mas verte de modo idiomático a expressão hebraica “sob a mão de”.'
