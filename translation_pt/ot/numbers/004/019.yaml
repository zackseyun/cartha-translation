base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: pt
  text: 'Mas façam isto por eles, para que vivam e não morram quando se aproximarem das coisas santíssimas[a]: Arão e seus filhos virão e designarão cada homem[b] para o seu serviço e para a sua carga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do Santo dos Santos” ou “do lugar santíssimo”. Neste contexto, a expressão provavelmente se refere aos objetos sagrados de santidade máxima, e não ao recinto interior em si.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “homem por homem”, expressão distributiva que indica a designação individual do serviço e da carga de cada um.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: Mas façam isto por eles
  rationale: A conjunção introduz uma instrução em contraste com o perigo mencionado anteriormente; לָהֶם tem sentido benefactivo, isto é, algo feito em favor dos coatitas.
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: para que vivam e não morram
  rationale: A formulação comunica o resultado pretendido da medida ordenada e preserva o contraste enfático entre viver e morrer.
- source_word: בְּגִשְׁתָּם
  choice: quando se aproximarem
  rationale: A preposição ב com o infinitivo construto expressa circunstância temporal; “aproximarem” mantém também a nuance de aproximação cultual.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: as coisas santíssimas
  rationale: No contexto das responsabilidades de transporte dos coatitas, a expressão aponta mais naturalmente para os objetos de santidade máxima, sem excluir em nota a leitura espacial tradicional.
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: Arão e seus filhos virão
  rationale: Mantém a linguagem familiar concreta e o valor diretivo/futuro do imperfeito hebraico sem acrescentar ao verbo a ideia mais específica de entrar.
- source_word: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ
  choice: designarão cada homem
  rationale: O verbo, junto da expressão distributiva, descreve a colocação ou atribuição individual de cada levita à sua responsabilidade.
- source_word: עַל עֲבֹדָתוֹ וְאֶל מַשָּׂאוֹ
  choice: para o seu serviço e para a sua carga
  rationale: עֲבֹדָה indica o serviço ou dever atribuído, e מַשָּׂא designa concretamente a carga que cada homem devia transportar.
theological_decisions:
- issue: Referente de קֹדֶשׁ הַקֳּדָשִׁים
  choice: as coisas santíssimas
  alternative: o Santo dos Santos; o lugar santíssimo
  rationale: O contexto imediato trata dos objetos sagrados cobertos pelos sacerdotes e depois transportados pelos coatitas. A tradução principal reflete esse referente contextual, enquanto a nota preserva a ambiguidade formal da expressão.
- issue: Gênero de אִישׁ אִישׁ
  choice: cada homem
  alternative: cada um; cada pessoa
  rationale: A expressão refere-se individualmente aos levitas homens encarregados desse serviço; por isso, o gênero explícito do contexto é mantido.
