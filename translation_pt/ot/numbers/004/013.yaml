  yaml_path: translation/ot/numbers/004/013.yaml
  text: Then they shall remove the ashes from the altar and spread over it a purple cloth[a].
translation:
  language: pt
  text: Depois retirarão as cinzas do altar e estenderão sobre ele um pano púrpura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “limparão o altar” ou “retirarão do altar as cinzas impregnadas de gordura”. O verbo hebraico se refere especificamente à remoção do resíduo de cinzas do altar no contexto sacrificial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: retirarão as cinzas
  rationale: No piel, neste contexto ritual, דשׁן indica remover do altar o resíduo de cinzas, provavelmente impregnado de gordura. A expressão é natural e clara em português.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente padrão de מִזְבֵּחַ no contexto do santuário e dos sacrifícios.
- source_word: וּפָרְשׂוּ
  choice: e estenderão
  rationale: פרשׂ significa estender ou desdobrar; “estender” descreve naturalmente a colocação de um tecido sobre o altar.
- source_word: עָלָיו
  choice: sobre ele
  rationale: A preposição עַל com sufixo pronominal indica que o pano será colocado cobrindo o altar.
- source_word: בֶּגֶד
  choice: um pano
  rationale: Embora בגד frequentemente designe uma veste, aqui se refere a uma peça de tecido usada para cobrir um objeto sagrado.
- source_word: אַרְגָּמָן
  choice: roxo
  rationale: אַרְגָּמָן designa material tingido de púrpura; como בגד já expressa a ideia de tecido, “pano roxo” comunica o sentido sem especificação excessiva.
