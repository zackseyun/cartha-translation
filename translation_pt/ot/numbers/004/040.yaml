  text: Os que foram recenseados dentre eles, segundo os seus clãs e as suas casas paternas, foram dois mil seiscentos e trinta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: Neste contexto censitário, o verbo היה funciona como cópula em uma fórmula de totalização; “foram” é natural e preserva a estrutura do hebraico.
- source_word: פְּקֻדֵיהֶם
  choice: os que foram contados entre eles
  rationale: A forma deriva de פקד e designa os registrados ou recenseados. A expressão mantém a referência às pessoas contadas no grupo anteriormente mencionado, sem acrescentar “homens”, ausente neste versículo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Em contextos de recenseamento, מִשְׁפָּחָה indica uma subdivisão de parentesco; “clãs” comunica essa organização social com clareza.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo as suas casas paternas
  rationale: A expressão designa unidades genealógicas organizadas pela linhagem paterna. “Casas paternas” preserva a terminologia social do hebraico sem modernizá-la excessivamente.
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: dois mil seiscentos e trinta
  rationale: Tradução direta da sequência numérica em português contemporâneo.
