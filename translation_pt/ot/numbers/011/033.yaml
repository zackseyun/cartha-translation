  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: pt
  text: Enquanto a carne ainda estava entre os dentes deles[a], antes que fosse consumida, a ira de Yahweh se acendeu contra o povo, e Yahweh feriu o povo com uma praga extremamente grave.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “antes que fosse cortada”; isto é, antes que a carne fosse terminada ou consumida.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: a carne
  rationale: No contexto das codornizes usadas como alimento, בָּשָׂר designa carne animal; “carne” é a tradução natural em português.
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: ainda estava entre os dentes deles
  rationale: Preserva a imagem vívida do hebraico e expressa naturalmente a continuidade indicada por עוֹדֶנּוּ.
- source_word: טֶרֶם יִכָּרֵת
  choice: antes que fosse consumida
  rationale: טֶרֶם indica que a ação ainda não havia ocorrido. Embora יִכָּרֵת signifique literalmente “fosse cortada/eliminada”, neste contexto a expressão provavelmente indica que a carne ainda não havia sido terminada ou consumida; a alternativa literal é preservada em nota.
- source_word: וְאַף יְהוָה חָרָה
  choice: a ira de Yahweh se acendeu
  rationale: Mantém a metáfora hebraica da ira que arde, em formulação digna e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיַּךְ
  choice: feriu
  rationale: נכה, em contexto de juízo, significa golpear ou ferir; “feriu” é claro, vigoroso e natural em português.
- source_word: מַכָּה רַבָּה מְאֹד
  choice: uma praga extremamente grave
  rationale: מַכָּה pode designar uma praga ou aflição devastadora, e רַבָּה מְאֹד intensifica fortemente sua magnitude; a formulação comunica isso de modo natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Expressão antropopática da ira divina
  choice: a ira de Yahweh se acendeu contra o povo
  alternative: Yahweh ficou irado com o povo
  rationale: A opção escolhida conserva a metáfora explícita do hebraico, sem suavizar a descrição do juízo divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e a metáfora da ira acesa foram preservadas; a expressão obscura יִכָּרֵת recebeu tradução contextual no texto e alternativa mais literal em nota.
