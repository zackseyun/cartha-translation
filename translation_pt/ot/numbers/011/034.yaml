base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: pt
  text: E chamou aquele lugar de Quibrote-Hataavá[a], porque ali sepultaram o povo que tinha cobiçado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quibrote-Hataavá provavelmente significa “Sepulturas da Cobiça” ou “Sepulturas do Desejo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Por isso, chamou
  rationale: O wayyiqtol dá sequência à narrativa, enquanto o contexto mostra que o nome decorre do acontecimento anterior. O sujeito permanece implícito, como no hebraico, sem identificar expressamente quem deu o nome.
- source_word: אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: aquele lugar de
  rationale: A construção portuguesa natural “chamar aquele lugar de” comunica fielmente a fórmula hebraica de nomeação sem reproduzir de modo rígido “chamou o nome daquele lugar”.
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: Quibrote-Hataavá
  rationale: O topônimo é transliterado numa forma corrente e legível em português; seu provável significado é apresentado em nota.
- source_word: כִּי שָׁם
  choice: porque ali
  rationale: כִּי introduz a razão do nome, e שָׁם é vertido pelo locativo natural “ali”.
- source_word: קָבְרוּ
  choice: sepultaram
  rationale: Expressa diretamente o qal perfeito plural de קבר, em registro digno e corrente.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o substantivo coletivo hebraico e sua referência ao grupo de israelitas atingido pelo juízo.
- source_word: הַמִּתְאַוִּים
  choice: que se entregara à cobiça
  rationale: O particípio hitpael descreve os que se deixaram dominar por um desejo intenso. “Cobiça” preserva a conotação de desejo desordenado sem sugerir especificamente desejo sexual; o singular concorda naturalmente com o coletivo “povo”.
