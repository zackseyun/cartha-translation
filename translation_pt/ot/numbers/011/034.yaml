  - severity: low
    issue: «se entregara à cobiça»
    rationale: A expressão é interpretativamente um pouco mais forte do que o particípio «os que ansiavam/cobiçavam». «Tinham cobiçado» mantém a referência retrospectiva e é mais próximo da construção hebraica.
  revised_text: E chamou aquele lugar de Quibrote-Hataavá[a], porque ali sepultaram o povo que tinha cobiçado.
