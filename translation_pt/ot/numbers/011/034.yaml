- from: Por isso, chamou aquele lugar de Quibrote-Hataavá[a], porque ali sepultaram o povo que se entregara à cobiça.
  to: E chamou aquele lugar de Quibrote-Hataavá[a], porque ali sepultaram o povo que tinha cobiçado.
  rationale: A revisão substitui a inferência adicional «Por isso» pela coordenação narrativa «E» e torna a descrição dos que ansiavam mais diretamente correspondente ao particípio hebraico, preservando o sentido contextual de desejo desordenado. O topônimo permanece transliterado, e a nota mantém suas alternativas semânticas.
