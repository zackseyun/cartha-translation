base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: pt
  text: 'Mas Moisés disse: “Há seiscentos mil a pé entre o povo em cujo meio estou, e, ainda assim, tu disseste: ‘Eu lhes darei carne, e eles comerão durante um mês inteiro.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Moisés disse
  rationale: O waw consecutivo dá continuidade à narrativa, enquanto “Mas” expressa naturalmente o caráter de objeção da resposta de Moisés no contexto.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: soma seiscentos mil
  rationale: Reproduz diretamente o numeral; “soma” torna natural em português a construção cujo sujeito é “o povo”.
- source_word: רַגְלִי הָעָם
  choice: o povo ... soma seiscentos mil a pé
  rationale: Preserva a referência literal a “pé” sem restringir explicitamente o grupo a homens ou impor sentido exclusivamente militar.
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: no meio do qual estou
  rationale: Reflete de perto בְּקֶרֶב, “no meio de”, em formulação clara e digna.
- source_word: וְאַתָּה אָמַרְתָּ
  choice: e tu dizes
  rationale: O pronome explícito אַתָּה recebe destaque por meio de “tu”; o presente português comunica a relevância imediata da declaração divina recém-feita.
- source_word: בָּשָׂר
  choice: carne
  rationale: No contexto, designa carne animal como alimento; “carne” é o equivalente português corrente.
- source_word: אֶתֵּן לָהֶם
  choice: Eu lhes darei
  rationale: Expressa diretamente a intenção futura da primeira pessoa na fala citada.
- source_word: וְאָכְלוּ
  choice: e eles comerão
  rationale: Mantém a coordenação e o valor futuro do verbo, apresentando o resultado prometido.
- source_word: חֹדֶשׁ יָמִים
  choice: durante um mês inteiro
  rationale: Traduz naturalmente o idiomatismo hebraico literal “um mês de dias”, comunicando a ideia de um mês completo; a forma literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conserva a ênfase contrastiva em “tu” e mantém a ambiguidade de רַגְלִי no texto e na nota, sem impor uma leitura exclusivamente militar.
