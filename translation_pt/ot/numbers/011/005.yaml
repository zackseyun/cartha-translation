source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: pt
  text: Lembramo-nos dos peixes que comíamos de graça no Egito[a], dos pepinos, dos melões, dos alhos-porós, das cebolas e dos alhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livremente” ou “sem pagar nada”. Os que falam recordam o Egito da perspectiva de sua queixa, apesar de terem sido escravos ali.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: Lembramo-nos
  rationale: O perfeito qal na fala direta expressa uma lembrança presente; esta forma preserva o aspecto de recordação atual com registro digno e natural.
- source_word: הַדָּגָה
  choice: dos peixes
  rationale: O substantivo se refere coletivamente a peixes como alimento; o plural é a expressão mais natural em português.
- source_word: אֲשֶׁר נֹאכַל
  choice: que comíamos
  rationale: O yiqtol ocorre em contexto passado habitual; o imperfeito português comunica claramente a ação costumeira.
- source_word: בְּמִצְרַיִם
  choice: no Egito
  rationale: Tradução locativa direta.
- source_word: חִנָּם
  choice: de graça
  rationale: Expressão corrente e clara para algo obtido sem pagamento, preservando a perspectiva da queixa sem negar implicitamente a realidade da escravidão.
- source_word: הַקִּשֻּׁאִים
  choice: dos pepinos
  rationale: Identificação lexical padrão do produto.
- source_word: הָאֲבַטִּחִים
  choice: dos melões
  rationale: Mantém a identificação genérica e evita especificar uma espécie além do que o termo hebraico exige.
- source_word: הֶחָצִיר
  choice: dos alhos-porós
  rationale: No contexto desta lista de alimentos, a identificação tradicional como hortaliça é plausível e mais coerente do que 'erva' ou 'capim'.
- source_word: הַבְּצָלִים
  choice: das cebolas
  rationale: Equivalente lexical padrão.
- source_word: הַשּׁוּמִים
  choice: dos alhos
  rationale: Equivalente lexical padrão; em português, 'alho' é normalmente empregado como substantivo massivo, mas o plural acompanha naturalmente a enumeração dos alimentos.
theological_decisions:
- issue: Sentido de חִנָּם diante da escravidão de Israel no Egito
  choice: de graça
  alternative: livremente; sem pagar nada
  rationale: O texto relata a lembrança idealizada dos que se queixam, não uma avaliação objetiva da vida no Egito. A tradução direta conserva tanto a força retórica quanto a ironia contextual, sem inserir uma correção interpretativa no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O imperfeito 'comíamos' explicita o valor habitual do hebraico no contexto. A colocação pronominal em 'Lembramo-nos' mantém um registro bíblico moderadamente formal sem recorrer a linguagem arcaica.
