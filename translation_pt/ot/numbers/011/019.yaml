base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: pt
  text: Vocês comerão — não por um dia[a], nem por dois dias, nem por cinco dias, nem por dez dias, nem por vinte dias,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Não comereis por um dia, nem por dois dias, nem por cinco dias, nem por dez dias, nem por vinte dias.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: não... nem
  rationale: A negação repetida exclui sucessivamente cada duração; em português, «não... nem...» reproduz a progressão com naturalidade.
- source_word: יוֹם אֶחָד
  choice: um dia
  rationale: Preserva diretamente a expressão cardinal e a sequência numérica.
- source_word: תֹּאכְלוּ/ן
  choice: vocês comerão
  rationale: O imperfeito qal de segunda pessoa masculina plural tem sentido futuro no anúncio divino; «vocês» oferece ampla legibilidade brasileira.
- source_word: יוֹמָיִם
  choice: dois
  rationale: A forma dual significa «dois dias»; após «por um dia», a elipse de «dias» é natural em português.
- source_word: חֲמִשָּׁה יָמִים
  choice: cinco
  rationale: Mantém a sequência crescente, com elipse natural de «dias».
- source_word: עֲשָׂרָה יָמִים
  choice: dez
  rationale: Mantém literalmente o número e o desenvolvimento retórico.
- source_word: עֶשְׂרִים יוֹם
  choice: vinte
  rationale: Traduz o número de modo idiomático, entendendo-se «dias» pela construção precedente.
- source_word: וְ
  choice: nem
  rationale: Embora וְ normalmente seja «e», numa série de elementos negados o português idiomático pede «nem».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para a segunda pessoa plural e repetição de «nem» para conservar a força retórica da série hebraica. A vírgula final indica que a frase continua no versículo seguinte.
