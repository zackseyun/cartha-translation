base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: pt
  text: O maná era como semente de coentro, e sua aparência era como a do bdélio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O bdélio é uma resina ou goma aromática. A identificação exata do termo hebraico é incerta; alguns o entendem como uma substância semelhante a uma pedra preciosa, como pérola ou cristal.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: o maná
  rationale: O substantivo definido se refere ao alimento já conhecido no relato; em português, o artigo definido é natural.
- source_word: כִּזְרַע גַּד
  choice: como semente de coentro
  rationale: כִּ expressa comparação, e גַּד é geralmente identificado como coentro; a formulação é concreta e natural em português.
- source_word: וְעֵינוֹ
  choice: e sua aparência
  rationale: Embora עַיִן signifique literalmente “olho”, aqui o uso idiomático indica o aspecto visível.
- source_word: כְּעֵין
  choice: era como a do
  rationale: A construção retoma “aparência”; a elipse portuguesa evita repetição pesada sem perder a comparação visual do hebraico.
- source_word: הַבְּדֹלַח
  choice: bdélio
  rationale: “Bdélio” é o equivalente tradicional mais direto, mas a identificação exata do referente hebraico permanece incerta e é explicada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição literal de “aparência” foi reduzida por elipse, preservando a relação visual. Não se acrescentou marcador discursivo equivalente a “agora”, ausente do hebraico.
