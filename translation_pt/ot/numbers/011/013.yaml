base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: pt
  text: 'De onde conseguirei carne para dar a todo este povo? Pois eles choram diante de mim[a], dizendo: “Dê-nos carne para comermos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “choram a mim” ou “pressionam-me com seu choro”. A expressão hebraica diz literalmente “choram sobre mim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: De onde conseguirei
  rationale: A pergunta indica a fonte de onde Moisés poderia obter a carne e, no contexto, expressa sua incapacidade e aflição. A formulação é natural em português e conserva a ideia de origem.
- source_word: בָּשָׂר
  choice: carne
  rationale: No contexto de alimento, o termo designa carne para consumo.
- source_word: לָתֵת לְכָל הָעָם הַזֶּה
  choice: para dar a todo este povo
  rationale: Preserva o infinitivo de finalidade e o caráter coletivo singular de עָם em português natural.
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da queixa de Moisés e mantém clara a relação discursiva com a pergunta anterior.
- source_word: יִבְכּוּ עָלַי
  choice: eles choram diante de mim
  rationale: A expressão hebraica literalmente contém a preposição 'sobre', mas aqui descreve o choro dirigido a Moisés ou exercendo pressão sobre ele. 'Diante de mim' conserva a cena sem impor hostilidade; a ambiguidade é registrada em nota.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz diretamente o conteúdo do pedido do povo.
- source_word: תְּנָה לָּנוּ
  choice: Dê-nos
  rationale: Equivalente português natural do imperativo com pronome dativo plural.
- source_word: וְנֹאכֵלָה
  choice: para comermos
  rationale: Expressa de modo natural a finalidade ou o resultado desejado indicado pela forma volitiva hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O futuro em “conseguirei” transmite a pergunta exasperada de Moisés; “todo este povo” mantém o coletivo singular. A fala direta usa tratamento coerente com o singular dirigido a Moisés.
