source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: pt
  text: Eu descerei e falarei com você ali. Tomarei do Espírito[a] que está sobre você e o porei sobre eles. Então eles carregarão com você o peso do povo, para que você não tenha de carregá-lo sozinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do espírito”. A palavra hebraica rúach pode significar espírito, vento ou sopro; aqui se refere à capacitação que estava sobre Moisés para liderar o povo.'
    reason: Registra a alternativa de capitalização e a amplitude lexical do termo hebraico sem ocultar a interpretação contextual adotada no texto.
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: Eu descerei
  rationale: Preserva o sentido espacial e a linguagem teofânica de ירד, sem suavizar a descrição antropomórfica da ação divina.
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: e falarei com você ali
  rationale: Traduz diretamente a fala recíproca indicada por דבר com עם e mantém a referência espacial de שָׁם.
- source_word: וְאָצַלְתִּי
  choice: Tomarei
  rationale: O verbo raro אצל descreve retirar ou separar algo do que está sobre Moisés para colocá-lo sobre os anciãos. A formulação evita afirmar se há ou não diminuição em Moisés.
- source_word: מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: do Espírito que está sobre você
  rationale: A preposição מן conserva a ideia de procedência ou participação. No contexto, רוּחַ designa a capacitação divina para a liderança; a maiúscula sinaliza essa leitura, enquanto a nota registra a alternativa formal.
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: e o porei sobre eles
  rationale: Mantém a imagem concreta de algo colocado sobre pessoas e retoma gramaticalmente 'Espírito'.
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: eles carregarão com você o peso do povo
  rationale: Preserva o jogo entre נשא, 'carregar', e מַשָּׂא, 'peso/carga', aplicados metaforicamente à responsabilidade de conduzir o povo.
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: para que você não tenha de carregá-lo sozinho
  rationale: Expressa em português natural o resultado pretendido e conserva a ênfase de אַתָּה לְבַדֶּךָ na responsabilidade antes suportada por Moisés sem ajuda.
theological_decisions:
- issue: Se רוּחַ deve ser grafado como “Espírito” ou “espírito”
  choice: Espírito
  alternative: espírito
  rationale: O contexto imediato apresenta uma capacitação procedente de Deus que repousa sobre Moisés e é conferida aos anciãos. A maiúscula indica essa referência divina, sem definir além do texto a natureza exata dessa atuação; a alternativa é preservada em nota.
- issue: Se a transferência do Espírito implica perda ou diminuição em Moisés
  choice: Não explicitar diminuição nem ausência de diminuição
  alternative: “retirarei uma parte”, que pode sugerir divisão quantitativa
  rationale: O hebraico descreve Deus tomando do que está sobre Moisés e colocando-o sobre os anciãos, mas não esclarece metafisicamente se Moisés fica com menos. “Tomarei do Espírito” preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” por naturalidade contemporânea, conserva as imagens de descida, Espírito sobre pessoas e peso carregado, e evita terminologia técnica ou denominacional.
