  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: pt
  text: Então Yahweh desceu na nuvem e falou com Moisés. Tirou do Espírito que estava sobre ele e o pôs sobre setenta homens dentre os anciãos. Quando o Espírito repousou sobre eles, profetizaram, mas não continuaram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não cessaram”. A expressão hebraica é concisa e tem sido entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Expressa diretamente o movimento descendente e mantém a linguagem teofânica antropomórfica do hebraico.
- source_word: בֶּעָנָן
  choice: na nuvem
  rationale: O artigo definido aponta para a nuvem já conhecida no contexto da manifestação divina no deserto.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: falou com Moisés
  rationale: Explicita de maneira natural o referente contextual do pronome hebraico, evitando ambiguidade desnecessária em português.
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: Tomou do Espírito que estava sobre ele
  rationale: Mantém a ideia de retirar ou repartir daquilo que estava sobre Moisés, sem sugerir necessariamente que o Espírito tenha sido diminuído.
- source_word: רוּחַ
  choice: Espírito
  rationale: O contexto apresenta o poder divino que estava sobre Moisés, repousa sobre os anciãos e produz atividade profética; a inicial maiúscula sinaliza essa identificação contextual.
- source_word: וַיִּתֵּן עַל
  choice: o pôs sobre
  rationale: Conserva a imagem espacial de colocar sobre alguém e concorda com a formulação posterior de o Espírito repousar sobre os anciãos.
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: os setenta anciãos
  rationale: É a formulação portuguesa mais natural para o grupo identificado no hebraico como os setenta homens, os anciãos, sem alterar sua identidade.
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: Quando o Espírito repousou sobre eles
  rationale: Reproduz claramente a imagem hebraica de repouso sobre os anciãos.
- source_word: וַיִּתְנַבְּאוּ
  choice: profetizaram
  rationale: Equivalente corrente e preciso para a atividade profética indicada pelo verbo.
- source_word: וְלֹא יָסָפוּ
  choice: mas não continuaram
  rationale: Expressa a leitura contextual segundo a qual a atividade profética não prosseguiu, enquanto a leitura alternativa genuína é preservada em nota.
theological_decisions:
- issue: Se רוּחַ designa o Espírito divino ou um espírito em sentido genérico
  choice: Espírito
  alternative: espírito
  rationale: A presença que passa de Moisés aos anciãos e resulta em profecia é mais naturalmente entendida como o Espírito de Deus, embora a maiúscula seja uma convenção interpretativa que não existe no hebraico.
- issue: Sentido de וְלֹא יָסָפוּ
  choice: não continuaram
  alternative: não cessaram
  rationale: A expressão hebraica é breve e admite entendimentos distintos. O texto principal adota a leitura contextual de que a profecia não prosseguiu, mas a leitura alternativa tradicional é mantida explicitamente em nota.
translation_notes:
  register: Português atual, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A coordenação foi levemente enxugada para fluidez, sem apagar a sequência narrativa hebraica. O marcador da nota foi colocado junto à expressão realmente discutida.
