revisions:
- from: Então Yahweh desceu na nuvem e falou com Moisés. Tomou do Espírito que estava sobre ele e o pôs sobre os setenta anciãos. Quando o Espírito repousou sobre eles, profetizaram, mas não continuaram.[a]
  to: Então Yahweh desceu na nuvem e falou com Moisés. Tirou do Espírito que estava sobre ele e o pôs sobre setenta homens dentre os anciãos. Quando o Espírito repousou sobre eles, profetizaram, mas não continuaram[a].
  rationale: A revisão preserva explicitamente «homens» e a relação desses homens com os anciãos, sem introduzir uma interpretação doutrinária. Também reposiciona a âncora para que ela incida claramente sobre a oração final ambígua. O restante do texto é fiel e natural.
