  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: pt
  text: 'E Moisés disse a Javé: “Por que trataste mal o teu servo?[a] E por que não encontrei favor aos teus olhos,[b] a ponto de colocares sobre mim o peso de todo este povo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que fizeste mal ao teu servo?” O verbo hebraico significa mais literalmente causar ou fazer mal e expressa a queixa de Moisés.'
    reason: lexical_alternative
  - marker: b
    text: “Encontrar favor aos olhos” de alguém é uma expressão hebraica que significa receber o favor dessa pessoa.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, em vez de substituí-lo pelo título «SENHOR».
- source_word: הֲרֵעֹתָ
  choice: trataste mal
  rationale: Expressa de modo natural a queixa de Moisés e conserva a ideia de causar mal ou dano, sem transformar sua fala numa afirmação explícita de maldade moral da parte de Deus.
- source_word: לְעַבְדֶּךָ
  choice: o teu servo
  rationale: Neste contexto, עבד é uma autodesignação reverente diante de Deus; «servo» comunica isso melhor do que «escravo».
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: encontrei favor aos teus olhos
  rationale: Mantém reconhecível a expressão idiomática hebraica, que significa receber a aprovação ou o favor de alguém.
- source_word: לָשׂוּם
  choice: para colocares
  rationale: Preserva a construção infinitiva e sua relação deliberadamente tensa com a pergunta anterior, sem decidir de forma excessiva entre finalidade e resultado.
- source_word: מַשָּׂא
  choice: o peso
  rationale: Conserva a metáfora concreta de uma carga e, em português, descreve naturalmente a responsabilidade opressiva sentida por Moisés.
- source_word: כָּל הָעָם הַזֶּה
  choice: todo este povo
  rationale: Reproduz naturalmente o substantivo coletivo singular do hebraico.
- source_word: עָלַי
  choice: sobre mim
  rationale: Mantém a imagem de uma carga colocada sobre Moisés.
theological_decisions:
- issue: Possível implicação de הֲרֵעֹתָ quando Deus é o sujeito
  choice: trataste mal
  alternative: fizeste mal ao teu servo
  rationale: A alternativa mais literal poderia ser entendida como uma declaração objetiva de que Deus praticou mal moral. A formulação escolhida preserva a força da queixa angustiada de Moisés e a amplitude semântica do verbo.
- issue: Relação do infinitivo לָשׂוּם com a falta de favor
  choice: para colocares
  alternative: a ponto de colocares / visto que colocaste
  rationale: O hebraico não explicita rigidamente se a construção indica finalidade, consequência ou fundamento da queixa. A tradução mantém essa tensão em vez de impor uma única relação lógica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se o nome divino, a metáfora da carga e a expressão hebraica «aos teus olhos», sem linguagem denominacional.
