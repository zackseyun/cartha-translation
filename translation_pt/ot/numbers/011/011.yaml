review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência narrativa, o nome divino, a autodesignação reverente de Moisés, a imagem da carga e o coletivo singular «este povo». «Trataste mal» transmite bem a queixa expressa por הֲרֵעֹתָ, sem apresentar como afirmação teológica objetiva que Javé praticou mal moral.
  naturalness: O texto é globalmente claro e de registro apropriado. Contudo, «para colocares» soa um tanto rígido na ligação com «não encontrei favor» e pode sugerir finalidade de modo excessivamente direto. «A ponto de colocares» oferece uma conexão idiomática mais natural para a força queixosa da frase, mantendo a relação resultativa/fundamentadora sem impor uma explicação causal completa.
  terminology: «Javé», «servo», «favor», «peso» e «povo» são escolhas adequadas para português moderno. A nota sobre «aos teus olhos» deve limitar-se a «favor»; «aprovação» é possível em certos contextos, mas estreita desnecessariamente o alcance de חֵן nesta passagem.
  issues:
  - severity: low
    issue: Ligação de «para colocares»
    rationale: Embora gramaticalmente possível como infinitivo pessoal, a formulação é menos idiomática neste contexto e pode ler-se como uma finalidade estrita. «A ponto de colocares» exprime naturalmente o protesto de Moisés e conserva a tensão da construção hebraica.
  - severity: low
    issue: Nota b acrescenta «aprovação»
    rationale: O idiomatismo hebraico diz respeito a encontrar/receber favor. «Aprovação» pode ser inferida em alguns usos, mas não é necessária aqui e pode reduzir a amplitude semântica da expressão.
  revised_text: 'E Moisés disse a Javé: “Por que trataste mal o teu servo?[a] E por que não encontrei favor aos teus olhos,[b] a ponto de colocares sobre mim o peso de todo este povo?”'
