  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: pt
  text: Quando o orvalho descia sobre o acampamento à noite[a], o maná descia sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, quando o orvalho descia sobre o acampamento durante a noite, o maná descia sobre ele”. O hebraico usa o mesmo verbo (“descia”) tanto para o orvalho como para o maná, ressaltando o paralelismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: Quando ... descia
  rationale: A conjunção e a preposição prefixadas ao infinitivo construto de ירד introduzem uma oração temporal. “Quando ... descia” é natural em português e preserva o aspecto habitual da cena.
- source_word: הַטַּל
  choice: o orvalho
  rationale: Correspondência direta, com preservação do artigo definido.
- source_word: עַל הַמַּחֲנֶה
  choice: sobre o acampamento
  rationale: עַל pode significar “sobre” ou “em cima de”; aqui, “sobre o acampamento” expressa naturalmente o orvalho que desce e se deposita nele.
- source_word: לָיְלָה
  choice: à noite
  rationale: Uso adverbial de tempo, traduzido pela expressão portuguesa corrente.
- source_word: יֵרֵד
  choice: descia
  rationale: O imperfeito descreve uma ação costumeira no contexto narrativo. O pretérito imperfeito português comunica claramente essa repetição e mantém o mesmo verbo empregado para o orvalho.
- source_word: הַמָּן
  choice: o maná
  rationale: Nome definido do alimento já conhecido no contexto.
- source_word: עָלָיו
  choice: sobre ele
  rationale: Preserva o pronome masculino singular hebraico, cujo referente mais natural é “o acampamento”, sem explicitar além do texto a relação entre o maná e o orvalho.
