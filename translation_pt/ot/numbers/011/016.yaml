id: NUM.11.16
reference: Numbers 11:16
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֶסְפָ/ה לִּ֞/י שִׁבְעִ֣ים אִישׁ֮ מִ/זִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי הֵ֛ם זִקְנֵ֥י הָ/עָ֖ם וְ/שֹׁטְרָ֑י/ו וְ/לָקַחְתָּ֤ אֹתָ/ם֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Reúna[a] para mim setenta homens dentre os anciãos de Israel, aqueles que você sabe que são anciãos do povo e seus oficiais[b]. Leve-os à tenda do encontro, e que eles se apresentem ali com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Ajunte para mim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “encarregados”; o termo hebraico se refere a agentes com funções administrativas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶסְפָה לִּי
  choice: Reúna para mim
  rationale: Expressa de modo natural a ordem de congregar pessoas e preserva a relação indicada por לִּי, “para mim”.
- source_word: שִׁבְעִים אִישׁ
  choice: setenta homens
  rationale: אִישׁ, usado distributivamente após o numeral, refere-se aqui a homens adultos escolhidos para uma função de liderança.
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: dentre os anciãos de Israel
  rationale: A preposição מִן indica seleção no interior de um grupo maior; “dentre” torna essa relação explícita em português.
- source_word: אֲשֶׁר יָדַעְתָּ כִּי הֵם
  choice: aqueles que você sabe que são
  rationale: Reproduz idiomaticamente em português o conhecimento prévio de Moisés como critério da escolha.
- source_word: זִקְנֵי הָעָם
  choice: anciãos do povo
  rationale: Mantém a designação sociopolítica dos líderes reconhecidos da comunidade.
- source_word: וְשֹׁטְרָיו
  choice: e seus oficiais
  rationale: שֹׁטֵר designa agentes com atribuições administrativas; o pronome “seus” retoma coletivamente “o povo”.
- source_word: וְלָקַחְתָּ אֹתָם
  choice: Leve-os
  rationale: No movimento ordenado em direção à tenda, “levar” é a formulação natural em português para לָקַח.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Traduz diretamente a designação hebraica do santuário, sem substituí-la pelo termo mais amplo “tabernáculo”.
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: e que eles se apresentem ali com você
  rationale: O hitpael de יצב comunica a ideia de apresentar-se ou tomar posição formalmente; a formulação preserva também a força diretiva.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva esse nome por transliteração, sem convertê-lo em título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Você” comunica diretamente a segunda pessoa singular sem regionalismo marcado. A divisão em duas frases evita um período excessivamente longo sem alterar a sequência das ordens.
