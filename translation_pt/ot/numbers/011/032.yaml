base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: pt
  text: O povo se levantou e, durante todo aquele dia, toda aquela noite e todo o dia seguinte, recolheu as codornizes. Até quem recolheu menos juntou dez hômeres[a][b]. Então, eles as estenderam para si ao redor do acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hômer era uma grande medida para produtos secos. Seu equivalente moderno exato é incerto; o sentido é que até quem recolheu menos ajuntou uma quantidade muito grande.
    reason: cultural_note
  - marker: b
    text: Ou “dez cargas de jumento”, caso חֳמָרִים seja entendido por sua associação etimológica, em vez de designar a medida padrão chamada “hômer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: O povo se levantou
  rationale: Preserva o idiomatismo e o impulso narrativo de קום, sem reduzir a expressão a um simples começo abstrato da ação.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: durante todo aquele dia, toda aquela noite e todo o dia seguinte
  rationale: Reproduz a duração contínua e enfática da atividade em português natural.
- source_word: וַיַּאַסְפוּ אֶת הַשְּׂלָו
  choice: recolheu as codornizes
  rationale: Recolher expressa naturalmente a coleta das aves espalhadas pelo terreno; o coletivo 'povo' pede o singular, e o plural 'codornizes' é idiomático em português.
- source_word: הַמַּמְעִיט אָסַף
  choice: Até quem recolheu menos juntou
  rationale: Explicita o sentido contextual do particípio הַמַּמְעִיט e mantém a ênfase de que essa era a quantidade mínima.
- source_word: עֲשָׂרָה חֳמָרִים
  choice: dez ômeres
  rationale: Mantém transliterada a medida antiga, sem impor um equivalente moderno impreciso. A alternativa etimológica 'cargas de jumento' é registrada em nota.
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: eles as estenderam para si mesmos
  rationale: Reflete tanto o verbo intensificado por seu infinitivo cognato quanto לָהֶם, evitando afirmar uma finalidade, como secagem ou conservação, que o texto não explicita.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: por toda a volta do acampamento
  rationale: Comunica o sentido abrangente de distribuição ao redor do acampamento.
