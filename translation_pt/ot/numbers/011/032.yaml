  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção temporal foi levemente reorganizada para soar natural sem perder a tripla ênfase na duração. Os dois marcadores aparecem junto de “dez ômeres”, pois ambas as notas explicam essa unidade ou sua possível leitura alternativa.
