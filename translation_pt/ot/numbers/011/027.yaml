  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: pt
  text: 'Então um jovem correu, contou a Moisés[a] e disse: “Eldade e Medade estão profetizando no acampamento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o jovem correu e informou a Moisés”. O artigo hebraico permite a tradução mais formal “o jovem”, e o verbo também pode ser traduzido por “informou” ou “relatou”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: correu
  rationale: O verbo רוץ denota diretamente correr; “correu” conserva a vivacidade da narrativa sem acrescentar uma ideia de urgência que não está explícita.
- source_word: הַנַּעַר
  choice: um jovem
  rationale: נַעַר pode designar menino, rapaz ou jovem. Aqui, “um jovem” é natural para um mensageiro recém-introduzido no relato; a alternativa formal “o jovem” é registrada em nota por causa do artigo hebraico.
- source_word: וַיַּגֵּד
  choice: contou a
  rationale: No hifil, נגד significa contar, relatar ou informar. “Contou a Moisés” é idiomático, e a fala seguinte apresenta o conteúdo da informação.
- source_word: לְמֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: A expressão preserva a sequência narrativa hebraica e introduz com clareza o discurso direto.
- source_word: אֶלְדָּד וּמֵידָד
  choice: Eldade e Medade
  rationale: Usam-se as formas portuguesas tradicionais dos nomes bíblicos, reconhecíveis e adequadas ao registro da tradução.
- source_word: מִתְנַבְּאִים
  choice: estão profetizando
  rationale: O particípio hitpael de נבא descreve atividade profética em andamento; “estão profetizando” preserva esse aspecto sem explicar além do texto.
- source_word: בַּמַּחֲנֶה
  choice: no acampamento
  rationale: מַחֲנֶה designa o acampamento de Israel; “no acampamento” é a tradução direta e natural no contexto.
