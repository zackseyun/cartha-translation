  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: pt
  text: 'Então Josué, filho de Num, auxiliar de Moisés desde a juventude[a], respondeu: “Meu senhor Moisés, detenha-os!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dos seus jovens”; possivelmente, “um dos seus escolhidos”. A expressão hebraica é compacta e um tanto ambígua.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “proíba-os”. O verbo hebraico pode significar deter, restringir ou proibir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: Então ... respondeu
  rationale: O wayyiqtol de ענה introduz uma resposta na sequência narrativa. “Então” expressa a progressão do relato, e “respondeu” é natural em português sem a redundância de “respondeu e disse”.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes próprios.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: auxiliar de Moisés
  rationale: מְשָׁרֵת designa alguém que serve em função de assistência pessoal. “Auxiliar” comunica essa função em português atual sem sugerir escravidão.
- source_word: מִבְּחֻרָיו
  choice: desde a juventude
  rationale: A expressão hebraica é compacta e ambígua. Esta leitura entende בְּחוּרִים em sentido temporal, referindo-se ao serviço de Josué desde a juventude; as leituras coletivas ou ligadas à ideia de escolha são preservadas em nota.
- source_word: אֲדֹנִי מֹשֶׁה
  choice: Meu senhor Moisés
  rationale: אֲדֹנִי é uma forma respeitosa de dirigir-se a um superior humano. “Meu senhor” conserva a deferência, e o nome explícito evita confusão com um título divino.
- source_word: כְּלָאֵם
  choice: detenha-os
  rationale: O imperativo de כלא pode significar deter, restringir ou proibir. “Detenha-os” preserva a força do pedido sem especificar o meio pelo qual Eldade e Medade deveriam ser impedidos de profetizar.
