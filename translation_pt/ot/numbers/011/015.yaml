source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: pt
  text: Se é assim que vais me tratar, mata-me de uma vez, por favor, se achei favor aos teus olhos; e não me deixes ver a minha desgraça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha calamidade” ou “a minha aflição”. O termo hebraico pode indicar adversidade ou desastre, e não apenas mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Se
  rationale: Introduz a condição; a conjunção inicial pode ser naturalmente absorvida em português.
- source_word: כָּכָה
  choice: é assim
  rationale: Expressão corrente que preserva o valor modal do advérbio no protesto de Moisés.
- source_word: אַתְּ ... עֹשֶׂה לִּי
  choice: vais me tratar
  rationale: Neste contexto, עשה com ל descreve a maneira como Deus age para com Moisés; “tratar” transmite essa força relacional em português natural.
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: mata-me de uma vez, por favor
  rationale: O infinitivo absoluto com o imperativo intensifica o pedido, enquanto נָא lhe acrescenta o tom de súplica.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: se achei favor aos teus olhos
  rationale: Preserva a conhecida expressão idiomática hebraica e sua imagem.
- source_word: וְאַל אֶרְאֶה
  choice: e não me deixes ver
  rationale: Expressa como súplica negativa dirigida a Deus o sentido volitivo da construção.
- source_word: בְּרָעָתִי
  choice: a minha desgraça
  rationale: רָעָה pode indicar adversidade, aflição ou calamidade; “desgraça” comunica aqui a ruína ou sofrimento que recairia sobre Moisés, sem sugerir necessariamente mal moral.
theological_decisions:
- issue: Sentido de בְּרָעָתִי na súplica de Moisés
  choice: a minha desgraça
  alternative: o meu mal; a minha aflição; a calamidade que me sobreviria
  rationale: O contexto apresenta o desespero de Moisés sob o peso do povo, não uma confissão inequívoca de maldade pessoal. A tradução mantém o sentido de adversidade sem eliminar a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal de boa legibilidade brasileira e formas verbais de segunda pessoa que preservam o discurso direto dirigido a Deus. O ponto e vírgula separa a súplica de morte do pedido final sem enfraquecer a intensidade emocional.
