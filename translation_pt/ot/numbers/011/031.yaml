language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: pt
  text: Então um vento saiu da presença de Yahweh[a], trouxe codornizes do mar e as espalhou junto ao acampamento, até cerca de um dia de caminhada para um lado e um dia de caminhada para o outro, por toda a volta do acampamento, a cerca de dois côvados acima da superfície do chão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito saiu da presença de Yahweh”. A palavra hebraica também pode significar “espírito”, mas o contexto favorece “vento”, pois ele traz as codornizes do mar.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cerca de dois côvados sobre a face do chão”. Dois côvados correspondem aproximadamente a 90 centímetros. A frase pode indicar a altura em que as codornizes voavam ou estavam espalhadas, em vez da espessura de uma camada de aves no chão.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: um vento
  rationale: רוּחַ pode significar “vento”, “sopro” ou “espírito”. Aqui, o agente transporta codornizes do mar, por isso “vento” é o sentido contextual mais provável, sem eliminar a alternativa em nota.
- source_word: נָסַע מֵאֵת יְהוָה
  choice: saiu da presença de Yahweh
  rationale: נָסַע indica partir ou pôr-se em movimento, e מֵאֵת marca a origem junto a alguém. A formulação conserva tanto o movimento quanto a procedência divina sem explicar além do hebraico como ocorreu a ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיָּגָז שַׂלְוִים
  choice: trouxe codornizes
  rationale: O verbo גוז é raro e, neste contexto, descreve o efeito do vento ao fazer as aves virem do mar. “Trouxe” comunica o movimento com clareza sem impor o sentido literal incerto de cortar ou arrancar.
- source_word: מִן הַיָּם
  choice: do mar
  rationale: Mantém o sentido geográfico direto da origem das aves, sem transformá-lo numa indicação meramente direcional.
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: e as espalhou junto ao acampamento
  rationale: נטשׁ pode expressar estender, lançar ou deixar. “Espalhou” corresponde à ampla distribuição descrita a seguir; “junto ao acampamento” evita sugerir, sem necessidade, que as aves cobriram diretamente as tendas.
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: até cerca de um dia de caminhada para um lado e um dia de caminhada para o outro
  rationale: Preserva a estrutura repetida do hebraico e torna explícita a extensão medida a partir do acampamento.
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: por toda a volta do acampamento
  rationale: Expressa o sentido abrangente da forma plural hebraica e esclarece que a distribuição circundava o acampamento.
- source_word: וּכְאַמָּתַיִם
  choice: a cerca de dois côvados
  rationale: A preposição כְּ indica aproximação. A unidade antiga é mantida no texto para transparência histórica.
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: acima da superfície do chão
  rationale: A expressão é literalmente “sobre a face do chão”. “Acima da superfície” apresenta a leitura de altura mais coerente, enquanto a possível leitura como espessura ou nível de distribuição é preservada em nota.
theological_decisions:
- issue: Ação do vento procedente de Yahweh
  choice: O versículo apresenta um vento procedente de Yahweh como o meio que trouxe as codornizes.
  alternative: Entender a frase mais dinamicamente como uma descrição de Yahweh trazendo diretamente as codornizes por meio do vento.
  rationale: O hebraico atribui a origem do vento a Yahweh e descreve a ação do vento, mantendo juntas a iniciativa divina e a atuação de um meio natural, sem detalhar a relação causal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, mas a procedência do vento, a extensão ao redor do acampamento e a ambiguidade da medida vertical foram preservadas.
