base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: pt
  text: 'Moisés, porém, lhe disse: “Você está com ciúmes por minha causa?[a] Quem dera que todo o povo de Yahweh fosse profeta e que Yahweh pusesse sobre eles o seu Espírito!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você está zelando por mim?”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desse o seu Espírito sobre eles”. A conjunção traduzida por “e que” também pode ser entendida como “pois” ou “porque”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְקַנֵּא אַתָּה לִי
  choice: Você está com ciúmes por minha causa?
  rationale: A pergunta repreende a atitude protetora de Josué em relação à posição de Moisés. “Estar com ciúmes” comunica naturalmente esse zelo possessivo, enquanto “por minha causa” preserva a referência ao interesse de Moisés.
- source_word: וּמִי יִתֵּן
  choice: Quem dera
  rationale: A expressão hebraica, literalmente formulada como “quem dará?”, funciona idiomaticamente como desejo enfático. “Quem dera” é uma construção portuguesa natural e digna com a mesma força optativa.
- source_word: כָּל עַם יְהוָה
  choice: todo o povo de Yahweh
  rationale: Preserva tanto a totalidade quanto a relação de pertencimento expressa pela cadeia construta hebraica.
- source_word: נְבִיאִים
  choice: fosse profeta
  rationale: O singular coletivo em português concorda naturalmente com “todo o povo” e traduz diretamente o predicativo plural hebraico sem alterar o sentido.
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: e que Yahweh pusesse sobre eles o seu Espírito
  rationale: O segundo subjuntivo prolonga o desejo introduzido por “Quem dera”. “Pusesse sobre eles” conserva a imagem hebraica do Espírito vindo sobre pessoas para capacitá-las profeticamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: רוּחוֹ
  choice: o seu Espírito
  rationale: No contexto imediato de profecia concedida por Deus, רוּחַ designa o Espírito de Yahweh. A inicial maiúscula esclarece o referente divino sem acrescentar uma definição além do contexto.
theological_decisions:
- issue: Sentido de קנא na pergunta dirigida a Josué
  choice: com ciúmes
  alternative: zelando
  rationale: O contexto sugere proteção possessiva da posição de Moisés, mas o verbo também pode designar zelo. A tradução principal expressa a repreensão, e a nota preserva a alternativa lexical.
- issue: Relação de כִּי com o desejo precedente
  choice: e que
  alternative: pois/porque
  rationale: Neste contexto, a oração descreve a concessão do Espírito que faria do povo profetas e é naturalmente entendida como continuação do desejo. Como כִּי também pode ter valor causal, a nota mantém essa ambiguidade.
- issue: Identificação de רוּחוֹ
  choice: o seu Espírito
  alternative: o seu espírito
  rationale: A atividade profética no contexto aponta para a presença capacitadora de Deus. A maiúscula identifica esse referente, sem desenvolver uma formulação teológica posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Você” evita solenidade artificial; “Quem dera” preserva o tom enfático e elevado do desejo de Moisés. A ordem “sobre eles o seu Espírito” conserva a imagem e a ênfase do hebraico sem soar excessivamente literal.
