    rationale: יִשָּׁחֵט e יֵאָסֵף são formas passivas, e a construção com «mesmo» acrescenta uma concessão enfática. «Se abateriam»/«fossem reunidos» preserva melhor a modalidade hipotética e a voz passiva.
  - severity: low
    issue: A nota pode explicitar que a expressão idiomática hebraica ocorre nas duas cláusulas.
    rationale: ומצא להם é repetida no versículo; embora uma única âncora seja suficiente, a redação da nota pode evitar a impressão de que se refere apenas à segunda ocorrência.
