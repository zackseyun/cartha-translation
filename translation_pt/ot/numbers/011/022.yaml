- from: Será que, mesmo abatendo ovelhas e bois para eles, haveria o suficiente? Ou, mesmo reunindo para eles todos os peixes do mar, haveria o suficiente?[a]
  to: Será que se abateriam para eles ovelhas e bois, e isso seria suficiente para eles? Ou, se todos os peixes do mar fossem reunidos para eles, isso seria suficiente para eles?[a]
