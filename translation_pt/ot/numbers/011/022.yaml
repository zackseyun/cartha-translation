base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: pt
  text: Será que se abateriam para eles ovelhas e bois, e isso seria suficiente para eles? Ou, se todos os peixes do mar fossem reunidos para eles, isso seria suficiente para eles?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “e seria encontrado para eles”; nas duas ocorrências, essa expressão significa, neste contexto, “e seria suficiente para eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: Será que
  rationale: Introduz naturalmente em português a pergunta retórica e hipotética de Moisés.
- source_word: צֹאן וּבָקָר
  choice: ovelhas e bois
  rationale: Expressa de modo concreto e acessível os animais de pequeno e grande porte mencionados no hebraico.
- source_word: יִשָּׁחֵט
  choice: abatendo
  rationale: No contexto de animais destinados à alimentação, “abater” é mais específico e natural do que o genérico “matar”.
- source_word: לָהֶם
  choice: para eles
  rationale: Indica que os animais e peixes seriam providenciados em benefício do povo.
- source_word: וּמָצָא לָהֶם
  choice: haveria o suficiente
  rationale: Traduz idiomaticamente a ideia de ser suficiente, evitando o literal e enganoso “ser encontrado para eles”.
- source_word: אִם
  choice: Ou, mesmo
  rationale: Apresenta a segunda possibilidade retórica e comunica que nem a totalidade imaginada dos peixes resolveria a insuficiência percebida.
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: todos os peixes do mar
  rationale: Preserva de maneira direta e natural a expressão totalizante do hebraico.
- source_word: יֵאָסֵף
  choice: reunindo
  rationale: Mantém o sentido amplo de ajuntar ou recolher, sem acrescentar especificamente a ideia de pescar.
