base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: pt
  text: O povo ia de um lado para outro e o recolhia; moía-o com pedras de moinho ou o socava num pilão, cozinhava-o numa panela e fazia bolos com ele. Seu sabor era como o sabor de azeite encorpado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como o de azeite fresco”. A expressão hebraica é difícil e pode indicar a riqueza, a substância ou o frescor do azeite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: percorria os arredores
  rationale: O verbo descreve o movimento de um lado para outro por uma área; a forma verbal, no contexto, apresenta uma ação habitual do povo ao recolher o maná.
- source_word: לָקְטוּ
  choice: recolhê-lo
  rationale: Expressa de modo natural em português o ato de juntar ou apanhar o maná espalhado.
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: moía-o em pedras de moinho
  rationale: Preserva a referência concreta às pedras de um moinho manual, em vez de generalizar para o ato de moer.
- source_word: דָכוּ בַּמְּדֹכָה
  choice: o triturava num pilão
  rationale: O verbo indica esmagar ou socar, e מְדֹכָה designa o recipiente usado para esse fim; 'pilão' é a designação corrente e compreensível em português.
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: cozinhava-o numa panela
  rationale: O verbo pode significar cozinhar ou ferver. 'Cozinhar' evita especificar além do necessário o método, enquanto 'panela' representa naturalmente o utensílio.
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: fazia bolos com ele
  rationale: Comunica claramente que o maná processado era preparado em forma de bolos, sem impor ao termo uma receita moderna específica.
- source_word: טַעְמוֹ
  choice: seu sabor
  rationale: Equivalente direto e idiomático para a qualidade gustativa do maná.
- source_word: לְשַׁד הַשָּׁמֶן
  choice: azeite encorpado
  rationale: A expressão hebraica é rara e difícil; esta tradução comunica a ideia provável de riqueza ou substância oleosa, mantendo a comparação alimentar e deixando a alternativa em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção habitual no passado. 'Azeite' foi preferido a 'óleo' porque o contexto alimentar e a comparação com שֶׁמֶן tornam essa opção natural, sem eliminar em nota a incerteza lexical da expressão final.
