source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Será que a mão de Yahweh ficou curta?[a] Agora você verá se a minha palavra se cumprirá para você ou não.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica “a mão de Yahweh ficou curta?” significa: “O poder de Yahweh ficou limitado?”'
    reason: cultural_note
  - marker: b
    text: 'Ou: “se o que eu disse acontecerá com você ou não”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: Será que a mão de Yahweh ficou curta?
  rationale: Mantém a imagem antropomórfica e a força retórica do hebraico; em português, “ficou curta” comunica uma possível limitação sem eliminar a metáfora.
- source_word: עַתָּה תִרְאֶה
  choice: Agora você verá
  rationale: Reproduz de modo direto o advérbio temporal e o futuro que anuncia uma comprovação iminente.
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: se a minha palavra se cumprirá para você
  rationale: O verbo pode indicar acontecer ou ocorrer; “se cumprirá” expressa naturalmente, no contexto, a concretização da palavra pronunciada, enquanto “para você” preserva o sufixo de segunda pessoa.
- source_word: אִם לֹא
  choice: ou não
  rationale: Completa de forma idiomática em português a construção interrogativa indireta iniciada por “se”.
theological_decisions:
- issue: Linguagem antropomórfica sobre o poder divino
  choice: Manter literalmente “a mão de Yahweh ficou curta”
  alternative: “O poder de Yahweh ficou limitado?”
  rationale: A metáfora corporal é deliberada e dá força à repreensão; a nota esclarece seu sentido sem achatar a linguagem do texto.
- issue: Sentido de דְבָרִי e הֲיִקְרְךָ
  choice: “se a minha palavra se cumprirá para você”
  alternative: “se o que eu disse acontecerá com você”
  rationale: A formulação escolhida conserva “minha palavra” e expressa sua realização, sem decidir além do contexto se o sufixo deve ser entendido como benefício (“para você”) ou incidência (“com você”).
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A metáfora hebraica foi preservada no corpo do texto e explicada em nota. Os marcadores foram posicionados junto às expressões a que se referem.
