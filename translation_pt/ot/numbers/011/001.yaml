  naturalness: A revisão mantém um português moderno e claro. «Sua ira se acendeu» e «o fogo de Yahweh ardeu entre eles» são idiomáticos e adequados ao registro narrativo.
  terminology: «Yahweh» reproduz coerentemente o Tetragrama. «Ira» e «fogo de Yahweh» mantêm a linguagem de juízo do texto sem expansão doutrinária. «Acampamento» é apropriado para מַחֲנֶה.
