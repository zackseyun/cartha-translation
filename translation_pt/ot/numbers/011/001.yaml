  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: pt
  text: O povo era como quem se queixava de adversidades aos ouvidos de Yahweh[a]. Yahweh ouviu, e sua ira se acendeu. O fogo de Yahweh[b] ardeu entre eles e consumiu uma extremidade do acampamento[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como queixosos”, “andava se queixando” ou, possivelmente, “como se estivesse se queixando”. A forma hebraica é rara e de interpretação difícil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um fogo vindo de Yahweh”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “consumiu na extremidade do acampamento”. O hebraico não explicita o objeto consumido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים רַע
  choice: O povo começou a se queixar das dificuldades
  rationale: Expressa em português natural o desenvolvimento narrativo e a queixa contínua ligada à adversidade. A forma hebraica rara com כְּ permite outras nuances, registradas em nota.
- source_word: בְּאָזְנֵי יְהוָה
  choice: aos ouvidos de Yahweh
  rationale: Preserva a imagem auditiva do hebraico e indica que a queixa chegou ao conhecimento de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּחַר אַפּוֹ
  choice: sua ira se acendeu
  rationale: Reproduz de maneira idiomática e digna a metáfora hebraica de ira ardente.
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: o fogo de Yahweh ardeu entre eles
  rationale: Mantém transparente a construção genitiva e a preposição, sem decidir se ela significa especificamente origem ou posse.
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: consumiu parte da extremidade do acampamento
  rationale: Evita acrescentar pessoas como objeto explícito; o hebraico pode indicar que o fogo consumiu na extremidade ou uma parte exterior do acampamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Relação entre o fogo e Yahweh
  choice: o fogo de Yahweh
  alternative: um fogo vindo de Yahweh
  rationale: A tradução principal conserva a relação genitiva sem a restringir à ideia de procedência; a alternativa plausível é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A coordenação hebraica foi levemente segmentada para clareza. Preservaram-se em notas a dificuldade da expressão inicial e a ambiguidade do alcance do fogo.
