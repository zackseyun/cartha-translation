base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: pt
  text: Ele deu àquele lugar o nome de Taberá[a], porque o fogo de Yahweh ardeu no meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Taberá se relaciona, em hebraico, com «queima» e com o verbo «arder».
    reason: Explica o jogo de palavras entre o topônimo תבערה e o verbo בער, «arder».
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: ele deu àquele lugar o nome de
  rationale: Expressa em português natural a fórmula hebraica de nomeação, mantendo explícitos tanto o lugar quanto o ato de lhe dar um nome.
- source_word: תַּבְעֵרָה
  choice: Taberá
  rationale: Translitera o topônimo hebraico segundo a forma corrente em português; a nota registra sua relação sonora e semântica com o verbo 'arder'.
- source_word: כִּי
  choice: porque
  rationale: Preserva claramente a relação causal entre o nome dado ao lugar e o fogo que ali ardeu.
- source_word: בָעֲרָה
  choice: ardeu
  rationale: Verbo direto e idiomático que traduz בער e mantém a associação lexical com o sentido do topônimo.
- source_word: בָם
  choice: no meio deles
  rationale: Representa o fogo atuando dentro do acampamento ou da comunidade, sem sugerir uma combustão no interior físico das pessoas.
- source_word: אֵשׁ יְהוָה
  choice: o fogo de Yahweh
  rationale: Mantém a construção hebraica e traduz diretamente o nome divino do texto-fonte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; 'Yahweh' preserva o nome próprio da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A abertura 'Por isso' liga a nomeação ao episódio anterior; 'deu àquele lugar o nome de' evita um hebraísmo pouco natural sem perder a fórmula narrativa.
