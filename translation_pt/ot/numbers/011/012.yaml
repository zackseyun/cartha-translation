  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: pt
  text: 'Por acaso fui eu que concebi todo este povo? Fui eu que o dei à luz, para que me digas: “Carregue-o junto ao peito, como um cuidador[a] carrega uma criança de peito”, até a terra que juraste dar aos antepassados dele?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma ama” ou “um tutor”. O termo hebraico designa alguém encarregado de cuidar de uma criança.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico usa pronomes no singular — “o” e “dele” — tratando “povo” como uma unidade coletiva. Também se poderia traduzir com pronomes no plural: “os” e “deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: Por acaso fui eu que concebi
  rationale: A partícula interrogativa com o pronome enfático introduz uma pergunta retórica. “Por acaso fui eu que” expressa naturalmente a ênfase, enquanto “concebi” preserva a metáfora materna de הרה.
- source_word: כָּל הָעָם הַזֶּה
  choice: todo este povo
  rationale: “Povo” mantém o substantivo coletivo singular do hebraico e permite conservar a imagem de Israel como uma só criança.
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: Fui eu que o dei à luz
  rationale: ילד continua a imagem do parto, e o pronome “o” reproduz o sufixo masculino singular que retoma coletivamente “povo”.
- source_word: כִּי תֹאמַר אֵלַי
  choice: para que me digas
  rationale: A construção exprime o resultado ou a implicação contestada por Moisés. O subjuntivo mantém o tom retórico e a relação com as perguntas anteriores.
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: Carregue-o junto ao peito
  rationale: “Carregue-o” traduz diretamente a ação de נשא, e “junto ao peito” conserva a imagem corporal de חֵיק de modo mais claro no português atual do que o pouco natural “em seu seio”.
- source_word: הָאֹמֵן
  choice: um cuidador
  rationale: O particípio designa quem sustenta e cuida de uma criança. “Cuidador” não determina além do texto se a função é de tutor, pai adotivo ou ama.
- source_word: הַיֹּנֵק
  choice: uma criança de peito
  rationale: A expressão indica uma criança ainda em fase de amamentação. “Criança de peito” preserva essa especificidade sem o tom clínico de “lactente”.
- source_word: עַל הָאֲדָמָה
  choice: até a terra
  rationale: No contexto de conduzir o povo ao destino prometido, a preposição indica movimento em direção à terra.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: que juraste dar aos antepassados dele
  rationale: “Juraste” conserva a linguagem de juramento. O verbo “dar”, implícito no objeto do juramento e exigido para uma frase natural em português, explicita o sentido contextual sem alterar o referente. “Dele” mantém o singular coletivo do hebraico.
theological_decisions:
- issue: Referências singulares ao povo de Israel como entidade coletiva
  choice: Conservar “o” e “dele” no singular
  alternative: Empregar “os” e “deles”, tratando “povo” semanticamente como plural
  rationale: Os sufixos hebraicos são singulares e apresentam Israel como uma única criança na metáfora de Moisés. O português admite essa concordância com o coletivo “povo”, embora a alternativa plural seja possível; a nota registra essa possibilidade.
- issue: Identidade e função de הָאֹמֵן
  choice: Traduzir por “cuidador”
  alternative: “ama”, “tutor” ou “pai adotivo”
  rationale: O termo descreve alguém encarregado de cuidar e carregar uma criança, mas não define inequivocamente uma função técnica. “Cuidador” preserva essa abertura e evita especificar sexo ou relação familiar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. As perguntas retóricas mantêm a intensidade da queixa de Moisés; “junto ao peito” e “criança de peito” preservam a imagem de cuidado infantil sem recorrer a linguagem arcaica ou excessivamente clínica.
