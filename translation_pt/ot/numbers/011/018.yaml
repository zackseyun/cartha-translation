source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: pt
  text: 'Diga ao povo: “Consagrem-se para amanhã[a], e vocês comerão carne, pois choraram aos ouvidos de Yahweh, dizendo: ‘Quem nos dará carne para comer? Pois era bom para nós no Egito’. Yahweh lhes dará carne, e vocês comerão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Santifiquem-se para amanhã”. O verbo hebraico indica que o povo devia separar-se e preparar-se para a ação de Yahweh.'
    reason: alternativa lexical
lexical_decisions:
- source_word: תֹּאמַר
  choice: você dirá
  rationale: O imperfeito na segunda pessoa masculina singular, dirigido a Moisés, tem força diretiva; o futuro preserva a forma da ordem com naturalidade em português.
- source_word: הִתְקַדְּשׁוּ
  choice: Consagrem-se
  rationale: O imperativo hitpael de קדשׁ expressa separar-se ou colocar-se em estado apropriado para a ação divina, mantendo aqui sua força religiosa.
- source_word: לְמָחָר
  choice: para amanhã
  rationale: A preposição relaciona a preparação ao dia seguinte; esta formulação é natural e próxima da estrutura hebraica.
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: e vocês comerão carne
  rationale: בָּשָׂר designa carne como alimento, e a forma verbal após o imperativo aponta para o resultado futuro.
- source_word: בְּכִיתֶם
  choice: choraram
  rationale: O qatal remete à ação anterior do povo, apresentada como motivo da resposta que virá.
- source_word: בְּאָזְנֵי יְהוָה
  choice: aos ouvidos de Yahweh
  rationale: Preserva a imagem concreta do hebraico e comunica que a queixa foi proferida de modo que Yahweh a ouviu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Quem nos dará carne para comer?
  rationale: Expressa de modo idiomático o hifil causativo de אכל, literalmente fazer alguém comer ou alimentá-lo, sem sugerir que se trata apenas de servir uma refeição.
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: Pois estávamos bem no Egito
  rationale: Comunica naturalmente a construção impessoal hebraica sem acrescentar o comparativo explícito de 'estávamos melhor'.
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: Yahweh lhes dará carne
  rationale: Mantém a ligação simples do contexto sem explicitar por meio de 'portanto' uma relação inferida; a coordenação anterior em português já conduz à resposta divina.
- source_word: וַאֲכַלְתֶּם
  choice: e vocês comerão
  rationale: Retém a repetição enfática do hebraico e antecipa a elaboração dos versículos seguintes.
theological_decisions:
- issue: Forma de representar o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
- issue: Sentido de הִתְקַדְּשׁוּ no contexto de uma dádiva que também envolve juízo
  choice: Consagrem-se
  alternative: Preparem-se; Santifiquem-se
  rationale: A tradução conserva a linguagem de separação ritual sem definir a ação divina subsequente como somente bênção ou somente juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você/vocês”. Conservam-se a repetição, a imagem hebraica “aos ouvidos” e o nome Yahweh. A pontuação distingue a fala dirigida por Yahweh a Moisés, a mensagem de Moisés ao povo e a citação da queixa popular.
