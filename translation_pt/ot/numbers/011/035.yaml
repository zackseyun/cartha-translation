  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: pt
  text: De Quibrote-Hataavá[a], o povo partiu para Hazerote e permaneceu em Hazerote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quibrote-Hataavá significa “sepulturas do desejo” ou “sepulturas da cobiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: De Quibrote-Hataavá
  rationale: O nome geográfico é transliterado segundo uma forma reconhecível em português, enquanto seu significado transparente é preservado em nota.
- source_word: נָסְע֥וּ
  choice: partiu
  rationale: Neste relato de itinerário, נסע indica levantar acampamento e seguir viagem; “partiu” expressa isso de modo natural e conciso.
- source_word: הָ/עָ֖ם
  choice: o povo
  rationale: עם designa coletivamente a comunidade israelita; “o povo” é a correspondência corrente e natural em português.
- source_word: חֲצֵר֑וֹת
  choice: Hazerote
  rationale: Trata-se de um topônimo, transliterado em forma adequada e reconhecível em português.
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: e permaneceu em Hazerote
  rationale: Embora a expressão seja literalmente “e estavam em Hazerote”, no contexto de itinerário היה com ב indica a permanência do grupo naquele local. O singular concorda naturalmente com o sujeito coletivo “o povo” em português.
