  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: pt
  text: Mas dois homens permaneceram no acampamento. O nome de um era Eldade, e o nome do segundo era Medade. O Espírito repousou sobre eles. Eles estavam entre os inscritos[a], mas não tinham ido à tenda[b], e profetizaram no acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os registrados”. O hebraico diz literalmente que eles estavam “entre os escritos”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, provavelmente, a tenda do encontro, pelo contexto deste episódio.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: permaneceram
  rationale: Expressa o sentido de שׁאר, permanecer ou ficar, sem afirmar por que os dois homens não saíram com os demais.
- source_word: בַּמַּחֲנֶה
  choice: no acampamento
  rationale: É a forma locativa natural em português para o acampamento de Israel e traduz de modo consistente as duas ocorrências.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dois homens
  rationale: Mantém a referência masculina explícita do hebraico.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: O nome de um era ... e o nome do segundo
  rationale: Preserva de perto a fórmula hebraica e a distinção entre “um” e “o segundo”, em português claro.
- source_word: אֶלְדָּד / מֵידָד
  choice: Eldade / Medade
  rationale: Emprega as formas tradicionalmente consagradas desses nomes em português.
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: O Espírito repousou sobre eles
  rationale: נוח descreve o Espírito vindo a repousar sobre eles; “repousou sobre” conserva a imagem e soa natural em registro bíblico atual.
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: Eles estavam entre os inscritos
  rationale: כְּתֻבִים significa literalmente os escritos ou registrados. “Entre os inscritos” comunica sua inclusão na lista sem tornar o português excessivamente literal.
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: mas não tinham saído para ir à tenda
  rationale: O mais-que-perfeito composto representa a ação anterior no contexto; “para ir à tenda” torna explícita apenas a direção indicada pelo ה locativo, sem identificar no texto principal qual tenda era.
- source_word: וַיִּתְנַבְּאוּ
  choice: profetizaram
  rationale: Traduz diretamente a atividade profética indicada pelo hitpael de נבא, sem acrescentar uma nuance incoativa desnecessária.
theological_decisions:
- issue: Se הָרוּחַ deve ser traduzido como “o Espírito” ou “o espírito”
  choice: o Espírito
  alternative: o espírito
  rationale: No contexto imediato, trata-se do Espírito divino que capacita os anciãos para profetizar. A inicial maiúscula identifica o referente contextual sem acrescentar uma formulação doutrinária ao versículo.
- issue: Se הָאֹהֱלָה deve ser explicitado como “à tenda do encontro”
  choice: à tenda
  alternative: à tenda do encontro
  rationale: Embora o contexto provavelmente a identifique como a tenda do encontro, o hebraico deste versículo diz apenas “a tenda”. A tradução mantém essa forma mais estrita e registra a identificação provável em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva parte da cadência hebraica sem rigidez excessiva. Os marcadores foram colocados junto às expressões que cada nota explica.
