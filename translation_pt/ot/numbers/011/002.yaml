source:
  edition: WLC
  text: וַ/יִּצְעַ֥ק הָ/עָ֖ם אֶל מֹשֶׁ֑ה וַ/יִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל יְהוָ֔ה וַ/תִּשְׁקַ֖ע הָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: pt
  text: Então o povo clamou a Moisés, e Moisés orou a Yahweh; e o fogo se abrandou[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “baixou” ou “diminuiu”. O verbo hebraico sugere que o fogo perdeu intensidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: clamou
  rationale: O verbo צעק expressa um grito urgente de aflição ou pedido de socorro; “clamou” transmite essa intensidade de modo natural em português.
- source_word: הָעָם
  choice: o povo
  rationale: Neste contexto narrativo, עַם designa coletivamente a comunidade israelita; “o povo” é a forma corrente e precisa.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica a pessoa a quem o clamor foi dirigido; “clamou a Moisés” é idiomático e mantém essa direção.
- source_word: וַיִּתְפַּלֵּל
  choice: orou
  rationale: O hitpael de פלל significa normalmente “orar”. O contexto sugere intercessão, mas “orou” preserva o sentido lexical sem tornar explícito o que está apenas implícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַתִּשְׁקַע
  choice: se abrandou
  rationale: שקע pode descrever algo que baixa, afunda ou perde intensidade. Em relação ao fogo, “se abrandou” comunica que ele diminuiu, sem afirmar necessariamente que foi apagado por completo.
- source_word: הָאֵשׁ
  choice: o fogo
  rationale: אֵשׁ significa diretamente “fogo” e retoma o fogo divino mencionado no contexto imediato.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
- issue: Natureza da oração de Moisés
  choice: orou
  alternative: intercedeu
  rationale: Embora a oração beneficie o povo e, portanto, tenha caráter intercessório, o verbo hebraico diz simplesmente que Moisés orou. A tradução evita explicitar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Clamou” conserva a urgência do pedido, e “se abrandou” mantém a imagem hebraica sem sugerir necessariamente extinção total. O ponto e vírgula organiza com naturalidade a sequência narrativa.
