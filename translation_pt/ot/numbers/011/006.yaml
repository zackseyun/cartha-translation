  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: pt
  text: Mas agora estamos definhando[a]; não há absolutamente nada, a não ser o maná diante dos nossos olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nossa alma está ressequida”; o hebraico נֶפֶשׁ (néfesh) pode significar “alma”, “vida” ou, em contextos relacionados à comida, “apetite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mas agora
  rationale: No contexto da queixa, a conjunção com o advérbio temporal introduz contraste com a situação anterior; “Mas agora” expressa isso naturalmente.
- source_word: נַפְשֵׁנוּ
  choice: o nosso apetite
  rationale: Embora נֶפֶשׁ possa significar “alma” ou “vida”, em contexto de comida e desejo pode referir-se ao apetite; essa acepção se ajusta à queixa alimentar sem eliminar a alternativa literal, registrada em nota.
- source_word: יְבֵשָׁה
  choice: está ressequido
  rationale: O adjetivo descreve um estado de secura ou definhamento. “Está ressequido” preserva a imagem concreta e soa dignificado em português.
- source_word: אֵין כֹּל
  choice: não há absolutamente nada
  rationale: A formulação mantém a ênfase da negação acompanhada de כֹּל.
- source_word: בִּלְתִּי אֶל
  choice: a não ser
  rationale: 'A expressão marca exclusão: nada está disponível, exceto um único alimento.'
- source_word: הַמָּן
  choice: o maná
  rationale: O artigo hebraico indica o alimento específico e conhecido; “o maná” o representa sem acrescentar o demonstrativo “este”, ausente do texto-fonte.
- source_word: עֵינֵינוּ
  choice: diante dos nossos olhos
  rationale: Preserva a imagem concreta do que eles veem continuamente diante de si.
