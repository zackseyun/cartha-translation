source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: pt
  text: 'durante um mês inteiro, até que ela lhes saia pelas narinas e se torne repugnante para vocês,[a] porque vocês rejeitaram Yahweh, que está no meio de vocês, e choraram diante dele, dizendo: ‘Por que saímos do Egito?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se torne nojenta para vocês” ou “lhes cause repulsa”. O hebraico expressa forte aversão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: durante um mês inteiro
  rationale: A expressão idiomática indica a duração completa de um mês; esta formulação é natural em português e conserva a ênfase.
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: ela lhes saia pelas narinas
  rationale: O contexto exige o sentido corporal concreto de אַף; “narinas” preserva a imagem gráfica do hebraico. O pronome retoma a carne mencionada no contexto anterior.
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: se torne repugnante para vocês
  rationale: זָרָא expressa forte aversão ou nojo. “Repugnante” comunica isso de modo atual e digno.
- source_word: יַעַן כִּי
  choice: porque
  rationale: A locução introduz a razão do juízo; “porque” é a equivalência moderna mais clara.
- source_word: מְאַסְתֶּם
  choice: vocês rejeitaram
  rationale: O verbo denota rejeição, possivelmente com desprezo; “rejeitaram” preserva a ideia central sem intensificá-la indevidamente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: que está no meio de vocês
  rationale: Refere-se à presença de Yahweh no meio da comunidade, não a uma interioridade individual.
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: e choraram diante dele
  rationale: Preserva tanto a ação de chorar quanto a noção relacional de fazê-lo na presença de Yahweh.
- source_word: לָמָּה זֶּה
  choice: Por que
  rationale: Em português, a pergunta direta transmite naturalmente a queixa. Evita acrescentar uma intensificação sem correspondência inequívoca, embora a partícula זֶה possa dar vivacidade à pergunta.
- source_word: יָצָאנוּ מִמִּצְרָיִם
  choice: saímos do Egito
  rationale: Reproduz de forma direta e idiomática o verbo יצא e mantém a linguagem do êxodo.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
- issue: Sentido da rejeição em מְאַסְתֶּם
  choice: rejeitaram
  alternative: desprezaram
  rationale: “Rejeitaram” conserva a repudição expressa pelo verbo sem decidir que o componente emocional de desprezo deva ser explicitado.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. Emprega “vocês” para o plural e mantém a imagem corporal vívida do hebraico. O trecho começa em continuação sintática do versículo anterior; por isso, inicia com letra minúscula.
