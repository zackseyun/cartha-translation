  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: pt
  text: Então Moisés voltou ao acampamento[a], junto com os anciãos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Então Moisés foi reunido ao acampamento, ele e os anciãos de Israel”. O verbo hebraico pode ser traduzido de modo mais literal, mas, neste contexto, indica que Moisés voltou ao acampamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: voltou
  rationale: O nifal de אסף pode ser traduzido mais literalmente como “foi reunido”, mas aqui expressa, de modo idiomático, o retorno de Moisés ao acampamento após o acontecimento anterior. “Voltou” comunica naturalmente esse sentido em português.
- source_word: אֶל הַמַּחֲנֶה
  choice: ao acampamento
  rationale: אֶל indica direção, e מַחֲנֶה designa o acampamento de Israel. “Ao acampamento” preserva a formulação direta sem especificar além do texto se entraram nele.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: ele e os anciãos de Israel
  rationale: O pronome הוּא tem função enfática ou apositiva e esclarece que Moisés voltou juntamente com os anciãos. A formulação explícita preserva a estrutura e a ênfase do hebraico.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Tradução natural da construção de estado construto, clara e coerente com o uso bíblico corrente em português.
