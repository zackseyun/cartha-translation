- source_word: לֹא אוּכַל אָנֹכִי
  choice: Eu não consigo
  rationale: Expressa naturalmente a incapacidade indicada por לֹא אוּכַל, enquanto o pronome enfático אָנֹכִי é retomado em “eu sozinho”.
- source_word: לְבַדִּי
  choice: eu sozinho
  rationale: Preserva a ênfase separada do hebraico na responsabilidade individual de Moisés, sem reduzi-la apenas a uma locução adverbial.
- source_word: לָשֵׂאת
  choice: carregar
  rationale: Mantém a metáfora concreta de suportar ou levar o peso do povo.
- source_word: כָּבֵד מִמֶּנִּי
  choice: é pesado demais para mim
  rationale: Conserva a imagem do peso e traduz a comparação implícita como excesso além da capacidade do falante.
