id: NUM.11.10
reference: Numbers 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: pt
  text: Moisés ouviu o povo chorando, segundo os seus clãs[a], cada homem à entrada da sua tenda. A ira de Yahweh ardeu intensamente, e aquilo foi mau aos olhos de Moisés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo as suas famílias”. O termo hebraico pode indicar famílias extensas ou clãs.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “isso desagradou a Moisés”. Literalmente: “foi mau aos olhos de Moisés”. O hebraico deixa implícito o que foi considerado mau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu
  rationale: O qal wayyiqtol de שׁמע descreve aqui a percepção do choro do povo; “ouviu” é a forma natural e direta em português.
- source_word: בֹּכֶה
  choice: chorando
  rationale: O particípio apresenta uma ação em curso. “Chorando” é corrente em português e mantém o tom de lamentação.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה pode designar famílias extensas ou grupos de parentesco. “Clãs” expressa a organização coletiva, enquanto a nota registra a alternativa “famílias”.
- source_word: אִישׁ
  choice: cada homem
  rationale: O singular masculino tem valor distributivo, indicando cada indivíduo do grupo sem apagar a forma masculina do hebraico.
- source_word: לְפֶתַח אָהֳלוֹ
  choice: à entrada da sua tenda
  rationale: Preserva de modo idiomático a localização expressa por פֶּתַח, a abertura ou entrada da tenda.
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: A ira de Yahweh ardeu intensamente
  rationale: Mantém a metáfora hebraica da ira que arde e traduz מְאֹד com a forte intensidade exigida pelo contexto.
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: e aquilo foi mau aos olhos de Moisés
  rationale: Conserva o idioma avaliativo hebraico “mau aos olhos de” e não identifica de maneira categórica o referente implícito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino. “Yahweh” o representa por transliteração, sem substituí-lo por um título.
- issue: Referente e força de וּבְעֵינֵי מֹשֶׁה רָע
  choice: aquilo foi mau aos olhos de Moisés
  alternative: isso desagradou a Moisés
  rationale: O hebraico não declara explicitamente o sujeito da avaliação. A redação principal preserva essa abertura e a força de רָע, enquanto a nota oferece o sentido idiomático possível.
- issue: Forma distributiva masculina אִישׁ
  choice: cada homem
  alternative: cada um; todos
  rationale: A escolha reflete o masculino singular distributivo do original sem convertê-lo silenciosamente em uma expressão neutra.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha de perto a progressão hebraica, mas evita rigidez desnecessária.
