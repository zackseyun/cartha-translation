  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: pt
  text: Então Moisés saiu e comunicou ao povo as palavras de Yahweh. Reuniu setenta homens dentre os anciãos do povo e os colocou ao redor da tenda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a tenda”; pelo contexto, provavelmente a tenda do encontro.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: O verbo יצא indica sair do lugar anterior; “saiu” é direto e natural em português.
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: comunicou ao povo as palavras de Yahweh
  rationale: “Comunicou” expressa de modo idiomático o ato de transmitir ao povo, enquanto “as palavras de Yahweh” conserva a formulação concreta do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיֶּאֱסֹף
  choice: reuniu
  rationale: אסף significa reunir ou ajuntar; “reuniu” é natural para convocar um grupo de líderes.
- source_word: שִׁבְעִים אִישׁ
  choice: setenta homens
  rationale: אִישׁ tem sentido coletivo depois do numeral e, neste contexto, refere-se a homens escolhidos entre os anciãos.
- source_word: מִזִּקְנֵי הָעָם
  choice: dentre os anciãos do povo
  rationale: “Dentre” preserva claramente o sentido partitivo de מִן, e “anciãos” designa a função reconhecida no povo.
- source_word: וַיַּעֲמֵד אֹתָם
  choice: os colocou
  rationale: O Hifil de עמד significa literalmente fazê-los ficar de pé ou pô-los em posição; “os colocou” transmite a colocação intencional sem rigidez.
- source_word: סְבִיבֹת הָאֹהֶל
  choice: ao redor da tenda
  rationale: Reproduz o sentido literal sem ampliar “a tenda” para “a tenda do encontro”, identificação provável pelo contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” preserva o nome em transliteração, sem substituí-lo por um título.
- issue: Gênero de אִישׁ em שִׁבְעִים אִישׁ
  choice: setenta homens
  alternative: setenta pessoas
  rationale: A expressão é masculina e o contexto especifica homens escolhidos dentre os anciãos; a tradução mantém essa informação.
- issue: Identidade de הָאֹהֶל
  choice: a tenda
  alternative: a tenda do encontro
  rationale: Embora o contexto provavelmente indique a tenda do encontro, o hebraico deste versículo diz apenas “a tenda”; a tradução preserva essa forma e registra a identificação contextual em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi naturalizada sem perder os elementos concretos do hebraico; evitou-se explicitar no corpo do texto o que permanece apenas provável pelo contexto.
