lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: a ralé
  rationale: O substantivo coletivo é raro e depreciativo. “A ralé” preserva essa conotação e identifica um grupo marginal no acampamento, sem afirmar mais precisamente sua composição, que o termo não esclarece.
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: que estava no meio deles
  rationale: Reproduz de modo natural a localização desse grupo dentro da comunidade de Israel e evita a estranheza da concordância singular presente na forma hebraica.
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: foi tomada por um desejo intenso
  rationale: O verbo e o substantivo cognatos formam uma expressão enfática, literalmente “desejaram um desejo”. A formulação portuguesa comunica a intensidade sem imitar uma repetição pouco natural.
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: voltaram a chorar
  rationale: Neste contexto, שׁוב assinala a retomada da ação de chorar. “Voltaram a chorar” preserva tanto a ideia verbal de retorno quanto o sentido idiomático.
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel também
  rationale: Mantém a expressão filial do hebraico e a partícula inclusiva גם, indicando que os israelitas se juntaram à queixa da ralé.
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: Quem nos dará carne para comer?
  rationale: O causativo de אכל significa fazer comer ou alimentar. A formulação escolhida é corrente em português, preserva o sentido da pergunta e entende בשר corretamente como carne usada para alimento.
