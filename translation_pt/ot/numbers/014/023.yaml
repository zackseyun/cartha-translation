  text: אִם יִרְאוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לַ/אֲבֹתָ֑/ם וְ/כָל מְנַאֲצַ֖/י לֹ֥א יִרְאֽוּ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/023.yaml
  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: pt
  text: eles certamente não verão a terra que jurei dar aos seus pais[a], e nenhum dos que me desprezaram a verá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus antepassados”. Hebraico: “seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: certamente não verão
  rationale: Neste contexto, אִם introduz uma fórmula de juramento com sentido enfaticamente negativo; a tradução explicita a negação exigida pelo português.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da aliança, refere-se à terra prometida; “a terra” preserva a expressão bíblica natural.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לַאֲבֹתָם
  choice: que jurei dar aos seus pais
  rationale: O verbo שבע expressa juramento. “Dar” fica implícito no hebraico pela construção “jurar a terra a alguém” e é explicitado para produzir português natural e deixar claro o conteúdo do juramento.
- source_word: וְכָל מְנַאֲצַי לֹא יִרְאוּהָ
  choice: e nenhum dos que me desprezaram a verá
  rationale: A combinação distributiva com a negação é expressa naturalmente por “nenhum”; נאץ indica tratar com desprezo, e o pronome “a” retoma “a terra”.
theological_decisions:
- issue: Força da fórmula inicial de juramento
  choice: 'Traduzir como negação enfática: “certamente não verão”'
  alternative: 'Traduzir literalmente: “se virem a terra”'
  rationale: Após a declaração solene precedente, אִם funciona como fórmula elíptica de juramento negativo. A tradução literal como condição ocultaria o sentido da sentença divina.
- issue: Sentido de אֲבֹתָם
  choice: “seus pais” no texto principal
  alternative: “seus antepassados”
  rationale: “Pais” preserva a forma masculina e a linguagem patriarcal do hebraico, embora o termo também possa designar os antepassados de modo mais amplo.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A repetição hebraica de “ver” é preservada, e a fórmula de juramento é comunicada por equivalência ótima.
