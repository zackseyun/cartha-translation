  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: pt
  text: Certamente vocês não entrarão na terra sobre a qual levantei a mão, jurando estabelecê-los nela[a], com exceção de Calebe, filho de Jefoné, e Josué, filho de Num.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “a terra sobre a qual levantei a mão para fazê-los habitar nela”. Levantar a mão era um gesto de juramento.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: Certamente vocês não entrarão
  rationale: No contexto de uma declaração divina em forma de juramento, אִם introduz uma negação enfática. A formulação portuguesa comunica essa força sem produzir uma condição incompleta.
- source_word: אֶל הָאָרֶץ
  choice: na terra
  rationale: Com o verbo 'entrar', a preposição portuguesa 'em' expressa naturalmente o movimento para dentro de um território.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: sobre a qual levantei a mão, jurando
  rationale: Preserva a imagem hebraica do gesto de levantar a mão e explicita de modo conciso seu valor cultural de juramento.
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: estabelecê-los nela
  rationale: 'O hifil de שׁכן tem sentido causativo: fazer habitar ou estabelecer. ''Estabelecê-los'' é claro e natural em português.'
- source_word: כִּי אִם
  choice: com exceção de
  rationale: A construção introduz as únicas pessoas excluídas da negação anterior.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Calebe, filho de Jefoné
  rationale: Emprega as formas tradicionais e amplamente reconhecíveis dos nomes bíblicos em português, mantendo o patronímico.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: e Josué, filho de Num
  rationale: Mantém a conjunção e o patronímico, com as formas tradicionais dos nomes em português.
theological_decisions:
- issue: Expressão de juramento e sentença divina
  choice: Certamente vocês não entrarão
  alternative: Se vocês entrarem
  rationale: A leitura condicional isolada obscureceria a função idiomática de אִם no juramento e deixaria a frase truncada. A negação enfática preserva o caráter judicial da declaração.
- issue: Imagem do gesto de juramento
  choice: sobre a qual levantei a mão, jurando
  alternative: que jurei dar a vocês
  rationale: A tradução mantém a imagem concreta do hebraico ao mesmo tempo que esclarece sua função, sem acrescentar explicitamente o verbo 'dar', que não aparece neste versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por 'vocês' como plural de segunda pessoa e pelas formas bíblicas tradicionais dos nomes. A sintaxe conserva a solenidade da sentença sem soar arcaica.
