  source_fidelity: A tradução reproduz corretamente a negação enfática da fórmula de juramento inicial (אִם), o movimento de entrada na terra, a imagem de levantar a mão como gesto de juramento, o sentido causativo de לְשַׁכֵּן (“estabelecer/fazer habitar”) e a exceção limitada a Calebe e Josué. A explicitação de “jurando” comunica adequadamente o valor idiomático do gesto sem introduzir a ideia não expressa de que a terra seria dada.
  naturalness: O texto é claro, solene e natural em português moderno de ampla compreensão. “Certamente vocês não entrarão” preserva a força judicial da declaração; “com exceção de” é fluente e inequívoco. A construção “levantei a mão, jurando estabelecê-los nela” mantém a imagem hebraica e permanece compreensível graças também à nota.
  terminology: Os nomes tradicionais portugueses — Calebe, Jefoné, Josué e Num — são apropriados. “Terra”, “estabelecê-los” e “filho de” preservam adequadamente o registro bíblico e as relações expressas no hebraico. A nota explica o gesto cultural e fornece uma literalidade útil sem impor interpretação doutrinária.
