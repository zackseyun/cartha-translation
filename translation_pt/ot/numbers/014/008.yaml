  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: pt
  text: Se Yahweh se agrada de nós[a], ele nos fará entrar nesta terra e nos dará esta terra — uma terra que mana leite e mel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tem prazer em nós” ou “nos favorece”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz naturalmente em português a condição expressa no hebraico, sem convertê-la em certeza temporal.
- source_word: חָפֵץ בָּנוּ
  choice: se agrada de nós
  rationale: Preserva o sentido de prazer, satisfação e disposição favorável; é natural e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: ele nos levará para esta terra
  rationale: Expressa a consequência futura da condição e o movimento rumo à terra; em português, 'levar para' é natural neste contexto.
- source_word: וּנְתָנָהּ לָנוּ
  choice: e a dará a nós
  rationale: Traduz diretamente נתן e torna explícito que o pronome feminino retoma 'terra', preservando também a ênfase do complemento 'a nós'.
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: Mantém a repetição apositiva de 'terra' e reproduz de modo consagrado e compreensível a imagem hebraica de fertilidade e abundância.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o tetragrama como nome próprio. 'Yahweh' oferece uma transliteração amplamente reconhecida e evita substituí-lo pelo título 'SENHOR'.
- issue: Natureza da condição expressa por אִם
  choice: Se Yahweh se agrada de nós
  alternative: Quando Yahweh se agradar de nós
  rationale: 'A forma condicional preserva a tensão genuína do discurso: a entrada na terra é apresentada como dependente da disposição favorável de Yahweh, sem transformar a frase numa simples indicação temporal.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção 'mana leite e mel' preserva a imagem bíblica tradicional sem soar arcaica; o travessão destaca a explicação apositiva final.
