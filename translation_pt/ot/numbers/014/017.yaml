  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: pt
  text: 'E agora, por favor, que seja grande o poder do Senhor, assim como falaste, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção ו quanto o marcador temporal e discursivo עתה, introduzindo o apelo de Moisés.
- source_word: יִגְדַּל
  choice: que seja grande
  rationale: O jussivo qal expressa um pedido ou desejo. A formulação mantém de perto a imagem hebraica sem decidir entre aumento e manifestação pública da grandeza.
- source_word: נָא
  choice: por favor
  rationale: Reproduz em português atual a força suplicante da partícula de pedido.
- source_word: כֹּחַ
  choice: poder
  rationale: Abrange a capacidade e força divina para agir, adequando-se ao contexto de juízo e misericórdia.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Traduz o título divino אֲדֹנָי de modo natural e distingue-o, no nível da fonte, do nome YHWH.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Expressa claramente a correspondência entre o pedido de Moisés e a declaração anterior de Deus.
- source_word: דִּבַּרְתָּ
  choice: falaste
  rationale: Traduz o perfeito na segunda pessoa masculina singular dirigido a Deus; o pretérito perfeito simples é natural em português e conserva o registro digno.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a citação divina apresentada no versículo seguinte.
theological_decisions:
- issue: Sentido de יִגְדַּל aplicado ao poder do Senhor
  choice: que seja grande
  alternative: seja engrandecido
  rationale: A opção principal conserva a formulação mais direta do qal e a tensão entre a grandeza inerente do poder divino e sua demonstração na resposta pedida, sem resolver a frase como simples exaltação pública.
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a correspondência tradicional e lexicalmente adequada para o título, sem substituir אֲדֹנָי pelo nome divino YHWH.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe mantém o tom solene de oração e a ligação formal com a fala divina que continua no versículo seguinte.
