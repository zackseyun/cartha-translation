base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: pt
  text: Eu o ferirei com uma peste e o deserdarei[a]; e farei de você uma nação maior e mais poderosa do que ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o desapossarei”. O verbo hebraico pode envolver a ideia de privar alguém de sua herança ou posse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: Eu o ferirei
  rationale: O hifil de נכה significa “ferir, golpear”. O pronome masculino singular preserva a apresentação de Israel como entidade coletiva singular.
- source_word: בַדֶּבֶר
  choice: com uma peste
  rationale: דֶּבֶר designa com frequência uma peste ou epidemia em contextos de juízo; “peste” é claro e corrente em português.
- source_word: וְאוֹרִשֶׁנּוּ
  choice: e o desapossarei
  rationale: O hifil de ירשׁ pode indicar privar alguém de sua posse ou herança. “Desapossar” mantém a ideia ampla de perda da posse sem restringi-la à acepção jurídica de deserdar.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: e farei de você uma nação
  rationale: A construção expressa fazer de alguém algo; esta formulação é natural em português e conserva “nação” como equivalente direto de גּוֹי.
- source_word: גָּדוֹל וְעָצוּם מִמֶּנּוּ
  choice: maior e mais poderosa do que ele
  rationale: A expressão com מִן estabelece comparação. “Poderosa” representa a força ou grandeza de עָצוּם, enquanto o singular “ele” mantém Israel como referente coletivo.
theological_decisions:
- issue: Referente dos sufixos masculinos singulares
  choice: Manter os pronomes no singular (“o”; “ele”), apresentando Israel como povo coletivo singular.
  alternative: Empregar o plural (“os”; “eles”) para tornar explícita a referência às pessoas de Israel.
  rationale: O hebraico usa reiteradamente a terceira pessoa masculina singular. A tradução conserva essa retórica coletiva sem converter silenciosamente o referente em plural.
- issue: Sentido de ירשׁ neste contexto
  choice: Traduzir por “desapossarei” no texto principal.
  alternative: “deserdarei”.
  rationale: O verbo comporta tanto a ideia de retirar a posse quanto conotações de herança. “Desapossar” é mais abrangente, e a alternativa que destaca a herança é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal padrão. O singular coletivo foi preservado, embora soe mais marcado em português, para refletir a forma hebraica e sua tensão retórica.
