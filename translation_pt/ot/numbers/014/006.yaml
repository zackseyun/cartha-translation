source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/כָלֵב֙ בֶּן יְפֻנֶּ֔ה מִן הַ/תָּרִ֖ים אֶת הָ/אָ֑רֶץ קָרְע֖וּ בִּגְדֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: pt
  text: Josué, filho de Num, e Calebe, filho de Jefoné, que estavam entre os que haviam explorado a terra[a], rasgaram as próprias roupas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido de forma mais literal: “dentre os que haviam explorado a terra”. A preposição hebraica indica que Josué e Calebe faziam parte do grupo de exploradores.'
    reason: lexical_alternative
  - marker: b
    text: Rasgar as próprias roupas era um sinal costumeiro de profunda tristeza, horror ou aflição.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Mantém a identificação patronímica formal e usa as formas portuguesas consagradas dos nomes.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: e Calebe, filho de Jefoné
  rationale: A conjunção liga Calebe a Josué como sujeito conjunto; o patronímico é preservado de modo claro e natural.
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: que estavam entre os que haviam explorado a terra
  rationale: מִן tem sentido partitivo, indicando que Josué e Calebe pertenciam ao grupo dos exploradores. O mais-que-perfeito composto expressa naturalmente que a exploração ocorreu antes desta ação.
- source_word: קָרְעוּ
  choice: rasgaram
  rationale: Verbo direto e atual que reproduz o sentido de romper ou rasgar intencionalmente.
- source_word: בִּגְדֵיהֶם
  choice: as próprias roupas
  rationale: Expressa de forma idiomática o sufixo possessivo hebraico e deixa claro que cada um rasgou as roupas que vestia, sem recorrer ao termo mais formal “vestes”.
