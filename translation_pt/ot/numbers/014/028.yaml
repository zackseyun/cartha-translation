  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: pt
  text: 'Diga-lhes: “Tão certo como eu vivo”, declara o SENHOR, “certamente farei com vocês como vocês falaram aos meus ouvidos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: Tão certo como eu vivo
  rationale: Expressa de modo natural em português a fórmula hebraica de juramento divino, preservando sua força asseverativa.
- source_word: נְאֻם יְהוָה
  choice: declara o SENHOR
  rationale: Mantém a fórmula profética e segue a convenção de representar o nome divino pelo título SENHOR em versaletes.
- source_word: אִם לֹא
  choice: '[força asseverativa incorporada em “Tão certo”]'
  rationale: Neste contexto de juramento, a construção introduz enfaticamente aquilo que Deus certamente fará; sua força é comunicada pela fórmula portuguesa completa sem acrescentar um advérbio redundante.
- source_word: בְּאָזְנָי
  choice: aos meus ouvidos
  rationale: Conserva a imagem concreta do hebraico, inteligível em português, em vez de reduzi-la simplesmente a “na minha presença”.
- source_word: כֵּן אֶעֱשֶׂה לָכֶם
  choice: assim farei com vocês
  rationale: Preserva a correspondência enfática entre as palavras do povo e a ação divina.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Adota a convenção bíblica portuguesa amplamente reconhecida sem introduzir uma preferência denominacional; as versaletes sinalizam que o hebraico traz o nome divino.
- issue: Caráter judicial da declaração
  choice: Manter a relação direta entre o que o povo disse e o que Deus fará
  alternative: Explicitar o conteúdo da sentença a partir do contexto
  rationale: O versículo formula a sentença por correspondência e não repete aqui seu conteúdo; a tradução preserva essa concisão e tensão contextual.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural “vocês”. A repetição “assim como... assim...” reproduz deliberadamente a estrutura correlativa e enfática do hebraico.
