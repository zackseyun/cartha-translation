  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: pt
  text: Porque Yahweh não foi capaz de levar este povo à terra que lhes havia prometido sob juramento[a], ele os massacrou no deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à terra que havia jurado dar-lhes”. Mais literalmente: “à terra que lhes havia jurado”.'
    reason: Alternativa lexical para a construção hebraica elíptica.
lexical_decisions:
- source_word: מִבִּלְתִּי
  choice: Porque ... não
  rationale: No contexto, introduz a explicação que as nações dariam; a construção distribuída é natural em português e mantém a alegação de incapacidade.
- source_word: יְכֹלֶת
  choice: foi capaz
  rationale: Expressa capacidade ou possibilidade, sem acrescentar uma explicação teológica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לְהָבִיא
  choice: levar ... à
  rationale: O hifil de בוא significa fazer entrar ou levar; com destino, esta formulação é clara e idiomática em português.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o substantivo coletivo singular e sua força retórica.
- source_word: אֶל הָאָרֶץ
  choice: à terra
  rationale: Indica o destino pretendido de modo natural; a ideia de entrada decorre do verbo causativo.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: que lhes havia prometido sob juramento
  rationale: Torna idiomática em português a expressão elíptica 'que jurou a eles', preservando a noção de compromisso solene sem inserir explicitamente 'dar' no texto principal.
- source_word: וַיִּשְׁחָטֵם
  choice: ele os massacrou
  rationale: Preserva a força severa de שׁחט, mais intensa que simplesmente 'matou'.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, 'deserto' comunica naturalmente a região erma do percurso de Israel.
theological_decisions:
- issue: A acusação das nações acerca da capacidade de Yahweh
  choice: Porque Yahweh não foi capaz...
  alternative: Por não ter Yahweh capacidade...
  rationale: O versículo reproduz a alegação que as nações fariam, e não uma afirmação editorial de limitação divina; a tradução mantém essa tensão retórica sem suavizá-la.
- issue: Objeto implícito do juramento
  choice: que lhes havia prometido sob juramento
  alternative: que havia jurado dar a eles
  rationale: A formulação escolhida comunica o compromisso relativo à terra, mas evita tornar explícito no texto principal o verbo 'dar', que está apenas implícito no hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém 'Yahweh' como nome próprio, 'este povo' como coletivo singular e a linguagem forte da acusação.
