  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: pt
  text: Pois todos os homens que viram a minha glória e os sinais que fiz no Egito e no deserto, e me puseram à prova estas dez vezes, e não deram ouvidos à minha voz[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não obedeceram à minha voz”. A expressão hebraica “dar ouvidos à minha voz” também pode ter o sentido de atender ou obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão que fundamenta o juramento e o juízo divinos no contexto anterior.
- source_word: כָל הָאֲנָשִׁים
  choice: todos os homens
  rationale: Preserva a referência masculina específica de אֲנָשִׁים no contexto da geração adulta julgada.
- source_word: הָרֹאִים
  choice: que viram
  rationale: A oração relativa descreve os homens por sua experiência passada; o pretérito perfeito é natural em português.
- source_word: כְּבֹדִי
  choice: a minha glória
  rationale: Mantém o termo tradicional e apropriado para a manifestação da glória divina.
- source_word: אֹתֹתַי
  choice: os sinais
  rationale: Preserva a função indicativa e probatória dos atos, sem interpretá-los apenas como milagres.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: que fiz
  rationale: Tradução direta e idiomática do verbo עשה.
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: no Egito e no deserto
  rationale: Em português corrente, 'deserto' expressa naturalmente o מִדְבָּר da narrativa do êxodo.
- source_word: וַיְנַסּוּ אֹתִי
  choice: e me puseram à prova
  rationale: Expressa com clareza o sentido de נסה como testar ou provar Deus.
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: estas dez vezes
  rationale: Conserva a força deítica de זֶה, destacando a repetição concreta das provocações.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: e não deram ouvidos à minha voz
  rationale: Preserva a imagem do idioma hebraico e, em português, comunica naturalmente a ideia de não atender ou obedecer.
theological_decisions:
- issue: Autorreferência divina e discurso da aliança
  choice: 'Manter a fala divina em primeira pessoa: ''minha glória'', ''os sinais que fiz'' e ''minha voz''.'
  alternative: Expandir a fala com explicações teológicas.
  rationale: O hebraico apresenta diretamente a voz de Deus; nenhuma ampliação doutrinária é necessária.
- issue: Referência de gênero em הָאֲנָשִׁים
  choice: todos os homens
  alternative: todas as pessoas
  rationale: O substantivo e o contexto apontam especificamente para os homens da geração submetida ao juízo, não para a humanidade em geral.
- issue: Sentido de שׁמע בקול
  choice: não deram ouvidos à minha voz
  alternative: não obedeceram à minha voz
  rationale: A formulação escolhida conserva o idioma hebraico, enquanto a nota registra explicitamente seu possível sentido de obedecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção permanece incompleta no fim, marcada por travessão, porque a sentença e o juramento continuam no versículo seguinte.
