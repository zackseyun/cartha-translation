  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: pt
  text: Não subam, pois Yahweh não está no meio de vocês[a], para que não sejam derrotados[b] diante dos seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “abatidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: Não subam
  rationale: A partícula אַל com a forma verbal seguinte expressa proibição. “Subir” preserva o sentido básico de עלה e se ajusta ao avanço militar e geográfico do contexto.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da proibição de modo claro, conciso e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּקִרְבְּכֶם
  choice: no meio de vocês
  rationale: Preserva a imagem espacial e comunitária de קֶרֶב, indicando a ausência da presença divina no meio do povo.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: para que não sejam derrotados
  rationale: No contexto da advertência, a coordenação negativa indica a consequência a ser evitada. O nifal de נגף pode designar ser golpeado ou sofrer derrota em combate.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: diante dos seus inimigos
  rationale: Equivalência corrente e fiel da expressão hebraica em contexto militar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” conserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido da presença divina em בְּקִרְבְּכֶם
  choice: não está no meio de vocês
  alternative: não está entre vocês; não está com vocês
  rationale: A formulação mantém o sentido comunitário e espacial do hebraico sem ampliar a declaração para além do que o verso afirma.
- issue: Força de וְלֹא תִּנָּגְפוּ
  choice: para que não sejam derrotados
  alternative: e não sejam abatidos; para não serem golpeados
  rationale: A tradução preserva a advertência sobre a consequência militar sem decidir se נגף enfatiza apenas a derrota ou também o abatimento físico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o plural “vocês”, o nome divino “Yahweh” e a imagem de presença “no meio” da comunidade.
