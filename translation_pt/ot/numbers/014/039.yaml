  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: pt
  text: Moisés falou estas palavras a todos os filhos de Israel[a], e o povo lamentou muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a todos os israelitas”; tradicionalmente, “a todos os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: Traduz diretamente o piel narrativo de דבר como ato de comunicação, sem acrescentar nuances como “declarou” ou “anunciou”.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: No contexto, refere-se ao pronunciamento divino que Moisés acaba de transmitir; “palavras” preserva o sentido verbal de דְּבָרִים.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: a todos os filhos de Israel
  rationale: Preserva a forma do etnônimo hebraico e sua linguagem pactual; uma nota apresenta a alternativa portuguesa mais corrente.
- source_word: וַיִּתְאַבְּלוּ
  choice: ficou profundamente consternado
  rationale: O hitpael de אבל indica entrar em estado de luto ou profunda aflição. Em português atual, “ficou profundamente consternado” comunica naturalmente a reação coletiva à sentença, sem sugerir necessariamente um rito fúnebre.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente coletivo natural de עָם; a concordância no singular é idiomática em português.
- source_word: מְאֹד
  choice: profundamente
  rationale: Reproduz a intensa força adverbial de מְאֹד em combinação natural com “consternado”.
