  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: pt
  text: Aqueles homens que haviam espalhado um relato ruim sobre a terra morreram pela praga diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: morreram
  rationale: O wayyiqtol qal de מות relata a morte como o acontecimento seguinte da narrativa; em português, a conjunção inicial pode ser omitida com naturalidade sem perder a sequência contextual.
- source_word: הָאֲנָשִׁים
  choice: aqueles homens
  rationale: A expressão definida retoma os homens mencionados no contexto anterior; “aqueles homens” torna clara essa referência anafórica.
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: que haviam espalhado um relato ruim sobre a terra
  rationale: O particípio caracteriza os homens por uma ação anterior. הוציא, neste contexto, indica fazer circular ou divulgar o relato, e דִבָּה designa um relato depreciativo ou difamatório. O mais-que-perfeito composto explicita com naturalidade a anterioridade.
- source_word: רָעָה
  choice: ruim
  rationale: O adjetivo qualifica o relato como prejudicial e censurável; “ruim” mantém linguagem corrente sem ampliar necessariamente o sentido para “maligno”.
- source_word: בַּמַּגֵּפָה
  choice: pela praga
  rationale: A preposição בְּ indica aqui o meio pelo qual morreram, e o artigo definido do hebraico é preservado.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa presença ou comparecimento perante alguém; “diante de” preserva a solenidade e a ideia de que o juízo ocorreu na presença de Yahweh.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” representa o nome de aliança como nome próprio, em vez de substituí-lo por um título.
- issue: Natureza moral do relato em דִבַּת הָאָרֶץ רָעָה
  choice: um relato ruim sobre a terra
  alternative: um relato maligno ou difamatório sobre a terra
  rationale: A construção tem força negativa e pode sugerir difamação, mas o verso não exige que se explicite toda essa avaliação em um termo teológico mais forte. A formulação preserva a amplitude contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Espalhado” é mais idiomático em português para a divulgação de um relato do que uma reprodução literal de “feito sair”; “diante de Yahweh” conserva a linguagem bíblica solene.
