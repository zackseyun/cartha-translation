source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: pt
  text: Yahweh é paciente e rico em amor leal[a], perdoa a iniquidade e a transgressão[b], mas de modo algum deixa impune[c], fazendo recair a iniquidade dos pais sobre os filhos, até a terceira e a quarta geração[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande em fidelidade à aliança”, “rico em misericórdia” ou “abundante em amor constante”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico traduzido por “perdoa” significa literalmente “carrega” ou “leva” a iniquidade e a transgressão.
    reason: lexical_alternative
  - marker: c
    text: Ou “de modo algum absolve”. A construção hebraica intensifica a negação.
    reason: lexical_alternative
  - marker: d
    text: No hebraico, “a terceira e a quarta” refere-se a gerações.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
- source_word: אֶרֶךְ אַפַּיִם
  choice: é paciente
  rationale: Equivalente idiomático natural para a expressão hebraica literalmente ligada a demorar a irar-se.
- source_word: רַב חֶסֶד
  choice: rico em amor leal
  rationale: Expressa tanto a abundância indicada por רַב quanto a dimensão relacional, fiel e misericordiosa de חֶסֶד.
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: perdoa a iniquidade e a transgressão
  rationale: נשא com termos de pecado pode significar carregar, remover ou perdoar; aqui, no enunciado sobre a misericórdia divina, 'perdoa' comunica naturalmente o sentido sem apagar a imagem lexical, registrada em nota.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: mas de modo algum deixa sem punição
  rationale: A construção intensiva nega enfaticamente que Deus deixe impune. Esta formulação evita acrescentar no corpo do texto um objeto que não está explícito no hebraico.
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: castiga a iniquidade dos pais nos filhos
  rationale: Neste contexto judicial, פקד indica fazer recair punição ou consequências; 'castiga' é claro em português, enquanto a formulação mantém o objeto 'iniquidade' e a tensão do original.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: até a terceira e a quarta geração
  rationale: O hebraico emprega numerais elípticos; 'geração' é suprido para tornar explícito o referente natural da expressão.
theological_decisions:
- issue: Justiça divina e punição intergeracional
  choice: Manter lado a lado o perdão divino, a certeza da punição e a iniquidade dos pais alcançando os filhos até a terceira e a quarta geração.
  alternative: Interpretar a frase apenas como consequências naturais ou harmonizá-la explicitamente com textos sobre responsabilidade individual.
  rationale: O hebraico apresenta essa tensão sem explicar aqui o mecanismo ou os limites; a tradução não deve resolvê-la por via interpretativa.
- issue: Objeto implícito em וְנַקֵּה לֹא יְנַקֶּה
  choice: Traduzir sem inserir 'o culpado' no texto principal.
  alternative: De modo algum absolve o culpado.
  rationale: A ideia judicial está presente, mas o objeto não é expresso no hebraico. 'Deixa sem punição' preserva a força da negação sem tornar explícito no corpo aquilo que permanece implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Yahweh' preserva o nome divino; 'amor leal' evita linguagem excessivamente arcaica. A pontuação mantém unidas a misericórdia e a justiça sem suavizar sua tensão.
