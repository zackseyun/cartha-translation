base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: pt
  text: 'Neste deserto cairão os seus cadáveres[a]: todos vocês que foram contados[b], conforme o número total de vocês, de vinte anos para cima, que murmuraram contra mim[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cairão os seus corpos mortos”. O hebraico emprega uma expressão vívida e concreta, destacando a morte física no deserto.'
    reason: lexical_alternative
  - marker: b
    text: “Foram contados” refere-se aos inscritos no recenseamento ou convocação.
    reason: cultural_note
  - marker: c
    text: 'Ou: “que se queixaram contra mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: Neste deserto
  rationale: מִדְבָּר designa uma região erma ou desértica. “Deserto” é natural em português e preserva o cenário geográfico do juízo.
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: cairão os seus cadáveres
  rationale: 'Mantém a imagem concreta e severa do hebraico: נפל significa “cair”, e פגר indica cadáver ou corpo morto.'
- source_word: וְכָל פְּקֻדֵיכֶם
  choice: todos vocês que foram contados
  rationale: A expressão se refere aos recenseados, isto é, aos inscritos na contagem ou convocação; a formulação é clara sem perder o contexto censitário.
- source_word: לְכָל מִסְפַּרְכֶם
  choice: conforme o número total de vocês
  rationale: 'Preserva a ideia de abrangência: todos os que compunham o total registrado no recenseamento.'
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: de vinte anos para cima
  rationale: É uma forma portuguesa corrente de expressar o limite etário inclusivo da fórmula hebraica.
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: que murmuraram contra mim
  rationale: No ciclo do deserto, o verbo descreve queixa rebelde. “Murmuraram” preserva essa conotação e é reconhecível no registro bíblico sem ser obscuro.
theological_decisions:
- issue: Caráter concreto da linguagem de juízo
  choice: cairão os seus cadáveres
  alternative: vocês morrerão
  rationale: A tradução conserva a referência explícita aos corpos mortos e a imagem de sua queda no deserto, sem reduzir a força física e judicial do hebraico a uma afirmação genérica de morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência, mas a abrangência da contagem, o limite etário e a força concreta do juízo foram preservados. Os marcadores aparecem junto às expressões que esclarecem.
