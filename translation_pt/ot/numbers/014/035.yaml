source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: pt
  text: 'Eu, Yahweh, falei. Certamente[a] farei isso a toda esta comunidade perversa que se reuniu contra mim: neste deserto chegarão ao fim, e ali morrerão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “Certamente” significa literalmente “se não” e funciona aqui como uma fórmula de juramento que expressa forte certeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: O perfeito expressa uma declaração divina já proferida; o pretérito perfeito é solene e natural em português.
- source_word: אִם לֹא
  choice: Certamente
  rationale: A expressão funciona aqui como fórmula de juramento e comunica forte certeza, não uma condição em aberto.
- source_word: הָעֵדָה הָרָעָה
  choice: esta comunidade perversa
  rationale: “Comunidade” expressa o conjunto reunido de Israel sem sugerir uma instituição eclesiástica posterior; “perversa” mantém a avaliação moral de רָעָה.
- source_word: הַנּוֹעָדִים עָלָי
  choice: que se reúne contra mim
  rationale: Expressa a ação coletiva e a oposição indicada por עָלַי, com concordância natural com o coletivo singular “comunidade” em português.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: neste deserto
  rationale: “Deserto” é a forma corrente e clara em português para o espaço ermo referido por מִדְבָּר.
- source_word: יִתַּמּוּ
  choice: chegarão ao fim
  rationale: Preserva a ideia de serem consumidos ou acabarem sem fundi-la com a declaração explícita de que morrerão.
- source_word: וְשָׁם יָמֻתוּ
  choice: e ali morrerão
  rationale: Mantém a referência enfática ao lugar do juízo e a cláusula distinta do verbo anterior.
theological_decisions:
- issue: Sentido da fórmula אִם לֹא
  choice: 'Afirmação enfática: “Certamente farei isso”'
  alternative: 'Forma condicional literal: “se eu não fizer isso”'
  rationale: No contexto, a fórmula hebraica tem força de juramento divino. A tradução idiomática comunica essa certeza sem criar uma condição inexistente.
- issue: Designação coletiva עֵדָה
  choice: comunidade
  alternative: congregação; assembleia
  rationale: “Comunidade” preserva o sentido corporativo do grupo reunido e evita associações eclesiásticas desnecessárias.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem inicial “Eu, Yahweh” preserva a ênfase solene do hebraico; os dois verbos finais permanecem distintos para conservar o paralelismo e a progressão do juízo.
