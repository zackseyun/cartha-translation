  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: pt
  text: Os amalequitas e os cananeus habitam no vale. Amanhã, mudem de direção e partam para o deserto pelo caminho do mar Vermelho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mar de Juncos”. Tradicionalmente traduzido como “mar Vermelho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: Os amalequitas e os cananeus
  rationale: Os gentílicos no singular com artigo têm sentido coletivo; o plural é a forma natural em português. O וְ inicial não exige um marcador temporal ou discursivo explícito.
- source_word: יוֹשֵׁב בָּעֵמֶק
  choice: habitam no vale
  rationale: O particípio indica residência contínua. “Habitam” comunica esse sentido com clareza e dignidade; עֵמֶק é traduzido diretamente por “vale”.
- source_word: מָחָר
  choice: Amanhã
  rationale: O advérbio aponta de modo direto para o dia seguinte.
- source_word: פְּנוּ
  choice: mudem de direção
  rationale: O imperativo ordena uma mudança de rumo sem explicitar, por si só, que deveriam voltar; a tradução evita acrescentar essa ideia contextual ao verbo.
- source_word: וּסְעוּ לָכֶם
  choice: e partam
  rationale: נסע, em contexto de viagem, indica levantar acampamento e pôr-se a caminho. O dativo לָכֶם confere envolvimento ou ênfase, mas vertê-lo literalmente como “para vocês mesmos” seria pouco natural e possivelmente enganoso em português.
- source_word: הַמִּדְבָּר
  choice: para o deserto
  rationale: מִדְבָּר designa a região erma para a qual o povo deve seguir. “Deserto” é corrente e claro em português, sem exigir que se imagine apenas um mar de areia.
- source_word: דֶּרֶךְ יַם סוּף
  choice: pelo caminho do mar Vermelho
  rationale: דֶּרֶךְ indica a rota a seguir. A designação tradicional “mar Vermelho” é mantida no texto, enquanto o sentido mais literal de יַם סוּף é informado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no plural dirigidas ao povo. Evitou-se um conectivo inicial sem equivalente necessário e também a tradução rígida do dativo idiomático לָכֶם. O marcador da nota foi colocado junto a “mar Vermelho”, expressão à qual a nota se refere.
