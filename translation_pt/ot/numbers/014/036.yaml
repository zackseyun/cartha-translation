  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: pt
  text: Os homens que Moisés enviou para explorar a terra voltaram e fizeram toda a comunidade murmurar contra ele, espalhando um relato negativo sobre a terra[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fazer o reconhecimento da terra”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazendo circular um relato difamatório sobre a terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Os homens
  rationale: O waw conecta este versículo ao contexto anterior, mas não exige um marcador discursivo explícito em português; a abertura direta é natural.
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: que Moisés enviou
  rationale: Reproduz com clareza a oração relativa e a função de objeto do antecedente.
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: para explorar a terra
  rationale: תור denota examinar ou reconhecer o território. “Explorar” é corrente e não impõe a conotação mais específica de espionagem.
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: Equivalente narrativo direto e natural de שוב.
- source_word: וילונו עָלָיו
  choice: fizeram toda a comunidade murmurar contra ele
  rationale: 'A forma, junto com o objeto direto אֶת כָּל־הָעֵדָה, indica sentido causativo: os homens induziram a comunidade a murmurar contra Moisés.'
- source_word: אֶת כָּל־הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a coletividade de Israel; “comunidade” é claro e amplamente compreensível em português moderno.
- source_word: לְהוֹצִיא דִבָּה
  choice: espalhando um relatório negativo
  rationale: A expressão indica fazer circular uma informação desfavorável ou difamatória. “Espalhando” é idiomático em português e preserva o efeito público do relato.
- source_word: עַל־הָאָרֶץ
  choice: sobre a terra
  rationale: עַל indica aqui o assunto do relatório.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Murmurar” preserva o motivo recorrente das queixas no deserto; “comunidade” evita uma tonalidade eclesiástica excessiva. Os marcadores de nota aparecem no texto principal.
