  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: pt
  text: 'De acordo com o número dos dias em que vocês espiaram a terra, quarenta dias: um dia por um ano, um dia por um ano, vocês carregarão as suas iniquidades por quarenta anos e conhecerão a minha oposição.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o meu afastamento”, “a minha hostilidade” ou “o meu desagrado”. Algumas traduções tradicionais trazem “a quebra da minha promessa”. O termo hebraico é raro e seu sentido é disputado; no contexto, pode referir-se à oposição ou ao afastamento do SENHOR em relação a esta geração rebelde.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: De acordo com o número dos dias
  rationale: A construção com בְּ e מִסְפָּר indica correspondência ou proporção entre os dias da missão e os anos da punição; a formulação mantém essa ligação de modo claro em português.
- source_word: תַּרְתֶּם
  choice: vocês espionaram
  rationale: Neste contexto, o verbo תור designa a missão de reconhecimento em Canaã. “Espionaram” comunica seu caráter específico melhor do que o mais neutro “exploraram”.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se à terra prometida no contexto de Números. “A terra” preserva a expressão bíblica sem explicitação desnecessária.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: um dia por um ano, um dia por um ano
  rationale: Mantém a repetição enfática do hebraico e explicita a correspondência entre os quarenta dias e os quarenta anos.
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: vocês carregarão as suas iniquidades
  rationale: Preserva a imagem concreta e o peso moral da expressão idiomática נשא עון, que abrange tanto a culpa quanto suas consequências.
- source_word: וִידַעְתֶּם
  choice: e conhecerão
  rationale: “Conhecer” preserva a amplitude de ידע, que aqui pode envolver tanto compreensão quanto experiência direta.
- source_word: תְּנוּאָתִי
  choice: a minha oposição
  rationale: O substantivo raro parece indicar oposição, afastamento ou desagrado. “Oposição” se ajusta ao contexto judicial e evita sugerir falsamente que Deus tenha quebrado uma promessa.
theological_decisions:
- issue: Sentido de תְּנוּאָתִי no contexto do juízo divino
  choice: a minha oposição
  alternative: o meu afastamento; a minha hostilidade; o meu desagrado; a quebra da minha promessa
  rationale: A palavra hebraica rara comporta alguma incerteza, preservada em nota. No contexto, ela descreve a postura judicial do SENHOR diante da geração rebelde; “a quebra da minha promessa” poderia sugerir indevidamente infidelidade divina e não é exigida pelo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A repetição enfática do original foi mantida, e travessões organizam a longa relação proporcional sem alterar seu conteúdo.
