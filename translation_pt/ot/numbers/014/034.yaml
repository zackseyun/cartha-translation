  naturalness: “Espionaram a terra” é compreensível, mas “espiaram a terra” é a forma mais idiomática e estabelecida em português bíblico moderno para a missão de reconhecimento. A pontuação pode ser simplificada para tornar a longa frase mais fluida sem reduzir a repetição do original.
  terminology: “Terra”, “iniquidades”, “quarenta anos” e o plural “vocês” são apropriados ao registro. A nota lexical deve evitar apresentar como certo que o sentido tradicional envolve falha divina; o termo raro é disputado, e as alternativas devem permanecer como alternativas.
