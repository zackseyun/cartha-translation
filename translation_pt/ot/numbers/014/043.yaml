source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: pt
  text: Pois os amalequitas e os cananeus estão ali, diante de vocês, e vocês cairão à espada, porque deixaram de seguir Yahweh; e Yahweh não estará com vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da advertência do versículo anterior; “pois” expressa naturalmente a função explicativa.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: os amalequitas e os cananeus
  rationale: Os gentílicos no singular hebraico têm sentido coletivo; o plural é a forma natural em português.
- source_word: שָׁם לִפְנֵיכֶם
  choice: estão ali, diante de vocês
  rationale: Preserva tanto o elemento locativo “ali” como a relação espacial “diante de vocês”.
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: e vocês cairão à espada
  rationale: Mantém a imagem hebraica de cair em combate e usa a expressão portuguesa consagrada “à espada”.
- source_word: כִּי עַל כֵּן
  choice: porque
  rationale: A locução introduz a causa da derrota anunciada; “porque” comunica essa relação sem reproduzir de modo artificial a construção hebraica.
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: deixaram de seguir Yahweh
  rationale: Expressa em português natural o ato de voltar atrás e já não seguir Yahweh, preservando a imagem relacional de seguimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: e Yahweh não estará com vocês
  rationale: Preserva diretamente o futuro e o motivo da presença divina com o povo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente e evita substituí-lo pelo título “SENHOR”.
- issue: Sentido de שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: deixaram de seguir Yahweh
  alternative: afastaram-se de Yahweh
  rationale: A escolha conserva a metáfora de seguir Yahweh, sem reduzir a frase apenas a afastamento espacial ou genérico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” comunica naturalmente o plural de segunda pessoa. A formulação mantém o paralelismo causal e a advertência direta do hebraico.
