  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: pt
  text: 'Mas Moisés disse a Yahweh: “Então os egípcios ouvirão, pois pelo teu poder trouxeste este povo para cima do meio deles.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os egípcios ouviram que pelo teu poder trouxeste este povo para cima do meio deles”. A forma verbal hebraica pode ser entendida como passada ou como resultado futuro no apelo de Moisés; o texto principal adota o sentido voltado para o futuro, que se encaixa no argumento do contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Moisés disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Mas” expressa naturalmente o contraste entre a intercessão de Moisés e o juízo anunciado no versículo anterior.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וְשָׁמְעוּ
  choice: Então os egípcios ficarão sabendo
  rationale: Embora a forma qatal possa ser entendida como passada, no contexto ela funciona naturalmente como resultado futuro do que Deus acaba de propor. “Ficarão sabendo” é idiomático em português para uma notícia que chegará aos egípcios.
- source_word: מִצְרַיִם
  choice: os egípcios
  rationale: O nome pode designar a terra ou o povo; como sujeito de “ouvir/saber”, refere-se naturalmente aos egípcios.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação associada ao que os egípcios ouvirão, preservando de modo conciso a relação argumentativa sem eliminar a possível leitura completiva.
- source_word: הֶעֱלִיתָ
  choice: fizeste ... sair
  rationale: O hifil de עלה significa literalmente “fazer subir/trazer para cima”; no contexto do êxodo, “fizeste sair” comunica com naturalidade em português o movimento para fora do Egito.
- source_word: בְכֹחֲךָ
  choice: pelo teu poder
  rationale: A preposição בְּ marca o meio ou instrumento; a formulação preserva a ênfase na força divina.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o substantivo coletivo singular e o demonstrativo do hebraico.
- source_word: מִקִּרְבּוֹ
  choice: do meio deles
  rationale: O sufixo singular retoma coletivamente o Egito; em português, o plural semântico “deles” remete com clareza aos egípcios.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Valor temporal de וְשָׁמְעוּ
  choice: 'resultado futuro: “Então os egípcios ficarão sabendo”'
  alternative: 'passado: “E os egípcios ficaram sabendo” ou “já souberam”'
  rationale: A leitura futura se ajusta ao argumento de Moisés sobre a reação das nações caso Israel seja destruído, mas a forma hebraica admite leitura passada, registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para fluidez, sem resolver indevidamente a ambiguidade temporal do hebraico; a alternativa consta em nota.
