base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: pt
  text: E por que Yahweh está nos levando para esta terra, para cairmos à espada? Nossas esposas e nossas crianças serão tomadas como despojo.[a] Não seria melhor voltarmos para o Egito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão presa”; o hebraico pode indicar pessoas tomadas pelos inimigos como espólio.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: E por que
  rationale: Mantém a conjunção que liga a queixa ao discurso anterior e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: מֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: está nos levando para esta terra
  rationale: O particípio apresenta a ação como em curso ou iminente; a locução progressiva preserva essa nuance.
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: para cairmos à espada
  rationale: Preserva o idiomatismo hebraico de morrer em combate e continua compreensível em português atual.
- source_word: נָשֵׁינוּ
  choice: nossas mulheres
  rationale: No contexto familiar, refere-se às mulheres dos israelitas, especialmente suas esposas; 'mulheres' é uma forma corrente e não excessivamente interpretativa em português.
- source_word: וְטַפֵּנוּ
  choice: nossas crianças
  rationale: Expressa de modo natural a referência aos pequenos e dependentes, conservando sua vulnerabilidade no contexto.
- source_word: יִהְיוּ לָבַז
  choice: serão levadas como despojo
  rationale: בַּז designa aquilo que inimigos capturam como espólio; a formulação explicita naturalmente que as pessoas seriam levadas.
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: Não seria melhor voltarmos para o Egito?
  rationale: Reproduz a força da pergunta retórica negativa e oferece uma construção idiomática em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal sem substituí-lo por um título nem adotar outra vocalização tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a progressão da queixa hebraica foram preservadas, enquanto a sintaxe foi ajustada para soar natural. O marcador [a] aparece no texto principal.
