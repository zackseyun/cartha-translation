  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: pt
  text: Mas Josué, filho de Num, e Calebe, filho de Jefoné, permaneceram vivos dentre aqueles homens que tinham ido explorar a terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «reconhecer a terra» ou «espiar a terra».
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: Mas Josué
  rationale: A conjunção é traduzida como «Mas» para expressar o contraste contextual com a morte dos demais homens; o nome segue a forma portuguesa consagrada.
- source_word: בִּן נוּן
  choice: filho de Num
  rationale: Reproduz de modo natural a construção hebraica de filiação e usa a forma portuguesa tradicional do nome.
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: e Calebe, filho de Jefoné
  rationale: A conjunção coordena o segundo sobrevivente com Josué; as vírgulas tornam clara a filiação em português.
- source_word: חָיוּ
  choice: permaneceram vivos
  rationale: O qal perfeito de חיה pode significar «viveram» ou «permaneceram vivos»; esta última opção explicita naturalmente o contraste com os outros, que morreram, sem a interpretação adicional de «sobreviveram».
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: dentre aqueles homens
  rationale: מן expressa separação em relação ao grupo maior; «dentre» apresenta Josué e Calebe como as exceções dentro daquele conjunto.
- source_word: הַהֹלְכִים
  choice: que tinham ido
  rationale: O particípio descreve retrospectivamente os homens; o mais-que-perfeito composto é idiomático e situa a missão antes do fato narrado.
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: reconhecer a terra
  rationale: תור designa aqui a missão de percorrer e examinar Canaã. «Reconhecer» é natural no contexto de reconhecimento territorial e evita restringir a ação à espionagem secreta; alternativas legítimas são registradas em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantêm-se a estrutura de filiação e o contraste narrativo, enquanto «reconhecer» comunica a missão de inspeção territorial sem impor uma nuance exclusivamente clandestina.
