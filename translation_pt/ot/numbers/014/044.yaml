  revision_rationale: A revisão preserva todos os elementos do hebraico e torna explícita, em português idiomático, a concessão entre a subida presunçosa e a permanência da arca e de Moisés. Também corrige a nota b para que ela ofereça uma paráfrase construtiva legítima, sem duplicação nem variante artificial do nome divino.
