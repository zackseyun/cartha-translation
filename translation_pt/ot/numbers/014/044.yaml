  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: pt
  text: Mas eles se atreveram a subir ao topo da montanha[a], embora a arca da aliança de Yahweh[b] e Moisés não saíssem do meio do acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agiram presunçosamente ao subir” ou “subiram em desafio”. O verbo hebraico indica uma ação deliberadamente ousada ou presunçosa.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão hebraica também pode ser entendida como: “a arca da aliança pertencente a Yahweh”.'
    reason: alternative_rendering
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: eles se atreveram
  rationale: O verbo expressa uma ação ousada e presunçosa no contexto de desobediência. “Atreveram-se” é natural em português e comunica tanto a ousadia quanto a censura implícita, sem reduzir o termo a mero movimento físico.
- source_word: לַעֲלוֹת
  choice: a subir
  rationale: Reproduz de modo direto e idiomático o movimento ascendente indicado por עלה.
- source_word: אֶל רֹאשׁ הָהָר
  choice: até o topo da montanha
  rationale: רֹאשׁ, literalmente “cabeça”, significa aqui “topo”; הָהָר é mantido no singular como “a montanha”.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Preserva claramente a cadeia construta hebraica, associando a aliança a Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: וּמֹשֶׁה
  choice: e Moisés
  rationale: Emprega a forma portuguesa consagrada do nome próprio.
- source_word: לֹא מָשׁוּ
  choice: não saíram
  rationale: No contexto, מוש indica não se afastar ou não partir do local. “Não saíram” torna explícito em português o sentido de permanência, sem a coloquialidade de “não arredaram pé”.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: do meio do acampamento
  rationale: Equivalente português natural para a ideia de procedência a partir do interior ou meio do acampamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Nuance moral de וַיַּעְפִּלוּ
  choice: eles se atreveram a subir
  alternative: eles agiram presunçosamente ao subir; eles subiram em desafio
  rationale: A escolha comunica ousadia culpável no contexto da desobediência, mas não acrescenta uma caracterização teológica mais específica do que a forma verbal e o contexto sustentam.
- issue: Relação entre a arca, Moisés e o verbo plural לֹא מָשׁוּ
  choice: a arca da aliança de Yahweh e Moisés não saíram
  alternative: nem a arca da aliança de Yahweh nem Moisés saíram
  rationale: 'Mantém ambos como sujeito do verbo plural e preserva o contraste narrativo: o povo avançou sem a presença representada pela arca e sem a liderança de Moisés.'
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Atreveram-se” conserva a censura contextual sem soar excessivamente técnico; “acampamento” é preferido a “arraial” por ser corrente. Todos os marcadores de nota aparecem no texto principal.
