revisions:
- from: Mas eles se atreveram a subir até o topo da montanha[a]. No entanto, a arca da aliança de Yahweh[b] e Moisés não saíram do meio do acampamento.
  to: Mas eles se atreveram a subir ao topo da montanha[a], embora a arca da aliança de Yahweh[b] e Moisés não saíssem do meio do acampamento.
  rationale: A revisão preserva todos os elementos do hebraico e torna explícita, em português idiomático, a concessão entre a subida presunçosa e a permanência da arca e de Moisés. Também corrige a nota b para que ela ofereça uma paráfrase construtiva legítima, sem duplicação nem variante artificial do nome divino.
