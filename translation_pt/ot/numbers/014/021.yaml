  text: וְ/אוּלָ֖ם חַי אָ֑נִי וְ/יִמָּלֵ֥א כְבוֹד יְהוָ֖ה אֶת כָּל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: pt
  text: Contudo, tão certo como eu vivo, a glória do SENHOR encherá toda a terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o território”, caso אֶרֶץ seja entendido em sentido mais local.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאוּלָם
  choice: Contudo
  rationale: Marca forte contraste com o contexto anterior, em linguagem atual e digna.
- source_word: חַי אָ֑נִי
  choice: tão certo como eu vivo
  rationale: Expressa de modo natural em português a fórmula solene de juramento divino, sem reduzir sua força a uma simples afirmação de que Deus vive.
- source_word: וְיִמָּלֵא
  choice: encherá
  rationale: Com כְבוֹד יְהוָה entendido como sujeito, transmite de maneira clara e natural que a glória do SENHOR ocupará toda a terra; a construção hebraica admite uma formulação resultativa próxima de “toda a terra ficará cheia”.
- source_word: כְבוֹד
  choice: glória
  rationale: É a correspondência tradicional e semanticamente adequada para o peso, a majestade, a presença e a reputação divina.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção reverente amplamente reconhecida em português para representar o nome divino, distinguindo-o tipograficamente do título comum “Senhor”.
- source_word: אֶת כָּל הָאָרֶץ
  choice: toda a terra
  rationale: O contexto favorece alcance universal, mas a polissemia de אֶרֶץ é preservada em nota, pois também pode designar um território ou uma região.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: 'alcance universal: “toda a terra”'
  alternative: 'alcance territorial: “todo o território” ou “toda a região”'
  rationale: A declaração solene sobre a glória do SENHOR favorece a leitura universal, sem eliminar a possibilidade lexical de um sentido geográfico mais local.
- issue: Relação sintática entre a glória do SENHOR e toda a terra
  choice: “a glória do SENHOR encherá toda a terra”
  alternative: “toda a terra ficará cheia da glória do SENHOR”
  rationale: A formulação escolhida acompanha a marca de objeto אֶת diante de “toda a terra” e mantém “a glória do SENHOR” como sujeito expresso, embora a forma verbal também permita uma tradução resultativa/passiva.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Tão certo como eu vivo” preserva a natureza de juramento da expressão hebraica; “SENHOR” representa o nome divino.
