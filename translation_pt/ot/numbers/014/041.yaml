  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: pt
  text: 'Mas Moisés disse: “Por que é que vocês estão transgredindo a ordem de Yahweh?[a][b] Isso não terá êxito.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a boca de Yahweh”, expressão que significa aquilo que Yahweh falou ou ordenou.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a palavra de Yahweh”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “Isso não prosperará”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Moisés disse
  rationale: 'O waw consecutivo dá sequência à narrativa, mas o contexto é adversativo: Moisés contesta a iniciativa do povo. Por isso, “Mas” expressa naturalmente a relação contextual.'
- source_word: לָמָה זֶּה
  choice: Por que é que
  rationale: A construção tem força enfática. “Por que é que” preserva essa ênfase em português corrente, sem reproduzir de forma artificial a estrutura hebraica.
- source_word: אַתֶּם עֹבְרִים
  choice: vocês estão transgredindo
  rationale: Com “a boca/ordem de Yahweh” como objeto, עבר não descreve aqui um deslocamento físico, mas o ato de ultrapassar ou violar o que Deus ordenou. “Transgredindo” mantém a gravidade moral da expressão.
- source_word: אֶת פִּי יְהוָה
  choice: a ordem de Yahweh
  rationale: A expressão significa literalmente “a boca de Yahweh”, idioma hebraico que designa aquilo que ele falou ou ordenou. Neste contexto de desobediência a uma instrução divina, “a ordem” comunica o sentido com clareza.
- source_word: וְהִוא
  choice: Isso
  rationale: O pronome feminino retoma provavelmente a ação ou iniciativa militar implícita no contexto. “Isso” é a retomada mais natural em português.
- source_word: לֹא תִצְלָח
  choice: não terá êxito
  rationale: O verbo צלח indica prosperar ou ser bem-sucedido em um empreendimento. “Não terá êxito” é claro, atual e adequado ao tom solene da advertência.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e corresponde de maneira mais provável à sua vocalização antiga, sem substituí-lo por um título.
- issue: Referente de וְהִוא em “não terá êxito”
  choice: A iniciativa do povo, expressa por “Isso”
  alternative: A ordem de Yahweh
  rationale: A forma feminina permite alguma tensão referencial, mas o sentido contextual mais provável é que a tentativa de subir para combater não será bem-sucedida. A tradução evita explicitar “ataque” ou “expedição”, preservando o grau de implicitude do hebraico.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O uso de “vocês” torna o plural explícito e natural. “Por que é que” conserva a ênfase idiomática de לָמָה זֶּה, enquanto “não terá êxito” mantém dignidade sem soar arcaico.
