  text: וַ/תִּשָּׂא֙ כָּל הָ֣/עֵדָ֔ה וַֽ/יִּתְּנ֖וּ אֶת קוֹלָ֑/ם וַ/יִּבְכּ֥וּ הָ/עָ֖ם בַּ/לַּ֥יְלָה הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/001.yaml
  text: Then all the congregation raised their voices and cried out[a], and the people wept that night.
translation:
  language: pt
  text: Então toda a comunidade levantou a voz e deu um grito[a], e o povo chorou naquela noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “levantou [a voz]... e deu sua voz”, expressão que indica um forte clamor coletivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: levantou
  rationale: Preserva a imagem de נָשָׂא, “levantar”, dentro da expressão hebraica relacionada à voz.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel; “toda a comunidade” é natural, atual e mantém כָּל.
- source_word: וַיִּתְּנוּ אֶת־קוֹלָם
  choice: deu um grito
  rationale: A expressão significa literalmente “deram sua voz” e comunica uma manifestação coletiva em voz alta; em coordenação com “levantou a voz”, “deu um grito” preserva o paralelismo sem soar artificial.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalência direta que preserva a variação do hebraico entre “comunidade” e “povo”.
- source_word: וַיִּבְכּוּ
  choice: chorou
  rationale: בכה significa chorar ou prantear; “chorou” distingue o pranto do grito coletivo anterior e é natural em português.
- source_word: בַּלַּיְלָה הַהוּא
  choice: naquela noite
  rationale: Forma idiomática e precisa de expressar a referência temporal hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com concordância coletiva no singular (“toda a comunidade levantou... deu”; “o povo chorou”). A formulação conserva as duas ações paralelas do hebraico e evita confundir o grito inicial com o choro subsequente.
