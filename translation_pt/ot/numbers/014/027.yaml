source:
  edition: WLC
  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: pt
  text: Até quando esta comunidade perversa[b] continuará a murmurar contra mim? Ouvi as queixas dos filhos de Israel[a], com as quais eles murmuram contra mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “congregação perversa” ou “assembleia perversa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressa de modo idiomático a pergunta temporal carregada de indignação; a ideia de continuidade exigida pela construção é explicitada naturalmente no verbo seguinte.
- source_word: לָעֵדָה
  choice: comunidade
  rationale: עֵדָה designa aqui o corpo coletivo de Israel. “Comunidade” é atual e abrangente, enquanto “congregação” e “assembleia” permanecem como alternativas em nota.
- source_word: הָרָעָה הַזֹּאת
  choice: esta comunidade perversa
  rationale: Neste contexto, רָעָה constitui uma avaliação moral, não apenas a descrição de algo ruim. “Perversa” comunica essa censura com naturalidade e dignidade.
- source_word: מַלִּינִים
  choice: murmurar / continuar a murmurar
  rationale: No relato do deserto, a forma verbal descreve queixas reiteradas e rebeldes. “Murmurar” preserva esse valor e permite manter a repetição enfática do hebraico.
- source_word: עָלַי
  choice: contra mim
  rationale: A preposição indica que as murmurações são dirigidas em oposição a Deus, e não apenas proferidas a respeito dele.
- source_word: תְּלֻנּוֹת
  choice: queixas
  rationale: O substantivo designa reclamações verbalizadas. “Queixas” é claro no português atual e distingue o substantivo do verbo repetido.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz a expressão hebraica tradicional e sua forma masculina plural sem ocultar sua formulação, embora no contexto designe coletivamente o povo israelita.
- source_word: שָׁמָעְתִּי
  choice: Ouvi
  rationale: O perfeito hebraico apresenta o ato como realizado e relevante para a resposta divina. O pretérito perfeito português transmite isso naturalmente.
theological_decisions:
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A tradução conserva a forma masculina e genealógica do hebraico, sem sugerir que a denúncia se limite necessariamente aos homens; a expressão funciona como designação coletiva do povo.
- issue: Elipse após עַד מָתַי
  choice: continuará a murmurar
  alternative: Até quando suportarei esta comunidade perversa
  rationale: O hebraico abre com uma construção elíptica. Em vez de inserir “suportarei”, verbo ausente do texto, a tradução completa a pergunta mediante a ação explicitamente presente na oração relativa, preservando a força da indignação sem decidir além da evidência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “murmurar” foi mantida por refletir a insistência retórica do hebraico. “Continuará a” torna idiomática a pergunta elíptica introduzida por “Até quando”, sem acrescentar a ideia interpretativa de Deus “suportar” a comunidade.
