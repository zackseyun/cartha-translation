base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: pt
  text: Mas toda a comunidade disse para apedrejá-los com pedras, e a glória de Yahweh apareceu na tenda do encontro a todos os filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “a todos os israelitas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a comunidade de Israel reunida; “comunidade” é natural no português atual e conserva o sentido coletivo.
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: que os apedrejassem
  rationale: רגם significa apedrejar. O verbo português já expressa o uso de pedras, de modo que repetir “com pedras” seria desnecessariamente redundante. Não se acrescenta “até a morte”, pois isso não está explícito.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כָּבוֹד indica a manifestação visível e majestosa da presença divina; o nome próprio יהוה é transliterado como “Yahweh”.
- source_word: נִרְאָה
  choice: apareceu
  rationale: O nifal de ראה descreve uma manifestação que se torna visível; “apareceu” é direto e natural.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Tradução transparente da designação da tenda sagrada onde Yahweh se encontrava com Israel.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: a todos os filhos de Israel
  rationale: Mantém a forma da expressão nacional hebraica, enquanto a nota oferece o equivalente idiomático em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente.
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A expressão hebraica é uma designação coletiva e nacional. A forma literal é mantida no texto, e a alternativa idiomática é registrada sem limitar a referência aos homens.
- issue: Relação entre as duas orações coordenadas
  choice: Então
  alternative: e; mas então
  rationale: O waw introduz o acontecimento seguinte no momento de crise. “Então” expressa a progressão narrativa sem impor uma oposição mais forte do que a gramática exige.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Apedrejassem” evita a redundância pouco natural de “apedrejassem com pedras”; a referência pronominal a Josué e Calebe é preservada.
