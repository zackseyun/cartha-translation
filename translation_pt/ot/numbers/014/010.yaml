  - severity: low
    issue: «Então» explicita uma relação temporal
    rationale: O waw coordena as orações e assinala progressão narrativa, mas não exige o advérbio temporal. «E» é uma correspondência mais neutra e preserva melhor a ambiguidade da conexão.
