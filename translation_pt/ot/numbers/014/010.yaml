  naturalness: «Toda a comunidade disse para apedrejá-los com pedras» é claro e idiomático em português moderno. A coordenação com «e» reproduz a progressão narrativa do waw sem acrescentar a nuance temporal mais marcada de «Então».
  terminology: «Comunidade», «Yahweh», «glória», «tenda do encontro» e «filhos de Israel» são escolhas adequadas e coerentes com o hebraico e com o registro solicitado. A nota oferece apropriadamente a alternativa idiomática «israelitas».
