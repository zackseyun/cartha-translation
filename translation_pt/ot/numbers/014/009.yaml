  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: pt
  text: Apenas não se rebelem contra Yahweh. Não tenham medo do povo da terra, pois eles são nosso pão[a]. A proteção deles os abandonou[b], e Yahweh está conosco. Não tenham medo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles são o nosso alimento”. O hebraico diz literalmente: “eles são nosso pão”, metáfora que indica que serão facilmente conquistados ou consumidos.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “a sombra deles se retirou de sobre eles”. Aqui, “sombra” provavelmente representa proteção ou abrigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: Introduz uma ressalva enfática e limitadora. “Somente” preserva essa força de modo conciso, sem reduzir o termo a uma simples conjunção adversativa.
- source_word: בַּיהוָה
  choice: contra Yahweh
  rationale: Com o verbo מרד, a preposição בְּ indica aquele contra quem se dirige a rebelião. O nome divino é transliterado como “Yahweh”.
- source_word: תִּמְרֹדוּ
  choice: não se rebelem
  rationale: מרד denota rebelião ou revolta contra uma autoridade; a forma pronominal é idiomática e direta em português.
- source_word: תִּירְאוּ / תִּירָאֻם
  choice: não tenham medo / não tenham medo deles
  rationale: No contexto, ירא expressa medo diante de inimigos. A repetição final do hebraico é mantida.
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Mantém de perto a expressão hebraica, que é clara no contexto e evita explicitar interpretativamente “habitantes”.
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: pois eles são o nosso pão
  rationale: Preserva a metáfora vívida e concisa do hebraico, em vez de explicar no corpo do texto que seriam facilmente conquistados ou consumidos.
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: A proteção que estava sobre eles se retirou
  rationale: צֵל significa literalmente “sombra”, mas aqui representa abrigo ou proteção. A formulação comunica o sentido da imagem e preserva tanto o movimento de retirada quanto a ideia de algo que estava sobre eles.
- source_word: וַיהוָה אִתָּנוּ
  choice: e Yahweh está conosco
  rationale: O waw é vertido simplesmente por “e”, sem impor uma relação adversativa mais forte do que a expressa no hebraico.
theological_decisions:
- issue: Metáfora de conquista em כִּי לַחְמֵנוּ הֵם
  choice: Manter “eles são o nosso pão” no texto principal
  alternative: “eles são o nosso alimento” ou “nós os devoraremos”
  rationale: A metáfora hebraica deve permanecer aberta e vívida; explicá-la como conquista fácil no texto resolveria além do que a forma original declara.
- issue: Sentido metafórico de צִלָּם
  choice: Traduzir o sentido contextual como “a proteção que estava sobre eles”
  alternative: “a sombra deles se retirou de sobre eles”
  rationale: “Sombra” pode não comunicar espontaneamente abrigo ou proteção ao leitor moderno. O sentido contextual aparece no texto, enquanto a imagem literal é registrada em nota.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o nome pessoal da aliança presente na fonte hebraica, sem substituir o nome por um título.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais na terceira pessoa do plural. A sintaxe mantém a exortação enfática e a repetição final do hebraico. As imagens que poderiam ficar obscuras são preservadas ou esclarecidas por notas sem ampliar indevidamente o texto principal.
