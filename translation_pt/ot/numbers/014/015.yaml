  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: pt
  text: 'E, se matares este povo como um só homem[a], as nações que ouviram falar de ti[b] dirão:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como um só homem”, expressão que indica todo o povo em conjunto ou todos de uma só vez.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que ouviram da tua fama”; também pode ser entendido como “que ouviram o relato a teu respeito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: E, se matares
  rationale: O hifil de מות significa “fazer morrer, matar”. Embora וְ seja apenas a conjunção, o contexto iniciado no versículo anterior sustenta em português a formulação condicional “se matares”.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva tanto o sentido coletivo de עָם, referido a Israel, quanto a força do demonstrativo הַזֶּה.
- source_word: כְּאִישׁ אֶחָד
  choice: como se fosse um só homem
  rationale: Mantém a imagem hebraica e comunica a ideia de todo o povo partilhar de uma única sorte, isto é, ser morto em conjunto.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Neste contexto, גּוֹיִם designa as nações ao redor, em contraste com Israel; “gentios” traria associações posteriores desnecessárias.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: que ouviram o que se diz a teu respeito
  rationale: שֵׁמַע pode significar notícia, relato ou fama. A formulação portuguesa preserva a referência ao relato a respeito do SENHOR sem restringi-la apenas à ideia de fama.
- source_word: לֵאמֹר
  choice: 'dirão:'
  rationale: O infinitivo introduz o conteúdo da fala no versículo seguinte; em português, o futuro seguido de dois-pontos faz essa ligação naturalmente.
theological_decisions:
- issue: Forma masculina na expressão idiomática כְּאִישׁ אֶחָד
  choice: como se fosse um só homem
  alternative: todos de uma só vez
  rationale: A expressão é idiomática e não restringe o povo aos homens, mas conservar “homem” preserva a imagem e a força retórica do hebraico; a nota esclarece o sentido coletivo.
- issue: Amplitude semântica de שִׁמְעֲךָ
  choice: o que se diz a teu respeito
  alternative: a tua fama
  rationale: A escolha mantém aberta a tensão lexical entre relato, notícia e reputação, evitando decidir sem necessidade que o termo significa exclusivamente “fama”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a fala dirigida ao SENHOR. A sintaxe mantém a continuidade com o versículo anterior e deixa a declaração das nações em aberto para o versículo seguinte.
