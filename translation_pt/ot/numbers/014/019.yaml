  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: pt
  text: Perdoa, por favor, a iniquidade deste povo, conforme a grandeza do teu amor leal, assim como tens suportado[a] este povo desde o Egito até agora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tens perdoado”. O verbo hebraico pode significar “carregar/suportar” e, em certos contextos, “perdoar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: Perdoa, por favor
  rationale: O imperativo de סלח, acompanhado da partícula נָא, expressa uma súplica insistente e respeitosa. A formulação mantém a força do pedido em português natural.
- source_word: לַעֲוֺן
  choice: a iniquidade
  rationale: עָוֹן pode indicar iniquidade, culpa ou consequências da culpa. Aqui designa a ofensa culpável do povo; “iniquidade” preserva seu peso moral sem limitar indevidamente o sentido.
- source_word: הָעָם הַזֶּה
  choice: deste povo / este povo
  rationale: עַם é um substantivo coletivo singular. “Povo” conserva essa forma e o sentido de comunidade, sem convertê-lo em plural.
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: conforme a grandeza do teu amor leal
  rationale: גֹּדֶל significa “grandeza”, e חֶסֶד denota amor, bondade e lealdade duradoura, frequentemente em contexto de aliança. “Amor leal” preserva essa dimensão melhor que “amor” isoladamente.
- source_word: וְכַאֲשֶׁר
  choice: assim como
  rationale: A expressão introduz uma comparação com a atuação anterior de Deus e fundamenta o pedido de Moisés nesse precedente.
- source_word: נָשָׂאתָה
  choice: tens suportado
  rationale: נשא tem o sentido básico de levantar, carregar ou levar e, em contextos ligados ao pecado, pode significar perdoar. Como o complemento aqui é o próprio povo, “suportado” preserva a ideia de carregá-lo e ter paciência com ele, sem excluir a nuance de perdão.
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: desde o Egito até agora
  rationale: A expressão indica continuidade desde a saída do Egito até o momento presente. “Até agora” comunica naturalmente o valor contextual de הֵנָּה.
theological_decisions:
- issue: Sentido de נָשָׂאתָה no apelo de Moisés
  choice: A ação anterior de Deus é descrita como suportar o povo, abrangendo paciência, sustentação e tolerância misericordiosa.
  alternative: “Tens perdoado este povo”, entendendo נשא diretamente no sentido de perdoar.
  rationale: O complemento é “este povo”, e não “a iniquidade dele”, o que favorece o sentido mais amplo de carregar ou suportar. A nota conserva a leitura de “perdoar”, reconhecida lexicalmente e coerente com o pedido imediato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “tu” em referência a Deus para manter a concordância direta do hebraico e o tom de oração. A colocação da nota junto a “suportado” identifica precisamente a palavra à qual a alternativa se refere.
