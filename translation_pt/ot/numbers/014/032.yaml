  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: pt
  text: Quanto a vocês, porém, os seus cadáveres cairão neste deserto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִגְרֵיכֶם
  choice: os seus cadáveres
  rationale: פֶּגֶר designa o corpo de uma pessoa morta. “Cadáveres” preserva de modo claro e solene a concretude da sentença, sem recorrer ao menos natural “carcaças”.
- source_word: אַתֶּם
  choice: Quanto a vocês, porém
  rationale: O pronome independente é enfático e contrastivo. A construção portuguesa explicita esse contraste, enquanto “porém” também representa o valor contextual do וּ inicial.
- source_word: יִפְּלוּ
  choice: cairão
  rationale: נפל significa literalmente “cair”; no contexto, a morte já está expressa por “cadáveres”, de modo que não é necessário explicitar “morrerão”.
- source_word: בַּמִּדְבָּר
  choice: neste deserto
  rationale: מִדְבָּר refere-se à região desértica em que Israel se encontra. “Deserto” é corrente, natural e adequado ao contexto de Números.
- source_word: הַזֶּה
  choice: neste
  rationale: O demonstrativo identifica o deserto específico em que o povo está, sem acrescentar uma ênfase ausente no hebraico.
theological_decisions:
- issue: Severidade e concretude da imagem de juízo em פִגְרֵיכֶם
  choice: os seus cadáveres
  alternative: os seus corpos mortos; as suas carcaças
  rationale: A tradução mantém a dimensão física e grave do juízo anunciado à geração incrédula. “Cadáveres” é direto e digno; “corpos mortos” é menos idiomático, e “carcaças” acrescentaria em português uma conotação depreciativa mais forte.
translation_notes:
  register: Português moderno, claro e solene, de leitura natural no Brasil e inteligível internacionalmente. A ordem foi ajustada para expressar em português o contraste enfático do pronome hebraico.
