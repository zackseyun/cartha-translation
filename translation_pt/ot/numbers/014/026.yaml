  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/026.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés e a Arão, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido como “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: A forma narrativa com waw introduz um novo ato de fala. “Falou” corresponde naturalmente a דבר nesta fórmula de comunicação divina, enquanto “disse” é possível, mas se ajusta menos à construção com לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: Identifica com clareza os dois destinatários da fala. Em português, não é necessário repetir a preposição antes do segundo nome.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz a fala direta iniciada no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “o SENHOR” representa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação inicial “E” e o particípio verbal “dizendo” conservam a cadência formular do hebraico sem tornar a frase arcaica.
