base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: pt
  text: 'E disseram a toda a comunidade dos filhos de Israel[a]: “A terra pela qual passamos para reconhecê-la[b] é muito, muito boa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a toda a assembleia dos israelitas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “para explorá-la” ou “para espioná-la”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol de אמר dá continuidade à narrativa e introduz a fala direta; “disseram” é a forma natural em português.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: a toda a comunidade dos filhos de Israel
  rationale: “Comunidade” comunica o grupo reunido designado por עֵדָה, enquanto “filhos de Israel” preserva de modo inteligível a expressão hebraica tradicional.
- source_word: לֵאמֹר
  choice: não traduzido separadamente
  rationale: O infinitivo hebraico que introduz discurso é redundante em português antes de uma citação direta.
- source_word: הָאָרֶץ
  choice: A terra
  rationale: Refere-se de modo definido à terra de Canaã em discussão; “terra” é a equivalência usual e adequada ao contexto.
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: pela qual passamos
  rationale: עבר com ב expressa movimento através de um lugar; a formulação portuguesa conserva esse sentido sem rigidez.
- source_word: לָתוּר אֹתָהּ
  choice: para reconhecê-la
  rationale: תור indica a inspeção exploratória do território. “Reconhecer” pode designar a observação prévia de uma região, preservando o caráter de missão de reconhecimento sem limitar o verbo à espionagem.
- source_word: טוֹבָה
  choice: boa
  rationale: Mantém o sentido básico do adjetivo; a intensidade vem dos advérbios repetidos que o seguem.
- source_word: מְאֹד מְאֹד
  choice: muito, muito
  rationale: A repetição reproduz diretamente a ênfase retórica do hebraico, em vez de condensá-la em um único superlativo.
