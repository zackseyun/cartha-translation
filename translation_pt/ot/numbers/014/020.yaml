  text: וַ/יֹּ֣אמֶר יְהוָ֔ה סָלַ֖חְתִּי כִּ/דְבָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: pt
  text: 'Então Yahweh disse: “Eu perdoei, conforme a sua palavra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu concedi perdão, como você falou.”'
    reason: Registra alternativas para סָלַחְתִּי e כִּדְבָרֶךָ sem transformar “a sua palavra/o que você disse” em “o seu pedido”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português sem acrescentar uma relação causal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: סָלַחְתִּי
  choice: Eu perdoei
  rationale: O verbo סלח denota perdoar ou conceder perdão; o pretérito perfeito traduz naturalmente a forma perfeita como ato concluído.
- source_word: כִּדְבָרֶךָ
  choice: conforme a sua palavra
  rationale: Preserva de perto a construção “segundo/conforme a tua palavra” e liga a declaração à intercessão de Moisés.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” preserva esse nome sem substituí-lo por um título.
- issue: Alcance do perdão declarado
  choice: 'Manter a declaração concisa: “Eu perdoei”'
  alternative: Explicitar quem ou quais consequências foram perdoados
  rationale: O versículo não especifica aqui o alcance exato do perdão; o contexto subsequente mantém tensão entre perdão e julgamento. A tradução não deve resolver essa tensão por explicação inserida no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Conforme a sua palavra” mantém certa solenidade bíblica sem soar arcaico; “você” na nota torna explícita a referência singular a Moisés.
