base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: pt
  text: Então os amalequitas e os cananeus que habitavam naquela região montanhosa desceram, os atacaram e os esmagaram até Hormá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hormá é o nome de um lugar; em hebraico, esse nome está relacionado a uma palavra que indica “destruição” ou “consagração à destruição”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceram
  rationale: O verbo singular antes do sujeito composto é uma construção hebraica comum; em português, o plural concorda naturalmente com os dois povos e preserva o movimento descendente desde a região montanhosa.
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: os amalequitas e os cananeus
  rationale: Os gentílicos aparecem morfologicamente no singular, mas têm sentido coletivo; o plural é a forma natural em português e concorda com os verbos seguintes.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: que habitavam naquela região montanhosa
  rationale: יֹשֵׁב indica residência, e הָר pode designar uma montanha ou uma área de relevo elevado; o contexto geográfico e militar favorece 'região montanhosa'.
- source_word: וַיַּכּוּם
  choice: atacaram-nos
  rationale: נכה possui uma faixa semântica que inclui golpear, atacar e derrotar. 'Atacaram-nos' comunica a ação militar sem antecipar toda a força do verbo seguinte.
- source_word: וַיַּכְּתוּם
  choice: os esmagaram
  rationale: O verbo intensifica a ação anterior e transmite a ideia de quebrantar ou esmagar militarmente; a escolha preserva a progressão vívida sem afirmar aniquilação total.
- source_word: עַד הַחָרְמָה
  choice: até Hormá
  rationale: עַד marca o limite ou alcance da derrota, e Hormá é mantido como topônimo transliterado.
