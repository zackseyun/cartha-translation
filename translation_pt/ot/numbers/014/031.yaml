source:
  edition: WLC
  text: וְ/טַ֨פְּ/כֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָ/בַ֣ז יִהְיֶ֑ה וְ/הֵבֵיאתִ֣י אֹתָ֔/ם וְ/יָֽדְעוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: pt
  text: Mas os seus pequeninos, que vocês disseram que seriam tomados como despojo[a], eu os farei entrar, e eles conhecerão[b] a terra que vocês rejeitaram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seriam levados como presa” ou “se tornariam despojo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “experimentarão a terra”. O verbo hebraico traduzido como “conhecerão” pode ter aqui o sentido de conhecer por experiência.
    reason: lexical_alternative
  - marker: c
    text: Ou “desprezaram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: os seus pequeninos
  rationale: טַף designa especialmente crianças pequenas e ressalta sua vulnerabilidade no contexto; “pequeninos” é natural e preserva essa nuance.
- source_word: לָבַז יִהְיֶה
  choice: seriam tomados como despojo
  rationale: בַּז é aquilo que um inimigo toma como saque ou despojo. A formulação portuguesa comunica com clareza o contexto militar e a condição temida pelos pais.
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: eu os farei entrar
  rationale: O hifil de בוא expressa fazer entrar ou introduzir. O destino é a terra mencionada logo depois e pode permanecer implícito, como no hebraico.
- source_word: וְיָדְעוּ
  choice: eles conhecerão
  rationale: יָדַע significa “conhecer” e aqui pode incluir conhecimento por experiência. A tradução formal preserva essa amplitude sem resolver a nuance no corpo do texto.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: O hebraico diz simplesmente “a terra”. O contexto identifica o referente, sem necessidade de acrescentar “prometida” ou “de Canaã”.
- source_word: מְאַסְתֶּם בָּהּ
  choice: que vocês rejeitaram
  rationale: מָאַס pode significar rejeitar, desprezar ou repudiar. “Rejeitaram” expressa a recusa da terra sem tornar obrigatória a nuance emocional mais forte de desprezo.
theological_decisions:
- issue: Explicitar se “a terra” é a terra prometida ou Canaã
  choice: Manter apenas “a terra” no texto principal.
  alternative: “a terra prometida” ou “a terra de Canaã”
  rationale: O texto hebraico traz somente הָאָרֶץ. O contexto fornece a identificação, e uma especificação adicional seria explicativa, não tradutória.
- issue: Sentido de “conhecer” aplicado à terra
  choice: Preservar “conhecerão” no texto e registrar a possibilidade experiencial em nota.
  alternative: “experimentarão” ou “virão a conhecer”
  rationale: O verbo יָדַע conserva uma tensão entre conhecimento e experiência concreta; traduzi-lo diretamente evita limitar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa plural. “Pequeninos” mantém a referência às crianças pequenas e sua vulnerabilidade. A sintaxe acompanha de perto a progressão hebraica sem soar artificial.
