id: NUM.14.5
reference: Numbers 14:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּפֹּ֥ל מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פְּנֵי/הֶ֑ם לִ/פְנֵ֕י כָּל קְהַ֥ל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: pt
  text: Então Moisés e Arão se prostraram com o rosto em terra diante de toda a assembleia da comunidade dos filhos de Israel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas” ou “dos descendentes de Israel”. O hebraico diz literalmente “dos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “assembleia da comunidade” conserva dois termos coletivos relacionados, provavelmente com ênfase solene e pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: se prostraram
  rationale: Embora נפל tenha o sentido básico de “cair”, a combinação com “sobre o rosto” é um idiomatismo de prostração. Em português, “se prostraram com o rosto em terra” comunica naturalmente o gesto sem acrescentar sua motivação.
- source_word: עַל פְּנֵיהֶם
  choice: com o rosto em terra
  rationale: Equivalente português claro e corrente para a postura física indicada pelo idiomatismo hebraico, evitando a formulação pouco natural “sobre os seus rostos”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Preserva a ideia de presença pública e espacial perante o grupo reunido.
- source_word: כָּל
  choice: toda a
  rationale: Com o substantivo coletivo singular, “toda a” expressa naturalmente a totalidade.
- source_word: קְהַל
  choice: assembleia
  rationale: קָהָל designa o grupo reunido; “assembleia” mantém o sentido coletivo e formal.
- source_word: עֲדַת
  choice: comunidade
  rationale: עֵדָה pode designar a comunidade constituída. “Comunidade” distingue o termo de קָהָל e permite preservar os dois substantivos relacionados sem repetição artificial.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz de perto a expressão hebraica, tradicional e inteligível em português; a nota esclarece alternativas idiomáticas.
theological_decisions:
- issue: Se a expressão coletiva dupla קְהַל עֲדַת deve ser reduzida a um único termo
  choice: Preservar os dois termos como “assembleia da comunidade”
  alternative: “toda a comunidade” ou “a comunidade reunida”
  rationale: O hebraico emprega dois substantivos coletivos relacionados. Mantê-los conserva a solenidade e a ênfase pública da cena, sem decidir além do texto qual relação técnica existe entre eles.
- issue: Se בְּנֵי יִשְׂרָאֵל deve ser vertido por uma designação étnica mais idiomática
  choice: “filhos de Israel”
  alternative: “israelitas” ou “descendentes de Israel”
  rationale: A escolha preserva a forma lexical do hebraico e sua referência corporativa, sem pressupor que apenas homens estejam em vista.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação “se prostraram com o rosto em terra” traduz o idiomatismo completo de maneira natural; “assembleia da comunidade” preserva a expressão coletiva dupla do hebraico.
