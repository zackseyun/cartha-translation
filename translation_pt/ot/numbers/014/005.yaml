  source_fidelity: 'A tradução representa adequadamente a sequência narrativa e todos os elementos do hebraico: Moisés e Arão, o gesto de cair/prostrar-se sobre o rosto, a presença diante de todo o grupo e a dupla expressão coletiva seguida de “filhos de Israel”. “Se prostraram com o rosto em terra” é uma equivalência idiomática portuguesa fiel ao gesto expresso por נפל + על־פניהם, sem lhe atribuir uma motivação não dita.'
