source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: pt
  text: E eles contarão isso aos habitantes desta terra, que ouviram que tu, Yahweh, estás no meio deste povo; que tu, Yahweh, és visto face a face[a]; que a tua nuvem permanece sobre eles; e que vais adiante deles numa coluna de nuvem durante o dia e numa coluna de fogo durante a noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apareces face a face”; literalmente: “és visto olho a olho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ אֶל יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: E eles contarão isso aos habitantes desta terra
  rationale: O particípio singular יוֹשֵׁב tem sentido coletivo, expresso naturalmente por “habitantes”. “Contarão isso” torna explícito em português o objeto implícito de “dirão”, sem acrescentar conteúdo novo.
- source_word: שָׁמְעוּ
  choice: que ouviram
  rationale: O perfeito indica conhecimento adquirido anteriormente; o pretérito perfeito é claro e natural no encadeamento português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּקֶרֶב הָעָם הַזֶּה
  choice: no meio deste povo
  rationale: Mantém a imagem espacial e relacional do hebraico em linguagem corrente.
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: és visto face a face
  rationale: “Face a face” comunica naturalmente o caráter direto e manifesto da presença divina; a nota preserva a imagem literal “olho a olho” e a possibilidade de entender o verbo como “apareces”.
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: a tua nuvem permanece sobre eles
  rationale: עמד descreve a nuvem posicionada ou mantida sobre o povo; “permanece” é natural em português e conserva a ideia de presença contínua.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: vais adiante deles
  rationale: Traduz de perto o movimento expresso por הלך sem explicitar interpretativamente “guias”.
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: numa coluna de nuvem ... e numa coluna de fogo
  rationale: A preposição ב é entendida como o modo visível em que Yahweh vai adiante do povo.
- source_word: יוֹמָם ... לָיְלָה
  choice: durante o dia ... durante a noite
  rationale: Equivalentes adverbiais claros e amplamente naturais no português moderno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. A transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Sentido de עַיִן בְּעַיִן נִרְאָה
  choice: és visto face a face
  alternative: apareces face a face; és visto olho a olho
  rationale: A formulação principal oferece uma expressão portuguesa compreensível para a manifestação direta, enquanto a nota registra tanto a imagem hebraica incomum quanto a possível leitura de נִרְאָה como “apareces”, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa singular coerentes com a invocação direta a Yahweh. A pontuação com ponto e vírgula organiza a longa sequência de afirmações sem desfazer sua unidade.
