base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: pt
  text: 'E todos os filhos de Israel murmuraram contra Moisés e contra Arão[a], e toda a congregação lhes disse: “Quem dera tivéssemos morrido na terra do Egito! Ou quem dera tivéssemos morrido neste deserto!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “todos os israelitas reclamaram contra Moisés e contra Arão”. Hebraico: “todos os filhos de Israel murmuraram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: murmuraram
  rationale: O verbo לון/לין, neste contexto do deserto, expressa a queixa coletiva e hostil contra os líderes. “Murmuraram” preserva essa conotação bíblica e continua compreensível em português moderno; a nota registra alternativas correntes.
- source_word: עַל
  choice: contra
  rationale: Com o verbo de murmurar, עַל indica o alvo da queixa com força adversativa; “contra” reproduz adequadamente o confronto dirigido a Moisés e Arão.
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  rationale: A formulação mantém de perto o masculino plural בְּנֵי e a designação nacional tradicional, sem ocultar que a expressão pode referir-se idiomaticamente a todos os israelitas.
- source_word: כָּל הָעֵדָה
  choice: toda a congregação
  rationale: Em Números, עֵדָה designa frequentemente a comunidade pactual reunida. “Congregação” preserva esse sentido corporativo, e “toda” traduz כָּל de modo natural.
- source_word: לוּ
  choice: Quem dera
  rationale: לוּ introduz um desejo irreal ou contrário aos fatos. “Quem dera” é uma expressão portuguesa natural, digna e adequada à força de lamento.
- source_word: מַתְנוּ / מָתְנוּ
  choice: tivéssemos morrido
  rationale: O qatal depois de לוּ expressa um desejo não realizado referente ao passado; o mais-que-perfeito do subjuntivo comunica corretamente esse valor contrafactual.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: A tradução conserva a formulação geográfica completa do hebraico, em vez de reduzi-la simplesmente a “no Egito”.
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: neste deserto
  rationale: מִדְבָּר designa a região erma onde Israel peregrinava. “Deserto” é a opção mais natural e amplamente compreendida em português, sem exigir que o terreno fosse exclusivamente arenoso.
theological_decisions:
- issue: Designação nacional marcada por gênero em בְּנֵי יִשְׂרָאֵל
  choice: todos os filhos de Israel
  alternative: todos os israelitas
  rationale: O hebraico emprega literalmente o construto masculino plural “filhos de Israel”. A tradução conserva essa forma, enquanto a nota esclarece a alternativa idiomática que explicita a referência ao povo em conjunto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe próxima do hebraico sem artificialidade. “Quem dera” mantém a intensidade do lamento; “congregação” conserva o caráter corporativo de עֵדָה. A única nota reúne as alternativas relevantes para a designação nacional e para o verbo de queixa, e seu marcador aparece no texto.
