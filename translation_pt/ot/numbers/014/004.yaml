  yaml_path: translation/ot/numbers/014/004.yaml
  text: And they said to one another[b][a], “Let us appoint a leader and return to Egypt.”
translation:
  language: pt
  text: 'E disseram uns aos outros[a]: “Vamos nomear um líder[b] e voltar para o Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada homem ao seu irmão”. A expressão hebraica indica que falavam entre si.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “coloquemos uma cabeça”; aqui, “cabeça” significa alguém posto à frente do grupo, isto é, um líder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol de אמר dá continuidade à narrativa; “E disseram” preserva essa sequência simples e corresponde ao registro bíblico corrente.
- source_word: אִישׁ אֶל־אָחִיו
  choice: uns aos outros
  rationale: A expressão, literalmente “cada homem ao seu irmão”, tem sentido recíproco no contexto. “Uns aos outros” comunica isso naturalmente, sem enfatizar indevidamente o gênero gramatical.
- source_word: נִתְּנָה רֹאשׁ
  choice: Vamos escolher um líder
  rationale: A construção cohortativa significa literalmente “coloquemos uma cabeça”. Aqui, רֹאשׁ designa alguém posto à frente do grupo. “Vamos escolher um líder” expressa de modo claro a proposta deliberativa, sem sugerir necessariamente uma nomeação formal.
- source_word: וְנָשׁוּבָה
  choice: e voltar
  rationale: O cohortativo coordenado prossegue a exortação. Em português, “Vamos escolher... e voltar” mantém naturalmente a força de primeira pessoa do plural sem repetir “vamos”.
- source_word: מִצְרָיְמָה
  choice: para o Egito
  rationale: A terminação direcional indica movimento rumo ao Egito. A ideia de retorno já está presente em שׁוב, por isso “para o Egito” é suficiente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala direta usa “vamos” para transmitir naturalmente os cohortativos hebraicos. As notas preservam as imagens literais das expressões idiomáticas.
