  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Até quando este povo me tratará com desprezo[a]? Até quando não crerão em mim[b], apesar de todos os sinais que fiz no meio dele[c]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me desprezará” ou “me rejeitará”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não confiarão em mim”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “em seu meio”; o pronome singular retoma “este povo” como um coletivo.
    reason: source_form
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַד אָנָה
  choice: Até quando
  rationale: Equivalente idiomático em português para a pergunta temporal e retórica hebraica, cuja repetição foi mantida.
- source_word: יְנַאֲצֻנִי
  choice: me tratará com desprezo
  rationale: O verbo נאץ comunica rejeição desdenhosa; a formulação preserva tanto a atitude de desprezo quanto sua força relacional.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o coletivo singular e o tom de distanciamento do hebraico.
- source_word: לֹא יַאֲמִינוּ בִי
  choice: não crerão em mim
  rationale: O hifil de אמן com ב pode expressar fé ou confiança em alguém. A tradução principal conserva a construção direta, e a nuance de confiança aparece em nota.
- source_word: בְּכֹל הָאֹתוֹת
  choice: apesar de todos os sinais
  rationale: 'O contexto confere valor concessivo à preposição: a incredulidade persiste mesmo diante dos sinais realizados.'
- source_word: הָאֹתוֹת
  choice: os sinais
  rationale: Traduz אוֹת sem acrescentar explicitamente 'milagrosos', embora o contexto indique atos extraordinários.
- source_word: עָשִׂיתִי
  choice: fiz
  rationale: O pretérito perfeito é natural em português e apresenta os atos realizados por Yahweh como fundamento da pergunta presente.
- source_word: בְּקִרְבּוֹ
  choice: no meio dele
  rationale: Preserva o sufixo singular hebraico, que retoma 'este povo' como coletivo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. A transliteração o preserva sem substituí-lo por um título.
- issue: Sentido de לֹא יַאֲמִינוּ בִי
  choice: não crerão em mim
  alternative: não confiarão em mim
  rationale: A expressão hebraica abrange crença e confiança. A leitura principal mantém a correspondência lexical direta, enquanto a nota conserva a nuance relacional legítima.
- issue: Valor de בְּכֹל antes de 'os sinais'
  choice: apesar de todos os sinais
  alternative: com todos os sinais; diante de todos os sinais
  rationale: A relação concessiva é fortemente indicada pelo contexto, sem negar que a preposição hebraica seja formalmente mais ampla.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A repetição retórica de “Até quando” e o coletivo singular “este povo” foram preservados. A alternância natural entre o coletivo singular e o verbo no plural acompanha o hebraico e mantém em vista os integrantes do povo.
