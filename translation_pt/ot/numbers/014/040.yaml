  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: pt
  text: 'De manhã, levantaram-se cedo e subiram ao topo da montanha, dizendo: “Aqui estamos! Subiremos ao lugar de que Yahweh falou[a], pois pecamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao lugar que Yahweh mencionou”. O hebraico usa simplesmente o verbo “dizer/falar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: De manhã, levantaram-se cedo
  rationale: A combinação do hifil de שׁכם com בַּבֹּקֶר enfatiza que se levantaram cedo pela manhã. A formulação é natural em português e preserva ambos os elementos.
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: subiram ao topo da montanha
  rationale: עלה significa subir, e רֹאשׁ הָהָר é a expressão idiomática para o topo ou cume da montanha. A tradução mantém a imagem concreta sem recorrer ao mais literário “cume”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz discurso direto; “dizendo” é equivalente claro e formalmente próximo.
- source_word: הִנֶּנּוּ
  choice: Aqui estamos!
  rationale: A fórmula de autoapresentação indica presença e disposição, sem explicitar além do hebraico que estavam “prontos”.
- source_word: וְעָלִינוּ
  choice: Subiremos
  rationale: Embora a forma seja um perfeito com conjunção, no contexto expressa a ação que pretendem realizar. O futuro em português comunica essa intenção sem transformá-la em ordem ou exortação.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר אָמַר יְהוָה
  choice: ao lugar de que Yahweh falou
  rationale: מָקוֹם é “lugar”, e אמר é o verbo comum “dizer/falar”. “De que falou” torna a relação sintática natural em português sem acrescentar a ideia mais forte de promessa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, preservando-o como nome próprio em vez de substituí-lo por um título.
- source_word: כִּי חָטָאנוּ
  choice: pois pecamos
  rationale: כִּי introduz a razão ou explicação, e חטא conserva o sentido moral e teológico de pecar. O pretérito perfeito “pecamos” expressa naturalmente em português a confissão de uma ação já cometida.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Força da confissão חָטָאנוּ
  choice: pecamos
  alternative: estávamos errados
  rationale: “Pecamos” mantém o conteúdo moral e teológico do verbo חטא; “estávamos errados” enfraqueceria indevidamente a confissão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fala direta mantém concisão e solenidade, sem explicitar uma promessa nem interpretar “Aqui estamos” como declaração formal de prontidão.
