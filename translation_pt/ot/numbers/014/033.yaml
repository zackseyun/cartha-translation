  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: pt
  text: E os filhos de vocês serão pastores[a] no deserto durante quarenta anos e carregarão as infidelidades de vocês[b], até que os cadáveres de vocês se consumam no deserto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vivendo como pastores errantes”. A palavra hebraica está literalmente ligada a pastorear ou apascentar, mas alguns entendem que, neste contexto, ela ressalta a vida nômade e errante.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode ser traduzido por “prostituições”; ele usa uma imagem sexual para descrever a deslealdade.
    reason: lexical_alternative
  - marker: c
    text: Ou “até que os cadáveres de vocês cheguem ao fim no deserto”. A expressão se refere ao desaparecimento da geração condenada.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: E os filhos de vocês
  rationale: בנים é masculino plural e, em seu sentido normal, significa “filhos”; a formulação portuguesa é atual e não amplia explicitamente o referente para “crianças” ou “descendentes”.
- source_word: רֹעִים
  choice: pastores
  rationale: O particípio de רעה está lexicalmente ligado a pastorear e apascentar. “Pastores” preserva a imagem concreta do hebraico, enquanto a possível ideia contextual de vida errante é registrada em nota.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma, não necessariamente arenosa. “Deserto” é natural no português bíblico moderno e adequado ao cenário, embora “região deserta” também seja possível.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: Expressa de modo natural a duração indicada pelo hebraico.
- source_word: וְנָשְׂאוּ
  choice: e carregarão
  rationale: נשא significa levar ou carregar e, aqui, sugere suportar o peso ou as consequências da infidelidade. “Carregarão” conserva a metáfora e evita explicitar além do texto exatamente como esse peso será suportado.
- source_word: אֶת זְנוּתֵיכֶם
  choice: as infidelidades de vocês
  rationale: זְנוּת emprega linguagem de prostituição para deslealdade. “Infidelidades” comunica a deslealdade no contexto da rebelião, enquanto a nota preserva a força sexual da imagem hebraica.
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: até que os cadáveres de vocês se consumam
  rationale: תֹּם indica término ou completa consumação, e פגר significa cadáver ou carcaça. A formulação mantém a dureza e a estranheza controlada da expressão hebraica sem transformá-la numa paráfrase sobre a morte de toda a geração.
theological_decisions:
- issue: A linguagem de זְנוּתֵיכֶם é sexual em sentido estrito ou metafórica para deslealdade?
  choice: “as infidelidades de vocês”, com nota que explicita a imagem de prostituição
  alternative: “as prostituições de vocês”
  rationale: O contexto é a rebelião de Israel, de modo que uma referência apenas a atos sexuais seria estreita demais. Ao mesmo tempo, a nota impede que a metáfora sexual de deslealdade seja apagada.
- issue: רֹעִים deve ser interpretado como “pastores” ou dinamicamente como “errantes”?
  choice: “pastores” no texto principal
  alternative: “errantes”
  rationale: A forma hebraica deriva diretamente do campo semântico de pastorear. A vida errante pode ser uma implicação contextual, mas não deve substituir sem aviso a imagem lexical do original.
- issue: A expressão עַד תֹּם פִּגְרֵיכֶם deve ser explicada como a morte completa da geração condenada?
  choice: 'Preservar a formulação concreta: “até que os cadáveres de vocês se consumam”'
  alternative: “até que todos vocês morram no deserto”
  rationale: A alternativa explicativa comunica o resultado contextual, mas elimina a imagem dura dos cadáveres e resolve a construção mais do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. Conservam-se as imagens concretas de pastoreio, carga e cadáveres; notas esclarecem alternativas sem resolver silenciosamente as ambiguidades do hebraico.
