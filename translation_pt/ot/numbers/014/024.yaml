id: NUM.14.24
reference: Numbers 14:24
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: pt
  text: Mas o meu servo Calebe, porque nele havia um espírito diferente[a] e ele me seguiu de todo o coração[b], eu o farei entrar na terra em que esteve, e os seus descendentes tomarão posse dela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia com ele outro espírito”; a expressão pode referir-se a uma disposição ou atitude diferente da do restante de Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Expressão idiomática hebraica: “encheu após mim”, isto é, seguiu o SENHOR por completo ou de todo o coração.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a herdarão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי
  choice: Mas o meu servo
  rationale: A conjunção assume valor adversativo pelo contraste com a geração descrente no contexto. “Servo” expressa naturalmente a relação de lealdade a Deus, sem destacar uma condição de escravidão.
- source_word: כָלֵב
  choice: Calebe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עֵקֶב
  choice: porque
  rationale: Introduz de modo claro a razão do tratamento favorável concedido a Calebe.
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: nele havia um espírito diferente
  rationale: Preserva a amplitude de רוּחַ e a ideia de que Calebe se distinguia do restante de Israel, sem identificar explicitamente esse espírito como o Espírito Santo.
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: e ele me seguiu de todo o coração
  rationale: Traduz de modo natural o idiomatismo hebraico “encher após mim”, cujo sentido é seguir completa ou integralmente.
- source_word: וַהֲבִיאֹתִיו
  choice: eu o farei entrar
  rationale: O perfeito com waw, em declaração de promessa divina, refere-se à ação futura. O causativo de בוא é refletido por “farei entrar”.
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: na terra em que esteve
  rationale: Expressa naturalmente que Calebe já havia ido àquela terra como explorador, sem sugerir que apenas chegou à fronteira.
- source_word: וְזַרְעוֹ
  choice: e os seus descendentes
  rationale: זֶרַע é coletivo neste contexto; “descendentes” é claro e atual em português.
- source_word: יוֹרִשֶׁנָּה
  choice: tomarão posse dela
  rationale: Comunica o sentido contextual de ירשׁ aplicado à ocupação da terra, preservando em nota a alternativa “herdarão”.
theological_decisions:
- issue: Sentido de “um espírito diferente” em Calebe
  choice: Manter “espírito” com referência ampla à disposição interior ou atitude distinta de Calebe.
  alternative: Entender como referência específica ao Espírito de Deus.
  rationale: רוּחַ pode indicar espírito, disposição ou atitude, e o texto não identifica explicitamente o Espírito Santo; por isso, a tradução conserva a abertura teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação evita arcaísmos, conserva a ambiguidade de רוּחַ e traduz os idiomatismos hebraicos sem opacidade.
