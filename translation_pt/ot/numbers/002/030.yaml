translation:
  language: pt
  text: 'e o seu contingente[a], isto é, os que foram contados entre eles: cinquenta e três mil e quatrocentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua hoste” ou “o seu exército”; o termo hebraico pode ter conotações militares e designar um agrupamento tribal organizado.
