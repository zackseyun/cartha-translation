lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e o seu contingente
  rationale: צָבָא pode designar exército, hoste ou grupo organizado. No contexto da disposição tribal do acampamento, “contingente” preserva a organização de caráter militar sem sugerir combate ativo.
- source_word: וּפְקֻדֵיהֶם
  choice: isto é, os que foram contados entre eles
  rationale: 'A forma derivada de פקד tem aqui sentido censitário: os recenseados ou alistados. “Entre eles” exprime naturalmente em português a relação com o grupo indicado pelo sufixo plural.'
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquenta e três mil e quatrocentos
  rationale: Reproduz o total exato na ordem numérica natural do português moderno.
