base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: pt
  text: Estes são os filhos de Israel[a] recenseados[b], segundo suas casas paternas. Todos os recenseados dos acampamentos, segundo suas divisões,[c] foram seiscentos e três mil quinhentos e cinquenta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os contados” ou “os registrados”.
    reason: lexical_alternative
  - marker: c
    text: Ou “segundo seus contingentes” ou “segundo seus exércitos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: homens ... contados
  rationale: No contexto do censo militar de Números 1–2, a forma designa os homens recenseados. A formulação explicita o referente masculino indicado pelo contexto sem tratar “homens” como item lexical independente.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico; “israelitas” seria uma alternativa mais idiomática.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo suas casas paternas
  rationale: Mantém a estrutura patrilinear explícita na fórmula censitária e soa digna e compreensível em português.
- source_word: הַמַּחֲנֹת
  choice: acampamentos
  rationale: Refere-se às formações tribais dispostas ao redor do tabernáculo; “acampamentos” comunica isso com clareza.
- source_word: לְצִבְאֹתָם
  choice: segundo seus exércitos
  rationale: צבא designa aqui os contingentes organizados para serviço militar. “Exércitos” preserva melhor a força militar do termo, enquanto “divisões” seria uma alternativa contextual.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: seiscentos e três mil quinhentos e cinquenta
  rationale: Reproduz por extenso e de maneira idiomática o total hebraico de 603.550.
theological_decisions:
- issue: Linguagem de gênero no censo
  choice: homens ... contados
  alternative: os contados; os recenseados
  rationale: Embora “homens” não corresponda a uma palavra separada neste versículo, o contexto imediato define os recenseados como homens adultos aptos para o serviço militar; a tradução torna explícito esse referente contextual.
- issue: Sentido militar de צִבְאֹתָם
  choice: segundo seus exércitos
  alternative: segundo suas divisões; segundo seus contingentes
  rationale: A escolha conserva a dimensão militar e organizacional do termo sem afirmar que os grupos estavam naquele momento em combate.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores foi ajustada para que cada nota apareça junto à expressão correspondente. O número foi escrito por extenso em consonância com o tom formal do resumo censitário.
