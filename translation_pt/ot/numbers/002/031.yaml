  yaml_path: translation/ot/numbers/002/031.yaml
  text: All those counted for the camp of Dan were 157,600[a]. They shall set out last by their standards.
translation:
  language: pt
  text: Todos os recenseados do acampamento de Dã eram 157.600. Eles partirão por último, segundo os seus estandartes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob as suas bandeiras”. O termo hebraico refere-se aos estandartes tribais ou aos agrupamentos identificados por eles na organização do acampamento de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Todos os recenseados
  rationale: O particípio passivo de פקד designa os que foram registrados e contados no recenseamento. “Recenseados” expressa isso de modo conciso e não acrescenta aqui a palavra “homens”, embora o contexto do censo a pressuponha.
- source_word: לְמַחֲנֵה דָן
  choice: do acampamento de Dã
  rationale: A preposição indica a relação dos recenseados com o agrupamento de acampamento liderado por Dã; a formulação é natural em português.
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '157.600'
  rationale: Reproduz exatamente o total hebraico em algarismos, usando o ponto como separador de milhares conforme a convenção predominante em português.
- source_word: לָאַחֲרֹנָה
  choice: por último
  rationale: Expressa diretamente a posição final na ordem de marcha.
- source_word: יִסְעוּ
  choice: partirão
  rationale: No contexto das jornadas pelo deserto, נסע indica levantar acampamento e pôr-se em marcha; “partirão” é claro, atual e preserva o valor verbal sem explicitação excessiva.
- source_word: לְדִגְלֵיהֶם
  choice: segundo os seus estandartes
  rationale: דגל pode designar tanto o estandarte quanto o agrupamento organizado sob ele. “Segundo os seus estandartes” preserva a imagem concreta e a função organizadora, enquanto a nota registra uma alternativa natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do sujeito em “Eles partirão” mantém clara a transição do total recenseado para a ordem de marcha. O marcador da nota foi colocado junto a “estandartes”, termo ao qual a nota lexical se refere.
