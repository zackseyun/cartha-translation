  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: pt
  text: O total dos recenseados[a] do acampamento de Judá era 186.400, segundo as suas divisões[b]. Eles partirão primeiro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os contados” ou “os registrados”.
