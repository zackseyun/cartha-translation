lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Todos os recenseados
  rationale: O particípio passivo de פקד designa os que foram registrados ou contados no recenseamento, aqui com finalidade também militar. “Recenseados” é conciso, natural e não acrescenta explicitamente “homens” ao hebraico.
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: do acampamento de Judá
  rationale: A construção indica a vinculação dos recenseados ao agrupamento do acampamento de Judá; “do acampamento” expressa essa relação com naturalidade em português.
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: '186.400'
  rationale: Representa exatamente o total hebraico; algarismos facilitam a leitura no contexto de uma lista censitária.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: צָבָא pode indicar exército, hoste ou unidade organizada. “Divisões” preserva o caráter militar e ordenado do acampamento sem sugerir necessariamente exércitos modernos.
- source_word: רִאשֹׁנָה יִסָּעוּ
  choice: Eles partirão primeiro
  rationale: נסע, no contexto do acampamento no deserto, indica levantar-se para iniciar a marcha. “Partirão” é natural em português, enquanto “primeiro” conserva a ordem de marcha expressa por רִאשֹׁנָה.
