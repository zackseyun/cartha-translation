  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: pt
  text: Os que acamparem a leste, na direção do nascer do sol, estarão sob o estandarte do acampamento de Judá, segundo as suas divisões. O líder dos filhos de Judá será Naassom, filho de Aminadabe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: estandarte
  rationale: Designa o estandarte que identifica e organiza o agrupamento tribal; «estandarte» é natural em português e preserva a imagem concreta do hebraico.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: Neste contexto censitário e militar, צבא se refere aos contingentes organizados; «divisões» comunica a estrutura coletiva sem restringir indevidamente o termo ao exército moderno.
- source_word: נָשִׂיא
  choice: líder
  rationale: Expressa a função de chefe ou representante tribal em linguagem atual e amplamente compreensível.
- source_word: קֵדְמָה מִזְרָחָה
  choice: no lado leste, na direção do nascer do sol
  rationale: Mantém a dupla indicação espacial do hebraico, incluindo a associação explícita do leste com o nascer do sol.
- source_word: בְּנֵי יְהוּדָה
  choice: filhos de Judá
  rationale: Preserva a expressão genealógica hebraica e sua referência aos integrantes da tribo de Judá.
