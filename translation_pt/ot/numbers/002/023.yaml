lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e seu contingente
  rationale: צָבָא designa aqui o agrupamento tribal organizado segundo uma estrutura de caráter militar. “Contingente” preserva tanto a ideia de grupo organizado quanto o contexto militar, sem sugerir necessariamente combate ativo.
- source_word: וּפְקֻדֵיהֶם
  choice: os recenseados entre eles
  rationale: A forma derivada de פקד refere-se aos inscritos ou contados no recenseamento. O sufixo plural aponta para o grupo tribal, e a formulação mantém a relação com o total que vem em seguida.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: trinta e cinco mil e quatrocentos
  rationale: Expressa o número cardinal exato em ordem natural no português moderno.
