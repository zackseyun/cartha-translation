  yaml_path: translation/ot/numbers/002/016.yaml
  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: pt
  text: O total dos recenseados do acampamento de Rúben era 151.450, segundo suas tropas.[a] Eles partirão em segundo lugar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo seus exércitos” ou “segundo suas divisões”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e em segundo partirão”, indicando a posição do acampamento na ordem de marcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Todos os recenseados
  rationale: Expressa o total dos que foram contados no censo, sem acrescentar explicitamente “homens”, ausente neste versículo.
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: do acampamento de Rúben
  rationale: Indica a vinculação dos recenseados ao agrupamento tribal e militar de Rúben em português natural.
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: '151.450'
  rationale: Representa com exatidão a soma hebraica; algarismos favorecem a leitura em uma lista censitária, com pontuação numérica corrente no português brasileiro.
- source_word: לְצִבְאֹתָם
  choice: segundo seus exércitos
  rationale: צבאות designa aqui as forças organizadas ou formações militares das tribos; “exércitos” preserva o valor militar amplo, enquanto a nota registra alternativas contextuais.
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: Eles partirão em segundo lugar
  rationale: Transmite naturalmente a posição do acampamento na ordem de marcha; נסע, neste contexto, significa levantar acampamento e iniciar o deslocamento.
