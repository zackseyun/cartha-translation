base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/024.yaml
  text: All those counted for the camp of Ephraim were 108,100 by their divisions[b][a]. They shall set out third.
translation:
  language: pt
  text: Todos os recenseados[a] do acampamento de Efraim eram 108.100, segundo as suas divisões.[b] Eles partirão em terceiro lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os alistados” em vez de “todos os recenseados”; o particípio hebraico pode incluir tanto a ideia de contagem censitária quanto a de alistamento militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo os seus exércitos” ou “segundo as suas tropas” em vez de “segundo as suas divisões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: Todos os recenseados
  rationale: Expressa naturalmente o total das pessoas contadas, preservando no contexto o sentido de alistamento ligado ao particípio de פקד.
- source_word: לְמַחֲנֵה אֶפְרַיִם
  choice: do acampamento de Efraim
  rationale: O português expressa de modo claro a relação de pertencimento ao agrupamento do acampamento.
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: '108.100'
  rationale: Mantém o valor exato e segue a notação numérica corrente em português.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: Comunica os agrupamentos organizados, de caráter militar, sem recorrer ao termo menos corrente 'hostes'.
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: Eles partirão em terceiro lugar
  rationale: Reproduz com clareza a ordem de marcha e o valor contextual de נסע como partir ou levantar acampamento.
