lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e o seu contingente
  rationale: צָבָא pode significar exército ou hoste, mas, no contexto da organização do acampamento e do recenseamento em Números 2, designa o contingente tribal. “Contingente” preserva o caráter organizado e militar sem sugerir combate em curso.
- source_word: וּפְקֻדֵיהֶם
  choice: os recenseados entre eles
  rationale: A forma derivada de פקד pertence aqui à terminologia do recenseamento e se refere aos que foram contados ou alistados entre os membros do grupo. A formulação mantém o sufixo plural e evita acrescentar “homens” nesta oração.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: setenta e quatro mil e seiscentos
  rationale: O total exato é expresso na ordem numérica natural do português contemporâneo.
