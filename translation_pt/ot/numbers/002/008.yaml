base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/008.yaml
  text: And his company[a], even those numbered of it[b], were fifty-seven thousand four hundred.
translation:
  language: pt
  text: E o seu contingente[a], isto é, os homens dele que foram contados[b], era de cinquenta e sete mil e quatrocentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tropa» ou «divisão»; o hebraico צָבָא pode indicar um contingente militar ou um grupo organizado no contexto do censo do acampamento.
    reason: lexical_alternative
  - marker: b
    text: Ou «os homens dele que foram alistados»; o hebraico se refere aos que foram oficialmente registrados no censo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: E o seu contingente
  rationale: צָבָא, no contexto do censo e da organização do acampamento, designa o agrupamento organizado da tribo, com caráter militar. «Contingente» é claro em português atual e não sugere necessariamente um exército em combate.
- source_word: וּפְקֻדָיו
  choice: isto é, os homens dele que foram contados
  rationale: A forma derivada de פקד refere-se aos oficialmente recenseados ou alistados. «Isto é» explicita a relação entre o contingente e seus homens contados sem alterar o referente.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquenta e sete mil e quatrocentos
  rationale: Expressa o valor exato do hebraico na ordem numérica normal do português contemporâneo.
