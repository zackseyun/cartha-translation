  text: וְ/הַ/חֹנִ֥ים עָלָ֖י/ו מַטֵּ֣ה אָשֵׁ֑ר וְ/נָשִׂיא֙ לִ/בְנֵ֣י אָשֵׁ֔ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: pt
  text: 'Os que estão acampados ao lado dele: a tribo de Aser[a], e o líder dos filhos de Aser, Pagiel, filho de Ocrã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “junto a ele”. A preposição hebraica pode indicar posição adjacente na disposição do acampamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: os que acamparão
  rationale: O particípio hebraico descreve os integrantes da tribo em sua posição no acampamento; no contexto das instruções para a disposição futura, o futuro é natural em português e mantém a função descritiva.
- source_word: עָלָיו
  choice: ao lado dele
  rationale: Neste contexto de organização do acampamento, עַל com sufixo indica posição adjacente, não localização física sobre algo. O pronome retoma o grupo tribal mencionado anteriormente.
- source_word: מַטֵּה
  choice: tribo
  rationale: No contexto censitário e militar de Números, o termo designa uma divisão tribal.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma tradicional e amplamente reconhecível em português para o nome próprio hebraico.
- source_word: נָשִׂיא
  choice: líder
  rationale: Designa o chefe reconhecido da tribo; “líder” é claro e atual, sem a conotação dinástica de “príncipe”.
- source_word: לִבְנֵי אָשֵׁר
  choice: dos filhos de Aser
  rationale: Preserva o idioma genealógico hebraico e expressa naturalmente a relação do líder com o grupo.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: בֶּן עָכְרָן
  choice: filho de Ocrã
  rationale: Tradução direta da fórmula patronímica, com forma portuguesa tradicional do nome.
