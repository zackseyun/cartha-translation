  text: 'and his division, those numbered from them: fifty-nine thousand three hundred.'
translation:
  language: pt
  text: 'e sua divisão, os que foram contados entre eles: cinquenta e nove mil e trezentos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e sua divisão
  rationale: No contexto da organização do acampamento e do recenseamento, צָבָא designa o contingente organizado da tribo. “Divisão” comunica esse sentido sem o tom arcaico de “hoste” nem a amplitude de “exército”.
- source_word: וּפְקֻדֵיהֶם
  choice: os que foram contados entre eles
  rationale: A expressão derivada de פקד se refere às pessoas registradas no recenseamento. A formulação preserva o valor passivo e evita acrescentar “homens”, palavra não explícita nesta oração.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף
  choice: cinquenta e nove mil
  rationale: A ordem hebraica é literalmente “nove e cinquenta mil”; a ordem foi ajustada ao uso natural do português, mantendo exatamente o mesmo total.
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: e trezentos
  rationale: Completa o total do recenseamento; a conjunção hebraica é representada pela forma idiomática portuguesa “cinquenta e nove mil e trezentos”.
