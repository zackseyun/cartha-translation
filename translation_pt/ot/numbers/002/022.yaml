base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/022.yaml
  text: And the tribe of Benjamin[a]; the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: pt
  text: E a tribo de Benjamim; o líder dos filhos de Benjamim[a] era Abidã, filho de Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o líder para os filhos de Benjamim”. A preposição hebraica admite essas duas traduções próximas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: tribo
  rationale: No contexto da organização do acampamento em Números, o termo designa a unidade tribal, não um bastão literal.
- source_word: בִּנְיָמִן
  choice: Benjamim
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: נָשִׂיא
  choice: líder
  rationale: Designa o chefe reconhecido e representante da tribo; “líder” é claro e atual, sem sugerir necessariamente realeza, como poderia ocorrer com “príncipe”.
- source_word: לִבְנֵי בִנְיָמִן
  choice: dos filhos de Benjamim
  rationale: Conserva a expressão hebraica de parentesco e comunica a relação do líder com o grupo tribal. A nota registra a possibilidade próxima de entender a preposição como “para”.
- source_word: אֲבִידָן
  choice: Abidã
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: בֶּן גִּדְעֹנִי
  choice: filho de Gideoni
  rationale: Tradução direta da construção patronímica hebraica, com transliteração clara do nome paterno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe levemente formal adequada à enumeração tribal. O ponto e vírgula preserva a estrutura coordenada e fragmentária do hebraico, enquanto “era” é explicitado para produzir uma frase natural em português.
