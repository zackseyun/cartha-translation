    rationale: O sufixo hebraico em עָלָיו é masculino singular. No contexto, a referência espacial é provavelmente ao estandarte/acampamento previamente especificado, mas a nota não deve introduzir uma alternativa feminina como se ela correspondesse à forma hebraica. É suficiente registrar “junto dele” como alternativa portuguesa de proximidade.
