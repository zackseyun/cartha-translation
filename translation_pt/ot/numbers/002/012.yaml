  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: pt
  text: Os que acampam ao lado dele[a] são a tribo de Simeão; o líder dos filhos de Simeão é Selumiel, filho de Zurisadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto dele”. A preposição hebraica indica proximidade na disposição do acampamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: acampará
  rationale: O particípio descreve a disposição do acampamento. Em português, a construção verbal no futuro é natural neste conjunto de instruções e mantém a ação de acampar.
- source_word: עָלָיו
  choice: ao lado dele
  rationale: Neste contexto, עַל indica proximidade na organização do acampamento, não posição literal sobre algo. O sufixo masculino singular é preservado por “dele”, sem explicitar além do hebraico qual é o referente.
- source_word: מַטֵּה שִׁמְעוֹן
  choice: a tribo de Simeão
  rationale: מַטֶּה designa aqui a unidade tribal, e não um cajado ou ramo.
- source_word: וְנָשִׂיא
  choice: o líder
  rationale: נָשִׂיא é o chefe reconhecido da tribo; “líder” é claro e evita conotação monárquica indevida.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: dos filhos de Simeão
  rationale: Mantém a expressão de parentesco masculina do hebraico, compreensível como designação tribal.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: filho de Zurisadai
  rationale: Reproduz diretamente o patronímico e emprega a forma portuguesa tradicional do nome.
theological_decisions:
- issue: Linguagem de parentesco em לִבְנֵי שִׁמְעוֹן
  choice: filhos de Simeão
  alternative: descendentes de Simeão; povo de Simeão
  rationale: A tradução conserva a formulação masculina do texto hebraico sem neutralizá-la, embora no contexto ela funcione como designação dos integrantes da tribo.
- issue: Referente do sufixo em עָלָיו
  choice: dele
  alternative: dela; junto a ele/ela
  rationale: O hebraico traz um sufixo masculino singular, mas o referente contextual pode ser entendido como Rúben ou como a unidade anteriormente mencionada. A redação preserva a forma masculina e a nota registra a possível retomada da unidade tribal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a relação espacial nem a expressão hebraica “filhos de Simeão”.
