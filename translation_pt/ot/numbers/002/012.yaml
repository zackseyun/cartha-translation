  naturalness: “Os que acampam ao lado dele são a tribo de Simeão” é natural, claro e adequado ao registro bíblico moderno. O ponto e vírgula separa com clareza a identificação da tribo e de seu líder.
  terminology: “Tribo”, “líder”, “filhos de Simeão”, “Selumiel” e “Zurisadai” são escolhas adequadas e consistentes. A nota deve registrar a alternativa espacial sem sugerir uma alternância feminina que não é refletida pela forma masculina singular do hebraico.
