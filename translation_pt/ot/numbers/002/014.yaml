lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: e a tribo de
  rationale: No contexto da organização do acampamento, מַטֶּה designa uma divisão tribal, não um bastão literal. A conjunção foi mantida para refletir a continuidade da lista.
- source_word: גָּד
  choice: Gade
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: וְ/נָשִׂיא
  choice: O líder
  rationale: נָשִׂיא designa aqui o chefe reconhecido da tribo. “Líder” é atual e claro, sem a conotação monárquica de “príncipe”.
- source_word: לִ/בְנֵי גָד
  choice: dos filhos de Gade
  rationale: Preserva de modo natural a fórmula hebraica que identifica o grupo tribal sob esse líder.
- source_word: אֶלְיָסָף
  choice: Eliasafe
  rationale: Transliteração portuguesa convencional do nome pessoal hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente direto da fórmula patronímica hebraica.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Representa a leitura do Texto Massorético neste versículo; a variante “Deuel” é indicada em nota, sem harmonização silenciosa.
