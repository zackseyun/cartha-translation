  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'Yahweh[a] falou a Moisés e a Arão, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente representado em muitas traduções por “SENHOR” e também transliterado “Javé”.'
    reason: Esclarecer a forma hebraica do nome divino e as principais convenções de tradução e transliteração.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, nesta fórmula de discurso divino, indica um novo ato narrativo de fala; “falou” é natural e preserva o tom formal do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título como “SENHOR”.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A repetição hebraica da preposição identifica claramente Moisés e Arão como os dois destinatários. Em português, uma única preposição coordenada expressa isso com naturalidade e sem perda de sentido.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: A fórmula introduz o conteúdo do discurso que começa no versículo seguinte; “dizendo” conserva explicitamente essa ligação.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O texto traz o nome próprio divino, não o título אֲדֹנָי. “Yahweh” translitera uma vocalização acadêmica amplamente aceita, enquanto a nota reconhece a forma consonantal hebraica e evita apresentar a vocalização como absolutamente certa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a fórmula narrativa do hebraico; os nomes seguem as formas portuguesas usuais, exceto “Yahweh”, preservado como nome divino.
