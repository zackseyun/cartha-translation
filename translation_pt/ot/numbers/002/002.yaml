  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: pt
  text: Os filhos de Israel[b] acamparão, cada homem junto à sua bandeira[a], segundo os sinais das casas de seus pais; acamparão a certa distância, ao redor da tenda do encontro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estandarte”. O hebraico דֶּגֶל se refere a uma bandeira de identificação tribal ou militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “Os israelitas”. A expressão mais literal preserva o modo familiar de falar presente no hebraico.
    reason: lexical_alternative
  - marker: c
    text: Tradicionalmente, também se traduz por “tabernáculo”; outra possibilidade é “tenda da reunião”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: cada homem
  rationale: O singular masculino tem uso distributivo, indicando cada homem individualmente dentro da organização coletiva.
- source_word: דִּגְלוֹ
  choice: sua bandeira
  rationale: דֶּגֶל designa uma bandeira identificadora tribal ou militar; “bandeira” é corrente e preserva a imagem concreta.
- source_word: בְאֹתֹת
  choice: segundo os sinais
  rationale: אוֹת se refere aqui a sinais ou marcas de identificação; “segundo” expressa de modo natural a relação organizadora indicada pela preposição בְּ sem definir indevidamente a forma desses sinais.
- source_word: לְבֵית אֲבֹתָם
  choice: das casas de seus pais
  rationale: Mantém a terminologia hebraica de parentesco e a estrutura social das casas paternas, sem reduzi-la simplesmente a “famílias”.
- source_word: יַחֲנוּ
  choice: acamparão
  rationale: O imperfeito, no contexto de instrução, expressa a disposição prescrita do acampamento; o futuro em português comunica adequadamente essa ordem.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Preserva o idioma familiar e pactual do hebraico; “os israelitas” seria uma alternativa natural, mas menos formalmente próxima.
- source_word: מִנֶּגֶד
  choice: voltados para
  rationale: No contexto espacial, indica posição diante ou em face de algo; “voltados para” combina naturalmente com o acampamento disposto ao redor da tenda.
- source_word: סָבִיב
  choice: ao redor dela
  rationale: Explicita que as tribos acampariam em torno da tenda por todos os lados, mantendo claro o referente em português.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Traduz diretamente os componentes da expressão hebraica e evita as associações arquitetônicas posteriores que “tabernáculo” pode sugerir.
theological_decisions:
- issue: Linguagem representativa marcada por gênero
  choice: cada homem / os filhos de Israel
  alternative: cada um / os israelitas
  rationale: O texto hebraico emprega אִישׁ no masculino singular distributivo e בְּנֵי יִשְׂרָאֵל na forma familiar masculina; a tradução preserva essas formas sem ampliar nem restringir além do original.
- issue: Designação do santuário
  choice: tenda do encontro
  alternative: tabernáculo / tenda da reunião
  rationale: A tradução direta de אֹהֶל מוֹעֵד mantém transparente a imagem de uma tenda associada ao encontro designado, sem impor um termo eclesiástico tradicional.
- issue: Relação espacial entre o acampamento e a tenda
  choice: voltados para a tenda do encontro, ao redor dela
  alternative: diante da tenda do encontro, ao redor dela / a certa distância, ao redor da tenda do encontro
  rationale: מִנֶּגֶד pode envolver posição diante, em frente ou à distância. “Voltados para” preserva a orientação relativa à tenda e funciona com סָבִיב, sem fixar uma distância que o versículo não quantifica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a estrutura solene da instrução sem recorrer a formas arcaicas. A repetição de “acamparão” reflete a repetição enfática do verbo hebraico.
