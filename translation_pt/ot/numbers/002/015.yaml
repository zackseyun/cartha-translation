lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e o seu contingente
  rationale: Neste contexto de recenseamento e disposição do acampamento, צָבָא designa o corpo organizado da tribo. “Contingente” comunica essa organização e possível função militar sem sugerir que uma batalha esteja em curso.
- source_word: וּפְקֻדֵיהֶם
  choice: isto é, os recenseados entre eles
  rationale: A forma deriva de פקד e se refere aos que foram registrados ou contados. “Recenseados” preserva o contexto censitário; “entre eles” representa o sufixo plural sem acrescentar “homens” nesta cláusula.
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְשֵׁשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: quarenta e cinco mil seiscentos e cinquenta
  rationale: Tradução direta e idiomática da sequência numérica hebraica.
