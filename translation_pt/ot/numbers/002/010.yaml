  text: דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/010.yaml
  text: The banner of the camp of Reuben shall be on the south[a], by their divisions[b]; and the leader of the sons of Reuben shall be Elizur son of Shedeur.
translation:
  language: pt
  text: O estandarte[a] do acampamento de Rúben ficará ao sul, segundo as suas divisões[b]; e o líder dos filhos de Rúben será Elizur, filho de Sedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bandeira”.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo os seus exércitos”; o termo hebraico expressa uma organização de caráter militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: estandarte
  rationale: Designa o sinal identificador do agrupamento tribal ou militar. “Estandarte” é claro no contexto e preserva essa função organizadora.
- source_word: מַחֲנֵה
  choice: acampamento
  rationale: Refere-se ao acampamento organizado da tribo, não apenas ao lugar físico onde ela se instala.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: תֵּימָנָה
  choice: ao sul
  rationale: A forma direcional indica a localização do grupo no lado sul do acampamento.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: Mantém a ideia de agrupamentos ordenados, de caráter militar, sem reduzir o termo simplesmente a “exércitos”.
- source_word: וְנָשִׂיא
  choice: e o líder
  rationale: Neste contexto, נָשִׂיא é o chefe designado da tribo. “Líder” é atual e não sugere indevidamente uma posição monárquica.
- source_word: לִבְנֵי רְאוּבֵן
  choice: dos filhos de Rúben
  rationale: Preserva a expressão hebraica de parentesco usada para identificar o grupo tribal.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elizur, filho de Sedeur
  rationale: Emprega as formas portuguesas usuais dos nomes e reproduz diretamente o patronímico hebraico.
