base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/020.yaml
  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: pt
  text: Ao lado dele ficará a tribo de Manassés[a]. O líder dos filhos de Manassés será Gamaliel, filho de Pedazur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Junto dele ficará a tribo de Manassés”. A expressão hebraica indica posição adjacente na disposição do acampamento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָיו
  choice: Ao lado dele ficará
  rationale: No contexto da disposição do acampamento, עַל com sufixo indica posição adjacente, não autoridade. O futuro mantém a formulação normativa da organização do acampamento no contexto.
- source_word: מַטֵּה
  choice: a tribo
  rationale: Neste contexto de organização tribal e militar, מַטֶּה designa a unidade tribal, e não um bastão literal.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio e tribal.
- source_word: וְנָשִׂיא
  choice: O líder
  rationale: נָשִׂיא designa o chefe oficialmente reconhecido da tribo. “Líder” é claro, atual e evita as conotações monárquicas de “príncipe”.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: dos filhos de Manassés
  rationale: Preserva a expressão genealógica explícita בְּנֵי e expressa naturalmente, depois de “líder”, a relação com o grupo tribal.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente natural da construção patronímica hebraica.
- source_word: פְּדָהצוּר
  choice: Pedazur
  rationale: Forma portuguesa tradicional e legível do nome próprio.
