  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: pt
  text: Mas os levitas não foram contados entre os filhos de Israel[a], conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: Mas os levitas
  rationale: A conjunção וְ pode significar “e”, mas aqui introduz contraste com os totais do recenseamento apresentados anteriormente; “mas” expressa esse fluxo com naturalidade.
- source_word: לֹא הָתְפָּקְדוּ
  choice: não foram contados
  rationale: O hitpael de פקד, neste contexto censitário, indica que os levitas não foram incluídos na contagem ou no registro. A forma passiva é clara e natural em português.
- source_word: בְּ/תוֹךְ
  choice: entre
  rationale: A expressão indica inclusão no conjunto maior dos israelitas; “entre” comunica isso de modo conciso.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de maneira transparente a expressão hebraica masculina בְּנֵי יִשְׂרָאֵל. A nota oferece a alternativa idiomática “os israelitas”.
- source_word: כַּ/אֲשֶׁר
  choice: conforme
  rationale: Introduz a correspondência entre o que ocorreu e a ordem divina anterior. “Conforme” é natural e ligeiramente mais explícito que “como” neste contexto.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O perfeito se refere a uma ordem dada anteriormente ao relato da contagem; o mais-que-perfeito composto torna essa anterioridade clara em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: O marcador de objeto direto אֶת acompanha o nome próprio. Em português, “ordenar algo a alguém” pede naturalmente a preposição “a”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino por transliteração, sem substituí-lo pelo título “SENHOR”.
- issue: Abrangência de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal mantém a forma concreta e masculina da expressão hebraica, enquanto a nota registra a formulação coletiva e idiomática sem alterar silenciosamente a forma do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém transparência em relação ao hebraico sem recorrer a linguagem excessivamente arcaica.
