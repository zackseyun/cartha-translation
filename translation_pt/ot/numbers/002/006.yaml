  text: 'and his division[a], and those counted from it: fifty-four thousand four hundred.'
translation:
  language: pt
  text: 'e a sua divisão[a], e os que nela foram contados: cinquenta e quatro mil e quatrocentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o seu exército, e os que dele foram contados: cinquenta e quatro mil e quatrocentos”.'
    reason: Alternativa lexical para צָבָא, que pode designar tanto uma divisão organizada quanto um exército.
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e a sua divisão
  rationale: צָבָא pode significar exército ou hoste, mas, no arranjo do acampamento em Números 1–2, designa o agrupamento militar organizado da tribo. “Divisão” comunica essa unidade organizada sem sugerir um exército permanente separado do contexto do recenseamento. A conjunção e o sufixo masculino singular são representados por “e” e “sua”.
- source_word: וּפְקֻדָיו
  choice: e os que nela foram contados
  rationale: A forma derivada de פקד refere-se às pessoas registradas no recenseamento e associadas à divisão. “Foram contados” preserva o sentido passivo e censitário; “nela” retoma naturalmente “divisão” em português.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquenta e quatro mil e quatrocentos
  rationale: A quantidade exata é apresentada segundo a ordem e a forma usuais dos numerais no português contemporâneo.
