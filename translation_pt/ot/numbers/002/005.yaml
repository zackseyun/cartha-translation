base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: pt
  text: Os que acampam ao lado dele são da tribo de Issacar[a], e o líder dos filhos de Issacar é Natanael, filho de Zuar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Issacar”. A expressão é uma designação tribal comum e se refere aos descendentes ou membros da tribo de Issacar, não somente aos homens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹנִים
  choice: acampará
  rationale: O particípio substantivado descreve o grupo que ocupa uma posição no acampamento. Em português, o futuro concorda naturalmente com o contexto prescritivo da organização do acampamento e com o sujeito singular coletivo “a tribo”.
- source_word: עָלָיו
  choice: Ao lado dele
  rationale: No contexto da disposição do acampamento, a expressão indica proximidade espacial em relação ao grupo mencionado anteriormente, não posição literal sobre ele.
- source_word: מַטֵּה
  choice: a tribo de
  rationale: Neste contexto censitário e tribal, מַטֶּה designa uma tribo, e não um bastão.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: נָשִׂיא
  choice: líder
  rationale: Designa o chefe reconhecido da tribo; “líder” é claro e evita conotações monárquicas indevidas de “príncipe”.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: dos filhos de Issacar
  rationale: Preserva a expressão hebraica de parentesco, que funciona como designação dos descendentes ou membros da tribo.
- source_word: נְתַנְאֵל
  choice: Natanael
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: בֶּן צוּעָר
  choice: filho de Zuar
  rationale: Tradução natural da construção patronímica hebraica.
theological_decisions: []
