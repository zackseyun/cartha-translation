  text: 'e sua divisão[a], e os seus recenseados[b]: sessenta e dois mil e setecentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu exército” ou “seu contingente”; o termo hebraico pode designar uma força militar ou um grupo organizado. Neste contexto censitário, “divisão” representa a organização do contingente tribal.
