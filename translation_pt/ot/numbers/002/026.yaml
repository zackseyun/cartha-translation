lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e sua divisão
  rationale: צָבָא pode designar um exército ou contingente organizado; no contexto da disposição das tribos no acampamento, “divisão” comunica bem a unidade tribal organizada. O sufixo masculino singular é preservado por “sua”.
- source_word: וּפְקֻדֵיהֶם
  choice: os recenseados dentre eles
  rationale: A expressão derivada de פקד refere-se às pessoas contadas no censo e mantém a relação explícita com o grupo por meio de “dentre eles”.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: sessenta e dois mil e setecentos
  rationale: Apresenta a quantidade exata na ordem numérica natural do português contemporâneo.
