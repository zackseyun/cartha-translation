lexical_decisions:
- source_word: מַטֶּה
  choice: tribo
  rationale: No contexto da organização do acampamento em Números, designa a unidade tribal, não um bastão literal.
- source_word: נָשִׂיא
  choice: líder
  rationale: Refere-se ao chefe reconhecido da tribo; “líder” é atual e evita conotações monárquicas de “príncipe”.
- source_word: לִבְנֵי
  choice: dos filhos de
  rationale: Preserva a expressão hebraica que identifica os membros ou descendentes do grupo tribal.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio e tribal.
- source_word: אֲחִירַע
  choice: Aíra
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente direto da fórmula patronímica hebraica.
- source_word: עֵינָן
  choice: Enã
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
