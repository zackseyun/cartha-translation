  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: pt
  text: 'A tribo de Zebulom e o líder dos filhos de Zebulom[a]: Eliabe, filho de Helom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para os filhos de Zebulom”. A preposição hebraica pode ser traduzida de mais de uma maneira estreitamente relacionada nesta fórmula administrativa tribal.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: tribo
  rationale: No contexto da organização do acampamento em Números, o termo designa uma divisão tribal, não um bastão literal.
- source_word: זְבוּלֻן
  choice: Zebulom
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: וְנָשִׂיא
  choice: e o líder
  rationale: Neste contexto administrativo, נָשִׂיא indica o chefe reconhecido da tribo; “líder” é claro e evita a conotação monárquica de “príncipe”.
- source_word: לִבְנֵי זְבוּלֻן
  choice: dos filhos de Zebulom
  rationale: Mantém de modo natural a relação expressa pela preposição ל e preserva o idioma genealógico-tribal do hebraico.
- source_word: אֱלִיאָב
  choice: Eliabe
  rationale: Forma portuguesa tradicional do nome próprio hebraico.
- source_word: בֶּן חֵלֹן
  choice: filho de Helom
  rationale: Tradução direta da construção patronímica hebraica, com formas portuguesas tradicionais dos nomes.
