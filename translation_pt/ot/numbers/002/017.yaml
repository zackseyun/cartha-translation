base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: pt
  text: Então partirá a tenda do encontro, com o acampamento dos levitas no meio dos acampamentos. Na mesma ordem em que acamparem, partirão, cada um no seu lugar[a], segundo as suas bandeiras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na sua posição”. A expressão hebraica envolve literalmente “mão/lado” e indica o lugar atribuído na ordem da marcha.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo os seus estandartes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Então partirá
  rationale: No contexto dos deslocamentos do acampamento, נָסַע significa levantar acampamento e pôr-se em marcha. “Então” expressa a sequência indicada pela conjunção.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Mantém os dois elementos da expressão hebraica e designa de modo claro a tenda cultual onde ocorre o encontro, sem substituir o termo concreto por nomenclatura posterior.
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: o acampamento dos levitas
  rationale: Reproduz diretamente a cadeia construta hebraica e conserva “levitas” como designação do grupo.
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: no meio dos outros acampamentos
  rationale: בְּתוֹךְ indica posição central. “Outros” torna explícita em português a relação natural entre o acampamento levítico e os acampamentos tribais que o cercam.
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: Na mesma ordem em que acamparem, partirão
  rationale: A construção correlativa estabelece correspondência entre a disposição ao acampar e a ordem da marcha. A formulação explicita a ordem implícita no contexto sem alterar o sentido.
- source_word: אִישׁ
  choice: cada um
  rationale: O substantivo singular tem aqui força distributiva, referindo-se a cada pessoa ou unidade dentro da organização da marcha.
- source_word: עַל יָדוֹ
  choice: no seu lugar
  rationale: O idioma baseado em “mão/lado” indica a posição atribuída a cada um na formação, e não literalmente uma mão.
- source_word: לְדִגְלֵיהֶם
  choice: segundo as suas bandeiras
  rationale: דֶּגֶל designa a bandeira ou estandarte que identifica e organiza as divisões tribais. “Segundo” comunica a organização da marcha de acordo com essas bandeiras.
