- from: Os filhos de Israel[a] fizeram tudo conforme Yahweh havia ordenado a Moisés. Assim acampavam junto aos seus estandartes[b] e assim partiam, cada um segundo os seus clãs, conforme a sua casa paterna[c].
  to: Os filhos de Israel[a] fizeram tudo conforme Yahweh havia ordenado a Moisés. Assim acamparam sob seus estandartes[b] e assim partiram, cada um segundo os seus clãs, conforme a sua casa paterna[c].
  rationale: A revisão restaura o valor narrativo dos verbos hebraicos por meio de «acamparam» e «partiram». «Sob seus estandartes» expressa de modo natural a disposição organizada pelas insígnias, mantendo-se uma alternativa espacial na nota. A nota sobre «casa paterna» foi ajustada para uma formulação portuguesa clara e não redundante.
