  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: pt
  text: Os filhos de Israel[a] fizeram tudo conforme Yahweh havia ordenado a Moisés. Assim acamparam sob seus estandartes[b] e assim partiram, cada um segundo os seus clãs, conforme a sua casa paterna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os israelitas”. Em hebraico, literalmente: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “junto aos seus estandartes”. Os estandartes identificavam as divisões organizadas do acampamento.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “conforme a sua casa ancestral”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: Resume o cumprimento das instruções anteriores por Israel; “fizeram” preserva de modo natural o sentido amplo de עשה.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma concreta da expressão hebraica, embora ela designe coletivamente os israelitas.
- source_word: כְּכֹל אֲשֶׁר
  choice: tudo conforme
  rationale: Expressa tanto a abrangência de כֹּל quanto a correspondência indicada por כְּ, sem rigidez desnecessária.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צִוָּה ... אֶת מֹשֶׁה
  choice: havia ordenado a Moisés
  rationale: O mais-que-perfeito deixa clara, em português, a anterioridade da ordem em relação ao cumprimento narrado.
- source_word: כֵּן ... וְכֵן
  choice: assim ... e assim
  rationale: A repetição preserva a ênfase hebraica na correspondência exata entre a ordem e as ações de acampar e partir.
- source_word: חָנוּ
  choice: acampavam
  rationale: O imperfeito descritivo em português apresenta a maneira habitual ou ordenada pela qual o povo se instalava no acampamento.
- source_word: לְדִגְלֵיהֶם
  choice: junto aos seus estandartes
  rationale: דגל designa o estandarte que identificava e organizava uma divisão do acampamento; “junto aos” comunica a disposição espacial sem reduzir o termo a uma bandeira meramente decorativa.
- source_word: נָסָעוּ
  choice: partiam
  rationale: No contexto das etapas da marcha, o verbo indica levantar acampamento e pôr-se em viagem; “partiam” é claro e natural.
- source_word: אִישׁ
  choice: cada um
  rationale: Reproduz o valor distributivo do singular hebraico sem acrescentar uma referência masculina desnecessariamente enfática.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה, neste contexto tribal, refere-se a subdivisões de parentesco maiores que a família nuclear.
- source_word: עַל בֵּית אֲבֹתָיו
  choice: conforme a sua casa paterna
  rationale: A expressão indica a unidade social organizada pela linhagem dos antepassados paternos; a formulação conserva a imagem institucional do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo silenciosamente por um título.
- issue: Relação entre clã e casa paterna
  choice: manter as duas expressões distintas
  alternative: fundir ambas como “famílias”
  rationale: O hebraico apresenta מִשְׁפָּחוֹת e בֵּית אָבוֹת como termos relacionados, mas não idênticos. Preservar ambos evita apagar a possível diferença entre níveis de organização social.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição “assim ... e assim” foi mantida para refletir a estrutura enfática do hebraico. “Casa paterna” conserva o vocabulário social do contexto sem recorrer a uma paráfrase excessiva.
