  text: דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָ/ה לְ/צִבְאֹתָ֑/ם וְ/נָשִׂיא֙ לִ/בְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן עַמִּֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: pt
  text: A bandeira do acampamento de Dã ficará ao norte, segundo as suas divisões[a]; e o líder dos filhos de Dã será Aiezer, filho de Amisadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme os seus contingentes” ou “segundo os seus exércitos”.
    reason: Alternativas lexicais para לְצִבְאֹתָם, que pode designar divisões, contingentes ou hostes organizadas.
lexical_decisions:
- source_word: דֶּגֶל
  choice: bandeira
  rationale: Designa o estandarte tribal sob o qual o acampamento era organizado; “bandeira” é claro e natural em português moderno.
- source_word: מַחֲנֵה
  choice: acampamento
  rationale: Expressa o acampamento tribal organizado no contexto de Números 2.
- source_word: צָפֹנָה
  choice: ao norte
  rationale: A forma direcional indica a localização no lado norte da disposição do acampamento.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: Refere-se aos agrupamentos organizados do contingente tribal; mantém o caráter ordenado sem recorrer a linguagem militar arcaica.
- source_word: וְנָשִׂיא
  choice: e o líder
  rationale: נָשִׂיא designa aqui o chefe reconhecido da tribo; “líder” evita a conotação monárquica moderna de “príncipe”.
- source_word: לִבְנֵי דָן
  choice: dos filhos de Dã
  rationale: Preserva a designação tribal masculina formal do hebraico.
- source_word: אֲחִיעֶזֶר
  choice: Aiezer
  rationale: Transliteração portuguesa corrente do nome hebraico.
- source_word: בֶּן עַמִּישַׁדָּי
  choice: filho de Amisadai
  rationale: Reproduz diretamente a construção patronímica e translitera o nome conforme o uso português.
theological_decisions:
- issue: Designação tribal marcada por gênero em בְנֵי
  choice: filhos de Dã
  alternative: descendentes de Dã; povo de Dã
  rationale: O texto hebraico emprega a designação tribal formal masculina; ela é preservada sem ampliar ou neutralizar silenciosamente seu sentido.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A construção mantém a fórmula administrativa e militar do capítulo sem soar arcaica.
