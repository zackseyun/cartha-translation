lexical_decisions:
- source_word: צְבָאוֹ
  choice: a sua tropa
  rationale: No contexto do censo e da organização do acampamento, צָבָא designa o contingente organizado da tribo. “Tropa” preserva o sentido coletivo e militar sem sugerir necessariamente combate ativo.
- source_word: פְקֻדָיו
  choice: os que nela foram contados
  rationale: A forma deriva de פקד no sentido censitário e se refere aos integrantes recenseados do contingente. O pronome masculino hebraico é expresso por “nela”, concordando naturalmente com “tropa” em português.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarenta e seis mil e quinhentos
  rationale: O total hebraico é vertido na ordem numérica corrente do português contemporâneo.
