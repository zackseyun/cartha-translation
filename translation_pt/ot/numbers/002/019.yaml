  text: 'And his division[a], those numbered from them: forty thousand and five hundred.'
translation:
  language: pt
  text: 'E a sua divisão, e os seus recenseados[a]: quarenta mil e quinhentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus alistados”. O termo hebraico pode designar os inscritos ou contados para o serviço no recenseamento.
