lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: E a sua divisão
  rationale: No contexto da organização do acampamento e do recenseamento, צָבָא designa o contingente organizado ligado à tribo. “Divisão” conserva o sentido coletivo e militar sem sugerir que se trate de todo um exército.
- source_word: וּפְקֻדֵיהֶם
  choice: os que foram contados dentre eles
  rationale: A forma derivada de פקד refere-se aos recenseados ou alistados. A expressão mantém o sufixo plural (“deles”) e evita acrescentar “homens”, que está implícito no contexto, mas não aparece nesta cláusula.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarenta mil e quinhentos
  rationale: Tradução direta da construção cardinal hebraica, em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa próxima da fórmula hebraica de recenseamento. O marcador [a] foi colocado após “divisão”, seguindo a camada de consulta inglesa, embora a nota esclareça mais diretamente a expressão seguinte, ligada ao ato de contar ou alistar.
