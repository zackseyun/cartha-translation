  text: 'and his division[a], those numbered from them: thirty-two thousand two hundred.'
translation:
  language: pt
  text: 'e a sua divisão[a], os que foram recenseados dentre eles: trinta e dois mil e duzentos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o seu exército” ou “a sua hoste”; aqui, o hebraico צָבָא se refere ao contingente tribal organizado para acampar e marchar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: e a sua divisão
  rationale: צָבָא pode significar exército ou hoste, mas, no contexto da organização do acampamento e da marcha em Números 2, designa o contingente tribal. “Divisão” comunica com naturalidade esse sentido organizacional.
- source_word: וּפְקֻדֵיהֶם
  choice: os que foram contados entre eles
  rationale: A forma derivada de פקד refere-se aos recenseados ou alistados. A expressão preserva o sufixo plural (“eles”) e introduz com clareza o total do recenseamento.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: trinta e dois mil e duzentos
  rationale: É o numeral cardinal direto, expresso na ordem natural do português contemporâneo.
