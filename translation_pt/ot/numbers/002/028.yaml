  text: 'And his company[b][a], those numbered from them: forty-one thousand five hundred.'
translation:
  language: pt
  text: E o seu contingente, isto é, os seus recenseados[a], era de quarenta e um mil e quinhentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que foram alistados dele”; literalmente, “os seus recenseados”.'
