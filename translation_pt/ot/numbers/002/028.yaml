lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: E o seu contingente
  rationale: No contexto do censo e da organização do acampamento, צָבָא designa uma divisão organizada, com caráter militar. “Contingente” preserva esse sentido sem sugerir combate em curso; o sufixo masculino singular é representado por “seu”.
- source_word: וּפְקֻדֵיהֶם
  choice: os que foram contados entre eles
  rationale: A expressão derivada de פקד refere-se aos membros recenseados ou alistados. Esta formulação é natural em português e evita acrescentar “homens”, palavra não explícita nesta oração.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarenta e um mil e quinhentos
  rationale: O número hebraico é expresso na ordem normal do português contemporâneo, sem alteração de sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Contingente” comunica a unidade tribal organizada no contexto militar do recenseamento. A ordem sintática foi levemente naturalizada, e “era de” torna idiomática a apresentação do total.
