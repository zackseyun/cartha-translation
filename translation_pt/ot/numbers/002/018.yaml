  text: דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְ/צִבְאֹתָ֖/ם יָ֑מָּ/ה וְ/נָשִׂיא֙ לִ/בְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: pt
  text: A bandeira[a] do acampamento de Efraim, segundo as suas divisões[b], ficará no lado oeste[c]; e o líder dos filhos de Efraim será Elisama, filho de Amiúde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estandarte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo os seus contingentes”. O hebraico expressa uma organização de caráter militar.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “em direção ao mar”, isto é, para o oeste.'
    reason: source_idiom
lexical_decisions:
- source_word: דֶּגֶל
  choice: bandeira
  rationale: Designa o sinal identificador em torno do qual o acampamento tribal era organizado. “Bandeira” é claro e corrente; “estandarte” também é possível.
- source_word: מַחֲנֵה
  choice: acampamento
  rationale: Refere-se ao acampamento ou formação organizada da tribo; “acampamento” é natural neste contexto.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: Preserva o sentido de organização em contingentes ordenados, sem sugerir necessariamente combate ativo.
- source_word: יָמָּה
  choice: no lado oeste
  rationale: O advérbio direcional significa literalmente “em direção ao mar” e, na orientação geográfica israelita, indica o oeste. A expressão se ajusta à fórmula de posicionamento do acampamento.
- source_word: וְנָשִׂיא
  choice: e o líder
  rationale: נָשִׂיא designa o chefe ou dirigente tribal. “Líder” comunica a função sem a possível conotação dinástica de “príncipe”.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: dos filhos de Efraim
  rationale: Mantém a linguagem hebraica de parentesco usada como designação tribal dos descendentes de Efraim.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama, filho de Amiúde
  rationale: Emprega as formas portuguesas usuais dos nomes e traduz בֶּן diretamente como “filho de”.
