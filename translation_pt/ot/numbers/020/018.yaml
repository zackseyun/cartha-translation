  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: pt
  text: 'Mas Edom lhe disse: “Você não passará por mim[a], senão sairei ao seu encontro[b] com a espada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, pelo território de Edom. O hebraico personifica a nação e diz literalmente “por mim”.
    reason: lexical_alternative
  - marker: b
    text: 'Neste contexto, “sair ao seu encontro” tem sentido hostil: sair armado para enfrentá-lo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: lhe disse
  rationale: A forma narrativa de אמר seguida de אֶל é expressa naturalmente como “lhe disse”, mantendo a referência masculina singular do contexto.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Mantém o nome próprio da nação e preserva sua personificação como quem fala em nome do território.
- source_word: לֹא תַעֲבֹר
  choice: Você não passará
  rationale: O imperfeito qal masculino singular tem aqui força de proibição ou recusa categórica; o futuro em português comunica naturalmente essa determinação.
- source_word: בִּי
  choice: por mim
  rationale: A expressão significa literalmente “em/por mim”. Como Edom representa uma nação e seu território, refere-se a atravessar suas terras, mas a formulação personificada do hebraico foi preservada.
- source_word: פֶּן
  choice: senão
  rationale: Introduz a consequência ameaçadora da desobediência; “senão” é corrente e claro em português.
- source_word: אֵצֵא לִקְרָאתֶךָ
  choice: sairei ao seu encontro
  rationale: Preserva a formulação hebraica, que pode significar sair para encontrar alguém e, neste contexto militar, implica confronto hostil.
- source_word: בַּחֶרֶב
  choice: com a espada
  rationale: Mantém a imagem concreta do hebraico e seu sentido idiomático de ação armada.
