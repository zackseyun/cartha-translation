  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: pt
  text: Quando toda a comunidade viu que Arão havia morrido[a], toda a casa de Israel[b] chorou por Arão durante trinta dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «percebeu que Arão havia morrido». O hebraico diz literalmente «viu que Arão havia morrido»; nesse contexto, «ver» pode incluir a ideia de reconhecer ou constatar o fato.'
    reason: lexical_alternative
  - marker: b
    text: «Toda a casa de Israel» é uma expressão coletiva que se refere a todo o povo de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: viu
  rationale: Preserva o sentido básico de ראה, «ver», sem excluir aqui a nuance contextual de perceber ou constatar o fato.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade israelita reunida; «comunidade» é natural e amplamente compreensível no português atual.
- source_word: כִּי
  choice: que
  rationale: 'Introduz o conteúdo do que a comunidade viu ou constatou: que Arão havia morrido.'
- source_word: גָוַע
  choice: havia morrido
  rationale: גוע é um verbo solene para morrer ou expirar; o mais-que-perfeito composto expressa com clareza a anterioridade em relação ao ato de ver.
- source_word: וַיִּבְכּוּ
  choice: chorou
  rationale: בכה significa chorar; o singular concorda naturalmente com a expressão coletiva «toda a casa de Israel».
- source_word: אֶת אַהֲרֹן
  choice: por Arão
  rationale: Com בכה, a partícula de objeto assinala a pessoa cuja morte é lamentada; «chorar por» é idiomático em português.
- source_word: שְׁלֹשִׁים יוֹם
  choice: durante trinta dias
  rationale: Explicita naturalmente em português o acusativo hebraico de duração.
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: toda a casa de Israel
  rationale: Mantém a expressão corporativa e pactual בֵּית יִשְׂרָאֵל, sem reduzi-la simplesmente a «todo Israel».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário de ampla compreensão. A ordem das orações e a expressão «casa de Israel» preservam de perto a forma e o caráter corporativo do hebraico, enquanto «durante trinta dias» torna explícita a duração exigida pelo uso natural do português.
