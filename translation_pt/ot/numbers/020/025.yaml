lexical_decisions:
- source_word: קַח
  choice: Tome
  rationale: O imperativo qal de לקח significa normalmente “tomar”. “Tome” expressa de modo direto e natural a ordem dada a Moisés.
- source_word: אַהֲרֹן
  choice: Arão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: בְּנוֹ
  choice: seu filho
  rationale: O sufixo masculino singular refere-se naturalmente a Arão no contexto, identificando Eleazar como filho dele.
- source_word: וְהַעַל
  choice: e faça-os subir
  rationale: O imperativo hifil de עלה tem sentido causativo, “fazer subir”. A formulação preserva esse valor sem especificar indevidamente se Moisés os conduziria ou apenas os levaria consigo.
- source_word: אֹתָם
  choice: -os
  rationale: O pronome de objeto direto refere-se conjuntamente a Arão e Eleazar.
- source_word: הֹר הָהָר
  choice: monte Hor
  rationale: Esta é a forma toponímica convencional e natural em português para a expressão hebraica literalmente construída como “Hor, o monte”.
