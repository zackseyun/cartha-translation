  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: pt
  text: Tome Arão e Eleazar, seu filho, e faça-os subir ao monte Hor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Hor, o monte”; tradicionalmente traduzido como “monte Hor”.'
