  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: pt
  text: 'Então Moisés e Arão reuniram a assembleia diante da rocha, e ele lhes disse: “Escutem agora, rebeldes! Será que tiraremos[a] água desta rocha para vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: faremos sair água desta rocha para vocês.'
    reason: Alternativa mais explícita e formal para o sentido causativo do hifil נוֹצִיא.
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: reuniram
  rationale: O hifil de קהל expressa fazer reunir. “Reuniram” comunica de modo natural em português que Moisés e Arão ajuntaram o povo.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: קָהָל designa a comunidade reunida. “Assembleia” preserva a ideia do grupo congregado sem acrescentar conotações eclesiásticas posteriores.
- source_word: אֶל פְּנֵי הַסָּלַע
  choice: diante da rocha
  rationale: A expressão significa “diante de” ou “em frente de”; “diante da rocha” é conciso, digno e natural.
- source_word: וַיֹּאמֶר
  choice: ele lhes disse
  rationale: O verbo está no singular e retoma naturalmente Moisés após o sujeito composto “Moisés e Arão”, sem substituir o pronome pelo nome de forma interpretativa.
- source_word: שִׁמְעוּ נָא
  choice: Escutem agora
  rationale: O imperativo de שׁמע pede atenção, e נָא acrescenta urgência ou ênfase. “Escutem agora” reproduz essa força em português atual.
- source_word: הַמֹּרִים
  choice: rebeldes
  rationale: O particípio substantivado de מרה caracteriza os ouvintes como pessoas rebeldes. A forma direta conserva a severidade da repreensão.
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: Será que ... desta rocha
  rationale: A partícula interrogativa introduz a pergunta, e מִן indica a origem. “Desta rocha” expressa naturalmente a fonte da água.
- source_word: נוֹצִיא
  choice: tiraremos
  rationale: O hifil de יצא significa fazer sair ou tirar para fora. “Tiraremos” é natural no contexto e mantém tanto o sentido causativo quanto a primeira pessoa do plural; a alternativa mais explícita consta em nota.
- source_word: מָיִם
  choice: água
  rationale: Equivalente português usual de מַיִם neste contexto.
theological_decisions:
- issue: Primeira pessoa do plural na pergunta de Moisés
  choice: Será que tiraremos água desta rocha para vocês?
  alternative: Será que Deus fará sair água desta rocha para vocês?
  rationale: O hebraico traz explicitamente a primeira pessoa do plural, נוֹצִיא. A tradução a preserva e não elimina a tensão entre o papel de Moisés e Arão e a ação de Deus; o contexto narrativo deve esclarecer essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a repreensão incisiva, a referência pronominal singular e a pergunta retórica sem explicitar além do hebraico a agência divina.
