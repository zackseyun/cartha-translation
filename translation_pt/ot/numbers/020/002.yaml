base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/002.yaml
  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: pt
  text: Não havia água para a comunidade[a], e eles se reuniram contra Moisés e contra Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «congregação» ou «assembleia». O hebraico עֵדָה designa o povo de Israel reunido.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: Não havia
  rationale: A construção com היה e um substantivo indefinido expressa existência; «não havia» é a forma natural em português. O וְ liga o episódio ao contexto, sem exigir um marcador temporal explícito.
- source_word: מַיִם
  choice: água
  rationale: Embora a forma hebraica seja plural, trata-se do plural usual para a substância; em português emprega-se naturalmente o nome massivo singular.
- source_word: לָ/עֵדָה
  choice: para a comunidade
  rationale: עֵדָה designa coletivamente o povo de Israel reunido. «Comunidade» é claro, atual e preserva o sentido corporativo; «congregação» e «assembleia» também são possíveis.
- source_word: וַ/יִּקָּהֲלוּ
  choice: eles se reuniram
  rationale: O verbo קהל indica reunir-se como grupo. A forma pronominal é idiomática em português e conserva a ação coletiva.
- source_word: עַל
  choice: contra
  rationale: Neste contexto de queixa e confronto, עַל indica oposição hostil, e não simples proximidade ou direção.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְ/עַל אַהֲרֹן
  choice: e contra Arão
  rationale: A repetição da preposição é mantida, indicando que a oposição se dirigia distintamente aos dois líderes.
