source:
  edition: WLC
  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: pt
  text: Pegue o cajado[a] e reúna a comunidade[b], você e seu irmão Arão. Falem à rocha diante dos olhos deles[c], e ela dará a sua água. Então você fará sair água da rocha para eles e dará de beber à comunidade e aos animais deles[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a vara”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a congregação” ou “a assembleia”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, publicamente, à vista deles.
    reason: idiom_clarification
  - marker: d
    text: 'Ou: “ao gado deles” ou “aos animais domésticos deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: o cajado
  rationale: מַטֶּה pode designar cajado ou vara. “Cajado” é natural em português moderno e identifica adequadamente o objeto que Moisés deve levar.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: עֵדָה designa a comunidade israelita reunida. “Comunidade” comunica o sentido coletivo sem sugerir apenas uma reunião momentânea.
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: Falem à rocha
  rationale: דבר אל significa “falar a”. A forma verbal hebraica é plural e inclui Moisés e Arão; por isso, “falem” preserva uma distinção gramatical relevante no texto.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: A expressão significa literalmente “diante dos olhos deles” e ressalta que o ato deveria ocorrer publicamente, à vista da comunidade.
- source_word: וְנָתַן מֵימָיו
  choice: e ela dará a sua água
  rationale: O sujeito singular é a rocha, e o sufixo possessivo em מֵימָיו é preservado por “a sua água”, sem explicar como a água está ligada à rocha.
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: Então você fará sair água da rocha para eles
  rationale: O hifil de יצא expressa fazer sair ou tirar para fora. “Então” representa com naturalidade a sequência das ações, e o singular “você” corresponde à forma hebraica dirigida a Moisés.
- source_word: וְהִשְׁקִיתָ
  choice: e dará de beber
  rationale: O hifil de שקה significa dar de beber ou fazer beber. A expressão escolhida é corrente em português e conserva o valor causativo.
- source_word: בְּעִירָם
  choice: aos animais deles
  rationale: בְּעִיר refere-se a animais domésticos ou gado. “Animais” é claro e abrangente no texto principal, enquanto a nota registra alternativas mais específicas.
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: você e seu irmão Arão
  rationale: A expressão identifica explicitamente Moisés e Arão como participantes da reunião da comunidade. A ordem adotada é natural em português e mantém a relação familiar.
theological_decisions:
- issue: Caráter público da ordem relativa ao milagre
  choice: “diante dos olhos deles”
  alternative: “diante deles” ou “à vista deles”
  rationale: A formulação mais concreta preserva a ênfase do hebraico no testemunho visível da comunidade, elemento importante para o desenvolvimento narrativo posterior.
- issue: Alternância entre ordens no singular e no plural
  choice: Manter “falem” no plural, mas “você fará sair” e “dará” no singular
  alternative: Uniformizar todas as ordens no singular ou no plural
  rationale: O hebraico alterna deliberadamente entre וְדִבַּרְתֶּם, plural, e וְהוֹצֵאתָ / וְהִשְׁקִיתָ, singular. A tradução conserva essa tensão gramatical sem atribuir responsabilidades além do que o texto afirma.
- issue: A rocha como sujeito de “dar”
  choice: “ela dará a sua água”
  alternative: “a água sairá dela”
  rationale: A construção hebraica apresenta a rocha como sujeito e fala de “sua água”. A tradução retém essa personificação discreta e não a substitui por uma explicação causal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A tradução mantém a alternância hebraica entre plural e singular e conserva imagens concretas, como “diante dos olhos deles” e a rocha dando “a sua água”.
