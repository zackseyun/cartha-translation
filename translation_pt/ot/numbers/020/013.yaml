  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: pt
  text: Estas são as águas de Meribá[a], onde os filhos de Israel contenderam com Yahweh, e ele se mostrou santo entre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meribá significa “contenda” ou “disputa”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e ele foi manifestado como santo neles” ou “e ele demonstrou sua santidade por meio deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: Estas são
  rationale: O pronome demonstrativo identifica as águas em uma fórmula de nomeação; o presente é natural em português, embora o passado também seja possível.
- source_word: מֵי מְרִיבָה
  choice: as águas de Meribá
  rationale: A expressão construta significa literalmente “águas de Meribá/contenda”. Como מְרִיבָה funciona aqui como nome do lugar, mantém-se a transliteração, e seu sentido lexical é explicado em nota.
- source_word: רָבוּ
  choice: contenderam
  rationale: O verbo ריב indica disputa ou contenda. “Contenderam” preserva a força do termo e combina naturalmente com “com Yahweh” neste contexto solene.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a forma masculina plural da expressão hebraica e seu uso tradicional como designação coletiva do povo de Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: וַיִּקָּדֵשׁ
  choice: e ele se mostrou santo
  rationale: O nifal de קדש indica que a santidade de Yahweh se manifestou no acontecimento. A forma reflexiva comunica isso em português sem sugerir que alguém tornou Deus santo.
- source_word: בָּם
  choice: entre eles
  rationale: A preposição ב com o sufixo pode significar “neles”, “entre eles” ou “por meio deles”; “entre eles” expressa naturalmente a manifestação da santidade de Yahweh no âmbito do povo.
theological_decisions:
- issue: Como expressar a manifestação da santidade de Yahweh na oração final
  choice: e ele se mostrou santo entre eles
  alternative: e ele foi reconhecido como santo neles / e ele demonstrou sua santidade por meio deles
  rationale: A construção hebraica admite matiz passivo ou reflexivo. A tradução escolhida preserva essa tensão sem dar a entender que seres humanos fizeram Deus tornar-se santo; a nota registra alternativas possíveis.
- issue: Como traduzir בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas / o povo de Israel
  rationale: A opção conserva a forma explícita do hebraico, que funciona coletivamente como designação do povo da aliança, sem introduzir linguagem denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Contenderam” mantém o vínculo semântico com Meribá e o tom narrativo solene; “se mostrou santo” evita uma formulação passiva potencialmente enganosa, enquanto a nota preserva a ambiguidade do hebraico.
