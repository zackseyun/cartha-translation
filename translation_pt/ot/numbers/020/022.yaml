  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל כָּל הָ/עֵדָ֖ה הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: pt
  text: Partiram de Cades, e os israelitas[a], toda a comunidade, chegaram ao monte Hor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Hor, o monte”; a expressão funciona como nome de lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: O verbo נסע, nesta sequência narrativa, indica levantar acampamento e seguir viagem. “Partiram” expressa com naturalidade a saída de Cades sem acrescentar detalhes ausentes do hebraico.
- source_word: מִקָּדֵשׁ
  choice: de Cades
  rationale: O texto hebraico traz apenas o topônimo Cades. Não se acrescenta “Barneia”, embora essa identificação possa ser inferida do contexto mais amplo.
- source_word: וַיָּבֹאוּ
  choice: chegaram
  rationale: בוא pode significar “vir”, “entrar” ou “chegar”. Diante de um destino geográfico, “chegaram” é a formulação portuguesa mais natural.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: A expressão hebraica significa literalmente “os filhos de Israel”, mas “os israelitas” comunica o sentido coletivo de modo claro e corrente em português moderno; a forma literal é preservada em nota.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa a coletividade reunida de Israel. “Comunidade” é clara e atual, e “toda” traduz כָּל.
- source_word: הֹר הָהָר
  choice: monte Hor
  rationale: A construção, literalmente “Hor, o monte”, funciona como topônimo e é convencionalmente expressa em português como “monte Hor”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa simples. “Israelitas” favorece a legibilidade ampla, enquanto a nota conserva a transparência do idioma familiar hebraico. Os travessões foram evitados para manter o fluxo direto do versículo.
