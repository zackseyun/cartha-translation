  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés e a Arão: “Visto que vocês não confiaram em mim[a] para me reconhecer como santo[b] diante dos israelitas[c], vocês não conduzirão esta assembleia para a terra que lhes dei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não creram em mim”. O verbo hebraico pode expressar tanto crer como confiar.
    reason: lexical_alternative
  - marker: b
    text: Ou “para me tratar como santo”, “para me santificar” ou “para sustentar a minha santidade”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “os filhos de Israel”; tradicionalmente, “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: יַעַן לֹא הֶאֱמַנְתֶּם בִּי
  choice: Visto que vocês não confiaram em mim
  rationale: O hifil de אמן com ב pode expressar crer ou confiar; no contexto, “confiaram em mim” soa natural em português sem eliminar a alternativa lexical.
- source_word: לְהַקְדִּישֵׁנִי
  choice: para me reconhecer como santo
  rationale: Expressa o sentido causativo e público de tratar ou apresentar Yahweh como santo, evitando o possível sentido de tornar Deus santo.
- source_word: לְעֵינֵי בְּנֵי יִשְׂרָאֵל
  choice: diante dos israelitas
  rationale: Verte naturalmente a expressão idiomática “aos olhos dos filhos de Israel” e mantém a dimensão pública da falta.
- source_word: לָכֵן לֹא תָבִיאוּ
  choice: vocês não conduzirão
  rationale: O hifil de בוא significa fazer entrar ou levar; “conduzirão” adequa-se à liderança de Moisés e Arão e conserva a declaração solene de consequência.
- source_word: הַקָּהָל הַזֶּה
  choice: esta assembleia
  rationale: Mantém o sentido de povo reunido sem introduzir conotação eclesiástica desnecessária.
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָהֶם
  choice: à terra que lhes dei
  rationale: Conserva o perfeito hebraico como dádiva já estabelecida e a linguagem pactual da terra.
theological_decisions:
- issue: Natureza da falha de Moisés e Arão
  choice: Manter tanto a falta de confiança quanto a falha em reconhecer Yahweh como santo diante do povo.
  alternative: Explicar a falta exclusivamente como desobediência, ira ou apropriação do poder divino.
  rationale: O versículo associa os dois elementos, mas não explica de modo exaustivo como a ação deles os manifestou; a tradução preserva essa tensão.
- issue: Sentido de לְהַקְדִּישֵׁנִי
  choice: “para me reconhecer como santo”
  alternative: “para me santificar” ou “para mostrar a minha santidade”
  rationale: A opção principal deixa claro que Moisés e Arão deveriam reconhecer publicamente a santidade de Deus, sem sugerir que poderiam torná-lo santo.
- issue: Referente de בְּנֵי יִשְׂרָאֵל
  choice: “os israelitas”
  alternative: “os filhos de Israel”
  rationale: A expressão hebraica funciona como etnônimo coletivo e inclui o povo de Israel; “israelitas” comunica isso naturalmente em português moderno.
translation_notes:
  register: Português contemporâneo, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e mantém “Yahweh” como nome próprio. A ordem causal foi preservada, mas com sintaxe natural em português.
