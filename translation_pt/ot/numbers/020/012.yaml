  terminology: “Yahweh”, “Moisés”, “Arão”, “assembleia” e “terra” são escolhas consistentes. A nota sobre בני ישראל deve limitar-se ao que o hebraico e a tradição textual efetivamente dizem; a alternativa “filhos e filhas de Israel” não é uma formulação tradicional da expressão nem corresponde à sua forma hebraica.
