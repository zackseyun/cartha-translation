base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/007.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também representado como “Yahweh” ou “Jeová”.'
    reason: Registra o Tetragrama hebraico e formas conhecidas de representá-lo.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com o piel de דבר introduz a fala na narrativa; “falou” conserva a cadência formal sem soar antiquado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; em português, “falar a alguém” preserva de modo natural essa relação.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz, de maneira explícita, o conteúdo da fala no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; a nota registra formas alternativas conhecidas.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa próxima do hebraico. O infinitivo לֵאמֹר foi mantido como “dizendo”, e os dois-pontos sinalizam que a fala continua no versículo seguinte.
