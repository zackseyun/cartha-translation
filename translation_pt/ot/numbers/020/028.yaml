  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: pt
  text: Então Moisés tirou de Arão as suas vestes e vestiu Eleazar, seu filho, com elas[a]. Arão morreu ali, no alto do monte[b]. Depois, Moisés e Eleazar desceram do monte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, as vestes oficiais de Arão como sacerdote foram transferidas para Eleazar como parte da sucessão descrita no contexto.
    reason: cultural_note
  - marker: b
    text: 'Ou: “no cume do monte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: tirou de Arão
  rationale: O hifil de פשט indica retirar de alguém uma peça de roupa. A construção portuguesa explicita de modo natural de quem as vestes foram tiradas, sem acrescentar conteúdo.
- source_word: בְּגָדָיו
  choice: as suas vestes
  rationale: בגד é o termo geral para roupa ou veste. “Vestes” mantém o tom digno e não introduz no texto principal a especificação contextual “sacerdotais”.
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: as colocou em Eleazar, seu filho
  rationale: O hifil de לבש significa vestir alguém. Esta formulação corrente preserva a referência de אֹתָם às vestes e identifica Eleazar como filho de Arão, conforme a sintaxe e o contexto.
- source_word: וַיָּמָת
  choice: morreu
  rationale: מות é o verbo comum para morrer; a tradução direta evita eufemismo.
- source_word: שָׁם
  choice: ali
  rationale: Preserva explicitamente o advérbio locativo e soa natural na narrativa em português.
- source_word: בְּרֹאשׁ הָהָר
  choice: no alto do monte
  rationale: רֹאשׁ, literalmente “cabeça”, designa idiomaticamente o alto ou cume. “No alto do monte” conserva a imagem espacial com naturalidade.
- source_word: וַיֵּרֶד
  choice: desceram
  rationale: ירד significa descer. O plural em português reúne naturalmente os dois sujeitos coordenados, Moisés e Eleazar, embora o verbo hebraico anteceda o sujeito composto no singular.
- source_word: מִן הָהָר
  choice: do monte
  rationale: Traduz de modo direto a origem do movimento expressa por מִן.
theological_decisions:
- issue: Natureza das vestes transferidas de Arão para Eleazar
  choice: “vestes” no texto principal, com explicação contextual em nota
  alternative: “vestes sacerdotais” ou “paramentos” no texto principal
  rationale: O contexto apresenta uma sucessão sacerdotal, mas o versículo emprega o substantivo geral בגד. A tradução evita inserir no corpo do texto uma qualificação não expressa, enquanto a nota esclarece a função contextual.
- issue: Referente de “seu filho”
  choice: Eleazar é apresentado como filho de Arão
  alternative: Entender a expressão portuguesa como se Eleazar fosse filho de Moisés
  rationale: O hebraico בְּנוֹ retoma Arão, e o contexto identifica Eleazar como filho dele. A pontuação favorece essa leitura sem parafrasear excessivamente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno; “vestes” preserva a generalidade do hebraico, e “monte” mantém a terminologia narrativa tradicional sem soar arcaica.
