id: NUM.20.19
reference: Numbers 20:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: pt
  text: 'Os filhos de Israel lhe disseram[a]: “Subiremos pela estrada principal[b]; e, se eu e o meu gado bebermos da sua água, pagarei por ela. Deixe-me apenas passar a pé[c], nada mais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico se refere a uma estrada preparada ou elevada, uma via principal.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “com os meus pés passarei”; trata-se de uma expressão para a simples passagem pelo território.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica e sua forma masculina plural; “os israelitas” seria mais fluente, mas menos transparente à redação da fonte.
- source_word: בַּמְסִלָּה
  choice: pela estrada principal
  rationale: מְסִלָּה designa uma estrada preparada ou elevada, isto é, uma via principal. “Pela” expressa naturalmente o percurso ao longo dessa via.
- source_word: נַעֲלֶה
  choice: subiremos
  rationale: Mantém o sentido básico de “subir”, sem reduzi-lo a “passar” ou “viajar”.
- source_word: מֵימֶיךָ
  choice: da sua água
  rationale: Embora “água” tenha forma plural em hebraico, o singular coletivo é idiomático e natural em português.
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: eu e o meu gado bebermos
  rationale: Mantém a mudança do plural coletivo para a primeira pessoa singular representativa. “Gado” comunica de modo conciso o conjunto de animais domésticos.
- source_word: וְנָתַתִּי מִכְרָם
  choice: pagarei por ela
  rationale: Transmite naturalmente a obrigação de pagar o preço da água consumida; o sufixo plural hebraico retoma idiomaticamente “águas”.
- source_word: רַק אֵין דָּבָר
  choice: apenas ... nada mais
  rationale: Reproduz o caráter limitador e minimizador da solicitação sem recorrer à tradução rígida “não há coisa”.
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: Deixe-me ... passar a pé
  rationale: A menção literal aos pés é uma expressão de simples trânsito pelo território; a forma volitiva é representada como pedido cortês.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A alternância entre “subiremos” e as formas na primeira pessoa singular foi mantida porque o porta-voz passa a falar representativamente por Israel. A pontuação esclarece as unidades do pedido sem eliminar a tensão sintática do hebraico.
