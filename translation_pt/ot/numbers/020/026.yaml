base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: pt
  text: Tire as vestes de Arão[a] e vista Eleazar, seu filho, com elas. Então Arão será recolhido[b] e morrerá ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito conforme o contexto, “suas vestes sacerdotais”. O hebraico diz simplesmente “suas vestes”.
    reason: lexical_alternative
  - marker: b
    text: “Será recolhido” é uma expressão hebraica relacionada à morte; em outros lugares aparece a fórmula mais completa “ser recolhido ao seu povo”.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן אֶת־בְּגָדָיו
  choice: Tire de Arão as suas vestes
  rationale: O hifil imperativo de פשט ordena retirar de alguém suas roupas. A formulação é direta e natural; “vestes” conserva o registro solene sem explicitar “sacerdotais”, ausente do termo hebraico.
- source_word: וְהִלְבַּשְׁתָּם אֶת־אֶלְעָזָר בְּנוֹ
  choice: e vista com elas Eleazar, seu filho
  rationale: O verbo no hifil expressa fazer Eleazar usar as vestes, e o sufixo plural é preservado por “com elas”. A construção identifica Eleazar claramente como filho de Arão.
- source_word: יֵאָסֵף
  choice: será recolhido
  rationale: O nifal de אסף é uma expressão ligada à morte. Mantém-se a imagem do hebraico sem acrescentar “ao seu povo”, expressão que não consta deste versículo.
- source_word: וּמֵת שָׁם
  choice: e morrerá ali
  rationale: A sequência verbal indica o resultado futuro, e שָׁם é traduzido naturalmente por “ali”.
theological_decisions:
- issue: Expressão de morte em יֵאָסֵף
  choice: será recolhido
  alternative: será recolhido ao seu povo
  rationale: Embora a fórmula ampliada “recolhido ao seu povo” apareça em outros contextos, aqui o texto traz somente יֵאָסֵף. A tradução conserva a expressão e sua possível nuance teológica sem importar palavras ausentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, e a concisão e a ambiguidade da expressão hebraica sobre a morte foram preservadas.
