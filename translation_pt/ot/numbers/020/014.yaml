  text: וַ/יִּשְׁלַ֨ח מֹשֶׁ֧ה מַלְאָכִ֛ים מִ/קָּדֵ֖שׁ אֶל מֶ֣לֶךְ אֱד֑וֹם כֹּ֤ה אָמַר֙ אָחִ֣י/ךָ יִשְׂרָאֵ֔ל אַתָּ֣ה יָדַ֔עְתָּ אֵ֥ת כָּל הַ/תְּלָאָ֖ה אֲשֶׁ֥ר מְצָאָֽתְ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: pt
  text: 'Então Moisés enviou mensageiros de Cades ao rei de Edom: “Assim diz seu irmão Israel:[a] Você sabe de toda a aflição que nos sobreveio.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Israel, seu parente”. O hebraico diz literalmente “seu irmão Israel”, evocando o parentesco ancestral entre Israel e Edom.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que nos encontrou”; isto é, “que nos sobreveio” ou “que nos aconteceu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... enviou
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: Neste contexto diplomático, designa representantes humanos, não seres celestiais; “mensageiros” é claro e abrangente.
- source_word: מִקָּדֵשׁ
  choice: de Cades
  rationale: O hebraico traz apenas o topônimo Cades, sem a forma ampliada Cades-Barneia.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: ao rei de Edom
  rationale: Tradução direta e natural da construção hebraica.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula convencional usada na transmissão de uma mensagem oficial.
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: Israel, seu irmão
  rationale: Mantém a metáfora familiar e a ordem natural em português, evocando o parentesco ancestral entre Israel e Edom.
- source_word: אַתָּה יָדַעְתָּ
  choice: Você sabe
  rationale: O perfeito expressa aqui um estado presente de conhecimento; o pronome explícito conserva a ênfase do hebraico e é amplamente inteligível.
- source_word: כָּל הַתְּלָאָה
  choice: toda a aflição
  rationale: “Aflição” comunica sofrimento, dificuldade e angústia em linguagem atual e digna.
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: que nos sobreveio
  rationale: Expressa de modo idiomático a imagem hebraica de uma dificuldade que “encontrou” alguém, sem apagar a ideia de algo que lhes aconteceu.
theological_decisions:
- issue: Linguagem de parentesco entre Israel e Edom
  choice: Israel, seu irmão
  alternative: Israel, seu parente
  rationale: A formulação mantém a linguagem familiar deliberada, fundada na relação ancestral entre Jacó e Esaú, sem reduzi-la a um parentesco genérico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A fórmula diplomática “Assim diz” e a metáfora “seu irmão” foram preservadas; a expressão idiomática final foi vertida naturalmente e esclarecida em nota.
