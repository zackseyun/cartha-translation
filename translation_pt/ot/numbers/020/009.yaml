  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: pt
  text: Então Moisés pegou o cajado[a] de diante de Yahweh, conforme Yahweh lhe havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vara”.
    reason: Alternativa lexical para מַטֶּה.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: O qal narrativo de לקח expressa aqui uma ação passada simples. “Pegou” é natural em português e não acrescenta a ideia de levantar ou receber.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico מֹשֶׁה em português.
- source_word: הַמַּטֶּה
  choice: o cajado
  rationale: מַטֶּה pode designar cajado, vara ou tribo. Neste contexto, refere-se ao objeto físico guardado diante de Yahweh; “cajado” é claro e natural, enquanto “vara” permanece como alternativa lexical.
- source_word: מִלִּפְנֵי
  choice: de diante de
  rationale: A expressão preserva o sentido espacial concreto do hebraico e sua ambientação cultual sem expandi-la interpretativamente para “da presença de”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Comunica em português natural a conformidade entre a ação de Moisés e a ordem anterior.
- source_word: צִוָּהוּ
  choice: ele lhe havia ordenado
  rationale: O mais-que-perfeito composto indica naturalmente que a ordem precedeu a ação narrada. Os pronomes conservam a estrutura do hebraico, na qual Yahweh é o sujeito e Moisés o destinatário.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe próxima do hebraico sem perder naturalidade. O marcador da nota foi colocado imediatamente após “cajado”, termo ao qual a alternativa lexical se refere.
