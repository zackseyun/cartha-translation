  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: pt
  text: E por que vocês trouxeram a assembleia de Yahweh para este deserto, para morrermos lá, nós e o nosso gado?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָמָה
  choice: E por que
  rationale: Preserva tanto a conjunção que liga a pergunta à queixa anterior quanto o valor interrogativo.
- source_word: הֲבֵאתֶם
  choice: vocês trouxeram
  rationale: O hifil de בוא significa fazer vir ou trazer; o pretérito perfeito é natural em português para a ação concluída cujas consequências persistem.
- source_word: קְהַל יְהוָה
  choice: a assembleia de Yahweh
  rationale: קָהָל designa a comunidade reunida; “assembleia” conserva o sentido coletivo sem acrescentar conotação eclesiástica. O nome divino é transliterado.
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: a este deserto
  rationale: מִדְבָּר pode designar deserto, região árida ou ermo. “Deserto” é claro e idiomático neste contexto; a preposição “a” expressa o movimento para o lugar.
- source_word: לָמוּת שָׁם
  choice: para morrermos aqui
  rationale: O infinitivo pode indicar propósito ou resultado, ambiguidade preservada por “para”. Embora שָׁם seja literalmente “ali/lá”, na fala situada no deserto o português idiomático usa “aqui” para o lugar onde os falantes se encontram.
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: nós e os nossos animais
  rationale: O pronome explícito recebe ênfase por meio de “nós”; בְּעִיר é um coletivo para animais domésticos ou gado, e “animais” é amplo, claro e adequado ao contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto apresenta o nome próprio divino; a transliteração o distingue de um título e preserva sua função no hebraico.
- issue: Valor de לָמוּת como propósito ou resultado
  choice: para morrermos
  alternative: de modo que morramos
  rationale: A construção hebraica admite finalidade pretendida na acusação ou resultado percebido. “Para” mantém essa tensão sem explicá-la em excesso.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com “vocês” para o plural e ordem natural. “Aqui” traduz de modo dêitico e idiomático o hebraico שָׁם no discurso dos que já estão no deserto. Nenhuma nota é necessária; por isso, não há marcador no texto.
