  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: pt
  text: Arão será reunido ao seu povo[a], pois não entrará na terra que dei aos filhos de Israel[b], porque vocês se rebelaram contra a minha ordem[c] nas águas de Meribá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica associada à morte e à união com o próprio povo ou com os antepassados.
    reason: idiom_clarification
  - marker: b
    text: A expressão hebraica “filhos de Israel” refere-se coletivamente aos israelitas, isto é, ao povo de Israel.
    reason: lexical_clarification
  - marker: c
    text: Literalmente, “contra a minha boca”, no sentido de desobedecer ao que Deus havia ordenado.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָסֵף אֶל־עַמָּיו
  choice: será reunido ao seu povo
  rationale: Preserva a expressão hebraica solene associada à morte e ao pertencimento ancestral, sem reduzi-la simplesmente a “morrer” nem especificar uma doutrina sobre o além.
- source_word: כִּי לֹא יָבֹא אֶל־הָאָרֶץ
  choice: pois não entrará na terra
  rationale: “Entrará na terra” expressa naturalmente o verbo de movimento com a preposição; “pois” introduz com clareza a razão da declaração anterior.
- source_word: אֲשֶׁר נָתַתִּי
  choice: que dei
  rationale: O perfeito hebraico apresenta a concessão da terra como um ato divino estabelecido; o pretérito perfeito é direto e natural em português.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém a forma tradicional e próxima do hebraico da expressão etnonímica, embora ela designe coletivamente o povo de Israel.
- source_word: מְרִיתֶם
  choice: vocês se rebelaram
  rationale: O verbo denota rebelião ou desafio à autoridade; a forma plural “vocês” torna explícito que a censura se dirige a Moisés e Arão.
- source_word: אֶת־פִּי
  choice: contra a minha ordem
  rationale: Literalmente “contra a minha boca”; no contexto, “boca” representa aquilo que Deus falou, isto é, sua ordem.
- source_word: לְמֵי מְרִיבָה
  choice: nas águas de Meribá
  rationale: Conserva o nome próprio tradicional do lugar e do episódio, com uma construção natural em português.
theological_decisions:
- issue: Expressão de morte “reunido ao seu povo”
  choice: Preservar a expressão hebraica
  alternative: Traduzir apenas como “Arão morrerá”
  rationale: A formulação evoca morte e pertencimento ao povo ou aos antepassados, mas não define com precisão o estado após a morte. Preservá-la mantém essa amplitude e tensão.
- issue: Sentido coletivo de בְּנֵי יִשְׂרָאֵל
  choice: “filhos de Israel” no texto principal
  alternative: “israelitas” ou “povo de Israel”
  rationale: A escolha conserva a forma masculina e genealógica da expressão hebraica, enquanto a nota esclarece seu uso coletivo sem restringir o referente aos homens.
- issue: Responsabilidade conjunta expressa pelo verbo plural מְרִיתֶם
  choice: Usar “vocês se rebelaram”
  alternative: Empregar uma forma ambígua ou singular
  rationale: O plural hebraico responsabiliza os dois destinatários no contexto, Moisés e Arão, sem repartir ou graduar a culpa além do que o versículo afirma.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a solenidade da expressão de morte, o nome tradicional “Meribá” e a forma “filhos de Israel”; as notas esclarecem os hebraísmos sem sobrecarregar o texto principal.
