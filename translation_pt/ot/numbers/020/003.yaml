  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: pt
  text: 'O povo discutiu com Moisés e disse: “Quem dera tivéssemos morrido quando nossos irmãos morreram diante de Yahweh!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶב
  choice: discutiu
  rationale: O verbo ריב expressa contenda ou disputa. “Discutiu com” é natural em português e mantém o caráter hostil da interação, sem reduzi-la a uma simples reclamação.
- source_word: הָעָם
  choice: o povo
  rationale: עם designa aqui a comunidade israelita em sentido amplo; “o povo” é a forma mais clara e natural.
- source_word: עִם מֹשֶׁה
  choice: com Moisés
  rationale: A preposição עִם significa normalmente “com”; junto de “discutiu”, a construção portuguesa transmite adequadamente o confronto.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: e disse
  rationale: A fórmula hebraica de introdução da fala não precisa ter seus dois elementos reproduzidos literalmente. Como o sujeito coletivo “o povo” está no singular em português, emprega-se “disse”.
- source_word: וְלוּ
  choice: Quem dera
  rationale: A partícula introduz um desejo lamentoso e contrafactual. “Quem dera” preserva essa força em português corrente e digno.
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: tivéssemos morrido quando ... morreram
  rationale: A repetição de גוע é preservada por “morrido/morreram”; a construção com בְּ é expressa naturalmente como circunstância temporal por “quando”.
- source_word: אַחֵינוּ
  choice: nossos irmãos
  rationale: O substantivo é masculino plural e se refere provavelmente a outros israelitas mortos anteriormente. “Irmãos” preserva a forma do texto sem impor uma especificação não declarada.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de/na presença de”, e “diante de” é conciso e idiomático. O nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama. “Yahweh” preserva o nome próprio e evita substituí-lo por um título.
- issue: Identidade de אַחֵינוּ
  choice: nossos irmãos
  alternative: nossos parentes; nossos irmãos e irmãs
  rationale: A forma hebraica é masculina plural. A tradução conserva essa forma e não decide além do texto se o grupo mencionado incluía também mulheres.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A repetição do verbo “morrer” reproduz deliberadamente a repetição da raiz hebraica גוע.
