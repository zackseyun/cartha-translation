source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: pt
  text: Por favor, permita-nos atravessar a sua terra. Não passaremos por nenhum campo nem por nenhuma vinha e não beberemos água de poço. Seguiremos pela estrada do rei[a]; não nos desviaremos nem para a direita nem para a esquerda até atravessarmos o seu território[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrada real”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “seu limite” ou “sua fronteira”; o termo também pode designar o território delimitado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא
  choice: Por favor, permita-nos atravessar
  rationale: O coortativo acompanhado de נָא expressa um pedido cortês. A formulação comunica tanto o pedido de permissão quanto o movimento de travessia.
- source_word: בְאַרְצֶךָ
  choice: a sua terra
  rationale: Com o verbo עבר, a preposição indica movimento através do território; “terra” traduz אֶרֶץ de modo direto e natural.
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: Não passaremos por nenhum campo nem por nenhuma vinha
  rationale: Os substantivos singulares têm sentido genérico. “Nenhum... nem nenhuma” deixa clara a promessa de não atravessar áreas cultivadas.
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: e não beberemos água de poço
  rationale: A expressão hebraica significa literalmente “água de poço”; esta forma é concisa e corrente em português.
- source_word: דֶּרֶךְ הַמֶּלֶךְ
  choice: a estrada do rei
  rationale: Tradução direta de “caminho/estrada do rei”, entendida no contexto como uma rota reconhecida. “Estrada real” é uma alternativa possível, registrada em nota.
- source_word: נֵלֵךְ
  choice: Seguiremos pela
  rationale: Aqui הלך descreve o deslocamento ao longo da rota indicada; “seguiremos pela” expressa isso com naturalidade.
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: não nos desviaremos nem para a direita nem para a esquerda
  rationale: A formulação preserva o par direcional hebraico e o sentido idiomático de não sair da rota.
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: até atravessarmos o seu território
  rationale: גְּבוּל pode designar limite, fronteira ou território delimitado. No contexto, a promessa é permanecer na rota até completar a passagem pelo território, por isso “território” evita sugerir apenas a entrada pela fronteira.
