  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés e a Arão, no monte Hor, na fronteira da terra de Edom, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”, o Tetragrama, nome divino.'
    reason: Esclarece a forma hebraica subjacente ao nome “Yahweh”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: falou
  rationale: אמר significa normalmente “dizer”, mas “falou a Moisés e a Arão” introduz a comunicação divina de modo natural em português e combina bem com o subsequente לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição introduz os destinatários da fala; a repetição hebraica não precisa ser reproduzida para que a relação sintática permaneça clara em português.
- source_word: בְּהֹר הָהָר
  choice: no monte Hor
  rationale: Forma convencional e clara do topônimo; a preposição בְּ é locativa neste contexto.
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: na fronteira da terra de Edom
  rationale: Expressa naturalmente a localização junto ao limite territorial de Edom, preservando a referência geográfica.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém explicitamente a fórmula hebraica que introduz o conteúdo da fala no versículo seguinte.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o Tetragrama como nome próprio. “Yahweh” preserva esse caráter sem substituí-lo por um título; a nota identifica a forma consonantal hebraica.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Conserva a fórmula introdutória “dizendo” e evita construções excessivamente arcaicas.
