  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: pt
  text: Então Moisés e Arão saíram da presença da assembleia[a][b] e foram até a entrada da Tenda do Encontro. Ali, prostraram-se com o rosto em terra, e a glória de Yahweh[c] apareceu a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “de diante da assembleia”, isto é, da presença do povo reunido.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “congregação”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a glória do SENHOR”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִפְּנֵי הַקָּהָל אֶל
  choice: saíram da presença da assembleia e foram até
  rationale: O hebraico descreve o movimento desde a presença do povo reunido até a entrada da tenda. A formulação portuguesa explicita naturalmente os dois pontos do deslocamento sem alterar o sentido.
- source_word: הַקָּהָל
  choice: a assembleia
  rationale: קהל designa a comunidade reunida. “Assembleia” conserva o sentido coletivo e é claro em português atual.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: a entrada da Tenda do Encontro
  rationale: פֶּתַח é o ponto de entrada, e אֹהֶל מוֹעֵד é a designação tradicionalmente entendida como a tenda em que ocorre o encontro divino. As iniciais maiúsculas indicam aqui um nome designativo.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: prostraram-se com o rosto em terra
  rationale: A expressão significa literalmente cair sobre o rosto e comunica uma postura física de submissão, súplica ou reverência. A redação escolhida é natural e digna em português.
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה indica aqui uma manifestação visível. “Apareceu” preserva essa ideia sem explicar além do texto.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כבוד refere-se à glória divina manifestada, enquanto יהוה é vertido pelo nome próprio “Yahweh”.
- source_word: אֲלֵיהֶם
  choice: a eles
  rationale: A preposição אֶל indica que a manifestação se deu a Moisés e Arão. “Apareceu a eles” reproduz diretamente essa relação.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o Tetragrama como nome próprio. “Yahweh” preserva o nome divino, em vez de substituí-lo por um título.
- issue: Natureza da “glória”
  choice: a glória de Yahweh apareceu
  alternative: Yahweh apareceu em glória
  rationale: A tradução mantém כְבוֹד יְהוָה como sujeito gramatical e não identifica explicitamente a glória com uma formulação teológica mais desenvolvida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Prostraram-se com o rosto em terra” comunica de modo natural a postura concreta do hebraico. “Tenda do Encontro” funciona como designação reconhecível do santuário sem recorrer a vocabulário excessivamente arcaico.
