  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: pt
  text: Então os israelitas[a], toda a comunidade, chegaram ao deserto de Zim no primeiro mês, e o povo ficou em Cades. Miriã morreu ali e ali foi sepultada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: A expressão hebraica significa literalmente “os filhos de Israel”, mas em português atual “os israelitas” comunica naturalmente o sentido nacional e coletivo sem sugerir que apenas homens estavam incluídos.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a coletividade reunida de Israel. “Toda a comunidade” é corrente, abrangente e preserva o valor de כָּל.
- source_word: מִדְבַּר צִן
  choice: deserto de Zim
  rationale: מִדְבָּר indica uma região erma ou desértica. “Deserto” é natural em português bíblico moderno; “Zim” segue a forma consagrada em português para o topônimo צִן.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro mês
  rationale: Tradução direta e natural da expressão temporal, sem acrescentar uma identificação do mês que o texto não fornece.
- source_word: וַיֵּשֶׁב
  choice: ficou
  rationale: Com הָעָם como sujeito coletivo, o verbo indica permanência ou residência no local. “Ficou” evita sugerir um assentamento definitivo.
- source_word: הָעָם
  choice: o povo
  rationale: Equivalente português padrão e natural para עָם neste contexto.
- source_word: בְּקָדֵשׁ
  choice: em Cades
  rationale: “Em” é a preposição idiomática em português para permanência numa localidade; “Cades” é a forma tradicional portuguesa do topônimo.
- source_word: מִרְיָם
  choice: Miriã
  rationale: Emprega-se a forma portuguesa estabelecida do nome hebraico.
- source_word: וַתָּמָת
  choice: morreu
  rationale: Reproduz de modo direto o sentido simples de מות, sem eufemismo.
- source_word: וַתִּקָּבֵר
  choice: foi sepultada
  rationale: Preserva a construção passiva hebraica e não introduz agentes que o texto não identifica.
- source_word: שָׁם ... שָׁם
  choice: ali ... ali
  rationale: Mantém a repetição deliberada do hebraico com uma forma natural em português.
theological_decisions: []
