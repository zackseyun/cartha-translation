  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: pt
  text: Então Moisés levantou a mão e bateu duas vezes na rocha com o seu cajado. Saiu muita água, e a comunidade bebeu, assim como os seus animais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: levantou
  rationale: O hifil de רום indica erguer ou levantar; “levantou” descreve a ação física de modo natural e direto.
- source_word: יָדוֹ
  choice: a mão
  rationale: Tradução direta do substantivo singular com sufixo de terceira pessoa masculina; o possuidor já está claro em “Moisés”.
- source_word: וַיַּךְ
  choice: bateu
  rationale: נכה significa golpear ou bater. “Bateu” é corrente, claro e mantém a força narrativa sem soar arcaico.
- source_word: הַסֶּלַע
  choice: na rocha
  rationale: סֶלַע designa rocha ou penhasco; “rocha” é a escolha contextual e tradicionalmente reconhecível.
- source_word: בְּמַטֵּהוּ
  choice: com o seu cajado
  rationale: מַטֶּה pode ser vara ou cajado. “Cajado” é natural no contexto de Moisés e identifica adequadamente o instrumento.
- source_word: פַּעֲמָיִם
  choice: duas vezes
  rationale: Expressa diretamente o valor adverbial do dual e soa mais natural em português do que uma forma artificialmente compacta.
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: Saiu muita água
  rationale: A construção hebraica indica grande quantidade de água. O singular verbal em português concorda naturalmente com “água”, preservando o sentido sem rigidez formal.
- source_word: וַתֵּשְׁתְּ
  choice: bebeu
  rationale: O verbo hebraico está no feminino singular, concordando com o substantivo coletivo עֵדָה; o singular coletivo também é natural em português.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: עֵדָה refere-se à comunidade reunida de Israel. “Comunidade” é contemporâneo, abrangente e compreensível, sem sugerir necessariamente uma instituição religiosa moderna.
- source_word: וּבְעִירָם
  choice: assim como os seus animais
  rationale: בְּעִירָם designa os animais domésticos pertencentes à comunidade. “Animais” é claro no contexto e evita restringir indevidamente o termo a gado bovino.
theological_decisions:
- issue: Formulação narrativa da ação de Moisés contra a rocha
  choice: Manter a descrição simples de que Moisés bateu duas vezes na rocha com o cajado.
  alternative: Acrescentar na própria tradução que o ato foi desobediente ou incrédulo.
  rationale: Embora o contexto posterior avalie negativamente a conduta de Moisés, este versículo narra a ação e seu resultado. A tradução não deve antecipar nem inserir uma interpretação que não está expressa nesta oração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluidez natural, sem perda de conteúdo. Não há necessidade de notas textuais ou lexicais neste versículo.
