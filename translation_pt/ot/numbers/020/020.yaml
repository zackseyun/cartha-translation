base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/020.yaml
  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: pt
  text: 'Mas ele disse: “Você não passará”. Então Edom saiu ao encontro dele[a] com um grande contingente[b] e com mão forte[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para confrontá-lo”. A expressão hebraica em si é neutra, mas o contexto é claramente hostil.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com um povo pesado”, expressão que indica um grupo grande ou imponente de homens.
    reason: lexical_alternative
  - marker: c
    text: Ou “com grande poder”, isto é, empregando força considerável.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas ele disse
  rationale: O waw consecutivo dá continuidade à narrativa; “mas” explicita o contraste contextual entre o pedido de Israel e a recusa de Edom, sem identificar além do texto o sujeito implícito.
- source_word: לֹא תַעֲבֹר
  choice: Você não passará
  rationale: O imperfeito expressa aqui uma proibição ou recusa firme. A formulação preserva a força da declaração direta e o sentido de atravessar o território.
- source_word: וַיֵּצֵא אֱדוֹם
  choice: Então Edom saiu
  rationale: יצא significa sair. “Então” marca naturalmente a progressão narrativa e a reação de Edom, sem acrescentar ao verbo a ideia específica de marchar.
- source_word: לִקְרָאתוֹ
  choice: ao encontro dele
  rationale: A expressão hebraica tem o sentido básico de ir ao encontro. O contexto é hostil, mas a tradução principal preserva a neutralidade lexical e registra a leitura contextual em nota.
- source_word: בְּעַם כָּבֵד
  choice: com um grande contingente
  rationale: Literalmente, a expressão diz “com um povo pesado”; כבד comunica peso, grandeza ou imponência. “Grande contingente” transmite de modo natural a ideia de um numeroso corpo de homens, provavelmente armado, sem tornar explícito mais do que o contexto permite.
- source_word: וּבְיָד חֲזָקָה
  choice: e com mão forte
  rationale: A tradução conserva a imagem idiomática hebraica de mão como poder ou capacidade de ação, mantendo a concisão e a força do original.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” na fala direta. A redação preserva a imagem hebraica “mão forte” e mantém no texto principal a neutralidade lexical de “ao encontro”, enquanto as notas esclarecem o caráter hostil do contexto e os dois idiomatismos.
