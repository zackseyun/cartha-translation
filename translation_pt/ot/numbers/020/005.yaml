source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: pt
  text: E por que vocês nos fizeram sair do Egito para nos trazer a este lugar ruim?[a] Este não é lugar para semear[b], nem tem figueiras, videiras ou romãzeiras; e não há água para beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a este lugar miserável”. O termo hebraico descreve o lugar como nocivo ou indesejável, não necessariamente como moralmente mau.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “não é lugar de semente”; pode indicar um lugar impróprio para semear ou que não produz cereais e outras culturas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: E por que
  rationale: Mantém a conjunção que liga esta queixa à fala anterior e traduz naturalmente a pergunta.
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: vocês nos fizeram sair do Egito
  rationale: O hifil de עלה significa literalmente fazer subir; em português, 'fizeram sair do Egito' comunica com naturalidade o movimento do êxodo sem sugerir apenas orientação.
- source_word: לְהָבִיא אֹתָנוּ
  choice: para nos trazer
  rationale: Expressa diretamente a finalidade indicada pelo infinitivo de בוא.
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: a este lugar ruim
  rationale: רַע descreve aqui um lugar nocivo, desagradável ou indesejável, não necessariamente moralmente mau.
- source_word: לֹא מְקוֹם זֶרַע
  choice: Este não é lugar para semear
  rationale: A expressão literal 'não [é] lugar de semente' provavelmente indica terra imprópria para cultivo; esta formulação preserva o sentido agrícola e soa natural em português.
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: nem tem figueiras, videiras ou romãzeiras
  rationale: No contexto, os substantivos singulares representam as plantas ou culturas ausentes. Nomeá-las como árvores e videiras torna a enumeração clara e idiomática.
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: e não há água para beber
  rationale: Reproduz de modo direto e idiomático a construção existencial negativa com o infinitivo.
theological_decisions: []
