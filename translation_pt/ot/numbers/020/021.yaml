  text: וַ/יְמָאֵ֣ן אֱד֗וֹם נְתֹן֙ אֶת יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּ/גְבֻל֑/וֹ וַ/יֵּ֥ט יִשְׂרָאֵ֖ל מֵ/עָלָֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: pt
  text: Mas Edom se recusou a deixar Israel passar pelo seu território; por isso, Israel se desviou dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: se recusou
  rationale: מָאֵן expressa recusa ou falta de disposição; «se recusou» é natural e mantém a força do verbo na narrativa.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Mantém-se a forma tradicional do nome nacional em português.
- source_word: נְתֹן
  choice: a deixar
  rationale: Em combinação com מָאֵן, נתן tem sentido idiomático de conceder permissão; «deixar» comunica isso com naturalidade.
- source_word: עֲבֹר
  choice: passar
  rationale: No contexto territorial, עָבַר descreve o trânsito pela terra de Edom; com «pelo seu território», «passar» é claro e idiomático.
- source_word: בִּגְבֻלוֹ
  choice: pelo seu território
  rationale: גְּבוּל pode indicar fronteira, limite ou território; aqui o contexto da passagem pela terra favorece «território».
- source_word: וַיֵּט
  choice: se desviou
  rationale: נָטָה pode significar virar ou desviar-se; «se desviou» preserva a ideia de mudança de rota sem sugerir necessariamente retirada militar.
- source_word: מֵעָלָיו
  choice: dele
  rationale: A expressão indica afastamento de Edom; «se desviou dele» reproduz de modo conciso a relação espacial.
