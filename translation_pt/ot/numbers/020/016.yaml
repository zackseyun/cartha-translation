  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: pt
  text: Clamamos a Yahweh, e ele ouviu a nossa voz, enviou um anjo[a] e nos tirou do Egito. E aqui estamos em Cades, uma cidade no limite do seu território.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um mensageiro”. A palavra hebraica pode designar tanto um mensageiro humano quanto um mensageiro celestial, embora, neste contexto, muitos a entendam como referência a um anjo enviado por Deus.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: Clamamos
  rationale: O verbo צעק expressa um clamor urgente por socorro. “Clamamos” transmite essa intensidade de modo natural e digno em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: ele ouviu a nossa voz
  rationale: Mantém a formulação explícita e a imagem do hebraico, que aqui comunica que Deus atendeu ao clamor do povo.
- source_word: מַלְאָךְ
  choice: um anjo
  rationale: No contexto do êxodo, “anjo” é uma leitura natural para o enviado de Deus; como o termo hebraico também pode significar simplesmente “mensageiro”, essa amplitude é preservada em nota.
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: nos tirou do Egito
  rationale: Expressa com clareza e naturalidade o causativo de יצא, “fazer sair” ou “tirar”.
- source_word: וְהִנֵּה
  choice: E veja
  rationale: Reproduz a função de הִנֵּה de chamar a atenção para a situação presente, sem recorrer ao arcaico “eis”.
- source_word: בְקָדֵשׁ
  choice: em Cades
  rationale: Representa diretamente a localização indicada pela preposição בְּ.
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: cidade na extremidade do seu território
  rationale: Comunica a localização de Cades no limite das terras do destinatário, evitando a formulação pouco natural “na extremidade da sua fronteira”.
theological_decisions:
- issue: Identidade de מַלְאָךְ na referência ao êxodo
  choice: Traduzir como “um anjo” sem identificar mais precisamente esse enviado.
  alternative: “um mensageiro” ou uma identificação específica com o anjo de Yahweh
  rationale: O versículo afirma apenas que Yahweh enviou מַלְאָךְ. A tradução adota o sentido celestial natural no contexto, mas a nota preserva a amplitude lexical e evita impor uma identificação teológica mais específica.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A coordenação simples acompanha o ritmo narrativo hebraico; “E veja” conserva a força discursiva de הִנֵּה.
