  to: Clamamos a Yahweh, e ele ouviu a nossa voz, enviou um anjo[a] e nos tirou do Egito. E aqui estamos em Cades, uma cidade no limite do seu território.
  rationale: A revisão substitui uma interpelação pouco natural por uma construção apresentativa corrente em português e torna mais explícita a relação de Cades com o limite territorial de Edom. Mantêm-se a escolha lexical “anjo” e sua alternativa em nota, sem determinar a identidade do enviado.
