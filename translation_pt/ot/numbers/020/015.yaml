  text: וַ/יֵּרְד֤וּ אֲבֹתֵ֨י/נוּ֙ מִצְרַ֔יְמָ/ה וַ/נֵּ֥שֶׁב בְּ/מִצְרַ֖יִם יָמִ֣ים רַבִּ֑ים וַ/יָּרֵ֥עוּ לָ֛/נוּ מִצְרַ֖יִם וְ/לַ/אֲבֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: pt
  text: Nossos pais desceram ao Egito[a], e moramos no Egito muitos dias[b]; os egípcios fizeram mal a nós e a nossos pais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos antepassados”; o hebraico diz literalmente “nossos pais”, aqui e no fim do versículo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “muitos dias”, expressão que pode significar um longo período.
    reason: lexical_alternative
  - marker: c
    text: Ou “maltrataram a nós e a nossos pais” ou “agiram com maldade contra nós e nossos pais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: Preserva o sentido geográfico e idiomático de ירד, movimento de descida para o Egito, em português natural.
- source_word: אֲבֹתֵינוּ
  choice: nossos pais
  rationale: Mantém a expressão literal e o registro bíblico; no contexto, refere-se aos antepassados, alternativa indicada em nota.
- source_word: מִצְרַיְמָה
  choice: ao Egito
  rationale: Expressa naturalmente o movimento em direção ao lugar indicado pelo ה direcional.
- source_word: וַנֵּשֶׁב
  choice: moramos
  rationale: ישב denota aqui residência ou permanência; 'moramos' é claro, atual e adequado ao resumo da permanência no Egito.
- source_word: יָמִים רַבִּים
  choice: muitos dias
  rationale: Conserva a forma hebraica, embora a expressão possa idiomaticamente significar um longo período; a nota esclarece isso sem especificar 'anos'.
- source_word: וַיָּרֵעוּ
  choice: fizeram mal
  rationale: O hifil de רעע comunica causar mal ou agir de modo prejudicial. 'Fizeram mal' preserva sua amplitude moral e semântica melhor do que uma formulação mais específica.
- source_word: מִצְרַיִם
  choice: os egípcios
  rationale: Embora a forma lexical seja 'Egito', o verbo plural mostra que o referente são os habitantes; em português, 'os egípcios' explicita naturalmente o sujeito pessoal.
- source_word: לָנוּ
  choice: a nós
  rationale: Preserva o complemento introduzido por ל com a locução portuguesa 'fazer mal a'.
- source_word: וְלַאֲבֹתֵינוּ
  choice: e a nossos pais
  rationale: Mantém a repetição do hebraico e sua moldura histórico-familiar.
