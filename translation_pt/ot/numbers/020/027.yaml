id: NUM.20.27
reference: Numbers 20:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: pt
  text: Moisés fez conforme Yahweh havia ordenado, e eles subiram ao monte Hor diante dos olhos de toda a comunidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é literalmente “diante dos olhos de toda a comunidade”, isto é, publicamente, à vista de todo o povo reunido.
    reason: Esclarecimento do sentido idiomático e da imagem hebraica.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה apresenta de modo direto a obediência de Moisés; “fez” preserva a simplicidade narrativa e liga-se naturalmente a “conforme”.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: A expressão relaciona a ação de Moisés diretamente com a ordem divina; “conforme” é clara, natural e fiel.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: צוה expressa uma ordem revestida de autoridade. O mais-que-perfeito composto deixa clara, em português corrente, a anterioridade da ordem em relação à ação narrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּעֲלוּ
  choice: eles subiram
  rationale: עלה indica movimento para cima; “subiram” é conciso e natural no contexto de uma montanha, preservando o sujeito plural implícito.
- source_word: אֶל הֹר הָהָר
  choice: ao monte Hor
  rationale: A construção hebraica designa o lugar conhecido em português como “monte Hor”; a preposição “a” expressa o destino do movimento.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Preserva a imagem concreta do hebraico e comunica que o acontecimento ocorreu publicamente, à vista do povo.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה refere-se aqui à comunidade israelita reunida. “Comunidade” é atual, clara e menos propensa a sugerir exclusivamente uma reunião religiosa local.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título nem adotar uma forma híbrida posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem hebraica “diante dos olhos” sem sacrificar a naturalidade; “comunidade” traduz o coletivo israelita sem impor conotação denominacional.
