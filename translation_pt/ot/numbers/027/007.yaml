  text: כֵּ֗ן בְּנ֣וֹת צְלָפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָ/הֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֣י אֲבִי/הֶ֑ם וְ/הַֽעֲבַרְתָּ֛ אֶת נַחֲלַ֥ת אֲבִי/הֶ֖ן לָ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: pt
  text: As filhas de Zelofeade têm razão[a]. Você certamente lhes[b] dará uma propriedade hereditária entre os irmãos do pai delas e transferirá para elas a herança do pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “As filhas de Zelofeade estão falando corretamente”. A tradução “têm razão” expressa a locução de modo natural em português.'
    reason: lexical_alternative
  - marker: b
    text: Em um ponto do texto hebraico, o pronome traduzido como “lhes” tem forma masculina plural, embora o contexto se refira claramente às filhas de Zelofeade; a tradução segue o referente feminino indicado pelo contexto.
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן...דֹּבְרֹת
  choice: têm razão
  rationale: A expressão afirma, em contexto judicial, que a reivindicação das filhas é correta. “Têm razão” é natural em português e preserva o sentido de veredito.
- source_word: נָתֹן תִּתֵּן
  choice: certamente lhes dará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a determinação. “Certamente” conserva a ênfase sem recorrer a uma formulação arcaica.
- source_word: אֲחֻזַּת נַחֲלָה
  choice: uma propriedade como herança
  rationale: A expressão reúne as ideias de posse territorial e herança. Esta formulação é clara e mantém ambos os componentes.
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: entre os irmãos do pai delas
  rationale: Expressa naturalmente a localização da propriedade no âmbito da parentela paterna, sem substituir “irmãos” por uma interpretação explicativa como “tios”.
- source_word: וְהַעֲבַרְתָּ
  choice: transferirá
  rationale: 'O hifil de עבר tem aqui sentido jurídico e administrativo: fazer a herança passar para as filhas.'
- source_word: נַחֲלַת אֲבִיהֶן
  choice: a herança do pai
  rationale: Refere-se à herança pertencente ao pai falecido; a formulação é direta e idiomática em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “você” para o singular dirigido a Moisés e evita linguagem jurídica excessivamente técnica. O marcador [b] foi colocado ao fim do versículo porque sua nota comenta uma particularidade pronominal interna cuja reprodução literal não seria natural em português.
