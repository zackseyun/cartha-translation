base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: pt
  text: 'Então as filhas de Zelofeade — filho de Héfer, filho de Gileade, filho de Maquir, filho de Manassés —, pertencentes aos clãs de Manassés, filho de José, aproximaram-se.[a] E estes eram os nomes de suas filhas: Macla, Noa,[b] Hogla, Milca e Tirza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “chegaram-se” ou “apresentaram-se”. A expressão pode indicar que elas se apresentaram para fazer um pedido formal, como narram os versículos seguintes.
    reason: lexical_alternative
  - marker: b
    text: Noa é aqui o nome de uma das filhas de Zelofeade, não Noé, o homem mencionado em Gênesis.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: aproximaram-se
  rationale: O qal wayyiqtol na terceira pessoa do plural feminino de קרב indica que elas se achegaram ou se apresentaram. “Aproximaram-se” é natural em português e preserva a possível conotação de comparecimento formal sem explicitar um objeto ausente no versículo.
- source_word: בְּנוֹת
  choice: as filhas de
  rationale: O construto com o nome do pai refere-se aqui a filhas literais, como confirma a fórmula que em seguida apresenta os nomes delas.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: filho de ... filho de ... filho de ... filho de
  rationale: A cadeia genealógica foi mantida sem ser condensada em “descendente de”, pois fundamenta a identidade tribal relevante para a reivindicação de herança.
- source_word: לְמִשְׁפְּחֹת
  choice: pertencentes aos clãs de
  rationale: מִשְׁפָּחָה designa o clã no contexto tribal; o לְ marca aqui filiação ou pertencimento. A formulação portuguesa torna explícita essa relação sem alterar o sentido.
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: Manassés, filho de José
  rationale: Preserva a genealogia completa e a ligação da tribo de Manassés à linhagem de José.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Os nomes delas eram
  rationale: Expressa de modo natural a fórmula hebraica de apresentação dos nomes. “Delas” retoma as filhas já mencionadas; o pretérito se ajusta à sequência narrativa.
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: Macla, Noa, Hogla, Milca e Tirza
  rationale: Os nomes seguem formas tradicionalmente reconhecíveis e fonologicamente naturais em português. “Noa” distingue esta mulher do Noé de Gênesis e representa adequadamente o hebraico נֹעָה.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A longa genealogia foi pontuada com travessões para tornar clara a relação entre Zelofeade e sua linhagem, sem omitir nenhum elo. Usou-se “clãs”, termo mais preciso que “famílias” para a organização tribal israelita.
