  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: pt
  text: Depois de vê-la, você também será reunido ao seu povo[a], assim como Arão, seu irmão, foi reunido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “você morrerá” ou “será reunido aos seus antepassados”. A expressão idiomática hebraica diz literalmente “ser reunido ao seu povo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה אֹתָהּ
  choice: Depois de vê-la
  rationale: O Qal de ראה com a conjunção, após a ordem do versículo anterior, indica a sequência temporal. O pronome feminino retoma a terra; em português, a forma feminina natural é “-la”.
- source_word: וְנֶאֱסַפְתָּ
  choice: você também será reunido
  rationale: O nifal de אסף é mantido como passivo e preserva a metáfora hebraica ligada à morte, em vez de reduzi-la simplesmente a “morrer”.
- source_word: אֶל עַמֶּיךָ
  choice: ao seu povo
  rationale: Tradução direta do idioma hebraico, conservando sua ressonância familiar e comunitária sem interpretá-lo de modo mais específico como “antepassados”.
- source_word: גַּם אָתָּה
  choice: você também
  rationale: Mantém a ênfase de que Moisés terá o mesmo destino de Arão.
- source_word: כַּאֲשֶׁר נֶאֱסַף
  choice: assim como ... foi reunido
  rationale: Expressa claramente a comparação e repete a mesma formulação para o mesmo verbo, preservando a coesão literária.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Arão, seu irmão
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome; as vírgulas tornam natural a aposição em português.
theological_decisions:
- issue: Expressão de morte אסף אל־עמיו
  choice: ser reunido ao seu povo
  alternative: morrer; ser reunido aos seus antepassados
  rationale: A formulação conserva a metáfora familiar e comunitária do hebraico e não impõe ao texto uma doutrina mais detalhada sobre a vida após a morte. A nota esclarece o sentido idiomático sem substituí-lo no texto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla legibilidade brasileira. “Depois de vê-la” comunica com clareza a sequência do contexto; “ser reunido ao seu povo” preserva deliberadamente o idioma e a tensão teológica do hebraico.
