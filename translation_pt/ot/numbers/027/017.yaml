base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: pt
  text: que saia e entre à frente deles[a], e que os conduza para fora e os traga para dentro[b], para que a comunidade de Yahweh[c] não seja como ovelhas sem pastor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante deles”, nas duas ocorrências.
    reason: lexical_alternative
  - marker: b
    text: A sequência “sair... entrar... conduzir para fora... trazer para dentro” é uma forma hebraica de descrever uma liderança pública abrangente.
    reason: cultural_note
  - marker: c
    text: Ou “assembleia de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente, em português, as orações relativas que descrevem o líder pedido por Moisés no versículo anterior.
- source_word: יֵצֵא ... יָבֹא
  choice: saia e entre
  rationale: Preserva o par concreto de verbos hebraicos e seu valor prospectivo após o pedido por um novo líder; o subjuntivo é idiomático em português nessa construção.
- source_word: לִפְנֵיהֶם
  choice: à frente deles
  rationale: Expressa tanto a posição diante do povo quanto a nuance de liderança, com mais naturalidade no português atual do que a tradução estritamente literal 'diante deles'.
- source_word: יוֹצִיאֵם ... יְבִיאֵם
  choice: os conduza para fora e para dentro
  rationale: Mantém o sentido causativo dos verbos e comunica direção pessoal, sem reduzir a sequência concreta ao abstrato 'governar'.
- source_word: עֲדַת יְהוָה
  choice: a comunidade de Yahweh
  rationale: עֵדָה designa coletivamente o povo reunido; 'comunidade' é claro no português moderno e evita limitar o termo a uma reunião pontual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: como ovelhas sem pastor
  rationale: Reproduz de modo natural e conciso a comparação hebraica, preservando integralmente a imagem pastoral.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; a transliteração o preserva sem substituí-lo pelo título tradicional.
- issue: Sentido da sequência 'sair, entrar, fazer sair, fazer entrar'
  choice: Manter a linguagem concreta de movimento e liderança
  alternative: Parafrasear como 'governar' ou 'guiar em tudo'
  rationale: A sequência hebraica retrata uma liderança abrangente e prepara a metáfora explícita do pastor; a formulação concreta conserva essa força sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A coordenação compacta evita repetição pesada, mas preserva os quatro movimentos do hebraico e a imagem final do rebanho.
