source:
  edition: WLC
  text: וְ/אִם אֵ֣ין אַחִים֮ לְ/אָבִי/ו֒ וּ/נְתַתֶּ֣ם אֶת נַחֲלָת֗/וֹ לִ/שְׁאֵר֞/וֹ הַ/קָּרֹ֥ב אֵלָ֛י/ו מִ/מִּשְׁפַּחְתּ֖/וֹ וְ/יָרַ֣שׁ אֹתָ֑/הּ וְֽ/הָ֨יְתָ֜ה לִ/בְנֵ֤י יִשְׂרָאֵל֙ לְ/חֻקַּ֣ת מִשְׁפָּ֔ט כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: pt
  text: E, se o pai dele não tiver irmãos, vocês darão a herança dele ao parente consanguíneo mais próximo, dentre o clã dele[a], e ele a herdará[b]. Isso será para os filhos de Israel[c] um estatuto jurídico[d], conforme Yahweh ordenou a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ao seu parente consanguíneo, o mais próximo dele, dentre o clã dele”.'
    reason: Esclarece que o texto combina a ideia de consanguinidade com a de proximidade no grau de parentesco e que o clã é o do titular da herança.
  - marker: b
    text: 'Ou: “tomará posse dela”.'
    reason: O verbo hebraico ירשׁ pode significar tanto herdar quanto tomar posse.
  - marker: c
    text: “Filhos de Israel” é uma designação coletiva tradicional do povo de Israel.
    reason: Evita que a forma masculina da expressão hebraica seja entendida como referência exclusiva aos homens.
  - marker: d
    text: 'Ou: “uma norma legal”; literalmente, “um estatuto de juízo”.'
    reason: Registra a forma da expressão hebraica e uma alternativa idiomática em português.
lexical_decisions:
- source_word: אַחִים לְאָבִיו
  choice: o pai dele não tiver irmãos
  rationale: A construção indica os irmãos do pai do falecido na sequência legal de sucessão; esta formulação é natural e precisa em português.
- source_word: נַחֲלָתוֹ
  choice: a herança dele
  rationale: O substantivo designa aqui o patrimônio hereditário cuja transmissão está sendo regulamentada.
- source_word: לִשְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: ao parente de sangue mais próximo
  rationale: שְׁאֵר denota parentesco consanguíneo, e הַקָּרֹב אֵלָיו especifica o grau mais próximo; a tradução mantém ambos os elementos.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: do seu clã
  rationale: מִשְׁפָּחָה pode indicar o grupo de parentesco ampliado dentro da organização tribal de Israel; “clã” preserva essa dimensão social e jurídica.
- source_word: וְיָרַשׁ אֹתָהּ
  choice: e este a herdará
  rationale: O verbo ירשׁ, neste contexto sucessório, expressa diretamente o ato de herdar; “este” elimina uma possível ambiguidade referencial em português.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Mantém a expressão hebraica tradicional e seu caráter de designação coletiva e pactual do povo de Israel.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: um estatuto jurídico
  rationale: A expressão designa uma norma legal vinculante. “Estatuto jurídico” comunica o sentido de ambos os substantivos em português atual sem sugerir que se trate de uma decisão judicial isolada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Expressão coletiva masculina לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A forma escolhida preserva a expressão hebraica e sua função como designação coletiva do povo, sem restringi-la apenas aos homens.
- issue: Força jurídica de לְחֻקַּת מִשְׁפָּט
  choice: estatuto jurídico
  alternative: estatuto de juízo; norma legal
  rationale: A tradução mantém o caráter vinculante e judicial da disposição, evitando impor uma categoria jurídica moderna excessivamente específica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com registro jurídico moderado. A sintaxe segue de perto a sequência do hebraico, mas evita construções artificiais. “Este” esclarece que o parente mais próximo é quem herdará, e os marcadores de nota aparecem junto aos termos correspondentes.
