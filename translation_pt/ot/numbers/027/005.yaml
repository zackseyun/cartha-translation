  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: pt
  text: Então Moisés apresentou a causa delas diante de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levou a reivindicação legal delas à presença de Yahweh”.'
    reason: Alternativa lexical que explicita o caráter jurídico de מִשְׁפָּט e traduz de modo mais concreto a construção com קרב e לִפְנֵי.
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: apresentou
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. No contexto jurídico, “apresentou” expressa naturalmente o ato formal de levar a questão à decisão divina.
- source_word: מִשְׁפָּטָן
  choice: a causa delas
  rationale: מִשְׁפָּט pode designar julgamento, decisão, direito ou causa judicial. Aqui se refere à reivindicação sucessória das filhas de Zelofeade; “a causa delas” preserva o sentido jurídico sem antecipar a decisão.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A preposição significa “diante de” ou “na presença de” e, neste contexto, indica que a causa foi submetida a Yahweh para decisão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַ
  choice: Então
  rationale: O waw consecutivo dá continuidade à narrativa e aqui também comunica a consequência da petição relatada nos versículos anteriores.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino; “Yahweh” preserva sua função como nome próprio, em vez de substituí-lo pelo título tradicional.
translation_notes:
  register: Português moderno, claro e digno, com redação natural para leitores brasileiros e compreensão internacional. “Causa” mantém o tom jurídico sem recorrer a linguagem excessivamente técnica.
