base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: pt
  text: 'Elas se apresentaram diante de Moisés, diante do sacerdote Eleazar, diante dos líderes[a] e de toda a congregação[b], à entrada da tenda do encontro, e disseram:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes” ou “príncipes”.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a assembleia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: Elas se apresentaram
  rationale: O verbo עמד descreve literalmente o ato de tomar posição ou ficar de pé; neste contexto público e jurídico, “se apresentaram” comunica naturalmente que as filhas compareceram formalmente perante as autoridades, sem acrescentar ação não expressa.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Equivalente direto e corrente que preserva a ideia de comparecimento na presença das autoridades e da comunidade.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: o sacerdote Eleazar
  rationale: Mantém o nome por transliteração convencional e traduz apenas o título expresso no hebraico, sem ampliá-lo para “sumo sacerdote”.
- source_word: הַנְּשִׂיאִם
  choice: os líderes
  rationale: נְשִׂיאִים designa dirigentes reconhecidos da comunidade ou das tribos. “Líderes” é claro e atual, sem a conotação monárquica que “príncipes” pode sugerir.
- source_word: כָל הָעֵדָה
  choice: toda a congregação
  rationale: עֵדָה indica aqui a comunidade reunida de Israel. “Congregação” preserva a dimensão comunitária e pública, enquanto כָל é representado por “toda”.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Tradução clara da indicação de lugar e da expressão cultual אֹהֶל מוֹעֵד, sem explicar além do que o texto afirma.
- source_word: לֵאמֹר
  choice: 'e disseram:'
  rationale: A fórmula hebraica introduz a fala direta do versículo seguinte. Em português atual, a forma finita com dois-pontos cumpre essa função de modo natural e fiel.
theological_decisions:
- issue: Caráter público e jurídico do pedido das filhas
  choice: Manter a enumeração completa de Moisés, Eleazar, os líderes e toda a congregação
  alternative: Resumir os presentes como autoridades ou assembleia
  rationale: A enumeração dá peso público, comunitário e jurídico à apresentação do caso; comprimi-la apagaria uma ênfase do texto.
- issue: Sentido comunitário de עֵדָה
  choice: congregação
  alternative: assembleia
  rationale: “Congregação” representa bem a comunidade reunida no contexto de Números, sem implicar uma estrutura eclesiástica posterior; “assembleia” continua sendo uma alternativa lexical possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição integral de “diante de” foi reduzida após a primeira ocorrência para obter fluidez natural, sem alterar o alcance da preposição sobre cada grupo. As notas foram posicionadas junto aos termos a que de fato se referem.
