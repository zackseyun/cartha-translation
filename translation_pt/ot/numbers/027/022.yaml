  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: pt
  text: 'Moisés fez como Yahweh lhe havia ordenado: tomou Josué e o colocou diante do sacerdote Eleazar e de toda a comunidade[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o fez ficar de pé diante»; o verbo hebraico também pode ser traduzido por «o apresentou».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo comum עשה introduz o cumprimento obediente da ordem anterior; «fez como» é natural e fiel em português.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: A conjunção comparativa liga diretamente a ação de Moisés à ordem divina.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa clara, de modo natural, a anterioridade da ordem em relação à ação de Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: tomou Josué
  rationale: Preserva o sentido básico de לקח e se ajusta ao contexto em que Moisés conduz Josué para a investidura.
- source_word: וַיַּעֲמִדֵהוּ
  choice: o colocou
  rationale: O hifil de עמד significa fazer ficar de pé ou pôr alguém em determinada posição; «colocou» conserva o aspecto concreto sem soar rígido.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa a colocação pública na presença de Eleazar e da comunidade.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Tradução direta do título que identifica a função de Eleazar.
- source_word: כָּל־הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a comunidade reunida de Israel; «toda a comunidade» é claro e corrente em português moderno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal em forma transliterada sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a sequência narrativa do hebraico, enquanto «comunidade» evita uma conotação exclusivamente eclesiástica.
