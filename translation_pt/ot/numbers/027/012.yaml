id: NUM.27.12
reference: Numbers 27:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Suba a este monte de Abarim[a] e veja a terra que dei aos filhos de Israel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao monte dos Abarim” ou “ao monte Abarim”. Em hebraico, literalmente, “monte dos Abarim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos israelitas” ou “ao povo de Israel”. Em hebraico, “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa a sequência de modo natural em português.
- source_word: עֲלֵה
  choice: Suba
  rationale: Imperativo de עלה; comunica diretamente o movimento ascendente com registro natural e digno.
- source_word: הַר הָעֲבָרִים
  choice: monte de Abarim
  rationale: Preserva Abarim como designação geográfica e traduz הַר pelo termo português natural “monte”.
- source_word: הַזֶּה
  choice: este
  rationale: Conserva a referência demonstrativa a um monte específico no contexto imediato.
- source_word: וּרְאֵה
  choice: e veja
  rationale: Reproduz o segundo imperativo coordenado de maneira direta e idiomática.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da promessa no Pentateuco, “a terra” é a equivalência corrente e apropriada.
- source_word: נָתַתִּי
  choice: dei
  rationale: O perfeito hebraico apresenta a dádiva divina como estabelecida; o pretérito perfeito português exprime isso naturalmente, sem acrescentar uma nuance temporal estranha.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém de forma transparente a expressão hebraica tradicional, enquanto uma nota registra equivalentes coletivos idiomáticos.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e evita substituí-lo silenciosamente por um título.
- issue: Valor do perfeito נָתַתִּי na concessão da terra
  choice: dei
  alternative: tenho dado; dou
  rationale: “Dei” conserva a forma perfectiva e a certeza da concessão divina sem decidir além do necessário se a ênfase é estritamente passada ou de relevância presente.
- issue: Forma de לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A redação principal preserva a forma masculina e genealógica do hebraico; a nota reconhece que a expressão funciona também como designação coletiva do povo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem dos marcadores segue sua ocorrência no texto. “Monte de Abarim” é natural em português, enquanto a nota conserva a estrutura literal e suas alternativas. O discurso direto usa “Suba” e “veja”, formas correntes e respeitosas.
