base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/015.yaml
  text: Then Moses spoke to Yahweh[a], saying,
translation:
  language: pt
  text: 'Então Moisés falou a Yahweh[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Leitura alternativa tradicional do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol de דבר dá continuidade à narrativa. “Então” expressa naturalmente a sequência, e “falou” representa o verbo sem confundi-lo com o לֵאמֹר que introduz a fala seguinte.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; em português, “falou a Yahweh” mantém essa direção com clareza e dignidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz a fala direta que vem no versículo seguinte. Em português atual, os dois-pontos cumprem essa função de modo natural, sem a redundância de “falou... dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio e a distinção entre nome e título; a nota registra a forma hebraica e a tradição de vertê-la por “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção foi ajustada à pontuação natural do português, pois o conteúdo da fala começa no versículo seguinte.
