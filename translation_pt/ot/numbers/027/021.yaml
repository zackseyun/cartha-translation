revisions:
- from: 'Ele ficará diante de Eleazar, o sacerdote, que consultará por ele diante de Yahweh, mediante a decisão dos Urim[a]. À sua ordem, eles sairão e, à sua ordem, entrarão: ele e todos os filhos de Israel que estiverem com ele[b], toda a comunidade.'
  to: 'Ele se apresentará diante de Eleazar, o sacerdote, e este consultará por ele, diante de Yahweh, segundo o juízo dos Urim[a]. À sua ordem, sairão e, à sua ordem, entrarão: ele, todos os filhos de Israel com ele e toda a comunidade.'
  rationale: A revisão melhora a correspondência de יַעֲמֹד e restaura a coordenação sintática da cláusula final. Mantém-se «à sua ordem» para não resolver o referente singular mais do que o hebraico permite. A nota b foi preservada por consistência com a decisão lexical registrada, embora não seja necessária uma âncora adicional no texto, pois a expressão permanece no corpo do versículo.
