source:
  edition: WLC
  text: וְ/לִ/פְנֵ֨י אֶלְעָזָ֤ר הַ/כֹּהֵן֙ יַעֲמֹ֔ד וְ/שָׁ֥אַל ל֛/וֹ בְּ/מִשְׁפַּ֥ט הָ/אוּרִ֖ים לִ/פְנֵ֣י יְהוָ֑ה עַל פִּ֨י/ו יֵצְא֜וּ וְ/עַל פִּ֣י/ו יָבֹ֗אוּ ה֛וּא וְ/כָל בְּנֵי יִשְׂרָאֵ֥ל אִתּ֖/וֹ וְ/כָל הָ/עֵדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: pt
  text: 'Ele se apresentará diante de Eleazar, o sacerdote, e este consultará por ele, diante de Yahweh, segundo o juízo dos Urim[a]. À sua ordem, sairão e, à sua ordem, entrarão: ele, todos os filhos de Israel com ele e toda a comunidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a decisão dos Urim”. A expressão se refere à consulta sacerdotal feita diante de Yahweh por meio dos Urim.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa naturalmente tanto a posição quanto a relação oficial de Josué perante Eleazar.
- source_word: יַעֲמֹד
  choice: ficará
  rationale: O imperfeito tem força diretiva no contexto da comissão; “ficará diante de” é atual e dignificado em português.
- source_word: וְשָׁאַל לוֹ
  choice: que consultará por ele
  rationale: O contexto indica que Eleazar fará a consulta em favor de Josué. A oração relativa esclarece a mudança de sujeito sem alterar o sentido.
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: mediante a decisão dos Urim
  rationale: מִשְׁפָּט designa aqui a decisão ou o procedimento decisório sacerdotal. “Urim” é mantido como termo técnico transliterado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל פִּיו
  choice: à sua ordem
  rationale: Traduz idiomaticamente “segundo a sua boca” como direção autorizada e mantém o pronome singular sem definir além do hebraico o seu referente imediato.
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: sairão ... entrarão
  rationale: Conserva o par idiomático hebraico que descreve a movimentação pública ou militar da comunidade.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma explícita do hebraico; a nota oferece o equivalente coletivo corrente.
- source_word: הָעֵדָה
  choice: comunidade
  rationale: No Pentateuco, o termo designa o corpo coletivo de Israel. “Comunidade” é natural e abrangente em português contemporâneo.
theological_decisions:
- issue: Referente do pronome em “à sua ordem”
  choice: Manter o pronome possessivo singular sem explicitar o referente.
  alternative: Identificá-lo diretamente com Eleazar, com Josué ou com a decisão divina comunicada por meio da consulta.
  rationale: A construção hebraica é compacta e permite entender a ordem dentro da cadeia de autoridade que envolve Yahweh, a consulta sacerdotal e o líder. A tradução preserva essa ambiguidade em vez de resolvê-la no texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno sem arcaísmo; mantém “Yahweh” e “Urim” como nomes técnicos e conserva o paralelismo “sairão... entrarão”.
