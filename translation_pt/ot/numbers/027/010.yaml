base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/010.yaml
  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: pt
  text: Mas, se ele não tiver irmãos, vocês darão a herança dele aos irmãos de seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “aos tios paternos dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A combinação da conjunção com a partícula condicional introduz o caso seguinte da sequência jurídica; “Mas, se” expressa com naturalidade tanto a progressão contrastiva quanto a condição.
- source_word: אֵין לוֹ
  choice: ele não tiver
  rationale: A negação existencial hebraica com ל e sufixo pronominal exprime posse; em português, a construção idiomática é “não tiver”.
- source_word: אַחִים
  choice: irmãos
  rationale: O plural masculino hebraico significa literalmente “irmãos” e, neste contexto sucessório, refere-se aos irmãos homens do falecido.
- source_word: וּנְתַתֶּם
  choice: vocês darão
  rationale: A forma verbal dá continuidade à instrução legal na segunda pessoa do plural. O futuro com valor prescritivo conserva o tom jurídico sem tornar explícito um “então” ausente como palavra independente.
- source_word: נַחֲלָתוֹ
  choice: a herança dele
  rationale: נַחֲלָה designa aqui o patrimônio hereditário. “A herança dele” é claro e mantém a referência masculina do sufixo.
- source_word: לַאֲחֵי אָבִיו
  choice: aos irmãos de seu pai
  rationale: A tradução preserva de perto a estrutura da expressão hebraica, “aos irmãos de seu pai”, sem substituí-la no texto principal pelo termo mais interpretativo “tios paternos”.
