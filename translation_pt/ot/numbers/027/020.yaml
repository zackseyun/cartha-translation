reference: Numbers 27:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ה מֵ/הֽוֹדְ/ךָ֖ עָלָ֑י/ו לְמַ֣עַן יִשְׁמְע֔וּ כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: pt
  text: E você lhe dará parte da sua dignidade[a], para que toda a comunidade dos filhos de Israel lhe obedeça[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parte do seu esplendor”, “da sua majestade” ou “da sua honra”. O termo hebraico também pode abranger a dignidade e a autoridade ligadas ao cargo.
    reason: lexical_alternative
  - marker: b
    text: Ou “o escute” ou “lhe dê ouvidos”. O verbo hebraico pode indicar ouvir de modo responsivo, com o sentido de obedecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: E você lhe dará
  rationale: Traduz diretamente נתן como “dar” e, com o objeto indireto, expressa com naturalidade a concessão feita a Josué.
- source_word: מֵהוֹדְךָ
  choice: parte da sua dignidade
  rationale: הוֹד pode indicar esplendor, majestade, honra ou dignidade. “Dignidade” preserva o valor próprio do termo sem reduzi-lo apenas à autoridade funcional; מִן indica que se concede uma parte.
- source_word: עָלָיו
  choice: lhe
  rationale: O pronome dativo produz português natural para a ideia de conferir algo a Josué, embora a forma hebraica seja literalmente “sobre ele”.
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz de modo claro e idiomático a finalidade da concessão.
- source_word: יִשְׁמְעוּ
  choice: lhe obedeça
  rationale: שׁמע pode significar ouvir, escutar ou obedecer. No contexto da investidura pública de Josué, indica escuta responsiva, isto é, obediência.
- source_word: כָּל עֲדַת
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel; “comunidade” é atual, claro e não sugere necessariamente uma instituição religiosa moderna.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém visível a expressão familiar masculina do hebraico e a designação tradicional do povo.
theological_decisions:
- issue: Natureza da qualidade concedida por Moisés a Josué
  choice: parte da sua dignidade
  alternative: parte da sua autoridade; parte do seu esplendor; parte da sua honra
  rationale: O contexto de investidura envolve autoridade oficial, mas הוֹד não é o termo comum e inequívoco para “autoridade”. “Dignidade” conserva a amplitude lexical e permite que o contexto comunique a dimensão de ofício.
- issue: Sentido de שׁמע na oração de finalidade
  choice: obedecer
  alternative: escutar; ouvir; dar ouvidos
  rationale: No contexto de liderança, o verbo aponta para acolher e seguir a orientação de Josué, não apenas perceber suas palavras. A nota registra a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva “filhos de Israel” e evita transformar הוֹד simplesmente em “autoridade”, registrando em nota sua amplitude semântica.
