source:
  edition: WLC
  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: pt
  text: Por que o nome de nosso pai seria retirado do meio de seu clã só porque ele não teve filho? Deem-nos uma propriedade entre os irmãos de nosso pai.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fosse diminuído” ou “fosse removido”. O hebraico pergunta por que o “nome” do pai deveria desaparecer de seu clã por ele não ter filho.
    reason: lexical_alternative
  - marker: b
    text: “Propriedade” refere-se a uma posse de terra, isto é, uma parcela de herança dentro do clã.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: Por que ... seria
  rationale: Introduz uma pergunta retórica de protesto; o futuro do hebraico é expresso naturalmente pelo condicional em português.
- source_word: יִגָּרַע
  choice: seria retirado
  rationale: O nifal de גרע comunica perda ou remoção; esta formulação preserva o efeito de o nome desaparecer do clã sem tornar a expressão excessivamente abstrata.
- source_word: שֵׁם
  choice: nome
  rationale: Mantém literalmente a imagem hebraica da continuidade do pai e de sua linhagem dentro do clã.
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: do meio de seu clã
  rationale: מִשְׁפָּחָה designa aqui um agrupamento de parentesco no contexto tribal, mais específico que a família nuclear moderna.
- source_word: כִּי אֵין לוֹ בֵּן
  choice: só porque ele não teve filho
  rationale: O passado é natural no contexto narrativo, e 'filho' conserva o termo masculino relevante à questão legal; 'só porque' transmite a força do protesto.
- source_word: תְּנָה לָּנוּ
  choice: Deem-nos
  rationale: Imperativo plural dirigido às autoridades presentes; é direto, natural e compatível com o tom de petição.
- source_word: אֲחֻזָּה
  choice: uma propriedade
  rationale: Refere-se a uma posse fundiária ou parcela hereditária; 'propriedade' é clara em português, enquanto a nota conserva a especificidade cultural.
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: entre os irmãos de nosso pai
  rationale: Preserva a referência específica aos irmãos paternos e à linha agnática, sem generalizá-la como 'parentes'.
theological_decisions:
- issue: Linguagem de herança específica quanto ao sexo
  choice: filho / irmãos
  alternative: descendente / parentes
  rationale: O hebraico emprega termos masculinos porque a questão jurídica envolve a falta de um filho e a concessão de terra dentro da linha dos irmãos do pai; neutralizá-los apagaria um elemento relevante do caso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta mantém o tom firme de protesto, e o pedido permanece direto. Os marcadores [a] e [b] aparecem no texto principal.
