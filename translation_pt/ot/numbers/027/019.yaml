base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: pt
  text: Você o apresentará diante do sacerdote Eleazar e de toda a comunidade e o encarregará à vista deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe dará ordens”. O verbo hebraico geralmente significa “ordenar”; neste contexto, pode referir-se ao encargo público confiado a Josué.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: você o apresentará
  rationale: 'O hifil de עמד é causativo: fazer alguém ficar de pé ou colocá-lo diante de outros. “Apresentará” expressa com naturalidade o ato formal e público neste contexto.'
- source_word: לִפְנֵי
  choice: diante de
  rationale: A preposição indica presença espacial e formal perante Eleazar e a comunidade.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Transliteração portuguesa convencional do nome próprio.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Preserva o título definido que identifica a função de Eleazar.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a coletividade reunida de Israel. “Comunidade” é corrente e compreensível em português moderno.
- source_word: וְצִוִּיתָה אֹתוֹ
  choice: então lhe dará suas ordens
  rationale: צוה significa normalmente ordenar ou dar instruções. A formulação preserva essa força lexical, enquanto o contexto permite entender as palavras como o encargo público dado a Josué.
- source_word: לְעֵינֵיהֶם
  choice: à vista de todos
  rationale: O idioma hebraico, literalmente “aos olhos deles”, indica que o ato ocorre publicamente e é testemunhado pelos presentes.
theological_decisions:
- issue: Natureza do ato público pelo qual Josué recebe autoridade
  choice: lhe dará suas ordens
  alternative: o encarregará; lhe confiará sua missão
  rationale: A tradução mantém o sentido comum de צוה sem negar que, no contexto da instalação pública de Josué, essas ordens constituem também um encargo solene. A nota registra essa dimensão sem transformar uma inferência contextual no único sentido possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. “Comunidade” evita um tom excessivamente eclesiástico, e “à vista de todos” comunica de modo natural o caráter público da cerimônia.
