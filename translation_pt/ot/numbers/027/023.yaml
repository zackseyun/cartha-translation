  text: וַ/יִּסְמֹ֧ךְ אֶת יָדָ֛י/ו עָלָ֖י/ו וַ/יְצַוֵּ֑/הוּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/023.yaml
  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: pt
  text: Então Moisés pôs as mãos sobre ele e lhe deu ordens[a], conforme Yahweh havia falado por meio de Moisés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o incumbiu” ou “o comissionou”. O verbo hebraico normalmente significa dar uma ordem; neste contexto, as ordens fazem parte da nomeação formal de Josué.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “pela mão de Moisés”, expressão hebraica que significa que Yahweh falou por intermédio de Moisés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְמֹךְ אֶת־יָדָיו עָלָיו
  choice: pôs as mãos sobre ele
  rationale: Reproduz com naturalidade o gesto expresso por סמך com o plural explícito יָדָיו, sem acrescentar uma interpretação ritual além do texto.
- source_word: וַיְצַוֵּהוּ
  choice: lhe deu ordens
  rationale: Mantém o sentido lexical básico de צוה, ao mesmo tempo que o contexto imediato deixa claro que essas ordens fazem parte da investidura pública de Josué.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa de modo natural a correspondência entre a ação de Moisés e a palavra anterior de Yahweh.
- source_word: דִּבֶּר
  choice: havia falado
  rationale: O mais-que-perfeito composto esclarece em português que a fala divina precedeu a ação narrada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Comunica claramente a expressão hebraica de agência mediada; a forma literal é preservada em nota.
theological_decisions:
- issue: Sentido de צוה na investidura de Josué
  choice: lhe deu ordens
  alternative: o comissionou
  rationale: A tradução conserva o sentido verbal direto de dar uma ordem, sem apagar o contexto de nomeação pública. A nota registra que, nesta cena, o ato também funciona como incumbência formal.
- issue: Agência de Moisés em בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  alternative: pela mão de Moisés
  rationale: A formulação comunica que Moisés é o agente humano por meio de quem Yahweh falou, sem sugerir autoria independente; a nota conserva o hebraísmo literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. O nome “Moisés” foi explicitado no início para evitar um pronome sem antecedente dentro do versículo isolado; no hebraico, o sujeito é recuperado do contexto anterior. A repetição final de “Moisés” acompanha o texto-fonte e destaca sua função de mediador.
