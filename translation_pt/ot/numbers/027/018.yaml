  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: pt
  text: 'Javé disse a Moisés: “Tome Josué, filho de Num, um homem em quem há espírito[a], e coloque a mão sobre ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em quem está o Espírito” ou “que tem espírito”. O hebraico não traz artigo.
    reason: Preservar a ambiguidade lexical e teológica de רוּחַ.
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome divino, em vez de substituí-lo por um título.
- source_word: קַח לְךָ
  choice: Tome
  rationale: O imperativo com לְךָ funciona aqui como uma expressão idiomática; “tome” comunica naturalmente a ordem sem acrescentar uma ênfase reflexiva desnecessária.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Usa as formas portuguesas tradicionais dos nomes e traduz diretamente a relação filial.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o substantivo masculino singular do hebraico, adequado à referência específica a Josué.
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: em quem há espírito
  rationale: Reproduz a concisão e a ausência de artigo no hebraico, sem decidir no texto principal se רוּחַ designa explicitamente o Espírito divino, uma capacitação espiritual ou o espírito da pessoa.
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: e coloque a mão sobre ele
  rationale: Expressa de modo natural o gesto de pôr a mão sobre Josué e preserva o singular “mão” do texto hebraico.
theological_decisions:
- issue: Se רוּחַ se refere explicitamente ao Espírito de Deus ou a “espírito” sem especificação
  choice: espírito
  alternative: o Espírito
  rationale: O hebraico não traz artigo nem identifica expressamente o referente. A tradução mantém essa indeterminação no texto e registra em nota a interpretação de que se trata do Espírito divino.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “em quem há espírito” é deliberadamente próxima do hebraico para conservar sua ambiguidade; a nota apresenta alternativas naturais.
