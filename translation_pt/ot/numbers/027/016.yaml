  text: יִפְקֹ֣ד יְהוָ֔ה אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר אִ֖ישׁ עַל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/016.yaml
  text: May Yahweh[a], the God of the spirits of all flesh, appoint a man over the congregation[c][b],
translation:
  language: pt
  text: Que Yahweh[a], o Deus dos espíritos de toda carne[b], designe um homem para liderar a congregação[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que o SENHOR, o Deus dos espíritos de toda carne, designe um homem para liderar a congregação”.'
    reason: lexical_alternative
  - marker: b
    text: “Toda carne” é uma expressão hebraica que se refere à humanidade em sua condição mortal e criada.
    reason: cultural_note
  - marker: c
    text: 'Ou: “a assembleia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְקֹד
  choice: designe
  rationale: Neste contexto, פקד indica designar alguém para uma função de liderança. “Designe” expressa com naturalidade a nomeação, sem reduzir o verbo a mera supervisão ou contagem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי הָרוּחֹת
  choice: o Deus dos espíritos
  rationale: Mantém a formulação distintiva do hebraico e sua referência à vida interior dos seres humanos sob o conhecimento e a autoridade de Deus.
- source_word: לְכָל בָּשָׂר
  choice: de toda carne
  rationale: Conserva o idioma bíblico que apresenta a humanidade em sua condição criada e mortal; uma nota esclarece o sentido.
- source_word: אִישׁ
  choice: um homem
  rationale: O substantivo hebraico é masculino singular e, no contexto da sucessão de Moisés, indica um líder do sexo masculino.
- source_word: עַל הָעֵדָה
  choice: para liderar a congregação
  rationale: A expressão literal “sobre a congregação” descreve autoridade e liderança. Em português atual, “para liderar” comunica naturalmente essa relação, enquanto “congregação” preserva o caráter formal da comunidade reunida de Israel.
theological_decisions:
- issue: Forma da petição com o nome divino
  choice: Que Yahweh ... designe
  alternative: Que o SENHOR ... designe
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança, e a construção com “Que” comunica o valor volitivo da forma verbal.
- issue: Sentido de “espíritos de toda carne”
  choice: manter a expressão formal
  alternative: o Deus que dá espírito a toda a humanidade
  rationale: A formulação hebraica pode salientar a autoridade e o conhecimento de Deus sobre a vida interior de cada ser humano. A tradução não explicita além do que o texto afirma.
- issue: Gênero de אִישׁ
  choice: um homem
  alternative: alguém
  rationale: A tradução conserva o masculino explícito do hebraico e sua aplicação contextual ao sucessor de Moisés.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue a expressão a que cada nota se refere. A vírgula final foi mantida porque o versículo continua sintaticamente nos versículos seguintes.
