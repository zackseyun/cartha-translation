lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá prosseguimento à narrativa; “Então” expressa naturalmente a sequência em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: É a regência portuguesa natural de “dizer” ao indicar o destinatário.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala. Em português, os dois-pontos cumprem essa função com naturalidade, evitando a fórmula pouco idiomática “dizendo” antes da fala direta do versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva essa distinção e representa adequadamente o tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com fluxo narrativo natural. Os dois-pontos assinalam que a declaração de Yahweh vem no versículo seguinte.
