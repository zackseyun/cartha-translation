  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֣ישׁ כִּֽי יָמ֗וּת וּ/בֵן֙ אֵ֣ין ל֔/וֹ וְ/הַֽעֲבַרְתֶּ֥ם אֶת נַחֲלָת֖/וֹ לְ/בִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: pt
  text: 'E você falará aos filhos de Israel[a], dizendo: “Se um homem morrer e não tiver filho, vocês transferirão a herança dele para a filha dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” / “aos descendentes de Israel”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: E você falará aos filhos de Israel
  rationale: Preserva a forma familiar masculina literal de בְּנֵי יִשְׂרָאֵל, enquanto a nota registra as alternativas coletivas idiomáticas.
- source_word: תְּדַבֵּר לֵאמֹר
  choice: falará ... dizendo
  rationale: Mantém a fórmula hebraica de introdução do discurso sem perder naturalidade em português.
- source_word: אִישׁ כִּי יָמוּת
  choice: Se um homem morrer
  rationale: אִישׁ é masculino singular, e כִּי introduz aqui uma hipótese jurídica; a construção traduz ambos de modo claro.
- source_word: וּבֵן אֵין לוֹ
  choice: sem ter filho
  rationale: Expressa naturalmente a ausência de um filho homem, conservando o sentido jurídico da formulação hebraica.
- source_word: וְהַעֲבַרְתֶּם
  choice: vocês transferirão
  rationale: 'O hifil de עבר possui aqui sentido jurídico-administrativo: fazer a propriedade hereditária passar a outra pessoa.'
- source_word: נַחֲלָתוֹ
  choice: a herança dele
  rationale: נַחֲלָה designa neste contexto a herança ou posse hereditária; a forma com 'dele' é clara e atual.
- source_word: לְבִתּוֹ
  choice: para a filha dele
  rationale: A preposição לְ indica a destinatária da transferência; 'para' comunica diretamente essa relação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'você/vocês' para distinguir naturalmente o destinatário singular da ordem e a comunidade responsável por executá-la; preserva a formulação jurídica e o paralelismo familiar do hebraico.
