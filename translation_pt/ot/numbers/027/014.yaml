  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: pt
  text: porque vocês se rebelaram contra a minha ordem no deserto de Zim, por ocasião da contenda da comunidade, e não me reconheceram como santo[a] junto às águas, diante dos olhos deles. São estas as águas de Meribá de Cades[b], no deserto de Zim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «para me santificar junto às águas, diante dos olhos deles». O infinitivo hebraico tem forma positiva, mas o contexto indica que Moisés e Arão deixaram de fazer isso.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como «Meribate-Cades» ou, mais literalmente, «a contenda de Cades».
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: porque
  rationale: Neste contexto, a expressão introduz a razão da exclusão de Moisés e Arão; o valor causal é mais claro em português do que o literal «assim como».
- source_word: מְרִיתֶם
  choice: vocês se rebelaram
  rationale: O verbo מרה expressa rebeldia ou desafio contra uma autoridade; a formulação é direta e natural.
- source_word: פִּי
  choice: a minha ordem
  rationale: Embora signifique literalmente «minha boca», o termo funciona aqui como metonímia para a ordem proferida por Deus.
- source_word: בְּמִדְבַּר צִן
  choice: no deserto de Zim
  rationale: «Deserto» é uma tradução natural de מִדְבָּר neste contexto geográfico, e «Zim» segue a forma tradicional amplamente reconhecida em português.
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: durante a contenda da comunidade
  rationale: A expressão identifica a ocasião marcada pela disputa da coletividade; «comunidade» comunica de modo corrente o sentido de עֵדָה.
- source_word: לְהַקְדִּישֵׁנִי
  choice: e não demonstraram ... que eu sou santo
  rationale: O hifil de קדש indica reconhecer ou manifestar publicamente a santidade de Deus. A negação, embora implícita no contexto, é explicitada para tornar clara em português a natureza da rebeldia.
- source_word: בַמַּיִם
  choice: junto às águas
  rationale: A preposição situa o episódio nas águas associadas a Meribá; «junto às águas» é natural e não força a ideia de estar dentro da água.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Preserva a imagem hebraica e ressalta que a falha ocorreu publicamente perante a comunidade.
- source_word: הֵם
  choice: Essas são
  rationale: O pronome introduz a identificação das águas mencionadas imediatamente antes.
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: as águas de Meribá de Cades
  rationale: A forma apresenta o topônimo de maneira reconhecível em português e mantém sua associação com Cades.
theological_decisions:
- issue: A falha expressa por לְהַקְדִּישֵׁנִי
  choice: não demonstraram diante dos olhos deles que eu sou santo
  alternative: para me santificar diante dos olhos deles
  rationale: O infinitivo hebraico é positivo em sua forma, mas a oração explica em que consistiu a rebeldia de Moisés e Arão. A tradução explicita a negação exigida pelo contexto sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» porque o verbo hebraico se dirige conjuntamente a Moisés e Arão. Mantém a imagem pública de «diante dos olhos deles» e usa formas toponímicas correntes em português.
