  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: pt
  text: E, se ele não tiver filha, vocês darão a herança dele aos irmãos dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: E, se
  rationale: Introduz o caso condicional seguinte na sequência jurídica e preserva a força conectiva de וְ de modo natural em português.
- source_word: אֵין ל֖/וֹ
  choice: ele não tiver
  rationale: A construção existencial com לֹו expressa idiomaticamente posse negativa; no período condicional, «não tiver» é claro e natural.
- source_word: בַּת
  choice: filha
  rationale: Mantém o substantivo singular feminino do hebraico, pertinente à ordem sucessória estabelecida no contexto.
- source_word: וּ/נְתַתֶּם
  choice: vocês darão
  rationale: Conserva a segunda pessoa do plural e o valor prescritivo da instrução jurídica; o futuro do indicativo comunica adequadamente a determinação legal em português.
- source_word: נַחֲלָת֖/וֹ
  choice: a herança dele
  rationale: Neste contexto, נַחֲלָה designa a propriedade ou direito hereditário; «herança» é preciso e corrente. A forma «dele» evita possível ambiguidade de «sua».
- source_word: לְ/אֶחָי/ו
  choice: aos irmãos dele
  rationale: Reproduz o masculino plural explícito do hebraico e a etapa seguinte da sucessão. «Dele» identifica inequivocamente o vínculo com o falecido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação jurídica clara. Emprega «vocês» para tornar explícita a segunda pessoa do plural e «dele» para evitar a ambiguidade pronominal comum em português.
