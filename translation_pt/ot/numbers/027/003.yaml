  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: pt
  text: Nosso pai morreu no deserto e não estava entre a comunidade dos que se reuniram contra Yahweh no grupo de Corá; pelo contrário, morreu por seu próprio pecado[a] e não teve filhos homens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morreu em seu próprio pecado”. O hebraico não especifica qual foi o pecado, apenas distingue sua morte da participação na rebelião de Corá.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: Nosso pai
  rationale: É uma referência familiar direta feita pelas filhas; “pai” é o sentido claro no contexto.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português corrente, “deserto” expressa naturalmente o cenário de מִדְבָּר no período das peregrinações de Israel.
- source_word: בְּתוֹךְ הָעֵדָה
  choice: entre a comunidade
  rationale: Expressa de modo natural tanto a ideia de estar no meio de um grupo quanto o sentido coletivo de עֵדָה.
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: dos que se reuniram contra Yahweh
  rationale: O particípio nifal indica reunião coletiva, e עַל marca aqui oposição hostil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בַּעֲדַת קֹרַח
  choice: no grupo de Corá
  rationale: Identifica de maneira clara e sem repetição pesada a facção rebelde ligada a Corá.
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: pelo contrário, morreu por seu próprio pecado
  rationale: כִּי introduz a explicação contrastiva, e בְ pode ter sentido causal; “próprio” ressalta o contraste com a rebelião coletiva sem identificar o pecado.
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: e não teve filhos
  rationale: É a forma idiomática em português da construção existencial com לְ; “filhos” preserva a referência específica a descendentes homens no contexto da herança.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal divino; a transliteração o preserva sem trocá-lo por um título.
- issue: Relação entre a morte do pai e seu pecado
  choice: morreu por seu próprio pecado
  alternative: morreu em seu pecado
  rationale: A formulação preserva a distinção feita pelas filhas entre o pecado dele e a participação na rebelião de Corá, sem especificar qual foi esse pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial reproduz o fluxo hebraico; o ponto e vírgula torna claro o contraste explicativo. O marcador [a] aparece imediatamente após a expressão a que se refere.
