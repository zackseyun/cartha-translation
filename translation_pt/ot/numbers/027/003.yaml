  source_fidelity: A tradução reproduz corretamente a morte no deserto, a não participação na facção de Corá, a oposição a Yahweh e o contraste com o pecado do próprio pai. Contudo, בָּנִים significa especificamente “filhos homens/filhos”, e, no português moderno, “filhos” pode ser entendido de modo inclusivo; o contexto sucessório torna importante explicitar o sexo masculino.
  naturalness: O texto é claro, fluente e de registro apropriado. “Não teve filhos homens” é natural e evita uma ambiguidade contemporânea relevante.
  terminology: “Yahweh”, “comunidade”, “Corá” e “pecado” são escolhas adequadas. A nota preserva corretamente a alternativa “em seu próprio pecado” e a ausência de especificação do pecado.
