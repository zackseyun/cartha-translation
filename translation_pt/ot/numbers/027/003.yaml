    rationale: Embora “filhos” possa tradicionalmente significar “sons” em certos contextos, no português moderno também pode incluir filhas. Neste contexto, em que as filhas pleiteiam a herança precisamente pela ausência de descendentes masculinos, “filhos homens” preserva o referente do texto sem neutralizá-lo.
