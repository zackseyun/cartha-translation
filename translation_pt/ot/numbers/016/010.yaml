source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: pt
  text: Ele aproximou você de si, juntamente com todos os seus irmãos, os filhos de Levi; e vocês também buscam o sacerdócio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: trouxe para perto
  rationale: Preserva o sentido causativo de קרב no hifil — fazer aproximar, dar acesso — e mantém, no contexto, tanto a dimensão relacional quanto a de privilégio cultual.
- source_word: אֹתְךָ
  choice: você
  rationale: Objeto direto masculino singular, dirigido individualmente a Corá.
- source_word: וְאֶת כָּל אַחֶיךָ בְּנֵי לֵוִי
  choice: e ... todos os seus irmãos, os filhos de Levi
  rationale: Mantém a formulação hebraica e a aposição que identifica os irmãos como descendentes de Levi, sem reduzi-la simplesmente a 'levitas'.
- source_word: אִתָּךְ
  choice: com você
  rationale: Indica que os demais filhos de Levi foram aproximados juntamente com Corá.
- source_word: וּבִקַּשְׁתֶּם
  choice: E vocês ainda buscam
  rationale: O verbo está no plural e passa da referência individual a Corá para o grupo. No contexto, a conjunção tem força de censura; 'ainda' expressa naturalmente a pretensão adicional sem eliminar o valor coordenativo de ו.
- source_word: גַּם
  choice: também
  rationale: 'Marca adição: além do privilégio já recebido, o grupo procura o sacerdócio.'
- source_word: כְּהֻנָּה
  choice: o sacerdócio
  rationale: Designa a condição ou função sacerdotal e preserva a distinção institucional entre o serviço levítico e o sacerdócio aarônico.
theological_decisions:
- issue: Distinção cultual entre levitas e sacerdotes
  choice: o sacerdócio
  alternative: o ofício sacerdotal
  rationale: A tradução conserva a distinção central do contexto entre a proximidade e o serviço concedidos aos levitas e a condição sacerdotal que Corá e seu grupo também procuravam.
- issue: Força interrogativa da censura final
  choice: E vocês ainda buscam também o sacerdócio?
  alternative: e vocês buscam também o sacerdócio.
  rationale: Embora o hebraico não use partícula interrogativa, o contexto e a tradição de leitura sustentam uma pergunta retórica de censura. A formulação preserva a tensão sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A alternância entre 'você' e 'vocês' reproduz a mudança do objeto singular אֹתְךָ para o verbo plural וּבִקַּשְׁתֶּם. A ordem foi levemente ajustada para soar natural em português, sem perder a estrutura e a ênfase do hebraico.
