  text: וַ/יִּפְּל֤וּ עַל פְּנֵי/הֶם֙ וַ/יֹּ֣אמְר֔וּ אֵ֕ל אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר הָ/אִ֤ישׁ אֶחָד֙ יֶחֱטָ֔א וְ/עַ֥ל כָּל הָ/עֵדָ֖ה תִּקְצֹֽף־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: pt
  text: 'Então eles se prostraram com o rosto em terra e disseram: “Ó Deus, Deus dos espíritos de toda carne[a], será que um só homem pecará[b] e ficarás irado contra toda a comunidade?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus do sopro de toda carne”, destacando Deus como aquele que dá vida a todos os seres vivos.'
    reason: lexical_alternative
  - marker: b
    text: '“Um só homem” pode ter valor representativo: o apelo é que o pecado de um indivíduo não atraia ira sobre toda a comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: eles se prostraram com o rosto em terra
  rationale: Expressa de modo natural em português o gesto concreto de cair sobre o rosto em humildade, alarme ou intercessão.
- source_word: אֵל
  choice: Ó Deus
  rationale: O substantivo funciona como vocativo; “Ó” torna explícita e digna a invocação em português.
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: Deus dos espíritos de toda carne
  rationale: Preserva a estrutura hebraica e sua amplitude antropológica, sem eliminar a possível referência ao sopro vital.
- source_word: בָּשָׂר
  choice: carne
  rationale: Mantém a expressão bíblica concreta “toda carne”, compreensível no contexto e mais próxima do hebraico que “todas as pessoas”.
- source_word: הָאִישׁ אֶחָד
  choice: um só homem
  rationale: Conserva o masculino singular e a ênfase do numeral אֶחָד, ao mesmo tempo que permite seu possível valor representativo.
- source_word: יֶחֱטָא
  choice: pecará
  rationale: O futuro dentro da pergunta reproduz a forma verbal sem impor uma leitura condicional explícita; em português, a construção comunica perplexidade e apelo.
- source_word: וְעַל כָּל־הָעֵדָה
  choice: contra toda a comunidade
  rationale: Com קצף, עַל marca o alvo da ira. “Comunidade” é uma designação atual e clara para a coletividade de Israel.
- source_word: תִּקְצֹף
  choice: ficarás irado
  rationale: Transmite com dignidade a ira divina e conserva o paralelismo interrogativo, sem intensificar o verbo além do hebraico.
theological_decisions:
- issue: Sentido antropológico de “os espíritos de toda carne”
  choice: Título que destaca a relação de Deus com a vida interior de cada ser humano e sua capacidade de discernir a culpa individual.
  alternative: Título que destaca Deus como doador do sopro e da vida a todos os seres vivos.
  rationale: O contexto favorece “espíritos”, pois Moisés e Arão apelam ao discernimento divino entre a culpa individual e a comunidade inteira. A nota preserva a alternativa lexical genuína.
- issue: Valor de “um só homem”
  choice: Manter o masculino singular concreto, deixando que o contexto comunique seu possível alcance representativo.
  alternative: Traduzir de modo neutro como “uma só pessoa”.
  rationale: אִישׁ é masculino singular e, no episódio, aponta concretamente para um homem, embora a formulação também possa enunciar um princípio de responsabilidade individual.
- issue: Relação entre pecado individual e ira contra a comunidade
  choice: Preservar a pergunta como apelo, sem convertê-la numa afirmação doutrinária absoluta sobre culpa e punição coletivas.
  alternative: Explicitar que Deus jamais pune uma comunidade pelo pecado de um indivíduo.
  rationale: A forma interrogativa expressa intercessão e tensão teológica no contexto narrativo; transformá-la numa máxima resolveria além do que o texto diz.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Prostraram-se com o rosto em terra” preserva a imagem hebraica em forma idiomática; “comunidade” evita um termo eclesiástico excessivamente marcado. Os marcadores [a] e [b] aparecem no texto principal.
