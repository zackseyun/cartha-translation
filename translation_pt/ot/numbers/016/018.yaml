  text: וַ/יִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ עֲלֵי/הֶם֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עֲלֵי/הֶ֖ם קְטֹ֑רֶת וַֽ/יַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּ/מֹשֶׁ֥ה וְ/אַהֲרֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: pt
  text: Assim, cada homem pegou seu braseiro[a]; puseram fogo neles e colocaram incenso sobre eles. Então ficaram de pé à entrada da tenda do encontro, junto com Moisés e Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “incensário”. O termo hebraico se refere a um recipiente para levar brasas, usado na oferta de incenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: cada homem pegou seu braseiro
  rationale: אִישׁ tem sentido distributivo, e o sufixo singular indica que cada homem tomou o próprio utensílio. מַחְתָּה designa um recipiente para brasas, usado também na queima de incenso; “braseiro” é concreto e corrente, enquanto “incensário” permanece como alternativa em nota.
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: puseram fogo neles
  rationale: Embora עַל seja literalmente “sobre”, em relação a recipientes o português natural expressa a colocação do fogo dentro deles. O plural “neles” retoma os braseiros.
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: sobre o fogo, colocaram incenso
  rationale: O segundo עֲלֵיהֶם pode referir-se aos braseiros, mas a ação ritual consiste em pôr o incenso sobre as brasas. A explicitação mínima “sobre o fogo” evita em português a impressão pouco natural de que fogo e incenso foram simplesmente postos da mesma maneira nos recipientes.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Equivalente padrão e claro para a substância aromática queimada no culto.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: פֶּתַח indica a entrada ou abertura. “Tenda do encontro” reproduz o sentido de אֹהֶל מוֹעֵד em linguagem clara e preserva a designação cultual.
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: junto com Moisés e Arão
  rationale: A expressão nominal ao fim da oração indica naturalmente que Moisés e Arão também estavam ali. “Junto com” torna essa relação explícita sem acrescentar uma nova ação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. “Arão” segue a forma portuguesa tradicional. A sequência ritual foi expressa com clareza, sem alterar os participantes nem atribuir legitimidade teológica à oferta.
