  source_fidelity: 'A tradução preserva corretamente os participantes, a sequência básica das ações, a localização e a presença de Moisés e Arão. Contudo, “sobre o fogo” substitui o referente expresso pelo hebraico: ambas as ocorrências de עֲלֵיהֶם retomam os braseiros/incensários. Embora o incenso fosse funcionalmente posto sobre as brasas, essa explicitação altera a referência textual e deve ser evitada.'
