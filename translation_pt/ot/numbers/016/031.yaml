lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ
  choice: Assim que ele terminou
  rationale: A construção temporal com כְּ e o infinitivo transmite que o acontecimento ocorreu imediatamente ao fim da fala; a formulação é natural em português e preserva essa prontidão.
- source_word: הָאֲדָמָה
  choice: o chão
  rationale: No contexto, refere-se ao solo sob os envolvidos, não à terra como território; “chão” comunica isso com clareza.
- source_word: וַתִּבָּקַע
  choice: se abriu
  rationale: O verbo descreve o solo sendo fendido ou rachado. “Se abriu” é idiomático e adequado à cena, sem acrescentar detalhes.
- source_word: אֲשֶׁר תַּחְתֵּיהֶם
  choice: debaixo deles
  rationale: Reproduz de modo direto a relação espacial do hebraico e mantém o referente plural.
