base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: pt
  text: Então eles se afastaram[a] dos arredores da morada[b] de Corá, Datã e Abirão. Datã e Abirão saíram e estavam em pé à entrada das suas tendas, com suas mulheres, seus filhos e suas crianças pequenas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “subiram”. O verbo hebraico significa literalmente “subiram”, mas aqui provavelmente indica a retirada daquela área.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “morada” traduz o hebraico mishkan como o lugar de habitação ou acampamento associado a Corá, Datã e Abirão, e não como o tabernáculo do SENHOR.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּעָלוּ
  choice: se afastaram
  rationale: Embora o verbo signifique literalmente “subiram”, sua combinação com מֵעַל e o contexto de separação indicam aqui o afastamento da área; “se afastaram” comunica esse sentido de modo natural.
- source_word: מֵעַל ... מִסָּבִיב
  choice: dos arredores
  rationale: A combinação expressa a retirada da área que circundava a morada. “Dos arredores” preserva de forma concisa a relação espacial.
- source_word: מִשְׁכַּן
  choice: morada
  rationale: Neste contexto, designa o lugar de habitação ou acampamento associado a Corá, Datã e Abirão, não o tabernáculo do SENHOR.
- source_word: יָצְאוּ
  choice: saíram
  rationale: Descreve Datã e Abirão emergindo de suas tendas, sem acrescentar uma perspectiva espacial ausente do hebraico.
- source_word: נִצָּבִים
  choice: ficaram de pé
  rationale: Expressa diretamente a postura deles à entrada das tendas, sem introduzir explicitamente a ideia interpretativa de desafio.
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: à entrada das suas tendas
  rationale: Mantém o plural do hebraico e descreve naturalmente o local em que estavam.
- source_word: וּנְשֵׁיהֶם וּבְנֵיהֶם וְטַפָּם
  choice: com suas mulheres, seus filhos e suas crianças pequenas
  rationale: “Com” comunica o acompanhamento das famílias; “filhos” preserva a distinção entre בנים e טף, este último vertido concretamente como “crianças pequenas”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A formulação evita linguagem excessivamente técnica e preserva tanto o plural “tendas” quanto a distinção entre filhos e crianças pequenas.
