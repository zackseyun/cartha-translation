base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: pt
  text: 'E Moisés disse: “Por meio disto vocês saberão que Yahweh me enviou para realizar todos estes atos e que isso não partiu do meu próprio coração[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não do meu coração”, expressão que indica que Moisés não agiu por iniciativa ou autoridade própria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: E Moisés disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico sem impor uma relação temporal ou lógica mais específica.
- source_word: בְּזֹאת
  choice: Por meio disto
  rationale: Expressa o valor instrumental da preposição בְּ e aponta para o acontecimento que comprovará a afirmação de Moisés.
- source_word: תֵּדְעוּן
  choice: vocês saberão
  rationale: Traduz diretamente o imperfeito na segunda pessoa masculina plural com sentido futuro no contexto, em português corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: שְׁלָחַנִי
  choice: me enviou
  rationale: O perfeito hebraico apresenta o envio como fato consumado; o pretérito perfeito é natural e claro em português.
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: para realizar todos estes atos
  rationale: “Realizar” combina naturalmente com “atos” e mantém o sentido concreto de מַעֲשִׂים sem reduzi-lo ao vago “coisas”.
- source_word: כִּי לֹא מִלִּבִּי
  choice: e que isso não partiu do meu próprio coração
  rationale: Toma כִּי como introdução de uma segunda proposição que será conhecida, possibilidade sintática contextual, e conserva no texto a imagem hebraica do coração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Relação sintática do segundo כִּי
  choice: e que
  alternative: pois; porque
  rationale: 'A construção pode introduzir uma segunda proposição dependente de “vocês saberão”: tanto o envio por Yahweh quanto a ausência de iniciativa própria. Essa leitura preserva a tensão sintática sem acrescentar uma explicação causal.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A imagem hebraica do coração foi mantida no texto e explicada em nota.
