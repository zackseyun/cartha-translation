base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: pt
  text: A terra abriu a boca e os engoliu, bem como suas famílias[a], todas as pessoas ligadas a Corá[b] e todos os seus bens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas casas”. O termo hebraico pode indicar tanto as casas físicas como, por extensão, as famílias que nelas viviam.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “todo homem que pertencia a Corá”. O hebraico emprega אָדָם no singular em uma expressão coletiva.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: A terra abriu a boca
  rationale: Preserva a personificação e a metáfora explícita do hebraico, sem acrescentar a ideia mais intensa de que a terra “se fendeu”.
- source_word: וַתִּבְלַע אֹתָם
  choice: e os engoliu
  rationale: Traduz diretamente בלע e mantém o pronome cujo referente vem do contexto imediato.
- source_word: בָּתֵּיהֶם
  choice: suas famílias
  rationale: Embora o sentido literal seja “suas casas”, בַּיִת pode designar por extensão a unidade doméstica; “famílias” comunica naturalmente esse provável sentido humano no contexto.
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: todas as pessoas ligadas a Corá
  rationale: הָאָדָם funciona aqui coletivamente, e a construção com לְ indica vínculo ou pertencimento. A formulação portuguesa mantém essa relação sem definir de modo indevido sua natureza exata.
- source_word: כָּל־הָרֲכוּשׁ
  choice: todos os seus bens
  rationale: רְכוּשׁ abrange bens ou posses; “bens” é claro, atual e adequado ao contexto.
theological_decisions:
- issue: Valor coletivo de אָדָם e natureza da ligação com Corá
  choice: todas as pessoas ligadas a Corá
  alternative: todo homem que pertencia a Corá
  rationale: O substantivo está no singular masculino, mas aparece numa expressão coletiva com כָּל. A tradução principal comunica o coletivo; a nota conserva a forma mais literal e a possível ideia de pertencimento.
- issue: Sentido de בָּתֵּיהֶם no relato do juízo
  choice: suas famílias
  alternative: suas casas
  rationale: O termo pode indicar tanto as casas físicas como, por extensão, os respectivos grupos domésticos. O texto principal adota o sentido contextual provável, e a nota preserva a alternativa lexical.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. A coordenação “bem como” evita uma sequência pesada de conjunções sem apagar os elementos enumerados no hebraico.
