source:
  edition: WLC
  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: pt
  text: É pouca coisa você nos ter tirado de uma terra que mana leite e mel para nos matar no deserto[a] e ainda se fazer governante sobre nós?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os que falam descrevem ironicamente o Egito como “uma terra que mana leite e mel”, expressão usada em outros lugares para a terra prometida.
    reason: cultural_note
  - marker: b
    text: 'Ou: “e ainda dominar sobre nós” ou “e ainda exercer domínio sobre nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: Será pouco
  rationale: Expressão interrogativa idiomática de indignação; preserva a força retórica do hebraico em português natural.
- source_word: הֶעֱלִיתָנוּ
  choice: você nos ter tirado
  rationale: O hifil de עלה significa fazer subir ou trazer para fora. Em português, “tirado” comunica naturalmente a saída do Egito sem perder o movimento implícito no contexto do êxodo.
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: de uma terra que mana leite e mel
  rationale: Mantém literalmente a fórmula hebraica de abundância e, assim, conserva a ironia de ela ser aplicada ao Egito.
- source_word: לַהֲמִיתֵנוּ
  choice: para nos matar
  rationale: Traduz diretamente o infinitivo de finalidade e mantém a contundência da acusação.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é corrente e amplamente compreensível em português para o cenário inóspito de מִדְבָּר.
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: para ainda querer dominar sobre nós
  rationale: O verbo expressa exercer domínio ou portar-se como governante. A construção com infinitivo absoluto intensifica a acusação; “dominar sobre nós” transmite essa força sem sugerir legitimidade.
- source_word: גַּם
  choice: ainda
  rationale: 'Marca a queixa adicional: além de levá-los à morte, Moisés é acusado de pretender dominá-los.'
theological_decisions:
- issue: Designação irônica do Egito como “uma terra que mana leite e mel”
  choice: Manter a expressão literalmente no texto principal
  alternative: Explicitar o sarcasmo por meio de uma paráfrase
  rationale: A ironia decorre do contexto hebraico. Explicá-la dentro do versículo resolveria interpretativamente algo que o original deixa implícito.
- issue: Intensidade da acusação de domínio
  choice: Traduzir como “querer dominar sobre nós” e registrar alternativa em nota
  alternative: “fazer-se governante sobre nós”
  rationale: A opção principal é natural e vigorosa, enquanto a nota preserva de modo mais transparente a imagem de assumir posição governante.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pergunta retórica e a ironia foram preservadas; a repetição enfática hebraica foi vertida por “ainda querer dominar”.
