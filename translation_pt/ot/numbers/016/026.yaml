    issue: A expressão «com eles» foi acrescentada à cláusula final.
    rationale: O hebraico diz literalmente que os ouvintes não sejam atingidos/varridos «em/por causa de todos os pecados deles», sem incluir uma expressão equivalente a «com eles». O acréscimo torna explícita uma associação pessoal inferível do contexto, mas não verbalizada na frase.
  - severity: medium
    issue: A tradução principal fixa como causal a relação expressa por בְּכָל חַטֹּאתָם.
    rationale: A nuance causal é possível, mas o hebraico também permite uma leitura de associação ou circunstância. Uma nota deve conservar essa alternativa sem que a tradução acrescente elementos ausentes.
