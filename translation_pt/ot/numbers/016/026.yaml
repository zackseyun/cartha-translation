base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: pt
  text: 'E ele falou à comunidade, dizendo: “Por favor, afastem-se das tendas destes homens perversos e não toquem em nada do que lhes pertence, para que vocês não sejam destruídos por causa de todos os pecados deles[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que vocês não sejam destruídos em meio a todos os pecados deles”. O hebraico também pode expressar associação ou circunstância, e não somente causa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: עֵדָה designa aqui a comunidade israelita reunida. “Comunidade” é natural no português atual e mantém o sentido coletivo sem sugerir necessariamente uma instituição religiosa moderna.
- source_word: סוּרוּ נָא
  choice: Por favor, afastem-se
  rationale: O imperativo de סור pede que as pessoas se retirem da proximidade, e נָא acrescenta apelo e urgência. A formulação é direta e idiomática.
- source_word: מֵעַל אָהֳלֵי
  choice: das tendas de
  rationale: Embora מֵעַל tenha sentido espacial mais literal, neste contexto exprime afastamento da área junto às tendas. “Das tendas de” transmite isso naturalmente.
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: destes homens perversos
  rationale: Mantém a referência masculina específica e o juízo moral ou judicial expresso por רְשָׁעִים, em linguagem portuguesa atual.
- source_word: וְאַל תִּגְּעוּ
  choice: e não toquem
  rationale: Preserva a proibição simples e concreta do verbo נגע, sem especificar uma forma de contato não indicada pelo texto.
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: em nada do que lhes pertence
  rationale: Após a negação, esta construção comunica naturalmente a abrangência de todos os bens deles.
- source_word: פֶּן תִּסָּפוּ
  choice: para que vocês não sejam arrastados com eles
  rationale: O nifal de ספה pode indicar ser eliminado, destruído ou levado junto no juízo. “Sejam arrastados com eles” preserva a passividade e explicita, de modo contextual, o perigo de compartilhar o destino dos rebeldes.
- source_word: בְּכָל חַטֹּאתָם
  choice: por causa de todos os seus pecados
  rationale: A preposição ב pode ter nuance causal neste contexto. A nota registra a alternativa associativa mais formal, preservando a ambiguidade do hebraico.
theological_decisions:
- issue: Participação coletiva no juízo por associação com os perversos
  choice: A advertência exige separação dos homens perversos e de seus bens para que a comunidade não seja levada junto no juízo causado pelos pecados deles.
  alternative: “Para que vocês não sejam arrastados em todos os pecados deles”, preservando de maneira mais formal a associação expressa pela preposição ב.
  rationale: A redação não afirma transferência automática de culpa; mantém a conexão entre proximidade, pecados alheios e exposição ao juízo, enquanto a nota conserva a possível nuance associativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna inequívoco o plural dos verbos. O marcador [a] aparece no texto e documenta a ambiguidade da preposição hebraica.
