review_pass:
  verdict: revise
  source_fidelity: A advertência, os destinatários plurais, as tendas, os homens perversos e a proibição de tocar nos seus bens estão bem representados. Contudo, «com eles» não está expresso no hebraico e introduz uma associação pessoal que o texto não formula. Além disso, a redação principal exclusivamente causal reduz a ambiguidade de בְּכָל חַטֹּאתָם, embora a nota a registre.
  naturalness: O português é claro, atual e apropriado ao registro narrativo. «Comunidade», «afastem-se», «homens perversos» e «vocês» são naturais e amplamente compreensíveis. A alternativa da nota é compreensível, mas «arrastados em todos os pecados deles» é pouco idiomática em português.
  terminology: «Comunidade» traduz adequadamente עֵדָה neste contexto; «homens perversos» preserva a referência masculina e a avaliação moral de רְשָׁעִים. «Não toquem em nada do que lhes pertence» transmite bem a proibição abrangente. «Destruídos» é uma opção portuguesa clara para o nifal de ספה, cuja imagem de ser levado no juízo pode ser indicada na nota.
  issues:
