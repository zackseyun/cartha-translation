  text: דַּבֵּ֥ר אֶל הָ/עֵדָ֖ה לֵ/אמֹ֑ר הֵֽעָלוּ֙ מִ/סָּבִ֔יב לְ/מִשְׁכַּן קֹ֖רַח דָּתָ֥ן וַ/אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: pt
  text: 'Fale à comunidade e diga: “Afastem-se dos arredores da habitação de Corá, Datã e Abirão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: comunidade
  rationale: Expressa naturalmente o grupo reunido de Israel; evita que “congregação” seja entendido apenas em sentido eclesiástico moderno.
- source_word: הֵעָלוּ
  choice: afastem-se
  rationale: Neste contexto, a forma verbal funciona como ordem para que o povo se retire da área ao redor; uma tradução estritamente espacial como “subam” seria pouco natural e poderia sugerir uma subida não exigida pelo contexto.
- source_word: מִסָּבִיב לְמִשְׁכַּן
  choice: dos arredores da habitação
  rationale: Preserva a ideia de retirar-se de toda a área circundante. “Habitação” mantém o sentido amplo de מִשְׁכָּן sem identificá-lo necessariamente como o tabernáculo sagrado.
theological_decisions:
- issue: Natureza da habitação associada a Corá, Datã e Abirão
  choice: habitação
  alternative: tenda
  rationale: O hebraico usa מִשְׁכָּן, termo que pode indicar morada ou complexo habitacional. A escolha evita restringir o referente e preserva a tensão com o singular coletivo do texto.
translation_notes:
  register: 'Português moderno, claro e digno, com imperativo plural natural. Os nomes seguem as formas portuguesas tradicionais: Corá, Datã e Abirão.'
