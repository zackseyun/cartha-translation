  source_fidelity: A tradução comunica corretamente a ordem dirigida à comunidade para se afastar da área em torno da morada de Corá, Datã e Abirão. Embora הֵעָלוּ tenha literalmente a noção de “subir”, no contexto imediato a ordem é de retirada; “Afastem-se” transmite adequadamente sua função espacial e pragmática sem introduzir sentido alheio ao texto.
  naturalness: O português é moderno, claro e de registro apropriado. “Fale à comunidade e diga” reproduz de modo aceitável a fórmula hebraica “fala ... dizendo”, e o imperativo plural “Afastem-se” é natural.
