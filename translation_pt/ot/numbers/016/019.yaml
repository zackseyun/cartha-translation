  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: pt
  text: Corá reuniu toda a comunidade contra eles à entrada da Tenda do Encontro, e a glória de Yahweh[a] apareceu a toda a comunidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: reuniu
  rationale: 'O hifil de קהל tem sentido causativo: Corá fez a comunidade se reunir. “Reuniu” expressa sua iniciativa de modo natural e direto.'
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: No contexto da rebelião contra Moisés e Arão, עַל tem força adversativa; “contra eles” preserva essa orientação hostil.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa aqui a comunidade de Israel reunida como corpo; “comunidade” é corrente e abrangente, e “toda” traduz כָּל.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da Tenda do Encontro
  rationale: A expressão identifica o lugar da reunião. “À entrada” é natural em português e mantém o sentido locativo de פֶּתַח.
- source_word: אֹהֶל מוֹעֵד
  choice: Tenda do Encontro
  rationale: Tradução clara e consagrada da designação do santuário móvel no Pentateuco, preservando os elementos “tenda” e “encontro”.
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: O nifal de ראה é a formulação habitual para uma manifestação visível; “apareceu” é conciso e não especifica além do texto a forma dessa manifestação.
- source_word: כְבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: כָּבוֹד refere-se à manifestação perceptível da presença divina, enquanto o nome pessoal יְהוָה é transliterado como “Yahweh”.
- source_word: אֶל כָּל הָעֵדָה
  choice: a toda a comunidade
  rationale: A preposição indica aqueles a quem a glória se manifestou; “apareceu a toda a comunidade” conserva esse sentido e soa natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio, enquanto a forma tradicional “SENHOR” é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a força adversativa de “contra eles”. O marcador da nota foi colocado junto de “Yahweh”, termo ao qual a nota se refere.
