base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: pt
  text: É pouco para vocês[a] que o Deus de Israel os tenha separado da comunidade de Israel para aproximá-los de si, para realizarem o serviço do tabernáculo de Yahweh e estarem diante da comunidade para servi-la?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não basta para vocês...?” A expressão hebraica pode apresentar esse privilégio como algo que eles consideravam pequeno ou, de modo mais dinâmico, perguntar se o que receberam não lhes bastava.'
    reason: alternativa lexical
lexical_decisions:
- source_word: הַמְעַט
  choice: Será pouco para vocês
  rationale: Preserva a forma interrogativa e a força retórica do idioma hebraico, no qual Moisés censura os levitas por tratarem como insuficiente ou insignificante o privilégio já recebido.
- source_word: כִּי
  choice: que
  rationale: Introduz aqui o conteúdo da pergunta retórica, e não uma oração causal independente.
- source_word: הִבְדִּיל
  choice: tenha separado
  rationale: Reproduz diretamente o hifil de בדל e mantém o contraste entre os levitas e o restante da comunidade de Israel.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: comunidade de Israel
  rationale: עֵדָה designa a coletividade reunida; “comunidade” é corrente, clara e adequada ao contexto, sem limitar o sentido a uma reunião litúrgica.
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: aproximando-os de si
  rationale: Conserva o sentido relacional e cultual de קרב aplicado aos próprios levitas, sem transformá-los explicitamente em oferta.
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: para realizar o serviço do tabernáculo de Yahweh
  rationale: Expressa a ênfase do verbo עבד com o substantivo cognato עֲבֹדָה em português natural, preservando o caráter oficial e cultual da tarefa.
- source_word: מִשְׁכַּן יְהוָה
  choice: tabernáculo de Yahweh
  rationale: “Tabernáculo” é o termo estabelecido para o santuário móvel no deserto, e “Yahweh” translitera o nome divino presente no texto.
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: e ficar diante da comunidade
  rationale: Mantém a imagem concreta de assumir uma posição de serviço perante a coletividade reunida.
- source_word: לְשָׁרְתָם
  choice: a fim de servi-la
  rationale: שרת indica serviço ministerial ou oficial. O pronome feminino singular retoma naturalmente “comunidade” em português, enquanto comunica o serviço prestado ao povo reunido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama; a transliteração “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Natureza da aproximação dos levitas a Deus
  choice: aproximando-os de si
  alternative: apresentando-os diante de si
  rationale: A formulação mantém a possível dimensão cultual de קרב sem definir indevidamente os levitas como sacrifício nem reduzir a expressão a mera proximidade espacial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “vocês” para o plural explícito e “comunidade” para עֵדָה. A construção retórica hebraica é mantida no texto, com a alternativa idiomática registrada em nota.
