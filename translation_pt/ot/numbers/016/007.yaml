reference: Numbers 16:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/תְנ֣וּ בָ/הֵ֣ן אֵ֡שׁ וְ/שִׂימוּ֩ עֲלֵי/הֶ֨ן קְטֹ֜רֶת לִ/פְנֵ֤י יְהוָה֙ מָחָ֔ר וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁר יִבְחַ֥ר יְהוָ֖ה ה֣וּא הַ/קָּד֑וֹשׁ רַב לָ/כֶ֖ם בְּנֵ֥י לֵוִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: pt
  text: e ponham fogo neles e coloquem incenso sobre eles diante de Yahweh amanhã. Então, o homem que Yahweh escolher — esse será o santo. Vocês foram longe demais,[a] filhos de Levi!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Isso é demais para vocês, filhos de Levi!”'
    reason: Alternativa mais literal para רַב לָכֶם, cuja formulação hebraica admite tanto uma declaração de excesso quanto uma repreensão por terem ido longe demais.
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: e ponham fogo neles
  rationale: נתן com ב, referindo-se aos incensários do contexto anterior, indica pôr fogo dentro deles; a formulação é direta e natural em português.
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: e coloquem incenso sobre eles
  rationale: שים significa pôr ou colocar, e עַל preserva a ideia de colocar o incenso sobre o fogo nos incensários.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa apresentação na presença divina e preserva o idioma cultual hebraico em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em conformidade com a política do projeto.
- source_word: מָחָר
  choice: amanhã
  rationale: Equivalente temporal direto.
- source_word: וְהָיָה
  choice: Então ... será
  rationale: Introduz o resultado futuro da prova; a construção portuguesa comunica naturalmente essa relação.
- source_word: הָאִישׁ אֲשֶׁר יִבְחַר יְהוָה
  choice: o homem que Yahweh escolher
  rationale: Mantém o substantivo masculino singular e traduz o imperfeito como ação futura no contexto da prova marcada para o dia seguinte.
- source_word: הוּא הַקָּדוֹשׁ
  choice: esse será o santo
  rationale: O demonstrativo enfático representa הוּא, e “o santo” conserva o artigo de הַקָּדוֹשׁ e a designação daquele que Deus aprovar.
- source_word: רַב לָכֶם
  choice: Vocês foram longe demais
  rationale: Reproduz de modo idiomático a força da repreensão, segundo a qual os destinatários ultrapassaram os limites que lhes cabiam.
- source_word: בְּנֵי לֵוִי
  choice: filhos de Levi
  rationale: Preserva a expressão familiar hebraica e a força da interpelação direta.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto contém diretamente o Tetragrama; “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Força da repreensão רַב לָכֶם
  choice: Vocês foram longe demais
  alternative: Isso é demais para vocês
  rationale: A opção principal comunica a acusação contextual de que os filhos de Levi ultrapassaram seus limites, enquanto a alternativa formalmente possível é mantida em nota para não eliminar a ambiguidade lexical.
- issue: Sentido de הוּא הַקָּדוֹשׁ
  choice: esse será o santo
  alternative: esse é quem é santo
  rationale: A tradução conserva o artigo e apresenta o escolhido como a pessoa reconhecida por Yahweh como santa, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A coordenação inicial mantém a continuidade com o versículo anterior; a repetição de “eles” conserva a referência aos incensários sem explicitação interpretativa.
