  text: זֹ֖את עֲשׂ֑וּ קְחוּ לָ/כֶ֣ם מַחְתּ֔וֹת קֹ֖רַח וְ/כָל עֲדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/006.yaml
  text: 'Do this: take censers for yourselves[b][a], Korah and all his congregation.'
translation:
  language: pt
  text: 'Façam o seguinte: peguem para vocês incensários[a], Corá e todo o seu grupo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “recipientes para brasas”. O termo hebraico se refere a utensílios usados para transportar brasas, especialmente nos ritos de incenso.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a sua assembleia” ou “toda a sua comunidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: Façam o seguinte
  rationale: A combinação do demonstrativo com o imperativo plural introduz a instrução que vem a seguir; esta formulação é natural em português e preserva a referência prospectiva.
- source_word: קְחוּ לָכֶם
  choice: peguem para vocês
  rationale: O imperativo plural é vertido diretamente, e a expressão 'para vocês' preserva a nuance reflexiva do pronome preposicionado sem tornar a frase excessivamente formal.
- source_word: מַחְתּוֹת
  choice: incensários
  rationale: No contexto ritual, o termo designa recipientes usados para transportar brasas e oferecer incenso; 'incensários' é a designação portuguesa mais clara, com a alternativa concreta registrada em nota.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וְכָל עֲדָתוֹ
  choice: e todo o seu grupo
  rationale: עֵדָה pode designar assembleia, comunidade ou grupo reunido. Aqui, o referente é o conjunto ligado a Corá; 'grupo' é natural e evita sugerir que toda a congregação de Israel esteja em vista, sem eliminar as alternativas em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. A ordem dos vocativos no fim do versículo acompanha de perto o hebraico. As notas preservam a extensão semântica dos termos cultual e coletivo.
