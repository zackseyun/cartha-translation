  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: pt
  text: Cada um de vocês pegue o seu braseiro[a], ponha incenso nele e o apresente diante de Yahweh[b] — duzentos e cinquenta braseiros —; e você e Arão, cada um com o seu braseiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «incensário»; recipiente usado para levar brasas e queimar incenso.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH. Tradicionalmente traduzido por «SENHOR»; outra forma é «Jeová».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּקְחוּ אִישׁ מַחְתָּתוֹ
  choice: Cada homem pegue o seu braseiro
  rationale: O imperativo plural dirige-se ao grupo, enquanto אִישׁ e o sufixo singular têm força distributiva. A formulação portuguesa conserva ambos os aspectos.
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: braseiro / braseiros
  rationale: Designa o recipiente ritual que continha brasas e sobre o qual se punha incenso. «Braseiro» é concreto e compreensível; «incensário» é uma alternativa tradicional.
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: ponham incenso sobre eles
  rationale: Preserva a preposição עַל, provavelmente indicando que o incenso era posto sobre as brasas contidas nos recipientes.
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: e apresentem diante de Yahweh
  rationale: O hifil de קרב tem aqui sentido cultual de fazer chegar ou apresentar; «apresentem diante de» comunica naturalmente esse valor.
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: duzentos e cinquenta braseiros
  rationale: Reproduz por extenso o total especificado no hebraico.
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: Você e Arão também, cada um com o seu braseiro
  rationale: Explicita de modo natural em português que Moisés e Arão igualmente devem comparecer, preservando a distribuição individual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, não um título. «Yahweh» o representa diretamente, enquanto a nota registra as convenções tradicionais sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a sequência ritual e a força distributiva do hebraico, evitando linguagem excessivamente eclesiástica.
