  naturalness: «Cada homem pegue ... ponham ... apresentem» não é uma coordenação natural em português moderno. A formulação inteiramente distributiva, com «cada um de vocês» e verbos no singular, é clara, idiomática e conserva o sentido coletivo da ordem.
  terminology: «Braseiro» é uma opção defensável para מַחְתָּה, com a alternativa «incensário» adequadamente indicada em nota. «Yahweh» corresponde diretamente a יהוה; a nota explica de forma suficiente a convenção tradicional.
