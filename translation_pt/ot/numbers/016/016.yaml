source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: pt
  text: 'Moisés disse a Corá: “Amanhã, você e toda a sua assembleia estejam diante de Yahweh — você, eles e Arão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol dá continuidade à narrativa. Em português, o encadeamento fica natural sem a necessidade de explicitar a conjunção “e”.
- source_word: אַתָּה וְכָל־עֲדָתְךָ
  choice: você e toda a sua assembleia
  rationale: עֵדָה designa um grupo reunido ou uma comunidade constituída. “Assembleia” preserva o caráter coletivo sem introduzir necessariamente uma conotação eclesiástica moderna.
- source_word: הֱיוּ לִפְנֵי
  choice: estejam diante de
  rationale: O imperativo plural de היה, seguido de לִפְנֵי, ordena que os convocados estejam presentes perante Yahweh. “Estejam diante de” mantém tanto a forma verbal quanto a ideia espacial e relacional da expressão hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: você, eles e Arão
  rationale: Mantém a enumeração explícita e enfática das partes convocadas no hebraico.
- source_word: מָחָר
  choice: amanhã
  rationale: Equivalente direto do advérbio temporal; sua colocação no início da fala torna a frase clara e natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva a distinção entre o tetragrama e títulos como אֲדֹנָי.
- issue: Sentido de estar לִפְנֵי יְהוָה
  choice: estejam diante de Yahweh
  alternative: apresentem-se perante Yahweh
  rationale: A opção escolhida preserva o verbo היה, sem transformar a ordem em um verbo reflexivo mais específico, e mantém aberta a amplitude de “diante de/em presença de”.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por “você” para legibilidade brasileira. A repetição final foi preservada por refletir a ênfase deliberada do hebraico. Não foram reproduzidas as notas inglesas porque seus marcadores parecem deslocados e o texto português comunica as nuances relevantes diretamente.
