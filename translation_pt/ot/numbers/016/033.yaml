id: NUM.16.33
reference: Numbers 16:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: pt
  text: Assim, eles desceram vivos ao Sheol[a], eles e tudo o que lhes pertencia. A terra os cobriu, e eles desapareceram do meio da assembleia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «à sepultura» ou «ao mundo dos mortos». Hebraico: Sheol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: desceram
  rationale: O verbo ירד indica descer; «desceram» expressa com naturalidade o movimento narrativo e combina com o destino introduzido pela terminação direcional.
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: eles e tudo o que lhes pertencia
  rationale: A formulação mantém a abrangência do hebraico, sem restringir a referência apenas a pessoas ou apenas a bens.
- source_word: חַיִּים
  choice: vivos
  rationale: O predicativo enfatiza que desceram ainda com vida; «vivos» é direto e idiomático em português.
- source_word: שְׁאֹלָה
  choice: ao Sheol
  rationale: A transliteração preserva o conceito hebraico mais amplo que uma sepultura individual. A terminação direcional é expressa por «ao» após o verbo «descer», construção natural em português.
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: A terra os cobriu
  rationale: Mantém «a terra» como sujeito e traduz כסה de modo claro e vívido; o objeto pronominal comunica naturalmente o valor de עֲלֵיהֶם.
- source_word: וַיֹּאבְדוּ
  choice: desapareceram
  rationale: Neste contexto, אבד pode indicar que foram eliminados ou deixaram de estar presentes. «Desapareceram» se liga naturalmente à expressão seguinte, sem especificar além do texto o modo de sua morte.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: do meio da assembleia
  rationale: Reflete de perto o idioma hebraico e preserva קהל como a comunidade reunida, em linguagem portuguesa clara.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: «Sheol» preserva a amplitude e a ambiguidade conceitual do termo hebraico, sem reduzi-lo a uma sepultura nem identificá-lo com uma formulação posterior de inferno. As equivalências explicativas ficam na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita um período excessivamente carregado, sem alterar a sequência narrativa. «Assembleia» mantém o cenário comunitário e «Sheol» conserva a tensão teológica do hebraico.
