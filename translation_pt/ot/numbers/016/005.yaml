  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: pt
  text: 'Ele falou a Corá e a toda a sua comunidade: “Pela manhã, Yahweh dará a conhecer[a] quem lhe pertence e quem é santo, e o fará aproximar-se dele[b]. Aquele que ele escolher, o fará aproximar-se dele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh conhecerá quem lhe pertence”. O verbo hebraico significa literalmente “conhecer”, mas aqui pode ter o sentido de reconhecer ou mostrar publicamente.'
    reason: lexical_alternative
  - marker: b
    text: '“Fazer aproximar-se” é linguagem sacerdotal e cultual: refere-se a permitir que alguém se aproxime da presença de Yahweh para o serviço sagrado.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ele falou
  rationale: דבר indica falar ou dirigir-se a alguém. “Falou” mantém o registro narrativo e distingue o verbo da fórmula seguinte, לֵאמֹר, que introduz a fala direta.
- source_word: עֲדָתוֹ
  choice: toda a sua comunidade
  rationale: עֵדָה designa um grupo reunido ou uma comunidade. “Comunidade” é atual e clara, sem limitar o referente a uma multidão ocasional.
- source_word: בֹּקֶר
  choice: Pela manhã
  rationale: O substantivo sem preposição tem aqui valor adverbial temporal; “pela manhã” é uma formulação natural em português.
- source_word: וְיֹדַע יְהוָה
  choice: Yahweh dará a conhecer
  rationale: ידע significa formalmente “conhecer”, mas neste contexto aponta para reconhecer ou revelar publicamente quem possui a condição indicada. A nota preserva a tradução mais literal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת אֲשֶׁר לוֹ
  choice: quem lhe pertence
  rationale: Expressa naturalmente o sentido possessivo de “quem é dele”, sem definir além do texto a natureza dessa pertença.
- source_word: הַקָּדוֹשׁ
  choice: quem é santo
  rationale: O adjetivo substantivado identifica a pessoa santa ou separada para o serviço sagrado e mantém o paralelismo com “quem lhe pertence”.
- source_word: וְהִקְרִיב אֵלָיו
  choice: e fará com que essa pessoa se aproxime dele
  rationale: O hifil de קרב significa fazer aproximar ou conceder acesso, especialmente em contexto sacerdotal. A explicitação “essa pessoa” evita ambiguidade pronominal não presente no referente hebraico.
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: Aquele que ele escolher
  rationale: בחר denota escolher ou selecionar. A formulação preserva o caráter pessoal e solene da declaração.
- source_word: יַקְרִיב אֵלָיו
  choice: ele fará aproximar-se dele
  rationale: A repetição de “fará aproximar” reflete a repetição hebraica e reforça o tema do acesso autorizado à presença divina.
theological_decisions:
- issue: Sentido de וְיֹדַע na identificação divina
  choice: dará a conhecer
  alternative: conhecerá / reconhecerá
  rationale: O contexto é uma prova pública que manifestará quem pertence a Yahweh e foi separado por ele. Ainda assim, como a forma hebraica é literalmente “conhecerá”, a alternativa é registrada em nota para não eliminar a ambiguidade.
- issue: Referência de הַקָּדוֹשׁ e do objeto de וְהִקְרִיב
  choice: “quem é santo”, seguido de “essa pessoa”
  alternative: “o santo”, entendido como designação independente
  rationale: A construção pode ser lida como duas descrições coordenadas da pessoa que Yahweh fará aproximar. A tradução conserva ambas sem identificar antecipadamente um indivíduo ou ofício específico.
- issue: Tradução do nome יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto apresenta o nome divino, não um título. “Yahweh” o representa diretamente e evita ocultar sua ocorrência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fala mantém a repetição enfática do hebraico. “Yahweh” preserva o nome divino, e as notas esclarecem tanto a ambiguidade de ידע quanto o valor cultual de קרב.
