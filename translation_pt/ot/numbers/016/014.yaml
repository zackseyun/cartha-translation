  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: pt
  text: De fato, você não nos levou a uma terra que mana leite e mel, nem nos deu como herança campos e vinhedos. Você vai arrancar os olhos destes homens?[a] Não subiremos!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você vai cegar estes homens?” A expressão hebraica é literalmente “arrancar os olhos” e também pode sugerir que eles são tratados como cegos para a verdade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: De fato, ... não
  rationale: A expressão intensifica a acusação. “De fato” comunica a ênfase em português natural, mantendo a negação explícita.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: a uma terra que mana leite e mel
  rationale: Mantém a conhecida imagem hebraica de abundância e expressa naturalmente o movimento indicado pelo verbo “levar”.
- source_word: הֲבִיאֹתָנוּ
  choice: você não nos levou
  rationale: Embora a forma possa ser lida dentro da retórica da queixa, a declaração negativa transmite com clareza a acusação dos falantes.
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: nem nos deu como herança campos e vinhedos
  rationale: “Herança” preserva a ideia de posse ou porção recebida; os plurais comunicam em português o sentido coletivo dos singulares hebraicos.
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: Você vai arrancar os olhos destes homens?
  rationale: Preserva a imagem concreta e violenta do piel de נקר, sem eliminar sua possível força figurada de enganar ou tratar alguém como cego.
- source_word: לֹא נַעֲלֶה
  choice: Não subiremos!
  rationale: Conserva o sentido básico de עלה e, no contexto, expressa a recusa enfática de atender à convocação de Moisés.
theological_decisions:
- issue: Sentido literal ou figurado de arrancar os olhos
  choice: Manter no texto a imagem literal “arrancar os olhos”
  alternative: “cegar estes homens” ou explicitar a ideia de engano
  rationale: O hebraico usa uma expressão corporal vívida que pode funcionar retoricamente. A tradução não deve decidir de modo exclusivo entre ameaça física e acusação figurada; a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Mana leite e mel” preserva a formulação bíblica amplamente reconhecida; “vinhedos” é corrente e inequívoco. A exclamação final comunica a firmeza da recusa presente no contexto.
