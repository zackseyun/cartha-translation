base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: pt
  text: 'Então Moisés mandou chamar Datã e Abirão, filhos de Eliabe, mas eles disseram: “Não subiremos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico significa literalmente “subir” e pode se referir a subir até o lugar onde Moisés estava ou a comparecer diante dele em resposta à convocação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou
  rationale: Neste contexto, o verbo indica que Moisés tomou a iniciativa de enviar alguém para convocá-los; a construção portuguesa “mandou chamar” é natural e não especifica o mensageiro.
- source_word: לִקְרֹא
  choice: chamar
  rationale: Combinado com “mandou”, expressa uma convocação oficial de modo claro e idiomático em português.
- source_word: דָתָן וְלַאֲבִירָם
  choice: Datã e Abirão
  rationale: Formas tradicionais e amplamente reconhecíveis dos nomes hebraicos em português.
- source_word: בְּנֵי אֱלִיאָב
  choice: filhos de Eliabe
  rationale: Reproduz diretamente a identificação filial dos dois homens, com formulação natural em português.
- source_word: וַיֹּאמְרוּ
  choice: mas eles disseram
  rationale: Embora a conjunção seja formalmente aditiva, o contexto estabelece contraste entre a convocação e a recusa; “mas” torna essa relação discursiva explícita sem alterar o sentido.
- source_word: לֹא נַעֲלֶה
  choice: Não subiremos
  rationale: Preserva o sentido literal de עלה, “subir”, e o valor volitivo da recusa, sem decidir se a subida é espacial ou uma forma de comparecer perante Moisés.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Mandou chamar” traduz de modo idiomático a sequência verbal hebraica, enquanto “Não subiremos” conserva a imagem e a ambiguidade do original.
