base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: pt
  text: E saiu fogo de Yahweh[a] e consumiu os duzentos e cinquenta homens que ofereciam o incenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “de diante de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: E saiu fogo
  rationale: אֵשׁ significa “fogo”; a conjunção וְ preserva a sequência narrativa. Em português, não é necessário acrescentar artigo indefinido.
- source_word: יָצְאָה
  choice: saiu
  rationale: O verbo יצא indica sair ou proceder de algum lugar. “Saiu” é direto e natural quando o fogo procede da presença divina.
- source_word: מֵ/אֵת יְהוָה
  choice: da parte de Yahweh
  rationale: מֵאֵת assinala origem ou procedência, frequentemente com nuance de vir da presença de alguém. “Da parte de Yahweh” é idiomático e mantém Yahweh como fonte do fogo; a alternativa mais formal é registrada em nota.
- source_word: וַ/תֹּאכַל
  choice: e consumiu
  rationale: Embora אכל signifique literalmente “comer”, quando o sujeito é fogo o sentido idiomático é “consumir” ou “devorar”. “Consumiu” é claro, digno e preciso.
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: os duzentos e cinquenta homens
  rationale: A expressão numérica hebraica designa um grupo definido de 250 homens. A forma por extenso é natural em texto bíblico corrido.
- source_word: מַקְרִיבֵי
  choice: que ofereciam
  rationale: O particípio de קרב caracteriza os homens pela ação que realizavam naquele momento. A oração relativa expressa com naturalidade essa ação em andamento.
- source_word: הַ/קְּטֹרֶת
  choice: o incenso
  rationale: קְטֹרֶת refere-se ao incenso cultual específico do episódio; o artigo definido preserva essa referência determinada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual revelado, sem substituí-lo por um título ou adotar a forma tradicional híbrida “Jeová”.
- issue: Agência divina no juízo
  choice: da parte de Yahweh
  alternative: de diante de Yahweh
  rationale: A tradução identifica Yahweh como a origem do fogo sem acrescentar explicações sobre o mecanismo do juízo; a nuance espacial ou presencial de מֵאֵת permanece disponível na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial com “E” acompanha a sequência narrativa hebraica; “consumiu” conserva a força do juízo sem arcaísmo.
