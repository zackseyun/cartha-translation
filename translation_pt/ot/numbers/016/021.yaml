  text: הִבָּ֣דְל֔וּ מִ/תּ֖וֹךְ הָ/עֵדָ֣ה הַ/זֹּ֑את וַ/אַכַלֶּ֥ה אֹתָ֖/ם כְּ/רָֽגַע׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: pt
  text: Separem-se do meio desta congregação[a], para que eu os consuma num instante.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desta assembleia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “num momento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: Separem-se
  rationale: 'O imperativo plural nifal de בדל tem aqui sentido reflexivo: os destinatários devem afastar-se distintamente do grupo. “Separem-se” é natural e conserva a força da ordem.'
- source_word: מִתּוֹךְ
  choice: do meio de
  rationale: A construção indica saída ou separação de dentro de um grupo. “Do meio de” preserva a dimensão espacial do hebraico.
- source_word: הָעֵדָה הַזֹּאת
  choice: desta congregação
  rationale: עֵדָה designa a coletividade reunida de Israel. “Congregação” mantém o sentido corporativo e é corrente no contexto do Pentateuco.
- source_word: וַאֲכַלֶּה
  choice: para que eu os consuma
  rationale: A forma verbal expressa propósito ou resultado volitivo após a ordem. “Consuma” conserva a força severa de כלה, isto é, acabar completamente com o grupo.
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto masculino plural, referente à congregação sob juízo.
- source_word: כְּרָגַע
  choice: num instante
  rationale: רֶגַע denota um espaço de tempo muito breve. “Num instante” comunica de modo idiomático a rapidez do juízo anunciado.
theological_decisions:
- issue: Natureza da ameaça ou declaração divina de juízo
  choice: Traduzir como intenção real de consumir rapidamente a congregação
  alternative: Atenuar para “tratar deles” ou “removê-los”
  rationale: Neste contexto, כלה expressa destruição completa. A tradução preserva a severidade e a tensão teológica da declaração sem mitigá-la nem explicá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem direta “Separem-se” mantém a urgência; “do meio desta congregação” preserva a imagem espacial do hebraico. Os marcadores foram colocados junto aos termos a que se referem.
