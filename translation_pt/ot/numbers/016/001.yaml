  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: pt
  text: Corá, filho de Isar, filho de Coate, filho de Levi, juntamente com Datã e Abirão, filhos de Eliabe, e Om, filho de Pelete, todos filhos de Rúben, tomou consigo homens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “tomou”. O objeto não é declarado no hebraico; “homens” foi suprido com base no contexto do versículo seguinte, para maior clareza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou consigo alguns homens
  rationale: O verbo significa literalmente “tomou”, mas o objeto não é expresso no hebraico. “Alguns homens” é suprido com base no contexto imediato do versículo seguinte; “consigo” torna a construção natural em português sem adotar a interpretação mais ampla “rebelou-se” ou “formou um grupo”.
- source_word: קֹרַח
  choice: Corá
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: filho de Isar, filho de Coate, filho de Levi
  rationale: Mantém a cadeia genealógica formal e a repetição de “filho de”, preservando a ênfase na linhagem levítica.
- source_word: וְדָתָן וַאֲבִירָם
  choice: juntamente com Datã e Abirão
  rationale: A expressão associa Datã e Abirão a Corá na ação; “juntamente com” esclarece essa relação em português sem alterar o conteúdo.
- source_word: בְּנֵי אֱלִיאָב
  choice: filhos de Eliabe
  rationale: Tradução direta da expressão genealógica no plural.
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: e Om, filho de Pelete
  rationale: Translitera os nomes segundo formas portuguesas correntes e preserva a relação genealógica.
- source_word: בְּנֵי רְאוּבֵן
  choice: todos filhos de Rúben
  rationale: Preserva a formulação genealógica “filhos de Rúben”; “todos” deixa claro que a expressão se refere a Datã, Abirão e Om, não ao levita Corá.
theological_decisions:
- issue: Sintaxe elíptica da oração inicial
  choice: 'Suprir o objeto implícito: “tomou consigo alguns homens”'
  alternative: Manter apenas “tomou”, sem objeto, ou interpretar como “rebelou-se”/“formou um grupo”
  rationale: O hebraico deixa o objeto sem expressão. O versículo seguinte menciona 250 homens, favorecendo o complemento contextual, mas a nota registra a forma literal para não ocultar a elipse nem transformar uma inferência contextual em conteúdo explícito do texto-fonte.
- issue: Referente de “filhos de Rúben”
  choice: Aplicar a expressão a Datã, Abirão e Om
  alternative: Conservar uma ordem rigidamente literal que poderia parecer incluir Corá entre os filhos de Rúben
  rationale: A genealogia identifica Corá explicitamente como levita. A disposição em português evita uma associação gramatical enganosa, sem mudar a identificação dos demais participantes.
translation_notes:
  register: Português atual, digno e acessível, com formas onomásticas reconhecíveis no uso bíblico lusófono. A estrutura genealógica repetitiva foi preservada, enquanto a pontuação e “juntamente com” tornam inteligível a longa oração. Não se acrescentou um marcador temporal equivalente a “ora” ou “então”, pois não há no texto-fonte uma palavra temporal explícita.
