source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: pt
  text: e se levantaram diante de Moisés, com duzentos e cinquenta homens dentre os filhos de Israel[a], líderes da comunidade, convocados para a assembleia[b], homens de renome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dentre os israelitas”. O hebraico diz literalmente “dentre os filhos de Israel”, designação tradicional do povo da aliança.
    reason: lexical_alternative
  - marker: b
    text: Ou “chamados para a reunião”. A expressão hebraica pode indicar homens oficialmente convocados para a reunião marcada da comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: se levantaram
  rationale: O qal narrativo de קום indica que eles se ergueram para agir. A formulação preserva o possível tom de confronto sem inserir no próprio verbo uma interpretação explícita de rebelião.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém o sentido espacial e relacional de estar perante Moisés; o contexto pode comunicar oposição sem que se traduza diretamente por “contra”.
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל
  choice: com duzentos e cinquenta homens dentre os filhos de Israel
  rationale: “Com” torna natural em português a coordenação elíptica hebraica. “Dentre os filhos de Israel” preserva a designação hebraica e deixa claro que os homens pertenciam ao povo.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: duzentos e cinquenta
  rationale: Forma numérica corrente e clara em português.
- source_word: נְשִׂיאֵי עֵדָה
  choice: líderes da comunidade
  rationale: נָשִׂיא designa um chefe ou líder, e עֵדָה, neste contexto, é a comunidade reunida de Israel. A expressão é atual e não acrescenta uma estrutura institucional alheia ao texto.
- source_word: קְרִאֵי מוֹעֵד
  choice: convocados para a assembleia
  rationale: Expressa o sentido passivo de pessoas chamadas ou convocadas para a reunião comunitária, preservando a possível função oficial sem torná-la excessivamente técnica.
- source_word: אַנְשֵׁי שֵׁם
  choice: homens de renome
  rationale: Reproduz naturalmente o idiomatismo hebraico “homens de nome”, isto é, homens reconhecidos e de reputação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A tradução conserva “diante de” para não transformar em interpretação explícita o possível sentido adversativo e mantém “filhos de Israel” no texto, oferecendo a forma idiomática em nota.
