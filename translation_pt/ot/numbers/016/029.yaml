base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: pt
  text: Se estes homens morrerem como morre toda a humanidade, e se lhes acontecer o que acontece a toda a humanidade[a], então Yahweh não me enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e se sobre eles vier a visitação que sobrevém a toda a humanidade”. O hebraico repete a raiz פקד, que pode transmitir a ideia de visitação, designação ou daquilo que sobrevém a alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Se
  rationale: Introduz de modo natural a condição pela qual Moisés comprova sua missão.
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: estes homens morrerem como morre toda a humanidade
  rationale: Reproduz a ideia enfática de uma morte segundo o curso humano comum, em português claro, sem restringir אָדָם ao sexo masculino.
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: se lhes acontecer o que acontece a toda a humanidade
  rationale: Expressa idiomaticamente aquilo que normalmente sobrevém aos seres humanos, embora a repetição da raiz פקד não possa ser preservada com naturalidade no texto principal.
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: então Yahweh não me enviou
  rationale: Torna explícita a consequência lógica da condição e preserva o nome divino e o sentido da comissão de Moisés.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido da morte e da פְּקֻדָּה comuns à humanidade
  choice: morte e acontecimento segundo o curso humano comum
  alternative: castigo ou visitação divina comum à humanidade
  rationale: O contraste contextual é entre uma morte ordinária e a intervenção extraordinária anunciada por Moisés. A formulação evita definir פְּקֻדָּה exclusivamente como castigo, pois a palavra admite sentidos como visitação, destino ou aquilo que sobrevém.
- issue: Representação de אָדָם em sentido coletivo
  choice: toda a humanidade
  alternative: todos os homens
  rationale: Aqui אָדָם designa genericamente os seres humanos e sua condição comum, não apenas pessoas do sexo masculino.
- issue: Representação do nome יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: Preserva no texto o nome divino pessoal usado no hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A estrutura condicional e o paralelismo hebraico são mantidos, enquanto a expressão com פקד é vertida de forma idiomática e sua ambiguidade é registrada em nota.
