  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “E Yahweh falou a Moisés, dizendo”. A conjunção inicial também pode ser traduzida por “E”, em vez de “Então”.'
    reason: Alternativa lexical e preservação da forma hebraica.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol de דבר faz a narrativa avançar. “Então” expressa naturalmente a sequência, e “falou” preserva o sentido verbal da fórmula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Equivalente direcional natural em português na construção “falar a alguém”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula, o infinitivo introduz a fala direta que vem no versículo seguinte; em português atual, os dois-pontos comunicam essa função com mais naturalidade do que o literal “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; “Jeová” representa uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula hebraica לֵאמֹר foi vertida funcionalmente por dois-pontos, evitando o pouco natural “dizendo” antes da fala do versículo seguinte.
