base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: pt
  text: 'Eles se reuniram contra Moisés e Arão e lhes disseram: “Vocês já foram longe demais![a] Pois toda a comunidade — todos os seus membros — é santa, e Yahweh está no meio deles.[b] Então, por que vocês se elevam acima da assembleia de Yahweh?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “É demais para vocês” ou “Basta de vocês”. A expressão é uma repreensão incisiva, aqui vertida: “Vocês já foram longe demais!”'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” representa o nome divino YHWH, tradicionalmente vertido como “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: Eles se reuniram contra
  rationale: Preserva o sentido corporativo do nifal de קהל e traduz עַל, neste contexto de confronto, como oposição.
- source_word: רַב לָכֶם
  choice: Basta de vocês!
  rationale: Expressa em português atual a repreensão idiomática hebraica, mantendo sua força e deixando a formulação mais literal na nota.
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: Toda a comunidade — todos eles —
  rationale: Mantém a totalidade enfática de כָל ... כֻּלָּם. “Comunidade” é natural e apropriado para o povo reunido.
- source_word: קְדֹשִׁים
  choice: é santa
  rationale: “Santa” é a tradução tradicional e semanticamente ampla de קדושׁ; a concordância no singular segue o núcleo coletivo “comunidade”, enquanto “todos eles” preserva a ênfase distributiva.
- source_word: וּבְתוֹכָם יְהוָה
  choice: e Yahweh está no meio deles
  rationale: Traduz diretamente a presença divina no interior da comunidade e preserva o nome próprio divino.
- source_word: וּמַדּוּעַ תִּתְנַשְּׂאוּ
  choice: Então, por que vocês se elevam
  rationale: “Então” comunica a inferência; “se elevam” preserva o valor reflexivo do hitpael sem acrescentar uma avaliação além da acusação dos falantes.
- source_word: עַל קְהַל יְהוָה
  choice: acima da assembleia de Yahweh
  rationale: “Acima” explicita a elevação alegada, e “assembleia” distingue קהל de עֵדָה sem perder a relação semântica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: A afirmação de que toda a comunidade é santa
  choice: Apresentada diretamente como fala dos rebeldes
  alternative: Acrescentar qualificações como “afirma ser santa” ou indicar que a alegação é falsa
  rationale: O versículo relata a alegação sem julgá-la na própria formulação; o contexto narrativo mantém a tensão e faz sua avaliação.
- issue: Sentido de תִּתְנַשְּׂאוּ
  choice: vocês se elevam
  alternative: vocês se exaltam; vocês se colocam acima
  rationale: A escolha mantém a reflexividade e a acusação de autoelevação, sem tornar a tradução desnecessariamente interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Os travessões reproduzem a ênfase do hebraico; “vocês” evita regionalismo excessivo e corresponde ao plural dirigido a Moisés e Arão.
