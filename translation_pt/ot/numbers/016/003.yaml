  naturalness: “Basta de vocês!” não é uma repreensão idiomática natural no português moderno. “Vocês já foram longe demais!” transmite com clareza e força a censura hebraica. Também é preferível tornar a construção enfática sobre a comunidade mais fluente em português.
  terminology: “Comunidade”, “assembleia”, “santos” e “Yahweh” são escolhas adequadas. A distinção entre עֵדָה (“comunidade”) e קָהָל (“assembleia”) é mantida de modo útil e natural.
