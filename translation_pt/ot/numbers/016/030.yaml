  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: pt
  text: Mas, se Yahweh criar algo novo[a], e o solo abrir a sua boca e os engolir, junto com tudo o que lhes pertence, e eles descerem vivos ao Sheol[b], então vocês saberão que esses homens desprezaram Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criar uma coisa nova” ou “criar uma criação”. O hebraico emprega um substantivo e um verbo da mesma raiz para enfatizar um ato extraordinário de Deus.
    reason: lexical_alternative
  - marker: b
    text: Sheol é o termo hebraico para o mundo dos mortos; em sentido mais concreto, também pode ser traduzido por “sepultura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: criar algo novo
  rationale: A construção combina substantivo e verbo cognatos para dar ênfase a um ato criador extraordinário. A formulação é natural em português e a nota preserva a figura hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: o solo abrir a sua boca
  rationale: Preserva a imagem antropomórfica; 'solo' expressa adequadamente אֲדָמָה no cenário imediato.
- source_word: וּבָלְעָה
  choice: os engolir
  rationale: Tradução direta e idiomática do verbo que significa engolir ou tragar.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: tudo o que lhes pertence
  rationale: Mantém o alcance abrangente da expressão sem especificar indevidamente pessoas ou bens.
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: eles descerem vivos ao Sheol
  rationale: Conserva tanto a descida quanto a ênfase em estarem vivos, além de transliterar o termo hebraico.
- source_word: וִידַעְתֶּם
  choice: então vocês saberão
  rationale: Torna explícita, em português natural, a relação de consequência da construção condicional.
- source_word: נִאֲצוּ
  choice: desprezaram
  rationale: Expressa o desprezo e a rejeição afrontosa indicados pelo verbo hebraico.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: esses homens
  rationale: Preserva a referência masculina explícita do hebraico.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: O termo hebraico pode designar mais do que uma sepultura concreta. A transliteração preserva sua amplitude e evita resolver indevidamente a tensão conceitual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe condicional foi preservada, e as imagens concretas do hebraico foram mantidas.
