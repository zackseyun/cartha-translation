  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: pt
  text: 'Então Moisés disse a Corá: “Escutem agora, filhos de Levi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então ... disse” expressa naturalmente a sequência em português.
- source_word: אֶל קֹרַח
  choice: a Corá
  rationale: אֶל indica o destinatário da fala; a regência natural de “dizer” em português é “dizer a”. O nome קֹרַח é transliterado segundo a forma portuguesa consagrada, “Corá”.
- source_word: שִׁמְעוּ
  choice: Escutem
  rationale: O imperativo está no plural e convoca os destinatários a prestar atenção. “Escutem” preserva a força direta da exortação em português corrente.
- source_word: נָא
  choice: agora
  rationale: A partícula acrescenta insistência ou urgência ao imperativo. Neste contexto de confronto, “agora” comunica isso melhor que o cortês “por favor”.
- source_word: בְּנֵי לֵוִי
  choice: filhos de Levi
  rationale: A expressão construta masculina plural significa literalmente “filhos de Levi” e identifica os homens levitas interpelados, sem neutralizar o gênero da formulação hebraica.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Emprega-se a forma portuguesa tradicional do nome.
theological_decisions:
- issue: Termo de parentesco masculino na interpelação direta
  choice: filhos de Levi
  alternative: levitas
  rationale: O hebraico usa explicitamente בְּנֵי, “filhos de”. A tradução preserva a imagem de descendência e o gênero gramatical, em vez de substituí-los pelo gentílico mais conciso.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem e a pontuação tornam explícito que Corá é o destinatário inicial, enquanto o imperativo plural abrange os filhos de Levi presentes. Não se acrescentou nota porque as alternativas “Ouçam” e “por favor” são possíveis, mas não necessárias para conservar uma ambiguidade substantiva do texto.
