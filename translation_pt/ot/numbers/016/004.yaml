  text: וַ/יִּשְׁמַ֣ע מֹשֶׁ֔ה וַ/יִּפֹּ֖ל עַל פָּנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: pt
  text: Quando Moisés ouviu isso, prostrou-se com o rosto em terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “caiu sobre o seu rosto”. Também pode ser traduzido por “caiu com o rosto em terra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviu isso
  rationale: O verbo שׁמע, na sequência narrativa, significa naturalmente “ouviu”. O objeto está implícito no hebraico e é recuperado do contexto anterior; “isso” torna a frase natural em português sem acrescentar uma interpretação específica.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico מֹשֶׁה.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: prostrou-se com o rosto em terra
  rationale: A expressão hebraica significa literalmente “caiu sobre o seu rosto” e descreve a ação de se pôr com o rosto no chão. A formulação escolhida comunica com clareza o gesto em português atual, preservando a imagem física sem determinar sua motivação.
theological_decisions:
- issue: Sentido interpretativo da postura de Moisés
  choice: Descrever apenas o gesto concreto, sem afirmar que se tratava especificamente de oração, choque, humildade ou intercessão.
  alternative: “prostrou-se em oração” ou “caiu com o rosto em terra, consternado”
  rationale: O hebraico relata a ação, mas não explica explicitamente seu significado emocional ou devocional. A tradução mantém essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Prostrou-se com o rosto em terra” é mais idiomático que o decalque “caiu sobre o rosto”, mas a nota preserva a forma literal do hebraico.
