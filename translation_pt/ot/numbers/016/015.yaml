base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: pt
  text: 'Então Moisés ficou muito irado e disse a Yahweh: “Não olhes com favor para a oferta deles.[a] Não tomei deles nem sequer um jumento, nem fiz mal a nenhum deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não te voltes para a oferta deles” ou “Não aceites a oferta deles”. O hebraico diz literalmente: “Não te voltes para a oferta deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: Então Moisés ficou muito irado
  rationale: A expressão idiomática חרה ל descreve a ira que se acende em alguém; “ficou muito irado” é natural, digna e preserva a intensidade de מְאֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: Não olhes com favor para a oferta deles
  rationale: פנה אל significa literalmente “voltar-se para”, mas neste pedido implica dar atenção ou acolhimento favorável. A formulação portuguesa comunica essa força contextual sem afirmar de modo excessivamente explícito que a oferta seria aceita.
- source_word: מִנְחָתָם
  choice: a oferta deles
  rationale: מִנְחָה pode designar presente, tributo ou oferta. “Oferta” preserva a amplitude lexical e se ajusta ao contexto cultual sem especificar indevidamente uma oferta de cereal.
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: Não tomei deles nem sequer um jumento
  rationale: נשא com objeto direto expressa aqui tomar ou apropriar-se. “Nem sequer um jumento” conserva a imagem concreta e enfatiza que Moisés não os explorou materialmente.
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: nem fiz mal a nenhum deles
  rationale: O hifil de רעע indica causar mal ou dano. “Fiz mal” é claro e natural e mantém aberto se o sentido envolve dano concreto ou tratamento injusto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Sentido do pedido relativo à oferta
  choice: Não olhes com favor para a oferta deles
  alternative: Não te voltes para a oferta deles; Não aceites a oferta deles
  rationale: A tradução explicita a conotação favorável de פנה אל no contexto de oração, mas a nota conserva tanto a metáfora literal quanto a possível implicação de não aceitação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Emprega “olhes” no discurso dirigido a Deus para manter naturalidade e dignidade, sem linguagem excessivamente arcaica.
