  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: pt
  text: Portanto, você e todo o seu grupo[a], que se reuniram contra Yahweh[b] — e Arão, o que é ele[c], para vocês murmurarem contra ele?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a sua assembleia” ou “toda a sua comunidade”.'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” representa o nome divino YHWH.
    reason: lexical_alternative
  - marker: c
    text: 'A frase pode ser traduzida: “E, quanto a Arão, quem é ele?”. A pergunta ressalta que a rebelião deles se dirige, em última análise, contra Yahweh, e não apenas contra Arão.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a força conclusiva da fala de Moisés e soa natural em português atual.
- source_word: עֲדָתְךָ
  choice: todo o seu grupo
  rationale: No contexto, designa a facção reunida com Corá. “Grupo” evita sugerir que toda a congregação de Israel esteja em vista, sem excluir as alternativas lexicais “assembleia” e “comunidade”.
- source_word: הַנֹּעָדִים
  choice: são os que se reuniram
  rationale: Expressa o particípio nifal de יעד como reunião deliberada, sem acrescentar uma motivação não explicitada pelo texto.
- source_word: עַל יְהוָה
  choice: contra Yahweh
  rationale: O contexto de rebelião favorece o sentido adversativo de עַל; o nome divino é transliterado em vez de substituído por um título.
- source_word: וְאַהֲרֹן מַה הוּא
  choice: E quem é Arão
  rationale: Formula em português corrente a pergunta retórica que minimiza a importância pessoal de Arão diante de Yahweh, sem apagar sua aspereza.
- source_word: תלונו עָלָיו
  choice: para vocês murmurarem contra ele
  rationale: “Murmurar” conserva o tom recorrente e negativo das queixas no deserto, e “contra ele” reflete o valor adversativo de עָלָיו.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança e evita convertê-lo silenciosamente em título.
- issue: Alvo principal da rebelião
  choice: A reunião é apresentada como dirigida contra Yahweh; Arão é mencionado depois em uma pergunta retórica.
  alternative: Entender Yahweh e Arão como alvos coordenados e equivalentes.
  rationale: A sintaxe primeiro caracteriza o grupo como reunido contra Yahweh e só então pergunta o que Arão é para que murmurem contra ele, preservando a tensão e a ênfase do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Você” corresponde ao singular dirigido a Corá, enquanto “vocês” inclui Corá e seu grupo. “Murmurar” foi mantido por sua força negativa e por sua ligação lexical com o motivo das queixas no deserto.
