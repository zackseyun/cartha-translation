base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: pt
  text: 'E todos os israelitas que estavam ao redor deles fugiram ao som deles[a], pois diziam: “Que a terra não nos engula!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao som dos seus gritos” ou “à voz deles”. O hebraico qôl pode significar “som”, “voz” ou “grito”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: Então todo o Israel
  rationale: A expressão coletiva preserva o sentido corporativo do hebraico; “então” liga naturalmente a reação ao acontecimento anterior.
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: que estava ao redor deles
  rationale: Identifica a parcela de Israel presente nas proximidades e reproduz com naturalidade a construção relativa.
- source_word: נָסוּ
  choice: fugiu
  rationale: נוּס indica fuga urgente. O singular concorda em português com o coletivo “todo o Israel”.
- source_word: לְ/קֹלָם
  choice: ao som dos seus gritos
  rationale: קוֹל pode designar som, voz ou grito. No contexto, a formulação mantém a referência auditiva e expressa naturalmente que o som procedia dos atingidos pelo juízo, sem eliminar a alternativa lexical.
- source_word: כִּי אָמְרוּ
  choice: pois diziam
  rationale: כִּי apresenta a razão da fuga; o imperfeito português é idiomático para a fala compartilhada pelo grupo durante a ação.
- source_word: פֶּן
  choice: Não aconteça que
  rationale: Expressa uma consequência temida em português atual e digno, evitando o pouco corrente “para que não” neste tipo de exclamação.
- source_word: תִּבְלָעֵנוּ
  choice: também nos engula
  rationale: “Engolir” conserva a imagem vívida de בלע. “Também” explicita de modo natural a inclusão temida pelos fugitivos, implícita no contexto imediato.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Retoma diretamente a terra que abriu a boca no versículo 32 e preserva a personificação narrativa.
