    rationale: קוֹל pode significar som, voz ou clamor. Embora «gritos» seja possível no contexto, o texto principal deve preservar a ambiguidade lexical, sobretudo quando a nota a reconhece.
  - severity: low
    issue: «também» acrescenta uma partícula não expressa.
    rationale: O temor de sofrer destino semelhante decorre do contexto, mas o advérbio não ocorre no hebraico e não é necessário para uma tradução natural.
  - severity: low
    issue: O coletivo singular «todo o Israel ... estava ... fugiu» atenua os plurais do hebraico.
    rationale: Os verbos e o sufixo em אֲשֶׁר סְבִיבֹתֵיהֶם e נָסוּ apresentam o grupo de pessoas nas proximidades. «Todos os israelitas ... estavam ... fugiram» comunica isso com clareza em português.
  revised_text: 'E todos os israelitas que estavam ao redor deles fugiram ao som deles[a], pois diziam: “Que a terra não nos engula!”'
  revised_footnotes:
