  yaml_path: translation/ot/numbers/016/020.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés e a Arão, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O imperfeito consecutivo de דבר dá continuidade à narrativa. “Falou” preserva a fórmula narrativa e distingue este verbo de אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição repetida no hebraico identifica separadamente os dois destinatários; em português, a coordenação com uma só preposição expressa isso de modo natural e inequívoco.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz convencionalmente o conteúdo da fala; “dizendo” preserva a estrutura do hebraico e prepara a citação seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” conserva o nome pessoal em transliteração, sem o substituir pelo título “Senhor”; “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A fórmula “falou... dizendo” foi mantida por corresponder à estrutura hebraica e ligar este versículo à fala que vem em seguida.
