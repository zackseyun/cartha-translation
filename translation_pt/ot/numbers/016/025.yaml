base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/025.yaml
  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: pt
  text: Então Moisés se levantou e foi até Datã e Abirão, e os anciãos de Israel foram atrás dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os anciãos de Israel o seguiram”. O hebraico diz mais literalmente “foram atrás dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O wayyiqtol de קום introduz a ação seguinte na narrativa. “Se levantou” é natural em português e preserva a ideia de levantar-se para agir.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: הלך pode significar “ir” ou “andar”; neste contexto, “foi” expressa naturalmente o deslocamento sem especificar o modo.
- source_word: אֶל
  choice: até
  rationale: A preposição indica movimento dirigido a pessoas. “Até” é idiomático neste contexto e comunica que Moisés foi ao encontro delas.
- source_word: דָּתָן וַאֲבִירָם
  choice: Datã e Abirão
  rationale: Formas tradicionais e amplamente reconhecíveis em português para estes nomes hebraicos.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: foram atrás dele
  rationale: A tradução mantém a estrutura hebraica, com o verbo “ir” seguido da expressão “atrás dele”, sem condensá-la obrigatoriamente em “seguiram-no”.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Tradução convencional e transparente da expressão construta que designa os líderes reconhecidos de Israel.
- source_word: וַ
  choice: Então / e
  rationale: O primeiro waw faz a narrativa avançar e é representado por “Então”; o segundo conecta ações coordenadas e é traduzido naturalmente por “e”.
