  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/048.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa a sequência no contexto, e “falou” preserva o sentido de דבר de modo natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “falou a Moisés” é uma construção clara e corrente em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico מֹשֶׁה.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o discurso direto. Em português atual, os dois-pontos cumprem essa função com mais naturalidade do que o decalque “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e segue uma transliteração acadêmica amplamente usada, enquanto a nota informa a substituição tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fórmula hebraica de introdução ao discurso foi vertida de modo natural por meio de dois-pontos, sem perda funcional.
