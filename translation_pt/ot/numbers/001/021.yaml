lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: A forma derivada de פקד refere-se, nesta fórmula censitária, às pessoas registradas e contadas. “Os recenseados” expressa isso de modo natural e conciso em português.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: A preposição לְ com מַטֶּה indica aqui vínculo ou pertencimento tribal; “da tribo de” reproduz naturalmente essa relação em português.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarenta e seis mil e quinhentos
  rationale: O número é apresentado na ordem corrente do português, preservando exatamente o total de 46.500.
