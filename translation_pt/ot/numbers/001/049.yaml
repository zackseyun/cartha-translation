  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: pt
  text: Porém, não recenseará a tribo de Levi, nem incluirá o número deles entre os filhos de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: Marca a exceção às instruções anteriores sobre o recenseamento; «somente» preserva sua força restritiva.
- source_word: מַטֵּה לֵוִי
  choice: a tribo de Levi
  rationale: No contexto do recenseamento, מַטֶּה designa uma tribo, não o sentido concreto de «bastão».
- source_word: תִפְקֹד
  choice: contará
  rationale: פקד, neste contexto censitário, significa contar ou recensear; «contará» é claro e mantém a formulação verbal do hebraico.
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: levantará o total deles
  rationale: A expressão pertence à linguagem de recenseamento. «Levantará o total» conserva algo da imagem hebraica de נשׂא, sem deixar obscuro o sentido de apuração numérica.
- source_word: בְּתוֹךְ
  choice: entre
  rationale: Indica inclusão no conjunto maior submetido ao recenseamento.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a expressão hebraica masculina plural e sua função tradicional como designação do povo.
theological_decisions:
- issue: Designação pactual de gênero בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: O hebraico diz literalmente «filhos de Israel» e usa a expressão como designação coletiva da nação. A tradução mantém a forma masculina sem restringir indevidamente sua referência coletiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura proibitiva foi mantida próxima do hebraico; «nem» liga naturalmente as duas ordens negativas. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
