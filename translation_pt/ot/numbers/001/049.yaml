review_pass:
  verdict: revise
  source_fidelity: A redação transmite corretamente a exceção relativa à tribo de Levi e sua não inclusão no recenseamento de Israel. Contudo, «levantarará o total deles» reproduz de modo demasiado literal uma expressão idiomática hebraica de recenseamento e não comunica com naturalidade a ação de registrar/incluir a contagem.
  naturalness: «Somente a tribo de Levi você não contará» é compreensível, mas a ordem marcada com «você» soa pouco natural no português bíblico moderno. «Levantar o total» não é uma colocação corrente nesse sentido. Uma formulação com «recensear» e «incluir o número» mantém o registro formal e é clara internacionalmente.
  terminology: «Tribo de Levi» e «filhos de Israel» são adequados e transparentes. «Recensear» corresponde bem a פקד no contexto censitário. «Incluir o número deles» expressa naturalmente o idiomatismo נשׂא ... רֹאשׁ, sem impor leitura teológica ou eliminar a relação com o censo.
  issues:
  - severity: medium
    issue: «levantará o total deles» é uma expressão pouco idiomática em português.
    rationale: Embora tente preservar a imagem de נשׂא, a construção não é uso natural para registrar uma contagem. O hebraico é um idiomatismo censitário; a tradução deve comunicar seu sentido de tomar/incluir o número.
  - severity: low
    issue: A posição de «você» em «a tribo de Levi você não contará» é desnecessariamente marcada.
    rationale: O hebraico antepõe o objeto para destacar a exceção, mas o português pode conservar a força exceptiva com «Porém» sem uma ordem que soe artificial.
  revised_text: Porém, não recenseará a tribo de Levi, nem incluirá o número deles entre os filhos de Israel.
