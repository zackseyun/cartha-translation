  text: וְ/אֵ֨ת כָּל הָ/עֵדָ֜ה הִקְהִ֗ילוּ בְּ/אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י וַ/יִּתְיַֽלְד֥וּ עַל מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/גֻלְגְּלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: pt
  text: Reuniram toda a comunidade no primeiro dia do segundo mês, e todos se registraram[a] segundo seus clãs e suas casas paternas, pela contagem dos nomes, de vinte anos para cima, cabeça por cabeça.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “declararam sua ascendência” ou “se inscreveram segundo sua genealogia”; o verbo hebraico é uma expressão genealógica rara que indica registro com base na descendência.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por seus crânios” ou “por suas cabeças”; expressão que indica que cada pessoa foi contada individualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְהִילוּ
  choice: Reuniram
  rationale: O hifil de קהל indica fazer reunir ou convocar. “Reuniram” é natural em português e preserva o sentido causativo no contexto.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel. “Comunidade” comunica com clareza o corpo coletivo sem sugerir apenas uma reunião local.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: no primeiro dia do segundo mês
  rationale: A fórmula calendárica hebraica significa idiomaticamente o primeiro dia do mês.
- source_word: וַיִּתְיַלְדוּ
  choice: se registraram
  rationale: O hitpael raro de ילד, neste contexto genealógico, descreve inscrição ou comprovação com base na descendência. “Se registraram” preserva a forma reflexiva e se ajusta ao contexto do recenseamento; a nota registra a nuance genealógica.
- source_word: עַל מִשְׁפְּחֹתָם
  choice: segundo seus clãs
  rationale: No contexto tribal, מִשְׁפָּחָה indica um agrupamento de parentesco equivalente ao clã.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo [...] suas casas paternas
  rationale: A expressão técnica designa as unidades de parentesco organizadas pela linhagem paterna. “Casas paternas” mantém a forma e o caráter social do hebraico.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: pela contagem dos nomes
  rationale: A expressão indica enumeração de indivíduos identificados nominalmente. A formulação conserva tanto a ideia de contagem quanto a referência aos nomes.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: É uma expressão portuguesa clara e corrente para o limite etário inclusivo indicado pelo hebraico.
- source_word: לְגֻלְגְּלֹתָם
  choice: cabeça por cabeça
  rationale: A expressão significa literalmente “por seus crânios/cabeças” e funciona como idioma para a contagem individual. “Cabeça por cabeça” preserva a imagem concreta sem perder o sentido.
