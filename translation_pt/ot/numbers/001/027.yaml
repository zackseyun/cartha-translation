base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/027.yaml
  text: Those counted from the tribe of Judah were seventy-four thousand six hundred[a].
translation:
  language: pt
  text: Os recenseados da tribo de Judá foram setenta e quatro mil e seiscentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os registrados”. O particípio hebraico usado nesta fórmula censitária admite ambas as traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: O particípio passivo de פקד, nesta fórmula censitária, designa as pessoas contadas ou registradas. “Os recenseados” é natural em português e preserva o sentido do censo sem acrescentar “homens”, termo não explícito neste versículo.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: A preposição לְ com מַטֶּה indica aqui vinculação tribal; “da tribo de” expressa essa relação de modo idiomático em português.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: setenta e quatro mil e seiscentos
  rationale: A ordem numérica hebraica é vertida segundo o uso corrente do português, sem alterar o valor total de 74.600.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia própria de um censo. A formulação mantém a concisão do hebraico e evita explicitar “homens”, informação presente no contexto mais amplo, mas não neste versículo.
