base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: pt
  text: Mas os levitas, segundo a tribo de seus pais[a], não foram contados entre eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “conforme sua linhagem ancestral”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não foram registrados” ou “não foram recenseados entre eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Mas os levitas
  rationale: O וְ tem valor adversativo no contexto, pois contrasta os levitas com as tribos anteriormente recenseadas; “levitas” é a forma tradicional e clara do nome tribal.
- source_word: לְמַטֵּה אֲבֹתָם
  choice: segundo a tribo de seus antepassados
  rationale: מַטֶּה significa “tribo” neste contexto censitário, e אֲבֹתָם, literalmente “seus pais”, indica a linhagem ancestral. A formulação mantém essa referência genealógica em português natural.
- source_word: לֹא הָתְפָּקְדוּ
  choice: não foram contados
  rationale: Neste contexto de recenseamento, o hitpael de פקד descreve a inclusão ou inscrição na contagem oficial. “Não foram contados” é claro e preserva o sentido contextual.
- source_word: בְּתוֹכָם
  choice: entre eles
  rationale: A expressão indica que os levitas não foram incluídos no conjunto das demais tribos recenseadas; “entre eles” comunica isso naturalmente.
