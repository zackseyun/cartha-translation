base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: pt
  text: 'Dos filhos de Judá, segundo as suas gerações, os seus clãs e as suas casas paternas, segundo o número dos nomes, de vinte anos para cima, todo homem apto a sair para a guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo homem que sai para a guerra”. A expressão hebraica refere-se aos homens qualificados para o serviço militar.
    reason: Preserva a formulação literal e esclarece o sentido idiomático militar da expressão hebraica.
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: Dos filhos de Judá
  rationale: בני significa literalmente “filhos de”, mas aqui designa os membros da tribo descendentes de Judá. A preposição portuguesa “dos” se ajusta à estrutura enumerativa do recenseamento.
- source_word: תּוֹלְדֹתָם
  choice: segundo seus registros genealógicos
  rationale: תולדות pode indicar gerações, descendência ou registros genealógicos. No contexto do recenseamento, a expressão comunica a organização segundo a genealogia sem reduzir o termo apenas a gerações cronológicas.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: משפחה designa aqui uma subdivisão social da tribo, mais ampla que a família nuclear; “clãs” expressa essa unidade com clareza.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: A expressão significa literalmente “casa de seus pais” e indica agrupamentos familiares definidos pela linhagem paterna. “Casas paternas” preserva essa estrutura histórica.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: conforme o número dos nomes
  rationale: A fórmula indica a contagem nominal dos indivíduos. A tradução mantém a imagem hebraica sem substituí-la por uma paráfrase como “contagem individual”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: É a fórmula do limite etário do recenseamento; a redação é corrente em português e conserva a abrangência a partir dos vinte anos.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todo homem que saía para a guerra
  rationale: A expressão significa literalmente “todo aquele que sai para o exército/a guerra”. O masculino é mantido porque o contexto trata dos homens em idade militar, enquanto a nota esclarece o sentido idiomático de aptidão para o serviço.
theological_decisions:
- issue: Linguagem masculina no recenseamento
  choice: todo homem que saía para a guerra
  alternative: todos os que estavam aptos para o serviço militar
  rationale: A construção hebraica é masculina e, no contexto, refere-se aos homens recenseados para a guerra. A tradução preserva esse dado histórico e gramatical, sem generalização neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a forma enumerativa do recenseamento e encerra com dois-pontos por depender do total apresentado no versículo seguinte.
