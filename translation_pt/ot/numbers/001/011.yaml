  text: 'De Benjamim: Abidã, filho de Gideoni.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/בִנְיָמִן
  choice: Para Benjamim
  rationale: O לְ prefixado introduz o representante da tribo nesta lista. “Para Benjamim” reproduz com concisão a relação representativa sem acrescentar explicitamente “tribo”, palavra ausente do hebraico.
- source_word: אֲבִידָן
  choice: Abidã
  rationale: Nome próprio transliterado segundo a forma tradicional e natural em português bíblico; a terminação hebraica é representada por “-dã”.
- source_word: בֶּן
  choice: filho de
  rationale: O substantivo em estado construto expressa filiação; “filho de” é a formulação portuguesa direta e corrente em listas de nomes.
- source_word: גִּדְעֹנִי
  choice: Gideoni
  rationale: Nome próprio transliterado de modo transparente e próximo do hebraico, sem traduzir seu possível sentido etimológico.
