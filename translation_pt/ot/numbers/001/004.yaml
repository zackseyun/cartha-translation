  yaml_path: translation/ot/numbers/001/004.yaml
  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: pt
  text: E estarão com vocês homens, um de cada tribo, cada um chefe de sua casa paterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chefe de sua casa ancestral”. A expressão hebraica, literalmente “casa de seus pais”, designa uma família ampliada ou um clã organizado segundo a linhagem paterna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִתְּ/כֶם
  choice: E com vocês
  rationale: Expressa naturalmente a companhia e a participação dos representantes junto a Moisés e Arão, preservando a ligação com o contexto anterior.
- source_word: יִהְיוּ
  choice: estará
  rationale: O imperfeito tem aqui força diretiva ou futura e, no singular distributivo da tradução, indica quem deverá acompanhar os destinatários.
- source_word: אִישׁ אִישׁ לַ/מַּטֶּה
  choice: um homem de cada tribo
  rationale: 'A repetição de אִישׁ tem sentido distributivo: um representante masculino para cada tribo. Esta formulação comunica o sentido com clareza em português atual.'
- source_word: מַטֶּה
  choice: tribo
  rationale: Neste contexto censitário e organizacional, o termo designa a unidade tribal, não um bastão literal.
- source_word: אִישׁ רֹאשׁ
  choice: cada um como chefe
  rationale: Reproduz a função distributiva e a construção apositiva, indicando que cada representante ocupava a posição principal em seu grupo ancestral.
- source_word: לְ/בֵית אֲבֹתָי/ו
  choice: da sua casa paterna
  rationale: Mantém a imagem hebraica e designa o agrupamento familiar ou clânico organizado pela linhagem paterna, sem reduzi-lo à família nuclear.
- source_word: הוּא
  choice: cada um
  rationale: O pronome enfático ou resumitivo é representado naturalmente pela retomada distributiva 'cada um', evitando uma repetição artificial em português.
