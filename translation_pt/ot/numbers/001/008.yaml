lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: De Issacar
  rationale: O לְ introduz a associação tribal na lista de representantes; em português, “De Issacar” é uma formulação natural e concisa, sem explicitar “tribo”, ausente do hebraico.
- source_word: נְתַנְאֵל
  choice: Natanael
  rationale: Nome próprio vertido segundo a forma bíblica tradicional e reconhecível em português, em vez de traduzir seu significado etimológico.
- source_word: בֶּן
  choice: filho de
  rationale: Na identificação genealógica, indica naturalmente filiação direta; o contexto não exige o sentido mais amplo de “descendente de”.
- source_word: צוּעָר
  choice: Zuar
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
