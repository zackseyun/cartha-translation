base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: pt
  text: Assim como Yahweh havia ordenado a Moisés, Moisés os recenseou[a] no deserto do Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os contou» ou «passou-os em revista». O verbo hebraico pode se referir ao alistamento ou à realização de um censo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Expressa a conformidade da ação de Moisés com a ordem divina e corresponde naturalmente à relação comparativa do hebraico.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa claro, no fluxo narrativo, que a ordem precedeu o recenseamento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: אֶת marca Moisés como objeto de צִוָּה; em português, o verbo 'ordenar' admite naturalmente a construção com objeto indireto para a pessoa que recebe a ordem.
- source_word: וַיִּפְקְדֵם
  choice: ele os contou
  rationale: No contexto do censo, פקד indica contar, registrar ou passar em revista; 'contou' é claro e acessível, enquanto a nota preserva alternativas relevantes.
- source_word: בְּמִדְבַּר סִינָי
  choice: no deserto do Sinai
  rationale: Traduz de modo natural a relação construta e emprega 'deserto', termo corrente em português para מִדְבָּר neste contexto geográfico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio; 'Yahweh' preserva diretamente esse nome sem substituí-lo pelo título 'SENHOR'.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações acompanha o hebraico sem soar artificial; a ambiguidade lexical de פקד é preservada em nota.
