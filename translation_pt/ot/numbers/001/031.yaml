  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os registrados
  rationale: O termo deriva de פקד e, nesta fórmula censitária, designa os que foram contados ou inscritos. “Os registrados” é natural em português moderno e mantém o sentido do censo sem explicitar além do necessário a dimensão militar indicada pelo contexto mais amplo.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: A construção com לְ e מַטֶּה indica pertencimento tribal nesta fórmula repetida. “Da tribo de” é idiomático e claro em português.
- source_word: זְבוּלֻן
  choice: Zebulom
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: '57.400'
  rationale: A expressão hebraica totaliza cinquenta e sete mil e quatrocentos. Algarismos e o separador de mil usual em português oferecem leitura imediata e preservam o total exato.
