  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: pt
  text: Façam um recenseamento[a] de toda a comunidade dos filhos de Israel[b], segundo os seus clãs e as suas casas paternas, pelo número dos nomes, todos os homens, um por um[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “levantem a cabeça de”; isto é, contem ou registrem para um recenseamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dos israelitas”. Literalmente: “dos filhos de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “pelas suas cabeças” ou “pelos seus crânios”; expressão idiomática que indica a contagem individual, pessoa por pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: Façam o recenseamento
  rationale: A expressão significa literalmente “levantem a cabeça de”, mas, neste contexto administrativo, é uma forma idiomática de ordenar a contagem ou o registro da população. “Façam o recenseamento” comunica com clareza seu sentido oficial.
- source_word: כָּל עֲדַת
  choice: toda a comunidade
  rationale: עֵדָה designa aqui o corpo coletivo de Israel. “Comunidade” é natural no português atual e preserva o sentido corporativo sem sugerir apenas uma reunião momentânea.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão filial masculina do hebraico e sua ligação explícita com o patriarca Israel, sem substituí-la no texto por um gentílico.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה refere-se aqui a subdivisões de parentesco dentro das tribos; “clãs” é mais preciso do que o sentido doméstico moderno de “famílias”.
- source_word: לְבֵית אֲבֹתָם
  choice: as suas casas paternas
  rationale: A expressão indica grupos de descendência organizados pela linhagem paterna. “Casas paternas” conserva essa estrutura social e permanece compreensível.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: contando nominalmente
  rationale: O hebraico descreve uma enumeração mediante nomes registrados. “Contando nominalmente” transmite o procedimento administrativo de forma natural, sem reduzir a ideia a uma contagem indistinta.
- source_word: כָּל זָכָר
  choice: todos os indivíduos do sexo masculino
  rationale: זָכָר especifica sexo masculino. A formulação é precisa e evita que “homens” seja entendido apenas como adultos, embora o contexto posterior delimite os recenseados por idade.
- source_word: לְגֻלְגְּלֹתָם
  choice: um por um
  rationale: Literalmente “pelos seus crânios/cabeças”, a expressão idiomática determina uma contagem individual. “Um por um” comunica claramente essa função em português, enquanto a nota preserva a imagem hebraica.
