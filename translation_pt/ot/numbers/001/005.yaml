  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּ/כֶ֑ם לִ/רְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/005.yaml
  text: 'And these are the names of the men who shall stand with you: for Reuben[a], Elizur son of Shedeur.'
translation:
  language: pt
  text: 'E estes são os nomes dos homens que estarão com vocês: por Rúben[a], Elizur, filho de Sedeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da tribo de Rúben, Elizur, filho de Sedeur”. A preposição hebraica pode indicar tanto filiação tribal quanto representação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: E estes são
  rationale: Mantém a conjunção que dá continuidade à lista e reproduz com naturalidade a fórmula hebraica de apresentação.
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: os nomes dos homens
  rationale: Reproduz a construção nominal hebraica e identifica corretamente representantes masculinos específicos.
- source_word: אֲשֶׁר יַעַמְדוּ אִתְּכֶם
  choice: que estarão com vocês
  rationale: O verbo עמד significa literalmente 'estar de pé', mas aqui, no contexto administrativo, indica acompanhar ou atuar ao lado de Moisés e Arão; a formulação portuguesa evita uma rigidez pouco natural sem acrescentar uma função não explicitada.
- source_word: לִרְאוּבֵן
  choice: por Rúben
  rationale: Expressa de modo conciso que Elizur representa a tribo de Rúben, preservando em nota a possibilidade de entender a preposição como procedência ou filiação tribal.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Transliteração tradicional e amplamente reconhecível do nome hebraico.
- source_word: בֶּן שְׁדֵיאוּר
  choice: filho de Sedeur
  rationale: Reproduz a fórmula genealógica hebraica em português natural, usando a forma portuguesa corrente do nome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A continuidade da enumeração foi mantida por “E”; “estarão com vocês” comunica naturalmente o sentido contextual de עמד sem eliminar seu valor relacional. Os nomes seguem formas portuguesas bíblicas correntes.
