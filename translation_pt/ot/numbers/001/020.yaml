  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: pt
  text: 'Os filhos de Rúben, o primogênito de Israel, segundo suas linhagens, seus clãs e suas casas paternas, conforme o número dos nomes, contados um por um[a] — todos os homens de vinte anos para cima, todos os que saíam para a guerra — foram:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “por seus crânios” ou “por suas cabeças”; expressão que indica que cada pessoa era contada individualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: O verbo introduz a fórmula do recenseamento, cuja contagem vem no versículo seguinte. Em português, ele é colocado no fim para formar uma frase natural e manter a ligação sintática com a continuação.
- source_word: בְנֵי רְאוּבֵן
  choice: Os filhos de Rúben
  rationale: Mantém a expressão genealógica concreta do hebraico; no contexto, refere-se aos descendentes tribais de Rúben.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: o primogênito de Israel
  rationale: Preserva a aposição que identifica Rúben e a relação formal expressa no hebraico.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No contexto genealógico do recenseamento, o termo indica linhas de descendência; “linhagens” é mais claro em português atual do que o literal “gerações”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: “Clãs” expressa a subdivisão tribal e a distingue das casas paternas mencionadas em seguida.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: Conserva a expressão técnica de parentesco e a organização familiar patriarcal do texto.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: conforme o número dos nomes
  rationale: Indica uma enumeração de pessoas identificadas nominalmente, mantendo de perto a formulação hebraica.
- source_word: לְגֻלְגְּלֹתָם
  choice: contados um por um[a]
  rationale: Traduz naturalmente o sentido idiomático de contagem individual, enquanto a nota preserva a imagem concreta do hebraico.
- source_word: כָּל זָכָר
  choice: todo homem
  rationale: No contexto do alistamento militar e seguido pela idade mínima, esta é uma formulação portuguesa natural para cada indivíduo do sexo masculino.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Reproduz de modo corrente a fórmula hebraica do limite mínimo de idade.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todo aquele que saía para a guerra
  rationale: Mantém o valor verbal do particípio hebraico e evita acrescentar explicitamente a ideia de capacidade ou aptidão, embora o contexto seja o serviço militar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla. A ordem da frase foi ajustada para acomodar o verbo וַיִּהְיוּ e preservar o caráter introdutório do versículo, que se completa com o total no versículo seguinte. Os travessões delimitam a qualificação dos recenseados sem eliminar a estrutura cumulativa da fórmula hebraica.
