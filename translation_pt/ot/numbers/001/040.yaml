base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: pt
  text: 'Quanto aos filhos de Aser, segundo suas gerações, por seus clãs e por suas casas paternas, conforme o número dos nomes, de vinte anos para cima, todos os que saem para a guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “todo o que sai para o exército”; expressão idiomática para os elegíveis ao serviço militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: Quanto aos filhos de Aser
  rationale: A preposição לְ introduz o cabeçalho tribal. “Filhos de Aser” preserva a linguagem filial e tribal do hebraico; “quanto aos” torna natural a introdução da fórmula censitária em português.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas gerações
  rationale: O termo indica as linhas de descendência ou divisões genealógicas. A tradução mantém a estrutura formal sem pressupor registros escritos.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: No contexto da enumeração tribal, מִשְׁפָּחָה designa unidades de parentesco abaixo da tribo; “clãs” é mais específico que “famílias”.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: Preserva a expressão social israelita e sua organização por casas ancestrais masculinas, em formulação corrente e digna em português.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: conforme o número dos nomes
  rationale: Expressa a contagem de indivíduos nominalmente e mantém de perto a fórmula hebraica.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Forma portuguesa natural e precisa para o limite etário inclusivo indicado pelo hebraico.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todos os que saíam para a guerra
  rationale: Mantém a imagem verbal do hebraico e o plural coletivo, sem acrescentar explicitamente “homens” onde o texto não usa um substantivo masculino equivalente; no contexto, refere-se aos aptos ao serviço militar.
