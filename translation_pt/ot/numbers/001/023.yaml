lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: No contexto do censo de Números 1, a forma derivada de פקד designa as pessoas contadas e registradas. “Os recenseados” transmite esse sentido com naturalidade, sem acrescentar aqui “homens”, embora o contexto anterior delimite o grupo.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Nesta fórmula censitária, לְ com מַטֶּה indica a vinculação tribal; “da tribo de” é a expressão idiomática adequada em português.
- source_word: שִׁמְעוֹן
  choice: Simeão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: cinquenta e nove mil e trezentos
  rationale: Reproduz exatamente o total hebraico em ordem numérica natural no português contemporâneo.
