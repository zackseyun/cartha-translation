translation_notes:
  register: Português moderno, claro e digno, com formulação concisa apropriada à sequência censitária. O sufixo pronominal de פְּקֻדֵיהֶם não recebe um possessivo explícito, pois “seus recenseados” seria pouco natural e potencialmente obscuro em português; o artigo definido preserva a referência anafórica no contexto.
