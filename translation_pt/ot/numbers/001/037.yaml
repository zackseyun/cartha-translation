lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: A forma derivada de פקד refere-se às pessoas contadas no recenseamento. “Os recenseados” é natural em português e mantém o sentido censitário sem acrescentar “homens”, termo não explícito neste versículo.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Nesta fórmula censitária, לְ com מַטֶּה indica pertencimento tribal. “Da tribo de” é a formulação corrente e clara em português.
- source_word: בִנְיָמִן
  choice: Benjamim
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: חֲמִשָּׁה וּשְׁלֹשִׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: trinta e cinco mil e quatrocentos
  rationale: Expressa em ordem numérica natural no português contemporâneo, preservando exatamente o total hebraico de 35.400.
