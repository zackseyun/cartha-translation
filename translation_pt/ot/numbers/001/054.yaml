source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: pt
  text: Assim, os filhos de Israel[a] fizeram conforme tudo o que Yahweh havia ordenado a Moisés; assim fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: fizeram
  rationale: O verbo עשה tem o sentido amplo de “fazer”. “Fizeram” é natural em português e preserva sua repetição enfática no fim do versículo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de perto a expressão hebraica masculina plural e também é uma designação coletiva reconhecível em português; a alternativa idiomática “os israelitas” é indicada em nota.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: Expressa tanto a conformidade com a ordem quanto sua abrangência total, em linguagem portuguesa clara e atual.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto esclarece naturalmente que a ordem divina precedeu a ação dos israelitas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Com o verbo português “ordenar”, a construção “ordenar algo a alguém” comunica que Moisés recebeu a ordem; o marcador hebraico אֶת identifica Moisés como objeto do verbo.
- source_word: כֵּן עָשׂוּ
  choice: assim fizeram
  rationale: Mantém a retomada enfática e a repetição estilística do hebraico, sem suavizar a conclusão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. “Yahweh” conserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Forma coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A tradução conserva a forma masculina plural do hebraico e sua designação tradicional do povo, enquanto a nota registra uma alternativa coletiva corrente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das ideias e a repetição final foram preservadas para refletir a ênfase do hebraico.
