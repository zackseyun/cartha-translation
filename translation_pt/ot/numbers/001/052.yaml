  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: pt
  text: Os filhos de Israel acamparão, cada homem junto ao seu acampamento e cada homem junto ao seu estandarte, segundo as suas divisões.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָנוּ
  choice: acamparão
  rationale: O perfeito qal com conjunção, neste contexto de instruções, tem valor futuro ou prescritivo. “Acamparão” preserva esse valor e soa natural em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Mantém de forma transparente a expressão hebraica e sua referência masculina, sem recorrer à formulação tradicional menos corrente “filhos de Israel” com sentido infantil.
- source_word: אִישׁ ... וְאִישׁ
  choice: cada homem ... e cada homem
  rationale: Preserva a repetição distributiva e o substantivo masculino singular explícito no hebraico.
- source_word: עַל מַחֲנֵהוּ
  choice: junto ao seu acampamento
  rationale: Neste contexto, עַל indica posição ou associação. “Junto ao” comunica a vinculação ao agrupamento designado sem definir com precisão indevida a relação espacial.
- source_word: דִּגְלוֹ
  choice: seu estandarte
  rationale: דֶּגֶל designa o estandarte identificador de uma unidade tribal ou militar. “Estandarte” é preciso, compreensível e evita o possível anacronismo de “bandeira”.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: A expressão indica a organização dos israelitas em agrupamentos ordenados, de caráter militar. “Divisões” comunica essa estrutura sem sugerir necessariamente combate ativo.
