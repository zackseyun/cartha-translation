  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: pt
  text: Estes são os recenseados[a] que Moisés, Arão e os líderes de Israel recensearam. Os líderes eram doze homens, um de cada casa paterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que foram contados” ou “os que foram registrados”. O hebraico pode destacar as pessoas recenseadas ou sua inclusão no censo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: os que foram contados
  rationale: O particípio passivo de פקד, neste contexto censitário, aponta principalmente para as pessoas contadas ou registradas, não apenas para um total abstrato.
- source_word: פָּקַד
  choice: contaram
  rationale: Em Números 1, o verbo se refere à realização do censo. “Contaram” é claro, atual e mantém a ligação lexical com “os que foram contados”.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: os líderes de Israel
  rationale: נָשִׂיא designa aqui os dirigentes tribais; “líderes” evita a conotação dinástica que “príncipes” poderia sugerir.
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: doze homens
  rationale: O hebraico emprega explicitamente o substantivo masculino אִישׁ; a tradução conserva essa referência.
- source_word: אִישׁ אֶחָד
  choice: um para cada
  rationale: 'A expressão tem força distributiva: havia um homem representando cada unidade ancestral.'
- source_word: לְבֵית אֲבֹתָיו
  choice: para cada casa paterna
  rationale: “Casa paterna” preserva a referência à unidade ancestral e patrilinear da organização tribal; a preposição “para” expressa a função representativa.
- source_word: הָיוּ
  choice: estavam com eles
  rationale: A forma verbal plural é explicitada como predicado dos doze líderes, em conformidade com a estrutura e o sentido do hebraico.
