revisions:
- from: Estes são os que foram contados[a], os quais Moisés e Arão contaram; e os líderes de Israel — doze homens, um para cada casa paterna — estavam com eles.
  to: Estes são os recenseados[a] que Moisés, Arão e os líderes de Israel recensearam. Os líderes eram doze homens, um de cada casa paterna.
  rationale: 'A revisão restaura a coordenação dos três agentes do recenseamento conforme o hebraico e traduz הָיוּ como a identificação dos líderes: eram doze homens. A divisão em duas frases torna explícito em português o antecedente de «eram», sem acrescentar a ideia de que os líderes apenas acompanhavam Moisés e Arão.'
