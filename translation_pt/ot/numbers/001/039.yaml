  text: Os recenseados da tribo de Dã foram sessenta e dois mil e setecentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: A forma derivada de פקד refere-se aos membros registrados e contados no recenseamento. “Os recenseados” expressa esse sentido de modo natural e conciso, sem acrescentar “homens”, já definido pelo contexto imediato.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Nesta fórmula censitária, לְ com מַטֶּה indica a afiliação tribal; “da tribo de” é a formulação idiomática em português.
- source_word: דָן
  choice: Dã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico דָן em português.
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף
  choice: sessenta e dois mil
  rationale: A ordem hebraica dos numerais é vertida segundo o uso natural do português contemporâneo.
- source_word: וּשְׁבַע מֵאוֹת
  choice: e setecentos
  rationale: Tradução direta da parcela final do numeral, ligada naturalmente ao total em português.
