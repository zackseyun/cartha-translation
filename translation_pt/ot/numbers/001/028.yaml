base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: pt
  text: 'Dos filhos de Issacar, segundo suas gerações, seus clãs e suas casas paternas, conforme o número dos nomes, de vinte anos para cima, todo homem apto para sair à guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo aquele que sai para o serviço militar”. Literalmente, “todo o que sai para o exército”; neste contexto, refere-se aos homens aptos para o serviço militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: Dos filhos de Issacar
  rationale: O לְ introduz o grupo tribal recenseado. “Filhos de Issacar” conserva a linguagem genealógica e masculina do hebraico, referindo-se aqui aos membros homens da tribo.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas gerações
  rationale: O termo designa linhas de descendência ou divisões geracionais. A formulação mantém a estrutura censitária sem pressupor especificamente registros genealógicos escritos.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: מִשְׁפָּחָה indica uma subdivisão de parentesco dentro da tribo; “clãs” é mais preciso nesse contexto do que o sentido moderno amplo de “famílias”.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: A expressão preserva a organização israelita por unidades familiares ancestrais estruturadas segundo a linhagem paterna.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: conforme o número dos nomes
  rationale: Mantém o idioma censitário hebraico, no qual as pessoas são contadas individualmente por nome.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: É uma expressão portuguesa natural para o limite etário inclusivo indicado pelo hebraico.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todo homem apto para sair à guerra
  rationale: Literalmente, a expressão fala de “todo aquele que sai para o exército/a guerra”. No contexto do recenseamento, refere-se aos homens em idade e condição de prestar serviço militar; “apto” comunica essa função sem eliminar a alternativa mais literal, registrada em nota.
theological_decisions:
- issue: Linguagem masculina do recenseamento militar
  choice: todo homem apto para sair à guerra
  alternative: todo aquele que saía para a guerra
  rationale: A construção hebraica é masculina e, neste contexto, o recenseamento abrange os homens com idade para o serviço militar. A tradução explicita corretamente esse referente, sem generalizá-lo para ambos os sexos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A cadência formal da fórmula censitária foi preservada, enquanto “de vinte anos para cima” evita rigidez desnecessária. O marcador foi colocado junto à expressão a que a nota se refere.
