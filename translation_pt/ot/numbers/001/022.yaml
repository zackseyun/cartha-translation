revisions:
- from: 'Dos filhos de Simeão, os recenseados[a], segundo suas linhagens, seus clãs e suas casas paternas, nominalmente, cabeça por cabeça[b]: todos os homens de vinte anos para cima, todos os que saíam para a guerra[c].'
  to: 'Para os filhos de Simeão, segundo suas linhagens, seus clãs e suas casas paternas, os seus recenseados, pelo número dos nomes, cabeça por cabeça: todo homem de vinte anos para cima, todos os que saem para a guerra.'
  rationale: A revisão conserva as escolhas lexicais centrais do rascunho, mas restaura a ordem da enumeração hebraica, explicita “pelo número dos nomes” e substitui o imperfeito “saíam” pelo presente formular “saem”. As notas foram ajustadas para corresponder exatamente ao texto revisto e para descrever a alternativa militar sem restringir indevidamente a ambiguidade do hebraico.
