base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: pt
  text: 'Para os filhos de Simeão, segundo suas linhagens, seus clãs e suas casas paternas, os seus recenseados, pelo número dos nomes, cabeça por cabeça: todo homem de vinte anos para cima, todos os que saem para a guerra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: Dos filhos de Simeão
  rationale: Mantém a ligação formal com o ancestral que dá nome à tribo e se ajusta ao contexto masculino do recenseamento.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No contexto genealógico e censitário, indica as linhas de descendência; “linhagens” comunica isso com mais precisão do que a tradução estritamente literal “gerações”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: Designa uma unidade de parentesco dentro da tribo; “clãs” distingue essa unidade das casas paternas mencionadas em seguida.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: Preserva a estrutura social patriarcal expressa pela fórmula hebraica sem recorrer ao menos preciso “famílias”.
- source_word: פְּקֻדָיו
  choice: os recenseados
  rationale: O particípio passivo de פקד refere-se aos inscritos ou contados no censo, embora o contexto também permita a nuance de convocação militar.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: nominalmente
  rationale: Expressa de modo natural em português a contagem feita pelos nomes individuais, preservando o caráter administrativo da fórmula.
- source_word: לְגֻלְגְּלֹתָם
  choice: cabeça por cabeça
  rationale: Conserva a imagem concreta do idioma hebraico e comunica uma contagem individual.
- source_word: כָּל זָכָר
  choice: todos os homens
  rationale: No contexto do limiar etário e do serviço de guerra, é uma formulação portuguesa natural para os indivíduos do sexo masculino contados.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Reproduz com clareza e naturalidade a fórmula hebraica que estabelece a idade mínima.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todos os que saíam para a guerra
  rationale: Mantém a expressão concreta do hebraico e sua possível referência tanto à participação quanto à elegibilidade militar, sem reduzi-la silenciosamente a “aptos para o serviço militar”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A enumeração administrativa do hebraico foi preservada, mas “nominalmente” evita a rigidez pouco natural de “pelo número dos nomes”. A pontuação organiza os níveis de classificação e a definição dos recenseados sem eliminar o caráter formular do versículo.
