  text: וַ/יִּקַּ֥ח מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן אֵ֚ת הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/017.yaml
  text: So Moses and Aaron took these men[a], who had been designated by name.
translation:
  language: pt
  text: Então Moisés e Arão tomaram consigo esses homens, que haviam sido designados pelo nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que haviam sido indicados pelo nome”, isto é, “que haviam sido identificados especificamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: reuniram
  rationale: Embora o sentido básico de לקח seja “tomar”, neste contexto Moisés e Arão convocam e incorporam os representantes já identificados. “Reuniram” expressa naturalmente essa ação em português sem acrescentar uma ideia de autoridade não explicitada.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moisés e Arão
  rationale: Empregam-se as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: esses homens
  rationale: A expressão refere-se aos homens específicos mencionados anteriormente. “Homens” preserva a referência masculina, sem substituir o termo por “líderes”, que seria uma explicitação contextual.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo natural em português para retomar “esses homens”.
- source_word: נִקְּבוּ
  choice: haviam sido designados
  rationale: O nifal de נקב, em combinação com “nomes”, indica identificação explícita ou designação. A forma mais-que-perfeita situa essa designação antes da ação de Moisés e Arão.
- source_word: בְּשֵׁמוֹת
  choice: nominalmente
  rationale: Traduz de modo natural a ideia idiomática de identificação pelo nome, preservando o caráter específico da designação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Reuniram” evita o pouco natural “tomaram esses homens”; “designados nominalmente” mantém o tom administrativo do contexto.
