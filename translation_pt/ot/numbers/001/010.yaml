  text: לִ/בְנֵ֣י יוֹסֵ֔ף לְ/אֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן עַמִּיה֑וּד לִ/מְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן פְּדָהצֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/010.yaml
  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: pt
  text: 'Dos filhos de José: de Efraim, Elisama, filho de Amiúde; de Manassés, Gamaliel, filho de Pedazur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Dos filhos de José
  rationale: A expressão introduz, na lista, as duas ramificações tribais derivadas de José. “Filhos” preserva a forma hebraica, enquanto “dos” soa natural em português no encadeamento da enumeração.
- source_word: לְאֶפְרַיִם
  choice: por Efraim
  rationale: A preposição לְ assinala a subdivisão tribal representada pelo homem nomeado. “Por Efraim” mantém a concisão e o paralelismo da lista sem acrescentar o interpretativo “tribo de”.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Transliteração tradicional e amplamente reconhecível em português do nome hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Reproduz naturalmente em português a relação de filiação expressa pelo estado construto hebraico.
- source_word: עַמִּיהוּד
  choice: Amiúde
  rationale: Forma portuguesa tradicional do nome hebraico, com acentuação gráfica que orienta a pronúncia.
- source_word: לִמְנַשֶּׁה
  choice: por Manassés
  rationale: Mantém o paralelismo com “por Efraim” e identifica de modo conciso a segunda ramificação tribal de José.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Transliteração tradicional e corrente em português.
- source_word: פְּדָהצוּר
  choice: Pedazur
  rationale: Transliteração portuguesa clara do nome hebraico, preservando seus principais elementos sonoros.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura enumerativa próxima do hebraico. Os nomes seguem formas portuguesas reconhecíveis; não foram acrescentadas expressões como “tribo de”, pois o contexto censitário já esclarece a referência.
