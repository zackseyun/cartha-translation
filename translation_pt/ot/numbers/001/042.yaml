  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: pt
  text: 'Os filhos de Naftali, segundo as suas gerações, pelos seus clãs, pelas casas de seus pais, conforme o número dos nomes, de vinte anos para cima, todos os aptos a sair para a guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “todos os que saem para o exército”. A expressão hebraica refere-se aos aptos para o serviço militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Os filhos de Naftali
  rationale: Preserva o sentido genealógico e masculino de בְּנֵי no contexto do recenseamento tribal.
- source_word: תּוֹלְדֹתָם
  choice: segundo as suas gerações
  rationale: Mantém a fórmula genealógica do hebraico e indica a organização segundo a descendência.
- source_word: לְמִשְׁפְּחֹתָם
  choice: pelos seus clãs
  rationale: Neste contexto tribal, מִשְׁפָּחָה designa uma subdivisão de parentesco mais ampla que a família nuclear moderna.
- source_word: לְבֵית אֲבֹתָם
  choice: pelas casas de seus pais
  rationale: Reproduz a expressão israelita para os agrupamentos familiares organizados pela linhagem paterna.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: conforme o número dos nomes
  rationale: Preserva a linguagem formal do recenseamento, no qual as pessoas eram enumeradas nominalmente.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Expressa de maneira natural e fiel o limite etário indicado pela fórmula hebraica.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todos os aptos a sair para a guerra
  rationale: A expressão significa literalmente os que saem para o exército ou para a guerra; no contexto do censo, refere-se à elegibilidade para o serviço militar. O plural concorda naturalmente com o cabeçalho coletivo do versículo.
