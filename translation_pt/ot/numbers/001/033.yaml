lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os registrados
  rationale: A forma derivada de פקד, com sufixo de terceira pessoa masculina plural, designa os que foram contados ou inscritos no recenseamento. “Os registrados” é claro e natural, sem explicitar além do hebraico a nuance militar presente no contexto mais amplo.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Nesta fórmula censitária, לְ com מַטֶּה indica a pertença tribal. “Da tribo de” expressa essa relação de modo idiomático em português.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarenta mil e quinhentos
  rationale: Reprodução direta do número cardinal, escrito por extenso para manter a fluidez e a dignidade da prosa bíblica.
