base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: pt
  text: 'Dos filhos de José, dos filhos de Efraim, segundo as suas gerações, os seus clãs e as suas casas paternas, conforme o número dos nomes, de vinte anos para cima, todo homem que sai para a guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo homem que sai para o serviço militar”. A expressão hebraica fala literalmente de sair para a guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: Dos filhos de José
  rationale: O לְ introduz o grupo tribal recenseado. “Filhos” conserva o idioma genealógico hebraico, embora aqui designe os descendentes tribais de José.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: dos filhos de Efraim
  rationale: Mantém a especificação paralela do ramo de Efraim dentro da casa de José e preserva a construção genealógica do hebraico.
- source_word: תּוֹלְדֹתָם
  choice: segundo as suas gerações
  rationale: Conserva a linguagem de linhagem e descendência da fórmula censitária sem pressupor que o termo se refira especificamente a documentos escritos.
- source_word: לְמִשְׁפְּחֹתָם
  choice: os seus clãs
  rationale: No contexto da organização tribal, מִשְׁפָּחָה indica um grupo de parentesco mais amplo que a família nuclear moderna; “clãs” comunica melhor essa unidade social.
- source_word: לְבֵית אֲבֹתָם
  choice: as suas casas paternas
  rationale: Reproduz a expressão técnica de parentesco e a organização das linhagens segundo as casas dos pais.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: conforme o número dos nomes
  rationale: Expressa a contagem individual nominal própria do recenseamento e permanece próxima da formulação hebraica.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Forma corrente e clara em português para o limite etário indicado pelo hebraico.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todo homem que saía para a guerra
  rationale: A fórmula se refere aos homens em idade de integrar a força militar. “Saía para a guerra” preserva o idioma concreto do hebraico, enquanto “todo homem” torna explícita a referência masculina exigida pelo contexto censitário.
theological_decisions:
- issue: Linguagem masculina do recenseamento
  choice: todo homem que saía para a guerra
  alternative: todos os que prestavam serviço militar
  rationale: O recenseamento enumera especificamente os homens em idade militar. A tradução mantém essa referência masculina, sem neutralizá-la, e preserva a imagem hebraica de sair para a guerra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura enumerativa e os dois-pontos preservam o caráter formular do recenseamento e sua continuação no versículo seguinte.
