  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: pt
  text: 'Quanto aos filhos de Dã, segundo suas linhagens, segundo seus clãs, segundo suas casas paternas, conforme o número dos nomes, de vinte anos para cima, todo homem apto a sair para a guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo homem apto para o serviço militar”. A expressão hebraica fala literalmente de sair para a guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: Quanto aos filhos de Dã
  rationale: A preposição ל introduz o grupo tribal nesta fórmula censitária. “Quanto aos” funciona como cabeçalho natural em português, enquanto “filhos de Dã” preserva a referência masculina e tribal do hebraico.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No contexto do censo, o termo se refere à descendência organizada genealogicamente; “linhagens” comunica isso com mais clareza em português atual do que o literal “gerações”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo seus clãs
  rationale: “Clãs” distingue as unidades tribais designadas por מִשְׁפָּחָה das “casas paternas” mencionadas em seguida.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo suas casas paternas
  rationale: Mantém a expressão técnica de parentesco e a organização patrilinear indicada pelo texto, sem reduzi-la simplesmente a “famílias”.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: conforme o número dos nomes
  rationale: Conserva a imagem hebraica da enumeração nominal dos indivíduos, em vez de substituí-la por uma paráfrase como “contagem individual”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Expressa de modo natural e preciso o limite etário inclusivo da fórmula censitária.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todo homem apto a sair para a guerra
  rationale: O contexto torna explícito que se trata dos homens elegíveis para o serviço militar. A formulação preserva a imagem idiomática hebraica de “sair” para a guerra, sem ocultar seu sentido funcional.
theological_decisions:
- issue: Linguagem masculina no censo militar
  choice: todo homem apto a sair para a guerra
  alternative: todos os aptos a sair para a guerra
  rationale: O censo trata especificamente dos membros masculinos da tribo em idade de serviço militar. A tradução mantém essa referência, em vez de neutralizá-la.
- issue: Sentido da expressão militar צָבָא
  choice: sair para a guerra
  alternative: prestar serviço militar
  rationale: A expressão pode designar a elegibilidade para o serviço militar, mas sua forma concreta fala de sair para a guerra. O texto principal preserva essa imagem, e a nota registra a alternativa funcional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “segundo” preserva o caráter formular do censo, enquanto “linhagens”, “clãs” e “casas paternas” mantêm distintos os níveis de organização genealógica.
