  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֚לֶּה קריאי הָ/עֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑/ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: pt
  text: Estes eram os convocados da comunidade[a], os líderes das tribos de seus antepassados, os chefes dos milhares de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os chamados da assembleia”. O particípio hebraico pode indicar pessoas chamadas, convocadas ou designadas.
    reason: lexical_alternative
  - marker: b
    text: “Milhares de Israel” pode referir-se literalmente a grupos de mil ou, de modo mais amplo, a subdivisões clânicas ou militares de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estes eram
  rationale: O demonstrativo plural identifica os homens mencionados, e o português expressa naturalmente a relação nominal com a cópula.
- source_word: קריאי הָעֵדָה
  choice: os convocados da comunidade
  rationale: O particípio passivo de קרא pode indicar os chamados, convocados ou designados; “convocados” é natural no contexto administrativo e “da comunidade” preserva a relação de construto sem afirmar além do hebraico se foram convocados dentre ela ou em nome dela.
- source_word: נְשִׂיאֵי
  choice: os líderes
  rationale: נָשִׂיא designa pessoas de posição elevada e autoridade tribal; “líderes” é claro, atual e não sugere necessariamente realeza.
- source_word: מַטּוֹת אֲבוֹתָם
  choice: das tribos de seus antepassados
  rationale: מַטֶּה pode significar tribo, e אָבוֹת aponta para a linhagem paterna ou ancestral. “Antepassados” comunica essa referência em português corrente sem restringi-la aos pais imediatos.
- source_word: רָאשֵׁי
  choice: os chefes
  rationale: A metáfora hebraica “cabeças” indica os principais responsáveis; “chefes” transmite a função de modo idiomático e evita a repetição de “líderes”.
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: dos milhares de Israel
  rationale: A tradução literal preserva a ambiguidade de אֶלֶף, que pode indicar grupos numericamente compostos de mil ou subdivisões clânicas ou militares.
- source_word: הֵם
  choice: eram
  rationale: O pronome independente final tem força identificadora e enfática, expressa naturalmente em português pela construção copulativa iniciada por “Estes eram”.
