  yaml_path: translation/ot/numbers/001/046.yaml
  text: So all those who were counted were six hundred three thousand five hundred and fifty[a].
translation:
  language: pt
  text: Assim, todos os recenseados foram seiscentos e três mil quinhentos e cinquenta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que foram contados” ou “os alistados”. O hebraico se refere aos registrados no recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Assim, ... foram
  rationale: O waw consecutivo com היה faz a narrativa avançar e apresenta o resultado total do recenseamento; “Assim” expressa naturalmente esse sentido conclusivo em português.
- source_word: כָּל
  choice: todos
  rationale: Preserva a abrangência do hebraico e concorda naturalmente com o particípio substantivado plural.
- source_word: הַפְּקֻדִים
  choice: os recenseados
  rationale: O particípio passivo de פקד designa os registrados e contados no recenseamento. “Os recenseados” é conciso, atual e não acrescenta explicitamente “homens”, embora o contexto identifique os alistados.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: seiscentos e três mil quinhentos e cinquenta
  rationale: Reproduz exatamente o valor numérico — 603.550 — segundo a forma idiomática de enunciar números por extenso em português, sem imitar de maneira rígida cada conjunção hebraica.
