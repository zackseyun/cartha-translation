reference: Numbers 1:53
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: pt
  text: Mas os levitas acamparão ao redor do tabernáculo do testemunho, para que não haja ira contra a comunidade dos filhos de Israel[a]; e os levitas manterão a guarda do tabernáculo do testemunho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre a comunidade dos filhos de Israel”.'
    reason: Alternativa lexical para a preposição עַל, que pode ser traduzida de modo mais formal como “sobre”, embora “contra” expresse melhor em português a direção da ira neste contexto.
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Mas os levitas
  rationale: A conjunção liga a ordem ao contraste com a disposição das demais tribos no contexto anterior; “Mas” expressa naturalmente essa relação discursiva.
- source_word: יַחֲנוּ סָבִיב
  choice: acamparão ao redor
  rationale: O imperfeito tem força diretiva nesse conjunto de instruções, e סָבִיב indica a posição em torno do tabernáculo.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: tabernáculo do testemunho
  rationale: “Tabernáculo” é o termo cultual consagrado e claro para מִשְׁכָּן; “testemunho” conserva a amplitude de עֵדוּת sem restringi-lo interpretativamente a um objeto específico.
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: para que não haja ira
  rationale: A formulação comunica a finalidade preventiva da ordem. “Ira” preserva a força judicial e cultual de קֶצֶף melhor que uma expressão mais branda como “zanga”.
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: contra a comunidade dos filhos de Israel
  rationale: “Comunidade” expressa o grupo constituído designado por עֵדָה; “filhos de Israel” mantém a forma filial explícita do hebraico. “Contra” apresenta de modo idiomático a direção da ira, enquanto a nota registra a alternativa mais formal para עַל.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: e ... manterão a guarda
  rationale: A combinação cognata de שׁמר e מִשְׁמֶרֶת designa a responsabilidade contínua de vigiar e cuidar do santuário; “manterão a guarda” preserva tanto o dever quanto a função protetora.
theological_decisions:
- issue: Natureza de קֶצֶף no contexto do santuário
  choice: ira
  alternative: indignação ou simples raiva
  rationale: No contexto cultual de Números, trata-se da possibilidade de juízo decorrente da violação dos limites sagrados. “Ira” mantém esse peso sem explicitar no texto que ela é divina, algo apenas implícito no contexto.
- issue: Sentido de הָעֵדֻת
  choice: testemunho
  alternative: documento da aliança
  rationale: O termo pode apontar para o testemunho da aliança guardado no santuário, mas o versículo não o especifica. A tradução preserva essa abertura sem impor uma identificação mais estreita.
- issue: Forma de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas ou povo de Israel
  rationale: A expressão hebraica é explicitamente filial. Sua conservação mantém a forma do original, embora as alternativas sejam mais idiomáticas em português.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com terminologia cultual estável. A ordem das orações e a repetição de “tabernáculo do testemunho” foram preservadas. O marcador da nota foi colocado junto à expressão a que a alternativa realmente se refere.
