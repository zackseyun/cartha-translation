  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: pt
  text: De vinte anos para cima, todos os homens aptos para sair à guerra em Israel; você e Arão os contarão segundo as suas unidades militares.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “segundo as suas divisões” ou “segundo os seus contingentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: De vinte anos para cima
  rationale: Expressa com naturalidade em português o limite mínimo de idade indicado pelo idioma hebraico.
- source_word: כָּל יֹצֵא צָבָא
  choice: todos os homens aptos para sair à guerra
  rationale: O particípio masculino singular tem força distributiva, e a expressão é um idiomatismo militar referente aos homens elegíveis para o serviço, conforme o contexto do recenseamento.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Tradução direta que preserva o sentido nacional e comunitário da expressão.
- source_word: תִּפְקְדוּ אֹתָם
  choice: os contarão
  rationale: Neste contexto censitário, פקד significa contar ou registrar para o serviço; “contar” é claro e corrente.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas unidades militares
  rationale: Indica o agrupamento organizado para o serviço militar. A formulação é clara sem recorrer ao arcaísmo “hostes”.
- source_word: אַתָּה וְאַהֲרֹן
  choice: você e Arão
  rationale: Preserva os agentes explicitamente destacados no hebraico e usa uma forma amplamente compreensível no português moderno.
theological_decisions:
- issue: Linguagem de gênero referente à elegibilidade militar
  choice: todos os homens aptos para sair à guerra
  alternative: todos os que saem à guerra
  rationale: O contexto do capítulo especifica homens contados para o serviço militar; a referência masculina é contextual, não uma generalização doutrinária.
- issue: Natureza da expressão יֹצֵא צָבָא
  choice: aptos para sair à guerra
  alternative: que saem à guerra
  rationale: O contexto é de elegibilidade para o serviço, não necessariamente de participação imediata numa campanha. “Aptos” explicita o valor idiomático sem eliminar a imagem hebraica de sair à guerra.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura mantém o destaque dado no hebraico a Moisés e Arão, evitando linguagem militar arcaica.
