  text: Those counted from the tribe of Asher were forty-one thousand five hundred.
translation:
  language: pt
  text: Os recenseados da tribo de Aser foram quarenta e um mil e quinhentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: A forma derivada de פקד, com sufixo de terceira pessoa masculina plural, refere-se às pessoas contadas e registradas no contexto do censo. “Os recenseados” preserva esse sentido de modo natural e não acrescenta explicitamente “homens” à fórmula deste versículo.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Nesta fórmula censitária, לְ com מַטֶּה indica a afiliação tribal. “Da tribo de” é idiomático em português e se ajusta ao contexto repetitivo de Números 1.
- source_word: אָשֵׁר
  choice: Aser
  rationale: Emprega-se a forma tradicional portuguesa do nome próprio hebraico, amplamente reconhecida nas traduções bíblicas em português.
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: quarenta e um mil e quinhentos
  rationale: Reproduz exatamente o valor numérico hebraico na ordem natural do português moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa apropriada à lista censitária. “Recenseados” mantém o campo semântico do censo, enquanto “foram” produz uma frase completa e natural em português.
