id: NUM.1.1
reference: Numbers 1:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: pt
  text: 'Yahweh falou a Moisés no deserto do Sinai, na tenda do encontro[a], no primeiro dia do segundo mês, no segundo ano depois que eles saíram da terra do Egito, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “tenda do encontro”; tradicionalmente, “tabernáculo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר introduz a fala divina na narrativa. “Falou” é natural em português e evita repetir “disse” antes da fórmula final.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּמִדְבַּר סִינַי
  choice: no deserto do Sinai
  rationale: מִדְבָּר designa uma região erma ou desértica; “deserto” é claro, corrente e geograficamente adequado em português.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: Reproduz de modo transparente os elementos אֹהֶל, “tenda”, e מוֹעֵד, aqui relacionado ao encontro designado, sem recorrer apenas ao termo tradicional “tabernáculo”.
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: no primeiro dia do segundo mês
  rationale: Explicita em português corrente o valor calendárico da expressão hebraica.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: no segundo ano
  rationale: Equivalente temporal direto e natural.
- source_word: לְצֵאתָם
  choice: depois que eles saíram
  rationale: Expressa de forma idiomática a relação temporal do infinitivo construto com o sufixo plural, cujo referente contextual é o povo de Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: da terra do Egito
  rationale: Mantém o substantivo אֶרֶץ, presente explicitamente no hebraico.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Preserva a fórmula hebraica que introduz o conteúdo da fala no versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título nem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Conserva-se “dizendo” por sua função de ligação com a fala que começa no versículo seguinte. O marcador [a] foi colocado junto à expressão que a nota explica.
source_grounding:
  english_pob_role: consult_only
