base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: pt
  text: 'Dos filhos de Zebulom, segundo suas linhagens, seus clãs e suas casas paternas, conforme o número dos nomes, de vinte anos para cima, todos os homens aptos para sair à guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aptos para o serviço militar”. A expressão hebraica significa literalmente “sair à guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: Dos filhos de Zebulom
  rationale: O ל introduz o grupo tribal nesta fórmula censitária. “Filhos de Zebulom” preserva a designação genealógica tradicional e a estrutura administrativa do contexto.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No contexto do censo, o termo aponta para descendência e organização genealógica; “linhagens” comunica isso com naturalidade em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: “Clãs” distingue as subdivisões extensas de parentesco das unidades domésticas menores.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: Mantém a expressão técnica de parentesco baseada na casa do pai, sem substituí-la pela noção mais ampla de ancestralidade.
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: conforme o número dos nomes
  rationale: Preserva a imagem hebraica da enumeração nominal, evitando a paráfrase mais interpretativa “contagem individual”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Forma corrente e clara em português para o limiar etário expresso no hebraico.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todos os homens ... aptos para sair à guerra
  rationale: O particípio masculino singular coletivo, no contexto deste censo militar, refere-se aos homens em condição de integrar o exército. A tradução conserva a imagem de sair à guerra e explicita a ideia contextual de aptidão.
theological_decisions:
- issue: Linguagem masculina no censo militar
  choice: todos os homens ... aptos para sair à guerra
  alternative: todos os aptos para o serviço militar
  rationale: O contexto censitário e militar tem referência masculina. A formulação escolhida preserva essa delimitação sem neutralizá-la e mantém a expressão concreta do hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia genealógica consistente. O verbo “foram contados” foi explicitado para completar naturalmente a fórmula elíptica do versículo em português; os dois-pontos preservam sua ligação com o total apresentado no versículo seguinte.
