  text: לִ/בְנֵ֣י מְנַשֶּׁ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֗וֹת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: pt
  text: 'Dos filhos de Manassés, segundo suas linhagens, seus clãs e suas casas paternas, pelo número dos nomes, de vinte anos para cima, todo homem que saía para o serviço militar[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo aquele que saía à guerra”. A expressão hebraica se refere aos homens aptos para o serviço militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: Dos filhos de Manassés
  rationale: O לְ introduz o cabeçalho tribal nesta fórmula censitária. “Dos filhos de Manassés” preserva tanto a construção elíptica do contexto quanto o sentido genealógico de בנים.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No contexto do censo, תולדות indica descendência e divisões genealógicas. “Linhagens” comunica isso com clareza sem reduzir o termo a gerações cronológicas.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: מִשְׁפָּחָה designa aqui uma subdivisão de parentesco dentro da tribo; “clãs” é mais preciso do que “famílias” no uso moderno.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: A expressão mantém a estrutura social e genealógica israelita, sendo compreensível em português bíblico atual.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: pelo número dos nomes
  rationale: A formulação expressa a contagem nominal dos indivíduos e conserva a linguagem formal do censo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: É uma forma natural e fiel de exprimir o limite mínimo de idade indicado pelo idioma hebraico.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todo homem que saía para o serviço militar
  rationale: A expressão se refere aos homens em idade e condição de participar do serviço militar. A tradução conserva a imagem verbal de “sair” e explicita o referente masculino exigido pelo contexto censitário.
theological_decisions:
- issue: Linguagem de gênero no censo militar
  choice: todo homem que saía para o serviço militar
  alternative: todo aquele que saía para o serviço militar
  rationale: O contexto trata do recenseamento militar dos israelitas do sexo masculino a partir dos vinte anos; “todo homem” preserva essa referência sem neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se a estrutura elíptica da fórmula censitária e os dois-pontos finais, pois o enunciado prossegue no versículo seguinte.
