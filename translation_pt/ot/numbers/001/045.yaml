  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: pt
  text: Assim, todos os que foram recenseados dentre os filhos de Israel[a], segundo as suas casas paternas, de vinte anos para cima, todos os capazes de sair para a guerra em Israel[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”; essa forma foi mantida porque o recenseamento está organizado explicitamente em termos masculinos e militares.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os aptos para o serviço militar”. Literalmente, “todo aquele que sai para o serviço militar”; é uma expressão idiomática para os que podem ir à guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Assim, ...
  rationale: O wayyiqtol de היה dá continuidade à narrativa e introduz o resumo do recenseamento; “Assim” transmite bem esse valor conclusivo.
- source_word: כָּל פְּקוּדֵי
  choice: todos os contados
  rationale: Preserva tanto a abrangência de כָּל como o sentido passivo/resultativo de פקד no contexto de recenseamento militar.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma masculina do hebraico, relevante neste recenseamento explicitamente militar, sem substituí-la no texto principal por um gentílico genérico.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo suas casas paternas
  rationale: Expressa a organização patrilinear do recenseamento e conserva a imagem social concreta do hebraico.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Formulação portuguesa natural e precisa para o limite etário indicado pelo hebraico.
- source_word: כָּל יֹצֵא צָבָא
  choice: todos os aptos a sair para a guerra
  rationale: Torna explícita a elegibilidade implícita no contexto e preserva a imagem idiomática de “sair” para a atividade militar.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Tradução direta e natural da expressão locativa/corporativa.
