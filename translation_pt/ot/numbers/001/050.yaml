  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: pt
  text: Mas você, encarregue os levitas do tabernáculo do testemunho[a], de todos os seus utensílios e de tudo o que lhe pertence. Eles carregarão o tabernáculo e todos os seus utensílios, prestarão serviço nele[b] e acamparão ao redor do tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “habitação do testemunho”. O termo hebraico pode designar uma habitação, especialmente o santuário portátil onde estava o testemunho.
    reason: lexical_alternative
  - marker: b
    text: Ou “o servirão” ou “cuidarão dele”. O verbo indica serviço e, neste contexto, tem sentido ligado ao serviço sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mas você
  rationale: A conjunção assume valor contrastivo diante da distinção feita entre os levitas e as demais tribos; o pronome explícito mantém a ênfase dirigida a Moisés.
- source_word: הַפְקֵד ... עַל
  choice: encarregue ... de
  rationale: O imperativo hifil de פקד, seguido de עַל, comunica atribuição formal de responsabilidade. A construção portuguesa é natural e preserva esse sentido administrativo.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: tabernáculo do testemunho
  rationale: “Tabernáculo” é o termo cultual estabelecido para a habitação sagrada portátil; o complemento “do testemunho” preserva a construção hebraica e sua referência à realidade pactual guardada no santuário.
- source_word: כֵּלָיו
  choice: seus utensílios
  rationale: כֵּלִים abrange objetos, instrumentos e peças usados no tabernáculo. “Utensílios” é claro, amplo e adequado ao contexto cultual.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tudo o que lhe pertence
  rationale: Reproduz de forma natural a relação de pertencimento ou associação expressa pelo hebraico, sem restringir indevidamente os objetos envolvidos.
- source_word: יִשְׂאוּ
  choice: carregarão
  rationale: נשא descreve aqui o transporte físico do tabernáculo e de seus utensílios durante os deslocamentos.
- source_word: יְשָׁרְתֻהוּ
  choice: prestarão serviço nele
  rationale: O piel de שרת indica serviço, particularmente com nuance sagrada neste contexto. A formulação mantém essa nuance e verte naturalmente o sufixo pronominal em português.
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: acamparão ao redor do tabernáculo
  rationale: Expressa com clareza tanto a disposição periférica do acampamento quanto a força diretiva do imperfeito no contexto das instruções divinas.
theological_decisions:
- issue: Terminologia cultual de מִשְׁכָּן
  choice: tabernáculo
  alternative: habitação
  rationale: “Tabernáculo” identifica com precisão o santuário portátil sem eliminar a ideia lexical de habitação; a alternativa é registrada em nota para preservar a amplitude do termo.
- issue: Natureza do serviço expresso por שרת
  choice: prestarão serviço nele
  alternative: o servirão; cuidarão dele
  rationale: A escolha comunica serviço sagrado sem atribuir aos levitas uma função sacerdotal mais específica do que o próprio versículo declara.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fala direta a Moisés usa “você” sem arcaísmo; a sintaxe preserva a ênfase contrastiva e as responsabilidades levíticas, evitando linguagem denominacional.
