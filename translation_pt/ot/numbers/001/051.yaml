  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: pt
  text: Quando o tabernáculo partir, os levitas o desmontarão; e, quando o tabernáculo acampar, os levitas o montarão. E a pessoa não autorizada[a] que se aproximar será morta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o estranho» ou «a pessoa de fora». O hebraico se refere, neste contexto, a quem não tem autorização para se aproximar do santuário.
    reason: alternativa lexical e esclarecimento contextual
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: Quando ... partir
  rationale: A preposição ב com o infinitivo construto de נסע forma uma oração temporal. “Quando ... partir” expressa de modo natural o início do deslocamento.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo consagrado em português para o santuário portátil designado por מִשְׁכָּן.
- source_word: יוֹרִידוּ אֹתוֹ
  choice: o desmontarão
  rationale: Neste contexto, o hifil de ירד se refere a baixar e desarmar a estrutura para transportá-la; “desmontar” comunica precisamente a ação prática.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Forma padrão para a designação dos encarregados autorizados do serviço do santuário.
- source_word: וּבַחֲנֹת
  choice: quando ... acampar
  rationale: O infinitivo de חנה introduz a situação temporal oposta à partida. “Acampar” preserva a imagem do deslocamento e da parada do tabernáculo com o acampamento.
- source_word: יָקִימוּ אֹתוֹ
  choice: o montarão
  rationale: O hifil de קום significa aqui erguer ou instalar novamente o tabernáculo; “montar” corresponde naturalmente a “desmontar”.
- source_word: וְהַזָּר
  choice: a pessoa não autorizada
  rationale: Em contexto sacerdotal, זָר indica alguém alheio à função sagrada autorizada, não necessariamente um estrangeiro étnico. A formulação explicita esse sentido contextual sem restringi-lo indevidamente a todo não levita.
- source_word: הַקָּרֵב
  choice: que se aproximar
  rationale: O particípio de קרב descreve quem chega perto do âmbito sagrado proibido; “se aproximar” é claro e mantém a fórmula de advertência.
- source_word: יוּמָת
  choice: será morta
  rationale: O hofal de מות é passivo-causativo e indica morte infligida, não apenas morte como consequência espontânea. A forma passiva não especifica o agente.
theological_decisions:
- issue: Natureza da pena em יוּמָת
  choice: 'pena passiva/judicial: “será morta”'
  alternative: 'consequência: “morrerá”'
  rationale: A forma hofal normalmente indica que a morte é infligida. A tradução preserva a advertência legal ligada à santidade sem identificar se o agente é humano ou divino.
- issue: Referente de זָר
  choice: pessoa não autorizada para se aproximar do serviço do santuário
  alternative: estrangeiro étnico ou, de modo estrito, qualquer não levita
  rationale: No contexto do tabernáculo, o termo marca quem está fora da função sagrada autorizada. A escolha evita transformar a restrição cultual em distinção étnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo “desmontarão/montarão” reproduz com clareza as ações opostas. O marcador [a] aparece junto da expressão que explica.
