base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: pt
  text: 'Dos filhos de Gade[a], segundo suas gerações, seus clãs[b] e suas casas paternas, conforme o número dos nomes, de vinte anos para cima, todos os que saem para o serviço militar[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Gade”. A expressão se refere aos membros masculinos da tribo contados no censo.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “suas famílias”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “todo aquele que sai para o exército”; também pode ser entendido como “todo aquele que sai para a guerra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: Dos filhos de Gade
  rationale: A preposição ל introduz o grupo tribal nesta fórmula censitária. “Filhos de Gade” preserva o idioma hebraico e indica os membros masculinos da tribo recenseados.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas gerações
  rationale: O termo se refere à descendência ou organização genealógica; a tradução mantém a fórmula sem pressupor registros escritos.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: “Clãs” expressa melhor as subdivisões de parentesco dentro da tribo do que o moderno “famílias”.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: Preserva a expressão técnica de parentesco e a estrutura patriarcal explicitamente presente no hebraico.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: conforme o número dos nomes
  rationale: Mantém a imagem hebraica de uma enumeração feita nominalmente, sem expandi-la para “um por um”.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: É uma formulação portuguesa natural para o limiar etário expresso no hebraico.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todos os que saíam para o serviço militar
  rationale: A expressão descreve os que participavam da atividade militar. A tradução evita acrescentar explicitamente “aptos”, noção plausível no contexto, mas não lexicalizada no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura formal adequada à fórmula censitária. “Casas paternas” conserva a terminologia social antiga; “serviço militar” comunica o sentido contextual sem tornar a frase excessivamente arcaica.
