lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: O termo, derivado de פקד, refere-se aos homens registrados e contados no recenseamento. “Os recenseados” é natural em português e preserva o contexto censitário.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Nesta fórmula do recenseamento, לְ com מַטֶּה indica a vinculação tribal. “Da tribo de” expressa essa relação de modo claro e idiomático.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: O nome próprio é transliterado em sua forma corrente nas traduções bíblicas em português.
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף
  choice: cinquenta e três mil
  rationale: A quantidade é apresentada na ordem numérica natural do português contemporâneo.
- source_word: וְאַרְבַּע מֵאוֹת
  choice: e quatrocentos
  rationale: A parcela final do total é traduzida diretamente, com a conjunção exigida pelo uso natural do português.
