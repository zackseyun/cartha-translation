lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados
  rationale: A forma derivada de פקד, com sufixo de terceira pessoa masculina plural, designa neste contexto censitário os que foram contados ou registrados. “Os recenseados” preserva esse sentido sem acrescentar explicitamente “homens”, ausente da fórmula deste versículo.
- source_word: לְמַטֵּה
  choice: da tribo de
  rationale: Nesta fórmula do censo, לְ com מַטֶּה indica a afiliação tribal. “Da tribo de” é natural em português e se integra bem à estrutura da frase.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: cinquenta e quatro mil e quatrocentos
  rationale: Expressa a quantidade hebraica exata na ordem numérica corrente do português contemporâneo.
