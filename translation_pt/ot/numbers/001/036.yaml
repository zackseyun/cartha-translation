base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: pt
  text: 'Dos filhos de Benjamim, segundo suas linhagens, seus clãs e suas casas paternas, conforme o número dos nomes, de vinte anos para cima, todos os que podem sair para a guerra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “todo o que sai para o serviço militar”; expressão que designa os elegíveis para a guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: Dos filhos de Benjamim
  rationale: O ל introduz o grupo tribal nesta fórmula censitária. A tradução preserva a linguagem filial masculina e funciona naturalmente como continuação da lista.
- source_word: תּוֹלְדֹתָם
  choice: segundo suas linhagens
  rationale: No contexto do censo, o termo se refere à descendência organizada por linhas genealógicas; “linhagens” comunica isso com clareza sem impor linguagem burocrática.
- source_word: לְמִשְׁפְּחֹתָם
  choice: seus clãs
  rationale: “Clãs” distingue essas subdivisões tribais das casas paternas mencionadas em seguida.
- source_word: לְבֵית אֲבֹתָם
  choice: suas casas paternas
  rationale: Mantém de modo transparente o termo israelita de parentesco e a estrutura familiar patriarcal expressa no hebraico.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: conforme o número dos nomes
  rationale: Reproduz a fórmula de enumeração nominal do texto sem expandi-la para “um por um”, sentido possível, mas não explicitado aqui.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Expressa de maneira natural em português o limite mínimo de idade indicado pela construção hebraica.
- source_word: כֹּל יֹצֵא צָבָא
  choice: todos os aptos para servir no exército
  rationale: Traduz o valor idiomático da expressão no contexto de um censo militar, preservando na nota a formulação mais literal.
