  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: pt
  text: Então o sacerdote Eleazar tomará um pouco do sangue dela com o dedo e aspergirá um pouco do sangue dela sete vezes em direção à frente da tenda do encontro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante da tenda do encontro”. A expressão hebraica indica orientação em direção à frente da tenda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw seguido de qatal, nesta sequência de instruções rituais, expressa o passo seguinte; o futuro em português comunica naturalmente o valor prescritivo.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: o sacerdote Eleazar
  rationale: Mantém o nome transliterado e apresenta o título em ordem natural no português.
- source_word: מִדָּמָהּ
  choice: um pouco do sangue dela
  rationale: O prefixo מִן tem valor partitivo; “dela” retoma a novilha do contexto anterior. A repetição foi preservada nas duas ocorrências para manter a ênfase ritual do hebraico.
- source_word: בְּאֶצְבָּעוֹ
  choice: com o dedo
  rationale: A preposição בְּ tem sentido instrumental aqui; esta formulação é clara e idiomática em português.
- source_word: וְהִזָּה
  choice: e aspergirá
  rationale: נזה é o verbo ritual usual para aspergir sangue ou água; “aspergir” conserva o registro cultual sem deixar de ser compreensível.
- source_word: אֶל נֹכַח פְּנֵי
  choice: em direção à parte da frente de
  rationale: A expressão indica orientação para a frente ou face da tenda, não necessariamente uma ação realizada dentro dela.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução transparente da designação do santuário, preferível ao termo mais interpretativo “tabernáculo”.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Correspondência direta e natural da expressão numérica hebraica.
