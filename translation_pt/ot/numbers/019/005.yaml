  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: pt
  text: E queimará a vaca diante dos olhos dele; queimará o couro, a carne e o sangue dela, junto com o excremento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: E queimará
  rationale: O qatal com waw integra a sequência prescritiva do ritual; o futuro do indicativo expressa naturalmente a instrução legal em português.
- source_word: הַפָּרָה
  choice: a vaca
  rationale: פָּרָה designa um bovino fêmea. “Vaca” é claro e atual; o contexto anterior já fornece as demais características do animal.
- source_word: לְעֵינָיו
  choice: diante dos olhos dele
  rationale: Preserva a imagem concreta do hebraico e indica que a queima deve ocorrer à vista da pessoa mencionada no contexto.
- source_word: עֹרָהּ
  choice: o couro
  rationale: Em referência à cobertura externa de um animal, “couro” corresponde naturalmente a עוֹר e se distingue da carne.
- source_word: בְּשָׂרָהּ
  choice: a carne
  rationale: בָּשָׂר, neste contexto animal e sacrificial, é traduzido de modo direto e corrente por “carne”.
- source_word: דָּמָהּ
  choice: o sangue dela
  rationale: Tradução direta de דָּם com o sufixo feminino; “dela” evita qualquer ambiguidade de referência.
- source_word: עַל פִּרְשָׁהּ
  choice: junto com o excremento
  rationale: פֶּרֶשׁ indica excremento, e עַל tem aqui valor de adição ou acompanhamento na lista do que será queimado.
- source_word: יִשְׂרֹף
  choice: queimará
  rationale: O imperfeito possui força prescritiva na legislação ritual. Sua repetição conserva a moldura enfática do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura formal adequada à legislação ritual. A repetição de “queimará” preserva a ênfase e o enquadramento sintático do hebraico. Não se acrescentou nota sobre “novilha”, pois פָּרָה não exige a ideia de juventude e “vaca” comunica adequadamente o referente em português.
