  naturalness: O registro é claro, moderno e apropriado ao caráter jurídico-ritual do texto. «Estrangeiro residente que reside entre eles» mantém de modo natural a repetição deliberada do hebraico melhor do que «que vive entre eles».
  terminology: «Novilha», «impuro», «filhos de Israel» e «estatuto permanente» são escolhas adequadas. «Impuro» deve ser entendido no sentido ritual do contexto, sem conotação necessária de culpa moral.
  issues:
