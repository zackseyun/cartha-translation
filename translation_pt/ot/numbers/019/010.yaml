  to: Aquele que recolher as cinzas da novilha lavará as suas roupas e ficará impuro até o entardecer. Isso será um estatuto permanente[b] para os filhos de Israel[a] e para o estrangeiro residente que reside entre eles.
  rationale: A revisão restringe-se a aumentar a precisão temporal de עֶרֶב, preservar mais claramente a repetição presente em גֵּר הַגָּר e posicionar a nota b junto da expressão que ela esclarece. Não altera o sentido jurídico-ritual nem resolve além do texto o alcance de «permanente».
