    issue: «Até a tarde» é menos preciso do que o hebraico.
    rationale: עֶרֶב designa a chegada da noite/entardecer. Em português, «a tarde» pode abranger uma faixa anterior do dia; «até o entardecer» é mais específico e natural.
  - severity: low
    issue: A nota b está ancorada após «eles», e não junto a «estatuto permanente», que é a expressão explicada.
    rationale: O marcador deve acompanhar a expressão a que a nota lexical se refere.
  - severity: low
    issue: «Que vive entre eles» não reflete tão bem a repetição de גֵּר / הַגָּר.
    rationale: «Estrangeiro residente que reside entre eles» preserva a condição de residente e o eco verbal do hebraico, sem sacrificar a legibilidade.
