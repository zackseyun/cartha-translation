  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: pt
  text: Aquele que recolher as cinzas da novilha lavará as suas roupas e ficará impuro até o entardecer. Isso será um estatuto permanente[b] para os filhos de Israel[a] e para o estrangeiro residente que reside entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para os israelitas” ou “para o povo de Israel”. O hebraico diz literalmente “para os filhos de Israel”, uma expressão corporativa da aliança.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida como “estatuto permanente” também pode ser traduzida como “estatuto perpétuo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹסֵף
  choice: aquele que recolher
  rationale: O particípio qal com artigo funciona como substantivo e designa a pessoa que realiza a ação; esta formulação é natural em português jurídico e preserva o sentido participial.
- source_word: אֵפֶר הַפָּרָה
  choice: as cinzas da novilha
  rationale: אֵפֶר tem sentido coletivo e é expresso naturalmente no plural em português; פָּרָה indica um bovino fêmea, e “novilha” mantém a precisão exigida pelo contexto ritual.
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: lavará as suas roupas
  rationale: No contexto das leis de pureza, o verbo se refere à lavagem das vestes. O futuro expressa com naturalidade a determinação legal hebraica.
- source_word: וְטָמֵא
  choice: e ficará impuro
  rationale: A expressão indica o estado resultante de impureza ritual, não culpa ou corrupção moral; “ficará impuro” torna essa mudança de estado clara.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Equivalente português claro e próximo da construção hebraica com artigo.
- source_word: וְהָיְתָה
  choice: Isso será
  rationale: O pronome retoma a prescrição ritual precedente e explicita o referente implícito do verbo feminino singular.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Preserva a forma masculina plural e a expressão corporativa da aliança presente no hebraico, sem impedir que o referente seja o conjunto do povo.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: e para o estrangeiro residente que vive entre eles
  rationale: גֵּר designa um não israelita estabelecido no meio da comunidade. “Estrangeiro residente” preserva sua condição, e “que vive entre eles” comunica naturalmente o particípio repetido.
- source_word: לְחֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: חֻקָּה é uma norma estabelecida, enquanto עוֹלָם, nesta fórmula legal, indica duração contínua ou indefinida no âmbito da aliança.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução mantém a forma da expressão corporativa hebraica, gramaticalmente masculina, sem negar que ela se refira ao povo de Israel como um todo.
- issue: Linguagem de impureza ritual
  choice: ficará impuro
  alternative: ficará ritualmente impuro; ficará imundo
  rationale: “Impuro” expressa a condição cerimonial tratada no capítulo sem sugerir necessariamente falha moral; inserir “ritualmente” no texto seria explicativo demais.
- issue: Duração de חֻקַּת עוֹלָם
  choice: estatuto permanente
  alternative: estatuto perpétuo
  rationale: “Permanente” preserva a força duradoura da fórmula legal sem resolver além do texto questões sobre seu alcance temporal; “perpétuo” continua sendo uma tradução possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o tom jurídico-ritual do original sem arcaísmos desnecessários. Os marcadores de nota foram colocados junto às expressões que explicam.
