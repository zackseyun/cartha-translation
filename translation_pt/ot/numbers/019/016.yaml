base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: pt
  text: E todo aquele que, em campo aberto,[a] tocar em alguém morto à espada, ou em um cadáver,[b] ou em um osso humano,[c] ou em uma sepultura, ficará impuro durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “sobre a face do campo”, expressão que significa estar em campo aberto.
    reason: lexical_alternative
  - marker: b
    text: Ou “em uma pessoa morta”.
    reason: lexical_alternative
  - marker: c
    text: Hebraico, “em um osso de ser humano”; aqui o sentido é genérico, não especificamente masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: E todo aquele que... tocar
  rationale: A construção distributiva com oração relativa estabelece uma regra geral; esta formulação preserva o alcance universal e o valor casuístico.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: Expressa naturalmente o idioma hebraico, literalmente 'sobre a face do campo', indicando um lugar ao ar livre.
- source_word: בַּחֲלַל חֶרֶב
  choice: em alguém morto à espada
  rationale: חָלָל designa alguém morto ou traspassado, e חֶרֶב identifica a arma; a expressão portuguesa é clara e concisa.
- source_word: אוֹ בְמֵת
  choice: ou em um cadáver
  rationale: מֵת pode designar uma pessoa morta ou seu corpo; 'cadáver' é preciso e adequado ao contexto das leis de impureza.
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: ou em um osso humano
  rationale: אָדָם tem aqui sentido genérico, referente a restos humanos, sem especificação de sexo.
- source_word: אוֹ בְקָבֶר
  choice: ou em uma sepultura
  rationale: קֶבֶר designa sepultura, túmulo ou local de enterro; 'sepultura' é uma equivalência direta e amplamente compreensível.
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: ficará impuro durante sete dias
  rationale: O verbo descreve o estado de impureza ritual resultante do contato; o futuro comunica naturalmente a consequência jurídica.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: humano
  alternative: de homem
  rationale: No contexto, a palavra qualifica restos de qualquer ser humano, não especificamente de uma pessoa do sexo masculino.
- issue: Natureza da impureza expressa por יִטְמָא
  choice: ficará impuro
  alternative: será impuro
  rationale: A formulação preserva a categoria ritual do texto sem acrescentar uma explicação interpretativa ao versículo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe jurídica clara. A pontuação mantém unidos o verbo 'tocar' e seus objetos, enquanto as notas registram o idioma hebraico e alternativas lexicais genuínas.
