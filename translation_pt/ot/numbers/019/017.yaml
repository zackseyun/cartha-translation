  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: pt
  text: Para a pessoa impura, tomarão um pouco do pó resultante da queima da oferta de purificação[a], e alguém porá, numa vasilha, água corrente sobre ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais tradicionalmente, “oferta pelo pecado”. Em contextos sacerdotais, o termo hebraico pode designar uma oferta relacionada tanto ao pecado quanto à purificação ritual.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “água viva”, isto é, água de fonte ou de corrente.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקְחוּ
  choice: tomarão
  rationale: O perfeito qal com waw, neste contexto de instrução legal, tem força prescritiva ou futura; a forma plural do sujeito é preservada.
- source_word: לַטָּמֵא
  choice: para a pessoa impura
  rationale: O adjetivo substantivado designa quem se encontra em estado de impureza ritual; “pessoa impura” é claro e não restringe o referente por gênero.
- source_word: מֵעֲפַר
  choice: um pouco do pó
  rationale: עפר significa propriamente “pó” ou matéria pulverulenta, enquanto a preposição מן tem sentido partitivo; evita-se substituir silenciosamente o termo hebraico pelo tradicional “cinzas”.
- source_word: שְׂרֵפַת
  choice: resultante da queima
  rationale: A construção expressa a queima da oferta; “resultante da queima” esclarece naturalmente que o pó é o resíduo desse processo.
- source_word: הַחַטָּאת
  choice: oferta de purificação
  rationale: No contexto sacerdotal, חטאת pode nomear uma oferta cuja função é remover impureza ritual. A tradução tradicional “oferta pelo pecado” permanece indicada em nota.
- source_word: וְנָתַן
  choice: e alguém porá
  rationale: A mudança do plural para o singular é preservada como agente singular indefinido, sem atribuir a ação a uma pessoa não identificada pelo texto.
- source_word: עָלָיו
  choice: sobre ele
  rationale: O pronome retoma naturalmente o pó mencionado; o masculino concorda com “pó” em português.
- source_word: מַיִם חַיִּים
  choice: água corrente
  rationale: A expressão literal “águas vivas” designa água proveniente de uma fonte ativa ou em fluxo. “Água corrente” comunica o sentido ritual em português atual, e a forma literal é registrada em nota.
- source_word: אֶל כֶּלִי
  choice: numa vasilha
  rationale: A preposição indica que a mistura é feita dentro de um recipiente; “vasilha” mantém um tom concreto e adequado ao contexto ritual.
theological_decisions:
- issue: Sentido de חטאת no rito da novilha vermelha
  choice: oferta de purificação
  alternative: oferta pelo pecado
  rationale: O contexto imediato trata da remoção de impureza ritual, de modo que a tradução funcional evita reduzir o termo à culpa moral. A alternativa tradicional continua visível em nota, preservando a amplitude lexical.
- issue: Sentido da expressão מַיִם חַיִּים
  choice: água corrente
  alternative: água viva
  rationale: O uso ritual aponta para água de uma fonte ativa ou em movimento. A tradução principal comunica esse referente sem eliminar a expressão literal, preservada em nota por sua ressonância bíblica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o caráter prescritivo da lei, conserva a mudança hebraica de agente plural para singular indefinido e explica em notas as duas expressões de maior ambiguidade lexical.
