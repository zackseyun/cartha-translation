base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: pt
  text: Então o sacerdote lavará as suas roupas e banhará o seu corpo em água. Depois, entrará no acampamento[a], mas o sacerdote ficará impuro[b] até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “poderá entrar no acampamento”. A forma hebraica pode indicar a reentrada permitida depois da lavagem exigida.
    reason: lexical_alternative
  - marker: b
    text: “Impuro” refere-se aqui à impureza ritual, não necessariamente a pecado pessoal ou culpa moral.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lavará as suas roupas
  rationale: O piel de כבס indica lavar peças de roupa. O futuro expressa naturalmente, em português, a instrução de um procedimento legal.
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: banhará o corpo em água
  rationale: Neste contexto ritual, בשר designa o corpo da pessoa. “Banhará” evita repetir “lavará” e comunica a lavagem corporal.
- source_word: וְאַחַר יָבֹא אֶל־הַמַּחֲנֶה
  choice: Depois, entrará no acampamento
  rationale: A expressão marca a etapa seguinte do procedimento. “Entrará” reproduz o valor prospectivo da forma hebraica sem decidir no texto principal se ela indica simples sequência ou permissão.
- source_word: וְטָמֵא הַכֹּהֵן
  choice: mas o sacerdote ficará impuro
  rationale: טמא descreve aqui um estado de impureza ritual temporária. A repetição de “o sacerdote” acompanha a ênfase do hebraico.
- source_word: עַד הָעָרֶב
  choice: até o entardecer
  rationale: Expressão portuguesa natural para o limite temporal indicado por עֶרֶב, preservando a ideia de que o estado dura até a chegada da tarde/noite.
theological_decisions:
- issue: Natureza da impureza
  choice: impureza ritual temporária
  alternative: culpa moral ou pecado pessoal
  rationale: No contexto de Números 19, טמא indica uma condição cerimonial ligada ao rito, não necessariamente culpa moral. O texto mantém “impuro”, e a nota esclarece o sentido cultural.
- issue: Entrada no acampamento após a lavagem
  choice: “entrará”, preservando no texto a sequência procedural
  alternative: “poderá entrar”, explicitando permissão
  rationale: O imperfeito hebraico pode ser lido como a ação seguinte prescrita ou como reentrada permitida após a lavagem. A tradução principal evita resolver excessivamente essa nuance, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com futuro do indicativo adequado ao estilo de instrução legal. “Roupas”, “corpo” e “acampamento” favorecem clareza ampla; “entardecer” exprime com naturalidade o limite ritual.
