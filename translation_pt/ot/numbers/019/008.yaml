  text: וְ/הַ/שֹּׂרֵ֣ף אֹתָ֔/הּ יְכַבֵּ֤ס בְּגָדָי/ו֙ בַּ/מַּ֔יִם וְ/רָחַ֥ץ בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/טָמֵ֖א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: pt
  text: Quem a queimar lavará as suas roupas com água e banhará o seu corpo com água[a]; ficará impuro[b] até o entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na água”, nas duas ocorrências. O hebraico traz literalmente “na água”.'
    reason: lexical_alternative
  - marker: b
    text: “Impuro” refere-se aqui à impureza ritual, não necessariamente à culpa moral.
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: Aquele que a queimou
  rationale: O particípio substantivado designa a pessoa responsável pela queima; em português, o pretérito é natural neste ponto do procedimento. O pronome feminino retoma a novilha.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavará suas roupas
  rationale: O imperfeito tem força prescritiva na legislação ritual. “Roupas” é corrente e claro.
- source_word: בַּמַּיִם
  choice: com água
  rationale: Embora a construção hebraica possa ser vertida literalmente por “na água”, em português “com água” exprime naturalmente o meio empregado na lavagem e no banho.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: e banhará o corpo
  rationale: “Banhar” preserva a distinção lexical em relação à lavagem das roupas; בשר designa aqui o corpo da pessoa.
- source_word: וְטָמֵא
  choice: ficará impuro
  rationale: A forma expressa o estado ritual resultante. “Impuro” é conciso e adequado ao contexto sacerdotal.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Tradução próxima da expressão hebraica, sem especificar interpretativamente o pôr do sol.
theological_decisions:
- issue: Terminologia de impureza ritual
  choice: impuro
  alternative: ritualmente impuro; contaminado
  rationale: טמא indica aqui uma condição ritual, não necessariamente culpa moral. A nota explicita essa distinção sem ampliar o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com formulação prescritiva adequada à legislação ritual. Os marcadores foram posicionados junto aos termos que esclarecem.
