review_pass:
  verdict: revise
  source_fidelity: A forma verbal “queimou” apresenta a ação como passada e concluída, enquanto o particípio hebraico substantivado designa a pessoa que realiza a queima no procedimento ritual. “Quem a queimar” preserva melhor a formulação legal e prospectiva. “Até o entardecer” comunica com maior precisão moderna o hebraico עַד הָעָרֶב do que “até a tarde”.
  naturalness: A redação é clara, mas “banhará o corpo” soa menos natural e pode perder a referência possessiva explícita do hebraico. “Banhará o seu corpo” é fluente e preciso.
  terminology: “Impuro” é uma equivalência adequada para טָמֵא neste contexto, e a nota esclarece corretamente que se trata de impureza ritual, não de culpa moral. “Com água” é idiomático em português; a nota preserva a alternativa mais literal “na água”.
  issues:
  - severity: medium
    issue: Tempo/aspecto de “Aquele que a queimou”
    rationale: O perfeito português descreve uma queima já realizada; o particípio hebraico identifica o agente no âmbito da instrução. “Quem a queimar” é uma formulação jurídica natural que evita essa mudança aspectual.
  - severity: low
    issue: “até a tarde”
    rationale: Embora tradicional em versões bíblicas, em uso moderno pode sugerir apenas o período vespertino. “Até o entardecer” representa mais claramente o limite temporal indicado por עֶרֶב, sem impor “pôr do sol”.
  - severity: low
    issue: Referência possessiva em “banhará o corpo”
    rationale: O hebraico diz literalmente “a sua carne/corpo”. Acrescentar “seu” torna a referência explícita e mais natural em português.
  revised_text: Quem a queimar lavará as suas roupas com água e banhará o seu corpo com água[a]; ficará impuro[b] até o entardecer.
  revised_footnotes:
