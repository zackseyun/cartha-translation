revisions:
- from: Aquele que a queimou lavará suas roupas com água e banhará o corpo com água[a]; ficará impuro[b] até a tarde.
  to: Quem a queimar lavará as suas roupas com água e banhará o seu corpo com água[a]; ficará impuro[b] até o entardecer.
  rationale: A revisão ajusta o agente da queima à formulação prescritiva do particípio hebraico, explicita a referência possessiva em “o seu corpo” e substitui “até a tarde” por “até o entardecer”, mais claro para o limite ritual indicado no texto. As notas e seus marcadores permanecem adequados e completos.
