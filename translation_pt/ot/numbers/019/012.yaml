  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: pt
  text: Ele se purificará com ela no terceiro dia e no sétimo dia[a], e ficará puro; mas, se não se purificar no terceiro dia e no sétimo dia[b], não ficará puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, com a água para a purificação preparada anteriormente neste capítulo.
    reason: cross_reference
  - marker: b
    text: 'Ou: “se limpar”. O verbo hebraico se refere aqui ao processo de purificação ritual da impureza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: se purificará / se purificar
  rationale: No hitpael e neste contexto ritual, o verbo indica submeter-se à purificação da impureza, não purificar-se do pecado. A forma reflexiva portuguesa preserva o valor verbal sem importar uma noção de perdão moral.
- source_word: בּוֹ
  choice: com ela
  rationale: O pronome retoma naturalmente a água da purificação mencionada antes. O feminino concorda com “água” em português, embora o referente permaneça implícito no texto principal.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: Tradução temporal natural e próxima da construção hebraica.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: e no sétimo dia
  rationale: Preserva a coordenação e a sequência ritual exigida pelo texto.
- source_word: יִטְהָר
  choice: ficará puro
  rationale: Expressa o estado de pureza resultante e distingue טהר do ato de purificação indicado por יתחטא.
- source_word: וְאִם לֹא
  choice: mas, se não
  rationale: A conjunção introduz aqui uma condição contrastante; esta formulação comunica naturalmente a advertência.
- source_word: הוּא
  choice: Ele
  rationale: Preserva o pronome masculino singular explícito, que no contexto se refere à pessoa impura mencionada anteriormente.
theological_decisions:
- issue: Natureza da linguagem de purificação em Números 19
  choice: Empregar linguagem de pureza ritual, sem convertê-la em perdão moral ou santificação interior.
  alternative: Usar linguagem espiritual generalizada, como “ser limpo” sem deixar claro o contexto ritual.
  rationale: O contexto trata da impureza causada pelo contato com um morto e da água prescrita para a purificação. Os verbos descrevem a condição ritual da pessoa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ficará puro” diferencia o resultado ritual do ato reflexivo “se purificar”. Todos os marcadores de nota aparecem no texto principal.
