  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: pt
  text: Então o sacerdote pegará madeira de cedro, hissopo e fio escarlate, e os lançará no meio da queima da novilha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da vaca”. O termo hebraico designa um bovino fêmea e também pode ser traduzido por “vaca”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Então ... pegará
  rationale: O waw com qatal dá continuidade à sequência ritual prescrita. “Então” explicita a progressão, e o futuro em português exprime naturalmente a determinação legal.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Equivalente corrente de כֹּהֵן no contexto cultual, preservando o artigo definido.
- source_word: עֵץ אֶרֶז
  choice: madeira de cedro
  rationale: Reproduz naturalmente em português a construção hebraica e deixa claro que se trata do material.
- source_word: וְאֵזוֹב
  choice: hissopo
  rationale: Equivalente bíblico tradicional e reconhecível, embora a identificação botânica exata da planta permaneça incerta.
- source_word: וּשְׁנִי תוֹלָעַת
  choice: fio escarlate
  rationale: A expressão designa material tingido de escarlate; “fio escarlate” é claro no contexto de um objeto ritual sem literalizar indevidamente a referência à fonte do corante.
- source_word: וְהִשְׁלִיךְ
  choice: e os lançará
  rationale: O hiphil de שלך indica lançar. O pronome plural explicita de modo natural em português que os três elementos serão lançados.
- source_word: אֶל תּוֹךְ
  choice: no meio de
  rationale: Preserva a noção de entrada no interior ou centro do processo de queima, mais específica que um simples “na”.
- source_word: שְׂרֵפַת הַפָּרָה
  choice: a queima da novilha
  rationale: שְׂרֵפָה indica a queima ou o processo de queimar, e פָּרָה designa um bovino fêmea. “Novilha” é a designação consagrada e natural em português para este rito.
theological_decisions:
- issue: Tradução de פָּרָה no rito de purificação da vaca vermelha
  choice: novilha
  alternative: vaca
  rationale: O hebraico designa um bovino fêmea sem necessariamente fixar sua idade. “Novilha” preserva a terminologia bíblica tradicional em português, enquanto “vaca” é uma alternativa lexical mais ampla; a nota registra essa possibilidade sem alterar o sentido ritual.
translation_notes:
  register: Português moderno, claro e digno, com formulação ritual-prescritiva. A ordem dos elementos e a ênfase espacial do hebraico foram preservadas sem rigidez sintática.
