  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: pt
  text: Quem tocar no cadáver de qualquer pessoa ficará impuro por sete dias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no corpo de uma pessoa morta”; mais literalmente, “no morto”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “de toda pessoa humana”, isto é, de qualquer ser humano.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: Quem tocar
  rationale: O particípio com artigo tem função substantivada e sentido genérico. “Quem tocar” expressa naturalmente em português a força geral da norma.
- source_word: בְּמֵת
  choice: no corpo morto
  rationale: מֵת designa literalmente uma pessoa morta ou o morto. “Corpo morto” torna claro o referente concreto no contexto de impureza ritual, sem usar o termo mais técnico “cadáver” no texto principal.
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: de qualquer ser humano
  rationale: A expressão especifica que se trata de qualquer pessoa humana. “Ser humano” preserva o alcance genérico de אָדָם sem sugerir que a norma se limita ao sexo masculino.
- source_word: וְטָמֵא
  choice: ficará impuro
  rationale: A forma verbal apresenta a impureza como consequência do contato. “Ficará impuro” é natural e claro em português, preservando o sentido jurídico do enunciado.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A preposição “durante” explicita de modo idiomático que a expressão indica a duração do estado de impureza.
theological_decisions:
- issue: Tradução de אָדָם em contexto jurídico genérico
  choice: ser humano
  alternative: homem; pessoa
  rationale: Neste contexto, אָדָם abrange qualquer humano, não apenas indivíduos do sexo masculino. “Ser humano” comunica com precisão o alcance universal da norma.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o caráter geral e jurídico da prescrição, ao mesmo tempo que esclarece o referente humano e a duração da impureza.
