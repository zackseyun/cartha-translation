review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o contato com um cadáver humano, a necessidade de purificação ritual, a profanação do tabernáculo, a sanção e a permanência da impureza. Contudo, «eliminada» tende a especificar indevidamente a fórmula hebraica וְנִכְרְתָה («será cortada/extirpada»), cujo mecanismo permanece não definido. A aposição «num morto — no corpo...» também precisa de ajuste sintático para refletir claramente o hebraico.
  naturalness: O registro é geralmente claro e moderno. «Tocar num morto — no corpo de uma pessoa que morreu» soa truncado em português, pois o segundo membro não se liga naturalmente ao primeiro. «Água para a impureza» é excessivamente ambígua, podendo sugerir água destinada a produzir impureza; uma redação que indique sua função ritual é mais clara.
  terminology: «Tabernáculo de Yahweh», «purificar», «impura» e «impureza» são apropriados ao contexto ritual. «Água de purificação» é a expressão portuguesa estabelecida e inteligível; a nota deve preservar que o hebraico diz literalmente «água de impureza». A sanção deve conservar a formulação tradicional sem decidir entre morte, exclusão comunitária ou juízo divino.
  issues:
  - severity: medium
    issue: «Essa pessoa será eliminada de Israel» para וְנִכְרְתָה ... מִיִּשְׂרָאֵל
    rationale: «Eliminada» pode sugerir mais diretamente a morte ou remoção definitiva. «Será cortada do meio de Israel» mantém a fórmula de sanção e sua ambiguidade interpretativa.
  - severity: medium
    issue: Aposição «num morto — no corpo de uma pessoa que morreu»
    rationale: A construção é pouco natural e pode dar a entender uma localização («no corpo»). «Num morto, isto é, no corpo de uma pessoa que morreu» torna explícita a aposição sem alterar o referente.
  - severity: low
    issue: «Água para a impureza»
    rationale: Em português, a expressão é ambígua quanto à finalidade da água. «Água de purificação», acompanhada de nota sobre o literal hebraico, comunica com clareza a função ritual e preserva a informação lexical relevante.
  revised_text: Todo aquele que tocar num morto, isto é, no corpo de uma pessoa que morreu, e não se purificar terá contaminado o tabernáculo de Yahweh; essa pessoa será cortada do meio de Israel. Pois a água de purificação[a] não foi aspergida sobre ela, continuará impura; sua impureza ainda está nela.
  revised_footnotes:
