revisions:
- from: Todo aquele que tocar num morto — no corpo de uma pessoa que morreu — e não se purificar terá contaminado o tabernáculo de Yahweh; essa pessoa será eliminada de Israel. Visto que a água para a impureza[a] não foi aspergida sobre ela, continuará impura; sua impureza ainda está nela.
  to: Todo aquele que tocar num morto, isto é, no corpo de uma pessoa que morreu, e não se purificar terá contaminado o tabernáculo de Yahweh; essa pessoa será cortada do meio de Israel. Pois a água de purificação[a] não foi aspergida sobre ela, continuará impura; sua impureza ainda está nela.
  rationale: A revisão melhora a ligação da aposição referente ao cadáver humano, substitui uma formulação potencialmente interpretativa da sanção por uma equivalente mais literal e preserva a ambiguidade de כרת. Também usa a expressão portuguesa ritual mais transparente para מֵי נִדָּה, enquanto a nota mantém o literal hebraico e explica o seu uso.
  reviewer_model: gpt-5.6-terra
