source:
  edition: WLC
  text: כָּֽל הַ/נֹּגֵ֡עַ בְּ/מֵ֣ת בְּ/נֶפֶשׁ֩ הָ/אָדָ֨ם אֲשֶׁר יָמ֜וּת וְ/לֹ֣א יִתְחַטָּ֗א אֶת מִשְׁכַּ֤ן יְהוָה֙ טִמֵּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/יִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא זֹרַ֤ק עָלָי/ו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥/וֹ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: pt
  text: Todo aquele que tocar num morto, isto é, no corpo de uma pessoa que morreu, e não se purificar terá contaminado o tabernáculo de Yahweh; essa pessoa será cortada do meio de Israel. Pois a água de purificação[a] não foi aspergida sobre ela, continuará impura; sua impureza ainda está nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, «água de impureza», isto é, a água usada para remover a impureza causada pelo contato com um cadáver.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: tocar num morto
  rationale: Expressa de modo direto e natural o contato físico indicado por נגע; a frase seguinte esclarece que se trata de um cadáver humano.
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: no corpo de uma pessoa que morreu
  rationale: Neste contexto de impureza causada por cadáver, נֶפֶשׁ designa concretamente a pessoa morta ou seu corpo. 'Pessoa' transmite o uso genérico de אָדָם sem sugerir que a regra se limite ao sexo masculino.
- source_word: יִתְחַטָּא
  choice: se purificar
  rationale: O hitpael de חטא aqui se refere à purificação ritual, não ao arrependimento moral.
- source_word: מִשְׁכַּן יְהוָה
  choice: o tabernáculo de Yahweh
  rationale: מִשְׁכָּן é a habitação sagrada ou tabernáculo; 'Yahweh' representa o nome divino יהוה sem substituí-lo por um título.
- source_word: טִמֵּא
  choice: terá contaminado
  rationale: O piel indica que a pessoa torna o santuário ritualmente impuro. 'Contaminado' comunica com clareza essa profanação cultual.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: essa pessoa será eliminada
  rationale: Preserva a força da fórmula de sanção כרת sem determinar se seu mecanismo é morte, exclusão comunitária ou juízo divino.
- source_word: מֵי נִדָּה
  choice: a água para a impureza
  rationale: Mantém a ligação lexical com נִדָּה e indica que se trata da água empregada no tratamento ritual da impureza, sem sugerir que a própria água seja impura.
- source_word: זֹרַק עָלָיו
  choice: não foi aspergida sobre ela
  rationale: A aspersão é a ação ritual indicada pelo verbo; a construção passiva acompanha o sentido contextual do hebraico.
- source_word: טָמֵא יִהְיֶה
  choice: continuará impura
  rationale: O estado declarado é persistente, como confirma a oração final; o feminino concorda naturalmente com 'pessoa' em português.
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: sua impureza ainda está nela
  rationale: Conserva tanto a ideia de continuidade de עוֹד quanto a imagem de a impureza permanecer na pessoa.
theological_decisions:
- issue: Sentido da sanção expressa por כרת
  choice: essa pessoa será eliminada de Israel
  alternative: essa pessoa será morta / será excluída da comunidade
  rationale: O versículo não define o modo exato da sanção. A formulação escolhida preserva sua gravidade e sua ambiguidade jurídica e teológica.
- issue: Natureza da impureza
  choice: vocabulário explícito de purificação e impureza ritual
  alternative: linguagem de perdão moral ou de pecado pessoal
  rationale: O contexto trata do estado ritual decorrente do contato com um cadáver; não se deve convertê-lo silenciosamente em culpa moral.
- issue: Referência genérica de אָדָם
  choice: uma pessoa
  alternative: um homem / um ser humano
  rationale: אָדָם é genérico neste contexto. 'Pessoa' é fiel ao alcance universal da norma e soa natural em português, sem restringi-la aos homens.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O travessão explicita a aposição hebraica sem alterar seu conteúdo. Emprega-se 'tabernáculo' como termo cultual reconhecível e 'Yahweh' como representação do nome divino.
