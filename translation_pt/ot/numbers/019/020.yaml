id: NUM.19.20
reference: Numbers 19:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: pt
  text: Mas o homem que se tornar impuro e não se purificar, essa pessoa será eliminada do meio da assembleia[a], pois profanou o santuário de Yahweh. A água para a purificação[b] não foi aspergida sobre ele; ele está impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “essa alma será eliminada”. Nesta fórmula legal hebraica, “alma” pode designar a pessoa inteira.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a água da impureza”; tradicionalmente, “a água da separação”. Refere-se à água de purificação preparada neste capítulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: o homem
  rationale: Preserva a forma masculina singular do hebraico, que neste contexto legal funciona de modo representativo.
- source_word: יִטְמָא
  choice: se tornar impuro
  rationale: Expressa a entrada em um estado de impureza ritual, sem sugerir necessariamente culpa moral ativa.
- source_word: יִתְחַטָּא
  choice: se purificar
  rationale: No contexto ritual, o hitpael de חטא indica submeter-se à purificação, e não pecar no sentido moral comum.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: essa pessoa será eliminada
  rationale: נפש designa aqui a pessoa inteira; 'será eliminada' conserva a fórmula judicial sem definir o mecanismo da pena.
- source_word: מִתּוֹךְ הַקָּהָל
  choice: do meio da assembleia
  rationale: Reflete de perto a expressão preposicional hebraica e o caráter comunitário e jurídico de קהל.
- source_word: מִקְדַּשׁ יְהוָה
  choice: o santuário de Yahweh
  rationale: מקדש é o espaço sagrado, e o nome divino explícito no texto hebraico é transliterado como Yahweh.
- source_word: טִמֵּא
  choice: profanou
  rationale: No contexto do santuário, comunica que a impureza da pessoa violou a santidade cultual do lugar; é uma formulação natural em português.
- source_word: מֵי נִדָּה
  choice: a água para a purificação
  rationale: A expressão designa a água preparada neste capítulo para remover a impureza causada pelo contato com morto; a formulação funcional evita a possível confusão de 'água de impureza'.
- source_word: זֹרַק עָלָיו
  choice: não foi aspergida sobre ele
  rationale: No uso ritual, זרק descreve a aplicação de líquido por aspersão.
- source_word: טָמֵא הוּא
  choice: ele está impuro
  rationale: Reproduz diretamente a declaração final do estado ritual da pessoa.
theological_decisions:
- issue: Natureza da pena expressa por כרת
  choice: será eliminada do meio da assembleia
  alternative: será excluída da comunidade; será morta
  rationale: A fórmula pactual não especifica aqui se a consequência ocorre por exclusão comunitária, morte ou juízo divino; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Mantém a terminologia ritual e a ambiguidade jurídica do hebraico, evitando explicações denominacionais no corpo do versículo.
