  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: pt
  text: E todo recipiente aberto que não tiver uma tampa bem presa sobre ele é impuro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma tampa amarrada» ou «uma cobertura selada»; a expressão hebraica refere-se a uma cobertura firmemente assegurada sobre o recipiente, provavelmente por meio de uma amarração.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: E todo
  rationale: 'וְ liga esta norma ao contexto anterior, e כֹל com o substantivo singular tem sentido distributivo: “todo”.'
- source_word: כְּלִי
  choice: recipiente
  rationale: כְּלִי pode designar um utensílio, objeto ou vaso; neste contexto, refere-se naturalmente a algo capaz de conter e que pode ficar aberto.
- source_word: פָתוּחַ
  choice: aberto
  rationale: Reproduz diretamente o adjetivo hebraico, enquanto a oração seguinte esclarece a falta de uma cobertura presa.
- source_word: אֲשֶׁר אֵין ... עָלָיו
  choice: que não tiver sobre si
  rationale: Expressa de modo natural em português a ausência de algo colocado sobre o recipiente, preservando a relação espacial de עָלָיו.
- source_word: צָמִיד פָּתִיל
  choice: uma tampa presa
  rationale: A expressão indica uma cobertura firmada ou amarrada ao recipiente. “Tampa presa” é clara e concreta sem definir além do texto o mecanismo antigo de fechamento.
- source_word: טָמֵא הוּא
  choice: é impuro
  rationale: Mantém a declaração nominal hebraica e evita acrescentar “ritualmente” ao texto principal.
theological_decisions:
- issue: Natureza da impureza
  choice: é impuro
  alternative: é ritualmente impuro
  rationale: O contexto diz respeito às leis de pureza, mas o hebraico declara apenas “impuro”; a tradução não acrescenta uma qualificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Recipiente” evita o tom arcaico de “vaso” e comunica adequadamente a função do objeto; a ordem “sobre si” preserva a relação espacial sem tornar a frase pesada.
