  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido básico do hebraico: a regra abrange cada recipiente aberto sem uma cobertura devidamente assegurada, e declara-o impuro. Contudo, «tampa presa» pode sugerir que a tampa está permanentemente ligada ao recipiente, em vez de estar firmemente fixada/atada sobre ele; «sobre si» também é menos natural neste contexto.'
  naturalness: «Recipiente» e «é impuro» são claros, modernos e adequados. A formulação «não tiver sobre si uma tampa presa» é compreensível, mas soa algo rígida. «Não tiver uma tampa bem presa sobre ele» mantém a relação espacial e é mais idiomática em português internacional de boa legibilidade brasileira.
  terminology: «Recipiente» representa bem כְּלִי neste contexto, e «impuro» reproduz טָמֵא sem introduzir a explicação «ritualmente». «Tampa bem presa» comunica a função de צָמִיד פָּתִיל sem especificar indevidamente o mecanismo antigo; a nota preserva alternativas relevantes.
