  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: pt
  text: Um homem ritualmente puro recolherá as cinzas da novilha e as depositará fora do acampamento, num lugar ritualmente puro. Elas ficarão guardadas para a comunidade dos israelitas, para a água de impureza[a]; é uma oferta pelo pecado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por «água de purificação» ou, de modo mais explicativo, «água destinada à remoção da impureza». Literalmente, «água de impureza».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «é uma oferta de purificação». O termo hebraico חַטָּאת pode designar uma oferta pelo pecado e, em contextos sacerdotais, uma oferta cuja função é purificar.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: um homem ritualmente puro
  rationale: Mantém o singular masculino de אִישׁ e explicita o sentido ritual de טָהוֹר, evitando que «puro» seja entendido apenas em sentido moral.
- source_word: וְאָסַף
  choice: recolherá
  rationale: O qatal com waw prossegue a sequência de instruções rituais; o futuro do indicativo é natural em português jurídico e prescritivo.
- source_word: אֵפֶר הַפָּרָה
  choice: as cinzas da novilha
  rationale: אֵפֶר tem sentido coletivo, expresso idiomaticamente pelo plural «cinzas»; פָּרָה designa uma fêmea bovina, aqui a novilha especificada pelo ritual.
- source_word: וְהִנִּיחַ
  choice: e as depositará
  rationale: «Depositar» comunica com clareza a colocação deliberada das cinzas no local determinado e permite retomar naturalmente «cinzas» pelo pronome «as».
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: A expressão funciona aqui de modo locativo e tem equivalente português direto e natural.
- source_word: בְּמָקוֹם טָהוֹר
  choice: num lugar ritualmente puro
  rationale: Repete o valor ritual de טָהוֹר e evita uma leitura meramente física ou moral de «puro».
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: Elas ficarão guardadas
  rationale: Embora o hebraico trate o referente coletivo no singular feminino, o português retoma naturalmente «cinzas» no plural; «ficarão guardadas» expressa a função de custódia indicada por לְמִשְׁמֶרֶת.
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: para a comunidade dos israelitas
  rationale: «Comunidade» representa עֲדָה em contexto coletivo, e «israelitas» verte de modo atual e inclusivo a expressão idiomática בְּנֵי יִשְׂרָאֵל sem alterar seu referente.
- source_word: לְמֵי נִדָּה
  choice: para a água destinada à remoção da impureza
  rationale: A formulação preserva a ligação da água com a impureza ritual e torna compreensível sua finalidade sem reduzir נִדָּה às associações mais estreitas que o termo pode ter em outros contextos.
- source_word: חַטָּאת הִוא
  choice: é uma oferta pelo pecado
  rationale: חַטָּאת pode designar pecado ou a oferta relacionada ao pecado. A tradução tradicional e lexicalmente estabelecida é mantida no texto, enquanto o valor purificatório pertinente ao contexto aparece em nota.
theological_decisions:
- issue: Sentido de חַטָּאת num ritual de purificação
  choice: é uma oferta pelo pecado
  alternative: é uma oferta de purificação
  rationale: O termo hebraico abrange tanto a oferta pelo pecado quanto sua função purificatória em textos sacerdotais. O texto principal conserva a designação tradicional, e a nota registra a alternativa sem eliminar a tensão lexical e ritual.
- issue: Função de מֵי נִדָּה
  choice: água destinada à remoção da impureza
  alternative: água de impureza; água de purificação
  rationale: A construção hebraica associa a água a נִדָּה, mas pode ser entendida quanto à condição tratada ou quanto à função do rito. A tradução principal explicita a finalidade provável, e a nota preserva as formulações mais literais ou compactas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O registro ritual é preservado sem arcaísmos. «Ritualmente puro» esclarece o domínio sem importar uma doutrina específica; «comunidade dos israelitas» evita a rigidez de «filhos de Israel» sem mudar o referente coletivo.
