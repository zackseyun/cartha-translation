revisions:
- from: 'Este é o estatuto da lei que o SENHOR ordenou: “Diga aos filhos de Israel que tragam a você uma novilha vermelha, sem defeito, que não tenha imperfeição alguma e sobre a qual nunca se tenha posto jugo.”'
  to: 'Este é o estatuto da lei que o SENHOR ordenou, dizendo: “Fale aos filhos de Israel que tragam a você uma novilha vermelha, íntegra, sem defeito, sobre a qual nunca se pôs jugo.”'
  rationale: A revisão restaura "dizendo", explicitamente presente no texto hebraico, e ajusta a caracterização da novilha para refletir com maior clareza os dois termos correlatos do original. Também simplifica a cláusula relativa sobre o jugo sem modificar seu sentido.
