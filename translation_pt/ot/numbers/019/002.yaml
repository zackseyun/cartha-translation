source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: pt
  text: 'Este é o estatuto da lei que o SENHOR ordenou, dizendo: “Fale aos filhos de Israel que tragam a você uma novilha vermelha, íntegra, sem defeito, sobre a qual nunca se pôs jugo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: o estatuto da lei
  rationale: Mantém a combinação hebraica de חֻקָּה, uma determinação normativa, com תּוֹרָה, aqui entendida como lei ou instrução autoritativa.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa consolidada de representar o Tetragrama por SENHOR em versaletes, sem inserir uma vocalização debatida no texto principal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão histórica e pactual do hebraico, de compreensão corrente em português bíblico.
- source_word: פָרָה אֲדֻמָּה
  choice: uma novilha vermelha
  rationale: פָרָה designa uma fêmea bovina; 'novilha' é a designação tradicional e natural neste contexto ritual, enquanto אֲדֻמָּה indica a cor vermelha.
- source_word: תְּמִימָה אֲשֶׁר אֵין בָּהּ מוּם
  choice: sem defeito, que não tenha imperfeição alguma
  rationale: 'Representa os dois elementos hebraicos relacionados, mas não idênticos: תְּמִימָה indica integridade ou condição irrepreensível, e מוּם, defeito físico. A formulação evita o pouco natural ''inteira'' aplicado ao animal.'
- source_word: אֲשֶׁר לֹא עָלָה עָלֶיהָ עֹל
  choice: sobre a qual nunca se tenha posto jugo
  rationale: Expressa naturalmente em português a ausência, até então, de qualquer jugo sobre o animal.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: A forma adotada respeita a tradição de tradução amplamente reconhecida em português e não toma posição no texto principal sobre a reconstrução da pronúncia do Tetragrama.
- issue: Relação entre תְּמִימָה e מוּם
  choice: sem defeito, que não tenha imperfeição alguma
  alternative: perfeita, sem defeito
  rationale: Preserva a ênfase dupla do original sem atribuir ao animal uma noção teológica abstrata de perfeição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Conserva 'estatuto da lei', 'filhos de Israel' e 'jugo' por sua precisão e reconhecimento no registro bíblico, evitando arcaísmos verbais.
