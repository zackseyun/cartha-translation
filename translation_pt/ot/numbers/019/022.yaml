id: NUM.19.22
reference: Numbers 19:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כֹ֛ל אֲשֶׁר יִגַּע בּ֥/וֹ הַ/טָּמֵ֖א יִטְמָ֑א וְ/הַ/נֶּ֥פֶשׁ הַ/נֹּגַ֖עַת תִּטְמָ֥א עַד הָ/עָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: pt
  text: Tudo aquilo em que a pessoa impura tocar ficará impuro, e a pessoa[a] que tocar nisso ficará impura até o anoitecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, néfesh, termo que literalmente pode significar “alma” ou “vida”, mas que aqui se refere à pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: Tudo aquilo em que
  rationale: A expressão introduz de modo abrangente tudo o que vier a ser tocado. A construção com “em que” corresponde naturalmente em português à regência de נגע בְּ.
- source_word: יִגַּע בּוֹ
  choice: tocar
  rationale: נגע com a preposição בְּ expressa toque ou contato; em português, “tocar em” comunica com clareza o contato ritual.
- source_word: הַטָּמֵא
  choice: a pessoa impura
  rationale: O adjetivo substantivado designa alguém em estado de impureza ritual. “Pessoa impura” explicita o referente sem sugerir culpa moral.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: O verbo indica que aquilo que foi tocado passa ao estado de impureza ritual.
- source_word: וְהַנֶּפֶשׁ
  choice: e a pessoa
  rationale: נֶפֶשׁ pode significar vida, ser vivente ou pessoa; neste contexto legal, refere-se à pessoa inteira.
- source_word: הַנֹּגַעַת
  choice: que tocar nisso
  rationale: O particípio feminino concorda com נֶפֶשׁ. “Nisso” retoma naturalmente aquilo que se tornou impuro na oração anterior, embora o objeto esteja implícito no hebraico.
- source_word: תִּטְמָא עַד הָעָרֶב
  choice: ficará impura até o anoitecer
  rationale: A formulação expressa o estado ritual resultante e seu limite temporal; “até o anoitecer” é corrente, claro e fiel ao sentido de עַד הָעָרֶב.
theological_decisions:
- issue: Natureza da impureza na legislação ritual
  choice: Traduzir טמא como “impuro”, não como “pecaminoso” ou “contaminado moralmente”.
  alternative: “contaminado” ou “profanado”
  rationale: O contexto trata da transmissão de impureza ritual por contato e não afirma culpa moral.
- issue: Referente implícito de הַנֹּגַעַת
  choice: Entender que a pessoa toca naquilo que foi tornado impuro na primeira oração.
  alternative: 'Deixar o complemento inteiramente sem expressão: “a pessoa que tocar”'
  rationale: O objeto não é expresso após o particípio no hebraico, mas é recuperado do contexto imediato. “Nisso” torna a relação compreensível sem acrescentar uma identificação mais específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Impuro” preserva a categoria ritual; “anoitecer” evita rigidez excessiva sem perder o limite temporal.
