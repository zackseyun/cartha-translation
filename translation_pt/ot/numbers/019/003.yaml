id: NUM.19.3
reference: Numbers 19:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/נְתַתֶּ֣ם אֹתָ֔/הּ אֶל אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן וְ/הוֹצִ֤יא אֹתָ/הּ֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/שָׁחַ֥ט אֹתָ֖/הּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: pt
  text: Vocês a entregarão a Eleazar, o sacerdote. Ele a levará para fora do acampamento, e ela[b] será abatida diante dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também é possível traduzir: “e ele a abaterá diante dele”, caso se entenda que Eleazar continua sendo o sujeito implícito do verbo.'
    reason: alternative_reading
  - marker: b
    text: O pronome hebraico é feminino singular e se refere à novilha vermelha; o feminino também é natural em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: Vocês a entregarão
  rationale: O perfeito qal com waw, neste contexto de instrução legal, tem força diretiva. O plural “vocês” reproduz a segunda pessoa plural hebraica, e “entregarão” é natural e digno em português.
- source_word: אֹתָהּ
  choice: a / ela
  rationale: O pronome hebraico é feminino singular e retoma a novilha vermelha. Como “novilha” também é feminina em português, a concordância natural preserva essa referência.
- source_word: אֶל אֶלְעָזָר הַכֹּהֵן
  choice: a Eleazar, o sacerdote
  rationale: Tradução direta da preposição, do nome próprio e do título, com aposto natural em português.
- source_word: וְהוֹצִיא אֹתָהּ
  choice: Ele a levará para fora
  rationale: O hifil de יצא expressa fazer sair ou levar para fora. “Levará para fora” preserva o sentido causativo e se ajusta ao movimento para longe do acampamento.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: para fora do acampamento
  rationale: Expressa de modo idiomático a direção indicada pela construção hebraica, sem acrescentar um local não mencionado.
- source_word: וְשָׁחַט אֹתָהּ
  choice: e ela será abatida
  rationale: Embora o verbo hebraico esteja na terceira pessoa masculina singular com sujeito implícito, a voz passiva em português evita identificar indevidamente quem realiza o abate e mantém o foco no ato ordenado.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Equivalente conciso e corrente de “perante ele” ou “na presença dele”, preservando a referência masculina singular, naturalmente entendida como Eleazar.
theological_decisions:
- issue: Identidade de quem abate a novilha
  choice: A formulação passiva “ela será abatida diante dele” não identifica explicitamente o executor e apresenta Eleazar como presente ao ato.
  alternative: “Ele a abaterá diante dele”, entendendo que Eleazar continua sendo o sujeito implícito do verbo.
  rationale: A sequência verbal pode sugerir a continuidade de Eleazar como sujeito, mas “diante dele” também pode distinguir quem abate de Eleazar, em cuja presença ocorre o ato. A tradução principal preserva a ambiguidade sem impor uma função ritual mais específica.
translation_notes:
  register: 'Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A divisão em duas frases reduz a sobrecarga sintática sem alterar a sequência dos atos. Os marcadores foram colocados junto aos elementos que esclarecem: [b] na referência feminina à novilha e [a] na cláusula cujo sujeito é ambíguo.'
