base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: pt
  text: 'Esta é a lei: quando um homem morrer numa tenda, todo aquele que entrar na tenda e todo aquele que estiver na tenda[a] ficará impuro por sete dias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e tudo o que estiver na tenda”. A expressão hebraica pode ter sentido mais amplo, mas o contexto e o verbo no singular favorecem a referência às pessoas presentes; os recipientes são tratados explicitamente no versículo seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Esta é a lei
  rationale: תּוֹרָה introduz aqui a norma que rege a impureza causada por um cadáver. “Lei” é conciso, natural e apropriado ao contexto ritual e jurídico.
- source_word: אָדָם כִּי יָמוּת
  choice: quando um homem morrer
  rationale: אָדָם é singular e genérico, e כִּי com o imperfeito introduz uma situação prevista pela lei. “Quando” exprime naturalmente esse caso, enquanto “um homem” conserva a forma masculina genérica do hebraico.
- source_word: בְּאֹהֶל
  choice: numa tenda
  rationale: A primeira ocorrência de אֹהֶל não tem artigo e apresenta o cenário de modo indefinido; as ocorrências seguintes retomam a mesma tenda com o artigo definido.
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: todo aquele que entrar na tenda
  rationale: O particípio com כָּל abrange qualquer pessoa que entre. A formulação é natural em português e mantém o caráter geral da prescrição.
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: e todo aquele que estiver na tenda
  rationale: Embora אֲשֶׁר possa ter referência mais ampla, o paralelismo com quem entra e o verbo singular favorecem pessoas presentes. A ambiguidade genuína é preservada em nota.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: No contexto das leis de pureza, a forma indica o estado ritual resultante. “Ficará impuro” é claro em português contemporâneo e evita o tom excessivamente arcaico de “será imundo”.
- source_word: שִׁבְעַת יָמִים
  choice: por sete dias
  rationale: A preposição “por” torna explícita em português a duração expressa diretamente pelo hebraico.
