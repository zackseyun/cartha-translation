  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: pt
  text: Então um homem ritualmente puro[a] pegará hissopo, o mergulhará na água e aspergirá essa água sobre a tenda, sobre todos os utensílios, sobre as pessoas que estiveram ali e sobre quem tiver tocado num osso, no cadáver de alguém morto violentamente[b], num morto ou numa sepultura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um homem puro”. A expressão se refere à pureza ritual.'
    reason: Esclarece a explicitação contextual feita no texto e preserva acesso à forma mais literal.
  - marker: b
    text: O termo hebraico se refere especificamente a alguém morto de forma violenta, em contraste com o termo mais geral “morto” na expressão seguinte.
    reason: Preserva uma distinção lexical do hebraico que pode não ser evidente ao leitor.
lexical_decisions:
- source_word: אֵזוֹב
  choice: hissopo
  rationale: Mantém o termo tradicional para a planta ritual, sem tentar identificá-la botanicamente com precisão maior que a permitida pelo hebraico.
- source_word: בַּמַּיִם
  choice: na água
  rationale: Preserva a determinação do hebraico e remete à água de purificação preparada no contexto anterior.
- source_word: אִישׁ טָהוֹר
  choice: um homem ritualmente puro
  rationale: Mantém o substantivo masculino singular e explicita que a pureza em questão é cerimonial, não uma avaliação moral.
- source_word: וְהִזָּה
  choice: aspergirá
  rationale: É o verbo português corrente e digno para a aplicação ritual de líquido em gotas.
- source_word: הָאֹהֶל
  choice: a tenda
  rationale: No contexto, designa a tenda onde ocorreu a morte, não o tabernáculo.
- source_word: הַכֵּלִים
  choice: todos os utensílios
  rationale: Expressa o sentido amplo de objetos ou implementos; 'utensílios' é natural no contexto doméstico e ritual.
- source_word: הַנְּפָשׁוֹת
  choice: as pessoas
  rationale: Aqui נֶפֶשׁ designa seres humanos presentes, não 'almas' em sentido antropológico técnico.
- source_word: הַנֹּגֵעַ
  choice: quem tiver tocado
  rationale: Reproduz naturalmente em português o particípio substantivado e a anterioridade do contato que causou impureza.
- source_word: בָּעֶצֶם
  choice: num osso
  rationale: O singular é preservado; em português, o indefinido comunica melhor uma categoria de fonte de impureza.
- source_word: בֶחָלָל
  choice: no cadáver de alguém morto violentamente
  rationale: Torna explícita a referência a uma vítima de morte violenta e conserva a distinção em relação ao termo geral para morto que vem em seguida.
- source_word: בַמֵּת
  choice: num morto
  rationale: Mantém o termo geral para uma pessoa morta, em contraste com חָלָל.
- source_word: בַקָּבֶר
  choice: numa sepultura
  rationale: Equivalente natural para um lugar de sepultamento; o indefinido funciona em português como referência categorial.
theological_decisions:
- issue: Terminologia de pureza ritual
  choice: ritualmente puro
  alternative: puro; limpo
  rationale: O contexto trata da condição cerimonial exigida para realizar a aspersão, não de pureza moral. A explicitação evita uma leitura ética indevida.
- issue: Linguagem masculina em אִישׁ
  choice: homem
  alternative: pessoa
  rationale: O texto hebraico emprega explicitamente o substantivo masculino singular; a tradução o conserva sem fazer afirmações além da forma do texto.
- issue: Distinção entre חָלָל e מֵת
  choice: cadáver de alguém morto violentamente / morto
  alternative: cadáver / morto; pessoa assassinada / morto
  rationale: A formulação conserva a tensão lexical entre uma vítima de morte violenta e o termo geral para qualquer morto, sem restringir חָלָל necessariamente a assassinato.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário ritual compreensível. A repetição de “sobre” acompanha a estrutura enumerativa do hebraico. “Essa água” explicita o objeto implícito de “aspergirá”, retomando a água mencionada imediatamente antes.
