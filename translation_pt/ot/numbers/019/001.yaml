  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: pt
  text: 'Yahweh falou a Moisés e a Arão, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo wayyiqtol de דבר introduz um novo ato narrativo de fala; “falou” é a forma natural e digna em português para esta fórmula de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: a Moisés e a Arão
  rationale: A preposição repetida no hebraico identifica ambos como destinatários; em português, a coordenação com “a” antes de cada nome preserva essa estrutura sem artificialidade.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz formalmente a fala que vem no versículo seguinte; “dizendo” preserva essa ligação tradicional e clara.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o representa diretamente e evita substituí-lo por um título, sem resolver além da evidência a incerteza histórica sobre sua vocalização exata.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção formular “falou... dizendo” foi mantida por ligar explicitamente o ato de fala à citação que começa no versículo seguinte.
