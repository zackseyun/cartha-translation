review_pass:
  verdict: revise
  source_fidelity: 'A sequência ritual está bem compreendida: a pessoa ritualmente pura aplica a aspersão à impura no terceiro e no sétimo dia, e a pessoa que recebe o rito lava as roupas e o corpo, tornando-se pura ao anoitecer. Contudo, em português, «aspergirá sobre a pessoa impura» deixa sem expressão o elemento aspergido e soa elíptico demais; o contexto imediato permite explicitar «água». «Pessoa purificada» também pode sugerir que a pureza já foi plenamente alcançada antes das lavagens finais.'
  naturalness: O registro é claro e apropriado, mas «aspergirá sobre» sem objeto é menos natural em português corrente. «A pessoa submetida à purificação» identifica de modo claro e não prematuro o sujeito das ações finais.
  terminology: «Pura/impura», «aspergirá» e «purificará» preservam adequadamente o vocabulário ritual. «Descontaminará» é excessivamente técnico e associado a contaminação material moderna; «limpará» é uma alternativa lexical mais natural, desde que a nota preserve a especificidade ritual do contexto.
  issues:
  - severity: medium
    issue: Objeto de «aspergirá» não está expresso
    rationale: Embora o hebraico deixe o objeto recuperável pelo contexto, o português normalmente requer que se diga o que é aspergido. «Água» explicita apenas o elemento já determinado pelo contexto ritual, sem acrescentar sentido material novo.
  - severity: medium
    issue: «A pessoa purificada» antecipa a condição final de pureza
    rationale: A pessoa ainda deve lavar as roupas, banhar-se e só fica pura ao anoitecer. «A pessoa submetida à purificação» evita apresentar como já plenamente consumado o resultado que o versículo situa ao anoitecer.
  - severity: low
    issue: Alternativa de nota «descontaminará»
    rationale: O termo é compreensível, mas seu uso moderno tende a remeter a poluição, agentes químicos ou biossegurança, e não à remoção de impureza ritual.
