  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: pt
  text: A pessoa pura aspergirá água sobre a pessoa impura no terceiro e no sétimo dia; assim, no sétimo dia, a purificará[a]. Então, a pessoa submetida à purificação lavará suas roupas, se banhará em água e ficará pura ao anoitecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a limpará”. O verbo hebraico pertence a uma raiz frequentemente associada ao pecado e à purificação, mas aqui se refere à remoção da impureza ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: aspergirá
  rationale: O hifil de נזה descreve, neste rito, a aplicação da água de purificação por aspersão. “Aspergirá” é preciso, corrente no registro bíblico e não acrescenta ao verbo um objeto expresso que o hebraico deixa implícito no contexto.
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: a pessoa pura / a pessoa impura
  rationale: Os adjetivos substantivados designam pessoas em condição ritual de pureza ou impureza. “Pessoa” comunica o uso representativo sem restringir indevidamente o rito aos homens.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: no terceiro e no sétimo dia
  rationale: Expressa com clareza os dois momentos prescritos. A repetição de “dia” mantém explícita a sequência ritual, enquanto a preposição compartilhada produz português natural.
- source_word: וְחִטְּאוֹ
  choice: assim, no sétimo dia, a purificará
  rationale: No piel, חטא pode indicar a remoção de impureza ritual. “Purificará” preserva esse sentido sem transformar o rito em declaração explícita sobre perdão moral; “assim” comunica o valor resultante da ação.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: a pessoa purificada lavará suas roupas
  rationale: O contexto indica que a pessoa submetida ao rito lava as próprias roupas. A explicitação do referente evita que, em português, o sujeito seja confundido com a pessoa pura que realizou a aspersão.
- source_word: וְרָחַץ בַּמַּיִם
  choice: se banhará em água
  rationale: רחץ, tendo a pessoa como sujeito, indica aqui a lavagem do corpo. A forma reflexiva é idiomática e torna explícito em português o sentido contextual.
- source_word: וְטָהֵר בָּעָרֶב
  choice: ficará pura ao anoitecer
  rationale: O verbo assinala a condição ritual alcançada depois da lavagem, e בָּעָרֶב marca o momento em que essa condição passa a valer. “Ao anoitecer” é natural e temporalmente preciso.
theological_decisions:
- issue: Natureza da linguagem de חטא e טהר neste rito
  choice: Traduzir em termos de purificação ritual
  alternative: limpar do pecado; fazer expiação
  rationale: O contexto trata da impureza decorrente do contato com um cadáver e do uso da água de purificação. Linguagem explicitamente moral ou expiatória importaria uma afirmação que este versículo não faz.
- issue: Gênero dos adjetivos substantivados הַטָּהֹר e הַטָּמֵא
  choice: a pessoa pura / a pessoa impura
  alternative: o homem puro / o homem impuro
  rationale: Embora as formas hebraicas estejam no masculino singular, seu emprego jurídico é representativo, não uma identificação especificamente masculina.
- issue: Referente do sujeito após וְחִטְּאוֹ
  choice: Explicitar “a pessoa purificada” como quem lava as roupas e se banha
  alternative: Manter apenas um pronome ou sujeito oculto, permitindo possível referência à pessoa que asperge
  rationale: 'A mudança pragmática de sujeito é própria da sequência ritual: quem recebeu a purificação completa o processo lavando-se. Em português, a explicitação evita uma ambiguidade referencial acidental sem alterar a função ritual descrita.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o vocabulário ritual de pureza e impureza, evita linguagem moralizante não exigida pelo contexto e usa construções naturais sem perder a sequência jurídica do hebraico.
