  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: pt
  text: 'E isso será para eles um estatuto permanente: quem aspergir a água para a impureza[a] lavará suas roupas, e quem tocar na água para a impureza ficará impuro até a tarde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a água para a purificação da impureza”; tradicionalmente, “a água da separação”. Em hebraico, literalmente, “as águas da impureza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: E isso será
  rationale: Retoma a regulamentação em contexto e expressa sua vigência continuada; “isso” explicita naturalmente em português o referente implícito.
- source_word: לָהֶם
  choice: para eles
  rationale: Indica que o estatuto se aplica ao povo mencionado no contexto.
- source_word: לְחֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: חֻקָּה designa uma norma prescrita, e עוֹלָם indica duração continuada no contexto legal da aliança.
- source_word: וּמַזֵּה
  choice: quem aspergir
  rationale: O particípio substantivado identifica a pessoa que realiza a aspersão ritual; a formulação é natural e inclusiva em português.
- source_word: מֵי הַנִּדָּה
  choice: a água para a impureza
  rationale: Preserva a construção hebraica e sua referência ritual sem reduzi-la a culpa moral; uma nota registra alternativas explicativas e tradicionais.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: lavará suas roupas
  rationale: Reproduz a forma normativa do hebraico com vocabulário corrente.
- source_word: וְהַנֹּגֵעַ
  choice: e quem tocar
  rationale: Representa o segundo particípio substantivado em paralelo com “quem aspergir”.
- source_word: יִטְמָא
  choice: ficará impuro
  rationale: Expressa o estado ritual resultante, sem sugerir culpa moral.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: É uma formulação portuguesa natural para o limite temporal indicado pelo hebraico.
theological_decisions:
- issue: Terminologia de pureza ritual em Números 19
  choice: Usar “impureza” e “impuro” em sentido ritual, preservando “água para a impureza” no texto.
  alternative: Traduzir como “água da purificação” ou pela expressão tradicional “água da separação”.
  rationale: O contexto trata de impureza cerimonial associada ao contato com cadáver, não de culpa moral. A formulação principal mantém a tensão lexical do hebraico, enquanto a nota esclarece as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega formulação legal direta e terminologia ritual consistente; o marcador [a] aparece no texto junto à unidade lexical explicada.
