base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: pt
  text: 'E a oferta de cereal correspondente será de farinha fina misturada com azeite: preparem três décimos[a] para o novilho e dois décimos para o carneiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “três décimos” e “dois décimos” são formas abreviadas de dizer décimos de um efa, uma medida de capacidade para secos usada nas normas sobre sacrifícios.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: E a oferta de cereal correspondente
  rationale: No contexto sacrificial, מִנְחָה designa especificamente uma oferta de cereal. O sufixo plural retoma coletivamente os animais mencionados; “correspondente” expressa essa relação com naturalidade sem impor uma mudança para o singular.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo habitual para farinha finamente moída e de boa qualidade usada nas ofertas.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo indica que a farinha deve ser preparada mediante mistura com óleo; “azeite” é a designação natural do óleo empregado neste contexto bíblico.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: três décimos
  rationale: עִשָּׂרוֹן é uma medida correspondente a um décimo de efa. A forma abreviada preserva a concisão do hebraico, com a unidade explicitada na nota.
- source_word: לַפָּר
  choice: para o novilho
  rationale: O substantivo singular com artigo remete ao bovino especificado na prescrição imediatamente anterior; “novilho” é claro e corrente em linguagem sacrificial.
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: e dois décimos
  rationale: Mantém o paralelismo com “três décimos” e a forma concisa do texto hebraico.
- source_word: לָאַיִל
  choice: para o carneiro
  rationale: O singular com artigo remete ao carneiro já especificado na sequência sacrificial.
- source_word: תַּעֲשׂוּ
  choice: preparem
  rationale: O verbo עשה é amplo, mas neste contexto instrucional refere-se à preparação prescrita. “Preparem” é natural e evita especificar além do hebraico que a ação seja apenas oferecer.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para que a ordem “preparem três décimos...” soe natural, sem alterar as quantidades nem suas relações com os animais.
