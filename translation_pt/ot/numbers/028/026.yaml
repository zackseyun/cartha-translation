id: NUM.28.26
reference: Numbers 28:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: pt
  text: E, no dia das primícias, quando apresentarem uma nova oferta de cereal a Yahweh, na Festa das Semanas, vocês terão uma santa convocação[a]. Não farão nenhum trabalho comum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma assembleia sagrada”. A expressão hebraica é um termo técnico para uma reunião sagrada convocada para o culto.
    reason: lexical_alternative
  - marker: b
    text: Ou “trabalho penoso” ou “trabalho ocupacional”. A expressão se refere ao trabalho comum ligado às atividades cotidianas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַבִּכּוּרִים
  choice: E, no dia das primícias
  rationale: Mantém a ligação com o contexto anterior e traduz naturalmente a expressão temporal e o termo cultual para os primeiros produtos da colheita.
- source_word: בְּהַקְרִיבְכֶם
  choice: quando apresentarem
  rationale: O infinitivo com בְּ indica simultaneidade; no contexto sacrificial, קרב significa apresentar ou oferecer diante de Deus.
- source_word: מִנְחָה חֲדָשָׁה
  choice: uma nova oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa normalmente uma oferta de cereal; חֲדָשָׁה a relaciona à nova colheita.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino יְהוָה como nome próprio, em vez de substituí-lo por um título.
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: na Festa das Semanas
  rationale: O plural refere-se à celebração calendárica conhecida como Festa das Semanas; a tradução explicita esse sentido em português corrente.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: 'Preserva o caráter técnico da expressão: uma reunião sagrada formalmente convocada para o culto.'
- source_word: יִהְיֶה לָכֶם
  choice: vocês terão
  rationale: Forma idiomática em português para a construção existencial com ל, mantendo sua força normativa.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho comum
  rationale: A expressão sacerdotal proíbe o trabalho regular ligado às ocupações cotidianas, não necessariamente toda e qualquer atividade.
- source_word: לֹא תַעֲשׂוּ
  choice: Não farão
  rationale: Mantém a proibição direta na segunda pessoa do plural e o registro jurídico solene.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Alcance da proibição de trabalho
  choice: trabalho comum
  alternative: trabalho penoso; trabalho servil
  rationale: A expressão não deve ser ampliada silenciosamente para proibir toda atividade; refere-se ao labor ocupacional normal em contraste com a observância sagrada.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O plural “vocês” torna explícita a segunda pessoa plural do hebraico. Os marcadores foram posicionados junto às expressões que suas notas efetivamente explicam.
