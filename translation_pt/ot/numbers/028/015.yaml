  text: וּ/שְׂעִ֨יר עִזִּ֥ים אֶחָ֛ד לְ/חַטָּ֖את לַ/יהוָ֑ה עַל עֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: pt
  text: E um bode, como oferta pelo pecado a Yahweh, será oferecido além do holocausto regular e da sua oferta de bebida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como oferta de purificação”. O termo hebraico חַטָּאת pode designar a oferta que trata tanto da impureza quanto do pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão designa um caprino macho; “bode” é a forma portuguesa natural e preserva o sexo especificado.
- source_word: אֶחָד
  choice: um
  rationale: Mantém explicitamente o numeral que integra a prescrição sacrificial.
- source_word: לְחַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta relacionada ao pecado ou à purificação. A formulação tradicional e reconhecível fica no texto, enquanto a alternativa legítima é preservada em nota.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama e indica que a oferta é apresentada a Yahweh.
- source_word: עַל
  choice: além de
  rationale: Neste contexto, assinala adição ao holocausto regular, e não posição espacial.
- source_word: עֹלַת הַתָּמִיד
  choice: o holocausto regular
  rationale: Refere-se à oferta queimada fixa e recorrente; “regular” conserva esse sentido sem acrescentar uma frequência não expressa diretamente pela locução.
- source_word: יֵעָשֶׂה
  choice: será oferecido
  rationale: Embora o verbo signifique literalmente “será feito”, no contexto cultual “será oferecido” comunica naturalmente a ação sacrificial.
- source_word: וְנִסְכּוֹ
  choice: e de sua oferta derramada
  rationale: נֶסֶךְ é a oferta líquida vertida que acompanha o holocausto; “oferta derramada” é clara e descreve a ação ritual sem recorrer ao termo menos comum “libação”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome divino em vez de substituí-lo por um título.
- issue: Sentido de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A expressão pode destacar tanto o pecado quanto a remoção da impureza ritual. A tradução tradicional permanece no texto principal, e a alternativa é registrada em nota para preservar a amplitude semântica.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial acessível. A ordem foi levemente ajustada à sintaxe portuguesa, sem eliminar a relação entre o bode, o holocausto regular e a oferta derramada que o acompanha.
