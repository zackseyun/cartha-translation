base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também representado como “Jeová”.'
    reason: Esclarece a forma hebraica do nome divino e uma representação tradicional, com a âncora corretamente ligada a “Yahweh”.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O piel narrativo de דבר, precedido de waw consecutivo, integra a fórmula habitual de introdução da fala divina. “Falou” conserva a cadência narrativa e distingue esta introdução do conteúdo que vem a seguir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; “a Moisés” é a formulação natural em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo “dizendo” introduz a fala direta que começa no versículo seguinte. Em português atual, os dois-pontos expressam naturalmente essa função sem produzir a construção menos idiomática “falou..., dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; a nota registra as formas alternativas conhecidas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a abertura narrativa com “E”; usa dois-pontos para introduzir de modo natural a fala que se segue.
