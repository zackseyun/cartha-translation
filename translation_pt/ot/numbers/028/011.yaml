source:
  edition: WLC
  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: pt
  text: 'No início de cada mês[a], vocês apresentarão um holocausto a Yahweh: dois touros do rebanho, um carneiro e sete cordeiros machos de um ano, sem defeito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “nos inícios dos seus meses”; isto é, nas celebrações da lua nova.'
    reason: A nota preserva a forma da expressão hebraica e esclarece a ocasião cultual indicada pelo idioma.
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: No início de cada mês
  rationale: A expressão idiomática, literalmente “nas cabeças/inícios dos seus meses”, indica o começo de cada mês, ocasião da lua nova. A formulação escolhida comunica naturalmente o sentido temporal; a referência cultual à lua nova é preservada em nota.
- source_word: תַּקְרִיבוּ
  choice: vocês apresentarão
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer. “Apresentarão” conserva a ideia de levar a oferta perante Deus e expressa o valor prescritivo da forma verbal.
- source_word: עֹלָה
  choice: um holocausto
  rationale: Termo tradicional e preciso em português para a oferta inteiramente queimada, categoria sacrificial designada por עֹלָה.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário da oferta, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dois novilhos
  rationale: A expressão designa dois bovinos machos destinados ao sacrifício. “Novilhos” é uma equivalência portuguesa natural para os animais do gado mencionados aqui, sem reproduzir literalmente “filhos do gado”.
- source_word: וְאַיִל אֶחָד
  choice: um carneiro
  rationale: Equivalente direto e corrente para o macho adulto do rebanho ovino.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sete cordeiros de um ano
  rationale: כְּבָשִׂים designa cordeiros machos, e “filhos de um ano” indica animais de um ano ou no primeiro ano de vida. Em português, “cordeiros” normalmente já denota os machos neste contexto sacrificial.
- source_word: תְּמִימִם
  choice: todos sem defeito
  rationale: No contexto sacrificial, o adjetivo exige animais íntegros, sem defeito físico. “Todos” deixa claro que a qualificação se aplica aos sete cordeiros, em concordância com o plural masculino hebraico.
theological_decisions:
- issue: Expressão temporal da observância mensal
  choice: No início de cada mês
  alternative: Nas luas novas de vocês
  rationale: O hebraico fala literalmente dos “inícios” dos meses e, no calendário antigo, refere-se à celebração da lua nova. O texto principal mantém o sentido idiomático imediato sem tornar obscura a frase; a dimensão cultual é explicitada na nota.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o nome próprio da aliança. A transliteração preserva sua condição de nome, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Holocausto” mantém a terminologia bíblico-sacrificial consolidada. A ordem dos animais e os números seguem de perto o hebraico.
