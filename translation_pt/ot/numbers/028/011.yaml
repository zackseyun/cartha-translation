  naturalness: O português é moderno, claro e adequado. «Dois touros do rebanho» e «sete cordeiros machos de um ano, sem defeito» permanecem naturais e tornam explícitas distinções presentes no hebraico.
  terminology: «Holocausto» é o equivalente sacrificial consolidado para עֹלָה. «Yahweh» reproduz de modo consistente o nome divino adotado no projeto. «Sem defeito» traduz com precisão o requisito ritual de תְּמִימִם.
