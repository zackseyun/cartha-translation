base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: pt
  text: 'E as suas ofertas de bebida serão de vinho: meio him para o novilho, um terço de him para o carneiro e um quarto de him para o cordeiro. Este é o holocausto da lua nova[a], em cada mês, ao longo dos meses do ano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o holocausto do mês» ou «o holocausto mensal». A palavra hebraica חֹדֶשׁ pode significar tanto «lua nova» como «mês»; neste contexto, a expressão se refere à celebração do início de cada mês.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: as ofertas derramadas que os acompanham
  rationale: נֶסֶךְ designa uma oferta líquida vertida no culto. «Oferta derramada» é clara em português moderno, e o pronome possessivo é explicitado de modo natural como referência aos animais sacrificados mencionados no contexto.
- source_word: חֲצִי הַהִין
  choice: meio him
  rationale: Mantém a antiga unidade de medida sem conversão conjectural e reproduz diretamente a fração hebraica.
- source_word: לַפָּר
  choice: para o novilho
  rationale: O substantivo singular com artigo aponta para o bovino sacrificial especificado no contexto; «novilho» é a designação tradicional e natural nesse contexto.
- source_word: וּשְׁלִישִׁת הַהִין
  choice: um terço de him
  rationale: Equivalência natural e precisa da expressão fracionária hebraica.
- source_word: לָאַיִל
  choice: para o carneiro
  rationale: Conserva o singular definido usado para o animal sacrificial especificado.
- source_word: וּרְבִיעִת הַהִין
  choice: um quarto de him
  rationale: Reproduz de forma clara e próxima a fração expressa no hebraico.
- source_word: לַכֶּבֶשׂ
  choice: para o cordeiro
  rationale: Conserva o singular definido e a terminologia sacrificial corrente.
- source_word: יָיִן
  choice: serão de vinho
  rationale: O termo, colocado depois das quantidades no hebraico, identifica a substância das ofertas derramadas; sua antecipação em português evita a construção pouco natural de acrescentar «de vinho» ao fim de toda a lista.
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: Este é o holocausto da lua nova
  rationale: No contexto cultual de Números 28:11-15, חֹדֶשׁ designa de modo natural a lua nova, isto é, o início do mês. A tradução mantém essa referência ritual sem eliminar a polissemia do termo, registrada em nota.
- source_word: בְּחָדְשׁוֹ
  choice: a ser oferecido a cada mês
  rationale: A expressão literalmente significa «em seu mês»; a formulação distributiva comunica em português a repetição da oferta em cada mês.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: ao longo dos meses do ano
  rationale: Expressa de modo idiomático a recorrência durante todo o ciclo anual.
theological_decisions:
- issue: Sentido de חֹדֶשׁ na designação da oferta
  choice: lua nova
  alternative: mês; oferta mensal
  rationale: O contexto imediato prescreve a oferta do início de cada mês, favorecendo «lua nova», mas o substantivo também pode significar «mês». A alternativa lexical é preservada em nota, sem converter a frase numa afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém «him» como unidade antiga e usa «holocausto» no sentido técnico de oferta totalmente queimada. A ordem da primeira oração foi ajustada para que «de vinho» modifique claramente todas as ofertas derramadas.
