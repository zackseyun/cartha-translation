  text: וַ/עֲשִׂירִ֧ית הָ/אֵיפָ֛ה סֹ֖לֶת לְ/מִנְחָ֑ה בְּלוּלָ֛ה בְּ/שֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: pt
  text: e um décimo de efa de farinha fina para oferta de cereal, misturada com um quarto de him de azeite de olivas trituradas.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa e him são antigas unidades israelitas de medida.
    reason: cultural_note
  - marker: b
    text: 'Ou: “azeite de olivas prensadas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית
  choice: e um décimo
  rationale: O waw liga esta quantidade à prescrição sacrificial anterior; “e um décimo” é natural e mantém a continuidade sintática.
- source_word: הָאֵיפָה
  choice: de efa
  rationale: Efa é uma antiga unidade israelita para secos. A transliteração preserva a especificidade histórica do texto sem impor uma conversão moderna incerta.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: A expressão designa farinha finamente moída, própria para ofertas; esta formulação é clara e corrente em português.
- source_word: לְמִנְחָה
  choice: para oferta de cereal
  rationale: Neste contexto sacerdotal, מִנְחָה designa especificamente uma oferta feita de produto cerealífero, não apenas uma dádiva genérica.
- source_word: בְּלוּלָה
  choice: misturada
  rationale: O particípio passivo descreve a farinha combinada com o azeite; “misturada” é idiomático e concorda com “farinha”.
- source_word: בְּשֶׁמֶן
  choice: com ... azeite
  rationale: A preposição indica a substância com que a farinha é misturada. “Azeite” é a designação natural em português para óleo de oliva neste contexto.
- source_word: כָּתִית
  choice: azeite de olivas trituradas
  rationale: O adjetivo descreve azeite obtido de olivas esmagadas ou trituradas. A formulação evita o pouco natural “azeite batido” e mantém explícito o método indicado pelo hebraico.
- source_word: רְבִיעִת הַהִין
  choice: um quarto de him
  rationale: A expressão indica uma fração da antiga medida líquida; “um quarto” é idiomático, e “him” preserva a unidade histórica.
