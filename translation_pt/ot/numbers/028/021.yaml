  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: pt
  text: Você preparará um décimo de efa para cada cordeiro[a], para os sete cordeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “um décimo, um décimo você preparará para o cordeiro, para os sete cordeiros”. A repetição tem sentido distributivo: um décimo para cada cordeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: um décimo de efa para cada
  rationale: 'A repetição do substantivo singular tem sentido distributivo: um décimo para cada animal. No contexto imediato das ofertas de cereal, trata-se da medida padrão equivalente a um décimo de efa; explicitar “de efa” torna a unidade compreensível em português.'
- source_word: תַּעֲשֶׂה
  choice: você preparará
  rationale: Embora עשה signifique literalmente “fazer”, “preparar” é natural para a porção prescrita da oferta e evita restringir o verbo ao ato de apresentá-la.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para cada cordeiro
  rationale: O singular definido com o numeral, após a repetição distributiva, indica a porção destinada individualmente a cada animal.
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: para os sete cordeiros
  rationale: Preserva a referência explícita ao conjunto completo dos sete animais.
