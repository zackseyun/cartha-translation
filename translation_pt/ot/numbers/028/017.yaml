base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: pt
  text: No décimo quinto dia deste mês, haverá uma festa[a]; durante sete dias, comer-se-á pão sem fermento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma festividade”. O hebraico חָג pode designar uma festa religiosa, especialmente uma festividade solene.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: No décimo quinto dia
  rationale: A conjunção e a preposição introduzem a expressão temporal; em português corrente, o ordinal expressa naturalmente o hebraico literal “no dia quinze”.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: deste mês
  rationale: Em contexto de calendário, חֹדֶשׁ significa normalmente “mês”; “deste mês” é claro e natural.
- source_word: חָג
  choice: haverá uma festa
  rationale: חָג designa uma festa ou celebração religiosa. A construção nominal hebraica exige em português uma formulação verbal natural; “haverá” preserva o sentido sem identificar desnecessariamente uma modalidade específica.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: A expressão indica a duração da observância; “durante” comunica esse intervalo com clareza.
- source_word: מַצּוֹת
  choice: pão sem fermento
  rationale: O plural hebraico refere-se ao pão não fermentado próprio desta celebração. A formulação é transparente para leitores modernos e evita um empréstimo pouco conhecido.
- source_word: יֵאָכֵל
  choice: se comerá
  rationale: O Nifal imperfeito tem forma passiva e, neste contexto legal, expressa a prática prescrita. A passiva pronominal portuguesa mantém a impessoalidade e a força instrutiva sem acrescentar um modal explícito.
