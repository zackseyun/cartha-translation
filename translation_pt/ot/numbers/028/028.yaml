base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: pt
  text: 'E a oferta de cereal deles será de farinha fina misturada com azeite: três décimos para cada novilho[a] e dois décimos para cada carneiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “três medidas de um décimo” e “duas medidas de um décimo”; neste contexto sacrificial, entende-se geralmente que eram décimos de um efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: E a oferta de cereal deles será
  rationale: No contexto sacrificial, מִנְחָה designa uma oferta de cereal. O verbo “será” é suprido para expressar naturalmente em português a oração nominal hebraica.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o ingrediente de qualidade especificado regularmente nas ofertas de cereal.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo indica que a farinha foi preparada mediante mistura com óleo; “azeite” é a designação natural neste contexto bíblico.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: três décimos
  rationale: O hebraico indica três unidades de um décimo; o referente convencional, um efa, é esclarecido em nota sem ser acrescentado ao texto principal.
- source_word: לַפָּר הָאֶחָד
  choice: para o novilho
  rationale: פַּר é um bovino macho destinado ao sacrifício. Em português, o artigo definido já expressa naturalmente a referência ao único novilho prescrito, sem a rigidez de “o um novilho”.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos
  rationale: Preserva de modo conciso as duas unidades de um décimo mencionadas no hebraico.
- source_word: לָאַיִל הָאֶחָד
  choice: para o carneiro
  rationale: אַיִל significa “carneiro”. O artigo definido representa naturalmente em português o animal único da prescrição.
