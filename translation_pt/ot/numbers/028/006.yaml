  text: עֹלַ֖ת תָּמִ֑יד הָ/עֲשֻׂיָה֙ בְּ/הַ֣ר סִינַ֔י לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: pt
  text: Este é o holocausto regular[a], feito no Monte Sinai[b], para aroma agradável[c], uma oferta apresentada pelo fogo[d] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “holocausto contínuo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferecido no Monte Sinai”. O particípio hebraico significa literalmente “feito”, mas, neste contexto, pode se referir à oferta instituída ali.
    reason: alternative_reading
  - marker: c
    text: Ou “aroma suave” ou “aroma apaziguador”.
    reason: lexical_alternative
  - marker: d
    text: Tradicionalmente, “uma oferta feita pelo fogo”. O sentido exato do termo hebraico é discutido; também pode funcionar como designação técnica de uma oferta sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת
  choice: holocausto
  rationale: Termo cultual consagrado em português para a oferta inteiramente queimada; é mais natural e reconhecível do que uma tradução etimológica como “oferta de ascensão”.
- source_word: תָּמִיד
  choice: regular
  rationale: No contexto sacrificial, indica a oferta apresentada de modo recorrente e estabelecido. “Regular” expressa essa periodicidade sem sugerir necessariamente uma ação ininterrupta.
- source_word: הָעֲשֻׂיָה
  choice: feito
  rationale: Reproduz diretamente o particípio passivo “feito/preparado”. O contexto pode apontar para a instituição da oferta no Sinai, mas essa interpretação não é incorporada silenciosamente ao texto principal.
- source_word: בְּהַר סִינַי
  choice: no monte Sinai
  rationale: Equivalente locativo natural em português, preservando a possibilidade de referência ao que foi feito ou instituído no Sinai.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: Expressa de modo claro o idioma sacrificial de aceitação por Deus, preservando a imagem olfativa do hebraico.
- source_word: אִשֶּׁה
  choice: uma oferta de alimento
  rationale: No uso sacerdotal, o termo pode designar uma dádiva sacrificial apresentada a Deus como alimento. A tradução tradicional ligada ao fogo é preservada em nota por causa da incerteza lexical.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém a direção da oferta expressa pela preposição e representa diretamente o nome divino יהוה.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido do idioma cultual רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador; aroma suave
  rationale: Preserva a imagem sacrificial e comunica aceitação divina sem impor uma teoria específica de apaziguamento.
- issue: Referência de הָעֲשֻׂיָה ao Sinai
  choice: feito no monte Sinai
  alternative: instituído no monte Sinai; oferecido no monte Sinai
  rationale: A formulação mais direta mantém aberta a tensão entre o sentido literal de algo feito/oferecido ali e a provável referência contextual à instituição da oferta no Sinai.
translation_notes:
  register: Português moderno, claro e solene, com vocabulário cultual reconhecível. A ordem da frase acompanha de perto o hebraico, enquanto as notas preservam ambiguidades lexicais e contextuais relevantes.
