  - severity: low
    issue: Grafia de “Monte Sinai”
    rationale: Como nome próprio geográfico, “Monte Sinai” normalmente se escreve com inicial maiúscula em português.
  - severity: low
    issue: “como aroma agradável”
    rationale: A preposição לְ é mais diretamente refletida por “para aroma agradável”. A alteração melhora a correspondência formal sem sacrificar a naturalidade.
