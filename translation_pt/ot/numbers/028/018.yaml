base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/018.yaml
  text: On the first day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: pt
  text: No primeiro dia haverá uma santa convocação[a]; vocês não farão nenhum trabalho habitual[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma assembleia sagrada”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nenhum trabalho de serviço”; isto é, nenhum trabalho ocupacional comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: No primeiro dia
  rationale: Reproduz diretamente a expressão temporal definida com o ordinal, sem acrescentar “da festa”, que está implícito no contexto, mas não aparece no versículo.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: Preserva tanto o caráter sagrado quanto a ideia de uma reunião oficialmente convocada, própria desta expressão cultual fixa.
- source_word: כָּל ... לֹא
  choice: nenhum
  rationale: Em português, a proibição total é expressa naturalmente por “nenhum” diante do sintagma nominal.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: trabalho habitual
  rationale: A expressão designa trabalho comum de serviço ou ocupação, vedado no dia festivo, e não necessariamente toda e qualquer atividade. “Habitual” comunica isso com clareza sem o tom arcaico ou socialmente ambíguo de “servil”.
- source_word: לֹא תַעֲשׂוּ
  choice: vocês não farão
  rationale: O imperfeito de segunda pessoa do plural tem força prescritiva no contexto legal; o futuro em português conserva o tom solene da instrução e torna explícito o destinatário coletivo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Santa convocação” mantém o registro litúrgico e a nuance de chamamento; “trabalho habitual” evita sugerir que apenas atividades fisicamente extenuantes fossem proibidas.
