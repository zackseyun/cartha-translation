  text: מִ/לְּ/בַד֙ עֹלַ֣ת הַ/בֹּ֔קֶר אֲשֶׁ֖ר לְ/עֹלַ֣ת הַ/תָּמִ֑יד תַּעֲשׂ֖וּ אֶת אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/023.yaml
  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: pt
  text: Além do holocausto regular da manhã, ofereçam estes sacrifícios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: Além de
  rationale: A expressão indica que os sacrifícios festivos são adicionais à oferta regular; “além de” é claro e natural em português.
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: o holocausto regular da manhã
  rationale: A oração relativa identifica o holocausto matutino como parte da oferta contínua ou regular, sem sugerir que um sacrifício seja oferecido em favor de outro.
- source_word: תַּעֲשׂוּ
  choice: ofereçam
  rationale: Embora o verbo hebraico signifique literalmente “fazer”, no contexto de instruções sacrificiais “oferecer” comunica naturalmente a ação pretendida.
- source_word: אֶת אֵלֶּה
  choice: estes
  rationale: O demonstrativo retoma os sacrifícios prescritos nos versículos anteriores; o masculino concorda com “sacrifícios” subentendido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativo dirigido à comunidade. “Holocausto” preserva o termo sacrificial tradicional e amplamente compreendido; “regular” expressa o caráter contínuo da oferta diária.
