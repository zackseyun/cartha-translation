  text: וּ/בַ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֑דֶשׁ פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/016.yaml
  text: In the first month[a], on the fourteenth day of the month, is the Passover of Yahweh.
translation:
  language: pt
  text: No primeiro mês, no décimo quarto dia do mês, é a Páscoa de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para Yahweh”. A preposição hebraica pode expressar dedicação ou pertencimento.
    reason: alternativa lexical
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: No primeiro mês
  rationale: A expressão preserva a indicação temporal; a conjunção inicial pode ficar implícita para produzir português natural, sem perda de conteúdo.
- source_word: בְּ/אַרְבָּעָה עָשָׂר י֖וֹם לַ/חֹ֑דֶשׁ
  choice: no décimo quarto dia do mês
  rationale: Reproduz com clareza e naturalidade a fórmula hebraica de data.
- source_word: פֶּ֖סַח
  choice: Páscoa
  rationale: É o termo português consagrado para a celebração designada por פֶּסַח; “sacrifício pascal” restringiria indevidamente o sentido.
- source_word: לַ/יהוָֽה
  choice: de Yahweh
  rationale: A formulação indica a relação da Páscoa com Yahweh em português natural. Como a preposição ל pode também expressar destinação ou dedicação, a alternativa é preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Relação expressa por ל em לַיהוָה
  choice: de Yahweh
  alternative: para Yahweh
  rationale: “De Yahweh” é idiomático para nomear a celebração ligada a ele, enquanto “para Yahweh” ressalta dedicação ou destinação. A nota mantém essa ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Celebra-se” torna natural em português a oração nominal hebraica no contexto do calendário cultual, sem especificar indevidamente se פֶּסַח designa apenas a festa ou apenas a oferta.
