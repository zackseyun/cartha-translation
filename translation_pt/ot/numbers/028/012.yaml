  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: pt
  text: e três décimos de efa de farinha fina como oferta de cereal[a], misturada com azeite, para cada novilho; e dois décimos de efa de farinha fina como oferta de cereal, misturada com azeite[b], para o carneiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “três décimos” e “dois décimos”; entende-se que a medida é em décimos de efa.
    reason: cultural_note
  - marker: b
    text: Ou “mesclada com azeite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: e três décimos de efa
  rationale: עֶשְׂרוֹן designa uma medida de um décimo, entendida neste contexto cultual como um décimo de efa; explicitar a unidade torna a prescrição compreensível.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente corrente e claro para a farinha refinada usada nas ofertas.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Neste contexto sacrificial, o termo se refere especificamente a uma oferta preparada com cereal, e não simplesmente a uma dádiva ou tributo.
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: amassada com azeite
  rationale: O particípio descreve a farinha combinada integralmente com azeite. 'Amassada' é natural no contexto de preparação de farinha e preserva a alternativa lexical em nota.
- source_word: לַ/פָּר הָ/אֶחָד
  choice: para cada novilho
  rationale: O artigo com אֶחָד individualiza o animal e tem força distributiva no contexto; 'cada novilho' comunica isso naturalmente sem interpretar אֶחָד como ordinal.
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: e dois décimos de efa
  rationale: Como na expressão anterior, a unidade subentendida é explicitada para maior clareza.
- source_word: לָ/אַיִל הָ/אֶחָד
  choice: para o carneiro
  rationale: O contexto imediato menciona um único carneiro (v. 11), de modo que o artigo definido é natural em português e evita o pouco idiomático 'o único carneiro'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual acessível. 'Efa' preserva a unidade antiga; a nota explica os décimos. A formulação distributiva 'cada novilho' acompanha o contexto de dois novilhos, enquanto 'o carneiro' reflete o único carneiro prescrito no versículo anterior.
