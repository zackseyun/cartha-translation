  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: pt
  text: E você oferecerá o segundo cordeiro entre as tardes[a]. Conforme a oferta de cereal da manhã e a sua oferta de bebida, você o oferecerá como oferta feita no fogo[b], de aroma agradável a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as tardes”, expressão tradicional muitas vezes entendida como “ao entardecer”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta de alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: o segundo cordeiro
  rationale: Em contexto sacrificial, כֶּבֶשׂ designa normalmente um cordeiro; “segundo” mantém a sequência com a oferta da manhã.
- source_word: תַּעֲשֶׂה
  choice: você oferecerá
  rationale: Embora o verbo signifique literalmente “fazer”, neste contexto ritual “oferecer” expressa com naturalidade a ação sacrificial.
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre as tardes
  rationale: A formulação relativamente literal preserva a expressão temporal hebraica e sua imprecisão debatida; a interpretação usual aparece em nota.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: como a oferta de cereal da manhã
  rationale: No contexto sacerdotal, מִנְחָה indica especificamente uma oferta de cereal, e não uma oferta genérica.
- source_word: וּכְנִסְכּוֹ
  choice: e a oferta de bebida que a acompanha
  rationale: נֶסֶךְ é a oferta líquida derramada; a oração explicita em português natural que ela acompanha o sacrifício da manhã.
- source_word: אִשֵּׁה
  choice: oferta feita no fogo
  rationale: A expressão conserva de modo acessível a associação lexical com o fogo, sem recorrer ao pouco comum “oferta ígnea”.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Mantém a metáfora da fórmula sacrificial em linguagem portuguesa natural e digna.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de representar o nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome da aliança diretamente; “Yahweh” o representa sem substituí-lo por um título.
- issue: Sentido temporal de בֵּין הָעַרְבָּיִם
  choice: entre as tardes
  alternative: ao entardecer
  rationale: O alcance temporal exato da expressão é discutido. A tradução principal preserva a forma e a ambiguidade do hebraico, enquanto a nota fornece a compreensão idiomática tradicional.
- issue: Sentido sacrificial de אִשֵּׁה
  choice: oferta feita no fogo
  alternative: oferta de alimento
  rationale: A escolha principal torna visível a relação tradicional do termo com o fogo; a alternativa contextual é registrada sem resolver silenciosamente a questão lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para a instrução no singular e evita vocabulário ritual excessivamente técnico. A repetição estrutural do hebraico é mantida, mas a relação da oferta de bebida com a oferta matinal é explicitada para maior clareza.
