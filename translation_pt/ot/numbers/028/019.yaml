  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: pt
  text: 'E vocês apresentarão uma oferta pelo fogo[a], um holocausto a Yahweh: dois novilhos, um carneiro e sete cordeiros de um ano; eles deverão ser sem defeito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma oferta queimada”. O hebraico emprega um termo sacrificial técnico relacionado a uma oferta apresentada pelo fogo; aqui, “holocausto” especifica o tipo de oferta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: E vocês apresentarão
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer; “apresentarão” preserva o sentido cultual em português natural.
- source_word: אִשֶּׁה
  choice: uma oferta queimada
  rationale: Termo sacrificial técnico para uma oferta consumida ou transformada em fumaça pelo fogo. A tradução evita confundi-lo com alimento e mantém a relação explícita com o fogo.
- source_word: עֹלָה
  choice: um holocausto
  rationale: “Holocausto” é o termo sacrificial português estabelecido para a oferta inteiramente consumida no altar.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário ou a dedicação da oferta, e o nome da aliança é transliterado como Yahweh.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dois novilhos
  rationale: A expressão designa bovinos machos para o sacrifício; “novilhos” é conciso e idiomático, embora a idade não seja especificada com precisão nesta expressão.
- source_word: וְאַיִל אֶחָד
  choice: um carneiro
  rationale: Equivalente português comum e preciso para אַיִל em listas sacrificiais.
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: e sete cordeiros de um ano
  rationale: כְבָשִׂים indica cordeiros machos no contexto, e בְּנֵי שָׁנָה especifica animais de um ano; em português, “cordeiros” já tem forma masculina.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: eles deverão ser sem defeito
  rationale: תָּמִים, em contexto sacrificial, indica ausência de defeito. A construção com לָכֶם expressa a exigência imposta aos ofertantes; “deverão” comunica essa obrigação naturalmente sem acrescentar um “para vocês” pouco idiomático.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” preserva de modo transparente o nome da aliança sem substituí-lo por um título.
- issue: Relação entre אִשֶּׁה e עֹלָה
  choice: “oferta queimada”, seguida de “um holocausto” em aposição
  alternative: “oferta de alimento, um holocausto”; ou tratar as expressões como duas ofertas distintas
  rationale: A sintaxe apresenta עֹלָה como especificação do termo sacrificial mais amplo אִשֶּׁה. A tradução mantém a aposição e não cria duas ofertas separadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a cadência prescritiva da legislação cultual e evita arcaísmos desnecessários.
