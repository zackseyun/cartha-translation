    issue: Redundância e imprecisão de «oferta queimada, um holocausto».
    rationale: אִשֶּׁה é um termo técnico ligado ao fogo, enquanto עֹלָה especifica o holocausto. Em português, «oferta queimada» e «holocausto» soam quase sinônimos; «oferta pelo fogo, um holocausto» preserva melhor a progressão do hebraico.
