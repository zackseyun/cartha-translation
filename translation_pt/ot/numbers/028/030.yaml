  text: and one male goat to make atonement for you[a].
translation:
  language: pt
  text: e um bode, para fazer expiação por vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão designa um caprino macho; “bode” comunica isso de modo natural e preciso em português.
- source_word: אֶחָד
  choice: um
  rationale: O numeral indica um único animal.
- source_word: לְכַפֵּר
  choice: para fazer expiação
  rationale: Preserva o sentido sacrificial de כפר sem impor uma teoria específica da expiação.
- source_word: עֲלֵיכֶם
  choice: por vocês
  rationale: Com כפר, a preposição indica as pessoas em favor de quem se faz expiação; “por vocês” é claro e idiomático.
theological_decisions:
- issue: Categoria sacrificial implícita no contexto, mas não expressa nesta oração
  choice: Não acrescentar “como oferta pelo pecado” ao texto
  alternative: “e um bode como oferta pelo pecado, para fazer expiação por vocês”
  rationale: Embora o contexto identifique a função sacrificial do bode, a oração hebraica diz apenas “um bode” e apresenta a finalidade de fazer expiação. A tradução preserva essa elipse em vez de explicitar no corpo do texto uma informação contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção breve conserva a forma elíptica do hebraico.
