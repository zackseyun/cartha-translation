  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: pt
  text: 'E vocês apresentarão a Yahweh, como aroma agradável[a], um holocausto: dois touros do rebanho, um carneiro e sete cordeiros machos de um ano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para um aroma suave”. A fórmula sacrificial hebraica também pode ser traduzida como “para aroma agradável”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: vocês apresentarão
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer. “Apresentarão” conserva o sentido ritual e soa natural em português.
- source_word: עוֹלָה
  choice: um holocausto
  rationale: “Holocausto” é o termo sacrificial tradicional e reconhecível em português para a oferta totalmente queimada; uma tradução etimológica como “oferta ascendente” obscureceria a categoria ritual.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: A expressão sacrificial indica que a oferta é aceita favoravelmente. “Aroma agradável” preserva a imagem concreta e a formulação bíblica sem explicá-la em excesso.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino יהוה, preservando o nome da aliança expresso diretamente no texto hebraico.
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: dois novilhos
  rationale: No contexto das ofertas, a expressão designa dois bovinos machos; “novilhos” é uma formulação portuguesa natural e consagrada, embora a idade exata não seja explicitada aqui.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: Equivalente direto e natural para o animal sacrificial macho adulto.
- source_word: שִׁבְעָה כְבָשִׂים
  choice: sete cordeiros
  rationale: O substantivo hebraico masculino indica cordeiros machos; em português, “cordeiros” já expressa gramaticalmente o masculino sem precisar acrescentar “machos”.
- source_word: בְּנֵי שָׁנָה
  choice: de um ano
  rationale: Expressão idiomática e precisa para a idade prescrita dos cordeiros sacrificiais.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido da fórmula sacrificial לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  alternative: como aroma apaziguador; para aroma agradável
  rationale: A tradução mantém tanto a imagem olfativa quanto a ideia de aceitação favorável, sem decidir de modo excessivo se a nuance principal é prazer, repouso ou apaziguamento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e a lista seguem de perto o hebraico, enquanto “novilhos” evita o literalismo pouco natural de “filhos do gado”. O marcador da nota foi colocado junto de “aroma agradável”, expressão à qual a variante lexical se refere.
