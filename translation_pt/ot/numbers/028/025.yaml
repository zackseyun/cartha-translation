  text: וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/025.yaml
  text: On the seventh day you shall have a holy convocation[b][a]; you shall do no ordinary work.
translation:
  language: pt
  text: No sétimo dia, vocês terão uma santa convocação[a]; não farão nenhum trabalho comum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma assembleia sagrada” ou “uma assembleia santa”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “nenhum trabalho de labor ou serviço”, isto é, nenhum trabalho ocupacional comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: Expressa naturalmente em português a referência temporal; o וּ conjuntivo não precisa ser representado separadamente neste contexto.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: Preserva tanto o caráter sagrado quanto a ideia de uma reunião formalmente convocada, própria desta expressão cultual.
- source_word: יִהְיֶה לָכֶם
  choice: vocês terão
  rationale: Equivalente idiomático do hebraico literal 'será para vocês', mantendo o valor prescritivo do contexto.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: trabalho comum
  rationale: Indica o trabalho habitual ou ocupacional proibido no dia sagrado, sem sugerir que absolutamente toda atividade esteja vedada.
- source_word: לֹא תַעֲשׂוּ
  choice: não farão nenhum
  rationale: Formula em registro digno e claro a proibição legal dirigida à comunidade no plural.
