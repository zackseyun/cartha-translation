review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a repetição diária por sete dias, a fórmula de aceitação sacrificial, o nome Yahweh e a relação de acréscimo em relação ao holocausto regular. Contudo, “oferta derramada” não é o equivalente mais claro e estabelecido de נֶסֶךְ neste contexto; “oferta de bebida” expressa melhor a oferta líquida acompanhante. “Holocausto regular” também comunica melhor o valor cultual de הַתָּמִיד do que “contínuo”.
  naturalness: O texto é claro e de registro apropriado. A revisão reduz uma possível leitura de “contínuo” como duração ininterrupta e emprega a terminologia sacrificial portuguesa mais transparente para a libação.
  terminology: Mantêm-se “Yahweh”, “holocausto” e “aroma agradável”. “Oferta feita pelo fogo” preserva o sentido de אִשֶּׁה sem identificar indevidamente toda a oferta com um holocausto. “Oferta de bebida” é preferível a “oferta derramada” para נֶסֶךְ.
  issues:
  - severity: medium
    issue: “oferta derramada” para וְנִסְכּוֹ
    rationale: A expressão pode descrever o ato de derramar, mas não designa com clareza a oferta líquida ritual que acompanha o holocausto. “Oferta de bebida” é o equivalente moderno e transparente.
  - severity: low
    issue: “holocausto contínuo” para עֹלַת הַתָּמִיד
    rationale: Embora defensável literalmente, “contínuo” pode sugerir uma ação sem interrupção. No contexto de Números 28, trata-se da oferta diária estabelecida; “regular” comunica isso com maior naturalidade.
  revised_text: 'Assim vocês oferecerão estas coisas, em cada dia, durante sete dias: alimento, uma oferta feita pelo fogo, de aroma agradável a Yahweh; ela será oferecida além do holocausto regular e de sua oferta de bebida.'
