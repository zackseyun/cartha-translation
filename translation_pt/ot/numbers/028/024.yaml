  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: pt
  text: 'Assim vocês oferecerão estas coisas, em cada dia, durante sete dias: alimento, uma oferta feita pelo fogo, de aroma agradável a Yahweh; ela será oferecida além do holocausto regular e de sua oferta de bebida.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: Assim... estas coisas
  rationale: 'Expressa de modo natural a força comparativa de כ: as ofertas devem corresponder às especificadas nos versículos anteriores.'
- source_word: תַּעֲשׂוּ
  choice: vocês oferecerão
  rationale: Embora עשה signifique literalmente “fazer”, no contexto sacrificial “oferecer” comunica com precisão a ação cultual.
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: a cada dia, durante sete dias
  rationale: Reproduz claramente o sentido distributivo da oferta repetida em cada um dos sete dias.
- source_word: לֶחֶם אִשֵּׁה
  choice: como alimento — uma oferta feita pelo fogo
  rationale: Preserva tanto a imagem de לֶחֶם, aqui alimento sacrificial, quanto o termo técnico אִשֵּׁה, sem restringir “alimento” a pão literal.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Equivalente português corrente da fórmula sacrificial, preservando a imagem de uma oferta aceita por Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל עוֹלַת הַתָּמִיד
  choice: além do holocausto contínuo
  rationale: Neste contexto, עַל indica acréscimo; “contínuo” conserva o valor de הַתָּמִיד e sua ligação com a oferta diária regular.
- source_word: יֵעָשֶׂה
  choice: Ela será oferecida
  rationale: O passivo de עשה, em contexto sacrificial, é expresso naturalmente por “ser oferecida”; o pronome retoma a oferta mencionada.
- source_word: וְנִסְכּוֹ
  choice: e de sua oferta derramada
  rationale: נסך designa a oferta líquida vertida; “oferta derramada” é transparente e o sufixo possessivo remete ao holocausto contínuo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido da fórmula רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador
  rationale: A tradução conserva a metáfora sacrificial e a ideia de agrado/aceitação, sem introduzir a afirmação teológica mais específica de que Deus precise ser apaziguado.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural para leitores brasileiros e compreensão internacional. O travessão esclarece a aposição entre “alimento” e “oferta feita pelo fogo”. Mantém-se “holocausto” como termo sacrificial estabelecido e “oferta derramada” para tornar explícita a ação de verter o líquido.
