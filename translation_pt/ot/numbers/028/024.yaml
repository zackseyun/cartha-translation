revisions:
- from: Assim vocês oferecerão estas coisas a cada dia, durante sete dias, como alimento — uma oferta feita pelo fogo, de aroma agradável a Yahweh. Ela será oferecida além do holocausto contínuo e de sua oferta derramada.
  to: 'Assim vocês oferecerão estas coisas, em cada dia, durante sete dias: alimento, uma oferta feita pelo fogo, de aroma agradável a Yahweh; ela será oferecida além do holocausto regular e de sua oferta de bebida.'
  rationale: 'A revisão preserva o sentido comparativo e distributivo da instrução, bem como a terminologia sacrificial essencial. Substitui apenas dois termos por equivalentes portugueses mais claros no contexto cultual: “holocausto regular” e “oferta de bebida”.'
  reviewer_model: gpt-5.6-terra
