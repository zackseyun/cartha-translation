  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: pt
  text: Além do holocausto regular e de sua oferta de cereal[a], vocês oferecerão esses sacrifícios; os animais deverão ser sem defeito[b] para vocês, com suas libações[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “holocausto contínuo” ou “holocausto diário”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “eles serão para vocês íntegros”. No contexto, isso significa que os animais oferecidos não poderiam ter defeito.
    reason: lexical_alternative
  - marker: c
    text: Ou “ofertas de bebida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: Além de
  rationale: Indica que os sacrifícios deste dia são adicionais ao holocausto prescrito regularmente.
- source_word: עֹלַת הַתָּמִיד
  choice: o holocausto regular
  rationale: תָּמִיד designa aqui o holocausto contínuo, oferecido diariamente; “regular” comunica sua natureza prescrita e recorrente em português atual.
- source_word: וּמִנְחָתוֹ
  choice: e de sua oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה é a oferta de produtos agrícolas que acompanha o holocausto; “oferta de cereal” é clara e evita confusão com uma oferta genérica.
- source_word: תַּעֲשׂוּ
  choice: vocês oferecerão esses sacrifícios
  rationale: Embora עשה signifique literalmente “fazer”, no contexto sacrificial pode indicar realizar ou oferecer. O objeto implícito retoma os sacrifícios prescritos nos versículos anteriores.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: os animais deverão ser sem defeito
  rationale: תְּמִימִם, na legislação sacrificial, qualifica animais livres de defeito. A explicitação de “os animais” torna claro o referente do plural e expressa naturalmente a obrigação contida na construção hebraica.
- source_word: וְנִסְכֵּיהֶם
  choice: acompanhados de suas ofertas derramadas
  rationale: נֶסֶךְ é uma oferta líquida vertida, normalmente de vinho. “Oferta derramada” descreve o rito com mais precisão que a expressão potencialmente ambígua “oferta de bebida”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas compreensíveis no Brasil e em outros contextos lusófonos. Mantém a terminologia sacrificial tradicional onde ela é transparente, mas explicita o referente plural de תְּמִימִם para evitar que “sem defeito” pareça qualificar também as ofertas vegetais ou líquidas.
