  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: pt
  text: 'Ordene aos filhos de Israel[a] e diga-lhes: “Tenham o cuidado de apresentar-me, no tempo determinado, a minha oferta, o meu alimento para as minhas ofertas pelo fogo[b], o meu aroma agradável[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos israelitas”. Literalmente: “aos filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ofertas feitas pelo fogo”. O termo hebraico designa ofertas sacrificiais associadas ao fogo do altar.'
    reason: lexical_alternative
  - marker: c
    text: “Aroma agradável” é uma expressão sacrificial recorrente para indicar uma oferta aceita por Deus.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Ordene
  rationale: O imperativo de צוה expressa uma ordem forte dada a Moisés; “ordene” preserva essa força.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Mantém de modo transparente a forma masculina coletiva do hebraico, enquanto a nota oferece a formulação portuguesa mais fluente.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Reproduz com naturalidade a sequência direta do hebraico.
- source_word: קָרְבָּנִי
  choice: a minha oferta
  rationale: קרבן é o termo geral para algo apresentado a Deus; “oferta” é claro e adequado ao contexto sacrificial.
- source_word: לַחְמִי
  choice: o meu alimento
  rationale: Embora לֶחֶם possa significar literalmente “pão”, aqui designa de modo mais amplo o alimento sacrificial e preserva a linguagem concreta do texto.
- source_word: לְאִשַּׁי
  choice: para as minhas ofertas queimadas
  rationale: אִשֶּׁה é um termo sacrificial ligado ao fogo do altar. “Ofertas queimadas” comunica essa associação sem sugerir que se trata apenas de pão.
- source_word: רֵיחַ נִיחֹחִי
  choice: o meu aroma agradável
  rationale: Preserva a expressão sacrificial concreta que indica uma oferta aceita e agradável a Deus.
- source_word: תִּשְׁמְרוּ לְהַקְרִיב לִי
  choice: Tenham o cuidado de apresentar-me
  rationale: שמר com o infinitivo transmite observância cuidadosa, e הקריב no contexto cultual significa apresentar ou oferecer.
- source_word: בְּמוֹעֲדוֹ
  choice: no tempo determinado
  rationale: מוֹעֵד indica o momento estabelecido para a oferta; a formulação é natural em português e não força uma referência exclusiva a uma festa.
theological_decisions:
- issue: 'Linguagem sacrificial antropomórfica: “meu alimento” e “meu aroma agradável”'
  choice: Manter a linguagem concreta da aliança e do culto
  alternative: Parafrasear como “as ofertas que me são aceitáveis”
  rationale: O hebraico emprega deliberadamente imagens concretas. Mantê-las evita apagar a tensão do texto ou substituir tradução por explicação; a nota esclarece o caráter formular da expressão.
- issue: Designação coletiva masculina בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução principal conserva a forma do hebraico, enquanto a nota registra a equivalência coletiva natural em português.
- issue: Relação entre קָרְבָּנִי, לַחְמִי, לְאִשַּׁי e רֵיחַ נִיחֹחִי
  choice: Preservar a sequência de expressões em aposição
  alternative: Reestruturar interpretativamente como “minhas ofertas queimadas, que são meu alimento e têm aroma agradável”
  rationale: A construção hebraica acumula designações da oferta. A tradução mantém essa densidade e evita definir de modo excessivo as relações sintáticas entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem hebraica foi levemente ajustada apenas onde necessário para a fluência. Os pronomes átonos em “diga-lhes” e “apresentar-me” mantêm um registro formal corrente, sem arcaísmo excessivo.
