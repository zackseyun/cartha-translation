base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: pt
  text: e um bode para oferta pelo pecado[a], para fazer expiação por vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «oferta de purificação». O termo hebraico traduzido como «oferta pelo pecado» também pode, em contextos sacrificiais, ser entendido como «oferta de purificação».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: e um bode
  rationale: שָׂעִיר designa um bode, isto é, um caprino macho; o וּ inicial é preservado como «e». Em português, «bode» já expressa o sexo do animal, e «um» traduz naturalmente o numeral ligado à expressão.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta, não apenas o pecado em sentido abstrato. «Oferta pelo pecado» é clara e tradicional, enquanto a alternativa «oferta de purificação» é preservada em nota.
- source_word: אֶחָד
  choice: um
  rationale: O numeral especifica a quantidade do animal sacrificial. Em português, ele aparece naturalmente antes de «bode».
- source_word: לְ/כַפֵּר
  choice: para fazer expiação
  rationale: No contexto sacerdotal e sacrificial, כפר tem força cultual. «Fazer expiação» preserva essa densidade teológica sem impor uma teoria específica sobre o mecanismo da expiação.
- source_word: עֲלֵי/כֶם
  choice: por vocês
  rationale: Neste contexto, עַל com o sufixo da segunda pessoa plural indica benefício ou representação. «Por vocês» é natural, claro e compatível com a fórmula sacrificial.
theological_decisions:
- issue: Tradução da linguagem sacrificial de כפר
  choice: para fazer expiação por vocês
  alternative: para expiar por vocês
  rationale: «Fazer expiação» conserva o peso cultual e teológico da expressão hebraica sem restringi-la a uma explicação doutrinária específica.
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O texto se refere a um sacrifício prescrito. A tradução principal mantém a designação tradicional e inteligível, enquanto a nota registra a alternativa lexical legítima sem resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém a ligação sintática com o contexto anterior por meio de «e» e preserva a terminologia sacrificial sem explicação denominacional.
