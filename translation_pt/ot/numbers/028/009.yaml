  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: pt
  text: E, no sábado, ofereçam dois cordeiros de um ano, sem defeito, dois décimos de efa[a] de farinha fina como oferta de cereais, misturada com azeite, e sua oferta de bebida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dois décimos”; na legislação sacrificial, isso significa dois décimos de efa.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “e sua libação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: E, no dia de sábado
  rationale: Preserva a conjunção que liga esta instrução às ofertas anteriores e expressa naturalmente a circunstância temporal.
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: dois cordeiros machos de um ano
  rationale: כְבָשִׂים designa cordeiros, e a forma masculina é relevante na legislação sacrificial; a expressão idiomática בְּנֵי שָׁנָה indica animais de um ano.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No contexto sacrificial, o termo indica animais livres de defeito físico, não perfeição em sentido abstrato.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos de efa
  rationale: A medida é literalmente composta de dois décimos; na legislação das ofertas, entende-se que são décimos de efa. A unidade é explicitada para dar clareza.
- source_word: סֹלֶת מִנְחָה
  choice: farinha fina como oferta de cereal
  rationale: סֹלֶת é farinha finamente moída, e מִנְחָה, neste contexto sacerdotal, é especificamente uma oferta feita de cereal.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Expressa de modo natural a combinação da farinha ou oferta com óleo; 'azeite' é a designação portuguesa usual para o óleo empregado nesse contexto.
- source_word: וְנִסְכּוֹ
  choice: e a oferta de bebida correspondente
  rationale: נֶסֶךְ é o líquido derramado como acompanhamento sacrificial; 'correspondente' representa o sufixo possessivo sem sugerir que a bebida pertença literalmente aos cordeiros.
- source_word: estrutura verbal implícita
  choice: ofereçam
  rationale: Embora este versículo apresente uma construção nominal, o verbo é recuperado das instruções sacrificiais anteriores. Explicitá-lo produz português natural e mantém a força prescritiva do contexto.
