  register: Português moderno, claro e digno, com vocabulário sacrificial consistente. O verbo implícito foi explicitado no plural para tornar a prescrição natural em português, sem alterar seu conteúdo. Os marcadores foram posicionados junto aos termos que realmente explicam.
