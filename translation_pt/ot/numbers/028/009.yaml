revisions:
- from: E, no dia de sábado, ofereçam dois cordeiros machos de um ano, sem defeito, dois décimos de efa[a] de farinha fina como oferta de cereal, misturada com azeite, e a oferta de bebida correspondente[b].
  to: E, no sábado, ofereçam dois cordeiros de um ano, sem defeito, dois décimos de efa[a] de farinha fina como oferta de cereais, misturada com azeite, e sua oferta de bebida[b].
  rationale: A revisão remove a especificação indevida de sexo dos cordeiros, ajusta a formulação temporal ao uso moderno e restaura de modo mais direto o possessivo do termo hebraico para a oferta líquida. As notas permanecem ancoradas nos termos que esclarecem e preservam a alternativa lexical.
