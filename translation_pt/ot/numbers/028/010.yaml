base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: pt
  text: O holocausto do sábado será oferecido em cada sábado, além do holocausto contínuo e de sua libação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: holocausto
  rationale: No contexto sacrificial, עֹלָה designa a oferta inteiramente queimada. “Holocausto” é o termo cultual consagrado em português e evita confusão com sacrifícios apenas parcialmente queimados.
- source_word: שַׁבַּת
  choice: sábado
  rationale: Neste calendário sacrificial, שַׁבָּת refere-se ao dia de sábado, não à semana em geral.
- source_word: בְּשַׁבַּתּוֹ
  choice: no próprio sábado
  rationale: A expressão hebraica associa distributivamente o holocausto sabático ao sábado correspondente. A formulação preserva essa relação sem o pouco natural “no seu sábado”.
- source_word: עַל
  choice: além de
  rationale: Neste contexto ritual, עַל indica que o sacrifício sabático se acrescenta à oferta regular, e não que é colocado fisicamente sobre ela.
- source_word: הַתָּמִיד
  choice: contínuo
  rationale: תָּמִיד descreve a oferta prescrita de modo contínuo e regular. “Holocausto contínuo” conserva o vínculo terminológico com a linguagem cultual do capítulo.
- source_word: וְנִסְכָּהּ
  choice: e da oferta derramada que o acompanha
  rationale: נֶסֶךְ é uma oferta líquida vertida. A explicitação natural do pronome feminino hebraico deixa claro que ela acompanha o holocausto contínuo.
