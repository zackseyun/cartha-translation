  source_fidelity: 'O texto traduz com fidelidade os elementos essenciais do hebraico: a ordem dirigida a Moisés para falar ao povo, a oferta cultual (אִשֶּׁה), a apresentação a Yahweh, dois cordeiros machos de um ano sem defeito, a periodicidade diária e o holocausto regular. A antecipação de “a cada dia” é natural em português e deixa inequívoco que os dois cordeiros são exigidos diariamente.'
  naturalness: A redação é moderna, clara e adequada ao registro legislativo-cultual. “Diga-lhes” corresponde bem ao imperativo singular, enquanto “vocês apresentarão” comunica naturalmente o plural dirigido à comunidade. “Cordeiros machos de um ano, sem defeito” é idiomático e preciso.
