  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: pt
  text: 'Diga-lhes: “Esta é a oferta feita pelo fogo[a] que vocês apresentarão a Yahweh: a cada dia, dois cordeiros machos de um ano, sem defeito, como holocausto regular.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta queimada no fogo”; em linguagem sacerdotal, também pode ser entendida como “oferta de alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: a oferta feita pelo fogo
  rationale: O termo sacerdotal designa uma oferta associada ao fogo do altar. A formulação é clara em português e mantém a imagem cultual, enquanto a nota registra alternativas possíveis.
- source_word: תַּקְרִיבוּ
  choice: vocês apresentarão
  rationale: O hifil de קרב, em contexto sacrificial, indica apresentar ou oferecer algo diante de Deus; “apresentarão” preserva essa nuance ritual.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz o nome divino pessoal expresso pelo Tetragrama no texto hebraico.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: cordeiros machos de um ano
  rationale: Expressa de modo natural tanto o gênero dos animais quanto a idade indicada pelo idioma hebraico.
- source_word: תְמִימִם
  choice: sem defeito
  rationale: Na legislação sacrificial, o adjetivo exige animais livres de defeito físico, e não perfeição em sentido abstrato.
- source_word: לַיּוֹם
  choice: a cada dia
  rationale: 'A expressão tem sentido distributivo: dois animais deviam ser apresentados diariamente.'
- source_word: עֹלָה
  choice: holocausto
  rationale: É o termo cultual estabelecido em português para a oferta inteiramente consumida no altar.
- source_word: תָמִיד
  choice: regular
  rationale: Neste calendário sacerdotal, indica uma oferta recorrente e permanente, não uma ação ininterrupta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o nome da aliança. “Yahweh” preserva sua condição de nome próprio; “SENHOR” representa a tradição reverencial de leitura, mas substitui o nome por um título.
- issue: Sentido sacrificial de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A relação da oferta com o fogo do altar é o sentido lexical mais direto. A alternativa ressalta a linguagem sacerdotal que descreve certas ofertas como alimento de Deus, sem implicar que Deus necessite literalmente de comida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural dirigido à comunidade e “Diga-lhes” para o imperativo singular dirigido a Moisés. A ordem da frase foi ajustada para deixar claro que são dois cordeiros em cada dia.
