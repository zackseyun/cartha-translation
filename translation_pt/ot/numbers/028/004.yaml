base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: pt
  text: Ofereça um cordeiro pela manhã e ofereça o segundo cordeiro entre as duas tardes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “entre as duas tardes” designa um horário no fim da tarde ou ao redor do crepúsculo; seu sentido exato é discutido.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: cordeiro
  rationale: כֶּבֶשׂ designa um cordeiro, geralmente um macho jovem em contextos sacrificiais. “Cordeiro” é natural e não explicita além do verso o sexo do animal.
- source_word: אֶחָד
  choice: um
  rationale: Preserva o sentido cardinal direto de אֶחָד, sem substituí-lo por “primeiro”.
- source_word: תַּעֲשֶׂה
  choice: ofereça
  rationale: Embora עשה signifique literalmente “fazer”, no contexto sacrificial indica preparar ou oferecer o sacrifício. “Ofereça” comunica com clareza a ação ritual.
- source_word: בַבֹּקֶר
  choice: pela manhã
  rationale: Tradução idiomática e corrente de בַבֹּקֶר em português.
- source_word: הַשֵּׁנִי
  choice: o segundo
  rationale: שֵׁנִי é o ordinal “segundo” e mantém a sequência entre os dois cordeiros.
- source_word: בֵּין הָעַרְבָּיִם
  choice: entre as duas tardes
  rationale: Preserva a forma incomum e tradicional da expressão hebraica, cujo horário exato é discutido, sem resolver silenciosamente sua ambiguidade.
