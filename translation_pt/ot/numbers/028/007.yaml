  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: pt
  text: Sua oferta de bebida será de um quarto de him para cada cordeiro[a]. No lugar santo[b], derramarás para Yahweh uma oferta de bebida alcoólica[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para um cordeiro»; literalmente: «para o um cordeiro».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «No santuário».'
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica se refere a uma bebida alcoólica, geralmente distinta do vinho; o tipo exato não é especificado.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: A oferta de bebida que acompanha
  rationale: Expressa a oferta líquida associada ao sacrifício e torna explícita, em português natural, a relação indicada pelo sufixo hebraico.
- source_word: רְבִיעִת הַהִין
  choice: um quarto de him
  rationale: Preserva com precisão a fração e a antiga unidade hebraica, usando a forma tradicional portuguesa “him” sem conversão especulativa.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: cada cordeiro
  rationale: 'Embora a expressão seja literalmente “o único/um cordeiro”, o contexto lhe dá sentido distributivo: essa quantidade corresponde a cada cordeiro.'
- source_word: בַּקֹּדֶשׁ
  choice: No lugar santo
  rationale: No contexto ritual, indica o espaço sagrado; esta tradução é transparente e evita identificar de modo excessivamente específico qual área do santuário está em vista.
- source_word: הַסֵּךְ
  choice: derrame
  rationale: Verbo imperativo que descreve a ação ritual de verter a oferta líquida.
- source_word: נֶסֶךְ
  choice: uma oferta de bebida
  rationale: Mantém explícita a repetição do substantivo hebraico e comunica a natureza da oferta em linguagem compreensível.
- source_word: שֵׁכָר
  choice: bebida fermentada
  rationale: Designa uma bebida alcoólica, em geral distinta do vinho, sem especificar sua composição. “Fermentada” evita a associação moderna de “bebida forte” exclusivamente com destilados.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Preserva o nome divino presente no texto hebraico e indica o destinatário da oferta.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Identificação de שֵׁכָר
  choice: bebida fermentada
  alternative: bebida forte; cerveja
  rationale: A tradução mantém a referência a uma bebida intoxicante sem afirmar que fosse destilada nem especificar como cerveja um tipo que o versículo não identifica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Oferta de bebida” é mais transparente ao leitor comum do que “libação”; “bebida fermentada” evita a conotação moderna de bebida destilada. A sintaxe foi levemente reorganizada para tornar inequívoco que a medida se aplica a cada cordeiro.
