revisions:
- from: A oferta de bebida que acompanha cada cordeiro[a] será de um quarto de him. No lugar santo[b], derrame para Yahweh uma oferta de bebida fermentada[c].
  to: Sua oferta de bebida será de um quarto de him para cada cordeiro[a]. No lugar santo[b], derramarás para Yahweh uma oferta de bebida alcoólica[c].
  rationale: A revisão elimina a falsa nuance de exclusividade na nota a, aproxima a primeira oração da construção hebraica e ajusta o verbo para uma forma injuntiva portuguesa que corresponde ao contexto ritual. Mantêm-se a medida antiga, a ambiguidade espacial de «lugar santo», o nome Yahweh e a cautela quanto à identificação de שֵׁכָר.
