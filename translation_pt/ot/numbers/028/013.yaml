  to: e, para cada cordeiro, um décimo de efa de farinha fina, como oferta de cereal misturada com azeite; é um holocausto de aroma agradável, uma oferta apresentada pelo fogo a Yahweh.[a]
  rationale: A revisão mantém todos os elementos do hebraico e a força distributiva de «para cada cordeiro», mas separa a descrição da oferta de cereal da fórmula final sobre o holocausto. Também torna mais idiomática a expressão referente a אִשֶּׁה, preservando na nota a alternativa lexical/contextual disputada.
