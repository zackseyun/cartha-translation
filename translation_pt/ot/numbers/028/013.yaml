  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: pt
  text: e, para cada cordeiro, um décimo de efa de farinha fina, como oferta de cereal misturada com azeite; é um holocausto de aroma agradável, uma oferta apresentada pelo fogo a Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oferta de alimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: e, para cada cordeiro, um décimo de efa
  rationale: 'A repetição da medida tem força distributiva no contexto: um décimo para cada cordeiro. A explicitação de “efa” identifica a unidade subentendida pelo termo hebraico e torna a medida compreensível.'
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente claro e corrente para a farinha refinada usada nas ofertas cultuais.
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: Neste contexto sacrificial, designa especificamente uma oferta vegetal preparada com farinha, não uma oferta genérica.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Expressa de modo natural que a farinha era combinada com óleo de oliva; “azeite” é a forma comum em português neste contexto.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para cada cordeiro
  rationale: Preserva a força distributiva da expressão, especificando a quantidade de farinha correspondente a cada animal.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo sacrificial técnico para a oferta inteiramente consumida no altar; é tradicional e amplamente reconhecível em português bíblico.
- source_word: רֵיחַ נִיחֹחַ
  choice: aroma agradável
  rationale: Expressão natural que comunica a aceitação da oferta por Deus sem tornar a imagem desnecessariamente literal ou grosseira.
- source_word: אִשֶּׁה
  choice: oferta feita pelo fogo
  rationale: Preserva a relação lexical e cultual do termo com o fogo. A alternativa “oferta de alimento” é registrada em nota por refletir outra compreensão contextual possível.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Translitera o nome divino expresso diretamente pelo Tetragrama, preservando seu caráter de nome próprio.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido cultual de אִשֶּׁה
  choice: oferta feita pelo fogo
  alternative: oferta de alimento
  rationale: A formação e o uso do termo mantêm uma associação clara com o fogo, mas sua função no vocabulário sacrificial também permite a interpretação contextual de uma oferta apresentada como alimento a Deus; a nota preserva essa alternativa sem resolver indevidamente a questão.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial reconhecível. A ordem dos elementos foi levemente ajustada para tornar explícita a distribuição de um décimo de efa para cada cordeiro, sem alterar o conteúdo. A construção permanece ligada ao contexto precedente, por isso começa com “e”.
