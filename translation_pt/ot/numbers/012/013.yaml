base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: pt
  text: 'Então Moisés clamou a Yahweh, dizendo: “Ó Deus, por favor, cura-a!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “Ó Deus, por favor, cura-a, por favor”. A repetição de “por favor” no hebraico reforça a urgência da súplica de Moisés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: clamou
  rationale: O verbo צעק expressa um clamor intenso ou um apelo urgente; “clamou” preserva a força da intercessão de Moisés em linguagem bíblica corrente e digna.
- source_word: אֶל יְהוָה
  choice: a Yahweh
  rationale: A preposição אֶל indica o destinatário do clamor, e o nome divino יהוה é transliterado como “Yahweh”, preservando o nome pessoal presente no texto hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz diretamente o conteúdo do clamor e é reproduzido de modo formal e natural.
- source_word: אֵל
  choice: Ó Deus
  rationale: אֵל funciona aqui como vocativo. “Ó Deus” comunica claramente a invocação feita na oração.
- source_word: נָא רְפָא נָא
  choice: por favor, cura
  rationale: רְפָא é um imperativo que pede cura, enquanto a repetição de נָא intensifica a súplica. No texto principal, um único “por favor” mantém a oração natural em português; a repetição hebraica é preservada em nota.
- source_word: לָהּ
  choice: a
  rationale: O sufixo pronominal feminino singular retoma Miriã. Em “cura-a”, o pronome explicita corretamente o objeto feminino.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Clamou” preserva a intensidade do verbo hebraico; a fórmula “dizendo” mantém a estrutura do original. A repetição de נָא é indicada em nota para conservar sua ênfase sem produzir uma oração pouco natural no texto principal.
