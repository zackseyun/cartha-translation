lexical_decisions:
- source_word: וְאַחַר
  choice: Depois disso
  rationale: Marca a sequência temporal após os acontecimentos anteriores; a expressão é natural em português moderno.
- source_word: נָסְעוּ
  choice: partiu
  rationale: O verbo נסע, nas narrativas do deserto, indica levantar acampamento e seguir viagem; “partiu” comunica isso de modo claro e conciso.
- source_word: הָעָם
  choice: o povo
  rationale: Refere-se coletivamente à comunidade israelita; “o povo” é a equivalência mais natural no contexto.
- source_word: מֵחֲצֵרוֹת
  choice: de Hazerote
  rationale: Nome geográfico transliterado segundo uma forma portuguesa reconhecível.
- source_word: וַיַּחֲנוּ
  choice: e acampou
  rationale: חנה significa acampar; o singular concorda naturalmente em português com o coletivo “o povo”.
- source_word: בְּמִדְבַּר
  choice: no deserto de
  rationale: מִדְבָּר designa uma região erma ou desértica; “deserto” é claro, corrente e apropriado ao cenário geográfico.
- source_word: פָּארָן
  choice: Parã
  rationale: Nome geográfico apresentado em sua forma tradicional portuguesa.
