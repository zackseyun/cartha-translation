  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: pt
  text: Então Yahweh desceu numa coluna de nuvem e pôs-se à entrada da tenda[a]. Chamou Arão e Miriã, e os dois saíram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a tenda do encontro, conforme o contexto.
    reason: cross_reference
  - marker: b
    text: Ou “os dois avançaram” ou “se apresentaram”. O verbo hebraico significa literalmente “saíram”, mas aqui pode indicar que eles avançaram em resposta ao chamado de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: desceu
  rationale: Traduz diretamente o verbo ירד, preservando a linguagem concreta de movimento vertical da narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעַמּוּד עָנָן
  choice: numa coluna de nuvem
  rationale: Expressa naturalmente em português o meio ou a manifestação em que Yahweh desceu, sem acrescentar uma determinação ausente da construção hebraica.
- source_word: וַיַּעֲמֹד
  choice: parou
  rationale: No contexto de deslocamento seguido de posicionamento à entrada, 'parou' comunica com naturalidade o sentido de tomar posição e permanecer ali.
- source_word: פֶּתַח הָאֹהֶל
  choice: à entrada da tenda
  rationale: Traduz de modo direto 'abertura/entrada da tenda'; a identificação contextual como tenda do encontro é indicada em nota, sem ampliar o texto principal.
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: Equivalente corrente e próximo do sentido básico de קרא neste contexto.
- source_word: אַהֲרֹן וּמִרְיָם
  choice: Arão e Miriã
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas desses nomes.
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: Os dois saíram
  rationale: Preserva o sentido lexical concreto de יצא, 'sair', e a referência enfática a ambos em שְׁנֵיהֶם; a possível nuance contextual de avançarem para se apresentar é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A transliteração preserva o nome pessoal presente no texto hebraico e evita substituí-lo por um título.
- issue: Linguagem antropomórfica da descida de Yahweh
  choice: Preservar a expressão concreta 'desceu'
  alternative: Parafrasear como 'apareceu' ou 'manifestou-se'
  rationale: O hebraico emprega explicitamente o verbo de descida; mantê-lo conserva a imagem teofânica sem impor uma explicação teológica.
- issue: Movimento final de Arão e Miriã
  choice: Traduzir literalmente como 'saíram' e registrar a nuance contextual em nota
  alternative: Traduzir no texto como 'avançaram' ou 'se apresentaram'
  rationale: O sentido exato do movimento em relação à tenda admite alguma ambiguidade. A formulação escolhida preserva o verbo hebraico, enquanto a nota esclarece a leitura contextual possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação narrativa foi mantida sem rigidez excessiva; a divisão antes de 'Os dois saíram' evita uma sequência longa e torna explícito que ambos responderam ao chamado.
