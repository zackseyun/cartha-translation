  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: pt
  text: Por favor, não permitas que ela fique como um morto, cuja carne está meio consumida quando ele sai do ventre de sua mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma criança natimorta, cuja carne está meio consumida quando ela sai do ventre de sua mãe”. O hebraico a compara a alguém morto ao nascer; algumas traduções tornam explícita no texto a imagem do natimorto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Por favor, não
  rationale: אַל expressa a proibição, e נָא acrescenta o tom de súplica urgente; “Por favor, não” comunica ambos com naturalidade.
- source_word: תְהִי
  choice: deixes que ela fique
  rationale: A forma feminina singular, após אַל, exprime um pedido negativo e se refere a Miriã no contexto.
- source_word: כַּמֵּת
  choice: como um morto
  rationale: Preserva o sentido literal e a ambiguidade da comparação, sem tornar explícita no texto principal a interpretação de natimorto.
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: ao sair do ventre de sua mãe
  rationale: Reproduz de modo conciso o valor temporal do infinitivo e a imagem concreta do hebraico.
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: cuja carne ... já está meio consumida
  rationale: “Carne” mantém o sentido físico de בשר; “meio consumida” transmite a condição resultante descrita pela forma verbal passiva, e “já” torna natural em português essa condição no momento do nascimento.
theological_decisions:
- issue: Referente do feminino singular
  choice: “ela” se refere a Miriã
  alternative: Manter o sujeito apenas implícito
  rationale: O contexto imediato identifica Miriã como objeto da súplica de Arão; explicitar “ela” preserva a referência gramatical sem acrescentar conteúdo doutrinário.
- issue: Imagem de morte ao nascer
  choice: Manter “como um morto” no texto principal
  alternative: “como uma criança natimorta”
  rationale: O hebraico diz literalmente “como um morto”, enquanto a oração seguinte evoca a morte no nascimento. A formulação escolhida conserva a tensão e deixa a explicitação interpretativa para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se “não deixes” por ser uma súplica direta dirigida a Moisés, mantendo solenidade sem arcaísmo excessivo. A imagem física forte do original foi preservada.
