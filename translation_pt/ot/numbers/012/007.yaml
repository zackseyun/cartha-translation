source:
  edition: WLC
  text: לֹא כֵ֖ן עַבְדִּ֣/י מֹשֶׁ֑ה בְּ/כָל בֵּיתִ֖/י נֶאֱמָ֥ן הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: pt
  text: Não é assim com meu servo Moisés; ele é fiel em toda a minha casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em toda a minha família”. Em hebraico, “casa” pode designar uma família ou o âmbito de autoridade de alguém, não apenas uma construção.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Não é assim
  rationale: A expressão introduz um contraste corretivo enfático com o que foi dito antes; esta formulação é clara e natural em português.
- source_word: עַבְדִּי
  choice: meu servo
  rationale: Embora עֶבֶד também possa significar “escravo”, aqui funciona como designação honrosa da relação e do serviço de Moisés para com Deus.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: בְּכָל בֵּיתִי
  choice: em toda a minha casa
  rationale: Preserva a preposição e a metáfora hebraica, sem restringir “casa” a um edifício nem explicitar indevidamente “povo” ou “domínio”.
- source_word: נֶאֱמָן
  choice: fiel
  rationale: Expressa a confiabilidade e constância atribuídas a Moisés e corresponde ao uso bíblico consagrado em português.
- source_word: הוּא
  choice: ele é
  rationale: O pronome independente é representado de modo explícito e idiomático em português.
theological_decisions:
- issue: Sentido de “minha casa” em relação ao papel de Moisés
  choice: Manter a metáfora “em toda a minha casa” no texto principal.
  alternative: “em toda a minha família” ou “entre todo o meu povo”
  rationale: O hebraico pode abranger a família, a comunidade ou o domínio de Deus, mas usa literalmente “casa”. Preservar a imagem mantém sua amplitude e suas ressonâncias intertextuais sem resolver a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e a metáfora do hebraico foram preservadas sem produzir uma formulação artificial.
