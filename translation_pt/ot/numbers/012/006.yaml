  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: pt
  text: 'E ele disse: “Ouçam agora as minhas palavras: se houver entre vocês um profeta[a], eu, Yahweh, me darei a conhecer a ele numa visão[b] e falarei com ele num sonho[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se um de vocês for profeta”. A expressão hebraica é literalmente “se houver o profeta de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “me revelarei a ele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “falarei a ele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o fluxo narrativo do wayyiqtol sem explicitar uma sequência temporal além do que o hebraico exige.
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: Ouçam agora as minhas palavras
  rationale: O imperativo plural e a partícula נָא formam uma convocação solene e enfática; “agora” comunica aqui a urgência do apelo.
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: se houver entre vocês um profeta
  rationale: Expressa em português natural a construção hebraica incomum, literalmente “se houver o profeta de vocês”, sem eliminar a possibilidade de entendê-la como “se um de vocês for profeta”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: בַּמַּרְאָה
  choice: numa visão
  rationale: מַרְאָה designa aqui uma manifestação ou experiência visionária, em paralelo com “num sonho”.
- source_word: אֵלָיו אֶתְוַדָּע
  choice: me darei a conhecer a ele
  rationale: A forma reflexiva de ידע indica que Yahweh se faz conhecido ou se revela ao profeta; a formulação mantém essa nuance reflexiva.
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: falarei com ele num sonho
  rationale: A preposição ב com דבר admite sentido relacional (“falar com”) e também pode ser vertida “falar a”; “num sonho” identifica o meio da comunicação.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; a transliteração preserva essa função sem trocar o nome por um título.
- issue: Modo da revelação profética
  choice: Yahweh se dá a conhecer numa visão e fala num sonho
  alternative: Yahweh aparece numa visão e fala por meio de um sonho
  rationale: A tradução mantém as duas formas de revelação mencionadas e a nuance reflexiva de אֶתְוַדָּע, sem desenvolver uma doutrina da profecia além do texto.
- issue: Sentido de אֲדַבֶּר בּוֹ
  choice: falarei com ele
  alternative: falarei a ele
  rationale: A construção preposicional permite ambas as formulações. O texto principal conserva de modo natural a ideia de comunicação dirigida ao profeta, e a nota registra a alternativa sem decidir além da evidência.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com concordância plural natural em “vocês”. A ordem e o paralelismo do hebraico foram preservados sem produzir formulações artificiais. Os marcadores de nota foram colocados junto às expressões que efetivamente esclarecem.
