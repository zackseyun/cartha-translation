base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: pt
  text: 'E Arão disse a Moisés: “Por favor, meu senhor, não ponha sobre nós o pecado[a], pois agimos insensatamente e pecamos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não nos considere culpados”.
    reason: Alternativa contextual para תָשֵׁת עָלֵינוּ חַטָּאת, que pode exprimir a atribuição da culpa pelo pecado.
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Por favor, meu senhor
  rationale: בִּי introduz uma súplica cortês e אֲדֹנִי é aqui uma forma respeitosa de Arão dirigir-se a Moisés, não um título divino.
- source_word: אַל נָא תָשֵׁת עָלֵינוּ חַטָּאת
  choice: não ponha sobre nós o pecado
  rationale: Mantém a metáfora hebraica de colocar algo sobre alguém. חַטָּאת pode indicar tanto o pecado quanto a culpa decorrente dele; a alternativa contextual aparece em nota.
- source_word: אֲשֶׁר נוֹאַלְנוּ וַאֲשֶׁר חָטָאנוּ
  choice: que cometemos agindo insensatamente
  rationale: 'A formulação liga naturalmente o pecado à conduta insensata e preserva os dois elementos da confissão: a insensatez e o ato de pecar, sem a repetição pouco idiomática de duas orações causais.'
theological_decisions:
- issue: Sentido de אֲדֹנִי dirigido a Moisés
  choice: meu senhor
  alternative: senhor
  rationale: Trata-se de uma forma humana de respeito e deferência. “Meu senhor” conserva a relação interpessoal expressa no hebraico sem sugerir que Moisés seja divino.
- issue: Referente de חַטָּאת na súplica
  choice: pecado
  alternative: culpa
  rationale: “Pecado” traduz diretamente o termo e mantém a imagem de pô-lo sobre alguém; “culpa” explicita a responsabilidade decorrente da ofensa e permanece uma leitura contextual legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala conserva a deferência urgente de Arão e a metáfora hebraica, evitando linguagem excessivamente arcaica.
