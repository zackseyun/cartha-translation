  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: pt
  text: A ira de Yahweh se acendeu contra eles, e ele se retirou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: A combinação idiomática de חרה com אַף descreve a ira tornando-se ardente. Em português, “a ira se acendeu” preserva a metáfora de calor e soa natural e digna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בָּם
  choice: contra eles
  rationale: Neste contexto, a preposição marca as pessoas que são alvo da ira divina.
- source_word: וַיֵּלַךְ
  choice: ele se retirou
  rationale: No contexto da manifestação divina junto à tenda, o verbo indica que Yahweh foi embora ou retirou sua presença; “se retirou” comunica isso com clareza sem acrescentar detalhes.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem hebraica foi levemente naturalizada. Não se incluiu nota sobre o sentido literal de אַף (“nariz”), pois a expressão completa é um idiomatismo comum de ira, e a tradução mantém sua metáfora principal em “se acendeu”.
