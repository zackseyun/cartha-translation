base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: pt
  text: 'Yahweh disse de repente a Moisés, a Arão e a Miriã: “Saiam vocês três[a] para a tenda do encontro.” E os três saíram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “saiam, os três” ou “saiam todos os três”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título, preservando sua função como nome pessoal no texto hebraico.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: Expressa tanto a rapidez quanto o caráter inesperado da intervenção divina em português natural.
- source_word: צְאוּ
  choice: Saiam
  rationale: O imperativo de יצא indica movimento para fora. “Saiam” é natural no contexto e evita definir, além do hebraico, a perspectiva espacial como “venham” ou “vão”.
- source_word: שְׁלָשְׁתְּכֶם
  choice: vocês três
  rationale: Mantém a referência explícita e enfática aos três destinatários da ordem.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Equivalente claro e tradicional que comunica o lugar designado de encontro, sem transformar a expressão em nome próprio.
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: Representa diretamente a forma narrativa do mesmo verbo יצא e relata o cumprimento da ordem.
- source_word: שְׁלָשְׁתָּם
  choice: os três
  rationale: Reproduz a reiteração hebraica de que os três obedeceram, com formulação concisa e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título, sem importar uma interpretação denominacional.
- issue: Perspectiva espacial do imperativo צְאוּ
  choice: Saiam
  alternative: Venham para fora; vão para fora
  rationale: O verbo hebraico especifica a saída, mas não exige em português que se determine a perspectiva espacial como movimento em direção ao falante ou para longe dele. A escolha preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi formulada no plural (“saiam”), e a repetição hebraica referente aos três foi preservada. A posição de “de repente” realça a intervenção inesperada sem tornar a frase artificial.
