  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: pt
  text: Então Miriã e Arão falaram contra Moisés por causa da mulher cuxita que ele havia tomado como esposa[a], pois ele havia tomado como esposa uma mulher cuxita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “tomado”. Neste contexto, a expressão hebraica significa “tomado como esposa” ou “desposado”.
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico está no singular feminino, possivelmente dando destaque a Miriã, embora Miriã e Arão sejam ambos nomeados como sujeitos.
    reason: textual_grammar
lexical_decisions:
- source_word: וַתְּדַבֵּר
  choice: falaram
  rationale: O verbo דבר indica o ato de falar; com בְּמֹשֶׁה, o contexto lhe dá sentido hostil. Em português, o plural concorda naturalmente com o sujeito composto, embora o hebraico use o singular feminino, possivelmente destacando Miriã.
- source_word: מִרְיָם וְאַהֲרֹן
  choice: Miriã e Arão
  rationale: Mantém a ordem dos nomes no hebraico e emprega as formas portuguesas consagradas.
- source_word: בְּמֹשֶׁה
  choice: contra Moisés
  rationale: Com דבר, a preposição ב pode assinalar a pessoa contra quem se fala; o contexto confirma a nuance adversativa.
- source_word: עַל אֹדוֹת
  choice: por causa de
  rationale: A expressão apresenta o motivo ou a ocasião da fala e é vertida por uma construção portuguesa natural de valor causal.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: אִשָּׁה pode significar mulher ou esposa. A tradução mantém 'mulher', enquanto a expressão verbal explicita o sentido matrimonial.
- source_word: הַכֻּשִׁית / כֻשִׁית
  choice: cuxita
  rationale: Designa uma mulher de Cuxe. 'Cuxita' conserva a referência textual com mais precisão do que a forma tradicional 'etíope'.
- source_word: אֲשֶׁר לָקָח
  choice: que ele havia tomado como esposa
  rationale: לקח significa literalmente 'tomar', mas, neste contexto matrimonial, a expressão idiomática significa tomar por esposa ou casar-se. A formulação portuguesa conserva parte da imagem hebraica e comunica o sentido.
- source_word: כִּי
  choice: pois
  rationale: Introduz uma explicação que repete e enfatiza a razão já mencionada.
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: ele havia tomado como esposa uma mulher cuxita
  rationale: Preserva a repetição enfática do hebraico, sem suavizá-la ou eliminá-la.
theological_decisions:
- issue: Identidade e designação étnico-geográfica da mulher de Moisés
  choice: Traduzir כֻשִׁית como 'cuxita', sem identificar a mulher com Zípora nem harmonizar a passagem com tradições sobre Midiã.
  alternative: '''Etíope'' como equivalência geográfica tradicional, ou identificação interpretativa com Zípora.'
  rationale: O versículo a chama de cuxita. A tradução deve preservar essa designação e não resolver debates históricos ou harmonizações que o texto não esclarece.
- issue: Possível destaque de Miriã no verbo hebraico
  choice: Usar o plural português 'falaram', exigido pelo sujeito composto, e registrar em nota o singular feminino do hebraico.
  alternative: Traduzir apenas Miriã como agente principal ou reformular para indicar explicitamente que ela iniciou a crítica.
  rationale: O singular feminino pode destacar Miriã, mas o texto nomeia Miriã e Arão como sujeitos. A tradução não deve transformar uma possível nuance gramatical em conclusão narrativa certa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do original foi preservada. 'Cuxita' mantém a referência a Cuxe sem recorrer à designação tradicional e potencialmente anacrônica 'etíope'.
