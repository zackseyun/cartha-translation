  text: וְ/הָ/אִ֥ישׁ מֹשֶׁ֖ה ענו מְאֹ֑ד מִ/כֹּל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: pt
  text: O homem Moisés era muito humilde, mais do que qualquer pessoa sobre a face da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הָ/אִישׁ
  choice: O homem
  rationale: Preserva o substantivo hebraico definido antes do nome próprio. O waw marca a continuidade narrativa e não exige aqui uma conjunção explícita em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ענו
  choice: humilde
  rationale: Neste contexto, o adjetivo descreve mais naturalmente a atitude ou disposição de Moisés. 'Manso' é possível, mas pode sugerir passividade; 'afligido' não se ajusta tão bem à construção predicativa.
- source_word: מְאֹד
  choice: muito
  rationale: Intensificador corrente e natural em português.
- source_word: מִ/כֹּל
  choice: mais do que qualquer
  rationale: Expressa de modo idiomático a construção comparativa hebraica com מן e כֹּל.
- source_word: הָאָדָם
  choice: pessoa
  rationale: אָדָם tem aqui sentido humano genérico, não especificamente masculino. 'Pessoa' comunica naturalmente esse valor inclusivo em português.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo natural em português nesta oração.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: sobre a face da terra
  rationale: Mantém a imagem do idioma hebraico e continua compreensível em português moderno.
theological_decisions:
- issue: Sentido genérico de אָדָם na comparação
  choice: pessoa
  alternative: homem / ser humano
  rationale: O termo designa aqui qualquer integrante da humanidade. 'Pessoa' preserva o referente genérico sem restringi-lo ao sexo masculino; 'ser humano' também seria exato, mas menos fluente nesta comparação.
- issue: Sentido de ענו
  choice: humilde
  alternative: manso / afligido
  rationale: A tradução preserva a leitura contextual mais provável como traço de caráter, sem transformar a humildade em fraqueza nem adotar o sentido de condição afligida encontrado em usos relacionados.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação conserva 'O homem Moisés' e a imagem 'face da terra' para refletir a textura hebraica, usando 'pessoa' onde אָדָם é claramente genérico.
