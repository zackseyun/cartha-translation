  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: pt
  text: Boca a boca falo com ele[a], claramente e não por enigmas; ele contempla a forma[b] de Yahweh. Então, por que vocês não tiveram medo de falar contra o meu servo, contra Moisés?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «face a face». O hebraico diz literalmente «boca a boca» e ressalta a comunicação direta.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a semelhança de Yahweh» ou «a aparência de Yahweh».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: Boca a boca
  rationale: Preserva a expressão hebraica concreta e a ideia de comunicação direta. A alternativa idiomática «face a face» é explicada em nota, sem substituir «boca» por «face» no texto.
- source_word: אֲדַבֶּר בּוֹ
  choice: falo com ele
  rationale: A construção com בְּ indica aqui comunicação ou conversa com alguém; «com ele» reflete essa relação de modo natural em português.
- source_word: וּמַרְאֶה
  choice: claramente
  rationale: No contraste com «não por enigmas», מַרְאֶה comunica manifestação clara ou perceptível. A forma adverbial produz em português uma oposição natural sem definir além do texto o modo dessa revelação.
- source_word: וְלֹא בְחִידֹת
  choice: e não por enigmas
  rationale: חִידוֹת designa enigmas ou declarações obscuras. «Enigmas» é atual, compreensível e conserva o contraste com a comunicação clara.
- source_word: וּתְמֻנַת יְהוָה
  choice: a forma de Yahweh
  rationale: תְּמוּנָה pode indicar forma, semelhança ou aparência. «Forma» mantém a concretude e a ambiguidade da manifestação divina; יְהוָה é transliterado como «Yahweh».
- source_word: יַבִּיט
  choice: contempla
  rationale: O verbo expressa olhar intencionalmente. «Contempla» conserva essa força e o tom solene sem sugerir uma explicação metafísica adicional.
- source_word: וּמַדּוּעַ
  choice: Então, por que
  rationale: A expressão introduz a conclusão repreensiva decorrente da relação singular de Yahweh com Moisés. «Então» torna essa inferência clara em português.
- source_word: לֹא יְרֵאתֶם
  choice: vocês não tiveram medo
  rationale: O plural dirige a censura aos interlocutores de Moisés. A formulação natural em português mantém a força de temor culpavelmente ausente.
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: falar contra o meu servo, contra Moisés
  rationale: No contexto, a preposição repetida marca o alvo da fala hostil. A repetição de «contra» preserva a ênfase e a aposição do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. «Yahweh» preserva o nome pactual sem substituí-lo por um título.
- issue: A descrição da revelação singular recebida por Moisés
  choice: ele contempla a forma de Yahweh
  alternative: ele vê a semelhança de Yahweh; ele vê a aparência de Yahweh
  rationale: «Forma» afirma a linguagem concreta do versículo, mas não determina a natureza metafísica daquilo que Moisés contemplava. Assim, conserva-se a tensão do texto quanto à visibilidade divina.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A construção literal «boca a boca» foi mantida por sua importância textual, e a alternativa idiomática aparece em nota. A repetição «contra o meu servo, contra Moisés» reproduz deliberadamente a ênfase da construção hebraica.
