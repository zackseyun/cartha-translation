  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: pt
  text: Assim, Miriã ficou confinada fora do acampamento durante sete dias, e o povo não partiu até que Miriã fosse trazida de volta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “até que Miriã fosse recolhida”. O hebraico usa o verbo “recolher”, referindo-se aqui à sua reintegração no acampamento após o período de exclusão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: ficou confinada
  rationale: O nifal de סגר indica que Miriã foi fechada ou mantida em condição de exclusão. “Ficou confinada” expressa com naturalidade o estado imposto, sem sugerir necessariamente encarceramento.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Equivalência direta e natural para a localização de Miriã no contexto da jornada de Israel.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Expressa claramente a duração indicada pelo hebraico.
- source_word: הָעָם
  choice: o povo
  rationale: Refere-se à comunidade de Israel e corresponde ao uso narrativo comum de עָם.
- source_word: לֹא נָסַע
  choice: não partiu
  rationale: No contexto das jornadas pelo deserto, נסע indica levantar acampamento e seguir viagem. “Não partiu” transmite esse sentido de modo conciso e natural.
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: até que Miriã fosse trazida de volta
  rationale: O nifal de אסף significa literalmente ser recolhida ou reunida. Aqui, o contexto indica sua readmissão no acampamento depois do período de exclusão; “trazida de volta” torna essa relação clara, enquanto a nota preserva a imagem lexical hebraica.
