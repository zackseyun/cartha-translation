  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: pt
  text: 'Yahweh disse a Moisés: “Se o pai dela lhe tivesse cuspido no rosto, ela não ficaria humilhada por sete dias?[a] Que ela fique isolada fora do acampamento por sete dias; depois disso, poderá ser recebida de volta.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela não ficaria envergonhada por sete dias?”'
    reason: Alternativa lexical para תִכָּלֵם, que pode destacar mais a experiência de vergonha do que a humilhação social.
  - marker: b
    text: 'Ou: “depois disso, poderá ser novamente recolhida”.'
    reason: Alternativa mais formal para תֵּאָסֵף, preservando a imagem de ser reunida ou trazida para dentro outra vez.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome pessoal divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יָרֹק יָרַק
  choice: lhe tivesse cuspido
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a ação; no contexto condicional, esta formulação comunica naturalmente a hipótese em português.
- source_word: בְּפָנֶיהָ
  choice: no rosto
  rationale: Com o verbo “cuspir”, esta é a expressão portuguesa natural para a afronta pública descrita.
- source_word: תִכָּלֵם
  choice: ficaria humilhada
  rationale: O nifal de כלם indica sofrer vergonha ou desonra; “humilhada” preserva tanto a dimensão social quanto a força da pergunta retórica.
- source_word: תִּסָּגֵר
  choice: fique isolada
  rationale: Expressa o sentido passivo de ser separada ou confinada, com linguagem natural no contexto da exclusão do acampamento.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Tradução direta, clara e idiomática do local de exclusão.
- source_word: תֵּאָסֵף
  choice: poderá ser recebida de volta
  rationale: Mantém o sentido passivo de ser reintegrada depois do período de exclusão, sem tornar explícito além do texto quem a recebe.
theological_decisions:
- issue: Natureza da frase sobre o pai cuspir
  choice: Analogia hipotética de vergonha e exclusão
  alternative: Recordação literal de um acontecimento real
  rationale: A construção hebraica funciona como condição retórica que fundamenta o período de exclusão de Miriã; a tradução conserva a analogia sem lhe acrescentar sentido doutrinário ou simbólico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a pergunta retórica, a exclusão passiva e a posterior reintegração, sem explicar além do hebraico.
