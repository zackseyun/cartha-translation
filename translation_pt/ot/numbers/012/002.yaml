  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: pt
  text: 'E disseram[a]: “Será que Yahweh falou somente por meio de Moisés? Não falou também por meio de nós?” E Yahweh ouviu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que Yahweh falou somente a Moisés? Não falou também a nós?” A preposição hebraica pode indicar tanto o destinatário como o meio da fala divina; o texto principal traz “por meio de” porque o contexto trata da autoridade profética.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol de אמר dá continuidade à narrativa e introduz o discurso direto; “E disseram” é natural e mantém o sujeito plural.
- source_word: הֲרַק אַךְ
  choice: Será que ... somente
  rationale: A pergunta retórica e as partículas restritivas intensificam a alegação de exclusividade; esta formulação comunica a contestação com clareza em português atual.
- source_word: בְּמֹשֶׁה
  choice: por meio de Moisés
  rationale: Com דבר neste contexto profético, ב pode indicar o mediador da fala divina. “Por meio de” ressalta a questão da autoridade profética sem eliminar em nota a possibilidade de destinatário.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh falou
  rationale: דבר é adequadamente vertido por “falar” no contexto de comunicação divina, e o nome pessoal יהוה é transliterado como “Yahweh”.
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: Não falou também por meio de nós?
  rationale: Mantém a construção paralela à primeira pergunta e expressa a reivindicação de que eles também serviram como canais da fala divina.
- source_word: וַיִּשְׁמַע יְהוָה
  choice: E Yahweh ouviu
  rationale: O hebraico não apresenta objeto expresso. A tradução preserva essa concisão e evita acrescentar “isso” desnecessariamente.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido da preposição ב com דבר
  choice: por meio de Moisés / por meio de nós
  alternative: a Moisés / a nós
  rationale: O contexto trata da condição e autoridade profética de Moisés, Miriã e Arão, favorecendo a ideia de mediação. Como a preposição também pode marcar o destinatário, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo das perguntas e a concisão da última oração.
