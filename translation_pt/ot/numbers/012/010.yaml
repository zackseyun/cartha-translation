revisions:
- from: A nuvem se afastou de sobre a tenda, e eis que Miriã estava com uma grave doença de pele,[a] como a neve. Arão voltou-se para Miriã, e eis que ela estava com aquela doença de pele.
  to: A nuvem afastou-se de cima da tenda, e eis que Miriã estava com uma doença de pele,[a] como a neve. Arão voltou-se para Miriã, e eis que ela estava com uma doença de pele.
  rationale: A revisão remove qualificações não expressas no hebraico («grave» e «aquela»), melhora a fluidez espacial em português moderno e mantém tanto a repetição dramática quanto a amplitude semântica do termo hebraico por meio da nota.
