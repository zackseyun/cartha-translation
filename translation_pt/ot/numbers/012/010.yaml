base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: pt
  text: A nuvem afastou-se de cima da tenda, e eis que Miriã estava com uma doença de pele,[a] como a neve. Arão voltou-se para Miriã, e eis que ela estava com uma doença de pele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico pode referir-se de modo mais amplo a uma doença de pele ou a uma afecção ritual da pele; não significa necessariamente hanseníase (doença de Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: O substantivo definido designa, no contexto, a nuvem visível associada à presença do SENHOR.
- source_word: סָר
  choice: se afastou
  rationale: O verbo indica que a nuvem saiu ou se retirou de sua posição; “se afastou” expressa naturalmente esse movimento.
- source_word: מֵעַל הָאֹהֶל
  choice: de sobre a tenda
  rationale: מֵעַל indica movimento para longe de uma posição acima da tenda; a formulação conserva essa relação espacial sem explicitar além do hebraico que se trata da tenda do encontro.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: A expressão preserva a apresentação vívida e o elemento de surpresa do hebraico.
- source_word: מְצֹרַעַת
  choice: com uma grave doença de pele
  rationale: O termo hebraico abrange uma afecção cutânea definida no contexto ritual bíblico e não deve ser identificado automaticamente com a hanseníase moderna. A formulação comunica o sentido amplo em português atual.
- source_word: כַּשָּׁלֶג
  choice: como a neve
  rationale: Mantém o símile breve do hebraico sem acrescentar explicitamente “branca”, embora essa característica provavelmente esteja em vista.
- source_word: וַיִּפֶן ... אֶל
  choice: voltou-se para
  rationale: A expressão transmite o movimento físico de Arão na direção de Miriã.
- source_word: וְהִנֵּה מְצֹרָעַת
  choice: e eis que ela estava com aquela doença de pele
  rationale: Preserva a repetição enfática do hebraico, enquanto “aquela” retoma naturalmente em português a condição já mencionada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “e eis que” para reproduzir a vivacidade narrativa e a surpresa do original; evita-se “leprosa” no texto principal por sua associação moderna excessivamente específica.
