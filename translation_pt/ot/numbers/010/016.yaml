  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/016.yaml
  text: And over the company of the tribe of the sons of Zebulun was Eliab son of Helon[a].
translation:
  language: pt
  text: E à frente da tropa da tribo dos filhos de Zebulom estava Eliabe, filho de Helom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exército” ou “divisão”, em vez de “tropa”; o termo hebraico צְבָא designa um contingente tribal organizado em ordem de marcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: E sobre
  rationale: Preserva a ligação coordenativa com o item anterior e, com o verbo de autoridade subentendido, expressa que Eliabe comandava a tropa.
- source_word: צְבָא
  choice: tropa
  rationale: No contexto da marcha pelo deserto, designa o contingente tribal organizado. “Tropa” é corrente e comunica a organização de caráter militar sem sugerir necessariamente um exército permanente.
- source_word: מַטֵּה
  choice: tribo
  rationale: Aqui o termo tem seu sentido sociopolítico usual, referente à unidade tribal, e não o sentido concreto de “bastão”.
- source_word: בְּנֵי זְבוּלֻן
  choice: filhos de Zebulom
  rationale: Mantém a expressão familiar explícita do hebraico, que nessa fórmula tribal se refere aos descendentes e membros da tribo de Zebulom.
- source_word: אֱלִיאָב
  choice: Eliabe
  rationale: Transliteração portuguesa consagrada do nome pessoal hebraico.
- source_word: בֶּן חֵלֹן
  choice: filho de Helom
  rationale: Tradução direta e natural da construção patronímica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação próxima da estrutura hebraica. A expressão “estava” explicita de modo mínimo o verbo subentendido na fórmula de comando; “tropa” mantém o caráter organizado do contingente sem excesso de tecnicismo.
