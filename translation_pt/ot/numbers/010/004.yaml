  text: וְ/אִם בְּ/אַחַ֖ת יִתְקָ֑עוּ וְ/נוֹעֲד֤וּ אֵלֶ֨י/ךָ֙ הַ/נְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/004.yaml
  text: But if they blow only one[a], then the leaders, the heads of the thousands of Israel, shall gather to you.
translation:
  language: pt
  text: Mas, se tocarem apenas uma trombeta, os líderes, chefes dos milhares de Israel[a], se reunirão junto de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica “chefes dos milhares de Israel” provavelmente se refere aos líderes das divisões de Israel organizadas em unidades de mil; também pode ser entendida de modo mais interpretativo como “chefes dos clãs de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a instrução do versículo anterior; “Mas, se” expressa essa relação com naturalidade.
- source_word: בְּ/אַחַת
  choice: apenas uma
  rationale: Refere-se elipticamente a uma só trombeta, em contraste com as duas mencionadas anteriormente. O feminino “uma” preserva essa referência implícita.
- source_word: יִתְקָעוּ
  choice: tocarem
  rationale: No contexto de sinais com trombetas, תקע significa tocar ou fazer soar; “tocar” é a expressão portuguesa mais natural.
- source_word: וְ/נוֹעֲדוּ
  choice: se reunirão
  rationale: O nifal de יעד indica reunir-se em resposta a uma convocação; “se reunirão” comunica claramente o sentido.
- source_word: אֵלֶי/ךָ
  choice: junto de você
  rationale: Indica movimento em direção a Moisés. “Junto de você” é natural e explicita que os líderes devem reunir-se onde ele está.
- source_word: הַ/נְּשִׂיאִים
  choice: os líderes
  rationale: נְשִׂיאִים designa chefes ou dirigentes tribais; “líderes” evita a conotação monárquica que “príncipes” poderia sugerir.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: chefes dos milhares de Israel
  rationale: Mantém de modo transparente a terminologia administrativa ou militar hebraica, sem decidir no texto principal se אֲלָפִים significa literalmente grupos de mil ou unidades de clã.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção preserva a elipse do hebraico em “uma” e mantém no texto principal a expressão potencialmente ambígua “milhares de Israel”.
