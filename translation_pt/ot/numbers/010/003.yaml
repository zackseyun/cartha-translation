base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: pt
  text: Quando tocarem as trombetas[a], toda a congregação se reunirá junto de você, à entrada da tenda do encontro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «E tocarão as trombetas, e toda a congregação se reunirá junto de você».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ בָהֵן
  choice: Quando tocarem as trombetas
  rationale: No contexto de instruções sobre sinais, a construção introduz a circunstância temporal que desencadeia a reunião. Repetir «as trombetas» torna claro, em português, o referente do pronome feminino plural e usa o verbo idiomático «tocar» para instrumentos.
- source_word: וְנוֹעֲדוּ
  choice: se reunirá
  rationale: O nifal de יעד indica aqui reunir-se em resposta a uma convocação. O singular concorda naturalmente com o coletivo «toda a congregação».
- source_word: אֵלֶיךָ
  choice: junto de você
  rationale: Preserva a direção pessoal do hebraico («a você») e expressa com naturalidade que a congregação deve reunir-se na presença de Moisés, sem transformar a expressão em mera localização.
- source_word: כָּל הָעֵדָה
  choice: toda a congregação
  rationale: עֵדָה designa a comunidade de Israel considerada coletivamente; «congregação» é claro e mantém esse sentido corporativo.
- source_word: פֶּתַח
  choice: à entrada
  rationale: Designa o ponto de acesso à tenda; «entrada» é natural e preciso em português contemporâneo.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Mantém a ideia de uma tenda associada ao encontro determinado por Deus e evita uma formulação excessivamente técnica.
