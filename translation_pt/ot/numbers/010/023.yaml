  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/023.yaml
  text: And over the company of the tribe of the sons of Manasseh was Gamaliel son of Pedahzur[a].
translation:
  language: pt
  text: E à frente da divisão da tribo dos filhos de Manassés estava Gamaliel, filho de Pedazur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico צְבָא também pode ser traduzido como “exército”, “tropa” ou “contingente”; aqui se refere à divisão tribal organizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: E à frente de
  rationale: Na fórmula recorrente que descreve a ordem de marcha, introduz o líder colocado sobre o contingente; “à frente de” é natural em português e preserva a relação de autoridade.
- source_word: צְבָא
  choice: divisão
  rationale: Designa aqui o contingente tribal organizado para a marcha, sem exigir o sentido estrito de exército combatente.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto de Números, o termo identifica a unidade tribal.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: filhos de Manassés
  rationale: Conserva a designação hebraica da linhagem tribal e segue o uso bíblico corrente em português.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio em português.
- source_word: בֶּן
  choice: filho de
  rationale: Expressa de modo direto e idiomático a relação genealógica.
- source_word: פְּדָה צוּר
  choice: Pedazur
  rationale: Representa como um único nome próprio a forma hebraica grafada em dois elementos, seguindo a convenção portuguesa.
