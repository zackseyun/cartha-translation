  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: pt
  text: 'Sempre que a arca partia[a], Moisés dizia: “Levanta-te[b], Yahweh, e sejam dispersos os teus inimigos; fujam de diante de ti os que te odeiam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E aconteceu que, quando a arca partia”. A expressão hebraica pode ser traduzida mais formalmente dessa maneira, mas aqui provavelmente indica o que ocorria sempre que a arca partia.'
    reason: lexical_alternative
  - marker: b
    text: “Levanta-te” é um apelo para que Yahweh aja com poder; não sugere que Deus estivesse literalmente inativo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: E, sempre que ... partia
  rationale: A construção com וַיְהִי e infinitivo introduz aqui uma circunstância recorrente. “Sempre que” comunica essa força idiomática, e o imperfeito “partia” combina naturalmente com a repetição indicada pelo contexto.
- source_word: הָאָרֹן
  choice: a arca
  rationale: O hebraico diz apenas “a arca”. Acrescentar “da aliança” explicitaria uma informação contextual que não consta deste versículo.
- source_word: קוּמָה
  choice: Levanta-te
  rationale: O imperativo dirigido a Yahweh preserva a imagem vívida de Deus se levantando para agir com poder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְיָפֻצוּ
  choice: e sejam dispersos
  rationale: O imperfeito após o imperativo tem força volitiva ou jussiva. “Sejam dispersos” preserva a forma de petição e a voz passiva do hebraico.
- source_word: אֹיְבֶיךָ
  choice: os teus inimigos
  rationale: Tradução direta do substantivo plural com sufixo de segunda pessoa masculina singular.
- source_word: וְיָנֻסוּ
  choice: fujam
  rationale: O imperfeito tem força jussiva paralela a “sejam dispersos”; o presente do subjuntivo expressa de modo natural a petição em português.
- source_word: מְשַׂנְאֶיךָ
  choice: os que te odeiam
  rationale: A expressão preserva o valor caracterizador do particípio e a oposição pessoal a Yahweh.
- source_word: מִפָּנֶיךָ
  choice: da tua presença
  rationale: A expressão comunica que os adversários fogem de diante de Yahweh. “Da tua presença” é natural em português e mantém o sentido espacial e relacional do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, sem substituí-lo por um título.
- issue: Sentido do imperativo קוּמָה dirigido a Deus
  choice: Preservar a metáfora “Levanta-te”
  alternative: Explicitar como “Age com poder”
  rationale: A linguagem é um apelo para que Yahweh intervenha, mas a tradução mantém a imagem concreta do original sem sugerir que Deus estivesse literalmente inativo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Emprega “tu” por coerência com os sufixos hebraicos dirigidos a Yahweh e mantém o paralelismo poético das duas petições.
