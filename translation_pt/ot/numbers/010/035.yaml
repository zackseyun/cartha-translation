  naturalness: O português é claro, solene e natural. A formulação «Sempre que a arca partia» exprime bem a recorrência. A ordem «fujam de diante de ti os que te odeiam» preserva um tom elevado, mas permanece compreensível.
  terminology: «Yahweh» reproduz de modo consistente o Tetragrama. «Levanta-te» preserva a metáfora do hebraico, e «sejam dispersos» comunica bem o valor volitivo. O marcador da nota explicativa sobre «Levanta-te» deve estar ligado a essa expressão, e não ao nome divino.
