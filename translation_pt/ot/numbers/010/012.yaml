  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: pt
  text: Então os filhos de Israel partiram do deserto do Sinai, por etapas, e a nuvem se deteve no deserto de Parã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: No contexto das jornadas, נסע indica levantar acampamento e pôr-se a caminho; “partiram” é natural e preserva o movimento inicial.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão familiar masculina do hebraico, sem substituí-la silenciosamente pelo coletivo “israelitas”.
- source_word: לְמַסְעֵיהֶם
  choice: seguindo suas etapas
  rationale: O plural מַסָּע denota as etapas sucessivas de uma jornada; esta formulação comunica o sentido distributivo em português corrente.
- source_word: מִמִּדְבַּר סִינָי
  choice: do deserto do Sinai
  rationale: “Deserto” é a correspondência portuguesa natural para מִדְבָּר neste contexto geográfico, sem exigir que a região seja apenas arenosa.
- source_word: וַיִּשְׁכֹּן
  choice: repousou
  rationale: Com a nuvem como sujeito, שכן descreve sua parada e permanência sobre um lugar; “repousou” é claro e digno.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: O artigo definido remete à nuvem já conhecida que guiava Israel.
- source_word: בְּמִדְבַּר פָּארָן
  choice: no deserto de Parã
  rationale: Mantém a correspondência de מִדְבָּר e a forma portuguesa corrente do topônimo.
theological_decisions:
- issue: Tradução de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: Embora não haja controvérsia doutrinária, a expressão escolhida preserva a forma familiar masculina explícita no hebraico; a alternativa idiomática não é necessária para a compreensão.
- issue: Descrição da parada da nuvem
  choice: a nuvem repousou
  alternative: a nuvem estabeleceu-se
  rationale: “Repousou” preserva a imagem de a nuvem chegar ao lugar de parada sem acrescentar uma interpretação sobre a natureza da presença divina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação narrativa hebraica foi representada por “Então” e “e”; evitou-se linguagem arcaica.
