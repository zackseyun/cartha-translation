base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: pt
  text: Então o tabernáculo foi desmontado, e os filhos de Gérson e os filhos de Merari[a] partiram, levando o tabernáculo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os gersonitas e os meraritas”. O hebraico diz literalmente “os filhos de Gérson e os filhos de Merari”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, levavam o tabernáculo depois de desmontado. O hebraico repete “o tabernáculo”, sem dizer explicitamente “suas partes”.
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: foi desmontado
  rationale: O hofal de ירד apresenta ação passiva e, neste contexto, indica que o tabernáculo foi tirado de sua condição armada. “Foi desmontado” é claro e natural em português, sem recorrer ao literal pouco idiomático “foi baixado”.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן é o termo habitual para o santuário móvel de Israel. “Tabernáculo” é a designação portuguesa estabelecida e adequada ao contexto.
- source_word: וְנָסְעוּ
  choice: partiram
  rationale: נסע, no contexto das jornadas pelo deserto, descreve levantar acampamento e pôr-se em marcha. “Partiram” comunica naturalmente o início do deslocamento.
- source_word: בְנֵי גֵרְשׁוֹן
  choice: os filhos de Gérson
  rationale: Preserva a expressão de parentesco e de clã usada literalmente no hebraico, em vez de substituí-la pelo gentílico “gersonitas”.
- source_word: וּבְנֵי מְרָרִי
  choice: os filhos de Merari
  rationale: Mantém a formulação filial do hebraico e o paralelismo com “os filhos de Gérson”.
- source_word: נֹשְׂאֵי
  choice: levando
  rationale: O particípio descreve o que esses grupos faziam enquanto viajavam. “Levando” é corrente e fluente em português; “carregando” também seria possível.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: A segunda ocorrência repete o mesmo substantivo hebraico. Embora o contexto pressuponha que fossem transportadas as partes do tabernáculo desmontado, a tradução não acrescenta essa explicação ao texto principal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura coordenada e a repetição de “o tabernáculo” preservam de perto a forma do hebraico, enquanto “foi desmontado” e “partiram” evitam literalismos pouco naturais.
