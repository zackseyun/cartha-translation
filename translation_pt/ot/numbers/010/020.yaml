  text: וְ/עַל צְבָ֖א מַטֵּ֣ה בְנֵי גָ֑ד אֶלְיָסָ֖ף בֶּן דְּעוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: pt
  text: E à frente do contingente[a] da tribo dos filhos de Gade estava Eliasafe, filho de Deuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “divisão” ou “hoste”. O termo hebraico צְבָא frequentemente tem conotações militares, mas aqui se refere ao grupo tribal organizado para a marcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: À frente de
  rationale: Na fórmula recorrente desta lista, עַל indica que a pessoa nomeada exerce liderança sobre a divisão tribal. “À frente de” comunica isso naturalmente em português; a ligação coordenativa de וְ fica implícita na sequência da lista.
- source_word: צְבָא
  choice: divisão
  rationale: צְבָא pode designar exército ou hoste, mas aqui se refere ao contingente tribal organizado para a marcha. “Divisão” preserva o caráter ordenado e a possível nuance militar sem chamar o grupo diretamente de exército.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto, מַטֶּה designa uma unidade tribal, não o objeto literal “bastão”.
- source_word: בְנֵי גָד
  choice: filhos de Gade
  rationale: Mantém a forma hebraica da designação tribal, que é compreensível e digna em português.
- source_word: אֶלְיָסָף
  choice: Eliasafe
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן דְּעוּאֵל
  choice: filho de Deuel
  rationale: Reproduz diretamente a fórmula patronímica hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “À frente da divisão” soa mais natural do que a reprodução rígida “e sobre a divisão”, sem alterar a relação de liderança expressa pelo hebraico.
