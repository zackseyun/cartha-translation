  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: pt
  text: Faça para você duas trombetas de prata; faça-as de prata trabalhada a martelo[a]. Elas servirão para convocar a comunidade e para pôr os acampamentos em marcha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faça-as de uma só peça”.'
    reason: A expressão מִקְשָׁה enfatiza o trabalho do metal a martelo e pode ser entendida como indicando uma peça contínua, embora essa consequência do processo não seja lexicalmente inequívoca.
  - marker: b
    text: 'Ou: “para a partida dos acampamentos”.'
    reason: מַסַּע pode designar tanto o ato de partir quanto o início do deslocamento; a alternativa preserva a formulação nominal do hebraico.
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Faça para você
  rationale: Preserva a construção com לְךָ, indicando que Moisés deve providenciar as trombetas para seu uso e responsabilidade, em português claro e natural.
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: duas trombetas de prata
  rationale: חֲצֹצְרָה designa uma trombeta, em contraste com o chifre curvo; a construção com כֶּסֶף especifica o material.
- source_word: מִקְשָׁה תַּעֲשֶׂה אֹתָם
  choice: faça-as de prata trabalhada a martelo
  rationale: מִקְשָׁה descreve metal moldado por martelamento. A formulação explicita de modo natural que a prata das trombetas devia ser trabalhada dessa maneira, sem impor como sentido principal a interpretação 'de uma só peça'.
- source_word: וְהָיוּ לְךָ
  choice: Elas servirão
  rationale: A expressão introduz a finalidade prática das trombetas, não mera posse; 'servirão' comunica essa função com naturalidade.
- source_word: לְמִקְרָא הָעֵדָה
  choice: para convocar a comunidade
  rationale: מִקְרָא indica convocação ou chamado, e עֵדָה se refere à comunidade reunida de Israel.
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: e para pôr os acampamentos em marcha
  rationale: מַסַּע denota partida ou início de jornada; com אֶת הַמַּחֲנוֹת, a expressão apresenta as trombetas como meio de fazer os acampamentos iniciarem o deslocamento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do verbo 'fazer' conserva a ênfase instrucional do hebraico; 'comunidade' evita uma conotação eclesiástica desnecessária, e 'pôr em marcha' expressa de modo idiomático o movimento ordenado dos acampamentos.
