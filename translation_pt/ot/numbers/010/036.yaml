base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: pt
  text: 'E, quando ela parava, ele dizia: “Retorna, Yahweh[a], às miríades de milhares de Israel[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino יהוה (YHWH).
    reason: divine_name
  - marker: b
    text: Literalmente, “miríades de milhares de Israel”; expressão enfática de grande número.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: E, quando ela parava
  rationale: A preposição בְּ com o infinitivo construto forma uma oração temporal. O pronome feminino retoma naturalmente a arca, mencionada no contexto, e “parava” comunica seu repouso ao fim de cada etapa.
- source_word: יֹאמַר
  choice: ele dizia
  rationale: 'O imperfeito tem valor habitual neste contexto narrativo: era isso que Moisés dizia sempre que a arca parava.'
- source_word: שׁוּבָה
  choice: Volta
  rationale: O imperativo de שׁוב, com ה paragógico, expressa um apelo direto para que Yahweh volte ao seu povo, sem explicitar além do hebraico de que modo essa volta ocorre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: os incontáveis milhares de Israel
  rationale: A formulação comunica em português corrente a acumulação enfática de dois termos numéricos elevados. A nota preserva a forma mais literal e sua possível força numérica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título nem adotar outra forma tradicional.
- issue: Relação sintática entre שׁוּבָה e רִבְבֹות אַלְפֵי יִשְׂרָאֵל
  choice: “Volta [...] para os incontáveis milhares de Israel”
  alternative: “Retorna, Yahweh, ó miríades de milhares de Israel”
  rationale: A leitura como apelo para Yahweh voltar ao numeroso povo de Israel é sintaticamente coerente e se ajusta ao paralelismo contextual do versículo anterior. A preposição “para” é implícita, não expressa no hebraico, por isso a tradução evita desenvolver mais a natureza dessa volta.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Ela” retoma a arca pelo gênero natural de “arca” em português. A expressão numérica foi tornada idiomática no texto, enquanto a construção hebraica mais formal foi preservada em nota.
