  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי אֶפְרַ֖יִם לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: pt
  text: Então partiu a bandeira[a] do acampamento dos filhos de Efraim, segundo as suas divisões[b]; e Elisama, filho de Amiúde, comandava a divisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estandarte”. O termo hebraico designa a insígnia tribal sob a qual o acampamento marchava.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme os seus exércitos” ou “segundo as suas formações”. O hebraico se refere a agrupamentos organizados em moldes militares dentro do acampamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Então partiu
  rationale: O waw com o verbo no perfeito dá continuidade à sequência narrativa; “Então partiu” expressa naturalmente o avanço ordenado da marcha.
- source_word: דֶּגֶל
  choice: bandeira
  rationale: O termo designa a insígnia tribal sob a qual o acampamento marchava; “bandeira” é claro e atual em português.
- source_word: מַחֲנֵה
  choice: acampamento
  rationale: No estado construto com דֶּגֶל, identifica a unidade acampada associada à bandeira; “acampamento” se ajusta ao contexto da marcha no deserto.
- source_word: בְנֵי אֶפְרַיִם
  choice: filhos de Efraim
  rationale: Mantém de modo transparente a designação tribal hebraica, sem a substituir por uma paráfrase interpretativa.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: צָבָא refere-se aqui às formações organizadas do povo para a marcha; “divisões” comunica a organização de caráter militar sem sugerir necessariamente combate.
- source_word: וְעַל צְבָאוֹ
  choice: e ... comandava a divisão
  rationale: A expressão indica que Elisama estava à frente da respectiva formação. A formulação verbal é natural em português e conserva a relação de liderança expressa por עַל.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama, filho de Amiúde
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis dos nomes, com a construção genealógica normal “filho de”.
theological_decisions: []
