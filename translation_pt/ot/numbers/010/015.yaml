  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָׂשכָ֑ר נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: pt
  text: E sobre a divisão da tribo dos filhos de Issacar estava Natanael, filho de Zuar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tropa” ou “exército”; o termo hebraico צְבָא indica aqui um contingente tribal organizado em ordem de marcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: E sobre
  rationale: Preserva a ligação coordenativa com a lista anterior e o sentido de autoridade ou comando expresso pela preposição nesta fórmula.
- source_word: צְבָא
  choice: divisão
  rationale: No contexto da ordem de marcha, designa um contingente tribal organizado. “Divisão” comunica essa estrutura sem sugerir necessariamente um exército em combate.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto, o termo se refere inequivocamente à unidade tribal, e não a uma vara ou cajado.
- source_word: בְּנֵי יִשָׂשכָר
  choice: filhos de Issacar
  rationale: Mantém a expressão genealógica hebraica, que funciona naturalmente como designação tribal em português bíblico corrente.
- source_word: נְתַנְאֵל
  choice: Natanael
  rationale: Adota a forma portuguesa tradicional e reconhecível do nome hebraico.
- source_word: בֶּן צוּעָר
  choice: filho de Zuar
  rationale: Reproduz de modo direto a relação filial indicada pela construção hebraica.
theological_decisions: []
