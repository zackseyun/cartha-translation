  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: pt
  text: Assim, partiram do monte de Yahweh numa jornada de três dias[a], e a arca da aliança de Yahweh ia adiante deles numa jornada de três dias, para procurar um lugar de descanso para eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma jornada de três dias”; a expressão ocorre nas duas partes do versículo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para explorar” ou “para buscar um lugar de descanso para eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: O verbo נסע, no contexto dos deslocamentos de Israel, indica levantar acampamento e pôr-se a caminho. “Partiram” expressa isso de modo natural e conciso.
- source_word: מֵהַר יְהוָה
  choice: do monte de Yahweh
  rationale: הַר designa monte ou montanha; “monte” é corrente na linguagem geográfica e bíblica em português. O nome divino é transliterado como “Yahweh”.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: viajaram por três dias / durante esses três dias
  rationale: A expressão indica uma jornada cuja extensão é medida em três dias. A formulação principal comunica isso naturalmente, enquanto a nota registra a alternativa mais formal.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: A arca da aliança de Yahweh
  rationale: 'Mantém de modo claro a cadeia de relação do hebraico: a arca associada à aliança de Yahweh.'
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: ia adiante deles
  rationale: O particípio נֹסֵעַ apresenta ação concomitante ou contínua. “Ia adiante deles” preserva esse aspecto e a posição à frente do povo.
- source_word: לָתוּר
  choice: procurar
  rationale: תור pode significar explorar, buscar ou reconhecer. Neste contexto, “procurar” é natural e não introduz a conotação militar que “espiar” poderia sugerir.
- source_word: מְנוּחָה
  choice: um lugar onde pudessem descansar
  rationale: Embora o substantivo possa significar “descanso”, no contexto da viagem refere-se concretamente a um lugar de repouso ou acampamento.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Função da arca ao ir adiante do povo
  choice: para procurar um lugar onde pudessem descansar
  alternative: para reconhecer um lugar de descanso para eles
  rationale: A tradução conserva a finalidade expressa pelo infinitivo לָתוּר sem ampliar a frase para uma afirmação teológica sobre como a arca realizava essa busca.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição hebraica de “três dias” foi preservada por referência explícita (“esses três dias”), e o particípio foi vertido por uma construção progressiva natural em português.
