  naturalness: A redação é geralmente clara e moderna. A revisão preserva essa clareza, mantendo a repetição intencional de “jornada de três dias” e usando “lugar de descanso”, expressão natural e mais próxima do hebraico.
  terminology: “Yahweh”, “arca da aliança” e “monte” são adequados e consistentes. “Lugar de descanso” traduz bem מְנוּחָה no contexto de deslocamento.
