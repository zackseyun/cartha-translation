  text: וַ/יִּסְע֖וּ בָּ/רִאשֹׁנָ֑ה עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: pt
  text: Assim, partiram pela primeira vez, por ordem de Yahweh, por intermédio de Moisés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés”, expressão que indica mediação ou agência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: No relato das jornadas, נסע indica levantar acampamento e iniciar o deslocamento. “Partiram” expressa isso de modo natural e conciso em português.
- source_word: בָּרִאשֹׁנָה
  choice: pela primeira vez
  rationale: A forma adverbial marca aqui a partida inaugural de Israel do Sinai, não apenas prioridade numa sequência.
- source_word: עַל פִּי
  choice: por ordem de
  rationale: A expressão idiomática, literalmente “sobre a boca de”, significa agir segundo uma ordem ou determinação; o contexto destaca a direção divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso diretamente pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: transmitida por meio de Moisés
  rationale: A expressão idiomática “pela mão de Moisés” indica sua função como agente ou mediador. A formulação portuguesa explicita que a ordem de Yahweh foi comunicada por intermédio dele.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome próprio. “Yahweh” o preserva por transliteração sem substituí-lo por um título.
- issue: Papel de Moisés em בְּיַד מֹשֶׁה
  choice: transmitida por meio de Moisés
  alternative: pela mão de Moisés
  rationale: A tradução mantém Moisés como agente mediador da ordem divina, sem sugerir que a ordem tenha se originado nele.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação conserva a sequência narrativa e torna naturais os dois idiomatismos hebraicos sem apagar a mediação de Moisés.
