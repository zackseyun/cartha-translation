  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh[a] falou a Moisés, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; “Yahweh” é uma transliteração convencional do nome divino.'
    reason: Identifica a forma consonantal hebraica do tetragrama e esclarece a forma usada na tradução.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com דבר introduz um novo acontecimento narrativo. “Falou” é a equivalência portuguesa natural e preserva a fórmula de discurso divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “a” é natural na construção portuguesa “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz o conteúdo do discurso direto; “dizendo” preserva de modo conciso a fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por um título; a nota registra a forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima à fórmula narrativa hebraica. Mantém-se “dizendo” porque o versículo funciona como introdução ao discurso seguinte.
