  text: וַ/יִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי יְהוּדָ֛ה בָּ/רִאשֹׁנָ֖ה לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: pt
  text: A bandeira do acampamento dos filhos de Judá partiu primeiro[a], segundo as suas divisões[b]; e Naassom, filho de Aminadabe, estava à frente da divisão de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estandarte” em vez de “bandeira”. O termo hebraico designa a insígnia tribal sob a qual marchava a unidade do acampamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo as suas tropas” ou “segundo os seus exércitos”. O hebraico emprega um termo de organização militar para as unidades tribais dispostas em ordem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: partiu
  rationale: No contexto das jornadas pelo deserto, נסע indica levantar acampamento e pôr-se em marcha; “partiu” é natural e mantém o movimento narrativo.
- source_word: דֶּגֶל
  choice: bandeira
  rationale: Designa a insígnia tribal em torno da qual se organizava e marchava a unidade do acampamento; “bandeira” é claro no português atual.
- source_word: מַחֲנֵה בְנֵי יְהוּדָה
  choice: acampamento dos filhos de Judá
  rationale: Preserva a construção tribal e genealógica do hebraico, bem como o sentido organizacional de מַחֲנֶה.
- source_word: בָּרִאשֹׁנָה
  choice: primeiro
  rationale: Uso adverbial que indica a ordem da marcha.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas tropas
  rationale: צבא, aqui no plural, descreve agrupamentos organizados em estilo militar; “tropas” comunica esse caráter sem recorrer ao menos corrente “hostes”.
- source_word: וְעַל צְבָאוֹ
  choice: e ... estava à frente da tropa de Judá
  rationale: A expressão introduz quem comandava a unidade; a explicitação “de Judá” evita a ambiguidade pouco natural de um possessivo inanimado em português.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Naassom, filho de Aminadabe
  rationale: Emprega formas portuguesas tradicionais e amplamente reconhecíveis dos nomes bíblicos.
