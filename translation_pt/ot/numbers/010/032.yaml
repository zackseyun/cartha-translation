  source_fidelity: A condição («se você for conosco») e a promessa de benefício correspondem bem ao hebraico. «Todo o bem que Yahweh fizer por nós» comunica adequadamente הַטּוֹב הַהוּא אֲשֶׁר יֵיטִיב יְהוָה עִמָּנוּ, preservando a abertura quanto à natureza do bem. O nome divino «Yahweh» reproduz o tetragrama conforme a política indicada.
