  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: pt
  text: E, se você for conosco, todo o bem que Yahweh fizer por nós, também lhe faremos bem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: E, se
  rationale: A expressão introduz uma condição. Em português atual, “E, se” transmite a função sem reproduzir literalmente o idiomatismo “e acontecerá que”.
- source_word: תֵלֵךְ עִמָּנוּ
  choice: você for conosco
  rationale: הלך com עִם indica acompanhar Israel na viagem; “for conosco” é direto, natural e fiel ao contexto.
- source_word: הַטּוֹב הַהוּא אֲשֶׁר
  choice: todo o bem que
  rationale: A expressão aponta para o bem definido pela oração relativa. “Todo o bem que” preserva a abrangência aberta da promessa em português natural.
- source_word: יֵיטִיב יְהוָה עִמָּנוּ
  choice: Yahweh fizer por nós
  rationale: O hifil de יטב significa fazer bem, beneficiar ou tratar bem. “Fizer por nós” comunica o benefício e mantém a ligação verbal com a oração seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é vertido como nome próprio, preservando o nome divino presente no texto hebraico.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: nós também faremos a você
  rationale: O segundo hifil de יטב retoma o “bem” já expresso, de modo que seu objeto pode ficar elíptico naturalmente em português. “Também” explicita a reciprocidade indicada pelo paralelismo sem acrescentar “o mesmo”, que não aparece de modo expresso no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Natureza do bem prometido
  choice: todo o bem que Yahweh fizer por nós
  alternative: aquele bem com que Yahweh nos beneficiar
  rationale: A formulação não especifica a forma do benefício e preserva a abertura semântica do texto, sem atribuir conteúdo teológico adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “nós” dá clareza e ênfase à reciprocidade; o segundo “bem” fica subentendido, como é natural em português.
