base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: pt
  text: E à frente do contingente da tribo dos filhos de Simeão estava Selumiel, filho de Zurisadai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “divisão” ou “exército”, em lugar de “contingente” (hebraico צְבָא), referindo-se ao grupo tribal organizado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: E à frente de
  rationale: No contexto da ordem de marcha, עַל indica quem estava encarregado do contingente. A expressão portuguesa é natural e preserva a relação de liderança.
- source_word: צְבָא
  choice: contingente
  rationale: Designa aqui o grupo tribal organizado para a marcha. “Contingente” comunica essa organização sem sugerir necessariamente combate ativo.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto de organização de Israel, מַטֵּה designa a unidade tribal.
- source_word: בְּנֵי שִׁמְעוֹן
  choice: filhos de Simeão
  rationale: Mantém a forma hebraica convencional de designar a tribo pelos descendentes do patriarca.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Transliteração portuguesa convencional do nome próprio hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Trata-se de um patronímico direto; esta é a tradução transparente e habitual.
- source_word: צוּרִי שַׁדָּי
  choice: Zurisadai
  rationale: Transliteração portuguesa convencional do nome próprio composto.
