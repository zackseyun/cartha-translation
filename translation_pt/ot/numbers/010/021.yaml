base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: pt
  text: Então os coatitas partiram, levando os objetos sagrados[a], e o tabernáculo foi montado antes que eles chegassem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “portadores do santuário” ou “carregando o santuário”; aqui, a expressão se refere aos objetos sagrados transportados pelos coatitas, distintos da estrutura do tabernáculo mencionada em seguida.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: Então partiram
  rationale: O waw dá continuidade sequencial à narrativa de marcha; “então” expressa essa progressão, e “partiram” é natural no contexto.
- source_word: הַקְּהָתִים
  choice: os coatitas
  rationale: Designação gentílica tradicional e clara, em português, para os descendentes de Coate.
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: levando as coisas sagradas
  rationale: Embora a expressão seja literalmente “portadores do santuário”, o contexto indica os objetos sagrados transportados pelos coatitas, em contraste com a estrutura do tabernáculo mencionada em seguida.
- source_word: הַמִּקְדָּשׁ
  choice: as coisas sagradas
  rationale: Entendido metonimicamente como os objetos pertencentes ao santuário; evita sugerir que os coatitas carregavam toda a estrutura.
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: e o tabernáculo foi montado
  rationale: O verbo está na terceira pessoa do plural, mas sem sujeito explícito. A voz passiva preserva a referência contextual aos levitas que iam adiante sem atribuir equivocadamente a ação aos coatitas.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo consagrado e compreensível para a habitação sagrada móvel no deserto.
- source_word: עַד בֹּאָם
  choice: antes que eles chegassem
  rationale: Expressa naturalmente que a montagem ocorria ou se completava antes da chegada dos coatitas com os objetos sagrados.
