id: NUM.10.11
reference: Numbers 10:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: pt
  text: E aconteceu que, no segundo ano, no segundo mês, no vigésimo dia do mês, a nuvem se elevou[a] de sobre o tabernáculo do testemunho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se levantou» ou «subiu».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «tabernáculo do testemunho»; também pode ser entendido como «habitação do testemunho».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz o acontecimento seguinte na sequência narrativa, preservando a ligação com o contexto sem recorrer à fórmula arcaica «e sucedeu».
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: no segundo ano
  rationale: Equivalência temporal direta e natural em português.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: no segundo mês
  rationale: Mantém de forma direta a especificação cronológica do hebraico.
- source_word: בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: no vigésimo dia do mês
  rationale: Explicita «dia», implícito no idioma hebraico, para produzir uma data clara e idiomática em português.
- source_word: נַעֲלָה
  choice: se elevou
  rationale: Expressa o movimento ascendente da nuvem e sua retirada da posição sobre o tabernáculo, sem acrescentar um agente não expresso.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: O artigo definido remete à nuvem já conhecida no relato da peregrinação.
- source_word: מֵעַל
  choice: de sobre
  rationale: Preserva tanto a origem do movimento quanto a posição espacial da nuvem acima do tabernáculo.
- source_word: מִשְׁכַּן
  choice: tabernáculo
  rationale: Termo estabelecido e preciso para a estrutura portátil que representava a habitação divina no acampamento.
- source_word: הָעֵדֻת
  choice: do testemunho
  rationale: Tradução lexical direta que conserva as ligações do termo com o testemunho da aliança guardado no santuário, sem substituí-lo interpretativamente por «aliança».
theological_decisions:
- issue: Designação do santuário מִשְׁכַּן הָעֵדֻת
  choice: tabernáculo do testemunho
  alternative: habitação do testemunho; tabernáculo da aliança
  rationale: «Tabernáculo do testemunho» acompanha de perto os dois substantivos hebraicos e preserva a ressonância cultual e canônica. «Habitação» é lexicalmente possível, mas menos reconhecível como nome do santuário; «da aliança» explicita uma interpretação que o termo hebraico não formula aqui.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem cronológica do hebraico foi mantida, e os marcadores das notas foram colocados junto às expressões que efetivamente explicam.
