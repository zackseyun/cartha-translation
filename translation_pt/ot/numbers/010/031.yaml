base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: pt
  text: 'E ele disse: “Por favor, não nos deixes, pois sabes onde devemos acampar no deserto, e serás olhos para nós[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “serás olhos para nós” provavelmente significa que servirás de guia, por conheceres o deserto.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Mantém o fluxo narrativo do wayyiqtol hebraico sem tornar a sequência mais enfática do que o texto exige.
- source_word: אַל נָא
  choice: Por favor, não
  rationale: אַל expressa a proibição, e נָא acrescenta o tom de súplica; a formulação é natural e respeitosa em português moderno.
- source_word: תַּעֲזֹב אֹתָנוּ
  choice: nos deixes
  rationale: Expressa adequadamente a ideia de partir e deixar o grupo, sem recorrer a termos mais carregados, como “abandonar” ou “desamparar”.
- source_word: כִּי עַל כֵּן
  choice: pois
  rationale: Introduz de modo claro e digno a razão do pedido.
- source_word: יָדַעְתָּ
  choice: sabes
  rationale: O perfeito hebraico tem relevância presente e se refere ao conhecimento que o interlocutor possui.
- source_word: חֲנֹתֵנוּ
  choice: onde devemos acampar
  rationale: Torna inteligível em português o infinitivo de חנה com sufixo coletivo, entendido no contexto como conhecimento dos lugares ou do modo apropriado de acampar.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é a tradução bíblica corrente e amplamente compreensível de מִדְבָּר, que aqui designa uma região erma, não necessariamente arenosa.
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: e serás como olhos para nós
  rationale: Preserva a imagem hebraica de alguém que atua como os olhos do grupo, ao mesmo tempo que o uso de “como” torna a metáfora natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento na segunda pessoa do singular coerente com a fala dirigida a um indivíduo. A metáfora dos “olhos” foi preservada, e seu sentido provável foi esclarecido em nota.
