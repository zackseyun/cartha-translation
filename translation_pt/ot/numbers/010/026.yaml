  text: וְ/עַל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/026.yaml
  text: And over the company of the tribe of the sons of Asher was Pagiel son of Ocran[a].
translation:
  language: pt
  text: E à frente do contingente da tribo dos filhos de Aser estava Pagiel, filho de Ocrã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exército”, “divisão” ou “tropa”, em vez de “contingente”; o hebraico designa um agrupamento organizado na ordem do acampamento de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: E sobre
  rationale: Mantém a ligação coordenada com a lista dos versículos anteriores e expressa que Pagiel exercia autoridade sobre o contingente tribal.
- source_word: צְבָא
  choice: contingente
  rationale: No contexto da ordem de marcha de Israel, designa um grupo tribal organizado. “Contingente” comunica essa organização sem restringir indevidamente o sentido a um exército em combate.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto, o termo se refere à unidade tribal, e não a uma vara ou cajado literal.
- source_word: בְּנֵי אָשֵׁר
  choice: filhos de Aser
  rationale: Preserva de modo natural a forma hebraica literal e sua função como designação tribal.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: בֶּן עָכְרָן
  choice: filho de Ocrã
  rationale: Reproduz naturalmente o patronímico hebraico; o nome do pai é transliterado segundo a forma portuguesa corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura breve e formular do hebraico foi preservada; “contingente” evita tanto um tom arcaico quanto uma interpretação exclusivamente militar.
