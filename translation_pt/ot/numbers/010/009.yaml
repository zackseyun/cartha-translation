  terminology: “Yahweh”, “terra”, “inimigo que os oprime”, “trombetas”, “serão lembrados” e “serão salvos” são escolhas consistentes com o hebraico e com o registro solicitado. As notas mantêm as alternativas relevantes sem resolver indevidamente a ambiguidade.
