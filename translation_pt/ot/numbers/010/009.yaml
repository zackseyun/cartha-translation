source:
  edition: WLC
  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: pt
  text: E, quando vocês forem à guerra na sua terra contra o inimigo que os oprime[a], deem o toque de alarme com as trombetas. Então vocês serão lembrados diante de Yahweh, seu Deus[b][c], e serão salvos dos seus inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, se vocês forem à guerra na sua terra”. A conjunção hebraica pode introduzir tanto uma condição como uma situação futura.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “vocês serão trazidos à memória diante de Yahweh, seu Deus”; de modo mais interpretativo: “Yahweh, seu Deus, se lembrará de vocês”.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico traz o nome divino YHWH, aqui representado por “Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, quando
  rationale: A combinação pode introduzir uma situação futura ou uma condição. “E, quando” mantém a continuidade do discurso e apresenta com naturalidade a circunstância prevista, sem ocultar a alternativa condicional registrada em nota.
- source_word: תָבֹאוּ מִלְחָמָה
  choice: vocês forem à guerra
  rationale: A expressão hebraica é idiomática e significa entrar em combate ou empenhar-se numa guerra. A formulação escolhida é direta e corrente em português.
- source_word: בְּאַרְצְכֶם
  choice: na sua terra
  rationale: “Terra” preserva a dimensão territorial e pactual de אֶרֶץ melhor que o termo político moderno “país”.
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: contra o inimigo que os oprime
  rationale: A combinação do substantivo צַר com o particípio צֹרֵר descreve tanto o adversário quanto sua ação hostil. “Inimigo que os oprime” conserva ambos os elementos em linguagem clara.
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: façam soar o toque de alarme com as trombetas
  rationale: No contexto militar, o Hifil de רוע indica produzir um sinal ou toque de alarme, não apenas fazer barulho. “Com as trombetas” identifica naturalmente o instrumento empregado.
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: vocês serão lembrados diante de Yahweh, seu Deus
  rationale: A voz passiva preserva a forma Nifal e a tensão do hebraico, sem transformar explicitamente Yahweh no sujeito da oração. “Diante de” mantém a expressão relacional לִפְנֵי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: e serão salvos dos seus inimigos
  rationale: O Nifal de ישׁע expressa ser salvo, libertado ou socorrido. “Salvos” é claro no contexto militar e preserva a ressonância mais ampla de salvação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o tetragrama como nome próprio. “Yahweh” conserva esse nome, em vez de substituí-lo pelo título “SENHOR”.
- issue: Sentido e voz de וֲנִזְכַּרְתֶּם
  choice: vocês serão lembrados diante de Yahweh, seu Deus
  alternative: Yahweh, seu Deus, se lembrará de vocês
  rationale: A tradução principal mantém a voz passiva do hebraico e sua tensão teológica. A formulação ativa, embora interpretativamente plausível, explicita como sujeito aquele que a construção hebraica deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e ampla inteligibilidade internacional. O plural “vocês” torna explícito o destinatário coletivo. A voz passiva em “serão lembrados” foi mantida deliberadamente para não resolver a ambiguidade teológica do original.
