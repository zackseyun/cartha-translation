  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: pt
  text: Os filhos de Arão, os sacerdotes, tocarão as trombetas; e isso será para vocês um estatuto permanente[a], por todas as suas gerações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um estatuto perpétuo” ou “um estatuto para sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: Os filhos de Arão
  rationale: Mantém a expressão familiar literal e natural em português, sem transformá-la numa designação institucional mais interpretativa.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Conserva a identificação apositiva dos filhos de Arão.
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  choice: tocarão as trombetas
  rationale: No contexto de instrumentos, תקע significa tocar ou fazer soar. “Tocarão” expressa com naturalidade o valor normativo do imperfeito hebraico.
- source_word: וְהָיוּ לָכֶם
  choice: e isso será para vocês
  rationale: Embora o verbo hebraico esteja no plural, a expressão resume idiomaticamente como norma permanente a determinação precedente. O singular neutro “isso” evita um referente plural obscuro em português sem alterar o sentido jurídico.
- source_word: לְחֻקַּת עוֹלָם
  choice: um estatuto permanente
  rationale: A fórmula jurídica comunica vigência duradoura. “Permanente” preserva essa força sem decidir de modo indevido se עוֹלָם exige duração absolutamente infinita neste contexto.
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Forma portuguesa clara para a continuidade da norma ao longo das gerações sucessivas.
theological_decisions:
- issue: Alcance temporal de חֻקַּת עוֹלָם
  choice: um estatuto permanente
  alternative: um estatuto perpétuo; um estatuto para sempre
  rationale: A expressão indica uma ordenança duradoura na vida pactual de Israel. “Permanente” mantém a força contínua da fórmula, enquanto a nota preserva as traduções mais absolutas possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção legal permanece clara, sem acrescentar “de prata”, informação presente no contexto imediato, mas não repetida neste versículo.
