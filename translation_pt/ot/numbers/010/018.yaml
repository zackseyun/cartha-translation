  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: pt
  text: Então partiu o estandarte[a] do acampamento de Rúben, segundo as suas divisões[b]; e Elizur, filho de Sedeur, estava à frente do seu contingente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bandeira”.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme os seus exércitos” ou “segundo os seus contingentes”; o termo hebraico pode indicar agrupamentos organizados em moldes militares.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Então partiu
  rationale: O waw consecutivo dá sequência à narrativa. “Então” expressa essa progressão, e “partiu” é natural no contexto de deslocamento do acampamento sem acrescentar a ideia específica de desmontá-lo.
- source_word: דֶּגֶל
  choice: estandarte
  rationale: Designa o sinal tribal sob o qual o acampamento marchava. “Estandarte” preserva a imagem concreta e é corrente em português; “bandeira” é uma alternativa possível.
- source_word: מַחֲנֵה רְאוּבֵן
  choice: do acampamento de Rúben
  rationale: Reproduz naturalmente a relação construta e possessiva do hebraico.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: O plural צבאות descreve aqui agrupamentos organizados para a marcha. “Divisões” mantém o sentido coletivo e a nuance de organização sem sugerir necessariamente combate.
- source_word: וְעַל צְבָאוֹ
  choice: e ... estava à frente do seu contingente
  rationale: על indica autoridade ou comando. “À frente” comunica essa relação naturalmente; “contingente” representa o singular צבא e evita a repetição pouco elegante de “divisão”.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Transliteração convencional do nome próprio hebraico.
- source_word: בֶּן שְׁדֵיאוּר
  choice: filho de Sedeur
  rationale: Tradução normal do patronímico, com transliteração convencional do nome do pai.
