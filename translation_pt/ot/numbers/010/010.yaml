  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְ/י֨וֹם שִׂמְחַתְ/כֶ֥ם וּֽ/בְ/מוֹעֲדֵי/כֶם֮ וּ/בְ/רָאשֵׁ֣י חָדְשֵׁי/כֶם֒ וּ/תְקַעְתֶּ֣ם בַּ/חֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵי/כֶ֔ם וְ/עַ֖ל זִבְחֵ֣י שַׁלְמֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֤ם לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י אֱלֹֽהֵי/כֶ֔ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: pt
  text: No dia da sua alegria, nas suas ocasiões determinadas e no início dos seus meses[a], vocês tocarão as trombetas sobre os seus holocaustos e sobre os seus sacrifícios de paz[b]. E serão para vocês como memorial diante do seu Deus. Eu sou Yahweh, o Deus de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas suas luas novas”. O hebraico diz literalmente “no início dos seus meses”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sacrifícios de comunhão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: sua alegria
  rationale: Expressa de modo natural o sentido de alegria ou júbilo, preservando a formulação singular coletiva do hebraico.
- source_word: מוֹעֲדֵיכֶם
  choice: suas ocasiões determinadas
  rationale: Mantém a amplitude de מוֹעֵד como ocasião ou tempo marcado, sem restringir o termo apenas a festas.
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: o início dos seus meses
  rationale: Reproduz o sentido literal de 'cabeças/inícios dos seus meses'; a referência contextual às luas novas é indicada em nota.
- source_word: וּתְקַעְתֶּם
  choice: vocês tocarão
  rationale: Em português, 'tocar as trombetas' é a expressão idiomática natural para o ato de fazê-las soar.
- source_word: חֲצֹצְרֹת
  choice: as trombetas
  rationale: Traduz diretamente o instrumento cultual sem acrescentar 'de prata', informação presente no contexto anterior, mas não neste versículo.
- source_word: עַל עֹלֹתֵיכֶם
  choice: sobre os seus holocaustos
  rationale: Preserva a preposição עַל e a imagem ritual das trombetas soando sobre ou durante as ofertas.
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: os seus sacrifícios de paz
  rationale: Conserva a terminologia sacrificial e a ligação semântica de שְׁלָמִים com paz, integridade e bem-estar.
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: E serão para vocês como memorial
  rationale: Mantém o plural sem impor um antecedente explícito e preserva o sentido cultual de algo apresentado para memória ou lembrança.
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: diante do seu Deus
  rationale: Equivale naturalmente a 'perante/na presença de seu Deus' e conserva a linguagem ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal revelado sem substituí-lo por um título.
- issue: Tradução do termo sacrificial שְׁלָמִים
  choice: sacrifícios de paz
  alternative: sacrifícios de comunhão
  rationale: '''Sacrifícios de paz'' mantém a associação lexical com paz, integridade e bem-estar, enquanto a alternativa legítima destaca a dimensão de comunhão.'
- issue: Referente do plural וְהָיוּ
  choice: manter o sujeito sem antecedente explícito
  alternative: explicitar 'as trombetas' ou 'os toques'
  rationale: O contexto relaciona o memorial ao toque das trombetas junto às ofertas, mas o hebraico não repete um substantivo; a formulação portuguesa conserva essa abertura.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com tratamento por “vocês”. Mantiveram-se a estrutura enumerativa, a terminologia cultual “holocaustos” e “memorial”, e a ambiguidade do sujeito plural na segunda frase. Os marcadores [a] e [b] foram posicionados junto às expressões às quais as notas efetivamente se referem.
