  text: These were the stages of the sons of Israel by their divisions[c][b][a], and they set out.
translation:
  language: pt
  text: Estas foram as etapas dos filhos de Israel[a], segundo as suas divisões[b]; e eles partiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas”; literalmente, “dos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo os seus exércitos” ou “por seus agrupamentos”. O hebraico indica grupos organizados para a marcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas foram
  rationale: O demonstrativo plural introduz uma síntese retrospectiva. Embora o hebraico não tenha cópula explícita, o pretérito é natural em português neste contexto narrativo.
- source_word: מַסְעֵי
  choice: as etapas
  rationale: O plural construto de מַסָּע pode designar jornadas, partidas ou etapas de marcha. “Etapas” expressa bem os movimentos sucessivos no percurso pelo deserto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Preserva a expressão familiar hebraica de modo claro e tradicional, sem substituir silenciosamente pela forma idiomática “israelitas”.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: צְבָאוֹת indica agrupamentos organizados para a marcha. “Divisões” comunica essa organização de caráter militar sem sugerir necessariamente combate ativo.
- source_word: וַיִּסָּעוּ
  choice: e eles partiram
  rationale: A forma narrativa de נסע descreve o início do deslocamento. “Partiram” é corrente, conciso e adequado à linguagem de viagem.
