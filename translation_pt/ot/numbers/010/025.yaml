  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: pt
  text: Então partiu o estandarte[a] do acampamento dos filhos de Dã, que fazia a retaguarda[b] de todos os acampamentos, segundo as suas divisões[c]; e Aiezer, filho de Amisadai, comandava a sua divisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bandeira”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fechando a marcha”.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico também pode ser traduzido como “exércitos” ou “companhias”; aqui se refere às unidades tribais organizadas na ordem de marcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: Então partiu
  rationale: O waw consecutivo dá continuidade à sequência narrativa; “então” expressa essa progressão, e “partiu” é natural no contexto da marcha.
- source_word: דֶּגֶל
  choice: estandarte
  rationale: Designa o sinal tribal sob o qual o acampamento marchava. “Estandarte” conserva o sentido militar e representativo sem soar excessivamente técnico.
- source_word: מַחֲנֵה בְנֵי דָן
  choice: do acampamento dos filhos de Dã
  rationale: Mantém a construção familiar hebraica e a referência corporativa à tribo de Dã.
- source_word: מְאַסֵּף
  choice: na retaguarda
  rationale: Neste contexto de marcha, o particípio indica a unidade que seguia por último, recolhendo e resguardando a parte traseira da formação.
- source_word: לְכָל הַמַּחֲנֹת
  choice: de todos os acampamentos
  rationale: Expressa a relação da unidade de Dã com o conjunto completo dos acampamentos em marcha.
- source_word: לְצִבְאֹתָם
  choice: segundo as suas divisões
  rationale: צבאות refere-se aqui às unidades tribais organizadas para a marcha, não necessariamente a exércitos em combate.
- source_word: וְעַל צְבָאוֹ
  choice: comandava a sua divisão
  rationale: A construção com על identifica quem estava à frente da unidade. A formulação verbal é idiomática em português e evita a rigidez de “sobre a sua divisão estava”.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Aiezer, filho de Amisadai
  rationale: Os nomes são transliterados em formas naturais em português, e a fórmula patronímica hebraica é preservada.
