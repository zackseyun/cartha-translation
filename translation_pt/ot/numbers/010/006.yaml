  yaml_path: translation/ot/numbers/010/006.yaml
  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: pt
  text: Quando vocês derem o segundo toque de alarme[a], os acampamentos situados ao sul partirão; darão um toque de alarme para as suas partidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toque” ou “sinal”. O termo hebraico designa aqui um toque distinto de trombeta usado para orientar o deslocamento dos acampamentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Quando vocês derem ... toque
  rationale: O verbo תקע, neste contexto, designa tocar as trombetas. A construção temporal explicita naturalmente a sequência das instruções e preserva a segunda pessoa do plural.
- source_word: תְּרוּעָה
  choice: toque de alarme
  rationale: No contexto dos sinais de trombeta em Números 10, indica um toque distinto que ordena o deslocamento, não um alarme genérico.
- source_word: שֵׁנִית
  choice: segundo
  rationale: O ordinal qualifica o toque e distingue este sinal do primeiro mencionado no versículo anterior.
- source_word: וְנָסְעוּ
  choice: partirão
  rationale: נסע descreve levantar acampamento e iniciar o deslocamento; 'partirão' é claro e natural em português.
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: os acampamentos que estiverem acampados
  rationale: Mantém tanto o substantivo plural quanto o particípio descritivo, apesar da repetição deliberada, e refere-se aos agrupamentos tribais estacionados.
- source_word: תֵּימָנָה
  choice: ao sul
  rationale: Aqui identifica a posição dos acampamentos no lado sul, e não a direção para a qual viajariam.
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: Toques de alarme serão dados
  rationale: O hebraico emprega a terceira pessoa masculina plural, mas sem sujeito expresso. A passiva portuguesa preserva essa indeterminação sem atribuir necessariamente o toque aos próprios acampamentos.
- source_word: לְמַסְעֵיהֶם
  choice: para as suas partidas
  rationale: מסע refere-se aos momentos ou etapas de levantar acampamento; a formulação conserva a referência distributiva aos deslocamentos prescritos.
