base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/005.yaml
  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: pt
  text: Quando vocês derem um toque de alarme[a], os acampamentos que estão no lado leste partirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um toque de sinal». O termo hebraico se refere aqui ao toque distintivo de trombeta que indicava a movimentação do acampamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: Quando vocês derem um toque
  rationale: O verbo תקע, no contexto das trombetas, significa tocar ou fazê-las soar. A oração introduz a circunstância temporal para a partida, por isso «Quando vocês derem» comunica naturalmente a relação sintática.
- source_word: תְּרוּעָה
  choice: de alarme
  rationale: תְּרוּעָה designa aqui um toque distintivo usado como sinal para movimentar o acampamento; «toque de alarme» preserva o caráter técnico do sinal sem reduzi-lo a um som genérico.
- source_word: וְנָסְעוּ
  choice: partirão
  rationale: נסע descreve levantar acampamento e iniciar a marcha. «Partirão» é claro, natural e adequado ao tom instrutivo do contexto.
- source_word: הַמַּחֲנוֹת
  choice: os acampamentos
  rationale: O plural se refere aos agrupamentos tribais dispostos ao redor do tabernáculo. A tradução direta «os acampamentos» conserva essa referência coletiva.
- source_word: הַחֹנִים
  choice: que estão
  rationale: O particípio caracteriza os acampamentos por sua posição. Em português, «que estão no lado leste» expressa naturalmente esse valor locativo sem a redundância pouco idiomática de «acampamentos que estão acampados».
- source_word: קֵדְמָה
  choice: no lado leste
  rationale: Embora a forma possa ter valor direcional, neste contexto identifica a posição oriental dos acampamentos na disposição de Israel; «no lado leste» torna clara a força locativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural «vocês» explicita o sujeito plural do hebraico; «partirão» mantém o tom prescritivo sem recorrer ao pouco natural «deverão partir».
