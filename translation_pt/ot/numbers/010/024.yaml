  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעוֹנִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: pt
  text: E sobre a formação da tribo dos filhos de Benjamim estava Abidã, filho de Gideôni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exército” ou “divisão”, em vez de “formação”; o termo hebraico pode designar um agrupamento organizado em moldes militares.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: E sobre
  rationale: Preserva a conjunção que dá continuidade à lista e a preposição que indica a posição de liderança sobre a formação tribal.
- source_word: צְבָא
  choice: formação
  rationale: No contexto da ordem de marcha, designa um agrupamento organizado em moldes militares, sem exigir o sentido mais restrito de exército em combate.
- source_word: מַטֵּה
  choice: tribo
  rationale: Aqui o termo se refere à unidade tribal, e não ao objeto literal 'vara' ou 'cajado'.
- source_word: בְּנֵי בִנְיָמִן
  choice: filhos de Benjamim
  rationale: Mantém a construção genealógica hebraica e a fórmula tribal repetida nesta seção, em português claro e digno.
- source_word: אֲבִידָן
  choice: Abidã
  rationale: Transliteração tradicional e natural do nome em português.
- source_word: בֶּן גִּדְעוֹנִי
  choice: filho de Gideoni
  rationale: Equivalente natural da identificação patronímica hebraica; Gideoni preserva de perto a forma do nome-fonte.
