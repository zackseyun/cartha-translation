  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: pt
  text: E a nuvem de Yahweh estava sobre eles durante o dia, quando partiam do acampamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava acima deles durante o dia”.'
    reason: Alternativa lexical para עֲלֵיהֶם, preservando seu sentido estritamente espacial.
lexical_decisions:
- source_word: וַ/עֲנַן
  choice: E a nuvem
  rationale: עָנָן significa “nuvem”; a conjunção prefixeda é mantida como “E” para preservar a ligação narrativa com o versículo anterior. A construção com o nome divino torna o substantivo definido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é transliterado como nome pessoal, em vez de ser substituído por um título.
- source_word: עֲלֵי/הֶם
  choice: estava sobre eles
  rationale: A preposição עַל com o sufixo pronominal expressa posição acima de ou sobre o grupo; “sobre eles” conserva a amplitude locativa e possivelmente protetora da expressão.
- source_word: יוֹמָם
  choice: durante o dia
  rationale: O advérbio significa “de dia” ou “durante o dia”. Esta formulação é natural em português e evita sugerir que a nuvem estivesse presente apenas no instante da partida.
- source_word: בְּ/נָסְעָ/ם
  choice: quando partiam
  rationale: O infinitivo construto de נסע com בְּ tem valor temporal. “Partiam” comunica o ato de levantar acampamento e iniciar a marcha, preservando a relação simultânea sem tornar a ação excessivamente pontual.
- source_word: מִן הַ/מַּחֲנֶה
  choice: do acampamento
  rationale: מַחֲנֶה designa o acampamento de Israel; com o artigo, “do acampamento” é a correspondência direta e natural.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título; “Jeová” representa uma forma tradicional posterior.
- issue: Sentido de עֲלֵיהֶם
  choice: sobre eles
  alternative: acima deles; pousava sobre eles
  rationale: A expressão hebraica é locativa e pode também evocar proteção, mas não explicita uma ação como “pousar”. A tradução mantém essa abertura sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém-se a coordenação narrativa inicial, o nome divino transliterado e a possível nuance locativa/protetora de “sobre eles”.
