  text: וְ/עַ֨ל צְבָ֔א מַטֵּ֖ה בְּנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/027.yaml
  text: And over the company of the tribe of the sons of Naphtali was Ahira son of Enan[a].
translation:
  language: pt
  text: E à frente do contingente da tribo dos filhos de Naftali estava Aira, filho de Enã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exército”, “tropa” ou “divisão”, em vez de “contingente”. O termo hebraico צְבָא refere-se aqui a uma unidade tribal organizada na disposição do acampamento e da marcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: E à frente de
  rationale: A conjunção liga o versículo à sequência anterior, e עַל apresenta o líder posto sobre a unidade. “À frente de” expressa essa função com naturalidade em português.
- source_word: צְבָא
  choice: contingente
  rationale: No contexto da organização do acampamento e da marcha, o termo designa a unidade tribal organizada, com caráter militar, sem necessariamente indicar um exército nacional permanente.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto, מַטֵּה designa a unidade tribal, e não o objeto literal “bastão”.
- source_word: בְּנֵי נַפְתָּלִי
  choice: filhos de Naftali
  rationale: Mantém a expressão familiar explícita do hebraico, que aqui identifica os descendentes e membros da tribo de Naftali.
- source_word: אֲחִירַע
  choice: Aíra
  rationale: Transliteração portuguesa tradicional e legível do nome hebraico.
- source_word: בֶּן עֵינָן
  choice: filho de Enã
  rationale: Reproduz de modo conciso e idiomático a construção patronímica hebraica.
theological_decisions: []
