  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: pt
  text: 'Moisés disse a Hobabe, filho de Reuel, o midianita, sogro de Moisés[a]: “Estamos partindo para o lugar a respeito do qual Yahweh disse: ‘Eu o darei a vocês.’ Venha conosco, e lhe faremos bem, pois Yahweh falou coisas boas a respeito de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico חֹתֵן pode designar, de modo mais amplo, um parente por casamento; alguns entendem aqui “cunhado de Moisés” ou simplesmente “parente de Moisés por casamento”, em vez de “sogro de Moisés”.
    reason: alternative_reading
lexical_decisions:
- source_word: חֹבָב בֶּן רְעוּאֵל הַמִּדְיָנִי
  choice: Hobabe, filho de Reuel, o midianita
  rationale: Translitera os nomes pessoais segundo formas correntes em português e mantém o gentílico definido do hebraico.
- source_word: חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  rationale: חֹתֵן frequentemente designa o sogro, embora possa ter sentido mais amplo de parente por casamento; essa ambiguidade é preservada em nota.
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: Estamos partindo
  rationale: O particípio acompanhado do pronome indica uma ação em curso ou iminente; a expressão é natural em português no contexto do início da viagem.
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: 'a respeito do qual Yahweh disse: ‘Eu o darei a vocês’'
  rationale: Mantém a construção relativa, o nome divino e a promessa em discurso direto; “o” retoma “lugar”, e “vocês” representa o plural hebraico.
- source_word: לְכָה אִתָּנוּ
  choice: Venha conosco
  rationale: Convite idiomático e natural, orientado pela perspectiva de quem fala.
- source_word: וְהֵטַבְנוּ לָךְ
  choice: e faremos o bem a você
  rationale: Preserva o sentido causativo e benefactivo do verbo יטב sem reduzi-lo apenas à ideia de tratamento cortês.
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: falou coisas boas a respeito de Israel
  rationale: Conserva o verbo “falar” e a referência ao bem anunciado acerca de Israel, sem explicitar como “promessa” aquilo que o hebraico deixa menos determinado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Relação familiar expressa por חֹתֵן מֹשֶׁה
  choice: sogro de Moisés
  alternative: parente de Moisés por casamento; cunhado de Moisés
  rationale: “Sogro” é um valor lexical comum e adequado ao texto principal, mas o termo pode ser mais abrangente; a nota evita resolver além da evidência textual a identificação exata de Hobabe.
- issue: Natureza do bem dito por Yahweh acerca de Israel
  choice: falou coisas boas a respeito de Israel
  alternative: prometeu o bem a Israel
  rationale: A formulação conserva a tensão entre declaração favorável e promessa, sem acrescentar ao verbo דִּבֶּר uma especificidade não expressa diretamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe acompanha de perto o hebraico sem sacrificar a naturalidade; a repetição de “Moisés” foi mantida por corresponder ao texto-fonte.
