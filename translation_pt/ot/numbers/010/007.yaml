  text: וּ/בְ/הַקְהִ֖יל אֶת הַ/קָּהָ֑ל תִּתְקְע֖וּ וְ/לֹ֥א תָרִֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: pt
  text: Quando reunirem a congregação, tocarão, mas não darão o toque de alarme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/הַקְהִיל
  choice: Mas, quando reunirem
  rationale: A preposição בְּ com o infinitivo construto no hifil de קהל tem valor temporal, e a conjunção introduz contraste com o sinal de partida do versículo anterior.
- source_word: הַקָּהָל
  choice: a congregação
  rationale: קָהָל designa aqui a comunidade de Israel convocada; “congregação” é claro, digno e adequado ao contexto comunitário.
- source_word: תִּתְקְעוּ
  choice: vocês tocarão
  rationale: תקע se refere ao ato de tocar as trombetas já mencionadas no contexto. O objeto não é repetido no hebraico, por isso também fica implícito na tradução.
- source_word: וְלֹא
  choice: porém não
  rationale: A formulação torna natural em português o contraste entre o toque comum de convocação e o sinal distintivo de alarme.
- source_word: תָרִיעוּ
  choice: darão o toque de alarme
  rationale: No contexto de trombetas, o hifil de רוע indica o sinal distintivo de alarme usado para pôr os acampamentos em marcha, não simplesmente produzir som.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se a cadência instrutiva e o contraste técnico entre tocar para reunir e dar o toque de alarme, sem explicitar “as trombetas”, que está apenas no contexto.
