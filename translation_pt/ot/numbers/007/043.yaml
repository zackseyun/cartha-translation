base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: A oferta dele foi um prato de prata[a], pesando cento e trinta siclos, e uma bacia de prata[b], pesando setenta siclos, segundo o siclo do santuário[c]; ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa” (קַעֲרָה).
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela”; trata-se de um recipiente ritual (מִזְרָק).
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “pelo siclo do santuário”, isto é, conforme o padrão de peso do santuário.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: A oferta dele foi
  rationale: קָרְבָּן designa aqui uma oferta apresentada no contexto do culto. A construção com “foi” expressa naturalmente em português a oração nominal hebraica.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קְעָרָה indica um recipiente largo, como prato ou travessa. “Prato” é claro e direto, mantendo a alternativa “travessa” em nota.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesando cento e trinta siclos
  rationale: A formulação idiomática comunica explicitamente o peso indicado pelo hebraico מִשְׁקָלָהּ sem tornar a frase pesada em português.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente ritual, possivelmente usado para aspergir ou lançar líquidos. “Bacia” preserva a referência geral ao objeto sem impor uma função não declarada neste versículo.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesando setenta siclos
  rationale: O contexto mostra que a medida se refere ao peso da bacia; a forma participial é natural e inequívoca em português.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão identifica o padrão de peso oficial ligado ao santuário. A tradução mantém o substantivo concreto e esclarece o sentido por nota.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambos estavam cheios
  rationale: Mantém a referência explícita aos dois recipientes e representa diretamente o adjetivo hebraico “cheios”.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: farinha fina misturada com azeite
  rationale: “Farinha fina” é o equivalente cultual usual de סֹלֶת, e “misturada com azeite” traduz de modo atual e preciso o particípio passivo.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: Neste contexto sacerdotal, מִנְחָה é uma oferta composta de produto cerealífero. “Oferta de cereal” preserva essa especificidade cultual.
