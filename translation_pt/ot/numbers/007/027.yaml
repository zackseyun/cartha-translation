  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho
  rationale: A expressão designa um bovino macho oferecido em sacrifício. “Novilho” comunica de modo natural em português tanto o animal quanto sua condição jovem, sem reproduzir literalmente o idiomatismo hebraico “filho do gado”.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: “Carneiro” é o termo português corrente para o macho adulto da ovelha e corresponde ao animal sacrificial indicado por אַיִל.
- source_word: כֶּבֶשׂ אֶחָד
  choice: um cordeiro
  rationale: כֶּבֶשׂ indica aqui um cordeiro macho. Em português, “cordeiro” funciona naturalmente como masculino e, neste contexto ritual, preserva a referência requerida sem a formulação pesada “cordeiro macho”.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: Expressão idiomática de idade, literalmente “filho do seu ano”. “De um ano” é clara, natural e mantém a exigência etária do texto.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é a oferta inteiramente queimada. “Holocausto” é o termo bíblico sacrificial tradicional e ainda inteligível em português, enquanto “para” expressa sua finalidade na lista.
