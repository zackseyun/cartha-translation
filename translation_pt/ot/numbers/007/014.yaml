  text: כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/014.yaml
  text: one gold dish[a], weighing ten shekels, full of incense;
translation:
  language: pt
  text: uma vasilha de ouro[a], de dez siclos, cheia de incenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “uma vasilha de ouro, dez, cheia de incenso”; “siclos” fica subentendido pela fórmula repetida das ofertas no contexto próximo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: No contexto do inventário ritual, designa um pequeno recipiente para incenso. “Vasilha” evita a imagem de uma colher de mesa e preserva a forma não especificada do objeto.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal feminino, em concordância com כַּף; indica uma única vasilha.
- source_word: עֲשָׂרָה
  choice: de dez siclos
  rationale: O hebraico traz literalmente “dez”, mas a unidade de peso fica subentendida pela fórmula repetida no contexto imediato. Explicitá-la produz português natural e preciso.
- source_word: זָהָב
  choice: de ouro
  rationale: Indica o material de que era feito o recipiente; esta é a formulação mais natural em português.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Adjetivo predicativo feminino que descreve o conteúdo da vasilha.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Termo corrente e exato para a substância aromática empregada no culto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Vasilha” comunica um pequeno recipiente ritual sem impor a forma mais específica sugerida por “colher”, “taça” ou “prato”.
