source:
  edition: WLC
  text: וְ/קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: A sua oferta foi um prato de prata[a], que pesava cento e trinta siclos, e uma bacia de prata, que pesava setenta siclos, segundo o siclo do santuário[b]. Ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «travessa»; o termo hebraico indica um recipiente largo e raso.
    reason: lexical_alternative
  - marker: b
    text: O siclo do santuário era o padrão oficial de peso usado nesse contexto sagrado.
    reason: cultural_context
lexical_decisions:
- source_word: וְקָרְבָּנוֹ
  choice: A sua oferta foi
  rationale: קָרְבָּן designa uma oferta apresentada em contexto cultual. A formulação é natural em português e o waw funciona como conexão narrativa, sem exigir um «e» inicial isolado.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קַעֲרָה indica um recipiente largo e relativamente raso; «prato» é claro e preserva essa forma provável.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: Explicita em português corrente a relação entre o recipiente e seu peso, mantendo exatamente o valor hebraico.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente ritual, possivelmente usado para aspergir ou lançar líquidos. «Bacia» distingue-o do prato sem introduzir no texto uma função não declarada neste versículo.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: A repetição verbal torna clara a segunda indicação de peso em português.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Preserva a referência formal ao padrão de peso cultual sem convertê-lo em medida moderna incerta.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Ambos estavam cheios
  rationale: Mantém a referência explícita aos dois recipientes e concorda com os substantivos masculinos «prato» e «recipiente» conceitualmente, embora «bacia» seja feminino; «ambos» retoma o conjunto dos dois objetos.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente tradicional e preciso para a farinha refinada empregada nas ofertas.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Reproduz o particípio passivo e usa «azeite», a designação portuguesa natural para o óleo de oliva nesse contexto.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa a categoria sacrificial composta de cereal; a tradução evita o sentido genérico de «oferta».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se «siclo» e «santuário» como termos bíblicos estabelecidos. A sintaxe de inventário do hebraico foi suavemente ajustada para fluência, sem alterar os dados nem acrescentar uma função ritual aos recipientes.
