lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: No sexto dia
  rationale: A preposição בְּ com יוֹם introduz a indicação temporal, e o ordinal הַשִּׁשִּׁי modifica “dia”; “No sexto dia” é a formulação natural em português.
- source_word: נָשִׂיא
  choice: líder
  rationale: No contexto de Números 7, designa o chefe oficialmente reconhecido de uma tribo. “Líder” é claro e atual, sem sugerir necessariamente realeza, como poderia ocorrer com “príncipe”.
- source_word: לִבְנֵי גָד
  choice: dos filhos de Gade
  rationale: Preserva a expressão familiar e tribal do hebraico, em que לְ indica a relação do líder com os descendentes ou a tribo de Gade.
- source_word: אֶלְיָסָף
  choice: Eliasafe
  rationale: Transliteração portuguesa corrente do nome hebraico, adaptada à legibilidade em português.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente natural da construção patronímica hebraica.
- source_word: דְּעוּאֵל
  choice: Deuel
  rationale: Representa a forma דְּעוּאֵל presente no texto hebraico deste versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão literal “filhos de Gade” foi mantida para preservar o modo hebraico de identificar a tribo. Os dois-pontos finais refletem a função introdutória do versículo na lista da oferta apresentada em seguida.
