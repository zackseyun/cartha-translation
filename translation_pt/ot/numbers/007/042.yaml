base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: pt
  text: No sexto dia, o líder dos filhos de Gade foi Eliasafe, filho de Deuel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico traz “Deuel” aqui; compare outras passagens em que o nome aparece como “Reuel”.
