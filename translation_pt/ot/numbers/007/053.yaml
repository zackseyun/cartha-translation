base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: pt
  text: e, para o sacrifício de comunhão[a], dois bovinos[b], cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Elisama, filho de Amiúde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por «sacrifício de paz» ou «sacrifício de bem-estar». O termo hebraico costuma designar um sacrifício associado à paz, à integridade e ao bem-estar, frequentemente acompanhado de uma refeição compartilhada.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «dois do gado». O termo é coletivo e não especifica aqui o sexo dos animais; algumas traduções trazem «dois bois».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: e, para o sacrifício das ofertas de comunhão
  rationale: A conjunção e a preposição dão continuidade à lista. “Sacrifício” representa זֶבַח, e “ofertas de comunhão” comunica o caráter relacional e compartilhado de שְׁלָמִים sem reduzir o termo apenas a uma ideia subjetiva de paz.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bovinos
  rationale: בָּקָר é um termo coletivo para gado bovino e não especifica aqui sexo nem função; “dois bovinos” é preciso e natural em português.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa carneiros adultos machos, distinção preservada na tradução.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים designa caprinos machos; “bodes” expressa essa especificação de modo direto.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: בְּנֵי שָׁנָה é a expressão idiomática para animais de um ano. “Cordeiros” reproduz o substantivo masculino hebraico sem acrescentar uma explicitação de sexo além da forma lexical.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: A oração nominal identifica a oferta apresentada; o passado é natural no contexto narrativo da enumeração.
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: Elisama, filho de Amiúde
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis, e o patronímico é vertido diretamente por “filho de”.
theological_decisions:
- issue: Sentido cultual de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: O termo pode evocar paz, integridade, bem-estar e uma refeição sacrificial compartilhada. “Comunhão” funciona bem no contexto cultual, enquanto a nota preserva as alternativas legítimas sem impor uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura enumerativa do hebraico foi preservada sem literalismos desnecessários; as notas mantêm as principais alternativas lexicais e a ambiguidade do termo coletivo para gado.
