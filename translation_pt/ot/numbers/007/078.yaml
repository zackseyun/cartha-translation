  text: בְּ/יוֹם֙ שְׁנֵ֣ים עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן עֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/078.yaml
  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: pt
  text: No décimo segundo dia, o líder dos filhos de Naftali foi Aira, filho de Enã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: No décimo segundo dia
  rationale: A preposição בְּ com יוֹם tem sentido temporal, e a sequência cardinal hebraica funciona aqui como expressão ordinal. A formulação é natural em português e mantém a fórmula temporal do capítulo.
- source_word: נָשִׂיא
  choice: líder
  rationale: No contexto tribal, designa o chefe ou representante reconhecido da tribo. “Líder” é claro e evita a conotação monárquica que “príncipe” pode sugerir.
- source_word: לִבְנֵי נַפְתָּלִי
  choice: dos filhos de Naftali
  rationale: O לְ indica relação com o grupo tribal; “dos filhos de Naftali” preserva tanto a afiliação tribal quanto a forma masculina plural do hebraico.
- source_word: אֲחִירַע
  choice: Aira
  rationale: Transliteração portuguesa corrente do nome pessoal hebraico.
- source_word: בֶּן עֵינָן
  choice: filho de Enã
  rationale: Reproduz diretamente a construção patronímica hebraica; os nomes seguem uma transliteração natural em português.
theological_decisions:
- issue: Designação tribal marcada por gênero em בְּנֵי
  choice: filhos de Naftali
  alternative: descendentes de Naftali
  rationale: A expressão hebraica é masculina plural e constitui a designação tribal tradicional. A tradução preserva essa forma sem ampliar nem neutralizar silenciosamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e continuidade estilística em relação à fórmula repetida de Números 7.
