  text: uma vasilha de ouro de dez siclos[a], cheia de incenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o hebraico diz: “uma vasilha, dez, de ouro, cheia de incenso”; “siclos” foi acrescentado com base na fórmula de oferta repetida no contexto ao redor.'
