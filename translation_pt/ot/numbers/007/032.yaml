lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: No contexto do inventário de ofertas para o tabernáculo, designa um pequeno recipiente para incenso. “Vasilha” é claro e natural em português, sem sugerir necessariamente uma colher ou uma tigela de formato específico.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal feminino em concordância com כַּף.
- source_word: עֲשָׂרָה
  choice: dez siclos
  rationale: O hebraico traz literalmente apenas “dez”, mas a unidade de peso é elíptica e pode ser recuperada da fórmula repetida no contexto imediato. “Siclos” torna a medida inteligível sem ocultar a forma abreviada do original, registrada em nota.
- source_word: זָהָב
  choice: de ouro
  rationale: Indica o material de que era feito o recipiente; “de ouro” é a formulação idiomática e precisa em português.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Expressa de modo conciso o estado e o conteúdo da vasilha, preservando a concordância feminina.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Equivalente corrente para a substância aromática usada no contexto ritual do tabernáculo.
