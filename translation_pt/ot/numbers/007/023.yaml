  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: pt
  text: e, para o sacrifício das ofertas de comunhão[a], dois bovinos, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Natanael, filho de Zuar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “ofertas pacíficas” ou “ofertas de bem-estar”; o termo hebraico שְׁלָמִים designa uma categoria de sacrifícios.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: e, para o sacrifício das ofertas de comunhão
  rationale: A conjunção e a preposição dão continuidade à lista. זֶבַח designa o sacrifício, enquanto שְׁלָמִים é a categoria cultual tradicionalmente associada à paz, comunhão e bem-estar. “Ofertas de comunhão” é natural em português e recebe nota com alternativas legítimas.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bovinos
  rationale: בָּקָר é um termo coletivo para gado bovino e não especifica aqui o sexo. “Dois bovinos” preserva essa generalidade sem sugerir necessariamente bois de trabalho.
- source_word: אֵילִים חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִים designa especificamente carneiros adultos, e não ovelhas em sentido genérico.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתּוּדִים refere-se a caprinos machos; “bodes” é a forma corrente e precisa em português.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: כְּבָשִׂים indica cordeiros machos, e בְּנֵי שָׁנָה especifica a idade de um ano. Em português, “cordeiros” normalmente basta para comunicar o referente masculino no contexto sacrificial.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: A fórmula identifica retrospectivamente a oferta já enumerada. O pretérito é natural no contexto narrativo, e קָרְבָּן corresponde a “oferta” no contexto cultual.
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: Natanael, filho de Zuar
  rationale: Os nomes são transliterados em formas bíblicas reconhecíveis em português; a vírgula torna natural a expressão patronímica.
theological_decisions:
- issue: Sentido do termo sacrificial שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo admite nuances de paz, comunhão e bem-estar. A tradução principal usa uma designação cultual clara e inteligível, enquanto a nota preserva as alternativas sem impor uma interpretação teológica exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração mantém a concisão formular do hebraico, e os termos referentes aos animais evitam especificações não presentes no texto-fonte.
