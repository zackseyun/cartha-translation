  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: A oferta dele foi um prato de prata[a], que pesava cento e trinta siclos, e uma bacia de prata[b], que pesava setenta siclos, segundo o siclo do santuário[c]; ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa”, para קַעֲרָה.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela”, para מִזְרָק, um recipiente usado no serviço do santuário.
    reason: lexical_alternative
  - marker: c
    text: “Segundo o siclo do santuário” significa conforme o padrão de peso do santuário.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: A oferta dele foi
  rationale: קָרְבָּן designa uma oferta apresentada no contexto do culto. A formulação mantém o possessivo explícito e introduz naturalmente a lista nominal em português.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קַעֲרָה indica um recipiente relativamente raso; “prato” é claro e conciso, enquanto “travessa” permanece uma alternativa possível.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: Expressa de modo natural o hebraico “seu peso [era] cento e trinta”, sem perder a informação explícita do peso.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente empregado no serviço sacrificial; “bacia” comunica melhor esse caráter do que um termo estritamente doméstico.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: Repete em português a relação de peso subentendida na segunda especificação, evitando a construção pouco natural “de setenta siclos”.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão indica que os pesos seguem o padrão oficial ligado ao santuário. A tradução preserva a fórmula cultual e a esclarece em nota.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambos estavam cheios
  rationale: Mantém a referência explícita aos dois recipientes e a construção predicativa do hebraico.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente corrente para a farinha refinada usada nas ofertas.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha combinada com óleo; “azeite” é natural em contexto bíblico e alimentar mediterrânico.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente a oferta não animal preparada com cereal, e não apenas uma oferta genérica.
