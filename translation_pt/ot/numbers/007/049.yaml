  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: Sua oferta foi um prato de prata[a], pesando cento e trinta siclos, e uma bacia de prata, pesando setenta siclos, segundo o siclo do santuário; ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa”; o termo traduzido por “bacia” também pode ser traduzido por “tigela”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sua oferta foi
  rationale: No contexto cultual, קָרְבָּן designa aquilo que é apresentado como oferta; a formulação também introduz naturalmente a lista em português.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קַעֲרָה designa um recipiente, provavelmente largo e relativamente raso; “prato” é claro e adequado ao inventário.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: pesando cento e trinta siclos
  rationale: Explicita de modo natural em português que o número indica o peso do recipiente.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente empregado no serviço sacrificial; “bacia” preserva essa distinção em relação ao primeiro utensílio.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: pesando setenta siclos
  rationale: A repetição de “pesando” torna inequívoco que se trata do peso da bacia.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão indica o padrão oficial de peso ligado ao santuário.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambos estavam cheios
  rationale: Retoma claramente os dois recipientes e preserva a construção predicativa hebraica.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É a designação corrente da farinha refinada usada nas ofertas.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Expressa com naturalidade a preparação da farinha; “azeite” é apropriado para o óleo de oliva do contexto bíblico.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: Neste contexto sacerdotal, מִנְחָה é a oferta feita de produtos agrícolas, aqui especificamente farinha e azeite; “oferta de cereal” preserva sua especificidade cultual.
