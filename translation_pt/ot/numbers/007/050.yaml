lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: Neste inventário cultual, designa um pequeno recipiente cerimonial. “Vasilha” preserva a amplitude do termo sem sugerir necessariamente um talher.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal feminino, em concordância com כַּף.
- source_word: עֲשָׂרָה
  choice: pesando dez siclos
  rationale: O numeral expressa elipticamente o peso segundo a fórmula repetida no contexto; “siclos” é suprido para tornar explícita em português a unidade entendida.
- source_word: זָהָב
  choice: de ouro
  rationale: Indica o material de que era feito o recipiente.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Adjetivo predicativo feminino que descreve o conteúdo da vasilha.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Termo usual para a substância aromática queimada no culto.
