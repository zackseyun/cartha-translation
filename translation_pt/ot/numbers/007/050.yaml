  text: uma vasilha de ouro[a], pesando dez siclos, cheia de incenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma pequena bandeja de ouro”, “uma tigela de ouro” ou “uma colher de ouro”. O termo hebraico designa de modo mais amplo um pequeno recipiente cerimonial.
