base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: pt
  text: e, para o sacrifício de comunhão[a], dois bovinos[b], cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Paguiel, filho de Ocrã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrifício de paz” ou “sacrifício de bem-estar”; o termo hebraico designa uma categoria de sacrifícios tradicionalmente chamada de “ofertas pacíficas”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “dois [animais do] gado bovino”. Muitas traduções dizem, de modo mais específico, “dois bois”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: e, para o sacrifício de comunhão
  rationale: A conjunção e a preposição introduzem mais um item da lista. “Sacrifício de comunhão” expressa com naturalidade a categoria cultual שְׁלָמִים, tradicionalmente associada à paz, à comunhão e ao bem-estar.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bovinos
  rationale: בָּקָר é um termo coletivo para gado bovino e não especifica o sexo dos animais; “dois bovinos” preserva essa generalidade melhor que “dois bois”.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa especificamente carneiros adultos.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים designa caprinos machos; “bodes” é a forma portuguesa corrente e precisa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: כְּבָשִׂים refere-se a cordeiros, e בְּנֵי שָׁנָה indica a idade de um ano. “Cordeiros” conserva a referência masculina no português natural.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: A fórmula encerra a lista da oferta. O pretérito harmoniza com a narração do acontecimento já realizado.
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: Paguiel, filho de Ocrã
  rationale: Os nomes são transliterados em formas correntes e legíveis em português; בֶּן é traduzido pela fórmula patronímica natural “filho de”.
