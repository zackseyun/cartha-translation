base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: pt
  text: E, para o sacrifício de comunhão[a], duas cabeças de gado, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Aiezer, filho de Amisadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sacrifício pacífico” ou “sacrifício de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: e, para o sacrifício das ofertas de comunhão
  rationale: A expressão introduz o último item da lista. “Ofertas de comunhão” comunica em português atual a dimensão relacional de שְׁלָמִים, enquanto a nota preserva as alternativas tradicionais e semânticas.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bois
  rationale: בָּקָר designa animais bovinos; “dois bois” é a formulação bíblica natural e amplamente compreensível em português, embora o hebraico não explicite aqui o sexo.
- source_word: אֵילִים חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִים refere-se claramente a carneiros no contexto sacrificial.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים designa especificamente caprinos machos; “bodes” é preciso e natural.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: Reproduz de maneira idiomática a idade sacrificial especificada pela expressão hebraica “filhos de um ano”.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: O demonstrativo e o substantivo são vertidos diretamente; o passado se ajusta à narração das ofertas já apresentadas.
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: Aiezer, filho de Amisadai
  rationale: Os nomes recebem transliteração portuguesa legível, e בֶּן é traduzido diretamente como “filho de”.
theological_decisions:
- issue: Sentido do termo sacrificial שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo pode destacar paz, comunhão ou bem-estar integral. A tradução principal adota uma expressão corrente e significativa sem eliminar as demais possibilidades, registradas em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da enumeração hebraica. Mantém terminologia sacrificial compreensível e nomes em formas portuguesas usuais.
