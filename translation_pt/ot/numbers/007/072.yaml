  text: בְּ/יוֹם֙ עַשְׁתֵּ֣י עָשָׂ֣ר י֔וֹם נָשִׂ֖יא לִ/בְנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/072.yaml
  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: pt
  text: No décimo primeiro dia, o líder dos filhos de Aser foi Pagiel, filho de Ocrã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: No décimo primeiro dia
  rationale: A fórmula hebraica repete literalmente “dia”, mas o português natural expressa a indicação temporal sem essa repetição.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: décimo primeiro
  rationale: Neste contexto sequencial, a expressão numeral tem função ordinal e designa o décimo primeiro dia.
- source_word: נָשִׂיא
  choice: líder
  rationale: O termo designa o chefe reconhecido da tribo; “líder” é claro e evita as conotações monárquicas de “príncipe”.
- source_word: לִ/בְנֵי אָשֵׁר
  choice: dos filhos de Aser
  rationale: Preserva a expressão hebraica de parentesco e identifica a comunidade tribal representada pelo líder.
- source_word: פַּגְעִיאֵל
  choice: Pagiel
  rationale: Forma tradicional e amplamente reconhecível do nome próprio em português bíblico.
- source_word: בֶּן עָכְרָן
  choice: filho de Ocrã
  rationale: Traduz diretamente o patronímico hebraico e emprega a forma portuguesa consagrada do nome.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e manutenção da expressão tribal “filhos de Aser”. Não foi incluída nota, pois a informação proposta na camada inglesa corresponde a נָשִׂיא, mas seu marcador aparece ligado à expressão temporal; além disso, o sentido tribal já é suficientemente claro no texto.
