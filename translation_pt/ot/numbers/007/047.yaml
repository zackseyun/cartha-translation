base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: pt
  text: e, para o sacrifício das ofertas de comunhão[a], duas cabeças de gado, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Eliasafe, filho de Deuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “ofertas pacíficas” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: e, para o sacrifício das ofertas de comunhão
  rationale: A conjunção e a preposição introduzem mais um item do inventário. “Ofertas de comunhão” comunica de modo natural o sentido relacional de שְׁלָמִים, enquanto a nota preserva alternativas tradicionais e semânticas.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bois
  rationale: בָּקָר é um termo coletivo para gado bovino. No contexto de uma lista sacrificial, “dois bois” é claro e idiomático em português, sem acrescentar uma especificação além do uso corrente do termo.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa especificamente carneiros adultos; a tradução direta preserva a distinção animal.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים refere-se a caprinos machos; “bodes” é a forma portuguesa corrente e precisa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: A expressão hebraica, literalmente “cordeiros filhos de um ano”, indica a idade. “Cordeiros de um ano” é natural e preserva esse requisito.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: O demonstrativo resume o conjunto recém-enumerado. O passado soa natural no relato português, e “oferta” corresponde ao sentido cultual de קָרְבָּן.
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: Eliasafe, filho de Deuel
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis, e o patronímico é traduzido diretamente.
theological_decisions:
- issue: Sentido sacrificial de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; ofertas de bem-estar
  rationale: O termo pode realçar paz, integridade, bem-estar ou comunhão ligada à refeição sacrificial. A tradução principal adota uma expressão clara e difundida, sem excluir as demais nuances, registradas em nota.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura de inventário preservada. A pontuação favorece a leitura em voz alta, e a terminologia sacrificial evita linguagem excessivamente técnica.
