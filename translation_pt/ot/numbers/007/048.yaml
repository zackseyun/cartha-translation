  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: pt
  text: No sétimo dia, o líder dos filhos de Efraim[a] foi Elisama, filho de Amiúde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o líder para os filhos de Efraim”. A preposição hebraica pode indicar relação ou representação.'
