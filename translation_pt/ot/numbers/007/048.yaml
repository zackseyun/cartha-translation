lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: No sétimo dia
  rationale: A preposição בְּ com יוֹם e o ordinal forma uma expressão temporal; esta é a formulação mais natural e precisa em português.
- source_word: נָשִׂיא
  choice: líder
  rationale: Neste contexto, designa o chefe tribal que apresenta a oferta. “Líder” é atual e comunica a função representativa sem as conotações monárquicas de “príncipe”.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: dos filhos de Efraim
  rationale: O לְ marca relação ou representação com נָשִׂיא. A tradução preserva a expressão genealógica hebraica, enquanto a nota registra a alternativa “para os filhos de Efraim”.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶּן עַמִּיהוּד
  choice: filho de Amiúde
  rationale: Equivalente natural da construção patronímica hebraica; “Amiúde” segue a forma tradicional portuguesa do nome.
