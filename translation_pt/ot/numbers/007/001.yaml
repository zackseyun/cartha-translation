base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: pt
  text: Aconteceu que, no dia em que Moisés terminou de levantar o tabernáculo[a], ele o ungiu e o consagrou, junto com todos os seus utensílios, o altar e todos os seus utensílios; ungiu-os e consagrou-os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando Moisés terminou de levantar o tabernáculo». A expressão temporal hebraica também pode ser entendida de modo idiomático com esse sentido.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Introduz um novo episódio na narrativa e preserva a função discursiva do hebraico sem recorrer à fórmula arcaica «e sucedeu».
- source_word: בְּיוֹם כַּלּוֹת
  choice: no dia em que ... terminou
  rationale: Mantém a expressão temporal hebraica de modo natural em português, sem eliminar sua possível extensão idiomática para «quando ... terminou».
- source_word: לְהָקִים
  choice: levantar
  rationale: No hifil, em referência ao tabernáculo, o verbo descreve sua montagem ou ereção. «Levantar» é claro e corrente neste contexto.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo tradicional, reconhecível e preciso para o santuário móvel de Israel no deserto.
- source_word: וַיִּמְשַׁח
  choice: ungiu
  rationale: Preserva o sentido ritual de aplicar óleo para dedicar algo ao serviço sagrado.
- source_word: וַיְקַדֵּשׁ
  choice: consagrou
  rationale: Expressa que os objetos foram separados para uso santo, sem sugerir transformação moral.
- source_word: כָּל כֵּלָיו
  choice: todos os seus utensílios
  rationale: כְּלִים designa os diversos objetos e instrumentos destinados ao serviço do tabernáculo e do altar. «Utensílios» funciona naturalmente nos dois contextos.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente português padrão e preciso de מִזְבֵּחַ.
- source_word: וַיִּמְשָׁחֵם וַיְקַדֵּשׁ אֹתָם
  choice: também ungiu e consagrou o altar e todos os seus utensílios
  rationale: A formulação explicita em português os referentes plurais imediatos, evitando um pronome potencialmente ambíguo, e conserva a repetição ritual dos dois verbos.
theological_decisions:
- issue: Terminologia de santidade cultual
  choice: consagrou
  alternative: santificou; tornou santo
  rationale: O contexto trata da dedicação ritual de objetos do santuário, não de transformação moral. «Consagrou» comunica com clareza que foram separados para uso sagrado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva a abertura narrativa hebraica, enquanto a ordem das orações e a retomada dos referentes foram ajustadas para clareza natural.
