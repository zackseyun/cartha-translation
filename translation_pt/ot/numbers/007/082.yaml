- source_word: אֶחָד
  choice: um
  rationale: Mantém explicitamente o numeral e o estilo enumerativo repetitivo de Números 7; em português, “um bode” expressa tanto a quantidade quanto a indefinição.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, não apenas o pecado em sentido abstrato. “Para oferta pelo pecado” preserva a função da preposição לְ e usa terminologia cultual clara.
