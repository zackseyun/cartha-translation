base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: pt
  text: 'e, para o sacrifício de comunhão[a]: duas cabeças de gado, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Abidã, filho de Gideoni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “sacrifício de paz” ou “sacrifício de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: e, para o sacrifício de comunhão
  rationale: A conjunção e a preposição ligam o item à lista anterior. זֶבַח הַשְּׁלָמִים é uma expressão sacrificial técnica; “sacrifício de comunhão” é claro em português e preserva a dimensão relacional do termo sem excluir as alternativas “de paz” e “de bem-estar”.
- source_word: בָּקָר שְׁנַיִם
  choice: duas cabeças de gado
  rationale: בָּקָר é um coletivo para gado bovino e não especifica o sexo neste contexto. “Duas cabeças de gado” expressa naturalmente a contagem em português sem introduzir a ideia específica de bois de trabalho.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa especificamente carneiros adultos; “carneiros” é o equivalente sacrificial preciso e corrente.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים refere-se a caprinos machos. “Bodes” preserva de modo conciso e natural a distinção de sexo.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: כְּבָשִׂים indica cordeiros, e בְּנֵי שָׁנָה é a fórmula idiomática para animais de um ano de idade.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: A fórmula demonstrativa conclui a lista. O passado é natural na narração portuguesa, embora o hebraico não contenha verbo explícito; “oferta” traduz adequadamente קָרְבַּן neste contexto.
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: Abidã, filho de Gideoni
  rationale: Os nomes são transliterados em forma legível em português, e a relação patronímica é expressa naturalmente por “filho de”.
