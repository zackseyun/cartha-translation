base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: pt
  text: 'e, para o sacrifício de ofertas de paz: dois bovinos, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Naassom, filho de Aminadabe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: e, para o sacrifício de ofertas de paz
  rationale: A conjunção e a preposição introduzem outro elemento da lista. “Ofertas de paz” conserva a designação sacrificial tradicional de שְׁלָמִים sem excluir as ideias associadas de comunhão e bem-estar.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bovinos
  rationale: בָּקָר é um coletivo referente ao gado; “bovinos” preserva a espécie sem especificar indevidamente sexo ou função.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa claramente carneiros adultos machos.
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתּוּדִים refere-se a caprinos machos; “bodes” é a forma portuguesa direta e natural.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: A expressão indica cordeiros com um ano de idade. O texto não traz aqui uma marca gramatical adicional que exija explicitar “machos” em português.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: A oração nominal hebraica resume a lista; o passado soa natural no contexto narrativo, e “oferta” preserva o sentido cultual de קָרְבָּן.
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: Naassom, filho de Aminadabe
  rationale: Empregam-se formas portuguesas tradicionais e reconhecíveis dos nomes, com a relação patronímica expressa naturalmente.
theological_decisions:
- issue: Sentido de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: “Ofertas de paz” mantém a terminologia cultual tradicional, mas o termo hebraico também pode evocar comunhão e bem-estar; não se deve reduzir seu campo semântico a uma única teoria sacrificial.
translation_notes:
  register: Português moderno, digno e acessível, com enumeração clara. “Bovinos” evita atribuir sexo não explicitado pelo substantivo coletivo; “cordeiros de um ano” reproduz de modo natural a idade indicada no hebraico.
