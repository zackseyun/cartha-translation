  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: pt
  text: No nono dia, o líder dos filhos de Benjamim[a] foi Abidã, filho de Gideoni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder para os filhos de Benjamim”. A preposição hebraica pode expressar relação ou representação nesta frase.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: No nono dia
  rationale: A preposição בְּ com יוֹם forma aqui uma expressão temporal, vertida naturalmente em português por “no ... dia”; הַתְּשִׁיעִי é o ordinal “nono”.
- source_word: נָשִׂיא
  choice: líder
  rationale: Em Números 7, o termo designa o chefe reconhecido de uma tribo. “Líder” comunica a função com clareza atual, sem sugerir necessariamente realeza, como poderia ocorrer com “príncipe”.
- source_word: לִבְנֵי בִנְיָמִן
  choice: dos filhos de Benjamim
  rationale: A preposição לְ indica a relação do líder com o grupo tribal, podendo também realçar sua função representativa. “Filhos de Benjamim” preserva a linguagem familiar masculina do hebraico.
- source_word: אֲבִידָן
  choice: Abidã
  rationale: Forma tradicional e natural em português para o nome hebraico, com a terminação consonantal representada pela nasalização.
- source_word: בֶּן
  choice: filho de
  rationale: Tradução direta e idiomática da construção patronímica hebraica.
- source_word: גִּדְעֹנִי
  choice: Gideoni
  rationale: Transliteração clara do nome próprio hebraico, em conformidade com o uso bíblico corrente em português.
theological_decisions:
- issue: Designação tribal masculina בְנֵי
  choice: filhos de Benjamim
  alternative: povo de Benjamim; benjamitas
  rationale: A expressão hebraica apresenta a tribo como descendência de seu ancestral. Preservar “filhos” mantém essa imagem genealógica sem neutralizá-la, embora no contexto o grupo abranja a tribo representada como um todo.
- issue: Relação expressa pela preposição לְ em לִבְנֵי בִנְיָמִן
  choice: líder dos filhos de Benjamim
  alternative: líder para os filhos de Benjamim
  rationale: 'O contexto favorece a relação de pertencimento ou associação: Abidã é o líder ligado à tribo. Como לְ também pode destacar representação, a alternativa é registrada em nota, sem eliminar a ambiguidade legítima.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A cópula “foi” torna natural em português a frase nominal hebraica. O marcador da nota foi colocado junto à expressão a que se refere.
