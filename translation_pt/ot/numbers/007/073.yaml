base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: Sua oferta foi um prato de prata[a], com cento e trinta siclos de peso, uma bacia de prata de setenta siclos, segundo o siclo do santuário[b]; ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa”. O termo hebraico designa um recipiente raso de prata usado no santuário.
    reason: lexical_alternative
  - marker: b
    text: Isto é, conforme o padrão de peso do santuário.
    reason: clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sua oferta foi
  rationale: קָרְבָּן designa uma oferta apresentada em contexto cultual. “Oferta” é claro e corrente; o verbo “foi” torna natural em português a sequência nominal hebraica.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קְעָרָה refere-se aqui a um recipiente raso do inventário do santuário. “Prato” preserva essa ideia e soa natural em português.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: com cento e trinta siclos de peso
  rationale: Expressa de maneira natural o peso do recipiente, mantendo a concisão do registro de inventário.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente ritual associado ao manejo de líquidos no culto. “Bacia” distingue esse utensílio do prato anterior e conserva seu caráter cultual.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: de setenta siclos
  rationale: A expressão indica o peso da bacia; a formulação é concisa e natural no estilo enumerativo do versículo.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A frase especifica o padrão oficial de peso empregado. “Segundo” comunica essa função sem transformar o siclo em moeda.
- source_word: שְׁנֵיהֶם
  choice: ambos
  rationale: O termo retoma explicitamente os dois recipientes e preserva a ênfase do hebraico.
- source_word: מְלֵאִים
  choice: estavam cheios de
  rationale: Reproduz de forma natural o predicado adjetival hebraico aplicado aos dois recipientes.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo usual para a farinha refinada usada nas ofertas cultuais.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo indica que a farinha havia sido misturada com óleo. “Azeite” é a designação portuguesa natural para o óleo de oliva pressuposto nesse contexto.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente a oferta não animal preparada com farinha; “oferta de cereal” preserva essa distinção cultual.
