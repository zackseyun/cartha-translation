  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: pt
  text: um novilho, um carneiro e um cordeiro de um ano, para holocausto;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: novilho
  rationale: A expressão designa um bovino macho jovem. Em português, “novilho” comunica naturalmente tanto a espécie quanto a idade aproximada, sem reproduzir de modo artificial o hebraísmo literal “filho do gado”.
- source_word: אֶחָד
  choice: um
  rationale: O numeral repetido organiza o inventário. Em português, o artigo numeral em cada item preserva a estrutura enumerativa do hebraico.
- source_word: אַיִל
  choice: carneiro
  rationale: É o equivalente português comum e preciso para o macho adulto da ovelha, especialmente em listas sacrificiais.
- source_word: כֶּבֶשׂ
  choice: cordeiro
  rationale: O substantivo masculino hebraico designa um cordeiro; a forma portuguesa já é masculina e torna desnecessário acrescentar “macho”.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: Tradução idiomática e clara da expressão hebraica de idade, entendida como animal de um ano ou dentro do primeiro ano.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: “Holocausto” é o termo bíblico português estabelecido para a oferta inteiramente queimada; “para” representa naturalmente o prefixo לְ nesta lista.
theological_decisions: []
translation_notes:
  register: Português moderno, conciso e digno, com a cadência de uma lista ritual. “Novilho” evita um hebraísmo opaco e é mais natural do que “touro procedente do rebanho”. Não se acrescentaram notas porque as alternativas lexicais não afetam de modo relevante a compreensão do versículo.
