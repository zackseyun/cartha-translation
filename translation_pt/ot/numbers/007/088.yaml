  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: pt
  text: E o total dos bovinos para o sacrifício de ofertas de paz[a] foi de vinte e quatro touros, sessenta carneiros, sessenta bodes e sessenta cordeiros de um ano. Esta foi a dedicação do altar, depois que o altar foi ungido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de comunhão” ou “ofertas de bem-estar”.
    reason: Alternativas lexicais legítimas para שְׁלָמִים, termo que pode evocar paz, comunhão e bem-estar.
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: E o total dos animais do rebanho bovino
  rationale: O contexto apresenta a soma final dessa categoria. “O total” expressa naturalmente כֹל, enquanto “animais do rebanho bovino” preserva o sentido coletivo de בְּקַר e prepara a especificação dos touros.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: o sacrifício das ofertas de paz
  rationale: Mantém זֶבַח como “sacrifício” e emprega a designação tradicional e compreensível “ofertas de paz” para שְׁלָמִים, sem ocultar alternativas semânticas legítimas.
- source_word: פָּרִים
  choice: touros
  rationale: Designa bovinos machos no contexto sacrificial; o texto não exige acrescentar “jovens”.
- source_word: אֵילִם
  choice: carneiros
  rationale: Equivalente português corrente para os machos adultos das ovelhas usados em sacrifício.
- source_word: עַתֻּדִים
  choice: bodes
  rationale: Expressa de modo claro e conciso os caprinos machos indicados pelo hebraico.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: cordeiros de um ano
  rationale: Preserva tanto a espécie quanto a indicação etária da expressão hebraica em português natural.
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Essa foi a dedicação do altar
  rationale: A frase resume retrospectivamente as ofertas apresentadas. “Dedicação do altar” traduz o hebraico sem inserir explicitamente “oferta”, palavra não presente no sintagma.
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: depois que ele foi ungido
  rationale: Reproduz a relação temporal e deixa o altar como referente do pronome, sem introduzir no texto um agente da unção que o hebraico não explicita.
theological_decisions:
- issue: Sentido da categoria sacrificial שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: “Ofertas de paz” mantém continuidade com a terminologia bíblica tradicional, enquanto a nota registra sentidos alternativos que ressaltam comunhão, integridade ou bem-estar, sem decidir além do que o termo hebraico permite.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A enumeração foi mantida clara e solene; evitou-se linguagem arcaica e também explicitação teológica não exigida pelo hebraico.
