  source_fidelity: O sentido e todos os números correspondem ao hebraico. A tradução mantém adequadamente a categoria sacrificial זֶבַח הַשְּׁלָמִים e a relação temporal final. A explicitação de «o altar» no fim apenas torna claro o antecedente de אֹתוֹ, já determinado pelo contexto.
