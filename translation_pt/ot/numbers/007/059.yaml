  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: pt
  text: 'E, para o sacrifício das ofertas de paz[a]: dois bovinos[b], cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Gamliel, filho de Pedazur.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “ofertas de comunhão” ou “ofertas de bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “dois bois”; o termo hebraico é mais amplo e designa gado bovino.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Essa é a oferta de”; a forma no passado acompanha a sequência narrativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: E, como sacrifício de ofertas de paz
  rationale: A formulação preserva a continuação da lista marcada por וּ, o sentido sacrificial de זֶבַח e a designação tradicional de שְׁלָמִים, sem excluir em nota as nuances de comunhão e bem-estar.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bovinos
  rationale: בָּקָר é um termo coletivo amplo para gado bovino; “bovinos” evita especificar bois de trabalho ou sexo não indicado pelo substantivo.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa diretamente carneiros adultos.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים refere-se especificamente a caprinos machos; “bodes” é a forma portuguesa corrente e precisa.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: A expressão hebraica especifica cordeiros com um ano de idade; a redação é natural e preserva a exigência etária.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: קָרְבַּן é uma oferta apresentada a Deus. O hebraico não contém cópula expressa; o passado português se ajusta à recapitulação narrativa, enquanto a forma mais literal é registrada em nota.
- source_word: גַּמְלִיאֵל
  choice: Gamliel
  rationale: A transliteração acompanha de perto a forma hebraica do nome, sem passar pela forma tradicional greco-latina Gamaliel.
- source_word: בֶּן פְּדָה־צוּר
  choice: filho de Pedazur
  rationale: בֶּן recebe sua equivalência filial normal, e פְּדָה־צוּר é transliterado de modo legível em português como Pedazur.
