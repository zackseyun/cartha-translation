  language: pt
  text: uma vasilha de ouro[a], pesando dez siclos de ouro, cheia de incenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “uma vasilha de ouro, dez de ouro, cheia de incenso”; a unidade de peso “siclos” está implícita na fórmula de oferta repetida em Números 7.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: No contexto das ofertas do santuário, designa um pequeno recipiente cerimonial para conter incenso. “Vasilha” evita a impressão moderna de um talher, que “colher” poderia causar, sem definir além do necessário o formato do objeto.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal feminino, em concordância com כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: de ouro, pesando dez siclos
  rationale: 'A expressão hebraica é elíptica: traz literalmente “dez” sem explicitar a unidade. A fórmula repetida em Números 7 mostra que se trata do peso da vasilha; por isso, “siclos” e “pesando” são supridos para clareza.'
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Reproduz de modo natural e conciso o adjetivo predicativo que descreve o conteúdo da vasilha.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Termo português corrente para a substância aromática oferecida no culto.
