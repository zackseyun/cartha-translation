  text: one gold dish weighing ten shekels[a], full of incense;
translation:
  language: pt
  text: uma vasilha de ouro de dez siclos[a], cheia de incenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma vasilha de ouro, dez [siclos], cheia de incenso”. O hebraico deixa implícita a unidade de peso aqui, mas, nesta fórmula repetida de oferta, o sentido é dez siclos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: No contexto das ofertas do tabernáculo, designa um pequeno recipiente para incenso. “Vasilha” é natural e evita a ideia moderna de um talher sugerida por “colher”.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal feminino, concordando com כַּף.
- source_word: עֲשָׂרָה
  choice: dez siclos
  rationale: O hebraico traz literalmente “dez”, deixando implícita a unidade de peso; a fórmula repetida neste capítulo indica siclos. A unidade é explicitada no texto para clareza, com nota preservando a forma hebraica.
- source_word: זָהָב
  choice: de ouro
  rationale: Indica o material de que era feito o recipiente.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Adjetivo predicativo que descreve o conteúdo da vasilha, vertido de maneira direta e natural.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Termo usual para a substância aromática oferecida no culto.
