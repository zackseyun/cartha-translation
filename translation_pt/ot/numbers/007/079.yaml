  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: Sua oferta foi um prato de prata[a], que pesava cento e trinta siclos, e uma bacia de prata, que pesava setenta siclos, segundo o siclo do santuário[b]; ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma tigela de prata”. O termo hebraico designa um recipiente, mas seu formato exato não é plenamente certo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, conforme o padrão de peso usado no santuário.
    reason: technical_clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sua oferta
  rationale: קָרְבָּן designa aquilo que é apresentado a Deus; “oferta” é claro, natural e adequado ao contexto sacrificial.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קְעָרָה indica um recipiente, provavelmente relativamente raso; “prato” é uma opção corrente, mantendo em nota a incerteza quanto ao formato exato.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: Expressa de modo idiomático a construção nominal hebraica “seu peso [era] cento e trinta”.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente de uso ritual; “bacia” comunica o tipo geral sem impor no texto principal uma função específica.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: Torna explícita, conforme o contexto, a relação entre a medida e o peso da bacia.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Preserva a fórmula técnica referente ao padrão oficial de peso do culto.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambos estavam cheios
  rationale: Mantém a referência explícita aos dois recipientes e reproduz naturalmente o predicado hebraico.
- source_word: סֹלֶת בְּלוּלָה בַשֶּׁמֶן
  choice: farinha fina misturada com azeite
  rationale: “Farinha fina” é a designação sacrificial usual de סֹלֶת, e “misturada com azeite” traduz claramente o particípio passivo.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente a oferta não animal preparada com cereal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi levemente explicitada para evitar que “setenta siclos” pareça indicar capacidade em vez de peso. “Azeite” foi preferido a “óleo” no contexto alimentar e ritual.
