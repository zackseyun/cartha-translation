source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: Sua oferta foi um prato de prata[a] que pesava cento e trinta siclos, uma bacia de prata[b] que pesava setenta siclos, segundo o siclo do santuário[c]; ambos estavam cheios de farinha fina misturada com azeite para uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa”; o termo hebraico designa um recipiente raso de prata.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela”; trata-se de um recipiente usado no serviço do santuário.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “pelo siclo do santuário”, isto é, conforme o padrão de peso do santuário.'
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sua oferta foi
  rationale: קָרְבָּן designa aquilo que é apresentado em contexto de culto. “Oferta” é claro e corrente; “foi” supre naturalmente a cópula ausente na fórmula nominal hebraica.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קַעֲרָה indica aqui um recipiente raso. “Prato” preserva essa forma básica e se ajusta ao inventário ritual; “travessa” também seria possível.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: 'Expressa de modo natural em português a construção hebraica “seu peso: cento e trinta”, sem alterar a unidade de peso antiga.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente empregado no serviço sacrificial. “Bacia” comunica melhor seu caráter ritual e sua distinção do recipiente anterior.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: O peso se aplica à bacia. A oração relativa evita a possível leitura de que ela continha setenta siclos.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão especifica o padrão oficial pelo qual os pesos eram calculados. A formulação mantém a imagem histórica e esclarece a relação de medida.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambos estavam cheios
  rationale: “Ambos” retoma explicitamente os dois recipientes, enquanto a cópula é suprida conforme exige o português.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo técnico habitual para farinha de alta qualidade usada nas ofertas.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha combinada com óleo. Em contexto alimentar e ritual, “azeite” é a expressão portuguesa natural.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente uma oferta composta de produto cerealífero, não uma oferta genérica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os termos históricos “siclo” e “santuário”; as duas classes de recipiente são diferenciadas como “prato” e “bacia”. Os marcadores foram posicionados imediatamente após os termos que explicam.
