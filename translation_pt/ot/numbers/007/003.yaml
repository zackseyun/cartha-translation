  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: pt
  text: 'E trouxeram a sua oferta diante de Yahweh: seis carroças cobertas[a] e doze bois — uma carroça para cada dois líderes e um boi para cada líder — e os apresentaram diante do tabernáculo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “carroças de transporte cobertas”. A expressão hebraica é rara, e tradicionalmente é entendida como referência a veículos de transporte cobertos.
    reason: A função exata de צָב em עֶגְלֹת צָב não é inteiramente segura; a nota preserva a alternativa lexical sem sobrecarregar o texto.
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: sua oferta
  rationale: No contexto cerimonial, קָרְבָּן designa algo trazido e apresentado diante de Deus; “oferta” é natural e preserva o sentido cultual.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי expressa presença ou posição diante de alguém; a formulação é clara e próxima do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: עֶגְלֹת צָב
  choice: carros cobertos
  rationale: עֲגָלוֹת são carros de transporte; o raro צָב é tradicionalmente entendido como indicação de cobertura. A nota conserva a cautela lexical.
- source_word: בָּקָר
  choice: bois
  rationale: Embora possa designar gado em geral, o contexto de tração e o singular שׁוֹר na distribuição favorecem “bois”.
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים
  choice: um carro para cada dois líderes
  rationale: 'Reproduz claramente a relação distributiva: um carro por par de líderes.'
- source_word: הַנְּשִׂאִים
  choice: líderes
  rationale: No contexto tribal de Números, נָשִׂיא designa os chefes ou dirigentes das tribos; “líderes” é atual e evita conotação monárquica.
- source_word: וְשׁוֹר לְאֶחָד
  choice: e um boi para cada líder
  rationale: Explicita o referente implícito de “cada um” em português, sem alterar a distribuição indicada no hebraico.
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: e os apresentaram
  rationale: הקריב pode significar trazer para perto ou apresentar como oferta. “Apresentaram” evita sugerir que os carros e bois foram necessariamente sacrificados.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן é a habitação sagrada portátil; “tabernáculo” é o termo bíblico preciso e reconhecível.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os travessões organizam a explicação distributiva sem romper o fluxo do versículo. “Carros” é entendido como veículos de carga no contexto antigo, e a nota esclarece a expressão hebraica rara.
