  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A tradução explicita o referente provável de הַקֹּדֶשׁ sem acrescentar uma nota, pois a redação já preserva adequadamente o sentido contextual.
