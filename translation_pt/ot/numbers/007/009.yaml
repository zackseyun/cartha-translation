  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: pt
  text: Mas aos filhos de Coate ele não deu nada, porque o serviço das coisas sagradas[a] estava a cargo deles; deviam carregá-las nos ombros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o serviço do santuário» ou «o serviço sagrado». O contexto provavelmente se refere aos objetos sagrados confiados aos coatitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: Mas aos filhos de Coate
  rationale: A preposição לְ marca o objeto indireto. “Filhos de Coate” preserva a designação do clã, e “Mas” expressa o contraste contextual com as dádivas feitas aos outros grupos levíticos.
- source_word: לֹא נָתָן
  choice: ele não deu nada
  rationale: O objeto está implícito e remete aos carros e bois do contexto anterior. A formulação é natural em português sem inserir esses referentes diretamente no versículo.
- source_word: כִּי
  choice: porque
  rationale: Introduz de modo claro a razão pela qual nenhuma dádiva foi feita aos coatitas.
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: o serviço das coisas sagradas
  rationale: Neste contexto, הַקֹּדֶשׁ provavelmente designa os objetos sagrados confiados aos coatitas. A tradução preserva a relação com o transporte desses objetos.
- source_word: עֲלֵיהֶם
  choice: estava a cargo deles
  rationale: Expressa em português natural a incumbência ou responsabilidade contida no hebraico literal “estava sobre eles”.
- source_word: בַּכָּתֵף
  choice: nos ombros
  rationale: O singular hebraico tem valor distributivo/coletivo. O plural é a forma mais idiomática em português para o transporte feito pelos vários coatitas.
- source_word: יִשָּׂאוּ
  choice: deviam carregá-las
  rationale: O imperfeito exprime aqui dever prescrito. O pronome feminino plural retoma naturalmente “coisas sagradas”, explicitando o objeto deixado implícito no hebraico.
theological_decisions: []
