lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão hebraica designa idiomaticamente um caprino macho. Em português, “bode” comunica de modo natural tanto a espécie quanto o sexo do animal.
- source_word: אֶחָד
  choice: um
  rationale: O numeral conta explicitamente o animal na lista de ofertas; “um” preserva essa contagem e soa natural em português.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, e não apenas o pecado em sentido abstrato. A preposição לְ é adequadamente representada por “para”.
