  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/029.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Eliab son of Helon.'
translation:
  language: pt
  text: e, para o sacrifício de ofertas de comunhão[a], dois bovinos, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Eliabe, filho de Helom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “ofertas de paz” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: e, para o sacrifício de ofertas de comunhão
  rationale: A conjunção e a preposição dão continuidade à lista anterior. “Ofertas de comunhão” comunica de modo natural o termo sacrificial שְׁלָמִים, sem reduzir seu campo semântico apenas à ideia moderna de paz.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bovinos
  rationale: בָּקָר é coletivo e não especifica o sexo dos animais; “bovinos” preserva essa generalidade melhor que “bois”.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa carneiros adultos, isto é, ovinos machos.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים se refere especificamente a caprinos machos.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: A expressão בְּנֵי שָׁנָה indica animais de um ano; “cordeiros” é natural e a forma masculina corresponde ao hebraico.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: קָרְבַּן é uma oferta apresentada a Deus. O passado é natural no resumo narrativo em português, embora a construção hebraica não tenha verbo expresso.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Eliabe, filho de Helom
  rationale: Os nomes seguem formas portuguesas bíblicas reconhecíveis, e o patronímico é traduzido de modo conciso.
theological_decisions:
- issue: Sentido do termo sacrificial שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: O termo pode evocar integridade, bem-estar, paz e participação em uma refeição sacrificial. “Comunhão” funciona bem no contexto, enquanto a nota preserva alternativas legítimas sem impor uma interpretação teológica exclusiva.
translation_notes:
  register: Português moderno, digno e acessível, com ordem natural de inventário. “Bovinos” evita especificar um sexo que o hebraico não indica; a terminologia sacrificial é esclarecida por nota.
