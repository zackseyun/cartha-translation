lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho
  rationale: A expressão designa um bovino macho jovem. Em português, “novilho” comunica de modo natural e conciso tanto a espécie quanto a condição do animal, sem reproduzir literalmente o idiomatismo hebraico “filho do gado”. O numeral é preservado.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל é o termo comum para um ovino macho adulto; “carneiro” é o equivalente sacrificial preciso e corrente. O numeral é preservado.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: um cordeiro de um ano
  rationale: כֶּבֶשׂ indica aqui um cordeiro, e o masculino gramatical e o contexto sacrificial sustentam “cordeiro”. O idiomatismo בֶּן שְׁנָתוֹ é vertido naturalmente como “de um ano”. O numeral é preservado.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה designa a oferta inteiramente queimada; “holocausto” é o termo bíblico português consagrado, e “para” representa adequadamente o prefixo לְ na fórmula da lista.
