  text: um novilho, um carneiro e um cordeiro macho de um ano, para holocausto;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן בָּקָר
  choice: novilho
  rationale: A expressão designa um bovino macho jovem. Em português bíblico atual, “novilho” comunica de modo natural tanto a espécie quanto a categoria do animal, sem reproduzir literalmente o idiomatismo hebraico “filho do gado”.
- source_word: אֶחָד
  choice: um
  rationale: O numeral repetido organiza a relação das ofertas e preserva a contagem explícita do hebraico.
- source_word: אַיִל
  choice: carneiro
  rationale: É o termo português comum para o ovino macho adulto empregado em contextos sacrificiais.
- source_word: כֶּבֶשׂ
  choice: cordeiro macho
  rationale: O substantivo hebraico designa especificamente um cordeiro do sexo masculino; a tradução mantém essa distinção.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: O idiomatismo hebraico indica a idade prescrita do animal. “De um ano” é claro, natural e adequado ao estilo de inventário.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה designa a oferta inteiramente queimada. “Holocausto” é o termo sacrificial tradicional e ainda amplamente reconhecível em português bíblico.
theological_decisions: []
translation_notes:
  register: Tradução concisa e digna, adequada à estrutura enumerativa do capítulo. A coordenação com “e” antes do último animal soa natural em português, enquanto a repetição de “um” conserva o padrão de contagem do hebraico.
