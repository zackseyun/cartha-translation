  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: pt
  text: Quando Moisés entrava na tenda do encontro para falar com ele, ouvia a voz que lhe falava de cima da tampa da expiação[a], que ficava sobre a arca do testemunho, do meio dos dois querubins; e lhe falava.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “tampa da expiação” era a cobertura da arca, de onde o SENHOR falava entre os querubins. Tradicionalmente, também é chamada de “propiciatório”.
    reason: Nota cultural e alternativa lexical para o objeto cultual כַּפֹּרֶת.
  - marker: b
    text: O hebraico não declara o sujeito da última frase. Ela também pode ser traduzida por “e a voz lhe falava” ou, explicitando o sentido contextual, “e o SENHOR lhe falava”.
    reason: Preserva a ambiguidade sintática e teológica da cláusula final.
lexical_decisions:
- source_word: וּבְבֹא
  choice: Quando Moisés entrava
  rationale: A preposição בְּ com o infinitivo construto de בוא introduz uma oração temporal. O imperfeito em português comunica naturalmente o caráter recorrente ou habitual sugerido pelo contexto, sem excluir que a frase descreva o que acontecia quando Moisés entrava.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Expressão clara e corrente para o santuário onde Deus se encontrava com Moisés, preservando o sentido funcional do nome hebraico.
- source_word: לְדַבֵּר אִתּוֹ
  choice: para falar com ele
  rationale: Mantém o pronome hebraico e a nuance relacional da preposição אֵת, sem substituir o referente por um nome explícito.
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: ouvia a voz
  rationale: קוֹל pode ser som ou voz, mas o particípio seguinte e o contexto de revelação favorecem claramente 'voz'.
- source_word: מִדַּבֵּר
  choice: falando
  rationale: Reproduz de modo natural a construção participial 'a voz falando'. A possível nuance passiva ou reflexiva é registrada indiretamente na nota sobre a sintaxe da cláusula final.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: de cima da tampa da expiação
  rationale: כַּפֹּרֶת designa a tampa cultual da arca associada à expiação. A formulação evita o termo técnico pouco transparente 'propiciatório', enquanto uma nota preserva a identificação histórica e cultual.
- source_word: אֲרֹן הָעֵדֻת
  choice: arca do testemunho
  rationale: Preserva a designação hebraica tradicional e seu sentido jurídico-aliançal, ligado às tábuas do testemunho.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: entre os dois querubins
  rationale: Usa a forma portuguesa estabelecida para as criaturas representadas sobre a tampa da arca; a origem da voz já foi marcada por 'de cima', de modo que 'entre' expressa naturalmente a localização.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: e falava com ele
  rationale: O sujeito não expresso permanece não explicitado em português. Pelo contexto, pode ser retomada 'a voz' ou entendido o próprio Deus como falante; omitir o pronome evita resolver além do hebraico.
theological_decisions:
- issue: Referente do sujeito não expresso na cláusula final
  choice: Manter o sujeito implícito em 'e falava com ele'
  alternative: Explicitar 'e o SENHOR falava com ele' ou 'e ela falava com ele', tendo 'a voz' como sujeito
  rationale: O contexto identifica a fala como divina, mas o hebraico não nomeia explicitamente o sujeito do verbo final. A construção portuguesa com sujeito oculto conserva essa tensão sem tornar a frase ininteligível.
- issue: Referente de 'ele' em 'para falar com ele'
  choice: Conservar o pronome sem substituir por 'o SENHOR'
  alternative: Traduzir 'para falar com o SENHOR'
  rationale: O contexto aponta para Deus como referente, porém o texto hebraico usa apenas o pronome. A tradução preserva essa forma e evita expansão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega minúsculas nos pronomes referentes a Deus e evita vocabulário técnico sem explicação. O aspecto habitual é expresso pelo imperfeito ('entrava', 'ouvia', 'falava'), adequado ao caráter sumário da declaração no encerramento da seção.
