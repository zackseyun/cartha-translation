    reason: Nota cultural e alternativa lexical para o objeto cultual כַּפֹּרֶת.
  - marker: b
    text: O hebraico não declara o sujeito da última frase. Ela também pode ser traduzida por “e a voz lhe falava” ou, explicitando o sentido contextual, “e o SENHOR lhe falava”.
    reason: Preserva a ambiguidade sintática e teológica da cláusula final.
