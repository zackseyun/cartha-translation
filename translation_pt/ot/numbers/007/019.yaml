source:
  edition: WLC
  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: pt
  text: 'Apresentou a sua oferta: uma bandeja de prata[a], que pesava cento e trinta siclos; uma bacia de prata[b], de setenta siclos, segundo o siclo do santuário[c]; ambas cheias de farinha fina misturada com azeite, para uma oferta de cereal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa de prata”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela”.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “segundo o siclo do santuário”, isto é, conforme o padrão de peso usado no santuário.'
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב
  choice: Apresentou
  rationale: O hifil de קרב, neste contexto cerimonial, indica trazer para perto ou apresentar uma oferta; “apresentou” mantém o tom solene e evita repetição com “oferta”.
- source_word: קָרְבָּנוֹ
  choice: a sua oferta
  rationale: É o termo sacrificial comum para aquilo que se apresenta; “oferta” é claro e natural em português.
- source_word: קַעֲרַת כֶּסֶף
  choice: uma bandeja de prata
  rationale: Designa um recipiente relativamente raso; “bandeja” é natural no contexto de um inventário de utensílios, embora “travessa” também seja possível.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: Expressa de modo natural em português o peso atribuído pelo sufixo feminino à bandeja, preservando a precisão do catálogo.
- source_word: מִזְרָק
  choice: uma bacia de prata
  rationale: Refere-se a um recipiente empregado em contextos rituais; “bacia” conserva esse sentido amplo, com “tigela” como alternativa possível.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Indica que o peso foi calculado conforme o padrão oficial usado no santuário; esta formulação é fiel e compreensível.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambas cheias
  rationale: Refere-se conjuntamente às duas peças, ambas de gênero feminino em português.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É a designação habitual da farinha refinada usada nas ofertas.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: Traduz diretamente a preparação da farinha; “azeite” é a forma natural de indicar óleo de oliva neste contexto bíblico.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente uma oferta preparada com produtos do campo, não uma oferta genérica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura em forma de inventário foi preservada, mas a sintaxe foi tornada natural em português. “Siclo” foi mantido como unidade antiga, e a nota esclarece que o siclo do santuário funcionava como padrão de peso.
