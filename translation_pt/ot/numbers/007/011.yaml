  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Um líder por dia, um líder por dia[a], apresentará a sua oferta para a dedicação do altar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um chefe de tribo por dia”. O hebraico repete “um líder, um dia” para enfatizar a sequência ordenada das ofertas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então ... disse” expressa com naturalidade a sequência narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo tetragrama, sem substituí-lo por um título.
- source_word: נָשִׂיא
  choice: líder
  rationale: No contexto, designa o chefe de uma tribo de Israel; “líder” é claro e evita as conotações monárquicas de “príncipe”.
- source_word: אֶחָד לַיּוֹם
  choice: um ... por dia
  rationale: Comunica o valor distributivo da expressão e preserva sua repetição enfática.
- source_word: יַקְרִיבוּ
  choice: apresentará
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer. O singular distributivo em português concorda naturalmente com “um líder por dia”, embora o hebraico use o plural.
- source_word: קָרְבָּנָם
  choice: a sua oferta
  rationale: O substantivo indica aquilo que é trazido diante de Deus; “oferta” é a formulação cultual corrente e clara.
- source_word: לַחֲנֻכַּת
  choice: para a dedicação
  rationale: Expressa a finalidade ou ocasião dedicatória do altar sem confundi-la necessariamente com consagração ritual.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente português padrão para o altar sacrificial.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição deliberada do hebraico foi mantida, enquanto o verbo foi vertido no singular distributivo para soar natural em português.
