base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: A oferta dele foi um prato de prata[a], que pesava cento e trinta siclos, e uma bacia de prata[b], que pesava setenta siclos, segundo o siclo do santuário[c]; ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa”; o termo hebraico indica um recipiente ritual aberto.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela”; trata-se de um recipiente associado ao uso sacrificial.
    reason: lexical_alternative
  - marker: c
    text: Isto é, conforme o padrão de peso oficial do santuário.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: A oferta dele foi
  rationale: קָרְבָּן designa algo apresentado como oferta, especialmente em contexto ritual; a formulação introduz naturalmente a lista em português.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: uma bandeja de prata
  rationale: קְעָרָה indica um recipiente aberto, semelhante a prato ou travessa; “bandeja” distingue-o da bacia mencionada em seguida e é claro em português.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: Expressa de forma idiomática a construção nominal hebraica “seu peso [era] cento e trinta”, sem perder a informação.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente ligado ao uso sacrificial; “bacia” comunica melhor essa função do que um termo de uso predominantemente doméstico.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: O hebraico fornece o peso do segundo recipiente; a repetição verbal elimina possível ambiguidade em português.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão indica o padrão oficial de peso usado no santuário; “segundo” reproduz a relação normativa da preposição hebraica.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambas estavam cheias
  rationale: O pronome refere-se explicitamente às duas peças, ambas femininas em português; o predicado é vertido de modo natural.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo habitual para farinha refinada usada nas ofertas, preservando a qualidade indicada pelo hebraico.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha combinada com óleo; “azeite” é o equivalente natural no contexto bíblico mediterrânico.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente uma oferta composta de produtos agrícolas, aqui farinha e azeite; “oferta de cereal” evita confundi-la com ofertas animais.
