  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da lista hebraica foi preservada; a repetição de “doze” mantém o caráter solene e inventarial do verso. As notas registram tanto a possibilidade de uma formulação nominal mais formal quanto a incerteza lexical dos utensílios.
