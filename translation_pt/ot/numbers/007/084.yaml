  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: pt
  text: 'Esta foi a oferta de dedicação do altar, no dia em que ele foi ungido,[a] da parte dos líderes de Israel: doze travessas de prata, doze bacias de prata e doze colheres de ouro.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta é a dedicação do altar, no dia em que ele foi ungido”. O hebraico pode ser traduzido mais formalmente dessa maneira, mas o contexto favorece um resumo retrospectivo das ofertas apresentadas.'
    reason: lexical_alternative
  - marker: b
    text: Os nomes exatos dos utensílios são incertos. Também podem ser traduzidos por “pratos de prata”, “tigelas de prata” e “conchas de ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: Esta foi a oferta de dedicação do altar
  rationale: O demonstrativo introduz um resumo retrospectivo, e o contexto mostra que חֲנֻכָּה abrange aqui os objetos oferecidos por ocasião da dedicação. A formulação explicita essa referência contextual sem perder o sentido básico de dedicação.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: no dia em que ele foi ungido
  rationale: Reproduz naturalmente a expressão temporal hebraica e mantém o altar como referente do pronome.
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: da parte dos líderes de Israel
  rationale: מֵאֵת indica a procedência das ofertas, e נְשִׂיאִים designa aqui os líderes tribais reconhecidos, não necessariamente príncipes em sentido monárquico.
- source_word: קַעֲרֹת כֶּסֶף
  choice: travessas de prata
  rationale: קְעָרָה designa um recipiente largo, semelhante a prato ou travessa; 'travessas' diferencia o objeto das bacias mencionadas em seguida.
- source_word: מִזְרְקֵי כֶסֶף
  choice: bacias de prata
  rationale: מִזְרָק é uma bacia ou tigela de uso ritual; 'bacias' é claro e apropriado ao inventário cultual.
- source_word: כַּפּוֹת זָהָב
  choice: recipientes de ouro
  rationale: כַּף pode designar uma colher, concha ou pequeno recipiente. O termo genérico preserva a incerteza sobre a forma exata do utensílio sem sugerir uma panela moderna.
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: doze
  rationale: Equivalente cardinal direto; as diferenças de gênero gramatical no hebraico não precisam ser marcadas em português.
theological_decisions: []
