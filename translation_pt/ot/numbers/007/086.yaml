  text: כַּפּ֨וֹת זָהָ֤ב שְׁתֵּים עֶשְׂרֵה֙ מְלֵאֹ֣ת קְטֹ֔רֶת עֲשָׂרָ֧ה עֲשָׂרָ֛ה הַ/כַּ֖ף בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ כָּל זְהַ֥ב הַ/כַּפּ֖וֹת עֶשְׂרִ֥ים וּ/מֵאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: pt
  text: Doze recipientes de ouro cheios de incenso[a], cada recipiente pesando dez siclos, segundo o siclo do santuário; todo o ouro dos recipientes era cento e vinte siclos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pratos”, “tigelas” ou, tradicionalmente, “colheres”, referindo-se aos recipientes para incenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפּוֹת
  choice: recipientes
  rationale: No contexto das ofertas para o tabernáculo, o termo designa pequenos utensílios destinados ao incenso. “Recipientes” é claro e evita a imagem potencialmente enganosa de colheres modernas.
- source_word: זָהָב
  choice: ouro
  rationale: Designação direta do material de que eram feitos os recipientes.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: doze
  rationale: Número cardinal que indica a quantidade total de recipientes.
- source_word: מְלֵאֹת קְטֹרֶת
  choice: cheios de incenso
  rationale: Reproduz de modo natural a construção adjetival hebraica e deixa claro o conteúdo dos recipientes.
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: cada recipiente pesando dez siclos
  rationale: A repetição distributiva do numeral indica dez siclos para cada recipiente; “pesando” explicita naturalmente a relação determinada pelo padrão de peso.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Preserva a fórmula técnica que remete ao padrão oficial de peso associado ao santuário.
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: todo o ouro dos recipientes
  rationale: Mantém a formulação totalizadora da construção hebraica, referindo-se ao peso agregado do ouro.
- source_word: עֶשְׂרִים וּמֵאָה
  choice: cento e vinte siclos
  rationale: Expressa o total de 120; “siclos” é retomado do padrão de peso mencionado imediatamente antes.
