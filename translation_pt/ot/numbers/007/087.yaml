  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: pt
  text: 'Todos os animais para o holocausto foram: doze touros, doze carneiros e doze cordeiros de um ano, com as respectivas ofertas de cereal; e doze bodes para a oferta pelo pecado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”. O termo hebraico חַטָּאת pode enfatizar a purificação da impureza, além do pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: Todo o gado
  rationale: Preserva o sentido coletivo e introduz o total dos bovinos apresentados, enquanto פָּרִים especifica os animais como touros.
- source_word: לָעֹלָה
  choice: destinado ao holocausto
  rationale: O לְ indica finalidade; “holocausto” é o termo sacrificial tradicional e amplamente reconhecido em português para a oferta totalmente queimada.
- source_word: פָּרִים
  choice: touros
  rationale: Equivalente direto e corrente para os bovinos machos neste contexto sacrificial, sem acrescentar uma indicação de idade ausente do termo.
- source_word: אֵילִם
  choice: carneiros
  rationale: Designação portuguesa comum para os machos ovinos adultos oferecidos em sacrifício.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: cordeiros de um ano
  rationale: Expressa com clareza e naturalidade a idade especificada pelo hebraico.
- source_word: וּמִנְחָתָם
  choice: com as respectivas ofertas de cereal
  rationale: מִנְחָה designa aqui a oferta de cereal que acompanha os animais; “respectivas” comunica naturalmente o sufixo possessivo plural e a associação com os sacrifícios enumerados.
- source_word: וּשְׂעִירֵי עִזִּים
  choice: e doze bodes
  rationale: A expressão hebraica especifica caprinos machos; “bodes” é claro, preciso e corrente em português.
- source_word: לְחַטָּאת
  choice: para a oferta pelo pecado
  rationale: É a designação convencional e mais reconhecível deste sacrifício na legislação sacerdotal, sem eliminar em nota a possível ênfase ritual na purificação.
theological_decisions:
- issue: Tradução de חַטָּאת na legislação sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O termo pode relacionar a oferta tanto ao pecado quanto à remoção ritual de impureza. O texto principal mantém a designação convencional em português, e a nota preserva a alternativa lexical e a tensão sem impor uma interpretação exclusiva.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial reconhecível. A estrutura de inventário do hebraico foi mantida, mas a pontuação e a formulação foram ajustadas para fluidez. O marcador da nota foi colocado junto ao termo a que realmente se refere.
