  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: pt
  text: uma vasilha de ouro, pesando dez siclos[a], cheia de incenso;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “uma vasilha de ouro, dez [de] ouro”; “siclos” está implícito na fórmula das ofertas dos versículos próximos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: Neste contexto de ofertas para o santuário, o termo designa um pequeno recipiente, não a palma da mão. “Vasilha” é claro e natural em português e evita a impressão de um talher comum que “colher” poderia transmitir.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal que concorda com o substantivo feminino כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: pesando dez siclos de ouro
  rationale: Embora “siclos” e o verbo “pesando” estejam elípticos no hebraico, a fórmula de inventário nos versículos próximos indica que o número se refere ao peso do recipiente. A explicitação torna a frase compreensível em português sem esconder a forma literal, registrada em nota.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Reproduz naturalmente o adjetivo predicativo feminino que descreve o conteúdo da vasilha.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Equivalente usual para a substância aromática empregada no culto do santuário.
