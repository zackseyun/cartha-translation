  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: pt
  text: Então os líderes apresentaram a oferta para a dedicação do altar, no dia em que ele foi ungido, e apresentaram sua oferta diante do altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: apresentaram
  rationale: O hifil de קרב, em contexto sacrificial, significa trazer para perto, apresentar ou oferecer. “Apresentaram” funciona naturalmente nas duas ocorrências e evita a repetição pouco elegante de “ofereceram a oferta”.
- source_word: הַנְּשִׂאִים
  choice: os líderes
  rationale: Em Números, נָשִׂיא designa os chefes ou representantes das tribos. “Líderes” é claro, atual e não sugere indevidamente condição monárquica.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: a oferta para a dedicação do altar
  rationale: חֲנֻכָּה significa “dedicação”. Como o verbo “apresentar” requer aqui algo concreto e o contexto descreve dádivas, a tradução explicita que se trata da oferta ligada à dedicação, sem perder a relação expressa pelo hebraico.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: no dia em que ele foi ungido
  rationale: A construção infinitiva com בְּ tem valor temporal. O pronome retoma “altar”; “ele” preserva essa referência de modo natural em português.
- source_word: קָרְבָּנָם
  choice: sua oferta
  rationale: קָרְבָּן é uma dádiva ou oferta apresentada em contexto cultual. “Oferta” é a escolha portuguesa corrente e adequada ao contexto do santuário.
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: diante do altar
  rationale: לִפְנֵי tem sentido espacial, “diante de” ou “em frente de”. “Diante do altar” conserva o tom cultual e é português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém a repetição de “apresentaram”, presente no hebraico, e explicita “oferta” na primeira oração para evitar a impressão incoerente de que os líderes apresentaram o próprio ato ou evento da dedicação.
