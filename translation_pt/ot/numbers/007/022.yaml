lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão hebraica designa idiomaticamente um caprino macho. “Bode” é a forma portuguesa natural, clara e precisa, sem reproduzir de modo artificial os dois substantivos da construção hebraica.
- source_word: אֶחָד
  choice: um
  rationale: Indica a quantidade e preserva o estilo enumerativo da lista de ofertas. Em português, “um bode” comunica naturalmente tanto o numeral quanto a indefinição adequada ao contexto.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת denomina uma categoria de oferta, não apenas o pecado em sentido abstrato. A preposição לְ é adequadamente expressa por “para” na fórmula da lista.
theological_decisions:
- issue: Tradução do termo sacrificial חַטָּאת
  choice: oferta pelo pecado
  alternative: para o pecado
  rationale: A lista cultual de Números 7 trata de ofertas prescritas; portanto, o termo indica a modalidade sacrificial. “Oferta pelo pecado” preserva essa referência ritual sem reduzir o termo a uma noção moral abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação concisa acompanha o caráter enumerativo do contexto e mantém o ponto e vírgula da sequência.
