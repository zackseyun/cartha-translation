lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão hebraica designa especificamente um caprino macho. “Bode” é a forma natural e precisa em português, sem necessidade de explicitar “macho”.
- source_word: אֶחָד
  choice: um
  rationale: Mantém o numeral explícito e o estilo enumerativo repetitivo de Números 7; em português, “um bode” expressa naturalmente tanto a quantidade quanto a indefinição.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta relacionada ao pecado e à purificação, não apenas o pecado em sentido abstrato. Esta formulação é clara, tradicional e inteligível em português atual.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto sacrificial
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O contexto exige o sentido de oferta sacrificial. “Oferta pelo pecado” preserva a terminologia bíblica reconhecível, enquanto a nota registra “oferta de purificação” como alternativa legítima, pois o rito também trata da impureza ritual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção concisa conserva o formato de inventário do capítulo e o ponto e vírgula indica a continuidade da lista.
