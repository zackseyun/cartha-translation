  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: pt
  text: um novilho, um carneiro e um cordeiro de um ano, para holocausto;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: novilho
  rationale: A expressão designa um bovino macho jovem. Em português, “novilho” comunica naturalmente tanto a espécie quanto a juventude do animal, sem a redundância pouco idiomática de “novilho do gado”.
- source_word: אַיִל
  choice: carneiro
  rationale: É o equivalente português corrente para o ovino macho adulto empregado nos sacrifícios.
- source_word: כֶּבֶשׂ
  choice: cordeiro
  rationale: Designa um ovino jovem; o substantivo hebraico é masculino, e “cordeiro” preserva isso naturalmente em português.
- source_word: בֶּן־שְׁנָתוֹ
  choice: de um ano
  rationale: Expressão idiomática hebraica que indica a idade do animal; “de um ano” é claro, natural e adequado ao registro da lista.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: “Holocausto” é o termo bíblico português consolidado para a oferta inteiramente queimada, e a preposição mantém a função destinada do animal.
- source_word: אֶחָד
  choice: um
  rationale: O numeral é repetido no hebraico para indicar a quantidade de cada animal; a tradução o preserva diante de cada item.
theological_decisions: []
translation_notes:
  register: Redação concisa e digna, própria de um inventário ritual. A coordenação com “e” antes do último item soa natural em português sem apagar a repetição quantitativa do hebraico.
