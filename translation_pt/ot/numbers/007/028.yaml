lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão hebraica designa um caprino macho. Em português, “bode” comunica naturalmente tanto a espécie quanto o sexo, sem a formulação redundante “bode macho”.
- source_word: אֶחָד
  choice: um
  rationale: Mantém o numeral explícito, importante nesta enumeração repetida de ofertas; em português, “um” funciona também de modo natural antes do substantivo.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, e não apenas o pecado em sentido abstrato. A preposição לְ é representada naturalmente por “para”.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto cultual
  choice: oferta pelo pecado
  alternative: para o pecado
  rationale: O contexto imediato enumera animais e ofertas sacrificiais, exigindo o sentido cultual. A tradução preserva esse sentido sem acrescentar interpretações teológicas posteriores.
translation_notes:
  register: Formulação breve, digna e natural em português moderno, adequada ao formato de inventário sacrificial. Não são necessárias notas de rodapé.
