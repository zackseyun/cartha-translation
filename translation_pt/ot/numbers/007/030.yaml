  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: pt
  text: No quarto dia, o líder[a] dos filhos de Rúben[b] foi Elizur, filho de Sedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefe” ou, conforme a tradução tradicional, “príncipe”. O termo hebraico נָשִׂיא designa aqui o dirigente oficial de uma tribo.
    reason: lexical_alternative
  - marker: b
