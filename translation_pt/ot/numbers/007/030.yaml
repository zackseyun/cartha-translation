lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: No quarto dia
  rationale: A preposição בְּ com יוֹם tem sentido temporal nesta enumeração; “no quarto dia” é a forma natural e fiel em português.
- source_word: נָשִׂיא
  choice: líder
  rationale: Em Números, designa o chefe oficialmente reconhecido de uma tribo. “Líder” comunica essa função sem sugerir necessariamente realeza, como poderia ocorrer com “príncipe”.
- source_word: לִבְנֵי רְאוּבֵן
  choice: dos filhos de Rúben
  rationale: Mantém a expressão familiar-tribal do hebraico e entende a preposição לְ como marcando vínculo ou representação; “para os filhos de Rúben” permanece uma alternativa possível.
- source_word: אֱלִיצוּר
  choice: Elizur
  rationale: Transliteração tradicional e reconhecível do nome próprio em português.
- source_word: בֶּן
  choice: filho de
  rationale: Forma patronímica hebraica padrão, expressa naturalmente em português.
- source_word: שְׁדֵיאוּר
  choice: Sedeur
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
