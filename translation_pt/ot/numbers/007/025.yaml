base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: A oferta dele foi uma bandeja de prata[a], que pesava cento e trinta siclos, e uma bacia de prata[b], que pesava setenta siclos, segundo o siclo do santuário[c]. Ambas estavam cheias de farinha fina misturada com azeite, para uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa de prata”.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela de prata”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, segundo o padrão de peso usado no santuário.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: A oferta dele foi
  rationale: קָרְבָּן designa aquilo que é apresentado a Deus em contexto ritual. “Oferta” é claro e corrente; o verbo “foi” torna natural em português a fórmula nominal do inventário.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: uma bandeja de prata
  rationale: קְעָרָה indica um recipiente relativamente raso, como prato, travessa ou bandeja. “Bandeja” distingue o objeto da bacia mencionada em seguida e se ajusta ao contexto cerimonial.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: A formulação verbal é natural em português e transmite com precisão a indicação hebraica do peso.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente empregado no serviço ritual, traduzível como bacia ou tigela. “Bacia” comunica melhor seu caráter de utensílio cerimonial.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: Repete de maneira clara a relação entre o segundo recipiente e seu peso, implícita na construção concisa do hebraico.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão especifica o padrão oficial pelo qual o peso era calculado. A formulação conserva a expressão cultual sem sugerir que se tratava de outro objeto.
- source_word: שְׁנֵיהֶם
  choice: Ambas
  rationale: O pronome retoma explicitamente as duas peças; o feminino concorda naturalmente com “bandeja” e “bacia”.
- source_word: מְלֵאִים
  choice: estavam cheias de
  rationale: O predicativo hebraico requer cópula em português; “estavam cheias de” expressa com clareza o conteúdo dos recipientes.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: סֹלֶת é a farinha refinada própria para ofertas. “Farinha fina” é preciso, tradicional e compreensível.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha preparada mediante mistura com óleo. “Azeite” é a designação natural no contexto bíblico mediterrâneo.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa especificamente a oferta não animal preparada com produtos agrícolas, e não uma oferta genérica.
