base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: pt
  text: e, para o sacrifício das ofertas de comunhão[a], duas cabeças de gado, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Elizur, filho de Sedeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de paz” ou “ofertas de bem-estar”.
    reason: Alternativas legítimas para o termo hebraico שְׁלָמִים, cujo campo semântico não é plenamente reproduzido por uma única expressão portuguesa.
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: e, para o sacrifício das ofertas de comunhão
  rationale: A conjunção e a preposição dão continuidade à lista. “Ofertas de comunhão” expressa o termo sacrificial שְׁלָמִים em linguagem atual, sem eliminar suas alternativas tradicionais.
- source_word: בָּקָר שְׁנַיִם
  choice: duas cabeças de gado
  rationale: בָּקָר é um coletivo para gado bovino e não especifica sexo; “duas cabeças de gado” preserva essa generalidade e soa natural em uma relação de animais.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa carneiros adultos, isto é, ovinos machos.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים designa especificamente caprinos machos.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: כְּבָשִׂים refere-se a cordeiros, e a expressão idiomática בְּנֵי שָׁנָה indica que tinham um ano de idade.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: A fórmula identifica retrospectivamente o conjunto apresentado; o passado é natural em português, e “oferta” traduz o termo geral קָרְבָּן.
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: Elisur, filho de Sedeur
  rationale: Os nomes são transliterados em formas correntes em português, e o patronímico é traduzido diretamente.
theological_decisions:
- issue: Sentido sacrificial de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: O termo pode salientar paz, integridade, bem-estar ou comunhão ligada à refeição sacrificial. A tradução principal usa uma designação clara e corrente, enquanto a nota preserva a amplitude lexical sem impor uma interpretação teológica exclusiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A enumeração mantém a concisão do inventário hebraico; o marcador da nota foi colocado imediatamente após o termo a que se refere.
