source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: A oferta dele foi uma travessa de prata[a], que pesava cento e trinta siclos, e uma bacia de prata[b], que pesava setenta siclos, segundo o siclo do santuário[c]. Ambas estavam cheias de farinha fina misturada com azeite, para uma oferta de cereais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prato” ou “tigela”. O termo hebraico designa um recipiente cuja forma exata não é especificada.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela de aspersão”. Em outros contextos, esse tipo de recipiente é usado em ritos de aspersão.
    reason: lexical_alternative
  - marker: c
    text: “Segundo o siclo do santuário” significa de acordo com o padrão de peso adotado no santuário.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: A oferta dele
  rationale: קָרְבָּן designa aquilo que é apresentado no culto. “Oferta” é claro e natural; “dele” preserva o sufixo possessivo hebraico sem tornar a frase excessivamente formal.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: uma travessa de prata
  rationale: קְעָרָה pode indicar travessa, prato ou tigela. “Travessa” comunica um recipiente relativamente largo sem definir com certeza uma forma que o hebraico não especifica.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: 'Expressa em português corrente a construção nominal hebraica “seu peso: cento e trinta”, preservando a unidade antiga.'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente usado no serviço cultual, por vezes associado à aspersão. “Bacia” identifica o objeto sem impor no texto principal uma função específica.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: Torna explícita e natural em português a relação entre a medida e o peso da bacia.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão indica o padrão de peso oficial associado ao santuário; a formulação mantém a especificidade cultual do hebraico.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: Ambas estavam cheias
  rationale: O feminino concorda naturalmente com “travessa” e “bacia” e preserva a referência conjunta aos dois recipientes.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: É o termo sacrificial usual para farinha finamente moída e de boa qualidade.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: “Misturada” traduz diretamente o preparo descrito; “azeite” é a forma portuguesa natural para o óleo empregado nesse contexto alimentar e sacrificial.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה é a oferta não animal preparada com cereal. A expressão evita o sentido excessivamente genérico de apenas “oferta”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A enumeração foi convertida em uma frase fluida, sem omitir os dois recipientes, seus pesos nem o padrão cultual. Os termos antigos “siclo” e “santuário” foram mantidos por precisão histórica, com nota explicativa para o padrão de peso.
