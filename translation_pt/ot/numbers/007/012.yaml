  text: וַ/יְהִ֗י הַ/מַּקְרִ֛יב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן אֶת קָרְבָּנ֑/וֹ נַחְשׁ֥וֹן בֶּן עַמִּינָדָ֖ב לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: pt
  text: No primeiro dia, quem apresentou a sua oferta foi Naassom, filho de Aminadabe, pela tribo de Judá[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da tribo de Judá». O hebraico pode indicar tanto representação quanto afiliação tribal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: foi
  rationale: A forma narrativa de היה é expressa naturalmente pela construção identificadora «quem ... foi», sem recorrer ao arcaico «e aconteceu que».
- source_word: הַמַּקְרִיב
  choice: quem apresentou
  rationale: O particípio hifil de קרב descreve aquele que faz a oferta aproximar-se, isto é, que a apresenta; a oração relativa é mais natural em português do que um substantivo como «ofertante».
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: No primeiro dia
  rationale: Expressão temporal direta e idiomática em português.
- source_word: אֶת קָרְבָּנוֹ
  choice: a sua oferta
  rationale: קָרְבָּן é o termo cultual para uma oferta apresentada no santuário; «oferta» conserva esse sentido sem linguagem arcaica.
- source_word: נַחְשׁוֹן
  choice: Naassom
  rationale: Forma tradicional e amplamente reconhecível do nome hebraico em português.
- source_word: בֶּן עַמִּינָדָב
  choice: filho de Aminadabe
  rationale: Tradução direta e natural do patronímico hebraico.
- source_word: לְמַטֵּה יְהוּדָה
  choice: pela tribo de Judá
  rationale: Neste contexto, o לְ indica que Naassom apresenta a oferta como representante da tribo; «pela tribo» comunica essa função, enquanto a nota preserva a possível leitura de simples afiliação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem frasal natural. A formulação evita o arcaísmo «e aconteceu que» e conserva em nota a nuance possível da preposição hebraica.
