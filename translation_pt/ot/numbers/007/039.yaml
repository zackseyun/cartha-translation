  yaml_path: translation/ot/numbers/007/039.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: pt
  text: um touro do rebanho, um carneiro e um cordeiro de um ano, para holocausto;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho
  rationale: A expressão designa um bovino macho jovem. Em português bíblico corrente, “novilho” transmite de modo natural e conciso tanto o tipo de animal quanto sua condição jovem, sem reproduzir literalmente o idiomatismo “filho do gado”.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל é o termo comum para o ovino macho adulto, especialmente em contextos sacrificiais; “carneiro” é o equivalente português direto.
- source_word: כֶּבֶשׂ אֶחָד
  choice: um cordeiro
  rationale: כֶּבֶשׂ designa um cordeiro e, neste contexto sacrificial, provavelmente um macho. Em português, “cordeiro” normalmente já sugere o macho; explicitar “macho” tornaria a lista menos natural.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: O idiomatismo hebraico indica a idade do animal. “De um ano” é a formulação natural e tradicional em português.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה designa a oferta inteiramente queimada. “Holocausto” é o termo sacrificial consagrado em português, e “para” representa adequadamente a preposição לְ.
- source_word: אֶחָד
  choice: um
  rationale: O numeral repetido enumera separadamente cada animal. Em português, a repetição de “um” antes de cada substantivo preserva essa estrutura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial bíblica amplamente reconhecida. A formulação evita o literalismo obscuro “filho do gado” e preserva a cadência enumerativa do hebraico.
