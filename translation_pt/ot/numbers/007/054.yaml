  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י נָשִׂ֖יא לִ/בְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/054.yaml
  text: On the eighth day[a], the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: pt
  text: No oitavo dia, o líder dos filhos de Manassés[a] foi Gamaliel, filho de Pedazur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de Manassés”, designação tribal; isto é, os descendentes ou a tribo de Manassés.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: A preposição בְּ com יוֹם e o ordinal forma uma expressão temporal. “No oitavo dia” é a formulação natural em português e não acrescenta contexto ausente do versículo.
- source_word: נָשִׂיא
  choice: líder
  rationale: Neste contexto tribal e cerimonial, designa o chefe reconhecido do grupo. “Líder” é claro e atual, sem a conotação monárquica que “príncipe” poderia sugerir.
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: dos filhos de Manassés
  rationale: A expressão identifica o grupo representado pelo líder. A tradução preserva a imagem familiar e tribal do hebraico בְּנֵי, enquanto a nota esclarece seu sentido coletivo.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal e tribal.
- source_word: גַּמְלִיאֵל
  choice: Gamaliel
  rationale: Transliteração tradicional e corrente em português.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente direto e convencional da construção patronímica hebraica.
- source_word: פְּדָה צוּר
  choice: Pedazur
  rationale: Forma portuguesa consolidada para o nome composto, apresentada como uma única palavra.
