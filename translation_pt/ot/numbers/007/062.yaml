lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: No contexto das ofertas do santuário em Números 7, designa um pequeno recipiente para incenso. «Vasilha» é natural, abrangente e evita sugerir uma colher comum.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal que indica a quantidade de recipientes.
- source_word: עֲשָׂרָה
  choice: dez
  rationale: Tradução direta do numeral na declaração de peso.
- source_word: זָהָב
  choice: de ouro
  rationale: Expressa naturalmente em português o material de que a vasilha era feita.
- source_word: עֲשָׂרָה זָהָב
  choice: de dez siclos
  rationale: Embora «siclos» não esteja expresso nesta linha abreviada, a fórmula recorrente de Números 7 deixa claro que se trata do peso em ouro. A nota preserva a forma literal e explicita a elipse.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Adjetivo predicativo feminino que concorda com o recipiente; «cheia de» é conciso e idiomático.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Termo corrente para a substância aromática usada no culto.
