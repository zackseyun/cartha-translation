  text: בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן חֵלֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/024.yaml
  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: pt
  text: No terceiro dia, o líder dos filhos de Zebulom[a] foi Eliabe, filho de Helom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o líder para os filhos de Zebulom”. A preposição hebraica pode indicar representação ou vínculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: A preposição בְּ com יוֹם introduz aqui uma indicação temporal; “no terceiro dia” é a forma idiomática e fiel em português.
- source_word: נָשִׂיא
  choice: líder
  rationale: Em Números, designa o chefe oficialmente reconhecido de uma tribo. “Líder” é claro e atual, sem a conotação monárquica que “príncipe” poderia sugerir.
- source_word: לִבְנֵי זְבוּלֻן
  choice: dos filhos de Zebulom
  rationale: Preserva a expressão genealógica hebraica e entende a preposição לְ como indicando vínculo ou representação tribal.
- source_word: אֱלִיאָב בֶּן חֵלֹן
  choice: Eliabe, filho de Helom
  rationale: Emprega as formas portuguesas tradicionais dos nomes e reproduz diretamente a fórmula patronímica hebraica.
