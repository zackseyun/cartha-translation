  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: pt
  text: Então Moisés pegou as carroças e o gado e os deu aos levitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “gado” é coletivo; o contexto deste capítulo especifica que eram bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: pegou
  rationale: O qal consecutivo de לקח significa normalmente “pegar” ou “tomar”. Aqui indica que Moisés recebeu os bens apresentados e tomou posse deles; “pegou” é natural e direto em português.
- source_word: הָעֲגָלֹת
  choice: as carroças
  rationale: עגלה designa aqui veículos usados para transporte. “Carroças” é uma expressão clara e corrente, adequada ao transporte terrestre por animais.
- source_word: הַבָּקָר
  choice: o gado
  rationale: בקר é um substantivo coletivo que designa gado bovino. “O gado” preserva a amplitude lexical do hebraico, embora o contexto do capítulo mostre que se tratava de bois.
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O qal consecutivo de נתן tem o sentido básico de “dar”. O contexto deixa claro que se trata de uma entrega para o serviço dos levitas, sem necessidade de explicitar “distribuiu” ou “designou”.
- source_word: אֹתָם
  choice: os
  rationale: O pronome objeto masculino plural retoma coletivamente as carroças e o gado. Em português, o pronome “os” faz essa retomada com naturalidade.
- source_word: אֶל־הַלְוִיִּם
  choice: aos levitas
  rationale: A preposição אֶל indica o destinatário da transferência. “Aos levitas” expressa diretamente que eles receberam os bens.
