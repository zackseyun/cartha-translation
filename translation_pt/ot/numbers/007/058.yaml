  choice: um
  rationale: Mantém explicitamente o numeral e o estilo enumerativo repetitivo da lista de ofertas em Números 7.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: Em contexto sacrificial, חַטָּאת designa a oferta relacionada ao pecado e à purificação. A preposição לְ indica finalidade; esta formulação é natural e reconhecível em português.
theological_decisions:
- issue: Sentido do termo sacrificial חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: O sentido sacrificial é certo, mas o termo hebraico pode enfatizar tanto o pecado quanto a remoção da impureza ritual. O texto principal usa a expressão mais reconhecível, e a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A concisão e a estrutura de inventário do hebraico foram preservadas.
