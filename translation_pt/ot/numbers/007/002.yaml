  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: pt
  text: Então os líderes de Israel, chefes das suas casas paternas[a], apresentaram ofertas[b]. Eles eram os líderes das tribos e estavam à frente dos que haviam sido recenseados[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Casas paternas” eram grupos familiares ancestrais, ou clãs, dentro de Israel.
    reason: cultural_note
  - marker: b
    text: Ou “fizeram chegar perto” ou “apresentaram”. O verbo hebraico significa literalmente “fazer chegar perto” e, neste contexto, refere-se à apresentação das ofertas para a dedicação.
    reason: lexical_alternative
  - marker: c
    text: Ou “estavam encarregados dos que haviam sido contados”. A expressão hebraica se refere aos que supervisionavam o grupo registrado no recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: apresentaram ofertas
  rationale: O hifil de קרב significa literalmente “fazer chegar perto” e, em contexto cultual, “apresentar”. Embora o objeto não esteja expresso neste versículo, o contexto imediato trata das ofertas para a dedicação; “apresentaram ofertas” comunica naturalmente a ação sem perder esse sentido.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: os líderes de Israel
  rationale: נָשִׂיא designa um chefe ou dirigente. “Líderes” é claro em português moderno e evita que “príncipes” sugira indevidamente descendência real.
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: chefes das suas casas paternas
  rationale: A expressão designa unidades familiares ancestrais organizadas segundo a linhagem paterna. “Casas paternas” preserva a forma e a estrutura social do hebraico.
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: Eles eram os líderes das tribos
  rationale: מַטּוֹת significa literalmente “cajados”, mas aqui é uma designação convencional das tribos. A tradução comunica diretamente o referente social.
- source_word: הֵם הָעֹמְדִים עַל
  choice: estavam à frente de
  rationale: O particípio de עמד com עַל pode descrever quem está sobre outros em função de supervisão. “Estavam à frente de” conserva a imagem espacial e expressa autoridade de modo natural.
- source_word: הַפְּקֻדִים
  choice: os que haviam sido recenseados
  rationale: A forma passiva derivada de פקד refere-se aos registrados ou contados no recenseamento. “Recenseados” é preciso e não torna explícita uma nuance militar além do necessário.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Casas paternas” mantém a textura social antiga e recebe explicação em nota; “estavam à frente” preserva a imagem hebraica de supervisão sem soar excessivamente literal.
