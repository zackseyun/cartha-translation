  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho
  rationale: No contexto sacrificial, פַּר designa um bovino macho jovem; בֶּן בָּקָר reforça sua pertença ao gado bovino. Em português, “novilho” expressa isso naturalmente sem reproduzir de modo artificial o idiomatismo hebraico.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל é o termo comum para um ovino macho adulto, especialmente em listas sacrificiais.
- source_word: כֶּבֶשׂ אֶחָד
  choice: um cordeiro
  rationale: כֶּבֶשׂ designa um cordeiro macho. “Cordeiro” é a forma natural em português; o gênero masculino já é indicado gramaticalmente.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: O idiomatismo hebraico especifica a idade do cordeiro. “De um ano” é claro, corrente e apropriado ao registro legal-sacrificial.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é a oferta inteiramente queimada sobre o altar. “Holocausto” é o termo bíblico português estabelecido para esse sacrifício, e a preposição לְ é adequadamente representada por “para”.
