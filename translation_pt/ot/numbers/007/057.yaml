  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: pt
  text: um novilho do gado[a], um carneiro e um cordeiro de um ano, para holocausto;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “um novilho, filho do gado”. A expressão identifica um bovino pertencente ao gado e também pode ser traduzida como “um novilho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho do gado
  rationale: פַּר designa um bovino macho, geralmente jovem, e בֶּן בָּקָר o classifica como pertencente ao gado bovino. “Novilho do gado” é claro no inventário sacrificial e mantém, sem literalismo excessivo, os dois elementos da expressão hebraica.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל é o termo comum para o ovino macho adulto, especialmente em contextos sacrificiais.
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: um cordeiro de um ano
  rationale: כֶּבֶשׂ indica um cordeiro, normalmente macho neste contexto, e בֶּן שְׁנָתוֹ especifica que tem um ano. Em português, “cordeiro” já costuma designar o macho, sem necessidade de explicitação pouco natural.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é o termo sacrificial tradicionalmente traduzido por “holocausto”, uma oferta inteiramente queimada; a preposição לְ indica sua finalidade.
