  text: um novilho, um carneiro e um cordeiro de um ano, para holocausto;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho
  rationale: A expressão designa um bovino macho jovem. Em português, “novilho” comunica de modo natural e conciso tanto a espécie quanto a idade aproximada, sem reproduzir literalmente o idiomatismo hebraico “filho do gado”.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל é o termo sacrificial comum para o ovino macho adulto; “carneiro” é o equivalente português preciso.
- source_word: כֶּבֶשׂ אֶחָד
  choice: um cordeiro
  rationale: כֶּבֶשׂ designa um cordeiro e, nesta forma, é masculino; “cordeiro” expressa isso naturalmente em português, sem necessidade de acrescentar “macho”.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: O idiomatismo hebraico indica a idade do cordeiro. “De um ano” é claro, corrente e adequado ao estilo de inventário.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é a oferta inteiramente queimada. “Holocausto” é o termo bíblico tradicional e amplamente reconhecido em português, e a preposição “para” preserva a função indicada por לְ־.
