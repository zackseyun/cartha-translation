translation_notes:
  register: Formulação concisa e digna, preservando a estrutura enumerativa do hebraico. Evitou-se a expressão literal e pouco natural “filho do gado”; “novilho” incorpora adequadamente seu valor classificatório. A pontuação final com ponto e vírgula acompanha o caráter continuativo do inventário no contexto.
