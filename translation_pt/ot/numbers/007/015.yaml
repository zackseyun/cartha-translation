lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho
  rationale: A expressão designa um bovino macho jovem. Em português bíblico atual, “novilho” comunica de modo natural tanto פַּר quanto a especificação bovina בֶּן בָּקָר, sem a redundância pouco idiomática de “um novilho do gado”.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: “Carneiro” é o equivalente português corrente para o ovino macho adulto indicado por אַיִל.
- source_word: כֶּבֶשׂ אֶחָד
  choice: um cordeiro
  rationale: כֶּבֶשׂ designa aqui um cordeiro destinado ao sacrifício. “Cordeiro” é natural e, neste contexto ritual, suficientemente preciso sem acrescentar uma explicitação de sexo que o português normalmente dispensa.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: A expressão idiomática hebraica indica a idade do animal. “De um ano” é a formulação clara, corrente e tradicional em listas sacrificiais portuguesas.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é o sacrifício inteiramente queimado. “Holocausto” é o termo técnico bíblico estabelecido em português, e a preposição “para” preserva a função indicada por לְ־.
- source_word: אֶחָד
  choice: um
  rationale: O numeral repetido contabiliza cada animal individualmente; a repetição é preservada em português, exceto onde a coordenação natural já mantém claramente a contagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial bíblica reconhecível. A enumeração concisa do hebraico foi preservada; inseriu-se apenas a conjunção “e” antes do último item, conforme o uso natural do português.
