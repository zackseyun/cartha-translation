lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: carroças
  rationale: עֲגָלָה designa um veículo de carga. “Carroças” é claro no português atual e se ajusta ao transporte dos componentes do tabernáculo, sem a ambiguidade moderna de “carros”.
- source_word: הַבָּקָר
  choice: cabeças de gado
  rationale: בָּקָר é um termo coletivo para bovinos. “Quatro cabeças de gado” preserva essa amplitude sem especificar sexo, embora o contexto de tração torne “bois” uma alternativa plausível.
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: aos filhos de Gérson
  rationale: Mantém a expressão filial do hebraico, que é natural em português bíblico, em vez de substituí-la pelo gentílico “gersonitas”.
- source_word: כְּפִי עֲבֹדָתָם
  choice: conforme o serviço deles
  rationale: כְּפִי expressa conformidade, e עֲבֹדָה se refere aqui ao serviço ou encargo ligado ao tabernáculo. A formulação permanece próxima do hebraico sem explicitar além do texto.
- source_word: נָתַן
  choice: Deu
  rationale: Reproduz o sentido direto do verbo, sem acrescentar a ideia interpretativa de designação ou distribuição.
