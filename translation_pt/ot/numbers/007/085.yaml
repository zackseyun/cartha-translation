translation:
  language: pt
  text: cada bandeja de prata pesava cento e trinta siclos, e cada bacia, setenta. Ao todo, a prata dos utensílios pesava dois mil e quatrocentos siclos, segundo o siclo do santuário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de acordo com o siclo do santuário”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: cento e trinta
  rationale: O hebraico apresenta literalmente “trinta e cem”; a ordem numérica natural em português é “cento e trinta”.
- source_word: הַקְּעָרָה הָאַחַת כֶּסֶף
  choice: cada bandeja de prata
  rationale: Neste inventário, o singular definido com אֶחָד tem sentido distributivo. קְעָרָה designa aqui uma bandeja ou travessa; “bandeja” é claro e condiz com a lista dos utensílios.
- source_word: הַמִּזְרָק הָאֶחָד
  choice: cada bacia
  rationale: O singular definido é distributivo, como na expressão anterior. מִזְרָק designa uma bacia ou tigela usada no culto; “bacia” é natural e suficientemente precisa.
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: Ao todo, a prata dos utensílios
  rationale: כֹּל indica a soma total, כֶּסֶף refere-se ao material, e כֵּלִים aos utensílios ou recipientes. A formulação portuguesa comunica o total sem confundir prata com dinheiro.
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: dois mil e quatrocentos
  rationale: Forma numérica corrente e natural em português.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A preposição בְּ especifica o padrão de peso empregado. “Segundo o siclo do santuário” preserva esse sentido e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ordem direta. O verbo “pesava” foi explicitado nas duas unidades e no total para deixar clara a função dos números, implícita no hebraico. Mantém-se “siclo” como unidade antiga, sem conversão moderna incerta.
