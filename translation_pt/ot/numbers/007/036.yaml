base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/036.yaml
  text: On the fifth day Shelumiel son of Zurishaddai[a], leader of the sons of Simeon,
translation:
  language: pt
  text: No quinto dia, Selumiel, filho de Zurisadai, líder dos filhos de Simeão[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos simeonitas”. O hebraico diz mais literalmente “dos filhos de Simeão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: No quinto dia
  rationale: Reproduz de modo natural a expressão temporal hebraica com o ordinal, sem acrescentar “da dedicação”, que não está explícito neste versículo.
- source_word: נָשִׂיא
  choice: líder
  rationale: No contexto de Números 7, designa o representante reconhecido de uma tribo; “líder” é claro e evita o sentido régio potencialmente enganoso de “príncipe”.
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: dos filhos de Simeão
  rationale: Preserva de perto a construção hebraica de filiação ou representação tribal. A forma mais idiomática “dos simeonitas” é registrada em nota.
- source_word: שְׁלֻמִיאֵל
  choice: Selumiel
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente natural da construção patronímica hebraica.
- source_word: צוּרִישַׁדָּי
  choice: Zurisadai
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal hebraico.
