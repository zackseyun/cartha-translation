  terminology: «Oferta» para קָרְבָּן e «oferta de cereal» para מִנְחָה são adequados ao contexto cultual. «Siclo do santuário» preserva a referência ao padrão de peso sagrado sem impor interpretação adicional. As notas distinguem com prudência as possibilidades lexicais de קְעָרָה e מִזְרָק e explicam o padrão de medida.
