  source_fidelity: 'A tradução transmite com precisão a enumeração hebraica: a oferta consiste em um prato de prata de cento e trinta siclos e uma bacia de prata de setenta siclos, conforme o padrão do santuário; os dois recipientes estão cheios de farinha fina misturada com azeite para uma oferta de cereal. As explicitações de peso por meio de «que pesava» são legítimas e não acrescentam conteúdo material.'
