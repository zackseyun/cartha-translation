  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: pt
  text: Sua oferta foi um prato de prata[a], que pesava cento e trinta siclos, e uma bacia de prata[b], que pesava setenta siclos, segundo o siclo do santuário[c]; ambos estavam cheios de farinha fina misturada com azeite, para uma oferta de cereal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “travessa”; o termo hebraico indica um recipiente raso.
    reason: lexical_alternative
  - marker: b
    text: Ou “tigela”; trata-se de um recipiente usado no serviço ritual.
    reason: lexical_alternative
  - marker: c
    text: Isto é, segundo o padrão de peso do santuário.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: Sua oferta foi
  rationale: קָרְבָּן designa aquilo que é apresentado em contexto cultual; “oferta” é claro, corrente e apropriado ao contexto sacrificial.
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: um prato de prata
  rationale: קְעָרָה indica um recipiente relativamente raso, como prato ou travessa; “prato” mantém a distinção em relação à bacia seguinte.
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: que pesava cento e trinta siclos
  rationale: Expressa naturalmente em português a indicação literal do peso do primeiro recipiente.
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: uma bacia de prata
  rationale: מִזְרָק é um recipiente usado no serviço ritual; “bacia” comunica seu caráter funcional sem especificar indevidamente o uso exato.
- source_word: שִׁבְעִים שֶׁקֶל
  choice: que pesava setenta siclos
  rationale: Torna explícita a função ponderal da expressão, que no hebraico é elíptica.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Preserva a formulação cultual e indica que os pesos seguem o padrão oficial associado ao santuário.
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: ambos estavam cheios
  rationale: Reproduz a referência enfática aos dois recipientes e concorda com os substantivos masculinos em português.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente estabelecido para a farinha refinada usada nas ofertas.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha preparada mediante mistura com óleo; “azeite” é natural no contexto bíblico mediterrânico.
- source_word: לְמִנְחָה
  choice: para uma oferta de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa a oferta não animal preparada com produtos dos cereais; a expressão evita reduzi-la apenas a farinha.
