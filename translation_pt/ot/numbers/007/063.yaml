  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: pt
  text: um novilho, um carneiro e um cordeiro macho de um ano, para holocausto;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: novilho
  rationale: A expressão designa um bovino macho oferecido em sacrifício. Em português, “novilho” transmite de modo natural a ideia de um touro jovem proveniente do gado, sem reproduzir literalmente o idiomatismo hebraico “filho do gado”.
- source_word: אַיִל
  choice: carneiro
  rationale: Equivalente português preciso para o macho adulto da ovelha em contexto sacrificial.
- source_word: כֶּבֶשׂ
  choice: cordeiro macho
  rationale: “Cordeiro” indica o animal jovem, e “macho” explicita a distinção sexual provável do termo hebraico neste inventário sacrificial.
- source_word: בֶּן־שְׁנָתוֹ
  choice: de um ano
  rationale: Forma portuguesa clara e idiomática para a expressão hebraica que indica um animal de um ano ou no primeiro ano de vida.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: “Holocausto” é o termo bíblico português corrente para a oferta inteiramente queimada, e “para” representa naturalmente o prefixo לְ.
- source_word: אֶחָד
  choice: um
  rationale: O numeral repetido especifica a quantidade de cada animal; em português, pode ser preservado sem repetir artificialmente o artigo diante do terceiro item coordenado.
