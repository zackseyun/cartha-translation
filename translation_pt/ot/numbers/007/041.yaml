base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: pt
  text: e, para o sacrifício de ofertas de comunhão[a], duas cabeças de gado[b], cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Selumiel, filho de Zurisadai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “ofertas de paz” ou “ofertas de bem-estar”.
    reason: lexical_alternative
  - marker: b
    text: O hebraico usa um termo amplo para gado bovino; algumas traduções dizem “dois bois”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: e, para o sacrifício das ofertas de comunhão
  rationale: A conjunção e a preposição dão continuidade à lista. “Ofertas de comunhão” comunica o caráter relacional de שְׁלָמִים sem eliminar as alternativas tradicionais “ofertas de paz” e “ofertas de bem-estar”, registradas em nota.
- source_word: בָּקָר שְׁנַיִם
  choice: duas cabeças de gado
  rationale: בָּקָר é um termo coletivo amplo para gado bovino e não especifica necessariamente bois machos. A expressão portuguesa é natural numa enumeração de animais e preserva essa abrangência.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa carneiros adultos, especialmente em contextos sacrificiais.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים refere-se especificamente a caprinos machos; “bodes” preserva essa informação.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: כְּבָשִׂים indica cordeiros machos, e בְּנֵי שָׁנָה é a expressão convencional para animais de um ano de idade.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: O demonstrativo retoma a lista precedente, e o passado soa natural na fórmula narrativa repetida. קָרְבַּן é o termo geral para uma oferta apresentada.
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: Selumiel, filho de Zurisadai
  rationale: Empregam-se formas portuguesas estabelecidas dos nomes, mantendo literalmente a relação genealógica expressa por בֶּן.
theological_decisions:
- issue: Sentido cultual de שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas de paz; ofertas de bem-estar
  rationale: 'O termo admite mais de uma nuance: paz, integridade, bem-estar e comunhão associada à refeição sacrificial. A tradução principal escolhe uma formulação clara no português moderno, enquanto a nota conserva as alternativas genuínas sem impor uma interpretação teológica exclusiva.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração mantém o ritmo do inventário hebraico; “cabeças de gado” evita atribuir ao בָּקָר um sexo que o termo não explicita. Os marcadores [a] e [b] aparecem junto aos termos correspondentes.
