base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: pt
  text: Receba-os deles, e serão destinados ao serviço da Tenda do Encontro; você os dará aos levitas, a cada um conforme o seu serviço.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os objetos deveriam ser distribuídos entre os levitas de acordo com o serviço atribuído a cada um.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח מֵאִתָּם
  choice: Receba-os deles
  rationale: O imperativo de לקח pode significar tomar ou receber. Neste contexto, os objetos são ofertas apresentadas pelos líderes; “receba-os deles” expressa naturalmente em português tanto a ação ordenada a Moisés quanto a origem dos bens.
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: e eles serão usados no serviço
  rationale: A construção hebraica expressa finalidade, literalmente algo como “e serão para servir o serviço”. Como os referentes são carros e bois, a formulação passiva comunica em português atual que seriam destinados ao trabalho do santuário sem atribuir ação pessoal a objetos inanimados.
- source_word: אֹהֶל מוֹעֵד
  choice: Tenda do Encontro
  rationale: Tradução tradicional e transparente do nome do santuário no deserto, mantendo o valor de מוֹעֵד como encontro designado.
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: você os dará aos levitas
  rationale: Preserva o sentido comum de נתן, “dar”, e a destinação aos levitas. O futuro com valor imperativo traduz naturalmente a instrução em português.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: a cada um conforme o seu serviço
  rationale: אִישׁ tem força distributiva, e כְּפִי indica conformidade ou medida. A redação mostra que a distribuição deve corresponder ao serviço atribuído a cada levita ou grupo levítico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tenda do Encontro” é usada como designação do santuário; “serviço” preserva a nuance do trabalho levítico. O pronome “você” torna explícito que a ordem se dirige a Moisés sem introduzir informação ausente do contexto.
