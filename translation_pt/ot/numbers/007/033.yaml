  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: pt
  text: um novilho do rebanho[a], um carneiro, um cordeiro de um ano, para holocausto;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “um novilho, filho do gado” — expressão que indica um bovino do rebanho.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: um novilho do rebanho
  rationale: פַּר designa um touro ou novilho, e בֶּן בָּקָר é literalmente “filho do gado/rebanho”, expressão que identifica um bovino. “Novilho do rebanho” é natural em português e preserva a especificação sem reproduzir literalmente o idioma hebraico.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל é o termo sacrificial usual para um ovino macho adulto; “carneiro” é o equivalente português preciso.
- source_word: כֶּבֶשׂ אֶחָד
  choice: um cordeiro
  rationale: כֶּבֶשׂ designa um cordeiro, normalmente macho neste contexto sacrificial. Em português, “cordeiro” já pode designar especificamente o macho, sem necessidade de uma formulação redundante.
- source_word: בֶּן שְׁנָתוֹ
  choice: de um ano
  rationale: A expressão hebraica indica um animal de um ano ou em seu primeiro ano de vida. “De um ano” é a formulação corrente e concisa em inventários sacrificiais.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: עֹלָה é a oferta inteiramente queimada. “Holocausto” é o termo bíblico tradicional e ainda inteligível em português para esse sacrifício específico.
- source_word: אֶחָד
  choice: um
  rationale: O numeral se repete para contar cada animal; foi preservado em cada item da lista.
theological_decisions:
- issue: Sentido sacrificial de עֹלָה
  choice: holocausto
  alternative: oferta queimada
  rationale: “Holocausto” mantém a terminologia bíblica portuguesa para a oferta totalmente consumida pelo fogo, sem acrescentar interpretação teológica; a alternativa é semanticamente transparente, mas menos estabelecida como nome técnico.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial bíblica consolidada. A coordenação com “e” antes do último animal torna a enumeração natural. A ambiguidade de בֶּן שְׁנָתוֹ entre “de um ano” e “em seu primeiro ano” é preservada de modo idiomático por “de um ano”.
