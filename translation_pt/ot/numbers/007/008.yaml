base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: pt
  text: E deu os quatro carros e os oito bois aos filhos de Merari, conforme o serviço deles, sob a direção de Itamar, filho de Arão, o sacerdote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: carros
  rationale: עֲגָלָה designa um veículo de transporte com rodas. Neste contexto, “carros” é natural e se refere aos veículos usados para transportar partes do tabernáculo.
- source_word: הַבָּקָר
  choice: bois
  rationale: Embora בָּקָר possa designar gado bovino em geral, aqui os animais puxam os carros; “bois” é a opção contextual mais específica.
- source_word: נָתַן
  choice: deu
  rationale: Preserva o sentido simples do verbo hebraico, sem explicitar como “designou” a ideia contextual de distribuição oficial.
- source_word: לִבְנֵי מְרָרִי
  choice: aos filhos de Merari
  rationale: Reproduz a expressão familiar e tribal do hebraico e permanece clara em português.
- source_word: כְּפִי עֲבֹדָתָם
  choice: conforme o serviço deles
  rationale: כְּפִי significa idiomaticamente “conforme” ou “de acordo com”, e עֲבֹדָה indica aqui o serviço atribuído no tabernáculo.
- source_word: בְּיַד אִיתָמָר
  choice: sob a direção de Itamar
  rationale: A expressão literal “pela mão de Itamar” é um idiomatismo de agência, responsabilidade ou supervisão; a formulação escolhida comunica sua função em português atual.
- source_word: הַכֹּהֵן
  choice: o sacerdote
  rationale: Mantém o título definido e a identificação formal de Arão presentes no hebraico.
