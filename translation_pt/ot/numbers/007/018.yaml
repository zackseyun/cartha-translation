  text: בַּ/יּוֹם֙ הַ/שֵּׁנִ֔י הִקְרִ֖יב נְתַנְאֵ֣ל בֶּן צוּעָ֑ר נְשִׂ֖יא יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/018.yaml
  text: On the second day Nethanel son of Zuar, the leader of Issachar, presented his offering.
translation:
  language: pt
  text: No segundo dia, Natanael, filho de Zuar, líder de Issacar, apresentou sua oferta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente “apresentou”; “sua oferta” foi acrescentado com base no contexto repetitivo de Números 7, em que cada líder tribal apresenta uma oferta.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: No segundo dia
  rationale: A preposição בְּ com יוֹם e o ordinal forma uma expressão temporal; esta é a formulação natural em português e não acrescenta ao versículo uma referência explícita à dedicação.
- source_word: הִקְרִיב
  choice: apresentou sua oferta
  rationale: O hifil de קרב, neste contexto cultual, significa apresentar ou oferecer. Embora o objeto esteja elíptico no hebraico, a fórmula repetida no contexto imediato deixa claro que se trata da oferta do líder; a explicitação produz português natural e é assinalada em nota.
- source_word: נְתַנְאֵל
  choice: Natanael
  rationale: Forma portuguesa bíblica tradicional e amplamente reconhecível do nome hebraico.
- source_word: בֶּן צוּעָר
  choice: filho de Zuar
  rationale: Reproduz de modo direto e natural a construção filial hebraica.
- source_word: נְשִׂיא
  choice: líder
  rationale: No contexto tribal, נָשִׂיא designa o chefe ou representante reconhecido da tribo. “Líder” comunica a função sem sugerir necessariamente realeza.
- source_word: יִשָּׂשכָר
  choice: Issacar
  rationale: Forma portuguesa bíblica tradicional e amplamente reconhecida para o nome da tribo.
