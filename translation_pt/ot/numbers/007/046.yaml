  rationale: Mantém o numeral explícito e o estilo enumerativo repetitivo de Números 7.
- source_word: לְחַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת é o termo técnico usual para a oferta relacionada ao pecado; a preposição לְ indica aqui a finalidade ou designação do animal.
theological_decisions:
- issue: Sentido de חַטָּאת no contexto cultual
  choice: oferta pelo pecado
  alternative: para o pecado
  rationale: Nas listas sacerdotais de sacrifícios, חַטָּאת normalmente designa uma oferta sacrificial, não apenas o pecado em sentido abstrato. A tradução conserva esse sentido cultual sem acrescentar uma interpretação doutrinária posterior.
