- source_word: עֲשָׂרָה זָהָב
  choice: de dez siclos
  rationale: A fórmula elíptica do inventário indica o peso em siclos; a unidade é explicitada para que o sentido fique claro em português, sem acrescentar conteúdo estranho ao contexto.
- source_word: זָהָב
  choice: de ouro
  rationale: Indica o material de que era feita a vasilha.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Adjetivo predicativo feminino que descreve o conteúdo da vasilha.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Termo corrente para a substância aromática usada no contexto sacerdotal e no tabernáculo.
