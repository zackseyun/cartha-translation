lexical_decisions:
- source_word: כַּף
  choice: vasilha
  rationale: Neste contexto de ofertas para o santuário, designa um pequeno recipiente ritual. “Vasilha” é natural e evita sugerir um talher, como poderia ocorrer com a tradução tradicional “colher”.
- source_word: אַחַת
  choice: uma
  rationale: Numeral cardinal feminino que concorda com כַּף.
- source_word: עֲשָׂרָה זָהָב
  choice: de dez siclos
  rationale: A expressão hebraica abrevia uma fórmula de peso; a unidade “siclos” é recuperada do contexto imediato. A construção indica o peso da vasilha de ouro.
- source_word: זָהָב
  choice: de ouro
  rationale: Indica o material de que a vasilha era feita.
- source_word: מְלֵאָה
  choice: cheia de
  rationale: Adjetivo predicativo feminino que descreve o conteúdo da vasilha.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: Termo corrente para a substância aromática oferecida no culto.
