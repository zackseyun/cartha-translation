  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִירַ֖ע בֶּן עֵינָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/083.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Ahira son of Enan.'
translation:
  language: pt
  text: 'E, para o sacrifício de ofertas de paz: dois bovinos, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Aira, filho de Enã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: E, como sacrifício de ofertas de paz
  rationale: A construção preserva o substantivo זֶבַח e apresenta שְׁלָמִים como a categoria sacrificial tradicionalmente chamada de ofertas de paz, sem restringi-la à ideia de comunhão ou bem-estar.
- source_word: בָּקָר שְׁנַיִם
  choice: dois bovinos
  rationale: בָּקָר é coletivo e não especifica aqui o sexo dos animais; “bovinos” é claro e evita acrescentar essa informação.
- source_word: אֵילִם חֲמִשָּׁה
  choice: cinco carneiros
  rationale: אֵילִם designa especificamente carneiros adultos machos.
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: cinco bodes
  rationale: עַתֻּדִים designa caprinos machos; “bodes” é a forma corrente e precisa em português.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: cinco cordeiros de um ano
  rationale: A expressão conserva tanto a espécie quanto a indicação explícita da idade, em formulação natural.
- source_word: זֶה קָרְבַּן
  choice: Essa foi a oferta de
  rationale: O passado se ajusta ao contexto narrativo e “oferta” é o equivalente cultual corrente de קָרְבָּן.
- source_word: אֲחִירַע בֶּן עֵינָן
  choice: Aira, filho de Enã
  rationale: Os nomes são transliterados em formas naturais ao português, e o patronímico hebraico é preservado.
theological_decisions:
- issue: Sentido cultual de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: “Ofertas de paz” mantém o termo tradicional e reconhecível, enquanto as alternativas representam nuances legítimas, mas nenhuma delas esgota com certeza o campo semântico do termo hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura de inventário clara. Evitou-se especificar o sexo dos bovinos, pois o hebraico não o faz neste ponto. Não se incluiu nota porque não há marcador correspondente necessário no texto final.
