    issue: A expressão «como sacrifício» não reproduz adequadamente o valor de לְ em וּלְזֶבַח.
    rationale: 'O hebraico introduz a rubrica seguinte da oferta: «e para o sacrifício de [ofertas] de paz». «Como» pode apresentar os animais como equivalência ou classificação, em vez de introduzir a finalidade/categoria sacrificial.'
  revised_text: 'E, para o sacrifício de ofertas de paz: dois bovinos, cinco carneiros, cinco bodes e cinco cordeiros de um ano. Essa foi a oferta de Aira, filho de Enã.'
