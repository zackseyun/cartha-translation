base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: pt
  text: 'Dos primogênitos dos filhos de Israel, ele tomou a prata[a]: mil trezentos e sessenta e cinco siclos, segundo o siclo do santuário[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o dinheiro”. O termo hebraico significa literalmente “prata” e também pode designar dinheiro.
    reason: lexical_alternative
  - marker: b
    text: Ou “em siclos do santuário”. A expressão indica o padrão de peso do santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵת
  choice: Dos
  rationale: Introduz a fonte de quem a prata foi tomada; “dos” é natural em português e não acrescenta uma ideia de agência ausente do contexto.
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: os primogênitos dos filhos de Israel
  rationale: Embora בְּכוֹר esteja no singular formal, tem sentido coletivo neste contexto. O plural em português comunica esse valor sem sugerir um único primogênito e preserva a expressão “filhos de Israel”.
- source_word: לָקַח
  choice: tomou
  rationale: Mantém o sentido comum do verbo hebraico, “tomar”, sem substituí-lo interpretativamente por “receber” ou “arrecadar”.
- source_word: הַכָּסֶף
  choice: a prata
  rationale: Preserva o sentido material primário de כֶּסֶף, embora o termo também possa designar dinheiro.
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: mil trezentos e sessenta e cinco
  rationale: Apresenta os componentes numéricos hebraicos na ordem cardinal normal e clara do português.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: Expressa que o valor foi calculado pelo padrão de peso associado ao santuário, evitando sugerir necessariamente uma moeda distinta.
