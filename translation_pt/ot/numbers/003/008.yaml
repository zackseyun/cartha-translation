  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: pt
  text: Cuidarão de todos os utensílios da tenda do encontro e cumprirão a responsabilidade dos filhos de Israel[a], para realizar o serviço do tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: ficarão encarregados da incumbência dos filhos de Israel.'
    reason: Alternativa lexical e sintática para מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל, que pode ser expressa como responsabilidade, incumbência ou dever confiado.
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Cuidarão de
  rationale: No contexto do santuário, שׁמר expressa cuidado responsável e cumprimento de uma incumbência; “cuidarão de” é natural em português e conserva a ideia de custódia.
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: todos os utensílios da tenda do encontro
  rationale: כְּלִים abrange os objetos e equipamentos usados no santuário. “Utensílios” evita restringir o termo a recipientes, e “tenda do encontro” preserva a designação do local de encontro estabelecido.
- source_word: מִשְׁמֶרֶת
  choice: responsabilidade
  rationale: O substantivo indica uma incumbência confiada ou obrigação a ser cumprida. “Responsabilidade” soa natural e evita repetir a ideia verbal de cuidar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a forma masculina corporativa explícita do hebraico e a designação tradicional do povo.
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: realizando o serviço
  rationale: A combinação cognata de עבד e עֲבֹדָה descreve a execução do trabalho cultual; esta formulação é clara e idiomática em português.
- source_word: הַמִּשְׁכָּן
  choice: do tabernáculo
  rationale: “Tabernáculo” é a designação portuguesa convencional e precisa para o santuário móvel no deserto.
theological_decisions:
- issue: Expressão corporativa masculina בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A opção conserva a forma do texto hebraico sem negar seu uso corporativo para o povo de Israel.
- issue: Relação da responsabilidade dos israelitas com o serviço levítico
  choice: cumprirão a responsabilidade dos filhos de Israel
  alternative: ficarão encarregados da incumbência dos filhos de Israel
  rationale: O texto apresenta o serviço como uma incumbência pertencente aos filhos de Israel e assumida pelos levitas; a tradução não especifica além disso a natureza exata dessa representação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia bíblica reconhecível. “Tenda do encontro” e “tabernáculo” distinguem as duas designações hebraicas presentes no versículo.
