base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/044.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”. Tradicionalmente traduzido como “SENHOR”; também transliterado “Javé”.'
    reason: Registra a forma hebraica e as principais convenções de tradução ou transliteração do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר, com o waw consecutivo, faz a narrativa avançar e integra a fórmula habitual de introdução da fala divina. “Falou” preserva sua distinção formal em relação a אמר e é natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; na construção portuguesa “falar a alguém”, “a” oferece uma correspondência formal e clara.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo hebraico introduz o conteúdo da fala. “Dizendo” conserva a fórmula discursiva e prepara naturalmente a declaração seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo pelo título “SENHOR”; a nota informa a convenção alternativa comum em português.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A coordenação inicial e a fórmula “falou... dizendo” conservam a estrutura narrativa e discursiva do hebraico.
