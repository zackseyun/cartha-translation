base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: pt
  text: Moisés os contou por ordem de Yahweh[a], conforme lhe havia sido ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “segundo a boca de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: contou
  rationale: Neste contexto de recenseamento, פקד indica contar ou registrar pessoas; “contou” é claro, natural e adequado ao referente levítico.
- source_word: אֹתָם
  choice: os
  rationale: Pronome de objeto direto que retoma os levitas mencionados no contexto.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: A expressão idiomática significa literalmente “segundo a boca de Yahweh”, mas aqui comunica que Moisés agiu em obediência à ordem divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa correspondência entre a ação de Moisés e a ordem que ele havia recebido.
- source_word: צֻוָּה
  choice: lhe havia sido ordenado
  rationale: Preserva a forma passiva do pual e usa o mais-que-perfeito composto para indicar que a ordem precedeu o recenseamento; o referente do pronome é Moisés.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formulação acessível tanto no Brasil quanto em outros contextos lusófonos. “Por ordem de” comunica de modo idiomático a expressão hebraica, enquanto a nota preserva sua forma literal.
