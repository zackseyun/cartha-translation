  text: you shall take five shekels apiece[a], by the shekel of the sanctuary[b]; the shekel is twenty gerahs.
translation:
  language: pt
  text: Você tomará cinco siclos por pessoa[a], segundo o siclo do santuário[b]; o siclo equivale a vinte geras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cinco siclos por cabeça”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, segundo o padrão de peso do santuário; um siclo equivale a vinte geras.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Você cobrará
  rationale: O perfeito qal com conjunção, neste contexto de instrução, tem força diretiva. “Cobrará” expressa naturalmente a exigência de receber esse valor como resgate.
- source_word: חֲמֵשֶׁת חֲמֵשֶׁת שְׁקָלִים לַגֻּלְגֹּלֶת
  choice: cinco siclos por pessoa
  rationale: A repetição de “cinco” é distributiva, e לַגֻּלְגֹּלֶת significa literalmente “por cabeça”. “Por pessoa” comunica com clareza o sentido idiomático, enquanto a forma literal é registrada em nota.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: segundo o siclo do santuário
  rationale: A expressão indica o padrão de peso usado no santuário. A tradução preserva a referência cultual sem sugerir necessariamente uma moeda distinta.
- source_word: תִּקָּח עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: o siclo equivale a vinte geras
  rationale: Embora תִּקָּח seja formalmente “você tomará”, a construção define o valor do siclo. “Equivale a” reproduz em português natural essa função explicativa.
- source_word: גֵּרָה
  choice: geras
  rationale: Mantém o nome hebraico da unidade de peso, com plural regular em português após “vinte”.
