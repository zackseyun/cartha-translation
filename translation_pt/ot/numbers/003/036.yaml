  text: וּ/פְקֻדַּ֣ת מִשְׁמֶרֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמֻּדָ֣י/ו וַ/אֲדָנָ֑י/ו וְ/כָל כֵּלָ֔י/ו וְ/כֹ֖ל עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: pt
  text: O encargo confiado aos filhos de Merari abrangia as armações do tabernáculo[a], suas travessas, suas colunas, suas bases[b], todos os seus equipamentos e todo o trabalho relacionado a ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as tábuas do tabernáculo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus encaixes”.
    reason: lexical_alternative
  - marker: c
    text: Ou “todo o seu serviço”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: o encargo confiado
  rationale: A combinação dos dois substantivos indica uma responsabilidade oficialmente atribuída e mantida sob os cuidados dos meraritas. A formulação evita uma duplicação pouco natural como “a incumbência da guarda”.
- source_word: בְּנֵי מְרָרִי
  choice: os filhos de Merari
  rationale: Mantém a forma genealógica explícita do hebraico e é clara em português.
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: as armações do tabernáculo
  rationale: קֶרֶשׁ designa as peças estruturais verticais do tabernáculo. “Armações” comunica sua função arquitetônica; “tábuas” permanece uma alternativa lexical possível.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: É o termo técnico tradicional e inteligível para a estrutura do santuário, embora a palavra hebraica se relacione etimologicamente com habitação.
- source_word: בְרִיחָיו
  choice: suas travessas
  rationale: No contexto da construção, são barras horizontais que ligavam ou reforçavam as armações; “travessas” expressa essa função com naturalidade.
- source_word: עַמֻּדָיו
  choice: suas colunas
  rationale: O termo indica suportes verticais; “colunas” é claro, digno e apropriado ao contexto estrutural.
- source_word: אֲדָנָיו
  choice: suas bases
  rationale: Refere-se às peças de fundação que recebiam os elementos verticais. “Bases” é amplo e acessível, enquanto “encaixes” explicita mais a forma funcional.
- source_word: כָל כֵּלָיו
  choice: todos os seus equipamentos
  rationale: כְּלִי é um termo abrangente para objetos, implementos ou equipamentos. Aqui, “equipamentos” evita restringir a referência a pequenos utensílios ou vasos.
- source_word: כֹל עֲבֹדָתוֹ
  choice: todo o trabalho relacionado a ele
  rationale: A expressão resume o trabalho ou serviço associado ao tabernáculo e a seus componentes. A formulação é natural e conserva a amplitude prática de עֲבֹדָה.
theological_decisions: []
