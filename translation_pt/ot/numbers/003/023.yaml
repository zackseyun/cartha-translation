base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/023.yaml
  text: The clans of the Gershonites shall camp behind the tabernacle[a], toward the west.
translation:
  language: pt
  text: Os clãs dos gersonitas acamparão atrás do tabernáculo, para o oeste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “em direção ao mar”, expressão comum para indicar o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: clãs
  rationale: No contexto tribal e censitário de Números, designa subdivisões de parentesco dentro de um grupo levítico maior; “clãs” comunica melhor esse sentido corporativo do que “famílias”.
- source_word: הַגֵּרְשֻׁנִּי
  choice: dos gersonitas
  rationale: O gentílico singular com artigo tem sentido coletivo, referindo-se aos descendentes ou ao grupo ligado a Gérson.
- source_word: אַחֲרֵי
  choice: atrás de
  rationale: A preposição tem aqui sentido espacial, não temporal, e descreve a posição no acampamento.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Neste contexto, refere-se à tenda sagrada do santuário; “tabernáculo” é o termo tradicional e amplamente reconhecido em português.
- source_word: יַחֲנוּ
  choice: acamparão
  rationale: O imperfeito expressa a disposição prescrita do acampamento; o futuro português transmite naturalmente essa determinação contextual.
- source_word: יָמָּה
  choice: na direção do oeste
  rationale: A forma direcional derivada de “mar” é um modo idiomático de indicar o oeste no hebraico bíblico; a tradução explicita a direção sem perder sua nuance.
