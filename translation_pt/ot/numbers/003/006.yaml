  text: הַקְרֵב֙ אֶת מַטֵּ֣ה לֵוִ֔י וְֽ/הַעֲמַדְתָּ֣ אֹת֔/וֹ לִ/פְנֵ֖י אַהֲרֹ֣ן הַ/כֹּהֵ֑ן וְ/שֵׁרְת֖וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: pt
  text: Traga para perto a tribo de Levi e coloque-a diante de Arão, o sacerdote; os levitas o servirão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe prestarão serviço”. O verbo hebraico pode indicar serviço assistencial ou cultual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: Faça ... se aproximar
  rationale: O imperativo hifil de קרב expressa fazer chegar ou trazer para perto. A construção reflexiva causativa é natural em português e conserva a ideia concreta de aproximação.
- source_word: מַטֵּה לֵוִי
  choice: a tribo de Levi
  rationale: Embora מַטֶּה possa significar literalmente “bastão”, neste contexto designa o grupo tribal de Levi.
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: e apresente-a
  rationale: O hifil de עמד significa fazer ficar de pé, colocar ou posicionar. “Apresente-a” comunica de modo natural a colocação formal da tribo diante de Arão.
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: diante de Arão, o sacerdote
  rationale: לִפְנֵי indica estar diante de ou na presença de alguém; a tradução mantém tanto a relação espacial quanto o caráter formal da apresentação.
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: os levitas o servirão
  rationale: שרת denota serviço prestado, muitas vezes de caráter assistencial ou cultual. “Os levitas” explicita naturalmente em português o sujeito plural implícito, enquanto “o” preserva Arão como objeto direto do serviço.
theological_decisions:
- issue: Natureza do serviço levítico prestado a Arão
  choice: Os levitas servirão a Arão em sua função sacerdotal.
  alternative: Os levitas servirão com Arão.
  rationale: O pronome objeto em וְשֵׁרְתוּ אֹתוֹ refere-se mais naturalmente a Arão e indica serviço prestado a ele; não deve ser substituído pela ideia distinta de servir apenas ao lado dele.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição explícita de “os levitas” evita a mudança pouco natural, em português, do coletivo singular “tribo” para um pronome plural, sem alterar o referente do hebraico.
