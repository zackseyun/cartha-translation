base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/030.yaml
  text: And the chief of the ancestral house of the families of the Kohathites was Elizaphan the son of Uzziel[a][b].
translation:
  language: pt
  text: E o chefe[a] da casa paterna[b] das famílias dos coatitas era Elisafã, filho de Uziel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder” ou “príncipe”, em vez de “chefe” (hebraico נָשִׂיא).
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “casa do pai”; expressão que designa uma unidade familiar ou clânica ligada à linhagem paterna.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: O chefe
  rationale: נָשִׂיא designa um líder, chefe ou príncipe. Neste contexto de organização levítica, “chefe” comunica autoridade reconhecida sem sugerir monarquia. O ו inicial funciona como conexão discursiva; em português, pode ficar implícito para manter a naturalidade da enumeração.
- source_word: בֵית אָב
  choice: casa paterna
  rationale: A expressão hebraica literalmente significa “casa do pai” e designa uma unidade de parentesco patrilinear. “Casa paterna” preserva a imagem e soa digna e compreensível em português.
- source_word: לְמִשְׁפְּחֹת
  choice: das famílias
  rationale: מִשְׁפָּחוֹת refere-se a agrupamentos familiares ou clãs. “Famílias” mantém a distinção entre esses grupos e a unidade maior chamada “casa paterna”.
- source_word: הַקְּהָתִי
  choice: dos coatitas
  rationale: O gentílico singular com artigo tem sentido coletivo, indicando os descendentes de Coate; “coatitas” é a forma portuguesa tradicional e clara.
- source_word: אֶלִיצָפָן
  choice: Elisafã
  rationale: Nome próprio transliterado segundo a forma portuguesa bíblica corrente.
- source_word: בֶּן עֻזִּיאֵל
  choice: filho de Uziel
  rationale: Fórmula genealógica direta e natural em português.
