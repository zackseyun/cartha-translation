  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: pt
  text: 'Estes foram os filhos de Levi: Gérson, Coate e Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: foram
  rationale: O wayyiqtol de היה funciona aqui como cópula no passado, introduzindo uma lista, e não como mudança de estado.
- source_word: אֵלֶּה
  choice: Estes
  rationale: O demonstrativo aponta para as pessoas nomeadas em seguida e, com וַיִּהְיוּ, forma naturalmente «Estes foram».
- source_word: בְנֵי לֵוִי
  choice: os filhos de Levi
  rationale: Neste registro genealógico, os referidos são os três filhos diretos de Levi; por isso, «filhos» é mais preciso que «descendentes».
- source_word: בִּשְׁמֹתָם
  choice: pelos seus nomes
  rationale: Preserva a formulação hebraica «por/segundo os seus nomes» e continua compreensível em português.
- source_word: גֵּרְשׁוֹן
  choice: Gérson
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: קְהָת
  choice: Coate
  rationale: Forma tradicional e amplamente reconhecida do nome em traduções bíblicas portuguesas.
- source_word: מְרָרִי
  choice: Merari
  rationale: Transliteração tradicional e corrente do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do hebraico. A expressão «pelos seus nomes» mantém deliberadamente o caráter formular do original; não se acrescentou nota porque a alternativa «segundo os seus nomes» não altera substancialmente o sentido.
