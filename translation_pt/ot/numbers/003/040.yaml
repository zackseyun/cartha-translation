base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: pt
  text: 'Então Yahweh disse a Moisés: “Conte todo primogênito do sexo masculino entre os filhos de Israel, de um mês de idade para cima, e registre cada um pelo nome.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e levante o número dos nomes deles”; isto é, faça uma contagem nominal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH de modo reconhecível e distingue-o de títulos como “Senhor”.
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz avançar a narrativa; “Então” comunica naturalmente a sequência em português.
- source_word: פְּקֹד
  choice: Conte
  rationale: Neste contexto censitário, o imperativo manda enumerar os primogênitos; “Conte” é claro e corrente.
- source_word: כָּל בְּכֹר זָכָר
  choice: todo primogênito do sexo masculino
  rationale: Preserva tanto a condição de primogênito quanto a especificação explícita de sexo, sem sugerir necessariamente apenas “filho”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a expressão tradicional e formalmente próxima do hebraico, enquanto “entre” exprime adequadamente o grupo no qual se fará a contagem.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: de um mês de idade para cima
  rationale: Expressa com naturalidade o limite etário inferior indicado pelo idioma hebraico.
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: e registre cada um pelo nome
  rationale: Traduz o sentido idiomático da expressão, isto é, realizar ou registrar uma contagem nominal, em vez de reproduzir literalmente “levante o número dos nomes deles”.
