  yaml_path: translation/ot/numbers/003/046.yaml
  text: And for the redemption price of the 273 who exceed the Levites from among the firstborn of the sons of Israel,[a]
translation:
  language: pt
  text: E, como resgate pelos 273 que, dentre os primogênitos dos filhos de Israel, excedem o número dos levitas,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os 273 resgatados»; a forma hebraica pode referir-se mais literalmente às pessoas resgatadas, mas o contexto imediato trata do pagamento exigido pelos primogênitos excedentes (vv. 47–48).
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּיֵי
  choice: como resgate pelos
  rationale: O termo, derivado de פדה, admite referência aos resgatados, mas o contexto imediato (vv. 47–48) trata do valor a ser pago pelos primogênitos excedentes. «Resgate» comunica naturalmente essa obrigação sem antecipar no próprio versículo o valor especificado a seguir.
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
  rationale: A expressão numérica aditiva hebraica corresponde exatamente a 273; algarismos são claros e naturais em português moderno.
- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: que excedem o número dos levitas
  rationale: O particípio com עַל indica os que ultrapassam numericamente os levitas disponíveis como substitutos. A explicitação de «o número» torna a relação comparativa inequívoca e idiomática.
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: entre os primogênitos dos filhos de Israel
  rationale: «Entre» expressa a força partitiva de מִן, enquanto «filhos de Israel» preserva a formulação pactual e a referência masculina específica do hebraico.
