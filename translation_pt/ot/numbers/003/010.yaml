base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: pt
  text: Você designará Arão e seus filhos, e eles guardarão o seu sacerdócio; mas a pessoa não autorizada que se aproximar será morta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּפְקֹד
  choice: você designará
  rationale: Neste contexto, פקד indica confiar a Arão e seus filhos uma função, não contá-los ou recenseá-los. “Designará” expressa de modo natural a nomeação para o ofício.
- source_word: וְשָׁמְרוּ
  choice: eles guardarão
  rationale: שׁמר abrange guardar, observar e proteger. Aqui inclui o exercício responsável do sacerdócio e a proteção de seus limites.
- source_word: כְּהֻנָּתָם
  choice: o seu sacerdócio
  rationale: O substantivo se refere ao ofício e à função sacerdotal de Arão e seus filhos. “O seu sacerdócio” mantém a formulação compacta do hebraico.
- source_word: הַזָּר
  choice: a pessoa de fora
  rationale: זָר designa aqui alguém situado fora da esfera sacerdotal autorizada, não necessariamente um estrangeiro étnico. A expressão preserva a imagem de exterioridade sem sugerir nacionalidade.
- source_word: הַקָּרֵב
  choice: que se aproximar
  rationale: O particípio de קרב descreve a aproximação à esfera sagrada ou à função reservada. “Que se aproximar” mantém o sentido concreto e a concisão.
- source_word: יוּמָת
  choice: será morta
  rationale: A forma Hofal de מות é passiva e causativa, indicando aplicação da morte como pena, e não apenas que a pessoa morrerá.
theological_decisions:
- issue: Limite do acesso ao serviço sacerdotal
  choice: O texto autoriza Arão e seus filhos a exercer e guardar o sacerdócio e impõe a morte à pessoa de fora que se aproxima.
  alternative: A advertência pode ser entendida mais amplamente como exclusão de todo não sacerdote da aproximação sagrada, sem que este versículo, isoladamente, defina os limites rituais exatos.
  rationale: A tradução conserva tanto a exclusividade da incumbência sacerdotal quanto a severidade da advertência, sem acrescentar pormenores rituais ou interpretações denominacionais ausentes do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. “A pessoa de fora” evita o possível sentido étnico de “estrangeiro”, enquanto a nota explicita a restrição sacerdotal. O futuro preserva o caráter prescritivo e jurídico do versículo.
