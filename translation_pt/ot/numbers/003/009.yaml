  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: pt
  text: Você entregará os levitas a Arão e a seus filhos; eles lhe são inteiramente dados[a] dentre os filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete “dados” para dar ênfase: literalmente, “dados, dados”, isto é, “certamente dados”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou “dentre os israelitas”. Hebraico: “dentre os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Você entregará
  rationale: O perfeito qal com conjunção, neste contexto instrutivo, expressa uma ordem. “Entregará” preserva a força diretiva e se harmoniza com a ideia de destinação presente no versículo.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: É a designação tradicional e natural, em português, dos membros da tribo de Levi separados para o serviço do santuário.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: a Arão e a seus filhos
  rationale: A preposição לְ indica o destinatário da entrega; a formulação conserva com clareza a estrutura do hebraico.
- source_word: נְתוּנִם נְתוּנִם
  choice: inteiramente dados
  rationale: A repetição do particípio passivo intensifica a afirmação. “Inteiramente dados” comunica essa ênfase de modo natural, enquanto a nota preserva a forma literal repetida.
- source_word: הֵמָּה
  choice: eles ... são
  rationale: O pronome independente introduz ênfase no sujeito. Em português, a presença explícita de “eles”, junto da expressão enfática seguinte, transmite essa força sem uma construção artificial.
- source_word: לוֹ
  choice: lhe
  rationale: O pronome retoma Arão e mantém de forma concisa o sentido de que os levitas são destinados a ele.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dentre os filhos de Israel
  rationale: A expressão indica origem ou seleção no meio do conjunto de Israel. “Dentre” torna clara essa relação, e “filhos de Israel” preserva a expressão familiar e pactual do hebraico.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A forma hebraica é literalmente “filhos de Israel”. A tradução mantém a expressão familiar tradicional e sua possível relevância pactual, sem excluir a alternativa coletiva mais corrente, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você entregará” conserva o tom de ordem dirigida a Moisés; “lhe” evita repetição pesada; e as notas registram tanto a ênfase formal do hebraico quanto a alternativa coletiva corrente.
