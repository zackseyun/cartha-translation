  text: וְ/קַלְעֵ֣י הֶֽ/חָצֵ֗ר וְ/אֶת מָסַךְ֙ פֶּ֣תַח הֶֽ/חָצֵ֔ר אֲשֶׁ֧ר עַל הַ/מִּשְׁכָּ֛ן וְ/עַל הַ/מִּזְבֵּ֖חַ סָבִ֑יב וְ/אֵת֙ מֵֽיתָרָ֔י/ו לְ/כֹ֖ל עֲבֹדָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: pt
  text: e as cortinas do pátio[a], a cortina da entrada do pátio, que fica ao redor do tabernáculo e do altar, e suas cordas[b], para todo o seu serviço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os panos do pátio”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus cordões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: cortinas
  rationale: Designa os panos que formavam o fechamento do pátio; “cortinas” é claro e natural em português, sem sugerir uma estrutura rígida.
- source_word: חָצֵר
  choice: pátio
  rationale: Refere-se à área cercada em torno do santuário; “pátio” é corrente e amplamente compreensível em português.
- source_word: מָסַךְ
  choice: cortina
  rationale: No contexto do tabernáculo, indica uma peça têxtil que fechava uma entrada. “Cortina” é mais acessível ao leitor moderno que “reposteiro”, embora não reproduza plenamente a distinção lexical em relação a קַלְעֵי.
- source_word: פֶּתַח
  choice: entrada
  rationale: Expressa naturalmente a abertura de acesso e evita a ideia de um portão rígido.
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: que fica ao redor do tabernáculo e do altar
  rationale: Comunica de modo idiomático a disposição espacial do pátio em torno de ambos, sem repetir desnecessariamente “ao redor”.
- source_word: מִשְׁכָּן
  choice: tabernáculo
  rationale: É o termo bíblico português estabelecido para o santuário móvel de Israel.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Equivalente padrão, claro e preciso para o lugar dos sacrifícios.
- source_word: מֵיתָרָיו
  choice: suas cordas
  rationale: Refere-se às cordas usadas na estrutura; o possessivo mantém a referência compacta do hebraico.
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: para todo o seu serviço
  rationale: Preserva tanto o sentido funcional e cultual de עֲבֹדָה quanto a referência pronominal concisa, sem resolver além do texto seu antecedente.
theological_decisions: []
