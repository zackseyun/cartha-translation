base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: pt
  text: 'Quanto a Merari: o clã dos malitas e o clã dos musitas; esses são os clãs de Merari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: Quanto a Merari
  rationale: O לְ introduz Merari como o grupo cuja subdivisão será enumerada. “Quanto a” funciona naturalmente como cabeçalho classificatório em português.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto genealógico e censitário, מִשְׁפָּחָה designa um grupo de parentesco abaixo do nível tribal; “clã” é mais preciso que “família”.
- source_word: הַמַּחְלִי
  choice: malitas
  rationale: Forma gentílica que designa os descendentes ou o grupo ligado a Mali. A forma portuguesa “malitas” se encaixa naturalmente após “clã dos”.
- source_word: וּמִשְׁפַּחַת הַמּוּשִׁי
  choice: e o clã dos musitas
  rationale: Mantém a coordenação e a repetição formal do hebraico; “musitas” representa a designação gentílica ligada a Musi.
- source_word: אֵלֶּה הֵם
  choice: esses são
  rationale: Expressa de modo idiomático a identificação enfática formada pelo demonstrativo seguido do pronome.
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: os clãs de Merari
  rationale: Resume os dois grupos mencionados, conservando “clãs” para coerência terminológica e a relação genealógica com Merari.
