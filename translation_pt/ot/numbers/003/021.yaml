base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: pt
  text: A Gérson pertenciam o clã dos libnitas e o clã dos simeítas; esses são os clãs dos gersonitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: A Gérson pertenciam
  rationale: O לְ marca aqui relação ou pertencimento na enumeração genealógica. A formulação portuguesa explicita essa relação de modo natural.
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: o clã / os clãs
  rationale: No contexto censitário e genealógico, מִשְׁפָּחָה designa uma subdivisão de parentesco menor que a tribo; «clã» evita o sentido moderno mais restrito de «família».
- source_word: הַלִּבְנִי
  choice: dos libnitas
  rationale: A forma gentílica identifica o grupo descendente de Libni; o plural gentílico é conciso e preserva o sentido genealógico.
- source_word: הַשִּׁמְעִי
  choice: dos simeítas
  rationale: A forma gentílica designa os descendentes de Simei, em paralelismo com os libnitas.
- source_word: אֵלֶּה הֵם
  choice: esses são
  rationale: Reproduz a fórmula hebraica de identificação em presente e retoma naturalmente os dois clãs já mencionados.
- source_word: הַגֵּרְשֻׁנִּי
  choice: dos gersonitas
  rationale: O gentílico identifica o ramo levítico descendente de Gérson; a forma portuguesa tradicional é clara e reconhecível.
