lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com o Piel imperfeito de דבר dá prosseguimento à narrativa na fórmula habitual de introdução do discurso divino. “Falou” reflete o verbo com naturalidade e dignidade em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “a” é a forma natural na construção portuguesa “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz o conteúdo do discurso que vem no versículo seguinte; “dizendo” preserva a fórmula hebraica de modo claro e corrente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo silenciosamente por um título; a nota registra uma forma alternativa tradicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e estrutura próxima da fórmula narrativa hebraica. Os dois-pontos sinalizam que o conteúdo da fala começa no versículo seguinte.
