  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: pt
  text: E você dará a prata a Arão e a seus filhos como preço de resgate pelos que, entre eles, excedem o número.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “pelos resgatados dos que excedem entre eles”. O hebraico condensa a ideia em uma cadeia de construtos; o texto principal a desdobra para maior clareza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: E você dará
  rationale: O qatal de Qal, segunda pessoa masculina singular, com conjunção, tem valor diretivo/futuro neste contexto de instrução e mantém a sequência do versículo anterior.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כֶּסֶף designa literalmente a prata e, por extensão, dinheiro. Aqui se trata de pagamento, mas “a prata” preserva a forma concreta do hebraico e é compreensível em português.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: a Arão e aos seus filhos
  rationale: A tradução representa a preposição repetida no hebraico e conserva “filhos”, referência contextual aos descendentes sacerdotais masculinos de Arão.
- source_word: פְּדוּיֵי
  choice: como preço de resgate pelos
  rationale: A forma construta plural derivada de פדה pode apontar para os resgatados ou para o resgate ligado a eles. Como “a prata” é o objeto entregue, a expressão explicita naturalmente que ela constitui o preço do resgate, sem eliminar a formulação mais estrita, registrada em nota.
- source_word: הָעֹדְפִים
  choice: os que excedem o número
  rationale: O particípio de עודף descreve os que ultrapassam a quantidade correspondente, isto é, os primogênitos israelitas que excedem o número dos levitas. “Excedem o número” comunica a lógica da contagem sem inserir um referente ausente do versículo.
- source_word: בָּהֶם
  choice: entre eles
  rationale: A preposição ב com o pronome é relacional aqui e indica o excedente existente dentro do grupo contado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “você dará” conserva o destinatário singular da ordem; “preço de resgate” esclarece a relação sintática comprimida sem apagar a alternativa formal, preservada na nota.
