  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: pt
  text: E o chefe da casa paterna dos gersonitas era Eliasafe, filho de Lael.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “casa de pai”, termo israelita de parentesco que designa uma família ancestral ou unidade de clã.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: E o chefe
  rationale: נָשִׂיא designa aqui o dirigente oficial do grupo, sem conotação necessária de realeza; o ו inicial mantém a continuidade da lista.
- source_word: בֵית אָב
  choice: da casa paterna
  rationale: A expressão é um termo israelita de parentesco para uma unidade familiar ou clânica organizada pela linhagem paterna. “Casa paterna” preserva a imagem hebraica e é compreensível em português.
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: dos gersonitas
  rationale: A preposição ל marca a relação com o grupo descendente de Gérson; o plural coletivo é natural em português.
- source_word: אֶלְיָסָף
  choice: Eliasafe
  rationale: Transliteração portuguesa tradicional e transparente do nome pessoal hebraico.
- source_word: בֶּן
  choice: filho de
  rationale: Equivalente genealógico direto e corrente em português.
- source_word: לָאֵל
  choice: Lael
  rationale: Transliteração corrente do nome pessoal hebraico.
