id: NUM.3.12
reference: Numbers 3:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: pt
  text: E eu, eis que tomei os levitas do meio dos filhos de Israel[a], em lugar de todo primogênito que abre o ventre entre os filhos de Israel; e os levitas serão meus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. A expressão hebraica significa literalmente “os filhos de Israel” e é formulaica.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: E eu
  rationale: Preserva a conjunção e o pronome explícito, que dá ênfase à mudança para a declaração pessoal de Deus.
- source_word: הִנֵּה
  choice: eis que
  rationale: Mantém a força dêitica e enfática da partícula hebraica em linguagem solene, porém compreensível.
- source_word: לָקַחְתִּי
  choice: tomei
  rationale: Traduz diretamente o perfeito hebraico como ação divina já realizada, cujos efeitos continuam válidos no contexto.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: É a designação tradicional e amplamente reconhecida em português.
- source_word: מִתּוֹךְ
  choice: do meio de
  rationale: Expressa de modo natural a escolha de um grupo dentre um conjunto maior.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão hebraica masculina e formulaica, sem ocultar sua forma, enquanto a alternativa idiomática é registrada em nota.
- source_word: תַּחַת
  choice: em lugar de
  rationale: Comunica claramente a ideia de substituição neste contexto cultual e jurídico.
- source_word: כָּל בְּכוֹר
  choice: todo primogênito
  rationale: Reproduz o sentido distributivo da expressão hebraica de maneira corrente em português.
- source_word: פֶּטֶר רֶחֶם
  choice: que abre o ventre
  rationale: Preserva a expressão jurídica e cultual hebraica referente ao primeiro a sair do ventre materno.
- source_word: וְהָיוּ לִי
  choice: e os levitas serão meus
  rationale: Expressa de forma direta tanto o resultado futuro quanto a reivindicação divina de posse e consagração.
theological_decisions:
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução mantém a formulação masculina e pactual do hebraico, sem negar que a expressão pode designar coletivamente os israelitas.
- issue: Relação dos levitas com Deus em וְהָיוּ לִי
  choice: os levitas serão meus
  alternative: os levitas pertencerão a mim
  rationale: A formulação preserva a reivindicação divina de posse e consagração sem acrescentar categorias teológicas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Eis que” conserva deliberadamente a solenidade e a ênfase do hebraico; “abre o ventre” mantém a linguagem jurídica e cultual da passagem.
