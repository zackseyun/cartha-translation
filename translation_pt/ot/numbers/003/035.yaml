  text: וּ/נְשִׂ֤יא בֵֽית אָב֙ לְ/מִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַ/מִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: pt
  text: E o chefe[a] da casa paterna[b] dos clãs de Merari era Zuriel, filho de Abiail. Eles deveriam acampar no lado norte do tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “líder”; o termo hebraico pode designar um líder reconhecido ou um príncipe.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “casa de pai”, expressão de parentesco que indica uma unidade familiar ou clânica de linhagem paterna.
    reason: cultural_note
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: O chefe
  rationale: נָשִׂיא designa um líder reconhecido. “Chefe” se ajusta ao contexto de organização dos levitas sem sugerir necessariamente realeza; o ו inicial não precisa ser expresso, pois o português inicia naturalmente a nova frase sem “e”.
- source_word: בֵית אָב
  choice: casa paterna
  rationale: A expressão hebraica, literalmente “casa de pai”, é um termo de parentesco referente a uma unidade familiar patrilinear. “Casa paterna” conserva essa estrutura cultural em português digno e inteligível.
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: dos clãs de Merari
  rationale: מִשְׁפָּחוֹת indica aqui as subdivisões de parentesco do grupo levítico de Merari; “clãs” é mais preciso que “famílias” neste contexto organizacional.
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: Zuriel, filho de Abiail
  rationale: Os nomes são transliterados em formas correntes em português, e בֶּן é vertido pela fórmula genealógica natural “filho de”.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: ao lado do tabernáculo, ao norte
  rationale: יֶרֶךְ significa “lado” ou “flanco”, e צָפֹנָה especifica a localização setentrional. A formulação mantém ambos os elementos e soa natural em português.
- source_word: יַחֲנוּ
  choice: Eles acampariam
  rationale: O imperfeito descreve a disposição prescrita do acampamento. “Acampariam” comunica, no fluxo narrativo, a posição que lhes cabia ocupar.
theological_decisions: []
