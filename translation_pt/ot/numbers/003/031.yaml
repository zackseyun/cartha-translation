base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: pt
  text: E a responsabilidade deles[a] abrangia a arca, a mesa, o candelabro, os altares, os utensílios do santuário[b] com os quais prestavam serviço, a cortina da entrada[c] e todo o serviço relacionado a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O encargo deles incluía” ou “O dever deles abrangia”.'
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “os objetos sagrados” ou “os utensílios do lugar santo”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, a cortina ou o reposteiro de uma entrada, não o véu interior.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: E a responsabilidade deles abrangia
  rationale: No contexto das funções levíticas, מִשְׁמֶרֶת indica encargo, responsabilidade ou dever atribuído. “Abrangia” introduz naturalmente, em português, a lista dos objetos confiados a eles.
- source_word: הָאָרֹן
  choice: a arca
  rationale: O hebraico traz apenas “a arca”; a tradução mantém essa forma concisa sem acrescentar “da aliança” ou “do testemunho”.
- source_word: הַשֻּׁלְחָן
  choice: a mesa
  rationale: Tradução direta do móvel do santuário, sem explicitação ausente no texto hebraico.
- source_word: הַמְּנֹרָה
  choice: o candelabro
  rationale: מְנוֹרָה designa o suporte cultual para lâmpadas. “Candelabro” é a designação bíblica corrente e inteligível em português, embora o objeto sustentasse lâmpadas, não velas.
- source_word: הַמִּזְבְּחֹת
  choice: os altares
  rationale: A forma hebraica é plural e se refere aos altares sob a responsabilidade dos coatitas.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: os utensílios do santuário
  rationale: כְּלִים são objetos, utensílios ou recipientes; הַקֹּדֶשׁ, neste contexto, aponta para o âmbito sagrado do santuário. A formulação é clara e evita restringir o termo a recipientes.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: com os quais realizavam o serviço sagrado
  rationale: A oração indica que esses utensílios eram os instrumentos do serviço cultual. A expressão comunica o sentido especializado de שׁרת sem recorrer a linguagem eclesiástica posterior.
- source_word: הַמָּסָךְ
  choice: a cortina da entrada
  rationale: מָסָךְ designa aqui a cortina ou reposteiro de uma entrada, distinta do véu interior (פָּרֹכֶת). A explicitação “da entrada” evita confusão entre os dois elementos.
- source_word: וְכָל עֲבֹדָתוֹ
  choice: e todo o serviço relacionado a ela
  rationale: עֲבֹדָה, no contexto cultual, é “serviço”. O sufixo masculino singular hebraico tem referente não inteiramente explícito; a redação portuguesa conserva uma referência ampla, sem definir tarefas não mencionadas.
theological_decisions:
- issue: Terminologia do serviço cultual no santuário
  choice: “realizavam o serviço sagrado” e “serviço”
  alternative: “serviam” e “trabalho”
  rationale: A escolha preserva o caráter cultual do vocabulário sacerdotal sem importar categorias eclesiásticas posteriores.
- issue: Identificação da cortina
  choice: “cortina da entrada”
  alternative: “véu” ou apenas “cortina”
  rationale: O termo hebraico מָסָךְ não é o termo técnico usado para o véu interior. A tradução distingue os dois sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário cultual compreensível. A estrutura em lista acompanha de perto o hebraico, enquanto “abrangia” torna natural a relação entre a responsabilidade dos coatitas e os objetos enumerados.
