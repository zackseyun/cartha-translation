  yaml_path: translation/ot/numbers/003/034.yaml
  text: And those counted among them[a], by the number of every male from a month old and upward, were six thousand two hundred.
translation:
  language: pt
  text: Os que foram recenseados dentre eles[a], segundo o número de todos os indivíduos do sexo masculino de um mês de idade para cima, eram seis mil e duzentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus recenseados” ou “os que foram registrados dentre eles”. O hebraico se refere às pessoas deste clã incluídas no recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקֻדֵיהֶם
  choice: Os recenseados entre eles
  rationale: O substantivo derivado de פקד, com sufixo de terceira pessoa masculina plural, designa os integrantes desse grupo registrados no censo. “Os recenseados entre eles” conserva a referência às pessoas contadas e soa natural em português.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: contando todos os homens
  rationale: A expressão introduz o critério da enumeração e abrange cada pessoa do sexo masculino. Nesta fórmula censitária, “contando todos os homens” comunica naturalmente a função do hebraico sem repetir de modo pesado a ideia de número.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: de um mês de idade para cima
  rationale: Preserva o limite mínimo de idade e sua extensão ascendente em linguagem corrente e clara.
- source_word: שֵׁשֶׁת אֲלָפִים וּמָאתָיִם
  choice: seis mil e duzentos
  rationale: Reproduz por extenso o total cardinal de 6.200, conforme o estilo de texto bíblico corrido.
