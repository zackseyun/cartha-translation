base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: pt
  text: 'E, quanto a Coate: o clã dos anramitas, o clã dos izaritas, o clã dos hebronitas e o clã dos uzielitas. Esses são os clãs dos coatitas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: Quanto a Coate
  rationale: A conjunção com a preposição introduz o próximo agrupamento genealógico. “Quanto a Coate” expressa com naturalidade em português essa função classificatória.
- source_word: מִשְׁפַּחַת
  choice: o clã dos
  rationale: No contexto censitário e genealógico, מִשְׁפָּחָה designa uma subdivisão de parentesco dentro de um grupo maior; “clã” comunica esse sentido administrativo-genealógico.
- source_word: הַֽ/עַמְרָמִי
  choice: anramitas
  rationale: O gentílico designa os descendentes de Anrão; “anramitas” segue a forma tradicional portuguesa derivada desse nome.
- source_word: הַ/יִּצְהָרִי
  choice: isaritas
  rationale: O gentílico designa os descendentes de Isar; “isaritas” mantém claramente a relação com o nome pessoal em forma corrente portuguesa.
- source_word: הַֽ/חֶבְרֹנִי
  choice: hebronitas
  rationale: O gentílico designa os descendentes de Hebrom; “hebronitas” é uma forma portuguesa clara e convencional.
- source_word: הָֽ/עָזִּיאֵלִי
  choice: uzielitas
  rationale: O gentílico designa os descendentes de Uziel; “uzielitas” é a forma plural portuguesa natural.
- source_word: אֵלֶּה הֵם
  choice: Esses são
  rationale: A combinação de demonstrativo e pronome introduz uma identificação; o presente é natural em português nesse tipo de classificação.
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: os clãs dos coatitas
  rationale: O plural em construção com o gentílico resume os subgrupos mencionados como pertencentes aos descendentes de Coate, mantendo “clãs” de modo coerente.
