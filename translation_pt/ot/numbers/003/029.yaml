  yaml_path: translation/ot/numbers/003/029.yaml
  text: The clans of the sons of Kohath shall camp on the south side of the tabernacle[a].
translation:
  language: pt
  text: Os clãs dos filhos de Coate acamparão no lado sul do tabernáculo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos descendentes de Coate” ou “dos coatitas”. O hebraico diz literalmente “dos filhos de Coate”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְחֹת
  choice: clãs
  rationale: No contexto da organização tribal e do acampamento, designa subdivisões de parentesco, não apenas famílias nucleares. “Clãs” comunica naturalmente essa unidade social.
- source_word: בְּנֵי קְהָת
  choice: filhos de Coate
  rationale: Preserva a expressão hebraica literal de filiação e linhagem; “descendentes de Coate” e “coatitas” são alternativas possíveis.
- source_word: יַחֲנוּ
  choice: acamparão
  rationale: O imperfeito expressa aqui a disposição prescrita do acampamento. O futuro em português transmite a instrução de modo natural e digno.
- source_word: עַל יֶרֶךְ
  choice: no lado
  rationale: A combinação indica localização junto a um dos lados do tabernáculo; “no lado” é clara e idiomática em português.
- source_word: הַמִּשְׁכָּן
  choice: tabernáculo
  rationale: Em Números, refere-se à tenda-santuário sagrada. “Tabernáculo” é o termo bíblico consagrado e reconhecível em português.
- source_word: תֵּימָנָה
  choice: sul
  rationale: A forma direcional identifica a localização meridional; como “lado” já está expresso, “lado sul” é conciso e natural.
