source:
  edition: WLC
  text: וּ/מִשְׁמֶ֤רֶת בְּנֵֽי גֵרְשׁוֹן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד הַ/מִּשְׁכָּ֖ן וְ/הָ/אֹ֑הֶל מִכְסֵ֕/הוּ וּ/מָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/025.yaml
  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: pt
  text: A responsabilidade[a] dos filhos de Gérson na tenda do encontro abrangia o tabernáculo, a tenda, sua cobertura e a cortina[b] da entrada da tenda do encontro,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encargo” ou “dever”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “reposteiro”, isto é, a peça suspensa diante da entrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: responsabilidade
  rationale: No contexto da atribuição levítica, designa aquilo que os gersonitas deviam guardar e cuidar. “Responsabilidade” é natural em português e introduz com clareza a lista de objetos confiados a eles.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: os filhos de Gérson
  rationale: Preserva a expressão familiar do hebraico e continua clara e natural em português.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: A preposição indica aqui o âmbito ou local do serviço; “tenda do encontro” traduz de modo transparente a expressão hebraica.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: “Tabernáculo” é o termo técnico consagrado para o santuário portátil e mantém a distinção do item seguinte, “a tenda”.
- source_word: וְהָאֹהֶל
  choice: a tenda
  rationale: Mantém este componente como item distinto na enumeração, sem acrescentar uma explicação ausente no hebraico.
- source_word: מִכְסֵהוּ
  choice: sua cobertura
  rationale: Reproduz concisamente o substantivo e o sufixo possessivo, que remete à tenda ou ao conjunto do tabernáculo.
- source_word: מָסַךְ
  choice: a cortina
  rationale: O termo designa uma peça suspensa que fecha ou resguarda uma entrada. “Cortina” é mais natural e imediatamente compreensível em português moderno.
- source_word: פֶּתַח
  choice: da entrada
  rationale: Expressa de modo natural a relação da cortina com a abertura da tenda.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: A repetição da mesma tradução conserva a repetição deliberada da expressão hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O verbo “abrangia” foi suprido para tornar natural a oração nominal hebraica e indicar que a lista especifica a responsabilidade dos filhos de Gérson. A vírgula final foi mantida porque o período continua no versículo seguinte.
