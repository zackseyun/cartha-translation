  text: and the pillars of the surrounding courtyard[a], and their bases, and their pegs[b], and their cords.
translation:
  language: pt
  text: e as colunas do pátio ao redor, e suas bases, suas estacas e suas cordas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: colunas
  rationale: Designa os suportes verticais do cercado do pátio. “Colunas” é claro e natural em português para a estrutura do santuário.
- source_word: הֶחָצֵר
  choice: pátio
  rationale: Refere-se à área cercada ao redor do tabernáculo; “pátio” é corrente e acessível em português moderno.
- source_word: סָבִיב
  choice: ao redor
  rationale: Preserva o sentido espacial de algo que circunda o tabernáculo e soa natural ligado a “pátio”.
- source_word: אַדְנֵיהֶם
  choice: suas bases
  rationale: No contexto do tabernáculo, o termo indica as bases ou encaixes que sustentavam elementos estruturais. “Bases” comunica o sentido com clareza sem tecnicismo desnecessário.
- source_word: יְתֵדֹתָם
  choice: suas estacas
  rationale: Indica as peças cravadas no solo para firmar a estrutura; “estacas” é mais claro em português do que “pregos” ou “pinos” neste contexto.
- source_word: מֵיתְרֵיהֶם
  choice: suas cordas
  rationale: Designa as cordas usadas para prender e estabilizar a estrutura, em associação natural com as estacas.
- source_word: וְ
  choice: e / com
  rationale: O primeiro וְ mantém a continuação da lista com “e”; diante dos itens dependentes, “com” expressa naturalmente a relação associativa sem alterar o conteúdo enumerado.
