base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: pt
  text: Moisés tomou o dinheiro do resgate daqueles que excediam o número dos que foram resgatados pelos levitas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o dinheiro da redenção”. A expressão hebraica designa o pagamento feito para resgatar alguém.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, daqueles israelitas cujo número ultrapassava o número dos que eram representados pelos levitas na contagem para o resgate.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: recebeu
  rationale: Embora o verbo לקח tenha o sentido básico de “tomar”, neste contexto de arrecadação de dinheiro “recebeu” expressa com naturalidade o ato de Moisés sem alterar seu sentido.
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: o dinheiro do resgate
  rationale: A expressão designa o pagamento exigido para o resgate. “Dinheiro do resgate” é claro e natural em português; “prata do resgate” seria mais literal, mas poderia sugerir desnecessariamente apenas o metal.
- source_word: מֵאֵת
  choice: daqueles
  rationale: A preposição indica a fonte de quem Moisés recebeu o dinheiro; a contração portuguesa comunica isso sem reproduzir uma construção hebraica artificial.
- source_word: הָעֹדְפִים
  choice: aqueles que excediam o número
  rationale: O particípio indica as pessoas que constituíam o excedente numérico. A formulação mantém a referência pessoal e explicita apenas a comparação já marcada no hebraico.
- source_word: עַל
  choice: excediam o número de
  rationale: Neste contexto, עַל introduz o termo de comparação numérica; a locução portuguesa é idiomática e evita o pouco natural “estavam em excesso sobre”.
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: os resgatados pelos levitas
  rationale: O particípio passivo em estado construto refere-se aos que eram considerados resgatados mediante a substituição dos levitas. “Pelos levitas” comunica o sentido contextual, embora a relação construta hebraica seja formalmente mais ampla.
theological_decisions:
- issue: Natureza da relação entre os levitas e os resgatados em פְּדוּיֵי הַלְוִיִּם
  choice: resgatados pelos levitas
  alternative: os resgatados dos levitas
  rationale: A tradução escolhida torna compreensível a substituição censitária descrita no contexto, sem desenvolver uma doutrina além do texto. A nota esclarece que se trata dos israelitas contabilizados em correspondência com os levitas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Resgate” preserva o sentido jurídico-cultual; “excediam o número” evita uma formulação excessivamente literal e obscura.
