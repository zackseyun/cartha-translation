  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: pt
  text: 'E os filhos de Coate, segundo os seus clãs: Anrão, Isar, Hebrom e Uziel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: E os filhos de
  rationale: בְּנֵי é o plural construto de “filhos de”. Embora em genealogias possa também designar descendentes, aqui introduz os quatro nomes que dão origem aos clãs coatitas; “filhos de” preserva a forma hebraica. O וּ inicial mantém a continuidade da lista com “E”.
- source_word: קְהָת
  choice: Coate
  rationale: Nome próprio vertido segundo a forma tradicional e amplamente reconhecida em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa uma unidade familiar ou clânica dentro da organização tribal. “Clãs” evita a conotação excessivamente doméstica de “famílias”, e “segundo” representa naturalmente a preposição לְ neste cabeçalho classificatório.
- source_word: עַמְרָם
  choice: Anrão
  rationale: Nome próprio apresentado em sua forma tradicional portuguesa.
- source_word: וְיִצְהָר
  choice: Isar
  rationale: Nome próprio apresentado em forma portuguesa; a conjunção é acomodada pela pontuação normal da enumeração.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Nome próprio em forma tradicional portuguesa. Embora a mesma forma hebraica designe também um lugar, neste contexto trata-se de uma pessoa.
- source_word: וְעֻזִּיאֵל
  choice: e Uziel
  rationale: Nome próprio em forma tradicional portuguesa, com a conjunção final expressa conforme o padrão natural de enumeração.
