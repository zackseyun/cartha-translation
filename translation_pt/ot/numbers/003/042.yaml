  text: וַ/יִּפְקֹ֣ד מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ אֶֽת כָּל בְּכֹ֖ר בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: pt
  text: Assim, Moisés contou todos os primogênitos entre os filhos de Israel[a], conforme Yahweh lhe havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os filhos de Israel”; também pode ser traduzido como “os israelitas” ou “os descendentes de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: contou
  rationale: No contexto do recenseamento, פקד indica contar ou registrar pessoas. “Contou” é claro, natural e fiel.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa que a ação de Moisés correspondeu à ordem divina.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa claro, em português natural, que a ordem precedeu a contagem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֹתוֹ
  choice: lhe
  rationale: O pronome retoma Moisés como destinatário da ordem; em português, “lhe havia ordenado” é natural.
- source_word: אֶת כָּל בְּכֹר
  choice: todos os primogênitos
  rationale: Preserva a totalidade expressa por כָּל sem acrescentar “homens” ou “do sexo masculino”, termos não explícitos neste versículo.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a expressão hebraica de parentesco e traduz a preposição בְּ adequadamente neste contexto de contagem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada.
- issue: Expressão de gênero בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A opção principal conserva a expressão masculina de parentesco do hebraico. A nota registra a alternativa coletiva natural sem apagar a forma da fonte.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Assim” mantém a continuidade narrativa; “conforme” evita rigidez excessiva. A formulação preserva o nome divino e a expressão hebraica de parentesco.
