  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: pt
  text: Os que acampavam diante do tabernáculo, a leste[a], diante da tenda do encontro, para o lado do nascer do sol, eram Moisés, Arão e os filhos de Arão. Eles mantinham a guarda do santuário em favor dos filhos de Israel. Mas a pessoa não autorizada[b] que se aproximar será morta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o leste... no lado leste”; o hebraico emprega duas expressões direcionais relacionadas para dar ênfase.
    reason: lexical_alternative
  - marker: b
    text: “Pessoa não autorizada” é quem não tinha permissão para se aproximar do serviço do santuário; não se refere especificamente a um estrangeiro por etnia.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: Os que acampavam
  rationale: O particípio substantivado descreve as pessoas postadas naquele lugar; o imperfeito português se ajusta naturalmente ao contexto da disposição do acampamento.
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: diante do tabernáculo
  rationale: Expressa a posição em frente ao מִשְׁכָּן e mantém a distinção terminológica em relação à “tenda do encontro”.
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: a leste ... para o lado do nascer do sol
  rationale: Preserva as duas expressões direcionais relacionadas, sem reduzi-las a uma repetição idêntica em português.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução clara e estabelecida para a estrutura sagrada designada pela expressão hebraica.
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: Moisés, Arão e os filhos de Arão
  rationale: O sufixo masculino singular liga os filhos mais naturalmente a Arão; a repetição do nome evita a ambiguidade pronominal artificial em português.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  choice: mantinham a guarda do santuário
  rationale: Reproduz o sentido de vigilância e responsabilidade da construção cognata hebraica em linguagem portuguesa natural.
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: em favor dos filhos de Israel
  rationale: Comunica que o encargo sagrado era exercido representativamente em favor de Israel, sem transformar a frase em mera prestação de benefício.
- source_word: וְהַזָּר
  choice: a pessoa não autorizada
  rationale: No contexto da guarda do santuário, זָר designa quem não tinha autorização para esse acesso, e não necessariamente alguém estrangeiro por etnia.
- source_word: הַקָּרֵב
  choice: que se aproximar
  rationale: Mantém a ideia concreta de aproximar-se da esfera sagrada cuja entrada era restrita.
- source_word: יוּמָת
  choice: será morta
  rationale: A forma causativa passiva indica a aplicação da pena de morte, não apenas que a pessoa morreria.
theological_decisions:
- issue: Referente de “seus filhos” no hebraico
  choice: Explicitar “os filhos de Arão”
  alternative: Manter “seus filhos”, com possível referência conjunta ou ambígua a Moisés e Arão
  rationale: O sufixo singular segue imediatamente Arão e, no contexto, a função sacerdotal pertence especificamente a Arão e seus filhos.
- issue: Sentido de זָר na legislação do santuário
  choice: Pessoa não autorizada a se aproximar
  alternative: Estrangeiro em sentido étnico ou estranho em sentido social geral
  rationale: O contexto trata de acesso e responsabilidade cultual; a distinção é funcional e sagrada, não étnica.
- issue: Relação de לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל com o encargo do santuário
  choice: Responsabilidade exercida em favor dos filhos de Israel
  alternative: Responsabilidade pertencente aos filhos de Israel ou obrigação imposta por eles
  rationale: A formulação mantém a dimensão representativa sem definir além do que a sintaxe e o contexto permitem.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição direcional do hebraico foi preservada de modo natural; “filhos de Israel” conserva a expressão familiar coletiva do texto-fonte.
