  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés no deserto do Sinai[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma consonantal hebraica e a tradução tradicional, já que “Yahweh” representa uma vocalização reconstruída do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O imperfeito com waw consecutivo introduz a fórmula narrativa de discurso divino; “falou” é natural e preserva o valor de דִּבֵּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל marca o destinatário da fala; “a Moisés” é uma construção portuguesa natural.
- source_word: בְּמִדְבַּר סִינַי
  choice: no deserto do Sinai
  rationale: מִדְבָּר designa uma região erma ou de pastagem; “deserto” é claro e corrente em português, sem exigir a ideia de dunas, e o estado construto é expresso por “do Sinai”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz o conteúdo da fala que vem a seguir. Em português atual, os dois-pontos desempenham naturalmente essa função e evitam o pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título tradicional, sem afirmar certeza absoluta sobre a vocalização antiga.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial com “E” preserva a continuidade narrativa. Os dois-pontos vertem idiomaticamente לֵאמֹר e indicam que a fala começa no versículo seguinte.
