  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: pt
  text: Pois todo primogênito é meu[a]. No dia em que feri todo primogênito na terra do Egito, consagrei para mim todo primogênito em Israel, desde os seres humanos até os animais[b]. Eles serão meus. Eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pertence a mim”. A expressão hebraica de posse se repete nas formas “é meu”, “para mim” e “serão meus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desde o ser humano até o animal”, expressão que abrange os primogênitos humanos e animais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão da declaração anterior a respeito dos levitas e preserva naturalmente a força explicativa do hebraico.
- source_word: לִי
  choice: é meu / para mim / serão meus
  rationale: A repetição ressalta a posse divina; formas idiomáticas distintas preservam as três ocorrências e o fluxo natural em português.
- source_word: כָּל בְּכוֹר
  choice: todo primogênito
  rationale: Traduz a expressão de modo abrangente sem acrescentar 'macho', que não está explícito neste versículo.
- source_word: בְּיוֹם הַכֹּתִי
  choice: No dia em que feri
  rationale: Mantém o vínculo temporal formal. No contexto da morte dos primogênitos egípcios, 'feri' conserva a linguagem bíblica de juízo sem obscurecer o acontecimento.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: na terra do Egito
  rationale: Preserva a formulação completa e solene do texto hebraico.
- source_word: הִקְדַּשְׁתִּי
  choice: consagrei
  rationale: Expressa o sentido causativo de separar como santo para Deus, incluindo as dimensões cultual e possessiva.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: Reproduz de maneira concisa a esfera em que os primogênitos foram consagrados.
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: desde os seres humanos até os animais
  rationale: Torna claro em português atual o merismo que abrange os primogênitos humanos e animais, sem usar 'homem' de forma potencialmente ambígua.
- source_word: יִהְיוּ
  choice: serão
  rationale: Expressa a declaração futura e duradoura da reivindicação divina.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Mantém diretamente o nome divino e a fórmula conclusiva de autoridade e identidade da aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança sem substituí-lo por um título.
- issue: Sentido da consagração dos primogênitos
  choice: consagrei para mim
  alternative: santifiquei; separei como santos para mim
  rationale: A tradução preserva tanto a separação cultual quanto a reivindicação de posse divina, sem reduzir uma dimensão à outra.
- issue: Abrangência de מֵאָדָם עַד בְּהֵמָה
  choice: desde os seres humanos até os animais
  alternative: desde o homem até o animal
  rationale: O hebraico emprega uma expressão abrangente de categorias; a redação escolhida comunica claramente essa totalidade em português moderno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura explicativa e as repetições de posse do hebraico foram preservadas sem rigidez excessiva; o nome Yahweh foi transliterado.
