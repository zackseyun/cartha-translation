base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: pt
  text: E o chefe dos chefes dos levitas era Eleazar, filho de Arão, o sacerdote; ele tinha a supervisão dos responsáveis pela guarda do santuário[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das coisas sagradas”. O termo hebraico pode designar tanto o próprio santuário como os objetos sagrados relacionados a ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: E o chefe dos chefes dos levitas
  rationale: Mantém a construção hierárquica do hebraico e traduz נָשִׂיא como “chefe”, termo adequado ao contexto administrativo sem conotação necessariamente régia.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: Eleazar, filho de Arão, o sacerdote
  rationale: Preserva a filiação expressa no hebraico; a aposição “o sacerdote” modifica naturalmente Arão.
- source_word: פְּקֻדַּת
  choice: ele tinha a supervisão
  rationale: Expressa o sentido de responsabilidade e supervisão administrativa de פְּקֻדָּה, completando em português a oração nominal hebraica de modo claro.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: os que estavam encarregados de cuidar
  rationale: Reproduz de forma natural a combinação enfática entre o particípio “guardar” e o substantivo cognato “encargo/dever”, destacando uma responsabilidade confiada.
- source_word: הַקֹּדֶשׁ
  choice: do santuário
  rationale: No contexto do tabernáculo, o termo pode designar o espaço sagrado; “santuário” é claro e digno, enquanto a possível referência às coisas sagradas é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A repetição hierárquica “chefe dos chefes” foi mantida por refletir diretamente a formulação hebraica.
