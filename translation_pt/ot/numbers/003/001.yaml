  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּ/מֹשֶׁ֑ה בְּ/י֗וֹם דִּבֶּ֧ר יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: pt
  text: Estas são as gerações de Arão e Moisés, no tempo em que Yahweh falou com Moisés no monte Sinai[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes de Arão e Moisés”. O cabeçalho hebraico usa “gerações”, fórmula comum que pode introduzir uma linhagem familiar ou aquilo que procede de alguém.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no dia em que”, expressão idiomática que significa “no tempo em que” ou simplesmente “quando”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “falou a Moisés”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: Introduz uma nova seção com uma fórmula demonstrativa. A tradução mantém a função estrutural sem tornar explícita a conjunção hebraica, que soaria pouco natural neste contexto em português.
- source_word: תּוֹלְדֹת
  choice: as gerações
  rationale: O termo funciona como cabeçalho para uma linhagem ou para aquilo que procede de alguém. A formulação preserva a expressão formal hebraica e não restringe antecipadamente o sentido a “descendentes”.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Arão e Moisés
  rationale: Mantém os dois nomes presentes no texto hebraico, embora os versículos seguintes se concentrem nos filhos de Arão; empregam-se as formas portuguesas tradicionais dos nomes.
- source_word: בְּיוֹם
  choice: no tempo em que
  rationale: A expressão significa literalmente “no dia em que”, mas aqui funciona como um idiomatismo temporal mais amplo. “No tempo em que” comunica esse valor em português atual.
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: falou com Moisés
  rationale: A construção pode ser entendida como “falou com” ou “falou a”. A opção escolhida é natural em português e preserva a possibilidade de interação, sem excluir a alternativa indicada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּהַר סִינָי
  choice: no monte Sinai
  rationale: É a forma geográfica idiomática em português para indicar que o acontecimento ocorreu no monte Sinai.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O hebraico apresenta diretamente o nome divino. “Yahweh” preserva sua condição de nome próprio sem substituí-lo por um título.
- issue: Alcance de תּוֹלְדֹת num cabeçalho que menciona Arão e Moisés
  choice: Manter a formulação formal “as gerações de Arão e Moisés”
  alternative: os descendentes de Arão e Moisés; a linhagem de Arão e Moisés
  rationale: Embora a lista subsequente se concentre nos filhos de Arão, o texto hebraico inclui Moisés no cabeçalho. A tradução conserva essa tensão em vez de resolvê-la por paráfrase.
- issue: Sentido de דִּבֶּר ... אֶת מֹשֶׁה
  choice: falou com Moisés
  alternative: falou a Moisés
  rationale: As duas formulações são linguisticamente possíveis. O texto principal segue a leitura relacional, enquanto a nota registra a alternativa sem impor uma distinção teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a forma solene do cabeçalho hebraico, mas traduz o idiomatismo temporal com naturalidade. Usa “Arão”, forma portuguesa corrente, e conserva “Yahweh” como nome próprio.
