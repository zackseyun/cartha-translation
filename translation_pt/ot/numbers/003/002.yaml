lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: A conjunção com o demonstrativo introduz a lista. No início da frase, «Estes são» é natural em português sem perder a função deíctica.
- source_word: שְׁמוֹת
  choice: os nomes
  rationale: O substantivo no estado construto integra a expressão «os nomes dos filhos de Arão»; o artigo é exigido pelo uso idiomático em português.
- source_word: בְּנֵי אַהֲרֹן
  choice: dos filhos de Arão
  rationale: Reproduz com clareza e naturalidade a cadeia construta hebraica.
- source_word: הַבְּכֹר
  choice: o primogênito
  rationale: Indica especificamente a condição de primeiro filho, não apenas o mais velho; sua posição antes de Nadabe acompanha a ordem hebraica.
- source_word: נָדָב
  choice: Nadabe
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: וַאֲבִיהוּא
  choice: e Abiú
  rationale: Forma portuguesa tradicional do nome; a conjunção hebraica é preservada.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: וְאִיתָמָר
  choice: e Itamar
  rationale: Forma portuguesa tradicional do nome; a conjunção final é preservada.
