base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/022.yaml
  text: Their numbered ones[a], according to the number of every male from a month old and upward, were seven thousand five hundred.
translation:
  language: pt
  text: Os recenseados entre eles[a], segundo o número de todos os homens de um mês de idade para cima, eram sete mil e quinhentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que foram contados entre eles”. O hebraico repete no versículo o mesmo termo ligado ao recenseamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: os recenseados entre eles
  rationale: O termo deriva de פקד e, neste contexto, designa as pessoas registradas no recenseamento. A formulação é natural em português e mantém o sentido censitário.
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: contando todos os homens
  rationale: A construção introduz a composição da contagem. Em português, esta formulação transmite com clareza que o total abrange cada pessoa do sexo masculino, sem reproduzir de modo rígido o hebraísmo.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: de um mês de idade para cima
  rationale: Expressão corrente e clara para a fórmula hebraica que estabelece o limite mínimo de idade.
- source_word: שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: sete mil e quinhentos
  rationale: Reprodução por extenso do número cardinal, adequada à prosa bíblica em português.
theological_decisions: []
