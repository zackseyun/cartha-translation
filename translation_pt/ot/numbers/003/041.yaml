  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: pt
  text: E você tomará os levitas para mim — eu sou Yahweh — em lugar de todo primogênito entre os filhos de Israel[a], e os animais domésticos dos levitas em lugar de todo primogênito entre os animais domésticos dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os israelitas”. O hebraico diz literalmente “entre os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: E você tomará
  rationale: O qal perfeito na segunda pessoa masculina singular, ligado pela conjunção, tem força diretiva neste contexto de instrução a Moisés. O futuro em português preserva o tom prescritivo e solene.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação portuguesa consagrada para o grupo tribal descendente de Levi, com o artigo definido preservado.
- source_word: לִי
  choice: para mim
  rationale: A preposição expressa posse ou dedicação; “para mim” comunica naturalmente a consagração dos levitas a Deus.
- source_word: אֲנִי יְהוָה
  choice: eu sou Yahweh
  rationale: Preserva a fórmula enfática de autoidentificação e verte diretamente o nome divino, em vez de substituí-lo por um título.
- source_word: תַּחַת
  choice: em lugar de
  rationale: No contexto de substituição dos primogênitos pelos levitas, a expressão indica que um grupo toma o lugar do outro.
- source_word: כָּל בְּכֹר
  choice: todo primogênito
  rationale: כָּל com substantivo singular tem sentido distributivo, expresso com naturalidade por “todo primogênito”.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a forma concreta do hebraico e sua referência nacional, sem eliminar o masculino gramatical do original.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: os animais dos levitas
  rationale: בְּהֵמָה abrange animais domésticos. “Animais” é claro e corrente em português, evitando restringir indevidamente o termo a gado bovino.
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: todo primogênito entre os animais dos filhos de Israel
  rationale: Reproduz o paralelismo da primeira cláusula e deixa claro que se trata dos animais primogênitos pertencentes aos israelitas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o Tetragrama como nome próprio. “Yahweh” preserva o nome pessoal em vez de substituí-lo pelo título “SENHOR”.
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha preserva a formulação masculina plural e genealógica do hebraico. A nota registra a alternativa coletiva natural sem apagar a forma da fonte.
translation_notes:
  register: Português moderno, claro e digno, com tom prescritivo adequado à instrução divina. O travessão conserva a inserção enfática “eu sou Yahweh”; o paralelismo das duas substituições foi mantido.
