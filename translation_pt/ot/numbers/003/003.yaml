  text: אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/כֹּהֲנִ֖ים הַ/מְּשֻׁחִ֑ים אֲשֶׁר מִלֵּ֥א יָדָ֖/ם לְ/כַהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: pt
  text: Estes são os nomes dos filhos de Arão, os sacerdotes ungidos, que foram consagrados[a] para exercer o sacerdócio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “cuja mão ele encheu”, expressão idiomática que significa “a quem ele consagrou” ou “instalou” no serviço sacerdotal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Estes são os nomes
  rationale: Reproduz naturalmente em português a fórmula demonstrativa de identificação, suprindo a cópula implícita.
- source_word: בְּנֵי אַהֲרֹן
  choice: dos filhos de Arão
  rationale: Preserva a relação de genitivo da cadeia construta e o sentido masculino específico de בְּנֵי.
- source_word: הַכֹּהֲנִים הַמְּשֻׁחִים
  choice: os sacerdotes ungidos
  rationale: Mantém a aposição e traduz diretamente o particípio passivo de משׁח, conservando a referência ao ato ritual da unção.
- source_word: אֲשֶׁר מִלֵּא יָדָם
  choice: que foram consagrados
  rationale: A expressão literal 'encher a mão' é um idioma técnico de investidura sacerdotal e seria pouco inteligível no texto corrente; a nota preserva sua forma concreta e informa a alternativa 'ordenados'.
- source_word: לְכַהֵן
  choice: para exercer o sacerdócio
  rationale: Expressa a finalidade da investidura e o sentido verbal de atuar ou servir como sacerdote em português claro e digno.
theological_decisions:
- issue: Tradução do idioma de investidura מִלֵּא יָדָם
  choice: Traduzir no texto como 'foram consagrados', explicando a forma literal em nota.
  alternative: Traduzir literalmente como 'tiveram as mãos enchidas' ou idiomaticamente como 'foram ordenados'.
  rationale: O contexto sacerdotal torna inequívoca a ideia de instalação no ofício. 'Consagrados' comunica essa investidura sem sugerir uma modalidade denominacional moderna de ordenação, enquanto a nota mantém visível a imagem hebraica e a alternativa lexical.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção é digna e acessível; evita o literalismo opaco de 'encher a mão' no corpo do versículo, mas conserva a peculiaridade hebraica em nota.
