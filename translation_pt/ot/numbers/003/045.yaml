id: NUM.3.45
reference: Numbers 3:45
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: pt
  text: Tome os levitas em lugar de todo primogênito entre os filhos de Israel[a], e os animais dos levitas em lugar dos animais deles. Os levitas serão meus. Eu sou Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os israelitas”. O hebraico diz literalmente “entre os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Tome
  rationale: O imperativo de לקח dirige a Moisés a ordem de tomar ou separar os levitas; “tome” preserva de modo natural a forma direta do hebraico.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Designação tradicional e clara dos membros da tribo de Levi.
- source_word: תַּחַת
  choice: em lugar de
  rationale: Neste contexto, o termo indica substituição, não posição espacial, e a expressão mantém claramente o paralelismo entre pessoas e animais.
- source_word: כָּל בְּכוֹר
  choice: todo primogênito
  rationale: O singular com כָּל tem sentido distributivo; “todo primogênito” é conciso e natural.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém o idioma hebraico e traduz a preposição בְּ em seu sentido partitivo neste contexto.
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: os animais dos levitas
  rationale: בְּהֵמָה designa coletivamente animais domésticos. “Animais” é corrente e evita restringir indevidamente a referência a gado bovino.
- source_word: בְּהֶמְתָּם
  choice: os animais deles
  rationale: Preserva o sufixo masculino plural e o paralelo com os animais dos levitas; “deles” retoma os filhos de Israel pelo contexto.
- source_word: וְהָיוּ לִי
  choice: Os levitas serão meus
  rationale: Explicita o sujeito já mencionado e conserva a declaração de posse expressa literalmente por “ser para mim”.
- source_word: אֲנִי יְהוָה
  choice: Eu sou Yahweh
  rationale: Preserva a fórmula de autoidentificação divina e representa diretamente o nome próprio YHWH.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico apresenta o Tetragrama como nome próprio. “Yahweh” o representa diretamente; a forma tradicional “SENHOR” é registrada em nota sem substituir silenciosamente o nome.
- issue: Natureza da relação indicada por תַּחַת
  choice: substituição expressa por “em lugar de”
  alternative: “debaixo de”
  rationale: O contexto trata da separação dos levitas em substituição aos primogênitos de Israel e dos animais levíticos em substituição aos animais correspondentes; não há sentido espacial aqui.
translation_notes:
  register: Português moderno, claro e digno, com construção imperativa direta. A repetição de “em lugar de” conserva o paralelismo do hebraico. “Animais” foi preferido a “gado” por ser amplamente compreensível e não sugerir apenas bovinos.
