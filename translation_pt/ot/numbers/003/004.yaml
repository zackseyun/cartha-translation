base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: pt
  text: Mas Nadabe e Abiú morreram diante de Yahweh quando ofereceram fogo não autorizado[a] diante de Yahweh, no deserto do Sinai. Não tiveram filhos homens; e Eleazar e Itamar serviram como sacerdotes na presença de Arão, seu pai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “fogo estranho” ou “fogo alheio”; no contexto, provavelmente se trata de fogo que não havia sido autorizado para a oferta.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante de Arão, seu pai”. A expressão hebraica também pode dar a entender que eles serviram durante a vida de Arão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: morreram
  rationale: O singular hebraico antecede o sujeito composto, Nadabe e Abiú; em português, a concordância natural exige o plural.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa de modo direto o sentido de estar perante ou na presença de Yahweh e preserva a repetição do original.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּהַקְרִבָם
  choice: quando apresentaram
  rationale: A construção infinitiva indica a circunstância temporal; 'apresentaram' é natural no contexto de uma oferta cultual sem acrescentar um objeto ausente no hebraico.
- source_word: אֵשׁ זָרָה
  choice: fogo não autorizado
  rationale: No contexto cultual, זָרָה qualifica o fogo como alheio ao que era permitido. A nota preserva as correspondências mais literais e a nuance lexical.
- source_word: בְּמִדְבַּר סִינַי
  choice: no deserto do Sinai
  rationale: Tradução direta e corrente da expressão geográfica.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: Eles não tiveram filhos
  rationale: בָנִים designa filhos homens, aspecto relevante para a sucessão sacerdotal; em português, 'filhos' mantém esse sentido no contexto.
- source_word: וַיְכַהֵן
  choice: serviram como sacerdotes
  rationale: O verbo כהן significa exercer função sacerdotal; a forma plural portuguesa concorda com Eleazar e Itamar.
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: na presença de Arão, seu pai
  rationale: Preserva a imagem espacial do idioma hebraico sem decidir se a expressão enfatiza presença, contemporaneidade ou supervisão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Natureza do אֵשׁ זָרָה
  choice: fogo não autorizado
  alternative: fogo estranho; fogo alheio
  rationale: A tradução comunica a impropriedade cultual provável sem especificar uma infração que o versículo não descreve; a nota registra as alternativas mais formais.
- issue: Sentido de עַל פְּנֵי em relação a Arão
  choice: na presença de Arão
  alternative: diante de Arão; durante a vida de Arão; sob a supervisão de Arão
  rationale: A formulação escolhida conserva a ambiguidade entre presença espacial, contemporaneidade e possível relação de autoridade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “diante de Yahweh” foi mantida por corresponder à ênfase do hebraico; a frase longa foi dividida em duas para maior clareza.
