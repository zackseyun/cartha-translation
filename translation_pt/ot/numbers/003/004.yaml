  terminology: “Yahweh”, “fogo não autorizado”, “deserto do Sinai”, “sacerdotes” e os nomes próprios estão adequados. “Filhos homens” preserva explicitamente a referência a descendentes masculinos sem introduzir interpretação adicional.
