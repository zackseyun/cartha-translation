revisions:
- from: O número de todos os homens de um mês de idade para cima era de oito mil e seiscentos; eles eram responsáveis pelo cuidado do santuário.
  to: O total de todas as pessoas do sexo masculino, de um mês de idade para cima, era de oito mil e seiscentos; eram responsáveis pela guarda do santuário.
  rationale: A revisão elimina a conotação adulta de «homens», indispensável num recenseamento que começa aos um mês de idade, e torna mais explícita a noção de guarda confiada ao grupo. Mantém «santuário» como referente cultual contextual de הַקֹּדֶשׁ.
