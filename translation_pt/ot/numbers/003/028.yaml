base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: pt
  text: O total de todas as pessoas do sexo masculino, de um mês de idade para cima, era de oito mil e seiscentos; eram responsáveis pela guarda do santuário.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: O número de todos os homens
  rationale: A expressão introduz o total do recenseamento. Em português, esta formulação é natural e preserva a referência específica aos indivíduos do sexo masculino.
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: de um mês de idade para cima
  rationale: Mantém a fórmula hebraica de limite etário em linguagem portuguesa clara e corrente.
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: oito mil e seiscentos
  rationale: Reproduz exatamente o total em palavras, de acordo com o registro literário do texto.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: eram responsáveis pelo cuidado
  rationale: O particípio e o substantivo cognato exprimem uma responsabilidade contínua confiada ao grupo; a formulação evita em português a repetição artificial de termos da mesma raiz.
- source_word: הַקֹּדֶשׁ
  choice: do santuário
  rationale: No contexto levítico, o termo designa a esfera ou lugar sagrado confiado aos coatitas. 'Santuário' é claro e dignificado, sem reduzir indevidamente a referência a um compartimento específico.
theological_decisions:
- issue: Referente de הַקֹּדֶשׁ
  choice: santuário
  alternative: lugar santo; coisas sagradas
  rationale: O contexto favorece o domínio sagrado sob responsabilidade levítica, mas o hebraico admite certa amplitude. 'Santuário' comunica o referente provável sem introduzir uma distinção confessional.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. A construção foi dividida por ponto e vírgula para deixar claro que o grupo recenseado tinha a responsabilidade pelo santuário.
