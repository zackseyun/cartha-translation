  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בְנֵ֧י מְרָרִ֛י לְ/מִשְׁפְּחֹתָ֖/ם מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/בֵ֥ית אֲבֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: pt
  text: 'Os filhos de Merari, segundo os seus clãs: Mali e Musi. Esses são os clãs dos levitas[a], segundo as suas casas paternas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os clãs de Levi”. O hebraico traz o gentílico no singular, “o levita”, que pode ter sentido coletivo ou remeter a Levi como ancestral da tribo.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Os filhos de
  rationale: בְּנֵי significa literalmente “filhos de” e mantém a linguagem genealógica. A conjunção inicial não foi explicitada, pois o versículo funciona naturalmente como item de uma lista.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nome próprio transliterado segundo a forma tradicional e corrente em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: A construção com לְ classifica os descendentes por suas subdivisões de parentesco; “clãs” comunica melhor esse sentido tribal do que o termo mais genérico “famílias”.
- source_word: מַחְלִי וּמוּשִׁי
  choice: Mali e Musi
  rationale: Nomes próprios apresentados nas formas portuguesas usuais, com a conjunção preservada.
- source_word: אֵלֶּה הֵם
  choice: Esses são
  rationale: O demonstrativo seguido do pronome forma uma declaração de identificação; esta é uma formulação natural no contexto da lista.
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: os clãs dos levitas
  rationale: O singular gentílico hebraico pode ter valor coletivo. O plural em português concorda naturalmente com “clãs”, enquanto a ambiguidade formal do hebraico é registrada em nota.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo as suas casas paternas
  rationale: בֵּית אָבוֹת é uma expressão de parentesco e organização social. “Casas paternas” conserva sua estrutura patriarcal e seu caráter técnico; “segundo” expressa o valor classificatório da preposição.
theological_decisions:
- issue: Referência do singular gentílico הַלֵּוִי
  choice: Traduzir no texto como “dos levitas” em sentido coletivo.
  alternative: “do levita” ou “de Levi”.
  rationale: O contexto fala dos vários clãs da tribo, favorecendo o sentido coletivo, mas a forma singular também pode remeter a Levi como ancestral tribal. A nota preserva essa possibilidade sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a terminologia genealógica e tribal (“filhos”, “clãs”, “casas paternas”) sem arcaísmos desnecessários. O marcador foi colocado junto a “levitas”, expressão à qual a nota efetivamente se refere.
