  yaml_path: translation/ot/numbers/003/015.yaml
  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: pt
  text: Conte os filhos de Levi segundo as suas casas paternas, segundo os seus clãs. Conte todos os do sexo masculino de um mês de idade para cima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: Conte / Conte
  rationale: Neste contexto administrativo, פקד significa contar ou recensear. A repetição de “Conte” preserva o imperativo e a retomada verbal do hebraico sem sugerir uma convocação militar.
- source_word: בְּנֵי לֵוִי
  choice: os filhos de Levi
  rationale: Mantém a formulação genealógica literal e combina com a organização por casas paternas e clãs.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo as suas casas paternas
  rationale: “Casas paternas” preserva a estrutura social e genealógica designada pela expressão hebraica, sem reduzi-la simplesmente a “famílias”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: “Clãs” distingue este nível de parentesco das casas paternas mencionadas imediatamente antes.
- source_word: כָּל זָכָר
  choice: todos os do sexo masculino
  rationale: O hebraico especifica o sexo, não a idade adulta; esta formulação inclui com clareza os bebês abrangidos pelo censo.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: de um mês de idade para cima
  rationale: Expressa de modo natural e preciso o limite mínimo de idade indicado pelo idioma hebraico.
