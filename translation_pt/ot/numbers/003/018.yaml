  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: pt
  text: 'E estes são os nomes dos filhos de Gérson, segundo os seus clãs: Libni e Simei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: Preserva a conjunção hebraica e introduz naturalmente a lista em português.
- source_word: שְׁמוֹת
  choice: os nomes dos
  rationale: O substantivo está em construção com a expressão seguinte; em português, a relação é expressa naturalmente por “dos”.
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: filhos de Gérson
  rationale: בְּנֵי significa literalmente “filhos de”; como são citados dois descendentes masculinos específicos, mantém-se o sentido mais preciso.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto genealógico e censitário de Números, מִשְׁפָּחָה designa um clã. “Segundo” comunica adequadamente o princípio de organização indicado pela preposição לְ.
- source_word: לִבְנִי
  choice: Libni
  rationale: Transliteração tradicional e clara do nome próprio hebraico.
- source_word: וְשִׁמְעִי
  choice: e Simei
  rationale: Transliteração portuguesa corrente do nome próprio, preservando também a conjunção.
