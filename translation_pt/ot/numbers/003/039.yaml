  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: pt
  text: O total dos levitas que Moisés e Arão recensearam, por ordem de Yahweh[a], segundo os seus clãs — todos os do sexo masculino, de um mês de idade para cima — era de vinte e dois mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “segundo a boca de Yahweh”, expressão que significa “por ordem de Yahweh”.'
    reason: Explica o sentido idiomático e preserva para o leitor a forma literal da expressão hebraica.
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: recenseados / contaram
  rationale: As duas formas da raiz פקד se referem ao recenseamento. “Recenseados” explicita o contexto, enquanto “contaram” reproduz naturalmente a repetição lexical do hebraico.
- source_word: הַלְוִיִּם
  choice: os levitas
  rationale: Forma portuguesa consagrada para o nome do grupo tribal.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: A expressão significa literalmente “segundo a boca de Yahweh”, mas funciona aqui como um idioma que indica ordem ou autorização divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: “Clãs” representa melhor a unidade ampla de parentesco envolvida no recenseamento do que o sentido moderno mais restrito de “famílias”.
- source_word: כָּל זָכָר
  choice: todos os do sexo masculino
  rationale: Preserva a especificação masculina do hebraico em linguagem portuguesa clara e natural, aplicável inclusive às crianças mencionadas.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: de um mês de idade para cima
  rationale: Expressa com clareza a fórmula hebraica que estabelece o limite mínimo de idade.
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: vinte e dois mil
  rationale: Tradução direta do numeral cardinal hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio divino sem convertê-lo em título e sem impor a forma alternativa “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição entre “recenseados” e “contaram” acompanha a ênfase do hebraico sem soar excessivamente rígida. Os travessões delimitam a especificação censitária e tornam mais clara a longa frase.
