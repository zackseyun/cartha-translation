  text: וַ/יְהִי֩ כָל בְּכ֨וֹר זָכָ֜ר בְּ/מִסְפַּ֥ר שֵׁמ֛וֹת מִ/בֶּן חֹ֥דֶשׁ וָ/מַ֖עְלָ/ה לִ/פְקֻדֵי/הֶ֑ם שְׁנַ֤יִם וְ/עֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְ/שִׁבְעִ֖ים וּ/מָאתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: pt
  text: Todos os primogênitos do sexo masculino, registrados por nome[a], de um mês de idade para cima, segundo o recenseamento deles[b], foram vinte e dois mil trezentos e setenta e três.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “conforme o número dos nomes”; trata-se de uma expressão censitária que indica que cada pessoa foi registrada ou contada nominalmente.
    reason: cultural_note
  - marker: b
    text: Ou “segundo a contagem deles”. A expressão hebraica se refere ao recenseamento oficial do grupo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: foram
  rationale: O verbo היה introduz o resultado do recenseamento. A forma plural concorda naturalmente em português com “todos os primogênitos” e não acrescenta sentido ao hebraico.
- source_word: כָל בְּכוֹר זָכָר
  choice: todos os primogênitos do sexo masculino
  rationale: Expressa tanto a condição de primogênito quanto a especificação masculina, mantendo a abrangência de כָל em português claro e atual.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: registrados por nome
  rationale: Traduz de modo natural a expressão censitária hebraica, que indica contagem ou registro individual pelo nome. A forma mais literal é preservada na nota.
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: de um mês de idade para cima
  rationale: Mantém a fórmula hebraica que estabelece a idade mínima para inclusão no recenseamento.
- source_word: לִפְקֻדֵיהֶם
  choice: segundo o recenseamento deles
  rationale: פקד, neste contexto, refere-se à contagem oficial ou ao alistamento censitário do grupo. “Recenseamento” evita reduzir a expressão a mera repetição do total.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף שְׁלֹשָׁה וְשִׁבְעִים וּמָאתָיִם
  choice: vinte e dois mil trezentos e setenta e três
  rationale: Apresenta o total hebraico, 22.373, na ordem numérica idiomática do português moderno.
theological_decisions: []
