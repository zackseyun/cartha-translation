  text: וַ/יִּתֵּ֨ן מֹשֶׁ֜ה אֶת כֶּ֧סֶף הַ/פְּדֻיִ֛ם לְ/אַהֲרֹ֥ן וּ/לְ/בָנָ֖י/ו עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: pt
  text: E Moisés entregou a Arão e a seus filhos o dinheiro do resgate[a], conforme a ordem de Yahweh, exatamente como Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “prata dos resgatados”, isto é, o pagamento recolhido pelo resgate.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: entregou
  rationale: O verbo נתן significa basicamente “dar”; neste contexto, “entregou” expressa de modo natural a transferência do pagamento a Arão e seus filhos.
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: o dinheiro do resgate
  rationale: כֶּסֶף pode designar prata ou dinheiro, e o particípio passivo הַפְּדֻיִם significa literalmente “os resgatados”. A expressão construta refere-se, no contexto, ao pagamento recolhido pelo resgate.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: a Arão e a seus filhos
  rationale: A tradução mantém os dois complementos introduzidos por לְ e deixa claro que se trata dos filhos de Arão.
- source_word: עַל פִּי יְהוָה
  choice: conforme a ordem de Yahweh
  rationale: A expressão idiomática, literalmente “segundo a boca de Yahweh”, indica que a ação foi realizada por ordem divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva no texto o nome divino expresso pelo Tetragrama.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: exatamente como Yahweh havia ordenado a Moisés
  rationale: “Exatamente como” realça a correspondência indicada por כַּאֲשֶׁר, e “havia ordenado” apresenta naturalmente a ordem como anterior à entrega.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de כֶּסֶף הַפְּדֻיִם
  choice: dinheiro do resgate
  alternative: prata dos resgatados
  rationale: A escolha comunica o referente contextual — o pagamento pelo resgate — enquanto a nota preserva a forma mais literal e sua ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. “Dinheiro do resgate” comunica o sentido contextual, enquanto a nota registra a formulação hebraica literal.
