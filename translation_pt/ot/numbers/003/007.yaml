  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: pt
  text: Eles cumprirão o encargo dele[a] e o encargo de toda a comunidade[b] diante da tenda do encontro, para realizar o serviço do tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guardarão o dever dele” ou “observarão o encargo dele”. A combinação hebraica do verbo com o substantivo pode destacar tanto a responsabilidade de guardar quanto o cumprimento fiel do dever confiado.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os levitas assumem, em relação ao santuário, responsabilidades ligadas tanto a Arão quanto a toda a comunidade.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: cumprirão
  rationale: O verbo שׁמר pode significar guardar, observar ou cumprir. Com מִשְׁמֶרֶת, “cumprirão” comunica naturalmente a execução fiel de uma responsabilidade confiada, sem restringir o sentido à vigilância física.
- source_word: מִשְׁמַרְתּוֹ
  choice: o encargo dele
  rationale: מִשְׁמֶרֶת designa aqui um encargo ou dever atribuído. O pronome masculino singular remete mais naturalmente a Arão no contexto imediato.
- source_word: מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: o encargo de toda a comunidade
  rationale: A repetição de “encargo” preserva o paralelismo lexical do hebraico. “Comunidade” expressa de modo atual e abrangente a coletividade de Israel indicada por עֵדָה.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: diante da tenda do encontro
  rationale: “Diante de” preserva a orientação espacial e cultual de לִפְנֵי; “tenda do encontro” é uma tradução direta e clara de אֹהֶל מוֹעֵד.
- source_word: לַעֲבֹד
  choice: para realizar
  rationale: O infinitivo introduz a finalidade do encargo. “Realizar” evita a repetição pouco natural de “servir o serviço”, mantendo o sentido de executar a tarefa designada.
- source_word: עֲבֹדַת הַמִּשְׁכָּן
  choice: o serviço do tabernáculo
  rationale: עֲבֹדָה designa o serviço ou trabalho ligado ao santuário, e “tabernáculo” é a forma tradicional e ainda compreensível para מִשְׁכָּן neste contexto.
theological_decisions:
- issue: Referente do sufixo masculino singular em מִשְׁמַרְתּוֹ
  choice: “dele”, referindo-se a Arão
  alternative: Entender o sufixo de modo mais geral, como referência ao encargo do santuário ou ao dever sacerdotal coletivo
  rationale: O contexto imediato apresenta os levitas entregues a Arão e a seus filhos; por isso, Arão é o antecedente mais natural. A formulação pronominal preserva a relação contextual sem inserir o nome no próprio versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “encargo” conserva o paralelismo do hebraico; “tenda do encontro” e “tabernáculo” mantêm a terminologia cultual sem tornar a frase excessivamente arcaica.
