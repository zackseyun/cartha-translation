  text: a tenth for each lamb[a], for the seven lambs.
translation:
  language: pt
  text: um décimo[a] para cada um dos sete cordeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz simplesmente «um décimo, um décimo»; no contexto dos sacrifícios, isso designa um décimo de efa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: um décimo
  rationale: A repetição expressa distribuição — a mesma porção para cada animal. No contexto sacrificial, trata-se convencionalmente de um décimo de efa, mas a unidade não está expressa neste versículo; por isso, ela é esclarecida em nota.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para cada um
  rationale: 'Embora a forma seja literalmente «para o cordeiro, o único/um», nesta enumeração ela tem sentido distributivo: a quantidade indicada se aplica individualmente a cada cordeiro.'
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: dos sete cordeiros
  rationale: Identifica o conjunto completo ao qual se aplica a medida por animal. A construção «cada um dos sete cordeiros» reúne as duas expressões hebraicas de modo natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A construção distributiva evita a repetição pouco natural em português, enquanto a nota preserva a forma literal e esclarece a unidade implícita.
