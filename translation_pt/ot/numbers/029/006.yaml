  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: pt
  text: além do holocausto do mês[a] e da oferta de cereal que o acompanha, do holocausto regular e da oferta de cereal que o acompanha, e suas ofertas de bebida, conforme o rito prescrito, como aroma agradável, oferta feita no fogo[b] a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Provavelmente se refere ao holocausto da lua nova; em hebraico, literalmente, “do mês”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “oferta de alimento”. Tradicionalmente, “oferta pelo fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: além de
  rationale: Introduz essas ofertas como adicionais às já prescritas e soa natural em português.
- source_word: עֹלַת הַחֹדֶשׁ
  choice: o holocausto do mês
  rationale: Conserva a formulação literal do hebraico, que provavelmente designa a oferta da lua nova, sem explicitar no texto mais do que a expressão diz.
- source_word: מִנְחָתָהּ
  choice: a oferta de cereal que o acompanha
  rationale: No contexto sacrificial, מִנְחָה designa a oferta de cereal; a locução explicita com naturalidade a referência do sufixo feminino ao holocausto.
- source_word: עֹלַת הַתָּמִיד
  choice: o holocausto regular
  rationale: תָּמִיד indica continuidade ou regularidade prescrita; “regular” evita restringir no texto o sentido a “diário”.
- source_word: וְנִסְכֵּיהֶם
  choice: com as ofertas de bebida correspondentes
  rationale: נֶסֶךְ é uma oferta líquida derramada. “Ofertas de bebida” é claro, e “correspondentes” representa a referência plural às ofertas anteriores.
- source_word: כְּמִשְׁפָּטָם
  choice: conforme o rito prescrito
  rationale: No contexto cultual, מִשְׁפָּט indica a norma que regula a execução dos sacrifícios; a formulação é formal, mas compreensível.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: Preserva a metáfora da fórmula sacrificial e comunica aceitação sem recorrer a linguagem arcaica.
- source_word: אִשֶּׁה
  choice: oferta feita no fogo
  rationale: Representa o termo sacrificial como uma oferta apresentada mediante o fogo e evita tratar como indiscutível a interpretação lexical “oferta de alimento”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama e representa a direção ou dedicação da oferta.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Sentido do termo sacrificial אִשֶּׁה
  choice: oferta feita no fogo
  alternative: oferta de alimento
  rationale: A interpretação exata do termo é discutida. O texto principal conserva sua evidente associação cultual com o fogo, enquanto a alternativa lexical é registrada em nota.
- issue: Identificação de עֹלַת הַחֹדֶשׁ
  choice: holocausto do mês
  alternative: holocausto da lua nova
  rationale: O contexto aponta para a oferta da lua nova, mas o hebraico diz literalmente “do mês”; a tradução preserva essa formulação e esclarece a provável referência em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém “holocausto” como termo sacrificial estabelecido, evita sintaxe excessivamente literal e conserva em notas as ambiguidades de “do mês” e אִשֶּׁה.
