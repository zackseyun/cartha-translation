  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: pt
  text: e um bode como oferta pelo pecado, além do holocausto regular, com sua oferta de cereal e sua oferta de bebida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “libação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: e um bode
  rationale: שָׂעִיר designa um bode macho; em português, “bode” já expressa o sexo do animal. O וּ mantém a continuação da lista sacrificial.
- source_word: חַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, não o pecado em sentido abstrato.
- source_word: אֶחָד
  choice: um
  rationale: Preserva explicitamente a quantidade do animal sacrificial.
- source_word: מִ/לְּ/בַד
  choice: além de
  rationale: Indica que essa oferta é acrescentada ao conjunto da oferta regular.
- source_word: עֹלַת הַ/תָּמִיד
  choice: o holocausto regular
  rationale: עֹלָה é o holocausto, e תָּמִיד descreve seu caráter contínuo ou regularmente prescrito sem exigir a explicitação “diário”.
- source_word: וּ/מִנְחָתָ/הּ
  choice: com sua oferta de cereal
  rationale: Em listas sacerdotais, מִנְחָה é a oferta de cereal. O sufixo feminino singular remete ao holocausto; “com” expressa naturalmente que ela o acompanha.
- source_word: וְ/נִסְכָּ/הּ
  choice: e sua oferta derramada
  rationale: נֶסֶךְ é a oferta líquida derramada no ritual. Esta formulação é clara em português e evita sugerir que se trata apenas de uma bebida oferecida sem referência ao derramamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial consistente. A frase foi levemente reestruturada com “com” para mostrar que as ofertas de cereal e derramada acompanham o holocausto regular, conforme os sufixos hebraicos.
