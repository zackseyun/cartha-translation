source:
  edition: WLC
  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: pt
  text: “Estas ofertas vocês apresentarão a Yahweh nas suas ocasiões determinadas, além dos seus votos e das suas ofertas voluntárias, para os seus holocaustos, as suas ofertas de cereal, as suas ofertas de bebida e as suas ofertas de paz[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas de comunhão”. O termo hebraico designa uma categoria de ofertas ligada à paz, ao bem-estar e à comunhão.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Estas ofertas
  rationale: O demonstrativo plural retoma as ofertas festivas prescritas no contexto anterior. A explicitação de “ofertas” torna a referência natural e clara em português.
- source_word: תַּעֲשׂוּ
  choice: vocês apresentarão
  rationale: Embora o verbo signifique literalmente “fazer”, no contexto sacrificial indica cumprir ou apresentar ofertas. “Apresentarão” é idiomático e mantém o tom cultual.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição indica o destinatário ou a dedicação das ofertas, e o nome divino é transliterado como “Yahweh”.
- source_word: בְּמוֹעֲדֵיכֶם
  choice: nas suas ocasiões determinadas
  rationale: מוֹעֵד pode designar tanto um tempo marcado quanto uma celebração fixada. “Ocasiões determinadas” preserva essa amplitude no contexto do calendário sagrado.
- source_word: לְבַד
  choice: além de
  rationale: Indica que as ofertas de voto e voluntárias são adicionais às ofertas festivas obrigatórias.
- source_word: מִנִּדְרֵיכֶם
  choice: das suas ofertas de voto
  rationale: No contexto sacrificial, refere-se às ofertas prometidas por voto, não apenas aos votos pronunciados.
- source_word: וְנִדְבֹתֵיכֶם
  choice: das suas ofertas voluntárias
  rationale: Designa contribuições oferecidas espontaneamente, em contraste com as exigidas.
- source_word: לְעֹלֹתֵיכֶם
  choice: os seus holocaustos
  rationale: עֹלָה é a oferta inteiramente queimada; “holocausto” é o termo cultual tradicional e reconhecível em português bíblico.
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: as suas ofertas de cereal
  rationale: No contexto sacerdotal, מִנְחָה designa normalmente uma oferta feita de cereal. A expressão é clara para leitores modernos.
- source_word: וּלְנִסְכֵּיכֶם
  choice: as suas ofertas derramadas
  rationale: נֶסֶךְ é uma oferta líquida vertida. “Oferta derramada” comunica o ato melhor ao leitor comum do que o termo técnico “libação”.
- source_word: וּלְשַׁלְמֵיכֶם
  choice: as suas ofertas de paz
  rationale: Preserva a ligação lexical de שְׁלָמִים com paz, integridade e bem-estar, enquanto a alternativa “ofertas de comunhão” é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual em forma transliterada, sem substituí-lo por um título.
- issue: Sentido de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão
  rationale: “Ofertas de paz” conserva a associação do termo hebraico com paz, integridade e bem-estar. “Ofertas de comunhão” expressa um aspecto legítimo da categoria, mas pode estreitar seu campo semântico.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural de segunda pessoa. A enumeração após os dois-pontos reproduz de modo natural a série hebraica. O marcador [a] foi colocado junto de “ofertas de paz”, expressão à qual a nota efetivamente se refere.
