  yaml_path: translation/ot/numbers/029/022.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: pt
  text: e um bode como oferta pelo pecado, além do holocausto regular[a], de sua oferta de cereal e de sua oferta de bebida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o holocausto contínuo”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e sua oferta de cereal e sua oferta de bebida”; os pronomes se referem ao holocausto regular.'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: e um bode para oferta pelo pecado
  rationale: שָׂעִיר designa especificamente um bode; אֶחָד preserva a quantidade, e חַטָּאת, no contexto sacrificial, designa a oferta pelo pecado.
- source_word: מִ/לְּ/בַד
  choice: além de
  rationale: Expressa que a oferta mencionada é adicional ao conjunto sacrificial regular.
- source_word: עֹלַת הַ/תָּמִיד
  choice: o holocausto regular
  rationale: עֹלָה é o termo sacrificial convencionalmente traduzido por “holocausto”; תָּמִיד indica sua realização regular ou contínua.
- source_word: וּ/מִנְחָתָ/הּ
  choice: com a oferta de cereal que o acompanha
  rationale: מִנְחָה, neste contexto sacerdotal, é uma oferta de cereal. O sufixo feminino singular retoma עֹלָה, isto é, o holocausto.
- source_word: וְ/נִסְכָּ/הּ
  choice: e a oferta derramada que o acompanha
  rationale: נֶסֶךְ é uma oferta líquida vertida; “oferta derramada” é clara em português e evita a palavra menos acessível “libação”. O sufixo retoma o holocausto.
