  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וּ/נְסָכֶֽי/הָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/031.yaml
  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: pt
  text: E um bode para oferta pelo pecado, além do holocausto regular, com a respectiva oferta de cereal e as respectivas ofertas de bebida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר
  choice: bode
  rationale: Em contexto sacrificial, o termo designa um caprino macho; “bode” expressa isso de modo claro e natural em português.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: Neste contexto ritual, o substantivo designa o sacrifício relacionado ao pecado, não o pecado em sentido abstrato.
- source_word: אֶחָד
  choice: um
  rationale: Preserva a quantidade especificada no hebraico.
- source_word: מִלְּבַד
  choice: além de
  rationale: Indica que o sacrifício mencionado é acrescentado à oferta recorrente.
- source_word: עֹלַת הַתָּמִיד
  choice: holocausto regular
  rationale: “Holocausto” é o termo português corrente para a oferta totalmente queimada, e “regular” comunica sua recorrência prescrita sem sugerir que queimava ininterruptamente.
- source_word: מִנְחָתָהּ
  choice: a oferta de cereal que o acompanha
  rationale: Neste tipo de lista sacrificial, מִנְחָה é a oferta de cereal. A formulação explicita de modo natural que ela acompanha o holocausto, referente do sufixo feminino hebraico.
- source_word: וּנְסָכֶיהָ
  choice: e suas ofertas de bebida
  rationale: נֶסֶךְ designa uma oferta líquida derramada. “Ofertas de bebida” é acessível e preserva o plural do hebraico.
theological_decisions:
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: Ambas as formulações refletem aspectos reconhecidos do termo cultual. “Oferta pelo pecado” é clara, tradicional e adequada ao contexto, sem ampliar o versículo com uma interpretação ritual específica.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial amplamente reconhecível. A construção evita arcaísmos e mantém o singular da oferta de cereal e o plural das ofertas de bebida. As notas da camada inglesa não foram reproduzidas porque seus marcadores parecem estar desalinhados com o conteúdo do versículo.
