  yaml_path: translation/ot/numbers/029/029.yaml
  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: pt
  text: 'No sexto dia: oito novilhos, dois carneiros e catorze cordeiros de um ano, sem defeito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשִּׁשִּׁי
  choice: No sexto dia
  rationale: Introduz naturalmente, em português, o sexto item da sequência diária. A conjunção hebraica não precisa ser reproduzida por “E” para que a continuidade fique clara.
- source_word: פָּרִים
  choice: novilhos
  rationale: No contexto sacrificial, פָּרִים designa bovinos machos; “novilhos” é a forma tradicional, clara e específica em português, sem sugerir animais castrados como poderia ocorrer com “bois”.
- source_word: שְׁמֹנָה
  choice: oito
  rationale: Número cardinal que quantifica os novilhos.
- source_word: אֵילִם
  choice: carneiros
  rationale: Termo comum em português para ovinos machos adultos oferecidos em sacrifício.
- source_word: שְׁנָיִם
  choice: dois
  rationale: Número cardinal que quantifica os carneiros.
- source_word: כְּבָשִׂים
  choice: cordeiros
  rationale: Designa cordeiros; o substantivo masculino português preserva adequadamente a referência do hebraico sem exigir a expressão menos natural “cordeiros machos”.
- source_word: בְּנֵי שָׁנָה
  choice: de um ano
  rationale: Expressão portuguesa natural para indicar a idade exigida dos cordeiros.
- source_word: אַרְבָּעָה עָשָׂר
  choice: catorze
  rationale: Número cardinal que quantifica os cordeiros.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No vocabulário sacrificial, indica animais íntegros, livres de defeito físico; “sem defeito” é claro e preciso no português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa que acompanha a estrutura enumerativa das prescrições sacrificiais. Emprega-se “catorze”, forma de ampla legibilidade brasileira; “quatorze” também é variante ortográfica válida.
