  language: pt
  text: e um décimo para cada um dos catorze cordeiros[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico repete “um décimo” duas vezes (“um décimo, um décimo”), uma forma de indicar a quantidade destinada a cada cordeiro individualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: um décimo
  rationale: O substantivo repetido designa uma medida de um décimo, neste contexto sacrificial entendida como um décimo de efa de farinha fina. A repetição hebraica tem valor distributivo e é expressa naturalmente por “um décimo para cada”.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para cada cordeiro
  rationale: Embora literalmente seja “para o cordeiro, um”, a expressão funciona de modo distributivo, indicando a porção destinada individualmente a cada animal.
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: para os catorze cordeiros
  rationale: A expressão identifica o grupo completo ao qual se aplica a medida individual; o artigo definido é natural em português e corresponde ao conjunto específico do contexto.
