- from: 'Apresentem um holocausto, uma oferta feita pelo fogo, de aroma agradável a Yahweh: treze novilhos, dois carneiros e catorze cordeiros machos de um ano; todos deverão ser sem defeito.'
  to: 'Apresentem um holocausto, uma oferta queimada, de aroma agradável a Yahweh: treze touros do rebanho, dois carneiros e catorze cordeiros machos de um ano; deverão ser sem defeito.'
  rationale: A revisão elimina a inferência etária indevida em «novilhos» e ajusta a expressão para a oferta pelo fogo a uma formulação portuguesa mais idiomática e precisa. Mantêm-se o nome Yahweh, a ordem hebraica da lista, os números e a qualificação sacrificial final.
