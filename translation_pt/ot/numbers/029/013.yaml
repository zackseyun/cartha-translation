review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente o imperativo plural, a sequência das ofertas, os números, o sexo e a idade dos cordeiros, bem como a exigência de ausência de defeito. Contudo, «novilhos» introduz uma especificação etária que פָּרִים בְּנֵי בָקָר não exige; «touros do rebanho» é mais fiel e conserva a classificação hebraica.
  naturalness: O registro é claro e apropriado. «Oferta queimada» é uma formulação portuguesa mais direta e idiomática para אִשֶּׁה do que «oferta feita pelo fogo», sem alterar a aposição explicativa ao termo «holocausto».
  terminology: «Holocausto», «Yahweh», «carneiros», «cordeiros machos de um ano» e «sem defeito» são adequados ao contexto sacrificial. «Touros do rebanho» evita a sobreinterpretação de «novilhos».
  issues:
  - severity: medium
    issue: «Novilhos» para פָּרִים בְּנֵי בָקָר
    rationale: «Novilhos» normalmente sugere bovinos jovens, ao passo que o hebraico designa touros/bovinos machos pertencentes ao rebanho sem fixar tecnicamente a idade. A tradução deve preservar essa amplitude.
  - severity: low
    issue: «Oferta feita pelo fogo» para אִשֶּׁה
    rationale: A formulação é compreensível, mas «oferta queimada» é mais natural em português bíblico moderno e exprime de modo mais preciso a categoria sacrificial.
  revised_text: 'Apresentem um holocausto, uma oferta queimada, de aroma agradável a Yahweh: treze touros do rebanho, dois carneiros e catorze cordeiros machos de um ano; deverão ser sem defeito.'
  revised_footnotes: []
