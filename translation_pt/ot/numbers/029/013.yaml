  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: pt
  text: 'Apresentem um holocausto, uma oferta queimada, de aroma agradável a Yahweh: treze touros do rebanho, dois carneiros e catorze cordeiros machos de um ano; deverão ser sem defeito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Apresentem
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer. “Apresentem” é natural e preserva o sentido cultual.
- source_word: עֹלָה
  choice: um holocausto
  rationale: Termo português consagrado para a oferta inteiramente queimada, sem recorrer ao literalismo pouco claro “oferta de subida”.
- source_word: אִשֵּׁה
  choice: uma oferta feita pelo fogo
  rationale: Expressa de modo claro que se trata de uma oferta consumida ou preparada pelo fogo, mantendo-a em aposição a “holocausto”.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Traduz naturalmente a expressão hebraica que indica que a oferta é aceita favoravelmente por Deus.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Reproduz diretamente o nome divino do texto hebraico, preservando seu caráter pessoal e pactual.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: treze novilhos
  rationale: No contexto sacrificial, “novilhos” comunica naturalmente os bovinos machos designados pela expressão, embora o hebraico não especifique com precisão técnica sua idade.
- source_word: אֵילִם
  choice: dois carneiros
  rationale: Equivalente português comum para os ovinos machos adultos indicados por אֵילִם.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: catorze cordeiros machos de um ano
  rationale: Preserva tanto o sexo indicado pelo substantivo hebraico quanto a idade explicitamente declarada.
- source_word: תְּמִימִם יִהְיוּ
  choice: todos deverão ser sem defeito
  rationale: No vocabulário sacrificial, תָּמִים indica ausência de defeito físico; “todos” deixa claro que a qualificação abrange os animais enumerados.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido de רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador; aroma suave
  rationale: A formulação mantém a imagem sensorial do hebraico e comunica aceitação divina, sem desenvolver uma teoria específica sobre o efeito do sacrifício.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a sequência sacrificial do hebraico, o nome Yahweh e a especificação do sexo e da idade dos cordeiros.
