    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה designa a oferta de cereal que acompanhava os holocaustos. O singular coletivo do hebraico foi preservado.
- source_word: נִסְכֵּיהֶם
  choice: as ofertas derramadas
  rationale: נֶסֶךְ designa uma oferta líquida derramada. “Ofertas derramadas” é claro em português e expressa o modo ritual sem recorrer ao termo menos acessível “libações”.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: aos touros, aos carneiros e aos cordeiros
  rationale: A preposição ל relaciona as ofertas acompanhantes a cada classe de animal. A repetição pode ser expressa naturalmente em português por uma sequência coordenada.
- source_word: בְּמִסְפָּרָם
  choice: de acordo com o número deles
  rationale: A expressão indica que as ofertas acompanhantes deviam corresponder ao número dos animais, mantendo explícito o referente plural.
- source_word: כַּמִּשְׁפָּט
  choice: conforme a norma prescrita
  rationale: מִשְׁפָּט refere-se aqui à regra ou ao procedimento cultual estabelecido. A tradução conserva tanto o caráter normativo quanto a ideia de prescrição.
