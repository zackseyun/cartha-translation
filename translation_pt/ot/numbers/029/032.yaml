  text: וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: pt
  text: 'E, no sétimo dia: sete touros, dois carneiros e catorze cordeiros de um ano, sem defeito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «íntegros». O termo hebraico indica que os animais destinados ao sacrifício não tinham defeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: E, no sétimo dia
  rationale: A conjunção liga este item à sequência dos dias anteriores; «no sétimo dia» é a formulação natural em português.
- source_word: פָּרִים שִׁבְעָה
  choice: sete touros
  rationale: פַּר designa um bovino macho em contexto sacrificial. «Touros» evita acrescentar uma idade que o versículo não explicita.
- source_word: אֵילִם שְׁנָיִם
  choice: dois carneiros
  rationale: «Carneiros» é o equivalente comum e preciso de אֵילִם nesta lista sacrificial.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: catorze cordeiros de um ano
  rationale: A expressão idiomática בְּנֵי שָׁנָה indica animais de um ano; a ordem foi ajustada ao português natural.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No contexto sacrificial, o termo indica integridade física, isto é, ausência de defeito que desqualificasse o animal.
theological_decisions:
- issue: Alcance de תְּמִימִם na lista de animais
  choice: Mantido no fim da frase, junto aos cordeiros, conforme a sintaxe hebraica
  alternative: Reformular para indicar explicitamente que todos os animais eram sem defeito
  rationale: O adjetivo concorda diretamente com o grupo nominal dos cordeiros. Embora a exigência cultual possa abranger todas as ofertas no contexto mais amplo, o versículo não deve ser expandido para resolver isso explicitamente.
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa própria de uma lista ritual. «Touros» preserva o sentido lexical sem introduzir idade não expressa; «sem defeito» comunica de modo acessível o valor sacrificial de תְּמִימִם.
