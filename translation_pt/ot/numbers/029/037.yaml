  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: pt
  text: e a sua oferta de cereal e as suas ofertas de bebida, para o novilho, para o carneiro e para os cordeiros, de acordo com o número deles, conforme a prescrição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «conforme a regra prescrita». O termo hebraico refere-se à regra ou prescrição estabelecida para essas ofertas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה designa especificamente a oferta de cereal. O singular coletivo do hebraico é preservado.
- source_word: וְנִסְכֵּיהֶם
  choice: e as ofertas derramadas correspondentes
  rationale: נֶסֶךְ designa uma oferta líquida derramada. Esta formulação é clara em português e explicita naturalmente a relação indicada pelo sufixo plural.
- source_word: לַפָּר
  choice: ao novilho
  rationale: פַּר designa um bovino macho usado no sacrifício; “novilho” é a forma corrente e adequada neste contexto ritual.
- source_word: לָאַיִל
  choice: ao carneiro
  rationale: אַיִל significa diretamente “carneiro” nesta lista sacrificial.
- source_word: וְלַכְּבָשִׂים
  choice: e aos cordeiros
  rationale: כֶּבֶשׂ designa um cordeiro, frequentemente macho em contextos sacrificiais; “cordeiros” é natural e suficiente aqui.
- source_word: בְּמִסְפָּרָם
  choice: de acordo com o número deles
  rationale: A expressão indica que as ofertas acompanhantes devem corresponder ao número dos animais sacrificados.
- source_word: כַּמִּשְׁפָּט
  choice: conforme a norma estabelecida
  rationale: מִשְׁפָּט refere-se aqui à regra ou prescrição ritual que rege essas ofertas. “Norma estabelecida” preserva o caráter obrigatório sem sugerir uma decisão judicial.
