- from: e a oferta de cereal e as ofertas derramadas correspondentes ao novilho, ao carneiro e aos cordeiros, de acordo com o número deles e conforme a norma estabelecida.[a]
  to: e a sua oferta de cereal e as suas ofertas de bebida, para o novilho, para o carneiro e para os cordeiros, de acordo com o número deles, conforme a prescrição.[a]
