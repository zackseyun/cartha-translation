source:
  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/019.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: pt
  text: e um bode como oferta pelo pecado, além do holocausto contínuo[a], da oferta de cereal que o acompanha e das ofertas de bebida que os acompanham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “holocausto regular”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “suas ofertas de bebida”; o plural provavelmente se refere às ofertas de bebida pertencentes ao conjunto das ofertas prescritas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: e um bode
  rationale: A expressão sacrificial שְׂעִיר עִזִּים designa um bode; אֶחָד especifica a quantidade. Em português, “um bode” é natural e já indica o sexo do animal.
- source_word: חַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, não apenas o conceito abstrato de pecado.
- source_word: מִ/לְּ/בַד
  choice: além de
  rationale: Indica que o bode era oferecido adicionalmente ao conjunto regular de ofertas.
- source_word: עֹלַת הַ/תָּמִיד
  choice: o holocausto contínuo
  rationale: תָּמִיד caracteriza a oferta prescrita de modo contínuo ou regular. “Contínuo” preserva de perto o termo hebraico; a nota registra a alternativa idiomática.
- source_word: וּ/מִנְחָתָ/הּ
  choice: da oferta de cereal que o acompanha
  rationale: מִנְחָה, na legislação sacrificial, refere-se normalmente à oferta de cereal. O sufixo feminino singular retoma עֹלָה; a formulação explícita evita a possível impressão, em português, de que o antecedente seja o bode.
- source_word: וְ/נִסְכֵּי/הֶם
  choice: e das ofertas de bebida que os acompanham
  rationale: A tradução conserva tanto o substantivo plural quanto o sufixo plural do hebraico, provavelmente referentes às libações associadas ao conjunto das ofertas prescritas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial amplamente reconhecível. “Holocausto” é mantido como termo bíblico corrente; as relações pronominais foram explicitadas para maior clareza sem eliminar o plural incomum do hebraico.
