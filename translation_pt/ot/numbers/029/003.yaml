  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: pt
  text: 'E a oferta de cereal deles será de farinha fina misturada com azeite: três décimos para o novilho[a] e dois décimos para o carneiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, “três décimos” e “dois décimos” significam décimos de um efa, medida de capacidade para secos usada no sistema sacrificial de Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: E a oferta de cereal deles será
  rationale: No contexto sacrificial, מִנְחָה designa especificamente a oferta de cereal. A conjunção foi preservada, e a oração nominal hebraica recebeu “será” para produzir português natural.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: סֹלֶת indica farinha de alta qualidade e moagem fina usada nas ofertas; “farinha fina” é claro e corrente.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha preparada mediante mistura com óleo. “Azeite” é a forma natural no contexto bíblico, em que se trata de azeite de oliva.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: três décimos
  rationale: עִשָּׂרוֹן é a décima parte de um efa. A forma abreviada preserva a formulação do hebraico, enquanto a nota explicita a unidade.
- source_word: לַפָּר
  choice: para o novilho
  rationale: פַּר designa um bovino macho empregado em sacrifício. “Novilho” é uma equivalência cultual tradicional e inteligível, sem acrescentar “cada”, ausente neste versículo.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos
  rationale: Mantém a medida quantitativa do hebraico; a unidade implícita é esclarecida em nota.
- source_word: לָאָיִל
  choice: para o carneiro
  rationale: אַיִל significa “carneiro” em contextos sacrificiais; o singular do texto hebraico foi mantido.
