source:
  edition: WLC
  text: בַּ/יּוֹם֙ הַ/שְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/035.yaml
  text: On the eighth day you shall have a solemn assembly[a]; you shall do no laborious work.
translation:
  language: pt
  text: No oitavo dia, vocês terão uma assembleia solene[a]; não farão nenhum trabalho habitual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assembleia de encerramento”. O termo hebraico עֲצֶרֶת pode designar uma assembleia festiva conclusiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: No oitavo dia
  rationale: Expressa de modo natural em português a locução temporal com artigo definido e ordinal, sem acrescentar explicitamente “da festa”.
- source_word: עֲצֶרֶת
  choice: assembleia solene
  rationale: Preserva o caráter sagrado e formal da reunião, mantendo em nota a possibilidade de que o termo destaque seu caráter conclusivo.
- source_word: תִּהְיֶה לָכֶם
  choice: vocês terão
  rationale: Representa idiomaticamente a construção hebraica literal “será para vocês” e deixa claro que a assembleia é prescrita à comunidade.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho habitual
  rationale: A expressão designa o trabalho comum ou ocupacional proibido em dias sagrados, não necessariamente toda e qualquer atividade; “trabalho habitual” é claro e evita o arcaísmo de “trabalho servil”.
- source_word: לֹא תַעֲשׂוּ
  choice: não farão
  rationale: Reproduz a proibição legal dirigida à comunidade em registro digno e natural.
theological_decisions:
- issue: Terminologia festiva de עֲצֶרֶת
  choice: assembleia solene
  alternative: assembleia de encerramento
  rationale: O termo indica uma reunião sagrada e pode também salientar o encerramento da festa. O texto principal conserva seu caráter ritual sem impor uma identificação litúrgica posterior, e a alternativa lexical é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural comunitário é expresso por “vocês”; a formulação mantém o tom legislativo sem recorrer a formas arcaicas.
