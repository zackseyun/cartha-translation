base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/026.yaml
  text: 'On the fifth day: nine bulls[a], two rams, and fourteen male lambs a year old, without blemish,'
translation:
  language: pt
  text: 'No quinto dia: nove novilhos[a], dois carneiros e catorze cordeiros de um ano, sem defeito,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E no quinto dia”. O hebraico traz uma conjunção no início do versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: No quinto dia
  rationale: Expressa de modo natural em português o valor temporal da preposição e do ordinal. A conjunção hebraica inicial fica implícita na sequência da lista, com a alternativa literal registrada em nota.
- source_word: פָּרִים תִּשְׁעָה
  choice: nove novilhos
  rationale: Em contexto sacrificial, פָּרִים designa bovinos machos, frequentemente jovens; “novilhos” é corrente e específico em português bíblico sem tornar a frase pesada.
- source_word: אֵילִם שְׁנָיִם
  choice: dois carneiros
  rationale: “Carneiros” é o equivalente usual de אֵילִם e preserva a referência a ovinos machos adultos.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: catorze cordeiros de um ano
  rationale: כְּבָשִׂים indica cordeiros machos no uso sacrificial; em português, o masculino “cordeiros” comunica isso naturalmente. “De um ano” traduz com clareza a expressão idiomática בְּנֵי שָׁנָה.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No contexto sacrificial, indica animais livres de defeito físico; “sem defeito” é claro, atual e evita o sentido mais amplo de “perfeitos”.
