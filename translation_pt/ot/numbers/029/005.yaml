  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את לְ/כַפֵּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: pt
  text: e um bode como oferta pelo pecado, para fazer expiação por vocês—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: e um bode
  rationale: A expressão hebraica designa um bode macho e especifica a quantidade de um. Em português, “bode” já indica naturalmente o macho da espécie, sem necessidade de “bode macho”.
- source_word: חַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto sacrificial, o termo designa a oferta pelo pecado, não apenas o pecado em sentido abstrato. “Como” expressa com naturalidade a função do animal na lista de ofertas.
- source_word: לְ/כַפֵּר
  choice: para fazer expiação
  rationale: No contexto sacerdotal, o verbo se refere ao ato ritual de expiar ou realizar expiação. A formulação preserva a força cultual e evita definir um mecanismo doutrinário mais específico.
- source_word: עֲלֵי/כֶם
  choice: por vocês
  rationale: Com o verbo כפר, a preposição indica as pessoas em favor de quem se realiza a expiação. “Por vocês” é natural e claro em português.
theological_decisions:
- issue: Tradução da linguagem sacrificial de כפר
  choice: para fazer expiação por vocês
  alternative: para fazer propiciação por vocês
  rationale: “Expiação” preserva a categoria sacrificial do hebraico sem resolver a tensão semântica em favor de uma teoria específica. “Propiciação” pode sugerir uma interpretação mais estreita do mecanismo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Mantém-se o travessão final porque o versículo integra uma lista que continua no contexto.
