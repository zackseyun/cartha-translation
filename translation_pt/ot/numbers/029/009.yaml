  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: pt
  text: 'e a oferta de cereal correspondente: farinha fina misturada com azeite — três décimos de efa[a] para o novilho e dois décimos para o único carneiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um décimo de efa correspondia a cerca de 2 litros, embora as estimativas variem.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: e a oferta de cereal correspondente
  rationale: No contexto sacrificial, מִנְחָה designa a oferta de cereal que acompanha os animais. O sufixo plural remete ao conjunto anteriormente mencionado; “correspondente” expressa essa relação com naturalidade, sem sugerir que os animais sejam possuidores da oferta.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Designa farinha de alta qualidade e moagem fina usada nas ofertas; a expressão é clara e tradicional em português.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo descreve a farinha combinada com óleo. “Azeite” é a forma natural no contexto israelita, em que se trata de azeite de oliva.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: três décimos de efa
  rationale: עִשָּׂרוֹן é uma medida equivalente a um décimo de efa. Explicitar “de efa” evita uma quantidade incompleta em português.
- source_word: לַפָּר
  choice: para o novilho
  rationale: O substantivo singular com artigo remete ao novilho mencionado na lista sacrificial anterior.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos
  rationale: Mantém a medida em paralelo com “três décimos de efa”; a unidade pode ser naturalmente subentendida após sua primeira ocorrência.
- source_word: לָאַיִל הָאֶחָד
  choice: para o único carneiro
  rationale: O artigo com אֶחָד salienta que há um só carneiro na oferta enumerada. “Único” preserva essa especificidade de modo idiomático.
