  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: pt
  text: 'E a oferta de cereal que os acompanha será de farinha fina misturada com azeite: três décimos[a] para cada novilho, para os treze novilhos, e dois décimos para cada carneiro, para os dois carneiros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, «três décimos» e «dois décimos» se referem a décimos de uma unidade de medida, tradicionalmente entendidos como décimos de um efa.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: E a oferta de cereal que os acompanha
  rationale: No contexto sacrificial, מִנְחָה designa especificamente a oferta de cereal. O sufixo masculino plural remete ao conjunto de animais/ofertas; em português, a construção relativa evita o pouco natural «oferta de cereal deles» e explicita essa relação sem alterar o sentido.
- source_word: סֹלֶת
  choice: farinha fina
  rationale: Equivalente claro e consagrado para a farinha finamente moída usada nas ofertas cultuais.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: misturada com azeite
  rationale: O particípio passivo indica farinha preparada mediante mistura com óleo. «Azeite» é a designação portuguesa natural para o óleo de oliva pressuposto nesse contexto.
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: três décimos
  rationale: עִשָּׂרוֹן é uma medida correspondente a um décimo, tradicionalmente entendida como um décimo de efa. A forma concisa do hebraico é preservada no texto, com esclarecimento em nota.
- source_word: לַפָּר הָאֶחָד
  choice: para cada novilho
  rationale: Embora literalmente seja «para o novilho um», a construção tem sentido distributivo nesta lista sacrificial. «Cada novilho» comunica isso naturalmente.
- source_word: לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: para os treze novilhos
  rationale: A expressão identifica o conjunto total ao qual se aplica a quantidade por animal; o artigo definido é natural em português.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dois décimos
  rationale: Mantém o paralelismo com «três décimos» e preserva a expressão abreviada de medida do texto hebraico.
- source_word: לָאַיִל הָאֶחָד
  choice: para cada carneiro
  rationale: A construção singular definida funciona distributivamente; «cada carneiro» transmite claramente a instrução.
- source_word: לִשְׁנֵי הָאֵילִם
  choice: para os dois carneiros
  rationale: Representa naturalmente o grupo definido e numerado do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Oferta de cereal», «farinha fina», «azeite», «novilho» e «carneiro» preservam o vocabulário sacrificial sem arcaísmo excessivo. A repetição das quantidades e dos totais acompanha a estrutura normativa do hebraico.
