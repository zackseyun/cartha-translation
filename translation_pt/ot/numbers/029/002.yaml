  text: וַ/עֲשִׂיתֶ֨ם עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: pt
  text: 'Ofereçam um holocausto como aroma agradável[a] a Yahweh: um novilho, um carneiro e sete cordeiros de um ano, sem defeito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir “aroma apaziguador”. A expressão hebraica é uma fórmula sacrificial que indica que a oferta é aceita por Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Ofereçam
  rationale: Embora o verbo signifique literalmente “fazer”, com עֹלָה ele tem o sentido idiomático de apresentar ou oferecer um sacrifício.
- source_word: עֹלָה
  choice: holocausto
  rationale: Termo sacrificial consagrado em português para a oferta inteiramente queimada e feita subir em fumaça.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: Reproduz de modo natural a fórmula sacrificial que expressa a aceitação da oferta por Deus, sem eliminar sua imagem concreta.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Preserva o nome divino expresso pelo Tetragrama no texto hebraico.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: um novilho
  rationale: A expressão designa um bovino macho jovem destinado ao sacrifício; “novilho” é natural e específico em português.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: Equivalente direto do nome do ovino macho adulto no contexto sacrificial.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sete cordeiros de um ano
  rationale: Mantém o número, a espécie e a idade exigida; o masculino plural corresponde à forma hebraica.
- source_word: תְּמִימִם
  choice: todos sem defeito
  rationale: No contexto sacrificial, indica animais livres de defeito físico; “todos” deixa claro que a qualificação se aplica aos animais enumerados.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o caráter de nome próprio e segue a decisão editorial fornecida.
- issue: Sentido de רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma tranquilizador
  rationale: Mantém a metáfora e a fórmula cultual sem explicar no corpo do versículo exatamente como se dá a aceitação divina.
translation_notes:
  register: Português atual, claro e digno, com imperativo plural natural. “Holocausto” conserva a terminologia sacrificial tradicional; “Yahweh” preserva o nome próprio divino. A nota explicita a alternativa lexical sem dissolver a imagem do texto.
