    issue: O sufixo de terceira pessoa plural em כְּמִשְׁפָּטָם não é representado no texto principal.
    rationale: “Segundo a norma prescrita” expressa o sentido normativo, mas não o elemento “para/segundo eles” indicado pelo sufixo hebraico. “Segundo a norma estabelecida para eles” conserva essa relação, sem especificar indevidamente o referente.
  - severity: low
    issue: As preposições לפני cada classe de animal são condensadas.
    rationale: A condensação não produz erro de sentido, mas repetir “para” acompanha melhor a construção hebraica e a formulação recorrente da lista sacrificial.
