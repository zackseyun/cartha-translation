  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: pt
  text: e a oferta de cereal deles e suas ofertas de bebida para os touros, para os carneiros e para os cordeiros, conforme o número deles e segundo a norma estabelecida para eles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a regra estabelecida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: a oferta de cereal deles
  rationale: No contexto sacrificial, מִנְחָה designa a oferta de cereal. O singular coletivo e o sufixo de terceira pessoa do plural são preservados.
- source_word: נִסְכֵּיהֶם
  choice: suas ofertas de bebida
  rationale: נֶסֶךְ designa uma oferta líquida derramada junto aos sacrifícios. “Ofertas de bebida” é claro e acessível, e o plural corresponde ao hebraico.
- source_word: לַפָּרִים
  choice: para os touros
  rationale: פָּרִים refere-se aos bovinos machos da lista sacrificial. “Touros” evita acrescentar uma especificação etária não inequívoca no termo.
- source_word: לָאֵילִם
  choice: os carneiros
  rationale: אַיִל, em contexto sacrificial, significa diretamente “carneiro”.
- source_word: וְלַכְּבָשִׂים
  choice: e os cordeiros
  rationale: כֶּבֶשׂ designa cordeiro; o português não precisa explicitar aqui o sexo, já inferível do contexto ritual mais amplo.
- source_word: בְּמִסְפָּרָם
  choice: conforme o número deles
  rationale: A expressão indica correspondência com a quantidade prescrita dos animais e conserva o sufixo plural do hebraico.
- source_word: כְּמִשְׁפָּטָם
  choice: segundo a norma prescrita
  rationale: מִשְׁפָּט tem aqui sentido ritual e normativo. “Norma prescrita” comunica esse valor legal-cúltico sem sugerir meramente um costume informal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação compacta evita repetir “para” diante de cada classe de animal sem alterar as relações sintáticas. O marcador da nota foi colocado na expressão a que a alternativa lexical se refere.
