  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: pt
  text: e um bode como oferta pelo pecado[a], além da oferta pelo pecado da expiação, do holocausto regular[b], da oferta de cereal que o acompanha e das ofertas de libação que os acompanham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”, nas duas ocorrências de “oferta pelo pecado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “holocausto contínuo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão designa um caprino macho. “Bode” é a forma natural e precisa em português.
- source_word: אֶחָד
  choice: um
  rationale: Mantém o número especificado para o sacrifício.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, o substantivo designa uma oferta ritual, não o pecado em sentido abstrato. A alternativa “oferta de purificação” é registrada em nota.
- source_word: מִלְּבַד
  choice: além de
  rationale: Indica que o bode era oferecido adicionalmente aos sacrifícios já prescritos.
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: oferta pelo pecado da expiação
  rationale: Preserva a relação construtiva entre a oferta e a expiação sem explicitar além do hebraico o rito em questão.
- source_word: עֹלַת הַתָּמִיד
  choice: holocausto regular
  rationale: “Holocausto” é o termo cultual estabelecido para עֹלָה, e “regular” comunica a recorrência expressa por תָּמִיד sem restringi-la indevidamente a “diário”.
- source_word: מִנְחָתָהּ
  choice: oferta de cereal que o acompanha
  rationale: No contexto, מִנְחָה é a oferta de cereal associada ao holocausto. A reformulação explicita naturalmente em português a referência do sufixo feminino hebraico.
- source_word: נִסְכֵּיהֶם
  choice: ofertas de libação que os acompanham
  rationale: Mantém o plural do substantivo e do sufixo, cuja referência abrange as ofertas mencionadas. “Libação” conserva o sentido ritual com formulação portuguesa corrente em textos bíblicos.
theological_decisions:
- issue: Sentido cultual de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: A tradução tradicional e transparente identifica o tipo de sacrifício, enquanto a nota preserva a interpretação lexical que enfatiza sua função purificadora.
- issue: Valor de תָּמִיד
  choice: regular
  alternative: contínuo
  rationale: “Regular” expressa uma oferta recorrente segundo a prescrição cultual; “contínuo” também é lexicalmente possível e é preservado em nota, sem sugerir necessariamente uma ação ininterrupta.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial reconhecível. A repetição de “que acompanha/acompanham” torna explícitas as relações pronominais do hebraico sem alterar o conteúdo. O marcador [b] foi colocado junto de “holocausto regular”, expressão à qual sua alternativa lexical efetivamente se refere.
