base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/023.yaml
  text: 'And on the fourth day: ten bulls, two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: pt
  text: 'E no quarto dia: dez touros, dois carneiros e catorze cordeiros de um ano, sem defeito,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: E, no quarto dia
  rationale: Preserva tanto a conjunção que liga o versículo à sequência ritual quanto a fórmula temporal, em português natural.
- source_word: פָּרִים עֲשָׂרָה
  choice: dez novilhos
  rationale: Em listas sacrificiais, פָּרִים designa bovinos machos destinados à oferta; “novilhos” é a forma tradicional, clara e adequada ao contexto cultual.
- source_word: אֵילִם שְׁנָיִם
  choice: dois carneiros
  rationale: אֵילִם é o termo usual para carneiros adultos, especialmente em contextos sacrificiais.
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: catorze cordeiros
  rationale: כְּבָשִׂים indica cordeiros; a quantidade composta é vertida diretamente como “catorze”.
- source_word: בְּנֵי שָׁנָה
  choice: de um ano
  rationale: A expressão idiomática hebraica indica animais de um ano ou no primeiro ano de vida; “de um ano” é conciso e corrente em português.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No vocabulário sacrificial, o adjetivo indica animais íntegros, livres de defeito físico; “sem defeito” comunica precisamente essa exigência.
