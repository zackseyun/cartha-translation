    issue: «ofertas derramadas» para נִסְכֵיהֶם
    rationale: Embora compreensível, a expressão descreve o gesto de derramar, não o tipo de oferta, e não é a designação portuguesa mais natural para as ofertas líquidas rituais. «Ofertas de bebida» é clara e corresponde ao uso estabelecido.
  - severity: low
    issue: «conforme o número de cada um»
    rationale: O sufixo plural em «seu número» refere-se coletivamente aos animais enumerados. «De cada um» pode sugerir uma individualização mais explícita do que a formulação hebraica exige.
  - severity: low
    issue: Ligação sintática de «correspondentes»
    rationale: Na redação atual, «correspondentes» segue imediatamente «ofertas derramadas» e pode parecer qualificar somente essas ofertas, embora a relação se aplique às duas classes de ofertas.
