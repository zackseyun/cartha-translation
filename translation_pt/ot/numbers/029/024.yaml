revisions:
- from: e as ofertas de cereal e as ofertas derramadas correspondentes aos novilhos, aos carneiros e aos cordeiros, conforme o número de cada um, segundo a prescrição estabelecida.[a]
  to: e suas ofertas de cereal e suas ofertas de bebida para os novilhos, os carneiros e os cordeiros, conforme o número deles, segundo a prescrição.[a]
  rationale: A revisão substitui uma expressão ritual pouco natural por «ofertas de bebida», elimina a individualização adicional em «de cada um» e explicita por paralelismo que ambas as classes de ofertas se relacionam aos animais listados. Mantém-se a distinção entre «conforme o número deles» e «segundo a prescrição», bem como a âncora da nota no termo que traduz כַּמִּשְׁפָּט.
