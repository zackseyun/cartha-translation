  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: pt
  text: e suas ofertas de cereal e suas ofertas de bebida para os novilhos, os carneiros e os cordeiros, conforme o número deles, segundo a prescrição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «segundo a norma» ou «conforme o rito prescrito». O termo hebraico se refere ao procedimento estabelecido para essas ofertas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: as ofertas de cereal correspondentes
  rationale: Em contexto sacrificial, מִנְחָה designa a oferta de cereal. Embora o substantivo hebraico esteja no singular coletivo com sufixo referente a vários animais, o plural soa natural em português e explicita a distribuição das ofertas entre eles.
- source_word: וְנִסְכֵּיהֶם
  choice: e as ofertas derramadas correspondentes
  rationale: נֶסֶךְ é uma oferta líquida vertida. “Oferta derramada” é clara, preserva a imagem ritual e evita o termo menos acessível “libação”.
- source_word: לַפָּרִים
  choice: aos novilhos
  rationale: O לְ indica a relação das ofertas complementares com os animais sacrificados. “Novilhos” é uma designação tradicional e compreensível dos bovinos machos oferecidos neste contexto.
- source_word: לָאֵילִם
  choice: aos carneiros
  rationale: Mantém a mesma relação distributiva indicada por לְ e emprega o equivalente comum de אַיִל neste contexto sacrificial.
- source_word: וְלַכְּבָשִׂים
  choice: e aos cordeiros
  rationale: Traduz כְּבָשִׂים pelo termo corrente para os ovinos jovens oferecidos em sacrifício e conserva a estrutura coordenada da lista.
- source_word: בְּמִסְפָּרָם
  choice: conforme o número de cada um
  rationale: A expressão indica que as ofertas complementares deviam corresponder ao número dos animais. “De cada um” torna essa relação distributiva inequívoca em português.
- source_word: כַּמִּשְׁפָּט
  choice: segundo a prescrição estabelecida
  rationale: No contexto da legislação sacrificial, מִשְׁפָּט se refere à norma ou ao procedimento determinado, não meramente a um costume. A formulação conserva o caráter normativo e ritual.
theological_decisions: []
