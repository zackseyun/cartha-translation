base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/017.yaml
  text: 'And on the second day: twelve bulls from the herd[a], two rams, and fourteen one-year-old lambs without blemish,'
translation:
  language: pt
  text: 'E, no segundo dia: doze novilhos do gado[a], dois carneiros e catorze cordeiros de um ano, sem defeito,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, em hebraico, «doze novilhos, filhos do gado».
