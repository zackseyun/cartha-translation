lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: E, no segundo dia
  rationale: A conjunção mantém a continuidade da lista de ofertas, e o ordinal é vertido diretamente.
- source_word: פָּרִים בְּנֵי בָקָר
  choice: novilhos do gado
  rationale: No contexto sacrificial, פָּרִים designa bovinos machos; בְּנֵי בָקָר é uma expressão classificatória, literalmente «filhos do gado». «Novilhos do gado» é claro e natural em português, sem reproduzir literalmente o idiomatismo hebraico.
- source_word: שְׁנֵים עָשָׂר
  choice: doze
  rationale: Número cardinal que quantifica os novilhos.
- source_word: אֵילִם שְׁנָיִם
  choice: dois carneiros
  rationale: אֵילִם é o termo usual para carneiros machos adultos em listas sacrificiais.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: catorze cordeiros de um ano
  rationale: A expressão בְּנֵי שָׁנָה indica animais de um ano de idade; a formulação portuguesa é concisa e corrente.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No vocabulário sacrificial, indica animais livres de defeito físico e aptos para a oferta; «sem defeito» comunica isso com clareza moderna.
