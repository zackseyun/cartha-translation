  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: pt
  text: No décimo quinto dia do sétimo mês, vocês terão uma santa convocação. Não farão nenhum trabalho habitual e celebrarão uma festa para Yahweh durante sete dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: No décimo quinto dia
  rationale: A construção hebraica indica a data; em português, a conjunção inicial pode ser omitida com naturalidade no início isolado do versículo, sem perda de sentido.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: do sétimo mês
  rationale: Expressa de modo direto a relação calendárica entre o dia e o mês.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: Preserva tanto a santidade da ocasião quanto a ideia de uma reunião oficialmente convocada.
- source_word: יִהְיֶה לָכֶם
  choice: vocês terão
  rationale: Equivalente natural em português ao hebraico literal 'será para vocês'.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho habitual
  rationale: Refere-se ao trabalho regular ou ocupacional proibido no dia sagrado, sem sugerir necessariamente a proibição absoluta de toda atividade.
- source_word: לֹא תַעֲשׂוּ
  choice: Não farão
  rationale: Mantém a força prescritiva da formulação legal hebraica em linguagem portuguesa digna e clara.
- source_word: וְחַגֹּתֶם חַג
  choice: celebrarão uma festa
  rationale: Reproduz naturalmente a construção cognata hebraica, que ordena a observância festiva.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição apresenta a festa como dedicada a Yahweh; 'para' é idiomático em português e preserva essa orientação.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: Explicita de maneira natural a duração da festa, já implícita na expressão hebraica.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' representa o nome próprio e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Registro solene, porém acessível; segunda pessoa do plural expressa por 'vocês', sem regionalismos marcados.
