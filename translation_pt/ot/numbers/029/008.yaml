source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: pt
  text: 'Apresentem a Yahweh um holocausto de aroma agradável[a]: um novilho, um carneiro e sete cordeiros de um ano; todos eles devem ser sem defeito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aroma apaziguador”. A expressão hebraica é uma fórmula sacrificial que indica uma oferta aceita por Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: Apresentem
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer. “Apresentem” comunica com naturalidade o ato de levar a oferta perante Deus.
- source_word: עֹלָה
  choice: um holocausto
  rationale: Termo tradicional e claro em português para a oferta inteiramente consumida pelo fogo; evita a estranheza de uma tradução etimológica como “oferta de subida”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário ou a dedicação da oferta, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: רֵיחַ נִיחֹחַ
  choice: como aroma agradável
  rationale: Expressão sacrificial fixa que descreve a oferta como aceita por Deus. “Aroma agradável” preserva a metáfora e é natural em português; “como” explicita a função predicativa da expressão no contexto.
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: um novilho
  rationale: A expressão hebraica designa um bovino macho da manada. “Novilho” é a equivalência sacrificial consagrada e natural em português.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: Equivalente português direto e usual para אַיִל em listas sacrificiais.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sete cordeiros de um ano
  rationale: כְּבָשִׂים designa cordeiros machos, gênero já expresso lexicalmente por “cordeiros”; בְּנֵי שָׁנָה indica animais de um ano de idade.
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: que deverão ser sem defeito
  rationale: No contexto sacrificial, תְּמִימִם exige animais livres de defeito. A formulação portuguesa transmite a obrigação expressa por יִהְיוּ e entende o plural como referente imediato aos sete cordeiros; o dativo לָכֶם indica a exigência dirigida aos ofertantes e não precisa ser reproduzido pelo pouco natural “para vocês”.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido de רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador
  rationale: A expressão comunica a aceitação divina da oferta sem exigir a ideia de que o sacrifício apazigua Deus; a metáfora sensorial do hebraico é preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo “Apresentem” reproduz naturalmente a instrução dirigida à comunidade. A enumeração permanece concisa, como no hebraico.
