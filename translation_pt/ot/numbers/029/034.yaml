  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: pt
  text: e um bode como oferta pelo pecado[a], além do holocausto regular[b], com a sua oferta de cereal e a sua libação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um bode macho como oferta pelo pecado”.'
    reason: lexical_alternative
  - marker: b
    text: “Regular” traduz o termo hebraico referente à oferta contínua e recorrente; também pode ser traduzido por “diário” ou “contínuo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: e um bode
  rationale: שְׂעִיר designa um bode macho em contextos sacrificiais; em português, “bode” já expressa naturalmente o sexo masculino, enquanto אֶחָד indica a quantidade. A conjunção וּ dá continuidade à lista.
- source_word: חַטָּאת
  choice: para oferta pelo pecado
  rationale: No contexto sacrificial, חַטָּאת designa a oferta pelo pecado, não apenas o conceito abstrato de pecado.
- source_word: מִ/לְּ/בַד
  choice: além de
  rationale: A expressão indica que esta oferta é acrescentada ao holocausto recorrente prescrito.
- source_word: עֹלַת הַ/תָּמִיד
  choice: o holocausto regular
  rationale: עֹלָה é o termo sacrificial tradicionalmente traduzido por “holocausto”; תָּמִיד caracteriza a oferta contínua ou recorrente. “Regular” comunica esse caráter sem restringir o termo apenas à frequência diária.
- source_word: מִנְחָתָ/הּ
  choice: com a sua oferta de cereal
  rationale: Em listas cultuais, מִנְחָה é a oferta de cereal. O sufixo feminino singular retoma עֹלָה, substantivo feminino em hebraico.
- source_word: וְ/נִסְכָּ/הּ
  choice: e a sua oferta derramada
  rationale: נֶסֶךְ designa a libação que acompanha o sacrifício. “Oferta derramada” é transparente em português atual e preserva o caráter ritual.
