  yaml_path: translation/ot/numbers/029/038.yaml
  text: and one goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: pt
  text: e um bode como oferta pelo pecado[a], além do holocausto regular[b], de sua oferta de cereal e de sua oferta de bebida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um bode macho como oferta pelo pecado”. Em contextos sacrificiais, o termo hebraico pode designar especificamente um bode macho.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o holocausto contínuo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר חַטָּאת אֶחָד
  choice: e um bode como oferta pelo pecado
  rationale: שְׂעִיר designa um bode, particularmente um macho em contextos sacrificiais; אֶחָד indica a quantidade. חַטָּאת designa aqui a oferta pelo pecado.
- source_word: מִ/לְּ/בַד
  choice: além de
  rationale: Indica que a oferta mencionada é adicional ao sacrifício recorrente já prescrito.
- source_word: עֹלַת הַ/תָּמִיד
  choice: o holocausto regular
  rationale: עֹלָה é o sacrifício totalmente queimado, tradicionalmente chamado de holocausto; הַתָּמִיד descreve seu caráter regular ou contínuo.
- source_word: וּ/מִנְחָתָ/הּ
  choice: com a oferta de cereal que o acompanha
  rationale: No contexto sacerdotal, מִנְחָה é a oferta de cereal. O sufixo feminino retoma עֹלָה; em português, a formulação com 'acompanha' evita uma referência pronominal de gênero potencialmente confusa.
- source_word: וְ/נִסְכָּ/הּ
  choice: e a oferta derramada que o acompanha
  rationale: נֶסֶךְ é uma libação, isto é, uma oferta líquida derramada. A expressão escolhida é acessível e explicita a relação com o holocausto.
