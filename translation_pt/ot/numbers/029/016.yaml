  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: pt
  text: E um bode como oferta pelo pecado[a], além do holocausto regular, da sua oferta de cereal e da sua oferta de bebida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «oferta de purificação».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: bode
  rationale: A expressão designa um caprino macho usado no sacrifício; «bode» comunica naturalmente em português tanto a espécie quanto o sexo.
- source_word: אֶחָד
  choice: um
  rationale: Número cardinal que indica a quantidade do animal sacrificial.
- source_word: חַטָּאת
  choice: oferta pelo pecado
  rationale: No contexto sacrificial, o termo designa a oferta, não o pecado em sentido abstrato. A formulação é tradicional, clara e reconhecível, enquanto a alternativa ritual é preservada em nota.
- source_word: מִלְּבַד
  choice: além de
  rationale: Indica que esse sacrifício se acrescenta à oferta regular prescrita.
- source_word: עֹלַת הַתָּמִיד
  choice: holocausto regular
  rationale: Refere-se ao holocausto prescrito e oferecido repetidamente; «regular» expressa essa recorrência com naturalidade.
- source_word: מִנְחָתָהּ
  choice: a oferta de cereal ... que o acompanha
  rationale: No uso cultual, מִנְחָה é a oferta de cereal. O sufixo feminino singular retoma עֹלָה, o holocausto; em português, a construção com «acompanham» evita uma referência pronominal gramaticalmente ambígua.
- source_word: וְנִסְכָּהּ
  choice: e a oferta derramada que o acompanham
  rationale: נֶסֶךְ é uma oferta líquida vertida junto ao sacrifício. «Oferta derramada» é clara e comunica o ato ritual melhor que o termo menos corrente «libação».
theological_decisions:
- issue: Sentido sacrificial de חַטָּאת
  choice: oferta pelo pecado
  alternative: oferta de purificação
  rationale: «Oferta pelo pecado» mantém a designação bíblica mais reconhecível sem excluir a função purificadora do rito; a alternativa lexical é registrada em nota para preservar a amplitude semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação final foi explicitada com «que o acompanham» para deixar claro que ambas as ofertas pertencem ao holocausto regular.
