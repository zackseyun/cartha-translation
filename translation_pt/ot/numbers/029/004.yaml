  language: pt
  text: e um décimo para cada cordeiro[a], para os sete cordeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um décimo”; neste contexto sacrificial, normalmente significa um décimo de efa.'
