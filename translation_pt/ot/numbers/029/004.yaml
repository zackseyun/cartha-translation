lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: e um décimo
  rationale: A expressão indica uma medida de um décimo. Como o hebraico não explicita aqui “de um efa”, o texto principal preserva sua concisão, deixando a unidade implícita ser esclarecida em nota.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: para cada cordeiro
  rationale: 'Embora a construção seja literalmente “para o cordeiro, um”, no contexto de uma lista sacrificial ela tem sentido distributivo: a quantidade indicada se aplica individualmente a cada cordeiro.'
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: para os sete cordeiros
  rationale: A expressão identifica o conjunto completo ao qual se aplica a porção por cordeiro; o artigo definido do hebraico é preservado naturalmente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa adequada à continuação da lista de ofertas. A formulação “cada cordeiro” comunica naturalmente o valor distributivo sem acrescentar conteúdo teológico.
