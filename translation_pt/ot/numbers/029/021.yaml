  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: pt
  text: e a sua oferta de cereal e as suas ofertas de bebida, para os novilhos, para os carneiros e para os cordeiros, conforme o número deles, segundo a norma prescrita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo a norma estabelecida”. O termo hebraico indica a regra ritual prescrita para essas ofertas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: a oferta de cereal correspondente a eles
  rationale: No contexto sacrificial, מִנְחָה designa a oferta de cereal. A forma é singular com sufixo plural e pode funcionar coletivamente; o singular foi mantido em português.
- source_word: נִסְכֵּיהֶם
  choice: as ofertas derramadas correspondentes a eles
  rationale: נֶסֶךְ é uma oferta líquida vertida no altar. “Ofertas derramadas” comunica o ato ritual com mais clareza ao leitor comum do que o termo técnico “libações”.
- source_word: לַפָּרִים
  choice: para os novilhos
  rationale: פָּרִים refere-se aos bovinos machos destinados ao sacrifício; “novilhos” é a designação cultual corrente e natural em português.
- source_word: לָאֵילִם
  choice: para o carneiro
  rationale: אַיִל designa o carneiro. Embora a forma isolada seja graficamente plural, a tradição massorética lê aqui o singular לָאַיִל, em harmonia com a contagem do sétimo dia em Números 29:20.
- source_word: וְלַכְּבָשִׂים
  choice: e para os cordeiros
  rationale: כֶּבֶשׂ designa um cordeiro, geralmente macho no contexto sacrificial, sem necessidade de explicitar o sexo nesta enumeração.
- source_word: בְּמִסְפָּרָם
  choice: conforme o número deles
  rationale: A expressão determina que as ofertas acompanhantes correspondam à quantidade prescrita dos animais.
- source_word: כַּמִּשְׁפָּט
  choice: segundo o rito prescrito
  rationale: מִשְׁפָּט refere-se aqui à regra ritual estabelecida, não a um julgamento. A formulação torna claro o sentido cultual sem enfraquecer seu caráter normativo.
