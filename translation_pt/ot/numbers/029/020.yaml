base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/020.yaml
  text: 'And on the third day: eleven bulls[a], two rams, fourteen one-year-old lambs without blemish,'
translation:
  language: pt
  text: 'E, no terceiro dia: onze novilhos, dois carneiros e catorze cordeiros de um ano, sem defeito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁלִישִׁי
  choice: No terceiro dia
  rationale: Introduz naturalmente, em português, o próximo item da sequência de ofertas. A coordenação hebraica é adequadamente expressa pela continuidade do contexto, sem necessidade de um “e” inicial.
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: onze novilhos
  rationale: פָּרִים designa bovinos machos usados em sacrifício. “Novilhos” é a designação tradicional, clara e natural em português bíblico contemporâneo; o hebraico, porém, não especifica aqui uma idade exata.
- source_word: אֵילִם שְׁנָיִם
  choice: dois carneiros
  rationale: אֵילִם é o termo comum para carneiros adultos, especialmente em listas sacrificiais.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: catorze cordeiros de um ano
  rationale: A expressão idiomática בְּנֵי שָׁנָה especifica animais de um ano de idade; esta formulação é corrente e inequívoca em português.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No contexto sacrificial, o termo indica animais íntegros, livres de defeito físico. “Sem defeito” comunica isso com clareza e evita a possível ambiguidade moral de “perfeitos”.
