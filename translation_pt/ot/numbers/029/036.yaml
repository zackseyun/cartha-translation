source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: pt
  text: 'E vocês apresentarão um holocausto, uma oferta feita pelo fogo, de aroma agradável a Yahweh[a]: um touro, um carneiro e sete cordeiros de um ano, sem defeito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aroma apaziguador”. A expressão hebraica é uma fórmula sacrificial que indica uma oferta aceita por Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: E vocês apresentarão
  rationale: O hifil de קרב, em contexto sacrificial, significa apresentar ou oferecer; “apresentarão” mantém o sentido ritual e a forma verbal dirigida à comunidade.
- source_word: עֹלָה
  choice: um holocausto
  rationale: Termo sacrificial consagrado em português para a oferta inteiramente queimada, cujo conteúdo sobe em fumaça.
- source_word: אִשֵּׁה
  choice: uma oferta feita pelo fogo
  rationale: Expressa de modo claro que a oferta é realizada por meio do fogo, sem impor a interpretação mais específica de “oferta de alimento”.
- source_word: רֵיחַ נִיחֹחַ
  choice: de aroma agradável
  rationale: Expressão sacrificial fixa que comunica a aceitação da oferta por Deus; a formulação é natural e preserva a imagem olfativa.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica o destinatário da oferta, e o nome divino é transliterado como Yahweh.
- source_word: פַּר אֶחָד
  choice: um novilho
  rationale: פַּר designa um bovino macho usado em sacrifício; “novilho” é a equivalência cultual corrente e natural em português.
- source_word: אַיִל אֶחָד
  choice: um carneiro
  rationale: אַיִל é o termo comum para um carneiro adulto nas listas sacrificiais.
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: sete cordeiros de um ano
  rationale: Reproduz de maneira idiomática a idade exigida pela expressão hebraica “filhos de um ano”, sem acrescentar explicitamente o sexo, que o substantivo não exige aqui.
- source_word: תְּמִימִם
  choice: sem defeito
  rationale: No contexto sacrificial, indica animais íntegros, livres de defeito físico; “sem defeito” é claro e preciso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio e segue a orientação fornecida.
- issue: Sentido de רֵיחַ נִיחֹחַ
  choice: aroma agradável
  alternative: aroma apaziguador
  rationale: A expressão comunica figuradamente que a oferta é aceita por Deus. “Agradável” preserva a metáfora sem afirmar que o sacrifício acalma uma disposição hostil.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se os termos cultuais “holocausto” e “oferta feita pelo fogo”, e o plural “vocês” torna explícito o destinatário coletivo do verbo hebraico.
