base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: pt
  text: juntamente com a oferta de cereal e as ofertas de bebida correspondentes aos touros, aos carneiros e aos cordeiros, conforme o número deles e segundo a norma estabelecida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme o prescrito”. O hebraico se refere à regra ou ao procedimento estabelecido para essas ofertas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה designa a oferta de cereal que acompanha os holocaustos; o singular hebraico foi preservado.
- source_word: נִסְכֵּיהֶם
  choice: as ofertas de bebida
  rationale: נֶסֶךְ designa uma oferta líquida derramada; “ofertas de bebida” é claro, atual e culticamente preciso.
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: correspondentes aos touros, aos carneiros e aos cordeiros
  rationale: O לְ relaciona as ofertas acompanhantes com cada classe de animal; “correspondentes a” expressa essa distribuição com naturalidade em português.
- source_word: בְּמִסְפָּרָם
  choice: conforme o número deles
  rationale: Indica que as quantidades das ofertas acompanhantes variam de acordo com o número dos animais.
- source_word: כַּמִּשְׁפָּט
  choice: segundo a norma estabelecida
  rationale: מִשְׁפָּט refere-se aqui à regra ou ao procedimento cultual fixado, não a um julgamento judicial.
- source_word: וּ
  choice: juntamente com
  rationale: A conjunção liga este fragmento à lista sacrificial do versículo anterior e indica que estas ofertas acompanham os animais.
