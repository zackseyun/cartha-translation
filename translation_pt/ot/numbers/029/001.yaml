  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: pt
  text: E no sétimo mês, no primeiro dia do mês, vocês terão uma santa convocação. Não farão nenhum trabalho habitual. Será para vocês um dia de toque festivo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dia de aclamação”. O termo hebraico teruá indica um som forte e pode se referir a um toque de instrumento, um grito ou uma aclamação, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹדֶשׁ הַ/שְּׁבִיעִי
  choice: E no sétimo mês
  rationale: A preposição בְּ tem sentido temporal, e a conjunção וּ é preservada para manter a sequência do texto legal.
- source_word: בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: A expressão calendárica hebraica significa literalmente o primeiro dia do mês; a forma explícita é clara em português moderno.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: A expressão designa uma reunião sagrada oficialmente convocada; 'santa convocação' conserva seu caráter formal e cultual.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: nenhum trabalho habitual
  rationale: A expressão se refere ao trabalho comum ou ocupacional proibido nos dias festivos, não necessariamente a toda e qualquer atividade.
- source_word: לֹא תַעֲשׂוּ
  choice: Não farão
  rationale: O futuro com valor imperativo preserva em português o tom legislativo da proibição dirigida ao plural.
- source_word: יוֹם תְּרוּעָה
  choice: um dia de toque festivo
  rationale: תְּרוּעָה denota um som forte erguido, como sinal, aclamação ou toque de instrumento. 'Toque festivo' é natural no contexto cultual sem inserir no texto um instrumento que o hebraico não nomeia explicitamente.
- source_word: יִהְיֶה לָכֶם
  choice: Será para vocês
  rationale: A formulação conserva a construção hebraica que apresenta o caráter designado do dia para o povo.
theological_decisions:
- issue: Designação da festa em יוֹם תְּרוּעָה
  choice: um dia de toque festivo
  alternative: um dia de aclamação; um dia de toque de trombeta
  rationale: O versículo caracteriza o dia por seu som, sem empregar um título festivo posterior nem nomear explicitamente um instrumento. Como תְּרוּעָה permanece semanticamente amplo, a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural comunitário é expresso por “vocês”; a cadência legal é preservada sem arcaísmos.
