  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: pt
  text: e um bode como oferta pelo pecado, além do holocausto regular, com sua oferta de cereal e sua oferta de bebida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: e um bode
  rationale: A expressão sacrificial designa um bode macho; em português, “bode” já explicita naturalmente o sexo do animal, e “um” preserva a quantidade.
- source_word: חַטָּאת
  choice: como oferta pelo pecado
  rationale: No contexto sacrificial, o termo designa a oferta ritual, não o pecado em sentido abstrato.
- source_word: מִ/לְּ/בַד
  choice: além de
  rationale: Indica que esse sacrifício era acrescentado à oferta regularmente prescrita.
- source_word: עֹלַת הַ/תָּמִיד
  choice: o holocausto regular
  rationale: תמיד caracteriza a oferta recorrente e permanente; “regular” evita sugerir combustão literalmente ininterrupta.
- source_word: מִנְחָתָ/הּ
  choice: sua oferta de cereal
  rationale: Em listas sacerdotais, מִנְחָה designa a oferta vegetal, normalmente composta de cereal, que acompanha o holocausto.
- source_word: וְ/נִסְכָּ/הּ
  choice: e sua oferta derramada
  rationale: נֶסֶךְ designa a oferta líquida vertida ritualmente; “oferta derramada” é clara e preserva a ação cultual melhor que o termo menos acessível “libação”.
