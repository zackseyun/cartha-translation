  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: pt
  text: e a oferta de cereal deles e as ofertas de bebida deles para os novilhos, para os carneiros e para os cordeiros, segundo o número deles, conforme a prescrição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme a norma estabelecida”. O hebraico כַּמִּשְׁפָּט refere-se à regra determinada para a apresentação dessas ofertas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: a oferta de cereal
  rationale: No contexto sacrificial, מִנְחָה designa especificamente a oferta feita de cereal; o singular funciona coletivamente.
- source_word: נִסְכֵּיהֶם
  choice: as ofertas derramadas correspondentes
  rationale: נֶסֶךְ designa líquidos ritualmente derramados junto aos sacrifícios. A formulação explicita essa ação e o vínculo com os animais enumerados.
- source_word: לַפָּרִים
  choice: aos novilhos
  rationale: פַּר designa bovinos machos usados em sacrifícios; “novilhos” é a forma consagrada e natural em listas sacrificiais em português.
- source_word: לָאֵילִם
  choice: aos carneiros
  rationale: אַיִל designa diretamente o carneiro adulto em contexto sacrificial.
- source_word: וְלַכְּבָשִׂים
  choice: e aos cordeiros
  rationale: כֶּבֶשׂ designa cordeiro, frequentemente macho no uso sacrificial, sem necessidade de explicitar o sexo aqui.
- source_word: בְּמִסְפָּרָם
  choice: segundo o número deles
  rationale: A expressão indica que as ofertas acompanhantes devem corresponder ao número prescrito dos animais.
- source_word: כַּמִּשְׁפָּט
  choice: conforme o que foi prescrito
  rationale: מִשְׁפָּט, neste contexto ritual, refere-se à regra ou procedimento estabelecido; esta tradução comunica o sentido jurídico-procedimental em português corrente.
