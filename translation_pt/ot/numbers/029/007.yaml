base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: pt
  text: No décimo dia deste sétimo mês, vocês terão uma santa convocação e se afligirão[a]; não farão trabalho algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se humilharão” ou “se negarão a si mesmos”. O idioma hebraico diz literalmente “afligirão suas almas” e é uma expressão ritual associada à abnegação, especialmente ao jejum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶעָשׂוֹר
  choice: No décimo dia
  rationale: A construção com preposição e numeral indica uma data no calendário; em português, acrescentar “dia” expressa naturalmente esse sentido temporal.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: deste sétimo mês
  rationale: Preserva tanto a posição do mês no calendário quanto o demonstrativo hebraico, em formulação natural.
- source_word: מִקְרָא קֹדֶשׁ
  choice: uma santa convocação
  rationale: Expressa uma reunião sagrada oficialmente convocada e mantém o caráter formal e cultual da locução hebraica.
- source_word: יִהְיֶה לָכֶם
  choice: vocês terão
  rationale: Transmite de modo claro e natural em português aquilo que deverá haver para a comunidade, preservando o valor do dativo.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: afligirão a si mesmos
  rationale: Mantém a força do idioma ritual de autoaflição sem restringi-lo explicitamente ao jejum nem reduzi-lo a uma atitude apenas interior.
- source_word: נַפְשֹׁתֵיכֶם
  choice: a si mesmos
  rationale: O reflexivo comunica o sentido idiomático sem sugerir uma divisão antropológica entre alma e corpo que não é exigida pelo hebraico.
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: não farão trabalho algum
  rationale: Formulação jurídica natural em português que preserva o caráter abrangente da proibição.
theological_decisions:
- issue: Sentido do idioma ritual וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: afligirão a si mesmos
  alternative: humilharão a si mesmos; se negarão a si mesmos
  rationale: A tradução escolhida conserva a força penitencial e ritual da ordem no contexto do Dia da Expiação, sem identificar toda a prática exclusivamente com o jejum nem suavizá-la como mera humildade interior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Santa convocação” preserva o tom cultual; a sintaxe evita arcaísmos, e “vocês” oferece referência coletiva amplamente compreensível.
