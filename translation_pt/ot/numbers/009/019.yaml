  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: pt
  text: Quando a nuvem permanecia sobre o tabernáculo por muitos dias, os filhos de Israel[a] observavam a ordem de Yahweh[b] e não partiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a incumbência de Yahweh” ou “a obrigação dada por Yahweh”. A expressão hebraica indica uma responsabilidade ou ordem que devia ser observada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  choice: Quando a nuvem permanecia
  rationale: A preposição בְּ com o infinitivo construto introduz uma oração temporal; אָרַךְ indica aqui que a permanência se prolongava. A formulação comunica isso com naturalidade em português.
- source_word: עַל הַמִּשְׁכָּן
  choice: sobre o tabernáculo
  rationale: מִשְׁכָּן designa o santuário móvel no contexto do deserto, e עַל descreve a posição da nuvem sobre ele.
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: Mantém de modo direto a expressão hebraica de duração prolongada.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a forma familiar e pactual do hebraico; a alternativa idiomática é indicada em nota.
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת יְהוָה
  choice: cumpriam o dever para com Yahweh
  rationale: A combinação שׁמר + מִשְׁמֶרֶת expressa a observância cuidadosa de uma responsabilidade ou incumbência. Esta formulação é natural em português sem reduzi-la necessariamente a um mandamento pontual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְלֹא יִסָּעוּ
  choice: e não partiam
  rationale: No contexto das jornadas pelo deserto, נסע significa levantar acampamento e seguir viagem; “partiam” comunica isso de maneira concisa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. A transliteração preserva o nome pactual, sem substituí-lo por um título.
- issue: Forma de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A escolha conserva a expressão hebraica masculina e sua dimensão familiar, enquanto a nota oferece a equivalência coletiva natural.
- issue: Sentido de מִשְׁמֶרֶת יְהוָה
  choice: o dever para com Yahweh
  alternative: a incumbência de Yahweh; a determinação de Yahweh
  rationale: O substantivo pode indicar encargo, dever ou obrigação. “Dever para com Yahweh” preserva a noção de responsabilidade contínua no contexto sem especificar além do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O paralelismo temporal e a ideia de permanência prolongada foram mantidos; as notas preservam as alternativas lexicais relevantes.
