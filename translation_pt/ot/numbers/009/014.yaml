id: NUM.9.14
reference: Numbers 9:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: pt
  text: E, se um estrangeiro residente[a] morar entre vocês e quiser celebrar a Páscoa[b] em honra de Yahweh, deverá celebrá-la conforme o estatuto da Páscoa e conforme a sua ordenança; assim deverá fazer. Haverá um só estatuto para vocês, para o estrangeiro residente e para o natural da terra.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico ger designa um estrangeiro que vive como residente no meio de Israel, não apenas alguém de passagem.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, literalmente, “fará a Páscoa”, expressão idiomática que significa observá-la ou celebrá-la.
    reason: lexical_alternative
  - marker: c
    text: Ou “nascido na terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Preserva tanto a ligação com a legislação anterior quanto a introdução de uma situação condicional.
- source_word: יָגוּר ... גֵּר
  choice: um estrangeiro residente morar entre vocês
  rationale: גֵּר designa um estrangeiro que reside no meio de Israel, não um simples viajante. A combinação evita o sentido moderno e pouco preciso de “estranho”.
- source_word: וְעָשָׂה פֶסַח
  choice: quiser celebrar a Páscoa
  rationale: A construção hebraica significa literalmente “fizer a Páscoa”, expressão idiomática para observá-la ou celebrá-la. O valor volitivo da forma no contexto condicional é expresso naturalmente por “quiser celebrar”.
- source_word: לַיהוָה
  choice: em honra de Yahweh
  rationale: A preposição indica que a celebração é dirigida ou dedicada a Yahweh; “em honra de” comunica isso com naturalidade em português.
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: conforme o estatuto da Páscoa
  rationale: חֻקָּה denota uma prescrição estabelecida; “estatuto” conserva o caráter jurídico-ritual.
- source_word: וּכְמִשְׁפָּטוֹ
  choice: e conforme a sua ordenança
  rationale: מִשְׁפָּט refere-se aqui à regra ou ao procedimento que rege o rito. “Ordenança” mantém a distinção possível em relação a חֻקָּה sem exagerá-la.
- source_word: כֵּן יַעֲשֶׂה
  choice: assim deverá fazer
  rationale: Mantém a ênfase na conformidade com o modo prescrito e o valor normativo da cláusula.
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: Haverá um só estatuto
  rationale: Expressa de modo claro a existência de uma única norma vinculante para os grupos mencionados.
- source_word: לָכֶם וְלַגֵּר וּלְאֶזְרַח הָאָרֶץ
  choice: para vocês, para o estrangeiro residente e para o natural da terra
  rationale: Preserva a aplicação paralela da mesma norma ao público israelita, ao residente estrangeiro e ao natural da terra, sem introduzir a categoria política moderna de cidadania.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o tetragrama. “Yahweh” preserva o nome da aliança e segue a orientação lexical fornecida sem substituí-lo por um título.
- issue: Alcance da igualdade jurídica declarada
  choice: Um só estatuto rege os grupos mencionados no contexto da celebração da Páscoa
  alternative: Uma afirmação geral e irrestrita de igualdade jurídica em todos os assuntos
  rationale: O versículo declara explicitamente uma única prescrição para o israelita e o estrangeiro residente, mas o contexto imediato limita a afirmação à observância da Páscoa; a tradução não amplia nem reduz esse alcance.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Estrangeiro residente” explicita a condição social de גֵּר; “natural da terra” evita associações modernas indevidas com cidadania. A repetição de “conforme” e “para” conserva o paralelismo jurídico do hebraico.
