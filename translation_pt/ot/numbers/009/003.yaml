  text: בְּ/אַרְבָּעָ֣ה עָשָֽׂר י֠וֹם בַּ/חֹ֨דֶשׁ הַ/זֶּ֜ה בֵּ֧ין הָֽ/עֲרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖/וֹ בְּ/מוֹעֲד֑/וֹ כְּ/כָל חֻקֹּתָ֥י/ו וּ/כְ/כָל מִשְׁפָּטָ֖י/ו תַּעֲשׂ֥וּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: pt
  text: No décimo quarto dia deste mês, entre as duas tardes[a], vocês celebrarão a Páscoa no tempo determinado. Vocês a celebrarão conforme todos os seus estatutos e todas as suas ordenanças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão hebraica tradicional que designa o período ao redor do crepúsculo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם בַּחֹדֶשׁ הַזֶּה
  choice: No décimo quarto dia deste mês
  rationale: Expressa naturalmente em português a data específica indicada pelo idioma hebraico.
- source_word: בֵּין הָעַרְבַּיִם
  choice: entre as duas tardes
  rationale: Preserva a formulação temporal técnica e tradicional do hebraico, cuja delimitação exata é discutida, sem reduzi-la silenciosamente a uma interpretação única.
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: vocês celebrarão a Páscoa / Vocês a celebrarão
  rationale: Com a Páscoa como referente contextual, עשה significa realizá-la ou celebrá-la. A explicitação inicial do referente torna o português claro, e a retomada pronominal preserva a repetição do comando.
- source_word: בְּמוֹעֲדוֹ
  choice: no tempo determinado
  rationale: מוֹעֵד designa aqui o tempo fixado para a celebração ritual.
- source_word: כְּכָל חֻקֹּתָיו
  choice: conforme todos os seus estatutos
  rationale: Mantém o sentido formal e prescritivo de חֻקּוֹת no contexto legal e ritual.
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: e todas as suas ordenanças
  rationale: Representa מִשְׁפָּטִים como determinações normativas e conserva uma distinção lexical em relação a 'estatutos'.
