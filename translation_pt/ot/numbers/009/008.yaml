base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: pt
  text: 'E Moisés lhes disse: “Esperem[a], e ouvirei o que Yahweh ordenará a respeito de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fiquem de pé”, preservando mais de perto o sentido literal do imperativo hebraico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém o fluxo narrativo do waw consecutivo de modo natural em português.
- source_word: אֲלֵהֶם
  choice: lhes
  rationale: Representa de forma concisa e idiomática o complemento plural ‘a eles’.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: עִמְדוּ
  choice: Esperem
  rationale: Embora o sentido básico seja ‘ficar de pé’, no contexto o imperativo pede que eles permaneçam ali e aguardem; a alternativa literal é preservada em nota.
- source_word: וְאֶשְׁמְעָה
  choice: enquanto ouço
  rationale: Expressa a intenção de Moisés de receber a resposta divina, preservando o verbo hebraico ‘ouvir’ sem explicitação indevida.
- source_word: מַה
  choice: o que
  rationale: Introduz naturalmente em português o conteúdo da ordem esperada.
- source_word: יְצַוֶּה
  choice: ordenará
  rationale: O piel imperfeito de צוה indica o que Yahweh haverá de ordenar nessa situação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לָכֶם
  choice: a respeito de vocês
  rationale: No contexto, a preposição indica que a ordem solicitada trata do caso daqueles homens; esta formulação é clara e natural.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; ‘Yahweh’ preserva o nome pessoal e evita substituí-lo por um título.
- issue: Alcance de לָכֶם na ordem divina
  choice: a respeito de vocês
  alternative: para vocês; a vocês
  rationale: A formulação mantém a possibilidade contextual de uma determinação referente ao caso deles, sem afirmar que se trata apenas de benefício ou de discurso diretamente endereçado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção ‘enquanto ouço’ evita a sequência menos idiomática ‘esperem, e ouvirei’, sem acrescentar que Moisés consultaria Yahweh por um meio específico.
