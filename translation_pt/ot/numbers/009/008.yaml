  source_fidelity: 'A tradução transmite corretamente os elementos centrais do hebraico: Moisés fala ao grupo, pede que aguardem, declara que ouvirá, e aguarda o que Yahweh ordenará לגבי eles. Contudo, «enquanto ouço» transforma a coordenação hebraica («Esperem, e ouvirei») numa ação explicitamente simultânea, nuance que o original não exige.'
