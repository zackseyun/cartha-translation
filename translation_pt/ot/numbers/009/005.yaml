source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: pt
  text: Assim, celebraram a Páscoa no primeiro mês, no décimo quarto dia do mês, ao entardecer[a], no deserto do Sinai. Conforme tudo o que Yahweh havia ordenado a Moisés, assim fizeram os filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “entre as tardes”, expressão que se refere ao período do crepúsculo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: celebraram / fizeram
  rationale: O verbo עשה significa literalmente “fazer”, mas, quando rege פֶּסַח, expressa a celebração ou observância da Páscoa. “Celebraram” é natural em português nesse contexto ritual, enquanto “fizeram” preserva a formulação conclusiva do hebraico.
- source_word: הַפֶּסַח
  choice: a Páscoa
  rationale: No contexto, פֶּסַח designa a observância pascal como um todo, sem restringir a referência apenas ao sacrifício ou à vítima.
- source_word: בָּרִאשׁוֹן
  choice: no primeiro mês
  rationale: O substantivo “mês” está implícito no hebraico e é explicitado em português por clareza, conforme a fórmula calendárica subsequente.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: no décimo quarto dia do mês
  rationale: Reproduz com clareza e proximidade formal a fórmula hebraica de datação.
- source_word: בֵּין הָעַרְבַּיִם
  choice: ao entardecer
  rationale: A expressão idiomática hebraica, literalmente “entre as tardes”, indica o período do crepúsculo. “Ao entardecer” comunica esse sentido em português natural; a forma literal é registrada em nota.
- source_word: בְּמִדְבַּר סִינָי
  choice: no deserto do Sinai
  rationale: מִדְבָּר designa uma região desértica ou erma; “deserto do Sinai” é corrente, claro e adequado ao cenário geográfico.
- source_word: כְּכֹל אֲשֶׁר
  choice: conforme tudo o que
  rationale: A formulação preserva a ênfase hebraica na plena conformidade com a ordem recebida.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito deixa clara em português a anterioridade da ordem dada a Moisés em relação à ação de Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão filial e coletivamente masculina do hebraico, sem reduzi-la ao gentílico “israelitas”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, sem substituí-lo por um título.
- issue: Expressão coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A escolha mantém a forma filial explícita do original e seu uso coletivo, sem neutralizar a expressão.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe conclusiva “conforme... assim fizeram” conserva a correspondência enfática do hebraico, enquanto a primeira ocorrência idiomática de עשה é vertida naturalmente por “celebraram”.
