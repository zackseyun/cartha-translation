source:
  edition: WLC
  text: אֽוֹ יֹמַ֜יִם אוֹ חֹ֣דֶשׁ אוֹ יָמִ֗ים בְּ/הַאֲרִ֨יךְ הֶ/עָנָ֤ן עַל הַ/מִּשְׁכָּן֙ לִ/שְׁכֹּ֣ן עָלָ֔י/ו יַחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל וְ/לֹ֣א יִסָּ֑עוּ וּ/בְ/הֵעָלֹת֖/וֹ יִסָּֽעוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: pt
  text: Quer fosse por dois dias, por um mês ou por muitos dias[a], enquanto a nuvem permanecia sobre o tabernáculo, repousando sobre ele, os israelitas ficavam acampados e não partiam; mas, quando ela era elevada, eles partiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “dias”; neste contexto, provavelmente indica muitos dias ou um período mais longo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: Quer fosse por ... por ... ou por ...
  rationale: Reproduz em português natural a sequência disjuntiva que apresenta diferentes durações possíveis.
- source_word: יֹמַיִם
  choice: dois dias
  rationale: A forma dual indica especificamente dois dias.
- source_word: חֹדֶשׁ
  choice: um mês
  rationale: O artigo indefinido é natural na enumeração de períodos.
- source_word: יָמִים
  choice: muitos dias
  rationale: Embora signifique literalmente “dias”, depois de “dois dias” e “um mês” o plural indica, no contexto, uma permanência prolongada; “muitos dias” conserva tanto a forma concreta quanto esse sentido.
- source_word: בְּהַאֲרִיךְ
  choice: enquanto ... permanecesse
  rationale: O infinitivo causativo de ארך expressa a continuação prolongada da presença da nuvem; a construção temporal encaixa-se naturalmente na frase portuguesa.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: Equivalente comum e direto para a nuvem que guiava Israel no deserto.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: Termo bíblico estabelecido e ainda compreensível para o santuário portátil.
- source_word: לִשְׁכֹּן עָלָיו
  choice: repousando sobre ele
  rationale: Expressa a presença estável da nuvem acima do tabernáculo sem sugerir mero movimento momentâneo.
- source_word: יַחֲנוּ
  choice: ficavam acampados
  rationale: 'O imperfeito descreve a ação habitual: durante a permanência da nuvem, o povo continuava no acampamento.'
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Demonímico natural e exato em português para o coletivo designado pela expressão hebraica “filhos de Israel”.
- source_word: וְלֹא יִסָּעוּ
  choice: e não partiam
  rationale: No contexto de viagem, נסע indica levantar acampamento e seguir caminho; “partiam” é claro e conciso.
- source_word: וּבְהֵעָלֹתוֹ
  choice: mas, quando ela se levantava
  rationale: Mantém a referência à nuvem e o contraste entre sua permanência e sua elevação, sinal para a partida.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição final de “partiam” preserva o contraste enfático do hebraico.
