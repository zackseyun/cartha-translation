  terminology: «Páscoa» é o termo tradicional e apropriado. «Observar a Páscoa» exprime de modo mais exato o sentido ritual de יַעֲשׂוּ אֹתוֹ sem introduzir conotações adicionais de festividade. «Regulamento» traduz naturalmente חֻקָּה como prescrição coletiva.
