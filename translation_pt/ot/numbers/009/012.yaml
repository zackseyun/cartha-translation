  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: pt
  text: Não deixarão nada dele até a manhã e não quebrarão nenhum dos seus ossos[a]. Deverão observar a Páscoa de acordo com todo o seu regulamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Essa exigência repete a instrução sobre a Páscoa em Êxodo 12:46.
    reason: cross_reference
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: Não deixarão nada dele até a manhã
  rationale: O hifil de שׁאר expressa deixar ou deixar sobrar; מִמֶּנּוּ tem sentido partitivo. A formulação é natural em português e preserva o limite temporal.
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: e não quebrarão nenhum dos seus ossos
  rationale: O singular עֶצֶם tem valor distributivo. Esta formulação comunica com clareza a proibição de quebrar qualquer osso, sem alterar seu conteúdo.
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: de acordo com todos os estatutos da Páscoa
  rationale: חֻקָּה designa uma determinação ou prescrição. Embora esteja no singular coletivo após כָּל, o plural português transmite naturalmente o conjunto completo das prescrições da Páscoa.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: Deverão celebrá-lo
  rationale: עשה, quando usado a respeito de uma festa ritual, significa realizá-la, observá-la ou celebrá-la. 'Celebrá-lo' é claro e atual, e o pronome retoma a Páscoa.
theological_decisions:
- issue: Possível significado intertextual da exigência de não quebrar os ossos
  choice: Traduzir diretamente como uma prescrição da Páscoa, sem inserir interpretação cristológica no texto principal.
  alternative: Empregar linguagem moldada para destacar explicitamente o tema posterior de cumprimento no Novo Testamento.
  rationale: No contexto imediato, o hebraico estabelece regras para a observância da Páscoa. A tradução deve preservar esse sentido textual, enquanto a nota pode indicar o paralelo anterior em Êxodo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. 'Páscoa' conserva o nome tradicional da celebração; 'celebrá-lo' evita o literalismo pouco natural de 'fazê-lo'. O marcador [a] aparece imediatamente após a cláusula pertinente.
