  text: So Moses told the sons of Israel to keep the Passover.
translation:
  language: pt
  text: Então Moisés disse aos filhos de Israel que celebrassem a Páscoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: disse
  rationale: O verbo דיבר significa literalmente “falar”; neste contexto, “disse” introduz com naturalidade a instrução comunicada por Moisés.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a expressão coletiva hebraica e a continuidade terminológica do livro, sem limitar a referência apenas aos homens.
- source_word: לַעֲשֹׂת הַפָּסַח
  choice: que celebrassem a Páscoa
  rationale: A expressão idiomática “fazer a Páscoa” refere-se à observância ou celebração da festa; “celebrassem” comunica esse sentido claramente em português moderno.
theological_decisions:
- issue: Sentido de עשה aplicado à Páscoa
  choice: celebrassem a Páscoa
  alternative: fizessem a Páscoa; observassem a Páscoa
  rationale: “Celebrar” expressa o cumprimento ritual ordenado no contexto sem acrescentar uma interpretação denominacional; “fazer” seria excessivamente literal e pouco natural em português.
translation_notes:
  register: Português atual, claro e digno, com sintaxe natural e leitura ampla no contexto brasileiro. A construção final subordinada preserva o conteúdo de propósito/instrução do infinitivo hebraico.
