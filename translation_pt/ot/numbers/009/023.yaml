base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: pt
  text: Por ordem de Yahweh, eles acampavam e, por ordem de Yahweh, partiam. Observavam o encargo de Yahweh conforme a ordem de Yahweh, dada por meio de Moisés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés”, expressão que significa “por meio de Moisés” ou “tendo Moisés como mediador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: por ordem de
  rationale: A expressão significa literalmente “segundo a boca de”, mas funciona aqui como um idiomatismo de comando ou determinação. “Por ordem de” é natural em português e mantém a autoridade da orientação divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em conformidade com a prática do projeto.
- source_word: יַחֲנוּ
  choice: acampavam
  rationale: O verbo indica estabelecer acampamento. O imperfeito em português comunica adequadamente a ação habitual descrita no resumo narrativo.
- source_word: יִסָּעוּ
  choice: partiam
  rationale: No contexto das jornadas pelo deserto, o verbo descreve levantar acampamento e iniciar a marcha. “Partiam” é claro e natural, sem acrescentar detalhes ausentes do hebraico.
- source_word: מִשְׁמֶרֶת
  choice: encargo
  rationale: O substantivo designa uma responsabilidade confiada para ser guardada ou cumprida. “Encargo” preserva tanto a ideia de incumbência quanto a de obrigação.
- source_word: שָׁמָרוּ
  choice: cumpriam
  rationale: Embora o verbo possa significar “guardar” ou “observar”, com “encargo” o português idiomático pede “cumprir”, mantendo o sentido de obediência fiel.
- source_word: בְּיַד מֹשֶׁה
  choice: transmitida por meio de Moisés
  rationale: 'A expressão literal “pela mão de Moisés” indica mediação ou agência. A formulação escolhida torna explícita a função idiomática sem alterar quem dá a ordem: Yahweh.'
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual e segue a convenção lexical do projeto.
- issue: Relação entre a ordem divina e a mediação de Moisés
  choice: “ordem de Yahweh transmitida por meio de Moisés”
  alternative: “ordem de Yahweh pela mão de Moisés”
  rationale: A tradução mantém Yahweh como fonte da ordem e Moisés como mediador, sem atribuir a Moisés uma autoridade independente nem eliminar a imagem hebraica, que é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais no imperfeito para refletir o caráter habitual e resumitivo das ações no contexto. A repetição de “por ordem de Yahweh” foi preservada por sua função enfática no hebraico.
