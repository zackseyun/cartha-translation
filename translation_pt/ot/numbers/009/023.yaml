revisions:
- from: Por ordem de Yahweh, eles acampavam; e, por ordem de Yahweh, partiam. Cumpriam o encargo de Yahweh conforme a ordem de Yahweh transmitida por meio de Moisés.[a]
  to: Por ordem de Yahweh, eles acampavam e, por ordem de Yahweh, partiam. Observavam o encargo de Yahweh conforme a ordem de Yahweh, dada por meio de Moisés.[a]
  rationale: A revisão remove uma explicitação desnecessária («transmitida»), melhora a fluidez da primeira frase e conserva a tríplice referência à ordem de Yahweh. «Dada por meio de Moisés» expressa, de modo natural, a agência/medição indicada pela locução hebraica בְּיַד מֹשֶׁה, enquanto a nota registra a forma literal e suas alternativas.
