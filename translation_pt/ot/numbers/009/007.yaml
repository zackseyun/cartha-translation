base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: pt
  text: 'Aqueles homens lhe disseram: “Estamos impuros por causa de um cadáver humano.[a] Por que deveríamos ser impedidos[b] de apresentar a oferta de Yahweh no tempo determinado para ela, entre os filhos de Israel?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “por uma alma de ser humano”, expressão que, neste contexto, se refere à impureza causada por um cadáver humano.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ser excluídos” ou “ser privados”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: Aqueles homens lhe disseram
  rationale: Reproduz com naturalidade a sequência narrativa e o valor deítico do demonstrativo hebraico, mantendo a referência contextual a Moisés.
- source_word: טְמֵאִים
  choice: impuros
  rationale: Em português bíblico atual, “impuros” expressa com clareza o estado ritual, sem sugerir meramente falta de higiene.
- source_word: לְנֶפֶשׁ אָדָם
  choice: por causa de um cadáver humano
  rationale: A expressão hebraica é idiomática e, neste contexto legal, indica impureza decorrente de contato com um cadáver humano; a tradução explicita esse sentido sem acrescentar detalhes não declarados.
- source_word: נִגָּרַע לְבִלְתִּי הַקְרִב
  choice: deveríamos ser impedidos de apresentar
  rationale: 'Comunica o valor passivo de נגרע e a consequência expressa pelo infinitivo: não poder participar da apresentação da oferta.'
- source_word: קָרְבַּן יְהוָה
  choice: a oferta de Yahweh
  rationale: “Oferta” é natural no contexto sacrificial, e “Yahweh” preserva o nome divino representado pelo tetragrama.
- source_word: בְּמֹעֲדוֹ
  choice: no tempo determinado para ela
  rationale: Expressa o momento fixado para a oferta e torna explícita, de modo natural em português, a referência do sufixo hebraico.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: no meio dos filhos de Israel
  rationale: Mantém a expressão pactual hebraica e traduz בְּתוֹךְ de forma direta e inteligível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Natureza da impureza em לְנֶפֶשׁ אָדָם
  choice: impureza por causa de um cadáver humano
  alternative: impureza por causa de um morto; impureza por uma pessoa morta
  rationale: A formulação escolhida preserva o sentido ritual ligado a cadáver sem especificar além do texto como ocorreu o contato.
- issue: Sentido de נִגָּרַע
  choice: ser impedidos
  alternative: ser excluídos; ser privados
  rationale: A escolha mantém a queixa dos homens em forma de pergunta sem decidir se eles reivindicam um direito absoluto ou apenas pedem uma solução para sua exclusão ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “filhos de Israel” como expressão bíblica do original e usa “Yahweh” para o nome divino. A pergunta foi formulada naturalmente, sem eliminar a força de protesto nem resolver além do texto a condição ritual dos homens.
