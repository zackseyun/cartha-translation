base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: pt
  text: No segundo mês, no décimo quarto dia, ao entardecer[a], eles a celebrarão; deverão comê-la com pães sem fermento e ervas amargas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre as tardes”, expressão que indica o período em torno do pôr do sol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: No segundo mês
  rationale: Em contexto de calendário, חֹדֶשׁ significa normalmente “mês”; a expressão introduz a data da celebração.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: no décimo quarto dia
  rationale: A construção cardinal hebraica funciona como indicação de data; o ordinal é a forma natural em português.
- source_word: בֵּין הָעַרְבַּיִם
  choice: ao entardecer
  rationale: A expressão idiomática designa o período em torno do pôr do sol. “Ao entardecer” é claro e natural, enquanto a forma literal é preservada em nota.
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: eles a celebrarão
  rationale: Neste contexto, עשה significa realizar ou celebrar a Páscoa, e não apenas “fazer”. O pronome feminino concorda naturalmente com “Páscoa” em português, subentendida pelo contexto.
- source_word: עַל מַצּוֹת
  choice: com pães sem fermento
  rationale: Neste contexto de refeição, עַל indica acompanhamento. O plural מַצּוֹת é reproduzido por “pães sem fermento”, expressão clara para leitores atuais.
- source_word: וּמְרֹרִים
  choice: e ervas amargas
  rationale: O substantivo plural refere-se aos alimentos vegetais amargos consumidos na Páscoa; “ervas amargas” é a formulação tradicional e contextualmente precisa.
- source_word: יֹאכְלֻהוּ
  choice: deverão comê-la
  rationale: O imperfeito em contexto legal expressa obrigação. O pronome retoma a Páscoa, entendida aqui como a refeição ou oferta pascal.
