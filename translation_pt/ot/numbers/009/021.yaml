  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: pt
  text: Às vezes, a nuvem permanecia desde a tarde até a manhã; quando a nuvem se elevava pela manhã[a], eles partiam. Ou, se permanecia durante um dia e uma noite, quando a nuvem se elevava, eles partiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando a nuvem era levantada pela manhã”. O verbo hebraico permite essa formulação, mas “se elevava” expressa de modo mais natural o movimento da nuvem sem indicar quem o causava.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Às vezes
  rationale: A expressão introduz uma ocorrência possível dentro do padrão descrito; esta formulação é natural e preserva seu caráter ocasional.
- source_word: יִהְיֶה הֶעָנָן
  choice: a nuvem permanecia
  rationale: Embora היה signifique literalmente “ser/estar”, o intervalo temporal que se segue lhe confere sentido durativo neste contexto.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: desde a tarde até a manhã
  rationale: Reproduz com clareza os limites inicial e final do período.
- source_word: וְנַעֲלָה הֶעָנָן
  choice: quando a nuvem se elevava
  rationale: O nifal de עלה descreve a nuvem erguendo-se de sobre o tabernáculo, movimento que servia de sinal para a partida; a construção reflexiva é natural em português e não explicita um agente ausente do hebraico.
- source_word: וְנָסָעוּ
  choice: eles partiam
  rationale: No contexto das jornadas pelo deserto, נסע indica levantar acampamento e sair; “partiam” comunica concisamente a ação sem acrescentar detalhes.
- source_word: יוֹמָם וָלַיְלָה
  choice: durante um dia e uma noite
  rationale: No paralelismo com “desde a tarde até a manhã”, a expressão indica a duração da permanência da nuvem, não apenas dois períodos em que algo ocorria.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição intencional de “quando a nuvem se elevava” para conservar a estrutura formular do hebraico. O pronome “eles” mantém explícito o sujeito coletivo de Israel sem introduzir uma identificação ausente neste versículo.
