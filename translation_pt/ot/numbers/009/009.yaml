  yaml_path: translation/ot/numbers/009/009.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente a sequência, e “falou” traduz דבר no contexto de uma fórmula que introduz discurso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: 'Equivalente direcional natural em português com o verbo “falar”: “falou a Moisés”.'
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz a fala que vem a seguir. Em português atual, os dois-pontos cumprem essa função de modo natural, evitando o pouco idiomático “dizendo” ao fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e o distingue do título “Senhor”, enquanto “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. Os dois-pontos introduzem naturalmente o discurso que começa no versículo seguinte.
