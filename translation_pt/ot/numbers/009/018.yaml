id: NUM.9.18
reference: Numbers 9:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: pt
  text: À ordem de Yahweh, os israelitas partiam[a], e à ordem de Yahweh acampavam. Durante todo o tempo em que a nuvem permanecia sobre o tabernáculo, eles permaneciam acampados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “sobre a boca de Yahweh”; expressão idiomática que significa “à ordem de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: À ordem de Yahweh
  rationale: A expressão idiomática hebraica significa literalmente “sobre a boca de Yahweh”, mas comunica que os deslocamentos e acampamentos aconteciam segundo sua ordem. A formulação portuguesa é natural e mantém a autoridade da direção divina.
- source_word: יִסְעוּ
  choice: partiam
  rationale: No contexto das jornadas pelo deserto, נסע indica levantar acampamento e iniciar o deslocamento. “Partiam” expressa isso com clareza, sem acrescentar detalhes não explícitos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Embora a forma hebraica seja literalmente “os filhos de Israel”, “os israelitas” é a designação coletiva natural em português e inclui todo o povo que viajava.
- source_word: יַחֲנוּ
  choice: acampavam / permaneciam acampados
  rationale: חנה significa acampar. O imperfeito, dentro desta descrição habitual, é traduzido por “acampavam”; na oração final, o contexto durativo justifica “permaneciam acampados”.
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: Durante todo o tempo em que
  rationale: A expressão literalmente se refere a “todos os dias em que”, mas funciona como indicação de duração. A escolha transmite esse valor de modo idiomático.
- source_word: יִשְׁכֹּן
  choice: permanecia
  rationale: שכן pode significar habitar, pousar ou permanecer. Tendo a nuvem como sujeito, “permanecia” comunica sua presença contínua sobre o tabernáculo sem impor uma imagem mais específica.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: מִשְׁכָּן designa a habitação sagrada de Yahweh. “Tabernáculo” é o termo tradicional preciso e distingue esta palavra de אֹהֶל מוֹעֵד, “tenda do encontro”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino, em vez de substituí-lo por um título.
- issue: Valor verbal das ações de partir e acampar
  choice: 'Ações habituais: “partiam” e “acampavam”'
  alternative: 'Ações pontuais: “partiram” e “acamparam”'
  rationale: O versículo resume o padrão contínuo de direção divina durante as jornadas, especialmente à luz da oração temporal seguinte. O imperfeito português exprime naturalmente esse caráter repetido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “israelitas” como designação coletiva natural e preserva “Yahweh” e “tabernáculo” como termos bíblicos precisos.
