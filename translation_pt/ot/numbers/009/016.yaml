  text: כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶ/עָנָ֖ן יְכַסֶּ֑/נּוּ וּ/מַרְאֵה אֵ֖שׁ לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: pt
  text: 'Era sempre assim: a nuvem o cobria e, à noite, tinha aparência de fogo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, à noite, parecia fogo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Assim
  rationale: Introduz o resumo do padrão descrito no contexto e preserva de modo natural a força demonstrativa do hebraico.
- source_word: יִהְיֶה
  choice: acontecia
  rationale: O imperfeito descreve aqui uma situação habitual no passado; “acontecia” expressa esse padrão recorrente em português corrente.
- source_word: תָמִיד
  choice: continuamente
  rationale: Comunica a constância duradoura do fenômeno sem reduzir o sentido a mera frequência regular.
- source_word: הֶעָנָן
  choice: a nuvem
  rationale: O substantivo definido retoma a nuvem já conhecida no contexto imediato.
- source_word: יְכַסֶּנּוּ
  choice: o cobria
  rationale: O verbo significa cobrir ou ocultar, e o sufixo masculino singular remete mais naturalmente ao tabernáculo mencionado no contexto.
- source_word: וּמַרְאֵה אֵשׁ
  choice: e ... havia uma aparência de fogo
  rationale: “Aparência de fogo” preserva a formulação cautelosa de מַרְאֶה, sem decidir se era fogo literal ou algo semelhante a fogo; “havia” completa naturalmente a frase elíptica em português.
- source_word: לָיְלָה
  choice: à noite
  rationale: Expressão temporal idiomática e clara em português moderno.
theological_decisions:
- issue: Referente do sufixo pronominal em יְכַסֶּנּוּ
  choice: “o”, referindo-se ao tabernáculo
  alternative: “lhe” ou “a ele”, entendido como referente pessoal
  rationale: Embora o sufixo hebraico seja masculino singular e possa formalmente corresponder a “ele”, o contexto imediato trata do tabernáculo coberto pela nuvem. “O cobria” preserva o gênero gramatical português de “tabernáculo” sem personificar o referente.
- issue: Natureza do fenômeno noturno em וּמַרְאֵה אֵשׁ
  choice: “uma aparência de fogo”
  alternative: “algo semelhante a fogo” ou simplesmente “fogo”
  rationale: A tradução mantém a tensão lexical do hebraico, que descreve o aspecto visível sem afirmar de forma inequívoca que se tratava de fogo literal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem “à noite” foi antecipada para tornar fluente a oração elíptica, sem alterar seu sentido.
