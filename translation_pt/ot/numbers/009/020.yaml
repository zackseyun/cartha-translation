  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: pt
  text: Às vezes, a nuvem permanecia sobre o tabernáculo por alguns dias. Por ordem de Yahweh[a], eles acampavam, e por ordem de Yahweh partiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “segundo a boca de Yahweh”, isto é, por ordem de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: Às vezes
  rationale: A expressão introduz uma das circunstâncias variáveis descritas no contexto; “Às vezes” é natural e preserva o caráter recorrente.
- source_word: יִהְיֶה הֶעָנָן
  choice: a nuvem permanecia
  rationale: Neste contexto de deslocamento, היה indica a permanência da nuvem em determinado lugar, não mera existência.
- source_word: יָמִים מִסְפָּר
  choice: por alguns dias
  rationale: A expressão hebraica significa literalmente dias contados ou em número limitado; “alguns dias” comunica isso naturalmente sem fixar uma quantidade exata.
- source_word: עַל הַמִּשְׁכָּן
  choice: sobre o tabernáculo
  rationale: “Tabernáculo” é o termo português estabelecido para a estrutura sagrada no deserto, e “sobre” expressa a posição da nuvem.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: A expressão significa literalmente “segundo a boca de Yahweh”, um idiomatismo que aqui designa sua instrução autoritativa.
- source_word: יַחֲנוּ
  choice: eles acampavam
  rationale: O imperfeito descreve uma ação habitual ou repetida dentro desse padrão de viagem.
- source_word: יִסָּעוּ
  choice: partiam
  rationale: No contexto das jornadas no deserto, נסע se refere a levantar acampamento e seguir viagem; “partiam” é claro e natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Natureza da orientação divina em עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  alternative: segundo a boca de Yahweh
  rationale: A tradução idiomática transmite autoridade e direção divina sem sugerir um mecanismo específico de comunicação que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “por ordem de Yahweh” foi mantida para refletir a estrutura enfática do hebraico.
