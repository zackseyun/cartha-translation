reference: Numbers 9:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: pt
  text: Sempre que a nuvem se elevava de cima da tenda[a], depois disso os filhos de Israel[b] partiam; e, no lugar onde a nuvem pousava, ali os filhos de Israel acampavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de cima do tabernáculo”, pois aqui “a tenda” se refere à tenda do tabernáculo.
    reason: lexical_alternative
  - marker: b
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: Sempre que ... se elevava
  rationale: A construção לְפִי com o infinitivo, neste contexto, introduz uma circunstância recorrente. “Sempre que” comunica esse valor iterativo, e “se elevava” traduz naturalmente o movimento da nuvem sem especificar um agente não expresso.
- source_word: מֵעַל הָאֹהֶל
  choice: de cima da tenda
  rationale: Preserva o sentido espacial de מֵעַל e o significado direto de אֹהֶל, “tenda”; o referente contextual é a tenda do tabernáculo.
- source_word: וְאַחֲרֵי כֵן
  choice: depois disso
  rationale: Mantém explícita a sequência temporal indicada pelo hebraico.
- source_word: יִסְעוּ
  choice: partiam
  rationale: O imperfeito tem valor habitual neste relato de procedimento recorrente. “Partiam” é claro e natural em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão familiar literal do hebraico. A alternativa idiomática “os israelitas” é registrada em nota.
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: e, no lugar onde
  rationale: Reproduz de modo claro a estrutura locativa explícita do texto hebraico.
- source_word: יִשְׁכָּן
  choice: pousava
  rationale: No caso de uma nuvem, “pousava” expressa com naturalidade a ideia de estabelecer-se ou permanecer em determinado lugar, sem o antropomorfismo mais forte de “habitava”.
- source_word: שָׁם ... שָׁם
  choice: onde ... ali
  rationale: A correlação “onde ... ali” conserva a correspondência e a ênfase espacial produzidas pela repetição de שָׁם.
- source_word: יַחֲנוּ
  choice: acampavam
  rationale: O imperfeito é iterativo no contexto; “acampavam” transmite a ação habitual em linguagem atual.
theological_decisions: []
