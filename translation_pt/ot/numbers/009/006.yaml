  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: pt
  text: Havia alguns homens que estavam impuros por causa de um cadáver humano[a] e, por isso, não puderam celebrar a Páscoa naquele dia. Naquele mesmo dia, eles se aproximaram de Moisés e de Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “impuros pela néfesh de um homem”; neste contexto, é uma expressão idiomática para a impureza causada por um cadáver humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: Havia alguns homens
  rationale: A construção introduz uma nova circunstância narrativa. “Havia alguns homens” é natural em português e mantém o referente masculino plural do hebraico.
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: impuros por causa de um cadáver humano
  rationale: A expressão idiomática designa impureza ritual relacionada a um morto. “Cadáver humano” comunica claramente a causa sem sugerir culpa moral.
- source_word: וְלֹא יָכְלוּ
  choice: e, por isso, não puderam
  rationale: A incapacidade decorre da impureza mencionada. “Por isso” explicita essa relação contextual sem acrescentar uma causa estranha ao texto.
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: celebrar a Páscoa
  rationale: O hebraico diz literalmente “fazer a Páscoa”, expressão que significa realizar sua observância ritual. “Celebrar a Páscoa” é a formulação corrente e clara em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia / Naquele mesmo dia
  rationale: A primeira ocorrência indica o dia prescrito para a Páscoa; na repetição, “naquele mesmo dia” preserva a ênfase temporal e evita uma coordenação excessivamente pesada.
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: eles se aproximaram de
  rationale: קרב significa aproximar-se, e a construção com לִפְנֵי indica aproximação à presença de Moisés e Arão. Em português, “aproximaram-se de” transmite naturalmente o sentido sem converter implicitamente a ação em petição formal.
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: Moisés ... Arão
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes em português.
theological_decisions:
- issue: Natureza da impureza
  choice: Apresentar a condição como impureza ritual causada por um cadáver humano.
  alternative: Traduzir literalmente como “impuros pela néfesh de um homem”.
  rationale: No contexto das leis de pureza do Pentateuco, a expressão se refere à impureza associada a um morto, não necessariamente a pecado ou culpa moral.
- issue: Sentido de “fazer a Páscoa”
  choice: celebrar a Páscoa
  alternative: fazer a Páscoa
  rationale: A expressão hebraica se refere à realização da observância pascal. A tradução idiomática comunica isso sem definir além do texto quais elementos rituais estão em foco.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A divisão em duas frases torna a repetição de “naquele dia” natural e preserva sua ênfase. “Impuro” mantém o vocabulário ritual, e a nota registra a forma incomum do hebraico.
