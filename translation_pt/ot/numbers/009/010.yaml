id: NUM.9.10
reference: Numbers 9:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a], dizendo: ‘Se algum homem estiver impuro por causa de um cadáver[b] ou estiver em viagem distante, seja entre vocês, seja nas suas gerações futuras[c], celebrará a Páscoa para Yahweh.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de Israel”; a expressão se refere à comunidade israelita como um todo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “impuro para uma pessoa/alma”; neste contexto legal, a expressão hebraica designa impureza causada por uma pessoa morta, isto é, por um cadáver.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “por todas as suas gerações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: Imperativo singular dirigido a Moisés; equivalente direto e natural em português para a introdução da instrução divina.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma hebraica tradicional, que designa coletivamente a comunidade israelita.
- source_word: אִישׁ אִישׁ
  choice: Se algum homem
  rationale: A repetição tem força distributiva, indicando qualquer homem individualmente; a formulação conserva tanto a condição quanto o masculino do hebraico.
- source_word: טָמֵא לָנֶפֶשׁ
  choice: estiver impuro por causa de um morto
  rationale: No contexto legal sacerdotal, a expressão idiomática se refere à impureza ritual decorrente do contato com uma pessoa morta.
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: estiver em viagem distante
  rationale: Expressa de modo idiomático a situação de quem está longe por motivo de viagem.
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: seja entre vocês, seja ao longo das suas gerações
  rationale: Distingue a aplicação à comunidade presente e sua vigência continuada nas gerações futuras.
- source_word: וְעָשָׂה פֶסַח
  choice: celebrará a Páscoa
  rationale: Fazer a Páscoa é uma expressão idiomática para celebrá-la ou observá-la; não se acrescenta 'ainda', ausente do texto hebraico.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: Conserva o nome divino e a orientação da celebração a Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pactual em vez de substituí-lo por um título.
- issue: Alcance de אִישׁ אִישׁ
  choice: algum homem
  alternative: qualquer pessoa; quem quer que seja
  rationale: Mantém a forma masculina singular e a força distributiva do hebraico sem transformar o texto em linguagem neutra.
- issue: Força de וְעָשָׂה
  choice: celebrará
  alternative: poderá celebrar; ainda celebrará
  rationale: A forma verbal, no contexto da prescrição, exprime a observância prevista ou requerida; evitou-se inserir explicitamente uma nuance permissiva ou adversativa que o hebraico não marca.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção mantém o tom jurídico da instrução, preserva o nome Yahweh e evita acrescentar a palavra 'ainda', que não tem correspondente explícito no hebraico.
