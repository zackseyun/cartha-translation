    issue: Alternativa inadequada na nota de rodapé
    rationale: “A tenda da testemunha” altera a relação genitiva e sugere uma testemunha pessoal. עֵדוּת designa aqui o testemunho; uma formulação alternativa segura é “tenda de testemunho”, embora “tenda do testemunho” seja preferível como termo cultual estabelecido.
  - severity: low
    issue: Aspecto verbal e expressão temporal podem ser mais precisos
    rationale: “Ela permanecia” torna explícita a continuidade indicada pelo imperfeito descritivo, e “ao anoitecer” reproduz de modo direto a transição temporal de וּבָעֶרֶב.
  revised_text: No dia em que o tabernáculo foi erguido, a nuvem cobriu o tabernáculo, a tenda do testemunho[a]; e, ao anoitecer, ela permanecia sobre o tabernáculo com aparência de fogo até a manhã.
