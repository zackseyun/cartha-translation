  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: pt
  text: No dia em que o tabernáculo foi erguido, a nuvem cobriu o tabernáculo, a tenda do testemunho[a]; e, ao anoitecer, ela permanecia sobre o tabernáculo com aparência de fogo até a manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a tenda de testemunho”. O hebraico pode ser expresso dessas duas formas em português; “tenda do testemunho” foi mantido por ser o termo cultual mais estabelecido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם
  choice: No dia em que
  rationale: Introduz naturalmente a circunstância temporal em português; o waw é representado pela continuidade do discurso, sem acrescentar um marcador como “ora”.
- source_word: הָקִים אֶת הַמִּשְׁכָּן
  choice: o tabernáculo foi erguido
  rationale: A construção temporal hebraica, literalmente ligada ao ato de levantar ou instalar, é expressa com clareza por uma oração passiva em português.
- source_word: הַמִּשְׁכָּן
  choice: o tabernáculo
  rationale: “Tabernáculo” é o termo estabelecido para o santuário móvel de Israel e permanece amplamente reconhecível em português.
- source_word: כִּסָּה הֶעָנָן
  choice: a nuvem cobriu
  rationale: Reproduz diretamente o verbo de cobrir e mantém a nuvem definida, já conhecida no contexto narrativo.
- source_word: לְאֹהֶל הָעֵדֻת
  choice: a tenda do testemunho
  rationale: Mantém a identificação cultual do tabernáculo e preserva “testemunho” como equivalente tradicional de עֵדוּת, sem excluir em nota a alternativa “tenda do testemunho”/“tenda do testemunho” não aplicável; a alternativa semântica pertinente é “tenda do testemunho” versus “tenda do testemunho” apenas nominalmente, por isso a nota esclarece “testemunha”.
- source_word: וּבָעֶרֶב
  choice: e, ao entardecer
  rationale: Marca de modo natural a transição para o período noturno e conserva a força conjuntiva.
- source_word: יִהְיֶה
  choice: ela ficava
  rationale: O imperfeito descreve aqui uma situação habitual ou continuada; “ficava” comunica esse valor e o pronome retoma naturalmente “a nuvem”.
- source_word: עַל הַמִּשְׁכָּן
  choice: sobre o tabernáculo
  rationale: Expressa de maneira direta a posição da nuvem em relação ao tabernáculo.
- source_word: כְּמַרְאֵה אֵשׁ
  choice: com aparência de fogo
  rationale: Preserva a comparação visual sem afirmar que a nuvem se tornava literalmente fogo.
- source_word: עַד בֹּקֶר
  choice: até a manhã
  rationale: Indica com clareza o limite temporal da aparência noturna.
theological_decisions:
- issue: Relação entre “o tabernáculo” e “a tenda do testemunho”
  choice: A segunda expressão identifica a primeira por aposição.
  alternative: 'Entender לְאֹהֶל com valor locativo ou direcional: “junto à/na direção da tenda do testemunho”.'
  rationale: No contexto, a sintaxe é mais naturalmente compreendida como uma identificação do tabernáculo, e não como referência a uma segunda estrutura distinta.
- issue: Natureza da manifestação noturna
  choice: A nuvem tinha aparência de fogo.
  alternative: A nuvem era literalmente fogo.
  rationale: A construção comparativa כְּמַרְאֵה indica semelhança visual e não identidade material.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico estabelecido. “Ao entardecer” e “ficava” tornam natural a descrição habitual, enquanto “com aparência de fogo” conserva a cautela comparativa do hebraico.
