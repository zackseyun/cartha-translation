  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: pt
  text: Mas o homem que estiver ritualmente puro e não estiver em viagem, e deixar de celebrar a Páscoa, essa pessoa será cortada do meio do seu povo[a], porque não apresentou a oferta de Yahweh em seu tempo determinado; esse homem levará sobre si o seu pecado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “essa pessoa será extirpada do meio do seu povo”. A expressão hebraica pode indicar um grave juízo da aliança, sem especificar aqui exatamente como ele é executado.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “levará sobre si a sua culpa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: puro
  rationale: No contexto, indica pureza ritual, não necessariamente pureza moral; “puro” é a formulação bíblica natural em português.
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: não estiver em viagem
  rationale: Expressa de modo natural a ausência da exceção concedida a quem se encontra viajando.
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: deixar de celebrar a Páscoa
  rationale: חָדַל indica deixar de fazer ou abster-se, e עשה הפסח refere-se à realização da celebração pascal.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מֵעַמֶּיהָ
  choice: essa pessoa será eliminada do meio do seu povo
  rationale: נפש designa aqui a pessoa; “eliminada do meio” conserva o peso judicial da expressão כרת sem definir seu modo de execução.
- source_word: קָרְבַּן יְהוָה
  choice: a oferta de Yahweh
  rationale: קָרְבָּן é uma oferta apresentada a Deus, e o nome divino é transliterado como Yahweh.
- source_word: בְּמֹעֲדוֹ
  choice: no tempo determinado
  rationale: מוֹעֵד designa o tempo fixado e prescrito para a oferta.
- source_word: חֶטְאוֹ יִשָּׂא
  choice: levará sobre si o seu pecado
  rationale: Preserva a imagem do idioma hebraico e abrange tanto a responsabilidade pelo pecado quanto suas consequências.
- source_word: הָאִישׁ הַהוּא
  choice: esse homem
  rationale: Mantém a referência masculina singular explícita do hebraico.
theological_decisions:
- issue: Sentido da pena expressa por וְנִכְרְתָה
  choice: será eliminada do meio do seu povo
  alternative: será excluída da comunidade; será morta
  rationale: A expressão indica um grave juízo da aliança, mas o versículo não especifica se ocorre por execução humana, exclusão comunitária ou juízo divino; a tradução preserva essa tensão.
- issue: Sentido de חֶטְאוֹ יִשָּׂא
  choice: levará sobre si o seu pecado
  alternative: levará sobre si a sua culpa
  rationale: “Pecado” preserva a correspondência lexical direta, enquanto “culpa” explicita a responsabilidade e pode estreitar o alcance da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Celebrar a Páscoa” comunica a observância prescrita; “eliminada do meio do seu povo” mantém o idioma judicial sem resolver sua sanção exata.
