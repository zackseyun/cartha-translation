  to: Mas o homem que estiver ritualmente puro e não estiver em viagem, e deixar de celebrar a Páscoa, essa pessoa será cortada do meio do seu povo[a], porque não apresentou a oferta de Yahweh em seu tempo determinado; esse homem levará sobre si o seu pecado[b].
