  source_fidelity: A tradução transmite adequadamente a condição de pureza ritual, a ausência por viagem, a omissão da Páscoa, a oferta de Yahweh no prazo prescrito e a responsabilidade pelo pecado. Contudo, «eliminada» tende a concretizar mais a sanção do que o hebraico idiomático וְנִכְרְתָה («ser cortado/extirpado»), cujo modo de execução permanece indeterminado.
  naturalness: O texto é claro e de registro bíblico moderno. «Ritualmente puro» evita que «puro» seja lido principalmente em sentido moral. «Em seu tempo determinado» explicita naturalmente a referência de בְּמֹעֲדוֹ.
  terminology: «Páscoa», «oferta de Yahweh» e «levará sobre si o seu pecado» são adequados. «Será cortada do meio do seu povo» preserva melhor o idiomático jurídico-pactual sem determinar se se trata de morte, expulsão ou juízo divino.
