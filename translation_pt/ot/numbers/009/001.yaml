  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés no deserto do Sinai[a], no segundo ano depois que eles saíram da terra do Egito, no primeiro mês, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na região desértica do Sinai”.
    reason: Alternativa lexical para מִדְבָּר, que pode designar tanto um deserto quanto uma região erma ou pouco habitada.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: E ... falou
  rationale: O wayyiqtol dá continuidade à narrativa. “Falou” traduz diretamente דבר, e “E” preserva o encadeamento hebraico sem impor uma sequência temporal mais específica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: Com דבר, אֶל indica normalmente o destinatário da fala; “a Moisés” é direto e natural em português.
- source_word: בְּמִדְבַּר סִינַי
  choice: no deserto do Sinai
  rationale: מִדְבָּר designa uma região desértica ou erma. “Deserto do Sinai” é a formulação bíblica corrente e mantém a relação construta do hebraico.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: no segundo ano
  rationale: Tradução direta e idiomática da expressão temporal hebraica.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: depois que eles saíram da terra do Egito
  rationale: O infinitivo construto com לְ e sufixo pronominal funciona como referência temporal ao êxodo. A formulação explicita naturalmente em português o sujeito plural preservado no hebraico e mantém אֶרֶץ, “terra”.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: no primeiro mês
  rationale: Expressão temporal direta, clara e natural em português.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo introduz as palavras que vêm no versículo seguinte. “Dizendo” conserva essa ligação formal, e os dois-pontos sinalizam a fala subsequente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança em forma transliterada, sem substituí-lo por um título e sem adotar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o fluxo narrativo e as duas referências temporais do hebraico sem rigidez excessiva.
