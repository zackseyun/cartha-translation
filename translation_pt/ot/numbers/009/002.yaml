  text: וְ/יַעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת הַ/פָּ֖סַח בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/002.yaml
  text: And let the sons of Israel keep the Passover at its appointed time[a].
translation:
  language: pt
  text: E que os filhos de Israel[a] celebrem a Páscoa no tempo determinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: E que ... celebrem
  rationale: O verbo עשה significa literalmente “fazer”, mas, tendo פֶּסַח como objeto, refere-se idiomaticamente à realização ou celebração da Páscoa. A construção com a conjunção e o imperfeito tem força jussiva neste contexto; por isso, “E que ... celebrem” expressa a ordem sem a transformar em simples futuro.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar hebraica, literalmente “filhos de Israel”, sem a reduzir ao gentílico “israelitas”. A nota registra a alternativa idiomática.
- source_word: הַפָּסַח
  choice: a Páscoa
  rationale: פֶּסַח pode designar a celebração pascal em sentido amplo e, conforme o contexto, também seu sacrifício. “A Páscoa” preserva essa amplitude sem especificar além do texto.
- source_word: בְּמוֹעֲדוֹ
  choice: no tempo determinado para ela
  rationale: מוֹעֵד indica um tempo fixado ou designado. A formulação conserva tanto a precisão temporal quanto o sufixo possessivo masculino, cujo referente é a Páscoa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com construção jussiva natural. “Celebrem” comunica o sentido ritual idiomático de עשה com “Páscoa”, enquanto “no tempo determinado para ela” mantém a referência explícita do sufixo hebraico.
