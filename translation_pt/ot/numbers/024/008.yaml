  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: pt
  text: Deus o tira do Egito e lhe dá a força de um boi selvagem[a]. Devorará as nações que são suas adversárias, roerá os ossos delas[b] e as esmagará com suas flechas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus lhe dá chifres como os de um boi selvagem”. A expressão hebraica é difícil e pode evocar tanto a força quanto os chifres elevados do animal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “quebrará os ossos delas” ou “deixará seus ossos descobertos”. O verbo hebraico é raro, e sua nuance exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Deus
  rationale: O substantivo designa Deus como aquele que liberta; “Deus” é a forma direta, natural e não interpretativamente ampliada.
- source_word: מוֹצִיאוֹ מִמִּצְרַיִם
  choice: o tira do Egito
  rationale: O particípio com sufixo tem força verbal vívida. O presente preserva o caráter poético da ação sem convertê-la necessariamente em passado.
- source_word: כְּתוֹעֲפֹת רְאֵם לוֹ
  choice: ele tem a força de um boi selvagem
  rationale: A expressão é difícil e parece evocar a potência elevada ou os chifres do רְאֵם. “Força de um boi selvagem” comunica naturalmente a imagem sem recorrer ao tradicional e zoologicamente inadequado “unicórnio”; a leitura concreta “chifres” é registrada em nota.
- source_word: יֹאכַל
  choice: Devorará
  rationale: Embora o sentido básico seja “comer”, no contexto guerreiro o verbo descreve a destruição dos adversários. “Devorará” conserva a metáfora intensa.
- source_word: גּוֹיִם צָרָיו
  choice: as nações que são suas adversárias
  rationale: A formulação mantém “nações” e explicita sua relação apositiva com “adversárias”, sem reduzir o referente simplesmente a inimigos individuais.
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: roerá os ossos delas
  rationale: O verbo raro combina com a imagem de devorar e com o objeto “ossos”. Como sua nuance exata é incerta, outras possibilidades são apresentadas em nota.
- source_word: וְחִצָּיו יִמְחָץ
  choice: e as esmagará com suas flechas
  rationale: A tradução entende as flechas como instrumento e fornece em português o objeto retomado pelo contexto. “Esmagará” preserva a força de מחץ.
theological_decisions:
- issue: Referente dos pronomes masculinos no singular no oráculo de Balaão
  choice: Manter “o/ele/suas” no singular sem identificar expressamente o referente.
  alternative: Explicitar Israel como coletivo, o rei de Israel ou uma figura messiânica individual.
  rationale: As formas hebraicas estão no singular, mas o contexto admite tanto Israel em sentido coletivo quanto um representante régio. A tradução preserva essa tensão e não impõe uma identificação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Boi selvagem” evita o tradicional “unicórnio”. A repetição dos pronomes no singular preserva a ambiguidade corporativa ou representativa do hebraico.
