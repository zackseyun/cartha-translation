base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: pt
  text: Água escorrerá de seus baldes[a], e sua semente[b] estará em águas abundantes; seu rei será mais elevado que Agague, e seu reino será exaltado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “de seus ramos”, se o substantivo for entendido metaforicamente, em vez de no sentido usual de “baldes”.
    reason: lexical_alternative
  - marker: b
    text: “Sua semente” também pode ser entendida como “sua descendência” ou “seus descendentes”; o hebraico pode evocar tanto a prole quanto a fertilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: escorrerá
  rationale: O verbo descreve o movimento de líquido. “Escorrerá” preserva a imagem sem enfraquecê-la como “gotejará” nem intensificá-la como “se derramará”.
- source_word: מַיִם
  choice: Água
  rationale: Embora a forma hebraica seja plural, “água” é o substantivo massivo idiomático em português neste contexto.
- source_word: מִדָּלְיוֹ
  choice: de seus baldes
  rationale: דְּלִי designa normalmente um balde ou recipiente para tirar água. A alternativa metafórica “ramos” é menos provável e fica registrada em nota.
- source_word: וְזַרְעוֹ
  choice: e sua semente
  rationale: זֶרַע pode indicar semente em sentido literal ou descendência. “Semente” mantém a sobreposição poética entre fertilidade e progenitura.
- source_word: בְּמַיִם רַבִּים
  choice: em águas abundantes
  rationale: A expressão representa a semente situada em meio a uma provisão abundante de água; a formulação conserva de modo direto a preposição hebraica e a imagem poética.
- source_word: וְיָרֹם
  choice: será mais elevado
  rationale: רוּם denota altura ou exaltação; com מִן, a construção é comparativa. A escolha também distingue este verbo do usado no último segmento.
- source_word: מֵאֲגַג
  choice: que Agague
  rationale: A preposição מִן tem valor comparativo após o verbo de elevação. Agague é mantido como nome próprio, sem generalização ou identificação adicional.
- source_word: מַלְכּוֹ
  choice: seu rei
  rationale: מֶלֶךְ significa diretamente “rei”. O possessivo é preservado sem identificar esse rei com uma figura histórica ou messiânica específica.
- source_word: וְתִנַּשֵּׂא
  choice: será exaltado
  rationale: A forma verbal comunica ser erguido ou exaltado, e “será exaltado” é natural no contexto de domínio real.
- source_word: מַלְכֻתוֹ
  choice: seu reino
  rationale: מַלְכוּת pode significar reino, reinado ou realeza. “Reino” expressa naturalmente o domínio político e coletivo aqui.
theological_decisions:
- issue: Referente de “sua semente”
  choice: Mantida a expressão “sua semente”, sem restringi-la à fertilidade agrícola ou à descendência.
  alternative: “seus descendentes” ou “sua descendência”
  rationale: O hebraico זֶרַע admite o sentido literal de semente e o figurado de prole; o paralelismo poético pode evocar ambos.
- issue: Identidade de “seu rei” e relação com Agague
  choice: 'O texto permanece genérico: “seu rei será mais elevado que Agague”.'
  alternative: Identificar o rei com Saul, Davi, o Messias ou outro governante futuro.
  rationale: O oráculo anuncia a elevação régia de Israel, mas este versículo não identifica explicitamente o rei; a tradução não deve importar uma conclusão posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura poética e o paralelismo foram preservados; “Agague” segue a forma portuguesa tradicional do nome. Os marcadores [a] e [b] aparecem no texto junto às expressões que explicam.
