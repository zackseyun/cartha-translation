  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: pt
  text: Edom se tornará uma possessão; Seir também se tornará uma possessão dos inimigos dele[a], enquanto Israel age com valentia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “os inimigos dele”, com sufixo masculino singular. O referente pode ser Seir/Edom ou o governante mencionado no oráculo ao redor deste versículo.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “faz força/valor”; expressão idiomática que significa agir com força ou valentia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: se tornará
  rationale: No discurso profético, o perfeito com conjunção tem sentido futuro e resultativo; “se tornará” expressa naturalmente a mudança de condição.
- source_word: יְרֵשָׁה
  choice: uma possessão
  rationale: O substantivo indica algo tomado e mantido como propriedade ou território ocupado; “possessão” preserva o contexto de conquista sem impor a ideia mais específica de herança.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Mantém o nome geográfico em paralelo com Edom; o hebraico não traz aqui a palavra “monte”.
- source_word: אֹיְבָיו
  choice: os inimigos dele
  rationale: Reproduz o sufixo masculino singular do hebraico e evita que o possessivo português “seus” tenha referente obscuro.
- source_word: עֹשֶׂה חָיִל
  choice: demonstra força
  rationale: Expressa de modo atual e natural o idioma hebraico que denota agir com poder, vigor ou valentia.
theological_decisions:
- issue: Referente do sufixo masculino singular em אֹיְבָיו (“os inimigos dele”)
  choice: Conservar o pronome masculino singular, permitindo sua ligação com o governante singular anunciado no oráculo imediato.
  alternative: Entender o sufixo como referente a Seir/Edom e traduzir “os inimigos de Seir” ou, de modo impessoal, “seus inimigos”.
  rationale: A forma hebraica é masculina singular, e os versículos 17–19 focalizam um governante singular vindo de Israel. A tradução conserva essa ligação literária possível sem tornar explícita uma identificação messiânica que o versículo não formula diretamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Os inimigos dele” é preferido a “seus inimigos” para preservar o singular masculino e reduzir a ambiguidade gramatical do possessivo, enquanto a nota mantém aberta a ambiguidade referencial genuína.
