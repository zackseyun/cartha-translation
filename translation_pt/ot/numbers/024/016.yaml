    rationale: נְאֻם introduz uma fórmula solene, e a trilha inglesa a verte como “the declaration”. Em português, “A declaração daquele que...” é a forma sintaticamente completa e mais natural, sem mudar o sentido.
  revised_text: 'A declaração daquele que ouve as palavras de Deus[a], que conhece o conhecimento do Altíssimo e vê a visão do Todo-Poderoso, caindo[b], mas com os olhos descobertos:'
