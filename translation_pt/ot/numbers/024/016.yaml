source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: pt
  text: 'A declaração daquele que ouve as palavras de Deus[a], que conhece o conhecimento do Altíssimo e vê a visão do Todo-Poderoso, caindo[b], mas com os olhos descobertos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os ditos de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “caindo, com os olhos descobertos”; alguns entendem a expressão como referência a um estado de transe visionário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: declaração
  rationale: Introduz um pronunciamento profético solene; “declaração” é atual, claro e mantém o peso formal do hebraico.
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: daquele que ouve as palavras de Deus
  rationale: O particípio descreve uma característica contínua, e “palavras de Deus” comunica naturalmente a expressão construta hebraica.
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: que conhece o conhecimento do Altíssimo
  rationale: Mantém a formulação compacta e incomum do hebraico, sem decidir se o conhecimento pertence ao Altíssimo ou é concedido por ele.
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: e vê a visão do Todo-Poderoso
  rationale: Reproduz a linguagem visionária e traduz o título divino שַׁדַּי de modo convencional e inteligível.
- source_word: נֹפֵל
  choice: caindo
  rationale: Conserva o sentido literal do particípio, sem inserir no texto principal a interpretação de um estado de transe.
- source_word: וּגְלוּי עֵינָיִם
  choice: mas com os olhos descobertos
  rationale: Preserva a imagem hebraica de olhos descobertos; “mas” expressa naturalmente o contraste contextual com “caindo”.
theological_decisions:
- issue: Tradução dos títulos divinos אֵל, עֶלְיוֹן e שַׁדַּי
  choice: Deus / Altíssimo / Todo-Poderoso
  alternative: El / Elyon / Shaddai
  rationale: No contexto, são títulos divinos cujo significado deve ser comunicado em português, e não nomes próprios que exijam transliteração.
- issue: Sentido de דַּעַת עֶלְיוֹן
  choice: o conhecimento do Altíssimo
  alternative: conhecimento vindo do Altíssimo
  rationale: O genitivo hebraico permite mais de uma relação semântica; a formulação escolhida preserva essa tensão em vez de afirmar explicitamente a origem do conhecimento.
- issue: Estado descrito por נֹפֵל
  choice: caindo
  alternative: em transe / prostrado
  rationale: O hebraico diz literalmente “caindo”; a associação com transe visionário é possível, mas interpretativa.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A estrutura poética e os títulos divinos são preservados; formulações deliberadamente incomuns do hebraico permanecem quando carregam ambiguidade relevante.
