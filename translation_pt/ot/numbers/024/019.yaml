  text: וְ/יֵ֖רְדְּ מִֽ/יַּעֲקֹ֑ב וְ/הֶֽאֱבִ֥יד שָׂרִ֖יד מֵ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: pt
  text: De Jacó sairá aquele que dominará[a] e destruirá o sobrevivente[b] da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terá domínio”. O verbo hebraico pode significar “dominar”, “governar” ou “ter domínio”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o remanescente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: sairá aquele que dominará
  rationale: O verbo רדה significa “dominar, governar”. Como o hebraico não explicita o sujeito, “aquele que” o retoma naturalmente do governante anunciado no contexto. “Sairá” expressa em português a origem indicada por מִן, sem adotar a leitura menos provável de ירד, “descer”.
- source_word: מִיַּעֲקֹב
  choice: De Jacó sairá
  rationale: A preposição מִן indica origem ou procedência. A inversão produz uma frase natural em português e conserva a ideia de que o governante procede de Jacó.
- source_word: וְהֶאֱבִיד
  choice: e destruirá
  rationale: O hifil de אבד comunica fazer perecer ou eliminar; “destruirá” preserva de modo claro a força do verbo.
- source_word: שָׂרִיד
  choice: o sobrevivente
  rationale: O substantivo singular designa quem restou ou sobreviveu. “O sobrevivente” mantém a forma concreta e singular, embora possa ter sentido coletivo.
- source_word: מֵעִיר
  choice: da cidade
  rationale: עִיר significa normalmente “cidade”, e מִן indica aqui procedência ou separação. Não há fundamento lexical suficiente para acrescentar “fortificada” ou “cidade-estado”.
theological_decisions:
- issue: Referência régia ou messiânica no oráculo de Balaão
  choice: Manter a figura como um governante não identificado que procede de Jacó.
  alternative: Identificá-la explicitamente como um rei histórico específico ou como o Messias.
  rationale: O contexto é régio e permite uma leitura messiânica ou tipológica, mas o versículo não identifica expressamente a figura. A formulação preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção natural para leitores brasileiros. A ordem da frase esclarece a origem do governante sem explicitar uma identificação messiânica. Todos os marcadores aparecem no texto.
