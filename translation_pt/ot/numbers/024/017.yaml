  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: pt
  text: Eu o vejo[a], mas não agora; eu o contemplo, mas não está perto. Uma estrela surgiu de Jacó, e um cetro se levantou de Israel; esmagará as extremidades de Moabe[b] e destruirá todos os filhos de Sete.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “Eu o verei [...] eu o contemplarei”. As formas hebraicas podem ter sentido presente, numa visão vívida, ou futuro.'
    reason: alternativa_verbal
  - marker: b
    text: 'Hebraico: “os cantos de Moabe”, expressão poética que pode indicar suas extremidades ou sua força.'
    reason: nota_lexical
  - marker: c
    text: 'Ou: “todos os descendentes de Sete”. A expressão hebraica é difícil; alguns a entendem mais amplamente como uma designação poética da humanidade ou de um povo hostil.'
    reason: leitura_alternativa
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: Eu o vejo
  rationale: O imperfeito qal na visão profética admite valor presente vívido ou futuro. O pronome masculino singular favorece um referente pessoal; o presente preserva a vivacidade da visão, e a alternativa futura é registrada em nota.
- source_word: אֲשׁוּרֶנּוּ
  choice: eu o contemplo
  rationale: O verbo שׁור indica olhar ou contemplar. “Contemplo” mantém o paralelismo elevado com “vejo” sem tornar os dois verbos idênticos.
- source_word: וְלֹא קָרוֹב
  choice: mas não está perto
  rationale: קָרוֹב pode expressar proximidade temporal ou espacial. A formulação conserva essa abertura melhor do que “não será em breve”.
- source_word: דָּרַךְ כּוֹכָב
  choice: Uma estrela surgiu
  rationale: דָּרַךְ significa literalmente “pisou/avançou” e, com “estrela”, descreve seu aparecimento ou avanço. “Surgiu” comunica a imagem profética em português natural sem substituí-la por sua interpretação régia.
- source_word: וְקָם שֵׁבֶט
  choice: e um cetro se levantou
  rationale: שֵׁבֶט pode significar vara, bastão, cetro ou tribo. Em paralelo com a estrela e no contexto de domínio, “cetro” preserva adequadamente a imagem real.
- source_word: וּמָחַץ פַּאֲתֵי מוֹאָב
  choice: ele esmagará as extremidades de Moabe
  rationale: מחץ significa esmagar. פֵּאָה designa canto, lado ou extremidade; “extremidades” é compreensível e mantém a metáfora geográfica sem adotar a leitura interpretativa “príncipes”.
- source_word: וְקַרְקַר
  choice: e destruirá
  rationale: O verbo é raro e seu sentido exato é discutido; propostas incluem demolir, arrasar e destruir. “Destruirá” comunica com sobriedade o sentido geral exigido pelo contexto.
- source_word: כָּל בְּנֵי שֵׁת
  choice: todos os filhos de Sete
  rationale: A vocalização massorética permite entender שֵׁת como o nome próprio Sete. A expressão, porém, é difícil e pode ter alcance mais amplo; essa incerteza é indicada em nota.
theological_decisions:
- issue: Força messiânica do oráculo de Balaão
  choice: Manter no texto as imagens régias de “estrela” e “cetro” sem identificar expressamente a figura como o Messias.
  alternative: Identificar diretamente a figura com o Messias ou limitá-la a um rei histórico, como Davi.
  rationale: O hebraico apresenta uma figura régia por meio de símbolos e linguagem de conquista, mas não a chama explicitamente de Messias. A tradução preserva a possibilidade da leitura messiânica sem inseri-la no texto.
- issue: Relação entre o referente pessoal e os símbolos régios
  choice: Empregar “o” na abertura e “ele” na ação de esmagar, mantendo estrela e cetro como imagens do referente.
  alternative: Tratar toda a passagem de modo impessoal ou substituir os símbolos por “rei”.
  rationale: Os sufixos masculinos singulares da abertura apontam para alguém contemplado, enquanto estrela e cetro exprimem simbolicamente sua função régia. “Ele” preserva a continuidade pessoal sem desfazer as imagens.
- issue: Valor temporal das formas verbais proféticas
  choice: Traduzir os perfeitos da visão como acontecimentos já contemplados (“surgiu”, “se levantou”) e a conquista como futura (“esmagará”, “destruirá”).
  alternative: 'Empregar futuro em todas as ações: “surgirá”, “se levantará”.'
  rationale: A alternância comunica a apresentação vívida e certa da visão profética sem negar que seu cumprimento não pertence ao momento imediato do oráculo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. O paralelismo poético foi preservado; termos excessivamente tradicionais foram evitados, sem diluir as imagens régias nem resolver as ambiguidades do hebraico.
