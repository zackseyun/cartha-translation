  rationale: A revisão substitui apenas um termo de registro inadequadamente administrativo por uma formulação literária e semanticamente mais abrangente, e torna mais precisa a explicação da alternativa de tom satírico na nota. A ambiguidade de “o primeiro entre as nações” e o sentido de ruína final permanecem preservados.
