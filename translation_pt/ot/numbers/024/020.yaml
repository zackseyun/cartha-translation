  - severity: low
    issue: A nota a usa “provocação” como alternativa semântica para o possível tom de escárnio.
    rationale: “Provocação” pode referir-se a um ato que instiga alguém, não necessariamente a um dito satírico ou de zombaria. “Dito de escárnio” é mais preciso e continua não interpretativo.
