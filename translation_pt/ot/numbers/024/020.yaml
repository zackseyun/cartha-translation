  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: pt
  text: 'Então ele viu Amaleque, proferiu seu dito[a] e disse: “Amaleque foi o primeiro entre as nações[b], mas seu fim será a destruição total.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “proferiu seu oráculo” ou “pronunciou seu provérbio”; o termo hebraico pode designar um dito poético, provérbio, dito de escárnio ou oráculo.
    reason: lexical_alternative
  - marker: b
    text: Ou “o principal entre as nações”; a expressão hebraica pode indicar prioridade no tempo ou preeminência.
    reason: lexical_alternative
  - marker: c
    text: Ou “seu fim será perecer” ou “seu desfecho será a destruição”; a expressão hebraica é concisa e enfatiza a ruína completa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: Então ele viu Amaleque
  rationale: O waw consecutivo faz a narrativa avançar, e ראה tem aqui o sentido simples de “ver”. “Então” expressa com naturalidade a sequência.
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: proferiu seu pronunciamento
  rationale: מָשָׁל pode designar provérbio, dito poético, discurso figurado ou oráculo. “Pronunciamento” é amplo e digno, adequado à fala profética de Balaão sem definir o gênero de modo excessivamente estreito.
- source_word: רֵאשִׁית גּוֹיִם
  choice: o primeiro entre as nações
  rationale: רֵאשִׁית pode indicar começo, prioridade ou posição principal. A formulação portuguesa preserva em alguma medida a ambiguidade entre anterioridade temporal e preeminência, explicitada em nota.
- source_word: עֲמָלֵק
  choice: Amaleque
  rationale: Forma tradicional e amplamente reconhecível em português para o nome próprio; no contexto, representa o povo ou nação.
- source_word: וְאַחֲרִיתוֹ
  choice: mas seu fim
  rationale: אַחֲרִית refere-se ao fim, desfecho ou destino posterior. “Mas” torna claro o contraste implícito com a posição inicial de Amaleque.
- source_word: עֲדֵי אֹבֵד
  choice: será a destruição total
  rationale: A expressão hebraica é elíptica e aponta para perdição completa. Esta formulação comunica a finalidade e intensidade sem acrescentar explicitamente “para sempre”, termo não presente no texto.
theological_decisions:
- issue: Sentido da posição de Amaleque em רֵאשִׁית גּוֹיִם
  choice: Manter no texto a formulação “o primeiro entre as nações” e registrar em nota a possibilidade de “o principal entre as nações”.
  alternative: Resolver a expressão como prioridade cronológica (“o primeiro dos povos”) ou como preeminência (“o principal entre as nações”).
  rationale: O hebraico admite tanto prioridade no tempo quanto primazia de posição. O versículo não determina qual nuance é pretendida, por isso a tradução não deve impor uma conclusão histórica ou teológica.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A ordem das notas segue a ocorrência dos marcadores no texto, e a ambiguidade central de רֵאשִׁית foi preservada.
