  source_fidelity: A tradução transmite adequadamente a sequência narrativa, o nome Amaleque, a ambiguidade de רֵאשִׁית גּוֹיִם e o desfecho de ruína expresso em וְאַחֲרִיתוֹ עֲדֵי אֹבֵד. “Destruição total” é uma representação aceitável da força da expressão final, sem introduzir indevidamente a noção de eternidade.
  naturalness: “Proferiu seu pronunciamento” é compreensível, mas “pronunciamento” tem em português moderno uma conotação burocrática ou político-institucional e não reproduz bem o caráter conciso, poético e formular de מָשָׁל. “Proferiu seu dito” é mais natural no registro bíblico-literário, amplo o bastante para não decidir entre provérbio, dito de escárnio e oráculo.
  terminology: “Amaleque”, “nações”, “fim” e “destruição total” são adequados. A nota sobre מָשָׁל deve empregar “dito de escárnio”, em vez de “provocação”, pois esta última é mais vaga e não identifica com precisão o possível valor de mote/taunt.
