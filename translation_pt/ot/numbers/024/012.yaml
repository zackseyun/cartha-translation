base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: pt
  text: 'Balaão disse a Balaque: “Não falei também aos mensageiros que você me enviou[a], dizendo:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A declaração introduzida aqui continua no versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר, introduzindo discurso direto; “disse” é o equivalente natural em português.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל בָּלָק
  choice: a Balaque
  rationale: אֶל indica o destinatário da fala; a regência natural em português é “disse a Balaque”.
- source_word: הֲלֹא
  choice: não ...?
  rationale: A partícula interrogativa negativa espera resposta afirmativa; “Eu não disse...?” preserva essa força retórica de modo natural.
- source_word: גַּם
  choice: também
  rationale: Indica que Balaão já havia comunicado isso igualmente aos mensageiros de Balaque.
- source_word: מַלְאָכֶיךָ
  choice: aos mensageiros
  rationale: Neste contexto diplomático, מַלְאָך designa enviados humanos, não seres celestiais; “mensageiros” é claro e corrente.
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: que você me enviou
  rationale: Reproduz naturalmente a oração relativa que identifica os mensageiros.
- source_word: דִּבַּרְתִּי
  choice: disse
  rationale: O perfeito é retrospectivo e se refere ao que Balaão havia falado aos mensageiros; “disse” é idiomático no contexto da pergunta.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala, que vem no versículo seguinte; em português moderno, os dois-pontos apresentam essa citação com mais naturalidade do que o literal “dizendo”.
