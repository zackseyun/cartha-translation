base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/025.yaml
  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: pt
  text: Então Balaão levantou-se, foi e voltou para o seu lugar; e Balaque também seguiu o seu caminho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: O qal narrativo de קום pode indicar levantar-se e iniciar uma ação; “se levantou” preserva o movimento expresso no hebraico e soa natural em português.
- source_word: בִּלְעָם
  choice: Balaão
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיֵּלֶךְ
  choice: partiu
  rationale: Embora הלך signifique literalmente “foi”, neste encadeamento de ações “partiu” comunica com naturalidade o início da viagem sem acrescentar um destino.
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: שׁוב, seguido de uma expressão de destino, indica retorno; “voltou” é claro e idiomático.
- source_word: לִמְקֹמוֹ
  choice: para o seu lugar
  rationale: Mantém a referência ampla de מָקוֹם. “Casa” seria mais específico do que o texto hebraico.
- source_word: וְגַם
  choice: também
  rationale: Marca Balaque como participante paralelo na partida. A ligação entre as frases é transmitida naturalmente pela sequência, sem necessidade de reproduzir mecanicamente o וְ.
- source_word: בָּלָק
  choice: Balaque
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הָלַךְ לְדַרְכּוֹ
  choice: seguiu o seu caminho
  rationale: Expressão idiomática em português que preserva o sentido de ir pelo próprio caminho, sem especificar destino ou meio de viagem.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A coordenação hebraica foi suavizada apenas o necessário para produzir uma narrativa natural, sem eliminar a sequência de ações nem transformar “seu lugar” em “casa”.
