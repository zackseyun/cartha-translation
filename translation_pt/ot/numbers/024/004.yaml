source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: pt
  text: 'declaração[a] daquele que ouve as palavras de Deus,


    que contempla a visão do Todo-Poderoso,


    caindo e com os olhos descobertos[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oráculo”. O hebraico נְאֻם é um termo profético formal para uma declaração solene.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com os olhos abertos”. Literalmente, “com os olhos descobertos”, preservando a imagem de visão desvelada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: declaração
  rationale: Termo solene que introduz um pronunciamento profético. “Declaração” conserva a formalidade sem sugerir, por si só, uma mensagem pagã ou enigmática.
- source_word: שֹׁמֵעַ
  choice: daquele que ouve
  rationale: O particípio substantivado caracteriza o falante como alguém que ouve; esta formulação é natural em português e mantém esse valor descritivo.
- source_word: אִמְרֵי אֵל
  choice: as palavras de Deus
  rationale: Expressa de modo claro e idiomático o plural construto “palavras/ditos de Deus”; אֵל funciona aqui como título divino comum.
- source_word: מַחֲזֵה
  choice: a visão
  rationale: Designa uma experiência ou percepção visionária, aqui ligada em construção a שַׁדַּי.
- source_word: שַׁדַּי
  choice: o Todo-Poderoso
  rationale: Traduz o título divino em vez de o transliterar e emprega sua forma portuguesa tradicional e amplamente compreensível.
- source_word: יֶחֱזֶה
  choice: contempla
  rationale: O imperfeito, nesta autodescrição poética, tem valor presente ou caracterizador. “Contempla” mantém o sentido de percepção visionária sem soar arcaico.
- source_word: נֹפֵל
  choice: caindo
  rationale: Preserva a forma participial e evita definir além do texto se a postura é de queda, êxtase ou prostração.
- source_word: וּגְלוּי עֵינָיִם
  choice: mas com os olhos descobertos
  rationale: “Descobertos” conserva a imagem literal de olhos desvelados; “mas” torna explícito em português o contraste contextual entre cair e ainda perceber a visão.
theological_decisions:
- issue: Tradução de שַׁדַּי
  choice: o Todo-Poderoso
  alternative: Shaddai
  rationale: O termo funciona como título divino. A tradução comunica seu sentido convencional sem impor uma definição doutrinária mais estreita.
translation_notes:
  register: Português atual, digno e de leitura ampla, com disposição poética. “Declaração”, “contempla” e “Todo-Poderoso” mantêm a solenidade do dito sem recorrer a linguagem excessivamente arcaica. A ambiguidade física de נֹפֵל é preservada por “caindo”.
