  - severity: low
    issue: «voltou o rosto»
    rationale: A expressão pode ser aceita, mas «dirigiu o rosto» representa mais precisamente o gesto intencional de orientar-se expresso pelo hebraico, sem pressupor um movimento de retorno.
  revised_text: Quando Balaão viu que era bom aos olhos de Yahweh abençoar Israel, não foi, como nas outras vezes, em busca de presságios[a], mas dirigiu o rosto para o deserto.
