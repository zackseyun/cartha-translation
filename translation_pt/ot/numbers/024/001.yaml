  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: pt
  text: Quando Balaão viu que era bom aos olhos de Yahweh abençoar Israel, não foi, como nas outras vezes, em busca de presságios[a], mas dirigiu o rosto para o deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao encontro de adivinhações” ou “para encontrar presságios”. A expressão hebraica se refere à prática anterior de Balaão de procurar sinais divinatórios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: viu
  rationale: Preserva o sentido básico de ראה e a expressão hebraica, ao mesmo tempo que, no contexto, comunica que Balaão reconheceu a situação.
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: que era bom aos olhos de Yahweh
  rationale: Mantém a imagem idiomática hebraica de algo ser bom ou agradável aos olhos de alguém, numa formulação compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְבָרֵךְ
  choice: abençoar
  rationale: Equivalente direto e natural do infinitivo de ברך neste contexto.
- source_word: וְלֹא הָלַךְ
  choice: não foi
  rationale: Tradução direta do verbo comum הלך, adequada à sequência narrativa.
- source_word: כְּפַעַם בְּפַעַם
  choice: como das outras vezes
  rationale: Expressa naturalmente a ideia idiomática de uma prática repetida em ocasiões anteriores.
- source_word: לִקְרַאת נְחָשִׁים
  choice: em busca de presságios
  rationale: נְחָשִׁים designa aqui sinais divinatórios, não serpentes; a formulação comunica a finalidade da prática de Balaão e preserva a possibilidade lexical em nota.
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: voltou o rosto
  rationale: Reproduz de modo natural a expressão hebraica que indica orientar-se deliberadamente em certa direção.
- source_word: אֶל הַמִּדְבָּר
  choice: para o deserto
  rationale: מִדְבָּר indica região desértica ou erma; 'deserto' é claro, corrente e adequado ao contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração 'Yahweh' preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A tradução conserva a imagem 'bom aos olhos de Yahweh', enquanto emprega formulações naturais como 'como das outras vezes' e 'voltou o rosto'.
