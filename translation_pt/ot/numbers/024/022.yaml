base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: pt
  text: Pois, se Caim[a] está destinado a ser consumido, quanto tempo passará até Assur[b] levar você cativo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, Caim provavelmente se refere aos queneus, e não ao indivíduo Caim.
    reason: lexical_alternative
  - marker: b
    text: Conforme o contexto, Assur pode significar “Assíria” ou “o assírio”.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Mantém tanto a ligação explicativa com o oráculo anterior quanto a força condicional da expressão hebraica, sem convertê-la numa afirmação categórica.
- source_word: יִהְיֶה לְבָעֵר
  choice: está destinado a ser consumido
  rationale: Expressa naturalmente o estado futuro indicado por הָיָה com לְ e preserva a imagem de algo que será consumido, sem decidir se se trata de fogo literal ou de destruição figurada.
- source_word: קָיִן
  choice: Caim
  rationale: Conserva o nome próprio hebraico em sua forma portuguesa tradicional. No contexto, provavelmente designa coletivamente os queneus, informação mantida em nota.
- source_word: עַד מָה
  choice: quanto tempo passará até
  rationale: Reproduz de maneira idiomática a pergunta temporal do hebraico e explicita sua relação com o acontecimento seguinte.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Translitera o nome hebraico sem decidir no texto principal se ele designa a Assíria ou o poder assírio.
- source_word: תִּשְׁבֶּךָּ
  choice: levar você cativo
  rationale: Reflete o sentido de שבה, 'capturar, levar ao cativeiro', e conserva o objeto na segunda pessoa do singular.
