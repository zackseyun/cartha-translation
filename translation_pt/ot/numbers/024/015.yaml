  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: pt
  text: 'Então ele proferiu seu pronunciamento e disse:


    “Declaração de Balaão, filho de Beor,

    declaração do homem cujo olho está aberto[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujo olho está fechado”. A expressão hebraica é difícil e tem sido entendida de mais de uma maneira.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Então ele proferiu seu pronunciamento
  rationale: A construção idiomática introduz uma declaração poética formal. “Proferiu seu pronunciamento” comunica a solenidade sem reproduzir de modo artificial o hebraísmo “levantou”.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Tradução direta da forma narrativa que introduz a fala citada.
- source_word: נְאֻם
  choice: declaração
  rationale: Expressa uma fala solene e autorizada; a mesma escolha é mantida nas duas ocorrências do termo.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Balaão, filho de Beor
  rationale: Emprega as formas portuguesas usuais dos nomes e reproduz diretamente o patronímico.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: Forma natural em português; a possível nuance de vigor de גֶּבֶר não é determinante neste contexto.
- source_word: שְׁתֻם הָעָיִן
  choice: cujo olho está aberto
  rationale: O contexto imediato de percepção visionária favorece a ideia de abertura revelatória, mas a expressão hebraica é difícil e sua ambiguidade é preservada em nota.
theological_decisions:
- issue: Sentido da autodescrição de Balaão שְׁתֻם הָעָיִן
  choice: cujo olho está aberto
  alternative: cujo olho está fechado
  rationale: A referência às visões divinas e aos olhos descobertos no versículo seguinte favorece a leitura “aberto”. Como a forma hebraica admite outra compreensão, a tradução não elimina a tensão e registra a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A disposição poética e a repetição de “declaração” preservam o caráter formal do pronunciamento de Balaão.
