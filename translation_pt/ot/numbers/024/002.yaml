  text: וַ/יִּשָּׂ֨א בִלְעָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִ/שְׁבָטָ֑י/ו וַ/תְּהִ֥י עָלָ֖י/ו ר֥וּחַ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: pt
  text: Então Balaão levantou os olhos e viu Israel acampado segundo as suas tribos[a]; e o Espírito de Deus veio sobre ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «instalado por suas tribos» ou «tribo por tribo».
    reason: lexical_alternative
  - marker: b
    text: Ou «e o espírito de Deus estava sobre ele».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: levantou os olhos
  rationale: Preserva de modo natural em português o idioma hebraico que descreve Balaão erguendo o olhar, sem reduzir a expressão a simplesmente «olhou».
- source_word: וַיַּרְא
  choice: viu
  rationale: Traduz diretamente o verbo de percepção e mantém a sequência narrativa do hebraico.
- source_word: שֹׁכֵן
  choice: acampado
  rationale: No contexto da organização de Israel no deserto, o particípio descreve o povo instalado em seu acampamento; «acampado» comunica isso com mais precisão contextual que «habitando».
- source_word: לִשְׁבָטָיו
  choice: segundo as suas tribos
  rationale: A preposição indica organização ou distribuição; a expressão apresenta Israel, coletivo singular, disposto conforme suas tribos.
- source_word: רוּחַ אֱלֹהִים
  choice: o Espírito de Deus
  rationale: No contexto do oráculo profético, a expressão indica mais naturalmente o Espírito de Deus capacitando Balaão, sem acrescentar pormenores doutrinários posteriores.
- source_word: וַתְּהִי עָלָיו
  choice: veio sobre ele
  rationale: Expressa adequadamente o início da atuação capacitadora do Espírito nesse momento, embora o hebraico também possa ser entendido de maneira mais estática.
theological_decisions:
- issue: Sentido de רוּחַ אֱלֹהִים no contexto da capacitação profética
  choice: o Espírito de Deus
  alternative: o espírito de Deus estava sobre ele
  rationale: O contexto favorece a referência ao Espírito divino que capacita Balaão para o oráculo. A nota preserva a possibilidade de o hebraico descrever um estado, e não enfatizar a chegada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Mantém a expressão hebraica «levantou os olhos», usa «acampado» por adequação ao cenário do deserto e preserva por notas as ambiguidades da disposição tribal e do caráter ingressivo ou estático da presença do Espírito.
