revisions:
- from: Ainda que Balaque me desse sua casa cheia de prata e ouro, eu não poderia ir além da palavra de Yahweh[a], fazendo o bem ou o mal de meu próprio coração. O que Yahweh disser, isso falarei.
  to: Se Balaque me desse sua casa cheia de prata e ouro, eu não poderia ultrapassar a palavra de Yahweh[a], para fazer o bem ou o mal por iniciativa do meu próprio coração. O que Yahweh disser, isso falarei.
  rationale: A revisão substitui a concessiva por uma condicional hipotética mais próxima de אִם e esclarece a dependência sintática de «fazer o bem ou o mal» e sua origem no «próprio coração», mantendo o sentido e o registro do versículo.
