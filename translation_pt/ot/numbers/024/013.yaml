  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: pt
  text: Se Balaque me desse sua casa cheia de prata e ouro, eu não poderia ultrapassar a palavra de Yahweh[a], para fazer o bem ou o mal por iniciativa do meu próprio coração. O que Yahweh disser, isso falarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ultrapassar a boca de Yahweh”.
    reason: A nota preserva a metáfora corporal do hebraico, enquanto o texto principal emprega «palavra de Yahweh» para maior clareza em português.
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: Ainda que ... me desse
  rationale: A conjunção אִם com o imperfeito introduz aqui uma condição hipotética extrema. “Ainda que ... me desse” comunica naturalmente a força concessiva do contexto sem transformar a hipótese em afirmação factual.
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: sua casa cheia de prata e ouro
  rationale: Preserva a imagem concreta de uma casa repleta de riquezas e soa natural em português.
- source_word: לֹא אוּכַל
  choice: eu não poderia
  rationale: O condicional acompanha adequadamente a situação hipotética introduzida no início do versículo.
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: ir além da palavra de Yahweh
  rationale: Conserva a metáfora hebraica de ultrapassar um limite estabelecido pela fala divina, substituindo apenas o literal “boca” por “palavra” no texto principal para clareza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: fazendo o bem ou o mal
  rationale: Mantém diretamente a polaridade hebraica sem restringi-la, por interpretação, apenas a abençoar ou amaldiçoar.
- source_word: מִלִּבִּי
  choice: de meu próprio coração
  rationale: Preserva a referência antropológica do hebraico e indica que a iniciativa não partiria do próprio Balaão.
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ
  choice: O que Yahweh disser, isso
  rationale: Mantém a estrutura retomada pelo demonstrativo e entende o pronome hebraico como antecipação do conteúdo falado.
- source_word: אֲדַבֵּר
  choice: falarei
  rationale: O futuro expressa naturalmente o valor do imperfeito no discurso e mantém a correspondência verbal com “disser”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
- issue: Natureza da limitação de Balaão
  choice: Balaão não pode ultrapassar a palavra divina nem agir por iniciativa própria
  alternative: Balaão não pode apenas alterar uma ordem específica de bênção ou maldição
  rationale: A formulação conserva a afirmação ampla do próprio versículo — “bem ou mal” e “de meu próprio coração” — sem extrapolar suas implicações para uma doutrina geral da profecia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “de meu próprio coração” foi mantida por fidelidade à imagem hebraica, embora seja ligeiramente mais formal. O marcador da nota foi colocado junto de “palavra de Yahweh”, expressão à qual a nota realmente se refere.
