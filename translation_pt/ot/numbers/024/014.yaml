base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: pt
  text: E agora, eis que estou indo para o meu povo. Venha, eu o aconselharei sobre o que este povo fará ao seu povo[a] nos últimos dias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “contra o seu povo”. A preposição hebraica diz literalmente “ao seu povo”, mas, neste contexto, pode indicar uma ação hostil.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos dias futuros”. A expressão hebraica pode referir-se de modo amplo ao futuro, embora “nos últimos dias” preserve seu peso profético.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto o valor temporal do marcador hebraico.
- source_word: הִנְנִי הוֹלֵךְ
  choice: eis que estou indo
  rationale: “Eis que” mantém a ênfase dêitica de הִנְנִי, e a locução progressiva expressa naturalmente a ação iminente ou em curso do particípio הוֹלֵךְ.
- source_word: לְעַמִּי
  choice: para o meu povo
  rationale: Reproduz diretamente a relação indicada no hebraico, sem especificar uma identidade étnica além do texto.
- source_word: לְכָה
  choice: Venha
  rationale: O imperativo funciona como convocação para ouvir ou agir; “Venha” é natural e conserva sua força.
- source_word: אִיעָצְךָ
  choice: eu o aconselharei
  rationale: Mantém o sentido lexical de יעץ, “aconselhar”, sem reduzi-lo a mera informação, embora a oração seguinte tenha conteúdo profético.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: sobre o que ... fará
  rationale: A construção introduz o conteúdo do conselho e é expressa de modo claro e natural em português.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Preserva o substantivo coletivo singular e a referência demonstrativa do hebraico.
- source_word: לְעַמְּךָ
  choice: ao seu povo
  rationale: Conserva a preposição hebraica em sua forma relacional mais direta; o contexto admite que a ação seja hostil, possibilidade registrada em nota.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  rationale: Expressão portuguesa reconhecível que mantém o peso profético e a possível dimensão escatológica do idioma hebraico, sem exigir que ele se refira exclusivamente ao fim da história.
theological_decisions:
- issue: Alcance temporal de בְּאַחֲרִית הַיָּמִים
  choice: nos últimos dias
  alternative: nos dias futuros
  rationale: A expressão pode apontar amplamente para um período futuro e também carregar ressonância escatológica. A tradução principal preserva essa tensão, enquanto a nota registra o sentido cronológico mais amplo.
- issue: Natureza da ação indicada por לְעַמְּךָ
  choice: ao seu povo
  alternative: contra o seu povo
  rationale: A preposição hebraica diz literalmente “a/para o seu povo”, mas o contexto profético pode envolver ação hostil. O texto principal não explicita além do original, e a nota apresenta a leitura contextual possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Eis que” conserva a ênfase marcada do hebraico; o restante evita arcaísmos desnecessários. Os marcadores de nota foram colocados junto às expressões às quais efetivamente se referem.
