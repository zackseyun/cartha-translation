source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: pt
  text: Como vales, eles se estendem; como jardins à beira de um rio; como aloés[a] que Yahweh plantou; como cedros junto às águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «madeira de ágar». O hebraico provavelmente se refere a árvores aromáticas, não a tendas.
    reason: Alternativa lexical e esclarecimento botânico.
lexical_decisions:
- source_word: נְחָלִים
  choice: vales
  rationale: O termo pode designar vales, leitos de torrente ou cursos sazonais. “Vales” é natural em português e mantém a imagem ampla, enquanto as referências seguintes preservam a associação com água e fertilidade.
- source_word: נִטָּיוּ
  choice: eles se estendem
  rationale: A forma de נטה descreve algo estendido ou espalhado. “Eles se estendem” expressa com clareza a disposição ampla do povo ou acampamento retomado do contexto.
- source_word: גַנֹּת
  choice: jardins
  rationale: Equivalente direto e corrente, preservando a imagem de cultivo e fertilidade.
- source_word: עֲלֵי נָהָר
  choice: à beira de um rio
  rationale: Neste uso, עַל indica proximidade. A expressão portuguesa é natural e comunica a presença vivificante do rio.
- source_word: אֲהָלִים
  choice: árvores de aloés
  rationale: Neste contexto poético, o termo se refere a árvores ou madeira aromática, não a tendas. A inclusão de “árvores” torna natural a ação de plantar e evita que o leitor pense apenas na planta suculenta conhecida hoje como aloé.
- source_word: נָטַע
  choice: plantou
  rationale: O perfeito hebraico apresenta a ação realizada por Yahweh. O pretérito perfeito é direto e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲרָזִים
  choice: cedros
  rationale: Equivalente habitual que preserva a imagem poética de força, altura e vigor.
- source_word: עֲלֵי מָיִם
  choice: junto às águas
  rationale: Mantém o plural hebraico “águas” e comunica proximidade a fontes abundantes de água.
theological_decisions:
- issue: Forma de traduzir o nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. O pronome “eles” retoma do contexto os acampamentos ou o povo de Israel. A formulação conserva a sucessão de quatro comparações e o plural poético “águas”.
