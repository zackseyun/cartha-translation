  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִ/שֻּׂמ֥/וֹ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: pt
  text: 'Então ele proferiu seu oráculo e disse: “Ai! Quem sobreviverá quando Deus fizer isso[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico da frase final é difícil. Também pode ser traduzido como “quando Deus estabelecer isto”; a construção admite outras análises sintáticas.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Então ele proferiu seu oráculo
  rationale: A combinação idiomática de נשׂא com מָשָׁל significa levantar ou proferir uma declaração poética. “Proferiu seu oráculo” é natural em português e se ajusta à sequência de pronunciamentos proféticos de Balaão.
- source_word: אֹוי
  choice: Ai!
  rationale: Interjeição de lamento ou pavor. “Ai!” conserva a força exclamativa sem transformar necessariamente a frase numa fórmula técnica de condenação.
- source_word: מִי יִחְיֶה
  choice: Quem sobreviverá
  rationale: Literalmente, “quem viverá?”. No contexto de acontecimentos ameaçadores, o sentido é permanecer vivo; “sobreviverá” comunica isso de modo claro e conciso.
- source_word: מִשֻּׂמוֹ אֵל
  choice: quando Deus fizer isso
  rationale: A expressão hebraica é extremamente condensada e difícil. Esta tradução entende אֵל como sujeito e מִשֻּׂמוֹ em sentido temporal, sem especificar além do necessário aquilo que Deus estabelece ou realiza.
theological_decisions:
- issue: Interpretação da cláusula difícil מִשֻּׂמוֹ אֵל
  choice: quando Deus fizer isso
  alternative: quando Deus estabelecer isso; quando ele o estabelecer, ó Deus
  rationale: O hebraico admite mais de uma análise. A leitura escolhida preserva a agência divina e produz sentido coerente no contexto, enquanto a nota registra a incerteza textual e sintática sem impor uma solução doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o tom poético e ominoso do oráculo. O marcador [a] aparece no texto principal e explica a ambiguidade genuína da cláusula final.
