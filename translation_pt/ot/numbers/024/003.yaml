source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: pt
  text: 'Então ele proferiu seu discurso e disse:


    “Declaração de Balaão, filho de Beor;

    declaração do homem de olho fechado[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cujo olho está aberto”. Alguns entendem a expressão assim por causa do contexto de visão profética e da antiga tradição interpretativa, mas a forma hebraica sugere mais diretamente “fechado” ou “cerrado”.
    reason: Leitura alternativa de uma expressão hebraica difícil.
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: Então ele proferiu seu discurso
  rationale: A expressão idiomática introduz uma fala poética formal. “Proferiu seu discurso” comunica isso em português natural sem reduzir מָשָׁל a “provérbio” nem confundi-lo com נְאֻם, usado em seguida.
- source_word: וַיֹּאמַר
  choice: e disse
  rationale: Tradução direta da forma narrativa de אמר, preservando a cadência introdutória.
- source_word: נְאֻם
  choice: declaração de
  rationale: O termo introduz um pronunciamento solene, frequentemente profético. “Declaração” é claro e mantém o caráter formal sem impor a nuance mais específica de “oráculo”.
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: Balaão, filho de Beor
  rationale: Mantém as formas consagradas dos nomes em português e expressa diretamente a filiação indicada pela construção hebraica.
- source_word: הַגֶּבֶר
  choice: o homem
  rationale: É a tradução natural neste autorretrato formular; não é necessário explicitar a possível conotação de força ou vigor de גֶּבֶר.
- source_word: שְׁתֻם הָעָיִן
  choice: de olho fechado
  rationale: A forma hebraica aponta mais diretamente para um olho fechado ou cerrrado. A formulação concisa preserva a estranheza poética, enquanto a leitura contextual alternativa é registrada em nota.
theological_decisions:
- issue: Sentido da descrição visionária שְׁתֻם הָעָיִן
  choice: de olho fechado
  alternative: cujo olho está aberto
  rationale: A expressão é lexicalmente difícil. A tradução principal segue o sentido mais direto da forma do Texto Massorético, sem harmonizá-la silenciosamente com o contexto de visão profética; a interpretação alternativa, apoiada pelo contexto e por antiga tradição interpretativa, fica explícita na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi disposto em versos, e a repetição de “declaração” preserva a estrutura solene do hebraico.
