  text: וַ/יִּֽחַר אַ֤ף בָּלָק֙ אֶל בִּלְעָ֔ם וַ/יִּסְפֹּ֖ק אֶת כַּפָּ֑י/ו וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם לָ/קֹ֤ב אֹֽיְבַ/י֙ קְרָאתִ֔י/ךָ וְ/הִנֵּה֙ בֵּרַ֣כְתָּ בָרֵ֔ךְ זֶ֖ה שָׁלֹ֥שׁ פְּעָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: pt
  text: 'Então a ira de Balaque se acendeu contra Balaão, e ele bateu uma mão contra a outra. Balaque disse a Balaão: “Eu chamei você para amaldiçoar os meus inimigos, mas veja: você os abençoou de fato[a], já por três vezes!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “abençoou, abençoar”, uma construção enfática que pode indicar uma bênção reiterada ou intensificada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: a ira de Balaque se acendeu contra Balaão
  rationale: Preserva a imagem hebraica da ira que arde, usando uma expressão natural e digna em português; “contra” comunica a direção hostil de אֶל no contexto.
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: ele bateu uma mão contra a outra
  rationale: Expressa o gesto de golpear as palmas em sinal de ira sem sugerir aplauso, possível ambiguidade de “bateu palmas” no português moderno.
- source_word: לָקֹב
  choice: para amaldiçoar
  rationale: Traduz de modo direto o infinitivo de finalidade e corresponde ao propósito explícito da convocação de Balaão.
- source_word: אֹיְבַי
  choice: os meus inimigos
  rationale: Equivalente claro e natural do substantivo plural com sufixo possessivo.
- source_word: קְרָאתִיךָ
  choice: chamei você
  rationale: Reproduz o sentido básico de chamar ou convocar em linguagem corrente, com ampla legibilidade brasileira.
- source_word: וְהִנֵּה
  choice: mas veja
  rationale: Comunica tanto o contraste inesperado quanto o chamado enfático de atenção expresso pela partícula.
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: você os abençoou de fato
  rationale: “De fato” representa a ênfase da combinação de verbo finito com infinitivo absoluto sem acrescentar a interpretação mais expansiva de que Balaão “não fez outra coisa”.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: já por três vezes
  rationale: Expressa naturalmente a repetição ocorrida até o momento da fala e conserva a força de referência ao conjunto dessas três ocasiões.
