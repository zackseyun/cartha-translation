  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: pt
  text: 'E agora, fuja para o seu lugar. Eu disse: “Certamente o honraria”[a]; mas veja, Yahweh o impediu de receber honra.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu tinha dito: ‘Certamente o honraria’”. A construção verbal hebraica traduzida por “certamente o honraria” é enfática.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Yahweh o privou da honra” ou “não deixou que você recebesse honra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Preserva tanto a ligação conclusiva com a fala anterior quanto o elemento temporal, em português natural.
- source_word: בְּרַח לְךָ
  choice: fuja
  rationale: O imperativo expressa partida apressada e transmite o tom enérgico e desdenhoso de Balaque.
- source_word: אֶל מְקוֹמֶךָ
  choice: para o seu lugar
  rationale: Mantém o sentido literal de 'lugar' sem especificar além do hebraico que se trata da casa de Balaão.
- source_word: אָמַרְתִּי
  choice: Eu disse
  rationale: O pretérito perfeito traduz diretamente a forma hebraica; o mais-que-perfeito contextual 'Eu tinha dito' permanece em nota como alternativa natural.
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: Certamente o honraria
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a promessa; 'certamente' comunica essa ênfase sem reproduzir mecanicamente a construção hebraica.
- source_word: וְהִנֵּה
  choice: mas veja
  rationale: Expressa a oposição entre a promessa de Balaque e o resultado, preservando a força de chamada de atenção de הִנֵּה em linguagem atual.
- source_word: מְנָעֲךָ
  choice: o impediu de receber
  rationale: Torna explícita em português a relação idiomática de impedir alguém de alcançar ou receber a honra prometida, sem alterar o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: מִכָּבוֹד
  choice: honra
  rationale: No contexto, כָּבוֹד designa a honra, posição e recompensa que Balaque prometera, não a glória divina em sentido abstrato.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; 'Yahweh' preserva o nome pessoal sem o substituir por um título.
- issue: Natureza da honra negada a Balaão
  choice: honra prometida por Balaque
  alternative: glória em sentido teológico ou recompensa monetária explicitamente definida
  rationale: O contexto permite que a honra inclua posição e recompensa, mas o hebraico diz simplesmente כָּבוֹד; a tradução mantém o termo amplo e não resolve além do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O imperativo “fuja” conserva a dureza da ordem, enquanto “mas veja” comunica de modo atual a mudança enfática introduzida por וְהִנֵּה.
