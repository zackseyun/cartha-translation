  text: כָּרַ֨ע שָׁכַ֧ב כַּ/אֲרִ֛י וּ/כְ/לָבִ֖יא מִ֣י יְקִימֶ֑/נּוּ מְבָרֲכֶ֣י/ךָ בָר֔וּךְ וְ/אֹרְרֶ֖י/ךָ אָרֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: pt
  text: Agachou-se e deitou-se como um leão, como uma leoa[a] — quem o despertará? Os que te abençoam são abençoados[b], e os que te amaldiçoam são amaldiçoados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um leão forte”. O termo hebraico pode designar um leão forte ou adulto; “leoa” preserva a distinção em relação à palavra anterior, traduzida por “leão”.
    reason: lexical_alternative
  - marker: b
    text: Esta fórmula de bênção e maldição faz eco de Gênesis 12:3 e 27:29.
    reason: cross_reference
lexical_decisions:
- source_word: כָּרַע
  choice: agachou-se
  rationale: No paralelo com שָׁכַב e com a imagem do leão, o verbo descreve o animal abaixando o corpo, não um gesto humano de adoração ou submissão.
- source_word: שָׁכַב
  choice: deitou-se
  rationale: Verbo comum para deitar-se; mantém a sequência poética do leão que se abaixa e repousa.
- source_word: כַּאֲרִי
  choice: como um leão
  rationale: Equivalência direta da comparação explícita com אֲרִי.
- source_word: וּכְלָבִיא
  choice: como uma leoa
  rationale: Preserva em português a distinção lexical em relação ao termo anterior, embora לָבִיא também possa designar um leão forte ou adulto.
- source_word: מִי יְקִימֶנּוּ
  choice: quem o despertará?
  rationale: No contexto de um leão deitado, a forma causativa de קום comunica fazê-lo levantar-se ou tirá-lo do repouso; 'despertará' produz uma imagem natural e vívida.
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: os que te abençoam são abençoados
  rationale: O particípio com sufixo de segunda pessoa é expresso naturalmente por uma oração substantivada; a declaração proverbial é mantida sem convertê-la em ordem ou desejo.
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: e os que te amaldiçoam são amaldiçoados
  rationale: Mantém o paralelismo e o contraste direto entre bênção e maldição.
theological_decisions:
- issue: Referente dos sufixos de segunda pessoa em 'os que te abençoam... os que te amaldiçoam'
  choice: Manter o singular 'te', permitindo a referência representativa a Israel/Jacó no oráculo
  alternative: Explicitar Israel, o rei de Israel ou o povo coletivamente
  rationale: O hebraico emprega a segunda pessoa masculina singular no contexto da linguagem poética sobre Israel/Jacó. A tradução conserva essa forma e não restringe indevidamente seu alcance representativo.
- issue: Eco da fórmula patriarcal de bênção e maldição
  choice: Traduzir a declaração diretamente e registrar o eco em nota
  alternative: Incorporar na tradução uma explicação da alusão abraâmica ou patriarcal
  rationale: A formulação remete a textos anteriores, mas a tradução não deve ampliar o que o próprio versículo afirma nem importar conclusões doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem das imagens e o paralelismo poético foram preservados; evitou-se linguagem excessivamente arcaica e também explicitação doutrinária.
