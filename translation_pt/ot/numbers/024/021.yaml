base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: pt
  text: 'Então viu o queneu e proferiu seu oráculo, dizendo:


    “Firme é tua morada,

    e teu ninho está posto[a] na rocha.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «põe teu ninho na rocha». A forma hebraica é difícil; no contexto poético, também pode descrever o ninho como já estabelecido na rocha.'
    reason: ambiguity_preservation
lexical_decisions:
- source_word: הַקֵּינִי
  choice: os queneus
  rationale: Embora a forma hebraica seja singular com artigo, ela representa coletivamente o povo queneu. Em português, o plural é mais natural e evita que a referência seja entendida como um único indivíduo.
- source_word: מְשָׁלוֹ
  choice: seu oráculo
  rationale: No ciclo de Balaão, מָשָׁל designa uma declaração poética e profética solene. “Oráculo” comunica esse valor contextual melhor que “provérbio” ou o mais genérico “discurso”.
- source_word: אֵיתָן
  choice: firme
  rationale: O adjetivo expressa solidez, permanência e segurança. “Firme” preserva essa amplitude e combina naturalmente com “morada”.
- source_word: מוֹשָׁבֶךָ
  choice: a sua morada
  rationale: O substantivo indica lugar de habitação ou assentamento. “Morada” é claro, digno e adequado ao paralelismo poético.
- source_word: וְשִׂים
  choice: está posto
  rationale: A forma hebraica é difícil e pode ser lida formalmente como imperativo, “põe”, ou, no contexto poético, como descrição da posição do ninho. A tradução predicativa produz uma linha portuguesa coerente sem ocultar a imagem.
- source_word: בַּסֶּלַע
  choice: na rocha
  rationale: סֶלַע pode indicar rocha, penhasco ou rochedo. “Na rocha” preserva a formulação ampla e a imagem de segurança nas alturas rochosas.
- source_word: קִנֶּךָ
  choice: o seu ninho
  rationale: A tradução literal mantém a metáfora aviária e seu jogo sonoro e conceitual com o nome dos queneus.
