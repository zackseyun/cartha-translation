  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: pt
  text: Como são boas as suas tendas[a], ó Jacó, as suas moradas, ó Israel!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como são belas/agradáveis as suas tendas... as suas habitações”. A exclamação hebraica expressa admiração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Como
  rationale: Aqui מַה introduz uma exclamação de admiração, não uma pergunta. “Como” é a forma exclamativa natural em português.
- source_word: טֹּבוּ
  choice: são boas
  rationale: טוֹב abrange o que é bom, agradável ou belo. “Boas” preserva essa amplitude sem limitar o sentido à aparência.
- source_word: אֹהָלֶיךָ
  choice: as suas tendas
  rationale: אֹהֶל significa normalmente “tenda”. O contexto é o acampamento de Israel, sem necessidade de uma expressão cultual.
- source_word: יַעֲקֹב
  choice: Jacó
  rationale: Mantém o nome tradicional em português; aqui é uma designação poética e coletiva do povo.
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: as suas moradas
  rationale: מִשְׁכָּן designa lugares de habitação. “Moradas” preserva o paralelismo com “tendas” e distingue os dois termos hebraicos.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome tradicional em português; em paralelo com “Jacó”, dirige-se poeticamente ao povo.
theological_decisions:
- issue: Preservar ou não a linguagem tradicional de “tabernáculos”
  choice: Usar “tendas” e “moradas”
  alternative: Usar “tabernáculos”
  rationale: O verso descreve o acampamento e as habitações de Israel, não especificamente o santuário. “Tabernáculos” acrescentaria uma associação cultual não exigida pelo hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “as suas” sustenta o paralelismo poético; “ó” conserva o vocativo solene sem arcaísmo excessivo.
