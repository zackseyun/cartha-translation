  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: pt
  text: Mas navios virão da costa de Quitim[a]; afligirão Assur[b] e afligirão Éber[c]. Também ele[d] perecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quitim pode referir-se especificamente a Chipre ou, de modo mais amplo, a povos marítimos do Ocidente.
    reason: alternative_reading
  - marker: b
    text: Assur também pode ser traduzido como “Assíria”.
    reason: lexical_alternative
  - marker: c
    text: Éber pode designar um povo ligado ao nome Éber, os hebreus ou povos situados “além” de uma fronteira, como o Eufrates.
    reason: alternative_reading
  - marker: d
    text: O hebraico diz “também ele”. O antecedente é incerto; alguns entendem o pronome coletivamente como “também ela” (a potência) ou como referência a um governante que representa o poder vindo de Quitim.
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: navios
  rationale: O substantivo designa embarcações marítimas. “Navios” é claro e não acrescenta a ideia específica de frota ou de navios de guerra.
- source_word: מִיַּד
  choice: da costa de
  rationale: Embora literalmente signifique “da mão de”, nesta expressão geográfica pode indicar o lado, o litoral ou a região de um lugar; a menção de navios favorece o sentido marítimo “da costa de”.
- source_word: כִּתִּים
  choice: Quitim
  rationale: Mantém o nome próprio hebraico em forma consagrada e preserva a incerteza entre Chipre e povos marítimos ocidentais.
- source_word: וְעִנּוּ
  choice: afligirão
  rationale: O piel de ענה pode significar afligir, humilhar ou oprimir. “Afligirão” conserva a amplitude sem especificar indevidamente a forma da subjugação.
- source_word: אַשּׁוּר
  choice: Assur
  rationale: Reproduz o nome próprio hebraico e preserva sua possível referência a povo, território ou potência, em vez de fixá-lo como “Assíria”.
- source_word: עֵבֶר
  choice: Éber
  rationale: A transliteração mantém a ambiguidade entre um nome de povo, os hebreus e povos ou territórios situados “além” de uma fronteira.
- source_word: וְגַם הוּא
  choice: Também ele
  rationale: Reflete diretamente o pronome hebraico masculino singular, sem determinar seu antecedente incerto.
- source_word: עֲדֵי אֹבֵד
  choice: acabará em destruição
  rationale: Expressa o resultado final indicado pela frase, sem intensificá-lo para “destruição eterna” ou “destruição completa”.
theological_decisions:
- issue: Identificação de Quitim, Assur, Éber e do pronome masculino final
  choice: Manter os nomes hebraicos e traduzir o pronome final no masculino singular, sem identificar seu referente histórico.
  alternative: Interpretar Quitim como Chipre ou potências marítimas ocidentais, Assur como Assíria, Éber como os hebreus ou povos de além do Eufrates, e o pronome como uma referência coletiva à potência de Quitim ou ao seu governante.
  rationale: A profecia admite identificações históricas divergentes. A tradução conserva a ambiguidade real do hebraico, em vez de impor uma interpretação específica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Os nomes próprios são preservados em formas portuguesas próximas ao hebraico, e a construção final mantém deliberadamente a incerteza do antecedente.
