source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: pt
  text: E acontecerá que o bordão do homem que eu escolher brotará, e farei cessar as queixas dos filhos de Israel[a] que pesam sobre mim, que eles dirigem contra vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas” ou “o povo de Israel”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Preserva a fórmula hebraica de introdução futura em português natural e digno.
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: o homem que eu escolher
  rationale: Mantém o masculino singular e expressa de modo idiomático a escolha divina do representante associado ao bordão.
- source_word: מַטֵּהוּ
  choice: o bordão
  rationale: No contexto, designa o bastão distintivo do líder tribal; “bordão” evita a possível ideia moderna de simples vara e mantém o caráter de insígnia.
- source_word: יִפְרָח
  choice: brotará
  rationale: O verbo pode indicar brotar ou florescer; “brotará” representa o primeiro sinal de vida, antes do desenvolvimento descrito no versículo seguinte.
- source_word: וַהֲשִׁכֹּתִי
  choice: farei cessar
  rationale: 'Reproduz o causativo: Deus fará as queixas diminuírem ou terminarem.'
- source_word: מֵעָלַי
  choice: diante de mim
  rationale: Conserva a referência explícita a Deus sem definir de forma excessiva se a expressão significa afastá-las de sobre ele ou fazê-las cessar em sua presença.
- source_word: תְּלֻנּוֹת
  choice: as queixas
  rationale: Termo atual e claro para as reclamações recorrentes do povo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar formal do hebraico, que aqui designa coletivamente o povo israelita.
- source_word: אֲשֶׁר הֵם מַלִּינִם עֲלֵיכֶם
  choice: com as quais eles murmuram contra vocês
  rationale: Liga a oração relativa às queixas e mantém tanto o aspecto contínuo do particípio quanto o sentido adversativo de עַל.
theological_decisions:
- issue: Direção das queixas em מֵעָלַי e עֲלֵיכֶם
  choice: “diante de mim” e “contra vocês”
  alternative: “contra mim” e “contra vocês”
  rationale: O segundo sintagma marca claramente Moisés e Arão como alvos da murmuração. No primeiro, מֵעָלַי expressa literalmente afastamento de sobre Deus; “diante de mim” retém a referência divina sem transformar essa construção, por si só, em uma segunda declaração explícita de alvo hostil.
- issue: Expressão corporativa בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas / o povo de Israel
  rationale: Mantém a forma familiar e pactual explícita do texto hebraico, embora no contexto ela inclua coletivamente toda a comunidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” comunica naturalmente o plural de עֲלֵיכֶם. A nota [a] está posicionada após a frase a que se refere, embora esclareça especificamente “filhos de Israel”.
