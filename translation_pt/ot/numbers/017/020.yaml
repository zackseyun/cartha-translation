revisions:
- from: E acontecerá que o bordão do homem que eu escolher brotará; assim, farei cessar diante de mim as queixas dos filhos de Israel, com as quais eles murmuram contra vocês.[a]
  to: E acontecerá que o bordão do homem que eu escolher brotará, e farei cessar as queixas dos filhos de Israel[a] que pesam sobre mim, que eles dirigem contra vocês.
  rationale: A revisão substitui a localização imprecisa “diante de mim” por uma expressão que representa o sentido de algo retirado de sobre Deus, sem transformar automaticamente a construção em uma segunda afirmação explícita de alvo hostil. Também melhora a ligação idiomática entre “queixas” e “contra vocês” e reposiciona a âncora da nota junto ao termo que ela explica.
