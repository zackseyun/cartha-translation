  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: pt
  text: Ele se pôs entre os mortos e os vivos, e a praga foi detida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Ele se pôs
  rationale: O verbo עמד expressa ficar de pé ou tomar posição. “Se pôs” comunica com naturalidade que ele tomou seu lugar naquele ponto, sem acrescentar uma ideia militar.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e
  rationale: A construção correlativa indica a posição espacial entre dois grupos distintos.
- source_word: הַמֵּתִים
  choice: os mortos
  rationale: A forma substantivada designa os que haviam morrido e mantém o contraste direto do hebraico.
- source_word: הַחַיִּים
  choice: os vivos
  rationale: A forma substantivada designa os que continuavam vivos e corresponde naturalmente ao contraste com “os mortos”.
- source_word: וַתֵּעָצַר
  choice: foi detida
  rationale: A forma verbal apresenta a praga como tendo sua progressão interrompida. A construção passiva preserva a formulação do texto sem explicitar um agente.
- source_word: הַמַּגֵּפָה
  choice: a praga
  rationale: מַגֵּפָה denota aqui uma calamidade mortal ou surto de juízo; “praga” é a tradução concisa e convencional adequada ao contexto.
theological_decisions:
- issue: Natureza de מַגֵּפָה neste contexto de juízo
  choice: a praga
  alternative: a calamidade; o surto
  rationale: “Praga” preserva a gravidade do acontecimento mortal no contexto imediato sem acrescentar uma explicação teológica ausente deste versículo.
- issue: Agente que deteve a praga
  choice: 'manutenção da voz passiva: “foi detida”'
  alternative: Deus deteve a praga; ele deteve a praga
  rationale: O hebraico não nomeia o agente nesta oração. A tradução conserva essa abertura e evita resolver implicitamente a relação entre a ação sacerdotal e a ação divina.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. A frase conserva o paralelismo incisivo entre “os mortos” e “os vivos” e a voz passiva da oração final.
