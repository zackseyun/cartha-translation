source:
  edition: WLC
  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: pt
  text: como memorial para os filhos de Israel[a], para que nenhum estranho[b], que não seja da descendência de Arão, se aproxime para queimar incenso diante de Yahweh, e para que não venha a ser como Corá e seu grupo, conforme Yahweh lhe falou por meio de Moisés[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lembrança” ou “recordação”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “estranho” é alguém não autorizado a exercer o serviço sacerdotal, e não necessariamente uma pessoa estrangeira por origem étnica.
    reason: cultural_note
  - marker: c
    text: 'Hebraico: “pela mão de Moisés”, expressão que significa “por meio de Moisés”.'
    reason: lexical_alternative
  - marker: d
    text: O pronome “lhe” provavelmente se refere a Arão.
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: memorial
  rationale: O substantivo designa algo que mantém viva a lembrança; “memorial” conserva tanto a função concreta do objeto quanto seu valor de advertência.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico em formulação tradicional ainda compreensível em português.
- source_word: אִישׁ זָר
  choice: nenhum estranho
  rationale: No contexto sacerdotal, indica alguém de fora da linhagem autorizada, não necessariamente um estrangeiro étnico; a nota esclarece esse sentido técnico.
- source_word: מִזֶּרַע אַהֲרֹן
  choice: que não seja da descendência de Arão
  rationale: Expressa com naturalidade a ideia genealógica de זֶרַע sem recorrer ao literalismo pouco idiomático “semente”.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: para queimar incenso
  rationale: Reproduz de modo claro a ação cultual de fazer o incenso produzir fumaça diante de Deus.
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: e para que não venha a ser como Corá e seu grupo
  rationale: “Venha a ser” preserva a força verbal e a advertência de compartilhar o exemplo ou destino de Corá; “grupo” é natural para עֲדָתוֹ neste contexto.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Traduz em português corrente o idioma hebraico de agência mediada, literalmente “pela mão de Moisés”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- issue: Sentido de זָר no contexto sacerdotal
  choice: estranho, entendido como pessoa não autorizada ao serviço sacerdotal
  alternative: estrangeiro; leigo; pessoa não autorizada
  rationale: A restrição é genealógica e cultual, não uma exclusão baseada em etnia; a nota impede uma leitura étnica indevida.
- issue: Referente do pronome final לוֹ
  choice: mantido como pronome ambíguo em “lhe falou”
  alternative: explicitá-lo como Arão
  rationale: O contexto provavelmente aponta para Arão, mas o hebraico não repete o nome; o texto preserva a forma pronominal e a nota registra a identificação provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém a sequência de finalidade do hebraico sem ficar rígida; “Yahweh” preserva o nome divino, e as notas conservam as alternativas lexicais e a ambiguidade do pronome final.
