  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Os israelitas” evita um hebraísmo potencialmente ambíguo; “Eis” preserva a brevidade solene da partícula, e a repetição de “estamos perecendo” mantém a força retórica do original.
