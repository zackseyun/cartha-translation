  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: pt
  text: 'Os israelitas[a] disseram a Moisés: “Eis[b] que estamos morrendo[c]! Estamos perecendo! Todos nós estamos perecendo!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Partícula hebraica de chamada de atenção, aqui usada como exclamação de alarme; também pode ser traduzida por “Vejam” ou “Olhem”.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega em sequência dois verbos diferentes: “morrer” (גוע) e “perecer” (אבד), intensificando o pânico do povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Expressa naturalmente em português a identidade coletiva indicada pelo idiomatismo hebraico “filhos de Israel”, sem sugerir que apenas os homens falaram.
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: disseram ...
  rationale: A introdução direta da citação cumpre em português a função de לֵאמֹר; acrescentar “dizendo” seria possível, mas menos natural e redundante.
- source_word: הֵן
  choice: Eis
  rationale: Partícula de chamada de atenção que, neste clamor, transmite percepção súbita e alarme. “Eis” conserva concisão e dignidade sem transformar a partícula em um imperativo explícito.
- source_word: גָּוַעְנוּ
  choice: estamos morrendo
  rationale: O verbo descreve morrer ou expirar. A forma progressiva comunica a ameaça sentida como presente no clamor do povo.
- source_word: אָבַדְנוּ
  choice: estamos perecendo
  rationale: Mantém o sentido de destruição e ruína e distingue este verbo de גוע, sem eliminar a intensificação do original.
- source_word: כֻּלָּנוּ
  choice: Todos nós
  rationale: A posição enfática preserva a ênfase hebraica na totalidade do povo.
- source_word: אָבָדְנוּ
  choice: estamos perecendo
  rationale: Repete a mesma tradução do verbo anterior para conservar a repetição retórica e o pânico do clamor.
