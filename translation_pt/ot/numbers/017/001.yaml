  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma hebraica subjacente e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa naturalmente a sequência, e “falou” traduz דבר no contexto da fórmula introdutória de discurso.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל־מֹשֶׁה
  choice: a Moisés
  rationale: A preposição אֶל indica o destinatário da fala; “falar a Moisés” é uma construção clara e digna em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula, o infinitivo introduz o conteúdo da fala. Como o discurso direto vem a seguir, os dois-pontos reproduzem naturalmente essa função em português sem o pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome pessoal divino. “Yahweh” preserva esse nome por transliteração e evita substituí-lo pelo título tradicional “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A abertura narrativa usa “Então”; os dois-pontos introduzem de modo natural a fala que começa no versículo seguinte.
