  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: pt
  text: “Afastem-se do meio desta comunidade[a], para que eu os consuma num instante[b].” Então eles se prostraram com o rosto em terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Separem-se desta assembleia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eu acabe com eles num só momento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: Afastem-se
  rationale: O nifal imperativo plural de רום significa literalmente algo como “elevem-se”, mas neste contexto funciona como uma ordem urgente para sair do meio do grupo. “Afastem-se” expressa naturalmente essa força idiomática sem tornar explícita uma separação mais técnica.
- source_word: מִתּוֹךְ
  choice: do meio de
  rationale: Reproduz a ideia espacial de sair de dentro do grupo e forma uma expressão natural em português.
- source_word: הָעֵדָה הַזֹּאת
  choice: desta comunidade
  rationale: עֵדָה designa aqui a comunidade reunida de Israel. “Comunidade” é corrente e evita restringir o termo a uma congregação cultual.
- source_word: וַאֲכַלֶּה
  choice: para que eu os consuma
  rationale: O piel de כלה pode significar consumir, acabar com ou destruir. “Consuma” conserva a imagem forte e a ameaça de destruição completa presente no hebraico.
- source_word: כְּרָגַע
  choice: num instante
  rationale: Expressa a extrema brevidade indicada pela construção hebraica de modo idiomático e incisivo.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: Então eles se prostraram com o rosto em terra
  rationale: A formulação comunica em português atual o gesto de cair sobre o rosto, preservando seu sentido de prostração sem determinar se expressa temor, súplica ou adoração.
theological_decisions:
- issue: Natureza da ordem divina a Moisés e Arão
  choice: A ordem exige que eles se afastem da comunidade antes do juízo divino iminente.
  alternative: “Elevem-se do meio desta comunidade” ou “Separem-se desta comunidade”.
  rationale: O hebraico combina uma ordem urgente com a intenção declarada de consumir rapidamente o povo. A tradução mantém tanto a urgência como a severidade, sem suavizar a ameaça nem explicar o motivo da prostração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Afastem-se” traduz idiomaticamente a ordem; “consuma” preserva a linguagem vívida do juízo; “com o rosto em terra” torna natural o idioma hebraico sem eliminar sua ressonância bíblica.
