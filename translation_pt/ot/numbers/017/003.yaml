revisions:
- from: Quanto aos incensários destes homens que pecaram à custa da própria vida[a], façam deles lâminas de metal batido[b] para revestir o altar, pois os apresentaram diante de Yahweh e eles se tornaram santos[c]. Eles serão um sinal para os israelitas[d].
  to: Quanto aos incensários destes homens que pecaram ao custo de suas vidas[a], façam deles lâminas de metal batido[b] para revestir o altar, pois os apresentaram diante de Yahweh, e os incensários se tornaram santos[c]. Eles serão um sinal para os israelitas[d].
  rationale: A revisão torna explícito que a santificação se refere aos incensários, referente mais natural no hebraico e necessário para a lógica do versículo. Também ajusta a formulação sobre a perda da vida ao plural do texto-fonte e separa, na nota, alternativas que não pertencem à expressão marcada. O sentido e a sobriedade do original são preservados.
