  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: pt
  text: Quanto aos incensários destes homens que pecaram ao custo de suas vidas[a], façam deles lâminas de metal batido[b] para revestir o altar, pois os apresentaram diante de Yahweh, e os incensários se tornaram santos[c]. Eles serão um sinal para os israelitas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com suas vidas”. Isto é, seu pecado lhes custou a vida.
    reason: lexical_alternative
  - marker: b
    text: Ou “placas marteladas” ou “lâminas marteladas de metal”.
    reason: lexical_alternative
  - marker: c
    text: Ou “foram consagrados”. O sujeito mais natural são os incensários.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “para os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: incensários
  rationale: Designa os recipientes usados para queimar incenso no episódio da rebelião; “incensários” é claro e natural no contexto cultual.
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: destes homens que pecaram à custa da própria vida
  rationale: A construção identifica os homens por seu ato pecaminoso, enquanto בְּנַפְשֹׁתָם indica, no contexto, que o pecado lhes custou a vida.
- source_word: וְעָשׂוּ אֹתָם
  choice: façam deles
  rationale: O perfeito com waw prossegue a ordem do versículo anterior; o imperativo em português comunica naturalmente essa força diretiva.
- source_word: רִקֻּעֵי פַחִים
  choice: lâminas de metal batido
  rationale: A expressão descreve metal martelado e estendido em peças finas; a formulação é concreta e compreensível.
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: para revestir o altar
  rationale: Expressa a finalidade das lâminas, que serviriam como cobertura ou revestimento do altar.
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: pois os apresentaram diante de Yahweh
  rationale: “Apresentaram” preserva o sentido cultual de trazer para diante de Deus sem sugerir que os próprios incensários fossem sacrifícios.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: וַיִּקְדָּשׁוּ
  choice: eles se tornaram santos
  rationale: O antecedente plural mais natural são os incensários; a expressão preserva o resultado de sua apresentação diante de Yahweh sem especificar além do texto a agência.
- source_word: וְיִהְיוּ לְאוֹת
  choice: Eles serão um sinal
  rationale: Mantém a função de memorial e advertência sem acrescentar sua explicação, dada no contexto seguinte.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os israelitas
  rationale: Equivalente português natural e inclusivo da designação coletiva literal “filhos de Israel”.
theological_decisions:
- issue: Referente e sentido da declaração de santificação
  choice: Os incensários se tornaram santos por terem sido apresentados diante de Yahweh.
  alternative: Os homens se tornaram santos, ou os incensários foram apenas consagrados cerimonialmente.
  rationale: Os incensários são o antecedente plural mais próximo e explicam por que o metal deve ser reaproveitado para uma finalidade sagrada. A tradução mantém a tensão de objetos ligados ao pecado terem adquirido condição santa.
- issue: Sentido de בְּנַפְשֹׁתָם
  choice: O pecado resultou na perda da própria vida.
  alternative: Pecaram contra a própria vida ou com respeito à própria alma.
  rationale: No contexto da morte dos rebeldes, a frase aponta para o custo fatal do pecado, sem impor uma distinção antropológica entre alma e vida.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. “Quanto aos” mantém a retomada temática; “façam deles” evita repetição pesada. O nome divino é preservado como “Yahweh”, e a ambiguidade possível em “se tornaram santos” é registrada em nota.
