source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֣ח אֶת הַ֠/מַּחְתָּה וְ/תֶן עָלֶ֨י/הָ אֵ֜שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ וְ/שִׂ֣ים קְטֹ֔רֶת וְ/הוֹלֵ֧ךְ מְהֵרָ֛ה אֶל הָ/עֵדָ֖ה וְ/כַפֵּ֣ר עֲלֵי/הֶ֑ם כִּֽי יָצָ֥א הַ/קֶּ֛צֶף מִ/לִּ/פְנֵ֥י יְהוָ֖ה הֵחֵ֥ל הַ/נָּֽגֶף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: pt
  text: 'Então Moisés disse a Arão: “Pegue o incensário[a], ponha nele fogo tirado do altar e coloque incenso nele. Vá depressa até a congregação e faça expiação por eles, pois a ira saiu da presença de Yahweh[b]; a praga começou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “braseiro”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de diante de Yahweh”, isto é, da sua presença.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: o incensário
  rationale: Designa o recipiente usado para transportar brasas e queimar incenso no serviço sacerdotal. “Incensário” é claro e natural neste contexto; “braseiro” também é possível.
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: ponha nele fogo tirado do altar
  rationale: Conserva tanto o recipiente como a procedência do fogo, expressos no hebraico, em uma formulação portuguesa natural.
- source_word: קְטֹרֶת
  choice: incenso
  rationale: É o termo cultual comum e seu equivalente direto em português.
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: Vá depressa
  rationale: Mantém o imperativo de movimento e a urgência do advérbio.
- source_word: הָעֵדָה
  choice: a congregação
  rationale: Em Números, refere-se à coletividade israelita reunida; “congregação” preserva essa dimensão corporativa e formal.
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: faça expiação por eles
  rationale: Preserva o sentido ritual e sacerdotal de כפר sem impor ao verbo uma teoria teológica mais estreita.
- source_word: הַקֶּצֶף
  choice: a ira
  rationale: Expressa a forte reação divina de juízo presente no termo hebraico.
- source_word: מִלִּפְנֵי יְהוָה
  choice: da presença de Yahweh
  rationale: Traduz de modo idiomático a imagem hebraica de algo que sai “de diante da face/presença” de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico.
- source_word: הֵחֵל הַנָּגֶף
  choice: a praga começou
  rationale: Neste contexto, נֶגֶף indica uma calamidade mortal enviada como juízo; “praga” é a opção contextual mais clara.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Sentido cultual de כפר
  choice: faça expiação por eles
  alternative: faça propiciação por eles; obtenha perdão para eles
  rationale: “Fazer expiação” conserva a linguagem ritual e a amplitude teológica do verbo, evitando resolver no próprio texto debates sobre o mecanismo da expiação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção foi dividida em períodos para comunicar a urgência com naturalidade, sem alterar a sequência das ordens. O marcador [a] foi colocado junto de “incensário”, termo ao qual a nota efetivamente se refere.
