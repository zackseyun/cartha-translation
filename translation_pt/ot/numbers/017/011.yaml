    issue: “sobre o fogo” substitui a referência pronominal ao incensário.
    rationale: O hebraico ordena pôr incenso “sobre/ nele”, sendo o antecedente gramatical a מַחְתָּה, o incensário. Embora o rito envolva fogo, “sobre o fogo” torna explícita uma relação não formulada dessa maneira no texto-fonte.
