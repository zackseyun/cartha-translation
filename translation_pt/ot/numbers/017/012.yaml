  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: pt
  text: Então Arão o tomou, conforme Moisés havia dito, e correu para o meio da assembleia[a]. E eis que a praga já havia começado entre o povo. Ele colocou o incenso[b] e fez expiação pelo povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “congregação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “pôs o incenso”; o hebraico diz literalmente “deu/pôs o incenso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: o tomou
  rationale: O verbo significa simplesmente “tomou”. O pronome retoma, pelo contexto do versículo anterior, o incensário, sem inserir esse substantivo no texto hebraico.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: conforme Moisés havia dito
  rationale: דבר significa “falar/dizer”, não especificamente “ordenar”. O mais-que-perfeito expressa com naturalidade que a fala de Moisés precedeu a ação de Arão.
- source_word: וַיָּרָץ אֶל תּוֹךְ הַקָּהָל
  choice: correu para o meio da assembleia
  rationale: Preserva o sentido direto de רוץ, “correr”, e de תּוֹךְ, “meio”. “Assembleia” comunica o povo reunido sem associações eclesiásticas desnecessárias.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Mantém a função vívida de הִנֵּה, chamando a atenção para a descoberta urgente de Arão.
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: a praga já havia começado entre o povo
  rationale: נֶגֶף designa aqui uma praga. “Já havia começado” expressa que ela estava em curso quando Arão chegou, e “entre o povo” traduz naturalmente בָעָם.
- source_word: וַיִּתֵּן אֶת הַקְּטֹרֶת
  choice: Ele colocou o incenso
  rationale: נתן tem o sentido básico de “dar/pôr/colocar”. “Colocou” preserva a ação concreta sem substituí-la pela interpretação ritual mais ampla “ofereceu”.
- source_word: וַיְכַפֵּר עַל הָעָם
  choice: fez expiação pelo povo
  rationale: No contexto ritual sacerdotal, כפר é adequadamente traduzido pela expressão consolidada “fazer expiação”, que conserva o peso cultual sem definir além do texto o mecanismo dessa ação.
theological_decisions:
- issue: Tradução do verbo cultual כפר
  choice: fez expiação pelo povo
  alternative: fez propiciação pelo povo
  rationale: “Fez expiação” é uma formulação clara e tradicional para a ação sacerdotal e não resolve indevidamente a tensão entre remoção da culpa e afastamento do juízo. “Propiciação” tenderia a especificar mais o mecanismo teológico.
- issue: Tradução de קָהָל
  choice: assembleia
  alternative: congregação
  rationale: “Assembleia” representa naturalmente a comunidade israelita reunida e evita sugerir, por escolha lexical, uma identificação eclesiológica mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção “e eis que” conserva a vivacidade narrativa do hebraico; “expiação” mantém a terminologia ritual necessária. Os marcadores foram posicionados junto aos termos a que suas notas se referem.
