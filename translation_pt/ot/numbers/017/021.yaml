  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וַ/יִּתְּנ֣וּ אֵלָ֣י/ו כָּֽל נְשִֽׂיאֵי/הֶ֡ם מַטֶּה֩ לְ/נָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְ/נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אֲבֹתָ֔/ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּ/מַטֵּ֥ה אַהֲרֹ֖ן בְּ/ת֥וֹךְ מַטּוֹתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: pt
  text: Então Moisés falou aos filhos de Israel[a], e todos os seus líderes lhe deram uma vara, uma para cada líder segundo as suas casas paternas, doze varas; e a vara de Arão estava entre as suas varas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas”. Em hebraico, literalmente, “aos filhos de Israel”, uma designação habitual do povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo דבר introduz a fala dirigida ao povo; “falou” é natural e mantém o valor narrativo do hebraico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva a forma hebraica e sua função como designação coletiva da comunidade de Israel; a nota oferece a alternativa idiomática.
- source_word: נְשִׂיאֵיהֶם
  choice: seus líderes
  rationale: No contexto tribal do Pentateuco, נָשִׂיא designa os representantes reconhecidos das tribos; “líderes” é claro e atual.
- source_word: מַטֶּה
  choice: vara
  rationale: Aqui se trata do objeto físico entregue como sinal representativo. “Vara” é uma tradução bíblica corrente e natural em português, adequada ao episódio do florescimento da vara de Arão.
- source_word: מַטֶּה לְנָשִׂיא אֶחָד מַטֶּה לְנָשִׂיא אֶחָד
  choice: uma para cada líder
  rationale: 'Expressa de modo natural a força distributiva da repetição hebraica: cada líder entregou uma vara.'
- source_word: לְבֵית אֲבֹתָם
  choice: segundo as suas casas paternas
  rationale: Mantém a referência às unidades ancestrais organizadas pela linhagem paterna, sem substituí-las por uma categoria social mais vaga.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: doze varas
  rationale: Tradução direta da expressão numérica, coerente com a escolha de “vara” para מַטֶּה.
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: e a vara de Arão estava entre as deles
  rationale: Acrescenta a cópula exigida pelo português e traduz בְּתוֹךְ por “entre”, preservando a inclusão da vara de Arão no conjunto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção “filhos de Israel” conserva a designação hebraica, enquanto a nota esclarece seu sentido coletivo. “Casas paternas” mantém a estrutura social do texto-fonte; a repetição distributiva foi expressa naturalmente como “uma para cada líder”.
