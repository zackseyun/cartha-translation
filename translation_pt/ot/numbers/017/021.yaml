    issue: Elipse em «entre as deles»
    rationale: Embora gramaticalmente possível, a expressão pode momentaneamente deixar indefinido se «delas» se refere às varas ou a outro antecedente. «Entre as suas varas» torna explícito o referente de מַטּוֹתָם sem alterar o sentido.
  - severity: low
    issue: Formulação da nota «designação tradicional»
    rationale: «Tradicional» é aceitável, mas «designação habitual do povo de Israel» descreve mais diretamente o uso textual da fórmula hebraica e o seu valor coletivo.
