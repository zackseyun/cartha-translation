base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: pt
  text: Moisés fez conforme Yahweh lhe havia ordenado; assim ele fez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fez
  rationale: O verbo עשה tem sentido amplo, “fazer/realizar”. Neste contexto de cumprimento de uma ordem, “fez” é natural e permite conservar a repetição do hebraico.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa correspondência entre a ação de Moisés e a ordem divina, de modo natural e digno em português.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: צוה denota uma ordem dotada de autoridade. O mais-que-perfeito composto esclarece naturalmente em português que a ordem precedeu seu cumprimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֹתוֹ
  choice: lhe
  rationale: O sufixo masculino singular refere-se a Moisés. Com “ordenar”, o pronome dativo “lhe” é a construção portuguesa mais idiomática.
- source_word: כֵּן
  choice: assim
  rationale: Retoma e confirma a conformidade mencionada na oração anterior, preservando a ênfase conclusiva.
- source_word: עָשָׂה
  choice: ele fez
  rationale: Mantém a repetição deliberada de עשה e, com o pronome explícito, reproduz a confirmação enfática do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio divino sem substituí-lo por um título; “Jeová” reflete uma forma tradicional posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura conserva a repetição enfática do verbo “fazer” e o paralelismo do hebraico sem soar excessivamente arcaica.
