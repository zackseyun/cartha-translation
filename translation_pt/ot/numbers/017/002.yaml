  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: pt
  text: Diga a Eleazar, filho do sacerdote Arão, que retire os incensários do meio do incêndio e espalhe o fogo para longe, pois eles se tornaram santos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois são santos”. O verbo hebraico também pode destacar o estado presente resultante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Diga
  rationale: O imperativo de אמר introduz a ordem que Moisés deve transmitir; “Diga” é direto e natural em português atual.
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: a Eleazar, filho do sacerdote Arão
  rationale: A construção hebraica liga mais naturalmente “o sacerdote” a Arão. A formulação portuguesa evita sugerir que “sacerdote” modifique apenas Eleazar, embora ele também exercesse função sacerdotal.
- source_word: וְיָרֵם
  choice: que retire
  rationale: A forma volitiva após o imperativo expressa o conteúdo da ordem. “Retire” comunica tanto o ato de levantar quanto o de remover os objetos de dentro da área em chamas.
- source_word: הַמַּחְתֹּת
  choice: os incensários
  rationale: מחתה designa recipientes para brasas ou incenso. “Incensários” é o termo cultual mais reconhecível em português, embora “braseiros” seja uma alternativa possível.
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: do meio do incêndio
  rationale: שׂרפה pode indicar a queima, o lugar em chamas ou seus restos queimados. “Do meio do incêndio” preserva a imagem concreta sem acrescentar “restos”, que seria interpretativo.
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: e espalhe o fogo para longe
  rationale: זרה significa espalhar ou dispersar, e הָלְאָה indica distância. “Fogo” mantém o termo explícito do hebraico, sem reduzi-lo interpretativamente a “brasas”.
- source_word: כִּי קָדֵשׁוּ
  choice: pois eles se tornaram santos
  rationale: O perfeito plural aponta mais naturalmente para os incensários e pode expressar o estado resultante de terem sido apresentados diante de Deus. O pronome explicita em português a referência plural sem repetir o substantivo.
theological_decisions:
- issue: Referente do verbo plural em כִּי קָדֵשׁוּ
  choice: Os incensários
  alternative: Os incensários e o fogo, ou mais amplamente os objetos ligados à oferta
  rationale: “Incensários” é o antecedente plural adequado mais próximo, e o contexto explica por que devem ser preservados, enquanto o fogo deve ser disperso.
- issue: Valor aspectual do perfeito קָדֵשׁוּ
  choice: se tornaram santos
  alternative: são santos
  rationale: A tradução escolhida destaca o estado resultante adquirido pelos incensários. Como o perfeito também pode ser vertido como estado presente, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Incensários” conserva o vocabulário cultual conhecido; “incêndio” expressa de modo concreto a área da queima. O marcador [a] aparece imediatamente após a oração a que se refere.
