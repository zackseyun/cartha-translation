  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: pt
  text: E você os colocará na tenda do encontro, diante do testemunho[a], onde me encontrarei com vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante do testemunho da aliança”. “O testemunho” provavelmente se refere ao testemunho da aliança ligado às tábuas no santuário.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “onde marcarei encontro com vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: E você os colocará
  rationale: O hifil, com sufixo de terceira pessoa masculina plural, indica fazer com que os objetos sejam postos em determinado lugar. “Colocará” é claro, natural e mantém a força da instrução.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: na tenda do encontro
  rationale: É a designação habitual do santuário. A tradução conserva de modo transparente os elementos do hebraico sem transformar a expressão em nome próprio.
- source_word: לִפְנֵי הָעֵדוּת
  choice: diante do testemunho
  rationale: לִפְנֵי indica posição diante de algo, e הָעֵדוּת significa literalmente “o testemunho”. A formulação não especifica além do texto se o referente são as tábuas, a arca ou, mais amplamente, o testemunho da aliança.
- source_word: אֲשֶׁר אִוָּעֵד
  choice: onde me encontrarei
  rationale: Nesse contexto do santuário, o nifal de יעד exprime um encontro marcado. “Onde” incorpora naturalmente o valor locativo da oração relativa.
- source_word: לָכֶם
  choice: com vocês
  rationale: Embora ל possa ter o sentido básico de “a/para”, com יעד a expressão idiomática descreve encontrar-se com alguém.
- source_word: שָׁמָּה
  choice: incorporado em “onde”
  rationale: O advérbio locativo é expresso naturalmente por “onde”, evitando a redundância pouco idiomática “onde... ali” sem perda de sentido.
theological_decisions:
- issue: Referente de “o testemunho”
  choice: Manter a expressão literal “o testemunho”.
  alternative: “as tábuas do testemunho”, “a arca do testemunho” ou “o testemunho da aliança”
  rationale: O hebraico é teologicamente carregado, mas não identifica explicitamente o referente neste versículo. A tradução preserva essa abertura em vez de impor uma interpretação.
- issue: Sentido de אִוָּעֵד
  choice: “me encontrarei”
  alternative: “marcarei encontro”
  rationale: Ambas as formulações refletem a ideia de encontro designado; o texto principal usa a opção mais natural em português, e a nota conserva a nuance alternativa.
translation_notes:
  register: Português moderno, claro e digno, com “você/vocês” para distinguir o destinatário singular da instrução e o grupo plural com quem Deus se encontra. Mantém-se “tenda do encontro” em minúsculas como descrição transparente do santuário.
