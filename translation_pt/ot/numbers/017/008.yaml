base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/008.yaml
  text: Then Moses and Aaron came before the Tent of Meeting[a].
translation:
  language: pt
  text: Então Moisés e Arão vieram diante da Tenda do Encontro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “para a face da Tenda do Encontro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Então ... foram
  rationale: O wayyiqtol de בוא faz a narrativa avançar e tem valor de passado. Embora o verbo hebraico esteja no singular antes do sujeito composto, o português exige aqui a concordância natural no plural. “Foram” indica aproximação sem afirmar que entraram na tenda.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְאַהֲרֹן
  choice: e Arão
  rationale: Conjunção seguida da forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶל־פְּנֵי
  choice: para diante de
  rationale: A expressão significa literalmente “para a face de” e indica movimento até a parte frontal ou presença de algo. “Para diante de” preserva tanto o movimento expresso por אֶל quanto a ideia espacial de פְּנֵי.
- source_word: אֹהֶל מוֹעֵד
  choice: Tenda do Encontro
  rationale: Tradução clara e tradicional do nome da estrutura sagrada específica, mantendo a relação construta e o sentido cultual; as iniciais maiúsculas assinalam seu uso como designação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “foram para diante” evita a ambiguidade de “vieram” sem ponto de referência explícito e não sugere indevidamente que Moisés e Arão entraram na tenda.
