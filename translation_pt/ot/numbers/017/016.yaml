  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/016.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; também transliterado “Yahweh”.'
    reason: Identifica a forma hebraica do nome divino e preserva o esclarecimento de transliteração indicado no trilho de auditoria em inglês.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar. “Então ... falou” soa natural em português e preserva o sentido do verbo דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição indica o destinatário da fala; “falou a Moisés” é uma construção clara e corrente.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala direta seguinte. Em português atual, os dois-pontos cumprem essa função com naturalidade e evitam o pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e corresponde melhor à transliteração acadêmica corrente, embora a vocalização antiga não seja conhecida com plena certeza.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão, com fluidez brasileira. A fórmula hebraica de introdução à fala direta é expressa por dois-pontos, pois a fala continua no versículo seguinte.
