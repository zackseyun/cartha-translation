base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: pt
  text: Os que morreram na praga foram catorze mil e setecentos, além dos que morreram por causa de Corá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em conexão com o caso de Corá”. A expressão se refere aos que já haviam morrido no episódio da rebelião de Corá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הַמֵּתִים
  choice: Os que morreram ... foram
  rationale: O particípio substantivado é expresso naturalmente como “os que morreram”; a forma narrativa de היה introduz o total, sem exigir um marcador temporal explícito em português.
- source_word: בַּמַּגֵּפָה
  choice: na praga
  rationale: מַגֵּפָה designa aqui uma praga mortal, e a preposição situa essas mortes no curso dela.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: catorze mil e setecentos
  rationale: Reprodução direta do total numérico em português corrente.
- source_word: מִלְּבַד
  choice: além de
  rationale: Indica que as mortes ligadas a Corá não estão incluídas no total de 14.700.
- source_word: עַל דְּבַר קֹרַח
  choice: por causa de Corá
  rationale: A expressão pode indicar causa ou ligação com o caso de Corá; “por causa de Corá” é clara e natural, enquanto a nota preserva a alternativa menos causal.
theological_decisions:
- issue: Âmbito das mortes associadas a Corá
  choice: Distinguir as 14.700 mortes na praga das mortes anteriores causadas pelo episódio de Corá, sem especificar categorias adicionais.
  alternative: “os que morreram no caso de Corá”
  rationale: O hebraico remete ao juízo ligado a Corá, mas não detalha neste versículo quais grupos compõem esse total anterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação mantém a distinção numérica e histórica do hebraico sem acrescentar explicações denominacionais.
