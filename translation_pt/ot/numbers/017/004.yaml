base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/004.yaml
  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: pt
  text: Então o sacerdote Eleazar pegou os incensários[a] de bronze que aqueles que foram queimados[b] haviam oferecido; os incensários foram martelados para servir de revestimento[c] ao altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “braseiros”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os queimados” ou “os que foram queimados”, referindo-se aos que foram consumidos pelo fogo na narrativa anterior.'
    reason: lexical_alternative
  - marker: c
    text: Ou “cobertura” ou “chapeamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: incensários
  rationale: Designa recipientes usados para transportar brasas e incenso; “incensários” é claro e adequado ao contexto ritual.
- source_word: הַנְּחֹשֶׁת
  choice: bronze
  rationale: נְחֹשֶׁת pode indicar cobre ou bronze; “bronze” é a tradução convencional e contextualmente provável para os utensílios do santuário.
- source_word: הִקְרִיבוּ
  choice: haviam oferecido
  rationale: No contexto ritual, o hifil de קרב significa apresentar ou oferecer. O mais-que-perfeito deixa clara a anterioridade em relação à ação de Eleazar.
- source_word: הַשְּׂרֻפִים
  choice: aqueles que foram queimados
  rationale: O particípio passivo substantivado significa literalmente “os queimados” ou “os que foram queimados” e remete às pessoas consumidas pelo fogo na narrativa anterior.
- source_word: וַיְרַקְּעוּם
  choice: eles foram martelados
  rationale: רקע descreve o ato de bater ou martelar metal até achatá-lo. A construção passiva em português preserva o objeto plural expresso pelo sufixo e evita identificar um agente que o texto não especifica claramente.
- source_word: צִפּוּי
  choice: revestimento
  rationale: Denota uma cobertura aplicada sobre uma superfície; “revestimento” comunica com naturalidade o uso das lâminas metálicas no altar.
- source_word: לַמִּזְבֵּחַ
  choice: ao altar
  rationale: 'O lamed indica a finalidade ou destinação do revestimento: ele seria aplicado ao altar.'
