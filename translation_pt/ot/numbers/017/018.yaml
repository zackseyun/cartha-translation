  text: וְ/אֵת֙ שֵׁ֣ם אַהֲרֹ֔ן תִּכְתֹּ֖ב עַל מַטֵּ֣ה לֵוִ֑י כִּ֚י מַטֶּ֣ה אֶחָ֔ד לְ/רֹ֖אשׁ בֵּ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: pt
  text: E você escreverá o nome de Arão na vara de Levi, pois haverá uma vara para cada chefe de sua família paterna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois haverá uma só vara para o chefe da família paterna deles”. A frase hebraica também pode ser entendida sem explicitar o sentido distributivo de “cada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: E
  rationale: A conjunção dá continuidade às instruções do versículo anterior; o marcador de objeto direto אֵת não recebe tradução própria.
- source_word: שֵׁם אַהֲרֹן
  choice: o nome de Arão
  rationale: Tradução direta da expressão, com a forma portuguesa tradicional do nome próprio.
- source_word: תִּכְתֹּב
  choice: você escreverá
  rationale: O imperfeito qal de segunda pessoa masculina singular tem força instrutiva; o futuro em português expressa a ordem solene de modo natural.
- source_word: עַל מַטֵּה לֵוִי
  choice: na vara de Levi
  rationale: מַטֶּה designa aqui o objeto físico que representa a tribo. “Vara” é corrente na tradição bíblica portuguesa e mantém o sentido concreto; “na” traduz naturalmente a relação espacial de עַל.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para se escrever o nome de Arão na vara representativa de Levi.
- source_word: מַטֶּה אֶחָד
  choice: uma vara
  rationale: Expressa que há uma única vara representativa por chefe ou unidade ancestral.
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: para cada chefe de sua família paterna
  rationale: O singular com valor distributivo é explicitado por “cada”; רֹאשׁ é vertido funcionalmente como “chefe”, e בֵּית אָבוֹת como “família paterna”, expressão clara para a unidade de parentesco ancestral.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla compreensão no Brasil. “Vara” preserva o objeto concreto e sua função representativa. A nota mantém a ambiguidade sintática do hebraico quanto ao valor distributivo da frase final.
