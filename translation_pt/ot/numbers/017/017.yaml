base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a] e tome deles uma vara para cada casa paterna, das mãos de todos os seus líderes, segundo as suas casas paternas: doze varas[b]. Escreva o nome de cada homem em sua vara.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “bastões”. O termo hebraico מַטֶּה pode designar uma vara ou um bastão; aqui se refere a um objeto físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva de modo transparente o idioma hebraico e sua forma masculina; a alternativa coletiva mais natural é indicada em nota.
- source_word: מַטֶּה
  choice: vara
  rationale: Aqui designa o objeto físico no qual se escreve um nome e que mais tarde brota; “vara” é claro, tradicional e natural em português.
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: uma vara para cada casa paterna
  rationale: A construção distributiva repetida é expressa naturalmente por “uma... para cada”, mantendo a organização por casa paterna.
- source_word: נְשִׂיאֵיהֶם
  choice: seus líderes
  rationale: Comunica a função dos chefes tribais sem sugerir indevidamente dignidade régia, como poderia ocorrer com “príncipes”.
- source_word: לְבֵית אֲבֹתָם
  choice: segundo as casas de seus pais
  rationale: Mantém a referência à organização dos líderes por suas linhagens e unidades ancestrais.
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: doze varas
  rationale: Tradução direta e coerente com a escolha de “vara” para מַטֶּה.
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: Escreva o nome de cada homem
  rationale: Preserva a força distributiva de אִישׁ em uma ordem natural no português moderno.
- source_word: עַל מַטֵּהוּ
  choice: em sua vara
  rationale: Expressa de modo idiomático que o nome deve ser inscrito na vara correspondente a cada homem.
