  text: וַ/יַּנַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֹּ֖ת לִ/פְנֵ֣י יְהוָ֑ה בְּ/אֹ֖הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: pt
  text: Então Moisés colocou as varas diante de Yahweh, na tenda do testemunho.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os bastões”. O hebraico se refere aqui às varas físicas que representavam as tribos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no tabernáculo do testemunho”. Literalmente: “na tenda do testemunho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: colocou
  rationale: O hifil de נוח, nesta forma narrativa, indica pôr ou deixar algo em determinado lugar. “Colocou” é natural, concreto e fiel ao contexto.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: הַמַּטֹּת
  choice: as varas
  rationale: מַטֶּה pode significar vara, bastão ou tribo. Aqui designa os objetos físicos que representam as tribos; “varas” é claro e corrente em português bíblico.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa a posição perante ou na presença de alguém, preservando de modo conciso tanto a dimensão espacial quanto a apresentação perante Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּאֹהֶל
  choice: na tenda
  rationale: אֹהֶל significa literalmente “tenda”. Esta escolha preserva a imagem concreta do hebraico; “tabernáculo” é uma alternativa tradicional.
- source_word: הָעֵדֻת
  choice: do testemunho
  rationale: עֵדוּת designa aqui o testemunho da aliança associado ao santuário. “Testemunho” mantém a formulação hebraica sem explicitação interpretativa excessiva.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança, em vez de substituí-lo pelo título “SENHOR”.
- issue: Sentido de עֵדוּת na designação do santuário
  choice: testemunho
  alternative: documento da aliança; testemunho da aliança
  rationale: A forma concisa preserva a expressão tradicional e a amplitude do termo, sem decidir no corpo do texto se a referência imediata é às tábuas, ao documento da aliança ou à sua função de testemunho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é direta e conserva a terminologia concreta do hebraico.
