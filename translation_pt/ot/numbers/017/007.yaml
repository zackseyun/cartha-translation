  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: pt
  text: E aconteceu que, quando a comunidade se reuniu contra Moisés e Arão, Moisés e Arão se voltaram para a tenda do encontro; eis que a nuvem a cobriu[a], e a glória de Yahweh apareceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a nuvem o cobriu”; o pronome se refere mais naturalmente à “tenda do encontro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Preserva a transição narrativa do hebraico sem recorrer à formulação arcaica «e sucedeu».
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: quando a comunidade se reuniu
  rationale: A preposição com o infinitivo indica circunstância temporal, e o nifal expressa o ato de reunir-se; «comunidade» comunica o caráter coletivo de עֵדָה em linguagem corrente.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: contra Moisés e Arão
  rationale: No contexto de oposição, עַל tem sentido hostil, não apenas espacial.
- source_word: וַיִּפְנוּ
  choice: as pessoas se voltaram
  rationale: O verbo indica que os integrantes da comunidade mudaram fisicamente sua orientação. A explicitação «as pessoas» reproduz naturalmente em português o verbo hebraico no plural após o substantivo coletivo singular.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Traduz diretamente os dois elementos da designação hebraica do santuário no deserto, sem substituí-la pelo termo mais interpretativo «tabernáculo».
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Mantém a força de apresentação visual e a solenidade de הִנֵּה.
- source_word: כִסָּהוּ הֶעָנָן
  choice: a nuvem a cobriu
  rationale: Conserva o pronome sufixado do hebraico; em português, o pronome feminino concorda com «tenda», seu referente mais natural.
- source_word: וַיֵּרָא
  choice: apareceu
  rationale: Expressa de modo natural a manifestação visível indicada pelo nifal de ראה.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Preserva a expressão bíblica de manifestação divina e verte o nome pessoal יְהוָה por transliteração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto apresenta o Tetragrama diretamente; «Yahweh» preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Referente do sufixo em כִסָּהוּ
  choice: a tenda do encontro
  alternative: a comunidade ou toda a cena
  rationale: O antecedente masculino singular mais próximo no hebraico é אֹהֶל, «tenda», e o contexto também favorece a nuvem cobrindo o santuário. A nota registra a identificação sem eliminar totalmente a questão referencial.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. «Eis que» foi mantido por sua função solene e de destaque visual. A alternância entre o coletivo singular «comunidade» e «as pessoas» comunica naturalmente o plural do verbo hebraico.
