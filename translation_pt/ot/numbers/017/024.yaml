base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: pt
  text: Então Moisés tirou todas as varas da presença de Yahweh e as apresentou a todos os israelitas; eles as viram, e cada homem pegou a sua vara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: levou
  rationale: O hifil de יצא tem sentido causativo, isto é, fazer sair ou levar para fora. Em português, “levou” expressa naturalmente que Moisés retirou as varas da presença de Yahweh e as apresentou aos israelitas.
- source_word: הַמַּטֹּת
  choice: as varas
  rationale: מַטֶּה pode designar vara, cajado ou tribo. Aqui se refere aos objetos físicos colocados diante de Yahweh; “varas” é claro, corrente e adequado ao contexto.
- source_word: מִלִּפְנֵי יְהוָה
  choice: de diante de Yahweh
  rationale: Preserva a expressão espacial hebraica מִלִּפְנֵי e mantém o nome divino explícito.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: a todos os israelitas
  rationale: A expressão literal “filhos de Israel” funciona aqui como designação nacional. “Israelitas” transmite esse sentido de modo natural e inclusivo em português moderno.
- source_word: וַיִּרְאוּ
  choice: eles as viram
  rationale: ראה significa primariamente “ver”. O pronome “as” explicita em português o objeto facilmente recuperável, as varas, sem acrescentar a ideia interpretativa de examiná-las.
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: cada homem pegou a sua vara
  rationale: אִישׁ tem valor distributivo e masculino neste contexto. “Cada homem” preserva essa forma, e “pegou” representa naturalmente לקח.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a orientação fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação hebraica foi vertida com ponto e vírgula e “depois” para tornar clara a sequência narrativa sem alterar seu conteúdo.
