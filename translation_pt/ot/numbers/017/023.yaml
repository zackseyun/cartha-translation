base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: pt
  text: 'No dia seguinte, Moisés entrou na tenda do testemunho e eis que a vara de Arão, que representava a casa de Levi[a], havia brotado: dera botões, produzira flores e amadurecera amêndoas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a vara de Arão representava a tribo de Levi.
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: No dia seguinte
  rationale: Expressa de modo natural em português a sequência temporal indicada pelo hebraico.
- source_word: אֹהֶל הָעֵדוּת
  choice: tenda do testemunho
  rationale: Preserva a designação formal e a nuance jurídica e pactual de עֵדוּת.
- source_word: וְהִנֵּה
  choice: e viu que
  rationale: Transmite em narrativa portuguesa a descoberta súbita destacada pela partícula hebraica, evitando o arcaísmo pouco natural de «e eis que».
- source_word: מַטֵּה
  choice: vara
  rationale: É a designação bíblica corrente e clara para o objeto levado pelos chefes tribais.
- source_word: פָּרַח
  choice: havia brotado
  rationale: Apresenta o resultado já constatado por Moisés e inicia naturalmente a progressão vegetal.
- source_word: לְבֵית לֵוִי
  choice: que representava a casa de Levi
  rationale: Explicita a função representativa do dativo sem trocar a expressão hebraica «casa de Levi» por «tribo».
- source_word: וַיֹּצֵא פֶרַח
  choice: dera botões
  rationale: Distingue o primeiro desenvolvimento visível da floração subsequente e mantém a progressão do texto.
- source_word: וַיָּצֵץ צִיץ
  choice: produzira flores
  rationale: Representa a etapa da floração com linguagem portuguesa natural, sem fundi-la com o brotar.
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: amadurecera amêndoas
  rationale: Preserva o sentido de levar o fruto à maturidade, clímax da sequência milagrosa.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção «e viu que» comunica a força de descoberta de וְהִנֵּה sem recorrer a «e eis que». Os mais-que-perfeitos simples preservam a anterioridade dos acontecimentos e dão concisão à sequência.
