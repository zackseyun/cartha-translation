  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הָשֵׁ֞ב אֶת מַטֵּ֤ה אַהֲרֹן֙ לִ/פְנֵ֣י הָ/עֵד֔וּת לְ/מִשְׁמֶ֥רֶת לְ/א֖וֹת לִ/בְנֵי מֶ֑רִי וּ/תְכַ֧ל תְּלוּנֹּתָ֛/ם מֵ/עָלַ֖/י וְ/לֹ֥א יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: pt
  text: 'E Yahweh disse a Moisés: “Coloque de volta a vara de Arão diante do testemunho[a], para que fique guardada como sinal para os filhos da rebeldia[b]. Assim você porá fim às murmurações deles contra mim, e eles não morrerão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O testemunho” provavelmente se refere ao testemunho da aliança associado à arca; o hebraico mantém a expressão de forma concisa.
    reason: cultural_note
  - marker: b
    text: Expressão hebraica que também pode ser traduzida como “os rebeldes” ou “os filhos rebeldes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: הָשֵׁב
  choice: Coloque de volta
  rationale: O imperativo hifil de שוב ordena que Moisés restitua a vara ao lugar em que estava; a expressão é clara e natural em português moderno.
- source_word: מַטֵּה אַהֲרֹן
  choice: a vara de Arão
  rationale: “Vara” é a designação portuguesa tradicional e ainda corrente para esse objeto, além de se ajustar ao sinal sacerdotal do contexto.
- source_word: לִפְנֵי הָעֵדוּת
  choice: diante do testemunho
  rationale: Mantém concisa a expressão hebraica e não acrescenta “arca” ou “documento”, embora o contexto do santuário associe o testemunho à aliança e à arca.
- source_word: לְמִשְׁמֶרֶת
  choice: para que fique guardada
  rationale: Expressa a finalidade de conservar a vara sob custódia, com formulação idiomática em português.
- source_word: לְאוֹת
  choice: como sinal
  rationale: אוֹת designa um sinal ou memorial perceptível; “como sinal” comunica diretamente essa função.
- source_word: לִבְנֵי מֶרִי
  choice: para os filhos da rebeldia
  rationale: Preserva a imagem filial marcada do hebraico, em vez de reduzi-la silenciosamente a “rebeldes”; a nota esclarece o sentido idiomático.
- source_word: וּתְכַל
  choice: Assim você porá fim
  rationale: O hifil de כלה indica fazer cessar ou levar ao fim. A formulação conserva Moisés como sujeito e entende a coordenação no contexto como resultado pretendido.
- source_word: תְּלוּנֹּתָם מֵעָלַי
  choice: às murmurações deles contra mim
  rationale: “Murmurações” preserva o tema recorrente das queixas de Israel no deserto, e “contra mim” traduz o sentido contextual de מֵעָלַי.
- source_word: וְלֹא יָמֻתוּ
  choice: e eles não morrerão
  rationale: Mantém a coordenação hebraica e apresenta a preservação da vida como resultado da cessação das murmurações.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome próprio da aliança. A transliteração o preserva sem substituí-lo por um título ou adotar uma vocalização alternativa tradicional.
- issue: Sentido de לִפְנֵי הָעֵדוּת
  choice: diante do testemunho
  alternative: diante da arca do testemunho; diante do documento da aliança
  rationale: O contexto provavelmente aponta para o testemunho da aliança associado à arca, mas o texto diz apenas “o testemunho”; a tradução não resolve além do hebraico essa referência metonímica.
- issue: Imagem de לִבְנֵי מֶרִי
  choice: filhos da rebeldia
  alternative: rebeldes; filhos rebeldes
  rationale: A expressão conserva a imagem hebraica e sua força caracterizadora, enquanto a nota oferece equivalentes idiomáticos sem impor uma distinção doutrinária.
- issue: Relação entre cessação das murmurações e morte
  choice: e eles não morrerão
  alternative: para que não morram
  rationale: A coordenação do hebraico é mantida, deixando perceptível tanto a sequência quanto a finalidade ou resultado pretendido, sem explicitar uma construção causal mais forte do que o texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas especialmente naturais para leitores brasileiros. Mantiveram-se duas expressões deliberadamente concisas ou marcadas do hebraico — “o testemunho” e “filhos da rebeldia” — acompanhadas de notas para assegurar clareza sem eliminar a textura do original.
