  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: pt
  text: Todo aquele que se aproxima, que se aproxima do tabernáculo de Yahweh, morrerá. Será que todos nós pereceremos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Será que todos nós morreremos?» O hebraico usa aqui uma formulação diferente da de «morrerá»; ela pode transmitir a ideia de chegar ao fim ou perecer, em vez de simplesmente repetir o mesmo verbo.'
    reason: Alternativa lexical; esclarece a diferença entre a formulação final e o verbo anterior sem fixar uma nuance discutível.
lexical_decisions:
- source_word: כֹּל
  choice: Todo aquele que
  rationale: Introduz uma afirmação abrangente sobre qualquer pessoa que se aproxime; esta formulação preserva a força universal e soa natural em português.
- source_word: הַקָּרֵב הַקָּרֵב
  choice: que se aproxima, que se aproxima
  rationale: Mantém a repetição enfática do particípio hebraico, preservando a urgência e o temor da fala do povo.
- source_word: מִשְׁכַּן
  choice: tabernáculo
  rationale: É o termo consagrado e específico para a estrutura do santuário no deserto, embora o sentido lexical básico seja «morada».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יָמוּת
  choice: morrerá
  rationale: O imperfeito indica a consequência esperada de aproximar-se do tabernáculo; o futuro simples comunica isso com clareza.
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: pereceremos
  rationale: A combinação de תמם, «chegar ao fim, acabar-se», com גוע, «expirar, morrer», exprime o temor de um fim fatal; «pereceremos» reproduz esse sentido de modo conciso e distingue a expressão do verbo anterior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o nome divino. «Yahweh» preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido da pergunta final
  choice: Será que todos nós pereceremos?
  alternative: Será que todos nós morreremos?
  rationale: A tradução mantém a lamentação retórica e a ideia de destruição total sugerida por תמם, sem excluir o sentido concreto de morrer expresso por גוע.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição semítica foi preservada deliberadamente. A pergunta final foi formulada de maneira natural, sem eliminar sua ambiguidade lexical.
