  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: pt
  text: 'Mas, no dia seguinte, toda a comunidade dos filhos de Israel[a] murmurou contra Moisés e contra Arão, dizendo: “Vocês mataram o povo de Yahweh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Israel”; também pode ser traduzido como “israelitas” ou “povo de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: YHWH, transliterado aqui como “Yahweh”; muitas traduções o vertem por “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: murmurou
  rationale: O verbo לון, nesta forma e no contexto das narrativas do deserto, expressa uma queixa coletiva e hostil contra os líderes. “Murmurou” é corrente na linguagem bíblica em português e conserva esse sentido melhor que o termo mais genérico “reclamou”.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a comunidade dos filhos de Israel
  rationale: “Comunidade” comunica de modo natural o caráter corporativo de עֵדָה, enquanto “filhos de Israel” reproduz a expressão hebraica בְּנֵי יִשְׂרָאֵל sem apagar sua forma tradicional e pactual.
- source_word: מִמָּחֳרָת
  choice: no dia seguinte
  rationale: Equivalente direto, claro e idiomático para a indicação temporal hebraica.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: contra Moisés e contra Arão
  rationale: A repetição de “contra” acompanha a repetição da preposição עַל e mantém a ênfase acusatória dirigida a cada líder.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma natural de introduzir o discurso direto e correspondência próxima ao infinitivo hebraico.
- source_word: אַתֶּם הֲמִתֶּם
  choice: Vocês mataram
  rationale: A forma é causativa e está na segunda pessoa do plural. “Vocês mataram” transmite de modo direto a acusação de que Moisés e Arão causaram a morte do povo.
- source_word: עַם יְהוָה
  choice: o povo de Yahweh
  rationale: Preserva tanto a designação pactual “povo” quanto a relação expressa pelo nome divino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” mantém o nome pactual e evita substituir o nome por um título, enquanto a nota registra a convenção alternativa mais comum.
- issue: Expressão de gênero em בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A escolha conserva a forma masculina da expressão hebraica e sua ressonância histórica, sem negar que ela designa toda a comunidade de Israel.
- issue: Responsabilidade atribuída a Moisés e Arão em הֲמִתֶּם
  choice: Vocês mataram
  alternative: Vocês causaram a morte de
  rationale: A tradução retém a força da acusação feita pela comunidade, sem amenizá-la nem afirmar que a acusação do povo era verdadeira.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe acompanha de perto a progressão hebraica, mas evita construções arcaicas. “Vocês” torna inequívoco o plural da acusação.
