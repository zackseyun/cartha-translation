  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também transliterado como “Jeová”.'
    reason: Registra a forma hebraica do nome divino e uma transliteração alternativa tradicional.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O waw consecutivo com דבר faz a narrativa avançar. “Falou” é natural em português e mantém a distinção formal em relação a אמר, aqui representado por “dizendo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “falou a Moisés” é uma construção corrente e digna em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome próprio hebraico.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Preserva a fórmula hebraica que introduz o discurso direto apresentado no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal e a nota registra uma transliteração alternativa sem substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da fórmula narrativa hebraica. A vírgula e os dois-pontos indicam que o discurso direto continua no versículo seguinte.
