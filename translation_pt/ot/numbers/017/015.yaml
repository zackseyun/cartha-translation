  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: pt
  text: Então Arão voltou para junto de Moisés, à entrada da tenda do encontro, e a praga foi detida[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi contida”, “foi interrompida” ou “cessou”.'
    reason: Alternativas lexicais para נֶעֱצָרָה, que pode descrever a praga sendo detida, contida ou levada a cessar.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Então Arão voltou
  rationale: A forma narrativa com waw consecutivo dá sequência aos acontecimentos; “Então” comunica essa progressão com naturalidade, e שׁוּב indica aqui o retorno de Arão.
- source_word: אֶל מֹשֶׁה
  choice: para junto de Moisés
  rationale: אֶל expressa movimento em direção a Moisés. “Para junto de” evita a possível leitura de que Arão simplesmente devolveu algo “para Moisés” e combina naturalmente com “voltou”.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: פֶּתַח designa a entrada ou abertura. Depois de “voltou para junto de Moisés”, a expressão local “à entrada” comunica com clareza onde Moisés estava. “Tenda do encontro” traduz de modo transparente אֹהֶל מוֹעֵד.
- source_word: הַמַּגֵּפָה
  choice: a praga
  rationale: מַגֵּפָה designa neste contexto uma calamidade mortal, associada ao juízo divino; “praga” é claro, corrente e adequado ao contexto.
- source_word: נֶעֱצָרָה
  choice: foi detida
  rationale: O nifal de עצר indica que a praga foi levada a parar. A construção passiva preserva a forma hebraica sem tornar explícito um agente que a oração não nomeia.
theological_decisions:
- issue: Agência divina implícita na interrupção da praga
  choice: Manter a passiva “a praga foi detida”, sem nomear explicitamente o agente.
  alternative: “O SENHOR deteve a praga” ou “a praga cessou”.
  rationale: O contexto permite entender a ação divina, mas o hebraico emprega uma forma passiva e não menciona o agente nesta oração. A tradução preserva essa contenção teológica e a ambiguidade gramatical do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Arão” e “tenda do encontro” mantêm formas bíblicas reconhecíveis sem linguagem arcaica. O marcador da nota foi colocado após “foi detida”, termo ao qual a alternativa lexical se refere.
