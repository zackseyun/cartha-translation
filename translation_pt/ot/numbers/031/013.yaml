  yaml_path: translation/ot/numbers/031/013.yaml
  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: pt
  text: Então Moisés, o sacerdote Eleazar e todos os líderes da comunidade saíram ao encontro deles fora do acampamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: saíram
  rationale: O wayyiqtol de יצא indica movimento para fora; «saíram» é a forma narrativa natural e preserva essa direção.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: o sacerdote Eleazar
  rationale: O título em aposição identifica a função de Eleazar; esta ordem é natural em português e não altera o sentido.
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: todos os líderes da comunidade
  rationale: נְשִׂיאֵי designa os dirigentes reconhecidos do povo, não príncipes reais neste contexto; הָעֵדָה refere-se à comunidade reunida de Israel.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: A construção expressa a finalidade do movimento e corresponde naturalmente à locução portuguesa «sair ao encontro de».
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: A expressão indica o lugar além dos limites do acampamento; a tradução evita uma reprodução literal pouco natural da preposição hebraica.
