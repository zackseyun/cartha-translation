  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: pt
  text: Então Moisés e o sacerdote Eleazar fizeram conforme Yahweh havia ordenado a Moisés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica do nome divino e sua tradução tradicional.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: fizeram
  rationale: O singular hebraico abre uma construção com sujeito composto, Moisés e Eleazar; em português, o plural é exigido. O verbo resume o cumprimento da ordem anterior.
- source_word: מֹשֶׁה וְאֶלְעָזָר הַכֹּהֵן
  choice: Moisés e o sacerdote Eleazar
  rationale: Mantém os nomes em suas formas portuguesas convencionais e liga o título sacerdotal diretamente a Eleazar, de modo natural e inequívoco.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa que a ação correspondeu à ordem recebida, com linguagem atual e digna.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto explicita naturalmente em português que a ordem antecedeu seu cumprimento, sem acrescentar conteúdo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: A marca de objeto direto não recebe tradução própria; como 'ordenar' em português rege aqui a pessoa destinatária com 'a', a construção natural é 'ordenado a Moisés'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz explicitamente o Tetragrama. A tradução preserva o nome pessoal por transliteração, enquanto a nota informa a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem 'o sacerdote Eleazar' evita a possível leitura de que o título se aplique também a Moisés.
