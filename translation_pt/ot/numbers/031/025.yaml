  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Yahweh disse a Moisés o seguinte:”. O hebraico emprega uma fórmula narrativa padrão para introduzir uma fala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... falou
  rationale: O wayyiqtol faz a narrativa avançar. “Então” expressa naturalmente a sequência em português, e “falou” introduz com clareza o discurso que vem a seguir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: É a preposição natural em português com o verbo “falar” nesta fórmula introdutória.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Como o conteúdo da fala começa no versículo seguinte, os dois-pontos reproduzem de modo natural em português a função introdutória do infinitivo hebraico, evitando a construção pouco idiomática “falou..., dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação introduz a fala do versículo seguinte sem reproduzir mecanicamente o hebraico לֵאמֹר.
