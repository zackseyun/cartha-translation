base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: pt
  text: Então os oficiais responsáveis pelas unidades de mil do exército — os comandantes de mil e os comandantes de cem — aproximaram-se de Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: aproximaram-se
  rationale: O verbo קרב descreve movimento em direção a alguém. “Aproximaram-se de Moisés” é natural em português e preserva o sentido concreto e a sequência narrativa.
- source_word: הַפְּקֻדִים
  choice: os oficiais responsáveis
  rationale: A forma derivada de פקד designa aqui homens nomeados para exercer responsabilidade sobre unidades militares, não soldados comuns. “Oficiais responsáveis” comunica tanto a nomeação quanto a função.
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: responsáveis pelas unidades de mil do exército
  rationale: O contexto e a aposição seguinte indicam uma relação de comando. “Unidades de mil” evita sugerir que se tratava necessariamente de agrupamentos com exatamente mil homens, sem abandonar o valor militar de אֶלֶף.
- source_word: הַצָּבָא
  choice: o exército
  rationale: צבא refere-se aqui à força militar organizada; “exército” é claro, atual e adequado ao contexto.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: os comandantes de mil
  rationale: שׂר indica um chefe ou autoridade. No contexto militar, “comandantes” expressa bem a função, e “de mil” preserva a designação hebraica da unidade.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: e os comandantes de cem
  rationale: A tradução mantém o paralelismo da hierarquia militar e a correspondência com “comandantes de mil”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O travessão apresenta “os comandantes de mil e os comandantes de cem” como explicação aposicional de quem eram os oficiais. Não foram incluídas notas, pois as alternativas lexicais não são necessárias para compreender o versículo.
