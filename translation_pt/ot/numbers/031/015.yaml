base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: pt
  text: 'Moisés lhes disse: “Vocês deixaram vivas todas as pessoas do sexo feminino?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: O wayyiqtol narrativo de אמר pede o passado simples natural em português.
- source_word: אֲלֵיהֶם
  choice: lhes
  rationale: A preposição אֶל com sufixo de terceira pessoa masculina plural indica os destinatários da fala; o pronome dativo é idiomático em português.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma consagrada do nome próprio em português.
- source_word: הַחִיִּיתֶם
  choice: deixaram vivas
  rationale: A forma causativa de חיה significa ‘deixar viver’ ou ‘manter vivo’. ‘Deixaram vivas’ é natural, conserva a agência pressuposta pelo verbo e concorda com o referente feminino.
- source_word: כָּל
  choice: todas as
  rationale: Diante do singular coletivo נְקֵבָה, o português idiomático usa o plural abrangente ‘todas as’.
- source_word: נְקֵבָה
  choice: mulheres
  rationale: Neste contexto humano e militar, ‘mulheres’ é a formulação portuguesa mais natural, sem restringir necessariamente a referência apenas a adultas; uma nota registra a expressão mais literal e biologicamente abrangente.
theological_decisions:
- issue: Tradução de נְקֵבָה no contexto de violência de guerra
  choice: mulheres
  alternative: todas as pessoas do sexo feminino; cada fêmea
  rationale: O hebraico designa o sexo feminino e não limita explicitamente a idade. No texto principal, ‘mulheres’ evita o caráter desumanizador que ‘fêmeas’ costuma ter em português quando aplicado a pessoas; a nota preserva a amplitude e a crueza lexical do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O discurso direto usa ‘vocês’, adequado ao plural explícito; a nota conserva a abrangência etária de נְקֵבָה sem impor uma interpretação restritiva.
