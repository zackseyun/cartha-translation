  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Moisés deu a Eleazar, o sacerdote, o tributo[a], a contribuição destinada a Yahweh[b], conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a parcela cobrada” ou “o imposto”, isto é, a porção calculada e retirada dos despojos.
    reason: lexical_alternative
  - marker: b
    text: Ou “a oferta para Yahweh”; tradicionalmente, “a oferta alçada de Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O verbo נתן, na sequência narrativa, indica uma ação passada simples; “deu” é direto e natural.
- source_word: מֶכֶס
  choice: tributo
  rationale: Neste contexto de despojos de guerra, designa a parcela obrigatória calculada e separada; “tributo” comunica essa obrigação sem sugerir especificamente um imposto civil moderno.
- source_word: תְּרוּמַת יְהוָה
  choice: a contribuição destinada a Yahweh
  rationale: תְּרוּמָה é uma contribuição ou oferta separada para uso sagrado. “Destinada a Yahweh” explicita naturalmente a relação indicada pelo construto sem impor um rito específico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: a Eleazar, o sacerdote
  rationale: Tradução direta e idiomática da expressão preposicional seguida do aposto.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: A fórmula indica conformidade com uma ordem divina anterior; o mais-que-perfeito composto preserva a relação retrospectiva.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva sua função nominal sem substituí-lo por um título.
- issue: Sentido cultual de תְּרוּמַת יְהוָה
  choice: a contribuição destinada a Yahweh
  alternative: a oferta de Yahweh; a oferta alçada de Yahweh
  rationale: A formulação conserva a ideia de uma parcela sagrada separada para Yahweh, sem afirmar que se trate necessariamente do gesto ritual específico sugerido pela expressão tradicional “oferta alçada”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para evitar que “o tributo” pareça estar em aposição a “Eleazar” e para mostrar com clareza que o tributo era a contribuição destinada a Yahweh.
