revisions:
- from: E queimaram pelo fogo todas as cidades deles, nos lugares onde habitavam,[a] e todos os seus acampamentos.[b]
  to: E queimaram com fogo todas as suas cidades onde habitavam,[a] e todos os seus acampamentos.[b]
  rationale: A revisão substitui uma expressão instrumental pouco natural por «com fogo» e torna mais fluida a relação entre as cidades e os lugares de habitação. Mantém a ordem básica, a repetição de «todas/todos», a distinção entre cidades e acampamentos e as alternativas lexicais das notas.
