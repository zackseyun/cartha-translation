base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/010.yaml
  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: pt
  text: E queimaram com fogo todas as suas cidades onde habitavam,[a] e todos os seus acampamentos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as suas cidades em seus assentamentos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os seus arraiais”, “recintos” ou “povoados”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: as cidades deles
  rationale: עִיר pode designar cidade ou povoação. “Cidades” é a equivalência tradicional e mantém a distinção em relação aos acampamentos mencionados depois.
- source_word: בְּמוֹשְׁבֹתָם
  choice: nos lugares onde habitavam
  rationale: מוֹשָׁב indica lugar de habitação ou assentamento. A formulação preserva o valor locativo e soa natural em português, sem identificar necessariamente o termo com as próprias cidades.
- source_word: טִירֹתָם
  choice: os seus acampamentos
  rationale: טִירָה pode indicar acampamento, recinto ou povoado. “Acampamentos” preserva a provável referência a uma forma de habitação distinta das cidades, sem afirmar mais do que o contexto permite.
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: queimaram pelo fogo
  rationale: A construção apresenta o fogo como instrumento. “Queimaram pelo fogo” conserva a ênfase e a cadência do hebraico, embora seja mais formal que a expressão cotidiana.
- source_word: וְאֵת ... וְאֵת
  choice: todas ... e todos
  rationale: 'A coordenação mantém as duas totalidades marcadas no hebraico: todas as cidades e todos os acampamentos.'
