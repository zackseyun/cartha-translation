  source_fidelity: 'É necessária uma correção pontual: וַיִּקַּח significa primariamente “tomaram”; “receberam” é uma inferência contextual possível, mas reduz a correspondência com o verbo hebraico e com a trilha de auditoria em inglês. O restante comunica adequadamente as relações sintáticas e cultuais do hebraico.'
