  terminology: “Tenda do encontro”, “memorial”, “filhos de Israel” e “Yahweh” são escolhas consistentes com o hebraico e com a política terminológica fornecida. “Comandantes de milhares e de centenas” preserva adequadamente a designação das unidades militares.
