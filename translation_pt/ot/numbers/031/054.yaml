base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: pt
  text: Assim, Moisés e Eleazar, o sacerdote, tomaram o ouro dos comandantes de milhares e de centenas e o levaram à tenda do encontro, como memorial para os filhos de Israel diante de Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: receberam
  rationale: Embora לקח signifique literalmente “tomar”, neste contexto Moisés e Eleazar recebem dos comandantes o ouro mencionado; “receberam” expressa com naturalidade a transferência sem alterar o sentido.
- source_word: הַזָּהָב
  choice: o ouro
  rationale: Preserva o artigo definido e remete ao ouro específico descrito nos versículos anteriores.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: dos comandantes de milhares e de centenas
  rationale: מֵאֵת indica a fonte, e שׂרים designa líderes militares neste contexto; “milhares” e “centenas” são unidades da organização militar.
- source_word: אֹהֶל מוֹעֵד
  choice: tenda do encontro
  rationale: Tradução clara e corrente da designação do santuário, preservando a ideia de encontro vinculada a מוֹעֵד.
- source_word: זִכָּרוֹן
  choice: como memorial
  rationale: Mantém o sentido cultual de algo destinado a conservar a lembrança diante de Deus.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pelos filhos de Israel
  rationale: Preserva a forma da expressão hebraica convencional e sua referência pactual, sem substituí-la silenciosamente por uma designação neutra.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Expressa de modo natural a presença cultual indicada por לִפְנֵי e translitera o nome divino יְהוָה.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sentido de לִבְנֵי יִשְׂרָאֵל
  choice: pelos filhos de Israel
  alternative: pelos israelitas; pelo povo de Israel
  rationale: A tradução conserva a expressão hebraica tradicional e sua forma masculina coletiva, sem negar que ela funciona como designação do povo da aliança.
- issue: Relação indicada por לִבְנֵי em זִכָּרוֹן לִבְנֵי יִשְׂרָאֵל
  choice: memorial pelos filhos de Israel
  alternative: memorial para os filhos de Israel
  rationale: “Pelos” comunica que o memorial diz respeito a Israel diante de Yahweh; “para” também é gramaticalmente possível, mas pode sugerir apenas que o objeto seria dirigido ou entregue ao povo.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe narrativa natural. Mantêm-se “filhos de Israel” e “Yahweh” por precisão formal e teológica; não são necessários marcadores de nota no texto porque o rascunho não inclui notas.
