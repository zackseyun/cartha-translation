base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: pt
  text: E purifiquem toda veste, todo objeto de couro, tudo o que for feito de pelos de cabra e todo objeto de madeira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A forma hebraica do verbo também pode ser entendida reflexivamente: “purifiquem-se”. Neste contexto, porém, a ordem parece referir-se à purificação ritual dos objetos enumerados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: veste
  rationale: בֶּגֶד designa normalmente uma peça de roupa ou vestimenta; “veste” mantém o tom digno e conciso da enumeração.
- source_word: כְּלִי עוֹר
  choice: objeto de couro
  rationale: כְּלִי é amplo e pode indicar utensílio, recipiente ou objeto; “objeto” evita restringir a expressão a vasos, enquanto “couro” comunica naturalmente o material.
- source_word: מַעֲשֵׂה עִזִּים
  choice: tudo o que for feito de pelos de cabra
  rationale: מַעֲשֵׂה indica obra ou coisa feita, e עִזִּים, nesta lista de materiais, provavelmente se refere a artigos de pelos de cabra. A formulação portuguesa é clara sem transformar a probabilidade contextual em precisão técnica excessiva.
- source_word: כְּלִי עֵץ
  choice: objeto de madeira
  rationale: Como em כְּלִי עוֹר, “objeto” preserva a amplitude de כְּלִי e mantém o paralelismo da lista.
- source_word: תִּתְחַטָּאוּ
  choice: purifiquem
  rationale: O hitpael de חטא tem aqui sentido ritual de purificação. Embora a forma seja morfologicamente reflexiva, o contexto e a sequência acusativa favorecem a aplicação da purificação aos objetos enumerados; a nota preserva a alternativa formal.
theological_decisions:
- issue: Referente e valor reflexivo de תִּתְחַטָּאוּ no contexto de pureza ritual após a guerra
  choice: 'Entender a ordem como dirigida à purificação ritual dos objetos enumerados: “purifiquem”.'
  alternative: “purifiquem-se” ou “façam purificação para vocês”, tomando a forma verbal em sentido reflexivo mais explícito.
  rationale: A forma verbal é segunda pessoa masculina plural no hitpael, mas os quatro grupos nominais introduzidos por כָּל funcionam naturalmente como objetos tematizados da ordem. O contexto imediato (Nm 31:23) exige a purificação de tudo o que foi tomado. A tradução não acrescenta “do pecado”, pois isso poderia moralizar uma prescrição de pureza ritual.
translation_notes:
  register: Português moderno, claro e digno, com estrutura enumerativa próxima do hebraico. “Pelos de cabra” é preferível a “cabelo de cabra” e explicita o material provavelmente pretendido. O marcador [a] aparece no texto e registra a ambiguidade gramatical sem importar categorias doutrinárias posteriores.
