lexical_decisions:
- source_word: וּ/בָקָר
  choice: e ... cabeças de gado
  rationale: בָּקָר designa coletivamente o gado bovino. Em uma enumeração de animais, «cabeças de gado» é uma formulação portuguesa natural e explicita corretamente a contagem de indivíduos; a conjunção וּ é preservada por «e».
- source_word: שִׁשָּׁה וּ/שְׁלֹשִׁים אָלֶף
  choice: trinta e seis mil
  rationale: A ordem hebraica é literalmente «seis e trinta mil», mas a ordem convencional em português é «trinta e seis mil», sem alteração da quantidade.
