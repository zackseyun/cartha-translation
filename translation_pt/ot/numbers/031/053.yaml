lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: os homens do exército
  rationale: Preserva a relação de construto e a referência específica aos integrantes masculinos da força militar, em linguagem portuguesa natural.
- source_word: בָּזְזוּ
  choice: tinham saqueado
  rationale: O verbo בזז significa saquear ou tomar despojos. O mais-que-perfeito composto situa naturalmente a ação antes da prestação de contas narrada no contexto.
- source_word: אִישׁ לּוֹ
  choice: cada um para si
  rationale: Reproduz a força distributiva da expressão hebraica e indica que cada soldado tomou despojos em benefício próprio, sem inserir um objeto explícito no texto principal.
