  yaml_path: translation/ot/numbers/031/038.yaml
  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: pt
  text: O gado somava trinta e seis mil cabeças, e o tributo destinado a Yahweh era de setenta e duas cabeças.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: o gado
  rationale: בָּקָר designa coletivamente animais bovinos; «gado» é a forma natural e precisa neste inventário.
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: trinta e seis mil cabeças
  rationale: A ordem numérica foi ajustada ao português moderno; «cabeças» explicita de modo idiomático a contagem de animais sem alterar o total.
- source_word: מִכְסָם
  choice: a parte deles destinada
  rationale: מֶכֶס refere-se aqui à porção obrigatoriamente separada do despojo; esta formulação evita as possíveis conotações modernas de «imposto» e mantém clara a referência ao gado contado.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica destinação ou pertencimento, e o nome divino יהוה é transliterado como «Yahweh», preservando sua forma pessoal no texto-fonte.
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: setenta e duas
  rationale: A ordem do número foi ajustada ao uso português, com concordância feminina por referência a «cabeças»/à porção de cabeças de gado.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O hebraico traz diretamente o nome próprio יהוה. «Yahweh» conserva essa distinção, enquanto «o SENHOR» representa a tradição de leitura substitutiva; nenhuma interpretação doutrinária adicional é introduzida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção preserva o caráter contábil do contexto e usa «foi de» para apresentar o total da porção separada.
