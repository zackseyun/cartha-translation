    rationale: O possessivo pode parecer referir-se aos próprios animais, e a expressão não identifica claramente a «parte» como o tributo ou a porção compulsoriamente separada indicada por מִכְסָם.
  - severity: low
    issue: A unidade «cabeças» não é retomada no total do tributo
    rationale: Embora possa ser inferida, explicitá-la em «setenta e duas cabeças» torna a contagem plenamente clara e sustenta a concordância feminina.
