  source_fidelity: O sentido e os números estão corretos, e «Yahweh» representa diretamente יהוה. Contudo, «a parte deles destinada» torna pouco clara a noção específica de מִכְסָם, isto é, o tributo/porção obrigatória separada do gado para Yahweh.
  naturalness: «O gado era de» é compreensível, mas «somava» é mais natural neste inventário. A formulação atual também deixa «deles» com referente pouco natural e omite, de modo algo abrupto, a unidade animal no segundo número.
  terminology: «Gado» corresponde bem a הַבָּקָר. «Tributo destinado a Yahweh» comunica com clareza o caráter de porção exigida/separada expresso por מֶכֶס, sem introduzir linguagem fiscal moderna excessivamente específica. «Yahweh» preserva o nome divino do hebraico.
