  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: pt
  text: E a metade[a], a parte dos que saíram para a guerra, foi de 337.500 ovelhas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a porção dos que saíram para a guerra”.'
    reason: alternativa lexical para “a parte”, preservando a referência explícita à metade no texto principal
lexical_decisions:
- source_word: וַתְּהִי
  choice: foi de
  rationale: No contexto de uma totalização, expressa naturalmente em português o resultado numérico, sem acrescentar interpretação.
- source_word: הַמֶּחֱצָה
  choice: a metade
  rationale: Mantém a referência formal à metade dos despojos divididos no contexto anterior.
- source_word: חֵלֶק
  choice: a parte
  rationale: Funciona como aposição a “a metade” e especifica a quem ela cabia.
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: os que saíram para a guerra
  rationale: Traduz de modo natural a expressão militar, preservando a ação de sair para a campanha em vez de substituí-la simplesmente por “guerreiros”.
- source_word: מִסְפַּר הַצֹּאן
  choice: 337.500 ovelhas
  rationale: A construção portuguesa com “foi de” permite apresentar diretamente o total; “ovelhas” é claro no contexto da contagem do rebanho.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '337.500'
  rationale: 'O número hebraico é aditivo e inequívoco: 300.000 + 30.000 + 7.000 + 500. Algarismos favorecem a leitura moderna e preservam a quantidade exata.'
