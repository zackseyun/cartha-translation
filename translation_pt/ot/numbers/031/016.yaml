  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: pt
  text: 'Vejam: foram essas mulheres que, seguindo a palavra de Balaão[a], levaram os filhos de Israel[b] a serem infiéis a Yahweh no caso de Peor; por isso, a praga atingiu a comunidade de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seguindo o conselho de Balaão” ou “por orientação de Balaão”. O hebraico diz literalmente “pela palavra de Balaão”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “filhos de Israel” refere-se aqui ao povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: 'Vejam: foram essas mulheres'
  rationale: A construção enfática e dêitica introduz as mulheres como o grupo específico em questão. “Vejam” é atual e natural, e o feminino plural é explicitado pelo contexto.
- source_word: בִּדְבַר בִּלְעָם
  choice: seguindo a palavra de Balaão
  rationale: Preserva o sentido lexical de דָּבָר, “palavra”, enquanto comunica que elas agiram sob a orientação ou instigação de Balaão.
- source_word: לִמְסָר מַעַל
  choice: levaram ... a serem infiéis
  rationale: Expressa a agência causativa do infinitivo e traduz מַעַל como quebra de fidelidade, sem recorrer ao arcaísmo “prevaricar”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma concreta e tradicional da expressão hebraica, que aqui designa o povo de Israel.
- source_word: בַּיהוָה
  choice: a Yahweh
  rationale: Com מַעַל, indica aquele a quem a infidelidade foi cometida. A regência portuguesa natural é “ser infiel a”.
- source_word: עַל דְּבַר פְּעוֹר
  choice: no caso de Peor
  rationale: A expressão aponta para o episódio ou assunto de Peor. “No caso de Peor” é claro sem acrescentar detalhes não expressos no versículo.
- source_word: וַתְּהִי הַמַּגֵּפָה
  choice: por isso, a praga atingiu
  rationale: Torna perceptível a relação de consequência sugerida pela sequência narrativa, em português corrente.
- source_word: בַּעֲדַת יְהוָה
  choice: a comunidade de Yahweh
  rationale: עֵדָה designa a coletividade reunida de Israel. “Comunidade” é amplo, natural e evita conotações eclesiásticas excessivamente específicas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto hebraico, em vez de substituí-lo por um título.
- issue: Explicitação do referente feminino de הֵנָּה
  choice: essas mulheres
  alternative: essas; elas
  rationale: O pronome hebraico é feminino plural e o contexto identifica mulheres midianitas; a explicitação facilita a leitura sem alterar o referente.
- issue: Grau de causalidade atribuído às mulheres
  choice: levaram ... a serem infiéis
  alternative: fizeram ... cometer infidelidade; foram ocasião de infidelidade
  rationale: A formulação conserva a agência causativa do hebraico sem definir além do texto o mecanismo exato dessa influência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação ressalta a ênfase inicial e a consequência final; evitam-se arcaísmos e terminologia denominacional.
