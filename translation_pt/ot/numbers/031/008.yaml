  text: וְ/אֶת מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל חַלְלֵי/הֶ֗ם אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְ/אֵת֙ בִּלְעָ֣ם בֶּן בְּע֔וֹר הָרְג֖וּ בֶּ/חָֽרֶב־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: pt
  text: 'Mataram os reis de Midiã junto com os demais mortos deles[a]: Evi, Requém, Zur, Hur e Reba, os cinco reis de Midiã. Também mataram à espada Balaão, filho de Beor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «entre os mortos deles». A expressão hebraica é compacta e pode indicar que os reis foram mortos entre os demais mortos de Midiã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ
  choice: mataram
  rationale: O qal perfeito na terceira pessoa do plural denota diretamente o ato de matar; esta é a formulação mais clara e natural em português atual.
- source_word: עַל חַלְלֵיהֶם
  choice: junto com os outros mortos deles
  rationale: A expressão hebraica compacta, literalmente relacionada a estar 'sobre/entre os mortos deles', associa a morte dos reis à dos demais mortos midianitas. A tradução principal comunica essa associação sem impor um sentido estritamente espacial; a alternativa 'entre os mortos deles' é preservada em nota.
- source_word: מַלְכֵי מִדְיָן
  choice: os reis de Midiã
  rationale: A cadeia construta significa diretamente 'os reis de Midiã'; a mesma forma é mantida na aposição posterior.
- source_word: אֱוִי
  choice: Evi
  rationale: Transliteração corrente do nome próprio hebraico.
- source_word: רֶקֶם
  choice: Requém
  rationale: Forma aportuguesada que representa o nome hebraico e favorece a pronúncia adequada em português.
- source_word: צוּר
  choice: Zur
  rationale: Transliteração corrente do nome próprio hebraico.
- source_word: חוּר
  choice: Hur
  rationale: Transliteração corrente do nome próprio hebraico.
- source_word: רֶבַע
  choice: Reba
  rationale: Forma tradicional e inteligível em português para o nome próprio.
- source_word: חֲמֵשֶׁת מַלְכֵי מִדְיָן
  choice: os cinco reis de Midiã
  rationale: A expressão funciona como aposição que resume e identifica os cinco homens nomeados.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaão, filho de Beor
  rationale: Emprega as formas portuguesas tradicionais dos nomes e traduz diretamente o patronímico.
- source_word: בֶּחָרֶב
  choice: à espada
  rationale: O bet instrumental indica o meio empregado; 'matar à espada' é uma expressão portuguesa natural e conserva a imagem concreta do hebraico.
