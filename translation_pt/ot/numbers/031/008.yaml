  verdict: revise
  source_fidelity: A tradução reproduz adequadamente os reis nomeados, a aposição «os cinco reis de Midiã», Balaão como filho de Beor e o instrumento «à espada». Contudo, o «Também» inicial introduz uma adição que não é expressa pelo hebraico neste versículo; o waw inicial apenas dá continuidade narrativa. A ambiguidade concisa de עַל־חַלְלֵיהֶם é adequadamente sinalizada pela nota.
