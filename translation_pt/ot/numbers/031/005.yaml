  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: pt
  text: 'Assim, dos milhares de Israel[b], foram designados[a] mil de cada tribo: doze mil homens armados para a guerra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram entregues”, “foram fornecidos” ou “foram convocados”; o verbo hebraico pode indicar que foram disponibilizados ou designados para o serviço.
    reason: lexical_alternative
  - marker: b
    text: “Milhares de Israel” pode referir-se não apenas à quantidade, mas também aos agrupamentos maiores de clãs ou às divisões militares de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: foram designados
  rationale: O nifal indica que os homens foram entregues, fornecidos ou destacados para a campanha. “Foram designados” conserva o sentido passivo e soa natural no contexto militar.
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: dos milhares de Israel
  rationale: אַלְפֵי pode indicar literalmente “milhares” e também agrupamentos maiores de clãs ou unidades militares. A tradução literal preserva essa ambiguidade contextual.
- source_word: אֶלֶף לַמַּטֶּה
  choice: mil de cada tribo
  rationale: A preposição לְ tem valor distributivo no contexto; cada tribo forneceu mil homens.
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: doze mil
  rationale: Reproduz diretamente o número cardinal que resume o total da força reunida.
- source_word: חֲלוּצֵי צָבָא
  choice: homens armados para a guerra
  rationale: A expressão descreve pessoas equipadas e preparadas para ação militar. A inclusão de “homens” torna explícito em português o referente pessoal do construto plural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase mantém a progressão do hebraico, enquanto “mil de cada tribo” expressa naturalmente a distribuição. Os marcadores aparecem junto às expressões a que se referem.
