base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: pt
  text: Moisés ficou irado com os oficiais do exército, os comandantes de milhares e os comandantes de centenas, que vinham do serviço de guerra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da campanha militar”. A expressão hebraica combina as ideias de exército ou serviço militar e guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: ficou indignado
  rationale: O verbo קצף expressa ira. “Ficou indignado” comunica de modo natural o início ou a manifestação dessa ira, sem intensificá-la indevidamente como “ficou furioso”.
- source_word: פְּקוּדֵי הֶחָיִל
  choice: os oficiais do exército
  rationale: פְּקוּדֵי designa aqui homens investidos de responsabilidade, e הֶחָיִל se refere à força militar. “Oficiais do exército” expressa claramente essa função de autoridade.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: os comandantes de milhares
  rationale: Mantém tanto o sentido militar de שָׂרֵי quanto a organização numérica expressa no hebraico.
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: e os comandantes de centenas
  rationale: Preserva o paralelismo com “comandantes de milhares” e a estrutura militar do texto.
- source_word: הַבָּאִים
  choice: que vinham
  rationale: O particípio descreve os oficiais em movimento, vindo de determinado lugar ou serviço. “Que vinham” preserva esse aspecto sem acrescentar explicitamente a ideia interpretativa de retorno.
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: do serviço de guerra
  rationale: צָבָא pode indicar exército, campanha ou serviço militar. “Serviço de guerra” conserva a combinação incomum dos termos hebraicos e evita reduzir a expressão apenas ao local de uma batalha.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura militar clara. Os travessões identificam os “oficiais do exército” como os comandantes de milhares e de centenas. A formulação preserva a ambiguidade lexical da expressão final por meio de nota.
