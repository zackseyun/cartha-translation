  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: pt
  text: Moisés os enviou para a guerra, mil de cada tribo. Com eles enviou Fineias, filho do sacerdote Eleazar, levando consigo os utensílios sagrados[a] e as trombetas para dar o sinal de combate[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os utensílios do santuário” ou “os objetos sagrados”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as trombetas de sinalização” ou “as trombetas de alarme”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: É o equivalente narrativo comum de שלח e mantém de modo natural a ação de Moisés.
- source_word: אֶלֶף לַמַּטֶּה
  choice: mil de cada tribo
  rationale: 'Expressa com clareza o valor distributivo da construção: cada tribo forneceu mil homens.'
- source_word: לַצָּבָא
  choice: para a guerra
  rationale: Neste contexto, צבא indica campanha ou serviço militar, e não simplesmente o exército como instituição.
- source_word: אֹתָם ... אֹתָם
  choice: os ... Com eles
  rationale: A retomada pronominal preserva a ênfase e a estrutura apositiva do hebraico sem produzir uma repetição pouco natural em português.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Fineias, filho do sacerdote Eleazar
  rationale: A construção hebraica identifica Eleazar como sacerdote; esta ordem evita a possível leitura de que o título se aplique diretamente a Fineias, embora ele também seja sacerdote no contexto mais amplo.
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: os utensílios sagrados
  rationale: כְּלֵי pode designar utensílios, objetos ou instrumentos, enquanto הַקֹּדֶשׁ lhes confere caráter sagrado ou os relaciona ao santuário. A nota preserva essa amplitude.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: as trombetas para dar o sinal de combate
  rationale: תְּרוּעָה designa um toque forte de sinal, alarme ou convocação; o contexto militar favorece a função de sinal de combate sem transformá-lo literalmente em um grito.
- source_word: בְּיָדוֹ
  choice: levando consigo
  rationale: O singular aponta mais naturalmente para Fineias. A expressão portuguesa comunica que os objetos estavam em sua posse ou sob seu encargo, evitando a imagem excessivamente literal de todos estarem fisicamente em uma só mão.
theological_decisions:
- issue: Função de Fineias e dos objetos sagrados na expedição militar
  choice: Fineias acompanha a força levando os objetos sagrados e as trombetas de sinalização.
  alternative: Fineias seria apenas observador, ou os objetos não teriam relação com sua função sacerdotal.
  rationale: O versículo associa explicitamente Fineias, os objetos sagrados e as trombetas à campanha. A tradução conserva essa ligação cultual e militar sem acrescentar uma doutrina de guerra santa.
- issue: Referente de בְּיָדוֹ, “em sua mão”
  choice: O singular se refere a Fineias, o antecedente singular mais próximo.
  alternative: A expressão poderia ser entendida coletivamente como estando em poder da tropa.
  rationale: A concordância singular e a proximidade sintática favorecem Fineias, mas “levando consigo” não especifica além do que o texto permite sobre o modo exato de transporte.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A frase longa do hebraico foi dividida em duas para evitar ambiguidade e tornar natural a retomada de אֹתָם. Os marcadores de nota foram colocados exatamente junto às expressões às quais suas alternativas lexicais se referem.
