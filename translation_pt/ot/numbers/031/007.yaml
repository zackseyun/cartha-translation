  text: וַֽ/יִּצְבְּאוּ֙ עַל מִדְיָ֔ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: pt
  text: Assim, guerrearam contra Midiã[a], exatamente como Yahweh havia ordenado a Moisés, e mataram todos os do sexo masculino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “combateram contra Midiã”. O verbo hebraico pode indicar tomar parte no serviço militar ou na guerra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: guerrearam
  rationale: O verbo צבא, nesta forma e neste contexto, expressa participação em ação militar. “Guerrearam” é natural, direto e mantém a força marcial sem restringir o sentido a um único confronto.
- source_word: עַל
  choice: contra
  rationale: Com um verbo de ação militar, עַל indica direção hostil; “contra” comunica naturalmente essa relação.
- source_word: מִדְיָן
  choice: Midiã
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Exprime a correspondência entre a ação militar e a ordem divina, dando o devido relevo à conformidade indicada no hebraico.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa natural em português que a ordem precedeu a ação narrada, sem alterar o sentido.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Embora אֶת marque o objeto direto em hebraico, o verbo português “ordenar” admite naturalmente a construção “ordenar a alguém”; esta formulação preserva Moisés como destinatário da ordem.
- source_word: וַיַּהַרְגוּ
  choice: mataram
  rationale: הרג significa diretamente “matar”; a escolha é clara, atual e não suaviza a ação.
- source_word: כָּל זָכָר
  choice: todos os do sexo masculino
  rationale: זָכָר designa o sexo masculino sem se limitar a homens adultos. A formulação preserva essa abrangência melhor que “todos os homens” e soa mais natural em português do que “todo macho” para seres humanos.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” preserva o nome em transliteração, sem substituí-lo por um título.
- issue: Abrangência de זָכָר
  choice: todos os do sexo masculino
  alternative: todos os homens
  rationale: O substantivo hebraico indica indivíduos do sexo masculino e não especifica idade adulta; “homens” estreitaria indevidamente o alcance do texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. “Guerrearam” conserva o teor militar de modo conciso; “todos os do sexo masculino” mantém a precisão de gênero e idade do hebraico.
