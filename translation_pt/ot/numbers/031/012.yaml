base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: pt
  text: Eles levaram os cativos, os bens capturados e os despojos a Moisés, ao sacerdote Eleazar e à comunidade dos filhos de Israel[a], para o acampamento nas planícies de Moabe[b], que ficam junto ao Jordão, na altura de Jericó[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à comunidade dos israelitas”. O hebraico diz literalmente “à comunidade dos filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas estepes de Moabe”.
    reason: lexical_alternative
  - marker: c
    text: Ou “junto ao Jordão, em frente de Jericó”.
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Eles levaram
  rationale: O hifil de בוא tem aqui sentido causativo, “levar/trazer”, confirmado pelos objetos diretos que se seguem. “Levaram” ajusta-se naturalmente ao ponto de vista narrativo em português.
- source_word: הַשְּׁבִי
  choice: os cativos
  rationale: No contexto militar, o termo designa as pessoas capturadas, não o estado abstrato de cativeiro.
- source_word: הַמַּלְקוֹחַ
  choice: os bens capturados
  rationale: O termo abrange aquilo que foi tomado, especialmente bens móveis ou animais. Esta formulação corrente o distingue de שׁלל sem recorrer ao pouco natural “presa”.
- source_word: הַשָּׁלָל
  choice: os despojos
  rationale: É um termo comum para os despojos tomados na guerra; a escolha preserva a distinção lexical em relação a מלקוח.
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: a comunidade dos filhos de Israel
  rationale: עֵדָה indica a comunidade reunida, e “filhos de Israel” conserva de modo transparente a expressão familiar hebraica.
- source_word: אֶל הַמַּחֲנֶה
  choice: para o acampamento
  rationale: אֶל indica movimento em direção ao acampamento, sem exigir que se explicite a entrada nele.
- source_word: עַרְבֹת מוֹאָב
  choice: as planícies de Moabe
  rationale: É a forma geográfica tradicional e clara; “estepes” permanece uma alternativa possível.
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: que ficam junto ao Jordão, na altura de Jericó
  rationale: A frase situa as planícies junto ao Jordão em relação a Jericó. A redação é natural em português e não força no texto principal a interpretação mais específica “em frente de Jericó”.
