  text: וַ/תְּהִ֛י מֶחֱצַ֥ת הָ/עֵדָ֖ה מִן הַ/צֹּ֑אן שְׁלֹשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹשִׁ֣ים אֶ֔לֶף שִׁבְעַ֥ת אֲלָפִ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/043.yaml
  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: pt
  text: A metade que coube à comunidade, do rebanho, foi de 337.500.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: foi de
  rationale: Nesse inventário numérico, a forma de היה introduz o total resultante; “foi de” é natural em português e não acrescenta a nuance mais interpretativa de “totalizou”.
- source_word: מֶחֱצַת הָעֵדָה
  choice: a metade que coube à comunidade
  rationale: O construto significa a metade da comunidade no sentido da parte que lhe foi destinada. “Que coube à” expressa com clareza essa relação distributiva estabelecida pelo contexto.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: עֵדָה designa a comunidade reunida de Israel. “Comunidade” é corrente, digna e evita sugerir uma instituição eclesiástica posterior.
- source_word: מִן הַצֹּאן
  choice: do rebanho
  rationale: A expressão identifica a categoria de animais contada. צֹאן é um coletivo de gado miúdo, sobretudo ovelhas e cabras; “rebanho” preserva a concisão e a extensão coletiva do hebraico.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: '337.500'
  rationale: A sequência hebraica soma 300.000 + 30.000 + 7.000 + 500. Algarismos favorecem a leitura do inventário e preservam a quantidade exata.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com pontuação numérica brasileira. “Animais” foi explicitado após o total para tornar natural a contagem do coletivo “rebanho”, sem restringi-lo apenas a ovelhas ou apenas a cabras.
