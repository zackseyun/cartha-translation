  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: pt
  text: 'E, da metade pertencente aos filhos de Israel, tome um de cada cinquenta[a]: das pessoas, do gado, dos jumentos e do rebanho, de todos os animais domésticos[b]; e entregue-os aos levitas que estão encarregados de guardar o tabernáculo de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um tomado de cada cinquenta”.
    reason: lexical_alternative
  - marker: b
    text: “Rebanho” traduz um termo coletivo que pode incluir ovelhas e cabras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: E, da metade pertencente aos filhos de Israel
  rationale: Preserva a ideia da metade atribuída a esse grupo e mantém a expressão hebraica בְּנֵי יִשְׂרָאֵל de maneira transparente e digna.
- source_word: תִּקַּח
  choice: tome
  rationale: O imperfeito funciona aqui como instrução dirigida a Moisés; o imperativo português é natural e mantém a força prescritiva.
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: um de cada cinquenta
  rationale: Comunica com clareza a proporção de 1:50. A nota registra a nuance passiva de אָחֻז, literalmente relacionada ao que é tomado.
- source_word: מִן הָאָדָם
  choice: dentre as pessoas
  rationale: אָדָם é singular coletivo neste inventário de despojos humanos e animais. 'As pessoas' expressa naturalmente em português o referente humano sem sugerir apenas um homem.
- source_word: מִן הַבָּקָר
  choice: o gado
  rationale: Equivalente corrente de בָּקָר para bovinos ou animais de manada.
- source_word: מִן הַחֲמֹרִים
  choice: os jumentos
  rationale: Termo moderno, claro e amplamente compreensível para os animais mencionados.
- source_word: וּמִן הַצֹּאן
  choice: e os rebanhos
  rationale: צֹאן é coletivo e abrange sobretudo ovelhas e cabras; 'rebanhos' preserva essa abrangência sem especificação indevida.
- source_word: מִכָּל הַבְּהֵמָה
  choice: dentre todos os animais domésticos
  rationale: בְּהֵמָה funciona como categoria geral dos animais mantidos como propriedade; a formulação portuguesa evita o sentido excessivamente amplo de 'todos os animais'.
- source_word: וְנָתַתָּה אֹתָם לַלְוִיִּם
  choice: e entregue-os aos levitas
  rationale: Expressa diretamente a segunda instrução e mantém o objeto plural referente aos seres retirados de cada categoria.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן
  choice: que estão encarregados de guardar o tabernáculo
  rationale: A construção cognata enfatiza a responsabilidade de custódia e vigilância; esta redação é natural e conserva esse sentido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' representa o nome próprio da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe prescritiva natural. Mantém 'filhos de Israel' por transparência formal, mas verte o singular coletivo אָדָם como 'pessoas'. Os travessões deixam claro que 'todos os animais domésticos' resume as categorias animais anteriores.
