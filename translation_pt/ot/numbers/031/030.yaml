  terminology: “Filhos de Israel”, “jumentos”, “levitas”, “tabernáculo” e “Yahweh” são adequados. “Rebanho” preserva melhor o coletivo hebraico; a nota registra sua abrangência sem estreitar indevidamente o termo.
