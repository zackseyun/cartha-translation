  text: אַ֥ךְ אֶת הַ/זָּהָ֖ב וְ/אֶת הַ/כָּ֑סֶף אֶֽת הַ/נְּחֹ֨שֶׁת֙ אֶת הַ/בַּרְזֶ֔ל אֶֽת הַ/בְּדִ֖יל וְ/אֶת הָ/עֹפָֽרֶת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/022.yaml
  text: Only the gold[a], the silver, the bronze, the iron, the tin, and the lead—
translation:
  language: pt
  text: Somente o ouro[a], a prata, o bronze, o ferro, o estanho e o chumbo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”. O termo hebraico pode referir-se de modo amplo a metais à base de cobre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Somente
  rationale: No contexto, introduz uma limitação ou exceção às instruções anteriores; “Somente” sinaliza naturalmente a categoria restrita que será enumerada.
- source_word: הַזָּהָב
  choice: o ouro
  rationale: Tradução corrente de זָהָב como o metal ouro.
- source_word: הַכָּסֶף
  choice: a prata
  rationale: Aqui כֶּסֶף designa o metal prata, e não dinheiro, pois integra uma lista de metais sujeitos à purificação.
- source_word: הַנְּחֹשֶׁת
  choice: o bronze
  rationale: נְחֹשֶׁת pode designar cobre ou bronze; “bronze” é a forma tradicional e natural nesta lista, preservando-se “cobre” em nota como alternativa legítima.
- source_word: הַבַּרְזֶל
  choice: o ferro
  rationale: Equivalente português corrente de בַּרְזֶל.
- source_word: הַבְּדִיל
  choice: o estanho
  rationale: בְּדִיל designa mais provavelmente estanho nesta enumeração de metais.
- source_word: הָעֹפָרֶת
  choice: o chumbo
  rationale: Equivalente português corrente de עֹפָרֶת.
- source_word: אֵת (repetido antes de cada substantivo)
  choice: não traduzido separadamente
  rationale: O marcador de objeto direto organiza e enfatiza a lista em hebraico, mas não possui equivalente lexical direto em português; sua função é representada pela enumeração e pela pontuação.
