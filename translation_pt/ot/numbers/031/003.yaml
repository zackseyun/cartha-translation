revisions:
- from: 'Então Moisés falou ao povo: “Preparem homens dentre vocês para a guerra, e que eles avancem contra Midiã, a fim de executar em Midiã a vingança de Yahweh[a].”'
  to: 'Então Moisés falou ao povo: “Mobilizem, dentre vocês, homens para a guerra, e que eles vão contra Midiã para executar contra Midiã a vingança de Yahweh[a].”'
  rationale: A revisão substitui uma formulação militar pouco idiomática por «Mobilizem, dentre vocês, homens para a guerra» e esclarece que Midiã é o alvo da vingança. Mantêm-se a repetição de «Midiã», o nome divino Yahweh e a ambiguidade da expressão «a vingança de Yahweh», explicitada na nota.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:02:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva corretamente os elementos centrais: Moisés fala ao povo, homens são mobilizados dentre eles para a ação militar contra Midiã, e a vingança é atribuída a Yahweh. Contudo, «Preparem homens» é pouco idiomático e pode sugerir apenas treinamento; «em Midiã» não exprime com clareza que Midiã é o alvo da vingança.'
  naturalness: «Preparem homens dentre vocês» soa incomum no português moderno. «Mobilizem, dentre vocês, homens para a guerra» é mais natural e conserva tanto a seleção quanto o contexto militar. «Executar contra Midiã a vingança» também é mais claro do que «executar em Midiã a vingança».
  terminology: «Yahweh», «vingança», «Midiã» e «homens» são adequados. A nota mantém de modo apropriado a ambiguidade da construção נִקְמַת יְהוָה, sem impor uma interpretação teológica.
  issues:
  - severity: medium
    issue: Formulação de הֵחָלְצוּ
    rationale: «Preparem homens» é uma construção pouco natural e não comunica com precisão a mobilização/seleção militar de homens dentre o povo. «Mobilizem, dentre vocês, homens para a guerra» oferece um equivalente idiomático e contextualmente fiel.
  - severity: medium
    issue: Relação de Midiã com a vingança
    rationale: Em «executar em Midiã a vingança», «em» pode ser entendido apenas como local da execução. O בְּ em combinação com «vingança» identifica Midiã como alvo; «contra Midiã» torna isso claro.
  revised_text: 'Então Moisés falou ao povo: “Mobilizem, dentre vocês, homens para a guerra, e que eles vão contra Midiã para executar contra Midiã a vingança de Yahweh[a].”'
  revised_footnotes:
  - marker: a
    text: Ou “a vingança em favor de Yahweh”. O hebraico pode indicar a vingança que pertence a Yahweh ou que é executada em seu favor.
    reason: alternative_reading
