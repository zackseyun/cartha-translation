  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: pt
  text: 'Então Moisés falou ao povo: “Mobilizem, dentre vocês, homens para a guerra, e que eles vão contra Midiã para executar contra Midiã a vingança de Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vingança em favor de Yahweh”. O hebraico pode indicar a vingança que pertence a Yahweh ou que é executada em seu favor.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: Forma narrativa comum que introduz discurso direto; “falou” preserva o enquadramento formal e soa natural em português.
- source_word: הָעָם
  choice: o povo
  rationale: Refere-se à comunidade israelita à qual Moisés se dirige; “o povo” é o equivalente corrente e direto.
- source_word: הֵחָלְצוּ
  choice: Preparem
  rationale: No contexto militar, o verbo indica equipar ou deixar prontos para combate. “Preparem” combina naturalmente com o objeto “homens” e evita a possível leitura reflexiva de “armem-se”.
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: homens dentre vocês
  rationale: Expressa a seleção de combatentes do próprio povo e mantém a referência masculina explícita do hebraico.
- source_word: לַצָּבָא
  choice: para a guerra
  rationale: צָבָא pode indicar exército, serviço militar ou guerra. Neste contexto de mobilização para uma campanha, “para a guerra” é claro e idiomático.
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: e que eles avancem contra Midiã
  rationale: A construção indica uma postura ou ação militar hostil contra Midiã. “Avancem contra” comunica essa força em português natural, sem especificar além do contexto uma forma particular de ataque.
- source_word: לָתֵת
  choice: executar
  rationale: Embora o sentido básico seja “dar”, em combinação com “vingança” o verbo significa levá-la a efeito; “executar” preserva essa expressão idiomática.
- source_word: נִקְמַת
  choice: a vingança
  rationale: Equivalente direto que preserva a severidade do termo hebraico, sem suavizá-lo como mera punição ou justiça.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּמִדְיָן
  choice: em Midiã
  rationale: Mantém o valor locativo/instrumental amplo da preposição hebraica e preserva a repetição de “Midiã” existente no texto-fonte.
theological_decisions:
- issue: A relação entre Yahweh e a vingança na expressão נִקְמַת יְהוָה
  choice: a vingança de Yahweh
  alternative: a vingança em favor de Yahweh
  rationale: A construção hebraica pode indicar vingança pertencente a Yahweh, determinada ou realizada por ele, ou vingança executada em seu favor. “De Yahweh” conserva a concisão e parte da ambiguidade, explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter militar e a tensão teológica do texto sem acrescentar justificativas. A repetição de “Midiã” foi preservada por corresponder à estrutura enfática do hebraico.
