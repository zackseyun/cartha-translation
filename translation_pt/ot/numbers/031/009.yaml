  source_fidelity: 'A tradução preserva a sequência e o alcance do hebraico: a captura das mulheres de Midiã e de suas crianças, seguida do saque de animais, rebanhos e bens. «Levaram cativas» comunica adequadamente וַיִּשְׁבּוּ com objetos humanos; «saquearam» reproduz bem בָּזָזוּ. A enumeração repetitiva dos três grupos de bens materiais é mantida sem harmonizá-los indevidamente.'
