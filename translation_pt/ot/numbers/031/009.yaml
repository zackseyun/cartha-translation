  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: pt
  text: Os filhos de Israel levaram cativas as mulheres de Midiã e suas crianças[a], e saquearam todos os seus animais, todos os seus rebanhos e todos os seus bens[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus pequenos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a sua riqueza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: levaram cativas
  rationale: O Qal de שׁבה indica tomar pessoas como cativas; a formulação é natural em português e mantém o sentido humano do objeto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Preserva o idiomatismo hebraico e sua forma masculina explícita, permanecendo claro em português.
- source_word: נְשֵׁי מִדְיָן
  choice: as mulheres de Midiã
  rationale: נָשִׁים designa aqui mulheres em geral, não necessariamente esposas; o constructo é preservado com naturalidade.
- source_word: טַפָּם
  choice: suas crianças
  rationale: טַף refere-se tipicamente às crianças ou aos pequenos; 'crianças' comunica com clareza a idade juvenil sem recorrer a expressão menos natural.
- source_word: בְּהֶמְתָּם
  choice: todos os seus animais
  rationale: O substantivo coletivo בְּהֵמָה denota animais domésticos; 'animais' evita uma repetição pouco clara com o termo seguinte.
- source_word: מִקְנֵהֶם
  choice: todos os seus rebanhos
  rationale: מִקְנֶה pode indicar o conjunto de gado adquirido ou possuído, aqui bem representado por 'rebanhos'.
- source_word: חֵילָם
  choice: todos os seus bens
  rationale: Neste contexto não militar, חַיִל designa recursos, propriedade ou riqueza material; 'bens' é amplo e natural.
- source_word: בָּזָזוּ
  choice: saquearam
  rationale: בזז descreve a tomada de despojos após uma vitória; 'saquearam' conserva claramente o contexto bélico.
theological_decisions:
- issue: Expressão étnica בְנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  alternative: Os israelitas
  rationale: A forma escolhida conserva o idioma e o gênero gramatical do hebraico sem introduzir uma interpretação doutrinária.
- issue: Escopo semântico de חֵילָם
  choice: todos os seus bens
  alternative: toda a sua riqueza
  rationale: O contexto favorece propriedade ou recursos materiais, não força militar; 'bens' preserva essa amplitude sem especificação indevida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura próxima ao hebraico sem sacrificar a naturalidade. A repetição de 'todos os seus' reflete a enumeração enfática do original.
