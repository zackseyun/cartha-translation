  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵ/אֵ֖ת הַ/מִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל עַמֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: pt
  text: “Vingue os filhos de Israel dos midianitas.[a] Depois disso, você será reunido ao seu povo.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Execute a vingança dos israelitas contra os midianitas”. Hebraico, literalmente: “Vingue a vingança dos filhos de Israel dos/contra os midianitas”.'
    reason: lexical_alternative
  - marker: b
    text: “Ser reunido ao seu povo” é uma expressão idiomática hebraica que se refere à morte.
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: Vingue
  rationale: O imperativo e seu objeto cognato formam uma expressão enfática, literalmente próxima de “vingar a vingança”. Em português, “vingue” transmite de modo natural e direto a ordem dada a Moisés, sem repetir artificialmente o cognato.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma hebraica e a linguagem de identidade coletiva, permanecendo compreensível em português moderno. “Os israelitas” seria uma alternativa mais idiomática.
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: dos midianitas
  rationale: Com o verbo נקם, a construção indica aqueles de quem se exige a vingança. “Vingar alguém de alguém” é uma construção portuguesa adequada, embora “contra os midianitas” também expresse o sentido.
- source_word: אַחַר
  choice: Depois disso
  rationale: Marca com clareza a sequência temporal entre a vingança ordenada e a morte de Moisés.
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: você será reunido ao seu povo
  rationale: Mantém a metáfora hebraica convencional para a morte, sem a substituir pela paráfrase interpretativa “você morrerá” nem especificar “antepassados”.
theological_decisions:
- issue: Expressão hebraica referente à morte de Moisés
  choice: Manter “você será reunido ao seu povo”
  alternative: “você morrerá” ou “você será reunido aos seus antepassados”
  rationale: A formulação preserva a imagem e a abertura teológica do hebraico, sem impor uma explicação específica acerca da condição após a morte.
- issue: Agente e beneficiários da vingança
  choice: “Vingue os filhos de Israel dos midianitas”
  alternative: “Execute a vingança dos filhos de Israel contra os midianitas”
  rationale: A redação escolhida apresenta a ordem de modo natural e conciso, conservando os filhos de Israel como aqueles por quem a vingança é realizada e os midianitas como seu alvo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. A ordem é direta, e a expressão hebraica sobre a morte é preservada no texto principal e explicada em nota.
