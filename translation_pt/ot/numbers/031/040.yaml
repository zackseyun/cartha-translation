  text: וְ/נֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָ֑לֶף וּ/מִכְסָ/ם֙ לַֽ/יהוָ֔ה שְׁנַ֥יִם וּ/שְׁלֹשִׁ֖ים נָֽפֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: pt
  text: E havia dezesseis mil pessoas, e a cota delas destinada a Yahweh[a] foi de trinta e duas pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o SENHOR”. O hebraico traz o nome divino YHWH, aqui representado como “Yahweh”.
    reason: divine_name
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: pessoas
  rationale: A expressão distingue os seres humanos dos animais na relação do despojo. Em português, “pessoas” comunica naturalmente o uso de נֶפֶשׁ como termo de contagem, sem sugerir aqui um sentido metafísico de “almas”.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: dezesseis mil
  rationale: Representação direta da expressão numérica hebraica.
- source_word: מִכְסָם
  choice: a cota delas
  rationale: Neste contexto, מֶכֶס designa a parcela calculada do despojo que foi separada. “Cota” expressa com clareza essa porção proporcional; “tributo” também seria possível, mas pode sugerir um pagamento político regular.
- source_word: לַיהוָה
  choice: destinada a Yahweh
  rationale: A preposição indica que a cota foi separada e atribuída a Yahweh. A formulação explicita naturalmente essa destinação em português.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: trinta e duas pessoas
  rationale: Mantém o valor numérico e verte novamente נֶפֶשׁ como termo de contagem de indivíduos humanos.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Sentido de נֶפֶשׁ na contagem de seres humanos
  choice: pessoas
  alternative: almas
  rationale: No contexto administrativo de divisão do despojo, נֶפֶשׁ conta indivíduos humanos. “Pessoas” preserva o sentido contextual sem decidir questões antropológicas que o versículo não aborda.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “E havia” preserva a continuidade da enumeração; “cota destinada” torna explícita, sem alterar o conteúdo, a parcela calculada e separada para Yahweh.
