  naturalness: «Por isso» introduz uma inferência mais explícita do que o waw narrativo exige; «Assim» é mais neutro. Além disso, «a oferta de Yahweh» pode ser entendida em português como uma oferta pertencente a Yahweh, ao passo que o construto hebraico neste contexto designa uma oferta apresentada a Yahweh. «Uma oferta para Yahweh» comunica a relação com clareza e conserva o sentido cultual.
  terminology: «Yahweh», «cada homem», «objetos de ouro», «braceletes», «anéis», «brincos» e «fazer expiação» são escolhas adequadas, atuais e fiéis. As notas preservam as incertezas lexicais sem impor identificações excessivamente específicas.
