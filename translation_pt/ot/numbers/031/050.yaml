revisions:
- from: 'Por isso, trouxemos a oferta de Yahweh: cada homem, aquilo que encontrou — objetos de ouro, tornozeleiras[a], braceletes, anéis, brincos e adornos[b] — para fazer expiação por nós mesmos[c] diante de Yahweh.'
  to: 'Assim, apresentamos uma oferta para Yahweh: cada homem, aquilo que encontrou — objetos de ouro, tornozeleiras[a], braceletes, anéis, brincos e adornos[b] — para fazer expiação por nós mesmos[c] diante de Yahweh.'
  rationale: 'A revisão limita-se a duas melhorias seguras de clareza e fidelidade idiomática: substitui o conector inferencial «Por isso» pelo narrativo-neutro «Assim» e torna explícita, em português, a direção da oferta mediante «uma oferta para Yahweh». Mantêm-se a ambiguidade lexical dos ornamentos, o masculino contextual de «cada homem» e a linguagem cultual de expiação.'
