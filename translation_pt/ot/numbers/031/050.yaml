  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: pt
  text: 'Assim, apresentamos uma oferta para Yahweh: cada homem, aquilo que encontrou — objetos de ouro, tornozeleiras[a], braceletes, anéis, brincos e adornos[b] — para fazer expiação por nós mesmos[c] diante de Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «braceletes de braço». O termo hebraico designa um adorno usado em um membro do corpo.
    reason: lexical_alternative
  - marker: b
    text: O sentido exato do termo hebraico é incerto; também pode indicar colares, pingentes ou argolas de nariz.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «por nossas vidas» ou «por nossas pessoas».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: Por isso, trouxemos
  rationale: O hifil de קרב expressa fazer chegar ou apresentar. Em português, «trouxemos a oferta» preserva a imagem de aproximação de modo natural; «Por isso» comunica o nexo do waw no contexto.
- source_word: קָרְבַּן יְהוָה
  choice: a oferta de Yahweh
  rationale: קָרְבָּן designa algo apresentado ou levado para perto como oferta. O construto permite a formulação possessiva sem especificar além do texto o tipo de oferta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: cada homem, aquilo que encontrou
  rationale: אִישׁ tem força distributiva e, no contexto, refere-se aos homens do exército; a oração relativa é mantida sem transformar o objeto encontrado em uma contribuição genérica.
- source_word: כְלִי זָהָב
  choice: objetos de ouro
  rationale: כְלִי é um termo amplo para objeto, utensílio ou artigo. «Objetos» evita restringi-lo prematuramente a joias, embora a lista seguinte seja de adornos.
- source_word: אֶצְעָדָה
  choice: tornozeleiras
  rationale: O termo indica um adorno de membro e costuma ser entendido como tornozeleira; como a localização exata não é inteiramente segura, a alternativa é registrada em nota.
- source_word: צָמִיד
  choice: braceletes
  rationale: Designa uma faixa ornamental usada no braço ou pulso; «braceletes» é claro e corrente em português.
- source_word: טַבַּעַת
  choice: anéis
  rationale: O substantivo significa anel, mas não exige especificamente um anel de sinete; a tradução evita acrescentar essa qualificação.
- source_word: עָגִיל
  choice: brincos
  rationale: Neste inventário de joias, o termo é naturalmente entendido como ornamento de orelha e se distingue de טַבַּעַת.
- source_word: כוּמָז
  choice: adornos
  rationale: A identificação exata do objeto é incerta. «Adornos» preserva essa incerteza sem impor uma localização anatômica específica.
- source_word: לְכַפֵּר
  choice: para fazer expiação
  rationale: כפר, neste contexto de oferta diante de Yahweh, conserva seu peso cultual; «fazer expiação» é uma formulação portuguesa precisa sem definir o mecanismo além do hebraico.
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: por nós mesmos
  rationale: Literalmente, a expressão pode ser «por nossas vidas/pessoas». Aqui indica que a expiação é feita em favor dos próprios ofertantes, sem pressupor uma dicotomia posterior entre alma e corpo.
theological_decisions:
- issue: Relação da oferta com כפר
  choice: A oferta é apresentada para fazer expiação pelos homens diante de Yahweh.
  alternative: Entender a entrega apenas como oferta de gratidão ou como simples afastamento de perigo.
  rationale: A presença conjunta de קָרְבָּן, כפר e «diante de Yahweh» requer que se preserve a linguagem de expiação, sem explicar uma eficácia ou mecanismo que o versículo não especifica.
- issue: Gênero de אִישׁ
  choice: cada homem
  alternative: cada pessoa; cada um
  rationale: O masculino distributivo refere-se, no contexto, aos combatentes. A tradução mantém essa referência histórica específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o nome Yahweh, a referência masculina contextual e a terminologia cultual «fazer expiação». As notas preservam as incertezas lexicais reais sem sobrecarregar o texto principal.
