  footnotes:
  - marker: a
    text: O hebraico emprega נֶפֶשׁ (néfesh) com אָדָם (adam), aqui no sentido de pessoas humanas contadas individualmente; não enfatiza a “alma” imaterial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶפֶשׁ אָדָם
  choice: e ... pessoas
  rationale: Neste inventário, נֶפֶשׁ אָדָם designa seres humanos contados individualmente, em contraste com os animais mencionados ao redor. “Pessoas” comunica esse sentido de modo natural, sem sugerir que apenas homens do sexo masculino foram contados; וְ é traduzido por “e”.
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: dezesseis mil
  rationale: 'A expressão numérica hebraica indica diretamente 16.000. A ordem foi ajustada para a formulação idiomática em português: “dezesseis mil pessoas”.'
