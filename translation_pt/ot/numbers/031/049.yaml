base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/049.yaml
  text: And they said to Moses[a], “Your servants have taken a count of the men of war who are under our command[b], and not one man of us is missing.”
translation:
  language: pt
  text: 'E disseram a Moisés: “Os teus servos fizeram a contagem[a] dos homens de guerra sob o nosso comando[b], e não falta nenhum homem entre nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “levantaram a cabeça dos homens de guerra”, expressão idiomática hebraica que significa fazer uma contagem ou um recenseamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “sob a nossa responsabilidade”. Literalmente, “em nossa mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: os teus servos
  rationale: Neste discurso respeitoso dos oficiais a Moisés, עבד expressa subordinação e deferência; “servos” é natural e não introduz indevidamente a ideia específica de escravidão.
- source_word: נָשְׂאוּ אֶת רֹאשׁ
  choice: fizeram a contagem
  rationale: A expressão idiomática hebraica, literalmente “levantaram a cabeça”, designa aqui o ato de contar ou recensear as tropas.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: homens de guerra
  rationale: A expressão se refere aos homens que participaram do combate; a tradução conserva tanto a referência masculina quanto o contexto militar.
- source_word: אֲשֶׁר בְּיָדֵנוּ
  choice: sob o nosso comando
  rationale: A imagem literal “em nossa mão” indica responsabilidade ou autoridade sobre os soldados; “sob o nosso comando” explicita naturalmente o sentido militar.
- source_word: וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ
  choice: e não falta nenhum de nós
  rationale: O nifal de פקד indica que ninguém estava ausente, desaparecido ou sem ser contabilizado; esta formulação comunica de modo natural que nenhum homem do grupo se perdeu.
theological_decisions: []
