base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: pt
  text: Os jumentos eram 30.500, e o tributo deles[a] para Yahweh foi de 61.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a parte deles devida”. O termo hebraico indica a porção calculada dos despojos que foi separada para Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמֹרִים
  choice: Os jumentos
  rationale: חֲמֹרִים é o substantivo plural comum para jumentos. A conjunção inicial é representada pela ligação entre os itens da lista no contexto, sem o pouco natural «E os jumentos» no início do versículo isolado.
- source_word: שְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: '30.500'
  rationale: A sequência cardinal hebraica totaliza trinta mil e quinhentos; algarismos favorecem a leitura deste inventário numérico.
- source_word: וּמִכְסָם
  choice: e o tributo deles
  rationale: מֶכֶס designa aqui a parcela obrigatória, calculada sobre os despojos e separada para Yahweh. «Tributo» comunica essa contribuição devida sem sugerir apenas um imposto civil comum.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica que a parcela era destinada a Yahweh; «para» expressa naturalmente essa destinação em português.
- source_word: אֶחָד וְשִׁשִּׁים
  choice: '61'
  rationale: A ordem idiomática hebraica, literalmente «um e sessenta», corresponde a sessenta e um. O uso de algarismos mantém o estilo do inventário.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal da aliança sem substituí-lo por um título nem adotar a forma híbrida tradicional «Jeová».
translation_notes:
  register: Português atual, claro e digno, com «jumentos» como termo comum e algarismos no inventário. A formulação «eram 30.500» preserva a estrutura enumerativa do hebraico, enquanto «para Yahweh» explicita a destinação do tributo. O marcador foi colocado junto a «tributo deles», termo ao qual a nota lexical se refere.
