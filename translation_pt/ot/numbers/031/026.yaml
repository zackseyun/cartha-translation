  naturalness: «Faça a contagem» e «seres humanos» são claros e adequados. «Despojo de guerra» é mais idiomático e suficientemente preciso no contexto, e «casas ancestrais» comunica melhor a estrutura familiar do que «famílias ancestrais», que pode designar as próprias famílias em vez de suas casas/unidades familiares.
