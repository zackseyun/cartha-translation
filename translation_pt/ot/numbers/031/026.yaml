translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A tradução mantém o imperativo singular dirigido a Moisés e conserva o contraste explícito entre seres humanos e animais. O travessão reproduz a aposição enfática dos responsáveis pela contagem.
