base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: pt
  text: “Faça a contagem do despojo de guerra[a], tanto dos seres humanos[b] como dos animais — você, o sacerdote Eleazar e os chefes das casas ancestrais[c] da comunidade.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o despojo do cativeiro”; ou “o que foi capturado”. A expressão hebraica abrange tudo o que foi tomado na guerra, aqui especificado como seres humanos e animais.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega אָדָם em contraste com os animais; aqui, o sentido é “seres humanos”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os chefes das casas paternas”; em termos mais livres, “os líderes dos clãs”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: Faça a contagem
  rationale: A expressão idiomática significa contar ou levantar o total, não literalmente ‘levantar a cabeça’. O imperativo singular preserva o fato de que a ordem é dirigida diretamente a Moisés.
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: despojo capturado
  rationale: A expressão designa aquilo que foi tomado na guerra e, neste contexto, inclui pessoas e animais. ‘Despojo capturado’ mantém essa abrangência sem sugerir que somente pessoas foram feitas prisioneiras.
- source_word: בָּאָדָם
  choice: dos seres humanos
  rationale: אָדָם está em contraste com os animais e tem sentido coletivo; ‘seres humanos’ comunica isso de modo claro e natural em português.
- source_word: וּבַבְּהֵמָה
  choice: como dos animais
  rationale: בְּהֵמָה refere-se a animais, especialmente animais domésticos neste contexto. ‘Animais’ evita restringir indevidamente o termo a uma categoria específica de rebanho.
- source_word: אַתָּה
  choice: você
  rationale: O pronome explícito dá destaque à participação pessoal de Moisés na contagem.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: o sacerdote Eleazar
  rationale: A ordem natural do título e do nome em português produz uma formulação clara e digna.
- source_word: רָאשֵׁי אֲבוֹת
  choice: os chefes das famílias ancestrais
  rationale: A expressão se refere aos líderes das unidades familiares de ascendência. Esta formulação preserva a estrutura social sem recorrer à expressão pouco transparente ‘casas paternas’.
- source_word: הָעֵדָה
  choice: da comunidade
  rationale: O termo designa a comunidade reunida de Israel. ‘Comunidade’ é corrente, abrangente e adequado ao contexto do Pentateuco.
