  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: pt
  text: Mas mantenham vivas para vocês todas as meninas dentre as mulheres que não conheceram o leito de homem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais explicitamente: «que não tiveram relações sexuais com homem».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mas ... todas
  rationale: וְ dá continuidade à ordem em contraste com a instrução anterior, por isso «Mas» expressa adequadamente sua força adversativa no contexto. כֹל com o coletivo הַטַּף é traduzido naturalmente por «todas» em português.
- source_word: הַטַּף
  choice: as meninas
  rationale: טַף designa crianças ou pequenos. Embora o termo isolado não especifique sexo, neste contexto ele é restringido por «dentre as mulheres» e pela referência à ausência de relações com homem; «meninas» torna explícito o referente feminino sem acrescentar uma categoria técnica como «virgens».
- source_word: בַּ/נָּשִׁים
  choice: dentre as mulheres
  rationale: A preposição בְּ introduz aqui o grupo do qual as meninas são destacadas. «Dentre as mulheres» preserva esse sentido partitivo e evita que a expressão seja entendida como simples localização física.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: que não conheceram
  rationale: יָדַע funciona neste contexto como eufemismo de experiência sexual. O plural concorda naturalmente com «todas as meninas» e preserva o modo de expressão do hebraico.
- source_word: מִשְׁכַּב זָכָר
  choice: leito de homem
  rationale: A expressão hebraica significa literalmente algo como «deitar-se com um macho» e, no contexto, refere-se a relações sexuais. «Leito de homem» conserva a metáfora e o eufemismo, enquanto a nota oferece a formulação explícita.
- source_word: הַחֲיוּ לָכֶם
  choice: mantenham vivas para vocês
  rationale: O imperativo Hifil de חיה significa conservar ou deixar com vida. «Mantenham vivas» traduz diretamente essa forma causativa, e «para vocês» preserva לָכֶם sem especificar finalidade ou condição além do que o texto declara.
theological_decisions:
- issue: Se o eufemismo sexual deve ser explicitado no texto principal
  choice: Conservar «não conheceram leito de homem» no texto principal.
  alternative: «não tiveram relações sexuais com homem» ou «eram virgens»
  rationale: O hebraico emprega uma expressão eufemística, não o substantivo técnico «virgem». Preservar a imagem evita reduzir a tensão e a forma própria do texto; a nota fornece uma explicação contemporânea clara.
- issue: Como indicar o referente feminino de טַף
  choice: Traduzir por «meninas».
  alternative: «crianças» ou «pequenos»
  rationale: Embora טַף possa ser coletivo e não marque por si só o sexo, os qualificadores imediatos limitam o referente às pessoas do sexo feminino. «Meninas» comunica essa restrição contextual sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem «dentre as mulheres» reduz a possibilidade de o relativo ser ligado indevidamente a «mulheres». A expressão «leito de homem» é deliberadamente formal para conservar o eufemismo hebraico; a nota esclarece seu sentido.
