source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Da metade destinada aos filhos de Israel[a], Moisés tomou um de cada cinquenta, tanto das pessoas como dos animais, e os entregou aos levitas encarregados de cuidar do tabernáculo de Yahweh, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os israelitas.
    reason: Esclarece o sentido coletivo da expressão hebraica literal “filhos de Israel”.
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: Da metade destinada aos filhos de Israel
  rationale: מַחֲצִית designa a metade ou meia porção atribuída à comunidade de Israel na divisão dos despojos. “Destinada” explicita naturalmente essa relação sem alterar o sentido, e “filhos de Israel” preserva a expressão hebraica.
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: um de cada cinquenta
  rationale: A expressão indica a parcela recolhida na proporção de um para cinquenta. Esta formulação é clara e idiomática em português.
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: tanto das pessoas como dos animais
  rationale: אָדָם tem sentido coletivo de seres humanos, e בְּהֵמָה abrange os animais domésticos incluídos nos despojos. A construção correlativa reproduz as duas categorias.
- source_word: וַיִּתֵּן אֹתָם
  choice: e os entregou
  rationale: O sufixo pronominal hebraico é plural e retoma os seres humanos e animais recolhidos. “Entregou” expressa adequadamente a transferência aos levitas.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: aos levitas encarregados de cuidar do tabernáculo de Yahweh
  rationale: O particípio com o substantivo cognato descreve a responsabilidade de guardar, cuidar ou cumprir o serviço ligado ao tabernáculo. A formulação evita repetição artificial e mantém o sentido funcional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: כַּאֲשֶׁר assinala conformidade com a ordem anterior; o mais-que-perfeito situa naturalmente essa ordem antes da ação narrada.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Representação de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução conserva a forma explícita da expressão hebraica, enquanto a nota esclarece seu referente coletivo.
- issue: Pessoas incluídas nos despojos de guerra
  choice: pessoas
  alternative: seres humanos
  rationale: אָדָם é coletivo e inclui as pessoas enumeradas no contexto; “pessoas” mantém a referência humana sem especificar gênero além do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi suavizada sem eliminar a proporção exata do tributo nem a referência plural aos seres entregues.
