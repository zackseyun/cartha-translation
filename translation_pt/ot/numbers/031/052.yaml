  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: pt
  text: O total do ouro da contribuição[a] que apresentaram a Yahweh foi de dezesseis mil setecentos e cinquenta siclos; ele veio dos comandantes de mil e dos comandantes de cem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta”; tradicionalmente, “oferta alçada”. O termo hebraico indica uma contribuição separada para Yahweh.
    reason: Registra alternativas lexicais legítimas e esclarece o sentido cultual do termo hebraico.
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: Todo o ouro ... foi
  rationale: Expressa naturalmente em português a declaração do total, preservando a ligação narrativa sem reproduzir de modo rígido a forma hebraica de וַיְהִי.
- source_word: הַתְּרוּמָה
  choice: a contribuição
  rationale: O termo designa algo separado ou apresentado para uso sagrado; “contribuição” é claro no contexto do ouro retirado dos despojos e evita a expressão tradicional pouco transparente “oferta alçada”.
- source_word: אֲשֶׁר הֵרִימוּ
  choice: que apresentaram
  rationale: O hifil de רום indica aqui o ato de separar e apresentar algo como oferta, não necessariamente um movimento físico para cima.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: Mantém a direção da dedicação indicada pela preposição ל e translitera o nome divino pessoal.
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: dezesseis mil setecentos e cinquenta siclos
  rationale: Reproduz diretamente o total hebraico e emprega “siclos”, forma portuguesa corrente para a antiga unidade de peso.
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: proveniente dos comandantes de mil e dos comandantes de cem
  rationale: מֵאֵת marca a procedência, enquanto שָׂרֵי, neste contexto militar, designa comandantes. “De mil” e “de cem” preserva a organização das unidades militares sem sugerir apenas números abstratos.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém o total em palavras e conserva a estrutura militar de comandantes de mil e de cem. O marcador da nota foi colocado junto de “contribuição”, termo ao qual a nota lexical se refere.
