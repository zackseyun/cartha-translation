  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: pt
  text: Da metade que lhes cabe, tomem e deem-na ao sacerdote Eleazar como contribuição de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como oferta de Yahweh” ou “como contribuição para Yahweh”. O termo hebraico indica uma porção separada para uso sagrado; a relação com Yahweh pode indicar uma contribuição que lhe pertence ou que lhe é destinada.
    reason: Alternativa lexical e preservação da relação genitiva.
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: Da metade que lhes cabe
  rationale: Expressa de modo natural o sentido de “da metade deles”, retomando no contexto a metade destinada aos guerreiros, sem confundi-la com metade das pessoas.
- source_word: תִּקָּחוּ
  choice: vocês tomarão
  rationale: Preserva a forma instrucional e o plural da forma verbal hebraica.
- source_word: וְנָתַתָּה
  choice: e a darão
  rationale: Mantém a sequência da ordem. O hebraico muda do plural para o singular; em português, o plural é mantido no texto corrente para fluidez, sem alterar a ação ordenada.
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: ao sacerdote Eleazar
  rationale: Tradução direta e idiomática do nome e do título definido.
- source_word: תְּרוּמַת יְהוָה
  choice: contribuição para Yahweh
  rationale: תְּרוּמָה designa uma porção separada para uso sagrado. A construção com o nome divino pode indicar uma contribuição pertencente ou destinada a Yahweh; “para Yahweh” é clara no contexto, e a alternativa possessiva é registrada em nota.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama; “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Relação genitiva em תְּרוּמַת יְהוָה
  choice: contribuição para Yahweh
  alternative: contribuição de Yahweh; oferta para Yahweh
  rationale: A expressão pode ser entendida como a porção sagrada destinada a Yahweh ou como pertencente a ele. A tradução principal explicita o destino adequado ao contexto, enquanto a nota preserva as alternativas.
- issue: Alternância entre segunda pessoa plural e singular
  choice: plural uniforme em português
  alternative: “vocês tomarão... e você a dará”
  rationale: O hebraico passa de תִּקָּחוּ (2mp) a וְנָתַתָּה (2ms). Uniformizar o plural produz português natural e não exige identificar com certeza o referente singular implícito.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Vocês” torna explícito o plural da primeira forma verbal; “essa parte” explicita o objeto pronominal no contexto da divisão do despojo.
