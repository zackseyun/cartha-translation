  text: וּ/מִֽ/מַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן הָ/אֲנָשִׁ֖ים הַ/צֹּבְאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: pt
  text: E da metade pertencente aos filhos de Israel, que Moisés havia separado dos homens que saíram para a guerra[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que estavam em campanha” ou “que serviam no exército”.
    reason: Alternativas lexicais para הַצֹּבְאִים, particípio que pode indicar os que estão em campanha ou em serviço militar.
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: E, da metade
  rationale: Representa tanto a conjunção quanto a preposição prefixadas. מַחֲצִית designa a metade ou meia porção; “da metade” é natural no contexto da divisão dos despojos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: pertencente aos filhos de Israel
  rationale: Preserva a expressão hebraica masculina e torna clara, em português corrente, a relação entre a metade e os filhos de Israel.
- source_word: אֲשֶׁר
  choice: que
  rationale: Pronome relativo natural, cujo antecedente é “metade”.
- source_word: חָצָה
  choice: havia separado
  rationale: No contexto da repartição dos despojos, o verbo indica dividir ou separar uma porção. O mais-que-perfeito composto esclarece que essa separação já havia sido realizada.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מִן הָ/אֲנָשִׁים
  choice: da parte dos homens
  rationale: '“Homens” traduz diretamente אֲנָשִׁים. “Parte” é uma explicitação contextual mínima: a metade dos israelitas foi separada da porção destinada aos combatentes, não das pessoas em sentido físico.'
- source_word: הַ/צֹּבְאִים
  choice: que foram à guerra
  rationale: O particípio de צבא descreve homens mobilizados para serviço militar ou campanha. “Foram à guerra” é claro, atual e adequado ao contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O travessão final preserva o caráter sintaticamente incompleto do versículo, cuja enumeração continua no versículo seguinte. O marcador da nota foi colocado junto à expressão militar a que de fato se refere.
