base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: pt
  text: O espólio, o restante do saque que o povo do exército havia tomado, totalizava 675.000 ovelhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: foi
  rationale: Introduz a declaração de inventário com valor copulativo; o português não exige um marcador temporal ou discursivo adicional.
- source_word: הַמַּלְקוֹחַ יֶתֶר הַבָּז
  choice: o que restou do despojo
  rationale: A construção identifica a parcela remanescente do espólio. Esta formulação é natural em português e evita uma sequência nominal pesada, enquanto a nota registra os dois termos hebraicos próximos.
- source_word: אֲשֶׁר בָּזְזוּ
  choice: que ... havia saqueado
  rationale: Preserva diretamente o sentido militar do verbo בזז e o valor anterior da ação em relação ao inventário.
- source_word: עַם הַצָּבָא
  choice: o povo do exército
  rationale: Mantém de modo transparente os dois elementos da expressão hebraica, sem restringi-la interpretativamente a 'combatentes'.
- source_word: צֹאן
  choice: ovelhas
  rationale: No contexto desta contagem de animais, 'ovelhas' é uma tradução direta e clara.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: '675.000'
  rationale: Representa exatamente a soma hebraica de 600.000 + 70.000 + 5.000 e usa a notação numérica corrente em português.
