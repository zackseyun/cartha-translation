source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: pt
  text: E divida o despojo[a] entre os combatentes que saíram para a campanha militar e toda a comunidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquilo que foi tomado na guerra”. O termo hebraico pode abranger os cativos, os animais e os bens tomados.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a congregação” ou “toda a assembleia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: E divida
  rationale: O verbo חצה significa dividir ou repartir. No contexto, a forma verbal dá continuidade às instruções dirigidas a Moisés; o imperativo em português expressa naturalmente essa força, e a conjunção inicial preserva o encadeamento do hebraico.
- source_word: הַמַּלְקוֹחַ
  choice: o despojo
  rationale: מַלְקוֹחַ designa aquilo que foi tomado na guerra e, neste contexto, abrange tanto pessoas quanto animais e bens. “Despojo” mantém o sentido militar e essa amplitude referencial.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e
  rationale: A construção hebraica distingue as duas partes entre as quais o despojo deve ser repartido; “entre ... e” é a forma portuguesa direta e natural.
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: os combatentes
  rationale: A expressão, literalmente relacionada aos que “tomam parte” ou “lidam” com a guerra, funciona como designação idiomática dos que combateram. “Combatentes” comunica isso sem impor uma patente ou classe militar específica.
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: que saíram para a campanha militar
  rationale: A frase identifica os combatentes como os que partiram para o serviço ou expedição militar. “Campanha militar” conserva o valor contextual de צבא e evita a formulação pouco natural “saíram para o exército”.
- source_word: כָּל הָעֵדָה
  choice: toda a comunidade
  rationale: עֵדָה refere-se à coletividade reunida de Israel. “Comunidade” é claro em português atual e preserva o sentido corporativo sem sugerir apenas uma reunião pontual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura natural, com boa compreensão no Brasil e ampla inteligibilidade internacional. A formulação mantém a estrutura de divisão entre dois grupos e explicita apenas o sentido militar já presente no hebraico.
