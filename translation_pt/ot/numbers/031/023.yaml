  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: pt
  text: Tudo o que puder passar pelo fogo, vocês farão passar pelo fogo, e ficará puro; contudo, deverá ser purificado com a água da purificação[a]. Tudo, porém, que não puder passar pelo fogo, vocês farão passar pela água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “água para remover a impureza” ou “água da impureza”; tradicionalmente, “água da separação” (ver Números 19).'
    reason: A expressão hebraica מֵי נִדָּה admite formulações diferentes; o contexto identifica a água ritual usada na purificação da impureza.
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: Tudo
  rationale: No contexto, a expressão abrange cada objeto tomado como despojo; «tudo» é natural e mantém o alcance distributivo.
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: que puder passar pelo fogo
  rationale: A frase distingue os objetos capazes de suportar o tratamento pelo fogo, e não apenas os que de fato entram nele.
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: vocês farão passar pelo fogo
  rationale: O hifil de עבר é causativo; a formulação preserva tanto essa força quanto o paralelismo com a água.
- source_word: וְטָהֵר
  choice: e ficará puro
  rationale: Expressa o estado resultante do objeto após o tratamento, no âmbito da pureza ritual.
- source_word: אַךְ
  choice: contudo
  rationale: Marca a ressalva de que o tratamento pelo fogo não elimina a exigência da purificação ritual com água.
- source_word: בְּמֵי נִדָּה
  choice: com a água da purificação
  rationale: No contexto de Números 19 e 31, designa a água ritual usada para remover a impureza; a nota preserva as possibilidades mais literais e tradicionais.
- source_word: יִתְחַטָּא
  choice: deverá ser purificado
  rationale: No uso sacerdotal, o hitpael de חטא indica submissão a um rito de purificação, não purificação moral autônoma.
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: Tudo, porém, que não puder passar pelo fogo
  rationale: Mantém o contraste prático entre objetos que suportam o fogo e os que não o suportam.
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: vocês farão passar pela água
  rationale: Conserva a repetição do verbo causativo e o paralelismo formal entre fogo e água, sem reduzir a ação explicitamente a lavar.
theological_decisions:
- issue: Natureza da linguagem de purificação na legislação sacerdotal
  choice: Traduzir em termos de pureza e purificação ritual.
  alternative: Empregar linguagem de pecado ou de purificação moral.
  rationale: Números 31, em ligação com Números 19, trata da purificação ritual de objetos contaminados, não do perdão de culpa moral.
- issue: Relação entre o fogo e a água ritual
  choice: Manter a ressalva de que o objeto tratado pelo fogo também deve passar pela purificação com água.
  alternative: Entender o fogo como substituto suficiente da água.
  rationale: A partícula אַךְ e a construção subsequente apresentam a água ritual como exigência adicional, preservando a tensão expressa no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais em «vocês» para ampla legibilidade brasileira. «Ficará puro» e «deverá ser purificado» mantêm a distinção entre o resultado declarado e a exigência ritual adicional. A colocação de «porém» preserva o contraste sem tornar a frase excessivamente literal.
