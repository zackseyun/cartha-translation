  to: Quanto a vocês, acampem fora do acampamento por sete dias. Todo aquele que matou uma pessoa e todo aquele que tocou em alguém morto[a] devem purificar-se no terceiro dia e no sétimo dia — vocês e seus cativos.
  rationale: A revisão substitui uma construção menos natural por “tocou em alguém morto”, que preserva a referência pessoal de חָלָל e é clara em português. A nota mantém a alternativa “cadáver” e explica o valor ritual contextual sem acrescentar uma interpretação doutrinária. Também se explicita “dia” nas duas referências temporais, refletindo a repetição do hebraico.
