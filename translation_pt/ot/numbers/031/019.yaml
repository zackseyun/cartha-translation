base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: pt
  text: Quanto a vocês, acampem fora do acampamento por sete dias. Todo aquele que matou uma pessoa e todo aquele que tocou em alguém morto[a] devem purificar-se no terceiro dia e no sétimo dia — vocês e seus cativos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tocou num cadáver”. O termo hebraico se refere a alguém morto, geralmente em contexto de violência; aqui, o contexto implica contato com cadáver e a consequente impureza ritual.'
    reason: Alternativa lexical e esclarecimento contextual
lexical_decisions:
- source_word: חֲנוּ
  choice: acampem
  rationale: O imperativo plural de חנה ordena que os destinatários acampem ou permaneçam acampados; “acampem” é direto e adequado ao contexto militar.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: fora do acampamento
  rationale: Reproduz com clareza a expressão espacial e mantém a ligação lexical natural com “acampem”.
- source_word: שִׁבְעַת יָמִים
  choice: durante sete dias
  rationale: “Durante” expressa naturalmente em português a duração indicada pelo hebraico.
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: todos os que tiverem matado uma pessoa
  rationale: נֶפֶשׁ designa aqui uma pessoa, não uma “alma” em sentido abstrato. A forma composta “tiverem matado” situa a ação na batalha recém-terminada, e o plural torna natural a concordância com a ordem coletiva seguinte.
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: e todos os que tiverem tocado em alguém que foi morto
  rationale: חָלָל indica alguém morto violentamente e, neste contexto ritual, pressupõe contato com o cadáver. A formulação conserva a referência pessoal sem tornar o português obscuro.
- source_word: תִּתְחַטְּאוּ
  choice: deverão purificar-se
  rationale: O hitpael de חטא tem aqui sentido ritual de remover impureza. “Deverão” comunica a obrigação sem sugerir que se trata primariamente de perdão moral.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: no terceiro e no sétimo dia
  rationale: Preserva os dois momentos específicos prescritos para o rito, com redação portuguesa concisa.
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: vocês e os seus cativos
  rationale: שְׁבִי refere-se a pessoas capturadas em guerra; “cativos” é mais preciso nesse cenário do que o termo genérico “prisioneiros”.
theological_decisions:
- issue: Natureza da purificação depois de matar ou tocar num morto
  choice: purificação ritual da impureza decorrente do contato com mortos
  alternative: purificação moral da culpa de sangue
  rationale: O uso ritual de תִּתְחַטְּאוּ e a menção ao terceiro e ao sétimo dia remetem ao procedimento de purificação por impureza associada à morte. A tradução evita acrescentar uma afirmação sobre absolvição moral.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Quanto a vocês” destaca a mudança para a instrução direta; “cativos” conserva o contexto de guerra. O marcador [a] foi colocado junto à expressão que ele explica.
