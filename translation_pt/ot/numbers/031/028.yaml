  source_fidelity: A tradução transmite corretamente a ordem de separar para Yahweh uma porção obrigatória proveniente dos combatentes e preserva as quatro categorias do hebraico. «Um ser vivo» é uma forma defensável de explicitar néfesh como unidade de contagem aplicável a humanos e animais.
  naturalness: «Um ser vivo de cada quinhentos» é compreensível, mas «um ser vivo em cada quinhentos» é a formulação distributiva mais idiomática em português atual. «Tirado dos homens de guerra» também pode ser simplificado para uma construção mais fluente sem perda de sentido.
  terminology: «Yahweh», «tributo», «gado» e «jumentos» são adequados. «Pessoas» representa bem אדם neste contraste com os animais; a nota esclarece apropriadamente o referente histórico de modo conciso.
