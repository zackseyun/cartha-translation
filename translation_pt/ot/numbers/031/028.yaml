source:
  edition: WLC
  text: וַ/הֲרֵמֹתָ֨ מֶ֜כֶס לַֽ/יהוָ֗ה מֵ/אֵ֞ת אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים לַ/צָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵ/חֲמֵ֖שׁ הַ/מֵּא֑וֹת מִן הָ/אָדָם֙ וּ/מִן הַ/בָּקָ֔ר וּ/מִן הַ/חֲמֹרִ֖ים וּ/מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: pt
  text: 'E você separará para Yahweh um tributo dos homens de guerra que saíram para a batalha: um ser vivo em cada quinhentos[a], das pessoas[b], do gado, dos jumentos e dos rebanhos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma vida” ou “uma alma em cada quinhentos”. O hebraico néfesh é usado aqui para contar um ser vivo individual, humano ou animal.
    reason: lexical_alternative
  - marker: b
    text: O hebraico adam refere-se aqui à parte humana dos despojos, em contraste com os animais mencionados em seguida.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲרֵמֹתָ
  choice: você separará
  rationale: O hifil de רום indica retirar ou pôr à parte uma porção. “Separará” expressa com naturalidade a ação exigida sem sugerir apenas elevação física.
- source_word: מֶכֶס
  choice: tributo
  rationale: O substantivo designa uma porção obrigatória ou taxada, aqui retirada dos despojos e destinada a Yahweh.
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: tirado dos homens de guerra que saíram para a batalha
  rationale: Mantém o grupo masculino explicitamente indicado e verte לַצָּבָא segundo o sentido militar contextual.
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: um ser vivo de cada quinhentos
  rationale: נֶפֶשׁ funciona como termo de contagem aplicável tanto a seres humanos quanto a animais. “Ser vivo” conserva essa amplitude sem a conotação metafísica moderna de “alma”.
- source_word: מִן הָאָדָם
  choice: das pessoas
  rationale: אָדָם designa aqui a categoria humana dos despojos, em contraste com as categorias animais seguintes.
- source_word: וּמִן הַבָּקָר
  choice: como do gado
  rationale: בָּקָר refere-se coletivamente aos bovinos ou ao gado graúdo.
- source_word: וּמִן הַחֲמֹרִים
  choice: dos jumentos
  rationale: Equivalente português corrente e concreto para חֲמֹרִים.
- source_word: וּמִן הַצֹּאן
  choice: dos rebanhos
  rationale: צֹאן é um coletivo para o gado miúdo, sobretudo ovelhas e cabras; “rebanhos” preserva a expressão coletiva.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio da aliança em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção direta. “Você” representa o destinatário singular do verbo hebraico; “homens de guerra” conserva a referência masculina explícita. A formulação mantém a abrangência de נֶפֶשׁ e a estrutura distributiva da lista.
