  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: pt
  text: Lavem suas roupas no sétimo dia e estarão puros[a]; depois disso, poderão entrar no acampamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão purificados”. O hebraico pode indicar que eles passam a estar ritualmente puros depois da lavagem prescrita.
    reason: lexical_alternative
  - marker: b
    text: Ou “entrarão no acampamento”. Neste contexto, a frase indica que a reentrada é permitida depois de concluída a purificação.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: Lavem
  rationale: O piel de כבס indica lavar roupas ou tecidos. O imperativo em português expressa com naturalidade a instrução dada pelo hebraico no contexto.
- source_word: בִּגְדֵיכֶם
  choice: suas roupas
  rationale: בגד designa vestes ou roupas; “roupas” é atual, claro e fiel ao referente.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: no sétimo dia
  rationale: Reproduz de modo idiomático a expressão temporal hebraica.
- source_word: וּטְהַרְתֶּם
  choice: e estarão puros
  rationale: O qal de טהר é aqui intransitivo ou resultativo e descreve o estado de pureza alcançado após a lavagem prescrita. “Estarão puros” preserva essa nuance sem transformar o verbo em ação reflexiva.
- source_word: וְאַחַר
  choice: depois disso
  rationale: 'Marca claramente a sequência: a entrada ocorre após a conclusão da purificação.'
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: poderão entrar no acampamento
  rationale: בוא אל pode significar entrar em um lugar. Neste contexto ritual, a frase implica permissão de reentrada depois de restaurada a pureza.
theological_decisions:
- issue: Linguagem de pureza ritual
  choice: estarão puros
  alternative: serão purificados; purifiquem-se
  rationale: A formulação mantém a linguagem hebraica de mudança para um estado de pureza ritual, sem introduzir a ideia de purificação moral ou espiritual e sem atribuir uma ação reflexiva que o qal não exige.
- issue: Modalidade da entrada no acampamento
  choice: poderão entrar
  alternative: entrarão
  rationale: Embora a forma hebraica possa ser vertida literalmente como futuro, a sequência legal indica que, concluída a purificação, a reentrada passa a ser permitida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural é mantido em todas as formas verbais. “Puros” conserva a terminologia ritual, explicada em nota para evitar uma leitura exclusivamente moral.
