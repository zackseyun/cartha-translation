  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: pt
  text: Agora, pois, matem toda criança do sexo masculino e matem toda mulher que tenha tido relações sexuais com um homem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em hebraico, literalmente: “que conheceu homem pelo deitar-se de um homem”, expressão idiomática para relações sexuais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: Marca a transição para a ordem imediata; “agora” traduz עַתָּה, e “pois” comunica com naturalidade a força discursiva do וְ sem impor uma conclusão lógica excessiva.
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: matem
  rationale: O imperativo de הרג é direto e forte. “Matem” preserva essa severidade, sem o tom arcaico de “matai” nem a formalidade atenuante de “deem a morte”.
- source_word: כָל זָכָר בַּטָּף
  choice: toda criança do sexo masculino
  rationale: זָכָר significa “macho/sexo masculino”, enquanto טַף designa crianças pequenas ou dependentes. A expressão escolhida preserva os dois elementos em português claro e evita restringir זָכָר lexicalmente a “menino” sem levar em conta o substantivo coletivo.
- source_word: כָל אִשָּׁה
  choice: toda mulher
  rationale: אִשָּׁה é genérico neste contexto e indica mulher, não especificamente esposa.
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: que tenha tido relações sexuais com um homem
  rationale: A construção emprega “conhecer” em sentido sexual e o complementa com a expressão referente a deitar-se com um homem. A tradução explicita o sentido idiomático em português corrente, enquanto a nota preserva a forma hebraica.
theological_decisions:
- issue: Tradução de uma ordem de guerra moralmente difícil sem atenuação nem comentário interpretativo
  choice: Manter a ordem direta e sua severidade no texto principal
  alternative: Empregar eufemismos como “deem a morte” ou inserir no versículo uma explicação histórica ou moral
  rationale: O hebraico apresenta imperativos explícitos. A tradução não deve suavizar a violência do texto nem acrescentar uma defesa, condenação ou enquadramento teológico que o versículo não expressa.
- issue: Expressão idiomática sexual יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: Traduzir o sentido como “tenha tido relações sexuais com um homem” e registrar a forma hebraica em nota
  alternative: Conservar no texto principal a formulação “tenha conhecido homem, deitando-se com um homem”
  rationale: Em português moderno, “conhecer um homem” normalmente não comunica por si só o sentido sexual. A formulação escolhida torna o sentido inteligível sem acrescentar conteúdo, e a nota mantém transparência quanto ao idioma original.
translation_notes:
  register: Português moderno, claro e digno, com concordância brasileira (“matem”) e vocabulário amplamente compreensível no mundo lusófono. A repetição de “matem” reproduz a estrutura enfática dos dois imperativos hebraicos. A nota foi posicionada junto à expressão sexual que ela esclarece.
