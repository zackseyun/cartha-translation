base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/004.yaml
  text: A thousand from each tribe[a], from all the tribes of Israel, you shall send to the army.
translation:
  language: pt
  text: Mil de cada tribo, mil de cada tribo, de todas as tribos de Israel, vocês devem enviar para o exército[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o serviço militar”.'
    reason: A expressão hebraica לַצָּבָא pode indicar o ingresso ou emprego no serviço militar, e não apenas o envio para uma força entendida como destino.
lexical_decisions:
- source_word: אֶלֶף
  choice: mil
  rationale: Número cardinal, expresso de modo natural em português; a repetição do hebraico é preservada.
- source_word: לַמַּטֶּה
  choice: de cada tribo
  rationale: מַטֶּה significa “tribo” neste contexto militar; a preposição com a expressão numérica repetida tem sentido distributivo.
- source_word: אֶלֶף לַמַּטֶּה אֶלֶף לַמַּטֶּה
  choice: Mil de cada tribo, mil de cada tribo
  rationale: Mantém a repetição deliberada do hebraico e sua força retórica, sem a reduzir a uma única ocorrência.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: de todas as tribos de Israel
  rationale: Define o alcance da convocação e, no contexto, indica que os homens devem ser tirados de todas as tribos.
- source_word: תִּשְׁלְחוּ
  choice: vocês devem enviar
  rationale: O imperfeito qal na segunda pessoa do plural tem força diretiva; esta formulação comunica a obrigação com clareza em português moderno.
- source_word: לַצָּבָא
  choice: para o exército
  rationale: צָבָא pode designar a força militar ou o serviço/campanha militar. “Para o exército” é conciso e natural, enquanto a alternativa semântica é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição enfática do original foi preservada; “vocês devem enviar” evita tanto o arcaísmo quanto a possível ambiguidade de um futuro simples usado como ordem.
