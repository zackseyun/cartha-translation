lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: A construção narrativa com waw consecutivo dá prosseguimento à sequência; “Então” expressa esse avanço com naturalidade, e “falou” corresponde ao verbo דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição marca aqui o destinatário da fala; em português, “falar a alguém” é uma construção clara e digna.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo hebraico anuncia o discurso direto que vem no versículo seguinte; os dois-pontos comunicam essa função de modo natural em português, sem a redundância de “falou... dizendo”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título; “Jeová” é outra forma tradicional, mas menos próxima da vocalização geralmente reconstruída.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Os dois-pontos introduzem naturalmente a fala divina que começa no versículo seguinte.
