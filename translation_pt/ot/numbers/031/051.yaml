  source_fidelity: A tradução preserva os participantes, o ouro recebido deles e a referência a objetos manufaturados. Contudo, כֹּל pede mais naturalmente um coletivo («todos») do que o distributivo singular «cada» neste contexto; «receberam» é contextual e aceitável para וַיִּקַּח.
  naturalness: «Cada objeto trabalhado» em aposição a «o ouro» soa truncado em português. «Todos os objetos trabalhados» torna a relação mais clara e idiomática.
  terminology: «Objetos trabalhados» é uma boa tradução ampla de כְּלִי מַעֲשֶׂה. A nota atual, porém, usa a expressão pouco natural «objeto de trabalho artesanal» e deve ser ajustada.
  issues:
