  yaml_path: translation/ot/numbers/031/051.yaml
  text: So Moses and Eleazar the priest took the gold from them[a], every crafted article.
translation:
  language: pt
  text: Assim, Moisés e Eleazar, o sacerdote, receberam deles o ouro — todos os objetos trabalhados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os objetos de manufatura”, isto é, todas as peças de ouro trabalhadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: receberam
  rationale: O verbo לקח pode significar tomar ou receber. Neste contexto, Moisés e Eleazar recebem dos oficiais o ouro apresentado; “receberam” expressa naturalmente a ação sem sugerir confisco.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְאֶלְעָזָר הַכֹּהֵן
  choice: e Eleazar, o sacerdote
  rationale: Mantém o nome próprio e o título em aposição, com pontuação natural em português.
- source_word: אֶת הַזָּהָב
  choice: o ouro
  rationale: Preserva o objeto direto definido, referente ao ouro apresentado no contexto.
- source_word: מֵאִתָּם
  choice: deles
  rationale: 'Expressa de maneira idiomática a origem: o ouro foi recebido daqueles homens.'
- source_word: כֹּל
  choice: cada
  rationale: Diante do substantivo singular coletivo, “cada” preserva o valor distributivo e corresponde naturalmente à construção hebraica.
- source_word: כְּלִי מַעֲשֶׂה
  choice: objeto trabalhado
  rationale: כְּלִי é um termo amplo para objeto, utensílio ou artigo, e מַעֲשֶׂה indica algo feito ou trabalhado. A expressão comunica que se tratava de peças de ouro manufaturadas, não de ouro bruto.
