    issue: «cada objeto trabalhado»
    rationale: Embora o substantivo hebraico esteja no singular, a construção כֹּל כְּלִי tem sentido coletivo («todos os objetos/artigos»). Em português, «cada» desloca a ênfase para a distribuição individual e produz uma aposição pouco natural depois de «o ouro».
  - severity: low
    issue: Redação da nota lexical
    rationale: «Todo objeto de trabalho artesanal» não é uma alternativa idiomática nem reproduz claramente o valor de «objeto/artigo de manufatura».
