base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/011.yaml
  text: And they took all the spoil and all the plunder, both man and beast.
translation:
  language: pt
  text: E tomaram todos os despojos e tudo o que haviam capturado, tanto pessoas como animais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל (shalal)
  choice: despojos
  rationale: Designa os bens tomados na guerra e preserva a distinção em relação ao termo seguinte.
- source_word: מַלְקוֹחַ (malqoach)
  choice: o que haviam capturado
  rationale: O termo abrange aquilo que foi tomado ou capturado, e a expressão seguinte esclarece que inclui pessoas e animais.
- source_word: אָדָם (adam)
  choice: pessoas
  rationale: Neste contexto coletivo, refere-se a seres humanos capturados; “pessoas” é natural em português e evita que “homens” seja entendido como exclusivamente masculino.
- source_word: בְּהֵמָה (behemah)
  choice: animais
  rationale: Termo coletivo para animais, especialmente domésticos; “animais” é claro e suficientemente abrangente no contexto.
theological_decisions:
- issue: Descrição de seres humanos entre os capturados na guerra
  choice: tanto pessoas como animais
  alternative: tanto seres humanos como animais
  rationale: Mantém de modo direto a categorização descritiva do hebraico, sem suavizar nem acrescentar avaliação teológica.
translation_notes:
  register: Português moderno, claro e digno. A formulação conserva os dois termos hebraicos distintos para os bens de guerra e os capturados, evitando a redundância pouco natural de traduzir ambos pelo mesmo substantivo.
