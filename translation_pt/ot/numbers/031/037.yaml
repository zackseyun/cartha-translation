base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: pt
  text: E o tributo para Yahweh, proveniente do rebanho, foi de seiscentos e setenta e cinco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... foi
  rationale: A forma narrativa de היה funciona aqui como ligação copulativa que apresenta o total; esta construção é natural em português e mantém a continuidade do relato.
- source_word: הַמֶּכֶס
  choice: o tributo
  rationale: מֶכֶס designa a parte exigida dos despojos e separada como contribuição; “tributo” evita categorias fiscais modernas excessivamente específicas.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição ל indica que essa porção foi destinada ou dedicada a Yahweh.
- source_word: יהוה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino expresso pelo Tetragrama, conforme a orientação teológica fornecida.
- source_word: מִן הַצֹּאן
  choice: tirado do rebanho
  rationale: צֹאן é um coletivo para animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” preserva essa abrangência sem restringir o sentido apenas a ovelhas.
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: seiscentos e setenta e cinco animais
  rationale: Reproduz exatamente o total. “Animais” é acrescentado para explicitar naturalmente em português o substantivo elíptico contado, já indicado pelo rebanho.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz explicitamente o Tetragrama. “Yahweh” preserva o nome da aliança e segue a decisão doutrinária atual fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a sequência narrativa e explicita “animais” apenas para evitar que o numeral fique solto em português.
