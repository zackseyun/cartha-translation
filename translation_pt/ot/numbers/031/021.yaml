  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: pt
  text: 'Então o sacerdote Eleazar disse aos homens do exército que tinham ido à guerra: “Este é o estatuto da lei[a] que Yahweh ordenou a Moisés:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a ordenança da lei” ou “o estatuto da instrução”.
    reason: Registra alternativas legítimas para חֻקַּת הַתּוֹרָה, cuja terminologia pode destacar tanto a força legal quanto o caráter instrutivo.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa; “Então” expressa a sequência de modo natural em português.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: o sacerdote Eleazar
  rationale: Mantém o nome próprio por transliteração convencional e apresenta o título definido em ordem natural no português.
- source_word: אַנְשֵׁי הַצָּבָא
  choice: os homens do exército
  rationale: Preserva a referência masculina explícita de אַנְשֵׁי e traduz צָבָא pelo termo coletivo militar corrente “exército”.
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: que tinham ido à guerra
  rationale: O particípio com לַמִּלְחָמָה identifica os que participaram da expedição militar. “Tinham ido à guerra” comunica isso naturalmente sem inserir de modo explícito a ideia de “voltar”, ausente da expressão hebraica.
- source_word: חֻקַּת הַתּוֹרָה
  choice: o estatuto da lei
  rationale: חֻקָּה designa uma determinação fixa, e תּוֹרָה, uma instrução normativa ou lei. A formulação conserva tanto a força jurídica quanto a relação construtiva do hebraico.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: que Yahweh ordenou a Moisés
  rationale: Moisés é a pessoa a quem a ordem foi dirigida, como indica אֶת; a formulação evita apresentá-lo como mediador nessa oração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” representa o nome da aliança sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe mantém a sequência narrativa e o tom jurídico do original.
