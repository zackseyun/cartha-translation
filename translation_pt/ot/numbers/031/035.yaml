base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: pt
  text: E as pessoas dentre as mulheres que não haviam conhecido leito de homem[a] eram, ao todo, trinta e duas mil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não haviam conhecido leito de homem”, expressão que significa que não haviam tido relações sexuais com um homem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: pessoas
  rationale: No contexto da contagem, a expressão designa seres humanos em contraste com os animais mencionados nos versículos próximos; “pessoas” comunica isso naturalmente em português.
- source_word: מִן הַנָּשִׁים
  choice: dentre as mulheres
  rationale: Expressa que esse grupo foi separado do conjunto das mulheres capturadas, preservando o valor partitivo da preposição.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: que não haviam conhecido
  rationale: Mantém o eufemismo hebraico de conhecimento sexual e situa a experiência como anterior à contagem.
- source_word: מִשְׁכַּב זָכָר
  choice: leito de homem
  rationale: Preserva de modo conciso e digno a imagem literal do hebraico; o sentido idiomático é esclarecido em nota.
- source_word: כָּל נֶפֶשׁ
  choice: ao todo
  rationale: Nesta retomada da fórmula censitária, o hebraico introduz o total do grupo. “Ao todo” evita uma repetição pesada de “pessoas” e transmite naturalmente sua função.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: trinta e duas mil
  rationale: Forma numeral padrão em português, com concordância de gênero subentendida com “pessoas”.
