  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: pt
  text: O próprio vingador do sangue[a] matará o homicida; quando o encontrar, ele mesmo o matará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vingador do sangue” é uma expressão jurídica hebraica que designa o parente responsável por vingar uma morte ilícita.
    reason: Esclarece um termo legal antigo cuja função não é imediatamente evidente ao leitor moderno.
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: vingador do sangue
  rationale: Neste contexto jurídico, a expressão designa o parente incumbido de vingar uma morte ilícita. A formulação mantém o termo legal israelita sem importar o sentido mais amplo de גֹּאֵל como “resgatador”.
- source_word: הוּא
  choice: o próprio / ele mesmo
  rationale: O pronome independente é enfático. As duas formulações portuguesas preservam a ênfase repetida no agente que pessoalmente realiza o ato.
- source_word: יָמִית
  choice: matará
  rationale: O hifil de מות significa causar a morte. “Matará” é direto e natural neste enunciado legal, enquanto “executará” poderia sugerir procedimentos estatais não expressos pelo hebraico.
- source_word: הָרֹצֵחַ
  choice: o homicida
  rationale: רצח designa quem comete homicídio ilícito. “Homicida” conserva o tom jurídico e evita restringir o vocábulo além do que o contexto imediato estabelece.
- source_word: בְּפִגְעוֹ בוֹ
  choice: quando o encontrar
  rationale: A construção indica o momento em que o vingador encontra ou se depara com o homicida. Esta forma é clara, atual e fiel ao valor temporal da expressão.
- source_word: הוּא יְמִיתֶנּוּ
  choice: ele mesmo o matará
  rationale: A repetição do pronome e do verbo reforça tanto a identidade do agente quanto sua ação; a tradução mantém essa repetição solene.
theological_decisions:
- issue: Função jurídica de גֹּאֵל הַדָּם
  choice: Entender a expressão como o agente humano, pertencente à família, encarregado de vingar o sangue derramado dentro da legislação de Israel.
  alternative: “resgatador do sangue” ou leitura associada a um motivo teológico posterior de redenção
  rationale: O contexto trata das leis israelitas sobre homicídio e das cidades de refúgio. A tradução deve representar essa instituição jurídica de parentesco sem introduzir associações doutrinárias que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática do hebraico foi preservada, e evitou-se “executar” por ser mais institucional do que o texto-fonte.
