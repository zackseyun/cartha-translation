  text: וְ/אִם בְּ/פֶ֥תַע בְּ/לֹא אֵיבָ֖ה הֲדָפ֑/וֹ אוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו כָּל כְּלִ֖י בְּ/לֹ֥א צְדִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: pt
  text: Mas, se alguém de repente empurrar outra pessoa, sem hostilidade, ou lançar contra ela algum objeto, sem estar à espreita[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sem armar uma emboscada» ou «sem premeditação». Literalmente, «sem estar à espreita».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma situação condicional em contraste com os casos intencionais dos versículos anteriores.
- source_word: בְּפֶתַע
  choice: de repente
  rationale: Expressa a ocorrência súbita ou inesperada de modo natural em português.
- source_word: בְּלֹא אֵיבָה
  choice: sem hostilidade
  rationale: אֵיבָה denota inimizade ou animosidade pessoal; «hostilidade» é clara e atual.
- source_word: הֲדָפוֹ
  choice: empurrar outra pessoa
  rationale: O verbo indica empurrar ou dar um encontrão. A explicitação neutra dos participantes evita a sequência pronominal ambígua em português.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: lançar contra ela
  rationale: Reproduz o ato de lançar algo em direção à pessoa, sem pressupor necessariamente que o objeto a tenha atingido.
- source_word: כָּל כְּלִי
  choice: algum objeto
  rationale: כְּלִי é um termo amplo para objeto, utensílio ou instrumento; neste contexto indefinido, «algum objeto» é idiomático.
- source_word: בְּלֹא צְדִיָּה
  choice: sem estar à espreita
  rationale: Preserva a imagem concreta de tocaia ou emboscada, sem ampliar o sentido para toda forma possível de premeditação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação inclusiva e natural para o caso jurídico. A ordem hebraica foi levemente ajustada para fluidez. Não se acrescentou nota a «de repente», pois a alternativa inglesa «sem inimizade» corresponde, na verdade, a בְּלֹא אֵיבָה, já traduzido explicitamente como «sem hostilidade».
