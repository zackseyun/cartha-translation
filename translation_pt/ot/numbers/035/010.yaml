base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: pt
  text: 'Fale aos filhos de Israel[a] e diga-lhes: “Quando vocês atravessarem o Jordão e entrarem na terra de Canaã,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos israelitas” ou “aos descendentes de Israel”. O hebraico diz literalmente “aos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel de דבר ordena que Moisés se dirija ao povo; “Fale” preserva a força direta do comando.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Reproduz de perto a expressão familiar masculina do hebraico, sem eliminar sua forma concreta; alternativas idiomáticas são registradas em nota.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: e diga-lhes
  rationale: Mantém os dois verbos da sequência hebraica e sua cadência, em português natural e digno.
- source_word: כִּי
  choice: Quando
  rationale: Neste contexto, introduz a circunstância futura em que a instrução deverá ser cumprida; o valor temporal é o mais natural.
- source_word: אַתֶּם עֹבְרִים
  choice: vocês atravessarem
  rationale: A construção participial aponta para uma ação futura iminente; após “quando”, o futuro do subjuntivo é a forma portuguesa idiomática.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma geográfica consagrada em português; “rio” está implícito e não ocorre explicitamente no texto hebraico.
- source_word: אַרְצָה כְּנָעַן
  choice: e entrarem na terra de Canaã
  rationale: O sufixo direcional indica movimento para dentro do território. A explicitação verbal “entrarem” comunica naturalmente em português o sentido direcional ligado à travessia.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” para a segunda pessoa plural e preserva a formulação solene da instrução divina sem arcaísmos desnecessários.
