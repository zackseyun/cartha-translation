  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: pt
  text: Não aceitem resgate[a] por aquele que fugiu para a sua cidade de refúgio[b], permitindo-lhe voltar a morar na terra antes da morte do sacerdote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “indenização” ou “pagamento compensatório”. O termo hebraico כֹּפֶר designa o valor de um resgate ou uma compensação aceita em lugar da consequência legal exigida.
    reason: lexical_alternative
  - marker: b
    text: A sintaxe hebraica é compacta e também pode ser entendida como uma proibição de aceitar pagamento relacionado à fuga para a cidade de refúgio, à permanência nela ou ao retorno dela antes da morte do sacerdote.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: resgate
  rationale: O termo designa um valor pago para livrar alguém da consequência legal exigida. “Resgate” é preciso neste contexto; “indenização” seria mais amplo, e “suborno” acrescentaria uma avaliação pejorativa que o termo hebraico não exige.
- source_word: לָנוּס
  choice: por aquele que fugiu
  rationale: O infinitivo de נוּס pode ser empregado de modo substantivado para indicar o fugitivo. No contexto das cidades de refúgio, a formulação descreve naturalmente a pessoa que já fugiu para lá, sem apagar a compactação sintática do hebraico.
- source_word: עִיר מִקְלָטוֹ
  choice: a sua cidade de refúgio
  rationale: “Cidade de refúgio” é a expressão jurídica natural em português, e “sua” preserva o sufixo possessivo hebraico.
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: voltar a morar na terra
  rationale: Os dois infinitivos exprimem retorno seguido de residência. “Voltar a morar” é corrente e preserva ambos os elementos.
- source_word: עַד מוֹת הַכֹּהֵן
  choice: antes da morte do sacerdote
  rationale: Literalmente, “até a morte do sacerdote”. Dentro da proibição, a expressão delimita o período em que o retorno não poderia ser obtido mediante pagamento; “antes da morte” comunica essa força temporal com clareza em português.
theological_decisions:
- issue: Alcance jurídico da proibição referente ao homicida e à cidade de refúgio
  choice: A tradução apresenta o pagamento como meio indevido de permitir o retorno à vida na terra antes da morte do sacerdote.
  alternative: A construção também pode ser entendida mais amplamente como proibição de pagamento relacionado à fuga para a cidade de refúgio, à permanência nela ou ao retorno dela.
  rationale: A sintaxe hebraica é compacta. A redação principal segue o fluxo jurídico do contexto — proibição de comprar um retorno antecipado —, enquanto a nota conserva a possibilidade de uma ligação sintática mais ampla sem impor uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O plural “aceitem” reproduz a segunda pessoa plural do hebraico de modo natural; “permitindo-lhe” explicita apenas a relação instrumental ou resultante exigida pelo contexto jurídico.
