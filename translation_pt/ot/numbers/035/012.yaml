  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: pt
  text: As cidades servirão para vocês de refúgio contra o vingador[a], para que quem matou alguém não morra antes de comparecer perante a comunidade para julgamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vingador do sangue” ou “parente vingador”. O hebraico go’el é um termo de parentesco usado aqui para aquele que vingaria o sangue derramado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: servirão
  rationale: O perfeito com waw em contexto de instrução legal tem valor futuro e prescritivo. “Servirão” expressa naturalmente essa função em português.
- source_word: הֶעָרִים
  choice: As cidades
  rationale: Retoma as cidades designadas no contexto imediato e mantém o sentido administrativo de עָרִים.
- source_word: לְמִקְלָט
  choice: de refúgio
  rationale: מִקְלָט designa um lugar de proteção. A construção “servirão ... de refúgio” é corrente e natural.
- source_word: מִגֹּאֵל
  choice: contra o vingador
  rationale: Neste contexto de homicídio, גֹאֵל é o parente encarregado de vingar o sangue derramado. A forma breve no texto mantém a legibilidade, e a nota preserva a dimensão familiar e jurídica do termo.
- source_word: וְלֹא יָמוּת
  choice: para que ... não morra
  rationale: A oração indica a finalidade ou o resultado da provisão de refúgio. A tradução conserva o verbo intransitivo e não explicita uma agência que o hebraico deixa implícita.
- source_word: הָרֹצֵחַ
  choice: quem matou alguém
  rationale: רֹצֵחַ pode designar a pessoa que causou uma morte sem antecipar se houve assassinato intencional. A formulação evita declarar culpabilidade antes do julgamento.
- source_word: עַד עָמְדוֹ
  choice: antes de comparecer
  rationale: Depois da negação, a expressão portuguesa “não morra antes de comparecer” comunica naturalmente o limite temporal expresso por עַד com o infinitivo construto.
- source_word: לִפְנֵי הָעֵדָה
  choice: perante a comunidade
  rationale: עֵדָה é a comunidade reunida, aqui no exercício de uma função judicial. “Perante” preserva o registro formal, e “comunidade” é claro e corrente.
- source_word: לַמִּשְׁפָּט
  choice: para julgamento
  rationale: מִשְׁפָּט refere-se aqui ao procedimento ou à decisão judicial. “Para julgamento” preserva a amplitude jurídica sem especificar além do texto.
theological_decisions:
- issue: Situação jurídica de הָרֹצֵחַ antes da decisão
  choice: quem matou alguém
  alternative: assassino; homicida
  rationale: O versículo adia o desfecho até a pessoa comparecer perante a comunidade para julgamento. A tradução não antecipa um veredito de culpa intencional.
- issue: Sentido específico de גֹאֵל na legislação sobre homicídio
  choice: vingador no texto, com nota explicativa
  alternative: vingador do sangue; parente vingador
  rationale: O termo hebraico tem associações mais amplas com deveres de parentesco e resgate, mas aqui designa a função de vingar o sangue derramado. A nota conserva essa nuance sem tornar o texto principal pesado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação jurídica permanece clara sem recorrer a tecnicismos nem antecipar a culpa de quem causou a morte.
