  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵ֣ת שְׁלֹ֣שׁ הֶ/עָרִ֗ים תִּתְּנוּ֙ מֵ/עֵ֣בֶר לַ/יַּרְדֵּ֔ן וְ/אֵת֙ שְׁלֹ֣שׁ הֶֽ/עָרִ֔ים תִּתְּנ֖וּ בְּ/אֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: pt
  text: Vocês designarão[a] três das cidades do outro lado do Jordão[b] e três das cidades na terra de Canaã. Elas serão cidades de refúgio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “darão”; o verbo hebraico significa literalmente “dar”, mas aqui tem o sentido de destinar ou separar as cidades para essa finalidade.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “além do Jordão” ou “na outra margem do Jordão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: designarão
  rationale: Embora נתן signifique literalmente “dar”, neste contexto jurídico-administrativo indica separar ou destinar cidades para uma função específica. “Designarão” comunica esse sentido com naturalidade e precisão.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: A expressão situa as cidades na região além do Jordão em relação ao ponto de referência do discurso, sem acrescentar uma orientação geográfica não explicitada no hebraico.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém o substantivo אֶרֶץ, “terra”, e a ênfase territorial da expressão hebraica.
- source_word: עָרֵי מִקְלָט
  choice: cidades de refúgio
  rationale: É a expressão portuguesa clara e tradicional para as cidades destinadas a proteger quem causasse uma morte sem intenção; evita associações políticas modernas de “asilo”.
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: três das cidades ... e três das cidades
  rationale: O artigo definido em הֶעָרִים aponta para cidades pertencentes ao conjunto já mencionado; “três das cidades” preserva essa definitude.
- source_word: תִּהְיֶינָה
  choice: Elas serão
  rationale: O imperfeito de היה expressa aqui o estado ou a função resultante das seis cidades designadas.
theological_decisions: []
