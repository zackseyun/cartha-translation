source:
  edition: WLC
  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: pt
  text: Não aceitem resgate pela vida de um assassino condenado à morte, pois ele certamente deve ser morto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “culpado para morrer” e “morrendo será morto”. A primeira expressão indica alguém judicialmente sujeito à pena de morte; a segunda é uma construção hebraica enfática que expressa certeza e obrigação.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: aceitem
  rationale: No contexto jurídico e em combinação com כֹּפֶר, o verbo significa receber ou aceitar um pagamento; “aceitem” é natural e preserva a força da proibição.
- source_word: כֹּפֶר
  choice: resgate
  rationale: Designa um pagamento destinado a afastar a pena ou obter libertação. “Resgate” mantém o caráter jurídico do pagamento, sem reduzi-lo a simples suborno ou indenização.
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: pela vida de um assassino
  rationale: נֶפֶשׁ pode indicar vida ou pessoa; aqui o pagamento visaria poupar a vida do homicida, sentido expresso com clareza sem abandonar a construção hebraica.
- source_word: רֹצֵחַ
  choice: assassino
  rationale: O capítulo distingue a morte acidental do homicídio culpável. Neste versículo, a responsabilidade que implica morte torna “assassino” mais preciso do que o termo amplo “homicida”.
- source_word: רָשָׁע לָמוּת
  choice: culpado e deve morrer
  rationale: A expressão hebraica, literalmente próxima de “culpado para morrer”, comunica responsabilidade judicial sujeita à morte. A formulação portuguesa preserva tanto a culpa quanto a obrigação penal.
- source_word: כִּי מוֹת יוּמָת
  choice: ele certamente será morto
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a declaração. “Certamente será morto” preserva a voz passiva e a ênfase da construção hebraica.
theological_decisions:
- issue: Força jurídica da sentença de morte
  choice: O texto proíbe que o pagamento substitua a pena de morte de um assassino judicialmente culpado.
  alternative: Entender o versículo apenas como descrição de um costume, sem força normativa rigorosa.
  rationale: A proibição לֹא תִקְחוּ e a construção enfática מוֹת יוּמָת apresentam uma ordem jurídica firme. A tradução conserva essa força com “Não aceitem” e “certamente será morto”.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla legibilidade brasileira. “Resgate” conserva a imagem jurídica do hebraico; a nota registra a forma literal e a ênfase sem sobrecarregar o texto principal.
