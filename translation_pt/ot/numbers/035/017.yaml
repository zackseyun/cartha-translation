    issue: «Homicida» é semanticamente demasiado amplo para רצח neste caso jurídico.
    rationale: Em português, «homicida» pode incluir mortes não intencionais; o contexto imediato contrasta o assassino com o causador de morte sem intenção.
  - severity: medium
    issue: «Certamente será morto» não exprime com clareza a obrigação legal de מות יומת.
    rationale: A fórmula de infinitivo absoluto mais verbo finito é uma determinação penal enfática, não só uma previsão.
  - severity: low
    issue: O pronome «ela» em «e ela morrer» pode retomar «pedra».
    rationale: A concordância feminina permite uma ambiguidade desnecessária em português, embora o sentido geral seja recuperável.
  revised_text: Ou, se alguém golpear outra pessoa com uma pedra segurada na mão[a], capaz de matar, e essa pessoa morrer, é assassino; o assassino deverá certamente ser morto.
