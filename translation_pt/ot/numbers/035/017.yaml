    text: Hebraico, literalmente, «com uma pedra de mão», isto é, uma pedra segurada na mão ou adequada para ser usada à mão como arma.
    reason: lexical_alternative
  revision_rationale: 'A revisão mantém o sentido e a ordem argumentativa do hebraico, torna inequívoca a referência à vítima e melhora a equivalência jurídica: «assassino» corresponde ao culpado classificado como רצח no contexto, e «deverá certamente ser morto» reproduz o peso prescritivo e enfático de מות יומת. A nota preserva a expressão hebraica literal e a incerteza sobre a designação exata da pedra.'
