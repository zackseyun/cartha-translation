- from: Ou, se alguém ferir outra pessoa com uma pedra na mão[a], capaz de causar a morte, e ela morrer, esse alguém é homicida; o homicida certamente será morto.
  to: Ou, se alguém golpear outra pessoa com uma pedra segurada na mão[a], capaz de matar, e essa pessoa morrer, é assassino; o assassino deverá certamente ser morto.
  rationale: 'A revisão mantém o sentido e a ordem argumentativa do hebraico, torna inequívoca a referência à vítima e melhora a equivalência jurídica: «assassino» corresponde ao culpado classificado como רצח no contexto, e «deverá certamente ser morto» reproduz o peso prescritivo e enfático de מות יומת. A nota preserva a expressão hebraica literal e a incerteza sobre a designação exata da pedra.'
