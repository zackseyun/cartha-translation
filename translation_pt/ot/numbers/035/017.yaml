  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: pt
  text: Ou, se alguém golpear outra pessoa com uma pedra segurada na mão[a], capaz de matar, e essa pessoa morrer, é assassino; o assassino deverá certamente ser morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, «com uma pedra de mão», isto é, uma pedra segurada na mão ou adequada para ser usada à mão como arma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ou, se
  rationale: Introduz mais um caso na sequência jurídica; «ou» expressa naturalmente em português a relação alternativa.
- source_word: בְּאֶבֶן יָד
  choice: com uma pedra na mão
  rationale: Preserva a imagem concreta do hebraico, literalmente «pedra de mão», sem definir além do texto o tamanho ou o uso exato da pedra.
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: capaz de causar a morte
  rationale: Expressa a capacidade letal da pedra em português corrente, sem limitar a formulação apenas à vítima específica.
- source_word: הִכָּהוּ
  choice: ferir outra pessoa
  rationale: נכה significa golpear ou ferir. A explicitação pronominal evita a sequência ambígua de masculinos em português, sem acrescentar uma categoria jurídica ausente neste ponto da frase.
- source_word: וַיָּמֹת
  choice: e ela morrer
  rationale: Mantém a sequência simples do hebraico e deixa o resultado fatal declarado separadamente do golpe.
- source_word: רֹצֵחַ הוּא
  choice: esse alguém é homicida
  rationale: Neste contexto legal, רֹצֵחַ designa o autor culpável de um homicídio. «Homicida» conserva o tom jurídico e evita que «assassino» antecipe nuances modernas mais estreitas.
- source_word: מוֹת יוּמַת
  choice: certamente será morto
  rationale: A construção intensiva hebraica, infinitivo absoluto mais verbo finito, exige a morte do culpado com ênfase; «certamente» preserva essa força sem especificar um procedimento de execução.
- source_word: הָרֹצֵחַ
  choice: o homicida
  rationale: Mantém a repetição jurídica enfática do substantivo presente no hebraico.
theological_decisions:
- issue: Classificação jurídica de רֹצֵחַ na legislação das cidades de refúgio
  choice: homicida
  alternative: assassino; aquele que matou
  rationale: O contexto distingue a morte culpável da morte acidental. «Homicida» comunica a classificação jurídica e moral sem reduzir o termo ao ato neutro de matar nem importar uma definição penal moderna específica.
- issue: Força da pena em מוֹת יוּמַת
  choice: certamente será morto
  alternative: deverá ser executado; será morto sem falta
  rationale: A tradução conserva a ênfase e a obrigação judicial da fórmula hebraica, mas não introduz detalhes sobre o agente ou o método da pena.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A formulação mantém o caráter casuístico da lei, a repetição enfática de «homicida» e a força da pena, evitando linguagem excessivamente arcaica.
