  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: pt
  text: Ou, se o ferir com um objeto de madeira empunhado[a], capaz de causar a morte, e ele morrer, é assassino; o assassino certamente será morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com um instrumento de madeira na mão” ou “com um objeto de madeira que tenha na mão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: com um objeto de madeira que tenha na mão
  rationale: כְּלִי é um termo amplo para objeto, utensílio ou instrumento; no contexto das armas letais dos versículos próximos, “objeto” preserva essa amplitude. יָד indica provavelmente algo empunhado ou segurado na mão, sem exigir que se especifique uma arma.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: capaz de causar a morte
  rationale: A oração caracteriza a capacidade letal do objeto, e não apenas o resultado deste caso. A formulação é natural em português e mantém a referência impessoal do hebraico.
- source_word: הִכָּהוּ
  choice: o ferir
  rationale: נכה significa golpear ou ferir. “Ferir” funciona naturalmente no período jurídico condicional e não antecipa a morte, declarada em seguida.
- source_word: וַיָּמֹת
  choice: e ele morrer
  rationale: Mantém a sequência simples do hebraico; em português, o futuro do subjuntivo é exigido pela construção condicional iniciada por “se”.
- source_word: רֹצֵחַ
  choice: assassino
  rationale: Neste estatuto, o termo classifica juridicamente quem pratica homicídio culpável, em contraste com a morte acidental tratada no contexto. “Assassino” comunica esse juízo melhor que o mais amplo “matador”.
- source_word: מוֹת יוּמַת
  choice: certamente será morto
  rationale: A combinação do infinitivo absoluto com a forma verbal passiva intensifica a sentença. “Certamente será morto” conserva tanto a passiva quanto a ênfase, sem substituir a expressão por um termo interpretativo como “executado”.
theological_decisions:
- issue: Classificação jurídica de רֹצֵחַ numa lei sobre homicídio
  choice: assassino
  alternative: homicida; matador
  rationale: O contexto distingue o homicídio culpável da morte acidental e prescreve a pena capital. “Assassino” expressa a condenação jurídico-moral do texto sem acrescentar uma definição doutrinária externa.
translation_notes:
  register: Português moderno, claro e digno, com formulação jurídica inteligível em âmbito internacional e leitura natural no Brasil. A nota preserva a concisão e a ambiguidade da expressão hebraica relativa à mão.
