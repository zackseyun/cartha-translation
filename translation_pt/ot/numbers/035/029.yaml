  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: pt
  text: Estas disposições serão para vocês uma norma jurídica[a], por todas as suas gerações, em todos os lugares onde morarem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um estatuto de julgamento” ou “um estatuto jurídico”. A expressão hebraica combina termos que designam uma norma estabelecida e o julgamento ou procedimento judicial.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em todas as suas habitações” ou “em todos os seus assentamentos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ אֵלֶּה
  choice: Estas disposições serão
  rationale: O demonstrativo plural retoma as normas anteriores. Explicitar “disposições” torna a referência natural em português, e o futuro preserva o valor prescritivo/resultativo da formulação legal.
- source_word: לָכֶם
  choice: para vocês
  rationale: Expressa referência e aplicação aos destinatários de modo claro e corrente.
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: um estatuto para decisões judiciais
  rationale: 'Preserva os dois componentes da expressão hebraica: uma norma estabelecida (חֻקָּה) e o âmbito de julgamento ou procedimento judicial (מִשְׁפָּט), sem reduzi-la apenas a justiça abstrata.'
- source_word: לְדֹרֹתֵיכֶם
  choice: por todas as suas gerações
  rationale: Comunica a vigência continuada da norma ao longo das gerações sucessivas.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: em todos os lugares onde vocês morarem
  rationale: Formulação natural que mantém a abrangência locativa de מוֹשָׁב; a alternativa mais formal “em todas as suas habitações” é registrada em nota.
