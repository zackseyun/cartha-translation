source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: pt
  text: Não contaminem a terra em que vocês vivem, pois o sangue contamina a terra, e não se pode fazer expiação pela terra por causa do sangue nela derramado, a não ser com o sangue daquele que o derramou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: contaminem / contamina
  rationale: Neste contexto, o verbo descreve a contaminação moral e sacral da terra pelo derramamento de sangue. “Contaminar” é natural em português, mantém a repetição hebraica e evita um sentido meramente ambiental.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se à terra habitada por Israel, não necessariamente ao planeta inteiro; “terra” preserva a dimensão territorial e teológica.
- source_word: כִּי הַדָּם הוּא
  choice: pois o sangue
  rationale: O pronome hebraico destaca o sangue como agente da contaminação. Em português, a construção simples é enfática o bastante sem acrescentar “ele próprio”, que poderia sobretraduzir.
- source_word: יְכֻפַּר
  choice: se pode fazer expiação
  rationale: O passivo de כפר indica a remoção da culpa de sangue que recai sobre a terra. “Fazer expiação” preserva o teor moral-sacral e permanece compreensível.
- source_word: וְלָאָרֶץ לֹא יְכֻפַּר לַדָּם
  choice: não se pode fazer expiação pela terra por causa do sangue
  rationale: A formulação mantém a terra como aquilo em favor do qual se faz expiação e expressa a relação entre essa necessidade e o sangue derramado.
- source_word: שֻׁפַּךְ
  choice: derramado
  rationale: “Sangue derramado” é a expressão jurídica e idiomática corrente em português.
- source_word: כִּי אִם
  choice: a não ser
  rationale: Introduz de modo natural o único meio ou exceção admitido pelo texto.
- source_word: בְּדַם שֹׁפְכוֹ
  choice: com o sangue daquele que o derramou
  rationale: Conserva a repetição de “sangue” e deixa claro que se trata do sangue do responsável pelo derramamento anterior.
theological_decisions:
- issue: Contaminação da terra pelo derramamento de sangue
  choice: Traduzir a linguagem como contaminação moral-sacral real da terra, cuja culpa só pode ser expiada com o sangue do responsável.
  alternative: Entender a expressão apenas como metáfora de desordem social ou somente como linguagem de justiça civil.
  rationale: A repetição de חנף, o emprego de כפר e a relação explícita entre sangue e terra apontam para culpa contaminadora e expiação, sem exigir a importação de categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural. A repetição de “terra” e “sangue” foi mantida por sua função retórica e jurídica. Não foram acrescentadas notas, pois as alternativas lexicais relevantes podem ser representadas adequadamente no texto principal.
