  text: then the congregation shall judge between the one who struck him and the avenger of blood, according to these ordinances.
translation:
  language: pt
  text: Então a comunidade julgará entre aquele que o feriu e o vingador do sangue[a], de acordo com estas normas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vingador de sangue”. A expressão hebraica designa a pessoa incumbida de vingar o sangue de um parente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estes julgamentos” ou “estas determinações”. O termo hebraico pode indicar normas jurídicas ou decisões judiciais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Então ... julgará
  rationale: O perfeito com waw, nesta sequência jurídica, tem valor procedimental futuro. “Então” torna clara a progressão, e “julgará” preserva a força judicial de שׁפט.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: עֵדָה designa aqui o corpo comunitário de Israel que exerce uma função judicial. “Comunidade” é atual e compreensível, sem restringir o referente a uma instituição posterior.
- source_word: בֵּין ... וּבֵין
  choice: entre ... e
  rationale: A construção portuguesa natural não precisa repetir a preposição, embora o hebraico a repita.
- source_word: הַמַּכֶּה
  choice: aquele que o feriu
  rationale: A expressão mantém o caráter participial e a neutralidade processual, sem declarar antecipadamente que se trata de um assassino. O objeto pronominal é recuperado naturalmente do contexto imediato.
- source_word: גֹּאֵל הַדָּם
  choice: o vingador do sangue
  rationale: Preserva a expressão jurídica hebraica e o papel específico da pessoa encarregada de vingar o sangue de um parente, sem acrescentar aqui um termo explícito para parentesco.
- source_word: עַל
  choice: de acordo com
  rationale: No contexto jurídico, indica conformidade com os padrões legais enunciados.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: estas normas
  rationale: מִשְׁפָּטִים pode designar regras, decisões ou ordenanças jurídicas. “Normas” comunica com clareza que elas regem o julgamento, sem sugerir apenas veredictos já emitidos.
theological_decisions:
- issue: Função judicial da comunidade em casos de homicídio
  choice: A comunidade julga entre a pessoa que desferiu o golpe e o vingador do sangue, mantendo a neutralidade processual.
  alternative: Tratar a comunidade como um tribunal institucional mais estreito ou chamar desde já a pessoa de “assassino”.
  rationale: O hebraico atribui à comunidade uma função judicial, mas neste versículo não identifica uma instituição posterior nem declara antecipadamente que o acusado cometeu assassinato.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário jurídico não técnico. “Comunidade” evita a conotação predominantemente eclesiástica que “congregação” pode ter no uso atual; “vingador do sangue” conserva deliberadamente o idioma jurídico do hebraico, esclarecido em nota.
