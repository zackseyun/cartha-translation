  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: pt
  text: Ordene aos filhos de Israel que deem aos levitas, da herança que possuem, cidades para morar; e vocês darão aos levitas as áreas de pastagem ao redor dessas cidades.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Áreas de pastagem” traduz um termo que designa as terras abertas ao redor de uma cidade, usadas especialmente para o pastoreio e outros usos comunitários.
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: Ordene
  rationale: O imperativo dirigido a Moisés tem força de ordem; “Ordene” a preserva em português natural e digno.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma literal e tradicional do hebraico, que designa coletivamente o povo da aliança.
- source_word: וְנָתְנוּ
  choice: que deem
  rationale: Após o imperativo, a forma verbal expressa o resultado ordenado; o subjuntivo é natural em português.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Equivalente direto do dativo de destinatário.
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: da herança que possuem
  rationale: Expressa em linguagem clara tanto a herança recebida quanto sua condição de propriedade, sem a rigidez de uma duplicação nominal.
- source_word: עָרִים לָשָׁבֶת
  choice: cidades para morar
  rationale: O infinitivo indica finalidade; esta formulação é corrente e facilmente compreensível.
- source_word: מִגְרָשׁ
  choice: áreas de pastagem
  rationale: No contexto, refere-se às terras abertas ligadas às cidades, utilizadas sobretudo para pastoreio e outros usos comunitários.
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: ao redor dessas cidades
  rationale: Torna claro que as áreas circundam as cidades anteriormente mencionadas.
- source_word: תִּתְּנוּ
  choice: vocês darão
  rationale: Preserva a mudança do verbo anterior na terceira pessoa do plural para a segunda pessoa do plural, dirigindo-se coletivamente aos israelitas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “filhos de Israel” preserva a transparência da expressão hebraica; a mudança de pessoa verbal entre “deem” e “vocês darão” foi mantida. O marcador de nota foi colocado após a expressão explicada.
