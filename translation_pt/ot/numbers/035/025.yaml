  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: pt
  text: Então a comunidade livrará aquele que matou das mãos do vingador do sangue[a] e o levará de volta à sua cidade de refúgio, para a qual havia fugido. Ele permanecerá nela[b] até a morte do sumo sacerdote, a quem se ungiu com o óleo santo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vingador de sangue”. A expressão hebraica designa a pessoa que tinha a responsabilidade reconhecida de vingar o derramamento de sangue, geralmente um parente próximo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “habitará nela” ou “residirá nela”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a quem ele ungiu com o óleo santo”. O verbo hebraico está na voz ativa, mas seu sujeito não é declarado explicitamente; muitas traduções vertem a expressão como “que tinha sido ungido”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: livrará
  rationale: O hifil de נצל indica tirar alguém do poder de outra pessoa. “Livrará” é natural em português e adequado ao contexto de proteção judicial.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: Em Números, o termo designa a coletividade de Israel, aqui no exercício de uma função judicial. “Comunidade” comunica esse sentido de modo atual e abrangente.
- source_word: הָרֹצֵחַ
  choice: aquele que matou
  rationale: Neste capítulo, o termo também pode designar quem causou uma morte sem intenção. Esta formulação evita atribuir antecipadamente a culpa implícita em “assassino”.
- source_word: מִיַּד
  choice: das mãos
  rationale: Preserva a imagem concreta do idioma hebraico, compreensível em português como libertação do poder de alguém.
- source_word: גֹּאֵל הַדָּם
  choice: vingador do sangue
  rationale: Designa a pessoa com a responsabilidade reconhecida de vingar a morte, geralmente um parente próximo. A expressão conserva o título jurídico do contexto sem acrescentar parentesco ao texto principal.
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: o levará de volta
  rationale: 'Expressa com naturalidade o sentido causativo de שוב: fazer alguém retornar.'
- source_word: עִיר מִקְלָטוֹ
  choice: sua cidade de refúgio
  rationale: “Cidade de refúgio” é a designação institucional clara e tradicional para o local de proteção previsto na legislação.
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: para a qual havia fugido
  rationale: Explicita com precisão o movimento em direção à cidade e emprega o mais-que-perfeito para situar a fuga antes do retorno ordenado.
- source_word: וְיָשַׁב בָּהּ
  choice: permanecerá nela
  rationale: ישב pode significar habitar, residir ou permanecer. No contexto, a ideia central é a permanência obrigatória na cidade até a morte do sumo sacerdote.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: até a morte do sumo sacerdote
  rationale: Reproduz de perto a construção nominal hebraica e mantém o título convencional.
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: a quem ele ungiu
  rationale: O hebraico apresenta verbo ativo na terceira pessoa masculina singular e objeto masculino, mas não declara o sujeito. A tradução conserva essa forma e sua ambiguidade, em vez de transformá-la silenciosamente em passiva.
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: com o óleo santo
  rationale: Mantém a referência definida ao óleo sagrado usado na consagração.
theological_decisions:
- issue: Condição jurídica de הָרֹצֵחַ na legislação das cidades de refúgio
  choice: “aquele que matou”
  alternative: “assassino” ou “homicida”
  rationale: O capítulo distingue o assassinato intencional da morte não intencional. “Aquele que matou” identifica o ato sem antecipar uma conclusão sobre intenção ou culpa.
- issue: Sujeito implícito de מָשַׁח אֹתוֹ
  choice: 'Manter a construção ativa: “a quem ele ungiu”'
  alternative: “que tinha sido ungido”
  rationale: O texto hebraico emprega uma forma ativa cujo sujeito não está expresso. A redação principal preserva essa tensão sintática, e a nota informa a alternativa passiva comum sem impô-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação jurídica evita arcaísmos e não atribui culpa intencional antes do julgamento. A construção incomum da oração final é mantida por fidelidade à ambiguidade sintática hebraica e esclarecida em nota.
