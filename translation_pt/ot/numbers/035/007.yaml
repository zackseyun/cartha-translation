  text: כָּל הֶ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אַרְבָּעִ֥ים וּ/שְׁמֹנֶ֖ה עִ֑יר אֶתְ/הֶ֖ן וְ/אֶת מִגְרְשֵׁי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/007.yaml
  text: All the cities that you give to the Levites shall be forty-eight cities[a], them and their pasturelands.
translation:
  language: pt
  text: Ao todo, vocês darão aos levitas quarenta e oito cidades, com suas pastagens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras comuns” ou “terrenos abertos”, referindo-se à área ao redor das cidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: O total das cidades
  rationale: Neste enunciado de soma, כָּל introduz o número total das cidades. A formulação evita a redundância menos natural de 'todas as cidades serão quarenta e oito cidades'.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: que vocês darão
  rationale: O imperfeito de נתן, no contexto da instrução legal, expressa a ação determinada de dar; 'vocês' representa de modo claro a segunda pessoa do plural.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Designa os integrantes da tribo de Levi, usando a forma portuguesa tradicional e amplamente compreendida.
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: quarenta e oito
  rationale: Reproduz de modo idiomático o numeral hebraico; 'cidades' já está expresso no início da oração.
- source_word: אֶתְהֶן
  choice: incluindo as cidades
  rationale: O marcador de objeto com pronome retoma enfaticamente as cidades contadas. A explicitação com 'incluindo' preserva essa retomada sem reproduzir uma construção hebraica pouco natural em português.
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: e suas pastagens
  rationale: מִגְרָשׁ designa a área aberta ao redor das cidades, usada especialmente para pastoreio; 'pastagens' comunica bem a função no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para a segunda pessoa do plural. A sintaxe foi ajustada para comunicar naturalmente o total de quarenta e oito cidades e, ao mesmo tempo, preservar a retomada enfática de אֶתְהֶן.
