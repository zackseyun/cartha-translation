  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: pt
  text: Mas, se alguém o ferir com um objeto de ferro e ele morrer[a], é assassino; o assassino certamente será morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com um utensílio de ferro” ou “com um instrumento de ferro”. O termo hebraico é amplo e não especifica por si só uma arma.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz um caso condicional em contraste ou progressão com a legislação anterior, de modo natural em português.
- source_word: בִּכְלִי בַרְזֶל
  choice: com um objeto de ferro
  rationale: כְּלִי é amplo e pode designar objeto, utensílio ou instrumento; “objeto” evita especificá-lo indevidamente como arma ou ferramenta.
- source_word: הִכָּהוּ
  choice: o ferir
  rationale: O hifil de נכה expressa golpear ou ferir; neste contexto jurídico, “ferir” comunica a ação violenta com clareza e dignidade.
- source_word: וַיָּמֹת
  choice: e ele morrer
  rationale: Preserva a sequência simples do hebraico sem explicitar uma relação causal além da indicada pelo contexto.
- source_word: רֹצֵחַ הוּא
  choice: esse alguém é assassino
  rationale: רצח aqui classifica juridicamente o autor de uma morte culpável; “assassino” distingue esse caso do homicídio não intencional tratado no capítulo.
- source_word: מוֹת יוּמַת
  choice: certamente será morto
  rationale: A construção com infinitivo absoluto intensifica a sentença; “certamente” conserva a ênfase, e a voz passiva reflete יוּמַת.
- source_word: הָרֹצֵחַ
  choice: o assassino
  rationale: A forma definida retoma de maneira enfática a classificação jurídica do autor.
theological_decisions:
- issue: Classificação jurídica de רֹצֵחַ neste versículo
  choice: assassino
  alternative: homicida
  rationale: Embora רצח possa ter alcance lexical mais amplo em alguns contextos, aqui a legislação distingue esta morte culpável dos casos acidentais. “Assassino” expressa essa classificação moral e jurídica sem acrescentar uma doutrina externa.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe jurídica compreensível ao leitor comum. O pronome indefinido “alguém” evita a ambiguidade referencial que surgiria com dois usos próximos de “ele”.
