base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: pt
  text: Estas seis cidades servirão de refúgio para os filhos de Israel[a], para o estrangeiro residente e para o morador que vivem entre eles[b], a fim de que qualquer pessoa que matar alguém sem intenção[c] possa fugir para lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas” ou “os descendentes de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Estrangeiro residente” e “morador” traduzem dois termos hebraicos distintos (גֵּר e תּוֹשָׁב) para pessoas não nativas que viviam no meio da sociedade israelita.
    reason: cultural_note
  - marker: c
    text: 'Ou: “involuntariamente” ou “por engano”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Preserva a forma da designação étnico- pactual hebraica, mantendo uma expressão bíblica clara e corrente em português.
- source_word: גֵּר
  choice: estrangeiro residente
  rationale: Expressa a condição de uma pessoa não nativa que reside sob a proteção da comunidade, sem recorrer ao termo potencialmente vago 'peregrino'.
- source_word: תּוֹשָׁב
  choice: morador
  rationale: Mantém este termo distinto de גֵּר e comunica de maneira acessível a ideia de alguém estabelecido na comunidade sem condição plena de nativo.
- source_word: בְּתוֹכָם
  choice: que vive entre eles
  rationale: Liga naturalmente o morador à sua presença no meio da comunidade israelita.
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: Estas seis cidades servirão de refúgio
  rationale: '''Servirão de refúgio'' comunica com naturalidade a designação legal e a função das cidades.'
- source_word: לָנוּס שָׁמָּה
  choice: possa fugir para lá
  rationale: Torna explícita, em português natural, a relação de finalidade indicada pelo infinitivo hebraico.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: qualquer pessoa que matar alguém
  rationale: Comunica claramente a morte de uma pessoa no contexto jurídico, evitando o arcaísmo de uma tradução nominal como 'homicida' ou 'matador'.
- source_word: בִּשְׁגָגָה
  choice: sem intenção
  rationale: Preserva a distinção jurídica central entre morte não intencional e homicídio deliberado, em linguagem corrente.
theological_decisions:
- issue: Designação pactual marcada por gênero em בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: Mantém no texto principal a forma masculina da designação nacional hebraica sem restringir indevidamente o alcance jurídico do versículo.
- issue: Relação entre גֵּר e תּוֹשָׁב
  choice: estrangeiro residente e morador
  alternative: estrangeiro e residente; peregrino e morador temporário
  rationale: Conserva dois termos distintos para categorias sobrepostas de não nativos na sociedade israelita, sem afirmar uma diferenciação mais precisa do que o texto permite.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém o tom jurídico sem rigidez excessiva e preserva a distinção lexical entre as duas categorias hebraicas de residentes não nativos.
