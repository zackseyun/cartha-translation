base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: pt
  text: E as áreas de pastagem das cidades que vocês derem aos levitas serão, desde o muro da cidade para fora, de mil côvados ao redor dela[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terrenos comuns” ou “áreas abertas”, referindo-se aos terrenos que rodeavam as cidades.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “desde o muro da cidade”; alguns entendem a expressão de maneira mais geral como “desde o limite da cidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: áreas de pastagem
  rationale: Neste contexto, מִגְרָשׁ designa os terrenos abertos ao redor das cidades levíticas, destinados ao uso comunitário e, conforme o contexto imediato, aos animais. “Áreas de pastagem” comunica naturalmente sua função sem excluir por nota as alternativas mais amplas.
- source_word: הֶעָרִים
  choice: das cidades
  rationale: עִיר pode indicar cidade ou povoado; “cidades” mantém a terminologia do contexto das cidades levíticas.
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: que vocês derem
  rationale: A construção relativa com נתן tem força futura e instrutiva. O futuro do subjuntivo é natural em português e preserva esse valor.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Identifica diretamente os destinatários das cidades e dos terrenos circundantes.
- source_word: מִקִּיר הָעִיר
  choice: desde o muro da cidade
  rationale: קִיר significa normalmente “muro”. “Desde” assinala com clareza o ponto inicial da medição; a possibilidade de referência mais geral ao limite urbano é preservada em nota.
- source_word: וָחוּצָה
  choice: para fora
  rationale: A forma expressa direção para o exterior; “para fora” é corrente e clara em português.
- source_word: אֶלֶף אַמָּה
  choice: mil côvados
  rationale: Preserva a unidade linear antiga e a quantidade específica do hebraico, sem conversão aproximativa.
- source_word: סָבִיב
  choice: ao redor dela
  rationale: Comunica que a medida se aplica ao redor de toda a cidade; o pronome explicita naturalmente em português o referente já presente no hebraico pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e conserva “côvados” como medida antiga. A ordem foi ajustada para evitar que “mil côvados” pareça predicativo das áreas, mantendo com clareza o ponto de partida, a direção e a extensão da medição.
