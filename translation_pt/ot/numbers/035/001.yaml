  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: pt
  text: 'Yahweh falou a Moisés nas planícies de Moabe, junto ao Jordão, em frente de Jericó, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O imperfeito consecutivo de דבר introduz um novo ato de fala na narrativa; “falou” reproduz naturalmente a fórmula e combina com לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֶל מֹשֶׁה
  choice: a Moisés
  rationale: Forma corrente e clara em português para indicar o destinatário da fala.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: עֲרָבוֹת designa planícies ou estepes; “planícies de Moabe” é geograficamente adequado e familiar em português bíblico.
- source_word: עַל יַרְדֵּן
  choice: junto ao Jordão
  rationale: Neste contexto geográfico, עַל indica proximidade; “junto ao Jordão” evita a leitura literal inadequada de posição sobre o rio.
- source_word: יְרֵחוֹ
  choice: na altura de Jericó
  rationale: A construção situa as planícies de Moabe junto ao Jordão, do lado correspondente a Jericó; a expressão portuguesa comunica essa relação geográfica sem sugerir que Moisés estivesse dentro da cidade.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz formalmente o conteúdo da fala divina, que prossegue nos versículos seguintes.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o nome próprio divino. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título ou empregar a forma híbrida tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada com leveza para soar natural, preservando a fórmula narrativa hebraica e a precisão geográfica.
