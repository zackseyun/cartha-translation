  text: וּ/מָצָ֤א אֹת/וֹ֙ גֹּאֵ֣ל הַ/דָּ֔ם מִ/ח֕וּץ לִ/גְב֖וּל עִ֣יר מִקְלָט֑/וֹ וְ/רָצַ֞ח גֹּאֵ֤ל הַ/דָּם֙ אֶת הָ֣/רֹצֵ֔חַ אֵ֥ין ל֖/וֹ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: pt
  text: Se o vingador do sangue o encontrar fora dos limites da sua cidade de refúgio e matar aquele que matou, não haverá culpa de sangue sobre o vingador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não há sangue para ele”, expressão que significa que ele não incorre em culpa de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: o vingador do sangue
  rationale: Expressão transparente e já reconhecível para o agente autorizado, neste contexto jurídico, a vingar a morte. Evita acrescentar explicitamente um vínculo de parentesco que não aparece na expressão deste versículo.
- source_word: מִחוּץ לִגְבוּל
  choice: fora dos limites
  rationale: Comunica com naturalidade tanto a localização espacial quanto a saída da área juridicamente protegida da cidade de refúgio.
- source_word: עִיר מִקְלָטוֹ
  choice: sua cidade de refúgio
  rationale: Preserva a designação institucional da legislação de Números em português corrente.
- source_word: וְרָצַח
  choice: matar
  rationale: Embora o verbo possa designar homicídio ilícito em outros contextos, aqui a cláusula final exclui a culpa de sangue do vingador; por isso, uma formulação que implique necessariamente assassinato seria enganosa.
- source_word: הָרֹצֵחַ
  choice: aquele que matou
  rationale: Identifica a pessoa que causou a morte sem afirmar, neste versículo, intenção criminosa; isso se ajusta ao contexto das cidades de refúgio e é mais claro que o potencialmente ambíguo 'homicida'.
- source_word: אֵין לוֹ דָּם
  choice: não haverá culpa de sangue sobre o vingador
  rationale: Explicita o referente mais provável do pronome e comunica o sentido jurídico do idioma hebraico, mantendo a imagem tradicional de 'culpa de sangue'.
theological_decisions:
- issue: Força moral e jurídica de רצח quando a morte é declarada isenta de culpa de sangue
  choice: Traduzir o verbo de modo neutro como 'matar'.
  alternative: Traduzir como 'assassinar' para manter uma associação lexical frequente de רצח com homicídio criminoso.
  rationale: A declaração final nega culpa de sangue ao vingador. 'Assassinar' classificaria antecipadamente o ato como criminoso e criaria uma tensão que o próprio texto hebraico não exige.
- issue: Referente de לוֹ na expressão אֵין לוֹ דָּם
  choice: Identificar o vingador do sangue como aquele sobre quem não recai culpa de sangue.
  alternative: Manter apenas o pronome 'ele', deixando o referente formalmente implícito.
  rationale: A sintaxe e a lógica jurídica do contexto apontam para o vingador como sujeito isento de culpa. Repetir o título evita que o leitor português associe o pronome ao objeto mais próximo, 'aquele que matou'.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A frase preserva a estrutura condicional implícita do hebraico por meio de “Se” e usa terminologia jurídica bíblica sem arcaísmo excessivo.
