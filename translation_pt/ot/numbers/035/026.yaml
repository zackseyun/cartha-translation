  text: וְ/אִם יָצֹ֥א יֵצֵ֖א הָ/רֹצֵ֑חַ אֶת גְּבוּל֙ עִ֣יר מִקְלָט֔/וֹ אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: pt
  text: Mas se aquele que matou de fato sair para além da fronteira da sua cidade de refúgio, para onde fugiu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sair para além da fronteira da sua cidade de refúgio, para onde fugiu”. O hebraico repete a ideia verbal (“sair, sair”) para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com as disposições legais anteriores; em português, “Mas, se” expressa naturalmente essa relação.
- source_word: יָצֹא יֵצֵא
  choice: de fato sair
  rationale: A construção com infinitivo absoluto e verbo finito intensifica a ação; “de fato sair” conserva a ênfase sem reproduzir artificialmente a forma hebraica.
- source_word: הָרֹצֵחַ
  choice: aquele que matou
  rationale: No contexto das cidades de refúgio, designa quem causou uma morte, sem classificá-lo necessariamente como assassino culpado. A formulação evita antecipar o julgamento jurídico.
- source_word: אֶת גְּבוּל
  choice: para além dos limites
  rationale: Com o verbo “sair”, indica a transposição da fronteira territorial da cidade; o plural “limites” é idiomático em português.
- source_word: עִיר מִקְלָטוֹ
  choice: sua cidade de refúgio
  rationale: Mantém o termo jurídico recorrente e representa o sufixo pronominal hebraico.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: para onde fugiu
  rationale: Preserva tanto a oração relativa quanto o sentido direcional de שָׁמָּה em português natural.
theological_decisions:
- issue: Classificação moral de הָרֹצֵחַ
  choice: aquele que matou
  alternative: o assassino
  rationale: O contexto legislativo distingue homicídio involuntário de assassinato deliberado. Traduzir aqui por “assassino” poderia atribuir culpa que o termo, neste ponto, não exige.
translation_notes:
  register: Português moderno, claro e digno, com terminologia jurídica bíblica acessível. A vírgula após a oração condicional e a oração relativa final favorecem a leitura; o versículo permanece sintaticamente aberto, como no contexto hebraico.
