  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: pt
  text: Ou, se por inimizade o feriu com a própria mão, e ele morreu,[a] aquele que o feriu certamente deverá ser morto; ele é um assassino. O vingador do sangue[b] matará o assassino quando o encontrar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ódio” ou “por hostilidade”, em vez de “por inimizade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o parente vingador do sangue”. O termo hebraico pode designar um parente com a responsabilidade de defender os direitos da família.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: por inimizade
  rationale: Expressa hostilidade ou ódio como motivação do ato e preserva o valor jurídico da intenção.
- source_word: הִכָּהוּ בְיָדוֹ
  choice: o feriu com a própria mão
  rationale: Mantém explicitamente o meio corporal do ataque; 'própria' torna a expressão natural em português sem alterar o sentido.
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Reproduz a sequência simples do hebraico sem explicitar além do texto a relação causal já evidente.
- source_word: מוֹת יוּמַת
  choice: certamente deverá ser morto
  rationale: A combinação do infinitivo absoluto com o verbo passivo intensifica a sentença; esta formulação conserva tanto a ênfase quanto a força legal.
- source_word: הַמַּכֶּה
  choice: aquele que o feriu
  rationale: Retoma o agressor de modo claro e natural, sem recorrer a um substantivo português excessivamente técnico.
- source_word: רֹצֵחַ הוּא
  choice: ele é assassino
  rationale: O contexto de inimizade indica homicídio intencional, não morte acidental; 'assassino' comunica essa culpabilidade.
- source_word: גֹּאֵל הַדָּם
  choice: o vingador do sangue
  rationale: Preserva a designação jurídica tradicional e a imagem formal do hebraico, deixando a dimensão de parentesco para nota.
- source_word: יָמִית
  choice: matará
  rationale: Traduz diretamente o causativo 'fará morrer'. No segundo enunciado, 'matará' é natural e evita uma repetição pesada, sem retirar seu caráter legal.
- source_word: בְּפִגְעוֹ בוֹ
  choice: quando o encontrar
  rationale: Expressa de maneira corrente o encontro com o assassino, preservando o valor temporal da construção.
theological_decisions:
- issue: Categoria jurídica do homicídio intencional
  choice: assassino
  alternative: homicida
  rationale: A inimizade caracteriza intenção hostil; 'assassino' distingue este caso da morte não intencional tratada no capítulo. 'Homicida' poderia ser mais amplo ou técnico.
- issue: Sentido institucional de גֹּאֵל הַדָּם
  choice: vingador do sangue
  alternative: parente vingador do sangue
  rationale: A formulação principal preserva o título jurídico tal como aparece, sem inserir no texto a relação familiar implícita em גֹּאֵל; a nota registra essa nuance.
translation_notes:
  register: Português moderno, claro e digno, com registro jurídico acessível. A ordem e a repetição do hebraico foram preservadas onde naturais; a ambiguidade lexical de בְּאֵיבָה e a dimensão familiar de גֹּאֵל foram registradas em notas.
