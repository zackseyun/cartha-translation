  rationale: A revisão resolve a elipse portuguesa inadequada em “tiver muitas/poucas” por meio de uma explicitação contextual mínima (“tribos maiores/menores”), preservando a formulação literal em nota. Também reorganiza a segunda frase para melhorar a fluência, sem nivelar a alternância singular/plural do hebraico, que permanece explicada na nota.
