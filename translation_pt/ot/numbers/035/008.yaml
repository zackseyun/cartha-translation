review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a obrigação de ceder cidades aos levitas em proporção às heranças. No entanto, “da tribo que tiver muitas” deixa sem referente o adjetivo “muitas” e pode sugerir, circularmente, muitas cidades. O hebraico emprega elipses (“do muito... do pouco”) que, no contexto, se referem à escala das tribos/heranças; uma explicitação moderada é preferível. A alternância hebraica entre o singular distributivo (אִישׁ; “sua herança”; “dará”) e o verbo plural (“receberem por herança”) deve continuar assinalada em nota.
  naturalness: “Das tribos maiores... das menores” é claro e natural em português moderno. “Em proporção à herança que receberem” preserva o singular distributivo e o plural coletivo do hebraico com leitura mais fluente do que a justaposição “Cada tribo, conforme a herança que as tribos receberem”.
  terminology: “Cidades”, “propriedade”, “filhos de Israel” e “levitas” são adequados. “Tribos maiores/menores” é uma explicitação contextual controlada, devidamente qualificada pela nota literal.
  issues:
  - severity: medium
    issue: “da tribo que tiver muitas ... e da que tiver poucas”
    rationale: O texto não explicita o substantivo a que “muitas/poucas” se refere. Isso produz uma formulação incompleta e pode fazer o leitor entendê-la como referência à quantidade de cidades, quando o ponto da instrução é a contribuição proporcional das tribos conforme suas heranças.
  - severity: low
    issue: “Cada tribo, conforme a herança que as tribos receberem”
    rationale: A repetição imediata de “tribo/tribos” e a mudança de singular para plural tornam a frase pesada. A alternância existe no hebraico, mas pode ser expressa mais naturalmente sem suprimi-la, com explicação em nota.
