base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: pt
  text: Quanto às cidades que vocês derem da propriedade dos filhos de Israel, das tribos maiores vocês darão mais, e das menores darão menos.[a] Cada tribo dará algumas de suas cidades aos levitas, em proporção à herança que receberem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “do muito vocês aumentarão, e do pouco diminuirão”. No contexto, o sentido é que as tribos com heranças maiores forneceriam mais cidades, e as com heranças menores, menos.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico combina o distributivo singular “cada um”, “sua herança” e “dará” com o verbo plural “receberem por herança”, referindo-se coletivamente às tribos de Israel.
    reason: source_ambiguity
lexical_decisions:
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עִיר designa uma cidade ou povoação; “cidades” mantém a terminologia corrente deste capítulo sobre as cidades levíticas.
- source_word: תִּתְּנוּ
  choice: vocês derem
  rationale: O imperfeito qal de נתן aparece numa oração relativa dentro da instrução legal; o futuro do subjuntivo é natural em português após “que” e conserva a referência prospectiva.
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: da propriedade dos filhos de Israel
  rationale: אֲחֻזָּה é uma propriedade territorial ou porção possuída. “Filhos de Israel” preserva a expressão hebraica formalmente masculina que designa coletivamente o povo da aliança.
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: da tribo que tiver muitas vocês darão mais, e da que tiver poucas darão menos
  rationale: O hebraico diz literalmente “do muito, aumentareis; e do pouco, diminuireis”. O contexto indica uma distribuição proporcional segundo o número de cidades de cada herança tribal; “tribo” explicita o referente elíptico, e a nota preserva a forma literal.
- source_word: אִישׁ
  choice: Cada tribo
  rationale: אִישׁ tem força distributiva, “cada um”. Neste contexto, quem contribui com cidades é cada grupo tribal; a explicitação também permite representar com clareza o verbo plural subsequente.
- source_word: כְּפִי נַחֲלָתוֹ אֲשֶׁר יִנְחָלוּ
  choice: conforme a herança que as tribos receberem
  rationale: כְּפִי expressa proporção ou conformidade. O sufixo de “sua herança” é singular, mas יִנְחָלוּ é plural; a tradução torna explícito o referente coletivo do plural sem ocultar a tensão gramatical, registrada em nota.
- source_word: יִתֵּן מֵעָרָיו
  choice: dará algumas de suas cidades
  rationale: O singular concorda com o distributivo אִישׁ. “Algumas de suas cidades” exprime naturalmente o sentido partitivo da preposição מִן.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: É a designação usual e inequívoca do grupo que receberá as cidades.
