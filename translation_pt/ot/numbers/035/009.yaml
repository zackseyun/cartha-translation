base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/009.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: pt
  text: 'E Yahweh falou a Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Registra a forma hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: falou
  rationale: O verbo wayyiqtol de דבר introduz uma nova etapa narrativa e integra a fórmula habitual de comunicação divina. “Falou” é natural em português e mantém a distinção em relação a לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo pelo título tradicional “SENHOR”.
- source_word: אֶל
  choice: a
  rationale: A preposição marca o destinatário da fala; “a” é a forma idiomática em português na construção “falou a Moisés”.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Nesta fórmula introdutória, o infinitivo hebraico anuncia o discurso que vem em seguida. Em português atual, os dois-pontos comunicam essa função com mais naturalidade do que o decalque “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título; a nota registra a tradução tradicional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação inicial com “E” acompanha o avanço narrativo hebraico. Os dois-pontos reproduzem naturalmente a função introdutória de לֵאמֹר, visto que o conteúdo da fala começa no versículo seguinte.
