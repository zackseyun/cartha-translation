base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: pt
  text: As cidades lhes servirão de moradia, e as áreas abertas ao redor delas[a] servirão para os seus animais domésticos, para os seus bens e para todos os seus animais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as pastagens ao redor delas”. O termo hebraico indica as áreas abertas em torno das cidades, usadas aqui especialmente para os animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עִיר designa uma cidade ou povoação; “cidades” é a forma consagrada e adequada ao contexto legal da distribuição das cidades levíticas.
- source_word: לָשָׁבֶת
  choice: lhes servirão de moradia
  rationale: O infinitivo de ישׁב expressa a finalidade de habitar. A formulação comunica isso de maneira natural em português, sem o arcaísmo de “habitar nelas”.
- source_word: מִגְרְשֵׁיהֶם
  choice: as áreas abertas ao redor delas
  rationale: מִגְרָשׁ refere-se ao terreno não edificado que circundava cada cidade e era destinado, entre outros usos, aos animais. “Áreas abertas ao redor delas” preserva melhor a extensão do termo do que restringi-lo apenas a pastagens.
- source_word: לִבְהֶמְתָּם
  choice: para o seu gado
  rationale: בְּהֵמָה designa coletivamente os animais domésticos; “gado” é claro e idiomático neste contexto de uso da terra.
- source_word: לִרְכֻשָׁם
  choice: para os seus bens
  rationale: רְכוּשׁ abrange bens, posses ou propriedade. “Bens” mantém o sentido coletivo e combina com o tom administrativo do texto.
- source_word: וּלְכֹל חַיָּתָם
  choice: e para todos os seus animais
  rationale: חַיָּה pode denotar um ser vivo ou, mais especificamente, um animal. No contexto, “animais” é a leitura mais natural, embora a amplitude lexical seja registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e ampla legibilidade brasileira. A tradução evita “terras comuns”, expressão pouco transparente, e explica em nota a função e a extensão das áreas ao redor das cidades.
