  source_fidelity: 'A tradução reproduz adequadamente a estrutura e o sentido geral do hebraico: as cidades destinam-se à habitação, e os terrenos abertos que as circundam destinam-se aos animais e bens dos levitas. Contudo, “gado” pode ser entendido mais restritivamente como bovinos, ao passo que בְּהֵמָה designa coletivamente os animais domésticos.'
  naturalness: O português é claro, moderno e adequado ao registro administrativo do texto. “Áreas abertas ao redor delas” é uma boa solução explicativa para מִגְרְשֵׁיהֶם, e a nota conserva a alternativa mais funcional de “pastagens”.
  terminology: “Cidades”, “moradia”, “áreas abertas”, “bens” e “animais” são escolhas adequadas. Convém substituir “gado” por “animais domésticos” para não estreitar o alcance de בְּהֵמָה. A nota b não é uma alternativa idiomática nem suficientemente precisa para חַיָּה neste contexto; “seres vivos” pode incluir pessoas e não melhora a tradução.
