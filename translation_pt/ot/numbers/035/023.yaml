base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: pt
  text: ou com qualquer pedra capaz de causar a morte, sem ver[a], deixou-a cair sobre ele, e ele morreu, embora não fosse seu inimigo nem procurasse fazer-lhe mal—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sem ver”. O hebraico não explicita o objeto de “ver”; a expressão indica falta de percepção ou conhecimento no momento do ato, sem especificar seu alcance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: ou
  rationale: Dá continuidade às alternativas do caso legal no versículo anterior.
- source_word: בְּכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: com qualquer pedra capaz de causar a morte
  rationale: בְּ tem valor instrumental, e a oração relativa descreve uma pedra com potencial letal. A formulação é natural em português e não precisa explicitar um sujeito genérico ausente do hebraico.
- source_word: בְּלֹא רְאוֹת
  choice: sem vê-lo
  rationale: Preserva a imagem concreta de 'ver', evitando substituir no texto a expressão hebraica por uma interpretação abstrata como 'sem intenção'. O objeto masculino é naturalmente entendido como a vítima no contexto.
- source_word: וַיַּפֵּל עָלָיו
  choice: deixou-a cair sobre ele
  rationale: 'O hifil de נפל é causativo: o agente fez a pedra cair. O pronome feminino retoma ''pedra'' com clareza.'
- source_word: וַיָּמֹת
  choice: e ele morreu
  rationale: Mantém a coordenação narrativa do hebraico e expressa diretamente o resultado fatal.
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: embora não fosse seu inimigo
  rationale: A construção tem força circunstancial e concessiva, esclarecendo a ausência de hostilidade anterior.
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: nem procurasse fazer-lhe mal
  rationale: רָעָה indica aqui dano contra a vítima; esta expressão portuguesa comunica naturalmente a ausência de intenção nociva.
