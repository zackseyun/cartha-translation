base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: pt
  text: 'Meçam, fora da cidade, o lado leste: dois mil côvados; o lado sul: dois mil côvados; o lado oeste[a]: dois mil côvados; e o lado norte: dois mil côvados, ficando a cidade no meio. Essa área será destinada a eles como os terrenos de pastagem[b] das cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “mar”, uma forma comum de indicar o oeste por ser a direção do mar Mediterrâneo.
    reason: lexical_alternative
  - marker: b
    text: Ou “terrenos comuns” ou “espaços abertos”; o termo hebraico se refere às terras ao redor de uma cidade, muitas vezes usadas para pastagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם
  choice: Meçam
  rationale: O perfeito com waw tem força instrutiva neste contexto legal. O imperativo em português comunica a ordem com naturalidade e preserva a ação concreta de medir.
- source_word: מִחוּץ לָעִיר
  choice: do lado de fora da cidade
  rationale: Indica que a medição deve ser feita além dos limites da cidade; esta formulação é clara e idiomática.
- source_word: פְּאַת
  choice: lado
  rationale: No contexto de demarcação, designa cada lado orientado segundo os pontos cardeais, e não necessariamente um canto.
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: leste / sul / oeste / norte
  rationale: Os termos funcionam aqui como indicações dos quatro pontos cardeais. יָם, literalmente “mar”, é o modo idiomático hebraico de indicar o oeste.
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: dois mil côvados
  rationale: Mantém a unidade de medida antiga e a quantidade explícita do texto hebraico, sem introduzir uma conversão moderna aproximativa.
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: ficando a cidade no meio
  rationale: Expressa de maneira natural a disposição espacial indicada no hebraico.
- source_word: זֶה יִהְיֶה לָהֶם
  choice: Essa área será destinada a eles
  rationale: O demonstrativo retoma a área recém-delimitada, e היה ל־ expressa aqui sua designação para uso deles sem exigir uma afirmação mais específica sobre propriedade.
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: os terrenos de pastagem das cidades
  rationale: מִגְרָשׁ designa o espaço aberto ao redor de uma cidade, frequentemente usado para pastagem. “Terrenos de pastagem” comunica o uso principal sem ocultar a amplitude lexical, registrada em nota.
