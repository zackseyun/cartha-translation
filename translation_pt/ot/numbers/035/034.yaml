  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: pt
  text: E não contaminem a terra em que vocês habitam, no meio da qual eu habito, pois eu, Yahweh, habito no meio dos filhos de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְטַמֵּא
  choice: contaminem
  rationale: No piel, טמא significa tornar impuro, profanar ou contaminar. “Contaminar” é claro em português moderno e, no contexto do sangue derramado, preserva a força moral e cultual sem restringir o sentido à poluição ambiental.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Aqui אֶרֶץ designa especificamente a terra habitada por Israel, e não o planeta inteiro.
- source_word: יֹשְׁבִים בָּהּ
  choice: em que vocês habitam
  rationale: ישב expressa residência ou habitação; a formulação mantém a relação explícita com “a terra” e é natural em português.
- source_word: שֹׁכֵן
  choice: habito
  rationale: שכן indica habitar ou residir e, aplicado a Deus, carrega a ideia de sua presença entre o povo. A repetição de “habito” reproduz a repetição hebraica.
- source_word: בְּתוֹכָהּ
  choice: no meio da qual
  rationale: תוך indica interioridade ou presença no meio de algo; esta formulação conserva o forte sentido espacial e a correspondência com a frase seguinte.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a razão da proibição; “pois” comunica de modo conciso essa função explicativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: no meio dos filhos de Israel
  rationale: A tradução mantém tanto o sentido espacial de בְּתוֹךְ quanto a forma masculina e genealógica de בְּנֵי יִשְׂרָאֵל, que designa coletivamente o povo da aliança.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Expressão masculina coletiva בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: “Filhos de Israel” representa de perto a expressão hebraica tradicional, aqui usada coletivamente para o povo, sem inserir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A repetição de “habitam/habito” foi mantida para refletir o jogo verbal e a ênfase da fonte hebraica. Não há marcadores de nota porque nenhuma nota é necessária para esta redação.
