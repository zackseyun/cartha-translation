source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: pt
  text: 'Todo aquele que matar uma pessoa: o homicida será executado com base no depoimento de testemunhas[a]; mas uma só testemunha não poderá depor contra alguém para que seja morto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela boca de testemunhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: aquele que matar uma pessoa
  rationale: No contexto jurídico, a expressão designa quem desfere um golpe mortal. “Matar uma pessoa” comunica com clareza o resultado do ato, sem interpretar נֶפֶשׁ como uma “alma” separada do ser humano.
- source_word: לְפִי עֵדִים
  choice: com base no depoimento de testemunhas
  rationale: A expressão idiomática, literalmente “pela boca de testemunhas”, indica a base probatória da sentença e é vertida em linguagem jurídica portuguesa natural.
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: será condenado à morte
  rationale: O hebraico emprega a raiz רצח tanto para o homicida quanto para sua morte judicial. Uma reprodução mecânica sugeriria assassinato ilícito por parte do tribunal; a formulação escolhida expressa a pena capital no contexto judicial.
- source_word: וְעֵד אֶחָד
  choice: mas uma só testemunha
  rationale: 'O waw tem valor contrastivo no contexto: várias testemunhas fornecem base suficiente, enquanto uma única testemunha não basta.'
- source_word: לֹא יַעֲנֶה
  choice: não poderá depor
  rationale: ענה, neste contexto forense, significa prestar depoimento ou testemunhar. O modal “poderá” expressa a vedação jurídica.
- source_word: בְנֶפֶשׁ לָמוּת
  choice: contra alguém para que seja morto
  rationale: A expressão hebraica condensada relaciona o depoimento contra a pessoa à consequência capital, preservando a direção ou o resultado sem acrescentar detalhes processuais.
theological_decisions:
- issue: Natureza da morte ordenada no texto
  choice: Linguagem de condenação judicial à morte
  alternative: Reproduzir literalmente a raiz רצח como “matar/assassinar o assassino”
  rationale: O contexto é uma norma judicial sobre prova e pena capital. A tradução evita atribuir ao tribunal um assassinato ilícito, sem atenuar a sanção prevista.
- issue: Força da expressão final לָמוּת
  choice: “para que seja morto”
  alternative: “num processo de pena capital” ou “para a morte”
  rationale: A escolha conserva a relação explícita com a morte e a ambiguidade entre finalidade e resultado, sem importar terminologia processual ausente do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com tom jurídico acessível. “Uma só testemunha” ressalta naturalmente a insuficiência probatória. O marcador [a] está ligado à expressão idiomática correspondente, e não ao primeiro sintagma do versículo.
