id: NUM.35.11
reference: Numbers 35:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִקְרִיתֶ֤ם לָ/כֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָ/כֶ֑ם וְ/נָ֥ס שָׁ֨מָּ/ה֙ רֹצֵ֔חַ מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: pt
  text: Então designarão[a] para vocês cidades; elas serão para vocês cidades de refúgio, e para lá fugirá o homicida que matar uma pessoa sem intenção.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escolherão” ou “separarão”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “o homicida que golpear uma pessoa sem intenção”; isto é, alguém que causou uma morte não intencional, não um assassino que matou deliberadamente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: designarão
  rationale: O hifil de קרה, neste contexto jurídico, indica fazer com que certas cidades sejam escolhidas ou destinadas a uma função específica. “Designarão” é claro, atual e preserva o tom institucional.
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: cidades ... cidades de refúgio
  rationale: Mantém a repetição hebraica para dar clareza jurídica e traduz מִקְלָט como um lugar protegido para onde alguém pode fugir.
- source_word: וְנָס שָׁמָּה
  choice: para lá fugirá
  rationale: Conserva o valor futuro da sequência verbal e antepõe naturalmente o destino em português.
- source_word: רֹצֵחַ
  choice: homicida
  rationale: “Homicida” pode designar quem causa a morte de outra pessoa sem necessariamente afirmar premeditação; evita “assassino”, que normalmente implica intenção criminosa.
- source_word: מַכֵּה נֶפֶשׁ
  choice: que matar uma pessoa
  rationale: Embora a expressão seja literalmente próxima de “que golpear uma pessoa”, neste contexto ela descreve um golpe que causa morte. “Matar uma pessoa” comunica diretamente o efeito jurídico em português.
- source_word: בִּשְׁגָגָה
  choice: sem intenção
  rationale: Expressa de modo natural a ausência de intenção, central para a distinção jurídica do versículo, sem restringir o sentido a um simples engano.
theological_decisions:
- issue: Classificação jurídica daquele que causou a morte
  choice: o homicida que matar uma pessoa sem intenção
  alternative: o assassino que matar uma pessoa por engano
  rationale: A qualificação בִּשְׁגָגָה exclui aqui o homicídio deliberado. “Homicida” conserva a condição objetiva de quem causou a morte, enquanto “sem intenção” preserva a distinção estabelecida pelo texto sem antecipar uma avaliação judicial além dela.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura repetitiva “cidades ... cidades de refúgio” foi mantida por sua função jurídica e retórica.
