  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: pt
  text: E as cidades que vocês derem aos levitas serão as seis cidades de refúgio, que vocês lhes darão para que aquele que matou alguém[a] fuja para lá; além delas, vocês darão quarenta e duas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que tirou uma vida”. O termo hebraico é usado aqui no contexto jurídico das cidades de refúgio e, por si só, não especifica se a morte foi intencional ou acidental.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עִיר pode designar cidade ou povoado; “cidades” é a forma consagrada e adequada neste contexto de distribuição territorial.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Expressa diretamente os destinatários das cidades.
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: as seis cidades de refúgio
  rationale: מִקְלָט indica refúgio ou asilo; “cidades de refúgio” é expressão clara e estabelecida em português para essa instituição jurídica.
- source_word: לָנוּס שָׁמָּה
  choice: fuja para lá
  rationale: Preserva o sentido de נוּס, “fugir”, e a direção expressa por שָׁמָּה, “para lá”.
- source_word: הָרֹצֵחַ
  choice: aquele que matou alguém
  rationale: No contexto jurídico das cidades de refúgio, o particípio designa quem tirou uma vida sem, por si só, definir se o ato foi intencional ou acidental. A formulação evita atribuir de antemão intenção homicida.
- source_word: וַעֲלֵיהֶם
  choice: além delas
  rationale: Neste uso idiomático, על indica acréscimo; a expressão comunica com clareza que outras cidades se somam às seis.
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: quarenta e duas cidades
  rationale: Embora o hebraico use o substantivo no singular após o numeral, o português idiomático exige o plural.
theological_decisions:
- issue: Intencionalidade atribuída a הָרֹצֵחַ
  choice: aquele que matou alguém
  alternative: o homicida
  rationale: “Homicida” pode sugerir culpa ou intenção criminosa no português corrente. O hebraico, neste ponto, identifica quem matou, deixando que o contexto jurídico subsequente determine se houve intenção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural dirigida à comunidade. A sintaxe acompanha de perto a progressão hebraica, mas evita construções excessivamente rígidas. O marcador [a] aparece imediatamente após a expressão que esclarece.
