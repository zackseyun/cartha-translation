source:
  edition: WLC
  text: כִּ֣י בְ/עִ֤יר מִקְלָט/וֹ֙ יֵשֵׁ֔ב עַד מ֖וֹת הַ/כֹּהֵ֣ן הַ/גָּדֹ֑ל וְ/אַחֲרֵ֥י מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל יָשׁוּב֙ הָ/רֹצֵ֔חַ אֶל אֶ֖רֶץ אֲחֻזָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: pt
  text: Pois ele deverá permanecer em sua cidade de refúgio até a morte do sumo sacerdote; depois da morte do sumo sacerdote, aquele que matou[a] poderá voltar à terra de sua propriedade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o homicida”. O termo hebraico é uma categoria jurídica nas leis sobre as cidades de refúgio e não deve ser entendido automaticamente como “assassino”.
    reason: lexical_alternative
  - marker: b
    text: Ou “à sua própria propriedade de terra” ou “à terra de sua posse”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a justificativa da consequência legal anterior e funciona naturalmente no início da frase.
- source_word: בְעִיר מִקְלָטוֹ
  choice: em sua cidade de refúgio
  rationale: Preserva a referência possessiva e emprega a expressão jurídica consagrada para מִקְלָט.
- source_word: יֵשֵׁב
  choice: deverá permanecer
  rationale: No contexto legal, o verbo expressa residência obrigatória e continuada, não apenas o ato neutro de morar.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: até a morte do sumo sacerdote
  rationale: Mantém a construção nominal hebraica e traduz adequadamente o título oficial.
- source_word: וְאַחֲרֵי מוֹת
  choice: depois da morte de
  rationale: Conserva a sequência temporal e a repetição deliberada da formulação legal.
- source_word: הָרֹצֵחַ
  choice: aquele que matou
  rationale: Expressão natural em português que designa quem causou a morte sem classificá-lo automaticamente como assassino, preservando a categoria jurídica do contexto.
- source_word: יָשׁוּב
  choice: poderá voltar
  rationale: Comunica a restauração da permissão legal após o período de restrição, em vez de sugerir mera previsão ou ordem.
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: à terra de sua propriedade
  rationale: Preserva o sentido fundiário e jurídico de אֲחֻזָּה sem introduzir a conotação teológica possivelmente excessiva de 'herança'.
theological_decisions:
- issue: Se הָרֹצֵחַ deve ser traduzido como “assassino” ou por uma designação juridicamente menos determinada
  choice: aquele que matou
  alternative: o homicida; o assassino
  rationale: As leis das cidades de refúgio distinguem assassinato intencional de outras formas de causar a morte. “Aquele que matou” preserva a categoria jurídica sem antecipar um veredito moral que este versículo não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter jurídico do texto e a repetição de “morte do sumo sacerdote”. Os marcadores foram posicionados junto aos termos que explicam.
