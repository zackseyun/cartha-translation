base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: pt
  text: Mas, se alguém empurrar outra pessoa por ódio, ou lançar alguma coisa contra ela de propósito[a], e ela morrer,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com malícia” ou “enquanto estava à espreita”; o termo hebraico indica intenção hostil deliberada e pode incluir a ideia de emboscada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma hipótese que contrasta com o caso acidental anterior; em português, “Mas, se” expressa naturalmente essa força adversativa.
- source_word: בְּשִׂנְאָה
  choice: por ódio
  rationale: Expressa com clareza o motivo hostil indicado pela preposição e pelo substantivo hebraico.
- source_word: יֶהְדָּפֶנּוּ
  choice: empurrar outra pessoa
  rationale: O verbo denota empurrar ou impelir. A formulação evita pronomes de gênero ambíguos e mantém o sentido jurídico geral.
- source_word: אוֹ
  choice: ou
  rationale: Mantém a disjunção simples entre as duas ações previstas.
- source_word: הִשְׁלִיךְ עָלָיו
  choice: lançar alguma coisa contra ela
  rationale: O objeto está implícito no hebraico e é explicitado de modo indefinido para produzir português natural; “contra” preserva a direção hostil da ação.
- source_word: בִּצְדִיָּה
  choice: de propósito
  rationale: Comunica em linguagem corrente o núcleo de intencionalidade deliberada, sem apagar em nota a possível nuance de emboscada ou intenção maliciosa.
- source_word: וַיָּמֹת
  choice: e ela morrer
  rationale: Reproduz de forma direta a consequência narrativa do hebraico e mantém a oração aberta para a continuação da sentença legal no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A construção impessoal com “alguém” e “outra pessoa” evita confusão entre os referentes masculinos do hebraico sem alterar o conteúdo jurídico. O versículo termina com vírgula porque a decisão legal prossegue no versículo seguinte.
