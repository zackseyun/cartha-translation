source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: pt
  text: Nenhum dos homens que saíram do Egito[a], de vinte anos para cima, verá a terra que prometi sob juramento a Abraão, a Isaque e a Jacó, pois não me seguiram plenamente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico usa literalmente uma fórmula de juramento com «se»: «se os homens... virem a terra», o que implica uma forte negação: «nenhum... verá».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não me seguiram por completo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Nenhum ... verá
  rationale: Em contexto de juramento, אִם introduz uma fórmula elíptica de forte negação. A formulação portuguesa comunica o sentido sem reproduzir um «se» que seria enganoso.
- source_word: יִרְאוּ
  choice: verá
  rationale: ראה significa aqui «ver» no sentido de chegar a conhecer ou desfrutar a terra; o futuro preserva o caráter solene da declaração.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O hebraico emprega um substantivo masculino plural específico, adequado ao contexto dos homens em idade de recenseamento militar.
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: que saíram do Egito
  rationale: Embora עלה expresse literalmente subir, em português «sair do Egito» é a formulação natural para o êxodo e mantém o sentido contextual.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: de vinte anos para cima
  rationale: Expressa com naturalidade a fórmula hebraica de limite etário inclusivo.
- source_word: הָאֲדָמָה
  choice: a terra
  rationale: Neste contexto de promessa aos patriarcas, אֲדָמָה designa o território prometido, não apenas o solo.
- source_word: נִשְׁבַּעְתִּי
  choice: prometi sob juramento
  rationale: Torna explícito que a promessa divina foi confirmada por juramento, preservando o peso do verbo hebraico sem soar artificial em português.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: a Abraão, a Isaque e a Jacó
  rationale: Preserva cada destinatário da promessa e mantém uma cadência formal e clara.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente em português a razão do juízo expresso no juramento.
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: não me seguiram plenamente
  rationale: Conserva a imagem relacional de seguir e comunica a ideia idiomática de fazê-lo por inteiro, sem ampliar para uma noção abstrata de fidelidade.
theological_decisions:
- issue: Fórmula de juramento introduzida por אִם
  choice: Nenhum dos homens ... verá a terra
  alternative: Se os homens ... virem a terra
  rationale: A construção hebraica é uma fórmula elíptica de juramento com negação implícita. A tradução direta com «se» ocultaria a força da sentença divina.
- issue: Alcance do idioma לֹא מִלְאוּ אַחֲרַי
  choice: não me seguiram plenamente
  alternative: não foram inteiramente fiéis a mim
  rationale: A opção escolhida preserva a metáfora hebraica de seguir a Deus e sua exigência de integralidade, sem converter o texto em uma afirmação teológica mais abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Isaque» segue a forma bíblica portuguesa corrente. A ordem foi ajustada para fluência, sem eliminar a solenidade do juramento nem a imagem de seguir a Deus.
