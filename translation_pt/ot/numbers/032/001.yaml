base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: pt
  text: Os filhos de Rúben e os filhos de Gade tinham uma enorme quantidade de rebanhos[a], e viram a terra de Jazer e a terra de Gileade; e eis que o lugar era lugar para rebanhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os rubenitas e os gaditas”. O hebraico diz literalmente “os filhos de Rúben e os filhos de Gade”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou “o lugar era adequado para rebanhos”. O hebraico repete “lugar” para dar ênfase: “o lugar era lugar para rebanhos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: uma quantidade enorme de rebanhos
  rationale: מִקְנֶה abrange os animais domésticos mantidos como propriedade, enquanto רַב e עָצוּם מְאֹד ressaltam sua extraordinária abundância. “Rebanhos” é amplo e natural em português, sem restringir o sentido a gado bovino.
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: os filhos de Rúben e os filhos de Gade
  rationale: Mantém a formulação hebraica e sua repetição, embora se trate de designações tribais.
- source_word: וַיִּרְאוּ
  choice: Eles viram
  rationale: Traduz diretamente a sequência narrativa introduzida pelo waw consecutivo, sem acrescentar uma relação temporal ou causal não expressa.
- source_word: אֶרֶץ יַעְזֵר וְאֶרֶץ גִּלְעָד
  choice: a terra de Jazer e a terra de Gileade
  rationale: Preserva tanto o sentido amplo de אֶרֶץ quanto a repetição da estrutura hebraica.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Conserva a função de chamar a atenção para a constatação feita pelos personagens.
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: aquele lugar era lugar para rebanhos
  rationale: Preserva a repetição enfática de מָקוֹם e evita substituir a expressão por uma interpretação mais específica, como “pastagem”.
