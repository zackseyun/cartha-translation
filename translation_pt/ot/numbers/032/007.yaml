id: NUM.32.7
reference: Numbers 32:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: pt
  text: E por que vocês desanimam o coração dos filhos de Israel, impedindo-os de atravessar para a terra que Yahweh lhes deu?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «enfraquecem a coragem — ou a determinação — dos filhos de Israel». Em hebraico, literalmente, «desanimam o coração».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «dos israelitas» ou «dos descendentes de Israel».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: E por que
  rationale: Conserva tanto a conjunção que liga a pergunta ao discurso anterior quanto a força interrogativa.
- source_word: תנואון אֶת־לֵב
  choice: vocês desanimam o coração
  rationale: O hifil de נוא expressa causar desânimo ou enfraquecer a determinação. A formulação mantém a imagem hebraica do coração, compreensível em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Preserva a expressão familiar e nacional masculina do hebraico; a alternativa idiomática «israelitas» é registrada em nota.
- source_word: מֵעֲבֹר
  choice: impedindo-os de atravessar
  rationale: A preposição מִן com o infinitivo expressa afastamento ou impedimento. A explicitação com «impedindo-os» comunica naturalmente em português que o desânimo os deteria na travessia.
- source_word: אֶל־הָאָרֶץ
  choice: para a terra
  rationale: Expressa o movimento em direção à terra e sua entrada, sem especificar no versículo o obstáculo geográfico da travessia.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: que ... lhes deu
  rationale: Traduz diretamente o perfeito hebraico como uma concessão divina já efetuada, cujo resultado continua relevante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; «Yahweh» preserva essa função e evita substituí-lo por um título.
- issue: Designação nacional בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: Mantém a forma familiar-nacional do hebraico sem negar que, no contexto, a expressão designa coletivamente o povo de Israel.
- issue: Número de לֵב na expressão coletiva
  choice: o coração dos filhos de Israel
  alternative: os corações dos filhos de Israel
  rationale: O hebraico emprega «coração» no singular com um possuidor coletivo. O português permite essa construção; ela preserva a forma original e sua referência à coragem ou determinação comum do povo.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para a segunda pessoa do plural. A imagem hebraica do coração foi mantida, enquanto «impedindo-os» torna explícita a relação sintática entre o desânimo e a travessia. Os dois marcadores de nota aparecem no texto principal.
