source:
  edition: WLC
  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: pt
  text: 'Então os filhos de Gade e os filhos de Rúben responderam: “Faremos conforme Yahweh falou aos teus servos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que Yahweh falou aos teus servos, isso faremos.”'
    reason: A construção hebraica אֵת אֲשֶׁר ... כֵּן também pode ser representada mais formalmente como uma correlação entre “o que” foi falado e “isso” que será feito.
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: responderam
  rationale: O verbo ענה, nesta forma narrativa, introduz a resposta dos grupos ao discurso anterior de Moisés.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: os filhos de Gade e os filhos de Rúben
  rationale: Mantém a construção filial repetida no hebraico, sem substituí-la pelos gentílicos possíveis “gaditas” e “rubenitas”.
- source_word: לֵאמֹר
  choice: marcado pelos dois-pontos
  rationale: Em português atual, os dois-pontos introduzem a fala de modo mais natural do que a reprodução explícita de “dizendo”, sem perder a função discursiva do infinitivo hebraico.
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: conforme ...
  rationale: A construção correlativa indica correspondência entre o que Yahweh falou e o que os grupos prometem fazer. “Conforme” expressa essa relação com naturalidade.
- source_word: דִּבֶּר
  choice: falou
  rationale: O perfeito aponta para a fala anterior de Yahweh, ainda relevante no contexto; o pretérito perfeito é claro e idiomático em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto, em vez de substituí-lo por um título.
- source_word: אֶל עֲבָדֶיךָ
  choice: aos seus servos
  rationale: Aqui עֶבֶד funciona como autodesignação respeitosa diante de Moisés; “servos” preserva a deferência sem realçar indevidamente a ideia de escravidão.
- source_word: נַעֲשֶׂה
  choice: faremos
  rationale: Traduz diretamente o sentido amplo de עשה como execução do que foi ordenado, sem acrescentar um objeto ausente no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título.
- issue: Referente de “seus servos”
  choice: Moisés é o interlocutor, e os grupos se apresentam como servos dele
  alternative: Entender o pronome como referência direta a Yahweh
  rationale: O sufixo hebraico é de segunda pessoa masculina singular e, no diálogo, dirige-se a Moisés. A tradução portuguesa mantém a forma de tratamento sem explicitar além do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem da oração foi ajustada para uma fala natural, preservando a repetição deliberada de “os filhos de” e a ambiguidade estrutural registrada na nota.
