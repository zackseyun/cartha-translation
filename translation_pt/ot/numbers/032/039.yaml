  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן מְנַשֶּׁ֛ה גִּלְעָ֖דָ/ה וַֽ/יִּלְכְּדֻ֑/הָ וַ/יּ֖וֹרֶשׁ אֶת הָ/אֱמֹרִ֥י אֲשֶׁר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: pt
  text: Os filhos de Maquir, filho de Manassés, foram a Gileade e a conquistaram; e ele expulsou[a] os amorreus[b] que ali estavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz um verbo no singular, «e ele expulsou», depois dos verbos anteriores no plural. Isso pode tratar a linhagem de Maquir como uma unidade coletiva ou refletir uma mudança textual ou estilística. Algumas traduções regularizam a frase como «e eles expulsaram».
    reason: textual_variant
  - marker: b
    text: O hebraico emprega o gentílico no singular, literalmente «o amorreu», com sentido coletivo, referindo-se aos habitantes amorreus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: foram
  rationale: O verbo הלך é o verbo narrativo comum para deslocamento; o contexto não exige explicitar subida nem marcha militar.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Os filhos de Maquir, filho de Manassés
  rationale: Preserva a expressão hebraica de parentesco, que neste contexto também pode abranger descendentes ou membros do clã.
- source_word: גִּלְעָדָה
  choice: a Gileade
  rationale: O ה direcional indica movimento em direção ao lugar; em português, a construção natural é «foram a Gileade».
- source_word: וַיִּלְכְּדֻהָ
  choice: a conquistaram
  rationale: לכד descreve a tomada de um território ou lugar; «conquistaram» comunica com naturalidade o sentido militar, e o pronome retoma Gileade.
- source_word: וַיּוֹרֶשׁ
  choice: ele expulsou
  rationale: O hifil de ירש pode significar desapossar ou expulsar. A forma massorética é singular; «ele expulsou» conserva essa mudança gramatical, enquanto a nota registra sua dificuldade.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: O substantivo gentílico está no singular morfológico, mas tem sentido coletivo; o plural é a forma natural de designar seus habitantes em português.
- source_word: אֲשֶׁר בָּהּ
  choice: que ali estavam
  rationale: A oração relativa identifica os habitantes presentes em Gileade; «ali» evita uma retomada pronominal pouco natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A redação conserva de propósito a mudança abrupta do plural para o singular, esclarecida em nota, e usa «amorreus» no plural por naturalidade.
