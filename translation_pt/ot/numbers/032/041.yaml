base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: pt
  text: Jair, filho de Manassés, foi e conquistou os povoados deles, aos quais deu o nome de Havote-Jair.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Havote-Jair significa “povoados de Jair” ou “aldeias de Jair”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָאִיר
  choice: Jair
  rationale: Transliteração tradicional e amplamente reconhecida do nome pessoal hebraico.
- source_word: בֶּן מְנַשֶּׁה
  choice: filho de Manassés
  rationale: Preserva a forma literal da relação genealógica no hebraico, sem resolver a possível extensão de sentido para 'descendente'.
- source_word: הָלַךְ
  choice: foi
  rationale: Equivalente simples e natural na sequência narrativa, sem acrescentar direção ou finalidade.
- source_word: וַיִּלְכֹּד
  choice: conquistou
  rationale: No contexto territorial e militar, expressa naturalmente a tomada dos povoados; 'capturou' seria possível, mas menos idiomático para localidades em português.
- source_word: חַוֺּתֵיהֶם
  choice: os povoados deles
  rationale: O substantivo designa pequenos núcleos habitados ou aldeias; 'povoados' é claro e permite refletir na nota a correspondência com o topônimo.
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: aos quais deu o nome de
  rationale: Torna explícito em português corrente o uso de קרא no sentido de nomear, mantendo os povoados como referente.
- source_word: חַוֺּת יָאִיר
  choice: Havote-Jair
  rationale: Mantém o topônimo como nome próprio por transliteração, enquanto seu significado é explicado em nota.
