base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: pt
  text: Moisés deu Gileade a Maquir, filho de Manassés, e ele se estabeleceu ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morou ali”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O verbo נתן tem aqui o sentido direto de dar. “Deu” preserva sua força simples sem acrescentar uma nuance administrativa como “designou” ou “concedeu”.
- source_word: הַגִּלְעָד
  choice: Gileade
  rationale: Trata-se do topônimo tradicional em português. Embora o hebraico use artigo, o português normalmente o omite nesta construção com o nome próprio.
- source_word: לְמָכִיר
  choice: a Maquir
  rationale: A preposição לְ marca aqui o destinatário; “a Maquir” é a correspondência direta e natural.
- source_word: בֶּן מְנַשֶּׁה
  choice: filho de Manassés
  rationale: בֶּן significa naturalmente “filho” nesta identificação genealógica; não há necessidade contextual de ampliar para “descendente”.
- source_word: וַיֵּשֶׁב
  choice: se estabeleceu
  rationale: ישב pode significar sentar-se, habitar ou estabelecer-se. No contexto de ocupação territorial, “se estabeleceu” comunica naturalmente o início de residência permanente.
- source_word: בָּהּ
  choice: ali
  rationale: O sufixo feminino singular retoma Gileade como terra ou região. “Ali” é idiomático em português e evita a construção menos natural “nela” com o topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Assim” mantém a conexão narrativa; “se estabeleceu” adequa o valor de ישב ao contexto territorial. O marcador da nota foi colocado após a oração à qual se refere.
