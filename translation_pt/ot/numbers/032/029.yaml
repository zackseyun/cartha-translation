source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: pt
  text: 'E Moisés lhes disse: “Se os filhos de Gade e os filhos de Rúben atravessarem o Jordão com vocês, todos armados para a batalha diante de Yahweh, e a terra for subjugada diante de vocês, então vocês lhes darão a terra de Gileade como propriedade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém o fluxo narrativo do wayyiqtol hebraico de forma natural em português.
- source_word: אִם
  choice: Se
  rationale: Preserva a condição real da qual depende a concessão da terra.
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: os filhos de Gade e os filhos de Rúben
  rationale: Conserva a expressão tribal de parentesco do hebraico, sem substituí-la por gentílicos.
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: atravessarem o Jordão
  rationale: É a formulação portuguesa corrente e fiel para a travessia do rio.
- source_word: אִתְּכֶם
  choice: com vocês
  rationale: Expressa diretamente o acompanhamento indicado no hebraico e oferece ampla legibilidade brasileira.
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: todos armados para a batalha
  rationale: O singular distributivo hebraico significa cada integrante apto e equipado; a formulação coletiva é natural em português e não acrescenta 'homem', ausente do texto.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva tanto a expressão relacional 'diante de' quanto o nome divino explícito.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: e a terra for subjugada
  rationale: Reproduz o valor passivo do nifal de כבש sem sugerir necessariamente destruição total.
- source_word: לִפְנֵיכֶם
  choice: diante de vocês
  rationale: Mantém o idioma espacial hebraico, referente à conquista realizada no avanço de Israel.
- source_word: וּנְתַתֶּם לָהֶם
  choice: então vocês lhes darão
  rationale: O 'então' torna clara em português a consequência da condição, enquanto o futuro expressa a determinação de Moisés.
- source_word: אֶרֶץ הַגִּלְעָד לַאֲחֻזָּה
  choice: a terra de Gileade como propriedade
  rationale: Comunica a terra recebida como posse territorial duradoura, sem ampliar o sentido para uma formulação jurídica excessivamente técnica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. 'Yahweh' preserva sua função nominal e evita substituí-lo por um título.
- issue: Sentido de לִפְנֵי יְהוָה no contexto militar
  choice: diante de Yahweh
  alternative: na presença de Yahweh; sob o comando de Yahweh
  rationale: A tradução formal conserva a dimensão teológica da ação realizada perante Deus sem definir além do texto se a frase indica presença, liderança, aprovação ou todas essas nuances.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sintaxe condicional foi suavizada apenas o necessário. Repetiu-se 'os filhos de' para preservar a forma tribal hebraica; 'todos armados' evita o peso pouco natural de 'cada homem armado'. O nome divino foi transliterado como Yahweh.
