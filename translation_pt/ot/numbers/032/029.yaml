  source_fidelity: 'A tradução preserva adequadamente a estrutura condicional e todos os elementos semânticos principais do hebraico: a travessia do Jordão em companhia dos destinatários, a totalidade dos que estão armados para a batalha, a ação diante de Yahweh, a subjugação da terra e a posterior concessão de Gileade como posse.'
  naturalness: O português é moderno, claro e de registro bíblico digno. “Todos armados para a batalha” expressa naturalmente o coletivo distributivo de כָּל חָלוּץ, e a repetição de “diante de” preserva, sem artificialidade excessiva, o paralelismo do texto-fonte.
  terminology: “Filhos de Gade” e “filhos de Rúben” mantêm a formulação tribal hebraica; “Yahweh” reproduz o nome divino conforme a política indicada; “subjugada” corresponde bem ao passivo de כבש; e “como propriedade” comunica de modo suficiente a ideia de posse territorial (אֲחֻזָּה).
