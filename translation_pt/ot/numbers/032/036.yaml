  text: וְ/אֶת בֵּ֥ית נִמְרָ֖ה וְ/אֶת בֵּ֣ית הָרָ֑ן עָרֵ֥י מִבְצָ֖ר וְ/גִדְרֹ֥ת צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/036.yaml
  text: and Beth-nimrah and Beth-haran[a], fortified cities[b], and sheepfolds.
translation:
  language: pt
  text: e Bete-Ninra e Bete-Harã, cidades fortificadas[a], e currais para os rebanhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidades-fortaleza”.
    reason: lexical_alternative
  - marker: b
    text: Ou “currais para ovelhas” ou “cercados para o gado miúdo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: Bete-Ninra
  rationale: Nome de lugar transliterado segundo uma forma corrente e legível em português; o elemento בֵּית integra o topônimo e não é traduzido literalmente como “casa de”.
- source_word: בֵּית הָרָן
  choice: Bete-Harã
  rationale: Nome de lugar transliterado como topônimo estabelecido; “casa de Harã” poderia sugerir indevidamente uma expressão comum, e não o nome da cidade.
- source_word: עָרֵי מִבְצָר
  choice: cidades fortificadas
  rationale: Expressão natural em português que conserva o sentido defensivo da construção hebraica, literalmente “cidades de fortificação/fortaleza”.
- source_word: גִדְרֹת צֹאן
  choice: currais para os rebanhos
  rationale: Designa cercados destinados ao gado miúdo. “Rebanhos” preserva melhor que “ovelhas” a possível abrangência de צֹאן, que pode incluir ovelhas e cabras.
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: e ... e ... e
  rationale: A repetição de וְ dá continuidade à enumeração do versículo anterior; em português, a sequência com “e” mantém essa estrutura aditiva, enquanto o marcador de objeto אֵת não recebe tradução própria.
