  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: pt
  text: Nós, porém, nos armaremos prontamente e iremos à frente dos israelitas[a], até os levarmos ao lugar deles. Nossas crianças[b] ficarão nas cidades fortificadas por causa dos habitantes da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante dos filhos de Israel”; neste contexto, a expressão provavelmente significa ir à frente dos israelitas na batalha.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “crianças” pode abranger também outros dependentes.
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: nos armaremos
  rationale: 'O nifal de חלץ tem aqui sentido reflexivo ou médio: os falantes se comprometem a equipar-se para a batalha.'
- source_word: חֻשִׁים
  choice: prontamente
  rationale: O termo comunica rapidez e disposição imediata. A tradução adverbial evita repetir a ideia militar já expressa por נֵחָלֵץ.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: marcharemos à frente dos israelitas
  rationale: לִפְנֵי significa literalmente “diante de”, mas, neste contexto militar, indica avançar à frente da força israelita. “Marcharemos” torna explícito em português o movimento implícito na construção contextual.
- source_word: עַד אֲשֶׁר אִם
  choice: até
  rationale: A combinação assinala idiomaticamente o limite temporal da ação; “até” é a forma portuguesa natural e direta.
- source_word: הֲבִיאֹנֻם
  choice: os levarmos
  rationale: O hifil de בוא significa fazer vir, trazer ou levar. No movimento rumo ao destino dos israelitas, “levar” soa natural em português.
- source_word: אֶל מְקוֹמָם
  choice: ao lugar deles
  rationale: Mantém a formulação ampla do hebraico sem restringir o referente a destino, território ou assentamento.
- source_word: וְיָשַׁב טַפֵּנוּ
  choice: nossas crianças ficarão
  rationale: טַף é um coletivo que abrange sobretudo crianças e pode incluir outros dependentes. “Crianças” é claro no texto principal, e a extensão do termo é registrada em nota.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: nas cidades fortificadas
  rationale: Expressa de modo corrente as cidades caracterizadas por estruturas defensivas.
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: protegidas dos habitantes da terra
  rationale: מִפְּנֵי apresenta os habitantes como a razão ou ameaça que exige a permanência nas cidades fortificadas. A formulação explicita a relação protetora indicada pelo contexto.
