base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: pt
  text: 'Naquele dia, a ira de Yahweh[a] se acendeu, e ele jurou, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; também vertido como “Jeová”.'
    reason: Registra a forma hebraica do nome divino e uma transliteração tradicional alternativa.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: a ira ... se acendeu
  rationale: A combinação de חרה com אַף é uma expressão idiomática para a ira que se torna ardente. “A ira se acendeu” preserva a metáfora hebraica e soa natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Equivalente temporal corrente e natural no contexto narrativo.
- source_word: וַיִּשָּׁבַע
  choice: ele jurou
  rationale: O nifal de שבע indica jurar ou prestar juramento; “jurou” é direto, claro e conciso.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introduz formalmente o conteúdo do juramento, apresentado no versículo seguinte, sem romper a ligação sintática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal, enquanto “SENHOR” o substitui por um título; “Jeová” é uma forma tradicional alternativa.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A ordem inicial “Naquele dia” é natural em português; a metáfora da ira acesa e a fórmula “jurou, dizendo” preservam de perto a expressão hebraica.
