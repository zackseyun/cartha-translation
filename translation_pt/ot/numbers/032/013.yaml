  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: pt
  text: E a ira de Yahweh se acendeu contra Israel[a], e ele os fez vagar no deserto durante quarenta anos[b], até que toda a geração que havia feito o que era mau aos olhos de Yahweh chegasse ao fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Yahweh ficou irado com Israel”. Literalmente, a expressão hebraica diz que “o nariz de Yahweh se acendeu”; «nariz» é um idiomismo para ira.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele os fez andar errantes no deserto durante quarenta anos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: a ira de Yahweh se acendeu
  rationale: Preserva a imagem hebraica da ira que arde, usando uma expressão natural e digna em português.
- source_word: בְּיִשְׂרָאֵל
  choice: contra Israel
  rationale: Com a expressão de ira, a preposição marca Israel como alvo da indignação divina.
- source_word: וַיְנִעֵם
  choice: ele os fez andar errantes
  rationale: Mantém a força causativa da forma verbal e o sentido de deslocamento sem rumo; evita reduzi-la ao simples fato de que eles andaram.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: No contexto do êxodo, 'deserto' é claro e corrente em português; a preposição 'pelo' combina naturalmente com o movimento prolongado expresso pelo verbo.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: A inclusão de 'durante' expressa com naturalidade em português a duração indicada pelo hebraico.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: até que desaparecesse toda a geração
  rationale: O verbo תּמם indica que a geração chegou ao fim; 'desaparecesse' comunica, no contexto, sua extinção sem acrescentar explicitamente um modo de morte.
- source_word: הָעֹשֶׂה הָרַע
  choice: que havia feito o que era mau
  rationale: Transforma naturalmente o particípio singular que modifica o coletivo 'geração' em oração relativa e conserva o caráter retrospectivo da afirmação.
- source_word: בְּעֵינֵי יְהוָה
  choice: aos olhos de Yahweh
  rationale: Preserva a metáfora avaliativa hebraica em uma formulação estabelecida e compreensível em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o tetragrama; a transliteração preserva o nome pessoal sem trocar o termo por um título.
- issue: Imagem da ira divina
  choice: a ira de Yahweh se acendeu contra Israel
  alternative: Yahweh ficou irado com Israel
  rationale: A opção conserva a metáfora hebraica da ira ardente e sua força teológica, sem a suavizar nem ampliá-la.
- issue: Ação divina no período do deserto
  choice: ele os fez andar errantes
  alternative: ele os conduziu pelo deserto; eles vagaram
  rationale: A forma causativa atribui a Yahweh a ação de fazê-los andar errantes; a tradução mantém essa agência sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva a imagem vívida da ira que se acende, a causalidade da peregrinação e a metáfora hebraica 'aos olhos de Yahweh'.
