  text: וַ/יֹּ֤אמֶר בְּנֵי גָד֙ וּ/בְנֵ֣י רְאוּבֵ֔ן אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר עֲבָדֶ֣י/ךָ יַעֲשׂ֔וּ כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י מְצַוֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: pt
  text: 'Então os filhos de Gade e os filhos de Rúben disseram a Moisés, dizendo: “Teus servos farão como o meu senhor ordena.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: os filhos de Gade e os filhos de Rúben
  rationale: Mantém a expressão hebraica e a repetição dos dois grupos, em linguagem bíblica clara e corrente.
- source_word: לֵאמֹר
  choice: não traduzido separadamente
  rationale: Após o verbo “disseram”, a fórmula hebraica de introdução da fala seria redundante e pouco natural em português; os dois-pontos cumprem sua função discursiva.
- source_word: עֲבָדֶיךָ
  choice: Seus servos
  rationale: Preserva a autodesignação respeitosa dos interlocutores diante de Moisés.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Expressa aqui a conformidade integral da ação prometida com a ordem de Moisés.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Refere-se respeitosamente a Moisés, não ao nome divino; a inicial minúscula evita confusão.
- source_word: מְצַוֶּה
  choice: ordena
  rationale: Reproduz com naturalidade a força do particípio hebraico no contexto da ordem dada.
theological_decisions:
- issue: Referente de אֲדֹנִי
  choice: meu senhor
  alternative: o Senhor
  rationale: A forma com sufixo de primeira pessoa e o discurso dirigido a Moisés indicam um título humano de respeito, sem referência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula hebraica “dizendo” foi representada naturalmente pela pontuação, sem perda de conteúdo proposicional.
