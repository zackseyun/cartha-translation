base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: pt
  text: 'E disseram: “Se encontramos favor aos teus olhos, seja dada esta terra aos teus servos como propriedade. Não nos faças atravessar[a] o Jordão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não nos leves para o outro lado do Jordão”. O verbo hebraico está na forma causativa e admite traduções próximas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: se achamos favor aos teus olhos
  rationale: Preserva a expressão idiomática hebraica de receber consideração favorável, com formulação clara e digna em português.
- source_word: יֻתַּן
  choice: seja dada
  rationale: Reproduz o valor passivo e volitivo do pedido cortês, sem convertê-lo no imperativo mais interpretativo “dá”.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: “Terra” é o equivalente direto e natural no contexto de uma área destinada à ocupação permanente.
- source_word: לַעֲבָדֶיךָ
  choice: aos teus servos
  rationale: Neste pedido dirigido a Moisés, o termo funciona como autodesignação respeitosa; “escravos” salientaria indevidamente uma condição social que não está em primeiro plano.
- source_word: לַאֲחֻזָּה
  choice: como propriedade
  rationale: Expressa uma posse territorial duradoura sem introduzir de forma indevida a noção específica de herança.
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: Não nos faças atravessar o Jordão
  rationale: Mantém o sentido causativo da forma hebraica de עבר e emprega a designação portuguesa natural do rio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservam-se a fórmula respeitosa “aos teus olhos” e a estrutura formal do pedido, enquanto “como propriedade” comunica naturalmente a ideia de posse territorial permanente.
