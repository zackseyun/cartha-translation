base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: pt
  text: Construam cidades para seus filhos pequenos e cercados para seus rebanhos; façam o que saiu da boca de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumpram o que prometeram”. Em hebraico, literalmente: “façam o que saiu da boca de vocês”, expressão que significa cumprir a palavra dada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוּ
  choice: Construam
  rationale: Imperativo plural de בנה; expressa de modo direto e natural a ordem de edificar.
- source_word: לָכֶם
  choice: para vocês
  rationale: Representa a preposição com o pronome da segunda pessoa do plural sem impor uma força reflexiva maior do que o hebraico exige.
- source_word: עָרִים
  choice: cidades
  rationale: עיר pode indicar cidade ou povoado; “cidades” é adequado ao contexto dos assentamentos em Números 32.
- source_word: לְטַפְּכֶם
  choice: para as suas crianças
  rationale: טף designa sobretudo crianças pequenas e, por extensão, os membros vulneráveis das famílias; “crianças” é concreto e natural em português.
- source_word: וּגְדֵרֹת
  choice: e currais
  rationale: גדרות indica cercados para animais; “currais” comunica com clareza a função pastoril no contexto.
- source_word: לְצֹנַאֲכֶם
  choice: para os seus rebanhos
  rationale: צאן designa coletivamente o gado miúdo, especialmente ovelhas e cabras; “rebanhos” é a equivalência portuguesa mais idiomática.
- source_word: וְהַיֹּצֵא מִפִּיכֶם תַּעֲשׂוּ
  choice: e façam o que saiu da boca de vocês
  rationale: Mantém a imagem hebraica da palavra que sai da boca, ao mesmo tempo que reproduz com naturalidade a ordem de cumprir o compromisso verbal.
theological_decisions:
- issue: A força da expressão “o que saiu da boca de vocês”
  choice: Preservar literalmente a expressão idiomática no texto
  alternative: “cumpram o que prometeram”
  rationale: A formulação literal é compreensível em português e conserva a imagem e a solenidade do compromisso falado, enquanto a nota esclarece o sentido idiomático sem eliminar a textura do original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação em ponto e vírgula separa a ordem de construir da ordem enfática de cumprir a palavra dada. “Currais” foi preferido a “cercados” por sua clareza no contexto de rebanhos.
