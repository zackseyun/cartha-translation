id: NUM.32.32
reference: Numbers 32:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: pt
  text: Nós mesmos atravessaremos, armados, diante de Yahweh, para a terra de Canaã; e conosco ficará a propriedade da nossa herança deste lado do Jordão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “além do Jordão” ou “do outro lado do Jordão”; a expressão hebraica depende do ponto de vista. Aqui, “deste lado do Jordão” reflete a localização dos falantes a leste do rio.
    reason: alternativa lexical e esclarecimento da perspectiva espacial
lexical_decisions:
- source_word: נַחְנוּ
  choice: Nós mesmos
  rationale: O pronome independente reforça o sujeito já expresso no verbo; “nós mesmos” preserva essa ênfase em português natural.
- source_word: נַעֲבֹר
  choice: atravessaremos
  rationale: O imperfeito qal de עבר expressa aqui o compromisso futuro de atravessar o Jordão.
- source_word: חֲלוּצִים
  choice: armados
  rationale: No contexto militar, descreve homens equipados e preparados para o combate; “armados” é conciso e claro.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי tem sentido espacial e relacional, enquanto “Yahweh” representa diretamente o nome divino יהוה.
- source_word: אֶרֶץ כְּנָעַן
  choice: para a terra de Canaã
  rationale: Embora o hebraico não traga preposição explícita antes de “terra”, o verbo de movimento requer em português uma indicação natural de destino.
- source_word: וְאִתָּנוּ
  choice: e conosco ficará
  rationale: A oração hebraica não tem verbo expresso. “Ficará” explicita de modo natural a posse permanente pretendida no compromisso.
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: a propriedade da nossa herança
  rationale: 'A formulação conserva os dois componentes da cadeia construta: uma posse territorial e sua condição de herança atribuída.'
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: deste lado do Jordão
  rationale: A expressão é dependente da perspectiva. No contexto, os falantes estão a leste do rio e se referem à terra que receberão ali; a nota preserva outras traduções possíveis.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de לִפְנֵי יְהוָה no compromisso militar
  choice: diante de Yahweh
  alternative: na presença de Yahweh; à frente de Yahweh
  rationale: A tradução mantém a amplitude espacial, relacional e pactual da expressão, sem reduzi-la apenas à posição numa marcha.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, mas emprega pontuação e verbos naturais em português. O marcador [a] aparece no texto principal.
