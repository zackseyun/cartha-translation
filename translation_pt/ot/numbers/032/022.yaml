  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִכְבְּשָׁ֨ה הָ/אָ֜רֶץ לִ/פְנֵ֤י יְהוָה֙ וְ/אַחַ֣ר תָּשֻׁ֔בוּ וִ/הְיִיתֶ֧ם נְקִיִּ֛ים מֵ/יְהוָ֖ה וּ/מִ/יִּשְׂרָאֵ֑ל וְ֠/הָיְתָה הָ/אָ֨רֶץ הַ/זֹּ֥את לָ/כֶ֛ם לַ/אֲחֻזָּ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: pt
  text: e a terra tiver sido subjugada diante de Yahweh[a], depois disso vocês poderão voltar e estarão livres de obrigação para com Yahweh e Israel[b]; e esta terra será propriedade de vocês diante de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muitas traduções representam o nome divino YHWH por “SENHOR”.
    reason: divine_name
  - marker: b
    text: 'Ou: “e estarão sem culpa perante Yahweh e perante Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: e a terra tiver sido subjugada
  rationale: O nifal de כבש apresenta a terra como posta sob domínio. O futuro do subjuntivo em português exprime naturalmente a condição iniciada no contexto anterior e preserva a voz passiva.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa literalmente 'diante de' ou 'na presença de'; a formulação mantém tanto a dimensão presencial quanto a de responsabilidade perante Deus.
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: depois disso vocês poderão voltar
  rationale: A expressão marca a etapa posterior ao cumprimento da condição. 'Poderão voltar' comunica a volta então autorizada sem transformá-la em ordem independente.
- source_word: וִהְיִיתֶם נְקִיִּים
  choice: e estarão livres de obrigação
  rationale: נָקִי pode indicar inocência, ausência de culpa ou isenção de responsabilidade. Neste contexto, refere-se ao compromisso assumido e devidamente cumprido.
- source_word: מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: para com Yahweh e Israel
  rationale: Com נָקִי, a preposição מן indica a pessoa ou comunidade perante a qual já não há responsabilidade pendente. 'Para com' é idiomático em português e conserva a relação com ambos.
- source_word: לַאֲחֻזָּה
  choice: como propriedade
  rationale: אֲחֻזָּה designa uma posse territorial duradoura. 'Propriedade' é clara e não explicita além do texto a possível nuance hereditária.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino pessoal expresso pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: A tradução preserva o nome próprio presente no hebraico; a nota informa a convenção tradicional sem substituir o nome no texto.
- issue: Sentido de נְקִיִּים no compromisso assumido por Rúben e Gade
  choice: livres de obrigação
  alternative: inocentes ou sem culpa
  rationale: O contexto imediato trata do cumprimento de um dever perante Yahweh e Israel. A tradução destaca a ausência de obrigação pendente, enquanto a nota conserva a amplitude forense e moral do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. A construção condicional depende do versículo anterior, como no hebraico. O ponto e vírgula separa o cumprimento da obrigação da concessão territorial resultante.
