  terminology: '“Yahweh” reproduz consistentemente o tetragrama conforme a política indicada. “Subjugada”, “livres de obrigação” e “propriedade” são escolhas semanticamente defensáveis para כבש, נָקִי e אֲחֻזָּה. As notas estão corretamente ancoradas: [a] no nome divino e [b] na expressão de isenção/culpa.'
