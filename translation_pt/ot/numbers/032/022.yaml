  source_fidelity: 'A tradução preserva adequadamente a progressão condicional do hebraico: a subjugação da terra, o retorno posterior, a liberação da obrigação perante Yahweh e Israel e a concessão territorial. “Tiver sido subjugada” comunica bem o nifal passivo de כבש no contexto condicionado pelos versículos anteriores. “Livres de obrigação para com Yahweh e Israel” transmite de modo natural o sentido contextual de נְקִיִּים מִן, sem excluir indevidamente a nuance de inocência/isenção, que é registrada na nota.'
