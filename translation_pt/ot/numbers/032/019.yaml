  text: כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔/ם מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן וָ/הָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֨/נוּ֙ אֵלֵ֔י/נוּ מֵ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: pt
  text: Pois não receberemos herança com eles do outro lado do Jordão e mais adiante, porque a nossa herança já nos coube deste lado do Jordão, a leste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque a nossa herança veio até nós do lado leste do Jordão”.'
    reason: Preserva uma tradução mais formal de בָאָה ... אֵלֵינוּ e a possibilidade de representar מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה como uma única expressão espacial.
lexical_decisions:
- source_word: נִנְחַל
  choice: receberemos herança
  rationale: Expressa naturalmente em português o Qal de נחל no contexto de receber uma porção territorial, preservando o sentido de herança sem sugerir apenas posse genérica.
- source_word: אִתָּם
  choice: com eles
  rationale: Mantém de modo direto a ideia de participação conjunta com as demais tribos.
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: do outro lado do Jordão e mais adiante
  rationale: Conserva a perspectiva espacial e representa וָהָלְאָה sem reduzir a expressão apenas a 'oeste'.
- source_word: בָאָה ... אֵלֵינוּ
  choice: já nos coube
  rationale: Comunica em português idiomático que a herança veio a ser a porção deles; 'já' explicita o aspecto completivo do perfeito no contexto, sem transformar o verbo em uma atribuição formal explícita.
- source_word: נַחֲלָתֵנוּ
  choice: a nossa herança
  rationale: É a equivalência padrão para נחלה e preserva o sentido de porção territorial recebida no âmbito da aliança.
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: deste lado do Jordão, a leste
  rationale: Torna clara para o leitor a localização oriental segundo a perspectiva dos falantes e traduz explicitamente מִזְרָחָה.
