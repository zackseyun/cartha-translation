  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: pt
  text: Pois, se vocês voltarem atrás, deixando de segui-lo[a], ele tornará a deixá-lo no deserto[b], e vocês levarão todo este povo à ruína.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “voltarem de detrás dele”, expressão que significa deixar de segui-lo.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “deixá-lo no deserto”, com pronome singular provavelmente empregado em sentido coletivo para Israel, isto é, o povo. Algumas traduções explicitam “deixar Israel” ou usam o plural “deixá-los”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois, se
  rationale: Preserva tanto a ligação explicativa com o contexto anterior quanto a força condicional da advertência.
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: vocês voltarem atrás, deixando de segui-lo
  rationale: שוב com מֵאַחֲרָיו descreve abandonar o seguimento, não apenas retornar fisicamente. A formulação portuguesa comunica o idioma hebraico e mantém a ideia de voltar atrás.
- source_word: וְיָסַף עוֹד
  choice: ele tornará a
  rationale: 'A combinação idiomática indica repetição: Deus fará isso novamente.'
- source_word: לְהַנִּיחוֹ
  choice: deixá-lo
  rationale: O hifil de נוח pode significar deixar ou permitir que permaneça. Mantém-se o sufixo pronominal singular do hebraico, provavelmente coletivo.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: Em português bíblico corrente, 'deserto' traduz naturalmente מִדְבָּר e corresponde ao cenário narrativo.
- source_word: וְשִׁחַתֶּם
  choice: vocês levarão ... à ruína
  rationale: Expressa a consequência causativa e destrutiva de שׁחת sem limitar o sentido à aniquilação física imediata.
- source_word: לְכָל הָעָם הַזֶּה
  choice: todo este povo
  rationale: Conserva o substantivo coletivo singular e a referência demonstrativa do hebraico.
theological_decisions:
- issue: Referente do pronome singular em לְהַנִּיחוֹ
  choice: Manter o singular em 'deixá-lo', entendido coletivamente como Israel/o povo.
  alternative: Regularizar para o plural ('deixá-los') ou explicitar 'deixar Israel'.
  rationale: O texto hebraico traz um sufixo singular. Embora o português pudesse regularizá-lo, sua conservação mantém a forma e a tensão do original; a nota esclarece o provável uso coletivo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com 'vocês' para o plural. A redação preserva o pronome singular incomum do hebraico e o esclarece em nota, sem eliminar a tensão textual.
