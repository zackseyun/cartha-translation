base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: pt
  text: 'E Moisés lhes disse: “Se fizerem isso, se vocês se armarem[a] diante de Yahweh[b] para a batalha,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se vocês se equiparem”, “se forem armados” ou “se se apresentarem para a batalha”. O verbo hebraico tem o sentido militar de estar armado ou preparado para combater.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “diante de Yahweh”, indicando que a ação militar seria realizada em sua presença e sob sua autoridade.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: E Moisés lhes disse
  rationale: Preserva a sequência narrativa do wayyiqtol e expressa naturalmente o objeto indireto em português.
- source_word: אִם תַּעֲשׂוּן אֶת־הַדָּבָר הַזֶּה
  choice: Se fizerem isso
  rationale: O demonstrativo retoma a proposta anterior; “isso” é natural e mantém a referência ampla de דָּבָר neste contexto.
- source_word: אִם תֵּחָלְצוּ
  choice: se vocês se armarem
  rationale: O nifal de חלץ tem aqui sentido militar de equipar-se ou apresentar-se armado para o combate. O pronome explícito ajuda a distinguir o sujeito plural em português internacional.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” conserva a ideia de presença e autoridade expressa por לִפְנֵי, enquanto “Yahweh” representa diretamente o nome divino.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: No contexto imediato, מִלְחָמָה designa a ação militar; “para a batalha” é idiomático e mantém o propósito indicado pela preposição.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Sentido de לִפְנֵי na ação militar
  choice: diante de Yahweh
  alternative: na presença de Yahweh
  rationale: A formulação conserva a tensão entre localização na presença divina e ação sob sua autoridade, sem reduzir a expressão a uma mera indicação geográfica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição condicional do hebraico foi preservada, assim como a continuação sintática indicada pela vírgula final.
