  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: pt
  text: e cada homem armado entre vocês atravessar o Jordão diante de Yahweh, até que ele tenha expulsado[a] os seus inimigos de diante de si[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenha desapossado”. O verbo hebraico pode significar “expulsar” ou “desapossar”.'
    reason: lexical_alternative
  - marker: b
    text: Os pronomes em “ele tenha expulsado os seus inimigos de diante de si” referem-se mais naturalmente a Yahweh, embora alguns os entendam como referência coletiva a Israel ou à sua força armada.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: e ... atravessar
  rationale: O perfeito qal com וְ, na continuação da condição do versículo anterior, tem valor futuro-condicional. O futuro do subjuntivo em português expressa naturalmente essa estipulação.
- source_word: לָכֶם
  choice: entre vocês
  rationale: Com כָּל חָלוּץ, a preposição indica relação com as tribos interpeladas; “entre vocês” é idiomático e claro.
- source_word: כָּל חָלוּץ
  choice: cada homem armado
  rationale: חָלוּץ designa alguém equipado para o combate. “Cada” preserva a força distributiva do singular hebraico sem transformar a expressão em um título militar mais específico.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma geográfica consagrada e suficiente em português; não é necessário acrescentar “rio”.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” comunica presença e posição perante Deus, enquanto “Yahweh” translitera o nome divino expresso no texto hebraico.
- source_word: עַד
  choice: até que
  rationale: Marca o limite temporal da obrigação militar e introduz naturalmente uma oração verbal em português.
- source_word: הוֹרִישׁוֹ
  choice: ele tenha expulsado
  rationale: O hifil de ירשׁ pode significar expulsar ou desapossar. O pretérito perfeito composto do subjuntivo apresenta a expulsão como o ponto a ser alcançado antes do término da ação.
- source_word: אֹיְבָיו
  choice: os seus inimigos
  rationale: Conserva o sufixo masculino singular e, portanto, a ligação pronominal do hebraico sem substituir o referente por um nome explícito.
- source_word: מִפָּנָיו
  choice: de diante de si
  rationale: Preserva a linguagem de presença ligada a פנים e mantém a cadeia reflexiva de pronomes do original.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e corresponde à transliteração adotada pela POB.
- issue: Referente dos pronomes masculinos singulares em הוֹרִישׁוֹ, אֹיְבָיו e מִפָּנָיו
  choice: Manter a cadeia pronominal, com Yahweh como referente mais natural
  alternative: Entender os pronomes como referência coletiva a Israel ou à força armada
  rationale: A menção imediatamente anterior de Yahweh e o padrão narrativo da conquista favorecem Yahweh como antecedente. Contudo, a forma portuguesa mantém os pronomes, preservando a possibilidade gramatical alternativa em vez de inserir o nome divino novamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural interpelado. O futuro do subjuntivo liga o fragmento à condição iniciada no versículo anterior. A formulação conserva a repetição pronominal e a tensão interpretativa do hebraico.
