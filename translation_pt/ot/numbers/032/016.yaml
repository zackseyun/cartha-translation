  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: pt
  text: 'Então eles se aproximaram de Moisés e disseram: “Construiremos aqui apriscos para os nossos rebanhos e cidades para as nossas crianças[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossos pequenos” ou “nossos dependentes”. O termo hebraico טַף refere-se às crianças ou aos dependentes, muitas vezes destacando os membros vulneráveis da comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: eles se aproximaram de Moisés
  rationale: O verbo נגשׁ indica aproximação física. O referente do pronome é explicitado como “Moisés” para evitar ambiguidade em um versículo isolado.
- source_word: וַיֹּאמְרוּ
  choice: e disseram
  rationale: Forma narrativa sequencial que introduz de modo natural o discurso direto.
- source_word: גִּדְרֹת צֹאן
  choice: currais
  rationale: A expressão designa recintos cercados para ovelhas ou rebanhos; “currais” é corrente, conciso e adequado ao contexto pastoril.
- source_word: נִבְנֶה
  choice: construiremos
  rationale: O imperfeito na primeira pessoa do plural expressa aqui a intenção ou proposta declarada pelo grupo.
- source_word: לְמִקְנֵנוּ
  choice: para os nossos rebanhos
  rationale: מִקְנֶה abrange os animais domésticos possuídos pelo grupo. “Rebanhos” é natural em português e não restringe a referência apenas ao gado bovino.
- source_word: פֹּה
  choice: aqui
  rationale: Equivalente direto e natural do advérbio locativo.
- source_word: וְעָרִים
  choice: e cidades
  rationale: Preserva o equivalente lexical direto de עָרִים, embora o termo hebraico também possa abranger povoações fortificadas de menor porte.
- source_word: לְטַפֵּנוּ
  choice: para as nossas crianças[a]
  rationale: טַף denota os pequenos e, por extensão, dependentes vulneráveis. “Crianças” é mais natural em português corrente, com a amplitude lexical registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, sem perder a sequência narrativa nem a intenção proposta no hebraico.
