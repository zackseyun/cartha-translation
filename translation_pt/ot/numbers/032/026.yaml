  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: pt
  text: Nossos filhos pequenos[a], nossas esposas, nossos rebanhos e todos os nossos animais permanecerão[b] ali, nas cidades de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nossos filhos”. O hebraico טַף muitas vezes se refere especialmente às crianças pequenas ou aos filhos dependentes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estarão”. O verbo hebraico significa literalmente “serão/estarão”, mas, neste contexto, indica que eles permanecerão ali enquanto os outros seguem para a campanha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: nossos filhos pequenos
  rationale: טַף designa especialmente as crianças pequenas ou dependentes; a expressão comunica a idade e a condição não combatente sem recorrer a um termo técnico.
- source_word: נָשֵׁינוּ
  choice: nossas esposas
  rationale: Neste contexto familiar e tribal, o plural de אִשָּׁה com sufixo de primeira pessoa refere-se naturalmente às esposas dos homens que falam.
- source_word: מִקְנֵנוּ
  choice: nossos rebanhos
  rationale: מִקְנֶה abrange o gado como propriedade móvel, incluindo manadas e rebanhos; “rebanhos” é corrente e permite distingui-lo do termo mais amplo seguinte.
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: e todos os nossos animais
  rationale: בְּהֵמָה é um termo amplo para animais, sobretudo domésticos. “Todos os nossos animais” preserva essa abrangência e a ênfase na totalidade.
- source_word: יִהְיוּ
  choice: permanecerão
  rationale: O verbo significa literalmente “serão/estarão”, mas o contexto indica que essas pessoas e animais ficarão para trás enquanto os homens seguem para a guerra.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo simples; “ali” retoma naturalmente o lugar já indicado no contexto.
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: nas cidades de Gileade
  rationale: Tradução direta da expressão locativa; “cidades” é uma equivalência convencional de עָרִים, e “Gileade” é a forma portuguesa estabelecida do topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição semântica entre מִקְנֶה e בְּהֵמָה foi mantida de modo natural por “rebanhos” e “animais”; a vírgula antes de “nas cidades de Gileade” favorece a leitura do complemento locativo.
