base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: pt
  text: e Nebo[a], e Baal-Meon, cujos nomes foram mudados, e Sibma. E deram nomes às cidades que construíram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com os nomes mudados»; ou: «cujos nomes tinham sido mudados». A expressão hebraica provavelmente indica que Nebo e Baal-Meon receberam nomes diferentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nome próprio de lugar, transliterado de modo direto e corrente em português.
- source_word: בַּעַל מְעוֹן
  choice: Baal-Meom
  rationale: Nome composto de lugar; a forma com hífen preserva seus componentes e favorece a leitura. «Meom» reflete a adaptação portuguesa usual da consoante final.
- source_word: מוּסַבֹּת שֵׁם
  choice: cujos nomes foram mudados
  rationale: O particípio passivo com «nome» indica mudança de nomes. A formulação preserva o sentido resultativo e associa naturalmente a expressão a Nebo e Baal-Meom, sem reduzir a construção ao simples verbo «renomear».
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Transliteração portuguesa clara do nome próprio.
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת אֶת שְׁמוֹת הֶעָרִים
  choice: deram nomes às cidades
  rationale: Expressão idiomática em português para o ato de atribuir nomes, sem reproduzir de maneira artificial a repetição lexical hebraica.
- source_word: אֲשֶׁר בָּנוּ
  choice: que construíram
  rationale: Traduz o sentido normal de בנה, «construir». Embora o contexto possa envolver reconstrução, o versículo não a explicita.
