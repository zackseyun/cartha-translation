base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/037.yaml
  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: pt
  text: E os filhos de Rúben construíram Hesbom[a], Eleale e Quiriataim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os rubenitas construíram Hesbom, Eleale e Quiriataim”.'
    reason: 'Alternativa lexical: ''filhos de Rúben'' é a forma mais literal, enquanto ''rubenitas'' expressa de modo idiomático a referência aos descendentes tribais.'
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: E os filhos de Rúben
  rationale: A expressão preserva a forma hebraica e a ênfase na descendência tribal; em português, também pode designar coletivamente os rubenitas.
- source_word: בָּנוּ
  choice: construíram
  rationale: O qal perfeito de בנה tem como sentido básico 'construir'. Embora o contexto possa envolver reconstrução ou restauração das cidades, o texto não explicita essa nuance.
- source_word: אֶת / וְאֶת / וְאֵת
  choice: '[não traduzido separadamente]'
  rationale: O marcador hebraico de objeto direto não tem equivalente independente em português e é expresso pela sintaxe normal.
- source_word: חֶשְׁבּוֹן
  choice: Hesbom
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: אֶלְעָלֵא
  choice: Eleale
  rationale: Transliteração portuguesa clara do topônimo, sem a terminação gráfica inglesa 'h'.
- source_word: קִרְיָתָיִם
  choice: Quiriataim
  rationale: Transliteração adaptada à ortografia portuguesa, preservando de modo reconhecível o nome hebraico.
