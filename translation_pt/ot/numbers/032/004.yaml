  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: pt
  text: A terra que Yahweh feriu diante da comunidade de Israel[a] é uma terra própria para a criação de animais[b], e os teus servos possuem animais de criação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «assembleia de Israel».
    reason: lexical_alternative
  - marker: b
    text: Ou «terra para o gado»; o termo hebraico abrange animais domésticos em geral, não apenas bovinos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: A terra
  rationale: Mantém o sentido geográfico imediato de אֶרֶץ e seu artigo definido.
- source_word: הִכָּה
  choice: feriu
  rationale: Preserva a força do verbo נכה e a formulação hebraica, que apresenta a terra como objeto da ação divina, sem restringir o sentido à paráfrase interpretativa «derrotou».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִפְנֵי
  choice: diante de
  rationale: 'Reproduz o sentido espacial e público da expressão: a ação ocorreu perante a comunidade de Israel.'
- source_word: עֲדַת יִשְׂרָאֵל
  choice: a comunidade de Israel
  rationale: Comunica de modo natural e amplo a coletividade reunida designada por עֵדָה; «assembleia» permanece uma alternativa possível.
- source_word: אֶרֶץ מִקְנֶה
  choice: terra para o gado
  rationale: Expressa a adequação da terra à criação de animais e mantém concisão próxima do hebraico.
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: e os teus servos têm gado
  rationale: Converte naturalmente a construção possessiva com לְ em português e preserva a autodesignação respeitosa dos falantes.
- source_word: מִקְנֶה
  choice: gado
  rationale: Designa coletivamente os animais domésticos possuídos; no contexto, não precisa limitar-se a bovinos e permite conservar a repetição do termo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Alcance da ação expressa por הִכָּה
  choice: feriu
  alternative: derrotou
  rationale: «Feriu» conserva a imagem e a tensão da construção hebraica, cujo objeto gramatical é «a terra»; «derrotou» explicitaria o sentido militar, mas também acrescentaria uma interpretação sobre os habitantes.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservou-se a repetição de «gado», correspondente à repetição de מִקְנֶה, e a forma de tratamento «teus servos», adequada ao discurso respeitoso dirigido a Moisés.
