lexical_decisions:
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: os filhos de Gade e os filhos de Rúben
  rationale: Mantém a designação hebraica dos grupos tribais e a repetição enfática da construção.
- source_word: וַיָּבֹאוּ
  choice: foram falar
  rationale: No contexto, o verbo de movimento introduz uma aproximação às autoridades; esta formulação é natural em português e se liga ao ato de falar sem alterar o sentido.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: líderes da comunidade
  rationale: “Líderes” comunica a função de נְשִׂיאִים neste contexto, enquanto “comunidade” expressa a assembleia coletiva de Israel de modo claro e contemporâneo.
- source_word: לֵאמֹר
  choice: 'Eles disseram:'
  rationale: Converte a fórmula hebraica introdutória de discurso em uma abertura natural e explícita para a fala que segue no versículo seguinte.
