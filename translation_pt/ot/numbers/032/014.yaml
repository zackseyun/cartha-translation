id: NUM.32.14
reference: Numbers 32:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: pt
  text: E eis que vocês se levantaram no lugar de seus pais, uma geração de homens pecadores[a], para aumentar ainda mais a ira ardente[b] de Yahweh contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um aumento de homens pecadores” ou “uma descendência de homens pecadores”. O termo hebraico pode indicar aumento ou descendência; “geração” ressalta aqui a sucessão dos pais pelos filhos.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o ardor do nariz de Yahweh”, expressão idiomática hebraica que indica ira intensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força enfática e demonstrativa da expressão hebraica no início da repreensão. Embora levemente solene, é clara e adequada ao registro bíblico.
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: vocês se levantaram no lugar de seus pais
  rationale: Mantém a imagem verbal de קום e expressa com naturalidade a ideia de sucessão contida em תַּחַת neste contexto.
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: uma geração de homens pecadores
  rationale: תַּרְבּוּת pode indicar aumento, descendência ou grupo resultante. “Geração” comunica aqui a continuidade entre pais e filhos, enquanto “homens pecadores” preserva o masculino explícito e a acusação moral.
- source_word: לִסְפּוֹת עוֹד
  choice: para aumentar ainda mais
  rationale: Expressa de modo idiomático a ideia de acrescentar ou intensificar algo já existente.
- source_word: חֲרוֹן אַף
  choice: ira ardente
  rationale: Conserva a metáfora de ardor presente no idioma hebraico, sem reproduzir de modo obscuro a referência literal ao nariz.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל יִשְׂרָאֵל
  choice: contra Israel
  rationale: Com um termo de ira, אֶל indica o alvo contra o qual ela se dirige; “contra” é a formulação portuguesa natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Masculino plural em אֲנָשִׁים חַטָּאִים
  choice: homens pecadores
  alternative: pessoas pecadoras; pecadores
  rationale: O substantivo hebraico é masculino plural e, no contexto, Moisés se dirige aos homens representantes das tribos; a tradução conserva essa especificidade.
translation_notes:
  register: Português contemporâneo, claro e solene, com boa legibilidade brasileira e compreensão internacional. “E eis que” mantém deliberadamente a ênfase retórica do hebraico; “ira ardente” preserva a imagem sem resultar obscura. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
