  yaml_path: translation/ot/numbers/032/042.yaml
  text: And Nobah went and captured Kenath and its villages[a], and called it Nobah, after his own name.
translation:
  language: pt
  text: Noba foi e conquistou Quenate e os povoados que dependiam dela[a], e lhe deu o nome de Noba, conforme o seu próprio nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “suas filhas”, expressão que se refere aos povoados menores dependentes de Quenate.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹבַח
  choice: Noba
  rationale: Nome próprio pessoal, transliterado na forma portuguesa tradicional e legível.
- source_word: הָלַךְ
  choice: foi
  rationale: Verbo simples de movimento na sequência narrativa; evita acrescentar uma ideia não expressa no hebraico.
- source_word: וַיִּלְכֹּד
  choice: conquistou
  rationale: No contexto militar, לכד indica tomar ou capturar uma localidade; “conquistou” é natural em português.
- source_word: קְנָת
  choice: Quenate
  rationale: Topônimo transliterado de modo compatível com a fonologia e a ortografia portuguesas.
- source_word: בְּנֹתֶיהָ
  choice: os povoados que dependiam dela
  rationale: Literalmente “suas filhas”; aqui é uma expressão para assentamentos menores subordinados à cidade principal. A tradução comunica o referente, e a nota preserva a forma hebraica.
- source_word: וַיִּקְרָא לָהּ
  choice: lhe deu o nome de
  rationale: A construção קרא + ל expressa o ato de nomear; esta formulação é clara e natural em português.
- source_word: נֹבַח
  choice: Noba
  rationale: Mantém a identidade formal entre o nome do conquistador e o novo nome da cidade.
- source_word: בִּשְׁמוֹ
  choice: conforme o seu próprio nome
  rationale: Indica que a cidade recebeu o nome do conquistador; “próprio” explicita naturalmente a referência reflexiva sem alterar o sentido.
