  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: pt
  text: 'Mas Moisés disse aos filhos de Gade e aos filhos de Rúben: “Será que os irmãos de vocês[b] irão à guerra[a], enquanto vocês ficarão aqui?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irão à batalha”. O hebraico emprega uma expressão comum para entrar em conflito militar.
    reason: lexical_alternative
  - marker: b
    text: “Os irmãos de vocês” refere-se aos demais israelitas, pertencentes às outras tribos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mas Moisés disse
  rationale: Embora o waw narrativo possa ser vertido por “e”, o contexto introduz uma objeção de Moisés; “mas” expressa naturalmente esse contraste em português.
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: aos filhos de Gade e aos filhos de Rúben
  rationale: Mantém a forma hebraica בני e identifica os descendentes ou grupos tribais sem substituí-la por gentílicos.
- source_word: הַאַחֵיכֶם
  choice: os irmãos de vocês
  rationale: Reproduz o termo familiar hebraico e preserva sua força retórica; no contexto, designa os israelitas das outras tribos.
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: irão à guerra
  rationale: Expressa em português corrente o idioma hebraico de entrar ou partir para o conflito militar. O futuro dentro da pergunta retórica comunica a censura de Moisés.
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: enquanto vocês ficarão aqui
  rationale: “Enquanto” torna claro o contraste simultâneo; “ficarão aqui” comunica naturalmente ישב neste contexto, em que a questão é permanecer no local, não a postura física de sentar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “aos filhos de” preserva a estrutura tribal do hebraico. A pergunta mantém o tom de censura sem ampliar seu conteúdo.
