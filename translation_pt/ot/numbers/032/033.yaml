  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם מֹשֶׁ֡ה לִ/בְנֵי גָד֩ וְ/לִ/בְנֵ֨י רְאוּבֵ֜ן וְ/לַ/חֲצִ֣י שֵׁ֣בֶט מְנַשֶּׁ֣ה בֶן יוֹסֵ֗ף אֶת מַמְלֶ֨כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י וְ/אֶת מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן הָ/אָ֗רֶץ לְ/עָרֶ֨י/הָ֙ בִּ/גְבֻלֹ֔ת עָרֵ֥י הָ/אָ֖רֶץ סָבִֽיב׀־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: pt
  text: Assim, Moisés deu aos filhos de Gade, aos filhos de Rúben e à meia tribo de Manassés, filho de José, o reino de Seom, rei dos amorreus, e o reino de Ogue, rei de Basã — a terra com suas cidades em seus territórios, as cidades da terra ao redor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a terra, suas cidades com seus territórios, as cidades da terra ao redor”. A frase hebraica final tem uma sintaxe condensada, e são possíveis várias traduções muito semelhantes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: O verbo נתן, neste contexto narrativo, indica que Moisés concedeu ou atribuiu o território; “deu” é direto, natural e preserva o estilo simples do relato.
- source_word: לָהֶם
  choice: aos filhos de Gade, aos filhos de Rúben e à meia tribo de Manassés
  rationale: O objeto indireto é expresso naturalmente em português junto à enumeração dos destinatários; repetir “a eles” antes da lista seria pouco idiomático.
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: aos filhos de Gade, aos filhos de Rúben
  rationale: “Filhos de” reflete o idioma tribal e familiar de בְּנֵי sem recorrer aos gentílicos interpretativos “gaditas” e “rubenitas”.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: e à meia tribo de Manassés
  rationale: Mantém de modo conciso a referência hebraica à metade tribal que recebeu território a leste do Jordão.
- source_word: בֶן יוֹסֵף
  choice: filho de José
  rationale: Preserva a identificação genealógica explícita de Manassés.
- source_word: מַמְלֶכֶת
  choice: reino
  rationale: ממלכה designa o reino ou domínio antes governado por cada rei; “reino” é o equivalente português mais direto.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Seom, rei dos amorreus
  rationale: Mantém a estrutura apositiva e entende o singular coletivo הָאֱמֹרִי como referência ao povo amorreu.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Ogue, rei de Basã
  rationale: Reproduz diretamente a sequência de nome e título, usando as formas portuguesas tradicionais dos nomes próprios.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: אֶרֶץ refere-se aqui ao território mencionado, mas “terra” conserva o termo amplo do hebraico.
- source_word: לְעָרֶיהָ
  choice: com suas cidades
  rationale: A expressão hebraica é elíptica; “com suas cidades” comunica naturalmente que a concessão abrangia a terra e suas cidades.
- source_word: בִּגְבֻלֹת
  choice: em seus territórios
  rationale: O plural de גְּבוּל pode indicar limites ou extensões territoriais. “Em seus territórios” é legível sem eliminar a noção geográfica.
- source_word: עָרֵי הָאָרֶץ סָבִיב
  choice: as cidades da terra ao redor
  rationale: Preserva a formulação comprimida e parcialmente apositiva do encerramento hebraico, sem impor uma única relação sintática.
