base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: pt
  text: Mas, se eles não atravessarem armados com vocês, receberão uma propriedade entre vocês na terra de Canaã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «serão estabelecidos entre vocês na terra de Canaã». O verbo hebraico pode indicar o estabelecimento de alguém numa posse, e não apenas o ato de recebê-la.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Mas, se
  rationale: No contexto, a conjunção introduz a alternativa contrastante à condição do versículo anterior; «Mas, se» comunica esse valor adversativo em português natural.
- source_word: יַעַבְרוּ
  choice: atravessarem
  rationale: O verbo עבר denota atravessar ou passar para o outro lado; aqui se refere à travessia para Canaã.
- source_word: חֲלוּצִים
  choice: armados
  rationale: O termo descreve homens equipados ou dispostos para a guerra; «armados» é conciso e adequado ao contexto militar.
- source_word: אִתְּ/כֶם
  choice: com vocês
  rationale: Expressa diretamente o acompanhamento das demais tribos de Israel.
- source_word: וְ/נֹאחֲזוּ
  choice: receberão uma propriedade
  rationale: O nifal de אחז, neste contexto de repartição territorial, pode indicar ser estabelecido numa posse ou recebê-la; a formulação preserva o sentido passivo-resultante em português corrente.
- source_word: בְ/תֹכְ/כֶם
  choice: entre vocês
  rationale: Indica que sua porção estaria no meio das outras tribos, a oeste do Jordão.
- source_word: בְּ/אֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém a expressão geográfica completa do hebraico.
