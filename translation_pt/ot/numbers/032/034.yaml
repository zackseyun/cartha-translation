lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: construíram
  rationale: O verbo בנה descreve diretamente a ação de construir. Neste contexto, pode implicar reconstrução ou fortificação das cidades, mas essas nuances não são exigidas pelo hebraico e, por isso, ficam registradas em nota.
- source_word: בְנֵי גָד
  choice: Os filhos de Gade
  rationale: Reproduz a expressão hebraica de parentesco de modo claro e tradicional em português; no contexto, refere-se aos membros da tribo de Gade.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: Partícula que marca o objeto direto definido em hebraico, sem equivalente lexical independente em português.
- source_word: דִּיבֹן
  choice: Dibom
  rationale: Forma consagrada em português para o nome do lugar.
- source_word: עֲטָרֹת
  choice: Atarote
  rationale: Transliteração adaptada às convenções fonológicas e ortográficas do português.
- source_word: עֲרֹעֵר
  choice: Aroer
  rationale: Transliteração corrente e clara do nome do lugar em português.
