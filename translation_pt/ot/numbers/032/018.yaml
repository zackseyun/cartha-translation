review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a negação, o compromisso futuro, o retorno às casas e a limitação temporal. «Tomar posse de sua herança» comunica bem o sentido de הִתְנַחֵל ... נַחֲלָתוֹ no contexto de repartição da terra. A formulação distributiva deve, porém, ficar mais diretamente ligada a «filhos de Israel», para refletir com clareza אִישׁ («cada um»).
  naturalness: «tenham tomado posse, cada um, de sua herança» é compreensível, mas a intercalação depois de «tomado posse» é um pouco truncada no português moderno. Antepor «cada um dos filhos de Israel» torna a frase mais fluente e elimina qualquer momentânea ambiguidade sobre quem é distribuído.
  terminology: «Filhos de Israel» preserva legitimamente a expressão hebraica בְּנֵי יִשְׂרָאֵל, e a nota com «os israelitas» oferece uma alternativa idiomática apropriada. «Herança» é termo adequado para a porção territorial atribuída.
  issues:
