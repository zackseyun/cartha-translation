    issue: Posição pouco natural de «cada um»
    rationale: O hebraico expressa distribuição sobre «os filhos de Israel». Em português, «cada um dos filhos de Israel tenha tomado posse de sua herança» explicita essa relação de modo mais natural e preciso.
