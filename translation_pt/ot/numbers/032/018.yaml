  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: pt
  text: Não voltaremos para nossas casas até que cada um dos filhos de Israel tenha tomado posse de sua herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os israelitas”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: Não voltaremos
  rationale: O imperfeito qal na primeira pessoa do plural expressa, neste contexto, o compromisso quanto a uma ação futura; a negação é reproduzida diretamente.
- source_word: אֶל בָּתֵּינוּ
  choice: para nossas casas
  rationale: A preposição indica direção, e “voltar para” é uma construção natural em português. “Casas” preserva o sentido concreto do substantivo hebraico.
- source_word: עַד
  choice: até que
  rationale: Marca o limite temporal da decisão de não voltar e introduz naturalmente uma oração verbal em português.
- source_word: הִתְנַחֵל
  choice: tenham tomado posse
  rationale: O hitpael de נחל indica entrar na posse da terra recebida como herança. A locução comunica tanto a apropriação efetiva quanto o contexto de repartição territorial.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico, sem impedir que a alternativa idiomática “os israelitas” seja registrada em nota.
- source_word: אִישׁ
  choice: cada um
  rationale: Na construção distributiva, אִישׁ individualiza os membros do grupo; “cada um” reproduz essa função com naturalidade.
- source_word: נַחֲלָתוֹ
  choice: de sua herança
  rationale: Refere-se à porção territorial atribuída a cada israelita. “Herança” conserva o vocabulário fundiário e familiar do texto.
theological_decisions:
- issue: Expressão pactual masculina בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal conserva a forma masculina e familiar do hebraico, enquanto a nota oferece a formulação coletiva mais idiomática sem alterar a referência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A colocação de “cada um” após “tomado posse” mantém o sujeito coletivo e, ao mesmo tempo, reproduz a distribuição individual expressa por אִישׁ.
