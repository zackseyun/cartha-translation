  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: pt
  text: Mas os teus servos atravessarão, todos equipados para o combate[a], diante de Yahweh[b], para a guerra[c], conforme o meu senhor diz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos armados para o combate” ou “todos aptos para o serviço militar”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica “diante de Yahweh” indica que a participação na campanha ocorre na presença e sob a autoridade de Yahweh.
    reason: cultural_note
  - marker: c
    text: 'Ou: “para a batalha”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: Mas os teus servos
  rationale: עֶבֶד, neste contexto de tratamento deferente dirigido a Moisés, significa “servo”; o waw é entendido adversativamente à luz do contexto anterior.
- source_word: יַעַבְרוּ
  choice: atravessarão
  rationale: O verbo עבר descreve a travessia para participar da campanha; o futuro expressa o compromisso assumido pelos falantes.
- source_word: כָּל חֲלוּץ צָבָא
  choice: todos equipados para o combate
  rationale: A construção descreve cada integrante preparado ou armado para o serviço militar. O plural natural em português transmite o valor distributivo de כָּל com o singular חֲלוּץ.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva o sentido espacial e teológico de agir na presença e sob a autoridade de Yahweh, mantendo o nome divino explícito.
- source_word: לַמִּלְחָמָה
  choice: para a guerra
  rationale: A preposição לְ indica direção ou finalidade; “para a guerra” conserva essa amplitude sem explicitar além do hebraico o ato de lutar.
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: conforme o meu senhor diz
  rationale: כַּאֲשֶׁר indica conformidade; אֲדֹנִי é um tratamento respeitoso dirigido a Moisés, e o particípio דֹּבֵר tem valor presente no discurso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto contém o Tetragrama; “Yahweh” preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido de לִפְנֵי na campanha militar
  choice: diante de Yahweh
  alternative: na presença de Yahweh
  rationale: “Diante de” mantém a formulação concreta e deixa intactas as ideias relacionadas de presença, supervisão e autoridade divinas, sem reduzir a expressão a apenas uma delas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular (“teus”) e “meu senhor” preservam o tratamento direto e deferente a Moisés. A ordem das notas segue a ocorrência dos marcadores no texto.
