  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: pt
  text: Eles subiram até o vale de Escol[a] e viram a terra, e tiraram dos israelitas[b] a coragem de entrar na terra que Yahweh lhes havia dado.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode designar um vale por onde corre um riacho, muitas vezes sazonal; daí a tradução possível “ribeiro de Escol”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”. O singular “coração” apresenta coletivamente a disposição ou coragem do povo.'
    reason: source_form
  - marker: c
    text: Yahweh representa o nome divino יהוה, tradicionalmente traduzido como “SENHOR”.
    reason: divine_name
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido direcional comum de עלה e soa natural no contexto da viagem dos espias.
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: até o vale de Escol
  rationale: עַד indica o limite alcançado; נַחַל pode designar um vale, especialmente o leito de um curso d’água sazonal. “Vale” é claro e acessível, e Escol translitera o topônimo hebraico.
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: e viram a terra
  rationale: Tradução direta de ראה, sem acrescentar a ideia mais específica de inspecionar ou explorar.
- source_word: וַיָּנִיאוּ אֶת לֵב
  choice: tiraram ... a coragem
  rationale: O hifil de נוא expressa causar recuo, aversão ou desânimo; לֵב, neste contexto, representa a disposição ou coragem interior. A expressão portuguesa comunica o efeito sem apagar a imagem antropológica do hebraico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: israelitas
  rationale: Equivalente português natural da designação nacional hebraica “filhos de Israel”; a forma literal é registrada em nota.
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: de entrar na terra
  rationale: Depois de “tiraram ... a coragem”, a construção portuguesa expressa naturalmente o impedimento ou resultado indicado por לְבִלְתִּי com o infinitivo בֹא.
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: que Yahweh lhes havia dado
  rationale: O mais-que-perfeito composto ajusta-se à narração retrospectiva; Yahweh representa diretamente o nome divino יהוה.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama, nome pessoal da aliança. “Yahweh” o representa diretamente, enquanto a nota informa a tradição de substituí-lo por “SENHOR”.
- issue: Natureza da ação expressa por וַיָּנִיאוּ
  choice: tiraram dos israelitas a coragem
  alternative: desencorajaram os israelitas / fizeram o coração dos filhos de Israel recuar
  rationale: A escolha mantém a dimensão interior de לֵב e o efeito causativo do verbo, sem decidir além do texto se houve apenas desânimo psicológico ou uma recusa deliberada.
translation_notes:
  register: Português atual, digno e de leitura fluente, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A coordenação com “e” acompanha o fluxo narrativo hebraico; “tiraram ... a coragem” conserva de modo idiomático a imagem do coração como centro da disposição interior.
