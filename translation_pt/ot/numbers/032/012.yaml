source:
  edition: WLC
  text: בִּלְתִּ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ הַ/קְּנִזִּ֔י וִ/יהוֹשֻׁ֖עַ בִּן נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: pt
  text: exceto Calebe, filho de Jefoné, o quenezeu, e Josué, filho de Num, porque seguiram Yahweh plenamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seguiram Yahweh de todo o coração”. A expressão hebraica diz literalmente “encheram após Yahweh” e expressa lealdade completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְתִּי
  choice: exceto
  rationale: A partícula introduz as únicas exceções ao juízo mencionado no contexto anterior; “exceto” é claro e natural em português.
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: Calebe, filho de Jefoné
  rationale: Emprega as formas portuguesas consagradas dos nomes e traduz בֶּן pela expressão genealógica “filho de”.
- source_word: הַקְּנִזִּי
  choice: o quenezeu
  rationale: Designação gentílica ou de clã de Calebe, vertida pela forma tradicional e inteligível em português bíblico.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: e Josué, filho de Num
  rationale: A conjunção liga a segunda exceção; os nomes seguem formas portuguesas estabelecidas, e בִּן é traduzido como “filho de”.
- source_word: כִּי
  choice: porque
  rationale: Neste contexto, a conjunção apresenta a razão pela qual Calebe e Josué foram excetuados.
- source_word: מִלְאוּ אַחֲרֵי
  choice: seguiram plenamente
  rationale: O idioma hebraico, literalmente relacionado a “encher após”, expressa adesão completa e lealdade integral; a formulação preserva a imagem de seguir sem se tornar obscura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Sentido da lealdade de Calebe e Josué
  choice: seguiram plenamente
  alternative: seguiram de todo o coração
  rationale: A expressão comunica fidelidade completa, mas o texto não especifica aqui uma formulação psicológica; “plenamente” mantém o alcance amplo do idioma hebraico.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas bíblicas correntes. A ordem e a concisão do hebraico foram preservadas sempre que naturais em português.
