  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: pt
  text: Mas, se vocês não fizerem assim, eis que terão pecado contra Yahweh; e saibam que o pecado de vocês os encontrará[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “a culpa de vocês os alcançará”. A expressão hebraica indica que o pecado inevitavelmente será exposto e trará consequências.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com a instrução anterior; “Mas, se” expressa essa força de modo natural em português.
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: vocês não fizerem assim
  rationale: Retoma diretamente o compromisso mencionado no contexto anterior, preservando a forma concisa do hebraico.
- source_word: הִנֵּה חֲטָאתֶם
  choice: terão pecado
  rationale: No contexto condicional, o perfeito hebraico apresenta como consumado o resultado da desobediência. O futuro composto comunica naturalmente essa consequência em português; a força enfática de הִנֵּה é transmitida pela formulação direta da advertência.
- source_word: לַיהוָה
  choice: contra Yahweh
  rationale: Com o verbo “pecar”, a preposição indica aquele contra quem se comete o pecado; o nome divino é transliterado como “Yahweh”.
- source_word: וּדְעוּ
  choice: E saibam
  rationale: Preserva o imperativo plural e a exigência de reconhecer com certeza a consequência anunciada.
- source_word: חַטַּאתְכֶם אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: o pecado de vocês os encontrará
  rationale: Mantém a personificação e a imagem hebraica de o pecado encontrar os culpados, sem reduzir a expressão apenas à descoberta pública ou ao castigo.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Sentido de o pecado “encontrar” os transgressores
  choice: 'Preservar a personificação: “o pecado de vocês os encontrará”'
  alternative: “a culpa de vocês os alcançará” ou “o pecado de vocês será descoberto”
  rationale: O hebraico permite implicações de exposição, culpa e consequência inevitável, mas não especifica apenas uma delas. A tradução conserva essa tensão sem impor uma interpretação exclusiva.
translation_notes:
  register: Português moderno, claro e solene, com “vocês” para explicitar o plural. A sintaxe direta mantém o tom enfático de advertência, e a forma “Yahweh” preserva o nome divino.
