- source_word: נְבוֹ
  choice: Nebo
  rationale: Forma tradicional e transparente do topônimo em português.
- source_word: בְּעֹן
  choice: Beom
  rationale: Translitera a forma curta encontrada aqui, sem substituí-la pela forma relacionada e expandida Baal-Meom.
- source_word: וְ / וּ
  choice: vírgulas, com “e” antes do último nome
  rationale: Em português, a coordenação assindética interna e a conjunção final produzem uma lista natural e digna; o valor coordenativo do hebraico permanece claro.
