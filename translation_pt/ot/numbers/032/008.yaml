translation:
  language: pt
  text: Foi isso que os pais de vocês fizeram quando eu os enviei de Cades-Barnéia para ver a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para inspecionar a terra” ou “para explorar a terra”. O verbo hebraico significa literalmente “ver”, mas, neste contexto, refere-se ao reconhecimento da terra.
