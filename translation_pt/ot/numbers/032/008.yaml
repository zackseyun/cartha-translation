lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: Foi isso que fizeram
  rationale: Expressa de modo natural a referência demonstrativa a uma conduta anterior e mantém o valor simples do verbo עשה.
- source_word: אֲבֹתֵיכֶם
  choice: os pais de vocês
  rationale: Preserva a formulação hebraica e a força geracional do contexto; “antepassados” seria possível, mas menos direto.
- source_word: בְּשָׁלְחִי אֹתָם
  choice: quando eu os enviei
  rationale: A preposição ב com o infinitivo construto e sufixo de primeira pessoa tem aqui sentido temporal; o pronome retoma a geração anterior.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Cades-Barneia
  rationale: Transliteração portuguesa corrente do topônimo composto.
- source_word: לִרְאוֹת אֶת הָאָרֶץ
  choice: para ver a terra
  rationale: Mantém o sentido lexical básico de ראה, “ver”, sem tornar explícita no texto principal a ideia contextual mais específica de explorar ou inspecionar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Os pais de vocês” conserva a referência geracional do hebraico sem recorrer a uma forma excessivamente arcaica. O marcador de nota aparece no texto principal.
