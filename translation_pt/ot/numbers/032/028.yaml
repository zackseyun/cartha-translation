base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: pt
  text: Assim, Moisés deu ordens a respeito deles a Eleazar, o sacerdote, a Josué, filho de Num, e aos chefes das casas paternas das tribos dos israelitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os chefes dos pais das tribos dos filhos de Israel”, uma expressão administrativa referente aos líderes das unidades familiares ou ancestrais das tribos de Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: deu ordens
  rationale: O verbo צוה expressa uma ordem ou instrução revestida de autoridade; “deu ordens” mantém essa força e soa natural no contexto administrativo.
- source_word: לָהֶם
  choice: a respeito deles
  rationale: O pronome provavelmente retoma os rubenitas e gaditas do contexto anterior. Esta formulação distingue aqueles sobre quem recaem as instruções dos líderes que as recebem.
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: a Eleazar, o sacerdote
  rationale: Com צוה, o marcador de objeto introduz a pessoa incumbida de cumprir a ordem; em português, a regência natural de “dar ordens” pede a preposição “a”.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas portuguesas tradicionais dos nomes e traduz claramente o patronímico hebraico.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: os chefes das famílias dos clãs das tribos
  rationale: A expressão administrativa hebraica é condensada e pode denotar chefes de unidades ancestrais dentro da organização tribal. “Famílias dos clãs das tribos” torna compreensíveis seus níveis sociais sem recorrer à expressão pouco natural “casas dos pais”.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dos israelitas
  rationale: O sentido idiomático é o povo de Israel; “israelitas” é claro, atual e preserva a referência étnico-tribal.
