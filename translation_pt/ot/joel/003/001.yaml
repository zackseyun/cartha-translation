source:
  edition: WLC
  text: וְ/הָיָ֣ה אַֽחֲרֵי כֵ֗ן אֶשְׁפּ֤וֹךְ אֶת רוּחִ/י֙ עַל כָּל בָּשָׂ֔ר וְ/נִבְּא֖וּ בְּנֵי/כֶ֣ם וּ/בְנֽוֹתֵי/כֶ֑ם זִקְנֵי/כֶם֙ חֲלֹמ֣וֹת יַחֲלֹמ֔וּ/ן בַּח֣וּרֵי/כֶ֔ם חֶזְיֹנ֖וֹת יִרְאֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/001.yaml
  text: And it will happen afterward that I will pour out my Spirit on all flesh[a]; and your sons and your daughters will prophesy, your old men will dream dreams[b], your young men will see visions.
translation:
  language: pt
  text: E acontecerá, depois disso, que derramarei o meu Espírito[b] sobre toda carne[a]; seus filhos e suas filhas profetizarão; seus homens mais velhos sonharão sonhos, e seus rapazes verão visões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sobre toda a humanidade» ou «sobre todas as pessoas»; em hebraico, «sobre toda carne».
    reason: lexical_alternative
  - marker: b
    text: «Meu Espírito» também pode ser traduzido «meu espírito», mas o contexto de capacitação profética favorece a referência ao Espírito divino.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: A fórmula hebraica introduz um acontecimento futuro. A tradução conserva a força preditiva em português atual e digno.
- source_word: אַחֲרֵי כֵן
  choice: depois disso
  rationale: Expressa naturalmente a sequência temporal sem especificar além do texto.
- source_word: אֶשְׁפּוֹךְ
  choice: derramarei
  rationale: Mantém a metáfora concreta e usual do verbo hebraico שפך.
- source_word: רוּחִי
  choice: o meu Espírito
  rationale: O contexto de capacitação profética favorece a referência ao Espírito de Deus. A inicial maiúscula segue a convenção portuguesa, embora o hebraico não marque essa distinção gráfica.
- source_word: עַל כָּל בָּשָׂר
  choice: sobre toda carne
  rationale: Preserva o idioma hebraico, sua dimensão corpórea e sua amplitude, sem decidir prematuramente entre toda a humanidade e todas as categorias de pessoas.
- source_word: וְנִבְּאוּ
  choice: profetizarão
  rationale: Expressa diretamente a fala profética resultante do derramamento do Espírito.
- source_word: בְּנֵיכֶם וּבְנוֹתֵיכֶם
  choice: Seus filhos e suas filhas
  rationale: Conserva a menção explícita tanto aos descendentes do sexo masculino quanto aos do sexo feminino.
- source_word: זִקְנֵיכֶם
  choice: seus idosos
  rationale: O contraste com os jovens indica idade, não função oficial. “Idosos” é natural, abrangente no uso português e evita a possível leitura institucional de “anciãos”.
- source_word: חֲלֹמוֹת יַחֲלֹמוּן
  choice: terão sonhos
  rationale: O hebraico emprega uma construção cognata, literalmente “sonharão sonhos”. Em português moderno, “terão sonhos” comunica o sentido com maior naturalidade; a repetição literal soaria marcada de modo não necessário.
- source_word: בַּחוּרֵיכֶם
  choice: seus jovens
  rationale: No paralelismo, refere-se aos jovens do sexo masculino em contraste com os homens idosos; em português, “seus jovens” é conciso e natural, preservando esse referente contextual.
- source_word: חֶזְיֹנוֹת יִרְאוּ
  choice: terão visões
  rationale: “Ter visões” é a expressão profética natural em português e transmite com clareza o hebraico literalmente formulado como “ver visões”.
theological_decisions:
- issue: Sentido de רוּחִי no contexto do derramamento profético
  choice: o meu Espírito
  alternative: o meu espírito
  rationale: A profecia, os sonhos e as visões decorrentes do derramamento favorecem a identificação com o Espírito divino. A capitalização é editorial e não uma distinção presente na escrita hebraica.
- issue: Amplitude de כָּל בָּשָׂר
  choice: toda carne
  alternative: toda a humanidade / todas as pessoas
  rationale: A formulação literal preserva a amplitude e a tensão do texto, sem restringi-la antecipadamente à humanidade em geral ou a todas as categorias de pessoas dentro da comunidade mencionada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram preservados, enquanto as expressões cognatas foram vertidas idiomaticamente. O pronome possessivo foi mantido nas três categorias humanas nomeadas.
