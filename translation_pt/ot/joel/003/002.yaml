  text: וְ/גַ֥ם עַל הָֽ/עֲבָדִ֖ים וְ/עַל הַ/שְּׁפָח֑וֹת בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֶשְׁפּ֖וֹךְ אֶת רוּחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/002.yaml
  text: And even on the male slaves and on the female slaves[a], in those days I will pour out my Spirit.
translation:
  language: pt
  text: E até sobre os escravos e sobre as escravas[a], naqueles dias, derramarei o meu Espírito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os servos e as servas”. Os termos hebraicos designam homens e mulheres em condição servil; “escravos” e “escravas” preservam aqui a realidade social de sujeição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: E até
  rationale: Preserva tanto a ligação aditiva com a promessa anterior quanto a ênfase inclusiva do hebraico.
- source_word: עַל הָעֲבָדִים
  choice: sobre os escravos
  rationale: “Sobre” mantém a imagem associada a “derramarei”; “escravos” explicita a condição servil indicada pelo substantivo masculino plural.
- source_word: וְעַל הַשְּׁפָחוֹת
  choice: e sobre as escravas
  rationale: Retém a repetição paralela da preposição e expressa tanto o gênero feminino quanto a condição servil do termo hebraico.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: naqueles dias
  rationale: Expressão temporal natural em português e equivalente direto da fórmula profética hebraica.
- source_word: אֶשְׁפּוֹךְ
  choice: derramarei
  rationale: Conserva a metáfora concreta de concessão abundante e a primeira pessoa singular da forma verbal.
- source_word: אֶת רוּחִי
  choice: o meu Espírito
  rationale: O contexto apresenta o espírito do próprio Deus sendo derramado; a inicial maiúscula sinaliza esse referente divino no uso editorial português.
theological_decisions:
- issue: Tradução dos termos de condição social עֲבָדִים / שְׁפָחוֹת
  choice: escravos / escravas
  alternative: servos / servas
  rationale: Os termos podem abranger serviço e escravidão, mas aqui a condição social subordinada é relevante para a amplitude surpreendente da promessa. “Escravos” e “escravas” preservam essa realidade sem suavizá-la; a nota registra a alternativa lexical.
- issue: Referente de רוּחִי
  choice: meu Espírito
  alternative: meu espírito
  rationale: No contexto, quem fala é Deus e aquilo que ele derrama sobre pessoas é seu próprio Espírito. A capitalização é uma convenção editorial e não acrescenta uma qualificação ausente do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida próxima ao hebraico, mas a pontuação favorece a fluência. A repetição de “sobre” preserva o paralelismo e a imagem do derramamento.
