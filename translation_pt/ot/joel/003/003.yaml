  text: וְ/נָֽתַתִּי֙ מֽוֹפְתִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ דָּ֣ם וָ/אֵ֔שׁ וְ/תִֽימֲר֖וֹת עָשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/003.yaml
  text: 'And I will give wonders in the heavens and on the earth: blood and fire and columns of smoke[a].'
translation:
  language: pt
  text: 'E darei prodígios nos céus e na terra: sangue, fogo e colunas de fumaça[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pilares de fumaça”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: E darei
  rationale: Preserva o sentido direto de נתן, “dar/pôr”, e é natural no registro profético; “mostrarei” seria mais interpretativo.
- source_word: מוֹפְתִים
  choice: prodígios
  rationale: Expressa sinais extraordinários e assombrosos. “Prodígios” conserva a gravidade profética sem definir se os fenômenos são milagrosos, simbólicos ou ambos.
- source_word: בַּשָּׁמַיִם
  choice: nos céus
  rationale: Mantém o plural hebraico e o contraste cósmico com “na terra”, em linguagem bíblica clara e corrente.
- source_word: וּבָאָרֶץ
  choice: e na terra
  rationale: É o correspondente natural de “nos céus” e indica o âmbito terrestre sem impor uma localização mais específica.
- source_word: דָּם
  choice: sangue
  rationale: Equivalência direta do substantivo hebraico, sem paráfrase interpretativa.
- source_word: וָאֵשׁ
  choice: fogo
  rationale: Equivalência direta; a coordenação da lista é preservada de modo idiomático em português.
- source_word: וְתִימֲרוֹת עָשָׁן
  choice: e colunas de fumaça
  rationale: תִימֲרוֹת descreve formas ou massas que se elevam. “Colunas de fumaça” comunica claramente a imagem vertical em português moderno; “pilares de fumaça” permanece como alternativa possível.
theological_decisions:
- issue: Natureza dos fenômenos descritos
  choice: Sinais cósmicos da intervenção ou do juízo divino, sem especificar um esquema escatológico mais restrito
  alternative: Eventos estritamente literais ou, em contraste, imagens primordialmente simbólicas de convulsão
  rationale: A tradução conserva as imagens concretas e sua força profética, sem decidir se cada elemento deve ser entendido como literal, simbólico ou ambos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prodígios” mantém o tom profético; “fumaça” é preferido a “fumo” por sua abrangência internacional e naturalidade no Brasil. O marcador [a] aparece no texto principal.
