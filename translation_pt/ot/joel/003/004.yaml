id: JOL.3.4
reference: Joel 3:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/שֶּׁ֨מֶשׁ֙ יֵהָפֵ֣ךְ לְ/חֹ֔שֶׁךְ וְ/הַ/יָּרֵ֖חַ לְ/דָ֑ם לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/004.yaml
  text: The sun will be turned to darkness[a], and the moon to blood[c][b], before the coming of the great and fearful day of Yahweh.
translation:
  language: pt
  text: O sol se transformará em trevas, e a lua, em sangue[a], antes que venha o grande e temível dia de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a lua ficará vermelha como sangue”. Em hebraico, literalmente, “em sangue”.'
    reason: lexical_alternative
  - marker: b
    text: O nome hebraico יהוה é aqui representado por “Yahweh”; tradicionalmente, “SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: o sol
  rationale: Substantivo definido que designa o astro; tradução direta e natural.
- source_word: יֵהָפֵךְ
  choice: se transformará
  rationale: O nifal imperfeito de הפך expressa mudança de estado. Em português, a construção pronominal comunica naturalmente esse valor sem eliminar a transformação anunciada.
- source_word: לְחֹשֶׁךְ
  choice: em trevas
  rationale: A preposição לְ indica o estado resultante. 'Em trevas' é idiomático e preserva a imagem profética.
- source_word: וְהַיָּרֵחַ
  choice: e a lua
  rationale: Tradução direta do substantivo definido, coordenado com a oração anterior.
- source_word: לְדָם
  choice: em sangue
  rationale: Preserva a formulação literal e incisiva do hebraico, sem decidir se a imagem é fenômeno literal ou aparência semelhante à de sangue.
- source_word: לִפְנֵי בּוֹא
  choice: antes que venha
  rationale: Expressa de maneira corrente em português a relação temporal do hebraico, literalmente 'antes da vinda de'.
- source_word: יוֹם יְהוָה
  choice: dia de Yahweh
  rationale: Mantém a expressão profética e representa o tetragrama como nome próprio, em vez de substituí-lo por um título.
- source_word: הַגָּדוֹל
  choice: grande
  rationale: Equivalente direto que abrange magnitude e importância.
- source_word: וְהַנּוֹרָא
  choice: e temível
  rationale: נורא descreve aquilo que inspira temor reverente ou pavor. 'Temível' conserva essa amplitude melhor do que opções com conotações excessivamente positivas ou moralmente negativas.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o tetragrama. 'Yahweh' preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
- issue: Natureza da imagem cósmica
  choice: Preservar 'a lua, em sangue' no texto principal
  alternative: a lua ficará vermelha como sangue
  rationale: A formulação literal mantém a força e a ambiguidade da linguagem profética, sem determinar se se trata de transformação física, aparência visual ou simbolismo apocalíptico.
- issue: Sentido de הַנּוֹרָא
  choice: temível
  alternative: assombroso; terrível
  rationale: '''Temível'' comunica que o dia inspira temor e pavor sem reduzir o termo a admiração positiva nem sugerir que o dia seja moralmente mau.'
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. A elipse em 'e a lua, em sangue' evita repetição pesada e reproduz o paralelismo hebraico. Os marcadores [a] e [b] aparecem no texto principal junto aos elementos a que se referem.
