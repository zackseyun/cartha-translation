  text: וְ/הָיָ֗ה כֹּ֧ל אֲשֶׁר יִקְרָ֛א בְּ/שֵׁ֥ם יְהוָ֖ה יִמָּלֵ֑ט כִּ֠י בְּ/הַר צִיּ֨וֹן וּ/בִ/ירוּשָׁלִַ֜ם תִּֽהְיֶ֣ה פְלֵיטָ֗ה כַּֽ/אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה וּ/בַ֨/שְּׂרִידִ֔ים אֲשֶׁ֥ר יְהוָ֖ה קֹרֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/005.yaml
  text: And it will happen that everyone who calls on the name of Yahweh will be delivered[a]; for on Mount Zion and in Jerusalem there will be escape, as Yahweh has said[c][b], among the survivors whom Yahweh calls.
translation:
  language: pt
  text: E acontecerá que todo aquele que invocar o nome de Yahweh será liberto[a], pois no monte Sião e em Jerusalém haverá escape[b], como Yahweh disse, entre os sobreviventes que Yahweh chama[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escapará”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “livramento” ou referir-se aos que escaparam, isto é, aos sobreviventes.
    reason: lexical_alternative
  - marker: c
    text: 'O versículo mantém juntas duas afirmações: as pessoas invocam o nome de Yahweh, e Yahweh chama os sobreviventes.'
    reason: theological_tension
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá
  rationale: Introduz naturalmente em português uma consequência futura, preservando a função discursiva do hebraico sem recorrer à fórmula arcaica “e há de acontecer”.
- source_word: כֹּל אֲשֶׁר
  choice: todo aquele que
  rationale: Expressa com clareza o sentido distributivo e pessoal da construção hebraica.
- source_word: יִקְרָא בְּשֵׁם יְהוָה
  choice: invocar o nome de Yahweh
  rationale: “Invocar” transmite de modo natural o apelo religioso expresso pelo idioma hebraico, sem reduzir o sentido a simplesmente pronunciar o nome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יִמָּלֵט
  choice: será liberto
  rationale: O nifal de מלט abrange ser livrado e escapar. “Será liberto” comunica resgate diante do juízo sem limitar o sentido a fuga física nem impor uma formulação soteriológica mais específica.
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלִַם
  choice: no monte Sião e em Jerusalém
  rationale: Emprega as preposições naturais em português para o monte e a cidade, mantendo sem expansão os lugares mencionados.
- source_word: תִּהְיֶה פְלֵיטָה
  choice: haverá escape
  rationale: Reflete diretamente o substantivo singular פְלֵיטָה e conserva sua amplitude entre escape e livramento, sem transformá-lo explicitamente em pessoas.
- source_word: כַּאֲשֶׁר אָמַר יְהוָה
  choice: como Yahweh disse
  rationale: Representa de forma direta o perfeito hebraico como referência a uma declaração divina anterior.
- source_word: וּבַשְּׂרִידִים
  choice: e entre os sobreviventes
  rationale: “Sobreviventes” é claro no contexto de pessoas que permanecem após o juízo e evita carregar o termo com conotações sistemáticas adicionais de “remanescente”.
- source_word: אֲשֶׁר יְהוָה קֹרֵא
  choice: aqueles que Yahweh chama
  rationale: O presente “chama” corresponde bem ao particípio hebraico, que pode expressar ação característica ou contínua, e mantém o paralelo com aqueles que invocam Yahweh.
theological_decisions:
- issue: Relação entre a invocação humana e o chamado divino
  choice: O texto mantém tanto “todo aquele que invocar” quanto “aqueles que Yahweh chama”.
  alternative: Interpretar a cláusula final como uma limitação explícita da promessa inicial, ou como mero aposto sem força delimitadora.
  rationale: O hebraico apresenta lado a lado a invocação humana e o chamado de Yahweh, sem explicar sistematicamente sua relação. A tradução preserva essa tensão.
- issue: Sentido de פְלֵיטָה no contexto do juízo
  choice: haverá escape
  alternative: haverá livramento; haverá sobreviventes; haverá um remanescente
  rationale: A escolha preserva o substantivo abstrato e sua ambiguidade lexical entre escape e livramento, enquanto a menção seguinte aos sobreviventes fornece o aspecto humano concreto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” preserva o nome divino; “invocar” mantém o caráter religioso do apelo. A formulação evita tanto arcaísmos quanto explicações denominacionais.
