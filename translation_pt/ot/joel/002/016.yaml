  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אִסְפוּ עָ֞ם קַדְּשׁ֤וּ קָהָל֙ קִבְצ֣וּ זְקֵנִ֔ים אִסְפוּ֙ עֽוֹלָלִ֔ים וְ/יֹנְקֵ֖י שָׁדָ֑יִם יֵצֵ֤א חָתָן֙ מֵֽ/חֶדְר֔/וֹ וְ/כַלָּ֖ה מֵ/חֻפָּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/016.yaml
  text: Gather the people[a]; consecrate the assembly; gather the elders; gather the children, even the nursing infants. Let the bridegroom come out from his room[c][b], and the bride from her chamber.
translation:
  language: pt
  text: Reúnam o povo; consagrem a assembleia; ajuntem os anciãos[a]; reúnam as crianças, até mesmo os bebês de peito[b]. Que o noivo saia do seu quarto, e a noiva, do seu aposento nupcial[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os homens idosos”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os que mamam nos seios”.'
    reason: lexical_alternative
  - marker: c
    text: Ou “do seu dossel”; o termo hebraico pode indicar um dossel de casamento ou um aposento nupcial.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: Reúnam
  rationale: O imperativo plural de אסף convoca a comunidade a se reunir; “reúnam” é natural e preserva a força da ordem, bem como sua repetição no versículo.
- source_word: עָם
  choice: o povo
  rationale: No contexto, designa a comunidade inteira que está sendo convocada.
- source_word: קַדְּשׁוּ
  choice: consagrem
  rationale: O piel imperativo de קדשׁ tem sentido sagrado neste chamado solene; “consagrem” comunica a separação para a assembleia cultual sem acrescentar detalhes rituais.
- source_word: קָהָל
  choice: a assembleia
  rationale: קהל designa a comunidade reunida, especialmente em contexto público e religioso; “assembleia” é claro e digno em português atual.
- source_word: קִבְצוּ
  choice: ajuntem
  rationale: O imperativo de קבץ é próximo de אסף. “Ajuntem” mantém alguma distinção lexical sem alterar o sentido da convocação.
- source_word: זְקֵנִים
  choice: os anciãos
  rationale: Embora possa indicar homens idosos, em contexto comunitário frequentemente se refere aos anciãos reconhecidos da comunidade.
- source_word: עוֹלָלִים
  choice: as crianças
  rationale: Refere-se a crianças pequenas; a expressão seguinte especifica os lactentes, por isso “crianças” preserva a progressão.
- source_word: יֹנְקֵי שָׁדָיִם
  choice: os bebês de peito
  rationale: A expressão significa literalmente os que mamam nos seios. “Bebês de peito” é compreensível, atual e retém a imagem concreta do hebraico.
- source_word: יֵצֵא
  choice: Que ... saia
  rationale: A forma volitiva no contexto da convocação é bem representada pela construção portuguesa “Que ... saia”.
- source_word: חָתָן
  choice: o noivo
  rationale: É a designação comum e inequívoca do homem no contexto do casamento.
- source_word: מֵחֶדְרוֹ
  choice: do seu quarto
  rationale: חדר denota um quarto ou aposento interior; “quarto” é direto e acessível.
- source_word: כַלָּה
  choice: a noiva
  rationale: É a correspondência normal e inequívoca no contexto matrimonial.
- source_word: מֵחֻפָּתָהּ
  choice: do seu aposento nupcial
  rationale: חֻפָּה pode designar o dossel nupcial ou, por extensão contextual, o aposento da noiva. A tradução principal comunica o cenário matrimonial, enquanto a nota preserva a alternativa concreta.
theological_decisions:
- issue: Linguagem sagrada da convocação
  choice: “consagrem a assembleia”
  alternative: “separem a reunião” ou “santifiquem a congregação”
  rationale: O chamado é religioso e comunitário, não meramente cívico. “Consagrem” preserva essa força sem especificar um rito não expresso no texto.
- issue: Sentido social de זְקֵנִים
  choice: “anciãos”
  alternative: “homens idosos”
  rationale: O contexto convoca grupos representativos de toda a comunidade. “Anciãos” reflete o provável status comunitário, mas a nota mantém a possibilidade etária.
- issue: Alcance inclusivo da convocação
  choice: Manter separadamente “crianças” e “bebês de peito”
  alternative: Generalizar como “todas as crianças”
  rationale: A enumeração hebraica enfatiza que até os mais novos devem participar; preservar os dois grupos mantém essa intensidade sem tirar conclusões doutrinárias adicionais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os imperativos no plural preservam a convocação pública. “Ajuntem” evita a repetição total entre verbos hebraicos próximos, sem soar técnico; “bebês de peito” conserva a concretude da imagem. Os marcadores foram colocados junto aos termos efetivamente explicados pelas notas.
