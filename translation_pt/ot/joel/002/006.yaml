base_translation:
  language: en
  yaml_path: translation/ot/joel/002/006.yaml
  text: Before him peoples writhe[b][a]; all faces grow pale.
translation:
  language: pt
  text: Diante dele, os povos se contorcem[a]; todos os rostos empalidecem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «À sua presença, os povos ficam angustiados».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «todos os rostos reúnem פָארוּר», expressão geralmente entendida no sentido de que os rostos perdem a cor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפָּנָיו
  choice: Diante dele
  rationale: Expressa de modo natural a ideia de estar perante a face ou presença de alguém, preservando o sufixo masculino sem identificar explicitamente seu referente.
- source_word: יָחִילוּ
  choice: se contorcem
  rationale: O verbo חול no qal pode descrever tremor, contorção ou angústia semelhante às dores de parto. «Se contorcem» mantém a imagem corporal intensa do hebraico.
- source_word: עַמִּים
  choice: os povos
  rationale: Mantém o sentido coletivo amplo sem restringi-lo a Estados ou nações politicamente definidos.
- source_word: כָּל פָּנִים
  choice: todos os rostos
  rationale: Reproduz a expressão coletiva hebraica em português claro e natural.
- source_word: קִבְּצוּ פָארוּר
  choice: empalidecem
  rationale: Traduz idiomaticamente a expressão hebraica rara, geralmente entendida como a perda da cor do rosto causada pelo terror; a formulação literal «reúnem palidez» não seria natural em português.
theological_decisions:
- issue: Referente do sufixo masculino singular em מִפָּנָיו
  choice: dele
  alternative: do SENHOR; disso
  rationale: O contexto pode apontar para a força que avança, descrita em termos pessoais, e ao mesmo tempo vinculada ao dia do SENHOR. O pronome preserva a ambiguidade do hebraico sem identificar o referente de forma interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem e o paralelismo do hebraico foram preservados, enquanto a expressão facial rara foi vertida idiomaticamente.
