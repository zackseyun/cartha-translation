  source_fidelity: 'A tradução reproduz com precisão a estrutura exortativa do hebraico: os sacerdotes devem chorar e dirigir a Yahweh a súplica para que poupe o povo. “Pórtico”, “sacerdotes, ministros de Yahweh”, “Poupa o teu povo”, “tua herança” e a pergunta final mantêm adequadamente o sentido e o registro do texto. “Um motivo de zombaria entre as nações” representa de modo claro a leitura contextual de לִמְשָׁל בָּם גּוֹיִם como objeto de escárnio público, sem suprimir a alternativa de dominação estrangeira, que é preservada na nota.'
