source:
  edition: WLC
  text: בֵּ֤ין הָ/אוּלָם֙ וְ/לַ/מִּזְבֵּ֔חַ יִבְכּוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָ֑ה וְֽ/יֹאמְר֞וּ ח֧וּסָ/ה יְהוָ֣ה עַל עַמֶּ֗/ךָ וְ/אַל תִּתֵּ֨ן נַחֲלָתְ/ךָ֤ לְ/חֶרְפָּה֙ לִ/מְשָׁל בָּ֣/ם גּוֹיִ֔ם לָ֚/מָּה יֹאמְר֣וּ בָֽ/עַמִּ֔ים אַיֵּ֖ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/017.yaml
  text: Let the priests[a], the ministers of Yahweh, weep between the portico and the altar, and let them say, “Spare your people, Yahweh, and do not make your inheritance a reproach, a byword among the nations. Why should they say among the peoples[b], ‘Where is their God?’”
translation:
  language: pt
  text: 'Entre o pórtico[a] e o altar, chorem os sacerdotes, ministros de Yahweh, e digam: “Poupa o teu povo, Yahweh! Não faças da tua herança uma vergonha, um motivo de zombaria entre as nações.[b] Por que diriam entre os povos: ‘Onde está o Deus deles?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestíbulo” ou “entrada coberta”.
    reason: lexical_alternative
  - marker: b
    text: 'A frase hebraica também pode ser entendida assim: “não entregues a tua herança à vergonha, para que as nações dominem sobre eles”. O contexto favorece aqui o sentido de zombaria pública.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין הָאוּלָם וְלַמִּזְבֵּחַ
  choice: entre o pórtico e o altar
  rationale: אוּלָם designa o espaço de entrada do templo. “Pórtico” é preciso, atual e preserva o cenário cultual.
- source_word: יִבְכּוּ
  choice: chorem
  rationale: O imperfeito tem força exortativa no contexto da convocação; o presente do subjuntivo expressa naturalmente essa instrução em português.
- source_word: הַכֹּהֲנִים מְשָׁרְתֵי יְהוָה
  choice: os sacerdotes, ministros de Yahweh
  rationale: A aposição preserva מְשָׁרְתֵי como designação formal do serviço sacerdotal, sem reduzi-lo a serviço genérico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: חוּסָה עַל עַמֶּךָ
  choice: Poupa o teu povo
  rationale: O imperativo pede que Yahweh retenha o juízo destrutivo e aja com compaixão; “poupa” é conciso e idiomático.
- source_word: וְאַל תִּתֵּן נַחֲלָתְךָ לְחֶרְפָּה
  choice: Não faças da tua herança uma vergonha
  rationale: נתן com לְ pode ter sentido resultativo. A formulação é natural em português e mantém נַחֲלָה como linguagem de pertencimento pactual.
- source_word: לִמְשָׁל בָּם גּוֹיִם
  choice: um motivo de zombaria entre as nações
  rationale: No paralelismo com חֶרְפָּה e diante da pergunta escarnecedora seguinte, מָשָׁל provavelmente designa um dito de zombaria ou objeto de escárnio. A tradução comunica esse sentido com clareza.
- source_word: גּוֹיִם / בָעַמִּים
  choice: as nações / os povos
  rationale: 'A distinção vocabular do hebraico é mantida: גּוֹיִם indica as nações estrangeiras, enquanto עַמִּים é vertido pelo plural mais amplo “povos”.'
- source_word: לָמָּה יֹאמְרוּ
  choice: Por que diriam
  rationale: O futuro do pretérito expressa adequadamente a consequência temida e a força retórica da súplica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Sentido de לִמְשָׁל בָּם גּוֹיִם
  choice: um motivo de zombaria entre as nações
  alternative: para que as nações dominem sobre eles
  rationale: A associação com “vergonha” e a pergunta zombeteira “Onde está o Deus deles?” favorecem o sentido de escárnio público. A leitura ligada ao domínio é mantida em nota por ser uma possibilidade real do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se “herança” pela ressonância pactual e “ministros” pelo caráter formal do serviço sacerdotal. A colocação dos marcadores junto às expressões efetivamente anotadas evita ambiguidade editorial.
