  yaml_path: translation/ot/joel/002/019.yaml
  text: Then the LORD answered and said to his people, “Look, I am sending you the grain, the new wine, and the fresh oil, and you will be satisfied with it; and I will no longer make you a reproach among the nations.”
translation:
  language: pt
  text: 'Então o SENHOR respondeu e disse ao seu povo: “Eis que estou enviando a vocês o cereal, o vinho novo e o azeite; vocês ficarão satisfeitos com isso, e não farei mais de vocês motivo de desprezo entre as nações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: respondeu
  rationale: A fórmula hebraica literalmente combina “respondeu” e “disse”; em português atual, “respondeu” transmite naturalmente o ato de fala sem redundância desnecessária.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida para o nome divino no texto hebraico.
- source_word: הִנְנִי
  choice: Vejam! Estou
  rationale: Preserva a força de chamada de atenção e a ênfase na ação iminente do próprio SENHOR.
- source_word: הַדָּגָן
  choice: o cereal
  rationale: Termo coletivo abrangente para grãos, correspondente ao substantivo hebraico.
- source_word: הַתִּירוֹשׁ
  choice: o vinho novo
  rationale: Distingue תירוש, produto recente da vinha, do termo hebraico mais geral para vinho.
- source_word: הַיִּצְהָר
  choice: o azeite fresco
  rationale: Designa o azeite recém-produzido, preservando o caráter agrícola da tríade.
- source_word: חֶרְפָּה
  choice: motivo de desprezo
  rationale: Expressa a desonra pública ou condição vergonhosa diante das nações, de modo natural em português.
theological_decisions:
- issue: Agente da restauração material
  choice: “Estou enviando” mantém o SENHOR como agente explícito da provisão.
  alternative: Uma formulação impessoal como “haverá cereal”.
  rationale: O hebraico enfatiza a ação divina direta e não deve ter essa agência atenuada.
- issue: Alcance da promessa
  choice: A promessa é dirigida ao povo no contexto e menciona provisão e remoção do desprezo entre as nações.
  alternative: Ampliá-la para uma garantia universal ou estritamente espiritual.
  rationale: A tradução conserva os limites e a tensão do enunciado hebraico sem acrescentar uma aplicação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “Vejam” concorda com o destinatário coletivo expresso por “a vocês”. A pontuação divide a longa coordenação hebraica em frases naturais sem alterar suas relações lógicas.
