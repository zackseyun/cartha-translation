id: JOL.2.10
reference: Joel 2:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/פָנָי/ו֙ רָ֣גְזָה אֶ֔רֶץ רָעֲשׁ֖וּ שָׁמָ֑יִם שֶׁ֤מֶשׁ וְ/יָרֵ֨חַ֙ קָדָ֔רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/010.yaml
  text: Before him the earth quakes[a]; the heavens tremble. The sun and the moon grow dark[b], and the stars withdraw their brightness.
translation:
  language: pt
  text: Diante dele, a terra treme[a], e os céus estremecem. O sol e a lua escurecem, e as estrelas recolhem o seu brilho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Na presença dele, a terra estremece”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as estrelas recolhem o seu brilho”, isto é, deixam de brilhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Diante dele
  rationale: Expressa naturalmente a ideia de estar perante ele ou em sua presença, preservando a força espacial e relacional do hebraico.
- source_word: רָגְזָה
  choice: treme
  rationale: Com “a terra” como sujeito, comunica de modo claro o abalo sísmico e mantém a vivacidade da imagem profética.
- source_word: אֶרֶץ
  choice: a terra
  rationale: O contexto de céus, sol, lua e estrelas favorece o sentido cósmico de “terra”, e não apenas o de uma região ou país.
- source_word: רָעֲשׁוּ
  choice: estremecem
  rationale: Transmite o forte abalo dos céus e evita repetir “treme”, preservando o paralelismo poético.
- source_word: שָׁמָיִם
  choice: os céus
  rationale: Mantém o plural hebraico, o alcance cósmico e o registro elevado da profecia.
- source_word: שֶׁמֶשׁ וְיָרֵחַ
  choice: O sol e a lua
  rationale: Tradução direta que conserva a sequência dos corpos celestes no texto hebraico.
- source_word: קָדָרוּ
  choice: escurecem
  rationale: Reproduz com naturalidade o sentido de tornar-se escuro ou sombrio.
- source_word: וְכוֹכָבִים
  choice: e as estrelas
  rationale: Tradução direta que preserva a progressão da imagem cósmica.
- source_word: אָסְפוּ
  choice: recolhem
  rationale: Conserva a metáfora concreta de ajuntar ou recolher, permitindo ao leitor perceber a expressão hebraica sem perder seu sentido contextual.
- source_word: נָגְהָם
  choice: o seu brilho
  rationale: Expressa a radiância das estrelas em português corrente e digno.
theological_decisions:
- issue: Alcance das imagens de perturbação cósmica
  choice: Manter as imagens como perturbação cósmica direta, sem determinar se são literais, figuradas, históricas ou escatológicas.
  alternative: Reduzi-las a mera metáfora do terror causado por um exército ou defini-las explicitamente como previsão exclusiva do fim dos tempos.
  rationale: A poesia profética apresenta sinais cósmicos sem resolver sua relação exata com os acontecimentos descritos. A tradução preserva essa amplitude e tensão.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Diante dele” e “os céus” preservam o tom profético; “recolhem o seu brilho” mantém a metáfora hebraica, esclarecida em nota.
