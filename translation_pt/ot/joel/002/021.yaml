  text: אַל תִּֽירְאִ֖י אֲדָמָ֑ה גִּ֣ילִי וּ/שְׂמָ֔חִי כִּֽי הִגְדִּ֥יל יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/021.yaml
  text: Do not fear[a], O land; rejoice and be glad, for Yahweh has done great things.
translation:
  language: pt
  text: Não tenha medo, ó terra! Exulte e alegre-se, pois Yahweh fez grandes coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expressão idiomática hebraica: “agiu grandiosamente” ou “fez grandes coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Não tenha medo
  rationale: אַל com o imperfeito expressa uma proibição. A forma feminina singular concorda com אֲדָמָה, personificada como interlocutora.
- source_word: אֲדָמָה
  choice: ó terra
  rationale: No contexto agrícola e territorial, designa a terra personificada. “Terra” é mais abrangente e natural que “solo”, sem sugerir o planeta inteiro.
- source_word: גִּילִי
  choice: Exulte
  rationale: O verbo indica alegria intensa e jubilosa. “Exulte” preserva essa força e permite distinguir o termo do imperativo seguinte.
- source_word: וּשְׂמָחִי
  choice: e alegre-se
  rationale: Mantém o segundo imperativo como expressão distinta, preservando a intensificação poética do paralelismo hebraico.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da exortação de modo conciso e natural em português.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: fez grandes coisas
  rationale: A construção idiomática significa literalmente algo próximo de “engrandeceu o agir” e, no contexto, comunica a realização de feitos grandiosos. A tradução escolhida é clara e idiomática.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e corresponde à transliteração adotada pelo projeto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A terra é personificada, e os dois imperativos de alegria foram mantidos distintos para preservar a intensificação poética.
