  text: י֧וֹם חֹ֣שֶׁךְ וַ/אֲפֵלָ֗ה י֤וֹם עָנָן֙ וַ/עֲרָפֶ֔ל כְּ/שַׁ֖חַר פָּרֻ֣שׂ עַל הֶֽ/הָרִ֑ים עַ֚ם רַ֣ב וְ/עָצ֔וּם כָּמֹ֗/הוּ לֹ֤א נִֽהְיָה֙ מִן הָ֣/עוֹלָ֔ם וְ/אַֽחֲרָי/ו֙ לֹ֣א יוֹסֵ֔ף עַד שְׁנֵ֖י דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/002.yaml
  text: A day of darkness and gloom[a], a day of clouds and thick darkness; like dawn spread over the mountains, a great and mighty people comes. Nothing like it has ever been from of old, and after it there will not again be any[c][b], through the years of generation after generation.
translation:
  language: pt
  text: 'Um dia de escuridão e densas trevas,

    um dia de nuvens e escuridão profunda;

    como a aurora que se estende sobre os montes,[a]

    vem um povo numeroso e poderoso.[b]

    Nunca houve nada semelhante desde os tempos antigos,

    nem voltará a haver depois dele,

    até os anos de geração em geração.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como o negrume estendido sobre os montes”, caso שַׁחַר seja entendido em seu sentido mais raro. “Como a aurora” é mais provável, conforme o uso normal do hebraico e a imagem de algo que rapidamente se espalha pelos montes.
    reason: lexical_alternative
  - marker: b
    text: “Um povo numeroso e poderoso” pode referir-se a um exército invasor, a um enxame de gafanhotos descrito em linguagem militar ou a uma imagem profética que combina deliberadamente os dois.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “até os anos de geração e geração”, expressão idiomática que indica uma sucessão indefinidamente longa de gerações.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֧וֹם
  choice: um dia
  rationale: Mantém o substantivo temporal básico e sua repetição enfática na poesia profética.
- source_word: חֹשֶׁךְ וַאֲפֵלָה
  choice: escuridão e densas trevas
  rationale: Distingue os dois termos relacionados e comunica a intensificação do segundo com naturalidade em português.
- source_word: עָנָן וַעֲרָפֶל
  choice: nuvens e escuridão profunda
  rationale: Retrata tanto a massa de nuvens quanto a obscuridade espessa e envolvente, preservando o paralelismo.
- source_word: כְּשַׁחַר
  choice: como a aurora
  rationale: O sentido usual de שַׁחַר é a luz do amanhecer; a imagem combina com algo que se estende rapidamente sobre os montes. A leitura menos comum é registrada em nota.
- source_word: פָּרֻשׂ עַל הֶהָרִים
  choice: que se estende sobre os montes
  rationale: Expressa de modo natural o particípio passivo e a imagem de algo espalhado por cima dos montes.
- source_word: עַם רַב וְעָצוּם
  choice: um povo numeroso e poderoso
  rationale: עַם é mantido como “povo”, sem restringir a referência a exército ou gafanhotos; רַב comunica multidão e עָצוּם, força formidável.
- source_word: מִן הָעוֹלָם
  choice: desde os tempos antigos
  rationale: Neste contexto, a expressão aponta para o passado remoto, não necessariamente para uma afirmação metafísica sobre a eternidade.
- source_word: עַד שְׁנֵי דּוֹר וָדוֹר
  choice: por gerações e gerações
  rationale: Reproduz em português corrente o sentido idiomático de uma sucessão indefinidamente longa de gerações.
theological_decisions:
- issue: Identidade do “povo numeroso e poderoso”
  choice: Manter a designação genérica “povo”, sem identificar explicitamente seu referente.
  alternative: Traduzir como um enxame de gafanhotos, um exército invasor ou uma imagem profética deliberadamente combinada.
  rationale: O hebraico usa עַם (“povo”) e o próprio versículo não resolve se a imagem se refere a gafanhotos, a uma força humana ou a ambos. A tradução preserva essa tensão interpretativa.
- issue: Comparação com a aurora
  choice: Relacionar “como a aurora que se estende sobre os montes” à chegada do povo, preservando a sequência poética.
  alternative: Entender שַׁחַר no sentido raro de “negrume” e ligá-lo mais diretamente à escuridão precedente.
  rationale: “Aurora” é o sentido lexical predominante e combina com o verbo de extensão, embora a alternativa seja possível e por isso conste em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética preservada por paralelismo e quebras de linha. Evita termos excessivamente arcaicos e não restringe imagens cuja referência permanece ambígua no hebraico.
