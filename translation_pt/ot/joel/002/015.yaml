  yaml_path: translation/ot/joel/002/015.yaml
  text: Blow a trumpet in Zion[a]; consecrate a fast[c][b]; call a solemn assembly.
translation:
  language: pt
  text: Toquem a trombeta em Sião[a]; consagrem um jejum[b]; convoquem uma assembleia solene[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chifre”. O hebraico שׁוֹפָר designa o instrumento de chifre usado para alarme ou convocação sagrada.
    reason: lexical_alternative
  - marker: b
    text: Ou “santifiquem um jejum”, isto é, separem-no para uma finalidade sagrada.
    reason: lexical_alternative
  - marker: c
    text: Ou “uma assembleia sagrada”. O hebraico עֲצָרָה designa uma reunião religiosa formal e solene.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Toquem
  rationale: O imperativo plural de תקע, acompanhado de שׁוֹפָר, significa fazer soar o instrumento. “Toquem a trombeta” é natural em português e preserva a força da ordem dirigida à comunidade.
- source_word: שׁוֹפָר
  choice: trombeta
  rationale: Designa o instrumento de chifre usado para alarme público ou convocação sagrada. “Trombeta” é claro e corrente; a especificidade de “chifre” é indicada em nota.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: A preposição בְּ tem aqui sentido locativo, e “em Sião” é a formulação natural em português.
- source_word: קַדְּשׁוּ
  choice: consagrem
  rationale: O Piel imperativo de קדשׁ exprime separar ou declarar algo santo para uma finalidade sagrada. “Consagrem” conserva essa dimensão cultual sem soar arcaico.
- source_word: צוֹם
  choice: um jejum
  rationale: O substantivo indica uma observância concreta de jejum comunitário, não apenas o ato abstrato de jejuar.
- source_word: קִרְאוּ
  choice: convoquem
  rationale: Neste contexto, קרא significa chamar o povo para uma reunião. “Convoquem” exprime de modo direto essa função, embora “proclamem” também seja possível.
- source_word: עֲצָרָה
  choice: uma assembleia solene
  rationale: O termo designa uma reunião religiosa formal, marcada por solenidade. A expressão escolhida preserva tanto o caráter comunitário quanto a gravidade sagrada da ocasião.
theological_decisions: []
