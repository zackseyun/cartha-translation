revisions:
- from: Aquele que vem do norte, eu o afastarei de vocês[a] e o expulsarei para uma terra seca e desolada. Lançarei sua frente no mar oriental e sua retaguarda no mar ocidental[b]. Seu mau cheiro subirá; seu fedor se levantará, porque ele fez grandes coisas[c].
