source:
  edition: WLC
  text: וְֽ/אֶת הַ/צְּפוֹנִ֞י אַרְחִ֣יק מֵ/עֲלֵי/כֶ֗ם וְ/הִדַּחְתִּי/ו֮ אֶל אֶ֣רֶץ צִיָּ֣ה וּ/שְׁמָמָה֒ אֶת פָּנָ֗י/ו אֶל הַ/יָּם֙ הַ/קַּדְמֹנִ֔י וְ/סֹפ֖/וֹ אֶל הַ/יָּ֣ם הָ/אַֽחֲר֑וֹן וְ/עָלָ֣ה בָאְשׁ֗/וֹ וְ/תַ֨עַל֙ צַחֲנָת֔/וֹ כִּ֥י הִגְדִּ֖יל לַ/עֲשֽׂוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/020.yaml
  text: And I will remove the northerner far from you[a], and I will drive him into a dry and desolate land, his front into the eastern sea and his rear into the western sea; his stench will rise, and his foul smell will rise[c][b], because he has done great things.
translation:
  language: pt
  text: O do norte, eu o afastarei para longe de vocês[a] e o expulsarei para uma terra seca e desolada, com a frente voltada para o mar oriental e a retaguarda para o mar ocidental[b]. Seu mau cheiro subirá, e seu fedor se levantará, porque ele fez grandes coisas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o exército do norte”. O hebraico diz literalmente “o do norte”, numa expressão singular e personificada.'
    reason: lexical_alternative
  - marker: b
    text: O “mar oriental” provavelmente é o mar Morto, e o “mar ocidental”, o mar Mediterrâneo.
    reason: cultural_note
  - marker: c
    text: 'Ou: “porque ele agiu com arrogância”. A expressão hebraica diz literalmente “porque ele fez grandes coisas” e, neste contexto, provavelmente tem sentido negativo.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצְּפוֹנִי
  choice: aquele que vem do norte
  rationale: Preserva a forma singular e personificada do hebraico, além da referência direcional, sem especificar indevidamente que se trata de um exército.
- source_word: אַרְחִיק
  choice: afastarei
  rationale: O hifil de רחק expressa fazer ficar longe; “afastarei” comunica naturalmente o sentido causativo em português.
- source_word: וְהִדַּחְתִּיו
  choice: o expulsarei
  rationale: O hifil de נדח indica impelir ou lançar para longe; “expulsarei” é claro e adequado à imagem de remoção forçada.
- source_word: אֶרֶץ צִיָּה וּשְׁמָמָה
  choice: uma terra seca e desolada
  rationale: 'Mantém os dois elementos do hebraico: aridez e desolação.'
- source_word: פָּנָיו
  choice: sua frente
  rationale: Embora literalmente signifique “seu rosto”, o contraste espacial com סֹפוֹ aponta para a parte dianteira da entidade personificada.
- source_word: הַיָּם הַקַּדְמֹנִי
  choice: o mar oriental
  rationale: Traduz a designação direcional sem substituir o termo hebraico por uma identificação geográfica provável.
- source_word: סֹפוֹ
  choice: sua retaguarda
  rationale: No contraste com “sua frente”, o termo que literalmente indica o fim ou a extremidade designa naturalmente a parte traseira.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: o mar ocidental
  rationale: Comunica o valor direcional do idioma hebraico, deixando a provável identificação geográfica para a nota.
- source_word: בָאְשׁוֹ
  choice: seu mau cheiro
  rationale: Expressa o odor repugnante indicado pelo substantivo, em linguagem corrente.
- source_word: צַחֲנָתוֹ
  choice: seu fedor
  rationale: Preserva o paralelismo com um segundo termo forte para odor ofensivo, sem produzir uma repetição exata.
- source_word: כִּי הִגְדִּיל לַעֲשׂוֹת
  choice: porque ele fez grandes coisas
  rationale: Mantém o idioma hebraico e sua ambiguidade, permitindo que o contexto indique o provável sentido negativo; uma leitura explícita de arrogância é registrada em nota.
theological_decisions:
- issue: Identidade daquele que vem do norte
  choice: Um invasor ou contingente hostil personificado, sem identificação mais estreita no texto
  alternative: Um vento norte literal, uma nação histórica específica ou a praga de gafanhotos personificada
  rationale: O singular e a imagem de frente e retaguarda favorecem a personificação, mas o versículo não exige a identificação com um agente histórico específico.
- issue: Sentido de “fez grandes coisas”
  choice: Conservar no texto o idioma hebraico, com sua possível conotação negativa contextual
  alternative: “agiu com arrogância” ou “cometeu atrocidades”
  rationale: A expressão pode descrever feitos grandiosos em sentido positivo ou negativo. Aqui, o juízo contra o agente hostil sugere arrogância ou ação excessiva, mas explicitar isso no texto eliminaria uma tensão lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para fluência, mas o singular personificado, a metáfora espacial e a ambiguidade da expressão final foram preservados. Todos os marcadores de nota aparecem no texto.
