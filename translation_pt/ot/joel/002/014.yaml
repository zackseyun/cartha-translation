  text: מִ֥י יוֹדֵ֖עַ יָשׁ֣וּב וְ/נִחָ֑ם וְ/הִשְׁאִ֤יר אַֽחֲרָי/ו֙ בְּרָכָ֔ה מִנְחָ֣ה וָ/נֶ֔סֶךְ לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/014.yaml
  text: Who knows? He may turn and relent[a], and leave behind him a blessing—an offering and a drink offering for Yahweh your God.
translation:
  language: pt
  text: 'Quem sabe? Talvez ele volte atrás e se arrependa, deixando atrás de si uma bênção: uma oferta de cereais[a] e uma libação para o SENHOR, o Deus de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma oferta”. Em contextos de sacrifício, o termo hebraico מִנְחָה muitas vezes designa especificamente uma oferta de cereais.
    reason: alternativa lexical
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Quem sabe?
  rationale: Mantém a breve pergunta retórica hebraica e expressa possibilidade, não certeza.
- source_word: יָשׁוּב
  choice: volte atrás
  rationale: No contexto, שוב indica uma reversão do juízo anunciado, e não mero movimento espacial.
- source_word: וְנִחָם
  choice: recue
  rationale: Expressa que Deus pode não executar o castigo anunciado, preservando a tensão do texto sem sugerir erro ou ignorância divina.
- source_word: וְהִשְׁאִיר
  choice: deixando
  rationale: Reproduz de modo natural o sentido causativo de fazer restar ou deixar algo.
- source_word: אַחֲרָיו
  choice: atrás de si
  rationale: Conserva a imagem espacial do hebraico, em vez de explicá-la ou eliminá-la.
- source_word: בְּרָכָה
  choice: uma bênção
  rationale: Mantém o singular e o sentido concreto de provisão benéfica deixada pela misericórdia divina.
- source_word: מִנְחָה
  choice: uma oferta
  rationale: O termo pode designar uma dádiva em geral ou, neste contexto ritual, especificamente uma oferta de cereal; a alternativa mais específica é registrada em nota.
- source_word: וָנֶסֶךְ
  choice: uma oferta derramada
  rationale: Forma acessível para a oferta líquida vertida no culto, evitando o termo menos comum “libação”.
- source_word: לַיהוָה
  choice: para o SENHOR
  rationale: A preposição indica que a provisão serviria ao culto, e o nome divino é apresentado segundo a convenção portuguesa tradicional.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Preserva claramente a segunda pessoa do plural e tem leitura natural no português brasileiro contemporâneo.
theological_decisions:
- issue: Linguagem sobre a mudança da ação divina
  choice: Talvez ele volte atrás e recue
  alternative: Talvez ele volte e se arrependa
  rationale: A formulação mantém a possibilidade real apresentada do ponto de vista humano e a reversão do juízo anunciado, sem resolver a tensão teológica nem atribuir pecado ou erro a Deus.
- issue: Especificidade ritual de מִנְחָה
  choice: uma oferta
  alternative: uma oferta de cereal
  rationale: O contexto ritual favorece o sentido técnico de oferta de cereal, sobretudo em paralelo com a oferta derramada; o texto principal conserva o termo mais amplo, e a nota registra a leitura específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “O Deus de vocês” explicita o plural; “oferta derramada” comunica o rito com mais clareza do que o termo técnico “libação”. O marcador da nota foi colocado junto de “oferta”, expressão à qual a nota lexical de fato se refere.
