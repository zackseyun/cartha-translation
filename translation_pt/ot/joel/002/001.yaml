  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: תִּקְע֨וּ שׁוֹפָ֜ר בְּ/צִיּ֗וֹן וְ/הָרִ֨יעוּ֙ בְּ/הַ֣ר קָדְשִׁ֔/י יִרְגְּז֕וּ כֹּ֖ל יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּֽי בָ֥א יוֹם יְהוָ֖ה כִּ֥י קָרֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/001.yaml
  text: Blow a horn in Zion[a], and sound an alarm on my holy mountain; let all the inhabitants of the land tremble, for the day of Yahweh is coming—indeed, it is near.
translation:
  language: pt
  text: Toquem a trombeta em Sião e deem o alarme no meu santo monte. Tremam todos os habitantes da terra[a], pois o dia de Yahweh está chegando; sim, está próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todos os habitantes do país» ou «todos os habitantes do mundo». A palavra hebraica pode designar a terra ou região em questão e também a terra inteira.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  choice: Toquem a trombeta
  rationale: O imperativo plural de תקע com שׁוֹפָר ordena que se sopre ou faça soar o instrumento. Em português corrente, «tocar a trombeta» comunica naturalmente a ação, sem exigir que o instrumento fosse metálico.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: Mantém o valor locativo normal da preposição e a forma consagrada do topônimo em português.
- source_word: וְהָרִיעוּ
  choice: deem o alarme
  rationale: O hifil de רוע indica aqui a emissão de um sinal forte de alerta. A formulação preserva a urgência e o paralelismo com o toque da trombeta, sem restringir o sentido a um grito de guerra.
- source_word: בְּהַר קָדְשִׁי
  choice: no meu santo monte
  rationale: Expressão natural e dignificada em português para o monte consagrado a quem fala, isto é, Yahweh.
- source_word: יִרְגְּזוּ
  choice: Tremam
  rationale: A forma verbal tem força volitiva neste encadeamento de ordens e expressa abalo físico e temor sem especificar além do hebraico.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: «Terra» preserva em português a ambiguidade lexical entre a região habitada em questão e o mundo inteiro; a nota explicita a alternativa contextual.
- source_word: כִּי בָא יוֹם יְהוָה
  choice: pois o dia de Yahweh está chegando
  rationale: בָא apresenta a chegada como iminente no discurso profético. O nome divino é transliterado como «Yahweh», preservando o nome próprio do texto hebraico.
- source_word: כִּי קָרוֹב
  choice: sim, está próximo
  rationale: O segundo כִּי pode ter valor explicativo ou enfático. «Sim» evita repetição pesada e conserva a ênfase na proximidade.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: terra, com ambiguidade mantida no texto e esclarecida em nota
  alternative: país; região; mundo inteiro
  rationale: As referências imediatas a Sião e ao santo monte favorecem um âmbito local, mas o tema do dia de Yahweh permite um horizonte universal. O português «terra» comporta ambos, enquanto a nota evita resolver indevidamente a tensão.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome divino; «Yahweh» o representa como nome próprio sem substituir por um título.
- issue: Natureza do sinal em וְהָרִיעוּ
  choice: alarme
  alternative: grito de guerra; brado
  rationale: No contexto de advertência sobre a chegada do dia de Yahweh, «alarme» expressa o sinal urgente sem determinar que se trate especificamente de combate.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. «Santo monte» conserva a dicção bíblica ainda corrente; a divisão em duas frases reforça a urgência dos imperativos. O marcador [a] aparece imediatamente após a expressão ambígua a que se refere.
