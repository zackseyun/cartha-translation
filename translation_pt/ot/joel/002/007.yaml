base_translation:
  language: en
  yaml_path: translation/ot/joel/002/007.yaml
  text: Like warriors they run[a]; like men of war they climb the wall. Each goes in his own way[b], and they do not swerve from their paths.
translation:
  language: pt
  text: Como guerreiros, eles correm; como homens de guerra, sobem a muralha. Cada um segue o seu caminho, e eles não se desviam de suas veredas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não rompem as fileiras”. O verbo hebraico é raro e pode indicar que eles não se desviam de seu curso nem desfazem a formação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגִבּוֹרִים
  choice: Como guerreiros
  rationale: No contexto militar, גִּבּוֹרִים designa homens fortes ou valentes como combatentes. “Guerreiros” comunica diretamente esse sentido em português atual.
- source_word: יְרֻצוּן
  choice: eles correm
  rationale: O verbo רוץ significa “correr”; o imperfeito apresenta vividamente a ação característica do exército invasor.
- source_word: כְּאַנְשֵׁי מִלְחָמָה
  choice: como homens de guerra
  rationale: Reproduz a expressão hebraica explicitamente masculina e mantém o paralelismo militar, embora “soldados” seja uma alternativa idiomática.
- source_word: יַעֲלוּ חוֹמָה
  choice: sobem a muralha
  rationale: עלה significa “subir”; com חוֹמָה, descreve a subida de uma muralha. A formulação preserva o verbo amplo do hebraico sem explicitar além do necessário o modo da subida.
- source_word: וְאִישׁ בִּדְרָכָיו יֵלֵכוּן
  choice: Cada um segue o seu caminho
  rationale: אִישׁ tem força distributiva, “cada um”, e דֶּרֶךְ pode indicar caminho ou curso. “Segue” expressa naturalmente o avanço ordenado de cada integrante.
- source_word: וְלֹא יְעַבְּטוּן
  choice: não se desviam
  rationale: O verbo é raro e difícil. No paralelismo, provavelmente indica não alterar, torcer ou interromper o curso. “Não se desviam” conserva o sentido contextual sem impor a interpretação mais específica de formação militar.
- source_word: אֹרְחוֹתָם
  choice: de suas veredas
  rationale: אֹרַח designa caminho, trilha ou vereda. “Veredas” mantém alguma distinção lexical em relação a דֶּרֶךְ e preserva o paralelismo poético.
theological_decisions:
- issue: Linguagem militar marcada pelo masculino
  choice: como homens de guerra; cada um segue o seu caminho
  alternative: como soldados; cada qual segue o próprio caminho
  rationale: O hebraico emprega a expressão masculina אַנְשֵׁי מִלְחָמָה e o distributivo singular אִישׁ com sufixo masculino. A tradução conserva essa forma onde ela integra a imagem militar, sem acrescentar implicações doutrinárias.
- issue: Sentido do raro verbo יְעַבְּטוּן
  choice: não se desviam de suas veredas
  alternative: não rompem as fileiras
  rationale: A leitura militar de manutenção das fileiras é plausível, mas mais específica do que o verbo permite estabelecer com segurança. O texto principal preserva o sentido geral de não alterar o curso, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Homens de guerra” mantém a forma masculina da comparação hebraica; “veredas” distingue os dois termos hebraicos para caminho sem produzir linguagem arcaica excessiva.
