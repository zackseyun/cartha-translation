base_translation:
  language: en
  yaml_path: translation/ot/joel/002/004.yaml
  text: Their appearance is like the appearance of horses[a], and like horsemen[b], so they run.
translation:
  language: pt
  text: Sua aparência é como a de cavalos[a]; como cavaleiros[b], assim correm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua aparência é como a aparência de cavalos”.'
    reason: lexical_alternative
  - marker: b
    text: “Cavaleiros” também pode ser traduzido por “combatentes montados” ou “cavalaria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְאֵה סוּסִים
  choice: como a de cavalos
  rationale: מַרְאֶה indica aparência visível, e כְּ introduz a comparação. Em português, a elipse de “aparência” após “como” evita repetição pesada sem perder o sentido.
- source_word: מַרְאֵהוּ
  choice: Sua aparência
  rationale: O hebraico traz substantivo singular com sufixo de terceira pessoa masculina singular, remetendo coletivamente ao povo invasor. “Sua aparência” preserva o singular e a ambiguidade referencial natural do original.
- source_word: וּכְפָרָשִׁים
  choice: como cavaleiros
  rationale: פָּרָשִׁים designa cavaleiros ou combatentes montados. “Cavaleiros” é corrente e mantém a imagem militar em paralelo com “cavalos”.
- source_word: כֵּן
  choice: assim
  rationale: 'Marca a correspondência da comparação: tal como parecem, assim correm.'
- source_word: יְרוּצוּן
  choice: correm
  rationale: Forma do verbo רוץ, “correr”. A tradução básica evita acrescentar uma intensidade não explicitada pelo verbo.
