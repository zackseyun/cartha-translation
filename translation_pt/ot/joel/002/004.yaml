translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O singular “sua aparência” acompanha de perto a forma hebraica e funciona naturalmente com o referente coletivo; a repetição de מַרְאֶה é suavizada no texto, mas preservada como alternativa em nota.
