  text: וְ/אִ֤ישׁ אָחִי/ו֙ לֹ֣א יִדְחָק֔וּ/ן גֶּ֥בֶר בִּ/מְסִלָּת֖/וֹ יֵֽלֵכ֑וּ/ן וּ/בְעַ֥ד הַ/שֶּׁ֛לַח יִפֹּ֖לוּ לֹ֥א יִבְצָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/008.yaml
  text: No man crowds his brother; each goes on his own path. Though they fall through the weapon[a], they do not break ranks.
translation:
  language: pt
  text: Ninguém empurra o seu companheiro; cada um segue pelo seu próprio caminho. Mesmo que caiam por entre as armas, não rompem as fileiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não são cortados” (ou “não são detidos”). A última oração é lexicalmente difícil; o texto principal reflete o sentido contextual de um exército cuja formação não é rompida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אָחִיו
  choice: Ninguém ... o seu companheiro
  rationale: A expressão distributiva descreve cada integrante em relação ao outro. “Companheiro” preserva o sentido de camaradagem no contexto de uma força organizada sem exigir parentesco literal.
- source_word: יִדְחָקוּן
  choice: empurra
  rationale: דחק denota pressionar ou apertar. “Empurra” é claro e natural em português e comunica que os integrantes não invadem o espaço uns dos outros.
- source_word: גֶּבֶר
  choice: cada um
  rationale: Mantém a força distributiva do singular sem a repetição pouco natural de “cada homem”.
- source_word: בִּמְסִלָּתוֹ
  choice: pelo seu próprio caminho
  rationale: מְסִלָּה pode indicar estrada, via ou curso. No contexto, refere-se à linha individual de avanço; “caminho” conserva a imagem sem tornar explícita uma formação militar além do texto.
- source_word: יֵלֵכוּן
  choice: segue
  rationale: הלך é o verbo geral para ir ou andar. “Segue” soa natural com “caminho” e evita especificar “marcha”, embora o contexto seja militar.
- source_word: וּבְעַד הַשֶּׁלַח
  choice: por entre as armas
  rationale: שֶׁלַח designa arma e pode referir-se especialmente a um projétil; בְּעַד admite a ideia de atravessar ou passar por entre. O plural português apresenta a arma em sentido coletivo sem definir o tipo exato.
- source_word: יִפֹּלוּ
  choice: caiam
  rationale: Preserva o sentido básico de נפל e a tensão da imagem, sem explicitar se caem feridos, se tombam durante o avanço ou se se lançam adiante.
- source_word: לֹא יִבְצָעוּ
  choice: não rompem as fileiras
  rationale: A forma é lexicalmente difícil. No contexto de um grupo que avança de modo ordenado, a tradução principal expressa que sua formação não é desfeita; alternativas possíveis são registradas em nota.
