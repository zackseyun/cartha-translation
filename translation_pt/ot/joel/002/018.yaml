  text: וַ/יְקַנֵּ֥א יְהוָ֖ה לְ/אַרְצ֑/וֹ וַ/יַּחְמֹ֖ל עַל עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/018.yaml
  text: Then Yahweh became jealous for his land and had compassion on his people[a].
translation:
  language: pt
  text: Então Yahweh teve zelo por sua terra[a] e teve compaixão de seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “teve ciúme de sua terra”. O verbo hebraico pode expressar ciúme ou zelo; aqui indica o ardente cuidado de Yahweh, no âmbito da aliança, por aquilo que lhe pertence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנֵּא
  choice: teve zelo
  rationale: O verbo קנא pode expressar tanto ciúme quanto zelo. Em português, “teve zelo por” comunica de modo natural o intenso cuidado protetor de Yahweh por aquilo que lhe pertence, enquanto a nota preserva a alternativa lexical “teve ciúme de”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לְאַרְצוֹ
  choice: por sua terra
  rationale: אֶרֶץ refere-se aqui à terra da aliança, e a preposição לְ após קנא indica o objeto do zelo.
- source_word: וַיַּחְמֹל
  choice: teve compaixão
  rationale: חמל expressa compaixão, piedade ou o ato de poupar; “teve compaixão” se ajusta ao contexto emotivo e restaurador sem restringir o sentido a não executar o juízo.
- source_word: עַל עַמּוֹ
  choice: de seu povo
  rationale: Com חמל, עַל introduz o objeto da compaixão; em português corrente, a construção idiomática é “ter compaixão de”. עַם designa a comunidade do povo da aliança.
theological_decisions:
- issue: A expressão do ciúme ou zelo divino
  choice: Yahweh teve zelo por sua terra
  alternative: Yahweh teve ciúme de sua terra
  rationale: O hebraico mantém juntos os sentidos de zelo ardente e ciúme ligado à exclusividade da aliança. O texto principal usa a formulação portuguesa mais natural, e a nota conserva a tensão sem reduzir o termo a mero entusiasmo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Então” mantém a progressão narrativa; a repetição de “teve” preserva o paralelismo verbal do hebraico sem soar artificial.
