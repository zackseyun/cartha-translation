base_translation:
  language: en
  yaml_path: translation/ot/joel/002/024.yaml
  text: The threshing floors will be filled with grain[a], and the vats will overflow with new wine and oil.
translation:
  language: pt
  text: As eiras ficarão cheias de cereal, e os tanques transbordarão de vinho novo e azeite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: ficarão cheias
  rationale: No contexto profético, o perfeito com conjunção expressa o resultado futuro da restauração; a formulação comunica naturalmente o estado resultante.
- source_word: הַגֳּרָנוֹת
  choice: as eiras
  rationale: גֹּרֶן designa o espaço onde se debulha e limpa o cereal; “eiras” é o termo português preciso e mantém o plural.
- source_word: בָּר
  choice: cereal
  rationale: Aqui o termo se refere de modo abrangente ao grão já debulhado, sem restringi-lo ao trigo.
- source_word: וְהֵשִׁיקוּ
  choice: transbordarão
  rationale: A forma verbal descreve os recipientes enchendo-se até derramar, imagem de abundância preservada com clareza em português.
- source_word: הַיְקָבִים
  choice: os tanques
  rationale: יֶקֶב designa tanques ou recipientes ligados à prensagem e coleta de líquidos; “tanques” funciona naturalmente tanto com vinho quanto com azeite.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: תִּירוֹשׁ indica o produto recente da uva e conserva a nuance agrícola e sazonal.
- source_word: וְיִצְהָר
  choice: e azeite
  rationale: יִצְהָר refere-se ao óleo agrícola, normalmente de oliva; “azeite” é a expressão portuguesa direta e idiomática.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eiras” preserva com precisão a imagem agrícola; “tanques” evita limitar indevidamente os recipientes apenas ao vinho. Não se acrescentou nota porque o texto hebraico não apresenta aqui uma ambiguidade que exija esclarecimento editorial.
