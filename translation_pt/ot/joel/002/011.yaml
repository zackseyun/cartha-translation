language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה נָתַ֤ן קוֹל/וֹ֙ לִ/פְנֵ֣י חֵיל֔/וֹ כִּ֣י רַ֤ב מְאֹד֙ מַחֲנֵ֔/הוּ כִּ֥י עָצ֖וּם עֹשֵׂ֣ה דְבָר֑/וֹ כִּֽי גָד֧וֹל יוֹם יְהוָ֛ה וְ/נוֹרָ֥א מְאֹ֖ד וּ/מִ֥י יְכִילֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/011.yaml
  text: And Yahweh gives his voice before his army[a], for his camp is exceedingly great; for mighty is the one who does his word[c][b]. For the day of Yahweh is great and exceedingly dreadful—who can endure it?
translation:
  language: pt
  text: E Yahweh faz ouvir a sua voz diante do seu exército[a], pois o seu acampamento é imensamente grande; poderoso é aquele que cumpre a sua palavra[b]. Pois grande é o dia de Yahweh e extremamente temível[c] — quem poderá suportá-lo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é literalmente “dá a sua voz”; também pode ser traduzida por “solta a sua voz”.
    reason: lexical_alternative
  - marker: b
    text: Ou “executa a sua ordem”. Neste contexto, “palavra” pode ter o sentido de ordem ou comando.
    reason: lexical_alternative
  - marker: c
    text: Ou “extremamente terrível”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: E Yahweh
  rationale: Mantém a conjunção que liga o versículo ao contexto e translitera o nome divino, distinguindo-o do título “Senhor”.
- source_word: נָתַן קוֹלוֹ
  choice: faz ouvir a sua voz
  rationale: Expressa em português natural a locução hebraica literalmente equivalente a “dá a sua voz”, preservando a imagem de Yahweh emitindo sua voz de comando.
- source_word: לִפְנֵי חֵילוֹ
  choice: diante do seu exército
  rationale: חַיִל designa aqui uma força militar organizada; “exército” é claro e preserva a relação possessiva com Yahweh.
- source_word: כִּי רַב מְאֹד מַחֲנֵהוּ
  choice: pois o seu acampamento é imensamente grande
  rationale: Preserva a imagem distinta do acampamento militar sem limitar רַב apenas ao tamanho físico ou apenas ao número de integrantes.
- source_word: כִּי עָצוּם עֹשֵׂה דְבָרוֹ
  choice: poderoso é aquele que cumpre a sua palavra
  rationale: Mantém o particípio no singular e a força de עָצוּם. “Cumpre” comunica naturalmente a execução da palavra divina sem substituir explicitamente “palavra” por “ordem”.
- source_word: כִּי גָדוֹל יוֹם יְהוָה
  choice: Pois grande é o dia de Yahweh
  rationale: Conserva a ordem enfática do hebraico e a expressão profética “dia de Yahweh”.
- source_word: וְנוֹרָא מְאֹד
  choice: e extremamente temível
  rationale: No contexto de juízo, נוֹרָא descreve aquilo que causa temor; “temível” preserva essa força sem as associações positivas que “impressionante” poderia ter.
- source_word: וּמִי יְכִילֶנּוּ
  choice: quem poderá suportá-lo?
  rationale: O verbo indica capacidade de aguentar ou resistir, e o pronome retoma naturalmente “o dia de Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração preserva a referência ao nome divino e evita confundi-lo com um título, sem acrescentar interpretação denominacional.
- issue: Identidade do exército e do acampamento
  choice: Preservar a força invasora como pertencente a Yahweh e subordinada à sua palavra, sem identificar sua natureza além do que o versículo afirma
  alternative: Identificá-la exclusivamente como enxame de gafanhotos ou exclusivamente como exército humano
  rationale: Os sufixos possessivos e a execução da palavra de Yahweh apresentam a força como estando sob seu comando, mas o versículo isolado não exige decidir se a imagem é de gafanhotos, de soldados humanos ou de ambos.
- issue: Número e identidade de עֹשֵׂה דְבָרוֹ
  choice: aquele que cumpre a sua palavra
  alternative: aqueles que cumprem a sua ordem
  rationale: O hebraico emprega um particípio singular, possivelmente com valor representativo ou coletivo. A tradução mantém o singular e não define com maior precisão a identidade do agente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência profética. A inversão “grande é” e “poderoso é” conserva a ênfase do hebraico sem tornar a frase obscura. Os termos militares e o singular participial foram mantidos sem resolver ambiguidades que o texto deixa abertas.
