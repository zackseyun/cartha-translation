base_translation:
  language: en
  yaml_path: translation/ot/joel/002/005.yaml
  text: Like the sound of chariots[a], they leap on the tops of the mountains; like the sound of a flame of fire consuming stubble[c][b]; like a mighty people arrayed for battle.
translation:
  language: pt
  text: Como o som de carros, eles saltam sobre os cumes dos montes; como o som de uma chama de fogo que consome o restolho; como um povo poderoso, disposto em ordem de batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «preparado para a guerra». O hebraico ressalta que o povo está organizado em formação militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקוֹל מַרְכָּבוֹת
  choice: Como o som de carros de guerra
  rationale: כְּ introduz a comparação, קוֹל indica o som e מַרְכָּבוֹת designa carros, aqui claramente evocados em contexto militar. A explicitação «de guerra» torna a imagem imediatamente compreensível sem alterar seu referente contextual.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: sobre o topo dos montes
  rationale: A expressão significa literalmente «sobre as cabeças dos montes». «Sobre o topo dos montes» conserva a imagem espacial em português natural.
- source_word: יְרַקֵּדוּן
  choice: eles saltam
  rationale: O verbo רקד pode indicar saltar, pular ou dançar. «Saltam» comunica o movimento vivo e impetuoso exigido pelo avanço descrito, sem sugerir uma dança festiva.
- source_word: לַהַב אֵשׁ אֹכְלָה קָשׁ
  choice: a chama que consome a palha
  rationale: לַהַב אֵשׁ é uma chama de fogo, enquanto אֹכְלָה retrata a ação de devorar ou consumir. קָשׁ pode ser palha ou restolho; «palha» é claro e natural para o leitor comum.
- source_word: כְּעַם עָצוּם
  choice: como um povo poderoso
  rationale: עָצוּם pode expressar força, poder ou grande número. «Poderoso» preserva a força militar da comparação sem restringir o termo apenas à quantidade.
- source_word: עֱרוּךְ מִלְחָמָה
  choice: disposto em ordem de batalha
  rationale: O particípio de ערך descreve algo organizado ou colocado em formação. A formulação explicita a formação militar ordenada presente no hebraico.
theological_decisions: []
