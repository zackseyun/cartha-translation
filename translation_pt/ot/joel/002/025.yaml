  text: וְ/שִׁלַּמְתִּ֤י לָ/כֶם֙ אֶת הַ/שָּׁנִ֔ים אֲשֶׁר֙ אָכַ֣ל הָֽ/אַרְבֶּ֔ה הַ/יֶּ֖לֶק וְ/הֶ/חָסִ֣יל וְ/הַ/גָּזָ֑ם חֵילִ/י֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר שִׁלַּ֖חְתִּי בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/025.yaml
  text: I will restore to you the years that the swarming locust has eaten—the hopper[a], the destroyer[b], and the cutter—my great army that I sent among you.
translation:
  language: pt
  text: Eu lhes restituirei os anos que o gafanhoto, o saltador, o devorador e o cortador devoraram[a] — meu grande exército, que enviei entre vocês[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os quatro termos hebraicos provavelmente indicam tipos ou fases de gafanhotos, mas suas distinções zoológicas exatas são incertas. Outras traduções possíveis incluem “gafanhoto rastejante”, “destruidor” e “roedor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “contra vocês”. A preposição hebraica também pode ser entendida nesse sentido.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Eu lhes restituirei
  rationale: O piel de שלם pode expressar compensar, retribuir ou restaurar. “Restituirei” comunica que Deus reparará as perdas, preservando a imagem marcante dos anos devolvidos.
- source_word: הַשָּׁנִים
  choice: os anos
  rationale: Mantém a formulação metonímica do hebraico, em vez de explicitar “as colheitas perdidas durante os anos”.
- source_word: אֲשֶׁר אָכַל
  choice: que ... devoraram
  rationale: “Devoraram” expressa com naturalidade a destruição agrícola. O plural em português acomoda a enumeração dos quatro termos coletivos, embora o hebraico empregue o verbo no singular.
- source_word: הָאַרְבֶּה
  choice: o gafanhoto de enxame
  rationale: אַרבה é o termo comum para gafanhoto; “de enxame” ajuda a distingui-lo dos três termos seguintes sem alegar uma espécie zoológica precisa.
- source_word: הַיֶּלֶק
  choice: o saltador
  rationale: A identificação exata é incerta. “Saltador” oferece uma designação breve e compreensível, compatível com uma forma ou fase do gafanhoto.
- source_word: וְהֶחָסִיל
  choice: o devorador
  rationale: O termo sugere um inseto consumidor ou destruidor; “devorador” preserva essa força sem impor taxonomia precisa.
- source_word: וְהַגָּזָם
  choice: o cortador
  rationale: O vocábulo é tradicionalmente associado à ação de cortar ou roer; “cortador” mantém a distinção dentro da série.
- source_word: חֵילִי הַגָּדוֹל
  choice: meu grande exército
  rationale: Preserva a metáfora militar pela qual a praga de gafanhotos é apresentada como força submetida ao comando de Deus.
- source_word: אֲשֶׁר שִׁלַּחְתִּי בָּכֶם
  choice: que enviei entre vocês
  rationale: Traduz diretamente a agência divina. A preposição ב pode indicar presença no meio do povo, embora também admita o sentido de ação contra ele.
theological_decisions:
- issue: Se os quatro termos designam gafanhotos literais ou apenas um exército humano simbólico
  choice: Praga literal de gafanhotos descrita por meio de linguagem militar
  alternative: Exército humano inteiramente metafórico
  rationale: A sequência de termos ligados a gafanhotos, seguida da expressão apositiva “meu grande exército”, sustenta a presença simultânea da praga literal e da metáfora militar; a tradução conserva ambas.
- issue: Agência divina no desastre
  choice: Deus declara que enviou a praga
  alternative: Deus apenas permitiu passivamente a praga
  rationale: O hebraico traz a declaração explícita “enviei”; a tradução não atenua essa afirmação nem acrescenta uma explicação teológica externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” evita regionalismo excessivo; “restituirei os anos” conserva a imagem poética hebraica. Os nomes funcionais dos gafanhotos permanecem deliberadamente não técnicos, e a nota registra a incerteza lexical.
