  text: וְ/קִרְע֤וּ לְבַבְ/כֶם֙ וְ/אַל בִּגְדֵי/כֶ֔ם וְ/שׁ֖וּבוּ אֶל יְהוָ֣ה אֱלֹֽהֵי/כֶ֑ם כִּֽי חַנּ֤וּן וְ/רַחוּם֙ ה֔וּא אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/013.yaml
  text: Tear your hearts and not your garments[a], and return to Yahweh your God, for he is gracious and compassionate, slow to anger and abundant in steadfast love[b], and relenting concerning the disaster.
translation:
  language: pt
  text: Rasguem o coração de vocês, e não as roupas de vocês[a], e voltem para Yahweh, seu Deus, pois ele é bondoso e compassivo, demora a se irar, é rico em amor leal e desiste de enviar a calamidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dilacerem o coração de vocês.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “volta atrás quanto à calamidade”; isto é, pode suspender o juízo anunciado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ לְבַבְכֶם
  choice: Rasguem o coração
  rationale: Mantém a imagem forte do imperativo hebraico e expressa arrependimento interior. O singular coletivo “o coração” soa natural em português ao dirigir-se ao povo.
- source_word: וְאַל בִּגְדֵיכֶם
  choice: e não as roupas
  rationale: Preserva o contraste com o gesto exterior de rasgar as vestes em sinal de luto, usando vocabulário atual e claro.
- source_word: וְשׁוּבוּ
  choice: e voltem
  rationale: Conserva o sentido básico e relacional de retornar para Deus, sem reduzi-lo ao conceito abstrato de arrependimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: חַנּוּן וְרַחוּם
  choice: bondoso e compassivo
  rationale: Distingue os dois atributos e comunica em linguagem corrente tanto a disposição favorável quanto a compaixão de Deus.
- source_word: אֶרֶךְ אַפַּיִם
  choice: demora a se irar
  rationale: Equivalente idiomático natural da expressão hebraica literalmente ligada à lentidão da ira.
- source_word: רַב חֶסֶד
  choice: rico em amor leal
  rationale: “Amor leal” representa a constância e fidelidade relacional de חֶסֶד; “rico em” expressa a abundância indicada por רַב.
- source_word: וְנִחָם עַל הָרָעָה
  choice: e volta atrás quanto à calamidade
  rationale: Preserva a afirmação hebraica de que Deus reconsidera ou desiste do juízo anunciado, sem transformar רָעָה em mal moral nem eliminar a tensão teológica da formulação.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original emprega diretamente o Tetragrama; a transliteração preserva o nome de aliança em vez de substituí-lo por um título.
- issue: Deus “volta atrás” quanto à calamidade
  choice: volta atrás quanto à calamidade
  alternative: desiste de enviar a calamidade; reconsidera a calamidade
  rationale: A formulação mantém a linguagem dinâmica do hebraico sobre a resposta divina ao arrependimento, sem explicar a tensão por meio de uma doutrina importada. “Calamidade” indica juízo punitivo, não mal moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita arcaísmos como “vestes”, “ira-se” e “longânimo”, mas conserva a força poética e a tensão teológica do hebraico.
