revisions:
- from: Rasguem o coração, e não as roupas[a], e voltem para Yahweh, seu Deus, pois ele é bondoso e compassivo, demora a se irar, é rico em amor leal e volta atrás quanto à calamidade[b].
  to: Rasguem o coração de vocês, e não as roupas de vocês[a], e voltem para Yahweh, seu Deus, pois ele é bondoso e compassivo, demora a se irar, é rico em amor leal e desiste de enviar a calamidade[b].
  rationale: A revisão melhora a clareza das referências possessivas e substitui uma formulação pouco idiomática por uma expressão portuguesa natural que corresponde ao sentido contextual de Deus desistir da calamidade anunciada. As notas foram alinhadas às respectivas âncoras e à função de alternativa lexical, sem acrescentar interpretação doutrinária.
