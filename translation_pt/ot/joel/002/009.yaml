  source_fidelity: A sequência de verbos e a imagem de invasão são preservadas. Contudo, “sobem às casas” em português normalmente indica deslocamento até as casas, não subida/entrada para dentro delas; assim, enfraquece o valor locativo de בַּבָּתִּים no contexto. “Sobem para dentro das casas” torna explícita em português a direção já indicada pela construção hebraica, sem definir os invasores.
  naturalness: O texto é fluente e mantém o ritmo rápido do original. “Sobem para dentro das casas” é mais claro e idiomático no encadeamento, embora a expressão seja deliberadamente vívida. A nota de tradução deve também evitar a formulação “sujeito implícito”, pois o texto efetivamente emprega “Eles”.
  terminology: “Muralha”, “janelas” e “ladrão” são escolhas adequadas, claras e de registro bíblico moderno. O pronome plural mantém indefinida a identidade da força invasora e não resolve a tensão imagética do contexto.
  issues:
