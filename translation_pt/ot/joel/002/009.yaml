  - severity: low
    issue: A nota de tradução afirma que “Eles” foi omitido, mas o texto o contém.
    rationale: Trata-se de inconsistência interna da documentação. O pronome é aceitável e corresponde ao plural verbal hebraico sem identificar o referente; a nota deve descrevê-lo corretamente.
