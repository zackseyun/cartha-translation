  text: בָּ/עִ֣יר יָשֹׁ֗קּוּ בַּֽ/חוֹמָה֙ יְרֻצ֔וּ/ן בַּ/בָּתִּ֖ים יַעֲל֑וּ בְּעַ֧ד הַ/חַלּוֹנִ֛ים יָבֹ֖אוּ כַּ/גַּנָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/009.yaml
  text: They rush through the city[a]; they run on the wall; they climb into the houses; they enter through the windows like a thief.
translation:
  language: pt
  text: Eles avançam pela cidade[a], correm sobre a muralha, sobem para dentro das casas e entram pelas janelas como um ladrão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na cidade”; a preposição hebraica significa literalmente “em”, mas “pela cidade” expressa o movimento dentro dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁקּוּ
  choice: avançam
  rationale: O verbo descreve movimento rápido e impetuoso. “Avançam” comunica a progressão invasora com naturalidade, sem especificar indevidamente se os agentes são gafanhotos ou soldados.
- source_word: בָּעִיר
  choice: pela cidade
  rationale: Embora בְּ signifique normalmente “em”, com um verbo de movimento “pela cidade” expressa de modo natural o deslocamento dentro dela. A alternativa mais formal é “na cidade”.
- source_word: יְרֻצוּן
  choice: correm
  rationale: Tradução direta do verbo רוץ, preservando o ritmo da sequência de ações rápidas.
- source_word: בַּחוֹמָה
  choice: sobre a muralha
  rationale: Mantém a vívida imagem de transposição ou deslocamento sobre a fortificação urbana; “muralha” é mais específico e natural neste contexto do que “muro”.
- source_word: יַעֲלוּ
  choice: sobem
  rationale: Conserva o sentido básico de “subir” sem tornar explícito um modo de entrada que o verbo hebraico não especifica por si só.
- source_word: בַּבָּתִּים
  choice: às casas
  rationale: Com “sobem”, a preposição indica movimento em direção às casas. O artigo hebraico é refletido pela contração “às”.
- source_word: בְּעַד הַחַלּוֹנִים
  choice: pelas janelas
  rationale: בְּעַד indica passagem através de uma abertura; “pelas janelas” é claro e idiomático em português.
- source_word: יָבֹאוּ
  choice: entram
  rationale: No contexto de invasão das casas por meio das janelas, “entram” transmite naturalmente o sentido contextual de בוא.
- source_word: כַּגַּנָּב
  choice: como um ladrão
  rationale: Preserva a comparação hebraica e sua imagem de intrusão, sem importar associações teológicas posteriores.
theological_decisions:
- issue: Identidade da força invasora
  choice: Manter o sujeito implícito na flexão verbal, sem identificar os invasores.
  alternative: Identificá-los explicitamente como gafanhotos ou como soldados humanos.
  rationale: O hebraico emprega verbos na terceira pessoa do plural sem nomear o sujeito neste versículo. O contexto sustenta a sobreposição entre praga de gafanhotos e invasão militar; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação fluida conserva a sucessão acelerada de movimentos. O pronome “eles” foi omitido porque a flexão verbal portuguesa mantém o sujeito indeterminado pelo contexto e evita atribuir-lhe uma identidade não explicitada no versículo.
