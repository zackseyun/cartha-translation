  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ/פָנָי/ו֙ אָ֣כְלָה אֵ֔שׁ וְ/אַחֲרָ֖י/ו תְּלַהֵ֣ט לֶֽהָבָ֑ה כְּ/גַן עֵ֨דֶן הָ/אָ֜רֶץ לְ/פָנָ֗י/ו וְ/אַֽחֲרָי/ו֙ מִדְבַּ֣ר שְׁמָמָ֔ה וְ/גַם פְּלֵיטָ֖ה לֹא הָ֥יְתָה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/003.yaml
  text: Before it[a], fire devours; behind it, a flame blazes. The land before it is like the garden of Eden, but behind it is a desolate wilderness; indeed, nothing escapes it.
translation:
  language: pt
  text: Diante dele, o fogo devora; atrás dele, uma chama arde intensamente. Diante dele, a terra é como o jardim do Éden, mas atrás dele fica um deserto devastado. De fato, nada lhe escapa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhum sobrevivente lhe resta” ou “não há como escapar dele”. O substantivo hebraico pode destacar tanto o escape quanto quem sobrevive ou resta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: diante dele
  rationale: A expressão espacial, literalmente ligada à ideia de “face” ou “frente”, descreve o que está à frente da força invasora; o sufixo hebraico masculino singular é preservado por “dele”.
- source_word: אָכְלָה אֵשׁ
  choice: o fogo devora
  rationale: O perfeito hebraico participa de uma descrição profética vívida. O presente em português comunica a cena em andamento, e “devora” preserva a imagem de consumo destrutivo.
- source_word: וְאַחֲרָיו
  choice: atrás dele
  rationale: O sentido espacial corresponde ao paralelismo com “diante dele” e soa natural em português.
- source_word: תְּלַהֵט לֶהָבָה
  choice: uma chama arde intensamente
  rationale: A forma intensiva do verbo expressa combustão forte. “Arde intensamente” transmite essa força sem recorrer a uma formulação artificial.
- source_word: כְּגַן עֵדֶן
  choice: como o jardim do Éden
  rationale: Mantém de modo claro e tradicional a alusão a Gênesis presente na construção hebraica.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da devastação agrícola e territorial, “a terra” designa naturalmente o terreno ou a região afetada, sem exigir um sentido cósmico.
- source_word: מִדְבַּר שְׁמָמָה
  choice: um deserto devastado
  rationale: A expressão nominal comunica aridez e completa desolação. “Deserto devastado” é corrente e retém a intensidade da imagem.
- source_word: וְגַם
  choice: de fato
  rationale: A expressão introduz a conclusão enfática da descrição; “de fato” comunica esse reforço em português natural.
- source_word: פְּלֵיטָה
  choice: nada lhe escapa
  rationale: O substantivo pode denotar escape, sobrevivente ou remanescente. A formulação verbal é idiomática em português e comunica a abrangência da destruição sem limitar o sentido apenas a sobreviventes humanos.
- source_word: לֹא הָיְתָה לוֹ
  choice: nada lhe escapa
  rationale: A construção é literalmente próxima de “não houve escape/sobrevivente para ele”. A redação escolhida transmite com clareza a ideia contextual de que nada fica fora do alcance da força invasora.
theological_decisions:
- issue: Referente dos sufixos pronominais masculinos singulares
  choice: Empregar “dele/lhe” para a força invasora concebida coletivamente
  alternative: Empregar uma formulação explícita como “diante dessa força” ou personificar mais fortemente o invasor
  rationale: O hebraico mantém o masculino singular, provavelmente retomando coletivamente o exército ou enxame do contexto. “Dele/lhe” preserva essa concordância sem identificar o referente como um indivíduo específico.
- issue: Amplitude de פְּלֵיטָה na cláusula final
  choice: Manter no texto a ideia abrangente de escape, registrando a leitura “sobrevivente” em nota
  alternative: Traduzir diretamente “nenhum sobrevivente lhe resta”
  rationale: O termo hebraico admite tanto a noção abstrata de escape quanto a concreta de sobrevivente ou remanescente. A tradução principal permanece aberta quanto ao objeto da devastação, e a nota preserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. O paralelismo “diante dele/atrás dele” e o contraste entre Éden e deserto foram preservados. A pontuação divide a progressão imagética em frases manejáveis sem apagar sua força poética.
