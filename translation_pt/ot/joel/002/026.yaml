base_translation:
  language: en
  yaml_path: translation/ot/joel/002/026.yaml
  text: You will surely eat and be satisfied[a], and you will praise the name of Yahweh your God, who has dealt wondrously with you[c][b]; and my people will never again be put to shame.
translation:
  language: pt
  text: Vocês certamente comerão e ficarão satisfeitos[a], e louvarão o nome de Yahweh, o Deus de vocês, que agiu de modo maravilhoso com vocês[b]; e o meu povo nunca mais será envergonhado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês comerão abundantemente e ficarão saciados”. O hebraico usa uma construção enfática, literalmente: “comer, vocês comerão”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que fez maravilhas por vocês”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “e o meu povo não será envergonhado para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אָכוֹל
  choice: Vocês certamente comerão
  rationale: O verbo finito acompanhado do infinitivo absoluto intensifica a ação. “Certamente comerão” conserva essa ênfase sem acrescentar explicitamente a ideia de quantidade, embora a abundância seja sugerida pelo contexto.
- source_word: וְשָׂבוֹעַ
  choice: e ficarão satisfeitos
  rationale: O termo indica ficar saciado após comer. Esta formulação é natural em português e comunica tanto a saciedade quanto a satisfação resultante.
- source_word: וְהִלַּלְתֶּם
  choice: e louvarão
  rationale: O piel de הלל significa aqui louvar; o verbo português é direto, corrente e apropriado ao contexto de adoração.
- source_word: שֵׁם יְהוָה אֱלֹהֵיכֶם
  choice: o nome de Yahweh, seu Deus
  rationale: “Nome” é mantido por expressar a identidade e a reputação reveladas de Deus. O pronome possessivo plural é vertido de modo natural para leitores brasileiros.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֲשֶׁר עָשָׂה עִמָּכֶם לְהַפְלִיא
  choice: que agiu maravilhosamente para com vocês
  rationale: A expressão conserva tanto a ação divina quanto seu caráter extraordinário. “Para com vocês” reflete עִם sem limitar a frase apenas à ideia de benefício.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: e o meu povo nunca mais será envergonhado
  rationale: בושׁ pode indicar sofrer vergonha ou desonra pública. “Nunca mais” expressa de modo idiomático a negação permanente de vergonha futura no contexto de restauração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pactual como nome próprio, sem impor uma substituição tradicional por título.
- issue: Força da promessa de restauração em לְעוֹלָם com יֵבֹשׁוּ
  choice: o meu povo nunca mais será envergonhado
  alternative: o meu povo não será envergonhado para sempre
  rationale: O hebraico nega permanentemente a vergonha futura. “Nunca mais” comunica em português corrente a reversão duradoura prometida, enquanto a nota registra a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural, mantém “Yahweh” como nome próprio e evita linguagem excessivamente arcaica. A pontuação acompanha as duas afirmações principais do versículo, e as notas preservam alternativas legítimas e a forma hebraica mais literal.
