  text: וִ/ידַעְתֶּ֗ם כִּ֣י בְ/קֶ֤רֶב יִשְׂרָאֵל֙ אָ֔נִי וַ/אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם וְ/אֵ֣ין ע֑וֹד וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/027.yaml
  text: Then you will know that I am in the midst of Israel[a], and that I am Yahweh your God, and there is no other; and my people will never again be put to shame.
translation:
  language: pt
  text: Então vocês saberão que eu estou no meio de Israel e que eu sou Yahweh, o Deus de vocês, e que não há outro; e o meu povo nunca mais será envergonhado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “o meu povo não será envergonhado para sempre”.'
    reason: A nota preserva a expressão temporal לְעוֹלָם (“para sempre”), enquanto “nunca mais” comunica de modo idiomático, no contexto de restauração, a negação permanente.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O perfeito qal com a conjunção, no contexto profético, apresenta o conhecimento como resultado das ações restauradoras anunciadas anteriormente. “Então” explicita essa relação consequencial de modo natural.
- source_word: בְקֶרֶב יִשְׂרָאֵל
  choice: no meio de Israel
  rationale: Preserva a ideia espacial e relacional de presença no interior do povo, com mais força do que a alternativa simples “entre Israel”.
- source_word: וַאֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: que eu sou Yahweh, o Deus de vocês
  rationale: A repetição enfática do pronome hebraico é refletida em “eu sou”; “o Deus de vocês” comunica naturalmente a relação expressa pelo sufixo de segunda pessoa do plural.
- source_word: וְאֵין עוֹד
  choice: e que não há outro
  rationale: A expressão idiomática afirma a exclusividade de Yahweh sem acrescentar um referente que o hebraico deixa implícito. O segundo “que” mantém a coordenação dos conteúdos que o povo saberá.
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: e o meu povo nunca mais passará vergonha
  rationale: בוש pode envolver vergonha, desonra pública ou frustração. “Passar vergonha” é português corrente e abrange a dimensão social; “nunca mais” comunica, no contexto de restauração, a negação duradoura expressa por לְעוֹלָם.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o nome pessoal divino, não apenas um título. A transliteração “Yahweh” preserva essa distinção.
- issue: Força da declaração וְאֵין עוֹד
  choice: não há outro
  alternative: não há ninguém além de mim
  rationale: A formulação escolhida conserva a afirmação de exclusividade presente no hebraico sem explicitar além do necessário o complemento subentendido.
- issue: Sentido da promessa final de ausência de vergonha
  choice: nunca mais passará vergonha
  alternative: jamais será envergonhado; nunca mais ficará decepcionado
  rationale: A escolha mantém tanto quanto possível a dimensão de desonra pública no contexto da restauração. A acepção de frustração ou decepção é possível para בוש, mas é menos provável aqui e não deve substituir silenciosamente a imagem principal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para a segunda pessoa do plural. A estrutura paralela foi mantida sem rigidez excessiva, e o nome divino foi transliterado como “Yahweh”.
