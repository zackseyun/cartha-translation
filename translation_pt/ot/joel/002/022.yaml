  terminology: «Figueira» e «videira» estão corretos. Para חֵילָם, «produziram em abundância» comunica com naturalidade a força produtiva/abundância agrícola; a nota registra a metáfora e mantém as alternativas sem impor uma interpretação excessivamente estreita.
