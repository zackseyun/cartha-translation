source:
  edition: WLC
  text: אַל תִּֽירְאוּ֙ בַּהֲמ֣וֹת שָׂדַ֔י כִּ֥י דָשְׁא֖וּ נְא֣וֹת מִדְבָּ֑ר כִּֽי עֵץ֙ נָשָׂ֣א פִרְי֔/וֹ תְּאֵנָ֥ה וָ/גֶ֖פֶן נָתְנ֥וּ חֵילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/022.yaml
  text: Do not fear[a], beasts of the field, for the pastures of the wilderness have become green; for the tree bears its fruit, the fig tree and the vine have given their wealth.
translation:
  language: pt
  text: Não tenham medo, animais do campo, pois as pastagens do deserto reverdeceram; as árvores deram fruto, e a figueira e a videira produziram em abundância.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deram sua força”. O hebraico pode referir-se à força produtiva, à produção ou à abundância.'
    reason: Registra a metáfora de חֵילָם e suas possibilidades sem atribuir ao hebraico uma forma verbal incorreta.
lexical_decisions:
- source_word: אַל תִּירְאוּ
  choice: Não tenham medo
  rationale: Reproduz de forma direta e natural a proibição dirigida aos animais, preservando o plural do hebraico.
- source_word: בַּהֲמוֹת שָׂדַי
  choice: animais do campo
  rationale: Expressão clara no português contemporâneo; evita o tom potencialmente pejorativo de «bestas» sem perder o sentido genérico.
- source_word: דָשְׁאוּ
  choice: reverdeceram
  rationale: O verbo expressa o surgimento de vegetação fresca; «reverdeceram» comunica de modo conciso o resultado da restauração.
- source_word: נְאֹות מִדְבָּר
  choice: as pastagens do deserto
  rationale: נְאֹות designa lugares de pastagem, enquanto מִדְבָּר é terreno ermo ou deserto, não necessariamente uma extensão arenosa.
- source_word: עֵץ נָשָׂא פִרְיוֹ
  choice: as árvores dão seu fruto
  rationale: Entende עֵץ como singular coletivo e usa o presente para retratar vividamente a fertilidade restaurada.
- source_word: תְּאֵנָה וָגֶפֶן
  choice: a figueira e a videira
  rationale: Mantém as duas espécies agrícolas específicas e sua função como imagens concretas de fertilidade.
- source_word: נָתְנוּ חֵילָם
  choice: produzem com abundância
  rationale: No contexto agrícola, חֵילָם indica força produtiva, produção ou abundância; esta formulação comunica o sentido de modo natural sem impor uma precisão inexistente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A personificação dos animais foi preservada. «Deserto» conserva a imagem bíblica, entendida aqui como região erma capaz de oferecer pastagens sazonais.
