source:
  edition: WLC
  text: וּ/בְנֵ֣י צִיּ֗וֹן גִּ֤ילוּ וְ/שִׂמְחוּ֙ בַּ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם כִּֽי נָתַ֥ן לָ/כֶ֛ם אֶת הַ/מּוֹרֶ֖ה לִ/צְדָקָ֑ה וַ/יּ֣וֹרֶד לָ/כֶ֗ם גֶּ֛שֶׁם מוֹרֶ֥ה וּ/מַלְק֖וֹשׁ בָּ/רִאשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/023.yaml
  text: And you[a], children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain for righteousness[c][b]; and he causes the rain to come down for you—the early rain and the latter rain as before.
translation:
  language: pt
  text: E vocês, filhos de Sião, alegrem-se e exultem em Yahweh, seu Deus, pois ele deu a vocês a chuva do início da estação[a] para a justiça[b]; ele faz cair sobre vocês a chuva — a chuva do início da estação e a do fim da estação — como antes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mestre para a justiça” ou “o mestre de justiça”. A palavra hebraica moreh pode significar tanto “mestre” como “chuva do início da estação”; a menção de chuva no contexto favorece aqui o segundo sentido.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “na medida certa” ou “para a vindicação de vocês”. Em sentido literal, a expressão hebraica diz “para a justiça”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no primeiro mês”. O hebraico também permite uma referência ao calendário, embora “como antes” se ajuste bem ao contexto de restauração.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  choice: E vocês, filhos de Sião
  rationale: Mantém a conjunção que liga o versículo ao discurso anterior e explicita o valor coletivo do vocativo. “Filhos” conserva a imagem familiar e pactual sem restringir a referência aos homens.
- source_word: גִּילוּ וְשִׂמְחוּ
  choice: alegrem-se e exultem
  rationale: Reproduz os dois imperativos de alegria com linguagem atual e digna, preservando sua força cumulativa.
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  choice: em Yahweh, seu Deus
  rationale: Conserva o nome divino e expressa com naturalidade o objeto ou âmbito da alegria indicado pela preposição ב.
- source_word: כִּי נָתַן לָכֶם
  choice: pois ele lhes deu
  rationale: כִּי introduz a razão da exortação, e o perfeito נָתַן é apresentado como ação realizada com relevância presente.
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  choice: a chuva do início da estação para a justiça
  rationale: O contexto agrícola favorece o sentido meteorológico de מוֹרֶה. A expressão “do início da estação” é mais transparente ao leitor moderno que “temporã”. “Para a justiça” conserva deliberadamente a dificuldade e o peso lexical de לִצְדָקָה, com alternativas registradas em nota.
- source_word: וַיּוֹרֶד לָכֶם גֶּשֶׁם
  choice: ele faz cair sobre vocês a chuva
  rationale: Reflete o valor causativo do hifil de ירד e verte לָכֶם de modo idiomático no contexto da chuva concedida ao povo.
- source_word: מוֹרֶה וּמַלְקוֹשׁ
  choice: a chuva do início da estação e a do fim da estação
  rationale: Explicita de maneira acessível as duas chuvas sazonais, evitando termos pouco correntes como “temporã” e “serôdia” sem perder o contraste agrícola.
- source_word: בָּרִאשׁוֹן
  choice: como antes
  rationale: Adota o sentido adverbial que se ajusta ao contexto de restauração, sem ocultar em nota a possível leitura calendárica.
theological_decisions:
- issue: Sentido de הַמּוֹרֶה, palavra que pode designar “mestre” ou “chuva do início da estação”
  choice: chuva do início da estação
  alternative: o mestre para a justiça; o mestre de justiça
  rationale: A continuação do versículo menciona explicitamente a chuva e as duas chuvas sazonais, favorecendo fortemente o sentido meteorológico. A alternativa didática, por ser linguisticamente possível e teologicamente relevante, é preservada em nota sem ser imposta ao texto.
- issue: Sentido de לִצְדָקָה
  choice: para a justiça
  alternative: na medida certa; para a vindicação de vocês
  rationale: A tradução principal retém a formulação difícil e a carga moral e pactual de צדקה. As alternativas contextuais são apresentadas em nota para não resolver silenciosamente a ambiguidade.
- issue: Sentido de בָּרִאשׁוֹן
  choice: como antes
  alternative: no primeiro mês; no princípio
  rationale: A leitura temporal retrospectiva combina com o tema de restauração do contexto. A possibilidade de referência ao primeiro mês é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiram-se “chuva do início da estação” e “chuva do fim da estação” a “chuva temporã” e “chuva serôdia”, por serem expressões mais transparentes ao leitor comum. A construção deliberadamente incomum “para a justiça” preserva a tensão do hebraico e é esclarecida em nota.
