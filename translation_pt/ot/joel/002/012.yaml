source:
  edition: WLC
  text: וְ/גַם עַתָּה֙ נְאֻם יְהוָ֔ה שֻׁ֥בוּ עָדַ֖/י בְּ/כָל לְבַבְ/כֶ֑ם וּ/בְ/צ֥וֹם וּ/בְ/בְכִ֖י וּ/בְ/מִסְפֵּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/012.yaml
  text: “Yet even now,” declares Yahweh[a], “return to me with all your heart, and with fasting, and with weeping, and with mourning.”
translation:
  language: pt
  text: “Mas mesmo agora”, declara Yahweh, “voltem para mim de todo o coração, com jejum, choro e lamento.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם עַתָּה
  choice: Mas, ainda agora
  rationale: A expressão introduz uma virada concessiva e enfatiza que, mesmo diante do juízo anunciado, a oportunidade de retorno permanece no presente.
- source_word: נְאֻם יְהוָה
  choice: declara Yahweh
  rationale: Preserva a fórmula profética solene e verte diretamente o nome divino יְהוָה como “Yahweh”.
- source_word: שֻׁבוּ עָדַי
  choice: voltem para mim
  rationale: שׁוב exprime fundamentalmente voltar ou retornar; com עָדַי, a imagem é relacional e direcional, sem reduzir o sentido ao termo interpretativo “arrependam-se”.
- source_word: בְּכָל לְבַבְכֶם
  choice: de todo o coração
  rationale: Expressão portuguesa natural que comunica a totalidade da disposição interior, incluindo vontade e afetos.
- source_word: וּבְצוֹם וּבְבְכִי וּבְמִסְפֵּד
  choice: com jejum, choro e lamento
  rationale: Mantém a sequência cumulativa de manifestações penitenciais em linguagem atual e solene; a única preposição compartilhada em português evita rigidez sem perder a relação sintática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio da aliança; “Yahweh” o representa por transliteração, em vez de substituí-lo por um título.
- issue: Sentido de שׁוּב no apelo da aliança
  choice: voltem
  alternative: arrependam-se; retornem
  rationale: “Voltem para mim” conserva a metáfora hebraica de retorno à relação com Deus. O arrependimento está implicado no contexto, mas não substitui toda a amplitude do verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Voltem” é mais corrente que “retornem”; “lamento” preserva a solenidade de מִסְפֵּד sem especificar indevidamente um rito funerário.
