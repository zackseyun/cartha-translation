  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/קִבַּצְתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וְ/ה֣וֹרַדְתִּ֔י/ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט וְ/נִשְׁפַּטְתִּ֨י עִמָּ֜/ם שָׁ֗ם עַל עַמִּ֨/י וְ/נַחֲלָתִ֤/י יִשְׂרָאֵל֙ אֲשֶׁ֣ר פִּזְּר֣וּ בַ/גּוֹיִ֔ם וְ/אֶת אַרְצִ֖/י חִלֵּֽקוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/002.yaml
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat[a], and there I will enter into judgment with them on behalf of my people and my inheritance, Israel[b], whom they scattered among the nations and divided up my land.
translation:
  language: pt
  text: Reunirei todas as nações e as farei descer ao vale de Josafá[a]. Ali entrarei em juízo com elas por causa do meu povo e da minha herança, Israel[b], que elas espalharam entre as nações e repartiram a minha terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vale de Josafá” é um nome de lugar. O próprio nome pode evocar a ideia de que “o SENHOR julga”.
    reason: cultural_note
  - marker: b
    text: Ou “em favor do meu povo e da minha herança, Israel” ou “a respeito do meu povo e da minha herança, Israel”. A preposição hebraica admite mais de um sentido judicial estreitamente relacionado.
    reason: alternative_reading
lexical_decisions:
- source_word: וְקִבַּצְתִּי
  choice: Reunirei
  rationale: Expressa de modo natural o ato de ajuntar ou congregar as nações para o juízo.
- source_word: כָּל הַגּוֹיִם
  choice: todas as nações
  rationale: Refere-se coletivamente aos povos estrangeiros, sem o sentido técnico posterior que “gentios” poderia sugerir.
- source_word: וְהוֹרַדְתִּים
  choice: e as farei descer
  rationale: Preserva o valor causativo da forma hebraica e a referência feminina a “nações” em português.
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: vale de Josafá
  rationale: Mantém o topônimo em sua forma portuguesa tradicional; o possível sentido evocativo do nome é registrado em nota.
- source_word: וְנִשְׁפַּטְתִּי עִמָּם
  choice: entrarei em juízo com elas
  rationale: Conserva a imagem de uma contenda ou procedimento judicial, em vez de reduzi-la apenas à emissão de uma sentença.
- source_word: עַל עַמִּי וְנַחֲלָתִי יִשְׂרָאֵל
  choice: por causa do meu povo e da minha herança, Israel
  rationale: “Por causa de” expressa naturalmente o fundamento do juízo, enquanto a nota preserva outras nuances judiciais possíveis da preposição עַל. “Israel” identifica em aposição o povo e a herança.
- source_word: פִּזְּרוּ בַגּוֹיִם
  choice: espalharam entre as nações
  rationale: Reproduz a imagem da dispersão de Israel entre outros povos em linguagem clara e corrente.
- source_word: וְאֶת אַרְצִי חִלֵּקוּ
  choice: e repartiram a minha terra
  rationale: “Repartiram” comunica a divisão concreta da terra e mantém um registro digno e natural.
theological_decisions:
- issue: Sentido pactual de נַחֲלָתִי
  choice: minha herança
  alternative: meu patrimônio; minha propriedade
  rationale: “Minha herança” preserva a linguagem bíblica de pertencimento pactual, sem explicar além do que o texto afirma.
- issue: Força da preposição עַל na cláusula judicial
  choice: por causa do meu povo
  alternative: em favor do meu povo; a respeito do meu povo
  rationale: A preposição pode indicar causa, interesse ou assunto. O texto principal apresenta uma leitura judicial natural, e a nota conserva a ambiguidade legítima.
translation_notes:
  register: 'Português moderno, claro e solene, com boa legibilidade brasileira. Mantém a metáfora judicial, o topônimo tradicional “Josafá” e a ambiguidade de עַל por meio de nota. Os marcadores foram associados ao conteúdo correspondente: [a] ao topônimo e [b] à expressão regida pela preposição ambígua.'
