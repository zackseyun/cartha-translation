  terminology: «Yahweh», «Sião» e «habita» são escolhas consistentes e adequadas. «Sangue» mantém a imagem concreta do hebraico; a nota esclarece corretamente sua dimensão judicial sem substituir o texto por «culpa de sangue» ou outra interpretação mais específica.
