  source_fidelity: 'O texto preserva adequadamente a construção hebraica difícil: a repetição de נקה, primeiro em forma afirmativa e depois negada, é representada por «Vingarei ... que ainda não vinguei». Em contexto de juízo e vindicação, «vingar o sangue» é uma interpretação contextual defensável de uma expressão elíptica e debatida. «Ainda» explicita com sobriedade a anterioridade sugerida pela segunda ocorrência, sem resolver a ambiguidade de modo indevido; a nota registra a principal alternativa idiomática.'
