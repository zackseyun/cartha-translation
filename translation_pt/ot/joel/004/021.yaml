id: JOL.4.21
reference: Joel 4:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נִקֵּ֖יתִי דָּמָ֣/ם לֹֽא נִקֵּ֑יתִי וַֽ/יהוָ֖ה שֹׁכֵ֥ן בְּ/צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/021.yaml
  text: I will avenge their blood that I have not avenged[a], and Yahweh dwells in Zion.
translation:
  language: pt
  text: Vingarei o sangue deles que ainda não vinguei[a], e Yahweh habita em Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não deixarei o sangue deles impune». O hebraico repete o mesmo verbo com uma negação, permitindo tanto o sentido de vingar o sangue derramado como o de não o deixar sem punição.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִקֵּיתִי
  choice: Vingarei
  rationale: Embora נקה no piel possa significar «declarar inocente», «purificar» ou «deixar impune», o contexto de juízo contra as nações e a combinação com «o sangue deles» favorecem o sentido judicial de vingar o sangue derramado.
- source_word: דָּמָם
  choice: o sangue deles
  rationale: Mantém a expressão concreta do hebraico, que neste contexto evoca o sangue derramado e a culpa que exige justiça.
- source_word: לֹא נִקֵּיתִי
  choice: que ainda não vinguei
  rationale: A repetição negada do mesmo verbo é difícil e elíptica. «Ainda» torna natural em português a ideia de uma vingança até então não executada, sem eliminar a alternativa idiomática registrada na nota.
- source_word: וַיהוָה
  choice: e Yahweh
  rationale: Preserva o nome divino representado pelo tetragrama יהוה, em consonância com a camada de consulta fornecida.
- source_word: שֹׁכֵן
  choice: habita
  rationale: O particípio indica residência contínua; «habita» expressa isso de modo natural, digno e corrente.
- source_word: בְּצִיּוֹן
  choice: em Sião
  rationale: Traduz diretamente a preposição ב e emprega a forma portuguesa tradicional e amplamente reconhecida do topônimo.
theological_decisions:
- issue: Sentido de נקה com «sangue» em contexto de juízo
  choice: 'Vingança judicial: Deus fará justiça pelo sangue derramado.'
  alternative: Deus purificará a culpa de sangue ou declarará inocentes os envolvidos.
  rationale: O contexto imediato trata do juízo das nações hostis e da vindicação de Judá e Jerusalém. «Vingarei» comunica melhor essa dimensão judicial, sem transformar o texto em afirmação de purificação ritual ou absolvição forense.
- issue: Relação entre וְנִקֵּיתִי e לֹא נִקֵּיתִי
  choice: 'Uma ação futura reverte uma situação anterior: «que ainda não vinguei».'
  alternative: 'Intensificação idiomática: «não deixarei o sangue deles impune».'
  rationale: O hebraico repete de forma tensa e concisa o mesmo verbo, primeiro afirmado e depois negado. O texto principal conserva o contraste temporal, enquanto a nota mantém a leitura idiomática alternativa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção «vingar o sangue» preserva a imagem bíblica e permanece inteligível; «ainda» reduz a rigidez da repetição sem apagar sua tensão.
