source:
  edition: WLC
  text: קִרְאוּ זֹאת֙ בַּ/גּוֹיִ֔ם קַדְּשׁ֖וּ מִלְחָמָ֑ה הָעִ֨ירוּ֙ הַ/גִּבּוֹרִ֔ים יִגְּשׁ֣וּ יַֽעֲל֔וּ כֹּ֖ל אַנְשֵׁ֥י הַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/009.yaml
  text: 'Proclaim this among the nations: Consecrate war; stir up the warriors[a]. Let all the men of war draw near; let them come up.'
translation:
  language: pt
  text: 'Proclamem isto entre as nações:

    “Consagrem uma guerra;[a]

    despertem os guerreiros.

    Que todos os homens de guerra se aproximem

    e subam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Preparem-se para a guerra”. O hebraico diz literalmente “Consagrem uma guerra”, empregando linguagem cultual para separar a batalha para um propósito sagrado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְאוּ זֹאת
  choice: Proclamem isto
  rationale: O imperativo plural de קרא pede uma declaração pública; “proclamem” preserva a formalidade da convocação, e “isto” mantém o demonstrativo simples זֹאת.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: גּוֹיִם designa aqui os povos estrangeiros coletivamente; “nações” é natural e evita terminologia neotestamentária importada.
- source_word: קַדְּשׁוּ מִלְחָמָה
  choice: Consagrem uma guerra
  rationale: קדשׁ significa pôr à parte ou consagrar. A formulação preserva a linguagem cultual incomum do hebraico, sem reduzi-la silenciosamente a simples preparação militar.
- source_word: הָעִירוּ הַגִּבּוֹרִים
  choice: despertem os guerreiros
  rationale: O hifil de עור tem sentido causativo de despertar ou incitar; “guerreiros” comunica com clareza o valor militar de גִּבּוֹרִים.
- source_word: יִגְּשׁוּ
  choice: Que ... se aproximem
  rationale: A forma volitiva dentro da convocação é bem expressa por “que”; “se aproximem” conserva o sentido de chegar perto para a reunião de combate.
- source_word: יַעֲלוּ
  choice: e subam
  rationale: עלה preserva a imagem direcional de subir. O sujeito continua sendo “todos os homens de guerra”, sem acrescentar a ideia interpretativa de avançar.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: todos os homens de guerra
  rationale: A expressão militar hebraica é explicitamente masculina; a tradução formal preserva isso, em vez de neutralizá-la como “combatentes” ou generalizá-la como “soldados”.
theological_decisions:
- issue: Preservar ou não a força cultual de קדשׁ na convocação para a guerra
  choice: Consagrem uma guerra
  alternative: Preparem-se para a guerra
  rationale: O verbo קדשׁ pertence ao campo de separar ou consagrar como santo. Em contexto bélico, a expressão também pode funcionar idiomaticamente como preparação para a guerra, mas traduzir apenas assim apagaria sua tensão cultual. A leitura mais idiomática é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi mantido em linhas breves. “Consagrem uma guerra” é deliberadamente marcado para conservar a linguagem cultual do original, esclarecida pela nota.
