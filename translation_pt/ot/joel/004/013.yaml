  text: שִׁלְח֣וּ מַגָּ֔ל כִּ֥י בָשַׁ֖ל קָצִ֑יר בֹּ֤אֽוּ רְדוּ֙ כִּֽי מָ֣לְאָה גַּ֔ת הֵשִׁ֨יקוּ֙ הַ/יְקָבִ֔ים כִּ֥י רַבָּ֖ה רָעָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/013.yaml
  text: Send in the sickle, for the harvest is ripe. Come, go down, for the winepress is full; the vats overflow, for their evil is great.
translation:
  language: pt
  text: Lancem a foice, pois a colheita está madura. Venham, desçam, pois o lagar está cheio; os tanques transbordam, pois grande é a maldade deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ מַגָּל
  choice: Lancem a foice
  rationale: Mantém o imperativo plural e a imagem agrícola do hebraico em português natural.
- source_word: בָשַׁל קָצִיר
  choice: a colheita está madura
  rationale: Expressa diretamente que a seara chegou ao ponto de ser ceifada.
- source_word: בֹּאוּ רְדוּ
  choice: Venham, desçam
  rationale: Preserva os dois imperativos e o sentido normal de ירד, sem substituí-lo por uma ação inferida como pisar as uvas.
- source_word: גַּת
  choice: lagar
  rationale: Termo português tradicional e preciso para o local onde as uvas são prensadas.
- source_word: הַיְקָבִים
  choice: os tanques
  rationale: Refere-se aos recipientes ou reservatórios associados ao lagar que recebem o líquido prensado; 'tanques' é claro e concreto.
- source_word: רַבָּה רָעָתָם
  choice: grande é a maldade deles
  rationale: Conserva a ênfase da ordem hebraica e traduz רָעָה aqui como maldade moral, coerente com o contexto de juízo.
theological_decisions:
- issue: A imagem do juízo na ordem רְדוּ
  choice: desçam
  alternative: pisem as uvas
  rationale: Embora o contexto do lagar possa sugerir a ação de pisar, o verbo hebraico significa literalmente 'descer'. A tradução preserva essa formulação e não explicita uma ação apenas inferida.
- issue: Referente de רָעָתָם
  choice: a maldade deles
  alternative: a calamidade deles
  rationale: O contexto apresenta a grande perversidade dos povos como razão do juízo. Mantém-se o pronome plural do hebraico sem identificar além do que o contexto fornece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural. A redação mantém o paralelismo poético e as imagens de colheita e vindima sem acrescentar explicações ao versículo.
