  text: Pois eis que, naqueles dias e naquele tempo, quando eu mudar a sorte de Judá e Jerusalém[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu restaurar a condição de Judá e Jerusalém” ou “quando eu trouxer de volta os cativos de Judá e Jerusalém”. A expressão hebraica é um idioma para reverter a condição adversa de um povo, muitas vezes tendo o exílio em vista.'
