lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função conectiva e explicativa do hebraico em relação ao contexto anterior.
- source_word: הִנֵּה
  choice: eis que
  rationale: Chama a atenção para o acontecimento futuro e preserva o tom profético solene de maneira natural em português.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: naqueles dias
  rationale: Equivalente temporal corrente, que remete ao período futuro já apresentado no discurso profético.
- source_word: וּבָעֵת הַהִיא
  choice: e naquele tempo
  rationale: Conserva o paralelismo e a ênfase temporal da expressão hebraica.
- source_word: אֲשֶׁר
  choice: quando
  rationale: Introduz naturalmente em português a oração temporal vinculada ao ato de restauração.
- source_word: אשוב אֶת שְׁבוּת
  choice: eu restaurar a situação
  rationale: Expressa o sentido idiomático de reverter a condição adversa de um povo, sem restringi-lo indevidamente a prosperidade material; as leituras ligadas ao cativeiro são preservadas em nota.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וִירוּשָׁלִָם
  choice: e Jerusalém
  rationale: Forma tradicional do nome da cidade em português, coordenada com Judá como objeto da restauração.
theological_decisions:
- issue: Sentido idiomático de שׁוּב אֶת־שְׁבוּת
  choice: restaurar a situação
  alternative: restaurar do cativeiro; trazer de volta os cativos
  rationale: A expressão pode indicar tanto a reversão ampla de uma situação aflitiva quanto, em contexto histórico, a restauração ligada ao exílio. A formulação principal preserva a abrangência do idioma hebraico, enquanto a nota mantém transparentes as possibilidades mais diretamente associadas ao cativeiro.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Pois eis que” preserva a conexão discursiva e o tom profético; “restaurar a situação” comunica o idioma hebraico sem resolver silenciosamente sua abrangência semântica.
