  text: וּ/בְנֵ֤י יְהוּדָה֙ וּ/בְנֵ֣י יְרוּשָׁלִַ֔ם מְכַרְתֶּ֖ם לִ/בְנֵ֣י הַ/יְּוָנִ֑ים לְמַ֥עַן הַרְחִיקָ֖/ם מֵ/עַ֥ל גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/006.yaml
  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
translation:
  language: pt
  text: Vocês venderam os filhos de Judá e os filhos de Jerusalém aos gregos[a], a fim de afastá-los para longe do território deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aos filhos dos gregos”; também pode ser traduzido por “aos jônios”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para longe da fronteira deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה וּבְנֵי יְרוּשָׁלִַם
  choice: os filhos de Judá e os filhos de Jerusalém
  rationale: Preserva a expressão hebraica familiar e nacional «filhos de», mantendo a coordenação enfática dos dois grupos. O waw inicial funciona naturalmente em português como continuidade do contexto e pode ser representado pela própria fluidez da acusação.
- source_word: מְכַרְתֶּם
  choice: Vocês venderam
  rationale: O qal perfeito na segunda pessoa masculina plural expressa a acusação dirigida a vários destinatários. «Vocês» dá clareza à pessoa verbal e tem ampla legibilidade brasileira.
- source_word: לִבְנֵי הַיְּוָנִים
  choice: aos gregos
  rationale: יְוָנִים pode designar gregos ou jônios. «Gregos» é a designação corrente e clara; a nota registra a forma hebraica literal «aos filhos dos gregos».
- source_word: לְמַעַן
  choice: a fim de
  rationale: Expressa propósito de maneira natural e digna, sem enfraquecer a intencionalidade da ação.
- source_word: הַרְחִיקָם
  choice: afastá-los para longe
  rationale: Reproduz o sentido causativo do hifil de רחק, isto é, fazer com que fiquem distantes, sem especificar indevidamente o meio empregado.
- source_word: מֵעַל גְּבוּלָם
  choice: do seu território
  rationale: גְּבוּל pode significar limite, fronteira ou território. Neste contexto de venda e deslocamento de pessoas, «território» comunica naturalmente o espaço de origem; a alternativa mais concreta «fronteira» é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com legibilidade brasileira. A tradução preserva «filhos de Judá» e «filhos de Jerusalém», mas emprega o idiomático «aos gregos» no destino da venda. Os marcadores aparecem junto aos termos correspondentes no texto.
