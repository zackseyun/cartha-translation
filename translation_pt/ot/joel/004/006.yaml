  source_fidelity: A tradução reproduz com precisão a acusação em segunda pessoa, os dois grupos («filhos de Judá» e «filhos de Jerusalém»), a venda aos gregos, a finalidade e o sentido causativo de afastamento. «Território» é uma opção legítima para גְּבוּל, cuja alternativa concreta «fronteira» está adequadamente registrada em nota.
  naturalness: O registro é moderno, claro e apropriado. Convém substituir o possessivo «seu» por «deles», pois «do seu território» pode, em português, ser associado de modo ambíguo aos gregos, enquanto o referente contextual são os judeus e os habitantes de Jerusalém vendidos.
  terminology: «Judá», «Jerusalém», «gregos» e «jônios» estão bem empregados. A manutenção de «filhos de» para Judá e Jerusalém preserva de modo transparente o idiomatismo nacional/familiar hebraico sem prejudicar a leitura.
