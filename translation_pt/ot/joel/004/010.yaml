base_translation:
  language: en
  yaml_path: translation/ot/joel/004/010.yaml
  text: Beat your plowshares into swords[a], and your pruning hooks into spears; let the weak say[b], “I am a warrior.”
translation:
  language: pt
  text: 'Transformem suas relhas de arado em espadas[a] e suas foices de poda em lanças. Que o fraco diga[b]: “Sou guerreiro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta imagem inverte a de Isaías 2:4 e Miqueias 4:3, onde armas são transformadas em instrumentos agrícolas.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Sou poderoso”; “Sou forte”. O hebraico גִּבּוֹר pode designar um homem poderoso, forte ou valente, bem como um guerreiro; neste contexto militar, “guerreiro” é a opção mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתּוּ
  choice: Batam ... até transformá-las
  rationale: O imperativo de כתת descreve golpear ou martelar. A formulação conserva a ação concreta e explicita, em português natural, o resultado da transformação.
- source_word: אִתֵּיכֶם
  choice: suas relhas de arado
  rationale: O substantivo designa instrumentos de lavrar a terra. “Relhas de arado” é preciso e mantém a correspondência reconhecível com Isaías 2:4 e Miqueias 4:3.
- source_word: לַחֲרָבוֹת
  choice: em espadas
  rationale: A preposição ל indica aqui resultado ou finalidade; “em espadas” comunica diretamente a transformação dos instrumentos agrícolas em armas.
- source_word: וּמַזְמְרֹתֵיכֶם
  choice: e suas foices de poda
  rationale: O termo se refere a instrumentos usados para podar. “Foices de poda” é claro para leitores modernos e preserva a imagem agrícola.
- source_word: לִרְמָחִים
  choice: em lanças
  rationale: רמח designa lança ou arma de haste semelhante. “Lanças” é a opção mais natural e amplamente compreensível.
- source_word: הַחַלָּשׁ
  choice: o fraco
  rationale: O adjetivo substantivado indica aquele que é fraco. O singular genérico do hebraico foi preservado.
- source_word: יֹאמַר
  choice: Que ... diga
  rationale: O imperfeito tem valor volitivo ou exortativo depois dos imperativos; “Que ... diga” reproduz essa força sem convertê-lo numa simples previsão.
- source_word: גִּבּוֹר
  choice: guerreiro
  rationale: גִּבּוֹר pode designar alguém poderoso, forte ou valente, frequentemente um guerreiro. O contexto de mobilização militar favorece “guerreiro”.
- source_word: אָנִי
  choice: Sou
  rationale: O pronome hebraico explícito dá ênfase à autoafirmação. Em português, “Sou guerreiro” expressa isso de modo natural e enfático.
theological_decisions:
- issue: Reversão intertextual da linguagem profética de paz
  choice: Preservar a ordem das imagens agrícolas e militares como convocação para o combate no contexto do juízo.
  alternative: Traduzir de modo genérico, sem conservar a formulação reconhecível de Isaías 2:4 e Miqueias 4:3.
  rationale: A redação hebraica inverte deliberadamente a imagem de transformar armas em ferramentas agrícolas. Manter “relhas de arado”, “espadas”, “foices de poda” e “lanças” permite que a inversão e sua tensão teológica permaneçam visíveis, sem explicá-las dentro do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção natural para leitores brasileiros. “Relhas de arado” mantém precisão agrícola e a ligação intertextual; a elipse em “e suas foices de poda, em lanças” evita repetição sem perder clareza. A fala direta concisa conserva a força da autoafirmação hebraica.
