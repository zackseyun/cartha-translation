  yaml_path: translation/ot/joel/004/015.yaml
  text: The sun and the moon grow dark[a], and the stars withdraw their brightness.
translation:
  language: pt
  text: 'O sol e a lua escurecem,

    e as estrelas recolhem o seu brilho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retêm a sua luz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶשׁ
  choice: o sol
  rationale: Equivalente padrão para o corpo celeste; o artigo definido é natural em português.
- source_word: וְיָרֵחַ
  choice: e a lua
  rationale: Tradução direta do corpo celeste, em paralelo com “o sol”.
- source_word: קָדָרוּ
  choice: escurecem
  rationale: O qal perfeito plural de קדר expressa ficar escuro ou perder a luminosidade. O presente profético “escurecem” é conciso, natural e preserva a vividez poética.
- source_word: וְכוֹכָבִים
  choice: e as estrelas
  rationale: Tradução direta do substantivo plural, com artigo definido natural em português.
- source_word: אָסְפוּ
  choice: recolhem
  rationale: Preserva a imagem básica de אסף, “reunir/recolher”, e, com “o seu brilho”, comunica que as estrelas retraem ou deixam de emitir sua luminosidade.
- source_word: נָגְהָם
  choice: o seu brilho
  rationale: נֹגַהּ denota brilho ou fulgor. “Brilho” é claro, preciso e adequado à luminosidade das estrelas.
theological_decisions:
- issue: A linguagem do escurecimento cósmico na imagem profética de juízo
  choice: Apresentar diretamente os sinais cósmicos sem definir se são literais, metafóricos ou simbólico-apocalípticos.
  alternative: Explicitar um escurecimento astronômico literal, uma figura do juízo divino ou uma combinação apocalíptica de sentido literal e simbólico.
  rationale: O hebraico descreve os fenômenos de maneira poética e concisa; a tradução deve preservar essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A quebra de linha conserva o paralelismo poético hebraico.
