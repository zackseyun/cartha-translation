  source_fidelity: A pergunta inicial foi interpretada de modo excessivamente específico como “o que têm contra mim?”, enquanto o idiomático מָה אַתֶּם לִי é mais abrangente. “Dar o troco” é coloquial e introduz uma nuance moderna de vingança que não reproduz adequadamente a formulação hebraica de pagar retribuição. A expressão final deve conservar o plural de “cabeça de vocês”.
  naturalness: A revisão mantém português moderno e claro, mas troca o coloquialismo “dar o troco” por linguagem digna e natural para o registro profético. “O que têm a ver comigo?” comunica bem o desafio idiomático sem alegar uma hostilidade mais específica do que o texto afirma.
  terminology: “Retribuição” preserva de modo consistente o campo lexical de גמול/גמל. Tiro, Sidom e Filístia estão adequados.
  issues:
