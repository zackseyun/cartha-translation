  text: וְ֠/גַם מָה אַתֶּ֥ם לִ/י֙ צֹ֣ר וְ/צִיד֔וֹן וְ/כֹ֖ל גְּלִיל֣וֹת פְּלָ֑שֶׁת הַ/גְּמ֗וּל אַתֶּם֙ מְשַׁלְּמִ֣ים עָלָ֔/י וְ/אִם גֹּמְלִ֤ים אַתֶּם֙ עָלַ֔/י קַ֣ל מְהֵרָ֔ה אָשִׁ֥יב גְּמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
translation:
  language: pt
  text: E vocês, Tiro e Sidom, e todas as regiões da Filístia, o que têm a ver comigo?[a] Vocês estão me pagando uma retribuição? Se vocês estão me retribuindo, depressa, sem demora, farei a retribuição de vocês recair sobre a cabeça de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que são vocês para mim?”. A expressão hebraica é um desafio confrontador.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “farei a retribuição de vocês voltar sobre a cabeça de vocês”.
    reason: literal_rendering
lexical_decisions:
- source_word: וְגַם מָה אַתֶּם לִי
  choice: E vocês... o que têm contra mim?
  rationale: A expressão idiomática hebraica introduz um desafio hostil. A formulação portuguesa é natural, mantém o tom confrontador e não especifica além do texto a natureza da hostilidade.
- source_word: צֹר וְצִידוֹן
  choice: Tiro e Sidom
  rationale: Formas tradicionais e amplamente reconhecidas dos topônimos em português.
- source_word: וְכֹל גְּלִילוֹת פְּלָשֶׁת
  choice: e todas as regiões da Filístia
  rationale: גְּלִילוֹת designa regiões, distritos ou territórios; “regiões” é claro e abrangente. פְּלָשֶׁת é tratado como o nome geográfico Filístia.
- source_word: הַגְּמוּל אַתֶּם מְשַׁלְּמִים עָלָי
  choice: Por acaso estão me dando o troco?
  rationale: A pergunta combina o substantivo de retribuição com o verbo “pagar/retribuir”. “Dar o troco” comunica em português atual uma retaliação dirigida contra alguém, sem tornar a frase artificialmente redundante.
- source_word: וְאִם גֹּמְלִים אַתֶּם עָלַי
  choice: Se estão me retribuindo
  rationale: Mantém a repetição do campo semântico de גמל/גמול e a possibilidade de uma ação retaliatória dirigida contra Deus.
- source_word: קַל מְהֵרָה
  choice: depressa, sem demora
  rationale: Preserva os dois elementos intensificadores do hebraico em uma combinação portuguesa natural.
- source_word: אָשִׁיב גְּמֻלְכֶם
  choice: farei a retribuição de vocês recair
  rationale: Expressa o Hifil de שוב como fazer retornar e conserva a ligação lexical com a linguagem anterior de retribuição.
- source_word: בְּרֹאשְׁכֶם
  choice: sobre a própria cabeça
  rationale: Preserva o forte idioma hebraico segundo o qual as ações e suas consequências retornam ao agente.
theological_decisions:
- issue: Natureza da resposta divina
  choice: Retribuição divina direta, descrita como a ação dos destinatários voltando sobre eles
  alternative: Uma afirmação genérica e impessoal de consequências
  rationale: A repetição de גמל/גמול, o verbo de retorno e a expressão “sobre a cabeça” apresentam uma ameaça judicial direta; a tradução não a suaviza nem a transforma em mero princípio impessoal.
- issue: Objeto da hostilidade na pergunta inicial
  choice: “o que têm contra mim?” como desafio confrontador
  alternative: “o que vocês têm a ver comigo?” ou a forma mais literal “o que vocês são para mim?”
  rationale: O idioma hebraico admite formulações distintas. A opção escolhida comunica a hostilidade do contexto sem atribuir uma motivação teológica específica às nações.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas reconhecidas no Brasil. “Vocês” torna explícito o plural presente no hebraico. A linguagem de retribuição foi preservada, mas a primeira pergunta foi vertida idiomaticamente para evitar uma construção obscura.
