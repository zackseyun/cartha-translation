    issue: A pergunta inicial é estreitada em “o que têm contra mim?”
    rationale: O hebraico literalmente pergunta “que sois vós para mim?” e funciona como desafio ou desqualificação. A formulação atual pressupõe oposição direta; “o que têm a ver comigo?” conserva melhor a amplitude do idioma.
  - severity: medium
    issue: “Dar o troco” é demasiado coloquial e interpretativo
    rationale: Embora possa sugerir retaliação, a expressão tem conotações modernas e não mantém de forma adequada a construção de “pagar retribuição” nem o encadeamento lexical do versículo.
  - severity: low
    issue: “Sobre a própria cabeça” não exprime claramente o plural hebraico
    rationale: בְּרֹאשְׁכֶם significa “sobre a cabeça de vocês”; a forma revisada deixa explícito que a retribuição recai sobre os destinatários.
