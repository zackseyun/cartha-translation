  text: מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה תִֽהְיֶ֔ה וֶ/אֱד֕וֹם לְ/מִדְבַּ֥ר שְׁמָמָ֖ה תִּֽהְיֶ֑ה מֵֽ/חֲמַס֙ בְּנֵ֣י יְהוּדָ֔ה אֲשֶׁר שָׁפְכ֥וּ דָם נָקִ֖יא בְּ/אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/019.yaml
  text: Egypt will become a desolation[a], and Edom a desolate wilderness, because of the violence done to the sons of Judah[c][b], whose innocent blood they shed in their land.
translation:
  language: pt
  text: O Egito se tornará uma desolação, e Edom, um deserto desolado, por causa da violência contra os filhos de Judá[a], pois derramaram sangue inocente[b] na terra deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos de Judá”; a expressão pode designar coletivamente o povo de Judá.
    reason: lexical_alternative
  - marker: b
    text: Ou “o sangue de inocentes”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, provavelmente, na terra dos filhos de Judá. O referente de “deles” não é explicitado no hebraico.
    reason: textual_ambiguity
lexical_decisions:
- source_word: מִצְרַיִם לִשְׁמָמָה תִהְיֶה
  choice: O Egito se tornará uma desolação
  rationale: A construção com לְ, o substantivo שְׁמָמָה e o verbo היה indica o estado resultante. “Se tornará uma desolação” preserva a força substantiva e soa clara em português.
- source_word: וֶאֱדוֹם לְמִדְבַּר שְׁמָמָה תִּהְיֶה
  choice: e Edom, um deserto desolado
  rationale: “Deserto” representa מִדְבָּר, e “desolado” comunica שְׁמָמָה. A elipse de “se tornará” é natural em português sem perder o paralelismo.
- source_word: מֵחֲמַס
  choice: por causa da violência contra
  rationale: A preposição מִן tem valor causal neste contexto; חָמָס denota violência, brutalidade ou injustiça. “Contra” expressa naturalmente a relação com as vítimas.
- source_word: בְּנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Mantém a forma concreta do hebraico, embora a expressão possa designar coletivamente o povo de Judá; essa possibilidade é registrada em nota.
- source_word: אֲשֶׁר שָׁפְכוּ
  choice: pois derramaram
  rationale: O relativo introduz a especificação da violência cometida. “Pois” explicita de modo natural a relação explicativa/causal sem acrescentar um agente nominal ausente no hebraico.
- source_word: דָם נָקִיא
  choice: sangue inocente
  rationale: Equivalente tradicional e semanticamente direto da expressão hebraica, que também pode ser entendida como “o sangue de inocentes”.
- source_word: בְּאַרְצָם
  choice: na terra deles
  rationale: Preserva o sufixo masculino plural sem inserir “própria”, que tornaria a identificação do referente mais categórica do que a forma hebraica.
theological_decisions:
- issue: Referente do sujeito plural em אֲשֶׁר שָׁפְכוּ
  choice: Entendido contextualmente como os agentes representados por Egito e Edom
  alternative: Ler a oração relativa como ligada mais diretamente a “filhos de Judá”
  rationale: O conteúdo exige que aqueles julgados sejam os que derramaram o sangue. A formulação portuguesa mantém o sujeito implícito, como no hebraico, e evita introduzir uma identificação além do necessário.
- issue: Referente do sufixo em בְּאַרְצָם
  choice: Provavelmente os filhos/o povo de Judá
  alternative: Egito e Edom, ou uma ambiguidade intencional
  rationale: A proximidade sintática e o contexto favorecem a terra de Judá, mas o sufixo isoladamente não nomeia de modo explícito o antecedente; por isso, “deles” é mantido e a questão é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O paralelismo poético foi preservado, assim como a imagem forte de a nação se tornar “uma desolação”. As ambiguidades relevantes foram mantidas no texto ou indicadas em notas.
