base_translation:
  language: en
  yaml_path: translation/ot/joel/004/020.yaml
  text: But Judah will be inhabited forever[a], and Jerusalem from generation to generation.
translation:
  language: pt
  text: Mas Judá será habitada para sempre[a], e Jerusalém, de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas Judá permanecerá para sempre”. O verbo hebraico pode ser traduzido mais literalmente por “habitar” ou “sentar-se”, mas, neste contexto de terra e cidade, provavelmente significa “ser habitada” ou “permanecer habitada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוּדָה
  choice: Mas Judá
  rationale: O waw liga o versículo ao juízo anterior sobre as nações hostis e, no contexto, tem valor contrastivo. “Mas” expressa essa relação naturalmente em português.
- source_word: לְ/עוֹלָם
  choice: para sempre
  rationale: עוֹלָם indica continuidade duradoura em direção ao futuro indefinido. “Para sempre” é a formulação portuguesa mais natural neste contexto de promessa profética.
- source_word: תֵּשֵׁב
  choice: será habitada
  rationale: O verbo ישׁב, no feminino singular e tendo Judá como sujeito territorial, pode indicar que uma terra permanece povoada. “Será habitada” comunica esse sentido contextual, enquanto a alternativa mais literal é preservada em nota.
- source_word: וִ/ירוּשָׁלִַם
  choice: e Jerusalém
  rationale: Aqui o waw tem valor aditivo simples, ligando Jerusalém à promessa feita a Judá.
- source_word: לְ/ד֥וֹר וָ/דֽוֹר
  choice: de geração em geração
  rationale: A expressão idiomática דּוֹר וָדוֹר comunica continuidade através de gerações sucessivas. “De geração em geração” preserva a repetição e é idiomática em português.
theological_decisions:
- issue: Natureza da promessa sobre o futuro duradouro de Judá e Jerusalém
  choice: Apresentar o versículo como uma promessa profética direta de habitação duradoura, sem determinar o modo ou o horizonte de seu cumprimento.
  alternative: Entender a promessa como permanência geopolítica estritamente literal ou como cumprimento primordialmente simbólico/eclesiológico.
  rationale: O hebraico afirma a continuidade de Judá e Jerusalém, mas não define neste versículo se o cumprimento é exclusivamente literal, tipológico ou escatológico. A tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula após “Jerusalém” marca naturalmente a elipse de “será habitada” na segunda oração.
