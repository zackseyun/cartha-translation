  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ע֣וּשׁוּ וָ/בֹ֧אוּ כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/011.yaml
  text: Hasten and come[a], all you nations from every side, and gather yourselves there. Bring down your mighty ones[b], O Yahweh.
translation:
  language: pt
  text: Apressem-se e venham[a], todas as nações, de todos os lados, e reúnam-se ali. Faz descer os teus valentes[b], ó Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Venham depressa”. O primeiro imperativo é raro e comunica urgência.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os teus guerreiros” ou “os teus poderosos”. O hebraico não especifica se esses agentes de Yahweh são humanos ou celestiais.'
    reason: alternative_reading
lexical_decisions:
- source_word: ע֣וּשׁוּ
  choice: Apressem-se
  rationale: O imperativo raro é entendido, neste contexto, como uma ordem de urgência. “Apressem-se” é atual e preserva a exortação sem fundi-la com o verbo seguinte.
- source_word: וָ/בֹ֧אוּ
  choice: e venham
  rationale: Traduz diretamente o imperativo de בוא e mantém a sequência retórica dos dois comandos.
- source_word: כָֽל הַ/גּוֹיִ֛ם
  choice: todas as nações
  rationale: Os imperativos mostram que as nações estão sendo interpeladas diretamente; a formulação é natural em português sem exigir um pronome vocativo adicional.
- source_word: מִ/סָּבִ֖יב
  choice: de todos os lados
  rationale: Expressa a procedência das nações ao redor e a imagem de sua convergência para um só lugar.
- source_word: וְ/נִקְבָּ֑צוּ
  choice: e reúnam-se
  rationale: O nifal, usado como imperativo, ordena que as nações se ajuntem. A forma pronominal preserva adequadamente a nuance reflexiva ou médio-passiva.
- source_word: שָׁ֕מָּ/ה
  choice: ali
  rationale: Adverbial direcional que aponta para o lugar já indicado no contexto.
- source_word: הַֽנְחַ֥ת
  choice: Faz descer
  rationale: Mantém a força causativa do imperativo hifil e o movimento descendente expresso pelo verbo.
- source_word: יְהוָ֖ה
  choice: ó Yahweh
  rationale: Translitera o nome divino e o apresenta como vocativo explícito, sem substituí-lo por um título.
- source_word: גִּבּוֹרֶֽי/ךָ
  choice: os teus valentes
  rationale: “Valentes” conserva o sentido de agentes fortes ou poderosos sem determinar se são guerreiros humanos ou seres celestiais.
theological_decisions:
- issue: Identidade dos גִּבּוֹרֶיךָ de Yahweh
  choice: os teus valentes
  alternative: os teus guerreiros; os teus poderosos; as tuas hostes celestiais
  rationale: O substantivo designa agentes poderosos pertencentes a Yahweh, mas o versículo não declara se são humanos ou celestiais. A tradução mantém essa abertura.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o tetragrama como nome próprio; a transliteração preserva essa função.
translation_notes:
  register: Português moderno, claro e digno, com formas de imperativo amplamente compreensíveis no Brasil e em outros contextos lusófonos. O vocativo “ó Yahweh” mantém solenidade sem recorrer a sintaxe excessivamente arcaica.
