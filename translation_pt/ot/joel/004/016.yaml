source:
  edition: WLC
  text: וַ/יהוָ֞ה מִ/צִּיּ֣וֹן יִשְׁאָ֗ג וּ/מִ/ירוּשָׁלִַ֨ם֙ יִתֵּ֣ן קוֹל֔/וֹ וְ/רָעֲשׁ֖וּ שָׁמַ֣יִם וָ/אָ֑רֶץ וַֽ/יהוָה֙ מַֽחֲסֶ֣ה לְ/עַמּ֔/וֹ וּ/מָע֖וֹז לִ/בְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/016.yaml
  text: And Yahweh roars from Zion and gives his voice from Jerusalem[a], and the heavens and the earth quake; but Yahweh is a refuge for his people[b], and a stronghold for the sons of Israel.
translation:
  language: pt
  text: Yahweh rugirá de Sião e, de Jerusalém, fará ouvir a sua voz[a]; os céus e a terra tremerão. Mas Yahweh é refúgio para o seu povo e fortaleza para os filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «dá a sua voz»; expressão hebraica que indica falar ou bradar com grande força.
    reason: lexical_alternative
  - marker: b
    text: A expressão «filhos de Israel» pode referir-se de modo coletivo aos descendentes ou ao povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino יהוה, em vez de substituí-lo por um título, preservando sua função como nome próprio no texto hebraico.
- source_word: מִצִּיּוֹן יִשְׁאָג
  choice: ruge de Sião
  rationale: O verbo שׁאג descreve o rugido, frequentemente de um leão; «ruge» conserva a imagem vívida e a força teofânica.
- source_word: וּמִירוּשָׁלִַם יִתֵּן קוֹלוֹ
  choice: de Jerusalém, faz ouvir a sua voz
  rationale: A expressão hebraica significa literalmente «dá a sua voz» e indica uma manifestação vocal forte ou trovejante. A formulação escolhida mantém a imagem da voz em português natural.
- source_word: וְרָעֲשׁוּ שָׁמַיִם וָאָרֶץ
  choice: os céus e a terra tremem
  rationale: רעשׁ exprime estremecimento ou abalo; «tremem» aplica-se naturalmente tanto aos céus como à terra e preserva o alcance cósmico da frase.
- source_word: מַחֲסֶה לְעַמּוֹ
  choice: refúgio para o seu povo
  rationale: מַחֲסֶה designa abrigo ou lugar de proteção; «refúgio» é claro, digno e adequado ao paralelismo.
- source_word: וּמָעוֹז
  choice: e fortaleza
  rationale: מָעוֹז pode indicar lugar fortificado ou fonte de segurança; «fortaleza» mantém a dimensão protetora e forma um paralelo natural com «refúgio».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Conserva a forma masculina plural do hebraico e a expressão histórica pactual, sem ocultar que ela pode designar coletivamente os descendentes ou o povo de Israel.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: O hebraico traz explicitamente o Tetragrama como nome próprio. «Yahweh» o preserva por transliteração, sem convertê-lo em título; «Javé» é uma forma portuguesa tradicional possível.
- issue: Alcance de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: descendentes de Israel; povo de Israel
  rationale: A tradução mantém a forma concreta do hebraico, mas a nota esclarece seu sentido nacional e coletivo, sem restringi-lo apenas a homens adultos.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O paralelismo profético foi preservado, e a pontuação destaca o contraste entre o abalo cósmico e a proteção oferecida por Yahweh.
