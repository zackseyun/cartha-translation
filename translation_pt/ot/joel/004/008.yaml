review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a repetição de «vender», a distinção entre filhos e filhas, o destinatário identificado como sabeus e a fundamentação final na fala de Yahweh. Contudo, «às mãos dos» não é a realização idiomática adequada em português para a transferência de alguém ao controle de outrem; «nas mãos dos» preserva a imagem hebraica e comunica o sentido com clareza. Além disso, «aos sabeus, a uma nação distante» pode soar como dois destinos distintos, quando «nação distante» caracteriza os sabeus.
  naturalness: «Nas mãos dos» é a formulação portuguesa natural. A aposição sem artigo em «aos sabeus, uma nação distante» torna clara a identificação explicativa. O restante mantém registro moderno, sóbrio e internacionalmente compreensível.
  terminology: «Yahweh», «sabeus», «Judá», «filhos» e «filhas» são adequados. «Sabeus» deve receber a âncora da nota cultural, pois a nota o explica diretamente.
  issues:
  - severity: medium
    issue: «às mãos dos filhos de Judá»
    rationale: Em português, a locução idiomática para entregar ou deixar alguém sob o poder de outros é «nas mãos de». «Às mãos de» geralmente significa «por intermédio de» ou «por ação de», alterando ou obscurecendo a imagem de controle expressa por בְּיַד.
  - severity: medium
    issue: «aos sabeus, a uma nação distante»
    rationale: A repetição da preposição e do artigo pode apresentar «uma nação distante» como segundo destinatário, embora o hebraico identifique os sabeus como a nação distante. A aposição «aos sabeus, uma nação distante» conserva essa relação.
  - severity: low
    issue: Âncora da nota cultural após «distante»
    rationale: A nota explica «sabeus», não «nação distante»; a âncora deve seguir o termo explicado.
  revised_text: E venderei os filhos e as filhas de vocês nas mãos dos filhos de Judá, e estes os venderão aos sabeus[a], uma nação distante, pois Yahweh falou.
  revised_footnotes:
  - marker: a
    text: Os sabeus eram o povo de Sabá.
    reason: cultural_note
  revision_rationale: A revisão corrige a locução portuguesa que expressa transferência ao controle de alguém, esclarece a aposição entre os sabeus e a nação distante e reposiciona a âncora da nota para o termo que ela explica. Não altera o sentido nem suaviza a imagem retributiva do texto.
