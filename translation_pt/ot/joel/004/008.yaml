base_translation:
  language: en
  yaml_path: translation/ot/joel/004/008.yaml
  text: And I will sell your sons and your daughters into the hand of the sons of Judah[a], and they will sell them to the Sabeans, to a distant nation[b]; for Yahweh has spoken.
translation:
  language: pt
  text: E venderei os filhos e as filhas de vocês nas mãos dos filhos de Judá, e estes os venderão aos sabeus[a], uma nação distante, pois Yahweh falou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os sabeus eram o povo de Sabá.
    reason: cultural_note
lexical_decisions:
- source_word: וּמָכַרְתִּי
  choice: E venderei
  rationale: O qal de מכר significa normalmente “vender”. A escolha preserva a imagem comercial e a inversão retributiva do contexto, sem suavizá-la.
- source_word: בְּנֵיכֶם ... בְּנוֹתֵיכֶם
  choice: os filhos e as filhas de vocês
  rationale: O hebraico distingue explicitamente descendentes do sexo masculino e feminino; a tradução mantém ambos os termos em linguagem portuguesa natural.
- source_word: בְּיַד
  choice: às mãos dos
  rationale: A expressão indica transferência ao poder ou controle de alguém. “Às mãos dos” conserva a imagem hebraica e é compreensível em português.
- source_word: בְּנֵי יְהוּדָה
  choice: filhos de Judá
  rationale: Reproduz a expressão de parentesco do hebraico. “Povo de Judá” seria mais idiomático, mas perderia essa forma concreta.
- source_word: וּמְכָרוּם
  choice: e estes os venderão
  rationale: Mantém o mesmo verbo usado no início do versículo. “Estes” esclarece naturalmente que o sujeito são os filhos de Judá, enquanto “os” retoma filhos e filhas.
- source_word: לִשְׁבָאיִם
  choice: aos sabeus
  rationale: A forma designa o povo de Sabá. “Sabeus” é o gentílico tradicional e preciso em português.
- source_word: אֶל גּוֹי רָחוֹק
  choice: a uma nação distante
  rationale: Traduz diretamente גּוֹי como “nação” e רָחוֹק como “distante”, mantendo a ideia de remoção para longe.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: pois Yahweh falou
  rationale: A conjunção fundamenta a certeza do anúncio na palavra divina. O nome próprio Yahweh representa diretamente o Tetragrama, e “falou” verte com naturalidade o perfeito דִּבֵּר.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. “Yahweh” o preserva de modo explícito, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Conservam-se a repetição de “vender”, a distinção entre filhos e filhas e a imagem “às mãos”. A relação entre “sabeus” e “nação distante” foi mantida no corpo do texto; a nota apenas fornece a identificação cultural.
