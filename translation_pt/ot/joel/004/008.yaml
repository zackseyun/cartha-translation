- from: E venderei os filhos e as filhas de vocês às mãos dos filhos de Judá, e estes os venderão aos sabeus, a uma nação distante[a], pois Yahweh falou.
  to: E venderei os filhos e as filhas de vocês nas mãos dos filhos de Judá, e estes os venderão aos sabeus[a], uma nação distante, pois Yahweh falou.
