source:
  edition: WLC
  text: יֵע֨וֹרוּ֙ וְ/יַעֲל֣וּ הַ/גּוֹיִ֔ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט כִּ֣י שָׁ֗ם אֵשֵׁ֛ב לִ/שְׁפֹּ֥ט אֶת כָּל הַ/גּוֹיִ֖ם מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/012.yaml
  text: Let the nations awaken and come up to the Valley of Jehoshaphat[a], for there I will sit to judge all the surrounding nations.
translation:
  language: pt
  text: Que as nações despertem e subam ao vale de Josafá[a], pois ali me assentarei para julgar todas as nações ao redor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Josafá provavelmente evoca o sentido de “o SENHOR julga”, reforçando a cena de julgamento divino.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעֹרוּ
  choice: Que ... despertem
  rationale: O imperfeito com valor volitivo funciona como convocação. “Despertem” preserva a imagem de serem despertadas ou incitadas para agir.
- source_word: וְיַעֲלוּ
  choice: e subam
  rationale: Mantém o sentido direcional comum de עלה e soa natural no movimento em direção ao vale designado.
- source_word: הַגּוֹיִם
  choice: as nações
  rationale: Refere-se aos povos estrangeiros reunidos para julgamento; “nações” evita associações posteriores específicas de “gentios”.
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: vale de Josafá
  rationale: Preserva o nome próprio por transliteração convencional em português, enquanto a provável alusão ao significado do nome é registrada em nota.
- source_word: כִּי שָׁם
  choice: pois ali
  rationale: Expressa de modo conciso a relação causal e retoma naturalmente o lugar mencionado.
- source_word: אֵשֵׁב
  choice: me assentarei
  rationale: Neste contexto judicial, ישב descreve tomar assento para julgar. “Me assentarei” preserva essa imagem com registro digno.
- source_word: לִשְׁפֹּט
  choice: para julgar
  rationale: Traduz diretamente a ação judicial indicada por שפט.
- source_word: כָּל הַגּוֹיִם מִסָּבִיב
  choice: todas as nações ao redor
  rationale: Preserva a abrangência de כָּל e o sentido espacial de מִסָּבִיב sem determinar de forma excessiva ao redor de quem ou de quê estão as nações.
theological_decisions:
- issue: Tradução do nome teofórico יְהוֹשָׁפָט
  choice: Manter “Josafá” no texto principal e explicar seu provável significado em nota.
  alternative: Traduzir o nome como “o SENHOR julga”.
  rationale: A transliteração preserva o nome próprio, enquanto a nota mantém acessível o jogo semântico que reforça a cena de julgamento divino.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. A construção volitiva “Que ... despertem” conserva a força convocatória; “me assentarei” mantém a imagem régia e judicial sem explicá-la em excesso.
