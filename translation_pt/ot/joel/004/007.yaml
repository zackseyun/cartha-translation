  text: הִנְ/נִ֣י מְעִירָ֔/ם מִן הַ֨/מָּק֔וֹם אֲשֶׁר מְכַרְתֶּ֥ם אֹתָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִׁבֹתִ֥י גְמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/007.yaml
  text: Look[a], I am stirring them up from the place where you sold them[b], and I will return your recompense on your own head.
translation:
  language: pt
  text: Eis que vou despertá-los[a] do lugar para onde vocês os venderam e farei a retribuição de vocês recair sobre suas próprias cabeças[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levantá-los” ou “incitá-los”. O verbo hebraico pode significar despertar, levantar ou pôr em ação.
    reason: lexical_alternative
  - marker: b
    text: Ou “retribuirei a vocês”; literalmente, “farei voltar a retribuição de vocês sobre suas cabeças”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Eis que vou
  rationale: “Eis que” conserva a força solene e chamativa da declaração divina; junto de “vou”, introduz de modo natural em português a ação iminente.
- source_word: מְעִירָם
  choice: despertá-los
  rationale: O hifil de עור pode significar despertar, levantar ou incitar. “Despertá-los” mantém a amplitude da imagem sem restringi-la a uma mobilização militar ou a uma experiência apenas interior.
- source_word: מִן הַמָּקוֹם
  choice: do lugar
  rationale: Reproduz com clareza a expressão espacial hebraica.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתָם שָׁמָּה
  choice: para onde vocês os venderam
  rationale: O advérbio direcional שָׁמָּה indica destino; “para onde” explicita naturalmente esse valor em português.
- source_word: וַהֲשִׁבֹתִי
  choice: farei ... recair
  rationale: O hifil de שוב expressa fazer voltar. Com “retribuição” como objeto, “farei ... recair” conserva a imagem de a consequência voltar sobre os culpados.
- source_word: גְמֻלְכֶם
  choice: a retribuição de vocês
  rationale: גמול designa paga ou retribuição, especialmente em sentido moral e judicial. A escolha evita reduzir a expressão a pagamento comercial.
- source_word: בְּרֹאשְׁכֶם
  choice: sobre a própria cabeça
  rationale: Preserva o idioma concreto hebraico pelo qual a retribuição volta sobre os responsáveis, com “própria” tornando clara a força reflexiva.
theological_decisions:
- issue: Natureza da ação divina em מְעִירָם
  choice: Deus declara que fará os vendidos se levantarem e saírem do lugar para onde foram levados.
  alternative: Deus apenas os despertará interiormente, ou os mobilizará especificamente para a guerra.
  rationale: O verbo admite despertar, levantar ou incitar, mas o complemento espacial aponta para uma ação que os tira do lugar da venda e dispersão. A tradução não limita o modo dessa ação.
- issue: Sentido de גְמֻלְכֶם בְּרֹאשְׁכֶם
  choice: A retribuição justa pelos atos dos ofensores recairá sobre eles mesmos.
  alternative: Uma formulação genérica como “eu os castigarei”.
  rationale: O hebraico emprega uma imagem de retorno da retribuição, destacando a correspondência moral entre o ato e sua consequência; a tradução preserva essa imagem sem acrescentar uma elaboração doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vocês” identifica diretamente os destinatários plurais. A construção final mantém a imagem hebraica de retribuição que retorna sobre a cabeça dos culpados.
