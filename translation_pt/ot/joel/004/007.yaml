  verdict: revise
  source_fidelity: A tradução acompanha adequadamente a declaração divina, o ato de despertar/erguer os vendidos do lugar para onde foram vendidos e a imagem de retribuição que retorna sobre os responsáveis. A construção «para onde vocês os venderam» reproduz de modo apropriado o valor direcional de שָׁמָּה. Contudo, o hebraico בְּרֹאשְׁכֶם traz «cabeças» no plural, e o texto principal usa indevidamente o singular «a própria cabeça».
  naturalness: O registro é moderno, claro e adequado ao português internacional com boa legibilidade brasileira. «Eis que vou despertá-los» é natural e conserva a força introdutória e a amplitude do verbo. A correção para «suas próprias cabeças» também torna a concordância com «vocês» natural e inequívoca.
  terminology: «Retribuição» representa bem גְּמוּל em seu contexto de resposta retributiva, sem reduzi-lo a pagamento comercial nem substituí-lo por uma formulação doutrinariamente mais específica como «castigo». «Despertá-los» preserva a indeterminação lexical relevante de מְעִירָם.
