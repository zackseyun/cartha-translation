  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא יִטְּפ֧וּ הֶ/הָרִ֣ים עָסִ֗יס וְ/הַ/גְּבָעוֹת֙ תֵּלַ֣כְנָה חָלָ֔ב וְ/כָל אֲפִיקֵ֥י יְהוּדָ֖ה יֵ֣לְכוּ מָ֑יִם וּ/מַעְיָ֗ן מִ/בֵּ֤ית יְהוָה֙ יֵצֵ֔א וְ/הִשְׁקָ֖ה אֶת נַ֥חַל הַ/שִּׁטִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/018.yaml
  text: And in that day the mountains will drip sweet wine[a], and the hills will flow with milk, and all the streambeds of Judah will flow with water; and a spring will come out from the house of Yahweh and will water the Valley of Shittim.
translation:
  language: pt
  text: Naquele dia, os montes gotejarão vinho novo, as colinas manarão leite, e por todos os leitos dos riachos de Judá correrão águas. Uma fonte sairá da casa de Yahweh e regará o vale de Sitim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o vale das acácias” ou “o uádi das acácias”.'
    reason: A expressão hebraica pode ser entendida como topônimo ou como referência a um vale onde crescem acácias.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural em português a fórmula temporal hebraica que introduz a cena futura.
- source_word: יִטְּפוּ
  choice: gotejarão
  rationale: Preserva a imagem concreta de líquido que pinga ou destila dos montes.
- source_word: עָסִיס
  choice: vinho novo
  rationale: Designa o produto fresco das uvas, associado à doçura e à abundância; esta formulação é clara e tradicional sem especificar indevidamente o grau de fermentação.
- source_word: תֵּלַכְנָה חָלָב
  choice: manarão leite
  rationale: Verte idiomaticamente o movimento abundante do leite e mantém o paralelismo poético, com linguagem natural em português.
- source_word: אֲפִיקֵי יְהוּדָה
  choice: os leitos dos riachos de Judá
  rationale: אֲפִיקִים pode indicar canais, ravinas ou leitos de cursos d’água; a escolha comunica a imagem de leitos normalmente secos que passam a levar água.
- source_word: יֵלְכוּ מָיִם
  choice: correrão cheios de água
  rationale: Traduz idiomaticamente o verbo hebraico de movimento e explicita a imagem de abundância sem alterar seu sentido.
- source_word: מַעְיָן
  choice: uma fonte
  rationale: Equivalente português claro para uma nascente ou fonte natural.
- source_word: מִבֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Mantém o termo hebraico literal 'casa', com sua referência cultual ao santuário, em vez de substituí-lo interpretativamente por 'templo'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וְהִשְׁקָה
  choice: regará
  rationale: O hifil significa dar água ou fazer beber; 'regará' é conciso e apropriado à imagem da terra.
- source_word: נַחַל הַשִּׁטִּים
  choice: o vale de Sitim
  rationale: Conserva Sitim como provável topônimo e traduz נַחַל de maneira acessível; a possibilidade de referência às acácias é preservada em nota.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto apresenta diretamente o Tetragrama. A transliteração preserva o nome próprio e evita substituí-lo por um título.
- issue: Se הַשִּׁטִּים deve ser entendido como topônimo ou substantivo comum
  choice: o vale de Sitim
  alternative: o vale das acácias; o uádi das acácias
  rationale: A expressão pode designar uma localidade conhecida, mas Sitim também está lexicalmente ligado às acácias. O texto principal conserva o provável topônimo, e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético e as imagens agrícolas de abundância foram preservados; 'manarão' mantém elevação moderada sem soar arcaico. O marcador [a] aparece no texto principal.
