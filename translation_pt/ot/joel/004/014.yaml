id: JOL.4.14
reference: Joel 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲמוֹנִ֣ים הֲמוֹנִ֔ים בְּ/עֵ֖מֶק הֶֽ/חָר֑וּץ כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה בְּ/עֵ֖מֶק הֶ/חָרֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/014.yaml
  text: Multitudes[a], multitudes in the Valley of Decision! For the day of Yahweh is near in the Valley of Decision.
translation:
  language: pt
  text: Multidões, multidões no vale da Decisão![a] Pois está próximo o dia de Yahweh no vale da Decisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vale do Julgamento” ou “vale da Debulha”. O termo hebraico traz a ideia de um veredito decisivo e também pode evocar a imagem da debulha.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמוֹנִים
  choice: Multidões
  rationale: O substantivo plural indica grandes massas de gente. A repetição foi mantida para preservar a escala e a urgência retórica.
- source_word: בְּעֵמֶק
  choice: no vale
  rationale: עֵמֶק é o termo comum para “vale”; a formulação é concreta, natural e direta em português.
- source_word: הֶחָרוּץ
  choice: da Decisão
  rationale: חָרוּץ pode designar aquilo que foi decidido ou decretado e também trazer associações com instrumento cortante e debulha. “Decisão” conserva a ideia de determinação decisiva sem reduzir no texto principal a amplitude do termo a uma única imagem.
- source_word: כִּי
  choice: Pois
  rationale: Neste contexto, כִּי introduz a razão da exclamação anterior; “Pois” preserva essa relação discursiva em registro profético digno.
- source_word: קָרוֹב
  choice: está próximo
  rationale: O adjetivo predica proximidade. “Está próximo” é idiomático e preserva o caráter iminente da declaração.
- source_word: יוֹם יְהוָה
  choice: o dia de Yahweh
  rationale: Mantém a expressão profética consagrada para a intervenção divina e verte o nome pessoal יהוה por transliteração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de עֵמֶק הֶחָרוּץ
  choice: vale da Decisão
  alternative: vale do Julgamento; vale da Debulha
  rationale: A expressão hebraica é semanticamente rica e pode evocar tanto um veredito decisivo quanto imagens de debulha e julgamento. O texto principal conserva “Decisão”, enquanto a nota registra as alternativas para não eliminar a tensão do original.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição enfática e a exclamação preservam a força profética. A inicial maiúscula em “Decisão” sinaliza o caráter distintivo da expressão sem transformá-la necessariamente em nome geográfico formal.
