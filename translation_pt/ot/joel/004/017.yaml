source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם שֹׁכֵ֖ן בְּ/צִיּ֣וֹן הַר קָדְשִׁ֑/י וְ/הָיְתָ֤ה יְרוּשָׁלִַ֨ם֙ קֹ֔דֶשׁ וְ/זָרִ֥ים לֹא יַֽעַבְרוּ בָ֖/הּ עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/017.yaml
  text: Then you will know that I am Yahweh your God[a], dwelling in Zion, my holy mountain. And Jerusalem will be holy, and strangers will pass through her no more.
translation:
  language: pt
  text: Então vocês saberão que eu sou Yahweh, seu Deus, que habita em Sião, meu santo monte. Jerusalém será santa, e forasteiros[a] nunca mais passarão por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estrangeiros”. O termo hebraico se refere a pessoas de fora; neste contexto, provavelmente indica os que não têm lugar na cidade santa, não necessariamente toda pessoa não israelita em qualquer sentido.
    reason: Alternativa lexical e esclarecimento da amplitude semântica de זָרִים.
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O waw ligado ao perfeito pode ter força sequencial ou consequencial no discurso profético. “Então” expressa esse resultado, e “vocês saberão” preserva tanto a segunda pessoa do plural quanto o sentido de reconhecimento expresso por ידע.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O sufixo hebraico é de segunda pessoa masculina plural. No português moderno, “seu” concorda com “Deus”, enquanto “vocês” deixa claro que os destinatários são plurais.
- source_word: שֹׁכֵן בְּצִיּוֹן
  choice: que habita em Sião
  rationale: A oração relativa é natural em português e conserva o valor descritivo do particípio שֹׁכֵן e o sentido locativo da preposição.
- source_word: הַר קָדְשִׁי
  choice: meu santo monte
  rationale: Forma idiomática e dignificada que preserva o possessivo e a santidade atribuída ao monte.
- source_word: וְהָיְתָה יְרוּשָׁלִַם קֹדֶשׁ
  choice: Jerusalém será santa
  rationale: Reproduz diretamente a predicação de santidade sem acrescentar a ideia de um processo de transformação não explicitado no hebraico.
- source_word: וְזָרִים
  choice: e forasteiros[a]
  rationale: זָרִים designa pessoas de fora ou sem pertencimento autorizado. “Forasteiros” conserva essa amplitude melhor que uma formulação exclusivamente étnica e se ajusta ao contexto de proteção da cidade santa.
- source_word: לֹא יַעַבְרוּ בָהּ עוֹד
  choice: nunca mais passarão por ela
  rationale: Mantém a imagem de atravessar ou transitar pela cidade e expressa de modo natural a combinação da negação com עוֹד.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto contém o nome pessoal divino. A transliteração “Yahweh” preserva esse nome em vez de convertê-lo em título.
- issue: Identidade dos זָרִים excluídos de Jerusalém
  choice: forasteiros
  alternative: estrangeiros; estranhos
  rationale: O contexto ressalta a santidade e a segurança de Jerusalém diante da intrusão profanadora. “Forasteiros” preserva a ideia de pessoas de fora sem afirmar que todo não israelita, em qualquer sentido, esteja necessariamente incluído.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira. Emprega “vocês” para explicitar a segunda pessoa do plural, “habita” em vez do mais literário “habita em meio a”, e conserva “monte” por seu registro bíblico ainda corrente. A coordenação foi levemente suavizada em português sem eliminar a progressão entre reconhecimento de Yahweh, santidade de Jerusalém e fim da intrusão.
