source:
  edition: WLC
  text: אֲשֶׁר כַּסְפִּ֥/י וּ/זְהָבִ֖/י לְקַחְתֶּ֑ם וּ/מַֽחֲמַדַּ/י֙ הַ/טֹּבִ֔ים הֲבֵאתֶ֖ם לְ/הֵיכְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/005.yaml
  text: because you took my silver and my gold[a], and brought my precious things into your temples.
translation:
  language: pt
  text: porque vocês tomaram a minha prata e o meu ouro e levaram as minhas coisas preciosas para os seus templos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para os seus palácios”. A palavra hebraica pode significar tanto “templos” como “palácios”; “templos” é preferível aqui porque o contexto sugere a apropriação cultual daquilo que pertence a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: porque
  rationale: No contexto, a partícula relativa introduz a razão do juízo anunciado; o valor causal é natural em português.
- source_word: כַּסְפִּי וּזְהָבִי
  choice: a minha prata e o meu ouro
  rationale: Mantém de forma direta os substantivos com os possessivos de primeira pessoa.
- source_word: לְקַחְתֶּם
  choice: vocês tomaram
  rationale: O qal perfeito na segunda pessoa masculina plural expressa uma ação concluída; “tomaram” preserva o sentido comum de לקח sem intensificá-lo como “saquearam” ou “arrebataram”.
- source_word: וּמַחֲמַדַּי הַטֹּבִים
  choice: as minhas coisas preciosas
  rationale: A expressão designa objetos desejáveis e valiosos. Esta formulação natural preserva a referência ampla sem acrescentar a especificidade de “tesouros”.
- source_word: הֲבֵאתֶם
  choice: levaram
  rationale: O hifil de בוא significa fazer entrar ou trazer. Como o movimento é para os edifícios dos destinatários, “levaram ... para” é idiomático em português.
- source_word: לְהֵיכְלֵיכֶם
  choice: para os seus templos
  rationale: היכל pode significar “templo” ou “palácio”. “Templos” se ajusta à provável apropriação cultual dos bens que pertencem a Deus, mantendo-se a alternativa lexical em nota.
theological_decisions:
- issue: Sentido de הֵיכְלֵיכֶם na acusação contra as nações
  choice: edifícios cultuais (“seus templos”)
  alternative: edifícios reais (“seus palácios”)
  rationale: O contexto favorece a ideia de que bens pertencentes a Deus foram transferidos para santuários estrangeiros, ressaltando a profanação. Contudo, como o substantivo hebraico também pode designar palácios, a tradução não exclui essa possibilidade e a registra em nota.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para a segunda pessoa plural. A redação conserva a acusação direta e evita acrescentar nuances não explícitas, como “tesouros” ou “saquearam”.
