  text: וְ/אֶל עַמִּ֖/י יַדּ֣וּ גוֹרָ֑ל וַ/יִּתְּנ֤וּ הַ/יֶּ֨לֶד֙ בַּ/זּוֹנָ֔ה וְ/הַ/יַּלְדָּ֛ה מָכְר֥וּ בַ/יַּ֖יִן וַ/יִּשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/003.yaml
  text: And they cast lots for my people[a]; they gave a boy for a prostitute, and sold a girl for wine[b], and drank it.
translation:
  language: pt
  text: Lançaram sortes sobre o meu povo[a]; deram um menino em troca de uma prostituta[b], venderam uma menina por vinho e o beberam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, dividiram pessoas como despojo por meio de sorteio.
    reason: idiom_clarification
  - marker: b
    text: O hebraico diz literalmente “deram um menino por uma prostituta”; no contexto, trata-se de uma troca exploradora, possivelmente como pagamento pelo uso de seus serviços.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל עַמִּי יַדּוּ גוֹרָל
  choice: Lançaram sortes sobre o meu povo
  rationale: A expressão hebraica descreve a divisão de pessoas como despojo mediante sorteio. “Sobre o meu povo” preserva a relação marcada pela preposição אֶל e soa natural em português.
- source_word: וַיִּתְּנוּ
  choice: deram
  rationale: Mantém o sentido direto do verbo נתן, “dar”, sem ocultar que, no contexto, a entrega fazia parte de uma troca exploradora.
- source_word: הַיֶּלֶד
  choice: um menino
  rationale: O artigo hebraico tem valor genérico neste contexto. “Menino” preserva tanto o sexo quanto o paralelismo com “menina”.
- source_word: בַּזּוֹנָה
  choice: em troca de uma prostituta
  rationale: A preposição ב marca aqui aquilo que se recebe em troca. A formulação mantém o caráter breve e chocante do hebraico, enquanto a nota reconhece a ambiguidade da construção.
- source_word: וְהַיַּלְדָּה מָכְרוּ בַיַּיִן
  choice: venderam uma menina por vinho
  rationale: “Venderam” traduz diretamente מָכְרוּ, e “por vinho” expressa o preço recebido. “Uma menina” entende o artigo como genérico e mantém o paralelo com “um menino”.
- source_word: וַיִּשְׁתּוּ
  choice: e o beberam
  rationale: O objeto está implícito no hebraico e é claramente o vinho mencionado imediatamente antes. O pronome torna essa ligação explícita e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe concisa. A linguagem direta preserva a denúncia contundente da comercialização de crianças. Evitou-se explicar em excesso no corpo do versículo, deixando a ambiguidade da segunda troca registrada em nota.
