base_translation:
  language: en
  yaml_path: translation/ot/joel/001/007.yaml
  text: It has made my vine a desolation and my fig tree splinters[a]; it has stripped it bare and thrown it down[b]; its branches have turned white.
translation:
  language: pt
  text: 'Fez da minha videira uma desolação

    e reduziu a minha figueira a estilhaços[a];

    despiu-a por completo e lançou-a fora;

    seus ramos ficaram brancos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reduziu a minha figueira a restos quebrados” ou “a tocos”. O substantivo hebraico é raro e seu sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus brotos ficaram brancos” ou “suas gavinhas ficaram brancas”, provavelmente porque a madeira ficou exposta depois que a casca foi arrancada.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם ... לְשַׁמָּה
  choice: Fez ... uma desolação
  rationale: 'A construção com שׂים e לְשַׁמָּה tem sentido resultativo: tornar algo devastado. A formulação preserva a imagem nominal e o tom profético.'
- source_word: גַּפְנִי
  choice: minha videira
  rationale: גֶּפֶן designa a planta, não necessariamente um vinhedo; o sufixo de primeira pessoa é mantido.
- source_word: וּתְאֵנָתִי
  choice: minha figueira
  rationale: תְּאֵנָה refere-se à figueira, tradução clara e natural no contexto agrícola.
- source_word: לִקְצָפָה
  choice: a estilhaços
  rationale: O substantivo é raro e parece indicar restos quebrados ou despedaçados. 'A estilhaços' comunica a destruição violenta, enquanto a incerteza lexical é registrada em nota.
- source_word: חָשֹׂף חֲשָׂפָהּ
  choice: despiu-a por completo
  rationale: O infinitivo absoluto seguido do verbo da mesma raiz intensifica a ação. A expressão portuguesa conserva tanto a ideia de deixar inteiramente descoberta quanto a ênfase.
- source_word: וְהִשְׁלִיךְ
  choice: e a lançou ao chão
  rationale: O Hifil de שלך expressa lançar ou arremessar. 'Ao chão' torna natural em português a imagem da árvore violentamente derrubada, sem suavizar a ação.
- source_word: הִלְבִּינוּ שָׂרִיגֶיהָ
  choice: seus ramos ficaram brancos
  rationale: O verbo indica que se tornaram brancos; שָׂרִיג pode designar ramos, brotos ou gavinhas. 'Ramos' é amplo e inteligível, e as alternativas são preservadas em nota.
