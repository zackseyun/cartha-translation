id: JOL.1.13
reference: Joel 1:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חִגְר֨וּ וְ/סִפְד֜וּ הַ/כֹּהֲנִ֗ים הֵילִ֨ילוּ֙ מְשָׁרְתֵ֣י מִזְבֵּ֔חַ בֹּ֚אוּ לִ֣ינוּ בַ/שַּׂקִּ֔ים מְשָׁרְתֵ֖י אֱלֹהָ֑/י כִּ֥י נִמְנַ֛ע מִ/בֵּ֥ית אֱלֹהֵי/כֶ֖ם מִנְחָ֥ה וָ/נָֽסֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/013.yaml
  text: Gird yourselves and mourn[a], O priests; wail, you ministers of the altar. Come, spend the night in sackcloth, you ministers of my God[b], because grain offering and drink offering are withheld from the house of your God.
translation:
  language: pt
  text: Cinjam-se[a] e lamentem, ó sacerdotes; soltem gritos de dor, ministros do altar. Venham, passem a noite vestidos de pano de saco, ministros do meu Deus, pois a oferta de cereal e a oferta de bebida deixaram de ser apresentadas na casa do seu Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cinjam-se”. Neste contexto, a ordem provavelmente se refere a vestir pano de saco como sinal de luto.
    reason: lexical_alternative
  - marker: b
    text: Ou “templo do seu Deus”. O hebraico diz literalmente “casa do seu Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ
  choice: Cinjam-se
  rationale: Preserva a imagem verbal hebraica sem acrescentar no texto principal o objeto implícito; o contexto posterior indica que se trata de vestir pano de saco, esclarecido em nota.
- source_word: וְסִפְדוּ
  choice: e lamentem
  rationale: Expressa tanto o luto quanto sua manifestação ritual e mantém a sequência de imperativos.
- source_word: הֵילִילוּ
  choice: soltem gritos de dor
  rationale: Distingue este verbo mais intenso do anterior e comunica em português atual o clamor audível de aflição.
- source_word: מְשָׁרְתֵי מִזְבֵּחַ
  choice: ministros do altar
  rationale: Mantém a designação cultual e a relação construta da expressão hebraica.
- source_word: לִינוּ בַשַּׂקִּים
  choice: passem a noite vestidos de pano de saco
  rationale: Comunica claramente a permanência durante a noite e o uso da roupa ritual de luto.
- source_word: מְשָׁרְתֵי אֱלֹהָי
  choice: ministros do meu Deus
  rationale: Conserva a referência do profeta na primeira pessoa e o paralelismo com os ministros do altar.
- source_word: נִמְנַע מִבֵּית אֱלֹהֵיכֶם
  choice: já não são levadas à casa do seu Deus
  rationale: Expressa de modo natural a cessação das ofertas no santuário. O plural português concorda com as duas ofertas, embora o verbo hebraico esteja no singular.
- source_word: מִנְחָה וָנָסֶךְ
  choice: a oferta de cereal e a oferta de bebida
  rationale: Identifica os dois tipos de oferta cultual sem confundi-los com sacrifícios animais.
theological_decisions:
- issue: Alternância entre אֱלֹהָי e אֱלֹהֵיכֶם
  choice: Preservar “meu Deus” e “seu Deus” no mesmo versículo
  alternative: Uniformizar como “nosso Deus” ou omitir os possessivos
  rationale: A alternância entre a primeira pessoa do profeta e a segunda pessoa dirigida aos sacerdotes pertence à retórica do hebraico e não deve ser harmonizada.
- issue: Sentido de בֵּית אֱלֹהֵיכֶם
  choice: casa do seu Deus
  alternative: templo do seu Deus
  rationale: “Casa” reproduz a metáfora hebraica e deixa explícita, em nota, a referência possível ao templo, sem substituir a imagem por sua interpretação.
translation_notes:
  register: Português moderno, solene e acessível, com imperativos diretos e paralelismo preservado. “Pano de saco” é mantido como expressão bíblica reconhecível; “soltem gritos de dor” evita o tom arcaico ou ambíguo de “uivem”.
