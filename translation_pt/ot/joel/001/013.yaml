  naturalness: O texto é claro, solene e acessível. “Cinjam-se” é formal, mas apropriado ao registro e devidamente explicado. “Soltem gritos de dor” é compreensível em português atual e distingue adequadamente o clamor intenso de “lamentem”.
  terminology: “Sacerdotes”, “ministros do altar”, “pano de saco”, “oferta de cereal” e “oferta de bebida” são escolhas adequadas. A alternância possessiva “meu Deus”/“seu Deus” deve ser mantida.
