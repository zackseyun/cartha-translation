  text: הָכְרַ֥ת מִנְחָ֛ה וָ/נֶ֖סֶךְ מִ/בֵּ֣ית יְהוָ֑ה אָֽבְלוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/009.yaml
  text: The grain offering and the drink offering are cut off from the house of Yahweh[a]; the priests mourn[c][b], the ministers of Yahweh.
translation:
  language: pt
  text: A oferta de cereal e a oferta de bebida foram suspensas na casa de Yahweh; os sacerdotes, os que servem a Yahweh, estão de luto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָכְרַת
  choice: foram cortadas
  rationale: 'O hofal de כרת exprime cessação passiva e resultante. O perfeito hebraico favorece aqui uma situação já estabelecida: as ofertas deixaram de chegar ao santuário.'
- source_word: מִנְחָה
  choice: oferta de cereal
  rationale: No contexto do culto, em paralelo com נֶסֶךְ, designa a oferta feita de produtos cerealíferos, não uma oferta genérica.
- source_word: נֶסֶךְ
  choice: oferta de bebida
  rationale: Designa uma oferta líquida derramada. A expressão é clara e acessível, sem o registro mais técnico de “libação”.
- source_word: מִבֵּית יְהוָה
  choice: da casa de Yahweh
  rationale: Preserva a imagem hebraica de “casa”, que neste contexto se refere ao templo ou santuário.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אָבְלוּ
  choice: estão de luto
  rationale: O verbo denota pranto ou luto. Esta formulação natural em português comunica o estado presente produzido pela interrupção do culto.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente direto e corrente no contexto do serviço no santuário.
- source_word: מְשָׁרְתֵי יְהוָה
  choice: os que servem a Yahweh
  rationale: A construção participial caracteriza os sacerdotes por sua função. A tradução verbal é mais natural e acessível do que “ministros” e mantém a aposição.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Relação entre “os sacerdotes” e “os que servem a Yahweh”
  choice: 'Aposição: a segunda expressão descreve os sacerdotes'
  alternative: Entender as expressões como dois grupos distintos
  rationale: A ausência de conjunção e a construção hebraica favorecem que מְשָׁרְתֵי יְהוָה identifique ou caracterize os sacerdotes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a metáfora forte “foram cortadas” e a expressão hebraica “casa de Yahweh”, evitando explicitações desnecessárias no corpo do versículo.
