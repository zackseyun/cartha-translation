review_pass:
  verdict: revise
  source_fidelity: 'O versículo é traduzido com fidelidade: מִנְחָה e נֶסֶךְ são corretamente distinguidos como ofertas de cereal e de bebida; o hofal de כרת comunica a interrupção dessas ofertas; e a expressão final caracteriza os sacerdotes como servidores de Yahweh. A revisão conserva «casa de Yahweh», que reproduz a imagem hebraica de בית.'
  naturalness: «Foram cortadas da casa» é compreensível, mas soa pouco idiomático em português moderno quando aplicado a ofertas. «Foram suspensas na casa» comunica com clareza a cessação do culto no santuário. A reorganização da segunda oração torna inequívoca a aposição de «os que servem a Yahweh».
  terminology: «Oferta de cereal», «oferta de bebida», «sacerdotes» e «Yahweh» são escolhas adequadas e consistentes. «Suspensas» é uma equivalência contextual natural para a cessação passiva indicada por הָכְרַת, sem introduzir uma causa que o texto não explicita.
  issues:
