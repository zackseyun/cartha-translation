    issue: Colocação pouco natural em «foram cortadas da casa de Yahweh».
    rationale: Embora literal e semanticamente defensável, «cortar ofertas da casa» não é uma colocação corrente em português. «Foram suspensas na casa» exprime naturalmente que tais ofertas deixaram de ser realizadas no santuário.
  - severity: low
    issue: A aposição final pode ser lida de modo truncado.
    rationale: Em «os sacerdotes estão de luto, os que servem a Yahweh», o último grupo fica solto após a oração. Isolá-lo entre vírgulas esclarece que identifica os sacerdotes, conforme a construção hebraica.
  revised_text: A oferta de cereal e a oferta de bebida foram suspensas na casa de Yahweh; os sacerdotes, os que servem a Yahweh, estão de luto.
