source:
  edition: WLC
  text: מַה נֶּאֶנְחָ֣ה בְהֵמָ֗ה נָבֹ֨כוּ֙ עֶדְרֵ֣י בָקָ֔ר כִּ֛י אֵ֥ין מִרְעֶ֖ה לָ/הֶ֑ם גַּם עֶדְרֵ֥י הַ/צֹּ֖אן נֶאְשָֽׁמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/018.yaml
  text: How the animals groan! The herds of cattle wander in confusion[a], because there is no pasture for them[b]; even the flocks of sheep suffer.
translation:
  language: pt
  text: Como gemem os animais! Os rebanhos de gado vagueiam confusos[a], porque não há pasto para eles; até os rebanhos de ovelhas sofrem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estão desnorteados” ou “estão perplexos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “carregam culpa” ou “são considerados culpados”. O verbo hebraico pode ter conotações judiciais; aqui, provavelmente indica que as ovelhas sofrem as consequências da devastação.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Como
  rationale: Funciona como partícula exclamativa de lamento, não como pronome interrogativo.
- source_word: נֶּאֶנְחָה
  choice: gemem
  rationale: Expressa de modo natural e audível a aflição dos animais.
- source_word: בְהֵמָה
  choice: os animais
  rationale: O singular coletivo abrange os animais domésticos em geral; 'gado' seria estreito demais, pois aparece especificamente na oração seguinte.
- source_word: נָבֹכוּ
  choice: vagueiam confusos
  rationale: Comunica a desorientação dos rebanhos sem perder a imagem contextual de animais à procura de pasto; a nota preserva alternativas menos concretas.
- source_word: עֶדְרֵי בָקָר
  choice: os rebanhos de gado
  rationale: Tradução clara e natural da cadeia construta.
- source_word: כִּי אֵין מִרְעֶה לָהֶם
  choice: porque não há pasto para eles
  rationale: Preserva tanto a relação causal quanto o sentido de מִרְעֶה como pastagem ou lugar de pastoreio.
- source_word: גַּם
  choice: até
  rationale: Dá força inclusiva e enfática à extensão do sofrimento aos rebanhos de ovelhas.
- source_word: עֶדְרֵי הַצֹּאן
  choice: os rebanhos de ovelhas
  rationale: Identifica explicitamente o segundo grupo de animais em português corrente.
- source_word: נֶאְשָׁמוּ
  choice: sofrem
  rationale: No contexto, evita atribuir culpa moral aos animais, mas a nota conserva as possíveis ressonâncias de culpa, responsabilidade ou consequências judiciais do verbo אשם.
theological_decisions:
- issue: A possível conotação judicial de נֶאְשָׁמוּ aplicada aos rebanhos
  choice: Traduzir no texto como 'sofrem', preservando em nota a ideia de suportar culpa ou ser considerados culpados.
  alternative: Traduzir 'sofrem castigo', 'carregam culpa' ou 'são considerados culpados'.
  rationale: O contexto descreve animais atingidos pela devastação. A formulação principal evita afirmar que eles tenham culpa moral, enquanto a nota mantém aberta a tensão lexical e judicial do hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção exclamativa natural. 'Vagueiam confusos' torna concreta a desorientação sugerida pelo contexto, enquanto as notas preservam as alternativas lexicais. O marcador [b] foi colocado junto ao verbo final a que sua nota corresponde.
