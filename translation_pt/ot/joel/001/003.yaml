  text: Tell your children about it[a], and let your children tell their children, and their children tell another generation.
translation:
  language: pt
  text: Contem isso a seus filhos[a]; que seus filhos o relatem aos filhos deles, e que estes o relatem a uma outra geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus filhos ... os filhos deles ... os filhos deles”. A palavra também pode significar “filhos homens”; aqui, “filhos” abrange os descendentes em geral, pois o contexto trata da transmissão da memória entre gerações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיהָ
  choice: isso
  rationale: O pronome feminino singular retoma a calamidade descrita no contexto. Em português, “contar isso” expressa naturalmente a ideia de relatar o acontecimento, sem reproduzir o gênero gramatical hebraico.
- source_word: לִבְנֵיכֶם
  choice: a seus filhos
  rationale: בנים pode designar especificamente filhos homens ou, em sentido coletivo, os filhos em geral. O contexto de transmissão entre gerações favorece o sentido abrangente.
- source_word: סַפֵּרוּ
  choice: Contem
  rationale: O imperativo piel plural indica o ato deliberado de narrar ou relatar. “Contem” é claro, natural e preserva a força imperativa.
- source_word: וּבְנֵיכֶם לִבְנֵיהֶם
  choice: que seus filhos contem aos filhos deles
  rationale: O hebraico omite o verbo nas cláusulas seguintes; repor “contem” em português deixa explícita a continuação da ordem e produz uma frase natural.
- source_word: וּבְנֵיהֶם
  choice: e estes
  rationale: “Estes” retoma sem ambiguidade os filhos da geração anterior e evita uma sequência pesada de possessivos, preservando a cadeia geracional.
- source_word: לְדוֹר אַחֵר
  choice: a outra geração
  rationale: A expressão indica uma geração posterior, sem se limitar necessariamente à geração imediatamente seguinte. “Outra geração” conserva essa abertura.
