source:
  edition: WLC
  text: קַדְּשׁוּ צוֹם֙ קִרְא֣וּ עֲצָרָ֔ה אִסְפ֣וּ זְקֵנִ֗ים כֹּ֚ל יֹשְׁבֵ֣י הָ/אָ֔רֶץ בֵּ֖ית יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/זַעֲק֖וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/014.yaml
  text: Consecrate a fast; call a solemn assembly. Gather the elders[a], all the inhabitants of the land, to the house of Yahweh your God, and cry out to Yahweh.
translation:
  language: pt
  text: Consagrem um jejum; convoquem uma assembleia solene. Reúnam os anciãos, todos os habitantes da terra[a], na casa de Yahweh, o Deus de vocês, e clamem a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da Terra”. A palavra hebraica pode designar a terra, isto é, o território local, ou a Terra em sentido amplo; aqui, a convocação centrada no templo favorece o sentido local.
    reason: Leitura alternativa decorrente da amplitude semântica de הָאָרֶץ.
lexical_decisions:
- source_word: קַדְּשׁוּ צוֹם
  choice: Consagrem um jejum
  rationale: O imperativo de קדשׁ pede que o jejum seja formalmente separado para finalidade sagrada. “Consagrem” conserva essa força religiosa em português atual.
- source_word: קִרְאוּ עֲצָרָה
  choice: convoquem uma assembleia solene
  rationale: קרא, neste contexto, expressa a convocação pública, e עֲצָרָה designa uma reunião formal de culto. A formulação preserva a gravidade litúrgica sem soar arcaica.
- source_word: אִסְפוּ זְקֵנִים
  choice: Reúnam os anciãos
  rationale: “Reúnam” traduz diretamente o imperativo de ajuntar pessoas. “Anciãos” preserva a provável referência aos líderes reconhecidos da comunidade, sem reduzir o termo apenas a homens idosos.
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: No contexto de Joel, a convocação se dirige à população local e está centrada no templo; por isso, “terra” é preferível a “mundo” ou “Terra”. A possível amplitude do substantivo hebraico é registrada em nota.
- source_word: בֵּית יְהוָה אֱלֹהֵיכֶם
  choice: na casa de Yahweh, o Deus de vocês
  rationale: Embora o hebraico não traga uma preposição explícita antes de “casa”, o movimento implícito em “reúnam” exige uma formulação locativa em português. “Na casa” comunica o destino e local da reunião; “o Deus de vocês” torna inequívoco o sufixo plural.
- source_word: וְזַעֲקוּ אֶל יְהוָה
  choice: e clamem a Yahweh
  rationale: זעק denota um clamor intenso e urgente, especialmente em aflição ou súplica. “Clamem” mantém essa intensidade e rege naturalmente a preposição “a”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pessoal divino, em vez de substituí-lo por um título.
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: a Terra; o mundo
  rationale: A convocação nacional, dirigida aos habitantes e centrada na casa de Yahweh, favorece o sentido local de território. Como o hebraico também pode designar a terra em sentido mais amplo, essa possibilidade permanece indicada na nota.
- issue: Relação entre זְקֵנִים e כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: 'manter a sequência justaposta: “os anciãos, todos os habitantes”'
  alternative: “os anciãos e todos os habitantes”
  rationale: O hebraico apresenta os dois grupos sem conjunção. A vírgula conserva a forma compacta e não decide de modo excessivo se o segundo sintagma amplia, especifica ou se soma ao primeiro.
translation_notes:
  register: Português atual, digno e de fácil compreensão, com boa legibilidade brasileira. Empregaram-se imperativos no plural e “o Deus de vocês” para deixar claro que o destinatário é coletivo. A pontuação mantém o ritmo urgente da série de ordens e preserva a justaposição do hebraico.
