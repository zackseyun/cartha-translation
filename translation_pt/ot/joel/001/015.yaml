id: JOL.1.15
reference: Joel 1:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֲהָ֖הּ לַ/יּ֑וֹם כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה וּ/כְ/שֹׁ֖ד מִ/שַׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/015.yaml
  text: Alas for the day! For the day of Yahweh is near[a], and it comes like destruction from the Almighty.
translation:
  language: pt
  text: Ai, que dia! Pois o dia de Yahweh está próximo e virá como devastação da parte do Todo-Poderoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No hebraico, há um jogo sonoro entre shod (“devastação”) e Shaddai (“Todo-Poderoso”).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ לַיּוֹם
  choice: Ai, que dia!
  rationale: A interjeição expressa lamento e alarme. Esta formulação é natural em português e comunica a reação pesarosa diante do dia anunciado, sem reduzir a expressão a uma sentença formal de condenação.
- source_word: כִּי קָרוֹב
  choice: Pois ... está próximo
  rationale: כִּי apresenta a razão do lamento, e קָרוֹב funciona como adjetivo predicativo que indica iminência.
- source_word: יוֹם יְהוָה
  choice: o dia de Yahweh
  rationale: Mantém a expressão profética e representa יְהוָה pelo nome divino, em vez de substituí-lo por um título.
- source_word: וּכְשֹׁד
  choice: e virá como devastação
  rationale: שֹׁד designa ruína violenta ou devastação; a conjunção e a comparação foram preservadas. O futuro em português expressa naturalmente a chegada iminente indicada pelo imperfeito hebraico.
- source_word: מִשַׁדַּי
  choice: da parte do Todo-Poderoso
  rationale: A preposição מִן indica a procedência da devastação. “Todo-Poderoso” comunica o sentido tradicional de שַׁדַּי, enquanto a nota preserva a forma hebraica relevante para o jogo sonoro.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel, sem substituí-lo pelo título “Senhor”.
- issue: Relação entre שֹׁד e שַׁדַּי
  choice: devastação ... Todo-Poderoso, com explicação em nota
  alternative: devastação ... Shaddai
  rationale: A tradução principal comunica o sentido de ambos os termos em português. Como o jogo sonoro hebraico não pode ser reproduzido com naturalidade, ele é explicitado em nota sem impor uma etimologia como base do sentido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ai, que dia!” conserva a força do lamento profético; “da parte do” expressa de modo natural a ideia de procedência.
