  text: אֱלִ֕י כִּ/בְתוּלָ֥ה חֲגֻֽרַת שַׂ֖ק עַל בַּ֥עַל נְעוּרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/008.yaml
  text: Wail like a virgin clothed in sackcloth for the husband of her youth[a][b].
translation:
  language: pt
  text: Lamente como uma virgem, vestida de pano de saco, pelo marido de sua juventude[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cingida de pano de saco”.'
    reason: lexical_alternative
  - marker: b
    text: “Marido” também pode ser entendido aqui como “noivo”, pois a imagem é poética e culturalmente condensada.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִי
  choice: Lamente
  rationale: O imperativo feminino singular convoca a uma expressão audível de pesar; “lamente” é natural, digno e mantém a força do lamento profético.
- source_word: כִּבְתוּלָה
  choice: como uma virgem
  rationale: O prefixo כ marca comparação, e בְּתוּלָה tem como sentido usual “virgem”; a tradução preserva a imagem hebraica sem suavizá-la.
- source_word: חֲגֻרַת שַׂק
  choice: vestida de pano de saco
  rationale: A expressão significa literalmente “cingida de pano de saco”; “vestida” comunica naturalmente em português o estado descrito pelo particípio, enquanto a nota preserva a formulação mais literal.
- source_word: שַׂק
  choice: pano de saco
  rationale: Equivalente bíblico reconhecível para o tecido grosseiro usado como sinal de luto, com maior clareza ampla do que o simples empréstimo “cilício”.
- source_word: עַל
  choice: pelo
  rationale: Em contexto de luto, עַל introduz a pessoa por quem se lamenta; “pelo” é a construção idiomática em português.
- source_word: בַּעַל
  choice: marido
  rationale: Embora o termo também possa significar senhor ou dono, neste contexto relacional, ligado a “sua juventude”, indica o parceiro conjugal. A possível referência ao noivo prometido fica registrada em nota.
- source_word: נְעוּרֶיהָ
  choice: da sua juventude
  rationale: A construção genitival modifica “marido” e preserva a expressão hebraica referente ao vínculo estabelecido na juventude.
theological_decisions:
- issue: A imagem de uma “virgem” que lamenta o “marido da sua juventude”
  choice: Manter no texto a imagem hebraica comprimida, sem harmonizá-la com uma categoria moderna plenamente explícita.
  alternative: Traduzir בַּעַל como “noivo” ou parafrasear a mulher como uma jovem noiva que lamenta seu prometido.
  rationale: 'A poesia preserva uma tensão cultural e semântica genuína: בְּתוּלָה pode designar uma virgem ou jovem em idade de casar, enquanto בַּעַל aponta para uma relação conjugal e pode, no contexto, ser entendido como o noivo prometido. A tradução principal não deve resolver o que o hebraico deixa condensado.'
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com boa legibilidade brasileira. “Pano de saco” conserva a imagem concreta do luto e evita o vocábulo menos transparente “cilício”. A colocação “da sua juventude” mantém a formulação bíblica e sua tensão poética.
