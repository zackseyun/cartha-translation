base_translation:
  language: en
  yaml_path: translation/ot/joel/001/016.yaml
  text: Is not food cut off before our eyes[b][a], joy and gladness from the house of our God?
translation:
  language: pt
  text: Não foram cortados diante dos nossos olhos o alimento e, da casa do nosso Deus[b], a alegria e o júbilo[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a alegria e a exultação”. O segundo termo pode indicar uma alegria intensa e exultante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “do templo do nosso Deus”. O hebraico diz literalmente “da casa do nosso Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Não foi... ?
  rationale: Introduz uma pergunta retórica que espera concordância; a forma interrogativa preserva diretamente essa força.
- source_word: נֶגֶד עֵינֵינוּ
  choice: diante dos nossos olhos
  rationale: Expressa algo que acontece de modo aberto e visível, mantendo a vivacidade da imagem hebraica.
- source_word: אֹכֶל
  choice: alimento
  rationale: É um termo geral para comida, não especificamente pão, e se ajusta ao contexto de devastação agrícola.
- source_word: נִכְרָת
  choice: cortado
  rationale: Preserva a imagem concreta do nifal de כרת, sem reduzi-la a uma explicação como 'destruído' ou 'retirado'.
- source_word: מִבֵּית אֱלֹהֵינוּ
  choice: da casa do nosso Deus
  rationale: Reproduz a expressão hebraica de modo formal e inteligível; no contexto, a casa é o templo.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Equivalente corrente e conciso, apropriado ao primeiro termo do paralelismo poético.
- source_word: וָגִיל
  choice: e o júbilo
  rationale: Distingue o segundo quase sinônimo e transmite sua nuance de alegria intensa e exultante.
theological_decisions:
- issue: Alcance sintático da pergunta retórica sobre duas perdas coordenadas
  choice: A pergunta abrange tanto o alimento como a alegria e o júbilo; no segundo membro, o verbo 'foi cortado' fica elíptico.
  alternative: A perda da alegria e do júbilo seria uma descrição apositiva do efeito de o alimento ter sido cortado.
  rationale: A poesia hebraica frequentemente omite no segundo membro um verbo já expresso no primeiro. A tradução mantém a elipse e o paralelismo, sem resolver além do necessário a relação entre a falta de sustento e a cessação da celebração cultual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a pergunta retórica, a imagem de algo ser 'cortado', a expressão hebraica 'casa do nosso Deus' e a elipse poética do verbo no segundo membro.
