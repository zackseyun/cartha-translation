  text: שֻׁדַּ֣ד שָׂדֶ֔ה אָבְלָ֖ה אֲדָמָ֑ה כִּ֚י שֻׁדַּ֣ד דָּגָ֔ן הוֹבִ֥ישׁ תִּיר֖וֹשׁ אֻמְלַ֥ל יִצְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/010.yaml
  text: The field is devastated; the ground mourns[a], for the grain is devastated, the new wine has dried up, the oil has failed.
translation:
  language: pt
  text: O campo está devastado; o solo está de luto, pois os cereais foram destruídos, o vinho novo secou, e o azeite definhou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o azeite acabou”. O termo hebraico se refere ao óleo recém-produzido, geralmente azeite de oliva, na tríade básica “cereais, vinho novo e azeite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: está devastado / foram destruídos
  rationale: A forma passiva de שׁדד indica ruína severa. A variação verbal em português evita uma repetição rígida sem enfraquecer a correspondência entre o campo e os cereais.
- source_word: שָׂדֶה
  choice: campo
  rationale: Mantém o singular coletivo do hebraico e o sentido agrícola comum.
- source_word: אָבְלָה
  choice: está de luto
  rationale: Preserva a personificação poética do solo, em vez de reduzi-la à ideia física de ressecamento.
- source_word: אֲדָמָה
  choice: solo
  rationale: Distingue אֲדָמָה de שָׂדֶה e soa natural na imagem do solo personificado.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a causa do luto do solo em registro poético digno.
- source_word: דָּגָן
  choice: cereais
  rationale: Designa genericamente a produção cerealífera; o plural coletivo é mais natural e claro em português moderno.
- source_word: הוֹבִישׁ
  choice: secou
  rationale: No contexto agrícola, expressa o ressecamento e a perda do produto, não a ideia literal de vergonha.
- source_word: תִּירוֹשׁ
  choice: vinho novo
  rationale: Representa o produto recente da uva, preservando a expressão tradicional e a tríade agrícola.
- source_word: אֻמְלַל
  choice: acabou
  rationale: Comunica de modo idiomático que a produção de azeite definhou ou faltou, sem sugerir que o líquido literalmente murchou.
- source_word: יִצְהָר
  choice: azeite
  rationale: No contexto da tríade agrícola, refere-se ao óleo fresco, normalmente azeite de oliva; 'azeite' é claro e natural para leitores de português.
