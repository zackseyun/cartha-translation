id: JOL.1.11
reference: Joel 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֹבִ֣ישׁוּ אִכָּרִ֗ים הֵילִ֨ילוּ֙ כֹּֽרְמִ֔ים עַל חִטָּ֖ה וְ/עַל שְׂעֹרָ֑ה כִּ֥י אָבַ֖ד קְצִ֥יר שָׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/011.yaml
  text: Be ashamed[a], farmers; wail, vinedressers, over the wheat and over the barley[b], because the harvest of the field has perished.
translation:
  language: pt
  text: Envergonhem-se[a], lavradores; lamentem em alta voz[b], trabalhadores das vinhas, por causa do trigo e da cevada, pois se perdeu a colheita do campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Fiquem consternados” ou “Sejam envergonhados”. O verbo hebraico pode indicar tanto aflição e desconcerto quanto vergonha.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uivem”; o verbo hebraico indica um grito alto de dor.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Envergonhem-se
  rationale: O imperativo plural hifil de בוש pode expressar vergonha ou consternação. A tradução preserva a força imperativa e sua tensão lexical, com alternativa indicada em nota.
- source_word: אִכָּרִים
  choice: lavradores
  rationale: Designa os que trabalham ou cultivam o solo. “Lavradores” é claro, digno e especialmente adequado ao contexto de cereais.
- source_word: הֵילִילוּ
  choice: lamentem em alta voz
  rationale: O verbo ילל indica um grito intenso de dor. A expressão comunica esse lamento audível de modo natural em português.
- source_word: כֹּרְמִים
  choice: trabalhadores das vinhas
  rationale: Refere-se aos que cuidam das vinhas. Esta formulação é precisa e mais amplamente compreensível que termos técnicos ou pouco usuais.
- source_word: עַל
  choice: por causa de
  rationale: 'No contexto de lamento, עַל apresenta o motivo da aflição: a perda do trigo e da cevada.'
- source_word: חִטָּה וְעַל שְׂעֹרָה
  choice: o trigo e a cevada
  rationale: São as equivalências correntes e exatas dos dois cereais; a coordenação hebraica é preservada naturalmente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão das ordens anteriores e mantém uma conexão causal natural e digna.
- source_word: אָבַד
  choice: se perdeu
  rationale: O qal perfeito de אבד descreve a colheita como perdida ou arruinada. “Se perdeu” preserva o estado resultante sem introduzir explicitamente um agente destruidor.
- source_word: קְצִיר שָׂדֶה
  choice: a colheita do campo
  rationale: Reproduz de maneira transparente a relação construta e mantém a imagem agrícola concreta.
theological_decisions: []
