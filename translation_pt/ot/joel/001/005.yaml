  text: הָקִ֤יצוּ שִׁכּוֹרִים֙ וּ/בְכ֔וּ וְ/הֵילִ֖לוּ כָּל שֹׁ֣תֵי יָ֑יִן עַל עָסִ֕יס כִּ֥י נִכְרַ֖ת מִ/פִּי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/005.yaml
  text: Wake up[a], you drunkards, and weep; wail, all you drinkers of wine, over the sweet wine, because it has been cut off from your mouth.
translation:
  language: pt
  text: Acordem, bêbados, e chorem; lamentem, todos vocês que bebem vinho, por causa do vinho doce[a], pois ele foi tirado da boca de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vinho novo” ou “vinho fresco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקִיצוּ
  choice: Acordem
  rationale: Imperativo plural que convoca pessoas a despertar do sono ou do entorpecimento; é natural e mantém a força profética.
- source_word: שִׁכּוֹרִים
  choice: bêbados
  rationale: Adjetivo substantivado em vocativo, com caracterização direta dos destinatários.
- source_word: וּבְכוּ
  choice: e chorem
  rationale: Expressa choro de pesar e se encaixa no contexto de lamentação.
- source_word: וְהֵילִלוּ
  choice: lamentem
  rationale: Indica um clamor intenso e público de dor; evita a associação animal que 'uivem' pode sugerir no português atual.
- source_word: כָּל שֹׁתֵי יָיִן
  choice: todos vocês que bebem vinho
  rationale: Preserva o valor vocativo e caracteriza os destinatários pelo ato de beber vinho.
- source_word: עַל
  choice: por causa de
  rationale: Introduz aqui o motivo da lamentação de modo claro e idiomático.
- source_word: עָסִיס
  choice: vinho doce
  rationale: O termo pode designar vinho recém-prensado, fresco ou doce; 'vinho doce' comunica naturalmente a bebida desejável sem restringir indevidamente seu estágio de produção.
- source_word: נִכְרַת
  choice: foi tirado
  rationale: O nifal de כרת descreve algo cortado ou removido; no contexto do abastecimento de vinho, 'foi tirado' preserva o resultado da privação em português natural.
- source_word: מִפִּיכֶם
  choice: da boca de vocês
  rationale: Mantém a imagem concreta e enfática do hebraico, em vez de suavizá-la para 'lábios'.
