  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/גֶּ֣פֶן הוֹבִ֔ישָׁה וְ/הַ/תְּאֵנָ֖ה אֻמְלָ֑לָה רִמּ֞וֹן גַּם תָּמָ֣ר וְ/תַפּ֗וּחַ כָּל עֲצֵ֤י הַ/שָּׂדֶה֙ יָבֵ֔שׁוּ כִּֽי הֹבִ֥ישׁ שָׂשׂ֖וֹן מִן בְּנֵ֥י אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/012.yaml
  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
translation:
  language: pt
  text: A videira secou, e a figueira murchou; a romãzeira, bem como a palmeira e a macieira[a] — todas as árvores do campo — secaram. De fato, a alegria secou entre os seres humanos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “damasqueiro”; não se conhece com certeza a espécie indicada pelo termo hebraico tappuach.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os filhos do homem”; também pode ser traduzido por “a humanidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: a videira
  rationale: Designa a planta cultivada que produz uvas; “videira” é a forma portuguesa corrente e adequada à lista de culturas.
- source_word: הוֹבִישָׁה
  choice: secou
  rationale: No contexto agrícola, descreve o ressecamento físico da videira, não vergonha; a forma verbal concluída é expressa naturalmente pelo pretérito perfeito.
- source_word: וְהַתְּאֵנָה אֻמְלָלָה
  choice: e a figueira murchou
  rationale: “Murchou” comunica o estado enfraquecido e definhado da planta, mantendo alguma distinção em relação a “secou”.
- source_word: רִמּוֹן
  choice: a romãzeira
  rationale: Em português, o nome da árvore evita que “romã” seja entendido apenas como o fruto e se ajusta à enumeração de árvores.
- source_word: גַּם
  choice: também
  rationale: Preserva a força aditiva do termo hebraico dentro da enumeração sem introduzir ênfase excessiva.
- source_word: תָּמָר
  choice: a palmeira
  rationale: Provavelmente se trata da tamareira, mas “palmeira” preserva a designação mais ampla e tradicional sem especificar além do necessário.
- source_word: תַפּוּחַ
  choice: a macieira
  rationale: É a identificação tradicional e mais reconhecível, embora a espécie exata seja incerta; essa incerteza é registrada em nota.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: todas as árvores do campo
  rationale: Reproduz a expressão abrangente e conserva a imagem agrícola do hebraico.
- source_word: יָבֵשׁוּ
  choice: secaram
  rationale: Descreve o estado das árvores e repete a raiz semântica já usada para a videira, reforçando a devastação cumulativa.
- source_word: כִּי
  choice: De fato
  rationale: Lê a partícula como uma transição enfática e explicativa; “pois” também seria possível, mas imporia uma relação causal mais explícita.
- source_word: הֹבִישׁ שָׂשׂוֹן
  choice: a alegria secou
  rationale: Mantém deliberadamente a metáfora agrícola aplicada à experiência humana e a ligação verbal com a videira e as demais árvores.
- source_word: מִן בְּנֵי אָדָם
  choice: entre os seres humanos
  rationale: A preposição indica que a alegria desapareceu do meio humano; “seres humanos” comunica naturalmente o sentido coletivo da expressão hebraica.
theological_decisions:
- issue: Sentido genérico de בְּנֵי אָדָם
  choice: os seres humanos
  alternative: os filhos do homem / a humanidade
  rationale: A expressão hebraica designa coletivamente os humanos, não apenas pessoas do sexo masculino. A tradução principal comunica esse valor genérico em português atual, enquanto a forma literal é preservada em nota.
- issue: Relação introduzida por כִּי
  choice: De fato
  alternative: pois / porque
  rationale: A partícula pode ser enfática ou explicativa neste contexto. “De fato” preserva a continuidade retórica sem resolver a possível relação como causal de maneira indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “secou/secaram” foi mantida para conservar a imagem poética que liga a devastação das plantas ao desaparecimento da alegria. Os marcadores foram posicionados junto aos termos a que suas notas efetivamente se referem.
