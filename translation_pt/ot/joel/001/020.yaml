  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: גַּם בַּהֲמ֥וֹת שָׂדֶ֖ה תַּעֲר֣וֹג אֵלֶ֑י/ךָ כִּ֤י יָֽבְשׁוּ֙ אֲפִ֣יקֵי מָ֔יִם וְ/אֵ֕שׁ אָכְלָ֖ה נְא֥וֹת הַ/מִּדְבָּֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/020.yaml
  text: Even the beasts of the field pant for you[a], because the channels of water have dried up[c][b], and fire has consumed the pastures of the wilderness.
translation:
  language: pt
  text: Até os animais do campo anseiam por ti[a], pois os cursos de água secaram, e o fogo consumiu as pastagens do deserto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arfam em direção a ti”. O verbo hebraico pode descrever o arfar provocado pela sede e também expressar anseio intenso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Até
  rationale: 'A partícula inicial tem força enfática: a calamidade atinge até mesmo os animais.'
- source_word: בַּהֲמוֹת שָׂדֶה
  choice: os animais do campo
  rationale: Expressão ampla e natural em português, sem limitar o sentido a animais domésticos.
- source_word: תַּעֲרֹג אֵלֶיךָ
  choice: anseiam por ti
  rationale: O verbo pode expressar o arfar causado pela sede e, por extensão, um anseio intenso; esta formulação mantém o movimento de dependência dirigido a Deus sem soar artificial em português.
- source_word: יָבְשׁוּ אֲפִיקֵי מָיִם
  choice: os cursos de água secaram
  rationale: אֲפִיקִים designa leitos, canais ou cursos por onde corre a água; 'cursos de água' é claro e suficientemente abrangente.
- source_word: וְאֵשׁ אָכְלָה
  choice: e o fogo consumiu
  rationale: Traduz naturalmente a imagem hebraica de o fogo 'comer' a vegetação, preservando sua força destrutiva.
- source_word: נְאוֹת הַמִּדְבָּר
  choice: as pastagens do deserto
  rationale: נְאוֹת indica lugares de pasto, enquanto מִדְבָּר aqui se refere à região árida ou não cultivada; a expressão conserva o contraste de pastagens destruídas no deserto.
theological_decisions:
- issue: Referente do sufixo de segunda pessoa em אֵלֶיךָ
  choice: Deus, expresso por “por ti”
  alternative: Um anseio impessoal, sem referência teológica explícita
  rationale: O hebraico traz uma referência masculina singular direta, e o contexto imediato de oração identifica de modo natural o destinatário como Deus. A tradução preserva essa direção pessoal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Anseiam por ti” evita a construção pouco natural “arfam por ti”, enquanto a nota preserva a imagem física e a força direcional do hebraico.
