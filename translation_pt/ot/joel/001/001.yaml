  text: דְּבַר יְהוָה֙ אֲשֶׁ֣ר הָיָ֔ה אֶל יוֹאֵ֖ל בֶּן פְּתוּאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/001.yaml
  text: The word of Yahweh that came to Joel son of Pethuel[a][b].
translation:
  language: pt
  text: A palavra de Yahweh que veio a Joel, filho de Petuel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A mensagem de Yahweh que veio a Joel, filho de Petuel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר
  choice: palavra
  rationale: O substantivo em estado construto com יְהוָה forma a fórmula profética tradicional “palavra de Yahweh”. “Palavra” preserva o vínculo formal e o uso bíblico, enquanto “mensagem” explicita mais a função comunicativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: que veio a
  rationale: Expressão idiomática comum para a recepção de revelação profética; esta formulação é natural em português e mantém a imagem do texto hebraico.
- source_word: יוֹאֵל
  choice: Joel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בֶּן
  choice: filho de
  rationale: Reproduz naturalmente o marcador genealógico hebraico, sem acrescentar artigo definido.
- source_word: פְּתוּאֵל
  choice: Petuel
  rationale: Transliteração portuguesa corrente do nome próprio hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O hebraico traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo silenciosamente pelo título tradicional, embora “SENHOR” seja a leitura litúrgica histórica e “Javé” seja também corrente em português.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima da fórmula profética hebraica. Mantém-se “Yahweh” conforme a evidência textual e registra-se em nota a tradição de verter o nome como “o SENHOR”.
