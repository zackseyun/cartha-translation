base_translation:
  language: en
  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
translation:
  language: pt
  text: As sementes ressecaram sob seus torrões[a]; os depósitos estão desolados, os celeiros foram derrubados, porque o cereal secou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os termos hebraicos traduzidos como “sementes” e “torrões” são raros e incertos. Também podem ser entendidos como “grãos” e “sulcos”; para o segundo termo, há ainda quem proponha “enxadas” ou “pás”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְשׁוּ
  choice: murcharam
  rationale: Expressa o ressecamento e definhamento das sementes de modo natural no contexto agrícola.
- source_word: פְרֻדוֹת
  choice: sementes
  rationale: O substantivo é raro e incerto; no contexto, provavelmente se refere a sementes ou grãos lançados à terra.
- source_word: תַּחַת מֶגְרְפֹתֵיהֶם
  choice: debaixo dos torrões
  rationale: A expressão contém um termo raro e discutido. 'Torrões' produz uma imagem agrícola coerente de sementes cobertas pela terra, embora 'sulcos' e nomes de ferramentas também sejam propostos.
- source_word: נָשַׁמּוּ אֹצָרוֹת
  choice: os depósitos estão desolados
  rationale: No cenário agrário, אֹצָרוֹת designa locais de armazenamento; נָשַׁמּוּ comunica sua condição devastada e abandonada.
- source_word: נֶהֶרְסוּ מַמְּגֻרוֹת
  choice: os celeiros foram derrubados
  rationale: מַמְּגֻרוֹת são estruturas destinadas a guardar cereal, e נֶהֶרְסוּ indica demolição ou destruição.
- source_word: כִּי הֹבִישׁ דָּגָן
  choice: porque o cereal secou
  rationale: כִּי introduz a causa; הֹבִישׁ descreve o fracasso da produção por ressecamento, e 'cereal' preserva o sentido coletivo de דָּגָן sem sugerir especificamente milho.
