base_translation:
  language: en
  yaml_path: translation/ot/joel/001/004.yaml
  text: What the cutting locust left[a], the swarming locust ate; and what the swarming locust left, the hopping locust ate; and what the hopping locust left, the devouring locust ate.
translation:
  language: pt
  text: O que o gafanhoto cortador deixou[a], o gafanhoto migrador comeu; e o que o gafanhoto migrador deixou, o gafanhoto saltador comeu; e o que o gafanhoto saltador deixou, o gafanhoto devorador comeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os quatro termos hebraicos provavelmente se referem a espécies ou fases de gafanhotos, mas suas distinções zoológicas exatas são incertas. Outras traduções possíveis incluem gafanhotos «roedores», «migradores», «saltadores» e «devoradores».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר
  choice: o que ... deixou
  rationale: O substantivo indica o restante ou aquilo que sobra. Nesta construção repetida, «o que ... deixou» expressa naturalmente a sucessão de remanescentes consumidos.
- source_word: גָּזָם
  choice: gafanhoto cortador
  rationale: Designa uma espécie ou forma de gafanhoto/inseto devorador, possivelmente caracterizada por cortar a vegetação. A escolha preserva a imagem sem alegar identificação zoológica exata.
- source_word: אָכַל
  choice: comeu
  rationale: O qatal apresenta ações concluídas numa sequência vívida. «Comeu» conserva a repetição simples e enfática do hebraico.
- source_word: אַרְבֶּה
  choice: gafanhoto migrador
  rationale: É o termo comum para gafanhoto e pode evocar sua movimentação em enxames. «Migrador» distingue este termo dos outros sem sobrecarregar a frase com a repetição de «enxame».
- source_word: יָּלֶק / יֶּלֶק
  choice: gafanhoto saltador
  rationale: Refere-se a outra espécie ou fase do gafanhoto, mas a distinção biológica exata é incerta. «Saltador» oferece uma diferenciação concreta e legível sem reivindicar precisão zoológica; a variação gráfica no versículo não altera o sentido.
- source_word: חָסִיל
  choice: gafanhoto devorador
  rationale: O termo designa um inseto consumidor ou devastador. «Devorador» preserva sua força destrutiva e o avanço da devastação.
- source_word: וְ
  choice: e
  rationale: A conjunção repetida liga as orações numa sequência cumulativa. Em português, sua expressão antes da última oração preserva o efeito de acumulação sem tornar a construção artificial.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com cadência repetitiva próxima à do hebraico. «Gafanhoto migrador» tem ampla inteligibilidade e evita a formulação menos natural «gafanhoto de enxame». A nota preserva a incerteza quanto à identificação dos quatro termos.
