id: JOL.1.2
reference: Joel 1:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִׁמְעוּ זֹאת֙ הַ/זְּקֵנִ֔ים וְ/הַֽאֲזִ֔ינוּ כֹּ֖ל יוֹשְׁבֵ֣י הָ/אָ֑רֶץ הֶ/הָ֤יְתָה זֹּאת֙ בִּֽ/ימֵי/כֶ֔ם וְ/אִ֖ם בִּ/ימֵ֥י אֲבֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/002.yaml
  text: 'Hear this[a], you elders, and give ear, all inhabitants of the land: Has this happened in your days[b], or in the days of your fathers?'
translation:
  language: pt
  text: 'Ouçam isto, ó anciãos, e prestem atenção, todos os habitantes da terra[a]: Isto já aconteceu nos seus dias ou nos dias dos seus pais[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os habitantes da Terra”. A palavra hebraica pode significar tanto uma terra ou região quanto a Terra em sentido amplo; aqui, a referência local parece se ajustar melhor ao contexto imediato.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nos dias dos seus antepassados”. Hebraico: “dos seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: Ouçam isto
  rationale: Mantém o imperativo plural e o demonstrativo como objeto direto, em formulação portuguesa clara e enfática.
- source_word: הַזְּקֵנִים
  choice: ó anciãos
  rationale: O vocativo explicita a interpelação direta. “Anciãos” pode abranger tanto homens de idade avançada quanto líderes reconhecidos da comunidade, sem decidir além do contexto.
- source_word: וְהַאֲזִינוּ
  choice: e prestem atenção
  rationale: Distingue este segundo imperativo de שׁמע e comunica seu apelo intensificado de escuta atenta, sem recorrer ao menos corrente “dai ouvidos”.
- source_word: כֹּל יוֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: Reproduz a expressão coletiva e preserva a amplitude lexical de אֶרֶץ. No contexto imediato, “terra” provavelmente designa a terra habitada pelo povo a quem Joel se dirige; a possível leitura global é registrada em nota.
- source_word: הֶהָיְתָה זֹּאת
  choice: Isto já aconteceu
  rationale: Expressa em português natural a pergunta sobre a ocorrência anterior de um acontecimento semelhante, conservando o demonstrativo זֹאת.
- source_word: בִּימֵיכֶם
  choice: nos seus dias
  rationale: Preserva o idioma temporal hebraico e permanece compreensível em português moderno.
- source_word: וְאִם
  choice: ou
  rationale: No paralelismo interrogativo, introduz a segunda alternativa, não uma condição independente.
- source_word: בִּימֵי אֲבֹתֵיכֶם
  choice: nos dias dos seus pais
  rationale: Mantém de perto a expressão hebraica e a comparação entre gerações; “antepassados” é uma alternativa contextual válida.
theological_decisions:
- issue: Alcance de הָאָרֶץ
  choice: a terra
  alternative: a Terra
  rationale: אֶרֶץ pode designar uma região ou país, ou a terra em sentido amplo. A situação profética imediata favorece a referência local à terra do povo interpelado, mas a possível ressonância universal não deve ser eliminada.
- issue: Sentido de אֲבֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução principal conserva a forma masculina plural e o modo hebraico de nomear as gerações anteriores. A alternativa esclarece o sentido genealógico mais amplo sem substituir silenciosamente a expressão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Prestem atenção” evita o arcaísmo de “dai ouvidos”, enquanto “ó anciãos” conserva a força retórica do vocativo profético. A repetição de “dias” preserva o paralelismo geracional do hebraico.
