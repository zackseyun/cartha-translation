source:
  edition: WLC
  text: כִּֽי גוֹי֙ עָלָ֣ה עַל אַרְצִ֔/י עָצ֖וּם וְ/אֵ֣ין מִסְפָּ֑ר שִׁנָּי/ו֙ שִׁנֵּ֣י אַרְיֵ֔ה וּֽ/מְתַלְּע֥וֹת לָבִ֖יא לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/006.yaml
  text: For a nation has come up against my land[a], mighty and without number; its teeth are the teeth of a lion[b], and it has the fangs of a lioness.
translation:
  language: pt
  text: Pois uma nação subiu contra a minha terra[a], poderosa e sem número; os seus dentes são dentes de leão, e ela tem presas de leão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um povo”. O termo hebraico significa literalmente “nação” ou “povo” e aqui descreve metaforicamente a praga invasora.
    reason: lexical_alternative
  - marker: b
    text: Ou “de uma leoa”. O termo hebraico pode designar um leão vigoroso ou maduro e, em algumas traduções neste versículo, uma leoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação para o chamado ao lamento no contexto, preservando a força causal ou explicativa.
- source_word: גוֹי
  choice: uma nação
  rationale: Mantém a metáfora hebraica que retrata a praga invasora como um povo organizado e hostil, sem substituí-la explicitamente por 'enxame'.
- source_word: עָלָה עַל
  choice: subiu contra
  rationale: Conserva a imagem direcional e hostil da expressão hebraica; em português profético é compreensível sem tornar a tradução tão interpretativa quanto 'invadiu'.
- source_word: אַרְצִי
  choice: a minha terra
  rationale: Reproduz o sufixo de primeira pessoa e preserva a linguagem territorial do texto.
- source_word: עָצוּם
  choice: poderosa
  rationale: Comunica a força formidável da nação invasora e concorda naturalmente com 'nação'.
- source_word: וְאֵין מִסְפָּר
  choice: e incontável
  rationale: Expressa de modo claro e atual a ideia idiomática de uma multidão para a qual não há número.
- source_word: שִׁנָּיו שִׁנֵּי אַרְיֵה
  choice: seus dentes são dentes de leão
  rationale: Preserva a repetição enfática de 'dentes' e a comparação predatória.
- source_word: מְתַלְּעוֹת
  choice: presas
  rationale: Transmite em português corrente os dentes ou partes da mandíbula usados para rasgar, mantendo a imagem predatória.
- source_word: לָבִיא
  choice: leão forte
  rationale: O termo pode designar um leão vigoroso ou maduro, sem determinar inequivocamente o sexo; esta opção evita resolver a ambiguidade como 'leoa'.
- source_word: לוֹ
  choice: ela tem
  rationale: Verte naturalmente a construção hebraica de posse e retoma 'nação' com concordância feminina em português.
theological_decisions:
- issue: Identificação metafórica da 'nação' invasora
  choice: Manter 'nação' no texto principal
  alternative: Explicitar 'enxame', 'nação de gafanhotos' ou 'praga de gafanhotos'
  rationale: O hebraico diz גוי, e a metáfora militar deve permanecer aberta no versículo, sem substituir a imagem profética por sua identificação contextual.
- issue: Identidade sexual de לָבִיא
  choice: Traduzir como 'leão forte' e registrar a alternativa em nota
  alternative: Traduzir como 'leoa'
  rationale: O substantivo pode referir-se a um leão vigoroso ou maduro e, em certos contextos, ser entendido como leoa. A tradução principal preserva melhor a indeterminação lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético, a metáfora militar e a ambiguidade zoológica do hebraico.
