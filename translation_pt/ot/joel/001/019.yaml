  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אֵלֶ֥י/ךָ יְהוָ֖ה אֶקְרָ֑א כִּ֣י אֵ֗שׁ אָֽכְלָה֙ נְא֣וֹת מִדְבָּ֔ר וְ/לֶ֣הָבָ֔ה לִהֲטָ֖ה כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/019.yaml
  text: To you[a], O Yahweh, I call, for fire has devoured the pastures of the wilderness[c][b], and flame has scorched all the trees of the field.
translation:
  language: pt
  text: A ti, Yahweh[a], clamo, pois o fogo devorou as pastagens do deserto, e a chama abrasou todas as árvores do campo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: A ti
  rationale: A preposição direcional אֶל com sufixo de segunda pessoa masculina singular introduz aquele a quem o profeta dirige seu clamor. “A ti” é natural e preserva a ênfase inicial do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶקְרָא
  choice: clamo
  rationale: O imperfeito qal de קרא, neste contexto de súplica, expressa um clamor dirigido a Deus. “Clamo” transmite melhor a intensidade da lamentação do que o mais neutro “chamo”.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do clamor e mantém uma ligação causal clara em registro poético e corrente.
- source_word: אֵשׁ אָכְלָה
  choice: o fogo devorou
  rationale: Preserva a metáfora vívida do verbo אכל, que descreve o fogo como agente que devora. O perfeito hebraico apresenta a devastação como fato consumado.
- source_word: נְאוֹת מִדְבָּר
  choice: as pastagens do deserto
  rationale: נְאוֹת designa lugares de pastoreio ou pastagens; מִדְבָּר indica a região desértica ou estepe não cultivada. A expressão é clara no contexto rural de Joel.
- source_word: וְלֶהָבָה
  choice: e a chama
  rationale: Mantém o paralelismo poético com “o fogo” na oração anterior.
- source_word: לִהֲטָה
  choice: abrasou
  rationale: O verbo להט comunica calor flamejante que queima intensamente. “Abrasou” preserva essa força e evita repetir “devorou”.
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: todas as árvores do campo
  rationale: Tradução direta e idiomática da expressão hebraica, que se refere às árvores da terra aberta ou cultivada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o nome divino. A transliteração “Yahweh” preserva o nome próprio, enquanto a forma tradicional “SENHOR” é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência poética. A ordem inicial “A ti” conserva a ênfase do hebraico; “clamo”, “devorou” e “abrasou” mantêm a intensidade da lamentação sem linguagem excessivamente arcaica.
