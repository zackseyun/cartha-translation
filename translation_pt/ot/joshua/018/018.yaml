base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/018.yaml
  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: pt
  text: Então a divisa passava até o flanco[a] defronte da Arabá, ao norte, e descia à Arabá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ombro”; metáfora topográfica para um lado, flanco ou encosta.'
    reason: cultural_note
  - marker: b
    text: Ou “planície”. O termo hebraico pode designar tanto a região chamada Arabá como, em certos contextos, uma planície ou estepe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Então a divisa seguia
  rationale: Em descrições de limites, o verbo indica a continuação do traçado. Explicitar “a divisa”, subentendida pelo contexto, produz português natural sem alterar o referente.
- source_word: אֶל כֶּתֶף
  choice: até o flanco
  rationale: כֶּתֶף significa literalmente “ombro”, mas, em topografia, designa o lado, flanco ou encosta de uma formação. “Flanco” preserva a metáfora corporal e é claro em contexto geográfico.
- source_word: מוּל הָעֲרָבָה
  choice: que fica diante da Arabá
  rationale: מוּל expressa posição em frente ou defronte. “Diante de” conserva a relação espacial sem impor uma identificação topográfica mais específica.
- source_word: צָפוֹנָה
  choice: ao norte
  rationale: Aqui a forma direcional indica a localização ou orientação setentrional do flanco, não necessariamente movimento para o norte.
- source_word: וְיָרַד
  choice: e descia
  rationale: O verbo descreve a descida do traçado pelo relevo; “descia” é corrente e mantém a sequência narrativa da delimitação.
- source_word: הָעֲרָבָתָה
  choice: até a Arabá
  rationale: O ה direcional marca movimento em direção à Arabá. “Até” é adequado à descrição do avanço da divisa e não força a ideia de entrada na região.
