base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: pt
  text: 'Então os homens se levantaram e partiram. Josué ordenou aos que iam registrar por escrito a terra[a]: “Vão, percorram a terra, registrem-na por escrito e voltem a mim. Aqui lançarei a sorte por vocês diante de Yahweh, em Siló.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “escrever a terra”; isto é, fazer um registro ou uma descrição escrita da terra para sua distribuição.
    reason: Esclarece a expressão hebraica incomum sem eliminar seu sentido literal do horizonte do leitor.
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: os homens se levantaram e partiram
  rationale: Preserva a sequência narrativa e a referência masculina específica, usando uma formulação natural em português.
- source_word: וַיְצַו
  choice: ordenou
  rationale: Expressa a diretiva dada com autoridade por Josué.
- source_word: לִכְתֹּב אֶת־הָאָרֶץ
  choice: registrar por escrito a terra
  rationale: Comunica o sentido contextual de produzir um levantamento escrito sem apagar a construção hebraica incomum, literalmente ‘escrever a terra’.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: percorram a terra
  rationale: O hitpael de הלך indica deslocar-se pela região; ‘percorrer’ é idiomático e adequado à missão de levantamento.
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: registrem-na por escrito
  rationale: Retoma ‘a terra’ e mantém explícita a ideia de produzir um registro escrito.
- source_word: וְשׁוּבוּ אֵלַי
  choice: voltem a mim
  rationale: Tradução direta e natural do chamado para retornar a Josué.
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: lançarei a sorte por vocês
  rationale: Mantém o substantivo hebraico no singular e reproduz a prática de decidir a distribuição territorial por sorteio.
- source_word: בְּשִׁלֹה
  choice: em Siló
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do topônimo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Representa diretamente o nome divino presente no texto hebraico, sem substituí-lo por um título.
- issue: Referência de הָאֲנָשִׁים
  choice: os homens
  alternative: as pessoas
  rationale: O contexto trata dos representantes masculinos enviados para levantar a terra; a tradução preserva essa referência específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário compreensível internacionalmente. A fala direta conserva o tom imperativo, enquanto ‘registrar por escrito’ torna inteligível a tarefa sem convertê-la anacronicamente em cartografia técnica.
