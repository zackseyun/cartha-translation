revisions:
- from: E o Jordão formava o seu limite no lado leste.[a] Essa era a herança dos filhos de Benjamim, segundo os limites dela ao redor, conforme os seus clãs.[b]
  to: E o Jordão lhe servia de limite a leste.[a] Esta foi a herança dos filhos de Benjamim[b], conforme os seus limites ao redor, segundo os seus clãs.
  rationale: A revisão substitui uma expressão menos idiomática por «lhe servia de limite», conserva a orientação oriental com «a leste», melhora a fluência da síntese sobre os limites e reposiciona a nota lexical junto à expressão que ela explica. Não altera o sentido territorial, tribal ou jurídico do texto hebraico.
