base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: pt
  text: E o Jordão lhe servia de limite a leste.[a] Esta foi a herança dos filhos de Benjamim[b], conforme os seus limites ao redor, segundo os seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “delimitava o território” ou “era o seu limite”. O verbo hebraico indica que o Jordão servia de fronteira territorial.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “filhos de Benjamim”, designação tribal para os descendentes de Benjamim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: E o Jordão
  rationale: Mantém o nome próprio usual do rio sem acrescentar “rio”, que está implícito e é desnecessário em português.
- source_word: יִגְבֹּל אֹתוֹ
  choice: formava o seu limite
  rationale: Neste contexto territorial, גבל indica que o Jordão servia de fronteira; a formulação é natural e preserva a referência ao território de Benjamim.
- source_word: לִפְאַת קֵדְמָה
  choice: no lado leste
  rationale: Expressa com clareza a orientação geográfica da borda oriental.
- source_word: זֹאת
  choice: Essa era
  rationale: A oração hebraica não traz cópula; o pretérito é fornecido naturalmente pelo contexto narrativo.
- source_word: נַחֲלַת
  choice: a herança
  rationale: Preserva o sentido do território recebido por lote, bem como a nuance jurídica e pactual do termo em Josué.
- source_word: בְּנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Reproduz literalmente a designação tribal hebraica, entendida como os descendentes de Benjamim.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: segundo os limites dela ao redor
  rationale: Mantém a referência do sufixo feminino à herança e resume as linhas que cercavam o território.
- source_word: לְמִשְׁפְּחֹתָם
  choice: conforme os seus clãs
  rationale: מִשְׁפָחוֹת designa os agrupamentos familiares internos da tribo; “clãs” é preciso e conciso.
