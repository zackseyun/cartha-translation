base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: pt
  text: O lado sul começava na extremidade de Quiriate-Jearim. Dali, a fronteira seguia para o oeste[a] e chegava à nascente das águas de Neftoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “em direção ao mar”; neste contexto geográfico, significa “para o oeste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: O lado sul
  rationale: פֵאָה designa lado ou extremidade; com נֶגְבָּה, a expressão identifica naturalmente o lado sul da divisa.
- source_word: מִקְצֵה
  choice: começava na extremidade de
  rationale: A preposição מִן indica o ponto de partida, e קָצֶה significa extremidade ou limite. O verbo 'começava' é explicitado em português para tornar natural a frase nominal hebraica.
- source_word: קִרְיַת יְעָרִים
  choice: Quiriate-Jearim
  rationale: Transliteração corrente e legível em português do topônimo hebraico.
- source_word: וְיָצָא הַגְּבוּל
  choice: Dali, a fronteira seguia
  rationale: Na fórmula de delimitação territorial, יָצָא descreve o avanço ou prolongamento da linha de fronteira. 'Seguia' transmite esse sentido em português natural.
- source_word: יָמָּה
  choice: para o oeste
  rationale: Literalmente aponta 'para o mar', mas, na geografia de Israel, funciona como indicação do oeste; a nota preserva a imagem lexical.
- source_word: וְיָצָא אֶל
  choice: e chegava a
  rationale: A repetição de יָצָא marca o percurso até o ponto seguinte. 'Chegava a' expressa com clareza o resultado direcional sem repetir de modo artificial 'saía'.
- source_word: מַעְיַן מֵי
  choice: à nascente das águas de
  rationale: Mantém a construção genitiva explícita do hebraico, embora 'nascente de' fosse uma simplificação possível.
- source_word: נֶפְתּוֹחַ
  choice: Neftoa
  rationale: Transliteração portuguesa clara do topônimo hebraico.
