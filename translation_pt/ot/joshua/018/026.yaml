  text: and Hamizpeh[a], Hakkephirah, and Hammozah.
translation:
  language: pt
  text: Hamispá[a], Haquefira e Hamosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a Mispá, a Quefira e a Mosa”, se o prefixo hebraico for entendido como artigo definido, e não como parte dos topônimos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada coordena os nomes desta lista de cidades. Em português, ela é expressa naturalmente apenas antes do último item.
- source_word: הַמִּצְפֶּה
  choice: Hamispá
  rationale: Nome de lugar transliterado, sem traduzir seu possível sentido comum de “torre de vigia”. O prefixo hebraico הַ־ foi preservado como parte do topônimo, conforme a leitura adotada no texto principal.
- source_word: הַכְּפִירָה
  choice: Quefira
  rationale: Topônimo transliterado segundo a forma portuguesa já amplamente reconhecível. Diferentemente da camada inglesa, o artigo prefixado não foi incorporado ao nome no texto principal, pois a tradição toponímica e o uso português favorecem “Quefira”; a ambiguidade morfológica é registrada em nota.
- source_word: הַמֹּצָה
  choice: Mosa
  rationale: Topônimo transliterado em forma natural para leitores de português. O artigo prefixado não foi incorporado ao nome no texto principal; a alternativa é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. Os topônimos foram apresentados em formas legíveis e naturais em português, preservando em nota a incerteza sobre a função do artigo hebraico prefixado. O marcador [a] aparece no texto principal.
