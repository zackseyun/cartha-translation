  text: וַ/יִּוָּֽתְרוּ֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר לֹֽא חָלְק֖וּ אֶת נַֽחֲלָתָ֑/ם שִׁבְעָ֖ה שְׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/002.yaml
  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: pt
  text: Mas, entre os filhos de Israel, restavam sete tribos que ainda não tinham repartido a sua herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cuja herança ainda não tinha sido repartida” ou “que ainda não tinham recebido a sua herança como porção”. O verbo hebraico pode referir-se à repartição da herança ou, no contexto, ao fato de essas tribos ainda não terem recebido a porção que lhes cabia.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: restavam
  rationale: O nifal de יתר expressa o que permanecia ou ainda faltava; “restavam” é natural em português e preserva esse sentido.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém de modo claro e digno a expressão familiar hebraica, embora “entre os israelitas” também seja possível.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: que ainda não tinham recebido por sorteio
  rationale: Embora חלק signifique literalmente “dividir” ou “repartir”, neste contexto o sujeito gramatical são as sete tribos; a formulação comunica naturalmente que sua porção territorial ainda não lhes fora atribuída, sem sugerir que elas próprias necessariamente conduziam a divisão.
- source_word: אֶת נַחֲלָתָם
  choice: a sua herança
  rationale: נחלה designa aqui a porção territorial herdada; “herança” preserva o termo bíblico habitual e sua ressonância teológica.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: sete tribos
  rationale: Equivalência direta e natural para a estrutura tribal de Israel.
theological_decisions:
- issue: Agência na repartição da herança
  choice: recebido por sorteio a sua herança
  alternative: repartido a sua herança
  rationale: O hebraico admite tensão entre a forma ativa do verbo e o sentido contextual de as tribos ainda não terem recebido sua porção. A tradução principal prioriza a situação resultante; a nota preserva a leitura mais formal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Filhos de Israel” preserva a imagem familiar do hebraico; “recebido por sorteio” torna explícito o contexto de distribuição territorial, enquanto a nota conserva a ambiguidade de agência presente no texto-fonte.
