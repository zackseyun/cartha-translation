base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: pt
  text: A sorte da tribo dos filhos de Benjamim saiu, segundo os seus clãs, e o território que lhes coube por sorte[a] ficou entre os filhos de Judá e os filhos de José.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o limite da porção que lhes coube por sorte”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “os filhos de José” designa coletivamente as tribos descendentes de José, especialmente Efraim e Manassés.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל גּוֹרַל
  choice: a sorte ... saiu
  rationale: No contexto de sorteio, “saiu” é a forma portuguesa natural de expressar que determinada sorte foi tirada, conservando a imagem concreta do hebraico sem recorrer ao pouco idiomático “subiu”.
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: a tribo dos filhos de Benjamim
  rationale: “Tribo” comunica o sentido contextual de מַטֵּה, enquanto “filhos de Benjamim” preserva a expressão de descendência do texto hebraico.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: “Clãs” designa adequadamente os agrupamentos familiares internos da tribo; “segundo” expressa a distribuição correspondente a esses grupos.
- source_word: גְּבוּל גּוֹרָלָם
  choice: o território que lhes coube por sorte
  rationale: Neste contexto de repartição da terra, גְּבוּל pode designar metonimicamente a área delimitada. A formulação portuguesa explicita de modo natural a ligação entre o território e o sorteio, sem confundir a sorte lançada com a terra recebida.
- source_word: וַיֵּצֵא ... בֵּין ... וּבֵין
  choice: ficou entre ... e ...
  rationale: A expressão comunica em português corrente o resultado geográfico produzido pelo sorteio. Uma reprodução literal como “saiu entre” seria ambígua e pouco natural.
- source_word: בְנֵי יְהוּדָה ... בְנֵי יוֹסֵף
  choice: os filhos de Judá ... os filhos de José
  rationale: Mantém de forma coerente as expressões hebraicas de descendência e permite que a nota esclareça o uso coletivo de “filhos de José”.
