  text: וַ/יֵּלְכ֤וּ הָֽ/אֲנָשִׁים֙ וַ/יַּעַבְר֣וּ בָ/אָ֔רֶץ וַ/יִּכְתְּב֧וּ/הָ לֶֽ/עָרִ֛ים לְ/שִׁבְעָ֥ה חֲלָקִ֖ים עַל סֵ֑פֶר וַ/יָּבֹ֧אוּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה שִׁלֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: pt
  text: Então os homens partiram, percorreram a terra e a registraram por escrito, cidade por cidade[a], em sete partes, num documento[b]. Depois foram até Josué, no acampamento em Siló.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo as cidades”; a expressão indica provavelmente que o levantamento foi organizado com base nas cidades.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “sobre um sêfer”, isto é, num registro escrito, provavelmente um rolo.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: partiram
  rationale: No início desta sequência narrativa, הלך indica que os homens se puseram a caminho; “partiram” é natural em português e não acrescenta um destino não expresso.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Retoma especificamente os representantes do sexo masculino mencionados no contexto anterior, preservando a referência definida do hebraico.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: percorreram a terra
  rationale: עבר com ב, neste contexto de levantamento territorial, descreve o ato de atravessar e percorrer a região; a formulação é fiel e idiomática.
- source_word: וַיִּכְתְּבוּהָ
  choice: a registraram por escrito
  rationale: O sufixo feminino singular retoma “a terra”. A expressão comunica claramente que as informações sobre ela foram postas por escrito, sem sugerir que a própria terra fosse literalmente escrita.
- source_word: לֶעָרִים
  choice: cidade por cidade
  rationale: O ל indica provavelmente o critério de organização do levantamento. “Cidade por cidade” expressa de modo natural que o registro foi estruturado segundo as cidades.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: em sete partes
  rationale: חֲלָקִים designa divisões ou porções. “Em sete partes” preserva a ideia concreta sem antecipar de modo indevido a linguagem técnica de lotes tribais.
- source_word: עַל סֵפֶר
  choice: num documento
  rationale: סֵפֶר pode designar livro, rolo ou documento escrito. “Documento” comunica a função do registro sem impor ao leitor moderno o formato de um livro encadernado.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: foram até Josué
  rationale: O hebraico diz literalmente que vieram a Josué. Em português narrativo, “foram até” mantém o movimento em direção a ele sem explicitar “voltaram”, embora o retorno seja inferível do contexto.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: no acampamento em Siló
  rationale: A expressão identifica onde Josué estava. Esta construção evita repetir a preposição de destino e soa natural em português.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A tradução mantém a sequência de ações do hebraico, esclarece apenas o necessário para evitar uma construção pouco natural e conserva em nota as nuances do método de organização e do suporte escrito.
