  text: וְ/הָי֣וּ הֶֽ/עָרִ֗ים לְ/מַטֵּ֛ה בְּנֵ֥י בִנְיָמִ֖ן לְ/מִשְׁפְּחֽוֹתֵי/הֶ֑ם יְרִיח֥וֹ וּ/בֵית חָגְלָ֖ה וְ/עֵ֥מֶק קְצִֽיץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: pt
  text: E as cidades da tribo dos filhos de Benjamim, segundo os seus clãs, eram Jericó, Bete-Hogla e Emec-Queziz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «vale de Queziz», caso o nome seja entendido como uma designação descritiva do lugar, e não como um topônimo integralmente transliterado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: E ... eram
  rationale: A conjunção seguida do verbo היה introduz a lista em continuidade com o contexto; a construção copulativa é natural em português e preserva a função sequencial.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: Tradução direta do substantivo plural definido, referente às cidades da porção tribal.
- source_word: לְמַטֵּה
  choice: da tribo
  rationale: Neste contexto de repartição territorial, a preposição לְ indica pertencimento ou atribuição; «da tribo» expressa isso de modo claro e conciso.
- source_word: בְּנֵי בִנְיָמִן
  choice: dos filhos de Benjamim
  rationale: Preserva a expressão hebraica de parentesco, que permanece compreensível e digna em português.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui subdivisões da tribo, de modo que «clãs» é mais preciso que «famílias»; «segundo» conserva o sentido distributivo.
- source_word: יְרִיחוֹ
  choice: Jericó
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: בֵית חָגְלָה
  choice: Bete-Hogla
  rationale: Transliteração adaptada às convenções e à legibilidade do português para este topônimo composto.
- source_word: עֵמֶק קְצִיץ
  choice: Emec-Queziz
  rationale: O conjunto funciona no contexto como topônimo; por isso, é transliterado, enquanto a possibilidade de entender עֵמֶק descritivamente como «vale» é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas legíveis para o público brasileiro e compreensão internacional. Mantém-se a expressão hebraica «filhos de Benjamim» e usa-se «clãs» no sentido administrativo tribal.
