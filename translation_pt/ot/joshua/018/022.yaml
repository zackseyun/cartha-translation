  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes hebraicos de lugares “Bete-Arabá” e “Betel” poderiam ser traduzidos mais literalmente como “casa da Arabá” e “casa de Deus”, respectivamente; o texto principal preserva as formas tradicionais dos topônimos em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: Bete-Arabá
  rationale: É um topônimo numa lista de cidades. A transliteração preserva o nome próprio e segue uma forma reconhecível em português, em vez de traduzir seus componentes como “casa da Arabá”.
- source_word: צְמָרַיִם
  choice: Zemaraim
  rationale: Nome próprio de lugar transliterado de modo a refletir claramente a forma hebraica, inclusive a terminação -ayim.
- source_word: בֵית אֵל
  choice: Betel
  rationale: Topônimo de uso tradicional e amplamente reconhecido em português; preserva-se como nome próprio, sem traduzi-lo por “casa de Deus”.
- source_word: וּ
  choice: e
  rationale: A conjunção prefixada coordena os nomes da lista; em português, vírgulas e “e” produzem uma enumeração natural.
