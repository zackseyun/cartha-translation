  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: pt
  text: Depois, a divisa fez uma curva para o norte e estendeu-se até En-Semes[a], e estendeu-se até Gelilote[b], que fica diante da subida de Adumim[c]; então desceu até a pedra de Boã, filho de Rúben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Semes significa “Fonte do Sol”, mas o nome do lugar foi transliterado no texto.
    reason: lexical_alternative
  - marker: b
    text: Gelilote também pode ser entendido lexicalmente como “círculos” ou “distritos”, mas aqui é tratado como nome de lugar.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a passagem de Adumim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: a divisa fez uma curva
  rationale: No contexto de demarcação territorial, o verbo descreve o traçado ou a mudança de direção da divisa. A explicitação de “a divisa” torna o referente natural em português.
- source_word: מִצָּפוֹן
  choice: para o norte
  rationale: A sequência de verbos de movimento favorece o sentido direcional, e não o de origem.
- source_word: וְיָצָא
  choice: passou por / seguiu até
  rationale: Na fórmula de limites territoriais, o verbo indica o avanço da linha divisória. A variação idiomática em português conserva a sequência espacial sem reproduzir de modo artificial a mesma expressão.
- source_word: עֵין שֶׁמֶשׁ
  choice: En-Semes
  rationale: O topônimo é transliterado, em vez de traduzido, com forma adequada à leitura em português.
- source_word: גְּלִילוֹת
  choice: Gelilote
  rationale: Embora o termo possa ter sentido lexical comum, aqui funciona como nome de lugar e, por isso, é transliterado.
- source_word: נֹכַח
  choice: diante de
  rationale: Expressa de maneira clara a relação espacial de estar em frente ou defronte de outro ponto.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: a subida de Adumim
  rationale: מַעֲלֵה designa uma subida ou passagem ascendente; “subida” preserva diretamente o elemento topográfico, enquanto Adumim permanece como topônimo.
- source_word: וְיָרַד
  choice: então desceu
  rationale: Indica o movimento descendente da divisa pelo terreno; a formulação é natural e mantém a progressão narrativa.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: a pedra de Boã, filho de Rúben
  rationale: A cadeia construta identifica um marco associado a Boã e o qualifica como filho ou descendente de Rúben. A tradução mantém a formulação transparente, sem resolver a possível amplitude genealógica de בֶּן.
