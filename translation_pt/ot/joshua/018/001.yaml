  source_fidelity: 'O texto traduz com precisão a sequência e os principais valores do hebraico: a reunião de toda a comunidade dos filhos de Israel em Siló, o estabelecimento ali da tenda do encontro e a condição da terra como subjugada diante deles. “Estava subjugada” representa adequadamente o particípio/passivo resultativo נִכְבְּשָׁה sem reforçar indevidamente a ideia de conquista total.'
