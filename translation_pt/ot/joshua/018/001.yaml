id: JOS.18.1
reference: Joshua 18:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: pt
  text: Então toda a comunidade dos filhos de Israel se reuniu em Siló, e ali armaram a tenda do encontro. A terra estava subjugada diante deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A terra havia sido conquistada diante deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: se reuniu
  rationale: O nifal de קהל descreve a comunidade reunindo-se como assembleia. Em português, a concordância no singular com o núcleo coletivo “comunidade” é natural e preserva o caráter corporativo.
- source_word: כָּל עֲדַת
  choice: toda a comunidade
  rationale: עֵדָה designa a comunidade reunida; “toda a comunidade” é claro, atual e reproduz o valor coletivo e a totalidade indicada por כָּל.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém de perto a forma hebraica masculina e a designação pactual tradicional, sem substituí-la silenciosamente por “israelitas”.
- source_word: שִׁלֹה
  choice: Siló
  rationale: Forma consagrada e natural do topônimo em português.
- source_word: וַיַּשְׁכִּינוּ
  choice: armaram
  rationale: O hifil de שכן significa literalmente “fizeram habitar”, mas, tendo uma tenda como objeto, “armaram” comunica de modo idiomático sua instalação no local.
- source_word: אֹהֶל מוֹעֵד
  choice: a tenda do encontro
  rationale: Tradução transparente da expressão hebraica, preservando a imagem da tenda e sua função de encontro sem recorrer ao termo menos diretamente lexical “tabernáculo”.
- source_word: נִכְבְּשָׁה
  choice: estava subjugada
  rationale: O passivo de כבשׁ indica que a terra havia sido posta sob domínio. “Estava subjugada” destaca o estado resultante sem sugerir necessariamente que toda resistência e toda conquista territorial já estivessem concluídas.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Conserva o idioma espacial hebraico, que no contexto expressa a terra sujeita ao domínio de Israel.
theological_decisions:
- issue: Designação coletiva de Israel
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha preserva a forma masculina representativa do hebraico e sua linguagem de identidade coletiva, sem neutralização interpretativa.
- issue: Extensão da conquista indicada por נִכְבְּשָׁה
  choice: a terra estava subjugada diante deles
  alternative: a terra havia sido conquistada por eles
  rationale: “Subjugada” afirma o domínio alcançado, mas evita transformar o versículo numa declaração mais absoluta sobre a conclusão da conquista do que o termo hebraico exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das duas orações foi preservada. Evitou-se “congregação”, possível mas mais marcado pelo uso eclesiástico; “comunidade” representa naturalmente עֵדָה. A nota foi colocada após a oração a que se refere.
