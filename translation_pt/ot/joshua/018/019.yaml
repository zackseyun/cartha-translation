base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: pt
  text: Então a fronteira passou até o lado norte de Bete-Hogla e terminou na língua setentrional[a] do Mar Salgado[b], no extremo sul do Jordão. Esta é a fronteira sul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “língua”; expressão geográfica para uma baía, enseada ou saliência alongada.
    reason: lexical_alternative
  - marker: b
    text: Também conhecido como “mar Morto”; o texto hebraico diz “Mar Salgado”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: Então a fronteira passava
  rationale: Em descrições de limites, עָבַר indica que a linha prosseguia ou passava por determinado ponto. O imperfeito narrativo é expresso naturalmente pelo pretérito imperfeito em português, mantendo a sequência descritiva.
- source_word: כֶּתֶף
  choice: lado
  rationale: O sentido literal é “ombro”, mas, no uso geográfico, designa o lado, flanco ou encosta de um lugar. “Lado” comunica com clareza a referência topográfica sem criar uma imagem pouco natural em português.
- source_word: בֵּית חָגְלָה
  choice: Bete-Hogla
  rationale: O topônimo é transliterado em forma adaptada à fonologia e à tradição gráfica do português.
- source_word: צָפוֹנָה
  choice: norte
  rationale: A forma direcional localiza o lado de Bete-Hogla e a língua do mar em relação ao norte; em português, “lado norte” e “língua norte” preservam essa orientação de modo conciso.
- source_word: תצאותיו הַגְּבוּל
  choice: terminava
  rationale: A expressão de fronteira indica o ponto de saída ou término da linha. “Terminava” é idiomático e adequado ao contexto cartográfico.
- source_word: לְשׁוֹן
  choice: língua
  rationale: Mantém a metáfora geográfica concreta do hebraico para uma formação alongada, provavelmente uma baía ou enseada; a nota esclarece o sentido.
- source_word: יָם הַמֶּלַח
  choice: mar de Sal
  rationale: Traduz diretamente o nome hebraico, em vez de substituí-lo pelo nome moderno convencional “mar Morto”.
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: na extremidade sul do Jordão
  rationale: קָצֶה designa a ponta ou extremidade, e נֶגְבָּה especifica sua posição ao sul.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: Essa era a fronteira sul
  rationale: Neste resumo dos limites, נֶגֶב tem valor direcional (“sul”), não o sentido do nome próprio da região do Neguebe. O pretérito harmoniza a frase conclusiva com a descrição narrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação preserva a imagem hebraica “língua”, esclarecida em nota, e traduz literalmente o nome “mar de Sal”. Os marcadores foram posicionados junto às expressões a que as notas efetivamente se referem.
