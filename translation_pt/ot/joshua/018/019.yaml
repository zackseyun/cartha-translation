revisions:
- from: Então a fronteira passava pelo lado norte de Bete-Hogla e terminava na língua norte[a] do mar de Sal[b], na extremidade sul do Jordão. Essa era a fronteira sul.
  to: Então a fronteira passou até o lado norte de Bete-Hogla e terminou na língua setentrional[a] do Mar Salgado[b], no extremo sul do Jordão. Esta é a fronteira sul.
  rationale: A redação foi ajustada para maior fidelidade à sequência verbal hebraica e para português geográfico natural. «Até» preserva o movimento da fronteira em direção ao lado norte de Bete-Hogla; «língua setentrional» evita a ambiguidade de «língua norte» e mantém a metáfora do original, explicada pela nota. «Mar Salgado» é uma tradução idiomática e literal do nome hebraico. A fórmula conclusiva foi posta no presente, como no hebraico.
