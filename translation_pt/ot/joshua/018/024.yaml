base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/024.yaml
  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: pt
  text: 'E Quefar-Haamoni[a], Ofni e Geba: doze cidades com seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Quefar-Haamoni também pode ser transliterado de outras formas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: Quefar-Haamoni
  rationale: Topônimo transliterado diretamente do hebraico, sem convertê-lo em uma expressão de sentido como “aldeia do amonita”. A grafia com Q torna a pronúncia mais acessível em português, e Haamoni preserva o elemento com artigo incorporado ao nome.
- source_word: הָעָפְנִי
  choice: Ofni
  rationale: Topônimo transliterado em forma natural para leitores de português; o artigo hebraico não é traduzido separadamente, pois integra a forma toponímica no contexto.
- source_word: גָבַע
  choice: Geba
  rationale: O termo funciona claramente como nome próprio nesta lista de localidades; por isso é transliterado, e não traduzido como “colina”.
- source_word: עָרִים
  choice: cidades
  rationale: Mantém o termo convencional das listas territoriais e corresponde ao substantivo hebraico para núcleos urbanos.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: doze
  rationale: Número cardinal que quantifica as cidades.
- source_word: חַצְרֵיהֶן
  choice: seus povoados
  rationale: Designa assentamentos rurais dependentes ou não murados associados às cidades. “Povoados” comunica essa relação com naturalidade e evita sugerir necessariamente a estrutura administrativa moderna de uma aldeia.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com topônimos transliterados segundo formas legíveis em português. A estrutura concisa da lista hebraica foi preservada, inclusive os dois-pontos antes do total.
