- source_word: הַפָּרָה
  choice: Pará
  rationale: Topônimo da herança de Benjamim. O artigo hebraico não é representado separadamente; o acento explicita em português a tonicidade final.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Topônimo transliterado de modo claro e corrente em português, sem tratar a forma como substantivo comum.
- source_word: וְ
  choice: e
  rationale: A conjunção repetida liga os topônimos; em português, a lista é expressa com vírgula e um único «e» antes do último nome.
