  text: וְ/אַתֶּ֞ם תִּכְתְּב֤וּ אֶת הָ/אָ֨רֶץ֙ שִׁבְעָ֣ה חֲלָקִ֔ים וַֽ/הֲבֵאתֶ֥ם אֵלַ֖/י הֵ֑נָּה וְ/יָרִ֨יתִי לָ/כֶ֤ם גּוֹרָל֙ פֹּ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: pt
  text: Vocês deverão registrar a terra em sete partes e trazer o registro aqui para mim. Então lançarei a sorte por vocês aqui, diante do SENHOR, nosso Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: registrar a terra
  rationale: O verbo כתב significa literalmente “escrever”. Neste contexto, refere-se a pôr por escrito a descrição ou levantamento da terra; “registrar” comunica naturalmente essa ação sem acrescentar detalhes ausentes.
- source_word: שִׁבְעָה חֲלָקִים
  choice: em sete partes
  rationale: Reproduz de modo claro a divisão territorial expressa no hebraico.
- source_word: וְיָרִיתִי ... גּוֹרָל
  choice: lançarei a sorte
  rationale: A construção usa o singular גּוֹרָל, “sorte”, e descreve o ato de realizar o sorteio para distribuir as partes.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por “SENHOR” em versaletes/maiúsculas.
theological_decisions:
- issue: O sorteio diante de YHWH
  choice: “lançarei a sorte por vocês aqui, diante do SENHOR, nosso Deus”
  alternative: “tirarei sortes para vocês aqui perante Yahweh, nosso Deus”
  rationale: Mantém o sorteio como ato realizado na presença divina, sem explicitar além do texto como o resultado era entendido ou mediado. O singular preserva a forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com plural “vocês” de ampla legibilidade brasileira. A repetição de “aqui” é preservada porque aparece duas vezes no hebraico e enfatiza o lugar do ato.
