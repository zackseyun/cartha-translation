  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: pt
  text: 'Zela, Haelefe[b], o Jebuseu — isto é, Jerusalém[a] —, Gibeate e Quiriate[c]: catorze cidades com os seus povoados. Essa foi a herança dos filhos de Benjamim, segundo os seus clãs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o Jebuseu, ela é Jerusalém”. A forma gentílica “Jebuseu” é empregada aqui como designação de lugar para Jerusalém.'
    reason: lexical_alternative
  - marker: b
    text: Algumas traduções trazem “Elefe” em vez de “Haelefe” e “Gibeá” em vez de “Gibeate”.
    reason: alternative_reading
  - marker: c
    text: Neste versículo, o texto hebraico traz “Quiriate”, não “Quiriate-Jearim”.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/צֵלַע
  choice: Zela
  rationale: Nome de lugar transliterado em forma natural para leitores de português.
- source_word: הָאֶלֶף
  choice: Haelefe
  rationale: A transliteração conserva o artigo hebraico הָ־ associado à forma do topônimo; a nota registra a forma simplificada comum.
- source_word: וְ/הַ/יְבוּסִי הִיא יְרוּשָׁלִַם
  choice: o Jebuseu — isto é, Jerusalém —
  rationale: Preserva a forma gentílica incomum do hebraico e a identificação explicativa feita pelo próprio texto, sem substituí-la silenciosamente por “Jebus”.
- source_word: גִּבְעַת
  choice: Gibeate
  rationale: Transliteração da forma consonantal presente neste versículo, adaptada à ortografia portuguesa.
- source_word: קִרְיַת
  choice: Quiriate
  rationale: Traduz o topônimo exatamente como aparece no texto massorético, sem acrescentar “Jearim”, ausente neste versículo.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה
  choice: catorze cidades
  rationale: Equivalência direta da expressão que resume o número de localidades enumeradas.
- source_word: וְ/חַצְרֵי/הֶן
  choice: com os seus povoados
  rationale: No contexto de repartição territorial, חָצֵר designa assentamentos dependentes, frequentemente não murados; “povoados” é claro e não os confunde com bairros urbanos.
- source_word: זֹאת נַחֲלַת
  choice: Essa foi a herança
  rationale: A oração nominal hebraica funciona como fórmula conclusiva; o passado é natural no contexto narrativo português.
- source_word: בְּנֵי בִנְיָמִן
  choice: os filhos de Benjamim
  rationale: Mantém a metáfora genealógica e tribal explícita do hebraico.
- source_word: לְ/מִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto tribal, מִשְׁפָּחוֹת indica as subdivisões de parentesco da tribo; “clãs” é mais preciso que “famílias”.
