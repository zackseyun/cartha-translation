  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os topônimos foram transliterados segundo padrões naturais do português. A pontuação esclarece a identificação parentética de Jerusalém e separa a lista do total, sem alterar a estrutura informativa do hebraico.
