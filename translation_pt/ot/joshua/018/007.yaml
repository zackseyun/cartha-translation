source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: pt
  text: Pois os levitas não têm porção entre vocês, porque o sacerdócio de Yahweh é a herança deles.[a] E Gade, Rúben e a meia tribo de Manassés já receberam a herança deles do outro lado do Jordão, a leste, a qual Moisés, servo de Yahweh, lhes deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a herança dele”. O singular provavelmente se refere coletivamente a Levi ou aos levitas; por isso, o texto traz “a herança deles”.
    reason: alternativa lexical e esclarecimento do singular coletivo
lexical_decisions:
- source_word: חֵלֶק
  choice: porção
  rationale: Expressa a parte atribuída na distribuição da terra e mantém distinção lexical em relação a נַחֲלָה, traduzido como “herança”.
- source_word: לַלְוִיִּם
  choice: os levitas
  rationale: Designa coletivamente os integrantes da tribo de Levi; esta é a forma corrente e clara em português.
- source_word: בְּקִרְבְּכֶם
  choice: entre vocês
  rationale: Forma idiomática moderna que comunica a ausência de uma porção territorial no meio das demais tribos.
- source_word: כְהֻנַּת יְהוָה
  choice: o sacerdócio de Yahweh
  rationale: Preserva o sentido institucional de כְהֻנָּה e sua relação direta com Yahweh, sem reduzir a expressão apenas a atividades sacerdotais.
- source_word: נַחֲלָתוֹ
  choice: a herança deles
  rationale: O sufixo hebraico é formalmente masculino singular, mas seu referente contextual é Levi ou os levitas como coletividade; o plural em português comunica naturalmente essa referência, registrada em nota.
- source_word: לָקְחוּ
  choice: já receberam
  rationale: Embora o verbo possa significar literalmente “tomaram”, no contexto de uma concessão territorial indica o recebimento legítimo da herança; “já” torna clara a anterioridade contextual sem alterar o sentido.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: do outro lado do Jordão, a leste
  rationale: Identifica de modo natural e inequívoco em português o território situado a leste do Jordão.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: “Servo” é a expressão portuguesa apropriada para este título honorífico e pactual de Moisés.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico traz o nome pessoal divino; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
- issue: Sufixo singular em נַחֲלָתוֹ com referente coletivo
  choice: a herança deles
  alternative: a herança dele
  rationale: A forma hebraica singular pode retomar Levi como entidade coletiva, enquanto o contexto imediato fala dos levitas no plural. O plural português evita sugerir um indivíduo específico, sem ocultar a forma singular, que é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “porção” e “herança” para refletir a distinção lexical hebraica, e a construção geográfica foi naturalizada como “do outro lado do Jordão, a leste”.
