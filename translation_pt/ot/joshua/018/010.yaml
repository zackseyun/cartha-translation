  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: pt
  text: Então Josué lançou sortes por eles em Siló, diante de Yahweh, e ali repartiu a terra entre os filhos de Israel[a], conforme as suas divisões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Israel”. A expressão se refere coletivamente ao povo de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: lançou sortes
  rationale: A combinação verbal forma a expressão idiomática para realizar um sorteio de distribuição. O plural em português comunica naturalmente o procedimento entre várias tribos, embora גּוֹרָל esteja no singular em hebraico.
- source_word: בְּשִׁלֹה
  choice: em Siló
  rationale: É a forma locativa natural em português para uma cidade onde ocorreu o ato público.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva a ideia de que o sorteio foi realizado na presença de Yahweh, no contexto do santuário, sem explicitar mais do que o texto afirma.
- source_word: וַיְחַלֶּק
  choice: repartiu
  rationale: Expressa a divisão distributiva da terra com naturalidade, enquanto o sorteio mencionado anteriormente mantém clara a forma de atribuição.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto de Josué, refere-se ao território que estava sendo distribuído a Israel.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: entre os filhos de Israel
  rationale: Mantém a expressão hebraica e emprega 'entre' como regência portuguesa natural de 'repartir' quando a distribuição é feita a diversos grupos.
- source_word: כְּמַחְלְקֹתָם
  choice: conforme as suas divisões
  rationale: Conserva o sentido administrativo das divisões ou agrupamentos segundo os quais a terra foi repartida, sem reduzi-lo necessariamente a porções territoriais.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pactual e evita substituí-lo por um título.
- issue: Sentido corporativo de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel, entendido corporativamente
  alternative: israelitas; descendentes de Israel
  rationale: A formulação literal é preservada, mas a nota esclarece que ela designa coletivamente o povo, não apenas indivíduos do sexo masculino.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluida. A repetição do nome Josué no hebraico foi mantida apenas na primeira oração e recuperada pelo sujeito implícito na segunda, como é natural em português. O marcador da nota foi colocado junto à expressão que ela explica.
