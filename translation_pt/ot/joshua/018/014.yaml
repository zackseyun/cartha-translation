  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: pt
  text: Então a fronteira se estendeu e virou para o lado oeste, ao sul, desde o monte que fica defronte de Bete-Horom, ao sul; e sua extremidade chegou a Quiriate-Baal (isto é, Quiriate-Jearim), uma cidade dos filhos de Judá[a]. Esse era o lado oeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos de Judá” é uma designação tribal que se refere ao povo ou aos descendentes de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: fazia uma curva
  rationale: No contexto da descrição de limites, o verbo indica o traçado ou prolongamento da fronteira; junto de וְנָסַב, a expressão comunica naturalmente que a linha se curvava antes de mudar de direção.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: Termo corrente e claro para a linha que delimita um território.
- source_word: וְנָסַב
  choice: virava
  rationale: Expressa a mudança de direção da fronteira sem acrescentar precisão topográfica ausente no hebraico.
- source_word: לִפְאַת יָם
  choice: pelo lado oeste
  rationale: Em fórmulas geográficas, יָם, literalmente “mar”, designa o oeste; פֵּאָה indica lado ou extremidade.
- source_word: נֶגְבָּה
  choice: para o sul / ao sul
  rationale: As duas ocorrências têm valor direcional ou locativo meridional; a formulação portuguesa distingue naturalmente o movimento da localização.
- source_word: מִן הָהָר
  choice: a partir do monte
  rationale: O singular definido aponta para uma elevação específica; “monte” é natural em português e não sugere necessariamente um pico de grande altitude.
- source_word: אֲשֶׁר עַל־פְּנֵי בֵית חֹרוֹן
  choice: que fica diante de Bete-Horom
  rationale: A locução geográfica עַל־פְּנֵי pode significar “diante de”, “defronte de” ou “em frente a”; “diante de” preserva essa relação espacial.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: e terminava
  rationale: A expressão idiomática indica o ponto terminal da fronteira; o verbo torna a descrição clara em português.
- source_word: אֶל קִרְיַת בַּעַל
  choice: em Quiriate-Baal
  rationale: A preposição introduz o local em que a fronteira chegava ao fim; “em” é idiomático com “terminava”.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: (isto é, Quiriate-Jearim)
  rationale: O pronome identifica o nome alternativo da mesma cidade; o parêntese apresenta a equivalência com clareza.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: cidade dos filhos de Judá
  rationale: Mantém a imagem familiar do hebraico בְּנֵי, ao passo que a nota esclarece seu sentido coletivo e tribal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas de uso bíblico corrente. A sintaxe conserva a sequência topográfica do hebraico e mantém a relação espacial ligeiramente aberta em “diante de Bete-Horom, ao sul”, sem impor uma reconstrução geográfica mais específica.
