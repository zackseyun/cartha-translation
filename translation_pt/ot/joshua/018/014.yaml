  to: Então a fronteira se estendeu e virou para o lado oeste, ao sul, desde o monte que fica defronte de Bete-Horom, ao sul; e sua extremidade chegou a Quiriate-Baal (isto é, Quiriate-Jearim), uma cidade dos filhos de Judá[a]. Esse era o lado oeste.
