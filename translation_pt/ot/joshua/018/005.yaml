  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: pt
  text: E eles a dividirão em sete partes. Judá permanecerá em seu território, ao sul,[a] e a casa de José permanecerá em seu território, ao norte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará de pé em sua fronteira”. O verbo hebraico significa literalmente “ficar de pé”, mas, neste contexto, provavelmente indica que os territórios devem permanecer dentro dos limites já estabelecidos. O mesmo vale para a casa de José.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: E eles a dividirão
  rationale: O hitpael de חלק exprime aqui a divisão da terra entre os grupos envolvidos. A forma pronominal explícita preserva o sujeito plural do hebraico e soa natural em português.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: em sete partes
  rationale: חֲלָקִים designa partes ou porções resultantes da divisão. “Partes” é claro, corrente e adequado ao contexto de repartição territorial.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: permanecerá junto à sua fronteira
  rationale: Embora עמד signifique literalmente “ficar de pé”, neste contexto territorial indica permanecer em posição, sem alteração dos limites existentes. “Junto à sua fronteira” conserva a construção com עַל sem sugerir que a tribo inteira esteja literalmente sobre uma linha divisória.
- source_word: מִנֶּגֶב
  choice: ao sul
  rationale: נֶגֶב tem aqui valor direcional, em paralelo com “ao norte”, e não precisa designar especificamente a região do Neguebe.
- source_word: וּבֵית יוֹסֵף
  choice: e a casa de José
  rationale: Preserva a expressão coletiva hebraica para as tribos ligadas a José.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: permanecerá junto à fronteira deles
  rationale: O verbo hebraico está no plural por considerar os integrantes da casa de José, enquanto o português admite concordância gramatical singular com o núcleo coletivo “casa”. O pronome plural “deles” retém a referência coletiva marcada pelo sufixo hebraico.
- source_word: מִצָּפוֹן
  choice: ao norte
  rationale: Uso direcional que forma paralelo claro com “ao sul”.
