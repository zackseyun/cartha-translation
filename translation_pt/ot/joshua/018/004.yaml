  text: הָב֥וּ לָ/כֶ֛ם שְׁלֹשָׁ֥ה אֲנָשִׁ֖ים לַ/שָּׁ֑בֶט וְ/אֶשְׁלָחֵ֗/ם וְ/יָקֻ֜מוּ וְ/יִֽתְהַלְּכ֥וּ בָ/אָ֛רֶץ וְ/יִכְתְּב֥וּ אוֹתָ֛/הּ לְ/פִ֥י נַֽחֲלָתָ֖/ם וְ/יָבֹ֥אוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: pt
  text: Escolham entre vocês três homens de cada tribo[a]. Eu os enviarei; eles partirão, percorrerão a terra e a registrarão por escrito de acordo com a herança deles[b]. Depois, virão até mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Providenciem para vocês três homens por tribo”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, eles deveriam registrar a terra levando em conta as porções territoriais que seriam dadas como herança.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Escolham entre vocês
  rationale: O imperativo, com o pronome preposicionado, pede que os israelitas providenciem ou designem homens dentre si. “Escolham entre vocês” comunica naturalmente essa função no contexto.
- source_word: שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט
  choice: três homens de cada tribo
  rationale: “Homens” preserva o referente masculino explícito; o singular definido “a tribo” tem sentido distributivo no contexto, expresso naturalmente por “cada tribo”.
- source_word: וְאֶשְׁלָחֵם
  choice: Eu os enviarei
  rationale: Traduz diretamente o ato de incumbir esses homens da missão, sem acrescentar um destino não expresso.
- source_word: וְיָקֻמוּ
  choice: eles partirão
  rationale: Embora o verbo signifique literalmente “levantar-se”, nesta sequência narrativa ele introduz o início da missão; “partirão” é idiomático e preserva sua função contextual.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: percorrerão a terra
  rationale: O hitpael de הלך indica deslocar-se por uma área ou atravessá-la; “percorrerão” expressa adequadamente a inspeção do território.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: a registrarão por escrito
  rationale: O pronome feminino retoma “a terra”. A formulação mantém o ato de escrever e torna natural em português a ideia de produzir um registro dela, sem especificar além do texto que tipo de descrição seria.
- source_word: לְפִי נַחֲלָתָם
  choice: de acordo com a herança deles
  rationale: Preserva a formulação concisa do hebraico e seu pronome plural, deixando a nota esclarecer que o registro considera as porções territoriais destinadas como herança.
- source_word: וְיָבֹאוּ אֵלָי
  choice: Depois, virão até mim
  rationale: Mantém o sentido explícito de “vir a mim”. “Depois” representa a progressão da sequência, sem substituir o verbo por “voltar”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A sequência de ações foi expressa com futuros simples; “partirão” evita o arcaísmo de “levantar-se-ão”, e “herança” conserva a terminologia territorial e teológica do contexto.
