base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: pt
  text: A fronteira deles, do lado norte, começava no Jordão. Dali, a fronteira subia até a encosta de Jericó, ao norte[a]; depois, subia pela região montanhosa em direção ao oeste e terminava[b] no deserto de Bete-Áven.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “ombro de Jericó, ao norte”; trata-se de uma expressão geográfica que pode indicar o lado ou a encosta ao norte de Jericó.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico traduzido por “terminava” está no plural e significa literalmente “suas saídas” ou “suas extremidades”, uma expressão topográfica para o ponto ou os pontos finais da fronteira.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: do lado norte
  rationale: פאה indica lado, margem ou extremidade; em uma descrição territorial, “do lado norte” é natural e mantém a função direcional.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: גְּבוּל designa a linha divisória ou limite territorial; “fronteira” é claro e idiomático neste contexto.
- source_word: מִן הַיַּרְדֵּן
  choice: começava no Jordão
  rationale: A preposição marca o ponto inicial do traçado. Com “fronteira”, explicitar “começava” produz português natural sem alterar o sentido; “Jordão” basta como nome conhecido do rio.
- source_word: וְעָלָה
  choice: subia
  rationale: עלה descreve a elevação topográfica do percurso da fronteira; “subia” preserva essa imagem espacial.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: até a encosta de Jericó, ao norte
  rationale: כֶּתֶף significa literalmente “ombro”, mas em uso geográfico indica lado ou encosta. “Ao norte” preserva a relação espacial sem impor que o referente seja necessariamente uma encosta pertencente à cidade.
- source_word: בָהָר יָמָּה
  choice: pela região montanhosa em direção ao oeste
  rationale: הָר pode designar coletivamente a região montanhosa, e יָמָּה é um advérbio direcional, “para o oeste”. A preposição ב pode ser entendida como movimento pela região ou nela adentro; “pela” mantém o traçado topográfico em português corrente.
- source_word: תֹּצְאֹתָיו
  choice: terminava
  rationale: O substantivo plural técnico refere-se às saídas, extremidades ou ponto terminal da fronteira. A forma verbal “terminava” transmite naturalmente a função da expressão na fórmula territorial.
- source_word: מִדְבַּרָה בֵּית אָוֶן
  choice: no deserto de Bete-Áven
  rationale: O ה direcional indica o rumo ou destino do traçado. Depois de “terminava”, “no deserto de” identifica com clareza o local terminal; o topônimo é transliterado.
