lexical_decisions:
- source_word: רֶקֶם
  choice: Requém
  rationale: Nome próprio de lugar em uma lista de cidades. A transliteração adapta a grafia à leitura natural em português e conserva a acentuação massorética.
- source_word: יִרְפְּאֵל
  choice: Irpeel
  rationale: Nome próprio de lugar. A forma com I inicial é clara e legível em português; a nota registra transliterações que representam mais diretamente o yod hebraico.
- source_word: תַרְאֲלָה
  choice: Taralá
  rationale: Nome próprio de lugar, transliterado em vez de traduzido; o acento gráfico indica em português a tonicidade final refletida pela vocalização hebraica.
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada coordena os nomes; em português, usa-se pontuação entre os primeiros itens e «e» antes do último.
