base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: pt
  text: Dali, a fronteira passava em direção a Luz[a], até a encosta sul de Luz — isto é, Betel —; depois, a fronteira descia até Atarote-Adar[b], no monte que fica ao sul de Bete-Horom de Baixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Luz é identificada aqui com Betel.
    reason: cross_reference
  - marker: b
    text: O nome também pode ser transliterado Atrot-Adar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: passava
  rationale: No contexto de uma descrição territorial, o imperfeito narrativo descreve naturalmente o percurso da linha de fronteira, sem sugerir o deslocamento de pessoas.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: Termo territorial corrente e natural em português para a linha divisória descrita em Josué.
- source_word: לוּזָה
  choice: para Luz
  rationale: O nome próprio é transliterado, e o sufixo direcional hebraico é expresso pela preposição «para».
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: pela encosta sul de Luz
  rationale: כֶּתֶף significa literalmente «ombro», mas em topografia designa o lado ou a encosta; «encosta sul» comunica com clareza o sentido geográfico.
- source_word: הִיא בֵּית אֵל
  choice: isto é, Betel
  rationale: A expressão identifica Luz com Betel; a formulação explicativa é natural em português.
- source_word: וְיָרַד
  choice: descia
  rationale: Preserva o movimento topográfico descendente e combina com o fluxo descritivo do versículo.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarote-Adar
  rationale: Transliteração portuguesa clara do topônimo composto, mantendo seus dois elementos.
- source_word: עַל הָהָר
  choice: no monte
  rationale: O singular definido aponta para uma elevação específica; «monte» é natural e não exagera sua dimensão.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: que fica ao sul de Bete-Horom de Baixo
  rationale: Expressa diretamente a localização meridional e traduz o qualificativo תַּחְתּוֹן como parte distintiva do topônimo.
