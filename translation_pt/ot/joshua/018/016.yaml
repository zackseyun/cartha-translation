  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: pt
  text: Então a fronteira desceu até a extremidade do monte que fica de frente para o vale de Ben-Hinom[a], ao norte do vale de Refaim. Depois, desceu pelo vale de Hinom até a encosta sul do jebuseu[b] e desceu até En-Rogel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “vale do filho de Hinom”; Ben-Hinom é usado aqui como nome de lugar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até o lado sul do jebuseu”. “Encosta” traduz uma palavra que significa literalmente “ombro” e que, em descrições topográficas, pode indicar um lado ou uma vertente. “O jebuseu” talvez se refira ao assentamento jebuseu, isto é, Jerusalém.'
    reason: lexical_alternative
  - marker: c
    text: En-Rogel é um nome de lugar; literalmente, “fonte de Rogel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Então a fronteira descia
  rationale: ירד descreve o movimento descendente do traçado; o imperfeito em português é natural numa descrição contínua de fronteira, e 'fronteira' expressa גְּבוּל como linha territorial.
- source_word: קְצֵה הָהָר
  choice: a extremidade do monte
  rationale: קָצֶה é a extremidade ou ponta; הָר pode designar monte ou montanha. 'Monte' é natural para a topografia local sem perder o sentido do hebraico.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: que fica de frente para o vale de Ben-Hinom
  rationale: עַל־פְּנֵי indica aqui relação espacial, 'diante de' ou 'de frente para'. Ben-Hinom é mantido como topônimo.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: ao norte do vale de Refaim
  rationale: A formulação conserva o valor direcional de צָפוֹנָה e evita acrescentar 'extremidade', termo não expresso no hebraico. A ligação exata do relativo permanece um pouco comprimida, como no original.
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: Depois, descia pelo vale de Hinom
  rationale: O hebraico retoma o movimento descendente e nomeia o vale como percurso. 'Pelo' comunica naturalmente esse trajeto em português.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: até a encosta do jebuseu, ao sul
  rationale: כֶּתֶף, literalmente 'ombro', tem sentido topográfico de lado ou encosta. הַיְבוּסִי é mantido literalmente como 'o jebuseu', sem inserir 'cidade'; נֶגְבָּה é apresentado como indicação meridional.
- source_word: עֵין רֹגֵל
  choice: En-Rogel
  rationale: É um topônimo; a transliteração preserva sua função como nome de lugar, enquanto o sentido literal é registrado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com grafia de topônimos legível para brasileiros e compreensível internacionalmente. A redação acompanha o movimento topográfico repetido do hebraico e evita explicitar 'cidade' no texto principal, pois essa palavra não aparece na fonte.
