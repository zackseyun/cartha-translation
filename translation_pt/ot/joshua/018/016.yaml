  naturalness: «Então ... descia» e as repetições subsequentes no imperfeito soam menos naturais numa narração pontual de delimitação. «A fronteira desceu ... Depois, desceu...» é claro, fluente e preserva a sequência do texto.
  terminology: «Fronteira», «monte», «Ben-Hinom», «Refaim», «Hinom», «jebuseu» e «En-Rogel» são escolhas adequadas. Mantém-se «jebuseu» sem acrescentar «cidade», pois o hebraico não traz esse substantivo.
