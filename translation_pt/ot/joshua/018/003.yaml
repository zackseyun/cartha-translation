  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: pt
  text: 'Então Josué disse aos filhos de Israel[a]: “Até quando vocês vão demorar a entrar e tomar posse da terra que Yahweh, o Deus de seus pais, deu a vocês?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos israelitas”. Literalmente: “aos filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol faz a narrativa avançar; “Então” expressa naturalmente essa sequência em português sem impor uma relação causal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Preserva a expressão familiar hebraica e sua forma masculina plural; “aos israelitas” é uma alternativa mais idiomática, registrada em nota.
- source_word: עַד אָנָה
  choice: Até quando
  rationale: Equivalente português natural da pergunta temporal de repreensão.
- source_word: מִתְרַפִּים
  choice: vão continuar hesitando
  rationale: O hitpael de רפה comunica falta de iniciativa, frouxidão ou demora. “Continuar hesitando” transmite a censura em português corrente sem intensificá-la para “preguiça” ou “negligência”.
- source_word: לָבוֹא לָרֶשֶׁת
  choice: entrar e tomar posse
  rationale: Reproduz os dois infinitivos e apresenta com clareza tanto a entrada na terra quanto sua ocupação efetiva.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Referência definida à terra prometida, expressa de modo natural em português.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: que ... deu a vocês
  rationale: O perfeito hebraico apresenta a dádiva divina como realizada, embora a posse humana ainda esteja pendente. O pretérito perfeito é claro e natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: o Deus de seus pais
  rationale: Mantém de forma clara e próxima ao hebraico a fórmula pactual e intergeracional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome próprio divino em vez de substituí-lo por um título.
- issue: Dádiva divina já realizada e posse ainda incompleta
  choice: “deu a vocês”, ao lado de “entrar e tomar posse”
  alternative: “está dando a vocês”
  rationale: Mantém a tensão do hebraico entre a terra já concedida por Yahweh e a responsabilidade ainda não cumprida de ocupá-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O tratamento plural “vocês” evita formas regionais ou excessivamente solenes. A formulação preserva a repreensão de Josué sem ampliar o sentido para uma acusação explícita de preguiça.
