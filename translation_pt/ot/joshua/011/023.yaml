  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: pt
  text: Assim, Josué tomou toda a terra[a], conforme tudo o que Yahweh havia dito a Moisés. Josué a deu a Israel como herança, segundo suas divisões tribais. E a terra descansou da guerra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a terra inteira”. A expressão resume a conquista, por Josué, da terra em discussão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficou tranquila, sem guerra”. A expressão hebraica indica repouso ou tranquilidade depois do conflito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Preserva o sentido básico e conciso de לקח no resumo narrativo, sem especificar além do texto se a ação deve ser entendida como conquista militar ou tomada de posse.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Refere-se à terra em discussão no contexto, não ao planeta inteiro. A formulação mantém a abrangência do resumo hebraico sem resolver a tensão com passagens que mencionam territórios ainda não ocupados.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: conforme tudo o que ... havia dito
  rationale: Expressa correspondência com a palavra anteriormente comunicada e usa uma construção temporal natural em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיִּתְּנָהּ
  choice: a deu
  rationale: O pronome feminino retoma 'a terra'; 'deu' conserva o sentido básico de נתן, enquanto a expressão seguinte comunica a natureza da concessão.
- source_word: לְנַחֲלָה
  choice: como herança
  rationale: Mantém o sentido jurídico e pactual de uma propriedade recebida como herança.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: segundo as suas divisões, por suas tribos
  rationale: 'Conserva os dois elementos do hebraico: a distribuição em divisões e sua organização segundo as tribos.'
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: descansou da guerra
  rationale: Reproduz de modo conciso a imagem hebraica de tranquilidade ou repouso após o conflito, sem afirmar uma paz absoluta e universal.
theological_decisions:
- issue: Alcance de 'toda a terra' no resumo da conquista
  choice: Manter a afirmação abrangente como resumo narrativo do êxito de Josué em conformidade com a palavra de Yahweh.
  alternative: Interpretá-la explicitamente como ocupação imediata e absoluta de cada território, ou qualificá-la no texto como mera hipérbole.
  rationale: O hebraico apresenta a afirmação sem explicar sua relação com relatos de áreas ainda não ocupadas. A tradução preserva essa tensão em vez de impor uma harmonização.
- issue: Natureza do descanso da terra
  choice: Traduzir a personificação hebraica como 'a terra descansou da guerra'.
  alternative: Explicitar que todo conflito cessou definitivamente ou reduzir a expressão a uma condição política de paz.
  rationale: A formulação conserva a imagem e indica a cessação do conflito no contexto, sem ampliar seu alcance teológico ou histórico.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A ordem de 'a deu a Israel como herança' é natural em português e preserva as relações do hebraico. Mantém-se a repetição de 'Josué' e a personificação da terra por sua função no resumo narrativo.
