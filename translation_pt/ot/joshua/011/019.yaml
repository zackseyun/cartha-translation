  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: pt
  text: Não houve cidade que fizesse paz com os filhos de Israel[a], exceto os heveus que moravam em Gibeão; os filhos de Israel tomaram todas elas na guerra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. O hebraico diz mais literalmente “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “eles tomaram tudo na guerra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: fizesse paz com
  rationale: O hifil de שׁלם, com אֶל, indica aqui o estabelecimento de relações pacíficas. A expressão portuguesa é natural e não especifica em excesso ideias como rendição ou submissão.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de perto a expressão nacional e pactual do hebraico, sendo também clara em português bíblico moderno.
- source_word: בִּלְתִּי
  choice: exceto
  rationale: Introduz de modo claro a única exceção à negação da oração anterior.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: os heveus que moravam em Gibeão
  rationale: Representa naturalmente o particípio יֹשְׁבֵי como residência habitual e mantém a identificação étnica e geográfica.
- source_word: אֶת הַכֹּל
  choice: todas elas
  rationale: O feminino plural retoma naturalmente as cidades mencionadas no início do versículo, embora o hebraico diga de forma mais geral 'tudo/todos'.
- source_word: לָקְחוּ בַמִּלְחָמָה
  choice: foram tomadas em batalha
  rationale: A construção passiva em português evita um sujeito pronominal potencialmente ambíguo e comunica com naturalidade que as demais cidades foram conquistadas militarmente; a nota preserva a forma literal ativa.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantém a formulação bíblica “filhos de Israel”, enquanto usa sintaxe corrente. A segunda oração foi vertida na voz passiva para esclarecer a referência às cidades sem alterar o sentido militar do hebraico.
