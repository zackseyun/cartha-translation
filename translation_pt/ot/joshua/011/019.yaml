  naturalness: «Fizesse paz com», «heveus», «moravam em Gibeão» e «filhos de Israel» são naturais em registro bíblico moderno. A repetição de «os filhos de Israel» na segunda oração produz uma frase clara e evita a ambiguidade que surgiria com «eles» após a referência aos heveus.
  terminology: «Heveus» e «Gibeão» são formas estabelecidas em português. «Filhos de Israel» preserva adequadamente a expressão hebraica; a nota alternativa «os israelitas» é útil. «Na guerra» reproduz de modo mais direto בַּמִּלְחָמָה do que «em batalha», sem especificar uma batalha individual.
