  text: וַ/יָּ֨שָׁב יְהוֹשֻׁ֜עַ בָּ/עֵ֤ת הַ/הִיא֙ וַ/יִּלְכֹּ֣ד אֶת חָצ֔וֹר וְ/אֶת מַלְכָּ֖/הּ הִכָּ֣ה בֶ/חָ֑רֶב כִּֽי חָצ֣וֹר לְ/פָנִ֔ים הִ֕יא רֹ֖אשׁ כָּל הַ/מַּמְלָכ֥וֹת הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: pt
  text: Naquele tempo, Josué voltou[a], tomou Hazor e feriu seu rei à espada[b], pois, anteriormente, Hazor era a cabeça de todos esses reinos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retornou”. O verbo hebraico pode expressar retorno ou movimento de volta no curso da campanha.
    reason: lexical_alternative
  - marker: b
    text: “Feriu... à espada” traduz o hebraico de modo contido. No contexto, a expressão provavelmente implica que o matou, mas o verbo empregado significa literalmente “ferir” ou “golpear”.
    reason: lexical_alternative
  - marker: c
    text: Ou “era a principal entre todos esses reinos”. O hebraico diz literalmente “era a cabeça de todos esses reinos”, usando uma metáfora de primazia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב indica retorno ou movimento de volta no curso da campanha. “Voltou” é natural em português e mantém a nuance direcional; “retornou” é uma alternativa possível.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal corrente que não restringe indevidamente a referência a um único instante.
- source_word: וַיִּלְכֹּד
  choice: tomou
  rationale: לכד é frequentemente usado para a tomada militar de uma cidade. “Tomou” é idiomático e digno em português bíblico atual; “capturou” também seria possível.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Nome próprio transliterado segundo a forma tradicional e amplamente reconhecida em português.
- source_word: מַלְכָּהּ
  choice: seu rei
  rationale: O sufixo feminino singular retoma a cidade de Hazor. Em português, “seu rei” exprime naturalmente essa relação.
- source_word: הִכָּה בֶחָרֶב
  choice: feriu seu rei à espada
  rationale: נכה significa literalmente golpear ou ferir. A formulação preserva a contenção lexical do hebraico; embora o contexto provavelmente implique morte, o verbo “matar” não aparece explicitamente.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação da importância de Hazor, com conexão causal-explicativa natural em português.
- source_word: לְפָנִים
  choice: anteriormente
  rationale: Indica uma condição precedente. A escolha é clara e atual sem estreitar a expressão a um momento exato.
- source_word: רֹאשׁ
  choice: a cabeça
  rationale: Preserva a metáfora hebraica de primazia. Em português, a nota esclarece o sentido de cidade principal ou dominante.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: todos esses reinos
  rationale: Tradução direta que conserva tanto a totalidade quanto a força demonstrativa do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução mantém a sequência narrativa concisa do hebraico, preserva a metáfora “cabeça” e evita explicitar a morte do rei além do que o verbo hebraico declara.
