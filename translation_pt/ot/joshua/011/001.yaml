  text: וַ/יְהִ֕י כִּ/שְׁמֹ֖עַ יָבִ֣ין מֶֽלֶךְ חָצ֑וֹר וַ/יִּשְׁלַ֗ח אֶל יוֹבָב֙ מֶ֣לֶךְ מָד֔וֹן וְ/אֶל מֶ֥לֶךְ שִׁמְר֖וֹן וְ/אֶל מֶ֥לֶךְ אַכְשָֽׁף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: pt
  text: Quando Jabim, rei de Hazor, soube disso[a], mandou uma mensagem a Jobabe, rei de Madom, ao rei de Sinrom[b] e ao rei de Acsafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “E aconteceu que, quando Jabim, rei de Hazor, ouviu”. O objeto de “ouviu” está implícito no contexto anterior.'
    reason: lexical_alternative
  - marker: b
    text: Alguns identificam Sinrom com “Sinrom-Merom”, mencionada em Josué 12:20; aqui, porém, o hebraico traz apenas “Sinrom”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Quando ... soube disso
  rationale: A fórmula narrativa introduz uma circunstância temporal. Em português atual, “Quando ... soube” comunica isso naturalmente; “disso” explicita o objeto implícito pelo contexto anterior.
- source_word: יָבִין
  choice: Jabim
  rationale: Transliteração tradicional e amplamente reconhecível em português do nome hebraico.
- source_word: מֶלֶךְ חָצוֹר
  choice: rei de Hazor
  rationale: A cadeia construta é vertida diretamente como título seguido do topônimo.
- source_word: וַיִּשְׁלַח אֶל
  choice: mandou uma mensagem a
  rationale: Em português, o simples “mandou a” ficaria incompleto ou ambíguo. O contexto exige algo enviado aos reis; “uma mensagem” expressa idiomaticamente o sentido sem especificar mensageiros.
- source_word: יוֹבָב
  choice: Jobabe
  rationale: Forma portuguesa tradicional do nome pessoal.
- source_word: מֶלֶךְ מָדוֹן
  choice: rei de Madom
  rationale: Tradução direta da cadeia construta, com forma portuguesa tradicional do topônimo.
- source_word: שִׁמְרוֹן
  choice: Sinrom
  rationale: Forma aportuguesada que representa o topônimo do texto massorético, sem expandi-lo para “Sinrom-Merom”.
- source_word: אַכְשָׁף
  choice: Acsafe
  rationale: Forma portuguesa tradicional e legível do topônimo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se títulos e topônimos em formas portuguesas reconhecíveis. A construção narrativa hebraica foi vertida idiomaticamente, e a possível identificação de Sinrom foi preservada apenas em nota.
