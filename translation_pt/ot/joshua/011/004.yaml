base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: pt
  text: 'Eles saíram, acompanhados de todos os seus acampamentos[a]: uma grande multidão[b], tão numerosa quanto a areia à beira do mar, com muitíssimos cavalos e carros de guerra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exércitos”. A palavra hebraica traduzida como “acampamentos” pode referir-se a acampamentos militares e, por extensão, às forças reunidas neles.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um povo numeroso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Eles saíram
  rationale: O verbo יצא indica movimento para fora. “Saíram” preserva o sentido básico sem acrescentar a ideia específica de marcha militar.
- source_word: מַחֲנֵיהֶם
  choice: seus acampamentos
  rationale: מַחֲנֶה pode designar um acampamento militar e, por extensão, as forças nele reunidas. “Acampamentos” mantém a imagem concreta do hebraico; a nota registra a alternativa contextual.
- source_word: עַם רָב
  choice: uma enorme multidão
  rationale: A expressão significa literalmente “um povo numeroso”, mas, neste contexto, ressalta o tamanho das forças reunidas. “Enorme multidão” comunica isso com naturalidade, enquanto a nota preserva a forma literal.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: tão numerosa quanto a areia à beira do mar
  rationale: A formulação explicita de modo idiomático que a comparação com a areia diz respeito à quantidade, preservando a imagem hebraica.
- source_word: סוּס
  choice: cavalos
  rationale: Embora esteja no singular em hebraico, o substantivo tem valor coletivo; o plural é natural em português.
- source_word: רֶכֶב
  choice: carros de guerra
  rationale: רֶכֶב pode indicar carros ou a força de carros. “Carros de guerra” torna claro o sentido militar no português atual.
- source_word: רַב מְאֹד
  choice: muitíssimos
  rationale: A forma intensifica a enorme quantidade de cavalos e carros, expressa de modo conciso e natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção conserva a repetição enfática “eles e...” do hebraico, mantém a imagem dos acampamentos e explicita naturalmente o valor numérico da comparação com a areia.
