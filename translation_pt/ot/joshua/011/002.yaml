id: JOS.11.2
reference: Joshua 11:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: pt
  text: e aos reis que estavam ao norte, na região montanhosa, na Arabá ao sul de Quinerote, nas terras baixas e nas elevações de Dor[a], a oeste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos distritos de Dor”, “na região de Dor” ou “nas encostas de Dor”. O termo hebraico é raro, e seu sentido topográfico exato é discutido.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do mar”; no uso geográfico hebraico, a expressão geralmente indica o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: e aos
  rationale: A conjunção e a preposição dão continuidade à enumeração iniciada no versículo anterior e introduzem outros reis aos quais foi enviada a convocação.
- source_word: הַמְּלָכִים
  choice: reis
  rationale: מֶלֶךְ designa especificamente reis; “governantes” seria mais amplo que o hebraico.
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: que estavam ao norte
  rationale: A expressão identifica a localização desses reis. “Ao norte” é natural em português e se integra à sequência geográfica.
- source_word: בָּהָר
  choice: na região montanhosa
  rationale: הַר pode designar um monte ou, coletivamente, uma região de montes; neste inventário territorial, o sentido regional é o mais adequado.
- source_word: וּבָעֲרָבָה
  choice: na Arabá
  rationale: עֲרָבָה funciona aqui como nome geográfico da região do vale de rifte; a transliteração evita reduzi-lo ao sentido genérico de “planície”.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: ao sul de Quinerote
  rationale: נֶגֶב tem aqui valor direcional em relação a Quinerote, uma localidade setentrional, e não designa a região do Neguebe.
- source_word: וּבַשְּׁפֵלָה
  choice: nas terras baixas
  rationale: שְׁפֵלָה designa a região baixa ou de colinas ao pé dos montes. “Terras baixas” comunica o relevo ao leitor comum sem exigir um topônimo transliterado.
- source_word: וּבְנָפוֹת דּוֹר
  choice: nas elevações de Dor
  rationale: נָפוֹת é raro e seu sentido topográfico exato é discutido. “Elevações” preserva uma interpretação contextual comum, enquanto a nota registra as principais alternativas.
- source_word: מִיָּם
  choice: a oeste
  rationale: Embora formado com יָם, “mar”, o termo é empregado direcionalmente na geografia hebraica, pois o Mediterrâneo ficava a oeste.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se os topônimos Arabá, Quinerote e Dor; termos topográficos mais transparentes foram preferidos onde possível. A frase conserva a forma de continuação do versículo anterior.
