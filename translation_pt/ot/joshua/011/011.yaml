base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: pt
  text: Mataram ao fio da espada todas as pessoas que havia nela, consagrando-as à destruição[a]. Não restou nenhum ser que respirasse[b]. E ele queimou Hazor com fogo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “colocando-as sob anátema”. O hebraico emprega a linguagem de חרם, que indica consagração à destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “não restou respiração alguma”, expressão que indica que nenhum sobrevivente ficou.'
    reason: lexical_alternative
  - marker: c
    text: O hebraico passa do plural (“mataram”) para o singular (“ele queimou”), provavelmente referindo-se especificamente a Josué na oração final.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: Feriram
  rationale: O hifil de נכה, neste contexto militar, indica abater ou ferir mortalmente. “Feriram” mantém a formulação bíblica corrente sem reduzir o sentido a um simples golpe.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: todas as pessoas que nela havia
  rationale: נֶפֶשׁ designa aqui pessoas vivas, não a alma imaterial. A construção natural em português comunica claramente a totalidade dos habitantes.
- source_word: לְפִי חֶרֶב
  choice: ao fio da espada
  rationale: Equivalente idiomático tradicional e inteligível para a expressão hebraica literalmente ligada à “boca da espada”.
- source_word: הַחֲרֵם
  choice: consagrando-as à destruição
  rationale: 'Preserva a noção específica de חרם: separar irrevogavelmente para destruição, em vez de expressar apenas uma matança genérica.'
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: Não restou nenhum ser que respirasse
  rationale: Conserva a imagem hebraica de respiração e, ao mesmo tempo, comunica naturalmente que nenhum sobrevivente permaneceu.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: שָׂרַף בָּאֵשׁ
  choice: ele queimou Hazor no fogo
  rationale: Mantém o verbo no singular e preserva a menção explícita ao fogo na formulação hebraica.
theological_decisions:
- issue: Tradução de חרם no contexto da conquista
  choice: consagrando-as à destruição
  alternative: destruindo-as completamente; colocando-as sob anátema
  rationale: A escolha retém o sentido cultual e judicial de dedicação irrevogável à destruição sem impor uma explicação doutrinária além do texto.
- issue: Mudança do sujeito plural para o singular
  choice: Feriram ... ele queimou
  alternative: Feriram ... queimaram
  rationale: O hebraico passa do plural וַיַּכּוּ ao singular שָׂרַף. A tradução preserva essa mudança, embora o sujeito singular, provavelmente Josué, esteja implícito no original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se o idioma militar “ao fio da espada”, a linguagem teologicamente carregada de חרם e a mudança de número verbal do hebraico. Os marcadores aparecem junto às expressões a que se referem.
