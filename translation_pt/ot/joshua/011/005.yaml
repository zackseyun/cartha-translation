base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/005.yaml
  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: pt
  text: Todos esses reis se reuniram de comum acordo[a], vieram e acamparam juntos junto às águas de Merom, para lutar contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reuniram-se conforme combinado” ou “reuniram-se”; o verbo hebraico indica um ajuntamento coordenado, não um encontro casual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: se reuniram de comum acordo
  rationale: O nifal de יעד indica uma reunião coordenada ou previamente combinada, e não um encontro casual. A expressão comunica tanto o ajuntamento quanto o acordo entre os reis.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: todos esses reis
  rationale: Preserva de modo natural a totalidade e a força demonstrativa do hebraico.
- source_word: וַיָּבֹאוּ
  choice: foram
  rationale: No encadeamento narrativo e antes do local de destino, 'foram' soa mais natural em português do que a tradução isolada 'vieram', sem alterar o movimento expresso por בוא.
- source_word: וַיַּחֲנוּ יַחְדָּו
  choice: juntos e acamparam
  rationale: Mantém o sentido militar de חנה e associa יַחְדָּו à ação coordenada da coalizão em português corrente. A colocação de 'juntos' antes de 'acamparam' evita uma construção pesada.
- source_word: אֶל מֵי מֵרוֹם
  choice: junto às águas de Merom
  rationale: A preposição hebraica marca o destino, enquanto o contexto de acampamento permite uma formulação locativa natural. 'Águas' preserva o plural do hebraico sem identificar de maneira mais específica o acidente geográfico.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: para lutar contra Israel
  rationale: Expressa com clareza a finalidade e o sentido adversativo da construção militar com לחם e עִם.
