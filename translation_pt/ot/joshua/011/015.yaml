  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: pt
  text: Assim como Yahweh havia ordenado a Moisés, seu servo, assim Moisés ordenou a Josué, e assim Josué fez. Ele não deixou de cumprir coisa alguma de tudo o que Yahweh havia ordenado a Moisés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele não omitiu coisa alguma de tudo o que Yahweh havia ordenado a Moisés.” A expressão hebraica diz literalmente: “não retirou coisa alguma de tudo o que Yahweh havia ordenado a Moisés”.'
    reason: alternativa lexical e esclarecimento do idioma hebraico
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Assim como
  rationale: Introduz a correspondência entre a ordem de Yahweh a Moisés e a ordem de Moisés a Josué, de modo claro e natural em português.
- source_word: צִוָּה
  choice: havia ordenado / ordenou
  rationale: Expressa uma ordem investida de autoridade. O mais-que-perfeito composto na primeira e na última ocorrência situa as ordens de Yahweh antes da execução por Josué; o pretérito perfeito preserva a sequência narrativa na ocorrência central.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: עַבְדּוֹ
  choice: seu servo
  rationale: Neste contexto honorífico aplicado a Moisés, “servo” comunica naturalmente sua relação de serviço e lealdade a Yahweh sem destacar a condição social de escravo.
- source_word: כֵּן
  choice: assim
  rationale: Marca correspondência e sequência; a repetição de “assim” conserva o paralelismo do hebraico.
- source_word: עָשָׂה
  choice: fez
  rationale: Mantém a concisão do verbo hebraico e permite que a frase seguinte esclareça a abrangência da obediência de Josué.
- source_word: לֹא הֵסִיר דָּבָר
  choice: não deixou de cumprir coisa alguma
  rationale: Traduz idiomaticamente a ideia de não omitir nenhuma parte do que fora ordenado, ao mesmo tempo que “coisa alguma” conserva a referência abrangente de דָּבָר.
- source_word: מִכֹּל אֲשֶׁר
  choice: de tudo o que
  rationale: Expressa a totalidade das ordens divinas e se integra naturalmente à construção portuguesa “não deixou de cumprir coisa alguma de tudo o que”.
- source_word: אֶת
  choice: '[não traduzido]'
  rationale: É um marcador de objeto direto sem equivalente lexical independente em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino em transliteração, sem o substituir pelo título “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “assim” foi mantida para preservar a estrutura enfática do hebraico; o pronome “Ele” explicita naturalmente Josué como sujeito da última frase.
