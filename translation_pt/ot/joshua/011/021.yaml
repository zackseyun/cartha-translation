  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: pt
  text: 'Naquele tempo, Josué foi e eliminou os anaquins da região montanhosa: de Hebrom, de Debir, de Anabe, de toda a região montanhosa de Judá e de toda a região montanhosa de Israel. Josué os consagrou à destruição[a], juntamente com as suas cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “colocou-os sob o anátema”. O verbo hebraico transmite a ideia de consagrar pessoas ou coisas à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: foi
  rationale: O verbo בוא pode ser traduzido por “vir”, “ir” ou “chegar”, conforme o ponto de vista narrativo. “Foi” dá continuidade natural ao relato em português sem acrescentar um local de chegada não expresso.
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal corrente e digna, que mantém a ligação narrativa sem definir indevidamente a duração.
- source_word: וַיַּכְרֵת
  choice: eliminou
  rationale: כרת significa literalmente “cortar” ou “eliminar”. Neste contexto, indica a remoção dos anaquins da região; “eliminou” comunica o sentido em português atual e permanece distinto do termo técnico חרם na oração final.
- source_word: הָעֲנָקִים
  choice: os anaquins
  rationale: Forma portuguesa tradicional e reconhecível para o nome do povo descendente de Anaque.
- source_word: מִן הָהָר
  choice: da região montanhosa
  rationale: Em Josué, הָהָר frequentemente designa uma zona de terras altas, não uma única montanha. “Região montanhosa” expressa com clareza esse valor geográfico.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: de Hebrom, de Debir, de Anabe
  rationale: Os topônimos são apresentados em suas formas portuguesas usuais, e a repetição de “de” preserva a estrutura enfática da lista hebraica.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: de toda a região montanhosa de Judá
  rationale: A expressão abrange a totalidade das terras altas associadas a Judá.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: de toda a região montanhosa de Israel
  rationale: Mantém “Israel” como designação geográfica do texto, sem especificar além do que o hebraico afirma.
- source_word: עִם עָרֵיהֶם
  choice: juntamente com as suas cidades
  rationale: עִם expressa associação, e “cidades” é uma tradução formal e natural de עָרִים neste relato.
- source_word: הֶחֱרִימָם
  choice: os consagrou à destruição
  rationale: No hifil, חרם indica colocar pessoas ou coisas sob interdição, destinando-as à destruição. A formulação conserva o caráter técnico do verbo e evita reduzi-lo ao simples “destruiu”.
theological_decisions:
- issue: Terminologia de חרם no contexto de guerra
  choice: Josué os consagrou à destruição
  alternative: Josué os colocou sob o anátema; Josué os destruiu completamente
  rationale: O versículo emprega tanto כרת como חרם. A tradução distingue os dois verbos e preserva a dimensão de dedicação irrevogável à destruição presente em חרם, sem inserir uma explicação doutrinária no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de nomes familiares ao leitor brasileiro. A construção evita arcaísmos, preserva a repetição geográfica do hebraico e mantém distinto o vocabulário técnico de חרם.
