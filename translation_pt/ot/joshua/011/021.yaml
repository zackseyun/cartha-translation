  source_fidelity: 'A tradução representa adequadamente a sequência verbal hebraica: a ação de Josué naquele momento, a eliminação dos anaquins das regiões enumeradas e a ação distinta expressa por חרם. «Foi» é uma opção contextual admissível para וַיָּבֹא, e «eliminou» preserva uma distinção útil em relação a «consagrou à destruição». A abrangência de «toda a região montanhosa de Judá» e «... de Israel» foi mantida sem interpretação geográfica adicional.'
