lexical_decisions:
- source_word: רַק
  choice: Mas
  rationale: Introduz o contraste e a exceção em relação à narrativa anterior de modo natural em português.
- source_word: כָּל הֶעָרִים ... לֹא
  choice: não queimou nenhuma das cidades
  rationale: Sob a negação, esta formulação idiomática preserva o sentido distributivo do hebraico sem sugerir que Israel teria queimado apenas parte delas.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: que permaneciam sobre seus montes
  rationale: Preserva a imagem das cidades situadas ou ainda existentes sobre seus montes de ocupação, usando vocabulário acessível; a alternativa arqueológica é explicada em nota.
- source_word: זוּלָתִי אֶת חָצוֹר לְבַדָּהּ
  choice: com exceção apenas de Hazor
  rationale: Expressa Hazor como a única exceção e mantém a ênfase de לְבַדָּהּ.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: Josué a queimou
  rationale: Mantém a voz ativa e identifica Josué como agente; o pronome retoma Hazor naturalmente em português.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Segue a forma tradicional e amplamente reconhecida do nome próprio em português.
