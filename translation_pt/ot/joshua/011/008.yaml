  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: pt
  text: Yahweh os entregou na mão de Israel; os israelitas os golpearam e os perseguiram até a Grande Sidom, até Misrefote-Maim[a] e até o vale de Mispá, para o leste. Eles os golpearam até não lhes deixar sobrevivente algum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Misrefote-Maim” é um nome de lugar; em hebraico, o nome pode significar “queimas das águas”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até que eles não lhes deixassem sobrevivente algum”. O hebraico usa aqui um infinitivo e não explicita o sujeito.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: os entregou nas mãos de Israel
  rationale: Em contexto militar, נתן ביד indica entregar alguém ao poder de outro. A formulação portuguesa preserva a imagem hebraica das mãos e expressa naturalmente a derrota concedida por Deus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: os derrotou / Eles os derrotaram
  rationale: נכה, neste contexto bélico, indica golpear e vencer, provavelmente com resultado letal. “Derrotar” é claro e natural em português, enquanto o contexto e a ausência de sobreviventes conservam a força do verbo.
- source_word: וַיִּרְדְּפוּם
  choice: os perseguiu
  rationale: רדף é o verbo comum para perseguir um inimigo em fuga.
- source_word: צִידוֹן רַבָּה
  choice: a Grande Sidom
  rationale: רבה qualifica o nome da cidade; “Grande Sidom” reproduz de modo natural essa designação.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: Misrefote-Maim
  rationale: A expressão funciona como topônimo e, por isso, é transliterada. Seu possível sentido lexical é registrado em nota.
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: o vale de Mispá, a leste
  rationale: בקעה designa um vale amplo ou planície de vale; מזרחה tem valor direcional ou locativo oriental. A redação é clara sem determinar além do hebraico se a expressão significa estritamente “para o leste” ou “a leste”.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: até não lhes deixar nenhum sobrevivente
  rationale: O infinitivo português, como a construção hebraica, evita explicitar quem é o sujeito de “deixar”. שָׂרִיד refere-se aqui a alguém que sobrevive à derrota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome próprio divino. “Yahweh” o preserva como nome, sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Sujeito implícito na cláusula final
  choice: até não lhes deixar nenhum sobrevivente
  alternative: até eles não lhes deixarem nenhum sobrevivente; até que ele não lhes deixasse nenhum sobrevivente
  rationale: A forma הִשְׁאִיר é um infinitivo e não marca pessoa ou número. A tradução com infinitivo conserva a falta de sujeito explícito, sem decidir silenciosamente entre Israel como coletivo, os israelitas ou outro referente contextual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. O singular coletivo “Israel, que os derrotou e os perseguiu” acompanha o referente hebraico; a retomada por “Eles” explicita naturalmente os combatentes israelitas. Os topônimos seguem formas portuguesas reconhecíveis, e a ambiguidade da cláusula final é preservada pelo infinitivo.
