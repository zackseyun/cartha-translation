lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: por muitos dias
  rationale: Preserva a expressão hebraica concreta, que também comunica naturalmente em português a ideia de um período prolongado.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: guerreou
  rationale: A expressão hebraica significa literalmente “fez guerra”. O verbo “guerreou” transmite o sentido idiomático de modo natural, atual e conciso.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: contra todos esses reis
  rationale: No contexto da expressão “fazer guerra”, a preposição “contra” explicita naturalmente o sentido hostil em português.
- source_word: מִלְחָמָה
  choice: guerra
  rationale: Embora incorporado ao verbo “guerreou”, conserva-se semanticamente o sentido básico do substantivo hebraico, “guerra” ou “combate”.
