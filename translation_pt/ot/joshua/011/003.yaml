base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: pt
  text: os cananeus no leste e no oeste[a], os amorreus, os hititas, os perizeus e os jebuseus da região montanhosa, e os heveus ao pé do Hermom, na terra de Mispá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente, “e do mar”; aqui, “mar” provavelmente é uma designação geográfica do oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: O gentílico singular com artigo tem sentido coletivo; o plural é a forma mais natural e clara em português.
- source_word: מִמִּזְרָח
  choice: do leste
  rationale: A preposição hebraica, literalmente “desde/de”, indica aqui localização ou distribuição geográfica, em contraste com o oeste.
- source_word: וּמִיָּם
  choice: e do oeste
  rationale: “Mar” é usado geograficamente para o oeste, onde fica o Mediterrâneo; a nota preserva a expressão literal.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: os amorreus, os hititas, os perizeus e os jebuseus
  rationale: Os gentílicos hebraicos no singular com artigo designam coletivamente esses povos; em português, emprega-se naturalmente o plural.
- source_word: בָּהָר
  choice: da região montanhosa
  rationale: Em Josué, o termo frequentemente designa a zona de terras altas, não necessariamente montanhas isoladas.
- source_word: הַחִוִּי
  choice: os heveus
  rationale: O singular gentílico hebraico é coletivo e foi vertido pelo plural natural em português.
- source_word: תַּחַת חֶרְמוֹן
  choice: ao pé do Hermom
  rationale: A expressão espacial indica a área abaixo do monte ou junto às suas encostas inferiores; “ao pé” é natural em português.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: na terra de Mispá
  rationale: אֶרֶץ denota território ou região, e Mispá é conservado como nome próprio.
