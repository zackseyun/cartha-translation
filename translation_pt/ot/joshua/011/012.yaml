source:
  edition: WLC
  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: pt
  text: Josué capturou todas as cidades desses reis e todos os seus reis. Abateu-os ao fio da espada e os consagrou à destruição[a], conforme Moisés, servo de Yahweh, havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destruiu-os completamente”. O hebraico usa aqui o verbo técnico que indica colocar pessoas ou coisas sob o ḥerem, isto é, consagrá-las irrevogavelmente à destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: as cidades desses reis
  rationale: Reproduz a relação do construto hebraico entre as cidades e os reis já mencionados, sem interpretar a expressão como simples designação de “cidades reais”.
- source_word: לָכַד
  choice: capturou
  rationale: No contexto militar, expressa de modo natural a tomada das cidades e de seus reis.
- source_word: וַיַּכֵּם
  choice: Abateu-os
  rationale: נכה tem sentido amplo, mas a expressão seguinte, “ao fio da espada”, indica aqui violência letal. “Abateu-os” conserva a ação sem recorrer a linguagem arcaica.
- source_word: לְפִי חֶרֶב
  choice: ao fio da espada
  rationale: Equivalente português corrente do idioma hebraico literalmente relacionado à “boca da espada”, preservando sua imagem concreta.
- source_word: הֶחֱרִים
  choice: os consagrou à destruição
  rationale: O hifil de חרם é linguagem técnica para colocar pessoas ou coisas sob ḥerem, destinando-as irrevogavelmente à destruição; a formulação preserva esse valor além da simples ideia genérica de destruir.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: conforme ... havia ordenado
  rationale: Marca conformidade com uma ordem anterior; o mais-que-perfeito deixa clara a anterioridade da ordem de Moisés em relação à ação de Josué.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Neste título honorífico e pactual de Moisés, “servo” comunica sua função e posição sem introduzir conotações inadequadas de escravidão.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução da linguagem de חרם no contexto da conquista
  choice: os consagrou à destruição
  alternative: destruiu-os completamente; colocou-os sob o anátema
  rationale: O hebraico emprega o termo técnico ḥerem, e não apenas um verbo genérico para destruir. A escolha preserva sua força cultual e pactual, enquanto a nota registra uma alternativa mais explícita.
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; o SENHOR
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Ao fio da espada” mantém o idioma bíblico concreto sem soar excessivamente arcaico; “consagrou à destruição” preserva a tensão teológica do termo técnico hebraico.
