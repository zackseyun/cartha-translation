base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: pt
  text: Então Josué e todo o povo de guerra[a] que estava com ele vieram contra eles repentinamente, junto às águas de Merom, e lançaram-se sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo o exército”; tradicionalmente, “todos os homens de guerra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: chegaram
  rationale: O qal narrativo de בוא pode significar “vir”, “ir” ou “chegar”, conforme o ponto de vista. “Chegaram” expressa naturalmente o movimento de Josué e de suas tropas até a posição inimiga.
- source_word: עַם הַמִּלְחָמָה
  choice: todo o povo de guerra
  rationale: Mantém o substantivo coletivo עַם e a expressão militar do hebraico sem reduzi-la necessariamente a “homens”. Embora menos comum que “exército”, é clara no contexto e preserva a forma da expressão original.
- source_word: עִמּוֹ
  choice: que estava com ele
  rationale: Expressa de modo natural o acompanhamento indicado pela preposição com sufixo pronominal.
- source_word: עֲלֵיהֶם
  choice: contra eles
  rationale: Com um verbo de movimento em contexto militar, עַל indica movimento hostil dirigido contra o inimigo.
- source_word: עַל מֵי מֵרוֹם
  choice: junto às águas de Merom
  rationale: A expressão indica localização nas proximidades do corpo de água chamado Merom. “Junto às” é idiomático e não sugere que as tropas estivessem sobre a água.
- source_word: פִּתְאֹם
  choice: de surpresa
  rationale: O advérbio pode significar “de repente” ou “inesperadamente”. Em uma ação militar, “de surpresa” comunica tanto a rapidez quanto o caráter inesperado do ataque.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: se lançaram sobre eles
  rationale: נפל com ב é uma expressão idiomática de ataque. “Se lançaram sobre eles” conserva a imagem vigorosa do hebraico e evita que “caíram sobre eles” seja entendido como queda física acidental.
- source_word: וְ
  choice: Então
  rationale: O waw inicial dá continuidade à sequência narrativa. “Então” reproduz essa progressão com fluidez em português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A construção conserva o caráter coletivo de עַם הַמִּלְחָמָה e a vivacidade do ataque, sem acrescentar especificidade masculina ausente do substantivo hebraico.
