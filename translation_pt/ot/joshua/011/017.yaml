    issue: O sujeito “Josué” foi explicitado.
    rationale: Embora seja recuperável do contexto mais amplo, o texto hebraico traz somente um sujeito implícito (“ele”). Em uma tradução de equivalência ótima, a explicitação não é necessária e reduz a fidelidade formal do versículo isolado.
  - severity: medium
    issue: “Dessas terras” substitui “deles” em “todos os reis deles”.
    rationale: A expressão interpreta o referente do sufixo plural e acrescenta “terras”, palavra ausente no hebraico. “Todos os seus reis” preserva a referência sem especificá-la indevidamente.
  - severity: medium
    issue: “Derrotou-os” para וַיַּכֵּם.
    rationale: O verbo נכה descreve um golpe/ataque; “derrotou-os” generaliza o ato militar e perde a progressão verbal “capturou, golpeou, matou”.
