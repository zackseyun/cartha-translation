  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: pt
  text: desde o monte Halaque[a], que se eleva em direção a Seir, até Baal-Gade, no vale do Líbano[b], abaixo do monte Hermom. Ele capturou todos os seus reis, golpeou-os e os matou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o monte liso”. O hebraico pode ser entendido como uma descrição, mas aqui provavelmente funciona como o nome do lugar, “monte Halaque”.
    reason: lexical_alternative
  - marker: b
    text: Ou “na planície do Líbano”. O termo hebraico pode indicar um vale amplo ou uma planície.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: monte Halaque
  rationale: No resumo geográfico, a expressão funciona provavelmente como nome próprio. A transliteração portuguesa preserva essa leitura, enquanto a possível interpretação descritiva é registrada em nota.
- source_word: הָעֹלֶה
  choice: que se eleva
  rationale: Expressa de modo natural o sentido topográfico do particípio de עלה, sem reduzi-lo à ideia de deslocamento pessoal.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: וְעַד
  choice: até
  rationale: Marca com clareza e concisão o limite da extensão territorial.
- source_word: בַּעַל גָּד
  choice: Baal-Gade
  rationale: O nome geográfico é transliterado, e não traduzido; a forma é natural e reconhecível em português bíblico.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: no vale do Líbano
  rationale: בִּקְעָה pode designar um vale amplo ou uma planície; 'vale' é natural no contexto topográfico, e a alternativa é preservada em nota.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: abaixo do monte Hermom
  rationale: Comunica a posição geográfica inferior em relação ao monte, de forma concisa e sem sugerir literalmente estar debaixo dele.
- source_word: וְאֵת כָּל מַלְכֵיהֶם
  choice: Josué capturou todos os reis dessas terras
  rationale: O sujeito implícito é explicitado para clareza em um versículo isolado. 'Dessas terras' expressa o referente territorial do sufixo plural sem dar a entender que os montes ou lugares, como tais, possuem reis.
- source_word: לָכַד
  choice: capturou
  rationale: É a escolha natural para a apreensão de pessoas em contexto militar.
- source_word: וַיַּכֵּם
  choice: derrotou-os
  rationale: נכה possui amplitude semântica e, neste contexto militar, indica que Josué os abateu ou venceu. 'Derrotou-os' evita antecipar a morte explicitada pelo verbo seguinte.
- source_word: וַיְמִיתֵם
  choice: os matou
  rationale: O hifil de מות declara explicitamente que ele lhes causou a morte. A formulação é direta, atual e distinta da ação anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formas geográficas amplamente reconhecíveis. A coordenação verbal foi mantida vigorosa e sem arcaísmos. O nome do sujeito foi explicitado apenas para tornar inteligível o versículo apresentado isoladamente.
