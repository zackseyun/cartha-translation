  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: pt
  text: Pois foi Yahweh quem tornou obstinado o coração deles, para que enfrentassem Israel na guerra[a], a fim de que ele os consagrasse à destruição[b], sem que houvesse para eles súplica por misericórdia[c]; antes, para que os destruísse, conforme Yahweh havia ordenado a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fortalecesse o coração deles”. Aqui, o sentido é torná-los resolutos em sua oposição, isto é, obstinados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os destinasse à destruição” ou “os colocasse sob a proibição”. O verbo hebraico é um termo técnico para dedicar irrevogavelmente alguém ou algo à destruição sob juízo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sem que recebessem misericórdia”. A expressão hebraica é concisa e pode indicar tanto a ausência de uma súplica por favor quanto a ausência de misericórdia concedida.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: vinha de Yahweh
  rationale: A expressão indica fonte ou origem. A formulação mantém a atribuição direta da ação a Yahweh.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: tornar obstinado o coração deles
  rationale: Embora חזק tenha o sentido básico de fortalecer, neste contexto descreve firmeza resoluta na oposição. 'Tornar obstinado' comunica essa força idiomática sem apagar a alternativa lexical, registrada em nota.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: para que enfrentassem Israel na guerra
  rationale: A construção expressa um encontro hostil em combate e fica natural em português atual.
- source_word: לְמַעַן הַחֲרִימָם
  choice: a fim de que ele os consagrasse à destruição
  rationale: 'Preserva o valor técnico de חרם: destinar irrevogavelmente ao juízo e à destruição, em vez de reduzi-lo ao simples ato de destruir.'
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: sem que houvesse para eles súplica por misericórdia
  rationale: תְּחִנָּה pode designar súplica por favor ou misericórdia. A redação conserva a construção impessoal e evita definir quem faria a súplica.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: antes, para que os destruísse
  rationale: שמד denota destruição completa; 'destruísse' é forte, claro e digno em português.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: conforme Yahweh havia ordenado a Moisés
  rationale: A forma verbal em português situa naturalmente a ordem antes dos acontecimentos narrados.
theological_decisions:
- issue: Agência divina na obstinação dos reis cananeus
  choice: Manter explicitamente que a obstinação vinha de Yahweh
  alternative: Yahweh apenas permitiu que eles se obstinassem
  rationale: O hebraico atribui diretamente a Yahweh a origem dessa disposição. A tradução preserva a tensão entre a ação divina e a oposição humana, sem convertê-la em mera permissão.
- issue: Sentido judicial e cultual de חרם
  choice: consagrasse à destruição
  alternative: destruísse completamente
  rationale: A opção escolhida conserva a ideia técnica de destinar algo irrevogavelmente à destruição sob juízo, enquanto a alternativa comunica apenas o resultado.
- issue: Ambiguidade de תְּחִנָּה
  choice: súplica por misericórdia
  alternative: misericórdia
  rationale: O substantivo pode referir-se à súplica por favor, e a construção compacta também pode ser entendida como ausência de misericórdia concedida. O texto principal mantém o valor nominal; a nota registra a outra leitura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Yahweh' translitera o nome divino conforme a camada inglesa fornecida. A sintaxe conserva a sequência de finalidade do hebraico sem soar excessivamente literal.
