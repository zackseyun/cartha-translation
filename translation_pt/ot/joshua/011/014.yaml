  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: pt
  text: E todo o despojo dessas cidades, junto com os animais domésticos, os filhos de Israel tomaram para si; mas mataram toda a população ao fio da espada[a], até destruí-la. Não deixaram ninguém com vida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “à boca da espada”, expressão hebraica que significa “ao fio da espada”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não deixaram nenhuma respiração”; isto é, não deixaram ninguém vivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  choice: despojo
  rationale: Designa bens tomados na guerra; “despojo” conserva o contexto militar e é corrente no registro bíblico moderno.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: dessas cidades
  rationale: O demonstrativo retoma as cidades mencionadas no contexto anterior; em português, “dessas” produz uma referência retrospectiva natural.
- source_word: הַבְּהֵמָה
  choice: os animais domésticos
  rationale: Neste contexto, refere-se aos animais mantidos como propriedade; a expressão é mais precisa que “animais” e mais abrangente que “gado”.
- source_word: בָּזְזוּ לָהֶם
  choice: tomaram para si
  rationale: Comunica tanto a apropriação do despojo como o benefício reflexivo expresso por לָהֶם, sem a rigidez de “saquearam para si”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar hebraica, que permanece clara e digna em português.
- source_word: רַק
  choice: mas
  rationale: Aqui marca o forte contraste entre conservar o despojo e matar a população; “mas” é natural em português.
- source_word: כָּל הָאָדָם
  choice: toda a população
  rationale: אָדָם designa coletivamente os habitantes humanos em contraste com os animais; “toda a população” inclui adequadamente homens, mulheres e crianças sem resolver o referente de modo restritivo.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: mataram ... ao fio da espada
  rationale: Reproduz de modo idiomático a imagem hebraica da “boca da espada” e explicita o resultado mortal exigido pelo contexto.
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: até destruí-la
  rationale: O hifil de שׁמד expressa destruição completa; o pronome retoma naturalmente “toda a população”.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: Não deixaram ninguém com vida
  rationale: Expressa com naturalidade o sentido idiomático de não deixar sobrevivente, enquanto a nota preserva a imagem concreta da respiração.
theological_decisions:
- issue: Alcance de כָּל הָאָדָם
  choice: toda a população
  alternative: todo ser humano / todos os habitantes
  rationale: O substantivo coletivo אָדָם contrasta a população humana com os animais domésticos. A tradução evita limitar a referência a homens adultos e não suaviza a abrangência do relato.
- issue: Expressão בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A formulação literal preserva a designação familiar e pactual do hebraico sem introduzir interpretação denominacional.
- issue: Sentido de שׁמד no relato da conquista
  choice: destruí-la
  alternative: exterminá-la
  rationale: “Destruir” traduz diretamente o verbo sem importar nesta oração a terminologia técnica de חֵרֶם, que não aparece nela.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem da frase foi ajustada para soar natural, preservando o contraste entre o despojo conservado e a população morta. Todos os marcadores de nota aparecem no texto principal.
