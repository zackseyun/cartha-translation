  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: pt
  text: 'E Yahweh disse a Josué: “Não tenha medo deles, pois amanhã, por volta desta hora[a], entregarei todos eles, abatidos, diante de Israel[b]. Você cortará os tendões dos cavalos deles e queimará no fogo os carros de guerra deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “amanhã a esta hora”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “entrego todos eles, abatidos, diante de Israel”, isto é, entrego-os para que Israel os abata.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em conformidade com a prática do projeto.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: Não tenha medo deles
  rationale: Expressa de modo direto e natural em português a proibição e a causa do temor indicada por מִפְּנֵיהֶם.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: amanhã, por volta desta hora
  rationale: A preposição comparativa כְּ pode indicar aproximação; a formulação preserva essa nuance temporal sem perder naturalidade.
- source_word: אָנֹכִי נֹתֵן
  choice: entregarei
  rationale: No contexto de promessa sobre um acontecimento do dia seguinte, o futuro português comunica naturalmente o valor iminente do particípio hebraico; 'entregar' explicita o sentido contextual de נתן.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: todos eles mortos diante de Israel
  rationale: Mantém a imagem dos inimigos como mortos em batalha e preserva a expressão espacial לִפְנֵי, deixando a nota esclarecer o sentido de entrega para serem abatidos.
- source_word: תְּעַקֵּר
  choice: cortará os tendões
  rationale: Descreve com precisão e clareza atual o ato de incapacitar os cavalos pela secção dos tendões das pernas.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: seus carros de guerra
  rationale: Evita a possível leitura moderna de automóveis e identifica claramente os veículos militares antigos.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: queimará no fogo
  rationale: Conserva a menção explícita ao fogo presente no hebraico, apesar da leve redundância em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Agência divina na derrota dos reis
  choice: entregarei todos eles mortos diante de Israel
  alternative: farei que todos caiam mortos diante de Israel
  rationale: Mantém a construção de נתן e sua tensão entre a promessa soberana de Yahweh e a ação militar de Israel, sem explicar além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Usa 'você' na fala direta por naturalidade ampla; 'carros de guerra' esclarece o referente antigo. As duas notas registram a aproximação temporal possível e a formulação mais literal da promessa.
