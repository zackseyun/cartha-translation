  naturalness: O texto é claro e de registro apropriado. A repetição do possessivo em “os seus carros de guerra” pode gerar uma referência menos imediata; “os carros de guerra deles” é mais inequívoco e natural no contexto.
  terminology: “Yahweh”, “Josué”, “carros de guerra” e “cortar os tendões” são escolhas adequadas. “Abatidos” é preferível a “mortos” para o vocabulário de combate do hebraico.
