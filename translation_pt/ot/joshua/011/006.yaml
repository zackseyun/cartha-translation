  to: 'E Yahweh disse a Josué: “Não tenha medo deles, pois amanhã, por volta desta hora[a], entregarei todos eles, abatidos, diante de Israel[b]. Você cortará os tendões dos cavalos deles e queimará no fogo os carros de guerra deles.”'
