  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: pt
  text: 'Assim, Josué tomou toda esta terra: a região montanhosa, todo o Neguebe, toda a terra de Gósen[a], a Sefelá[b], a Arabá[c], a região montanhosa de Israel e sua Sefelá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A terra de Gósen mencionada aqui era uma região de Canaã, não necessariamente a Gósen do Egito.
    reason: cultural_note
  - marker: b
    text: Ou “a região de colinas baixas”. A Sefelá ficava entre a região montanhosa central e a planície costeira. O mesmo termo aparece novamente no fim do versículo.
    reason: lexical_alternative
  - marker: c
    text: A Arabá é uma designação geográfica regional; conforme o contexto, o termo também pode ser traduzido como “vale do Jordão” ou “planície desértica”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Traduz diretamente o verbo לקח e deixa que o contexto militar comunique a ideia de conquista, sem explicitar além do hebraico.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: toda esta terra
  rationale: Preserva tanto a amplitude de אֶרֶץ quanto a força demonstrativa de הַזֹּאת.
- source_word: הָהָר
  choice: a região montanhosa
  rationale: Neste contexto geográfico, הָהָר designa uma região de terras altas, não apenas um monte isolado.
- source_word: הַנֶּגֶב
  choice: o Neguebe
  rationale: Mantém o nome consagrado da região meridional, em vez de reduzi-lo ao sentido genérico de “sul”.
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: a terra de Gósen
  rationale: Reproduz de modo natural a construção hebraica sem identificar no texto principal esta Gósen com a região egípcia.
- source_word: הַשְּׁפֵלָה
  choice: a Sefelá
  rationale: Trata o termo como designação geográfica específica e evita a possível impressão de uma planície inteiramente plana; uma nota explica seu relevo.
- source_word: הָעֲרָבָה
  choice: a Arabá
  rationale: Preserva a designação regional hebraica, cuja extensão não deve ser limitada automaticamente ao vale do Jordão.
- source_word: הַר יִשְׂרָאֵל
  choice: a região montanhosa de Israel
  rationale: Expressa o sentido regional de הַר e mantém a ligação explícita com Israel.
- source_word: וּשְׁפֵלָתוֹ
  choice: e sua Sefelá
  rationale: Preserva o sufixo masculino singular, que remete mais naturalmente à região montanhosa de Israel, e mantém a repetição do termo topográfico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Foram preservados os nomes geográficos Neguebe, Sefelá e Arabá, acompanhando os termos menos transparentes com notas explicativas. A ordem da enumeração e a relação pronominal final seguem de perto o hebraico.
