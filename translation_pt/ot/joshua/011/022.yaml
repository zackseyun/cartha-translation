  text: לֹֽא נוֹתַ֣ר עֲנָקִ֔ים בְּ/אֶ֖רֶץ בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֗ק בְּ/עַזָּ֛ה בְּ/גַ֥ת וּ/בְ/אַשְׁדּ֖וֹד נִשְׁאָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: pt
  text: Não restou nenhum anaquim na terra dos filhos de Israel; apenas em Gaza, Gate e Asdode restaram alguns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹתַר
  choice: restou
  rationale: 'O nifal expressa o resultado das campanhas: nenhum membro desse povo ficou na região. “Restou” é natural em português e preserva o sentido resultativo.'
- source_word: עֲנָקִים
  choice: anaquim
  rationale: Mantém o etnônimo hebraico, usando a forma tradicional em português; no singular coletivo após “nenhum”, concorda naturalmente com o verbo.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: na terra dos filhos de Israel
  rationale: Reproduz de modo claro e formalmente próximo a construção hebraica, sem reduzi-la simplesmente a “israelitas”.
- source_word: רַק
  choice: apenas
  rationale: Marca com clareza a limitação e o contraste entre a terra de Israel e as três cidades mencionadas.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: em Gaza, Gate e Asdode
  rationale: Emprega as formas portuguesas correntes dos topônimos e, de modo idiomático, não repete a preposição diante de cada nome.
- source_word: נִשְׁאָרוּ
  choice: restaram alguns
  rationale: O verbo plural retoma os anaquins como sujeito implícito. “Alguns” explicita naturalmente em português que membros desse povo permaneceram nessas cidades, sem introduzir uma ideia alheia ao contexto.
