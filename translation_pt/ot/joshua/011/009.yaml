base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: pt
  text: 'Josué tratou-os exatamente como Yahweh lhe havia dito: cortou os tendões das pernas dos cavalos deles[a] e queimou no fogo os carros de guerra deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “incapacitou os cavalos deles”; o hebraico se refere mais especificamente ao corte dos tendões das pernas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: Josué fez com eles
  rationale: Preserva a construção hebraica de agir em relação a eles no contexto militar, sem sugerir que Josué lhes fez um benefício.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: exatamente como Yahweh lhe havia dito
  rationale: “Exatamente como” expressa a força comparativa de כַּאֲשֶׁר, e “havia dito” mantém o sentido direto de אָמַר e a sequência narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: סוּסֵיהֶם עִקֵּר
  choice: cortou os tendões das pernas dos cavalos deles
  rationale: Expressa de modo claro e atual a ação específica de inutilizar os cavalos mediante o corte dos tendões, evitando um termo técnico pouco conhecido.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: os carros de guerra deles
  rationale: “Carros de guerra” comunica com clareza ao leitor moderno o tipo de veículo militar indicado pelo substantivo hebraico.
- source_word: שָׂרַף בָּאֵשׁ
  choice: queimou no fogo
  rationale: Conserva a menção explícita ao fogo presente no hebraico, ainda que a expressão seja enfática em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em forma transliterada, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação evita o tecnicismo “jarretes”, explica no próprio texto a ação indicada pelo verbo hebraico e mantém a repetição enfática de “fogo”.
