  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: pt
  text: 'Quiriate-Baal (isto é, Quiriate-Jearim) e Rabá: duas cidades e seus povoados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas aldeias”. O termo hebraico se refere a povoados dependentes ligados às cidades mencionadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: Quiriate-Baal
  rationale: Nome próprio de lugar, transliterado segundo uma forma natural em português, em vez de traduzido como “Cidade de Baal”.
- source_word: הִיא
  choice: isto é
  rationale: O pronome tem aqui função explicativa, identificando Quiriate-Baal com Quiriate-Jearim.
- source_word: קִרְיַת יְעָרִים
  choice: Quiriate-Jearim
  rationale: Nome próprio alternativo da mesma cidade; foi transliterado, sem traduzir sua etimologia.
- source_word: הָרַבָּה
  choice: Rabá
  rationale: Tratado como nome próprio de lugar; o artigo hebraico não foi reproduzido separadamente em português.
- source_word: עָרִים שְׁתַּיִם
  choice: duas cidades
  rationale: Reproduz de modo direto a expressão numérica que resume as localidades mencionadas.
- source_word: חַצְרֵיהֶן
  choice: seus povoados
  rationale: No contexto das listas territoriais, o termo indica núcleos menores ou assentamentos dependentes ligados às cidades citadas; “povoados” é claro e atual.
