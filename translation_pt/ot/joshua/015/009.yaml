base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: pt
  text: Depois, a fronteira fazia uma curva[a] do topo do monte até a nascente das águas de Neftoa; seguia até as cidades do monte Efrom e fazia uma curva até Baalá (isto é, Quiriate-Jearim).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era demarcada” ou “mudava de direção”. Neste contexto de fronteiras, o verbo hebraico pode indicar o traçado da linha divisória ou uma mudança em sua direção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: fazia uma curva
  rationale: No contexto de delimitação territorial, o verbo descreve o traçado da fronteira ou sua mudança de direção. A expressão é natural em português e preserva a imagem topográfica; a nota registra alternativas possíveis.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: Termo claro e corrente para a linha que delimita o território atribuído.
- source_word: מֵרֹאשׁ הָהָר
  choice: desde o topo do monte
  rationale: Reproduz diretamente a expressão geográfica hebraica sem o literalismo pouco natural de “cabeça do monte”.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: a nascente das águas de Neftoa
  rationale: Preserva a cadeia construta hebraica de modo compreensível. “Nascente” é natural para מַעְיַן, e Neftoa é transliterado como topônimo.
- source_word: וְיָצָא
  choice: dali seguia
  rationale: Em fórmulas de fronteira, o verbo indica que a linha prossegue para outro ponto. “Seguia” comunica essa função com naturalidade; “dali” explicita apenas a continuidade espacial já presente no contexto.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: as cidades do monte Efrom
  rationale: Mantém de perto a construção hebraica, sem ampliar interpretativamente “monte” para “região montanhosa”.
- source_word: בַּעֲלָה
  choice: Baalá
  rationale: Transliteração portuguesa do topônimo, com acento para indicar a tonicidade.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: isto é, Quiriate-Jearim
  rationale: Expressa de forma idiomática a identificação de Baalá com o segundo topônimo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de topônimos legíveis para o público brasileiro e amplamente reconhecíveis em português. O tempo imperfeito apresenta o percurso descritivo da fronteira de modo natural. A repetição de “fazia uma curva” preserva a repetição do verbo hebraico.
