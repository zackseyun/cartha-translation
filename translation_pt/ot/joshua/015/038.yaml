lexical_decisions:
- source_word: דִלְעָן
  choice: Dileã
  rationale: Nome próprio de uma localidade de Judá; foi transliterado segundo a forma tradicional e natural em português, com base na vocalização massorética.
- source_word: הַמִּצְפֶּה
  choice: Mispá
  rationale: Embora a forma hebraica contenha o artigo definido e derive de um substantivo que significa «torre de vigia» ou «posto de observação», aqui funciona como nome de lugar numa lista de cidades; por isso, é transliterada, e o artigo é entendido como parte do topônimo.
- source_word: יָקְתְאֵל
  choice: Jocteel
  rationale: Nome próprio de uma localidade; foi transliterado pela forma tradicional em português, preservando de modo reconhecível a forma hebraica.
