  text: וְ/עָלָ֤ה הַ/גְּבוּל֙ בֵּ֣ית חָגְלָ֔ה וְ/עָבַ֕ר מִ/צְּפ֖וֹן לְ/בֵ֣ית הָעֲרָבָ֑ה וְ/עָלָ֣ה הַ/גְּב֔וּל אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: pt
  text: Então a fronteira subia até Bete-Hogla e passava ao norte de Bete-Arabá; depois, a fronteira subia até a pedra de Boã, filho de Rúben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: subia
  rationale: Em descrições de fronteiras, עלה indica que a linha prosseguia para cima, muitas vezes em relação ao relevo. “Subia” é natural em português e preserva esse aspecto topográfico.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: גְּבוּל designa aqui a linha divisória do território. “Fronteira” comunica claramente esse sentido geográfico.
- source_word: בֵּית חָגְלָה
  choice: Bete-Hogla
  rationale: O topônimo é transliterado em forma adaptada à leitura portuguesa, sem traduzir seus elementos.
- source_word: וְעָבַר
  choice: passava
  rationale: Neste itinerário de limites, o verbo descreve a continuação da linha junto a um ponto de referência. “Passava” é conciso e combina naturalmente com “ao norte de”.
- source_word: מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: ao norte de Bete-Arabá
  rationale: A construção indica a posição da fronteira em relação à localidade. “Ao norte de” expressa de modo idiomático o valor da fórmula hebraica.
- source_word: אֶבֶן בֹּהַן
  choice: a pedra de Boã
  rationale: A expressão mantém a relação construta do hebraico e identifica o marco geográfico pelo nome de Boã.
- source_word: בֶּן רְאוּבֵן
  choice: filho de Rúben
  rationale: A tradução conserva a formulação explícita do hebraico, sem substituí-la pela interpretação possível “rubenita”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para uma descrição geográfica. Os topônimos foram transliterados em formas legíveis em português. O aspecto verbal foi vertido no imperfeito (“subia”, “passava”) para apresentar o percurso contínuo da linha de fronteira; “depois” explicita apenas a progressão narrativa do segundo וְעָלָה.
