base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: pt
  text: 'e Gederote, Bete-Dagom[a], Naamá e Maquedá: dezesseis cidades com os seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bete-Dagom significa literalmente “casa de Dagom”, mas aqui funciona como nome de lugar e, por isso, foi transliterado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: e Gederote
  rationale: Nome geográfico com conjunção prefixada; emprega-se a transliteração tradicional adaptada à ortografia portuguesa.
- source_word: בֵּית דָּגוֹן
  choice: Bete-Dagom
  rationale: Topônimo composto por בֵּית ('casa de') e דָּגוֹן ('Dagom'); como nome de lugar, é transliterado em forma corrente em português, com hífen para indicar o composto.
- source_word: וְ/נַעֲמָה
  choice: Naamá
  rationale: Nome geográfico transliterado de modo natural em português, preservando a tonicidade final.
- source_word: וּ/מַקֵּדָה
  choice: e Maquedá
  rationale: Nome geográfico com conjunção prefixada, transliterado segundo convenções ortográficas portuguesas e com tonicidade final indicada.
- source_word: עָרִים
  choice: cidades
  rationale: Em listas territoriais, עִיר designa centros populacionais; 'cidades' é a tradução convencional e adequada ao contexto.
- source_word: שֵׁשׁ עֶשְׂרֵה
  choice: dezesseis
  rationale: Número cardinal que quantifica diretamente as cidades, sem necessidade de explicitação adicional.
- source_word: וְ/חַצְרֵיהֶן
  choice: com os seus povoados
  rationale: חָצֵר refere-se aqui a núcleos rurais dependentes das cidades enumeradas. 'Povoados' expressa essa relação de modo claro e natural; 'com' representa idiomaticamente a associação indicada pela conjunção.
