lexical_decisions:
- source_word: דַנָּה
  choice: Daná
  rationale: Nome de lugar transliterado segundo formas naturais em português, com acento para indicar a tonicidade final.
- source_word: קִרְיַת סַנָּה
  choice: Quiriate-Saná
  rationale: Nome composto transliterado, preservando sua forma toponímica em vez de traduzir קִרְיַת como “cidade de”.
- source_word: הִיא
  choice: isto é
  rationale: Neste contexto, o pronome introduz a identificação de Quiriate-Saná com Debir; “isto é” expressa essa equivalência de modo claro e idiomático.
- source_word: דְבִר
  choice: Debir
  rationale: Nome próprio de lugar transliterado; identifica o outro nome de Quiriate-Saná.
- source_word: וְ
  choice: e
  rationale: A conjunção coordena os nomes na lista. Em português, a primeira ocorrência pode ser representada pela pontuação da enumeração, enquanto a ligação com o contexto da lista permanece implícita no fragmento apresentado.
