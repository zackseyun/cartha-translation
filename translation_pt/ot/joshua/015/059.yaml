  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: pt
  text: 'e Maarate, Bete-Anote e Eltecom: seis cidades e suas aldeias.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com seus povoados” ou “com seus assentamentos”. O termo hebraico se refere a pequenos núcleos rurais dependentes associados às cidades mencionadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲרָת
  choice: e Maarate
  rationale: Topônimo transliterado em forma natural para leitores de português; a conjunção prefixada וּ é traduzida por “e”.
- source_word: וּ/בֵית עֲנוֹת
  choice: Bete-Anote
  rationale: Nome composto transliterado, sem traduzir בֵית como “casa”; o hífen sinaliza a unidade do topônimo.
- source_word: וְ/אֶלְתְּקֹן
  choice: e Eltecom
  rationale: Topônimo transliterado segundo convenções portuguesas, com a consoante final representada por “m” na forma aportuguesada.
- source_word: עָרִים שֵׁשׁ
  choice: seis cidades
  rationale: Tradução direta do substantivo e do numeral; “cidades” preserva o uso convencional nas listas territoriais.
- source_word: וְ/חַצְרֵי/הֶן
  choice: com os povoados ao seu redor
  rationale: חֲצֵרִים designa aqui núcleos rurais dependentes ligados às cidades; “povoados ao seu redor” comunica essa relação sem recorrer ao sentido literal inadequado de “pátios”.
