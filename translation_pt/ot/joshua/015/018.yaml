  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/הּ וַ/תְּסִיתֵ֨/הוּ֙ לִ/שְׁא֤וֹל מֵֽ/אֵת אָבִ֨י/הָ֙ שָׂדֶ֔ה וַ/תִּצְנַ֖ח מֵ/עַ֣ל הַ/חֲמ֑וֹר וַ/יֹּֽאמֶר לָ֥/הּ כָּלֵ֖ב מַה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: pt
  text: 'Quando ela chegou, insistiu com ele[a] para que pedisse ao pai dela um campo. Então ela desceu do jumento[b], e Calebe lhe perguntou: “O que você quer?”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o persuadiu” ou, em sentido mais negativo, “o incitou”.
    reason: lexical_alternative
  - marker: b
    text: Ou “apeou do jumento”; o verbo hebraico pode sugerir uma descida súbita.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “O que há com você?”, expressão que pode significar “O que você quer?” ou “O que está incomodando você?”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: Quando ela chegou
  rationale: A construção temporal com בְּ e o infinitivo construto indica o momento da chegada de Acsa, sem especificar no hebraico o destino.
- source_word: וַתְּסִיתֵהוּ
  choice: insistiu com ele
  rationale: סות pode significar instigar, persuadir ou incitar. Neste contexto de um pedido familiar, “insistiu com ele” comunica a iniciativa ativa de Acsa sem impor uma conotação necessariamente negativa.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: para que pedisse ao pai dela um campo
  rationale: A formulação portuguesa expressa naturalmente a pessoa a quem se faz o pedido e mantém שָׂדֶה como “um campo”, sem ampliar o termo para uma propriedade inteira.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: ela desceu do jumento
  rationale: צנח descreve a descida do animal e pode sugerir um movimento súbito; “desceu” é claro e natural, enquanto a nota preserva essa possível vivacidade.
- source_word: מַה לָּךְ
  choice: O que você quer?
  rationale: O idioma hebraico é literalmente “O que há com você?”; no contexto, Calebe abre espaço para que Acsa apresente seu pedido. A tradução escolhida comunica essa função em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, natural e digno, com boa legibilidade brasileira. “Você” torna a pergunta direta e corrente; “jumento” preserva o referente concreto. As notas mantêm as nuances lexicais e idiomáticas genuínas do hebraico.
