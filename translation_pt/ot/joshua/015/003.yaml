base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: pt
  text: Depois, a fronteira seguiu para o sul, até a subida de Acrabim[a], passou por Zin, subiu do sul até Cades-Barneia, passou por Hesrom, subiu até Adar e virou em direção a Carca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Acrabim provavelmente significa “escorpiões”; o nome hebraico foi transliterado porque aqui funciona como topônimo.
    reason: lexical_alternative
  - marker: b
    text: Ou “Carcaá”; a forma exata do nome desse lugar é incerta.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא אֶל מִנֶּגֶב
  choice: Depois, a fronteira seguiu para o sul
  rationale: O verbo descreve o avanço da linha de fronteira. Explicitar “a fronteira” torna o referente natural em português, enquanto “seguiu” preserva a imagem de movimento; “depois” expressa a sequência do waw.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: até a subida de Acrabim
  rationale: מַעֲלֵה designa uma subida ou passagem ascendente. Acrabim é mantido como topônimo transliterado, e seu sentido lexical é registrado em nota.
- source_word: וְעָבַר צִנָה
  choice: passou por Zim
  rationale: עבר, em descrições de limites, indica que a linha passa por ou junto de um lugar. A terminação direcional de צִנָה aponta o movimento para Zim, expresso de modo idiomático pela construção portuguesa.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: subiu do sul até Cades-Barneia
  rationale: A tradução conserva o valor de origem de מִן (“do sul”) e o destino marcado por לְ, sem reinterpretar a frase como simples localização ao sul da cidade.
- source_word: וְעָבַר חֶצְרוֹן
  choice: passou por Hesrom
  rationale: A formulação natural em português representa o avanço da fronteira por esse topônimo.
- source_word: וְעָלָה אַדָּרָה
  choice: subiu até Adar
  rationale: עלה mantém o movimento ascendente, e a terminação direcional do topônimo é representada por “até”.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: e virou em direção a Carca
  rationale: נסב assinala uma mudança de direção da linha divisória. “Em direção a” preserva a orientação indicada pela terminação direcional sem afirmar além do texto que a fronteira necessariamente alcançava o local.
