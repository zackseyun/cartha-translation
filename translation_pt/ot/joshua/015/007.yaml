  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: pt
  text: A fronteira subia do vale de Acor até Debir e, voltando-se para o norte, seguia em direção a Gilgal[a], que fica em frente à subida de Adumim, situada ao sul do uádi[b]. Depois, a fronteira passava até as águas de En-Semes, e seu término ficava em En-Rogel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até Gilgal”; o hebraico pode indicar tanto a orientação para o lugar quanto o movimento até ele nesta descrição da fronteira.
    reason: lexical_alternative
  - marker: b
    text: “Uádi” é uma ravina ou leito de curso de água que costuma permanecer seco e só leva água em certas épocas; neste tipo de descrição geográfica, o hebraico נחל frequentemente tem esse sentido.
    reason: cultural_note
  - marker: c
    text: Ou “suas extremidades ficavam em En-Rogel”. O hebraico emprega literalmente uma forma plural, “suas saídas”, para indicar onde a fronteira terminava.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל דְּבִרָה מֵעֵמֶק עָכוֹר
  choice: A fronteira subia do vale de Acor até Debir
  rationale: Em descrições de fronteiras, עלה indica avanço em subida ou para terreno mais elevado; o ה direcional em דברה indica movimento até ou em direção a Debir. A ordem foi ajustada para soar natural em português sem perder a relação topográfica.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: voltando-se para o norte
  rationale: פנה com indicação direcional descreve a mudança de orientação da linha fronteiriça. A forma participial hebraica é representada com uma construção corrente em português.
- source_word: אֶל הַגִּלְגָּל
  choice: em direção a Gilgal
  rationale: אל pode indicar tanto orientação quanto movimento até o lugar. No contexto, 'em direção a' preserva a possibilidade de a linha apenas se orientar para Gilgal; a alternativa é registrada em nota.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: que fica diante da subida de Adumim
  rationale: נכח expressa posição diante de ou em frente a. מעלה designa uma subida topográfica, aqui associada ao nome Adumim.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: situada ao sul do uádi
  rationale: נגב tem sentido direcional, 'ao sul'. נחל, neste cenário, provavelmente designa uma ravina ou leito de curso de água sazonal; 'uádi' mantém essa precisão geográfica.
- source_word: וְעָבַר הַגְּבוּל
  choice: Depois, a fronteira passava
  rationale: עבר nas fórmulas de delimitação pode indicar que a linha segue ou passa para o ponto seguinte, sem exigir a ideia de atravessar fisicamente algo.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: até as águas de En-Semes
  rationale: מי significa literalmente 'águas de'. O topônimo foi transliterado em forma adequada ao português, sem substituí-lo por uma tradução interpretativa.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: e seu término ficava em En-Rogel
  rationale: תוצאותיו, formalmente plural, designa em descrições de fronteiras a saída, extremidade ou terminação da linha. O singular coletivo 'seu término' é natural em português, enquanto a forma hebraica é indicada em nota.
