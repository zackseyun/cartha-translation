translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Os topônimos seguem formas transliteradas correntes em português. 'Uádi' foi mantido por precisão topográfica e explicado em nota. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
