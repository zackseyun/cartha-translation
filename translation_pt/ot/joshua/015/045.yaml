lexical_decisions:
- source_word: עֶקְרוֹן
  choice: Ecrom
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico, adequada ao uso bíblico moderno.
- source_word: וּבְנֹתֶיהָ
  choice: com suas cidades
  rationale: Embora בנות signifique literalmente “filhas”, em listas territoriais designa localidades dependentes de uma cidade principal. “Cidades” comunica naturalmente esse sentido; a nota preserva o hebraísmo.
- source_word: וַחֲצֵרֶיהָ
  choice: e seus povoados
  rationale: Neste contexto de distribuição territorial, חצרים se refere a assentamentos menores. “Povoados” distingue essas localidades das cidades dependentes mencionadas antes e é claro em português internacional.
