- source_word: וּ/בָ/הָר
  choice: Na região montanhosa
  rationale: A expressão significa literalmente “e na montanha/região montanhosa”. Como o versículo prossegue uma lista de cidades, a conjunção inicial pode ser representada naturalmente pela continuidade da enumeração. “Região montanhosa” designa com clareza as terras altas de Judá.
- source_word: שָׁמִיר
  choice: Samir
  rationale: Nome geográfico transliterado em forma natural para leitores de língua portuguesa.
- source_word: וְ/יַתִּיר
  choice: Jatir
  rationale: Nome geográfico transliterado conforme o valor consonantal do hebraico e adaptado à ortografia portuguesa; a conjunção é expressa pela estrutura da lista.
- source_word: וְ/שׂוֹכֹה
  choice: Socó
  rationale: Nome geográfico transliterado em forma corrente e legível em português; a conjunção hebraica é representada por “e”.
