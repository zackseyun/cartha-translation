- source_word: מָעוֹן
  choice: Maom
  rationale: Topônimo em uma lista de cidades; transliterado segundo a forma tradicional e reconhecível em português, sem traduzir o sentido comum de 'morada'.
- source_word: כַּרְמֶל
  choice: Carmelo
  rationale: Topônimo referente à cidade de Judá; emprega-se a forma consagrada em português, não o sentido lexical comum relacionado a terra fértil ou vinhedo.
- source_word: וָזִיף
  choice: Zife
  rationale: A conjunção ו liga o topônimo זִיף à lista; usa-se a forma portuguesa tradicional 'Zife', com a coordenação expressa naturalmente pela pontuação.
- source_word: וְיוּטָּה
  choice: e Jutá
  rationale: A conjunção ו é traduzida por 'e'; o topônimo יוּטָּה recebe a forma tradicional portuguesa 'Jutá'.
