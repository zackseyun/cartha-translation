lexical_decisions:
- source_word: צִקְלַג
  choice: Ziclague
  rationale: Nome próprio de lugar, transliterado na forma consagrada em português bíblico e ajustado à ortografia portuguesa.
- source_word: מַדְמַנָּה
  choice: Madmana
  rationale: Nome próprio de lugar, transliterado de modo claro e natural em português; a duplicação consonantal do hebraico não precisa ser reproduzida graficamente.
- source_word: סַנְסַנָּה
  choice: Sansana
  rationale: Nome próprio de lugar, transliterado segundo a pronúncia aproximada e a ortografia natural do português; o hê final não é representado por h.
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada liga os nomes da lista; em português, emprega-se antes do último item, enquanto os anteriores são separados por vírgula.
