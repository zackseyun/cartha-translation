base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: pt
  text: 'E Calebe expulsou dali os três filhos de Anaque: Sesai, Aimã e Talmai, descendentes de Anaque.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os três filhos de Anaque” e, no fim do versículo, “os nascidos de Anaque”. As duas expressões genealógicas relacionadas se referem ao mesmo grupo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: expulsou
  rationale: No hifil, com pessoas como objeto, ירשׁ expressa fazer os ocupantes perderem a posse, isto é, desalojá-los ou expulsá-los. “Expulsou” é natural em português e se ajusta ao contexto da conquista.
- source_word: מִשָּׁם
  choice: dali
  rationale: Equivalente locativo direto e idiomático de “de lá” no fluxo narrativo.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: os três filhos de Anaque
  rationale: Preserva a expressão genealógica formal do hebraico, sem reduzi-la ao gentílico “anaquins”.
- source_word: שֵׁשַׁי
  choice: Sesai
  rationale: Transliteração portuguesa clara do nome pessoal hebraico.
- source_word: אֲחִימַן
  choice: Aimã
  rationale: Forma aportuguesada que representa o nome hebraico e tem leitura natural em português.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Transliteração portuguesa transparente do nome pessoal.
- source_word: יְלִידֵי הָעֲנָק
  choice: descendentes de Anaque
  rationale: Comunica o sentido genealógico de “nascidos de Anaque” sem a repetição pouco natural de “filhos de Anaque”; a nota preserva a forma mais literal e a variação entre as duas expressões hebraicas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação inicial com “E” conserva o encadeamento narrativo. “Expulsou dali” mantém a ordem e o sentido do hebraico sem soar excessivamente literal.
