  text: בַּ/מִּדְבָּ֑ר בֵּ֚ית הָעֲרָבָ֔ה מִדִּ֖ין וּ/סְכָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/061.yaml
  text: 'In the wilderness: Beth-arabah[a], Middin[b], and Secacah.'
translation:
  language: pt
  text: 'No deserto[a]: Bete-Arabá[b], Midim e Secacá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na região erma”. O termo hebraico pode indicar uma área desabitada ou pouco habitada, não necessariamente um deserto arenoso.
    reason: lexical_alternative
  - marker: b
    text: Nome de lugar; literalmente, “casa da Arabá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: No deserto
  rationale: A preposição בְּ com o artigo introduz a sub-região geográfica onde ficavam as cidades. מִדְבָּר pode designar uma região erma e pouco habitada; “deserto” é natural em português e se ajusta ao contexto do deserto da Judeia, sem implicar necessariamente um mar de areia.
- source_word: בֵּית הָעֲרָבָה
  choice: Bete-Arabá
  rationale: Nome de lugar transliterado segundo formas usuais em português. O elemento בֵּית significa literalmente “casa de”, e הָעֲרָבָה se refere à Arabá.
- source_word: מִדִּין
  choice: Midim
  rationale: Nome próprio de lugar transliterado com forma legível em português; o mem final é representado naturalmente por “m”.
- source_word: וּסְכָכָה
  choice: e Secacá
  rationale: O וּ inicial é traduzido por “e”; o topônimo é transliterado como “Secacá”, preservando de modo natural sua forma e tonicidade em português.
