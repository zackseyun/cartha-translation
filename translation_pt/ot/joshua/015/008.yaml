source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: pt
  text: Depois, a divisa subia pelo vale de Ben-Hinom até a encosta jebuseia, ao sul[a] — isto é, Jerusalém[b]. Dali, a divisa subia até o topo do monte que fica a oeste[c] do vale de Hinom, na extremidade norte do vale de Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o ombro do jebuseu”. “Encosta” expressa o sentido topográfico de “ombro”; “jebuseia” indica a associação com os jebuseus, sem acrescentar “cidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ela é Jerusalém”. O hebraico identifica explicitamente o local jebuseu com Jerusalém.'
    reason: alternative_reading
  - marker: c
    text: 'Hebraico: “em direção ao mar”, expressão usual para indicar o oeste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: Depois, ... subia / Dali, ... subia
  rationale: O qal perfeito descreve, em sequência, o percurso ascendente da linha divisória. O imperfeito português é natural em uma descrição geográfica contínua; “Depois” e “Dali” explicitam a progressão sem alterar o sentido.
- source_word: הַגְּבוּל
  choice: a divisa
  rationale: No contexto da repartição territorial, o termo designa a linha que delimita o território. “Divisa” é claro e corrente em português para limites geográficos.
- source_word: גֵּי בֶן הִנֹּם
  choice: o vale de Ben-Hinom
  rationale: Mantém o caráter de nome próprio do topônimo, sem transformar “Ben” em uma explicação interpretativa.
- source_word: כֶּתֶף
  choice: a encosta
  rationale: Embora signifique literalmente “ombro”, em uso topográfico indica o flanco ou a encosta de uma elevação.
- source_word: הַיְבוּסִי
  choice: a cidade dos jebuseus
  rationale: O hebraico traz literalmente “o jebuseu”, mas o contexto topográfico e a identificação imediata com Jerusalém apontam para o assentamento jebuseu. A nota preserva a forma mais estrita do original.
- source_word: מִנֶּגֶב
  choice: sul
  rationale: Neste contexto, indica o lado sul da encosta ou do assentamento jebuseu. A formulação “encosta sul” é natural e geograficamente clara.
- source_word: הִיא יְרוּשָׁלִָם
  choice: isto é, Jerusalém
  rationale: Reproduz a identificação explicativa expressa pelo pronome hebraico seguido do nome da cidade.
- source_word: רֹאשׁ הָהָר
  choice: o topo do monte
  rationale: Expressão idiomática para o ponto mais alto; “topo do monte” conserva a imagem e soa natural em português.
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: que fica a oeste do vale de Hinom
  rationale: A expressão localiza o monte diante ou em frente ao vale, do lado oeste. A redação comunica de modo claro a relação geográfica, enquanto a nota registra o idioma direcional ligado ao mar.
- source_word: בִּקְצֵה ... צָפֹנָה
  choice: na extremidade norte
  rationale: Combina a ideia de extremidade com a direção norte em uma construção portuguesa concisa e natural.
- source_word: עֵמֶק רְפָאִים
  choice: o vale de Refaim
  rationale: Preserva o topônimo por transliteração, sem impor uma interpretação para רְפָאִים.
theological_decisions:
- issue: Identificação do local jebuseu com Jerusalém
  choice: Manter no texto a identificação explícita “isto é, Jerusalém”.
  alternative: Tratar “ela é Jerusalém” como uma oração independente.
  rationale: A formulação escolhida preserva a identificação feita pelo hebraico sem acrescentar uma conclusão histórica ou teológica.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário geográfico corrente. Os topônimos seguem formas transparentes em português: Ben-Hinom, Hinom e Refaim. A sintaxe foi levemente ajustada para tornar compreensível o itinerário da divisa, mantendo em notas as imagens e construções mais literais do hebraico.'
