  text: וַ/יִּֽהְי֣וּ הֶ/עָרִ֗ים מִ/קְצֵה֙ לְ/מַטֵּ֣ה בְנֵֽי יְהוּדָ֔ה אֶל גְּב֥וּל אֱד֖וֹם בַּ/נֶּ֑גְבָּ/ה קַבְצְאֵ֥ל וְ/עֵ֖דֶר וְ/יָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: pt
  text: 'E estas eram as cidades situadas na extremidade do território da tribo dos filhos de Judá[a], na direção da fronteira de Edom, no Neguebe[b]: Cabzeel, Éder e Jagur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desde a extremidade da tribo dos filhos de Judá”; a expressão hebraica se refere à extremidade ou ao limite exterior do território de Judá.
    reason: lexical_alternative
  - marker: b
    text: “Neguebe” também pode ser traduzido como “sul” ou “região sul”. Aqui, provavelmente designa a região meridional específica de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: E estas eram as cidades
  rationale: A construção introduz a lista de cidades. Em português, “estas eram as cidades” torna essa função discursiva clara e natural.
- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: situadas na extremidade do território da tribo dos filhos de Judá
  rationale: מִקְצֵה indica extremidade ou limite exterior; a explicitação de “território” comunica o sentido geográfico implícito, enquanto “filhos de Judá” preserva a designação tribal hebraica.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: na direção da fronteira de Edom
  rationale: אֶל expressa orientação em direção à fronteira, sem exigir a afirmação de que todas as cidades ficavam exatamente sobre ela.
- source_word: בַּנֶּגְבָּה
  choice: no Neguebe
  rationale: No contexto da descrição territorial de Judá, נֶגֶב provavelmente designa a região geográfica meridional conhecida como Neguebe; a nota preserva a alternativa lexical “sul”.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: Cabzeel, Éder e Jagur
  rationale: Os topônimos são transliterados em formas adequadas ao português, com acentuação gráfica em Éder para orientar a pronúncia.
