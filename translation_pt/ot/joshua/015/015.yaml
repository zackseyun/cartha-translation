base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/015.yaml
  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: pt
  text: De lá, ele avançou contra os habitantes de Debir[a]. (Antigamente, o nome de Debir era Quiriate-Sefer.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quiriate-Sefer pode significar «Cidade do Livro» ou «Cidade da Escrita».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ele subiu contra
  rationale: Preserva o sentido básico de עלה, «subir», e, com אֶל no contexto militar, comunica o avanço hostil sem reduzi-lo simplesmente a «atacou».
- source_word: מִשָּׁם
  choice: Dali
  rationale: Equivalente deítico natural e conciso para o movimento a partir do lugar mencionado anteriormente.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: contra os habitantes de Debir
  rationale: יֹשְׁבֵי designa os habitantes ou moradores; «contra» expressa naturalmente em português a direção hostil indicada pelo contexto militar.
- source_word: דְּבִר
  choice: Debir
  rationale: Nome de lugar conservado por transliteração convencional.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: Antigamente, o nome de Debir era
  rationale: לְפָנִים tem aqui sentido temporal, «antigamente» ou «anteriormente»; a formulação fornece a informação histórica de modo claro e natural.
- source_word: קִרְיַת סֵפֶר
  choice: Quiriate-Sefer
  rationale: Topônimo transliterado segundo uma forma legível e tradicional em português; o possível significado dos componentes é preservado em nota.
