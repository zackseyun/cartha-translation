  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: pt
  text: Então a fronteira virou de Baalá para o oeste[a], em direção ao monte Seir; passou pela encosta norte do monte Jearim, isto é, Quesalom; desceu até Bete-Semes e seguiu até Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “em direção ao mar”, expressão usual para indicar o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: a fronteira virou
  rationale: Em uma descrição territorial, o verbo indica mudança de direção da linha de fronteira; a formulação é clara e natural em português.
- source_word: מִבַּעֲלָה
  choice: de Baalá
  rationale: Nome próprio de lugar transliterado de forma legível em português.
- source_word: יָמָּה
  choice: para o oeste
  rationale: A forma direcional significa literalmente “em direção ao mar” e, na geografia de Israel, indica o oeste.
- source_word: אֶל הַר שֵׂעִיר
  choice: em direção ao monte Seir
  rationale: Mantém הַר como “monte” e preserva Seir como topônimo.
- source_word: וְעָבַר אֶל כֶּתֶף ... מִצָּפוֹנָה
  choice: passou pela encosta norte
  rationale: כֶּתֶף é literalmente “ombro/lado”; no contexto topográfico, “encosta” comunica naturalmente a lateral norte do monte.
- source_word: הַר יְעָרִים
  choice: monte Jearim
  rationale: Tratado como nome geográfico e transliterado, sem converter semanticamente o nome.
- source_word: הִיא כְסָלוֹן
  choice: isto é, Quesalom
  rationale: A expressão identifica o lugar precedente; “isto é” reproduz com naturalidade essa explicação appositiva.
- source_word: וְיָרַד
  choice: desceu
  rationale: Preserva de modo conciso o movimento topográfico descendente.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: Transliteração portuguesa legível do topônimo hebraico.
- source_word: וְעָבַר תִּמְנָה
  choice: seguiu até Timna
  rationale: No contexto de uma linha fronteiriça, o verbo descreve sua continuação até o marco seguinte; “seguiu” evita sugerir necessariamente uma travessia física.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluida para uma descrição geográfica. Os topônimos seguem formas transliteradas legíveis em português, e a metáfora anatômica de כֶּתֶף foi vertida pelo termo topográfico natural “encosta”.
