- source_word: מָרֵאשָׁה
  choice: Maressa
  rationale: Nome geográfico vertido pela forma tradicional em português.
- source_word: עָרִים
  choice: cidades
  rationale: Termo comum para núcleos urbanos; é adequado ao contexto administrativo da lista territorial.
- source_word: תֵּשַׁע
  choice: nove
  rationale: Número cardinal preservado diretamente.
- source_word: חַצְרֵיהֶן
  choice: os seus povoados
  rationale: Refere-se a núcleos rurais dependentes ou assentamentos não murados ligados às cidades; 'povoados' é natural e suficientemente abrangente em português.
- source_word: וְ
  choice: e / com
  rationale: As conjunções hebraicas ligam os nomes e a fórmula final; em português, a última relação é expressa naturalmente por 'com'.
