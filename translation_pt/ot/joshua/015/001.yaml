    issue: A nota b chama “desde a extremidade do sul” de formulação mais literal.
    rationale: O hebraico מִקְצֵה תֵימָן admite análise geográfica e é discutido quanto a “sul” ou “Temã”; a nota deve apresentar essas possibilidades sem sobreafirmar uma literalidade única.
