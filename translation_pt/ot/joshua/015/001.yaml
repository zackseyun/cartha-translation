  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: pt
  text: A porção que coube por sorte à tribo dos descendentes de Judá[a], segundo os seus clãs, chegava até a fronteira de Edom, no deserto de Zim, ao sul, no extremo meridional[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Judá”; isto é, os descendentes tribais de Judá.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “na extremidade de Temã” ou “a partir da extremidade de Temã”. O termo hebraico também pode significar “sul”; a expressão pode ser entendida como “no extremo meridional”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: A porção sorteada ... estendia-se
  rationale: Expressa de modo natural em português o resultado do sorteio territorial, preservando a referência explícita ao mecanismo de distribuição.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: para a tribo dos descendentes de Judá
  rationale: מַטֶּה designa a tribo, e בְּנֵי יְהוּדָה é uma expressão coletiva de parentesco; “descendentes” comunica seu sentido sem sugerir apenas filhos imediatos.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto da organização tribal, מִשְׁפָּחָה indica uma subdivisão da tribo, mais precisamente um clã do que uma família nuclear.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: até a fronteira de Edom
  rationale: גְּבוּל indica o limite territorial; “até” torna clara a extensão da área descrita.
- source_word: מִדְבַּר צִן
  choice: o deserto de Zim
  rationale: מִדְבָּר denota região desértica ou erma. “Zim” é a forma tradicional e inteligível em português para o topônimo צִן.
- source_word: נֶגְבָּה
  choice: ao sul
  rationale: A forma tem valor direcional ou locativo neste contexto; “ao sul” é natural e não a transforma desnecessariamente no nome próprio Neguebe.
- source_word: מִקְצֵה תֵימָן
  choice: no extremo sul
  rationale: A expressão assinala o limite meridional extremo. תֵימָן pode significar “sul” ou ser entendido como topônimo, ambiguidade registrada em nota.
