  rationale: Topônimo composto transliterado segundo a forma bíblica portuguesa tradicional de בית como «Bete»; o hífen preserva a percepção do composto sem convertê-lo em uma expressão comum.
- source_word: וְ / וּ
  choice: e
  rationale: A conjunção hebraica coordena os nomes da lista; em português, usa-se «e» antes do último item.
