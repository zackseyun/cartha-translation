  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: pt
  text: A fronteira sul deles partia da extremidade do Mar Salgado[b], da língua[a] voltada para o sul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “a língua”; termo topográfico para uma formação em forma de língua, possivelmente uma baía, enseada ou língua de terra.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o mar Morto.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: deles ia
  rationale: A construção hebraica com היה e ל introduz a descrição da fronteira pertencente a Judá; em português, a formulação possessiva com o verbo “ir” expressa naturalmente o traçado geográfico.
- source_word: גְּבוּל נֶגֶב
  choice: fronteira sul
  rationale: Neste contexto, גְּבוּל designa a linha divisória territorial, e נֶגֶב indica o lado sul, não o topônimo Neguebe.
- source_word: מִקְצֵה
  choice: desde a extremidade
  rationale: Mantém a ideia espacial de um ponto extremo ou terminal, com linguagem geográfica natural.
- source_word: יָם הַמֶּלַח
  choice: mar Salgado
  rationale: Reproduz diretamente o nome hebraico, em vez de substituí-lo no texto principal pelo nome convencional posterior “mar Morto”.
- source_word: מִן הַלָּשׁוֹן
  choice: a partir da língua de terra
  rationale: לָשׁוֹן significa literalmente “língua” e aqui é um termo topográfico. “Língua de terra” preserva a imagem hebraica e deixa claro que se trata de uma formação geográfica.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: voltada para o sul
  rationale: O particípio de פנה com o sufixo direcional indica a orientação da formação geográfica; “voltada para o sul” é claro e idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com terminologia geográfica clara. Conserva-se “mar Salgado” por fidelidade ao nome hebraico e “língua de terra” para preservar a imagem do original sem tornar a frase obscura.
