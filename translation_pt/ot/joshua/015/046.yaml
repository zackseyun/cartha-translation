  text: De Ecrom para o oeste, tudo o que fica junto de Asdode e seus povoados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָיָמָּה
  choice: até o mar
  rationale: O hebraico emprega literalmente a direção 'para o mar', isto é, rumo ao oeste. 'Até o mar' conserva a imagem geográfica natural no contexto de uma delimitação territorial.
- source_word: עַל יַד אַשְׁדּוֹד
  choice: ao lado de Asdode
  rationale: A expressão idiomática significa 'junto de', 'nas proximidades de' ou 'ao lado de'. Esta tradução preserva a formulação espacial sem especificar uma relação territorial mais exata do que o hebraico.
- source_word: וְחַצְרֵיהֶן
  choice: e seus povoados
  rationale: חצר pode designar aldeias ou assentamentos menores associados às localidades citadas. 'Povoados' é claro e adequado ao contexto; o sufixo plural é mantido por 'seus'.
