id: JOS.15.13
reference: Joshua 15:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: pt
  text: 'E a Calebe, filho de Jefoné, ele deu uma porção entre os filhos de Judá, conforme a ordem[a] de Yahweh a Josué: Quiriate-Arba (Arba era o pai de Anaque[b]), isto é, Hebrom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conforme a palavra de Yahweh”. A expressão hebraica significa literalmente “conforme a boca de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: “Pai de Anaque” também pode significar “antepassado” ou “fundador” de Anaque.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב
  choice: E a Calebe
  rationale: Preserva tanto a conjunção quanto a preposição hebraicas, com uma abertura compreensível em português.
- source_word: בֶּן יְפֻנֶּה
  choice: filho de Jefoné
  rationale: Reproduz diretamente a construção filial e usa a forma portuguesa tradicional do nome.
- source_word: נָתַן חֵלֶק
  choice: ele deu uma porção
  rationale: Mantém a ação verbal e o sujeito implícito recuperado apenas pelo pronome, sem identificar expressamente se o referente é Josué ou Yahweh.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: entre os filhos de Judá
  rationale: Traduz בְּתוֹךְ por 'entre' e conserva a designação tribal transparente 'filhos de Judá'.
- source_word: אֶל פִּי יְהוָה
  choice: conforme a ordem de Yahweh
  rationale: Expressa naturalmente o sentido idiomático de 'segundo a boca de Yahweh', mantendo em nota as alternativas lexicais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: לִיהוֹשֻׁעַ
  choice: a Josué
  rationale: A preposição marca de modo mais direto o destinatário da ordem divina.
- source_word: קִרְיַת אַרְבַּע
  choice: Quiriate-Arba
  rationale: Trata a expressão como nome geográfico e emprega uma transliteração adaptada ao português.
- source_word: אֲבִי הָעֲנָק
  choice: o pai de Anaque
  rationale: Conserva a formulação genealógica mais transparente sem decidir se אָב significa pai, antepassado ou fundador.
- source_word: הִיא חֶבְרוֹן
  choice: isto é, Hebrom
  rationale: Apresenta de maneira idiomática a identificação de Quiriate-Arba com Hebrom.
theological_decisions:
- issue: Referente do sujeito implícito de נָתַן, 'deu'
  choice: Mantido sem antecedente explícito em 'ele deu'.
  alternative: Explicitar 'Josué deu' ou 'Yahweh deu'.
  rationale: O hebraico não nomeia o sujeito nesta oração. Identificá-lo expressamente resolveria uma ambiguidade que o texto preserva.
- issue: Sentido de אָב em relação a Anaque
  choice: pai
  alternative: antepassado ou fundador
  rationale: A tradução principal preserva a expressão concreta do hebraico, enquanto a nota registra a amplitude semântica relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais usuais em português. A ordem ligeiramente marcada em 'E a Calebe... ele deu' preserva a estrutura e a ambiguidade do hebraico sem deixar a frase obscura. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
