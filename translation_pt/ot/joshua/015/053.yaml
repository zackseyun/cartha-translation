lexical_decisions:
- source_word: ו/ינים
  choice: e Janim
  rationale: O ו conjuntivo é traduzido por “e”, e o topônimo ינים é transliterado como “Janim”, forma natural e reconhecível em português.
- source_word: וּ/בֵית תַּפּוּחַ
  choice: Bete-Tapua
  rationale: O וּ conjuntivo é traduzido por “e”. Por se tratar de um topônimo composto, בֵית תַּפּוּחַ é transliterado, não traduzido literalmente como “casa de maçã”. “Bete-Tapua” segue convenções correntes de nomes bíblicos em português.
- source_word: וַ/אֲפֵקָה
  choice: Afeca
  rationale: O וַ conjuntivo é traduzido por “e”, e אֲפֵקָה é transliterado como “Afeca”, preservando a terminação do topônimo e distinguindo-o da forma mais curta “Afeque”.
