  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/020.yaml
  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: pt
  text: Esta é a herança da tribo dos filhos de Judá, segundo os seus clãs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta foi a herança da tribo dos filhos de Judá, segundo os seus clãs.”'
    reason: A oração hebraica não contém verbo expresso; tanto o presente quanto o passado podem ser supridos em português conforme se entenda a frase como identificação ou resumo narrativo.
lexical_decisions:
- source_word: זֹאת
  choice: Esta é
  rationale: O demonstrativo feminino singular retoma a herança territorial descrita. Como a oração hebraica não traz verbo expresso, o presente funciona naturalmente em português e preserva a formulação nominal do original.
- source_word: נַחֲלַת
  choice: a herança
  rationale: No contexto da distribuição da terra, נַחֲלָה designa a posse recebida por herança ou por atribuição; “herança” preserva melhor a nuance ligada à terra concedida ao povo.
- source_word: מַטֵּה
  choice: a tribo
  rationale: Neste contexto tribal, מַטֶּה é a designação convencional de uma tribo, não o sentido concreto de “cajado”.
- source_word: בְנֵי יְהוּדָה
  choice: dos filhos de Judá
  rationale: Mantém a expressão genealógica hebraica de modo claro e digno em português, sem reduzi-la simplesmente a “Judá”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה refere-se aqui aos agrupamentos familiares dentro da tribo, e o prefixo לְ indica distribuição ou organização segundo esses clãs.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. Conserva a expressão tribal “filhos de Judá” e usa “clãs” para precisão contextual.
