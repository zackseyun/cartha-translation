base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: pt
  text: e Hazor-Hadata[a], e Queriote-Hezrom (isto é, Hazor)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Hazor, Hadata e Queriote-Hezrom, isto é, Hazor”, caso חֲדַתָּה seja entendido como o nome de uma cidade distinta, e não como parte do nome composto “Hazor-Hadata”.'
    reason: alternative_reading
  - marker: b
    text: “Queriote” também pode ser transliterado como “Quiriote”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר חֲדַתָּה
  choice: e Hazor-Hadata
  rationale: Trata חֲדַתָּה como elemento do topônimo composto, de acordo com a acentuação massorética e o contexto da lista de cidades; os nomes são transliterados em formas naturais para leitores de português.
- source_word: וּ/קְרִיּוֹת
  choice: e Quiriote
  rationale: No contexto da lista territorial, o termo é entendido como nome próprio, não como o substantivo comum 'cidades'. A grafia com Qu- preserva aproximadamente o som inicial em português.
- source_word: חֶצְרוֹן
  choice: -Hezrom
  rationale: É ligado ao nome anterior como topônimo composto. 'Hezrom' segue a forma tradicional e legível em português para o hebraico חֶצְרוֹן.
- source_word: הִיא
  choice: isto é
  rationale: O pronome introduz uma identificação explicativa ou aposicional; 'isto é' expressa essa função com naturalidade em português.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Nome próprio final, que identifica o lugar precedente; mantém-se a mesma transliteração usada no início do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Os topônimos recebem transliteração adaptada à ortografia portuguesa; a ambiguidade sobre Hadata é preservada em nota.
