base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: pt
  text: 'Ela disse: “Por favor, dê-me uma bênção[a]. Já que o senhor me deu a terra do Neguebe[b], dê-me também fontes de água[c].” Então ele lhe deu as fontes superiores e as fontes inferiores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um presente”. O hebraico diz “uma bênção”, empregando uma expressão que aqui se refere a uma concessão benéfica.
    reason: lexical_alternative
  - marker: b
    text: “Neguebe” também pode significar “região sul” ou “região árida”.
    reason: lexical_alternative
  - marker: c
    text: O termo hebraico pode indicar fontes, reservatórios ou bacias de água; “fontes” parece ajustar-se melhor ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: uma bênção
  rationale: Preserva o sentido normal do substantivo hebraico e sua linguagem de concessão benéfica, embora no contexto possa referir-se concretamente a um presente.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: terras no Neguebe
  rationale: Trata נֶגֶב como designação geográfica e traduz אֶרֶץ de modo natural em português, sem sugerir que toda a região lhe foi concedida.
- source_word: גֻּלֹּת מָיִם
  choice: fontes de água
  rationale: O termo raro גֻּלֹּת pode indicar fontes, reservatórios ou bacias; fontes se ajusta bem à propriedade e ao contraste posterior entre as superiores e inferiores.
- source_word: תְּנָה לִּי
  choice: Por favor, dê-me
  rationale: Expressa em português corrente o pedido respeitoso marcado pelo imperativo com ה paragogicum e pelo contexto familiar.
- source_word: וְנָתַתָּה לִי
  choice: dê-me também
  rationale: O também explicita naturalmente o caráter adicional do segundo pedido.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: as fontes superiores
  rationale: Mantém coerência com fontes de água e representa a localização mais elevada indicada pelo adjetivo.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: as fontes inferiores
  rationale: Conserva o paralelismo com fontes superiores e a referência à localização mais baixa.
- source_word: וַיִּתֶּן לָהּ
  choice: Então ele lhe deu
  rationale: Reproduz a progressão narrativa do waw consecutivo em português natural.
