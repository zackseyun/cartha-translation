  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “o senhor” torna natural o pedido de uma filha ao pai sem confundi-lo com o título divino “Senhor”. A formulação preserva as ambiguidades lexicais relevantes em notas.
