base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: pt
  text: 'Então Calebe disse[a]: “Quem atacar Quiriate-Sefer e a conquistar, eu lhe darei minha filha Acsa como esposa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aquele que atacar Quiriate-Sefer e a conquistar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá sequência à narrativa. “Então” expressa naturalmente essa progressão em português sem impor uma relação causal.
- source_word: כָּלֵב
  choice: Calebe
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: אֲשֶׁר
  choice: Quem
  rationale: Introduz uma oração relativa indefinida e comunica de modo natural o desafio aberto feito por Calebe.
- source_word: יַכֶּה
  choice: atacar
  rationale: O hifil de נכה indica golpear ou ferir; no contexto militar, “atacar” preserva a ação contra a cidade sem antecipar o êxito, que é expresso separadamente por “conquistar”.
- source_word: קִרְיַת סֵפֶר
  choice: Quiriate-Sefer
  rationale: Transliteração adaptada à ortografia portuguesa de um topônimo cujo primeiro elemento integra o nome próprio.
- source_word: וּלְכָדָהּ
  choice: e a conquistar
  rationale: לכד, em contexto militar, significa capturar ou tomar. “Conquistar” é idiomático para uma cidade, e o pronome feminino “a” representa o sufixo referente à cidade.
- source_word: וְנָתַתִּי לוֹ
  choice: eu lhe darei
  rationale: Expressa a promessa futura de Calebe e mantém explicitamente o beneficiário por meio de “lhe”.
- source_word: עַכְסָה
  choice: Acsa
  rationale: Forma portuguesa tradicional e reconhecível do nome pessoal.
- source_word: בִתִּי
  choice: minha filha
  rationale: Tradução direta da relação filial explicitada no hebraico.
- source_word: לְאִשָּׁה
  choice: como esposa
  rationale: Expressa de forma clara e atual a fórmula hebraica de dar alguém em casamento, sem acrescentar um possessivo que não aparece explicitamente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formas bíblicas de nomes já consolidadas. A construção mantém distintas as ideias de atacar a cidade e efetivamente conquistá-la.
