base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: pt
  text: Asdode, suas cidades dependentes[a] e seus povoados; Gaza, suas cidades dependentes e seus povoados; até o ribeiro do Egito[b] e o mar[c], como fronteira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suas filhas”; expressão hebraica para cidades menores subordinadas a uma cidade principal.
    reason: lexical_alternative
  - marker: b
    text: Ou “uádi do Egito”; o termo hebraico pode designar um curso de água sazonal.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o mar Mediterrâneo. O final do texto hebraico é elíptico e repete o termo “fronteira”; o sentido provável é que o mar constitui a fronteira.
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: suas cidades dependentes
  rationale: Em listas territoriais, o hebraico literalmente diz “suas filhas”, expressão idiomática para localidades subordinadas a uma cidade principal. “Cidades dependentes” comunica o sentido de modo natural em português.
- source_word: חֲצֵרֶיהָ
  choice: seus povoados
  rationale: Neste contexto geográfico, designa núcleos menores de habitação nos arredores; “povoados” os distingue das cidades dependentes.
- source_word: נַחַל מִצְרָיִם
  choice: o ribeiro do Egito
  rationale: נַחַל pode indicar um curso de água, muitas vezes sazonal. “Ribeiro do Egito” conserva a forma tradicional do marco territorial sem pressupor fluxo permanente.
- source_word: הַיָּם
  choice: o mar
  rationale: O texto massorético deste versículo traz simplesmente “o mar”, no contexto o Mediterrâneo. A tradução preserva a forma do hebraico e esclarece o referente em nota.
- source_word: הַגְּבוּל וּגְבוּל
  choice: que era a fronteira
  rationale: A conclusão hebraica é breve e textualmente difícil. A formulação portuguesa expressa a função fronteiriça do mar sem reproduzir uma construção obscura.
- source_word: עַד
  choice: até
  rationale: Forma natural e direta em português para indicar o limite da extensão territorial.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: Asdode / Gaza
  rationale: Empregam-se as formas portuguesas correntes dos topônimos bíblicos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A tradução segue de perto o texto hebraico, evita acrescentar “Grande” a “mar”, pois essa palavra não aparece no WLC deste versículo, e preserva em nota a dificuldade da expressão final.
