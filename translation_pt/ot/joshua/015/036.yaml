base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/036.yaml
  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: pt
  text: 'Saarim[a], Aditaim, Gederá e Gederotaim: ao todo, catorze cidades com seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns intérpretes observam que os quatro nomes de lugares apresentados neste versículo não parecem completar o total declarado de “catorze cidades”. A história textual da seção mais ampla pode explicar a diferença, mas o texto hebraico aqui foi traduzido tal como se encontra.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: Saarim
  rationale: Nome próprio transliterado em forma legível em português; a grafia evita sugerir uma pronúncia inglesa.
- source_word: עֲדִיתַיִם
  choice: Aditaim
  rationale: Nome próprio transliterado diretamente, com grafia natural para leitores de português.
- source_word: הַגְּדֵרָה
  choice: Gederá
  rationale: Topônimo transliterado; o artigo hebraico é incorporado ao nome e não é vertido separadamente, conforme o uso natural em português.
- source_word: גְדֵרֹתָיִם
  choice: Gederotaim
  rationale: Nome próprio transliterado diretamente.
- source_word: עָרִים
  choice: cidades
  rationale: Equivalente convencional de עִיר em listas territoriais e adequado ao caráter administrativo dos assentamentos enumerados.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: catorze
  rationale: Forma cardinal corrente e amplamente compreensível em português.
- source_word: חַצְרֵיהֶן
  choice: seus povoados
  rationale: Neste contexto, חָצֵר designa assentamentos dependentes ou não murados associados às cidades; 'povoados' preserva essa distinção com clareza.
