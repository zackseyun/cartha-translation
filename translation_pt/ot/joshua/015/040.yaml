lexical_decisions:
- source_word: כַבּוֹן
  choice: Cabom
  rationale: 'Nome de lugar transliterado segundo convenções naturais do português: C representa o som /k/ antes de a, e m final representa adequadamente a nasalização percebida em português.'
- source_word: לַחְמָס
  choice: Laamás
  rationale: Nome de lugar transliterado em forma legível e já reconhecível em português. A sequência aa evita atribuir ao h português um valor fonético inadequado, enquanto o acento preserva a tonicidade final.
- source_word: כִתְלִישׁ
  choice: Quitlís
  rationale: 'Nome de lugar transliterado conforme a ortografia portuguesa: Qu representa o som inicial /k/ antes de i, e o acento em í indica a tonicidade final do hebraico.'
- source_word: וְ
  choice: e
  rationale: A conjunção hebraica coordena os nomes da lista; em português corrente, usa-se vírgula entre os primeiros itens e e antes do último.
