- source_word: עָרִים
  choice: cidades
  rationale: Termo usual para centros urbanos e a tradução tradicional adequada ao contexto de uma lista territorial.
- source_word: אַחַת עֶשְׂרֵה
  choice: onze
  rationale: Forma cardinal idiomática em português, concordando semanticamente com 'cidades'.
- source_word: חַצְרֵיהֶן
  choice: povoados
  rationale: Designa assentamentos rurais dependentes ligados às cidades mencionadas; 'povoados' comunica essa relação sem pressupor com excessiva precisão seu tamanho ou suas muralhas.
