- source_word: וְ/רוּמָה
  choice: Rumá
  rationale: O nome próprio רוּמָה foi transliterado como “Rumá”, refletindo sua vocalização hebraica; a conjunção prefixada וְ integra a enumeração em português.
- source_word: וְ/אֶשְׁעָן
  choice: e Esã
  rationale: A conjunção וְ foi traduzida por “e”, e o topônimo אֶשְׁעָן foi transliterado como “Esã”, forma concisa e adequada à fonologia portuguesa.
