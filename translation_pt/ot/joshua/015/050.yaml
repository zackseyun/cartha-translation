  rationale: Embora tenha aparência de plural em hebraico, funciona como topônimo e, por isso, é transliterado em vez de traduzido.
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada coordena os nomes na lista; em português, uma única conjunção antes do último item é a forma mais natural.
