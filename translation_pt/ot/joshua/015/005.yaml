review_pass:
  verdict: revise
  source_fidelity: A primeira frase transmite corretamente o limite oriental e entende adequadamente קְצֵה הַיַּרְדֵּן, neste contexto, como a foz do Jordão. Na segunda, porém, «língua de terra» introduz um elemento («terra») que não está no hebraico; לְשׁוֹן הַיָּם designa literalmente a “língua do mar” e, geograficamente, uma reentrância ou enseada. «Começava» também é uma explicitação desnecessária de «era desde».
  naturalness: «Enseada do mar» é português geográfico natural e evita a imagem equivocada de uma projeção terrestre. «No lado norte» preserva a formulação direcional do texto sem tornar a frase pesada.
  terminology: «Mar Salgado» é uma tradução estabelecida e transparente de יָם הַמֶּלַח. «Foz do Jordão» é contextual e idiomática para a extremidade do rio junto ao mar. A nota registra que «enseada» interpreta o uso topográfico de «língua», sem pretender eliminar sua imagem literal.
  issues:
  - severity: medium
    issue: «língua de terra junto ao mar» para לְשׁוֹן הַיָּם
    rationale: O hebraico diz literalmente «língua do mar», não «língua de terra». A formulação proposta altera o referente geográfico ao especificar uma saliência terrestre; no contexto, a expressão é mais bem entendida como uma reentrância/enseada do mar.
  - severity: low
    issue: «a fronteira começava»
    rationale: O verbo «começava» não é expresso no hebraico. «Era desde» preserva com mais proximidade a construção de delimitação, mantendo português fluente.
  revised_text: A fronteira oriental era o mar Salgado, até a foz do Jordão. A fronteira, no lado norte, era desde a enseada do mar[a], na foz do Jordão.
