  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: pt
  text: A fronteira oriental era o mar Salgado, até a foz do Jordão. A fronteira, no lado norte, era desde a enseada do mar[a], na foz do Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «língua do mar». A expressão descreve uma formação ou reentrância costeira; «enseada» traduz seu sentido geográfico neste contexto.'
    reason: Esclarece a imagem literal e a decisão topográfica sem introduzir uma especificação de terreno ausente do texto.
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: mar Salgado
  rationale: Equivalente tradicional e transparente do topônimo hebraico, preservando sua forma descritiva.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: foz do Jordão
  rationale: Embora קצה signifique literalmente 'extremidade', no contexto geográfico indica o ponto em que o Jordão termina no mar Salgado; 'foz' comunica isso naturalmente.
- source_word: לְשׁוֹן הַיָּם
  choice: língua de terra junto ao mar
  rationale: A expressão hebraica significa literalmente 'língua do mar' e designa uma projeção costeira; a explicitação 'de terra junto ao mar' evita que o português sugira uma faixa de água, sem eliminar a imagem original.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação cartográfica natural. A repetição hebraica de 'fronteira' foi preservada, enquanto a segunda oração foi reorganizada levemente para fluência e clareza.
