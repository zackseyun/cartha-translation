lexical_decisions:
- source_word: בַּשְּׁפֵלָה
  choice: Na Sefelá
  rationale: O substantivo com artigo designa aqui a região geográfica conhecida como Sefelá, as terras baixas ou colinas ao pé das montanhas de Judá. A transliteração preserva o caráter de nome regional, enquanto a nota esclarece seu sentido.
- source_word: אֶשְׁתָּאוֹל
  choice: Estaol
  rationale: Nome de lugar transliterado segundo formas correntes em português, sem tradução.
- source_word: וְצָרְעָה
  choice: Zorá
  rationale: Nome de lugar transliterado em forma natural para leitores de português; a conjunção hebraica é representada na coordenação da lista.
- source_word: וְאַשְׁנָה
  choice: e Asná
  rationale: Nome de lugar transliterado; o וְ prefixado é traduzido por «e», encerrando a enumeração.
