base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: pt
  text: Depois, a divisa passou por Azmom e chegou ao ribeiro do Egito[a]; e a divisa terminou no mar. Essa será a fronteira sul de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uádi do Egito”. O termo hebraico náhal frequentemente designa um curso de água sazonal ou seu leito. A tradução tradicional “rio do Egito” pode sugerir indevidamente o Nilo neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Depois, a divisa passou por
  rationale: Em descrições de fronteiras, עבר indica a continuação do traçado. A explicitação de “a divisa” produz português natural sem alterar o referente contextual.
- source_word: עַצְמֹנָה
  choice: Azmom
  rationale: Nome geográfico transliterado segundo uma forma corrente em português, preservando a consoante nasal final do hebraico.
- source_word: וְיָצָא
  choice: chegou
  rationale: Embora o verbo signifique literalmente “sair”, em itinerários territoriais assinala que a linha alcança um ponto; “chegou” comunica essa função naturalmente.
- source_word: נַחַל מִצְרַיִם
  choice: ribeiro do Egito
  rationale: נחל pode designar um curso de água, muitas vezes sazonal, ou seu leito. “Ribeiro” é claro e evita a associação indevida de “rio do Egito” com o Nilo; a nota conserva a alternativa geograficamente mais precisa.
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: e a divisa terminou no mar
  rationale: A expressão idiomática indica o ponto terminal da fronteira na direção do mar, aqui o Mediterrâneo. A formulação evita uma reprodução artificial de “saídas da fronteira”.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: Essa será a fronteira sul de vocês
  rationale: נֶגֶב tem sentido direcional neste contexto, e não o de nome próprio da região do Neguebe. “De vocês” representa לָכֶם em linguagem atual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. “Divisa” descreve o traçado territorial, enquanto “fronteira sul” preserva a formulação resumitiva do final do versículo.
