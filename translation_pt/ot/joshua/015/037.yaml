  rationale: Embora derive de uma palavra que pode significar “nova”, aqui funciona como nome de lugar e, por isso, foi transliterado.
- source_word: מִגְדַּל גָּד
  choice: Migdal-Gade
  rationale: Topônimo composto, mantido como nome próprio; “Gade” segue a forma portuguesa tradicional do nome גָּד.
- source_word: וַ / וּ
  choice: vírgula e “e”
  rationale: As conjunções coordenam os nomes da lista; em português natural, usa-se vírgula entre os primeiros itens e “e” antes do último.
