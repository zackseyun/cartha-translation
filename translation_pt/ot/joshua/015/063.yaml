  source_fidelity: A tradução preserva adequadamente o contraste inicial, a identificação dos jebuseus como habitantes de Jerusalém, a incapacidade de Judá de desalojá-los e a coexistência continuada em Jerusalém até o tempo do narrador. O plural português «jebuseus» transmite corretamente o singular étnico coletivo hebraico.
