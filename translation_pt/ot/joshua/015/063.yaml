source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: pt
  text: Mas os filhos de Judá não puderam desalojar os jebuseus, habitantes de Jerusalém. Por isso, os jebuseus vivem com os filhos de Judá em Jerusalém até o dia de hoje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: Mas
  rationale: A conjunção, seguida do marcador de objeto, introduz uma exceção contrastante após a descrição da herança territorial; “Mas” comunica naturalmente essa função discursiva.
- source_word: הַיְבוּסִי
  choice: os jebuseus
  rationale: Embora esteja morfologicamente no singular, o gentílico tem sentido coletivo; o plural é a forma natural em português para designar o povo.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: habitantes de Jerusalém
  rationale: O particípio identifica os jebuseus como os residentes da cidade e conserva a função apositiva da expressão.
- source_word: לֹא יוכלו
  choice: não puderam
  rationale: Expressa incapacidade no quadro da narrativa passada, de maneira direta e idiomática.
- source_word: בְנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Preserva a expressão familiar e tribal hebraica; no contexto, refere-se coletivamente aos descendentes de Judá.
- source_word: לְהוֹרִישָׁם
  choice: desalojar
  rationale: No contexto da conquista, o hiphil de ירשׁ indica remover um povo de sua posse territorial. “Desalojar” é claro em português e evita sugerir apenas expulsão momentânea.
- source_word: וַיֵּשֶׁב
  choice: vivem
  rationale: Com “até o dia de hoje”, a forma narrativa descreve uma situação iniciada no passado e ainda vigente no tempo do narrador; o presente português expressa naturalmente essa continuidade.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: com os filhos de Judá
  rationale: Apesar da construção hebraica incomum com אֶת, o contexto indica coexistência. “Com” mantém essa relação sem especificar além do texto se viviam entre eles ou ao lado deles.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Reproduz de modo natural a fórmula temporal hebraica, referida ao presente do narrador.
theological_decisions:
- issue: Sentido coletivo de בְנֵי יְהוּדָה
  choice: os filhos de Judá
  alternative: o povo de Judá; a tribo de Judá
  rationale: A tradução conserva a metáfora genealógica e tribal do hebraico sem restringi-la apenas aos homens individualmente.
- issue: Relação expressa na cláusula וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה
  choice: os jebuseus vivem com os filhos de Judá
  alternative: os jebuseus vivem entre os filhos de Judá; os jebuseus vivem ao lado dos filhos de Judá
  rationale: A sintaxe é incomum, mas o sentido contextual é de coexistência. “Com” preserva a relativa indeterminação quanto à configuração exata dessa convivência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o gentílico tradicional “jebuseus” e a expressão bíblica “filhos de Judá”. A divisão em duas frases torna clara a consequência narrativa sem alterar o conteúdo.
