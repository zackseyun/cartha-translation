  terminology: «Filhos de Judá», «jebuseus», «Jerusalém» e «desalojar» são escolhas consistentes, compreensíveis e fiéis. «Desalojar» comunica apropriadamente a perda de posse/ocupação territorial implicada pelo hiphil de ירשׁ, sem impor interpretação adicional.
