base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: pt
  text: O limite a oeste era o Grande Mar, que servia de fronteira.[a] Este era o limite dos filhos de Judá em toda a volta, segundo os seus clãs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa uma expressão que significa “em direção ao mar”, isto é, a oeste, e chama o Mediterrâneo de “o Grande Mar”.
    reason: cultural_note
  - marker: b
    text: 'Ou: “segundo as suas famílias”. O termo hebraico se refere a agrupamentos familiares ou clânicos dentro da tribo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: O limite ocidental
  rationale: Em descrições territoriais, יָם (‘mar’) também indica o lado do mar, isto é, o oeste. A formulação comunica de modo natural a orientação geográfica.
- source_word: הַיָּמָּה הַגָּדוֹל
  choice: o mar Grande
  rationale: A expressão designa o Mediterrâneo. Mantém-se a forma hebraica tradicional no texto, com explicação na nota.
- source_word: וּגְבוּל
  choice: como fronteira
  rationale: A repetição concisa de גְּבוּל após ‘mar Grande’ tem valor apositivo ou predicativo; ‘como fronteira’ preserva esse sentido sem sugerir um elemento geográfico adicional.
- source_word: בְּנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Reproduz a expressão filial masculina do hebraico, que se refere coletivamente aos descendentes tribais de Judá.
- source_word: סָבִיב
  choice: ao redor
  rationale: Resume o conjunto dos limites que circundavam o território de Judá.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה, neste contexto de repartição territorial, indica os agrupamentos familiares ou clânicos dentro da tribo.
theological_decisions:
- issue: Designação tribal masculina em בְּנֵי יְהוּדָה
  choice: os filhos de Judá
  alternative: os descendentes de Judá; o povo de Judá
  rationale: A expressão hebraica é filial e masculina, embora designe coletivamente a tribo. A tradução preserva essa forma sem lhe acrescentar uma implicação doutrinária.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. ‘Limite’ foi preferido para a linha territorial, e ‘fronteira’ na aposição para evitar repetição pesada. A ordem de ‘ao redor’ foi ajustada para maior naturalidade sem eliminar sua função resumitiva.
