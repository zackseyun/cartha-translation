  text: Hazar-Sual, Berseba[a] e Biziotiá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Berseba pode refletir o hebraico para “poço de sete” e, por um jogo de palavras, “poço do juramento”.
