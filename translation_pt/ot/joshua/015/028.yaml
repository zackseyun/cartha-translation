lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hazar-Sual
  rationale: Translitera o topônimo hebraico em forma natural para leitores de língua portuguesa. Embora seus elementos possam significar algo como “povoado do chacal” ou “aldeia da raposa”, a lista de cidades pede a preservação do nome próprio.
- source_word: בְּאֵר שֶׁבַע
  choice: Berseba
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para este topônimo. O possível jogo de palavras hebraico é preservado em nota, sem transformar o nome próprio em tradução explicativa no texto.
- source_word: בִּזְיוֹתְיָה
  choice: Biziotiá
  rationale: Translitera em ortografia portuguesa um topônimo de etimologia incerta, conservando a tonicidade final sugerida pela forma hebraica.
- source_word: וַ / וּ
  choice: e
  rationale: A conjunção hebraica liga os nomes da lista; em português natural, usa-se vírgula entre os primeiros itens e “e” antes do último.
