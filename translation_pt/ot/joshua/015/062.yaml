base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: pt
  text: 'e Nibsã, a Cidade do Sal e En-Gedi: seis cidades com seus povoados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas aldeias”. O termo hebraico pode designar localidades menores dependentes das cidades mencionadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: Nibsã
  rationale: Nome próprio de lugar transliterado em forma natural para leitores de língua portuguesa; o artigo hebraico não é reproduzido como parte do nome.
- source_word: עִיר הַמֶּלַח
  choice: Cidade do Sal
  rationale: A expressão construta significa literalmente “cidade do sal”; a tradução conserva o sentido transparente do topônimo e soa natural em português.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Topônimo bíblico consagrado em português, transliterado em vez de traduzido literalmente como “fonte do cabrito”.
- source_word: עָרִים שֵׁשׁ
  choice: seis cidades
  rationale: Resumo numérico direto da lista; “cidades” mantém o uso territorial de עָרִים sem pressupor dimensões urbanas modernas.
- source_word: חַצְרֵיהֶן
  choice: seus povoados
  rationale: Designa localidades menores, possivelmente não muradas, vinculadas às cidades enumeradas. “Povoados” é claro e abrangente no português moderno.
- source_word: וְ
  choice: e
  rationale: As conjunções repetidas articulam esta parte da lista territorial; a conjunção inicial foi mantida por ligar o versículo ao item precedente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a estrutura de lista e usa formas correntes dos topônimos bíblicos.
