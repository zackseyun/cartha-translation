base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/032.yaml
  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: pt
  text: Lebaote, Silim, Aim e Rimom — ao todo, vinte e nove cidades, com seus povoados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas aldeias” ou “seus pequenos assentamentos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: Lebaote
  rationale: Topônimo transliterado em forma natural para leitores de português; a conjunção inicial integra a sequência da lista, mas não precisa ser repetida antes deste primeiro nome no recorte do versículo.
- source_word: וְשִׁלְחִים
  choice: Silim
  rationale: Topônimo transliterado segundo padrões gráficos legíveis em português, sem traduzir o nome.
- source_word: וְעַיִן
  choice: Aim
  rationale: Neste contexto, עַיִן é topônimo, não o substantivo comum 'olho' ou 'fonte'; a forma Aim representa o nome de modo natural em português.
- source_word: וְרִמּוֹן
  choice: Rimom
  rationale: Topônimo transliterado, em vez de traduzido pelo sentido comum 'romã'; a terminação em -m segue uso português para nomes hebraicos terminados em nun.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: ao todo, vinte e nove cidades
  rationale: Expressa de maneira idiomática a soma resumida pelo hebraico, preservando o número e a força de totalidade.
- source_word: וְחַצְרֵיהֶן
  choice: com seus povoados
  rationale: חָצֵר, em listas territoriais, designa assentamentos menores vinculados às cidades; 'povoados' é claro, atual e não pressupõe tamanho tão específico quanto 'aldeias'.
