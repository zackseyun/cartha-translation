lexical_decisions:
- source_word: בַּעֲלָה
  choice: Baalá
  rationale: Nome próprio de lugar. A forma portuguesa preserva de modo legível a vocalização massorética, com acento gráfico para indicar a tonicidade final.
- source_word: עִיִּים
  choice: Iyim
  rationale: Nome próprio numa lista de cidades; por isso, é transliterado, e não traduzido pelo possível sentido lexical de «ruínas» ou «montões». A grafia conserva de maneira razoável a sequência consonantal hebraica.
- source_word: עָצֶם
  choice: Ézem
  rationale: Nome próprio de lugar. «Ézem» representa a vocalização do hebraico neste versículo e usa acento gráfico para orientar a pronúncia em português.
- source_word: וְ / וָ
  choice: e
  rationale: As formas prefixadas da conjunção ligam os nomes numa lista simples; «e» é o equivalente natural em português.
