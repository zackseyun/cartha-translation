lexical_decisions:
- source_word: זָנוֹחַ
  choice: Zanoa
  rationale: Nome próprio de uma cidade na lista de localidades de Judá; adota-se a forma tradicional e natural em português.
- source_word: עֵין גַּנִּים
  choice: En-Ganim
  rationale: Topônimo composto por עֵין, “fonte”, e גַּנִּים, “jardins”. No texto principal, o nome é transliterado, em vez de traduzido, para manter o tratamento consistente dos topônimos.
- source_word: תַּפּוּחַ
  choice: Tapua
  rationale: Neste contexto, a palavra funciona como nome de lugar. Usa-se a forma aportuguesada, enquanto seu sentido lexical possível é preservado em nota.
- source_word: הָעֵינָם
  choice: Enã
  rationale: Topônimo cuja forma hebraica contém o artigo definido. Emprega-se a forma tradicional em português; a composição hebraica é esclarecida em nota.
