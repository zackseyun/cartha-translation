  yaml_path: translation/ot/joshua/015/057.yaml
  text: 'Hak-kain[a], Gibeah, and Timnah: ten cities with their settlements.'
translation:
  language: pt
  text: 'Ha-Caim, Gibeá e Timna: dez cidades com seus povoados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקַּיִן
  choice: Ha-Caim
  rationale: Topônimo hebraico; a transliteração conserva o artigo prefixado como parte da forma do nome e adapta a grafia para leitura natural em português.
- source_word: גִּבְעָה
  choice: Gibeá
  rationale: Em uma lista territorial, o termo funciona como topônimo, não como o substantivo comum “colina”; usa-se a forma portuguesa tradicional.
- source_word: תִמְנָה
  choice: Timna
  rationale: Topônimo transliterado segundo a forma corrente em português.
- source_word: עָרִים עֶשֶׂר
  choice: dez cidades
  rationale: Reproduz diretamente a fórmula hebraica que resume o número dos centros urbanos listados.
- source_word: חַצְרֵיהֶן
  choice: seus povoados
  rationale: O termo designa núcleos menores associados às cidades; “povoados” é claro, natural e não especifica indevidamente se eram aldeias ou assentamentos sem muralhas.
