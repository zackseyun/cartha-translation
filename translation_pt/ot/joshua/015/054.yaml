base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: pt
  text: 'Humtá, Quiriate-Arba (isto é, Hebrom)[a] e Zior: nove cidades com seus povoados.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “ela é Hebrom”, identificando Quiriate-Arba com Hebrom.
    reason: cross_reference
  - marker: b
    text: Ou “suas aldeias”. O termo hebraico pode indicar assentamentos menores vinculados às cidades mencionadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: Humtá
  rationale: Nome geográfico transliterado em forma natural para leitores de língua portuguesa, com acento para orientar a pronúncia.
- source_word: קִרְיַת אַרְבַּע
  choice: Quiriate-Arba
  rationale: Mantém o nome geográfico composto como topônimo, em vez de traduzir sua possível etimologia como “Cidade de Arba”.
- source_word: הִיא חֶבְרוֹן
  choice: isto é, Hebrom
  rationale: Expressa de modo claro e idiomático a identificação feita no hebraico entre Quiriate-Arba e Hebrom.
- source_word: צִיעֹר
  choice: Zior
  rationale: Nome geográfico transliterado sem tentar atribuir-lhe um significado não explicitado no contexto.
- source_word: עָרִים תֵּשַׁע
  choice: nove cidades
  rationale: Preserva a contagem do texto e emprega a tradução convencional de עָרִים nas listas territoriais.
- source_word: חַצְרֵיהֶן
  choice: seus povoados
  rationale: O termo designa aqui núcleos menores associados às cidades; “povoados” é natural e não especifica indevidamente se eram aldeias muradas ou não.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos familiares ao público lusófono. A estrutura concisa da lista territorial foi preservada. Os marcadores foram posicionados junto às expressões que cada nota explica.
