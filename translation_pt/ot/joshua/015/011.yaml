base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: pt
  text: Então a fronteira seguia até o flanco de Ecrom, ao norte[a]; virava-se em direção a Siquerom[b], atravessava o monte Baalá e seguia até Jabneel. As extremidades da fronteira ficavam junto ao mar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o lado norte de Ecrom”. O hebraico combina “flanco de Ecrom” com uma forma que indica direção para o norte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fazia uma curva em direção a Siquerom”. O verbo descreve a mudança de direção da linha da fronteira.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “as extremidades da fronteira ficavam em direção ao mar” ou “para o oeste”. Provavelmente indica que a fronteira terminava no mar Mediterrâneo, a oeste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: seguia
  rationale: Nas descrições de limites territoriais, o verbo indica que a linha da fronteira prossegue até o ponto geográfico seguinte. “Seguia” comunica isso naturalmente em português e permite conservar a sequência dos movimentos.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto da demarcação territorial, “fronteira” designa com clareza a linha divisória e soa natural em português moderno.
- source_word: כֶּתֶף
  choice: flanco
  rationale: O substantivo significa literalmente “ombro” e, em linguagem topográfica, refere-se ao lado, à encosta ou ao flanco de um lugar. “Flanco” preserva a imagem geográfica sem causar a estranheza de “ombro de Ecrom”.
- source_word: עֶקְרוֹן צָפוֹנָה
  choice: Ecrom, ao norte
  rationale: A forma direcional צָפוֹנָה expressa orientação para o norte. A redação mantém aberta a possibilidade de se tratar do lado norte de Ecrom ou do movimento da fronteira nessa direção.
- source_word: תָּאַר
  choice: fazia uma curva em direção a
  rationale: Na fórmula de delimitação, o verbo descreve a mudança de direção ou o traçado da linha da fronteira. A expressão escolhida é clara e topograficamente adequada.
- source_word: שִׁכְּרוֹנָה
  choice: Siquerom
  rationale: Nome geográfico transliterado segundo uma forma legível e natural em português.
- source_word: עָבַר
  choice: passava por
  rationale: O verbo indica que a linha atravessava ou transpunha um acidente geográfico. “Passava por” é natural sem especificar além do hebraico o modo exato da travessia.
- source_word: הַר הַבַּעֲלָה
  choice: monte Baalá
  rationale: הַר designa uma elevação, e “monte” é a forma convencional em topônimos portugueses. Baalá é mantido como nome próprio.
- source_word: יַבְנְאֵל
  choice: Jabneel
  rationale: O topônimo é transliterado, e não traduzido.
- source_word: תֹּצְאוֹת הַגְּבוּל
  choice: a fronteira terminava
  rationale: A expressão hebraica, literalmente relacionada às “saídas” ou “extremidades” da fronteira, indica aqui seu ponto terminal. A formulação portuguesa expressa o sentido geográfico com clareza.
- source_word: יָמָּה
  choice: no mar
  rationale: A forma pode significar “em direção ao mar” ou “para o oeste”. Nesta cláusula terminal, o mar é apresentado naturalmente como o ponto em que a fronteira chegava ao fim, provavelmente o Mediterrâneo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição hebraica dos verbos de movimento foi parcialmente variada para evitar rigidez, sem apagar a progressão geográfica. Os topônimos seguem formas portuguesas legíveis; as ambiguidades topográficas de צָפוֹנָה, תָּאַר e יָמָּה são preservadas nas notas.
