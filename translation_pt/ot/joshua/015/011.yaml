  terminology: “Fronteira”, “flanco”, “Ecrom”, “Siquerom”, “monte Baalá” e “Jabneel” são escolhas aceitáveis. “Extremidades da fronteira” recupera o plural de תּוֹצְאוֹת sem recorrer ao arcaísmo “saídas”.
