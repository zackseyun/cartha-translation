- source_word: יִפְתָּח
  choice: Iftá
  rationale: Topônimo hebraico transliterado em forma natural para leitores de português. “Iftá” representa de modo claro a forma massorética e evita confundi-la silenciosamente com o nome pessoal mais conhecido, Jefté.
- source_word: אַשְׁנָה
  choice: Asná
  rationale: Topônimo transliterado segundo convenções legíveis em português, com acento para indicar a tonicidade final.
- source_word: נְצִיב
  choice: Nezibe
  rationale: Topônimo transliterado em forma compatível com a fonologia e a ortografia do português; a vogal final auxilia a leitura da consoante hebraica final.
- source_word: וְ
  choice: e
  rationale: A conjunção prefixada liga cada cidade à enumeração iniciada nos versículos anteriores; sua repetição preserva a estrutura serial do hebraico.
