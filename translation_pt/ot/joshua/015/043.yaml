    issue: «Nezibe» e a nota «Netsibe» não correspondem entre si nem representam de modo consistente o tsade de נְצִיב.
    rationale: A grafia principal com z sugere um som que não é o da consoante hebraica. «Nesibe» é a adaptação portuguesa convencional; «Netsibe» pode ser indicada como alternativa transliteracional.
  - severity: medium
    issue: A nota de Iftá identifica «Jeftá» como forma tradicional.
    rationale: Em português bíblico, o juiz é normalmente «Jefté», enquanto o topônimo desta lista é tradicionalmente «Jiftá». A nota atual favorece uma associação enganosa.
  - severity: low
    issue: O texto começa com «e» minúsculo.
    rationale: Embora a conjunção inicial seja fiel à continuidade sintática, a capitalização inicial é a convenção editorial normal para o versículo em português.
