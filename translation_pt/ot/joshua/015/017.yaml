base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: pt
  text: Otniel, filho de Quenaz, irmão de Calebe,[a] conquistou a cidade.[b] Então Calebe lhe deu sua filha Acsa como esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “parente de Calebe”, pois “irmão” às vezes pode designar um familiar próximo. A construção hebraica também pode ser entendida como se “irmão de Calebe” descrevesse Quenaz; a leitura adotada no texto o relaciona a Otniel.
    reason: lexical_alternative
  - marker: b
    text: Isto é, Quiriate-Sefer, também chamada Debir, mencionada no versículo anterior.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: conquistou a cidade
  rationale: O verbo לכד expressa capturar ou tomar, especialmente uma cidade. O sufixo feminino singular retoma a cidade mencionada no versículo anterior; explicitar “a cidade” torna a referência natural em português sem acrescentar informação nova.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Forma tradicional e amplamente reconhecível do nome em português.
- source_word: בֶּן קְנַז
  choice: filho de Quenaz
  rationale: Reproduz diretamente a relação filial expressa pela construção hebraica.
- source_word: אֲחִי כָלֵב
  choice: irmão de Calebe
  rationale: É o sentido direto de אָח no contexto. Uma nota preserva a possibilidade lexical mais ampla de “parente” e a possível ambiguidade de ligação sintática.
- source_word: וַיִּתֶּן לוֹ
  choice: Então Calebe lhe deu
  rationale: 'Os referentes dos pronomes são explicitados apenas onde isso evita confusão em português: Calebe é quem dá, e “lhe” se refere a Otniel. “Então” mantém a progressão narrativa do wayyiqtol.'
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: sua filha Acsa
  rationale: A ordem foi ajustada ao português corrente, preservando o nome e a relação familiar.
- source_word: לְאִשָּׁה
  choice: por esposa
  rationale: Expressão portuguesa natural para a fórmula hebraica de dar alguém em casamento, sem desenvolver além do que o texto afirma.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os nomes seguem formas bíblicas portuguesas correntes. A repetição de “Calebe” esclarece os referentes pronominais do hebraico, e as notas preservam a referência retrospectiva e a ambiguidade familiar.
