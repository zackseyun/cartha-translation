  source_fidelity: 'O texto traduz com precisão a sequência hebraica: a ordem ao povo, a condição temporal, a arca da aliança de Yahweh como Deus do povo, os sacerdotes levitas que a carregam e a instrução de partir e segui-la. “Saiam do lugar onde estiverem” comunica adequadamente o sentido amplo de מִמְּקוֹמְכֶם sem introduzir a especificação de desarmar o acampamento.'
  naturalness: O português é moderno, claro e digno. O emprego de “vocês” e dos imperativos plurais é natural para ampla legibilidade, especialmente brasileira, sem comprometer a compreensão internacional. “Sigam atrás dela” conserva de modo inteligível a imagem espacial de ir após a arca.
  terminology: “Arca da aliança”, “Yahweh”, “o Deus de vocês” e “sacerdotes levitas” são escolhas adequadas. A nota preserva de maneira apropriada a alternativa apositiva de הַכֹּהֲנִים הַלְוִיִּם, sem impor que haja dois grupos distintos no texto principal.
