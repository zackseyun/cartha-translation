  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: pt
  text: 'Eles ordenaram ao povo: “Quando vocês virem a arca da aliança de Yahweh, o Deus de vocês, e os sacerdotes levitas[a] carregando-a, saiam do lugar onde estiverem e sigam atrás dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sacerdotes, os levitas”.'
    reason: Alternativa lexical e sintática para a construção apositiva הַכֹּהֲנִים הַלְוִיִּם.
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: Eles ordenaram
  rationale: O piel de צוה expressa uma ordem ou incumbência com autoridade; “ordenaram” preserva essa força de modo direto e natural.
- source_word: הָעָם
  choice: ao povo
  rationale: עם designa aqui os israelitas reunidos como coletividade; “o povo” é o equivalente corrente e adequado.
- source_word: לֵאמֹר
  choice: introdução por dois-pontos
  rationale: O infinitivo hebraico introduz o discurso direto. Em português atual, os dois-pontos comunicam essa função naturalmente, sem a fórmula mais pesada “dizendo”.
- source_word: כִּרְאוֹתְכֶם
  choice: Quando vocês virem
  rationale: A construção com כ e infinitivo é temporal. “Quando vocês virem” preserva o sentido sem acrescentar a ideia mais forte de imediatismo.
- source_word: אֲרוֹן בְּרִית
  choice: a arca da aliança
  rationale: É a expressão consagrada e semanticamente precisa neste contexto cultual.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, o Deus de vocês
  rationale: “Yahweh” translitera o nome divino, enquanto “o Deus de vocês” torna inequívoco em português moderno o sufixo plural dirigido ao povo.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: A expressão identifica os sacerdotes como levitas e evita sugerir, no texto principal, dois grupos distintos; a estrutura apositiva possível é preservada em nota.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: carregando-a
  rationale: נשא significa carregar ou levar; o pronome feminino retoma naturalmente “arca” em português.
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: saiam do lugar onde estiverem
  rationale: נסע indica pôr-se em marcha, e מקום é amplo. A formulação natural preserva o movimento a partir da posição ocupada sem especificar indevidamente “levantar acampamento”.
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: e sigam atrás dela
  rationale: הלך אחרי descreve ir atrás ou seguir. A formulação conserva tanto o sentido de acompanhamento quanto a imagem espacial do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Relação entre הַכֹּהֲנִים e הַלְוִיִּם
  choice: os sacerdotes levitas
  alternative: os sacerdotes, os levitas
  rationale: A leitura adjetival comunica com clareza que os sacerdotes mencionados são levitas, sem eliminar a possível percepção da construção hebraica como aposição, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural dirigido ao povo e formas imperativas naturais para a instrução. O marcador [a] foi colocado junto à expressão a que a nota efetivamente se refere.
