base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: pt
  text: Contudo, haverá entre vocês e ela uma distância de cerca de dois mil côvados medidos.[a] Não se aproximem dela, para que saibam o caminho pelo qual seguirão, pois vocês ainda não passaram por esse caminho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um côvado era uma antiga unidade de comprimento, aproximadamente equivalente à distância do cotovelo à ponta dos dedos.
    reason: cultural_note
  - marker: b
    text: Literalmente, «desde ontem e anteontem», expressão idiomática que significa «anteriormente» ou «até agora».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Contudo
  rationale: Introduz uma ressalva contrastiva à ordem anterior, em português atual e digno.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: haverá entre vocês e ela uma distância
  rationale: Preserva a formulação descritiva do hebraico, em vez de convertê-la diretamente em imperativo; «ela» retoma naturalmente a arca em português.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: cerca de dois mil côvados, conforme a medida
  rationale: Mantém a unidade antiga, expressa a aproximação indicada por כְּ e conserva a referência explícita à medição.
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: Não se aproximem dela
  rationale: Traduz diretamente a proibição espacial e mantém como referente a arca.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: para que saibam
  rationale: Expressa com clareza a finalidade indicada pela construção hebraica.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: o caminho pelo qual devem seguir
  rationale: «Caminho» é natural para דֶּרֶךְ; «devem seguir» comunica a rota a ser tomada no contexto, sem tornar a frase artificial.
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: pois vocês nunca passaram por esse caminho
  rationale: «Passar por esse caminho» representa de modo idiomático o deslocamento; «nunca» funciona com «antes» para transmitir a ausência de experiência prévia.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: antes
  rationale: Traduz idiomaticamente a expressão temporal hebraica, cujo sentido é «anteriormente» ou «até agora».
