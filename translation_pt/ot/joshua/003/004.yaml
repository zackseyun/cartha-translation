    rationale: A expressão מִתְּמוֹל שִׁלְשׁוֹם significa idiomaticamente «anteriormente/até agora». «Ainda não passaram» expressa com naturalidade essa falta de experiência prévia, sem a dupla intensificação.
  - severity: low
    issue: «conforme a medida» é pouco natural.
    rationale: Embora tente reproduzir בַּמִּדָּה, a locução não é corrente nesse uso. «Medidos» mantém explicitamente a noção de medida.
