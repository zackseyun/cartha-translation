  source_fidelity: 'A tradução preserva bem a estrutura e o sentido geral: a distância em relação à arca, a proibição de aproximação e a finalidade de reconhecer a rota. Contudo, «devem seguir» acrescenta uma força de obrigação que não está explicitamente marcada pelo imperfeito hebraico, e «nunca ... antes» é mais enfático e redundante em português em comparação com o sentido de «não anteriormente / até agora».'
  naturalness: «Conforme a medida» soa pouco idiomático no português atual nessa posição. «Medidos» conserva a indicação de medição de בַּמִּדָּה com formulação clara. A redação revista também elimina a duplicação de «nunca» e «antes».
  terminology: «Côvados» é o termo histórico adequado e a nota cultural é precisa. «Ela» e «dela» podem retomar naturalmente a arca, substantivo feminino em português. «Contudo» é uma boa opção para אַךְ no contexto.
