lexical_decisions:
- source_word: וַיְהִי
  choice: Ao
  rationale: A forma narrativa introduz o acontecimento seguinte. Em português atual, a transição é expressa naturalmente pela oração temporal, sem reproduzir literalmente a fórmula hebraica.
- source_word: מִקְצֵה
  choice: ao fim de
  rationale: Preserva a ideia de limite temporal e soa natural em português.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: três dias
  rationale: Correspondência direta e clara da expressão temporal hebraica.
- source_word: וַיַּעַבְרוּ
  choice: passaram
  rationale: O verbo indica deslocamento através de um espaço; neste contexto, não se trata de atravessar o rio, mas de circular pelo interior do acampamento.
- source_word: הַשֹּׁטְרִים
  choice: os oficiais
  rationale: Designa agentes encarregados de transmitir e executar ordens no contexto administrativo e militar de Israel.
- source_word: בְּקֶרֶב
  choice: pelo meio de
  rationale: Conserva a imagem espacial do interior do acampamento e, com o verbo de movimento, expressa percurso através dele.
- source_word: הַמַּחֲנֶה
  choice: o acampamento
  rationale: Termo corrente e preciso para o local onde Israel estava acampado.
