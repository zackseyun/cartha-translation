  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: pt
  text: Os sacerdotes que carregavam a arca da aliança de Yahweh[a] ficaram firmes[b] em terra seca, no meio do Jordão, enquanto todo o Israel atravessava em terra seca, até que toda a nação[c] terminou de atravessar o Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a arca da aliança pertencente a Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico enfatiza que os sacerdotes permaneceram firmes, fixos em seu lugar no leito do rio.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “todo o povo”. O hebraico emprega um termo coletivo singular para Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: ficaram
  rationale: O Qal narrativo de עמד pode indicar tanto assumir quanto manter uma posição. “Ficaram” combina naturalmente com “firmes” e ressalta que os sacerdotes permaneceram no lugar durante a travessia.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: os sacerdotes que carregavam
  rationale: O particípio נֹשְׂאֵי descreve a ação contínua dos sacerdotes. A oração relativa é clara e natural em português moderno.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: A formulação preserva de modo transparente a cadeia construta hebraica e mantém a relação entre a arca, a aliança e Yahweh sem especificá-la além do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֶּחָרָבָה
  choice: em terra seca
  rationale: A expressão designa o solo antes coberto pela água e agora seco. A mesma tradução é mantida nas duas ocorrências do versículo.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: no meio do Jordão
  rationale: בְּתוֹךְ indica o interior ou a parte central; “no meio do Jordão” é claro e corrente.
- source_word: הָכֵן
  choice: firmes
  rationale: Neste contexto, o termo comunica estabilidade e posição fixa, não preparação. A construção idiomática portuguesa “ficaram firmes” transmite esse sentido.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: enquanto todo o Israel atravessava
  rationale: O particípio apresenta uma ação em andamento e simultânea à permanência dos sacerdotes. “Enquanto” torna essa relação temporal natural em português.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: até que ... terminou
  rationale: 'Marca o ponto final da ação contínua: a travessia prosseguiu até sua conclusão.'
- source_word: כָּל הַגּוֹי
  choice: toda a nação
  rationale: גּוֹי é um substantivo coletivo singular. “Toda a nação” preserva essa forma, embora “todo o povo” também seja possível.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: de atravessar o Jordão
  rationale: Após “terminou”, o infinitivo preposicionado produz uma construção idiomática em português e expressa a ação completada.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto, sem substituí-lo por um título.
- issue: Relação expressa em בְּרִית יְהוָה
  choice: aliança de Yahweh
  alternative: aliança pertencente a Yahweh
  rationale: O construto hebraico permite uma relação genitiva ampla. A tradução mantém essa amplitude e não acrescenta uma explicação teológica ausente do versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe natural para leitores brasileiros e internacionais. Conserva a repetição de “em terra seca”, o aspecto contínuo da travessia e o nome divino Yahweh.
