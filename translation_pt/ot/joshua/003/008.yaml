base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: pt
  text: 'E você ordenará aos sacerdotes que carregam a arca da aliança: “Quando chegarem à beira das águas do Jordão[a], fiquem de pé no Jordão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a margem das águas do Jordão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: E você
  rationale: Preserva tanto a ligação com o contexto anterior quanto a ênfase do pronome independente dirigido a Josué, em português atual e claro.
- source_word: תְּצַוֶּה
  choice: ordenará
  rationale: O piel imperfeito expressa a instrução que Josué deverá transmitir; o futuro mantém a força diretiva e o tom narrativo.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: aos sacerdotes que carregam
  rationale: Traduz o particípio atributivo por uma oração relativa natural em português, sem perder a identificação dos sacerdotes como os portadores.
- source_word: אֲרוֹן הַבְּרִית
  choice: a arca da aliança
  rationale: Reproduz com precisão a cadeia de construto e conserva a terminologia bíblica reconhecível.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português, os dois-pontos introduzem de modo natural o conteúdo da ordem, evitando o calque pouco fluente “dizendo”.
- source_word: כְּבֹאֲכֶם
  choice: Quando chegarem
  rationale: Expressa naturalmente o valor temporal da preposição com o infinitivo e mantém o referente plural, os sacerdotes.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: à beira das águas do Jordão
  rationale: Comunica o limite ou margem alcançado pelos sacerdotes. A formulação é idiomática, enquanto a nota registra uma alternativa igualmente possível para קְצֵה.
- source_word: בַּיַּרְדֵּן תַּעֲמֹדוּ
  choice: fiquem parados no Jordão
  rationale: Representa o sentido locativo de ב e a ordem dada pelo imperfeito de עמד; “fiquem parados” deixa claro que os sacerdotes devem tomar posição dentro do rio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A fala direta usa imperativo natural; o marcador da nota foi colocado junto à expressão à qual a alternativa lexical realmente se refere.
