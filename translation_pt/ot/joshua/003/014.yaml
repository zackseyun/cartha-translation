  source_fidelity: 'A tradução reproduz adequadamente a estrutura e os elementos essenciais do hebraico: a introdução narrativa, a saída do povo de suas tendas, o propósito de atravessar o Jordão e a posição dos sacerdotes que levavam a arca da aliança à frente do povo. O imperfeito português «carregavam» é apropriado para o particípio hebraico «portadores de/carregando».'
