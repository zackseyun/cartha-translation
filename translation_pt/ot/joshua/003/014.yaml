  text: וַ/יְהִ֗י בִּ/נְסֹ֤עַ הָ/עָם֙ מֵ/אָ֣הֳלֵי/הֶ֔ם לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/הַ/כֹּהֲנִ֗ים נֹֽשְׂאֵ֛י הָ/אָר֥וֹן הַ/בְּרִ֖ית לִ/פְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: pt
  text: E aconteceu que, quando o povo partiu de suas tendas para atravessar o Jordão, os sacerdotes que carregavam a arca da aliança estavam à frente do povo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: adiante do povo.'
    reason: Alternativa contextual para לִפְנֵי, que pode indicar tanto posição à frente quanto avanço diante do grupo.
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: A fórmula narrativa introduz o novo acontecimento. A tradução preserva essa função sem recorrer à expressão arcaica «e sucedeu que».
- source_word: בִּנְסֹעַ הָעָם
  choice: quando o povo partiu
  rationale: O infinitivo construto com בְּ expressa circunstância temporal; «partiu» comunica naturalmente a saída do acampamento.
- source_word: מֵאָהֳלֵיהֶם
  choice: de suas tendas
  rationale: Mantém o sentido concreto de אֹהֶל no contexto do acampamento de Israel.
- source_word: לַעֲבֹר אֶת־הַיַּרְדֵּן
  choice: para atravessar o Jordão
  rationale: O infinitivo indica propósito, e «atravessar» é a formulação idiomática para a travessia de um rio.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: os sacerdotes que carregavam
  rationale: Expressa em português corrente a construção nominal hebraica «os sacerdotes, carregadores de», sem transformar a relação sintática em mera circunstância acompanhante.
- source_word: הָאָרוֹן הַבְּרִית
  choice: a arca da aliança
  rationale: Preserva a terminologia bíblica estabelecida para a arca cultual e para בְּרִית.
- source_word: לִפְנֵי הָעָם
  choice: à frente do povo
  rationale: Comunica diretamente a posição espacial dos sacerdotes em relação ao povo, mantendo a possibilidade contextual de movimento adiante dele.
