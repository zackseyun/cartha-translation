  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל הַ/כֹּהֲנִ֣ים לֵ/אמֹ֔ר שְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וְ/עִבְר֖וּ לִ/פְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וַ/יֵּלְכ֖וּ לִ/פְנֵ֥י הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: pt
  text: 'Então Josué disse aos sacerdotes: “Levantem a arca da aliança e atravessem à frente do povo.” Eles levantaram a arca da aliança e foram à frente do povo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar. “Então” expressa de modo natural em português a sequência dos acontecimentos.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הַכֹּהֲנִים
  choice: aos sacerdotes
  rationale: Tradução direta do substantivo definido plural que designa os oficiais cultuais de Israel.
- source_word: שְׂאוּ / וַיִּשְׂאוּ
  choice: Levantem / levantaram
  rationale: נשא, neste contexto, envolve erguer a arca para transportá-la. A repetição do mesmo verbo preserva a correspondência entre a ordem e seu cumprimento.
- source_word: אֲרוֹן הַבְּרִית
  choice: a arca da aliança
  rationale: Expressão tradicional, transparente e natural em português para a construção hebraica que associa a arca à aliança.
- source_word: וְעִבְרוּ
  choice: atravessem
  rationale: עבר indica atravessar ou passar para o outro lado; no contexto da travessia do Jordão, “atravessem” comunica o sentido com clareza sem explicitação indevida.
- source_word: לִפְנֵי הָעָם
  choice: à frente do povo
  rationale: לִפְנֵי indica posição diante ou à frente de alguém. “À frente do povo” é natural e deixa claro que os sacerdotes deviam precedê-lo.
- source_word: וַיֵּלְכוּ
  choice: foram
  rationale: הלך é o verbo comum para ir ou andar. “Foram” é a forma narrativa mais natural e não acrescenta uma maneira específica de locomoção.
theological_decisions:
- issue: Terminologia da aliança em contexto cultual
  choice: a arca da aliança
  alternative: a arca da Aliança; a arca da aliança pactual
  rationale: A formulação tradicional representa adequadamente o construto hebraico e identifica o objeto sagrado por sua relação com a aliança, sem acrescentar uma interpretação teológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. O paralelismo verbal entre a ordem e a obediência foi preservado. Não são necessárias notas de rodapé neste versículo.
