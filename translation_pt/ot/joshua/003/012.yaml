  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: pt
  text: Agora, escolham doze homens dentre as tribos de Israel, um de cada tribo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a instrução seguinte na sequência narrativa; em português atual, “Agora” preserva naturalmente a transição discursiva sem exigir a reprodução de וְ como “E”.
- source_word: קְחוּ לָכֶם
  choice: escolham
  rationale: Neste contexto, לקח designa tomar ou selecionar representantes. “Escolham” expressa com clareza a ação pretendida; o benefício ou propósito indicado por לָכֶם fica implícito de modo natural no português.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: doze homens
  rationale: אִישׁ se refere aqui aos representantes masculinos escolhidos das tribos; “homens” preserva essa referência.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: dentre as tribos de Israel
  rationale: A preposição מִן indica a procedência dos homens. “Dentre” comunica de modo idiomático que eles seriam selecionados do conjunto das tribos.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: um de cada tribo
  rationale: 'A repetição hebraica tem sentido distributivo: deve ser escolhido exatamente um representante por tribo. A formulação portuguesa preserva esse sentido com naturalidade.'
