    text: 'Ou: “a arca do Senhor de toda a terra”. No hebraico, “Senhor de toda a terra” pode ser entendido como estreitamente ligado a “arca”; o texto principal o toma como um título em aposição a Yahweh.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “as águas que vêm descendo de montante”.'
    reason: lexical_alternative
  revision_rationale: A revisão restaura explicitamente a repetição de “as águas do Jordão” e liga a caracterização “as águas que descem de cima” ao referente correto. Também desloca a nota b para a expressão que ela explica e torna mais natural a descrição do contato dos pés com as águas, sem alterar o sentido nem resolver de modo excessivo a sintaxe discutida do título divino.
