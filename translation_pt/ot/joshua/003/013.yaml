revisions:
- from: E, quando as plantas dos pés dos sacerdotes que carregam a arca de Yahweh[a], o Senhor de toda a terra, repousarem nas águas do Jordão, as águas que descem de cima serão interrompidas no Jordão[b] e ficarão paradas num só montão.
  to: E, quando as plantas dos pés dos sacerdotes que carregam a arca de Yahweh[a], o Senhor de toda a terra, pousarem nas águas do Jordão, as águas do Jordão — as águas que descem de cima[b] — serão interrompidas e ficarão paradas, formando um só montão.
  rationale: A revisão restaura explicitamente a repetição de “as águas do Jordão” e liga a caracterização “as águas que descem de cima” ao referente correto. Também desloca a nota b para a expressão que ela explica e torna mais natural a descrição do contato dos pés com as águas, sem alterar o sentido nem resolver de modo excessivo a sintaxe discutida do título divino.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:07:52Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a condição futura, os sacerdotes portando a arca, o nome Yahweh, o título divino e o represamento milagroso das águas. Contudo, a segunda ocorrência de “águas do Jordão” no hebraico é melhor preservada explicitamente, em vez de ser diluída em “serão interrompidas no Jordão”.
  naturalness: “Plantas dos pés” é preciso e compreensível. “Pousarem nas águas” soa mais natural em português do que “repousarem nas águas” e conserva a ideia de as plantas dos pés chegarem a apoiar-se na água. A reformulação final mantém uma ordem clara sem perder a imagem de águas acumuladas.
  terminology: “Yahweh” e “Senhor de toda a terra” estão bem distinguidos. A nota a preserva corretamente a alternativa sintática. A âncora b deve acompanhar “as águas que descem de cima”, pois é essa expressão, e não “Jordão”, que a nota alternativa esclarece.
  issues:
  - severity: medium
    issue: A repetição hebraica “as águas do Jordão ... as águas que descem de cima” foi parcialmente substituída por uma indicação locativa (“no Jordão”).
    rationale: O hebraico identifica expressamente as águas que serão cortadas como “as águas do Jordão” e então as caracteriza como as que descem de cima. Manter ambas as formulações evita reduzir a repetição enfática do texto-fonte.
  - severity: medium
    issue: A nota b está ancorada em “Jordão”, embora explique a expressão “as águas que descem de cima”.
    rationale: A âncora deve ser deslocada para a expressão que recebe a alternativa “de montante”, assegurando correspondência textual entre nota e palavra explicada.
  - severity: low
    issue: “Repousarem nas águas” é menos idiomático para plantas dos pés que chegam a tocar e apoiar-se na água.
    rationale: “Pousarem nas águas” é uma formulação mais fluida e preserva o sentido temporal-concreto de כְּנוֹחַ.
  revised_text: E, quando as plantas dos pés dos sacerdotes que carregam a arca de Yahweh[a], o Senhor de toda a terra, pousarem nas águas do Jordão, as águas do Jordão — as águas que descem de cima[b] — serão interrompidas e ficarão paradas, formando um só montão.
  revised_footnotes:
