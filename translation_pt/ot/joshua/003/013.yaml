source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: pt
  text: E, quando as plantas dos pés dos sacerdotes que carregam a arca de Yahweh[a], o Senhor de toda a terra, pousarem nas águas do Jordão, as águas do Jordão — as águas que descem de cima[b] — serão interrompidas e ficarão paradas, formando um só montão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a arca do Senhor de toda a terra”. No hebraico, “Senhor de toda a terra” pode ser entendido como estreitamente ligado a “arca”; o texto principal o toma como um título em aposição a Yahweh.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “as águas que vêm descendo de montante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: E, quando ... repousarem
  rationale: A construção introduz a circunstância futura. “Quando ... repousarem” expressa de modo natural o valor temporal de כְּ e o sentido de נוח, sem tornar a fórmula excessivamente literal.
- source_word: כַּפּוֹת רַגְלֵי
  choice: as plantas dos pés
  rationale: כַּף, nesta expressão, designa a parte inferior do pé. “Plantas dos pés” é preciso e corrente em português.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: os sacerdotes que carregam a arca
  rationale: O particípio de נשא caracteriza os sacerdotes como os que transportam a arca. “Carregam” é moderno e claro.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, distinguindo-o do título אֲדוֹן, traduzido por “Senhor”.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: o Senhor de toda a terra
  rationale: Traduz o título de soberania universal e, no texto principal, o apresenta em aposição a Yahweh.
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: nas águas do Jordão
  rationale: A preposição בְּ indica aqui contato ou posição nas águas; “nas águas” é idiomático e fiel.
- source_word: יִכָּרֵתוּן
  choice: serão interrompidas
  rationale: O nifal de כרת indica que as águas serão cortadas ou detidas. “Serão interrompidas” comunica claramente a cessação do fluxo sem sugerir um corte físico comum em português.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: as águas que descem de cima
  rationale: Preserva a imagem vertical e a formulação do hebraico; no contexto fluvial, refere-se às águas vindas de montante.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: e ficarão paradas num só montão
  rationale: יַעַמְדוּ expressa permanência ou imobilidade, e נֵד designa uma massa acumulada. A formulação mantém a imagem extraordinária das águas amontoadas.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto contém diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome próprio e permite distinguir o nome do título “Senhor” que vem em seguida.
- issue: Relação sintática de “Senhor de toda a terra” com a expressão anterior
  choice: 'Título em aposição a Yahweh: “a arca de Yahweh, o Senhor de toda a terra”'
  alternative: “a arca do Senhor de toda a terra”
  rationale: A sequência hebraica permite estreitar a ligação do título com “arca”, mas o texto principal entende “Senhor de toda a terra” como título apositivo que identifica Yahweh. A nota preserva a leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a imagem concreta das plantas dos pés e das águas reunidas num montão, ao mesmo tempo que evita construções desnecessariamente arcaicas. Os dois marcadores de nota aparecem no texto principal.
