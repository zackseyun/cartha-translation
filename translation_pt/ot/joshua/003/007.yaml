source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: pt
  text: 'E Yahweh disse a Josué: “Hoje começarei a engrandecer você aos olhos de todo o Israel[a], para que saibam que, assim como estive com Moisés, estarei com você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “neste dia começarei a engrandecer você diante de todo o Israel”.'
    reason: Registra alternativas formais para הַיּוֹם הַזֶּה e para o idioma בְּעֵינֵי, sem alterar o sentido básico.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: A forma narrativa hebraica dá continuidade ao relato; “E ... disse” preserva essa ligação de modo natural e digno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הַיּוֹם הַזֶּה
  choice: Hoje
  rationale: Equivalente corrente de “este dia”, mantendo a ênfase temporal sem soar arcaico.
- source_word: אָחֵל
  choice: começarei
  rationale: O hifil expressa o início de uma ação; o futuro se ajusta à declaração divina sobre o que ocorrerá naquele dia.
- source_word: גַּדֶּלְךָ
  choice: a engrandecer você
  rationale: O piel de גדל indica tornar grande ou elevar publicamente. “Engrandecer” preserva essa ideia sem especificar indevidamente o meio.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: aos olhos de todo o Israel
  rationale: Mantém a imagem hebraica e comunica que Josué seria elevado na percepção pública de Israel.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: para que saibam
  rationale: Expressa naturalmente a finalidade ou o resultado pretendido, sem eliminar a sobreposição possível entre ambos.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: assim como estive com Moisés
  rationale: Reproduz a comparação explícita entre a presença de Deus com Moisés e com Josué.
- source_word: אֶהְיֶה עִמָּךְ
  choice: estarei com você
  rationale: Verte diretamente a promessa futura da presença divina em português atual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Iavé; Jeová; SENHOR
  rationale: O texto hebraico emprega o nome pessoal divino. “Yahweh” o preserva por transliteração, sem trocá-lo por um título nem adotar outra forma tradicional.
- issue: Natureza do engrandecimento de Josué
  choice: engrandecer você aos olhos de todo o Israel
  alternative: exaltar você diante de todo o Israel
  rationale: A formulação mantém o foco textual na condição pública de Josué perante Israel, sem acrescentar uma interpretação sobre poder, santidade ou mérito pessoal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva a coordenação narrativa inicial, o nome divino e a imagem hebraica “aos olhos de”, evitando arcaísmos como “magnificar-te” ou “serei contigo”.
