base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: pt
  text: as águas que desciam do alto pararam[a] e se elevaram num só amontoado, muito longe, em Adã, cidade situada ao lado de Zaretã. As águas que desciam em direção ao mar da Arabá, o mar Salgado[b], foram totalmente interrompidas, e o povo atravessou em frente de Jericó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficaram erguidas como um só amontoado”. A imagem hebraica apresenta as águas detidas e acumuladas numa única massa.'
    reason: lexical_alternative
  - marker: b
    text: O “mar Salgado” é o corpo de água que mais tarde passou a ser conhecido comumente como mar Morto.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: pararam
  rationale: O verbo עמד significa literalmente ficar de pé ou permanecer; aplicado às águas do rio, indica que elas deixaram de correr. “Pararam” comunica isso com clareza, enquanto a nota preserva a imagem hebraica.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: as águas que desciam do alto
  rationale: A expressão descreve as águas que vinham da parte mais elevada, isto é, de montante. “Do alto” conserva o sentido espacial sem acrescentar uma explicação geográfica ao texto.
- source_word: קָמוּ נֵד אֶחָד
  choice: se elevaram num só amontoado
  rationale: A combinação retrata as águas erguendo-se e acumulando-se como uma única massa. “Amontoado” mantém a imagem concreta de נֵד.
- source_word: הַרְחֵק מְאֹד
  choice: muito longe dali
  rationale: A construção intensifica a distância. “Muito longe dali” é natural em português e relaciona a localização ao ponto da travessia.
- source_word: בְאָדָם
  choice: em Adã
  rationale: אָדָם é aqui o nome de uma cidade, não o substantivo comum “homem”. Emprega-se a forma portuguesa tradicional do topônimo.
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: cidade situada ao lado de Zaretã
  rationale: מִצַּד indica proximidade ou posição ao lado de algo. A formulação conserva a informação geográfica de modo fluente.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: As águas que desciam em direção ao mar da Arabá
  rationale: O particípio retoma as águas que seguiam rio abaixo, e עַל tem aqui sentido direcional. A repetição de “as águas” esclarece o referente implícito.
- source_word: יָם הַמֶּלַח
  choice: o mar Salgado
  rationale: Tradução direta da designação hebraica, sem substituí-la pelo nome posterior “mar Morto”.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: foram totalmente interrompidas
  rationale: Os dois verbos juntos enfatizam que o fluxo rio abaixo cessou por completo. A formulação portuguesa reúne essa força cumulativa sem redundância artificial.
- source_word: וְהָעָם עָבְרוּ
  choice: e o povo atravessou
  rationale: No contexto narrativo, עבר descreve a travessia do Jordão. O objeto pode permanecer implícito, como no hebraico.
- source_word: נֶגֶד יְרִיחוֹ
  choice: diante de Jericó
  rationale: נֶגֶד indica uma posição em frente ou defronte da cidade. “Diante de Jericó” preserva essa relação geográfica.
