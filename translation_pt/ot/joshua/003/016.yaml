  - severity: low
    issue: «Diante de Jericó» é menos específico para נֶגֶד neste contexto geográfico.
    rationale: «Em frente de Jericó» preserva melhor o sentido locativo de defronte/oposto, sem sugerir apenas anterioridade ou presença perante a cidade.
