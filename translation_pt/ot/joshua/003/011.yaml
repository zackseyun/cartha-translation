  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: pt
  text: 'Vejam: a arca da aliança do Senhor de toda a terra está atravessando o Jordão à frente de vocês.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “está passando à frente de vocês no Jordão”.'
    reason: Alternativa lexical que conserva mais explicitamente a preposição hebraica בְּ (“em/no”) e traduz עֹבֵר por “passando”.
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam
  rationale: Partícula que chama a atenção dos ouvintes. “Vejam” conserva a vivacidade do hebraico em português atual, sem o tom arcaizante de “eis”.
- source_word: אֲרוֹן הַבְּרִית
  choice: a arca da aliança
  rationale: Reproduz com clareza e naturalidade a relação construta do hebraico e corresponde à expressão bíblica consagrada em português.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: o Senhor de toda a terra
  rationale: אֲדוֹן é aqui um título de soberania. “Senhor” preserva seu peso e seu registro bíblico sem acrescentar uma interpretação doutrinária.
- source_word: עֹבֵר
  choice: está atravessando
  rationale: O particípio apresenta a ação vividamente como em curso ou iminente; a locução progressiva comunica esse aspecto no contexto narrativo.
- source_word: לִפְנֵיכֶם
  choice: à frente de vocês
  rationale: Indica que a arca avança antes do povo. A formulação é clara e corrente em português amplamente compreensível.
- source_word: בַּיַּרְדֵּן
  choice: o Jordão
  rationale: Com o verbo “atravessar”, o português emprega naturalmente o rio como objeto direto. Essa reestruturação expressa o movimento pelo Jordão sem dar à frase um sentido estático.
theological_decisions:
- issue: Relação sintática de אֲדוֹן כָּל הָאָרֶץ com אֲרוֹן הַבְּרִית
  choice: a arca da aliança, o Senhor de toda a terra
  alternative: a arca da aliança do Senhor de toda a terra
  rationale: A pontuação massorética separa “a arca da aliança” do título seguinte, favorecendo a aposição e preservando a identificação representativa, ainda que surpreendente, entre a arca e o Senhor. A alternativa explicita uma relação genitiva que não está marcada diretamente no texto consonantal.
- issue: Título divino אֲדוֹן כָּל הָאָרֶץ
  choice: o Senhor de toda a terra
  alternative: o Soberano de toda a terra
  rationale: “Senhor” mantém a formulação titular e a afirmação de soberania universal do texto, sem ampliar seu conteúdo teológico.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. Os dois-pontos após “Vejam” introduzem naturalmente aquilo para o qual se chama a atenção. A aposição foi mantida para não resolver silenciosamente a tensão sintática do hebraico.
