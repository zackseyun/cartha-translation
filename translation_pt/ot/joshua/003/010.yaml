  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: pt
  text: 'E Josué disse: “Nisto vocês saberão que o Deus vivo está no meio de vocês e que certamente expulsará[a] de diante de vocês os cananeus, os hititas, os heveus, os perizeus, os girgaseus, os amorreus e os jebuseus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “certamente desalojará”. O verbo hebraico enfatiza a remoção certa desses povos da terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E Josué disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico sem impor uma sequência temporal mais específica.
- source_word: בְּזֹאת
  choice: Nisto
  rationale: 'Expressa de modo natural o valor demonstrativo e instrumental: é por meio do sinal anunciado no contexto que o povo saberá.'
- source_word: תֵּדְעוּן
  choice: vocês saberão
  rationale: O imperfeito de segunda pessoa masculina plural tem sentido futuro no contexto; “vocês” oferece leitura ampla e natural em português moderno.
- source_word: אֵל חַי
  choice: o Deus vivo
  rationale: É a formulação portuguesa consagrada e natural para a expressão qualitativa, sem substituir אֵל pelo nome divino.
- source_word: בְּקִרְבְּכֶם
  choice: está no meio de vocês
  rationale: Indica a presença de Deus entre o povo e evita a possível leitura individual e interior de “dentro de vocês”.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: certamente expulsará
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a certeza da ação. “Expulsará” é claro e preserva a ideia de remoção da terra.
- source_word: מִפְּנֵיכֶם
  choice: de diante de vocês
  rationale: Mantém a imagem espacial hebraica e o sentido de remoção do caminho ou da presença de Israel.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: os cananeus ... os jebuseus
  rationale: Os gentílicos hebraicos estão morfologicamente no singular coletivo; o plural é a forma idiomática em português para enumerar esses povos.
theological_decisions:
- issue: Tradução de אֵל חַי sem introduzir o nome divino
  choice: o Deus vivo
  alternative: o Deus que vive
  rationale: O texto traz אֵל, não o Tetragrama. “O Deus vivo” preserva a afirmação teológica da presença ativa de Deus sem inserir um nome que não ocorre no versículo.
- issue: Força do verbo da conquista
  choice: certamente expulsará
  alternative: certamente desapossará
  rationale: A construção hebraica afirma com ênfase a remoção decisiva dos povos. “Expulsará” comunica essa força com clareza, enquanto a nota registra a alternativa ligada à perda da posse da terra.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa plural. Mantém a ordem retórica, a ênfase verbal e a imagem espacial do hebraico, usando as formas portuguesas correntes dos gentílicos.
