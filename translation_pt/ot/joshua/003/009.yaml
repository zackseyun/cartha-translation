reference: Joshua 3:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: pt
  text: 'Josué disse aos filhos de Israel[a]: “Aproximem-se e ouçam as palavras de Yahweh, o Deus de vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”. Em hebraico, literalmente “filhos de Israel”; a expressão designa coletivamente o povo de Israel.
    reason: alternativa lexical e esclarecimento do alcance coletivo
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa comum de אמר que introduz discurso direto; “disse” é natural e precisa em português.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Preserva de modo transparente a expressão hebraica literalmente masculina, que funciona como designação coletiva do povo.
- source_word: גֹּשׁוּ הֵנָּה
  choice: Aproximem-se
  rationale: O imperativo plural de נגשׁ com הֵנָּה convoca os ouvintes a se achegarem ao local do falante; “Aproximem-se” comunica naturalmente essa direção sem exigir o pouco idiomático “venham aqui” neste registro.
- source_word: וְשִׁמְעוּ
  choice: e ouçam
  rationale: Mantém o imperativo coordenado e o sentido direto de escutar com atenção.
- source_word: אֶת דִּבְרֵי
  choice: as palavras de
  rationale: Reproduz a expressão concreta do hebraico sem interpretá-la genericamente como “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O referente é singular e designa o Deus de Israel; “de vocês” expressa com clareza moderna o sufixo possessivo da segunda pessoa plural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová ou SENHOR
  rationale: O texto traz o nome divino, não um título. “Yahweh” preserva essa distinção e representa diretamente o Tetragrama.
- issue: Alcance coletivo de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas ou filhos e filhas de Israel
  rationale: A tradução conserva a forma lexical masculina do hebraico sem negar seu uso coletivo convencional; a nota esclarece a alternativa idiomática e o alcance do grupo.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e preserva “Yahweh” como nome próprio. A formulação mantém a sequência narrativa e os dois imperativos do hebraico.
