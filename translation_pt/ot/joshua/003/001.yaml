  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: pt
  text: Josué levantou-se bem cedo pela manhã, e eles partiram de Sitim e chegaram ao Jordão, ele e todos os filhos de Israel[a]. Passaram ali a noite antes de atravessarem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os israelitas”. Hebraico: “todos os filhos de Israel”.'
    reason: Alternativa lexical coletiva mais idiomática para בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: levantou-se bem cedo pela manhã
  rationale: A expressão traduz tanto o sentido de levantar-se cedo do verbo no hifil quanto a indicação temporal explícita “pela manhã”, em português natural e claro.
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: No contexto de viagem, נסע indica levantar acampamento e pôr-se a caminho. “Partiram” comunica esse movimento de modo conciso e idiomático.
- source_word: מֵהַשִּׁטִּים
  choice: de Sitim
  rationale: O topônimo é transliterado, em vez de traduzido como “Acácias”, de acordo com o uso estabelecido para nomes geográficos bíblicos em português.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: chegaram ao Jordão
  rationale: A construção descreve a chegada até o rio; “chegaram ao Jordão” expressa isso naturalmente.
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: ele e todos os filhos de Israel
  rationale: O pronome retoma Josué de forma explícita, e “filhos de Israel” preserva a forma da expressão hebraica de parentesco nacional. A alternativa coletiva mais idiomática consta em nota.
- source_word: וַיָּלִנוּ
  choice: Passaram ali a noite
  rationale: O verbo לון indica permanecer ou alojar-se durante a noite; esta formulação é atual e idiomática.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: antes de atravessarem
  rationale: טֶרֶם marca anterioridade, e עבר, neste contexto, se refere à travessia do Jordão. O objeto pode ficar implícito em português, como está no hebraico imediato.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A escolha mantém visível a expressão masculina plural de parentesco usada no hebraico, sem negar que ela designa coletivamente o povo. A forma idiomática “israelitas” é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem narrativa e a retomada enfática “ele e...” foram preservadas; a divisão em duas frases evita uma coordenação excessivamente longa sem alterar o sentido.
