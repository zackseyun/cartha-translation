  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: pt
  text: 'Então Josué disse ao povo: “Santifiquem-se, pois amanhã o SENHOR fará maravilhas no meio de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: Santifiquem-se
  rationale: O hitpael imperativo expressa preparar-se ou consagrar-se como santo para um encontro com a ação divina. “Santifiquem-se” preserva o conteúdo cultual e é natural no registro bíblico português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem anterior; “pois” comunica de modo claro e digno a relação causal.
- source_word: בְּקִרְבְּכֶם
  choice: no meio de vocês
  rationale: Reproduz o sentido espacial e comunitário de que a ação do SENHOR ocorrerá entre o povo, sem limitar o texto a uma ação apenas interior.
- source_word: נִפְלָאוֹת
  choice: maravilhas
  rationale: Designa feitos extraordinários e portentosos realizados por Deus; “maravilhas” é claro, corrente e mantém a ressonância bíblica.
- source_word: יְהוָה
  choice: o SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por “SENHOR” em versaletes, sem inserir uma vocalização discutida no corpo do texto.
theological_decisions:
- issue: Natureza da ordem de santificação
  choice: Santifiquem-se
  alternative: Consagrem-se
  rationale: A tradução mantém a linguagem de santidade do radical קדש e não especifica ritos ou procedimentos que o versículo não explicita.
- issue: Local da ação divina
  choice: no meio de vocês
  alternative: entre vocês
  rationale: “No meio de vocês” preserva a imagem hebraica e deixa aberta tanto a dimensão comunitária quanto a manifestação concreta de Deus entre o povo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas brasileiras naturais (“vocês”). A ordem sintática acompanha o hebraico sem soar rígida. “Então” representa o וַ consecutivo narrativo; “pois” mantém a ligação causal.
