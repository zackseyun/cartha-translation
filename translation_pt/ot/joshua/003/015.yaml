base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: pt
  text: Quando os que levavam a arca chegaram ao Jordão[a], e os pés dos sacerdotes que levavam a arca entraram na água, junto à margem — durante todo o tempo da colheita, o Jordão transbordava em todas as suas margens[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegaram à beira das águas do Jordão”. A expressão hebraica indica que eles alcançaram o rio; a frase seguinte esclarece que os pés dos sacerdotes entraram na água junto à margem.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, durante a época da colheita, o Jordão estava em período de cheia.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְב֞וֹא
  choice: Quando ... chegaram
  rationale: A conjunção com a preposição temporal e o infinitivo construto introduz uma oração temporal. “Quando” expressa isso com naturalidade em português; o perfeito “chegaram” acompanha a sequência narrativa.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: os que levavam a arca
  rationale: O particípio designa as pessoas que transportavam a arca. A formulação é clara e atual, e a repetição do hebraico é mantida na referência posterior aos sacerdotes.
- source_word: עַד הַיַּרְדֵּן
  choice: chegaram ao Jordão
  rationale: עַד indica que o movimento alcançou determinado ponto. Em português, “chegar ao Jordão” comunica naturalmente a chegada à margem do rio sem acrescentar uma especificação ausente da expressão imediata.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: e os pés dos sacerdotes
  rationale: Reproduz a cadeia construta e preserva o destaque dado aos pés dos sacerdotes.
- source_word: נִטְבְּלוּ בִּקְצֵה הַמָּיִם
  choice: mergulharam na água junto à margem
  rationale: O nifal de טבל indica que os pés entraram ou foram mergulhados na água. A formulação portuguesa evita tanto o sentido fraco de apenas “tocar” quanto a impressão de imersão completa; קצה situa o ato na extremidade da água, junto à margem.
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: o Jordão transbordava por todas as suas margens
  rationale: A expressão descreve o rio cheio para além das margens. “Transbordava” comunica com clareza a condição de cheia implícita na combinação de מָלֵא com עַל כָּל גְּדוֹתָיו.
- source_word: כֹּל יְמֵי קָצִיר
  choice: durante todo o tempo da colheita
  rationale: A expressão abrange todo o período da colheita. Esta forma é natural em português e conserva a extensão temporal do hebraico.
