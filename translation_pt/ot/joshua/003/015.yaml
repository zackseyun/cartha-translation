translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O aparte explicativo foi marcado por travessões, e a vírgula final preserva a continuidade sintática com o versículo seguinte. A repetição de “levavam a arca” foi mantida por corresponder à repetição enfática do hebraico.
