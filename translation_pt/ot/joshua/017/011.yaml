revisions:
- from: Manassés ficou com, nos territórios de Issacar e Aser, Bete-Seã e seus povoados dependentes[a], Ibleão e seus povoados dependentes, os habitantes de Dor e seus povoados dependentes, os habitantes de En-Dor e seus povoados dependentes, os habitantes de Taanaque e seus povoados dependentes, e os habitantes de Megido e seus povoados dependentes — as três regiões.[b]
  to: Manassés teve, nos territórios de Issacar e de Aser, Bete-Seã e seus povoados dependentes[a], Ibleão e seus povoados dependentes, os habitantes de Dor e de seus povoados dependentes, os habitantes de En-Dor e de seus povoados dependentes, os habitantes de Taanaque e de seus povoados dependentes, e os habitantes de Megido e de seus povoados dependentes — as três regiões.[b]
  rationale: A revisão substitui uma expressão mais coloquial de posse por “teve” e esclarece, nas cláusulas referentes aos habitantes, que a referência abrange os habitantes tanto da cidade nomeada quanto de seus povoados dependentes. Mantêm-se os topônimos, a estrutura enumerativa, as notas e a cautela quanto ao sentido de הַנָּפֶת.
  reviewer_model: gpt-5.6-terra
