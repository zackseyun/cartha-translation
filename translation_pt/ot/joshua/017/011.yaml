base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: pt
  text: Manassés teve, nos territórios de Issacar e de Aser, Bete-Seã e seus povoados dependentes[a], Ibleão e seus povoados dependentes, os habitantes de Dor e de seus povoados dependentes, os habitantes de En-Dor e de seus povoados dependentes, os habitantes de Taanaque e de seus povoados dependentes, e os habitantes de Megido e de seus povoados dependentes — as três regiões.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suas filhas”, expressão hebraica para os povoados ou assentamentos dependentes de uma cidade principal.
    reason: cultural_note
  - marker: b
    text: Ou “os três distritos”; a expressão hebraica é difícil e talvez designe um agrupamento geográfico ou administrativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: Manassés ficou com
  rationale: A construção hebraica indica posse ou atribuição territorial. “Ficou com” expressa de modo natural que esses lugares integraram a porção de Manassés.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: nos territórios de Issacar e Aser
  rationale: A preposição marca localização dentro das áreas tribais; explicitar “territórios” evita a impressão de que Issacar e Aser sejam cidades.
- source_word: בֵּית שְׁאָן
  choice: Bete-Seã
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: בְנוֹתֶיהָ
  choice: seus povoados dependentes
  rationale: O termo significa literalmente “suas filhas”, idioma hebraico que designa povoados ou assentamentos subordinados a uma cidade principal.
- source_word: יִבְלְעָם
  choice: Ibleão
  rationale: Transliteração adaptada ao uso bíblico em português.
- source_word: אֶת יֹשְׁבֵי דֹאר
  choice: os habitantes de Dor
  rationale: Reproduz diretamente o particípio substantivado, sem transformar os habitantes na própria cidade.
- source_word: עֵין דֹּר
  choice: En-Dor
  rationale: Forma transliterada clara do topônimo composto.
- source_word: תַעְנַךְ
  choice: Taanaque
  rationale: Forma consagrada e legível em português.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Forma portuguesa corrente do topônimo.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: as três regiões
  rationale: O termo raro pode indicar uma divisão geográfica ou administrativa. “Regiões” é natural e evita afirmar com excesso de certeza que se trata especificamente de elevações.
