  register: Português moderno, digno e acessível, com formas de topônimos familiares ao público lusófono. A longa enumeração e a alternância entre cidades e habitantes foram mantidas para refletir a estrutura do hebraico; a pontuação facilita a leitura sem eliminar sua tensão sintática.
