    text: Ou “uma única área de terra”. A palavra hebraica pode indicar uma porção de território medida ou delimitada.
    reason: lexical_alternative
  revision_rationale: A revisão aproxima a designação tribal da redação hebraica («filhos de José») e substitui o condicional português por uma conexão explicativa compatível com a queixa. Mantêm-se o singular corporativo, a dupla expressão territorial, o nome divino e a nota lexical devidamente ancorada.
