revisions:
- from: 'Então os descendentes de José disseram a Josué: “Por que você me deu como herança um único lote e uma única porção[a], se sou um povo numeroso, visto que Yahweh me abençoou até agora?”'
  to: 'Então os filhos de José disseram a Josué: “Por que me deste como herança um só lote e uma só porção[a], pois sou um povo numeroso, já que Yahweh me abençoou até agora?”'
  rationale: A revisão aproxima a designação tribal da redação hebraica («filhos de José») e substitui o condicional português por uma conexão explicativa compatível com a queixa. Mantêm-se o singular corporativo, a dupla expressão territorial, o nome divino e a nota lexical devidamente ancorada.
