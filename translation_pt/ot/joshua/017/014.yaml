base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: pt
  text: 'Então os filhos de José disseram a Josué: “Por que me deste como herança um só lote e uma só porção[a], pois sou um povo numeroso, já que Yahweh me abençoou até agora?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma única área de terra”. A palavra hebraica pode indicar uma porção de território medida ou delimitada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף אֶת־יְהוֹשֻׁעַ לֵאמֹר
  choice: Então os descendentes de José disseram a Josué
  rationale: “Descendentes de José” comunica naturalmente a designação coletiva das tribos de Efraim e Manassés; “disseram” reúne em português corrente a fórmula hebraica “falaram... dizendo” sem perder sua função narrativa.
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: você me deu como herança
  rationale: Mantém a segunda pessoa singular dirigida a Josué e o singular coletivo “me”, enquanto expressa נַחֲלָה como terra recebida por herança.
- source_word: גּוֹרָל אֶחָד
  choice: um único lote
  rationale: “Lote” pode designar tanto a parcela atribuída quanto, no contexto, a distribuição por sorte; “único” ressalta a queixa de terem recebido somente um.
- source_word: וְחֶבֶל אֶחָד
  choice: e uma única porção
  rationale: חֶבֶל pode ser uma área de terra medida ou delimitada. “Porção” é natural e mantém alguma distinção em relação a גּוֹרָל.
- source_word: וַאֲנִי עַם רָב
  choice: se sou um povo numeroso
  rationale: Preserva o singular coletivo do discurso e entende רָב como referência ao grande número de pessoas. “Se” transmite o contraste implícito na reclamação sem transformá-lo numa concessão excessivamente explícita.
- source_word: עַד אֲשֶׁר עַד כֹּה בֵּרְכַנִי
  choice: visto que ... me abençoou até agora
  rationale: A expressão hebraica é condensada. “Visto que” comunica a relação explicativa, e “até agora” representa diretamente עַד כֹּה sem substituir a ideia temporal por uma afirmação apenas intensiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal representado pelo tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega o tetragrama como nome próprio. “Yahweh” preserva essa função e evita convertê-lo silenciosamente em título.
- issue: Singular coletivo na fala das tribos de José
  choice: “me” e “sou um povo numeroso”
  alternative: “nos” e “somos um povo numeroso”
  rationale: Embora o sujeito inicial seja plural, o hebraico passa deliberadamente ao singular, apresentando o grupo como uma unidade corporativa. A tradução conserva essa tensão gramatical e conceitual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula hebraica de introdução da fala foi vertida de modo idiomático. O marcador da nota foi colocado junto de “porção”, termo ao qual a alternativa lexical efetivamente se refere.
