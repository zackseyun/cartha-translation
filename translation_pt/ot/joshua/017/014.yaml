review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o sentido geral, o singular corporativo de «me/sou» e o valor territorial de herança. Contudo, «filhos de José» reproduz mais diretamente a designação hebraica בני יוסף do que «descendentes de José», e a relação argumentativa da queixa é melhor expressa por «pois» do que por «se».
  naturalness: O texto é claro e atual. «Por que me deste» é uma forma amplamente compreensível e mais adequada ao registro narrativo bíblico do que «Por que você me deu», sem comprometer a legibilidade brasileira. «Pois sou um povo numeroso» torna explícita de modo natural a razão apresentada pelos falantes.
  terminology: «Herança», «lote», «porção» e «Yahweh» são escolhas defensáveis. A nota permanece ancorada em «porção», o termo que traduz חבל, e explica apropriadamente sua alternativa territorial.
  issues:
  - severity: low
    issue: «descendentes de José» se afasta da formulação tribal literal
    rationale: Embora seja interpretativamente válido, בני יוסף é literalmente «filhos de José» e funciona como designação tribal convencional. «Filhos de José» preserva melhor a formulação da fonte sem perder inteligibilidade.
  - severity: medium
    issue: «se sou um povo numeroso» enfraquece a relação causal/explicativa
    rationale: No contexto da reclamação, o hebraico apresenta o grande número do povo como razão para pedir maior território. «Pois sou» comunica isso mais diretamente que o condicional «se».
  revised_text: 'Então os filhos de José disseram a Josué: “Por que me deste como herança um só lote e uma só porção[a], pois sou um povo numeroso, já que Yahweh me abençoou até agora?”'
  revised_footnotes:
