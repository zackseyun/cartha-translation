base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: pt
  text: Pois as filhas de Manassés receberam uma herança entre seus filhos,[a] e a terra de Gileade ficou para os filhos restantes de Manassés.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre seus filhos”. O texto contrasta explicitamente as filhas e os filhos na distribuição da herança.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “pertenceu aos demais filhos de Manassés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação para a distribuição mencionada no contexto anterior, preservando a força explicativa do hebraico de modo natural em português.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: as filhas de Manassés
  rationale: Mantém explicitamente 'filhas', pois o texto as contrasta com os filhos homens no contexto da herança.
- source_word: נָחֲלוּ נַחֲלָה
  choice: receberam uma herança
  rationale: Expressa de forma idiomática a construção cognata hebraica e conserva seu sentido jurídico e territorial.
- source_word: בְּתוֹךְ בָּנָיו
  choice: entre os filhos dele
  rationale: Preserva o sentido de 'entre' e o masculino específico de בָּנָיו, sem apagar o contraste entre filhas e filhos; 'dele' refere-se a Manassés.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: e a terra de Gileade
  rationale: Tradução formal e natural da expressão territorial hebraica.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: ficou para os outros filhos de Manassés
  rationale: Comunica naturalmente a destinação da terra no processo de partilha; 'outros' identifica os filhos de Manassés distintos das filhas já mencionadas, sem sugerir necessariamente sobrevivência.
