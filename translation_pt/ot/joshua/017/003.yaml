  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: pt
  text: 'Zelofeade[a], filho de Héfer, filho de Gileade, filho de Maquir, filho de Manassés, não teve filhos homens, mas somente filhas. Estes são os nomes de suas filhas: Maalá, Noa[b], Hogla, Milca e Tirza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “E quanto a Zelofeade” ou “E a Zelofeade”, expressão que introduz o caso dele.
    reason: lexical_alternative
  - marker: b
    text: Noa é aqui uma das filhas de Zelofeade, não o personagem masculino de Gênesis.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: Zelofeade[a]
  rationale: A construção com וְ e לְ introduz o caso de Zelofeade. Em português, o nome como tópico no início da oração comunica isso com naturalidade; a nota registra a forma hebraica.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: filho de ... filho de ... filho de ... filho de
  rationale: Mantém a cadeia genealógica explícita e repetida no hebraico, importante no contexto da herança tribal.
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: não teve filhos homens, mas somente filhas
  rationale: A expressão portuguesa torna explícito que בָּנִים designa descendentes masculinos neste contraste, sem confundi-lo com o uso genérico de “filhos”; כִּי אִם indica contraste exclusivo.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Estes são os nomes de suas filhas
  rationale: Reproduz de modo natural a fórmula hebraica que introduz a lista de nomes.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Maalá, Noa, Hogla, Milca e Tirza
  rationale: Emprega formas portuguesas reconhecíveis dos nomes hebraicos e preserva a ordem da lista.
