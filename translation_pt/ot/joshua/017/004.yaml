  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: pt
  text: 'Elas se apresentaram diante do sacerdote Eleazar, diante de Josué, filho de Num, e diante dos líderes, e disseram: “Yahweh ordenou a Moisés que nos desse uma herança entre nossos irmãos.” Então Josué lhes deu, conforme a ordem de Yahweh[a], uma herança entre os irmãos do pai delas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “segundo a boca de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, dentro do clã paterno delas.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: Elas se apresentaram
  rationale: O qal wayyiqtol na 3ª pessoa feminina plural retoma as filhas de Zelofeade. “Apresentaram-se” expressa naturalmente a aproximação formal perante as autoridades.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A preposição, repetida no hebraico, descreve comparecimento público perante autoridades; em português, a coordenação permite evitar uma repetição pesada sem perder o sentido.
- source_word: הַנְּשִׂיאִים
  choice: os líderes
  rationale: Designa os chefes da comunidade ou das tribos; “líderes” é claro e não sugere uma aristocracia monárquica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: que nos desse uma herança
  rationale: Após “ordenou a Moisés”, a oração com subjuntivo é idiomática em português; “herança” comunica a porção hereditária de terra.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: entre nossos irmãos
  rationale: Preserva a linguagem masculina do texto e a especificidade jurídica do pedido das filhas dentro do grupo de herdeiros homens.
- source_word: וַיִּתֵּן לָהֶם
  choice: Então Josué lhes deu
  rationale: O verbo hebraico tem sujeito singular implícito. Explicitar “Josué” torna a referência clara sem alterar o provável referente narrativo.
- source_word: אֶל־פִּי יְהוָה
  choice: conforme a ordem de Yahweh
  rationale: Comunica de modo natural o idiomatismo hebraico, literalmente “segundo a boca de Yahweh”, preservado em nota.
- source_word: אֲחֵי אֲבִיהֶן
  choice: os irmãos do pai delas
  rationale: Mantém a expressão específica do hebraico e a referência à linhagem paterna, sem reduzi-la genericamente a “parentes”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva por transliteração e evita substituí-lo por um título.
- issue: Linguagem de parentesco em אַחֵינוּ
  choice: nossos irmãos
  alternative: nossos parentes; nossos familiares
  rationale: A formulação mantém a especificidade social e jurídica do hebraico no pedido feito pelas filhas de Zelofeade.
- issue: Referente do sujeito singular de וַיִּתֵּן
  choice: Josué
  alternative: ele
  rationale: O hebraico deixa o sujeito implícito, mas Josué é o referente narrativo mais provável. A explicitação favorece a clareza; não atribui a ação ao grupo inteiro de autoridades.
- issue: Relação paterna em אֲחֵי אֲבִיהֶן
  choice: os irmãos do pai delas
  alternative: seus tios paternos; os parentes do pai delas
  rationale: A tradução conserva a formulação concreta e a estrutura da herança pelo clã paterno, sem torná-la mais específica ou mais genérica do que o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção jurídica é mantida sem arcaísmos; o nome divino aparece como “Yahweh”, e as relações de parentesco permanecem concretas conforme o hebraico.
