  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: pt
  text: 'Aos demais filhos de Manassés coube uma parte, segundo os seus clãs: aos filhos de Abiezer, aos filhos de Heleque, aos filhos de Asriel, aos filhos de Siquém, aos filhos de Héfer e aos filhos de Semida. Esses eram os descendentes do sexo masculino[a] de Manassés, filho de José, segundo os seus clãs.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico enfatiza que estas eram as linhas masculinas de Manassés, em contraste com as filhas de Zelofeade mencionadas no contexto próximo.
    reason: cross_reference
  - marker: b
    text: “Clãs” traduz o hebraico mishpechot, uma subdivisão de parentesco dentro de uma tribo; “famílias” também é possível.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: Aos demais filhos de Manassés coube uma parte
  rationale: No contexto da distribuição territorial, וַיְהִי com ל introduz aquilo que coube aos grupos mencionados. A formulação explicita naturalmente em português a relação de concessão sem transformar o idiomatismo hebraico no pouco claro 'e foi para'.
- source_word: הַנּוֹתָרִים
  choice: demais
  rationale: Indica as outras linhagens de Manassés além do caso tratado no contexto imediato; 'demais' é natural e preserva essa relação contextual.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui uma subdivisão de parentesco dentro da tribo. 'Clãs' é mais preciso do que o sentido doméstico moderno de 'famílias'.
- source_word: לִבְנֵי אֲבִיעֶזֶר ... וְלִבְנֵי שְׁמִידָע
  choice: aos filhos de Abiezer ... aos filhos de Semida
  rationale: Mantém-se a fórmula genealógica repetida do hebraico, adequada ao registro jurídico e tribal da enumeração.
- source_word: שֶׁכֶם
  choice: Siquém
  rationale: Forma tradicional e amplamente reconhecida em português para o nome hebraico Shekem.
- source_word: הַזְּכָרִים
  choice: descendentes do sexo masculino
  rationale: O termo especifica as linhas masculinas em contraste contextual com as filhas de Zelofeade. Esta expressão evita a redundância pouco natural de 'filhos homens' sem apagar a ênfase do hebraico.
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף
  choice: de Manassés, filho de José
  rationale: Preserva a identificação genealógica de Manassés como filho de José; 'descendentes' no início da oração deixa claro que o primeiro בְּנֵי abrange as linhagens enumeradas.
