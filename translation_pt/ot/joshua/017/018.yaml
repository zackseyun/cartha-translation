reference: Joshua 17:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: pt
  text: Mas a região montanhosa será de vocês[a], pois é coberta de mata; vocês a desmatarão, e suas partes mais distantes serão de vocês[b]. Pois vocês desalojarão os cananeus[c], embora eles tenham carros de ferro e sejam fortes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o monte será de vocês”. O hebraico הַר pode significar “monte” ou “região montanhosa”; aqui provavelmente se refere à região elevada concedida aos descendentes de José.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas extremidades” ou “suas partes mais afastadas”. O hebraico se refere aos limites exteriores da região montanhosa coberta de mata.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, “o cananeu ... ele é forte”, com formas singulares usadas coletivamente para designar o povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: região montanhosa
  rationale: Em contexto territorial, o termo designa provavelmente a região elevada concedida aos descendentes de José, não apenas um monte isolado.
- source_word: יִהְיֶה לָּךְ
  choice: será de vocês
  rationale: A construção היה + ל expressa posse ou atribuição; o plural explicita em português o destinatário coletivo no contexto.
- source_word: כִּי
  choice: mas / pois / embora
  rationale: 'As ocorrências repetidas exercem funções discursivas diferentes. A tradução varia conforme o contexto: contraste no início, causa ao explicar a possibilidade de ocupar a área e concessão diante dos carros e da força dos cananeus.'
- source_word: יַעַר
  choice: coberta de mata
  rationale: Expressa naturalmente que a região é terreno arborizado e prepara a ação de desmatá-la.
- source_word: וּבֵרֵאתוֹ
  choice: vocês a desmatarão
  rationale: O Piel de ברא neste contexto indica limpar ou abrir terreno arborizado; “desmatar” transmite com clareza a ação, sem sugerir o sentido comum de “criar”.
- source_word: וְהָיָה לְךָ תֹּצְאֹתָיו
  choice: ela será de vocês até os seus limites mais distantes
  rationale: תֹּצְאוֹת designa extremidades ou limites exteriores. Esta formulação comunica que a posse se estenderá por toda a região.
- source_word: תוֹרִישׁ
  choice: vocês desalojarão
  rationale: O Hifil de ירש indica privar os ocupantes de sua posse. “Desalojar” preserva tanto a ideia de expulsão quanto a de perda do território.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora a forma hebraica seja singular, funciona coletivamente como designação do povo; o plural é natural e claro em português.
- source_word: רֶכֶב בַּרְזֶל
  choice: carros de ferro
  rationale: Tradução direta da expressão construta, tradicionalmente entendida como carros de guerra equipados ou reforçados com ferro.
- source_word: חָזָק הוּא
  choice: sejam fortes
  rationale: O adjetivo e o pronome no singular retomam coletivamente o povo cananeu; o plural concorda com a forma natural escolhida em português.
theological_decisions:
- issue: Singular coletivo referente à população cananeia
  choice: 'Traduzir no plural: “os cananeus ... eles tenham ... sejam fortes”.'
  alternative: 'Manter formalmente o singular: “o cananeu ... ele tenha ... seja forte”.'
  rationale: O singular hebraico é coletivo, e o plural português comunica o referente com mais naturalidade sem alterar o sentido.
- issue: Relação entre a promessa da terra e a resistência cananeia
  choice: Preservar a afirmação de que Israel desalojará os cananeus, acompanhada das concessões “embora”.
  alternative: Explicitar uma condição ou atribuir diretamente o êxito à ação divina.
  rationale: O texto afirma o resultado apesar dos obstáculos, mas neste versículo não formula explicitamente uma condição nem menciona diretamente a agência divina; a tradução não deve acrescentá-las.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Região montanhosa”, “coberta de mata” e “desalojarão” evitam literalismos obscuros, enquanto as notas preservam as alternativas lexicais e o singular coletivo do hebraico.
