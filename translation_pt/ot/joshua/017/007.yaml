  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: pt
  text: A fronteira de Manassés ia de Aser até Micmetate, que fica em frente a Siquém[a]. Depois, a fronteira seguia para a direita[b], em direção aos moradores de En-Tapuá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “diante de Siquém” ou “defronte de Siquém”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para a direita”. Em descrições de fronteiras, a expressão pode indicar a direção sul.
    reason: lexical_alternative
  - marker: c
    text: En-Tapuá significa “fonte de Tapuá”.
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: fronteira
  rationale: No contexto da distribuição da terra, designa a linha que delimitava o território tribal; “fronteira” é clara e natural nas duas ocorrências.
- source_word: מֵאָשֵׁר
  choice: de Aser
  rationale: A preposição indica o ponto inicial da descrição; Aser é mantido como referência tribal ou geográfica, sem especificar além do hebraico.
- source_word: הַמִּכְמְתָת
  choice: Micmetate
  rationale: É um topônimo e, por isso, foi transliterado segundo a forma portuguesa tradicional dos nomes bíblicos.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: que fica em frente a Siquém
  rationale: A expressão indica uma relação espacial como “diante de”, “em frente a” ou “defronte de”, sem exigir uma direção cardinal específica.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: Depois, a fronteira seguia
  rationale: O verbo descreve idiomaticamente o percurso de uma linha divisória; “seguia” é natural em português, e “depois” expressa a progressão da descrição.
- source_word: אֶל־הַיָּמִין
  choice: para a direita
  rationale: Mantém o sentido literal do hebraico e evita transformar em certeza a interpretação geográfica de que aqui se trata do sul.
- source_word: יֹשְׁבֵי
  choice: os moradores de
  rationale: O particípio designa as pessoas que residiam no lugar; “moradores” é atual, claro e menos burocrático que “habitantes”.
- source_word: עֵין תַּפּוּחַ
  choice: En-Tapuá
  rationale: O topônimo é transliterado no texto principal; seu significado lexical é informado em nota.
theological_decisions: []
