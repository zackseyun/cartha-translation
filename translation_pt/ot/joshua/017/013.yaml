  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: pt
  text: E aconteceu que, quando os filhos de Israel[a] se fortaleceram, submeteram os cananeus a trabalho forçado[b], mas não os expulsaram completamente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Em hebraico, literalmente: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “impuseram aos cananeus trabalho compulsório”; outra possibilidade é: “submeteram os cananeus a tributo”.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico intensifica o verbo; também se pode traduzir: “de modo algum os expulsaram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: E aconteceu que, quando
  rationale: Reproduz a introdução narrativa e apresenta כִּי como circunstância temporal, em português atual e sem formulação arcaica.
- source_word: חָזְקוּ
  choice: se fortaleceram
  rationale: Expressa naturalmente o sentido ingressivo de ganhar força ou poder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar hebraica e sua forma masculina, embora funcione como designação nacional.
- source_word: וַיִּתְּנוּ אֶת הַכְּנַעֲנִי לָמַס
  choice: submeteram os cananeus a trabalho forçado
  rationale: מַס indica serviço compulsório no contexto; a formulação explicita a coerção com clareza. O singular coletivo hebraico é vertido naturalmente pelo plural.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: mas não os expulsaram completamente
  rationale: A combinação do infinitivo absoluto com o verbo finito intensifica a declaração. O pronome plural corresponde em português ao coletivo cananeu.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A opção preserva a imagem familiar e a forma gramatical do hebraico sem negar que a expressão seja um etnônimo coletivo.
- issue: Sentido de מַס
  choice: trabalho forçado
  alternative: tributo
  rationale: O contexto aponta para sujeição mediante serviço compulsório; “tributo” também é lexicalmente possível, mas pode sugerir apenas pagamento e ocultar a dimensão laboral.
- issue: Força de וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: não os expulsaram completamente
  alternative: de modo algum os expulsaram
  rationale: A construção intensiva admite nuances como totalidade ou ênfase categórica. No contexto, “completamente” comunica que a expulsão não foi levada a cabo, sem apagar a intensificação hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a progressão narrativa hebraica, enquanto “se fortaleceram” e “trabalho forçado” evitam arcaísmos e termos técnicos desnecessários.
