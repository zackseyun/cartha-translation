  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יוֹסֵ֔ף לֹֽא יִמָּ֥צֵא לָ֖/נוּ הָ/הָ֑ר וְ/רֶ֣כֶב בַּרְזֶ֗ל בְּ/כָל הַֽ/כְּנַעֲנִי֙ הַ/יֹּשֵׁ֣ב בְּ/אֶֽרֶץ הָ/עֵ֔מֶק לַֽ/אֲשֶׁ֤ר בְּ/בֵית שְׁאָן֙ וּ/בְנוֹתֶ֔י/הָ וְ/לַֽ/אֲשֶׁ֖ר בְּ/עֵ֥מֶק יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: pt
  text: 'Os filhos de José disseram: “A região montanhosa não é suficiente para nós[a], e todos os cananeus que habitam na região do vale têm carros de ferro[b], tanto os que habitam em Bete-Seã e nas suas povoações dependentes[c] como os que habitam no vale de Jezreel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “a região montanhosa não se encontra para nós”; no contexto, o sentido é que ela não é suficiente para as tribos de José.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “carros de ferro”. A expressão também pode indicar carros equipados com ferro.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “suas filhas”, expressão hebraica que designa povoações menores dependentes de uma cidade principal.
    reason: cultural_note
lexical_decisions:
- source_word: הָהָר
  choice: a região montanhosa
  rationale: Em contexto territorial, designa a zona elevada atribuída às tribos de José; a expressão preserva o contraste geográfico com a região do vale.
- source_word: לֹא יִמָּצֵא לָנוּ
  choice: não é suficiente para nós
  rationale: A tradução estritamente literal, “não se encontra para nós”, seria obscura em português. No contexto, a queixa é que o território montanhoso não basta para as tribos de José.
- source_word: רֶכֶב בַּרְזֶל
  choice: carros de ferro
  rationale: Mantém a forma do construto hebraico e a expressão militar, sem especificar além do texto de que maneira o ferro era empregado nos carros.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: os cananeus que habitam
  rationale: O singular hebraico tem sentido coletivo; o plural é natural em português, e “habitam” conserva um registro bíblico digno sem ser arcaico.
- source_word: אֶרֶץ הָעֵמֶק
  choice: a região do vale
  rationale: Expressa a área baixa em contraste com a região montanhosa, preservando a referência territorial sem reduzi-la simplesmente a um único vale.
- source_word: בְּבֵית שְׁאָן
  choice: em Bete-Seã
  rationale: Transliteração portuguesa clara do topônimo hebraico.
- source_word: וּבְנוֹתֶיהָ
  choice: nas cidades que dependem dela
  rationale: O hebraísmo literal “suas filhas” designa povoações subordinadas à cidade principal; a formulação explicita naturalmente esse sentido em português.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: o vale de Jezreel
  rationale: Tradução direta e reconhecível da designação geográfica hebraica.
- source_word: בְּכָל
  choice: todos ... têm
  rationale: Comunica de modo natural o alcance distributivo da afirmação sobre a população cananeia da região do vale.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com legibilidade brasileira. A sintaxe acompanha a progressão do hebraico, mas evita literalismos obscuros. Os topônimos seguem formas portuguesas reconhecíveis.
