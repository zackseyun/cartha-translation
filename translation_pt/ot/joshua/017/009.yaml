  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: pt
  text: Então, a fronteira descia até o ribeiro de Caná[a], ao sul do ribeiro. Essas cidades, situadas entre as cidades de Manassés, pertenciam a Efraim[b]. A fronteira de Manassés ficava ao norte do ribeiro e terminava no mar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uádi de Caná”. O termo hebraico pode indicar um ribeiro, uma ravina ou o leito de um curso de água sazonal.
    reason: lexical_alternative
  - marker: b
    text: Isto é, Efraim possuía cidades situadas dentro da região atribuída a Manassés.
    reason: cultural_note
  - marker: c
    text: Aqui, “o mar” refere-se ao mar Mediterrâneo.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Então a fronteira descia
  rationale: Em descrições territoriais, ירד indica que a linha limítrofe desce, seja quanto ao relevo, seja quanto ao percurso. O imperfeito português acompanha naturalmente a descrição contínua da fronteira.
- source_word: נַחַל קָנָה
  choice: ribeiro de Caná
  rationale: נחל pode designar um curso de água, leito sazonal ou ravina. “Ribeiro” é uma forma clara e digna no texto principal; a amplitude geográfica do termo é preservada em nota.
- source_word: נֶגְבָּה לַנַּחַל
  choice: ao sul do ribeiro
  rationale: A expressão indica a posição meridional em relação ao curso de água. Esta formulação evita interpretar a frase como movimento em direção ao ribeiro.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: Essas cidades pertenciam a Efraim
  rationale: A oração nominal hebraica expressa posse ou atribuição territorial; “pertenciam” comunica isso naturalmente.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: embora ficassem entre as cidades de Manassés
  rationale: בְּתוֹךְ indica que essas cidades efraimitas estavam inseridas entre cidades ligadas a Manassés. “Embora” explicita o contraste contextual sem alterar a atribuição territorial.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: A fronteira de Manassés ficava ao norte do ribeiro
  rationale: מִצְּפוֹן situa a fronteira no lado norte do curso de água; a redação é direta e geograficamente clara.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: e terminava no mar
  rationale: תֹצְאוֹתָיו é uma fórmula de delimitação que indica o ponto terminal da fronteira. O destino com ה direcional é expresso naturalmente por “no mar”.
