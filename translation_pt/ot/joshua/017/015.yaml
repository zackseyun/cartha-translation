base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: pt
  text: 'Josué lhes disse: “Se vocês são um povo numeroso, subam à floresta e abram ali terreno para vocês[a], na terra dos perizeus e dos refains, pois a região montanhosa de Efraim[b] é estreita demais para vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derrubem-na ali para vocês”. O verbo hebraico se refere à derrubada da mata para abrir terreno.'
    reason: lexical_alternative
  - marker: b
    text: “Região montanhosa de Efraim” também pode ser traduzido por “monte Efraim”; trata-se da região elevada atribuída a Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: um povo numeroso
  rationale: A expressão indica grande quantidade de pessoas. “Povo numeroso” é natural em português e preserva o reconhecimento, por Josué, da alegação dos descendentes de José.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: subam à floresta
  rationale: O verbo עלה indica movimento para cima ou em direção à região de mata. O plural é natural em português porque Josué se dirige a várias pessoas, embora o hebraico trate o povo coletivamente no singular.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: abram ali terreno para vocês
  rationale: No piel, ברא se refere à derrubada ou limpeza da mata para tornar o terreno utilizável. A formulação explicita o objeto implícito sem impor além do que o contexto permite e representa o sentido benefactivo de לְךָ.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: na terra dos perizeus e dos refains
  rationale: Os dois nomes de povos ou grupos são preservados por transliteração, sem interpretar “refains” de modo mais específico do que o contexto autoriza.
- source_word: כִּי אָץ לְךָ
  choice: pois ... é estreita demais para vocês
  rationale: A expressão transmite aperto ou falta de espaço. No contexto, Josué afirma que o território atual não basta para um povo tão numeroso.
- source_word: הַר אֶפְרָיִם
  choice: a região montanhosa de Efraim
  rationale: Em contextos territoriais, הַר frequentemente designa uma região elevada, não um único pico. “Região montanhosa” comunica esse sentido geográfico com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formas plurais naturais (“vocês”, “subam”, “abram”) para reproduzir a referência coletiva do hebraico. Os etnônimos seguem formas portuguesas correntes, e a linguagem geográfica evita sugerir um único monte.
