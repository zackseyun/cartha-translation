  text: לִ/מְנַשֶּׁ֕ה הָיְתָ֖ה אֶ֣רֶץ תַּפּ֑וּחַ וְ/תַפּ֛וּחַ אֶל גְּב֥וּל מְנַשֶּׁ֖ה לִ/בְנֵ֥י אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: pt
  text: A terra de Tapua pertencia a Manassés[a], mas Tapua, na fronteira de Manassés, pertencia aos filhos de Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «A Manassés coube a terra de Tapua; mas Tapua, na fronteira de Manassés, coube aos filhos de Efraim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: pertencia a Manassés
  rationale: A construção com לְ e היה expressa posse ou atribuição territorial; em português, «pertencia a» comunica isso com naturalidade.
- source_word: אֶרֶץ
  choice: terra
  rationale: No contexto da distribuição tribal, designa uma extensão territorial; «terra» preserva a amplitude do termo sem sugerir necessariamente um país.
- source_word: תַּפּוּחַ
  choice: Tapua
  rationale: O topônimo é transliterado em forma adequada ao português, sem traduzir seu possível significado lexical.
- source_word: וְתַפּוּחַ
  choice: mas Tapua
  rationale: Embora וְ seja normalmente aditivo, aqui introduz um contraste entre a terra circundante atribuída a Manassés e a localidade pertencente a Efraim.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: na fronteira de Manassés
  rationale: A expressão situa Tapua junto à linha territorial de Manassés; «na fronteira» é clara e idiomática em português.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: pertencia aos filhos de Efraim
  rationale: Repete-se «pertencia» para explicitar em português a relação indicada por לְ, preservando-se a expressão de parentesco e identidade tribal «filhos de Efraim».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação distingue naturalmente a terra de Tapua da localidade de Tapua, sem inserir explicitamente «cidade», palavra não presente no hebraico.
