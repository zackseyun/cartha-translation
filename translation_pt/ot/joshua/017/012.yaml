base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: pt
  text: Mas os descendentes de Manassés não conseguiram expulsar os habitantes destas cidades, e os cananeus[a] insistiram em permanecer nesta terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cananeu estava decidido a habitar nesta terra”. O hebraico emprega um substantivo coletivo no singular e um verbo que pode indicar disposição ou determinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: não conseguiram
  rationale: Expressa naturalmente incapacidade efetiva em português, sem reduzir a questão a simples falta de vontade.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: os descendentes de Manassés
  rationale: O hebraico diz literalmente “filhos de Manassés”, mas aqui designa o grupo tribal; “descendentes” comunica esse sentido com clareza em português atual.
- source_word: לְהוֹרִישׁ אֶת הֶעָרִים הָאֵלֶּה
  choice: expulsar os habitantes dessas cidades
  rationale: No contexto territorial, o hifil de ירש indica desapossar ou expulsar. Como cidades não são literalmente expulsas, a metonímia hebraica é explicitada de modo natural sem alterar o referente.
- source_word: וַיּוֹאֶל ... לָשֶׁבֶת
  choice: insistiram em permanecer
  rationale: A construção pode exprimir disposição ou determinação; no contexto, comunica a persistência resoluta dos cananeus em continuar estabelecidos no território.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora esteja no singular morfológico, o substantivo funciona coletivamente e é mais natural em português no plural.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: naquela terra
  rationale: Refere-se ao território mencionado no contexto narrativo; “naquela” é a forma dêitica mais natural em português, embora o hebraico use literalmente “esta”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A metonímia “expulsar essas cidades” foi explicitada como “expulsar os habitantes dessas cidades”; a ambiguidade de וַיּוֹאֶל e o singular coletivo foram preservados em nota.
