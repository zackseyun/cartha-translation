  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: pt
  text: Dez porções foram atribuídas a Manassés[a], além da terra de Gileade e Basã, que fica do outro lado do Jordão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dez porções caíram para Manassés” ou “Dez lotes couberam a Manassés”. O hebraico emprega literalmente “caíram”, uma expressão idiomática no contexto da distribuição de terras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: couberam ... por sorteio
  rationale: No contexto da distribuição da terra, נפל integra a linguagem do sorteio. A formulação natural em português explicita o mecanismo sem perder a imagem idiomática de algo que coube a alguém.
- source_word: חַבְלֵי
  choice: porções
  rationale: חבל pode indicar corda de medir, território ou porção atribuída. Aqui, “porções” comunica adequadamente as divisões territoriais sem especificar além do hebraico.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida em português para o nome tribal e pessoal.
- source_word: עֲשָׂרָה
  choice: dez
  rationale: Número cardinal que quantifica as porções.
- source_word: לְבַד מֵאֶרֶץ
  choice: além da terra de
  rationale: A expressão distingue essas dez porções do território já pertencente à tribo a leste do Jordão; “além de” é conciso e natural.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Gileade e Basã
  rationale: Formas portuguesas tradicionais e reconhecíveis dos topônimos.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: que fica do outro lado do Jordão
  rationale: O singular retoma coletivamente “a terra de Gileade e Basã”. “Do outro lado do Jordão” preserva a perspectiva geográfica do texto sem impor “leste”.
