source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: pt
  text: A sorte coube à tribo de Manassés, pois ele era o primogênito de José. Maquir, primogênito de Manassés e pai de Gileade[a], recebeu Gileade e Basã, pois era homem de guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ancestral de Gileade” ou “fundador de Gileade”.'
    reason: O hebraico “pai de” pode indicar um progenitor ou fundador, não apenas o pai biológico imediato.
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: A sorte coube
  rationale: No contexto da distribuição territorial por sorteio, a expressão indica o resultado do lançamento de sortes. “A sorte coube” é idiomático em português e conserva o sentido do procedimento.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: à tribo de Manassés
  rationale: מַטֶּה designa aqui a unidade tribal, não um bastão literal.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: pois ele era o primogênito de José
  rationale: Mantém a força explicativa de כִּי e o pronome do hebraico, cujo referente contextual é Manassés.
- source_word: לְמָכִיר בְּכוֹר מְנַשֶּׁה
  choice: Maquir, primogênito de Manassés
  rationale: Identifica a linhagem específica de Manassés contemplada na distribuição e preserva a designação genealógica “primogênito”.
- source_word: אֲבִי הַגִּלְעָד
  choice: pai de Gileade
  rationale: Conserva no texto a expressão familiar hebraica; a amplitude semântica de אָב como ancestral ou fundador é indicada em nota.
- source_word: אִישׁ מִלְחָמָה
  choice: homem de guerra
  rationale: Reproduz a expressão hebraica para alguém experiente e capaz na guerra, em registro digno e compreensível.
- source_word: וַיְהִי לוֹ הַגִּלְעָד וְהַבָּשָׁן
  choice: recebeu Gileade e Basã
  rationale: No contexto de herança territorial, וַיְהִי לוֹ indica que essas regiões lhe foram atribuídas como possessão. “Recebeu” torna essa relação clara e natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A sintaxe foi reorganizada em duas frases para evitar uma construção truncada, sem eliminar as relações genealógicas e causais do hebraico. Os topônimos seguem as formas portuguesas tradicionais “Gileade” e “Basã”.
