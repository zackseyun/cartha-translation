  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל בֵּ֣ית יוֹסֵ֔ף לְ/אֶפְרַ֥יִם וְ/לִ/מְנַשֶּׁ֖ה לֵ/אמֹ֑ר עַם רַ֣ב אַתָּ֗ה וְ/כֹ֤חַ גָּדוֹל֙ לָ֔/ךְ לֹֽא יִהְיֶ֥ה לְ/ךָ֖ גּוֹרָ֥ל אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: pt
  text: 'Josué disse à casa de José — a Efraim e a Manassés: “Vocês são um povo numeroso[a] e têm muita força; não terão uma só porção[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande povo”. A expressão hebraica pode indicar tanto grande número como grandeza; aqui, o contexto da distribuição da terra favorece “numeroso”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico “sorte”. Em Josué, o termo muitas vezes se refere a uma porção da herança territorial atribuída por sorteio; por isso, “porção”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: casa de José
  rationale: Preserva a expressão familiar e tribal hebraica, esclarecida imediatamente pelos nomes de Efraim e Manassés.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: a Efraim e a Manassés
  rationale: A construção especifica quem constitui a “casa de José”; os travessões tornam essa aposição clara em português.
- source_word: עַם רַב
  choice: um povo numeroso
  rationale: Embora רַב também possa significar “grande”, o contexto da distribuição territorial favorece a ideia de grande número de pessoas.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: e têm muita força
  rationale: Expressa de modo natural a construção possessiva hebraica e a grande capacidade ou força atribuída às tribos.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: não terão uma só porção
  rationale: No contexto de Josué, גּוֹרָל designa a porção territorial atribuída por sorteio. “Uma só” comunica a força restritiva contextual de אֶחָד.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz a fala direta; em português atual, os dois-pontos desempenham naturalmente essa função sem a fórmula redundante “dizendo”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “vocês” trata Efraim e Manassés como os integrantes coletivos da casa de José, embora o hebraico empregue formas gramaticais singulares ao se dirigir ao grupo como um só povo.
