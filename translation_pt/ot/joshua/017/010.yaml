base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: pt
  text: Ao sul, o território pertencia a Efraim, e ao norte, a Manassés. O mar era seu limite. Ao norte, faziam fronteira com Aser, e a leste, com Issacar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: Ao sul, o território pertencia a Efraim
  rationale: A forma direcional נֶגְבָּה indica o lado sul, e לְ marca aqui a atribuição territorial. A explicitação de “o território” torna natural em português a construção elíptica hebraica.
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: e ao norte, a Manassés
  rationale: Mantém o paralelismo direcional e permite subentender “o território pertencia”, sem repetição desnecessária.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: O mar era seu limite
  rationale: Tradução direta da identificação do limite ocidental; “limite” é claro e idiomático em descrições territoriais.
- source_word: וּבְאָשֵׁר יִפְגְּעוּן
  choice: faziam fronteira com Aser
  rationale: Em descrições geográficas, פגע pode indicar que um território alcança, toca ou confronta outro. “Faziam fronteira com” expressa com clareza a relação territorial.
- source_word: מִצָּפוֹן
  choice: Ao norte
  rationale: Neste contexto de limites, a preposição indica o lado em que ocorre a confrontação territorial.
- source_word: וּבְיִשָּׂשכָר מִמִּזְרָח
  choice: e a leste, com Issacar
  rationale: O verbo da oração anterior é subentendido no hebraico. A tradução preserva essa elipse de modo natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia geográfica corrente. A estrutura concisa acompanha o estilo de lista de limites do hebraico, enquanto “o território” é explicitado uma vez para resolver a elipse sem alterar o sentido.
