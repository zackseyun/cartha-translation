  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: pt
  text: Então eu trouxe vocês para a terra dos amorreus, que viviam além do Jordão. Eles lutaram contra vocês[a], e eu os entreguei nas mãos de vocês. Vocês tomaram posse da terra deles, e eu os destruí diante de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “lutaram com vocês”; neste contexto, a expressão indica que lutaram contra vocês.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: Então eu trouxe vocês
  rationale: O hifil de בוא expressa a ação causativa de trazer. “Então” comunica naturalmente a sequência narrativa do waw, e “vocês” representa a segunda pessoa masculina plural.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: para a terra dos amorreus
  rationale: אֶל indica movimento em direção ao território e, neste contexto, entrada nele. O gentílico hebraico singular coletivo é expresso naturalmente pelo plural português “amorreus”.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: que viviam além do Jordão
  rationale: O particípio de ישׁב descreve os amorreus como habitantes da região. “Além do Jordão” preserva a expressão espacial sem inserir uma orientação geográfica que o hebraico não explicita.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: Eles lutaram contra vocês[a]
  rationale: לחם com אֵת/עִם descreve aqui confronto bélico hostil. “Contra vocês” evita que o português sugira que os amorreus lutaram ao lado de Israel; a forma mais literal é registrada em nota.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: mas eu os entreguei nas mãos de vocês
  rationale: נתן ביד é um idioma de sujeição ao poder de alguém. “Entreguei nas mãos” conserva a imagem hebraica em português natural. “Mas” torna explícito o contraste contextual entre o ataque e a vitória concedida, sem alterar a relação narrativa.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: Vocês tomaram posse da terra deles
  rationale: ירשׁ pode significar herdar, possuir ou desapossar. Aqui, “tomaram posse” comunica o resultado da vitória sem impor especificamente a noção de herança.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: eu os destruí diante de vocês
  rationale: שׁמד mantém a linguagem forte de destruição. “Diante de vocês” representa מִפְּנֵיכֶם de modo claro e preserva a atribuição direta da ação a Deus.
theological_decisions:
- issue: Linguagem da conquista e atribuição da ação a Deus
  choice: 'Manter a fala divina direta: “eu os entreguei ... eu os destruí”.'
  alternative: Atenuar com expressões como “eu os derrotei” ou “eu os afastei”.
  rationale: O hebraico atribui explicitamente a Deus a entrega dos inimigos e sua destruição. A tradução preserva essa tensão e força, sem suavização nem ampliação doutrinária.
- issue: Sentido de ירשׁ na tomada da terra
  choice: “tomaram posse da terra deles”
  alternative: “herdaram a terra deles” ou “os desapossaram da terra”
  rationale: O contexto sustenta posse após a vitória, mas o verbo admite nuances. A escolha evita decidir além do necessário entre herança e desapropriação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservam-se a referência espacial ambígua de “além do Jordão”, a imagem de entrega “nas mãos” e a linguagem forte da conquista.
