  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: pt
  text: Agora, removam os deuses estrangeiros que estão entre vocês e inclinem o coração de vocês para Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Preserva tanto a ligação discursiva de וְ quanto a urgência temporal de עַתָּה, em português natural.
- source_word: הָסִירוּ
  choice: removam
  rationale: O imperativo plural causativo expressa a ordem de retirar ou eliminar; “removam” é claro, direto e atual.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: os deuses estrangeiros
  rationale: A expressão designa divindades de povos estrangeiros ou de culto alheio, e não deuses meramente estranhos.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: que estão entre vocês
  rationale: בְּקֶרֶב indica presença no meio da comunidade; esta formulação evita sugerir indevidamente uma localização interior ou apenas psicológica.
- source_word: וְהַטּוּ
  choice: inclinem
  rationale: Mantém a metáfora direcional de נטה e sua ligação com אֶל, exprimindo a orientação deliberada do coração.
- source_word: לְבַבְכֶם
  choice: o coração de vocês
  rationale: Conserva o substantivo coletivo singular hebraico, que apresenta a disposição interior do povo de modo corporativo.
- source_word: אֶל יְהוָה
  choice: para Yahweh
  rationale: אֶל marca direção, e “Yahweh” representa diretamente o nome divino יהוה.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução transparente da construção que identifica Yahweh como o Deus de Israel.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico emprega o nome próprio da aliança. A transliteração “Yahweh” preserva sua função nominal sem substituí-lo por um título.
- issue: Localização dos deuses estrangeiros
  choice: entre vocês
  alternative: dentro de vocês
  rationale: A expressão pode ser formalmente entendida como “no meio de vocês”, mas o contexto comunitário favorece a presença desses deuses ou cultos entre o povo, sem reduzir a ordem a uma atitude interior.
- issue: Singular coletivo de לְבַבְכֶם
  choice: o coração de vocês
  alternative: os seus corações
  rationale: O hebraico usa “coração” no singular com sufixo plural, permitindo retratar a lealdade interior de Israel coletivamente; o português escolhido preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Inclinem o coração de vocês” conserva a imagem hebraica sem soar arcaico; “vocês” comunica claramente o destinatário plural.
