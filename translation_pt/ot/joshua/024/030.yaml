  text: וַ/יִּקְבְּר֤וּ אֹת/וֹ֙ בִּ/גְב֣וּל נַחֲלָת֔/וֹ בְּ/תִמְנַת סֶ֖רַח אֲשֶׁ֣ר בְּ/הַר אֶפְרָ֑יִם מִ/צְּפ֖וֹן לְ/הַר גָּֽעַשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: pt
  text: E o sepultaram no território de sua herança[a], em Timnate-Sera, que fica na região montanhosa de Efraim, ao norte do monte Gaás.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos limites de sua herança”. O termo hebraico pode designar tanto uma fronteira quanto o território por ela delimitado; aqui, provavelmente se refere à área da herança atribuída a Josué.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: E o sepultaram
  rationale: O wayyiqtol dá continuidade à narrativa, e אֹתוֹ explicita o objeto masculino singular, Josué. A colocação pronominal é natural no português escrito e preserva o encadeamento do hebraico.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: no território de sua herança
  rationale: גְּבוּל pode indicar tanto o limite quanto a área delimitada. Neste contexto de localização dentro da porção concedida a Josué, “território” comunica melhor o sentido provável, enquanto a nota preserva a alternativa lexical.
- source_word: נַחֲלָתוֹ
  choice: sua herança
  rationale: נַחֲלָה designa a propriedade recebida por herança ou atribuição. “Herança” conserva a linguagem característica da distribuição da terra sem explicitação excessiva.
- source_word: בְּתִמְנַת סֶרַח
  choice: em Timnate-Sera
  rationale: O topônimo é transliterado em forma adequada ao português; “em” introduz naturalmente a localização.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: que fica na região montanhosa de Efraim
  rationale: אֲשֶׁר introduz a descrição geográfica, e הַר אֶפְרָיִם refere-se à região de colinas ou montanhas de Efraim, não necessariamente a um monte isolado.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: ao norte do monte Gaás
  rationale: A expressão indica posição relativa ao marco geográfico chamado Gaás. “Ao norte de” é a formulação idiomática em português.
