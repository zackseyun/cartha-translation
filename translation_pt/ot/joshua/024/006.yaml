  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: pt
  text: Então, tirei do Egito os antepassados de vocês, e vocês chegaram ao mar. Os egípcios perseguiram os antepassados de vocês com carros de guerra e cavaleiros até o mar Vermelho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “Mar dos Juncos”. Em hebraico, yam suf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: Então tirei
  rationale: O hifil de יצא significa fazer sair ou tirar. “Então” comunica naturalmente a progressão narrativa marcada pelo waw.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: os pais de vocês
  rationale: Mantém o sentido literal e representativo de “seus pais”, isto é, as gerações anteriores de Israel, em linguagem clara e atual.
- source_word: מִמִּצְרַיִם
  choice: do Egito
  rationale: Expressa de modo idiomático a origem do movimento; com “tirei”, preserva claramente a ideia do êxodo.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: e vocês chegaram ao mar
  rationale: בוא com a terminação direcional indica movimento até o mar. A segunda pessoa do plural é preservada para manter a identificação retórica dos ouvintes com a geração do êxodo.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Os egípcios perseguiram
  rationale: Embora o texto use literalmente o nome coletivo “Egito”, o verbo plural aponta para os egípcios como agentes; esta formulação é natural em português e semanticamente precisa.
- source_word: בְּרֶכֶב
  choice: com carros de guerra
  rationale: רכב designa aqui carros empregados pelas forças militares. “Carros de guerra” evita a ambiguidade moderna de “carros” isoladamente.
- source_word: וּבְפָרָשִׁים
  choice: e cavaleiros
  rationale: פָּרָשִׁים refere-se a homens montados ou tropas a cavalo; “cavaleiros” é claro e próximo do hebraico.
- source_word: יַם סוּף
  choice: mar Vermelho
  rationale: A tradução tradicional identifica de modo reconhecível o local do relato. O sentido mais literal do nome hebraico é registrado em nota.
theological_decisions:
- issue: Tratamento representativo dos ouvintes como participantes da história do êxodo
  choice: Manter “vocês chegaram ao mar”
  alternative: “eles chegaram ao mar”
  rationale: A segunda pessoa está explícita no hebraico e identifica retoricamente a assembleia atual com seus antepassados na história da aliança; mudá-la para terceira pessoa reduziria essa força discursiva.
- issue: Tradução de יַם סוּף
  choice: Usar “mar Vermelho” no texto principal
  alternative: “mar de Juncos”
  rationale: “Mar Vermelho” preserva a identificação tradicional e amplamente reconhecida, enquanto a nota informa com transparência a forma mais literal do hebraico sem decidir além da evidência lexical.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Pais de vocês” preserva o vínculo lexical com o hebraico; “carros de guerra” explicita o sentido militar. O marcador [a] aparece no texto principal junto à expressão anotada.
