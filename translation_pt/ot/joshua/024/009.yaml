  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: pt
  text: Então Balaque, filho de Zipor, rei de Moabe, levantou-se[a] e lutou contra Israel[b]. Ele mandou chamar Balaão, filho de Beor, para amaldiçoar vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pôs-se em ação”. O verbo hebraico pode assinalar o início de uma ação decisiva.
    reason: lexical_alternative
  - marker: b
    text: Ou “fez guerra contra Israel” ou “entrou em guerra com Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: levantou-se
  rationale: O verbo קום pode indicar tanto levantar-se quanto iniciar uma ação decisiva. “Levantou-se” preserva a imagem e o movimento narrativo sem reduzir o sentido a um ato meramente físico.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: lutou contra Israel
  rationale: לחם com ב expressa confronto hostil. “Lutou contra” é claro em português atual e mantém a afirmação direta do hebraico.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: mandou chamar
  rationale: A expressão idiomática portuguesa comunica naturalmente a sequência hebraica de enviar alguém e convocar Balaão, sem sugerir que Balaque foi pessoalmente buscá-lo.
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: Balaão, filho de Beor
  rationale: Os nomes seguem as formas tradicionais e amplamente reconhecidas em português.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: para amaldiçoar vocês
  rationale: קלל, neste contexto, significa invocar uma maldição. A formulação é direta e conserva tanto a finalidade quanto o referente plural de אֶתְכֶם.
theological_decisions:
- issue: A afirmação de que Balaque lutou contra Israel, embora Números destaque sua tentativa de usar Balaão para amaldiçoar o povo
  choice: Manter a afirmação direta “lutou contra Israel”.
  alternative: Atenuar para “agiu de modo hostil contra Israel” ou harmonizar como “preparou-se para lutar contra Israel”.
  rationale: O hebraico afirma explicitamente וַיִּלָּחֶם בְּיִשְׂרָאֵל. A tradução preserva a formulação de Josué sem resolver por harmonização uma possível tensão com o relato de Números.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” expressa de modo inequívoco o objeto plural do hebraico; “mandou chamar” evita uma coordenação pouco natural em português, mantendo o sentido dos dois verbos hebraicos.
