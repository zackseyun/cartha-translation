  text: וַ/יְשַׁלַּ֤ח יְהוֹשֻׁ֨עַ֙ אֶת הָ/עָ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/028.yaml
  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: pt
  text: Então Josué despediu o povo, cada um para a sua herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cada homem para a sua herança”. O hebraico emprega אִישׁ, literalmente “homem”, em sentido distributivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: despediu
  rationale: O piel de שׁלח indica aqui que Josué fez a assembleia partir. “Despediu” expressa com naturalidade o encerramento da reunião e a liberação do povo.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: הָעָם
  choice: o povo
  rationale: עָם designa coletivamente o povo de Israel reunido, sem exigir a especificação “nação”.
- source_word: אִישׁ
  choice: cada um
  rationale: O singular masculino tem valor distributivo. “Cada um” conserva esse sentido em português natural, sem sugerir que somente os homens partiram.
- source_word: לְנַחֲלָתוֹ
  choice: para a sua herança
  rationale: נַחֲלָה se refere à porção de terra recebida por herança. “Herança” preserva a dimensão territorial e pactual recorrente em Josué.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. “Despediu” é mais idiomático no contexto de uma assembleia do que a tradução literal “enviou”. O marcador da nota foi colocado após a oração a que se refere.
