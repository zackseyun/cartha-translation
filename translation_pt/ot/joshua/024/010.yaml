source:
  edition: WLC
  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: pt
  text: Mas eu não quis dar ouvidos a Balaão, e ele de fato abençoou vocês[a]; assim, livrei vocês da mão dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “abençoando, ele abençoou vocês”. O hebraico emprega uma construção enfática.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיתִי
  choice: não quis
  rationale: O verbo expressa falta de disposição ou consentimento, não incapacidade. “Não quis” comunica de modo natural a nuance volitiva da fala divina.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: dar ouvidos a Balaão
  rationale: שׁמע com ל pode significar escutar ou atender alguém. A expressão portuguesa indica que Deus não acolheu a intenção de Balaão, sem sugerir que simplesmente não o ouviu.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: ele de fato abençoou
  rationale: O verbo finito acompanhado do infinitivo absoluto cognato intensifica a ação. “De fato” preserva a ênfase sem concluir que o aspecto seja necessariamente repetitivo.
- source_word: אֶתְכֶם
  choice: vocês
  rationale: Representa naturalmente o objeto de segunda pessoa masculina plural em português de ampla compreensão, com boa legibilidade brasileira.
- source_word: וָאַצִּל
  choice: livrei
  rationale: נצל denota arrancar do poder de alguém, resgatar ou livrar. “Livrei” se ajusta ao registro da narrativa da aliança e evita acrescentar conotações não exigidas pelo contexto.
- source_word: מִיָּדוֹ
  choice: da mão dele
  rationale: Mantém a metáfora hebraica da mão como poder ou domínio, inteligível em português, bem como o número singular do texto-fonte.
theological_decisions:
- issue: Agente da bênção de Balaão
  choice: O sujeito de “ele de fato abençoou” é Balaão.
  alternative: 'Entender um sujeito divino implícito: “eu abençoei vocês”.'
  rationale: O verbo hebraico está na terceira pessoa masculina singular logo após a menção de Balaão, que é o antecedente gramatical mais natural. O contexto mais amplo mostra que Deus frustrou a intenção de Balaão, sem ser necessário trocar o sujeito expresso pela sequência do texto.
translation_notes:
  register: Português moderno, digno e acessível, de alcance internacional e leitura natural no Brasil. “Dar ouvidos” comunica a ideia de atender sem perder a força volitiva; “de fato” preserva a ênfase hebraica sem impor a interpretação de ação repetida.
