source:
  edition: WLC
  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: pt
  text: 'Mas, se lhes parece mau servir a Yahweh[a], escolham hoje a quem servirão: aos deuses que seus pais[c] serviram do outro lado do Rio[b] ou aos deuses dos amorreus, em cuja terra vocês habitam. Quanto a mim e à minha casa[d], porém, serviremos a Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se vocês consideram errado”; literalmente, “se é mau aos olhos de vocês”.
    reason: lexical_alternative
  - marker: b
    text: “O Rio” se refere ao Eufrates.
    reason: cultural_note
  - marker: c
    text: Ou “seus antepassados”. O hebraico diz literalmente “seus pais”.
    reason: lexical_alternative
  - marker: d
    text: Ou “a minha família” ou “os da minha casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: Introduz uma condição em contraste com o apelo anterior; “Mas, se” expressa naturalmente em português tanto a ligação quanto a força adversativa.
- source_word: רַע בְּעֵינֵיכֶם
  choice: lhes parece mau
  rationale: Comunica a avaliação do ponto de vista dos ouvintes com naturalidade, enquanto a nota preserva a imagem hebraica literal.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / עָבְדוּ / נַעֲבֹד
  choice: servir / servirão / serviram / serviremos
  rationale: Mantém a repetição retórica da raiz עבד e seu sentido amplo de serviço, culto e lealdade religiosa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: escolham hoje
  rationale: Preserva o imperativo plural e a urgência temporal. O pronome לָכֶם tem valor de interesse pessoal, já suficientemente implícito no imperativo português.
- source_word: אֶת מִי תַעֲבֹדוּן
  choice: a quem servirão
  rationale: Formulação portuguesa direta que preserva a deliberação exigida pelo imperativo anterior.
- source_word: אֱלֹהִים ... אֱלֹהֵי
  choice: deuses
  rationale: O plural se refere às divindades pagãs mencionadas como alternativas.
- source_word: אֲשֶׁר עָבְדוּ אֲבוֹתֵיכֶם
  choice: que seus pais serviram
  rationale: Preserva o termo masculino concreto “pais”; a nota registra o sentido mais amplo possível de antepassados.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: do outro lado do Rio
  rationale: Reproduz a expressão geográfica convencional; “Rio” designa aqui o Eufrates, esclarecido em nota.
- source_word: הָאֱמֹרִי
  choice: amorreus
  rationale: Forma portuguesa estabelecida para o nome desse povo.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: em cuja terra vocês habitam
  rationale: Mantém a relação entre os amorreus e a terra onde Israel então vivia, com linguagem corrente e digna.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: Eu, porém, e a minha casa
  rationale: Expressa o contraste enfático de Josué e conserva a figura hebraica de “casa”, que inclui os membros do lar.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; transliterá-lo evita substituí-lo por um título.
- issue: Alcance religioso de עבד
  choice: servir
  alternative: adorar
  rationale: “Servir” preserva a repetição e a amplitude da lealdade pactual, sem restringir o verbo apenas ao ato de adoração.
- issue: Linguagem ancestral de אֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução principal conserva a forma lexical masculina do hebraico, enquanto a nota reconhece seu possível sentido ancestral mais abrangente.
- issue: Sentido de בֵּיתִי
  choice: a minha casa
  alternative: a minha família; os da minha casa
  rationale: “Casa” preserva a imagem e a formulação enfática do hebraico sem definir de maneira indevida quais membros do grupo doméstico estão em vista.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural dirigido ao povo, mantém “Yahweh” como nome próprio e conserva a repetição de “servir” que estrutura o versículo.
