  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: pt
  text: Eu lhes dei uma terra na qual vocês não trabalharam, e cidades que não construíram; e nelas vocês vivem. Vocês comem dos vinhedos e das oliveiras que não plantaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Eu lhes dei
  rationale: O wayyiqtol qal na primeira pessoa do singular apresenta o ato passado de Deus na sequência narrativa; o objeto indireto plural é expresso naturalmente por “lhes”.
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: uma terra na qual vocês não trabalharam
  rationale: יגע denota trabalhar arduamente ou labutar. “Trabalharam” é claro e natural, e o plural “vocês” comunica o destinatário coletivo, Israel, apesar da forma hebraica singular.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: e cidades que não construíram
  rationale: “Cidades” corresponde ao sentido normal de עָרִים, e o pretérito expressa obras que Israel não realizou antes de recebê-las.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: e nelas vocês vivem
  rationale: ישב pode significar habitar ou viver. O presente comunica o resultado ainda vigente da dádiva passada e mantém linguagem portuguesa atual.
- source_word: כְּרָמִים
  choice: vinhedos
  rationale: Equivalente português corrente e preciso para plantações de videiras.
- source_word: וְזֵיתִים
  choice: e oliveiras
  rationale: O substantivo pode indicar azeitonas ou oliveiras; no paralelo com vinhedos e com o verbo “plantar”, “oliveiras” oferece correspondência lexical direta e sentido agrícola claro, sem acrescentar explicitamente a ideia de bosques.
- source_word: אֲשֶׁר לֹא נְטַעְתֶּם
  choice: que não plantaram
  rationale: נטע significa plantar; o pretérito simples é natural porque a relação temporal já está clara.
- source_word: אַתֶּם אֹכְלִים
  choice: Vocês comem de
  rationale: O pronome explícito com o particípio ressalta a situação presente. “Vocês comem de” preserva o valor habitual/presente e introduz de modo idiomático as fontes do alimento.
theological_decisions:
- issue: Alternância entre formas de segunda pessoa singular e plural no discurso dirigido a Israel
  choice: Usar “vocês” em todo o versículo, entendendo Israel como destinatário coletivo
  alternative: Marcar a forma singular de יָגַעְתָּ com “você” e depois passar ao plural
  rationale: A alternância hebraica trata Israel corporativamente. Reproduzi-la literalmente em português sugeriria, de modo enganoso, uma mudança de destinatário.
- issue: Valor temporal de וַתֵּשְׁבוּ e אַתֶּם אֹכְלִים
  choice: 'Expressar o resultado vigente no presente: “vivem” e “comem”'
  alternative: 'Traduzir ambos como ações passadas: “habitaram” e “comeram”'
  rationale: O discurso recorda a dádiva passada e descreve a posse e o usufruto atuais de Israel; o particípio אֹכְלִים favorece especialmente o valor presente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para a referência coletiva a Israel, evita arcaísmos como “labutastes” e mantém a progressão entre a dádiva passada e seus benefícios presentes.
