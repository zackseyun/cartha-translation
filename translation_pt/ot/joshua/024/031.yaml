  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: pt
  text: Israel serviu a Yahweh durante todos os dias de Josué e durante todos os dias dos anciãos que sobreviveram a Josué e que tinham conhecido toda a obra de Yahweh[a], realizada por ele em favor de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os feitos de Yahweh”.'
    reason: Alternativa lexical para כָּל מַעֲשֵׂה יְהוָה, que pode ser entendida como um singular coletivo (“toda a obra”) ou expressa por ações individuais (“todos os feitos”).
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: serviu
  rationale: O verbo עבד, tendo Yahweh como objeto, expressa serviço em lealdade à aliança, incluindo adoração sem se limitar ao culto; “serviu” preserva essa amplitude.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כֹּל יְמֵי
  choice: durante todos os dias de
  rationale: Mantém a expressão temporal hebraica e sua repetição enfática, com formulação clara em português.
- source_word: הַזְּקֵנִים
  choice: os anciãos
  rationale: Designa membros mais velhos que possuíam reconhecimento e liderança na comunidade, sem reduzir o termo apenas à idade ou ao cargo.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: sobreviveram a Josué
  rationale: Traduz naturalmente o idioma hebraico de prolongar os dias depois de alguém, isto é, continuar vivos após sua morte.
- source_word: יָדְעוּ
  choice: tinham conhecido
  rationale: Indica conhecimento pessoal e vivido das ações de Yahweh; o mais-que-perfeito situa essa experiência antes do ponto retrospectivo da narrativa.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: toda a obra de Yahweh
  rationale: מַעֲשֶׂה pode denotar obra, ação ou feito. “Toda a obra” conserva o singular coletivo do hebraico; a alternativa contextual “todos os feitos” é registrada em nota.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: realizada por ele em favor de Israel
  rationale: A preposição ל indica, neste contexto, ação em benefício de Israel; a formulação também evita uma repetição pouco elegante de “obra que fez”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição “durante todos os dias” acompanha a estrutura enfática do hebraico; “anciãos” mantém o contexto sociocomunitário israelita.
