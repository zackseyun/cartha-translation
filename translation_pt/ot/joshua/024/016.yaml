base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: pt
  text: 'Então o povo respondeu: “Longe de nós abandonar Yahweh para servir outros deuses![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “Deus nos livre de abandonar Yahweh e servir outros deuses!” A expressão hebraica indica forte repúdio, embora não mencione Deus explicitamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: Então o povo respondeu
  rationale: A fórmula narrativa combina ענה e אמר para introduzir a resposta. Em português natural, “respondeu” comunica ambos sem a redundância pouco idiomática “respondeu e disse”.
- source_word: חָלִילָה לָּנוּ
  choice: Longe de nós
  rationale: Expressão portuguesa corrente de repúdio enfático, que preserva a força do idioma hebraico sem acrescentar uma menção explícita a Deus.
- source_word: מֵעֲזֹב
  choice: abandonar
  rationale: No contexto da aliança, עזב indica romper a lealdade e deixar Yahweh; “abandonar” transmite esse peso em linguagem moderna e clara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לַעֲבֹד
  choice: para servir
  rationale: A construção ל + infinitivo pode exprimir o resultado ou propósito ligado ao abandono. “Para servir” reproduz naturalmente essa relação e mantém o sentido amplo de culto e lealdade de עבד.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: outros deuses
  rationale: Equivalência direta e natural, sem acrescentar a ideia de deuses “estrangeiros”, que não está explícita em אֲחֵרִים.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz o nome próprio da aliança. “Yahweh” preserva sua identidade como nome, enquanto “SENHOR” o substituiria por um título.
- issue: Força idiomática de חָלִילָה לָּנוּ
  choice: Longe de nós
  alternative: Deus nos livre
  rationale: “Longe de nós” expressa rejeição veemente sem introduzir a palavra “Deus”, ausente do idioma hebraico.
- issue: Relação entre abandonar Yahweh e servir outros deuses
  choice: abandonar Yahweh para servir outros deuses
  alternative: abandonar Yahweh e servir outros deuses
  rationale: O prefixo ל no infinitivo לַעֲבֹד favorece “para servir”; a alternativa coordenada também transmite corretamente a estreita ligação entre as ações, mas reduz a forma sintática marcada no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fórmula hebraica redundante “respondeu e disse” foi vertida de modo idiomático por “respondeu”. O ponto de exclamação comunica a intensidade da rejeição expressa por חָלִילָה.
