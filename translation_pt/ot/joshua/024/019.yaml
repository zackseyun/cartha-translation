  naturalness: “Deus santo” sem artigo é compreensível, mas soa menos natural no português corrente neste predicado. “Um Deus santo” é mais idiomático. Também é preferível explicitar a segunda oração verbal, como no hebraico, em vez de ligar “Deus zeloso” por vírgula.
  terminology: “Yahweh”, “servir”, “transgressões”, “pecados” e “Deus zeloso” são escolhas adequadas e coerentes com o registro bíblico moderno. “Zeloso” preserva bem a noção de exclusividade da aliança sem impor uma interpretação doutrinária.
