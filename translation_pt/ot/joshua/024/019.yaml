  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: pt
  text: 'Josué disse ao povo: “Vocês não são capazes de servir a Yahweh, pois ele é um Deus santo; é um Deus zeloso. Ele não perdoará suas transgressões nem seus pecados[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou: “Ele não carregará nem levará embora suas transgressões e seus pecados”. Esse idioma hebraico é usado com frequência para expressar perdão.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: são capazes
  rationale: O verbo יכל expressa capacidade ou possibilidade. “Não são capazes” preserva explicitamente essa força e soa natural em português atual.
- source_word: לַעֲבֹד
  choice: servir
  rationale: עבד abrange serviço e, no contexto da aliança, inclui culto e lealdade. “Servir” mantém essa amplitude melhor do que “adorar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: ele é Deus santo
  rationale: Embora “Deus” e “santo” tenham morfologia plural no hebraico, o pronome é singular e a referência é ao único Deus de Israel. A tradução no singular comunica corretamente o sentido, enquanto a nota registra a forma incomum.
- source_word: אֵל קַנּוֹא
  choice: Deus zeloso
  rationale: קַנּוֹא descreve a reivindicação exclusiva de Yahweh sobre a fidelidade do seu povo e sua intolerância à lealdade rival. “Zeloso” é digno e tradicional em português, sem sugerir mesquinhez emocional.
- source_word: לֹא יִשָּׂא
  choice: não perdoará
  rationale: נשא, quando empregado com transgressões e pecados, é um idioma hebraico que pode indicar removê-los ou perdoá-los. “Não perdoará” comunica claramente o sentido contextual.
- source_word: פִשְׁעֲכֶם
  choice: suas transgressões
  rationale: פשע designa transgressão com forte nuance de rebelião contra uma autoridade; “transgressões” preserva o sentido de violação da aliança.
- source_word: חַטֹּאותֵיכֶם
  choice: seus pecados
  rationale: חטאת é o termo comum para pecado; “pecados” é seu equivalente direto e natural.
theological_decisions:
- issue: As formas plurais אֱלֹהִים קְדֹשִׁים acompanhadas de pronome singular
  choice: 'Traduzir no singular: “ele é Deus santo”'
  alternative: Reproduzir literalmente algo como “deuses santos ele”
  rationale: O pronome singular הוּא e o contexto identificam um único referente. Uma reprodução morfológica rígida sugeriria equivocadamente vários deuses; a nota preserva a particularidade do hebraico.
- issue: A recusa divina de “carregar” pecados
  choice: Expressar o idioma como “não perdoará”
  alternative: “não carregará/não levará embora suas transgressões e seus pecados”
  rationale: נשא com vocabulário de pecado é frequentemente usado para perdão. A tradução idiomática torna clara a advertência sem eliminar a imagem alternativa, que fica documentada em nota.
- issue: A afirmação de que o povo não é capaz de servir a Yahweh
  choice: Manter a declaração direta de incapacidade
  alternative: Abrandar para “não será fácil servir” ou “vocês não querem servir”
  rationale: O texto afirma incapacidade com יכל; não se deve suavizar a tensão retórica e teológica da advertência de Josué.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural dirigido ao povo. A estrutura concisa conserva a força solene da advertência. “Deus zeloso” comunica exclusividade de aliança com naturalidade no registro bíblico português.
