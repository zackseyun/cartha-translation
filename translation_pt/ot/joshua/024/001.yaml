  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: pt
  text: Então Josué reuniu todas as tribos de Israel para Siquém[a] e convocou os anciãos de Israel, seus chefes[b], seus juízes e seus oficiais. Eles se apresentaram diante de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Siquém”; a forma hebraica indica direção, literalmente “em direção a Siquém”.
    reason: lexical_alternative
  - marker: b
    text: Ou “líderes”.
    reason: lexical_alternative
  - marker: c
    text: O hebraico diz “diante de Deus”; no contexto, isso pode implicar o comparecimento em um santuário ou local sagrado ligado à aliança.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: reuniu
  rationale: Neste contexto narrativo, אָסַף indica fazer pessoas se juntarem; “reuniu” é natural em português e mantém o sentido concreto.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: as tribos de Israel
  rationale: É a designação estabelecida e adequada para os grupos sociopolíticos de Israel.
- source_word: שְׁכֶמָה
  choice: em Siquém
  rationale: Embora a forma hebraica tenha direção, literalmente “para Siquém”, em português “reuniu ... em Siquém” expressa naturalmente o local ao qual as tribos foram reunidas; a forma morfológica é preservada em nota.
- source_word: וַיִּקְרָא לְ
  choice: convocou
  rationale: A construção indica chamar formalmente pessoas designadas para comparecer; “convocou” é claro, atual e apropriado ao contexto solene.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: os anciãos de Israel
  rationale: Tradução convencional e precisa para o grupo reconhecido de autoridades.
- source_word: רָאשָׁיו
  choice: seus chefes
  rationale: “Chefes” preserva a imagem de רֹאשׁ de modo idiomático e distingue esse grupo dos anciãos; o pronome retoma Israel como coletivo.
- source_word: שֹׁפְטָיו
  choice: seus juízes
  rationale: Corresponde diretamente ao título cívico e judicial no contexto.
- source_word: שֹׁטְרָיו
  choice: seus oficiais
  rationale: שֹׁטֵר designa agentes ou funcionários administrativos; “oficiais” mantém um título amplo sem especificar indevidamente a função.
- source_word: וַיִּתְיַצְּבוּ
  choice: se apresentaram
  rationale: O hitpael expressa tomar posição ou comparecer formalmente, nuance bem comunicada por “se apresentaram”.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: diante de Deus
  rationale: Traduz diretamente o hebraico, que diz אֱלֹהִים, sem substituir pelo nome divino nem acrescentar um local não explicitado.
theological_decisions:
- issue: Sentido de לִפְנֵי הָאֱלֹהִים numa assembleia de aliança
  choice: diante de Deus
  alternative: diante do santuário de Deus; diante do SENHOR
  rationale: O texto hebraico menciona Deus, não o nome YHWH nem explicitamente o santuário. A tradução principal conserva essa formulação, enquanto a possível implicação de um local sagrado é indicada em nota, sem resolver além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. “Convocou” e “se apresentaram” preservam o caráter formal da assembleia sem arcaísmo; os possessivos retomam Israel como entidade coletiva.
