id: JOS.24.32
reference: Joshua 24:32
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: pt
  text: Também sepultaram em Siquém os ossos de José, que os filhos de Israel haviam trazido do Egito, na porção do campo[a] que Jacó havia comprado dos filhos de Hamor, pai de Siquém[b], por cem quesitas[c]; e ficaram como herança para os filhos de José.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na parcela do campo” ou “no lote de terra”.
    reason: lexical_alternative
  - marker: b
    text: “Pai” pode ter aqui o sentido mais amplo de ancestral principal ou fundador de Siquém.
    reason: lexical_alternative
  - marker: c
    text: A quesita era uma antiga unidade de valor ou forma de dinheiro; seu equivalente exato é desconhecido.
    reason: cultural_note
  - marker: d
    text: O verbo hebraico está no plural e não repete expressamente o sujeito. A referência pode ser aos ossos de José ou, pelo sentido do contexto, à propriedade ligada ao local do sepultamento.
    reason: textual_ambiguity
lexical_decisions:
- source_word: עַצְמוֹת
  choice: ossos
  rationale: Mantém o sentido concreto do hebraico e a ligação verbal com a tradição do sepultamento de José.
- source_word: הֶעֱלוּ
  choice: haviam trazido
  rationale: O hifil de עלה indica fazer subir ou trazer para cima. Em português, “haviam trazido” expressa naturalmente a ação anterior ao sepultamento sem impor uma direção geográfica estranha ao leitor.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico, sendo ainda clara em português moderno.
- source_word: בִשְׁכֶם
  choice: em Siquém
  rationale: Forma idiomática em português para indicar tanto a localidade quanto a área do sepultamento.
- source_word: בְחֶלְקַת הַשָּׂדֶה
  choice: na porção do campo
  rationale: חֶלְקָה designa uma parcela, porção ou lote de terra; “porção do campo” permanece próxima do hebraico e é compreensível.
- source_word: קָנָה
  choice: havia comprado
  rationale: O contexto especifica uma compra, e o mais-que-perfeito composto marca que ela ocorreu antes do sepultamento.
- source_word: בְנֵי חֲמוֹר
  choice: os filhos de Hamor
  rationale: Reproduz diretamente a expressão hebraica sem decidir se se trata de filhos imediatos ou descendentes mais amplos.
- source_word: אֲבִי שְׁכֶם
  choice: pai de Siquém
  rationale: É a tradução direta da construção hebraica, deixando em nota a possibilidade de um sentido ancestral ou fundacional mais amplo.
- source_word: בְמֵאָה קְשִׂיטָה
  choice: por cem quesitas
  rationale: Translitera o antigo termo de valor, cujo equivalente exato é desconhecido, evitando uma conversão monetária enganosa.
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: e ficaram como herança para os filhos de José
  rationale: Conserva o plural do verbo hebraico e evita explicitar um sujeito que o texto não repete, preservando a dificuldade de referência.
theological_decisions:
- issue: Expressão de identidade בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A formulação familiar do original é inteligível em português e mantém sua dimensão de parentesco e identidade pactual sem acrescentar interpretação denominacional.
- issue: Termo antigo קְשִׂיטָה
  choice: quesitas
  alternative: peças de dinheiro
  rationale: O valor e a natureza exata da unidade são incertos; a transliteração com nota preserva essa incerteza em vez de apresentar uma equivalência moderna não demonstrável.
- issue: Referente do plural וַיִּהְיוּ
  choice: ficaram como herança
  alternative: aquela terra se tornou herança
  rationale: O hebraico emprega um verbo plural, embora o contexto possa apontar para a propriedade associada ao túmulo. A tradução não corrige silenciosamente o número nem resolve a referência ambígua.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para fluência, mas as expressões familiares, o termo monetário antigo e a ambiguidade final foram preservados.
