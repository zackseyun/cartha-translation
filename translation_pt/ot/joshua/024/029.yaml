base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: pt
  text: E aconteceu que, depois dessas coisas, Josué, filho de Num, servo de Yahweh, morreu aos cento e dez anos de idade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Depois dessas coisas
  rationale: A fórmula narrativa introduz o acontecimento seguinte. Em português, a construção temporal direta comunica naturalmente o sentido sem a expressão pesada «e aconteceu que»; «coisas» preserva a amplitude de דְּבָרִים.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas tradicionais e reconhecíveis dos nomes em português e explicita naturalmente a relação filial.
- source_word: וַיָּמָת
  choice: morreu
  rationale: מות significa diretamente morrer; evita-se um eufemismo que suavizaria o hebraico.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Embora עֶבֶד também possa significar «escravo», neste título honorífico destaca o serviço fiel a Yahweh, sem ênfase em condição servil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: aos cento e dez anos de idade
  rationale: Verte de modo idiomático em português a expressão hebraica de idade, conservando o número completo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; «Yahweh» preserva essa função, ao passo que «SENHOR» o substituiria por um título.
- issue: Sentido de עֶבֶד no título de Josué
  choice: servo
  alternative: escravo
  rationale: A amplitude lexical inclui ambas as possibilidades, mas o contexto de título póstumo honroso favorece «servo», sem negar a ideia de inteira sujeição a Yahweh.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. A vírgula em «Josué, filho de Num, servo de Yahweh» apresenta as duas expressões como apostos. Não há notas de rodapé, portanto não são necessários marcadores no texto.
