  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: pt
  text: 'E o povo disse a Josué: “Serviremos[a] a Yahweh, nosso Deus, e obedeceremos à sua voz.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Adoraremos”. O verbo hebraico pode indicar o culto prestado a Deus, mas “serviremos” preserva aqui o sentido mais amplo de lealdade e serviço no contexto da aliança.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “ouviremos” ou “escutaremos a sua voz”; expressão hebraica que implica responder com obediência ao que ele diz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: E o povo disse a Josué
  rationale: Reproduz de modo natural a sequência narrativa hebraica e introduz a fala direta sem acrescentar a ideia de resposta, que não está expressa no verbo.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: a Yahweh, nosso Deus
  rationale: Mantém o nome divino pessoal e apresenta “nosso Deus” como identificação relacional de Yahweh.
- source_word: נַעֲבֹד
  choice: serviremos
  rationale: O verbo עבד abrange serviço, lealdade e culto prestado a Deus; “serviremos” preserva melhor toda essa amplitude pactual do que “adoraremos”.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: e obedeceremos à sua voz
  rationale: שמע com בְּקוֹל expressa ouvir de modo responsivo, isto é, obedecer. A formulação conserva “voz”, elemento explícito do idioma hebraico, e comunica sua força obediencial.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal de Deus. “Yahweh” o representa diretamente, sem substituí-lo por um título.
- issue: Sentido religioso de עבד no contexto da aliança
  choice: serviremos
  alternative: adoraremos
  rationale: A declaração envolve tanto devoção cultual quanto lealdade prática. “Serviremos” preserva essa extensão sem reduzir o compromisso apenas ao ato de adoração.
- issue: Força de שמע na expressão שמע בקול
  choice: obedeceremos à sua voz
  alternative: ouviremos a sua voz; escutaremos a sua voz
  rationale: No contexto, não se trata apenas de percepção auditiva, mas de acolher e cumprir o que Deus diz. A tradução conserva a imagem da voz e explicita a resposta obediente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. Conserva-se “Yahweh” como nome divino e a imagem hebraica de obedecer à voz, enquanto as notas registram alternativas lexicais genuínas.
