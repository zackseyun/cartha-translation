base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: pt
  text: E enviei a vespa adiante de vocês[a], e ela os expulsou de diante de vocês — os dois reis dos amorreus — não pela sua espada nem pelo seu arco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, uma expressão figurada para o pânico ou terror enviado por Deus, em vez de vespas literais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: E enviei
  rationale: O wayyiqtol qal na primeira pessoa do singular dá continuidade à narrativa e descreve a ação passada de YHWH; “E enviei” preserva essa sequência sem explicitar uma nuance temporal além do hebraico.
- source_word: לִפְנֵיכֶם
  choice: adiante de vocês
  rationale: Literalmente, “diante da face/presença de vocês”; neste contexto, indica algo enviado à frente do povo.
- source_word: הַצִּרְעָה
  choice: a vespa
  rationale: O sentido lexical concreto é “vespa”; o singular definido pode funcionar de maneira coletiva ou representativa. A possível leitura figurada é mantida em nota, sem substituir o termo do texto.
- source_word: וַתְּגָרֶשׁ אוֹתָם
  choice: e ela os expulsou
  rationale: גרשׁ significa expulsar ou pôr para fora. O verbo feminino singular concorda com “a vespa”, concordância preservada pelo pronome “ela”.
- source_word: מִפְּנֵיכֶם
  choice: de diante de vocês
  rationale: Com גרשׁ, a expressão indica a remoção dos inimigos da presença dos israelitas; esta formulação conserva de modo natural a imagem hebraica.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: os dois reis dos amorreus
  rationale: Reproduz com clareza a cadeia construta e identifica os dois soberanos amorreus mencionados no contexto.
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: não pela sua espada nem pelo seu arco
  rationale: A preposição ב é instrumental. “Pela” exprime o meio, e “nem” estabelece em português a paralelismo negativo natural. O possessivo singular preserva a forma hebraica, na qual Israel é interpelado coletivamente.
theological_decisions:
- issue: Se הַצִּרְעָה deve ser traduzido literalmente ou interpretado como metáfora do pânico ou terror enviado por Deus
  choice: Traduzir literalmente como “a vespa” no texto principal
  alternative: Traduzir interpretativamente como “o pânico” ou “o terror”
  rationale: O sentido lexical concreto deve permanecer no texto porque o contexto não exige que seja substituído por uma interpretação. A nota registra a possibilidade figurada, preservando a ambiguidade legítima. Em ambas as leituras, o verso atribui a expulsão dos inimigos à ação de Deus, não ao poder militar de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” distingue naturalmente o plural dos primeiros pronomes, enquanto “sua espada” e “seu arco” preservam a mudança hebraica para o singular coletivo. A repetição “adiante de vocês/de diante de vocês” conserva o jogo lexical de לִפְנֵיכֶם e מִפְּנֵיכֶם sem soar excessivamente artificial.
