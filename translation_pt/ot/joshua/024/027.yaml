  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: pt
  text: 'Josué disse a todo o povo: “Vejam! Esta pedra será testemunha contra nós[a], pois ela ouviu[b] todas as palavras de Yahweh, que ele falou conosco. Ela será testemunha contra vocês, para que vocês não neguem o seu Deus[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “testemunha para nós” ou “a nosso respeito”. A preposição hebraica pode ser entendida de modo mais neutro, mas, neste contexto, a pedra testemunharia contra a infidelidade à aliança.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “ouviu”; a pedra é personificada como testemunha das palavras da aliança.
    reason: cultural_note
  - marker: c
    text: Ou “sejam infiéis ao seu Deus”, “ajam falsamente para com o seu Deus” ou “se mostrem falsos para com o seu Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Interjeição corrente que chama a atenção para a pedra, preservando a força dêitica do hebraico sem tom arcaico.
- source_word: הָאֶבֶן הַזֹּאת
  choice: Esta pedra
  rationale: אֶבֶן designa normalmente uma pedra; a escolha é precisa para o marco da aliança neste contexto.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: será testemunha
  rationale: Mantém o sentido testemunhal e quase jurídico de עֵדָה, bem como a formulação direta do hebraico.
- source_word: בָּנוּ / בָכֶם
  choice: contra nós / contra vocês
  rationale: No contexto da advertência da aliança, a preposição indica que a pedra dará testemunho acerca das partes e, em caso de infidelidade, contra elas. A nota preserva a possibilidade de uma leitura mais neutra.
- source_word: שָׁמְעָה
  choice: ouviu
  rationale: Preserva literalmente a personificação explícita da pedra como participante testemunhal da cerimônia.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: todas as palavras de Yahweh
  rationale: “Palavras” é natural e adequado ao discurso da aliança; “Yahweh” representa diretamente o nome divino יהוה.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: que ele falou conosco
  rationale: “Falou conosco” representa de modo natural a preposição עִם e conserva a dimensão relacional da fala da aliança.
- source_word: פֶּן תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: para que não neguem o seu Deus
  rationale: A formulação transmite a força preventiva de פֶּן. “Neguem” expressa com clareza כחש em relação a Deus, sem excluir as nuances de agir falsamente ou ser infiel.
theological_decisions:
- issue: Personificação da pedra como alguém que ouve e testemunha
  choice: Conservar literalmente a linguagem personificada
  alternative: Explicitar apenas que a pedra funciona como memorial simbólico
  rationale: O hebraico afirma expressamente que a pedra “ouviu” e “será testemunha”. Manter essa retórica respeita a cerimônia da aliança e evita reduzir a tensão poética do texto.
- issue: Valor adversativo da pedra como testemunha
  choice: “contra nós” e “contra vocês”
  alternative: “para nós”, “diante de nós” ou “entre vocês”
  rationale: A advertência final favorece o sentido de testemunho contra a infidelidade, embora a construção hebraica permita uma relação mais neutra; essa ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Conservam-se a repetição de “testemunha”, o nome divino “Yahweh” e a personificação da pedra. O plural “vocês” torna explícito o destinatário coletivo sem recorrer a formas regionais ou arcaizantes.
