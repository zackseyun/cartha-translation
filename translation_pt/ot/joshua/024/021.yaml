  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: pt
  text: 'Mas o povo disse a Josué: “Não, mas serviremos a Yahweh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente, “SENHOR”; também transliterado “Javé”.'
    reason: Explica o nome divino e registra formas portuguesas correntes.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר para introduzir fala direta; “disse” é natural e fiel em português.
- source_word: הָעָם
  choice: o povo
  rationale: Refere-se à comunidade de Israel reunida no contexto da aliança.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: לֹא
  choice: Não!
  rationale: Funciona como rejeição enfática da advertência anterior de Josué; a exclamação comunica essa força sem ampliar o conteúdo.
- source_word: כִּי
  choice: não representado por uma conjunção separada
  rationale: Depois do “Não!”, introduz a afirmação corretiva ou enfática. Em português, a justaposição “Não! Nós...” expressa essa relação com mais naturalidade; “mas” seria possível, porém redundante após o “Mas” narrativo inicial.
- source_word: אֶת יְהוָה
  choice: a Yahweh
  rationale: O marcador de objeto אֶת não recebe tradução independente; o nome divino é transliterado como “Yahweh”, preservando o nome da aliança.
- source_word: נַעֲבֹד
  choice: serviremos
  rationale: O imperfeito qal na resposta expressa decisão ou compromisso futuro; “serviremos” preserva tanto o serviço quanto a lealdade pactual, sem restringir o sentido a culto ritual.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: A transliteração “Yahweh” representa diretamente o tetragrama e preserva o nome pessoal da aliança. A nota informa a forma hebraica e a convenção portuguesa alternativa sem impor uma tradição confessional.
- issue: Amplitude de עבד no contexto da aliança
  choice: serviremos
  alternative: adoraremos
  rationale: “Servir” conserva a amplitude semântica de lealdade, obediência e culto; “adorar” estreitaria o sentido ao âmbito cultual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e a concisão da resposta hebraica foram preservadas; a pontuação destaca a rejeição enfática sem acrescentar conteúdo.
