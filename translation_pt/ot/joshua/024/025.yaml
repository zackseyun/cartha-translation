base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: pt
  text: Assim, naquele dia, Josué fez uma aliança com o povo[a] e, em Siquém, estabeleceu para o povo um estatuto e uma ordenança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “cortou uma aliança com o povo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estabeleceu para o povo um decreto e uma decisão judicial”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: fez
  rationale: Em conjunto com בְּרִית, o verbo forma a expressão idiomática literalmente equivalente a “cortar uma aliança”. “Fez uma aliança” comunica o sentido em português natural, enquanto a forma literal é preservada em nota.
- source_word: בְּרִית
  choice: aliança
  rationale: “Aliança” preserva as dimensões relacional, solene e vinculante do termo no contexto de Israel, melhor que “acordo” ou o mais restrito “tratado”.
- source_word: לָעָם
  choice: com o povo
  rationale: Embora a preposição seja ל, na expressão de celebração de aliança ela apresenta o povo como participante. “Com o povo” é a formulação idiomática e clara em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Equivalente temporal direto e natural, colocado no início da oração para boa fluidez em português.
- source_word: וַיָּשֶׂם
  choice: estabeleceu
  rationale: שׂים tem o sentido amplo de pôr ou colocar; com termos jurídicos, “estabeleceu” expressa naturalmente a instituição de normas.
- source_word: לוֹ
  choice: para ele
  rationale: O pronome hebraico está no singular e retoma עָם, “povo”, entendido coletivamente. O singular foi mantido em português sem mudar o referente para indivíduos separados.
- source_word: חֹק
  choice: estatuto
  rationale: O termo denota uma prescrição ou disposição fixada. “Estatuto” conserva seu caráter jurídico.
- source_word: וּמִשְׁפָּט
  choice: ordenança
  rationale: Neste contexto jurídico, מִשְׁפָּט pode designar uma determinação ou norma legal. “Ordenança” forma um par claro com “estatuto”, sem reduzir o termo à justiça abstrata.
- source_word: בִּשְׁכֶם
  choice: em Siquém
  rationale: Tradução direta do local onde Josué realizou esse ato; não se acrescenta “ali”, que não aparece expressamente no hebraico.
theological_decisions:
- issue: Natureza da ação de Josué ao fazer a aliança
  choice: Josué fez uma aliança com o povo
  alternative: Josué renovou a aliança em favor do povo
  rationale: O versículo apresenta Josué como sujeito da ação e o povo como participante, mas não explicita aqui todas as partes nem chama o ato de renovação. A tradução conserva a formulação do texto sem inserir uma explicação teológica derivada do contexto mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem temporal foi ajustada naturalmente, e o singular coletivo “povo ... para ele” preserva a forma hebraica. As notas registram o idioma concreto de celebração da aliança e a amplitude dos dois termos jurídicos.
