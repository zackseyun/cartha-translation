source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: pt
  text: Então eles clamaram a Yahweh, e ele pôs escuridão entre vocês e os egípcios, trouxe o mar sobre ele[a] e o cobriu. Os olhos de vocês viram o que fiz no Egito. Depois, vocês viveram no deserto muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico emprega aqui pronomes no singular: “sobre ele” e “o cobriu”. O sentido pode ser coletivo, referindo-se ao Egito ou à força militar egípcia; muitas traduções usam “eles”.'
    reason: Preservar e explicar os sufixos pronominais singulares do texto hebraico e a possível leitura coletiva.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל יְהוָה
  choice: clamaram a Yahweh
  rationale: צעק expressa um clamor urgente por socorro, e אֶל indica a quem ele foi dirigido. “Clamaram” é natural, digno e preserva a dimensão de súplica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מַאֲפֵל
  choice: escuridão
  rationale: O substantivo denota escuridão ou trevas densas. “Escuridão” é claro e não especifica uma intensidade além da que o contexto exige.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: entre vocês e os egípcios
  rationale: Mantém a segunda pessoa do plural na fala de Josué e oferece uma formulação natural em português contemporâneo.
- source_word: וַיָּבֵא עָלָיו אֶת הַיָּם
  choice: fez o mar vir sobre ele
  rationale: Preserva o sufixo pronominal masculino singular do hebraico, apesar de sua provável força coletiva referente ao Egito ou ao exército egípcio.
- source_word: וַיְכַסֵּהוּ
  choice: e o cobriu
  rationale: Traduz diretamente o verbo “cobrir” e conserva o objeto masculino singular presente no texto hebraico.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: Os olhos de vocês viram
  rationale: Retém a menção explícita aos olhos, preservando a ênfase vívida no testemunho direto.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: o que fiz no Egito
  rationale: “No Egito” representa de modo direto a preposição ב e evita decidir se a ação deve ser entendida especificamente como feita contra o Egito.
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר
  choice: vocês viveram no deserto
  rationale: ישב pode significar morar, permanecer ou viver. “Viveram” comunica naturalmente uma permanência prolongada.
- source_word: יָמִים רַבִּים
  choice: muitos dias
  rationale: Mantém a expressão literal e evita ampliá-la interpretativamente para “muitos anos” ou reduzi-la a “muito tempo”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O original emprega diretamente o tetragrama. A transliteração preserva o nome pessoal da aliança em vez de substituí-lo por um título.
- issue: Número dos pronomes referentes ao Egito ou à força egípcia
  choice: 'manter o singular: “sobre ele” e “o cobriu”'
  alternative: 'regularizar para o plural: “sobre eles” e “os cobriu”'
  rationale: Os dois sufixos pronominais no texto hebraico são masculinos singulares. Embora o referente provavelmente seja coletivo, a tradução mantém a forma singular e registra a leitura coletiva em nota, sem resolver silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural e conserva construções marcadas do hebraico quando elas carregam informação textual relevante. O marcador da nota foi colocado após os pronomes que ela explica.
