  naturalness: “Fez o mar vir sobre ele” é compreensível, mas soa menos idiomático em português moderno do que “trouxe o mar sobre ele”, que também traduz diretamente o valor causativo de וַיָּבֵא. A posição atual da nota, após apenas “o cobriu”, não sinaliza com clareza que ela explica ambos os pronomes singulares.
  terminology: “Yahweh”, “clamaram”, “escuridão”, “egípcios” e “deserto” são apropriados ao registro e à política terminológica indicada. A nota explica a dificuldade sem resolver de modo doutrinário o referente coletivo.
