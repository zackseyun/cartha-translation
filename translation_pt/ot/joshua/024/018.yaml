  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: pt
  text: E Yahweh expulsou de diante de nós todos os povos e os amorreus que habitavam a terra[a]. Nós também serviremos a Yahweh, pois ele é o nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os povos, inclusive os amorreus que habitavam a terra”.'
    reason: A construção hebraica coordena «os amorreus» com «todos os povos», mas, no contexto, também pode ser entendida como inclusão ou especificação dos amorreus entre esses povos.
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: expulsou
  rationale: O verbo גרש expressa a ação de pôr para fora ou afastar à força. “Expulsou” é claro em português e preserva a ideia de remoção sem especificar além do texto os meios empregados.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כָּל הָעַמִּים
  choice: todos os povos
  rationale: O plural עַמִּים designa aqui diversos grupos étnicos ou nacionais; “povos” preserva esse plural e é natural em português.
- source_word: וְאֶת הָאֱמֹרִי
  choice: inclusive os amorreus
  rationale: No fluxo da frase, os amorreus podem ser entendidos como incluídos entre os povos mencionados. A construção hebraica também admite a coordenação simples “e os amorreus”, preservada em nota.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: que habitavam na terra
  rationale: O particípio singular funciona coletivamente com “os amorreus”. O plural em português faz a concordância natural com o nome coletivo traduzido no plural e mantém o sentido de residência contínua.
- source_word: מִפָּנֵינוּ
  choice: de diante de nós
  rationale: Preserva a imagem espacial do idioma hebraico, segundo a qual Yahweh removeu os povos da presença ou do caminho de Israel.
- source_word: גַּם אֲנַחְנוּ
  choice: Nós também
  rationale: Marca a adesão responsiva do povo e mantém a ênfase explícita do pronome hebraico.
- source_word: נַעֲבֹד
  choice: serviremos
  rationale: עבד, tendo Deus como objeto, abrange culto, lealdade e serviço de aliança. “Serviremos” conserva essa amplitude.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: pois ele é o nosso Deus
  rationale: “Pois” introduz naturalmente a razão dada para o compromisso, enquanto “o nosso Deus” reproduz a relação expressa pelo sufixo possessivo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo pelo título “SENHOR”.
- issue: Amplitude de עבד no contexto da aliança
  choice: serviremos
  alternative: adoraremos
  rationale: O verbo inclui adoração, mas também lealdade e serviço mais amplos. “Serviremos” evita restringir o compromisso apenas ao culto.
- issue: Relação dos amorreus com “todos os povos”
  choice: inclusive os amorreus
  alternative: e os amorreus
  rationale: A leitura inclusiva torna explícita uma relação contextual plausível, mas a sintaxe hebraica usa coordenação e permite a leitura simples “e os amorreus”; essa alternativa é mantida em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “De diante de nós” conserva deliberadamente a imagem hebraica sem soar obscuro; “habitavam” comunica residência contínua. O nome “amorreus” segue a forma bíblica corrente em português.
source_grounding:
  english_pob_role: consult_only
