base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: pt
  text: Então vocês atravessaram o Jordão e chegaram a Jericó, e os homens de Jericó[a], os amorreus, os ferezeus, os cananeus, os hititas, os girgaseus, os heveus e os jebuseus lutaram contra vocês; e eu os entreguei nas mãos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os senhores de Jericó”, “os governantes de Jericó” ou “os principais homens de Jericó”. A expressão hebraica significa literalmente “senhores/donos de Jericó” e pode se referir aos governantes, aos cidadãos de destaque ou, mais amplamente, aos habitantes da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: vocês atravessaram o Jordão
  rationale: O qal wayyiqtol de עבר descreve a travessia concreta do rio. “Atravessaram o Jordão” é natural em português e não exige acrescentar “rio”.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: chegaram a Jericó
  rationale: בוא com אֶל pode indicar chegar a ou entrar em. “Chegaram a” preserva a referência à chegada sem afirmar além do texto que naquele momento já haviam entrado na cidade.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: os senhores de Jericó
  rationale: בעלי significa literalmente “senhores”, “donos” ou “proprietários”. A expressão pode designar governantes, notáveis ou habitantes com pleno status cívico; a tradução mantém essa abertura sem reduzi-la simplesmente a todos os homens da cidade.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: lutaram contra vocês
  rationale: O verbo לחם com ב indica confronto hostil. A formulação é clara e idiomática em português moderno.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: os amorreus, os ferezeus, os cananeus, os hititas, os girgaseus, os heveus e os jebuseus
  rationale: Embora as formas hebraicas estejam no singular coletivo, o plural é a maneira natural de nomear esses povos em português. As grafias escolhidas são amplamente reconhecíveis na tradição bíblica lusófona.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: eu os entreguei nas mãos de vocês
  rationale: נתן ביד é um idioma que expressa sujeição ao poder de alguém. “Entreguei nas mãos de vocês” conserva a imagem hebraica em português inteligível.
theological_decisions:
- issue: Agência na vitória de Israel
  choice: “eu os entreguei nas mãos de vocês”
  alternative: “permiti que vocês os vencessem”
  rationale: A fala divina atribui diretamente a derrota dos adversários à ação de Deus. A tradução preserva essa afirmação, sem reduzi-la a mera permissão.
- issue: Relação sintática entre os senhores de Jericó e a lista de povos
  choice: A lista após o travessão funciona como explicação ou identificação dos adversários.
  alternative: Entender os senhores de Jericó como um grupo separado, além dos sete povos.
  rationale: O hebraico permite alguma tensão na relação entre בעלי יריחו e a enumeração seguinte. A pontuação escolhida acompanha a leitura explicativa mais natural, sem inserir uma conjunção que estabeleça explicitamente um grupo adicional.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com “vocês” para o plural da segunda pessoa. Conserva-se a imagem bíblica “nas mãos de vocês”. O adversativo “mas” torna natural a passagem do ataque dos povos para a intervenção divina, sem alterar a relação narrativa do hebraico.
