revisions:
- from: Então vocês atravessaram o Jordão e chegaram a Jericó. Os senhores de Jericó[a] lutaram contra vocês — os amorreus, os ferezeus, os cananeus, os hititas, os girgaseus, os heveus e os jebuseus —, mas eu os entreguei nas mãos de vocês.
  to: Então vocês atravessaram o Jordão e chegaram a Jericó, e os homens de Jericó[a], os amorreus, os ferezeus, os cananeus, os hititas, os girgaseus, os heveus e os jebuseus lutaram contra vocês; e eu os entreguei nas mãos de vocês.
  rationale: A revisão elimina a adversativa não expressa no texto-fonte e substitui a formulação literal e potencialmente enganosa «os senhores de Jericó» por «os homens de Jericó». A nota preserva as alternativas interpretativas de בעלי יריחו sem decidir indevidamente uma questão lexical debatida. A enumeração é mantida como a lista coordenada de adversários no hebraico.
