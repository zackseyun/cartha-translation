  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: pt
  text: Eleazar, filho de Arão, morreu, e o sepultaram em Gibeá de Fineias — seu filho —, a qual lhe havia sido dada na região montanhosa de Efraim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na colina de Fineias — seu filho —, a qual lhe havia sido dada na região montanhosa de Efraim”. O hebraico também permite entender “Gibeá de Fineias” como nome de lugar; não fica totalmente claro se “lhe” se refere a Eleazar ou a Fineias.'
    reason: Registra a possível leitura de גִּבְעַת como “colina”, preserva a ambiguidade do referente de לוֹ e torna clara a aposição que identifica Fineias como filho de Eleazar.
lexical_decisions:
- source_word: גִּבְעַת פִּינְחָס
  choice: Gibeá de Fineias
  rationale: O hebraico pode designar um topônimo, literalmente relacionado à 'colina de Fineias'. A forma toponímica preserva a identificação tradicional sem acrescentar 'região montanhosa' neste ponto.
- source_word: הַר אֶפְרָיִם
  choice: região montanhosa de Efraim
  rationale: Aqui הַר se refere à região serrana ou montanhosa de Efraim, não necessariamente a um monte isolado.
- source_word: נִתַּן לוֹ
  choice: lhe havia sido dada
  rationale: Mantém o pronome masculino singular ambíguo do hebraico quanto ao beneficiário; a concordância feminina em português retoma naturalmente a localidade.
theological_decisions:
- issue: Referente de 'seu filho' e de 'lhe'
  choice: Preservar na tradução a leitura sintaticamente natural de que Fineias era filho de Eleazar e que a localidade lhe fora dada, sem explicitar se 'lhe' aponta para Fineias ou Eleazar.
  alternative: 'Explicitar: ''que havia sido dada a Fineias'' ou ''que havia sido dada a Eleazar''.'
  rationale: O texto hebraico identifica Fineias como 'seu filho', mas o referente de לוֹ pode ser entendido de mais de uma maneira. Não há razão teológica ou linguística suficiente para resolver essa ambiguidade no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O advérbio “também” representa o וְ inicial no contexto das mortes relatadas anteriormente. A formulação evita a expressão confusa da camada inglesa “his son’s hill country” e segue diretamente a sintaxe hebraica.
