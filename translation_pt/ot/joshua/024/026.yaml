base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: pt
  text: E Josué escreveu essas palavras no Livro da Lei de Deus. Depois, pegou uma grande pedra e a ergueu ali, debaixo do terebinto[a] que ficava no santuário[b] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “debaixo do carvalho”. O termo hebraico também pode referir-se a um carvalho; a identificação exata da árvore é incerta.
    reason: lexical_alternative
  - marker: b
    text: Ou “que ficava junto ao santuário de Yahweh”. Neste contexto, a preposição hebraica também pode ser entendida em sentido espacial menos estrito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: escreveu
  rationale: O verbo כתב significa diretamente “escrever”; a forma simples e concreta corresponde ao ato de registrar as palavras no livro.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: essas palavras
  rationale: דברים pode indicar palavras, assuntos ou coisas; no contexto de um registro escrito da aliança, “palavras” preserva melhor o sentido textual.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: no Livro da Lei de Deus
  rationale: ספר designa o livro ou rolo em que se escreve, e תורה pode significar lei ou instrução. “Livro da Lei de Deus” mantém a construção hebraica e é clara no contexto da aliança.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: pegou uma grande pedra
  rationale: A expressão descreve de modo direto uma pedra de grandes dimensões; “grande pedra” é natural e fiel.
- source_word: וַיְקִימֶהָ
  choice: a ergueu
  rationale: O hifil de קום indica fazer a pedra ficar em pé, provavelmente como marco ou memorial. “Ergueu” expressa esse ato com naturalidade.
- source_word: תַּחַת הָאַלָּה
  choice: debaixo do terebinto
  rationale: אַלָּה costuma designar o terebinto, embora a identificação da árvore não seja totalmente segura e também seja tradicionalmente traduzida como “carvalho”.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: no santuário de Yahweh
  rationale: מקדש é um lugar santo ou santuário, e a preposição בְּ tem primariamente sentido locativo, “em/no”. O nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino, não um título. “Yahweh” o representa por transliteração sem substituí-lo por “Senhor”.
- issue: Sentido de תּוֹרַת אֱלֹהִים
  choice: Lei de Deus
  alternative: instrução de Deus
  rationale: תורה possui uma extensão semântica que inclui ensino e instrução, mas “Lei de Deus” é adequada ao documento da aliança neste contexto e preserva a formulação reconhecível sem negar o sentido mais amplo do termo.
- issue: Relação espacial entre a árvore e מִקְדַּשׁ יְהוָה
  choice: a árvore ficava no santuário de Yahweh
  alternative: a árvore ficava junto ao santuário de Yahweh
  rationale: A preposição בְּ favorece “no”, indicando que a árvore estava dentro do recinto sagrado; como ela pode assumir um sentido espacial menos estrito, a alternativa “junto ao” é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Depois” explicita de modo natural a progressão narrativa do waw consecutivo sem alterar a sequência. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
