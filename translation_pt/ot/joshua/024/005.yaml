  text: וָ/אֶשְׁלַ֞ח אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ וָ/אֶגֹּ֣ף אֶת מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּ֑/וֹ וְ/אַחַ֖ר הוֹצֵ֥אתִי אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: pt
  text: Então enviei Moisés e Arão e feri o Egito de acordo com o que fiz no meio dele[a]. Depois, tirei vocês de lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “feri o Egito com o que fiz no meio dele”. A construção hebraica é condensada; literalmente, “conforme o que fiz no meio dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: enviei
  rationale: O qal de שׁלח significa normalmente “enviar”; “enviei” é natural e preserva a ação divina de comissionar Moisés e Arão.
- source_word: מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Moisés e Arão
  rationale: Formas tradicionais e amplamente reconhecidas dos nomes em português.
- source_word: וָאֶגֹּף
  choice: feri
  rationale: נגף pode significar golpear, ferir ou afligir. “Feri” mantém a força direta do hebraico sem explicitar interpretativamente “castiguei com pragas”.
- source_word: מִצְרַיִם
  choice: o Egito
  rationale: O nome pode designar a terra ou seu povo; aqui “o Egito” funciona naturalmente como entidade coletiva.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: com o que fiz no meio dele
  rationale: A construção é sintaticamente condensada. Esta formulação liga o ato de ferir às ações realizadas dentro do Egito e preserva o pronome singular referente ao país como entidade coletiva.
- source_word: וְאַחַר
  choice: Depois disso
  rationale: אַחַר tem aqui valor temporal e marca a sequência dos acontecimentos em português corrente.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: tirei vocês de lá
  rationale: O hifil de יצא significa “fazer sair” ou “tirar”. “Vocês” preserva a segunda pessoa plural e “de lá” torna explícita apenas a origem já indicada pelo Egito.
theological_decisions:
- issue: Referente da segunda pessoa plural em אֶתְכֶם
  choice: “vocês”, dirigindo-se corporativamente a Israel
  alternative: “seus antepassados”, restringindo a referência à geração do êxodo
  rationale: O hebraico diz diretamente “vocês”. A tradução conserva a solidariedade corporativa e a retórica da aliança, sem substituir o destinatário gramatical por uma explicação.
- issue: Natureza do golpe contra o Egito
  choice: “feri”, sem especificar no texto principal que foram as pragas
  alternative: “castiguei o Egito com pragas”
  rationale: O contexto evoca as pragas, mas נגף é mais amplo. A formulação escolhida evita resolver no texto principal uma especificação contextual que o verbo não lexicaliza por si só.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” comunica claramente o plural do hebraico em uso internacional contemporâneo. A frase foi levemente descondensada em dois períodos para manter clareza sem perder a sequência narrativa.
