review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente os imperativos, o nome divino, a dupla «integridade e fidelidade», a remoção dos deuses e a referência geográfica. Contudo, «temam a Yahweh» introduz uma preposição que não é idiomática com «temer» neste uso; «seus pais» em português normalmente designa os progenitores imediatos e pode também sugerir pai e mãe, não os antepassados/forefathers em vista no contexto.
  naturalness: O registro é claro e moderno. «Temam Yahweh» é a construção portuguesa natural. «Seus antepassados» evita a ambiguidade contemporânea de «seus pais» e expressa naturalmente o referente histórico coletivo.
  terminology: «Yahweh», «servir», «integridade» e «fidelidade» são escolhas adequadas. A nota lexical preserva legitimamente «verdade» como alternativa para בֶאֱמֶת. As âncoras das notas estão corretamente associadas aos termos portugueses a que se referem.
  issues:
  - severity: medium
    issue: Regência em «temam a Yahweh»
    rationale: 'No português padrão, «temer» é transitivo direto neste sentido: «temam Yahweh». A preposição «a» torna a formulação menos natural.'
  - severity: medium
    issue: «Seus pais» para אֲבוֹתֵיכֶם
    rationale: Embora literalmente relacionado a «pais», em português moderno a expressão tende a significar os progenitores imediatos e pode ser entendida como inclusiva de mãe e pai. O contexto de Josué 24 requer os antepassados históricos; «seus antepassados» comunica esse referente sem introduzir interpretação teológica.
  revised_text: Agora, temam Yahweh e sirvam-no com integridade e fidelidade[a]; removam os deuses aos quais seus antepassados serviram do outro lado do Rio[b] e no Egito, e sirvam a Yahweh.
  revised_footnotes:
  - marker: a
    text: Ou “com integridade e verdade”. Os termos hebraicos abrangem inteireza, sinceridade, verdade e confiabilidade.
    reason: lexical_alternative
  - marker: b
    text: Isto é, do outro lado do rio Eufrates.
    reason: cultural_note
