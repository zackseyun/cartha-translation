  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: pt
  text: Agora, temam Yahweh e sirvam-no com integridade e fidelidade[a]; removam os deuses aos quais seus antepassados serviram do outro lado do Rio[b] e no Egito, e sirvam a Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com integridade e verdade”. Os termos hebraicos abrangem inteireza, sinceridade, verdade e confiabilidade.
    reason: lexical_alternative
  - marker: b
    text: Isto é, do outro lado do rio Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a exortação que decorre do relato histórico anterior; a forma é natural e direta em português.
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: temam a Yahweh
  rationale: Preserva o sentido básico de temor diante de Deus e sua tensão teológica, sem reduzi-lo apenas a reverência.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: e sirvam-no
  rationale: O verbo abrange culto, lealdade e obediência; “servir” mantém essa amplitude e a repetição retórica no fim do versículo.
- source_word: בְּתָמִים
  choice: com integridade
  rationale: Expressa inteireza, sinceridade e devoção não dividida, sem sugerir perfeição moral absoluta.
- source_word: וּבֶאֱמֶת
  choice: e fidelidade
  rationale: Neste contexto de serviço pactual, אֱמֶת pode indicar firmeza, confiabilidade e sinceridade. “Fidelidade” comunica bem essa dimensão, enquanto “verdade” permanece uma alternativa legítima registrada em nota.
- source_word: וְהָסִירוּ
  choice: removam
  rationale: Verbo imperativo que exige a eliminação dos deuses rivais; a escolha é clara, sóbria e próxima da imagem hebraica.
- source_word: אֶת־אֱלֹהִים
  choice: os deuses
  rationale: O hebraico não inclui o adjetivo “estrangeiros”; por isso, ele não é acrescentado.
- source_word: אֲבוֹתֵיכֶם
  choice: seus pais
  rationale: Mantém a forma familiar masculina do hebraico, aqui referente aos antepassados do povo.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: do outro lado do Rio
  rationale: Conserva a expressão geográfica convencional do texto, deixando a identificação do rio para a nota.
- source_word: וּבְמִצְרַיִם
  choice: e no Egito
  rationale: Reprodução direta da expressão locativa.
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: e sirvam a Yahweh
  rationale: Preserva a conjunção e a repetição enfática do imperativo inicial.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Mantém o nome divino expresso no hebraico em vez de substituí-lo por um título.
- issue: Sentido de ירא na exortação
  choice: temam
  alternative: reverenciem
  rationale: “Temam” conserva a força do verbo hebraico e a tensão entre temor, reverência e obediência pactual.
- issue: Tradução de אֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A escolha acompanha a forma masculina e familiar do texto hebraico sem excluir seu referente ancestral.
- issue: Relação entre תָמִים e אֱמֶת
  choice: com integridade e fidelidade
  alternative: com inteireza e verdade; com sinceridade e verdade
  rationale: A formulação comunica devoção inteira e confiável sem transformar os termos em uma afirmação de impecabilidade nem eliminar sua amplitude semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” está implícito nas formas verbais “temam”, “sirvam” e “removam”. O ponto e vírgula organiza a sequência de imperativos sem enfraquecer sua unidade.
