revisions:
- from: Agora, temam a Yahweh e sirvam-no com integridade e fidelidade[a]; removam os deuses aos quais seus pais serviram do outro lado do Rio[b] e no Egito, e sirvam a Yahweh.
  to: Agora, temam Yahweh e sirvam-no com integridade e fidelidade[a]; removam os deuses aos quais seus antepassados serviram do outro lado do Rio[b] e no Egito, e sirvam a Yahweh.
  rationale: 'Foram feitas apenas correções seguras de idiomaticidade e de referente histórico: retirou-se a preposição indevida após «temam» e substituiu-se «seus pais» por «seus antepassados». O restante preserva a estrutura, a repetição do imperativo, a ambiguidade lexical de אֱמֶת e as âncoras das notas.'
  reviewer_model: gpt-5.6-terra
