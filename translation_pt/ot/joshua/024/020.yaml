  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: pt
  text: Se vocês abandonarem Yahweh e servirem a deuses estrangeiros, então ele se voltará, lhes fará mal[a] e acabará com vocês[b], depois de lhes ter feito bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhes trará calamidade”. O verbo hebraico pode indicar causar dano ou calamidade, não maldade moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “os destruirá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Se
  rationale: Neste contexto de advertência, introduz a condição cuja consequência é apresentada na oração seguinte.
- source_word: תַעַזְבוּ אֶת־יְהוָה
  choice: vocês abandonarem Yahweh
  rationale: עזב expressa aqui abandono relacional e da lealdade da aliança; o nome divino é transliterado como “Yahweh”.
- source_word: וַעֲבַדְתֶּם אֱלֹהֵי נֵכָר
  choice: e servirem a deuses estrangeiros
  rationale: עבד, quando tem deuses por objeto, denota serviço e lealdade religiosa; נכר identifica esses deuses como alheios a Israel e ao culto de Yahweh.
- source_word: וְשָׁב
  choice: ele se voltará contra vocês
  rationale: שוב indica uma reversão na maneira como Yahweh trata o povo; “contra vocês” torna clara em português a direção hostil indicada pelo contexto, sem eliminar a imagem de mudança.
- source_word: וְהֵרַע לָכֶם
  choice: lhes fará mal
  rationale: O hifil de רעע aqui significa causar dano ou calamidade, não praticar maldade moral.
- source_word: וְכִלָּה אֶתְכֶם
  choice: e acabará com vocês
  rationale: כלה comunica levar ao fim ou exterminar; a expressão é natural, severa e preserva a possibilidade lexical de destruição.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: depois de ter feito o bem a vocês
  rationale: היטיב descreve beneficiar ou fazer o bem e estabelece o forte contraste entre a bondade anterior e o juízo posterior.
theological_decisions:
- issue: Juízo divino após a beneficência anterior
  choice: Atribuir diretamente a Yahweh a reversão, o dano e o fim do povo em resposta à apostasia.
  alternative: Apresentar esses males apenas como consequências naturais da idolatria.
  rationale: Os verbos hebraicos mantêm Yahweh como sujeito das ações judiciais. A tradução preserva essa tensão teológica sem suavizar a agência divina nem recorrer a um sistema doutrinário posterior.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A formulação preserva a estrutura condicional, a força da advertência da aliança e o contraste entre benefício anterior e juízo posterior.
