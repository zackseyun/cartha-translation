source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of slaves, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: pt
  text: Pois Yahweh, nosso Deus, foi quem nos fez sair, a nós e a nossos pais, da terra do Egito, da casa de escravos[a]. Foi ele quem realizou diante dos nossos olhos estes grandes sinais e nos guardou por todo o caminho que percorremos e entre todos os povos por cujo meio passamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da casa da escravidão”. O hebraico diz literalmente “da casa de escravos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão dada pelo povo para a declaração de compromisso do versículo anterior e preserva naturalmente a ligação discursiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, preservando seu caráter pessoal e pactual.
- source_word: הוּא הַמַּעֲלֶה
  choice: foi quem nos fez sair
  rationale: O pronome independente dá ênfase ao agente. Embora עלה expresse literalmente fazer subir, em português 'fez sair' comunica com naturalidade o êxodo do Egito sem sugerir que a geração presente tenha realizado a ação por si mesma.
- source_word: וְאֶת אֲבוֹתֵינוּ
  choice: a nós e a nossos pais
  rationale: Mantém a referência concreta aos pais das pessoas que falam e a construção enfática que inclui tanto o povo presente quanto as gerações anteriores.
- source_word: מִבֵּית עֲבָדִים
  choice: da casa de escravos
  rationale: Preserva a expressão concreta do hebraico, cujo substantivo plural significa 'escravos', em vez de substituí-la silenciosamente pelo abstrato 'escravidão'.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: estes grandes sinais
  rationale: Mantém os três elementos da expressão hebraica e conserva o valor de אוֹת como sinal, sem restringi-lo interpretativamente a 'milagre' ou 'maravilha'.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: nos guardou
  rationale: Comunica diretamente a proteção e preservação exercidas por Deus durante a jornada.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: por todo o caminho que percorremos
  rationale: Expressão portuguesa natural que preserva a extensão total da proteção divina ao longo do percurso.
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  choice: e entre todos os povos por cujo meio passamos
  rationale: Preserva a ideia espacial de passar no meio dos povos, sem reduzir a expressão a simples passagem por territórios.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto contém o nome próprio divino. 'Yahweh' o representa explicitamente sem substituí-lo por um título.
- issue: Sentido de עֲבָדִים na fórmula do êxodo
  choice: escravos
  alternative: escravidão; servos
  rationale: O hebraico emprega um substantivo plural concreto. A tradução mantém a condição social de escravos e não suaviza nem abstrai a formulação.
- issue: Identificação dos atos como sinais
  choice: grandes sinais
  alternative: grandes milagres; grandes maravilhas
  rationale: A escolha mantém a categoria teológica e narrativa de 'sinal', deixando que o contexto revele seu caráter milagroso.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases alivia a longa coordenação hebraica sem romper a unidade do argumento; 'Foi ele quem' retoma e preserva a ênfase de הוּא. O marcador [a] aparece imediatamente após a expressão a que se refere.
