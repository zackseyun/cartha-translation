base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: pt
  text: 'Então Josué disse ao povo[a]: “Vocês são testemunhas contra si mesmos de que escolheram para si Yahweh, para servi-lo.” E eles disseram: “Somos testemunhas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vocês são testemunhas para si mesmos”, isto é, as próprias palavras de vocês dão testemunho da escolha que fizeram.'
    reason: Alternativa lexical para עֵדִים אַתֶּם בָּכֶם, cuja preposição pode ser entendida de mais de uma maneira.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência em português.
- source_word: הָעָם
  choice: o povo
  rationale: No contexto, עָם designa o povo reunido; “o povo” é a formulação corrente e direta.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: Vocês são testemunhas contra si mesmos
  rationale: A preposição ב nessa construção permite entender que o testemunho recai sobre os próprios falantes. A formulação preserva a força jurídica e pactual, sem ocultar a alternativa lexical indicada em nota.
- source_word: כִּי
  choice: de que
  rationale: Introduz o conteúdo do testemunho e se liga de modo idiomático a “testemunhas” em português.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: escolheram para si
  rationale: 'Preserva a ênfase reflexiva de לָכֶם: a decisão foi tomada por eles próprios.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לַעֲבֹד אֹתוֹ
  choice: para servi-lo
  rationale: “Servir” preserva a amplitude de עבד neste contexto de aliança, incluindo lealdade e culto.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: 'E eles disseram: “Somos testemunhas”'
  rationale: A resposta hebraica é elíptica; “Somos” explicita em português o elemento verbal subentendido.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Força de בָּכֶם na declaração sobre testemunhas
  choice: contra si mesmos
  alternative: para si mesmos; entre vocês
  rationale: No cenário de compromisso pactual, as próprias palavras do povo podem servir como testemunho contra eles. A ambiguidade real da preposição é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A construção jurídica “testemunhas contra si mesmos” conserva o peso do compromisso assumido publicamente.
