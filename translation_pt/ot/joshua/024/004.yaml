base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: pt
  text: Dei a Isaque Jacó e Esaú. Dei a Esaú a região montanhosa de Seir[a] para que tomasse posse dela; mas[b] Jacó e seus filhos desceram para o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o monte Seir” ou “as montanhas de Seir”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e Jacó e seus filhos desceram para o Egito”. A conjunção hebraica é literalmente “e”; no texto principal, “mas” explicita o contraste do contexto.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Dei
  rationale: O verbo נתן denota aqui dar ou conceder tanto descendentes quanto território. A repetição de “Dei” preserva a ação divina reiterada no hebraico.
- source_word: לְיִצְחָק
  choice: a Isaque
  rationale: O prefixo לְ marca o beneficiário; “Isaque” segue a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: Jacó e Esaú
  rationale: Os marcadores de objeto direto não são traduzidos; os nomes seguem suas formas portuguesas tradicionais.
- source_word: הַר שֵׂעִיר
  choice: a região montanhosa de Seir
  rationale: הַר pode indicar um monte, montanhas ou uma região montanhosa. Neste contexto territorial, a expressão refere-se melhor à região de Seir do que necessariamente a um único pico.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: para que tomasse posse dela
  rationale: ירש expressa tomar posse, possuir ou herdar. A formulação portuguesa é natural e conserva o território como objeto explícito.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: mas Jacó e seus filhos
  rationale: Embora וְ seja literalmente “e”, o contexto contrapõe a posse territorial de Esaú à descida de Jacó e sua família ao Egito; “mas” torna essa relação discursiva clara.
- source_word: יָרְדוּ מִצְרָיִם
  choice: desceram para o Egito
  rationale: A tradução conserva o verbo direcional ירד e a expressão narrativa bíblica de descer ao Egito, em português corrente.
theological_decisions:
- issue: Valor da conjunção antes de Jacó
  choice: mas
  alternative: e
  rationale: 'O hebraico usa a conjunção ampla וְ, que pode ser simplesmente coordenativa. O contexto, porém, justapõe destinos diferentes: Esaú recebe Seir, enquanto Jacó e seus filhos descem ao Egito. O texto principal explicita esse contraste, e a nota preserva a possibilidade formal de “e”.'
translation_notes:
  register: Português moderno, digno e acessível, com formas bíblicas tradicionais dos nomes próprios. “Região montanhosa” comunica o sentido territorial sem eliminar as alternativas geográficas, registradas em nota. A segunda nota foi posicionada ao fim da oração cuja conjunção ela explica.
