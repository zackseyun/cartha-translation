  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: pt
  text: 'E Josué disse a todo o povo: “Assim diz Yahweh, o Deus de Israel: Antigamente, seus pais[b] viviam além do Rio[a] — Terá, pai de Abraão e pai de Naor — e serviam a outros deuses.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do outro lado do Rio”; provavelmente uma referência ao Eufrates.
    reason: Nota geográfica e alternativa de tradução para בְּעֵבֶר הַנָּהָר.
  - marker: b
    text: 'Hebraico: “pais”; isto é, antepassados ou ancestrais.'
    reason: Esclarece o sentido ancestral de אֲבוֹתֵיכֶם sem neutralizar a forma no texto principal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Preserva o fluxo narrativo do wayyiqtol hebraico de modo natural em português.
- source_word: אֶל כָּל הָעָם
  choice: a todo o povo
  rationale: Refere-se à comunidade da aliança reunida e é a formulação corrente em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula solene de mensageiro ou profeta sem tornar a frase excessivamente arcaica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz com clareza a relação de construto e a identificação pactual.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: além do Rio
  rationale: Conserva a expressão geográfica hebraica e não insere no texto principal o nome Eufrates, que está implícito.
- source_word: יָשְׁבוּ
  choice: viviam
  rationale: Expressa naturalmente a ideia de residir ou habitar nesse contexto histórico.
- source_word: אֲבוֹתֵיכֶם
  choice: seus pais
  rationale: Preserva a forma masculina explícita do hebraico; a nota esclarece o sentido ancestral.
- source_word: מֵעוֹלָם
  choice: desde os tempos antigos
  rationale: Aqui indica antiguidade remota, não eternidade metafísica.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: Terá, pai de Abraão e pai de Naor
  rationale: Mantém a repetição de “pai” presente na estrutura hebraica.
- source_word: וַיַּעַבְדוּ
  choice: Eles serviam
  rationale: “Servir” preserva a correspondência lexical e, tendo deuses como objeto, comunica a dimensão religiosa sem restringi-la a um ato específico de culto.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração conserva o nome pactual sem substituí-lo por um título.
- issue: Designação ancestral אֲבוֹתֵיכֶם
  choice: seus pais
  alternative: seus antepassados
  rationale: A tradução principal conserva o substantivo masculino plural do hebraico, enquanto a nota explicita que o referente são os antepassados.
- issue: Natureza do serviço prestado aos outros deuses
  choice: serviam a outros deuses
  alternative: adoravam outros deuses
  rationale: O verbo עבד em contexto cultual inclui adoração, mas “serviam” mantém sua amplitude e não elimina a nuance de sujeição religiosa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para fluência, sem eliminar a estrutura histórica nem a repetição enfática do hebraico.
