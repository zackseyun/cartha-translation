  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: pt
  text: Então tomei Abraão, pai de vocês, de além do Rio[a], e o conduzi por toda a terra de Canaã. Tornei numerosa a sua descendência[b] e lhe dei Isaque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Rio” provavelmente se refere ao Eufrates.
    reason: cultural_note
  - marker: b
    text: Ou “os seus descendentes”; o termo hebraico traduzido como “descendência” está no singular e tem sentido coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Então tomei
  rationale: O qal consecutivo de לקח narra a ação passada de Deus em sequência. “Então” expressa naturalmente essa progressão narrativa em português.
- source_word: אֲבִיכֶם אֶת־אַבְרָהָם
  choice: Abraão, pai de vocês
  rationale: Mantém a designação ancestral e pactual literalmente como “pai”, sem substituí-la pelo termo mais genérico e interpretativo “antepassado”.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: de além do Rio
  rationale: עֵבֶר com מן indica o lado de lá em relação ao ponto de referência. “O Rio” preserva a expressão definida do hebraico, enquanto a nota informa sua provável identificação.
- source_word: וָאוֹלֵךְ אוֹתוֹ
  choice: e o conduzi
  rationale: O hifil de הלך tem sentido causativo. “Conduzi” comunica com naturalidade que Deus fez Abraão percorrer o caminho.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: por toda a terra de Canaã
  rationale: A preposição ב, no contexto de deslocamento, é bem expressa por “por”, indicando percurso através da terra.
- source_word: וָאַרְבֶּה אֶת־זַרְעוֹ
  choice: Tornei numerosa a sua descendência
  rationale: O hifil de רבה significa fazer aumentar ou tornar numeroso. Esta formulação evita a possível estranheza de “multipliquei sua descendência” e conserva o sentido causativo.
- source_word: זַרְעוֹ
  choice: sua descendência
  rationale: זֶרַע é um singular coletivo que pode significar semente, prole ou descendentes. “Descendência” preserva esse caráter coletivo em português atual.
- source_word: וָאֶתֶּן לוֹ אֶת־יִצְחָק
  choice: e lhe dei Isaque
  rationale: Reproduz de modo claro e conciso a construção com objeto indireto e direto, apresentando Isaque como dado por Deus a Abraão.
theological_decisions:
- issue: Designação ancestral de Abraão
  choice: Abraão, pai de vocês
  alternative: Abraão, antepassado de vocês
  rationale: O hebraico emprega explicitamente “pai”. Manter esse termo preserva a retórica familiar e pactual dirigida a Israel, sem convertê-la numa explicação genérica.
- issue: Identificação do Rio
  choice: o Rio
  alternative: o rio Eufrates
  rationale: O texto-fonte usa o substantivo definido, não o nome próprio. A tradução mantém essa forma e deixa a provável identificação geográfica para a nota.
- issue: Sentido coletivo de זֶרַע
  choice: descendência
  alternative: descendentes
  rationale: “Descendência” mantém o singular coletivo e evita decidir se a ênfase recai sobre a linhagem como unidade ou sobre seus muitos integrantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pai de vocês” conserva o idioma ancestral sem soar arcaico; “de além do Rio” mantém a formulação geográfica do original; e “torn​​​​ei numerosa” comunica naturalmente o valor causativo do verbo hebraico.
