  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: pt
  text: 'conforme Moisés, servo de Yahweh, havia ordenado aos filhos de Israel, como está escrito no Livro da Lei de Moisés: um altar de pedras inteiras[a], sobre as quais nenhum ferro tinha sido manejado. Sobre ele, ofereceram ofertas queimadas a Yahweh e sacrificaram ofertas de paz[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedras não talhadas”. O hebraico diz literalmente “pedras inteiras”, destacando que elas foram deixadas intactas e não trabalhadas com ferro.
    reason: lexical_alternative
  - marker: b
    text: Ou “ofertas de comunhão” ou “ofertas de bem-estar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Expressa que a construção do altar seguiu o mandamento anterior, com naturalidade em português.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto deixa claro que a ordem de Moisés antecedeu a ação narrativa.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: “Servo” é o título honorífico natural para Moisés; “Yahweh” preserva o nome divino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Mantém a expressão familiar e corporativa explicitamente masculina do hebraico.
- source_word: כַּכָּתוּב בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: como está escrito no Livro da Lei de Moisés
  rationale: Reproduz de modo reconhecível a fórmula de autoridade escrita e preserva “livro” e “lei”.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: um altar de pedras inteiras
  rationale: “Inteiras” representa de perto a ideia de pedras intactas; a interpretação “não talhadas” é registrada em nota.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: sobre as quais não se havia manejado instrumento de ferro
  rationale: Comunica o idioma de levantar ou manejar ferro contra as pedras sem sugerir que qualquer contato casual com ferro estivesse em vista.
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: Sobre ele, ofereceram ofertas queimadas
  rationale: Mantém o altar como local da oferta e traduz de modo transparente o tipo sacrificial consumido pelo fogo.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: e sacrificaram ofertas de paz
  rationale: “Ofertas de paz” é uma designação bíblica reconhecível; a amplitude semântica de comunhão e bem-estar fica preservada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome da aliança sem substituí-lo por um título.
- issue: Expressão corporativa בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A escolha conserva a metáfora familiar e a forma masculina coletiva do original, sem negar que o grupo nacional seja mais amplo.
- issue: Sentido sacrificial de שְׁלָמִים
  choice: ofertas de paz
  alternative: ofertas de comunhão; ofertas de bem-estar
  rationale: A expressão tradicional permanece clara, enquanto a nota reconhece que o termo envolve comunhão e bem-estar, não apenas ausência de conflito.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A abertura subordinada preserva a continuidade sintática do versículo com o anterior. Os marcadores foram colocados junto às expressões a que suas notas se referem.
