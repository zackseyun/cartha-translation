translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. A repetição de “cidade” foi mantida para refletir a estrutura espacial do hebraico, e “a parte de trás dele” preserva a imprecisão do termo עֲקֵב sem impor uma identificação militar específica.
