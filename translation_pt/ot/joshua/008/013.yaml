base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: pt
  text: Assim, o povo posicionou todo o acampamento que ficava ao norte da cidade, com sua retaguarda[a] a oeste da cidade[b], e Josué foi, naquela noite, para o meio do vale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com sua guarda de retaguarda”.'
    reason: alternative_reading
  - marker: b
    text: Em hebraico, literalmente, “do lado do mar da cidade”; aqui, “mar” é usado como indicação de direção e significa “oeste”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: posicionou
  rationale: O verbo שׂים tem o sentido amplo de pôr ou colocar; neste contexto militar, “posicionou” comunica uma disposição tática deliberada sem acrescentar detalhes ao texto.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o termo hebraico geral, embora neste contexto ele se refira às forças de Israel.
- source_word: כָּל הַמַּחֲנֶה
  choice: todo o acampamento
  rationale: Reproduz de modo natural a combinação de כָּל com מַחֲנֶה, que pode designar o acampamento e, por extensão, o contingente nele reunido.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: que ficava ao norte da cidade
  rationale: Expressa claramente a localização indicada pela oração relativa hebraica.
- source_word: עֲקֵבוֹ
  choice: a parte de trás dele
  rationale: עָקֵב significa literalmente “calcanhar” e, por extensão, a parte posterior. A formulação evita especificar “retaguarda” ou “guarda de retaguarda” no texto principal.
- source_word: מִיָּם לָעִיר
  choice: a oeste da cidade
  rationale: יָם, literalmente “mar”, funciona com frequência como termo direcional para “oeste” no hebraico bíblico.
- source_word: וַיֵּלֶךְ
  choice: foi
  rationale: Equivalente simples e contextualmente adequado para o verbo comum הלך.
- source_word: בַּלַּיְלָה הַהוּא
  choice: naquela noite
  rationale: Forma idiomática em português para a expressão temporal hebraica.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: para o meio do vale
  rationale: 'Com o verbo de movimento, a preposição é entendida direcionalmente: Josué foi para o interior ou meio do vale.'
