  text: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ כִּֽי לָכַ֤ד הָֽ/אֹרֵב֙ אֶת הָ/עִ֔יר וְ/כִ֥י עָלָ֖ה עֲשַׁ֣ן הָ/עִ֑יר וַ/יָּשֻׁ֕בוּ וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: pt
  text: Quando Josué e todo o Israel viram que a tropa que estava de emboscada[a] havia tomado a cidade e que a fumaça da cidade havia subido, voltaram e golpearam os homens de Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a emboscada”. O particípio hebraico pode designar coletivamente a força posicionada para a emboscada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: viram
  rationale: Mantém o sentido concreto de ver e perceber; as orações seguintes apresentam aquilo que Josué e Israel observaram.
- source_word: כִּי ... וְכִי
  choice: que... e que
  rationale: As conjunções introduzem aqui o conteúdo do que foi visto, estrutura preservada com naturalidade em português.
- source_word: לָכַד
  choice: havia tomado
  rationale: O verbo indica capturar ou apoderar-se; o mais-que-perfeito composto expressa uma ação já concluída quando foi percebida.
- source_word: הָאֹרֵב
  choice: a tropa de emboscada
  rationale: O particípio substantivado designa coletivamente a força que estava de emboscada. A formulação explicita o referente sem acrescentar uma identificação não presente no hebraico.
- source_word: הָעִיר
  choice: a cidade
  rationale: Tradução direta do substantivo definido, repetida conforme o texto hebraico.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: a fumaça da cidade havia subido
  rationale: Preserva a imagem hebraica do movimento ascendente da fumaça e situa o sinal como já visível naquele momento.
- source_word: וַיָּשֻׁבוּ
  choice: voltaram-se
  rationale: No contexto da batalha, indica uma mudança de direção para enfrentar novamente o inimigo.
- source_word: וַיַּכּוּ
  choice: atacaram
  rationale: נכה descreve golpear ou ferir e, em contexto militar, atacar com força. 'Atacaram' comunica a ação bélica sem especificar além do verso que todos foram mortos.
- source_word: אַנְשֵׁי הָעָי
  choice: os homens de Ai
  rationale: Reproduz o sentido masculino explícito de אַנְשֵׁי sem restringi-lo indevidamente a 'guerreiros'.
