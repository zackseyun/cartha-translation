source:
  edition: WLC
  text: וְ/אַתֶּ֗ם תָּקֻ֨מוּ֙ מֵ/הָ֣/אוֹרֵ֔ב וְ/הוֹרַשְׁתֶּ֖ם אֶת הָ/עִ֑יר וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: pt
  text: Então vocês se levantarão da emboscada e tomarão posse da cidade[a], pois Yahweh, o Deus de vocês, a entregará nas mãos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “capturarão a cidade”. O verbo hebraico pode indicar tomar posse, e não apenas o ato militar de capturar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: vocês se levantarão
  rationale: O imperfeito qal de קום funciona como instrução na sequência militar. A forma futura preserva o encadeamento do hebraico e expressa o movimento de sair do esconderijo.
- source_word: מֵהָאוֹרֵב
  choice: da emboscada
  rationale: אֹרֵב designa a emboscada ou o lugar de onde os soldados ficam à espreita; a formulação é concisa e natural em português.
- source_word: וְהוֹרַשְׁתֶּם
  choice: tomarão posse de
  rationale: O hifil de ירשׁ pode indicar tomar posse, ocupar ou capturar. Em contexto de conquista, esta opção preserva sua dimensão possessória sem excluir a tomada militar.
- source_word: הָעִיר
  choice: a cidade
  rationale: Tradução direta do substantivo definido עִיר.
- source_word: וּנְתָנָהּ
  choice: a entregará
  rationale: O perfeito com conjunção, depois da sequência instrutiva, expressa o resultado futuro assegurado. 'Entregará' comunica que a cidade será posta sob o poder deles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Representa diretamente a forma construta com sufixo de segunda pessoa masculina plural, em linguagem amplamente compreensível.
- source_word: בְּיֶדְכֶם
  choice: nas mãos de vocês
  rationale: Preserva a metáfora hebraica de entregar algo à mão de alguém, isto é, ao seu poder ou controle, em uma expressão idiomática natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto apresenta diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Amplitude semântica de וְהוֹרַשְׁתֶּם
  choice: tomarão posse da cidade
  alternative: capturarão a cidade
  rationale: A escolha mantém a dimensão de posse própria de ירשׁ, ao mesmo tempo que o contexto militar torna implícita a captura; a nota registra a alternativa mais estritamente militar.
translation_notes:
  register: Português moderno, digno e acessível, com uso de “vocês” para a segunda pessoa plural e preservação moderada do paralelismo e das imagens do hebraico.
