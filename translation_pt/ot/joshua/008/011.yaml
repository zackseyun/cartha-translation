translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. «Povo de guerra» retém o caráter coletivo e militar da expressão hebraica, embora seja deliberadamente mais formal que «combatentes». A alternância entre verbos no singular e no plural reflete o sujeito coletivo de maneira aceitável em português e evita tornar toda a sequência artificial.
