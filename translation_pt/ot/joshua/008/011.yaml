base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: pt
  text: E todo o povo de guerra que estava com ele subiu, aproximou-se, chegou diante da cidade e acampou ao norte de Ai, com o vale entre ele[a] e Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “entre ele e Ai”. O pronome no singular provavelmente se refere a Josué, embora alguns entendam o sentido coletivo como “entre eles e Ai”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: todo o povo de guerra
  rationale: Preserva o sentido coletivo de עָם e a função militar expressa pela construção, sem acrescentar uma especificação masculina ausente do hebraico.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estava com ele
  rationale: Identifica de modo natural as tropas que acompanhavam Josué; o singular concorda com o coletivo «povo».
- source_word: עָלוּ
  choice: subiu
  rationale: Mantém o sentido direcional comum de עלה; o singular é natural em português com o sujeito coletivo «todo o povo».
- source_word: וַיִּגְּשׁוּ
  choice: se aproximou
  rationale: Expressa claramente a ideia de chegar mais perto e acompanha em número o sujeito coletivo.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: chegaram diante da cidade
  rationale: נֶגֶד indica uma posição diante de ou defronte à cidade, não a entrada nela. O plural retoma semanticamente os integrantes do povo, como permite a construção coletiva.
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: É a forma corrente e precisa para o estabelecimento de um acampamento.
- source_word: מִצְּפוֹן לָעַי
  choice: ao norte de Ai
  rationale: Expressa de forma direta e idiomática a localização relativa à cidade.
- source_word: הַגַּי
  choice: o vale
  rationale: Tradução ampla e acessível de גַּי, sem impor a topografia mais específica de «ravina».
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: entre ele e Ai
  rationale: Conserva o sufixo masculino singular do texto consonantal, provavelmente referente a Josué, em vez de harmonizá-lo silenciosamente com o grupo.
