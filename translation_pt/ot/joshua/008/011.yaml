  naturalness: «Todo o povo de guerra» é uma formulação formal, mas compreensível e apropriada ao registro bíblico. A sequência «subiu e se aproximou; chegaram ... e acamparam» é pouco natural, pois alterna sem motivação gramatical entre o coletivo singular e seus membros no plural. Uma sequência inteiramente no singular torna a frase fluente sem alterar o sentido coletivo.
  terminology: «Povo de guerra» conserva bem o caráter coletivo de כָּל־הָעָם הַמִּלְחָמָה e evita introduzir uma especificação masculina. «Vale» é uma opção segura para הַגַּי. A nota deve continuar explicitando que o singular em «entre ele e Ai» é difícil e provavelmente se refere a Josué, sem eliminar a leitura coletiva alternativa.
