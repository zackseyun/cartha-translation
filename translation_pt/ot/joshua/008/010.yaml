  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: pt
  text: Josué levantou-se cedo pela manhã, passou o povo em revista[a], e ele e os anciãos de Israel subiram à frente do povo a Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contou o povo” ou “inspecionou o povo”. O verbo hebraico pode indicar contar, inspecionar, designar ou reunir; o contexto militar favorece a ideia de passar as tropas em revista.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: levantou-se de madrugada
  rationale: A construção expressa levantar-se cedo pela manhã. “De madrugada” comunica de modo natural em português a ênfase temporal do hebraico, sem redundância.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: passou o povo em revista
  rationale: פקד possui amplo campo semântico, incluindo contar, inspecionar e reunir. No contexto militar, “passou o povo em revista” preserva a ideia de inspeção ou mobilização sem reduzi-la a uma simples contagem.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o termo abrangente do hebraico. Embora o contexto seja militar, “tropas” ou “exército” estreitaria o sentido.
- source_word: וַיַּעַל
  choice: subiram
  rationale: עלה significa ordinariamente “subir”. O plural em português concorda naturalmente com Josué e os anciãos, os participantes explicitamente coordenados no hebraico.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: ele e os anciãos de Israel
  rationale: Conserva o pronome enfático referente a Josué e apresenta ambos como sujeito do movimento, conforme a sintaxe hebraica.
- source_word: לִפְנֵי הָעָם
  choice: à frente do povo
  rationale: Expressa naturalmente a posição indicada por לפני e permite a implicação de liderança sem acrescentar uma interpretação indevida.
- source_word: הָעָי
  choice: Ai
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português; o artigo hebraico não precisa ser reproduzido diante do nome próprio.
