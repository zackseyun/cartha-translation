  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: pt
  text: Todo o Israel, com seus anciãos, oficiais e juízes, estava de pé de um lado e do outro da arca, diante dos sacerdotes levitas que carregavam a arca da aliança de Yahweh; ali estavam tanto o estrangeiro residente como o natural da terra[a]. Metade do povo estava diante do monte Gerizim, e a outra metade diante do monte Ebal, conforme Moisés, servo de Yahweh, havia ordenado, para abençoar inicialmente[b] o povo de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o estrangeiro que vivia entre os israelitas e a pessoa nascida no próprio país.
    reason: Esclarece as categorias sociais expressas por גֵּר e אֶזְרָח.
  - marker: b
    text: 'Hebraico: “no princípio” ou “primeiramente”. A expressão pode indicar que a bênção seria o primeiro ato ou remeter à ordem dada anteriormente por Moisés.'
    reason: Preserva a ambiguidade sintática e temporal de בָּרִאשֹׁנָה.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Todo o Israel
  rationale: Preserva o sentido corporativo da totalidade da assembleia nacional, em formulação bíblica natural em português.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: com seus anciãos, oficiais e juízes
  rationale: O possessivo remete coletivamente a Israel; “oficiais” expressa a função administrativa de שֹׁטְרִים sem sugerir necessariamente atividade policial ou militar.
- source_word: עֹמְדִים מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: estava de pé de um lado e do outro da arca
  rationale: Mantém a imagem espacial e a repetição distributiva do hebraico; o singular concorda com o sujeito coletivo “Todo o Israel”.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: os sacerdotes levitas
  rationale: Expressa naturalmente em português a construção que identifica os sacerdotes como levitas, sem ampliar seu sentido.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: que carregavam a arca da aliança de Yahweh
  rationale: Reproduz o valor descritivo do particípio e preserva o nome divino.
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: tanto o estrangeiro residente como o natural da terra
  rationale: Torna clara a inclusão equivalente do residente não nativo e do israelita nativo, preservando as categorias sociais do texto.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: Metade do povo ... e a outra metade
  rationale: Explicita o referente coletivo do sufixo e apresenta com clareza a divisão da assembleia em dois grupos.
- source_word: אֶל מוּל
  choice: estava voltada para
  rationale: Comunica a orientação espacial dos dois grupos em relação aos montes, sem pressupor distância específica.
- source_word: בָּרִאשֹׁנָה
  choice: de início
  rationale: Conserva a relação com o começo ou a prioridade do ato, sem decidir de modo rígido entre “como primeiro ato” e uma referência anterior.
theological_decisions:
- issue: Forma portuguesa do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome próprio divino; a transliteração “Yahweh” o preserva em vez de substituí-lo por um título.
- issue: Inclusão de גֵּר e אֶזְרָח na assembleia
  choice: tanto o estrangeiro residente como o natural da terra
  alternative: tanto o peregrino como o cidadão
  rationale: A opção representa as duas categorias sociais presentes na cerimônia da aliança sem lhes impor categorias políticas ou teológicas posteriores.
- issue: Relação de בָּרִאשֹׁנָה com a ordem de abençoar
  choice: para que de início abençoassem
  alternative: conforme havia ordenado anteriormente, para abençoar
  rationale: A posição final do advérbio admite associação ao ato inicial de abençoar, mas a nota mantém aberta a possibilidade de referência à ordem anterior de Moisés.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Emprega “arca da aliança”, “anciãos” e “sacerdotes levitas” por serem termos bíblicos correntes, evitando construções excessivamente arcaicas.
