revisions:
- from: Todo o Israel, com seus anciãos, oficiais e juízes, estava de pé de um lado e do outro da arca, diante dos sacerdotes levitas que carregavam a arca da aliança de Yahweh. Estavam ali tanto o estrangeiro residente como o natural da terra[a]. Metade do povo estava voltada para o monte Gerizim, e a outra metade, para o monte Ebal, conforme Moisés, servo de Yahweh, havia ordenado, para que de início[b] abençoassem o povo de Israel.
  to: Todo o Israel, com seus anciãos, oficiais e juízes, estava de pé de um lado e do outro da arca, diante dos sacerdotes levitas que carregavam a arca da aliança de Yahweh; ali estavam tanto o estrangeiro residente como o natural da terra[a]. Metade do povo estava diante do monte Gerizim, e a outra metade diante do monte Ebal, conforme Moisés, servo de Yahweh, havia ordenado, para abençoar inicialmente[b] o povo de Israel.
