  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: pt
  text: Mas capturaram vivo o rei de Ai e o levaram até Josué.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E capturaram vivo o rei de Ai e o levaram até Josué.”'
