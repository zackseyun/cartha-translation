lexical_decisions:
- source_word: וְ/אֶת
  choice: Mas
  rationale: A conjunção introduz a captura do rei em contraste moderado com a matança narrada no contexto; “Mas” expressa naturalmente essa relação discursiva. “E” continua sendo possível.
- source_word: מֶלֶךְ הָעַי
  choice: o rei de Ai
  rationale: A cadeia construta designa o rei da cidade de Ai; a forma é natural e clara em português.
- source_word: תָּפְשׂוּ
  choice: capturaram
  rationale: No contexto militar, o verbo indica que se apoderaram dele e o fizeram prisioneiro.
- source_word: חָי
  choice: vivo
  rationale: O adjetivo predicativo esclarece que o rei foi capturado sem ser morto.
- source_word: וַיַּקְרִבוּ
  choice: levaram até
  rationale: O hifil de קרב indica fazer chegar ou aproximar; “levaram até” preserva o movimento em direção a Josué sem soar artificial.
- source_word: אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: o ... até Josué
  rationale: O pronome retoma o rei, e a preposição marca Josué como destino do movimento.
