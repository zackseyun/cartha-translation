base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: pt
  text: Você fará com Ai e com seu rei o mesmo que fez com Jericó e com seu rei. Somente os despojos e os animais dela vocês poderão tomar para si[a]. Monte uma emboscada contra a cidade, por trás dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês tomarão para si”. A forma hebraica pode ser entendida como futuro ou como instrução autorizadora; o texto principal ressalta o contraste com Jericó, onde tomar despojos havia sido proibido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Posicione homens em emboscada contra a cidade, por trás dela”. A forma hebraica no singular pode designar a emboscada como unidade ou, coletivamente, a tropa que fica de emboscada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Você fará
  rationale: O perfeito qal na 2ª pessoa masculina singular, com conjunção e em contexto diretivo, comunica uma instrução a Josué. O futuro do indicativo é natural em português para uma ordem solene.
- source_word: לָעַי
  choice: com Ai
  rationale: O topônimo é transliterado segundo a forma portuguesa consagrada. Com o verbo 'fazer' e a comparação subsequente, 'fazer com Ai' expressa naturalmente a relação marcada pela preposição.
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: o mesmo que fez
  rationale: Reproduz com clareza a comparação com o tratamento dado a Jericó, em português natural e digno.
- source_word: רַק
  choice: Somente
  rationale: 'Marca a exceção ao paralelo com Jericó: desta vez, os bens e os animais podem ser tomados.'
- source_word: שְׁלָלָהּ
  choice: os despojos
  rationale: Designa bens capturados na guerra. 'Despojos' é corrente no registro bíblico português e permanece compreensível.
- source_word: וּבְהֶמְתָּהּ
  choice: e os animais da cidade
  rationale: בהמה se refere aqui aos animais domésticos possuídos pela cidade. A expansão evita a expressão pouco natural 'seus animais' com cidade como antecedente.
- source_word: תָּבֹזּוּ לָכֶם
  choice: vocês poderão saquear para si
  rationale: A forma plural dirige-se às tropas de Josué. 'Poderão' comunica autorização, em contraste com a proibição relativa a Jericó, enquanto 'para si' preserva לָכֶם.
- source_word: שִׂים לְךָ
  choice: Prepare
  rationale: O imperativo singular é dirigido a Josué. 'Prepare' soa natural com 'emboscada'; a relação de interesse expressa por לְךָ fica implícita no comando ao líder.
- source_word: אֹרֵב
  choice: uma emboscada
  rationale: O particípio substantivado pode designar a emboscada ou coletivamente a força emboscada. A tradução principal conserva a formulação concisa.
- source_word: לָעִיר מֵאַחֲרֶיהָ
  choice: contra a cidade, por trás dela
  rationale: Explicita o alvo hostil e preserva a posição espacial indicada pelo hebraico.
theological_decisions:
- issue: Força modal de תָּבֹזּוּ
  choice: vocês poderão saquear
  alternative: vocês saquearão
  rationale: No contexto, a fala autoriza Israel a ficar com os despojos, em contraste com Jericó. A nota conserva a possibilidade de leitura como futuro ou instrução direta.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém tom digno e diretivo, distingue o singular dirigido a Josué do plural dirigido às tropas e conserva em notas as ambiguidades verbal e coletiva do hebraico.
