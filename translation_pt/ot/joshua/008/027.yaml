base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: pt
  text: Israel tomou para si somente os animais de criação e os despojos daquela cidade, conforme a ordem que Yahweh havia dado a Josué.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Mas ... somente
  rationale: Marca a exceção em relação à destruição narrada anteriormente; a combinação preserva tanto o contraste contextual quanto a restrição.
- source_word: הַבְּהֵמָה
  choice: os animais
  rationale: No contexto, refere-se aos animais domésticos tomados na guerra; “animais” é claro e natural, sem limitar indevidamente a uma espécie.
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: e os despojos daquela cidade
  rationale: שָׁלָל designa bens capturados em guerra; “despojos” conserva o sentido militar, e “daquela cidade” reproduz a especificidade do demonstrativo.
- source_word: בָּזְזוּ לָהֶם
  choice: tomou para si
  rationale: Expressa a apropriação dos bens por Israel e o valor de proveito ou posse indicado por לָהֶם, evitando a redundância de “saqueou os despojos”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o nome coletivo da nação como sujeito singular, de acordo com o hebraico.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: conforme Yahweh havia ordenado a Josué
  rationale: Transmite de modo natural a conformidade com a palavra ou ordem divina e situa a ordem antes da ação narrada, sem acrescentar conteúdo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o translitera em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem foi ajustada para maior naturalidade, mantendo a restrição de רַק e o contraste com a destruição precedente.
