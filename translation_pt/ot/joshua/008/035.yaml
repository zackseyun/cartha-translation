  naturalness: A formulação é em geral clara e moderna. “Que Josué deixasse de ler” torna a dupla negação mais idiomática e inequívoca em português do que “que Josué não lesse”, sem perder a ênfase de totalidade.
  terminology: “Assembleia”, “crianças pequenas” e “estrangeiro residente” são adequados ao registro e ao sentido. A nota sobre o estrangeiro residente e a nota do particípio hebraico estão corretamente ancoradas e são úteis.
