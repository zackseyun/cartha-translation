revisions:
- from: Não houve uma só palavra de tudo o que Moisés havia ordenado que Josué não lesse diante de toda a assembleia de Israel, incluindo as mulheres, as crianças pequenas e o estrangeiro residente[a] que vivia entre eles.[b]
  to: Não houve uma só palavra de tudo o que Moisés havia ordenado que Josué deixasse de ler diante de toda a assembleia de Israel, das mulheres, das crianças pequenas e do estrangeiro residente[a] que vivia entre eles.[b]
  rationale: A revisão substitui a expressão interpretativa “incluindo” por uma enumeração coordenada, mais próxima da sintaxe hebraica e menos restritiva quanto à relação entre os grupos. Também ajusta a construção negativa para uma formulação portuguesa fluente que conserva a afirmação de que Josué não omitiu nada do que Moisés ordenara.
  reviewer_model: gpt-5.6-terra
