  - severity: low
    issue: “Que Josué não lesse” pode soar menos natural e apresentar uma nuance aspectual menos direta no português contemporâneo.
    rationale: “Que Josué deixasse de ler” expressa com clareza que nenhuma palavra foi omitida, preservando a força exaustiva da construção hebraica.
