  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: pt
  text: Não houve uma só palavra de tudo o que Moisés havia ordenado que Josué deixasse de ler diante de toda a assembleia de Israel, das mulheres, das crianças pequenas e do estrangeiro residente[a] que vivia entre eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o não israelita que residia no meio do povo de Israel.
    reason: cultural_note
  - marker: b
    text: Literalmente, “que andava no meio deles”; aqui, a expressão indica alguém que vivia entre eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר
  choice: palavra
  rationale: No contexto da leitura pública dos mandamentos, “palavra” preserva a relação natural entre o conteúdo ordenado e aquilo que Josué leu.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: “Ordenar” expressa adequadamente a autoridade das instruções de Moisés; o mais-que-perfeito deixa clara a anterioridade da ordem em relação à leitura.
- source_word: קָרָא
  choice: lesse
  rationale: O contexto imediato é a leitura pública da Lei, por isso “ler” é mais preciso que “proclamar” ou “clamar”.
- source_word: נֶגֶד
  choice: diante de
  rationale: Expressa de modo natural que a leitura ocorreu na presença da assembleia reunida.
- source_word: קְהַל
  choice: assembleia
  rationale: Designa o conjunto formalmente reunido sem introduzir conotações eclesiásticas posteriores.
- source_word: הַנָּשִׁים
  choice: as mulheres
  rationale: Mantém a menção explícita às mulheres no texto hebraico.
- source_word: הַטַּף
  choice: as crianças pequenas
  rationale: טַף refere-se especialmente aos pequenos ou dependentes; “crianças pequenas” conserva essa especificidade.
- source_word: הַגֵּר
  choice: o estrangeiro residente
  rationale: Comunica com clareza moderna a categoria social de um não israelita estabelecido no meio do povo, sentido que “estrangeiro” sozinho poderia não transmitir.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: que vivia entre eles
  rationale: Embora literalmente relacionado a “andar”, o particípio é idiomático neste contexto e descreve a presença habitual ou residência no meio da comunidade.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: Não houve uma só palavra ... que ... não lesse
  rationale: Preserva a dupla negação e sua ênfase na totalidade, acrescentando “uma só” para produzir português natural e inequívoco.
theological_decisions:
- issue: Alcance público da instrução da aliança
  choice: Manter explicitamente mulheres, crianças pequenas e estrangeiros residentes entre os ouvintes da leitura.
  alternative: Subsumir esses grupos na expressão geral “toda a assembleia de Israel”.
  rationale: O hebraico enumera expressamente esses grupos, ressaltando o alcance comunitário da leitura; a tradução não deve apagar essa inclusão.
- issue: Relação entre a assembleia e os grupos enumerados
  choice: Usar “incluindo” para indicar que os grupos nomeados estavam presentes na assembleia ou no público reunido.
  alternative: 'Traduzir a coordenação de maneira estritamente formal: “e as mulheres, e as crianças pequenas, e o estrangeiro residente”.'
  rationale: Em português, a simples coordenação depois de “toda a assembleia de Israel” pode sugerir indevidamente grupos separados ou externos à assembleia. “Incluindo” torna explícita a função enumerativa sem alterar o alcance do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção de dupla negação foi mantida de forma natural, e “estrangeiro residente” evita tanto o arcaísmo de “forasteiro” quanto a possível imprecisão de “estrangeiro” isolado.
