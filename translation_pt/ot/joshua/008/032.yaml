  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: pt
  text: Ali, sobre as pedras, Josué escreveu uma cópia da lei de Moisés[a], que havia escrito diante dos filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma repetição da lei de Moisés” ou “uma duplicata da lei de Moisés”. O termo hebraico pode indicar uma cópia ou uma versão repetida.
    reason: lexical_alternative
  - marker: b
    text: Ou “na presença dos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: Josué escreveu
  rationale: O verbo narrativo significa simplesmente “escreveu”. O sujeito implícito é Josué, identificado pelo contexto; explicitá-lo produz clareza natural em português sem acrescentar uma nova personagem.
- source_word: שָׁם
  choice: ali
  rationale: O advérbio aponta para o local já mencionado. “Ali” é natural na narrativa e mantém essa referência contextual.
- source_word: עַל הָאֲבָנִים
  choice: sobre as pedras
  rationale: A preposição עַל indica a superfície em que se escreveu; “sobre as pedras” é uma formulação clara e digna em português.
- source_word: מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: uma cópia da lei de Moisés
  rationale: מִשְׁנֵה pode designar cópia, duplicata ou repetição. Neste contexto de escrita sobre pedras, “uma cópia” comunica melhor o sentido provável sem definir a extensão do conteúdo copiado.
- source_word: תּוֹרַת
  choice: lei
  rationale: Embora תּוֹרָה também possa significar “instrução”, a expressão convencional e contextualmente apropriada é “lei de Moisés”.
- source_word: אֲשֶׁר כָּתַב
  choice: que havia escrito
  rationale: O mais-que-perfeito composto expressa naturalmente uma escrita anterior à ação principal. A ausência de sujeito expresso na oração relativa preserva, tanto quanto possível em português, a concisão do hebraico.
- source_word: לִפְנֵי
  choice: diante de
  rationale: A expressão pode ter sentido espacial ou indicar presença pública. “Diante de” mantém ambos os matizes melhor do que uma explicitação interpretativa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: A tradução conserva de modo transparente a forma masculina plural do hebraico e a designação tradicional do povo.
theological_decisions:
- issue: Extensão de מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: uma cópia da lei de Moisés
  alternative: uma repetição da lei de Moisés; uma duplicata da lei de Moisés
  rationale: O versículo não informa se foi escrita toda a Torá ou uma seção legal. A tradução não impõe nenhuma dessas interpretações.
- issue: Referente do sujeito em אֲשֶׁר כָּתַב
  choice: manter o sujeito da oração relativa sem nome expresso
  alternative: “que Moisés havia escrito”; “que Josué havia escrito”
  rationale: O hebraico não nomeia expressamente o sujeito nessa oração. Evitar inserir “Moisés” ou repetir “Josué” preserva a ambiguidade sintática em vez de resolvê-la teologicamente ou historicamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem “Ali, sobre as pedras” acompanha a ênfase locativa do hebraico. “Filhos de Israel” preserva a forma do texto-fonte, e as notas registram alternativas lexicais genuínas sem ampliar o escopo da passagem.
