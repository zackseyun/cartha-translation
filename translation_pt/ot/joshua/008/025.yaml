  text: וַ/יְהִי֩ כָל הַ/נֹּ֨פְלִ֜ים בַּ/יּ֤וֹם הַ/הוּא֙ מֵ/אִ֣ישׁ וְ/עַד אִשָּׁ֔ה שְׁנֵ֥ים עָשָׂ֖ר אָ֑לֶף כֹּ֖ל אַנְשֵׁ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: pt
  text: E todos os que caíram naquele dia, de homem a mulher, foram doze mil — toda a população de Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os habitantes de Ai”. Em hebraico, literalmente, “todos os homens de Ai”, expressão que aqui pode designar coletivamente a população da cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: foram
  rationale: O waw consecutivo com היה introduz a declaração resumidora; em português natural, o valor copulativo é expresso por “foram”, sem recorrer ao arcaizante “e aconteceu que”.
- source_word: כָל הַנֹּפְלִים
  choice: todos os que caíram
  rationale: O particípio de נפל designa os que caíram ou morreram. “Os que caíram” conserva a imagem hebraica e é claro no contexto de batalha.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal corrente e equivalente ao hebraico.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: de homem a mulher
  rationale: Mantém os substantivos singulares e a força abrangente da construção hebraica, em formulação portuguesa concisa.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: doze mil
  rationale: Correspondência direta do numeral cardinal hebraico.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: toda a população de Ai
  rationale: Embora אַנְשֵׁי signifique literalmente “homens de”, aqui a expressão resume corporativamente os mortos já definidos como homens e mulheres. “População” comunica esse referente sem criar a contradição aparente de dizer apenas “homens”.
theological_decisions:
- issue: Linguagem de gênero no resumo das vítimas
  choice: Manter “de homem a mulher” e traduzir a expressão final corporativamente como “toda a população de Ai”
  alternative: “todos os homens de Ai” ou “todos os habitantes de Ai”
  rationale: A primeira expressão preserva explicitamente os dois sexos. Na aposição final, “homens de Ai” pode funcionar como designação coletiva da população da cidade; a tradução principal explicita esse sentido contextual, enquanto a nota preserva a forma literal e a alternativa “habitantes”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo e a solenidade do resumo narrativo sem arcaísmos desnecessários.
