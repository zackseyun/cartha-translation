  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: pt
  text: E Josué não recolheu a mão que havia estendido com a lança, até que consagrou à destruição todos os habitantes de Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destruiu completamente todos os habitantes de Ai”. O verbo hebraico está ligado à ideia de colocar pessoas ou coisas sob interdição, isto é, de consagrá-las à destruição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: não recolheu
  rationale: O hifil de שׁוב significa fazer voltar ou trazer de volta. Com “a mão” como objeto neste contexto de batalha, “não recolheu” expressa naturalmente que Josué a manteve estendida.
- source_word: יָדוֹ
  choice: a mão
  rationale: Mantém a referência corporal literal; o possessivo é recuperável pelo sujeito e pela oração relativa.
- source_word: נָטָה
  choice: havia estendido
  rationale: O verbo significa estender. O mais-que-perfeito situa a ação antes do período em que Josué manteve a mão nessa posição.
- source_word: בַּכִּידוֹן
  choice: com a lança
  rationale: כידון designa uma arma semelhante a uma lança ou dardo. “Lança” é claro, natural e amplamente compreensível em português, sem impor uma especificidade incerta.
- source_word: הֶחֱרִים
  choice: consagrar à destruição
  rationale: 'Preserva o sentido técnico de חרם: colocar pessoas ou coisas sob interdição, destinando-as à destruição, em vez de reduzir o termo simplesmente a “destruir”.'
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: todos os habitantes de Ai
  rationale: Tradução direta e natural para os que habitavam a cidade.
- source_word: וִיהוֹשֻׁעַ
  choice: E Josué
  rationale: Mantém a conjunção narrativa e a forma portuguesa tradicional do nome.
theological_decisions:
- issue: Tradução de חרם no contexto de juízo em guerra
  choice: consagrar à destruição todos os habitantes de Ai
  alternative: destruir completamente todos os habitantes de Ai; colocar todos os habitantes de Ai sob interdição
  rationale: A formulação conserva a dimensão cultual e judicial do verbo hebraico sem explicar em excesso nem reduzir seu sentido à mera ação militar.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Recolheu a mão” preserva a imagem corporal hebraica; “lança” evita uma precisão excessiva entre lança e dardo. A nota explicita a alternativa lexical de חרם sem resolver no texto principal sua tensão teológica.
