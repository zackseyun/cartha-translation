base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: pt
  text: Então os homens da emboscada levantaram-se depressa do lugar onde estavam e correram assim que ele estendeu a mão[a]. Entraram na cidade, tomaram-na e rapidamente a incendiaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando ele estendeu a mão”. A construção hebraica assinala o momento do sinal de Josué e admite ambas as nuances temporais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: os homens da emboscada
  rationale: O particípio substantivado designa coletivamente a força que estava à espera. A formulação explicita as pessoas envolvidas e combina naturalmente, em português, com os verbos seguintes no plural.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: levantaram-se depressa do lugar onde estavam
  rationale: קום indica que a força entrou prontamente em ação, e מְהֵרָה marca rapidez. A expressão locativa naturaliza o sufixo singular ligado ao coletivo hebraico sem sugerir que todos ocupavam um único ponto exato.
- source_word: וַיָּר֨וּצוּ֙
  choice: e correram
  rationale: Preserva o sentido simples e concreto do verbo רוץ e o ritmo rápido da narrativa.
- source_word: כִּנְטוֹת יָדוֹ
  choice: assim que ele estendeu a mão
  rationale: A construção com כ e o infinitivo marca o momento do sinal e pode sugerir resposta imediata. O pronome permanece como no hebraico; o contexto identifica Josué.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: Entraram na cidade
  rationale: בוא com a cidade como destino é expresso de maneira idiomática e direta por 'entrar na cidade'.
- source_word: וַיִּלְכְּדוּהָ
  choice: tomaram-na
  rationale: לכד, em narrativa militar sobre uma cidade, significa tomá-la ou capturá-la. 'Tomaram-na' é corrente, conciso e preserva o referente pronominal.
- source_word: וַיְמַהֲרוּ וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: e rapidamente a incendiaram
  rationale: O advérbio preserva a urgência de מהר, enquanto 'incendiaram' transmite de modo natural o causativo de יצת; repetir 'com fogo' seria redundante em português.
