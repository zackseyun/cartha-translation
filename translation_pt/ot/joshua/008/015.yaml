  text: וַ/יִּנָּֽגְע֛וּ יְהוֹשֻׁ֥עַ וְ/כָל יִשְׂרָאֵ֖ל לִ/פְנֵי/הֶ֑ם וַ/יָּנֻ֖סוּ דֶּ֥רֶךְ הַ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: pt
  text: Josué e todo o Israel deixaram-se derrotar diante deles e fugiram pelo caminho do deserto.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram derrotados diante deles”. Pelo contexto, é provável que se trate de uma derrota fingida, como parte da estratégia para afastar de Ai os homens da cidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pela estrada que levava ao deserto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: deixaram-se derrotar
  rationale: O nifal, no contexto militar, indica que foram derrotados ou se apresentaram como derrotados. A construção reflexiva preserva a ideia da manobra intencional indicada pelo contexto sem transformar o verbo numa explicação extensa.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Equivalente natural e direto de לִפְנֵי com sufixo, preservando a relação espacial e militar.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: Tradução comum e direta de נוּס; mantém a aparência de fuga descrita na narrativa sem explicitar além do hebraico que se tratava de uma retirada fingida.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: pelo caminho do deserto
  rationale: Mantém a amplitude de דֶּרֶךְ como caminho ou rota e reproduz de modo natural a formulação hebraica, sem decidir se o caminho atravessava o deserto ou levava até ele.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: Josué e todo o Israel
  rationale: Preserva a designação coletiva e pactual 'todo o Israel' presente no texto hebraico.
theological_decisions:
- issue: Natureza da derrota de Israel
  choice: deixaram-se derrotar
  alternative: foram derrotados; fingiram-se derrotados
  rationale: O contexto mostra uma manobra para atrair os homens de Ai, mas a forma verbal também admite leitura passiva simples. O texto principal sinaliza a intencionalidade sem eliminar a alternativa lexical, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase acompanha de perto o hebraico, enquanto 'deixaram-se derrotar' comunica de forma natural a provável ação deliberada. As notas preservam tanto a leitura passiva do verbo quanto a ambiguidade da expressão relativa ao caminho.
