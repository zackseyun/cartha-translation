  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: pt
  text: 'E deu-lhes esta ordem: “Vejam: vocês devem ficar de emboscada contra a cidade, atrás da cidade. Não se afastem muito da cidade e fiquem todos prontos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: Atenção!
  rationale: O imperativo plural funciona aqui como marcador enfático que chama a atenção para as instruções seguintes; esta formulação é natural em português e preserva sua força.
- source_word: אֹרְבִים לָעִיר
  choice: ficarão de emboscada contra a cidade
  rationale: Expressa a posição e a finalidade militar do particípio hebraico sem sugerir que o ataque já começou.
- source_word: מֵאַחֲרֵי הָעִיר
  choice: atrás dela
  rationale: Mantém a localização indicada pelo hebraico e evita a repetição pouco natural de “cidade” em português.
- source_word: נְכֹנִים
  choice: prontos
  rationale: No contexto militar, o termo indica preparação e prontidão para agir.
