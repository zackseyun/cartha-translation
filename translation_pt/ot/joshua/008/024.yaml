source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: pt
  text: E aconteceu que, quando Israel acabou de matar todos os habitantes de Ai no campo, no deserto onde os havia perseguido, e todos caíram ao fio da espada até serem completamente eliminados[a], todo o Israel voltou a Ai e passou a cidade ao fio da espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até chegarem ao fim”. A expressão hebraica enfatiza que nenhum dos perseguidos restou.'
    reason: Registra uma alternativa lexical para עַד תֻּמָּם e esclarece, sem expandir doutrinariamente, o seu sentido completivo no contexto.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Quando ... acabou de
  rationale: A construção introduz a circunstância temporal anterior ao retorno a Ai. Em português, “quando ... acabou de” transmite a sequência com naturalidade, sem reproduzir mecanicamente a fórmula narrativa hebraica.
- source_word: לַהֲרֹג
  choice: matar
  rationale: הרג designa diretamente o ato de matar. A escolha mantém a dureza explícita do relato, sem eufemismo.
- source_word: יֹשְׁבֵי הָעַי
  choice: habitantes de Ai
  rationale: O particípio substantivado de ישב refere-se às pessoas que habitavam a cidade; “habitantes” é preciso e corrente.
- source_word: בַּשָּׂדֶה בַּמִּדְבָּר
  choice: no campo, no deserto
  rationale: Mantém os dois termos topográficos do hebraico. Aqui מִדְבָּר indica terreno ermo ou inculto; “deserto” é a forma bíblica corrente e amplamente compreensível em português.
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: onde eles os tinham perseguido
  rationale: A formulação conserva a sequência anterior da perseguição e também a referência pronominal compacta do hebraico, sem inserir nomes que o texto não repete.
- source_word: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב
  choice: e todos caíram ao fio da espada
  rationale: “Cair” é o equivalente tradicional e inteligível do idioma de morte em combate, e “ao fio da espada” reproduz de modo natural a expressão hebraica literalmente ligada à “boca” da espada.
- source_word: עַד תֻּמָּם
  choice: até serem completamente eliminados
  rationale: A expressão comunica conclusão total. Esta redação é natural no contexto militar e mantém a ideia de que o grupo perseguido foi eliminado por completo; a nota registra uma alternativa mais próxima da forma lexical.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: todo o Israel voltou a Ai
  rationale: שוב seguido do destino indica retorno. “Todo o Israel” preserva o coletivo singular do hebraico.
- source_word: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
  choice: passou a cidade ao fio da espada
  rationale: O pronome feminino retoma Ai como cidade. A expressão portuguesa comunica idiomaticamente o ataque letal com a espada, evitando o pouco natural “feriu-a ao fio da espada”.
theological_decisions:
- issue: Linguagem de matança e destruição total em um relato de guerra
  choice: Manter termos diretos como “matar”, “caíram ao fio da espada” e “completamente eliminados”
  alternative: Abrandar o texto com expressões como “derrotar” ou acrescentar uma explicação de juízo divino
  rationale: O versículo descreve a violência militar de forma explícita. A tradução não deve suavizá-la nem acrescentar uma justificação teológica que este versículo não formula.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva fórmulas bíblicas ainda naturais, como “cair ao fio da espada”, sem arcaísmos excessivos. A sequência de pronomes em “eles os tinham perseguido” acompanha a concisão referencial do hebraico.
