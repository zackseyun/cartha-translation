  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: pt
  text: Então Josué construiu um altar a Yahweh[a], o Deus de Israel, no monte Ebal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nome divino em hebraico: «יהוה» (YHWH), geralmente vocalizado «Yahweh»; algumas traduções usam «SENHOR».'
    reason: Identifica com precisão a grafia hebraica do nome divino, sua transliteração e a principal tradição alternativa de tradução.
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca o acontecimento seguinte na sequência narrativa; «Então» é natural e direto em português.
- source_word: יִבְנֶה
  choice: construiu
  rationale: Embora a forma hebraica seja morfologicamente imperfeita, após אָז tem aqui valor narrativo passado.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: מִזְבֵּחַ
  choice: um altar
  rationale: Designa um altar sacrificial; o artigo indefinido corresponde naturalmente à primeira menção.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל indica que o altar foi erguido para ou dedicado a Yahweh; «a Yahweh» preserva essa relação de modo conciso.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Mantém de forma transparente a cadeia construta hebraica e a aposição que identifica Yahweh.
- source_word: בְּהַר עֵיבָל
  choice: no monte Ebal
  rationale: Expressa o local da construção com a formulação geográfica natural em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama; «Yahweh» preserva o nome divino e a distinção em relação ao título «Senhor».
- issue: Sentido da preposição ל em לַיהוָה
  choice: a Yahweh
  alternative: para Yahweh
  rationale: A construção pode exprimir destinação ou dedicação. «A Yahweh» preserva essa amplitude sem explicar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a ordem simples da narrativa e a identificação formal «Yahweh, o Deus de Israel».
