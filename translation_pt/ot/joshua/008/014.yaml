  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: pt
  text: Aconteceu que, quando o rei de Ai viu isso, eles se apressaram e se levantaram cedo; os homens da cidade — ele e todo o seu povo — saíram ao encontro de Israel para a batalha, rumo ao lugar marcado[a], diante da Arabá[b]. Mas ele não sabia que havia uma emboscada contra ele atrás da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na hora marcada». O termo hebraico pode indicar tanto um tempo determinado como um lugar de encontro previamente estabelecido.'
    reason: Preservar a ambiguidade lexical de מוֹעֵד.
  - marker: b
    text: 'Ou: «diante da planície». O termo hebraico pode designar a região da Arabá ou, de modo mais geral, uma planície desértica ou estepe.'
    reason: Registrar a alternativa entre o nome geográfico e o sentido topográfico geral de עֲרָבָה.
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Reproduz a fórmula narrativa hebraica de modo natural e digno, sem recorrer ao arcaísmo «E sucedeu».
- source_word: כִּרְאוֹת
  choice: quando ... viu isso
  rationale: A construção infinitiva com כִּי tem valor temporal. O objeto de «viu» está implícito no hebraico e é expresso por «isso» em português, remetendo à movimentação de Israel no contexto.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: eles se apressaram, levantaram-se bem cedo
  rationale: Mantém os verbos no plural e o sentido usual do hifil de שׁכם, levantar-se cedo. O pronome preserva a antecipação do sujeito, explicitado em seguida como os homens da cidade.
- source_word: אַנְשֵׁי הָעִיר
  choice: os homens da cidade
  rationale: Traduz literalmente o substantivo masculino plural; o contexto é de mobilização para a batalha.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: ao encontro de Israel para a batalha
  rationale: Preserva o sentido direcional de לִקְרַאת, enquanto a expressão seguinte torna explícita a finalidade hostil do encontro.
- source_word: הוּא וְכָל עַמּוֹ
  choice: O rei e todo o seu povo
  rationale: Retoma explicitamente «o rei» para evitar uma referência pronominal pesada em português e conserva עַם como «povo», sem transformá-lo indevidamente em «exército».
- source_word: לַמּוֹעֵד
  choice: ao lugar marcado
  rationale: O movimento expresso pelo contexto e a indicação geográfica seguinte favorecem o sentido espacial de מוֹעֵד, embora o termo também possa indicar um tempo determinado; a ambiguidade é registrada em nota.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: diante da Arabá
  rationale: לִפְנֵי significa «diante de/em frente de». Arabá é preservado como nome geográfico, sem ocultar em nota a possibilidade de um sentido topográfico mais geral.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: havia uma emboscada contra ele atrás da cidade
  rationale: Expressa em português corrente a força do particípio אֹרֵב e mantém tanto o alvo da emboscada quanto sua localização.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa hebraica foi mantida sempre que natural; a retomada explícita de «o rei» evita ambiguidade referencial. As duas ambiguidades lexicais relevantes foram preservadas por notas.
