  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: pt
  text: Depois disso, ele leu[a] todas as palavras da Lei[b], a bênção e a maldição, conforme tudo o que está escrito no Livro da Lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “proclamou” ou “leu em voz alta”; neste contexto, o verbo hebraico pode indicar leitura pública ou proclamação.
    reason: lexical_alternative
  - marker: b
    text: “Lei” traduz o hebraico torá, que também pode significar “instrução”. Aqui, o contexto de um documento da aliança favorece “Lei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: Depois disso
  rationale: Marca com naturalidade a sequência temporal e mantém a ligação narrativa expressa pelo waw.
- source_word: קָרָא
  choice: ele leu
  rationale: Com “todas as palavras da Lei” como objeto, o verbo indica mais naturalmente leitura, provavelmente pública e em voz alta; a nota preserva essas nuances possíveis.
- source_word: אֶת כָּל דִּבְרֵי הַ/תּוֹרָה
  choice: todas as palavras da Lei
  rationale: “Palavras” preserva a concretude de דִּבְרֵי; “Lei” é natural no contexto de um documento da aliança, embora תּוֹרָה também possa significar “instrução”.
- source_word: הַ/בְּרָכָה וְ/הַ/קְּלָלָה
  choice: a bênção e a maldição
  rationale: Mantém os substantivos singulares do hebraico, que resumem as seções ou categorias pactuais de bênção e maldição.
- source_word: כְּ/כָל הַ/כָּתוּב
  choice: conforme tudo o que está escrito
  rationale: Expressa a conformidade da leitura com o texto escrito e reproduz naturalmente o valor do particípio passivo.
- source_word: בְּ/סֵפֶר הַ/תּוֹרָה
  choice: no Livro da Lei
  rationale: “Livro” comunica de modo claro o documento escrito; a inicial maiúscula apresenta a expressão como designação reconhecida no contexto.
