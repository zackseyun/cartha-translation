base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: pt
  text: E todo o povo que estava na cidade foi convocado para persegui-los[a]; eles perseguiram Josué e foram afastados da cidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «clamaram»; o verbo hebraico pode indicar um clamor, mas aqui provavelmente se refere à convocação ou mobilização para a perseguição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «foram separados da cidade» ou «foram arrancados da cidade». O hebraico sugere que foram levados para fora, ficando separados da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: foram convocados
  rationale: O nifal de זעק pode expressar convocação ou mobilização. No contexto militar, «foram convocados» comunica melhor a ação do que a alternativa literal «gritaram».
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: todos os que estavam na cidade
  rationale: Preserva a abrangência de עָם sem introduzir «homens», ausente no hebraico, e evita a impressão pouco plausível de que cada habitante, sem exceção, necessariamente participou.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: para persegui-los
  rationale: רדף אחרי é uma expressão comum para perseguir alguém; a forma pronominal plural é mantida.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: Eles perseguiram Josué
  rationale: Mantém a repetição verbal e a mudança do objeto plural anterior para Josué, sem harmonizar os referentes.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: foram afastados da cidade
  rationale: O nifal de נתק indica que foram separados ou arrancados de sua posição junto à cidade. «Foram afastados» preserva o resultado tático sem afirmar explicitamente quem os atraiu.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
