base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: pt
  text: 'Então Yahweh disse a Josué: “Estenda a lança[a] que está em sua mão em direção a Ai, pois eu a entregarei em sua mão.” E Josué estendeu a lança que estava em sua mão em direção à cidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dardo”. O termo hebraico pode designar uma lança, um dardo ou uma arma semelhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, preservando sua função de nome próprio.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: Estenda / estendeu
  rationale: Reproduz a ideia de estender o braço e a arma sem reduzir o gesto a simplesmente apontar.
- source_word: כִּידוֹן
  choice: lança
  rationale: O termo designa uma arma de haste, mas sua identificação precisa como lança, dardo ou outra arma semelhante é incerta; “lança” é natural e amplamente compreensível em português.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: que está em sua mão / que estava em sua mão
  rationale: Mantém as orações relativas explícitas do hebraico, com ajuste temporal natural entre discurso direto e narrativa.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: em direção a Ai / em direção à cidade
  rationale: Expressa a direção do gesto e preserva a variação hebraica entre o nome do lugar e “a cidade”.
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: pois eu a entregarei em suas mãos
  rationale: Comunica o idioma hebraico de entregar algo ao poder de alguém, mantendo o valor futuro da forma verbal.
- source_word: אֶתְּנֶנָּה
  choice: a
  rationale: O sufixo feminino singular retoma implicitamente a cidade; o pronome feminino é natural em português.
theological_decisions:
- issue: Tradução do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o tetragrama como nome próprio; “Yahweh” preserva o nome divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação da repetição narrativa. A expressão idiomática “em suas mãos” comunica domínio ou poder, não apenas posse física.
