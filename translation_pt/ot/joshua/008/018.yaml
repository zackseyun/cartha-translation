  to: 'Então Yahweh disse a Josué: “Estenda a lança[a] que está em sua mão em direção a Ai, pois eu a entregarei em sua mão.” E Josué estendeu a lança que estava em sua mão em direção à cidade.'
  rationale: A revisão restaura o singular de “mão”, conforme o hebraico, e ajusta a ordem dos complementos para maior fluência. Mantém a variação entre “Ai” e “a cidade”, a repetição da arma e a nota lexical que preserva a incerteza semântica de כִּידוֹן.
