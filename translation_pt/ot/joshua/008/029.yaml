  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: pt
  text: E Josué pendurou[a] o rei de Ai numa árvore até o entardecer. Ao pôr do sol,[b] Josué deu ordem, e eles retiraram da árvore o cadáver do rei e o lançaram à entrada do portão da cidade. Depois, ergueram sobre ele um grande monte de pedras, que permanece até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suspendeu”. O verbo hebraico significa pendurar ou suspender e, por si só, não especifica o método de execução.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “quando o sol entrou”, expressão hebraica que significa “quando o sol se pôs”.'
    reason: idiom
lexical_decisions:
- source_word: תָּלָה
  choice: pendurou
  rationale: O verbo significa pendurar ou suspender. “Pendurou” conserva a amplitude do hebraico sem especificar indevidamente enforcamento ou empalamento.
- source_word: הָעֵץ
  choice: numa árvore
  rationale: עֵץ pode designar árvore, madeira ou uma estrutura de madeira. “Árvore” reproduz o sentido mais direto, enquanto o artigo indefinido soa natural em português neste contexto.
- source_word: עַד עֵת הָעָרֶב
  choice: até o entardecer
  rationale: Expressa de modo natural a referência ao período da tarde/noite, sem a formulação pouco idiomática “até o tempo da tarde”.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: ao pôr do sol
  rationale: É a forma portuguesa corrente de expressar o idiomatismo hebraico referente ao ocaso.
- source_word: נִבְלָתוֹ
  choice: o cadáver do rei
  rationale: נְבֵלָה indica um corpo morto. “Cadáver” preserva a força concreta do termo; repetir “do rei” evita uma cadeia pronominal ambígua em português.
- source_word: וַיַּשְׁלִיכוּ אוֹתָהּ
  choice: o lançaram
  rationale: O sufixo hebraico retoma o substantivo feminino נְבֵלָה. Em português, o pronome concorda naturalmente com “cadáver”, que é masculino; “lançaram” mantém a ação vigorosa sem soar coloquial.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: à entrada do portão da cidade
  rationale: Representa os dois elementos da expressão hebraica — abertura/entrada e portão — em linguagem portuguesa clara.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: um grande monte de pedras
  rationale: É uma tradução acessível e idiomática para um grande amontoado de pedras.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: que permanece até hoje
  rationale: Explicita naturalmente em português a permanência implícita na fórmula hebraica, sem alterar sua função memorial e narrativa.
theological_decisions:
- issue: Sujeito da oração inicial
  choice: Josué pendurou o rei de Ai
  alternative: 'Ele pendurou o rei de Ai; ou: penduraram o rei de Ai'
  rationale: O hebraico traz um verbo masculino singular sem sujeito expresso. No contexto, Josué é o antecedente mais natural, e nomeá-lo torna o versículo inteligível sem converter o verbo singular em plural.
- issue: Forma da exposição do rei
  choice: pendurou numa árvore
  alternative: enforcou; empalou; suspendeu numa estrutura de madeira
  rationale: O hebraico não define o mecanismo da morte nem especifica se o rei foi morto por enforcamento, empalamento ou se seu cadáver foi exposto depois da execução. A tradução preserva essa indeterminação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preferiu-se “portão da cidade” a “porta da cidade” para deixar claro que se trata da entrada urbana. A coordenação hebraica foi levemente variada com “Depois” para produzir narrativa natural sem perder a sequência dos acontecimentos.
