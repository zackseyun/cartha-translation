  text: וַ/אֲנִ֗י וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתִּ֔/י נִקְרַ֖ב אֶל הָ/עִ֑יר וְ/הָיָ֗ה כִּֽי יֵצְא֤וּ לִ/קְרָאתֵ֨/נוּ֙ כַּ/אֲשֶׁ֣ר בָּ/רִֽאשֹׁנָ֔ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: pt
  text: E eu e todo o povo que está comigo nos aproximaremos da cidade[a]. Quando eles saírem ao nosso encontro, como antes[b], fugiremos diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegaremos perto da cidade”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “como na primeira vez”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: nos aproximaremos
  rationale: O qal imperfeito na primeira pessoa do plural expressa a ação futura planejada; a forma pronominal é natural em português e preserva o movimento em direção à cidade.
- source_word: הָעָם
  choice: o povo
  rationale: Mantém o sentido lexical amplo de עם sem restringi-lo indevidamente a soldados ou homens.
- source_word: אֲשֶׁר אִתִּי
  choice: que está comigo
  rationale: A oração relativa identifica o grupo que acompanha Josué; a concordância no singular acompanha naturalmente o coletivo 'povo' em português.
- source_word: וְהָיָה כִּי
  choice: Quando
  rationale: Traduz de modo idiomático a construção temporal hebraica que introduz o acontecimento seguinte, sem reproduzir literalmente uma fórmula pouco natural.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: eles saírem ao nosso encontro
  rationale: Preserva tanto o movimento de saída quanto a expressão לקראת, sem explicitar 'contra nós', nuance possível no contexto, mas não obrigatória lexicalmente.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: como da primeira vez
  rationale: Expressa com clareza a referência ao primeiro confronto; a nota registra a formulação hebraica mais literal.
- source_word: וְנַסְנוּ
  choice: fugiremos
  rationale: A forma verbal na sequência comunica a ação futura planejada; 'fugiremos' conserva a força de נוס e não a atenua como faria 'recuaremos'.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: Reproduz o idioma espacial hebraico associado ao verbo fugir e permanece natural e digno em português.
- source_word: וַאֲנִי וְכָל הָעָם
  choice: Eu e todo o povo
  rationale: Mantém a coordenação do hebraico; a conjunção inicial não precisa ser explicitada em português, pois a continuidade com a instrução anterior permanece clara no contexto.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A tradução segue uma equivalência ótima: conserva ''o povo'' e ''diante deles'', enquanto verte de modo idiomático as construções temporal e verbal do hebraico.'
