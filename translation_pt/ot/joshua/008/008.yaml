base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: pt
  text: Quando vocês tomarem a cidade, incendeiem-na. Façam conforme a palavra de Yahweh.[a] Vejam, eu lhes ordenei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Façam conforme a ordem de Yahweh”. Em hebraico, a expressão é literalmente “conforme a palavra de Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: Quando vocês tomarem
  rationale: A construção introduz a circunstância temporal que antecede a ordem seguinte. Esta formulação é natural em português e conserva a orientação futura.
- source_word: אֶת־הָעִיר
  choice: a cidade
  rationale: Tradução comum de עִיר e adequada ao contexto militar.
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: incendeiem-na
  rationale: O hifil de יצת expressa fazer pegar fogo. O verbo português “incendiar” comunica de modo conciso o sentido causativo de pôr a cidade em chamas.
- source_word: כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  rationale: Preserva o sentido básico de דָּבָר, “palavra”, sem excluir a força de ordem que a expressão assume no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: תַּעֲשׂוּ
  choice: Façam
  rationale: O contexto confere força instrutiva ao imperfeito; o imperativo é a forma mais natural de expressá-la em português.
- source_word: רְאוּ
  choice: Vejam
  rationale: Mantém a metáfora e a força direta do imperativo hebraico usado para chamar a atenção.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: eu lhes dei a ordem
  rationale: Expressa naturalmente em português a ação passada de ordenar ao grupo, sem acrescentar o conteúdo da ordem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de כִּדְבַר יְהוָה
  choice: conforme a palavra de Yahweh
  alternative: conforme a ordem de Yahweh
  rationale: “Palavra” conserva a formulação hebraica e sua amplitude sem negar que, neste contexto, ela funciona como ordem.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de “vocês” para o plural. Os imperativos tornam natural a força instrutiva do contexto militar; “incendeiem-na” evita a repetição pouco fluida de “a cidade” sem perda do referente.
