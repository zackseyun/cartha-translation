  source_fidelity: A tradução reproduz corretamente a sequência temporal, a tomada da cidade, a ordem de incendiá-la e a referência à palavra de Yahweh. Contudo, “eu lhes dei a ordem” apresenta “ordem” no singular, enquanto o hebraico diz literalmente “eu ordenei a vocês”; a formulação pode sugerir uma única ordem específica e é menos direta do que o original.
