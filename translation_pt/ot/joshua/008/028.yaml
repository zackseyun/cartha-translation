base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: pt
  text: Assim, Josué queimou Ai e a transformou num monte de ruínas permanente[a], uma desolação até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um monte de ruínas perpétuo»; o hebraico עוֹלָם pode indicar uma duração muito longa ou indefinida e muitas vezes é traduzido por «para sempre» ou «eterno».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: queimou
  rationale: O verbo שׂרף denota claramente destruir ou consumir pelo fogo; «queimou» é direto e natural no contexto narrativo.
- source_word: הָעָי
  choice: Ai
  rationale: Nome próprio do lugar, mantido na forma tradicional portuguesa.
- source_word: וַיְשִׂימֶהָ
  choice: a transformou
  rationale: O verbo שׂים com sufixo feminino expressa aqui o resultado imposto à cidade; «a transformou» liga naturalmente a ação ao predicativo seguinte.
- source_word: תֵּל
  choice: monte de ruínas
  rationale: תֵּל designa um montículo ou elevação formada pelos restos de uma cidade destruída; «monte de ruínas» comunica esse sentido com clareza ao leitor comum.
- source_word: עוֹלָם
  choice: permanente
  rationale: Neste contexto histórico, עוֹלָם indica duração contínua ou indefinidamente longa, sem exigir a noção metafísica de eternidade.
- source_word: שְׁמָמָה
  choice: uma desolação
  rationale: Preserva a força nominal e a aposição do hebraico, descrevendo Ai como lugar devastado.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente português natural da expressão que indica a permanência da condição até a época do narrador.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Monte de ruínas» explicita de modo natural o sentido arqueológico de תֵּל, enquanto a nota preserva a amplitude semântica de עוֹלָם.
