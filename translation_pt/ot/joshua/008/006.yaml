  text: וְ/יָצְא֣וּ אַחֲרֵ֗י/נוּ עַ֣ד הַתִּיקֵ֤/נוּ אוֹתָ/ם֙ מִן הָ/עִ֔יר כִּ֣י יֹֽאמְר֔וּ נָסִ֣ים לְ/פָנֵ֔י/נוּ כַּ/אֲשֶׁ֖ר בָּ/רִֽאשֹׁנָ֑ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: pt
  text: 'Eles sairão atrás de nós, até que os tenhamos afastado da cidade[a], pois dirão[b]: “Estão fugindo de nós, como da primeira vez”. E nós fugiremos deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “até que os tenhamos atraído para longe da cidade”. O verbo hebraico significa puxar, retirar ou afastar; “atraído” explicita a tática.
    reason: lexical_alternative
  - marker: b
    text: “Como da primeira vez” se refere à retirada anterior de Israel diante de Ai (ver Josué 7:4–5).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: Eles sairão atrás de nós
  rationale: O perfeito com conjunção, no contexto de um plano exposto em discurso, tem sentido prospectivo. “Sairão atrás de nós” expressa naturalmente tanto a saída da cidade quanto a perseguição.
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: até que os tenhamos afastado da cidade
  rationale: O hifil de נתק significa puxar, retirar ou afastar. A formulação preserva a ação causativa e o caráter tático sem tornar explícita demais a ideia de atraí-los como isca.
- source_word: כִּי יֹאמְרוּ
  choice: pois dirão
  rationale: כִּי introduz a razão pela qual a estratégia funcionará; “pois” mantém essa relação explicativa de modo conciso.
- source_word: נָסִים לְפָנֵינוּ
  choice: Estão fugindo de nós
  rationale: O particípio נָסִים indica ação em andamento. Neste contexto militar, לְפָנֵינוּ descreve fuga diante dos perseguidores, expressa idiomaticamente em português por “de nós”.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: como da primeira vez
  rationale: A expressão remete especificamente à retirada anterior de Israel diante de Ai; “da primeira vez” é natural em português e conserva essa referência temporal.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: E nós fugiremos deles
  rationale: No plano narrado, o perfeito com conjunção tem valor futuro. “Fugiremos deles” retoma o mesmo verbo e mantém o paralelismo entre a suposição dos homens de Ai e a retirada simulada de Israel.
theological_decisions: []
