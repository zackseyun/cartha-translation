  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: pt
  text: Ele tomou cerca de cinco mil homens[a] e os colocou em emboscada entre Betel e Ai, a oeste da cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “cerca de cinco mil homens”; o prefixo ligado a “cinco” provavelmente indica uma quantidade aproximada, não um total exato.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega literalmente “mar” como indicação do oeste; a expressão situa o grupo a oeste da cidade.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Ele tomou
  rationale: O verbo לקח significa de modo mais direto “tomar”. No contexto militar, pode envolver escolher homens de uma força maior, mas “tomou” preserva a formulação simples do hebraico sem explicitação indevida.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: cerca de cinco mil homens
  rationale: 'O prefixo כ־ ligado ao numeral indica provavelmente aproximação; “cerca de” comunica isso com naturalidade. אִישׁ, após o numeral, tem sentido coletivo: “homens”.'
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: e os pôs de emboscada
  rationale: שׂים tem o sentido amplo de pôr ou colocar, e אֹרֵב designa aqui uma força à espera para atacar. “Pôs de emboscada” é idiomático em português e mantém a concisão do hebraico.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: entre Betel e Ai
  rationale: Tradução direta da expressão locativa, com as formas portuguesas correntes dos nomes próprios.
- source_word: מִיָּם לָעִיר
  choice: a oeste da cidade
  rationale: יָם, literalmente “mar”, é usado idiomaticamente como indicação do oeste. A expressão localiza a emboscada no lado ocidental da cidade.
