  text: וְ/לֹֽא נִשְׁאַ֣ר אִ֗ישׁ בָּ/עַי֙ וּ/בֵ֣ית אֵ֔ל אֲשֶׁ֥ר לֹֽא יָצְא֖וּ אַחֲרֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעַזְב֤וּ אֶת הָ/עִיר֙ פְּתוּחָ֔ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: pt
  text: Não ficou um só homem em Ai nem em Betel que não saísse atrás de Israel[b]. E deixaram a cidade aberta[a] e perseguiram Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “a cidade desprotegida”. O hebraico diz literalmente “a cidade aberta”.
    reason: lexical_alternative
  - marker: b
    text: “Um só homem” traduz o substantivo hebraico masculino singular אִישׁ. A expressão negativa enfatiza que não ficou nenhum homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: Não ficou um só homem
  rationale: Reproduz de modo natural a construção negativa com o singular masculino אִישׁ e o verbo passivo/estativo נִשְׁאַר, mantendo a referência explícita a 'homem' sem perder a força de totalidade.
- source_word: בָּעַי וּבֵית אֵל
  choice: em Ai nem em Betel
  rationale: Depois da negação, 'nem... nem...' expressa naturalmente em português que nenhum homem permaneceu em qualquer das duas localidades.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: que não saísse atrás de Israel
  rationale: Preserva a oração relativa e o idioma direcional אַחֲרֵי; o subjuntivo é a construção portuguesa natural sob o antecedente negativo.
- source_word: וַיַּעַזְבוּ
  choice: Assim, deixaram
  rationale: O verbo 'deixar' traduz diretamente עזב; 'Assim' torna clara a consequência narrativa implícita sem acrescentar conteúdo doutrinário.
- source_word: הָעִיר פְּתוּחָה
  choice: a cidade aberta
  rationale: Mantém a imagem concreta do hebraico פְּתוּחָה, embora no contexto ela implique que a cidade ficou desprotegida.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: e perseguiram Israel
  rationale: '''Perseguir'' é natural no contexto militar e já incorpora em português a ideia de ir atrás, evitando redundância.'
