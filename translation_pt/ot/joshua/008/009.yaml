  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: pt
  text: Então Josué os enviou, e eles foram para o local da emboscada[a] e ficaram entre Betel e Ai, a oeste de Ai. E Josué passou aquela noite no meio do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a tropa de emboscada”. O termo hebraico pode indicar tanto a força que arma a emboscada quanto o lugar onde ela fica à espera; aqui, o contexto favorece o local ocupado por eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: os enviou
  rationale: O verbo שׁלח expressa diretamente que Josué os mandou partir; “os enviou” é claro, natural e preserva o objeto pronominal.
- source_word: הַמַּאְרָב
  choice: o local da emboscada
  rationale: O substantivo pode designar a força emboscada ou o lugar onde ela fica à espera. Como os homens vão até ali e depois permanecem numa posição geográfica definida, o sentido locativo é o mais provável no contexto.
- source_word: וַיֵּשְׁבוּ
  choice: ficaram
  rationale: ישׁב pode significar sentar-se, habitar ou permanecer. Aqui, no contexto militar, “ficaram” comunica de modo natural que mantiveram sua posição sem explicitar além do hebraico.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: entre Betel e Ai
  rationale: Tradução direta da localização geográfica, com as formas portuguesas correntes dos topônimos.
- source_word: מִיָּם לָעָי
  choice: a oeste de Ai
  rationale: יָם significa literalmente “mar”, mas funciona aqui como termo direcional para o oeste, lado do mar Mediterrâneo.
- source_word: וַיָּלֶן
  choice: passou ... a noite
  rationale: O verbo לון indica pernoitar ou permanecer durante a noite; esta formulação é idiomática em português atual.
- source_word: בְּתוֹךְ הָעָם
  choice: no meio do povo
  rationale: Expressa naturalmente a presença de Josué entre o conjunto do povo e conserva de perto a imagem espacial de בְּתוֹךְ.
