base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: pt
  text: Estes saíram da cidade ao encontro deles[a]. Assim, os homens de Ai ficaram no meio de Israel, com israelitas de um lado e do outro[b]; e Israel os feriu até que não restasse sobrevivente nem fugitivo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Estes” se refere aos israelitas que estavam na emboscada e haviam tomado a cidade.
    reason: referent_clarification
  - marker: b
    text: 'Hebraico: “estes deste lado e estes daquele lado”, expressão que indica que os homens de Ai ficaram cercados pelos dois lados.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico passa aqui a uma forma verbal singular e diz, literalmente, “até não deixar para ele sobrevivente e fugitivo”. A referência do pronome singular é incerta; a tradução expressa o resultado: ninguém permaneceu vivo nem escapou.'
    reason: source_syntax
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes
  rationale: Preserva a força demonstrativa do hebraico e remete ao contingente israelita da emboscada mencionado no contexto anterior.
- source_word: יָצְאוּ מִן הָעִיר
  choice: saíram da cidade
  rationale: Verte naturalmente o movimento para fora da cidade no ponto de vista narrativo.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: Mantém o sentido básico de לקראת; o caráter hostil do encontro fica claro pelo contexto militar.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: Assim, os homens de Ai ficaram no meio de Israel
  rationale: Expressa o resultado tático da ação e explicita o referente implícito do pronome para evitar confusão em português.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: com israelitas de um lado e do outro
  rationale: Comunica de modo natural o cerco por dois lados, sem perder a estrutura bilateral da expressão hebraica.
- source_word: וַיַּכּוּ אוֹתָם
  choice: e Israel os feriu
  rationale: נכה, em contexto de batalha, descreve um golpe ou derrota de efeito letal. O coletivo 'Israel' também permite representar a mudança hebraica subsequente para o singular.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: até não lhes deixar
  rationale: Mantém a ideia de extensão até a eliminação total. O português exige ajustar a construção pronominal incomum do hebraico; 'lhes' toma os derrotados coletivamente como referente contextual.
- source_word: שָׂרִיד וּפָלִיט
  choice: sobrevivente nem fugitivo
  rationale: 'Conserva distintamente os dois termos: quem permanece vivo e quem consegue escapar.'
