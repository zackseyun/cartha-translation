    rationale: O hebraico emprega uma forma verbal singular e o sufixo singular לו; seu referente exato é discutível no contexto. O plural português resolve a ambiguidade de modo indevido, e a nota atual afirma uma explicação coletiva que não é exigida pela sintaxe.
