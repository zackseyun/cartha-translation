source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: pt
  text: 'Então Yahweh disse a Josué: “Não tenha medo nem fique desanimado. Leve com você todos os guerreiros[a], levante-se e suba a Ai. Veja: entreguei em sua mão o rei de Ai, seu povo, sua cidade e sua terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «todo o povo da guerra»; ou «todos os homens de guerra». A expressão hebraica se refere à força combatente.
    reason: Alternativa lexical e esclarecimento do sentido da expressão militar hebraica.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Não tenha medo nem fique desanimado
  rationale: Reproduz as duas proibições, distinguindo o temor da perda de ânimo, em português atual e digno.
- source_word: קַח עִמְּךָ
  choice: Leve com você
  rationale: Representa explicitamente a locução עִמְּךָ, indicando que Josué deveria levar consigo a força de combate.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: todos os homens de guerra
  rationale: Expressa a força militar indicada pelo hebraico, preservando seu caráter pessoal e marcial; a tradução literal e outra alternativa constam na nota.
- source_word: וְקוּם עֲלֵה
  choice: levante-se e suba
  rationale: Mantém os dois imperativos e a progressão enfática do hebraico.
- source_word: הָעָי
  choice: Ai
  rationale: Transliteração portuguesa convencional do topônimo.
- source_word: רְאֵה
  choice: Veja
  rationale: Conserva o imperativo que introduz a garantia divina, sem recorrer a formulação arcaica.
- source_word: נָתַתִּי בְיָדְךָ
  choice: entreguei em suas mãos
  rationale: O perfeito apresenta a entrega como certa e realizada; a expressão 'em suas mãos' preserva a imagem hebraica de domínio e controle.
- source_word: אֶת מֶלֶךְ הָעַי וְאֶת עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: o rei de Ai, seu povo, sua cidade e sua terra
  rationale: Mantém a sequência e os sufixos possessivos ligados gramaticalmente ao rei.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o nome próprio divino; sua transliteração preserva essa identificação, sem substituí-la por um título.
- issue: Valor do perfeito נָתַתִּי na promessa divina
  choice: entreguei
  alternative: entrego; tenho entregado
  rationale: A forma perfeita apresenta a vitória prometida como fato certo. O pretérito preserva essa força sem explicar além do que o hebraico afirma.
- issue: Referência militar de כָּל עַם הַמִּלְחָמָה
  choice: todos os homens de guerra
  alternative: todo o exército; todos os guerreiros
  rationale: A expressão designa a força combatente. A escolha evita entendê-la como todo o povo indistintamente e mantém a formulação pessoal do original.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A coordenação foi naturalizada onde necessário, mas os imperativos, a imagem de entrega 'nas mãos' e a sequência dos objetos foram preservados.
