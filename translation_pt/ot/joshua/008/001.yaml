  timestamp: '2026-07-13T22:07:25Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a dupla proibição, os imperativos, a garantia expressa pelo perfeito hebraico e a lista do rei, povo, cidade e terra. Contudo, «contra Ai» introduz uma nuance de hostilidade/direção que não está explicitada no imperativo עֲלֵה, «sobe», e «em suas mãos» pluraliza a expressão hebraica singular «em tua mão».
  naturalness: O português é claro, moderno e adequado ao registro narrativo solene. «Todos os homens de guerra» é compreensível, mas «todos os guerreiros» é mais natural em português atual e continua a designar a força combatente indicada pelo contexto.
  terminology: «Yahweh», «Josué» e «Ai» estão adequadamente apresentados. «Desanimado» comunica bem o sentido de חתת no paralelismo de encorajamento. A nota deve manter a alternativa literal e explicar que a expressão se refere à força de combate.
  issues:
  - severity: medium
    issue: «suba contra Ai» acrescenta «contra»
    rationale: O hebraico traz literalmente dois imperativos, «levanta-te, sobe [a] Ai». Embora o contexto seja militar, a preposição «contra» não é expressa e é desnecessária para o sentido.
  - severity: low
    issue: «em suas mãos» está no plural
    rationale: בְּיָדְךָ significa literalmente «em tua mão», no singular. «Em sua mão» é natural em português e preserva a imagem hebraica de poder ou domínio.
  - severity: low
    issue: «homens de guerra» é pouco idiomático no português contemporâneo
    rationale: A expressão é defensável e próxima da formulação literal, mas «guerreiros» é mais fluente. A nota preserva tanto a formulação literal quanto a explicação contextual.
