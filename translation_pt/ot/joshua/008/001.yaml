revisions:
- from: 'Então Yahweh disse a Josué: “Não tenha medo nem fique desanimado. Leve com você todos os homens de guerra[a], levante-se e suba contra Ai. Veja: entreguei em suas mãos o rei de Ai, seu povo, sua cidade e sua terra.”'
  to: 'Então Yahweh disse a Josué: “Não tenha medo nem fique desanimado. Leve com você todos os guerreiros[a], levante-se e suba a Ai. Veja: entreguei em sua mão o rei de Ai, seu povo, sua cidade e sua terra.”'
  rationale: A revisão remove a preposição não expressa no original, restabelece o singular de «em sua mão» e adota uma designação mais idiomática para a força combatente, mantendo a alternativa mais literal em nota. Não há alteração do sentido militar nem da força de certeza da promessa divina.
