  text: וַ/יִּפְנ֣וּ אַנְשֵׁי֩ הָ/עַ֨י אַחֲרֵי/הֶ֜ם וַ/יִּרְא֗וּ וְ/הִנֵּ֨ה עָלָ֜ה עֲשַׁ֤ן הָ/עִיר֙ הַ/שָּׁמַ֔יְמָ/ה וְ/לֹא הָיָ֨ה בָ/הֶ֥ם יָדַ֛יִם לָ/נ֖וּס הֵ֣נָּה וָ/הֵ֑נָּה וְ/הָ/עָם֙ הַ/נָּ֣ס הַ/מִּדְבָּ֔ר נֶהְפַּ֖ךְ אֶל הָ/רוֹדֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: pt
  text: Então os homens de Ai se viraram para trás e olharam. Eis que a fumaça da cidade subia em direção ao céu[a], e eles não tinham como fugir nem para um lado nem para o outro[b]. Então o povo que havia fugido para o deserto voltou-se contra o perseguidor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “rumo ao céu” ou “em direção aos céus”. A expressão hebraica indica movimento para cima.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente que “não havia mãos neles”, expressão idiomática que significa que lhes faltavam força ou capacidade para escapar.
    reason: cultural_note
  - marker: c
    text: O hebraico emprega o singular, “o perseguidor”, provavelmente com sentido coletivo, referindo-se à força que os perseguia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אַנְשֵׁי הָעַי אַחֲרֵיהֶם וַיִּרְאוּ
  choice: os homens de Ai se viraram para trás e olharam
  rationale: Mantém distintas as duas ações, virar-se e olhar, e expressa o sentido espacial de אַחֲרֵיהֶם de maneira natural em português.
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Reproduz o marcador narrativo que chama atenção para uma percepção súbita, em registro digno e corrente.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: a fumaça da cidade subia em direção ao céu
  rationale: O imperfeito narrativo descreve a fumaça subindo, e o sufixo direcional em הַשָּׁמַיְמָה indica movimento rumo ao céu, sem exigir uma referência teológica ao céu como morada divina.
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: eles não tinham forças
  rationale: Traduz de modo inteligível o idiomatismo hebraico literalmente relacionado a não haver 'mãos' neles, isto é, não terem capacidade ou poder para agir.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: para fugir nem para um lado nem para o outro
  rationale: Conserva a estrutura distributiva do hebraico e comunica que nenhuma direção de fuga estava disponível.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: o povo que havia fugido para o deserto
  rationale: O particípio identifica o grupo por sua fuga anterior; o mais-que-perfeito composto esclarece a sequência narrativa.
- source_word: נֶהְפַּךְ אֶל הָרוֹדֵף
  choice: voltou-se contra o perseguidor
  rationale: נֶהְפַּךְ marca a inversão de direção, e אֶל assume sentido hostil no contexto da batalha. O singular de הָרוֹדֵף foi preservado e explicado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro narrativo é digno sem arcaísmos; “Eis que” preserva a vivacidade do hebraico. As repetições espaciais foram mantidas quando contribuem para a cena, e os idiomatismos opacos foram traduzidos no texto e documentados em nota.
