  text: וַ/יָּ֧קָם יְהוֹשֻׁ֛עַ וְ/כָל עַ֥ם הַ/מִּלְחָמָ֖ה לַ/עֲל֣וֹת הָ/עָ֑י וַ/יִּבְחַ֣ר יְ֠הוֹשֻׁעַ שְׁלֹשִׁ֨ים אֶ֤לֶף אִישׁ֙ גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/יִּשְׁלָחֵ֖/ם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: pt
  text: Então Josué se levantou com todo o povo de guerra para subir contra Ai[a]. Josué escolheu trinta mil homens, guerreiros valentes, e os enviou de noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “subir a Ai”. No contexto, a subida tinha por objetivo atacar a cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: se levantou
  rationale: Preserva o sentido básico de קום e a progressão narrativa, sem antecipar toda a ideia de partir.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: todo o povo de guerra
  rationale: Mantém o caráter coletivo de עַם e a formulação militar do hebraico. Embora menos coloquial que “todos os combatentes”, é clara e não transforma explicitamente o coletivo em exército institucional.
- source_word: לַעֲלוֹת הָעָי
  choice: para subir contra Ai
  rationale: Conserva a imagem direcional de עלה e, por meio de “contra”, comunica o movimento hostil indicado pelo contexto militar.
- source_word: הָעָי
  choice: Ai
  rationale: Forma tradicional e amplamente reconhecida do nome do lugar em português.
- source_word: וַיִּבְחַר
  choice: escolheu
  rationale: Equivalente direto e natural de בחר na narrativa.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: trinta mil homens
  rationale: Reproduz a contagem explícita do texto hebraico sem substituir “homens” pela interpretação contextual “soldados”.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: guerreiros valentes
  rationale: Expressa em português atual a capacidade militar e a bravura contidas na expressão hebraica, evitando a formulação arcaizante “homens poderosos em valor”.
- source_word: וַיִּשְׁלָחֵם
  choice: os enviou
  rationale: Traduz diretamente o verbo שלח com seu sufixo de objeto; o contexto já deixa claro que foram enviados para uma operação militar.
- source_word: לָיְלָה
  choice: de noite
  rationale: Forma adverbial natural em português para a indicação temporal do hebraico.
theological_decisions: []
