- from: E Josué circuncidou os filhos deles, que haviam sido levantados em seu lugar[a], pois eram incircuncisos, porque não os haviam circuncidado durante a jornada.
  to: E Josué circuncidou os filhos deles, que haviam sido suscitados em lugar deles[a], pois eram incircuncisos, porque não os haviam circuncidado no caminho.
  rationale: A revisão substitui uma formulação literal, mas pouco natural, por “haviam sido suscitados em lugar deles”, que comunica a sucessão implícita em הֵקִים תַּחְתָּם sem introduzir Deus, Josué ou outro agente como sujeito. Também usa “no caminho” para refletir mais diretamente בַּדָּרֶךְ.
