  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: pt
  text: E Josué circuncidou os filhos deles, que haviam sido suscitados em lugar deles[a], pois eram incircuncisos, porque não os haviam circuncidado no caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em substituição a eles”; a expressão hebraica indica que esses filhos ocuparam o lugar da geração anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: E
  rationale: A conjunção dá continuidade à narrativa; o marcador de objeto אֵת não requer tradução independente em português.
- source_word: בְּנֵיהֶם
  choice: os filhos deles
  rationale: No contexto da circuncisão, בָּנִים designa especificamente os descendentes do sexo masculino; “filhos” é mais preciso que “crianças”.
- source_word: הֵקִים תַּחְתָּם
  choice: que haviam sido levantados em seu lugar
  rationale: A formulação conserva a ideia causativa de קום e o sentido de substituição de תַּחַת, sem explicitar o sujeito implícito do verbo hebraico.
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: Josué circuncidou
  rationale: מוּל é o verbo habitual para realizar a circuncisão; a ordem portuguesa identifica naturalmente Josué como sujeito e os filhos como objeto.
- source_word: עֲרֵלִים
  choice: incircuncisos
  rationale: É o termo português corrente e preciso para o estado físico e pactual indicado pelo hebraico.
- source_word: כִּי ... כִּי
  choice: pois ... porque
  rationale: As duas conjunções introduzem explicações causais sucessivas; a variação evita repetição pesada sem eliminar a relação lógica.
- source_word: לֹא מָלוּ אֹתָם
  choice: não os haviam circuncidado
  rationale: Mantém o sujeito indeterminado expresso pela terceira pessoa do plural no hebraico, sem acrescentar “ninguém”.
- source_word: בַּדָּרֶךְ
  choice: durante a jornada
  rationale: No contexto, a expressão se refere ao período de viagem pelo deserto; esta forma é clara e natural em português.
theological_decisions:
- issue: Estado físico ligado ao sinal da aliança
  choice: incircuncisos
  alternative: com o prepúcio
  rationale: O versículo trata da circuncisão física como sinal da aliança. “Incircuncisos” preserva tanto o referente corporal quanto a linguagem bíblica habitual, sem transformar o termo em metáfora.
- issue: Sujeito implícito de הֵקִים
  choice: haviam sido levantados
  alternative: Deus havia levantado
  rationale: O verbo hebraico está no singular, mas o sujeito não aparece explicitamente neste versículo. A construção passiva evita inserir “Deus” no texto principal e preserva a referência implícita.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa clara. A repetição de “deles/os” foi mantida onde ajuda a preservar os referentes do hebraico; “durante a jornada” comunica naturalmente o percurso pelo deserto.
