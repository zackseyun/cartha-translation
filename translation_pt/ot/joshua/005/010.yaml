  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: pt
  text: Os filhos de Israel[a] acamparam em Gilgal e celebraram a Páscoa no décimo quarto dia do mês, ao entardecer, nas planícies de Jericó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: acamparam
  rationale: O verbo חנה indica montar ou estabelecer acampamento. “Acamparam” é a forma natural e precisa em português atual.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a expressão familiar masculina do hebraico, embora “os israelitas” seja mais idiomático em português.
- source_word: בַּגִּלְגָּל
  choice: em Gilgal
  rationale: A preposição hebraica indica o local do acampamento; “em Gilgal” é a formulação natural em português.
- source_word: וַיַּעֲשׂוּ אֶת הַפֶּסַח
  choice: celebraram a Páscoa
  rationale: Fazer a Páscoa é um idiomatismo hebraico para celebrar ou observar essa ocasião. “Celebraram” comunica o sentido com naturalidade sem reproduzir literalmente o verbo עשה.
- source_word: הַפֶּסַח
  choice: a Páscoa
  rationale: É a designação portuguesa consagrada para a celebração ou sacrifício pascal neste contexto.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: no décimo quarto dia do mês
  rationale: Reproduz com precisão e naturalidade a fórmula calendárica hebraica.
- source_word: בָּעֶרֶב
  choice: ao entardecer
  rationale: Indica o período vespertino em que a Páscoa foi celebrada. “Ao entardecer” é natural e mantém a referência temporal sem impor precisão maior que a do hebraico.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: nas planícies de Jericó
  rationale: O plural עַרְבוֹת designa as planícies ou estepes da região. “Planícies de Jericó” é geograficamente claro e corrente.
theological_decisions:
- issue: Tradução de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: Não há controvérsia doutrinária direta, mas a expressão hebraica é familiar e explicitamente masculina. A tradução principal conserva essa forma, enquanto a nota registra equivalentes idiomáticos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sintaxe acompanha de perto a progressão narrativa hebraica, mas emprega expressões portuguesas naturais.
