  naturalness: O português é moderno, claro e de registro digno. «Vim agora», «caiu com o rosto em terra» e «O que meu senhor tem a dizer ao seu servo?» são formulações naturais e compreensíveis internacionalmente, incluindo para leitores brasileiros.
  terminology: «Yahweh», «comandante», «exército», «meu senhor» e «servo» são escolhas consistentes com o hebraico e com as decisões de tradução fornecidas. A minúscula em «meu senhor» evita identificar a figura além do que o versículo afirma.
