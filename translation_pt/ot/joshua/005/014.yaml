id: JOS.5.14
reference: Joshua 5:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: pt
  text: 'Ele respondeu[a]: “Não; pelo contrário, vim agora como comandante do exército de Yahweh”. Então Josué caiu com o rosto em terra e se curvou diante dele[b]. E lhe perguntou: “O que meu senhor tem a dizer ao seu servo?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nenhum dos dois; vim agora como comandante do exército de Yahweh”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo hebraico também pode ser traduzido por “o adorou”. Aqui, “se curvou diante dele” preserva o gesto sem determinar, somente com base neste versículo, a identidade da figura nem a natureza exata do ato.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: Não
  rationale: Responde diretamente à pergunta anterior de Josué. A possibilidade contextual de significar “Nenhum dos dois” é preservada em nota.
- source_word: כִּי
  choice: pelo contrário
  rationale: Após a negação, introduz uma correção ou contraposição; esta expressão comunica esse valor com naturalidade em português.
- source_word: שַׂר
  choice: comandante
  rationale: No contexto militar de צְבָא, “comandante” é claro, atual e mais preciso do que “príncipe” ou o tradicional “capitão”.
- source_word: צְבָא יְהוָה
  choice: exército de Yahweh
  rationale: Preserva o sentido militar concreto de צָבָא e verte o tetragrama pelo nome pessoal “Yahweh”.
- source_word: עַתָּה בָאתִי
  choice: vim agora
  rationale: O perfeito hebraico descreve a chegada já realizada; o pretérito perfeito é a forma mais natural em português, mantendo o advérbio temporal.
- source_word: אֶל פָּנָיו אַרְצָה
  choice: com o rosto em terra
  rationale: Expressa de modo natural a postura física de prostração indicada pelo idioma hebraico.
- source_word: וַיִּשְׁתָּחוּ
  choice: se curvou diante dele
  rationale: Preserva o gesto de reverência sem decidir se, neste versículo, ele deve ser entendido especificamente como adoração.
- source_word: אֲדֹנִי
  choice: meu senhor
  rationale: Reproduz o tratamento respeitoso com sufixo de primeira pessoa; a inicial minúscula evita identificar além do que o versículo declara.
- source_word: מְדַבֵּר אֶל עַבְדּוֹ
  choice: tem a dizer ao seu servo
  rationale: Formulação idiomática em português para a pergunta imediata de Josué, preservando sua autodesignação humilde como servo.
theological_decisions:
- issue: Se o gesto de Josué deve ser traduzido explicitamente como adoração
  choice: “se curvou diante dele” no texto principal
  alternative: “o adorou”
  rationale: O verbo שׁחה pode indicar tanto inclinação reverente quanto adoração. A tradução mantém o ato visível sem resolver antecipadamente a identidade da figura ou a natureza teológica exata do gesto.
- issue: Se a figura deve ser identificada como angelical ou como manifestação divina
  choice: Identificá-la apenas pelo título hebraico “comandante do exército de Yahweh”
  alternative: Empregar linguagem que a identifique como anjo, teofania ou cristofania
  rationale: O versículo fornece o título da figura, mas não define explicitamente sua natureza. A tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Yahweh” preserva o nome divino; “comandante” e “exército” mantêm a imagem militar. A pergunta final foi formulada de maneira idiomática sem perder a relação senhor-servo.
