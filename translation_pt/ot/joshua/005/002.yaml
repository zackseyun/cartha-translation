source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: pt
  text: 'Naquele tempo, Yahweh disse a Josué: “Faça para si facas de sílex e torne a circuncidar os filhos de Israel, pela segunda vez[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pela segunda vez” significa realizar novamente a circuncisão entre Israel como povo; não quer dizer que os mesmos indivíduos seriam circuncidados duas vezes.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal narrativa corrente, natural em português e fiel ao hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עֲשֵׂה לְךָ
  choice: Faça para você
  rationale: Preserva o imperativo e o dativo de interesse, indicando que Josué deve providenciar os instrumentos.
- source_word: חַרְבוֹת צֻרִים
  choice: facas de sílex
  rationale: No contexto da circuncisão, חַרְבוֹת designa instrumentos cortantes; צֻרִים especifica que são feitos de sílex.
- source_word: וְשׁוּב מֹל
  choice: e volte a circuncidar
  rationale: Reproduz a construção hebraica em que שׁוּב, seguido do imperativo, marca a repetição da ação.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma masculina do hebraico, pertinente porque a circuncisão é realizada nos homens, sem reduzir a expressão ao coletivo mais geral 'israelitas'.
- source_word: שֵׁנִית
  choice: pela segunda vez
  rationale: Conserva a indicação explícita de uma segunda ocorrência, mesmo após a construção verbal que já comunica repetição.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração preserva essa característica sem convertê-lo em título.
- issue: Sentido da repetição em וְשׁוּב ... שֵׁנִית
  choice: volte a circuncidar ... pela segunda vez
  alternative: circuncide novamente
  rationale: Mantém os dois sinais de repetição presentes no hebraico e deixa que o contexto determine o alcance coletivo; não afirma que os mesmos indivíduos seriam circuncidados duas vezes.
- issue: Referente de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A forma masculina é relevante no contexto imediato da circuncisão e preserva a expressão hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição intencional do hebraico sem explicar em excesso no corpo do versículo.
