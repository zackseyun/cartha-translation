  text: וַ/יְהִ֛י כַּ/אֲשֶׁר תַּ֥מּוּ כָל הַ/גּ֖וֹי לְ/הִמּ֑וֹל וַ/יֵּשְׁב֥וּ תַחְתָּ֛/ם בַּֽ/מַּחֲנֶ֖ה עַ֥ד חֲיוֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: pt
  text: Quando toda a nação acabou de ser circuncidada, todos permaneceram em seus lugares no acampamento até se recuperarem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até sararem” ou “até recobrarem as forças”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz uma oração temporal; “Quando” comunica a sequência com naturalidade em português, sem reproduzir de modo rígido o elemento formulaico.
- source_word: תַּמּוּ
  choice: acabou
  rationale: O verbo indica conclusão. Com o sujeito coletivo singular “toda a nação”, “acabou” expressa de maneira idiomática que o processo foi completado.
- source_word: כָל הַגּוֹי
  choice: toda a nação
  rationale: Preserva o singular coletivo do hebraico e a referência corporativa a Israel, sem explicitar elementos que não constam do texto.
- source_word: לְהִמּוֹל
  choice: de ser circuncidada
  rationale: Mantém o sentido passivo do infinitivo hebraico e forma uma construção natural com “acabou”.
- source_word: וַיֵּשְׁבוּ
  choice: todos permaneceram
  rationale: Neste contexto, o verbo descreve a permanência durante a recuperação, não necessariamente a postura de estar sentado. “Todos” retoma naturalmente os integrantes da nação e preserva o verbo hebraico no plural.
- source_word: תַחְתָּם
  choice: em seus lugares
  rationale: A expressão idiomática indica que ficaram onde estavam; a tradução evita o sentido espacial inadequado de “debaixo deles”.
- source_word: בַּמַּחֲנֶה
  choice: no acampamento
  rationale: Tradução locativa direta e corrente da expressão hebraica.
- source_word: עַד חֲיוֹתָם
  choice: até se recuperarem
  rationale: No contexto posterior à circuncisão, חיה descreve a restauração da saúde ou das forças. “Recuperarem” é claro e natural, enquanto a nota conserva alternativas possíveis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém o referente coletivo “toda a nação”, usa “todos” para acompanhar o plural hebraico na oração principal e posiciona a nota junto à expressão lexical a que ela se refere.
