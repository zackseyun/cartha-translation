base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: pt
  text: 'E comeram do produto da terra[a] no dia seguinte à Páscoa: pães sem fermento e grãos tostados[b], naquele mesmo dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do produto antigo da terra”. O termo hebraico pode designar o produto ou rendimento da terra; alguns entendem que o contexto se refere a mantimentos guardados da colheita anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “cereal torrado”. O hebraico se refere a grãos preparados por tostagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: E comeram
  rationale: O wayyiqtol de אכל dá sequência à narrativa; “E comeram” preserva esse fluxo sem acrescentar uma nuance temporal não explícita.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: do produto da terra
  rationale: עֲבוּר designa aqui o produto ou rendimento da terra. “Produto da terra” é natural e mantém a possível relação com mantimentos da colheita anterior sem inserir “antigo” no texto principal.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: no dia seguinte à Páscoa
  rationale: A expressão preposicional indica o dia posterior à Páscoa; esta formulação é clara e corrente em português.
- source_word: מַצּוֹת
  choice: pães sem fermento
  rationale: Equivalente claro e tradicional no contexto pascal, compreensível a leitores modernos.
- source_word: וְקָלוּי
  choice: e grãos tostados
  rationale: קָלוּי refere-se a cereal preparado pelo calor, isto é, tostado; “grãos tostados” comunica o sentido de modo imediato.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: naquele mesmo dia
  rationale: A expressão idiomática enfatiza a exatidão do dia. Em narrativa portuguesa retrospectiva, “naquele mesmo dia” soa natural, preservando a ênfase sem o artificialismo de uma reprodução dêitica literal.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi mantida próxima do hebraico, mas com sintaxe portuguesa natural. A distinção interpretativa sobre עֲבוּר é preservada em nota.
