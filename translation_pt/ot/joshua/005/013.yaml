  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: pt
  text: 'E aconteceu que, estando Josué junto a Jericó[a], ele levantou os olhos e olhou, e eis que um homem estava em pé diante dele, com a espada desembainhada na mão. Josué foi até ele e lhe perguntou: “Você está do nosso lado ou do lado dos nossos inimigos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Jericó” ou “perto de Jericó”. A preposição hebraica pode indicar localização de forma mais ampla, sem precisar se Josué estava dentro da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa hebraica sem recorrer ao arcaísmo «e sucedeu que».
- source_word: בִּהְיוֹת
  choice: estando
  rationale: O infinitivo construto com בְּ introduz a circunstância temporal; «estando» é conciso e natural na narrativa.
- source_word: בִּירִיחוֹ
  choice: junto a Jericó
  rationale: A preposição בְּ pode indicar localização de maneira ampla. «Junto a» evita afirmar que Josué já estivesse dentro da cidade, sem excluir a amplitude do hebraico.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: ele levantou os olhos e olhou
  rationale: Preserva as duas ações e a vivacidade do idioma hebraico, em vez de condensá-las simplesmente em «olhou para cima».
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Reproduz o marcador que chama a atenção para uma aparição súbita ou marcante, em registro bíblico ainda compreensível.
- source_word: אִישׁ
  choice: um homem
  rationale: Traduz o termo sem antecipar a identidade da figura nem acrescentar «guerreiro» ou «anjo».
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: estava em pé diante dele
  rationale: Expressa a posição frontal da figura de modo natural; o contexto e a espada preservam o caráter potencialmente confrontador.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: com a espada desembainhada na mão
  rationale: «Desembainhada» transmite com precisão que a espada havia sido tirada da bainha e estava pronta na mão.
- source_word: וַיֵּלֶךְ יְהוֹשֻׁעַ אֵלָיו
  choice: Josué foi até ele
  rationale: Representa diretamente o movimento de Josué em direção ao homem, sem acrescentar nuances não expressas.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: Você está do nosso lado ou do lado dos nossos inimigos?
  rationale: Explicita naturalmente em português a pergunta sobre lealdade indicada por לְ, mantendo o contraste militar.
theological_decisions:
- issue: Identidade do homem encontrado por Josué
  choice: Traduzir de modo neutro como «um homem»
  alternative: Identificá-lo como mensageiro angelical, anjo do SENHOR ou manifestação divina/cristofânica
  rationale: Este versículo o apresenta apenas como אִישׁ, «homem». A tradução não deve resolver antecipadamente a identidade que o contexto posterior convida o leitor a considerar.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com boa legibilidade brasileira. Mantém-se «e eis que» para conservar a vivacidade narrativa do hebraico; «você» oferece naturalidade internacional com forte legibilidade no Brasil, sem tornar a fala informal.
