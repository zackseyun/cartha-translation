source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: pt
  text: E aconteceu que, quando todos os reis dos amorreus que estavam do outro lado do Jordão, a oeste, e todos os reis dos cananeus que estavam junto ao mar[a] ouviram que Yahweh havia secado as águas do Jordão diante dos filhos de Israel até que nós tivéssemos atravessado[b], o coração deles se derreteu, e já não havia neles ânimo[c] algum por causa dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que estavam na costa”; “junto ao mar” se refere à região costeira.'
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos e versões antigas trazem “até que eles tivessem atravessado” em vez de “até que nós tivéssemos atravessado”.
    reason: textual_variant
  - marker: c
    text: 'Hebraico: “já não havia neles espírito algum”, expressão que indica perda de coragem ou determinação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Quando ... ouviram
  rationale: A construção introduz a circunstância temporal da nova cena. Em português, “Quando ... ouviram” transmite naturalmente a função narrativa sem exigir a fórmula mais pesada “E aconteceu que”.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי
  choice: todos os reis dos amorreus
  rationale: Representa diretamente a construção coletiva plural e conserva a designação étnica.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: do outro lado do Jordão, a oeste
  rationale: עֵבֶר indica o outro lado, e יָמָּה dá a orientação para o oeste ou em direção ao mar.
- source_word: כָּל מַלְכֵי הַכְּנַעֲנִי אֲשֶׁר עַל הַיָּם
  choice: todos os reis dos cananeus que estavam junto ao mar
  rationale: Mantém de perto a imagem hebraica; a nota esclarece que se trata da região costeira.
- source_word: הוֹבִישׁ
  choice: havia secado
  rationale: O hifil de יבש significa causar a secagem. O mais-que-perfeito composto situa o ato antes de os reis receberem a notícia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִפְּנֵי בְנֵי יִשְׂרָאֵל
  choice: diante dos filhos de Israel
  rationale: Preserva tanto o sentido espacial de מִפְּנֵי quanto a expressão nacional e familiar בְנֵי יִשְׂרָאֵל.
- source_word: עַד עברנו
  choice: até que nós tivéssemos atravessado
  rationale: Conserva na linha principal a primeira pessoa do texto consonantal massorético; a leitura em terceira pessoa é registrada em nota.
- source_word: וַיִּמַּס לְבָבָם
  choice: o coração deles se derreteu
  rationale: Mantém o singular coletivo לְבָבָם e a metáfora hebraica de medo e perda de coragem.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: já não havia neles ânimo algum
  rationale: Neste contexto, רוּחַ denota coragem ou força interior. “Ânimo” comunica o sentido idiomático em português sem apagar totalmente a ideia de disposição interior.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” conserva o nome pessoal, sem substituí-lo por um título.
- issue: Designação nacional בְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; descendentes de Israel
  rationale: A escolha preserva a forma familiar-nacional masculina do original sem neutralizá-la.
- issue: Pessoa verbal em עַד עברנו
  choice: até que nós tivéssemos atravessado
  alternative: até que eles tivessem atravessado
  rationale: A primeira pessoa é mantida por refletir a forma consonantal massorética, enquanto a terceira pessoa, coerente com o contexto narrativo e atestada em tradições textuais, aparece em nota para preservar a tensão textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi aliviada sem apagar a geografia, a metáfora do coração que se derrete, o nome divino ou a variante textual. Todos os marcadores de nota aparecem no texto junto ao trecho pertinente.
