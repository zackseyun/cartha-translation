base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: pt
  text: 'Então o comandante do exército de Yahweh[a] disse a Josué: “Tire a sandália do seu pé[b], pois o lugar onde você está em pé é santo.” E Josué fez assim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o comandante do exército de Yahweh” ou “o comandante das hostes de Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico está no singular: “a sandália... o pé”. Compare a formulação plural mais conhecida em Êxodo 3:5.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: comandante
  rationale: No contexto militar de צְבָא, “comandante” expressa com clareza atual a função de liderança, sem a possível ambiguidade de “príncipe” nem o tom histórico mais restrito de “capitão”.
- source_word: צְבָא יְהוָה
  choice: exército de Yahweh
  rationale: צָבָא designa aqui um exército ou hoste; “exército” é claro e preserva o sentido militar, enquanto יְהוָה é transliterado como “Yahweh”, o nome divino.
- source_word: שַׁל
  choice: Tire
  rationale: O imperativo ordena a retirada do calçado. “Tire” é direto, natural e atual em português.
- source_word: נַעַלְךָ
  choice: a sandália
  rationale: Mantém o singular hebraico e representa adequadamente o tipo de calçado do contexto antigo.
- source_word: מֵעַל רַגְלְךָ
  choice: do pé
  rationale: Preserva o singular incomum do hebraico em vez de harmonizá-lo com a conhecida formulação plural de Êxodo 3:5.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  choice: o lugar em que você está
  rationale: Formulação portuguesa natural que comunica a posição contínua indicada pelo particípio e evita o redundante “está em pé sobre ele”.
- source_word: קֹדֶשׁ הוּא
  choice: é santo
  rationale: “Santo” é a correspondência bíblica consagrada de קֹדֶשׁ e mantém seu peso teológico.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: E Josué fez assim
  rationale: Reproduz de maneira simples e digna a fórmula narrativa que registra a obediência de Josué.
theological_decisions:
- issue: Identidade e condição do שַׂר צְבָא יְהוָה
  choice: Traduzir descritivamente como “o comandante do exército de Yahweh”
  alternative: Identificá-lo como comandante angélico, manifestação de Yahweh ou aparição pré-encarnada de Cristo
  rationale: O versículo fornece o título do personagem e relata sua ordem, mas não define explicitamente sua identidade além disso. A tradução preserva essa tensão teológica sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O nome divino é apresentado como “Yahweh”. O tratamento “você” mantém naturalidade contemporânea sem perder a solenidade. Os singulares hebraicos “sandália” e “pé” foram preservados.
