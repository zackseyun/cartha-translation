    reason: Preserva a construção temporal hebraica sem criar a impressão de que os nascidos no deserto foram os que saíram do Egito.
  revision_rationale: A revisão conserva o sentido contextual de que os nascidos durante a peregrinação no deserto não foram circuncidados, mas elimina a ambiguidade de antecedente criada por «depois que saíram». Também ajusta a nota para apresentar a alternativa formal de maneira transparente e fiel à expressão hebraica.
