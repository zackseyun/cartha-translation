source:
  edition: WLC
  text: כִּֽי מֻלִ֣ים הָי֔וּ כָּל הָ/עָ֖ם הַ/יֹּֽצְאִ֑ים וְ/כָל הָ֠/עָם הַ/יִּלֹּדִ֨ים בַּ/מִּדְבָּ֥ר בַּ/דֶּ֛רֶךְ בְּ/צֵאתָ֥/ם מִ/מִּצְרַ֖יִם לֹא מָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: pt
  text: Pois todo o povo que saiu tinha sido circuncidado, mas todos os nascidos no deserto, ao longo da jornada após a saída do Egito,[a] não tinham sido circuncidados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “ao longo do caminho, por ocasião de sua saída do Egito”. No contexto, a expressão se refere à jornada posterior ao êxodo.'
    reason: Preserva a construção temporal hebraica sem criar a impressão de que os nascidos no deserto foram os que saíram do Egito.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação da afirmação anterior e mantém a ligação discursiva natural em português.
- source_word: מֻלִים הָיוּ
  choice: tinham sido circuncidados
  rationale: O particípio passivo com היה descreve um estado anterior; o mais-que-perfeito composto comunica claramente essa anterioridade.
- source_word: כָּל הָעָם
  choice: todo o povo / todos os que
  rationale: עם é coletivo. A primeira ocorrência admite naturalmente «todo o povo»; na segunda, «todos os que» evita a construção pouco idiomática «todo o povo nascido» sem acrescentar a palavra «homens», ausente do hebraico.
- source_word: הַיֹּצְאִים
  choice: que havia saído
  rationale: O particípio substantivado identifica a geração do êxodo; a forma verbal portuguesa é natural no relato retrospectivo.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: mas todos os que nasceram
  rationale: O וְ estabelece aqui contraste entre a geração que saiu e a geração nascida no deserto; «mas» explicita esse valor natural em português.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: «Deserto» é a designação corrente e amplamente compreensível para o cenário do êxodo, abrangendo a região erma indicada por מִדְבָּר.
- source_word: בַּדֶּרֶךְ
  choice: durante a jornada
  rationale: Expressa o percurso ou período de viagem, evitando que «no caminho» seja entendido apenas como localização física.
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: depois que saíram do Egito
  rationale: No contexto, situa os nascimentos no período da jornada posterior à saída do Egito. Uma nota conserva a formulação mais estritamente formal e sua possível amplitude temporal.
- source_word: לֹא מָלוּ
  choice: não tinham sido circuncidados
  rationale: Embora o hebraico use verbo ativo sem agente expresso, o passivo português mantém o foco nos nascidos no deserto e no estado deles no momento narrado.
theological_decisions:
- issue: Referência coletiva e aplicação masculina da circuncisão
  choice: Manter a linguagem coletiva do hebraico («povo», «todos os que»).
  alternative: Traduzir como «todos os homens».
  rationale: O rito se aplica aos do sexo masculino, mas o substantivo hebraico é coletivo e não traz aqui o termo específico para «homens»; a tradução não deve estreitar silenciosamente a formulação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil e compreensíveis internacionalmente. O paralelismo entre a geração que saiu e a geração nascida no deserto foi preservado; evitou-se linguagem denominacional ou explicação teológica não expressa no versículo.
