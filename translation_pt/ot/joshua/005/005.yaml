revisions:
- from: Pois todo o povo que havia saído tinha sido circuncidado, mas todos os que nasceram no deserto, durante a jornada depois que saíram do Egito,[a] não tinham sido circuncidados.
  to: Pois todo o povo que saiu tinha sido circuncidado, mas todos os nascidos no deserto, ao longo da jornada após a saída do Egito,[a] não tinham sido circuncidados.
  rationale: A revisão conserva o sentido contextual de que os nascidos durante a peregrinação no deserto não foram circuncidados, mas elimina a ambiguidade de antecedente criada por «depois que saíram». Também ajusta a nota para apresentar a alternativa formal de maneira transparente e fiel à expressão hebraica.
