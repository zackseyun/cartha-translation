  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: pt
  text: 'E Javé disse a Josué: “Hoje retirei de sobre vocês a desonra do Egito[a]”. Por isso, aquele lugar recebeu o nome de Gilgal[b], até o dia de hoje.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vergonha do Egito”. A expressão pode indicar a vergonha do passado de Israel no Egito, a desonra lançada pelo Egito sobre Israel ou uma desonra ligada à aliança que agora foi removida.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “Gilgal” soa de modo semelhante ao verbo que significa “rolar”, usado na declaração de Javé; há um jogo de palavras.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa amplamente reconhecida do nome divino, em vez de substituí-lo por um título.
- source_word: גַּלּוֹתִי
  choice: fiz rolar para longe
  rationale: Preserva a imagem concreta do verbo גלל e prepara o jogo sonoro com o nome Gilgal, sem reduzir o sentido ao simples verbo “remover”.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: a desonra do Egito
  rationale: “Desonra” comunica vergonha e reprovação social; a construção “do Egito” mantém aberta a relação do genitivo hebraico.
- source_word: מֵעֲלֵיכֶם
  choice: para longe de vocês
  rationale: Expressa a retirada de algo que pesava sobre o povo, em português natural, em combinação com “fiz rolar”.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: Por isso, aquele lugar recebeu o nome de Gilgal
  rationale: A formulação passiva é idiomática em português e evita especificar o sujeito implícito do verbo hebraico; “Por isso” explicita a consequência narrativa indicada pelo contexto e pelo jogo de palavras.
- source_word: גִּלְגָּל
  choice: Gilgal
  rationale: Mantém a transliteração tradicional do topônimo e permite explicar sua relação sonora com o verbo hebraico.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Reproduz de modo natural a fórmula temporal e a perspectiva do narrador.
theological_decisions:
- issue: Sentido de “a desonra do Egito”
  choice: A expressão foi mantida ampla, sem definir em que consistia a desonra nem quem a atribuía.
  alternative: Interpretá-la especificamente como a vergonha da escravidão, a zombaria dos egípcios ou a desonra ligada à incircuncisão de Israel.
  rationale: O hebraico não resolve a relação exata da expressão nem identifica explicitamente seu referente; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português contemporâneo, claro e digno, com legibilidade brasileira e compreensão internacional. “Fiz rolar para longe” conserva deliberadamente a imagem hebraica; “recebeu o nome” evita uma construção de nomeação pouco natural em português.
