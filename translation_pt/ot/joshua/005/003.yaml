  yaml_path: translation/ot/joshua/005/003.yaml
  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: pt
  text: Assim, Josué fez para si facas de sílex[a] e circuncidou os filhos de Israel[b] em Gibeate-Haaralote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lâminas de sílex”. A palavra hebraica traduzida como “facas” geralmente significa “espadas”, mas aqui se refere a instrumentos cortantes usados na circuncisão.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “filhos de Israel”; muitas traduções dizem “israelitas”.'
    reason: lexical_alternative
  - marker: c
    text: O nome hebraico Gibeate-Haaralote significa “Colina dos Prepúcios”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: fez para si
  rationale: Preserva o sentido simples de עשה e a referência reflexiva de לוֹ, em português natural.
- source_word: חַרְבוֹת צֻרִים
  choice: facas de pedra
  rationale: Embora חֶרֶב normalmente designe espada ou lâmina, o contexto requer instrumentos cortantes; צֻרִים indica pedra dura, provavelmente sílex. “Facas de pedra” é claro sem impor uma identificação mineral excessivamente específica.
- source_word: וַיָּמָל
  choice: circuncidou
  rationale: O verbo מול significa diretamente “circuncidar”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de modo formal e inteligível a expressão hebraica, explicitamente masculina no contexto da circuncisão.
- source_word: אֶל גִּבְעַת הָעֲרָלוֹת
  choice: em Gibeate-Haaralote
  rationale: אֶל indica aqui o local da ação. A transliteração conserva o topônimo hebraico, enquanto a nota fornece seu significado transparente.
