base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: pt
  text: Então o maná cessou no dia seguinte, depois que comeram dos produtos da terra.[a] Os filhos de Israel[b] não tiveram mais maná e, naquele ano, comeram da colheita da terra de Canaã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos mantimentos da terra”. O termo hebraico pode referir-se mais especificamente aos produtos armazenados da colheita do ano anterior.'
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Israel” traduz mais literalmente o hebraico; a expressão coletiva também pode ser traduzida por “israelitas” ou “povo de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: cessou
  rationale: O verbo שׁבת indica aqui que o suprimento de maná chegou ao fim, não a observância do sábado; “cessou” é conciso e digno.
- source_word: הַמָּן / מָן
  choice: o maná / maná
  rationale: “Maná” é a designação consagrada em português; o artigo é expresso na primeira ocorrência e omitido naturalmente após “mais” na segunda.
- source_word: מִמָּחֳרָת
  choice: no dia seguinte
  rationale: A expressão temporal indica o dia posterior ao acontecimento anterior e se integra naturalmente à sequência narrativa.
- source_word: בְּאָכְלָם
  choice: depois que comeram
  rationale: O infinitivo com בְּ e sufixo tem valor temporal; o contexto favorece a sequência em que o maná cessou após comerem dos produtos da terra.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: dos produtos da terra
  rationale: עֲבוּר designa os produtos agrícolas da terra. O plural “produtos” soa natural em português e não impõe a interpretação mais específica de mantimentos da colheita anterior, registrada em nota.
- source_word: וְלֹא הָיָה עוֹד
  choice: não tiveram mais
  rationale: Esta formulação portuguesa expressa de modo natural que o maná já não estava disponível para eles, sem alterar o sentido existencial da construção hebraica.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: Os filhos de Israel
  rationale: Mantém de forma transparente a expressão hebraica tradicional, cujo referente coletivo é esclarecido em nota.
- source_word: וַיֹּאכְלוּ
  choice: e ... comeram
  rationale: O passado simples reproduz adequadamente a progressão narrativa do wayyiqtol.
- source_word: מִתְּבוּאַת
  choice: da colheita
  rationale: תְּבוּאָה refere-se ao produto ou rendimento agrícola; “colheita” distingue naturalmente este termo do עֲבוּר anterior.
- source_word: אֶרֶץ כְּנַעַן
  choice: a terra de Canaã
  rationale: Preserva a expressão geográfica completa do hebraico.
- source_word: בַּשָּׁנָה הַהִיא
  choice: naquele ano
  rationale: É a formulação corrente e exata para a expressão temporal hebraica.
