revisions:
- from: Pois os filhos de Israel caminharam pelo deserto durante quarenta anos, até que chegou ao fim toda a nação — os homens de guerra que haviam saído do Egito —, porque não deram ouvidos à voz de Yahweh. Yahweh lhes havia jurado que não os deixaria ver a terra que havia jurado aos seus antepassados dar a nós[a], uma terra que mana leite e mel.
  to: Pois os filhos de Israel caminharam pelo deserto durante quarenta anos, até que toda a nação — os homens de guerra que haviam saído do Egito — chegasse ao fim, porque não deram ouvidos à voz de Yahweh. Yahweh lhes havia jurado que não os deixaria ver a terra que havia jurado aos antepassados deles dar a nós[a], uma terra que mana leite e mel.
  rationale: 'A revisão é estilística e sintática: melhora a fluência da oração temporal e esclarece o referente de “antepassados”, preservando integralmente as escolhas textuais relevantes, inclusive a primeira pessoa plural do Texto Massorético e sua nota de variante.'
