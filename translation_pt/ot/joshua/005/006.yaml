source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: pt
  text: Pois os filhos de Israel caminharam pelo deserto durante quarenta anos, até que toda a nação — os homens de guerra que haviam saído do Egito — chegasse ao fim, porque não deram ouvidos à voz de Yahweh. Yahweh lhes havia jurado que não os deixaria ver a terra que havia jurado aos antepassados deles dar a nós[a], uma terra que mana leite e mel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dar a nós”; algumas versões antigas e traduções trazem “dar a eles”.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do versículo anterior e preserva a relação causal-explicativa com naturalidade em português.
- source_word: הָלְכוּ
  choice: caminharam
  rationale: Mantém a imagem concreta do verbo hebraico, ao mesmo tempo que funciona naturalmente para a peregrinação no deserto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz de modo transparente a expressão hebraica e conserva sua formulação histórica, sem substituí-la pelo termo mais genérico 'israelitas'.
- source_word: בַּמִּדְבָּר
  choice: pelo deserto
  rationale: Em português, 'deserto' é o termo bíblico-geográfico mais corrente para a região da peregrinação; a preposição 'pelo' expressa o movimento dentro desse espaço.
- source_word: עַד תֹּם
  choice: até que chegou ao fim
  rationale: Preserva a ideia de término ou esgotamento sem explicitar além do hebraico a maneira pela qual o grupo desapareceu.
- source_word: כָּל הַגּוֹי
  choice: toda a nação
  rationale: Mantém o valor coletivo de גּוֹי; a aposição seguinte identifica a referência específica aos homens de guerra.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: os homens de guerra
  rationale: Tradução formal e clara da expressão masculina e militar hebraica.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: não deram ouvidos à voz de Yahweh
  rationale: Conserva tanto a metáfora auditiva quanto a implicação de desobediência presente no idioma hebraico.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: lhes havia jurado que não os deixaria ver
  rationale: Expressa naturalmente o conteúdo do juramento e preserva a nuance causativa de 'fazer/deixar ver'.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: uma terra que mana leite e mel
  rationale: Mantém a imagem hebraica tradicional de abundância em linguagem digna e amplamente compreensível.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; 'Yahweh' preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Pronome de primeira pessoa em לָנוּ
  choice: dar a nós
  alternative: dar a eles
  rationale: O Texto Massorético traz inequivocamente a primeira pessoa do plural. A tradução preserva essa forma potencialmente tensa, enquanto a nota registra a variante antiga em terceira pessoa.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade, com sintaxe narrativa natural. A formulação mantém expressões hebraicas relevantes, como 'filhos de Israel', 'voz de Yahweh' e 'mana leite e mel'. O marcador da nota foi colocado junto de 'a nós', que é o ponto efetivamente afetado pela variante textual.
