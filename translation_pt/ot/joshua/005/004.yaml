  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁר מָ֣ל יְהוֹשֻׁ֑עַ כָּל הָ/עָ֣ם הַ/יֹּצֵא֩ מִ/מִּצְרַ֨יִם הַ/זְּכָרִ֜ים כֹּ֣ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה מֵ֤תוּ בַ/מִּדְבָּר֙ בַּ/דֶּ֔רֶךְ בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: pt
  text: 'E esta é a razão pela qual Josué os circuncidou: todo o povo que saiu do Egito — os homens, todos os homens de guerra — morreu no deserto, pelo caminho, depois de sair do Egito.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “E este é o assunto: Josué circuncidou todo o povo que saiu do Egito, os do sexo masculino...”. A expressão hebraica introduz aqui a explicação do ato de Josué.'
    reason: lexical_alternative
  - marker: b
    text: “Homens de guerra” também pode ser traduzido por “combatentes” ou “guerreiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר
  choice: E esta é a razão
  rationale: A expressão hebraica literalmente fala de “assunto” ou “coisa”, mas aqui introduz a explicação do ato de Josué; “razão” comunica naturalmente essa função no contexto.
- source_word: אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: pela qual Josué os circuncidou
  rationale: A construção relativa é elíptica. “Pela qual” explicita seu valor explicativo, e “os” recupera do contexto o objeto do verbo.
- source_word: מָל
  choice: circuncidou
  rationale: Equivalente português corrente e preciso do verbo hebraico.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: todos os homens que haviam saído do Egito
  rationale: Embora הַזְּכָרִים signifique formalmente “os do sexo masculino”, em português “todos os homens” expressa com naturalidade que se trata da parcela masculina do povo e evita a formulação pouco idiomática “todo o povo... os do sexo masculino”.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: todos os homens de guerra
  rationale: Preserva de perto a designação militar hebraica, mantendo uma expressão compreensível e digna em português.
- source_word: מֵתוּ
  choice: morreram
  rationale: O pretérito perfeito é natural na narrativa portuguesa; a anterioridade em relação à circuncisão já fica clara pelo contexto explicativo.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: “Deserto” é a forma mais corrente em português para o cenário da peregrinação de Israel, sem exigir que toda a região seja entendida como arenosa.
- source_word: בַּדֶּרֶךְ
  choice: pelo caminho
  rationale: Reproduz de modo natural a ideia de ocorrência durante o percurso.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: depois de saírem do Egito
  rationale: Expressa a relação temporal da construção infinitiva e a sequência da jornada; “ao saírem” permanece uma possibilidade gramatical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A redação evita a sequência pouco natural “todo o povo..., os do sexo masculino” ao integrar o referente como “todos os homens”, sem perder a delimitação masculina explícita no hebraico.
