  text: the king of Jericho[a], one; the king of Ai, which is beside Bethel, one.
translation:
  language: pt
  text: o rei de Jericó, um; o rei de Ai, que fica ao lado de Betel, um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente português padrão para o governante mencionado; o artigo definido foi incluído em cada item para reproduzir naturalmente a fórmula da lista.
- source_word: יְרִיחוֹ
  choice: Jericó
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: אֶחָד
  choice: um
  rationale: Na fórmula repetitiva de contagem deste capítulo, funciona como conclusão enumerativa. A forma breve preserva o estilo conciso do hebraico, embora 'um rei' esteja implícito.
- source_word: הָעַי
  choice: Ai
  rationale: Forma consagrada do topônimo em português; o artigo presente no hebraico não integra o nome na tradução.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduz naturalmente em português a oração relativa que localiza Ai.
- source_word: מִצַּד
  choice: ao lado de
  rationale: Expressa a relação espacial e a proximidade em relação a Betel sem especificar uma direção não indicada no texto.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
