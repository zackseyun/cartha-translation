source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: pt
  text: 'Moisés, servo de Yahweh, e os filhos de Israel[a] os derrotaram. Depois, Moisés, servo de Yahweh, deu essa terra como herança aos rubenitas, aos gaditas e à meia tribo de Manassés.


    [a] Ou, de modo mais idiomático, “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: Registra a alternativa idiomática para a expressão coletiva hebraica, mantendo no texto principal sua forma mais transparente.
lexical_decisions:
- source_word: עֶבֶד
  choice: servo
  rationale: No título aplicado a Moisés, indica serviço dedicado e condição de comissionado de Yahweh; “servo” é natural e digno em português, sem enfatizar escravidão compulsória.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a forma masculina coletiva do hebraico; a nota oferece a expressão portuguesa mais idiomática, “os israelitas”.
- source_word: הִכּוּם
  choice: os derrotaram
  rationale: Em um resumo militar, נכה pode indicar abater ou derrotar. “Derrotaram” comunica com clareza o resultado da ação sem determinar além do contexto que cada indivíduo tenha sido morto.
- source_word: וַיִּתְּנָהּ
  choice: deu essa terra
  rationale: O sufixo feminino retoma a terra ou região subentendida no contexto. Explicitar “essa terra” evita um pronome ambíguo em português.
- source_word: יְרֻשָּׁה
  choice: como herança
  rationale: Expressa a posse territorial transmitida como patrimônio, preservando a dimensão da herança da terra.
- source_word: לָרֻאוּבֵנִי
  choice: aos rubenitas
  rationale: O gentílico singular hebraico tem sentido coletivo e designa o grupo tribal descendente de Rúben.
- source_word: לַגָּדִי
  choice: aos gaditas
  rationale: O gentílico singular é coletivo no contexto e se refere à tribo descendente de Gade.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: à meia tribo de Manassés
  rationale: Forma corrente e precisa para a parte da tribo de Manassés que recebeu território a leste do Jordão.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz o Tetragrama como nome pessoal. “Yahweh” preserva o nome em transliteração, sem substituí-lo por um título.
- issue: Expressão coletiva masculina בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal mantém a forma explícita do hebraico, enquanto a nota registra a alternativa idiomática sem apagar a formulação da fonte.
- issue: Alcance semântico de הִכּוּם no contexto bélico
  choice: os derrotaram
  alternative: os abateram
  rationale: O verbo pode designar golpear, abater ou derrotar. Neste sumário de conquistas, “derrotaram” preserva o sentido militar sem impor que a frase afirme a morte de todos os referidos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Depois” torna natural a progressão da narrativa; “essa terra” explicita o referente contextual do sufixo feminino hebraico. Os gentílicos seguem formas correntes em português bíblico.
