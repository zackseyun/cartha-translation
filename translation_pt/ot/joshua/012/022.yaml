  rationale: Preserva a fórmula repetitiva de contagem que caracteriza a lista de Josué 12.
- source_word: יָקְנֳעָם
  choice: Jocneão
  rationale: Forma portuguesa tradicional e reconhecível do nome geográfico.
- source_word: לַכַּרְמֶל
  choice: junto ao Carmelo
  rationale: O לְ prefixado pode indicar localização ou associação regional. A expressão mantém essa relação sem identificar de modo excessivamente específico o monte ou a região.
