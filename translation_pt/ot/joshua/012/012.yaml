lexical_decisions:
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente padrão de מֶלֶךְ. O artigo definido foi incluído em português para formar naturalmente a cadeia «o rei de...», embora o hebraico não use aqui um artigo separado.
- source_word: עֶגְלוֹן
  choice: Eglom
  rationale: Forma tradicional e natural em português para o topônimo hebraico עֶגְלוֹן.
- source_word: אֶחָד
  choice: um
  rationale: Neste catálogo de reis derrotados, אֶחָד funciona como contagem. A tradução concisa «um» preserva a estrutura repetitiva e telegráfica do hebraico; «um rei» seria uma explicitação possível.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Transliteração consagrada em português do topônimo hebraico גֶּזֶר.
