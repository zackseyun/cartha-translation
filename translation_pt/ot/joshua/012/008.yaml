  text: בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בָֽ/עֲרָבָה֙ וּ/בָ֣/אֲשֵׁד֔וֹת וּ/בַ/מִּדְבָּ֖ר וּ/בַ/נֶּ֑גֶב הַֽ/חִתִּי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: pt
  text: na região montanhosa, na Sefelá[a], na Arabá[b], nas encostas, no deserto e no Neguebe[c] — os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas terras baixas”. Sefelá é o nome da região de colinas baixas situada entre a região montanhosa de Judá e a planície costeira.
    reason: lexical_alternative
  - marker: b
    text: Arabá é o nome da região da grande depressão; também pode ser traduzido por “planície desértica”.
    reason: lexical_alternative
  - marker: c
    text: Ou “na região sul”. O hebraico Neguebe pode designar tanto essa região meridional como o sul em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: na região montanhosa
  rationale: O substantivo הַר pode indicar monte ou região montanhosa; neste catálogo territorial, o sentido regional é o mais adequado.
- source_word: וּבַשְּׁפֵלָה
  choice: na Sefelá
  rationale: שְׁפֵלָה designa aqui a região de terras baixas e colinas a oeste de Judá. A forma geográfica tradicional evita confundi-la com qualquer planície genérica.
- source_word: וּבָעֲרָבָה
  choice: na Arabá
  rationale: עֲרָבָה funciona como designação da região árida da grande depressão; a transliteração preserva seu valor de nome geográfico.
- source_word: וּבָאֲשֵׁדוֹת
  choice: nas encostas
  rationale: אֲשֵׁדוֹת denota declives ou encostas, sobretudo de montanhas; esta é uma tradução direta e natural.
- source_word: וּבַמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma e pouco habitada, não necessariamente um deserto arenoso; em português, “deserto” é a opção corrente neste contexto geográfico.
- source_word: וּבַנֶּגֶב
  choice: no Neguebe
  rationale: נֶגֶב pode significar “sul” ou designar a região meridional específica; a sequência geográfica favorece o nome regional Neguebe.
- source_word: הַחִתִּי הָאֱמֹרִי וְהַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus
  rationale: Embora estejam morfologicamente no singular, os gentílicos hebraicos têm sentido coletivo; o plural é idiomático em português. Empregam-se as formas bíblicas portuguesas de uso consolidado.
