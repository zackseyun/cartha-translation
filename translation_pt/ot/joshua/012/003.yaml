  source_fidelity: 'A tradução preserva adequadamente a sequência e a estrutura da descrição territorial hebraica: Arabá, mar de Quinerete, mar da Arabá/mar Salgado, Bete-Jesimote e as encostas de Pisga. «A leste» representa bem מִזְרָחָה nas duas ocorrências; «na direção de» comunica de modo seguro o valor direcional de דֶּרֶךְ; e «ao sul, abaixo» mantém a relação espacial concisa de וּמִתֵּימָן תַּחַת.'
