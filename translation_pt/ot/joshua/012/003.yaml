id: JOS.12.3
reference: Joshua 12:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: pt
  text: e a Arabá[a] até o mar de Quinerete, a leste, e até o mar da Arabá, o mar Salgado,[b] a leste, na direção de Bete-Jesimote; e, ao sul, abaixo das encostas de Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a planície”. Aqui, o termo provavelmente designa a região específica do vale tectônico do Jordão, e não uma planície em sentido genérico.
    reason: lexical_alternative
  - marker: b
    text: “O mar da Arabá, o mar Salgado” é o que mais tarde passou a ser comumente chamado de mar Morto.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: a Arabá
  rationale: Mantém o nome geográfico da região do vale tectônico do Jordão, em vez de reduzi-lo ao sentido genérico de “planície”.
- source_word: יָם כִּנְרוֹת
  choice: o mar de Quinerete
  rationale: Preserva o nome hebraico do lago em transliteração portuguesa e a designação “mar” do texto-fonte.
- source_word: מִזְרָחָה
  choice: a leste
  rationale: Expressa de modo conciso o valor direcional ou locativo da forma hebraica, adequado a uma descrição territorial.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: o mar da Arabá, o mar Salgado
  rationale: Conserva a estrutura apositiva hebraica e não substitui o nome bíblico pela designação posterior “mar Morto”.
- source_word: דֶּרֶךְ
  choice: na direção de
  rationale: No contexto de limites territoriais, comunica naturalmente a ideia de rumo sem pressupor que se trate de uma estrada específica.
- source_word: בֵּית הַיְשִׁמוֹת
  choice: Bete-Jesimote
  rationale: Translitera o topônimo em forma adaptada à ortografia e à leitura em português.
- source_word: וּמִתֵּימָן
  choice: e, ao sul
  rationale: Representa o aspecto meridional da delimitação sem forçar a expressão hebraica a indicar exclusivamente movimento ou ponto de origem.
- source_word: תַּחַת
  choice: abaixo
  rationale: É a forma portuguesa mais natural para a relação topográfica indicada no contexto.
- source_word: אַשְׁדּוֹת הַפִּסְגָּה
  choice: das encostas de Pisga
  rationale: Traduz o relevo como encostas ou declives e trata Pisga como topônimo, omitindo naturalmente o artigo hebraico.
theological_decisions: []
