translation:
  language: pt
  text: o rei de Dor, em Nafate-Dor[a], um; o rei de Goim[b], em Gilgal, um;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na região de Dor” ou “no distrito de Dor”. A expressão hebraica também pode ter sentido topográfico, “nas elevações de Dor”.
    reason: lexical_alternative
  - marker: b
    text: A palavra hebraica geralmente significa “nações” ou “povos”, mas aqui pode ser um nome próprio ou uma designação territorial.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: o rei de
  rationale: Na lista dos reis derrotados, o substantivo introduz cada item em construção com o nome ou território seguinte. O artigo definido é natural em português.
- source_word: דּוֹר
  choice: Dor
  rationale: Nome geográfico, transliterado de forma corrente em português.
- source_word: לְנָפַת דּוֹר
  choice: na região de Dor
  rationale: נָפָה designa aqui uma região ou distrito associado a Dor. Esta tradução comunica o sentido geográfico sem tratar a expressão necessariamente como um nome próprio.
- source_word: אֶחָד
  choice: um
  rationale: Funciona como marcador de contagem após cada rei. A forma breve conserva o estilo enumerativo do hebraico.
- source_word: גּוֹיִם
  choice: Goim
  rationale: Embora normalmente signifique “nações” ou “povos”, neste catálogo pode funcionar como nome próprio ou designação territorial. A transliteração preserva essa ambiguidade.
- source_word: לְגִלְגָּל
  choice: em Gilgal
  rationale: A preposição לְ marca aqui a associação do rei com uma localidade; “em Gilgal” é uma formulação geográfica natural em português.
