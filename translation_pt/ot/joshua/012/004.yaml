  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: pt
  text: e o território de Ogue, rei de Basã, um dos remanescentes dos refains[a], que morava em Astarote e Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gigantes”. O termo hebraico refains pode designar um povo antigo lembrado por sua estatura extraordinária.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: e o território de
  rationale: גְּבוּל pode indicar fronteira, limite, região ou território. Neste resumo das conquistas, refere-se ao domínio territorial de Ogue; a conjunção ו dá continuidade à lista.
- source_word: ע֚וֹג
  choice: Ogue
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio hebraico.
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: rei de Basã
  rationale: A cadeia construta identifica Ogue como rei do território de Basã; empregam-se as formas portuguesas usuais dos nomes bíblicos.
- source_word: מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים
  choice: um dos últimos remanescentes dos refains
  rationale: מִן com יֶתֶר expressa pertencimento ao que restava de um grupo. Esta formulação natural em português comunica que Ogue fazia parte dos sobreviventes, sem sugerir que ele próprio fosse um remanescente coletivo.
- source_word: הָ/רְפָאִ֑ים
  choice: refains
  rationale: Mantém o nome do antigo povo no texto principal, em vez de incorporar a interpretação 'gigantes' à tradução.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: que morava
  rationale: O particípio singular de ישׁב retoma Ogue e indica residência. 'Morava' é corrente e claro em português moderno.
- source_word: בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי
  choice: em Astarote e Edrei
  rationale: Nomes geográficos em suas formas portuguesas usuais. Em português, não é necessário repetir a preposição antes do segundo nome coordenado.
