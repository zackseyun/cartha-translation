  text: וּ֠/מֹשֵׁל בְּ/הַ֨ר חֶרְמ֤וֹן וּ/בְ/סַלְכָה֙ וּ/בְ/כָל הַ/בָּשָׁ֔ן עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּעֲכָתִ֑י וַ/חֲצִי֙ הַ/גִּלְעָ֔ד גְּב֖וּל סִיח֥וֹן מֶֽלֶךְ חֶשְׁבּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: pt
  text: e dominava sobre o monte Hermom[a], sobre Salcá e sobre todo o Basã, até a fronteira dos gesuritas e dos maacatitas, e sobre metade de Gileade, até a fronteira de Seom, rei de Hesbom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que dominava sobre o monte Hermom, Salcá e todo o Basã”. O hebraico usa um particípio que dá continuidade à descrição do versículo anterior.'
    reason: alternativa sintática
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: e dominava
  rationale: O particípio hebraico descreve o domínio contínuo de Ogue e dá prosseguimento sintático à descrição iniciada no versículo anterior. Em português, o imperfeito preserva o valor descritivo sem produzir um gerúndio pouco natural.
- source_word: בְּהַר חֶרְמוֹן
  choice: sobre o monte Hermom
  rationale: Com מֹשֵׁל, a preposição בְּ marca o âmbito do governo; “sobre” expressa naturalmente o domínio territorial.
- source_word: וּבְסַלְכָה
  choice: sobre Salcá
  rationale: Salcá é um topônimo. A repetição de “sobre” explicita em português que a cidade também estava sob o domínio mencionado.
- source_word: וּבְכָל הַבָּשָׁן
  choice: e sobre todo o Basã
  rationale: A expressão designa a totalidade da região governada. O artigo em “todo o Basã” é idiomático em português.
- source_word: עַד גְּבוּל
  choice: até a fronteira
  rationale: A combinação indica o limite ou a extensão de um território.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: dos gesuritas e dos maacatitas
  rationale: Embora cada gentílico esteja no singular morfológico, o plural em português representa naturalmente os povos cujas fronteiras são mencionadas.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: e sobre metade de Gileade
  rationale: A expressão indica a porção de Gileade sob o mesmo domínio; “sobre” é retomado para manter clara a relação com o verbo.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: até a fronteira de Seom, rei de Hesbom
  rationale: A frase delimita essa metade de Gileade pela fronteira do território de Seom; a aposição identifica Seom como rei de Hesbom.
