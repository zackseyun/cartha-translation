- source_word: מֶלֶךְ
  choice: o rei de
  rationale: Na fórmula da lista de conquistas, מֶלֶךְ introduz o governante de cada cidade-Estado. O artigo definido é natural em português e mantém o padrão repetido do capítulo.
- source_word: שִׁמְרוֹן מְראוֹן
  choice: Sinrom-Merom
  rationale: A vocalização e a acentuação massoréticas são geralmente entendidas aqui como um topônimo composto. Essa leitura também corresponde à contagem de dois reis no versículo. O nome é transliterado em forma adequada ao português.
- source_word: אֶחָד
  choice: um
  rationale: Na fórmula de contagem deste capítulo, אֶחָד funciona de modo elíptico, contando cada rei. A forma concisa preserva o ritmo e a estrutura do hebraico.
- source_word: אַכְשָׁף
  choice: Acsafe
  rationale: Topônimo transliterado segundo uma forma bíblica reconhecível e natural em português.
