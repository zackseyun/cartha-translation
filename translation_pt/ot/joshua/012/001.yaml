  to: Estes são os reis da terra que os filhos de Israel[a] derrotaram e de cuja terra tomaram posse além do Jordão, na direção do nascer do sol, desde o uádi do Arnom[c] até o monte Hermom, e toda a Arabá[d] a leste.
  rationale: Substituí a expressão pouco idiomática “na direção do nascente” por “na direção do nascer do sol”, que traduz diretamente מִזְרְחָה הַשָּׁמֶשׁ e é mais clara em português moderno. Retirei “em” antes de “toda a Arabá” para conservar a coordenação da enumeração geográfica hebraica. A nota b continua pertinente, mas seu marcador não deve ser inserido no texto, pois a formulação adotada já corresponde ao conteúdo literal explicado pela nota; as demais âncoras permanecem ligadas aos termos que esclarecem.
