source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: pt
  text: Estes são os reis da terra que os filhos de Israel[a] derrotaram e de cuja terra tomaram posse além do Jordão, na direção do nascer do sol, desde o uádi do Arnom[c] até o monte Hermom, e toda a Arabá[d] a leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”; em hebraico, literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: c
    text: “Uádi” é o leito de um curso de água, muitas vezes sazonal, e também o vale por onde ele corre; também pode ser traduzido como “ribeiro” ou “vale do Arnom”.
    reason: cultural_note
  - marker: d
    text: Ou “planície”. “Arabá” é um termo geográfico específico para a região do vale de rifte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estes são
  rationale: Introduz a nova seção sem acrescentar um advérbio temporal ausente do hebraico; a continuidade narrativa fica implícita no contexto.
- source_word: מַלְכֵי הָאָרֶץ
  choice: os reis da terra
  rationale: Preserva de modo claro e direto a construção hebraica e o sentido territorial amplo.
- source_word: אֲשֶׁר הִכּוּ
  choice: que ... derrotaram
  rationale: No contexto militar, נכה indica golpear ou vencer. “Derrotaram” comunica naturalmente o resultado sem afirmar de forma indevida que cada rei foi morto pessoalmente.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma tradicional e transparente da expressão hebraica; a alternativa idiomática “os israelitas” é registrada em nota.
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: e de cuja terra tomaram posse
  rationale: No relato de conquista, ירשׁ significa tomar e manter posse; a reestruturação relativa evita repetição e conserva a relação entre os reis e seus territórios.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: além do Jordão
  rationale: Equivalente conciso de בְּעֵבֶר; a indicação seguinte esclarece que se trata do lado oriental.
- source_word: מִזְרְחָה הַשָּׁמֶשׁ
  choice: na direção do nascente
  rationale: Preserva a imagem hebraica do nascer do sol e continua compreensível como indicação do leste.
- source_word: מִנַּחַל אַרְנוֹן
  choice: desde o uádi do Arnom
  rationale: נַחַל designa aqui um curso de água e seu vale torrencial; “uádi” conserva a precisão geográfica do terreno.
- source_word: עַד הַר חֶרְמוֹן
  choice: até o monte Hermom
  rationale: Expressa com naturalidade o limite territorial introduzido por עַד.
- source_word: וְכָל הָעֲרָבָה
  choice: e em toda a Arabá
  rationale: Arabá funciona como nome geográfico da região do vale de rifte; a preposição “em” integra o segmento à descrição da terra possuída sem transformar o termo em uma planície genérica.
- source_word: מִזְרָחָה
  choice: a leste
  rationale: Forma portuguesa natural para a indicação adverbial de localização oriental.
theological_decisions: []
