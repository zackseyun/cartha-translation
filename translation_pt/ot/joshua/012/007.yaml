  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: pt
  text: E estes são os reis da terra que Josué e os filhos de Israel[a] derrotaram do outro lado do Jordão, a oeste, desde Baal-Gade, no vale do Líbano, até o monte Halaque, que se eleva em direção a Seir[b]. Josué deu essa terra às tribos de Israel como herança, segundo as suas divisões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “que sobe até Seir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: E estes são
  rationale: Preserva a conjunção hebraica e introduz naturalmente a lista que segue.
- source_word: מַלְכֵי הָאָרֶץ
  choice: os reis da terra
  rationale: Reproduz diretamente a construção hebraica e mantém a linguagem territorial do livro.
- source_word: אֲשֶׁר הִכָּה
  choice: que ... derrotaram
  rationale: No contexto de conquista, נכה indica vencer ou abater em combate; “derrotaram” é claro e natural sem enfraquecer o sentido militar.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: e os filhos de Israel
  rationale: Mantém a expressão masculina literal do hebraico, enquanto a nota registra a alternativa idiomática “os israelitas”.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: do outro lado do Jordão, a oeste
  rationale: Expressa tanto a localização além do Jordão quanto a indicação direcional יָמָּה de maneira natural em português.
- source_word: מִבַּעַל גָּד
  choice: desde Baal-Gade
  rationale: Translitera o topônimo segundo uma forma portuguesa reconhecível e marca o ponto inicial da extensão territorial.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: no vale do Líbano
  rationale: בִּקְעָה designa um vale amplo ou planície; “vale” é corrente e adequado ao contexto geográfico.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: até o monte Halaque
  rationale: Trata a expressão como topônimo, evitando uma tradução descritiva incerta como “monte liso”.
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: que se eleva em direção a Seir
  rationale: Conserva a imagem topográfica e a orientação para Seir sem afirmar necessariamente que o monte chega até esse lugar.
- source_word: וַיִּתְּנָהּ
  choice: Josué deu essa terra
  rationale: O sufixo feminino singular retoma “a terra”; explicitá-la em português evita uma referência pronominal pouco clara.
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: às tribos de Israel
  rationale: É a formulação natural e tradicional para a distribuição tribal da terra.
- source_word: יְרֻשָּׁה כְּמַחְלְקֹתָם
  choice: como herança, segundo as suas divisões
  rationale: “Herança” preserva o sentido de posse territorial concedida, e “segundo as suas divisões” mantém a forma distributiva do hebraico sem especificar além do texto.
theological_decisions: []
