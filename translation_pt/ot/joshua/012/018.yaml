lexical_decisions:
- source_word: מֶלֶךְ
  choice: o rei de
  rationale: No contexto desta lista de vitórias, מֶלֶךְ introduz cada governante derrotado. O artigo definido e a preposição formam uma expressão natural em português e preservam a estrutura repetitiva do hebraico.
- source_word: אֲפֵק
  choice: Afeque
  rationale: Nome próprio de lugar, transliterado segundo a forma tradicional e inteligível em português.
- source_word: אֶחָד
  choice: um
  rationale: Funciona como item de contagem para cada rei. A tradução concisa «um» mantém o estilo enumerativo e lacônico do original.
- source_word: לַשָּׁרוֹן
  choice: de Sarom
  rationale: A forma hebraica contém preposição e artigo diante do nome da região. Em português, «de Sarom» é a maneira natural de designá-la sem acrescentar a interpretação topográfica «planície».
