translation_notes:
  register: Português moderno, digno e claro, com formulação deliberadamente concisa para reproduzir o ritmo da lista. Mantêm-se os nomes tradicionais Afeque e Sarom; não há necessidade de nota, pois o artigo hebraico diante de Sarom não produz em português uma alternativa relevante que afete o sentido.
