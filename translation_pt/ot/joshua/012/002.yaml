  terminology: «Seom», «Hesbom», «Aroer», «Arnom», «Gileade», «Jaboque», «amorreus» e «filhos de Amom» são formas adequadas. «Vale» para נחל é defensável neste contexto, e a nota preserva sua amplitude semântica. A nota sobre «filhos de Amom» está corretamente ancorada em Amom.
