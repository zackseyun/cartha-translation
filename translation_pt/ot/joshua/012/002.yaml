  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: pt
  text: Seom, rei dos amorreus, que morava em Hesbom, governava desde Aroer, situada à margem do vale do Arnom[a], incluindo o meio do vale e metade de Gileade, até o vale do Jaboque, fronteira dos filhos de Amom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico נחל pode designar um vale, um uádi ou o leito de um curso de água; aqui, o Arnom e o Jaboque servem como limites territoriais.
    reason: cultural_note
  - marker: b
    text: Isto é, os amonitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: סִיחוֹן
  choice: Seom
  rationale: Forma portuguesa tradicional e reconhecível do nome hebraico Sihon.
- source_word: הָאֱמֹרִי
  choice: dos amorreus
  rationale: Embora a forma hebraica esteja no singular em aposição a “rei”, o português expressa naturalmente o povo governado no plural.
- source_word: הַיּוֹשֵׁב
  choice: que morava
  rationale: O particípio de ישׁב indica residência; “morava” é natural em português atual e evita o literalismo inadequado “estava sentado”.
- source_word: מֹשֵׁל
  choice: governava
  rationale: O particípio descreve o exercício contínuo de autoridade política sobre o território mencionado.
- source_word: מֵעֲרוֹעֵר
  choice: desde Aroer
  rationale: A preposição מִן assinala o ponto inicial da extensão territorial.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: à margem do vale do Arnom
  rationale: שׂפה significa margem ou borda, e נחל pode designar um vale, uádi ou curso de água; “vale” conserva a dimensão topográfica sem pressupor um rio perene.
- source_word: וְתוֹךְ הַנַּחַל
  choice: e desde o meio do vale
  rationale: תוך indica o meio ou interior. A repetição de “desde”, implícita na sequência territorial, torna a relação sintática clara em português sem eliminar a construção cumulativa do hebraico.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: sobre metade de Gileade
  rationale: A preposição “sobre” retoma o sentido de governar e apresenta essa região como parte do domínio de Seom.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: até o vale do Jaboque
  rationale: עַד marca o limite final, e “vale” traduz נחל de modo coerente com a topografia da passagem.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: fronteira dos filhos de Amom
  rationale: Mantém a construção hebraica literal “filhos de Amom”, compreensível em português, e conserva “fronteira” no contexto territorial.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos em formas usuais. A estrutura territorial do hebraico foi preservada sem tornar a frase excessivamente literal; “vale” mantém aberta a amplitude semântica de נחל, explicada em nota.
