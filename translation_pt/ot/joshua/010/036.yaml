  text: וַ/יַּ֣עַל יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מֵ/עֶגְל֖וֹנָ/ה חֶבְר֑וֹנָ/ה וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/036.yaml
  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: pt
  text: Então Josué e todo o Israel com ele subiram de Eglom para Hebrom e lutaram contra a cidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «contra ela»; o pronome feminino se refere à cidade de Hebrom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiram
  rationale: O verbo עלה expressa movimento para cima. O plural em português acomoda naturalmente Josué e todo o Israel como sujeito composto, preservando o sentido direcional.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Mantém a expressão coletiva hebraica, tradicional e compreensível em português, referindo-se à força israelita que acompanhava Josué.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Tradução direta da preposição com sufixo masculino singular, cujo referente é Josué.
- source_word: מֵעֶגְלוֹנָה
  choice: de Eglom
  rationale: A preposição מִן indica a origem do deslocamento; Eglom é a forma portuguesa corrente do topônimo.
- source_word: חֶבְרוֹנָה
  choice: para Hebrom
  rationale: O ה direcional assinala movimento rumo a Hebrom; «para» comunica o destino de modo natural.
- source_word: וַיִּלָּחֲמוּ
  choice: e lutaram
  rationale: O Niphal de לחם indica entrar em combate ou lutar; a formulação é corrente e adequada ao contexto militar.
- source_word: עָלֶיהָ
  choice: contra a cidade
  rationale: A preposição tem sentido hostil, e o sufixo feminino singular retoma Hebrom enquanto cidade. Explicitar «a cidade» evita uma referência pronominal pouco natural em português sem perder o referente.
