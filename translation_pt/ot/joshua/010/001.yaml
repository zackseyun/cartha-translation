  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: pt
  text: Aconteceu que, quando Adoni-Zedeque, rei de Jerusalém, soube que Josué havia conquistado Ai e a havia consagrado à destruição[a], assim como havia feito com Jericó e seu rei, havia feito o mesmo com Ai e seu rei, e que os habitantes de Gibeão haviam feito paz[b] com Israel e estavam no meio deles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a havia destruído completamente”. O verbo hebraico indica que algo foi destinado à destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “haviam firmado um acordo de paz”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Preserva a fórmula narrativa hebraica sem recorrer ao arcaizante «E sucedeu que».
- source_word: כִשְׁמֹעַ
  choice: quando ... soube
  rationale: A construção com infinitivo e כִּי expressa a circunstância temporal; «quando ... soube» é natural e mantém a relação sintática.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Zedeque
  rationale: Transliteração legível em português que conserva os dois elementos do nome hebraico.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: rei de Jerusalém
  rationale: Reproduz diretamente a relação de construto entre o título e o topônimo.
- source_word: לָכַד
  choice: havia conquistado
  rationale: No contexto militar de uma cidade, «conquistado» comunica sua tomada; o mais-que-perfeito composto situa a ação antes de Adoni-Zedeque receber a notícia.
- source_word: הָעַי
  choice: Ai
  rationale: Forma tradicional e reconhecível do topônimo em português.
- source_word: וַיַּחֲרִימָהּ
  choice: a havia consagrado à destruição
  rationale: Conserva tanto a ideia de destinação sacral quanto seu resultado destrutivo, evitando reduzir חרם a uma simples ação militar.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: fazendo ... o mesmo que
  rationale: Expressa de maneira idiomática a correlação comparativa e preserva o paralelismo entre o tratamento dado a Jericó e a Ai.
- source_word: עָשָׂה לִירִיחוֹ וּלְמַלְכָּהּ
  choice: havia feito com Jericó e seu rei
  rationale: «Fazer com» reproduz o sentido contextual de עשה com ל e permite manter a repetição verbal do hebraico.
- source_word: הִשְׁלִימוּ
  choice: haviam feito paz com
  rationale: O hifil de שלם indica estabelecer relações pacíficas; esta é a expressão corrente e clara em português.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: os habitantes de Gibeão
  rationale: O particípio substantivado designa os moradores da cidade; «habitantes» é atual e preciso.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: e agora estavam no meio deles
  rationale: «No meio deles» preserva a imagem espacial e social de בקרבם; «agora» explicita naturalmente o estado resultante no fluxo narrativo, sem alterar o referente, que é Israel.
theological_decisions:
- issue: Tradução da linguagem de חרם no contexto da conquista
  choice: a havia consagrado à destruição
  alternative: a havia destruído completamente
  rationale: חרם não designa apenas destruição militar, mas a destinação irrevogável de algo à destruição. A formulação escolhida mantém esse peso sacral e judicial sem acrescentar uma interpretação confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas familiares ao leitor brasileiro. Os travessões organizam o longo período hebraico sem transformar o versículo em uma frase independente; a vírgula final preserva sua continuidade sintática com o versículo seguinte. Os marcadores foram colocados junto às expressões que efetivamente explicam.
