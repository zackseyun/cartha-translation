revisions:
- from: Aconteceu que, quando Adoni-Zedeque, rei de Jerusalém, soube que Josué havia conquistado Ai e a havia consagrado à destruição[a] — fazendo com Ai e seu rei o mesmo que havia feito com Jericó e seu rei —, e que os habitantes de Gibeão haviam feito paz[b] com Israel e agora estavam no meio deles,
  to: Aconteceu que, quando Adoni-Zedeque, rei de Jerusalém, soube que Josué havia conquistado Ai e a havia consagrado à destruição[a], assim como havia feito com Jericó e seu rei, havia feito o mesmo com Ai e seu rei, e que os habitantes de Gibeão haviam feito paz[b] com Israel e estavam no meio deles,
  rationale: A revisão elimina o advérbio não expresso «agora», torna explícita a correlação «assim como ... havia feito o mesmo», mais próxima da estrutura כַּאֲשֶׁר ... כֵּן, e ajusta a nota sobre חרם para que explique o termo sem ampliar desnecessariamente sua força no contexto deste versículo. Mantêm-se a continuidade sintática pela vírgula final e os marcadores junto aos termos anotados.
