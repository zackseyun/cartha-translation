base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: pt
  text: E eles a conquistaram naquele dia e a feriram ao fio da espada; Josué consagrou à destruição[b], naquele dia, todas as pessoas que nela estavam[a], assim como havia feito a Laquis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “toda alma que nela estava”. Aqui, “alma” significa cada pessoa presente na cidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “destruiu completamente”. O verbo hebraico indica destinar algo à destruição sob interdição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: eles a conquistaram
  rationale: O verbo לכד, em contexto militar, indica tomar ou capturar uma cidade. “Conquistaram” é natural em português e mantém o sentido militar.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Expressão temporal idiomática que preserva a ênfase de que a tomada e a destruição ocorreram no mesmo dia.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: a feriram ao fio da espada
  rationale: Preserva a imagem hebraica da “boca/parte cortante da espada” numa formulação portuguesa tradicional, inteligível e digna.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: todas as pessoas que nela estavam
  rationale: נֶפֶשׁ designa aqui os seres humanos presentes na cidade, não especificamente a alma imaterial. “Pessoas” comunica o sentido contextual sem implicação antropológica indevida.
- source_word: הֶחֱרִים
  choice: consagrou à destruição
  rationale: O hifil de חרם exprime a imposição do ḥerem, isto é, destinar algo à destruição sob interdição. A escolha retém a dimensão sacral e não reduz o verbo a um simples “destruiu”.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: conforme tudo o que havia feito a Laquis
  rationale: Preserva a correspondência com a ação anterior contra Laquis e usa o mais-que-perfeito composto de modo natural na narrativa portuguesa.
theological_decisions:
- issue: Sentido de חרם/החרים no contexto da conquista
  choice: consagrou à destruição
  alternative: destruiu completamente; colocou sob interdição
  rationale: O verbo possui força técnico-sacral além da destruição física. “Consagrou à destruição” preserva essa tensão sem acrescentar uma interpretação denominacional.
- issue: Sentido de נֶפֶשׁ em referência à população da cidade
  choice: pessoas
  alternative: almas; vidas
  rationale: Neste contexto, נֶפֶשׁ se refere às pessoas vivas na cidade. “Almas” poderia sugerir uma afirmação sobre a constituição humana que o texto não pretende fazer.
- issue: Mudança do sujeito plural para o singular nos verbos הֶחֱרִים e עָשָׂה
  choice: explicitar “Josué” como sujeito singular
  alternative: usar apenas “ele”; uniformizar no plural como “eles”
  rationale: A morfologia hebraica muda deliberadamente do plural (“conquistaram”, “feriram”) para o singular (“consagrou”, “fez”). Explicitar Josué evita um pronome português de antecedente incerto e preserva a mudança gramatical, sem atribuir todos os atos militares somente a ele.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantém-se a mudança hebraica do sujeito plural para o singular; “Josué” é explicitado para evitar ambiguidade pronominal. Os marcadores [a] e [b] aparecem no texto principal.
