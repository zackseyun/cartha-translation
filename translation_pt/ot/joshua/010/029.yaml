  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/מַּקֵּדָ֖ה לִבְנָ֑ה וַ/יִּלָּ֖חֶם עִם לִבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: pt
  text: Então Josué, com todo o Israel, seguiu de Maquedá para Libna e lutou contra Libna.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “lutou com Libna”; nesse contexto, a expressão significa lutar contra a cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: seguiu
  rationale: Neste itinerário militar, o verbo indica a continuação do deslocamento de um lugar para outro. “Seguiu” comunica esse movimento sem sugerir indevidamente a travessia de um rio ou de outra barreira.
- source_word: עִמּוֹ
  choice: com todo o Israel
  rationale: A construção expressa acompanhamento. A formulação mantém Josué como figura principal e apresenta todo o Israel seguindo com ele.
- source_word: מִמַּקֵּדָה
  choice: de Maquedá
  rationale: A preposição marca o ponto de partida; o topônimo é transliterado em forma corrente em português.
- source_word: לִבְנָה
  choice: para Libna
  rationale: No contexto do verbo de movimento, o nome indica o destino. O topônimo é transliterado, não traduzido.
- source_word: וַיִּלָּחֶם
  choice: lutou
  rationale: O verbo no nifal significa combater ou entrar em batalha. “Lutou” é conciso, natural e preserva a ação militar sem acrescentar detalhes.
- source_word: עִם לִבְנָה
  choice: contra Libna
  rationale: Embora עִם normalmente signifique “com”, após o verbo לחם introduz idiomaticamente o adversário. Em português, “contra” comunica com clareza a relação hostil.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluida. A repetição de “Libna” foi preservada por corresponder ao texto hebraico; “todo o Israel” funciona como designação coletiva dos que acompanhavam Josué.
