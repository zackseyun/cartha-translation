base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/016.yaml
  text: But these five kings fled and hid in the cave at Makkedah[a].
translation:
  language: pt
  text: Mas esses cinco reis fugiram e se esconderam na caverna em Maquedá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E esses cinco reis fugiram e se esconderam na caverna em Maquedá.”'
    reason: 'Alternativa discursiva: o waw hebraico pode ser entendido como simples continuação narrativa, «E», em vez de contraste, «Mas».'
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: O verbo נוּס indica fugir diante do perigo; “fugiram” é natural e preserva a ideia de retirada sob ameaça.
- source_word: חֲמֵשֶׁת
  choice: cinco
  rationale: Número cardinal em construção com “reis”, traduzido diretamente.
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: esses cinco reis
  rationale: Mantém a força demonstrativa de הָאֵלֶּה e usa a ordem mais natural em português; “esses” retoma reis já mencionados no contexto.
- source_word: וַיֵּחָבְאוּ
  choice: se esconderam
  rationale: A forma verbal expressa esconder-se; a construção pronominal é clara e corrente em português.
- source_word: בַמְּעָרָה
  choice: na caverna
  rationale: O artigo definido prefixado ao substantivo é preservado, apontando para uma caverna identificável no contexto.
- source_word: בְּמַקֵּדָה
  choice: de Maquedá
  rationale: Na expressão portuguesa “a caverna de Maquedá”, a preposição “de” situa naturalmente a caverna na região ou localidade; o topônimo é transliterado em forma consagrada e legível.
- source_word: וַ
  choice: Mas
  rationale: Embora o waw também possa ser simplesmente continuativo, “Mas” marca de modo natural o contraste narrativo entre o combate anterior e a fuga dos reis.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação mantém o demonstrativo, o artigo definido de “caverna” e a possível nuance contrastiva da conjunção, registrando em nota a leitura continuativa.
