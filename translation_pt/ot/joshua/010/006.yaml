  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: pt
  text: 'Então os homens de Gibeão mandaram esta mensagem a Josué, no acampamento em Gilgal: “Não deixe de apoiar os seus servos.[a] Suba depressa até nós, salve-nos e ajude-nos, pois todos os reis dos amorreus que habitam na região montanhosa se reuniram contra nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Não afrouxe a sua mão para com os seus servos”, expressão que significa “não deixe de nos apoiar” ou “não nos abandone”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: os homens de Gibeão mandaram esta mensagem
  rationale: Mantém a referência masculina aos representantes de Gibeão e expressa de modo natural em português o envio de uma comunicação a Josué.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: a Josué, no acampamento em Gilgal
  rationale: Identifica Josué como destinatário e o acampamento em Gilgal como sua localização; a terminação direcional de גִּלְגָּלָה é representada de maneira idiomática.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: Não deixe de apoiar os seus servos
  rationale: Transmite em português corrente o sentido contextual da expressão hebraica com ‘mão’, isto é, não suspender o apoio nem abandonar; a imagem literal é preservada em nota.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: Suba depressa até nós
  rationale: Preserva tanto a subida topográfica de Gilgal à região montanhosa quanto a urgência do pedido.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: salve-nos e ajude-nos
  rationale: Reproduz os dois pedidos distintos e mantém a amplitude de ישע no contexto de resgate militar, sem acrescentar interpretação teológica.
- source_word: נִקְבְּצוּ אֵלֵינוּ
  choice: se reuniram contra nós
  rationale: O contexto hostil exige que אֶל seja entendido como movimento dirigido contra Gibeão.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: todos os reis dos amorreus que habitam na região montanhosa
  rationale: Mantém a identificação étnica e a localização geográfica dos reis, sem ampliar ‘região montanhosa’ para uma designação territorial mais específica.
theological_decisions:
- issue: Sentido de עֲבָדֶיךָ
  choice: seus servos
  alternative: seus escravos
  rationale: Neste apelo político e pactual, o termo funciona como autodesignação deferente diante de Josué; ‘servos’ comunica esse uso sem impor a ideia específica de escravidão como condição jurídica.
- issue: Amplitude de וְהוֹשִׁיעָה
  choice: salve-nos
  alternative: liberte-nos
  rationale: ‘Salve-nos’ conserva o sentido imediato de resgate do perigo militar e também a amplitude lexical do verbo, sem transformar o pedido em uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem narrativa e a urgência do discurso direto foram preservadas; o principal idiomatismo hebraico foi traduzido pelo sentido no texto e documentado literalmente em nota.
