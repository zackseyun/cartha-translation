  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: pt
  text: “Subam até mim e me ajudem. Vamos atacar Gibeão, pois fez paz com Josué e com os filhos de Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: Subam até mim
  rationale: O imperativo plural de עלה expressa movimento ascendente, geográfico ou militar, na direção do falante; “até mim” traduz naturalmente אֵלַי.
- source_word: וְעִזְרֻנִי
  choice: e venham me ajudar
  rationale: O imperativo plural de עזר com objeto de primeira pessoa é vertido em português corrente; “venham” torna natural a coordenação após “subam”, sem alterar o pedido de auxílio.
- source_word: וְנַכֶּה
  choice: Vamos atacar
  rationale: A forma volitiva na primeira pessoa do plural convida os aliados a uma ação militar conjunta. “Vamos atacar” comunica mais naturalmente esse valor em português do que a formulação literal “firamos”.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeão
  rationale: Forma tradicional e amplamente reconhecida em português para o topônimo hebraico גִּבְעוֹן.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão do pedido e mantém uma ligação causal clara em registro narrativo digno.
- source_word: הִשְׁלִימָה
  choice: fez as pazes
  rationale: O hifil perfeito de שלם, neste contexto diplomático, indica o estabelecimento de relações pacíficas. “Fez as pazes” preserva o sentido básico sem restringi-lo necessariamente a uma aliança formal.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: com Josué e com os filhos de Israel
  rationale: A construção idiomática com הִשְׁלִימָה requer “com” em português. “Filhos de Israel” conserva de modo transparente a expressão hebraica בני ישראל.
theological_decisions:
- issue: Tradução de בני ישראל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A expressão familiar masculina do hebraico é mantida, preservando sua forma e sua ressonância histórico-pactual, embora neste contexto designe coletivamente o povo de Israel.
- issue: Natureza do acordo indicado por הִשְׁלִימָה
  choice: fez as pazes
  alternative: fez uma aliança; submeteu-se
  rationale: O verbo admite uma relação diplomática ou paz de tratado, mas o versículo não exige que a tradução determine de forma mais estreita a natureza política do acordo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala direta mantém a urgência militar. Conserva-se “filhos de Israel” por proximidade ao hebraico, enquanto “vamos atacar” evita o pouco natural “firamos”.
