source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: pt
  text: Naquele dia, Josué tomou Maquedá e a feriu ao fio da espada. Consagrou à destruição[a] o rei e todas as pessoas que nela estavam; não deixou nenhum sobrevivente. Fez ao rei de Maquedá o mesmo que havia feito ao rei de Jericó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruiu completamente”; o verbo hebraico indica dedicar algo à destruição sob o anátema.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: tomou
  rationale: No contexto militar, o verbo indica a tomada de uma cidade. “Tomou” é natural em português e preserva o sentido sem exigir a explicitação “capturou a cidade”.
- source_word: וַיַּכֶּהָ
  choice: a feriu
  rationale: Mantém a força concreta de נכה e o referente feminino, Maquedá, sem substituir o verbo por uma interpretação mais ampla como “derrotou”.
- source_word: לְפִי חֶרֶב
  choice: ao fio da espada
  rationale: Expressão portuguesa tradicional e inteligível que conserva a imagem hebraica da “boca” ou do gume da espada.
- source_word: הֶחֱרִם
  choice: consagrou à destruição
  rationale: Expressa o sentido causativo de colocar sob ḥerem, isto é, destinar ritualmente à destruição, em vez de reduzir o termo a “destruiu”.
- source_word: אוֹתָם
  choice: o rei e todas as pessoas que nela estavam
  rationale: Explicita em português os referentes do pronome plural hebraico, que retoma o rei e as pessoas da cidade.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: todas as pessoas que nela estavam
  rationale: נפש designa aqui pessoas ou vidas, não especificamente a alma imaterial. A formulação é clara e natural.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: não deixou nenhum sobrevivente
  rationale: Reproduz diretamente a ideia de não deixar pessoa alguma que sobrevivesse.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Fez ao rei de Maquedá o mesmo que havia feito ao rei de Jericó
  rationale: Preserva a formulação deliberadamente concisa do hebraico e a comparação narrativa, sem especificar além do texto.
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: Maquedá / Jericó / Josué
  rationale: Emprega as formas portuguesas bíblicas estabelecidas e amplamente reconhecidas.
theological_decisions:
- issue: Tradução de חרם no contexto da conquista
  choice: consagrou à destruição
  alternative: destruiu completamente; colocou sob o anátema
  rationale: 'O verbo envolve mais do que matar ou destruir: indica destinar pessoas ou coisas à destruição sob o ḥerem. A opção mantém a dimensão ritual e teológica sem acrescentar uma interpretação doutrinária particular.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas onomásticas tradicionais. “Ao fio da espada” preserva a imagem do original; “consagrou à destruição” mantém a nuance teológica de חרם. O marcador [a] aparece imediatamente após a expressão explicada.
