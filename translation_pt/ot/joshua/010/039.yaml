  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: pt
  text: E ele a capturou, juntamente com seu rei e todas as suas cidades. E os feriram ao fio da espada e consagraram à destruição[a] todas as pessoas que nela estavam; ele não deixou sobrevivente algum. Assim como havia feito a Hebrom, fez a Debir e ao seu rei, e assim como havia feito a Libna e ao seu rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «destruíram completamente». O hebraico emprega o termo técnico ḥerem, para algo consagrado ou entregue à destruição.'
    reason: Alternativa lexical e explicação concisa do termo técnico חרם.
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: eles a capturaram
  rationale: לכד indica capturar ou tomar em contexto militar. Embora a forma verbal hebraica seja singular, o contexto imediato passa a verbos no plural e apresenta Josué e Israel em ação representativa e coletiva; o plural produz português natural sem eliminar a alternância posterior.
- source_word: כָּל עָרֶיהָ
  choice: todas as cidades que lhe pertenciam
  rationale: עיר pode designar cidade ou povoação. A construção explicita que se trata dos núcleos dependentes de Debir e evita a impressão de que estavam fisicamente dentro dela.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: feriram-nos ao fio da espada
  rationale: Preserva de modo idiomático e reconhecível a imagem hebraica do 'fio' ou 'boca' da espada.
- source_word: וַיַּחֲרִימוּ
  choice: consagraram à destruição
  rationale: 'A expressão conserva o caráter técnico de חרם: algo separado ou entregue para destruição, em vez de reduzir o verbo ao simples ato de destruir.'
- source_word: כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: todas as pessoas que nela estavam
  rationale: נפש refere-se aqui às pessoas ou habitantes, não à alma imaterial.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: ele não deixou sobrevivente algum
  rationale: Mantém o singular do hebraico, provavelmente retomando Josué como líder representativo, e traduz שָׂרִיד pelo sentido contextual de sobrevivente.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה
  choice: Assim como havia feito a Hebrom, fez
  rationale: Conserva a fórmula comparativa e usa o mais-que-perfeito composto para deixar clara a anterioridade da ação contra Hebrom.
- source_word: לִדְבִרָהּ וּלְמַלְכָּהּ
  choice: a Debir e ao seu rei
  rationale: A preposição ל com עשה é representada naturalmente por 'a'; o sufixo feminino remete à cidade e se traduz em português por 'seu'.
theological_decisions:
- issue: Linguagem de guerra ligada a חרם
  choice: consagraram à destruição
  alternative: destruíram completamente
  rationale: A opção escolhida preserva a dimensão técnico-religiosa do termo sem acrescentar ao texto uma explicação doutrinária não expressa no versículo.
- issue: Alternância narrativa entre sujeitos no plural e no singular
  choice: manter o plural nas ações coletivas e o singular em 'ele não deixou' e nas comparações
  alternative: uniformizar todos os verbos no plural
  rationale: O hebraico alterna entre Israel como coletivo e Josué como líder representativo. Preservar essa mudança mantém uma ambiguidade e uma textura reais do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a alternância de número do hebraico em vez de harmonizá-la; 'ao fio da espada' preserva uma imagem bíblica corrente sem soar arcaica em excesso.
