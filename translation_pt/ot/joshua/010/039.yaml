  naturalness: O texto é claro e de registro apropriado. «Todas as cidades que lhe pertenciam» é compreensível, mas «todas as suas cidades» é mais direto, natural e mais próximo do sufixo possessivo hebraico, sem sugerir uma relação de propriedade que o original não explicita.
