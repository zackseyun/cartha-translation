base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: pt
  text: Eles a capturaram e a passaram ao fio da espada, juntamente com seu rei, todas as suas cidades e todas as pessoas que nela estavam. Josué não deixou sobrevivente algum, assim como havia feito com Eglom. Ele a consagrou à destruição[a], juntamente com todas as pessoas que nela estavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destruiu-a completamente”. O hebraico indica que ela foi colocada sob ḥerem, isto é, consagrada à destruição.'
    reason: Alternativa lexical e esclarecimento do termo técnico hebraico.
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Eles a capturaram
  rationale: לכד expressa a captura de uma cidade; “capturaram” conserva com naturalidade o sentido militar.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: a feriram ao fio da espada
  rationale: נכה tem o sentido amplo de ferir ou golpear, e לְפִי חֶרֶב é a expressão idiomática “ao fio da espada”. A formulação mantém a imagem concreta do hebraico sem recorrer a linguagem arcaica.
- source_word: מַלְכָּהּ
  choice: seu rei
  rationale: O sufixo possessivo se refere ao rei da cidade capturada.
- source_word: כָּל עָרֶיהָ
  choice: todas as suas cidades
  rationale: עִיר pode designar cidade ou povoado. “Cidades” oferece correspondência lexical direta e abrange os centros dependentes de Hebrom sem especificação indevida.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: todas as pessoas que nela estavam
  rationale: נֶפֶשׁ designa aqui pessoas ou vidas, não uma alma imaterial. A tradução comunica esse sentido de modo claro e atual.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Josué não deixou sobrevivente algum
  rationale: שָׂרִיד é alguém que sobrevive ou resta. O sujeito singular implícito é explicitado como Josué para tornar clara, em português, a mudança do plural para o singular.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: assim como havia feito com Eglom
  rationale: A expressão introduz uma comparação com a ação anterior contra Eglom; o mais-que-perfeito composto marca naturalmente essa referência retrospectiva.
- source_word: וַיַּחֲרֵם אוֹתָהּ
  choice: Ele a consagrou à destruição
  rationale: חרם no hifil indica colocar algo sob ḥerem, destinando-o à destruição. “Consagrou à destruição” preserva tanto a dimensão de dedicação quanto o resultado destrutivo do termo técnico.
- source_word: וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: juntamente com todas as pessoas que nela estavam
  rationale: A repetição do hebraico é mantida, e “juntamente com” expressa com clareza que os habitantes foram incluídos na mesma ação.
theological_decisions:
- issue: Tradução de חרם no contexto de guerra e juízo
  choice: Ele a consagrou à destruição
  alternative: Ele a destruiu completamente; ele a colocou sob interdição
  rationale: O verbo hebraico tem sentido técnico de dedicação irrevogável à destruição. A escolha conserva essa tensão cultual e militar sem reduzir o termo à simples destruição nem introduzir uma formulação confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se a repetição enfática do original e explicita-se Josué como sujeito da forma verbal singular para evitar ambiguidade após os verbos no plural.
