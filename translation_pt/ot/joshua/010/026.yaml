base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: pt
  text: Depois disso, Josué os golpeou e os matou; pendurou-os em cinco árvores, e eles permaneceram pendurados nas árvores até o entardecer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: os golpeou
  rationale: Mantém o sentido de נכה no hifil e não o confunde com o verbo seguinte, que declara explicitamente a morte.
- source_word: אַחֲרֵי כֵן
  choice: Depois disso
  rationale: Expressão temporal natural que preserva claramente a sequência narrativa.
- source_word: וַיְמִיתֵם
  choice: os matou
  rationale: Expressa com clareza o hifil de מות neste contexto de execução; em português, 'matou' é mais natural que uma reprodução rígida da forma causativa.
- source_word: וַיִּתְלֵם
  choice: os pendurou
  rationale: תלה indica suspender corpos em árvore ou madeira. 'Pendurou' preserva essa ideia sem especificar indevidamente enforcamento ou empalamento.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: em cinco árvores
  rationale: עֵץ significa normalmente 'árvore' ou 'madeira'; 'árvores' conserva o sentido mais direto sem introduzir postes ou forcas.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: ficaram pendurados
  rationale: A construção היה com particípio passivo descreve um estado contínuo; 'ficaram pendurados' comunica naturalmente essa duração.
- source_word: עַד הָעָרֶב
  choice: até a tarde
  rationale: Traduz o limite temporal sem restringi-lo interpretativamente ao instante exato do pôr do sol.
theological_decisions:
- issue: Sentido de עֵץ no contexto de exibição após a execução
  choice: árvores
  alternative: postes de madeira; forcas
  rationale: O texto não identifica um instrumento específico. 'Árvores' preserva a formulação hebraica e evita importar uma técnica de execução não declarada.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A distinção entre golpear e matar foi mantida, e a forma de suspensão não foi especificada além do que o hebraico permite.
