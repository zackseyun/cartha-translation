  source_fidelity: 'O texto traduz com fidelidade as três proposições do hebraico: a imobilização do sol, a parada da lua e a duração extraordinária até que a nação se vingasse dos inimigos. «Ficou imóvel» comunica adequadamente וַיִּדֹּם e a repetição para o sol em וַיַּעֲמֹד preserva o paralelismo narrativo. «Por cerca de um dia inteiro» representa de forma prudente o valor aproximativo/comparativo de כְּיוֹם תָּמִים.'
