  terminology: «Livro de Jasar» é uma transliteração titular consistente e a nota registra apropriadamente as possibilidades semânticas de הַיָּשָׁר. «Nação» preserva o valor coletivo de גּוֹי. O texto evita impor explicações científicas ou doutrinárias ao acontecimento narrado.
