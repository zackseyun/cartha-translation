source:
  edition: WLC
  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: pt
  text: Assim, o sol ficou imóvel[a], e a lua parou, até que a nação tomou vingança de seus inimigos.[b] Isso não está escrito no Livro de Jasar?[c] O sol ficou imóvel no meio do céu e não se apressou a se pôr por cerca de um dia inteiro.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico também pode significar “ficou em silêncio” ou “cessou”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “até que a nação se vingou de seus inimigos”. A expressão hebraica pode transmitir a ideia de vingança ou desforra.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “Livro de Jasar”; possivelmente, “Livro do Justo” ou “Livro do Reto”.'
    reason: alternative_reading
  - marker: d
    text: 'Ou: “como um dia inteiro” ou “quase um dia inteiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם
  choice: ficou imóvel
  rationale: O verbo דמם pode indicar silêncio ou imobilidade. Em paralelo com a lua que parou e neste contexto celeste, “ficou imóvel” comunica naturalmente a cessação do movimento sem reduzir o caráter extraordinário do relato.
- source_word: וְיָרֵחַ עָמָד
  choice: e a lua parou
  rationale: עמד significa literalmente “ficar de pé” ou “permanecer”, mas, aplicado à lua neste contexto, expressa naturalmente que ela parou. A formulação também evita repetição desnecessária.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: até que a nação tomou vingança de seus inimigos
  rationale: A construção idiomática com קום pode expressar ação de vingança ou desforra. “A nação” preserva גוי, e “seus inimigos” mantém o sufixo singular coletivo.
- source_word: גּוֹי
  choice: a nação
  rationale: גוי designa com frequência uma nação e aqui se refere coletivamente a Israel. “Nação” preserva seu valor lexical específico.
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: Isso não está escrito
  rationale: O pronome feminino provavelmente retoma a declaração ou o relato precedente. “Isso” é uma retomada natural em português sem especificar além do hebraico.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Livro de Jasar
  rationale: Como título de uma obra citada, mantém-se Jasar como nome transliterado; a possibilidade de entender o termo como “Justo” ou “Reto” é registrada em nota.
- source_word: וַיַּעֲמֹד הַשֶּׁמֶשׁ
  choice: O sol ficou imóvel
  rationale: A segunda declaração retoma e desenvolve o acontecimento. “Ficou imóvel” é claro, digno e coerente com a primeira descrição do sol.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: no meio do céu
  rationale: A expressão significa literalmente “na metade/no meio dos céus”. “No meio do céu” conserva o sentido espacial em português natural.
- source_word: וְלֹא אָץ לָבוֹא
  choice: e não se apressou a se pôr
  rationale: אוץ significa apressar-se; בוא, quando relacionado ao sol, refere-se idiomaticamente à chegada ao poente. “Pôr-se” explicita esse sentido natural em português.
- source_word: כְּיוֹם תָּמִים
  choice: por cerca de um dia inteiro
  rationale: תמים indica algo completo ou inteiro, enquanto כ introduz comparação ou aproximação. “Cerca de um dia inteiro” preserva essa falta de precisão matemática.
theological_decisions:
- issue: Natureza do acontecimento astronômico
  choice: Traduzir diretamente o relato como uma paralisação do sol e da lua.
  alternative: Interpretar a linguagem apenas como descrição da percepção humana ou como citação poética sem afirmação narrativa.
  rationale: O texto apresenta o acontecimento como extraordinário e o relaciona a uma fonte escrita. A tradução preserva essa afirmação sem impor harmonização científica moderna nem convertê-la em mera metáfora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o encadeamento narrativo do hebraico, evita arcaísmos e conserva as ambiguidades lexicais relevantes em notas.
