source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֶת לָכִ֜ישׁ בְּ/יַ֣ד יִשְׂרָאֵ֗ל וַֽ/יִּלְכְּדָ/הּ֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֔רֶב וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּ֑/הּ כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לִבְנָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: pt
  text: O SENHOR entregou Laquis nas mãos de Israel, que a conquistou no segundo dia e a passou ao fio da espada, junto com todas as pessoas que nela estavam[a], assim como havia feito com Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “toda alma que nela estava”, expressão que aqui significa todas as pessoas da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: O SENHOR
  rationale: Emprega a forma tradicional em versaletes para representar o nome divino, distinguindo-o do título comum sem impor ao texto uma vocalização portuguesa do tetragrama.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: entregou ... nas mãos de
  rationale: Reproduz de modo natural a expressão hebraica de colocar alguém ou algo sob o poder de outra parte, preservando também sua imagem concreta.
- source_word: לָכִישׁ
  choice: Laquis
  rationale: Forma consagrada em português para o topônimo hebraico.
- source_word: וַיִּלְכְּדָהּ
  choice: a conquistou
  rationale: No contexto militar, o verbo indica a tomada de uma cidade; “conquistou” é claro e corrente em português.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: no segundo dia
  rationale: Tradução direta que mantém a indicação cronológica do hebraico, sem convertê-la interpretativamente em “no dia seguinte”.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: a passou ao fio da espada
  rationale: A expressão portuguesa comunica naturalmente a ação militar letal e conserva a imagem do idioma hebraico, literalmente relacionado à “boca” da espada.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: todas as pessoas que nela estavam
  rationale: Neste contexto, נֶפֶשׁ designa seres humanos vivos, não uma “alma” abstrata separada do corpo. A formulação mantém a abrangência e a severidade do relato.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: assim como havia feito com Libna
  rationale: Mantém o verbo no singular e evita acrescentar explicitamente “Josué” ou “Israel”, preservando a referência contextual implícita do hebraico.
theological_decisions:
- issue: Fórmula de conquista referente à morte dos habitantes
  choice: junto com todas as pessoas que nela estavam
  alternative: junto com toda alma que nela estava
  rationale: O uso coletivo de נֶפֶשׁ refere-se às pessoas da cidade. A tradução não introduz uma distinção antropológica entre corpo e alma, nem atenua a totalidade violenta descrita.
- issue: Sujeito da comparação final
  choice: assim como havia feito com Libna
  alternative: assim como Josué havia feito com Libna
  rationale: O hebraico usa um verbo singular, mas não repete o sujeito. A omissão natural do pronome em português mantém essa forma e não resolve além do texto se o agente representativo em foco é Josué ou Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Conserva a imagem de “nas mãos” e a expressão tradicional “ao fio da espada”, enquanto traduz o sentido contextual de נֶפֶשׁ no corpo do versículo. O marcador [a] aparece imediatamente após a expressão que a nota esclarece.
