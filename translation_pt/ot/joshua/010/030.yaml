  terminology: “Javé” é uma forma portuguesa estabelecida para o nome divino. “Pessoas” traduz adequadamente נֶפֶשׁ neste contexto sem introduzir uma leitura antropológica posterior. “Rei”, “sobrevivente” e “Jericó” estão corretos e consistentes.
