  source_fidelity: 'A tradução representa com precisão o hebraico: Javé entrega Libna e seu rei ao poder de Israel; a cidade e todos os seus habitantes são feridos à espada; não há sobrevivente; e o rei recebe o mesmo tratamento dado ao rei de Jericó. A explicitação de “a cidade” é contextual e segura. O sujeito coletivo “Israel” em “Israel a feriu” é compatível com o singular hebraico e com o contexto narrativo, além de evitar uma atribuição gramatical indevida da ação militar diretamente a Javé em português.'
