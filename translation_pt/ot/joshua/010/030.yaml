  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: pt
  text: E Javé também entregou a cidade e o seu rei nas mãos de Israel. Israel a feriu ao fio da espada, bem como todas as pessoas que nela estavam.[a] Não deixou nela nenhum sobrevivente e fez ao seu rei assim como havia feito ao rei de Jericó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “toda alma que nela estava”, expressão que aqui significa todas as pessoas da cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Emprega a forma portuguesa corrente do nome divino, preservando o nome próprio representado pelo tetragrama.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: entregou ... nas mãos de Israel
  rationale: Comunica o sentido de colocar sob o poder de alguém e preserva, de modo natural em português, a imagem hebraica da mão.
- source_word: גַּם
  choice: também
  rationale: Marca a continuação desta conquista em relação aos acontecimentos anteriores.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: a cidade e o seu rei
  rationale: Explicita o referente do pronome feminino, a cidade mencionada no contexto, evitando a forma pouco clara 'a entregou'.
- source_word: וַיַּכֶּהָ
  choice: a feriu
  rationale: Mantém o sentido básico de נכה, 'ferir/golpear', sem reduzi-lo apenas a atacar ou ampliá-lo para uma formulação interpretativa.
- source_word: לְפִי חֶרֶב
  choice: ao fio da espada
  rationale: É a expressão portuguesa tradicional e inteligível que preserva a imagem do idioma hebraico, literalmente relacionado à 'boca' da espada.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: todas as pessoas que nela estavam
  rationale: Neste contexto, נֶפֶשׁ designa pessoas vivas, não especificamente uma alma imaterial; a forma plural é natural em português.
- source_word: לֹא הִשְׁאִיר ... שָׂרִיד
  choice: Não deixou nela nenhum sobrevivente
  rationale: שָׂרִיד indica alguém que resta ou sobrevive; 'nenhum sobrevivente' expressa diretamente o sentido.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: fez ao seu rei assim como havia feito ao rei de Jericó
  rationale: Preserva a repetição do verbo עשה e representa naturalmente em português a anterioridade da ação contra o rei de Jericó.
theological_decisions:
- issue: Sentido de נֶפֶשׁ no relato de guerra
  choice: todas as pessoas
  alternative: todas as almas
  rationale: O termo se refere aos habitantes vivos da cidade. 'Pessoas' evita importar uma afirmação posterior sobre a composição antropológica humana.
- issue: Sujeito das ações após Javé entregar a cidade
  choice: Israel a feriu ... Não deixou
  alternative: ele a feriu ... ele não deixou
  rationale: O hebraico admite a continuidade de um sujeito masculino singular, cujo referente contextual é Israel como entidade coletiva. Explicitar 'Israel' em português evita que o leitor entenda que Javé é o agente gramatical direto dos golpes, sem eliminar a afirmação de que a vitória foi concedida por Javé.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva expressões hebraicas naturais em português, como “nas mãos” e “ao fio da espada”, enquanto explicita referentes necessários à clareza.
