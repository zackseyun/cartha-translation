base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: pt
  text: Eles ficaram com muito medo, porque Gibeom era uma cidade grande, como uma das cidades reais, e porque era maior que Ai, e todos os seus homens eram guerreiros valentes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os seus homens eram valentes”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: Eles ficaram com muito medo
  rationale: Expressa naturalmente em português o medo intenso indicado pelo verbo ירא e pelo intensificador מְאֹד, preservando o sujeito plural do hebraico.
- source_word: עִיר גְּדוֹלָה
  choice: uma cidade grande
  rationale: “Grande” mantém aberta a referência tanto ao tamanho quanto à importância da cidade.
- source_word: גִּבְעוֹן
  choice: Gibeom
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: como uma das cidades reais
  rationale: Comunica de modo conciso que Gibeom tinha posição comparável à de uma cidade régia, sem introduzir uma identificação política não expressa no texto.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: Era maior que Ai
  rationale: Conserva a comparação e a amplitude semântica de גָּדוֹל; “maior” pode envolver dimensão e importância.
- source_word: וְכָל אֲנָשֶׁיהָ גִּבֹּרִים
  choice: e todos os seus homens eram guerreiros valentes
  rationale: No contexto militar, גִּבֹּרִים caracteriza os homens da cidade como combatentes fortes ou valentes. A formulação explícita é clara e natural em português.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com fluência narrativa. A repetição causal do hebraico foi distribuída em duas frases para maior naturalidade, sem alterar as relações lógicas do versículo.
