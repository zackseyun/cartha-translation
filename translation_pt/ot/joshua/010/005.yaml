  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: pt
  text: Assim, os cinco reis dos amorreus — o rei de Jerusalém, o rei de Hebrom, o rei de Jarmute, o rei de Laquis e o rei de Eglom — reuniram-se e subiram, eles e todos os seus exércitos.[a] Acamparam contra Gibeom e lutaram contra ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “todos os seus acampamentos”.'
    reason: Preserva a imagem concreta de מַחֲנֵיהֶם, aqui empregada para designar as forças militares.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: reuniram-se
  rationale: O nifal expressa a ação coletiva de se reunir, sem acrescentar a ideia mais específica de uma aliança formal.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Preserva o sentido básico de עלה e mantém aberta a possibilidade de referência tanto à topografia quanto ao uso direcional convencional.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: os cinco reis dos amorreus
  rationale: Mantém explícita a relação construta e conserva a designação étnica do hebraico.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: o rei de Jerusalém, o rei de Hebrom, o rei de Jarmute, o rei de Laquis e o rei de Eglom
  rationale: Conserva a repetição deliberada de 'rei de' na enumeração de cada governante.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: eles e todos os seus exércitos
  rationale: No contexto militar, מַחֲנֶה designa por metonímia as tropas organizadas em acampamentos. 'Exércitos' comunica esse referente com naturalidade; a imagem concreta do hebraico é registrada em nota.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: Acamparam contra Gibeom
  rationale: A ação bélica imediatamente posterior indica que עַל tem aqui força hostil, não apenas locativa.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: lutaram contra ela
  rationale: Traduz diretamente o verbo comum para guerrear; o pronome feminino retoma naturalmente a cidade de Gibeom em português.
theological_decisions: []
