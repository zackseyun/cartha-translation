  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: pt
  text: 'Então Josué disse: “Rolem grandes pedras até a boca da caverna[a] e coloquem homens de guarda junto a ela, para vigiá-los[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até a entrada da caverna”. O hebraico diz literalmente “até a boca da caverna”.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico traz um objeto masculino plural: “vigiá-los”, provavelmente referindo-se aos reis presos dentro da caverna.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O wayyiqtol dá continuidade à narrativa; “Então” expressa essa progressão com naturalidade em português, sem impor uma relação temporal mais precisa.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: גֹּלּוּ
  choice: Rolem
  rationale: O imperativo plural de גלל descreve diretamente o ato de rolar pedras.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: grandes pedras
  rationale: Tradução direta e natural, indicando o tamanho das pedras.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: até a boca da caverna
  rationale: Preserva a imagem hebraica de פֶּה, “boca”, usada para a abertura ou entrada de uma caverna.
- source_word: וְהַפְקִידוּ עָלֶיהָ אֲנָשִׁים
  choice: e coloquem homens de guarda junto a ela
  rationale: Expressa a designação dos homens e sua posição de responsabilidade junto à caverna; “de guarda” decorre da tarefa explicitada no infinitivo seguinte.
- source_word: לְשָׁמְרָם
  choice: para vigiá-los
  rationale: Mantém o sufixo masculino plural do hebraico, cujo referente mais provável são os reis presos na caverna, não a caverna singular.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural. A imagem hebraica “boca da caverna” foi preservada no texto, e a referência plural de לְשָׁמְרָם foi mantida sem harmonização com o substantivo singular “caverna”.
