source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: pt
  text: Enquanto fugiam diante de Israel[a], quando estavam na descida de Bete-Horom, Yahweh lançou do céu grandes pedras sobre eles até Azeca, e eles morreram. Os que morreram pelas pedras de granizo foram mais numerosos do que os que os filhos de Israel mataram à espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “diante dos israelitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֻסָם
  choice: Enquanto fugiam
  rationale: O infinitivo construto com בְּ e sufixo indica uma ação simultânea; a formulação é natural em português e preserva o valor temporal.
- source_word: מִפְּנֵי יִשְׂרָאֵל
  choice: diante de Israel
  rationale: Reproduz a expressão hebraica de fuga perante um adversário sem perder clareza em português.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: estando na descida de Bete-Horom
  rationale: מוֹרָד designa uma descida ou ladeira; a escolha conserva a precisão topográfica do relato.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico e o distingue de títulos como “Senhor”.
- source_word: הִשְׁלִיךְ
  choice: lançou
  rationale: Expressa diretamente o ato de atirar, sem acrescentar ao verbo hebraico uma direção já indicada por “do céu”.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: grandes pedras
  rationale: Mantém a descrição inicial genérica, antes de o próprio texto identificá-las como pedras de granizo.
- source_word: מִן הַשָּׁמַיִם
  choice: do céu
  rationale: Preserva tanto a procedência superior quanto a ressonância teológica da intervenção divina.
- source_word: עַד עֲזֵקָה
  choice: até Azeca
  rationale: Indica naturalmente em português a extensão espacial do acontecimento ao longo da rota.
- source_word: וַיָּמֻתוּ
  choice: e eles morreram
  rationale: Conserva a afirmação narrativa explícita de morte antes da comparação que vem em seguida.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: pelas pedras de granizo
  rationale: Identifica as pedras antes mencionadas como granizo e preserva a repetição lexical de “pedras”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a forma etnonímica tradicional e formalmente próxima do hebraico; a alternativa idiomática aparece em nota.
- source_word: בֶּחָרֶב
  choice: à espada
  rationale: É uma construção portuguesa corrente para o instrumento de morte em combate e corresponde ao singular coletivo hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o caráter de nome próprio sem substituí-lo por um título.
- issue: Natureza dos objetos lançados do céu
  choice: Preservar a progressão “grandes pedras” e depois “pedras de granizo”
  alternative: Traduzir já a primeira ocorrência como “grandes pedras de granizo”
  rationale: O hebraico primeiro os descreve genericamente e depois os identifica; manter as duas etapas evita explicitar antes do texto.
- issue: Forma etnonímica בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha preserva a expressão hebraica tradicional, enquanto a nota registra a forma portuguesa mais idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se a topografia, a repetição de “pedras” e a progressão descritiva do hebraico; a sintaxe foi levemente ajustada para fluência sem eliminar a comparação ou a agência explícita de Yahweh.
