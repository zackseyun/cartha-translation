  terminology: “Yahweh”, “Bete-Horom”, “Azeca”, “grandes pedras”, “pedras de granizo”, “filhos de Israel” e “à espada” são escolhas adequadas. A nota em [a] oferece corretamente a alternativa idiomática para “Israel”.
