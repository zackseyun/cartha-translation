source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: pt
  text: Assim, Josué atingiu toda a terra — a região montanhosa, o Neguebe, a planície e as encostas — e todos os seus reis. Não deixou nenhum sobrevivente; consagrou à destruição[a] tudo o que respirava[b], conforme Yahweh, o Deus de Israel, havia ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruiu completamente” ou “colocou sob interdição”. O verbo hebraico indica que algo foi consagrado irrevogavelmente à destruição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todo o fôlego”; também pode ser traduzido por “tudo o que tinha fôlego” ou “todo ser que respirava”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: atacou
  rationale: O verbo נכה descreve aqui a ação militar de golpear ou atacar. “Atacou” comunica isso com naturalidade em português, sem tornar a expressão arcaica nem especificar além do verbo isolado.
- source_word: כָּל הָאָרֶץ
  choice: toda aquela terra
  rationale: אֶרֶץ designa o território regional resumido no contexto, não o planeta inteiro. O demonstrativo deixa claro em português que se trata da terra mencionada na narrativa.
- source_word: הָהָר
  choice: a região montanhosa
  rationale: Em Josué, הָהָר funciona frequentemente como designação topográfica regional. “Região montanhosa” é clara e geograficamente adequada.
- source_word: הַנֶּגֶב
  choice: o Neguebe
  rationale: Neste contexto, נֶגֶב nomeia a região árida do sul. A forma geográfica tradicional “Neguebe” preserva esse valor próprio.
- source_word: הַשְּׁפֵלָה
  choice: a planície
  rationale: שְׁפֵלָה designa a região baixa situada entre a serra e a costa. “Planície” é uma forma acessível e corrente em português bíblico.
- source_word: הָאֲשֵׁדוֹת
  choice: as encostas
  rationale: אֲשֵׁדוֹת refere-se a declives ou vertentes. “Encostas” preserva a referência topográfica de maneira concisa.
- source_word: כָּל מַלְכֵיהֶם
  choice: todos os seus reis
  rationale: Tradução direta que conserva tanto a totalidade expressa por כָּל como a referência aos reis das regiões enumeradas.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Não deixou nenhum sobrevivente
  rationale: שָׂרִיד pode significar remanescente ou sobrevivente; no contexto militar, “sobrevivente” é a opção mais clara e natural.
- source_word: כָּל הַנְּשָׁמָה
  choice: tudo o que respirava
  rationale: A expressão hebraica refere-se literalmente a todo fôlego ou a tudo que respira. Esta formulação conserva o caráter abrangente e incisivo do idioma hebraico sem restringi-lo interpretativamente a “toda pessoa”.
- source_word: הֶחֱרִים
  choice: consagrou à destruição
  rationale: O Hifil de חרם expressa colocar algo sob ḥerem, isto é, destiná-lo irrevogavelmente à destruição. A tradução mantém tanto o resultado destrutivo como a dimensão religiosa do termo.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: conforme ... havia ordenado
  rationale: A oração indica que a ação correspondeu a uma ordem divina anterior. “Conforme ... havia ordenado” expressa naturalmente essa relação temporal e comparativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Linguagem de guerra associada a חרם
  choice: consagrou à destruição
  alternative: destruiu completamente; colocou sob interdição
  rationale: A expressão escolhida não suaviza a destruição relatada, mas também preserva a dimensão cultual e irrevogável do verbo hebraico, evitando reduzi-lo a um termo puramente militar.
- issue: Alcance de כָּל הַנְּשָׁמָה
  choice: tudo o que respirava
  alternative: toda pessoa; todo ser vivo
  rationale: A tradução conserva a amplitude e a ambiguidade referencial do idioma hebraico, sem decidir silenciosamente se a expressão se limita a seres humanos ou abrange de forma mais ampla os seres vivos visados no relato.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A enumeração topográfica e a severidade da linguagem hebraica foram preservadas; os termos técnicos foram evitados no corpo do texto e esclarecidos em notas.
