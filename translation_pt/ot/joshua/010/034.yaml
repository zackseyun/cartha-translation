  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לָּכִ֖ישׁ עֶגְלֹ֑נָ/ה וַ/יַּחֲנ֣וּ עָלֶ֔י/הָ וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: pt
  text: Então Josué e todo o Israel com ele partiram de Laquis para Eglom. Acamparam contra a cidade e lutaram contra ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: partiram
  rationale: No contexto da sequência militar entre cidades, o verbo עבר indica prosseguimento ou deslocamento. “Partiram” expressa naturalmente a saída de Laquis sem sugerir a travessia de uma fronteira ou de um curso de água.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: e todo o Israel com ele
  rationale: Mantém a designação coletiva de Israel e a relação comitativa, apresentando Josué como líder acompanhado pelo povo ou força israelita.
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: de Laquis para Eglom
  rationale: A preposição מִן marca a origem, e o ה direcional em עֶגְלֹנָה marca o destino. A construção portuguesa “de... para...” reproduz claramente esse movimento.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: Acamparam contra a cidade
  rationale: חנה descreve o estabelecimento do acampamento, e על, neste contexto de campanha e cerco, tem sentido hostil. “A cidade” explicita o referente feminino de עָלֶיהָ de modo natural em português.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: lutaram contra ela
  rationale: O nifal de לחם é a expressão comum para entrar em combate; על indica que a ação se dirige hostilmente contra Eglom.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A divisão em duas frases evita uma sequência excessivamente longa, sem alterar a progressão narrativa. O topônimo hebraico עֶגְלוֹן é vertido pela forma portuguesa tradicional “Eglom”.
