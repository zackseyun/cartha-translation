  text: וַ/יִּשְׁלַ֨ח אֲדֹנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל הוֹהָ֣ם מֶֽלֶךְ חֶ֠בְרוֹן וְ/אֶל פִּרְאָ֨ם מֶֽלֶךְ יַרְמ֜וּת וְ/אֶל יָפִ֧יעַ מֶֽלֶךְ לָכִ֛ישׁ וְ/אֶל דְּבִ֥יר מֶֽלֶךְ עֶגְל֖וֹן לֵ/אמֹֽר־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: pt
  text: 'Então Adoni-Zedeque, rei de Jerusalém, mandou dizer a Hoão, rei de Hebrom, a Pirã, rei de Jarmute, a Jafia, rei de Laquis, e a Debir, rei de Eglom:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Então ... mandou dizer
  rationale: O wayyiqtol dá continuidade à narrativa. Em combinação com לֵאמֹר, a expressão portuguesa “mandou dizer” comunica naturalmente o envio de uma mensagem, enquanto “Então” preserva a ligação discursiva com o versículo anterior.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Zedeque
  rationale: Nome próprio transliterado segundo formas reconhecíveis em português; o hífen preserva a estrutura composta do nome.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: rei de Jerusalém
  rationale: Tradução direta da construção nominal, com a forma portuguesa consagrada do topônimo.
- source_word: אֶל
  choice: a
  rationale: A preposição assinala os destinatários da mensagem; “a” é natural em português após “mandou dizer”.
- source_word: הוֹהָם
  choice: Hoão
  rationale: Transliteração aportuguesada do nome próprio hebraico.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: פִּרְאָם
  choice: Pirão
  rationale: Transliteração aportuguesada do nome próprio.
- source_word: יַרְמוּת
  choice: Jarmute
  rationale: Transliteração aportuguesada do topônimo.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Transliteração aportuguesada do nome próprio.
- source_word: לָכִישׁ
  choice: Laquis
  rationale: Forma portuguesa amplamente reconhecida do topônimo.
- source_word: דְּבִיר
  choice: Debir
  rationale: Transliteração do nome próprio; neste contexto, designa inequivocamente o rei, não o substantivo comum encontrado em outros textos.
- source_word: עֶגְלוֹן
  choice: Eglom
  rationale: Forma portuguesa tradicional e reconhecível do topônimo.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo “dizendo” introduz o conteúdo da mensagem. Como a fala vem no versículo seguinte, os dois-pontos constituem a forma mais natural de representá-lo em português, apoiados por “mandou dizer”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes próprios em formas aportuguesadas reconhecíveis. A sintaxe evita o pouco natural “enviou... dizendo” e preserva com clareza que se trata do envio de uma mensagem.
