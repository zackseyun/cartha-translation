  text: וַ/יַּ֨עַל יְהוֹשֻׁ֜עַ מִן הַ/גִּלְגָּ֗ל ה֚וּא וְ/כָל עַ֤ם הַ/מִּלְחָמָה֙ עִמּ֔/וֹ וְ/כֹ֖ל גִּבּוֹרֵ֥י הֶ/חָֽיִל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: pt
  text: Então Josué subiu de Gilgal, ele e todo o contingente de guerra com ele, e todos os guerreiros valentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: Preserva o sentido direcional básico de עלה sem acrescentar explicitamente a ideia de marcha, embora o contexto seja militar.
- source_word: מִן הַגִּלְגָּל
  choice: de Gilgal
  rationale: Tradução direta da preposição מן e transliteração convencional do nome do lugar.
- source_word: הוּא
  choice: ele
  rationale: Mantém o pronome independente explícito, que põe Josué em aposição com os que o acompanhavam.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: todo o contingente de guerra
  rationale: Expressa de modo natural o coletivo militar literalmente descrito como 'todo o povo da guerra', sem o confundir com a expressão seguinte.
- source_word: עִמּוֹ
  choice: que estava com ele
  rationale: Reproduz com naturalidade em português a relação de acompanhamento indicada por עִם.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: todos os guerreiros valentes
  rationale: A expressão designa combatentes fortes e capazes; esta formulação conserva tanto o caráter militar quanto a ideia de valentia, distinguindo-os do contingente mencionado antes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e boa legibilidade brasileira. A coordenação 'bem como' ajuda a preservar a distinção entre o contingente militar em geral e os guerreiros valentes, sem decidir se estes constituem um grupo adicional ou uma especificação do anterior.
