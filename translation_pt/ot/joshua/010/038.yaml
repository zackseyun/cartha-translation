  text: וַ/יָּ֧שָׁב יְהוֹשֻׁ֛עַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ דְּבִ֑רָ/ה וַ/יִּלָּ֖חֶם עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/038.yaml
  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: pt
  text: Então Josué voltou a Debir com todo o Israel que estava com ele e lutou contra ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltaram
  rationale: O verbo שׁוב indica retorno ou mudança de direção neste contexto de deslocamento. O plural é natural em português com o sujeito composto “Josué e todo o Israel”.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: e todo o Israel com ele
  rationale: Mantém tanto a expressão coletiva “todo o Israel” quanto a indicação explícita de que estava com Josué.
- source_word: דְּבִרָה
  choice: a Debir
  rationale: O ה direcional ligado ao nome do lugar indica movimento em direção à cidade; após “voltaram”, a preposição “a” expressa isso de modo conciso e natural.
- source_word: וַיִּלָּחֶם
  choice: lutaram
  rationale: O verbo לחם descreve o ato de entrar em combate. O plural concorda naturalmente com o sujeito composto em português, sem ampliar o sentido para “travaram guerra” ou restringi-lo a “atacaram”.
- source_word: עָלֶיהָ
  choice: contra ela
  rationale: A forma pronominal feminina retoma a cidade de Debir. Como “cidade” também é feminino em português, “ela” é natural e preserva a referência do hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A tradução conserva a referência coletiva a Israel e o pronome feminino referente à cidade, sem necessidade de nota explicativa em português.
