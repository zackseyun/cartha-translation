  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: pt
  text: Josué capturou todos esses reis e as terras deles de uma só vez[a], porque Yahweh, o Deus de Israel, lutou por Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa só campanha”. O hebraico diz literalmente “uma só vez”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: capturou
  rationale: O verbo indica capturar ou tomar em contexto militar. “Capturou” preserva esse sentido sem explicitar mais do que o hebraico.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: todos esses reis
  rationale: Tradução direta e natural da expressão com objeto definido e demonstrativo.
- source_word: וְאֶת אַרְצָם
  choice: e as terras deles
  rationale: אֶרֶץ pode designar terra, país ou território. O plural idiomático em português deixa claro que se trata dos domínios dos vários reis.
- source_word: פַּעַם אֶחָת
  choice: de uma só vez
  rationale: Reflete literalmente a ideia de “uma vez”, mantendo aberta a possibilidade contextual de uma única campanha, indicada em nota.
- source_word: כִּי
  choice: porque
  rationale: Introduz de modo claro a causa do êxito de Josué.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reprodução direta e idiomática da construção hebraica.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: lutava por Israel
  rationale: O nifal de לחם com ל expressa combater em favor de alguém. O imperfeito em português apresenta essa ação divina como fundamento atuante do sucesso resumido no versículo.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “As terras deles” soa mais natural do que “sua terra” para os domínios de vários reis. A nota preserva a alternativa contextual de uma única campanha.
