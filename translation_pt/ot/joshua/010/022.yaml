base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: pt
  text: 'Então Josué disse: “Abram a entrada da caverna e tragam para fora da caverna, até mim, estes cinco reis.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa com naturalidade a sequência dos acontecimentos.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: פִּתְחוּ
  choice: Abram
  rationale: Imperativo plural de פתח; “abram” é a ordem direta e natural no contexto.
- source_word: פִּי הַמְּעָרָה
  choice: a entrada da caverna
  rationale: Embora o hebraico diga literalmente “a boca da caverna”, “a entrada da caverna” comunica o mesmo referente de modo claro e idiomático em português.
- source_word: וְהוֹצִיאוּ אֵלַי
  choice: tragam para junto de mim
  rationale: O hifil de יצא indica fazer sair, enquanto אֵלַי marca movimento em direção a Josué; a formulação portuguesa reúne naturalmente os dois sentidos.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: esses cinco reis
  rationale: O demonstrativo identifica reis específicos já conhecidos no contexto; “esses” é natural no português moderno e preserva a referência dêitica.
- source_word: מִן הַמְּעָרָה
  choice: que estão dentro dela
  rationale: A origem do movimento, literalmente “da caverna”, é explicitada de maneira idiomática sem repetir a palavra “caverna”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção evita o pouco usual “boca da caverna” no texto principal e torna explícito o movimento para fora da caverna e em direção a Josué.
