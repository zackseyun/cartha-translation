  source_fidelity: A redação proposta preserva a ordem narrativa, o nome próprio, o imperativo plural e a referência aos cinco reis. Contudo, «que estão dentro dela» acrescenta uma oração relativa ausente do hebraico e substitui a indicação explícita de retirada «da caverna».
