  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: pt
  text: 'Quando trouxeram esses reis para junto de Josué, ele convocou todos os homens de Israel[a] e disse aos comandantes dos homens de guerra[b] que tinham ido com ele: “Aproximem-se e ponham os pés sobre os pescoços destes reis.” Então eles se aproximaram e puseram os pés sobre os pescoços deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “todo homem de Israel”; neste contexto militar, a expressão se refere aos homens reunidos com o exército.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos chefes dos guerreiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: Quando trouxeram
  rationale: A construção narrativa וַיְהִי seguida de כְּ e infinitivo introduz uma oração temporal. Em português atual, “Quando trouxeram” comunica naturalmente a sequência sem reproduzir de modo rígido a fórmula “E aconteceu que”.
- source_word: אֶת הַמְּלָכִים הָאֵלֶּה אֶל יְהוֹשֻׁעַ
  choice: esses reis para junto de Josué
  rationale: “Esses reis” conserva a referência demonstrativa aos reis presentes na cena; “para junto de Josué” expressa com clareza o movimento indicado por אֶל.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: todos os homens de Israel
  rationale: A expressão é literalmente “todo homem de Israel”. O plural idiomático mantém a referência masculina pertinente ao contexto militar sem reduzi-la ao mais abrangente “todo Israel”.
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: comandantes dos homens de guerra
  rationale: קְצִינֵי designa chefes ou comandantes, e אַנְשֵׁי הַמִּלְחָמָה é uma expressão militar concreta. A tradução preserva tanto a estrutura quanto o registro do hebraico.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: que tinham ido com ele
  rationale: A oração caracteriza os comandantes como aqueles que acompanharam Josué. O mais-que-perfeito composto situa esse acompanhamento antes da ordem dada na cena.
- source_word: קִרְבוּ
  choice: Aproximem-se
  rationale: O imperativo ordena uma aproximação física. “Aproximem-se” é direto, natural e adequado ao tratamento de um grupo.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: ponham os pés sobre os pescoços de
  rationale: A formulação mantém a ação física e a imagem explícita de submissão, sem suavizá-la. O plural “pescoços” corresponde ao hebraico e aos vários reis.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: Então eles se aproximaram e puseram
  rationale: Os verbos narrativos consecutivos descrevem a obediência imediata. “Então” torna clara a progressão sem acrescentar conteúdo.
- source_word: עַל צַוְּארֵיהֶם
  choice: sobre os pescoços deles
  rationale: O pronome retoma inequivocamente os reis, e a expressão conserva o plural do texto hebraico.
theological_decisions:
- issue: Linguagem masculina em כָּל אִישׁ יִשְׂרָאֵל e אַנְשֵׁי הַמִּלְחָמָה
  choice: todos os homens de Israel / homens de guerra
  alternative: todo Israel / todos os israelitas / guerreiros
  rationale: As formas masculinas são relevantes neste cenário militar e foram mantidas para preservar a especificidade lexical e contextual, sem ampliar silenciosamente a referência.
- issue: Representação do gesto de conquista
  choice: ponham os pés sobre os pescoços destes reis
  alternative: subjuguem estes reis
  rationale: O hebraico descreve um ato concreto e simbolicamente carregado de domínio militar. A tradução conserva sua força e tensão, em vez de substituí-lo por uma interpretação abstrata ou suavizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa é natural, enquanto o vocabulário militar e a imagem concreta do hebraico são preservados. Os marcadores de nota foram colocados junto às expressões que efetivamente explicam.
