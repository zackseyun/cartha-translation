base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: pt
  text: Então Josué voltou[a], e todo o Israel com ele, para o acampamento em Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uma declaração semelhante sobre o retorno a Gilgal aparece em Josué 10:43. Alguns intérpretes consideram este versículo uma antecipação narrativa ou texto deslocado, mas aqui o texto hebraico é traduzido tal como se apresenta.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Então ... voltou
  rationale: O wayyiqtol de שׁוב dá sequência à narrativa e indica retorno a um lugar anterior. “Então” expressa naturalmente a progressão narrativa, e “voltou” preserva o sentido do verbo.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Preserva a expressão coletiva do hebraico sem especificar se se refere estritamente ao exército ou ao povo da aliança em sentido corporativo.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Equivalente direto da preposição עִם com sufixo masculino singular.
- source_word: אֶל הַמַּחֲנֶה
  choice: para o acampamento
  rationale: מַחֲנֶה designa aqui um acampamento, provavelmente militar; “acampamento” é claro e natural em português.
- source_word: הַגִּלְגָּלָה
  choice: em Gilgal
  rationale: A terminação direcional indica movimento rumo a Gilgal. Na construção portuguesa “para o acampamento em Gilgal”, a preposição “em” identifica naturalmente a localização do acampamento, enquanto “para” já expressa o movimento.
theological_decisions:
- issue: Posição narrativa e possível repetição de Josué 10:43
  choice: Traduzir o Texto Massorético tal como se apresenta, sem harmonizar nem omitir o versículo.
  alternative: Alguns intérpretes consideram este versículo uma antecipação narrativa ou uma nota deslocada, pois uma declaração semelhante aparece em Josué 10:43.
  rationale: A tradução deve representar claramente o texto hebraico recebido, preservando a questão literária em nota sem resolvê-la no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase mantém a forma coletiva “todo o Israel” e reproduz sem harmonização a sequência narrativa do hebraico.
