source:
  edition: WLC
  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: pt
  text: 'Então Josué falou a Yahweh, no dia em que Yahweh entregou os amorreus diante dos filhos de Israel[a], e disse diante de Israel: “Sol, fique parado em Gibeão[b]; e lua, no vale de Aijalom[c]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “diante dos filhos de Israel”. No contexto, a expressão indica que Yahweh entregou os amorreus ao poder de Israel.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “fique imóvel”, “pare” ou “cale-se”. O verbo hebraico pode expressar imobilidade, cessação ou silêncio.
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico diz literalmente: “e lua, no vale de Aijalom”, deixando subentendida, na segunda oração, a ordem “fique parada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: falou
  rationale: O piel de דבר significa normalmente “falar”. “Falou” mantém a distinção em relação ao וַיֹּאמֶר seguinte, traduzido por “disse”.
- source_word: לַיהוָה
  choice: a Yahweh
  rationale: A preposição ל marca o destinatário da fala, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: no dia em que Yahweh entregou
  rationale: A construção com בְּיוֹם e o infinitivo tem sentido temporal; a formulação é natural em português e preserva a referência ao dia específico.
- source_word: הָאֱמֹרִי
  choice: os amorreus
  rationale: Embora a forma hebraica esteja no singular, ela tem valor coletivo neste contexto de guerra contra um povo.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Na fórmula de entrega militar, לִפְנֵי indica que o inimigo foi posto diante de Israel, isto é, entregue ao seu poder. “Filhos de Israel” preserva a expressão familiar do hebraico.
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: Ele disse diante de Israel
  rationale: לְעֵינֵי significa literalmente “aos olhos de” e, idiomaticamente, indica uma declaração pública, feita diante de Israel.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: Sol, fique parado
  rationale: דום pode indicar quietude, silêncio ou cessação. No contexto da ordem dirigida ao sol, “fique parado” comunica a imobilidade sem especificar um mecanismo cosmológico.
- source_word: בְּגִבְעוֹן
  choice: sobre Gibeão
  rationale: A preposição בְּ tem amplitude espacial. “Sobre Gibeão” é natural para a posição aparente do sol, embora “em Gibeão” também seja possível.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: e você, lua, sobre o vale de Aijalom
  rationale: A segunda oração não repete o verbo; ele é subentendido a partir da primeira. A expressão vocativa “você, lua” torna o paralelismo claro em português, enquanto a nota preserva a forma elíptica do hebraico.
- source_word: אַיָּלוֹן
  choice: Aijalom
  rationale: “Aijalom” representa de modo reconhecível o topônimo hebraico e segue uma forma corrente em português.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança e evita substituí-lo por um título.
- issue: Natureza da ordem dada ao sol e à lua
  choice: Linguagem fenomenológica e poética preservada sem explicação do mecanismo
  alternative: Explicitar uma interrupção astronômica ou interpretar דום apenas como silêncio
  rationale: O versículo apresenta uma ordem cósmica em linguagem poética, mas não explica seu mecanismo. A tradução mantém essa tensão sem impor uma leitura científica ou metafórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe poética da fala foi levemente explicitada para clareza, enquanto as notas registram a elipse e as alternativas genuínas do hebraico.
