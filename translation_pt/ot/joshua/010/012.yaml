  naturalness: O português é claro e de registro apropriado. A formulação poética com a elipse em «e lua, no vale de Aijalom» é aceitável quando apoiada por nota. A remoção de «você» deixa o paralelismo mais próximo do hebraico e mais solene sem prejudicar a compreensão.
  terminology: «Yahweh», «amorreus», «filhos de Israel», «Gibeão» e «Aijalom» são escolhas consistentes e adequadas. «Diante de Israel» comunica bem o caráter público de לְעֵינֵי יִשְׂרָאֵל.
  issues:
