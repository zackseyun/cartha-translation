base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: pt
  text: Josué os atingiu desde Cades-Barneia até Gaza[a] e em toda a terra de Gósen até Gibeão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os derrotou” ou “os abateu”. O verbo hebraico pode indicar um golpe militar ou uma derrota, sem especificar sempre de que modo ocorreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: os derrotou
  rationale: O verbo נכה, neste contexto militar e com o sufixo de terceira pessoa do plural, indica que Josué os atingiu ou venceu; “derrotou” comunica naturalmente a ação militar sem afirmar que todos foram mortos.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: desde Cades-Barneia
  rationale: A preposição מִן inicia a extensão geográfica da campanha; “desde” combina naturalmente com “até” em português. “Cades-Barneia” preserva a forma consagrada do topônimo.
- source_word: וְעַד עַזָּה
  choice: até Gaza
  rationale: עַד assinala o limite geográfico; “até” expressa essa extensão com clareza e concisão.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: e conquistou toda a terra de Gósen
  rationale: אֵת introduz outra área afetada pelo mesmo verbo. A repetição implícita da ação é explicitada como “conquistou” para produzir português natural e deixar claro que se trata do território abrangido pela campanha.
- source_word: וְעַד גִּבְעוֹן
  choice: até Gibeão
  rationale: עַד volta a indicar o limite territorial; “até Gibeão” mantém o paralelismo geográfico do versículo.
