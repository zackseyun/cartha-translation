revisions:
- from: E aconteceu que, quando Josué e os filhos de Israel terminaram de lhes infligir uma derrota muito grande, até quase acabarem com eles, os sobreviventes que restaram dentre eles entraram nas cidades fortificadas.[a]
  to: E aconteceu que, quando Josué e os filhos de Israel terminaram de desferir-lhes um golpe muito grande, até os destruírem completamente, os sobreviventes dentre eles sobreviveram[a] e entraram nas cidades fortificadas.
  rationale: A revisão elimina a harmonização interpretativa introduzida por «quase», preserva a força totalizante da formulação hebraica e mantém a repetição cognata por meio de uma construção deliberadamente marcada, esclarecida em nota. Também substitui «derrota» por «golpe», mais próximo do vocabulário e da imagem do texto-fonte.
