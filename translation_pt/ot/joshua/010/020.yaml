base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: pt
  text: E aconteceu que, quando Josué e os filhos de Israel terminaram de desferir-lhes um golpe muito grande, até os destruírem completamente, os sobreviventes dentre eles sobreviveram[a] e entraram nas cidades fortificadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: «os sobreviventes dentre eles sobreviveram», preservando uma repetição de substantivo e verbo da mesma raiz para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém a fórmula narrativa hebraica de transição, em português atual e digno.
- source_word: כְּכַלּוֹת
  choice: quando ... terminaram
  rationale: O infinitivo construto com כ tem valor temporal e situa a ação seguinte após o término do ataque.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva de modo transparente a expressão coletiva hebraica, sem substituir por um gentílico interpretativo.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: de lhes infligir uma derrota muito grande
  rationale: A construção combina o verbo 'golpear' com מַכָּה, que no contexto militar pode designar golpe, mortandade ou derrota. 'Infligir uma derrota' comunica naturalmente o resultado devastador sem duplicação artificial em português.
- source_word: עַד תֻּמָּם
  choice: até quase acabarem com eles
  rationale: O contexto imediato afirma que houve sobreviventes; 'quase' explicita em português o uso contextual de uma formulação de totalidade limitada pelo restante da frase, evitando contradição aparente.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: os sobreviventes que restaram dentre eles
  rationale: Expressa a repetição enfática entre o substantivo e o verbo da mesma raiz sem produzir em português a forma pouco natural 'os sobreviventes sobreviveram'. 'Dentre eles' identifica os sobreviventes como pertencentes ao grupo derrotado.
- source_word: עָרֵי הַמִּבְצָר
  choice: as cidades fortificadas
  rationale: Equivalente português corrente e preciso para cidades dotadas de defesas.
theological_decisions:
- issue: Aparente tensão entre עַד תֻּמָּם e a existência de sobreviventes
  choice: até quase acabarem com eles
  alternative: até acabarem com eles
  rationale: A oração seguinte informa explicitamente que alguns escaparam para cidades fortificadas. A tradução mantém a força da devastação totalizante sem sugerir que não restou literalmente ninguém.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura narrativa foi preservada, mas a repetição cognata hebraica foi naturalizada no texto e registrada em nota.
