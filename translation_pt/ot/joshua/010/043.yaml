  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: pt
  text: Então Josué voltou, e todo o Israel com ele, ao acampamento em Gilgal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “ao acampamento, para Gilgal”. No hebraico, o nome “Gilgal” tem uma terminação que indica movimento em direção a um lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltou
  rationale: O verbo שׁוב na sequência narrativa indica retorno; “voltou” é a forma mais natural e concisa em português.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְכָל יִשְׂרָאֵל
  choice: e todo o Israel
  rationale: Preserva a expressão coletiva do hebraico sem restringi-la explicitamente a cada israelita ou apenas aos combatentes.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Tradução direta da expressão de acompanhamento.
- source_word: אֶל הַמַּחֲנֶה
  choice: ao acampamento
  rationale: A preposição indica movimento em direção ao destino, e מַחֲנֶה designa aqui um acampamento militar.
- source_word: הַגִּלְגָּלָה
  choice: em Gilgal
  rationale: Embora a terminação direcional indique movimento rumo a Gilgal, depois de “ao acampamento” a formulação “em Gilgal” identifica naturalmente a localização do acampamento em português; a forma mais literal é preservada em nota.
