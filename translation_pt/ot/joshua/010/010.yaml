id: JOS.10.10
reference: Joshua 10:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: pt
  text: E Yahweh os lançou em confusão diante de Israel[a], desferiu-lhes um grande golpe em Gibeão, perseguiu-os pelo caminho da subida de Bete-Horom e os feriu até Azeca e até Maquedá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os pôs em pânico” ou “os desbaratou”. O verbo hebraico indica causar confusão ou pânico em batalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: os lançou em confusão
  rationale: O verbo המם descreve a ação de causar confusão ou pânico em combate. A formulação preserva a causalidade divina sem reduzi-la apenas ao resultado militar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: diante de Israel
  rationale: Mantém a expressão hebraica, que pode indicar tanto a posição perante Israel quanto a ação ocorrida à sua vista ou em seu favor.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: feriu-os com grande matança
  rationale: No contexto de batalha, נכה e מכה comunicam um golpe militar devastador com mortes. A expressão portuguesa mantém a violência do relato sem transformar o texto em mera 'derrota'.
- source_word: בְּגִבְעוֹן
  choice: em Gibeão
  rationale: Forma portuguesa corrente do topônimo e preposição natural para indicar o local da batalha.
- source_word: וַיִּרְדְּפֵם
  choice: perseguiu-os
  rationale: Equivalente direto e natural do verbo רדף no contexto de perseguição militar.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: pelo caminho da subida de Bete-Horom
  rationale: 'Preserva os elementos topográficos do hebraico: caminho, subida e o nome do lugar.'
- source_word: וַיַּכֵּם עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: continuou a feri-los até Azeca e Maquedá
  rationale: O acréscimo idiomático 'continuou a' torna claro em português que a ação prosseguiu durante a perseguição, enquanto 'até' conserva a extensão geográfica marcada por עַד.
theological_decisions:
- issue: Representação do nome divino YHWH
  choice: Yahweh
  alternative: SENHOR ou Javé
  rationale: O texto hebraico traz explicitamente o Tetragrama. A transliteração 'Yahweh' conserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sujeito dos verbos de ferir e perseguir
  choice: Yahweh permanece como sujeito gramatical
  alternative: Israel ou os israelitas como sujeito implícito
  rationale: A sequência verbal hebraica não introduz um novo sujeito depois de nomear Yahweh. A tradução conserva essa continuidade, sem excluir que Israel tenha sido o agente humano da ação militar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas toponímicas usuais em português. A sintaxe narrativa foi levemente ajustada para fluidez, preservando a repetição da ação de ferir e a continuidade de Yahweh como sujeito.
