revisions:
- from: E Yahweh os lançou em confusão diante de Israel[a], feriu-os com grande matança em Gibeão, perseguiu-os pelo caminho da subida de Bete-Horom e continuou a feri-los até Azeca e Maquedá.
  to: E Yahweh os lançou em confusão diante de Israel[a], desferiu-lhes um grande golpe em Gibeão, perseguiu-os pelo caminho da subida de Bete-Horom e os feriu até Azeca e até Maquedá.
  rationale: A revisão melhora a idiomaticidade e remove uma explicitação aspectual não presente no texto hebraico. Mantém-se a repetição narrativa de «feriu», o sujeito Yahweh, os topônimos e a nota sobre a alternativa semântica de המם.
  reviewer_model: gpt-5.6-terra
