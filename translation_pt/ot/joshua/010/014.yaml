base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: pt
  text: E não houve dia como aquele, nem antes nem depois dele, em que Yahweh ouviu a voz de um homem[a], pois Yahweh lutou por Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atendeu ao pedido de um homem”. Em hebraico, literalmente: “ouviu a voz de um homem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה
  choice: E não houve
  rationale: Reproduz de modo natural a oração existencial negativa e mantém a ligação narrativa.
- source_word: כַּיּוֹם הַהוּא
  choice: dia como aquele
  rationale: Preserva a comparação marcada por כ e a singularidade daquele dia.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: nem antes nem depois dele
  rationale: Os sufixos retomam mais naturalmente 'dia'; a formulação portuguesa expressa a inexistência de paralelo em ambas as direções temporais.
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: em que Yahweh ouviu a voz de um homem
  rationale: Mantém a expressão hebraica e entende o infinitivo como a circunstância que tornou o dia incomparável, sem sugerir que Deus estivesse subordinado ao homem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e o distingue de títulos como 'Senhor'.
- source_word: כִּי
  choice: pois
  rationale: Introduz naturalmente a explicação do acontecimento extraordinário.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: lutava por Israel
  rationale: O nifal de לחם descreve Yahweh combatendo em favor de Israel; o imperfeito em português ressalta a ação em curso no contexto da batalha.
theological_decisions:
- issue: Sentido de לִשְׁמֹעַ ... בְּקוֹל אִישׁ
  choice: Yahweh ouviu a voz de um homem
  alternative: Yahweh atendeu ao pedido de um homem
  rationale: A tradução principal conserva a forma concreta e teologicamente tensa do hebraico. A nota apresenta o sentido contextual de acolher ou atender a fala, sem transformar a paráfrase em texto principal.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração preserva no texto o caráter de nome próprio do tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa natural. A repetição de 'Yahweh' acompanha o hebraico, e a nota preserva tanto o idioma literal quanto sua possível força contextual.
