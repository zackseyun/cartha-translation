base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: pt
  text: Então Josué, e todo o Israel com ele, passou de Libna para Laquis, acampou contra ela e lutou contra ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: partiram
  rationale: O verbo עבר expressa passar ou seguir adiante. Neste contexto de deslocamento militar entre cidades, “partiram” comunica de modo natural o avanço sem sugerir necessariamente a travessia de um rio ou obstáculo.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: e todo o Israel com ele
  rationale: Tradução direta da expressão coletiva, mantendo “Israel” como designação do povo ou contingente que acompanhava Josué.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: de Libna para Laquis
  rationale: O ה direcional em לָכִישָׁה indica movimento rumo a Laquis; “para Laquis” exprime naturalmente o destino em português.
- source_word: וַיִּחַן עָלֶיהָ
  choice: acamparam contra a cidade
  rationale: חנה significa acampar, e עַל, no contexto de ataque, indica uma posição militar hostil. A explicitação de “a cidade” evita a sequência pouco natural de pronomes femininos sem alterar o referente.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: e lutaram contra ela
  rationale: לחם no nifal significa lutar ou guerrear; com בּ, “lutaram contra ela” preserva o sentido adversativo e identifica Laquis como alvo.
