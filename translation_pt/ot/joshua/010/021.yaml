  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: pt
  text: Todo o povo voltou em segurança ao acampamento, para junto de Josué, em Maquedá. Ninguém disse uma palavra contra nenhum dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ninguém falou contra nenhum dos filhos de Israel”. O hebraico emprega literalmente a imagem de alguém “afiar a língua”.'
    reason: A nota registra tanto uma alternativa idiomática quanto a metáfora concreta do texto hebraico.
lexical_decisions:
- source_word: וַיָּשֻבוּ כָל־הָעָם
  choice: Todo o povo voltou
  rationale: שׁוּב descreve o retorno físico depois da perseguição; “voltou” é natural. עָם é mantido como “povo”, embora o contexto seja militar.
- source_word: אֶל־הַמַּחֲנֶה אֶל־יְהוֹשֻׁעַ מַקֵּדָה
  choice: ao acampamento, para junto de Josué, em Maquedá
  rationale: A sequência hebraica é compacta. A formulação portuguesa deixa claro que o povo regressou ao acampamento onde estava Josué, em Maquedá, sem alterar as relações locativas do texto.
- source_word: בְּשָׁלוֹם
  choice: em segurança
  rationale: Neste contexto, שָׁלוֹם indica que o povo regressou a salvo e sem sofrer dano. “Em segurança” comunica esse sentido com naturalidade; “em paz” seria uma alternativa mais formalmente próxima.
- source_word: לֹא־חָרַץ ... אֶת־לְשֹׁנוֹ
  choice: Ninguém disse uma palavra contra
  rationale: A expressão hebraica, literalmente relacionada a “afiar a língua”, é uma imagem para falar de modo hostil. A tradução principal transmite o sentido idiomático, enquanto a nota preserva a imagem do original.
- source_word: לִבְנֵי יִשְׂרָאֵל לְאִישׁ
  choice: contra nenhum dos filhos de Israel
  rationale: Com a negação, אִישׁ tem valor distributivo (“nenhum”). “Filhos de Israel” preserva a forma da designação nacional בני ישראל.
theological_decisions:
- issue: Designação pactual e nacional בני ישראל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A forma “filhos de Israel” mantém a expressão masculina plural do hebraico e sua ressonância bíblica, sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe compacta do hebraico foi discretamente explicitada, e a metáfora incomum foi preservada em nota.
