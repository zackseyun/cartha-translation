  text: וַ/יֻּגַּ֖ד לִ/יהוֹשֻׁ֣עַ לֵ/אמֹ֑ר נִמְצְאוּ֙ חֲמֵ֣שֶׁת הַ/מְּלָכִ֔ים נֶחְבְּאִ֥ים בַּ/מְּעָרָ֖ה בְּ/מַקֵּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/017.yaml
  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: pt
  text: 'E foi comunicado a Josué: “Os cinco reis foram encontrados escondidos[a] na caverna, em Maquedá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram encontrados escondendo-se na caverna, em Maquedá”. O particípio hebraico pode descrever tanto a ação de se esconder quanto o estado de estar escondido.
    reason: alternativa lexical
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: foi comunicado
  rationale: O passivo preserva a forma narrativa hebraica e não acrescenta um agente explícito; “comunicado” transmite naturalmente a ideia de que uma informação chegou a Josué.
- source_word: לִיהוֹשֻׁעַ
  choice: a Josué
  rationale: Mantém o destinatário da comunicação e emprega a forma portuguesa tradicional do nome.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em português atual, os dois-pontos introduzem de modo natural e digno o conteúdo da comunicação, sem a rigidez de “dizendo”.
- source_word: נִמְצְאוּ
  choice: foram encontrados
  rationale: Reproduz o passivo plural de מצא e apresenta a descoberta como evento narrado.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: os cinco reis
  rationale: Tradução direta do numeral em construção com o substantivo definido, referindo-se aos reis já mencionados.
- source_word: נֶחְבְּאִים
  choice: escondidos
  rationale: Expressa o estado dos reis quando foram encontrados, sem excluir totalmente a nuance dinâmica do particípio hebraico.
- source_word: בַּמְּעָרָה
  choice: na caverna
  rationale: Representa diretamente a preposição e o substantivo definido.
- source_word: בְּמַקֵּדָה
  choice: em Maquedá
  rationale: Indica a localização da caverna na localidade chamada Maquedá; a vírgula evita a sequência pouco natural “caverna em Maquedá” sem sugerir posse.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula hebraica לֵאמֹר foi vertida por pontuação natural, e a passiva inicial foi mantida para não introduzir um informante não especificado.
