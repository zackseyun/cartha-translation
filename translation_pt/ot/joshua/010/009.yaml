  text: וַ/יָּבֹ֧א אֲלֵי/הֶ֛ם יְהוֹשֻׁ֖עַ פִּתְאֹ֑ם כָּל הַ/לַּ֕יְלָה עָלָ֖ה מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/009.yaml
  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: pt
  text: Josué chegou até eles de repente[a], depois de ter subido de Gilgal durante toda a noite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “veio até eles de repente”. O verbo hebraico significa literalmente “veio” ou “chegou”; o contexto militar indica uma aproximação súbita do inimigo.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “subiu de Gilgal durante toda a noite”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: chegou até eles
  rationale: O verbo בוא significa basicamente “vir/chegar”, e אֶל indica direção, “a/até eles”. A formulação preserva o sentido literal e a possível neutralidade da expressão, enquanto o contexto militar comunica que se trata da aproximação ao inimigo.
- source_word: פִּתְאֹם
  choice: de repente
  rationale: Equivalente português direto e natural para o advérbio que expressa caráter súbito ou inesperado.
- source_word: כָּל הַלַּיְלָה
  choice: durante toda a noite
  rationale: Expressa claramente a duração contínua indicada pelo hebraico e soa natural em português moderno.
- source_word: עָלָה
  choice: ter subido
  rationale: Mantém o sentido topográfico básico de עלה, “subir”, sem acrescentar explicitamente a ideia de marcha, embora o deslocamento militar esteja claro no contexto.
- source_word: מִן הַגִּלְגָּל
  choice: de Gilgal
  rationale: Reproduz diretamente a origem do deslocamento e conserva a forma tradicional do topônimo em português.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A tradução conserva “subido” para refletir a indicação topográfica do hebraico e evita tornar a aproximação mais hostil do que o texto exige.
