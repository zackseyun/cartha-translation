base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: pt
  text: 'Eles fizeram assim e trouxeram da caverna até ele estes cinco reis: o rei de Jerusalém, o rei de Hebrom, o rei de Jarmute, o rei de Laquis e o rei de Eglom.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Eles fizeram assim
  rationale: Expressa de modo natural a fórmula narrativa de cumprimento da ordem anterior, preservando o sentido direto do hebraico.
- source_word: וַיֹּצִיאוּ
  choice: trouxeram da caverna
  rationale: O hifil de יצא significa fazer sair ou trazer para fora. Com o complemento de origem logo em seguida, esta formulação é clara e idiomática em português.
- source_word: אֵלָיו
  choice: até ele
  rationale: Preserva a direção expressa por אֶל e o referente pronominal sem explicitar Josué, cujo nome não aparece neste versículo, nem substituir a ideia por 'diante dele'.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: estes cinco reis
  rationale: Reproduz o numeral, o substantivo e o demonstrativo com ordem natural em português; 'reis' é o equivalente preciso de מְלָכִים.
- source_word: מִן הַמְּעָרָה
  choice: da caverna
  rationale: Traduz de forma concisa a origem espacial indicada por מִן, no contexto de retirar os reis do interior da caverna.
- source_word: מֶלֶךְ
  choice: rei
  rationale: Equivalente corrente e preciso do título real hebraico.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalém
  rationale: Forma consagrada do topônimo em português.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: יַרְמוּת
  choice: Jarmute
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: לָכִישׁ
  choice: Laquis
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: עֶגְלוֹן
  choice: Eglom
  rationale: Forma bíblica portuguesa corrente; neste contexto, designa a cidade cujo rei é mencionado.
