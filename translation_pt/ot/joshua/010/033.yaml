base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: pt
  text: Então Horão, rei de Gezer, subiu para ajudar Laquis, e Josué o feriu, juntamente com seu povo, até não lhe deixar nenhum sobrevivente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “remanescente”. O termo hebraico pode designar um sobrevivente ou alguém que restou.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a sequência narrativa de modo natural e direto em português.
- source_word: עָלָה
  choice: subiu
  rationale: Preserva o sentido básico de ascender ou avançar, sem explicitar além do hebraico a nuance militar.
- source_word: הֹרָם
  choice: Horão
  rationale: Forma portuguesa tradicional e inteligível do nome próprio hebraico.
- source_word: מֶלֶךְ גֶּזֶר
  choice: rei de Gezer
  rationale: Reproduz diretamente a cadeia construta que identifica o cargo e a cidade de Horão.
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: para ajudar Laquis
  rationale: Expressa com clareza a finalidade da movimentação de Horão; o marcador de objeto direto não é traduzido.
- source_word: וַיַּכֵּהוּ
  choice: mas Josué derrotou a ele
  rationale: No contexto bélico, נכה pode significar ferir ou derrotar. 'Derrotou' soa natural e evita a construção pouco idiomática 'feriu a ele'; 'mas' explicita o contraste narrativo implícito entre a tentativa de ajuda e seu fracasso.
- source_word: וְאֶת עַמּוֹ
  choice: e ao seu povo
  rationale: Mantém o termo amplo עַם sem restringi-lo interpretativamente a 'exército'.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: sem lhe deixar ... algum
  rationale: Transmite de modo idiomático o resultado ou a extensão total da ação, isto é, que ninguém lhe foi deixado.
- source_word: שָׂרִיד
  choice: sobrevivente
  rationale: É o equivalente mais natural neste contexto de extermínio; o possível sentido de 'remanescente' é preservado em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação conserva 'povo', em vez de estreitar para 'exército', e usa 'derrotou' para comunicar naturalmente o valor contextual do verbo hebraico.
