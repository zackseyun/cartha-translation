  text: וְ/אַתֶּם֙ אַֽל תַּעֲמֹ֔דוּ רִדְפוּ֙ אַחֲרֵ֣י אֹֽיְבֵי/כֶ֔ם וְ/זִנַּבְתֶּ֖ם אוֹתָ֑/ם אַֽל תִּתְּנ֗וּ/ם לָ/בוֹא֙ אֶל עָ֣רֵי/הֶ֔ם כִּ֧י נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: pt
  text: Quanto a vocês, não parem; persigam os seus inimigos e ataquem a retaguarda deles.[a] Não os deixem entrar nas cidades deles, pois Yahweh, o Deus de vocês, os entregou nas mãos de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atinjam os últimos da tropa” ou “ataquem os retardatários”. O verbo hebraico está ligado à ideia de “cauda” e indica atacar a parte final de uma força em fuga.
    reason: alternativa lexical
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Quanto a vocês
  rationale: O pronome independente com a conjunção introduz uma mudança enfática e contrastiva em relação à ação anterior; esta formulação a expressa naturalmente em português.
- source_word: אַל תַּעֲמֹדוּ
  choice: não parem
  rationale: Embora עמד tenha o sentido básico de ficar em pé, neste contexto militar a ordem é que não interrompam a perseguição.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: persigam os seus inimigos
  rationale: Reproduz de modo direto e corrente a expressão hebraica de perseguição.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: ataquem a retaguarda deles
  rationale: O verbo deriva da ideia de 'cauda' e, no contexto militar, indica golpear a parte traseira de uma força em fuga. A nota preserva alternativas possíveis.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: Não os deixem entrar
  rationale: נתן com infinitivo exprime aqui permissão; a formulação portuguesa comunica naturalmente a proibição.
- source_word: אֶל עָרֵיהֶם
  choice: nas cidades deles
  rationale: עיר designa cidades ou núcleos urbanos, provavelmente fortificados no contexto; 'deles' evita a ambiguidade pronominal de 'suas'.
- source_word: כִּי נְתָנָם
  choice: pois ... os entregou
  rationale: O perfeito apresenta a derrota dos inimigos como já assegurada pela ação divina; 'entregou' transmite bem o valor contextual do idioma de dar ao poder de alguém.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Expressa claramente o construto com sufixo de segunda pessoa do plural e evita a ambiguidade de 'seu Deus'.
- source_word: בְּיֶדְכֶם
  choice: nas mãos de vocês
  rationale: A expressão hebraica singular 'na mão de vocês' indica poder ou domínio. O plural é a forma idiomática natural em português e conserva a imagem.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; 'Yahweh' preserva o nome pessoal em transliteração sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com preferência por construções claras para leitores brasileiros. O imperativo plural foi vertido com 'vocês'; repetições de 'deles' e 'de vocês' evitam ambiguidades comuns dos possessivos em português.
