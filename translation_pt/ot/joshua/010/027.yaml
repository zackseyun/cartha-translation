base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: pt
  text: Quando chegou a hora de o sol se pôr[a], Josué deu a ordem, e eles os tiraram das árvores e os lançaram na caverna, ali onde tinham se escondido[b], e puseram grandes pedras sobre a boca da caverna, até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais conciso: «ao pôr do sol».'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz literalmente: «onde tinham se escondido ali», incluindo de forma explícita o advérbio «ali» para dar ênfase ao lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: Quando chegou a hora de o sol se pôr
  rationale: Reproduz a expressão temporal e a imagem do movimento do sol de modo natural em português. A alternativa mais condensada, «ao pôr do sol», é registrada em nota.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: Josué deu a ordem
  rationale: Expressa com naturalidade o ato de ordenar e prepara as ações executadas pelo sujeito plural seguinte.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: eles os tiraram das árvores
  rationale: É a formulação portuguesa comum para remover corpos que estavam pendurados em árvores, mantendo o movimento indicado pelo verbo hebraico.
- source_word: וַיַּשְׁלִכֻם
  choice: os lançaram
  rationale: Mantém a força direta do verbo hebraico «lançar, atirar» em registro narrativo digno e atual.
- source_word: הַמְּעָרָה
  choice: a caverna
  rationale: Equivalente corrente e preciso para o substantivo hebraico neste contexto.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: ali onde tinham se escondido
  rationale: A construção preserva tanto a relação locativa quanto o advérbio explícito שָׁם («ali»), sem produzir em português a redundância pouco elegante de «onde tinham se escondido ali».
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת
  choice: puseram grandes pedras
  rationale: Tradução clara e direta da ação de colocar pedras de grande tamanho.
- source_word: עַל פִּי הַמְּעָרָה
  choice: sobre a boca da caverna
  rationale: Conserva a metáfora hebraica de «boca» para a abertura da caverna e a ideia de que as pedras a cobriam ou bloqueavam.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: onde permanecem até o dia de hoje
  rationale: Explicita em português o estado contínuo das pedras, naturalmente subentendido no hebraico, e preserva o ponto de vista temporal do narrador.
