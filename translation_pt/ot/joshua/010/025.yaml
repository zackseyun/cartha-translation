base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: pt
  text: 'Então Josué lhes disse: “Não tenham medo nem desanimem. Sejam fortes e corajosos, pois é assim que Yahweh fará com todos os inimigos contra os quais vocês lutam.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: Então Josué lhes disse
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa essa progressão com naturalidade em português.
- source_word: אַל תִּירְאוּ
  choice: Não tenham medo
  rationale: Expressa de modo claro e corrente a proibição ligada a ירא.
- source_word: וְאַל תֵּחָתּוּ
  choice: nem fiquem apavorados
  rationale: חתת no nifal indica ser abalado, aterrorizado ou desfeito interiormente; “fiquem apavorados” distingue a expressão do medo já mencionado sem soar arcaico.
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Sejam fortes e corajosos
  rationale: Preserva a conhecida fórmula de exortação em Josué e distingue força de determinação corajosa.
- source_word: כִּי כָכָה
  choice: pois é assim que
  rationale: Mantém tanto a função explicativa de כִּי quanto a força demonstrativa e modal de כָּכָה em português natural.
- source_word: יַעֲשֶׂה יְהוָה
  choice: Yahweh fará
  rationale: O yiqtol tem sentido futuro no contexto; o nome divino é transliterado como Yahweh conforme a política do projeto.
- source_word: לְכָל אֹיְבֵיכֶם
  choice: com todos os inimigos
  rationale: Com עשה e ל, a construção descreve o que será feito aos inimigos; em português, “fará com” é natural e direto.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: contra os quais vocês lutarem
  rationale: A construção hebraica é suavizada segundo a sintaxe portuguesa, preservando o sentido adversativo; o futuro do subjuntivo é idiomático para os inimigos que ainda vierem a enfrentar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e segue a convenção estabelecida pelo projeto, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A formulação conserva o paralelismo das exortações e evita linguagem excessivamente arcaica.
