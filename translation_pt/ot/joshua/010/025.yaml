  to: 'Então Josué lhes disse: “Não tenham medo nem desanimem. Sejam fortes e corajosos, pois é assim que Yahweh fará com todos os inimigos contra os quais vocês lutam.”'
  rationale: A revisão conserva a estrutura e o sentido do hebraico, substituindo uma intensificação pouco necessária por uma formulação portuguesa natural para חתת e ajustando “lutarem” ao aspecto do particípio hebraico.
