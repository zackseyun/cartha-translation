base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: pt
  text: 'E Yahweh disse a Josué: “Não tenha medo deles, pois eu os entreguei em sua mão. Nenhum homem dentre eles resistirá diante de você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa padrão de אמר para introduzir discurso direto; “disse” é natural e preciso em português.
- source_word: אַל תִּירָא מֵהֶם
  choice: Não tenha medo deles
  rationale: Expressa de maneira corrente a proibição com ירא e o objeto do temor marcado por מן.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior com concisão e dignidade.
- source_word: בְיָדְךָ נְתַתִּים
  choice: eu os entreguei em suas mãos
  rationale: Mantém a imagem hebraica da mão como poder ou domínio. O perfeito expressa a decisão divina como já estabelecida, e o plural idiomático “suas mãos” soa natural em português.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Nenhum homem dentre eles resistirá
  rationale: Preserva אִישׁ como “homem” no contexto de uma força militar masculina; “resistirá” explicita o sentido militar de עמד sem alterar a promessa.
- source_word: בְפָנֶיךָ
  choice: diante de você
  rationale: Conserva a expressão espacial hebraica, enquanto o verbo “resistirá” comunica o valor militar do conjunto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
- issue: Representação de אִישׁ
  choice: homem
  alternative: ninguém
  rationale: O referente contextual são combatentes inimigos; por isso, o masculino lexical é pertinente e não precisa ser neutralizado.
- issue: Força temporal de נְתַתִּים
  choice: eu os entreguei
  alternative: eu os entrego
  rationale: O perfeito em fala divina apresenta a entrega como decisão consumada e certa, embora seu cumprimento histórico ainda se desenrole.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva o nome Yahweh e a metáfora hebraica de entrega nas mãos, enquanto “resistirá diante de você” comunica naturalmente o sentido militar da expressão.
