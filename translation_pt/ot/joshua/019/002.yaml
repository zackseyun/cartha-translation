  text: E eles tinham em sua herança Berseba[a], Seba e Moladá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Berseba e Seba”. Alguns entendem estas palavras como um único topônimo (“Berseba”), considerando a forma do texto uma irregularidade textual ou estilística, e não uma referência a duas cidades distintas.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: E eles tinham
  rationale: A construção idiomática com היה + ל indica posse ou atribuição; em português atual, “eles tinham” comunica isso com naturalidade.
- source_word: בְּנַחֲלָתָם
  choice: em sua herança
  rationale: נחלה designa a propriedade herdada ou o território atribuído à tribo; a formulação preserva a preposição hebraica e o contexto da lista territorial.
- source_word: בְּאֵר שֶׁבַע
  choice: Berseba
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do topônimo hebraico.
- source_word: וְשֶׁבַע
  choice: Seba
  rationale: O texto consonantal apresenta “e Seba” como item da lista. A possível irregularidade junto a Berseba é preservada em nota, sem ser resolvida no corpo do texto.
- source_word: וּמוֹלָדָה
  choice: e Moladá
  rationale: Transliteração do topônimo com acento gráfico para indicar a tonicidade natural em português; a conjunção final é mantida.
