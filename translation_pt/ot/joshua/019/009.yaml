  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: pt
  text: A herança dos filhos de Simeão[a] foi tirada da porção dos filhos de Judá, porque a parte dos filhos de Judá era grande demais para eles[b]. Assim, os filhos de Simeão receberam sua herança dentro da herança de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “filhos de Judá” e “filhos de Simeão”, designações tribais que também podem ser traduzidas como “tribo de Judá” e “tribo de Simeão”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a parcela territorial atribuída aos filhos de Judá era excessivamente grande para eles.
    reason: cultural_note
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: Da porção
  rationale: Em contextos de distribuição territorial, חֶבֶל designa uma porção de terra medida ou delimitada. “Porção” preserva essa ideia e se harmoniza com a linguagem de herança.
- source_word: נַחֲלַת
  choice: a herança
  rationale: נַחֲלָה frequentemente se refere, em Josué, à terra recebida como herança. “Herança” mantém a dimensão familiar e pactual do termo.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: os filhos de Judá / os filhos de Simeão
  rationale: Mantém a forma tribal literal do hebraico, natural e inteligível em linguagem bíblica portuguesa, sem substituí-la interpretativamente por “tribo”.
- source_word: חֵלֶק
  choice: a parte
  rationale: “Parte” distingue com naturalidade חֵלֶק de חֶבֶל e נַחֲלָה, sem perder o sentido de parcela territorial atribuída.
- source_word: רַב מֵ/הֶם
  choice: era grande demais para eles
  rationale: A expressão indica que a parte concedida a Judá excedia suas necessidades; esta formulação comunica de modo claro o valor comparativo e excessivo.
- source_word: וַ/יִּנְחֲלוּ
  choice: receberam sua herança
  rationale: No contexto da repartição da terra, o verbo נחל indica entrar na posse da herança territorial atribuída.
- source_word: בְּ/תוֹךְ נַחֲלָתָ/ם
  choice: dentro da herança de Judá
  rationale: “Dentro” expressa a localização interna indicada por בְּתוֹךְ. O referente do sufixo é explicitado como Judá para evitar a ambiguidade pronominal que surgiria em português.
