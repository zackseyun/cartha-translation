  source_fidelity: 'O sentido central é fiel ao hebraico: a herança de Simeão provém da porção de Judá, pois a parcela de Judá era excessivamente grande para eles, e Simeão recebeu herança dentro da herança de Judá. A explicitação de «Judá» na oração final resolve adequadamente o sufixo plural hebraico no português.'
