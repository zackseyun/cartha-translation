translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a terminologia de herança e as designações tribais literais do hebraico, mas explicita Judá no final para eliminar uma ambiguidade referencial não intencional em português.
