  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: pt
  text: Mas o território dos filhos de Dã se estendeu para além deles[a]. Então os filhos de Dã subiram e lutaram contra Lesém. Capturaram a cidade, feriram-na ao fio da espada, tomaram posse dela e habitaram nela. E deram a Lesém o nome de Dã[b], conforme o nome de Dã, pai deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fronteira dos filhos de Dã se estendeu para além deles”. Algumas traduções interpretam a frase como “o território dos filhos de Dã era pequeno demais para eles”, com base no contexto mais amplo; porém, a formulação hebraica é mais literalmente espacial.'
    reason: alternative_reading
  - marker: b
    text: Lesém é associada a Laís em Juízes 18.7, 14, 27, 29.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: o território dos filhos de Dã se estendeu para além deles
  rationale: גְבוּל pode designar fronteira ou território. No contexto da distribuição da terra, “território” comunica melhor o sentido. A difícil expressão מֵהֶם foi mantida com valor espacial, sem inserir no texto principal a interpretação contextual de que o território era pequeno demais.
- source_word: בְּנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva a expressão tribal e familiar do hebraico, de modo compreensível em português bíblico atual.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: עלה expressa subida geográfica ou movimento militar; “subiram” mantém ambos os possíveis matizes.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: lutaram contra Lesém
  rationale: A preposição עִם é literalmente “com”, mas neste contexto hostil o português natural pede “contra”.
- source_word: לֶשֶׁם
  choice: Lesém
  rationale: Translitera a forma do Texto Massorético neste versículo, sem substituí-la por Laís, nome associado ao lugar em Juízes 18.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: capturaram a cidade
  rationale: לכד é o verbo habitual para capturar uma cidade em contexto militar. A explicitação “a cidade” torna natural em português o sufixo feminino hebraico, cujo referente é Lesém enquanto cidade.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: feriram-na ao fio da espada
  rationale: Mantém a imagem da expressão hebraica, literalmente “à boca da espada”, por meio do equivalente português tradicional e inteligível “ao fio da espada”.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: tomaram posse dela
  rationale: ירשׁ pode significar possuir, herdar ou tomar posse. Aqui a conquista militar favorece “tomaram posse”, sem tornar explícita além do texto a ideia de desapropriação.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: habitaram nela
  rationale: ישׁב significa sentar-se, habitar ou morar. “Habitaram” é digno, claro e não acrescenta necessariamente a nuance de fundar um assentamento.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: deram a Lesém o nome de Dã
  rationale: Expressa naturalmente em português o ato de renomear a cidade, preservando Lesém e Dã na frase.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: conforme o nome de Dã, seu pai
  rationale: אָב pode significar pai ou antepassado. “Seu pai” conserva o idioma genealógico tribal do hebraico sem explicação interpretativa no texto principal.
