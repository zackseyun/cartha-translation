translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi dividida em períodos curtos para evitar uma cadeia pesada de conjunções, sem eliminar a sequência narrativa. Mantiveram-se o idioma tribal “filhos de Dã”, a imagem “ao fio da espada” e a ambiguidade espacial da primeira oração.
