  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: pt
  text: Por ordem de Yahweh, deram a Josué a cidade que ele havia pedido, Timnate-Sera, na região montanhosa de Efraim. Ele construiu[a] a cidade e morou nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reconstruiu”. O verbo hebraico normalmente significa “construir”, mas, neste contexto, também pode indicar que Josué restaurou ou reedificou a cidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: Por ordem de Yahweh
  rationale: A expressão idiomática עַל־פִּי indica direção ou ordem autorizada; “por ordem de” é natural em português e preserva esse sentido. O nome divino יְהוָה é transliterado como “Yahweh”.
- source_word: נָתְנוּ לוֹ
  choice: deram a Josué
  rationale: O hebraico diz literalmente “deram a ele”. O referente é Josué no contexto imediato; explicitar seu nome evita ambiguidade em português sem alterar o sentido.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: a cidade que ele havia pedido
  rationale: שׁאל significa “pedir” ou “solicitar”. O mais-que-perfeito composto indica com naturalidade que o pedido antecedeu a concessão.
- source_word: תִּמְנַת סֶרַח
  choice: Timnate-Sera
  rationale: Transliteração do topônimo em forma adaptada à leitura portuguesa, com hífen para representar a unidade do nome composto.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: הַר designa aqui uma área serrana ou montanhosa, não necessariamente um monte isolado.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: Ele construiu a cidade
  rationale: בנה significa primariamente “construir”. Como a cidade já existia, “reconstruiu” é contextualmente possível, mas não deve substituir sem indicação a formulação lexical mais direta.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: e passou a morar nela
  rationale: ישׁב pode significar “habitar”, “morar” ou “estabelecer-se”. A formulação escolhida expressa naturalmente a sequência narrativa em português.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz o Tetragrama como nome próprio. “Yahweh” o preserva por transliteração, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das ideias segue de perto o hebraico, enquanto construções idiomáticas evitam rigidez. O referente pronominal foi explicitado como Josué para maior clareza.
