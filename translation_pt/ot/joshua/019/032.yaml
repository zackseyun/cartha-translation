  text: לִ/בְנֵ֣י נַפְתָּלִ֔י יָצָ֖א הַ/גּוֹרָ֣ל הַ/שִּׁשִּׁ֑י לִ/בְנֵ֥י נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: pt
  text: Para os filhos de Naftali saiu[a] o sexto lote, para os filhos de Naftali, segundo os seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caiu”. O verbo hebraico significa literalmente “saiu” e, aqui, refere-se ao resultado do lançamento do lote.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: para os filhos de
  rationale: A preposição לְ indica os destinatários da porção, e “filhos de” preserva a expressão tribal hebraica, mantendo a repetição do original.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Transliteração portuguesa tradicional do nome próprio e tribal.
- source_word: יָצָא
  choice: saiu
  rationale: Reproduz de perto o sentido básico do verbo hebraico e é compreensível no contexto do resultado de um sorteio, sem substituí-lo pela formulação mais interpretativa “caiu”.
- source_word: הַגּוֹרָל
  choice: o lote
  rationale: Neste contexto, designa o lote lançado para determinar a distribuição da herança territorial.
- source_word: הַשִּׁשִּׁי
  choice: o sexto
  rationale: Tradução direta do ordinal que qualifica “lote”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחוֹת designa as subdivisões de parentesco dentro da tribo; “clãs” é mais preciso do que “famílias” no português atual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com preservação da estrutura repetitiva e da terminologia tribal do hebraico. O marcador [a] aparece imediatamente após o verbo ao qual a nota se refere.
