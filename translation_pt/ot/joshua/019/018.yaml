  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: pt
  text: A fronteira deles era Jezreel[a], Quesulote[b] e Suném.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico acrescenta a Jezreel uma terminação direcional, que pode indicar “em direção a Jezreel” ou “até Jezreel”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “A fronteira deles se estendia até Jezreel, Quesulote e Suném”, explicitando a nuance direcional do primeiro topônimo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: se estendia
  rationale: A forma narrativa de היה introduz a descrição seguinte. Em conjunto com גְּבוּלָם e o destino indicado no primeiro topônimo, “se estendia” produz uma descrição territorial natural em português.
- source_word: גְּבוּלָם
  choice: seu território
  rationale: גְּבוּל pode indicar tanto a linha de fronteira quanto a extensão territorial delimitada. Neste contexto de distribuição tribal e enumeração de localidades, “território” é natural, enquanto a nota preserva a alternativa mais formal “fronteira”.
- source_word: יִזְרְעֶאלָה
  choice: até Jezreel
  rationale: O ה direcional acrescentado ao topônimo indica orientação ou movimento para Jezreel. “Até Jezreel” comunica essa nuance de maneira concisa, sem afirmar um percurso específico.
- source_word: הַכְּסוּלֹת
  choice: Quesulote
  rationale: Topônimo transliterado segundo uma forma clara e tradicional em português; o artigo prefixado não é traduzido separadamente, pois integra a forma hebraica do nome.
- source_word: שׁוּנֵם
  choice: Suném
  rationale: Topônimo transliterado em forma corrente e legível em português.
