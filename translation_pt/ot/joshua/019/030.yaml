lexical_decisions:
- source_word: עֻמָה
  choice: Umá
  rationale: Topônimo transliterado de acordo com a forma hebraica e adaptado à ortografia e à pronúncia naturais do português.
- source_word: אֲפֵק
  choice: Afeque
  rationale: Forma tradicional e legível em português para o topônimo hebraico.
- source_word: רְחֹב
  choice: Reobe
  rationale: Transliteração portuguesa clara do topônimo, preservando os sons consonantais essenciais do hebraico.
- source_word: עָרִים
  choice: cidades
  rationale: Equivalente convencional em listas territoriais bíblicas, sem implicar que todas tivessem o mesmo tamanho.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: vinte e duas
  rationale: Reproduz diretamente o número cardinal hebraico e concorda com o substantivo feminino 'cidades'.
- source_word: חַצְרֵיהֶן
  choice: os povoados ao redor delas
  rationale: Expressa os assentamentos rurais dependentes associados às cidades; 'ao redor delas' comunica a relação sem sugerir necessariamente proximidade imediata.
