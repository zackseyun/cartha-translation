base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: pt
  text: 'Aim[a], Rimom, Éter e Asã: quatro cidades e seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico enumera quatro topônimos: Aim, Rimom, Éter e Asã. Alguns intérpretes comparam 1 Crônicas 4:32, onde “Aim-Rimom” pode ser entendido como um só nome, o que afeta a contagem das cidades.'
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: Aim
  rationale: Topônimo, não o substantivo comum “olho” ou “fonte”; adota-se a forma portuguesa tradicional e legível.
- source_word: רִמּוֹן
  choice: Rimom
  rationale: Topônimo transliterado segundo a forma corrente em português; não se traduz pelo sentido lexical “romã”.
- source_word: וָעֶתֶר
  choice: Éter
  rationale: Topônimo precedido pela conjunção; a acentuação gráfica favorece a pronúncia natural em português.
- source_word: וְעָשָׁן
  choice: e Asã
  rationale: Topônimo transliterado, preservando também a conjunção hebraica.
- source_word: עָרִים
  choice: cidades
  rationale: Termo comum para núcleos urbanos; é a tradução convencional e adequada ao resumo territorial.
- source_word: אַרְבַּע
  choice: quatro
  rationale: Tradução direta do numeral cardinal que quantifica as cidades.
- source_word: וְחַצְרֵיהֶן
  choice: com seus povoados
  rationale: No contexto das listas territoriais, חָצֵר indica assentamentos rurais dependentes das cidades; “povoados” é natural e abrangente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas portuguesas tradicionais dos topônimos. A construção concisa preserva o caráter de lista territorial do hebraico e mantém explícita, em nota, a dificuldade textual relacionada à contagem.
