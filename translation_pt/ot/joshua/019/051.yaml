source:
  edition: WLC
  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: pt
  text: Estas são as heranças que Eleazar, o sacerdote, Josué, filho de Num, e os chefes das famílias ancestrais das tribos dos filhos de Israel repartiram por sorteio em Siló, diante de Yahweh, à entrada da tenda do encontro. Assim terminaram de repartir a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: as heranças
  rationale: Preserva o sentido de propriedade recebida e de porção territorial atribuída, importante no contexto pactual e fundiário de Josué.
- source_word: נִחֲלוּ
  choice: repartiram
  rationale: Neste contexto, o verbo descreve a atribuição das porções territoriais; “repartiram” é natural em português e se combina bem com “por sorteio”.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: os chefes das famílias ancestrais
  rationale: Comunica a estrutura familiar e clânica do hebraico sem recorrer à expressão pouco natural “casas dos pais”.
- source_word: לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: das tribos dos filhos de Israel
  rationale: Mantém tanto a referência às tribos quanto a expressão hebraica masculina e representativa “filhos de Israel”.
- source_word: בְּגוֹרָל
  choice: por sorteio
  rationale: Expressa de forma clara e idiomática o método de distribuição mediante sortes.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: “Diante de” preserva a ideia de presença, e “Yahweh” translitera o nome divino do texto-fonte.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: à entrada da tenda do encontro
  rationale: Tradução transparente e natural da localização cultual indicada no hebraico.
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: Assim terminaram de repartir a terra
  rationale: Reproduz a progressão conclusiva da narrativa e distingue apenas pelo contexto, sem rigidez, a conclusão do processo já descrito.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Expressão de parentesco בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: Retém a forma tradicional e estruturalmente próxima do hebraico, sem eliminar sua expressão masculina representativa.
- issue: Sentido de אֹהֶל מוֹעֵד
  choice: tenda do encontro
  alternative: tenda da reunião; tenda da congregação
  rationale: “Encontro” comunica a função do lugar sem restringir מוֹעֵד à congregação humana ou a uma reunião comum.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe acompanha a enumeração hebraica, mas “famílias ancestrais” evita um hebraísmo opaco. Não foram necessárias notas de rodapé.
