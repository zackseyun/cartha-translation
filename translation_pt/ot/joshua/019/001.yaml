  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: pt
  text: A segunda sorte saiu para Simeão[a], para a tribo dos filhos de Simeão, segundo os seus clãs[b]; e a herança deles ficou dentro da herança dos filhos de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A segunda sorte caiu para Simeão”. O verbo hebraico significa literalmente “saiu” e, aqui, descreve o resultado do lançamento de sortes.'
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Simeão” e “filhos de Judá” são designações tribais hebraicas e se referem aos descendentes ou membros dessas tribos.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  choice: A segunda sorte saiu
  rationale: Preserva a imagem concreta do hebraico יצא, «sair», no contexto do lançamento de sortes, sem confundir a sorte lançada com o território posteriormente recebido.
- source_word: לְשִׁמְעוֹן
  choice: para Simeão
  rationale: A preposição לְ indica aqui o destinatário ou beneficiário da sorte; «para» é natural em português.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: para a tribo dos filhos de Simeão
  rationale: מַטֶּה significa «tribo» neste contexto, e «filhos de Simeão» mantém a forma genealógica e tribal do hebraico.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחוֹת designa as subdivisões sociais da tribo, mais amplas que a família nuclear moderna; «clãs» comunica essa estrutura com precisão.
- source_word: וַיְהִי נַחֲלָתָם
  choice: e a herança deles ficou
  rationale: היה introduz o estado ou resultado da distribuição. «Ficou» exprime naturalmente em português a localização resultante, sem acrescentar causalidade.
- source_word: בְּתוֹךְ נַחֲלַת בְּנֵי יְהוּדָה
  choice: dentro da herança dos filhos de Judá
  rationale: «Dentro» traduz claramente בְּתוֹךְ, enquanto a repetição de «herança» preserva o termo territorial e jurídico נַחֲלָה; «filhos de Judá» conserva a designação tribal hebraica.
