base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: pt
  text: Dali, a divisa passava para o leste[a], na direção do nascer do sol, até Gate-Hefer, até Ete-Cazim[b], e saía para Rimom[c], que se estendia até Neá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dali, passava para o leste”. O hebraico emprega duas expressões direcionais, literalmente “para o leste, para o nascer do sol”, provavelmente para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Ete-Cazim”; alguns entendem a forma como “Itá-Cazim”.'
    reason: alternative_reading
  - marker: c
    text: O hebraico desta oração é difícil, podendo ser entendido de modo mais literal como “Rimom, o demarcado, Neá”, ou algo semelhante. Muitos entendem que a divisa se estendia de Rimom até Neá.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Dali
  rationale: Expressa com naturalidade a progressão da descrição da divisa; o ו conjuntivo fica adequadamente representado pela sequência narrativa.
- source_word: עָבַר
  choice: a divisa seguia
  rationale: O sujeito está implícito no hebraico, mas o contexto territorial permite explicitá-lo em português para evitar ambiguidade; 'seguia' é idiomático em descrições de limites.
- source_word: קֵדְמָה מִזְרָחָה
  choice: para o leste, na direção do nascer do sol
  rationale: Mantém os dois termos direcionais do hebraico, provavelmente enfáticos, sem reduzi-los a uma única expressão.
- source_word: גִּתָּה חֵפֶר
  choice: Gate-Héfer
  rationale: Transliteração portuguesa reconhecível do topônimo composto, com acentuação que favorece a leitura.
- source_word: עִתָּה קָצִין
  choice: Ete-Cazim
  rationale: Trata a expressão massorética como um único topônimo e a translitera de modo legível em português; a incerteza da forma é registrada em nota.
- source_word: וְיָצָא
  choice: depois chegava
  rationale: Em fórmulas de limites, o verbo descreve o traçado alcançando ou saindo em determinado ponto; 'chegava' comunica essa função espacial naturalmente.
- source_word: רִמּוֹן
  choice: Rimom
  rationale: Transliteração portuguesa convencional do nome de lugar.
- source_word: הַמְּתֹאָר
  choice: que se estendia
  rationale: Interpreta prudentemente o particípio difícil no sentido de extensão da divisa, preservando em nota a incerteza do hebraico.
- source_word: הַנֵּעָה
  choice: até Neá
  rationale: Toma Neá como topônimo e a forma prefixada como indicação do ponto até o qual a divisa se estendia.
