base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: pt
  text: Então a fronteira mudava de direção para Ramá, até a cidade fortificada de Tiro; depois mudava de direção para Hosa, e seus pontos extremos chegavam em direção ao mar[a], a partir da região de Aczibe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em direção ao mar”; na linguagem geográfica hebraica, a expressão também pode significar “para o oeste”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do distrito” ou “do território de Aczibe”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: virava em direção a
  rationale: Em descrições de fronteiras, שׁוב assinala uma mudança no rumo da linha divisória; esta formulação é clara e natural em português.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: No contexto da distribuição territorial, גְּבוּל designa a linha que delimita a área atribuída.
- source_word: הָרָמָה
  choice: Ramá
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: וְעַד
  choice: e seguia até
  rationale: Expressa o alcance da fronteira até o ponto seguinte, tornando explícito em português o movimento implícito na descrição geográfica.
- source_word: עִיר מִבְצַר צֹר
  choice: a cidade fortificada de Tiro
  rationale: Preserva a construção que caracteriza Tiro como cidade dotada de fortificações, em português natural.
- source_word: חֹסָה
  choice: Hosa
  rationale: Transliteração simples do topônimo hebraico, adaptada à ortografia portuguesa.
- source_word: וִיהְיוּ תֹצְאֹתָיו
  choice: e seus pontos extremos ficavam
  rationale: תֹצָאוֹת, em fórmulas de limites territoriais, indica extremidades ou pontos terminais da fronteira; a tradução conserva o plural hebraico sem recorrer a um literalismo obscuro.
- source_word: הַיָּמָּה
  choice: junto ao mar
  rationale: No contexto dos pontos terminais da fronteira, a expressão indica que estes chegavam à costa; a nota registra a forma direcional mais literal e sua possível conotação ocidental.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: a partir da região de Aczibe
  rationale: חֶבֶל pode designar uma extensão territorial, região ou distrito; 'região' evita atribuir precisão administrativa que o hebraico não exige.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com períodos separados para facilitar a leitura da sequência geográfica. Foram usados os topônimos portugueses Ramá, Tiro, Hosa e Aczibe. As ambiguidades de הַיָּמָּה e חֶבֶל foram preservadas em notas colocadas nas expressões correspondentes.
