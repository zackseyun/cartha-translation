  yaml_path: translation/ot/joshua/019/046.yaml
  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: pt
  text: e as águas de Jarcom e Racom, com o território diante de Jope.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como o topônimo “Me-Jarcom”, em vez da expressão transparente “as águas de Jarcom”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com a fronteira” ou “com o limite”, diante de Jope.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵי
  choice: as águas de
  rationale: A vocalização massorética lê מֵי, forma construta plural de מַיִם, “águas”, e não a preposição “desde/de”. Em uma lista territorial, a expressão pode designar um curso ou conjunto de águas associado a Jarcom; a possibilidade de ser um topônimo é preservada em nota.
- source_word: הַיַּרְקוֹן
  choice: Jarcom
  rationale: Topônimo transliterado segundo formas bíblicas usuais em português; o artigo hebraico não precisa ser reproduzido diante do nome próprio.
- source_word: וְהָרַקּוֹן
  choice: e Racom
  rationale: Topônimo transliterado de modo legível em português, sem reproduzir mecanicamente o artigo hebraico.
- source_word: עִם
  choice: com
  rationale: Equivalente direto e natural da preposição, ligando os lugares mencionados à expressão territorial seguinte.
- source_word: הַגְּבוּל
  choice: o território
  rationale: גְּבוּל pode indicar limite, fronteira ou território. Neste catálogo de lugares, “território” comunica naturalmente a área em questão, sem eliminar a alternativa “fronteira”.
- source_word: מוּל
  choice: diante de
  rationale: Expressa a relação espacial de algo situado em frente ou defronte de outro lugar. “Diante de” é corrente e digno em português; “em frente a” também seria possível.
- source_word: יָפוֹ
  choice: Jope
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para o topônimo יָפוֹ.
