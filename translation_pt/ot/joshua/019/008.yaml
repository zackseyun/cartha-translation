base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: pt
  text: junto com todos os povoados ao redor destas cidades, até Baalate-Beer, Ramate-Neguebe.[a] Essa foi a herança da tribo dos filhos de Simeão, segundo os seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Baalate-Beer, isto é, Ramate-Neguebe”, entendendo o segundo nome como identificação do primeiro.
    reason: O hebraico permite que רָאמַת נֶגֶב seja uma aposição que identifique Baalate-Beer, mas também pode ser lido como outro nome na sequência.
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: junto com todos os povoados
  rationale: A conjunção liga o versículo à lista anterior; “junto com” expressa naturalmente essa adição. חֲצֵרִים designa aqui povoados dependentes ou não fortificados.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: ao redor dessas cidades
  rationale: Reproduz de modo conciso a localização dos povoados em torno das cidades mencionadas imediatamente antes.
- source_word: עַד
  choice: até
  rationale: No contexto geográfico, indica o limite ou a extensão alcançada pelos povoados.
- source_word: בַּעֲלַת בְּאֵר
  choice: Baalate-Beer
  rationale: O topônimo é transliterado, sem traduzir seus componentes, e ajustado às convenções ortográficas legíveis em português.
- source_word: רָאמַת נֶגֶב
  choice: Ramate-Neguebe
  rationale: A transliteração preserva o nome geográfico e evita decidir no texto principal se ele identifica Baalate-Beer por aposição ou designa outro local.
- source_word: זֹאת נַחֲלַת
  choice: Essa foi a herança
  rationale: A oração hebraica é nominal; “foi” é suprido naturalmente em português para resumir retrospectivamente a porção territorial descrita.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: da tribo dos filhos de Simeão
  rationale: מַטֵּה significa “tribo” neste contexto, enquanto “filhos de Simeão” preserva o enquadramento genealógico do hebraico.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחוֹת refere-se às subdivisões de parentesco dentro da tribo; “clãs” é preciso e compreensível.
