lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: Bete-Lebaote
  rationale: Nome de lugar transliterado em forma natural para leitores de português; evita traduzir de modo interpretativo o sentido literal do composto, «casa de leoas».
- source_word: שָׁרוּחֶן
  choice: Saruém
  rationale: Translitera o topônimo conforme o texto massorético deste versículo. A forma adapta o som hebraico ao uso ortográfico português sem confundi-la com a variante da lista paralela.
- source_word: עָרִים
  choice: cidades
  rationale: Equivalente tradicional e adequado em listas territoriais, embora alguns dos locais talvez fossem assentamentos pequenos.
- source_word: שְׁלֹשׁ עֶשְׂרֵה
  choice: treze
  rationale: Reprodução direta e idiomática do numeral cardinal hebraico.
- source_word: חַצְרֵיהֶן
  choice: seus povoados
  rationale: No contexto das listas de repartição territorial, refere-se a assentamentos dependentes, provavelmente não fortificados; «povoados» é claro e abrangente em português internacional.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e conciso, apropriado a uma lista geográfica. Os topônimos foram transliterados em formas legíveis para o público lusófono, e a fórmula final foi mantida natural sem perder a relação entre as cidades e seus povoados.
