  text: 'Bete-Lebaote e Saruém[a]: treze cidades, com seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz Saruém; Josué 15:32 apresenta a forma variante Silim numa lista paralela.
