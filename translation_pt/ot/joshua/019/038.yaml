base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: pt
  text: 'Irom, Migdal-El[a], Horem, Bete-Anate[b] e Bete-Semes[c]: dezenove cidades, com os seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-El significa literalmente “torre de Deus” ou “torre de El”.
    reason: lexical_alternative
  - marker: b
    text: Bete-Anate significa literalmente “casa de Anate”.
    reason: lexical_alternative
  - marker: c
    text: Bete-Semes significa literalmente “casa do sol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוֹן
  choice: Irom
  rationale: Topônimo transliterado em forma natural para leitores de língua portuguesa; a conjunção inicial abre a continuação da lista e não precisa ser representada por «e» neste recorte isolado.
- source_word: וּמִגְדַּל אֵל
  choice: Migdal-El
  rationale: Nome composto transliterado, em vez de traduzido; o hífen preserva sua estrutura.
- source_word: חֳרֵם
  choice: Horem
  rationale: Topônimo transliterado diretamente, com grafia legível em português.
- source_word: וּבֵית עֲנָת
  choice: Bete-Anate
  rationale: Topônimo composto transliterado segundo formas naturais em português, sem substituir o nome por seu sentido etimológico.
- source_word: וּבֵית שָׁמֶשׁ
  choice: Bete-Semes
  rationale: Topônimo composto transliterado segundo formas naturais em português; seu sentido literal fica em nota.
- source_word: עָרִים תְּשַׁע עֶשְׂרֵה
  choice: dezenove cidades
  rationale: Reproduz de modo idiomático a contagem hebraica; «cidades» é o termo convencional nas listas territoriais.
- source_word: וְחַצְרֵיהֶן
  choice: com os seus povoados
  rationale: No contexto da distribuição territorial, o termo designa núcleos menores ou aldeias dependentes das cidades mencionadas.
