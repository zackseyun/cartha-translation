  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: pt
  text: A fronteira deles subia para o oeste, até Marala; tocava em Dabesete e chegava ao ribeiro que fica diante de Jocneão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: subia
  rationale: Mantém a imagem topográfica do hebraico, comum nas descrições de fronteiras.
- source_word: לַיָּמָּה
  choice: para o oeste
  rationale: O hebraico diz literalmente 'em direção ao mar'; neste contexto geográfico, indica o oeste.
- source_word: וּפָגַע
  choice: tocava em / chegava a
  rationale: O verbo descreve a fronteira encontrando ou alcançando um ponto. A variação em português evita repetição rígida sem alterar o percurso.
- source_word: הַנַּחַל
  choice: ribeiro
  rationale: נחל pode designar um curso d'água ou seu vale; 'ribeiro' é natural e preserva o sentido geográfico sem pressupor fluxo permanente.
- source_word: עַל פְּנֵי
  choice: diante de
  rationale: Reproduz a relação espacial do hebraico, cuja orientação exata pode ser 'em frente a' ou 'defronte de'.
