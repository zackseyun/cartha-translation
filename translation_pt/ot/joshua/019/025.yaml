  verdict: revise
  source_fidelity: O hebraico diz literalmente que «o seu limite/fronteira foi» seguido de quatro topónimos. «Incluía» é uma explicitação possível, mas enfraquece a construção predicativa do texto. Sobretudo, בֶּטֶן corresponde a Béten/Beten, não a «Betém».
  naturalness: «A fronteira deles foi...» é claro e natural no registo bíblico-geográfico em português moderno. A lista coordenada é fluente.
  terminology: 'Helcate, Hali e Acsafe são formas portuguesas bíblicas adequadas para os topónimos. «Béten» distingue corretamente este lugar de Belém/Betém. Não é necessária nota de rodapé: a nota inglesa sobre a grafia tradicional inglesa de Akshaph não se transfere como questão lexical relevante para o português.'
  issues:
