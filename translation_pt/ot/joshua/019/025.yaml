    issue: «Betém» para וָבֶטֶן
    rationale: O topónimo hebraico é Beten (בֶּטֶן), tradicionalmente «Béten» em português, e não deve ser confundido com Belém/Betém.
  - severity: low
    issue: «incluía» em vez de «foi»
    rationale: O verbo היה introduz a relação «o seu limite foi [estes lugares]». «Foi» preserva mais diretamente a formulação e a concisão da lista de fronteira.
  revised_text: A fronteira deles foi Helcate, Hali, Béten e Acsafe.
