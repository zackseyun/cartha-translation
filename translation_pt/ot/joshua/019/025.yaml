lexical_decisions:
- source_word: וַיְהִי גְּבוּלָם
  choice: A fronteira deles incluía
  rationale: A construção introduz e continua a lista de localidades que delimitavam a herança. Em português, “incluía” expressa naturalmente a relação entre a fronteira e os lugares enumerados, sem confundir גְּבוּל com todo o território.
- source_word: חֶלְקַת
  choice: Helcate
  rationale: Topônimo transliterado em forma adaptada à leitura portuguesa, mantendo o som aproximado do hebraico.
- source_word: וַחֲלִי
  choice: Hali
  rationale: Topônimo transliterado; o H preserva de modo legível a distinção inicial do nome hebraico.
- source_word: וָבֶטֶן
  choice: Betém
  rationale: Topônimo adaptado à ortografia e à pronúncia correntes em português bíblico.
- source_word: וְאַכְשָׁף
  choice: Acsafe
  rationale: Topônimo adaptado à leitura portuguesa; “cs” representa de modo natural a sequência consonantal hebraica aproximada.
