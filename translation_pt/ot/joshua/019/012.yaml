base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: pt
  text: Então, a divisa mudou de direção de Saride para o leste[a], em direção ao nascer do sol, até a fronteira de Quesulote-Tabor; seguiu até Daberate e subiu até Jafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o leste, em direção ao oriente”; literalmente, “para o leste, o nascer do sol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Depois, ... a divisa mudou de direção
  rationale: Em descrições de limites, o verbo שׁוב indica aqui uma mudança no rumo da linha divisória. Explicitar “a divisa” produz português natural e evita sugerir que uma pessoa retornou.
- source_word: מִשָּׂרִיד
  choice: desde Saride
  rationale: O topônimo é transliterado em forma corrente em português; “desde” marca o ponto de partida deste trecho da divisa.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: para o leste, para o nascente
  rationale: A formulação mantém os dois elementos direcionais do hebraico e preserva a imagem do nascer do sol sem tornar a frase excessivamente literal.
- source_word: עַל גְּבוּל
  choice: até a fronteira de
  rationale: Neste contexto geográfico, על com גְּבוּל descreve a linha alcançando o limite territorial.
- source_word: כִּסְלֹת תָּבֹר
  choice: Quislote-Tabor
  rationale: Topônimo composto transliterado segundo convenções legíveis em português.
- source_word: וְיָצָא
  choice: seguiu até
  rationale: Em descrições territoriais, יצא pode indicar que uma divisa avança ou se estende até determinado ponto. “Seguiu até” comunica naturalmente esse movimento sem impor uma geometria específica.
- source_word: אֶל הַדָּבְרַת
  choice: até Daberate
  rationale: Topônimo transliterado; o artigo hebraico não é reproduzido, conforme o uso natural dos nomes de cidades em português.
- source_word: וְעָלָה
  choice: subiu até
  rationale: Preserva a indicação topográfica de ascensão expressa por עלה.
- source_word: יָפִיעַ
  choice: Jafia
  rationale: Transliteração do topônimo adaptada à leitura corrente em português.
