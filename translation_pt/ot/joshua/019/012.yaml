  - severity: low
    issue: «Desde Saride» e «Depois» são menos idiomáticos no contexto da rota da divisa.
    rationale: «De Saride» identifica diretamente o ponto de partida, e «Então» introduz naturalmente a sequência sem acrescentar nuance temporal desnecessária.
  revised_text: Então, a divisa mudou de direção de Saride para o leste[a], em direção ao nascer do sol, até a fronteira de Quesulote-Tabor; seguiu até Daberate e subiu até Jafia.
