  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: pt
  text: Para Issacar saiu a quarta sorte, para os filhos de Issacar, segundo seus clãs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: Para Issacar
  rationale: A preposição לְ indica a tribo à qual cabe o resultado do sorteio; “Para Issacar” é natural e preserva a ideia distributiva.
- source_word: יָצָא הַגּוֹרָל הָרְבִיעִי
  choice: saiu o quarto sorteio
  rationale: יָצָא significa literalmente “saiu”; no contexto, “saiu o quarto sorteio” conserva a imagem do processo de lançar sortes, enquanto “sorteio” evita a possível leitura moderna de “sorte” como fortuna ou destino.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: para os filhos de Issacar
  rationale: Mantém a expressão hebraica de descendência tribal, sem neutralizá-la como simples designação geográfica ou administrativa.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: No contexto da distribuição tribal, מִשְׁפָּחוֹת designa as subdivisões de parentesco da tribo; “clãs” comunica melhor essa estrutura do que o termo moderno mais amplo “famílias”.
