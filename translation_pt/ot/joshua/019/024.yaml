base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: pt
  text: A quinta sorte saiu para a tribo dos filhos de Aser, segundo os seus clãs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: saiu
  rationale: Preserva a imagem concreta do hebraico יצא, “sair”, sem explicitar de modo interpretativo o mecanismo de tirar a sorte.
- source_word: הַגּוֹרָל
  choice: a sorte
  rationale: גורל designa aqui a sorte lançada ou tirada para determinar a distribuição territorial; “sorte” preserva melhor o sentido imediato do que “porção” ou “território”.
- source_word: הַחֲמִישִׁי
  choice: quinta
  rationale: Ordinal feminino em português, concordando naturalmente com “sorte”.
- source_word: לְמַטֵּה
  choice: para a tribo
  rationale: Embora מַטֶּה possa significar literalmente “cajado”, neste contexto de distribuição territorial é a designação idiomática de uma tribo.
- source_word: בְנֵי אָשֵׁר
  choice: dos filhos de Aser
  rationale: Mantém a linguagem genealógica formal do hebraico e funciona como designação tradicional da tribo.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחוֹת indica os agrupamentos familiares internos da tribo, e a preposição לְ tem aqui sentido distributivo; “clãs” é mais específico do que “famílias”.
