  rationale: Topônimo em uma lista de cidades; transliterado segundo uma forma natural em português, sem tentar traduzir um nome cujo sentido não é explicitado no contexto.
- source_word: עֵין גַּנִּים
  choice: En-Ganim
  rationale: Nome composto de עֵין ('fonte, nascente') e גַּנִּים ('jardins'). Como funciona aqui como topônimo, é transliterado; o hífen torna visível sua composição.
- source_word: עֵין חַדָּה
  choice: En-Hadá
  rationale: Topônimo composto que começa com עֵין ('fonte, nascente'). O segundo elemento é preservado por transliteração, pois sua tradução semântica neste nome é incerta.
- source_word: בֵית פַּצֵּץ
  choice: Bete-Pazez
  rationale: Topônimo composto com בֵית ('casa de'). A transliteração é preferível numa lista geográfica; o hífen ajuda a indicar a estrutura do nome.
- source_word: וְ
  choice: e
  rationale: As conjunções coordenam os nomes. Em português natural, usam-se vírgulas e apenas um 'e' antes do último item.
