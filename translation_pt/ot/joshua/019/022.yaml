base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: pt
  text: 'A fronteira alcançava Tabor[a], Saazuma e Bete-Semes; e terminava no Jordão[b]: dezesseis cidades com seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tocava” ou “encontrava”; o verbo hebraico pode indicar que uma linha de fronteira entra em contato com determinado lugar.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as saídas da fronteira deles eram o Jordão”, fórmula territorial que indica o ponto terminal ou a extensão da fronteira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: A fronteira alcançava
  rationale: Em descrições territoriais, פגע indica que uma linha de fronteira chega a um lugar ou entra em contato com ele. “Alcançava” expressa naturalmente essa relação espacial em português.
- source_word: בְּתָבוֹר
  choice: Tabor
  rationale: Nome geográfico transliterado segundo a forma tradicional em português.
- source_word: וְשַׁחֲצוּמָה
  choice: Saazuma
  rationale: Nome geográfico transliterado de modo legível em português, com base na forma consonantal hebraica.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: Adota-se a forma tradicional portuguesa do topônimo, em vez de traduzir literalmente seu significado.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: e terminava no Jordão
  rationale: A expressão literal fala das “saídas” ou “extremidades” da fronteira; nesta fórmula geográfica, indica seu ponto terminal ou limite.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: dezesseis cidades
  rationale: Tradução direta da construção cardinal hebraica.
- source_word: וְחַצְרֵיהֶן
  choice: com seus povoados
  rationale: חָצֵר, em listas territoriais, designa assentamentos dependentes, muitas vezes não murados. “Povoados” é claro e não impõe uma classificação administrativa moderna.
