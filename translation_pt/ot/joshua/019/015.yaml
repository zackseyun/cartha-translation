base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: pt
  text: 'Catate, Naalal, Simrom, Idala e Belém[a]: doze cidades com os seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Belém é aqui um nome de lugar, não uma expressão traduzida como «casa de pão».
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: Catate
  rationale: Nome de lugar transliterado segundo convenções naturais do português, sem tradução etimológica.
- source_word: נַהֲלָל
  choice: Naalal
  rationale: Topônimo transliterado de modo a refletir a forma hebraica e manter leitura natural em português.
- source_word: שִׁמְרוֹן
  choice: Sinrom
  rationale: Forma portuguesa tradicional e legível do topônimo hebraico.
- source_word: יִדְאֲלָה
  choice: Idala
  rationale: Transliteração portuguesa do nome de lugar, com a vogal inicial representando o yod consonantal conforme uso corrente em nomes bíblicos.
- source_word: בֵית לָחֶם
  choice: Belém
  rationale: Forma portuguesa consagrada do topônimo; não se traduz literalmente como «casa de pão».
- source_word: עָרִים
  choice: cidades
  rationale: Equivalente convencional para assentamentos nomeados nas listas territoriais.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: doze
  rationale: Número cardinal traduzido diretamente e em ordem natural no português.
- source_word: חַצְרֵיהֶן
  choice: os seus povoados
  rationale: No contexto das listas territoriais, designa assentamentos dependentes, provavelmente menores ou não murados; «povoados» comunica isso sem impor precisão indevida.
