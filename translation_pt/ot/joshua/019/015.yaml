  source_fidelity: A enumeração, o total de doze cidades e a expressão «com os seus povoados» refletem adequadamente o hebraico עָרִים שְׁתֵּים עֶשְׂרֵה וְחַצְרֵיהֶן. Os topônimos Catate, Naalal, Idala e Belém são aceitáveis. Contudo, «Sinrom» não reproduz corretamente שִׁמְרוֹן, cujo segundo radical é mem (מ), não nun (נ).
  naturalness: O texto é conciso, claro e natural em português moderno. «Cidades com os seus povoados» mantém bem o estilo de lista territorial; o possessivo pode permanecer para explicitar a ligação presente no sufixo hebraico.
