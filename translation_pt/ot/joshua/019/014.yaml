  naturalness: «A fronteira contornou aquele lugar, pelo norte, até Hanatom» é natural e claro em português moderno. «Seus extremos ficavam no vale» preserva o plural hebraico e soa mais idiomático do que «chegavam ao vale» para indicar a localização dos pontos terminais.
  terminology: «Fronteira», «extremos», «vale» e os topônimos «Hanatom» e «Iftá-El» são adequados. A âncora da nota sobre «suas saídas» deve acompanhar «extremos», o termo que ela explica.
