  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: pt
  text: Então, a fronteira contornou aquele lugar, pelo norte, até Hanatom[a], e seus extremos[b] ficavam no vale de Iftá-El.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ao norte de Hanatom». A expressão hebraica pode ser entendida como indicando a posição da fronteira ao norte de Hanatom ou seu percurso pelo norte até Hanatom.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «suas saídas», expressão usada em descrições de fronteiras para indicar suas extremidades ou pontos terminais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Então ... contornava
  rationale: Em descrições de fronteiras, o verbo indica que a linha limítrofe muda de direção ou faz uma curva ao redor de um ponto; «contornava» expressa isso naturalmente em português.
- source_word: אֹתוֹ
  choice: aquele lugar
  rationale: O pronome retoma um ponto geográfico da descrição anterior. A explicitação evita o ambíguo «o» sem acrescentar uma identificação ausente do hebraico.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: No contexto da divisão territorial, o termo designa a linha que delimita o território.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: pelo norte de Hanatom
  rationale: A expressão pode situar o percurso no lado norte de Hanatom; «pelo norte de» preserva esse sentido posicional e admite, em nota, a possibilidade direcional.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: e seus extremos chegavam
  rationale: O substantivo plural é um termo técnico de delimitação para as extremidades ou pontos terminais da fronteira. A formulação mantém o plural hebraico e produz uma frase natural.
- source_word: גֵּי
  choice: vale de
  rationale: O substantivo designa um vale ou desfiladeiro e aqui integra a designação geográfica.
- source_word: יִפְתַּח אֵל
  choice: Iftá-El
  rationale: O topônimo é transliterado em forma legível para falantes de português, sem ser traduzido.
