lexical_decisions:
- source_word: זֹאת
  choice: Esta foi
  rationale: O demonstrativo feminino retoma a herança territorial recém-descrita. O passado se ajusta ao resumo narrativo em português, embora a construção nominal hebraica também permita uma tradução formal no presente.
- source_word: נַחֲלַת
  choice: herança
  rationale: No contexto da distribuição da terra em Josué, o termo designa a porção territorial recebida como patrimônio; “herança” preserva melhor a dimensão familiar e pactual do que “território atribuído”.
- source_word: מַטֵּה
  choice: tribo
  rationale: Neste contexto, é a designação convencional de uma unidade tribal, e não o sentido concreto de “vara” ou “cajado”.
- source_word: בְנֵי אָשֵׁר
  choice: filhos de Aser
  rationale: Mantém a expressão filial hebraica de identidade tribal, que é clara e tradicional sem deixar de ser compreensível em português moderno.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: O substantivo indica as subdivisões familiares da tribo, e a preposição tem aqui valor distributivo ou classificatório.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: essas cidades
  rationale: A expressão aponta retrospectivamente para as cidades já enumeradas. Em português, “essas” realiza naturalmente essa referência ao conteúdo anterior.
- source_word: וְחַצְרֵיהֶן
  choice: e os seus povoados
  rationale: O termo pode indicar núcleos rurais ou lugares dependentes, muitas vezes não murados, ligados às cidades mencionadas. “Povoados” comunica essa relação sem impor tamanho ou estatuto excessivamente específicos.
