  text: וַ/יְהִ֣י גְבוּלָ֗/ם מֵ/חֵ֨לֶף מֵֽ/אֵל֜וֹן בְּ/צַעֲנַנִּ֗ים וַ/אֲדָמִ֥י הַנֶּ֛קֶב וְ/יַבְנְאֵ֖ל עַד לַקּ֑וּם וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: pt
  text: A fronteira deles ia desde Helefe[a], desde o carvalho de Zaananim, passando por Adami-Neguebe e Jabneel, até Lacum; e terminava no Jordão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde Elon-Bezaananim”; o hebraico pode ser entendido como um nome de lugar ou como “o carvalho de Zaananim”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico, literalmente: “suas saídas eram o Jordão”, expressão que indica que os pontos extremos da fronteira chegavam ao Jordão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: A fronteira deles
  rationale: גְּבוּל designa a linha limítrofe do território; “fronteira” é natural e clara em português neste contexto.
- source_word: מֵחֵלֶף
  choice: desde Helefe
  rationale: Nome próprio de lugar, transliterado segundo formas legíveis em português.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: desde o carvalho de Zaananim
  rationale: אֵלוֹן pode indicar uma grande árvore, como carvalho ou terebinto. A construção foi entendida como substantivo comum seguido do topônimo, mantendo-se em nota a leitura alternativa como nome composto.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: passando por Adami-Neguebe
  rationale: A sequência favorece um topônimo composto; “passando por” explicita naturalmente a progressão da lista de marcos sem alterar o percurso descrito.
- source_word: וְיַבְנְאֵל
  choice: e Jabneel
  rationale: Nome próprio transliterado; a conjunção hebraica foi preservada.
- source_word: עַד לַקּוּם
  choice: até Lacum
  rationale: עַד assinala a extensão da fronteira até esse lugar.
- source_word: תֹצְאֹתָיו הַיַּרְדֵּן
  choice: terminava no Jordão
  rationale: Literalmente, “suas saídas eram o Jordão”; em descrições de fronteiras, o idioma indica o ponto terminal ou limite alcançado.
