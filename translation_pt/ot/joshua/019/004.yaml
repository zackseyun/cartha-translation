lexical_decisions:
- source_word: אֶלְתּוֹלַד
  choice: Eltolade
  rationale: Nome próprio de uma cidade na lista territorial. A forma portuguesa «Eltolade» segue a transliteração bíblica corrente e acrescenta uma vogal final para leitura natural em português.
- source_word: בְתוּל
  choice: Betul
  rationale: Nome próprio de lugar, transliterado diretamente do hebraico como «Betul»; evita-se a forma inglesa «Bethul», pois o ת aqui é representado naturalmente por «t» em português.
- source_word: חָרְמָה
  choice: Hormá
  rationale: Nome próprio de lugar. «Hormá» é a forma portuguesa corrente, com acento para indicar a tonicidade final correspondente à forma hebraica.
- source_word: וְ / וּ
  choice: e
  rationale: As conjunções prefixadas coordenam os nomes. Em português natural, usam-se vírgulas entre os primeiros itens e «e» antes do último.
