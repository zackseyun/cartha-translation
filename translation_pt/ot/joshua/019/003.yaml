- source_word: בָלָה
  choice: Balá
  rationale: Topônimo transliterado diretamente da forma massorética deste versículo, com acento gráfico para indicar naturalmente em português a tonicidade final.
- source_word: עָצֶם
  choice: Ezém
  rationale: Topônimo transliterado de modo a refletir a vocalização massorética; o acento gráfico indica a tonicidade final na leitura portuguesa.
- source_word: וּ / וָ
  choice: e
  rationale: A conjunção hebraica coordena os nomes da lista; em português, usa-se vírgula entre os dois primeiros e “e” antes do último.
