- source_word: שַׁעֲלַבִּין
  choice: Saalabim
  rationale: Topônimo transliterado em forma natural para leitores de português. A forma leva em conta o nome relacionado Saalbim, preservando a terminação consonantal específica deste versículo.
- source_word: אַיָּלוֹן
  choice: Aijalom
  rationale: Transliteração portuguesa que representa de modo acessível a pronúncia aproximada do topônimo hebraico; a terminação com m segue a ortografia portuguesa para o som nasal final.
- source_word: יִתְלָה
  choice: Itla
  rationale: Transliteração direta e concisa do topônimo hebraico, sem importar a forma inglesa tradicional Jethlah.
