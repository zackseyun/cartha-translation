lexical_decisions:
- source_word: וַיְהִי
  choice: E ... abrangia
  rationale: O waw consecutivo dá continuidade à narrativa. Em português, “E” preserva essa ligação, enquanto “abrangia” introduz naturalmente a lista de cidades que compunham ou demarcavam a herança.
- source_word: גְּבוּל
  choice: fronteira
  rationale: No contexto da distribuição territorial em Josué, o termo designa a fronteira ou os limites da porção tribal; “fronteira” é claro e natural em português.
- source_word: נַחֲלָתָם
  choice: herança deles
  rationale: Preserva o sentido de porção territorial recebida por herança. O sufixo masculino plural remete aos danitas mencionados no contexto anterior.
- source_word: צָרְעָה
  choice: Zorá
  rationale: Transliteração portuguesa corrente do topônimo hebraico, com acento para orientar a pronúncia.
- source_word: אֶשְׁתָּאוֹל
  choice: Estaol
  rationale: Transliteração portuguesa corrente e legível do topônimo hebraico.
- source_word: עִיר שָׁמֶשׁ
  choice: Ir-Semes
  rationale: O topônimo composto é transliterado no texto principal, sem substituir o nome pelo significado; sua composição transparente é explicada em nota.
