  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: pt
  text: E o limite da herança deles era Zorá, Estaol e Ir-Semes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ir-Semes significa “cidade do sol”.
