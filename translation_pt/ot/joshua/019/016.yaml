  text: זֹ֛את נַחֲלַ֥ת בְּנֵֽי זְבוּלֻ֖ן לְ/מִשְׁפְּחוֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/016.yaml
  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: pt
  text: 'Esta foi[a] a herança dos filhos de Zebulom, segundo os seus clãs: essas cidades e os seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta é a herança”. O hebraico apresenta uma oração sem verbo, que nesta fórmula de resumo pode ser traduzida tanto no presente quanto no passado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Esta foi
  rationale: O demonstrativo feminino singular retoma a herança territorial que acaba de ser enumerada. O passado se ajusta ao contexto narrativo, embora a oração hebraica sem verbo também permita o presente.
- source_word: נַחֲלַת
  choice: a herança
  rationale: No contexto da distribuição da terra, נַחֲלָה designa a porção recebida como posse hereditária; “herança” preserva tanto o sentido jurídico quanto o pactual.
- source_word: בְּנֵי זְבוּלֻן
  choice: os filhos de Zebulom
  rationale: Mantém a expressão genealógica literal do hebraico, empregada coletivamente para os descendentes e a tribo de Zebulom.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: A preposição לְ indica aqui distribuição ou classificação, e מִשְׁפָּחוֹת se refere às subdivisões do grupo tribal.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: essas cidades
  rationale: A expressão definida resume os centros urbanos enumerados anteriormente. “Essas” retoma naturalmente, em português, os lugares já mencionados.
- source_word: וְחַצְרֵיהֶן
  choice: e os povoados ao redor delas
  rationale: חָצֵר, nas listas territoriais, denota assentamentos rurais dependentes das cidades. A formulação explicita de modo natural essa relação sem sugerir apenas pátios ou recintos.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Os dois-pontos apresentam naturalmente “essas cidades e os povoados” como resumo explicativo da herança mencionada.
