  text: וַ/יְכַלּ֥וּ לִ/נְחֹל אֶת הָ/אָ֖רֶץ לִ/גְבֽוּלֹתֶ֑י/הָ וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל נַחֲלָ֛ה לִ/יהוֹשֻׁ֥עַ בִּן נ֖וּן בְּ/תוֹכָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: pt
  text: Quando terminaram de repartir a terra como herança, segundo as suas fronteiras[a], os filhos de Israel[b] deram a Josué, filho de Num, uma herança entre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo as suas divisões territoriais”. O termo hebraico pode destacar tanto as linhas de fronteira como as divisões territoriais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os israelitas”. Literalmente: “os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ
  choice: Quando terminaram
  rationale: O verbo narrativo de כלה indica a conclusão da distribuição e introduz naturalmente, em português, a ação seguinte.
- source_word: לִנְחֹל
  choice: de repartir ... como herança
  rationale: Neste contexto, נחל se refere à distribuição da terra como herança entre as tribos, não apenas à tomada de posse.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto de Josué, designa a terra distribuída a Israel.
- source_word: לִגְבוּלֹתֶיהָ
  choice: segundo os seus territórios
  rationale: O plural de גְּבוּל pode indicar as divisões territoriais da terra, embora também possa destacar suas linhas de fronteira.
- source_word: וַיִּתְּנוּ
  choice: deram
  rationale: Preserva o sentido comum de נתן; o objeto e o contexto deixam claro que se trata de uma concessão oficial.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão nacional convencional do hebraico; a forma idiomática 'os israelitas' é registrada em nota.
- source_word: נַחֲלָה
  choice: uma herança
  rationale: Preserva a dimensão jurídica e teológica de uma porção de terra recebida por atribuição.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: a Josué, filho de Num
  rationale: Forma portuguesa corrente para o nome e o patronímico.
- source_word: בְּתוֹכָם
  choice: entre eles
  rationale: Expressa que a herança de Josué foi concedida no âmbito da comunidade e de suas porções territoriais.
theological_decisions:
- issue: Tradução de בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha conserva a forma da designação nacional hebraica sem excluir em nota a equivalência idiomática.
- issue: Nuance de נַחֲלָה no contexto da distribuição da terra
  choice: uma herança
  alternative: uma porção; uma propriedade
  rationale: “Herança” mantém a nuance jurídica e teológica da terra recebida como porção atribuída.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação “repartir a terra como herança” explicita naturalmente o valor distributivo de נחל, enquanto “territórios” preserva a referência às divisões da terra sem eliminar a alternativa “fronteiras”.
