lexical_decisions:
- source_word: צִקְלַג
  choice: Ziclague
  rationale: Nome próprio de lugar, transliterado segundo a forma tradicional e legível em português.
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: Bete-Marcabote
  rationale: Topônimo composto, literalmente relacionado a “casa das carruagens”; numa lista de cidades, preserva-se o nome por transliteração, com o sentido lexical em nota.
- source_word: חֲצַר סוּסָה
  choice: Hazar-Susa
  rationale: Topônimo composto cujo primeiro elemento pode indicar povoado, aldeia ou recinto, e cujo segundo se relaciona a cavalo; preserva-se o nome na lista e registra-se o sentido provável em nota.
- source_word: וְ / וּ / וַ
  choice: e
  rationale: As formas da conjunção hebraica ligam os nomes sucessivos da lista e são vertidas naturalmente por “e”.
