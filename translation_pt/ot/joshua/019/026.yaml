base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: pt
  text: Alameleque, Amade e Misal; a divisa chegava ao Carmelo, a oeste[a], e a Sior-Libnate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “em direção ao mar”; neste contexto geográfico, isto é, para o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַמֶּלֶךְ
  choice: Alameleque
  rationale: Nome de lugar transliterado em forma adaptada à ortografia e à pronúncia portuguesas.
- source_word: עַמְעָד
  choice: Amade
  rationale: Nome de lugar transliterado de modo legível em português, sem tentar traduzir o topônimo.
- source_word: מִשְׁאָל
  choice: Misal
  rationale: Topônimo transliterado segundo uma forma portuguesa clara e concisa.
- source_word: וּפָגַע
  choice: a divisa chegava
  rationale: Em descrições territoriais, פגע indica que uma linha de fronteira alcança ou encontra determinado ponto. O sujeito implícito foi explicitado como “a divisa” para clareza natural em português.
- source_word: בְּכַרְמֶל
  choice: ao Carmelo
  rationale: A preposição, em conjunto com o verbo de delimitação, marca o ponto alcançado pela divisa; “ao Carmelo” expressa naturalmente esse movimento.
- source_word: הַיָּמָּה
  choice: a oeste
  rationale: A expressão significa literalmente “em direção ao mar”, mas funciona geograficamente como indicação do oeste, por referência ao Mediterrâneo. A tradução contextual aparece no texto, e o sentido literal é preservado em nota.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: e a Sior-Libnate
  rationale: Topônimo composto transliterado e ligado por hífen; “a” mantém o sentido da sequência de pontos alcançados pela divisa.
