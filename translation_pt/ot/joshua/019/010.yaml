  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: pt
  text: A terceira sorte saiu para os filhos de Zebulom[a], segundo os seus clãs, e a fronteira da herança deles se estendia até Saride.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi tirada”. O hebraico diz literalmente que a sorte “subiu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: saiu
  rationale: No contexto do lançamento de sortes, “a sorte saiu” é idiomático em português e preserva a ideia de que determinado resultado emergiu, sem recorrer ao literal pouco natural “subiu”.
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: a terceira sorte
  rationale: Mantém o ordinal e o sentido técnico da sorte lançada para determinar a distribuição da terra.
- source_word: לִבְנֵי זְבוּלֻן
  choice: para os filhos de Zebulom
  rationale: Conserva a expressão tribal e genealógica do hebraico, natural na linguagem bíblica portuguesa.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Neste contexto tribal, מִשְׁפָּחָה designa as subdivisões do povo; “segundo” expressa a distribuição correspondente a elas.
- source_word: גְּבוּל נַחֲלָתָם
  choice: a fronteira da herança deles
  rationale: “Fronteira” indica a linha limítrofe, e “herança” preserva a noção da terra recebida como porção hereditária.
- source_word: עַד שָׂרִיד
  choice: até Saride
  rationale: “Até” expressa naturalmente a extensão geográfica indicada por עַד; o topônimo é transliterado conforme o uso português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico amplamente compreensível. “Zebulom” e “Saride” seguem formas portuguesas correntes; “se estendia” torna explícita de modo natural a função geográfica da fronteira sem alterar o conteúdo.
