  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: pt
  text: 'Esta foi a herança da tribo dos descendentes de Naftali, segundo os seus clãs: as cidades e os seus povoados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Esta é a herança». A oração nominal hebraica não explicita o tempo verbal; o passado foi usado por se tratar do resumo da lista precedente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Esta foi
  rationale: O demonstrativo feminino retoma a herança territorial recém-descrita. Em português, o passado soa natural nesta fórmula conclusiva, embora o hebraico, por ser uma oração nominal, também permita «Esta é».
- source_word: נַחֲלַת
  choice: a herança
  rationale: No contexto da distribuição da terra em Josué, o termo designa a porção territorial recebida como herança e conserva melhor a dimensão pactual do que «lote».
- source_word: מַטֵּה
  choice: a tribo
  rationale: Neste contexto, מַטֶּה é a designação convencional de uma tribo, não o sentido literal de «bastão».
- source_word: בְנֵי נַפְתָּלִי
  choice: dos descendentes de Naftali
  rationale: A expressão significa literalmente «dos filhos de Naftali», mas funciona como designação genealógica dos membros da tribo. «Descendentes» comunica isso naturalmente sem sugerir exclusão das mulheres.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Em contextos tribais e de distribuição territorial, מִשְׁפָּחָה designa o clã, e a preposição לְ indica organização ou distribuição segundo esses clãs.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עִיר é convencionalmente traduzido como «cidade» nas fórmulas territoriais de Josué, embora algumas localidades fossem pequenas.
- source_word: וְחַצְרֵיהֶן
  choice: e os povoados ao redor delas
  rationale: חָצֵר refere-se aqui aos assentamentos rurais dependentes vinculados às cidades. A formulação deixa claro que eram localidades associadas, não «pastagens».
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Descendentes de Naftali» traduz funcionalmente a expressão genealógica literal «filhos de Naftali»; «clãs» preserva a estrutura social tribal. O marcador [a] aparece no texto principal.
