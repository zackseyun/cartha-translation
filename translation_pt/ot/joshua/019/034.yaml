base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: pt
  text: Então a fronteira virava para o oeste, até Aznote-Tabor, e dali seguia até Hucoque. Alcançava Zebulom ao sul e Aser a oeste, e Judá, junto ao Jordão, a leste, na direção do nascer do sol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz: “e Judá, junto ao Jordão, a leste”. A geografia é difícil, pois, no sentido habitual, Naftali não fazia fronteira direta com o território tribal de Judá. Alguns entendem a expressão de outra maneira ou consideram que há aqui um problema textual; a tradução mantém a redação hebraica tal como está.'
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Então a fronteira virava
  rationale: Em descrições de limites, שׁוב indica normalmente uma mudança de direção. O imperfeito em português apresenta naturalmente o percurso da fronteira, enquanto “então” preserva a progressão do hebraico.
- source_word: יָמָּה
  choice: para o oeste
  rationale: Literalmente, “em direção ao mar”; como o Mediterrâneo serve de referência ocidental, a expressão geográfica natural em português é “para o oeste”.
- source_word: אַזְנוֹת תָּבוֹר
  choice: Aznote-Tabor
  rationale: Nome geográfico transliterado em forma legível em português.
- source_word: וְיָצָא מִשָּׁם חוּקֹקָה
  choice: e dali seguia até Hucoque
  rationale: יצא em fórmulas de fronteira descreve o prosseguimento da linha. “Seguia” é idiomático e evita o literalismo pouco natural “saía”.
- source_word: וּפָגַע
  choice: Alcançava
  rationale: פגע, em descrições territoriais, indica que uma fronteira chega a um território ou entra em contato com ele.
- source_word: בִּזְבֻלוּן מִנֶּגֶב
  choice: Zebulom ao sul
  rationale: A expressão indica o contato com Zebulom no lado sul da fronteira.
- source_word: וּבְאָשֵׁר פָּגַע מִיָּם
  choice: e Aser a oeste
  rationale: מִיָּם é literalmente “do lado do mar” e, neste contexto, designa o oeste.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן
  choice: e Judá, junto ao Jordão
  rationale: Mantém a menção explícita a Judá no texto massorético e associa a expressão ao Jordão sem corrigir por conjectura a geografia difícil.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: a leste, na direção do nascer do sol
  rationale: Preserva tanto o valor direcional quanto a imagem hebraica do nascer do sol.
theological_decisions:
- issue: A expressão geograficamente difícil “e Judá, junto ao Jordão, a leste”
  choice: Manter no texto principal a redação massorética, incluindo a referência a Judá.
  alternative: Emendar o nome “Judá”, entendê-lo como referência indireta a assentamentos associados a Judá ou reformular a frase para evitar um contato territorial direto.
  rationale: O território de Naftali não fazia fronteira direta com o território tribal de Judá no entendimento geográfico habitual. Como a redação hebraica recebida menciona Judá, a tradução preserva a dificuldade e a informa em nota, sem harmonização conjectural.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecíveis dos nomes bíblicos. A sintaxe foi suavizada apenas o necessário para a leitura corrente, preservando a sequência da descrição territorial e a dificuldade textual no fim do versículo.
