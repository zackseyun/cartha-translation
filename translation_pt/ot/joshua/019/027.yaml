  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: pt
  text: Depois, a divisa voltava-se para o leste, em direção ao nascer do sol, até Bete-Dagom; alcançava Zebulom e o vale de Iftá-El, para o norte, até Bete-Emek e Neiel; então se estendia até Cabul, à esquerda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “da esquerda”. Em descrições de limites, isso pode indicar o lado norte, conforme a orientação adotada.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: Depois, a divisa virava
  rationale: Em descrições de limites, שׁוב indica normalmente uma mudança de direção. A explicitação de “a divisa” torna claro o referente implícito sem alterar o sentido.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: para o leste, em direção ao nascer do sol
  rationale: Expressa a direção leste e conserva a imagem hebraica do nascer do sol. O uso direcional da construção favorece esta leitura no contexto geográfico.
- source_word: בֵּית דָּגֹן
  choice: Bete-Dagom
  rationale: Transliteração adaptada às convenções fonéticas e bíblicas do português.
- source_word: וּפָגַע בִּזְבֻלוּן
  choice: alcançava Zebulom
  rationale: Em textos de fronteira, פגע descreve o contato da linha divisória com um território ou ponto geográfico.
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: e o vale de Iftá-El
  rationale: Traduz גֵי por “vale” e translitera o topônimo, mantendo a sequência dos marcos territoriais.
- source_word: צָפוֹנָה
  choice: ao norte
  rationale: Conserva a indicação direcional sem determinar além do texto se ela qualifica todo o percurso ou especificamente a localização do vale.
- source_word: בֵּית הָעֵמֶק וּנְעִיאֵל
  choice: passando por Bete-Emek e Neiel
  rationale: Os topônimos são transliterados; “passando por” integra naturalmente os marcos na descrição do trajeto.
- source_word: וְיָצָא אֶל כָּבוּל
  choice: então seguia até Cabul
  rationale: Na fórmula de limites, יצא indica que a linha se estende ou prossegue até outro ponto. “Seguia até” é natural em português geográfico.
- source_word: מִשְּׂמֹאל
  choice: à esquerda
  rationale: Mantém o sentido concreto do hebraico, sem substituir no texto principal a orientação relativa por uma interpretação geográfica.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe própria de uma descrição territorial. Os nomes geográficos foram transliterados em formas legíveis para o público lusófono. O marcador da nota foi colocado junto a “à esquerda”, expressão à qual a nota efetivamente se refere.
