  source_fidelity: 'A tradução reproduz com precisão a fórmula conclusiva hebraica: זֹאת é adequadamente vertido por “Esta foi”; נַחֲלַת por “herança”; מַטֵּה בְנֵי־דָן por “tribo dos filhos de Dã”; לְמִשְׁפְּחֹתָם por “segundo os seus clãs”; e o resumo final das cidades e de seus assentamentos é preservado. O uso de “com” para a conjunção final comunica naturalmente a relação entre as cidades e seus povoados, sem perda material de sentido.'
