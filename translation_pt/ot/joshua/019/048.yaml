  terminology: “Herança” preserva bem o valor territorial e patrimonial de נַחֲלָה neste contexto. “Tribo”, “filhos de Dã”, “clãs”, “cidades” e “povoados” são terminologicamente adequados e consistentes com uma tradução de equivalência ótima. A nota de rodapé apresenta uma alternativa lexical legítima para “herança”.
