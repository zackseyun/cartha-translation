source:
  edition: WLC
  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם הֶֽ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: pt
  text: 'Esta foi a herança[a] da tribo dos filhos de Dã, segundo os seus clãs: estas cidades com os seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porção atribuída”. O termo hebraico pode destacar tanto a parte territorial designada quanto seu caráter de patrimônio herdado.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Esta foi
  rationale: O demonstrativo feminino singular retoma a porção territorial anteriormente descrita. Em português, o pretérito soa natural nesta fórmula conclusiva, embora o presente também seja possível.
- source_word: נַחֲלַת
  choice: a herança
  rationale: No contexto da distribuição da terra em Josué, o termo designa uma porção territorial recebida como patrimônio; “herança” preserva melhor essa dimensão do que o termo mais administrativo “porção atribuída”.
- source_word: מַטֵּה
  choice: da tribo
  rationale: Neste contexto, o termo tem o sentido estabelecido de unidade tribal, e não o sentido literal de “cajado”.
- source_word: בְנֵי דָן
  choice: dos filhos de Dã
  rationale: Mantém de forma clara e digna a expressão hebraica de filiação coletiva, sem substituir por um gentílico.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Em listas tribais e territoriais, o termo se refere às subdivisões de parentesco da tribo, não apenas a famílias nucleares.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: estas cidades
  rationale: Reproduz diretamente a expressão demonstrativa que resume a lista precedente.
- source_word: וְחַצְרֵיהֶן
  choice: com os seus povoados
  rationale: O termo indica assentamentos dependentes ou menores ligados às cidades; “povoados” é claro em português internacional e evita sugerir necessariamente uma organização rural específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do hebraico. Emprega “clãs” para as subdivisões tribais e “povoados” para os assentamentos dependentes. O tempo passado foi adotado naturalmente na fórmula de resumo.
