  source_fidelity: A formula nominal hebraica é bem representada por «Esta foi», com a nota preservando a possibilidade do presente. «Herança», «tribo», «clãs» e «cidades» correspondem adequadamente aos termos da fórmula de repartição territorial. Contudo, «ao redor delas» acrescenta uma relação espacial que não é explicitamente afirmada por וְחַצְרֵיהֶן, que significa «seus povoados/vilas»; a relação de dependência pode ser contextual, mas não deve ser explicitada no texto.
  naturalness: A redação é clara e de registro apropriado. «As cidades e seus povoados» é natural em português moderno e evita a explicitação geográfica desnecessária.
