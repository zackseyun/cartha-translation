  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי יִשָּׂשכָ֖ר לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: pt
  text: 'Esta foi a herança da tribo dos filhos de Issacar[a], segundo os seus clãs: as cidades e seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Esta é a herança...». Em hebraico, a frase não contém verbo expresso e pode ser traduzida no presente ou no passado.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Esta foi
  rationale: O demonstrativo feminino singular retoma a herança territorial descrita. Embora o hebraico não tenha verbo expresso, o pretérito é natural em português como fórmula conclusiva da narrativa.
- source_word: נַחֲלַת
  choice: a herança
  rationale: No contexto de Josué, designa o território recebido como posse hereditária; “herança” preserva melhor a dimensão pactual do que o termo meramente administrativo “lote”.
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: da tribo dos descendentes de Issacar
  rationale: מַטֵּה significa “tribo” neste contexto. “Descendentes de Issacar” comunica naturalmente em português a identidade genealógica expressa literalmente por “filhos de Issacar”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Refere-se às subdivisões da tribo, e a preposição לְ tem aqui sentido distributivo.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: É a tradução convencional de עָרִים nas listas territoriais de Josué, sem implicar necessariamente cidades de tamanho moderno.
- source_word: וְחַצְרֵיהֶן
  choice: e os povoados ao redor delas
  rationale: חֲצֵרִים designa assentamentos rurais dependentes das cidades; a formulação deixa clara a relação geográfica e administrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação preserva a fórmula territorial de Josué sem rigidez excessiva; “clãs” mantém a estrutura tribal, e “povoados ao redor delas” esclarece o sentido contextual dos assentamentos dependentes.
