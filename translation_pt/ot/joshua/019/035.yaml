  text: וְ/עָרֵ֖י מִבְצָ֑ר הַ/צִּדִּ֣ים צֵ֔ר וְ/חַמַּ֖ת רַקַּ֥ת וְ/כִנָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: pt
  text: 'As cidades fortificadas eram: Zidim, Zer, Hamate, Racate e Quinerete.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: As cidades fortificadas
  rationale: A combinação em estado construto designa cidades dotadas de fortificações. Em português atual, “cidades fortificadas” é mais natural do que “cidades-fortaleza”; o וְ dá continuidade à enumeração, sem exigir um “e” no início do versículo.
- source_word: הַ/צִּדִּים
  choice: Zidim
  rationale: Transliteração portuguesa do topônimo, sem reproduzir o artigo hebraico, que não é natural numa lista de cidades.
- source_word: צֵר
  choice: Zer
  rationale: Transliteração direta e legível do nome próprio hebraico.
- source_word: וְ/חַמַּת
  choice: Hamate
  rationale: Forma aportuguesada tradicional e legível do topônimo; o contexto o distingue da cidade de Hamate mencionada em outras passagens.
- source_word: רַקַּת
  choice: Racate
  rationale: Transliteração adaptada à ortografia portuguesa, preservando de modo legível a pronúncia aproximada do topônimo.
- source_word: וְ/כִנָּרֶת
  choice: Quinerete
  rationale: Forma portuguesa clara do topônimo כִנֶּרֶת, coerente com o uso bíblico em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com topônimos adaptados à ortografia portuguesa. Os dois-pontos introduzem naturalmente a lista de cidades. Não se incluiu a nota inglesa sobre “fortress cities”, pois ela reflete uma alternativa estilística em inglês; em português, “cidades-fortaleza” não acrescenta uma diferença lexical relevante em relação a “cidades fortificadas”.
