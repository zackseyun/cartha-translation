- source_word: אָבֶץ
  choice: Ebes
  rationale: Topônimo transliterado em forma corrente e pronunciável em português; a variante «Abes» preserva mais diretamente a vogal inicial massorética e é registrada em nota.
- source_word: וְ / וָ
