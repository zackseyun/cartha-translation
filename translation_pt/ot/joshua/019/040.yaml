  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: pt
  text: Para a tribo dos filhos de Dã, segundo os seus clãs, saiu a sétima sorte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: Para a tribo de
  rationale: No contexto da distribuição territorial em Josué, מַטֶּה designa uma tribo, e o prefixo לְ indica aqui o grupo ao qual a sorte foi destinada.
- source_word: בְנֵי דָן
  choice: os filhos de Dã
  rationale: Preserva de modo transparente a expressão hebraica de parentesco, sem substituí-la pelo gentílico interpretativo 'danitas'.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחוֹת refere-se às subdivisões sociais da tribo; 'clãs' comunica melhor esse sentido do que o moderno e mais doméstico 'famílias'.
- source_word: יָצָא
  choice: saiu
  rationale: Reproduz o sentido básico do verbo e é compreensível no contexto do sorteio, preservando a imagem hebraica em vez de empregar 'caiu'.
- source_word: הַגּוֹרָל
  choice: a sorte
  rationale: Em português, 'sorte' é o termo bíblico corrente para o objeto ou resultado de um sorteio usado na distribuição de terras.
- source_word: הַשְּׁבִיעִי
  choice: a sétima
  rationale: O ordinal concorda naturalmente com o substantivo feminino 'sorte' e indica a sequência da distribuição.
