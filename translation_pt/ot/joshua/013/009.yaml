  text: from Aroer, which is on the edge of the Arnon Valley, and the city that is in the middle of the valley, and all the tableland from Medeba to Dibon,
translation:
  language: pt
  text: desde Aroer, que fica à beira do vale do Arnom, e a cidade que fica no meio do vale, e todo o planalto desde Medeba até Dibom,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: à beira do vale do Arnom
  rationale: שפה indica a borda ou margem; נחל pode designar tanto o curso de água quanto o vale por onde corre. Aqui, a referência territorial favorece a expressão natural e geograficamente abrangente “vale do Arnom”.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: no meio do vale
  rationale: Preserva a formulação espacial do hebraico sem identificar de modo indevido a cidade ou precisar se ficava numa ilha, margem ou leito.
- source_word: הַמִּישֹׁר
  choice: o planalto
  rationale: No contexto geográfico de Moabe, refere-se à região elevada e relativamente plana a leste do Jordão; “planalto” é claro e corrente.
- source_word: וְכָל
  choice: incluindo todo
  rationale: O waw introduz mais um componente da extensão territorial. “Incluindo” torna natural em português a continuidade da enumeração iniciada no versículo anterior.
