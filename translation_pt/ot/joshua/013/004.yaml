  text: מִ/תֵּימָ֞ן כָּל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֗י וּ/מְעָרָ֛ה אֲשֶׁ֥ר לַ/צִּידֹנִ֖ים עַד אֲפֵ֑קָ/ה עַ֖ד גְּב֥וּל הָ/אֱמֹרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: pt
  text: desde o sul, toda a terra dos cananeus, e Meará[a], que pertence aos sidônios, até Afeque, até a fronteira dos amorreus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “e a caverna que pertence aos sidônios”, se מְעָרָה for entendido como substantivo comum, e não como nome de lugar.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, “o cananeu” e “o amorreu” aparecem no singular como termos coletivos; em português, foram traduzidos no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: desde o sul
  rationale: תֵּימָן designa comumente o sul ou a região meridional; nesta descrição territorial, o sentido geográfico é mais provável que o topônimo Temã.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: toda a terra dos cananeus
  rationale: O singular étnico hebraico tem valor coletivo. O plural em português comunica esse valor com naturalidade sem substituir a expressão por “terra de Canaã”.
- source_word: וּמְעָרָה
  choice: e Meará[a]
  rationale: No contexto da lista territorial, מְעָרָה é provavelmente um topônimo. A transliteração preserva essa leitura, enquanto a nota registra o possível sentido comum de “caverna”.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: que pertence aos sidônios
  rationale: A construção com ל indica relação de posse ou pertencimento; esta formulação é clara e natural em português.
- source_word: עַד אֲפֵקָה
  choice: até Afeque
  rationale: עַד indica extensão até um ponto limítrofe, e o sufixo direcional do topônimo é adequadamente expresso pela preposição “até”.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: até a fronteira dos amorreus[b]
  rationale: גְּבוּל, numa descrição territorial, é bem representado por “fronteira”; o singular étnico hebraico é coletivo e por isso se verte naturalmente no plural.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas toponímicas usuais em português (“Meará”, “Afeque”) e gentílicos correntes (“sidônios”, “cananeus”, “amorreus”). A estrutura repetida “até... até...” foi mantida para refletir a progressão do hebraico.
