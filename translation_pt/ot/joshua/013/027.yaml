  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: pt
  text: e, no vale, Bete-Harã, Bete-Nimra, Sucote e Zafom — o restante do reino de Seom, rei de Hesbom —, com o Jordão como limite, até a extremidade[a] do mar de Quinerete, do outro lado do Jordão, a leste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «até a extremidade sul do mar de Quinerete».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: e, no vale
  rationale: עֵמֶק designa um vale ou uma região baixa; “no vale” introduz naturalmente a região onde ficavam as cidades enumeradas.
- source_word: בֵּית הָרָם ... וּ/בֵית נִמְרָה ... וְ/סֻכּוֹת וְ/צָפוֹן
  choice: Bete-Harã, Bete-Nimra, Sucote e Zafom
  rationale: São topônimos. Foram transliterados em formas naturais e reconhecíveis em português; צָפוֹן é tratado como nome próprio, não como o substantivo comum “norte”.
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: o restante do reino de Seom, rei de Hesbom
  rationale: יֶתֶר significa “restante” ou “remanescente”, e מַמְלָכוּת é adequadamente vertido por “reino” neste resumo territorial.
- source_word: הַיַּרְדֵּן וּ/גְבֻל
  choice: tendo o Jordão como limite
  rationale: A construção hebraica é compacta e aposicional; a formulação explicita com naturalidade que o Jordão servia de fronteira.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: até a extremidade sul do mar de Quinerete
  rationale: קְצֵה indica a extremidade. No contexto geográfico do vale e do curso do Jordão, trata-se da extremidade inferior, isto é, sul, do lago; a nota preserva a formulação lexical menos específica.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: do outro lado do Jordão, a leste
  rationale: A fórmula territorial situa a região na margem oriental do Jordão; esta redação conserva tanto a ideia de travessia quanto a direção expressa no hebraico.
theological_decisions: []
