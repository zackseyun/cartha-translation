  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: pt
  text: Com ele, os rubenitas e os gaditas receberam sua herança, que Moisés lhes deu do outro lado do Jordão, a leste[a], conforme Moisés, servo de Yahweh, lhes havia dado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, na margem oriental do Jordão.
    reason: cultural_note
lexical_decisions:
- source_word: עִמּוֹ
  choice: Junto com ele
  rationale: Mantém o pronome masculino singular do hebraico e sua referência contextual à meia tribo de Manassés, sem explicitar no corpo do versículo o antecedente.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: os rubenitas e os gaditas
  rationale: Os gentílicos estão morfologicamente no singular, mas têm sentido coletivo; o plural é a forma natural em português para designar as tribos.
- source_word: לָקְחוּ
  choice: receberam
  rationale: O verbo pode significar tomar ou receber; com נַחֲלָה, 'receberam a herança' expressa naturalmente a obtenção da porção territorial concedida.
- source_word: נַחֲלָתָם
  choice: a herança
  rationale: Preserva o sentido de porção territorial recebida por direito e a ressonância pactual do termo, em vez de reduzi-lo a mera posse.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: do outro lado do Jordão, a leste
  rationale: Traduz a expressão geográfica de modo claro e corrente; 'a leste' identifica inequivocamente a margem oriental.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Conserva a relação comparativa e confirmatória introduzida pela conjunção hebraica.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Mantém o título honorífico de Moisés e translitera o nome divino pessoal presente no texto hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' preserva sua função de nome pessoal, em vez de substituí-lo por um título.
- issue: Sentido de נַחֲלָה no contexto da terra
  choice: herança
  alternative: posse
  rationale: '''Herança'' mantém tanto o caráter de porção territorial concedida quanto sua dimensão pactual, sem acrescentar uma interpretação denominacional.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição da concessão por Moisés foi mantida por corresponder à estrutura enfática do hebraico; o mais-que-perfeito composto na segunda ocorrência esclarece naturalmente a anterioridade no discurso.
