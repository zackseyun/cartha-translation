revisions:
- from: Junto com ele, os rubenitas e os gaditas receberam a herança que Moisés lhes deu do outro lado do Jordão, a leste[a], assim como Moisés, servo de Yahweh, lhes havia dado.
  to: Com ele, os rubenitas e os gaditas receberam sua herança, que Moisés lhes deu do outro lado do Jordão, a leste[a], conforme Moisés, servo de Yahweh, lhes havia dado.
  rationale: A revisão explicita o possessivo presente no hebraico, torna a abertura mais concisa e ajusta a construção comparativa final para um português mais natural, sem alterar a referência contextual de «ele» nem o sentido da concessão mosaica.
