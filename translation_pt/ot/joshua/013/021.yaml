  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: pt
  text: e todas as cidades do planalto[a], e todo o reino de Seom, rei dos amorreus, que reinava em Hesbom e a quem Moisés derrotou[b], juntamente com os chefes de Midiã — Evi, Requém, Zur, Hur e Reba —, príncipes de Seom[c] que habitavam na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as cidades da planície» ou «as cidades da região plana».
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «feriu»; neste contexto militar, a expressão significa que Moisés os derrotou decisivamente.'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega dois termos diferentes de título: «chefes de Midiã» (נְשִׂיאֵי) e «príncipes de Seom» (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: as cidades do planalto
  rationale: מִישׁוֹר designa aqui a região plana e elevada da Transjordânia. “Planalto” comunica melhor a topografia regional do que o termo mais genérico “planície”.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: o reino de Seom
  rationale: מַמְלְכוּת denota reino ou domínio real; “reino” é a tradução direta e natural.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: rei dos amorreus
  rationale: Preserva de modo natural em português a relação da cadeia construta hebraica.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: que reinava em Hesbom
  rationale: מָלַךְ significa exercer a realeza; “reinava” é mais específico do que “governava”.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: a quem Moisés derrotou
  rationale: No contexto militar, נכה indica ferir ou abater e, por extensão, derrotar decisivamente. “Derrotou” é claro em português e evita sugerir apenas um golpe físico.
- source_word: נְשִׂיאֵי מִדְיָן
  choice: os chefes de Midiã
  rationale: נָשִׂיא pode indicar chefe, líder ou príncipe. “Chefes” expressa a posição e mantém distinção em relação a נְסִיכֵי mais adiante.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: Evi, Requém, Zur, Hur e Reba
  rationale: Os nomes próprios são transliterados em formas legíveis em português, com acentuação gráfica em Requém para orientar a pronúncia.
- source_word: נְסִיכֵי סִיחוֹן
  choice: príncipes de Seom
  rationale: נָסִיךְ denota príncipe ou governante subordinado. “Príncipes” é conciso e preserva a diferença lexical em relação a “chefes”.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: que habitavam naquela terra
  rationale: O particípio de ישׁב indica residência. “Habitavam” conserva o sentido, e “naquela” torna natural a referência ao território já mencionado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A coordenação extensa do hebraico foi preservada, mas pontuada com travessões para tornar clara a aposição dos cinco nomes. O pronome resumptivo hebraico em אֹתוֹ não foi reproduzido literalmente, pois “a quem Moisés derrotou” expressa a relação sem artificialidade.
