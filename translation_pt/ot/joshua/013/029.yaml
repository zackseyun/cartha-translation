    rationale: וַיְהִי significa literalmente “e foi” e, no contexto, introduz a destinação da partilha. Não equivale a uma expressão explicativa como “isto é”; esta altera a relação sintática entre as duas orações.
  - severity: low
    issue: “uma herança” é acrescentado ao verbo “deu”.
    rationale: O objeto da doação está implícito pelo contexto de distribuição territorial, mas não ocorre neste versículo. “Deu à” preserva a elipse hebraica e evita explicitação desnecessária.
