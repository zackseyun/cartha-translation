base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: pt
  text: 'Moisés deu à meia tribo de Manassés, e foi para a meia tribo dos filhos de Manassés, segundo os seus clãs:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu uma herança
  rationale: נתן significa literalmente “deu”; no contexto da distribuição da terra, o objeto implícito é a herança territorial. A explicitação produz português natural sem alterar o sentido.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: à meia tribo de Manassés
  rationale: חֲצִי indica “metade”, e שֵׁבֶט designa aqui uma tribo. “Meia tribo” é a formulação corrente e concisa em português.
- source_word: וַיְהִי
  choice: isto é
  rationale: A oração seguinte retoma e especifica o destinatário da concessão. Em português, “isto é” comunica naturalmente essa relação explicativa, evitando o pouco idiomático “e foi para”.
- source_word: מַטֵּה
  choice: tribo
  rationale: Embora מַטֶּה também possa significar “cajado”, neste contexto administrativo designa uma unidade tribal.
- source_word: בְנֵי מְנַשֶּׁה
  choice: filhos de Manassés
  rationale: Preserva a expressão hebraica de parentesco, que neste contexto se refere aos descendentes tribais de Manassés.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחוֹת são grupos de parentesco dentro da tribo; a preposição לְ tem aqui força distributiva, adequadamente expressa por “segundo”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição tribal do hebraico foi mantida, mas sua relação explicativa foi expressa de modo idiomático. Os dois termos hebraicos שֵׁבֶט e מַטֶּה foram vertidos por “tribo”, pois a variação lexical não representa aqui uma distinção administrativa clara.
