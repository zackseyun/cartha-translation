source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: pt
  text: 'Josué estava velho, avançado em idade, e Yahweh lhe disse: “Você está velho, avançado em idade, e ainda resta muitíssima terra para tomar posse dela[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para recebê-la como herança”. O verbo hebraico pode expressar a ideia de tomar posse da terra como herança.
    reason: Alternativa lexical de לְרִשְׁתָּהּ, preservando sua possível nuance de herança.
lexical_decisions:
- source_word: זָקֵן
  choice: estava velho
  rationale: Expressa diretamente o estado de Josué, sem acrescentar a ideia de que ele acabara de envelhecer.
- source_word: בָּא בַּיָּמִים
  choice: avançado em idade
  rationale: Traduz de modo natural o idioma hebraico, literalmente ‘chegado em dias’, que indica idade avançada.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אַתָּה זָקַנְתָּה בָּאתָ בַיָּמִים
  choice: Você está velho, avançado em idade
  rationale: Mantém a repetição enfática da descrição do narrador e apresenta naturalmente, em português, o estado atual de Josué.
- source_word: הָאָרֶץ
  choice: terra
  rationale: Conserva o termo geográfico e pactual característico do livro de Josué.
- source_word: נִשְׁאֲרָה
  choice: ainda resta
  rationale: O verbo indica aquilo que permanece; ‘ainda’ torna natural em português a noção contextual de algo que continua por fazer, sem introduzir um marcador temporal inicial ausente no hebraico.
- source_word: הַרְבֵּה מְאֹד
  choice: muitíssima
  rationale: Reproduz de forma clara e enfática a combinação intensiva hebraica, indicando a grande extensão de terra restante.
- source_word: לְרִשְׁתָּהּ
  choice: da qual tomar posse
  rationale: Reflete o sentido contextual de adquirir a posse da terra, mantendo aberta a associação lexical com herança indicada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração ‘Yahweh’ preserva o nome da aliança em vez de substituí-lo por um título.
- issue: Sentido de ירשׁ em relação à terra
  choice: tomar posse
  alternative: receber como herança
  rationale: No contexto, o foco imediato está na apropriação efetiva da terra por Israel. A alternativa ligada à herança é lexicalmente possível e foi preservada em nota, sem impor uma única nuance teológica ao verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição entre a narração e a fala divina foi mantida por ser enfática no hebraico. Não se acrescentou um marcador inicial como “Ora” ou “Então”, pois o texto-fonte não contém uma palavra temporal explícita nesse ponto.
