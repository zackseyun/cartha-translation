base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: pt
  text: e a terra dos gebalitas, e todo o Líbano para o nascente, desde Baal-Gade, abaixo do monte Hermom, até Lebo-Hamate[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até a entrada de Hamate». O hebraico pode ser entendido como uma expressão descritiva de limite, e não como um nome próprio de lugar.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: a terra dos gebalitas
  rationale: Expressa naturalmente o território associado aos habitantes de Gebal, preservando a ligação do gentílico com o nome do lugar.
- source_word: כָל הַלְּבָנוֹן
  choice: todo o Líbano
  rationale: Mantém a abrangência de כָל e a referência geográfica de forma clara e concisa.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: para o nascente
  rationale: Conserva a imagem hebraica do nascer do sol e, ao mesmo tempo, funciona em português como indicação natural da direção leste.
- source_word: מִבַּעַל גָּד
  choice: desde Baal-Gade
  rationale: Translitera o topônimo e usa «desde» para marcar com clareza o ponto inicial do limite geográfico.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: abaixo do monte Hermom
  rationale: Preserva a relação espacial expressa por תַּחַת sem especificar indevidamente que o lugar ficava exatamente ao pé da montanha.
- source_word: עַד לְבוֹא חֲמָת
  choice: até Lebo-Hamate
  rationale: Trata a expressão como topônimo de fronteira, leitura bem atestada, enquanto mantém em nota a possível interpretação descritiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com nomenclatura geográfica reconhecível. «Para o nascente» preserva a imagem do hebraico sem soar excessivamente literal. A vírgula final foi mantida porque o versículo continua no contexto sintático fornecido.
