reference: Joshua 13:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: pt
  text: Todos os habitantes da região montanhosa, desde o Líbano até Misrefote-Maim[a], todos os sidônios — eu mesmo os expulsarei de diante dos filhos de Israel.[b] Apenas distribua essa terra a Israel como herança[c], conforme lhe ordenei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrefote-Maim é o nome de um lugar. O nome talvez signifique algo como “queimas de águas”, mas seu sentido exato é incerto.
    reason: cultural_note
  - marker: b
    text: 'Ou: “eu mesmo os desapossarei de diante dos filhos de Israel”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo hebraico pertence ao modo de falar da distribuição da terra por sorteio.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: habitantes da região montanhosa
  rationale: O particípio em construção designa os habitantes, e הָהָר tem aqui sentido territorial, não o de uma única montanha.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: desde o Líbano até Misrefote-Maim
  rationale: Os dois termos são nomes geográficos; o segundo é transliterado porque sua etimologia e seu sentido exato são incertos.
- source_word: כָּל צִידֹנִים
  choice: todos os sidônios
  rationale: A expressão identifica coletivamente a população de Sidom e mantém a força abrangente de כָּל.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: eu mesmo os expulsarei
  rationale: O pronome independente אָנֹכִי dá ênfase ao agente divino, e o hifil de ירשׁ indica expulsar ou desapossar os habitantes.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: de diante dos filhos de Israel
  rationale: A formulação conserva a imagem relacional do hebraico e descreve a remoção dos povos diante do avanço de Israel.
- source_word: הַפִּלֶהָ
  choice: distribua essa terra
  rationale: O hifil de נפל pertence ao idioma de fazer cair a sorte e, por extensão, repartir a terra. O objeto feminino implícito é explicitado como 'essa terra' para clareza em português.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: a Israel como herança
  rationale: נַחֲלָה denota uma propriedade recebida como herança, preservando a dimensão jurídica e pactual da concessão da terra.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: conforme lhe ordenei
  rationale: O perfeito remete a uma ordem divina anterior dirigida singularmente a Josué; o pretérito perfeito é natural e exato em português.
theological_decisions:
- issue: Tradução de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas; povo de Israel
  rationale: A expressão hebraica é explicitamente filial e masculina plural; a tradução preserva essa forma tradicional sem acrescentar interpretação.
- issue: Sentido de נַחֲלָה no contexto da repartição da terra
  choice: herança
  alternative: posse; propriedade
  rationale: A escolha mantém a nuance de terra concedida e transmitida, em vez de reduzi-la à mera ocupação territorial.
- issue: Agência divina em אָנֹכִי אוֹרִישֵׁם
  choice: eu mesmo os expulsarei
  alternative: eu os desapossarei
  rationale: A ênfase de אָנֹכִי é preservada, assim como a promessa de ação divina, sem decidir além do texto como essa ação se relaciona com a atuação militar de Israel.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. 'Região montanhosa' comunica o sentido geográfico; 'filhos de Israel' preserva a forma filial do hebraico; e 'distribua essa terra' torna explícito o referente feminino implícito sem acrescentar conteúdo. Os marcadores seguem a ordem de ocorrência no texto.
