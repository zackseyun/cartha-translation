lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: Esta é a terra que ainda resta
  rationale: A cópula é suprida naturalmente em português; «ainda resta» comunica o sentido do particípio nifal de שׁאר no contexto das terras não conquistadas.
- source_word: כָּל גְּלִילוֹת
  choice: todos os distritos
  rationale: גְּלִילוֹת designa áreas territoriais; «distritos» preserva o sentido geográfico e a força distributiva de כָּל.
- source_word: הַפְּלִשְׁתִּים
  choice: dos filisteus
  rationale: O hebraico nomeia o povo, e não diretamente a Filístia; a construção portuguesa conserva essa relação.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: e todos os gesuritas
  rationale: Embora הַגְּשׁוּרִי tenha forma singular gentílica, aqui possui sentido coletivo; o plural português expressa esse valor com naturalidade.
