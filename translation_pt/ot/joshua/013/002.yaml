  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: pt
  text: 'Esta é a terra que resta: todos os distritos[a] dos filisteus e todos os gesuritas[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «regiões». O termo hebraico גְּלִילוֹת refere-se às áreas territoriais associadas aos filisteus.
    reason: lexical_alternative
  - marker: b
    text: Em hebraico, «o gesurita» está no singular, mas é uma designação coletiva; «os gesuritas» explicita esse sentido em português.
