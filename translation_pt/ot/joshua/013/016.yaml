  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: pt
  text: O limite do território deles se estendia desde Aroer, que fica à margem do vale do Arnom[a], e incluía a cidade que fica no meio do vale e todo o planalto[b] até Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à margem do uádi do Arnom”. O termo hebraico נַחַל pode designar um leito de rio, um uádi ou um vale estreito.
    reason: lexical_alternative
  - marker: b
    text: Ou “toda a região plana”; o termo hebraico se refere aqui às terras elevadas e relativamente planas da Transjordânia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: O território deles se estendia
  rationale: Neste contexto de repartição de terras, גְּבוּל pode indicar tanto o limite como a extensão territorial. A formulação comunica naturalmente que se descreve a área atribuída, sem reduzir a lista seguinte a uma simples linha fronteiriça.
- source_word: מֵעֲרוֹעֵר
  choice: desde Aroer
  rationale: A preposição מִן marca o ponto inicial da extensão territorial; o topônimo é transliterado na forma portuguesa corrente.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: que fica à margem do vale do Arnom
  rationale: שָׂפָה significa literalmente 'lábio' e, geograficamente, 'borda' ou 'margem'. נַחַל pode designar vale, ravina ou curso sazonal; 'vale' é claro e natural, enquanto a nota preserva a alternativa 'uádi'.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: e incluía a cidade que fica no meio do vale
  rationale: בְּתוֹךְ expressa posição no interior ou no meio. O verbo 'incluía' torna explícita em português a relação elíptica entre o território e os elementos enumerados, sem identificar a cidade além do que o texto diz.
- source_word: וְכָל הַמִּישֹׁר
  choice: e todo o planalto
  rationale: מִישׁוֹר designa aqui a região nivelada e elevada da Transjordânia; 'planalto' expressa melhor essa topografia do que o mais genérico 'planície'.
- source_word: עַל מֵידְבָא
  choice: até Medeba
  rationale: Em descrições territoriais, עַל pode indicar extensão até um lugar. 'Até Medeba' é idiomático e conserva esse valor espacial.
