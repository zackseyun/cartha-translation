lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: Quiriataim
  rationale: Nome próprio de lugar transliterado segundo formas correntes e legíveis em português.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Topônimo transliterado; «Sibma» representa naturalmente o שׂ inicial e é uma forma tradicional em português.
- source_word: צֶרֶת הַשַּׁחַר
  choice: Zerete-Saar
  rationale: A expressão é tratada como topônimo composto dentro de uma lista de cidades; por isso, mantém-se a transliteração no texto principal, sem ocultar em nota a possível leitura semântica do segundo elemento.
- source_word: בְּהַר הָעֵמֶק
  choice: na colina do vale
  rationale: A preposição é locativa, e הַר pode designar uma elevação; «colina» comunica de modo natural a topografia local, enquanto «do vale» preserva a construção hebraica.
