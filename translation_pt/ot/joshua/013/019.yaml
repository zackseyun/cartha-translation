  text: and Kiriathaim[a], and Sibmah, and Zereth-shahar on the hill of the valley,
translation:
  language: pt
  text: Quiriataim, Sibma e Zerete-Saar[a], no monte do vale.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «Zerete da alvorada», se o nome for analisado pelo seu sentido em vez de ser preservado como topônimo transliterado.
