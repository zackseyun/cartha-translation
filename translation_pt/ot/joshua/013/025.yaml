  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: pt
  text: O território deles abrangia Jazer, todas as cidades de Gileade e metade da terra dos amonitas, até Aroer, que fica em frente a Rabá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que fica voltada para Rabá”. A expressão hebraica diz literalmente “que está diante de Rabá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: O território deles abrangia
  rationale: גְּבוּל pode designar a fronteira ou, por extensão, o território delimitado. Como a frase introduz uma lista de lugares incluídos na herança, “território” exprime naturalmente o sentido, e “abrangia” liga com clareza essa designação à enumeração.
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Forma tradicional e reconhecível em português para o topônimo hebraico.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: todas as cidades de Gileade
  rationale: עָרִים pode significar cidades ou povoações; “cidades” preserva o registro usual das listas territoriais, e “Gileade” é a forma portuguesa consagrada.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: metade da terra dos amonitas
  rationale: בְּנֵי עַמּוֹן é uma designação étnica e geográfica convencional. “Amonitas” é idiomático em português, e “terra” mantém o sentido territorial de אֶרֶץ.
- source_word: עַד עֲרוֹעֵר
  choice: até Aroer
  rationale: עַד assinala o limite territorial; “até” é a formulação geográfica mais direta em português. “Aroer” translitera o topônimo.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: que fica em frente a Rabá
  rationale: A expressão עַל־פְּנֵי indica uma relação espacial como “diante de”, “em frente a” ou “voltada para”. A tradução evita acrescentar uma direção geográfica não expressa no hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos topônimos bíblicos. A construção foi levemente explicitada com “abrangia” para que a enumeração territorial soe natural, sem alterar seus limites. A nota preserva a amplitude espacial da expressão hebraica.
