  text: וְ/אֶת בִּלְעָ֥ם בֶּן בְּע֖וֹר הַ/קּוֹסֵ֑ם הָרְג֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בַּ/חֶ֖רֶב אֶל חַלְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: pt
  text: Os filhos de Israel também mataram à espada Balaão, filho de Beor, o adivinho, entre os seus mortos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto com os que haviam matado”. A expressão hebraica no fim do versículo é incomum e indica que Balaão foi morto em associação com os demais que Israel matou.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: também
  rationale: וְ acrescenta Balaão ao resumo dos mortos; “também” expressa naturalmente essa força aditiva, enquanto אֶת apenas marca o objeto direto.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Balaão, filho de Beor
  rationale: Mantém a forma tradicional portuguesa do nome e traduz diretamente o patronímico hebraico.
- source_word: הַקּוֹסֵם
  choice: o adivinho
  rationale: קֹסֵם designa alguém que pratica adivinhação. “Adivinho” é conciso, atual e preserva a identificação depreciativa do contexto sem ampliar o sentido.
- source_word: הָרְגוּ
  choice: mataram
  rationale: Tradução direta e corrente do verbo hebraico, sem o tom arcaico ou a intensidade adicional de outras opções.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz a expressão hebraica tradicional e mantém a referência coletiva aos descendentes de Israel.
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: Expressão portuguesa idiomática para o uso instrumental da espada na morte em combate.
- source_word: אֶל חַלְלֵיהֶם
  choice: entre os seus mortos
  rationale: Conserva a formulação incomum e a associação de Balaão com os demais mortos, sem eliminar a ambiguidade do hebraico; a alternativa mais explícita consta na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A expressão final foi mantida relativamente formal para preservar a construção incomum e a ambiguidade genuína do hebraico.
