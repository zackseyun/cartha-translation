base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: pt
  text: todo o reino de Ogue em Basã, que reinou em Astarote e em Edrei — ele era dos que restavam dos Refains.[a] Moisés os derrotou e os desapossou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “gigantes”. Hebraico: “Refains”, provavelmente o nome de um antigo povo.'
    reason: Registra uma alternativa lexical tradicional sem substituir, no texto principal, o nome hebraico do grupo por uma interpretação.
lexical_decisions:
- source_word: כָּל מַמְלְכוּת
  choice: todo o reino
  rationale: Com o substantivo singular, כָּל indica a totalidade do reino de Ogue.
- source_word: עוֹג
  choice: Ogue
  rationale: Forma tradicional e reconhecível do nome próprio em português.
- source_word: בַּבָּשָׁן
  choice: em Basã
  rationale: A preposição בְּ expressa localização, e “em Basã” reproduz naturalmente esse sentido.
- source_word: אֲשֶׁר מָלַךְ
  choice: que reinou
  rationale: Preserva a nuance régia do verbo מלך e introduz naturalmente a oração relativa.
- source_word: בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: em Astarote e em Edrei
  rationale: Mantém os dois topônimos e explicita a preposição repetida no hebraico.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר
  choice: Ele havia restado do remanescente
  rationale: Conserva a ideia de Ogue ter sobrevivido como parte do que restava, sem acrescentar que era o único sobrevivente.
- source_word: הָרְפָאִים
  choice: os refains
  rationale: Preserva o nome do antigo grupo em vez de impor a interpretação “gigantes”; a alternativa é registrada em nota.
- source_word: וַיַּכֵּם
  choice: Moisés os derrotou
  rationale: No contexto militar, נכה denota golpear e vencer; “derrotou” comunica com clareza o resultado, mantendo o objeto plural.
- source_word: וַיֹּרִשֵׁם
  choice: e os desapossou
  rationale: O hifil de ירשׁ indica fazer alguém perder sua posse; “desapossou” preserva essa precisão no contexto da conquista.
theological_decisions:
- issue: Tradução de רְפָאִים
  choice: os refains
  alternative: os gigantes
  rationale: O termo hebraico pode funcionar como nome de um povo antigo. A transliteração evita decidir no texto principal uma questão interpretativa sobre a natureza desse grupo.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas usuais em traduções bíblicas lusófonas. A formulação incomum “havia restado do remanescente” conserva a tensão e a estrutura do hebraico, enquanto “derrotou” torna natural o sentido militar de נכה.
