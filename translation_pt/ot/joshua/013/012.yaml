    rationale: Como designação de um povo/grupo antigo, «Refains» deve ser grafado com inicial maiúscula.
  - severity: low
    issue: O ponto antes de «Ele» torna menos explícita a relação explicativa da oração resumptiva.
    rationale: O travessão reproduz naturalmente a retomada de «ele» no hebraico e melhora a coesão.
