  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: pt
  text: e todas as cidades de Seom, rei dos amorreus, que reinou em Hesbom, até a fronteira dos filhos de Amom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “dos amonitas”. Hebraico: “dos filhos de Amom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: e todas
  rationale: Preserva tanto a conjunção que liga o versículo à descrição anterior quanto a abrangência de כֹל.
- source_word: עָרֵי
  choice: as cidades de
  rationale: O plural em estado construto de עִיר é vertido de modo claro e convencional numa lista territorial.
- source_word: סִיחוֹן
  choice: Seom
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecível do nome hebraico.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: rei dos amorreus
  rationale: Expressa naturalmente a relação do construto hebraico e identifica o povo sobre o qual Seom reinava.
- source_word: אֲשֶׁר מָלַךְ
  choice: que reinava
  rationale: Mantém a nuance especificamente régia de מָלַךְ e concorda com a descrição circunstancial do território.
- source_word: בְּ/חֶשְׁבּוֹן
  choice: em Hesbom
  rationale: A preposição בְ indica aqui a cidade onde estava sediado o reinado de Seom.
- source_word: עַד גְּבוּל
  choice: até a fronteira de
  rationale: Comunica de forma natural o limite da extensão territorial indicado por עַד.
- source_word: בְּנֵי עַמּוֹן
  choice: os filhos de Amom
  rationale: Preserva a forma filial do etnônimo hebraico; a equivalência étnica mais fluente fica registrada em nota.
