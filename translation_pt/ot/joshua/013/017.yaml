base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: pt
  text: 'Hesbom e todas as suas cidades situadas no planalto[a]: Dibom, Bamote-Baal e Bete-Baal-Meom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na planície” ou “na região plana”. O termo hebraico se refere à região elevada e relativamente plana da Transjordânia.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbom
  rationale: Nome geográfico vertido na forma tradicional e reconhecível em português.
- source_word: וְכָל עָרֶיהָ
  choice: e todas as suas cidades
  rationale: O sufixo feminino singular remete a Hesbom; em português, o possessivo concorda naturalmente com o possuidor sem personificar a cidade.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: situadas no planalto
  rationale: Neste contexto territorial da Transjordânia, מִישׁוֹר indica uma região elevada e relativamente plana; “planalto” comunica melhor essa geografia do que “planície”.
- source_word: דִּיבוֹן
  choice: Dibom
  rationale: Topônimo apresentado em forma aportuguesada, com -m final para representar a nasal final.
- source_word: וּבָמוֹת בַּעַל
  choice: Bamote-Baal
  rationale: O conjunto funciona aqui como topônimo; a transliteração evita convertê-lo indevidamente na expressão comum “lugares altos de Baal”.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: e Bete-Baal-Meom
  rationale: Nome geográfico composto transliterado; “Bete” preserva בֵּית como elemento do topônimo, sem traduzi-lo como “casa de”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas aportuguesadas dos topônimos e sintaxe natural. O marcador de nota foi colocado após “Dibom”, seguindo a camada de consulta fornecida, embora a nota esclareça a expressão anterior “no planalto”.
