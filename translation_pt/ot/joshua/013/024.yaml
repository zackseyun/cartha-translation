  text: וַ/יִּתֵּ֤ן מֹשֶׁה֙ לְ/מַטֵּה גָ֔ד לִ/בְנֵי גָ֖ד לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/024.yaml
  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: pt
  text: Moisés deu à tribo de Gade[a], aos filhos de Gade, segundo os seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos descendentes de Gade”. O hebraico diz literalmente “filhos de Gade”, expressão genealógica comum para os membros da tribo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: deu
  rationale: No contexto da distribuição territorial, נתן expressa o ato de dar ou atribuir. “Deu” é direto e preserva o objeto implícito do hebraico.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לְמַטֵּה
  choice: à tribo de
  rationale: Embora מַטֶּה também possa significar “cajado”, neste contexto genealógico e territorial designa claramente uma tribo.
- source_word: גָד
  choice: Gade
  rationale: Forma tradicional portuguesa do nome pessoal e tribal hebraico.
- source_word: לִבְנֵי
  choice: aos filhos de
  rationale: Traduz literalmente a expressão genealógica masculina בְּנֵי, que neste uso pode abranger os membros ou descendentes da tribo; a alternativa é registrada em nota.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה indica as subdivisões familiares da tribo, e a preposição לְ tem aqui força distributiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com formulação próxima do hebraico. “Clãs” comunica com precisão a organização familiar tribal; “filhos de Gade” preserva a expressão genealógica da fonte, acompanhada de nota explicativa.
