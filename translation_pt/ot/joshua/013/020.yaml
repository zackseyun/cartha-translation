  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: pt
  text: e Bete-Peor, as encostas de Pisga[a] e Bete-Jesimote.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as fontes” ou “os contrafortes de Pisga”. O termo hebraico admite mais de um sentido topográfico.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: Bete-Peor
  rationale: É um topônimo. A forma transliterada, com “Bete” já tradicional em português bíblico, preserva o nome em vez de traduzir literalmente “casa de Peor”.
- source_word: אַשְׁדּוֹת
  choice: encostas
  rationale: Neste contexto topográfico, o termo provavelmente designa as vertentes ou declives de Pisga. “Encostas” é natural, claro e geograficamente adequado, enquanto a nota preserva a incerteza lexical.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: O termo funciona como nome geográfico; por isso, emprega-se a transliteração portuguesa usual, sem reproduzir rigidamente o artigo hebraico.
- source_word: בֵית הַיְשִׁמוֹת
  choice: Bete-Jesimote
  rationale: É um topônimo, portanto foi transliterado, e não vertido literalmente como “casa das desolações”. A grafia segue padrões de legibilidade do português bíblico.
