  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: pt
  text: Mas à tribo de Levi Moisés não deu herança; Yahweh, o Deus de Israel, é a herança deles,[a] conforme lhes havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «porção», nas duas ocorrências do termo hebraico traduzido como «herança».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: Mas à tribo de Levi
  rationale: A conjunção introduz contraste com as distribuições territoriais anteriores; «à tribo de Levi» expressa naturalmente o destinatário em português.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: Moisés não deu herança
  rationale: Mantém a negação e a ação passada de modo direto, preservando «herança» como termo central da distribuição da terra.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz com clareza e naturalidade a construção hebraica de relação.
- source_word: הוּא נַחֲלָתָם
  choice: é a herança deles
  rationale: Preserva a afirmação enfática de que o próprio Yahweh constitui a herança dos levitas.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: conforme lhes havia dito
  rationale: Expressa a fala divina anterior sem ampliar דִּבֶּר para o sentido mais específico de «prometer».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome divino, e a transliteração conserva essa identificação pessoal sem substituí-la por um título.
- issue: Natureza da herança de Levi
  choice: O próprio Yahweh é a herança deles
  alternative: Yahweh é a porção deles
  rationale: A formulação mantém a identificação teológica explícita do hebraico e não a reduz a privilégios sacerdotais ou benefícios materiais.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. «Levi» é usado como nome da tribo; «conforme lhes havia dito» marca naturalmente a anterioridade da fala divina.
