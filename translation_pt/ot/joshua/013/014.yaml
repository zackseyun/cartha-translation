  text: רַ֚ק לְ/שֵׁ֣בֶט הַ/לֵּוִ֔י לֹ֥א נָתַ֖ן נַחֲלָ֑ה אִשֵּׁ֨י יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: pt
  text: Somente à tribo de Levi ele não deu herança; as ofertas preparadas no fogo para Yahweh, o Deus de Israel, são a herança dela[a], conforme ele lhe havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'À luz de passagens próximas, alguns entendem: “Yahweh, o Deus de Israel, é a herança dela”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: Somente
  rationale: Marca a exceção à distribuição de terras mencionada no contexto e preserva a força restritiva do hebraico.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: à tribo de Levi
  rationale: A preposição ל com o verbo 'dar' é expressa naturalmente por 'a'; o artigo contrai-se com a preposição.
- source_word: לֹא נָתַן נַחֲלָה
  choice: ele não deu herança
  rationale: Tradução direta da negação, do verbo e do objeto; 'herança' mantém a linguagem da partilha territorial.
- source_word: אִשֵּׁי יְהוָה
  choice: as ofertas queimadas a Yahweh
  rationale: Expressa a relação lexical de אִשֵּׁי com o fogo sacrificial sem ampliar o sentido para toda espécie de oferta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino e o distingue do título 'Senhor'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Reproduz naturalmente a cadeia construta e funciona como aposto de 'Yahweh'.
- source_word: הוּא נַחֲלָתוֹ
  choice: são a herança dela
  rationale: Relaciona a declaração ao antecedente imediato, as ofertas, e usa 'dela' para a tribo de Levi, evitando em português a possível leitura de que a herança pertence a Yahweh.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: conforme ele lhe havia dito
  rationale: Mantém o sentido de 'falar/dizer', sem convertê-lo interpretativamente em 'prometer'; o mais-que-perfeito composto explicita a anterioridade natural no contexto.
theological_decisions:
- issue: Natureza da herança de Levi
  choice: as ofertas queimadas a Yahweh ... são a herança dela
  alternative: Yahweh, o Deus de Israel, é a herança dela
  rationale: A leitura principal segue o antecedente nominal imediato, אִשֵּׁי יְהוָה, sem harmonizar silenciosamente o versículo com passagens próximas. A nota conserva a leitura tradicional baseada no contexto mais amplo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O feminino pronominal retoma explicitamente 'a tribo de Levi'. O marcador [a] aparece no texto junto à afirmação cuja interpretação alternativa é registrada.
