base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: pt
  text: 'A fronteira dos filhos de Rúben era o Jordão e sua divisa.[a] Essa era a herança dos filhos de Rúben, segundo os seus clãs: as cidades e os seus povoados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Jordão como divisa”. A expressão hebraica compacta, “o Jordão e divisa”, pode identificar o Jordão como a linha de fronteira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: era
  rationale: Na fórmula geográfica, o verbo declara qual era a fronteira, sem destacar a ideia de que ela veio a existir.
- source_word: גְּבוּל
  choice: fronteira / divisa
  rationale: Os dois termos exprimem o limite geográfico; “fronteira” introduz a fórmula, enquanto “divisa” evita repetição excessiva na expressão hebraica compacta.
- source_word: בְּנֵי רְאוּבֵן
  choice: os filhos de Rúben
  rationale: Preserva a expressão genealógica e tribal do hebraico, ainda compreensível em português atual.
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: o Jordão e sua divisa
  rationale: Mantém a forma compacta e um tanto difícil do texto massorético, sem apagar a possibilidade de que o Jordão seja identificado como a própria linha divisória.
- source_word: נַחֲלַת
  choice: a herança
  rationale: É o termo tradicional e contextualmente adequado para a porção territorial atribuída a uma tribo.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: No contexto da distribuição tribal, מִשְׁפָּחוֹת designa as subdivisões de parentesco da tribo; “clãs” é mais preciso que “famílias”.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: Equivalente normal de עָרִים nas listas territoriais, independentemente do tamanho moderno dos locais.
- source_word: וְחַצְרֵיהֶן
  choice: e os povoados ao redor delas
  rationale: חֲצֵרִים são assentamentos menores ou dependentes ligados às cidades; a formulação esclarece essa relação em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário geográfico claro. A construção difícil referente ao Jordão foi mantida no texto e explicada em nota, sem eliminar sua ambiguidade.
