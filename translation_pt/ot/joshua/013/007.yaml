  text: וְ/עַתָּ֗ה חַלֵּ֞ק אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את בְּ/נַחֲלָ֖ה לְ/תִשְׁעַ֣ת הַ/שְּׁבָטִ֑ים וַ/חֲצִ֖י הַ/שֵּׁ֥בֶט הַֽ/מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: pt
  text: Agora, reparta esta terra como herança entre as nove tribos e a meia tribo de Manassés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E agora, reparta esta terra por herança às nove tribos e à metade da tribo de Manassés.”'
    reason: Alternativa lexical e sintática que preserva de modo mais explícito a conjunção inicial, o valor da preposição לְ e a construção hebraica “metade da tribo”.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Introduz a ordem seguinte na sequência do discurso. Em português atual, “Agora” expressa naturalmente a transição; “E agora” também é possível.
- source_word: חַלֵּק
  choice: reparta
  rationale: O imperativo é dirigido a Josué. “Reparta” comunica de modo natural a distribuição territorial, sem antecipar sozinho toda a noção de herança.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: Mantém o sentido amplo e usual de אֶרֶץ no contexto territorial de Josué.
- source_word: בְּנַחֲלָה
  choice: como herança
  rationale: נַחֲלָה designa a herança territorial atribuída às tribos; “como herança” preserva tanto o aspecto de distribuição legal quanto a ressonância pactual.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: entre as nove tribos
  rationale: Com o verbo português “repartir”, “entre” identifica de maneira idiomática os destinatários da divisão.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: e a meia tribo
  rationale: “Meia tribo” é a designação portuguesa clara e convencional para essa subdivisão tribal reconhecida.
- source_word: הַמְנַשֶּׁה
  choice: de Manassés
  rationale: O nome pessoal e tribal é transliterado na forma portuguesa consagrada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Reparta” combina melhor com “entre”, enquanto a nota registra uma formulação mais formal e próxima da sintaxe hebraica.
