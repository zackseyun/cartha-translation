  terminology: Gileade, Astarote, Edrei, Ogue, Basã, Maquir e Manassés são formas portuguesas estabelecidas. “Filhos de Maquir” preserva deliberadamente a expressão de parentesco hebraica; a nota esclarece de forma apropriada seu alcance potencial.
