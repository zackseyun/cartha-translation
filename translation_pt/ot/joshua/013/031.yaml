base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: pt
  text: e metade de Gileade, Astarote e Edrei, cidades do reino de Ogue em Basã, couberam aos filhos de Maquir, filho de Manassés, isto é, à metade dos filhos de Maquir[a], segundo os seus clãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filhos de Maquir” também pode designar, de modo mais amplo, os descendentes de Maquir; a tradução conserva a expressão familiar do hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: e metade de Gileade
  rationale: A conjunção dá continuidade à lista de territórios do versículo anterior. Em português, o nome geográfico dispensa o artigo nesta construção.
- source_word: עַשְׁתָּרוֹת
  choice: Astarote
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: אֶדְרֶעִי
  choice: Edrei
  rationale: Transliteração corrente do topônimo em português.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: cidades do reino de Ogue em Basã
  rationale: Reproduz diretamente a cadeia construta hebraica sem decidir que se tratava especificamente de cidades reais ou capitais.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: ficaram para os filhos de Maquir, filho de Manassés
  rationale: A preposição ל marca a destinação da herança; o verbo suprido torna natural em português a oração nominal hebraica. Mantém-se a linguagem familiar do original.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: para a metade dos filhos de Maquir
  rationale: Preserva a formulação hebraica e evita acrescentar 'tribo', termo ausente do texto.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: segundo os seus clãs
  rationale: No contexto de repartição tribal, מִשְׁפָּחוֹת designa divisões genealógicas maiores que a família nuclear; 'clãs' comunica melhor esse sentido.
