  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: pt
  text: 'Esta foi a herança dos filhos de Gade, segundo seus clãs: as cidades e seus povoados.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esta é a herança dos filhos de Gade, segundo seus clãs: as cidades e seus povoados.” A fórmula resumitiva hebraica não contém verbo expresso e pode ser traduzida no presente ou no passado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Esta foi
  rationale: O demonstrativo feminino singular retoma a herança territorial descrita anteriormente. Em português, o passado soa natural nesta fórmula conclusiva, embora o presente também seja possível no hebraico nominal.
- source_word: נַחֲלַת
  choice: a herança
  rationale: נַחֲלָה designa a porção territorial recebida como posse hereditária; “herança” preserva a nuance fundiária e pactual característica do contexto de Josué.
- source_word: בְּנֵי גָד
  choice: dos filhos de Gade
  rationale: Mantém a designação genealógica e tribal do hebraico, compreensível em português como referência aos descendentes e à tribo de Gade.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: O לְ indica organização distributiva, e מִשְׁפָּחוֹת se refere aos agrupamentos familiares internos da tribo. “Segundo os seus clãs” é preciso e natural.
- source_word: הֶעָרִים
  choice: as cidades
  rationale: עָרִים é o termo comum para núcleos urbanos nas listas territoriais, e “cidades” corresponde ao uso convencional em português.
- source_word: וְחַצְרֵיהֶם
  choice: e os povoados ao redor delas
  rationale: חֲצֵרִים, nesta fórmula territorial, indica assentamentos rurais dependentes das cidades. A expressão explicita de modo natural a relação indicada pelo sufixo plural masculino hebraico, sem sugerir que os povoados pertenciam pessoalmente aos gaditas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conserva “filhos de Gade” e “herança” por sua relevância genealógica e territorial; usa “povoados ao redor delas” para comunicar a relação entre as cidades e seus assentamentos dependentes.
