  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: pt
  text: E desde Hesbom até Ramate-Mispa e Betonim, e desde Maanaim até a fronteira de Debir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fronteira em direção a Debir”. A construção hebraica também pode ter sentido direcional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: e desde Hesbom
  rationale: 'A conjunção וּ seguida da preposição מִן indica continuação e ponto de partida: “e desde”. O topônimo é vertido na forma portuguesa tradicional “Hesbom”.'
- source_word: עַד
  choice: até
  rationale: Em descrições territoriais, עַד marca o limite ou a extensão de um percurso; “até” é natural e preciso em português.
- source_word: רָמַת הַ/מִּצְפֶּה
  choice: Ramate-Mispa
  rationale: A expressão funciona como topônimo (“altura de Mispa/posto de observação”), por isso se conserva como nome próprio na forma portuguesa corrente, sem traduzir seus componentes.
- source_word: וּ/בְטֹנִים
  choice: e Betonim
  rationale: Topônimo com conjunção prefixada; conserva-se a transliteração “Betonim”.
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: e desde Maanaim
  rationale: A combinação de conjunção, preposição e topônimo expressa um novo ponto de partida. Usa-se a forma portuguesa tradicional “Maanaim”.
- source_word: גְּב֥וּל
  choice: a fronteira
  rationale: No contexto da divisão da terra, גְּבוּל designa uma linha limítrofe territorial. “Fronteira” comunica esse sentido com clareza.
- source_word: לִדְבִר
  choice: de Debir
  rationale: Depois de גְּבוּל, o לְ ligado ao topônimo pode indicar a relação entre a fronteira e Debir. “A fronteira de Debir” é a formulação mais natural, embora a construção também admita nuance direcional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais e amplamente reconhecíveis dos topônimos bíblicos. Mantém-se a estrutura paralela da descrição territorial e registra-se em nota a ambiguidade da construção final.
