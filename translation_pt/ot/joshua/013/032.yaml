base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: pt
  text: Estas são as terras que Moisés distribuiu como herança nas planícies de Moabe, além do Jordão[a], a leste de Jericó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do outro lado do Jordão”. A expressão hebraica é uma fórmula geográfica cujo sentido depende do ponto de vista; aqui, a localização é especificada como sendo a leste de Jericó.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Estas são as terras que
  rationale: O demonstrativo plural e a partícula relativa introduzem um resumo das porções territoriais mencionadas no contexto. A explicitação de “terras” torna o referente natural e claro em português sem alterar o sentido.
- source_word: נִחַל
  choice: distribuiu como herança
  rationale: A forma causativa de נחל, em contexto de repartição territorial, expressa a atribuição de terras como posse hereditária; “distribuiu como herança” preserva ambos os aspectos.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: nas planícies de Moabe
  rationale: עֲרָבוֹת designa a região de planícies ou estepes; “planícies” é uma expressão geográfica clara e tradicional em português.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: além do Jordão
  rationale: Preserva a fórmula geográfica hebraica sem determinar por si só o ponto de vista; a expressão seguinte esclarece a localização.
- source_word: מִזְרָחָה־יְרִיחוֹ
  choice: a leste de Jericó
  rationale: Representa de modo natural o advérbio direcional e situa a região em relação a Jericó.
