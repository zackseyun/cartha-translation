  text: וְ/הַ/גִּלְעָ֞ד וּ/גְב֧וּל הַ/גְּשׁוּרִ֣י וְ/הַ/מַּעֲכָתִ֗י וְ/כֹ֨ל הַ֥ר חֶרְמ֛וֹן וְ/כָל הַ/בָּשָׁ֖ן עַד סַלְכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: pt
  text: e Gileade, e o território dos gesuritas e dos maacatitas[a], e todo o monte Hermom[b], e todo o Basã até Salca—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a fronteira dos gesuritas e dos maacatitas». A palavra hebraica pode indicar uma linha de fronteira ou o território pertencente a um povo; nesta lista, o sentido territorial parece ajustar-se melhor.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «todo o monte Hermom». A expressão pode referir-se a todo o maciço ou à região montanhosa do Hermom, e não somente ao cume.'
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: Gileade
  rationale: Nome próprio tradicional da região em português; o artigo hebraico não precisa ser reproduzido.
- source_word: גְבוּל
  choice: território
  rationale: Nesta enumeração geográfica, designa a área pertencente aos povos, não apenas sua linha de fronteira.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: dos gesuritas e dos maacatitas
  rationale: Os gentílicos singulares com artigo têm sentido coletivo; o plural em português expressa isso naturalmente e depende de «território».
- source_word: כֹל הַר חֶרְמוֹן
  choice: todo o monte Hermom
  rationale: Preserva a formulação hebraica e a designação geográfica corrente, deixando em nota a possível referência ao maciço inteiro.
- source_word: כָל הַבָּשָׁן
  choice: todo o Basã
  rationale: Mantém a ideia de totalidade territorial expressa por כָל e usa a forma portuguesa tradicional do topônimo.
- source_word: עַד סַלְכָה
  choice: até Salca
  rationale: עַד assinala o limite territorial; «até» comunica isso de modo claro e conciso.
