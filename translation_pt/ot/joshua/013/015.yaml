base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/015.yaml
  text: And Moses gave to the tribe of the sons of Reuben according to their clans:[a]
translation:
  language: pt
  text: E Moisés deu à tribo dos filhos de Rúben, segundo os seus clãs:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à tribo dos rubenitas». O hebraico diz literalmente «dos filhos de Rúben».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: E ... deu
  rationale: O wayyiqtol de נתן faz avançar a narrativa; a coordenação com «E» preserva de modo natural a sequência do hebraico.
- source_word: מֹשֶׁה
  choice: Moisés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לְמַטֵּה
  choice: à tribo
  rationale: Neste contexto de distribuição territorial, מַטֶּה significa «tribo»; o לְ marca o destinatário.
- source_word: בְנֵי רְאוּבֵן
  choice: dos filhos de Rúben
  rationale: Reproduz a expressão hebraica de parentesco de modo claro e digno; «rubenitas» é uma alternativa idiomática.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: מִשְׁפָּחָה designa aqui as subdivisões familiares da tribo, e לְ tem força distributiva ou organizacional.
