source:
  edition: WLC
  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: pt
  text: 'O território deles se estendia desde Maanaim: toda a Basã, todo o reino de Ogue, rei de Basã, e todas as aldeias de Jair[a] que ficam em Basã — sessenta cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Havote-Jair”, transliteração tradicional do nome hebraico desses povoados.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: O território deles
  rationale: Neste contexto de divisão da terra, גְּבוּל designa a região delimitada, não apenas sua linha de fronteira.
- source_word: מִמַּחֲנַיִם
  choice: se estendia desde Maanaim
  rationale: A preposição מִן indica o ponto inicial da descrição territorial; “se estendia desde” torna essa relação clara e natural em português.
- source_word: כָּל הַבָּשָׁן
  choice: toda a Basã
  rationale: Preserva a força abrangente de כָּל e trata Basã como nome da região.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: todo o reino de Ogue, rei de Basã
  rationale: מַמְלְכוּת designa o reino ou domínio real; “reino” é claro, tradicional e adequado ao contexto.
- source_word: חַוֹּת יָאִיר
  choice: as aldeias de Jair
  rationale: חַוֹּת refere-se a povoados ou aldeias associados a Jair. A tradução comunica o sentido em português corrente, enquanto a transliteração tradicional é registrada em nota.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: que ficam em Basã
  rationale: A oração relativa localiza as aldeias; o presente é natural numa descrição geográfica.
- source_word: שִׁשִּׁים עִיר
  choice: sessenta cidades
  rationale: עִיר pode significar cidade ou povoado. “Cidades” mantém a formulação usual das listas territoriais sem necessariamente sugerir grandes centros urbanos modernos.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. O dois-pontos organiza a enumeração territorial sem alterar o conteúdo hebraico; o travessão destaca a contagem final. Os nomes próprios seguem formas portuguesas consolidadas: Maanaim, Basã, Ogue e Jair.'
