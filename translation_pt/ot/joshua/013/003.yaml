  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: pt
  text: 'desde Sior, que fica a leste do Egito, até a fronteira de Ecrom, ao norte — território considerado cananeu —: os cinco governantes dos filisteus: o de Gaza, o de Asdode, o de Asquelom, o de Gate e o de Ecrom; e os aveus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “os aveus” também pode ser entendida em ligação com a indicação geográfica que vem no versículo seguinte.
    reason: Preserva a ambiguidade sintática na transição entre os versículos 3 e 4, sem determinar uma ligação que o texto não torna inequívoca.
lexical_decisions:
- source_word: שִׁיחוֹר
  choice: Sior
  rationale: Transliteração tradicional e reconhecível do hidrônimo; o texto não permite identificá-lo com certeza suficiente para substituí-lo por outro nome geográfico.
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: a leste do Egito
  rationale: A expressão literalmente indica o que está diante ou defronte do Egito; no contexto geográfico, comunica a localização oriental de forma natural em português.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: governantes dos filisteus
  rationale: סרנים designa os cinco chefes das cidades-estado filisteias; “governantes” evita associações feudais inadequadas de “senhores”.
- source_word: הָעַזָּתִי ... הָעֶקְרוֹנִי
  choice: o de Gaza ... o de Ecrom
  rationale: Os gentílicos hebraicos identificam cada governante por sua cidade; a formulação com “o de” é clara e idiomática em português.
- source_word: הָעַוִּים
  choice: os aveus
  rationale: Mantém o nome étnico do grupo sem tentar identificá-lo além do que o texto informa.
theological_decisions:
- issue: Classificação da região como cananeia
  choice: essa região é considerada cananeia
  alternative: ela será contada como pertencente aos cananeus
  rationale: O hebraico לַכְּנַעֲנִי תֵּחָשֵׁב exprime classificação territorial; a tradução preserva essa afirmação sem introduzir uma interpretação teológica ou histórica adicional.
- issue: Ligação sintática de “os aveus”
  choice: manter a expressão ao fim do versículo, separada por ponto e vírgula e acompanhada de nota
  alternative: ligá-la definitivamente à lista filisteia ou à indicação geográfica do versículo seguinte
  rationale: A sintaxe e a divisão contextual permitem mais de uma associação; a tradução não resolve silenciosamente essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com nomes geográficos de uso bíblico corrente no Brasil. Os travessões explicitam o comentário parentético do hebraico, e os pontos e vírgulas ajudam a conservar a estrutura enumerativa sem tornar a frase opaca.
