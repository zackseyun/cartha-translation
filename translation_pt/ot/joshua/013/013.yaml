base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: pt
  text: Mas os israelitas não expulsaram os gesuritas nem os maacatitas, e Gesur e Maacate habitaram no meio de Israel até o dia de hoje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: Equivalente natural em português para a expressão coletiva literal “filhos de Israel”, sem perda do referente étnico-nacional.
- source_word: הוֹרִישׁוּ
  choice: expulsaram
  rationale: No hifil, o verbo indica desalojar ou expulsar os habitantes de um território; “expulsaram” comunica isso com clareza.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: os gesuritas ... os maacatitas
  rationale: Gentílicos portugueses transparentes para os grupos mencionados.
- source_word: וַיֵּשֶׁב
  choice: vivem
  rationale: O hebraico narrativo descreve a permanência resultante desses povos, e a expressão “até o dia de hoje” favorece em português o presente durativo.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: no meio de Israel
  rationale: Preserva a formulação coletiva e geográfica do hebraico sem especificar indevidamente povo ou território.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Os nomes Gesur e Maacate representam aqui as entidades coletivas correspondentes aos gentílicos da primeira oração. O conectivo resultativo “por isso” explicita de modo natural a relação contextual entre a não expulsão e a permanência, sem acrescentar conteúdo teológico.
