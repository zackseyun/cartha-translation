- from: Mas os israelitas não expulsaram os gesuritas nem os maacatitas; por isso, Gesur e Maacate vivem no meio de Israel até o dia de hoje.
  to: Mas os israelitas não expulsaram os gesuritas nem os maacatitas, e Gesur e Maacate habitaram no meio de Israel até o dia de hoje.
