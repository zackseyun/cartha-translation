  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתְּנ֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/לְוִיִּ֔ם אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה בַּ/גּוֹרָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: pt
  text: Assim, os filhos de Israel deram aos levitas estas cidades com suas pastagens, conforme Yahweh havia ordenado por meio de Moisés[a], mediante sorteio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés”, expressão que indica ação realizada por intermédio de alguém.'
    reason: Esclarece o idioma hebraico de agência mediada e registra sua forma literal.
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: deram
  rationale: O verbo נתן descreve aqui a entrega ou atribuição das cidades; “deram” preserva a forma direta do hebraico e é natural em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão hebraica tradicional e sua referência coletiva, sem reduzi-la silenciosamente a uma designação mais genérica.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Representa diretamente o destinatário indicado pela preposição ל.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: estas cidades
  rationale: Preserva o demonstrativo e a referência às cidades especificadas no contexto anterior.
- source_word: מִגְרְשֵׁיהֶן
  choice: suas pastagens
  rationale: מִגְרָשׁ designa as áreas abertas ao redor das cidades, empregadas sobretudo para pastoreio; “pastagens” comunica esse sentido concreto com clareza.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: conforme havia ordenado
  rationale: “Conforme” expressa conformidade com a ordem divina, e o mais-que-perfeito composto deixa clara a anterioridade da ordem em relação à entrega.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Traduz de modo natural o idioma hebraico de agência mediada, cuja forma literal é “pela mão de Moisés”.
- source_word: בַּגּוֹרָל
  choice: mediante sorteio
  rationale: Indica que a distribuição foi determinada pelo lançamento de sortes; “mediante sorteio” é claro e idiomático em português.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva sua função nominal e representa de maneira amplamente aceita sua provável vocalização, sem substituí-lo por um título.
- issue: Agência da ordem dada por intermédio de Moisés
  choice: por meio de Moisés
  alternative: pela mão de Moisés
  rationale: A expressão hebraica atribui a ordem a Yahweh e apresenta Moisés como mediador. A tradução escolhida conserva essa relação sem fazer da expressão literal “mão” uma referência física.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. A sintaxe acompanha de perto a progressão hebraica, mas usa “por meio de” e “mediante sorteio” para evitar construções pouco naturais.
