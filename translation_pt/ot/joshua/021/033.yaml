  yaml_path: translation/ot/joshua/021/033.yaml
  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: pt
  text: Ao todo, as cidades dos gersonitas, segundo as suas famílias, foram treze cidades, com as suas pastagens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Ao todo, as cidades
  rationale: A expressão introduz a soma das cidades atribuídas; «Ao todo» comunica com naturalidade em português a função totalizadora de כָּל neste contexto.
- source_word: הַגֵּרְשֻׁנִּי
  choice: dos gersonitas
  rationale: O gentílico singular com artigo tem sentido coletivo e designa os descendentes de Gérson; o plural «gersonitas» é a forma natural em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo as suas famílias
  rationale: A preposição לְ marca aqui organização ou classificação por famílias; «segundo» preserva esse sentido distributivo.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: treze cidades
  rationale: Mantém a contagem explícita e traduz עִיר de modo coerente com a primeira ocorrência no versículo.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: com as suas pastagens
  rationale: מִגְרָשׁ refere-se às áreas abertas ligadas às cidades, usadas especialmente para o gado. «Pastagens» é claro e idiomático; «com» expressa naturalmente a inclusão dessas terras na fórmula de atribuição.
