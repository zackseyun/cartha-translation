  rationale: Nome próprio transliterado de modo natural em português, sem traduzir seu possível significado.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa as terras abertas ao redor de uma cidade, usadas especialmente para pastoreio; o pronome possessivo se refere, em cada ocorrência, à respectiva cidade.
- source_word: נַהֲלָל
  choice: Naalal
  rationale: Transliteração portuguesa legível do nome próprio hebraico, sem impor uma identificação ou significado além do texto.
- source_word: עָרִים אַרְבַּע
  choice: quatro cidades
  rationale: Reproduz diretamente a fórmula de resumo numeral que encerra esta parte da lista.
