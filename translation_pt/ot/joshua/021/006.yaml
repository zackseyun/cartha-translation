source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: pt
  text: E aos filhos de Gérson couberam por sorte treze cidades, dentre as famílias[a] da tribo de Issacar, da tribo de Aser, da tribo de Naftali e da meia tribo de Manassés em Basã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “clãs”. O termo hebraico pode indicar grupos familiares extensos ou clãs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: E aos filhos de Gérson
  rationale: Mantém a continuidade da lista, o valor dativo de לְ e a expressão genealógica hebraica “filhos de”, aqui referente aos descendentes do ancestral levítico Gérson.
- source_word: מִ/מִּשְׁפְּחֹות
  choice: dentre as famílias
  rationale: מִשְׁפָּחוֹת designa grupos familiares extensos e também pode ser traduzido por “clãs”. “Dentre as famílias” expressa naturalmente a origem das cidades sem apagar a alternativa lexical.
- source_word: מַטֵּה
  choice: tribo
  rationale: No contexto da distribuição territorial, מַטֶּה designa a unidade tribal, não um bastão ou ramo.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: e da meia tribo de Manassés
  rationale: “Meia tribo” é a forma portuguesa tradicional e concisa para a divisão territorial de Manassés.
- source_word: בַ/בָּשָׁן
  choice: em Basã
  rationale: Basã é o nome próprio da região; a preposição localiza essa metade da tribo de Manassés.
- source_word: בַּ/גּוֹרָל
  choice: por sorte
  rationale: Indica o método de distribuição das cidades. A expressão portuguesa “por sorte” preserva a prática de sorteio, sem reduzi-la ao sentido moderno de acaso ou boa fortuna.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: treze cidades
  rationale: Reproduz o número e o substantivo da conclusão hebraica em ordem natural no português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira ampla. A oração nominal hebraica depende do verbo do contexto anterior; “couberam” foi explicitado para formar uma frase natural em português sem acrescentar um novo ato de concessão. A colocação de “por sorte” junto de “couberam” esclarece que o sorteio determinou a distribuição das treze cidades.
