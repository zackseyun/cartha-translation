base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: pt
  text: Todas as cidades destinadas aos filhos de Merari[a], segundo as suas famílias — os restantes[b] dentre as famílias dos levitas —, totalizaram doze cidades; esse foi o lote que lhes coube por sorteio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos descendentes de Merari” ou “aos meraritas”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o restante das famílias levíticas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Todas as cidades
  rationale: Mantém a abrangência de כָּל e traduz עִיר pelo termo tradicional e adequado às listas de territórios e povoações.
- source_word: לִבְנֵי מְרָרִי
  choice: destinadas aos filhos de Merari
  rationale: “Filhos de Merari” preserva a forma genealógica hebraica; “destinadas” torna natural em português a relação expressa pela preposição לְ no contexto da distribuição das cidades.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo as suas famílias
  rationale: Expressa a distribuição conforme as divisões familiares, preservando o sentido de מִשְׁפָּחָה sem impor o termo mais técnico “clãs”.
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: os restantes dentre as famílias dos levitas
  rationale: Conserva o particípio substantivado “os restantes” e sua relação com o conjunto mais amplo das famílias levíticas.
- source_word: וַיְהִי גּוֹרָלָם
  choice: atribuídas por sorteio
  rationale: Transmite de modo idiomático a ideia de que essas cidades constituíram a porção recebida mediante sorteio, sem obscurecer o procedimento distributivo.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: foram doze ao todo
  rationale: Adapta a ordem numeral hebraica ao português e usa “ao todo” para ligar claramente o total a “todas as cidades”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção parentética preserva a aposição hebraica e sua possível tensão sintática, enquanto “atribuídas por sorteio” evita a formulação pouco idiomática “seu lote foi”.
