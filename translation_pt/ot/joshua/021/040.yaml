  source_fidelity: 'A tradução preserva corretamente os principais elementos: totalidade das cidades, descendência de Merari, divisão por famílias, o grupo remanescente entre os levitas e o número doze. Contudo, “foram doze ao todo, atribuídas por sorteio” transforma a cláusula hebraica “o seu lote foi doze cidades” numa qualificação passiva das cidades. Uma formulação que explicite o lote recebido por sorteio reproduz melhor a relação sintática e semântica do hebraico.'
  naturalness: 'O texto é claro e de registro apropriado. A frase final, porém, fica um pouco pesada e ambígua: “foram doze ao todo, atribuídas por sorteio” pode dar a entender que cada cidade foi individualmente atribuída, em vez de identificar doze cidades como o lote do grupo. A revisão torna a leitura mais natural.'
