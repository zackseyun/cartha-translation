  text: וְ/אֶת יַתִּר֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת אֶשְׁתְּמֹ֖עַ וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/014.yaml
  text: Jattir with its pasturelands[a], and Eshtemoa with its pasturelands.
translation:
  language: pt
  text: Jatir com as suas pastagens[a], e Estemoa com as suas pastagens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «terras de uso comum», isto é, as terras que rodeavam cada cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַתִּר
  choice: Jatir
  rationale: Nome próprio de lugar transliterado segundo convenções naturais em português; a letra hebraica inicial yod é representada por J, como é comum em nomes bíblicos portugueses.
- source_word: מִגְרָשֶׁהָ
  choice: as suas pastagens
  rationale: O termo designa as áreas abertas ao redor da cidade, usadas em comum, especialmente para o pastoreio. O sufixo feminino singular remete a cada cidade; a formulação portuguesa conserva esse vínculo.
- source_word: אֶשְׁתְּמֹעַ
  choice: Estemoa
  rationale: Transliteração portuguesa clara do nome próprio, sem o grupo consonantal inicial pouco natural «Esht-».
- source_word: וְאֶת
  choice: e
  rationale: A conjunção estrutura a enumeração; o marcador hebraico de objeto direto não precisa ser traduzido separadamente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe própria de uma lista territorial. «Pastagens» comunica a função principal das áreas circundantes, enquanto a nota preserva o sentido mais amplo de terras comunitárias.
