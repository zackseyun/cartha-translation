  text: אֶת אַיָּלוֹן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/024.yaml
  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
translation:
  language: pt
  text: 'Aijalom com suas pastagens[a] e Gate-Rimom com suas pastagens: quatro cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras comuns” ou “terras ao redor”; o termo hebraico se refere às terras pertencentes a uma cidade, muitas vezes usadas para pastoreio.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Aijalom
  rationale: Nome de lugar transliterado segundo uma forma bíblica consagrada e reconhecível em português.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa as terras pertencentes à cidade e situadas ao redor dela, frequentemente destinadas ao pastoreio; “pastagens” comunica com naturalidade sua provável função neste contexto.
- source_word: גַּת רִמּוֹן
  choice: Gate-Rimom
  rationale: Nome composto transliterado em forma corrente nas Bíblias em português; o hífen deixa claro que se trata de um único topônimo.
- source_word: עָרִים אַרְבַּע
  choice: quatro cidades
  rationale: Reproduz de modo direto a fórmula numérica que encerra a lista iniciada no versículo anterior.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: com ... e ... com
  rationale: Os marcadores de objeto direto não têm equivalente lexical em português; a coordenação natural da lista e a relação entre cada cidade e suas terras são expressas por “com” e “e”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas reconhecíveis para leitores brasileiros. A estrutura concisa preserva o caráter de lista do hebraico; os dois primeiros nomes que completam o total de quatro cidades aparecem no versículo anterior.
