  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: pt
  text: Assim, os filhos de Israel[a] deram aos levitas, da herança dos israelitas, conforme a ordem de Yahweh[b], estas cidades e suas terras de pastagem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Em hebraico, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “conforme a boca de Yahweh”, expressão que significa “conforme a ordem de Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, os terrenos abertos pertencentes às cidades, usados especialmente como pastagem.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: deram
  rationale: O sentido básico de נתן neste contexto narrativo é “dar”; a forma simples mantém a proximidade com o hebraico e soa natural em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar masculina do hebraico, enquanto a nota registra o equivalente coletivo corrente.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: Tradução direta do destinatário, com a designação tradicional e clara em português.
- source_word: מִנַּחֲלָתָם
  choice: da herança deles
  rationale: נחלה se refere aqui à porção territorial recebida pelas tribos; “herança” conserva essa linguagem, e “deles” evita possível ambiguidade de “sua”.
- source_word: אֶל פִּי יְהוָה
  choice: conforme a ordem de Yahweh
  rationale: A expressão idiomática significa agir de acordo com uma ordem; a tradução comunica esse sentido sem reproduzir literalmente a metonímia hebraica “boca”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: estas cidades
  rationale: Correspondência direta e natural para o substantivo com demonstrativo.
- source_word: מִגְרְשֵׁיהֶן
  choice: suas terras de pastagem
  rationale: Designa os terrenos abertos vinculados às cidades, usados especialmente para manter os animais; a expressão é clara em português moderno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o nome próprio divino. “Yahweh” preserva esse nome por transliteração, sem convertê-lo em título.
- issue: Forma de traduzir בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A redação principal conserva a forma familiar explícita do hebraico; a nota oferece o sentido coletivo possível sem apagar a forma da fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase acompanha de perto o hebraico sem sacrificar a naturalidade. As notas preservam tanto a expressão étnico-familiar literal quanto a imagem idiomática da “boca” e esclarecem o sentido histórico de מִגְרָשׁ.
