base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/023.yaml
  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: pt
  text: 'E da tribo de Dã: Elteque com suas pastagens[a], e Gibetom com suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas terras de pastagem ao redor” / “suas terras de uso comum”, para o hebraico מִגְרָשֶׁהָ.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: E da tribo de Dã
  rationale: Neste contexto de distribuição territorial, מַטֶּה designa a tribo; a conjunção e a preposição são expressas naturalmente por “E da”.
- source_word: אֶת
  choice: '[marcador de objeto direto não traduzido]'
  rationale: O marcador hebraico de objeto direto não tem equivalente necessário em português.
- source_word: אֶלְתְּקֵא
  choice: Elteque
  rationale: Transliteração do topônimo hebraico em forma natural para leitores de língua portuguesa.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ refere-se às terras abertas ao redor da cidade, destinadas ao pastoreio ou ao uso comum. O sufixo feminino singular remete à cidade; em português, “suas pastagens” comunica o sentido com clareza.
- source_word: גִּבְּתוֹן
  choice: Gibetom
  rationale: Transliteração do topônimo hebraico segundo convenções naturais do português.
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção é traduzida por “e”, enquanto o marcador de objeto direto permanece sem tradução.
