  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת קִרְיַת֩ אַרְבַּ֨ע אֲבִ֧י הָֽ/עֲנ֛וֹק הִ֥יא חֶבְר֖וֹן בְּ/הַ֣ר יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: pt
  text: Assim, deram-lhes Quiriate-Arba (Arba era o pai de Anaque)[a], isto é, Hebrom, na região montanhosa de Judá, com as pastagens ao redor da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Arba era o pai, ou antepassado, de Anaque”. A expressão hebraica pode indicar tanto o pai imediato quanto um ancestral mais remoto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Assim, deram
  rationale: O wayyiqtol de נתן dá continuidade à sequência narrativa; “Assim” expressa essa progressão de modo natural.
- source_word: לָהֶם
  choice: lhes
  rationale: Mantém o pronome masculino plural do hebraico sem explicitar no versículo que os destinatários são os levitas.
- source_word: קִרְיַת אַרְבַּע
  choice: Quiriate-Arba
  rationale: Trata a expressão, literalmente “cidade de Arba”, como topônimo e emprega uma transliteração tradicional e legível em português.
- source_word: אֲבִי הָעֲנֹוק
  choice: Arba era o pai de Anaque
  rationale: A aposição identifica Arba por sua relação com Anaque. A frase explicita o sujeito implícito, sem eliminar a possível amplitude genealógica de אָב.
- source_word: הִיא חֶבְרוֹן
  choice: isto é, Hebrom
  rationale: A construção identifica Quiriate-Arba com Hebrom; “isto é” comunica naturalmente a função explicativa.
- source_word: בְּהַר יְהוּדָה
  choice: na região montanhosa de Judá
  rationale: Neste uso geográfico, הַר designa a zona elevada de Judá, não uma única montanha.
- source_word: מִגְרָשֶׁיהָ
  choice: as pastagens
  rationale: מִגְרָשׁ indica os terrenos abertos vinculados à cidade, especialmente usados para o pastoreio.
- source_word: סְבִיבֹתֶיהָ
  choice: ao redor da cidade
  rationale: Expressa a localização circundante. A repetição de “cidade” evita a ambiguidade pronominal que “ao redor dela” poderia criar em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém os topônimos bíblicos em formas portuguesas reconhecíveis e preserva em nota a ambiguidade genealógica do hebraico.
