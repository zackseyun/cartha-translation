base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/037.yaml
  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: pt
  text: Quedemote com suas pastagens[a], e Mefaate com suas pastagens — quatro cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras de uso comum” ou “terras de pastagem ao redor”; refere-se à área ligada a cada cidade (hebraico מִגְרָשׁ).
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Quedemote
  rationale: Nome próprio transliterado segundo convenções naturais do português, preservando o som inicial /k/ diante de e e a terminação tradicional em -e.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa a área aberta vinculada à cidade, usada como terreno comum ou para pastoreio. “Pastagens” é claro e adequado ao contexto das cidades levíticas; o sufixo feminino singular se refere a cada cidade.
- source_word: מֵיפָעַת
  choice: Mefaate
  rationale: Nome próprio transliterado de modo legível em português, sem o dígrafo inglês ph.
- source_word: עָרִים אַרְבַּע
  choice: quatro cidades
  rationale: Tradução direta do resumo numérico, mantendo “cidades” em consonância com o contexto da distribuição territorial.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: com ... e ... com ...
  rationale: Os marcadores de objeto estruturam a lista; em português, “com suas pastagens” expressa naturalmente a relação de cada cidade com a terra que lhe pertencia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios adaptados à ortografia portuguesa. O travessão antes do total torna natural o resumo final da lista sem alterar o sentido do hebraico.
