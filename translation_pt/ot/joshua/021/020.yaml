base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: pt
  text: Às famílias dos filhos de Coate — os levitas restantes dentre os filhos de Coate —, as cidades que lhes couberam por sorte[a] eram da tribo de Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “as cidades do seu lote”.'
    reason: A nota preserva a forma compacta do idioma hebraico, enquanto o texto principal explicita seu sentido distributivo.
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: Às famílias
  rationale: O לְ marca a relação distributiva no contexto da divisão das cidades; “Às famílias” expressa naturalmente os grupos destinatários.
- source_word: בְּנֵי קְהָת
  choice: filhos de Coate
  rationale: Preserva a linguagem genealógica formal do hebraico, sem excluir o sentido mais amplo de descendentes.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: os levitas restantes
  rationale: Identifica os coatitas como levitas e indica que estes ainda não haviam recebido sua distribuição, em continuidade com o contexto anterior.
- source_word: מִבְּנֵי קְהָת
  choice: dentre os filhos de Coate
  rationale: '“Dentre” comunica o valor partitivo de מִן: trata-se do grupo restante dentro da linhagem de Coate.'
- source_word: עָרֵי גוֹרָלָם
  choice: as cidades que lhes couberam por sorte
  rationale: Torna claro em português o idioma hebraico “cidades do seu lote” e conserva a ideia do sorteio usado na distribuição.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: da tribo de Efraim
  rationale: Neste contexto, מַטֶּה designa uma tribo; a preposição indica de qual território tribal vieram as cidades.
theological_decisions: []
