  text: לִ/בְנֵ֨י מְרָרִ֜י לְ/מִשְׁפְּחֹתָ֗/ם מִ/מַּטֵּ֨ה רְאוּבֵ֤ן וּ/מִ/מַּטֵּה גָד֙ וּ/מִ/מַּטֵּ֣ה זְבוּלֻ֔ן עָרִ֖ים שְׁתֵּ֥ים עֶשְׂרֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: pt
  text: 'Para os filhos de Merari[a], segundo as suas famílias, da tribo de Rúben, da tribo de Gade e da tribo de Zebulom: doze cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aos filhos de Merari, por seus clãs, foram destinadas, da tribo de Rúben, da tribo de Gade e da tribo de Zebulom, doze cidades.”'
    reason: A preposição ל pode ser expressa como “para” ou “aos” em sentido distributivo; “clãs” também explicita o sentido social de מִשְׁפְּחֹתָם, e o verbo “foram destinadas” torna explícita a relação implícita na frase nominal hebraica.
lexical_decisions:
- source_word: לִבְנֵי
  choice: Para os filhos de
  rationale: O prefixo ל indica atribuição ou destinação no contexto da distribuição das cidades. “Para os filhos de” conserva a estrutura e a linguagem familiar do hebraico sem substituir בני por uma paráfrase.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nome próprio transliterado segundo a forma tradicional em português.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo as suas famílias
  rationale: משפחה designa grupos familiares ou clãs; a expressão indica que a distribuição foi organizada conforme esses grupos.
- source_word: מִמַּטֵּה
  choice: da tribo de
  rationale: Embora מטה possa significar literalmente “vara” ou “cajado”, neste contexto de repartição territorial designa uma tribo.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional portuguesa do nome tribal.
- source_word: וּמִמַּטֵּה גָד
  choice: da tribo de Gade
  rationale: A conjunção é representada na coordenação final da lista, evitando repetição pesada em português sem perder a relação entre os três grupos.
- source_word: וּמִמַּטֵּה זְבוּלֻן
  choice: e da tribo de Zebulom
  rationale: Mantém explicitamente a conjunção final e emprega a forma tradicional portuguesa do nome.
- source_word: עָרִים
  choice: cidades
  rationale: Em listas de repartição territorial, עיר é adequadamente traduzido por “cidade”.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: doze
  rationale: Tradução direta do numeral cardinal, em ordem natural no português.
