review_pass:
  verdict: revise
  source_fidelity: A revisão é necessária porque «um dos clãs dos levitas» altera o plural de מִמִּשְׁפְּחֹת («dentre os clãs») e introduz uma classificação singular que o texto não afirma dessa forma. A formulação revista preserva a relação partitiva. «Homicida» é termo jurídico neutro em português e transmite melhor o referente nominal הָרֹצֵחַ do que a construção verbal «quem matasse alguém».
  naturalness: O texto revisto mantém um português moderno e claro. «Dentre os clãs dos levitas» é natural neste contexto genealógico-administrativo, e «cidade de refúgio para o homicida» é uma expressão bíblica e jurídica estável, sem implicar por si só premeditação.
  terminology: Foram mantidos Gérson, Manassés, Golã, Basã e Beesterá. «Terras de pastagem» traduz adequadamente מִגְרָשֶׁהָ. A nota preserva a forma massorética de Josué e registra a forma da passagem paralela.
  issues:
  - severity: medium
    issue: «um dos clãs dos levitas»
    rationale: O hebraico traz «dentre/os clãs dos levitas» no plural (מִמִּשְׁפְּחֹת הַלְוִיִּם). «Um dos clãs» muda a formulação e torna mais restrita a relação expressa pelo texto.
  - severity: low
    issue: «para quem matasse alguém»
    rationale: A construção com imperfeito do subjuntivo pode soar hipotética ou prospectiva. «Para o homicida» conserva o substantivo jurídico hebraico e, neste contexto de cidades de refúgio, não exige a ideia de homicídio premeditado.
  revised_text: Aos filhos de Gérson, dentre os clãs dos levitas, deram, da meia tribo de Manassés, Golã em Basã, cidade de refúgio para o homicida, com suas terras de pastagem, e Beesterá[a], com suas terras de pastagem — duas cidades.
  revised_footnotes:
