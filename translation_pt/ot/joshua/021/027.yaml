base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: pt
  text: Aos filhos de Gérson, dentre os clãs dos levitas, deram, da meia tribo de Manassés, Golã em Basã, cidade de refúgio para o homicida, com suas terras de pastagem, e Beesterá[a], com suas terras de pastagem — duas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz Beesterá; compare 1 Crônicas 6:71, onde aparece Astarote.
    reason: Registra a leitura da passagem paralela sem substituir a forma Beesterá do texto hebraico de Josué.
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: Aos filhos de Gérson
  rationale: Preserva a forma genealógica do hebraico בְּנֵי, que neste contexto designa os descendentes de Gérson, e continua natural em português bíblico moderno.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: um dos clãs dos levitas
  rationale: מִשְׁפָּחוֹת indica subdivisões de parentesco. A formulação explicita naturalmente que os filhos de Gérson constituíam um dos clãs levíticos.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: da meia tribo de Manassés
  rationale: מַטֶּה significa 'tribo' no contexto das distribuições territoriais de Josué; 'meia tribo' é a expressão portuguesa consagrada e clara.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: cidade de refúgio para quem matasse alguém
  rationale: Mantém a expressão jurídica 'cidade de refúgio' e evita que 'homicida' sugira necessariamente assassinato premeditado; o contexto legal contempla especialmente uma morte causada sem intenção.
- source_word: גלון בַּ/בָּשָׁן
  choice: Golã, em Basã
  rationale: Os topônimos são transliterados segundo formas correntes em português.
- source_word: מִגְרָשֶׁהָ
  choice: suas terras de pastagem
  rationale: מִגְרָשׁ designa os terrenos abertos ao redor das cidades levíticas, destinados sobretudo ao pastoreio.
- source_word: בְּעֶשְׁתְּרָה
  choice: Beesterá
  rationale: Segue a leitura do Texto Massorético neste versículo, sem harmonizá-la com o nome Astarote na passagem paralela.
- source_word: עָרִים שְׁתָּיִם
  choice: duas cidades
  rationale: Reproduz de forma direta e idiomática a contagem que encerra a lista.
- source_word: sentido verbal implícito na fórmula de distribuição
  choice: deram
  rationale: Embora o versículo não contenha verbo finito, o contexto imediato fornece o verbo da fórmula de distribuição; explicitá-lo produz uma frase completa em português.
theological_decisions:
- issue: Sentido jurídico de הָרֹצֵחַ
  choice: quem matasse alguém
  alternative: o homicida
  rationale: A opção preserva a abrangência do termo neste contexto sem atribuir automaticamente premeditação ou culpa moral específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas onomásticas usuais no Brasil. O marcador [a] foi colocado junto a Beesterá, termo ao qual a nota se refere. A repetição de 'com suas terras de pastagem' foi mantida para refletir a estrutura da lista hebraica.
