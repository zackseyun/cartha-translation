    text: O hebraico traz Beesterá; compare 1 Crônicas 6:71, onde aparece Astarote.
    reason: Registra a leitura da passagem paralela sem substituir a forma Beesterá do texto hebraico de Josué.
  revision_rationale: A revisão corrige a expressão partitiva referente aos clãs levíticos e substitui uma perífrase verbal menos precisa pelo termo jurídico neutro «homicida». Conserva-se a ordem da lista, a repetição de «com suas terras de pastagem», a contagem final e a nota ancorada em Beesterá.
