base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: pt
  text: Deram-lhes Siquém, cidade de refúgio para o homicida[a], com suas pastagens, na região montanhosa de Efraim[b], e Gezer com suas pastagens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para aquele que matou”. O termo jurídico hebraico refere-se a quem causou uma morte e podia fugir em busca de asilo enquanto aguardava julgamento; não indica necessariamente um assassino condenado.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “no monte de Efraim”; isto é, na região montanhosa de Efraim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Deram-lhes
  rationale: O wayyiqtol de נתן expressa a sequência narrativa no passado. A conjunção inicial não precisa ser reproduzida em português para manter a fluidez.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: cidade de refúgio para o homicida
  rationale: A expressão designa uma cidade de asilo destinada a quem causou uma morte e aguardava julgamento; “homicida” conserva o sentido jurídico sem pressupor necessariamente assassinato premeditado.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma consagrada em português para o topônimo hebraico.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: Refere-se às terras abertas vinculadas à cidade, utilizadas sobretudo para pastoreio e outros usos comunitários.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: Nesse uso geográfico, הַר indica a região de colinas ou montanhas associada a Efraim, e não necessariamente um monte isolado.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Transliteração tradicional e amplamente reconhecida do topônimo em português.
theological_decisions:
- issue: Condição jurídica de הָרֹצֵחַ
  choice: homicida, com nota explicativa
  alternative: assassino
  rationale: O contexto das cidades de refúgio inclui quem causou uma morte sem intenção e não permite pressupor culpa por assassinato antes do julgamento.
translation_notes:
  register: 'Português moderno, claro e digno, com formas toponímicas correntes. A ordem foi ajustada de modo natural, mantendo “cidade de refúgio” em aposição a Siquém. Os marcadores foram associados ao conteúdo correspondente: [a] ao termo jurídico “homicida” e [b] à expressão geográfica.'
