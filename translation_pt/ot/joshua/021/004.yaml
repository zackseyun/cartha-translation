base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: pt
  text: Então saiu a sorte para as famílias dos coatitas; e aos filhos do sacerdote Arão, dentre os levitas, couberam por sorte treze cidades da tribo de Judá, da tribo de Simeão e da tribo de Benjamim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: saiu a sorte
  rationale: Preserva de modo natural em português a imagem concreta do idioma hebraico, segundo o qual a sorte 'saiu'.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: para as famílias dos coatitas
  rationale: מִשְׁפְּחֹת designa agrupamentos familiares ou clãs; 'famílias' é claro e transparente, e 'coatitas' expressa naturalmente o grupo descendente de Coate.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן ... בַּגּוֹרָל
  choice: aos filhos do sacerdote Arão ... couberam por sorte
  rationale: A construção hebraica é elíptica. 'Couberam por sorte' comunica a atribuição das cidades sem recorrer a uma tradução excessivamente literal e pouco natural.
- source_word: מִן הַלְוִיִּם
  choice: dentre os levitas
  rationale: 'Torna explícito o sentido partitivo: os filhos de Arão constituíam um grupo pertencente ao conjunto dos levitas.'
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: da tribo de Judá, da tribo de Simeão e da tribo de Benjamim
  rationale: מַטֶּה designa aqui cada divisão tribal. A repetição de 'da tribo de' acompanha a estrutura enfática e clara do hebraico.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: treze cidades
  rationale: É a equivalência corrente de עָרִים no contexto das distribuições territoriais.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém a estrutura distributiva do hebraico, mas resolve sua elipse de modo idiomático. Não se acrescentou nota, pois 'saiu a sorte' é uma expressão natural em português e preserva diretamente a imagem hebraica.
