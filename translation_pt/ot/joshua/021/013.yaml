  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: pt
  text: E aos filhos de Arão, o sacerdote, deram Hebrom, cidade de refúgio para o homicida[a], com suas pastagens, e Libna, com suas pastagens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para quem matou alguém”. O termo hebraico é uma designação jurídica para a pessoa que causou uma morte e podia fugir para uma cidade de refúgio; aqui ele não implica necessariamente assassinato premeditado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: E aos filhos de Arão, o sacerdote
  rationale: Mantém o destinatário em posição inicial e conserva a forma genealógica “filhos de Arão”; a aposição identifica Arão por seu ofício.
- source_word: נָתְנוּ
  choice: deram
  rationale: Reproduz o sentido básico do verbo נתן e é natural no contexto da concessão das cidades levíticas.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: cidade de refúgio para o homicida
  rationale: “Cidade de refúgio” é a expressão jurídica estabelecida no contexto. “Homicida” designa quem causou uma morte sem transformar o termo, por si só, em “assassino”, que sugeriria premeditação.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: O termo indica as áreas abertas ao redor da cidade destinadas, entre outros usos, ao pastoreio; “pastagens” é claro e adequado ao contexto.
- source_word: לִבְנָה
  choice: Libna
  rationale: Forma tradicional do topônimo em português.
theological_decisions:
- issue: Grau de culpa pressuposto por הָרֹצֵחַ
  choice: homicida
  alternative: assassino
  rationale: O termo identifica juridicamente quem matou alguém e podia buscar refúgio; neste contexto, não se deve inserir a ideia de assassinato premeditado.
translation_notes:
  register: Português moderno, claro e digno, com ordem próxima à do hebraico. Mantiveram-se “filhos de Arão” e a repetição de “com suas pastagens”, características da formulação da lista.
