base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: pt
  text: Todas as cidades dos levitas no território dos filhos de Israel eram quarenta e oito cidades, com as suas pastagens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terrenos abertos” ou “terrenos comunais”, isto é, as áreas ao redor das cidades.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Todas
  rationale: Expressa de modo direto a totalidade das cidades levíticas resumidas no versículo.
- source_word: עָרֵי הַלְוִיִּם
  choice: as cidades dos levitas
  rationale: Preserva com clareza a relação genitiva do hebraico, sem converter a expressão no adjetivo mais interpretativo “cidades levíticas”.
- source_word: בְּתוֹךְ אֲחֻזַּת
  choice: no território
  rationale: A combinação indica localização dentro da propriedade territorial de Israel; “no território” é natural em português e comunica o sentido fundiário de אֲחֻזָּה.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Mantém a forma masculina e a designação nacional tradicional de maneira transparente ao hebraico.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: eram quarenta e oito cidades
  rationale: Supre a cópula exigida pelo português e conserva exatamente a construção resumitiva e o número.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: com as suas pastagens
  rationale: Neste contexto de distribuição territorial, מִגְרָשׁ designa os terrenos abertos ao redor das cidades, usados especialmente como pastagens.
theological_decisions:
- issue: Designação nacional masculina בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução conserva a forma masculina explícita do hebraico, que funciona corporativamente como designação do povo de Israel, sem restringir a referência apenas aos homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “No território” evita a rigidez de “dentro da possessão”, enquanto “pastagens” apresenta com clareza o sentido contextual e a nota preserva a extensão lexical do termo hebraico.
