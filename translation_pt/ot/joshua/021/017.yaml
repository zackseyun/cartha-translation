  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֔ן אֶת גִּבְע֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת גֶּ֖בַע וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/017.yaml
  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: pt
  text: e, da tribo de Benjamim, Gibeom com suas pastagens[a], e Geba com suas pastagens;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras de uso comum” ou “terrenos abertos”, isto é, as terras ao redor de cada cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: e, da tribo de
  rationale: Em contextos de distribuição territorial, מַטֶּה significa “tribo”; a conjunção e a preposição são representadas por “e, da”, mantendo a ligação com a lista anterior.
- source_word: בִנְיָמִן
  choice: Benjamim
  rationale: Forma tradicional e amplamente reconhecida do nome tribal em português.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeom
  rationale: O marcador de objeto direto אֶת não é expresso em português; o topônimo segue a forma portuguesa consagrada.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa os terrenos abertos ao redor da cidade levítica, usados como pasto ou área comum. “Pastagens” é claro e natural neste contexto; o possessivo retoma a cidade.
- source_word: גֶּבַע
  choice: Geba
  rationale: Forma convencional do topônimo em português bíblico.
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção coordena as cidades enumeradas; o marcador de objeto direto não recebe tradução própria em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos topônimos. A pontuação preserva o caráter de continuação de uma lista iniciada no contexto anterior.
