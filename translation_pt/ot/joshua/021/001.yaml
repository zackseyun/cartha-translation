id: JOS.21.1
reference: Joshua 21:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: pt
  text: Então os chefes das casas paternas[a] dos levitas se aproximaram de Eleazar, o sacerdote, de Josué, filho de Num, e dos chefes das casas paternas das tribos dos filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes das famílias” ou “chefes das casas ancestrais”. A expressão hebraica se refere a agrupamentos familiares ou clânicos organizados segundo a linhagem paterna.
    reason: lexical_alternative
  - marker: b
    text: Ou “dos israelitas”. Literalmente, “dos filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: se aproximaram
  rationale: Expressa naturalmente o sentido de נגשׁ, “aproximar-se”, e preserva o movimento narrativo e o caráter formal da apresentação diante dos líderes.
- source_word: רָאשֵׁי אֲבוֹת
  choice: os chefes das casas paternas
  rationale: Mantém visível o idioma social hebraico, que designa líderes de agrupamentos familiares organizados segundo a linhagem paterna, sem reduzi-lo simplesmente a “chefes”.
- source_word: הַלְוִיִּם
  choice: dos levitas
  rationale: Forma portuguesa consagrada e direta para o nome do grupo tribal.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Eleazar, o sacerdote
  rationale: Traduz כֹּהֵן diretamente por “sacerdote”; a aposição com vírgulas é natural em português.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Forma tradicional e natural em português para o patronímico hebraico.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: os chefes das casas paternas das tribos
  rationale: 'Preserva a estrutura social em níveis do hebraico: casas paternas representadas por seus chefes dentro das tribos.'
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: Conserva a expressão familiar corporativa do hebraico e, no contexto, especifica a quem pertencem as tribos.
theological_decisions:
- issue: Linguagem de parentesco marcada pelo gênero na estrutura tribal de Israel
  choice: Manter “casas paternas” e “filhos de Israel” no texto principal
  alternative: “famílias ancestrais” e “israelitas” ou “povo de Israel”
  rationale: O hebraico emprega termos masculinos concretos para estruturas familiares e tribais representativas. A tradução os preserva sem afirmar que somente indivíduos do sexo masculino estejam incluídos na comunidade designada por “filhos de Israel”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Casas paternas” preserva a estrutura social do original, enquanto as notas oferecem equivalentes mais correntes. Os marcadores foram colocados junto às expressões que efetivamente explicam.
source_grounding:
  english_pob_role: consult_only
