  language: en
  yaml_path: translation/ot/joshua/021/029.yaml
  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: pt
  text: Jarmute com suas terras de pastagem, e En-Ganim[a] com suas terras de pastagem — quatro cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode transliterar Aim-Ganim.
    reason: Registra uma alternativa legítima de transliteração do topônimo hebraico.
lexical_decisions:
- source_word: יַרְמוּת
  choice: Jarmute
  rationale: Nome próprio transliterado segundo uma forma natural e reconhecível em português, com vogal final para facilitar a pronúncia.
- source_word: מִגְרָשֶׁהָ
  choice: suas terras de pastagem
  rationale: No contexto das cidades levíticas, o termo designa os terrenos abertos ao redor de cada cidade, utilizados especialmente para pastagem; o sufixo feminino singular se refere a cada cidade.
- source_word: עֵין גַּנִּים
  choice: En-Ganim
  rationale: O topônimo é transliterado, não traduzido; embora seus componentes possam significar «fonte dos jardins», conservar o nome próprio evita transformar a designação geográfica em descrição.
- source_word: עָרִים אַרְבַּע
  choice: quatro cidades
  rationale: Reproduz de modo direto a fórmula hebraica que resume o número de cidades da lista.
