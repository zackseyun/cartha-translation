  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: pt
  text: 'E, da tribo de Gade: Ramote em Gileade[b], cidade de refúgio para o homicida[a], com suas terras de pastagem[c], e Maanaim, com suas terras de pastagem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que matou”. Neste contexto jurídico, o termo não pressupõe necessariamente assassinato premeditado.
    reason: lexical_alternative
  - marker: b
    text: Ou “Ramote-Gileade”. O hebraico pode ser entendido como “Ramote em Gileade” ou representado como um nome composto tradicional.
    reason: alternative_reading
  - marker: c
    text: “Terras de pastagem” são as áreas ao redor da cidade concedidas para uso juntamente com ela.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה גָד
  choice: E, da tribo de Gade
  rationale: Em contextos de distribuição territorial, מַטֶּה significa “tribo”; a conjunção e a preposição prefixadas são expressas naturalmente por “E, da”.
- source_word: עִיר מִקְלַט
  choice: cidade de refúgio
  rationale: Expressão jurídica estabelecida para uma cidade designada como lugar de asilo.
- source_word: הָרֹצֵחַ
  choice: o homicida
  rationale: No contexto das cidades de refúgio, o termo designa quem matou uma pessoa e pode buscar asilo até que o caso seja julgado; “homicida” evita pressupor assassinato premeditado.
- source_word: רָמֹת בַּגִּלְעָד
  choice: Ramote em Gileade
  rationale: Mantém o nome próprio em transliteração portuguesa e traduz בַּ como “em”, preservando a possibilidade de entender Gileade como indicação regional.
- source_word: מִגְרָשֶׁהָ
  choice: suas terras de pastagem
  rationale: מִגְרָשׁ designa as áreas abertas ao redor da cidade, destinadas ao uso associado a ela, especialmente como pastagens.
- source_word: מַחֲנַיִם
  choice: Maanaim
  rationale: Nome próprio transliterado segundo a forma tradicional e legível em português.
