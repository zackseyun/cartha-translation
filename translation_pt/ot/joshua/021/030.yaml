  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: pt
  text: 'e, da tribo de Aser: Misal e suas pastagens[a][b], Abdom e suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Miseal». A forma desse nome de lugar varia entre as traduções.
    reason: lexical_alternative
  - marker: b
    text: As «pastagens» eram as terras abertas pertencentes à cidade, usadas especialmente para o pastoreio e outras atividades comunitárias.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: e, da tribo de
  rationale: No contexto da distribuição das cidades, מַטֶּה designa uma tribo; os prefixos são representados por «e, da».
- source_word: אָשֵׁר
  choice: Aser
  rationale: Forma tradicional e amplamente reconhecida do nome da tribo em português.
- source_word: אֶת
  choice: —
  rationale: Marcador hebraico de objeto direto, sem equivalente explícito necessário em português.
- source_word: מִשְׁאָל
  choice: Misal
  rationale: Transliteração portuguesa simples do topônimo hebraico; outras tradições adotam formas como Miseal.
- source_word: מִגְרָשֶׁהָ
  choice: com suas pastagens
  rationale: מִגְרָשׁ indica as terras abertas pertencentes à cidade, especialmente destinadas ao pastoreio e a usos comunitários.
- source_word: עַבְדּוֹן
  choice: Abdom
  rationale: Forma portuguesa tradicional do topônimo hebraico.
- source_word: וְ/אֶת
  choice: e
  rationale: A conjunção é traduzida por «e», enquanto o marcador de objeto direto não recebe tradução própria.
