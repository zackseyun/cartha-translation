lexical_decisions:
- source_word: חֹלֹן
  choice: Holom
  rationale: Nome de lugar transliterado em forma natural para o português; o texto de Josué traz חֹלֹן, enquanto a lista paralela apresenta uma forma diferente.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: O termo designa as áreas abertas pertencentes à cidade, especialmente usadas para pastoreio e uso comum; a forma com sufixo feminino refere-se a cada cidade.
- source_word: דְּבִר
  choice: Debir
  rationale: Nome de lugar transliterado diretamente, sem traduzir seu possível sentido lexical.
- source_word: וְאֶת
  choice: e / com
  rationale: A conjunção que coordena a lista é representada por «e»; o marcador de objeto não é traduzido, e a relação entre cada cidade e suas áreas é expressa naturalmente por «com».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa própria de uma lista. «Pastagens» comunica de modo acessível a função principal das áreas abertas vinculadas às cidades levíticas.
