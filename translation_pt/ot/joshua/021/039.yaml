base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/039.yaml
  text: Heshbon with its pasturelands[a], and Jazer with its pasturelands—four cities in all.
translation:
  language: pt
  text: Hesbom com suas pastagens[a], e Jazer com suas pastagens — ao todo, quatro cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras de uso comum” ou “terras abertas ao redor”; o termo hebraico designa a área aberta pertencente a uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbom
  rationale: Forma portuguesa tradicional e amplamente reconhecível do topônimo hebraico.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: O termo designa a área aberta pertencente à cidade, frequentemente usada para pastoreio; o plural natural em português se ajusta à repetição na lista.
- source_word: יַעְזֵר
  choice: Jazer
  rationale: Transliteração corrente e clara do topônimo hebraico em português.
- source_word: כָּל עָרִים אַרְבַּע
  choice: ao todo, quatro cidades
  rationale: Expressa de modo idiomático a construção hebraica resumitiva, literalmente 'todas as cidades, quatro'.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: coordenação da lista, sem equivalente lexical separado
  rationale: Os marcadores de objeto direto pertencem à estrutura da frase mais ampla e não requerem representação explícita em português.
