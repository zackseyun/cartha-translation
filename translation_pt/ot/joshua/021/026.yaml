  text: כָּל עָרִ֥ים עֶ֖שֶׂר וּ/מִגְרְשֵׁי/הֶ֑ן לְ/מִשְׁפְּח֥וֹת בְּנֵֽי קְהָ֖ת הַ/נּוֹתָרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: pt
  text: Ao todo, foram dez cidades[a], com suas terras de pastagem[b], para os clãs dos demais filhos de Coate.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Todas as cidades eram dez”. A construção é uma fórmula de resumo que encerra a lista.'
    reason: lexical_alternative
  - marker: b
    text: “Terras de pastagem” eram as áreas abertas pertencentes às cidades, usadas especialmente para o pastoreio e atividades relacionadas.
    reason: cultural_note
  - marker: c
    text: Ou “dos demais coatitas”; literalmente, “dos demais filhos de Coate”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: Ao todo, foram dez cidades
  rationale: Expressa com naturalidade em português a fórmula hebraica de resumo que encerra a lista, mantendo o total de dez cidades.
- source_word: מִגְרְשֵׁיהֶן
  choice: suas terras de pastagem
  rationale: Designa as áreas abertas vinculadas às cidades, usadas especialmente para o pastoreio; a expressão é clara e mais precisa que simplesmente “arredores”.
- source_word: לְמִשְׁפְּחוֹת
  choice: para os clãs
  rationale: מִשְׁפָּחוֹת refere-se a subdivisões de parentesco dentro de uma tribo; “clãs” comunica melhor essa unidade social do que “famílias” no português atual.
- source_word: בְּנֵי קְהָת
  choice: filhos de Coate
  rationale: Mantém a formulação genealógica literal do hebraico, sem obscurecer que se trata dos descendentes de Coate.
- source_word: הַנּוֹתָרִים
  choice: demais
  rationale: Distingue estes clãs coatitas do ramo mencionado anteriormente, que já havia recebido cidades; “demais” é conciso e natural.
