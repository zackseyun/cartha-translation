  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
translation:
  language: pt
  text: 'Anatote com suas pastagens[a], e Almom com suas pastagens: quatro cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras de uso comum” ou “terrenos ao redor”. O termo hebraico designa as terras abertas pertencentes a uma cidade.
    reason: Alternativa lexical que preserva a amplitude do termo hebraico, não limitado exclusivamente ao pastoreio.
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: Anatote
  rationale: Nome próprio de lugar, transliterado segundo a forma tradicional e reconhecível em português.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: No contexto das cidades levíticas, o termo designa os terrenos abertos pertencentes à cidade, frequentemente destinados ao pastoreio. O sufixo feminino singular refere-se a cada cidade.
- source_word: עַלְמוֹן
  choice: Almom
  rationale: Nome próprio de lugar, transliterado em forma natural para leitores de português.
- source_word: עָרִים אַרְבַּע
  choice: quatro cidades
  rationale: Tradução direta da expressão numeral que resume os locais enumerados.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: coordenação dos elementos da lista
  rationale: O marcador hebraico de objeto direto não tem equivalente lexical em português; sua função é refletida na estrutura da enumeração e na conjunção.
