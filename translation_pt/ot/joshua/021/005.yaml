base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: pt
  text: Aos demais descendentes de Coate[a] couberam, por sorteio, dez cidades dos clãs da tribo de Efraim, da tribo de Dã e da meia tribo de Manassés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos demais coatitas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: Aos demais descendentes de Coate
  rationale: A preposição ל introduz o grupo beneficiário da distribuição. “Descendentes” comunica naturalmente o sentido coletivo de בְּנֵי neste contexto genealógico, e “demais” identifica os coatitas não mencionados no versículo anterior.
- source_word: מִמִּשְׁפְּחֹת
  choice: dos clãs
  rationale: No contexto da organização tribal de Israel, מִשְׁפָּחוֹת designa subdivisões de uma tribo; “clãs” é mais preciso que o genérico “famílias”.
- source_word: מַטֵּה אֶפְרַיִם
  choice: da tribo de Efraim
  rationale: Aqui מַטֶּה designa inequivocamente uma unidade tribal, não um bastão.
- source_word: וּמִמַּטֵּה דָן
  choice: da tribo de Dã
  rationale: Mantém o paralelismo da enumeração das tribos de onde vieram as cidades.
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: da meia tribo de Manassés
  rationale: “Meia tribo” é a designação convencional e clara da parte da tribo de Manassés em questão.
- source_word: בַּגּוֹרָל
  choice: por sorteio
  rationale: Expressa o procedimento pelo qual as cidades foram atribuídas, em português corrente e sem sugerir mero acaso.
- source_word: עָרִים עָשֶׂר
  choice: dez cidades
  rationale: Tradução direta da expressão numeral e do substantivo עִיר no contexto da lista territorial.
- source_word: implicit verbless clause
  choice: couberam
  rationale: O hebraico apresenta uma construção nominal elíptica. “Couberam” fornece em português a ligação verbal exigida pelo contexto distributivo sem acrescentar um agente não expresso.
