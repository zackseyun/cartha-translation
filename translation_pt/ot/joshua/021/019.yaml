  text: כָּל עָרֵ֥י בְנֵֽי אַהֲרֹ֖ן הַ/כֹּֽהֲנִ֑ים שְׁלֹשׁ עֶשְׂרֵ֥ה עָרִ֖ים וּ/מִגְרְשֵׁי/הֶֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/019.yaml
  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: pt
  text: Ao todo, as cidades dos filhos de Arão, os sacerdotes, eram treze, com suas pastagens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Ao todo, as cidades
  rationale: A expressão resume a totalidade das cidades enumeradas. “Ao todo” comunica naturalmente em português que se apresenta o número total.
- source_word: בְנֵי אַהֲרֹן
  choice: dos filhos de Arão
  rationale: Preserva a expressão genealógica formal do hebraico e a referência à linhagem sacerdotal, sem substituí-la pela interpretação mais explícita “descendentes”.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Mantém a identificação apositiva dos filhos de Arão de maneira clara e natural.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: eram treze
  rationale: O substantivo “cidades” já aparece no início da oração; evitar sua repetição produz português natural sem perder nenhuma informação.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: com suas pastagens
  rationale: Neste contexto das cidades levíticas, מִגְרָשׁ designa os terrenos abertos ao redor destinados, entre outros usos, ao pastoreio. “Pastagens” é conciso, acessível e coerente com o contexto; “com” expressa naturalmente a coordenação hebraica na frase nominal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva “filhos de Arão” e identifica-os em aposição como “os sacerdotes”. Não se acrescentou nota porque a coordenação com ו pode ser vertida naturalmente por “com” sem alterar o conteúdo da síntese.
