  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָֽתְנ֛וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה בַּ/אֲחֻזָּתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: pt
  text: Mas deram a Calebe, filho de Jefoné, o campo da cidade e os povoados dela[a], como sua propriedade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as aldeias dela” ou “os assentamentos dela”. O termo hebraico pode indicar povoados dependentes ou pequenos núcleos situados nos arredores de uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: o campo da cidade
  rationale: Mantém o singular coletivo do hebraico e designa a terra agrícola pertencente à cidade.
- source_word: חֲצֵרֶיהָ
  choice: os povoados dela
  rationale: Neste contexto territorial, o termo se refere mais naturalmente a núcleos dependentes da cidade do que a pátios. Não foi traduzido como “pastagens”, termo normalmente representado por outra palavra hebraica neste capítulo.
- source_word: נָתְנוּ
  choice: deram
  rationale: Preserva o sentido direto e a voz ativa do verbo נתן; o sujeito plural fica implícito, como no hebraico e no contexto anterior.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: a Calebe, filho de Jefoné
  rationale: Reproduz o destinatário e a filiação em formulação portuguesa natural.
- source_word: בַּאֲחֻזָּתוֹ
  choice: como sua propriedade
  rationale: Comunica o sentido jurídico-territorial de אֲחֻזָּה como posse ou propriedade permanente.
- source_word: וְאֶת
  choice: Mas
  rationale: 'A conjunção introduz um contraste com o versículo anterior: a cidade e suas áreas de pastagem foram destinadas aos sacerdotes, mas o campo e os povoados ficaram com Calebe.'
