  text: וְ/אֶת עַ֣יִן וְ/אֶת מִגְרָשֶׁ֗/הָ וְ/אֶת יֻטָּה֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת בֵּ֥ית שֶׁ֖מֶשׁ וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֣ים תֵּ֔שַׁע מֵ/אֵ֕ת שְׁנֵ֥י הַ/שְּׁבָטִ֖ים הָ/אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: pt
  text: Aim e suas pastagens[a], Jutá e suas pastagens, Bete-Semes e suas pastagens — nove cidades dessas duas tribos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras de uso comum” ou “terras ao redor”, isto é, as terras pertencentes a cada cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Aim
  rationale: Nome próprio transliterado segundo a forma tradicional em português bíblico, sem traduzir seu possível sentido lexical.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: Designa as terras abertas vinculadas à cidade, especialmente para pastoreio; esta formulação é concreta, natural e evita o sentido moderno inadequado de 'subúrbios'.
- source_word: יֻטָּה
  choice: Jutá
  rationale: Forma aportuguesada clara do topônimo hebraico.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bete-Semes
  rationale: Topônimo preservado por transliteração aportuguesada, em vez de traduzido literalmente como 'Casa do Sol'.
- source_word: עָרִים תֵּשַׁע
  choice: nove cidades
  rationale: Tradução convencional e adequada para centros populacionais no contexto da distribuição territorial.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: dessas duas tribos
  rationale: Expressa de modo conciso e natural a procedência das cidades das duas tribos citadas no contexto.
