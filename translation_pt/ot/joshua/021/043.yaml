source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: pt
  text: Assim, Yahweh deu a Israel toda a terra que havia jurado dar aos seus pais, e eles tomaram posse dela[a] e viveram nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a herdaram”; o verbo hebraico pode expressar tanto tomar posse quanto receber como herança, especialmente em contextos ligados à aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo tetragrama, em conformidade com a convenção do projeto, sem substituí-lo por um título.
- source_word: וַיִּתֵּן
  choice: deu
  rationale: 'Expressa de modo direto o sentido comum de נתן neste contexto: a concessão divina da terra.'
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Mantém a totalidade indicada por כָּל e entende אֶרֶץ como a terra prometida, não como o planeta inteiro.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: que havia jurado dar
  rationale: Comunica tanto o juramento quanto sua anterioridade em relação ao cumprimento narrado.
- source_word: לַאֲבוֹתָם
  choice: aos seus pais
  rationale: Conserva o termo masculino e familiar do hebraico, que neste contexto se refere aos patriarcas, sem generalizá-lo para 'antepassados'.
- source_word: וַיִּרָשׁוּהָ
  choice: eles tomaram posse dela
  rationale: Retrata de maneira natural a apropriação efetiva da terra, mantendo em nota a possível nuance de herança do verbo ירשׁ.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: viveram nela
  rationale: Traduz diretamente a ideia de habitar ou viver na terra, em português atual e natural.
- source_word: וַ
  choice: Assim
  rationale: Representa a função narrativa e resumitiva do waw inicial, apresentando o versículo como resultado e síntese do que precede.
theological_decisions:
- issue: Alcance da declaração sobre o cumprimento da promessa da terra
  choice: Manter a afirmação enfática de que Yahweh deu a Israel toda a terra prometida, que eles possuíram e na qual viveram.
  alternative: Atenuar 'toda' como se o cumprimento fosse apenas parcial, ou ampliar a declaração para resolver de forma definitiva todas as tensões com outros relatos da conquista.
  rationale: O hebraico formula uma forte síntese de cumprimento por meio de 'toda a terra' e dos verbos sucessivos de posse e habitação. A tradução preserva essa força sem impor uma harmonização teológica externa ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem das ações e a força resumitiva do original foram preservadas. O marcador [a] foi colocado junto à expressão a que a nota lexical efetivamente se refere.
