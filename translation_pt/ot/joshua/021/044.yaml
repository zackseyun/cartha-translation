  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: pt
  text: E Yahweh lhes deu descanso por todos os lados, conforme tudo o que havia jurado aos seus pais. Nenhum homem dentre todos os seus inimigos conseguiu resistir-lhes[a]; Yahweh entregou todos os seus inimigos nas mãos deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ficou de pé diante deles”. Em hebraico, a expressão significa resistir com êxito.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “na mão deles”, expressão comum que significa entregar alguém ao poder de outro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: deu descanso
  rationale: O hifil de נוח expressa fazer descansar ou dar descanso; a formulação mantém o tema do repouso concedido após a conquista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִסָּבִיב
  choice: por todos os lados
  rationale: Comunica de modo natural a segurança abrangente diante das ameaças ao redor.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: conforme tudo o que havia jurado
  rationale: Preserva tanto a ideia de conformidade exata quanto a totalidade do cumprimento do juramento.
- source_word: לַאֲבוֹתָם
  choice: aos seus pais
  rationale: Mantém o termo masculino do hebraico e, no contexto, designa os pais ancestrais de Israel.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: Nenhum homem ... conseguiu resistir-lhes
  rationale: Torna explícito o sentido idiomático de 'ficar de pé diante de alguém' como resistir com êxito, conservando o substantivo masculino אִישׁ.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: dentre todos os seus inimigos
  rationale: 'Expressa claramente o valor partitivo de מן: nenhum homem pertencente ao conjunto de todos os inimigos.'
- source_word: נָתַן ... בְּיָדָם
  choice: entregou ... nas mãos deles
  rationale: Emprega em português o idioma corrente de entregar alguém ao poder de outro; a nota registra a forma coletiva singular do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O texto traz o Tetragrama como nome próprio; 'Yahweh' preserva essa função sem substituí-lo por um título.
- issue: Linguagem masculina em לַאֲבוֹתָם e אִישׁ
  choice: seus pais; nenhum homem
  alternative: seus antepassados; ninguém
  rationale: A tradução conserva as formas masculinas explícitas do hebraico, sem impor neutralização de gênero.
- issue: Sentido de עמד בפניהם
  choice: conseguiu resistir-lhes
  alternative: ficou de pé diante deles
  rationale: A expressão é idiomática e indica resistência bem-sucedida; a tradução comunica esse sentido, enquanto a nota preserva a imagem literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para deixar claro que “dentre todos os seus inimigos” qualifica “nenhum homem”. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
