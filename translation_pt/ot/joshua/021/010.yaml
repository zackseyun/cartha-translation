base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: pt
  text: Foi para os filhos de Arão, dentre as famílias dos coatitas, dentre os filhos de Levi, pois a eles coube a primeira sorte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Foi
  rationale: Introduz a declaração narrativa e preserva o sentido existencial, sem um “e” inicial pouco natural em português.
- source_word: לִבְנֵי אַהֲרֹן
  choice: para os filhos de Arão
  rationale: O ל indica destinação ou atribuição; a formulação mantém a expressão genealógica do hebraico.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: dentre as famílias dos coatitas
  rationale: מִשְׁפָּחוֹת designa grupos familiares extensos, e הַקְּהָתִי identifica a divisão coatita dos levitas.
- source_word: מִבְּנֵי לֵוִי
  choice: dentre os filhos de Levi
  rationale: Preserva a formulação genealógica e situa os coatitas no grupo mais amplo dos descendentes de Levi.
- source_word: כִּי
  choice: pois
  rationale: Expressa a relação causal de modo natural e digno no português corrente.
- source_word: לָהֶם הָיָה
  choice: a eles coube
  rationale: Comunica naturalmente a atribuição resultante do sorteio, preservando o sentido possessivo/alocativo da construção.
- source_word: הַגּוֹרָל רִאשֹׁנָה
  choice: o primeiro sorteio
  rationale: No contexto da distribuição de cidades, גּוֹרָל pode indicar tanto a sorte lançada quanto a atribuição por sorteio; “primeiro sorteio” exprime com clareza a ordem do procedimento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém-se a linguagem genealógica “filhos de Arão” e “filhos de Levi”; “dentre” explicita a relação de pertencimento sem alterar a estrutura hierárquica do texto.
