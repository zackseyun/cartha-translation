  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: pt
  text: Cada uma destas cidades tinha suas pastagens ao redor dela[a]; assim era com todas estas cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «cidade por cidade, e suas pastagens ao redor dela».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: tinha
  rationale: O imperfeito qal feminino plural de היה tem aqui função descritiva e resumitiva. Em português, a construção distributiva no singular, «Cada uma... tinha», expressa naturalmente o estado passado.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: dessas cidades
  rationale: עיר pode designar cidade ou povoado; «cidades» é a tradução corrente e adequada ao contexto das distribuições territoriais.
- source_word: עִיר עִיר
  choice: Cada uma
  rationale: A repetição distributiva, literalmente «cidade por cidade», indica cada cidade individualmente; «Cada uma» preserva essa força em português natural.
- source_word: וּמִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa as áreas abertas vinculadas à cidade, usadas sobretudo para pastagem. «Pastagens» é claro e evita o sentido urbano moderno de «subúrbios».
- source_word: סְבִיבֹתֶיהָ
  choice: ao seu redor
  rationale: A expressão indica a localização das pastagens em torno de cada cidade e conserva de modo explícito a relação espacial do hebraico.
- source_word: כֵּן
  choice: assim era
  rationale: כֵּן introduz a conclusão que generaliza o mesmo padrão; «assim era» combina com o caráter retrospectivo da narrativa.
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: com todas essas cidades
  rationale: A frase estende o padrão ao conjunto inteiro. «Com todas essas cidades» é idiomático e mantém a relação expressa pela preposição לְ.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A formulação preserva tanto a distribuição individual («Cada uma») quanto a localização das áreas de pastagem ao redor das cidades.
