  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: pt
  text: 'E lhes falaram em Siló, na terra de Canaã: “Yahweh ordenou, por meio de Moisés,[a] que nos dessem cidades para morar, com suas pastagens[b] para o nosso gado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés”, expressão que aqui significa “por meio de Moisés”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “terrenos abertos” ou “terrenos comuns”. O termo hebraico se refere às áreas ao redor das cidades, usadas especialmente para o pastoreio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: E falaram com eles
  rationale: Mantém o verbo ‘falar’ e expressa naturalmente em português o destinatário indicado por אֶל.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: em Siló, na terra de Canaã
  rationale: Preserva tanto o nome do local da reunião quanto a expressão explícita ‘terra de Canaã’.
- source_word: לֵאמֹר
  choice: introdução por dois-pontos
  rationale: Em narrativa portuguesa, os dois-pontos introduzem com naturalidade o discurso direto sem exigir o hebraísmo ‘dizendo’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: צִוָּה בְיַד מֹשֶׁה
  choice: ordenou, por meio de Moisés
  rationale: Traduz צִוָּה diretamente e comunica o sentido de agência da expressão idiomática ‘pela mão de Moisés’.
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: que nos fossem dadas cidades onde morar
  rationale: A construção passiva é natural depois de ‘ordenou’ e conserva os levitas como beneficiários; ‘onde morar’ expressa com clareza a finalidade indicada por לָשָׁבֶת.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: com suas pastagens
  rationale: No contexto das cidades levíticas, designa os terrenos abertos ao redor delas, usados sobretudo para o gado.
- source_word: לִבְהֶמְתֵּנוּ
  choice: para o nosso gado
  rationale: ‘Gado’ é uma forma corrente e abrangente para os animais domésticos contemplados no contexto.
theological_decisions:
- issue: Forma portuguesa do Tetragrama יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz o nome divino, e ‘Yahweh’ o representa por transliteração sem substituí-lo por um título nem impor uma forma confessional tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem narrativa foi preservada, enquanto ‘dizendo’ foi representado por pontuação idiomática. Os marcadores [a] e [b] aparecem junto aos termos que explicam.
