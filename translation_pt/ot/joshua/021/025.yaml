base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: pt
  text: 'E da metade da tribo de Manassés: Taanaque com suas pastagens[a] e Gate-Rimom com suas pastagens — duas cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns manuscritos hebraicos e a passagem paralela em 1 Crônicas 6:70 apresentam nomes diferentes para as cidades concedidas pela tribo de Manassés.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה
  choice: E da metade da tribo
  rationale: A preposição מִן indica a origem da concessão, e מַחֲצִית מַטֵּה designa metade da unidade tribal. A formulação conserva a estrutura hebraica e soa natural em português.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida em português para o nome da tribo.
- source_word: תַּעְנַךְ
  choice: Taanaque
  rationale: Transliteração portuguesa corrente do topônimo hebraico.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ designa os terrenos abertos ao redor da cidade, usados especialmente como pastagem. O possessivo retoma cada cidade mencionada.
- source_word: גַּת רִמּוֹן
  choice: Gate-Rimom
  rationale: Transliteração adaptada à ortografia e à leitura em português, mantendo o caráter composto do topônimo.
- source_word: עָרִים שְׁתָּיִם
  choice: duas cidades
  rationale: Resumo numérico dos assentamentos enumerados; 'cidades' é a equivalência convencional de עָרִים neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem próxima à enumeração hebraica. Emprega formas tradicionais dos topônimos bíblicos e 'pastagens' para comunicar de modo acessível os terrenos abertos vinculados às cidades.
