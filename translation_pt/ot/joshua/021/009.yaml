base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: pt
  text: 'Da tribo dos filhos de Judá e da tribo dos filhos de Simeão, deram estas cidades[a], designadas nominalmente:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chamadas pelo nome” ou “cujos nomes são especificados”. A expressão hebraica indica que as cidades são nomeadas individualmente na lista seguinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: deram
  rationale: Traduz diretamente נתן e, no contexto da distribuição das cidades levíticas, comunica a ideia de concessão sem substituir o verbo por uma interpretação mais específica.
- source_word: מִמַּטֵּה
  choice: da tribo de
  rationale: Embora מַטֶּה também possa significar “cajado”, neste contexto de repartição territorial designa uma tribo.
- source_word: בְּנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Preserva a expressão genealógica hebraica e funciona naturalmente como designação tribal em português bíblico corrente.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: e da tribo dos filhos de Simeão
  rationale: Mantém o paralelismo com a referência anterior à tribo dos filhos de Judá.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: estas cidades
  rationale: Representa de modo direto o objeto do verbo e emprega o termo usual para עָרִים neste contexto.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: mencionadas a seguir pelo nome
  rationale: A expressão hebraica é idiomática e introduz a lista em que cada cidade será nomeada. A formulação portuguesa explicita essa função sem alterar o conteúdo.
