base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: pt
  text: 'E, da tribo de Naftali: Quedes, na Galileia, cidade de refúgio para quem matou alguém[a], com suas pastagens; Hamote-Dor, com suas pastagens[b]; e Cartã, com suas pastagens — três cidades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para quem tirou uma vida”. O termo hebraico designa quem matou alguém, especialmente no contexto jurídico do asilo, sem indicar necessariamente um assassinato premeditado.
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico traz Hamote-Dor; algumas tradições identificam esse lugar com Hamate.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: E, da tribo de Naftali
  rationale: No contexto da distribuição territorial, מַטֶּה significa “tribo”; a conjunção e a preposição são expressas naturalmente por “E, da”.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: cidade de refúgio para quem matasse alguém
  rationale: עִיר מִקְלַט é a expressão jurídica “cidade de refúgio”. הָרֹצֵחַ designa quem tira uma vida no contexto das leis de asilo, sem implicar necessariamente homicídio premeditado; a formulação evita a carga de “assassino”.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Quedes, na Galileia
  rationale: Adota-se a forma portuguesa tradicional e reconhecível do topônimo; בַּגָּלִיל situa a cidade na região da Galileia.
- source_word: מִגְרָשֶׁיהָ
  choice: suas pastagens
  rationale: מִגְרָשׁ indica os terrenos abertos vinculados à cidade, usados especialmente para o pastoreio; “pastagens” é claro e natural.
- source_word: חַמֹּת דֹּאר
  choice: Hamote-Dor
  rationale: A transliteração preserva o topônimo composto apresentado pelo texto consonantal massorético.
- source_word: קַרְתָּן
  choice: Cartã
  rationale: Forma transliterada e adaptada à ortografia portuguesa para este nome de lugar.
- source_word: עָרִים שָׁלֹשׁ
  choice: três cidades
  rationale: A síntese apositiva hebraica é vertida na ordem natural do português.
theological_decisions:
- issue: Valor jurídico e moral de הָרֹצֵחַ
  choice: quem matasse alguém
  alternative: assassino
  rationale: O contexto das cidades de refúgio abrange quem causou uma morte, especialmente sem premeditação. “Assassino” resolveria indevidamente a questão moral e jurídica, atribuindo culpa intencional que o termo, neste contexto, não exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura de lista do hebraico foi preservada, e os topônimos foram adaptados de modo consistente ao português.
