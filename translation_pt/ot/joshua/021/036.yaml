  text: וּ/מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֖צֶר וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: pt
  text: 'E da tribo de Rúben: Bezer com suas pastagens[b], e Jaza[a] com suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jaza também aparece como Jaaza ou Jaazá em algumas traduções.
    reason: lexical_alternative
  - marker: b
    text: Alguns manuscritos hebraicos e testemunhos antigos omitem Josué 21:36–37; as cidades aqui listadas têm paralelo em 1 Crônicas 6:78–79.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: E da tribo de
  rationale: A combinação מִן + מַטֶּה, no contexto da distribuição tribal, indica procedência da tribo; esta é a formulação natural em português.
- source_word: רְאוּבֵן
  choice: Rúben
  rationale: Forma tradicional e amplamente reconhecida do nome da tribo em português.
- source_word: אֶת בֶּצֶר
  choice: Bezer
  rationale: אֶת é marcador de objeto direto e não recebe tradução; o topônimo é transliterado na forma corrente em português.
- source_word: מִגְרָשֶׁהָ
  choice: com suas pastagens
  rationale: מִגְרָשׁ designa os terrenos abertos ao redor das cidades levíticas, usados especialmente para pastoreio. O sufixo feminino singular remete a cada cidade; a formulação plural é natural em português.
- source_word: יַהְצָה
  choice: Jaza
  rationale: Transliteração portuguesa clara do topônimo; variantes tradicionais são registradas em nota.
