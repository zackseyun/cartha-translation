  text: E Quibzaim com suas pastagens[a], e Bete-Horom com suas pastagens — quatro cidades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras comuns” ou “terras de pastoreio”. O termo hebraico se refere às terras abertas pertencentes a uma cidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: Quibzaim
  rationale: Nome próprio transliterado com grafia natural em português, sem traduzir seu possível sentido etimológico.
- source_word: מִגְרָשֶׁהָ
  choice: com suas pastagens
  rationale: O termo designa as terras abertas pertencentes à cidade, usadas inclusive para pastoreio; o sufixo feminino singular refere-se a cada cidade.
- source_word: בֵּית חוֹרֹן
  choice: Bete-Horom
  rationale: Transliteração portuguesa convencional do topônimo hebraico, em vez da tradução literal de seus componentes.
- source_word: עָרִים אַרְבַּע
  choice: quatro cidades
  rationale: Reproduz diretamente a fórmula numérica que encerra a lista.
- source_word: וְאֶת ... וְאֶת
  choice: e ... e
  rationale: As conjunções coordenam os itens da lista; os marcadores de objeto direto não recebem tradução independente em português.
