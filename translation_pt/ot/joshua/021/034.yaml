base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: pt
  text: 'E, da tribo de Zebulom, foram dadas às famílias dos descendentes de Merari, os levitas restantes: Jocneão com suas pastagens e Cartá[a] com suas pastagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também grafada “Cartha” em algumas traduções.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחוֹת
  choice: E, às famílias
  rationale: A conjunção e a preposição dão continuidade à lista de cidades concedidas. “Famílias” é natural em português e expressa adequadamente as subdivisões do grupo levítico.
- source_word: בְּנֵי מְרָרִי
  choice: dos descendentes de Merari
  rationale: Embora a forma literal seja “filhos de Merari”, neste contexto genealógico ela designa seus descendentes; a opção evita sugerir apenas filhos imediatos.
- source_word: הַ/לְוִיִּם הַ/נּוֹתָרִים
  choice: os levitas restantes
  rationale: Identifica o grupo de levitas ainda não contemplado na distribuição precedente, com formulação concisa e natural.
- source_word: מֵ/אֵת מַטֵּה זְבוּלֻן
  choice: da tribo de Zebulom
  rationale: No contexto da distribuição territorial, מַטֶּה significa “tribo”, e a expressão indica de qual tribo provinham as cidades.
- source_word: יָקְנְעָם
  choice: Jocneão
  rationale: Forma portuguesa tradicional e reconhecível do topônimo hebraico.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: O termo designa as áreas abertas ao redor da cidade, destinadas sobretudo ao pastoreio; “pastagens” comunica esse sentido com clareza.
- source_word: קַרְתָּה
  choice: Cartá
  rationale: Transliteração portuguesa que representa o topônimo hebraico e assinala naturalmente a sílaba tônica.
- source_word: '[verbo elíptico no hebraico]'
  choice: deram
  rationale: O hebraico continua de modo elíptico a relação de concessões dos versículos anteriores. A inserção de “deram” torna a frase completa em português sem alterar o agente ou o sentido contextual.
