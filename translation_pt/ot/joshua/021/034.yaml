review_pass:
  verdict: revise
  source_fidelity: 'O sentido básico está bem representado: as famílias meraritas, identificadas como os levitas restantes, recebem cidades da tribo de Zebulom, cada uma com suas áreas de pastagem. Contudo, o verbo inserido «deram» torna «as famílias ... os levitas restantes» o sujeito gramatical de uma ação que, no contexto, é praticada pelos distribuidores das cidades. A elipse hebraica pode ser suprida em português por uma construção passiva impessoal-contextual, sem alterar o sentido.'
  naturalness: A redação atual é compreensível, mas «as famílias ..., os levitas restantes, deram» soa sintaticamente ambígua e pouco natural. «Foram dadas ... às famílias» mantém a continuidade da lista e torna clara a relação de concessão.
  terminology: «Famílias dos descendentes de Merari», «levitas restantes», «tribo de Zebulom», «Jocneão» e «pastagens» são adequados. «Cartá» é uma transliteração portuguesa defensável. A nota atual, porém, apresenta «Carta» como variante; isso não corresponde bem à variante ortográfica relevante, que é «Cartha».
  issues:
  - severity: medium
    issue: O verbo explícito «deram» recebe como sujeito gramatical as famílias meraritas.
    rationale: No hebraico, o verbo é elíptico e é retomado do contexto distributivo anterior; as famílias são destinatárias, não doadoras. A construção passiva evita essa inversão sintática.
  - severity: low
    issue: A nota de variante do topônimo traz «Carta».
    rationale: A variante transliteracional usualmente atestada em tradições de tradução é «Cartha», não «Carta».
