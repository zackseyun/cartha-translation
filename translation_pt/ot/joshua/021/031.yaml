lexical_decisions:
- source_word: חֶלְקָת
  choice: Helcate
  rationale: Nome próprio de lugar, transliterado segundo uma forma portuguesa clara e coerente com a fonologia do hebraico.
- source_word: מִגְרָשֶׁהָ
  choice: suas pastagens
  rationale: Designa as terras anexas à cidade destinadas ao pastoreio e a outros usos comunitários; o sufixo feminino singular se refere, em cada ocorrência, à respectiva cidade.
- source_word: רְחֹב
  choice: Reobe
  rationale: Nome próprio de lugar, transliterado em forma corrente e pronunciável em português.
- source_word: עָרִים אַרְבַּע
  choice: quatro cidades
  rationale: Reproduz diretamente a expressão numeral que resume o total da lista iniciada no versículo anterior.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: '[não expresso diretamente]; coordenação com «e»'
  rationale: O marcador de objeto direto אֶת não possui equivalente lexical necessário em português; a repetição hebraica é representada pela coordenação natural dos nomes e de suas terras anexas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com estrutura de lista preservada. «Pastagens» evita o sentido urbano moderno de «subúrbios» e comunica a função das terras vinculadas às cidades levíticas.
