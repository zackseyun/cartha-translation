base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: pt
  text: Não falhou nenhuma palavra de tudo o que Yahweh havia dito de bom à casa de Israel[a]; tudo se cumpriu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nenhuma promessa falhou de tudo o que Yahweh havia prometido à casa de Israel”.'
    reason: Alternativa contextual para דָּבָר, que, neste contexto de cumprimento, pode ser entendido como “promessa”.
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: Não falhou nenhuma palavra
  rationale: A formulação comunica o idioma hebraico, literalmente associado a 'cair', como fracasso ou falta de cumprimento, preservando דָּבָר como 'palavra'.
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: de toda a boa palavra
  rationale: Mantém a expressão coletiva singular e a repetição lexical de דָּבָר, ainda que a construção seja deliberadamente mais solene do que a fala cotidiana.
- source_word: אֲשֶׁר דִּבֶּר
  choice: que ... havia dito
  rationale: O mais-que-perfeito composto situa naturalmente em português a fala divina antes do cumprimento narrado, sem transformar explicitamente 'palavra' em 'promessa'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: à casa de Israel
  rationale: Preserva a expressão corporativa e pactual 'casa de Israel'.
- source_word: הַכֹּל בָּא
  choice: tudo se cumpriu
  rationale: Expressa em português natural o sentido contextual do hebraico, literalmente 'tudo veio', isto é, tudo ocorreu conforme fora dito.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; 'Yahweh' o representa diretamente sem substituí-lo por um título.
- issue: Sentido de דָּבָר no contexto do cumprimento
  choice: palavra
  alternative: promessa
  rationale: '''Palavra'' conserva a repetição lexical e a ligação com o verbo ''dizer''; ''promessa'' explicita uma inferência contextual válida, registrada em nota para não eliminar a amplitude do termo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão 'boa palavra' retém de propósito a textura e a repetição do hebraico; 'tudo se cumpriu' evita o arcaísmo de 'tudo veio a acontecer'.
