  text: So be very careful for your own selves to love Yahweh your God[a].
translation:
  language: pt
  text: Portanto, tenham muito cuidado de vocês mesmos, para amarem Yahweh, seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por vocês mesmos”, “por suas vidas” ou, mais tradicionalmente, “por suas almas”. O substantivo hebraico pode referir-se à pessoa, à vida ou à alma, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: tenham cuidado
  rationale: 'A forma nifal de שׁמר tem aqui força exortativa e reflexiva: guardar-se, tomar cuidado. “Tenham cuidado” é natural em português e preserva o imperativo dirigido ao povo.'
- source_word: מְאֹד
  choice: muito
  rationale: O advérbio intensifica a exortação; “muito” conserva essa ênfase de modo direto e idiomático.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: consigo mesmos
  rationale: נֶפֶשׁ pode designar a pessoa, a vida ou a alma. Nesta construção com שׁמר, a expressão tem sentido reflexivo e se refere à pessoa inteira; “consigo mesmos” evita restringi-la à alma imaterial.
- source_word: לְאַהֲבָה
  choice: para amar
  rationale: 'O infinitivo com לְ expressa o propósito da vigilância exigida: eles devem cuidar de si para amar fielmente a Deus.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o seu Deus
  rationale: O sufixo de segunda pessoa plural expressa a relação pactual de modo natural em português; “seu” concorda com o tratamento plural “vocês” implícito na forma verbal.
theological_decisions:
- issue: Sentido de נֶפֶשׁ na exortação pactual
  choice: 'Referência reflexiva à pessoa inteira: “consigo mesmos”'
  alternative: “suas almas” ou “suas vidas”
  rationale: A construção hebraica exorta Israel a guardar a si mesmo para continuar amando Yahweh. O contexto não exige uma distinção entre corpo e alma; a tradução preserva a referência ao ser inteiro sem impor uma antropologia posterior.
translation_notes:
  register: Português moderno, claro e digno, com tratamento verbal plural sem pronome explícito. “Portanto” representa a ligação discursiva וְ de forma natural no contexto da exortação. O nome Yahweh é mantido por transliteração.
