source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: pt
  text: Muito tempo depois de Yahweh ter dado descanso a Israel de todos os inimigos ao seu redor, Josué já era velho e avançado em idade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “chegado em dias”, um idioma hebraico para alguém de idade avançada.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים רַבִּים
  choice: Muito tempo depois
  rationale: A construção narrativa introduz uma nova cena após um intervalo considerável. A formulação comunica naturalmente em português o valor temporal de מִיָּמִים רַבִּים, sem o arcaísmo de uma tradução como “e aconteceu, depois de muitos dias”.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: quando ... já havia
  rationale: A expressão temporal situa o estado posterior de Josué depois de Yahweh ter concedido descanso; o mais-que-perfeito deixa clara essa anterioridade em português.
- source_word: הֵנִיחַ
  choice: havia dado descanso
  rationale: O hifil de נוח indica que Yahweh fez Israel repousar, isto é, concedeu-lhe alívio e segurança diante dos inimigos. “Dar descanso” preserva a linguagem teológica e continua natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לְיִשְׂרָאֵל
  choice: a Israel
  rationale: Mantém o nome próprio coletivo do povo; em português, “dar descanso a Israel” expressa naturalmente o objeto indireto.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: de todos os inimigos ao redor
  rationale: Preserva tanto a abrangência de כָּל quanto a dimensão espacial de מִסָּבִיב, referindo-se aos inimigos circundantes.
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: Josué, já velho
  rationale: A ordem portuguesa integra a descrição de Josué à circunstância temporal; “já” explicita naturalmente o estado alcançado sem acrescentar uma conclusão teológica.
- source_word: בָּא בַּיָּמִים
  choice: estava avançado em idade
  rationale: Traduz o sentido do idioma hebraico, literalmente “entrado nos dias”, com uma expressão portuguesa clara e digna.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico apresenta o tetragrama como nome próprio. “Yahweh” procura representar esse nome diretamente, sem substituí-lo pelo título “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A abertura foi vertida de modo idiomático como “Muito tempo depois”; preservou-se “dar descanso” por sua importância no contexto narrativo e teológico de Josué.
