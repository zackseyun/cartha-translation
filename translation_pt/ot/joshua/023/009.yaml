id: JOS.23.9
reference: Joshua 23:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: pt
  text: Pois Yahweh expulsou de diante de vocês nações grandes e poderosas[a]; e, quanto a vocês, ninguém foi capaz de resistir-lhes até o dia de hoje[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desapossou” ou “afastou”. O verbo hebraico pode enfatizar a remoção dos povos da terra para que Israel tome posse dela.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nenhum homem ficou de pé diante de vocês”, expressão que significa que ninguém conseguiu resistir a vocês.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: expulsou
  rationale: O hifil de ירשׁ, neste contexto de conquista e posse da terra, indica remover ou desapossar povos. “Expulsou” comunica isso de modo natural, enquanto a nota preserva a alternativa “desapossou”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מִפְּנֵיכֶם
  choice: de diante de vocês
  rationale: Conserva a imagem espacial do hebraico e expressa a remoção dos povos do caminho ou da presença de Israel.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: nações grandes e poderosas
  rationale: “Grandes” representa גְּדֹלִים, e “poderosas” transmite a força militar indicada por עֲצוּמִים em português atual.
- source_word: וְאַתֶּם
  choice: e, quanto a vocês
  rationale: A construção reflete a posição enfática do pronome e mantém o contraste sem transformar a conjunção em um adversativo mais forte.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: ninguém foi capaz de resistir-lhes
  rationale: Traduz idiomaticamente a expressão de combate “nenhum homem ficou de pé diante de vocês”, cujo sentido é que nenhum adversário conseguiu enfrentá-los com êxito. A forma mais literal é registrada em nota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente português claro do idiomatismo temporal, indicando continuidade até o momento em que Josué fala.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título e sem preferir a forma híbrida tradicional “Jeová”.
- issue: Agente da expulsão das nações
  choice: Yahweh expulsou
  alternative: Israel expulsou com a ajuda de Yahweh
  rationale: A formulação mantém Yahweh como sujeito gramatical e agente explícito, preservando a ênfase teológica do hebraico na ação divina.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para ampla legibilidade brasileira. A construção “quanto a vocês” preserva a ênfase do pronome hebraico; “resistir-lhes” mantém concisão e tom elevado sem obscurecer o sentido militar.
