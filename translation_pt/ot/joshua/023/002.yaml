base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: pt
  text: 'Então Josué convocou[a] todo o Israel — seus anciãos, seus chefes[b], seus juízes e seus oficiais — e lhes disse: “Eu envelheci; estou avançado em anos[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “chamou”. Aqui, o verbo hebraico tem o sentido de chamar pessoas para que se reúnam.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “cabeças”, isto é, os principais líderes ou chefes.'
    reason: lexical_alternative
  - marker: c
    text: Expressão idiomática hebraica, literalmente “entrei em dias”, com o sentido de estar avançado em anos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: convocou
  rationale: Com a preposição לְ e pessoas como complemento, קרא expressa chamar pessoas para que se reúnam. “Convocou” comunica isso de modo claro e digno em português.
- source_word: לְכָל יִשְׂרָאֵל
  choice: todo o Israel
  rationale: Preserva a referência coletiva explícita à nação; a lista seguinte identifica os grupos dirigentes que a representam nessa ocasião.
- source_word: לִזְקֵנָיו
  choice: seus anciãos
  rationale: O sufixo de terceira pessoa retoma Israel como entidade coletiva. “Anciãos” é o termo corrente para esse corpo de líderes.
- source_word: וּלְרָאשָׁיו
  choice: seus chefes
  rationale: Neste contexto administrativo, רָאשִׁים designa os principais líderes. “Chefes” preserva a ideia metafórica de pessoas que estão à frente sem recorrer ao pouco natural “cabeças”.
- source_word: וּלְשֹׁפְטָיו
  choice: seus juízes
  rationale: O termo designa diretamente autoridades judiciais e se distingue dos demais cargos enumerados.
- source_word: וּלְשֹׁטְרָיו
  choice: seus oficiais
  rationale: שֹׁטְרִים refere-se a agentes ou funcionários administrativos subordinados. “Oficiais” é suficientemente amplo e adequado ao contexto governamental.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: e lhes disse
  rationale: Forma portuguesa natural e fiel para introduzir o discurso direto dirigido ao grupo.
- source_word: אֲנִי זָקַנְתִּי
  choice: Eu envelheci
  rationale: Mantém o valor verbal do perfeito hebraico e expressa o estado presente resultante do processo de envelhecer.
- source_word: בָּאתִי בַּיָּמִים
  choice: já estou avançado em anos
  rationale: Traduz naturalmente o idiomatismo hebraico “vim/cheguei nos dias”, que indica idade avançada, preservando a segunda afirmação paralela.
theological_decisions:
- issue: Referente de “todo o Israel” diante da lista de autoridades
  choice: Manter “todo o Israel” e conservar em seguida a enumeração de seus representantes.
  alternative: Resumir interpretativamente como “todos os líderes de Israel”.
  rationale: O hebraico afirma explicitamente “todo o Israel” e depois enumera anciãos, chefes, juízes e oficiais. A tradução preserva tanto a referência nacional coletiva quanto sua representação por esses dirigentes, sem decidir além do que o texto diz.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “seus” distingue com nitidez os quatro grupos administrativos. O travessão apresenta a lista como explicação de “todo o Israel”, sem eliminar a formulação coletiva do hebraico.
