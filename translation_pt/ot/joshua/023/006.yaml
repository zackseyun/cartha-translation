  text: וַ/חֲזַקְתֶּ֣ם מְאֹ֔ד לִ/שְׁמֹ֣ר וְ/לַ/עֲשׂ֔וֹת אֵ֚ת כָּל הַ/כָּת֔וּב בְּ/סֵ֖פֶר תּוֹרַ֣ת מֹשֶׁ֑ה לְ/בִלְתִּ֥י סוּר מִמֶּ֖/נּוּ יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: pt
  text: Portanto, sejam muito firmes em guardar e cumprir tudo o que está escrito no Livro da Lei de Moisés[a], sem se desviar dele nem para a direita nem para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Livro da Instrução de Moisés”. A palavra hebraica torá pode significar tanto “instrução” como “lei”; aqui, porém, refere-se especificamente ao corpo escrito de leis associado a Moisés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: sejam muito firmes
  rationale: O verbo חזק, dirigido a um público plural, expressa firmeza e determinação. A formulação preserva a força exortativa, enquanto מְאֹד é representado pelo intensificador natural “muito”.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: em guardar e cumprir
  rationale: שׁמר, em contexto legal e pactual, comunica observância cuidadosa; עשה indica pôr em prática. “Guardar e cumprir” mantém os dois verbos sem reduzir ambos simplesmente a “obedecer”.
- source_word: כָּל הַכָּתוּב
  choice: tudo o que está escrito
  rationale: Expressa de modo claro e abrangente todo o conteúdo escrito, mantendo proximidade formal com o hebraico.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: no Livro da Lei de Moisés
  rationale: סֵפֶר pode designar livro ou rolo; “Livro” é natural e tradicional. Neste contexto, תּוֹרָה se refere ao corpo normativo associado a Moisés, embora também possa significar “instrução”, alternativa registrada em nota.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: sem se desviar dele
  rationale: A construção expressa a finalidade ou o resultado negativo pretendido. O pronome masculino singular “dele” preserva a referência gramatical mais imediata ao livro, entendido juntamente com seu conteúdo.
- source_word: יָמִין וּשְׂמֹאול
  choice: nem para a direita nem para a esquerda
  rationale: Preserva a metáfora hebraica de não se afastar do caminho prescrito em direção alguma. A correlação “nem... nem...” é idiomática em português após uma expressão negativa.
theological_decisions:
- issue: Tradução de תּוֹרָה no contexto da aliança mosaica
  choice: Lei, em “Livro da Lei de Moisés”
  alternative: Instrução, em “Livro da Instrução de Moisés”
  rationale: Embora תּוֹרָה tenha o sentido mais amplo de ensino ou instrução, a expressão neste contexto aponta especificamente para o corpo escrito de normas associado a Moisés. “Lei” comunica melhor esse referente no uso bíblico corrente, sem excluir a amplitude lexical, preservada na nota.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais explícitas. “Sejam muito firmes” evita linguagem arcaica e comunica determinação; “guardar e cumprir” conserva a dupla expressão hebraica. A redação mantém a metáfora final e a ambiguidade lexical relevante de torá por meio da nota.
