base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: pt
  text: para que não se juntem a estas nações, estas que ainda restam entre vocês, nem mencionem[a] o nome de seus deuses, nem façam alguém jurar[b] por eles, nem os sirvam, nem se curvem diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “invoquem”. O verbo hebraico pode significar “mencionar” e, neste contexto, também pode se referir a invocar o nome dos deuses.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo hebraico está na forma causativa, literalmente “façam jurar”; a pessoa levada a jurar não é especificada. Conforme o contexto, também se pode entender: “nem jurem por eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: para que não se misturem com estas nações
  rationale: A construção לְבִלְתִּי com infinitivo expressa propósito ou prevenção. Embora בוא signifique literalmente entrar ou vir, com בַּגּוֹיִם e neste contexto a ideia é entrar em associação com os povos restantes; “misturar-se com” comunica isso naturalmente em português sem reduzir a frase a mera entrada geográfica.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: estas que ainda restam entre vocês
  rationale: O particípio de שׁאר designa os povos que permaneceram. “Entre vocês” exprime a coexistência desses povos com Israel de modo corrente e claro.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: nem mencionem o nome dos deuses delas
  rationale: O hifil de זכר pode significar mencionar, fazer lembrar ou invocar. “Mencionar” preserva o sentido mais direto, enquanto a nota registra a possibilidade cultual de “invocar”. O singular “nome” acompanha de perto o hebraico.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: nem façam alguém jurar por eles
  rationale: O hifil de שׁבע é causativo, “fazer jurar”. Como o objeto não está expresso no hebraico, “alguém” é acrescentado para produzir uma frase natural sem identificar indevidamente a pessoa.
- source_word: וְלֹא תַעַבְדוּם
  choice: nem os sirvam
  rationale: עבד significa servir e pode denotar serviço religioso. “Sirvam” mantém a distinção lexical em relação ao ato de se curvar mencionado a seguir.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: nem se curvem diante deles
  rationale: O verbo denota prostrar-se ou curvar-se. A formulação escolhida é clara e digna em português atual e conserva o caráter concreto da ação.
theological_decisions:
- issue: Linguagem de idolatria e ações cultuais
  choice: Preservar como proibições distintas mencionar ou invocar o nome, fazer jurar, servir e curvar-se.
  alternative: Resumir toda a sequência com o verbo genérico “adorar”.
  rationale: O hebraico enumera atos específicos de reconhecimento e lealdade aos deuses estrangeiros. Manter cada verbo evita apagar as distinções do texto ou impor uma síntese teológica.
- issue: Sentido social de בוא entre as nações
  choice: Traduzir como “misturem com”, indicando associação.
  alternative: Traduzir literalmente como “entrem no meio de”.
  rationale: No contexto da exortação, a preocupação não é simples deslocamento geográfico, mas envolvimento com os povos remanescentes. A escolha comunica essa força contextual sem acrescentar uma proibição denominacional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento em “vocês”. A repetição appositiva “estas... estas que” foi mantida de maneira levemente suavizada para refletir a ênfase hebraica. A coordenação repetida com “nem” reproduz a série enfática de proibições.
