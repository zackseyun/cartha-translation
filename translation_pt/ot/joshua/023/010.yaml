  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: pt
  text: Um só homem dentre vocês perseguirá mil[a], porque Yahweh[b], o Deus de vocês, é quem luta por vocês, assim como lhes disse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “irá no encalço de mil”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico traz “YHWH”, o nome divino, aqui transliterado como “Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “assim como lhes prometeu”; em hebraico, mais literalmente, “assim como falou a vocês”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: Um só homem dentre vocês
  rationale: Mantém o masculino singular representativo do hebraico e expressa naturalmente o sentido partitivo de מִכֶּם.
- source_word: יִרְדָּף
  choice: perseguirá
  rationale: רדף significa perseguir ou ir no encalço; “perseguirá” preserva o sentido militar e é natural em português.
- source_word: אָלֶף
  choice: mil
  rationale: Conserva literalmente o numeral e a força da afirmação.
- source_word: כִּי
  choice: porque
  rationale: Introduz com clareza a causa da vitória descrita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Forma corrente e amplamente compreensível para o construto com sufixo de segunda pessoa do plural.
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: é quem luta por vocês
  rationale: Reproduz a ênfase de הוּא e apresenta o particípio como ação característica de Deus em favor de Israel.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: assim como lhes disse
  rationale: Mantém o sentido literal de “falou/disse a vocês”, sem explicitar como promessa aquilo que o contexto permite inferir.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o nome próprio YHWH. “Yahweh” o preserva por transliteração, sem substituí-lo por um título; as demais formas refletem tradições de tradução ou vocalização diferentes.
- issue: Linguagem representativa em אִישׁ אֶחָד
  choice: Um só homem
  alternative: Uma só pessoa
  rationale: O substantivo hebraico é masculino singular e funciona representativamente; a tradução conserva essa forma sem ampliar nem restringir além do texto.
- issue: Força de דִּבֶּר no contexto
  choice: disse
  alternative: prometeu
  rationale: “Prometeu” explicita corretamente uma possível força contextual, mas “disse” preserva a formulação lexical do hebraico e deixa a implicação promissória ao contexto.
translation_notes:
  register: Português moderno, digno e de leitura natural, com “vocês” para a segunda pessoa do plural. A ordem foi levemente ajustada ao português, preservando a ênfase em Yahweh como aquele que luta em favor do povo.
