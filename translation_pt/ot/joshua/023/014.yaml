id: JOS.23.14
reference: Joshua 23:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: pt
  text: E eis que hoje sigo pelo caminho de toda a terra,[a] e vocês sabem, com todo o coração e com toda a alma, que nem uma só palavra falhou[b] entre todas as boas palavras que Yahweh, seu Deus, falou a respeito de vocês. Todas elas se cumpriram para vocês;[c] nem uma só palavra falhou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O caminho de toda a terra” é uma expressão hebraica para o destino comum de todos os seres humanos, especialmente a morte.
    reason: cultural_note
  - marker: b
    text: 'Ou: “nem uma só coisa deixou de se cumprir” ou “nem uma só promessa falhou”. O hebraico diz literalmente: “nem uma só palavra caiu”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “Todas elas vieram a vocês”.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Conserva a função solene de chamar a atenção no início da declaração. Embora elevado, “eis que” continua inteligível em português e combina com a gravidade da despedida.
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם
  choice: hoje sigo
  rationale: Expressa a partida iminente indicada pelo particípio sem antecipar de modo explícito a interpretação “vou morrer”, fornecida pela expressão seguinte.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: pelo caminho de toda a terra
  rationale: Mantém a metáfora hebraica tradicional para o destino comum da humanidade, especialmente a morte, em vez de substituí-la diretamente por uma explicação.
- source_word: וִידַעְתֶּם
  choice: vocês sabem
  rationale: O perfeito hebraico indica aqui um conhecimento firmemente estabelecido pela experiência; o presente é a forma mais natural em português.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: com todo o coração e com toda a alma
  rationale: Preserva o par antropológico e pactual “coração” e “alma”, sem reduzi-lo apenas a pensamento ou emoção.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: nem uma só palavra falhou
  rationale: “Palavra” mantém o vínculo lexical com aquilo que Yahweh falou; “falhou” comunica naturalmente o sentido do idioma hebraico cujo teor literal é “caiu”.
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: entre todas as boas palavras
  rationale: Mantém “palavras” por causa do verbo “falou” na oração seguinte. “Entre” expressa em português que nenhuma palavra do conjunto deixou de se cumprir.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: que Yahweh, seu Deus, falou a respeito de vocês
  rationale: “A respeito de vocês” representa o valor de עַל sem transformar explicitamente as palavras em “promessas”, embora esse caráter esteja implícito no contexto.
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: Todas elas se cumpriram para vocês
  rationale: O hebraico diz literalmente que todas “vieram” a eles. “Cumpriram-se” transmite em português atual a realização dessas palavras, enquanto a nota preserva a imagem de chegada.
- source_word: לֹא נָפַל מִמֶּנּוּ דָּבָר אֶחָד
  choice: nem uma só palavra falhou
  rationale: Repete a formulação anterior, como faz o hebraico, e comunica que nenhuma das palavras mencionadas deixou de realizar-se.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome pactual, enquanto “SENHOR” o substitui por um título tradicional.
- issue: Caráter das “boas palavras”
  choice: palavras
  alternative: promessas
  rationale: O contexto apresenta essas palavras como compromissos divinos cumpridos, mas דְּבָרִים significa mais diretamente “palavras/coisas”. A tradução conserva a ligação com “falou” e não explicita além do texto a categoria teológica de promessa.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com tratamento por “vocês”. A metáfora da morte e a repetição enfática do hebraico foram preservadas; os idiomas menos naturais foram traduzidos pelo sentido e documentados em notas.
