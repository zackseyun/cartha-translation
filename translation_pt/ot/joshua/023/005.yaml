  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: pt
  text: E o próprio Yahweh, o Deus de vocês, as expulsará de diante de vocês e as desapossará de diante de vocês, e vocês tomarão posse da terra delas[a], assim como Yahweh, o Deus de vocês, lhes falou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “herdarão a terra delas”. O verbo hebraico pode significar “herdar” ou “tomar posse”; aqui, “tomar posse” foi escolhido por causa do contexto da conquista.
    reason: lexical_alternative
  - marker: b
    text: O sentido da fala inclui uma promessa; a tradução mantém, porém, o verbo hebraico mais direto, “falou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם הוּא
  choice: o próprio Yahweh, o Deus de vocês
  rationale: Mantém o nome divino e expressa com naturalidade a ênfase do pronome hebraico independente הוּא.
- source_word: יֶהְדֳּפֵם
  choice: as expulsará
  rationale: O verbo הדף indica afastamento à força; “expulsará” comunica claramente essa ação no contexto da conquista.
- source_word: מִפְּנֵיכֶם
  choice: da presença de vocês
  rationale: Representa o sentido espacial do idioma hebraico sem recorrer à formulação pouco natural “de diante de vocês”.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: e as desapossará
  rationale: O hifil de ירש descreve fazer com que os ocupantes percam a posse; “desapossará” preserva a nuance territorial e o distingue de הדף.
- source_word: מִלִּפְנֵיכֶם
  choice: diante de vocês
  rationale: Conserva a repetição da imagem espacial hebraica, com uma variação idiomática natural em português.
- source_word: וִירִשְׁתֶּם אֶת אַרְצָם
  choice: vocês tomarão posse da terra delas
  rationale: No contexto da conquista, o qal de ירש indica adquirir ou ocupar a terra; “tomarão posse” é claro, embora “herdarão” também seja lexicalmente possível.
- source_word: כַּאֲשֶׁר דִּבֶּר ... לָכֶם
  choice: assim como ... lhes falou
  rationale: Preserva o sentido lexical de דבר, “falar”, sem explicitar como “prometer” a força promissória que o contexto já sugere.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o nome da aliança; a transliteração “Yahweh” o preserva sem substituí-lo por um título.
- issue: Nuances distintas da raiz ירש
  choice: “desapossará” para a ação divina contra as nações e “tomarão posse” para a aquisição israelita da terra
  alternative: Usar “expulsar” nas duas ações; ou “herdarão” na segunda
  rationale: 'As formas verbais pertencem a troncos diferentes e apresentam perspectivas complementares: perda da posse pelos ocupantes e obtenção da posse por Israel.'
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “O Deus de vocês” deixa explícito o referente do sufixo plural; os pronomes femininos retomam as nações mencionadas no contexto imediato. A divisão em duas frases torna a sequência das ações mais clara sem alterar sua relação lógica.
