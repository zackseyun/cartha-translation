source:
  edition: WLC
  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: pt
  text: Mas apeguem-se a Yahweh, seu Deus,[a] como têm feito até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantenham-se firmemente unidos a Yahweh, seu Deus”. O verbo hebraico expressa apego estreito e leal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mas
  rationale: As partículas introduzem aqui um contraste forte com a advertência anterior, não uma condição. “Mas” transmite essa força adversativa de modo natural.
- source_word: בַּיהוָה
  choice: a Yahweh
  rationale: Com דבק, a preposição בְּ marca o objeto ao qual alguém se apega; em português, a regência natural é “apegar-se a”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome pessoal da aliança expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: 'Embora אֱלֹהִים tenha forma plural, em referência a Yahweh possui sentido singular; o sufixo da segunda pessoa plural explicita a relação: “seu Deus”.'
- source_word: תִּדְבָּקוּ
  choice: apeguem-se
  rationale: דבק expressa adesão estreita, firme e relacional. O imperativo português comunica naturalmente a força exortativa da forma hebraica no contexto.
- source_word: כַּאֲשֶׁר
  choice: como
  rationale: Introduz a comparação entre a lealdade exigida e a conduta mantida até o presente.
- source_word: עֲשִׂיתֶם
  choice: têm feito
  rationale: O perfeito descreve a conduta passada que se estende até o momento da fala; o pretérito perfeito composto expressa bem essa continuidade.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Expressão portuguesa corrente que preserva o sentido temporal de continuidade até o dia presente.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”; “Jeová” reflete uma forma híbrida posterior.
- issue: Força de דבק no contexto da aliança
  choice: apeguem-se
  alternative: mantenham-se firmemente unidos; sejam fiéis
  rationale: “Apeguem-se” conserva a imagem concreta de adesão estreita e sua dimensão relacional, sem reduzir o verbo apenas à fidelidade abstrata nem explicitar além do hebraico a noção de aliança.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O plural é expresso por “apeguem-se” e “têm feito”; “seu Deus” segue o uso amplamente natural, embora “vosso Deus” pudesse tornar o plural explícito em registro mais tradicional.
