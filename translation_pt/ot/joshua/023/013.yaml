  source_fidelity: 'A tradução transmite com precisão a advertência enfática: Yahweh deixará de expulsar as nações, que se tornarão causa de armadilha, aflição corporal e, finalmente, da ruína de Israel fora da boa terra dada por Deus. “Já não expulsará”, “armadilha e um laço”, “açoite em seus flancos” e “espinhos em seus olhos” preservam adequadamente as imagens e o paralelismo hebraicos. “Desapareçam desta boa terra” comunica de forma compreensível o resultado de אבד מעל הארץ, embora seja um pouco menos explícito que “pereçam”; não constitui desvio inseguro de sentido.'
