  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: pt
  text: Saibam com toda a certeza que Yahweh, seu Deus, já não expulsará da presença de vocês estas nações. Elas se tornarão uma armadilha e um laço para vocês, um açoite em seus flancos[a] e espinhos em seus olhos, até que vocês desapareçam desta boa terra que Yahweh, seu Deus, lhes deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico é raro e de sentido incerto. Também pode ser entendido como “flagelo em seus lados” ou, de modo mais geral, como uma aflição dolorosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: Saibam com toda a certeza
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a expressão. A formulação comunica essa ênfase de modo natural e mantém o caráter solene da advertência.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: já não expulsará
  rationale: A construção com יסף indica que Yahweh deixará de prosseguir na ação; ירש no hifil, com as nações como objeto, significa expulsar ou desapossar.
- source_word: מִלִּפְנֵיכֶם
  choice: da presença de vocês
  rationale: Reproduz de maneira clara o idioma espacial hebraico, sem a rigidez pouco natural de uma tradução literal como “de diante da face de vocês”.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: uma armadilha e um laço
  rationale: Mantém os dois termos distintos e a duplicação retórica da imagem hebraica.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: um açoite em seus flancos
  rationale: O substantivo raro e difícil parece indicar um instrumento de flagelação ou, por extensão, uma aflição dolorosa. “Açoite” preserva a imagem corporal e sua força.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: espinhos em seus olhos
  rationale: Conserva a metáfora concreta de objetos pontiagudos que causam dor persistente.
- source_word: עַד אֲבָדְכֶם מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: até que vocês desapareçam desta boa terra
  rationale: Expressa o resultado final da advertência e a remoção da terra, sem transformar explicitamente a forma hebraica em uma passiva.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Natureza da advertência
  choice: A cessação da ação de Yahweh leva à permanência das nações, à aflição de Israel e, por fim, à sua perda da terra recebida.
  alternative: Tratar o versículo apenas como previsão militar, sem relação com a dádiva da terra.
  rationale: A própria sintaxe relaciona a retirada da ação divina, as consequências dolorosas e o desaparecimento da boa terra que Yahweh deu; a tradução conserva essa tensão sem acrescentar explicações doutrinárias.
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR ou Javé
  rationale: O original emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal no texto.
translation_notes:
  register: Português moderno, solene e acessível, com pronomes de terceira pessoa no plural para leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Flancos” foi mantido por preservar com clareza a metáfora corporal, e a incerteza do substantivo hebraico correspondente foi indicada em nota.
