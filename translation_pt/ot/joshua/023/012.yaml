  text: כִּ֣י אִם שׁ֣וֹב תָּשׁ֗וּבוּ וּ/דְבַקְתֶּם֙ בְּ/יֶ֨תֶר֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וְ/הִֽתְחַתַּנְתֶּ֥ם בָּ/הֶ֛ם וּ/בָאתֶ֥ם בָּ/הֶ֖ם וְ/הֵ֥ם בָּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: pt
  text: Pois, se de fato vocês voltarem atrás, apegarem-se[a] ao restante destas nações — às que ainda permanecem entre vocês —, unirem-se a elas por casamento e conviverem com elas, e elas com vocês[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “unirem-se estreitamente”.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica também pode ser traduzida por “entrarem no meio delas, e elas no meio de vocês” ou “manterem relações com elas, e elas com vocês”; ela indica associação recíproca e é mais ampla que simples movimento físico.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Pois, se
  rationale: Introduz a condição ameaçadora e, com “pois”, mantém a ligação argumentativa com o versículo anterior.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: se de fato vocês voltarem atrás
  rationale: A construção com infinitivo absoluto intensifica o verbo. “De fato” expressa a ênfase, e “voltar atrás” comunica a reversão negativa da fidelidade exigida no contexto.
- source_word: וּדְבַקְתֶּם
  choice: apegarem-se
  rationale: Preserva a ideia de ligação estreita e persistente de דבק, sem explicar antecipadamente a natureza dessa ligação.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: ao restante destas nações
  rationale: “Restante” traduz יֶתֶר como aquilo que sobrou, evitando atribuir automaticamente ao termo o possível valor teológico de “remanescente”.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: às que ainda permanecem entre vocês
  rationale: Mantém a especificação repetida das nações sobreviventes e verte אִתְּכֶם de modo natural para sua presença no meio de Israel.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: unirem-se a elas por casamento
  rationale: O hitpael de חתן indica o estabelecimento recíproco de vínculos matrimoniais; a formulação evita sugerir apenas casamentos individuais isolados.
- source_word: וּבָאתֶם בָּהֶם
  choice: conviverem com elas
  rationale: No paralelismo recíproco, a expressão indica entrar em relações ou associação com esses povos. “Conviver” conserva o sentido social amplo sem reduzi-lo a mero deslocamento físico nem transformá-lo em eufemismo sexual.
- source_word: וְהֵם בָּכֶם
  choice: e elas com vocês
  rationale: Mantém a concisão, a elipse verbal e a reciprocidade da cláusula hebraica.
theological_decisions:
- issue: Sentido pactual de שׁוֹב תָּשׁוּבוּ
  choice: voltarem atrás
  alternative: voltarem
  rationale: No contexto, trata-se de abandonar ou reverter a fidelidade à aliança. “Voltar atrás” expressa a direção negativa sem inserir uma formulação doutrinária adicional.
- issue: Possível sobrecarga teológica de יֶתֶר
  choice: restante
  alternative: remanescente
  rationale: Aqui o termo designa simplesmente os povos que sobraram. “Restante” evita importar a conotação positiva que “remanescente” pode ter em outros contextos bíblicos.
- issue: Amplitude da expressão וּבָאתֶם בָּהֶם
  choice: conviverem com elas
  alternative: entrarem entre elas
  rationale: A advertência trata da integração recíproca com as nações, após mencionar expressamente os casamentos. A tradução mantém essa amplitude e evita restringir a frase a movimento físico ou relação sexual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por “vocês” e construções naturais no Brasil. Os travessões tornam clara a repetição explicativa do hebraico. A vírgula final preserva o fato de que o versículo contém apenas a oração condicional, cuja consequência vem no versículo seguinte.
