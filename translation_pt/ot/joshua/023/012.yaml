  source_fidelity: A tradução representa com precisão a condição advertidora introduzida por כִּי אִם, a intensificação de שׁוֹב תָּשׁוּבוּ em “de fato”, o apego expresso por דבק, e a caracterização das nações que restaram. “Unirem-se a elas por casamento” comunica adequadamente o vínculo matrimonial recíproco de והתחתנתם. “Conviverem com elas, e elas com vocês” preserva de modo natural a construção elíptica e recíproca de ובאתם בהם והם בכם, sem impor uma leitura exclusivamente física ou sexual.
