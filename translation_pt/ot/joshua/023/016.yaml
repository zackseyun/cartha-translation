  naturalness: O português é moderno, claro e adequado ao registro solene do discurso. O tratamento por “vocês/lhes” é consistente e de ampla compreensão. A formulação “que ele lhes ordenou” reproduz de modo conciso a elipse do hebraico e é aceitável neste contexto.
