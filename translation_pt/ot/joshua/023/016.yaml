  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: pt
  text: Se vocês violarem a aliança de Yahweh, seu Deus,[a] que ele lhes ordenou, e forem servir a outros deuses e se prostrarem diante deles, a ira de Yahweh se acenderá contra vocês, e vocês desaparecerão rapidamente da boa terra que ele lhes deu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando vocês violarem a aliança de Yahweh, seu Deus”. A expressão hebraica inicial pode ser entendida em sentido temporal (“quando”) ou condicional (“se”).'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “de sobre a boa terra”, expressão que enfatiza a remoção deles da terra que Yahweh lhes deu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: Se vocês violarem
  rationale: A construção com ב mais infinitivo pode ser temporal ou condicional; neste contexto de advertência, a formulação condicional é natural. עבר ברית é a expressão idiomática para violar uma aliança.
- source_word: בְּרִית
  choice: a aliança
  rationale: “Aliança” conserva o peso jurídico, relacional e teológico do termo hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Embora a forma hebraica seja morfologicamente plural, a referência a Yahweh exige o sentido singular; “seu” concorda naturalmente com o tratamento coletivo “vocês” no português brasileiro.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: que ele lhes ordenou
  rationale: Reproduz diretamente a oração relativa sem acrescentar um complemento como “guardar”, ausente no texto.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: e forem servir
  rationale: Em português, “forem servir” expressa de modo natural o movimento rumo à apostasia e mantém o sentido religioso de עבד.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: a outros deuses
  rationale: Equivalência direta e idiomática da expressão hebraica para divindades rivais.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: e se prostrarem diante deles
  rationale: Preserva a ação física específica de curvar-se ou prostrar-se, distinguindo-a do verbo anterior, “servir”.
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: a ira de Yahweh se acenderá contra vocês
  rationale: Mantém a metáfora hebraica da ira que se acende, com formulação clara e digna em português.
- source_word: וַאֲבַדְתֶּם
  choice: e vocês desaparecerão
  rationale: O verbo pode indicar perecer, ser destruído ou desaparecer; com מֵעַל הָאָרֶץ, “desaparecerão da terra” preserva a ênfase na remoção sem excluir a gravidade do juízo.
- source_word: מְהֵרָה מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: rapidamente da boa terra
  rationale: Expressa tanto a rapidez quanto a retirada de sobre a terra, sem a rigidez de uma reprodução literal da preposição composta.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome pessoal; “Yahweh” o preserva por transliteração, sem substituí-lo por um título.
- issue: Valor da construção inicial בְּעָבְרְכֶם
  choice: 'Leitura condicional: “Se vocês violarem”'
  alternative: 'Leitura temporal: “Quando vocês violarem”'
  rationale: A sintaxe admite ambas as leituras. O contexto exortativo favorece uma advertência condicional, mas a alternativa temporal permanece genuína e é registrada em nota.
- issue: Natureza da consequência expressa por וַאֲבַדְתֶּם מֵעַל הָאָרֶץ
  choice: “vocês desaparecerão ... da boa terra”
  alternative: “vocês perecerão ... na boa terra”; “vocês serão eliminados da boa terra”
  rationale: A combinação verbal e preposicional salienta que Israel deixará de estar na terra dada por Yahweh. A tradução conserva essa remoção sem decidir além do texto se ela ocorre exclusivamente por morte, expulsão ou ambas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e tratamento coletivo por “vocês”. A tradução mantém a metáfora da ira que se acende, distingue servir de prostrar-se e registra em nota a ambiguidade condicional/temporal.
