  naturalness: O português é claro, moderno e apropriado ao registro. “Yahweh, o seu Deus” é compreensível, mas “Yahweh, seu Deus” é mais fluente no tratamento coletivo com “vocês”. A redação revista mantém legibilidade brasileira e alcance internacional.
  terminology: “Yahweh” representa adequadamente o Tetragrama. “Deus”, “nações” e “lutou por vocês” são termos naturais e fiéis. A nota deve preservar o literal “de diante de vocês” e explicar, sem impor essa explicação como expansão da oração principal, seu valor contextual.
