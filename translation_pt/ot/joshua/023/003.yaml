source:
  edition: WLC
  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: pt
  text: E vocês mesmos viram tudo o que Yahweh, seu Deus, fez a todas estas nações de diante de vocês, pois Yahweh, seu Deus, é quem lutou por vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: E vocês mesmos
  rationale: O pronome independente dá ênfase ao sujeito plural; “vocês mesmos” a preserva de modo natural, enquanto “E” mantém a continuidade do discurso.
- source_word: רְאִיתֶם
  choice: viram
  rationale: O perfeito hebraico apresenta uma experiência concluída e diretamente conhecida pelos ouvintes; o pretérito perfeito é a forma natural em português.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: tudo o que ... fez
  rationale: Preserva a abrangência do objeto e o sentido amplo de עשה sem especificar indevidamente a ação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o seu Deus
  rationale: Expressa o construto com sufixo de segunda pessoa do plural em português de ampla compreensão.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: a todas estas nações
  rationale: A preposição marca as nações afetadas pela ação; a formulação mantém o verbo “fez” amplo.
- source_word: מִפְּנֵיכֶם
  choice: expulsando-as da presença de vocês
  rationale: Torna explícito o valor idiomático da expressão, literalmente “de diante de vocês”, no contexto da retirada das nações, sem ocultar o literal, registrado em nota.
- source_word: כִּי
  choice: pois
  rationale: Introduz a explicação ou fundamento da declaração anterior.
- source_word: הוּא הַנִּלְחָם
  choice: é quem lutou
  rationale: A construção com pronome enfático e particípio substantivado identifica Yahweh como aquele que combateu; “é quem” conserva a ênfase, e “lutou” se ajusta ao retrospecto do discurso.
- source_word: לָכֶם
  choice: por vocês
  rationale: 'Expressa benefício e representação: Yahweh combateu em favor de Israel.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto, sem substituí-lo por um título.
- issue: Agência divina na conquista
  choice: “Yahweh, o seu Deus, é quem lutou por vocês”
  alternative: “Yahweh, o seu Deus, luta por vocês”
  rationale: A tradução mantém a ênfase explícita na ação de Deus e, pelo contexto retrospectivo, apresenta o combate como aquilo que os ouvintes já testemunharam, sem negar o possível caráter contínuo do particípio hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Emprega “vocês” para o plural e mantém “Yahweh” como nome divino. A explicitação “expulsando-as” comunica naturalmente o idioma hebraico, enquanto a nota registra sua formulação literal.
