  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: pt
  text: 'Vejam: destinei a vocês estas nações que ainda restam como herança para as suas tribos, desde o Jordão — juntamente com todas as nações que eliminei — até o Grande Mar, na direção do pôr do sol.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da entrada do sol”, expressão que indica o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Vejam
  rationale: O imperativo plural chama enfaticamente a atenção dos ouvintes. “Vejam” preserva essa força de modo natural e atual.
- source_word: הִפַּלְתִּי
  choice: reparti por sorteio
  rationale: O hifil de נפל alude aqui à distribuição de territórios mediante sortes. A formulação explicita o sentido idiomático sem recorrer ao literal pouco claro “fiz cair”.
- source_word: בְּנַחֲלָה
  choice: como herança
  rationale: נחלה designa a posse territorial recebida como herança e conserva a linguagem característica da distribuição da terra em Josué.
- source_word: לְשִׁבְטֵיכֶם
  choice: entre as suas tribos
  rationale: As tribos são as destinatárias da distribuição; “entre” combina naturalmente em português com “reparti”.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: estas nações que ainda restam
  rationale: Mantém o valor verbal do particípio e deixa claro que se trata das nações que continuam presentes.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: desde o Jordão ... até o Grande Mar
  rationale: Embora o hebraico use uma conjunção antes de “Grande Mar”, o conjunto indica a extensão territorial entre dois limites.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: juntamente com todas as nações que eliminei
  rationale: כרת significa aqui eliminar ou suprimir as nações. “Juntamente com” apresenta o segmento como parte da área distribuída sem confundi-lo com um novo limite geográfico.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: na direção do pôr do sol
  rationale: A expressão hebraica descreve o lado do ocaso, isto é, o oeste. A tradução conserva a imagem espacial e permanece imediatamente compreensível.
theological_decisions: []
