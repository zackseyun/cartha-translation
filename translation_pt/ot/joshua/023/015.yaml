  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: pt
  text: E acontecerá que, assim como toda boa palavra que Yahweh, seu Deus, lhes falou veio sobre vocês, também Yahweh fará vir sobre vocês toda palavra de desgraça[a], até destruí-los, removendo-os desta boa terra que Yahweh, seu Deus, lhes deu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda palavra de mal”, “toda coisa ruim” ou “toda calamidade”. Em hebraico, literalmente, “toda palavra/coisa má”, em paralelo com “toda boa palavra” no início do versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: E acontecerá que
  rationale: Introduz solenemente uma circunstância futura sem recorrer à fórmula arcaica “e sucederá”.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: assim como ... também
  rationale: Preserva com clareza a estrutura correlativa entre a bênção já cumprida e o juízo futuro.
- source_word: בָּא עֲלֵיכֶם כָּל הַדָּבָר הַטּוֹב
  choice: se cumpriu para vocês toda boa palavra
  rationale: O verbo בוא com עַל descreve aquilo que efetivamente sobreveio ao povo; em português, “se cumpriu para vocês” comunica naturalmente o cumprimento do que Deus havia falado, enquanto “boa palavra” conserva a repetição lexical de דָּבָר.
- source_word: דִּבֶּר ... אֲלֵיכֶם
  choice: lhes falou
  rationale: Tradução direta e idiomática da fala dirigida ao povo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: fará vir sobre vocês
  rationale: Retém tanto a força causativa do hifil de בוא quanto a imagem de algo que vem sobre o povo.
- source_word: כָּל הַדָּבָר הָרָע
  choice: toda palavra de desgraça
  rationale: Mantém “palavra” para reproduzir o paralelo deliberado com “toda boa palavra”; “de desgraça” expressa o resultado adverso do juízo sem atribuir maldade moral a Deus.
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: até destruí-los
  rationale: Expressa de modo conciso o limite ou resultado final indicado por עַד seguido do infinitivo com sufixo.
- source_word: מֵעַל הָאֲדָמָה
  choice: eliminá-los desta ... terra
  rationale: Torna natural em português a ideia espacial de removê-los da superfície da terra, explicitada no contexto pelo verbo de destruição.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome da aliança; a transliteração evita substituí-lo por um título.
- issue: Sentido de רָע na ação judicial de Deus
  choice: palavra de desgraça
  alternative: palavra má; palavra de mal; calamidade
  rationale: Neste contexto, רָע designa a consequência adversa anunciada, não maldade moral em Deus. A formulação conserva a tensão entre a boa palavra e a palavra de juízo, sem apagar o substantivo דָּבָר.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento plural por “vocês”. A redação preserva o paralelismo hebraico e evita tanto arcaísmos quanto uma interpretação denominacional do juízo.
