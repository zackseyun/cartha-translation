  naturalness: O português é claro e de registro apropriado. “Veio sobre vocês” é plenamente compreensível neste contexto solene e torna o paralelismo mais transparente. A reformulação final evita a redundância entre “destruir” e “eliminar”.
  terminology: “Yahweh” segue a decisão indicada. “Palavra de desgraça” comunica adequadamente o caráter calamitoso de רָע neste contexto e conserva a correspondência com “boa palavra”; a nota registra alternativas úteis.
