revisions:
- from: E acontecerá que, assim como se cumpriu para vocês toda boa palavra que Yahweh, seu Deus, lhes falou, também Yahweh fará vir sobre vocês toda palavra de desgraça[a], até destruí-los e eliminá-los desta boa terra que Yahweh, seu Deus, lhes deu.
  to: E acontecerá que, assim como toda boa palavra que Yahweh, seu Deus, lhes falou veio sobre vocês, também Yahweh fará vir sobre vocês toda palavra de desgraça[a], até destruí-los, removendo-os desta boa terra que Yahweh, seu Deus, lhes deu.
  rationale: A revisão restaura, nas duas metades da comparação, o paralelo do verbo hebraico בוא com a preposição “sobre”. No desfecho, “removendo-os desta boa terra” explicita em português a relação espacial de מֵעַל sem substituir a destruição por uma segunda ação independente. A nota é mantida, pois documenta alternativas legítimas para רָע e para o alcance de דָבָר.
