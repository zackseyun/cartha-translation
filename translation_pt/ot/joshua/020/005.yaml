revisions:
- from: E, se o vingador do sangue o perseguir, não entregarão aquele que matou nas mãos dele, pois feriu o seu próximo sem intenção e antes não o odiava, nem ontem nem anteontem.[a]
  to: E, se o vingador do sangue o perseguir, não entregarão o homem que matou às mãos dele, pois ele feriu o seu próximo sem intenção e não o odiava antes, desde ontem ou anteontem.[a]
  rationale: A revisão limita-se a aperfeiçoar a correspondência idiomática de «às mãos dele», a tornar o referente humano mais fluente sem atribuir culpa de assassinato e a representar plenamente a expressão temporal hebraica. A nota continua necessária para explicar que a expressão concreta indica ausência de hostilidade anterior.
