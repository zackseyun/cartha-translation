  text: וְ/כִ֨י יִרְדֹּ֜ף גֹּאֵ֤ל הַ/דָּם֙ אַֽחֲרָ֔י/ו וְ/לֹֽא יַסְגִּ֥רוּ אֶת הָ/רֹצֵ֖חַ בְּ/יָד֑/וֹ כִּ֤י בִ/בְלִי דַ֨עַת֙ הִכָּ֣ה אֶת רֵעֵ֔/הוּ וְ/לֹֽא שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: pt
  text: E, se o vingador do sangue o perseguir, não entregarão o homem que matou às mãos dele, pois ele feriu o seu próximo sem intenção e não o odiava antes, desde ontem ou anteontem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “desde ontem ou anteontem”, expressão hebraica que significa “anteriormente” ou “no passado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: E, se
  rationale: Mantém a ligação com o procedimento descrito anteriormente e introduz uma situação possível no contexto jurídico.
- source_word: גֹּאֵל הַדָּם
  choice: o vingador do sangue
  rationale: Expressão jurídica compreensível que designa o representante da família encarregado de vingar o derramamento de sangue.
- source_word: וְלֹא יַסְגִּרוּ
  choice: não entregarão
  rationale: Expressa a proibição de pôr o refugiado sob o poder do vingador; o sujeito implícito remete às autoridades da cidade mencionadas no contexto.
- source_word: הָרֹצֵחַ
  choice: aquele que matou
  rationale: Evita chamar de assassino quem o próprio versículo apresenta como alguém que matou sem intenção, preservando a distinção jurídica do contexto.
- source_word: בְּיָדוֹ
  choice: nas mãos dele
  rationale: Conserva a imagem hebraica de entregar alguém ao poder de outra pessoa, em formulação natural em português.
- source_word: בִּבְלִי דַעַת
  choice: sem intenção
  rationale: No contexto jurídico, a expressão indica ausência de propósito deliberado, e não simples falta de informação.
- source_word: הִכָּה
  choice: feriu
  rationale: Preserva o sentido próprio de golpear ou ferir sem inserir no verbo, isoladamente, o resultado mortal fornecido pelo contexto.
- source_word: רֵעֵהוּ
  choice: o seu próximo
  rationale: Reproduz o sentido interpessoal de רֵעַ em linguagem bíblica corrente e ainda acessível.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: nem ontem nem anteontem
  rationale: Mantém a expressão temporal concreta do hebraico, cujo sentido idiomático é que não havia inimizade anterior.
theological_decisions:
- issue: Condição jurídica de הָרֹצֵחַ no contexto das cidades de refúgio
  choice: aquele que matou
  alternative: o assassino; o homicida
  rationale: O versículo distingue a morte não intencional de um ato motivado por ódio. A formulação escolhida não atribui antecipadamente culpa de assassinato.
- issue: Sentido jurídico de בִּבְלִי דַעַת
  choice: sem intenção
  alternative: sem conhecimento; sem saber
  rationale: A questão central é a ausência de intenção deliberada. A tradução preserva essa força jurídica sem apagar a formulação do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção evita o termo potencialmente condenatório “assassino”, conserva a imagem jurídica das “mãos” e mantém no texto a expressão temporal hebraica, explicada em nota.
