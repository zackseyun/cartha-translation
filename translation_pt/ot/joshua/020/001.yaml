base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: pt
  text: 'Então Yahweh falou a Josué[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Yahweh falou a Josué, dizendo:”. A forma narrativa hebraica pode ser traduzida por “e” ou “então”; literalmente, o versículo termina com “dizendo”.'
    reason: Registra tanto a alternativa para a conjunção narrativa quanto a forma literal da fórmula introdutória לֵאמֹר.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Então ... falou
  rationale: O wayyiqtol dá continuidade e avanço à narrativa. “Então” expressa naturalmente a sequência em português, enquanto “falou” preserva o sentido de dirigir a palavra, próprio de דבר neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém no texto o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: Na construção “falar a alguém”, a preposição “a” corresponde de modo natural ao hebraico אֶל.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz a fala divina que vem a seguir. Em português atual, os dois-pontos desempenham essa função de modo natural e evitam o pouco idiomático “dizendo” no fim do versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo silenciosamente por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Os dois-pontos introduzem com fluidez a fala que começa no versículo seguinte.
