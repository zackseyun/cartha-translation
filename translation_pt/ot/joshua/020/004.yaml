  to: Ele deverá fugir para uma destas cidades, ficar à entrada do portão da cidade e expor sua situação[a] aos anciãos daquela cidade. Então eles o levarão para dentro da cidade, para junto deles[b], lhe darão um lugar e ele morará com eles.
