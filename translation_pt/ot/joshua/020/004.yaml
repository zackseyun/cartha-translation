  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: pt
  text: Ele deverá fugir para uma destas cidades, ficar à entrada do portão da cidade e expor sua situação[a] aos anciãos daquela cidade. Então eles o levarão para dentro da cidade, para junto deles[b], lhe darão um lugar e ele morará com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas palavras” ou “seu caso”; o hebraico pode se referir tanto às palavras que ele diz como à questão que apresenta.
    reason: lexical_alternative
  - marker: b
    text: Ou “o receberão na cidade, junto deles”; o verbo hebraico pode significar “reunir”, “trazer para dentro” ou “receber”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: deverá fugir
  rationale: A forma verbal com וְ, na sequência de instruções legais, tem sentido prospectivo e prescritivo; “deverá fugir” expressa isso com naturalidade.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: uma destas cidades
  rationale: Reproduz com clareza a construção partitiva hebraica.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: ficar à entrada do portão da cidade
  rationale: Preserva tanto פֶּתַח, “entrada”, como שַׁעַר, “portão”, e situa a apresentação no espaço público e judicial da cidade.
- source_word: וְדִבֶּר בְּאָזְנֵי
  choice: expor ... aos
  rationale: O idioma hebraico significa falar de modo que os destinatários ouçam; “expor ... aos” é português natural no contexto de uma apresentação formal.
- source_word: זִקְנֵי הָעִיר הַהִיא
  choice: os anciãos daquela cidade
  rationale: Mantém a especificidade de הַהִיא e o título cívico dos líderes locais.
- source_word: אֶת דְּבָרָיו
  choice: sua situação
  rationale: דָּבָר pode indicar palavras, assunto ou causa. “Sua situação” comunica o relato apresentado às autoridades sem restringir indevidamente a amplitude do hebraico; a ambiguidade é registrada em nota.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: eles o receberão entre eles na cidade
  rationale: אָסַף pode significar reunir, trazer para dentro ou receber. A formulação expressa a admissão oficial na cidade e preserva o elemento relacional de אֲלֵיהֶם.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: lhe darão um lugar
  rationale: Mantém a amplitude de מָקוֹם, sem definir se se trata especificamente de alojamento, residência ou outra provisão.
- source_word: וְיָשַׁב עִמָּם
  choice: ele morará com eles
  rationale: Neste contexto de residência, יָשַׁב significa morar ou habitar, não simplesmente sentar-se.
