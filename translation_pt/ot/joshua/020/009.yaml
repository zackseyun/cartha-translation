  naturalness: O português é moderno, claro e de registro apropriado. «Até que comparecesse diante da assembleia» torna mais clara e fluente a relação temporal e judicial. «Pela mão do vingador do sangue» é a formulação idiomática e mais próxima do original.
  terminology: «Cidades designadas», «filhos de Israel», «estrangeiro residente», «vingador do sangue» e «assembleia» são escolhas adequadas. A nota sobre «estrangeiro residente» explica a categoria sem projetar categorias jurídicas modernas.
