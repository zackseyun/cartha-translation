source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: pt
  text: Estas foram as cidades designadas para todos os filhos de Israel[a] e para o estrangeiro residente que vivia no meio deles[b], para que todo aquele que tirasse a vida de alguém sem intenção pudesse fugir para lá e não morresse pela mão do vingador do sangue, até que comparecesse diante da assembleia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “para todos os israelitas”. O hebraico diz literalmente “para todos os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: “Estrangeiro residente” refere-se a um não israelita que vivia entre o povo de Israel sob sua ordem comunitária.
    reason: cultural_note
  - marker: c
    text: Ou “comunidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: as cidades designadas
  rationale: A expressão indica cidades oficialmente escolhidas ou determinadas. “Designadas” preserva esse sentido sem acrescentar “de refúgio”, que está implícito no contexto, mas não aparece nesta expressão.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: para todos os filhos de Israel
  rationale: Mantém a forma tradicional e transparente do hebraico, embora “para todos os israelitas” seja mais idiomático em português.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: e para o estrangeiro residente que vivia no meio deles
  rationale: גֵּר designa um não israelita estabelecido entre o povo e sujeito à sua ordem comunitária. “Estrangeiro residente” comunica essa condição jurídica e social com clareza atual.
- source_word: לָנוּס שָׁמָּה
  choice: pudesse fugir para lá
  rationale: Traduz diretamente o movimento expresso por נוּס e se integra naturalmente à oração de finalidade.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: todo aquele que tirasse a vida de alguém
  rationale: A expressão hebraica refere-se a atingir uma pessoa de modo a causar sua morte. A formulação portuguesa explicita o resultado exigido pelo contexto jurídico sem usar uma construção artificial.
- source_word: בִּשְׁגָגָה
  choice: sem intenção
  rationale: Expressa inadvertência ou ausência de propósito deliberado, distinção central na legislação das cidades de refúgio.
- source_word: וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם
  choice: e não morresse pelas mãos do vingador do sangue
  rationale: “Vingador do sangue” preserva o título jurídico do parente encarregado de vingar a morte; “pelas mãos” mantém de forma natural a ideia hebraica de agência.
- source_word: עַד עָמְדוֹ
  choice: até comparecer
  rationale: No contexto judicial, “comparecer” comunica naturalmente a ideia de apresentar-se ou ficar de pé diante do órgão que julgaria o caso.
- source_word: לִפְנֵי הָעֵדָה
  choice: diante da assembleia
  rationale: עֵדָה designa aqui a coletividade reunida com função judicial. “Assembleia” evita possíveis associações eclesiásticas modernas de “congregação” e preserva o caráter coletivo.
theological_decisions:
- issue: Expressão pactual de gênero בְּנֵי יִשְׂרָאֵל
  choice: para todos os filhos de Israel
  alternative: para todos os israelitas
  rationale: A tradução principal preserva a expressão masculina plural representativa do hebraico; a nota oferece a forma coletiva idiomática sem alterar o alcance nacional.
- issue: Condição jurídica do גֵּר
  choice: o estrangeiro residente que vivia no meio deles
  alternative: o imigrante que morava entre eles
  rationale: A escolha preserva a inclusão jurídica do não israelita estabelecido entre Israel sem projetar sobre o texto categorias migratórias modernas.
- issue: Identidade de הָעֵדָה no procedimento judicial
  choice: a assembleia
  alternative: a comunidade
  rationale: O termo pode enfocar tanto a comunidade quanto sua reunião representativa. “Assembleia” se ajusta à audiência judicial sem definir além do texto a composição exata do órgão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantêm-se as expressões formais “filhos de Israel” e “vingador do sangue”, enquanto construções jurídicas menos naturais são vertidas de modo idiomático. Os marcadores aparecem junto aos termos que explicam.
