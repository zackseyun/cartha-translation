  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: pt
  text: Ele ficará naquela cidade até comparecer diante da comunidade para julgamento[a] e até a morte do sumo sacerdote que estiver exercendo o cargo naqueles dias. Então aquele que matou[b] poderá voltar para a sua cidade e para a sua casa, para a cidade da qual fugiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «assembleia». O hebraico se refere à comunidade reunida para exercer julgamento.
    reason: lexical_alternative
  - marker: b
    text: A expressão «aquele que matou» não antecipa o resultado do julgamento nem o classifica como assassino; neste contexto, trata-se da pessoa responsável pela morte que buscou refúgio.
    reason: legal_ambiguity
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: Ele ficará naquela cidade
  rationale: ישׁב pode indicar morar, permanecer ou ficar. No contexto jurídico da cidade de refúgio, «ficará» expressa com naturalidade a permanência obrigatória sem sugerir residência definitiva.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: até comparecer diante da comunidade
  rationale: A expressão עמד לפני descreve o comparecimento perante uma autoridade. «Comparecer diante» preserva o caráter formal e judicial, enquanto «comunidade» comunica o corpo reunido de Israel.
- source_word: לַמִּשְׁפָּט
  choice: para julgamento
  rationale: משׁפט designa aqui a decisão ou o processo judicial. «Julgamento» mantém a abrangência do hebraico sem especificar indevidamente um procedimento moderno.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל
  choice: até a morte do sumo sacerdote
  rationale: Tradução direta da construção hebraica, empregando o título português consagrado «sumo sacerdote».
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: que estiver exercendo o cargo naqueles dias
  rationale: A oração identifica o sumo sacerdote em exercício naquele período. A formulação explicita idiomaticamente essa função temporal sem acrescentar uma sucessão não declarada.
- source_word: אָז יָשׁוּב
  choice: Então ... poderá voltar
  rationale: No contexto legal, a morte do sumo sacerdote autoriza o retorno. «Poderá» expressa permissão, sem transformar o retorno em ordem ou previsão inevitável.
- source_word: הָרֹצֵחַ
  choice: aquele que matou
  rationale: Embora רצח possa designar quem mata ou assassina, o contexto ainda não permite classificá-lo simplesmente como «assassino». A expressão descritiva conserva sua condição de responsável por uma morte sem antecipar o veredito.
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: para a sua cidade e para a sua casa
  rationale: 'Mantém os dois aspectos do retorno presentes no hebraico: à comunidade de origem e à própria casa ou família.'
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: para a cidade da qual fugiu
  rationale: Reproduz de modo natural a retomada hebraica do destino, identificado como o lugar de onde a pessoa havia fugido.
theological_decisions:
- issue: Condição jurídica de הָרֹצֵחַ nas leis das cidades de refúgio
  choice: aquele que matou
  alternative: homicida; assassino
  rationale: «Assassino» pressuporia culpa por homicídio intencional, justamente uma questão submetida a julgamento. «Aquele que matou» preserva a neutralidade jurídica do contexto. «Homicida» seria possível, mas no uso comum pode ser entendido como culpado de crime.
- issue: Força do retorno após a morte do sumo sacerdote
  choice: poderá voltar
  alternative: voltará; deve voltar
  rationale: A disposição legal concede o direito de retorno; não exige que a pessoa efetivamente volte nem prediz com certeza que o fará.
- issue: Relação entre comparecimento para julgamento e morte do sumo sacerdote
  choice: dois limites coordenados por «e até»
  alternative: uma única permanência contínua que termina somente após ambos os eventos, sem destaque sintático
  rationale: O hebraico repete עַד, apresentando o comparecimento para julgamento e a morte do sumo sacerdote como marcos ligados à permanência. A tradução conserva essa repetição e não resolve além do texto a relação jurídica precisa entre eles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Sumo sacerdote» mantém a terminologia bíblica corrente; «comparecer diante» conserva o registro judicial. A construção evita o termo potencialmente condenatório «assassino» e preserva a repetição jurídica dos dois marcos temporais.
