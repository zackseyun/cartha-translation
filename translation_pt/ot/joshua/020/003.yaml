    rationale: A expressão בִּבְלִי דָעַת significa literalmente “sem conhecimento/saber”, sem declarar o objeto desse desconhecimento. A formulação atual torna explícito que a pessoa não sabia o que fazia, o que é uma interpretação possível, mas não exigida pelo texto.
