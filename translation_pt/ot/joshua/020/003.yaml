    issue: “Contra o vingador do sangue”
    rationale: Embora comunique proteção, o hebraico מִגֹּאֵל הַדָּם é mais diretamente “do vingador do sangue”. A preposição “do” mantém a relação de refúgio e se aproxima mais da construção-fonte.
