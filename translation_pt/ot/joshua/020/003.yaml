  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: pt
  text: para que fuja para lá quem matar uma pessoa por engano, sem saber,[a] e essas cidades serão para vocês um refúgio do vingador do sangue.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem intenção, sem conhecimento”. As duas expressões hebraicas ressaltam que a morte não foi deliberada.
    reason: lexical_alternative
  - marker: b
    text: O “vingador do sangue” era, no sistema jurídico baseado no parentesco em Israel, o familiar encarregado de buscar justiça pela morte de um membro da família.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: fuja para lá
  rationale: O infinitivo com ל expressa a finalidade da designação das cidades; a forma finita com subjuntivo comunica essa finalidade de modo natural em português.
- source_word: רוֹצֵחַ
  choice: quem matar
  rationale: Neste contexto jurídico, o termo é qualificado como morte não intencional. A formulação evita “assassino”, que em português normalmente implica intenção criminosa.
- source_word: מַכֵּה נֶפֶשׁ
  choice: matar uma pessoa
  rationale: A expressão idiomática, literalmente ligada a golpear uma pessoa, designa aqui causar sua morte. Esta tradução explicita o sentido jurídico sem recorrer à ideia inadequada de “alma”.
- source_word: בִּשְׁגָגָה
  choice: sem intenção
  rationale: Expressa ação inadvertida ou não deliberada em contexto legal; é clara e idiomática em português.
- source_word: בִּבְלִי דָעַת
  choice: sem ter conhecimento do que fazia
  rationale: Preserva a noção distinta de falta de conhecimento ou percepção e evita que a expressão soe apenas como repetição de “sem intenção”.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: e essas cidades servirão de refúgio para vocês
  rationale: O verbo plural retoma as cidades mencionadas no contexto. A explicitação do referente torna a frase clara em português sem alterar o sentido.
- source_word: מִגֹּאֵל הַדָּם
  choice: contra o vingador do sangue
  rationale: Expressão consagrada que conserva o papel jurídico-cultural do parente responsável por vingar uma morte; “contra” comunica a proteção oferecida pelo refúgio.
theological_decisions:
- issue: Caracterização jurídica de quem causou a morte
  choice: A pessoa causou uma morte sem intenção e sem plena percepção do que fazia.
  alternative: Traduzir רוֹצֵחַ genericamente como “homicida” ou, inadequadamente neste contexto, como “assassino”.
  rationale: As qualificações בִּשְׁגָגָה e בִּבְלִי דָעַת excluem aqui a ideia de homicídio deliberado, mas a tradução mantém as duas expressões hebraicas em vez de reduzir ambas a uma única noção.
- issue: Função do vingador do sangue
  choice: Manter no texto a designação tradicional “vingador do sangue” e explicar em nota seu contexto de parentesco e justiça legal.
  alternative: Inserir “parente vingador” diretamente no texto.
  rationale: O elemento de parentesco pertence ao contexto institucional de גֹּאֵל, mas não está expresso separadamente na frase imediata; a nota preserva a informação sem sobrecarregar o texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Vocês” favorece a clareza brasileira; “essas cidades” explicita o antecedente plural. As notas preservam a duplicidade semântica das qualificações da morte e esclarecem a instituição antiga sem introduzir linguagem denominacional.
