  text: וַ/יַּקְדִּ֜שׁוּ אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ בְּ/הַ֣ר נַפְתָּלִ֔י וְ/אֶת שְׁכֶ֖ם בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן בְּ/הַ֥ר יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: pt
  text: Assim, separaram Quedes, na Galileia, na região montanhosa de Naftali; Siquém, na região montanhosa de Efraim; e Quiriate-Arba (isto é, Hebrom)[a], na região montanhosa de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “ela é Hebrom”; isto é, Quiriate-Arba é outro nome de Hebrom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: separaram
  rationale: Neste contexto jurídico e territorial, o verbo קדשׁ indica que as cidades foram formalmente separadas para uma finalidade especial, como cidades de refúgio. “Separaram” comunica isso sem sugerir necessariamente um rito cultual.
- source_word: קֶדֶשׁ
  choice: Quedes
  rationale: Forma portuguesa tradicional e reconhecível do nome geográfico.
- source_word: בַּגָּלִיל
  choice: na Galileia
  rationale: Forma corrente em português para o nome da região.
- source_word: בְּהַר נַפְתָּלִי
  choice: na região montanhosa de Naftali
  rationale: הַר, em descrições territoriais, designa aqui uma região elevada ou montanhosa, não necessariamente um monte isolado.
- source_word: שְׁכֶם
  choice: Siquém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: בְּהַר אֶפְרָיִם
  choice: na região montanhosa de Efraim
  rationale: A expressão se refere às terras altas associadas a Efraim, e não a um único monte.
- source_word: קִרְיַת אַרְבַּע
  choice: Quiriate-Arba
  rationale: Mantém o nome próprio por transliteração em forma natural para leitores de português, em vez de traduzi-lo como “Cidade de Arba”.
- source_word: הִיא חֶבְרוֹן
  choice: (isto é, Hebrom)
  rationale: A formulação parentética expressa com clareza que Quiriate-Arba é outro nome de Hebrom.
- source_word: בְּהַר יְהוּדָה
  choice: na região montanhosa de Judá
  rationale: A frase indica a região elevada de Judá, não uma montanha específica.
