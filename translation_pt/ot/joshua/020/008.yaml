  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: pt
  text: Do outro lado do Jordão, a leste de Jericó, designaram Bezer, no deserto, no planalto, da tribo de Rúben; Ramote, em Gileade[a], da tribo de Gade; e Golã, em Basã, da tribo de Manassés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Ramote-Gileade”. O hebraico diz literalmente “Ramote em Gileade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: Do outro lado do Jordão, a leste de Jericó
  rationale: A expressão situa as cidades na margem oriental do Jordão, tomando Jericó como referência. A formulação é natural em português e preserva a orientação geográfica do hebraico.
- source_word: נָתְנוּ
  choice: designaram
  rationale: No contexto da escolha das cidades de refúgio, o verbo indica uma destinação oficial, não apenas o ato genérico de dar.
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Forma consagrada em português para o topônimo hebraico.
- source_word: בַּמִּדְבָּר
  choice: no deserto
  rationale: מִדְבָּר designa uma região erma ou pouco cultivada; 'deserto' é claro e tradicional em português sem exigir que se trate de dunas arenosas.
- source_word: בַּמִּישֹׁר
  choice: no planalto
  rationale: O termo se refere à região elevada e relativamente plana a leste do Jordão; 'planalto' comunica melhor essa topografia do que 'planície'.
- source_word: מִמַּטֵּה רְאוּבֵן / מִמַּטֵּה גָד / מִמַּטֵּה מְנַשֶּׁה
  choice: da tribo de Rúben / da tribo de Gade / da tribo de Manassés
  rationale: A fórmula identifica o território tribal ao qual pertencia cada cidade; 'da tribo de' é conciso e idiomático.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: Ramote, em Gileade
  rationale: O hebraico apresenta o nome da cidade seguido da indicação regional. A vírgula torna essa relação clara em português, enquanto a forma composta tradicional é registrada em nota.
- source_word: גלון בַּבָּשָׁן
  choice: Golã, em Basã
  rationale: Empregam-se as formas portuguesas usuais dos topônimos, preservando a relação entre a cidade e a região.
