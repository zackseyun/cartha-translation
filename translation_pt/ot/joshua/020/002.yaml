base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: pt
  text: 'Fale aos filhos de Israel: “Designem para vocês as cidades de refúgio das quais lhes falei por meio de Moisés[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pela mão de Moisés”, expressão idiomática que significa “por meio de Moisés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Fale
  rationale: O imperativo piel dirigido a Josué é preservado como ordem direta, em português natural.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar masculina do hebraico e sua forma tradicional, sem reduzi-la ao rótulo étnico “israelitas”.
- source_word: לֵאמֹר
  choice: introdução por dois-pontos
  rationale: O infinitivo quotativo hebraico é representado naturalmente em português pela pontuação que introduz o discurso direto, evitando o pouco idiomático “dizendo” após “Fale”.
- source_word: תְּנוּ לָכֶם
  choice: Designem para vocês
  rationale: Embora נתן signifique literalmente “dar”, neste contexto administrativo indica separar ou destinar cidades para uma função específica.
- source_word: עָרֵי הַמִּקְלָט
  choice: as cidades de refúgio
  rationale: É a designação jurídica consagrada e exata para os lugares destinados à proteção.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: das quais lhes falei
  rationale: Expressa de modo natural a referência às cidades sobre as quais Deus já havia falado ao povo.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: Traduz o valor instrumental da expressão idiomática hebraica, preservando Moisés como mediador da ordem divina.
theological_decisions:
- issue: Designação pactual בְּנֵי יִשְׂרָאֵל com gênero gramatical masculino
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A formulação familiar do texto-fonte é mantida, pois identifica convencionalmente o povo da aliança e não há necessidade contextual de neutralizá-la.
- issue: Mediação expressa por בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  alternative: pela mão de Moisés
  rationale: A tradução comunica com clareza que a instrução anterior de Deus foi transmitida por intermédio de Moisés; a forma literal é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O discurso direto é introduzido por dois-pontos, forma mais natural do que reproduzir literalmente לֵאמֹר como “dizendo”.
