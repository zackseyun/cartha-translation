  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: pt
  text: De Tapua, a fronteira segue para o oeste até o ribeiro de Caná[a], e termina no mar. Essa é a herança da tribo dos filhos de Efraim, segundo as suas famílias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vale de Caná” ou “wadi de Caná”; o termo hebraico pode indicar um curso de água ou seu leito, inclusive sazonal.
    reason: lexical_alternative
  - marker: b
    text: Ou “segundo os seus clãs”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: De Tapua
  rationale: A preposição מִן indica o ponto inicial do traçado. O topônimo é transliterado de forma natural em português.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: a fronteira segue
  rationale: Em descrições territoriais, הלך com גְּבוּל indica o percurso da linha divisória; esta formulação é clara e natural.
- source_word: יָמָּה
  choice: para o oeste
  rationale: A forma direcional ligada a יָם pode significar literalmente 'em direção ao mar', mas aqui tem o sentido geográfico usual de 'para o oeste'.
- source_word: נַחַל קָנָה
  choice: o ribeiro de Caná
  rationale: נַחַל pode designar um ribeiro, vale fluvial ou leito sazonal. 'Ribeiro' mantém a imagem geográfica e é amplamente compreensível.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: e termina no mar
  rationale: A fórmula de limites indica o ponto terminal da fronteira. O presente harmoniza com o verbo anterior e produz português natural, sem perder o sentido.
- source_word: זֹאת נַחֲלַת מַטֵּה
  choice: Essa é a herança da tribo
  rationale: A expressão resume formalmente o território atribuído à unidade tribal.
- source_word: בְנֵי אֶפְרַיִם
  choice: dos filhos de Efraim
  rationale: Preserva a expressão hebraica masculina e genealógica, usada como designação tribal convencional.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo as suas famílias
  rationale: Traduz diretamente a organização interna da tribo; 'clãs' também é possível neste contexto.
theological_decisions:
- issue: Designação tribal de בְנֵי אֶפְרַיִם
  choice: filhos de Efraim
  alternative: descendentes de Efraim
  rationale: A tradução conserva a forma genealógica masculina explícita do hebraico, sem neutralizá-la, embora ela funcione coletivamente como designação da tribo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Os topônimos seguem formas portuguesas usuais; evita-se excesso de tecnicismo geográfico.
