  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: pt
  text: Mas eles não expulsaram os cananeus que habitavam em Gezer, e os cananeus vivem no meio de Efraim até o dia de hoje e ficaram sujeitos a trabalho forçado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: expulsaram
  rationale: No hifil, o verbo expressa desalojar ou expulsar os habitantes de um território; esta opção é clara e natural no contexto da conquista.
- source_word: הַיּוֹשֵׁב
  choice: que habitavam
  rationale: O particípio coletivo singular refere-se aos cananeus como grupo residente em Gezer; o plural concorda naturalmente em português.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: no meio de Efraim
  rationale: Preserva a expressão espacial do hebraico e a referência tribal coletiva.
- source_word: לְמַס עֹבֵד
  choice: submetidos a trabalhos forçados
  rationale: מַס designa trabalho compulsório ou corveia; עֹבֵד indica que esse serviço era efetivamente prestado. A formulação evita a possível leitura moderna de simples tributação monetária.
theological_decisions:
- issue: Relação entre a não expulsão e a permanência dos cananeus
  choice: Por isso
  alternative: e
  rationale: O consecutivo narrativo permite explicitar a consequência contextual sem acrescentar uma explicação teológica.
- issue: Aspecto temporal de וַיְהִי
  choice: foram submetidos
  alternative: tornaram-se
  rationale: O hebraico descreve a passagem à condição de mão de obra compulsória. A voz passiva torna natural em português a coerção implícita em מַס, sem definir quando ou por quem a medida foi inicialmente imposta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a concisão narrativa e distingue a permanência contínua dos cananeus ('vivem ... até o dia de hoje') de sua posterior condição de trabalho compulsório.
