  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: pt
  text: Então, a fronteira descia para o oeste, até o limite dos jafletitas, seguindo até o limite de Bete-Horom de Baixo e até Gezer; suas extremidades chegavam ao mar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “suas saídas eram para o mar”. Em fórmulas de delimitação, “saídas” se refere às extremidades ou aos pontos terminais da fronteira.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Depois, a fronteira descia
  rationale: O verbo ירד preserva a ideia de descida no percurso topográfico. A explicitação de “a fronteira” fornece em português o referente implícito no contexto, e o imperfeito descritivo é natural em uma descrição territorial.
- source_word: יָמָּה
  choice: para o oeste
  rationale: A forma direcional derivada de “mar” frequentemente indica o oeste nas descrições geográficas israelitas, em direção ao Mediterrâneo.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: até o limite dos jafletitas
  rationale: גְּבוּל designa o limite territorial; הַיַּפְלֵטִי é um gentílico, vertido no plural natural em português.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: seguindo até o limite de Bete-Horom de Baixo
  rationale: עַד indica a extensão do traçado. “De Baixo” distingue esta localidade de Bete-Horom de Cima e mantém a forma tradicional e inteligível do topônimo.
- source_word: וְעַד גָּזֶר
  choice: e até Gezer
  rationale: A repetição de עַד continua a enumeração dos pontos alcançados pela fronteira.
- source_word: וְהָיוּ תצאתו יָמָּה
  choice: e terminava no mar
  rationale: A expressão תֹצְאוֹת em fórmulas de fronteira indica os pontos finais ou a terminação do traçado. A formulação verbal é clara em português, enquanto a nota registra a imagem hebraica mais literal; aqui יָמָּה é entendido concretamente como o mar.
