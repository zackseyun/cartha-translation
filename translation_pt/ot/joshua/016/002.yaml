  text: Depois, a divisa saiu de Betel em direção a Luz e passou à fronteira dos arquitas, em Atarote.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: Depois, a divisa saía
  rationale: O sujeito implícito é a divisa mencionada no contexto anterior. O imperfeito descritivo em português expressa naturalmente o percurso geográfico, e “Depois” marca a progressão do itinerário.
- source_word: מִבֵּית אֵל
  choice: de Betel
  rationale: Emprega a forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: לוּזָה
  choice: em direção a Luz
  rationale: A terminação direcional hebraica indica movimento rumo a Luz; esta formulação preserva essa nuance sem afirmar necessariamente que a linha entrava na localidade.
- source_word: וְעָבַר
  choice: e seguia
  rationale: No itinerário de uma divisa, o verbo descreve sua continuação, não necessariamente uma travessia.
- source_word: אֶל גְּבוּל
  choice: até a fronteira dos
  rationale: גְּבוּל designa fronteira ou limite territorial; “até” comunica o avanço da linha para esse ponto.
- source_word: הָאַרְכִּי
  choice: arquitas
  rationale: Gentílico referente ao grupo associado a Arqui; o plural coletivo é natural em português.
- source_word: עֲטָרוֹת
  choice: Atarote
  rationale: Transliteração portuguesa natural do topônimo hebraico.
