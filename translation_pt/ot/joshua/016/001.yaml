  text: וַ/יֵּצֵ֨א הַ/גּוֹרָ֜ל לִ/בְנֵ֤י יוֹסֵף֙ מִ/יַּרְדֵּ֣ן יְרִיח֔וֹ לְ/מֵ֥י יְרִיח֖וֹ מִזְרָ֑חָ/ה הַ/מִּדְבָּ֗ר עֹלֶ֧ה מִ/ירִיח֛וֹ בָּ/הָ֖ר בֵּֽית אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: pt
  text: E a sorte saiu para os filhos de José, desde o Jordão, junto a Jericó, até as águas de Jericó, a leste, atravessando o deserto e subindo de Jericó para a região montanhosa de Betel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção hebraica da parte final é compacta e pode também ser entendida como: “a leste, o deserto que sobe de Jericó à região montanhosa de Betel”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: E a sorte saiu
  rationale: Preserva o sentido concreto de יצא, “sair”, no contexto do resultado de um sorteio territorial. Embora “a sorte caiu” seja idiomático em português bíblico, “saiu” acompanha mais diretamente o hebraico e permanece natural.
- source_word: לִבְנֵי יוֹסֵף
  choice: para os filhos de José
  rationale: Mantém a expressão hebraica de parentesco, que aqui designa coletivamente os descendentes tribais de José.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: desde o Jordão, junto a Jericó
  rationale: Expressa o ponto inicial da linha territorial no Jordão, nas proximidades de Jericó, sem tornar a relação geográfica mais precisa do que o texto.
- source_word: לְמֵי יְרִיחוֹ
  choice: até as águas de Jericó
  rationale: Reproduz o plural coletivo מי sem identificar interpretativamente essas águas com uma única fonte.
- source_word: מִזְרָחָה
  choice: a leste
  rationale: Indica a orientação oriental de maneira breve e natural.
- source_word: הַמִּדְבָּר
  choice: o deserto
  rationale: מדבר designa uma região erma ou árida. “Deserto” é amplamente compreensível em português, sem exigir que se trate de um deserto arenoso.
- source_word: עֹלֶה מִירִיחוֹ
  choice: subindo de Jericó
  rationale: Conserva o particípio e o movimento topográfico ascendente desde Jericó.
- source_word: בָּהָר בֵּית אֵל
  choice: para a região montanhosa de Betel
  rationale: הר neste contexto geográfico aponta para as terras altas, não necessariamente para uma montanha isolada.
