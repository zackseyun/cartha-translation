base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: pt
  text: 'O território dos filhos de Efraim, segundo os seus clãs, era o seguinte: a fronteira da sua herança, no lado leste,[a] ia de Atarote-Adar até Bete-Horom de Cima.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fronteira de sua herança em direção ao leste era Atarote-Adar”. A construção hebraica admite pequenas diferenças na relação entre “leste” e o nome do lugar, sem alterar o sentido geográfico básico.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: גְּבוּל
  choice: território / fronteira
  rationale: O substantivo ocorre duas vezes. Na primeira, designa de modo amplo a extensão territorial da tribo; na segunda, introduz a linha geográfica delimitada pelos nomes de lugares, por isso a variação contextual é adequada.
- source_word: בְּנֵי אֶפְרַיִם
  choice: os filhos de Efraim
  rationale: Preserva a expressão filial e genealógica do hebraico, que neste contexto designa os membros da tribo de Efraim.
- source_word: לְמִשְׁפְּחֹתָם
  choice: segundo os seus clãs
  rationale: Em relatos de distribuição tribal, מִשְׁפָּחָה indica as subdivisões de uma tribo; “clãs” expressa essa estrutura social com clareza.
- source_word: נַחֲלָתָם
  choice: sua herança
  rationale: Mantém a ideia da terra recebida por sorteio como patrimônio hereditário, importante no contexto de Josué.
- source_word: מִזְרָחָה
  choice: no lado leste
  rationale: Expressa naturalmente em português a localização oriental dessa parte da fronteira, sem excluir a possível leitura direcional do hebraico.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarote-Adar
  rationale: Transliteração portuguesa do topônimo composto, em vez de tradução de seus componentes.
- source_word: עַד
  choice: até
  rationale: Marca de maneira concisa o limite ou alcance da linha de fronteira.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: Bete-Horom de Cima
  rationale: Forma portuguesa clara que distingue esse lugar de Bete-Horom de Baixo e preserva o valor de עֶלְיוֹן.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para uma descrição territorial. A expressão “era o seguinte” organiza a frase longa; “ia de... até...” torna explícito em português o percurso da fronteira implícito na fórmula geográfica hebraica.
