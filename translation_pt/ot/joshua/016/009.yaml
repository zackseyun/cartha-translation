  text: וְ/הֶ/עָרִ֗ים הַ/מִּבְדָּלוֹת֙ לִ/בְנֵ֣י אֶפְרַ֔יִם בְּ/ת֖וֹךְ נַחֲלַ֣ת בְּנֵֽי מְנַשֶּׁ֑ה כָּֽל הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: pt
  text: Havia cidades separadas para os filhos de Efraim dentro da herança dos filhos de Manassés — todas as cidades e seus povoados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cidades reservadas para os filhos de Efraim”. O particípio hebraico indica cidades separadas ou designadas para Efraim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: cidades
  rationale: עִיר pode designar cidade ou povoação; “cidades” mantém a terminologia usual das listas territoriais de Josué.
- source_word: הַמִּבְדָּלוֹת
  choice: separadas
  rationale: O particípio de בדל indica cidades distinguidas ou apartadas do território de Manassés para pertencerem a Efraim, sem explicitar além do hebraico o mecanismo dessa separação.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: para os filhos de Efraim
  rationale: Preserva a expressão tribal literal בְּנֵי e a formulação recorrente do contexto, embora se refira coletivamente à tribo.
- source_word: בְּתוֹךְ
  choice: dentro de
  rationale: Expressa de modo natural a localização dessas cidades no interior da herança territorial de Manassés.
- source_word: נַחֲלַת
  choice: herança
  rationale: Mantém a nuance de território recebido por distribuição, característica de נַחֲלָה em Josué.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: filhos de Manassés
  rationale: Reproduz a fórmula tribal do original e corresponde à expressão usada para Efraim.
- source_word: כָּל הֶעָרִים
  choice: todas essas cidades
  rationale: O demonstrativo implícito em português torna natural a retomada resumitiva das cidades já mencionadas, preservando a totalidade marcada por כָּל.
- source_word: וְחַצְרֵיהֶן
  choice: com os povoados ao seu redor
  rationale: חָצֵר designa aqui povoados ou assentamentos dependentes associados às cidades; “ao seu redor” esclarece essa relação territorial sem sugerir cidades muradas independentes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A abertura “Havia também” transforma o fragmento nominal hebraico em uma oração completa adequada ao contexto, sem alterar sua função na lista territorial. Mantêm-se “filhos de Efraim” e “filhos de Manassés” como fórmulas tribais literais.
