base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: pt
  text: Depois, a fronteira seguiu para o oeste[a] até Micmetate, ao norte; virou então para o leste, em direção a Taanate-Siló, passou a leste dela e seguiu em direção a Janoa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em direção ao mar”, expressão hebraica que aqui indica o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Depois, ... seguia
  rationale: Em descrições de limites, o verbo indica o prolongamento da linha da fronteira. “Seguia” preserva esse movimento de modo natural em português, e “Depois” expressa a progressão do waw narrativo.
- source_word: הַגְּבוּל
  choice: a fronteira
  rationale: O termo designa aqui a linha limítrofe da porção tribal. “Fronteira” é claro e corrente em português.
- source_word: הַיָּמָּה
  choice: para o oeste
  rationale: A expressão significa literalmente “em direção ao mar”, um modo hebraico habitual de indicar o oeste. O sentido geográfico aparece no texto, e a forma literal é registrada em nota.
- source_word: הַמִּכְמְתָת
  choice: Micmetate
  rationale: Transliteração portuguesa do topônimo hebraico.
- source_word: מִצָּפוֹן
  choice: ao norte
  rationale: A expressão situa Micmetate no lado norte da descrição da fronteira, embora a sintaxe hebraica seja condensada.
- source_word: וְנָסַב
  choice: virava
  rationale: Em descrições de fronteiras, o verbo indica mudança de direção; “virava” é conciso e natural.
- source_word: מִזְרָחָה
  choice: para o leste
  rationale: O sufixo direcional indica movimento em direção ao leste.
- source_word: תַּאֲנַת שִׁלֹה
  choice: Taanate-Siló
  rationale: Forma transliterada e adaptada à leitura portuguesa do topônimo composto.
- source_word: וְעָבַר אוֹתוֹ
  choice: passava ... dela
  rationale: O verbo descreve a continuação da linha junto ao lugar mencionado; o pronome retoma Taanate-Siló, tratada naturalmente como referência feminina por elipse de “localidade”.
- source_word: מִמִּזְרַח
  choice: a leste
  rationale: Indica a posição da fronteira em relação a Taanate-Siló.
- source_word: יָנוֹחָה
  choice: seguia até Janoa
  rationale: O topônimo com terminação direcional indica movimento rumo a Janoa; “seguia até” comunica isso naturalmente sem afirmar que a fronteira terminava ali.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas toponímicas legíveis para o público lusófono. A repetição de “a fronteira” foi reduzida onde o referente permanece inequívoco. A construção compacta referente a Micmetate foi mantida sem ampliar além do necessário.
