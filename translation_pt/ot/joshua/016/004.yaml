translation:
  language: pt
  text: E os filhos de José, Manassés e Efraim, receberam a sua herança[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “herdaram” ou “tomaram posse da sua herança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: receberam a sua herança
  rationale: O verbo נחל no qal, neste contexto de distribuição da terra, indica entrar na posse da porção recebida por herança. A formulação explicita em português o objeto implícito no hebraico e evita sugerir, mais do que o texto, uma conquista ativa.
- source_word: בְנֵי יוֹסֵף
  choice: os filhos de José
  rationale: Preserva a expressão genealógica hebraica, que aqui designa Manassés e Efraim e, no contexto territorial, também representa suas tribos.
- source_word: מְנַשֶּׁה
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְאֶפְרָיִם
  choice: e Efraim
  rationale: Mantém a conjunção e emprega a forma tradicional do nome em português.
- source_word: וַ
  choice: E
  rationale: Reproduz de modo direto a ligação narrativa do waw hebraico com o contexto anterior.
theological_decisions: []
