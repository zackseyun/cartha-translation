  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: pt
  text: Então a fronteira desceu de Janoa até Atarote e Naará[a], chegou a Jericó[b] e terminou no Jordão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: Naará; alguns relacionam este nome de lugar a Naarate.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: tocava Jericó; o verbo hebraico pode indicar que uma linha de fronteira alcança, encontra ou toca um lugar.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, mais literalmente: saía para o Jordão; a expressão hebraica descreve o percurso ou o ponto final da fronteira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Então a fronteira descia
  rationale: Em descrições territoriais, ירד indica que a linha de fronteira desce em altitude ou segue em determinada direção. A explicitação de “a fronteira”, recuperada do contexto, torna o referente natural em português; o imperfeito descreve o percurso.
- source_word: מִיָּנוֹחָה
  choice: de Janoa
  rationale: A preposição מִן é traduzida por “de”, e o topônimo é transliterado segundo uma forma natural em português.
- source_word: עֲטָרוֹת
  choice: Atarote
  rationale: O nome geográfico é transliterado, e não traduzido, com forma adaptada à leitura em português.
- source_word: וְנַעֲרָתָה
  choice: e Naará
  rationale: Segue-se a vocalização do Texto Massorético neste versículo; a possível relação com Naarate é registrada em nota.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: chegava a Jericó
  rationale: Em fórmulas de limites territoriais, פגע pode indicar que uma linha alcança, encontra ou toca um lugar. “Chegava a” é natural e preserva esse sentido espacial sem especificar além do texto.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: e terminava no Jordão
  rationale: Nesta fórmula de fronteira, יצא descreve o ponto a que a linha chega ou onde desemboca. “Terminava no” comunica claramente a função de ponto final, enquanto a alternativa mais literal consta em nota.
- source_word: הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma portuguesa consagrada para o nome do rio; não é necessário explicitar “rio” neste contexto.
