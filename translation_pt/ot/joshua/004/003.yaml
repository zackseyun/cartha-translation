base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: pt
  text: 'e ordenem-lhes: “Retirem para vocês daqui, do meio do Jordão, do lugar onde os pés dos sacerdotes estão firmemente postos, doze pedras; levem-nas com vocês e coloquem-nas no local de pernoite[a] onde passarão a noite.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Local de pernoite” refere-se ao lugar onde Israel ficaria durante a noite após a travessia, não necessariamente a um assentamento permanente.
    reason: cultural_note
lexical_decisions:
- source_word: וְצַוּוּ
  choice: e ordenem-lhes
  rationale: O imperativo piel plural transmite uma ordem direta; “ordenem” preserva essa força melhor que “instruam”.
- source_word: שְׂאוּ לָכֶם
  choice: Tirem
  rationale: No contexto, נשׂא descreve levantar e retirar as pedras do leito do rio. Em português, “tirem” comunica naturalmente a ação; o envolvimento pessoal expresso por לָכֶם fica implícito no imperativo plural e na sequência “com vocês”.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: daqui, do meio do Jordão
  rationale: 'Mantém a dupla expressão preposicional e sua vividez: as pedras devem ser retiradas deste ponto específico, dentro do Jordão.'
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: do lugar onde os pés dos sacerdotes estão firmes
  rationale: Expressa de modo natural tanto o lugar em que os sacerdotes estão posicionados quanto a estabilidade indicada por הָכִין, sem tornar a construção excessivamente literal.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: doze pedras
  rationale: Correspondência direta e clara ao numeral e ao substantivo hebraicos.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: e levem-nas com vocês
  rationale: O hifil de עבר indica fazer as pedras atravessarem junto com o povo. “Levem-nas” é idiomático em português, enquanto “com vocês” preserva o acompanhamento explícito.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: depois, coloquem-nas
  rationale: O hifil de נוח significa depositar ou pôr as pedras. “Coloquem-nas” é concreto e natural; “depois” explicita apenas a sequência já presente na cadeia verbal.
- source_word: בַּמָּלוֹן
  choice: no lugar de pouso
  rationale: מָלוֹן designa um local de pernoite. “Lugar de pouso” conserva esse sentido sem sugerir necessariamente povoado permanente ou acampamento militar.
- source_word: אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: onde passarão a noite
  rationale: Formulação portuguesa natural que preserva o valor futuro contextual do imperfeito e explica a função do lugar de pouso.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A ordem direta foi preservada, assim como a localização enfática das pedras no meio do Jordão. Evitou-se a formulação rígida “do ponto de apoio dos pés”, preferindo-se uma expressão natural que retém a ideia de firmeza.
