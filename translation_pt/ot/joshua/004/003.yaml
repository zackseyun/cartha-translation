  naturalness: O português é claro e de registro adequado. “Lugar de pouso” é compreensível, mas “local de pernoite” é mais natural e inequívoco no português atual, especialmente para leitores brasileiros, sem sugerir pouso de veículo ou aeronave.
  terminology: “Jordão”, “sacerdotes”, “pedras” e “ordenem-lhes” são adequados. “Firmemente postos” comunica com maior precisão natural a ideia de posição estável expressa por מַצָּב ... הָכִין.
