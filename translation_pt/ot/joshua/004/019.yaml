base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: pt
  text: O povo saiu do Jordão no décimo dia do primeiro mês e acampou em Gilgal, na extremidade leste de Jericó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלוּ
  choice: saiu
  rationale: O verbo עלה indica aqui o movimento de subida para fora do leito do Jordão. Em português, “saiu do Jordão” expressa naturalmente esse deslocamento no contexto, sem sugerir necessariamente uma ascensão topográfica prolongada.
- source_word: מִן הַיַּרְדֵּן
  choice: do Jordão
  rationale: A preposição מן marca a procedência ou o movimento para fora do rio. “Do Jordão” é conciso e idiomático, e o contexto identifica o rio.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: no décimo dia do primeiro mês
  rationale: A fórmula hebraica indica uma data do calendário; “dia” é explicitado em português para clareza natural.
- source_word: וַיַּחֲנוּ
  choice: e acampou
  rationale: חנה significa acampar. O singular concorda naturalmente com o coletivo “o povo”, preservando a sequência narrativa.
- source_word: בַּגִּלְגָּל
  choice: em Gilgal
  rationale: Gilgal é mantido como nome próprio transliterado; “em” é a preposição corrente em português para indicar o local do acampamento.
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: na extremidade leste de Jericó
  rationale: קצה denota extremidade, limite ou borda, e מזרח especifica o lado leste. A formulação conserva a descrição geográfica sem decidir além do hebraico se se trata do limite urbano ou da área associada a Jericó.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluida. Emprega-se “saiu” para tornar natural o movimento para fora do Jordão e “extremidade leste” para preservar a expressão geográfica do hebraico.
