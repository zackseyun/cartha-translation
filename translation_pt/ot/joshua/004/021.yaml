base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/021.yaml
  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: pt
  text: 'E ele disse aos filhos de Israel: “Quando, no futuro,[a] os filhos de vocês[b] perguntarem a seus pais: ‘O que são estas pedras?’[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “amanhã”, usado aqui de modo idiomático para um tempo futuro ou uma geração posterior.'
    reason: lexical_alternative
  - marker: b
    text: Ou, em sentido mais amplo, “os descendentes de vocês”. O hebraico diz literalmente “os filhos de vocês”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, de modo mais interpretativo: “O que significam estas pedras?” O hebraico diz mais literalmente: “O que são estas pedras?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ele disse
  rationale: Preserva o fluxo narrativo sequencial do wayyiqtol hebraico sem acrescentar uma nuance temporal mais específica.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar e pactual do hebraico, em linguagem portuguesa tradicional e compreensível.
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: Quando ... perguntarem
  rationale: Neste contexto, אֲשֶׁר introduz uma circunstância futura, e שאל descreve naturalmente o ato de perguntar.
- source_word: בְּנֵיכֶם
  choice: os filhos de vocês
  rationale: Reproduz o masculino plural do hebraico sem excluir a possibilidade contextual de referência mais ampla aos descendentes.
- source_word: מָחָר
  choice: no futuro
  rationale: O sentido idiomático é um tempo posterior, possivelmente uma geração futura, e não necessariamente o dia seguinte.
- source_word: אֶת אֲבוֹתָם
  choice: aos pais
  rationale: Expressa a cena familiar imediata de filhos perguntando a seus pais; 'antepassados' ampliaria indevidamente a referência.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: O que são estas pedras?
  rationale: Conserva a formulação identificadora do hebraico, deixando que o contexto comunique a pergunta implícita sobre o significado das pedras.
