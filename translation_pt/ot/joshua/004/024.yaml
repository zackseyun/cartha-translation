  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לְ֠מַעַן דַּ֜עַת כָּל עַמֵּ֤י הָ/אָ֨רֶץ֙ אֶת יַ֣ד יְהוָ֔ה כִּ֥י חֲזָקָ֖ה הִ֑יא לְמַ֧עַן יְרָאתֶ֛ם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: pt
  text: para que todos os povos da terra saibam que a mão de Yahweh é forte[a], e para que vocês temam[b] Yahweh, seu Deus, todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os povos da terra”, se הָאָרֶץ for entendido em sentido mais local, como a terra ou região.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “temer” inclui reverência e admiração diante de Yahweh, não apenas terror.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Preserva a força de propósito nas duas orações e soa natural em português moderno.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: todos os povos da terra
  rationale: עַמִּים designa “povos”, não necessariamente entidades políticas; “terra” preserva a leitura global preferida sem eliminar a possibilidade local.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Mantém a imagem antropomórfica hebraica, clara e tradicional, em vez de reduzi-la interpretativamente a “poder”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando seu caráter de nome próprio pactual.
- source_word: כִּי חֲזָקָה הִיא
  choice: é forte
  rationale: Equivalência direta do predicativo חֲזָקָה, cujo pronome feminino retoma “mão”.
- source_word: יְרָאתֶם
  choice: vocês temam
  rationale: Conserva o sentido direto e a tensão teológica de ירא; no contexto, o temor inclui reverência e assombro, mas não deve ser suavizado no texto principal.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: O referente é Yahweh, de modo que אֱלֹהִים funciona como título singular; “seu” concorda idiomaticamente com o tratamento plural “vocês” no português brasileiro.
- source_word: כָּל הַיָּמִים
  choice: todos os dias
  rationale: Expressa duração contínua e permanente de forma natural; a construção hebraica não traz explicitamente o possessivo “seus”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama; “Yahweh” preserva o nome pactual e segue a forma preferida do projeto.
- issue: Sentido de ירא
  choice: temam
  alternative: reverenciem
  rationale: “Temer” mantém tanto a reverência quanto a dimensão de santo temor, sem resolver a tensão por meio de uma paráfrase mais branda.
- issue: Alcance de הָאָרֶץ
  choice: terra, em sentido global
  alternative: terra, em sentido local
  rationale: A demonstração pública do poder de Yahweh favorece o alcance global, embora o substantivo hebraico também admita referência à terra/região.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e mantém a imagem bíblica “mão de Yahweh”. Os marcadores foram posicionados junto às expressões a que se referem.
