lexical_decisions:
- source_word: וְאֵת
  choice: E
  rationale: A conjunção liga o versículo à narrativa anterior; o marcador de objeto אֵת não tem equivalente direto em português.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: estas doze pedras
  rationale: Preserva o numeral, o substantivo e o demonstrativo em ordem natural no português moderno.
- source_word: אֲשֶׁר לָקְחוּ
  choice: que eles haviam tirado
  rationale: A oração relativa identifica as pedras, e o mais-que-perfeito composto esclarece naturalmente que a retirada precedeu sua colocação em Gilgal.
- source_word: מִן הַיַּרְדֵּן
  choice: do Jordão
  rationale: O nome tradicional do rio é claro no contexto; a preposição expressa a origem das pedras.
- source_word: הֵקִים
  choice: ergueu
  rationale: No contexto de pedras memoriais, comunica de forma natural a ação de colocá-las de pé ou estabelecê-las como monumento.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: בַּגִּלְגָּל
  choice: em Gilgal
  rationale: A preposição בְּ indica o local onde Josué ergueu as pedras; “em Gilgal” é idiomático em português.
