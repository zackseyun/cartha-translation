source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: pt
  text: Pois Yahweh, o Deus de vocês, fez secar as águas do Jordão diante de vocês até que atravessassem, assim como Yahweh, o Deus de vocês, fez com o mar de Juncos[a], que ele fez secar diante de nós até que atravessássemos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente traduzido como “mar Vermelho”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: secou
  rationale: O hifil de יבש indica que Yahweh fez as águas secarem, possibilitando a travessia. “Secou” é natural em português e preserva a repetição do verbo no versículo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: No contexto, o substantivo tem sentido singular e identifica Yahweh como o Deus de Israel. “De vocês” oferece leitura ampla e natural em português moderno.
- source_word: מֵי הַיַּרְדֵּן
  choice: as águas do Jordão
  rationale: Preserva a construção concreta do hebraico e a imagem das águas do rio.
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: diante de vocês / diante de nós
  rationale: Reproduz de modo natural o sentido espacial do idioma hebraico e mantém o paralelismo entre as duas travessias.
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: até que atravessassem / até que atravessássemos
  rationale: Expressa a duração até a conclusão da travessia e conserva o paralelismo entre a geração presente e a geração do êxodo.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: assim como ... fez
  rationale: Torna explícita, de maneira idiomática, a comparação entre a travessia do Jordão e a travessia anterior do mar.
- source_word: יַם סוּף
  choice: mar de Juncos
  rationale: סוּף significa “junco” ou “juncos”; a tradução segue prioritariamente a expressão hebraica, enquanto a forma tradicional é indicada em nota.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome divino. A transliteração preserva sua condição de nome pessoal sem substituí-lo por um título.
- issue: Tradução de יַם סוּף
  choice: mar de Juncos
  alternative: mar Vermelho
  rationale: A expressão hebraica designa literalmente o “mar de Juncos”. A tradução tradicional, embora muito conhecida, é mantida em nota para orientação do leitor.
- issue: Identificação do narrador com a geração do êxodo em מִפָּנֵינוּ e עַד עָבְרֵנוּ
  choice: diante de nós até que atravessássemos
  alternative: diante deles até que atravessassem
  rationale: A primeira pessoa plural está expressa no hebraico e é preservada, sem explicar ou harmonizar como o falante se relaciona com a geração do êxodo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa plural. A ordem foi levemente ajustada para fluidez, sem perder o paralelismo e a repetição deliberada do hebraico. O marcador da nota foi colocado junto a “mar de Juncos”, termo ao qual a alternativa lexical se refere.
