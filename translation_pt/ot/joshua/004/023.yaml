  source_fidelity: 'O sentido central e o paralelismo do hebraico são preservados: Yahweh seca as águas do Jordão para a travessia e é comparado ao que fez ao mar de Juncos. Contudo, a construção portuguesa «secou diante de vocês as águas» soa ambígua e menos fiel à relação verbal: pode sugerir que Yahweh secou algo situado diante do povo, em vez de que removeu as águas de diante deles. «Fez secar ... diante de vocês» explicita com segurança o valor causativo do hifil e a relação espacial de מִפְּנֵיכֶם.'
  naturalness: A redação é compreensível, mas a ordem «secou diante de vocês as águas» é marcada. «Fez secar as águas do Jordão diante de vocês» é mais natural e clara em português moderno. Mantém-se o subjuntivo após «até que», bem como o paralelismo «atravessassem/atravessássemos».
  terminology: «Yahweh», «o Deus de vocês», «águas do Jordão» e «mar de Juncos» são adequados. A nota sobre «mar Vermelho» está corretamente ancorada e usa a alternativa tradicional sem a impor ao texto principal.
