  text: צַוֵּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הָ/עֵד֑וּת וְ/יַעֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: pt
  text: Ordene aos sacerdotes que carregam a arca do testemunho que subam do Jordão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a arca da testemunha”. O hebraico diz “testemunho”, não o termo mais conhecido “aliança”, usado em muitas outras referências à arca.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: Ordene
  rationale: Imperativo masculino singular de צוה, dirigido a Josué; “ordene” preserva a força direta da instrução.
- source_word: הַכֹּהֲנִים
  choice: aos sacerdotes
  rationale: Tradução corrente de כהנים, preservando o artigo definido e a regência natural de “ordenar” em português.
- source_word: נֹשְׂאֵי
  choice: que carregam
  rationale: O particípio qal plural construto de נשׂא descreve os sacerdotes; a oração relativa é clara e natural em português.
- source_word: אֲרוֹן הָעֵדוּת
  choice: a arca do testemunho
  rationale: Preserva a cadeia construta e traduz especificamente עֵדוּת como “testemunho”, sem harmonizá-la com a expressão mais comum “arca da aliança”.
- source_word: וְיַעֲלוּ
  choice: que subam
  rationale: A forma de עלה exprime a ação ordenada como consequência do primeiro imperativo; “subam” mantém o movimento para fora do leito do rio sem explicitá-lo além do hebraico.
- source_word: מִן הַיַּרְדֵּן
  choice: do Jordão
  rationale: מן indica procedência ou movimento para fora; “do Jordão” é conciso, natural e preserva a formulação do texto.
theological_decisions:
- issue: Designação da arca
  choice: arca do testemunho
  alternative: arca da aliança
  rationale: O texto hebraico traz עֵדוּת, “testemunho”, e não בְּרִית, “aliança”; a tradução evita substituir a expressão por uma fórmula tradicional mais conhecida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém a força do imperativo e a terminologia específica do hebraico.
