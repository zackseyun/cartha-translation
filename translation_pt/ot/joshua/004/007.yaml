base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: pt
  text: 'então vocês lhes dirão: “As águas do Jordão foram interrompidas diante da arca da aliança de Yahweh. Quando ela atravessou o Jordão, as águas do Jordão foram interrompidas.” E estas pedras servirão de memorial para os filhos de Israel[a] para sempre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para os israelitas”. O hebraico diz literalmente “para os filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: foram interrompidas
  rationale: No contexto das águas de um rio, o nifal de כרת indica que o fluxo foi detido. “Foram interrompidas” transmite isso com naturalidade e preserva a repetição hebraica.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: as águas do Jordão
  rationale: Mantém a expressão plural hebraica e é idiomática em português para o fluxo do rio.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Preserva o sentido espacial de algo ocorrido perante ou à frente da arca.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Conserva o título completo e apresenta o nome divino explícito no texto hebraico.
- source_word: בְּעָבְרוֹ
  choice: quando ela atravessou
  rationale: O sufixo masculino singular retoma a arca em hebraico; em português, o pronome feminino “ela” concorda naturalmente com “arca”.
- source_word: וְהָיוּ ... לְזִכָּרוֹן
  choice: E estas pedras servirão de memorial
  rationale: O futuro expressa a função duradoura das pedras; “servirão de memorial” é claro, digno e natural.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para os filhos de Israel
  rationale: Representa formalmente o hebraico “filhos de Israel”, deixando em nota as alternativas coletivas correntes.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: É a equivalência portuguesa direta e natural para a duração permanente expressa pelo idioma hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino. “Yahweh” preserva sua função de nome da aliança sem substituí-lo por um título.
- issue: Alcance de לִבְנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: filhos e filhas de Israel; israelitas
  rationale: A tradução principal conserva a forma lexical masculina do hebraico, sem excluir a possível referência coletiva ao povo; essa possibilidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “as águas do Jordão foram interrompidas” foi mantida por corresponder à ênfase do hebraico. O marcador [a] aparece no texto principal junto à expressão anotada.
