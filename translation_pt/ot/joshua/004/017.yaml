  yaml_path: translation/ot/joshua/004/017.yaml
  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: pt
  text: 'Então Josué ordenou aos sacerdotes: “Subam do Jordão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Então ... ordenou
  rationale: O verbo צוה expressa uma ordem com autoridade. “Ordenou” preserva essa força, e “Então” liga naturalmente a ação à sequência narrativa.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶת הַכֹּהֲנִים
  choice: aos sacerdotes
  rationale: O marcador de objeto direto seguido do substantivo definido é expresso naturalmente em português por “aos sacerdotes” após o verbo “ordenar”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Em narrativa portuguesa atual, os dois-pontos introduzem a fala direta de modo mais natural e conciso do que a tradução literal “dizendo”, sem perda de sentido.
- source_word: עֲלוּ
  choice: Subam
  rationale: O imperativo plural de עלה indica movimento para cima ou para fora. “Subam” conserva a imagem espacial sem especificar desnecessariamente se o movimento é em direção ao falante.
- source_word: מִן הַיַּרְדֵּן
  choice: do Jordão
  rationale: A preposição מן indica movimento para fora ou para longe do local; no contexto, “do Jordão” comunica de forma natural que os sacerdotes devem sair do rio.
