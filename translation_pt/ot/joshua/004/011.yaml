base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: pt
  text: Quando todo o povo terminou de atravessar, a arca de Yahweh e os sacerdotes atravessaram diante do povo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença do povo”. A expressão hebraica pode indicar tanto posição espacial (“à frente do povo”) quanto presença.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A fórmula narrativa introduz a circunstância temporal. Em português atual, “Quando” transmite naturalmente a progressão sem a construção mais pesada “E aconteceu que, quando”.
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: todo o povo terminou de atravessar
  rationale: תַּם indica conclusão, e לַעֲבוֹר completa o verbo com a ação de cruzar o Jordão. A formulação preserva a totalidade expressa por כָּל e soa natural em português.
- source_word: וַיַּעֲבֹר
  choice: atravessaram
  rationale: O verbo עבר retoma a mesma ação da oração anterior. O plural é empregado em português porque a arca e os sacerdotes aparecem coordenados como participantes da travessia.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: A cadeia construta significa “a arca de YHWH”. “Yahweh” representa diretamente o nome divino, em vez de substituí-lo por um título.
- source_word: וְהַכֹּהֲנִים
  choice: e os sacerdotes
  rationale: A conjunção coordena os sacerdotes com a arca como sujeitos da ação, preservando a estrutura explícita do hebraico.
- source_word: לִפְנֵי הָעָם
  choice: diante do povo
  rationale: לִפְנֵי pode indicar posição à frente ou presença/visibilidade. “Diante do povo” preserva essa amplitude melhor que uma formulação exclusivamente espacial.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama como nome próprio. “Yahweh” preserva o nome da aliança sem substituí-lo pelo título “SENHOR” nem adotar a forma híbrida tradicional “Jeová”.
- issue: Relação espacial ou presencial em לִפְנֵי הָעָם
  choice: diante do povo
  alternative: à frente do povo; na presença do povo
  rationale: O hebraico admite tanto uma relação espacial quanto a ideia de presença. A tradução mantém a tensão lexical, enquanto a nota explicita a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A frase evita a fórmula narrativa excessivamente literal “E aconteceu que” e mantém a repetição de “atravessar”, correspondente à repetição da raiz עבר no hebraico.
