lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: O wayyiqtol de אמר faz a narrativa avançar; “E ... disse” preserva de modo natural a sequência narrativa hebraica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֶל
  choice: a
  rationale: A preposição introduz o destinatário da fala; “disse a Josué” é a construção corrente em português.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma portuguesa consagrada do nome hebraico.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala direta do versículo seguinte; em português, os dois-pontos expressam essa função com naturalidade, sem a formulação rígida “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal por transliteração, sem substituí-lo por um título nem adotar outra vocalização tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. Os dois-pontos deixam claro que a declaração continua no versículo seguinte.
