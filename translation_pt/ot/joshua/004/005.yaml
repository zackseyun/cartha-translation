revisions:
- from: 'E Josué lhes disse: “Passem à frente da arca de Yahweh, seu Deus, até o meio do Jordão, e cada homem levante uma pedra sobre o ombro, conforme o número das tribos dos filhos de Israel[a].”'
  to: 'E Josué lhes disse: “Passem diante da arca de Yahweh, seu Deus, para o meio do Jordão, e cada homem levante para si uma pedra sobre o seu ombro, conforme o número das tribos dos filhos de Israel[a].”'
  rationale: 'A revisão conserva a equivalência formal e melhora a representação de duas relações gramaticais do hebraico: o movimento direcional para o meio do Jordão e a referência distributiva ao ombro de cada homem. A partícula לָכֶם é representada por «para si», mantendo sua nuance dativa sem sobrecarregar a frase.'
