  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: pt
  text: 'E Josué lhes disse: “Passem diante da arca de Yahweh, seu Deus, para o meio do Jordão, e cada homem levante para si uma pedra sobre o seu ombro, conforme o número das tribos dos filhos de Israel[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “filhos de Israel”. Esta expressão formal também pode ser traduzida como “israelitas” ou “povo de Israel”.'
    reason: Explica a expressão hebraica preservada no texto e registra alternativas naturais em português, sem acrescentar uma caracterização interpretativa.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém a progressão narrativa do wayyiqtol de modo natural em português, sem tornar a relação temporal mais específica do que o hebraico.
- source_word: עִבְרוּ לִפְנֵי
  choice: Passem à frente de
  rationale: Expressa o movimento para uma posição diante da arca; é natural em português e preserva o sentido espacial de לִפְנֵי.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: a arca de Yahweh, seu Deus
  rationale: Reproduz diretamente a cadeia construta e conserva o nome divino como Yahweh. O possessivo plural hebraico é expresso pelo português coletivo “seu” dirigido ao grupo.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: até o meio do Jordão
  rationale: תּוֹךְ indica a parte interior ou central; “até” apresenta naturalmente em português o destino do movimento exigido pelo contexto.
- source_word: וְהָרִימוּ לָכֶם אִישׁ
  choice: e cada homem levante
  rationale: O hifil imperativo de רום comunica levantar ou erguer, enquanto אִישׁ tem força distributiva. “Cada homem” preserva a referência masculina aos representantes tribais do contexto.
- source_word: אֶבֶן אַחַת עַל שִׁכְמוֹ
  choice: uma pedra sobre o ombro
  rationale: Mantém o numeral e a imagem concreta do transporte da pedra sobre o ombro; em português, o possessivo pode ser omitido sem perder a relação distributiva já estabelecida por “cada homem”.
- source_word: לְמִסְפַּר
  choice: conforme o número de
  rationale: Exprime claramente a correspondência entre a quantidade de pedras e a quantidade de tribos.
- source_word: שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: as tribos dos filhos de Israel
  rationale: Preserva os dois elementos da expressão hebraica e sua formulação tradicional e pactual, sem reduzi-la simplesmente a “tribos de Israel”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome pactual em vez de substituí-lo por um título.
- issue: Representação de אִישׁ e בְנֵי יִשְׂרָאֵל
  choice: cada homem ... os filhos de Israel
  alternative: cada pessoa ... os israelitas
  rationale: As formas masculinas são pertinentes ao contexto dos representantes escolhidos de cada tribo. A redação conserva essa especificidade e a expressão hebraica formal sem introduzir uma formulação neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o fluxo narrativo e as imagens concretas do hebraico, evitando arcaísmos como “passai” e “seu ombro” desnecessariamente repetitivo.
