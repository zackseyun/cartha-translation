review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem os elementos centrais do hebraico: Josué como sujeito, a arca de Yahweh, o Jordão, uma pedra por homem e a correspondência com as tribos. Contudo, «até o meio do Jordão» enfraquece a direção expressa por אֶל («para/ao meio»); e «sobre o ombro» omite uma relação possessiva singular que convém explicitar no enunciado distributivo.'
  naturalness: O registro é moderno, claro e adequado. «Passem diante da arca ... para o meio do Jordão» é mais preciso e fluente neste contexto do que «Passem à frente da arca ... até o meio do Jordão».
  terminology: «Yahweh», «cada homem» e «filhos de Israel» são escolhas fiéis e consistentes. A nota deve limitar-se a informar a expressão hebraica e alternativas de tradução, sem caracterizar de forma interpretativa sua função identitária ou pactual.
  issues:
  - severity: medium
    issue: Direção para o meio do Jordão
    rationale: אֶל תּוֹךְ requer movimento para dentro/para o meio do Jordão. «Até o meio» pode indicar apenas o limite final do deslocamento; «para o meio» reproduz mais diretamente a preposição direcional.
  - severity: low
    issue: Possessivo em «sobre o ombro»
    rationale: O sufixo singular em שִׁכְמוֹ se refere distributivamente a cada homem. «Sobre o seu ombro» torna essa relação explícita sem artificialidade.
  - severity: low
    issue: Formulação explicativa da nota
    rationale: «Identidade familiar e pactual» introduz uma explicação interpretativa que não é necessária para a alternativa lexical. Uma nota mais neutra preserva melhor o caráter informativo.
