lexical_decisions:
- source_word: קְחוּ לָכֶם
  choice: Escolham
  rationale: Embora לקח tenha o sentido básico de “tomar”, neste contexto a ordem visa designar representantes. “Escolham” comunica naturalmente essa função em português; o valor benefactivo de לָכֶם fica implícito na ação do grupo.
- source_word: מִן הָעָם
  choice: dentre o povo
  rationale: A preposição מן indica seleção a partir do conjunto do povo. “Dentre o povo” expressa isso com clareza e concisão.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: doze homens
  rationale: A expressão designa doze indivíduos do sexo masculino; “homens” preserva essa especificidade.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: um de cada
  rationale: A repetição hebraica tem valor distributivo. A formulação portuguesa transmite que deve haver um representante por tribo sem reproduzir de modo artificial a repetição.
- source_word: מִשָּׁבֶט
  choice: tribo
  rationale: שבט se refere aqui a cada uma das tribos de Israel; “tribo” é o equivalente corrente e preciso.
