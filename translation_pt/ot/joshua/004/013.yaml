  text: כְּ/אַרְבָּעִ֥ים אֶ֖לֶף חֲלוּצֵ֣י הַ/צָּבָ֑א עָבְר֞וּ לִ/פְנֵ֤י יְהוָה֙ לַ/מִּלְחָמָ֔ה אֶ֖ל עַֽרְב֥וֹת יְרִיחֽוֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: pt
  text: Cerca de quarenta mil homens armados para a guerra atravessaram diante de Yahweh para a batalha, rumo às planícies de Jericó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אַרְבָּעִים אֶלֶף
  choice: Cerca de quarenta mil
  rationale: O prefixo כְּ confere valor aproximativo ao numeral; “cerca de” preserva essa nuance de modo natural em português.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: homens armados para a guerra
  rationale: A expressão designa pessoas equipadas ou dispostas para ação militar. “Homens armados para a guerra” é claro e não especifica indevidamente que fossem uma vanguarda.
- source_word: עָבְרוּ
  choice: atravessaram
  rationale: No contexto de Josué 3–4, o verbo se refere à travessia do Jordão; em português, “atravessaram” mantém essa ligação narrativa sem redundância.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva o sentido espacial e relacional de “diante de/na presença de” e mantém o nome divino explícito no hebraico.
- source_word: לַמִּלְחָמָה
  choice: prontos para a batalha
  rationale: O hebraico expressa direção ou finalidade militar. A formulação portuguesa torna natural a sequência sem repetir “guerra” de modo pesado, embora explicite a prontidão sugerida pelo contexto.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: em direção às planícies de Jericó
  rationale: עַרְבוֹת denota a região plana ou estepe do vale do Jordão. “Planícies de Jericó” é compreensível e geograficamente adequado; “em direção a” conserva a força direcional de אֶל.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome de aliança sem substituí-lo por um título e segue a orientação fornecida para o projeto.
- issue: Sentido de לִפְנֵי יְהוָה no contexto da travessia
  choice: diante de Yahweh
  alternative: na presença de Yahweh
  rationale: “Diante de” preserva a ambiguidade entre posição na marcha, presença divina e serviço sob a autoridade de Yahweh, sem reduzir a frase a uma interpretação exclusivamente espacial ou teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. A ordem hebraica foi levemente ajustada para fluência, mantendo a aproximação numérica, a preparação militar, a referência explícita a Yahweh e o destino geográfico.
