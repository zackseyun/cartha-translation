translation:
  language: pt
  text: 'Então vocês contarão a seus filhos[a]: “Israel atravessou este Jordão em terra seca.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a seus filhos”, no sentido de descendentes masculinos; o hebraico pode indicar especificamente filhos do sexo masculino ou, em sentido mais amplo, filhos em geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: então vocês explicarão
  rationale: O hifil de ידע expressa fazer saber, informar ou dar a conhecer. “Explicarão” é natural em português no contexto de pais transmitindo aos filhos o significado do memorial; “então” representa contextualmente a conjunção e o encadeamento da instrução.
- source_word: בְּנֵיכֶם
  choice: a seus filhos
  rationale: בנים pode designar especificamente filhos homens ou, em uso mais amplo, os filhos em geral. “Filhos” preserva em português essa mesma possibilidade de leitura, esclarecida em nota.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz o conteúdo da fala. Em português atual, os dois-pontos apresentam a citação de modo mais natural do que o literal “dizendo”.
- source_word: בַּיַּבָּשָׁה
  choice: em terra seca
  rationale: A expressão denota solo ou terra sem água. “Em terra seca” é idiomático e mantém a ênfase no caráter seco do lugar da travessia.
- source_word: עָבַר
  choice: atravessou
  rationale: עבר significa passar ou cruzar; com o Jordão como objeto direto, “atravessou” é claro e natural.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nome próprio do povo; mantém-se a forma portuguesa consagrada.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: este Jordão
  rationale: O demonstrativo confere proximidade e referência concreta. “Este Jordão” preserva a formulação hebraica sem acrescentar “rio”, ausente do texto.
