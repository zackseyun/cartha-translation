base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: pt
  text: 'E aconteceu que, quando toda a nação[a] terminou de atravessar o Jordão, Yahweh disse a Josué:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «todo o povo»; o hebraico emprega para Israel um substantivo coletivo singular: «toda a nação».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Quando
  rationale: A combinação introduz a circunstância temporal que precede a fala. Em português narrativo atual, «Quando» comunica naturalmente essa função sem reproduzir de modo artificial a fórmula hebraica וַיְהִי.
- source_word: תַּמּוּ
  choice: terminou
  rationale: O verbo תמם indica que a travessia foi concluída; o singular concorda com o sujeito coletivo «toda a nação».
- source_word: כָל הַגּוֹי
  choice: toda a nação
  rationale: Preserva o substantivo coletivo singular גּוֹי e apresenta Israel corporativamente, embora «todo o povo» também seja possível em português.
- source_word: לַעֲבוֹר
  choice: de atravessar
  rationale: Depois de «terminou», esta construção é idiomática em português e expressa a ação completada.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: Forma geográfica tradicional e suficiente em português; o contexto identifica o rio.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר ... אֶל ... לֵאמֹר
  choice: 'disse a Josué:'
  rationale: Traduz de maneira natural a fórmula hebraica de introdução do discurso; os dois-pontos indicam que o conteúdo continua no versículo seguinte.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma portuguesa consagrada do nome hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. «Yahweh» conserva o nome pessoal e evita substituí-lo por um título, sem afirmar certeza absoluta sobre a vocalização antiga.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem foi ajustada à narrativa natural em português, preservando a conclusão da travessia antes da fala divina.
