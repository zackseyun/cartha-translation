review_pass:
  verdict: revise
  source_fidelity: A sequência narrativa e os elementos principais estão preservados. Contudo, «levaram-nas consigo até» não expressa claramente o valor de travessia em וַיַּעֲבִרוּם («fizeram-nas passar/atravessar»). Além disso, «uma para cada tribo» é uma explicitação legítima, mas «segundo o número das tribos» reproduz mais diretamente a formulação hebraica.
  naturalness: O texto é claro e fluente em português moderno. «Local de pernoite» é natural e mais preciso do que termos que possam sugerir hospedagem comercial.
  terminology: «Filhos de Israel», «Yahweh», «Jordão» e «tribos» são adequados e consistentes com o hebraico. «Depositaram» traduz bem o ato de pôr as pedras no local.
  issues:
  - severity: medium
    issue: A travessia das pedras não está explicitada.
    rationale: O verbo causativo וַיַּעֲבִרוּם afirma que eles fizeram as pedras atravessar com eles. «Levaram-nas consigo até» permite inferir o movimento, mas não comunica de modo claro a travessia indicada pelo texto.
  - severity: low
    issue: «Uma para cada tribo» torna explícita uma relação distributiva que o hebraico formula como correspondência numérica.
    rationale: A formulação não é incorreta no contexto, mas «segundo o número das tribos» mantém mais de perto a expressão לְמִסְפַּר e evita explicitação desnecessária.
  revised_text: 'E os filhos de Israel fizeram assim, conforme Josué havia ordenado: tiraram do meio do Jordão doze pedras, como Yahweh havia dito a Josué, segundo o número das tribos dos filhos de Israel; levaram-nas consigo, atravessando o rio até o local de pernoite[a], e as depositaram ali.'
  revised_footnotes:
