source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: pt
  text: 'E os filhos de Israel fizeram assim, conforme Josué havia ordenado: tiraram do meio do Jordão doze pedras, como Yahweh havia dito a Josué, segundo o número das tribos dos filhos de Israel; levaram-nas consigo, atravessando o rio até o local de pernoite[a], e as depositaram ali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «até o acampamento». O termo hebraico designa mais especificamente um lugar de pernoite ou acampamento noturno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar hebraica e seu paralelismo com a referência posterior às tribos, sem recorrer ao mais tradicional e hoje menos natural «filhos de Israel» no sentido biológico estrito.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: fizeram assim
  rationale: Equivalente português corrente que expressa o cumprimento da ordem.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: Comunica instrução dotada de autoridade; o mais-que-perfeito composto esclarece que a ordem precedeu seu cumprimento.
- source_word: וַיִּשְׂאוּ
  choice: pegaram
  rationale: No contexto, abrange o ato de retirar e tomar consigo as pedras; a ação de transportá-las aparece explicitamente na oração seguinte.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: do meio do Jordão
  rationale: Mantém a referência espacial concreta ao interior ou leito do rio em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino explícito no texto hebraico, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל יְהוֹשֻׁעַ
  choice: como Yahweh havia dito a Josué
  rationale: Expressa naturalmente a comunicação anterior. «Dito» é idiomático em português sem alterar o conteúdo de דִּבֶּר.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: uma para cada tribo dos filhos de Israel
  rationale: 'Explicita a correspondência distributiva implícita: doze pedras em correspondência com o número das tribos.'
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: levaram-nas consigo
  rationale: Comunica que fizeram as pedras passar junto com eles; o contexto imediato já estabelece a travessia do Jordão.
- source_word: הַמָּלוֹן
  choice: o lugar onde passariam a noite
  rationale: Expressa o sentido específico de parada ou acampamento para pernoite, evitando a ideia moderna de hospedagem comercial associada a «alojamento».
- source_word: וַיַּנִּיחוּם שָׁם
  choice: e as colocaram ali
  rationale: Reproduz com clareza o ato de depositar as pedras naquele lugar.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio. «Yahweh» preserva essa função e uma vocalização acadêmica amplamente aceita, sem substituir o nome por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para fluidez, preservando a sequência narrativa, a expressão «filhos de Israel» e a correspondência entre as doze pedras e as doze tribos. O único marcador de nota, [a], aparece no texto principal.
