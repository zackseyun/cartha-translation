  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: pt
  text: Josué ergueu doze pedras no meio do Jordão, debaixo do lugar onde estavam os pés dos sacerdotes que carregavam a arca da aliança[a]; e elas permanecem ali até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “debaixo do lugar onde estavam plantados os pés dos sacerdotes”. A expressão hebraica se refere ao ponto em que os sacerdotes ficaram parados enquanto carregavam a arca.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: ergueu
  rationale: O hifil de קום indica fazer ficar de pé, levantar ou erigir. “Ergueu” é natural em português e se ajusta ao contexto de pedras memoriais.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: no meio do Jordão
  rationale: תּוֹךְ indica o meio ou interior de algo. A formulação preserva de modo claro a afirmação espacial do hebraico.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: debaixo do lugar onde estavam os pés
  rationale: מַצָּב designa o lugar ou posição em que alguém está de pé. A tradução mantém tanto a relação espacial expressa por תַּחַת quanto a referência aos pés, sem reproduzir uma construção excessivamente rígida em português.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: os sacerdotes que carregavam a arca da aliança
  rationale: O particípio נֹשְׂאֵי caracteriza os sacerdotes como os que levavam a arca. “Carregavam” é corrente, claro e fiel ao sentido.
- source_word: וַיִּהְיוּ שָׁם
  choice: e elas permanecem ali
  rationale: No contexto da fórmula עַד הַיּוֹם הַזֶּה, a expressão apresenta a presença das pedras como continuada até o tempo do narrador. “Permanecem” explicita naturalmente esse valor em português.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente português consagrado da fórmula hebraica que assinala continuidade até o presente do narrador, sem afirmar que as pedras ainda existam no presente do leitor.
theological_decisions:
- issue: Tensão narrativa entre estas doze pedras no Jordão e as doze pedras levantadas em Gilgal no contexto próximo
  choice: Traduzir o versículo como descrição de doze pedras que Josué ergueu no próprio Jordão.
  alternative: Entender o versículo como resumo das pedras retiradas do Jordão e erguidas em outro lugar, ou harmonizar os dois relatos por emenda.
  rationale: O texto hebraico afirma diretamente que Josué ergueu doze pedras “no meio do Jordão”. A tradução preserva essa afirmação e não elimina a tensão narrativa por harmonização.
- issue: Valor temporal da fórmula memorial עַד הַיּוֹם הַזֶּה
  choice: 'Apresentar a permanência das pedras como vigente até o tempo do narrador: “permanecem ali até o dia de hoje”.'
  alternative: “ficaram ali até o dia de hoje”
  rationale: A escolha comunica o estado continuado visto da perspectiva temporal do narrador, sem transferi-lo indevidamente para os leitores atuais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Arca da aliança” conserva a terminologia bíblica corrente; “no meio do Jordão” mantém a localização explícita e evita harmonizar o versículo com o memorial de Gilgal.
