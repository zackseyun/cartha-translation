revisions:
- from: Quando os sacerdotes que carregavam a arca da aliança de Yahweh subiram do meio do Jordão e as plantas dos pés deles alcançaram a terra seca, as águas do Jordão voltaram ao seu lugar e, como antes,[a] correram por todas as suas margens.
  to: E aconteceu que, quando os sacerdotes que carregavam a arca da aliança de Yahweh subiram do meio do Jordão e as plantas dos pés dos sacerdotes chegaram à terra seca, as águas do Jordão voltaram ao seu lugar e correram, como antes,[a] sobre todas as suas margens.
  rationale: A revisão restaura a introdução narrativa explícita do hebraico, ajusta a saída dos pés dos sacerdotes para uma formulação portuguesa natural e mais próxima de נִתְּקוּ, e traduz עַל com “sobre”, preservando a imagem de as águas voltarem a cobrir todas as margens. A nota mantém a ambiguidade idiomática sem acrescentar a noção de costume regular.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:07:24Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva o encadeamento principal, o nome Yahweh e o retorno das águas, mas omite a moldura narrativa וַיְהִי (“E aconteceu que”) e suaviza demais נִתְּקוּ com “alcançaram”. Além disso, “por todas as suas margens” não reproduz adequadamente עַל (“sobre”).
  naturalness: O português é claro e contemporâneo. “E aconteceu que” é uma fórmula narrativa um pouco marcada, mas é aceitável neste registro bíblico e preserva uma informação explícita do hebraico. “Chegaram à terra seca” é natural no contexto.
  terminology: “Arca da aliança de Yahweh”, “Jordão”, “terra seca” e “plantas dos pés” são apropriados. A nota deve restringir a explicação do idiomatismo a “como antes/anteriormente”; “como de costume” pode sugerir habitualidade que o hebraico não exige.
  issues:
  - severity: medium
    issue: A moldura narrativa וַיְהִי não é traduzida.
    rationale: “Quando” transmite apenas a circunstância temporal de בַּעֲלוֹת; o wayyiqtol inicial introduz o acontecimento narrado e deve ser representado, sem necessidade de arcaísmo excessivo.
  - severity: medium
    issue: “Alcançaram a terra seca” enfraquece נִתְּקוּ.
    rationale: O verbo descreve as plantas dos pés sendo retiradas/erguidas para a terra seca, não meramente alcançando-a. “Chegaram à terra seca” mantém uma formulação portuguesa fluente e exprime melhor a saída da água.
  - severity: medium
    issue: “Por todas as suas margens” altera a relação espacial de עַל כָּל גְּדוֹתָיו.
    rationale: O hebraico diz que as águas foram “sobre todas as suas margens”, isto é, voltaram a cobri-las/transbordá-las como antes, e não simplesmente correram ao longo delas.
  revised_text: E aconteceu que, quando os sacerdotes que carregavam a arca da aliança de Yahweh subiram do meio do Jordão e as plantas dos pés dos sacerdotes chegaram à terra seca, as águas do Jordão voltaram ao seu lugar e correram, como antes,[a] sobre todas as suas margens.
  revised_footnotes:
