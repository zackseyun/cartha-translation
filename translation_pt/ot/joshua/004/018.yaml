  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: pt
  text: E aconteceu que, quando os sacerdotes que carregavam a arca da aliança de Yahweh subiram do meio do Jordão e as plantas dos pés dos sacerdotes chegaram à terra seca, as águas do Jordão voltaram ao seu lugar e correram, como antes,[a] sobre todas as suas margens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “como ontem e anteontem”, expressão hebraica que significa “como antes” ou “anteriormente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: Quando ... subiram
  rationale: A construção narrativa introduz a circunstância temporal; em português, a oração com “quando” comunica o fluxo do hebraico de forma natural, sem a fórmula pesada “E aconteceu que”.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: que carregavam a arca da aliança de Yahweh
  rationale: “Carregavam” é corrente e preciso para o particípio; a cadeia construta é preservada com clareza, e o nome divino é transliterado como Yahweh.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: do meio do Jordão
  rationale: Mantém a ideia de saída do interior ou leito do rio, não apenas de sua margem.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: as plantas dos pés deles alcançaram a terra seca
  rationale: O verbo indica que os pés foram retirados do leito e chegaram ao seco. “Alcançaram” expressa naturalmente o movimento em português sem sugerir que os pés foram literalmente destacados.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: as águas do Jordão voltaram ao seu lugar
  rationale: Tradução direta que conserva a imagem das águas retornando ao lugar habitual.
- source_word: וַיֵּלְכוּ
  choice: correram
  rationale: No contexto de águas fluviais, “correram” é o equivalente idiomático de הלך e evita o pouco natural “foram”.
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: como antes
  rationale: Expressa em português natural o idiomatismo hebraico literalmente relacionado a “ontem e anteontem”.
- source_word: עַל כָּל גְּדוֹתָיו
  choice: por todas as suas margens
  rationale: Preserva a imagem de o Jordão voltar a correr sobre ou ao longo de toda a extensão de suas margens.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” o representa diretamente, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática fluente. Evitou-se a fórmula arcaizante “E aconteceu que”; o marcador de nota [a] foi colocado imediatamente após a expressão explicada.
