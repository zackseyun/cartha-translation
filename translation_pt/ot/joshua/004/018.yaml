    text: Literalmente, “como ontem e anteontem”, expressão hebraica que significa “como antes” ou “anteriormente”.
    reason: lexical_alternative
  revision_rationale: A revisão restaura a introdução narrativa explícita do hebraico, ajusta a saída dos pés dos sacerdotes para uma formulação portuguesa natural e mais próxima de נִתְּקוּ, e traduz עַל com “sobre”, preservando a imagem de as águas voltarem a cobrir todas as margens. A nota mantém a ambiguidade idiomática sem acrescentar a noção de costume regular.
