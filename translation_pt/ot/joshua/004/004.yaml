base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/004.yaml
  text: So Joshua called the twelve men whom he had appointed from the sons of Israel[b][a], one man from each tribe.
translation:
  language: pt
  text: Então Josué chamou os doze homens que havia designado dentre os filhos de Israel[a], um homem de cada tribo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dentre os israelitas”. O hebraico diz literalmente “dentre os filhos de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O wayyiqtol de קרא apresenta a ação de Josué de chamar os homens escolhidos para junto de si. “Chamou” é natural e não acrescenta a força de uma convocação formal.
- source_word: אֶל
  choice: incorporado em “chamou”
  rationale: A preposição significa literalmente “a/para”, mas, na construção קרא אל, sua relação é expressa naturalmente em português pelo verbo “chamar”, sem tradução separada.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: os doze homens
  rationale: O artigo e o contexto apontam para o grupo definido de doze homens já mencionado.
- source_word: אֲשֶׁר הֵכִין
  choice: que havia designado
  rationale: הכין pode significar preparar, deixar pronto ou designar. Aqui se refere aos representantes previamente escolhidos; “designado” comunica isso sem sugerir uma nomeação institucional específica.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dentre os filhos de Israel
  rationale: Preserva a forma concreta do hebraico e indica seleção no interior do povo; a nota registra a alternativa idiomática “dentre os israelitas”.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: um homem de cada tribo
  rationale: A repetição distributiva hebraica é expressa de modo claro e idiomático em português, preservando tanto o sexo dos representantes quanto sua distribuição tribal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Então” dá continuidade narrativa; “dentre” expressa com precisão a escolha feita no interior do grupo. A ordem da frase acompanha o hebraico sem produzir construção artificial.
