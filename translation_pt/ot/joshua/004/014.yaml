id: JOS.4.14
reference: Joshua 4:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: pt
  text: Naquele dia, Yahweh engrandeceu Josué aos olhos de todo o Israel, e eles o temeram[a], assim como haviam temido Moisés durante todos os dias da vida dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reverenciaram” ou “ficaram cheios de respeito por ele”; o verbo hebraico pode indicar temor, assombro respeitoso ou reverência, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressa de modo natural em português a referência temporal narrativa marcada por בְּ.
- source_word: גִּדַּל
  choice: engrandeceu
  rationale: 'Preserva o sentido causativo/intensivo do Piel: Yahweh fez com que Josué fosse reconhecido como grande, sem reduzir a ação a mera fama.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: aos olhos de todo o Israel
  rationale: Mantém a imagem hebraica e comunica naturalmente a estima ou percepção pública.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: e eles o temeram
  rationale: Preserva a amplitude de ירא e o paralelo lexical com a atitude de Israel para com Moisés; a nota registra as nuances de reverência e assombro respeitoso.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Marca de forma clara e natural a comparação estreita entre Josué e Moisés.
- source_word: יָרְאוּ אֶת מֹשֶׁה
  choice: haviam temido Moisés
  rationale: O mais-que-perfeito torna explícita em português a anterioridade da experiência sob Moisés, adequada ao contexto narrativo.
- source_word: כָּל יְמֵי חַיָּיו
  choice: durante todos os dias da vida dele
  rationale: Preserva a extensão total e a cadência da expressão hebraica; no contexto, o pronome se refere naturalmente a Moisés.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; a transliteração preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Nuance de ירא em relação a Josué
  choice: o temeram
  alternative: o reverenciaram / ficaram cheios de respeito por ele
  rationale: “Temeram” conserva a força e a continuidade literária do verbo usado no paralelo com Moisés, sem decidir de forma estreita entre medo, reverência e assombro respeitoso.
- issue: Referente do sufixo em חַיָּיו
  choice: Moisés
  alternative: Josué
  rationale: 'A sintaxe e o sentido da comparação apontam naturalmente para Moisés: Israel temeu Josué como havia temido Moisés durante a vida deste.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Engrandeceu” mantém a concisão e a força causativa do hebraico; “da vida dele” evita possível ambiguidade gramatical de “sua vida”.
