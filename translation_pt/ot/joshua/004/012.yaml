base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: pt
  text: Os filhos de Rúben[a], os filhos de Gade e a meia tribo de Manassés atravessaram armados[c] à frente dos filhos de Israel[b], exatamente como Moisés havia falado com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os rubenitas, os gaditas e a meia tribo de Manassés”. O hebraico diz mais literalmente “os filhos de Rúben... os filhos de Gade...”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os israelitas”. O hebraico diz mais literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: c
    text: “Armados” traduz um termo hebraico que pode indicar pessoas equipadas ou dispostas para a batalha; também se propõe uma tradução mais literal como “organizados em fileiras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: atravessaram
  rationale: No contexto narrativo, עבר descreve a travessia do Jordão; “atravessaram” é natural e mantém esse sentido direcional.
- source_word: בְּנֵי רְאוּבֵן ... וּבְנֵי גָד
  choice: os filhos de Rúben ... os filhos de Gade
  rationale: Preserva de modo transparente a expressão hebraica de parentesco, enquanto a nota registra a alternativa portuguesa mais idiomática.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: a meia tribo de Manassés
  rationale: Forma clara e corrente em português para a cadeia construta hebraica.
- source_word: חֲמֻשִׁים
  choice: armados
  rationale: Neste contexto, o termo indica preparo ou equipamento para combate. “Armados” é conciso e natural, sem excluir em nota a possível ideia de disposição militar.
- source_word: לִפְנֵי
  choice: à frente de
  rationale: Expressa claramente a posição desses grupos diante do restante de Israel durante a travessia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a formulação literal do hebraico; “os israelitas” é oferecido como alternativa idiomática.
- source_word: כַּאֲשֶׁר
  choice: exatamente como
  rationale: Comunica a conformidade entre a ação e a instrução anterior de Moisés.
- source_word: דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: Moisés lhes havia dito
  rationale: O mais-que-perfeito composto torna clara a anterioridade da fala de Moisés. “Dito” é português natural e não força a tradução explícita como ordem.
