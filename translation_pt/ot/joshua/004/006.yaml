  text: לְמַ֗עַן תִּֽהְיֶ֛ה זֹ֥את א֖וֹת בְּ/קִרְבְּ/כֶ֑ם כִּֽי יִשְׁאָל֨וּ/ן בְּנֵי/כֶ֤ם מָחָר֙ לֵ/אמֹ֔ר מָ֛ה הָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/006.yaml
  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: pt
  text: 'para que isto seja um sinal no meio de vocês. Quando, no futuro[a], seus filhos perguntarem: “O que estas pedras significam para vocês?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “amanhã”; aqui, a palavra pode significar “mais tarde” ou “no futuro”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “O que são estas pedras para vocês?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade da colocação das pedras e preserva de modo natural a força intencional da expressão hebraica.
- source_word: תִּהְיֶה זֹאת אוֹת
  choice: isto seja um sinal
  rationale: Mantém a construção de finalidade e traduz אוֹת diretamente como “sinal”, sem acrescentar ao substantivo a função memorial explicitada pelo contexto.
- source_word: בְּקִרְבְּכֶם
  choice: no meio de vocês
  rationale: Expressa a presença do sinal dentro da comunidade com linguagem clara e corrente.
- source_word: כִּי יִשְׁאָלוּן
  choice: Quando ... perguntarem
  rationale: Neste contexto, כִּי introduz a circunstância futura em que o sinal provocará uma pergunta.
- source_word: בְּנֵיכֶם
  choice: seus filhos
  rationale: É a correspondência direta do masculino plural hebraico e, no contexto, pode designar representativamente a geração seguinte.
- source_word: מָחָר
  choice: no futuro
  rationale: Embora o sentido literal seja “amanhã”, aqui o termo aponta idiomaticamente para um tempo posterior, quando a geração seguinte perguntar sobre as pedras.
- source_word: לֵאמֹר
  choice: 'perguntarem:'
  rationale: O infinitivo quotativo introduz o conteúdo da pergunta; em português, os dois-pontos fazem isso naturalmente, sem exigir o redundante “dizendo”.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: O que estas pedras significam para vocês?
  rationale: Comunica em português idiomático a pergunta pela significação das pedras, preservando em nota a formulação hebraica mais literal.
theological_decisions:
- issue: Alcance de בְּנֵיכֶם
  choice: seus filhos
  alternative: seus descendentes; suas crianças
  rationale: “Filhos” preserva a forma do hebraico e pode incluir representativamente a geração seguinte, sem restringir indevidamente a pergunta apenas a meninos nem ampliar o termo de modo desnecessário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A divisão em duas frases favorece a naturalidade. O tratamento “vocês” corresponde ao plural comunitário do hebraico.
