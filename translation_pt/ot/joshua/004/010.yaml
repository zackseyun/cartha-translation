  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: pt
  text: Os sacerdotes que levavam a arca estavam de pé no meio do Jordão, até que se completasse tudo o que Yahweh havia ordenado a Josué que falasse ao povo[a], conforme tudo o que Moisés havia ordenado a Josué. E o povo se apressou e atravessou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «até que se completasse toda a questão»; «questão» também pode ser entendido como «assunto» ou «palavra». A expressão resume a conclusão de tudo o que Yahweh havia ordenado a Josué que dissesse ao povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  choice: Os sacerdotes que carregavam a arca
  rationale: A construção participial identifica os sacerdotes por sua ação contínua; «que carregavam» é natural em português moderno e preserva o aspecto durativo.
- source_word: עֹמְדִים בְּתוֹךְ הַיַּרְדֵּן
  choice: permaneceram no meio do Jordão
  rationale: O particípio עֹמְדִים descreve postura ou permanência contínua. «Permaneceram» comunica que eles continuaram naquele lugar, enquanto «no meio do Jordão» preserva o sentido espacial de בְּתוֹךְ.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: até que se cumprisse tudo
  rationale: A expressão significa literalmente «até se completar toda a palavra/matéria». A formulação escolhida comunica a conclusão integral do que fora ordenado sem restringir indevidamente דָּבָר a fala ou ação.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יְהוֹשֻׁעַ לְדַבֵּר אֶל הָעָם
  choice: o que Yahweh havia ordenado a Josué que dissesse ao povo
  rationale: «Dissesse ao povo» expressa naturalmente em português o complemento de «ordenar», mantendo o ato verbal indicado por לְדַבֵּר אֶל.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: conforme tudo o que Moisés havia ordenado a Josué
  rationale: כְּכֹל indica conformidade abrangente. O mais-que-perfeito composto deixa clara a anterioridade da ordem de Moisés.
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: E o povo se apressou e atravessou
  rationale: A tradução preserva tanto a pressa indicada por מהר quanto o movimento de travessia expresso por עבר, com redação corrente e digna.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. «Yahweh» translitera o nome da aliança sem substituí-lo por um título.
- issue: Alcance de עַד תֹּם כָּל הַדָּבָר
  choice: até que se cumprisse tudo
  alternative: até que toda a palavra estivesse terminada; até que todo o assunto estivesse concluído
  rationale: A expressão pode abranger o conjunto da palavra, assunto ou procedimento ordenado. A tradução mantém essa amplitude, e a nota registra a forma mais literal sem decidir além do texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem narrativa e a continuidade da permanência dos sacerdotes foram preservadas sem rigidez sintática.
