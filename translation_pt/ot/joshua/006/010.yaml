base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: pt
  text: 'Josué ordenou ao povo: “Não gritem[a], nem façam ouvir a voz de vocês; não saia palavra alguma da boca de vocês[b] até o dia em que eu lhes disser: ‘Gritem!’ Então vocês gritarão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais especificamente no contexto: “Não deem um grito de guerra” ou “Não deem um brado de combate”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e não saia da boca de vocês palavra alguma”.'
    reason: literal_rendering
lexical_decisions:
- source_word: צִוָּה
  choice: ordenou
  rationale: Expressa uma ordem revestida de autoridade, não uma simples instrução.
- source_word: הָעָם
  choice: o povo
  rationale: Preserva o sentido comum do termo hebraico sem restringi-lo a tropas ou exército, embora o contexto seja militar.
- source_word: לֹא תָרִיעוּ
  choice: Não deem o grito de guerra
  rationale: O hifil de רוע designa aqui um brado forte, provavelmente militar; a formulação torna o contexto claro sem perder a ideia de grito.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: nem façam ouvir a sua voz
  rationale: Reproduz de modo natural a construção causativa hebraica, literalmente fazer a voz ser ouvida.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: não saia palavra alguma da boca de vocês
  rationale: Mantém a imagem hebraica de uma palavra saindo da boca e soa clara em português moderno.
- source_word: עַד יוֹם
  choice: até o dia
  rationale: Conserva a expressão temporal concreta do hebraico.
- source_word: אָמְרִי אֲלֵיכֶם
  choice: eu lhes disser
  rationale: Traduz idiomaticamente a construção temporal com o infinitivo e sufixo de primeira pessoa.
- source_word: הָרִיעוּ
  choice: Deem o grito!
  rationale: Retoma o mesmo verbo da proibição inicial e conserva seu provável matiz de brado coletivo.
- source_word: וַהֲרִיעֹתֶם
  choice: Então vocês gritarão
  rationale: O então comunica a consequência e a sequência; gritarão evita uma repetição pesada, preservando o vínculo semântico.
