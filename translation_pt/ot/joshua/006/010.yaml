translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala direta mantém o tom firme da ordem. Emprega-se “vocês” para o plural explícito e “lhes” como objeto indireto natural. A primeira nota preserva a amplitude lexical de רוע, embora o texto principal explicite o provável contexto militar.
