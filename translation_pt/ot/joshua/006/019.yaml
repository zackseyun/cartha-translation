base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: pt
  text: Mas toda a prata e todo o ouro, bem como os objetos de bronze e de ferro, são consagrados a Yahweh[a]; entrarão no tesouro de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico emprega o singular — literalmente, “é consagrado” e “entrará” — tratando todos os metais e objetos como um só conjunto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Mas toda
  rationale: A conjunção liga o versículo à proibição anterior e, no contexto, tem força adversativa; “mas” expressa isso naturalmente. כֹּל é traduzido por “toda” e repetido antes de “ouro” para dar fluidez em português.
- source_word: כֶּסֶף וְ/זָהָב
  choice: a prata e todo o ouro
  rationale: Os termos designam os metais, não dinheiro; a formulação distingue com clareza os dois elementos coordenados.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: bem como os objetos de bronze e de ferro
  rationale: כְּלִי é um termo amplo para objetos, utensílios ou recipientes. “Objetos” evita restringir indevidamente a forma ou função. נְחֹשֶׁת é vertido por “bronze”, uso tradicional e provável neste contexto material.
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: são consagrados a Yahweh
  rationale: A expressão indica que o conjunto pertence à esfera sagrada e foi separado para Yahweh. O plural é natural em português diante da lista, embora o hebraico trate tudo coletivamente no singular.
- source_word: אוֹצַר יְהוָה
  choice: o tesouro de Yahweh
  rationale: אוֹצָר pode indicar tesouro, depósito ou tesouraria; neste contexto, “tesouro” comunica de modo claro o lugar ou acervo destinado aos metais consagrados.
- source_word: יָבֽוֹא
  choice: irão para
  rationale: O verbo hebraico está no singular porque trata a lista como um conjunto. O plural concorda naturalmente com os itens em português, sem introduzir a voz passiva não expressa no texto.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio e o distingue de um título.
- issue: Sentido de קֹדֶשׁ na dedicação dos metais
  choice: consagrados a Yahweh
  alternative: santos para Yahweh
  rationale: “Consagrados” comunica em português corrente que os itens foram separados para uso ou posse sagrada, sem sugerir uma qualidade moral inerente aos metais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Objetos” preserva a amplitude de כְּלִי; “consagrados” transmite a função de קֹדֶשׁ no contexto. O marcador [a] aparece no texto principal.
