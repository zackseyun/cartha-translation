source:
  edition: WLC
  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: pt
  text: 'Então Josué, filho de Num, chamou os sacerdotes e lhes disse: “Levem a arca da aliança, e sete sacerdotes levem sete trombetas de chifre de carneiro[a] diante da arca de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sete trombetas de chifres de carneiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: chamou
  rationale: O qal wayyiqtol de קרא introduz Josué dirigindo-se aos sacerdotes. “Chamou” é natural e não acrescenta a força de convocação formal que “convocou” poderia sugerir.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes em português, com a relação filial expressa de modo natural.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente corrente e preciso de כֹּהֵן neste contexto cultual.
- source_word: שְׂאוּ
  choice: Levem
  rationale: O imperativo de נשׂא pode significar levantar, tomar ou carregar. No contexto do transporte da arca, “levem” comunica com naturalidade tanto a tomada quanto a condução dela.
- source_word: אֲרוֹן הַבְּרִית
  choice: a arca da aliança
  rationale: Tradução consagrada, clara e fiel da construção hebraica.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: e sete sacerdotes levem
  rationale: O imperfeito após o imperativo tem força instrutiva. O presente do subjuntivo preserva essa função diretiva, em vez de apresentá-la como simples previsão futura.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: sete trombetas de chifre de carneiro
  rationale: שׁוֹפָר designa uma trombeta de chifre, e יוֹבְלִים especifica aqui sua associação com chifres de carneiro, não o sentido técnico posterior de “jubileu”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa adequadamente a posição dos sacerdotes à frente da arca na procissão.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: A construção vincula diretamente a arca ao nome divino יהוה; “Yahweh” preserva o caráter próprio do nome em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” representa o nome próprio e evita transformá-lo no título “SENHOR”; “Jeová” reflete uma forma tradicional posterior.
- issue: Força verbal de יִשְׂאוּ após o imperativo
  choice: 'instrução: “levem”'
  alternative: 'futuro: “levarão”'
  rationale: A sequência no discurso direto favorece uma ordem ou instrução coordenada com “Levem”, embora a forma hebraica seja formalmente um imperfeito e possa ser vertida de maneira mais literal como futuro.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. Mantém a repetição de “levem”, que reflete a mudança do imperativo plural para a instrução dirigida aos sete sacerdotes, e usa “Yahweh” como nome próprio.
