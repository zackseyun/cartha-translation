base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: pt
  text: Josué, porém, manteve viva Raabe, a prostituta[a], bem como a família de seu pai e tudo o que lhe pertencia. E ela vive no meio de Israel até o dia de hoje, porque escondeu os mensageiros[b] que Josué enviou para espionar Jericó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a meretriz”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “mensageiros”; isto é, os homens enviados por Josué para espionar Jericó.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: a prostituta
  rationale: זוֹנָה designa uma mulher que exerce prostituição. “Prostituta” é claro, atual e direto; “meretriz” é uma alternativa mais tradicional, porém menos corrente.
- source_word: בֵּית אָבִיהָ
  choice: a família de seu pai
  rationale: A expressão literalmente significa “casa de seu pai”, mas aqui se refere ao grupo familiar ou doméstico, não apenas ao edifício.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: tudo o que lhe pertencia
  rationale: Mantém a abrangência da expressão hebraica, que pode incluir bens e pessoas ligadas a Raabe, sem restringi-la indevidamente.
- source_word: הֶחֱיָה
  choice: manteve viva
  rationale: Preserva o valor causativo do hifil de חיה e forma, em português natural, um contraste implícito com a destruição dos demais habitantes.
- source_word: וַתֵּשֶׁב
  choice: ela vive
  rationale: Com “até o dia de hoje”, descreve uma situação iniciada no passado e ainda vigente no tempo do narrador. O presente é natural em português nesse contexto.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: no meio de Israel
  rationale: Reproduz de perto o idioma hebraico e conserva a afirmação de que Raabe passou a viver dentro da comunidade de Israel.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente português corrente da fórmula hebraica que assinala continuidade até o tempo do narrador.
- source_word: הֶחְבִּיאָה
  choice: escondeu
  rationale: Tradução direta e idiomática do verbo no contexto.
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: Preserva o termo amplo empregado pelo hebraico; a oração seguinte esclarece que sua missão era espionar Jericó.
- source_word: לְרַגֵּל
  choice: para espionar
  rationale: Expressa com clareza a missão de reconhecimento secreto indicada pelo verbo רגל.
theological_decisions:
- issue: Incorporação narrativa de Raabe a Israel
  choice: ela vive no meio de Israel até o dia de hoje
  alternative: ela passou a morar entre os israelitas
  rationale: A formulação mantém a afirmação do texto sobre a residência contínua de Raabe dentro de Israel, sem acrescentar conclusões posteriores sobre seu estatuto religioso ou pactual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Porém” preserva o contraste inicial; a divisão em duas frases melhora a fluidez sem alterar a relação narrativa e causal do hebraico.
