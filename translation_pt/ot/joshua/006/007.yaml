  text: ו/יאמרו אֶל הָ/עָ֔ם עִבְר֖וּ וְ/סֹ֣בּוּ אֶת הָ/עִ֑יר וְ/הֶ֣/חָל֔וּץ יַעֲבֹ֕ר לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: pt
  text: 'E disseram ao povo: “Avancem e contornem a cidade; e os homens armados[a] passem diante da arca de Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a vanguarda”, isto é, os homens armados que passam à frente da arca.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: E disseram
  rationale: O wayyiqtol plural de אמר dá continuidade à sequência narrativa. A tradução mantém o sujeito plural expresso na fonte fornecida sem tentar identificá-lo.
- source_word: אֶל־הָעָם
  choice: ao povo
  rationale: עָם significa normalmente “povo”. Embora o contexto seja militar, não há necessidade de restringir o termo a “tropas” ou “exército”.
- source_word: עִבְרוּ
  choice: Avancem
  rationale: Aqui עבר ordena que o grupo prossiga no cortejo, e não que atravesse um rio ou outro limite. “Avancem” comunica essa ação com naturalidade em português.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: e deem a volta na cidade
  rationale: סבב descreve o movimento ao redor da cidade. A formulação é corrente e não acrescenta uma nuance militar além do texto.
- source_word: וְהֶחָלוּץ
  choice: os homens armados
  rationale: חָלוּץ designa os preparados ou equipados para a batalha, neste contexto o contingente que segue à frente. A alternativa funcional “a vanguarda” é preservada em nota.
- source_word: יַעֲבֹר
  choice: que ... passem
  rationale: O imperfeito tem força instrucional ou jussiva depois dos imperativos. A construção com “que” expressa naturalmente essa ordem em português.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: diante da arca de Yahweh
  rationale: לִפְנֵי indica posição à frente da arca. “Diante de” é uma formulação clara e digna em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O nome divino é transliterado, preservando o nome pessoal presente no texto hebraico em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o nome divino e corresponde melhor à forma hebraica do que a alternativa tradicional “Jeová”.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais amplamente compreensíveis no Brasil e em outros contextos lusófonos. O marcador da nota foi colocado junto a “homens armados”, expressão à qual a alternativa lexical se refere.
