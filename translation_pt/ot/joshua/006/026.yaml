  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: pt
  text: 'Naquele tempo, Josué fez o povo jurar[a], dizendo: “Maldito diante de Yahweh seja o homem[b] que se levantar e reconstruir esta cidade, Jericó! Ao custo de seu primogênito lançará os alicerces dela e, ao custo de seu filho mais novo, instalará os portões dela.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pôs o povo sob juramento”. O verbo hebraico está na forma causativa: Josué fez outros jurarem.'
    reason: lexical_alternative
  - marker: b
    text: “O homem” está no masculino singular em hebraico, mas pode referir-se genericamente a qualquer pessoa que reconstruísse a cidade.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “com seu primogênito... e com seu mais novo”. No contexto, a expressão provavelmente indica uma perda ou custo grave ligado à obra, sem especificar seu mecanismo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: fez o povo jurar
  rationale: 'O hifil de שׁבע é causativo: Josué levou outros a jurar ou os pôs sob juramento. O objeto, implícito no hebraico, é explicitado como “o povo” a partir do contexto.'
- source_word: בָּעֵת הַהִיא
  choice: Naquele tempo
  rationale: Expressão temporal corrente, natural e digna em português.
- source_word: אָרוּר הָאִישׁ לִפְנֵי יְהוָה
  choice: Maldito diante de Yahweh seja o homem
  rationale: Mantém a fórmula solene de maldição, a referência masculina singular do hebraico e o sentido de estar perante Yahweh.
- source_word: יָקוּם וּבָנָה
  choice: se levantar e reconstruir
  rationale: Preserva os dois verbos e torna explícito, pelo contexto da destruição de Jericó, que se trata de reconstrução.
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: ao custo de seu primogênito ... ao custo de seu filho mais novo
  rationale: A preposição בְּ provavelmente exprime aqui o preço ou a perda ligada à obra. “Ao custo de” comunica isso sem determinar o mecanismo da morte; “filho” é explicitado no segundo membro para clareza do paralelismo familiar.
- source_word: יְיַסְּדֶנָּה
  choice: lançará os alicerces dela
  rationale: Expressa concretamente o ato de fundar a cidade e conserva o referente feminino do sufixo.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: instalará os portões dela
  rationale: No contexto de uma cidade fortificada, דְּלָתוֹת designa os portões ou suas folhas; “instalará os portões” é claro e natural.
theological_decisions:
- issue: Natureza da declaração de Josué
  choice: Uma fórmula solene de maldição pronunciada diante de Yahweh
  alternative: Um simples desejo pessoal de Josué ou uma proibição meramente civil
  rationale: A expressão “maldito diante de Yahweh” confere peso religioso e judicial à declaração, sem exigir explicações teológicas adicionais.
- issue: Sentido da perda dos filhos durante a reconstrução
  choice: A reconstrução custará ao responsável seu primogênito e seu filho mais novo
  alternative: Os filhos seriam necessariamente oferecidos em sacrifício, ou haveria apenas algum infortúnio indefinido
  rationale: O texto associa a perda aos marcos inicial e final da obra, mas não especifica o mecanismo. “Ao custo de” preserva essa ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é solene sem arcaísmos. O nome divino é transliterado como “Yahweh”, em conformidade com a decisão lexical fornecida. As notas registram tanto a causatividade do juramento quanto a expressão hebraica ambígua referente aos filhos.
