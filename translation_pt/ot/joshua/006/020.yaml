base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: pt
  text: Então o povo gritou, e tocaram as trombetas[b]. Quando o povo ouviu o som da trombeta, soltou um grande grito, e a muralha desabou no próprio lugar[a]. O povo subiu para dentro da cidade, cada homem diretamente à sua frente, e capturou a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, literalmente: “a muralha caiu debaixo de si mesma”, expressão incomum que talvez descreva a muralha desabando verticalmente. Outra tradução possível é “a muralha caiu rente ao chão”.'
    reason: lexical_alternative
  - marker: b
    text: “Trombeta” traduz o hebraico shofar, um chifre usado como instrumento de sinalização; “chifre de carneiro” é uma tradução mais específica possível.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: gritou / soltou um grande grito
  rationale: A raiz רוע e o substantivo תְּרוּעָה indicam um grito forte, muitas vezes ligado à guerra ou ao culto. A tradução mantém a repetição lexical sem especificar além do texto que se tratava de um grito de guerra.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: trombetas / trombeta
  rationale: שׁוֹפָר designa um instrumento de sopro feito de chifre e usado para sinalização. “Trombeta” é corrente e clara; a natureza do instrumento é esclarecida em nota.
- source_word: קוֹל הַשּׁוֹפָר
  choice: o som da trombeta
  rationale: קוֹל significa “voz” ou “som”; com um instrumento, “som” é a expressão natural em português e não acrescenta a ideia interpretativa de um toque específico.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: a muralha desabou no próprio lugar
  rationale: A expressão hebraica é incomum e literalmente indica que a muralha caiu “debaixo de si mesma”. “Desabou no próprio lugar” comunica uma queda vertical sem produzir uma formulação ininteligível; a dificuldade literal e outra tradução possível são preservadas em nota.
- source_word: וַיַּעַל ... הָעִירָה
  choice: subiu para dentro da cidade
  rationale: עלה expressa subida, enquanto o sufixo direcional em הָעִירָה indica movimento rumo à cidade e, no contexto, para dentro dela.
- source_word: אִישׁ נֶגְדּוֹ
  choice: cada homem diretamente à sua frente
  rationale: אִישׁ é masculino singular com sentido distributivo, e נֶגְדּוֹ indica a direção imediatamente diante de cada homem. A formulação preserva tanto o gênero quanto o avanço direto desde a posição de cada um.
- source_word: וַיִּלְכְּדוּ
  choice: capturou
  rationale: לכד, em narrativa militar, significa tomar ou capturar uma cidade. A concordância no singular acompanha o substantivo coletivo “povo” em português.
theological_decisions:
- issue: Expressão distributiva masculina אִישׁ נֶגְדּוֹ
  choice: cada homem diretamente à sua frente
  alternative: cada um diretamente à sua frente
  rationale: O texto hebraico emprega explicitamente אִישׁ, “homem”, no singular distributivo. A tradução conserva essa forma masculina sem generalizá-la silenciosamente.
- issue: Modo da queda da muralha
  choice: desabou no próprio lugar
  alternative: caiu por baixo de si mesma / caiu rente ao chão
  rationale: A construção תַּחְתֶּיהָ é difícil e admite mais de uma compreensão da maneira exata da queda. O texto principal evita impor uma reconstrução específica, e a nota conserva a formulação literal e a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a cadência narrativa e a repetição de “povo”, mas emprega-se concordância natural com o substantivo coletivo. A expressão difícil sobre a queda da muralha recebe uma tradução inteligível no texto e explicação literal em nota.
