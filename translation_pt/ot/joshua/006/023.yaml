  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: pt
  text: Então, os jovens espiões entraram e tiraram Raabe, seu pai, sua mãe, seus irmãos e tudo o que lhe pertencia[a]. Também tiraram todas as suas famílias[b] e os colocaram fora do acampamento de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os que lhe pertenciam”. A expressão hebraica é ampla e pode incluir tanto pessoas quanto bens, embora o contexto destaque os membros da casa de Raabe.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os seus clãs” ou “todos os seus parentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: os jovens
  rationale: נַעַר designa com frequência um jovem do sexo masculino. Aqui se refere aos dois espiões; “os jovens” é natural e evita introduzir a ideia de servos.
- source_word: הַמְרַגְּלִים
  choice: os espiões
  rationale: O particípio substantivado identifica diretamente os jovens. A aposição preserva a forma concisa do hebraico sem acrescentar um objeto como “a terra”, que não aparece neste versículo.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: tiraram
  rationale: No hifil, יצא significa fazer sair ou tirar. A repetição de “tiraram” conserva a repetição enfática do verbo hebraico e soa natural no contexto do resgate.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: tudo o que lhe pertencia
  rationale: A expressão é deliberadamente ampla e pode abranger pessoas e bens. Esta formulação preserva essa amplitude, em vez de restringi-la silenciosamente aos membros da casa.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: todas as famílias dela
  rationale: מִשְׁפָּחָה pode indicar família extensa, grupo familiar ou clã. “Famílias” mantém o plural do texto e é compreensível em português moderno; a nota registra alternativas mais específicas.
- source_word: וַיַּנִּיחוּם
  choice: os colocaram
  rationale: O hifil de נוח pode significar colocar, deixar ou instalar. “Colocaram” expressa a localização deliberada sem atribuir ao ato um motivo que o texto não declara.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: fora do acampamento de Israel
  rationale: A tradução reproduz a afirmação espacial simples e não explica por que o grupo foi mantido fora do acampamento.
theological_decisions:
- issue: Motivo de Raabe e seus familiares serem colocados fora do acampamento
  choice: Manter apenas a informação espacial, sem explicar o motivo.
  alternative: Explicitar separação ritual temporária, custódia protetora ou espera antes da incorporação a Israel.
  rationale: O hebraico não informa a razão. Acrescentar uma explicação resolveria indevidamente uma tensão narrativa e teológica que o versículo deixa aberta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A aposição “os jovens, os espiões” segue de perto a sintaxe hebraica. “O pai dela” evita a possível leitura momentânea de que se trata do pai do narrador, e os demais termos coordenados recuperam naturalmente a mesma relação possessiva.
