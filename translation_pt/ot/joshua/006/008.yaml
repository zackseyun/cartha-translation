reference: Joshua 6:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: pt
  text: E aconteceu que, quando Josué falou ao povo, os sete sacerdotes que levavam as sete trombetas de chifre de carneiro[a] diante de Yahweh[b] avançaram e tocaram as trombetas, e a arca da aliança de Yahweh seguia atrás deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «as sete trombetas do yobel». A expressão provavelmente se refere a trombetas de chifre de carneiro, embora «trombetas do jubileu» seja uma tradução possível, mas menos provável neste contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «na presença de Yahweh».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Mantém o marcador narrativo hebraico e introduz naturalmente o acontecimento seguinte, sem recorrer à fórmula arcaica «e sucedeu».
- source_word: כֶּאֱמֹר יְהוֹשֻׁעַ אֶל הָעָם
  choice: quando Josué falou ao povo
  rationale: A preposição כ com o infinitivo construto tem valor temporal, «quando/assim que». O pretérito perfeito é direto e natural em português.
- source_word: נֹשְׂאִים
  choice: que levavam
  rationale: O particípio caracteriza os sacerdotes como portadores das trombetas; «levavam» se ajusta ao movimento da procissão.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: as sete trombetas de chifre de carneiro
  rationale: שׁוֹפָר designa uma trombeta feita de chifre, e יוֹבֵל provavelmente indica aqui o carneiro ou seu chifre. A formulação comunica tanto o instrumento quanto sua origem material.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: Preserva o sentido espacial «diante de» e também admite a noção de estar na presença de Yahweh, representada na procissão pela arca.
- source_word: עָבְרוּ
  choice: avançaram
  rationale: No contexto da procissão, עבר descreve movimento para a frente, não necessariamente a travessia de um limite. «Avançaram» é claro e idiomático.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: e tocaram as trombetas
  rationale: תקע com שׁוֹפָר significa soprar ou fazer soar o instrumento. «Tocar as trombetas» é a expressão portuguesa corrente.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: a arca da aliança de Yahweh
  rationale: Reproduz com transparência a cadeia construta e conserva sua referência à aliança.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: seguia atrás deles
  rationale: O particípio הֹלֵךְ apresenta movimento contínuo, e אַחֲרֵיהֶם explicita a posição posterior na procissão. «Seguia atrás deles» preserva ambos os aspectos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. «Yahweh» preserva o nome pessoal da aliança em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem processional e o aspecto contínuo da ação final foram preservados. Os marcadores das notas foram colocados junto às expressões que explicam.
