lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: levantou-se cedo
  rationale: O hifil de שׁכם expressa levantar-se ou começar cedo; a formulação é natural em português e preserva a ênfase temporal.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Reproduz naturalmente a indicação temporal do hebraico e, com “cedo”, mantém sua ênfase na ação matinal.
- source_word: וַיִּשְׂאוּ
  choice: carregaram
  rationale: Neste contexto, נשׂא descreve o transporte da arca; “carregaram” é claro, atual e semanticamente adequado.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Correspondência direta e natural para o substantivo plural definido.
- source_word: אֲרוֹן יְהוָה
  choice: a arca de Yahweh
  rationale: Preserva a relação construta e apresenta יְהוָה como nome próprio, em conformidade com a decisão terminológica fornecida.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva seu caráter de nome pessoal e segue a orientação doutrinária fornecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação simples acompanha a sequência narrativa hebraica.
