source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: pt
  text: 'Na sétima vez, os sacerdotes tocaram as trombetas[a], e Josué disse ao povo: “Gritem, pois Yahweh lhes deu a cidade!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: shofarot, plural de shofar, um instrumento de sopro feito de chifre, tradicionalmente descrito como chifre de carneiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּפַּעַם הַשְּׁבִיעִית
  choice: Na sétima vez
  rationale: Expressa de modo natural a progressão narrativa e a sétima ocorrência indicada pelo hebraico, sem recorrer a uma fórmula arcaica.
- source_word: תָּקְעוּ
  choice: tocaram
  rationale: Com um instrumento de sopro, תקע descreve o ato de fazê-lo soar; “tocaram” é idiomático em português.
- source_word: שּׁוֹפָרוֹת
  choice: trombetas
  rationale: “Trombetas” comunica naturalmente a função dos instrumentos; uma nota preserva o termo hebraico mais específico e evita pressupor no texto principal um material não explicitado neste versículo.
- source_word: הָרִיעוּ
  choice: Gritem
  rationale: O imperativo pede um brado alto, possivelmente de guerra ou celebração. “Gritem” conserva essa amplitude sem definir indevidamente sua natureza.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão para a ordem de Josué de forma clara e dignificada.
- source_word: נָתַן
  choice: deu
  rationale: O perfeito hebraico apresenta a entrega como realizada e certa, embora a tomada da cidade ainda esteja se concretizando na narrativa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: הָעִיר
  choice: a cidade
  rationale: Mantém a designação definida do hebraico, cujo referente contextual é Jericó.
theological_decisions:
- issue: O perfeito נָתַן antes da conquista efetiva da cidade
  choice: Yahweh lhes deu a cidade
  alternative: Yahweh lhes entregará a cidade
  rationale: A forma hebraica apresenta a dádiva como fato consumado ou plenamente certo. O passado preserva essa força retórica e teológica, sem convertê-la silenciosamente em futuro.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O original emprega diretamente o Tetragrama; a transliteração preserva o nome pessoal e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e dignificado, com boa legibilidade brasileira e compreensão internacional. A coordenação narrativa foi simplificada naturalmente, sem alterar a sequência dos acontecimentos; o imperativo plural “Gritem” evita uma explicitação excessiva como “deem um grito de guerra”.
