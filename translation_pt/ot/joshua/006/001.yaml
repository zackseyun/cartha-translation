base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: pt
  text: Jericó estava completamente fechada[b] por causa dos filhos de Israel[a]; ninguém saía, e ninguém entrava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O hebraico diz literalmente “os filhos de Israel”, designação coletiva comum para o povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica combina duas formas do verbo “fechar”, intensificando a ideia de que Jericó estava inteiramente fechada e bem resguardada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: Jericó
  rationale: Mantém o nome tradicional em português. O waw introduz ou prossegue a descrição narrativa, sem exigir um advérbio temporal explícito.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: estava completamente fechada
  rationale: A combinação enfática de formas da raiz סגר comunica que a cidade estava inteiramente fechada e protegida contra acesso; a formulação portuguesa preserva a intensidade sem reproduzir de modo artificial a repetição hebraica.
- source_word: מִפְּנֵי
  choice: por causa de
  rationale: Expressa naturalmente a causa ou circunstância da interdição da cidade diante da presença de Israel, sem acrescentar a ideia interpretativa de medo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar hebraica, compreensível em português como designação coletiva do povo de Israel.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: ninguém saía, e ninguém entrava
  rationale: Traduz de forma natural a ausência contínua de qualquer movimento para fora ou para dentro da cidade no cenário descrito.
