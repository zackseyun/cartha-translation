  yaml_path: translation/ot/joshua/006/014.yaml
  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: pt
  text: No segundo dia, deram uma volta ao redor da cidade e voltaram ao acampamento. Assim fizeram durante seis dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Assim fizeram seis dias”, isto é, repetiram esse procedimento durante seis dias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ אֶת־הָעִיר
  choice: deram uma volta ao redor da cidade
  rationale: O verbo סבב expressa o movimento de contornar ou rodear; a formulação é natural em português e, com פַּעַם אַחַת, comunica claramente uma única volta sem acrescentar nuance militar.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: No segundo dia
  rationale: Equivalente temporal direto, idiomático e próximo da forma hebraica.
- source_word: פַּעַם אַחַת
  choice: uma volta
  rationale: No contexto do verbo de movimento circular, o hebraico 'uma vez' é expresso naturalmente como 'uma volta' em português.
- source_word: וַיָּשֻׁבוּ הַמַּחֲנֶה
  choice: e voltaram ao acampamento
  rationale: שׁוב indica retorno, e הַמַּחֲנֶה é o destino; 'voltaram ao acampamento' é português corrente e fiel.
- source_word: כֹּה עָשׂוּ שֵׁשֶׁת יָמִים
  choice: Assim fizeram durante seis dias
  rationale: כֹּה indica a maneira anteriormente descrita; 'durante' torna explícito em português o valor temporal contextual de 'seis dias', sem alterar o sentido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de 'ao redor' evita a possível leitura de que apenas visitaram a cidade, enquanto 'deram uma volta' transmite com precisão a ação única do segundo dia.
