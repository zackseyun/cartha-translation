  terminology: «Yahweh» reproduz de modo consistente o Tetragrama. «Trombetas de chifre de carneiro» é uma solução legível para שׁוֹפְרוֹת הַיֹּבְלִים, e a nota apresenta alternativas pertinentes, incluindo «chifres de carneiro» e a associação com jubileu.
