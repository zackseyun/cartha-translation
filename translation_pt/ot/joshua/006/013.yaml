source:
  edition: WLC
  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: pt
  text: E os sete sacerdotes, levando sete trombetas de chifre de carneiro[a] diante da arca de Yahweh, avançavam e tocavam as trombetas. Os homens armados iam à frente deles, e a retaguarda seguia atrás da arca de Yahweh, enquanto as trombetas continuavam a soar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sete trombetas do jubileu” ou “sete chifres de carneiro”. A expressão hebraica se refere a shofares feitos de chifre de carneiro ou associados a ele.
    reason: alternativa lexical
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: trombetas de chifre de carneiro
  rationale: שׁוֹפָר designa uma trombeta de chifre, e הַיֹּבְלִים a associa aqui a carneiros. A expressão comunica tanto a forma ou matéria do instrumento quanto sua função.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: הֹלְכִים הָלוֹךְ
  choice: avançavam
  rationale: A construção com verbo finito e infinitivo absoluto indica ação durativa; no contexto da procissão, “avançavam” é natural e mantém esse movimento contínuo.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: e tocavam as trombetas
  rationale: תקע com שׁוֹפָר significa tocar ou fazer soar o instrumento; o imperfeito narrativo, junto à descrição processional, permite expressar ação em curso.
- source_word: הֶחָלוּץ
  choice: os homens armados
  rationale: O substantivo coletivo se refere à força equipada para a batalha que segue à frente da procissão.
- source_word: לִפְנֵיהֶם
  choice: à frente deles
  rationale: Reproduz claramente a relação espacial; “deles” remete naturalmente aos sacerdotes mencionados.
- source_word: הַמְאַסֵּף
  choice: a retaguarda
  rationale: No contexto militar e processional, designa o grupo que fecha a marcha.
- source_word: אַחֲרֵי אֲרוֹן יְהוָה
  choice: atrás da arca de Yahweh
  rationale: O valor espacial de אַחֲרֵי é expresso de modo direto e natural em português.
- source_word: הולך וְתָקוֹעַ
  choice: enquanto as trombetas continuavam a soar
  rationale: A formulação preserva o caráter contínuo da ação e evita repetir de modo pesado os verbos de movimento e de toque; o sujeito da forma hebraica é textualmente problemático, por isso a construção portuguesa evita defini-lo além do necessário.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio em transliteração, sem substituí-lo por um título.
- issue: Sujeito da cláusula final הוֹלֵךְ וְתָקוֹעַ
  choice: formulação impessoal centrada no som contínuo das trombetas
  alternative: a retaguarda continuava avançando e tocando; eles continuavam avançando e tocando
  rationale: O hebraico massorético apresenta formas masculinas singulares após um contexto com possíveis referentes coletivos, e a tradição textual contém dificuldade aparente. A redação evita resolver silenciosamente se quem toca é a retaguarda, os sacerdotes ou o conjunto processional, preservando o sentido inequívoco de toque contínuo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Retaguarda” conserva o cenário militar sem tecnicismo excessivo. A última oração foi formulada para manter a continuidade sonora e não impor um sujeito onde o hebraico é difícil ou ambíguo.
