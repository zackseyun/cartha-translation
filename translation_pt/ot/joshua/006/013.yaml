  source_fidelity: 'O texto preserva a sequência processional do hebraico: os sete sacerdotes diante da arca, os homens armados à frente e a retaguarda atrás dela. «Avançavam e tocavam as trombetas» expressa bem o aspecto continuativo de הֹלְכִים הָלוֹךְ e a ação de tocar. A oração final impessoal («enquanto as trombetas continuavam a soar») conserva o toque contínuo sem decidir indevidamente o referente da construção hebraica difícil הוֹלֵךְ וְתָקוֹעַ.'
