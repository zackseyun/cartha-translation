  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: pt
  text: Vocês marcharão ao redor da cidade, todos os homens de guerra[a], dando uma volta completa ao redor dela. Assim você fará durante seis dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os combatentes” ou “todos os guerreiros”. O hebraico diz literalmente “todos os homens de guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: Vocês marcharão ao redor
  rationale: O verbo סבב, na segunda pessoa masculina plural, descreve o movimento em torno da cidade. “Marcharão ao redor” preserva o cenário militar e o número plural.
- source_word: הָעִיר
  choice: a cidade
  rationale: Tradução direta de עִיר com artigo. Embora o contexto identifique Jericó, o texto hebraico usa o substantivo comum.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: todos os homens de guerra
  rationale: Expressão próxima da forma hebraica, que designa os combatentes do sexo masculino, e mantém seu teor militar.
- source_word: הַקֵּיף אֶת הָעִיר
  choice: dando uma volta completa ao redor dela
  rationale: Reproduz a retomada enfática da ação de circundar a cidade sem criar em português uma repetição excessivamente dura.
- source_word: פַּעַם אֶחָת
  choice: uma volta completa
  rationale: No contexto de circundar a cidade, expressa de modo natural uma única ocorrência, isto é, um circuito.
- source_word: כֹּה
  choice: Assim
  rationale: Adverbial instrucional que aponta para a maneira de proceder recém-descrita.
- source_word: תַעֲשֶׂה
  choice: você fará
  rationale: Mantém a segunda pessoa masculina singular do hebraico, em contraste com o plural da primeira ordem, indicando Josué como responsável pela execução.
- source_word: שֵׁשֶׁת יָמִים
  choice: durante seis dias
  rationale: Expressa naturalmente a duração e a repetição diária da ação.
theological_decisions:
- issue: Gênero de אַנְשֵׁי הַמִּלְחָמָה
  choice: todos os homens de guerra
  alternative: todos os combatentes; todos os guerreiros
  rationale: A expressão hebraica é masculina e, no contexto, refere-se aos homens que combatiam; a tradução não neutraliza essa informação.
- issue: Mudança de número dos destinatários
  choice: plural em “Vocês marcharão” e singular em “você fará”
  alternative: uniformizar tudo no plural ou tudo no singular
  rationale: O hebraico passa da segunda pessoa plural para a singular, provavelmente dos participantes da marcha para Josué como líder responsável. A tradução conserva essa mudança e a tensão sintática resultante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” torna audível o plural inicial, enquanto “você” preserva a mudança posterior para o singular. A repetição hebraica foi mantida em forma natural por meio de “dando uma volta completa ao redor dela”.
