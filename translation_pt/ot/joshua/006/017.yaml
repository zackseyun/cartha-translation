  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: pt
  text: A cidade e tudo o que nela há serão consagrados à destruição para Yahweh[a]. Somente Raabe, a prostituta, ficará viva, junto com todos os que estiverem com ela na casa, porque escondeu os mensageiros[b] que enviamos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “postos sob o anátema”. O termo hebraico se refere a algo dedicado irrevogavelmente a Yahweh, aqui por meio da destruição.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “os mensageiros”. Pelo contexto, são os homens que Josué havia enviado para espionar a terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: consagrados à destruição
  rationale: Conserva tanto a ideia de dedicação irrevogável a Deus quanto, neste contexto de conquista, a execução dessa dedicação por meio da destruição; evita o sentido meramente emocional de “amaldiçoados”.
- source_word: לַיהוָה
  choice: para Yahweh
  rationale: A preposição indica que a cidade é entregue ou dedicada a YHWH. “Para” é natural com “consagrados”, e “Yahweh” representa o nome divino presente no hebraico.
- source_word: רַק
  choice: Somente
  rationale: Introduz enfaticamente a única exceção ao destino da cidade.
- source_word: הַזּוֹנָה
  choice: a prostituta
  rationale: É o equivalente moderno, claro e não arcaico do termo que identifica Raabe por sua ocupação ou condição.
- source_word: תִּחְיֶה
  choice: ficará viva
  rationale: Expressa diretamente que Raabe não morrerá na destruição, sem acrescentar uma explicação ausente do verbo hebraico.
- source_word: אִתָּהּ בַּבַּיִת
  choice: com ela na casa
  rationale: Mantém a referência às pessoas fisicamente reunidas com Raabe dentro da casa, em vez de interpretar בַּיִת como “família” ou “descendência”.
- source_word: הֶחְבְּאַתָה
  choice: escondeu
  rationale: Traduz de modo direto o hifil de חבא, sem acrescentar ao verbo a nuance interpretativa de proteger ou abrigar.
- source_word: הַמַּלְאָכִים
  choice: os mensageiros
  rationale: Preserva o sentido lexical geral de מַלְאָךְ; o contexto identifica esses mensageiros como os homens enviados para espionar a terra.
- source_word: שָׁלָחְנוּ
  choice: que enviamos
  rationale: O perfeito na primeira pessoa do plural refere-se naturalmente ao envio anterior; o pretérito perfeito é idiomático e suficiente em português.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: A cidade e tudo o que nela há serão
  rationale: Reproduz o alcance do sujeito hebraico — a cidade e todo o seu conteúdo — em uma construção portuguesa natural, sem imitar de forma rígida o pronome resumptivo hebraico.
theological_decisions:
- issue: Sentido do termo de conquista חֵרֶם
  choice: consagrados à destruição
  alternative: postos sob o anátema
  rationale: A formulação não ameniza a severidade do juízo, mas também preserva a dimensão de entrega irrevogável a Yahweh, evitando apresentar a cidade como apenas “amaldiçoada”.
- issue: Representação do tetragrama יהוה
  choice: Yahweh
  alternative: o SENHOR
  rationale: O texto hebraico traz o nome divino, e a forma “Yahweh” o representa explicitamente, em conformidade com a camada de consulta auditada fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe hebraica foi naturalizada sem apagar o caráter abrangente do juízo nem a exceção enfática concedida a Raabe e aos que estavam com ela.
