  naturalness: 'Há duas asperezas evitáveis: «E acontecerá que» é um calque pesado nesta instrução condicional, e «cada homem diretamente adiante de si» é pouco idiomático em português. Uma formulação impessoal para o toque também evita atribuir a ação, sem apoio explícito no hebraico, a um grupo determinado.'
  terminology: «Chifre de carneiro», «trombeta», «grande grito» e «subirá» são escolhas adequadas e compreensíveis. A distinção entre o chifre de carneiro e a trombeta é mantida, como no texto-fonte.
