revisions:
- from: E acontecerá que, quando prolongarem o toque do chifre de carneiro[a], ao ouvirem o som da trombeta, todo o povo dará um grande grito. Então a muralha da cidade cairá debaixo de si mesma[b], e o povo subirá, cada homem diretamente adiante de si[c].
  to: Quando se prolongar o toque do chifre de carneiro[a] e vocês ouvirem o som da trombeta, todo o povo dará um grande grito, e a muralha da cidade cairá debaixo de si mesma[b]; então o povo subirá, cada homem em frente de si[c].
  rationale: A revisão melhora a fluência no português moderno e remove uma atribuição implícita de agente em «prolongarem», mantendo a construção temporal, o valor futuro da sequência e a ambiguidade deliberada da queda da muralha. As notas continuam ancoradas nos mesmos pontos lexicais.
