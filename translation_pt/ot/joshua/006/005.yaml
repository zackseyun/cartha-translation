base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: pt
  text: Quando se prolongar o toque do chifre de carneiro[a] e vocês ouvirem o som da trombeta, todo o povo dará um grande grito, e a muralha da cidade cairá debaixo de si mesma[b]; então o povo subirá, cada homem em frente de si[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando fizerem o chifre de carneiro soar prolongadamente” ou “quando o longo toque do chifre de carneiro for ouvido”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a muralha da cidade cairá debaixo de si mesma”, provavelmente no sentido de que desabará verticalmente.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “cada um seguirá em linha reta” ou “cada homem seguirá diretamente à sua frente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: quando prolongarem o toque
  rationale: O infinitivo de משׁך, nesta construção instrumental, indica prolongar o toque do instrumento. A formulação comunica naturalmente o idioma hebraico sem perder a ideia verbal de extensão.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: chifre de carneiro
  rationale: Neste contexto, יוֹבֵל designa o carneiro ou seu chifre usado como instrumento, e não o sentido técnico posterior de “jubileu”.
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: o som da trombeta
  rationale: Preserva קוֹל, “som”, e traduz שׁוֹפָר por um termo corrente e inteligível, sem recorrer desnecessariamente à transliteração.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: dará um grande grito
  rationale: O verbo e seu objeto cognato exprimem a emissão coletiva de um forte clamor. “Dará um grande grito” é idiomático e não restringe o clamor especificamente a um grito de guerra.
- source_word: תַּחְתֶּיהָ
  choice: debaixo de si mesma
  rationale: Mantém a imagem incomum do hebraico, segundo a qual a muralha cai sob si própria, provavelmente desabando verticalmente, sem substituir a expressão por uma interpretação.
- source_word: וְעָלוּ
  choice: e o povo subirá
  rationale: עלה significa basicamente “subir”. No contexto do cerco, pode implicar avançar para dentro da cidade, mas “subirá” preserva a orientação espacial sem acrescentar uma nuance militar não explicitada.
- source_word: אִישׁ נֶגְדּוֹ
  choice: cada homem diretamente adiante de si
  rationale: A expressão tem força distributiva e indica que cada homem seguirá reto pelo ponto que estiver diante dele. A tradução conserva tanto o masculino do contexto militar quanto a referência espacial individual.
