  text: וַ/יַּסֵּ֤ב אֲרוֹן יְהוָה֙ אֶת הָ/עִ֔יר הַקֵּ֖ף פַּ֣עַם אֶחָ֑ת וַ/יָּבֹ֨אוּ֙ הַֽ/מַּחֲנֶ֔ה וַ/יָּלִ֖ינוּ בַּֽ/מַּחֲנֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: pt
  text: Assim, a arca de Yahweh deu uma volta ao redor da cidade[a], uma única vez. Então vieram ao acampamento e passaram a noite no acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a arca de Yahweh circundou a cidade”. O hebraico apresenta a arca como sujeito, embora ela fosse carregada pelos sacerdotes.
    reason: Esclarece a personificação narrativa e o sujeito gramatical da construção hebraica, sem introduzir um agente humano não expresso.
lexical_decisions:
- source_word: וַיַּסֵּב אֲרוֹן יְהוָה
  choice: ele fez a arca de Yahweh dar uma volta
  rationale: A forma causativa de סבב favorece a ideia de que o sujeito implícito fez a arca percorrer o circuito. O hebraico permite alguma ambiguidade sintática, e muitas versões entendem a arca como sujeito; essa possibilidade é registrada em nota.
- source_word: אֶת הָעִיר הַקֵּף פַּעַם אֶחָת
  choice: ao redor da cidade
  rationale: A expressão especifica um único circuito em torno da cidade. “Dar uma volta ao redor” comunica naturalmente tanto o movimento circular quanto פַּעַם אֶחָת, “uma vez”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando seu caráter de nome próprio.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: eles entraram no acampamento
  rationale: בוא com um destino pode significar “entrar”. A tradução evita acrescentar a noção interpretativa de “voltar”, que não é exigida pelo verbo.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: ali passaram a noite
  rationale: לון significa alojar-se ou passar a noite. “Ali” retoma naturalmente o acampamento e evita uma repetição pesada em português, sem perder a localização expressa no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Agência humana no transporte da arca
  choice: ele fez a arca de Yahweh dar uma volta
  alternative: a arca de Yahweh deu uma volta
  rationale: A forma verbal causativa pode apresentar um agente humano implícito que manda conduzir a arca, embora a construção também tenha sido entendida como personificação narrativa da arca. A nota conserva essa tensão sem especificar além do texto quem é “ele”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Acampamento” é preferido a “arraial”. A repetição hebraica de “acampamento” foi condensada por meio de “ali”, e a ambiguidade sobre o sujeito da primeira oração foi preservada em nota.
