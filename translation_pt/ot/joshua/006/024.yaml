source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: pt
  text: Queimaram a cidade com fogo e tudo o que havia nela. Somente a prata, o ouro e os objetos de bronze e de ferro[a] eles puseram no tesouro da casa de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os utensílios de bronze e de ferro”. O termo hebraico pode designar de modo amplo objetos, utensílios, recipientes ou instrumentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: Queimaram ... com fogo
  rationale: O verbo qal perfeito na terceira pessoa do plural indica ação concluída por um sujeito plural implícito; בָאֵשׁ expressa o meio empregado. A formulação mantém a expressão hebraica de modo claro e digno.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: e tudo o que havia nela
  rationale: Reproduz a abrangência da expressão hebraica e retoma naturalmente a cidade com o pronome feminino.
- source_word: רַק
  choice: Somente
  rationale: Marca a exceção à destruição total mencionada antes.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: a prata, o ouro
  rationale: Mantém os artigos definidos e o caráter de inventário dos metais separados.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: e os objetos de bronze e de ferro
  rationale: כְּלֵי é um termo amplo para objetos, utensílios ou recipientes; “objetos” evita restringir indevidamente o referente. Neste contexto, נְחֹשֶׁת é adequadamente traduzido por “bronze”.
- source_word: נָתְנוּ
  choice: eles puseram
  rationale: No contexto de depositar metais num tesouro, “puseram” comunica com naturalidade o sentido contextual de נתן e preserva o sujeito plural implícito.
- source_word: אוֹצַר בֵּית יְהוָה
  choice: no tesouro da casa de Yahweh
  rationale: אוֹצַר designa o depósito de bens valiosos, e a cadeia construta liga esse tesouro à casa de Yahweh. “Casa” evita a especificidade potencialmente anacrônica de “templo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome da aliança sem substituí-lo por um título.
- issue: Destino cultual dos metais
  choice: no tesouro da casa de Yahweh
  alternative: no depósito pertencente à casa de Yahweh
  rationale: A cadeia construta indica que os metais foram destinados ao tesouro associado à casa de Yahweh, sem exigir explicações adicionais sobre seu uso.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem marcada “eles puseram” conserva a ênfase da exceção e explicita com naturalidade o sujeito plural já presente no verbo hebraico. O marcador da nota foi colocado junto a “objetos de bronze e de ferro”, expressão à qual a alternativa lexical efetivamente se refere.
