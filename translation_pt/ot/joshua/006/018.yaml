source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: pt
  text: Mas vocês, guardem-se daquilo que foi consagrado à destruição[a], para que vocês mesmos não se tornem consagrados à destruição[b], nem tomem algo daquilo que foi consagrado à destruição, façam do acampamento de Israel algo consagrado à destruição e tragam desgraça sobre ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico חֵרֶם (ḥērem), tradicionalmente traduzido por “anátema”, “interdição” ou “coisa condenada”, refere-se aqui a pessoas ou coisas irrevogavelmente consagradas a Deus para destruição.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que não coloquem a si mesmos sob a interdição”.'
    reason: alternative_reading
  - marker: c
    text: A expressão “trazer desgraça” antecipa o tema do pecado de Acã e de suas consequências para Israel; veja Josué 7:1, 25.
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: Mas vocês
  rationale: A combinação introduz uma advertência fortemente contrastiva, enquanto o pronome independente dá ênfase aos destinatários. A construção é direta e natural em português.
- source_word: שִׁמְרוּ מִן
  choice: tenham cuidado com
  rationale: O verbo com a preposição מן expressa guardar-se de algo. Esta formulação conserva o caráter reflexivo da advertência em português corrente.
- source_word: הַחֵרֶם
  choice: aquilo que foi consagrado à destruição
  rationale: חֵרֶם é um substantivo coletivo e, neste contexto, designa o que foi irrevogavelmente entregue a Deus mediante destruição. A formulação evita tanto o arcaísmo de 'anátema' quanto a concretização indevida em objetos discretos.
- source_word: פֶּן
  choice: para que não
  rationale: Introduz a consequência temida que a advertência procura evitar; 'para que não' é idiomático e digno em português moderno.
- source_word: תַּחֲרִימוּ
  choice: não se tornem vocês mesmos consagrados à destruição
  rationale: O hifil de חרם pode exprimir colocar sob consagração destrutiva. No contexto, tomar do חֵרֶם faria os próprios israelitas incorrerem nessa condição; o pronome enfático é representado por 'vocês mesmos'.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: ao tomarem algo daquilo que foi consagrado à destruição
  rationale: A construção explicita em português a circunstância pela qual eles incorreriam na condição advertida. 'Algo daquilo' comunica naturalmente a ideia de tomar uma parte do conjunto coletivo.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: fazendo assim com que o acampamento de Israel seja consagrado à destruição
  rationale: שׂים com objeto e complemento indica produzir determinado estado. A formulação mantém o acampamento, isto é, a comunidade reunida, como objeto da consequência.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: trazendo desgraça sobre ele
  rationale: עכר significa causar perturbação, calamidade ou desgraça. 'Trazer desgraça' expressa a gravidade da consequência, e 'ele' retoma o acampamento de Israel.
theological_decisions:
- issue: Sentido de חֵרֶם no contexto de guerra santa e juízo
  choice: consagrado à destruição
  alternative: posto sob interdição; anátema; coisa condenada
  rationale: O termo descreve algo irrevogavelmente entregue a Deus e, neste contexto, destinado à destruição. A escolha conserva tanto a dimensão de consagração quanto a de juízo, sem introduzir linguagem denominacional.
- issue: Valor de תַּחֲרִימוּ aplicado aos próprios israelitas
  choice: tornarem-se eles mesmos consagrados à destruição
  alternative: consagrarem a si mesmos à destruição; colocarem a si mesmos sob a interdição
  rationale: A advertência indica que, ao tomar o que estava sob חֵרֶם, eles passariam a compartilhar a mesma condição de juízo. A tradução apresenta essa consequência sem negar a possível nuance causativa refletida na alternativa.
- issue: Relação entre tornar-se חֵרֶם e tomar do חֵרֶם
  choice: ao tomarem
  alternative: e tomarem
  rationale: O hebraico coordena as formas verbais, mas o contexto mostra que tomar do que foi consagrado é a ação pela qual a condição temida é contraída. A construção circunstancial torna essa relação compreensível em português sem acrescentar uma causa externa ao texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Emprega-se “vocês” para a segunda pessoa plural e mantém-se a repetição de “consagrado à destruição” para reproduzir o encadeamento enfático de חֵרֶם no hebraico. O substantivo coletivo é vertido por “aquilo que”, evitando transformá-lo desnecessariamente em uma lista de objetos.
