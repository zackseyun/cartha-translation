  naturalness: O português é claro e de registro adequado, mas «guardem-se de» é mais preciso e idiomático para a proibição. A coordenação negativa com «nem» preserva melhor a progressão do hebraico sem tornar a frase pouco natural.
  terminology: «Consagrado à destruição» transmite bem o sentido contextual de חֵרֶם e deve ser mantido de forma consistente. «Acampamento de Israel» e «trazer desgraça sobre ele» são adequados.
  issues:
