revisions:
- from: Mas vocês, tenham cuidado com aquilo que foi consagrado à destruição[a], para que não se tornem vocês mesmos consagrados à destruição[b] ao tomarem algo daquilo que foi consagrado à destruição, fazendo assim com que o acampamento de Israel seja consagrado à destruição e trazendo desgraça sobre ele[c].
  to: Mas vocês, guardem-se daquilo que foi consagrado à destruição[a], para que vocês mesmos não se tornem consagrados à destruição[b], nem tomem algo daquilo que foi consagrado à destruição, façam do acampamento de Israel algo consagrado à destruição e tragam desgraça sobre ele[c].
  rationale: A revisão substitui uma expressão potencialmente ambígua por «guardem-se de» e restaura a coordenação das ações sob a advertência introduzida por «para que», sem converter «tomar» em uma circunstância causal. Mantém-se «consagrado à destruição» para as três ocorrências de חֵרֶם, bem como as notas e seus respectivos marcadores.
