base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: pt
  text: No sétimo dia, levantaram-se cedo, ao romper da aurora, e marcharam ao redor da cidade sete vezes, da mesma maneira. Somente naquele dia marcharam sete vezes ao redor da cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: ao romper da aurora
  rationale: Expressa naturalmente o início e a ascensão da luz da madrugada, preservando a imagem temporal do hebraico.
- source_word: וַיָּסֹבּוּ / סָבְבוּ
  choice: marcharam ao redor
  rationale: No contexto da ação organizada de Israel em torno de Jericó, “marcharam ao redor” transmite tanto o movimento circular quanto seu caráter processional e militar.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: da mesma maneira
  rationale: Aqui מִשְׁפָּט indica o procedimento ou padrão previamente estabelecido, não um julgamento judicial.
- source_word: רַק
  choice: somente
  rationale: 'Mantém a ênfase restritiva: foi exclusivamente naquele dia que deram sete voltas.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. A fórmula hebraica ויהי foi vertida diretamente pelo enquadramento temporal “No sétimo dia”, evitando o pouco natural “E aconteceu que” sem perda de conteúdo. A repetição das sete voltas foi preservada por sua função enfática.
