  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: pt
  text: E consagraram à destruição tudo o que havia na cidade[a], desde o homem até a mulher, desde o jovem até o velho, e até o boi, a ovelha e o jumento, ao fio da espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «destruíram completamente» ou «colocaram sob interdição». O verbo hebraico refere-se a entregar algo irrevogavelmente à destruição sob o ḥerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: consagraram à destruição
  rationale: 'O hifil de חרם expressa a imposição do ḥerem: entregar pessoas ou coisas irrevogavelmente à destruição. A formulação conserva o caráter técnico do termo, em vez de reduzi-lo ao sentido genérico de destruir.'
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: tudo o que havia na cidade
  rationale: Expressa de modo natural em português a abrangência total da construção hebraica, posteriormente detalhada por pessoas e animais.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: desde o homem até a mulher
  rationale: Mantém os substantivos distributivos no singular e a construção inclusiva de extremos do hebraico.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: desde o jovem até o velho
  rationale: Preserva o merismo etário e sua forma paralela, abrangendo todas as idades sem acrescentar especificações ausentes no texto.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: e até o boi, a ovelha e o jumento
  rationale: A expressão continua a abrangência até os animais domésticos; «e até» comunica com naturalidade a força inclusiva de וְעַד.
- source_word: לְפִי חָרֶב
  choice: ao fio da espada
  rationale: É uma expressão portuguesa consagrada e inteligível que preserva a imagem do idioma hebraico, literalmente relacionado à «boca» da espada.
theological_decisions:
- issue: Tradução da linguagem de חרם no contexto de guerra e juízo
  choice: consagraram à destruição
  alternative: destruíram completamente; colocaram sob interdição
  rationale: 'O verbo contém mais que a ideia genérica de matar ou destruir: indica sujeição irrevogável ao ḥerem. A opção escolhida conserva essa dimensão técnica e teológica sem atenuar a violência do texto nem inserir uma explicação doutrinária no corpo do versículo.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo «desde... até...» e os substantivos no singular preservam a estrutura abrangente do hebraico; a nota esclarece o termo técnico sem sobrecarregar o texto principal.
