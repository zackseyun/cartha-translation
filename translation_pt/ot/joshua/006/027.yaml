base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: pt
  text: E Yahweh estava com Josué, e sua fama estava em toda a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua notícia” ou “o relato a seu respeito”. O hebraico pode indicar notícia, relato, reputação ou fama; neste contexto, provavelmente se refere à crescente fama de Josué.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva no texto o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיְהִי יְהוָה אֶת יְהוֹשֻׁעַ
  choice: E Yahweh estava com Josué
  rationale: A construção com היה e אֶת expressa presença ou acompanhamento; o pretérito imperfeito é natural em português para esse estado no contexto narrativo.
- source_word: שָׁמְעוֹ
  choice: a fama dele
  rationale: O substantivo pode significar notícia, relato, reputação ou fama. Após a conquista de Jericó, o contexto favorece a crescente notoriedade de Josué, sem excluir totalmente a ideia de notícias a respeito dele.
- source_word: בְּכָל הָאָרֶץ
  choice: por toda a terra
  rationale: Refere-se naturalmente à terra no âmbito da narrativa, e não ao planeta inteiro. A preposição 'por' combina de modo idiomático com 'se espalhou'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal no texto e evita substituí-lo por um título ou adotar outra forma vocalizada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação verbal 'se espalhou' comunica naturalmente a circulação da fama ou notícia implícita no hebraico, enquanto a nota preserva sua amplitude lexical.
