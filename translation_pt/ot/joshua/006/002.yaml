  source_fidelity: A tradução preserva corretamente a declaração divina em perfeito (“entreguei”), o chamamento de atenção (“Veja”), os referentes de Jericó e de seu rei e a inclusão dos combatentes. Contudo, o hebraico diz literalmente “em tua mão” (singular); o singular é natural em português e conserva melhor a imagem idiomática.
  naturalness: O registro é moderno, claro e adequado. “Entreguei em sua mão” é uma formulação bíblica ainda plenamente inteligível e mais próxima do original do que o plural “nas suas mãos”. “Guerreiros poderosos” é compreensível, mas “valentes guerreiros” reproduz mais diretamente a ideia de bravura e aptidão militar da expressão hebraica.
  terminology: “Yahweh”, “Josué” e “Jericó” estão consistentes. A nota deve apresentar “guerreiros poderosos” como alternativa à opção principal, em vez de limitar as alternativas a uma só formulação.
