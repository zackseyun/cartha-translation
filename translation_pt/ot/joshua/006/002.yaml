base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: pt
  text: 'E Yahweh disse a Josué: “Veja, entreguei em sua mão Jericó, seu rei e seus valentes guerreiros.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guerreiros poderosos”. A expressão hebraica reúne as ideias de força, capacidade militar e valentia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, distinguindo-o do título “Senhor”.
- source_word: וַיֹּאמֶר
  choice: E ... disse
  rationale: Mantém o encadeamento narrativo expresso pelo waw consecutivo sem tornar a sequência temporal mais específica.
- source_word: רְאֵה
  choice: Veja
  rationale: Conserva a força direta do imperativo usado para chamar a atenção, em português atual.
- source_word: נָתַתִּי
  choice: entreguei
  rationale: Preserva o aspecto perfectivo da declaração e comunica naturalmente a transferência para o poder de Josué.
- source_word: בְיָדְךָ
  choice: nas suas mãos
  rationale: Mantém a imagem idiomática hebraica de colocar alguém ou algo sob o poder de outra pessoa, com formulação natural em português.
- source_word: יְרִיחוֹ
  choice: Jericó
  rationale: Forma tradicional e corrente do topônimo em português.
- source_word: מַלְכָּהּ
  choice: seu rei
  rationale: O sufixo feminino singular se refere à cidade de Jericó; “seu rei” expressa essa relação naturalmente.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: guerreiros poderosos
  rationale: Expressa tanto a capacidade guerreira quanto a força e valentia contidas na locução hebraica, sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Força do perfeito נָתַתִּי antes da batalha
  choice: Declaração divina de vitória certa, traduzida por “entreguei”
  alternative: “estou entregando” ou “entregarei”
  rationale: O perfeito apresenta a ação como concluída do ponto de vista do falante, embora a conquista ainda vá ocorrer; a tradução conserva essa tensão e a certeza da declaração sem explicá-la no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A ordem foi ajustada para fluência, mantendo a concisão e a imagem central do hebraico.
