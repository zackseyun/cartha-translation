  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: pt
  text: Os homens armados iam à frente dos sacerdotes que tocavam as trombetas[a], e a retaguarda seguia atrás da arca, enquanto as trombetas continuavam soando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico shofarot, isto é, chifres usados como instrumentos, muitas vezes traduzidos por “chifres de carneiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: os homens armados
  rationale: O termo designa o contingente armado que marcha à frente; a expressão é clara e preserva o caráter militar da formação.
- source_word: הֹלֵךְ
  choice: iam / seguia
  rationale: O particípio indica ação em andamento dentro da procissão; o imperfeito português expressa naturalmente esse aspecto durativo.
- source_word: לִפְנֵי
  choice: à frente de
  rationale: Expressa de modo natural a relação espacial e a ordem da procissão.
- source_word: הַכֹּהֲנִים
  choice: os sacerdotes
  rationale: Equivalente português padrão no contexto cultual e narrativo.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: que tocavam as trombetas
  rationale: A oração descreve a ação contínua dos sacerdotes. Em português, 'tocar as trombetas' é mais natural que 'soprar as trombetas', sem perder o sentido.
- source_word: הַמְאַסֵּף
  choice: a retaguarda
  rationale: Designa o grupo que fecha e protege a parte posterior da formação em marcha.
- source_word: אַחֲרֵי
  choice: atrás de
  rationale: Preserva o sentido espacial exigido pela descrição da procissão.
- source_word: הָאָרוֹן
  choice: a arca
  rationale: O contexto imediato já identifica a arca; não é necessário acrescentar 'da aliança', ausente neste versículo.
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: enquanto as trombetas continuavam soando
  rationale: A construção comunica ação contínua durante o deslocamento. A formulação portuguesa preserva a continuidade e evita atribuir de modo indevidamente explícito o último verbo à retaguarda.
- source_word: בַּשּׁוֹפָרוֹת
  choice: as trombetas
  rationale: Mantém consistência no versículo e legibilidade; a natureza específica do shofar é registrada em nota.
