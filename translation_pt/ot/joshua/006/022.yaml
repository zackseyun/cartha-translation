base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: pt
  text: 'E Josué disse aos dois homens que haviam espionado a terra: “Entrem na casa da prostituta e tirem de lá a mulher e tudo o que é dela, conforme juraram a ela.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: Então Josué disse aos dois homens
  rationale: O waw introduz a transição narrativa, enquanto o lamed marca os homens como destinatários da fala. Em português, integrar o destinatário à fórmula de fala produz uma ordem natural sem perder a relação sintática.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: que haviam espionado a terra
  rationale: O particípio de רגל designa aqui reconhecimento secreto; o mais-que-perfeito composto deixa claro que essa missão ocorreu antes da ordem de Josué.
- source_word: בֹּאוּ בֵּית
  choice: Entrem na casa
  rationale: Embora בוא possa corresponder a “vir”, no contexto de uma ordem para ingressar em outro local, “entrem” é a forma portuguesa mais direta e natural.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: a prostituta
  rationale: זוֹנָה designa claramente uma prostituta. O substantivo português já inclui a noção de mulher, evitando a expressão pouco natural “a mulher prostituta”.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: e tirem de lá
  rationale: O hifil de יצא significa fazer sair ou retirar. “Tirem de lá” preserva explicitamente מִשָּׁם e soa natural numa ordem.
- source_word: אֶת הָאִשָּׁה
  choice: a mulher
  rationale: Mantém a repetição lexical do hebraico, que volta a designá-la como “a mulher” em vez de usar apenas um pronome.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: e tudo o que é dela
  rationale: A expressão permanece ampla, podendo abranger tudo o que lhe pertence ou está ligado a ela no contexto, sem restringi-la apenas a bens materiais.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: conforme juraram a ela
  rationale: Expressa que a ordem deve ser cumprida de acordo com o juramento feito pelos dois homens; “a ela” mantém explícito o complemento hebraico.
theological_decisions:
- issue: Sentido de זוֹנָה na descrição de Raabe
  choice: prostituta
  alternative: meretriz
  rationale: O termo hebraico denota prostituta. “Prostituta” é atual, claro e não suaviza o texto; “meretriz” é correto, mas menos comum no português contemporâneo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. Preserva-se a repetição hebraica entre “a prostituta” e “a mulher”, sem recorrer a formulações artificiais.
