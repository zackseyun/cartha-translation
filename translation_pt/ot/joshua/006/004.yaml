base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: pt
  text: Sete sacerdotes levarão sete trombetas de chifre de carneiro[a] à frente da arca. No sétimo dia, vocês marcharão sete vezes ao redor da cidade, e os sacerdotes tocarão as trombetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sete chifres de carneiro” ou “sete shofares de chifre de carneiro”. A expressão hebraica se refere a instrumentos de chifre, provavelmente feitos de chifres de carneiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: levarão
  rationale: O verbo נשׂא significa carregar ou levar. “Levarão” expressa de modo natural que os sacerdotes conduzirão os instrumentos durante a procissão.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: trombetas de chifre de carneiro
  rationale: שׁוֹפָר designa uma trombeta de chifre, e הַיּוֹבְלִים qualifica os instrumentos. A tradução explicita tanto sua função musical quanto sua associação provável com chifres de carneiro, sem usar o potencialmente enganoso “trombetas do jubileu”.
- source_word: לִפְנֵי הָאָרוֹן
  choice: à frente da arca
  rationale: A expressão לִפְנֵי tem sentido espacial, “diante de/à frente de”. “À frente da arca” é clara no contexto da procissão e não acrescenta “da aliança”, ausente neste versículo.
- source_word: תָּסֹבּוּ
  choice: vocês marcharão ... ao redor
  rationale: סבב significa dar a volta, rodear ou circular. No contexto militar e processional, “marcharão ... ao redor” transmite naturalmente a ação ordenada e preserva a segunda pessoa do plural.
- source_word: שֶׁבַע פְּעָמִים
  choice: sete vezes
  rationale: Com uma ação repetida e um numeral, פְּעָמִים corresponde naturalmente a “vezes”.
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: tocarão as trombetas
  rationale: תקע com ב e שׁוֹפָר é a expressão usual para soprar ou fazer soar uma trombeta de chifre. Em português, “tocarão as trombetas” é idiomático e claro; a natureza dos instrumentos já foi especificada na primeira frase.
