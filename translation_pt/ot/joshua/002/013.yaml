  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: pt
  text: e mantenham vivos meu pai e minha mãe, meus irmãos e minhas irmãs, e todos os que lhes pertencem[a]; e livrem-nos da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tudo o que lhes pertence”. A expressão hebraica pode referir-se às demais pessoas da casa e aos dependentes, mas também pode ter sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: conservem com vida
  rationale: O hifil de חיה expressa a ação de fazer viver ou manter vivo. “Conservem com vida” preserva o sentido causativo e se ajusta ao pedido solene de Raabe.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: meu pai e minha mãe, meus irmãos e minhas irmãs
  rationale: Os termos de parentesco são mantidos de modo explícito e na sequência enfática do hebraico; אחותי é entendido coletivamente no contexto como referência às irmãs.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: todos os que lhes pertencem
  rationale: A formulação mantém a provável referência pessoal aos demais membros e dependentes da família sem ocultar que o hebraico também pode abranger tudo o que possuem.
- source_word: וְהִצַּלְתֶּם
  choice: livrem
  rationale: O hifil de נצל significa livrar ou resgatar. “Livrem” comunica adequadamente a retirada de um perigo mortal e conserva o tom solene.
- source_word: נַפְשֹׁתֵינוּ
  choice: as nossas vidas
  rationale: Neste contexto, נפשׁ se refere às vidas ou às próprias pessoas, não a almas imateriais. A tradução concreta corresponde ao perigo de morte.
- source_word: מִמָּוֶת
  choice: da morte
  rationale: Reproduz diretamente a expressão hebraica e preserva a gravidade do pedido.
