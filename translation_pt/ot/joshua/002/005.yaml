  verdict: approve
  source_fidelity: A tradução transmite com precisão a sequência temporal e a fala de Raabe. «Estava para ser fechado» expressa adequadamente a ação iminente de לִסְגּוֹר, «ao cair da noite» reproduz o valor temporal de בַּחֹשֶׁךְ, e «para onde» preserva a noção de destino em אָנָה. O imperativo plural e a promessa de que os destinatários alcançarão os homens também são mantidos.
  naturalness: O português é moderno, claro e de ampla compreensão. «Quando o portão estava para ser fechado» e «Persigam-nos depressa» soam naturais em registro narrativo digno. O uso de «vocês» torna perceptível o plural verbal sem prejudicar a fluência para leitores brasileiros.
