  text: וַ/יְהִ֨י הַ/שַּׁ֜עַר לִ/סְגּ֗וֹר בַּ/חֹ֨שֶׁךְ֙ וְ/הָ/אֲנָשִׁ֣ים יָצָ֔אוּ לֹ֣א יָדַ֔עְתִּי אָ֥נָה הָלְכ֖וּ הָֽ/אֲנָשִׁ֑ים רִדְפ֥וּ מַהֵ֛ר אַחֲרֵי/הֶ֖ם כִּ֥י תַשִּׂיגֽוּ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: pt
  text: Quando o portão estava para ser fechado ao cair da noite[a], os homens saíram. Não sei para onde eles foram. Persigam-nos depressa, pois vocês os alcançarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando já estava escuro». A expressão hebraica indica o momento em que o portão seria fechado, no início da escuridão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשַּׁעַר לִסְגּוֹר
  choice: Quando o portão estava para ser fechado
  rationale: A construção introduz uma circunstância temporal e apresenta o fechamento como iminente. A formulação evita o arcaísmo «e aconteceu» e mantém a voz passiva do hebraico.
- source_word: בַּחֹשֶׁךְ
  choice: ao cair da noite
  rationale: A expressão situa o fechamento no início da escuridão. «Ao cair da noite» é natural em português e preserva essa nuance temporal.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: os homens saíram
  rationale: O verbo יצא indica o movimento concreto de sair, sem necessidade de explicitar novamente a cidade.
- source_word: לֹא יָדַעְתִּי
  choice: Não sei
  rationale: Embora a forma hebraica seja perfeita, na fala ela expressa o estado presente de alegada ignorância de Raabe; o presente é idiomático em português.
- source_word: אָנָה הָלְכוּ הָאֲנָשִׁים
  choice: para onde eles foram
  rationale: אָנָה pergunta pelo destino, por isso «para onde» é mais preciso que apenas «onde». O pronome evita uma repetição pesada sem perder o referente.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: Persigam-nos depressa
  rationale: O plural do imperativo é preservado. «Perseguir» já incorpora a ideia de ir atrás, e «depressa» traduz o advérbio מַהֵר de modo corrente.
- source_word: כִּי תַשִּׂיגוּם
  choice: pois vocês os alcançarão
  rationale: כִּי introduz a razão da ordem, e o Hifil de נשׂג significa alcançar ou atingir quem vai adiante. «Alcançarão» conserva a imagem da perseguição sem implicar necessariamente captura.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» para tornar explícito o plural do imperativo e do verbo, sem acrescentar um referente ausente do contexto. Evita formulações arcaicas e preserva a progressão direta da fala.
