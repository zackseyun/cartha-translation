  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: pt
  text: 'Os homens lhe disseram: “Nossa vida pela de vocês, até a morte, se vocês não revelarem este nosso assunto. Quando Yahweh nos der a terra, agiremos com amor leal e fidelidade para com você[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “bondade e fidelidade”. A expressão hebraica חֶסֶד וֶאֱמֶת descreve um compromisso leal e confiável, muitas vezes associado à fidelidade a uma aliança.
    reason: Alternativa lexical e esclarecimento da força relacional e pactual da expressão hebraica.
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Traduz diretamente o substantivo; o contexto os identifica como os espiões, mas o hebraico aqui diz apenas ‘os homens’.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: Nossa vida pela de vocês, até a morte
  rationale: נֶפֶשׁ tem aqui o sentido de ‘vida’, תַּחַת exprime substituição, e לָמוּת reforça o compromisso até a morte. A formulação conserva o caráter conciso e solene do juramento.
- source_word: אִם לֹא תַגִּידוּ
  choice: se vocês não revelarem
  rationale: נגד no hiphil significa contar, declarar ou comunicar. ‘Revelarem’ expressa naturalmente a proibição de divulgar o assunto e mantém o plural da forma hebraica.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: este nosso assunto
  rationale: דָּבָר pode significar palavra, assunto ou questão. Neste contexto, refere-se ao acordo ou à missão dos homens sem precisar defini-lo mais estreitamente.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: Quando Yahweh nos der a terra
  rationale: A construção com בְּ e o infinitivo indica a circunstância temporal. O nome divino é transliterado como Yahweh.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: agiremos ... para com você
  rationale: עשה com עִם descreve a maneira de agir ou proceder em relação a alguém. A construção escolhida é digna e compreensível em português.
- source_word: חֶסֶד וֶאֱמֶת
  choice: amor leal e fidelidade
  rationale: A dupla exprime compromisso leal, benevolente e confiável. ‘Amor leal’ preserva a força relacional de חֶסֶד, enquanto ‘fidelidade’ comunica a verdade e confiabilidade de אֱמֶת sem impor no texto uma terminologia técnica ausente dos substantivos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama. ‘Yahweh’ preserva o nome próprio e segue a orientação do projeto.
- issue: Força semântica de חֶסֶד וֶאֱמֶת
  choice: amor leal e fidelidade
  alternative: bondade e fidelidade; lealdade de aliança e verdade
  rationale: A escolha mantém os dois aspectos da expressão — compromisso benevolente e confiabilidade — e deixa a nota registrar sua frequente dimensão pactual, sem tornar ‘aliança’ parte explícita do texto hebraico.
- issue: Plural em תַחְתֵּיכֶם e תַגִּידוּ diante da referência singular a Raabe
  choice: vocês
  alternative: você
  rationale: Embora os homens falem com Raabe, as formas hebraicas são plurais e podem abranger sua casa. O texto conserva o plural em vez de resolver silenciosamente essa tensão; no fim do versículo, עִמָּךְ volta ao singular, traduzido como ‘você’.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. Conservou-se a alternância do plural para o singular presente no hebraico. A fala mantém a concisão e a solenidade próprias de um compromisso juramentado.
