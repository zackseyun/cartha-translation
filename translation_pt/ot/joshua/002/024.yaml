  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: pt
  text: 'E disseram a Josué: “Certamente o SENHOR entregou toda a terra em nossas mãos, e também todos os habitantes da terra perderam a coragem diante de nós.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: De fato
  rationale: Aqui introduz enfaticamente a conclusão dos espias, equivalente a “certamente/de fato”, e não uma oração causal.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: entregou ... em nossas mãos
  rationale: Preserva a metáfora hebraica de domínio e vitória, corrente e inteligível em português.
- source_word: נָמֹגוּ
  choice: estão apavorados
  rationale: O verbo significa literalmente “derreteram-se”, mas, neste contexto, descreve a perda de coragem causada pelo medo; a formulação natural comunica esse sentido sem estranheza indevida.
- source_word: מִפָּנֵינוּ
  choice: diante de nós
  rationale: Expressa de modo direto a reação dos habitantes perante Israel, mantendo a formulação espacial do hebraico.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: SENHOR
  alternative: Javé
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o tetragrama em versaletes, sem acrescentar uma vocalização ao texto consonantal.
- issue: Aspecto da dádiva da terra
  choice: entregou
  alternative: entregará
  rationale: Mantém o perfeito hebraico נָתַן, pelo qual os espias declaram a entrega como realidade certa e já estabelecida, embora a conquista ainda prossiga.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A repetição de “terra” foi mantida por refletir a ênfase do original.
