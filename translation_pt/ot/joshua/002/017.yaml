  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: pt
  text: 'Os homens lhe disseram: “Ficaremos desobrigados deste juramento que você nos fez prestar.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estamos livres de responsabilidade quanto a este juramento que você nos fez prestar.” O hebraico não traz verbo expresso e pode indicar estar livre de responsabilidade ou obrigação; o sentido futuro no texto principal decorre do contexto.'
    reason: lexical_and_temporal_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: Os homens lhe disseram
  rationale: A construção narrativa introduz a fala seguinte; “lhe disseram” expressa de modo natural em português a direção indicada por אֶל com o sufixo feminino.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Mantém o substantivo comum do hebraico, sem substituí-lo por “os espiões”, identificação fornecida pelo contexto, mas não por este versículo.
- source_word: נְקִיִּם אֲנַחְנוּ
  choice: ficaremos desobrigados
  rationale: Em contexto jurídico e de juramento, נָקִי indica estar livre de responsabilidade ou obrigação. “Desobrigados” evita sugerir principalmente inocência moral. O futuro explicita a aplicação prospectiva desenvolvida nas condições dos versículos seguintes, embora o hebraico não contenha verbo expresso.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: deste juramento
  rationale: “Deste” reúne naturalmente em português a preposição de separação, o demonstrativo “este” e a referência ao juramento dirigido à interlocutora; o possessivo hebraico fica suficientemente representado pela fala direta e pela oração “que você nos fez prestar”.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: que você nos fez prestar
  rationale: 'O hifil de שׁבע é causativo: ela os fez jurar. Em português corrente, “prestar juramento” comunica essa ideia com clareza e dignidade.'
theological_decisions:
- issue: Valor temporal da oração nominal נְקִיִּם אֲנַחְנוּ
  choice: ficaremos desobrigados
  alternative: estamos desobrigados
  rationale: A oração hebraica não marca explicitamente o tempo, mas a fala introduz condições futuras sob as quais os homens não responderiam pelo juramento. O texto principal segue esse valor contextual, e a nota preserva a leitura mais formal no presente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” corresponde à interlocutora singular e evita formas regionais ou excessivamente solenes. A redação preserva o caráter jurídico do juramento sem acrescentar a identificação contextual dos homens como espiões.
