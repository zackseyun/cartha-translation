id: JOS.2.12
reference: Joshua 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: pt
  text: E agora, por favor, jurem-me por Yahweh que, assim como agi com bondade para com vocês, vocês também agirão com bondade para com a casa de meu pai e me darão um sinal seguro[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um sinal verdadeiro”, “um sinal confiável” ou “uma garantia segura”.
    reason: A expressão אוֹת אֱמֶת admite nuances de verdade, confiabilidade e garantia; a nota preserva essa amplitude lexical.
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto o conectivo וְ quanto a transição temporal עַתָּה, marcando a passagem para o pedido urgente de Raabe.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: por favor, jurem-me
  rationale: O imperativo nifal plural exige uma ordem dirigida aos dois homens; נָא acrescenta cortesia e urgência, expressas por “por favor”.
- source_word: בַּיהוָה
  choice: por Yahweh
  rationale: A preposição indica aquele por quem o juramento deve ser feito, e o nome divino יהוה é transliterado como “Yahweh”.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: agi com bondade para com vocês
  rationale: חֶסֶד denota bondade leal e concreta. “Agi com bondade” é natural e mantém o caráter relacional da expressão sem impor terminologia teológica mais estreita.
- source_word: וַעֲשִׂיתֶם גַּם־אַתֶּם ... חֶסֶד
  choice: vocês também agirão com bondade
  rationale: No contexto do juramento solicitado, a forma verbal expressa a ação futura esperada. A repetição de “agir com bondade” conserva a reciprocidade explícita do hebraico.
- source_word: בֵּית אָבִי
  choice: a casa de meu pai
  rationale: Mantém o idioma hebraico para a família ou unidade doméstica paterna, ainda compreensível em português e sem reduzi-lo apenas à construção física.
- source_word: אוֹת אֱמֶת
  choice: um sinal seguro
  rationale: אוֹת é “sinal”, enquanto אֱמֶת aqui qualifica sua veracidade e confiabilidade. “Sinal seguro” comunica uma garantia digna de confiança sem eliminar as alternativas “verdadeiro” e “confiável”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome da aliança e evita substituí-lo por um título.
- issue: Sentido de חֶסֶד neste contexto
  choice: bondade
  alternative: lealdade; amor leal; misericórdia
  rationale: O contexto descreve uma ação leal e benevolente entre Raabe e os espias. “Bondade” preserva a dimensão ética e relacional sem transformar a palavra, por si só, em uma fórmula técnica de aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “jurem” e “vocês” reflete que Raabe se dirige aos dois espias. A repetição de “agir com bondade” procura reproduzir a reciprocidade enfática do hebraico. A vírgula final foi mantida porque o versículo continua no seguinte.
