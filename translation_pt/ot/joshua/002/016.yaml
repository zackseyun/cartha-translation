base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: pt
  text: 'Ela lhes disse: “Vão para a região montanhosa[a], para que os perseguidores não encontrem vocês[b]. Escondam-se ali por três dias, até que os perseguidores voltem. Depois, vocês poderão seguir seu caminho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o monte”; o hebraico pode se referir tanto a um monte específico quanto à região montanhosa ao redor.
    reason: lexical_alternative
  - marker: b
    text: Ou “deparem-se com vocês” ou “venham sobre vocês”; o verbo indica um encontro, que neste contexto de perseguição tem intenção hostil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: para a região montanhosa
  rationale: הַר pode designar tanto um monte específico quanto uma área montanhosa. No contexto, Raabe indica um terreno elevado e acidentado onde os espiões poderiam se esconder; “região montanhosa” expressa naturalmente o possível sentido regional sem eliminar a alternativa singular.
- source_word: לֵּכוּ
  choice: Vão
  rationale: O imperativo de הלך significa diretamente “ir”; a forma breve preserva a urgência da instrução.
- source_word: פֶּן
  choice: para que ... não
  rationale: פֶּן introduz uma precaução de sentido negativo. “Para que ... não” é corrente em português e mantém a finalidade preventiva da advertência.
- source_word: יִפְגְּעוּ בָכֶם
  choice: encontrem vocês
  rationale: פגע com ב pode significar encontrar, deparar-se com ou vir sobre alguém. “Encontrem vocês” conserva o núcleo lexical; o contexto da perseguição deixa clara a intenção hostil.
- source_word: הָרֹדְפִים
  choice: os perseguidores
  rationale: O particípio de רדף é substantivado e se refere aos que os perseguiam. “Os perseguidores” é conciso e natural.
- source_word: וְנַחְבֵּתֶם
  choice: Escondam-se
  rationale: 'A forma nifal tem aqui valor reflexivo e imperativo: os próprios homens devem se ocultar.'
- source_word: שָׁמָּה
  choice: ali
  rationale: O advérbio aponta para o lugar ao qual Raabe acaba de mandá-los; “ali” é a referência espacial mais natural em português.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: por três dias
  rationale: O acusativo hebraico indica duração; em português, a preposição “por” explicita essa função de modo idiomático.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: até que os perseguidores voltem
  rationale: עַד seguido do infinitivo construto marca o limite temporal da espera. A oração finita é a equivalência natural em português.
- source_word: וְאַחַר
  choice: Depois
  rationale: O advérbio marca a sequência posterior ao período de espera; “Depois” é claro e atual.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: vocês poderão seguir seu caminho
  rationale: O imperfeito descreve a ação seguinte permitida ou possível após a volta dos perseguidores. “Poderão seguir seu caminho” comunica essa progressão naturalmente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “vocês” para o plural e discurso direto natural. A coordenação hebraica antes de “escondam-se” foi dividida em duas frases para melhorar a fluidez sem alterar a sequência das ordens.
