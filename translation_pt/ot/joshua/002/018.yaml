  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: pt
  text: Quando entrarmos na terra, você deverá amarrar este cordão escarlate[a] na janela pela qual você nos fez descer. Você deverá reunir para dentro de sua casa seu pai, sua mãe, seus irmãos e toda a família de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “esta linha de fio escarlate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: não traduzido de modo independente
  rationale: A partícula chama a atenção para a condição que segue. Em português, a transição direta com “Quando” é mais natural; acrescentar “Veja” ou “Eis” aqui soaria artificial ou excessivamente solene.
- source_word: בָאִים בָּאָרֶץ
  choice: Quando entrarmos na terra
  rationale: O particípio, neste contexto, aponta para a entrada futura e iminente. “Entrarmos” expressa com clareza a chegada ao território.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: este cordão de fio escarlate
  rationale: A expressão combina um termo para cordão ou linha com “fio escarlate”. A tradução conserva os dois elementos sem a estranheza de uma reprodução rigidamente literal.
- source_word: תִּקְשְׁרִי
  choice: você deverá amarrar
  rationale: O imperfeito feminino singular tem valor instrucional dentro do acordo. “Deverá” mantém o caráter de estipulação em português corrente.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: na janela pela qual nos fez descer
  rationale: O hifil de ירד é causativo. “Nos fez descer” preserva essa forma e remete claramente à fuga dos homens pela janela.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: Reúna com você, dentro de casa
  rationale: A formulação mantém tanto a ideia de reunir os familiares junto de Raabe quanto o movimento para o interior da casa.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: seu pai, sua mãe, seus irmãos
  rationale: “Irmãos” corresponde ao plural masculino hebraico; o contexto não exige uma ampliação explícita para irmãos e irmãs.
- source_word: כָּל בֵּית אָבִיךְ
  choice: toda a família de seu pai
  rationale: “Casa do pai” designa aqui o grupo familiar, não o edifício. “Família de seu pai” é claro e preserva a estrutura paterna da expressão.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “você” por legibilidade brasileira. A sintaxe evita arcaísmos, mas conserva o tom vinculante das instruções. O marcador [a] aparece imediatamente após a expressão a que se refere.
