  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: pt
  text: 'Então ela disse aos homens: “Sei que Yahweh deu a terra a vocês, que o pavor que vocês inspiram caiu sobre nós[a] e que todos os habitantes da terra perderam a coragem diante de vocês[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o pavor de vocês caiu sobre nós”; isto é, o terror causado por vocês.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “derreteram-se diante de vocês”. A imagem descreve a perda da coragem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: Então ela disse aos homens
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa essa progressão com naturalidade. O artigo definido em הָאֲנָשִׁים aponta para os homens já mencionados.
- source_word: יָדַעְתִּי
  choice: Sei
  rationale: O perfeito do verbo estativo comunica um conhecimento já adquirido e ainda vigente; o presente em português expressa bem essa força.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: Yahweh deu a terra a vocês
  rationale: O perfeito apresenta a dádiva como fato estabelecido, embora a conquista ainda esteja em andamento. “Deu” é direto e natural em português, e יְהוָה é transliterado como “Yahweh”.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: o pavor que vocês inspiram caiu sobre nós
  rationale: אֵימָה indica pavor ou terror. A expansão “que vocês inspiram” evita que “pavor de vocês” seja entendido como o medo sentido pelos israelitas, enquanto “caiu sobre nós” conserva a imagem verbal hebraica.
- source_word: נָמֹגוּ
  choice: perderam a coragem
  rationale: O verbo significa literalmente “derreter-se” e, neste uso figurado, descreve o colapso da coragem. A formulação principal comunica com clareza o sentido contextual; a metáfora literal é preservada em nota.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: todos os habitantes da terra
  rationale: O particípio substantivado designa os que habitam a região. “Habitantes da terra” é conciso, corrente e preserva o alcance coletivo.
- source_word: מִפְּנֵיכֶם
  choice: diante de vocês
  rationale: A expressão pode indicar presença ou causa. “Diante de vocês” preserva a imagem espacial e deixa perceptível a aproximação ameaçadora de Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: A dádiva da terra como fato consumado enquanto a conquista continua
  choice: deu a terra a vocês
  alternative: está dando a terra a vocês
  rationale: O perfeito hebraico apresenta a entrega como realidade estabelecida na perspectiva de Raabe, sem exigir que toda a ocupação territorial já tenha ocorrido.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. Emprega “vocês” para o plural de segunda pessoa, evita arcaísmos e conserva, quando possível, as imagens do hebraico.
