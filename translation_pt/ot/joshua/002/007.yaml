  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: pt
  text: Os homens os perseguiram pelo caminho para o Jordão, até os lugares de travessia[a], e fecharam o portão assim que os perseguidores saíram atrás deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até os vaus”; isto é, os pontos rasos do Jordão por onde se podia atravessar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Os homens
  rationale: O plural definido retoma, pelo contexto, os agentes do rei enviados para procurar os homens; não se acrescenta “de Jericó”, que está apenas implícito.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: os perseguiram
  rationale: Em português, o verbo transitivo “perseguir” já incorpora a ideia expressa por אַחֲרֵי, evitando o pouco natural “perseguiram atrás deles”.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: pelo caminho do Jordão
  rationale: Preserva o sentido de rota ou caminho associado ao Jordão sem reduzir a expressão a uma direção genérica.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: até os lugares de travessia
  rationale: No contexto de deslocamento, עַל indica o ponto alcançado; מַעְבָּרוֹת designa lugares onde o rio podia ser atravessado. A formulação é clara para leitores atuais, enquanto a nota registra “vaus”.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: e fecharam o portão
  rationale: Mantém o sujeito indeterminado do plural hebraico e traduz o portão definido sem explicitar “da cidade”, informação contextual.
- source_word: כַּאֲשֶׁר יָצְאוּ
  choice: assim que ... saíram
  rationale: Expressa naturalmente a sequência temporal imediata sugerida pelo contexto, sem alterar o aspecto narrativo.
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: os perseguidores saíram atrás deles
  rationale: O particípio substantivado é vertido por “os perseguidores”, e “atrás deles” conserva a repetição e o movimento da expressão hebraica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Lugares de travessia” prioriza compreensão ampla; “vaus” é preservado na nota como equivalente mais técnico.
