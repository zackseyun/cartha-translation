- from: Os homens os perseguiram pelo caminho do Jordão, até os lugares de travessia[a], e fecharam o portão assim que os perseguidores saíram atrás deles.
  to: Os homens os perseguiram pelo caminho para o Jordão, até os lugares de travessia[a], e fecharam o portão assim que os perseguidores saíram atrás deles.
  rationale: A única revisão substitui «do Jordão» por «para o Jordão», para expressar com maior precisão que a perseguição seguiu pela rota que levava ao rio. O restante preserva satisfatoriamente o sentido, a sequência narrativa e a terminologia do hebraico.
