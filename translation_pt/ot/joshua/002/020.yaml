id: JOS.2.20
reference: Joshua 2:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: pt
  text: Mas, se você revelar este nosso assunto[a], ficaremos livres do juramento que você nos fez prestar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esta nossa questão” ou “este nosso negócio”. A palavra hebraica pode se referir amplamente a uma palavra, questão ou assunto; aqui aponta para a missão secreta dos espiões.
    reason: lexical_alternative
  - marker: b
    text: Ou “seremos inocentes quanto ao juramento”. A expressão hebraica significa que eles já não estariam obrigados pelo juramento caso ela revelasse o segredo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mas, se
  rationale: A combinação da conjunção com a partícula condicional introduz uma condição contrastante em relação à promessa anterior; “Mas, se” expressa naturalmente essa ressalva.
- source_word: תַּגִּידִי
  choice: você revelar
  rationale: O hifil de נגד significa declarar, contar ou tornar conhecido. No contexto de uma missão secreta, “revelar” comunica com clareza a divulgação indevida.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: este nosso assunto
  rationale: דבר pode indicar palavra, assunto ou questão. Aqui se refere ao assunto secreto dos espiões; a formulação preserva tanto o demonstrativo quanto a relação expressa pelo sufixo.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: ficaremos livres
  rationale: A construção היה + נקי expressa isenção de obrigação ou responsabilidade. “Ficaremos livres” comunica que o juramento deixaria de vinculá-los.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: do juramento
  rationale: A preposição מן indica liberação do vínculo. Em português, o relativo subsequente identifica naturalmente o juramento como aquele que Raabe exigiu deles, evitando a possível ambiguidade de “seu juramento”.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: que você nos fez prestar
  rationale: 'O hifil de שׁבע é causativo: Raabe fez com que os homens jurassem. “Fez prestar [o juramento]” é idiomático e mantém essa força causativa.'
theological_decisions: []
