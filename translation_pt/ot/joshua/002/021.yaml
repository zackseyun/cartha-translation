base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: pt
  text: 'Ela respondeu: “Conforme vocês disseram, assim seja.” Então ela os mandou embora, e eles partiram. Ela amarrou o cordão escarlate[a] na janela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fio escarlate”. A expressão hebraica pode designar um cordão, fio ou corda usado como sinal visível.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: conforme vocês disseram
  rationale: Expressa naturalmente em português a conformidade com as palavras dos dois homens, mantendo o referente plural do sufixo hebraico.
- source_word: כֵּן הוּא
  choice: Seja
  rationale: No contexto, a expressão comunica assentimento aos termos apresentados; “Seja” preserva essa força de modo conciso e digno.
- source_word: וַתְּשַׁלְּחֵם
  choice: os deixou partir
  rationale: Traduz o ato de mandá-los embora ou permitir que partissem sem sugerir uma despedida formal.
- source_word: וַיֵּלֵכוּ
  choice: eles se foram
  rationale: Representa diretamente o verbo de movimento na sequência narrativa e evita a repetição pouco natural de “partir”.
- source_word: וַתִּקְשֹׁר
  choice: amarrou
  rationale: É o equivalente português mais direto e natural para prender o cordão com um nó.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: o cordão escarlate
  rationale: Neste contexto, תִּקְוָה designa concretamente um fio, cordão ou corda usado como sinal visível, e não “esperança”; “cordão escarlate” comunica bem o objeto e sua cor.
- source_word: בַּחַלּוֹן
  choice: na janela
  rationale: A preposição indica o local em que o cordão foi amarrado; “na janela” é a formulação mais natural em português.
