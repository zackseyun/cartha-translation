  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: pt
  text: Antes que eles se deitassem[a], ela subiu até eles no terraço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Antes que eles fossem dormir”. O verbo hebraico significa literalmente “deitar-se”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: Antes que
  rationale: Marca que a ação dela ocorreu anteriormente à ação expressa pelo verbo seguinte; em português, a construção natural exige o subjuntivo.
- source_word: יִשְׁכָּבוּן
  choice: eles se deitassem
  rationale: O verbo שׁכב significa literalmente “deitar-se”. No contexto, pode sugerir que iam dormir, mas a tradução mantém o sentido físico sem explicitar o sono.
- source_word: עָלְתָה
  choice: ela subiu
  rationale: O qal de עלה expressa movimento para cima; “subiu” é a forma direta e natural em português.
- source_word: עֲלֵיהֶם
  choice: até eles
  rationale: Com verbo de movimento e referente pessoal, a preposição indica aproximação; “até eles” comunica naturalmente o movimento em direção aos homens.
- source_word: עַל הַגָּג
  choice: no terraço
  rationale: גָּג designa o teto plano usado como espaço acessível nas casas da região. “Terraço” evita a impressão moderna de um telhado inclinado e é idiomático em português.
- source_word: וְהֵמָּה ... וְהִיא
  choice: eles ... ela
  rationale: Os pronomes explícitos contrastam os participantes; a estrutura “Antes que eles..., ela...” preserva esse contraste.
