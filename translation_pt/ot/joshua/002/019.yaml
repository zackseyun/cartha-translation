  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: And it shall be that anyone who goes out from the doors of your house to the outside—his blood shall be on his own head[a], and we shall be innocent[b]. But everyone who is with you in the house—his blood shall be on our heads if a hand is laid on him.
translation:
  language: pt
  text: Quem sair pelas portas da sua casa para fora terá o seu sangue sobre a própria cabeça[a], e nós seremos inocentes. Mas o sangue de todo aquele que estiver com você dentro da casa estará sobre as nossas cabeças, se alguém puser a mão nele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, ele mesmo será responsável pela própria morte. Literalmente, “o sangue dele estará sobre a cabeça dele”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “se uma mão estiver sobre ele”, expressão que indica que alguém lhe faça mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Quem sair...
  rationale: A fórmula hebraica introduz a consequência da condição. Em português, a construção futura com oração condicional transmite naturalmente essa função sem a rigidez de “e acontecerá que”.
- source_word: כֹּל אֲשֶׁר
  choice: Quem / todo aquele que
  rationale: Expressa distributivamente qualquer pessoa. A variação é idiomática e mantém o singular representativo do hebraico.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: sair pelas portas da sua casa para fora
  rationale: Conserva a imagem concreta das portas e o movimento em direção ao exterior, sem acrescentar “rua”, que não consta do hebraico.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: terá o seu sangue sobre a própria cabeça
  rationale: Preserva o idioma jurídico de culpa ou responsabilidade pelo derramamento de sangue; “própria” explicita o valor reflexivo no português.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: e nós seremos inocentes
  rationale: נְקִיִּם indica isenção de culpa ou responsabilidade. “Inocentes” é claro e adequado ao contexto solene.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: Mas ... todo aquele que estiver com você dentro da casa
  rationale: “Mas” torna claro o contraste entre quem sai e quem permanece. “Com você” preserva a relação pessoal, e “dentro da casa” explicita naturalmente a localização.
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: o sangue ... estará sobre a nossa cabeça
  rationale: Mantém o paralelismo e o idioma de responsabilidade do original. O singular coletivo “cabeça” é mais natural em português com “nossa”, embora o hebraico use a forma plural.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: se alguém puser a mão nele
  rationale: Reproduz o idioma hebraico sem determinar mais do que o texto determina; no contexto, a expressão implica ação lesiva contra a pessoa.
theological_decisions:
- issue: Manutenção do idioma de culpa de sangue
  choice: “terá o seu sangue sobre a própria cabeça / estará sobre a nossa cabeça” no texto principal
  alternative: “será responsável pela própria morte / seremos responsáveis pela morte dele”
  rationale: A formulação figurada conserva a solenidade jurídica e pactual do hebraico, enquanto a nota esclarece seu sentido sem substituir a imagem.
- issue: Singular masculino representativo
  choice: “todo aquele” e “nele”
  alternative: Formulação plural ou totalmente neutra
  rationale: O hebraico emprega formas masculinas singulares para uma pessoa indefinida. O português mantém esse caráter distributivo e jurídico sem restringir a referência apenas a homens.
- issue: Alcance de אִם יָד תִּהְיֶה בּוֹ
  choice: Preservar a imagem “se alguém puser a mão nele”
  alternative: “se lhe fizerem algum mal”
  rationale: A imagem permite a amplitude do idioma hebraico — ação hostil ou dano — sem especificar indevidamente a natureza ou o agente da agressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se os idiomas jurídicos do hebraico no texto principal, esclarecidos em notas. A construção evita arcaísmos como “será que” ou “sucederá”, sem perder a solenidade da estipulação.
