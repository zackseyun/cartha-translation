source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: pt
  text: Quando ouvimos isso, nossos corações se derreteram, e já não restou ânimo em ninguém[a] por causa de vocês, pois Yahweh, o Deus de vocês[b], é Deus nos céus acima e na terra abaixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já não houve coragem em ninguém”. Literalmente: “não se levantou mais espírito em ninguém”.'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” representa o nome divino YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: Quando ouvimos isso
  rationale: A forma narrativa introduz temporalmente a reação de Raabe e dos habitantes. “Isso” retoma naturalmente os acontecimentos relatados no contexto anterior.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: nossos corações se derreteram
  rationale: Conserva a imagem hebraica de o coração derreter-se, que expressa medo e perda de coragem, em formulação natural em português.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: já não restou ânimo em ninguém
  rationale: רוּחַ designa aqui o ânimo ou a coragem interior, não o Espírito Santo nem simplesmente o fôlego. A redação comunica o sentido idiomático, enquanto a nota preserva a expressão mais literal.
- source_word: מִפְּנֵיכֶם
  choice: por causa de vocês
  rationale: Embora a expressão seja literalmente ligada à presença ou face, neste contexto indica a causa do temor dos cananeus.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão explicativa do medo descrito anteriormente, em registro digno e corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino YHWH, preservando-o como nome pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: Refere-se ao Deus de Israel e está em aposição ao nome divino. “De vocês” é claro e amplamente compreensível no português moderno.
- source_word: הוּא אֱלֹהִים
  choice: é Deus
  rationale: Afirma diretamente a identidade e soberania de Yahweh sem acrescentar qualificadores como “único” ou “verdadeiro”, que não estão expressos nessa oração.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: nos céus, lá em cima
  rationale: Mantém o plural hebraico e a indicação espacial, além de formar o primeiro elemento do merismo céus-terra.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: e sobre a terra, aqui embaixo
  rationale: Completa o merismo que apresenta a soberania universal de Deus e preserva o contraste vertical do hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto emprega diretamente o Tetragrama. A transliteração “Yahweh” preserva o nome divino revelado, sem o substituir por um título.
- issue: Alcance da confissão de Raabe
  choice: é Deus nos céus, lá em cima, e sobre a terra, aqui embaixo
  alternative: é o único Deus; é o Deus verdadeiro
  rationale: O hebraico afirma a divindade e a soberania universal de Yahweh por meio do merismo céus-terra. A tradução mantém essa afirmação sem inserir marcadores explícitos de exclusividade ausentes da oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais ao leitor brasileiro sem regionalismos marcados. A imagem dos corações que se derretem foi preservada, enquanto a segunda expressão idiomática foi vertida pelo sentido e esclarecida em nota.
