  text: וַ/תִּקַּ֧ח הָֽ/אִשָּׁ֛ה אֶת שְׁנֵ֥י הָ/אֲנָשִׁ֖ים וַֽ/תִּצְפְּנ֑/וֹ וַ/תֹּ֣אמֶר כֵּ֗ן בָּ֤אוּ אֵלַ/י֙ הָֽ/אֲנָשִׁ֔ים וְ/לֹ֥א יָדַ֖עְתִּי מֵ/אַ֥יִן הֵֽמָּה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: pt
  text: 'Mas a mulher havia levado os dois homens e os escondido[a]. Então disse: “Sim, os homens vieram até mim, mas eu não sabia de onde eram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz um sufixo singular, literalmente “e o escondeu”, embora o contexto se refira coletivamente aos dois homens; por isso, “os havia escondido”.
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: havia levado
  rationale: O mais-que-perfeito composto apresenta a ação como anterior à fala dirigida aos mensageiros e produz uma sequência narrativa natural em português.
- source_word: הָאִשָּׁה
  choice: a mulher
  rationale: No contexto, a expressão identifica Raabe como mulher, sem indicar que seja esposa de alguém.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: os dois homens
  rationale: A expressão designa os dois homens israelitas; esta é a forma direta e natural em português.
- source_word: וַתִּצְפְּנוֹ
  choice: os escondido
  rationale: Embora o sufixo hebraico esteja no singular, o antecedente contextual são os dois homens; o pronome plural torna clara a referência sem apagar a irregularidade, registrada em nota.
- source_word: וַתֹּאמֶר
  choice: Então disse
  rationale: Traduz o introdutor narrativo de fala de modo conciso e natural; o sujeito feminino permanece claro pelo contexto.
- source_word: כֵּן
  choice: Sim
  rationale: Expressa a confirmação direta de que os homens estiveram com ela.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: os homens vieram até mim
  rationale: Mantém o conteúdo e a ordem informacional da declaração em português corrente.
- source_word: וְלֹא יָדַעְתִּי
  choice: mas eu não sabia
  rationale: 'A conjunção tem aqui valor adversativo: Raabe admite a chegada dos homens, mas nega conhecer sua procedência.'
- source_word: מֵאַיִן הֵמָּה
  choice: de onde eram
  rationale: Forma idiomática e concisa de indicar a origem ou procedência deles.
