base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: pt
  text: 'Disse-se ao rei de Jericó: “Olhe! Homens israelitas vieram para cá esta noite para sondar[a] a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espiar”. O verbo hebraico pode ter o sentido de procurar, investigar ou sondar e, neste contexto, refere-se a uma missão de reconhecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: Disse-se
  rationale: A construção impessoal preserva o agente não identificado do hebraico sem acrescentar “alguém” nem um sujeito plural explícito.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: ao rei de Jericó
  rationale: Reproduz com clareza e naturalidade o título político e sua relação com a cidade.
- source_word: לֵאמֹר
  choice: introdução por dois-pontos e discurso direto
  rationale: O infinitivo introduz o conteúdo da fala; a pontuação é a forma natural de expressá-lo em português.
- source_word: הִנֵּה
  choice: Olhe!
  rationale: Conserva a função de chamar urgentemente a atenção do rei, em linguagem moderna e sem o tom arcaico de “Eis”.
- source_word: אֲנָשִׁים
  choice: Alguns homens
  rationale: O substantivo designa pessoas do sexo masculino; “alguns” torna natural em português a referência indefinida do hebraico.
- source_word: בָּאוּ הֵנָּה
  choice: vieram para cá
  rationale: Expressa a chegada ao lugar do falante e sua relevância imediata no relato.
- source_word: הַלַּיְלָה
  choice: esta noite
  rationale: É a forma idiomática para a noite em curso à qual o relato se refere.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: vindos do meio dos israelitas
  rationale: Comunica tanto a procedência quanto a pertença ao povo de Israel, sem a formulação rígida “dos filhos de Israel”.
- source_word: לַחְפֹּר
  choice: examinar
  rationale: O verbo pode denotar procurar, investigar ou sondar; neste contexto, refere-se ao reconhecimento da terra. “Examinar” preserva o sentido investigativo sem explicitar no texto principal a interpretação mais específica “espiar”.
- source_word: אֶת הָאָרֶץ
  choice: a terra
  rationale: Mantém a designação territorial simples do hebraico, cujo referente é fornecido pelo contexto.
