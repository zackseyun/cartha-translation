  language: pt
  text: Ela, porém, os havia levado ao terraço e os escondido entre os talos de linho que estavam dispostos para ela sobre o terraço.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל־הַגָּג
  choice: ao terraço / sobre o terraço
  rationale: No contexto de uma casa antiga com cobertura plana e utilizável, “terraço” comunica melhor em português moderno do que “telhado”.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: entre os talos de linho
  rationale: A expressão designa o linho ainda em forma de hastes ou talos, provavelmente posto para secar; “talos” é claro e concreto.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: que tinha disposto para si
  rationale: Preserva o particípio passivo feminino plural e o pronome dativo לָהּ, sem omitir a ideia de que os talos estavam arranjados para uso dela.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de anterioridade (“havia levado”) adequada ao esclarecimento narrativo do versículo. “Ela, porém” mantém a transição contrastiva do וְ inicial.
