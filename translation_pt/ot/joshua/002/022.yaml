  text: וַ/יֵּלְכוּ֙ וַ/יָּבֹ֣אוּ הָ/הָ֔רָ/ה וַ/יֵּ֤שְׁבוּ שָׁם֙ שְׁלֹ֣שֶׁת יָמִ֔ים עַד שָׁ֖בוּ הָ/רֹדְפִ֑ים וַ/יְבַקְשׁ֧וּ הָ/רֹדְפִ֛ים בְּ/כָל הַ/דֶּ֖רֶךְ וְ/לֹ֥א מָצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: pt
  text: Então eles partiram, chegaram à região montanhosa[a] e ficaram ali três dias, até que os perseguidores voltaram. Os perseguidores procuraram por todo o caminho, mas não os encontraram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao monte” ou “para os montes”. O hebraico provavelmente se refere à região montanhosa a oeste de Jericó, e não a um único pico.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: partiram, chegaram
  rationale: Os dois verbos narrativos expressam movimentos sucessivos. Em português natural, “partiram, chegaram” preserva a sequência sem reproduzir de modo rígido o idiomatismo hebraico “foram e vieram”.
- source_word: הָהָרָה
  choice: à região montanhosa
  rationale: O ה direcional indica movimento para a área elevada. No contexto geográfico a oeste de Jericó, a expressão pode designar uma região de montes, e não necessariamente um pico isolado.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: ficaram ali
  rationale: ישׁב indica aqui permanência temporária, não residência duradoura; “ficaram” é claro e corrente.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: três dias
  rationale: Tradução direta da expressão temporal.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: até que os perseguidores voltaram
  rationale: 'שׁוב significa voltar, e o particípio רֹדְפִים funciona como substantivo: “os perseguidores”.'
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים
  choice: Os perseguidores procuraram
  rationale: בקשׁ, neste contexto de perseguição, descreve a busca feita pelos perseguidores; “procuraram” é idiomático em português.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: por todo o caminho
  rationale: A expressão indica uma busca ao longo de toda a rota ou estrada, preservando a força abrangente de כּל.
- source_word: וְלֹא מָצָאוּ
  choice: mas não os encontraram
  rationale: O objeto, embora implícito no hebraico, é recuperado pelo contexto. “Mas” torna natural em português o contraste contextual expresso pela coordenação hebraica.
