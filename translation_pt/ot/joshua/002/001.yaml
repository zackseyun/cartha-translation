  naturalness: A redação é clara e de registro moderno. A reordenação de «de Sitim» e «em segredo» torna mais transparente que Sitim é o ponto de partida e que o sigilo caracteriza a missão. Os marcadores são posicionados junto aos termos a que se referem e antes da pontuação de encerramento.
  terminology: «Josué», «Num», «Sitim», «Jericó» e «Raabe» seguem formas bíblicas portuguesas consolidadas. «Prostituta» é o equivalente lexical normal de זונה. Na nota alternativa, «hospedeira» é impreciso para a proposta interpretativa de «innkeeper»; «dona de hospedaria» comunica melhor a alegação sem a apresentar como sentido principal.
