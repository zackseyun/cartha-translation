source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: pt
  text: 'Então Josué, filho de Num, enviou dois homens de Sitim, em segredo, como espiões, dizendo: “Vão e observem a terra e Jericó[a].” Eles foram, entraram na casa de uma prostituta chamada Raabe[b] e deitaram-se ali[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “a terra, especialmente Jericó”; o hebraico diz literalmente “a terra e Jericó”.
    reason: ambiguity
  - marker: b
    text: Alguns propõem “dona de hospedaria”, com base no contexto ou em tradição posterior, mas a palavra hebraica normalmente significa “prostituta”.
    reason: alternative_reading
  - marker: c
    text: Ou “hospedaram-se ali” ou “passaram a noite ali”. O hebraico diz literalmente “deitaram-se ali”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Equivalente narrativo direto e natural para o verbo שלח.
- source_word: מִן הַשִּׁטִּים
  choice: de Sitim
  rationale: Mantém o topônimo por transliteração, conforme o uso bíblico corrente em português.
- source_word: שְׁנַיִם אֲנָשִׁים מְרַגְּלִים
  choice: dois homens como espiões
  rationale: Preserva tanto o número e o gênero dos agentes quanto a função expressa pelo particípio.
- source_word: חֶרֶשׁ
  choice: em segredo
  rationale: O termo funciona adverbialmente e indica o caráter sigiloso da missão, sem especificar mais do que o hebraico.
- source_word: לְכוּ רְאוּ
  choice: Vão e observem
  rationale: “Observem” comunica neste contexto a inspeção atenta da terra, mantendo a sequência de imperativos.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: a terra e Jericó
  rationale: Reproduz a coordenação explícita do hebraico sem transformar Jericó, no texto principal, em mera explicação ou especificação da terra.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: na casa de uma prostituta
  rationale: זוֹנָה designa normalmente uma prostituta; “hospedeira” é uma interpretação minoritária e lexicalmente menos direta.
- source_word: וּשְׁמָהּ רָחָב
  choice: chamada Raabe
  rationale: Formulação portuguesa natural que preserva a identificação nominal da mulher.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: deitaram-se ali
  rationale: Mantém o sentido literal de שכב e evita afirmar tanto uma relação sexual quanto um arranjo formal de hospedagem.
theological_decisions:
- issue: Ocupação de Raabe (זוֹנָה)
  choice: prostituta
  alternative: hospedeira
  rationale: O sentido lexical comum é “prostituta”. A alternativa “hospedeira” depende do contexto ou de tradição posterior e não deve substituir no texto principal a leitura mais direta.
- issue: Sentido de וַיִּשְׁכְּבוּ שָׁמָּה
  choice: deitaram-se ali
  alternative: hospedaram-se ali / passaram a noite ali
  rationale: A tradução literal conserva a tensão narrativa. O contexto pode indicar pernoite, mas o verso não declara atividade sexual nem descreve explicitamente hospedagem formal.
- issue: Relação entre “a terra” e “Jericó”
  choice: a terra e Jericó
  alternative: a terra, especialmente Jericó
  rationale: A conjunção hebraica coordena os dois objetos. Embora Jericó provavelmente seja o foco específico da missão, explicitar “especialmente” resolveria uma relação que o texto deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com formas correntes no Brasil e compreensão internacional. Os nomes seguem grafias bíblicas portuguesas consolidadas. A ordem foi levemente ajustada para fluência, sem eliminar ambiguidades relevantes do hebraico.
