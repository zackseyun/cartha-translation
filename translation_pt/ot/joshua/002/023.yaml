  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: pt
  text: Então os dois homens voltaram, desceram da região montanhosa, atravessaram e foram até Josué, filho de Num. Eles lhe contaram tudo o que lhes tinha acontecido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tudo o que lhes sucedera”; mais literalmente, “todas as coisas que os encontraram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: voltaram
  rationale: O verbo שׁוב, nesta sequência narrativa, indica que os homens retornaram da missão; “voltaram” é claro e natural.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: os dois homens
  rationale: Preserva a designação do hebraico sem acrescentar “espiões”, embora o contexto identifique sua função.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: desceram da região montanhosa
  rationale: הָהָר pode designar uma área de montes, e não apenas uma montanha isolada; a formulação corresponde à geografia do relato.
- source_word: וַיַּעַבְרוּ
  choice: atravessaram
  rationale: Mantém o objeto não expresso, como no hebraico, sem especificar indevidamente o que atravessaram.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: foram até Josué, filho de Num
  rationale: בוא com אֶל indica chegar ou dirigir-se a alguém; “foram até” soa natural em português, e o patronímico é preservado.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Eles lhe contaram
  rationale: O piel de ספר significa contar ou relatar; a escolha é corrente e preserva o destinatário pronominal.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: tudo o que lhes tinha acontecido
  rationale: A construção com מצא é idiomática e se refere ao que lhes sobreveio. A tradução comunica esse sentido com naturalidade e preserva a totalidade de כָּל.
