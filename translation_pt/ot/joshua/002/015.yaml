  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: pt
  text: Então ela os fez descer por uma corda, através da janela, pois a casa dela ficava na muralha,[a] e ela morava na muralha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “a casa dela ficava sobre a muralha, e ela morava sobre a muralha”. O hebraico situa a moradia em ou sobre a estrutura da muralha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: Então ela os fez descer
  rationale: 'O hifil de ירד expressa causação: ela fez com que eles descessem. A formulação preserva esse valor causativo, e “Então” acompanha a progressão narrativa do waw consecutivo.'
- source_word: בַּחֶבֶל
  choice: por uma corda
  rationale: חֶבֶל significa “corda” ou “cordão”; a preposição indica aqui o meio empregado. “Por uma corda” é uma expressão portuguesa natural para a descida efetuada com o auxílio de uma corda.
- source_word: בְּעַד הַחַלּוֹן
  choice: pela janela
  rationale: בְּעַד indica passagem através de uma abertura. “Pela janela” comunica de modo claro e natural que eles saíram através dela.
- source_word: כִּי
  choice: pois
  rationale: כִּי introduz a explicação de como essa fuga pela janela era possível. “Pois” mantém a ligação causal sem tornar a frase pesada.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: a casa dela ficava na muralha da cidade
  rationale: A expressão situa a casa em ou sobre a estrutura da muralha. “Ficava na muralha da cidade” é natural em português e evita especificar uma configuração arquitetônica que o hebraico não define com precisão.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: e era na muralha que ela morava
  rationale: ישׁב tem aqui o sentido de habitar ou morar. A construção enfática reproduz a repetição do hebraico e expressa residência contínua, sem sugerir que ela morava literalmente dentro da alvenaria.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “muralha” foi mantida porque reflete a ênfase do hebraico; “a casa dela” soa mais natural do que “sua casa” neste contexto e evita qualquer ambiguidade de referente.
