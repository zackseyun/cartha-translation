  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: pt
  text: Pois ouvimos como Yahweh secou diante de vocês as águas do mar Vermelho[a], quando vocês saíram do Egito, e o que vocês fizeram aos dois reis amorreus que estavam do outro lado do Jordão — Seom e Ogue —, os quais vocês consagraram à destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, Yam Suf, tradicionalmente “mar Vermelho”; mais literalmente, “mar de Juncos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação de Raabe para o temor mencionado no contexto anterior, preservando a ligação causal e discursiva.
- source_word: שָׁמַעְנוּ
  choice: ouvimos
  rationale: O perfeito hebraico relata algo já ouvido cujos efeitos continuam presentes; em português, o pretérito perfeito é a forma mais natural.
- source_word: הוֹבִישׁ
  choice: secou
  rationale: O hifil de יבש expressa fazer secar; a formulação é direta, idiomática e adequada ao objeto 'as águas'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: מֵי יַם סוּף
  choice: as águas do mar Vermelho
  rationale: Mantém a designação geográfica tradicional e inteligível em português, enquanto a tradução mais literal do nome hebraico é registrada em nota.
- source_word: מִפְּנֵיכֶם
  choice: diante de vocês
  rationale: Expressa naturalmente que as águas foram removidas do caminho dos israelitas.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: quando vocês saíram do Egito
  rationale: Traduz naturalmente o infinitivo construto temporal sem perder a referência ao êxodo.
- source_word: עֲשִׂיתֶם
  choice: o que vocês fizeram
  rationale: Preserva a amplitude do verbo hebraico antes que a oração relativa especifique a destruição.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: aos dois reis dos amorreus
  rationale: Segue de perto a construção hebraica e permanece clara em português moderno.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: que estavam do outro lado do Jordão
  rationale: Localiza os reis a leste do Jordão a partir da perspectiva narrativa, com uma expressão portuguesa natural.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: Seom e Ogue
  rationale: Identifica em aposição os dois reis; os nomes seguem formas portuguesas bíblicas reconhecíveis.
- source_word: הֶחֱרַמְתֶּם
  choice: vocês consagraram à destruição
  rationale: Conserva o componente de dedicação ou colocação sob ḥerem, bem como seu resultado destrutivo, sem reduzi-lo a uma simples derrota militar.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome próprio divino; a transliteração preserva essa distinção sem substituí-lo por um título.
- issue: Linguagem de חרם
  choice: consagraram à destruição
  alternative: destruíram completamente; colocaram sob anátema
  rationale: A escolha mantém tanto a ideia de destinação sob ḥerem quanto a consequência de destruição, evitando achatar o termo em mera ação militar ou usar um tecnicismo pouco transparente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por 'vocês' para a segunda pessoa plural. A sintaxe acompanha o desenvolvimento do hebraico sem artificialidade; o travessão destaca a aposição dos nomes dos reis.
