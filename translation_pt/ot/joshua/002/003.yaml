  text: וַ/יִּשְׁלַח֙ מֶ֣לֶךְ יְרִיח֔וֹ אֶל רָחָ֖ב לֵ/אמֹ֑ר ה֠וֹצִיאִי הָ/אֲנָשִׁ֨ים הַ/בָּאִ֤ים אֵלַ֨יִ/ךְ֙ אֲשֶׁר בָּ֣אוּ לְ/בֵיתֵ֔/ךְ כִּ֛י לַ/חְפֹּ֥ר אֶת כָּל הָ/אָ֖רֶץ בָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: pt
  text: 'Então o rei de Jericó mandou dizer a Raabe: “Traga para fora os homens que vieram até você e entraram em sua casa, pois eles vieram para investigar[a] toda a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “espiar toda a terra”. Neste contexto, o verbo hebraico pode se referir a uma missão de reconhecimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mandou dizer
  rationale: O verbo significa literalmente “enviou”; com um destinatário e discurso direto, “mandou dizer” expressa naturalmente em português o envio da mensagem sem acrescentar mensageiros ao texto.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: o rei de Jericó
  rationale: Reproduz de modo claro e natural a relação construta e seu sentido definido no contexto narrativo.
- source_word: אֶל רָחָב
  choice: a Raabe
  rationale: A preposição marca a destinatária da mensagem; “a Raabe” é a construção portuguesa natural depois de “mandou dizer”.
- source_word: הוֹצִיאִי
  choice: Traga para fora
  rationale: O imperativo causativo feminino singular ordena a Raabe que faça os homens saírem; esta formulação conserva a força direta da ordem em português corrente.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: O substantivo se refere especificamente aos dois homens mencionados no contexto.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: que vieram até você
  rationale: A oração relativa comunica o valor descritivo do particípio e o referente feminino singular do sufixo por meio de “você”, amplamente compreensível.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: e entraram em sua casa
  rationale: “Entraram” explicita naturalmente o movimento para dentro indicado pela construção, enquanto a coordenação evita uma sequência pesada de duas orações relativas.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão apresentada para a ordem e mantém um registro digno, porém corrente.
- source_word: לַחְפֹּר
  choice: para investigar
  rationale: Neste contexto, o verbo indica busca investigativa ou reconhecimento. “Investigar” preserva essa amplitude sem impor no texto principal o sentido militar mais específico de “espiar”.
- source_word: אֶת כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Refere-se à totalidade da terra ou região em questão, não ao planeta; a formulação conserva a expressão hebraica sem acrescentar um demonstrativo.
- source_word: בָּאוּ
  choice: eles vieram
  rationale: O pretérito perfeito é natural em português e apresenta a chegada como fato consumado relevante para a acusação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição hebraica de “vieram” foi parcialmente preservada, enquanto a segunda ocorrência foi vertida como “entraram” para comunicar o movimento para dentro da casa. O marcador da nota foi colocado junto ao verbo que ela esclarece.
