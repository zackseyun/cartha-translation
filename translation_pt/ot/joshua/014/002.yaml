  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: pt
  text: Eles receberam a sua herança por sorteio, conforme Yahweh havia ordenado por meio de Moisés[a], para as nove tribos e a meia tribo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela mão de Moisés”; expressão hebraica que indica mediação ou agência.
    reason: alternativa lexical e esclarecimento de idioma hebraico
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: por sorteio
  rationale: A preposição בְּ indica meio ou modo, e גּוֹרָל se refere ao procedimento de lançar sortes. “Por sorteio” expressa isso de modo natural e claro em português.
- source_word: נַחֲלָתָם
  choice: a sua herança
  rationale: נַחֲלָה designa aqui a terra recebida como herança ou porção concedida. “A sua herança” preserva a linguagem pactual e territorial sem explicitação excessiva.
- source_word: כַּאֲשֶׁר
  choice: conforme
  rationale: Introduz a correspondência entre a distribuição e a ordem divina anterior. “Conforme” é natural e preciso neste contexto.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O perfeito hebraico aponta para uma ordem anterior à distribuição narrada; o mais-que-perfeito deixa clara essa relação temporal em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: בְּיַד מֹשֶׁה
  choice: por meio de Moisés
  rationale: A expressão literalmente relacionada à “mão” é um idioma hebraico de mediação ou agência. “Por meio de Moisés” comunica seu sentido em português atual.
- source_word: לְתִשְׁעַת הַמַּטּוֹת
  choice: para as nove tribos
  rationale: A preposição לְ marca aqui os destinatários da herança, e מַטֶּה significa “tribo” neste contexto.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: e a meia tribo
  rationale: A expressão se refere à metade de uma tribo, contextualmente a meia tribo de Manassés que receberia território a oeste do Jordão. “A meia tribo” é conciso e convencional.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal do Deus de Israel sem substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A oração verbal “Eles receberam” supre naturalmente a construção elíptica hebraica no contexto da distribuição da terra. O marcador da nota foi colocado junto à expressão a que de fato se refere.
