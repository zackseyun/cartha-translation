  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: pt
  text: Eu tinha quarenta anos quando Moisés, servo de Yahweh, me enviou de Cades-Barneia para explorar a terra, e eu lhe trouxe um relato conforme o que estava no meu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e lhe trouxe uma palavra conforme o que estava no meu coração».'
    reason: Alternativa mais literal para a construção hebraica de trazer de volta uma palavra, preservando também a formulação referente ao coração.
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: Eu tinha quarenta anos
  rationale: Expressa naturalmente em português o idiomatismo hebraico de idade, literalmente «filho de quarenta anos».
- source_word: בִּשְׁלֹחַ
  choice: quando ... me enviou
  rationale: O infinitivo construto com בְּ indica circunstância temporal; esta formulação é clara e idiomática.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: «Servo» preserva o título honroso de Moisés em sua relação com Deus, sem a conotação inadequadamente restrita de «escravo» neste contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: de Cades-Barneia
  rationale: Emprega uma forma portuguesa reconhecível do topônimo composto.
- source_word: לְרַגֵּל
  choice: para explorar
  rationale: No contexto de reconhecimento territorial, «explorar» comunica a investigação da terra com naturalidade; evita a possível impressão moderna de espionagem clandestina contra indivíduos.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém o termo recorrente em Josué para o território prometido, sem explicitação interpretativa adicional.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: e eu lhe trouxe um relato
  rationale: Traduz idiomaticamente a construção hebraica «fazer voltar/trazer de volta uma palavra», cujo sentido contextual é comunicar um relato.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: conforme o que estava no meu coração
  rationale: Preserva a metáfora hebraica do coração e a possível referência à convicção ou avaliação interior de Calebe, sem reduzi-la apenas a sinceridade ou integridade.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama; «Yahweh» preserva o nome da aliança e segue a orientação do projeto sem substituir o nome por um título.
- issue: Sentido da declaração sobre o coração de Calebe
  choice: conforme o que estava no meu coração
  alternative: com toda a sinceridade; segundo a minha convicção
  rationale: A redação mantém a tensão entre relato fiel, convicção interior e sinceridade, sem impor uma interpretação teológica ou moral mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez. «Cades-Barneia» segue forma portuguesa do topônimo; «Yahweh» conserva o nome divino. O marcador [a] aparece no texto principal.
