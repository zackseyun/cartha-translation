  text: וְ/אַחַ/י֙ אֲשֶׁ֣ר עָל֣וּ עִמִּ֔/י הִמְסִ֖יו אֶת לֵ֣ב הָ/עָ֑ם וְ/אָנֹכִ֣י מִלֵּ֔אתִי אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/008.yaml
  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: pt
  text: Mas meus irmãos que subiram comigo fizeram o coração do povo desfalecer, enquanto eu segui plenamente o SENHOR, meu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: meus irmãos
  rationale: Reproduz o sentido literal e natural do termo hebraico para os companheiros israelitas que subiram com Calebe.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: fizeram o coração do povo desfalecer
  rationale: Preserva a imagem hebraica do coração que perde a firmeza por medo, sem reduzi-la apenas a uma explicação abstrata como 'desanimaram'.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: segui plenamente
  rationale: Expressa a ideia idiomática de seguir com inteireza ou fidelidade completa; evita a tradução portuguesa pouco natural 'enchi atrás de'.
- source_word: יְהוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino YHWH por SENHOR em versaletes tipográficos.
theological_decisions:
- issue: Contraste entre a reação dos outros espias e a fidelidade de Calebe
  choice: enquanto eu segui plenamente
  alternative: mas eu segui plenamente
  rationale: A conjunção hebraica permite valor contrastivo; 'enquanto' conserva o contraste circunstancial sem acrescentar uma relação teológica não expressa.
- issue: Alcance da fidelidade declarada por Calebe
  choice: segui plenamente o SENHOR
  alternative: fui inteiramente fiel ao SENHOR
  rationale: Mantém a metáfora bíblica de seguir a Deus e a força do idiomatismo hebraico, sem transformar a declaração em uma formulação doutrinária mais abstrata.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima ao hebraico. A expressão imagética 'fizeram o coração do povo desfalecer' foi mantida por sua clareza e força literária; 'SENHOR' representa o Tetragrama segundo a convenção bíblica tradicional.
