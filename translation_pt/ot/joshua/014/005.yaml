reference: Joshua 14:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: pt
  text: Assim como Yahweh havia ordenado a Moisés, assim fizeram os filhos de Israel[a], e repartiram a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os israelitas». O hebraico diz literalmente «os filhos de Israel», expressão coletiva comum para o povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Assim como ... assim
  rationale: Preserva a construção correlativa hebraica, que estabelece correspondência direta entre a ordem de Yahweh e a ação de Israel.
- source_word: צִוָּה
  choice: havia ordenado
  rationale: O mais-que-perfeito composto expressa naturalmente em português que a ordem dada precedeu o cumprimento narrado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: אֶת מֹשֶׁה
  choice: a Moisés
  rationale: Com o verbo português «ordenar», a pessoa que recebe a ordem é expressa idiomaticamente com a preposição «a».
- source_word: עָשׂוּ
  choice: fizeram
  rationale: Mantém o sentido amplo e simples do verbo hebraico e deixa implícito o objeto, como no texto-fonte.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a forma da expressão corporativa hebraica; a nota esclarece seu equivalente corrente em português.
- source_word: וַיַּחְלְקוּ
  choice: e repartiram
  rationale: No contexto da distribuição territorial, «repartiram» comunica de modo natural tanto a divisão quanto a atribuição de porções.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Refere-se contextualmente à terra distribuída entre Israel, não à terra ou ao mundo em sentido global.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o nome pessoal divino; «Yahweh» o conserva por transliteração sem substituí-lo por um título.
- issue: Forma da expressão בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A escolha mantém a expressão corporativa masculina do hebraico, enquanto a nota registra o equivalente étnico natural sem restringir o referente apenas a homens.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição correlativa «Assim como ... assim» é deliberada para refletir a estrutura hebraica. O marcador da nota foi colocado após «filhos de Israel», termo ao qual a nota efetivamente se refere.
