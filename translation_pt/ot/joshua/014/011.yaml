id: JOS.14.11
reference: Joshua 14:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: pt
  text: Ainda hoje sou tão forte como no dia em que Moisés me enviou. Tenho agora a mesma força que tinha naquela época, tanto para a batalha como para sair e entrar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sair e entrar” é uma expressão hebraica que pode indicar plena capacidade para agir e desempenhar suas funções, inclusive em contextos militares ou de liderança.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם
  choice: Ainda hoje sou
  rationale: Expressa de modo natural a continuidade indicada por עוֹד com a referência temporal הַיּוֹם, sem perder a ênfase de que a condição de Calebe permanece até o presente.
- source_word: חָזָק
  choice: forte
  rationale: No contexto, o adjetivo se refere à força e ao vigor necessários para combate e atividade; “forte” é direto, corrente e fiel.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: como no dia em que Moisés me enviou
  rationale: Preserva a comparação e a referência específica ao dia do envio, em sintaxe portuguesa natural.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: Tenho agora a mesma força que tinha naquela época
  rationale: Explicita a cópula omitida na frase nominal hebraica e conserva a equivalência enfática entre a força de então e a de agora.
- source_word: לַמִּלְחָמָה
  choice: para a batalha
  rationale: מִלְחָמָה pode designar guerra ou batalha; aqui, “batalha” comunica concretamente a aptidão pessoal de Calebe para combater.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: como para sair e entrar
  rationale: Mantém a formulação hebraica e sua amplitude, sem reduzi-la apenas a marchar ou liderar; a nota esclarece seu uso idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição hebraica sobre a força foi vertida por uma comparação idiomática, sem enfraquecer a afirmação enfática de Calebe. A expressão “sair e entrar” foi preservada no texto e explicada em nota.
