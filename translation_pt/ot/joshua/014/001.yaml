source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: pt
  text: Estas são as heranças que os filhos de Israel[a] receberam na terra de Canaã e que Eleazar, o sacerdote, Josué, filho de Num, e os chefes das casas paternas[b] das tribos dos filhos de Israel lhes distribuíram.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os israelitas». O hebraico emprega literalmente a expressão familiar «os filhos de Israel».'
    reason: lexical_alternative
  - marker: b
    text: As «casas paternas» eram grupos familiares ancestrais dentro das tribos.
    reason: cultural_note
  - marker: c
    text: 'O hebraico repete nos dois segmentos uma mesma raiz ligada à herança: os filhos de Israel receberam as heranças, e os líderes lhas distribuíram como herança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Estas são
  rationale: O demonstrativo introduz uma nova seção em continuidade com o contexto. Em português, não é necessário acrescentar um advérbio temporal que não aparece no hebraico.
- source_word: נָחֲלוּ
  choice: receberam
  rationale: O qal descreve Israel recebendo sua porção territorial. «Receberam» é natural em português e evita limitar a ideia à sucessão decorrente de morte; o substantivo «heranças» mantém explícito o sentido fundiário.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar e pactual do hebraico. A alternativa idiomática «os israelitas» é indicada em nota.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: na terra de Canaã
  rationale: Mantém o substantivo «terra», importante no contexto da distribuição da herança territorial.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: e que ... repartiram entre eles
  rationale: Expressa a distribuição administrativa das heranças pelos agentes nomeados. «Entre eles» comunica de modo natural que as porções foram destinadas aos israelitas.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Eleazar, o sacerdote
  rationale: Forma portuguesa corrente para o nome e o título em aposição.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: os chefes das casas paternas das tribos
  rationale: Conserva tanto a liderança indicada por רָאשֵׁי como a estrutura ancestral de parentesco expressa por אֲבוֹת, sem reduzi-la simplesmente a «líderes tribais».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dos filhos de Israel
  rationale: 'A expressão é entendida como modificadora de «tribos», preservando a relação sintática mais provável: as tribos pertencentes aos filhos de Israel.'
theological_decisions:
- issue: Designação pactual de gênero em בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal conserva a expressão familiar masculina do texto hebraico, enquanto a nota oferece o gentílico idiomático sem alterar o sentido coletivo.
- issue: Terminologia de parentesco em אֲבוֹת
  choice: casas paternas
  alternative: grupos familiares ancestrais
  rationale: A formulação preserva a organização social patriarcal e ancestral pressuposta no texto, e a nota explica seu valor cultural sem impor uma estrutura denominacional posterior.
- issue: Repetição da raiz נחל
  choice: heranças ... receberam ... repartiram
  alternative: heranças ... herdaram ... deram por herança
  rationale: A redação principal comunica com clareza os dois lados do processo — recebimento e distribuição — sem sugerir apenas sucessão após uma morte. A nota registra a repetição da raiz no hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas bíblicas correntes no Brasil e compreensíveis internacionalmente. A sintaxe foi moderadamente alisada, mas as expressões «filhos de Israel», «terra de Canaã» e «casas paternas» preservam elementos relevantes da forma e do mundo social do hebraico.
