source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: pt
  text: 'Então os filhos de Judá se aproximaram de Josué em Gilgal, e Calebe, filho de Jefoné, o quenezeu, lhe disse: “Você sabe o que[a] Yahweh falou a Moisés, o homem de Deus, a meu respeito e a seu respeito, em Cades-Barneia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a palavra”, “o assunto” ou “a coisa”.
    reason: O substantivo hebraico דָּבָר possui essa amplitude semântica; neste contexto, refere-se ao conteúdo que Yahweh falou.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: se aproximaram
  rationale: Expressa naturalmente o movimento de chegar perto ou apresentar-se diante de alguém.
- source_word: בְנֵי יְהוּדָה
  choice: os filhos de Judá
  rationale: Preserva a formulação tribal e familiar masculina do hebraico, sem reduzi-la a uma designação genérica.
- source_word: בַּגִּלְגָּל
  choice: em Gilgal
  rationale: Emprega a preposição locativa natural em português com o topônimo.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Calebe, filho de Jefoné, o quenezeu
  rationale: Adota as formas portuguesas usuais dos nomes e conserva a identificação clânica ou étnica.
- source_word: אַתָּה יָדַעְתָּ
  choice: Você sabe
  rationale: O perfeito descreve aqui um estado presente de conhecimento; a forma é clara e corrente em português.
- source_word: הַדָּבָר
  choice: o que
  rationale: No contexto, refere-se ao conteúdo específico que Yahweh falou. A formulação é natural em português, enquanto a nota preserva as alternativas lexicais mais formais.
- source_word: דִּבֶּר יְהוָה
  choice: Yahweh falou
  rationale: Mantém o verbo de fala e translitera diretamente o nome divino.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: Moisés, o homem de Deus
  rationale: Conserva o título bíblico formal e reconhecível.
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: a meu respeito e a seu respeito
  rationale: Reproduz a repetição e a precisão do paralelismo hebraico em português natural.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: em Cades-Barneia
  rationale: Usa a forma portuguesa tradicional do topônimo e uma construção locativa idiomática.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome pessoal divino; a transliteração preserva sua condição de nome, em vez de substituí-lo por um título.
- issue: Designação tribal בְנֵי יְהוּדָה
  choice: os filhos de Judá
  alternative: o povo de Judá; os homens de Judá
  rationale: A escolha mantém a expressão genealógica masculina do hebraico e seu sentido tribal, sem neutralização interpretativa.
- issue: Amplitude semântica de הַדָּבָר
  choice: o que
  alternative: a palavra; o assunto; a coisa
  rationale: A expressão aponta para o conteúdo da declaração divina. A tradução principal evita rigidez em português, e a nota registra a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as designações bíblicas formais, os paralelismos relevantes e a transliteração Yahweh; os nomes próprios seguem formas portuguesas consagradas.
