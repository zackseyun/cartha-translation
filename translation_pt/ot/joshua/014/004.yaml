base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: pt
  text: 'Pois os filhos de José eram duas tribos[a], Manassés e Efraim; e não deram aos levitas porção alguma na terra, exceto cidades para morarem, com as suas terras de pastagem[b] para o seu gado e para os seus bens.


    [a] Isto é, os descendentes de José.


    [b] As “terras de pastagem” eram as áreas abertas ao redor das cidades dos levitas, usadas especialmente para o gado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os descendentes de José.
    reason: Esclarece que o idioma hebraico “filhos de José” se refere aqui aos seus descendentes tribais.
  - marker: b
    text: As “terras de pastagem” eram as áreas abertas ao redor das cidades dos levitas, usadas especialmente para o gado.
    reason: Explica o sentido cultural e funcional de מִגְרָשׁ.
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz uma explicação da afirmação anterior e mantém de modo natural a ligação argumentativa.
- source_word: בְנֵי יוֹסֵף
  choice: os filhos de José
  rationale: Preserva o idioma familiar hebraico; neste contexto, refere-se aos descendentes tribais de José, esclarecidos em nota.
- source_word: שְׁנֵי מַטּוֹת
  choice: duas tribos
  rationale: מַטּוֹת designa aqui divisões tribais, não bastões literais.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: e não deram ... porção alguma
  rationale: Mantém a construção verbal ativa e expressa claramente a ausência de uma parcela territorial.
- source_word: לַלְוִיִּם
  choice: aos levitas
  rationale: O plural se refere aos membros da tribo de Levi como grupo.
- source_word: כִּי אִם
  choice: exceto
  rationale: A expressão introduz a única exceção à negação precedente.
- source_word: עָרִים לָשֶׁבֶת
  choice: cidades onde morar
  rationale: Expressa em português corrente a finalidade das cidades concedidas aos levitas.
- source_word: מִגְרְשֵׁיהֶם
  choice: as suas terras de pastagem
  rationale: Designa as áreas abertas ligadas às cidades, especialmente destinadas ao pastoreio; a nota oferece o contexto cultural.
- source_word: לְמִקְנֵיהֶם
  choice: para o seu gado
  rationale: מִקְנֶה abrange os animais domésticos possuídos, aqui naturalmente traduzidos por “gado”.
- source_word: וּלְקִנְיָנָם
  choice: e os seus bens
  rationale: קִנְיָן denota propriedade ou aquilo que se possui; “bens” é amplo, natural e não restringe indevidamente o referente.
