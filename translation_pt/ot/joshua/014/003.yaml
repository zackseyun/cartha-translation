  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: pt
  text: Pois Moisés havia dado a herança das duas tribos e da meia tribo do outro lado do Jordão[a], mas aos levitas não deu herança entre elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além do Jordão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação do que foi dito no contexto e preserva com naturalidade a função discursiva do hebraico.
- source_word: נָתַן
  choice: havia dado
  rationale: O mais-que-perfeito indica que a concessão feita por Moisés ocorreu antes da distribuição narrada no contexto.
- source_word: נַחֲלַת
  choice: a herança
  rationale: Designa a posse territorial recebida por direito e por distribuição; “herança” mantém a terminologia bíblica e é clara em português.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: as duas tribos
  rationale: Embora מַטֶּה também possa significar “cajado”, neste contexto de distribuição territorial denota inequivocamente grupos tribais.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: e da meia tribo
  rationale: Expressão convencional e precisa para a metade da tribo de Manassés; a repetição elíptica de “herança” é natural em português.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Reproduz a expressão geográfica hebraica sem definir de modo mais específico o ponto de vista espacial.
- source_word: וְלַלְוִיִּם
  choice: mas aos levitas
  rationale: O waw introduz aqui um contraste entre as tribos que receberam território e os levitas, que não receberam uma herança tribal entre elas.
- source_word: לֹא נָתַן נַחֲלָה
  choice: não deu herança
  rationale: Tradução direta da oração negativa, preservando o mesmo termo usado para a posse territorial na primeira parte.
- source_word: בְּתוֹכָם
  choice: entre elas
  rationale: O pronome retoma naturalmente as tribos mencionadas; a formulação indica que Levi não recebeu uma herança territorial tribal no meio delas.
theological_decisions:
- issue: Natureza da ausência de herança para Levi
  choice: A frase nega aos levitas uma herança territorial entre as demais tribos.
  alternative: Entender a declaração de modo absoluto, como se os levitas não recebessem nenhuma forma de provisão ou herança.
  rationale: A expressão “entre elas” conserva a limitação presente no texto. No contexto bíblico mais amplo, os levitas não recebem uma divisão territorial tribal comum, embora recebam cidades e outras provisões; essa informação não é acrescentada ao versículo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Pois” mantém o vínculo explicativo; “havia dado” esclarece a anterioridade narrativa; “meia tribo” segue o uso bíblico corrente.
