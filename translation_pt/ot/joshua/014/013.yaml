  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: pt
  text: Então Josué o abençoou e deu Hebrom a Calebe, filho de Jefoné, como herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abençoou Calebe”; em hebraico, “o abençoou”, e o contexto deixa claro que o pronome se refere a Calebe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: o abençoou
  rationale: O verbo ברך com sufixo de terceira pessoa masculina singular significa literalmente “abençoou-o”. O pronome preserva a forma hebraica, e o contexto identifica claramente Calebe como referente.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: וַיִּתֵּן
  choice: deu
  rationale: נתן é o verbo comum para “dar”; esta opção é direta e adequada ao contexto de concessão territorial.
- source_word: אֶת חֶבְרוֹן
  choice: Hebrom
  rationale: A partícula de objeto direto אֶת não é traduzida; חֶבְרוֹן é vertido pela forma tradicional portuguesa “Hebrom”.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: a Calebe, filho de Jefoné
  rationale: A preposição לְ marca o destinatário. A expressão genealógica é traduzida de modo natural e fiel em português.
- source_word: לְנַחֲלָה
  choice: como herança
  rationale: נַחֲלָה designa aqui a terra recebida por concessão hereditária. “Como herança” preserva o sentido territorial e jurídico sem acrescentar um possessivo ausente no hebraico.
