  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: pt
  text: 'E Moisés jurou naquele dia, dizendo: “Certamente[a], a terra em que o seu pé pisou será uma herança para você e para seus filhos[b] para sempre, porque você seguiu plenamente Yahweh, meu Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “certamente” é literalmente “se não”; em um juramento, ela funciona como fórmula enfática.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente “seus filhos”. A expressão pode abranger seus descendentes. “Para sempre” também pode ter o sentido de “perpetuamente” ou “por tempo indefinido”, conforme o contexto.
    reason: lexical_and_semantic_ambiguity
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: jurou
  rationale: O nifal de שׁבע significa jurar ou prestar juramento; “jurou” é direto, solene e natural em português.
- source_word: בַּיּוֹם הַהוּא
  choice: naquele dia
  rationale: Reprodução natural e exata da expressão temporal hebraica.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Forma tradicional e clara de introduzir discurso direto, correspondente ao infinitivo hebraico.
- source_word: אִם לֹא
  choice: certamente
  rationale: No contexto de juramento, a construção funciona como fórmula enfática, e não como condição literal.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: a terra em que o seu pé pisou
  rationale: Mantém a imagem concreta e o singular “pé” do hebraico, em formulação natural em português.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: será herança sua
  rationale: Preserva o valor futuro e a ideia de posse recebida como herança, sem tornar a frase artificial.
- source_word: וּלְבָנֶיךָ
  choice: e de seus filhos
  rationale: Conserva o substantivo masculino plural explícito no hebraico; o sentido contextual mais amplo é registrado em nota.
- source_word: עַד עוֹלָם
  choice: para sempre
  rationale: Equivalente corrente e digno para uma duração contínua ou indefinida.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: porque você seguiu plenamente
  rationale: Expressa o idioma hebraico de seguir de modo completo ou integral, preservando sua forma verbal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: אֱלֹהָי
  choice: meu Deus
  rationale: Mantém o sufixo explícito de primeira pessoa do singular.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta o Tetragrama como nome próprio; “Yahweh” preserva essa função e evita substituí-lo por um título.
- issue: Alcance de וּלְבָנֶיךָ
  choice: seus filhos
  alternative: seus descendentes
  rationale: A tradução principal conserva a forma lexical masculina “filhos”, enquanto a nota informa o possível alcance dinástico ou geracional sem decidir silenciosamente a questão.
- issue: Força temporal de עַד עוֹלָם
  choice: para sempre
  alternative: perpetuamente; por tempo indefinido
  rationale: “Para sempre” preserva a força retórica do hebraico; uma nota esclarece que עוֹלָם pode indicar duração indefinida ou permanente conforme o contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para refletir com clareza a segunda pessoa singular. A ordem e as imagens centrais do hebraico foram preservadas sem rigidez excessiva.
