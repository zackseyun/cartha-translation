id: JOS.14.14
reference: Joshua 14:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: pt
  text: Por isso, Hebrom passou a ser a herança de Calebe, filho de Jefoné, o quenezeu, até o dia de hoje, porque ele seguiu plenamente[a] Yahweh, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi inteiramente fiel a Yahweh”. O idioma hebraico diz literalmente que ele “encheu após” Yahweh, expressão que indica lealdade completa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz de modo natural o resultado da concessão narrada anteriormente, preservando a força causal e consecutiva da expressão hebraica.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: passou a ser a herança
  rationale: Expressa a transição pela qual Hebrom veio a pertencer a Calebe como propriedade recebida por herança, em vez de indicar apenas um estado estático.
- source_word: חֶבְרוֹן
  choice: Hebrom
  rationale: Forma tradicional e amplamente reconhecida do topônimo em português.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: de Calebe, filho de Jefoné, o quenezeu
  rationale: A preposição לְ indica aqui posse ou beneficiário; as formas dos nomes e do gentílico seguem o uso bíblico corrente em português.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Reproduz o idioma hebraico que afirma a continuidade dessa situação até o tempo do narrador.
- source_word: יַעַן אֲשֶׁר
  choice: porque
  rationale: Apresenta com clareza a razão pela qual Hebrom se tornou a herança de Calebe.
- source_word: מִלֵּא אַחֲרֵי
  choice: seguiu plenamente
  rationale: Mantém algo da forma do idioma hebraico e comunica a lealdade completa de Calebe sem reduzir a expressão apenas a obediência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta e natural da cadeia construta, preservando a identificação de Yahweh com Israel.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” preserva essa característica, enquanto “SENHOR” representa a substituição tradicional por um título.
- issue: Sentido da lealdade de Calebe em מִלֵּא אַחֲרֵי
  choice: seguiu plenamente
  alternative: foi inteiramente fiel a
  rationale: A escolha preserva o verbo “seguir” presente no idioma hebraico e deixa visível sua imagem, enquanto a alternativa explicita o sentido de lealdade completa.
translation_notes:
  register: Português moderno, claro e digno, com formas nominais bíblicas reconhecíveis no Brasil e compreensíveis internacionalmente. A construção “passou a ser” comunica naturalmente a mudança de condição indicada pelo hebraico.
