  text: וְ/שֵׁ֨ם חֶבְר֤וֹן לְ/פָנִים֙ קִרְיַ֣ת אַרְבַּ֔ע הָ/אָדָ֧ם הַ/גָּד֛וֹל בָּ/עֲנָקִ֖ים ה֑וּא וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: pt
  text: O antigo nome de Hebrom era Quiriate-Arba[a]; Arba era o maior homem entre os anaquins[b]. E a terra teve descanso da guerra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quiriate-Arba provavelmente significa “cidade de Arba”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o grande homem entre os anaquins”; o hebraico pode apresentar Arba como a figura mais destacada associada aos anaquins.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “a terra ficou tranquila, sem guerra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים
  choice: O antigo nome de Hebrom
  rationale: לְפָנִים indica o que era assim anteriormente. “O antigo nome” é natural em português e não acrescenta um marcador temporal inexistente no hebraico.
- source_word: קִרְיַת אַרְבַּע
  choice: Quiriate-Arba
  rationale: Mantém o topônimo hebraico em forma tradicional e legível em português; seu provável significado é explicado em nota.
- source_word: הָאָדָם הַגָּדוֹל בָּעֲנָקִים הוּא
  choice: Arba era o maior homem entre os anaquins
  rationale: O pronome הוּא retoma naturalmente Arba. O adjetivo definido הַגָּדוֹל pode exprimir preeminência no grupo; “o maior homem” comunica essa leitura sem apagar a alternativa mais literal.
- source_word: עֲנָקִים
  choice: anaquins
  rationale: Emprega uma forma portuguesa transparente para o etnônimo hebraico, referente ao povo associado a Anaque.
- source_word: וְהָאָרֶץ שָׁקְטָה מִמִּלְחָמָה
  choice: E a terra teve descanso da guerra
  rationale: שׁקט descreve quietude ou repouso após conflito. “Teve descanso da guerra” preserva a imagem da terra personificada e o sentido de cessação das hostilidades.
theological_decisions:
- issue: Grau de preeminência atribuído a Arba entre os anaquins
  choice: o maior homem entre os anaquins
  alternative: o grande homem entre os anaquins
  rationale: O artigo em הַגָּדוֹל e a construção com בָּעֲנָקִים favorecem a ideia de figura preeminente, mas o hebraico também admite uma tradução menos superlativa; a nota preserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Os nomes próprios seguem formas portuguesas usuais; a sintaxe mantém a concisão narrativa do hebraico sem introduzir explicações no corpo do versículo.
