source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: pt
  text: E agora, eis que Yahweh me manteve vivo[a], como havia dito, durante estes quarenta e cinco anos, desde que Yahweh falou esta palavra[b] a Moisés, enquanto Israel caminhava pelo deserto[c]. E agora, eis que hoje tenho oitenta e cinco anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preservou minha vida”.'
    reason: lexical_alternative
  - marker: b
    text: “Esta palavra” também pode ser traduzida como “este assunto” ou, de modo mais interpretativo, “esta promessa”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “enquanto Israel peregrinava pelo deserto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: me manteve vivo
  rationale: O hifil de חיה, neste contexto, expressa a preservação da vida de Calebe ao longo dos anos. A formulação é natural em português e mantém a ligação com sua condição presente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo tetragrama, em vez de substituí-lo por um título.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: como havia dito
  rationale: Mantém o sentido verbal de uma declaração anterior sem explicitar de forma excessiva que se tratava de uma promessa.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: durante estes quarenta e cinco anos
  rationale: Expressa o período transcorrido até o presente e preserva a força dêitica de זֶה.
- source_word: מֵאָז
  choice: desde que
  rationale: Introduz com naturalidade o ponto inicial do período de quarenta e cinco anos.
- source_word: הַדָּבָר הַזֶּה
  choice: esta palavra
  rationale: Conserva a amplitude semântica de דָּבָר e remete à declaração específica de Yahweh, sem interpretá-la diretamente como promessa.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: enquanto Israel caminhava pelo deserto
  rationale: Preserva a imagem concreta de הלך e expressa a relação temporal da oração no contexto da peregrinação de Israel.
- source_word: הִנֵּה
  choice: eis que
  rationale: Reproduz a função enfática e de chamada de atenção da partícula em registro digno e compreensível.
- source_word: אָנֹכִי הַיּוֹם
  choice: hoje tenho
  rationale: É a forma idiomática portuguesa de introduzir a idade presente, mantendo a ênfase temporal em “hoje”.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: tenho oitenta e cinco anos
  rationale: Traduz de modo idiomático a construção hebraica de idade, literalmente “filho de oitenta e cinco anos”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto emprega diretamente o tetragrama. A transliteração “Yahweh” preserva o nome pessoal divino sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Eis que” conserva a ênfase retórica do hebraico; “me manteve vivo” e “tenho oitenta e cinco anos” evitam literalismos pouco naturais.
