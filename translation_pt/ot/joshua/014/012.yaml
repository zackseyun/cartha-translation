  naturalness: O português é moderno, claro e natural para leitura ampla, inclusive no Brasil. “Região montanhosa”, “você mesmo”, “anaquins” e “conforme Yahweh disse” são apropriados ao registro narrativo solene sem serem arcaicos.
  terminology: “Yahweh” representa consistentemente o Tetragrama; “anaquins” é uma forma portuguesa adequada para o grupo referido; e “expulsarei” comunica bem o valor de desapossar/remover no contexto. A nota b, porém, chama de literal uma reconstrução que já acrescenta o verbo elíptico, e sua âncora deve acompanhar a expressão que ela esclarece.
