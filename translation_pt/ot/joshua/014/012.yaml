id: JOS.14.12
reference: Joshua 14:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: pt
  text: Agora, dê-me esta região montanhosa da qual Yahweh falou naquele dia[a], pois você mesmo ouviu naquele dia que os anaquins estão ali, com cidades grandes e fortificadas. Talvez Yahweh esteja comigo[b], e eu os expulsarei, conforme Yahweh disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este monte”. O hebraico הָהָר pode designar um monte específico ou uma região montanhosa; aqui, o contexto favorece o sentido regional.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico diz: “Talvez Yahweh comigo”; a oração não tem verbo expresso e comunica a expectativa humilde da presença e do auxílio divinos.'
    reason: source_clarity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Agora
  rationale: Funciona como marcador discursivo que introduz o pedido presente de Calebe; o valor conjuntivo pode ficar implícito em português natural.
- source_word: תְּנָה לִּי
  choice: dê-me
  rationale: Reproduz diretamente o imperativo de נתן com objeto indireto, em linguagem clara e digna.
- source_word: אֶת־הָהָר הַזֶּה
  choice: esta região montanhosa
  rationale: הַר pode indicar tanto um monte quanto uma área montanhosa; neste contexto de concessão territorial, o sentido regional é o mais provável.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: da qual Yahweh falou
  rationale: Mantém o valor lexical de דִּבֶּר, sem explicitar como “prometeu” aquilo que o verbo apenas apresenta como fala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: pois você mesmo ouviu
  rationale: כִּי introduz a razão, e “você mesmo” preserva a ênfase do pronome explícito אַתָּה.
- source_word: כִּי עֲנָקִים שָׁם
  choice: que os anaquins estão ali
  rationale: Conserva o gentílico e expressa naturalmente a situação ainda vigente descrita por Calebe.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: com cidades grandes e fortificadas
  rationale: Apresenta os dois qualificativos com sintaxe portuguesa natural, entendendo a coordenação como descrição adicional do território.
- source_word: אוּלַי יְהוָה אוֹתִי
  choice: Talvez Yahweh esteja comigo
  rationale: Preserva tanto a modalidade de אוּלַי quanto a concisão da oração nominal hebraica, sem transformar explicitamente a presença divina em “ajuda”.
- source_word: וְהוֹרַשְׁתִּים
  choice: e eu os expulsarei
  rationale: O hifil de ירשׁ, no contexto da conquista, indica remover ou desapossar os habitantes; “expulsarei” é claro e corrente.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: conforme Yahweh disse
  rationale: Traduz a comparação e mantém novamente o sentido básico de “falar/dizer”.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o Tetragrama como nome próprio; “Yahweh” o representa diretamente sem substituí-lo por um título.
- issue: Sentido de אוּלַי יְהוָה אוֹתִי
  choice: Talvez Yahweh esteja comigo
  alternative: Talvez Yahweh me ajude; Talvez Yahweh estará comigo
  rationale: A tradução conserva a incerteza expressa por אוּלַי e a ambiguidade temporal da oração nominal, evitando reduzir a presença divina apenas à ideia de ajuda.
- issue: Relação entre a presença de Yahweh e a expulsão dos anaquins
  choice: Talvez Yahweh esteja comigo, e eu os expulsarei
  alternative: Se Yahweh estiver comigo, eu os expulsarei
  rationale: A coordenação hebraica é preservada, sem convertê-la numa condição formal que não está explicitamente marcada no original.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tratamento “você” torna explícita a ênfase do pronome hebraico sem elevar artificialmente o registro. A formulação mantém tom direto e solene, conserva “talvez” e evita transformar “falou” em “prometeu”.
