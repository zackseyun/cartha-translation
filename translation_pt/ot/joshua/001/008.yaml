source:
  edition: WLC
  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: pt
  text: Este livro da Lei não deve se afastar da sua boca; medite nele dia e noite[a], para ter o cuidado de agir conforme tudo o que nele está escrito. Pois então você fará prosperar o seu caminho e agirá com sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “murmure-o” ou “recite-o em voz baixa”; o verbo hebraico pode incluir a repetição oral em tom baixo, além da meditação.
    reason: Alternativa lexical que preserva a dimensão oral de הגה.
lexical_decisions:
- source_word: יָמוּשׁ
  choice: não se afaste
  rationale: Preserva o sentido de afastar-se ou deixar um lugar e mantém, com “da sua boca”, a imagem hebraica da recitação contínua.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: este Livro da Lei
  rationale: “Livro” é natural e pode representar o documento escrito; “Lei” comunica o sentido pactual específico de תּוֹרָה neste contexto.
- source_word: מִפִּיךָ
  choice: da sua boca
  rationale: Mantém a expressão concreta do hebraico, que aponta para falar ou recitar o texto.
- source_word: וְהָגִיתָ
  choice: medite nele
  rationale: הגה abrange reflexão e enunciação em voz baixa. “Medite” é claro em português, enquanto a nota preserva explicitamente a dimensão oral.
- source_word: יוֹמָם וָלַיְלָה
  choice: dia e noite
  rationale: Reproduz o merismo hebraico natural para uma prática contínua.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: para ter o cuidado de agir
  rationale: Expressa a finalidade da meditação e a ideia de observância atenta orientada à prática.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: de acordo com tudo o que nele está escrito
  rationale: Preserva tanto a abrangência de כְּכָל quanto a autoridade do padrão escrito.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: você fará prosperar o seu caminho
  rationale: Mantém a forma causativa do Hifil, sem reduzir a frase à simples experiência passiva de prosperidade.
- source_word: תַּשְׂכִּיל
  choice: agirá com sabedoria
  rationale: Preserva a ideia de proceder com discernimento e distingue este verbo de צלח, já traduzido em termos de prosperidade.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: Lei
  alternative: instrução; Torá
  rationale: Aqui o termo designa o corpus escrito da aliança que Josué deve cumprir. “Lei” torna essa função clara sem exigir transliteração.
- issue: Meditação interior ou recitação oral
  choice: medite nele, com nota sobre a enunciação em voz baixa
  alternative: murmure-o; recite-o em voz baixa
  rationale: O contexto da “boca” e o verbo הגה sustentam tanto reflexão quanto repetição oral. A redação principal é natural e a nota conserva a amplitude lexical.
- issue: Prosperidade e sabedoria no paralelismo final
  choice: manter os dois conceitos distintos
  alternative: traduzir ambos como sucesso ou prosperidade
  rationale: צלח exprime fazer prosperar, enquanto שכל destaca agir com discernimento, ainda que tal conduta possa resultar em êxito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita formas regionais marcadas. A ordem foi levemente ajustada para fluidez, sem apagar as imagens da boca, do caminho e da ação sábia.
