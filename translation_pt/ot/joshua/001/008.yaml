  terminology: «Livro da Lei» traduz de modo adequado סֵפֶר הַתּוֹרָה neste contexto. «Medite nele» é uma opção legítima para והגית בו, e a nota preserva corretamente a possível dimensão de recitação em voz baixa. «Agir de acordo com» é aceitável para לעשות ככל, embora «agir conforme» seja mais conciso e próximo da formulação normativa.
