source:
  edition: WLC
  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: pt
  text: Tão somente, seja forte e muito corajoso, tendo o cuidado de agir de acordo com toda a lei que Moisés, meu servo, lhe ordenou. Não se desvie dela nem para a direita nem para a esquerda, para que você aja com sabedoria[a] por onde quer que for.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tenha êxito” ou “seja bem-sucedido” por onde quer que for.
    reason: 'Alternativa lexical: תַּשְׂכִּיל pode destacar tanto a ação sábia e prudente quanto o êxito resultante.'
lexical_decisions:
- source_word: רַק
  choice: Tão somente
  rationale: Introduz uma restrição enfática, destacando esta como a incumbência essencial; a expressão é digna e preserva melhor a força do hebraico do que um simples conector.
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: seja forte e muito corajoso
  rationale: Mantém os dois imperativos coordenados e o intensificador מְאֹד em português natural; “forte” expressa firmeza, e “corajoso”, determinação diante do perigo.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: tendo o cuidado de agir
  rationale: A sequência de infinitivos reúne observância cuidadosa e execução prática. A formulação preserva ambos os aspectos sem soar artificial.
- source_word: כְּכָל הַתּוֹרָה
  choice: de acordo com toda a lei
  rationale: Neste contexto, תּוֹרָה designa concretamente o conjunto de mandamentos transmitidos por Moisés; “toda” conserva a abrangência.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: que Moisés, meu servo, lhe ordenou
  rationale: Reproduz diretamente a oração relativa e conserva a designação divina de Moisés como “meu servo”.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: Não se desvie dela nem para a direita nem para a esquerda
  rationale: Preserva a metáfora direcional do caminho prescrito e comunica claramente a proibição de qualquer desvio.
- source_word: לְמַעַן
  choice: para que
  rationale: Expressa de maneira natural a relação de propósito ou resultado presente no hebraico.
- source_word: תַּשְׂכִּיל
  choice: você aja com sabedoria
  rationale: O hifil de שׂכל pode indicar agir com discernimento e, por consequência, obter êxito. O texto principal mantém o núcleo de ação prudente, enquanto a nota registra a nuance de sucesso.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: por onde quer que for
  rationale: Representa naturalmente a abrangência da expressão ligada ao verbo הלך, sem substituir a imagem de ir ou caminhar pela ideia mais ampla de fazer.
theological_decisions:
- issue: Sentido de תּוֹרָה no contexto da aliança
  choice: lei
  alternative: instrução
  rationale: A referência imediata é ao que Moisés ordenou, de modo que o sentido jurídico e pactual é predominante. “Instrução” é lexicalmente possível, mas menos específico aqui.
- issue: Sentido de תַּשְׂכִּיל
  choice: aja com sabedoria
  alternative: prospere; tenha êxito
  rationale: O termo pode abranger tanto conduta prudente quanto o êxito dela resultante. Para não transformar o versículo numa promessa inequívoca de prosperidade, a tradução principal destaca a sabedoria prática e registra a leitura de sucesso em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você/lhe” para a referência singular a Josué, evita arcaísmos e mantém as metáforas de caminho e desvio do hebraico.
