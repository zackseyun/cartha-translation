id: JOS.1.6
reference: Joshua 1:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: pt
  text: Seja forte e corajoso, pois você fará este povo herdar[a] a terra que jurei dar aos pais deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dará esta terra a este povo como herança”. O verbo hebraico está na forma causativa, literalmente “fará herdar”, mas também pode ser expresso de modo mais idiomático como dar ou repartir uma herança.'
    reason: lexical_alternative
  - marker: b
    text: “Pais deles” refere-se aos antepassados de Israel, especialmente aos patriarcas. Outra tradução possível é “antepassados deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: Seja forte e corajoso
  rationale: Os dois imperativos masculinos singulares formam uma exortação idiomática à força e à coragem. A formulação é clara, digna e corrente em português.
- source_word: כִּי
  choice: pois
  rationale: Introduz a razão da ordem anterior e preserva de modo natural a ligação causal.
- source_word: תַּנְחִיל
  choice: você fará este povo herdar
  rationale: A forma hifil de נחל é causativa. Esta construção conserva explicitamente a ideia de Josué levar o povo a receber a terra como herança, sem confundi-lo com o doador último, que é Deus.
- source_word: הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o coletivo singular e o demonstrativo do hebraico.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: No contexto da aliança em Josué, designa a terra prometida; 'a terra' é a equivalência tradicional e contextualmente precisa.
- source_word: נִשְׁבַּעְתִּי
  choice: jurei
  rationale: Expressa diretamente o juramento divino feito no passado aos patriarcas.
- source_word: לַאֲבוֹתָם
  choice: aos pais deles
  rationale: Preserva o substantivo masculino plural do hebraico e deixa claro que se trata dos pais do povo, isto é, de seus antepassados patriarcais.
- source_word: לָתֵת לָהֶם
  choice: dar aos pais deles
  rationale: O infinitivo explicita o conteúdo do juramento. Em português, o referente pronominal é integrado à expressão 'aos pais deles' sem alterar o sentido.
theological_decisions:
- issue: Identidade e tradução de אֲבוֹתָם
  choice: aos pais deles
  alternative: aos antepassados deles
  rationale: O hebraico emprega um plural masculino que, neste contexto, aponta especialmente para os patriarcas de Israel. A tradução principal conserva 'pais', enquanto a nota registra a alternativa mais idiomática e abrangente.
- issue: Papel de Josué na herança da terra
  choice: fará este povo herdar
  alternative: dará esta terra a este povo como herança
  rationale: A formulação causativa preserva a distinção entre Deus, que prometeu e concede a terra, e Josué, por meio de quem o povo passa a possuí-la. A alternativa idiomática permanece lexicalmente possível.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. O pronome 'você' torna explícito o destinatário singular da ordem. A construção causativa, embora um pouco mais marcada, foi mantida por fidelidade à forma hebraica e esclarecida em nota.
