  text: וַֽ/יַּעֲנ֔וּ אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר כֹּ֤ל אֲשֶׁר צִוִּיתָ֨/נוּ֙ נַֽעֲשֶׂ֔ה וְ/אֶֽל כָּל אֲשֶׁ֥ר תִּשְׁלָחֵ֖/נוּ נֵלֵֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: pt
  text: 'Eles responderam a Josué: “Tudo o que você nos ordenou, faremos; e iremos aonde quer que você nos enviar[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e a todo lugar para onde você nos enviar, iremos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Eles responderam
  rationale: O qal wayyiqtol de ענה introduz a resposta narrativa. “Responderam” é direto e natural em português.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: a Josué
  rationale: Com ענה, Josué é a pessoa a quem se dirige a resposta; o português pede a preposição “a”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica que introduz discurso direto é expressa naturalmente em português por dois-pontos, sem a forma pouco idiomática “dizendo” após “responderam”.
- source_word: כֹּל אֲשֶׁר צִוִּיתָנוּ
  choice: Tudo o que você nos ordenou
  rationale: A expressão abrange a totalidade das ordens dadas por Josué. “Ordenou” preserva sua autoridade, e “você” oferece clareza moderna e ampla legibilidade brasileira.
- source_word: נַעֲשֶׂה
  choice: faremos
  rationale: עשה significa aqui cumprir ou fazer o que foi ordenado. “Faremos” mantém a formulação concisa e o sentido futuro.
- source_word: וְאֶל כָּל אֲשֶׁר תִּשְׁלָחֵנוּ
  choice: e iremos aonde quer que você nos enviar
  rationale: A construção é locativa e indica qualquer destino para o qual Josué os envie. “Aonde quer que” comunica esse alcance de modo natural, enquanto a nota preserva a forma mais literal.
- source_word: נֵלֵךְ
  choice: iremos
  rationale: הלך é o verbo comum para ir. “Iremos” traduz diretamente a ação futura sem acrescentar especificações.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A sintaxe do discurso direto foi naturalizada por meio de dois-pontos; a ordem “Tudo o que... faremos” conserva a ênfase inicial do hebraico. O pronome “você” evita flexões arcaizantes sem reduzir a autoridade da fala.
