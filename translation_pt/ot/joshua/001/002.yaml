  terminology: «Meu servo», «este Jordão», «todo este povo» e «filhos de Israel» são escolhas adequadas. «Filhos de Israel» conserva a transparência formal e o valor corporativo da expressão hebraica; uma nota breve pode registrar «israelitas» como alternativa idiomática sem substituir a tradução.
