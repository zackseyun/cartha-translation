  source_fidelity: 'A tradução reproduz adequadamente os elementos centrais do hebraico: Moisés é chamado de «meu servo», sua morte é apresentada como fato consumado, Josué recebe duas ordens, o demonstrativo em «este Jordão» e «todo este povo» é mantido, e a designação «filhos de Israel» preserva a forma explícita בני ישראל. Contudo, «rumo à terra» enfraquece a relação direcional de אל com o destino da travessia; «para a terra» é mais direto e fiel sem antecipar a entrada plena na terra.'
