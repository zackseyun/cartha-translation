  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: pt
  text: Moisés, meu servo, morreu. Agora, levante-se e atravesse este Jordão, você e todo este povo, para a terra que estou dando a eles, aos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aos israelitas» ou «aos filhos de Israel». O hebraico diz literalmente «aos filhos de Israel».
    reason: alternativa_lexical
lexical_decisions:
- source_word: עַבְדִּי
  choice: meu servo
  rationale: עֶבֶד pode significar servo ou escravo; aqui é uma designação honrosa de Moisés em sua relação com Deus, sem destacar condição de escravidão.
- source_word: מֵת
  choice: morreu
  rationale: O qatal declara de modo direto a morte de Moisés como fato consumado e relevante para a incumbência dada a Josué. Em português, «morreu» é mais natural do que «está morto» neste contexto.
- source_word: וְעַתָּה
  choice: Agora, pois
  rationale: 'A expressão marca transição e consequência: em vista da morte de Moisés, começa a missão de Josué.'
- source_word: קוּם
  choice: levante-se
  rationale: O imperativo introduz uma ação decidida. «Levante-se» é atual, digno e natural em português.
- source_word: עֲבֹר
  choice: atravesse
  rationale: Tendo o Jordão como objeto direto, o verbo significa atravessar ou cruzar.
- source_word: אֶת־הַיַּרְדֵּן הַזֶּה
  choice: este Jordão
  rationale: Conserva o demonstrativo explícito do hebraico sem acrescentar «rio», ausente no texto-fonte.
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: você e todo este povo
  rationale: Preserva o pronome enfático, o sentido coletivo singular de עָם e o demonstrativo.
- source_word: אֶל־הָאָרֶץ
  choice: rumo à terra
  rationale: Com o verbo de movimento, אֶל indica a direção e o destino da travessia. «Rumo à» evita sugerir que atravessar o Jordão, por si só, já equivale a entrar plenamente em toda a terra.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: que estou dando a eles
  rationale: O particípio נֹתֵן apresenta a dádiva como em curso ou iminente, perspectiva preservada pela perífrase progressiva.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  rationale: Reproduz de modo transparente a expressão hebraica בְּנֵי יִשְׂרָאֵל e sua forma masculina, que funciona aqui como designação coletiva do povo da aliança.
theological_decisions:
- issue: Designação corporativa marcada pelo masculino em לִבְנֵי יִשְׂרָאֵל
  choice: aos filhos de Israel
  alternative: aos israelitas
  rationale: A tradução preserva a forma explícita «filhos de Israel», sem negar que a expressão designa corporativamente todo o povo de Israel.
- issue: Relação entre «a eles» e «aos filhos de Israel»
  choice: manter ambas as expressões em aposição
  alternative: 'eliminar o pronome como redundante: «que estou dando aos filhos de Israel»'
  rationale: O hebraico contém tanto o pronome לָהֶם quanto a identificação posterior לִבְנֵי יִשְׂרָאֵל; mantê-los conserva a estrutura e sua possível ênfase esclarecedora.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «você» para o singular אַתָּה, evitando a ambiguidade regional de «tu» sem verbo expresso. A ordem e a repetição do hebraico são preservadas sempre que permanecem naturais em português.
