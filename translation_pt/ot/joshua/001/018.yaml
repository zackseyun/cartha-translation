source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: pt
  text: Todo homem que se rebelar contra a sua ordem e não der ouvidos às suas palavras em tudo o que você lhe ordenar será morto[a]. Apenas seja forte e corajoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Todo homem que se rebelar contra a sua boca”. A expressão hebraica “a sua boca” significa sua ordem ou palavra autoritativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: Todo homem
  rationale: Preserva a expressão distributiva masculina singular do hebraico, com sentido de cada homem que incorra nessa conduta.
- source_word: יַמְרֶה
  choice: se rebelar contra
  rationale: O hifil de מרה expressa rebeldia ou desafio à autoridade, sentido mais forte do que simples desobediência.
- source_word: אֶת פִּיךָ
  choice: a sua ordem
  rationale: Embora signifique literalmente “a sua boca”, a expressão hebraica designa aqui a palavra autoritativa ou ordem de Josué.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: e não der ouvidos às suas palavras
  rationale: “Dar ouvidos” conserva o campo semântico de ouvir com atenção e acatar, sem repetir diretamente a ideia de rebelião já expressa.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: em tudo o que você lhe ordenar
  rationale: Reproduz de modo natural o alcance total da obediência exigida e mantém explícito o destinatário da ordem.
- source_word: יוּמָת
  choice: será morto
  rationale: A forma passiva indica morte imposta como pena, não mero falecimento; a formulação preserva essa força sem acrescentar pormenores processuais.
- source_word: רַק
  choice: Apenas
  rationale: Marca a transição limitadora e enfática para a exortação dirigida ao próprio Josué.
- source_word: חֲזַק וֶאֱמָץ
  choice: seja forte e corajoso
  rationale: Expressão natural e reconhecível que comunica força, firmeza e coragem, preservando a fórmula recorrente no livro.
theological_decisions:
- issue: Linguagem representativa marcada por gênero
  choice: Todo homem
  alternative: Toda pessoa; Quem
  rationale: O hebraico emprega אִישׁ, masculino singular, numa construção distributiva. A tradução preserva essa forma sem negar seu alcance normativo no grupo a que se dirige.
- issue: Formulação da pena judicial
  choice: será morto
  alternative: morrerá; será executado
  rationale: O hebraico indica que a morte será imposta. “Será morto” mantém a voz passiva e a força penal, enquanto “morrerá” poderia sugerir apenas o resultado e “será executado” explicitaria mais do que a forma hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “você” para dirigir-se claramente a Josué e “dar ouvidos” como expressão corrente de escuta obediente. A nota preserva a imagem literal hebraica sem tornar o texto principal artificial.
