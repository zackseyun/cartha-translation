base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: pt
  text: Do deserto e deste Líbano até o grande rio, o rio Eufrates — toda a terra dos hititas — e até o Grande Mar[a], na direção do pôr do sol[b], será a fronteira de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o mar Mediterrâneo.
    reason: cross_reference
  - marker: b
    text: Ou “para o oeste”; literalmente, “na direção do pôr do sol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: Desde o deserto
  rationale: מִדְבָּר designa uma região árida ou pouco habitada. “Deserto” é claro no português atual e, neste contexto, funciona como referência geográfica.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: e deste Líbano
  rationale: Conserva o demonstrativo הַזֶּה e liga naturalmente, em português, os dois pontos de partida introduzidos pela preposição hebraica מִן.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: até o grande rio, o rio Eufrates
  rationale: 'Mantém a estrutura apositiva do hebraico: primeiro “o grande rio” e depois sua identificação como Eufrates.'
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: toda a terra dos hititas
  rationale: Representa diretamente כֹּל e preserva a designação étnico-geográfica sem restringir seu alcance.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: e até o Grande Mar
  rationale: Preserva a designação geográfica literal do hebraico no texto principal; uma nota identifica o mar referido.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: na direção do pôr do sol
  rationale: Conserva a imagem hebraica do ocaso, ao mesmo tempo que produz uma expressão natural em português; o sentido direcional “oeste” é indicado em nota.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: será o território de vocês
  rationale: Embora גְּבוּל possa significar “limite” ou “fronteira”, aqui a enumeração descreve a extensão da área concedida. “Território” comunica esse sentido contextual, e “de vocês” reflete o sufixo plural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem geográfica e as aposições do hebraico foram mantidas, mas a sintaxe foi ajustada para fluência. Travessões destacam “toda a terra dos hititas” como elemento parentético da delimitação.
