  text: וְ/לָ/רֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה אָמַ֥ר יְהוֹשֻׁ֖עַ לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: pt
  text: Josué disse aos rubenitas, aos gaditas e à meia tribo de Manassés:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “dizendo”. O termo introduz as palavras de Josué, que continuam no versículo seguinte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: aos rubenitas
  rationale: O gentílico singular hebraico tem sentido coletivo; o plural português comunica naturalmente o grupo a quem Josué se dirige. A preposição לְ é representada pela contração “aos”.
- source_word: וְ/לַ/גָּדִי
  choice: aos gaditas
  rationale: Assim como no termo anterior, o gentílico singular funciona coletivamente, sendo natural vertê-lo no plural em português.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: e à meia tribo de Manassés
  rationale: A expressão preserva com clareza a ideia hebraica de metade da tribo de Manassés; “meia tribo” é conciso e consagrado no uso bíblico português.
- source_word: אָמַר
  choice: disse
  rationale: É a equivalência direta e natural do verbo comum אָמַר neste contexto de introdução a um discurso.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: O infinitivo hebraico introduz a fala que começa no versículo seguinte. Em português atual, os dois-pontos desempenham essa função com mais naturalidade do que a tradução explícita “dizendo”.
