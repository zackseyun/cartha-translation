source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: pt
  text: 'Lembrem-se da palavra que Moisés, servo de Yahweh, lhes ordenou, dizendo: “Yahweh, o Deus de vocês, está lhes dando descanso e lhes deu esta terra[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e lhes dará esta terra”. A forma verbal hebraica pode ser entendida como futuro certo; “deu” corresponde ao fato de que as tribos a leste do Jordão já haviam recebido essa terra como herança.'
    reason: Leitura temporal alternativa de וְנָתַן.
lexical_decisions:
- source_word: זָכוֹר
  choice: Lembrem-se
  rationale: O infinitivo absoluto de זכר funciona aqui como uma exortação imperativa. O plural é natural em português porque Josué se dirige coletivamente às tribos e os demais pronomes hebraicos estão no plural.
- source_word: הַדָּבָר
  choice: da palavra
  rationale: דבר pode significar “palavra”, “assunto” ou “declaração”. “Palavra” preserva a forma ampla do hebraico, enquanto o verbo seguinte deixa claro que se trata de uma ordem.
- source_word: צִוָּה
  choice: ordenou
  rationale: O verbo expressa instrução dotada de autoridade. “Ordenou” comunica essa força de modo claro e atual.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Neste título honorífico de Moisés, עבד destaca seu serviço comissionado por Deus; “servo” é mais apropriado ao contexto do que “escravo”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz diretamente o conteúdo da ordem anterior; “dizendo” mantém essa estrutura de forma transparente.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: A construção com sufixo de segunda pessoa plural é vertida de modo claro e natural, preservando o caráter relacional da declaração.
- source_word: מֵנִיחַ
  choice: está lhes dando descanso
  rationale: O particípio hifil comunica a ação de conceder descanso ou segurança. A forma progressiva preserva seu aspecto durativo no contexto.
- source_word: וְנָתַן
  choice: e lhes deu
  rationale: A forma perfeita pode apontar para uma concessão já efetuada, o que se ajusta à terra a leste do Jordão já atribuída a essas tribos. Como a sequência também admite sentido futuro, essa alternativa é registrada em nota.
- source_word: הָאָרֶץ הַזֹּאת
  choice: esta terra
  rationale: Tradução direta e idiomática da expressão demonstrativa que se refere ao território atribuído às tribos orientais.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega o nome pessoal divino. “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Valor temporal de וְנָתַן
  choice: lhes deu esta terra
  alternative: lhes dará esta terra
  rationale: O perfeito pode descrever a terra como já concedida às tribos orientais, mas sua coordenação com o particípio precedente também permite entendê-lo como futuro certo. A tradução principal segue a situação narrativa e a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para a segunda pessoa plural e mantém “Yahweh” como nome próprio. A sintaxe conserva a solenidade do discurso sem recorrer a formas arcaicas.
