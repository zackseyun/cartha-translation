  text: 'Então Josué ordenou aos oficiais do povo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Então ... ordenou
  rationale: O wayyiqtol de צוה faz a narrativa avançar. “Então” expressa naturalmente a sequência, e “ordenou” preserva a força diretiva do verbo.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אֶת
  choice: '[não traduzido separadamente]'
  rationale: É o marcador hebraico do objeto direto; sua função aparece em português na construção “ordenou aos oficiais”.
- source_word: שֹׁטְרֵי
  choice: oficiais
  rationale: O termo designa agentes com função administrativa ou de supervisão, não necessariamente comandantes militares. “Oficiais” conserva esse caráter formal.
- source_word: הָעָם
  choice: do povo
  rationale: עָם designa aqui a comunidade reunida de Israel; “povo” é a correspondência mais direta e natural.
- source_word: לֵאמֹר
  choice: ':'
  rationale: A fórmula hebraica introduz a fala direta que vem no versículo seguinte. Em português atual, os dois-pontos cumprem essa função com mais naturalidade do que “dizendo” no fim isolado do versículo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Os dois-pontos mantêm explicitamente a ligação com o discurso direto do versículo seguinte.
