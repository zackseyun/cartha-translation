source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: pt
  text: até que Yahweh dê descanso aos seus irmãos[a], como deu a vocês, e também eles tomem posse da terra que Yahweh, o Deus de vocês, lhes dá. Então vocês voltarão à terra de sua herança e tomarão posse da terra que Moisés, servo de Yahweh, deu a vocês, do outro lado do Jordão, na direção do nascer do sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus compatriotas israelitas”. Em hebraico, “seus irmãos”, termo masculino plural que aqui se refere às demais tribos de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “a leste”; literalmente, “na direção do nascer do sol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: dê descanso
  rationale: O hifil de נוח expressa conceder descanso ou estabilidade após o conflito; a formulação é natural e preserva a imagem hebraica.
- source_word: לַאֲחֵיכֶם
  choice: aos seus irmãos
  rationale: Mantém o substantivo masculino plural do hebraico; no contexto, designa os membros das demais tribos de Israel, conforme esclarece a nota.
- source_word: כָּכֶם
  choice: como deu a vocês
  rationale: Explicita o verbo subentendido na comparação elíptica hebraica, retomando o descanso concedido às tribos da Transjordânia.
- source_word: וְיָרְשׁוּ / וִירִשְׁתֶּם
  choice: tomem posse / tomarão posse
  rationale: No contexto de conquista e repartição territorial, ירשׁ indica entrar na posse da terra; a repetição preserva o vínculo lexical.
- source_word: נֹתֵן
  choice: lhes dá
  rationale: O particípio apresenta a concessão divina como ação em curso; o presente português comunica bem esse aspecto.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: a terra que é sua propriedade
  rationale: Expressa de modo claro a terra atribuída como posse, sem reduzir a ideia ao ato de herdar.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Expressão geográfica idiomática que conserva a referência relativa do hebraico.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: na direção do nascer do sol
  rationale: 'Preserva a imagem concreta hebraica, ao mesmo tempo que a nota registra o sentido geográfico simples: leste.'
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Como título honorífico de Moisés, 'servo' comunica serviço e função oficial melhor que 'escravo'.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o Tetragrama; 'Yahweh' representa diretamente o nome pactual sem substituí-lo por um título.
- issue: Termo de parentesco masculino אֲחֵיכֶם
  choice: seus irmãos
  alternative: seus compatriotas israelitas; seus irmãos e irmãs
  rationale: A tradução conserva a forma masculina plural do original, enquanto a nota esclarece sua referência contextual às demais tribos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento por “vocês”. A sintaxe acompanha a progressão temporal do hebraico, e as imagens concretas foram mantidas quando naturais em português.
