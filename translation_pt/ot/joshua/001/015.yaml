  terminology: «Yahweh», «servo», «descanso», «tomar posse», «irmãos» e as notas correspondentes são adequados. «Terra de sua herança» é a formulação portuguesa mais natural e semanticamente precisa para אֶרֶץ יְרֻשַּׁתְכֶם neste contexto de concessão territorial.
