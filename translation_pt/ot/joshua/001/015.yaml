  to: até que Yahweh dê descanso aos seus irmãos[a], como deu a vocês, e também eles tomem posse da terra que Yahweh, o Deus de vocês, lhes dá. Então vocês voltarão à terra de sua herança e tomarão posse da terra que Moisés, servo de Yahweh, deu a vocês, do outro lado do Jordão, na direção do nascer do sol[b].
