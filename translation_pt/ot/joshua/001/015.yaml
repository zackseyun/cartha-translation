  source_fidelity: 'O texto traduz corretamente a sequência e os verbos principais: Yahweh concede descanso às demais tribos, elas tomam posse da terra, e as tribos já instaladas retornam ao território que Moisés lhes deu a leste do Jordão. A expressão «terra que é sua propriedade» comunica parcialmente יְרֻשַּׁתְכֶם, mas enfraquece a nuance de porção recebida por herança/posse e soa menos idiomática neste contexto.'
