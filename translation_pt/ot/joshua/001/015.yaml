  - severity: low
    issue: Construção «tomarão posse dela, a terra que Moisés...»
    rationale: A aposição após o pronome é compreensível, mas menos fluente. Repetir «da terra que Moisés... deu» esclarece imediatamente o antecedente sem alterar o sentido.
