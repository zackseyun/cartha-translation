  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: pt
  text: Assim como ouvimos a Moisés em tudo[a], também ouviremos você. Somente que Yahweh, seu Deus, esteja com você, assim como esteve com Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obedecemos a Moisés em tudo... também obedeceremos a você”. O verbo hebraico שׁמע pode significar tanto “ouvir” como “obedecer”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: ouvimos / ouviremos
  rationale: Com אֶל, o verbo שׁמע pode indicar ouvir ou atender, frequentemente com a implicação de obedecer. “Ouvir” preserva essa amplitude lexical e deixa a nuance de obediência disponível no contexto.
- source_word: כְּכֹל אֲשֶׁר
  choice: assim como ... em tudo
  rationale: A formulação conserva tanto a comparação quanto a abrangência total da declaração, em português natural.
- source_word: רַק
  choice: apenas
  rationale: Introduz uma ressalva ou qualificação ao compromisso assumido, seguida de um desejo referente à presença divina.
- source_word: יִהְיֶה
  choice: que ... esteja
  rationale: Após רַק, o imperfeito tem aqui valor desiderativo, expressando um desejo, não mera previsão futura.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֶיךָ
  choice: seu Deus
  rationale: Reproduz o substantivo com o sufixo masculino singular de segunda pessoa.
- source_word: עִמָּךְ / עִם
  choice: com você / com Moisés
  rationale: Expressa presença e associação, adequadamente vertidas pela preposição “com”.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Marca claramente o paralelo entre a presença de Yahweh com Josué e sua presença com Moisés.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Amplitude de שׁמע na promessa do povo
  choice: ouvimos / ouviremos
  alternative: obedecemos / obedeceremos
  rationale: O contexto inclui lealdade obediente, mas o verbo hebraico preserva a tensão entre escutar, atender e obedecer; a nota explicita a alternativa sem restringir o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna inequívoco o singular dirigido a Josué; “apenas que” conserva de modo natural a ressalva desiderativa introduzida por רַק.
