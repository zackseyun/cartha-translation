  source_fidelity: A tradução preserva adequadamente a comparação abrangente, a promessa dirigida a Josué, o valor desiderativo de יִהְיֶה e o paralelo da presença de Yahweh com Moisés. A alternativa de nota para a nuance de obediência de שׁמע é pertinente.
