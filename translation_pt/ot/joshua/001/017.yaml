    rationale: Embora possível, a ausência de “a” enfraquece em português a ideia de escutar/atender a uma pessoa, que corresponde ao hebraico שׁמע com אֶל. “Ouvimos a Moisés” é mais claro e natural, sem antecipar necessariamente a interpretação “obedecemos”.
  - severity: low
