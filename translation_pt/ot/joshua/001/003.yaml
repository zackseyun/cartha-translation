id: JOS.1.3
reference: Joshua 1:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: pt
  text: Todo lugar em que a planta do pé de vocês pisar[a], eu o dei a vocês, assim como falei a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Todo lugar onde a planta do pé de vocês pisar”.'
    reason: alternativa lexical e sintática para a construção relativa אֲשֶׁר ... בּוֹ
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: Todo lugar
  rationale: A combinação tem sentido distributivo, abrangendo cada lugar; “todo lugar” é natural e preserva o alcance da declaração.
- source_word: אֲשֶׁר ... בּוֹ
  choice: em que
  rationale: A construção relativa retoma “lugar”. Em português, “em que” expressa de modo natural a relação locativa sem reproduzir mecanicamente o pronome hebraico.
- source_word: תִּדְרֹךְ
  choice: pisar
  rationale: O verbo דרך descreve o ato concreto de pôr ou firmar o pé, imagem relevante para a tomada territorial.
- source_word: כַּף רַגְלְכֶם
  choice: a planta do pé de vocês
  rationale: כַּף רֶגֶל designa especificamente a planta do pé. “De vocês” torna explícito que o sufixo hebraico está no plural, enquanto o singular distributivo “pé” conserva a imagem original.
- source_word: לָכֶם
  choice: a vocês
  rationale: Marca os destinatários ou beneficiários da dádiva; a regência com “dar” é idiomática em português.
- source_word: נְתַתִּיו
  choice: eu o dei
  rationale: O perfeito apresenta a concessão como efetuada e certa. O pronome “o” retoma “lugar” e representa o objeto sufixado no verbo hebraico.
- source_word: כַּאֲשֶׁר
  choice: assim como
  rationale: Assinala correspondência com aquilo que Deus já havia dito a Moisés.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: falei a Moisés
  rationale: Mantém o sentido comum de דבר אל sem ampliar interpretativamente para “prometi”.
theological_decisions:
- issue: Aspecto da concessão divina
  choice: eu o dei
  alternative: eu o darei / eu o dou
  rationale: O perfeito נְתַתִּיו apresenta a terra como já concedida pela palavra divina, embora sua ocupação ainda se desenrole na história. A tradução conserva essa tensão sem converter a forma em futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O plural “vocês” traduz o sufixo de segunda pessoa plural; “planta do pé” preserva a imagem concreta do hebraico.
