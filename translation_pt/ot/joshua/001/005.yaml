  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: pt
  text: Nenhum homem conseguirá manter-se diante de você todos os dias da sua vida.[a] Assim como estive com Moisés, estarei com você. Não o deixarei desamparado nem o abandonarei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ninguém conseguirá resistir a você”. “Homem” tem aqui sentido genérico, e a expressão hebraica pode indicar resistência bem-sucedida.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Não soltarei você nem o abandonarei”. O primeiro verbo pode transmitir a ideia de soltar, afrouxar o apoio ou deixar desamparado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ לְפָנֶיךָ
  choice: Nenhum homem poderá resistir diante de você
  rationale: O hitpael de יצב, combinado com לְפָנֶיךָ neste contexto militar, descreve alguém que toma posição contra Josué e consegue manter-se diante dele. “Poderá resistir diante de você” comunica naturalmente a força contextual sem substituir “homem” por “inimigo”, termo não expresso no hebraico.
- source_word: אִישׁ
  choice: homem
  rationale: O substantivo masculino singular tem aqui força genérica, referindo-se a qualquer oponente humano. A forma masculina do texto-fonte é mantida, e seu alcance genérico é esclarecido em nota.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: durante todos os dias da sua vida
  rationale: Reproduz com clareza a expressão hebraica que abrange toda a duração da vida de Josué.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: Assim como estive com Moisés
  rationale: כַּאֲשֶׁר introduz uma comparação direta entre a presença de Deus com Moisés e sua presença prometida com Josué.
- source_word: אֶהְיֶה עִמָּךְ
  choice: estarei com você
  rationale: Expressa de modo direto e natural a promessa da presença divina, sem acrescentar uma interpretação além do texto.
- source_word: לֹא אַרְפְּךָ
  choice: Não o deixarei desamparado
  rationale: O hiphil de רפה pode indicar soltar, afrouxar ou deixar sem apoio. “Não o deixarei desamparado” preserva a ideia de que Deus não retirará seu amparo e distingue este verbo do seguinte.
- source_word: וְלֹא אֶעֶזְבֶךָּ
  choice: nem o abandonarei
  rationale: עזב significa deixar ou abandonar. “Abandonarei” mantém o tom solene da promessa e completa a dupla negação.
theological_decisions:
- issue: Força genérica do masculino אִישׁ
  choice: Nenhum homem
  alternative: Ninguém
  rationale: A tradução conserva a forma masculina do hebraico, mas a nota esclarece que ela tem alcance genérico e se refere a qualquer oponente humano.
- issue: Sentido da dupla promessa לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ
  choice: Não o deixarei desamparado nem o abandonarei
  alternative: Não soltarei você nem o abandonarei
  rationale: A redação distingue a retirada de apoio expressa por רפה do abandono expresso por עזב, preservando a abrangência da promessa sem fundir os dois verbos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” torna explícito o singular dirigido a Josué; os pronomes oblíquos “o” preservam um registro escrito natural. A formulação mantém o paralelismo e a solenidade da promessa sem recorrer a linguagem arcaica.
