  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: pt
  text: Suas esposas, seus filhos pequenos e seus rebanhos permanecerão na terra que Moisés lhes deu do outro lado do Jordão. Vocês, porém — todos os guerreiros valentes — atravessarão armados[a] à frente de seus irmãos[b] e os ajudarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em formação de batalha” ou “preparados para a guerra”.
    reason: alternative_reading
  - marker: b
    text: Isto é, os demais israelitas; o hebraico emprega aqui o termo masculino de parentesco de forma representativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: suas esposas
  rationale: No contexto doméstico e militar, o substantivo com sufixo de segunda pessoa do plural se refere especificamente às esposas dos homens convocados.
- source_word: טַפְּכֶם
  choice: seus filhos pequenos
  rationale: טַף costuma designar crianças pequenas ou dependentes; a escolha preserva o sentido concreto sem recorrer a uma expressão arcaica.
- source_word: וּמִקְנֵיכֶם
  choice: e seus rebanhos
  rationale: מִקְנֶה designa aqui os animais domésticos pertencentes às famílias, e “rebanhos” é claro e natural no contexto.
- source_word: יֵשְׁבוּ
  choice: permanecerão
  rationale: O verbo ישׁב pode significar sentar-se, habitar ou permanecer; aqui indica que as famílias e os rebanhos ficarão no território já recebido.
- source_word: בָּאָרֶץ אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: na terra que Moisés lhes deu
  rationale: Mantém o sentido territorial de אֶרֶץ e apresenta como concluída a concessão feita por Moisés.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: A expressão עֵבֶר הַיַּרְדֵּן indica a região situada além do Jordão; esta formulação portuguesa é natural e conserva a perspectiva contextual.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: Vocês, porém, atravessarão
  rationale: “Porém” explicita o contraste já presente entre os familiares que ficam e os combatentes que atravessam.
- source_word: חֲמֻשִׁים
  choice: armados
  rationale: Em contexto militar, o termo provavelmente descreve homens equipados para o combate, embora sua nuance exata seja discutida.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: à frente de seus irmãos
  rationale: Preserva tanto a ideia espacial de avançar adiante dos demais quanto o termo de parentesco masculino do hebraico.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: todos os guerreiros valentes
  rationale: A expressão designa homens fortes, capazes e valorosos na guerra; “guerreiros valentes” transmite seu valor militar em português corrente.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: e os ajudarão
  rationale: Reproduz de modo direto a obrigação de prestar auxílio aos demais israelitas.
theological_decisions:
- issue: Linguagem de parentesco masculina em אֲחֵיכֶם
  choice: seus irmãos
  alternative: os demais israelitas
  rationale: O hebraico emprega o substantivo masculino de parentesco, com referência representativa aos outros membros de Israel. O texto principal conserva a forma da fonte, e a nota esclarece o referente mais amplo.
- issue: Nuance militar de חֲמֻשִׁים
  choice: armados
  alternative: em formação de batalha; preparados para a guerra
  rationale: “Armados” é o sentido mais provável e conciso neste contexto, mas a nota mantém alternativas legítimas porque a nuance precisa do termo não é inteiramente certa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para ligar com clareza “todos os guerreiros valentes” ao sujeito “vocês”, sem alterar o conteúdo do hebraico.
