  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: pt
  text: 'Depois da morte de Moisés, servo de Yahweh, Yahweh disse a Josué, filho de Num, auxiliar de Moisés[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “aquele que servia a Moisés”; também pode ser traduzido por “assistente de Moisés”, “ministro de Moisés” ou “servidor de Moisés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: Depois da morte
  rationale: A fórmula narrativa introduz a nova cena e, com a expressão temporal, é transmitida naturalmente em português sem acrescentar um advérbio equivalente a “agora”, que não está explícito no hebraico.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Neste título honorífico e pactual de Moisés, “servo” comunica serviço oficial a Deus melhor que “escravo”, sem apagar a amplitude lexical de עֶבֶד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: אמר é o verbo comum de fala; “disse” é direto, atual e idiomático.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Josué, filho de Num
  rationale: Emprega as formas portuguesas convencionais dos nomes e apresenta o patronímico em aposição clara.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: auxiliar de Moisés
  rationale: O particípio designa quem assiste ou serve alguém. “Auxiliar” expressa a função de Josué em português corrente sem as conotações eclesiásticas que “ministro” pode adquirir.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala que vem a seguir; os dois-pontos cumprem essa função de modo natural em português contemporâneo, sem o calque pesado “dizendo”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” conserva o nome pessoal divino em vez de substituí-lo por um título.
- issue: Sentido de עֶבֶד no título de Moisés
  choice: servo
  alternative: escravo
  rationale: Embora עֶבֶד possa indicar escravidão em outros contextos, aqui integra um título honorífico que destaca a fidelidade e o serviço de Moisés a Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita um “agora” não explícito, usa “Num” conforme a forma bíblica portuguesa corrente e transfere o marcador da nota para a expressão lexical a que ela realmente se refere.
