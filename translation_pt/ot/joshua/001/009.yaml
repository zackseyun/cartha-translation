id: JOS.1.9
reference: Joshua 1:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: pt
  text: Eu não lhe ordenei? Seja forte e corajoso. Não se apavore nem desanime, pois Yahweh[a], seu Deus, está com você por onde quer que você vá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “o SENHOR”; também grafado “Javé”.
    reason: Explica a forma do nome divino e informa a tradução tradicional.
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: Eu não lhe ordenei?
  rationale: Mantém a pergunta retórica negativa como uma lembrança enfática da ordem já dada, em português natural e direto.
- source_word: חֲזַק וֶאֱמָץ
  choice: Seja forte e corajoso
  rationale: Preserva o par de exortações, distinguindo força de coragem sem produzir redundância.
- source_word: אַל תַּעֲרֹץ
  choice: Não se apavore
  rationale: Expressa o temor intenso ou pavor indicado por ערץ, com formulação corrente em português.
- source_word: וְאַל תֵּחָת
  choice: nem desanime
  rationale: No contexto, חתת descreve ficar abatido ou desalentado; “desanime” comunica esse sentido de modo claro e natural.
- source_word: כִּי עִמְּךָ
  choice: pois ... está com você
  rationale: “Pois” introduz a razão das ordens anteriores, e “está com você” traduz diretamente a afirmação da presença divina.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Translitera o nome divino e traduz de forma direta a relação expressa pelo sufixo de segunda pessoa.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: por onde quer que você vá
  rationale: Reproduz naturalmente o sentido abrangente da expressão hebraica, referente a qualquer lugar para o qual Josué fosse.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega o nome pessoal divino YHWH. “Yahweh” o representa por transliteração, sem substituí-lo por um título; a nota registra a tradição alternativa.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. Os imperativos reflexivos “não se apavore” e “nem desanime” soam naturais sem enfraquecer a intensidade do hebraico.
