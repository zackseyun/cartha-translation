  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: pt
  text: '“Passem pelo meio do acampamento e ordenem ao povo: ‘Preparem provisões para vocês, porque dentro de três dias[a] vocês atravessarão este Jordão, a fim de entrar e tomar posse da terra que Yahweh, seu Deus, está dando a vocês para que tomem posse dela’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “daqui a três dias” ou “depois de três dias”. A expressão hebraica indica um breve período ainda restante antes da travessia; “dentro de três dias” comunica melhor o sentido neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: Passem pelo meio do acampamento
  rationale: O imperativo plural orienta os oficiais a se deslocarem pelo interior do acampamento. A formulação preserva a imagem espacial de קֶרֶב e soa natural em português.
- source_word: וְצַוּוּ אֶת הָעָם
  choice: e ordenem ao povo
  rationale: צוה comunica uma ordem investida de autoridade; “ordenem” conserva essa força sem soar arcaico.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: Preparem provisões para vocês
  rationale: צֵידָה designa mantimentos ou provisões para uma jornada. “Provisões” abrange o necessário para a travessia, e “para vocês” representa לָכֶם.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: porque dentro de três dias
  rationale: A expressão indica um curto período ainda restante antes da travessia. “Dentro de três dias” preserva a iminência sem impor mais precisão cronológica do que o hebraico permite.
- source_word: אַתֶּם עֹבְרִים
  choice: vocês atravessarão
  rationale: O particípio apresenta a ação como iminente e certa. Em português, o futuro é mais natural neste anúncio e mantém essa expectativa próxima.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: este Jordão
  rationale: Mantém o demonstrativo הַזֶּה e a referência imediata ao rio diante deles; “Jordão” dispensa a explicitação de “rio”.
- source_word: לָבוֹא לָרֶשֶׁת
  choice: a fim de entrar e tomar posse
  rationale: Os infinitivos expressam propósito. “Tomar posse” comunica a força de ירשׁ no contexto de entrada, conquista e herança da terra.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, seu Deus
  rationale: O nome da aliança יְהוָה é transliterado como “Yahweh”; a aposição preserva a fórmula “Yahweh, seu Deus” de modo claro em português.
- source_word: נֹתֵן לָכֶם
  choice: está dando a vocês
  rationale: O particípio retrata a dádiva divina como presente, em curso e certa; a locução progressiva preserva essa força.
- source_word: לְרִשְׁתָּהּ
  choice: para que tomem posse dela
  rationale: Preserva a repetição intencional da raiz ירשׁ no texto hebraico e explicita que a terra é o objeto da posse.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal da aliança sem substituí-lo por um título.
- issue: Relação entre a dádiva divina e a tomada de posse humana
  choice: “está dando” e “tomem posse” são ambas preservadas
  alternative: Simplificar a frase eliminando uma das ações
  rationale: O versículo mantém em tensão complementar a terra como dádiva de Yahweh e a responsabilidade de Israel de entrar e tomar posse; a tradução não reduz uma à outra.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Emprega “vocês” para deixar claro o plural dos imperativos e mantém a repetição de “tomar posse”, importante para a estrutura e a ênfase do hebraico.
