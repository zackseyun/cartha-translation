source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: pt
  text: 'Levante-se, consagre o povo e diga: “Consagrem-se para amanhã, pois assim diz Yahweh, o Deus de Israel: Há em seu meio, Israel, algo destinado à destruição[a]. Você não poderá manter-se de pé diante dos seus inimigos até que vocês removam do meio de vocês aquilo que foi destinado à destruição.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico חֵרֶם (ḥērem), tradicionalmente “anátema” ou “coisa consagrada”; o termo indica algo colocado sob dedicação irrevogável, aqui para destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: Levante-se
  rationale: Imperativo singular dirigido a Josué, comunicando ação imediata em português natural.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: consagre / Consagrem-se
  rationale: Preserva a ligação lexical entre o piel causativo e o hitpael reflexivo, bem como o sentido de preparação e separação ritual.
- source_word: לְמָחָר
  choice: para amanhã
  rationale: Expressa preparação tendo em vista o dia seguinte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: חֵרֶם
  choice: algo destinado à destruição / aquilo que foi destinado à destruição
  rationale: Comunica que se trata de algo colocado sob dedicação irrevogável, neste contexto para destruição, evitando o tecnicismo pouco transparente “anátema”.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: em seu meio, Israel
  rationale: Mantém o tratamento singular corporativo e o vocativo dirigido a Israel.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: Você não poderá manter-se de pé diante dos seus inimigos
  rationale: Reproduz a imagem hebraica de permanecer de pé e seu sentido contextual de resistir ou prevalecer diante dos inimigos.
- source_word: עַד הֲסִירְכֶם
  choice: até que vocês removam
  rationale: Mantém o limite temporal-condicional e a mudança do singular corporativo para o plural, explícita no hebraico.
theological_decisions:
- issue: Sentido de חֵרֶם no contexto de juízo e guerra em Josué
  choice: algo destinado à destruição
  alternative: anátema; coisa consagrada; coisa condenada
  rationale: A formulação torna explícita a dedicação irrevogável para destruição exigida pelo contexto, sem reduzir o termo a uma maldição abstrata nem ocultar sua dimensão de consagração.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Preserva no texto traduzido o caráter de nome próprio da forma hebraica.
- issue: Alternância entre Israel no singular e a comunidade no plural
  choice: “seu/Você” seguido de “vocês”
  alternative: uniformizar todo o trecho no singular ou no plural
  rationale: A mudança de número está presente no hebraico e ressalta tanto Israel como unidade coletiva quanto a responsabilidade dos integrantes da comunidade; por isso, não foi nivelada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “consagre/Consagrem-se” e a mudança deliberada do singular para o plural refletem características do hebraico. O marcador [a] foi colocado junto à primeira ocorrência do termo que a nota explica.
