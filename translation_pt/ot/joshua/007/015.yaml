language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: pt
  text: Aquele que for identificado com a coisa consagrada à destruição[a] será queimado no fogo, ele e tudo o que lhe pertence, porque violou a aliança de Yahweh e cometeu um ato infame em Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, tradicionalmente, “a coisa amaldiçoada”. O hebraico ḥerem se refere ao que foi colocado sob proibição, separado para Deus e destinado à destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: aquele que for identificado
  rationale: O particípio passivo de לכד se refere à pessoa apontada pelo processo de sorteio sagrado. “For identificado” comunica naturalmente esse sentido judicial sem sugerir captura militar.
- source_word: בַּחֵרֶם
  choice: com a coisa consagrada à destruição
  rationale: חֵרֶם designa aquilo que foi separado para Deus e retirado do uso comum, neste contexto destinado à destruição. A formulação explicita os dois aspectos e mantém a associação expressa pela preposição.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: será queimado no fogo
  rationale: Tradução direta e natural do imperfeito passivo com a expressão referente ao fogo.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: ele e tudo o que lhe pertence
  rationale: A construção inclui o infrator e tudo o que é seu, sem especificar além do que o hebraico declara.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: violou a aliança de Yahweh
  rationale: עבר com בְּרִית indica ultrapassar os limites da aliança e, assim, violá-la. “Violou” preserva a força jurídica e pactual em português corrente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: נְבָלָה
  choice: um ato infame
  rationale: נְבָלָה denota uma ação moralmente vergonhosa e ultrajante, não mera insensatez intelectual. “Ato infame” transmite essa gravidade em registro digno e acessível.
- source_word: בְּיִשְׂרָאֵל
  choice: em Israel
  rationale: 'Mantém o sentido locativo: a ofensa ocorreu no âmbito da comunidade da aliança.'
theological_decisions:
- issue: Sentido de חֵרֶם no contexto de juízo da aliança
  choice: coisa consagrada à destruição
  alternative: coisa amaldiçoada; coisa sob proibição
  rationale: A expressão preserva tanto a consagração a Deus quanto o destino destrutivo próprio do termo neste contexto. A alternativa tradicional é registrada em nota para não apagar sua relevância interpretativa.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: A transliteração preserva o nome pessoal no texto, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Aquele que for identificado” contextualiza o processo de sorteio sem acrescentar seu mecanismo ao versículo; “ato infame” conserva a forte censura moral de נְבָלָה.
