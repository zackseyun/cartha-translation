base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: pt
  text: 'Yahweh disse a Josué: “Levante-se! Por que você está assim, prostrado, com o rosto em terra?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: disse
  rationale: Forma narrativa usual de אמר, vertida naturalmente pelo pretérito perfeito em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: קֻם לָךְ
  choice: Levante-se!
  rationale: O imperativo de קום exige que Josué abandone sua posição no chão; o elemento pronominal לָךְ reforça idiomaticamente a ordem e não requer tradução separada.
- source_word: לָמָּה זֶּה
  choice: Por que ... aí
  rationale: O demonstrativo זֶּה acrescenta ênfase à pergunta. O advérbio “aí” a comunica de modo natural no contexto da postura atual de Josué, sem recorrer a um literalismo estranho.
- source_word: אַתָּה נֹפֵל
  choice: você está ... prostrado
  rationale: O pronome explícito é preservado por “você”, e o particípio descreve a condição presente de Josué. No contexto, não indica o movimento de cair, mas sua permanência em prostração.
- source_word: עַל־פָּנֶיךָ
  choice: com o rosto em terra
  rationale: Equivalente idiomático e claro da expressão hebraica para estar de bruços ou em prostração.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor
  rationale: O texto hebraico apresenta o nome pessoal divino; a transliteração o preserva e evita substituí-lo silenciosamente por um título.
- issue: Natureza da postura de Josué
  choice: prostrado, com o rosto em terra
  alternative: caindo sobre o seu rosto
  rationale: O particípio e o contexto retratam Josué já em prostração. A escolha não determina se o gesto expressa oração, luto ou súplica, preservando a tensão contextual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativo direto e pergunta natural. “Aí” conserva de maneira discreta a ênfase de לָמָּה זֶּה, enquanto “prostrado, com o rosto em terra” comunica claramente a postura sem sugerir que Josué ainda esteja no ato físico de cair.
