  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: pt
  text: Mas os filhos de Israel foram infiéis em relação ao que havia sido consagrado à destruição[a], pois Acã, filho de Carmi, filho de Zabdi, filho de Zerá, da tribo de Judá, tomou algumas das coisas consagradas à destruição. Por isso, a ira de Yahweh se acendeu contra os filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que havia sido consagrado”, ou, mais formalmente, “o interdito”. O hebraico חֵרֶם refere-se a pessoas ou coisas separadas para Deus, para destruição ou para serem retiradas do uso humano comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: foram infiéis
  rationale: O verbo מעל e seu substantivo cognato expressam quebra de confiança ou infidelidade, especialmente em contexto de aliança. A formulação portuguesa preserva essa força sem reproduzir de modo artificial o acusativo cognato hebraico.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar hebraica e a identidade coletiva enfatizada no versículo, em que todo o povo é implicado pelo ato de um de seus membros.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: o que havia sido consagrado à destruição / algumas dessas coisas
  rationale: חֵרֶם designa aqui aquilo que foi separado para Deus e retirado do uso humano, neste contexto mediante destruição. A segunda ocorrência é retomada naturalmente, enquanto 'algumas' comunica o valor partitivo de מִן.
- source_word: וַיִּקַּח
  choice: tomou
  rationale: Tradução direta e natural; o complemento 'algumas dessas coisas' explicita sem exagero que Acã tomou parte do conjunto consagrado.
- source_word: לְמַטֵּה יְהוּדָה
  choice: da tribo de Judá
  rationale: מַטֶּה, neste contexto genealógico, significa 'tribo'; a construção é concisa e idiomática em português.
- source_word: וַיִּחַר אַף יְהוָה
  choice: a ira de Yahweh se acendeu
  rationale: Preserva a metáfora hebraica da ira que arde em uma formulação digna e corrente em português.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, em vez de substituí-lo por um título.
theological_decisions:
- issue: Responsabilidade coletiva dos filhos de Israel e ato individual de Acã
  choice: Manter o sujeito coletivo na primeira oração e identificar Acã como o agente individual na oração seguinte.
  alternative: Atribuir a infidelidade apenas a Acã ou reduzir a formulação a 'Israel foi infiel'.
  rationale: O hebraico sustenta deliberadamente a tensão entre o pecado de um indivíduo e a implicação e consequência corporativas; a tradução não a resolve nem a suaviza.
- issue: Sentido de חֵרֶם neste contexto
  choice: Traduzir como aquilo que foi 'consagrado à destruição', com nota explicativa.
  alternative: Usar apenas 'coisas consagradas' ou o termo técnico 'anátema'.
  rationale: A escolha comunica tanto a separação para Deus quanto o destino destrutivo pertinente ao contexto, sem importar uma conotação eclesiástica posterior.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A genealogia conserva a repetição hebraica de “filho de”, e o nome divino aparece como “Yahweh”.
