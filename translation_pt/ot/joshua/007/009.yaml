base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: pt
  text: Pois os cananeus e todos os habitantes da terra ouvirão, nos cercarão e apagarão o nosso nome da terra.[a] E o que farás pelo teu grande nome?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Apagar o nosso nome” é uma expressão que se refere a eliminar completamente um povo e sua lembrança.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: ouvirão isso
  rationale: O imperfeito qal tem sentido futuro na consequência prevista por Josué. “Isso” explicita naturalmente em português o conteúdo ouvido — a derrota de Israel — sem acrescentar uma nova ideia.
- source_word: הַכְּנַעֲנִי
  choice: os cananeus
  rationale: Embora formalmente singular, o gentílico é coletivo e se refere ao povo cananeu; o plural é natural em português.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: e todos os habitantes da terra
  rationale: O particípio substantivado יֹשְׁבֵי designa os habitantes. No contexto, הָאָרֶץ é a terra ou região circundante, não necessariamente o mundo inteiro.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: nos cercarão
  rationale: נסב com עַל expressa aqui a ação militar de rodear ou cercar.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: apagarão o nosso nome da face da terra
  rationale: A expressão hebraica fala da eliminação completa de um povo e de sua memória. “Apagar o nome da face da terra” preserva a imagem e comunica o idioma com clareza em português.
- source_word: וּמַה תַּעֲשֶׂה
  choice: E então, o que farás
  rationale: Mantém a pergunta direta dirigida a Deus; “então” torna natural a ligação consequencial já presente no contexto, sem mudar o sentido.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: pelo teu grande nome
  rationale: A preposição לְ permite aqui o sentido de agir em favor ou por causa do nome. A formulação preserva de modo conciso a preocupação com a honra pública de Deus.
theological_decisions:
- issue: Sentido de “teu grande nome” no apelo de Josué
  choice: Apelo à honra e à reputação pública de Deus, ligadas ao destino de Israel
  alternative: Referência ao nome de Deus sem explicitar sua reputação entre as nações
  rationale: O contexto mostra que Josué teme o efeito da destruição de Israel sobre a percepção do SENHOR entre os povos. A tradução conserva essa dimensão sem desenvolver a expressão além do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O tratamento na segunda pessoa do singular preserva a solenidade da oração dirigida a Deus. A tradução mantém a imagem hebraica do “nome”, explicando o idioma em nota.
