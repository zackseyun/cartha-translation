base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: pt
  text: Pela manhã, vocês se aproximarão, tribo por tribo. A tribo que Yahweh indicar[a] se aproximará, clã por clã; o clã que Yahweh indicar se aproximará, família por família; e a família que Yahweh indicar se aproximará homem por homem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomar” ou “capturar”. O verbo hebraico costuma ter esses sentidos, mas aqui se refere ao grupo que Yahweh identifica, provavelmente mediante sorte sagrada.
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico se refere aos homens; no contexto, a expressão tem sentido distributivo: a identificação final seria feita homem por homem dentro da família.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: vocês se aproximarão / se aproximará
  rationale: Preserva a repetição do verbo קרב e seu sentido de comparecer formalmente para a identificação, sem acrescentar explicitamente um objeto ou local ausente do hebraico.
- source_word: לְשִׁבְטֵיכֶם
  choice: tribo por tribo
  rationale: Expressa de modo natural em português a organização distributiva do procedimento.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: indicar
  rationale: לכד normalmente significa capturar ou apanhar, mas aqui descreve a identificação feita por Yahweh, provavelmente mediante sorte sagrada. “Indicar” comunica o sentido contextual sem sugerir captura física; a nota preserva o valor lexical concreto.
- source_word: לַמִּשְׁפָּחוֹת
  choice: clã por clã
  rationale: מִשְׁפָּחָה designa aqui uma subdivisão da tribo mais ampla que uma família doméstica; “clã” mantém essa distinção social.
- source_word: לַבָּתִּים
  choice: família por família
  rationale: בַּיִת, literalmente “casa”, refere-se neste contexto à unidade familiar ou doméstica dentro do clã. “Família” é claro e natural em português moderno.
- source_word: לַגְּבָרִים
  choice: homem por homem
  rationale: Mantém tanto o sentido distributivo quanto a referência masculina explícita de גְּבָרִים, no último nível da identificação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de o substituir pelo título tradicional.
- issue: Agência divina no processo de identificação
  choice: que Yahweh indicar
  alternative: que Yahweh capturar ou apanhar
  rationale: A formulação mantém Yahweh como agente explícito, mas não especifica além do texto o mecanismo exato da identificação. A provável utilização de sorte sagrada é mencionada apenas na nota, não inserida no versículo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “tribo por tribo”, “clã por clã”, “família por família” e “homem por homem” reproduz a progressão ordenada do hebraico. O plural “vocês” evita uma forma lusófona regionalmente marcada, e os pontos e vírgulas tornam legível a longa sequência procedural.
