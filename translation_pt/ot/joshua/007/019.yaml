source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: pt
  text: 'Então Josué disse a Acã: “Meu filho, por favor, dê glória a Javé, o Deus de Israel, e dê graças a ele.[a] Conte-me, por favor, o que você fez; não esconda isso de mim.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “renda-lhe louvor”; neste contexto, a expressão também pode ter o sentido de “confesse diante dele”.
    reason: A palavra hebraica תוֹדָה admite os sentidos de ação de graças, louvor e, em certos contextos, confissão ou reconhecimento.
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva a forma masculina singular e o tom paternal, solene e pessoal do apelo de Josué.
- source_word: שִׂים נָא כָבוֹד
  choice: por favor, dê glória
  rationale: A expressão hebraica literalmente fala em pôr ou atribuir glória; “dê glória” comunica de modo natural o reconhecimento da honra de Deus, e “por favor” representa נָא.
- source_word: לַיהוָה
  choice: a Javé
  rationale: Translitera o nome divino יהוה de modo reconhecível em português e preserva sua condição de nome próprio no texto hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção que identifica Deus por sua relação com Israel.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: e dê graças a ele
  rationale: תוֹדָה pode indicar ação de graças, louvor ou reconhecimento/confissão. A opção principal mantém o sentido usual de agradecimento sem eliminar, por nota, a forte nuance confessional do contexto.
- source_word: וְהַגֶּד נָא לִי
  choice: Conte-me, por favor
  rationale: Expressa com linguagem portuguesa corrente o imperativo de declarar ou relatar, preservando a força cortês de נָא.
- source_word: מֶה עָשִׂיתָ
  choice: o que você fez
  rationale: Forma direta e natural em português para a ação concluída que continua relevante no interrogatório.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: não esconda isso de mim
  rationale: כחד significa esconder, encobrir ou reter. “Isso” explicita naturalmente em português o objeto implícito, isto é, o que Acã fez.
theological_decisions:
- issue: Sentido de תוֹדָה no contexto de confissão
  choice: “dê graças a ele” no texto principal, com as possibilidades de louvor e confissão registradas em nota
  alternative: “renda-lhe louvor” ou “confesse diante dele”
  rationale: O contexto judicial indica um chamado a reconhecer a verdade diante de Deus, mas o substantivo hebraico também denota ação de graças ou louvor. A tradução não reduz a expressão a um único sentido teológico ou jurídico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” no discurso direto e mantém a repetição cortês de נָא. O nome divino é apresentado como “Javé”, e o nome עָכָן na forma portuguesa tradicional “Acã”.
