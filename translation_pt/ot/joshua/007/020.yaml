base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: pt
  text: 'Acã respondeu a Josué: “De fato, eu pequei contra Yahweh, o Deus de Israel, e foi isto que fiz[a]:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e assim e assim fiz”. A expressão hebraica introduz os detalhes do que Acã havia feito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: respondeu
  rationale: A combinação narrativa hebraica significa literalmente “respondeu e disse”, mas, em português atual, “respondeu” expressa naturalmente a introdução da fala sem redundância.
- source_word: עָכָן
  choice: Acã
  rationale: Forma tradicional e amplamente reconhecida do nome hebraico em português.
- source_word: אָמְנָה
  choice: É verdade!
  rationale: Expressa a afirmação enfática e solene que introduz a confissão, em linguagem portuguesa natural.
- source_word: אָנֹכִי חָטָאתִי
  choice: Eu pequei
  rationale: O pronome explícito preserva a ênfase pessoal da confissão; o pretérito perfeito traduz naturalmente a ação concluída.
- source_word: לַיהוָה
  choice: contra Yahweh
  rationale: Com o verbo “pecar”, a preposição identifica aquele contra quem se pecou; “Yahweh” representa diretamente o nome divino יהוה.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da construção hebraica.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: e foi isto que fiz
  rationale: A expressão hebraica formulaica introduz os detalhes que seguem; esta redação comunica essa função de modo claro e natural, sem sugerir vagamente ações não especificadas.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino; “Yahweh” o preserva de forma explícita, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção redundante “respondeu e disse” foi naturalizada, enquanto a ênfase da confissão foi preservada.
