base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: pt
  text: Os homens de Ai abateram cerca de trinta e seis homens dentre eles e os perseguiram desde o portão até Sebarim[a], ferindo-os na descida. Então o coração do povo se derreteu e se tornou como água.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até as pedreiras” ou “até os lugares arruinados”. O hebraico שברים pode ser entendido como o nome de um lugar, Sebarim, ou como um termo descritivo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: mataram ... deles
  rationale: No contexto da batalha, נכה indica golpes fatais, pois o número de baixas é especificado; “deles” expressa naturalmente que as vítimas pertenciam ao contingente israelita.
- source_word: אַנְשֵׁי הָעַי
  choice: os homens de Ai
  rationale: Mantém o topônimo e traduz de modo natural a construção que designa os homens pertencentes à cidade.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: cerca de trinta e seis
  rationale: O prefixo כ־ marca aproximação; em português, o referente humano já fica claro pelo pronome “deles” e pelo contexto militar.
- source_word: וַיִּרְדְּפוּם לִפְנֵי הַשַּׁעַר
  choice: os perseguiram desde a entrada da cidade
  rationale: רדף é “perseguir”; לפני השער indica o ponto de partida diante do portão. “Entrada da cidade” comunica com clareza a função do portão em português atual.
- source_word: עַד הַשְּׁבָרִים
  choice: até Sebarim
  rationale: Preserva no texto principal a possível leitura como topônimo, sem eliminar as leituras descritivas registradas na nota.
- source_word: וַיַּכּוּם בַּמּוֹרָד
  choice: ferindo-os na descida
  rationale: A segunda ocorrência de נכה descreve novos golpes durante a perseguição; “ferindo-os” evita afirmar que essas mesmas pessoas foram mortas outra vez. מורד designa uma descida ou ladeira.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: o coração do povo se derreteu
  rationale: Conserva a vívida metáfora hebraica para a perda completa da coragem, inteligível em português.
- source_word: וַיְהִי לְמָיִם
  choice: se tornou como água
  rationale: Preserva a imagem de dissolução da coragem de maneira natural, explicitando o valor comparativo da metáfora em português.
