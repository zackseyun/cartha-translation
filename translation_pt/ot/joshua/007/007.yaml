  naturalness: O texto é claro e de registro apropriado. Contudo, “tivéssemos concordado em permanecer” é possível, mas soa menos idiomático e pode sugerir concordância entre pessoas. “Tivéssemos nos disposto a permanecer” expressa mais diretamente a disposição/volição do hebraico e flui melhor.
  terminology: “Senhor Yahweh”, “amorreus”, “Jordão” e “nas mãos dos amorreus” são escolhas corretas, compreensíveis e consistentes com a terminologia bíblica. A nota explica de modo suficiente a combinação de título e nome divino.
