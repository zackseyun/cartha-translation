  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: pt
  text: 'E Josué disse: “Ah, Senhor Yahweh[a], por que fizeste este povo atravessar o Jordão, afinal? Foi para nos entregar nas mãos dos amorreus e nos destruir? Quem dera tivéssemos nos disposto a permanecer do outro lado do Jordão!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Adonai YHWH”, isto é, “Senhor Yahweh”.'
    reason: Esclarecer que o original reúne o título “Senhor” e o nome divino Yahweh.
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah
  rationale: Interjeição de lamento e aflição; “Ah” conserva a exclamação abrupta e é natural no português atual.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Reproduz o título אֲדֹנָי e o nome divino יהוה sem substituir o nome próprio por um título.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: fizeste ... atravessar ... afinal
  rationale: A construção com verbo finito e infinitivo absoluto dá ênfase à ação; “afinal” comunica em português a força indignada da pergunta.
- source_word: אֶת־הָעָם הַזֶּה
  choice: este povo
  rationale: Mantém o substantivo coletivo singular e seu sentido nacional.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: nos entregar nas mãos dos amorreus
  rationale: Preserva de modo natural a metáfora hebraica da mão como poder ou domínio; o singular coletivo hebraico é expresso pelo plural português.
- source_word: לְהַאֲבִידֵנוּ
  choice: nos destruir
  rationale: Expressa diretamente o resultado grave indicado pelo infinitivo hebraico.
- source_word: וְלוּ
  choice: Quem dera
  rationale: Introduz com naturalidade um desejo contrário à situação presente, mantendo a intensidade do lamento.
- source_word: הוֹאַלְנוּ וַנֵּשֶׁב
  choice: tivéssemos concordado em permanecer
  rationale: “Concordado” preserva a ideia de consentimento ou disposição voluntária de יאל, sem introduzir a noção de satisfação; “permanecer” comunica que Josué desejava que tivessem ficado a leste do Jordão.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: Expressão contextual e natural para o lado oriental do rio, onde Israel se encontrava antes da travessia.
theological_decisions:
- issue: Tradução do nome divino na expressão אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: Mantém distintos o título אֲדֹנָי e o nome da aliança יהוה, sem ocultar o nome divino nem produzir “Senhor SENHOR”.
- issue: Forma da queixa de Josué sobre o propósito da travessia
  choice: Perguntas angustiadas dirigidas a Deus, sem suavização
  alternative: Reformular como afirmação de temor
  rationale: O hebraico conserva a tensão de Josué questionar por que Deus fez o povo atravessar e se foi para entregá-lo à destruição; a tradução não transforma a fala em uma conclusão teológica do narrador.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega a segunda pessoa singular nas formas verbais por se tratar de uma oração direta a Deus. A pontuação divide a longa pergunta hebraica em duas perguntas naturais, sem alterar sua relação de propósito.
