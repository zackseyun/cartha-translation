  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: pt
  text: Então Josué apresentou o clã de Judá, e o clã dos zeraítas foi indicado. Depois, apresentou o clã dos zeraítas homem por homem[a], e Zabdi foi indicado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «aos homens». Pelo contexto, é provável que os membros do clã tenham sido apresentados individualmente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fez chegar
  rationale: O hifil de קרב significa fazer aproximar ou apresentar. “Fez chegar” preserva a imagem do hebraico e o caráter formal do procedimento.
- source_word: מִשְׁפַּחַת
  choice: clã
  rationale: Neste contexto, designa uma divisão de parentesco dentro da tribo, mais ampla que uma família nuclear.
- source_word: יְהוּדָה
  choice: Judá
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: foi indicado
  rationale: Embora o verbo tenha o sentido básico de “apanhar” ou “tomar”, neste procedimento ele descreve quem foi apontado na seleção. “Foi indicado” conserva a voz passiva sem sugerir captura militar nem explicitar além do texto o mecanismo usado.
- source_word: הַזַּרְחִי
  choice: os zeraítas
  rationale: Forma gentílica que identifica os descendentes de Zerá; é concisa e natural em português.
- source_word: לַגְּבָרִים
  choice: homem por homem
  rationale: No processo de identificação progressiva, a expressão indica que os homens foram apresentados individualmente. A tradução comunica de modo natural esse provável valor distributivo.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Transliteração portuguesa reconhecível do nome pessoal hebraico.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com estrutura narrativa direta. O sujeito implícito do hebraico foi identificado como Josué pelo contexto. A formulação evita acrescentar explicitamente “por sorteio”, embora o procedimento contextual possa envolver sorte ou determinação divina.
