  text: וַ/יִּשְׁלַ֤ח יְהוֹשֻׁ֨עַ֙ מַלְאָכִ֔ים וַ/יָּרֻ֖צוּ הָ/אֹ֑הֱלָ/ה וְ/הִנֵּ֧ה טְמוּנָ֛ה בְּ/אָהֳל֖/וֹ וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: pt
  text: 'Então Josué enviou mensageiros, que correram até a tenda. E ali estava: a capa escondida na tenda de Acã, e a prata debaixo dela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “e a prata estava debaixo dela”. O hebraico apenas coordena “e a prata” com a frase anterior, sem repetir o verbo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Tradução narrativa natural e direta de שלח.
- source_word: מַלְאָכִים
  choice: mensageiros
  rationale: O contexto indica emissários humanos enviados por Josué, não anjos.
- source_word: וַיָּרֻצוּ
  choice: correram
  rationale: Preserva a ação vívida expressa por רוץ, sem suavizá-la para 'apressaram-se'.
- source_word: הָאֹהֱלָה
  choice: até a tenda
  rationale: Expressa naturalmente o movimento indicado pelo hê direcional; a referência à tenda de Acã fica clara na continuação.
- source_word: וְהִנֵּה
  choice: E ali estava
  rationale: Reproduz em português atual a força de descoberta e apresentação de הנה, evitando o pouco corrente 'e eis'.
- source_word: טְמוּנָה
  choice: a capa escondida
  rationale: O feminino singular retoma naturalmente a capa mencionada no versículo anterior. A explicitação do referente evita um pronome feminino sem antecedente expresso neste versículo.
- source_word: בְּאָהֳלוֹ
  choice: na tenda de Acã
  rationale: O sufixo significa literalmente 'na tenda dele'; explicitar Acã elimina uma referência pronominal potencialmente ambígua em português.
- source_word: וְהַכֶּסֶף
  choice: e a prata
  rationale: Mantém a coordenação simples do hebraico, sem decidir se a prata integra a mesma construção predicativa ou constitui uma cláusula adicional.
- source_word: תַּחְתֶּיהָ
  choice: debaixo dela
  rationale: O sufixo feminino singular remete mais naturalmente à capa mencionada no versículo anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação 'E ali estava' conserva o efeito narrativo de descoberta; 'capa' e 'Acã' são retomados do contexto imediato para tornar explícitas referências que o hebraico deixa implícitas. O marcador [a] aparece no texto principal.
