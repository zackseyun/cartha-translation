  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: pt
  text: Por isso, os filhos de Israel não conseguem resistir diante de seus inimigos; viram as costas diante de seus inimigos, porque se tornaram consagrados à destruição[a]. Não estarei mais com vocês, a menos que destruam, do meio de vocês, a coisa consagrada à destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico חֵרֶם (ḥérem) designa algo irrevogavelmente consagrado a Deus e, neste contexto, destinado à destruição. A mesma palavra ocorre no fim do versículo para a coisa que deve ser destruída e removida do meio do povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão corporativa e pactual do hebraico, embora “os israelitas” também fosse possível em português corrente.
- source_word: יֻכְלוּ ... לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: não conseguem resistir diante dos seus inimigos
  rationale: O idioma descreve a incapacidade de manter posição diante do adversário; “resistir” comunica naturalmente esse sentido militar em português.
- source_word: עֹרֶף יִפְנוּ
  choice: viram as costas diante deles
  rationale: Mantém a imagem hebraica de dar as costas, que indica retirada e derrota, sem reduzi-la simplesmente a “fogem”.
- source_word: הָיוּ לְחֵרֶם
  choice: se tornaram sujeitos à destruição
  rationale: Expressa que Israel passou a compartilhar a condição judicial daquilo que estava consagrado à destruição, evitando sugerir que o povo se consagrou voluntariamente.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: Não continuarei com vocês
  rationale: A construção com יסף e infinitivo indica cessação da presença acompanhadora de Deus; a formulação é clara e corrente.
- source_word: אִם לֹא
  choice: a menos que
  rationale: Representa naturalmente em português a condição negativa do hebraico.
- source_word: תַשְׁמִידוּ הַחֵרֶם מִקִּרְבְּכֶם
  choice: eliminem do meio de vocês, destruindo-a, a coisa que foi consagrada à destruição
  rationale: Preserva tanto a força destrutiva do hifil de שׁמד quanto a remoção da comunidade, e trata הַחֵרֶם concretamente como aquilo que estava sob a interdição.
theological_decisions:
- issue: O duplo uso de חֵרֶם, primeiro como condição de Israel e depois como realidade concreta no acampamento
  choice: “sujeitos à destruição” e “a coisa que foi consagrada à destruição”
  alternative: “amaldiçoados” e “a coisa amaldiçoada”; ou “sob interdição” e “a coisa interditada”
  rationale: חֵרֶם designa aquilo que é irrevogavelmente entregue a Deus e, neste contexto, destinado à destruição. A tradução mantém a ligação semântica entre os dois usos, mas distingue a condição judicial do povo da coisa concreta que permanecia no meio dele. Evita reduzir o conceito a uma maldição genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Filhos de Israel” conserva a forma corporativa do hebraico; “resistir” esclarece o idioma militar. A repetição integral de “diante dos seus inimigos” foi suavizada na segunda ocorrência para evitar rigidez, sem perda de sentido.
