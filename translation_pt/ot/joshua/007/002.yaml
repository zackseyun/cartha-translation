base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: pt
  text: 'Josué enviou homens de Jericó a Ai[a], que fica perto de Bete-Áven, a leste de Betel, e lhes disse: “Subam e espionem a terra.” Então os homens subiram e espionaram Ai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que fica junto a Bete-Áven”. O hebraico diz literalmente “que está com Bete-Áven”, empregando uma preposição que pode indicar proximidade geográfica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: enviou
  rationale: Forma narrativa de שלח; “enviou” expressa a ação de modo direto e natural.
- source_word: אֲנָשִׁים
  choice: homens
  rationale: O substantivo hebraico é masculino plural e, no contexto, designa os homens enviados para reconhecimento.
- source_word: מִירִיחוֹ
  choice: de Jericó
  rationale: A preposição מן indica o ponto de partida; usa-se a forma portuguesa tradicional do topônimo.
- source_word: הָעַי
  choice: Ai
  rationale: Topônimo tradicional em português; o artigo hebraico não precisa ser reproduzido diante do nome próprio.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: que fica perto de Bete-Áven
  rationale: עִם significa literalmente “com”, mas nesta descrição geográfica indica proximidade ou associação; “perto de” comunica naturalmente o sentido sem ocultar a alternativa, registrada em nota.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: a leste de Betel
  rationale: Na notação geográfica, a expressão situa Ai no lado oriental de Betel.
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: e lhes disse
  rationale: A fórmula hebraica de introdução da fala é condensada segundo o uso natural do português, sem perda de conteúdo.
- source_word: עֲלוּ
  choice: Subam
  rationale: עלה preserva aqui a ideia de deslocamento ascendente, apropriada ao relevo e à narrativa.
- source_word: וְרַגְּלוּ
  choice: espionem
  rationale: O piel de רגל descreve reconhecimento de caráter militar; “espionem” mantém esse sentido e é compreensível em português corrente.
- source_word: אֶת הָאָרֶץ
  choice: a terra
  rationale: אָרֶץ designa a área ou território a ser reconhecido; “terra” conserva a amplitude lexical do hebraico.
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: Repete o verbo עלה da ordem anterior, preservando a correspondência narrativa.
- source_word: וַיְרַגְּלוּ
  choice: espionaram
  rationale: Mantém a repetição lexical de רגל entre a ordem e seu cumprimento.
