base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: pt
  text: Eles ergueram sobre ele um grande monte de pedras até hoje. Então Yahweh se desviou do ardor da sua ira. Por isso, aquele lugar é chamado Vale de Acor[a] até hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Acor está relacionado à palavra hebraica para «transtorno» ou «aflição»; compare Josué 7:25.
    reason: Explica o jogo de palavras hebraico ligado ao nome do vale.
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: ergueram sobre ele um grande monte de pedras
  rationale: O hifil de קום indica fazer levantar ou erguer, e גַּל designa um monte ou amontoado. A formulação é direta e natural em português.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: que permanece até hoje / até hoje
  rationale: Na primeira ocorrência, a expressão indica que o monte continuava presente no tempo do narrador; explicitar «que permanece» evita a leitura equivocada de que o ato de erguer continuou até hoje. Na segunda, «até hoje» expressa naturalmente a continuidade do nome.
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Então Yahweh se afastou do ardor da sua ira
  rationale: שׁוב com מִן conserva a imagem de voltar-se ou afastar-se de algo, enquanto חֲרוֹן אַף é vertido com a metáfora hebraica do ardor da ira, sem a reduzir a uma abstração.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַל כֵּן
  choice: Por isso
  rationale: Introduz de modo claro e corrente a explicação causal do nome do lugar.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא עֵמֶק עָכוֹר
  choice: aquele lugar é chamado vale de Acor
  rationale: A construção hebraica de sujeito indeterminado é representada naturalmente pela voz passiva; «Acor» é mantido como nome próprio, com o jogo de palavras explicado em nota.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR / Jeová
  rationale: O texto traz o nome divino, não um título; a transliteração preserva essa distinção.
- issue: Descrição da cessação da ira divina
  choice: Yahweh se afastou do ardor da sua ira
  alternative: a ira de Yahweh cessou / Yahweh se acalmou
  rationale: A tradução mantém tanto o movimento figurado de שׁוב quanto a imagem do ardor da ira, sem suavizar a linguagem nem definir além do texto como se dá essa mudança.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A primeira ocorrência de «até hoje» foi explicitada para evitar uma ambiguidade acidental em português; a imagem da ira ardente e o nome divino foram preservados.
