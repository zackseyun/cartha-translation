revisions:
- from: Eles ergueram sobre ele um grande monte de pedras, que permanece até hoje. Então Yahweh se afastou do ardor da sua ira. Por isso, aquele lugar é chamado vale de Acor[a] até hoje.
  to: Eles ergueram sobre ele um grande monte de pedras até hoje. Então Yahweh se desviou do ardor da sua ira. Por isso, aquele lugar é chamado Vale de Acor[a] até hoje.
  rationale: A revisão restitui a fórmula «até hoje» sem explicitação adicional, conserva a imagem hebraica do ardor da ira e ajusta a redação do topónimo e da nota para maior precisão lexical e editorial.
