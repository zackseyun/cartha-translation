base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: pt
  text: 'Eles voltaram a Josué e lhe disseram: “Não faça todo o povo subir. Que cerca de dois mil homens, ou cerca de três mil, subam e ataquem Ai. Não canse todo o povo ali[a], pois eles são poucos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não dê trabalho a todo o povo ali”. O verbo hebraico pode indicar causar cansaço ou impor esforço e incômodo desnecessários.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל־יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו
  choice: Eles voltaram a Josué e lhe disseram
  rationale: Reproduz a sequência narrativa e o movimento de retorno dos observadores, com formulação natural em português.
- source_word: אַל יַעַל כָּל־הָעָם
  choice: Não faça todo o povo subir
  rationale: Preserva tanto a força de conselho/proibição de אַל com o jussivo quanto o verbo militar e topográfico 'subir'. 'Povo' mantém a amplitude lexical do hebraico, embora o contexto indique a força combatente.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: cerca de dois mil homens, ou cerca de três mil
  rationale: O כ prefixado indica aproximação. A segunda ocorrência de 'homens' é omitida por elipse natural em português, sem perda de sentido.
- source_word: יַעֲלוּ וְיַכּוּ אֶת־הָעָי
  choice: subam e ataquem Ai
  rationale: '''Subam'' mantém a repetição de עלה. No contexto de uma operação contra uma cidade, ''ataquem'' comunica de modo corrente o valor de נכה sem antecipar o resultado como faria ''derrotem''.'
- source_word: אַל תְּיַגַּע שָׁמָּה אֶת־כָּל־הָעָם
  choice: Não faça todo o povo se cansar indo até lá
  rationale: Expressa o Piel causativo de יגע como imposição de esforço ou cansaço desnecessário. 'Indo até lá' liga naturalmente שָׁמָּה ao deslocamento em português.
- source_word: כִּי מְעַט הֵמָּה
  choice: pois eles são poucos
  rationale: Mantém a concisão e a referência implícita aos habitantes ou defensores de Ai.
theological_decisions: []
