  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: pt
  text: Então Josué tomou Acã, filho de Zerá, a prata, o manto, a peça de ouro em forma de língua[a], seus filhos, suas filhas, seu boi, seu jumento, seu rebanho, sua tenda e tudo o que lhe pertencia; e todo o Israel estava com ele. Eles os levaram ao vale de Acor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “língua de ouro”, isto é, uma peça de ouro com formato semelhante ao de uma língua; tradicionalmente, “cunha de ouro”.'
    reason: lexical_alternative
  - marker: b
    text: O nome Acor soa como a palavra hebraica para “perturbação”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Então Josué tomou
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa naturalmente a sequência, e “tomou” preserva o sentido simples de לקח sem acrescentar uma ideia de violência.
- source_word: עָכָן בֶּן זֶרַח
  choice: Acã, filho de Zerá
  rationale: Emprega as formas tradicionais e legíveis dos nomes em português e traduz diretamente o patronímico.
- source_word: הַכֶּסֶף
  choice: a prata
  rationale: כסף designa literalmente prata e, no contexto, retoma a prata furtada; “dinheiro” seria mais interpretativo.
- source_word: הָאַדֶּרֶת
  choice: o manto
  rationale: אדרת designa uma vestimenta externa distinta; “manto” é corrente, digno e não excessivamente específico.
- source_word: לְשׁוֹן הַזָּהָב
  choice: a peça de ouro em forma de língua
  rationale: Preserva a imagem concreta de לשון, “língua”, e ao mesmo tempo deixa claro ao leitor que se trata do formato de uma peça de ouro, sem impor a forma mais específica de uma cunha ou de uma barra.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: seus filhos, suas filhas
  rationale: Mantém a distinção explícita entre filhos e filhas presente no hebraico.
- source_word: שׁוֹרוֹ
  choice: seu boi
  rationale: O singular “boi” corresponde ao singular hebraico e é uma tradução comum de שור.
- source_word: חֲמֹרוֹ
  choice: seu jumento
  rationale: “Jumento” é um equivalente atual e amplamente compreensível de חמור em português.
- source_word: צֹאנוֹ
  choice: seu rebanho
  rationale: צאן é um coletivo de animais de pequeno porte, sobretudo ovelhas e cabras; “rebanho” conserva o caráter coletivo sem restringir a espécie.
- source_word: אָהֳלוֹ
  choice: sua tenda
  rationale: Reproduz diretamente o sentido simples do termo hebraico.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: tudo o que lhe pertencia
  rationale: Expressa de forma natural a construção possessiva e seu sentido abrangente.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Todo o Israel o acompanhou
  rationale: Torna natural em português a ideia de que todo o Israel estava com Josué; o referente mais provável do sufixo é Josué, sujeito da ação.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: e eles os levaram ao vale de Acor
  rationale: O plural “os” preserva o objeto plural hebraico, sem decidir nesta frase o destino individual de cada pessoa ou bem; “levaram” transmite naturalmente o movimento indicado por עלה neste contexto.
theological_decisions:
- issue: Se o texto deve indicar a culpa ou inocência dos filhos e das filhas de Acã
  choice: Manter a enumeração simples — “seus filhos, suas filhas” — sem qualificar sua participação
  alternative: Acrescentar que eram cúmplices ou, ao contrário, que apenas estavam presentes e não foram punidos
  rationale: O versículo inclui a família entre os levados ao vale, mas não declara aqui seu grau de envolvimento. A tradução conserva essa tensão sem importar uma conclusão.
- issue: Amplitude do pronome plural em “eles os levaram”
  choice: Preservar o plural abrangente do hebraico
  alternative: Reformular de modo a separar Acã e sua família dos bens ou antecipar quem seria executado
  rationale: O hebraico usa אֹתָם, “os”, após toda a lista. Preservar esse plural evita resolver no versículo 24 questões tratadas pela continuação narrativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação divide a longa cadeia hebraica em duas frases para favorecer a compreensão sem alterar a sequência narrativa. As notas são marcadas no texto como [a] e [b].
