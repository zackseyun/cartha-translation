source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: pt
  text: Israel pecou. Eles também transgrediram a minha aliança, que lhes ordenei; também tomaram algo do que estava consagrado à destruição[a], também roubaram, também mentiram[b] e também o puseram entre os seus pertences[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais formalmente: “tomaram das coisas consagradas” ou “tomaram daquilo que estava sob interdição”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “agiram com falsidade”, “enganaram” ou “negaram o que fizeram”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “entre os seus utensílios/objetos”; no contexto, a expressão indica que ocultaram o item entre as suas posses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא
  choice: pecou
  rationale: Expressa de modo direto e corrente a ofensa contra Deus, preservando o peso moral e teológico do verbo hebraico.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém o sujeito coletivo explícito do hebraico. Embora o agente imediato seja Acã, o versículo atribui o pecado corporativamente a Israel.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: transgrediram a minha aliança
  rationale: Preserva a ideia de ultrapassar ou violar os limites da aliança e mantém o caráter formal da acusação divina.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: que lhes ordenei
  rationale: Segue de perto a formulação hebraica sem acrescentar o complemento implícito 'que cumprissem'.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: pegaram daquilo que havia sido consagrado à destruição
  rationale: Comunica em português atual que os objetos estavam colocados sob interdição e destinados à destruição, sem reduzir חֵרֶם a uma noção genérica de oferta sagrada.
- source_word: גָּנְבוּ
  choice: roubaram
  rationale: Equivalente direto e natural; a repetição de 'também' preserva o acúmulo enfático das acusações.
- source_word: כִּחֲשׁוּ
  choice: mentiram
  rationale: É uma tradução concisa e clara no contexto judicial e moral, enquanto a nota preserva os sentidos possíveis de enganar, agir falsamente ou negar o ocorrido.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: puseram essas coisas entre os seus próprios pertences
  rationale: כְּלִים pode indicar objetos, utensílios, equipamento ou bens. 'Pertences' comunica naturalmente que os itens foram ocultados no meio das posses pessoais.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: também ... também ... também
  rationale: Conserva a repetição enfática pela qual o hebraico acumula uma acusação após outra.
theological_decisions:
- issue: Atribuição coletiva da culpa a Israel, embora o ato imediato tenha sido cometido por um indivíduo
  choice: Manter 'Israel' como sujeito coletivo, seguido de formas no plural.
  alternative: Reformular o versículo para atribuir a culpa somente a Acã.
  rationale: O hebraico declara que Israel pecou e depois emprega verbos plurais. A tradução preserva essa solidariedade coletiva da aliança sem resolver ou suavizar a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a solenidade da acusação divina e a repetição retórica de 'também', sem recorrer a terminologia denominacional. O pronome plural 'Eles' torna audível em português a passagem do sujeito coletivo singular para os verbos plurais do hebraico.
