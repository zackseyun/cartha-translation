  verdict: revise
  source_fidelity: A primeira oração comunica adequadamente o rasgar das roupas, a prostração diante da arca de Yahweh e sua duração. Porém, a segmentação em dois períodos faz com que «Ele e os anciãos de Israel» pareça qualificar apenas o gesto de pôr pó, quando o hebraico associa Josué e os anciãos também à prostração até a tarde.
  naturalness: A redação proposta é clara e digna. A revisão torna explícita, em português natural, a participação conjunta de Josué e dos anciãos sem reproduzir uma construção hebraica artificial.
  terminology: «Josué», «arca», «Yahweh», «anciãos de Israel», «pó» e «prostrou-se com o rosto em terra» são escolhas adequadas. «Até a tarde» preserva satisfatoriamente o sentido de עַד הָעֶרֶב.
  issues:
