    issue: O vínculo de «ele e os anciãos de Israel» com a prostração não está expresso de modo claro.
    rationale: Em הוּא וְזִקְנֵי יִשְׂרָאֵל, Josué e os anciãos são apresentados conjuntamente no quadro da ação anterior; a separação atual pode sugerir que somente Josué ficou prostrado e que os anciãos apenas puseram pó sobre a cabeça.
  revised_text: Então Josué rasgou as suas roupas e se prostrou com o rosto em terra diante da arca de Yahweh até a tarde, junto com os anciãos de Israel. Eles puseram pó sobre a cabeça[a].
