  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: pt
  text: Então Josué rasgou as suas roupas e se prostrou com o rosto em terra diante da arca de Yahweh até a tarde, junto com os anciãos de Israel. Eles puseram pó sobre a cabeça[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pôr pó sobre a cabeça era um sinal costumeiro de profunda tristeza, humilhação ou luto.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע שִׂמְלֹתָיו
  choice: rasgou as suas roupas
  rationale: A expressão descreve literalmente o ato de rasgar as vestes como sinal de profunda aflição; «roupas» é claro e natural em português moderno.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: prostrou-se com o rosto em terra
  rationale: O hebraico retrata uma queda em prostração, com o rosto voltado para o chão. A formulação preserva tanto a postura quanto seu caráter deliberado.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: diante da arca de Yahweh
  rationale: «Diante de» comunica לִפְנֵי de modo natural, e «arca» preserva o objeto cultual mencionado sem acrescentar aqui a expressão «da aliança», ausente no texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַד הָעֶרֶב
  choice: até a tarde
  rationale: Expressão temporal direta; «até a tarde» é idiomático e preserva a referência ampla ao período vespertino.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: Ele e os anciãos de Israel
  rationale: Mantém o pronome explícito e deixa claro que Josué e os anciãos participaram da prostração e do gesto subsequente.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: puseram pó sobre a cabeça
  rationale: Reproduz naturalmente em português o gesto idiomático de colocar pó na cabeça, sem impor ao verbo a ideia mais específica de «lançar».
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o nome divino; a transliteração preserva sua condição de nome pessoal sem substituí-lo por um título.
- issue: Sentido da prostração diante da arca
  choice: descrição física sem explicitação interpretativa
  alternative: acrescentar que Josué estava adorando ou orando
  rationale: O versículo descreve postura, duração e localização, mas não nomeia explicitamente o ato como adoração ou oração; a tradução preserva essa abertura contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase foi dividida em dois períodos para evitar ambiguidade sintática e deixar claro que Josué e os anciãos partilharam os gestos descritos. Não se adotou a nota alternativa inglesa associada a «até a tarde», pois ela não apresenta uma alternativa textual ou tradutória inteligível distinta da frase principal.
