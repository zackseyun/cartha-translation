base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: pt
  text: Então Josué fez a família de Zabdi aproximar-se, homem por homem[a], e Acã, filho de Carmi, filho de Zabdi, filho de Zerá, da tribo de Judá, foi apontado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo os homens”. A expressão hebraica é concisa e pode indicar que a família foi apresentada conforme suas subdivisões masculinas no processo de sorteio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: fez ... se aproximar
  rationale: O hifil de קרב significa fazer chegar perto ou apresentar. A formulação conserva a imagem hebraica de aproximação no processo de identificação por sorteio.
- source_word: אֶת בֵּיתוֹ
  choice: a casa de Zabdi
  rationale: בַּיִת designa aqui a casa no sentido de grupo familiar. O possessivo remete, no contexto imediato, a Zabdi; explicitar o referente em português evita uma ambiguidade pronominal artificial.
- source_word: לַגְּבָרִים
  choice: homem por homem
  rationale: A expressão é concisa e provavelmente descreve a apresentação dos homens individualmente ou segundo as subdivisões masculinas da casa. A nota preserva a alternativa formal.
- source_word: וַיִּלָּכֵד
  choice: foi apontado
  rationale: O nifal de לכד significa literalmente ser apanhado ou capturado; neste contexto, indica quem foi identificado pelo sorteio. 'Foi apontado' comunica naturalmente o resultado sem sugerir captura física.
- source_word: עָכָן
  choice: Acã
  rationale: Forma tradicional e corrente do nome em português.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: filho de Carmi, filho de Zabdi, filho de Zerá
  rationale: Mantém integralmente a cadeia genealógica do hebraico.
- source_word: לְמַטֵּה יְהוּדָה
  choice: da tribo de Judá
  rationale: Em contexto tribal, מַטֶּה significa 'tribo'; esta é a expressão clara e corrente em português.
