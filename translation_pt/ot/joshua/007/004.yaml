  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: pt
  text: Assim, cerca de três mil homens do povo subiram até lá, mas fugiram diante dos homens de Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: subiram
  rationale: O verbo עלה significa normalmente “subir”. No contexto do deslocamento militar em direção a Ai, “subiram” preserva o modo hebraico de descrever o movimento sem acrescentar ao verbo a ideia explícita de ataque.
- source_word: מִן הָעָם
  choice: do povo
  rationale: עם significa literalmente “povo”; aqui designa o grupo de homens destacado dentre Israel. “Do povo” mantém essa referência coletiva sem substituí-la por “exército” ou “tropas”.
- source_word: שָׁמָּה
  choice: até lá
  rationale: O advérbio indica movimento em direção ao destino já mencionado. “Até lá” expressa essa direção de modo natural em português.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: cerca de três mil homens
  rationale: A preposição כִּ diante do número comunica aproximação, por isso “cerca de”. אִישׁ funciona na contagem de pessoas, e “homens” é mais diretamente correspondente do que o mais específico “soldados”.
- source_word: וַיָּנֻסוּ
  choice: fugiram
  rationale: O verbo נוס significa “fugir”. A forma escolhida é exata, natural e adequada ao tom da narrativa.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Com o verbo “fugir”, a expressão indica retirada perante a presença do adversário. “Diante de” preserva a formulação espacial do hebraico e é idiomática em português.
- source_word: אַנְשֵׁי הָעָי
  choice: os homens de Ai
  rationale: A expressão é o plural construto de אִישׁ e se refere aos homens de Ai, no contexto seus defensores ou combatentes. “Homens de Ai” evita explicitar mais do que o texto diz.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução conserva o movimento de “subir”, a procedência “do povo” e a expressão “diante dos homens de Ai”, sem introduzir especificações militares ausentes dos termos hebraicos.
