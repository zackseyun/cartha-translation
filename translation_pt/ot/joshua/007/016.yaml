base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: pt
  text: Josué se levantou cedo, pela manhã, e fez Israel aproximar-se, segundo as suas tribos[a]; e a tribo de Judá foi tomada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez Israel comparecer, tribo por tribo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a tribo de Judá foi tomada”; expressão que, neste contexto, indica que ela foi destacada no processo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: levantou-se cedo
  rationale: O hifil de שׁכם indica levantar-se cedo; a formulação preserva a ênfase temporal e soa natural em português.
- source_word: בַּבֹּקֶר
  choice: pela manhã
  rationale: Traduz diretamente a indicação de tempo e combina de modo idiomático com “levantou-se cedo”.
- source_word: וַיַּקְרֵב
  choice: fez ... se aproximar
  rationale: O hifil de קרב tem sentido causativo, “fazer aproximar” ou “trazer para perto”; a escolha conserva o caráter formal do comparecimento sem especificar mais do que o hebraico.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Mantém a designação coletiva do povo da aliança presente no texto hebraico.
- source_word: לִשְׁבָטָיו
  choice: tribo por tribo
  rationale: Expressa com clareza o sentido distributivo de organizar ou apresentar Israel segundo suas tribos.
- source_word: וַיִּלָּכֵד
  choice: foi apontada
  rationale: O nifal de לכד significa literalmente “foi tomada/apanhada”, mas neste contexto funciona como expressão idiomática para a unidade que foi identificada no processo. “Foi apontada” comunica esse sentido sem declarar o mecanismo.
- source_word: שֵׁבֶט יְהוּדָה
  choice: a tribo de Judá
  rationale: Equivalente direto e convencional da construção hebraica.
theological_decisions:
- issue: Natureza do processo de identificação sugerido por וַיִּלָּכֵד
  choice: foi apontada
  alternative: foi tomada; foi escolhida por sorteio; foi identificada
  rationale: A forma passiva é mantida, mas o agente e o mecanismo não são especificados, pois esta oração não diz explicitamente “por sorteio” nem “pelo SENHOR”. A nota registra a imagem literal do idioma hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Tribo por tribo” torna natural o valor distributivo, enquanto “foi apontada” evita a impressão equivocada de captura militar e não acrescenta um mecanismo de seleção ausente da oração.
