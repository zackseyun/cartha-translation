  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: pt
  text: 'Vi entre os despojos uma bela capa de Sinar[a], duzentos siclos de prata e uma barra de ouro[b] que pesava cinquenta siclos. Eu os cobicei e os peguei. E vejam: estão escondidos no chão, dentro da minha tenda, com a prata debaixo da capa.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um belo manto de Sinar”. O termo hebraico pode designar uma vestimenta exterior esplêndida, uma capa ou um manto.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico, literalmente: “uma língua de ouro”, provavelmente uma peça de ouro em formato alongado. Traduções tradicionais também usam “cunha de ouro”.'
    reason: lexical_alternative
  - marker: c
    text: O pronome hebraico é feminino singular e provavelmente se refere à capa; por isso, “a prata debaixo da capa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: entre os despojos
  rationale: שָׁלָל designa o despojo ou saque de guerra; a preposição ב tem aqui sentido locativo, expresso naturalmente por “entre”.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: uma bela capa de Sinar
  rationale: אַדֶּרֶת pode indicar uma vestimenta exterior esplêndida, como capa ou manto; “capa” é corrente e “de Sinar” preserva a procedência, enquanto טוֹבָה indica qualidade e beleza.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: duzentos siclos de prata
  rationale: Mantém a antiga unidade de peso sem uma conversão moderna incerta.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: uma barra de ouro
  rationale: לָשׁוֹן significa literalmente “língua”, mas aqui provavelmente descreve uma peça de ouro alongada; “barra” comunica o objeto com naturalidade, e a imagem literal é registrada em nota.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: que pesava cinquenta siclos
  rationale: Expressa de modo claro a cláusula hebraica que especifica o peso da peça de ouro.
- source_word: וָאֶחְמְדֵם
  choice: Eu os cobicei
  rationale: חמד indica desejo intenso e, neste contexto de apropriação ilícita, “cobicei” preserva sua força moral.
- source_word: וָאֶקָּחֵם
  choice: e os peguei
  rationale: לקח é o verbo comum para “pegar” ou “tomar”; “peguei” é natural e não intensifica indevidamente o texto.
- source_word: וְהִנָּם
  choice: 'E vejam: estão'
  rationale: הִנָּם chama a atenção dos ouvintes para a localização dos objetos; “vejam” conserva a vivacidade dêitica.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: escondidos no chão
  rationale: O particípio descreve os objetos ocultos, e אֶרֶץ, no interior da tenda, refere-se ao solo ou chão.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: dentro da minha tenda
  rationale: Tradução direta e idiomática da localização no interior da tenda.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: com a prata debaixo da capa
  rationale: O sufixo feminino singular remete mais naturalmente à capa. Repetir o substantivo em português elimina uma possível referência gramatical obscura sem esconder a interpretação, que é explicitada em nota.
