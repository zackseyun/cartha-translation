base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: pt
  text: Eles os tiraram de dentro da tenda e os levaram a Josué e a todos os filhos de Israel.[a] Então os colocaram[b] diante de Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “a todos os israelitas”. Hebraico: “a todos os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os derramaram” ou “os despejaram”; neste contexto, o verbo provavelmente descreve os objetos sendo colocados ou expostos.
    reason: lexical_alternative
  - marker: c
    text: Yahweh representa o nome divino יהוה (YHWH), tradicionalmente vertido como “SENHOR”; outra forma conhecida é “Jeová”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: Eles os tiraram
  rationale: O verbo לקח tem o sentido básico de “tomar”; com a expressão de origem “de dentro da tenda”, “tiraram” comunica naturalmente em português tanto a tomada quanto a remoção dos objetos.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: de dentro da tenda
  rationale: מִתּוֹךְ indica explicitamente procedência do interior, nuance que seria atenuada por apenas “da tenda”.
- source_word: וַיְבִאוּם
  choice: os levaram
  rationale: O hifil de בוא significa “levar/trazer”. Como o ponto de referência narrativo não exige “trazer” em português, “levaram” expressa com naturalidade o deslocamento até Josué e a assembleia.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: a Josué e a todos os filhos de Israel
  rationale: Mantém os dois complementos introduzidos por אֶל e preserva de modo transparente a expressão hebraica בְּנֵי יִשְׂרָאֵל, deixando “israelitas” como alternativa mais idiomática em nota.
- source_word: וַיַּצִּקֻם
  choice: os colocaram
  rationale: יצק normalmente significa “derramar”, mas os referentes neste contexto são objetos recuperados da tenda. “Colocaram” comunica a ação contextual sem sugerir que fossem líquidos; a imagem mais literal é preservada em nota.
- source_word: לִפְנֵי יְהוָה
  choice: diante de Yahweh
  rationale: לִפְנֵי significa “diante de” ou “na presença de”. A forma concisa conserva a linguagem de apresentação perante Deus, e o nome divino é transliterado.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino pessoal expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama. “Yahweh” preserva o nome pessoal e é uma reconstrução amplamente aceita; a nota informa as formas tradicionais sem transformar a questão de pronúncia em afirmação dogmática.
- issue: Sentido coletivo de בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A forma principal preserva a expressão tradicional e sua ligação explícita com Israel, enquanto a nota reconhece que ela funciona aqui como designação coletiva do povo.
- issue: Ação expressa por יצק sobre os objetos
  choice: colocaram
  alternative: derramaram ou despejaram
  rationale: O sentido concreto mais comum do verbo é “derramar”, mas o contexto envolve uma capa, prata e ouro. A tradução principal evita uma imagem inadequada em português, e a nota mantém visível a força lexical e a ambiguidade do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Filhos de Israel” conserva a formulação hebraica, enquanto as notas oferecem equivalentes mais idiomáticos e registram a dificuldade lexical de יצק. A divisão em duas frases melhora a legibilidade sem alterar a sequência das ações.
