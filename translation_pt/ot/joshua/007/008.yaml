id: JOS.7.8
reference: Joshua 7:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: pt
  text: Ah, Senhor, o que direi[a], depois que Israel virou as costas diante dos seus inimigos[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que posso dizer?”'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “virou a parte de trás do pescoço diante dos seus inimigos”; expressão hebraica que indica retirada ou fuga na derrota.
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: Ah
  rationale: A partícula introduz um apelo urgente e respeitoso dirigido a um superior. Em português, “Ah” preserva o tom emotivo da lamentação sem recorrer ao literalismo espacial nem ao menos natural “por favor” neste contexto.
- source_word: אֲדֹנָי
  choice: Senhor
  rationale: Como título divino em vocativo, “Senhor” é a forma reverente e consagrada em português; não introduz o nome da aliança, que não ocorre no versículo.
- source_word: מָה אֹמַר
  choice: o que direi
  rationale: Reproduz de perto a construção interrogativa hebraica e mantém aberta a nuance entre deliberação futura e impotência retórica.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: depois que
  rationale: Expressa de modo natural a circunstância anterior que provoca a pergunta de Josué.
- source_word: הָפַךְ ... עֹרֶף
  choice: virou as costas
  rationale: A expressão hebraica menciona literalmente a parte posterior do pescoço e funciona como idioma militar de retirada ou fuga; “virou as costas” conserva a imagem e é inteligível em português.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Mantém a relação espacial e militar expressa pela preposição hebraica.
- source_word: אֹיְבָיו
  choice: seus inimigos
  rationale: O sufixo masculino singular retoma Israel como nome coletivo; “seus” é natural em português e preserva essa referência.
theological_decisions:
- issue: Tradução do título divino אֲדֹנָי
  choice: Senhor
  alternative: meu Senhor
  rationale: Neste uso, אֲדֹנָי funciona como título reverencial dirigido a Deus. “Senhor” evita transformar a forma tradicional do título em uma ênfase possessiva que o contexto não exige e não a confunde com o nome divino.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Ah, Senhor” comunica uma súplica angustiada; a ordem da frase e a imagem de “virar as costas” preservam de perto o hebraico sem soar artificiais.
