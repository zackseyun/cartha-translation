base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: pt
  text: 'Josué disse: “Por que nos trouxeste desgraça? Yahweh trará desgraça sobre ti hoje.”[a] E todo o Israel o apedrejou com pedras; queimaram-nos com fogo[b] e os apedrejaram com pedras.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No hebraico, o mesmo verbo é repetido: “Por que nos trouxeste desgraça? Yahweh trará desgraça sobre ti”. A tradução preserva esse jogo de palavras.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico passa do singular (“o”) para o plural (“nos”/“os”). O plural pode abranger Acã juntamente com outras pessoas ou com sua casa e seus bens; o texto não especifica aqui.
    reason: alternative_reading
  - marker: c
    text: O hebraico emprega dois verbos diferentes para apedrejar neste versículo. Ambos se referem à execução por meio de pedras e são traduzidos de maneira semelhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: nos trouxe desgraça / trará desgraça sobre você
  rationale: O verbo עכר indica causar perturbação, calamidade ou desgraça. A repetição de “trazer desgraça” preserva o jogo de palavras e a reciprocidade da declaração de Josué em português natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: בַּיּוֹם הַזֶּה
  choice: hoje
  rationale: Expressa de modo natural e imediato o sentido temporal de “neste dia”.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: o apedrejou com pedras
  rationale: רגם descreve o apedrejamento; a formulação conserva tanto o objeto singular quanto a menção explícita às pedras.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: eles os queimaram no fogo
  rationale: Conserva a passagem do objeto singular para o plural e mantém a expressão instrumental explícita “no fogo”.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: os apedrejaram com pedras
  rationale: סקל também designa apedrejamento. A tradução natural não distingue facilmente este verbo de רגם, mas mantém o objeto plural e a referência explícita às pedras.
theological_decisions:
- issue: Mudança de referentes do singular para o plural
  choice: Manter “o” no primeiro apedrejamento e “os” nas ações seguintes.
  alternative: Uniformizar todos os pronomes no singular ou interpretar explicitamente o plural como Acã, sua família ou seus bens.
  rationale: O texto massorético muda expressamente do singular para o plural. A tradução preserva essa tensão sem determinar quem ou o que está incluído no plural.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição deliberada preserva a ênfase e o jogo verbal do hebraico; a mudança pronominal singular-plural é mantida sem explicação interpretativa no corpo do texto.
