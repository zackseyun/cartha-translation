base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/002.yaml
  text: they gathered together to fight against Joshua and against Israel[a], with one accord.
translation:
  language: pt
  text: eles se reuniram para lutar contra Josué e contra Israel, todos de comum acordo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com uma só boca”; a expressão hebraica indica plena unidade ou concordância.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: eles se reuniram
  rationale: A forma nifal de קבץ indica que se ajuntaram como grupo. “Reuniram-se” é natural em português e preserva a ação coletiva sem acrescentar uma motivação não expressa.
- source_word: יַחְדָּו
  choice: todos
  rationale: O advérbio enfatiza que os reis agiram conjuntamente. Aqui, “todos” se combina naturalmente com a expressão final de unanimidade e evita a repetição pouco elegante de “juntos” e “de comum acordo”.
- source_word: לְהִלָּחֵם
  choice: para lutar
  rationale: O infinitivo nifal de לחם significa entrar em combate. “Para lutar” é claro, atual e mantém a finalidade expressa pela preposição לְ.
- source_word: עִם
  choice: contra
  rationale: Depois de um verbo de combate, עִם tem sentido adversativo. Em português, “contra” comunica corretamente a oposição militar.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: וְעִם יִשְׂרָאֵל
  choice: e contra Israel
  rationale: A repetição de “contra” reproduz a preposição hebraica reiterada e deixa claro que tanto Josué como Israel são os adversários.
- source_word: פֶּה אֶחָד
  choice: de comum acordo
  rationale: A expressão, literalmente “uma só boca”, é um idiomatismo de unanimidade. “De comum acordo” transmite o sentido em português natural e digno.
