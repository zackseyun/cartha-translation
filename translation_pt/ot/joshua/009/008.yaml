base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: pt
  text: 'Eles disseram a Josué: “Somos seus servos.[a]” Então Josué lhes perguntou: “Quem são vocês e de onde vêm?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Somos seus escravos”. O hebraico עֲבָדֶיךָ pode indicar servos ou escravos; aqui, “servos” corresponde à linguagem deferente usada num apelo diplomático.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: seus servos
  rationale: עֶבֶד pode designar servo ou escravo. Neste contexto, os gibeonitas empregam linguagem diplomática de deferência e se apresentam como subordinados; “servos” comunica melhor essa função pragmática, sem excluir a alternativa lexical indicada em nota.
- source_word: אֲנָחְנוּ
  choice: somos
  rationale: A oração nominal hebraica usa o pronome independente sem cópula explícita; em português, “somos” expressa naturalmente a relação predicativa.
- source_word: מִי אַתֶּם
  choice: Quem são vocês
  rationale: Tradução direta do interrogativo com o pronome plural. “Vocês” oferece leitura natural e amplamente compreensível no português moderno, sem acrescentar um substantivo ausente no hebraico.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: e de onde vêm
  rationale: מֵאַיִן pergunta pela procedência. Neste diálogo, o imperfeito de בוא é traduzido idiomaticamente pelo presente “vêm”, que indaga a origem dos interlocutores.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: Eles disseram ... Então Josué lhes perguntou
  rationale: A sequência narrativa com waw consecutivo é vertida em português fluente pelo pretérito perfeito. “Então” marca a mudança de fala; “perguntou” explicita naturalmente a força interrogativa da fala de Josué sem alterar seu conteúdo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Emprega-se “vocês” para o plural e “seus” em concordância natural. A ambiguidade de עֶבֶד é preservada por meio da nota.
