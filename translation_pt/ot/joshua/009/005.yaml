  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/נְעָל֨וֹת בָּל֤וֹת וּ/מְטֻלָּאוֹת֙ בְּ/רַגְלֵי/הֶ֔ם וּ/שְׂלָמ֥וֹת בָּל֖וֹת עֲלֵי/הֶ֑ם וְ/כֹל֙ לֶ֣חֶם צֵידָ֔/ם יָבֵ֖שׁ הָיָ֥ה נִקֻּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: pt
  text: Traziam nos pés sandálias gastas e remendadas, e vestiam roupas gastas. Todo o pão que levavam como provisão estava seco e esfarelado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mofado”. O termo hebraico traduzido como “esfarelado” é raro e pode indicar pão seco e quebrado em pedaços, embora alguns o entendam como “mofado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: sandálias
  rationale: Designa o calçado comum do antigo Oriente Próximo; “sandálias” é concreto e historicamente adequado.
- source_word: בָּלוֹת
  choice: gastas
  rationale: Expressa deterioração pelo tempo e pelo uso, não apenas antiguidade.
- source_word: מְטֻלָּאוֹת
  choice: remendadas
  rationale: O particípio passivo indica que as sandálias haviam sido consertadas com remendos.
- source_word: בְּרַגְלֵיהֶם
  choice: nos pés
  rationale: Preserva de forma natural o detalhe concreto da expressão locativa hebraica.
- source_word: שְׂלָמוֹת
  choice: roupas
  rationale: Termo atual e abrangente para as peças de vestuário mencionadas, sem especificar indevidamente um tipo de veste.
- source_word: עֲלֵיהֶם
  choice: vestiam
  rationale: Verbaliza naturalmente em português a ideia de as roupas estarem sobre eles.
- source_word: לֶחֶם צֵידָם
  choice: o pão que levavam como provisão
  rationale: Mantém o substantivo concreto “pão” e comunica com clareza que fazia parte dos mantimentos da viagem.
- source_word: יָבֵשׁ הָיָה
  choice: estava seco
  rationale: Reproduz a construção de estado sem sugerir necessariamente um processo anterior.
- source_word: נִקֻּדִים
  choice: esfarelado
  rationale: O termo raro parece descrever pão deteriorado, seco e reduzido a fragmentos; a alternativa tradicional “mofado” permanece na nota por causa da incerteza lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “gastas” preserva a estrutura e a ênfase do hebraico; a divisão em duas frases melhora a fluidez sem alterar o sentido.
