  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: pt
  text: Então os homens tomaram algumas das provisões deles, mas não buscaram a orientação de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a boca de Yahweh”; isto é, sua orientação ou decisão.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: pegaram
  rationale: Expressa o sentido básico de לקח e mantém a ação concreta sem especificar além do texto se as provisões foram recebidas, examinadas ou provadas.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Traduz diretamente o substantivo; o contexto identifica quem são, mas o versículo não diz explicitamente 'os homens de Israel' nem 'os líderes'.
- source_word: מִצֵּידָם
  choice: algumas das provisões deles
  rationale: 'צֵיד designa provisões, especialmente alimento para viagem, e a preposição מִן tem aqui valor partitivo: tomaram parte delas.'
- source_word: פִּי יְהוָה
  choice: a boca de Yahweh
  rationale: Preserva a expressão concreta e incomum do hebraico, deixando a nota explicar seu sentido idiomático como orientação ou decisão divina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em vez de substituí-lo por um título.
- source_word: לֹא שָׁאָלוּ
  choice: não consultaram
  rationale: No contexto de buscar uma resposta divina, 'consultar' comunica naturalmente o sentido de שׁאל; com 'a boca de Yahweh', mantém-se a ligação sintática com o objeto hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz o nome próprio divino; a transliteração o preserva e evita substituí-lo por um título.
- issue: Tratamento da expressão פִּי יְהוָה
  choice: a boca de Yahweh, com explicação em nota
  alternative: a orientação de Yahweh; o conselho de Yahweh; a palavra de Yahweh
  rationale: A tradução literal preserva a imagem e a ambiguidade do hebraico. A nota esclarece que, neste contexto, a expressão se refere a buscar a orientação ou decisão de Yahweh, sem restringi-la indevidamente a conselho, mandamento ou palavra.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. A formulação incomum 'a boca de Yahweh' é intencional para conservar a imagem hebraica; a nota oferece o sentido idiomático. O marcador [a] aparece imediatamente após a expressão explicada.
