source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: pt
  text: 'Mas todos os líderes disseram a toda a comunidade: “Nós juramos a eles por Yahweh, o Deus de Israel, e agora não podemos tocar neles[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fazer mal a eles” ou “atacá-los”; literalmente, “tocar neles”.
    reason: A expressão hebraica mantém o verbo “tocar”, mas, neste contexto, refere-se a agir contra os gibeonitas de modo hostil.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mas ... disseram
  rationale: Embora o waw narrativo possa ser traduzido formalmente por “e”, aqui a fala dos líderes contrasta com a queixa da comunidade no contexto imediato; “mas” expressa naturalmente essa função discursiva.
- source_word: הַנְּשִׂיאִים
  choice: os líderes
  rationale: נָשִׂיא designa chefes ou representantes governantes. “Líderes” é claro, atual e adequado ao papel dessas autoridades de Israel.
- source_word: הָעֵדָה
  choice: a comunidade
  rationale: עֵדָה se refere à coletividade reunida de Israel. “Comunidade” comunica o sentido corporativo em português moderno sem sugerir apenas uma reunião pontual.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: juramos a eles
  rationale: O nifal de שׁבע significa jurar ou prestar juramento. O pretérito perfeito é natural em português, enquanto o contexto deixa claro que o juramento continua em vigor.
- source_word: בַּיהוָה
  choice: por Yahweh
  rationale: Com o verbo “jurar”, a preposição ב marca aquele por quem se faz o juramento. A forma preserva o nome divino expresso no hebraico.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: o Deus de Israel
  rationale: Tradução direta da cadeia construta que identifica Yahweh em sua relação com Israel.
- source_word: וְעַתָּה
  choice: e agora
  rationale: A expressão liga o juramento passado à consequência vigente no momento da fala.
- source_word: לֹא נוּכַל
  choice: não podemos
  rationale: יכל indica incapacidade. Neste contexto, ela decorre da obrigação moral do juramento; “não podemos” preserva a formulação sem explicitar além do texto a natureza dessa impossibilidade.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: tocar neles
  rationale: נגע significa literalmente “tocar”, embora neste contexto tenha o sentido idiomático de agir contra eles ou lhes fazer mal. A tradução mantém a imagem hebraica, e a nota esclarece o sentido contextual.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico emprega diretamente o tetragrama, o nome próprio do Deus de Israel. “Yahweh” preserva essa função nominal sem substituir o nome por um título.
- issue: Natureza da impossibilidade expressa em לֹא נוּכַל
  choice: não podemos
  alternative: não nos é permitido
  rationale: A obrigação solene diante de Deus confere à frase uma dimensão moral, mas o verbo hebraico expressa literalmente incapacidade. A tradução mantém essa tensão e deixa que o contexto do juramento indique sua base ética.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Juramos a eles” evita uma construção excessivamente formal, e “comunidade” comunica de modo natural a coletividade de Israel. A pontuação introduz a fala direta com dois-pontos, conforme o uso corrente em português.
