base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: pt
  text: 'Então os nossos anciãos e todos os habitantes da nossa terra nos disseram: “Levem consigo provisões para a viagem e vão ao encontro deles. Digam-lhes: ‘Somos servos de vocês’[a]. E agora façam uma aliança conosco[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Servos de vocês” é uma forma de linguagem diplomática respeitosa; em outros contextos, o termo hebraico também pode significar “escravos”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “cortem uma aliança conosco”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: os nossos anciãos
  rationale: O termo designa os líderes da comunidade, e não apenas homens idosos; “anciãos” preserva essa função sociopolítica.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: todos os habitantes da nossa terra
  rationale: A construção participial refere-se coletivamente aos que vivem na terra; “habitantes” é claro e natural.
- source_word: צֵידָה
  choice: provisões
  rationale: O substantivo indica mantimentos ou suprimentos levados numa viagem, sem se limitar necessariamente a alimentos.
- source_word: בְיֶדְכֶם
  choice: consigo
  rationale: Embora o hebraico diga literalmente “em suas mãos”, “levem consigo” transmite de modo natural a ideia de tomar e transportar as provisões.
- source_word: לַדֶּרֶךְ
  choice: para a viagem
  rationale: Neste contexto, דֶּרֶךְ se refere ao percurso da viagem; esta formulação expressa com clareza a finalidade das provisões.
- source_word: לִקְרָאתָם
  choice: ao encontro deles
  rationale: A expressão indica sair ou ir para encontrar alguém, preservada naturalmente em português.
- source_word: עַבְדֵיכֶם
  choice: servos de vocês
  rationale: Embora עֶבֶד também possa significar “escravo”, aqui integra uma fórmula diplomática de deferência. “Servos” preserva o registro sem impor a ideia de escravidão jurídica.
- source_word: וְעַתָּה
  choice: agora
  rationale: O advérbio introduz a solicitação principal. O ponto e vírgula reproduz a transição sem exigir uma conjunção pouco natural.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: façam uma aliança conosco
  rationale: כרת ברית é a expressão idiomática hebraica para estabelecer uma aliança. “Façam uma aliança” preserva a categoria pactual em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Emprega “vocês” para manter naturalidade no plural e evita tanto o arcaísmo de formas como “ide” quanto uma literalidade pouco idiomática em “em suas mãos”. As aspas distinguem a fala relatada da mensagem que os enviados deveriam pronunciar.
