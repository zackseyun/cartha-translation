  text: וְ/עַתָּ֖ה הִנְ/נ֣וּ בְ/יָדֶ֑/ךָ כַּ/טּ֨וֹב וְ/כַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לַ/עֲשׂ֥וֹת לָ֖/נוּ עֲשֵֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: pt
  text: E agora, eis-nos na tua mão. Faze conosco o que for bom e reto aos teus olhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Trata-nos como te parecer bom e justo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: E agora
  rationale: Preserva tanto a conjunção וְ quanto o marcador temporal-discursivo עַתָּה, introduzindo a submissão presente dos gibeonitas.
- source_word: הִנְנוּ
  choice: eis-nos
  rationale: Expressão apresentativa concisa que mantém a força dêitica do hebraico; embora menos coloquial que “aqui estamos”, continua clara e digna em português.
- source_word: בְיָדֶךָ
  choice: na tua mão
  rationale: Conserva a metáfora hebraica e o singular, indicando que eles estão sob o poder e a autoridade de Josué.
- source_word: כַּטּוֹב
  choice: bom
  rationale: Tradução direta de טוֹב no contexto de uma avaliação feita por Josué.
- source_word: וְכַיָּשָׁר
  choice: e reto
  rationale: “Reto” preserva o sentido de יָשָׁר como aquilo que é correto, direito ou apropriado e forma um par natural com “bom”.
- source_word: בְּעֵינֶיךָ
  choice: aos teus olhos
  rationale: Mantém a imagem idiomática hebraica de avaliação ou juízo pessoal sem acrescentar explicitamente a ideia de “parecer”.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: Faze conosco
  rationale: Reproduz de modo natural o pedido enfático formado pelo infinitivo e pelo imperativo de עשה. A formulação evita o português ambíguo “faze-nos”, que poderia ser entendido como “transforma-nos”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A segunda pessoa do singular preserva a referência direta a Josué. O texto principal conserva as imagens hebraicas “na tua mão” e “aos teus olhos”; a nota oferece uma formulação mais idiomática.
