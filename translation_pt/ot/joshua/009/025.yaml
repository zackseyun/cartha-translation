  source_fidelity: 'O texto preserva adequadamente todos os elementos centrais do hebraico: o conector temporal (“E agora”), a expressão apresentativa (“eis-nos”), a metáfora de submissão (“na tua mão”), a avaliação pessoal (“aos teus olhos”) e o pedido para que Josué aja segundo o que considere bom e reto. “Faze conosco o que for bom e reto aos teus olhos” comunica de modo natural a construção enfática do infinitivo seguido do imperativo, sem introduzir interpretação doutrinária.'
