base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: pt
  text: 'e tudo o que ele fez aos dois reis dos amorreus que estavam além do Jordão[a]: a Seom, rei de Hesbom, e a Ogue, rei de Basã, que estava em Astarote —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do outro lado do Jordão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: e
  rationale: A conjunção com o marcador de objeto dá continuidade à enumeração do versículo anterior; em português, o marcador não é traduzido separadamente.
- source_word: כָּל אֲשֶׁר
  choice: tudo o que
  rationale: Expressa de modo natural e completo a totalidade dos atos mencionados.
- source_word: עָשָׂה
  choice: ele fez
  rationale: Mantém o sujeito pronominal implícito no contexto, sem acrescentar explicitamente o nome divino, e traduz o sentido amplo de עשה.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: aos dois reis dos amorreus
  rationale: Preserva a construção do hebraico, indicando aquilo que foi feito aos reis sem explicitar interpretativamente 'contra'.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: que estavam além do Jordão
  rationale: A expressão localiza os reis no lado oposto do Jordão a partir da perspectiva discursiva; 'além do Jordão' é conciso e tradicional, sem eliminar a perspectiva relativa.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: a Seom, rei de Hesbom
  rationale: Emprega formas portuguesas correntes dos nomes e apresenta o título real em aposição clara.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: e a Ogue, rei de Basã
  rationale: Mantém o paralelismo com Seom e usa formas onomásticas correntes em português.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: que estava em Astarote
  rationale: A oração relativa modifica mais naturalmente Ogue; a preposição בְּ admite 'em' ou 'junto a', e 'em' é a expressão locativa mais natural em português.
theological_decisions:
- issue: Sujeito implícito de עָשָׂה
  choice: Traduzir como “ele fez”, deixando que o contexto identifique o referente como o SENHOR.
  alternative: Explicitar “o SENHOR fez”.
  rationale: O hebraico traz um verbo na terceira pessoa masculina singular sem sujeito nominal neste versículo. Preservar o pronome evita inserir no texto uma explicitação que pertence ao contexto.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A continuidade sintática com o versículo anterior é preservada pelo início em minúscula e pelo travessão final. Os nomes próprios seguem formas portuguesas correntes: Seom, Hesbom, Ogue, Basã e Astarote.'
