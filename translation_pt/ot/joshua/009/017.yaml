base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: pt
  text: Os filhos de Israel partiram e chegaram às cidades deles no terceiro dia. As cidades deles eram Gibeom, Quefira, Beerote e Quiriate-Jearim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: partiram
  rationale: O verbo נסע indica pôr-se a caminho ou partir. “Partiram” comunica com naturalidade o movimento narrativo sem acrescentar a ideia específica de levantar acampamento.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de forma transparente a expressão hebraica e seu valor coletivo tradicional, sem restringi-la aos israelitas do sexo masculino.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: e chegaram às cidades deles
  rationale: בוא com אֶל expressa chegada a um destino. “Chegaram às” é idiomático em português, e “deles” preserva a referência contextual do pronome hebraico.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: no terceiro dia
  rationale: É a leitura temporal direta e habitual da expressão hebraica.
- source_word: וְעָרֵיהֶם
  choice: As cidades deles eram
  rationale: A conjunção introduz uma explicação que enumera as cidades. Uma nova frase reproduz essa função com clareza natural em português.
- source_word: גִּבְעוֹן
  choice: Gibeão
  rationale: Forma portuguesa tradicional e amplamente reconhecível do topônimo hebraico.
- source_word: הַכְּפִירָה
  choice: Quefira
  rationale: Transliteração adaptada à ortografia e à pronúncia do português para o topônimo hebraico.
- source_word: בְּאֵרוֹת
  choice: Beerote
  rationale: Forma portuguesa tradicional do topônimo, próxima da estrutura sonora hebraica.
- source_word: קִרְיַת יְעָרִים
  choice: Quiriate-Jearim
  rationale: Forma portuguesa tradicional do topônimo composto; o hífen preserva visualmente sua unidade.
