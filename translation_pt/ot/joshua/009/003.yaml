  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: pt
  text: Mas os habitantes de Gibeão ouviram o que Josué havia feito a Jericó e a Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os habitantes de Gibeão ouviram o que Josué havia feito a Jericó e a Ai.”'
    reason: Alternativa lexical para a conjunção וְ, que pode indicar simples coordenação em vez de contraste.
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: Mas os habitantes de
  rationale: יֹשְׁבֵי designa os habitantes ou moradores de um lugar. O וְ inicial foi traduzido como “Mas” para expressar a mudança contrastante entre a reação dos reis em 9.1–2 e a dos gibeonitas.
- source_word: גִבְעוֹן
  choice: Gibeão
  rationale: Forma tradicional e amplamente reconhecida em português para o nome geográfico hebraico.
- source_word: שָׁמְעוּ
  choice: ouviram
  rationale: O qal perfeito de שׁמע tem aqui o sentido direto de “ouvir”; evita-se a interpretação mais explicativa “souberam”.
- source_word: אֵת אֲשֶׁר
  choice: o que
  rationale: A combinação do marcador de objeto com o relativo introduz o conteúdo ouvido; “o que” é natural e fiel em português.
- source_word: עָשָׂה
  choice: havia feito
  rationale: עָשָׂה significa “fazer”. O mais-que-perfeito composto deixa claro, com naturalidade narrativa, que as ações ocorreram antes de os habitantes ouvirem falar delas.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: לִֽ/ירִיחוֹ
  choice: a Jericó
  rationale: A preposição ל indica aqui a cidade que recebeu a ação de Josué. “A” preserva a formulação direta sem explicitar “contra”, embora o contexto seja hostil.
- source_word: וְ/לָ/עָי
  choice: e a Ai
  rationale: Mantém o paralelismo com “a Jericó” e emprega a forma portuguesa convencional do nome da cidade.
theological_decisions:
- issue: Valor da conjunção וְ no início do versículo
  choice: Mas
  alternative: E
  rationale: A escolha é discursiva, não doutrinária. Embora וְ possa ser mera coordenação, o contexto contrasta a estratégia de Gibeão com a reação dos reis nos versículos anteriores. A nota conserva a leitura coordenativa possível.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas amplamente reconhecidas no Brasil e compreensíveis internacionalmente. A sintaxe é natural, sem ampliar a hostilidade implícita na preposição hebraica.
