- from: Ao fim de três dias, depois de terem feito uma aliança com eles, os israelitas souberam que eles moravam perto e viviam no meio deles.
  to: Ao fim de três dias, depois de terem feito uma aliança com eles, os israelitas souberam que eles estavam perto deles e habitavam entre eles.
  rationale: Substitui-se «moravam perto» por «estavam perto deles» para manter a relação de proximidade indicada pelo hebraico, sem converter indevidamente essa afirmação em uma descrição de residência. «Habitavam entre eles» conserva de modo natural a segunda afirmação, referente à habitação no meio de Israel.
