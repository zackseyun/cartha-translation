  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: pt
  text: Ao fim de três dias, depois de terem feito uma aliança com eles, os israelitas souberam que eles estavam perto deles e habitavam entre eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: Ao fim de três dias
  rationale: Expressa de modo natural o marcador temporal hebraico, sem a fórmula narrativa pesada «e aconteceu».
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: terem feito uma aliança com eles
  rationale: «Fazer uma aliança» é português corrente e transmite a expressão idiomática hebraica literalmente baseada em «cortar».
- source_word: וַיִּשְׁמְעוּ
  choice: os israelitas souberam
  rationale: Neste contexto, o verbo indica que receberam a informação. O sujeito implícito é explicitado como «os israelitas» para evitar a sequência ambígua de pronomes em português.
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: eles moravam perto
  rationale: Preserva a ideia de proximidade em relação a Israel; a construção portuguesa evita o pouco natural «eram próximos a ele».
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: e viviam no meio deles
  rationale: Mantém a afirmação de que os gibeonitas habitavam dentro do território ou ambiente coletivo de Israel, conservando a referência coletiva do singular hebraico.
theological_decisions: []
