revisions:
- from: Quando todos os reis que estavam do outro lado do Jordão[a] — na região montanhosa, na Sefelá[b] e ao longo de toda a costa do mar Grande, na direção do Líbano —, isto é, os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus, ouviram falar do que havia acontecido,[c]
  to: Quando todos os reis que estavam do outro lado do Jordão[a] — na região montanhosa, na Sefelá[b] e ao longo de toda a costa do Grande Mar, em frente ao Líbano —, os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus, ouviram falar disso,[c]
  rationale: A revisão corrige o encadeamento da aposição, conserva a oração aberta para o versículo seguinte e reduz a explicitação contextual do objeto de «ouviram» a «disso». Também adota «Grande Mar», mais próximo da designação hebraica.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:08:02Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a construção temporal, as regiões geográficas, a lista de povos e o caráter incompleto da oração, que prossegue no versículo 2. Contudo, «mar Grande» não reproduz de modo tão direto a designação hebraica como «Grande Mar», e a explicitação «do que havia acontecido» é mais interpretativa do que o simples objeto contextual implícito.
  naturalness: O registro é geralmente claro e moderno. Há, porém, uma dificuldade de pontuação e de encadeamento em «—, isto é,», bem como uma vírgula indevida/interferente antes do verbo principal. Uma aposição entre travessões torna a frase mais natural e mantém a suspensão sintática do versículo.
  terminology: «Sefelá», «hititas», «amorreus», «cananeus», «ferezeus», «heveus» e «jebuseus» são formas adequadas em português. «Grande Mar» conserva melhor a designação tradicional traduzida literalmente do hebraico, sem exigir identificação explicativa como Mediterrâneo.
  issues:
  - severity: medium
    issue: Pontuação e aposição dos gentílicos
    rationale: A sequência «—, isto é,» é pontuacionalmente problemática, e a construção atual deixa uma vírgula desconfortável entre o sujeito extenso e «ouviram». Os gentílicos podem ser mantidos como aposição explicativa entre travessões, sem acrescentar uma equivalência discursiva desnecessária.
  - severity: low
    issue: Designação do ים הגדול
    rationale: «Mar Grande» é compreensível, mas «Grande Mar» corresponde mais de perto à ordem e ao uso bíblico tradicional da expressão hebraica «o Grande Mar».
  - severity: low
    issue: Explicitação do objeto de «ouviram»
    rationale: «Do que havia acontecido» é compatível com o contexto, mas formula o referente como um acontecimento. «Disso» preserva melhor a indefinição do objeto no hebraico e a solução mais contida do audit trail inglês.
  revised_text: Quando todos os reis que estavam do outro lado do Jordão[a] — na região montanhosa, na Sefelá[b] e ao longo de toda a costa do Grande Mar, em frente ao Líbano —, os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus, ouviram falar disso,[c]
