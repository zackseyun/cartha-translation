base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: pt
  text: Quando todos os reis que estavam do outro lado do Jordão[a] — na região montanhosa, na Sefelá[b] e ao longo de toda a costa do Grande Mar, em frente ao Líbano —, os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus, ouviram falar disso,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «além do Jordão». A expressão hebraica pode ser entendida de uma ou de outra forma, conforme a perspectiva geográfica.'
    reason: lexical_alternative
  - marker: b
    text: A Sefelá era a região de colinas baixas entre a região montanhosa central e a planície costeira.
    reason: cultural_note
  - marker: c
    text: 'Hebraico, literalmente: «Quando todos os reis ... ouviram». O objeto do verbo não é declarado e foi explicitado com base no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Quando ... ouviram falar do que havia acontecido
  rationale: A construção introduz uma circunstância temporal e permanece sintaticamente ligada ao versículo seguinte. O objeto de 'ouviram' não é expresso no hebraico; a formulação portuguesa o explicita com base no contexto, sem concluir a frase.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: que estavam do outro lado do Jordão
  rationale: Expressão geográfica natural em português que preserva a dependência da perspectiva do narrador, sem especificar leste ou oeste.
- source_word: בָּהָר
  choice: na região montanhosa
  rationale: Aqui הַר designa uma zona geográfica de terras altas, não apenas uma montanha isolada.
- source_word: וּבַשְּׁפֵלָה
  choice: na Sefelá
  rationale: O termo funciona como nome da região de colinas baixas e sopés ocidentais; a transliteração evita confundi-la com uma planície genérica, e a nota oferece esclarecimento.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: e ao longo de toda a costa do mar Grande
  rationale: Reproduz o sentido distributivo de כֹל e conserva a designação hebraica tradicional do Mediterrâneo.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: na direção do Líbano
  rationale: Expressa de modo natural a orientação geográfica indicada pela locução, cuja nuance também pode ser 'defronte do Líbano'.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: os hititas, os amorreus, os cananeus, os ferezeus, os heveus e os jebuseus
  rationale: Os gentílicos singulares coletivos do hebraico são vertidos no plural, forma mais natural em português para designar esses povos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase permanece aberta por vírgula porque a oração iniciada neste versículo continua no versículo 2. Evitou-se o arcaísmo “E aconteceu que” e preservaram-se tanto a ambiguidade geográfica de בְּעֵבֶר quanto a omissão do objeto de “ouvir” por meio de notas.
