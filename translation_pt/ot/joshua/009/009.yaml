  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: pt
  text: 'E eles lhe disseram: “Seus servos vieram de uma terra muito distante por causa do nome de Yahweh, seu Deus, pois ouvimos falar da sua fama[a] e de tudo o que ele fez no Egito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “ouvimos a notícia a respeito dele” ou “ouvimos falar do seu renome”. O hebraico emprega palavras da mesma raiz, literalmente: “ouvimos o que dele se ouve”.'
    reason: Registra a construção cognata e as alternativas legítimas de sentido entre notícia, reputação e fama.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: E eles lhe disseram
  rationale: Preserva o fluxo narrativo do wayyiqtol e introduz a fala direta de modo natural em português.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: de uma terra muito distante
  rationale: Reproduz o substantivo אֶרֶץ, o adjetivo רְחוֹקָה e a intensificação de מְאֹד em linguagem corrente.
- source_word: בָּאוּ עֲבָדֶיךָ
  choice: Seus servos vieram
  rationale: Aqui עֲבָדֶיךָ é uma autodesignação respeitosa em contexto diplomático; “servos” comunica essa deferência sem impor o sentido mais específico de escravidão.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: por causa do nome de Yahweh, seu Deus
  rationale: A preposição לְ indica aqui o motivo da vinda; “por causa do nome” mantém a expressão hebraica e permite que “nome” comunique reputação ou renome.
- source_word: כִּי שָׁמַעְנוּ שָׁמְעוֹ
  choice: pois ouvimos falar da sua fama
  rationale: A construção cognata hebraica se refere ao que se ouviu a respeito dele — notícia, reputação ou renome. A formulação escolhida é idiomática em português, enquanto a nota registra a amplitude lexical.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: e de tudo o que ele fez no Egito
  rationale: Tradução direta e natural da segunda coisa que os gibeonitas afirmam ter ouvido.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama; “Yahweh” o apresenta como nome próprio e segue a convenção estabelecida para este projeto.
- issue: Sentido de לְשֵׁם na motivação da viagem
  choice: por causa do nome de Yahweh
  alternative: pelo nome de Yahweh; por amor ao nome de Yahweh
  rationale: A escolha expressa causa ou motivo sem acrescentar uma noção devocional de serviço “por amor” ao nome, o que resolveria além do texto a intenção alegada pelos falantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a cortesia diplomática de “seus servos” e usa “Yahweh” para o nome divino. O marcador foi colocado junto de “fama”, expressão à qual a nota lexical efetivamente se refere.
