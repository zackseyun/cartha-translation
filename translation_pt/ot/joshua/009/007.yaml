reference: Joshua 9:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: pt
  text: 'Mas os homens de Israel disseram ao heveu: “Talvez você more no nosso meio[a]. Como, então, eu poderia fazer uma aliança[b] com você?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “no meu meio”; o singular provavelmente reflete a fala de um representante de Israel.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “cortar uma aliança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: os homens de Israel
  rationale: Embora אִישׁ esteja no singular, a expressão tem sentido coletivo e se refere aos representantes israelitas. A formulação conserva esse valor sem dar a impressão de que apenas um israelita falou.
- source_word: הַחִוִּי
  choice: ao heveu
  rationale: Mantém o singular do hebraico, provavelmente dirigido ao representante do grupo gibeonita.
- source_word: אוּלַי
  choice: Talvez
  rationale: Expressa de modo natural a suspeita ou possibilidade levantada pelos israelitas.
- source_word: בְּקִרְבִּי
  choice: no nosso meio
  rationale: O hebraico diz literalmente “no meu meio”, mas o singular representa Israel coletivamente; “no nosso meio” comunica com clareza a ideia geográfica e comunitária.
- source_word: יוֹשֵׁב
  choice: more
  rationale: O particípio de ישׁב indica residência contínua; “more” é atual, claro e idiomático em português.
- source_word: וְאֵיךְ
  choice: Como, então, eu poderia
  rationale: A expressão introduz a consequência prática da possibilidade levantada, enquanto “poderia” preserva a força modal da pergunta.
- source_word: אכרות ... בְרִית
  choice: fazer uma aliança
  rationale: O hebraico emprega literalmente o idioma “cortar uma aliança”. “Fazer uma aliança” transmite naturalmente o sentido em português moderno.
- source_word: לְךָ
  choice: com você
  rationale: No contexto de estabelecer uma aliança, a preposição indica a contraparte e é expressa naturalmente por “com você”.
theological_decisions:
- issue: Singulares representativos na fala de Israel
  choice: Usar o coletivo em “nosso meio”, mas conservar a primeira pessoa singular em “eu poderia fazer”
  alternative: 'Manter os singulares de forma literal: “no meu meio... como eu poderia fazer”'
  rationale: O texto hebraico combina referência coletiva a Israel com a fala de um representante. A tradução evita sugerir que o território pertença apenas a um indivíduo, sem apagar a mudança para a primeira pessoa singular no verbo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Heveu” mantém a designação étnica tradicional e o singular do texto; “você” corresponde ao destinatário singular sem impor formalidade arcaica.
