  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: pt
  text: Assim, Josué fez paz com eles e firmou uma aliança com eles para deixá-los viver, e os líderes da comunidade juraram-lhes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ ... שָׁלוֹם
  choice: fez paz com eles
  rationale: Reproduz de modo natural o idioma hebraico que indica o estabelecimento de relações pacíficas.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: firmou uma aliança
  rationale: Traduz o idioma hebraico literalmente associado a 'cortar' uma aliança por uma expressão portuguesa atual, digna e juridicamente adequada, sem perder seu caráter solene.
- source_word: לְחַיּוֹתָם
  choice: para deixá-los viver
  rationale: Mantém a finalidade expressa pelo infinitivo hebraico e não especifica além do texto se a ideia é permitir que vivam ou poupar-lhes a vida.
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: lhes prestaram juramento
  rationale: Explicita de maneira idiomática o ato formal de jurar, preservando o destinatário indicado no hebraico.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: os líderes da comunidade
  rationale: נְשִׂיאִים designa dirigentes reconhecidos, e עֵדָה, neste contexto, é a comunidade reunida de Israel; a formulação é clara sem sugerir estruturas eclesiásticas posteriores.
theological_decisions:
- issue: Expressão hebraica para estabelecer uma aliança
  choice: firmou uma aliança
  alternative: cortou uma aliança
  rationale: A imagem literal de 'cortar' pertence ao idioma hebraico, mas em português pode obscurecer o sentido. 'Firmou' conserva a solenidade jurídica e teológica da aliança sem acrescentar conteúdo doutrinário.
- issue: Sentido de הָעֵדָה
  choice: comunidade
  alternative: congregação; assembleia
  rationale: O termo designa o corpo comunitário de Israel, possivelmente considerado em sua dimensão reunida. 'Comunidade' preserva o sentido coletivo sem importar uma estrutura eclesial posterior.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A coordenação narrativa do hebraico foi preservada sem rigidez excessiva.
