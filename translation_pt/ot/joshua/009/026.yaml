base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: pt
  text: Assim, ele fez isso por eles e os livrou da mão dos filhos de Israel[a], e estes não os mataram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “israelitas”. O hebraico diz literalmente “filhos de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Assim, ele fez isso por eles
  rationale: Mantém o sentido resumitivo de כֵּן (“assim”) e a construção com עשה, retomando a ação mencionada no contexto anterior sem acrescentar uma explicação ausente do hebraico.
- source_word: וַיַּצֵּל
  choice: os livrou
  rationale: O hifil de נצל expressa tirar alguém do perigo, livrar ou resgatar. “Livrou” combina naturalmente com a expressão seguinte “das mãos de”.
- source_word: מִיַּד
  choice: das mãos de
  rationale: Preserva a metáfora hebraica de estar sob o poder ou controle de alguém. O plural é idiomático e natural em português quando se refere a um grupo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  rationale: Reproduz de perto a designação coletiva masculina do hebraico, mantendo contato explícito com a forma do texto-fonte; “israelitas” é a alternativa mais corrente.
- source_word: וְלֹא הֲרָגוּם
  choice: e estes não os mataram
  rationale: “Mataram” expressa diretamente הרג. O demonstrativo “estes” identifica de modo natural os filhos de Israel como sujeito do verbo plural e distingue esse grupo dos gibeonitas representados por “os”.
theological_decisions:
- issue: Designação coletiva marcada por gênero em בְּנֵי יִשְׂרָאֵל
  choice: filhos de Israel
  alternative: israelitas
  rationale: A expressão hebraica significa literalmente “filhos de Israel” e funciona como designação nacional. A tradução conserva sua forma masculina e oferece em nota a forma portuguesa coletiva mais idiomática, sem alterar a referência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A coordenação das orações acompanha a sequência narrativa hebraica; “estes” evita ambiguidade pronominal excessiva sem mudar o referente natural do verbo plural.
