  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: pt
  text: Assim, naquele dia, Josué os designou como cortadores de lenha e tiradores de água[a] para a comunidade e para o altar de Yahweh, até o dia de hoje, no lugar que ele escolhesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “carregadores de água”.'
    reason: Alternativa funcional para a expressão hebraica, que literalmente descreve pessoas que tiram água.
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: os designou como
  rationale: Embora נתן signifique literalmente “dar” ou “pôr”, nesta construção ele indica que Josué lhes atribuiu uma função permanente. “Designou como” expressa com naturalidade esse sentido contextual.
- source_word: חֹטְבֵי עֵצִים
  choice: cortadores de lenha
  rationale: A expressão participial designa pessoas encarregadas de cortar madeira. “Cortadores de lenha” é claro, atual e próximo da forma hebraica.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: tiradores de água
  rationale: O verbo שאב denota retirar ou tirar água, normalmente de um poço ou fonte. “Tiradores de água” preserva a ação específica do hebraico; a formulação funcional alternativa aparece em nota.
- source_word: לָעֵדָה
  choice: para a comunidade
  rationale: עֵדָה designa aqui a coletividade reunida de Israel. “Comunidade” é amplamente compreensível em português moderno sem restringir o termo a uma reunião pontual.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: e para o altar de Yahweh
  rationale: A formulação mantém a relação direta entre o serviço imposto e o altar dedicado ao culto de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Equivalente idiomático que indica a continuidade da situação desde o acontecimento narrado até o tempo do narrador.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: no lugar que ele escolhesse
  rationale: “No lugar” comunica o local em que o serviço ligado ao altar seria prestado. O imperfeito do subjuntivo apresenta a escolha como futura do ponto de vista da narrativa passada, mantendo o pronome do hebraico.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto hebraico emprega diretamente o nome divino. “Yahweh” preserva sua condição de nome pessoal sem substituí-lo por um título.
- issue: Referente de “ele” em “no lugar que ele escolhesse”
  choice: Manter o pronome, cujo referente contextual é Yahweh
  alternative: Explicitar “no lugar que Yahweh escolhesse” ou usar a forma passiva “no lugar que fosse escolhido”
  rationale: Na linguagem de Deuteronômio e Josué, é Yahweh quem escolhe o lugar de culto. Manter “ele” reproduz a referência pronominal do hebraico e evita explicitação maior que a do texto-fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Evitou-se o arcaísmo “rachadores de lenha” e manteve-se a perspectiva narrativa da escolha futura do local por meio de “escolhesse”.
