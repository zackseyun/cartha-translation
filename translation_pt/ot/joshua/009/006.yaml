  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: pt
  text: 'Eles foram até Josué, no acampamento em Gilgal, e disseram a ele e aos homens de Israel: “Viemos de uma terra distante. Agora, façam uma aliança conosco[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “façam um tratado conosco”. A expressão idiomática hebraica diz literalmente: “cortem uma aliança conosco”.'
    reason: Alternativa lexical e esclarecimento da expressão idiomática hebraica כרת ברית.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Eles foram
  rationale: O verbo הלך significa normalmente “ir/andar”. “Foram” preserva o movimento narrativo sem acrescentar a perspectiva de chegada expressa por “vieram”.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: até Josué, no acampamento em Gilgal
  rationale: O primeiro אֶל indica o movimento até Josué; a segunda expressão identifica o local onde ele estava. A formulação evita uma repetição pouco natural em português e conserva tanto o destino pessoal quanto o lugar.
- source_word: הַמַּחֲנֶה
  choice: o acampamento
  rationale: מַחֲנֶה designa um acampamento, termo natural e adequado ao contexto de deslocamento e organização de Israel.
- source_word: וַיֹּאמְרוּ
  choice: e disseram
  rationale: אמר é o verbo comum para introduzir fala. “Disseram” mantém a sequência narrativa de modo claro e conciso.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: a ele e aos homens de Israel
  rationale: אִישׁ יִשְׂרָאֵל é uma construção coletiva singular referente aos homens ou representantes israelitas. A forma escolhida preserva sua expressão masculina e seu sentido coletivo.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: de uma terra distante
  rationale: אֶרֶץ pode significar “terra” ou “país”, e רְחוֹקָה, “distante”. “Terra distante” conserva a amplitude lexical e a alegação de grande distância.
- source_word: בָּאנוּ
  choice: Viemos
  rationale: O perfeito hebraico apresenta a vinda como concluída e relevante para a situação presente. Em português, “Viemos” expressa isso naturalmente no discurso direto.
- source_word: וְעַתָּה
  choice: Agora
  rationale: A expressão introduz a solicitação decorrente da alegação anterior. “Agora” é corrente e digna; a relação inferencial permanece clara pelo contexto.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: façam uma aliança conosco
  rationale: כרת ברית é a expressão idiomática hebraica literalmente associada a “cortar” uma aliança. “Fazer uma aliança” comunica seu sentido em português atual, enquanto a nota preserva tanto a forma literal quanto a alternativa política “tratado”.
theological_decisions:
- issue: Tradução de בְרִית em um contexto de acordo político
  choice: aliança
  alternative: tratado
  rationale: Embora o contexto seja diplomático, בְרִית é o termo bíblico usual para “aliança”. Mantê-lo no texto preserva a coerência lexical e suas ressonâncias bíblicas sem negar o sentido político, registrado na nota como alternativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O plural “façam” preserva o imperativo dirigido a Josué e aos homens de Israel. A pontuação divide a alegação e o pedido em frases naturais, sem eliminar sua relação lógica.
