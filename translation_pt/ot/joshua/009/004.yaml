  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: pt
  text: Também eles agiram com astúcia. Foram, disfarçaram-se[a] e levaram sacos gastos para os seus jumentos e odres de vinho gastos, rachados e remendados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abasteceram-se de provisões” ou “fizeram-se passar por mensageiros”. O verbo hebraico é difícil e tem sido entendido de mais de uma maneira; o contexto da aparência enganosa favorece “disfarçaram-se”.
    reason: alternative_reading
  - marker: b
    text: Ou “amarrados” ou “atados”, provavelmente descrevendo odres consertados com amarras depois de racharem.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הֵמָּה
  choice: Também eles
  rationale: Mantém a ênfase de que os gibeonitas também reagiram aos acontecimentos, em paralelo com os reis mencionados antes.
- source_word: בְּעָרְמָה
  choice: com astúcia
  rationale: O termo denota sagacidade ou habilidade ardilosa; neste contexto, a ação tem caráter enganoso, sem que seja necessário ampliar a avaliação moral no próprio vocábulo.
- source_word: וַיִּצְטַיָּרוּ
  choice: disfarçaram-se
  rationale: O verbo é textualmente e lexicalmente difícil. A escolha segue o contexto imediato, no qual os objetos gastos criam a aparência enganosa de uma longa viagem; leituras alternativas são preservadas em nota.
- source_word: שַׂקִּים בָּלִים
  choice: sacos gastos
  rationale: Descreve sacos de carga deteriorados pelo uso, com linguagem comum e visualmente clara.
- source_word: לַחֲמוֹרֵיהֶם
  choice: para os seus jumentos
  rationale: Expressa a relação de uso entre os sacos e os animais sem afirmar mais do que o hebraico.
- source_word: נֹאדוֹת יַיִן
  choice: odres de vinho
  rationale: É a designação portuguesa tradicional e precisa para recipientes de pele usados para guardar vinho.
- source_word: בָּלִים
  choice: gastos
  rationale: Repete para os odres a mesma ideia de deterioração presente na descrição dos sacos.
- source_word: מְבֻקָּעִים
  choice: rachados
  rationale: Comunica de modo natural o estado de recipientes cuja pele se abriu ou rompeu.
- source_word: מְצֹרָרִים
  choice: remendados
  rationale: Expressa a função reparadora do ato de atar ou amarrar os odres danificados; a imagem mais literal é indicada em nota.
theological_decisions: []
