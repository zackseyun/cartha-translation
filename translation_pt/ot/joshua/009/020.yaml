base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: pt
  text: Faremos isto com eles e os deixaremos viver[a], para que não venha sobre nós a ira[b], por causa do juramento que lhes fizemos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os manteremos vivos” ou “os pouparemos”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto, provavelmente se trata da ira divina, embora o texto hebraico não diga explicitamente “a ira do SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: Faremos isto com eles
  rationale: O demonstrativo introduz a medida proposta, e o imperfeito de עשה expressa aqui uma ação futura deliberada. “Com eles” é a formulação mais natural em português para o tratamento que lhes será dado.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: vamos deixá-los viver
  rationale: O Hifil de חיה pode significar deixar viver, manter vivo ou poupar. “Deixá-los viver” preserva o sentido básico e soa natural no contexto.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: para que não venha sobre nós a ira
  rationale: A formulação comunica a consequência que os líderes procuram evitar. “Venha sobre nós” representa de modo idiomático היה com עַל, sem identificar explicitamente a origem da ira.
- source_word: עַל הַשְּׁבוּעָה
  choice: por causa do juramento
  rationale: Neste contexto, עַל indica a causa da ira temida; “por causa de” exprime com clareza essa relação.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: que lhes fizemos
  rationale: Em português, “fazer um juramento a alguém” é uma expressão natural para o Nifal de שׁבע com ל, evitando a construção menos idiomática “juramento que lhes juramos”.
theological_decisions:
- issue: Referente de קֶצֶף no contexto da violação de um juramento
  choice: Manter apenas “a ira” no texto principal
  alternative: Explicitar “a ira do SENHOR”
  rationale: O contexto provavelmente aponta para a ira divina, mas o hebraico deste versículo não nomeia o SENHOR. A tradução conserva a implicação sem acrescentar um referente explícito.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O futuro composto em “vamos deixá-los viver” torna natural a explicação da medida proposta; os marcadores de nota seguem imediatamente os termos a que se referem.
