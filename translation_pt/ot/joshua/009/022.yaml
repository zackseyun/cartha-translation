  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: pt
  text: 'Então Josué os chamou e lhes disse: “Por que vocês nos enganaram, dizendo: ‘Estamos muito longe de vocês’, quando, na verdade, vivem entre nós[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “habitam em nosso meio”.
    reason: Alternativa lexical que reflete mais literalmente בְּקִרְבֵּנוּ יֹשְׁבִים.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: os chamou
  rationale: No contexto, o verbo indica que Josué chamou os gibeonitas para confrontá-los. “Os chamou” é claro e natural, sem acrescentar explicitamente a ideia causativa de que mandou buscá-los.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: e lhes disse
  rationale: A fórmula hebraica introduz a fala direta. “E lhes disse” reproduz sua função de modo natural em português, evitando a rigidez de “falou-lhes, dizendo”.
- source_word: לָמָּה
  choice: Por que
  rationale: Equivalente interrogativo direto e idiomático.
- source_word: רִמִּיתֶם
  choice: vocês nos enganaram
  rationale: O piel de רמה expressa engano deliberado; “enganaram” conserva a força da acusação sem recorrer a linguagem coloquial.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: Estamos muito longe de vocês
  rationale: Preserva tanto a construção predicativa quanto a intensificação de distância por מְאֹד.
- source_word: בְּקִרְבֵּנוּ
  choice: entre nós
  rationale: Expressa naturalmente o sentido idiomático de estar no meio do povo ou em sua proximidade territorial.
- source_word: יֹשְׁבִים
  choice: vivem
  rationale: O particípio de ישב indica residência contínua; “vivem” é corrente e adequado ao contexto.
theological_decisions:
- issue: Acusação pactual implícita
  choice: Traduzir somente a acusação explícita de engano sobre a distância geográfica.
  alternative: Explicitar no versículo implicações de violação ou manipulação da aliança.
  rationale: O texto deste versículo se concentra na falsa alegação de distância e na residência efetiva dos gibeonitas entre os israelitas; as implicações pactuais pertencem ao contexto e não devem ser inseridas na tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “vocês” torna explícito o plural hebraico e evita a ambiguidade de número de “você”. A expressão “quando, na verdade” torna natural em português o contraste marcado no hebraico por וְאַתֶּם, sem acrescentar conteúdo interpretativo.
