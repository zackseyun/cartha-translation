base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: pt
  text: 'Os líderes lhes disseram: “Que eles vivam.” Assim, eles se tornaram cortadores de madeira e tiradores de água para toda a congregação, conforme os líderes lhes haviam dito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: os líderes
  rationale: No contexto, refere-se aos chefes reconhecidos da comunidade israelita; “líderes” é atual, claro e não sugere título monárquico.
- source_word: יִחְיוּ
  choice: Que eles vivam
  rationale: O imperfeito tem força jussiva e expressa a decisão de poupar-lhes a vida.
- source_word: וַיִּהְיוּ
  choice: eles se tornaram
  rationale: Indica a condição ou função que passou a ser atribuída aos gibeonitas como resultado da decisão.
- source_word: חֹטְבֵי עֵצִים
  choice: rachadores de lenha
  rationale: Expressa de modo concreto e natural a ocupação contínua de cortar madeira, preservando o paralelismo com a expressão seguinte.
- source_word: שֹׁאֲבֵי מַיִם
  choice: tiradores de água
  rationale: Preserva a imagem específica de retirar ou buscar água, em vez de ampliar o sentido para simples transporte.
- source_word: לְכָל הָעֵדָה
  choice: para toda a congregação
  rationale: “Congregação” conserva o sentido da comunidade reunida de Israel e é inteligível em português moderno.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: conforme os líderes lhes haviam dito
  rationale: Liga o resultado à determinação anterior dos líderes; o mais-que-perfeito composto deixa clara essa anterioridade.
