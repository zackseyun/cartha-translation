base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: pt
  text: 'Este nosso pão estava quente quando o tomamos de nossas casas como provisão, no dia em que partimos para vir até vocês. Mas agora, vejam: está seco e ficou manchado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou mofado”, “rachado” ou “esfarelado”. O termo hebraico descreve algo marcado por pontos ou manchas; no contexto de pão envelhecido, a condição exata não é clara.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: Este nosso pão
  rationale: Preserva o demonstrativo e a ênfase possessiva do hebraico em uma construção natural em português.
- source_word: חָם
  choice: ainda estava quente
  rationale: Traduz literalmente o adjetivo; “ainda” torna natural a afirmação de que o pão permanecia quente ao ser levado, sem substituí-la pela interpretação “fresco”.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: o levamos ... como provisão
  rationale: Expressa o sentido de equipar-se com mantimentos e mantém o pão como objeto do verbo.
- source_word: מִבָּתֵּינוּ
  choice: de nossas casas
  rationale: Mantém o plural concreto do texto hebraico.
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: no dia em que partimos
  rationale: Reproduz com clareza a indicação temporal do infinitivo construto.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: para vir até vocês
  rationale: Embora o verbo hebraico signifique literalmente “ir”, “vir até vocês” é a formulação portuguesa natural da perspectiva dos interlocutores.
- source_word: וְעַתָּה הִנֵּה
  choice: Mas agora, vejam
  rationale: Comunica tanto o contraste quanto o chamado para observar a evidência apresentada; o plural concorda com os destinatários.
- source_word: יָבֵשׁ
  choice: está seco
  rationale: Preserva de modo conciso o estado presente indicado pelo hebraico.
- source_word: וְהָיָה נִקֻּדִים
  choice: ficou todo manchado
  rationale: Mantém o sentido formal de algo marcado por pontos ou manchas, sem decidir de modo indevido se eram sinais de mofo, rachaduras ou esfarelamento.
