  - severity: low
    issue: ‘Portanto, agora’ é uma transição pouco idiomática e redundante.
    rationale: וְעַתָּה pode ser expresso naturalmente por ‘E agora’, sem perder o movimento do discurso para a sentença pronunciada.
  revised_text: E agora vocês estão amaldiçoados, e nunca deixará de haver entre vocês escravos, cortadores de madeira e tiradores de água para a casa do meu Deus.[a]
