  source_fidelity: 'A estrutura principal reflete bem o hebraico: a maldição é dirigida ao grupo, e a expressão negativa com ‘ser cortado/eliminado do meio de vocês’ comunica uma provisão contínua de trabalhadores. Contudo, ‘rachadores de lenha’ descreve mais propriamente quem racha lenha já cortada, não quem corta/derruba madeira (חֹטְבֵי עֵצִים).'
  naturalness: ‘Portanto, agora’ soa redundante em português moderno. ‘E agora’ preserva a transição discursiva do hebraico com maior naturalidade. ‘Cortadores de madeira’ é claro, atual e mantém o paralelismo com ‘tiradores de água’.
  terminology: ‘Escravos’ preserva adequadamente o caráter imposto e subalterno de עֶבֶד neste contexto. ‘Casa do meu Deus’ mantém a referência cultual sem introduzir uma interpretação denominacional.
