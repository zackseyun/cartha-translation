  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you slaves, cutters of wood and drawers of water for the house of my God.
translation:
  language: pt
  text: E agora vocês estão amaldiçoados, e nunca deixará de haver entre vocês escravos, cortadores de madeira e tiradores de água para a casa do meu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “não será eliminado do meio de vocês um escravo”; o hebraico indica que o povo deles continuaria fornecendo pessoas para esse trabalho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Portanto, agora
  rationale: Expressa a transição conclusiva do pronunciamento de Josué de maneira natural e digna em português.
- source_word: אֲרוּרִים
  choice: estão debaixo de maldição
  rationale: Reproduz o predicativo plural e comunica com clareza a condição imposta, sem sugerir apenas uma imprecação momentânea.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: nunca deixará de haver entre vocês escravos
  rationale: Conserva a imagem hebraica de que escravos não deixarão de proceder do meio deles, exprimindo uma condição coletiva contínua sem restringir a maldição a apenas alguns indivíduos presentes.
- source_word: עֶבֶד
  choice: escravos
  rationale: Embora singular e coletivo no hebraico, denota aqui uma condição subalterna imposta; o plural português explicita essa função coletiva e preserva a severidade do pronunciamento.
- source_word: חֹטְבֵי עֵצִים
  choice: rachadores de lenha
  rationale: Designa em português atual a tarefa braçal concreta de cortar madeira, mantendo o paralelismo com a tarefa seguinte.
- source_word: שֹׁאֲבֵי מַיִם
  choice: tiradores de água
  rationale: Preserva a ação concreta de retirar água de uma fonte ou poço, sem substituí-la pela ideia mais ampla de transportar água.
- source_word: לְבֵית אֱלֹהָי
  choice: para a casa do meu Deus
  rationale: Mantém a referência ao santuário dedicado ao Deus de Josué, em formulação formalmente próxima do hebraico.
theological_decisions:
- issue: Natureza da condição servil imposta na maldição
  choice: escravos
  alternative: servos
  rationale: O contexto apresenta trabalho subordinado e compulsório como consequência da maldição. “Escravos” preserva essa gravidade; “servos” poderia suavizar indevidamente a condição.
- issue: Alcance temporal e corporativo do pronunciamento
  choice: nunca deixará de haver entre vocês
  alternative: alguns de vocês nunca deixarão de ser
  rationale: A construção hebraica afirma que não será eliminado do meio do grupo quem exerça essa condição, indicando fornecimento contínuo ao longo do tempo; não afirma necessariamente que os mesmos indivíduos permanecerão nela para sempre.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O texto mantém tom judicial e solene sem arcaísmos. “Rachadores de lenha” e “tiradores de água” preservam as tarefas concretas e o paralelismo hebraico.
