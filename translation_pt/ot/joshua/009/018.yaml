source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: pt
  text: Mas os israelitas[a] não os atacaram[b], porque os líderes da comunidade haviam jurado a eles por Yahweh, o Deus de Israel. E toda a comunidade murmurou contra os líderes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido como “não os feriram” ou “não os mataram”; neste contexto, o verbo hebraico pode indicar um ataque com força letal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os israelitas
  rationale: A expressão hebraica é literalmente “os filhos de Israel”, mas funciona como designação coletiva do povo; “os israelitas” comunica esse sentido de modo natural e inclusivo em português moderno, sem alterar o referente.
- source_word: הִכּוּם
  choice: não os atacaram
  rationale: O verbo נכה significa golpear e, em contexto militar, pode abranger atacar ou matar. “Atacaram” expressa aqui a ação violenta da qual Israel se absteve, sem determinar de modo indevido que o verbo signifique necessariamente matar.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: haviam jurado a eles
  rationale: O nifal de שׁבע indica prestar juramento. O mais-que-perfeito deixa clara a anterioridade do juramento em relação à decisão de não atacar.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: os líderes da comunidade
  rationale: נְשִׂיאִים designa chefes ou dirigentes reconhecidos, e עֵדָה designa a coletividade reunida. “Líderes da comunidade” é claro, atual e evita tanto o ar monárquico de “príncipes” quanto associações eclesiásticas posteriores.
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: por Yahweh, o Deus de Israel
  rationale: Com o verbo “jurar”, בְּ identifica aquele por quem se presta o juramento. O nome divino יהוה é transliterado como “Yahweh”, e o aposto preserva sua identificação como o Deus de Israel.
- source_word: וַיִּלֹּנוּ
  choice: murmurou
  rationale: O verbo לון descreve a insatisfação coletiva dirigida contra líderes. “Murmurou” conserva essa nuance e sua ressonância narrativa bíblica; o singular concorda naturalmente com o coletivo “comunidade”.
- source_word: כָל הָעֵדָה עַל הַנְּשִׂיאִים
  choice: toda a comunidade ... contra os líderes
  rationale: כָל intensifica a totalidade da coletividade, enquanto עַל, após לון, marca o alvo adversativo da murmuração.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e evita substituí-lo por um título, sem acrescentar interpretação denominacional.
- issue: Sentido comunitário de עֵדָה
  choice: comunidade
  alternative: congregação; assembleia
  rationale: “Comunidade” apresenta Israel como corpo coletivo sem importar uma estrutura eclesiástica posterior. “Assembleia” poderia sugerir apenas uma reunião pontual, embora permaneça uma alternativa possível.
- issue: Alcance da violência em נכה
  choice: atacaram
  alternative: feriram; mataram
  rationale: O contexto permite que a ação tivesse resultado letal, mas a forma verbal, isoladamente, não exige explicitar esse resultado. A tradução mantém essa abertura sem enfraquecer o cenário militar.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a sequência causal do hebraico, emprega “Yahweh” como nome próprio e usa “comunidade” de modo consistente nas duas ocorrências de עֵדָה.
