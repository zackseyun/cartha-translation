source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: pt
  text: 'Responderam a Josué e disseram: “Porque seus servos foram claramente informados[a] do que Yahweh, seu Deus, ordenou a Moisés, seu servo: dar a vocês toda a terra e destruir todos os habitantes da terra de diante de vocês. Por isso, tememos muito por nossas vidas por causa de vocês e fizemos isto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus servos foram certamente informados”. O hebraico combina um infinitivo absoluto com o verbo finito para dar ênfase.'
    reason: Registra a construção enfática הֻגֵּד הֻגַּד e uma alternativa portuguesa possível, sem acrescentar sentido ao texto.
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: Eles responderam a Josué
  rationale: Em português, “responderam” já introduz naturalmente a fala; omitir o redundante “e disseram” preserva a função narrativa sem produzir formulação pesada.
- source_word: כִּי
  choice: É porque
  rationale: Introduz a explicação causal dada pelos gibeonitas e se liga naturalmente à fala em português.
- source_word: הֻגֵּד הֻגַּד
  choice: foi claramente relatado
  rationale: A construção com infinitivo absoluto e verbo finito passivo expressa ênfase. “Claramente relatado” comunica que a informação chegou de modo inequívoco, enquanto a nota registra uma alternativa mais formal.
- source_word: לַעֲבָדֶיךָ
  choice: aos seus servos
  rationale: É uma autodesignação deferente em discurso diplomático, não uma ênfase na condição de escravidão.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, seu Deus
  rationale: Preserva o nome divino e a relação direta com Josué expressa pelo sufixo de segunda pessoa singular.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: dar a vocês toda esta terra
  rationale: “Esta terra” torna explícita em português a referência contextual ao território em questão; “a vocês” representa a segunda pessoa plural.
- source_word: וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם
  choice: e destruir diante de vocês todos os habitantes dela
  rationale: Mantém a força de השמיד e o sentido espacial/de remoção de מִפְּנֵיכֶם sem suavizar o conteúdo difícil do texto.
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ מִפְּנֵיכֶם
  choice: tivemos muito medo de vocês e tememos por nossa vida
  rationale: A formulação comunica tanto o medo intenso causado por Israel quanto a preocupação pela própria sobrevivência contida em לְנַפְשֹׁתֵינוּ.
- source_word: וַנַּעֲשֵׂה אֶת־הַדָּבָר הַזֶּה
  choice: então fizemos isso
  rationale: Equivalente idiomático atual de “fizemos esta coisa”, preservando a relação consequencial no discurso.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Linguagem da destruição dos habitantes
  choice: destruir diante de vocês todos os habitantes dela
  alternative: eliminar todos os habitantes da terra do caminho de vocês
  rationale: A opção mantém a severidade de השמיד e não resolve nem atenua a tensão teológica e moral presente no relato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O discurso mantém deferência por meio de “seus servos”; usa “vocês” para distinguir naturalmente o plural dirigido a Israel do singular dirigido a Josué. A redundância hebraica da fórmula de fala foi condensada, mas a ênfase de הֻגֵּד הֻגַּד foi preservada no texto e explicada em nota.
