    text: 'Ou: “seus servos foram certamente informados”. O hebraico combina um infinitivo absoluto com o verbo finito para dar ênfase.'
    reason: Registra a construção enfática הֻגֵּד הֻגַּד e uma alternativa portuguesa possível, sem acrescentar sentido ao texto.
  revision_rationale: A revisão remove o demonstrativo não expresso no original, restaura numa única oração o medo intenso pelas vidas dos gibeonitas e conserva a relação causal «por causa de vocês». Também explicita a fórmula hebraica «responderam ... e disseram» e torna a passiva enfática mais natural em português. «De diante de vocês» mantém o valor de remoção/presença de מִפְּנֵיכֶם sem atenuar o verbo «destruir».
