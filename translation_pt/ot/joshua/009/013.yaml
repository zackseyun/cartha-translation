  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: pt
  text: E estes odres de vinho, que enchemos quando eram novos — vejam, eles se romperam; e estas nossas roupas e nossas sandálias se gastaram por causa da viagem tão longa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: odres de vinho
  rationale: נֹאד designa um recipiente feito de pele, usado aqui para vinho; “odres de vinho” é preciso historicamente e compreensível em português bíblico moderno.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: que enchemos quando eram novos
  rationale: A formulação deixa claro, de modo natural, que חֲדָשִׁים descreve o estado dos odres quando foram enchidos.
- source_word: וְהִנֵּה
  choice: vejam
  rationale: A forma chama a atenção dos ouvintes para a condição dos odres; “vejam” conserva essa força demonstrativa em linguagem atual.
- source_word: הִתְבַּקָּעוּ
  choice: se romperam
  rationale: O verbo indica que os odres se abriram ou partiram; “se romperam” preserva o sentido sem especificar além do texto se apenas racharam ou chegaram a estourar.
- source_word: שַׂלְמוֹתֵינוּ וּנְעָלֵינוּ
  choice: nossas roupas e nossas sandálias
  rationale: שַׂלְמוֹת é um termo amplo para vestes, e נְעָלִים corresponde adequadamente a sandálias no contexto antigo.
- source_word: בָּלוּ
  choice: se gastaram
  rationale: O verbo expressa desgaste e envelhecimento pelo uso; “se gastaram” comunica naturalmente o processo e seu resultado.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: por causa da viagem tão longa
  rationale: A expressão hebraica atribui o desgaste à grande extensão da viagem e o advérbio intensifica essa extensão; “tão longa” comunica ambos de forma idiomática.
