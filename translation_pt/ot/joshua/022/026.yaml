base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: pt
  text: 'Por isso dissemos[a]: “Vamos agora construir para nós o altar[b], não para holocausto nem para sacrifício.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então dissemos” ou “E dissemos”. A conjunção hebraica admite diferentes formas naturais de ligação com o versículo anterior.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “façamos para nós, para construir o altar”, expressão idiomática com o sentido de “vamos construir para nós o altar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Por isso dissemos
  rationale: O wayyiqtol de אמר introduz a conclusão prática do raciocínio exposto no versículo anterior. “Por isso” expressa naturalmente em português essa ligação consequencial, sem excluir traduções mais simplesmente narrativas.
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: Vamos agora construir para nós
  rationale: A combinação do coortativo de עשה com o infinitivo de בנה exprime proposta ou resolução coletiva. “Vamos... construir” reproduz essa força de modo idiomático; “agora” representa נָּא como partícula de estímulo, e “para nós” conserva o valor benefactivo de לָנוּ.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: o altar
  rationale: O artigo definido hebraico aponta para o altar específico em discussão; por isso, mantém-se “o altar”, e não “um altar”.
- source_word: לֹא לְעוֹלָה
  choice: não para holocausto
  rationale: “Holocausto” é o termo bíblico português corrente para עֹלָה, a oferta inteiramente queimada, e a preposição indica a finalidade que o altar não teria.
- source_word: וְלֹא לְזָבַח
  choice: nem para sacrifício
  rationale: זֶבַח designa aqui uma categoria sacrificial distinta do holocausto. “Sacrifício” preserva sua abrangência, enquanto “nem” forma em português a coordenação negativa natural após “não”.
theological_decisions:
- issue: Finalidade do altar
  choice: não para holocausto nem para sacrifício
  alternative: não para oferecer holocaustos nem sacrifícios
  rationale: A formulação nominal acompanha de perto o hebraico e mantém o foco na finalidade negada, sem acrescentar explicitamente um verbo de oferta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Vamos... construir” comunica a resolução coletiva sem rigidez literal; “holocausto” mantém a terminologia sacrificial bíblica tradicional.
