source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: pt
  text: '“O Poderoso[a], Deus, Yahweh! O Poderoso, Deus, Yahweh! Ele sabe, e o próprio Israel saberá: se foi por rebeldia ou por infidelidade contra Yahweh[b], não nos salves neste dia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico repete duas vezes a invocação divina: “El, Deus, Yahweh; El, Deus, Yahweh”, numa fórmula solene e enfática, semelhante a um juramento.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “por quebra de fidelidade” ou “por traição da confiança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: O Poderoso, Deus, Yahweh
  rationale: Mantém אֵל como título singular com sentido de poder, distingue-o de אֱלֹהִים e preserva diretamente o nome divino יְהוָה. A sequência completa é repetida para conservar a ênfase solene do hebraico.
- source_word: הוּא יֹדֵעַ
  choice: Ele sabe
  rationale: Expressa de modo direto e natural o conhecimento presente atribuído a Deus.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: e o próprio Israel saberá
  rationale: O pronome הוּא tem força enfática, representada por “o próprio Israel”; o imperfeito aponta naturalmente para o reconhecimento futuro.
- source_word: אִם בְּמֶרֶד
  choice: se agimos por rebeldia
  rationale: מֶרֶד designa rebelião ou revolta. O verbo “agimos” é suprido a partir do contexto para tornar inteligível em português a construção elíptica hebraica sem especificar uma ação além do texto.
- source_word: וְאִם בְּמַעַל
  choice: ou por infidelidade
  rationale: מַעַל indica infidelidade, traição da confiança ou violação de compromisso, frequentemente com dimensão pactual. “Infidelidade” é natural e preserva essa amplitude.
- source_word: בַּיהוָה
  choice: contra Yahweh
  rationale: 'No contexto de rebeldia e infidelidade, a preposição tem sentido adversativo ou relacional: a ofensa é cometida contra Yahweh.'
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: que ele não nos salve
  rationale: A negativa com forma jussiva constitui uma solene autoimprecação. A terceira pessoa evita a mudança não marcada para discurso direto dirigido a Deus e concorda com o antecedente “Ele”.
- source_word: הַיּוֹם הַזֶּה
  choice: hoje
  rationale: Equivalente corrente e exato da expressão temporal, mantendo clareza em português moderno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: Translitera o nome da aliança presente no texto, em vez de substituí-lo por um título.
- issue: Força da repetição dos títulos divinos
  choice: Repetir integralmente “O Poderoso, Deus, Yahweh”
  alternative: Condensar a sequência em uma única invocação
  rationale: A duplicação hebraica produz uma invocação enfática, semelhante a uma fórmula solene de juramento; preservá-la mantém seu peso retórico sem definir além do texto a relação sintática exata entre os títulos.
- issue: Pessoa gramatical da autoimprecação final
  choice: que ele não nos salve
  alternative: não nos salves; não nos salve
  rationale: O hebraico pode soar como apelo solene diante de Deus, mas o verbo está morfologicamente na terceira pessoa. A tradução conserva essa forma e a tensão retórica, sem converter silenciosamente a frase em segunda pessoa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição e a autoimprecação conservam a solenidade do original; “O Poderoso” evita fundir אֵל com אֱלֹהִים.
