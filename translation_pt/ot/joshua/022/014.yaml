  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: pt
  text: Com ele estavam dez líderes, um líder de cada casa ancestral, de todas as tribos de Israel; cada um deles era chefe de sua casa ancestral entre os milhares de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “milhares de Israel”. Aqui, “milhares” pode designar divisões de clãs ou agrupamentos familiares maiores em Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: líderes / líder
  rationale: O termo designa uma pessoa elevada a uma posição oficial de chefia. “Líder” é atual e claro, sem o sentido monárquico que “príncipe” poderia sugerir.
- source_word: עִמּוֹ
  choice: com ele
  rationale: Reproduz diretamente a preposição com o sufixo pronominal, cujo referente no contexto anterior é Fineias.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: um líder de cada
  rationale: A repetição tem valor distributivo; a formulação portuguesa transmite naturalmente que havia um representante de cada unidade ancestral.
- source_word: לְבֵית אָב
  choice: de cada casa ancestral
  rationale: “Casa ancestral” expressa a unidade de parentesco e administração indicada por בֵּית אָב, com mais naturalidade do que o literal “casa de pai”.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: de todas as tribos de Israel
  rationale: A construção identifica a procedência ou representação tribal dos líderes; “de” comunica isso de modo idiomático.
- source_word: וְאִישׁ
  choice: cada um deles
  rationale: אִישׁ tem aqui função distributiva em referência aos dez representantes; a expressão preserva esse sentido em português natural.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: chefe de sua casa ancestral
  rationale: “Chefe” traduz o papel de רֹאשׁ, enquanto “casa ancestral” mantém o caráter familiar e administrativo da expressão.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: entre os milhares de Israel
  rationale: A tradução mantém a imagem e a ambiguidade lexical de אֶלֶף no texto principal. Nesse contexto, o termo pode indicar agrupamentos sociais ou militares, possibilidade esclarecida em nota sem substituir silenciosamente a forma hebraica.
