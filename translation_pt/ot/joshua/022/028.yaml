revisions:
- from: 'Por isso dissemos: “Se, no futuro, disserem isso a nós ou às nossas gerações, responderemos: ‘Vejam a réplica[a] do altar de Yahweh que nossos pais fizeram, não para holocausto nem para sacrifício, mas como testemunho entre nós e vocês’”.'
  to: 'Então dissemos: “Se um dia disserem a nós ou às nossas gerações, responderemos: ‘Vejam a réplica[a] do altar de Yahweh que nossos pais fizeram, não para holocausto nem para sacrifício, mas ele é testemunho entre nós e vocês.’”'
  rationale: 'A revisão elimina o acréscimo de “isso”, evita reforçar a causalidade de forma desnecessária e restaura a oração predicativa final: o altar “é testemunho”. Mantêm-se a dupla negação hebraica em formulação portuguesa idiomática, o plural “vocês”, o nome Yahweh e a nota lexical sobre תבנית.'
