  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: pt
  text: 'Então dissemos: “Se um dia disserem a nós ou às nossas gerações, responderemos: ‘Vejam a réplica[a] do altar de Yahweh que nossos pais fizeram, não para holocausto nem para sacrifício, mas ele é testemunho entre nós e vocês.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “modelo”, “forma” ou “representação”. O termo hebraico indica uma forma ou representação; neste contexto, a réplica do altar serve de testemunho, e não de altar destinado a holocaustos ou sacrifícios.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Por isso dissemos
  rationale: O waw consecutivo dá continuidade à narrativa e, no contexto, introduz a explicação do propósito do altar; ‘Por isso’ expressa essa relação de modo natural.
- source_word: וְהָיָה כִּי
  choice: Se
  rationale: A expressão introduz uma situação futura possível; a condicional portuguesa comunica isso sem reproduzir mecanicamente o idioma hebraico.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: no futuro, disserem isso a nós ou às nossas gerações
  rationale: מָחָר tem aqui sentido idiomático de tempo futuro, não de ‘amanhã’ literal. ‘Gerações’ preserva דֹּרֹתֵינוּ, e ‘isso’ torna natural o verbo dizer sem especificar além do contexto.
- source_word: וְאָמַרְנוּ
  choice: responderemos
  rationale: Na situação condicional, o verbo introduz a resposta que será dada; ‘responderemos’ explicita naturalmente essa função.
- source_word: רְאוּ
  choice: Vejam
  rationale: Imperativo plural corrente, claro e fiel ao chamado para observar.
- source_word: תַּבְנִית
  choice: réplica
  rationale: O termo denota forma, modelo ou representação. Neste contexto, ‘réplica’ comunica com clareza que o altar reproduzia a forma de outro e servia como testemunho, sem ser o altar sacrificial autorizado.
- source_word: מִזְבַּח יְהוָה
  choice: altar de Yahweh
  rationale: A construção nominal é vertida diretamente, e o nome divino é transliterado.
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: que nossos pais fizeram
  rationale: Mantém o masculino plural concreto do hebraico אֲבוֹתֵינוּ, sem neutralizá-lo como ‘antepassados’.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: não para holocausto nem para sacrifício
  rationale: ‘Holocausto’ é o termo bíblico português estabelecido para עֹלָה. A construção ‘não... nem...’ preserva naturalmente a dupla negação hebraica.
- source_word: כִּי עֵד הוּא
  choice: mas como testemunho
  rationale: כִּי contrasta o propósito real do altar com os usos negados. ‘Como testemunho’ é natural em português e preserva sua função testemunhal, embora a formulação hebraica seja literalmente ‘pois testemunho ele [é]’.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: entre nós e vocês
  rationale: Expressa diretamente a relação entre os dois grupos e torna explícito o plural de בֵּינֵיכֶם em português de leitura brasileira.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto hebraico traz o Tetragrama como nome próprio. ‘Yahweh’ o preserva por transliteração, sem substituí-lo por um título.
- issue: Termo masculino de parentesco אֲבוֹתֵינוּ
  choice: nossos pais
  alternative: nossos antepassados
  rationale: A escolha conserva a forma masculina específica do texto hebraico, embora ‘antepassados’ fosse uma alternativa idiomática mais abrangente.
- issue: Função do altar
  choice: como testemunho
  alternative: mas ele é testemunha
  rationale: O contexto distingue este altar de um altar para ofertas e sacrifícios. A tradução não o torna objeto de culto, mas conserva sua função declarada de testemunho entre os grupos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega ‘vocês’ para marcar naturalmente o destinatário plural e mantém ‘Yahweh’ e ‘nossos pais’ em correspondência direta com o hebraico.
