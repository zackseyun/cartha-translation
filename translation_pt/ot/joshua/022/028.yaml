  naturalness: O português é claro e moderno. “Então dissemos” é mais sóbrio e menos interpretativo do que “Por isso dissemos”; “Se um dia disserem” transmite naturalmente a construção de contingência futura. A formulação revista preserva a dignidade do registro sem perder legibilidade brasileira.
  terminology: “Yahweh”, “altar”, “holocausto”, “sacrifício”, “nossos pais” e “testemunho” são adequados. “Réplica” é uma opção contextual válida para תבנית, desde que a nota mantenha as alternativas e não apresente como certeza absoluta detalhes que o termo por si só não determina.
