    rationale: O hebraico diz simplesmente que poderão “dizer a nós ou às nossas gerações” no futuro; o contexto permite inferir o assunto, mas não exige um pronome objeto.
  - severity: medium
    issue: “mas como testemunho” transforma uma afirmação predicativa em expressão de finalidade/função.
    rationale: כִּי עֵד הוּא significa literalmente algo como “pois ele é testemunho”. A tradução deve preferencialmente conservar a afirmação de que o objeto é testemunho, ainda que o contraste contextual seja expresso por “mas”.
  - severity: low
    issue: “Por isso” torna explícita uma relação causal que o waw narrativo não exige.
    rationale: “Então” mantém a progressão discursiva e a explicação contextual sem reforçar indevidamente a causalidade.
