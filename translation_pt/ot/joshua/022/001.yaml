lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marcador temporal que introduz o acontecimento seguinte e preserva com naturalidade o fluxo narrativo.
- source_word: יִקְרָא
  choice: chamou
  rationale: O verbo qal expressa chamar alguém para junto de si; “chamou” é direto e não acrescenta a força institucional que “convocou” poderia sugerir.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: לָרֽאוּבֵנִי
  choice: os rubenitas
  rationale: O gentílico singular hebraico tem sentido coletivo e designa aqui o grupo tribal.
- source_word: וְלַגָּדִי
  choice: os gaditas
  rationale: Assim como o gentílico anterior, o singular hebraico funciona coletivamente.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: a meia tribo de Manassés
  rationale: מַטֶּה designa aqui a tribo, e “meia tribo” é a expressão portuguesa consagrada e natural para essa divisão tribal.
