  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: pt
  text: Os filhos de Rúben e os filhos de Gade deram ao altar o nome de Testemunha[a], pois ele é testemunha entre nós de que Yahweh é Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais ampla: “deram ao altar o nome de ‘Uma Testemunha Entre Nós de que Yahweh É Deus’”, entendendo a oração explicativa como parte do nome, e não como a razão dele.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: deram ... o nome de
  rationale: No padrão קרא com ל, o verbo tem aqui sentido de nomear. A formulação portuguesa torna explícita essa função e soa natural.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: os filhos de Rúben e os filhos de Gade
  rationale: Preserva de modo transparente a construção hebraica e a referência aos descendentes das duas tribos.
- source_word: לַמִּזְבֵּחַ
  choice: ao altar
  rationale: מִזְבֵּחַ é o termo comum para altar e, com a construção verbal adotada, recebe naturalmente a preposição «a».
- source_word: עֵד
  choice: Testemunha
  rationale: O substantivo significa «testemunha» ou «testemunho». A inicial maiúscula indica sua função como nome do altar, sem recorrer à transliteração obscura «Ede».
- source_word: כִּי
  choice: pois
  rationale: O primeiro כִּי introduz naturalmente a explicação ou razão do nome.
- source_word: הוּא
  choice: ele
  rationale: O pronome retoma «altar», substantivo masculino em português.
- source_word: בֵּינֹתֵינוּ
  choice: entre nós
  rationale: Expressa a relação entre os grupos representados pelas tribos e corresponde diretamente ao hebraico.
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: de que Yahweh é Deus
  rationale: O segundo כִּי introduz o conteúdo do testemunho. A construção «testemunha de que» é idiomática em português e preserva a força confessional da frase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Se a oração explicativa deve ser incorporada ao nome formal do altar
  choice: Manter apenas «Testemunha» como nome no texto principal
  alternative: «Uma Testemunha Entre Nós de que Yahweh É Deus» como nome completo do altar
  rationale: O texto massorético permite entender a oração seguinte como explicação do nome, sem exigir que toda ela faça parte do nome formal. A possibilidade de leitura ampliada é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Gade» segue a forma bíblica portuguesa corrente; «deram ao altar o nome de» evita a possível rigidez de «chamaram o altar» e explicita naturalmente o ato de nomear.
