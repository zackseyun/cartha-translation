id: JOS.22.19
reference: Joshua 22:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: pt
  text: Mas, se a terra que vocês possuem é impura[a], passem para a terra que pertence a Yahweh, onde habita o tabernáculo de Yahweh[b], e estabeleçam-se entre nós[c]. Apenas não se rebelem contra Yahweh nem contra nós, construindo para vocês um altar além do altar de Yahweh, nosso Deus[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra da herança de vocês”. O termo hebraico pode indicar uma propriedade hereditária.
    reason: lexical_alternative
  - marker: b
    text: Ou “onde está o tabernáculo de Yahweh”.
    reason: lexical_alternative
  - marker: c
    text: Ou “tomem posse entre nós”. O verbo hebraico pode indicar adquirir uma propriedade ou estabelecer-se num território.
    reason: lexical_alternative
  - marker: d
    text: Ou “à parte do” ou “em acréscimo ao altar de Yahweh, nosso Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Mas
  rationale: Introduz uma ressalva enfática e adversativa de maneira natural em português.
- source_word: טְמֵאָה
  choice: impura
  rationale: Preserva a possível conotação ritual ou cultual sem definir a natureza exata da impureza.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: a terra que vocês possuem
  rationale: Expressa אֲחֻזָּה como posse territorial e mantém linguagem acessível; a nota registra a possível nuance hereditária.
- source_word: עִבְרוּ לָכֶם
  choice: passem
  rationale: O contexto indica a travessia para o outro lado, provavelmente do Jordão; o dativo benefactivo não precisa ser reproduzido de modo artificial em português.
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: para a terra que pertence a Yahweh
  rationale: Mantém o contraste entre a posse das tribos e a posse de Yahweh, com formulação natural.
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: onde habita o tabernáculo de Yahweh
  rationale: Conserva a personificação e a repetição da raiz hebraica ligada a habitar/tabernáculo.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: e estabeleçam-se entre nós
  rationale: Comunica naturalmente a obtenção de uma propriedade e a fixação no território entre as demais tribos.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: Apenas não se rebelem contra Yahweh nem contra nós
  rationale: Reproduz as duas proibições paralelas sem repetição desnecessária do verbo em português.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: construindo para vocês um altar
  rationale: O infinitivo com בְּ indica o meio ou a circunstância em que a rebelião ocorreria.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: além do altar de Yahweh, nosso Deus
  rationale: Preserva a possibilidade de um altar adicional ou rival sem especificar além do que diz o texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Natureza da impureza da terra a leste do Jordão
  choice: impura
  alternative: contaminada; ritualmente impura; inadequada por estar fora da terra do santuário central
  rationale: O hebraico não explica se a impureza é cultual, geográfica ou retórica; a tradução mantém essa ambiguidade.
- issue: Natureza do altar adicional
  choice: um altar além do altar de Yahweh
  alternative: qualquer segundo altar seria proibido; somente um altar sacrificial rival estaria em vista
  rationale: A formulação conserva a advertência contra um altar adicional ou concorrente sem impor uma teoria mais ampla sobre centralização do culto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e preserva “Yahweh” como nome divino. As notas registram ambiguidades lexicais reais sem sobrecarregar o texto principal.
