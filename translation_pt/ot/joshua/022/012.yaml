base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: pt
  text: Quando os filhos de Israel ouviram isso, toda a comunidade dos filhos de Israel se reuniu em Siló para subir contra eles em guerra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, para empreender uma ação militar contra eles.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ouviram isso
  rationale: O qal wayyiqtol de שׁמע indica a sequência narrativa, “ouviram”. O objeto implícito retoma a notícia dos versículos anteriores; “isso” torna a frase natural em português sem acrescentar conteúdo específico.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica literal e sua forma tradicional, em vez de substituí-la por “os israelitas”; a repetição no versículo também é mantida.
- source_word: וַיִּקָּהֲלוּ
  choice: se reuniu
  rationale: O verbo קהל significa reunir-se ou congregar-se. O singular concorda naturalmente com o núcleo coletivo “toda a comunidade” em português.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: toda a comunidade dos filhos de Israel
  rationale: עֵדָה designa a comunidade congregada. “Comunidade” é corrente, digna e comunica o sentido corporativo sem sugerir apenas uma reunião momentânea.
- source_word: שִׁלֹה
  choice: Siló
  rationale: Forma portuguesa estabelecida do topônimo hebraico.
- source_word: לַעֲלוֹת עֲלֵיהֶם
  choice: para subir contra eles
  rationale: Mantém o sentido básico de עלה, “subir”, e a força hostil de עֲלֵיהֶם, “contra eles”, preservando o idioma militar hebraico.
- source_word: לַצָּבָא
  choice: em guerra
  rationale: צָבָא aqui se refere à ação militar ou guerra. A expressão “subir contra eles em guerra” conserva de perto a construção hebraica e é compreensível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva “filhos de Israel” e o idioma militar “subir contra eles”, esclarecido em nota. O pronome “isso” explicita apenas o objeto contextual de “ouviram”.
