  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: pt
  text: se construímos para nós um altar para nos afastarmos de seguir Yahweh, ou se oferecemos sobre ele holocausto e oferta de cereal, ou se oferecemos sobre ele sacrifícios de comunhão[a], que o próprio Yahweh nos peça contas disso!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacrifícios de paz” ou “ofertas pacíficas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: se construímos para nós um altar
  rationale: O infinitivo com לְ, no contexto do juramento iniciado no versículo anterior, tem valor condicional. A forma finita em português expressa essa função com naturalidade, e “para nós” preserva לָנוּ.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: a fim de nos afastarmos de seguir Yahweh
  rationale: A construção שׁוּב מֵאַחֲרֵי indica deixar de seguir alguém, com sentido de apostasia. A formulação preserva tanto o afastamento quanto a imagem de seguir.
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: para oferecermos sobre ele holocausto e oferta de cereal
  rationale: העלה, neste contexto sacrificial, significa oferecer; עוֹלָה é o holocausto, e מִנְחָה designa especificamente a oferta de cereal. A conjunção hebraica וּ é mantida como “e”.
- source_word: לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: para sacrificarmos sobre ele ofertas de comunhão
  rationale: עָשָׂה com sacrifícios tem sentido idiomático de realizar ou oferecer o sacrifício. “Sacrificarmos” é natural e preserva זִבְחֵי, enquanto “ofertas de comunhão” comunica uma acepção reconhecida de שְׁלָמִים.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: que o próprio Yahweh nos peça contas disso
  rationale: 'No juramento autoimprecatório, o imperfeito tem força volitiva: os falantes invocam a prestação de contas divina caso sejam culpados. הוּא recebe a ênfase “o próprio”, e o objeto implícito é explicitado com moderação como “nos... disso”.'
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio e segue a orientação fornecida, sem substituí-lo por um título.
- issue: Força da oração final no contexto de juramento
  choice: que o próprio Yahweh nos peça contas disso!
  alternative: o próprio Yahweh pedirá contas disso
  rationale: O contexto é de autoimprecação, não apenas de previsão. A construção com “que” preserva a força volitiva sem convertê-la em simples futuro.
- issue: Sentido de זִבְחֵי שְׁלָמִים
  choice: ofertas de comunhão
  alternative: ofertas pacíficas; sacrifícios de paz
  rationale: O termo pode destacar paz, bem-estar ou comunhão sacrificial. A escolha mantém o caráter cultual e deixa em nota uma alternativa tradicional, sem impor uma interpretação teológica exclusiva.
translation_notes:
  register: Português atual, digno e acessível, com boa legibilidade brasileira. A estrutura condicional e autoimprecatória foi preservada. Empregou-se “holocausto” no sentido sacrificial bíblico tradicional, e evitou-se a formulação pouco natural “fazer sacrifícios”.
