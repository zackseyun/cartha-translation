  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: pt
  text: E o assunto pareceu bom aos olhos dos filhos de Israel[a], e os filhos de Israel bendisseram a Deus[b]. E não falaram em subir contra eles para a guerra[c], a fim de destruir a terra em que habitavam os filhos de Rúben e os filhos de Gade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. Em hebraico, literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “louvaram a Deus”. O verbo hebraico significa literalmente “bendizer”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não disseram para subir contra eles para a guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: o assunto pareceu bom aos olhos
  rationale: Preserva a expressão avaliativa hebraica e traduz דָּבָר de modo amplo, sem limitá-lo apenas às palavras ou ao relato anterior.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Reproduz diretamente a expressão hebraica e mantém a referência coletiva masculina do texto.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: bendisseram a Deus
  rationale: Mantém o sentido lexical direto de ברך tendo Deus como objeto; no contexto, significa falar bem de Deus ou louvá-lo.
- source_word: וְלֹא אָמְרוּ
  choice: não falaram mais em
  rationale: Em português, esta formulação comunica naturalmente que desistiram de propor ou cogitar a ação militar; “mais” decorre do contexto narrativo, no qual a guerra já havia sido considerada.
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: marchar contra eles para a guerra
  rationale: Conserva tanto a imagem de subir ou avançar contra alguém quanto o sentido militar explícito de צָבָא.
- source_word: לְשַׁחֵת
  choice: destruir
  rationale: Expressa de maneira direta a finalidade devastadora da campanha militar cogitada.
- source_word: הָאָרֶץ
  choice: a terra
  rationale: Mantém o termo territorial comum em Josué, sem estreitá-lo para “país” ou “região”.
- source_word: יֹשְׁבִים בָּהּ
  choice: habitavam
  rationale: Traduz naturalmente o particípio de ישב como residência contínua no território.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação preserva os principais idiomatismos hebraicos sem soar excessivamente arcaica. “Bendisseram” foi preferido a “abençoaram” para evitar a possível impressão, em português corrente, de que os israelitas conferiram uma bênção a Deus.
