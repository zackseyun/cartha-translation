  naturalness: O registro é moderno, claro e digno. «Bendisseram a Deus» é uma solução natural e semanticamente precisa neste contexto. «Falaram em subir contra eles» conserva a imagem verbal hebraica e permanece compreensível em português.
  terminology: «Assunto», «filhos de Israel», «bendisseram», «terra» e «habitavam» correspondem bem aos termos hebraicos e ao uso narrativo de Josué. A nota sobre «israelitas» é útil; também é apropriada uma nota para a construção literal ligada a «subir ... para a guerra».
