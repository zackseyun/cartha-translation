  text: וְ/לַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה נָתַ֣ן מֹשֶׁה֮ בַּ/בָּשָׁן֒ וּ/לְ/חֶצְי֗/וֹ נָתַ֤ן יְהוֹשֻׁ֨עַ֙ עִם אֲחֵי/הֶ֔ם מ/עבר הַ/יַּרְדֵּ֖ן יָ֑מָּ/ה וְ֠/גַם כִּ֣י שִׁלְּחָ֧/ם יְהוֹשֻׁ֛עַ אֶל אָהֳלֵי/הֶ֖ם וַ/יְבָרֲכֵֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: pt
  text: A uma metade da tribo de Manassés, Moisés tinha dado terras em Basã; à outra metade, Josué deu terras junto com seus irmãos[a], no lado oeste do Jordão. E, quando Josué os mandou para suas tendas, ele os abençoou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seus irmãos”. A expressão se refere aos demais israelitas das outras tribos.'
    reason: Esclarece o referente coletivo do termo de parentesco sem neutralizá-lo no texto principal.
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: A uma metade da tribo de Manassés
  rationale: Expressa uma das duas divisões da tribo e prepara com clareza o contraste com “à outra metade”, sem acrescentar um marcador temporal ausente no hebraico.
- source_word: נָתַן מֹשֶׁה
  choice: Moisés tinha dado
  rationale: O mais-que-perfeito composto torna natural em português a anterioridade da concessão feita por Moisés em relação à de Josué.
- source_word: בַּבָּשָׁן
  choice: em Basã
  rationale: Forma portuguesa corrente do nome da região, sem artigo.
- source_word: וּלְחֶצְיוֹ
  choice: à outra metade
  rationale: O sufixo retoma a tribo de Manassés; “outra” explicita o contraste inerente entre suas duas metades.
- source_word: נָתַן יְהוֹשֻׁעַ
  choice: Josué deu terras
  rationale: “Terras” é o objeto elíptico recuperado do contexto de distribuição territorial e evita uma construção truncada em português.
- source_word: עִם אֲחֵיהֶם
  choice: junto com seus irmãos
  rationale: Preserva o termo concreto “irmãos” e indica que a concessão ocorreu juntamente com a dos demais israelitas.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: no lado oeste do Jordão
  rationale: Comunica de modo claro a localização indicada por יָמָּה, literalmente na direção do mar, isto é, a oeste, sem depender do ponto de vista narrativo potencialmente ambíguo de “do outro lado”.
- source_word: וְגַם כִּי
  choice: Quando
  rationale: Introduz naturalmente a ação temporal adicional; a ligação narrativa já é perceptível sem uma reprodução pesada de todos os conectivos.
- source_word: שִׁלְּחָם
  choice: os mandou de volta
  rationale: O piel de שלח indica que Josué os despediu para partirem; “de volta” é natural diante do destino expresso, as tendas deles.
- source_word: אֶל אָהֳלֵיהֶם
  choice: para as suas tendas
  rationale: Mantém a imagem concreta do hebraico em vez de substituí-la por “casas” ou “lares”.
- source_word: וַיְבָרֲכֵם
  choice: ele os abençoou
  rationale: Equivalente direto e corrente do verbo ברך neste contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação destaca o paralelismo entre as duas metades da tribo. O marcador da nota foi colocado após “irmãos”, expressão efetivamente explicada pela nota.
