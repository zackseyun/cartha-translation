  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: pt
  text: Quando chegaram às regiões do Jordão[a], na terra de Canaã, os filhos de Rúben, os filhos de Gade e a meia tribo de Manassés construíram ali, junto ao Jordão, um altar — um altar grande, que se destacava à vista.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “distritos” ou “limites” do Jordão.
    reason: Alternativa lexical para גְּלִילוֹת, termo geográfico que pode designar regiões, distritos ou limites.
  - marker: b
    text: Ou “um altar grande de se ver”, isto é, um altar notável por sua aparência.
    reason: Alternativa lexical para גָּדוֹל לְמַרְאֶה; a expressão descreve o altar como grande e visualmente notável.
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: região
  rationale: O substantivo indica uma área ou distrito circundante. “Região” é claro e natural em português, sem impor o sentido menos seguro de “fronteiras”.
- source_word: וַיָּבֹאוּ אֶל
  choice: Quando chegaram a
  rationale: A forma narrativa faz avançar o relato; no contexto, a oração temporal liga naturalmente a chegada à construção do altar.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: que fica na terra de Canaã
  rationale: Mantém a oração relativa hebraica e sua especificação geográfica explícita em português natural.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: os filhos de Rúben, os filhos de Gade
  rationale: Preserva a expressão familiar e tribal do hebraico, com repetição correspondente à do texto-fonte.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: a meia tribo de Manassés
  rationale: Equivalente tradicional, conciso e claro para a construção hebraica.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: É o equivalente português normal para a estrutura cultual designada pelo termo hebraico.
- source_word: עַל הַיַּרְדֵּן
  choice: junto ao Jordão
  rationale: Neste contexto geográfico, a preposição expressa proximidade. “Junto ao” evita sugerir que o altar foi construído literalmente sobre o rio.
- source_word: גָּדוֹל לְמַרְאֶה
  choice: grande à vista
  rationale: Conserva tanto a ideia de grandeza quanto a referência ao aspecto visível, sem decidir se o destaque recai exclusivamente no tamanho físico ou na aparência notável.
theological_decisions:
- issue: Possível implicação de um altar cultual rival
  choice: Relatar de modo descritivo que construíram um altar grande à vista
  alternative: Dizer que construíram um altar rival, imponente ou destinado a sacrifícios
  rationale: O versículo relata a construção e a aparência notável do altar, mas ainda não declara sua finalidade nem julga a motivação dos construtores. A tradução preserva essa tensão narrativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura mantém a explicação geográfica, os nomes tribais e a repetição enfática de “altar”, sem antecipar o juízo narrativo sobre sua finalidade.
