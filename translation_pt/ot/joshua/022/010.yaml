revisions:
- from: Quando chegaram à região do Jordão[a], que fica na terra de Canaã, os filhos de Rúben, os filhos de Gade e a meia tribo de Manassés construíram ali, junto ao Jordão, um altar — um altar grande à vista.[b]
  to: Quando chegaram às regiões do Jordão[a], na terra de Canaã, os filhos de Rúben, os filhos de Gade e a meia tribo de Manassés construíram ali, junto ao Jordão, um altar — um altar grande, que se destacava à vista.[b]
  rationale: A revisão preserva o sentido e a ambiguidade narrativa do hebraico, ajustando o plural de גְּלִילוֹת e substituindo uma construção pouco natural por uma formulação portuguesa clara para a qualidade visual expressa por גָּדוֹל לְמַרְאֶה. Não se acrescenta qualquer avaliação sobre um possível culto rival ou sobre a intenção dos construtores.
