  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: pt
  text: 'Não; fizemos isto por receio de que, no futuro, os filhos de vocês digam aos nossos filhos: “Que relação vocês têm com o SENHOR, o Deus de Israel?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם־לֹא
  choice: Não!
  rationale: No contexto da declaração solene iniciada no versículo anterior, a expressão funciona como negação enfática da acusação, não como uma condição comum.
- source_word: מִדְּאָגָה מִדָּבָר
  choice: por causa da preocupação de que
  rationale: A construção expressa inquietação ou receio diante de uma possível situação futura; esta formulação comunica naturalmente a relação com a oração seguinte.
- source_word: מָחָר
  choice: no futuro
  rationale: Embora signifique literalmente “amanhã”, aqui se refere idiomaticamente a um tempo posterior ou a gerações futuras.
- source_word: מַה־לָּכֶם וְלַיהוָה
  choice: Que relação vocês têm com o SENHOR
  rationale: O idiomatismo hebraico pergunta que vínculo, participação ou interesse comum existe entre as partes; “que relação” preserva o sentido sem impor uma interpretação mais específica.
- source_word: יהוה
  choice: SENHOR
  rationale: Segue a convenção portuguesa tradicional de representar o nome divino pelo título em versaletes, aqui indicado por maiúsculas.
theological_decisions:
- issue: Natureza do temor das tribos orientais
  choice: preocupação de que os descendentes ocidentais negassem a relação dos orientais com o SENHOR
  alternative: ansiedade genérica ou preocupação por algum assunto indefinido
  rationale: A continuação da frase explicita o conteúdo da preocupação, sem exigir uma caracterização psicológica além do que o hebraico afirma.
- issue: Sentido da pergunta מַה־לָּכֶם וְלַיהוָה
  choice: pergunta sobre a relação com o SENHOR
  alternative: afirmação de que não possuem parte, direito ou comunhão com o SENHOR
  rationale: A tradução mantém aberta a abrangência do idiomatismo, cuja implicação mais concreta é desenvolvida no contexto seguinte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A sintaxe foi levemente reorganizada para expressar de modo natural que a fala futura constitui o conteúdo da preocupação. Mantiveram-se as vozes geracionais e a pergunta retórica.
