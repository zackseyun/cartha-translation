base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: pt
  text: 'Então os filhos de Rúben, os filhos de Gade e a meia tribo de Manassés responderam e disseram aos chefes dos clãs[a] de Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “aos chefes dos milhares de Israel”, provavelmente uma referência aos líderes de clãs ou de divisões tribais.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: responderam
  rationale: No qal narrativo, ענה introduz uma resposta ao discurso anterior; “responderam” preserva essa ligação.
- source_word: בְּנֵי רְאוּבֵן
  choice: os filhos de Rúben
  rationale: Mantém de forma clara a expressão genealógica literal do hebraico, em vez de substituí-la por “os rubenitas”.
- source_word: וּבְנֵי גָד
  choice: os filhos de Gade
  rationale: Preserva a formulação familiar do hebraico e mantém o paralelismo com “os filhos de Rúben”.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: a meia tribo de Manassés
  rationale: Tradução natural e próxima da construção hebraica, indicando a metade da tribo estabelecida a leste do Jordão.
- source_word: וַיְדַבְּרוּ
  choice: e disseram
  rationale: Representa o segundo verbo de fala sem produzir a formulação pouco natural “responderam e falaram aos”; “responderam e disseram” conserva a sequência enfática do hebraico.
- source_word: אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: aos chefes dos clãs de Israel
  rationale: רָאשֵׁי designa os chefes, enquanto אַלְפֵי, literalmente “milhares”, pode indicar agrupamentos sociais, tribais ou militares. “Clãs” comunica sua provável função administrativa no contexto; a tradução literal é registrada em nota.
theological_decisions: []
