  text: וַ/יָּבֹ֜אוּ אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד וַ/יְדַבְּר֥וּ אִתָּ֖/ם לֵ/אמֹֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: pt
  text: 'Eles foram até os descendentes de Rúben, os descendentes de Gade e a meia tribo de Manassés, na terra de Gileade[a], e falaram com eles, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à terra de Gileade”. A preposição hebraica pode indicar direção, embora aqui provavelmente localize onde eles foram encontrar as tribos do leste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: foram até
  rationale: O qal wayyiqtol de בוא indica o deslocamento até o grupo mencionado. “Foram até” é natural em português e deixa claro o destino sem acrescentar a ideia mais específica de chegada consumada.
- source_word: בְּנֵי
  choice: descendentes de
  rationale: Na fórmula tribal, o plural construto de בן designa os membros das tribos. “Descendentes de” comunica esse sentido coletivo com clareza e naturalidade no português atual.
- source_word: חֲצִי שֵׁבֶט
  choice: meia tribo
  rationale: Equivalente corrente e próximo da expressão hebraica usada como designação tribal.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: na terra de Gileade
  rationale: Embora אֶל normalmente indique direção, aqui a expressão pode localizar os grupos e o encontro em sua região. A nota preserva a leitura direcional possível.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: falaram com eles
  rationale: דבר com אֵת admite a ideia de falar com alguém. A tradução preserva a possível reciprocidade sem excluir que se trate de um pronunciamento dirigido a eles.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Mantém a fórmula hebraica que introduz o discurso direto no versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Descendentes” evita que a fórmula tribal seja entendida apenas como filhos imediatos. A construção mantém a continuidade narrativa e termina com dois-pontos para introduzir a fala seguinte.
