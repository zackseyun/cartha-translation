  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: pt
  text: Não foi Acã, filho de Zerá, quem cometeu infidelidade no caso daquilo que havia sido consagrado à destruição, e veio ira sobre toda a comunidade de Israel? E ele não foi o único a perecer por sua iniquidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: cometeu infidelidade
  rationale: A construção intensiva expressa uma grave quebra de lealdade; a formulação preserva o sentido e soa natural em português.
- source_word: בַחֵרֶם
  choice: no caso daquilo que havia sido consagrado à destruição
  rationale: חֵרֶם designa aqui o que foi irrevogavelmente destinado à destruição; a expressão evita reduzir o termo simplesmente a 'coisas condenadas'.
- source_word: קָצֶף
  choice: ira
  rationale: Mantém o sentido de indignação punitiva no contexto do juízo divino.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: comunidade de Israel
  rationale: Representa a coletividade reunida de Israel em linguagem moderna e amplamente compreensível.
- source_word: לֹא גָוַע בַּעֲוֹנוֹ
  choice: não foi o único a morrer por causa da sua iniquidade
  rationale: Traduz idiomaticamente a afirmação de que as consequências mortais da culpa de Acã não recaíram apenas sobre ele, preservando a relação causal sem especificar além do texto quem mais morreu.
theological_decisions:
- issue: Alcance coletivo das consequências do pecado de Acã
  choice: ele não foi o único a morrer por causa da sua iniquidade
  alternative: ele não morreu sozinho em sua iniquidade
  rationale: A opção escolhida comunica com clareza que outros também morreram em decorrência da transgressão, sem resolver a tensão teológica sobre responsabilidade individual e consequências comunitárias.
- issue: Identificação explícita da ira como divina
  choice: a ira
  alternative: a ira de Deus
  rationale: O hebraico não explicita o possuidor nesta frase; mantém-se a referência implícita para não acrescentar ao texto, embora o contexto indique a ira divina.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A pergunta retórica e a tensão entre culpa individual e efeito comunitário foram preservadas.
