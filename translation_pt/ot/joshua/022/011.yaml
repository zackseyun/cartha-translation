  naturalness: O português é moderno, claro e adequado a leitores internacionais, com boa legibilidade brasileira. “Os israelitas ouviram dizer” é uma solução idiomática para a fórmula de relato. “Eis que” é um pouco mais solene, mas é corrente em tradução bíblica e, neste contexto, mais natural e fiel do que “Vejam!”.
  terminology: Rúben, Gade, Manassés, Canaã, Jordão, altar e israelitas estão adequados e consistentes. As notas preservam corretamente a incerteza de גְּלִילוֹת e da expressão final com עֵבֶר.
