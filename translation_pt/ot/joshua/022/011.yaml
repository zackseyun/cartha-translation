  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: pt
  text: 'Os israelitas ouviram dizer[a]: “Eis que os filhos de Rúben, os filhos de Gade e a meia tribo de Manassés construíram o altar diante da terra de Canaã[b], na região do Jordão[c], do lado dos israelitas[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Os israelitas ouviram, dizendo”, em tradução mais literal da fórmula hebraica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “defronte da terra de Canaã” ou “em frente à terra de Canaã”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “nas regiões” ou “nos distritos do Jordão”; a nuance geográfica exata da expressão é incerta.'
    reason: cultural_note
  - marker: d
    text: A expressão hebraica é geograficamente difícil. Também pode ser entendida como “no lado pertencente aos israelitas” ou “no lado oposto aos israelitas”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Os israelitas ouviram dizer
  rationale: Expressa de modo natural em português a fórmula hebraica que introduz o conteúdo de uma notícia, sem tornar לֵאמֹר uma fala separada.
- source_word: הִנֵּה
  choice: Vejam!
  rationale: Mantém a função de chamar a atenção para a notícia, em linguagem atual e adequada a um grupo de ouvintes.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: os filhos de Rúben, os filhos de Gade
  rationale: Preserva aqui a expressão genealógica repetida no hebraico, pertinente à identificação das tribos.
- source_word: בָנוּ
  choice: construíram
  rationale: Representa diretamente a ação concluída do perfeito hebraico; em português, o pretérito perfeito é a forma narrativa natural.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Conserva o artigo definido hebraico e aponta para o altar específico que passa a ser o foco do relato.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: diante da terra de Canaã
  rationale: Comunica a relação espacial de מוּל sem fixar além do necessário se significa exatamente 'em frente a' ou 'defronte de'.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: na região do Jordão
  rationale: גְּלִילוֹת pode designar regiões ou distritos; o singular coletivo produz uma expressão geográfica natural em português.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: do lado dos israelitas
  rationale: Mantém a relação espacial e a dificuldade do hebraico sem decidir se o local pertencia aos israelitas ou ficava diante deles.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas correntes no Brasil. “Israelitas” evita a rigidez de “filhos de Israel” na designação nacional, enquanto “filhos de Rúben/Gade” preserva o caráter genealógico das tribos. As notas mantêm explícita a incerteza das duas expressões geográficas finais.
