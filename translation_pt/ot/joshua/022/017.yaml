reference: Joshua 22:17
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: pt
  text: Acaso foi pouca para nós a iniquidade[a] de Peor[b], da qual não nos purificamos até hoje, e houve uma praga na comunidade de Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “culpa”. O hebraico עָוֹן pode significar “iniquidade”, “culpa” ou, por extensão, a consequência da culpa.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “Peor”. Compare a expressão mais completa “Baal-Peor” em passagens relacionadas.'
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: Acaso foi pouca para nós
  rationale: Preserva a pergunta retórica de repreensão expressa por הַמְעַט לָנוּ. “Acaso” torna a força interrogativa clara, enquanto “foi pouca para nós” mantém de perto a formulação hebraica.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: O termo pode indicar iniquidade, culpa ou até a consequência da culpa. “Iniquidade” preserva o peso moral da transgressão sem eliminar a ambiguidade, registrada em nota.
- source_word: פְּעוֹר
  choice: Peor
  rationale: O texto hebraico traz apenas “Peor”. Não se acrescenta “Baal” ao texto principal, embora a expressão mais completa seja mencionada em nota.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: da qual não nos purificamos
  rationale: O hitpael de טהר tem sentido reflexivo. “Não nos purificamos” comunica a persistente impureza da comunidade e mantém a referência à iniquidade de Peor.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até hoje
  rationale: Equivalente português natural da expressão temporal hebraica, indicando que a condição continuava no momento da fala.
- source_word: וַיְהִי הַנֶּגֶף
  choice: e houve uma praga
  rationale: Traduz diretamente a construção narrativa sem acrescentar um contraste como “contudo” ou “ainda assim”, que não está expresso lexicalmente no hebraico.
- source_word: בַּעֲדַת יְהוָה
  choice: na comunidade de Yahweh
  rationale: עֵדָה designa a comunidade reunida de Israel; “comunidade” é claro e corrente. A preposição ב é representada por “na”, e o nome divino é transliterado como “Yahweh”.
theological_decisions:
- issue: Sentido de עָוֹן no episódio de Peor
  choice: iniquidade
  alternative: culpa; consequência da culpa
  rationale: O contexto envolve tanto a transgressão quanto sua mancha persistente e seu juízo. O texto principal usa “iniquidade”, enquanto a nota conserva a amplitude semântica.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração “Yahweh” representa diretamente o nome pessoal presente no texto hebraico e evita substituí-lo por um título.
- issue: Relação entre a iniquidade e a praga
  choice: coordenação simples com “e”
  alternative: “e ainda assim houve uma praga”
  rationale: O hebraico coordena as orações com וַ. Embora o contexto permita perceber uma força retórica, não se introduz explicitamente um contraste ausente da forma lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém a pergunta retórica e a coordenação do hebraico, sem acrescentar conectivos interpretativos.
