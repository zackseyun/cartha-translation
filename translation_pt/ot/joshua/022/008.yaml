  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: pt
  text: 'E ele lhes disse: “Voltem para as suas tendas com grandes riquezas, com muitos animais de criação, com prata e ouro, com bronze[a] e ferro e com muitíssimas roupas. Repartam o despojo dos seus inimigos com seus irmãos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” se refere aos outros israelitas.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: E ele lhes disse
  rationale: A fórmula hebraica inclui literalmente 'dizendo', mas em português moderno isso seria redundante depois de 'disse'; o conteúdo e a introdução da fala direta são preservados com naturalidade.
- source_word: בִּנְכָסִים רַבִּים
  choice: com muitas riquezas
  rationale: נְכָסִים abrange bens, posses e riqueza; 'muitas riquezas' preserva o plural e introduz naturalmente a enumeração subsequente.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: Voltem para as suas tendas
  rationale: Mantém o sentido concreto e histórico de אָהֳלִים sem substituí-lo interpretativamente por 'casas'.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: com muitíssimos rebanhos
  rationale: מִקְנֶה é coletivo para animais domésticos; 'rebanhos' é corrente e abrangente, enquanto 'muitíssimos' representa רַב מְאֹד.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: com prata e ouro
  rationale: Tradução direta dos dois materiais, adequada à lista de bens valiosos.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: com bronze e ferro
  rationale: נְחֹשֶׁת pode designar cobre ou bronze; 'bronze' é uma tradução convencional e historicamente plausível, com a ambiguidade registrada em nota.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: e com muitíssimas roupas
  rationale: שְׂלָמוֹת designa peças de vestuário; 'roupas' é claro, atual e amplo, e 'muitíssimas' conserva a forte intensificação.
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: Repartam ... o despojo dos seus inimigos
  rationale: O imperativo plural é mantido. 'Despojo' conserva o sentido militar de bens tomados ao inimigo e 'repartam' expressa a distribuição ordenada.
- source_word: עִם אֲחֵיכֶם
  choice: com seus irmãos
  rationale: Preserva o termo masculino de parentesco אָחִים; no contexto, ele designa os demais israelitas ligados a eles como povo.
theological_decisions:
- issue: Alcance do termo de parentesco אֲחֵיכֶם
  choice: com seus irmãos
  alternative: com os outros israelitas
  rationale: A tradução mantém a imagem pactual e familiar do hebraico, sem neutralizar o termo; uma nota esclarece que a referência contextual é aos seus companheiros israelitas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se 'tendas', o termo militar 'despojo' e o parentesco 'irmãos'; omite-se o redundante 'dizendo' da fórmula narrativa hebraica para dar naturalidade à fala direta.
