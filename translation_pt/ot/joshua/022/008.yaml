  - severity: low
    issue: «Muitas riquezas» é menos idiomático em português do que «grandes riquezas».
    rationale: «Grandes riquezas» expressa naturalmente בִּנְכָסִים רַבִּים e conserva a ideia de posses abundantes antes da lista detalhada.
