id: JOS.22.18
reference: Joshua 22:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: pt
  text: E vocês hoje estão se afastando de seguir Yahweh[a]; se hoje se rebelarem contra Yahweh, amanhã ele ficará irado[b] com toda a congregação de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “voltar hoje de após Yahweh”. Nesse idiomatismo hebraico, a expressão significa deixar de segui-lo ou afastar-se dele com deslealdade.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz apenas “ele ficará irado”; pelo contexto, “ele” se refere a Yahweh.
    reason: implicit_subject
lexical_decisions:
- source_word: תָּשֻׁבוּ
  choice: estão deixando
  rationale: Com מֵאַחֲרֵי, o verbo שוב indica afastar-se com deslealdade, isto é, deixar de seguir; a forma progressiva comunica a acusação imediata.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: de seguir a Yahweh
  rationale: Traduz naturalmente o idioma hebraico literal 'de detrás de Yahweh', que aqui significa abandonar o seu seguimento.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal, distinguindo-o do título 'Senhor'.
- source_word: וְהָיָה
  choice: Se
  rationale: Neste encadeamento, a expressão formal 'e acontecerá' introduz a condição que conduz à consequência no dia seguinte; 'Se' é natural e fiel à relação sintática.
- source_word: תִּמְרְדוּ
  choice: vocês se rebelarem
  rationale: מרד denota rebelião contra autoridade legítima e, neste contexto, deslealdade da aliança.
- source_word: בַּיהוָה
  choice: contra Yahweh
  rationale: 'Com מרד, a preposição ב tem sentido adversativo: rebelar-se contra alguém.'
- source_word: וּמָחָר
  choice: amanhã
  rationale: Preserva o marcador temporal e a urgência da consequência anunciada.
- source_word: יִקְצֹף
  choice: ele ficará irado
  rationale: קצף expressa ira intensa; 'ficará irado' mantém a força do termo e deixa o sujeito implícito como no hebraico.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: toda a congregação de Israel
  rationale: עֵדָה designa a coletividade reunida de Israel; 'congregação' preserva seu caráter corporativo e pactual.
theological_decisions:
- issue: Sujeito implícito de יִקְצֹף
  choice: Manter o pronome 'ele', com nota identificando Yahweh pelo contexto
  alternative: 'Explicitar no texto: ''Yahweh ficará irado'''
  rationale: O hebraico não expressa o sujeito, embora o contexto aponte claramente para Yahweh. Manter 'ele' preserva a forma e a pequena medida de implicitude do original, enquanto a nota evita dúvida desnecessária.
- issue: Solidariedade coletiva no juízo
  choice: toda a congregação de Israel
  alternative: somente os rebeldes
  rationale: O texto declara que a ira alcançaria a congregação inteira, preservando a tensão teológica da responsabilidade e das consequências corporativas sem explicá-la ou restringi-la.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e internacionalmente. Usa 'vocês' para o plural de segunda pessoa e mantém 'Yahweh' como nome divino. A coordenação inicial foi preservada, e a segunda oração foi formulada como condição explícita para comunicar naturalmente a relação do hebraico.
