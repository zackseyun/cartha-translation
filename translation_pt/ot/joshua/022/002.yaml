  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: pt
  text: 'E ele lhes disse: “Vocês cumpriram tudo o que Moisés, servo de Yahweh, ordenou a vocês e ouviram a minha voz[a] em tudo o que ordenei a vocês.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obedeceram à minha voz”. A expressão idiomática hebraica “ouvir a voz” muitas vezes inclui a ideia de atender e obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: E ele lhes disse
  rationale: O waw consecutivo dá continuidade à narrativa; a formulação conserva essa ligação e expressa diretamente os destinatários.
- source_word: שְׁמַרְתֶּם
  choice: vocês cumpriram
  rationale: Em contexto de mandamentos, שׁמר significa observar ou cumprir. “Cumpriram” comunica de modo natural a obediência efetiva.
- source_word: כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: tudo o que [...] lhes ordenou
  rationale: Preserva tanto o alcance total de כָּל אֲשֶׁר como a força autoritativa de צוה.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Moisés, servo de Yahweh
  rationale: “Servo” corresponde ao título honorífico de Moisés como alguém comissionado por Deus; Yahweh translitera o nome divino.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: e ouviram a minha voz
  rationale: Mantém a metáfora auditiva do idioma hebraico, que no contexto implica atender e obedecer; a nota explicita essa nuance.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: em tudo o que lhes ordenei
  rationale: Expressa o alcance abrangente das ordens de Josué e mantém a repetição de צוה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em vez de substituí-lo por um título.
- issue: Sentido de עֶבֶד aplicado a Moisés
  choice: servo
  alternative: escravo
  rationale: Aqui עֶבֶד funciona como título honorífico ligado ao serviço e à missão de Moisés perante Yahweh, sem destacar uma condição social de escravidão.
- issue: Força do idioma שׁמע בקול
  choice: ouviram a minha voz
  alternative: obedeceram à minha voz
  rationale: A tradução principal conserva a figura hebraica e sua tensão lexical; a nota registra claramente o sentido contextual de resposta obediente.
translation_notes:
  register: Português moderno, claro e digno, com formas pronominais amplamente compreensíveis. “Vocês” torna explícito o plural hebraico; “lhes” evita regionalismo excessivo. A estrutura paralela dos dois mandamentos foi preservada.
