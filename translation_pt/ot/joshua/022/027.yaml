review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem o contraste inicial, a função do altar como testemunho, as categorias sacrificiais e a expressão aberta “parte no SENHOR”. Contudo, o hebraico afirma no presente “ele/isto é um testemunho”, não “ele servirá de testemunho”. Além disso, o infinitivo לַעֲבֹד expressa finalidade (“para que prestemos”), não uma declaração de conteúdo futuro (“de que prestaremos”).
  naturalness: O registro é claro e solene. A revisão torna a relação sintática mais direta e natural, sem introduzir uma previsão desnecessária. “Nossas gerações futuras” comunica idiomaticamente “nossas gerações depois de nós”.
  terminology: “SENHOR” representa adequadamente יהוה. “Holocaustos”, “sacrifícios” e “ofertas de comunhão” são escolhas compreensíveis e suficientemente precisas. “Parte no SENHOR” preserva a amplitude de חֵלֶק sem interpretação doutrinária adicional.
  issues:
  - severity: medium
    issue: “Ele servirá de testemunho” verte um predicado nominal presente como futuro.
    rationale: הוּא (“ele/isto é”) com עֵד (“testemunho”) declara a função presente do objeto; o futuro acrescenta uma nuance temporal ausente no texto.
  - severity: medium
    issue: “De que prestaremos o culto” não reproduz a finalidade do infinitivo לַעֲבֹד.
    rationale: 'A construção introduz o propósito para o qual o testemunho existe: “para que prestemos”, não o conteúdo de uma afirmação sobre uma ação futura.'
  - severity: low
    issue: “Descendentes depois de nós” reduz “gerações” a uma referência primariamente genealógica.
    rationale: דֹּרוֹתֵינוּ significa “nossas gerações”; “nossas gerações futuras” mantém melhor o alcance temporal e comunitário.
  revised_text: 'Pelo contrário, isto é um testemunho entre nós e vocês, e entre as nossas gerações futuras, para que prestemos o culto ao SENHOR diante dele, com os nossos holocaustos, sacrifícios e ofertas de comunhão, para que, no futuro, os filhos de vocês não digam aos nossos filhos: ‘Vocês não têm parte no SENHOR.’'
  revised_footnotes: []
