  text: כִּי֩ עֵ֨ד ה֜וּא בֵּינֵ֣י/נוּ וּ/בֵינֵי/כֶ֗ם וּ/בֵ֣ין דֹּרוֹתֵי/נוּ֮ אַחֲרֵי/נוּ֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת יְהוָה֙ לְ/פָנָ֔י/ו בְּ/עֹלוֹתֵ֥י/נוּ וּ/בִ/זְבָחֵ֖י/נוּ וּ/בִ/שְׁלָמֵ֑י/נוּ וְ/לֹא יֹאמְר֨וּ בְנֵי/כֶ֤ם מָחָר֙ לְ/בָנֵ֔י/נוּ אֵין לָ/כֶ֥ם חֵ֖לֶק בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: pt
  text: 'Pelo contrário, isto é um testemunho entre nós e vocês, e entre as nossas gerações futuras, para que prestemos o culto ao SENHOR diante dele, com os nossos holocaustos, sacrifícios e ofertas de comunhão, para que, no futuro, os filhos de vocês não digam aos nossos filhos: ‘Vocês não têm parte no SENHOR.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Pelo contrário
  rationale: No contexto, a partícula introduz a correção à finalidade negada no versículo anterior; a tradução explicita esse contraste, como faz a camada inglesa auditada.
- source_word: עֵד
  choice: testemunho
  rationale: Preserva a imagem jurídica e memorial do altar como evidência entre as comunidades.
- source_word: דֹּרוֹתֵינוּ אַחֲרֵינוּ
  choice: os nossos descendentes depois de nós
  rationale: Expressa naturalmente a sucessão de gerações sem perder a referência ao futuro.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: prestaremos o culto ao SENHOR
  rationale: A construção intensiva com verbo e substantivo cognatos refere-se ao serviço cultual; 'prestar o culto' é corrente, claro e digno em português.
- source_word: עֹלוֹתֵינוּ
  choice: nossos holocaustos
  rationale: Termo tradicional e preciso para as ofertas totalmente queimadas.
- source_word: זְבָחֵינוּ
  choice: sacrifícios
  rationale: Equivalente amplo e direto do termo hebraico para animais sacrificados.
- source_word: שְׁלָמֵינוּ
  choice: ofertas de comunhão
  rationale: Comunica o caráter compartilhado e relacional desse tipo de oferta; evita restringir o termo apenas à ideia subjetiva de paz.
- source_word: מָחָר
  choice: no futuro
  rationale: Aqui o sentido idiomático é 'em tempo vindouro', não necessariamente o dia seguinte.
- source_word: חֵלֶק בַּיהוָה
  choice: parte no SENHOR
  rationale: Mantém a expressão relacional e teológica do hebraico sem explicar em excesso se se trata de herança, culto ou pertencimento.
theological_decisions:
- issue: Referência ao nome divino יהוה
  choice: SENHOR
  alternative: Yahweh
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o Tetragrama por SENHOR em versaletes, em harmonia com a revisão adjudicada, sem alterar a identidade do referente.
- issue: Função do altar como testemunho
  choice: Não especificar que o altar legitima sacrifícios fora do santuário
  alternative: Explicitar uma autorização cultual independente
  rationale: O versículo afirma sua função testemunhal; não se deve importar uma conclusão denominacional ou resolver antecipadamente a tensão narrativa.
- issue: Sentido de חֵלֶק
  choice: parte
  alternative: direito de participar do culto
  rationale: 'A tradução literal preserva a amplitude da alegação: pertencimento, acesso cultual e participação na relação pactual podem estar implicados.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A sintaxe foi dividida em duas frases para fluidez, preservando as relações lógicas. Não há marcadores de nota, pois nenhuma nota é necessária.
