  to: 'Pelo contrário, isto é um testemunho entre nós e vocês, e entre as nossas gerações futuras, para que prestemos o culto ao SENHOR diante dele, com os nossos holocaustos, sacrifícios e ofertas de comunhão, para que, no futuro, os filhos de vocês não digam aos nossos filhos: ‘Vocês não têm parte no SENHOR.’'
