  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: pt
  text: 'Então Fineias, filho do sacerdote Eleazar, disse aos filhos de Rúben, aos filhos de Gade e aos filhos de Manassés: “Hoje sabemos que Yahweh está no meio de nós, pois vocês não agiram com infidelidade contra Yahweh neste caso.[a] Assim, vocês livraram os filhos de Israel da mão de Yahweh.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “não foram infiéis contra Yahweh com esta infidelidade”; a repetição enfatiza uma quebra de lealdade ou traição da aliança.'
    reason: lexical_alternative
  - marker: b
    text: “Da mão de Yahweh” é uma expressão hebraica que, neste contexto, indica que Israel foi poupado do poder ou do juízo de Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Então ... disse
  rationale: O waw consecutivo dá continuidade à narrativa. “Então” expressa essa progressão de modo natural em português sem impor uma relação temporal forte demais.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Fineias, filho do sacerdote Eleazar
  rationale: A formulação identifica Fineias por sua filiação e associa o título sacerdotal a Eleazar, conforme a construção hebraica, em ordem natural no português.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: aos filhos de Rúben, aos filhos de Gade e aos filhos de Manassés
  rationale: Mantém a repetição e a forma tribal “filhos de” do hebraico, que permanece clara em português.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: Hoje sabemos
  rationale: O perfeito expressa aqui uma certeza alcançada no presente; “Hoje sabemos” preserva tanto a atualidade quanto a convicção da declaração.
- source_word: בְּתוֹכֵנוּ
  choice: no meio de nós
  rationale: Expressão portuguesa natural para a presença de Yahweh dentro da comunidade, sem sugerir uma presença interior individual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino do texto hebraico, em vez de substituí-lo por um título.
- source_word: אֲשֶׁר לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: pois vocês não agiram com infidelidade contra Yahweh neste caso
  rationale: מעל designa quebra de lealdade ou traição da aliança. A formulação comunica esse peso moral e religioso em português atual; a nota registra a repetição enfática do cognato no hebraico.
- source_word: אָז
  choice: Assim
  rationale: Neste contexto, o termo introduz o resultado da inocência reconhecida. “Assim” exprime a consequência sem transformar a frase numa dedução mais explícita do que o hebraico.
- source_word: הִצַּלְתֶּם
  choice: vocês livraram
  rationale: O hifil de נצל significa livrar ou resgatar. “Livraram” combina naturalmente com a expressão seguinte “da mão de”.
- source_word: מִיַּד יְהוָה
  choice: da mão de Yahweh
  rationale: Mantém a imagem hebraica da mão como poder atuante. A nota esclarece que, no contexto, trata-se de serem poupados do juízo divino.
theological_decisions:
- issue: A presença divina entre o povo
  choice: Yahweh está no meio de nós
  alternative: Yahweh está entre nós
  rationale: A tradução afirma a presença de Yahweh na comunidade da aliança sem acrescentar categorias teológicas posteriores.
- issue: O sentido da linguagem de מעל
  choice: não agiram com infidelidade contra Yahweh
  alternative: não cometeram esta transgressão contra Yahweh
  rationale: “Infidelidade” preserva a ideia de quebra de lealdade à aliança, não apenas a de uma infração técnica ou genérica.
- issue: A expressão “da mão de Yahweh”
  choice: imagem literal preservada
  alternative: do juízo de Yahweh
  rationale: A expressão envolve o poder e, no contexto, o possível juízo de Yahweh. Preservar a imagem evita resolver no texto principal aquilo que o idioma deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A repetição tribal e a imagem “da mão de Yahweh” foram mantidas por transparência ao hebraico; construções excessivamente literais foram suavizadas apenas onde prejudicariam a compreensão.
