  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: pt
  text: Vocês não abandonaram seus irmãos[a] durante todo este longo tempo, até o dia de hoje, e cumpriram a obrigação de guardar o mandamento de Yahweh, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus compatriotas israelitas”; o hebraico diz “seus irmãos”, termo masculino plural de parentesco que aqui pode designar de modo amplo os membros de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: não abandonaram
  rationale: O verbo עזב pode significar deixar, abandonar ou desamparar. “Não abandonaram” expressa com naturalidade a fidelidade contínua elogiada neste contexto.
- source_word: אֲחֵיכֶם
  choice: seus irmãos
  rationale: Mantém o termo masculino plural de parentesco do hebraico, que aqui designa os demais israelitas; a amplitude referencial é esclarecida em nota.
- source_word: זֶה יָמִים רַבִּים
  choice: durante todo este longo tempo
  rationale: Traduz o idiomatismo temporal hebraico de modo claro e corrente, preservando a ênfase na longa duração.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: até o dia de hoje
  rationale: Expressão temporal natural que indica continuidade desde o passado até o momento da fala.
- source_word: וּשְׁמַרְתֶּם
  choice: e cumpriram
  rationale: Neste contexto, שׁמר indica observar fielmente uma responsabilidade ou determinação, sentido bem expresso por “cumpriram”.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: o dever que ... lhes ordenou
  rationale: A cadeia nominal combina a ideia de responsabilidade confiada com a de mandamento. A formulação verbal comunica ambas sem o artificialismo de “a guarda do mandamento”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: seu Deus
  rationale: Reproduz a designação pactual ligada ao nome divino e concorda naturalmente com o tratamento por “vocês”.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal divino por transliteração.
- issue: Alcance do termo pactual אֲחֵיכֶם
  choice: seus irmãos
  alternative: seus compatriotas israelitas
  rationale: A tradução principal conserva o substantivo masculino plural “irmãos”, enquanto a nota registra que, no contexto, ele se refere amplamente aos demais membros de Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “vocês” evita formas arcaicas; “todo este longo tempo” traduz naturalmente o idiomatismo temporal, e a formulação verbal final preserva tanto o dever confiado quanto sua origem no mandamento de Yahweh.
