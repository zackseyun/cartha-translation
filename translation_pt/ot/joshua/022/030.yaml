source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: pt
  text: Quando o sacerdote Fineias, os líderes da comunidade e os chefes dos milhares de Israel[a] que estavam com ele ouviram as palavras que os filhos de Rúben, os filhos de Gade e os filhos de Manassés disseram, isso foi bom aos olhos deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “os chefes dos milhares de Israel”. Aqui, “milhares” pode designar clãs ou subdivisões tribais, e não necessariamente unidades de exatamente mil pessoas.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “isso lhes agradou” ou “isso lhes pareceu bom”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ouviram
  rationale: O verbo שׁמע, na sequência narrativa, indica naturalmente que eles ouviram as palavras; “escutaram com atenção” acrescentaria uma nuance não exigida pelo texto.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: o sacerdote Fineias
  rationale: Emprega a forma portuguesa tradicional do nome e uma ordem natural em português, preservando o título definido.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: os líderes da comunidade
  rationale: נְשִׂיאִים designa líderes reconhecidos, e עֵדָה refere-se à comunidade reunida de Israel. “Comunidade” é claro e atual sem impor um sentido eclesiástico posterior.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: os chefes dos milhares de Israel
  rationale: Mantém de forma transparente o sentido literal de אַלְפֵי, sem decidir no corpo do texto se as unidades eram estritamente numéricas ou divisões tribais; a nota esclarece essa possibilidade.
- source_word: אֲשֶׁר אִתּוֹ
  choice: que estavam com ele
  rationale: Preserva a oração relativa e o pronome hebraico, cujo referente contextual é Fineias.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: as palavras que ... disseram
  rationale: Reproduz a relação entre דְּבָרִים e דִּבְּרוּ em português natural, evitando a repetição pouco idiomática “palavras que falaram”.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: os filhos de Rúben, os filhos de Gade e os filhos de Manassés
  rationale: Preserva a repetição e a identificação tribal expressas três vezes por בְּנֵי, em vez de substituí-las por gentílicos.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: isso foi bom aos olhos deles
  rationale: Conserva o idioma hebraico e seu tom avaliativo sem reduzir a expressão apenas a uma reação emocional; a formulação continua compreensível em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura preserva a enumeração solene do hebraico, a repetição dos grupos tribais e o idioma “bom aos olhos deles”. As notas mantêm abertas as nuances de אַלְפֵי e וַיִּיטַב בְּעֵינֵיהֶם.
