source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: pt
  text: 'Apenas tenham muito cuidado de cumprir o mandamento e a lei[a] que Moisés, servo de Yahweh, lhes ordenou: amar Yahweh, seu Deus, andar em todos os seus caminhos, guardar os seus mandamentos, apegar-se a ele e servi-lo de todo o coração e de toda a alma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “a instrução” (hebraico: torá).'
    reason: Registra uma alternativa lexical genuína para תּוֹרָה sem obscurecer o sentido reconhecível de “lei” no contexto mosaico.
lexical_decisions:
- source_word: רַק
  choice: Mas
  rationale: No contexto da despedida anterior, introduz uma ressalva enfática e soa mais natural em português do que um isolado “Somente”; a força restritiva permanece na exortação.
- source_word: שִׁמְרוּ מְאֹד לַעֲשׂוֹת
  choice: tenham muito cuidado em cumprir
  rationale: Reproduz a urgência do idioma hebraico e deixa claro que o cuidado deve resultar na prática efetiva.
- source_word: הַמִּצְוָה
  choice: o mandamento
  rationale: Mantém o singular hebraico e seu caráter de obrigação pactual.
- source_word: הַתּוֹרָה
  choice: a lei
  rationale: É a forma mais reconhecível no contexto mosaico; “instrução” continua sendo uma alternativa lexical válida e é registrada em nota.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: “Servo” preserva o título honorífico de Moisés sem destacar indevidamente a condição jurídica que “escravo” poderia sugerir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso no texto hebraico, em vez de substituí-lo por um título.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: andar em todos os seus caminhos
  rationale: Preserva a metáfora ética hebraica em uma formulação clara e digna em português.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: guardar os seus mandamentos
  rationale: “Guardar” é uma expressão corrente para a observância fiel de mandamentos e conserva o tom pactual.
- source_word: וּלְדָבְקָה בּוֹ
  choice: apegar-se a ele
  rationale: Comunica vínculo próximo e lealdade intensa em linguagem moderna, sem o tom excessivamente físico de algumas alternativas.
- source_word: וּלְעָבְדוֹ
  choice: servi-lo
  rationale: Mantém o sentido amplo de serviço obediente e devotado, sem restringi-lo apenas ao culto.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: de todo o coração e de toda a alma
  rationale: Expressão natural em português que preserva a totalidade da devoção exigida pelos dois termos hebraicos.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama; a transliteração preserva o nome pactual sem substituí-lo por um título.
- issue: Metáforas éticas e pactuais
  choice: andar em todos os seus caminhos; apegar-se a ele
  alternative: viver segundo todos os seus caminhos; manter-se unido a ele
  rationale: As metáforas do original são compreensíveis em português e carregam força relacional e teológica que não deve ser dissolvida por paráfrase.
- issue: Sentido de עבד no serviço a Deus
  choice: servi-lo
  alternative: adorá-lo
  rationale: O verbo pode abranger culto, mas aqui “servir” conserva sua extensão mais ampla, incluindo devoção e obediência.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com legibilidade brasileira. A segunda pessoa plural hebraica foi vertida por “vocês” implícito nas formas “tenham/lhes”, evitando regionalismos; os paralelismos infinitivos foram preservados.
