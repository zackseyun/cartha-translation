  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: pt
  text: Pois Yahweh estabeleceu o Jordão como fronteira entre nós e vocês, filhos de Rúben e filhos de Gade. Vocês não têm parte em Yahweh. Assim, os filhos de vocês poderiam levar os nossos filhos a deixar de temer Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: estabeleceu ... como fronteira
  rationale: A combinação de נָתַן com גְּבוּל expressa o estabelecimento de um limite; esta formulação é natural em português e mantém a imagem geográfica.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo tetragrama, em vez de substituí-lo por um título.
- source_word: אֶת הַיַּרְדֵּן
  choice: o Jordão
  rationale: O nome próprio é claro em português sem o acréscimo explicativo de “rio”.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: filhos de Rúben e filhos de Gade
  rationale: Conserva a forma tribal explícita do hebraico e permanece compreensível em português atual.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: Vocês não têm parte em Yahweh
  rationale: “Parte” reproduz o sentido amplo de חֵלֶק sem restringi-lo a herança territorial; a formulação preserva a força relacional e pactual da expressão.
- source_word: וְהִשְׁבִּיתוּ
  choice: poderiam levar ... a deixar
  rationale: O hifil de שבת é causativo. “Poderiam” expressa a consequência temida no contexto, sem apresentá-la como fato já consumado.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: a deixar de temer Yahweh
  rationale: Mantém tanto a ideia de cessação quanto a expressão bíblica direta “temer Yahweh”, sem suavizá-la para mera reverência.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome divino; a transliteração preserva sua condição de nome próprio.
- issue: Sentido de חֵלֶק בַּיהוָה
  choice: parte em Yahweh
  alternative: herança em Yahweh
  rationale: “Parte” mantém a amplitude e a tensão da expressão hebraica, que pode envolver participação pactual, sem impor especificamente a categoria de herança.
- issue: Modalidade da consequência em וְהִשְׁבִּיתוּ
  choice: poderiam levar
  alternative: levarão
  rationale: O contexto apresenta uma consequência receada; a modalidade potencial comunica isso sem apagar o valor causativo do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa plural. A repetição “filhos de” foi mantida por transparência ao hebraico. “Pois” conserva a ligação explicativa com o contexto anterior.
