base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/006.yaml
  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: pt
  text: Então Josué os abençoou e os despediu[a], e eles foram para as suas tendas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deixou que partissem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: os abençoou
  rationale: O piel de ברך indica que Josué lhes concedeu uma bênção. A formulação é direta, natural e preserva a ação formal do texto.
- source_word: יְהוֹשֻׁעַ
  choice: Josué
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: וַיְשַׁלְּחֵם
  choice: os despediu
  rationale: Neste contexto, שלח descreve Josué liberando o grupo para partir. “Despediu” expressa isso de modo conciso, sem sugerir rejeição.
- source_word: וַיֵּלְכוּ
  choice: eles foram
  rationale: הלך é o verbo comum para ir. “Foram” traduz diretamente o hebraico; “voltaram” acrescentaria uma ideia apenas inferida pelo contexto.
- source_word: אֶל
  choice: para
  rationale: A preposição assinala movimento em direção ao destino e é traduzida de modo idiomático por “para”.
- source_word: אָהֳלֵיהֶם
  choice: suas tendas
  rationale: A expressão significa literalmente “suas tendas”. Embora possa designar por extensão suas casas ou seu lugar de residência, a tradução literal é clara e adequada ao cenário histórico.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com coordenação narrativa simples que acompanha a sequência hebraica. A nota esclarece o sentido contextual de וַיְשַׁלְּחֵם; “tendas” permanece no texto por ser literal e natural neste cenário.
