  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: pt
  text: Longe de nós rebelar-nos contra Yahweh e, hoje, deixar de segui-lo[a], construindo um altar para holocausto, oferta de cereal ou sacrifício, além do altar de Yahweh, nosso Deus, que está diante do seu tabernáculo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «voltar-se hoje, deixando de seguir Yahweh»; literalmente, «voltar-se de após Yahweh».'
    reason: Explica a construção idiomática hebraica מֵאַחֲרֵי sem obscurecer o sentido no texto principal.
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: Longe de nós fazer tal coisa!
  rationale: Expressa de modo natural e enfático a forte rejeição indicada pela locução hebraica, incluindo o pronome מִמֶּנּוּ, que retoma a ação em questão.
- source_word: לִמְרֹד בַּיהוָה
  choice: nos rebelaríamos contra Yahweh
  rationale: מרד com בְּ indica rebelião contra alguém; a forma verbal em português integra naturalmente a ação repudiada pela exclamação inicial.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: nem deixaríamos hoje de seguir Yahweh
  rationale: Reproduz o sentido da expressão hebraica de voltar para longe de quem se vinha seguindo, sem impor uma interpretação além do abandono da fidelidade a Yahweh.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: construindo um altar
  rationale: O gerúndio apresenta a construção do altar como o modo concreto pelo qual ocorreriam a rebelião e o abandono mencionados.
- source_word: לְעֹלָה
  choice: para holocausto
  rationale: Holocausto é o termo sacrificial tradicional e preciso para a oferta totalmente queimada indicada por עֹלָה.
- source_word: לְמִנְחָה
  choice: oferta de cereal
  rationale: No contexto cultual, מִנְחָה designa especificamente uma oferta feita de produtos vegetais, e não uma oferta genérica.
- source_word: וּלְזָבַח
  choice: ou sacrifício
  rationale: Mantém o caráter geral de זֶבַח sem especificar indevidamente um subtipo de sacrifício.
- source_word: מִלְּבַד מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: além do altar de Yahweh, nosso Deus
  rationale: Preserva o contraste com o único altar legítimo e mantém a confissão relacional 'nosso Deus'.
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: que está diante do seu tabernáculo
  rationale: Conserva tanto a relação espacial expressa por לִפְנֵי quanto o sufixo possessivo de terceira pessoa em מִשְׁכָּנוֹ.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o nome da aliança; 'Yahweh' o representa como nome próprio, em vez de substituí-lo por um título.
- issue: Relação entre o altar pretendido e o altar autorizado
  choice: além do altar de Yahweh
  alternative: à parte do altar de Yahweh; em lugar do altar de Yahweh
  rationale: 'A formulação preserva a amplitude de מִלְּבַד: trata-se de outro altar, distinto do altar diante do tabernáculo, sem decidir se a ênfase recai em adição ou substituição.'
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A exclamação inicial preserva a veemência da rejeição; os termos cultuais permanecem precisos sem tornar a frase excessivamente técnica.
