revisions:
- from: Longe de nós fazer tal coisa! Jamais nos rebelaríamos contra Yahweh nem deixaríamos hoje de seguir Yahweh[a], construindo um altar para holocausto, oferta de cereal ou sacrifício, além do altar de Yahweh, nosso Deus, que está diante do seu tabernáculo.
  to: Longe de nós rebelar-nos contra Yahweh e, hoje, deixar de segui-lo[a], construindo um altar para holocausto, oferta de cereal ou sacrifício, além do altar de Yahweh, nosso Deus, que está diante do seu tabernáculo.
  rationale: A revisão mantém todas as decisões lexicais centrais do rascunho, mas usa infinitivos após «Longe de nós» para refletir mais diretamente a fórmula hebraica de forte repúdio. Também posiciona «hoje» junto à ação que ele modifica e ajusta a nota para uma explicação linguisticamente mais exata.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T22:09:04Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução comunica corretamente a repulsa enfática, a rebelião contra Yahweh, o abandono de segui-lo, a construção de um altar e o contraste com o altar diante do tabernáculo. Contudo, «Jamais nos rebelaríamos» transforma os infinitivos hebraicos dependentes da fórmula de repúdio numa formulação condicional e introduz uma ênfase temporal/modal («jamais») que não corresponde diretamente a «hoje». Uma construção infinitiva portuguesa conserva melhor a estrutura e o escopo de «hoje».
  naturalness: O texto é claro e de registro apropriado. «Longe de nós rebelar-nos...» é uma formulação idiomática e digna em português, mais concisa e mais próxima da construção hebraica do que a frase com «Jamais nos rebelaríamos».
  terminology: «Yahweh», «altar», «holocausto», «oferta de cereal», «sacrifício» e «tabernáculo» são escolhas adequadas. «Além do altar» preserva satisfatoriamente o contraste expresso por מִלְּבַד, sem especificar além do necessário a natureza da oposição.
  issues:
  - severity: low
    issue: A formulação verbal «Jamais nos rebelaríamos» afasta-se da construção de repúdio seguida de infinitivos.
    rationale: O hebraico diz literalmente que esteja longe deles rebelar-se e voltar-se hoje, deixando de seguir Yahweh. A versão revista preserva essa coordenação e associa «hoje» especificamente a «deixar de segui-lo».
  - severity: low
    issue: A nota diz «voltar hoje de detrás de Yahweh».
    rationale: «De detrás de» não é uma reprodução literal clara nem natural de מֵאַחֲרֵי. «Voltar-se hoje, deixando de seguir Yahweh» explica a imagem sem produzir uma literalidade enganosa.
  revised_text: Longe de nós rebelar-nos contra Yahweh e, hoje, deixar de segui-lo[a], construindo um altar para holocausto, oferta de cereal ou sacrifício, além do altar de Yahweh, nosso Deus, que está diante do seu tabernáculo.
  revised_footnotes:
  - marker: a
    text: 'Hebraico: «voltar-se hoje, deixando de seguir Yahweh»; literalmente, «voltar-se de após Yahweh».'
    reason: Explica a construção idiomática hebraica מֵאַחֲרֵי sem obscurecer o sentido no texto principal.
  revision_rationale: A revisão mantém todas as decisões lexicais centrais do rascunho, mas usa infinitivos após «Longe de nós» para refletir mais diretamente a fórmula hebraica de forte repúdio. Também posiciona «hoje» junto à ação que ele modifica e ajusta a nota para uma explicação linguisticamente mais exata.
