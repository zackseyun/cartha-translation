  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: pt
  text: E agora Yahweh, o Deus de vocês, deu descanso a seus irmãos[a], como lhes havia dito[b]. Agora, voltem-se e vão para as suas tendas[c], para a terra que é propriedade de vocês, a qual Moisés, servo de Yahweh, lhes deu do outro lado do Jordão[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmãos” se refere aos demais israelitas.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como lhes havia prometido”. O hebraico diz: “como lhes falou”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “para as suas casas”. Literalmente: “para as suas tendas”.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “além do Jordão” ou “na outra margem do Jordão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: deu descanso
  rationale: O hifil de נוח indica conceder descanso ou alívio, especialmente dos conflitos. “Deu descanso” é natural em português e mantém a imagem do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mantém o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֱלֹהֵיכֶם
  choice: o Deus de vocês
  rationale: O contexto e a associação com Yahweh exigem o sentido singular. A construção explicita com naturalidade a relação possessiva em português.
- source_word: לַאֲחֵיכֶם
  choice: aos irmãos de vocês
  rationale: Preserva o substantivo masculino plural do hebraico e a solidariedade entre as tribos, esclarecendo em nota que se trata dos demais israelitas.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: como lhes havia dito
  rationale: דבר significa falar ou dizer. A formulação portuguesa é natural e preserva a referência ao que Deus disse, sem transformar implicitamente a declaração em “promessa”.
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: voltem e vão
  rationale: פְּנוּ expressa a ideia de voltar-se e, neste contexto de partida, “voltem” comunica naturalmente o movimento de retorno. O dativo ético לָכֶם não requer tradução separada.
- source_word: לְאָהֳלֵיכֶם
  choice: para as suas tendas
  rationale: Mantém a imagem histórica e a expressão concreta do hebraico; o possível sentido idiomático “casas” é indicado em nota.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: para a terra que é propriedade de vocês
  rationale: אֲחֻזָּה designa uma propriedade ou posse territorial. A escolha é clara em português e evita substituir o termo por “herança”, que acrescentaria outra nuance.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: a qual Moisés ... lhes deu
  rationale: Traduz diretamente o verbo comum נתן, “dar”, sem introduzir a ideia mais específica de uma distribuição administrativa.
- source_word: עֶבֶד יְהוָה
  choice: servo de Yahweh
  rationale: Neste título honorífico aplicado a Moisés, “servo” corresponde melhor ao valor contextual de עֶבֶד do que “escravo”.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: do outro lado do Jordão
  rationale: A expressão situa o território na margem oposta do Jordão em relação ao ponto de referência do discurso, sem especificar no próprio texto uma direção que o hebraico não explicita.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o nome pactual de Deus. A transliteração “Yahweh” preserva sua condição de nome próprio, em vez de substituí-lo por um título.
- issue: Sentido de “como lhes havia dito”
  choice: Manter o verbo de fala no texto
  alternative: “como lhes havia prometido”
  rationale: A declaração divina tem força de promessa no contexto, mas o hebraico usa o verbo comum דבר, “falar”. A tradução conserva essa formulação e registra a leitura contextual em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural, conserva “tendas” e “Yahweh” por fidelidade lexical e mantém as duas ocorrências de “agora” presentes no hebraico.
