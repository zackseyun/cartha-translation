  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: pt
  text: Então os filhos de Israel enviaram Fineias, filho do sacerdote Eleazar, aos filhos de Rúben[a], aos filhos de Gade e à meia tribo de Manassés, na terra de Gileade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “os israelitas enviaram Fineias... aos rubenitas, aos gaditas e à meia tribo de Manassés”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Então ... enviaram
  rationale: O waw consecutivo faz a narrativa avançar; “Então” expressa de modo natural a sequência dos acontecimentos.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão hebraica e continua compreensível em português bíblico moderno.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: os filhos de Rúben / os filhos de Gade
  rationale: Mantém de modo transparente a construção hebraica; as formas gentílicas são registradas como alternativa idiomática na nota.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: a meia tribo de Manassés
  rationale: Equivalente português claro e consagrado para a cadeia construta hebraica.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: na terra de Gileade
  rationale: No contexto, a expressão localiza os grupos destinatários na terra de Gileade, em vez de indicar um segundo destino independente.
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Fineias, filho do sacerdote Eleazar
  rationale: 'A posição do artigo em הַכֹּהֵן favorece ligar “sacerdote” a Eleazar: Fineias era filho de Eleazar, o sacerdote. A formulação portuguesa expressa essa relação com naturalidade.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação conserva as expressões hebraicas “filhos de Israel” e “filhos de Rúben/Gade”, enquanto a nota oferece os gentílicos mais idiomáticos.
