review_pass:
  verdict: revise
  source_fidelity: A versão preserva adequadamente os grupos tribais, a dupla sequência verbal, o destino em Gileade, a posse territorial e a mediação de Moisés. Contudo, «em Siló» não traduz a preposição מִן («de, desde») em מִשִּׁלֹה; o texto diz que eles partiram de Siló. A redação também pode representar mais diretamente a relação entre a terra da possessão e a cláusula relativa hebraica.
  naturalness: O português é claro, digno e de leitura ampla. «De junto dos filhos de Israel» é possível e comunica separação sem sugerir exclusão do povo. A repetição de «partiram ... para ir» conserva a sucessão verbal e o infinitivo de propósito, embora seja formal.
  terminology: As formas Rúben, Gade, Manassés, Siló e Gileade são apropriadas em português. «Terra de sua propriedade» conserva melhor o valor jurídico-territorial de אֲחֻזָּה do que «a terra que lhes pertencia». «Yahweh» corresponde à decisão editorial fornecida. A nota lexical é pertinente e mantém a ambiguidade aspectual/lexical do nifal de אחז.
  issues:
  - severity: medium
    issue: «em Siló» em vez de «de Siló»
    rationale: O hebraico traz מִשִּׁלֹה, «de Siló». Siló é o ponto de partida, coordenado com «dos filhos de Israel», não apenas uma indicação estática do local.
  - severity: low
    issue: Formulação da possessão territorial
    rationale: «A terra que lhes pertencia» é compreensível, mas achata a construção «terra de sua possessão». Uma formulação mais próxima preserva a nuance de domínio/tenência da terra e deixa a oração relativa ligada a ela de modo inequívoco.
