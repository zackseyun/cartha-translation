base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: pt
  text: Então os filhos de Rúben, os filhos de Gade e a meia tribo de Manassés voltaram e partiram de junto dos filhos de Israel, de Siló, que fica na terra de Canaã, para ir à terra de Gileade, à terra de sua propriedade, da qual haviam tomado posse[a] por ordem de Yahweh, por meio de Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que haviam recebido como propriedade”. O verbo hebraico pode enfatizar tanto o recebimento e a manutenção da terra quanto a tomada de posse dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: voltaram e partiram
  rationale: Mantém os dois verbos hebraicos e comunica com naturalidade tanto o retorno quanto a partida.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: os filhos de Rúben, os filhos de Gade
  rationale: Preserva a forma genealógica do hebraico, ainda compreensível em português bíblico atual.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: de junto dos filhos de Israel
  rationale: Expressa a separação física do restante da assembleia sem sugerir rompimento étnico ou religioso.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: à terra de Gileade
  rationale: Conserva o destaque territorial de אֶרֶץ.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: a terra que lhes pertencia
  rationale: Comunica em português corrente a ideia jurídico-territorial de uma propriedade ou porção permanente.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: da qual haviam tomado posse
  rationale: Expressa o estado de posse territorial indicado pelo Nifal de אחז; a nota preserva a possibilidade de enfatizar o recebimento ou a manutenção dessa posse.
- source_word: עַל פִּי יְהוָה
  choice: por ordem de Yahweh
  rationale: Traduz idiomaticamente עַל־פִּי e mantém o nome divino explícito.
- source_word: בְּיַד מֹשֶׁה
  choice: dada por meio de Moisés
  rationale: Torna clara a mediação de Moisés implícita no idioma hebraico 'pela mão de'.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz explicitamente o Tetragrama; a forma Yahweh preserva o nome próprio da aliança sem substituí-lo por um título.
- issue: Natureza da posse da terra
  choice: da qual haviam tomado posse
  alternative: que haviam recebido como propriedade
  rationale: A formulação principal mantém a ação de entrar na posse, enquanto a nota reconhece o valor passivo ou resultativo do verbo e evita decidir além do que o hebraico exige.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A estrutura geográfica e a sequência verbal do hebraico foram preservadas sem rigidez excessiva.
