source:
  edition: WLC
  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: pt
  text: 'Assim diz toda a comunidade de Yahweh: “Que infidelidade é esta que vocês cometeram contra o Deus de Israel[a], afastando-se hoje de seguir Yahweh, ao construírem para si um altar e se rebelarem hoje contra Yahweh?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “traição” ou “deslealdade”, em vez de “infidelidade”. O termo hebraico indica deslealdade pactual ou cultual.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: Assim diz
  rationale: Reproduz de modo natural a fórmula de declaração; embora o verbo hebraico esteja formalmente no perfeito e no plural, o presente singular concorda idiomaticamente com o sujeito coletivo.
- source_word: כֹּל עֲדַת יְהוָה
  choice: toda a comunidade de Yahweh
  rationale: עֵדָה designa a comunidade reunida de Israel; “comunidade” é atual, clara e mantém o caráter coletivo e pactual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino em vez de substituí-lo por um título.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: Que infidelidade é esta que vocês cometeram
  rationale: O substantivo e o verbo cognato descrevem deslealdade cultual ou pactual. A construção escolhida soa natural em português e conserva a força acusatória.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: contra o Deus de Israel
  rationale: Com מעל, a preposição indica aquele contra quem se pratica a deslealdade.
- source_word: לָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: afastando-se hoje de seguir Yahweh
  rationale: Preserva a imagem hebraica de deixar de ir após Yahweh, expressando abandono da lealdade e do seguimento.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: ao construírem para si um altar
  rationale: O infinitivo com בְּ apresenta a circunstância ou o meio pelo qual se daria o afastamento.
- source_word: לִמְרָדְכֶם הַיּוֹם בַּיהוָה
  choice: e se rebelarem hoje contra Yahweh
  rationale: Explicita em português a relação coordenada ou resultante da acusação, preserva a segunda ocorrência enfática de “hoje” e traduz בְּ como objeto da rebelião.
theological_decisions:
- issue: Sentido pactual e cultual de מַעַל
  choice: infidelidade
  alternative: traição; deslealdade; violação da fidelidade
  rationale: “Infidelidade” comunica deslealdade relacional e pactual sem reduzir a acusação a um pecado genérico nem definir de antemão a natureza jurídica exata da falta.
- issue: Representação de יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: A transliteração conserva o nome próprio divino presente no texto hebraico.
- issue: Relação entre a construção do altar e a rebelião
  choice: ao construírem para si um altar e se rebelarem
  alternative: construindo para si um altar, para se rebelarem
  rationale: A redação conserva a ligação estreita entre os atos sem impor que לִמְרָדְכֶם indique exclusivamente propósito consciente; pode expressar propósito, resultado ou caracterização do ato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “vocês” para o plural de segunda pessoa e mantém as duas ocorrências de “hoje” para preservar a urgência retórica do hebraico.
