base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: pt
  text: Então Fineias, filho de Eleazar, o sacerdote, e os líderes voltaram dos filhos de Rúben e dos filhos de Gade, da terra de Gileade para a terra de Canaã, para os filhos de Israel, e lhes trouxeram uma mensagem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e lhes deram um relato”. O termo hebraico דָּבָר pode significar “palavra”, “assunto”, “mensagem” ou “relato”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: voltaram
  rationale: O singular hebraico abre uma construção cujo sujeito composto inclui Fineias e os líderes; em português, o plural é exigido. “Voltaram” conserva o sentido narrativo de retorno.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Fineias, filho do sacerdote Eleazar
  rationale: A ordem portuguesa associa naturalmente o título “sacerdote” a Eleazar, como sugere a construção hebraica, e evita a possível leitura de que o título identifica Fineias.
- source_word: וְהַנְּשִׂיאִים
  choice: e os líderes
  rationale: נְשִׂיאִים designa aqui chefes ou representantes tribais; “líderes” é atual e não sugere monarquia.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: de junto dos filhos de Rúben e dos filhos de Gade
  rationale: “De junto de” expressa a partida da presença desses grupos, enquanto “filhos de” preserva a fórmula tribal repetida no hebraico.
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: saindo da terra de Gileade para a terra de Canaã
  rationale: Mantém a repetição de “terra” e explicita de modo natural em português o percurso de origem e destino.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: onde estavam os filhos de Israel
  rationale: O segundo אֶל indica que o retorno à terra de Canaã também era um retorno ao povo de Israel. “Onde estavam” evita uma sequência pesada de dois complementos com “para”, sem apagar o referente literal.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: e lhes trouxeram uma resposta
  rationale: A expressão comunica que levaram de volta uma palavra, notícia ou resposta. “Trouxeram uma resposta” preserva o movimento de retorno e soa natural no contexto da missão.
