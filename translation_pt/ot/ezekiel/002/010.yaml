  text: וַ/יִּפְרֹ֤שׂ אוֹתָ/הּ֙ לְ/פָנַ֔/י וְ/הִ֥יא כְתוּבָ֖ה פָּנִ֣ים וְ/אָח֑וֹר וְ/כָת֣וּב אֵלֶ֔י/הָ קִנִ֥ים וָ/הֶ֖גֶה וָ/הִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/010.yaml
  text: And he spread it out before me[a], and it was written on the front and on the back[b]; and written on it were lamentations and mourning and woe.
translation:
  language: pt
  text: Ele o estendeu diante de mim, e o rolo estava escrito na frente e no verso[a]. Nele estavam escritas lamentações, gemidos e ais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dos dois lados»; tradicionalmente: «por dentro e por fora».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: o desenrolou
  rationale: O verbo significa estender ou abrir. Como o referente é um rolo, «desenrolou» expressa naturalmente a ação no contexto, sem alterar seu sentido.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Reproduz de modo natural e digno o sentido espacial da expressão hebraica.
- source_word: כְתוּבָה פָּנִים וְאָחוֹר
  choice: o rolo estava escrito na frente e no verso
  rationale: Mantém a imagem literal de «frente e trás» e esclarece em português que havia escrita nas duas faces do rolo.
- source_word: קִנִים
  choice: lamentações
  rationale: Designa lamentos ou cânticos fúnebres; «lamentações» conserva o tom solene e é amplamente compreensível.
- source_word: הֶגֶה
  choice: gemidos
  rationale: O substantivo indica gemido, murmúrio pesaroso ou lamento. «Gemidos» preserva mais diretamente a manifestação audível de sofrimento do que o termo abstrato «luto».
- source_word: הִי
  choice: ais
  rationale: Interjeição ou expressão substantivada de aflição e calamidade. O plural «ais» é idiomático em português nesta enumeração profética.
theological_decisions:
- issue: A tríade que descreve o conteúdo escrito no rolo
  choice: lamentações, gemidos e ais
  alternative: lamentações, luto e desgraça
  rationale: A tradução mantém três expressões distintas e cumulativas de dor e juízo, sem explicar sua causa nem acrescentar uma interpretação doutrinária.
- issue: As faces do rolo que continham escrita
  choice: na frente e no verso
  alternative: por dentro e por fora; dos dois lados
  rationale: A formulação acompanha mais diretamente o hebraico «frente e trás» e deixa evidente o caráter incomum de um rolo escrito em ambas as faces, sem adotar a interpretação tradicional de interior e exterior.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A repetição de «rolo» evita ambiguidade pronominal e torna explícito o referente feminino do hebraico.
