base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/001.yaml
  text: And he said to me[a], “Son of man, stand on your feet, and I will speak to you.”
translation:
  language: pt
  text: 'E ele me disse: “Filho do homem, fique de pé, e eu falarei com você[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «falarei a você». A construção hebraica pode indicar falar com alguém ou falar a alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: E ele me disse
  rationale: O wayyiqtol narrativo é vertido naturalmente pelo pretérito perfeito; “disse” corresponde diretamente a אמר neste contexto.
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a expressão hebraica literal e a forma recorrente de tratamento dirigida a Ezequiel, sem antecipar uma interpretação cristológica.
- source_word: עֲמֹד עַל רַגְלֶיךָ
  choice: fique de pé
  rationale: Expressão portuguesa natural que comunica a ordem de assumir uma posição ereta e mantém a imagem corporal do hebraico.
- source_word: וַאֲדַבֵּר אֹתָךְ
  choice: e eu falarei com você
  rationale: A construção com דבר e אֵת admite a ideia de falar com alguém; “falarei com você” é natural em português e preserva o caráter pessoal do encontro.
theological_decisions:
- issue: Tradução de בֶּן אָדָם em Ezequiel
  choice: Filho do homem
  alternative: ser humano; mortal
  rationale: A tradução conserva a fórmula profética distintiva de Ezequiel e sua ressonância literária, sem inserir neste versículo uma identificação cristológica posterior.
- issue: Direção ou reciprocidade em וַאֲדַבֵּר אֹתָךְ
  choice: falarei com você
  alternative: falarei a você
  rationale: A construção hebraica pode ser entendida como fala dirigida ao profeta ou como falar com ele. A opção escolhida é idiomática e preserva a dimensão pessoal sem exigir reciprocidade verbal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Fique de pé” soa mais natural no português corrente do que o literal “ponha-se sobre os seus pés”; “você” oferece clareza internacional com leitura imediata no Brasil.
