  text: וָ/אֶרְאֶ֕ה וְ/הִנֵּה יָ֖ד שְׁלוּחָ֣ה אֵלָ֑/י וְ/הִנֵּה ב֖/וֹ מְגִלַּת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/009.yaml
  text: Then I looked[a], and behold, a hand was stretched out toward me, and behold, in it was a scroll.
translation:
  language: pt
  text: Então olhei, e eis que uma mão estava estendida em minha direção; e eis que nela havia um rolo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um rolo de livro”, isto é, um documento em forma de rolo.'
    reason: A nota preserva a forma da expressão מְגִלַּת סֵפֶר, enquanto o texto principal usa a equivalência natural em português.
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Então olhei
  rationale: O waw consecutivo faz a narrativa avançar, e ראה introduz um novo momento visual. “Então olhei” soa natural em português e conserva a ação do profeta em primeira pessoa.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: הִנֵּה chama vividamente a atenção para o que surge diante do profeta. “E eis que” mantém a solenidade e o efeito de apresentação, inclusive em sua repetição.
- source_word: יָד
  choice: uma mão
  rationale: O hebraico menciona apenas “uma mão” e não identifica a quem ela pertence; a tradução mantém essa indefinição.
- source_word: שְׁלוּחָה
  choice: estava estendida
  rationale: No contexto, o particípio passivo de שלח descreve visualmente uma mão estendida, e não algo abstratamente “enviado”.
- source_word: אֵלַי
  choice: em minha direção
  rationale: A preposição אֶל expressa direção. Esta formulação comunica com clareza o movimento espacial sem sugerir, por si só, que o objeto já havia sido entregue.
- source_word: בּוֹ
  choice: nela
  rationale: Em português, “nela” retoma naturalmente “mão” e expressa que o rolo se encontrava na mão apresentada. O hebraico usa um sufixo masculino singular, embora יָד seja feminino; a tradução evita criar em português uma referência sem antecedente claro.
- source_word: מְגִלַּת סֵפֶר
  choice: um rolo
  rationale: A construção designa um documento em forma de rolo. “Um rolo” é a forma corrente e clara em português; a presença dos dois substantivos hebraicos é registrada em nota.
theological_decisions:
- issue: Identidade do dono da mão
  choice: Não identificar a quem pertence a mão
  alternative: “a mão de Deus” ou “a mão de um mensageiro angelical”
  rationale: O versículo diz somente que havia “uma mão” estendida em direção ao profeta. Identificar seu dono acrescentaria uma interpretação que o texto hebraico não explicita.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A repetição de “e eis que” foi mantida para reproduzir o efeito enfático e visionário do hebraico.
