base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/006.yaml
  text: But you[a], son of man, do not fear them, and do not fear their words, though briers and thorns are with you and you sit among scorpions. Do not fear their words, and do not be dismayed by their faces[b], for they are a rebellious house.
translation:
  language: pt
  text: Mas você, filho do homem, não tenha medo deles nem das palavras deles. Pois espinheiros[a] e espinhos estão com você, e você vive entre escorpiões. Não tenha medo das palavras deles nem se deixe intimidar por eles,[b] pois eles são uma casa rebelde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “espinheiros” é difícil e também foi entendido como “rebeldes”. Porém, a imagem de vegetação perigosa é favorecida pela associação com “espinhos” e “escorpiões”.
    reason: lexical_alternative
  - marker: b
    text: Hebraico, literalmente, “por causa do rosto deles”; isto é, de sua aparência ou presença intimidadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma recorrente do tratamento dirigido a Ezequiel e a forma masculina singular do hebraico.
- source_word: תִּירָא
  choice: não tenha medo
  rationale: Expressa de modo natural a proibição repetida e mantém sua força direta.
- source_word: דִּבְרֵיהֶם
  choice: as palavras deles
  rationale: Conserva o substantivo concreto e sua repetição retórica no versículo.
- source_word: סָרָבִים וְסַלּוֹנִים
  choice: espinheiros e espinhos
  rationale: Mantém a imagem vegetal de perigo favorecida pela associação imediata com escorpiões, sem ocultar a dificuldade lexical do primeiro termo.
- source_word: אוֹתָךְ
  choice: estejam ao seu redor
  rationale: Torna explícita em português a circunstância hostil indicada pela construção elíptica, sem convertê-la diretamente em agressão.
- source_word: עַקְרַבִּים
  choice: escorpiões
  rationale: Equivalente lexical direto, preservando a imagem vívida de perigo.
- source_word: יוֹשֵׁב
  choice: viva entre
  rationale: No contexto, comunica naturalmente a permanência de Ezequiel em meio a pessoas hostis; o sentido mais formal seria 'esteja sentado entre'.
- source_word: מִפְּנֵיהֶם
  choice: diante da presença deles
  rationale: Representa o hebraísmo literalmente relacionado ao 'rosto' e comunica a aparência ou presença intimidadora.
- source_word: תֵּחָת
  choice: fique apavorado
  rationale: Expressa o efeito de ser abalado ou intimidado, distinguindo-o ligeiramente do verbo repetido 'ter medo'.
- source_word: בֵּית מְרִי
  choice: uma casa rebelde
  rationale: Preserva a metáfora corporativa característica de Ezequiel e a ideia de rebeldia.
theological_decisions:
- issue: Sentido de אָדָם no tratamento בֶן אָדָם
  choice: filho do homem
  alternative: ser humano; mortal
  rationale: O tratamento divino recorrente dirigido ao profeta é masculino singular; a tradução formal preserva tanto a formulação quanto sua força literária no livro.
- issue: Força metafórica da oposição
  choice: manter as imagens de espinheiros, espinhos e escorpiões
  alternative: substituí-las por uma descrição abstrata de pessoas rebeldes ou hostis
  rationale: As imagens concretas são parte essencial da retórica profética e comunicam claramente perigo e hostilidade.
- issue: Ambiguidade lexical de סָרָבִים
  choice: espinheiros, com nota indicando a leitura alternativa
  alternative: rebeldes
  rationale: A sequência com espinhos e escorpiões favorece a imagem de vegetação perigosa, mas a dificuldade do termo e a leitura alternativa genuína não devem ser ocultadas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “não tenha medo” e “palavras deles” foi preservada. A ambiguidade de סָרָבִים requer nota adicional no texto final.
