  naturalness: O português é claro e de registro apropriado. «Não se deixe intimidar por eles» é mais natural e idiomático para a segunda proibição do que «não fique apavorado diante da presença deles», sem eliminar a nota sobre o literal «rosto».
  terminology: «Filho do homem» e «casa rebelde» mantêm a terminologia característica de Ezequiel. «Espinheiros e espinhos» é uma solução aceitável para a imagem vegetal, desde que a dificuldade de «espinheiros» seja sinalizada em nota.
