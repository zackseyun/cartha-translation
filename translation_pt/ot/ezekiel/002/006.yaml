revisions:
- from: Mas você, filho do homem, não tenha medo deles nem das palavras deles. Ainda que espinheiros e espinhos estejam ao seu redor e você viva entre escorpiões, não tenha medo das palavras deles nem fique apavorado diante da presença deles,[a] pois eles são uma casa rebelde.
  to: Mas você, filho do homem, não tenha medo deles nem das palavras deles. Pois espinheiros[a] e espinhos estão com você, e você vive entre escorpiões. Não tenha medo das palavras deles nem se deixe intimidar por eles,[b] pois eles são uma casa rebelde.
