  text: וַ/תָּ֧בֹא בִ֣/י ר֗וּחַ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר אֵלַ֔/י וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וָ/אֶשְׁמַ֕ע אֵ֖ת מִדַּבֵּ֥ר אֵלָֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/002.yaml
  text: And the Spirit entered into me when he spoke to me[a], and set me on my feet[b]; and I heard the one speaking to me.
translation:
  language: pt
  text: O Espírito entrou em mim quando ele falou comigo[a] e me pôs de pé; então ouvi aquele que falava comigo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um espírito entrou em mim quando ele falou comigo”. O hebraico רוּחַ pode significar “espírito”, “vento” ou “sopro”; aqui, o contexto favorece o Espírito de Deus capacitando Ezequiel.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “ouvi aquele que falava comigo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֗וּחַ
  choice: o Espírito
  rationale: No contexto da visão e do comissionamento profético, o termo se refere mais naturalmente ao Espírito de Deus, que capacita Ezequiel. Como o hebraico não traz artigo e רוּחַ também pode significar “espírito”, “vento” ou “sopro”, a alternativa é preservada em nota.
- source_word: וַתָּבֹא בִי
  choice: entrou em mim
  rationale: A construção בוא + ב indica movimento para dentro; “entrou em mim” preserva o caráter interior da ação melhor que “veio sobre mim”.
- source_word: כַּאֲשֶׁר דִּבֶּר אֵלַי
  choice: enquanto ele falava comigo
  rationale: A formulação expressa a simultaneidade temporal da entrada do Espírito com a fala, sem identificar além do que o contexto permite o referente do pronome.
- source_word: וַתַּעֲמִדֵנִי עַל רַגְלָי
  choice: me pôs de pé
  rationale: O hifil de עמד é causativo. “Pôs de pé” comunica esse sentido de modo natural e atual em português.
- source_word: וָאֶשְׁמַע
  choice: então ouvi
  rationale: “Então” torna clara em português a progressão narrativa marcada pela forma verbal hebraica.
- source_word: אֵת מִדַּבֵּר אֵלָי
  choice: quem falava comigo
  rationale: O particípio funciona como substantivo, literalmente “aquele que falava comigo”. A forma “quem falava comigo” é mais natural e mantém o referente sem nomeá-lo explicitamente.
theological_decisions:
- issue: Referente de רוּחַ
  choice: o Espírito, entendido contextualmente como o Espírito de Deus
  alternative: um espírito
  rationale: O Espírito que entra no profeta e o capacita a ficar em pé se encaixa melhor no contexto imediato de Ezequiel. A tradução não acrescenta elaboração doutrinária posterior, e a ausência do artigo hebraico é indicada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. “Pôs de pé” evita rigidez excessiva, e “quem falava comigo” conserva a construção substantivada sem explicitar indevidamente a identidade do falante.
