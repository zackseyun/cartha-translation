  terminology: «Filho do homem», «filhos de Israel», «nações rebeldes» e «transgredido contra mim» são escolhas adequadas e mantêm as distinções relevantes entre מרד e פשע. A nota de «Filho do homem» oferece alternativas legítimas, sem apresentar a expressão como título cristológico neste contexto.
