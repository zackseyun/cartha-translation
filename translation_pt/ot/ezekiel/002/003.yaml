  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ שׁוֹלֵ֨חַ אֲנִ֤י אֽוֹתְ/ךָ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גּוֹיִ֥ם הַ/מּוֹרְדִ֖ים אֲשֶׁ֣ר מָרְדוּ בִ֑/י הֵ֤מָּה וַ/אֲבוֹתָ/ם֙ פָּ֣שְׁעוּ בִ֔/י עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/003.yaml
  text: And he said to me[a], “Son of man, I am sending you to the sons of Israel, to the rebellious nations that have rebelled against me; they and their fathers have transgressed against me to this very day.”
translation:
  language: pt
  text: 'E ele me disse: “Filho do homem[a], eu estou enviando você aos filhos de Israel, às nações rebeldes que se rebelaram contra mim; eles e seus antepassados têm transgredido contra mim até o dia de hoje.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser humano” ou “mortal”.
    reason: Alternativas lexicais para בֶּן אָדָם, expressão que destaca a condição humana de Ezequiel.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma do tratamento profético recorrente dirigido a Ezequiel e sua ressonância intertextual, sem transformá-lo aqui em título cristológico. Alternativas lexicais são registradas em nota.
- source_word: שׁוֹלֵחַ אֲנִי אֹתְךָ
  choice: eu estou enviando você
  rationale: O particípio acompanhado do pronome explícito comunica vivacidade e iminência no comissionamento; a construção progressiva é natural no português brasileiro contemporâneo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Mantém de modo transparente a expressão hebraica e o vínculo tradicional com Israel, sem reduzir o referente apenas a homens.
- source_word: גּוֹיִם
  choice: nações
  rationale: Conserva o sentido básico do substantivo e o efeito retórico marcante de aplicar a Israel uma designação frequentemente usada para os povos ou nações.
- source_word: הַמּוֹרְדִים
  choice: rebeldes
  rationale: O adjetivo expressa naturalmente o caráter contínuo da revolta e concorda com “nações”.
- source_word: מָרְדוּ בִי
  choice: se rebelaram contra mim
  rationale: Repete a raiz semântica de “rebeldes”, reproduzindo a repetição enfática do hebraico e explicitando a força adversativa da preposição.
- source_word: פָּשְׁעוּ בִי
  choice: têm transgredido contra mim
  rationale: Distingue פשע de מרד e conserva a ideia de violação deliberada, com valor continuativo até o presente indicado pela expressão temporal.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: até este mesmo dia
  rationale: Expressa de maneira natural a ênfase de עֶצֶם na continuidade da transgressão até o próprio dia presente.
theological_decisions:
- issue: Se a acusação contra Israel deve ser suavizada pela substituição de גּוֹיִם
  choice: Manter “nações”, embora o referente seja Israel
  alternative: “povo” ou “israelitas”
  rationale: O hebraico aplica deliberadamente a Israel uma palavra comum para nações ou povos. Manter “nações” preserva o impacto judicial e a tensão retórica do texto.
- issue: Como traduzir o tratamento בֶּן אָדָם
  choice: Usar “Filho do homem” no texto principal
  alternative: “ser humano” ou “mortal”
  rationale: Aqui a expressão é o tratamento divino recorrente dado a Ezequiel, não um título cristológico. A tradução formal preserva tanto a repetição literária quanto a ressonância canônica, enquanto a nota registra alternativas legítimas.
- issue: Identificação de וַאֲבוֹתָם
  choice: “seus antepassados”
  alternative: “seus pais”
  rationale: Neste contexto histórico e corporativo, o termo abrange as gerações anteriores de Israel; “antepassados” evita restringi-lo indevidamente aos pais imediatos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a repetição “rebeldes/se rebelaram”, a expressão formal “filhos de Israel” e a formulação deliberadamente surpreendente “nações rebeldes”. O pronome divino permanece em minúscula conforme o uso editorial contemporâneo.
