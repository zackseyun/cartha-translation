  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔י/ךָ אַל תְּהִי מֶ֖רִי כְּ/בֵ֣ית הַ/מֶּ֑רִי פְּצֵ֣ה פִ֔י/ךָ וֶ/אֱכֹ֕ל אֵ֥ת אֲשֶׁר אֲנִ֖י נֹתֵ֥ן אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/008.yaml
  text: But you[a], son of man, hear what I am speaking to you. Do not be rebellious like the rebellious house. Open your mouth and eat what I am giving you.
translation:
  language: pt
  text: Mas você, filho do homem,[a] ouça o que lhe estou dizendo. Não seja rebelde como a casa rebelde. Abra a boca e coma o que eu lhe dou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mortal” ou “ser humano”.
    reason: Alternativas lexicais para בֶן־אָדָם; a expressão também funciona como forma de tratamento recorrente dirigida a Ezequiel.
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma de tratamento recorrente e literariamente marcante em Ezequiel; a nota registra alternativas sem desfazer o idioma hebraico no texto principal.
- source_word: שְׁמַע
  choice: ouça
  rationale: Mantém o sentido fundamental do imperativo, que no contexto implica atenção e acolhimento, sem explicitar além do hebraico a ideia de obedecer.
- source_word: מְדַבֵּר אֵלֶיךָ
  choice: eu lhe digo
  rationale: Expressa em português natural a fala divina imediata indicada pelo particípio; evita a formulação menos idiomática 'estou falando a você'.
- source_word: אַל תְּהִי מֶרִי
  choice: Não seja rebelde
  rationale: Converte naturalmente em adjetivo o substantivo hebraico que denota rebeldia, preservando a força direta da proibição.
- source_word: כְּבֵית הַמֶּרִי
  choice: como essa casa rebelde
  rationale: Mantém a metáfora corporativa de 'casa' e a expressão recorrente em Ezequiel; 'essa' identifica no contexto a casa já caracterizada pela rebeldia.
- source_word: פְּצֵה פִיךָ
  choice: Abra a boca
  rationale: Equivalente idiomático português do comando hebraico para abrir a boca.
- source_word: וֶאֱכֹל
  choice: e coma
  rationale: Preserva a coordenação e a sequência concreta dos imperativos na ação simbólica.
- source_word: אֵת אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ
  choice: o que eu lhe dou
  rationale: Comunica de modo corrente a ação presente e imediata do particípio נֹתֵן, sem tornar a frase pesada.
theological_decisions:
- issue: Tradução de אָדָם na forma profética de tratamento
  choice: filho do homem
  alternative: mortal; ser humano
  rationale: A expressão é uma forma vocativa fixa dirigida a Ezequiel, e não uma afirmação genérica sobre a humanidade. A tradução tradicional preserva sua repetição, força literária e possíveis ressonâncias intertextuais, enquanto a nota esclarece seu sentido hebraico.
translation_notes:
  register: Português moderno, claro e digno, com construção legível no Brasil e amplamente compreensível em outras variedades. A repetição 'rebelde... casa rebelde' conserva o efeito retórico do hebraico.
