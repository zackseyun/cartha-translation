base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/007.yaml
  text: You shall speak my words to them[a], whether they listen or whether they refuse, for they are rebellious.
translation:
  language: pt
  text: Você lhes falará as minhas palavras, quer escutem, quer se recusem a escutar[a], pois são rebeldes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quer ouçam, quer deixem de escutar”. A expressão hebraica contrasta escutar com recusar-se a dar atenção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: Você lhes falará
  rationale: O perfeito qal com a conjunção, neste contexto de comissão profética, tem força diretiva. O futuro em português expressa de modo digno e natural a ordem dada a Ezequiel.
- source_word: אֶת דְּבָרַי
  choice: as minhas palavras
  rationale: Mantém o plural concreto do hebraico e a ligação direta com aquilo que Deus diz, sem substituí-lo pelo mais interpretativo “minha mensagem”.
- source_word: אֲלֵיהֶם
  choice: lhes
  rationale: O pronome oblíquo expressa naturalmente em português o destinatário indicado pela preposição hebraica.
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: quer escutem, quer se recusem
  rationale: A construção correlativa traduz o contraste idiomático entre acolher a fala e recusar-se a dar-lhe atenção. “Escutem” preserva o campo auditivo de שׁמע sem explicitar em excesso a ideia de obedecer.
- source_word: כִּי
  choice: pois
  rationale: Introduz com clareza a razão pela qual o profeta deve falar independentemente da reação dos ouvintes.
- source_word: מְרִי הֵמָּה
  choice: são rebeldes
  rationale: Expressa de forma idiomática a caracterização predicativa. Não se acrescenta “casa”, palavra ausente neste versículo.
theological_decisions:
- issue: Se יִשְׁמְעוּ deve ser traduzido como “ouvir”, “escutar” ou “obedecer”
  choice: escutem
  alternative: ouçam; obedeçam
  rationale: שׁמע pode implicar obediência, mas aqui o contraste imediato com a recusa favorece uma tradução que mantenha tanto a dimensão auditiva quanto a possibilidade de acolhimento, sem transformar a implicação em afirmação explícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação preserva a concisão, o paralelismo e a força comissionadora do hebraico.
