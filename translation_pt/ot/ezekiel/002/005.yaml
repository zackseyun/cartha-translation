base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/005.yaml
  text: And whether they listen or refuse—for they are a rebellious house—they will know that a prophet has been among them[a][b].
translation:
  language: pt
  text: E, quer eles escutem, quer se recusem a escutar — pois são uma casa rebelde —, saberão que um profeta esteve entre eles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quer ouçam, quer se abstenham”; o hebraico contrasta literalmente “ouvir” com “cessar/abster-se”, que aqui tem o sentido de recusar-se a dar ouvidos à mensagem.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um profeta esteve no meio deles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִשְׁמְעוּ ... וְאִם יֶחְדָּלוּ
  choice: quer eles escutem, quer se recusem a escutar
  rationale: A construção condicional paralela apresenta duas respostas possíveis sem alterar o resultado. יִשְׁמְעוּ pode indicar ouvir com atenção ou dar ouvidos; יֶחְדָּלוּ significa literalmente cessar ou abster-se e, neste contexto, expressa a recusa em acolher a mensagem.
- source_word: בֵּית מְרִי
  choice: uma casa rebelde
  rationale: Preserva a metáfora hebraica de 'casa' e seu sentido coletivo, enquanto 'rebelde' traduz מְרִי de modo natural em português.
- source_word: וְיָדְעוּ
  choice: saberão
  rationale: A forma verbal, após a sequência condicional, tem sentido futuro e resultativo no contexto.
- source_word: נָבִיא
  choice: um profeta
  rationale: Tradução direta do substantivo, com sentido indefinido adequado ao contexto.
- source_word: הָיָה בְתוֹכָם
  choice: houve um profeta no meio deles
  rationale: A expressão significa literalmente que um profeta 'esteve/existiu no meio deles'. 'Houve um profeta no meio deles' é corrente em português e mantém a relevância posterior desse fato sem impor um aspecto verbal estranho ao idioma.
- source_word: וְהֵמָּה
  choice: E, quer eles
  rationale: A conjunção é preservada, e o pronome explícito comunica a ênfase do hebraico sem produzir uma construção artificial.
theological_decisions:
- issue: Natureza da resposta do povo
  choice: A presença do profeta será reconhecida, quer o povo dê ouvidos à mensagem, quer se recuse a fazê-lo.
  alternative: Entender o contraste principalmente como ouvir sons ou deixar de ouvir.
  rationale: No contexto profético, o contraste diz respeito a acolher ou rejeitar a mensagem. A tradução explicita esse valor pragmático sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a estrutura enfática e a metáfora coletiva do hebraico, evitando tanto literalismo obscuro quanto expansão interpretativa excessiva.
