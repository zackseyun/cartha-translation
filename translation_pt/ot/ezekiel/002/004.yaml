  yaml_path: translation/ot/ezekiel/002/004.yaml
  text: And the children are hard-faced and hard-hearted[a]; I am sending you to them, and you shall say to them[b], ‘Thus says the Lord GOD.’
translation:
  language: pt
  text: 'E os filhos são de rosto endurecido e de coração obstinado[a]. Eu envio você a eles, e você lhes dirá: “Assim diz o Senhor Yahweh”[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “duros de rosto e fortes de coração”, expressão que descreve pessoas desavergonhadas e obstinadas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Assim diz o Senhor DEUS”. O título hebraico é אֲדֹנָי יְהוִה (Adonai YHWH).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבָּנִים
  choice: Os filhos
  rationale: Mantém o substantivo masculino plural בָּנִים e seu artigo, embora no contexto designe coletivamente os israelitas mencionados anteriormente.
- source_word: קְשֵׁי פָנִים
  choice: de rosto endurecido
  rationale: Preserva a imagem concreta do hebraico, literalmente “duros de rosto”, indicando pessoas desavergonhadas e desafiadoras.
- source_word: וְחִזְקֵי לֵב
  choice: coração obstinado
  rationale: O hebraico diz literalmente “fortes de coração”; neste contexto, a expressão tem sentido negativo de teimosia interior, não de coragem.
- source_word: אֲנִי שׁוֹלֵחַ
  choice: Eu envio
  rationale: O pronome explícito com o particípio expressa a comissão presente ou iminente; a formulação é direta e natural em português.
- source_word: אוֹתְךָ אֲלֵיהֶם
  choice: você a eles
  rationale: אֶל marca a direção da missão de Ezequiel. “Você” oferece leitura moderna e amplamente compreensível.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: e você lhes dirá
  rationale: O qatal, no contexto da comissão, tem força futura e diretiva.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Conserva a fórmula profética tradicional e solene, com presente performativo natural em português.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa distintamente אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”, sem produzir a repetição “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha torna visível o nome próprio יהוה e preserva separadamente o título אֲדֹנָי. A alternativa tradicional é registrada em nota, sem impor uma leitura denominacional.
- issue: Sentido negativo de וְחִזְקֵי לֵב
  choice: coração obstinado
  alternative: fortes de coração
  rationale: No contexto da rebeldia de Israel, a força do coração é obstinação, não virtude ou coragem; a nota mantém acessível a forma literal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência profética preservada. A imagem hebraica do rosto foi mantida em forma inteligível; “coração obstinado” explicita o valor negativo da segunda expressão. Todos os marcadores de nota aparecem no texto.
