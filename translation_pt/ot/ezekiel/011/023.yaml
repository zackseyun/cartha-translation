id: EZK.11.23
reference: Ezekiel 11:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יַּ֨עַל֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל תּ֣וֹךְ הָ/עִ֑יר וַֽ/יַּעֲמֹד֙ עַל הָ/הָ֔ר אֲשֶׁ֖ר מִ/קֶּ֥דֶם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/023.yaml
  text: And the glory of Yahweh went up from the midst of the city and stood on the mountain that is east of the city[a][b].
translation:
  language: pt
  text: Então a glória de Yahweh subiu do meio da cidade e parou sobre o monte que fica a leste da cidade.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se elevou”, em vez de “subiu”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “que está a oriente da cidade”; conforme a orientação espacial, também pode significar “que está diante da cidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: subiu
  rationale: עלה expressa movimento para cima; “subiu” é natural em português e preserva o movimento concreto da glória na visão.
- source_word: כְּבוֹד יְהוָה
  choice: a glória de Yahweh
  rationale: Preserva a relação construta e o peso teológico de כָּבוֹד como manifestação da presença divina, mantendo o nome pessoal יְהוָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o Tetragrama como nome pessoal, em vez de substituí-lo por um título.
- source_word: מֵעַל תּוֹךְ הָעִיר
  choice: do meio da cidade
  rationale: Forma idiomática que comunica a partida da região central/interior da cidade, sem reproduzir de modo artificial a combinação hebraica de “de sobre” e “meio”.
- source_word: וַיַּעֲמֹד
  choice: parou
  rationale: No contexto de uma sequência de deslocamento, עמד indica que a glória cessou o movimento e permaneceu sobre o monte; “parou” comunica isso naturalmente, enquanto “ficou de pé” seria inadequado para a glória.
- source_word: עַל הָהָר
  choice: sobre o monte
  rationale: הַר pode designar monte ou montanha; “monte” é natural para esta referência topográfica, e “sobre” preserva a posição elevada sugerida pela visão.
- source_word: אֲשֶׁר מִקֶּדֶם לָעִיר
  choice: que fica a leste da cidade
  rationale: Em uma descrição geográfica, מִקֶּדֶם provavelmente indica o lado oriental; a formulação é clara e idiomática.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo por um título.
- issue: Descrição da partida da glória divina
  choice: 'Linguagem espacial concreta: “subiu do meio da cidade e parou sobre o monte”'
  alternative: Interpretar explicitamente o ato como abandono definitivo ou retirada da presença de Deus
  rationale: A tradução mantém apenas o movimento descrito pela visão, sem acrescentar uma conclusão teológica não expressa neste versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Então” dá continuidade natural à narrativa; “monte” e “a leste” mantêm clareza topográfica. Os marcadores aparecem no texto principal na ordem correspondente.
