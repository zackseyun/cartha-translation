  text: who say[a], ‘It is not near to build houses. This city is the pot[b], and we are the meat.’
translation:
  language: pt
  text: 'os que dizem[a]: “O tempo de construir casas não está próximo. Esta cidade é a panela, e nós somos a carne.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não será tão cedo construir casas” ou “Não está próxima a construção de casas”. O hebraico é elíptico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: os quais dizem
  rationale: O particípio com artigo tem valor substantivado e retoma os homens do contexto; a oração relativa preserva essa ligação de modo claro.
- source_word: לֹא בְקָרוֹב
  choice: Não está próximo o tempo
  rationale: A expressão hebraica é elíptica. A inserção de “o tempo” produz uma frase inteligível em português sem definir de modo indevido se a proximidade se refere ao momento de construir ou à urgência da situação.
- source_word: בְּנוֹת בָּתִּים
  choice: de construir casas
  rationale: Tradução direta do infinitivo construto com seu objeto, sem acrescentar uma ideia reflexiva ausente no hebraico.
- source_word: הִיא הַסִּיר
  choice: Esta cidade é a panela
  rationale: O pronome feminino provavelmente aponta para Jerusalém, pressuposta pelo contexto. Explicitar “esta cidade” torna o referente claro, enquanto “panela” preserva a imagem simples do hebraico.
- source_word: וַאֲנַחְנוּ הַבָּשָׂר
  choice: e nós somos a carne
  rationale: No contexto culinário, “carne” comunica naturalmente o alimento dentro da panela e também corresponde de perto ao sentido de בָּשָׂר.
theological_decisions:
- issue: Sentido do provérbio sobre a panela e a carne
  choice: Manter a metáfora sem explicar sua intenção no texto principal.
  alternative: Interpretá-la explicitamente como confiança na proteção de Jerusalém ou como desprezo sarcástico pelo aviso profético.
  rationale: O enunciado admite mais de uma compreensão quanto à atitude dos falantes; a tradução deve conservar essa tensão e deixar que o contexto posterior esclareça a imagem.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível no Brasil e em outras comunidades lusófonas. A formulação preserva a concisão e a ambiguidade do provérbio hebraico.
