revisions:
- from: 'Filho do homem, seus irmãos, seus irmãos, seus parentes ligados pelo direito de resgate[a], e toda a casa de Israel, toda ela, são aqueles a quem os habitantes de Jerusalém disseram: “Fiquem longe de Yahweh! A terra foi dada a nós como possessão[b]”.'
  to: 'Filho do homem, seus irmãos, seus irmãos, os homens do seu resgate[a], e toda a casa de Israel, toda ela, são aqueles a quem os habitantes de Jerusalém disseram: “Fiquem longe de Yahweh! A terra nos foi dada como propriedade[b].”'
  rationale: A revisão substitui uma paráfrase interpretativa da expressão hebraica difícil por «os homens do seu resgate», que conserva o vínculo lexical com גאולה e deixa sua referência aberta, conforme a incerteza do original. Também atualiza «possessão» para «propriedade» e ajusta a construção passiva para maior naturalidade em português, sem alterar a reivindicação expressa no texto.
