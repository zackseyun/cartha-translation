source:
  edition: WLC
  text: בֶּן אָדָ֗ם אַחֶ֤י/ךָ אַחֶ֨י/ךָ֙ אַנְשֵׁ֣י גְאֻלָּתֶ֔/ךָ וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה אֲשֶׁר֩ אָמְר֨וּ לָ/הֶ֜ם יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם רַֽחֲקוּ֙ מֵ/עַ֣ל יְהוָ֔ה לָ֥/נוּ הִ֛יא נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/015.yaml
  text: Son of man[a], your brothers, your brothers, the men of your redemption, and all the house of Israel, all of it—these are the ones to whom the inhabitants of Jerusalem have said, ‘Go far away from Yahweh[b]; this land has been given to us as a possession.’
translation:
  language: pt
  text: 'Filho do homem, seus irmãos, seus irmãos, os homens do seu resgate[a], e toda a casa de Israel, toda ela, são aqueles a quem os habitantes de Jerusalém disseram: “Fiquem longe de Yahweh! A terra nos foi dada como propriedade[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil e usa a raiz relacionada ao resgate e ao parente-resgatador. Também pode ser traduzida como “os homens da sua redenção”, “os homens do seu parentesco” ou, de modo mais interpretativo, “seus companheiros de exílio”.
    reason: lexical_alternative
  - marker: b
    text: Ou “como herança”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a fórmula característica com que Ezequiel é chamado e preserva seu uso profético tradicional.
- source_word: אַחֶיךָ אַחֶיךָ
  choice: seus irmãos, seus irmãos
  rationale: Conserva a repetição enfática do hebraico, sem harmonizá-la ou suprimi-la.
- source_word: אַנְשֵׁי גְאֻלָּתֶךָ
  choice: seus parentes ligados pelo direito de resgate
  rationale: Expressa em português natural tanto a relação de parentesco quanto a raiz hebraica ligada ao resgate exercido pelo parente-resgatador, sem ocultar a dificuldade da expressão.
- source_word: וְכָל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: e toda a casa de Israel, toda ela
  rationale: Preserva a expressão coletiva tradicional “casa de Israel” e a retomada enfática singular de כֻּלֹּה.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: os habitantes de Jerusalém
  rationale: É uma tradução clara e natural da construção participial e mantém o contraste contextual com os exilados.
- source_word: רַחֲקוּ מֵעַל יְהוָה
  choice: Fiquem longe de Yahweh
  rationale: Entende a forma verbal como imperativo plural dentro da fala direta, preservando a ideia de afastamento sem explicitar se é apenas geográfico, cultual ou relacional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לָנוּ הִיא נִתְּנָה הָאָרֶץ
  choice: A terra foi dada a nós
  rationale: Mantém a construção passiva e a reivindicação enfática dos habitantes de Jerusalém.
- source_word: לְמוֹרָשָׁה
  choice: como possessão
  rationale: Comunica a ideia de uma propriedade recebida e conservada, deixando “herança” como alternativa lexical em nota.
theological_decisions:
- issue: Forma portuguesa do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O texto apresenta diretamente o Tetragrama; “Yahweh” preserva o nome pactual em forma transliterada.
- issue: Sentido de אַנְשֵׁי גְאֻלָּתֶךָ
  choice: seus parentes ligados pelo direito de resgate
  alternative: os homens da sua redenção; seus companheiros de exílio; os homens do seu parentesco
  rationale: A expressão hebraica é difícil. A opção adotada mantém visíveis tanto o parentesco quanto o campo semântico do resgate, sem reduzi-la silenciosamente a uma identificação específica dos exilados.
- issue: Natureza do afastamento ordenado em רַחֲקוּ מֵעַל יְהוָה
  choice: Fiquem longe de Yahweh
  alternative: Vocês estão longe de Yahweh
  rationale: A forma é tomada como imperativo na fala dos habitantes de Jerusalém. A tradução não resolve se o afastamento alegado é geográfico, cultual ou espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática e a expressão coletiva “casa de Israel” foram mantidas; a difícil linguagem jurídica de parentesco e resgate foi tornada legível sem eliminar sua ambiguidade.
