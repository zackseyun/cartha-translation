review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a fórmula «Filho do homem», a repetição de «seus irmãos», «casa de Israel», o imperativo plural dirigido aos ausentes e a reivindicação de que a terra foi dada aos habitantes de Jerusalém. Contudo, «seus parentes ligados pelo direito de resgate» resolve de maneira excessiva uma expressão hebraica notoriamente difícil (אַנְשֵׁי גְאֻלָּתֶךָ), introduzindo de modo afirmativo parentesco e um direito específico que o texto, em sua formulação obscura, não explicita com essa precisão.
  naturalness: O registro é claro e apropriado. «A terra nos foi dada como propriedade» é mais idiomático em português atual do que «foi dada a nós como possessão», sem perda de sentido. A formulação mais literal para a expressão difícil permanece algo marcada, mas a nota explica adequadamente essa dificuldade.
  terminology: «Yahweh», «Filho do homem» e «casa de Israel» são mantidos de modo consistente. «Homens do seu resgate» conserva visível a raiz de resgate sem transformar em leitura principal uma interpretação de parentesco ou de condição de exílio. «Propriedade» comunica bem מוֹרָשָׁה; a alternativa «herança» deve permanecer em nota.
  issues:
  - severity: medium
    issue: A expressão «seus parentes ligados pelo direito de resgate» é interpretativa demais para אַנְשֵׁי גְאֻלָּתֶךָ.
    rationale: Embora a expressão possa envolver parentesco e o campo semântico do resgate, sua sintaxe e referência exatas são debatidas. A redação afirma um «direito de resgate» e identifica os homens como parentes, restringindo uma ambiguidade que o hebraico não resolve inequivocamente.
  - severity: low
    issue: «Possessão» é menos natural no português geral contemporâneo neste contexto.
    rationale: É lexicalmente defensável, mas «propriedade» é mais fluente e preserva a ideia de terra recebida como bem possuído; «herança» pode ser indicada em nota como alternativa.
