  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִ/תּוֹכָ֔/הּ וְ/נָתַתִּ֥י אֶתְ/כֶ֖ם בְּ/יַד זָרִ֑ים וְ/עָשִׂ֛יתִי בָ/כֶ֖ם שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/009.yaml
  text: And I will bring you out from its midst[a], and I will give you into the hand of foreigners[b], and I will execute judgments on you.
translation:
  language: pt
  text: Eu tirarei vocês do meio dela, entregarei vocês nas mãos de estrangeiros e executarei juízos contra vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: Eu os tirarei
  rationale: O hifil de יצא tem sentido causativo, “fazer sair, tirar”. “Tirarei” expressa isso de modo direto e natural em português.
- source_word: מִתּוֹכָהּ
  choice: do meio dela
  rationale: תּוֹךְ indica o interior ou o meio; o sufixo feminino singular retoma a cidade, isto é, Jerusalém, sem que seja necessário explicitar o nome no versículo.
- source_word: וְנָתַתִּי אֶתְכֶם בְּיַד
  choice: os entregarei nas mãos de
  rationale: A construção נתן + בְּיַד é uma expressão idiomática que significa entregar alguém ao poder de outrem. “Entregarei nas mãos de” conserva a imagem hebraica e é idiomático em português.
- source_word: זָרִים
  choice: estrangeiros
  rationale: No contexto, זָרִים designa pessoas de outras nações, aqui agentes estrangeiros de conquista e julgamento; “estrangeiros” é claro e atual.
- source_word: וְעָשִׂיתִי בָכֶם שְׁפָטִים
  choice: e executarei juízos contra vocês
  rationale: A expressão descreve a realização de atos judiciais punitivos. “Executarei juízos” preserva a formulação jurídica e “contra vocês” deixa clara a direção adversativa do julgamento.
theological_decisions:
- issue: Referente do sufixo feminino em מִתּוֹכָהּ
  choice: O pronome “dela” retoma implicitamente Jerusalém, a cidade.
  alternative: Explicitar “do meio da cidade”.
  rationale: O contexto identifica a cidade como referente, mas o hebraico emprega apenas o sufixo pronominal; manter “dela” preserva essa forma sem acrescentar um substantivo ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens centrais do hebraico foram mantidas, enquanto a expressão idiomática de entrega ao poder alheio foi vertida naturalmente como “nas mãos de”.
