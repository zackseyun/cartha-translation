  yaml_path: translation/ot/ezekiel/011/021.yaml
  text: But as for those whose heart goes after their detestable things and their abominations[a], I have brought their way upon their own heads[b], declares the Lord GOD.
translation:
  language: pt
  text: Mas, quanto àqueles cujo coração vai atrás de suas coisas detestáveis[a][b] e de suas abominações, fiz recair sobre a própria cabeça deles o seu caminho — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “o coração deles vai para o coração de suas coisas detestáveis e de suas abominações”. A expressão indica que são interiormente dedicados a elas.'
    reason: lexical_alternative
  - marker: b
    text: Ou “ídolos”. O termo hebraico frequentemente se refere a objetos cultuais detestáveis, mas pode ter sentido mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל
  choice: Mas, quanto àqueles
  rationale: Introduz, no contexto, um contraste tópico com a promessa dos versículos anteriores e permite que a construção hebraica seguinte seja expressa naturalmente em português.
- source_word: לֵב שִׁקּוּצֵיהֶם וְתוֹעֲבוֹתֵיהֶם לִבָּם הֹלֵךְ
  choice: cujo coração vai atrás do coração de suas coisas detestáveis e de suas abominações
  rationale: Preserva a repetição incomum de לֵב ('coração') e a metáfora de seguir, sem decidir silenciosamente se 'coração de' significa essência, centro ou devoção interior.
- source_word: שִׁקּוּצֵיהֶם
  choice: suas coisas detestáveis
  rationale: שִׁקּוּץ frequentemente designa ídolos ou objetos cultuais repugnantes, mas é lexicalmente mais amplo; a formulação evita restringir indevidamente o referente.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: e de suas abominações
  rationale: Mantém a força profética de תּוֹעֵבָה e a distingue do termo anterior.
- source_word: דַּרְכָּם
  choice: o seu caminho
  rationale: Conserva a metáfora hebraica convencional do caminho como conduta, sem reduzi-la apenas a atos isolados.
- source_word: בְּרֹאשָׁם
  choice: sobre a própria cabeça deles
  rationale: Reproduz o idioma de retribuição que recai sobre os responsáveis, tornando explícito em português o valor reflexivo.
- source_word: נָתַתִּי
  choice: farei recair
  rationale: Embora a forma hebraica seja um perfeito ('dei/pus'), no discurso profético pode apresentar como consumada uma ação futura e certa; 'farei recair' comunica de modo idiomático a retribuição anunciada, em harmonia com o contexto.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética 'declara'; 'Senhor Yahweh' distingue אֲדֹנָי do nome divino יהוה e preserva este como nome próprio.
theological_decisions:
- issue: Valor temporal do perfeito נָתַתִּי na declaração de juízo
  choice: farei recair
  alternative: fiz recair
  rationale: O perfeito pode descrever o juízo futuro como certo ou já determinado. O contexto imediato contrapõe a restauração prometida ao destino dos idólatras; o futuro oferece português natural, enquanto a nota preserva a forma verbal literal.
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução diferencia o título אֲדֹנָי ('Senhor') do nome próprio יהוה ('Yahweh'), sem fundi-los nem substituir o nome por outro título.
- issue: Interpretação de שִׁקּוּצִים
  choice: coisas detestáveis
  alternative: ídolos
  rationale: O termo frequentemente se refere a ídolos, mas não exige essa identificação em todos os casos; a tradução mantém a extensão semântica e registra a alternativa em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A formulação principal conserva deliberadamente a repetição estranha de 'coração' por ela estar presente no texto massorético; a nota esclarece o provável valor idiomático. 'Abominações' mantém o tom profético solene, e 'Senhor Yahweh' preserva a distinção entre título e nome divino.
