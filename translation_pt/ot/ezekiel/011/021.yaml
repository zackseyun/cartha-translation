  terminology: “Coisas detestáveis” e “abominações” mantêm a diferenciação dos dois termos hebraicos sem restringir indevidamente o primeiro a ídolos. “Senhor Yahweh” preserva a distinção entre אֲדֹנָי e יהוה, conforme a diretriz fornecida.
