base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/024.yaml
  text: Then the Spirit lifted me up and brought me to the exiles in Chaldea[a], in the vision by the Spirit of God[d][c][b]; and the vision that I had seen went up from me.
translation:
  language: pt
  text: Então o Espírito me levantou e me levou à comunidade dos exilados[a], na Caldeia, na visão pelo Espírito de Deus[b]. E a visão que eu tinha visto subiu de sobre mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aos exilados». O hebraico traz literalmente «ao exílio», expressão que pode designar coletivamente a comunidade deportada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «no Espírito de Deus». A preposição hebraica pode indicar tanto o meio ou agente («pelo») quanto a esfera («no»).'
    reason: alternative_reading
  - marker: c
    text: 'Literalmente: «subiu de sobre mim»; também pode ser traduzido por «afastou-se de mim».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: Então o Espírito
  rationale: רוּחַ pode significar espírito, vento ou sopro; no contexto do transporte visionário de Ezequiel e da expressão posterior «Espírito de Deus», «o Espírito» é a leitura mais natural. «Então» expressa com naturalidade a progressão narrativa do וְ.
- source_word: נְשָׂאַתְנִי
  choice: me levantou
  rationale: נשא abrange levantar e carregar. «Me levantou» conserva a imagem concreta e concorda com a linguagem recorrente do transporte visionário em Ezequiel.
- source_word: וַתְּבִיאֵנִי
  choice: me levou
  rationale: O hifil de בוא significa fazer chegar ou trazer. Em português, «me levou» soa natural para o movimento até o destino sem perder o sentido causativo.
- source_word: כַשְׂדִּימָה
  choice: na Caldeia
  rationale: A forma direcional aponta para a região dos caldeus. Como o verbo já indica chegada ao destino, «na Caldeia» é idiomático em português e preserva a referência geográfica, sem modernizá-la para «Babilônia».
- source_word: אֶל הַגּוֹלָה
  choice: à comunidade dos exilados
  rationale: הַגּוֹלָה pode designar coletivamente os deportados, não apenas a condição abstrata de exílio. A formulação explicita esse valor coletivo de modo natural.
- source_word: בַּמַּרְאֶה
  choice: numa visão
  rationale: מַרְאֶה aqui designa a experiência visionária profética. «Numa visão» comunica que o transporte ocorreu no âmbito da visão.
- source_word: בְּרוּחַ אֱלֹהִים
  choice: pelo Espírito de Deus
  rationale: A preposição בְּ pode indicar meio ou esfera. No contexto, «pelo» apresenta o Espírito de Deus como agente ou meio, enquanto a nota preserva a possibilidade de «no Espírito de Deus».
- source_word: וַיַּעַל מֵעָלַי
  choice: retirou-se de mim
  rationale: Literalmente, a expressão diz que a visão «subiu de sobre mim». «Retirou-se de mim» comunica em português natural o encerramento da experiência, enquanto a nota conserva a imagem vertical do hebraico.
- source_word: הַמַּרְאֶה אֲשֶׁר רָאִיתִי
  choice: a visão que eu tinha visto
  rationale: Mantém a repetição de מַרְאֶה e a sequência temporal indicada pelo contexto, sem eliminar a formulação enfática do hebraico.
theological_decisions:
- issue: Se רוּחַ deve ser entendido de maneira impessoal («vento» ou «sopro») ou como referência ao Espírito
  choice: Espírito nas duas ocorrências, sendo a segunda explicitamente «Espírito de Deus»
  alternative: vento ou sopro
  rationale: O contexto imediato é de transporte e revelação proféticos, e a segunda ocorrência identifica a רוּחַ como pertencente a Deus. «Espírito» preserva a coerência narrativa e teológica sem acrescentar uma definição doutrinária além do texto.
- issue: Valor da preposição בְּ em בְּרוּחַ אֱלֹהִים
  choice: pelo Espírito de Deus
  alternative: no Espírito de Deus
  rationale: A construção admite tanto agência ou meio quanto esfera. O texto principal usa a leitura instrumental mais provável no contexto, e a nota mantém a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi ajustada para evitar que «na Caldeia» pareça modificar «visão». As notas preservam o caráter coletivo de הַגּוֹלָה, a ambiguidade da preposição em בְּרוּחַ e a imagem literal de subida em וַיַּעַל מֵעָלַי.
