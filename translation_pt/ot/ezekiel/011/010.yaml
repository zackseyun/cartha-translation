id: EZK.11.10
reference: Ezekiel 11:10
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בַּ/חֶ֣רֶב תִּפֹּ֔לוּ עַל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפּ֣וֹט אֶתְ/כֶ֑ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/010.yaml
  text: You will fall by the sword; I will judge you at the border of Israel[a], and you will know that I am Yahweh.
translation:
  language: pt
  text: Vocês cairão à espada; eu os julgarei na fronteira de Israel[a], e vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre o limite de Israel”. A expressão hebraica pode indicar localização na fronteira ou sobre o limite territorial de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: à espada
  rationale: A preposição בְּ indica aqui instrumento ou meio. A expressão portuguesa “cair à espada” conserva a imagem concreta e comunica morte violenta.
- source_word: תִּפֹּלוּ
  choice: vocês cairão
  rationale: Mantém o sentido literal de נפל e sua imagem de queda, enquanto “à espada” deixa claro o caráter fatal no contexto de juízo.
- source_word: עַל גְּבוּל יִשְׂרָאֵל
  choice: na fronteira de Israel
  rationale: גְּבוּל pode significar fronteira, limite ou território; com עַל, a frase indica localização junto à fronteira. “Na fronteira” é natural em português, sem excluir a nuance de “sobre/no limite” registrada em nota.
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: eu os julgarei
  rationale: Tradução direta de שׁפט; o contexto já comunica que se trata de juízo punitivo, sem necessidade de explicitação adicional.
- source_word: וִידַעְתֶּם
  choice: e vocês saberão
  rationale: Preserva a coordenação hebraica e o valor futuro/resultativo da forma verbal, sem acrescentar o interpretativo “então”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”.
- issue: Força do verbo שׁפט neste contexto de punição
  choice: eu os julgarei
  alternative: executarei juízo contra vocês
  rationale: A formulação direta preserva a amplitude lexical do verbo, enquanto o contexto da espada deixa evidente que o juízo é punitivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”, “os julgarei”). A construção “cairão à espada” preserva a imagem hebraica em registro bíblico corrente. O ponto e vírgula acompanha a progressão solene entre morte, juízo e reconhecimento de Yahweh.
