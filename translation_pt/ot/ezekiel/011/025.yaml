base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/025.yaml
  text: Then I spoke to the exiles all the words of Yahweh that he had shown me[a].
translation:
  language: pt
  text: Então falei aos exilados todas as palavras de Yahweh que ele me havia mostrado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, “o exílio”, expressão coletiva que designa a comunidade dos exilados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: Então falei
  rationale: O wayyiqtol de דבר dá continuidade à narrativa. “Então falei” expressa essa sequência de modo natural em português.
- source_word: אֶל הַגּוֹלָה
  choice: aos exilados
  rationale: הַגּוֹלָה é um singular coletivo que designa a comunidade deportada. “Aos exilados” comunica claramente o referente em português moderno.
- source_word: אֵת כָּל דִּבְרֵי
  choice: todas as palavras de
  rationale: A formulação preserva a referência explícita às “palavras”, mantendo o caráter verbal da revelação, em vez de reduzi-la a “tudo o que”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, sem substituí-lo por um título.
- source_word: אֲשֶׁר הֶרְאַנִי
  choice: que ele me havia mostrado
  rationale: O hifil de ראה indica fazer ver ou mostrar. O mais-que-perfeito situa naturalmente a revelação antes do relato feito aos exilados.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal em transliteração, em vez de substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e proximidade ao hebraico. A nota preserva o dado lexical do singular coletivo sem tornar o texto principal artificial.
