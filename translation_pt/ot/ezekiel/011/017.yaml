source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ וְ/קִבַּצְתִּ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/אָסַפְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצוֹתֶ֖ם בָּ/הֶ֑ם וְ/נָתַתִּ֥י לָ/כֶ֖ם אֶת אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/017.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: I will gather you from the peoples and assemble you from the lands where you have been scattered[b], and I will give you the land of Israel.’'
translation:
  language: pt
  text: 'Por isso, diga: “Assim diz o Senhor Yahweh[a]: Eu os reunirei dentre os povos[b] e os ajuntarei das terras em que vocês foram espalhados; e lhes darei a terra de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Senhor Yahweh”; alternativamente, “Senhor DEUS”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “as nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz a consequência do oráculo anterior de forma natural, preservando o vínculo lógico do hebraico.
- source_word: אֱמֹר
  choice: diga
  rationale: Imperativo dirigido ao profeta; esta é a forma simples e idiomática em português.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Mantém a fórmula profética tradicional com clareza e dignidade.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Traduz os dois elementos do título composto e conserva explicitamente o nome divino YHWH.
- source_word: וְקִבַּצְתִּי
  choice: Eu os reunirei
  rationale: קבץ descreve a reunião de pessoas dispersas; “reunirei” é direto e natural.
- source_word: הָעַמִּים
  choice: os povos
  rationale: Reflete o plural de עַם sem o limitar necessariamente a Estados ou entidades políticas.
- source_word: וְאָסַפְתִּי
  choice: os ajuntarei
  rationale: Preserva o paralelismo quase sinonímico com קבץ, usando um verbo distinto em português.
- source_word: הָאֲרָצוֹת
  choice: as terras
  rationale: Refere-se aos diversos territórios da dispersão; “terras” mantém a amplitude do termo.
- source_word: אֲשֶׁר נְפֹצוֹתֶם בָּהֶם
  choice: em que vocês foram espalhados
  rationale: Reproduz o sentido passivo da dispersão e a referência locativa às terras.
- source_word: וְנָתַתִּי לָכֶם
  choice: e lhes darei
  rationale: Tradução concisa e natural de נתן com objeto indireto plural.
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: a terra de Israel
  rationale: No contexto da restauração do exílio, o sintagma denota o território de Israel, não apenas seu solo físico.
theological_decisions:
- issue: Tradução do título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: “Senhor Yahweh” representa tanto אֲדֹנָי quanto o nome divino YHWH, evitando ocultar o nome próprio presente no texto hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O pronome plural “vocês” torna explícito o destinatário coletivo; “reunirei” e “ajuntarei” preservam o paralelismo verbal do hebraico sem soar excessivamente técnico.
