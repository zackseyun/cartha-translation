source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כִּ֤י הִרְחַקְתִּי/ם֙ בַּ/גּוֹיִ֔ם וְ/כִ֥י הֲפִֽיצוֹתִ֖י/ם בָּ/אֲרָצ֑וֹת וָ/אֱהִ֤י לָ/הֶם֙ לְ/מִקְדָּ֣שׁ מְעַ֔ט בָּ/אֲרָצ֖וֹת אֲשֶׁר בָּ֥אוּ שָֽׁם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/016.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: Though I removed them far off among the nations, and though I scattered them among the lands, yet I became for them a little sanctuary in the lands where they had gone.’'
translation:
  language: pt
  text: 'Portanto, diga[a]: “Assim diz o Senhor Yahweh: Embora eu os tenha afastado para longe entre as nações e os tenha espalhado pelas terras, tornei-me um pequeno santuário para eles nas terras para onde foram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um santuário por pouco tempo”. A expressão hebraica pode indicar um santuário pequeno ou limitado, ou um santuário por um breve período.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן אֱמֹר
  choice: Portanto, diga
  rationale: Preserva a inferência de לָכֵן e o imperativo dirigido ao profeta em português natural.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética tradicional, concisa e próxima do hebraico.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a repetição artificial ‘Senhor SENHOR’.
- source_word: כִּי הִרְחַקְתִּים ... וְכִי הֲפִיצוֹתִים
  choice: Embora eu os tenha afastado ... e os tenha espalhado
  rationale: Entende as orações com כִּי como concessivas diante da declaração seguinte e conserva explicitamente a ação divina no exílio.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Expressa os povos estrangeiros entre os quais os exilados foram postos, sem a possível carga neotestamentária de ‘gentios’.
- source_word: בָּאֲרָצוֹת
  choice: por diversas terras
  rationale: Comunica de modo natural a dispersão por múltiplos territórios e preserva o plural hebraico.
- source_word: וָאֱהִי לָהֶם
  choice: tornei-me para eles
  rationale: 'Preserva o valor verbal passado de וָאֱהִי e o contraste contextual: apesar da dispersão, Deus se tornou santuário para eles.'
- source_word: לְמִקְדָּשׁ מְעַט
  choice: um pequeno santuário
  rationale: Mantém na linha principal a leitura qualitativa mais direta, sem eliminar a possível leitura temporal, registrada em nota.
- source_word: בָּאֲרָצוֹת אֲשֶׁר בָּאוּ שָׁם
  choice: nas terras para onde foram
  rationale: Reproduz com clareza o destino do deslocamento, sem impor ao verbo uma anterioridade além da necessária em português.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução explicita o nome da aliança e conserva o título que o precede, sem fundir os dois elementos.
- issue: Sentido de מְעַט em לְמִקְדָּשׁ מְעַט
  choice: um pequeno santuário
  alternative: um santuário por pouco tempo
  rationale: A leitura qualitativa é adequada ao contexto, mas a construção hebraica permite leitura temporal; a nota preserva essa ambiguidade genuína.
- issue: Relação entre o exílio e a presença divina
  choice: Embora ... tornei-me para eles
  alternative: Porque ... fui para eles
  rationale: A formulação concessiva torna claro o contraste contextual sem negar que o próprio Deus declara ter causado o afastamento e a dispersão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e os tempos verbais foram escolhidos por naturalidade, mantendo a agência divina, o contraste e a ambiguidade central do hebraico.
