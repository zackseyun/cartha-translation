  text: You have multiplied your slain in this city and filled its streets with the slain[a][b].
translation:
  language: pt
  text: Vocês multiplicaram seus mortos nesta cidade e encheram as ruas da cidade de mortos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que foram mortos” ou “seus cadáveres”. O termo hebraico indica especificamente pessoas mortas de forma violenta.
    reason: lexical_alternative
  - marker: b
    text: Ou “suas praças” ou “seus espaços públicos”, em vez de “ruas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּיתֶם
  choice: multiplicaram
  rationale: O hifil perfeito na segunda pessoa do plural de רבה expressa fazer aumentar ou tornar numerosos; “multiplicaram” preserva a força causativa e resultativa.
- source_word: חַלְלֵיכֶם
  choice: os que foram mortos
  rationale: חלל designa pessoas mortas de forma violenta. A expressão comunica isso em português atual e mantém a relação dessas vítimas com os destinatários, embora explicite menos literalmente o sufixo possessivo.
- source_word: בָּעִיר הַזֹּאת
  choice: nesta cidade
  rationale: Tradução locativa direta que preserva a ênfase do demonstrativo e soa natural em português.
- source_word: וּמִלֵּאתֶם
  choice: e encheram
  rationale: O piel perfeito na segunda pessoa do plural de מלא significa “encher”; a coordenação mantém o aspecto da primeira forma verbal sem repetição desnecessária.
- source_word: חוּצֹתֶיהָ
  choice: suas ruas
  rationale: No contexto urbano, חוּצוֹת pode indicar ruas, praças ou espaços públicos. “Ruas” é a opção mais natural e ampla no português contemporâneo.
- source_word: חָלָל
  choice: mortos
  rationale: O singular hebraico tem sentido coletivo e retoma o vocábulo anterior para os mortos violentamente; “mortos” produz uma frase portuguesa natural, com a nuance registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de terceira pessoa usadas para o pronome “vocês”. A repetição de “mortos” preserva a ligação lexical do hebraico; as notas registram tanto a força violenta de חלל quanto a amplitude semântica de חוּצוֹת.
