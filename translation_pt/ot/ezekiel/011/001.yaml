base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/001.yaml
  text: Then the Spirit lifted me up and brought me to the east gate of the house of Yahweh[a], which faces eastward. And behold, at the entrance of the gate were twenty-five men, and I saw among them Jaazaniah son of Azzur and Pelatiah son of Benaiah[c][b], leaders of the people.
translation:
  language: pt
  text: Então o Espírito[a] me levantou e me levou até o portão oriental da casa de Yahweh[b], o qual dá para o leste. E eis que, à entrada do portão, estavam vinte e cinco homens. Entre eles vi Jaazanias, filho de Azur, e Pelatias, filho de Benaías, líderes do povo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um espírito me levantou». A palavra hebraica רוּחַ também pode significar «vento», mas, no contexto das visões de Ezequiel, provavelmente se refere ao Espírito divino.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «o portão da casa de Yahweh»; isto é, o portão do templo.'
    reason: cultural_note
  - marker: c
    text: 'Ou: «chefes do povo» ou «autoridades do povo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: o Espírito
  rationale: No contexto das visões de Ezequiel, o termo designa mais naturalmente o agente divino que transporta o profeta; o artigo torna a referência contextualmente definida, sem eliminar a alternativa lexical indicada em nota.
- source_word: וַתִּשָּׂא אֹתִי
  choice: me levantou
  rationale: Preserva o movimento vívido de elevar o profeta e corresponde ao uso de נשׂא em contextos de transporte visionário.
- source_word: וַתָּבֵא אֹתִי
  choice: me levou até
  rationale: Expressa de modo natural o causativo de בוא, indicando que o profeta foi conduzido ao destino.
- source_word: שַׁעַר בֵּית יְהוָה
  choice: o portão ... da casa de Yahweh
  rationale: Mantém a expressão hebraica 'casa de Yahweh', em vez de substituí-la diretamente por 'templo', e usa 'portão' para a entrada monumental do complexo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino, distinguindo-o do título 'Senhor'.
- source_word: הַקַּדְמוֹנִי הַפּוֹנֶה קָדִימָה
  choice: oriental ... o que dá para o leste
  rationale: Conserva a aparente redundância espacial do hebraico e sua precisão descritiva em português natural.
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a vivacidade do marcador discursivo característico da narrativa profética.
- source_word: בְּפֶתַח הַשַּׁעַר
  choice: à entrada do portão
  rationale: Formulação idiomática que comunica com precisão a localização no vão ou acesso do portão.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: vinte e cinco homens
  rationale: Reflete o substantivo masculino coletivo אִישׁ e a composição do grupo no texto.
- source_word: שָׂרֵי הָעָם
  choice: líderes do povo
  rationale: Expressão atual e abrangente para autoridades ou dirigentes, sem sugerir necessariamente nobreza hereditária.
theological_decisions:
- issue: Identificação de רוּחַ no transporte visionário de Ezequiel
  choice: o Espírito, entendido contextualmente como o Espírito divino
  alternative: um espírito; vento
  rationale: O contexto visionário de Ezequiel favorece um agente divino específico, mas a nota preserva a amplitude lexical do hebraico e evita apresentar a identificação como linguisticamente incontestável.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantêm-se a expressão bíblica 'casa de Yahweh', o marcador profético 'eis que' e a repetição espacial do original. Os nomes próprios seguem formas portuguesas reconhecíveis.
