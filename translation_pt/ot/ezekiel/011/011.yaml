source:
  edition: WLC
  text: הִ֗יא לֹֽא תִהְיֶ֤ה לָ/כֶם֙ לְ/סִ֔יר וְ/אַתֶּ֛ם תִּהְי֥וּ בְ/תוֹכָ֖/הּ לְ/בָשָׂ֑ר אֶל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפֹּ֥ט אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/011.yaml
  text: It will not be for you as a pot[a], and you will not be within it as meat; at the border of Israel I will judge you.
translation:
  language: pt
  text: Ela não será para vocês como uma panela, nem vocês serão como carne[a] dentro dela. Na fronteira de Israel, eu os julgarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como carne”. O termo hebraico significa literalmente “carne”; nesta metáfora da panela, refere-se à carne que está nela.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִיא
  choice: Ela
  rationale: O pronome feminino retoma Jerusalém, mencionada no contexto anterior; o português permite conservar naturalmente o gênero gramatical da cidade.
- source_word: לְסִיר
  choice: uma panela
  rationale: סִיר designa um recipiente usado para cozinhar. “Panela” preserva com clareza a metáfora retomada do provérbio no contexto.
- source_word: וְאַתֶּם תִּהְיוּ בְתוֹכָהּ לְבָשָׂר
  choice: nem vocês serão a carne dentro dela
  rationale: 'Embora a segunda oração não repita לֹא, a negação da primeira oração abrange o paralelismo: a cidade não será a panela deles, nem eles serão a carne nela. “Dentro dela” conserva a imagem espacial.'
- source_word: בָשָׂר
  choice: carne
  rationale: O sentido lexical básico é “carne”; no contexto da panela, refere-se à carne colocada para cozinhar. A tradução preserva tanto o termo concreto quanto a força inquietante da metáfora.
- source_word: אֶל גְּבוּל יִשְׂרָאֵל
  choice: Na fronteira de Israel
  rationale: Neste contexto, אֶל pode apontar para o lugar até o qual eles serão levados e onde ocorrerá o julgamento. “Na fronteira” expressa naturalmente essa localização sem apagar a ideia contextual de movimento até ela.
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: eu os julgarei
  rationale: שׁפט tem aqui sentido judicial, próprio de um oráculo profético de juízo.
theological_decisions:
- issue: O provérbio metafórico sobre Jerusalém como panela protetora
  choice: Manter a imagem da panela e da carne sem explicá-la no corpo do versículo
  alternative: Parafrasear que Jerusalém não serviria de proteção aos líderes
  rationale: A formulação conserva a reversão retórica do provérbio anterior e evita inserir na tradução uma interpretação que o texto comunica por meio da própria imagem.
- issue: Alcance da negação na segunda oração
  choice: Traduzir a segunda oração com “nem”
  alternative: 'Traduzir de modo estritamente linear: “e vocês serão a carne dentro dela”'
  rationale: O paralelismo e a continuação do anúncio de expulsão e julgamento indicam que לֹא, expresso na primeira oração, rege também a segunda por elipse. “Nem” torna essa relação gramatical clara em português, sem alterar o sentido contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Vocês” representa o plural dirigido aos líderes; “os julgarei” mantém concordância natural. A metáfora concreta foi preservada, e a pausa antes do anúncio de julgamento foi marcada por ponto para maior clareza oral.
