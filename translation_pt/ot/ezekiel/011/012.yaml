  source_fidelity: 'A tradução representa com precisão a sequência hebraica: o reconhecimento futuro de Yahweh, a desobediência passada aos seus estatutos e juízos, e a conformidade contrastante com os juízos/práticas das nações circunvizinhas. “Pois” é uma opção contextual adequada para אֲשֶׁר neste enunciado profético e não introduz interpretação doutrinária indevida.'
  naturalness: O português é moderno, claro e apropriado a leitores internacionais, com boa legibilidade brasileira. “Não seguiram”, “cumpriram” e “agiram segundo” são formulações naturais. A repetição de “juízos” é um pouco marcada em português, mas é justificável por refletir a repetição de מִשְׁפָּט no hebraico e é esclarecida pela nota.
  terminology: “Yahweh” reproduz de modo consistente o Tetragrama conforme a política informada. “Estatutos” para חֻקַּי e “juízos” para מִשְׁפָּטַי preservam uma distinção jurídica útil. A nota registra adequadamente a nuance contextual de “costumes/práticas” no emprego final de מִשְׁפְּטֵי.
