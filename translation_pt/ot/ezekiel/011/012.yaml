id: EZK.11.12
reference: Ezekiel 11:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֤ר בְּ/חֻקַּ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וּ/מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם עֲשִׂיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/012.yaml
  text: Then you will know that I am Yahweh[a], in whose statutes you have not walked, and whose judgments you have not carried out, but you have acted according to the judgments of the nations that are around you.
translation:
  language: pt
  text: Então vocês saberão que eu sou Yahweh, pois não seguiram os meus estatutos nem cumpriram os meus juízos; pelo contrário, agiram segundo os juízos[a] das nações ao redor de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo os costumes das nações ao redor de vocês”. Neste contexto, a palavra hebraica traduzida como “juízos” também pode designar as práticas ou os costumes seguidos por essas nações.
    reason: alternativa lexical
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: O perfeito qal com a conjunção, neste contexto profético, aponta para o reconhecimento que resultará do juízo anunciado; “Então” expressa essa sequência de modo natural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando seu caráter pessoal e pactual.
- source_word: בְּחֻקַּי לֹא הֲלַכְתֶּם
  choice: não seguiram os meus estatutos
  rationale: “Seguir” comunica em português corrente a metáfora hebraica de andar segundo determinadas prescrições, enquanto “estatutos” conserva o sentido jurídico-pactual de חֻקִּים.
- source_word: וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם
  choice: nem cumpriram os meus juízos
  rationale: “Cumprir” traduz naturalmente עשה em relação a exigências legais; “juízos” mantém a distinção lexical em relação a “estatutos” e a repetição de מִשְׁפָּט no versículo.
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם
  choice: pelo contrário, agiram segundo os juízos das nações
  rationale: A conjunção tem valor adversativo no contraste entre desobedecer a Yahweh e conformar-se às nações. “Agiram segundo” expressa com naturalidade עשה + כְּ.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: das nações ao redor de vocês
  rationale: Formulação clara e atual que preserva tanto a referência aos povos estrangeiros quanto sua proximidade geográfica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Senhor; Jeová
  rationale: O hebraico traz explicitamente o Tetragrama; a transliteração “Yahweh” preserva o nome pactual sem substituí-lo por um título.
- issue: Relação introduzida por אֲשֶׁר após “eu sou Yahweh”
  choice: pois
  alternative: o qual; cujos
  rationale: Neste contexto, אֲשֶׁר introduz naturalmente a razão ligada ao reconhecimento de Yahweh no juízo. “Pois” evita uma construção relativa artificial em português, sem resolver além do necessário a relação entre identidade divina, desobediência e juízo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas plenamente naturais para leitores brasileiros. O plural “vocês” torna explícita a segunda pessoa masculina plural do hebraico. A repetição de “juízos” foi mantida no texto principal para refletir a repetição lexical do original; a possível nuance de “costumes” aparece em nota.
