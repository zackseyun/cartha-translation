  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ חַלְלֵי/כֶם֙ אֲשֶׁ֣ר שַׂמְתֶּ֣ם בְּ/תוֹכָ֔/הּ הֵ֥מָּה הַ/בָּשָׂ֖ר וְ/הִ֣יא הַ/סִּ֑יר וְ/אֶתְ/כֶ֖ם הוֹצִ֥יא מִ/תּוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/007.yaml
  text: 'Therefore thus says Lord Yahweh: Your slain whom you have placed in its midst—they are the meat[a], and it is the pot; but you I will bring out from its midst.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: “Os seus mortos, que vocês puseram no meio dela, são a carne, e ela é a panela; mas eu tirarei vocês do meio dela.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Mantém o título אֲדֹנָי como «Senhor» e representa explicitamente o nome divino יהוה como «Yahweh», evitando a forma artificial «Senhor SENHOR».
- source_word: חַלְלֵיכֶם אֲשֶׁר שַׂמְתֶּם
  choice: os que vocês mataram e puseram
  rationale: חָלָל designa alguém morto violentamente. No contexto, o sufixo «de vocês» e a oração relativa apontam para as vítimas cuja morte é atribuída aos líderes; a formulação portuguesa comunica essa força com naturalidade.
- source_word: בְּתוֹכָהּ / מִתּוֹכָהּ
  choice: no meio dela / do meio dela
  rationale: O pronome feminino remete à cidade, Jerusalém. A repetição conserva a correspondência espacial e retórica do hebraico.
- source_word: הַבָּשָׂר
  choice: a carne
  rationale: Em português, «carne» exprime naturalmente tanto a carne corporal quanto a carne posta numa panela, preservando a imagem sem exigir uma escolha artificial entre «flesh» e «meat».
- source_word: הַסִּיר
  choice: a panela
  rationale: É a designação corrente de um recipiente para cozinhar e mantém clara a metáfora do contexto.
- source_word: הוֹצִיא
  choice: eu tirarei
  rationale: A forma pode funcionar como infinitivo absoluto com valor verbal finito; no discurso direto de Yahweh, a primeira pessoa é indicada pelo contexto e é confirmada pela continuação imediata da profecia (v. 9). «Tirar» reproduz de modo natural o sentido causativo de יצא.
theological_decisions:
- issue: Identidade da carne dentro da panela
  choice: Os mortos violentamente são identificados diretamente como a carne, e Jerusalém como a panela.
  alternative: Explicar a imagem como proteção dos habitantes dentro da cidade.
  rationale: O versículo inverte a máxima anterior dos líderes. A tradução conserva a metáfora e sua tensão judicial, sem acrescentar uma interpretação à fala divina.
- issue: Pessoa verbal em הוֹצִיא
  choice: eu tirarei
  alternative: ele tirará
  rationale: Embora a forma não marque aqui a primeira pessoa como um verbo finito comum, seu uso no discurso divino e a sequência em primeira pessoa no versículo seguinte sustentam a leitura contextual «eu tirarei».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para a segunda pessoa plural. A ordem e a repetição do hebraico foram preservadas onde soam naturais; as aspas delimitam a fala divina.
