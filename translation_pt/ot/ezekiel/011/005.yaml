source:
  edition: WLC
  text: וַ/תִּפֹּ֣ל עָלַ/י֮ ר֣וּחַ יְהוָה֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אֱמֹר֙ כֹּה אָמַ֣ר יְהוָ֔ה כֵּ֥ן אֲמַרְתֶּ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל וּ/מַעֲל֥וֹת רֽוּחֲ/כֶ֖ם אֲנִ֥י יְדַעְתִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/005.yaml
  text: 'And the Spirit of Yahweh fell upon me[a], and he said to me, “Say, ‘Thus says Yahweh: So you have said, O house of Israel, and I know the things that come up in your spirit.’”'
translation:
  language: pt
  text: 'Então o Espírito de Yahweh caiu sobre mim, e ele me disse: “Diga: ‘Assim diz Yahweh: Assim vocês disseram, ó casa de Israel; e eu sei o que surge no espírito de vocês.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que vem à mente de vocês”; literalmente, “as coisas que sobem no espírito de vocês”.
    reason: Registra a alternativa idiomática para a expressão hebraica e, ao mesmo tempo, sua metáfora literal.
lexical_decisions:
- source_word: וַתִּפֹּל עָלַי
  choice: caiu sobre mim
  rationale: Preserva a imagem vívida de נפל com עַל, usada aqui para a vinda poderosa do Espírito sobre o profeta, sem suavizá-la para “veio sobre mim”.
- source_word: רוּחַ יְהוָה
  choice: o Espírito de Yahweh
  rationale: No contexto da visão e capacitação profética, רוּחַ designa o Espírito divino, não um vento natural; a inicial maiúscula explicita esse referente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico, preservando o nome da aliança em vez de substituí-lo por um título.
- source_word: כֹּה אָמַר יְהוָה
  choice: Assim diz Yahweh
  rationale: Mantém a fórmula profética tradicional de mensageiro com correspondência direta e linguagem digna.
- source_word: כֵּן אֲמַרְתֶּם
  choice: Assim vocês disseram
  rationale: Reproduz de perto o advérbio כֵּן e o plural verbal, sem transformar a frase numa paráfrase mais explicativa.
- source_word: בֵּית יִשְׂרָאֵל
  choice: ó casa de Israel
  rationale: Conserva a fórmula coletiva e pactual “casa de Israel”; “ó” marca claramente o vocativo em português.
- source_word: וּמַעֲלוֹת רוּחֲכֶם
  choice: e eu sei o que surge no espírito de vocês
  rationale: “Surge” preserva de modo inteligível a imagem das coisas que sobem no interior; “espírito” mantém o termo רוּחַ, enquanto a ordem foi ajustada ao português natural.
- source_word: אֲנִי יְדַעְתִּיהָ
  choice: eu sei
  rationale: Expressa o conhecimento presente de Yahweh; o objeto é integrado à oração anterior em português, evitando uma retomada pronominal artificial.
theological_decisions:
- issue: Sentido de רוּחַ na primeira oração
  choice: Espírito
  alternative: vento
  rationale: A cena profética de Ezequiel indica o Espírito de Yahweh atuando sobre o profeta, não um fenômeno meteorológico.
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o Tetragrama como nome próprio; “Yahweh” preserva sua função nominal sem substituí-lo pelo título tradicional.
- issue: Referente e pessoalidade em וַיֹּאמֶר
  choice: e ele me disse
  alternative: e me foi dito
  rationale: A forma verbal hebraica tem sujeito masculino singular e o antecedente imediato é o Espírito de Yahweh. A tradução mantém a construção pessoal do texto sem acrescentar uma identificação doutrinária além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A formulação conserva a vividez profética de “caiu sobre mim” e a metáfora antropológica de algo que surge no “espírito”, explicando a leitura idiomática em nota.
