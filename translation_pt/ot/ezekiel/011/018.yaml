id: EZK.11.18
reference: Ezekiel 11:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וּ/בָ֖אוּ שָׁ֑מָּ/ה וְ/הֵסִ֜ירוּ אֶת כָּל שִׁקּוּצֶ֛י/הָ וְ/אֶת כָּל תּוֹעֲבוֹתֶ֖י/הָ מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/018.yaml
  text: They will come there and remove from it all its detestable things and all its abominations[a].
translation:
  language: pt
  text: Eles virão para lá e removerão dali todas as suas coisas detestáveis e todas as suas abominações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todos os seus ídolos»; o termo hebraico muitas vezes se refere a objetos idolátricos detestáveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: Eles virão
  rationale: O qatal com conjunção, no contexto profético de restauração, tem valor futuro ou resultativo. O pronome explícito torna claro o sujeito plural em português.
- source_word: שָׁמָּה
  choice: para lá
  rationale: O advérbio direcional indica movimento para aquele lugar. «Para lá» expressa naturalmente essa direção em português.
- source_word: וְהֵסִירוּ
  choice: e removerão
  rationale: O hifil de סור significa aqui retirar ou eliminar algo do lugar; «removerão» preserva o sentido causativo.
- source_word: אֶת כָּל שִׁקּוּצֶיהָ
  choice: todas as suas coisas detestáveis
  rationale: שִׁקּוּץ designa algo detestável, muitas vezes um ídolo ou objeto idolátrico. A formulação ampla evita restringir indevidamente o termo.
- source_word: וְאֶת כָּל תּוֹעֲבוֹתֶיהָ
  choice: e todas as suas abominações
  rationale: תּוֹעֵבָה é um termo forte para aquilo que é abominável, especialmente em contextos religiosos e morais; «abominações» mantém esse peso e a distinção lexical em relação ao termo anterior.
- source_word: מִמֶּנָּה
  choice: dali
  rationale: A preposição com sufixo feminino retoma o lugar mencionado. «Dali» é idiomático com «remover» e evita a sequência menos natural «removerão dela».
theological_decisions:
- issue: Se שִׁקּוּצֶיהָ deve ser explicitado como referência a ídolos
  choice: Manter no texto principal a expressão mais ampla «coisas detestáveis»
  alternative: «ídolos» ou «objetos idolátricos»
  rationale: O contexto favorece uma referência à idolatria, mas o substantivo hebraico não é exclusivamente um termo técnico para ídolos. A tradução principal preserva sua amplitude, e a nota registra a interpretação contextual provável.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Para lá» conserva a direção de שָׁמָּה, enquanto «dali» retoma o mesmo lugar de modo idiomático. O paralelismo e a distinção entre «coisas detestáveis» e «abominações» foram preservados.
