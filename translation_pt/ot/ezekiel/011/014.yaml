  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Então ... veio
  rationale: O waw consecutivo com היה introduz a sequência narrativa. Em português, a fórmula profética é expressa naturalmente por “Então a palavra ... veio”, sem o literalismo pouco idiomático “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na construção דְבַר יְהוָה, “palavra” preserva a fórmula recorrente de revelação profética e sua ligação formal com o texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração preserva o nome divino pessoal presente no hebraico, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa diretamente a direção da palavra ao profeta em português moderno e natural.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: O infinitivo hebraico introduz a fala direta subsequente; “dizendo:” mantém a cadência da fórmula profética e os dois-pontos sinalizam sua função.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” conserva o nome próprio e evita substituí-lo silenciosamente por um título; “Jeová” representa uma forma tradicional posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência profética preservada. “Então” marca com naturalidade a progressão narrativa; a estrutura concisa acompanha de perto o hebraico.
