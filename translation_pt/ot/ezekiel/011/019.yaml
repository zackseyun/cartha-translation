  text: וְ/נָתַתִּ֤י לָ/הֶם֙ לֵ֣ב אֶחָ֔ד וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשָׂרָ֔/ם וְ/נָתַתִּ֥י לָ/הֶ֖ם לֵ֥ב בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/019.yaml
  text: And I will give them one heart[a], and I will put a new spirit within them[b]. I will remove the heart of stone from their flesh and give them a heart of flesh.
translation:
  language: pt
  text: Eu lhes darei um só coração[a] e porei dentro deles[b] um espírito novo. Removerei de sua carne o coração de pedra e lhes darei um coração de carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Um só coração” também pode ser entendido como “um coração não dividido”, com ênfase em lealdade integral.
    reason: lexical_alternative
  - marker: b
    text: A forma hebraica escrita aqui pode ser lida como “dentro de vocês”; o contexto costuma ser entendido como “dentro deles”, em conformidade com os pronomes ao redor e com o paralelo próximo de Ezequiel 36:26.
    reason: textual_variant
lexical_decisions:
- source_word: לֵב אֶחָד
  choice: um só coração
  rationale: Preserva a metáfora hebraica e sugere unidade ou lealdade não dividida sem transformar a expressão em paráfrase.
- source_word: רוּחַ חֲדָשָׁה
  choice: um espírito novo
  rationale: No contexto de renovação interior, “espírito” é o sentido mais adequado de רוּחַ e mantém a distinção em relação a “coração”.
- source_word: בְּקִרְבְּכֶם
  choice: dentro deles
  rationale: Embora a forma consonantal fornecida possa ser lida como “dentro de vocês”, os pronomes de terceira pessoa ao redor e o paralelo de Ezequiel 36:26 favorecem, no contexto, “dentro deles”.
- source_word: וַהֲסִרֹתִי
  choice: removerei
  rationale: Expressa de modo natural e direto a força causativa do hifil de סור.
- source_word: לֵב הָאֶבֶן
  choice: o coração de pedra
  rationale: Mantém de forma transparente a imagem concreta do hebraico.
- source_word: מִבְּשָׂרָם
  choice: da sua carne
  rationale: Conserva o sentido literal de בָּשָׂר e a coerência da imagem que contrapõe pedra e carne.
- source_word: לֵב בָּשָׂר
  choice: um coração de carne
  rationale: Preserva a contraposição metafórica entre pedra e carne, sem restringi-la interpretativamente a “coração terno” ou “sensível”.
theological_decisions:
- issue: Metáfora antropológica da renovação interior
  choice: Manter “coração” e “espírito” como termos distintos, embora relacionados.
  alternative: Reduzir ambos a uma paráfrase psicológica, como “mente” e “atitude”.
  rationale: A distinção conserva as categorias antropológicas e a textura teológica do texto sem sistematizar em excesso a relação entre elas.
- issue: Metáfora do “coração de carne”
  choice: Traduzir literalmente como “coração de carne”.
  alternative: Usar “coração terno”, “sensível” ou “receptivo”.
  rationale: A tradução literal preserva a tensão e a força da contraposição entre pedra e carne, deixando abertas suas implicações.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva as metáforas concretas do hebraico e evita paráfrases confessionais. Os marcadores foram associados às expressões a que cada nota efetivamente se refere.
