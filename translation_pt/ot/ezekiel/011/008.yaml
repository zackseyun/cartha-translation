  text: חֶ֖רֶב יְרֵאתֶ֑ם וְ/חֶ֨רֶב֙ אָבִ֣יא עֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/008.yaml
  text: You have feared the sword[a], and I will bring the sword upon you[b], declares the Lord GOD.
translation:
  language: pt
  text: Vocês temeram a espada[a], e eu trarei a espada sobre vocês[b] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a espada”. A expressão também pode ter o sentido mais amplo de guerra ou juízo violento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Vocês temeram a espada, e uma espada eu trarei sobre vocês”.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב
  choice: a espada
  rationale: Preserva a imagem concreta e a repetição enfática do hebraico; no contexto profético, a espada também pode representar guerra, morte violenta ou juízo.
- source_word: יְרֵאתֶם
  choice: vocês temeram
  rationale: Traduz o qal perfeito na segunda pessoa masculina plural de modo direto e natural, sem acrescentar uma nuance aspectual que o contexto não exige.
- source_word: וְחֶרֶב אָבִיא עֲלֵיכֶם
  choice: e eu trarei a espada sobre vocês
  rationale: Mantém a ligação entre o temor mencionado e o juízo anunciado, repete 'a espada' para conservar a força retórica e traduz עַל pela expressão judicial 'sobre vocês'.
- source_word: נְאֻם
  choice: declaração
  rationale: Expressa a fórmula profética solene como uma declaração divina, em linguagem atual e digna.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a forma redundante 'Senhor SENHOR'.
theological_decisions:
- issue: Forma do nome divino no título composto אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A forma escolhida preserva explicitamente o nome divino presente no texto hebraico e distingue-o do título 'Senhor'; a alternativa segue uma convenção tradicional de tradução, mas torna o nome menos visível.
- issue: Sentido da espada no anúncio de juízo
  choice: manter a imagem literal 'a espada'
  alternative: explicitar 'guerra' ou 'morte violenta'
  rationale: O texto emprega a mesma palavra concreta duas vezes. Mantê-la conserva a retórica e não restringe sua possível abrangência metafórica.
translation_notes:
  register: Português moderno, claro e solene, com 'vocês' para o plural. A ordem foi levemente naturalizada, mas a repetição central de 'a espada' foi preservada.
