source:
  edition: WLC
  text: וַֽ/יְהִי֙ כְּ/הִנָּ֣בְאִ֔/י וּ/פְלַטְיָ֥הוּ בֶן בְּנָיָ֖ה מֵ֑ת וָ/אֶפֹּ֨ל עַל פָּנַ֜/י וָ/אֶזְעַ֣ק קוֹל גָּד֗וֹל וָ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כָּלָה֙ אַתָּ֣ה עֹשֶׂ֔ה אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
translation:
  language: pt
  text: 'E aconteceu que, enquanto eu profetizava, Pelatias, filho de Benaías, morreu. Então caí com o rosto em terra, clamei em alta voz e disse: “Ah! Senhor Yahweh[b], acabarás por completo com o remanescente de Israel?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estás acabando por completo com o remanescente de Israel?” O hebraico pode ter sentido presente ou iminente.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica é ʾAdonai YHWH, literalmente “Senhor Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Introduz o novo acontecimento na sequência narrativa sem recorrer à fórmula arcaica «e sucedeu».
- source_word: כְּהִנָּבְאִי
  choice: enquanto eu profetizava
  rationale: A preposição כְּ com o infinitivo construto e o sufixo da primeira pessoa indica simultaneidade; a forma progressiva comunica que a morte ocorreu durante a profecia.
- source_word: וּפְלַטְיָהוּ בֶן־בְּנָיָה
  choice: Pelatias, filho de Benaías
  rationale: Emprega as formas portuguesas reconhecíveis dos nomes hebraicos e explicita a relação filial com pontuação natural.
- source_word: מֵת
  choice: morreu
  rationale: O perfeito qal relata de modo direto o acontecimento da morte, sem acrescentar a ideia não expressa de que ele «caiu morto».
- source_word: וָאֶפֹּל עַל־פָּנַי
  choice: Então caí com o rosto em terra
  rationale: Conserva a imagem corporal hebraica e expressa naturalmente o gesto de choque, lamento e súplica.
- source_word: וָאֶזְעַק קוֹל גָּדוֹל
  choice: clamei em alta voz
  rationale: זעק denota um clamor intenso, frequentemente motivado por aflição; «em alta voz» representa de maneira idiomática קוֹל גָּדוֹל.
- source_word: אֲהָהּ
  choice: Ah!
  rationale: Interjeição breve de consternação e lamento, digna e compreensível no português atual.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Representa tanto o título אֲדֹנָי como o nome divino יהוה, evitando a repetição ambígua «Senhor SENHOR».
- source_word: כָּלָה ... עֹשֶׂה
  choice: acabarás por completo com
  rationale: Reproduz o sentido idiomático de fazer um fim completo em português natural. O futuro comunica a força iminente percebida na súplica, sem ocultar a possibilidade de valor presente.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: o remanescente de Israel
  rationale: Mantém o termo bíblico e teologicamente significativo para os sobreviventes que restam de Israel.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor Deus
  rationale: A tradução conserva o título e o nome pessoal presentes no hebraico, sem substituir silenciosamente יהוה por um título.
- issue: Força da oração final
  choice: 'Pergunta com valor futuro: «acabarás por completo...?»'
  alternative: 'Pergunta com valor presente ou iminente: «estás acabando por completo...?»'
  rationale: Embora o hebraico não tenha partícula interrogativa explícita, o contexto de clamor e súplica favorece a leitura como pergunta. A construção participial admite nuance presente ou iminente, preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha de perto a progressão hebraica, mas evita construções arcaicas; «remanescente» é mantido por sua importância lexical e intertextual.
