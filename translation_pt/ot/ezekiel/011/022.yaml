base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/022.yaml
  text: Then the cherubim lifted up their wings[a], with the wheels beside them[b], and the glory of the God of Israel was above them.
translation:
  language: pt
  text: Então os querubins ergueram as asas, e as rodas estavam ao lado deles[a]; e a glória do Deus de Israel estava acima deles, lá no alto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também é possível traduzir: “com as rodas ao lado deles”. A conjunção hebraica pode ser traduzida mais literalmente por “e”, mas o sentido é que as rodas acompanhavam os querubins.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “acima deles, de cima”, uma expressão espacial enfática que indica que a glória estava sobre eles, lá no alto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: ergueram
  rationale: O qal consecutivo de נשׂא descreve o movimento ascendente das asas; “ergueram” é natural em português e se ajusta ao objeto direto.
- source_word: הַכְּרוּבִים
  choice: os querubins
  rationale: Mantém a designação tradicional desses seres celestiais e representa o plural hebraico.
- source_word: כַּנְפֵיהֶם
  choice: as asas
  rationale: O possessivo hebraico fica claro pelo sujeito “os querubins”; em português, o artigo definido evita um possessivo desnecessário.
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: e as rodas estavam ao lado deles
  rationale: Representa a conjunção e explicita a oração nominal hebraica. “Ao lado deles” comunica a posição correspondente das rodas sem impor uma geometria mais específica.
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: A glória do Deus de Israel
  rationale: “Glória” preserva o peso teológico e intertextual de כבוד sem expandi-lo interpretativamente para “presença gloriosa”.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: estava acima deles, no alto
  rationale: “Acima deles” expressa a relação espacial, enquanto “no alto” conserva a ênfase adicional de מִלְמָעְלָה de maneira compreensível em português.
theological_decisions:
- issue: A manifestação divina designada por כבוד na visão do trono
  choice: a glória do Deus de Israel
  alternative: a presença gloriosa do Deus de Israel
  rationale: A tradução mantém o termo teologicamente significativo “glória” e não define além do texto a natureza dessa manifestação visível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases reduz o acúmulo de orações sem alterar a sequência da visão; os marcadores [a] e [b] aparecem junto às expressões que explicam.
