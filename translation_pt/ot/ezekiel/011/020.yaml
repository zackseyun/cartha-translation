lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado pretendido e soa natural em português atual.
- source_word: בְּחֻקֹּתַי יֵלֵכוּ
  choice: andem nos meus decretos
  rationale: Preserva a metáfora hebraica de andar como modo de viver, enquanto 'decretos' comunica prescrições estabelecidas.
- source_word: מִשְׁפָּטַי
  choice: as minhas ordenanças
  rationale: No contexto da aliança, o termo pode designar determinações ou normas prescritas; 'ordenanças' é claro e distingue este termo de חֻקִּים.
- source_word: יִשְׁמְרוּ
  choice: guardem
  rationale: Mantém o sentido de observar cuidadosamente e obedecer às determinações divinas.
- source_word: וְעָשׂוּ אֹתָם
  choice: e as cumpram
  rationale: Expressa a execução concreta das ordenanças sem a rigidez pouco natural de 'fazê-las'.
- source_word: וְהָיוּ לִי לְעָם
  choice: Eles serão o meu povo
  rationale: Reproduz de modo direto e moderno a fórmula da aliança.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: e eu serei o seu Deus
  rationale: Preserva a fórmula recíproca da aliança em português natural.
theological_decisions:
- issue: Fórmula da aliança
  choice: Eles serão o meu povo, e eu serei o seu Deus.
  alternative: Eles se tornarão meu povo, e eu me tornarei seu Deus.
  rationale: A formulação escolhida mantém a declaração relacional tradicional sem acrescentar uma interpretação sobre o momento ou o processo pelo qual essa relação se estabelece.
- issue: Relação entre guardar e cumprir
  choice: guardem as minhas ordenanças e as cumpram
  alternative: obedeçam às minhas ordenanças
  rationale: Mantém as duas ações distintas presentes no hebraico, evitando fundi-las em uma única ideia geral de obediência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora bíblica de 'andar' foi preservada; a sintaxe foi ajustada para fluência sem eliminar a repetição intencional entre guardar e cumprir.
