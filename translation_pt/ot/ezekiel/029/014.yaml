reference: Ezekiel 29:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/שַׁבְתִּי֙ אֶת שְׁב֣וּת מִצְרַ֔יִם וַ/הֲשִׁבֹתִ֤י אֹתָ/ם֙ אֶ֣רֶץ פַּתְר֔וֹס עַל אֶ֖רֶץ מְכֽוּרָתָ֑/ם וְ/הָ֥יוּ שָׁ֖ם מַמְלָכָ֥ה שְׁפָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/014.yaml
  text: And I will restore the fortunes of Egypt and bring them back to the land of Pathros[a], to the land of their origin[b], and there they will be a lowly kingdom.
translation:
  language: pt
  text: Restaurarei a sorte do Egito[a] e os farei voltar à terra de Patros[b], a terra de sua origem; ali serão um reino rebaixado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Trarei de volta os cativos do Egito” ou “restaurarei o cativeiro do Egito”. A expressão hebraica também pode ser traduzida mais literalmente, embora aqui provavelmente se refira de modo mais amplo à restauração da condição do Egito.'
    reason: lexical_alternative
  - marker: b
    text: Patros era uma região do Alto Egito, descrita aqui como a terra de origem dos egípcios.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת מִצְרַיִם
  choice: Restaurarei a sorte do Egito
  rationale: A expressão idiomática שׁוּב שְׁבוּת indica a reversão da condição ou a restauração da sorte. Como a oração seguinte já explicita o retorno físico, esta formulação evita redundância e preserva a amplitude do hebraico.
- source_word: וַהֲשִׁבֹתִי אֹתָם
  choice: e os farei voltar
  rationale: O hifil de שׁוּב é causativo. “Farei voltar” expressa com clareza que Deus fará os egípcios retornarem.
- source_word: אֶרֶץ פַּתְרוֹס
  choice: à terra de Patros
  rationale: Mantém אֶרֶץ como “terra” e translitera o topônimo פַּתְרוֹס segundo o uso português.
- source_word: עַל אֶרֶץ מְכוּרָתָם
  choice: a terra de sua origem
  rationale: מְכוּרָה designa o lugar de nascimento ou origem. No contexto, a expressão funciona como explicação de Patros; a aposição natural em português evita tornar עַל excessivamente literal.
- source_word: וְהָיוּ שָׁם
  choice: ali serão
  rationale: Formulação concisa e natural que conserva a ênfase locativa de שָׁם.
- source_word: מַמְלָכָה שְׁפָלָה
  choice: um reino humilde
  rationale: שָׁפָל descreve algo baixo, rebaixado ou de pouca posição. “Humilde” comunica condição modesta e reduzida sem sugerir necessariamente virtude moral.
theological_decisions:
- issue: Sentido da expressão שׁוּב שְׁבוּת
  choice: Restaurarei a sorte do Egito
  alternative: Trarei de volta os cativos do Egito / restaurarei o cativeiro do Egito
  rationale: A construção admite uma leitura ligada ao cativeiro, mas frequentemente funciona como expressão idiomática de restauração mais ampla. A oração seguinte já descreve o retorno, e a nota conserva a alternativa literal.
- issue: Valor de עַל em עַל אֶרֶץ מְכוּרָתָם
  choice: a terra de sua origem
  alternative: sobre a terra de sua origem / à terra de sua origem
  rationale: A expressão é entendida como aposição explicativa à terra de Patros. Isso produz português natural sem eliminar a relação territorial expressa no hebraico.
- issue: Sentido de שְׁפָלָה aplicado ao reino
  choice: humilde
  alternative: rebaixado / de pouca importância
  rationale: O termo aponta para posição inferior ou reduzida, não necessariamente para humildade como virtude. A nota lexical interna e o contexto impedem uma leitura moralizante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação explicita a aposição entre Patros e “a terra de sua origem”. “Reino humilde” conserva a imagem de posição reduzida sem recorrer a formas arcaicas.
