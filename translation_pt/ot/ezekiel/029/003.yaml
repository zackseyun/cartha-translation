base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/003.yaml
  text: 'Speak and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Pharaoh king of Egypt, the great sea monster lying in the midst of his Nile channels, who says, “My Nile is mine[b], and I made myself.”’'
translation:
  language: pt
  text: 'Fale e diga: “Assim diz o Senhor Yahweh: Eis que estou contra você, faraó, rei do Egito, o grande monstro[a], que está deitado no meio dos seus canais do Nilo e diz: ‘O meu Nilo é meu, e eu fiz a mim mesmo[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “grande dragão”; neste contexto, a imagem também pode evocar um monstro do Nilo semelhante a um crocodilo.
    reason: lexical_alternative
  - marker: b
    text: Ou “O meu rio é meu, e eu o fiz para mim”. O hebraico pode ser entendido como a afirmação do faraó de que ele próprio se fez ou de que fez o Nilo para si.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי como o nome divino יהוה, evitando a repetição pouco natural “Senhor SENHOR” e distinguindo claramente os dois elementos.
- source_word: הִנְנִי עָלֶיךָ
  choice: Eis que estou contra você
  rationale: “Eis que” mantém a ênfase profética de הִנְנִי, enquanto “contra você” expressa o sentido hostil da preposição עַל neste contexto.
- source_word: הַתַּנִּים הַגָּדוֹל
  choice: grande monstro
  rationale: תַּנִּים designa aqui uma enorme criatura reptiliana ou monstruosa. “Monstro” preserva a força simbólica sem limitar a imagem a uma espécie zoológica; as possibilidades “dragão” e “crocodilo” são registradas em nota.
- source_word: הָרֹבֵץ
  choice: que jaz
  rationale: O particípio de רבץ descreve a criatura deitada ou agachada. “Jaz” é conciso, digno e adequado à imagem de um grande animal instalado nas águas.
- source_word: בְּתוֹךְ יְאֹרָיו
  choice: no meio dos seus canais do Nilo
  rationale: No contexto egípcio, יְאֹרִים se refere ao Nilo e aos seus braços ou canais. A tradução conserva o plural e torna explícita a referência geográfica.
- source_word: לִי יְאֹרִי
  choice: O meu Nilo é meu
  rationale: A formulação deliberadamente enfática reproduz a dupla afirmação possessiva do hebraico e expressa a arrogante reivindicação de domínio do faraó.
- source_word: וַאֲנִי עֲשִׂיתִנִי
  choice: e eu fiz a mim mesmo
  rationale: O sufixo de primeira pessoa em עֲשִׂיתִנִי favorece a leitura reflexiva, preservando a afirmação extraordinária do faraó. A leitura alternativa, referente ao Nilo, é mantida em nota.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva o nome pessoal divino expresso no texto hebraico e, ao mesmo tempo, mantém אֲדֹנָי como título. Isso evita ocultar a distinção presente no original.
- issue: Sentido da declaração וַאֲנִי עֲשִׂיתִנִי
  choice: eu fiz a mim mesmo
  alternative: eu o fiz para mim
  rationale: A leitura reflexiva segue mais diretamente a forma massorética e preserva a tensão teológica da autoglorificação do faraó. Como a construção também tem sido entendida como referência à criação ou apropriação do Nilo, essa possibilidade é explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” mantém o discurso direto sem arcaísmo; “faraó” é tratado como título. As aspas em níveis distintos deixam clara a fala divina e, dentro dela, a jactância do faraó.
