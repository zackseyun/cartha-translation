base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/021.yaml
  text: On that day I will cause a horn to sprout for the house of Israel[a], and I will give you an opening of the mouth among them[b], and they will know that I am Yahweh.
translation:
  language: pt
  text: Naquele dia, farei brotar um chifre para a casa de Israel[a], e darei a você liberdade para falar entre eles[b]. E eles saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farei crescer um chifre”. O “chifre” é uma imagem de força, poder ou honra para a casa de Israel.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma abertura de boca”. É uma expressão hebraica para a concessão ou restauração da possibilidade de falar, provavelmente em eco às restrições anteriores da fala de Ezequiel.
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Naquele dia
  rationale: Expressão temporal profética natural em português, preservando o marcador temporal do hebraico.
- source_word: אַצְמִיחַ
  choice: farei brotar
  rationale: O hifil de צמח tem sentido causativo, “fazer brotar/crescer”; a escolha conserva a metáfora vegetal.
- source_word: קֶרֶן
  choice: um chifre
  rationale: Mantém a imagem concreta do hebraico, que metaforicamente pode indicar força, honra ou exaltação, sem reduzi-la a uma interpretação única.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: Preserva a expressão coletiva e pactual do original, em vez de simplificá-la para “Israel”.
- source_word: וּלְךָ אֶתֵּן
  choice: e darei a você
  rationale: Conserva a mudança para o discurso direto dirigido a Ezequiel, com ordem natural em português.
- source_word: פִּתְחוֹן פֶּה
  choice: abertura de boca
  rationale: Reproduz de perto o idioma hebraico relativo à concessão ou restauração da capacidade de falar e mantém sua possível ligação com a restrição anterior da fala de Ezequiel.
- source_word: בְּתוֹכָם
  choice: no meio deles
  rationale: Equivalência clara e corrente para a ideia de presença no âmbito da comunidade.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: “Então” expressa naturalmente o valor consecutivo ou resultante da oração sem alterar seu conteúdo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Força metafórica de קֶרֶן, “chifre”
  choice: Manter “chifre” como imagem de força, honra ou exaltação renovada para Israel.
  alternative: Traduzir interpretativamente como “força” ou identificar explicitamente o chifre com uma figura messiânica.
  rationale: O versículo sustenta a metáfora, mas não exige que a tradução determine uma referência messiânica específica; manter a imagem preserva a abertura teológica do texto.
- issue: Sentido de פִּתְחוֹן פֶּה para Ezequiel
  choice: Traduzir literalmente como “abertura de boca”, explicando o idioma em nota.
  alternative: Resolver no texto como “liberdade para falar”, “capacidade de falar” ou “ousadia para falar”.
  rationale: A expressão pode evocar as restrições anteriores da fala do profeta, mas o texto não especifica aqui o modo, a duração ou o alcance exato dessa concessão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém as duas imagens hebraicas centrais e usa notas para esclarecê-las sem eliminar sua ambiguidade.
