    rationale: O marcador está após “deserto”, mas a nota atualmente apenas oferece uma alternativa para המדברה e deixa sem nota a nuance egípcia de יְאֹרֶיךָ, que a tradução anterior explicitava como “canais do Nilo”. A nota pode justificar “canais” e mencionar a referência frequente ao Nilo, sem tornar essa identificação obrigatória no texto.
