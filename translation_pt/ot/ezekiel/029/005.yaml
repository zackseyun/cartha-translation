  text: וּ/נְטַשְׁתִּ֣י/ךָ הַ/מִּדְבָּ֗רָ/ה אוֹתְ/ךָ֙ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ עַל פְּנֵ֤י הַ/שָּׂדֶה֙ תִּפּ֔וֹל לֹ֥א תֵאָסֵ֖ף וְ/לֹ֣א תִקָּבֵ֑ץ לְ/חַיַּ֥ת הָ/אָ֛רֶץ וּ/לְ/ע֥וֹף הַ/שָּׁמַ֖יִם נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/005.yaml
  text: I will cast you into the wilderness[a], you and all the fish of your streams. You will fall on the open field; you will not be gathered or collected[c][b]. I have given you as food to the beasts of the earth and to the birds of the heavens.
translation:
  language: pt
  text: Eu lançarei você no deserto, você e todos os peixes dos seus canais[a]. Você cairá no campo aberto; não será recolhido nem ajuntado[b]. Eu já o entreguei como alimento aos animais selvagens da terra e às aves do céu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos seus rios”. Neste contexto egípcio, o termo hebraico frequentemente se refere ao Nilo e às suas vias de água.'
    reason: cultural_note
  - marker: b
    text: Os dois verbos hebraicos são quase sinônimos e reforçam que ninguém recolherá o corpo, provavelmente nem mesmo para sepultá-lo.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “Eu o entreguei como alimento”. O passado apresenta o julgamento futuro como certo e já decretado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Eu abandonarei você
  rationale: O verbo נטשׁ pode expressar abandonar, deixar ou lançar fora. Aqui, “abandonarei” comunica que o monstro será deixado exposto no deserto, sem impor ao verbo um movimento mais forte do que o contexto exige.
- source_word: הַמִּדְבָּרָה
  choice: no deserto
  rationale: A terminação direcional indica movimento para o deserto. Em português, com “abandonar”, “no deserto” exprime naturalmente tanto o destino quanto o lugar de exposição.
- source_word: דְּגַת יְאֹרֶיךָ
  choice: todos os peixes dos seus canais do Nilo
  rationale: דגה é coletivo, “peixes”, e יְאֹר, especialmente neste contexto egípcio, designa o Nilo ou seus canais. A explicitação torna clara a referência histórica sem perder o plural hebraico.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: A expressão descreve a superfície exposta do campo. “Em campo aberto” transmite de modo natural a exposição pública e a vulnerabilidade.
- source_word: תִּפּוֹל
  choice: Você cairá
  rationale: O futuro simples reproduz diretamente a sequência do anúncio de juízo.
- source_word: לֹא תֵאָסֵף וְלֹא תִקָּבֵץ
  choice: não será recolhido nem ajuntado
  rationale: Os dois verbos quase sinônimos são mantidos separadamente para preservar a intensificação hebraica e a possível alusão a não receber remoção ou sepultamento.
- source_word: לְחַיַּת הָאָרֶץ
  choice: aos animais selvagens da terra
  rationale: חיה, nesta cena de cadáver exposto, refere-se naturalmente aos animais selvagens. A formulação é clara, digna e corrente em português.
- source_word: וּלְעוֹף הַשָּׁמַיִם
  choice: e às aves do céu
  rationale: “Aves do céu” preserva a conhecida expressão bíblica hebraica em português natural.
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: Eu já o entreguei como alimento
  rationale: O perfeito hebraico apresenta o juízo futuro como certo. “Já o entreguei” conserva essa força consumada e “como alimento” exprime claramente a finalidade.
theological_decisions:
- issue: Perfeito profético na cláusula final
  choice: Eu já o entreguei como alimento
  alternative: Eu o entregarei como alimento
  rationale: A forma perfeita נְתַתִּיךָ apresenta o julgamento anunciado como tão certo que é descrito como realizado. A tradução conserva essa tensão temporal em vez de reduzi-la a um futuro simples.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” torna explícito o singular masculino dirigido ao faraó simbolizado pelo monstro. Mantiveram-se os dois verbos de recolhimento e a mudança do futuro para o perfeito profético.
