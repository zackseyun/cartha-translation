  naturalness: O português é claro e de registro apropriado. “Eu lançarei você” é aceitável no português brasileiro contemporâneo e reproduz melhor a ação violenta do texto. “No campo aberto” é mais próximo da imagem de exposição sobre a superfície do campo do que “em campo aberto”.
  terminology: “Animais selvagens da terra” e “aves do céu” são naturais e fiéis. “Canais” é uma boa opção para יְאֹרֶיךָ; a possível referência aos cursos de água do Nilo deve permanecer em nota, não ser imposta no texto principal.
