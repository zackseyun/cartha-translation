  text: בֶּן אָדָ֗ם נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּ֠בֶל הֶעֱבִ֨יד אֶת חֵיל֜/וֹ עֲבֹדָ֤ה גְדֹלָה֙ אֶל צֹ֔ר כָּל רֹ֣אשׁ מֻקְרָ֔ח וְ/כָל כָּתֵ֖ף מְרוּטָ֑ה וְ֠/שָׂכָר לֹא הָ֨יָה ל֤/וֹ וּ/לְ/חֵיל/וֹ֙ מִ/צֹּ֔ר עַל הָ/עֲבֹדָ֖ה אֲשֶׁר עָבַ֥ד עָלֶֽי/הָ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/018.yaml
  text: Son of man[a], Nebuchadnezzar king of Babylon made his army labor greatly against Tyre; every head was made bald and every shoulder was rubbed bare[c][b], yet there was no pay for him or for his army from Tyre for the labor that he had performed against it.
translation:
  language: pt
  text: Filho do homem[a], Nabucodonosor, rei da Babilônia, fez seu exército executar um trabalho pesado[b] contra Tiro. Toda cabeça ficou calva, e todo ombro ficou esfolado[c]. Contudo, não houve pagamento de Tiro para ele nem para seu exército pelo trabalho que realizou contra ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Mortal”. “Filho do homem” traduz literalmente uma forma comum de Deus se dirigir a Ezequiel.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir por “um grande trabalho” ou “um serviço árduo”.
    reason: lexical_alternative
  - marker: c
    text: As cabeças calvas e os ombros esfolados provavelmente retratam o desgaste físico causado pelo trabalho do cerco.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva literalmente a fórmula de tratamento característica e repetida em Ezequiel, sem eliminar seu sentido idiomático de ser humano mortal, registrado em nota.
- source_word: הֶעֱבִיד אֶת חֵילוֹ
  choice: fez seu exército executar
  rationale: Expressa a força causativa do hifil de עבד e entende חַיִל, neste contexto militar, como exército.
- source_word: עֲבֹדָה גְדֹלָה
  choice: um trabalho pesado
  rationale: Comunica a intensidade e o caráter penoso do serviço, de maneira natural em português; a alternativa mais formal, 'um grande trabalho', consta em nota.
- source_word: אֶל צֹר
  choice: contra Tiro
  rationale: O contexto militar indica direção hostil, não trabalho em benefício de Tiro.
- source_word: כָּל רֹאשׁ מֻקְרָח
  choice: Toda cabeça ficou calva
  rationale: Mantém a imagem coletiva e o estado resultante expresso pelo particípio passivo.
- source_word: וְכָל כָּתֵף מְרוּטָה
  choice: e todo ombro ficou esfolado
  rationale: Traduz a ideia de pele ou superfície raspada e desgastada, com formulação clara e corporal em português.
- source_word: שָׂכָר
  choice: pagamento
  rationale: Designa a compensação devida pelo trabalho, sem restringi-la necessariamente a salário regular.
- source_word: מִצֹּר
  choice: de Tiro
  rationale: Preserva a origem da compensação que não foi obtida na campanha.
- source_word: עַל הָעֲבֹדָה אֲשֶׁר עָבַד עָלֶיהָ
  choice: pelo trabalho que realizou contra ela
  rationale: Evita repetição artificial em português, conserva o motivo do trabalho e entende o sufixo feminino como referência a Tiro.
theological_decisions:
- issue: Sentido da fórmula בֶּן אָדָם
  choice: Filho do homem
  alternative: Mortal; ser humano
  rationale: A tradução formal preserva a fórmula literária própria de Ezequiel, enquanto a nota reconhece seu sentido idiomático sem impor conotação cristológica ao contexto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém as imagens concretas e a lógica de trabalho sem pagamento, mas evita calques pouco naturais. As notas preservam alternativas lexicais e explicam a provável imagem do trabalho de cerco.
