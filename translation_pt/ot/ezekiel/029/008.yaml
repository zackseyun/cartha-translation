  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י מֵבִ֥יא עָלַ֖יִ/ךְ חָ֑רֶב וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ אָדָ֥ם וּ/בְהֵמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am bringing a sword against you[b], and I will cut off from you man and beast.'
translation:
  language: pt
  text: 'Portanto, assim diz o Senhor Yahweh: Eis que estou trazendo contra você uma espada[a] e eliminarei do seu meio seres humanos e animais[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que trarei uma espada contra você”. O singular “espada” pode representar coletivamente a guerra e o juízo.'
    reason: lexical_alternative
  - marker: b
    text: “Seres humanos e animais” é uma fórmula recorrente de juízo que abrange tanto as pessoas quanto os animais.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a conexão lógica entre a acusação anterior e o juízo anunciado.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Preserva a fórmula profética tradicional em linguagem clara e solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Representa os dois elementos do título hebraico e conserva Yahweh como nome divino.
- source_word: הִנְנִי מֵבִיא
  choice: Eis que estou trazendo
  rationale: A construção com הִנְנִי e particípio apresenta a ação divina como vívida e iminente.
- source_word: עָלַיִךְ חָרֶב
  choice: a espada contra você
  rationale: Em português, 'contra você' exprime naturalmente a direção hostil; o singular pode representar guerra e juízo militar de modo coletivo.
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: e eliminarei do seu meio
  rationale: Comunica a remoção destrutiva expressa pelo hifil de כרת e torna natural a relação espacial com o Egito personificado.
- source_word: אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  rationale: Expressa claramente as duas categorias abrangidas pela fórmula de juízo sem sugerir apenas homens adultos nem restringir בְּהֵמָה a gado.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução conserva tanto o título אֲדֹנָי quanto o nome pessoal יהוה, evitando fundi-los ou ocultar o segundo.
- issue: Alcance de אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  alternative: homem e animal
  rationale: A expressão é uma fórmula abrangente de juízo sobre a população humana e animal, não uma afirmação limitada ao sexo masculino.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A fórmula profética foi mantida; 'você' retoma o Egito personificado no feminino no contexto hebraico, sem necessidade de marcar gênero em português. Os marcadores [a] e [b] aparecem no texto principal.
