  text: When they took hold of you with their hand[a], you were crushed, and you split open every shoulder for them; and when they leaned on you, you were broken[b], and you made all their hips stand unsteadily.
translation:
  language: pt
  text: Quando eles o agarraram com a mão[a], você foi esmagado e lhes feriu todos os ombros; quando se apoiaram em você, você se quebrou e fez vacilar todos os quadris deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz uma forma que, literalmente, pode significar “na sua mão” ou “na sua palma”. O sufixo singular torna a construção difícil; no contexto, a expressão é entendida como referência à mão de quem agarrava o caniço.
    reason: textual_difficulty
  - marker: b
    text: 'Literalmente, “todos os lombos deles”. A expressão hebraica da cláusula inteira é incomum e pode ser traduzida mais formalmente: “fez todos os lombos deles ficarem de pé”.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: בְּתָפְשָׂם בְּךָ
  choice: Quando eles o agarraram
  rationale: O infinitivo construto com בְּ introduz uma oração temporal. “Agarraram” mantém a ação concreta de segurar o caniço que representa o Egito.
- source_word: בכפך
  choice: com a mão
  rationale: A expressão pertence à imagem concreta de agarrar um caniço. O sufixo do texto massorético produz uma leitura difícil (“sua mão/palma”); no contexto, a tradução principal exprime a mão de quem agarra, registrando a dificuldade textual em nota.
- source_word: תֵּרוֹץ
  choice: você foi esmagado
  rationale: O nifal de רצץ comunica ser esmagado ou quebrado. “Foi esmagado” preserva a força do verbo e o distingue do posterior שׁבר.
- source_word: וּבָקַעְתָּ לָהֶם כָּל כָּתֵף
  choice: e rasgou-lhes todos os ombros
  rationale: בקע indica fender ou abrir à força. No quadro do caniço que se parte e fere quem o segura, “rasgou” é natural em português e mantém a imagem corporal de כָּתֵף, “ombro”.
- source_word: וּבְהִשָּׁעֲנָם עָלֶיךָ
  choice: quando se apoiaram em você
  rationale: Mantém a imagem física de pessoas apoiando o peso num caniço, sem substituir a metáfora por uma explicação abstrata de confiança política.
- source_word: תִּשָּׁבֵר
  choice: você se quebrou
  rationale: O nifal de שׁבר significa quebrar-se ou ser quebrado. A forma pronominal é idiomática em português e distingue este verbo do anterior רצץ.
- source_word: וְהַעֲמַדְתָּ לָהֶם כָּל מָתְנָיִם
  choice: e fez vacilar todos os quadris deles
  rationale: O hifil de עמד significa literalmente “fazer ficar de pé”, mas, neste contexto, descreve a instabilidade causada pela quebra do apoio. “Fez vacilar” comunica esse efeito; “quadris” traduz מָתְנַיִם em linguagem corporal corrente.
theological_decisions:
- issue: Metáfora do Egito como apoio enganoso
  choice: Conservar no texto a ação física de agarrar e apoiar-se no caniço
  alternative: Explicitar como “confiar no Egito” ou “depender de você”
  rationale: O versículo prolonga a metáfora profética do Egito como bordão de caniço. Preservar a imagem permite que sua implicação política e teológica permaneça presente sem ser imposta por paráfrase.
- issue: Sentido da cláusula final sobre מָתְנָיִם
  choice: Traduzir o efeito contextual como “fez vacilar todos os quadris deles”
  alternative: Traduzir formalmente “fez ficar de pé todos os seus lombos”
  rationale: A formulação hebraica é incomum. A tradução escolhida comunica a perda de estabilidade causada pelo colapso do apoio, sem transformar a metáfora em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com formas correntes como “você” e “quadris”. A construção mantém a sequência vívida de ações corporais do hebraico e diferencia רצץ (“esmagado”) de שׁבר (“quebrou”).
