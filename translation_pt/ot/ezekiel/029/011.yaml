  text: לֹ֤א תַעֲבָר בָּ/הּ֙ רֶ֣גֶל אָדָ֔ם וְ/רֶ֥גֶל בְּהֵמָ֖ה לֹ֣א תַעֲבָר בָּ֑/הּ וְ/לֹ֥א תֵשֵׁ֖ב אַרְבָּעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/011.yaml
  text: No human foot will pass through it[a], and no animal foot will pass through it; and it will not be inhabited for forty years.
translation:
  language: pt
  text: Nenhum pé humano passará por ela[a], nem pé de animal passará por ela; e ela ficará desabitada durante quarenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Não passará por ela pé de ser humano, nem passará por ela pé de animal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲבָר בָּהּ
  choice: passará por ela
  rationale: O verbo עבר com ב indica movimento através de uma terra ou região. “Passará por ela” é natural em português e conserva a imagem de atravessar o território.
- source_word: רֶגֶל אָדָם
  choice: pé humano
  rationale: A expressão significa literalmente “pé de ser humano” e funciona como referência coletiva ao trânsito de pessoas. “Pé humano” preserva a imagem e deixa claro que אָדָם é genérico, não especificamente masculino.
- source_word: רֶגֶל בְּהֵמָה
  choice: pé de animal
  rationale: Mantém o paralelismo com “pé humano” e expressa de modo claro o sentido genérico de בְּהֵמָה.
- source_word: לֹא תֵשֵׁב
  choice: ficará desabitada
  rationale: No contexto de uma terra, ישב indica ser habitada ou povoada. A formulação escolhida é idiomática em português e conserva o estado resultante anunciado pela profecia.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: Expressa naturalmente em português a duração indicada pelo hebraico.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: “humano”, no sentido de qualquer pessoa
  alternative: “homem”
  rationale: A declaração diz respeito a todo trânsito humano, não apenas a indivíduos do sexo masculino. “Pé humano” preserva tanto a abrangência quanto a imagem concreta do original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e paralelismo próximo ao hebraico. O pronome feminino “ela” retoma a terra do Egito no contexto.
