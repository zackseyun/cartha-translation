  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י נֹתֵ֛ן לִ/נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל אֶת אֶ֣רֶץ מִצְרָ֑יִם וְ/נָשָׂ֨א הֲמֹנָ֜/הּ וְ/שָׁלַ֤ל שְׁלָלָ/הּ֙ וּ/בָזַ֣ז בִּזָּ֔/הּ וְ/הָיְתָ֥ה שָׂכָ֖ר לְ/חֵילֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/019.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am giving the land of Egypt to Nebuchadnezzar king of Babylon, and he will carry off its multitude, plunder its spoil, and seize its booty; and it will be wages for his army.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: “Eis que entregarei a terra do Egito a Nabucodonosor, rei da Babilônia. Ele levará embora a riqueza[a] dela, saqueará o seu despojo e pilhará o seu butim; isso será a paga de seu exército.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico também pode significar “multidão” ou “abundância”; neste contexto de saque, provavelmente se refere à riqueza ou aos recursos do Egito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Preserva a relação de consequência com o oráculo anterior em português natural.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Mantém a fórmula profética tradicional com dignidade e clareza.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue אֲדֹנָי, traduzido como “Senhor”, do nome divino יהוה, transliterado “Yahweh”.
- source_word: הִנְנִי נֹתֵן
  choice: Eis que entregarei
  rationale: “Eis que” conserva a solenidade do anúncio, enquanto o futuro exprime de modo natural a ação iminente e certa do particípio hebraico.
- source_word: אֶרֶץ מִצְרָיִם
  choice: a terra do Egito
  rationale: Preserva o sentido territorial explícito de אֶרֶץ.
- source_word: וְנָשָׂא הֲמֹנָהּ
  choice: Ele levará embora a riqueza dela
  rationale: הָמוֹן pode indicar multidão, abundância ou riqueza; o contexto de saque e remuneração militar favorece “riqueza”, sem ocultar a alternativa em nota.
- source_word: וְשָׁלַל שְׁלָלָהּ
  choice: saqueará os seus despojos
  rationale: Reproduz, na medida possível, a construção cognata e mantém o campo semântico militar.
- source_word: וּבָזַז בִּזָּהּ
  choice: tomará os seus bens
  rationale: Expressa em português claro a tomada violenta do butim, evitando uma repetição pouco natural como “pilhará a sua pilhagem”.
- source_word: וְהָיְתָה שָׂכָר לְחֵילוֹ
  choice: isso servirá de pagamento para o exército dele
  rationale: שָׂכָר é pagamento ou salário, e חַיִל designa aqui a força militar de Nabucodonosor.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A opção conserva tanto o título אֲדֹנָי quanto o nome próprio divino יהוה, sem fundi-los nem repetir “Senhor”.
- issue: Agência divina na entrega do Egito
  choice: entregarei a terra do Egito a Nabucodonosor
  alternative: estou dando a terra do Egito a Nabucodonosor
  rationale: O futuro português comunica a ação divina iminente e certa; não reduz a afirmação a mera permissão humana.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém a cadência profética sem arcaísmos excessivos e preserva em nota a ambiguidade de הָמוֹן.
