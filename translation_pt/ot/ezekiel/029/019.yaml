revisions:
- from: 'Por isso, assim diz o Senhor Yahweh: “Eis que entregarei a terra do Egito a Nabucodonosor, rei da Babilônia. Ele levará embora a riqueza[a] dela, saqueará os seus despojos e tomará os seus bens; isso servirá de pagamento para o exército dele.”'
  to: 'Por isso, assim diz o Senhor Yahweh: “Eis que entregarei a terra do Egito a Nabucodonosor, rei da Babilônia. Ele levará embora a riqueza[a] dela, saqueará o seu despojo e pilhará o seu butim; isso será a paga de seu exército.”'
  rationale: 'A revisão conserva a leitura contextual de הֲמוֹנָהּ como «riqueza», com a alternativa lexical indicada em nota, e torna mais explícito o léxico de saque nas duas cláusulas paralelas: «despojo» para שְׁלָל e «butim» para בִּזָּה. Também esclarece que o pronome se refere a Nabucodonosor e formula a compensação militar de modo mais conciso.'
