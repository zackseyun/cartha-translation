  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה אֶֽרֶץ מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה וְ/חָרְבָּ֔ה וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה יַ֧עַן אָמַ֛ר יְאֹ֥ר לִ֖/י וַ/אֲנִ֥י עָשִֽׂיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/009.yaml
  text: And the land of Egypt will become a desolation and a waste[a], and they will know that I am Yahweh, because he said, ‘The Nile is mine, and I made it.’
translation:
  language: pt
  text: 'A terra do Egito se tornará uma desolação e uma ruína, e eles saberão que eu sou Yahweh, porque ele disse: “O Nilo[a] é meu, e fui eu que o fiz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em hebraico, literalmente “o rio”; no contexto do Egito, refere-se ao Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: se tornará
  rationale: O perfeito com waw em discurso profético expressa aqui o resultado futuro; “se tornará” comunica naturalmente a passagem para esse estado.
- source_word: אֶרֶץ מִצְרַיִם
  choice: a terra do Egito
  rationale: Preserva o sentido territorial concreto de אֶרֶץ e soa natural em português.
- source_word: לִשְׁמָמָה וְחָרְבָּה
  choice: uma desolação e uma ruína
  rationale: Mantém os dois substantivos hebraicos e sua força cumulativa, sem reduzir a expressão a simples adjetivos.
- source_word: וְיָדְעוּ
  choice: e eles saberão
  rationale: Preserva o sujeito plural não especificado e a fórmula de reconhecimento característica de Ezequiel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, preservando sua função de nome próprio.
- source_word: יַעַן אָמַר
  choice: porque ele disse
  rationale: יַעַן introduz a razão do juízo, e o masculino singular de אָמַר é mantido sem explicitar além do texto quem é o falante.
- source_word: יְאֹר
  choice: o Nilo
  rationale: No contexto egípcio, יְאֹר designa especificamente o Nilo; a nota registra a forma mais literal, “rio”.
- source_word: לִי
  choice: é meu
  rationale: Expressa de modo direto e enfático a alegação de posse.
- source_word: וַאֲנִי עָשִׂיתִי
  choice: e fui eu que o fiz
  rationale: A construção clivada reproduz em português a ênfase do pronome explícito אֲנִי, enquanto “fiz” mantém o sentido comum de עָשָׂה.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR ou Jeová
  rationale: O hebraico traz diretamente o Tetragrama; “Yahweh” preserva o nome próprio sem substituí-lo por um título.
- issue: Ênfase da alegação de ter feito o Nilo
  choice: fui eu que o fiz
  alternative: eu o fiz
  rationale: A formulação escolhida conserva a ênfase do pronome hebraico explícito sem transformar עָשָׂה no termo teologicamente mais específico “criar”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição coordenada do hebraico foi preservada, e a nota foi colocada junto de “Nilo”, o termo ao qual se refere.
