  text: וְ/נָתַתִּ֣י אֶת אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּ/ת֣וֹךְ אֲרָצ֣וֹת נְשַׁמּ֗וֹת וְ/עָרֶ֨י/הָ֙ בְּ/ת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה וַ/הֲפִצֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְֽ/זֵרִיתִ֖י/ם בָּ/אֲרָצֽוֹת־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/012.yaml
  text: And I will make the land of Egypt a desolation among desolated lands[a], and her cities will be a desolation among ruined cities for forty years[b]; and I will scatter Egypt among the nations and disperse them through the lands.
translation:
  language: pt
  text: Farei da terra do Egito uma desolação entre terras devastadas[a], e suas cidades ficarão desoladas entre cidades em ruínas durante quarenta anos; espalharei o Egito entre as nações e dispersarei seu povo pelas terras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «entre terras desoladas» e «entre cidades devastadas». Nos dois membros paralelos, o hebraico emprega termos estreitamente relacionados para devastação e ruína.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o povo do Egito. O hebraico passa do nome do lugar, «Egito», para um pronome plural, «eles».
    reason: referent_clarification
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Farei
  rationale: Neste contexto, נתן com o objeto seguido de שְׁמָמָה significa tornar ou fazer ficar em determinado estado; «farei» expressa naturalmente essa força resultativa.
- source_word: אֶרֶץ מִצְרַיִם
  choice: a terra do Egito
  rationale: Preserva a referência territorial explícita do hebraico, importante no anúncio de devastação.
- source_word: שְׁמָמָה
  choice: uma desolação / desoladas
  rationale: O substantivo indica um estado severo de devastação. A primeira ocorrência mantém a forma nominal; na segunda, a forma adjetival produz português mais natural sem enfraquecer o sentido.
- source_word: בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת
  choice: entre terras devastadas
  rationale: «Entre» comunica de modo idiomático a localização do Egito no conjunto de outras terras devastadas.
- source_word: וְעָרֶיהָ
  choice: e suas cidades
  rationale: O possessivo retoma naturalmente «terra do Egito» em português, sem exigir personificação feminina.
- source_word: בְּתוֹךְ עָרִים מָחֳרָבוֹת
  choice: entre cidades em ruínas
  rationale: מָחֳרָבוֹת descreve cidades arruinadas ou reduzidas a ruínas; a expressão é clara e corrente.
- source_word: אַרְבָּעִים שָׁנָה
  choice: durante quarenta anos
  rationale: Expressa diretamente a duração temporal indicada pelo hebraico.
- source_word: וַהֲפִצֹתִי אֶת מִצְרַיִם
  choice: espalharei o Egito
  rationale: Mantém o topônimo empregado no hebraico e sua função metonímica para os habitantes, preservando a mudança de referência do texto-fonte.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Tradução direta e convencional de גּוֹיִם neste contexto profético.
- source_word: וְזֵרִיתִים בָּאֲרָצוֹת
  choice: dispersarei seu povo por diversas terras
  rationale: זרה em paralelo com פוץ comunica dispersão. «Seu povo» explicita o referente humano do sufixo plural, e «por diversas terras» transmite a distribuição geográfica sem sugerir que o artigo hebraico se refere a terras previamente identificadas.
theological_decisions:
- issue: Referente de «Egito» na declaração sobre dispersão
  choice: Conservar «o Egito» na primeira oração e esclarecer o referente humano como «seu povo» na segunda.
  alternative: Traduzir diretamente «os egípcios» nas duas orações.
  rationale: O hebraico emprega primeiro o topônimo מִצְרַיִם e depois um sufixo pronominal plural. A tradução preserva essa transição metonímica sem deixar obscuro que são os habitantes que serão dispersos.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva o paralelismo profético e a metonímia do hebraico, esclarecendo-a apenas onde necessário.
