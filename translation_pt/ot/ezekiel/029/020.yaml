  text: פְּעֻלָּת/וֹ֙ אֲשֶׁר עָ֣בַד בָּ֔/הּ נָתַ֥תִּי ל֖/וֹ אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/020.yaml
  text: As his wages for which he labored against it[a], I have given him the land of Egypt, because they worked for me[c][b], declares the Lord GOD.
translation:
  language: pt
  text: Como pagamento pelo trabalho que realizou contra ela[a], dei-lhe a terra do Egito, porque eles trabalharam para mim[b], declara o Senhor DEUS.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como recompensa por seu trabalho, que realizou contra ela”. “Ela” provavelmente se refere a Tiro, mencionada no versículo 18. O substantivo hebraico pode significar “trabalho”, “feito” ou “pagamento/recompensa”.'
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: 'Ou: “porque agiram por mim” ou “porque fizeram isso por mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעֻלָּתוֹ
  choice: pagamento pelo trabalho
  rationale: O substantivo pode indicar trabalho, feito ou recompensa/salário. A expressão comunica naturalmente o sentido compensatório do contexto sem apagar sua relação lexical com o trabalho realizado.
- source_word: אֲשֶׁר עָבַד בָּהּ
  choice: que realizou contra ela
  rationale: עבד significa trabalhar ou servir; aqui descreve o esforço militar contra Tiro. O pronome feminino é mantido para preservar a referência discursiva.
- source_word: נָתַתִּי לוֹ
  choice: dei-lhe
  rationale: O perfeito hebraico apresenta a concessão como ato decidido ou consumado; o pretérito perfeito é direto e natural em português.
- source_word: אֶת אֶרֶץ מִצְרָיִם
  choice: a terra do Egito
  rationale: Mantém a formulação territorial explícita do hebraico.
- source_word: אֲשֶׁר עָשׂוּ לִי
  choice: porque trabalharam para mim
  rationale: Embora עשה seja literalmente amplo, 'fazer', o contexto de serviço militar e pagamento favorece 'trabalharam', preservando a afirmação de que executaram uma tarefa em favor de Deus.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor DEUS
  rationale: Emprega a fórmula profética corrente e a convenção portuguesa que distingue אֲדֹנָי יְהוִה por 'Senhor DEUS'.
theological_decisions:
- issue: Referente do sufixo feminino em בָּהּ
  choice: O pronome 'ela' remete provavelmente a Tiro, conforme o contexto imediato.
  alternative: O sufixo poderia referir-se mais genericamente à tarefa ou ao serviço militar.
  rationale: Ezequiel 29:18 menciona expressamente o árduo serviço de Nabucodonosor contra Tiro. A tradução conserva o pronome, enquanto a nota identifica o referente provável sem torná-lo explícito no corpo do texto.
- issue: Agência em אֲשֶׁר עָשׂוּ לִי
  choice: Nabucodonosor e suas tropas trabalharam para Deus como instrumentos de seu juízo.
  alternative: Eles agiram somente em função de seus próprios objetivos imperiais.
  rationale: A frase hebraica atribui a ação deles a serviço de Deus. A tradução mantém essa tensão sem sugerir aprovação geral de seus motivos ou uma relação de aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção evita linguagem excessivamente técnica, conserva o pronome ambíguo do hebraico no texto e esclarece seu referente provável em nota.
