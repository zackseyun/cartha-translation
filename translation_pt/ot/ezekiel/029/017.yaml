  text: וַ/יְהִ֗י בְּ/עֶשְׂרִ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/017.yaml
  text: And it happened in the twenty-seventh year[a], in the first month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'E aconteceu que, no vigésimo sétimo ano, no primeiro mês, no primeiro dia do mês, a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: No vigésimo sétimo ano... a palavra de Yahweh veio a mim
  rationale: A forma narrativa introduz o aviso profético datado. Em português, sua força é expressa naturalmente pela oração principal, sem acrescentar o pouco idiomático “e aconteceu”.
- source_word: בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: no vigésimo sétimo ano
  rationale: A fórmula cronológica hebraica é vertida pelo ordinal idiomático em português.
- source_word: בָּרִאשׁוֹן
  choice: no primeiro mês
  rationale: Embora “mês” esteja implícito nessa expressão, o contexto da data o exige e sua explicitação produz clareza natural.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: O hebraísmo literalmente relacionado a “um do mês” designa o primeiro dia do mês.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: a palavra de Yahweh veio a mim
  rationale: Mantém a fórmula profética tradicional em português e comunica naturalmente a recepção da revelação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz de modo convencional a fala direta que continua no versículo seguinte.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Javé; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e evita substituí-lo pelo título “SENHOR”; também segue a transliteração adotada pelo projeto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legível no Brasil. A data foi mantida de forma explícita, e os dois-pontos indicam que o oráculo prossegue no versículo seguinte.
