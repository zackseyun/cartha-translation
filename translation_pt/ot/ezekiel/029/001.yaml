base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/001.yaml
  text: In the tenth year[a], in the tenth month, on the twelfth day of the month, the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'No décimo ano, no décimo mês, no décimo segundo dia do mês, a palavra de Yahweh veio a mim, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָעֲשִׂירִית
  choice: No décimo ano
  rationale: A fórmula hebraica não explicita neste versículo o ponto de referência do ano; a tradução preserva essa ausência sem acrescentar «do exílio» ou «do reinado».
- source_word: בָּעֲשִׂרִי
  choice: no décimo mês
  rationale: Embora «mês» esteja implícito neste segmento, o substantivo é exigido para clareza e é confirmado por לַחֹדֶשׁ no próprio versículo.
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ
  choice: no décimo segundo dia do mês
  rationale: A construção hebraica indica o dia dentro do mês; «dia» é explicitado naturalmente em português.
- source_word: הָיָה דְבַר יְהוָה
  choice: a palavra de Yahweh veio
  rationale: A tradução idiomática da fórmula profética comunica o início da revelação divina; «veio» reproduz seu sentido usual sem ampliar o texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Expressa de modo claro e natural a direção da palavra ao profeta.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz a fala divina apresentada no versículo seguinte; os dois-pontos são naturais em português neste contexto.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O hebraico traz diretamente o Tetragrama; «Yahweh» preserva o nome pessoal mediante uma transliteração amplamente reconhecida, sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fórmula cronológica formal e redação natural. Não se acrescenta um marco histórico ausente do versículo hebraico.
