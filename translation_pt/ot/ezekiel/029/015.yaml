  text: מִן הַ/מַּמְלָכוֹת֙ תִּהְיֶ֣ה שְׁפָלָ֔ה וְ/לֹֽא תִתְנַשֵּׂ֥א ע֖וֹד עַל הַ/גּוֹיִ֑ם וְ/הִ֨מְעַטְתִּ֔י/ם לְ/בִלְתִּ֖י רְד֥וֹת בַּ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/015.yaml
  text: It will be the lowliest of the kingdoms[a], and it will no longer exalt itself above the nations; and I will diminish them[d][c][b], so that they will not rule over the nations.
translation:
  language: pt
  text: Será o mais baixo dos reinos[a] e não voltará a se exaltar acima das nações[b]. Eu os reduzirei[c], para que não dominem as nações[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os reinos”. A construção hebraica apresenta o Egito como o mais rebaixado em comparação com os outros reinos.
    reason: lexical_alternative
  - marker: b
    text: Ou “não voltará a ser elevado”. O hebraico pode indicar tanto elevação passiva quanto exaltação própria; o contexto de orgulho nacional favorece “se exaltar”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “farei com que sejam poucos”. O pronome é plural e se refere coletivamente ao povo ou ao poder do Egito.
    reason: lexical_alternative
  - marker: d
    text: Literalmente, “nas” ou “entre as nações”. Com o verbo “dominar”, o sentido contextual é exercer domínio sobre elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמַּמְלָכוֹת תִּהְיֶה שְׁפָלָה
  choice: Será o mais humilde dos reinos
  rationale: 'A construção com מִן tem valor comparativo ou superlativo: o Egito ocupará a posição mais baixa em relação aos demais reinos. “O mais humilde dos reinos” é natural em português e mantém o tema de rebaixamento.'
- source_word: וְלֹא תִתְנַשֵּׂא עוֹד
  choice: e não voltará a se exaltar
  rationale: A forma verbal pode indicar exaltação própria ou elevação. A tradução reflexiva se ajusta ao contexto do orgulho e da supremacia política, enquanto a nota preserva a alternativa passiva.
- source_word: עַל הַגּוֹיִם
  choice: acima das nações
  rationale: Com o verbo de exaltação, עַל expressa superioridade metafórica; “acima das nações” evita confusão com a regência do verbo “dominar” na oração seguinte.
- source_word: וְהִמְעַטְתִּים
  choice: Eu os reduzirei
  rationale: O hifil de מעט significa tornar poucos, pequenos ou reduzidos. “Reduzirei” comunica de modo natural a diminuição do povo ou do poder do Egito, enquanto a nota registra a forma concreta do hebraico e o pronome plural.
- source_word: לְבִלְתִּי רְדוֹת
  choice: para que não dominem
  rationale: לְבִלְתִּי apresenta a finalidade ou o resultado impeditivo, e רדה denota exercer domínio. A formulação preserva essa relação sem decidir rigidamente entre propósito e resultado.
- source_word: בַּגּוֹיִם
  choice: sobre as nações
  rationale: Embora בְּ possa significar “entre”, com רדה a expressão se refere ao exercício de domínio em relação às nações; “dominar sobre” é claro e idiomático em português bíblico atual.
