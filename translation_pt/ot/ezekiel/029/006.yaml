id: EZK.29.6
reference: Ezekiel 29:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל יֹשְׁבֵ֣י מִצְרַ֔יִם כִּ֖י אֲנִ֣י יְהוָ֑ה יַ֧עַן הֱיוֹתָ֛/ם מִשְׁעֶ֥נֶת קָנֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/006.yaml
  text: Then all the inhabitants of Egypt will know that I am Yahweh[a], because they were a staff of reed to the house of Israel.
translation:
  language: pt
  text: Então todos os habitantes do Egito saberão que eu sou Yahweh, porque eram um bordão de cana[a] para a casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um apoio de caniço”. A imagem hebraica é de algo usado como suporte, mas frágil demais para aguentar peso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Então ... saberão
  rationale: No discurso profético, a conjunção faz avançar a sequência e aqui tem força de resultado. “Saberão” preserva a fórmula de reconhecimento recorrente em Ezequiel.
- source_word: כָּל יֹשְׁבֵי מִצְרַיִם
  choice: todos os habitantes do Egito
  rationale: Expressa naturalmente em português o sentido coletivo de “todos os que habitam no Egito”.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: Mantém a fórmula de reconhecimento e translitera diretamente o nome divino יהוה.
- source_word: יַעַן הֱיוֹתָם
  choice: porque eram
  rationale: Converte de modo idiomático a construção hebraica com infinitivo e sufixo em uma oração causal finita, sem alterar sua referência temporal contextual.
- source_word: מִשְׁעֶנֶת קָנֶה
  choice: um bordão de cana
  rationale: Preserva a metáfora concreta de um objeto usado como apoio, mas frágil demais para sustentar peso, preparando a continuação da imagem no versículo seguinte.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: Representa a relação indicada pela preposição ל e conserva a expressão coletiva e pactual “casa de Israel”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o Tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Bordão de cana” mantém a imagem profética concreta; “casa de Israel” conserva a expressão bíblica coletiva sem soar excessivamente arcaica.
