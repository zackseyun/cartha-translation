  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה מִ/קֵּ֞ץ אַרְבָּעִ֤ים שָׁנָה֙ אֲקַבֵּ֣ץ אֶת מִצְרַ֔יִם מִן הָ/עַמִּ֖ים אֲשֶׁר נָפֹ֥צוּ שָֽׁמָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/013.yaml
  text: 'For thus says the Lord GOD: At the end of forty years I will gather Egypt from the peoples among whom they were scattered[a].'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: “Ao fim de quarenta anos, reunirei o Egito dentre os povos[a] entre os quais os egípcios foram dispersos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Mantém a função explicativa ou causal do conectivo no contexto, com formulação natural em português.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Reproduz a fórmula profética tradicional de modo claro, digno e atual.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e representa o nome divino יְהוָה como Yahweh.
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: Ao fim de quarenta anos
  rationale: Expressa com precisão a conclusão do período indicado no hebraico.
- source_word: אֲקַבֵּץ
  choice: reunirei
  rationale: Comunica a ideia de juntar novamente um povo disperso, sem tornar explícitas implicações além do verbo hebraico.
- source_word: אֶת מִצְרַיִם
  choice: o Egito
  rationale: Mantém o nome do país usado metonimicamente como entidade coletiva, em vez de substituí-lo diretamente por 'os egípcios'.
- source_word: מִן הָעַמִּים
  choice: dentre os povos
  rationale: Traduz de perto o plural עַמִּים; 'nações' continua sendo uma alternativa possível.
- source_word: אֲשֶׁר נָפֹצוּ שָׁמָּה
  choice: entre os quais os egípcios foram dispersos
  rationale: Torna explícito em português o sujeito plural implícito do verbo hebraico, referente ao povo do Egito, e preserva a relação locativa com os povos.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A escolha conserva o título אֲדֹנָי e translitera o nome da aliança יְהוָה, evitando a forma redundante 'Senhor SENHOR'.
- issue: Referente plural de נָפֹצוּ após o objeto coletivo 'Egito'
  choice: os egípcios foram dispersos
  alternative: eles foram dispersos
  rationale: O hebraico passa do nome coletivo 'Egito' a um verbo no plural. A explicitação identifica o referente gramatical sem alterar o sentido corporativo nem sugerir que o território tenha sido disperso.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A citação direta foi pontuada com dois-pontos e aspas; a formulação conserva a solenidade da declaração profética sem arcaísmos desnecessários.
