source:
  edition: WLC
  text: וְ/לֹ֣א יִֽהְיֶה עוֹד֩ לְ/בֵ֨ית יִשְׂרָאֵ֤ל לְ/מִבְטָח֙ מַזְכִּ֣יר עָוֺ֔ן בִּ/פְנוֹתָ֖/ם אַחֲרֵי/הֶ֑ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/016.yaml
  text: And it will no longer be for the house of Israel a source of confidence[a], bringing iniquity to remembrance when they turn after them[c][b]; then they will know that I am the Lord GOD.
translation:
  language: pt
  text: O Egito nunca mais será, para a casa de Israel, uma fonte de segurança[a] que lhes recordará a iniquidade[b] quando se voltarem para os egípcios. Então saberão que eu sou o Senhor Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um motivo de confiança” ou “um apoio seguro”. O termo hebraico indica algo em que se confia para obter segurança.
    reason: lexical_alternative
  - marker: b
    text: Ou “que lhes recordará a culpa”. O termo hebraico pode indicar a iniquidade cometida ou a culpa decorrente dela.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: Adonai YHWH, literalmente “Senhor YHWH”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה עוֹד
  choice: nunca mais será
  rationale: Expressa de modo natural em português a negação futura e a cessação indicadas por לֹא, o imperfeito de היה e עוֹד.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: Preserva a expressão coletiva e pactual 'casa de Israel', mantendo também o valor relacional da preposição לְ.
- source_word: לְמִבְטָח
  choice: uma fonte de segurança
  rationale: מִבְטָח pode designar aquilo em que alguém se apoia para obter confiança ou segurança; a formulação explicita que o Egito era objeto de confiança política.
- source_word: מַזְכִּיר עָוֺן
  choice: que faça lembrar sua iniquidade
  rationale: Mantém o sentido causativo do particípio hifil de זכר e o peso moral de עָוֺן. O possessivo 'sua' identifica pelo contexto a iniquidade de Israel, sem definir se a expressão enfatiza o pecado ou a culpa decorrente dele.
- source_word: בִּפְנוֹתָם אַחֲרֵיהֶם
  choice: quando eles se voltarem para os egípcios
  rationale: O infinitivo com בְּ indica circunstância temporal. Explicitar 'os egípcios' evita a ambiguidade pronominal pouco natural em português e preserva a ideia de Israel buscar o Egito como aliado e apoio.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: O valor consecutivo ou resultativo da conjunção é expresso naturalmente por 'então'; o sujeito permanece implícito como no hebraico e é recuperável do contexto.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Representa os dois elementos do título hebraico: אֲדֹנָי como ''Senhor'' e o nome divino יהוה como ''Yahweh'', sem produzir a repetição artificial ''Senhor SENHOR''.'
theological_decisions:
- issue: A confiança de Israel no Egito
  choice: uma fonte de segurança
  alternative: um motivo de confiança
  rationale: A expressão apresenta o Egito como objeto de dependência e segurança, preservando a crítica à confiança de Israel numa potência estrangeira sem acrescentar uma aplicação doutrinária.
- issue: O alcance de עָוֺן
  choice: iniquidade
  alternative: culpa
  rationale: O termo pode abranger tanto a transgressão quanto a culpa resultante. 'Iniquidade' preserva o foco no mal cometido, enquanto uma nota registra a alternativa legítima.
- issue: O nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: A escolha conserva tanto o título אֲדֹנָי quanto o nome próprio יהוה e evita ocultar o nome divino, ao mesmo tempo que a nota informa a forma hebraica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. 'O Egito' e 'os egípcios' explicitam os referentes pronominais fornecidos pelo contexto imediato. A construção preserva a tensão entre iniquidade e culpa por meio de nota, sem decidir além do que o hebraico permite.
