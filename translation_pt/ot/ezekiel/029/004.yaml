  text: וְ/נָתַתִּ֤י חחיים בִּ/לְחָיֶ֔י/ךָ וְ/הִדְבַּקְתִּ֥י דְגַת יְאֹרֶ֖י/ךָ בְּ/קַשְׂקְשֹׂתֶ֑י/ךָ וְ/הַעֲלִיתִ֨י/ךָ֙ מִ/תּ֣וֹךְ יְאֹרֶ֔י/ךָ וְ/אֵת֙ כָּל דְּגַ֣ת יְאֹרֶ֔י/ךָ בְּ/קַשְׂקְשֹׂתֶ֖י/ךָ תִּדְבָּֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/004.yaml
  text: I will put hooks in your jaws[a], and I will make the fish of your Nile channels cling to your scales; and I will bring you up from the midst of your Nile channels[b], and all the fish of your Nile channels will cling to your scales.
translation:
  language: pt
  text: Porei ganchos nas suas mandíbulas[a] e farei os peixes dos seus canais do Nilo[b] se prenderem às suas escamas. Eu o farei subir do meio dos seus canais do Nilo, e todos os peixes dos seus canais do Nilo se prenderão às suas escamas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas suas faces”. A palavra hebraica pode significar “mandíbula” ou “face/bochecha”; “mandíbulas” combina melhor com a imagem de uma criatura fluvial capturada por ganchos.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus rios” ou “seus canais”. Em contextos egípcios, o termo hebraico se refere ao Nilo e aos seus cursos de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: חחיים
  choice: ganchos
  rationale: O substantivo designa instrumentos usados para prender ou arrastar um animal pela mandíbula; “ganchos” comunica com naturalidade a captura da grande criatura fluvial.
- source_word: בִּלְחָיֶיךָ
  choice: nas suas mandíbulas
  rationale: לְחִי pode significar “mandíbula” ou “face/bochecha”. No contexto de ganchos postos numa criatura fluvial, “mandíbulas” se ajusta melhor à imagem.
- source_word: וְהִדְבַּקְתִּי
  choice: farei ... se prenderem
  rationale: A forma causativa de דבק indica que Deus fará os peixes aderirem às escamas da criatura.
- source_word: דְגַת
  choice: os peixes
  rationale: O singular coletivo em estado construto é expresso naturalmente em português pelo plural coletivo “os peixes”.
- source_word: יְאֹרֶיךָ
  choice: seus canais do Nilo
  rationale: Nos oráculos de Ezequiel contra o Egito, יְאֹר designa o Nilo e seus cursos ou canais; a expressão também preserva o plural hebraico.
- source_word: בְּקַשְׂקְשֹׂתֶיךָ
  choice: às suas escamas
  rationale: Com דבק, a preposição indica aderência; “prender-se às escamas” é idiomático e mantém a imagem.
- source_word: וְהַעֲלִיתִיךָ
  choice: Eu o tirarei
  rationale: O hifil de עלה descreve fazer subir a criatura para fora da água. “Tirarei” expressa em português natural o movimento ascendente sugerido pelo contexto sem acrescentar o meio empregado.
- source_word: מִתּוֹךְ
  choice: do meio de
  rationale: A expressão destaca que a criatura será retirada de dentro dos cursos do Nilo.
- source_word: תִּדְבָּק
  choice: ficarão presos
  rationale: A forma qal predica dos peixes como coletivo que eles permanecerão aderidos às escamas. O plural português concorda naturalmente com “todos os peixes”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “seus canais do Nilo” foi mantida para refletir a insistência retórica do hebraico; a estrutura causativa e a mudança para a declaração final de aderência também foram preservadas.
