  text: לָ/כֵ֛ן הִנְ/נִ֥י אֵלֶ֖י/ךָ וְ/אֶל יְאֹרֶ֑י/ךָ וְ/נָתַתִּ֞י אֶת אֶ֣רֶץ מִצְרַ֗יִם לְ/חָרְבוֹת֙ חֹ֣רֶב שְׁמָמָ֔ה מִ/מִּגְדֹּ֥ל סְוֵנֵ֖ה וְ/עַד גְּב֥וּל כּֽוּשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/010.yaml
  text: Therefore[a], behold, I am against you and against your Nile channels, and I will make the land of Egypt ruins, a desolation laid waste, from Migdol to Syene[c][b], as far as the border of Cush.
translation:
  language: pt
  text: Por isso, eis que estou contra você e contra os canais do seu Nilo[a]. Farei da terra do Egito ruínas, devastação e desolação, desde Migdol até Siene[b], até a fronteira de Cuxe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus rios” ou “seus canais”. Em contextos egípcios, o termo hebraico costuma designar especificamente o Nilo, seus braços ou seus canais.
    reason: lexical_alternative
  - marker: b
    text: Siene era uma cidade antiga próxima da atual Assuã e assinalava o extremo sul do Egito.
    reason: cultural_note
  - marker: c
    text: Cuxe era a região ao sul do Egito, muitas vezes associada à Núbia; não corresponde simplesmente às fronteiras do atual Estado da Etiópia.
    reason: cultural_note
lexical_decisions:
- source_word: יְאֹרֶיךָ
  choice: os braços do seu Nilo
  rationale: Em contexto egípcio, יְאֹר designa o Nilo e, no plural, seus braços ou canais. A expressão escolhida mantém a referência específica ao Nilo e soa natural em português.
- source_word: לְחָרְבוֹת חֹרֶב שְׁמָמָה
  choice: ruínas, devastação e desolação
  rationale: O hebraico acumula termos próximos para intensificar a imagem de destruição. A tradução preserva essa força cumulativa sem reduzir a expressão a uma única palavra.
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: desde Migdol até Siene
  rationale: Os topônimos são transliterados em suas formas portuguesas usuais; eles assinalam a extensão do território egípcio.
- source_word: וְעַד גְּבוּל כּוּשׁ
  choice: até a fronteira de Cuxe
  rationale: Cuxe preserva o nome antigo e evita a associação anacrônica com as fronteiras da Etiópia moderna.
- source_word: הִנְנִי אֵלֶיךָ
  choice: eis que estou contra você
  rationale: A formulação conserva a solenidade e a força da declaração profética de oposição divina, usando uma forma de tratamento corrente e clara.
- source_word: וְנָתַתִּי אֶת אֶרֶץ מִצְרַיִם
  choice: Farei da terra do Egito
  rationale: Neste contexto, נתן introduz o estado resultante imposto à terra; 'farei de' comunica esse valor idiomático com clareza.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sequência de três termos de destruição conserva a ênfase retórica do hebraico, e os nomes geográficos antigos são mantidos com notas explicativas.
