  text: בֶּן אָדָ֕ם שִׂ֣ים פָּנֶ֔י/ךָ עַל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וְ/הִנָּבֵ֣א עָלָ֔י/ו וְ/עַל מִצְרַ֖יִם כֻּלָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/002.yaml
  text: Son of man[a], set your face against Pharaoh king of Egypt, and prophesy against him and against all Egypt.
translation:
  language: pt
  text: Filho do homem[a], volte o rosto contra o faraó, rei do Egito, e profetize contra ele e contra todo o Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mortal” ou “Ser humano”. A expressão hebraica é um título recorrente dado a Ezequiel e também enfatiza sua condição humana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma masculina singular e a expressão profética recorrente dirigida a Ezequiel; a nota registra alternativas que ressaltam sua mortalidade ou humanidade.
- source_word: שִׂים פָּנֶיךָ
  choice: volte o rosto
  rationale: Reproduz de modo natural em português a imagem hebraica de orientar deliberadamente o rosto; a preposição 'contra' explicita o sentido hostil neste oráculo de juízo.
- source_word: עַל
  choice: contra
  rationale: Tanto com a ordem de voltar o rosto quanto com a de profetizar, o contexto de denúncia profética favorece o sentido adversativo.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Emprega a forma tradicional portuguesa do título real, com artigo conforme o uso corrente.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: rei do Egito
  rationale: Preserva a aposição que identifica o faraó.
- source_word: וְהִנָּבֵא
  choice: e profetize
  rationale: Verbo português padrão para o imperativo nifal de נבא, preservando a linguagem formal da comissão profética.
- source_word: עָלָיו
  choice: contra ele
  rationale: O contexto de juízo indica oposição, e não apenas que ele é o assunto da profecia.
- source_word: מִצְרַיִם כֻּלָּהּ
  choice: todo o Egito
  rationale: Expressa de forma concisa e natural a abrangência total indicada pelo hebraico.
