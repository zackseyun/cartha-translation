  naturalness: O português é claro, moderno e de registro adequado. ‘Aproximem-se, os encarregados da cidade’ é uma construção vocativa solene aceitável e preserva melhor a concisão do original. ‘Aos meus ouvidos em alta voz’ mantém a imagem hebraica e é compreensível.
