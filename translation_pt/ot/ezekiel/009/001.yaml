  text: וַ/יִּקְרָ֣א בְ/אָזְנַ֗/י ק֤וֹל גָּדוֹל֙ לֵ/אמֹ֔ר קָרְב֖וּ פְּקֻדּ֣וֹת הָ/עִ֑יר וְ/אִ֛ישׁ כְּלִ֥י מַשְׁחֵת֖/וֹ בְּ/יָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/001.yaml
  text: Then he cried out in my ears with a loud voice[a], saying, “Draw near, you executioners of the city[b], each with his weapon of destruction in his hand.”
translation:
  language: pt
  text: 'Então ele gritou aos meus ouvidos em alta voz, dizendo: “Aproximem-se, encarregados da cidade[a], cada um[b] com sua arma de destruição na mão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica também pode ser entendida como “os responsáveis pela cidade” ou “os agentes da visitação da cidade”. O termo pode indicar encargo, supervisão ou visitação; neste contexto, a visitação é de julgamento.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico, literalmente: “e cada homem, [com] sua arma de destruição na mão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: gritou
  rationale: O verbo pode significar “chamar” ou “clamar”; a menção de uma voz forte indica aqui um grito ou chamado intenso.
- source_word: בְאָזְנַי
  choice: aos meus ouvidos
  rationale: Mantém a imagem concreta e enfática do hebraico, embora “para eu ouvir” também fosse possível.
- source_word: קוֹל גָּדוֹל
  choice: em alta voz
  rationale: Expressão portuguesa natural que comunica o volume e preserva a construção nominal do hebraico.
- source_word: קָרְבוּ
  choice: Aproximem-se
  rationale: Reproduz o imperativo plural com tom solene e direto.
- source_word: פְּקֻדּוֹת הָעִיר
  choice: encarregados do julgamento da cidade
  rationale: O substantivo, derivado de פקד, pode envolver encargo, supervisão, visitação ou juízo. O contexto de armas destruidoras favorece agentes encarregados de executar o julgamento, sem identificá-los mais especificamente do que o texto permite.
- source_word: וְאִישׁ
  choice: cada um
  rationale: Expressa naturalmente o uso distributivo do singular hebraico “homem” em referência ao grupo convocado.
- source_word: כְּלִי מַשְׁחֵתוֹ
  choice: sua arma de destruição
  rationale: כְּלִי pode designar utensílio, instrumento ou arma; neste contexto de execução do juízo, “arma” é a opção mais clara, enquanto “de destruição” conserva a força de מַשְׁחֵת.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Mantém a imagem concreta e o singular distributivo do hebraico.
theological_decisions:
- issue: Sentido de פְּקֻדּוֹת הָעִיר no contexto do juízo
  choice: encarregados do julgamento da cidade
  alternative: encarregados da cidade; agentes da visitação da cidade; executores da cidade
  rationale: A expressão hebraica é lexicalmente ambígua e pode apontar para encargo, supervisão ou visitação punitiva. O contexto indica agentes armados do juízo, mas não exige chamá-los explicitamente de anjos nem reduzir o termo apenas a “executores”. A nota preserva as possibilidades relevantes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a vivacidade de “aos meus ouvidos” e explicita apenas o necessário para tornar inteligível a expressão hebraica difícil, deixando sua amplitude lexical documentada em nota.
