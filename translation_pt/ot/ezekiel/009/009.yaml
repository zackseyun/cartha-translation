  source_fidelity: 'O texto traduz adequadamente a acusação: עָוֺן como «iniquidade», a intensificação por «muitíssimo grande», דָּמִים como «derramamento de sangue», e a dupla afirmação de que Yahweh abandonou a terra e não vê. Para מֻטֶּה, porém, «injustiça» é a opção portuguesa mais clara no contexto de corrupção urbana e social, preservando o sentido de desvio do reto, especialmente da justiça.'
