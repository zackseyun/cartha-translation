source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י עֲוֺ֨ן בֵּֽית יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ גָּדוֹל֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַ/תִּמָּלֵ֤א הָ/אָ֨רֶץ֙ דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֣ה מֻטֶּ֑ה כִּ֣י אָמְר֗וּ עָזַ֤ב יְהוָה֙ אֶת הָ/אָ֔רֶץ וְ/אֵ֥ין יְהוָ֖ה רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/009.yaml
  text: Then he said to me[a], “The iniquity of the house of Israel and Judah is exceedingly great, and the land is filled with bloodshed, and the city is full of perversion. For they say, ‘Yahweh has forsaken the land, and Yahweh does not see.’”
translation:
  language: pt
  text: 'Então ele me disse: “A iniquidade da casa de Israel e de Judá é muitíssimo grande. A terra está cheia de derramamento de sangue, e a cidade está cheia de injustiça[a], pois eles dizem: ‘Yahweh abandonou a terra; Yahweh não vê’”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perversão” ou “distorção da justiça”. O termo hebraico indica algo torcido ou desviado do que é reto e pode incluir injustiça judicial.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺן
  choice: iniquidade
  rationale: O substantivo resume aqui a grave corrupção moral de Israel e Judá; “iniquidade” preserva sua força ética sem o interpretar como punição pela culpa.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: a casa de Israel e de Judá
  rationale: Mantém a expressão coletiva “casa” e explicita em português que Israel e Judá estão incluídos na acusação.
- source_word: גָּדוֹל בִּמְאֹד מְאֹד
  choice: muitíssimo grande
  rationale: Comunica de modo natural a forte intensificação produzida pela repetição de מְאֹד.
- source_word: דָּמִים
  choice: derramamento de sangue
  rationale: O plural hebraico, neste contexto de condenação social, aponta para mortes violentas e culpa de sangue, não apenas para sangue como substância.
- source_word: מֻטֶּה
  choice: perversão
  rationale: Preserva a ideia de algo torcido ou desviado do que é reto, sem limitar indevidamente o termo apenas à esfera judicial.
- source_word: עָזַב
  choice: abandonou
  rationale: Expressa com clareza atual a alegação de que Yahweh deixou a terra, mantendo o peso relacional e teológico do verbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico em vez de substituí-lo por um título.
- source_word: רֹאֶה
  choice: não vê
  rationale: Tradução direta do particípio, que expressa a negação da vigilância ou atenção divina atribuída pelos culpados.
theological_decisions:
- issue: Forma do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto emprega diretamente o tetragrama; “Yahweh” preserva o nome pessoal e pactual sem substituí-lo por um título.
- issue: Alcance de מֻטֶּה na acusação contra a cidade
  choice: perversão
  alternative: injustiça; distorção da justiça
  rationale: O termo sugere desvio ou torção do que é reto e pode incluir injustiça judicial, mas o contexto não exige que se restrinja seu sentido à administração formal da justiça.
- issue: Sentido de דָּמִים
  choice: derramamento de sangue
  alternative: sangue; culpa de sangue
  rationale: A forma plural em contexto de julgamento denuncia violência homicida e sua culpa, e a expressão escolhida conserva essa dimensão ética e social.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição enfática hebraica foi comunicada por “muitíssimo”; a estrutura paralela da acusação foi preservada. O marcador da nota foi colocado junto de “perversão”, termo ao qual a nota se refere.
