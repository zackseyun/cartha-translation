  terminology: «Yahweh» reproduz de modo consistente o tetragrama. «Casa de Israel e de Judá», «iniquidade» e «derramamento de sangue» são escolhas adequadas. A nota deve permanecer ancorada no termo que traduz מֻטֶּה e apresentar «perversão» e «distorção da justiça» como alternativas.
