  text: וְ/הִנֵּ֣ה שִׁשָּׁ֣ה אֲנָשִׁ֡ים בָּאִ֣ים מִ/דֶּרֶךְ שַׁ֨עַר הָ/עֶלְי֜וֹן אֲשֶׁ֣ר מָפְנֶ֣ה צָפ֗וֹנָ/ה וְ/אִ֨ישׁ כְּלִ֤י מַפָּצ/וֹ֙ בְּ/יָד֔/וֹ וְ/אִישׁ אֶחָ֤ד בְּ/תוֹכָ/ם֙ לָבֻ֣שׁ בַּדִּ֔ים וְ/קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָ֑י/ו וַ/יָּבֹ֨אוּ֙ וַ/יַּ֣עַמְד֔וּ אֵ֖צֶל מִזְבַּ֥ח הַ/נְּחֹֽשֶׁת׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/002.yaml
  text: And behold[a], six men were coming from the direction of the upper gate, which faces north, each with his weapon for smashing in his hand; and one man among them was clothed in linen, with a scribe’s writing case at his waist[b]. And they came and stood beside the bronze altar.
translation:
  language: pt
  text: E eis que seis homens vinham da direção da porta superior, voltada para o norte, cada um com uma arma para esmagar na mão[a]. E um homem entre eles estava vestido de linho, com um estojo de escriba à cintura[b]. Eles vieram e puseram-se de pé junto ao altar de bronze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma arma de destruição na mão”. O termo hebraico indica um instrumento usado para quebrar ou esmagar, mas não permite determinar com certeza o tipo exato de arma.'
    reason: lexical_alternative
  - marker: b
    text: 'Tradicionalmente: “um tinteiro de escriba à cintura”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a força vívida e deítica da expressão que introduz uma visão repentina, mantendo um tom profético digno e compreensível.
- source_word: שִׁשָּׁה אֲנָשִׁים
  choice: seis homens
  rationale: O hebraico emprega uma forma explicitamente masculina e descreve os agentes conforme aparecem na visão, sem definir além disso sua natureza.
- source_word: בָּאִים
  choice: vinham
  rationale: O particípio apresenta a ação em andamento na cena visionária; o imperfeito português transmite naturalmente esse aspecto progressivo.
- source_word: מִדֶּרֶךְ שַׁעַר הָעֶלְיוֹן
  choice: da direção da porta superior
  rationale: Expressa de maneira natural tanto a rota de aproximação quanto a designação arquitetônica do portão do templo.
- source_word: אֲשֶׁר מָפְנֶה צָפוֹנָה
  choice: voltada para o norte
  rationale: Comunica com clareza a orientação da porta, sem acrescentar interpretação.
- source_word: כְּלִי מַפָּצוֹ
  choice: uma arma para esmagar
  rationale: מַפָּץ designa um instrumento de quebrar ou esmagar. A formulação preserva sua função destrutiva sem especificar indevidamente o tipo exato de arma.
- source_word: וְאִישׁ אֶחָד בְּתוֹכָם
  choice: Entre eles havia um homem
  rationale: Reproduz naturalmente a posição desse homem no meio do grupo e mantém a descrição fenomenológica do texto.
- source_word: לָבֻשׁ בַּדִּים
  choice: vestido de linho
  rationale: Tradução concisa e digna da referência às vestes de linho, sem explicitar associações sacerdotais não declaradas neste versículo.
- source_word: קֶסֶת הַסֹּפֵר
  choice: um estojo de escriba
  rationale: Designa de modo atual e compreensível o recipiente ou equipamento de escrita usado por um escriba, evitando o arcaísmo de tratar obrigatoriamente o objeto como simples tinteiro.
- source_word: בְּמָתְנָיו
  choice: à cintura
  rationale: Indica com naturalidade a localização do estojo, evitando a expressão arcaica 'nos lombos'.
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: Eles vieram e ficaram
  rationale: Mantém a sequência narrativa simples dos dois verbos hebraicos; 'ficaram' aqui comunica que tomaram posição junto ao altar.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: altar de bronze
  rationale: Tradução tradicional e clara do nome do altar metálico.
theological_decisions:
- issue: Identidade e natureza dos seis homens e do homem vestido de linho
  choice: Descrevê-los como “homens”, conforme sua aparência na visão, sem identificá-los explicitamente como anjos.
  alternative: Traduzir interpretativamente como “anjos executores” e “anjo escriba”.
  rationale: O hebraico os apresenta como homens vistos por Ezequiel. Embora o contexto possa sugerir agentes celestiais, a tradução preserva a descrição e a tensão do texto sem impor essa identificação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “E eis que” conserva a vivacidade da narrativa profética; “porta superior”, “à cintura” e “altar de bronze” mantêm um registro bíblico natural sem arcaísmos excessivos.
