    issue: «ficaram junto ao altar» é impreciso para וַיַּעַמְדוּ.
    rationale: O verbo hebraico significa que eles se puseram ou ficaram de pé ao lado do altar. «Ficaram junto» pode apenas indicar permanência ou localização, sem comunicar a postura/ato de tomar posição.
  - severity: low
    issue: «Entre eles havia um homem vestido de linho» atenua a construção descritiva do hebraico.
    rationale: O texto apresenta «um homem entre eles», caracterizado como vestido de linho. «Um homem entre eles estava vestido de linho» conserva mais diretamente tanto sua posição no grupo quanto a descrição em curso.
