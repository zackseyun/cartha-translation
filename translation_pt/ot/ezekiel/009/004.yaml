source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אל/ו עֲבֹר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר בְּ/ת֖וֹךְ יְרֽוּשָׁלִָ֑ם וְ/הִתְוִ֨יתָ תָּ֜ו עַל מִצְח֣וֹת הָ/אֲנָשִׁ֗ים הַ/נֶּֽאֱנָחִים֙ וְ/הַ/נֶּ֣אֱנָקִ֔ים עַ֚ל כָּל הַ/תּ֣וֹעֵב֔וֹת הַֽ/נַּעֲשׂ֖וֹת בְּ/תוֹכָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/004.yaml
  text: And Yahweh said to him[a], “Pass through the midst of the city, through the midst of Jerusalem, and put a mark on the foreheads of the men who sigh and groan over all the abominations being done in her midst.”
translation:
  language: pt
  text: 'E Javé lhe disse: “Passe pelo meio da cidade, pelo meio de Jerusalém, e faça uma marca[a] na testa dos homens que suspiram e gemem por causa de todas as abominações que se cometem no meio dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: taw; possivelmente uma referência à letra ת, usada como marca.'
    reason: 'Alternativa lexical: o substantivo pode designar tanto uma marca quanto, mais especificamente, a letra taw.'
lexical_decisions:
- source_word: יְהוָה
  choice: Javé
  rationale: Forma tradicional e amplamente reconhecível em português para o nome divino YHWH, preservando seu caráter de nome próprio.
- source_word: עֲבֹר
  choice: Passe
  rationale: O imperativo ordena que o homem percorra a cidade; “passe” transmite a força da ordem de modo natural.
- source_word: בְּתוֹךְ ... בְּתוֹךְ
  choice: pelo meio de ... pelo meio de
  rationale: Mantém a repetição enfática e a cadência do hebraico sem tornar a frase artificial em português.
- source_word: וְהִתְוִיתָ תָּו
  choice: faça uma marca
  rationale: A construção verbal e nominal indica a colocação de um sinal distintivo. A possível referência específica à letra taw é preservada em nota.
- source_word: מִצְחוֹת
  choice: testa
  rationale: Equivalente anatômico direto; o singular distributivo é idiomático em português com “dos homens”.
- source_word: הָאֲנָשִׁים
  choice: os homens
  rationale: Preserva o substantivo masculino plural do hebraico, sem ampliá-lo silenciosamente para uma expressão genérica.
- source_word: הַנֶּאֱנָחִים וְהַנֶּאֱנָקִים
  choice: que suspiram e gemem
  rationale: Conserva os dois particípios e distingue suas manifestações audíveis de angústia.
- source_word: עַל כָּל הַתּוֹעֵבוֹת
  choice: por causa de todas as abominações
  rationale: Neste contexto, עַל indica o motivo de sua aflição; “abominações” preserva o peso moral e religioso do termo profético.
- source_word: הַנַּעֲשׂוֹת
  choice: que se cometem
  rationale: Expressa ações em curso e combina naturalmente em português com atos moralmente condenáveis.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: Retém a referência feminina à cidade/Jerusalém sem impor uma personificação incomum ao português atual.
theological_decisions:
- issue: Possível significado simbólico de תָּו como a letra taw
  choice: O texto principal traz funcionalmente “uma marca”.
  alternative: “um taw” ou “a letra taw”
  rationale: O contexto exige um sinal identificador, mas não explicita seu formato nem associações simbólicas posteriores. A possibilidade lexical específica é preservada em nota, sem resolver além do que o hebraico permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “pelo meio” conserva a ênfase hebraica; “abominações” mantém o registro profético e religioso do original.
