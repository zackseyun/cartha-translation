base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/003.yaml
  text: And the glory of the God of Israel went up from above the cherub on which it had been[a], to the threshold of the house. And he called to the man clothed in linen[c][b], who had the scribe’s writing case at his waist.
translation:
  language: pt
  text: A glória do Deus de Israel subiu de cima do querubim, sobre o qual estivera, até a soleira da casa[a]. Então ele chamou[c] o homem vestido de linho, que trazia à cintura o estojo de escrita do escriba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a soleira do templo”. Aqui, “casa” refere-se ao edifício do templo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o tinteiro do escriba”.'
    reason: lexical_alternative
  - marker: c
    text: 'Também se pode traduzir: “ela chamou”, retomando “a glória”. O contexto, porém, sugere a ação pessoal de Deus.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְבוֹד
  choice: glória
  rationale: É a correspondência tradicional e adequada para a manifestação visível da presença divina nas visões de Ezequiel, sem reduzi-la apenas a “presença” ou “resplendor”.
- source_word: נַעֲלָה מֵעַל
  choice: elevou-se de sobre
  rationale: Mantém tanto o movimento ascendente de עלה quanto o afastamento de uma posição acima do querubim expresso por מֵעַל.
- source_word: הַכְּרוּב
  choice: o querubim
  rationale: O hebraico está no singular, embora outras passagens da visão mencionem vários querubins.
- source_word: מִפְתַּן הַבָּיִת
  choice: a soleira da casa
  rationale: “Soleira” traduz precisamente מִפְתָּן, e “casa” preserva o sentido lexical de בַּיִת; no contexto, trata-se do edifício do templo.
- source_word: הַלָּבֻשׁ הַבַּדִּים
  choice: vestido de linho
  rationale: Formulação natural e digna que conserva a descrição formal da figura visionária.
- source_word: קֶסֶת הַסֹּפֵר
  choice: o estojo de escrita do escriba
  rationale: Expressa de modo moderno um recipiente com os materiais usados pelo escriba, evitando o arcaísmo de uma tradução como “tinteiro” no texto principal.
- source_word: בְּמָתְנָיו
  choice: à cintura
  rationale: Transmite de forma clara e corrente o local onde o estojo era carregado, sem o caráter arcaico de “lombos”.
theological_decisions:
- issue: Agente de וַיִּקְרָא depois de “a glória do Deus de Israel”
  choice: “ele chamou”, indicando agência divina pessoal
  alternative: “ela chamou”, retomando gramaticalmente “a glória” em português
  rationale: O verbo hebraico está no masculino singular e pode retomar כְבוֹד, substantivo masculino em hebraico. Contudo, o contexto apresenta a glória como manifestação do próprio Deus em ação. O pronome pessoal preserva essa agência, enquanto a nota registra a alternativa gramatical sem ocultar a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “casa” no texto por fidelidade lexical e esclarece o sentido contextual em nota. A construção espacial deliberadamente próxima do hebraico preserva o movimento da glória desde a posição acima do querubim até a soleira.
