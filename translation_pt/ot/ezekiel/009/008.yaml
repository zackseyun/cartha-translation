base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/008.yaml
  text: And it happened, while they were striking them down, and I alone was left, that I fell on my face and cried out, and I said, “Ah, Lord GOD, will you destroy all the remnant of Israel as you pour out your wrath on Jerusalem?”
translation:
  language: pt
  text: 'E aconteceu que, enquanto eles os matavam e só eu fui deixado, caí com o rosto em terra, clamei e disse: “Ah, Soberano SENHOR! Destruirás todo o remanescente de Israel ao derramares a tua ira sobre Jerusalém?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּהַכּוֹתָם
  choice: Enquanto eles os matavam
  rationale: O infinitivo com כְּ indica simultaneidade; o contexto mostra que o golpe é mortal, por isso “matavam” comunica melhor a ação do que o genérico “feriam”.
- source_word: וְנֵאשֲׁאַר אָנִי
  choice: eu fiquei sozinho
  rationale: Preserva a ênfase do pronome hebraico e a percepção de Ezequiel de ter sido deixado só, sem acrescentar uma afirmação absoluta além da cena visionária.
- source_word: אֲדֹנָי יְהוִה
  choice: Soberano SENHOR
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e mantém uma forma reverente e amplamente reconhecível em português.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: remanescente de Israel
  rationale: “Remanescente” conserva o termo teologicamente significativo e a ideia do grupo que sobreviveu.
- source_word: בְּשָׁפְכְּךָ אֶת־חֲמָתְךָ
  choice: ao derramares a tua ira
  rationale: A construção בְּ + infinitivo pode expressar simultaneidade ou circunstância; “ao” preserva essa relação sem a reduzir apenas a tempo ou causa.
theological_decisions:
- issue: Forma da pergunta de Ezequiel sobre a destruição do remanescente
  choice: “Destruirás todo o remanescente de Israel...?”
  alternative: “Estás destruindo todo o remanescente de Israel...?”
  rationale: O particípio הֲמַשְׁחִית pode descrever ação em curso ou iminente. O futuro interrogativo é natural em português e preserva o temor de uma destruição total sem afirmar que ela já se consumou.
- issue: Relação entre o derramamento da ira e a destruição
  choice: “ao derramares”
  alternative: “quando derramares” / “por derramares”
  rationale: A preposição hebraica admite nuance temporal e circunstancial. “Ao” conserva a ambiguidade e evita impor uma leitura exclusivamente temporal ou causal.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. “SENHOR” em versaletes representa o nome divino; “Soberano” traduz o título que o antecede. A sequência hebraica de verbos foi levemente reorganizada em duas frases para clareza sem perda de conteúdo.
