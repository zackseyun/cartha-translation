  text: וְ/הִנֵּ֞ה הָ/אִ֣ישׁ לְבֻ֣שׁ הַ/בַּדִּ֗ים אֲשֶׁ֤ר הַ/קֶּ֨סֶת֙ בְּ/מָתְנָ֔י/ו מֵשִׁ֥יב דָּבָ֖ר לֵ/אמֹ֑ר עָשִׂ֕יתִי כ/אשר צִוִּיתָֽ/נִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/011.yaml
  text: And behold[a], the man clothed in linen, who had the writing case at his waist, brought back word, saying, “I have done as you commanded me.”
translation:
  language: pt
  text: 'E eis que o homem vestido de linho, que tinha o estojo de escrita à cintura, voltou com a resposta, dizendo: “Fiz conforme me ordenaste.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva o marcador discursivo que chama vividamente a atenção para a chegada do homem e seu relatório; embora ligeiramente solene, a expressão é corrente no registro bíblico em português.
- source_word: הָאִישׁ
  choice: o homem
  rationale: Mantém o masculino singular explícito e retoma a figura já apresentada no contexto.
- source_word: לְבֻשׁ הַבַּדִּים
  choice: vestido de linho
  rationale: Reproduz de modo natural e conciso a descrição do traje, sem definir a identidade ou natureza da figura.
- source_word: הַקֶּסֶת
  choice: o estojo de escriba
  rationale: O substantivo designa um recipiente ligado ao trabalho de escrita, provavelmente para tinta e instrumentos. 'Estojo de escriba' é claro, concreto e evita a forma tradicional menos transparente 'tinteiro'.
- source_word: בְּמָתְנָיו
  choice: à cintura
  rationale: Expressa em português moderno e natural o local em que o estojo era carregado.
- source_word: מֵשִׁיב דָּבָר
  choice: voltou para dar o relatório
  rationale: Comunica a ideia idiomática de retornar com uma resposta ou prestação de contas. A formulação preserva tanto o retorno implícito quanto o ato de relatar.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Mantém a fórmula hebraica que introduz a fala direta.
- source_word: עָשִׂיתִי
  choice: Fiz
  rationale: O perfeito indica que a tarefa foi concluída; em português, o pretérito perfeito simples é a forma idiomática para esse relatório.
- source_word: כַאֲשֶׁר צִוִּיתָנִי
  choice: conforme me ordenaste
  rationale: Transmite com concisão a plena correspondência entre a ação executada e a ordem recebida, preservando a segunda pessoa singular.
theological_decisions:
- issue: Natureza da figura vestida de linho
  choice: Descrevê-la apenas como 'o homem vestido de linho'.
  alternative: Identificá-la como ser angelical, figura sacerdotal ou teofânica.
  rationale: O hebraico descreve sua aparência e função, mas não define explicitamente sua natureza. A tradução evita resolver uma questão interpretativa que o versículo deixa aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'E eis que' conserva a vivacidade profética; 'me ordenaste' preserva a distinção da segunda pessoa singular presente no hebraico e mantém um tom solene sem arcaísmo excessivo.
