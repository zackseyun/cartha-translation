    rationale: A expressão מֵשִׁיב דָּבָר apresenta o homem retornando e trazendo uma resposta. «Voltou com a resposta» preserva essa relação sem a nuance final de «para dar».
  revised_text: 'E eis que o homem vestido de linho, que tinha o estojo de escrita à cintura, voltou com a resposta, dizendo: “Fiz conforme me ordenaste.”'
