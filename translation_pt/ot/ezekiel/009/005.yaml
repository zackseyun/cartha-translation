base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/005.yaml
  text: And to the others he said in my hearing[a], “Pass through the city after him and strike; do not let your eye spare, and do not show pity.”
translation:
  language: pt
  text: 'Aos outros ele disse, enquanto eu ouvia: “Percorram a cidade atrás dele e golpeiem. Não deixem que os olhos de vocês poupem[a], nem tenham compaixão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “que os olhos de vocês não poupem” — expressão vívida que significa não se deixar deter pela compaixão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: E aos outros
  rationale: O demonstrativo retoma os demais executores, em contraste com o homem vestido de linho mencionado no versículo anterior. “Aos outros” explicita naturalmente essa relação contextual sem acrescentar nova informação.
- source_word: אָמַר בְּאָזְנַי
  choice: ele disse, de modo que eu ouvisse
  rationale: A expressão hebraica literalmente relacionada aos “meus ouvidos” indica que o profeta ouviu diretamente a ordem. Esta formulação conserva o sentido com naturalidade em português.
- source_word: עִבְרוּ בָעִיר
  choice: Percorram a cidade
  rationale: O imperativo ordena que se passe pela cidade. “Percorram” expressa movimento através de seu espaço e soa natural numa ordem solene.
- source_word: אַחֲרָיו
  choice: atrás dele
  rationale: Refere-se ao homem vestido de linho, que segue adiante pela cidade. A formulação mantém a relação espacial e sequencial do hebraico.
- source_word: וְהַכּוּ
  choice: e golpeiem
  rationale: O verbo נכה pode designar golpear ou ferir e, neste contexto de juízo, implica consequências letais. “Golpeiem” preserva a força verbal sem restringir antecipadamente o campo semântico a “matem”.
- source_word: אַל־תָּחֹס עֵינֵיכֶם
  choice: Não deixem que os olhos de vocês poupem
  rationale: A tradução conserva a imagem vívida do olho que não deve poupar, embora o sentido idiomático seja não ceder à compaixão. O plural natural em português corresponde distributivamente aos destinatários.
- source_word: וְאַל־תַּחְמֹלוּ
  choice: nem tenham compaixão
  rationale: חמל proíbe sentir ou demonstrar compaixão. A escolha mantém o paralelismo com a expressão anterior sem reduzir ambas as orações às mesmas palavras.
theological_decisions:
- issue: Severidade da ordem de juízo
  choice: A ordem é apresentada em toda a sua severidade, sem suavizar a violência nem acrescentar uma justificativa teológica.
  alternative: Empregar um eufemismo que reduza a força da ordem.
  rationale: O hebraico descreve uma cena rigorosa de juízo. A tradução deve preservar essa tensão teológica em vez de resolvê-la ou atenuá-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A imagem hebraica dos olhos que não poupam foi mantida no texto e esclarecida em nota.
