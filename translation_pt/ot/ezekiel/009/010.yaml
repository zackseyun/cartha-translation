  yaml_path: translation/ot/ezekiel/009/010.yaml
  text: And as for me[a], my eye will not spare, nor will I show pity[b]; I have brought their way upon their heads.
translation:
  language: pt
  text: E, quanto a mim, meu olhar não poupará, nem terei compaixão; fiz a conduta deles recair sobre suas cabeças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “pus o caminho deles sobre suas cabeças”. “Caminho” pode significar a conduta ou o modo de viver, e fazê-lo recair sobre a cabeça de alguém é uma expressão de retribuição.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: E, quanto a mim
  rationale: Preserva a ligação aditiva e a ênfase contrastiva do pronome independente, em português natural, sem acrescentar um “também” redundante.
- source_word: לֹא תָחוֹס עֵינִי
  choice: meu olhar não poupará
  rationale: Mantém a imagem concreta do hebraico, na qual o olho/olhar é o sujeito, e comunica de modo inteligível a recusa de poupar.
- source_word: וְלֹא אֶחְמֹל
  choice: nem terei compaixão
  rationale: Conserva o paralelismo com a oração anterior e distingue naturalmente o verbo חמל da ideia de poupar.
- source_word: דַּרְכָּם
  choice: a sua conduta
  rationale: דֶּרֶךְ, literalmente “caminho”, funciona aqui como expressão para a maneira de viver ou agir. “Conduta” torna esse sentido claro sem mudar o referente.
- source_word: בְּרֹאשָׁם נָתָתִּי
  choice: farei recair sobre a cabeça deles
  rationale: Reproduz em português corrente a expressão hebraica de retribuição, segundo a qual os próprios atos ou a culpa recaem sobre os responsáveis. O perfeito profético no contexto da declaração de juízo admite o futuro certo em português.
theological_decisions:
- issue: Severidade do juízo divino e ausência de compaixão
  choice: A fala declara sem atenuação que Deus não poupará nem terá compaixão e que fará a conduta dos culpados recair sobre eles.
  alternative: Explicitar no texto “as consequências da sua conduta” ou suavizar a declaração de ausência de compaixão.
  rationale: O hebraico apresenta um anúncio categórico de juízo. A tradução preserva sua tensão e severidade, sem inserir uma explicação doutrinária nem reduzir a força da linguagem.
- issue: Valor temporal de נָתָתִּי
  choice: 'futuro certo: “farei recair”'
  alternative: 'perfeito: “fiz recair” ou “tenho feito recair”'
  rationale: Embora a forma verbal seja perfeita, ela ocorre no anúncio de uma ação judicial determinada e pode apresentar o evento futuro como certo. O futuro é mais natural em português e se harmoniza com os verbos anteriores, sem enfraquecer a certeza da decisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quanto a mim” preserva a ênfase; “meu olhar” conserva a imagem hebraica sem o caráter pouco natural de “meu olho”; “farei recair” comunica claramente a fórmula de retribuição.
