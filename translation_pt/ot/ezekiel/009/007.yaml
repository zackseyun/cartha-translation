  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a sequência de imperativos, a referência à casa/templo, aos pátios e à cidade. Contudo, «mataram pessoas» torna o verbo וְהִכּוּ mais específico do que sua formulação lexical, que é «golpearam/feriram», embora o contexto do juízo seja letal. «Golpearam pessoas» conserva melhor o verbo e deixa o contexto estabelecer sua consequência.
  naturalness: O português é claro, moderno e de registro apropriado. «Profanem», «pátios» e «Saiam!» são naturais. «Golpearam pessoas na cidade» é igualmente idiomático e mais próximo da expressão hebraica.
  terminology: «Profanem» expressa bem a impureza/profanação cultual. «A casa» preserva o hebraico, e a nota deve apresentar «o templo» como alternativa contextual, não como identificação sem ressalva. «Mortos» é aceitável para חללים; a alternativa «cadáveres» esclarece a imagem concreta sem ser necessária no texto.
