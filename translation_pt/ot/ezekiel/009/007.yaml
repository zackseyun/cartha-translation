  - severity: low
    issue: A nota a apresenta «o templo» como explicação categórica.
    rationale: Embora o referente contextual seja o templo, a nota de alternativa lexical deve indicar «o templo» como possível tradução de הַבַּיִת, mantendo a literalidade de «a casa» no texto principal.
