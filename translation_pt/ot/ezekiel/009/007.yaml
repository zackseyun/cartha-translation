base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/007.yaml
  text: And he said to them[a], “Defile the house, and fill the courts with the slain[b]. Go out.” So they went out and struck down people in the city.
translation:
  language: pt
  text: 'E ele lhes disse: “Profanem a casa[a] e encham os pátios de mortos[b]. Saiam!” Então eles saíram e golpearam pessoas na cidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o templo”. Em hebraico, literalmente “a casa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “encham os pátios de cadáveres”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַמְּאוּ
  choice: Profanem
  rationale: O imperativo piel ordena tornar impuro o recinto sagrado. “Profanem” é natural no contexto cultual e conserva o impacto da ordem.
- source_word: הַבַּיִת
  choice: a casa
  rationale: Reproduz o sentido literal do hebraico; no contexto, a referência é ao templo, esclarecida em nota.
- source_word: הַחֲצֵרוֹת
  choice: os pátios
  rationale: Designa os pátios do complexo do templo; esta é uma expressão clara e corrente em português.
- source_word: חֲלָלִים
  choice: mortos
  rationale: O substantivo se refere aos que foram mortos violentamente. “Mortos” mantém a formulação grave sem impor a imagem mais concreta de “cadáveres” no texto principal.
- source_word: צֵאוּ
  choice: Saiam
  rationale: Imperativo direto e natural, ordenando que deixem a área do templo.
- source_word: וְיָצְאוּ
  choice: Então eles saíram
  rationale: Expressa com naturalidade a progressão narrativa marcada pelo hebraico.
- source_word: וְהִכּוּ
  choice: mataram pessoas
  rationale: Neste contexto de execução do juízo, o verbo נכה indica golpes letais. “Pessoas” explicita em português o objeto humano implícito, sem identificar um grupo além do que o texto diz.
- source_word: בָעִיר
  choice: na cidade
  rationale: Mantém o valor locativo simples da expressão hebraica, sem ampliar para “por toda a cidade”.
theological_decisions:
- issue: A ordem de tornar impuro o recinto do templo
  choice: Traduzir diretamente como “Profanem a casa”
  alternative: “Tornem a casa impura”
  rationale: A visão apresenta a profanação como parte do juízo ordenado por Deus. A tradução direta preserva a força e a tensão teológica do texto.
- issue: Identificação de “a casa” com o templo
  choice: Manter “a casa” no texto principal e esclarecer em nota
  alternative: Traduzir diretamente como “o templo”
  rationale: A opção conserva a imagem lexical hebraica sem ocultar o referente contextual.
translation_notes:
  register: Português moderno, claro e solene, com construção direta. “Profanem” preserva o registro cultual; “mataram pessoas” torna explícito apenas o objeto humano exigido pelo contexto. Os marcadores de nota foram colocados junto aos termos a que se referem.
