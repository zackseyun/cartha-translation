  terminology: “Virgem”, “crianças pequenas”, “mulheres”, “marca” e “santuário” são escolhas adequadas. A nota sobre taw é útil. A alternativa “anciãos” para os homens mais velhos diante da casa deve permanecer como alternativa, sem decidir a questão institucional.
