base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/006.yaml
  text: Old man[a], young man, and virgin, and little children, and women—you shall kill them utterly. But do not come near anyone on whom is the mark, and begin at my sanctuary[b]. So they began with the old men who were before the house.
translation:
  language: pt
  text: “Homem idoso, jovem e virgem, crianças pequenas e mulheres — matem-nos completamente. Mas não se aproximem de ninguém que tenha a marca[a]. Comecem pelo meu santuário.” Então eles começaram pelos homens idosos[b] que estavam diante da casa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o taw”; isto é, a marca protetora colocada nos fiéis (ver v. 4).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os anciãos”.'
    reason: alternative_reading
  - marker: c
    text: Isto é, o templo.
    reason: clarification
lexical_decisions:
- source_word: זָקֵן בָּחוּר וּבְתוּלָה
  choice: velho, jovem e virgem
  rationale: Preserva os substantivos no singular distributivo e a estrutura retórica deliberada do hebraico, sem convertê-los em plurais.
- source_word: טַף
  choice: crianças pequenas
  rationale: Expressa o sentido de crianças de pouca idade ou pequeninos, com mais precisão que o termo genérico “crianças”.
- source_word: תַּהַרְגוּ לְמַשְׁחִית
  choice: matem todos, até exterminá-los
  rationale: Comunica naturalmente em português tanto a ordem direta de matar quanto a força intensificadora da expressão que aponta para a destruição completa.
- source_word: עַל כָּל אִישׁ
  choice: de ninguém
  rationale: Neste contexto distributivo, a referência abrange qualquer pessoa marcada; “ninguém” é natural e não restringe indevidamente o sentido aos homens.
- source_word: הַתָּו
  choice: a marca
  rationale: No contexto, designa o sinal protetor colocado na testa no versículo 4; a relação lexical com a letra taw é preservada em nota.
- source_word: אַל תִּגַּשׁוּ
  choice: não se aproximem
  rationale: Mantém o sentido básico de aproximar-se, sem ampliar a proibição para “não tocar”.
- source_word: וּמִמִּקְדָּשִׁי תָּחֵלּוּ
  choice: Comecem pelo meu santuário
  rationale: Indica de modo idiomático que o julgamento deveria ter o santuário como ponto de partida.
- source_word: הַבָּיִת
  choice: a Casa
  rationale: Mantém a imagem literal de “casa”, aqui usada para o templo; a inicial maiúscula e a nota ajudam a esclarecer o referente.
theological_decisions:
- issue: Se הַתָּו deve ser traduzido pelo nome literal da letra ou pela função do sinal
  choice: a marca
  alternative: a marca de taw
  rationale: A narrativa destaca a função protetora do sinal; a referência literal à letra taw permanece disponível em nota, sem impor uma interpretação de seu formato.
- issue: Se הַזְּקֵנִים indica idade ou função oficial
  choice: os velhos
  alternative: os anciãos
  rationale: A repetição de זקן retoma naturalmente a primeira categoria etária do versículo. Como a localização junto ao templo torna possível o sentido institucional, a alternativa é registrada em nota.
- issue: Se הַבָּיִת deve ser explicitado como templo
  choice: a Casa
  alternative: o templo
  rationale: A tradução principal preserva o substantivo hebraico e sua designação contextual do edifício sagrado, enquanto a nota esclarece o referente.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A sequência inicial conserva os singulares distributivos do hebraico. A violência do mandamento não é suavizada, mas a formulação evita arcaísmos. Os marcadores de nota foram colocados exatamente nos termos a que se referem.
