revisions:
- from: “Velho, jovem e virgem, crianças pequenas e mulheres — matem todos, até exterminá-los. Mas não se aproximem de ninguém que tenha a marca[a]. Comecem pelo meu santuário”. Então eles começaram pelos velhos[b] que estavam diante da Casa[c].
  to: “Homem idoso, jovem e virgem, crianças pequenas e mulheres — matem-nos completamente. Mas não se aproximem de ninguém que tenha a marca[a]. Comecem pelo meu santuário.” Então eles começaram pelos homens idosos[b] que estavam diante da casa[c].
  rationale: A revisão elimina a redundância de “matem todos, até exterminá-los”, preservando a força intensiva do hebraico numa formulação portuguesa clara. Também ajusta o registro de “velho” para “homem idoso” e remove a maiúscula interpretativa de “casa”, sem alterar a ambiguidade entre homens idosos e anciãos nem o referente contextual do edifício.
