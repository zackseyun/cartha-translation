base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/005.yaml
  text: Because you had an everlasting enmity and delivered the sons of Israel over to the power of the sword at the time of their disaster[a], at the time of the punishment of the end[b],
translation:
  language: pt
  text: Porque você tinha uma inimizade perpétua e entregou os filhos de Israel à espada no tempo da calamidade deles[a], no tempo do castigo final[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “os israelitas” ou “o povo de Israel”. Hebraico: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “no tempo da iniquidade final” ou “no tempo em que a culpa chegou ao seu limite”. A expressão hebraica é difícil e pode referir-se tanto à iniquidade ou à culpa quanto ao castigo decorrente delas.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: Porque
  rationale: Introduz de modo natural a causa do juízo anunciado no contexto.
- source_word: הֱיוֹת לְךָ אֵיבַת עוֹלָם
  choice: você manteve uma inimizade perpétua
  rationale: Expressa uma hostilidade duradoura pertencente a Edom/Seir; “manteve” torna idiomático em português o estado indicado pela construção hebraica.
- source_word: וַתַּגֵּר
  choice: entregou
  rationale: No hifil e neste contexto, indica entregar ou deixar alguém à mercê de uma força destrutiva.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Conserva a expressão familiar e corporativa explícita no hebraico.
- source_word: עַל יְדֵי חָרֶב
  choice: ao poder da espada
  rationale: Comunica com clareza o idiomatismo hebraico, literalmente ligado às “mãos da espada”, e preserva a ideia de sujeição à violência mortal.
- source_word: בְּעֵת אֵידָם
  choice: no tempo da calamidade deles
  rationale: אֵיד designa calamidade ou desastre; “calamidade” convém ao registro profético e é corrente em português.
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: no tempo do castigo do fim
  rationale: Preserva a formulação comprimida e difícil do hebraico. עָוֹן pode indicar culpa, iniquidade ou o castigo decorrente, enquanto קֵץ conserva a noção de fim.
theological_decisions:
- issue: Sentido de בְּנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A tradução principal preserva a forma filial e corporativa do original, sem impedir que a expressão seja entendida coletivamente.
- issue: Sentido de עֲוֺן em בְּעֵת עֲוֺן קֵץ
  choice: castigo
  alternative: iniquidade; culpa
  rationale: No contexto de calamidade e espada, “castigo” produz sentido coerente, mas a nota mantém a ambiguidade real do termo e da sintaxe.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura causal e a continuidade sintática do versículo foram preservadas; as ambiguidades relevantes aparecem nas notas.
