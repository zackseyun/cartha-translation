base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/013.yaml
  text: And with your mouth you magnified yourselves against me[a], and multiplied your words against me[b]; I myself have heard.
translation:
  language: pt
  text: Com a boca de vocês, vocês se engrandeceram contra mim[a] e multiplicaram suas palavras contra mim[b]. Eu mesmo ouvi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês se vangloriaram contra mim”; o hebraico fala literalmente de engrandecer-se contra Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “amontoaram suas palavras contra mim”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגְדִּילוּ
  choice: vocês se engrandeceram
  rationale: O hifil de גדל expressa aqui a ideia de fazer-se grande em discurso arrogante. A forma reflexiva preserva a imagem hebraica sem reduzi-la apenas a “vangloriar-se”.
- source_word: עָלַי
  choice: contra mim
  rationale: No contexto de fala hostil, עַל indica oposição, não apenas assunto; por isso, “contra mim” é a opção mais adequada nas duas ocorrências.
- source_word: בְּפִיכֶם
  choice: com a sua boca
  rationale: Mantém a expressão concreta do hebraico, com beth instrumental, e conserva o paralelismo com “suas palavras”.
- source_word: וְהַעְתַּרְתֶּם
  choice: multiplicaram
  rationale: O hifil de עתר tem aqui o sentido provável de tornar abundante ou multiplicar. “Multiplicaram” preserva essa noção com clareza, enquanto “amontoaram” seria mais idiomático e interpretativo.
- source_word: דִּבְרֵיכֶם
  choice: suas palavras
  rationale: A tradução comum e concreta de דְּבָרִים se ajusta à acusação de fala hostil.
- source_word: אֲנִי
  choice: eu mesmo
  rationale: O pronome explícito antes do verbo é enfático; “eu mesmo” comunica essa ênfase naturalmente em português.
- source_word: שָׁמָעְתִּי
  choice: ouvi
  rationale: O perfeito hebraico apresenta a audição divina como fato consumado. Em português, o pretérito perfeito simples é natural e preserva o tom judicial.
theological_decisions:
- issue: Natureza da fala dirigida contra Deus
  choice: A fala é apresentada como engrandecimento arrogante e hostil contra Deus.
  alternative: Entender a fala mais genericamente como discurso orgulhoso a respeito de Deus.
  rationale: A repetição de עָלַי, junto aos verbos de engrandecer-se e multiplicar palavras, favorece oposição direta. A tradução mantém a gravidade da acusação sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vocês” explicita o plural hebraico; “a sua boca” conserva o singular coletivo do texto-fonte. A ordem foi levemente ajustada para soar natural, sem apagar a repetição enfática de “contra mim”.
