  text: בֶּן אָדָ֕ם שִׂ֥ים פָּנֶ֖י/ךָ עַל הַ֣ר שֵׂעִ֑יר וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/002.yaml
  text: Son of man[a], set your face against Mount Seir and prophesy against it.
translation:
  language: pt
  text: Filho do homem[a], volte o rosto contra o monte Seir e profetize contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Mortal, volte o rosto contra o monte Seir e profetize contra ele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma característica com que Deus se dirige a Ezequiel e mantém a repetição literária do livro. A alternativa em nota explicita o sentido de mortalidade sem substituir o idiomatismo no texto principal.
- source_word: שִׂים פָּנֶיךָ
  choice: volte o rosto
  rationale: Reproduz de modo natural em português a imagem hebraica de orientar deliberadamente o rosto, aqui em atitude de oposição; «ponha o rosto» seria excessivamente literal e pouco idiomático.
- source_word: עַל
  choice: contra
  rationale: Nos dois usos do versículo, o contexto de oráculo hostil favorece claramente o sentido adversativo.
- source_word: הַר שֵׂעִיר
  choice: o monte Seir
  rationale: Mantém o nome geográfico tradicional e a forma singular da expressão hebraica.
- source_word: וְהִנָּבֵא
  choice: e profetize
  rationale: Traduz diretamente o imperativo do verbo habitual para a proclamação profética.
- source_word: עָלָיו
  choice: contra ele
  rationale: O pronome masculino singular retoma «monte Seir»; em português, «ele» concorda naturalmente com «monte».
