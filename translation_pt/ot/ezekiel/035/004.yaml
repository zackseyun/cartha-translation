  text: עָרֶ֨י/ךָ֙ חָרְבָּ֣ה אָשִׂ֔ים וְ/אַתָּ֖ה שְׁמָמָ֣ה תִֽהְיֶ֑ה וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/004.yaml
  text: I will make your cities ruins[a], and you will become a desolation; then you will know that I am Yahweh.
translation:
  language: pt
  text: Transformarei suas cidades em ruínas, e você se tornará uma desolação; então saberá que eu sou Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH, tradicionalmente traduzido por “o SENHOR”. “Yahweh” é uma transliteração; “Javé” é outra forma corrente em português.'
    reason: Esclarece a forma hebraica do nome divino e registra, com precisão, formas de tradução e uso correntes.
lexical_decisions:
- source_word: עָרֶיךָ
  choice: suas cidades
  rationale: O plural de עִיר com sufixo de segunda pessoa masculina singular designa os centros habitados pertencentes ao destinatário; “cidades” é claro e natural neste anúncio de juízo.
- source_word: חָרְבָּה אָשִׂים
  choice: transformarei ... em ruínas
  rationale: A construção com שׂוּם e o substantivo חָרְבָּה expressa a ação de deixar as cidades em estado de devastação. “Transformarei ... em ruínas” reproduz o sentido de maneira idiomática em português.
- source_word: וְאַתָּה
  choice: e você
  rationale: O pronome explícito dá ênfase ao próprio destinatário, em contraste com suas cidades. “Você” oferece ampla legibilidade brasileira e mantém a referência singular direta.
- source_word: שְׁמָמָה תִהְיֶה
  choice: se tornará uma desolação
  rationale: שְׁמָמָה é substantivo, não mero adjetivo, e היה pode indicar a passagem a um novo estado. A formulação conserva a imagem forte e nominal do hebraico.
- source_word: וְיָדַעְתָּ
  choice: então saberá
  rationale: O waw liga o conhecimento ao juízo precedente como resultado. “Então” explicita essa relação natural no contexto sem acrescentar uma ideia estranha ao texto.
- source_word: כִּי אֲנִי יְהוָה
  choice: que eu sou Yahweh
  rationale: A expressão é a fórmula de reconhecimento característica de Ezequiel. A transliteração “Yahweh” preserva o nome divino presente no hebraico.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: o SENHOR; Javé
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” preserva o caráter de nome próprio, enquanto a nota informa a tradução tradicional sem impor uma interpretação denominacional.
- issue: Valor de שְׁמָמָה como predicativo
  choice: uma desolação
  alternative: desolado
  rationale: A opção nominal conserva a força da imagem hebraica e a tensão retórica pela qual o próprio destinatário se torna desolação, em vez de reduzir a expressão a uma simples descrição adjetival.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. Emprega “você” para a segunda pessoa singular e preserva a imagem profética nominal “uma desolação”. O ponto e vírgula mantém estreitamente unidos o juízo e seu resultado de reconhecimento.
