  yaml_path: translation/ot/ezekiel/035/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido por “o SENHOR”.'
    reason: Informa a forma consonantal hebraica e a tradução tradicional alternativa do nome divino.
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: O wayyiqtol de היה introduz a sequência narrativa. Em português, a fórmula fica natural com “E” no início e “veio” como verbo da comunicação, sem o literalismo desnecessário de “e aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética דְבַר יְהוָה, “a palavra” preserva de modo transparente a ideia de uma comunicação divina específica e a cadência recorrente do texto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: A transliteração representa diretamente o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: 'A preposição אֶל com sufixo de primeira pessoa singular indica diretamente o destinatário: “a mim”.'
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta que vem em seguida. “Dizendo” conserva a estrutura hebraica e a fórmula profética tradicional em português.
- source_word: דְבַר יְהוָה ... אֵלַי
  choice: a palavra de Yahweh veio a mim
  rationale: A formulação mantém os elementos e a ordem conceitual da expressão profética hebraica, com sintaxe clara e digna em português moderno.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome pessoal no texto; a nota informa a substituição tradicional por “SENHOR” sem impor essa tradição ao corpo da tradução.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Mantém-se a fórmula profética “a palavra de Yahweh veio a mim” e o particípio introdutório “dizendo”, evitando arcaísmos como “veio a mim para dizer” ou “e sucedeu”.
