id: EZK.35.15
reference: Ezekiel 35:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּ/שִׂמְחָ֨תְ/ךָ֜ לְ/נַחְלַ֧ת בֵּֽית יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה לָּ֑/ךְ שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר שֵׂעִיר֙ וְ/כָל אֱד֣וֹם כֻּלָּ֔/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
translation:
  language: pt
  text: 'Assim como você se alegrou com a herança da casa de Israel porque ela estava desolada, assim farei com você: você se tornará uma desolação[a], ó monte Seir, e também todo o Edom, por inteiro[b]. Então saberão que eu sou Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “você ficará desolado”. O hebraico emprega mais literalmente o substantivo “desolação”: “você se tornará uma desolação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “e todo o Edom, todo ele”, uma forma enfática de abranger Edom por completo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  choice: Assim como você se alegrou
  rationale: A preposição כְּ estabelece a comparação, e o substantivo שִׂמְחָה com sufixo de segunda pessoa masculina singular expressa a alegria de Edom; a formulação verbal é natural em português.
- source_word: לְנַחְלַת בֵּית יִשְׂרָאֵל
  choice: com a herança da casa de Israel
  rationale: נַחֲלָה significa herança ou possessão; após o verbo alegrar-se, “com” indica de modo idiomático aquilo que motivou a alegria hostil.
- source_word: עַל אֲשֶׁר שָׁמֵמָה
  choice: porque ela estava desolada
  rationale: עַל אֲשֶׁר introduz a causa da alegria, e a forma feminina שָׁמֵמָה retoma a herança, isto é, a terra de Israel.
- source_word: כֵּן אֶעֱשֶׂה לָּךְ
  choice: assim farei com você
  rationale: כֵּן exprime retribuição correspondente; עשה com לְ tem o sentido de agir ou fazer algo contra alguém. “Farei com você” é natural e mantém a concisão judicial.
- source_word: שְׁמָמָה תִהְיֶה
  choice: você se tornará uma desolação
  rationale: שְׁמָמָה é substantivo, “desolação”, empregado como predicativo. A tradução conserva sua força nominal e o motivo do juízo.
- source_word: הַר שֵׂעִיר
  choice: ó monte Seir
  rationale: Seir é nome geográfico tradicional; a partícula vocativa “ó” esclarece que o monte é o destinatário da sentença, sem acrescentar conteúdo teológico.
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  choice: e também todo o Edom, por inteiro
  rationale: A combinação de כָּל com o resumptivo כֻּלָּהּ intensifica a totalidade. “Por inteiro” reproduz essa ênfase sem a repetição pouco natural “todo ele”.
- source_word: וְיָדְעוּ
  choice: Então saberão
  rationale: A conjunção introduz o resultado do juízo; “então” torna explícita essa sequência sem identificar além do texto o sujeito plural implícito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Forma de traduzir o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz o nome próprio divino; “Yahweh” o representa diretamente e evita substituí-lo por um título.
- issue: Sujeito implícito de וְיָדְעוּ
  choice: saberão
  alternative: eles saberão
  rationale: O hebraico marca o plural, mas não explicita a identidade do sujeito. O português permite preservar essa indefinição pela forma verbal sem pronome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a comparação retributiva e a força nominal de “desolação”; evita identificar o sujeito plural final além do que o hebraico permite.
