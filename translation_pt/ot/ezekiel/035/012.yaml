  text: וְֽ/יָדַעְתָּ֮ כִּֽי אֲנִ֣י יְהוָה֒ שָׁמַ֣עְתִּי אֶת כָּל נָאָֽצוֹתֶ֗י/ךָ אֲשֶׁ֥ר אָמַ֛רְתָּ עַל הָרֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֣ר שממה לָ֥/נוּ נִתְּנ֖וּ לְ/אָכְלָֽה־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
translation:
  language: pt
  text: 'Então você saberá que eu sou Yahweh. Ouvi todas as palavras de desprezo que você proferiu contra os montes de Israel, dizendo: “Eles estão desolados; foram entregues a nós como alimento”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Então você saberá
  rationale: O perfeito qal com waw, neste discurso profético, tem sentido futuro e consequencial; “Então” explicita naturalmente o resultado no contexto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שָׁמַעְתִּי
  choice: Ouvi
  rationale: O perfeito hebraico declara que Yahweh tomou conhecimento das palavras e agirá em resposta; o pretérito perfeito é natural e suficiente em português.
- source_word: נָאָצוֹתֶיךָ
  choice: palavras de desprezo
  rationale: O substantivo derivado de נאץ designa manifestações de desdém, afronta ou insulto. A formulação mantém o foco no discurso hostil sem restringi-lo tecnicamente à blasfêmia.
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: contra os montes de Israel
  rationale: No contexto de fala hostil, עַל indica o alvo da afronta, por isso “contra” é mais adequado que “sobre” ou “a respeito de”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Introdução de citação direta, preservada de modo natural.
- source_word: שָׁמֵמָה
  choice: Eles estão desolados
  rationale: Embora a forma seja feminina singular, refere-se coletivamente aos montes ou à terra de Israel; o plural retoma naturalmente “os montes” em português.
- source_word: נִתְּנוּ לָנוּ לְאָכְלָה
  choice: foram entregues a nós como alimento
  rationale: Preserva a imagem de serem dados para consumo, sem ampliar interpretativamente para “presa” ou “devoração”.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal em transliteração amplamente reconhecida.
- issue: Natureza das afrontas expressas por נָאָצוֹתֶיךָ
  choice: palavras de desprezo
  alternative: blasfêmias
  rationale: Como as palavras são dirigidas explicitamente contra os montes de Israel, a tradução não as classifica de forma mais estreita como blasfêmia, embora a afronta ao que pertence a Yahweh tenha evidente gravidade teológica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com construção direta e legível no Brasil. “Você” corresponde ao masculino singular dirigido ao monte Seir/Edom personificado. A imagem final foi mantida próxima do hebraico.
