  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה כִּ/שְׂמֹ֨חַ֙ כָּל הָ/אָ֔רֶץ שְׁמָמָ֖ה אֶעֱשֶׂה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/014.yaml
  text: 'Thus says the Lord GOD: As the whole earth rejoiced[b][a], I will make you desolate.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Quando toda a terra se alegrar[a][b], farei de você uma desolação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Assim como toda a terra se alegra». A construção hebraica também pode ser entendida em sentido comparativo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «todo o país» ou «toda a região». O termo hebraico pode significar tanto «terra» em sentido amplo como uma terra delimitada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética de mensageiro em linguagem portuguesa corrente e digna.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a repetição pouco clara de «Senhor Senhor».
- source_word: כִּשְׂמֹחַ
  choice: Quando ... se alegrar
  rationale: O כְּ com o infinitivo construto pode introduzir uma circunstância temporal; o futuro do subjuntivo é natural em português e deixa claro que a alegria coincide com o juízo anunciado.
- source_word: כָּל הָאָרֶץ
  choice: toda a terra
  rationale: Mantém a amplitude e também a ambiguidade lexical de אֶרֶץ, que pode designar a terra em sentido amplo ou uma região/país.
- source_word: שׂמח
  choice: se alegrar
  rationale: Expressa de modo natural o sentido de alegria sem acrescentar a ideia mais específica de celebração.
- source_word: שְׁמָמָה אֶעֱשֶׂה לָּךְ
  choice: farei de você uma desolação
  rationale: Reproduz o valor resultativo de עשה com ל e conserva o substantivo שְׁמָמָה, em vez de reduzi-lo a um simples adjetivo.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: Mantém explicitamente o nome próprio divino e distingue-o do título «Senhor», sem introduzir interpretação denominacional.
- issue: Relação temporal ou comparativa em כִּשְׂמֹחַ
  choice: Quando toda a terra se alegrar
  alternative: Assim como toda a terra se alegra
  rationale: A leitura temporal se ajusta naturalmente à construção hebraica e ao anúncio futuro, mas a possibilidade comparativa é genuína e foi preservada em nota.
translation_notes:
  register: 'Português moderno, claro e solene, com boa legibilidade brasileira. A ordem dos marcadores segue sua ocorrência lógica no texto: primeiro a construção temporal/comparativa, depois o alcance de «terra».'
