source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ וְ/עָשִׂ֗יתִי כְּ/אַפְּ/ךָ֙ וּ/כְ/קִנְאָ֣תְ/ךָ֔ אֲשֶׁ֣ר עָשִׂ֔יתָה מִ/שִּׂנְאָתֶ֖י/ךָ בָּ֑/ם וְ/נוֹדַ֥עְתִּי בָ֖/ם כַּ/אֲשֶׁ֥ר אֶשְׁפְּטֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will deal with you according to your anger and according to your jealousy, which you acted out because of your hatred against them; and I will make myself known through them when I judge you.
translation:
  language: pt
  text: Portanto, tão certo como eu vivo — declara o Senhor Yahweh —, agirei com você de acordo com a sua ira e o seu ciúme, que você demonstrou por causa do seu ódio contra eles; e me farei conhecido entre eles[a] quando eu julgar você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serei conhecido entre eles”; ou: “me farei conhecido por meio deles”.'
    reason: O nifal וְנוֹדַעְתִּי pode ser entendido como passivo ou com sentido reflexivo de autorrevelação, e בָם pode indicar esfera ou meio.
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Introduz de modo natural e claro a consequência da acusação precedente.
- source_word: חַי אָנִי
  choice: tão certo como eu vivo
  rationale: Preserva a força solene da fórmula divina de juramento em português corrente.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Traduz נְאֻם como fórmula profética de declaração, אֲדֹנָי como “Senhor” e conserva o nome divino יהוה como “Yahweh”.
- source_word: וְעָשִׂיתִי
  choice: agirei com você
  rationale: No contexto de juízo, expressa idiomaticamente a ação de Deus dirigida ao interlocutor, implícito nos sufixos de segunda pessoa e explicitado na oração final.
- source_word: כְּאַפְּךָ וּכְקִנְאָתְךָ
  choice: de acordo com a sua ira e o seu ciúme
  rationale: A preposição כְ indica correspondência ou medida; “ciúme” preserva aqui o sentido de paixão hostil de קִנְאָה.
- source_word: אֲשֶׁר עָשִׂיתָה
  choice: que você demonstrou
  rationale: Evita a tradução rígida “fez” e comunica que a ira e o ciúme se manifestaram em ações hostis.
- source_word: מִשִּׂנְאָתֶיךָ בָּם
  choice: por causa do seu ódio contra eles
  rationale: מן indica causa ou origem, e בָּם recebe sentido adversativo exigido pelo contexto de hostilidade.
- source_word: וְנוֹדַעְתִּי בָם
  choice: e me farei conhecido entre eles
  rationale: O nifal de ידע admite a ideia de autorrevelação divina, enquanto בָם pode naturalmente indicar o âmbito humano em que Deus será reconhecido.
- source_word: כַּאֲשֶׁר אֶשְׁפְּטֶךָ
  choice: quando eu julgar você
  rationale: 'Entende כַּאֲשֶׁר temporalmente: Deus se dará a conhecer por ocasião do juízo contra Edom.'
theological_decisions:
- issue: Forma do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano Senhor; o Senhor DEUS
  rationale: Mantém o título אֲדֹנָי e representa diretamente o nome da aliança יהוה, sem criar a repetição “Senhor SENHOR”.
- issue: Sentido de וְנוֹדַעְתִּי בָם
  choice: me farei conhecido entre eles
  alternative: serei conhecido entre eles; me farei conhecido por meio deles
  rationale: Preserva a autorrevelação divina e a referência aos que Edom odiava, sem determinar em excesso se בָם é locativo ou instrumental; as possibilidades legítimas são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula de juramento foi vertida de modo solene, mas não arcaico. O travessão destaca naturalmente a fórmula profética sem alterar sua relação sintática.
