  text: וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י אֵלֶ֖י/ךָ הַר שֵׂעִ֑יר וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/ךָ שְׁמָמָ֥ה וּ/מְשַׁמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/003.yaml
  text: 'and say to it[a], ‘Thus says the Lord GOD: Behold, I am against you, Mount Seir, and I will stretch out my hand against you and make you a desolation and a waste.’'
translation:
  language: pt
  text: 'e diga-lhe: “Assim diz o Senhor Yahweh: Eis que estou contra você, monte Seir, e estenderei a minha mão contra você e farei de você uma desolação e uma devastação.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma desolação e um objeto de horror ou espanto”. O segundo substantivo também pode indicar uma devastação que causa horror ou espanto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ לּוֹ
  choice: e diga-lhe
  rationale: O pronome hebraico é masculino singular e retoma o monte Seir personificado; em português, “lhe” mantém naturalmente a referência e o discurso direto.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva tanto o título אֲדֹנָי quanto o nome divino יהוה, evitando a repetição artificial “Senhor SENHOR”.
- source_word: הִנְנִי אֵלֶיךָ
  choice: Eis que estou contra você
  rationale: A construção, em contexto de juízo, expressa oposição hostil; “eis que” conserva a solenidade da declaração profética.
- source_word: הַר שֵׂעִיר
  choice: monte Seir
  rationale: Trata-se do nome geográfico convencional, empregado aqui em apóstrofe personificadora.
- source_word: וְנָטִיתִי יָדִי עָלֶיךָ
  choice: Estenderei a minha mão contra você
  rationale: Mantém a metáfora hebraica tradicional de intervenção divina em juízo, com linguagem clara em português.
- source_word: וּנְתַתִּיךָ
  choice: farei de você
  rationale: Expressa de modo idiomático a transformação do destinatário no estado indicado pelos substantivos seguintes.
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: uma desolação e uma devastação
  rationale: Conserva os dois substantivos intensificadores sem fundi-los. “Devastação” representa o sentido de ruína do segundo termo, enquanto a nota registra sua possível nuance de horror ou espanto.
theological_decisions:
- issue: Forma portuguesa do composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma escolhida distingue o título “Senhor” do nome divino e preserva explicitamente o Tetragrama, sem acrescentar uma interpretação denominacional.
- issue: Força de הִנְנִי אֵלֶיךָ no anúncio de juízo
  choice: Eis que estou contra você
  alternative: Eis que venho contra você
  rationale: O hebraico afirma oposição divina, mas não exige que se acrescente a ideia específica de movimento ou chegada; a tradução mantém essa amplitude.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição “contra você” preserva a ênfase do hebraico, e a personificação do monte permanece visível no tratamento direto.
