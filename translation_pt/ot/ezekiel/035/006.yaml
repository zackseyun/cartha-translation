id: EZK.35.6
reference: Ezekiel 35:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי לְ/דָ֥ם אֶעֶשְׂ/ךָ֖ וְ/דָ֣ם יִרְדֲּפֶ֑/ךָ אִם לֹ֥א דָ֛ם שָׂנֵ֖אתָ וְ/דָ֥ם יִרְדֲּפֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/006.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will make you blood, and blood will pursue you. Surely you have not hated blood[b], so blood will pursue you.
translation:
  language: pt
  text: Por isso, tão certo como eu vivo — declara o Senhor Yahweh —, farei de você sangue[a], e o sangue perseguirá você. Visto que você não odiou o sangue[b], o sangue perseguirá você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “farei de você sangue”. A repetição de “sangue” no hebraico provavelmente evoca tanto o derramamento de sangue quanto a culpa de sangue.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “sangue” pode ter o sentido de “derramamento de sangue”, isto é, violência homicida.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a sentença como consequência da acusação anterior.
- source_word: חַי אָ֗נִי
  choice: tão certo como eu vivo
  rationale: Expressa em português atual a força solene da fórmula hebraica de juramento divino.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Mantém a fórmula profética de declaração e distingue o título אֲדֹנָי do nome divino יהוה.
- source_word: לְדָם אֶעֶשְׂךָ
  choice: farei de você sangue
  rationale: Preserva a formulação abrupta e a repetição retórica de דָם, sem limitar seu sentido apenas a derramamento de sangue ou culpa de sangue.
- source_word: דָם
  choice: sangue
  rationale: A repetição de 'sangue' reproduz o jogo verbal hebraico e conserva suas associações com sangue derramado, violência e culpa de sangue.
- source_word: יִרְדֲּפֶךָ
  choice: perseguirá você
  rationale: Equivalente claro de רדף no contexto de juízo e adequado ao refrão repetido.
- source_word: אִם לֹא
  choice: visto que ... não
  rationale: No contexto, a construção introduz a razão enfática do juízo, e não uma condição em aberto.
- source_word: דָם שָׂנֵאתָ
  choice: você não odiou o sangue
  rationale: Mantém o substantivo repetido e a tensão da expressão hebraica; a nota esclarece que aqui pode designar derramamento de sangue.
theological_decisions:
- issue: Representação de יהוה na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: Reproduz separadamente o título אֲדֹנָי e o nome divino יהוה, sem substituir o nome próprio por outro título.
- issue: Agência retributiva do sangue
  choice: o sangue perseguirá você
  alternative: a culpa de sangue perseguirá você
  rationale: A personificação e a repetição do hebraico são preservadas, deixando em aberto se a ênfase recai sobre sangue derramado, violência ou culpa decorrente dele.
translation_notes:
  register: Português moderno, solene e acessível, com ordem e pontuação naturais. A expressão deliberadamente incomum “farei de você sangue” conserva a força poética e o jogo verbal do hebraico; as notas esclarecem sem resolver toda a ambiguidade.
