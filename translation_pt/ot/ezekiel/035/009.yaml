id: EZK.35.9
reference: Ezekiel 35:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שִֽׁמְמ֤וֹת עוֹלָם֙ אֶתֶּנְ/ךָ֔ וְ/עָרֶ֖י/ךָ לֹ֣א תישבנה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/009.yaml
  text: I will make you an everlasting desolation[a], and your cities will not be inhabited; then you will know that I am Yahweh.
translation:
  language: pt
  text: Farei de você uma desolação perpétua[a], e suas cidades não serão habitadas. Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma devastação perpétua” ou “desolações perpétuas”. O hebraico emprega um substantivo no plural, provavelmente para intensificar o juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְמוֹת
  choice: desolação
  rationale: O substantivo hebraico está no plural, provavelmente com força intensiva. Em português, o singular abstrato é mais natural nesta construção, enquanto a nota preserva a forma e as alternativas do original.
- source_word: עוֹלָם
  choice: perpétua
  rationale: No contexto de juízo, indica duração contínua e indefinida. “Perpétua” mantém o peso da expressão e combina naturalmente com “desolação”.
- source_word: אֶתֶּנְךָ
  choice: Farei de você
  rationale: Embora o verbo signifique literalmente “dar” ou “pôr”, com o predicativo ele expressa a ideia de fazer alguém passar a determinada condição.
- source_word: וְעָרֶיךָ
  choice: e suas cidades
  rationale: עִיר designa normalmente uma cidade; o plural possessivo é reproduzido de modo direto e natural.
- source_word: לֹא תישבנה
  choice: não serão habitadas
  rationale: Com “cidades” como sujeito, o Qal expressa naturalmente que nelas não se habitará; a formulação passiva é idiomática em português.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: A conjunção introduz aqui o resultado do juízo. O plural “vocês” preserva a mudança do destinatário singular anterior para o verbo plural do texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino presente no hebraico, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal e corresponde à transliteração adotada.
- issue: Mudança de número no destinatário
  choice: “você” no juízo e “vocês” no reconhecimento
  alternative: Uniformizar ambos como singular ou ambos como plural
  rationale: O hebraico passa do sufixo singular em אֶתֶּנְךָ e וְעָרֶיךָ para o verbo plural וִידַעְתֶּם. A tradução conserva essa tensão gramatical genuína sem resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Desolação perpétua” preserva o tom profético; a alternância entre singular e plural reproduz a forma do hebraico.
