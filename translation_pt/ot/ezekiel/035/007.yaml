  text: וְ/נָֽתַתִּי֙ אֶת הַ֣ר שֵׂעִ֔יר לְ/שִֽׁמְמָ֖ה וּ/שְׁמָמָ֑ה וְ/הִכְרַתִּ֥י מִמֶּ֖/נּוּ עֹבֵ֥ר וָ/שָֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/007.yaml
  text: I will make Mount Seir a desolation and a waste[a], and I will cut off from it those who pass through and return.
translation:
  language: pt
  text: Farei do Monte Seir uma desolação e uma devastação, e eliminarei dali quem passa e quem volta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo aquele que vai e vem”; os particípios hebraicos podem abranger, como um merismo, todo movimento pelo território.'
    reason: alternativa lexical
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Farei
  rationale: Embora נָתַן signifique literalmente “dar” ou “pôr”, nesta construção, com o monte Seir destinado à desolação, o sentido idiomático é “fazer” ou “tornar”.
- source_word: הַר שֵׂעִיר
  choice: monte Seir
  rationale: Mantém diretamente o topônimo e o substantivo geográfico hebraico, numa forma consagrada e clara em português.
- source_word: לְשִׁמְמָה וּשְׁמָמָה
  choice: uma desolação e uma devastação
  rationale: Os dois substantivos hebraicos próximos em sentido intensificam o anúncio de juízo. A tradução preserva ambos, em vez de reduzi-los a uma única expressão.
- source_word: וְהִכְרַתִּי
  choice: eliminarei
  rationale: O hifil de כרת significa “cortar” ou “eliminar”. “Eliminarei” comunica em português atual a retirada completa, sem especificar indevidamente o modo.
- source_word: מִמֶּנּוּ
  choice: dali
  rationale: O pronome retoma o monte Seir entendido como território; “dali” expressa naturalmente a remoção desse lugar.
- source_word: עֹבֵר וָשָׁב
  choice: quem passa e quem volta
  rationale: Conserva os dois particípios e a possível expressão merismática que abrange o movimento pelo território, sem resolver em excesso se se trata de pessoas específicas ou de todo trânsito.
theological_decisions:
- issue: Intensidade do juízo nos dois substantivos de devastação
  choice: Preservar os dois substantivos como “uma desolação e uma devastação”.
  alternative: Resumi-los como “completa desolação” ou “totalmente desolado”.
  rationale: A repetição semântica pertence à retórica do oráculo de juízo. Manter os dois termos conserva sua força sem acrescentar uma interpretação teológica.
- issue: Alcance de עֹבֵר וָשָׁב
  choice: Traduzir literalmente como “quem passa e quem volta”.
  alternative: Explicitar como “todos os que vão e vêm” ou “todo o trânsito”.
  rationale: Os particípios podem funcionar como merismo para todo movimento pela terra, mas a formulação literal preserva a ambiguidade do hebraico; a possível abrangência é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém o paralelismo e a intensidade do hebraico, enquanto “dali” e “eliminarei” evitam rigidez desnecessária.
