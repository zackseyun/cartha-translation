  text: יַ֣עַן אֲ֠מָרְ/ךָ אֶת שְׁנֵ֨י הַ/גּוֹיִ֜ם וְ/אֶת שְׁתֵּ֧י הָ/אֲרָצ֛וֹת לִ֥/י תִהְיֶ֖ינָה וִֽ/ירַשְׁנ֑וּ/הָ וַֽ/יהוָ֖ה שָׁ֥ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/010.yaml
  text: Because you said[a], ‘These two nations and these two lands will be mine[b], and we will possess them’—though Yahweh was there—
translation:
  language: pt
  text: 'Porque você disse: “Estas duas nações e estas duas terras[a] serão minhas, e tomaremos posse delas” — embora Yahweh estivesse ali[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as duas nações e as duas terras”. O hebraico usa o artigo definido; “estas” explicita que se trata das entidades específicas em vista no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “e Yahweh estava ali” ou “enquanto Yahweh estava ali”. A conjunção hebraica admite mais de uma leitura; o texto principal a entende em sentido concessivo, destacando a presunção da reivindicação de Edom.
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲמָרְךָ
  choice: Porque você disse
  rationale: יַעַן introduz a causa do juízo, e a construção com אֲמָרְךָ é expressa naturalmente em português como uma oração finita.
- source_word: שְׁנֵי הַגּוֹיִם וְאֶת שְׁתֵּי הָאֲרָצוֹת
  choice: Estas duas nações e estas duas terras
  rationale: O artigo hebraico aponta para entidades específicas já presentes no contexto. “Estas” torna essa referência clara em português, sem identificar explicitamente as nações ou terras.
- source_word: לִי תִהְיֶינָה
  choice: serão minhas
  rationale: Reproduz de modo conciso e natural a reivindicação de posse feita por Edom.
- source_word: וִירַשְׁנוּהָ
  choice: e tomaremos posse delas
  rationale: ירשׁ expressa tomar ou obter posse, por vezes com a implicação de desalojar ocupantes anteriores. O sufixo hebraico está no singular feminino e provavelmente trata o território como um conjunto; o plural “delas” concorda com “terras” e evita obscuridade em português.
- source_word: וַיהוָה שָׁם הָיָה
  choice: embora Yahweh estivesse ali
  rationale: A formulação concessiva comunica a presunção da reivindicação feita apesar da presença de Yahweh. “Estivesse ali” é idiomático nesse encaixe sintático, enquanto a nota preserva a possibilidade de coordenação simples.
theological_decisions:
- issue: Valor da oração final וַיהוָה שָׁם הָיָה
  choice: embora Yahweh estivesse ali
  alternative: e Yahweh estava ali; enquanto Yahweh estava ali
  rationale: 'O waw pode ter simples valor coordenativo, mas o contexto favorece uma força concessiva: Edom reivindica o território apesar da presença de Yahweh. A nota mantém aberta a ambiguidade gramatical.'
- issue: Identidade das duas nações e das duas terras
  choice: Não identificá-las no texto principal
  alternative: Judá e Israel; Israel e Judá; os territórios de ambas
  rationale: Embora o contexto permita inferir os referentes, o versículo não os nomeia. A tradução conserva o mesmo grau de explicitude do hebraico.
- issue: Sufixo singular em וִירַשְׁנוּהָ após referentes plurais
  choice: delas
  alternative: dela; disso
  rationale: O singular feminino provavelmente concebe o território como uma unidade coletiva. Em português, “delas” retoma com clareza as duas terras sem impor uma identificação adicional.
translation_notes:
  register: Português atual, digno e acessível, com construção de boa legibilidade brasileira. “Você disse” evita solenidade arcaizante; “tomaremos posse” preserva a força ativa de ירשׁ. Os travessões mantêm o caráter parentético da oração final e a continuidade sintática com o versículo seguinte.
