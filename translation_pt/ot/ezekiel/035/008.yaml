  text: וּ/מִלֵּאתִ֥י אֶת הָרָ֖י/ו חֲלָלָ֑י/ו גִּבְעוֹתֶ֤י/ךָ וְ/גֵאוֹתֶ֨י/ךָ֙ וְ/כָל אֲפִיקֶ֔י/ךָ חַלְלֵי חֶ֖רֶב יִפְּל֥וּ בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/008.yaml
  text: And I will fill its mountains with its slain; on your hills[a], in your valleys, and in all your ravines, those slain by the sword will fall.
translation:
  language: pt
  text: E encherei os montes dele com os seus mortos; nas tuas colinas, nos teus vales e em todas as tuas ravinas cairão os mortos à espada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “cairão neles”, isto é, nas colinas, nos vales e nas ravinas mencionados.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתִי
  choice: E encherei
  rationale: O perfeito com waw, no discurso profético, expressa naturalmente uma declaração futura; «E» representa a conjunção inicial.
- source_word: הָרָיו
  choice: os montes dele
  rationale: O sufixo de terceira pessoa do masculino singular retoma o monte Seir como território personificado; «dele» preserva a mudança posterior para a interpelação direta na segunda pessoa.
- source_word: חֲלָלָיו
  choice: os seus mortos
  rationale: חָלָל designa pessoas mortas de modo violento, sobretudo em combate. «Mortos» é natural em português, e o contexto militar explicita o sentido.
- source_word: גִּבְעוֹתֶיךָ
  choice: nas tuas colinas
  rationale: O substantivo indica colinas; «lugares altos» acrescentaria uma conotação cultual que o contexto não exige.
- source_word: גֵאוֹתֶיךָ
  choice: nos teus vales
  rationale: Nesta enumeração topográfica, o termo é entendido como áreas baixas ou vales, em paralelo com colinas e ravinas.
- source_word: אֲפִיקֶיךָ
  choice: em todas as tuas ravinas
  rationale: O termo pode designar canais, leitos ou ravinas. «Ravinas» comunica aqui uma característica do terreno sem sugerir necessariamente água corrente.
- source_word: חַלְלֵי חֶרֶב
  choice: os que forem mortos à espada
  rationale: A formulação idiomática conserva tanto a morte violenta quanto a espada como seu instrumento.
- source_word: יִפְּלוּ בָהֶם
  choice: cairão
  rationale: As expressões locativas anteriores — «nas... nos... em...» — já comunicam o referente de «neles» de modo natural em português; a nota registra a forma mais explícita.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. O uso de «dele» seguido de «tuas/teus» preserva a mudança do hebraico, que primeiro fala do monte Seir na terceira pessoa e depois se dirige diretamente a ele na segunda.
