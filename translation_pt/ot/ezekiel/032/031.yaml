  text: אוֹתָ/ם֙ יִרְאֶ֣ה פַרְעֹ֔ה וְ/נִחַ֖ם עַל כָּל המונ/ה חַלְלֵי חֶ֨רֶב֙ פַּרְעֹ֣ה וְ/כָל חֵיל֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/031.yaml
  text: Pharaoh will see them and be comforted over all his multitude[a], Pharaoh and all his army, slain by the sword, declares the Lord GOD.
translation:
  language: pt
  text: O faraó os verá e será consolado a respeito de toda a sua multidão[a] — o faraó e todo o seu exército, mortos à espada —, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “será confortado” ou “encontrará consolo”. Em outros contextos, o verbo hebraico também pode significar “lamentar”, “arrepender-se” ou “voltar atrás”; aqui, provavelmente indica que o faraó encontra uma consolação sombria ao ver outros compartilharem sua queda.
    reason: alternativa lexical
lexical_decisions:
- source_word: אוֹתָם
  choice: os
  rationale: Pronome de objeto direto no plural, retomando os povos e governantes anteriormente descritos no mundo dos mortos.
- source_word: יִרְאֶה
  choice: verá
  rationale: O imperfeito tem sentido futuro no discurso profético; o futuro simples é natural e claro em português.
- source_word: וְנִחַם
  choice: e será consolado
  rationale: O nifal de נחם indica aqui receber consolo. O contexto sugere a consolação sombria de ver outros compartilharem o mesmo destino, sem eliminar a amplitude semântica do verbo.
- source_word: עַל כָּל הֲמוֹנוֹ
  choice: por causa de toda a sua multidão
  rationale: עַל expressa a ocasião ou o motivo do consolo, e הָמוֹן designa coletivamente a numerosa gente ou força de Faraó. A formulação é natural em português e mantém a referência ampla.
- source_word: חַלְלֵי חֶרֶב
  choice: mortos à espada
  rationale: Expressão hebraica convencional para os que sofreram morte violenta em combate; a formulação portuguesa preserva o caráter bélico.
- source_word: פַּרְעֹה וְכָל חֵילוֹ
  choice: o faraó e todo o seu exército
  rationale: חַיִל denota aqui a força militar de Faraó; “exército” é claro e corrente.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é vertido como fórmula profética verbal, enquanto Yahweh translitera o nome divino expresso no hebraico e “Senhor” representa אֲדֹנָי.
theological_decisions:
- issue: Sentido do consolo de Faraó no mundo dos mortos
  choice: será consolado
  alternative: se arrependerá / lamentará
  rationale: O complemento introduzido por עַל e o contexto em que Faraó vê outros derrotados favorecem a ideia de uma consolação amarga por compartilhar com eles o mesmo destino. A nota registra a amplitude semântica sem impor uma leitura teológica adicional.
- issue: Representação de אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: SENHOR Deus / Soberano SENHOR
  rationale: A tradução distingue os dois termos hebraicos e preserva de modo transparente o nome próprio divino, sem fundi-los num único título.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção parentética conserva a aposição enfática do hebraico, e a nota mantém a ambiguidade lexical relevante de נחם.
