source:
  edition: WLC
  text: וְ/הִ֨כְעַסְתִּ֔י לֵ֖ב עַמִּ֣ים רַבִּ֑ים בַּ/הֲבִיאִ֤/י שִׁבְרְ/ךָ֙ בַּ/גּוֹיִ֔ם עַל אֲרָצ֖וֹת אֲשֶׁ֥ר לֹֽא יְדַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/009.yaml
  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
translation:
  language: pt
  text: Perturbarei o coração de muitos povos[a] quando eu levar a sua ruína[b] entre as nações, a terras que você não conheceu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “provocarei a ira no coração de muitos povos”; ou: “entristecerei o coração de muitos povos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a sua destruição”. O termo hebraico pode indicar quebra, fratura ou ruína.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sobre terras que você não conheceu”. A expressão se refere a terras estrangeiras desconhecidas do destinatário.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְעַסְתִּי
  choice: Perturbarei
  rationale: O hifil de כעס pode expressar causar ira, pesar ou agitação. “Perturbarei” preserva essa amplitude emocional e combina naturalmente com “coração”, sem restringir o efeito somente à ira ou à tristeza.
- source_word: לֵב עַמִּים רַבִּים
  choice: o coração de muitos povos
  rationale: Mantém o singular coletivo do hebraico, que apresenta o íntimo dos muitos povos como afetado pela queda do Egito. “Povos” também distingue עַמִּים do גּוֹיִם posterior.
- source_word: בַּהֲבִיאִי
  choice: quando eu levar
  rationale: O infinitivo construto com בְּ indica circunstância temporal. A formulação é natural em português e conserva Deus como agente da ação.
- source_word: שִׁבְרְךָ
  choice: a sua ruína
  rationale: שֶׁבֶר pode designar quebra, fratura, desastre ou ruína. Neste oráculo contra o faraó/Egito, “ruína” comunica claramente o colapso produzido pelo juízo, sem exigir a ideia de aniquilação total.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: A expressão apresenta a ruína do destinatário sendo levada ao âmbito das nações estrangeiras. “Entre as nações” é corrente e preserva a distinção lexical em relação a “povos”.
- source_word: עַל אֲרָצוֹת
  choice: sobre terras
  rationale: A tradução conserva o valor comum de עַל (“sobre”) e deixa aberta a relação espacial do texto, enquanto a nota registra a leitura direcional possível no contexto.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: que você não conheceu
  rationale: יָדַע indica aqui conhecimento ou familiaridade experiencial. O pretérito perfeito comunica que se trata de terras até então desconhecidas do destinatário.
theological_decisions:
- issue: Natureza do efeito emocional do juízo sobre os povos
  choice: Deus perturbará interiormente muitos povos diante da ruína do Egito.
  alternative: Deus fará muitos povos irarem-se ou entristecerem-se.
  rationale: O verbo כעס admite ira, pesar e agitação. Como o objeto é “coração”, a tradução principal mantém um sentido abrangente de perturbação interior, sem determinar uma única reação emocional.
- issue: Alcance de שִׁבְרְךָ no juízo contra o Egito
  choice: “sua ruína”
  alternative: “sua destruição”
  rationale: “Ruína” expressa o colapso decorrente do juízo sem resolver indevidamente se o termo implica destruição absoluta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O singular coletivo “o coração” acompanha de perto o hebraico; “você” torna explícito o destinatário singular sem recorrer a uma forma regional ou arcaica. As notas preservam as ambiguidades lexical e espacial do original.
