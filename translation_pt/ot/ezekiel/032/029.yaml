  text: שָׁ֣מָּ/ה אֱד֗וֹם מְלָכֶ֨י/הָ֙ וְ/כָל נְשִׂיאֶ֔י/הָ אֲשֶׁר נִתְּנ֥וּ בִ/גְבוּרָתָ֖/ם אֶת חַלְלֵי חָ֑רֶב הֵ֛מָּה אֶת עֲרֵלִ֥ים יִשְׁכָּ֖בוּ וְ/אֶת יֹ֥רְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/029.yaml
  text: There is Edom[a], her kings and all her princes, who were laid among those slain by the sword despite their might[b]. They lie with the uncircumcised and with those who go down to the pit.
translation:
  language: pt
  text: Ali está Edom, seus reis e todos os seus príncipes, que foram postos entre os mortos à espada, apesar de seu poder[a]. Jazem com os incircuncisos e com os que descem à cova[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com seu poder” ou “em seu poder”. A expressão hebraica admite uma tradução mais literal; o contexto, porém, ressalta a ironia de que o poder deles não impediu sua queda.
    reason: lexical_alternative
  - marker: b
    text: A “cova” é uma imagem hebraica frequente para o domínio dos mortos ou a sepultura.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: Ali está
  rationale: Conserva a força dêitica da fórmula repetida no lamento, apontando para Edom na cena do mundo dos mortos, com expressão natural em português.
- source_word: אֱדוֹם מְלָכֶיהָ וְכָל נְשִׂיאֶיהָ
  choice: Edom, com seus reis e todos os seus príncipes
  rationale: Mantém Edom como nação personificada e traduz נְשִׂיאִים pelo termo político elevado “príncipes”, adequado ao paralelismo com “reis”.
- source_word: אֲשֶׁר נִתְּנוּ
  choice: Eles foram postos
  rationale: Representa o passivo de נתן e explicita de modo natural que os reis e príncipes foram colocados entre os mortos.
- source_word: בִגְבוּרָתָם
  choice: apesar de seu poder
  rationale: Expressa a ironia contextual de que seu poder não impediu a queda, enquanto a nota preserva as leituras mais literais e a ambiguidade da preposição hebraica.
- source_word: אֶת חַלְלֵי חָרֶב
  choice: entre os mortos pela espada
  rationale: Comunica com clareza a fórmula hebraica para os que sofreram morte violenta pela espada e ajusta a relação associativa exigida pelo contexto.
- source_word: עֲרֵלִים
  choice: os incircuncisos
  rationale: Retém literalmente o termo carregado de associações pactuais e de desonra no contexto profético.
- source_word: יִשְׁכָּבוּ
  choice: Jazem
  rationale: O presente descreve naturalmente o estado contemplado na visão, e “jazer” preserva o registro solene do lamento.
- source_word: יֹרְדֵי בוֹר
  choice: os que descem à cova
  rationale: Preserva a imagem hebraica da descida ao domínio dos mortos sem reduzi-la simplesmente à sepultura física.
theological_decisions:
- issue: Sentido de “os incircuncisos” no oráculo de juízo
  choice: Manter o termo pactual literalmente como “os incircuncisos”.
  alternative: “os mortos desonrados” ou “as nações”
  rationale: O hebraico reúne conotações pactuais, étnicas e de vergonha na morte. A tradução literal conserva essa tensão retórica sem impor uma explicação doutrinária posterior.
- issue: Força de בִגְבוּרָתָם
  choice: Traduzir no texto como concessivo, “apesar de seu poder”, e registrar a ambiguidade em nota.
  alternative: “com seu poder” ou “em seu poder”
  rationale: O contexto enfatiza ironicamente que a força dos governantes não evitou sua morte; contudo, como a preposição hebraica não marca inequivocamente concessão, as possibilidades mais literais são preservadas na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em três frases evita uma construção relativa pesada, sem alterar os referentes plurais. “Jazem” mantém o tom solene do lamento, e as notas preservam tanto a ambiguidade lexical quanto a imagem cultural.
