  text: וְ/הַֽאֲבַדְתִּי֙ אֶת כָּל בְּהֶמְתָּ֔/הּ מֵ/עַ֖ל מַ֣יִם רַבִּ֑ים וְ/לֹ֨א תִדְלָחֵ֤/ם רֶֽגֶל אָדָם֙ ע֔וֹד וּ/פַרְס֥וֹת בְּהֵמָ֖ה לֹ֥א תִדְלָחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/013.yaml
  text: And I will destroy all its beasts from beside its abundant waters[a], and no human foot will muddy them anymore[b], nor will the hooves of beasts muddy them.
translation:
  language: pt
  text: E destruirei todos os seus animais de junto das águas abundantes[a]. Nenhum pé humano voltará a turvá-las[b], nem cascos de animais as turvarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das muitas águas”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo descreve a ação de agitar a água com os pés ou cascos, deixando-a turva.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: E farei desaparecer
  rationale: O hifil de אבד expressa fazer perecer, eliminar ou remover. “Farei desaparecer” comunica a eliminação dos animais neste contexto de juízo sem sugerir necessariamente o modo de sua morte.
- source_word: בְּהֶמְתָּהּ
  choice: todos os seus animais
  rationale: בְּהֵמָה pode designar animais em sentido amplo, especialmente animais terrestres ou domésticos. “Animais” é corrente e mantém a amplitude do termo; o sufixo feminino singular remete ao referente personificado no contexto, isto é, o Egito.
- source_word: מֵעַל מַיִם רַבִּים
  choice: de junto das águas abundantes
  rationale: מֵעַל tem sentido básico de “de sobre”, mas aqui indica afastamento da região das águas. “De junto das” é natural em português e preserva a relação espacial; רַבִּים descreve águas numerosas ou abundantes.
- source_word: תִדְלָחֵם
  choice: turvá-las / as turvarão
  rationale: דלח indica agitar a água e torná-la turva, aqui pelo pisoteio de pés e cascos. “Turvar” é preciso e mantém a imagem poética; o sufixo pronominal retoma “águas”.
- source_word: רֶגֶל אָדָם
  choice: pé humano
  rationale: אָדָם é genérico nesta construção, referindo-se ao ser humano, não a um homem específico nem ao nome próprio Adão.
- source_word: עוֹד
  choice: voltará a
  rationale: Com a negação, עוֹד exprime que a ação não acontecerá novamente. “Não voltará a” reproduz com naturalidade esse valor em português.
- source_word: וּפַרְסוֹת בְּהֵמָה
  choice: nem cascos de animais
  rationale: פַּרְסוֹת designa cascos, provavelmente fendidos. A formulação conserva o paralelismo entre o pé humano e os cascos dos animais.
theological_decisions:
- issue: Sentido genérico de אָדָם
  choice: pé humano
  alternative: pé de homem
  rationale: O substantivo singular tem referência genérica à humanidade. “Pé humano” transmite essa abrangência sem converter a expressão em referência exclusiva a um indivíduo masculino.
- issue: Destino dos animais junto às águas
  choice: farei desaparecer ... de junto
  alternative: destruirei ... junto
  rationale: A construção combina o causativo de אבד com מֵעַל. A tradução mantém tanto o juízo de eliminação quanto o afastamento do local, sem definir além do hebraico o mecanismo exato.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Turvar” preserva a imagem concreta do hebraico, e “águas abundantes” soa mais natural do que o literal “muitas águas”, registrado em nota.
