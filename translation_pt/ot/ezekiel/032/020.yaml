source:
  edition: WLC
  text: בְּ/ת֥וֹךְ חַלְלֵי חֶ֖רֶב יִפֹּ֑לוּ חֶ֣רֶב נִתָּ֔נָה מָשְׁכ֥וּ אוֹתָ֖/הּ וְ/כָל הֲמוֹנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/020.yaml
  text: They will fall among those slain by the sword[a]. The sword is given; drag her away[b], and all her multitude.
translation:
  language: pt
  text: Cairão entre os mortos à espada. A espada foi entregue[a]; arrastem-na[b], junto com toda a sua multidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma espada foi designada”. A frase hebraica é concisa e pode indicar que a espada foi destinada à execução do juízo.'
    reason: alternative_reading
  - marker: b
    text: Isto é, o Egito personificado, junto com todo o seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ
  choice: entre
  rationale: Expressa de modo idiomático a ideia de estar no meio e fazer parte do grupo dos mortos.
- source_word: חַלְלֵי חֶרֶב
  choice: os mortos à espada
  rationale: Reproduz a construção que designa os mortos ou traspassados em combate, mantendo a imagem da espada.
- source_word: יִפֹּלוּ
  choice: Cairão
  rationale: O imperfeito qal tem valor preditivo no contexto profético; o futuro simples preserva essa força.
- source_word: חֶרֶב נִתָּנָה
  choice: A espada foi entregue
  rationale: Mantém a formulação passiva, abrupta e elíptica do hebraico sem definir além do texto quem entrega ou recebe a espada.
- source_word: מָשְׁכוּ
  choice: arrastem
  rationale: O imperativo plural descreve deslocamento forçado; 'arrastem' se ajusta ao contexto da descida violenta ao mundo dos mortos.
- source_word: אוֹתָהּ
  choice: -na
  rationale: O pronome feminino singular é preservado e entendido, no contexto, como referência ao Egito personificado.
- source_word: וְכָל הֲמוֹנֶיהָ
  choice: junto com toda a sua multidão
  rationale: Comunica naturalmente que toda a massa de gente ligada ao Egito é arrastada com ele; 'multidão' não restringe o referente apenas a combatentes.
theological_decisions:
- issue: Referente do pronome feminino na ordem
  choice: 'O pronome se refere ao Egito personificado: ''arrastem-na''.'
  alternative: Entender o pronome de maneira mais abstrata ou ligá-lo à cláusula difícil sobre a espada.
  rationale: O contexto mais amplo trata o Egito como entidade personificada. A forma feminina conserva a imagem profética sem inserir uma identificação estranha ao contexto.
- issue: Sentido da cláusula abrupta חֶרֶב נִתָּנָה
  choice: A espada foi entregue.
  alternative: Uma espada foi designada.
  rationale: A tradução relativamente formal preserva a concisão e a ambiguidade do hebraico, sem decidir se a ideia principal é entrega, designação ou autorização para o juízo.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. A ordem das orações e a imagem da espada foram preservadas; 'junto com' traduz idiomaticamente a coordenação hebraica no comando.
