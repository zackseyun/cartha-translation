base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/007.yaml
  text: When I extinguish you[a], I will cover the heavens and darken their stars; I will cover the sun with a cloud, and the moon will not give its light.
translation:
  language: pt
  text: Quando eu o extinguir[a], cobrirei os céus e escurecerei suas estrelas; cobrirei o sol com uma nuvem, e a lua não dará sua luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “quando você for apagado” ou “quando você se apagar”. A expressão retrata o destinatário como uma luz que é apagada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִסֵּיתִי
  choice: cobrirei
  rationale: O verbo כסה significa “cobrir, ocultar”. O futuro corresponde à função sequencial da forma verbal no discurso profético.
- source_word: בְכַבּוֹתְךָ
  choice: quando eu o extinguir
  rationale: O infinitivo de כבה evoca algo que se apaga ou é extinguido. A formulação portuguesa preserva essa imagem e, no contexto do juízo divino, explicita de modo natural Deus como agente; a construção mais literal é registrada em nota.
- source_word: שָׁמַיִם
  choice: os céus
  rationale: Mantém a forma plural, o alcance cósmico da imagem e o registro elevado.
- source_word: וְהִקְדַּרְתִּי
  choice: e escurecerei
  rationale: O causativo de קדר significa “tornar escuro”; “escurecerei” é direto e natural.
- source_word: כֹּכְבֵיהֶם
  choice: suas estrelas
  rationale: O sufixo plural retoma “os céus”; esta é a correspondência natural em português.
- source_word: שֶׁמֶשׁ בֶּעָנָן אֲכַסֶּנּוּ
  choice: cobrirei o sol com uma nuvem
  rationale: A preposição é entendida instrumentalmente, e o sufixo masculino em אֲכַסֶּנּוּ retoma “o sol”.
- source_word: וְיָרֵחַ לֹא יָאִיר אוֹרוֹ
  choice: e a lua não dará a sua luz
  rationale: Expressa de maneira clara o sentido causativo de אור, “dar luz, iluminar”, sem perder a estrutura poética.
theological_decisions:
- issue: Natureza da linguagem cósmica
  choice: Manter literalmente as imagens do escurecimento dos céus, das estrelas, do sol e da lua.
  alternative: Interpretá-las explicitamente como catástrofe astronômica literal ou apenas como metáfora da queda política do faraó e do Egito.
  rationale: A linguagem profética de juízo admite forte dimensão figurativa sem excluir outros níveis de referência. A tradução preserva a tensão do texto sem impor uma interpretação.
- issue: Agente da extinção do destinatário
  choice: 'Explicitar Deus como agente no texto principal: “quando eu o extinguir”.'
  alternative: “Quando você for extinguido/apagado”, deixando o agente gramaticalmente implícito.
  rationale: O contexto e a sequência em primeira pessoa favorecem a ação divina, mas a forma hebraica em si descreve “seu ser extinguido”; por isso, a alternativa formal é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição de “cobrirei” reproduz a repetição lexical do hebraico; a imagética cósmica foi mantida sem explicação interpretativa no corpo do versículo.
