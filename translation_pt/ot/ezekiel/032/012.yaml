source:
  edition: WLC
  text: בְּ/חַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔/ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם וְ/שָֽׁדְדוּ֙ אֶת גְּא֣וֹן מִצְרַ֔יִם וְ/נִשְׁמַ֖ד כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/012.yaml
  text: By the swords of mighty men I will make your multitude fall— all of them the ruthless ones of the nations[a]. They will plunder the pride of Egypt[b], and all her multitude will be destroyed.
translation:
  language: pt
  text: Pelas espadas de homens valentes, farei cair a sua multidão — todos eles, os tiranos das nações[a]. Eles saquearão o orgulho do Egito[b], e toda a sua multidão será destruída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os cruéis das nações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a majestade do Egito”; o hebraico pode indicar tanto orgulho quanto grandeza.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַרְבוֹת
  choice: Pelas espadas de
  rationale: A preposição בְּ tem sentido instrumental neste contexto. “Pelas espadas de” preserva a imagem bélica e expressa o meio pelo qual ocorrerá a queda.
- source_word: גִּבּוֹרִים
  choice: homens valentes
  rationale: O termo designa homens fortes e, em contexto militar, guerreiros de grande capacidade. “Homens valentes” mantém a forma pessoal e a força marcial sem restringir o sentido mais do que o hebraico.
- source_word: אַפִּיל
  choice: farei cair
  rationale: O hifil de נפל é causativo. “Farei cair” comunica de modo natural e direto que o próprio Deus causará a queda.
- source_word: הֲמוֹנֶךָ
  choice: a sua multidão
  rationale: הָמוֹן pode indicar uma multidão, massa humana ou força numerosa. “Multidão” é amplo e permite a dimensão populacional e militar presente no lamento.
- source_word: עָרִיצֵי גוֹיִם כֻּלָּם
  choice: todos eles, os cruéis das nações
  rationale: עָרִיץ descreve pessoas violentas, implacáveis ou tirânicas. “Os cruéis das nações” conserva a construção apositiva e evita especificar necessariamente governantes políticos.
- source_word: וְשָׁדְדוּ
  choice: Eles saquearão
  rationale: שׁדד significa saquear, despojar ou devastar. “Saquearão” se ajusta ao objeto direto e ao cenário de conquista militar.
- source_word: גְּאוֹן מִצְרַיִם
  choice: o orgulho do Egito
  rationale: גָּאוֹן pode indicar orgulho, exaltação, esplendor ou majestade. “Orgulho” combina com o contexto profético de humilhação, enquanto uma nota preserva a possibilidade de “majestade”.
- source_word: וְנִשְׁמַד
  choice: será destruída
  rationale: O nifal de שׁמד exprime destruição ou extermínio sofrido pelo sujeito. “Será destruída” é forte e claro sem intensificação indevida.
- source_word: כָּל הֲמוֹנָהּ
  choice: toda a sua multidão
  rationale: O sufixo feminino retoma o Egito. A repetição de “multidão” reproduz a repetição hebraica de הָמוֹן e mantém o paralelismo do versículo.
theological_decisions:
- issue: Sentido de גְּאוֹן em um oráculo de julgamento
  choice: o orgulho do Egito
  alternative: a majestade do Egito
  rationale: O termo abrange tanto a arrogância quanto a grandeza da qual uma nação se gloria. “Orgulho” realça o tema profético da humilhação do Egito, e a nota conserva a ambiguidade lexical legítima.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi levemente ajustada para fluidez, mas a repetição de “multidão”, a causalidade de “farei cair” e as ambiguidades relevantes foram preservadas.
