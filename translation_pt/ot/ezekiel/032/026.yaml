  text: שָׁ֣ם מֶ֤שֶׁךְ תֻּבַל֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרוֹתֶ֑י/הָ כֻּלָּ֤/ם עֲרֵלִים֙ מְחֻ֣לְלֵי חֶ֔רֶב כִּֽי נָתְנ֥וּ חִתִּיתָ֖/ם בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/026.yaml
  text: There are Meshech and Tubal[a], and all her multitude; their graves are all around him. All of them are uncircumcised, slain by the sword, because they spread their terror in the land of the living.
translation:
  language: pt
  text: Ali estão Meseque e Tubal[a], e toda a sua multidão; ao redor dele estão os túmulos dela. Todos eles são incircuncisos, mortos à espada, porque espalharam o seu terror na terra dos viventes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente: “e toda a multidão dela; ao redor dele estão os túmulos dela”, com alternância entre sufixos masculinos e femininos nesta linha poética.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Ali estão
  rationale: O advérbio deítico situa Meseque e Tubal no mundo dos mortos; a inserção de “estão” torna natural a oração nominal em português.
- source_word: מֶשֶׁךְ תֻּבַל
  choice: Meseque e Tubal
  rationale: São nomes próprios de povos ou regiões; “Meseque” é a forma portuguesa corrente, enquanto “Tubal” permanece transliterado.
- source_word: וְכָל הֲמוֹנָהּ
  choice: com toda a sua multidão
  rationale: הָמוֹן designa a massa de pessoas associada ao povo, sem exigir o sentido estritamente militar de “horda”. A preposição “com” expressa naturalmente a associação implícita na coordenação hebraica.
- source_word: סְבִיבוֹתָיו קִבְרוֹתֶיהָ
  choice: ao redor dele estão os túmulos dela
  rationale: Preserva a mudança marcada dos sufixos hebraicos, masculino singular em “dele” e feminino singular em “dela”, em vez de resolver silenciosamente a ambiguidade poética.
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Retoma coletivamente Meseque, Tubal e sua multidão.
- source_word: עֲרֵלִים
  choice: incircuncisos
  rationale: A tradução literal conserva as conotações de vergonha e de exclusão pactual presentes no oráculo fúnebre.
- source_word: מְחֻלְלֵי חֶרֶב
  choice: mortos à espada
  rationale: No contexto, a expressão designa pessoas fatalmente atingidas em combate; esta formulação é clara e mantém a fórmula recorrente do capítulo.
- source_word: כִּי נָתְנוּ חִתִּיתָם
  choice: porque espalharam o seu terror
  rationale: O idioma “dar/pôr o seu terror” indica causar ou difundir pavor; “espalharam” comunica esse valor causativo em português corrente.
- source_word: בְּאֶרֶץ חַיִּים
  choice: na terra dos viventes
  rationale: Mantém a expressão hebraica para o âmbito da vida terrena, em contraste com o mundo dos mortos.
theological_decisions:
- issue: Manutenção da linguagem de vergonha pactual no juízo funerário
  choice: incircuncisos
  alternative: impuros; não iniciados
  rationale: O termo hebraico é explícito e participa do contraste recorrente em Ezequiel; substituí-lo por uma categoria interpretativa apagaria sua força retórica e teológica.
- issue: Tratamento das mudanças poéticas de gênero nos pronomes
  choice: preservar “sua multidão... ao redor dele... os túmulos dela”
  alternative: regularizar como “a multidão deles; os túmulos deles estão ao redor deles”
  rationale: Os referentes dos sufixos são comprimidos e instáveis no hebraico. Preservar a oscilação, com nota explicativa, mantém a ambiguidade genuína sem impor uma identificação não expressa pelo texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conserva-se deliberadamente a estranheza pronominal do hebraico, esclarecida em nota, e a expressão bíblica “terra dos viventes”.
