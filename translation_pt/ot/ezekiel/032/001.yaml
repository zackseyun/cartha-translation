  source_fidelity: 'A tradução reproduz com precisão a fórmula narrativa e a datação hebraica: «Aconteceu que» corresponde adequadamente a וַיְהִי; as três expressões cronológicas são mantidas sem acrescentar «do exílio»; e «veio a mim a palavra de Yahweh» comunica de modo fiel a fórmula profética הָיָה דְבַר־יְהוָה אֵלַי. «Dizendo:» preserva corretamente a introdução da fala que continua no versículo seguinte.'
  naturalness: O português é moderno, claro e de registro apropriadamente solene. A ordem «veio a mim a palavra de Yahweh» é um pouco marcada, mas é plenamente natural no registro bíblico-profético e conserva bem o foco da fórmula. A repetição de «no décimo segundo» é necessária para uma datação transparente e fiel.
  terminology: «Yahweh» corresponde de forma consistente a יְהוָה e a nota está corretamente ancorada no nome divino. A nota é breve, exata e não introduz interpretação doutrinária. «SENHOR» identifica adequadamente a convenção tradicional portuguesa.
