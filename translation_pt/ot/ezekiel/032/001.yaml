id: EZK.32.1
reference: Ezekiel 32:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בִּ/שְׁנֵי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/001.yaml
  text: And it happened in the twelfth year[a], in the twelfth month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'Aconteceu que, no décimo segundo ano, no décimo segundo mês, no primeiro dia do mês, veio a mim a palavra de Yahweh[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: YHWH; tradicionalmente traduzido como «SENHOR».'
    reason: Registra a forma hebraica e a alternativa tradicional de tradução do nome divino.
lexical_decisions:
- source_word: וַיְהִי
  choice: Aconteceu que
  rationale: Preserva a função narrativa e temporal da forma hebraica sem recorrer ao arcaísmo «E sucedeu que».
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: no décimo segundo ano
  rationale: Reproduz naturalmente a fórmula de datação; não se acrescenta «do exílio», pois isso não está expresso no hebraico.
- source_word: בִּשְׁנֵי עָשָׂר חֹדֶשׁ
  choice: no décimo segundo mês
  rationale: Equivalente direto e idiomático da indicação calendárica hebraica.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: no primeiro dia do mês
  rationale: Explicita em português o sentido da fórmula hebraica, literalmente «no um do mês».
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: veio a mim a palavra de Yahweh
  rationale: Expressa de modo natural a fórmula profética de recepção da revelação, cujo sentido literal é «a palavra de Yahweh foi para mim».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino do texto hebraico em vez de substituí-lo por um título.
- source_word: לֵאמֹר
  choice: 'dizendo:'
  rationale: Introduz a fala direta que continua no versículo seguinte; os dois-pontos são naturais na pontuação portuguesa.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico traz o nome divino, não o título «Senhor». «Yahweh» preserva esse caráter de nome próprio e corresponde à vocalização acadêmica mais amplamente aceita, sem impor a substituição tradicional por um título.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de «no décimo segundo» foi mantida porque reflete a estrutura precisa da datação hebraica. O marcador da nota foi colocado junto de «Yahweh», ao qual a nota efetivamente se refere, corrigindo a posição incoerente apresentada na camada inglesa.
