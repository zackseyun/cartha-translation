  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/לֹ֤א יִשְׁכְּבוּ֙ אֶת גִּבּוֹרִ֔ים נֹפְלִ֖ים מֵ/עֲרֵלִ֑ים אֲשֶׁ֣ר יָרְדֽוּ שְׁא֣וֹל בִּ/כְלֵֽי מִלְחַמְתָּ/ם֩ וַ/יִּתְּנ֨וּ אֶת חַרְבוֹתָ֜/ם תַּ֣חַת רָאשֵׁי/הֶ֗ם וַ/תְּהִ֤י עֲוֺֽנֹתָ/ם֙ עַל עַצְמוֹתָ֔/ם כִּֽי חִתִּ֥ית גִּבּוֹרִ֖ים בְּ/אֶ֥רֶץ חַיִּֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/027.yaml
  text: And they do not lie with the mighty, the fallen from among the uncircumcised[a], who went down to Sheol with their weapons of war, whose swords were placed under their heads, and whose iniquities were upon their bones[e][d][c][b]; for the terror of the mighty was in the land of the living.
translation:
  language: pt
  text: E eles não jazem[a] com os valentes, os caídos dentre os incircuncisos[b], que desceram ao Sheol[c] com suas armas de guerra; puseram suas espadas sob suas cabeças, e suas iniquidades estavam sobre seus ossos[d], pois o terror dos valentes estava na terra dos vivos[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles não jazerão com os valentes”. Neste lamento, o verbo hebraico também pode ser entendido com nuance futura.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com os valentes caídos dentre os incircuncisos”. A construção hebraica é difícil, e “valentes” e “caídos” podem ser ligados mais estreitamente.'
    reason: alternative_reading
  - marker: c
    text: Sheol é o domínio dos mortos; outras traduções possíveis são “a sepultura” ou “o mundo dos mortos”.
    reason: lexical_alternative
  - marker: d
    text: “Iniquidades” também pode ser entendido como “culpa” ou “castigo por suas iniquidades”.
    reason: lexical_alternative
  - marker: e
    text: 'O hebraico da cláusula final é difícil. Outra tradução possível é: “pois eles espalharam terror como valentes na terra dos vivos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא יִשְׁכְּבוּ
  choice: E eles não jazem
  rationale: O verbo שׁכב, neste contexto funerário, descreve o jazer dos mortos. O presente preserva a vividez do lamento, embora o yiqtol também possa admitir nuance futura.
- source_word: אֶת גִּבּוֹרִים
  choice: com os valentes
  rationale: Nesta construção difícil, אֶת é entendido em sentido associativo. “Valentes” mantém a amplitude de גִּבּוֹרִים sem restringi-lo indevidamente a uma classe militar específica.
- source_word: נֹפְלִים מֵעֲרֵלִים
  choice: os caídos dentre os incircuncisos
  rationale: נֹפְלִים é substantivado, e a preposição מִן é tomada em sentido partitivo. “Incircuncisos” conserva a categoria recorrente e teologicamente carregada do capítulo.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração evita reduzir o conceito hebraico à sepultura física ou identificá-lo com concepções posteriores de inferno.
- source_word: בִּכְלֵי מִלְחַמְתָּם
  choice: com suas armas de guerra
  rationale: A expressão designa equipamento bélico; a formulação é clara em português e preserva a imagem marcial do sepultamento.
- source_word: וַיִּתְּנוּ אֶת חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם
  choice: suas espadas foram postas debaixo da cabeça
  rationale: 'A voz passiva mantém a imagem do hebraico sem determinar quem realizou o ato funerário. O singular distributivo “da cabeça” é idiomático: cada morto tinha a espada debaixo da própria cabeça.'
- source_word: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
  choice: e suas iniquidades ficaram sobre os seus ossos
  rationale: “Iniquidades” conserva a ambiguidade de עָוֹן entre pecado, culpa e consequência punitiva, enquanto “sobre os seus ossos” retém a imagem sombria e concreta do original.
- source_word: כִּי חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים
  choice: pois o terror dos valentes estava na terra dos vivos
  rationale: A frase hebraica é elíptica e difícil. Esta versão conserva sua formulação nominal e sua ambiguidade, sem explicitar indevidamente quem causava ou sofria o terror.
theological_decisions:
- issue: Sentido de עָוֹן em contexto de juízo
  choice: Manter “iniquidades” no texto principal
  alternative: “culpa” ou “castigo por suas iniquidades”
  rationale: O termo pode reunir ofensa moral, culpa e consequência judicial. Não resolver essa tensão preserva a abrangência teológica do hebraico.
- issue: Referente e direção do terror na cláusula final
  choice: “o terror dos valentes”
  alternative: “eles espalharam terror como valentes”
  rationale: O hebraico permite mais de uma análise da relação entre חִתִּית e גִּבּוֹרִים. A tradução principal conserva a ambiguidade em vez de definir os valentes como causadores ou objetos do terror.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se “jazem”, “incircuncisos” e “Sheol” por sua precisão funerária, literária e teológica; as construções mais obscuras receberam notas sem eliminar a ambiguidade do texto principal.
