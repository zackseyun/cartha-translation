base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/004.yaml
  text: I will cast you onto the land[a]; I will throw you down on the open field, and I will cause every bird of the heavens to settle on you[b], and I will satisfy the beasts of all the earth with you.
translation:
  language: pt
  text: Eu abandonarei você na terra[a]; lançarei você em campo aberto. Farei todas as aves do céu pousarem sobre você e farei que os animais selvagens de toda a terra se fartem de você[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu lançarei você fora na terra”. O verbo hebraico pode significar deixar, abandonar ou lançar fora.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “saciarei de você os animais selvagens de toda a terra”; isto é, eles se fartarão ao devorar você.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: Eu o abandonarei sobre a terra
  rationale: נטשׁ pode significar deixar, abandonar ou lançar fora. “Abandonarei” preserva o sentido lexical central e, no contexto, comunica que o monstro derrotado ficará exposto como carcaça; a possibilidade mais violenta é registrada em nota.
- source_word: בָאָרֶץ
  choice: sobre a terra
  rationale: אֶרֶץ aqui designa o solo ou a terra firme onde o corpo é deixado, em paralelo com “campo aberto”, não necessariamente o mundo inteiro.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: em campo aberto
  rationale: A expressão indica a superfície do campo e enfatiza exposição. “Em campo aberto” é natural em português e preserva a imagem.
- source_word: אֲטִילֶךָ
  choice: eu o lançarei
  rationale: O hifil de טול expressa lançar ou arremessar. “Lançarei” mantém a força da ação sem acrescentar uma direção não explícita.
- source_word: וְהִשְׁכַּנְתִּי עָלֶיךָ
  choice: Farei com que ... pousem sobre você
  rationale: A forma causativa de שכן significa fazer habitar, ficar ou pousar. Para aves que descem sobre uma carcaça, “pousem” comunica naturalmente a cena.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: todas as aves do céu
  rationale: עוֹף é coletivo e pode abranger criaturas voadoras; “aves do céu” é uma formulação portuguesa corrente e digna.
- source_word: וְהִשְׂבַּעְתִּי
  choice: saciarei
  rationale: O hifil de שׂבע significa fazer ficar satisfeito ou cheio. “Saciarei” preserva a ideia de os animais comerem até se fartar.
- source_word: מִמְּךָ
  choice: com você
  rationale: Literalmente “de você”; em português, “saciar com você” expressa que o corpo será o alimento, enquanto a forma literal é indicada em nota.
- source_word: חַיַּת כָּל הָאָרֶץ
  choice: os animais selvagens de toda a terra
  rationale: חַיָּה, neste contexto de animais que devoram uma carcaça, é bem representado por “animais selvagens”. “Toda a terra” mantém o alcance amplo da expressão hebraica.
theological_decisions:
- issue: Alcance de אֶרֶץ / הָאָרֶץ no oráculo de juízo
  choice: Traduzir a primeira ocorrência como “a terra” em sentido de solo/terra firme e a última como “toda a terra”
  alternative: Entender ambas como referência localizada à terra ou ao país
  rationale: O paralelo com “campo aberto” localiza a primeira ocorrência, enquanto a frase final tem formulação abrangente. A tradução conserva essa tensão sem transformar a expressão em uma afirmação geográfica ou doutrinária mais precisa do que o hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é profético e digno, com imagens concretas. Emprega-se “você” para o destinatário singular, evitando formas excessivamente regionais ou arcaicas.
