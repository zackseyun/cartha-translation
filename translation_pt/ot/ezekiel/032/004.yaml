  - severity: low
    issue: Alternância entre “o” e “você” para o mesmo destinatário
    rationale: Embora gramaticalmente possível, a alternância é menos fluida no português moderno de leitura brasileira. A uniformização em “você” torna a interpelação profética mais direta.
