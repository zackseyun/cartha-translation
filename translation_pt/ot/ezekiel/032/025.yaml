  text: בְּ/ת֣וֹךְ חֲ֠לָלִים נָתְנ֨וּ מִשְׁכָּ֥ב לָ/הּ֙ בְּ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתֶ֑/הָ כֻּלָּ֣/ם עֲרֵלִ֣ים חַלְלֵי חֶ֡רֶב כִּֽי נִתַּ֨ן חִתִּיתָ֜/ם בְּ/אֶ֣רֶץ חַיִּ֗ים וַ/יִּשְׂא֤וּ כְלִמָּתָ/ם֙ אֶת י֣וֹרְדֵי ב֔וֹר בְּ/ת֥וֹךְ חֲלָלִ֖ים נִתָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/025.yaml
  text: Among the slain they made a bed for her with all her multitude[a]; her graves are all around her. All of them are uncircumcised, slain by the sword, because their terror was set in the land of the living. So they bore their disgrace with those who go down to the pit[c][b]; she was placed among the slain.
translation:
  language: pt
  text: No meio dos mortos, fizeram um leito para ela, junto com toda a sua multidão; os túmulos dela estão ao redor dele.[a] Todos eles são incircuncisos, mortos à espada, pois o terror deles foi imposto na terra dos viventes.[b] Assim, levaram a sua vergonha com os que descem à cova. Ele foi colocado no meio dos mortos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico passa de formas femininas («ela», «dela») para uma forma masculina («dele»), possivelmente alternando entre a coletividade personificada e seu representante.
    reason: alternative_reading
  - marker: b
    text: 'Ou: «pois eles espalharam o seu terror na terra dos viventes». O hebraico diz literalmente: «pois o terror deles foi posto na terra dos viventes».'
    reason: lexical_alternative
  - marker: c
    text: 'O hebraico emprega aqui o masculino singular: «ele foi colocado». Algumas traduções harmonizam a referência com as formas femininas anteriores: «ela foi colocada».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹךְ חֲלָלִים
  choice: no meio dos mortos
  rationale: Preserva a ideia de estar entre os que foram mortos, com formulação natural em português; o contexto de guerra torna desnecessário explicitar aqui “feridos” ou “traspassados”.
- source_word: נָתְנוּ מִשְׁכָּב לָהּ
  choice: fizeram um leito para ela
  rationale: Mantém a metáfora funerária do hebraico, literalmente “deram/fizeram para ela um leito”, sem reduzi-la simplesmente a “sepultaram”.
- source_word: בְּכָל הֲמוֹנָהּ
  choice: junto com toda a sua multidão
  rationale: הָמוֹן designa a grande massa de pessoas ligada à entidade mencionada; “multidão” é amplo, digno e não acrescenta uma conotação militar ausente do termo.
- source_word: סְבִיבוֹתָיו קִבְרֹתֶהָ
  choice: os túmulos dela estão ao redor dele
  rationale: 'Conserva a mudança real dos sufixos hebraicos: “dela” é feminino, enquanto “dele” é masculino, em vez de harmonizar silenciosamente a referência.'
- source_word: כֻּלָּם עֲרֵלִים
  choice: todos eles são incircuncisos
  rationale: Traduz diretamente o termo concreto e teologicamente significativo empregado por Ezequiel, sem substituí-lo por uma interpretação como “estrangeiros impuros”.
- source_word: חַלְלֵי חֶרֶב
  choice: mortos à espada
  rationale: Expressão portuguesa clara e corrente para a fórmula hebraica de morte em guerra.
- source_word: כִּי נִתַּן חִתִּיתָם
  choice: pois o terror deles foi estabelecido
  rationale: Mantém a construção passiva do hebraico e evita inserir um agente ou transformar o texto principal na leitura ativa “espalharam o terror”.
- source_word: בְּאֶרֶץ חַיִּים
  choice: na terra dos viventes
  rationale: Preserva a expressão bíblica que contrapõe o mundo dos vivos à cova ou ao mundo dos mortos.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: assim, levaram a sua vergonha
  rationale: Reproduz a imagem de carregar ou suportar a própria desonra, com linguagem compreensível em português atual.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: com os que descem à cova
  rationale: Entende אֶת associativamente no contexto e mantém “cova”, em vez de reduzir a imagem à sepultura individual.
- source_word: בְּתוֹךְ חֲלָלִים נִתָּן
  choice: ele foi colocado no meio dos mortos
  rationale: O verbo passivo final está no masculino singular. A tradução preserva essa forma, em continuidade com “ao redor dele”, sem apagar a oscilação de gênero do texto.
theological_decisions:
- issue: Manutenção do qualificativo “incircuncisos” no oráculo de juízo
  choice: todos eles são incircuncisos
  alternative: todos eles são estrangeiros impuros
  rationale: O hebraico emprega explicitamente o termo ligado à circuncisão, que carrega peso de exclusão e vergonha no discurso de Ezequiel. A tradução conserva o dado concreto sem impor uma paráfrase doutrinária.
- issue: Oscilação entre referências femininas e masculinas
  choice: para ela... dela... ao redor dele... ele foi colocado
  alternative: harmonizar todas as referências no feminino ou todas no masculino
  rationale: O texto hebraico alterna os gêneros, possivelmente entre a coletividade personificada e seu representante. Preservar a alternância mantém a ambiguidade e a tensão do original.
- issue: Causa e agência do terror na terra dos viventes
  choice: o terror deles foi estabelecido
  alternative: eles espalharam o seu terror
  rationale: A construção hebraica é passiva e não identifica expressamente o agente. A redação principal mantém essa indeterminação, enquanto a leitura ativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. A redação conserva a metáfora do leito funerário, a expressão “terra dos viventes”, o termo concreto “incircuncisos” e as mudanças de gênero do hebraico, esclarecidas por notas sem harmonização silenciosa.
