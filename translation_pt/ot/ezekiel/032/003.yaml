base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/003.yaml
  text: 'Thus says the Lord GOD: I will spread my net over you with an assembly of many peoples[b][a], and they will haul you up in my dragnet.'
translation:
  language: pt
  text: 'Assim diz o Senhor Yahweh: Estenderei sobre você a minha rede com uma assembleia de muitos povos[a], e eles puxarão você para cima em minha rede de arrasto[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «com/em uma assembleia de muitos povos». A expressão também pode indicar que Deus estende a rede por meio de uma assembleia de muitos povos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «e eles farão você subir em minha rede». O hebraico emprega aqui um segundo termo para rede de pesca, diferente daquele usado anteriormente no versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: O título composto une אֲדֹנָי, «Senhor», ao nome divino יהוה. «Yahweh» preserva o nome próprio e evita a repetição pouco natural «Senhor SENHOR».
- source_word: וּפָרַשְׂתִּי
  choice: Estenderei
  rationale: פרשׂ significa estender ou abrir; aplicado a uma rede, «estender» conserva de modo natural a imagem hebraica.
- source_word: רִשְׁתִּי
  choice: a minha rede
  rationale: רֶשֶׁת é o termo comum para rede, e o sufixo possessivo é expresso.
- source_word: בִּקְהַל עַמִּים רַבִּים
  choice: por meio de uma multidão de muitos povos
  rationale: קהל designa uma reunião, congregação ou multidão reunida. A preposição ב pode indicar meio ou circunstância; «por meio de» comunica a leitura instrumental provável, enquanto a nota preserva a alternativa locativa ou associativa.
- source_word: וְהֶעֱלוּךָ
  choice: e eles puxarão você para cima
  rationale: O hifil de עלה indica fazer subir. No quadro da pesca, «puxar para cima» mantém tanto o sentido verbal quanto a imagem da captura.
- source_word: בְּחֶרְמִי
  choice: com a minha rede de arrasto
  rationale: חֶרֶם é aqui um termo de pesca distinto de רֶשֶׁת, provavelmente uma rede de arrasto; a tradução conserva essa variação lexical.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A forma «Yahweh» representa diretamente o nome divino presente no hebraico e distingue-o do título אֲדֹנָי, sem impor uma interpretação denominacional.
- issue: Agência da multidão de povos na captura
  choice: por meio de uma multidão de muitos povos
  alternative: no meio de uma multidão de muitos povos
  rationale: O ב pode ser instrumental, indicando que Deus emprega os povos como agentes, mas a construção também admite valor circunstancial ou locativo; a ambiguidade é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Você» torna explícito o singular masculino dirigido ao faraó. A formulação conserva a metáfora da pesca, diferencia os dois termos hebraicos para rede e registra a ambiguidade da preposição ב.
