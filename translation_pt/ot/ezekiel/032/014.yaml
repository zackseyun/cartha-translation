base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/014.yaml
  text: Then I will let their waters settle[a], and I will make their rivers flow like oil[b], declares the Lord GOD.
translation:
  language: pt
  text: Então farei suas águas assentarem[a], e farei seus rios correrem como óleo[b] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farei suas águas baixarem” ou “afundarem”. O verbo hebraico pode indicar fazer as águas baixar, assentar ou se aquietar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conduzirei seus rios como óleo”. O verbo hebraico significa literalmente “fazer ir” ou “conduzir”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca o momento consequente dentro do oráculo e corresponde naturalmente ao valor temporal do advérbio.
- source_word: אַשְׁקִיעַ
  choice: farei ... se acalmarem
  rationale: O hifil de שׁקע expressa fazer afundar, baixar ou assentar. Com águas, a formulação comunica que elas deixam de estar revoltas, sem eliminar as alternativas literais.
- source_word: מֵימֵיהֶם
  choice: as águas deles
  rationale: Mantém o plural poético hebraico e o sufixo possessivo, cujo referente contextual é o Egito e seu povo.
- source_word: וְנַהֲרוֹתָם
  choice: e ... seus rios
  rationale: נְהָרוֹת designa rios ou correntes; “rios” convém à grandeza da imagem fluvial egípcia no contexto.
- source_word: כַּשֶּׁמֶן
  choice: como óleo
  rationale: Preserva a comparação breve e a imagem de movimento liso e tranquilo, sem especificar “azeite”, detalhe não expresso explicitamente.
- source_word: אוֹלִיךְ
  choice: farei ... correrem
  rationale: O hifil de הלך significa fazer ir ou conduzir; aplicado a rios, “fazer correr” é idiomático e conserva o sentido causativo.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente português natural e solene para a fórmula profética de pronunciamento divino.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: “Senhor” representa אֲדֹנָי, enquanto “Yahweh” preserva distintamente o nome divino יהוה e evita a repetição “Senhor SENHOR”.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A formulação distingue o título אֲדֹנָי do nome próprio יהוה, preservando no texto o nome divino sem importar uma interpretação denominacional.
- issue: Sentido da restauração ou quietude das águas
  choice: farei as águas deles se acalmarem
  alternative: farei as águas deles baixarem/afundarem
  rationale: O verbo permite a imagem de águas que assentam, baixam ou ficam quietas. O texto principal adota uma expressão portuguesa natural, enquanto a nota conserva a amplitude lexical e evita definir além do hebraico a natureza do ato divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo poético, a causalidade dos verbos hebraicos e a imagem concisa do óleo. Todos os marcadores de nota aparecem no texto principal.
