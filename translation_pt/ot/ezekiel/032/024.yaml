  text: שָׁ֤ם עֵילָם֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֣/ם חֲלָלִים֩ הַ/נֹּפְלִ֨ים בַּ/חֶ֜רֶב אֲֽשֶׁר יָרְד֥וּ עֲרֵלִ֣ים אֶל אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ חִתִּיתָ/ם֙ בְּ/אֶ֣רֶץ חַיִּ֔ים וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/024.yaml
  text: There is Elam and all her multitude[a], all around her grave, all of them slain, fallen by the sword, who went down uncircumcised to the land below, who spread their terror in the land of the living; and they bore their shame with those who go down to the pit.
translation:
  language: pt
  text: Ali estão Elão e toda a sua multidão, ao redor de seu túmulo; todos eles, mortos, caídos pela espada, desceram incircuncisos às regiões inferiores[a], eles que espalharam seu terror na terra dos vivos e carregaram a sua vergonha com os que descem à cova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à terra inferior”, “à terra das profundezas” ou “ao mundo dos mortos”. O hebraico fala literalmente de uma “terra de regiões inferiores”, imagem do domínio dos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם עֵילָם
  choice: Ali está Elão
  rationale: Mantém a força dêitica de שָׁם e apresenta Elão como a figura seguinte na cena do mundo dos mortos, em português natural.
- source_word: וְכָל הֲמוֹנָהּ
  choice: e toda a sua multidão
  rationale: הָמוֹן designa a grande massa de pessoas ligada a Elão; “multidão” conserva a amplitude sem restringi-la apenas ao exército.
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: ao redor de seu túmulo
  rationale: Expressa a disposição espacial dos mortos em torno do lugar de sepultamento de Elão; “túmulo” é claro e digno.
- source_word: כֻּלָּם חֲלָלִים הַנֹּפְלִים בַּחֶרֶב
  choice: Todos eles foram mortos, caíram pela espada
  rationale: חֲלָלִים indica mortos de forma violenta, sobretudo em combate, e a expressão seguinte preserva a imagem marcial da espada.
- source_word: יָרְדוּ עֲרֵלִים
  choice: desceram incircuncisos
  rationale: Conserva literalmente o marcador de vergonha e de condição alheia à aliança empregado na retórica profética de Ezequiel.
- source_word: אֶל אֶרֶץ תַּחְתִּיּוֹת
  choice: à terra das profundezas
  rationale: Preserva a imagem espacial hebraica do domínio inferior dos mortos sem impor uma sistematização doutrinária do além.
- source_word: נָתְנוּ חִתִּיתָם
  choice: espalharam seu terror
  rationale: Tradução idiomática da expressão hebraica “deram/puseram seu terror”, indicando o medo que causaram.
- source_word: בְּאֶרֶץ חַיִּים
  choice: na terra dos vivos
  rationale: Equivalente transparente da expressão bíblica que contrapõe o mundo dos vivos ao domínio dos mortos.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: e levaram sua vergonha
  rationale: נשא com כְלִמָּה comunica carregar ou suportar a desonra como condição persistente.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: com os que descem à cova
  rationale: Entende אֶת em sentido associativo, indicando que compartilham o destino dos que descem ao domínio da morte; “cova” preserva a imagem sem explicá-la em excesso.
theological_decisions:
- issue: Sentido de עֲרֵלִים no contexto de juízo
  choice: incircuncisos
  alternative: impuros; alheios à aliança
  rationale: A forma literal preserva a retórica de vergonha aplicada às nações em Ezequiel e evita substituir a imagem concreta por uma interpretação.
- issue: Identificação de אֶרֶץ תַּחְתִּיּוֹת
  choice: terra das profundezas
  alternative: mundo dos mortos; regiões inferiores da terra
  rationale: A tradução mantém a representação espacial do texto sem definir de modo mais preciso do que o hebraico uma doutrina do estado dos mortos.
- issue: Referente feminino nos sufixos de הֲמוֹנָהּ e קְבֻרָתָהּ
  choice: Elão tratado coletivamente, com pronomes possessivos não marcados por gênero em português
  alternative: explicitar “dela” para personificar Elão
  rationale: “Sua” preserva a referência coletiva sem forçar no português uma personificação feminina que o gênero gramatical do hebraico não exige por si só.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e leitura natural no Brasil. A estrutura foi dividida em frases para evitar acúmulo sintático, sem eliminar as repetições e imagens centrais do hebraico.
