source:
  edition: WLC
  text: בֶּן אָדָ֗ם שָׂ֤א קִינָה֙ עַל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וְ/אָמַרְתָּ֣ אֵלָ֔י/ו כְּפִ֥יר גּוֹיִ֖ם נִדְמֵ֑יתָ וְ/אַתָּה֙ כַּ/תַּנִּ֣ים בַּ/יַּמִּ֔ים וַ/תָּ֣גַח בְּ/נַהֲרוֹתֶ֗י/ךָ וַ/תִּדְלַח מַ֨יִם֙ בְּ/רַגְלֶ֔י/ךָ וַ/תִּרְפֹּ֖ס נַהֲרוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/002.yaml
  text: 'Son of man[a], raise a lament over Pharaoh king of Egypt, and say to him: You compared yourself to a young lion among the nations, but you were like the monster in the seas; you burst forth in your rivers, and muddied the waters with your feet[c][b], and fouled their rivers.'
translation:
  language: pt
  text: 'Filho do homem, entoe uma lamentação sobre Faraó, rei do Egito, e diga-lhe: “Você se comparou a um leão jovem entre as nações[a], mas você era como o monstro nos mares[b]; irrompeu em seus rios, turvou as águas com os pés e pisoteou os rios deles[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você foi comparado a um leão jovem entre as nações”. A forma verbal hebraica pode ser entendida como reflexiva ou passiva.'
    reason: alternative_reading
  - marker: b
    text: O termo hebraico pode designar uma grande criatura aquática; outras traduções possíveis são “dragão marinho” ou “monstro marinho”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “e enlameou os rios deles”. O verbo significa literalmente “pisotear”, mas, nesta imagem, também pode ressaltar o efeito de turvar ou sujar a água.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma de tratamento hebraica recorrente dirigida a Ezequiel e sua linguagem representativa, sem reduzi-la a uma paráfrase.
- source_word: שָׂא קִינָה
  choice: entoe uma lamentação
  rationale: Expressa de modo natural e digno o idioma profético de iniciar ou levantar um cântico fúnebre.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: o faraó, rei do Egito
  rationale: Reproduz claramente a sequência de título e identificação, com pontuação natural em português.
- source_word: כְּפִיר גּוֹיִם
  choice: um leão novo entre as nações
  rationale: כְּפִיר designa um leão jovem, vigoroso e predador; “entre as nações” comunica adequadamente a relação contextual.
- source_word: נִדְמֵיתָ
  choice: Você se comparou
  rationale: Adota o valor reflexivo possível do nifal no contexto de provocação contra a pretensão do faraó, registrando em nota a leitura passiva igualmente possível.
- source_word: כַּתַּנִּים בַּיַּמִּים
  choice: como o monstro dos mares
  rationale: No cenário aquático, תַּנִּים aponta mais naturalmente para uma grande criatura aquática do que para um chacal; “monstro” preserva a força ameaçadora sem identificar indevidamente uma espécie.
- source_word: וַתָּגַח בְּנַהֲרוֹתֶיךָ
  choice: Você irrompia em seus rios
  rationale: O verbo sugere ação violenta, como investir ou dar marradas; “irrompia” transfere essa energia para a imagem aquática de modo compreensível.
- source_word: וַתִּדְלַח מַיִם בְּרַגְלֶיךָ
  choice: turvava as águas com os pés
  rationale: Traduz diretamente o ato de tornar a água turva ou barrenta e conserva a imagem concreta dos pés.
- source_word: וַתִּרְפֹּס נַהֲרוֹתָם
  choice: pisoteava os rios deles
  rationale: Mantém o sentido básico e vigoroso de רפס, “pisotear”, preservando também o sufixo plural “deles”, cujo referente não é explicitado no verso.
theological_decisions:
- issue: Possível fundo simbólico ou caótico de תַּנִּים
  choice: monstro dos mares
  alternative: dragão dos mares; grande criatura aquática; crocodilo
  rationale: A tradução conserva a imagem de uma criatura aquática imponente sem impor uma identificação zoológica ou mitológica mais específica do que o hebraico permite.
translation_notes:
  register: Português atual, solene e acessível, com legibilidade brasileira. A fala poética mantém imagens concretas e paralelismo, sem arcaísmos desnecessários. Emprega-se “seus rios” para o sufixo de segunda pessoa e “os rios deles” para o sufixo de terceira pessoa plural, preservando a mudança e sua ambiguidade referencial.
