    issue: «monstro dos mares» altera a relação locativa do hebraico.
    rationale: A expressão כַּתַּנִּים בַּיַּמִּים traz «nos mares»; «dos mares» pode sugerir origem, posse ou uma categoria fixa, em vez da localização da imagem.
  - severity: medium
    issue: Os verbos finais estão no imperfeito («irrompia», «turvava», «pisoteava»), apesar da sequência narrativa hebraica e da moldura adotada no restante da fala.
    rationale: Os wayyiqtol descrevem os atos imputados ao faraó na lamentação. O pretérito perfeito («irrompeu», «turvou», «pisoteou») reproduz mais diretamente a sequência e evita a introdução de habitualidade não marcada.
  - severity: low
    issue: «Leão novo» é menos idiomático que «leão jovem».
    rationale: «Leão jovem» comunica naturalmente o valor de כְּפִיר, sem perder a ideia de vigor.
