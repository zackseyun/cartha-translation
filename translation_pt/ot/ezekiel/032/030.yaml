revisions:
- from: Ali estão todos os príncipes do norte[a] e todos os sidônios. Eles desceram com os mortos à espada, envergonhados, apesar do terror que seu poder inspirava[b]. Jazem incircuncisos[c] com os mortos à espada e carregam sua humilhação com os que descem à cova.
  to: Ali estão todos os príncipes do norte[a], todos eles, e todos os sidônios, que desceram com os mortos, envergonhados, no terror que inspiravam por sua força[b]. Jazem incircuncisos[c] com os mortos pela espada e carregam sua humilhação com os que descem à cova.
  rationale: A revisão elimina a qualificação prematura «à espada», substitui a concessão interpretativa por uma formulação que segue mais de perto a relação entre terror e força no hebraico e restaura a ênfase de «todos eles». As notas permanecem ancoradas nos pontos pertinentes e conservam a explicação necessária sem impor uma leitura doutrinária.
