  source_fidelity: 'A redação atual altera indevidamente dois pontos: «mortos à espada» antecipa para a primeira ocorrência uma qualificação que o hebraico reserva para a segunda, e «apesar do terror» introduz uma relação concessiva que não está explicitada no texto. Também convém representar de modo mais visível o enfático כֻּלָּם («todos eles»).'
  naturalness: A revisão proposta mantém português moderno e claro. «Jazem», «incircuncisos» e «cova» são adequados ao registro solene e funerário de Ezequiel. A construção «no terror que inspiravam por sua força» é compacta, natural no contexto e evita impor uma concessão interpretativa.
  terminology: «Príncipes», «sidônios», «incircuncisos», «mortos pela espada» e «cova» correspondem adequadamente aos termos e imagens hebraicos. «Humilhação» preserva a noção de desonra de כְּלִמָּה.
  issues:
  - severity: medium
    issue: A primeira expressão «com os mortos à espada» acrescenta «à espada» antes da ocorrência de חַלְלֵי־חֶרֶב.
    rationale: Em «אֶת חֲלָלִים», o hebraico diz apenas «com os mortos/os abatidos». A especificação «pela espada» aparece somente depois, em «אֶת חַלְלֵי חֶרֶב».
  - severity: medium
    issue: «Apesar do terror que seu poder inspirava» introduz concessão.
    rationale: בְּחִתִּיתָם מִגְּבוּרָתָם vincula o terror deles à sua força, mas não contém uma conjunção equivalente a «apesar de». A tradução deve conservar essa relação sem a tornar concessiva.
  - severity: low
    issue: A ênfase de כֻּלָּם não fica explicitamente distinguida.
    rationale: «Todos os príncipes» comunica abrangência, mas «todos eles» preserva melhor a repetição enfática do hebraico, sem prejudicar a fluência.
