language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: שָׁ֣מָּ/ה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖/ם וְ/כָל צִֽדֹנִ֑י אֲשֶׁר יָרְד֣וּ אֶת חֲלָלִ֗ים בְּ/חִתִּיתָ֤/ם מִ/גְבֽוּרָתָ/ם֙ בּוֹשִׁ֔ים וַ/יִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת חַלְלֵי חֶ֔רֶב וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/030.yaml
  text: There are all the princes of the north[a], all of them, and all the Sidonians, who went down with the slain in the terror they caused by their might, ashamed. They lie uncircumcised with those slain by the sword[c][b], and they bear their disgrace with those who go down to the pit.
translation:
  language: pt
  text: Ali estão todos os príncipes do norte[a], todos eles, e todos os sidônios, que desceram com os mortos, envergonhados, no terror que inspiravam por sua força[b]. Jazem incircuncisos[c] com os mortos pela espada e carregam sua humilhação com os que descem à cova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ali estão eles: todos os príncipes do norte».'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: «no terror deles, proveniente de sua força»; isto é, o terror que inspiravam por causa de sua força.'
    reason: lexical_alternative
  - marker: c
    text: «Incircuncisos» conserva o termo literal, usado em Ezequiel como expressão de desonra no contexto do juízo.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: Ali estão
  rationale: O advérbio aponta para a presença deles no domínio dos mortos; «Ali estão» é natural em português e mantém a função dêitica.
- source_word: נְסִיכֵי צָפוֹן
  choice: os príncipes do norte
  rationale: Preserva o sentido elevado de governantes ou chefes políticos sem especificar em excesso sua forma de governo.
- source_word: כֻּלָּם
  choice: todos
  rationale: Mantém a força abrangente do hebraico sem a repetição pouco natural de «todos eles» em português.
- source_word: וְכָל צִדֹנִי
  choice: e todos os sidônios
  rationale: O gentílico singular hebraico tem sentido coletivo; o plural é a forma natural em português.
- source_word: יָרְדוּ אֶת חֲלָלִים
  choice: desceram com os mortos à espada
  rationale: Representa אֶת em sentido associativo e conserva o motivo recorrente da descida ao mundo dos mortos.
- source_word: בְּחִתִּיתָם מִגְבוּרָתָם
  choice: apesar do terror que seu poder inspirava
  rationale: A expressão hebraica é compacta e difícil; esta formulação entende o terror como causado por seu poder e explicita o contraste com a vergonha atual, sem ocultar a leitura mais literal na nota.
- source_word: בּוֹשִׁים
  choice: envergonhados
  rationale: Mantém a condição de vergonha que acompanha a descida deles.
- source_word: וַיִּשְׁכְּבוּ
  choice: Jazem
  rationale: Expressa de modo digno e conciso o estado resultante e contínuo dos mortos na visão.
- source_word: עֲרֵלִים
  choice: incircuncisos
  rationale: Conserva o termo concreto e sua carga de desonra no contexto do juízo de Ezequiel.
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: carregam sua humilhação
  rationale: Preserva a imagem de suportar ou levar consigo a própria desonra.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: com os que descem à cova
  rationale: Mantém a associação com os demais mortos e traduz בּוֹר pelo termo tradicional e claro «cova».
theological_decisions:
- issue: Sentido de עֲרֵלִים no contexto de juízo
  choice: incircuncisos
  alternative: fora da aliança
  rationale: O termo hebraico é concreto e também carrega conotações pactuais e de desonra. A tradução retém a palavra, sem substituir a imagem por uma interpretação teológica.
- issue: Relação entre terror, poder e vergonha
  choice: apesar do terror que seu poder inspirava
  alternative: em meio ao terror causado por seu poder
  rationale: A sintaxe hebraica admite mais de uma relação discursiva. A tradução comunica o contraste contextual entre o antigo poder aterrorizante e a vergonha na morte, enquanto a nota registra a forma mais literal.
- issue: Aspecto de וַיִּשְׁכְּבוּ no catálogo dos mortos
  choice: Jazem
  alternative: deitaram-se
  rationale: O presente descreve sua condição contínua na cova e se ajusta ao caráter visionário do catálogo, sem alterar o resultado expresso pelo verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o cenário funerário e a linguagem concreta de Ezequiel, empregando «jazem» e «cova» sem arcaísmo excessivo. Os marcadores aparecem junto aos termos relevantes e em ordem alfabética.
