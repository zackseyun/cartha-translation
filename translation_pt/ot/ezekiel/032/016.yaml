revisions:
- from: Esta é uma lamentação[a], e elas a entoarão. As filhas das nações[b] a entoarão; sobre o Egito e sobre toda a sua multidão a entoarão — declara o Senhor Yahweh.
  to: Esta é uma lamentação[a]; as filhas das nações[b] a entoarão. Elas a entoarão sobre o Egito e sobre toda a sua multidão — declara o Senhor Yahweh.
  rationale: A revisão transfere o sujeito explícito para a primeira ocorrência de “entoarão”, eliminando a referência pronominal prematura. A segunda oração conserva a repetição hebraica e esclarece que o canto é entoado sobre o Egito e sua multidão. A nota lexical foi ajustada para remover uma ambiguidade acidental, sem alterar seu conteúdo.
