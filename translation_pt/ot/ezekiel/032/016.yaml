  text: קִינָ֥ה הִיא֙ וְ/ק֣וֹנְנ֔וּ/הָ בְּנ֥וֹת הַ/גּוֹיִ֖ם תְּקוֹנֵ֣נָּה אוֹתָ֑/הּ עַל מִצְרַ֤יִם וְ/עַל כָּל הֲמוֹנָ/הּ֙ תְּקוֹנֵ֣נָּה אוֹתָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/016.yaml
  text: This is a lamentation[a], and the daughters of the nations will lament over her. They will lament over Egypt and over all her multitude[b], declares the Lord GOD.
translation:
  language: pt
  text: Esta é uma lamentação[a]; as filhas das nações[b] a entoarão. Elas a entoarão sobre o Egito e sobre toda a sua multidão — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um canto fúnebre”; o termo hebraico pode designar um lamento cantado por ocasião de morte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as mulheres das nações”; literalmente, “as filhas das nações”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִינָה
  choice: lamentação
  rationale: Designa um lamento, muitas vezes de caráter fúnebre. “Lamentação” mantém o tom solene e permite esclarecer a alternativa mais específica em nota.
- source_word: וְקוֹנְנוּהָ / תְּקוֹנֵנָּה אוֹתָהּ
  choice: elas a entoarão / a entoarão
  rationale: O verbo קונן indica proferir ou cantar uma lamentação; o pronome feminino retoma a própria lamentação. “Entoar” expressa que se trata de uma composição executada, não apenas de sentir tristeza, e permite preservar a repetição enfática.
- source_word: בְּנוֹת הַגּוֹיִם
  choice: as filhas das nações
  rationale: Preserva literalmente a expressão figurada e o gênero feminino, provavelmente referente às mulheres das nações que entoariam o lamento.
- source_word: עַל מִצְרַיִם וְעַל כָּל הֲמוֹנָהּ
  choice: sobre o Egito e sobre toda a sua multidão
  rationale: עַל marca o objeto da lamentação. הָמוֹן é amplo e pode indicar a massa de gente, o séquito ou a população associada ao Egito; “multidão” evita restringi-lo indevidamente a um exército.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: Reproduz a fórmula profética e distingue o título אֲדֹנָי do nome divino יהוה.
theological_decisions:
- issue: Forma do nome divino יהוה após אֲדֹנָי
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: “Yahweh” apresenta o nome divino, enquanto “Senhor” traduz o título precedente, evitando fundir os dois termos ou produzir uma repetição artificial.
- issue: Referente do sufixo feminino em וְקוֹנְנוּהָ e אוֹתָהּ
  choice: a própria lamentação
  alternative: o Egito personificado no feminino
  rationale: A antecedente gramatical imediata é קִינָה, substantivo feminino, e a construção indica que a lamentação será entoada. O Egito é explicitado depois como o objeto sobre o qual ela é entoada.
translation_notes:
  register: Português moderno, solene e acessível. A repetição de “a entoarão” foi mantida para refletir a estrutura enfática do hebraico, embora seja mais marcada do que a prosa portuguesa comum.
