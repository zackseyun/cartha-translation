reference: Ezekiel 32:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/תִתִּ/י֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם שְׁמָמָ֣ה וּ/נְשַׁמָּ֗ה אֶ֚רֶץ מִ/מְּלֹאָ֔/הּ בְּ/הַכּוֹתִ֖/י אֶת כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/015.yaml
  text: When I make the land of Egypt a desolation[a], and the land is stripped of all that fills it, when I strike down all who dwell in it, then they will know that I am Yahweh.
translation:
  language: pt
  text: Quando eu fizer da terra do Egito uma desolação[a], e a terra for despojada de tudo o que a enche, quando eu abater todos os que nela habitam, então saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um lugar devastado; e a terra for arrasada, esvaziada de tudo o que a enche”.'
    reason: Registra a alternativa lexical para שְׁמָמָה e para a expressão passiva seguinte, que pode enfatizar tanto a devastação quanto o esvaziamento da terra.
lexical_decisions:
- source_word: בְּתִתִּי
  choice: Quando eu fizer
  rationale: A preposição בְּ com o infinitivo construto introduz uma oração temporal. Neste contexto, נתן com complemento de resultado significa naturalmente “fazer de” ou “tornar”, e não o sentido mais literal de “dar”.
- source_word: אֶרֶץ מִצְרַיִם
  choice: a terra do Egito
  rationale: Expressão geográfica vertida de modo direto e natural em português.
- source_word: שְׁמָמָה
  choice: uma desolação
  rationale: Preserva a força nominal do hebraico e descreve o resultado da ação divina.
- source_word: וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  choice: e a terra for despojada de tudo o que a enche
  rationale: O verbo passivo intensifica a devastação, enquanto מִמְּלֹאָהּ indica que a terra fica privada de seu conteúdo ou plenitude. “Despojada” evita repetição pouco natural de “desolação” e conserva a ideia de perda total.
- source_word: בְּהַכּוֹתִי
  choice: quando eu abater
  rationale: A construção é novamente temporal. “Abater” comunica a força destrutiva de נכה neste contexto de juízo, sem recorrer a linguagem arcaica.
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: todos os que nela habitam
  rationale: Reproduz de forma próxima e idiomática a expressão participial hebraica.
- source_word: וְיָדְעוּ
  choice: então saberão
  rationale: “Então” explicita em português a relação de resultado entre o juízo anterior e o reconhecimento que se segue.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal e é uma transliteração amplamente aceita, sem substituí-lo pelo título “SENHOR”.
- issue: Alcance de “todos os que nela habitam”
  choice: Manter a formulação abrangente do texto
  alternative: Restringir a algum grupo específico de habitantes
  rationale: O hebraico diz literalmente “todos os habitantes nela” e não fornece neste versículo uma limitação explícita; a tradução conserva essa abrangência sem resolver além do texto a tensão do anúncio de juízo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outras comunidades lusófonas. A estrutura temporal repetida do hebraico foi preservada, assim como a progressão entre devastação, queda dos habitantes e reconhecimento de Yahweh.
