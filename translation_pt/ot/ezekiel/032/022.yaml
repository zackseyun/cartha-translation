  yaml_path: translation/ot/ezekiel/032/022.yaml
  text: There is Assyria and all her assembly[a], with his graves all around him; all of them are slain, fallen by the sword.
translation:
  language: pt
  text: Ali está a Assíria e toda a sua multidão[a]; os túmulos dele estão ao redor dele. Todos eles foram mortos, caídos pela espada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico muda o gênero da personificação: “Assíria” e “sua multidão” são femininos, mas “túmulos dele” e “ao redor dele” traduzem sufixos masculinos. A tradução preserva essa mudança em vez de uniformizá-la.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Ali está
  rationale: Introduz de modo natural a nova figura no cenário do mundo dos mortos e preserva a força locativa do hebraico.
- source_word: אַשּׁוּר
  choice: a Assíria
  rationale: Designa o império personificado; esta é a forma consagrada em português.
- source_word: וְכָל־קְהָלָהּ
  choice: e toda a sua multidão
  rationale: קהל indica o conjunto reunido em torno da Assíria. “Multidão” é corrente em português, conserva o sentido coletivo e não restringe o grupo exclusivamente a soldados.
- source_word: קִבְרֹתָיו סְבִיבוֹתָיו
  choice: em volta dele estão os seus túmulos
  rationale: Reproduz a disposição espacial dos túmulos e mantém o deslocamento para sufixos masculinos presente no hebraico, sem o harmonizar com “Assíria”.
- source_word: כֻּלָּם
  choice: Todos eles
  rationale: Retoma de maneira enfática a totalidade do grupo sepultado.
- source_word: חֲלָלִים
  choice: foram mortos
  rationale: No contexto bélico, o termo designa pessoas violentamente mortas, e não apenas feridas.
- source_word: הַנֹּפְלִים בֶּחָרֶב
  choice: caídos pela espada
  rationale: Conserva a imagem marcial do particípio e traduz a espada como meio de morte.
