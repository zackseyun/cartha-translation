  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בַּ/חֲמִשָּׁ֥ה עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/017.yaml
  text: And it happened in the twelfth year[a], on the fifteenth day of the month, that the word of Yahweh came to me, saying,
translation:
  language: pt
  text: 'E aconteceu que, no décimo segundo ano, no décimo quinto dia do mês, a palavra de Yahweh[a] veio a mim, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh é o nome divino representado em hebraico pelas quatro consoantes YHWH; muitas traduções o vertem como “SENHOR”.
    reason: Esclarece a forma do nome divino e registra a tradução tradicional alternativa.
lexical_decisions:
- source_word: וַיְהִי
  choice: E aconteceu que
  rationale: Reproduz a abertura narrativa da fórmula profética datada sem recorrer ao arcaísmo português “e sucedeu”.
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: no décimo segundo ano
  rationale: Forma ordinal natural em português para a fórmula hebraica de datação.
- source_word: בַּחֲמִשָּׁה עָשָׂר לַחֹדֶשׁ
  choice: no décimo quinto dia do mês
  rationale: Explicita “dia”, subentendido na expressão hebraica, e não identifica um mês que o texto hebraico deixa sem nome.
- source_word: דְבַר יְהוָה
  choice: a palavra de Yahweh
  rationale: Mantém a fórmula profética tradicional e traduz diretamente o nome divino presente no texto.
- source_word: אֵלַי
  choice: veio a mim
  rationale: Expressão corrente e fiel para indicar que a mensagem divina foi dirigida ao profeta.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: Reflete o infinitivo hebraico que introduz o oráculo subsequente.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz diretamente o Tetragrama; “Yahweh” preserva o nome pessoal, enquanto a alternativa tradicional portuguesa é informada em nota sem substituir o nome no texto.
translation_notes:
  register: Português moderno, claro e solene, com ordem sintática natural. A formulação conserva a data incompleta do hebraico — o mês não é identificado — sem tentar suprir essa informação.
