  text: Whom do you surpass in beauty? Go down[b][a], and lie with the uncircumcised.
translation:
  language: pt
  text: Quem você supera em beleza?[a] Desça e deite-se[b] com os incircuncisos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Mais belo do que quem [você é]?” O hebraico apresenta uma comparação retórica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seja deitada [com os incircuncisos]”. A forma hebraica pode ser entendida como um imperativo passivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּי נָעָמְתָּ
  choice: A quem você supera em beleza?
  rationale: A preposição comparativa מִן com מִי introduz uma comparação retórica; em português corrente, esta formulação preserva tanto a pergunta como a ideia de superioridade em beleza.
- source_word: רְדָה
  choice: Desça
  rationale: Imperativo de ירד, apropriado ao contexto da descida ao mundo dos mortos.
- source_word: וְהָשְׁכְּבָה
  choice: e deite-se
  rationale: O imperativo de שכב é mantido de modo direto, preservando a imagem mortuária sem acrescentar a noção interpretativa de descanso.
- source_word: אֶת
  choice: com
  rationale: Depois de שכב, expressa aqui associação ou companhia; 'com' é a forma natural em português.
- source_word: עֲרֵלִים
  choice: os incircuncisos
  rationale: Preserva a referência concreta à ausência da marca da circuncisão e sua carga de vergonha no oráculo, sem generalizá-la como 'pagãos' ou 'impuros'.
theological_decisions:
- issue: Conotação de עֲרֵלִים no contexto do oráculo de juízo
  choice: os incircuncisos
  alternative: os pagãos; os impuros
  rationale: O hebraico designa especificamente os não circuncidados. A tradução conserva a imagem pactual e a conotação de desonra sem introduzir categorias teológicas mais amplas.
- issue: Sentido funerário de וְהָשְׁכְּבָה
  choice: e deite-se
  alternative: e seja posto para descansar
  rationale: A formulação direta conserva a metáfora de deitar-se entre os mortos e evita explicitar 'descanso', elemento não declarado no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O pronome “você” torna explícito o destinatário singular masculino indicado pelas formas verbais hebraicas; “desça” e “deite-se” mantêm o tom incisivo do oráculo.
