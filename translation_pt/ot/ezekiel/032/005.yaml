base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/005.yaml
  text: And I will put your flesh on the mountains[a], and I will fill the valleys with your carcass.
translation:
  language: pt
  text: Porei a sua carne sobre os montes e encherei os vales com a sua carcaça[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com o seu cadáver”; mais literalmente, “com a sua altura” ou “com a sua elevada estatura”. O termo hebraico é difícil, mas o contexto aponta para o corpo caído do faraó estendido pela terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Porei
  rationale: O verbo נָתַן tem sentido amplo, incluindo “dar”, “pôr” e “colocar”. Neste contexto de juízo, “porei” expressa de modo direto e natural a ação divina sobre o corpo derrotado.
- source_word: בְּשָׂרְךָ
  choice: a sua carne
  rationale: בָּשָׂר significa literalmente “carne”. A tradução preserva a imagem física e deliberadamente forte do oráculo, sem suavizá-la para “corpo”.
- source_word: הֶהָרִים
  choice: os montes
  rationale: הָרִים designa montes ou montanhas. “Montes” é corrente em português bíblico moderno e mantém o paralelismo topográfico com os vales.
- source_word: וּמִלֵּאתִי
  choice: e encherei
  rationale: No piel, מָלֵא significa normalmente “encher”. A escolha conserva a força e a amplitude da imagem.
- source_word: הַגֵּאָיוֹת
  choice: os vales
  rationale: גֵּאָיוֹת refere-se a vales ou ravinas. “Vales” é a opção mais ampla e natural e forma um contraste claro com “montes”.
- source_word: רָמוּתֶךָ
  choice: a sua carcaça
  rationale: A forma hebraica é rara e difícil, ligada lexicalmente à ideia de altura ou elevação. No contexto, porém, parece apontar para a massa corporal caída do faraó; “carcaça” comunica a imagem concreta e humilhante, enquanto a nota preserva a dificuldade textual.
theological_decisions:
- issue: Imagem violenta do juízo divino
  choice: Manter a carne sobre os montes e a carcaça enchendo os vales.
  alternative: Suavizar a linguagem com “corpo” e “restos mortais”.
  rationale: O oráculo profético retrata de modo intencionalmente gráfico a derrota e a humilhação do faraó. Suavizar os termos reduziria a força da imagem hebraica.
- issue: Sentido do raro רָמוּתֶךָ
  choice: Traduzir contextualmente por “sua carcaça”, com nota sobre o sentido mais literal e a incerteza.
  alternative: Traduzir diretamente por “sua altura” ou “sua elevada estatura”.
  rationale: O contexto favorece a referência ao corpo caído, mas a relação formal com altura ou elevação é genuína e não deve ser ocultada; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil. “Porei” evita solenidade excessiva; “carne” e “carcaça” preservam a aspereza deliberada do texto. O pronome possessivo com artigo segue uso brasileiro natural sem impedir compreensão internacional.
