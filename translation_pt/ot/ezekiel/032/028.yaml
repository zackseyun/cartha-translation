base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/028.yaml
  text: But you[a], in the midst of the uncircumcised, will be broken and will lie with those slain by the sword.
translation:
  language: pt
  text: Mas você, no meio dos incircuncisos, será quebrado e jazerá com os que foram mortos à espada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “com os mortos pela espada”.
    reason: alternativa lexical mais próxima da construção hebraica חַלְלֵי חָרֶב
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mas você
  rationale: A conjunção seguida do pronome independente introduz uma interpelação enfática a Faraó e marca contraste com os povos mencionados antes; “Mas você” expressa essa força no contexto.
- source_word: בְּ/ת֧וֹךְ
  choice: no meio dos
  rationale: Mantém a ideia espacial e associativa de estar situado entre os integrantes de um grupo, com tom solene e natural.
- source_word: עֲרֵלִים
  choice: incircuncisos
  rationale: Preserva o termo corporal e cultural explícito do hebraico, que em Ezequiel funciona como marca de desonra na morte, sem generalizá-lo como “ímpios” ou “impuros”.
- source_word: תִּשָּׁבַר
  choice: será despedaçado
  rationale: O nifal imperfeito de שׁבר descreve passivamente a derrota e a ruína. “Será despedaçado” conserva a imagem forte de quebrantamento e se ajusta ao contexto de juízo.
- source_word: וְ/תִשְׁכַּב
  choice: e jazerá
  rationale: שׁכב pode indicar estar deitado na morte ou na sepultura. “Jazerá” comunica de modo conciso e digno esse sentido funerário.
- source_word: אֶת חַלְלֵי חָרֶב
  choice: com os que foram mortos à espada
  rationale: Neste contexto, אֶת com שׁכב indica companhia. A formulação portuguesa é clara e idiomática, preservando a morte violenta causada pela espada.
theological_decisions:
- issue: Sentido de “os incircuncisos” no lamento profético sobre as nações
  choice: Manter o termo literal “incircuncisos” como designação cultural e de desonra.
  alternative: Traduzir de modo interpretativo como “impuros”, “ímpios” ou “pagãos”.
  rationale: O hebraico emprega explicitamente o termo ligado à circuncisão. Mantê-lo conserva a textura cultural e teológica do texto e evita impor uma categoria doutrinária mais ampla.
- issue: Referente do pronome singular enfático
  choice: Traduzir como interpelação direta a Faraó, sem inserir seu nome no versículo.
  alternative: Explicitar “você, Faraó” no corpo do texto.
  rationale: O contexto identifica o destinatário, mas o hebraico deste versículo traz apenas o pronome. A tradução preserva essa forma e não acrescenta uma identificação ausente da frase.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Jazerá” foi mantido por sua concisão e adequação ao cenário funerário; “despedaçado” conserva a intensidade poética do juízo.
