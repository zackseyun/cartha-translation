source:
  edition: WLC
  text: כִּֽי נָתַ֥תִּי אֶת חתית/ו בְּ/אֶ֣רֶץ חַיִּ֑ים וְ/הֻשְׁכַּב֩ בְּ/ת֨וֹךְ עֲרֵלִ֜ים אֶת חַלְלֵי חֶ֗רֶב פַּרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/032.yaml
  text: For I put his terror in the land of the living[a], and he will be laid among the uncircumcised, with those slain by the sword—Pharaoh and all his multitude, declares the Lord GOD.
translation:
  language: pt
  text: Pois pus o terror dele na terra dos viventes[a], e ele será deitado entre os incircuncisos, junto com os mortos à espada — o faraó e toda a sua multidão —, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme alguns testemunhos antigos: “o meu terror na terra dos viventes”. O texto hebraico aqui diz “o terror dele”.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a explicação ou fundamento da declaração anterior e mantém a ligação discursiva de modo natural em português.
- source_word: נָתַתִּי
  choice: pus
  rationale: נתן pode significar dar, pôr ou colocar; com “terror” e uma indicação de lugar, “pus” preserva o sentido de colocação sem acrescentar uma explicação causal.
- source_word: חֲתִיתוֹ
  choice: o terror dele
  rationale: O substantivo indica terror ou pavor, e o sufixo masculino singular do texto hebraico significa literalmente “dele”. A formulação preserva a ambiguidade quanto ao terror associado ao faraó, sem explicá-lo como terror causado ou sofrido por ele.
- source_word: בְּאֶרֶץ חַיִּים
  choice: na terra dos viventes
  rationale: Expressão hebraica que designa o domínio dos vivos, em contraste com o mundo dos mortos. “Terra dos viventes” mantém a imagem e o registro solene.
- source_word: וְהֻשְׁכַּב
  choice: e ele será deitado
  rationale: A forma hofal de שׁכב é passiva e indica que ele será posto para jazer na morte. “Será deitado” conserva essa voz passiva.
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: entre os incircuncisos
  rationale: Traduz literalmente a designação carregada de vergonha e de significado pactual usada por Ezequiel para os povos mortos.
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: junto com os mortos à espada
  rationale: Aqui אֶת expressa associação. “Mortos à espada” comunica com clareza a morte violenta sem enfraquecer a imagem do juízo.
- source_word: פַּרְעֹה
  choice: o faraó
  rationale: Forma portuguesa corrente do título real egípcio; o artigo é natural no uso moderno.
- source_word: וְכָל הֲמוֹנוֹ
  choice: e toda a sua multidão
  rationale: הָמוֹן pode designar multidão, massa ou hoste. “Multidão” preserva a amplitude do termo sem torná-lo exclusivamente militar.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: “Declara” reproduz a fórmula profética נְאֻם. “Senhor Yahweh” distingue o título אֲדֹנָי do nome divino יְהוִה e evita a repetição “Senhor SENHOR”.
theological_decisions:
- issue: Sentido do sufixo em חֲתִיתוֹ
  choice: o terror dele
  alternative: o meu terror
  rationale: O texto consonantal massorético apresentado contém o sufixo de terceira pessoa masculina singular, “dele”, naturalmente relacionado ao faraó. Alguns testemunhos antigos apoiam “meu terror”; essa variante relevante é preservada em nota.
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução mantém separadamente o título אֲדֹנָי e o nome pessoal יְהוִה, tornando visível o nome divino em vez de substituí-lo por outro título.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com legibilidade brasileira. A ordem e as imagens do hebraico foram preservadas quando naturais; os travessões esclarecem que “o faraó e toda a sua multidão” identifica quem será deitado entre os mortos. O marcador [a] aparece no texto principal.
