  text: 'For thus says the Lord GOD: The sword of the king of Babylon will come upon you[a].'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: A espada do rei da Babilônia virá contra você[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “virá a/sobre você”; neste contexto de juízo, “contra você” expressa a força hostil da frase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Pois
  rationale: Introduz a razão ou fundamento da declaração anterior e preserva naturalmente a ligação discursiva.
- source_word: כֹּה אָמַר
  choice: assim diz
  rationale: Reproduz a fórmula profética de mensageiro em português atual e solene; o perfeito hebraico tem aqui valor idiomático declarativo.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Preserva os dois elementos do título composto: אֲדֹנָי como «Senhor» e o nome divino יהוה como «Yahweh».'
- source_word: חֶרֶב מֶלֶךְ בָּבֶל
  choice: A espada do rei da Babilônia
  rationale: Representa diretamente a cadeia construta e identifica o instrumento específico do juízo.
- source_word: תְּבוֹאֶךָ
  choice: virá contra você
  rationale: O verbo «vir» com «espada» como sujeito, neste contexto de juízo, expressa avanço hostil; «contra» torna essa força clara em português.
theological_decisions:
- issue: Representação do nome divino no título אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A tradução mantém o título אֲדֹנָי e translitera o tetragrama, sem fundir nem ocultar os dois elementos.
- issue: Direção da vinda da espada
  choice: virá contra você
  alternative: virá sobre você
  rationale: «Contra» explicita a hostilidade exigida pelo sujeito «espada» e pelo contexto de julgamento, enquanto a nota preserva a alternativa mais formal.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. «Pois assim diz» conserva a cadência profética; «você» comunica naturalmente o singular masculino dirigido ao faraó no contexto.
