base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/023.yaml
  text: whose graves were set in the remotest parts of the pit[a], and her assembly was around her grave—all of them slain, fallen by the sword[b], who spread terror in the land of the living.
translation:
  language: pt
  text: As sepulturas dela foram colocadas nas partes mais remotas da cova[a], e sua multidão estava ao redor da sepultura dela — todos eles mortos, caídos à espada, eles que espalharam terror[b] na terra dos viventes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos recantos da cova”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “causaram terror”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתְּנוּ
  choice: foram colocadas
  rationale: O passivo de נתן indica aqui a colocação das sepulturas, não uma ação de dar; “foram colocadas” é natural e preserva a voz passiva.
- source_word: קִבְרֹתֶיהָ
  choice: suas sepulturas
  rationale: O sufixo feminino singular remete à entidade nacional personificada no contexto; em português, “suas” mantém a referência sem tornar a frase artificial.
- source_word: בְּיַרְכְּתֵי בוֹר
  choice: nas partes mais remotas da cova
  rationale: יַרְכְּתֵי designa os extremos ou recantos mais afastados. “Cova” preserva a imagem de בוֹר sem substituí-la interpretativamente por “Sheol”.
- source_word: קְהָלָהּ
  choice: sua multidão
  rationale: קהל indica o grupo reunido em torno da entidade. “Multidão” comunica o sentido coletivo em português corrente e evita a possível conotação institucional de “assembleia”.
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: ao redor de sua sepultura
  rationale: Tradução espacial direta que mantém a distinção textual entre as muitas sepulturas e a sepultura da entidade personificada.
- source_word: כֻּלָּם חֲלָלִים
  choice: todos eles mortos
  rationale: חֲלָלִים designa mortos por violência, especialmente em combate. O contexto imediato de “caídos à espada” conserva explicitamente essa nuance.
- source_word: נֹפְלִים בַּחֶרֶב
  choice: caídos à espada
  rationale: O particípio funciona como descrição dos mortos e mantém o registro militar da expressão hebraica.
- source_word: נָתְנוּ חִתִּית
  choice: espalharam terror
  rationale: A combinação idiomática נתן + חִתִּית significa produzir, impor ou difundir terror; “espalharam terror” é natural e expressa seu efeito sobre outros.
- source_word: בְּאֶרֶץ חַיִּים
  choice: na terra dos viventes
  rationale: Expressão convencional que contrasta o mundo dos vivos com a cova e preserva o tom poético-profético.
theological_decisions:
- issue: Personificação feminina da nação ou entidade
  choice: Preservar a referência por meio dos possessivos “suas” e “sua”
  alternative: Empregar uma formulação neutra ou explicitar repetidamente “dela”
  rationale: Os sufixos hebraicos são femininos singulares e participam da personificação profética. Os possessivos portugueses mantêm essa continuidade de modo natural, sem acrescentar interpretação.
- issue: Imagem do mundo dos mortos em בוֹר
  choice: Traduzir como “cova”
  alternative: “Sheol” ou “sepultura”
  rationale: O texto traz בוֹר, não שְׁאוֹל. “Cova” conserva a imagem concreta e a tensão entre sepultura e profundidade sem impor uma identificação teológica mais específica.
- issue: Agência anterior dos que agora estão mortos
  choice: “eles que espalharam terror”
  alternative: “os quais causaram terror”
  rationale: A oração relativa mantém o contraste irônico do texto entre o terror que antes provocaram na terra dos vivos e sua atual posição na cova.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A tradução conserva o paralelismo fúnebre e militar, a personificação do referente feminino e o contraste entre a cova e a terra dos viventes. O marcador [b] foi colocado junto da expressão a que sua nota efetivamente se refere.
