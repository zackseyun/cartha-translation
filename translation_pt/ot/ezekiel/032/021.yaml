source:
  edition: WLC
  text: יְדַבְּרוּ ל֞/וֹ אֵלֵ֧י גִבּוֹרִ֛ים מִ/תּ֥וֹךְ שְׁא֖וֹל אֶת עֹֽזְרָ֑י/ו יָֽרְד֛וּ שָׁכְב֥וּ הָ/עֲרֵלִ֖ים חַלְלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/021.yaml
  text: 'The mighty among the chiefs will speak to him from the midst of Sheol[a], with his helpers: ‘They have gone down; they lie still, the uncircumcised[c][b], slain by the sword.’'
translation:
  language: pt
  text: 'Os mais poderosos entre os guerreiros[a] lhe falarão do meio do Sheol[b], juntamente com os seus aliados[c]: “Desceram; jazem os incircuncisos, mortos à espada.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil; também pode ser traduzida por “os poderosos entre os chefes” ou, mais literalmente, “os poderosos dos guerreiros”.
    reason: lexical_alternative
  - marker: b
    text: Sheol é o termo hebraico para o mundo dos mortos; seu sentido não é idêntico ao de “inferno”.
    reason: cultural_note
  - marker: c
    text: Ou “juntamente com os seus auxiliares”. O hebraico também pode indicar aqueles que o acompanham na morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבְּרוּ לּוֹ
  choice: falarão com ele
  rationale: O piel imperfeito de דבר projeta a fala na cena profética, e לּוֹ indica naturalmente aquele a quem se dirige a fala, isto é, o faraó.
- source_word: אֵלֵי גִבּוֹרִים
  choice: os mais poderosos entre os guerreiros
  rationale: A expressão hebraica é difícil. Esta formulação comunica a ideia contextual de guerreiros de destaque no mundo dos mortos, sem introduzir seres divinos e sem dar à construção uma precisão maior do que ela permite.
- source_word: מִתּוֹךְ שְׁאוֹל
  choice: do meio do Sheol
  rationale: Preserva a imagem espacial do hebraico e mantém o termo próprio Sheol, cujo campo de sentido não equivale simplesmente a 'inferno' nem apenas a uma sepultura.
- source_word: אֶת עֹזְרָיו
  choice: juntamente com os seus aliados
  rationale: Toma אֶת em sentido associativo, indicando os que o acompanham ou apoiam. 'Aliados' é natural no contexto militar, enquanto a nota registra a alternativa mais literal.
- source_word: יָרְדוּ
  choice: Desceram
  rationale: O perfeito apresenta como concluída a descida ao mundo dos mortos; o pretérito perfeito é direto e idiomático em português.
- source_word: שָׁכְבוּ
  choice: jazem
  rationale: No contexto da morte, 'jazem' expressa de modo conciso e digno o estado dos mortos sem acrescentar explicação ao texto.
- source_word: הָעֲרֵלִים
  choice: os incircuncisos
  rationale: Mantém a designação de Ezequiel para povos estrangeiros e suas conotações de vergonha e exclusão, sem explicá-las dentro do versículo.
- source_word: חַלְלֵי חָרֶב
  choice: mortos à espada
  rationale: Equivalente português natural para a expressão hebraica referente aos que foram mortos em combate pela espada.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: mundo dos mortos; sepultura; inferno
  rationale: A transliteração preserva o conceito veterotestamentário sem identificá-lo indevidamente com formulações posteriores sobre o inferno nem reduzi-lo a um túmulo físico.
- issue: Identidade de אֵלֵי גִבּוֹרִים
  choice: guerreiros humanos de maior destaque no Sheol
  alternative: deuses dos guerreiros; chefes poderosos
  rationale: O contexto de Ezequiel 32 enumera nações e combatentes mortos. A leitura humana se ajusta melhor à cena, embora a nota preserve a dificuldade lexical da expressão.
- issue: Relação sintática de אֶת עֹזְרָיו
  choice: os aliados participam da fala dirigida a ele
  alternative: os aliados acompanham o faraó na morte
  rationale: O valor associativo de אֶת favorece 'juntamente com', mas a sintaxe compacta admite entender a expressão como referência aos que o acompanham na morte; a nota mantém essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Jazem' conserva o tom fúnebre e poético sem soar excessivamente arcaico. As notas foram reposicionadas para corresponder exatamente aos termos que explicam.
