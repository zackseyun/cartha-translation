  text: כָּל מְא֤וֹרֵי אוֹר֙ בַּ/שָּׁמַ֔יִם אַקְדִּירֵ֖/ם עָלֶ֑י/ךָ וְ/נָתַ֤תִּי חֹ֨שֶׁךְ֙ עַֽל אַרְצְ/ךָ֔ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/008.yaml
  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
translation:
  language: pt
  text: Todos os luminares nos céus[a], eu os escurecerei sobre você e porei trevas sobre a sua terra — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os luminares de luz nos céus”, isto é, os corpos celestes que servem como fontes de luz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Todos
  rationale: Expressa a totalidade dos corpos celestes luminosos e concorda naturalmente com “luminares”.
- source_word: מְאוֹרֵי אוֹר
  choice: os luminares
  rationale: O hebraico traz literalmente “luminares de luz”, expressão que designa fontes ou corpos luminosos. “Luminares” comunica o referente com dignidade e concisão; a formulação literal é preservada em nota.
- source_word: בַּשָּׁמַיִם
  choice: dos céus
  rationale: Embora a preposição seja literalmente “nos céus”, em português “os luminares dos céus” expressa de modo natural sua localização e preserva o plural hebraico.
- source_word: אַקְדִּירֵם
  choice: eu os escurecerei
  rationale: 'Reproduz o valor causativo do verbo: Yahweh fará com que os luminares fiquem escuros. O pronome “os” explicita o objeto já expresso.'
- source_word: עָלֶיךָ
  choice: sobre você
  rationale: Mantém a imagem espacial e judicial de escuridão vindo sobre o destinatário, sem transformar a preposição em “contra”.
- source_word: וְנָתַתִּי חֹשֶׁךְ
  choice: e porei trevas
  rationale: Preserva a concretude de נָתַן, “pôr/colocar”, e emprega “trevas” como termo natural no registro profético.
- source_word: עַל אַרְצְךָ
  choice: sobre a sua terra
  rationale: אֶרֶץ refere-se aqui ao território do destinatário, não ao planeta inteiro; “sua terra” conserva essa referência.
- source_word: נְאֻם
  choice: declara
  rationale: Equivalente corrente e solene da fórmula profética que introduz ou encerra um pronunciamento divino.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Preserva os dois elementos do título hebraico: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”.'
theological_decisions:
- issue: Tradução do nome divino יהוה na expressão אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR / o Senhor DEUS
  rationale: A forma escolhida distingue o título אֲדֹנָי do nome próprio יהוה e torna explícito o nome da aliança, sem fundir os dois termos.
- issue: Alcance da escuridão cósmica
  choice: linguagem concreta de escurecimento dos luminares sobre o destinatário
  alternative: interpretar explicitamente a imagem como símbolo da queda política do Egito
  rationale: O texto apresenta a imagem cósmica sem explicar aqui seu estatuto metafórico; a tradução preserva essa tensão e não impõe uma interpretação.
translation_notes:
  register: Português moderno, solene e amplamente compreensível. A ordem com deslocamento inicial de “Todos os luminares dos céus” conserva a ênfase hebraica, enquanto a retomada por “os” mantém a frase clara. “Sobre você” e “sobre a sua terra” preservam a repetição de עַל.
