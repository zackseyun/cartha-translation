  text: בֶּן אָדָ֕ם נְהֵ֛ה עַל הֲמ֥וֹן מִצְרַ֖יִם וְ/הוֹרִדֵ֑/הוּ א֠וֹתָ/הּ וּ/בְנ֨וֹת גּוֹיִ֧ם אַדִּרִ֛ם אֶל אֶ֥רֶץ תַּחְתִּיּ֖וֹת אֶת י֥וֹרְדֵי בֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/018.yaml
  text: Son of man[a], wail over the multitude of Egypt, and bring her down, her and the daughters of mighty nations, to the land beneath[c][b], with those who go down to the pit.
translation:
  language: pt
  text: Filho do homem, lamente pela multidão do Egito e faça descer o Egito e as filhas de nações poderosas[b] às profundezas da terra[c], junto com os que descem à cova.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hebraico: “filhas de nações poderosas”, expressão figurada que pode se referir a povos ou comunidades personificados e associados ao Egito.'
    reason: cultural_note
  - marker: c
    text: Ou “à terra inferior” ou “ao mundo de baixo”. A expressão hebraica descreve a região de baixo associada aos mortos.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma profética característica com que Deus se dirige a Ezequiel, de modo tradicional, transparente e compreensível em português.
- source_word: נְהֵה
  choice: lamente
  rationale: O verbo designa lamentação fúnebre. “Lamente” comunica esse sentido com dignidade e naturalidade, sem exigir que o texto especifique a forma sonora do lamento.
- source_word: הֲמוֹן מִצְרַיִם
  choice: a multidão do Egito
  rationale: הָמוֹן pode indicar multidão, massa humana ou turba. No contexto, “multidão” preserva a amplitude da referência sem restringi-la às forças militares ou às riquezas do Egito.
- source_word: וְהוֹרִדֵהוּ ... אוֹתָהּ
  choice: e faça-a descer
  rationale: O imperativo causativo de ירד pede que o profeta faça o Egito descer, isto é, anuncie ou efetue poeticamente sua descida. O pronome feminino acompanha a retomada explícita de Egito como nação em אוֹתָהּ, sem reproduzir de maneira artificial a irregularidade de gênero presente na forma escrita anterior.
- source_word: וּבְנוֹת גּוֹיִם אַדִּרִם
  choice: e às filhas de nações poderosas
  rationale: Conserva a imagem hebraica das “filhas”, provavelmente povos ou comunidades personificados e associados a nações de grande poder. “Poderosas” expressa adequadamente a força ou imponência de אַדִּרִם.
- source_word: אֶרֶץ תַּחְתִּיּוֹת
  choice: a terra das profundezas
  rationale: A expressão aponta literalmente para a terra ou região inferior. “Terra das profundezas” preserva a espacialidade descendente e a associação com o domínio dos mortos sem impor uma identificação doutrinária posterior.
- source_word: אֶת יֹרְדֵי בוֹר
  choice: junto com os que descem à cova
  rationale: 'אֶת é entendido em sentido associativo: o Egito desce para estar na companhia dos mortos. “Junto com” torna essa relação clara em português.'
- source_word: בּוֹר
  choice: cova
  rationale: Neste contexto funerário e de descida ao domínio dos mortos, “cova” mantém a imagem concreta do poço ou fosso e soa natural em português bíblico contemporâneo.
theological_decisions:
- issue: Natureza da imagem do mundo dos mortos em אֶרֶץ תַּחְתִּיּוֹת e בּוֹר
  choice: Manter as imagens como “terra das profundezas” e “cova”.
  alternative: Traduzir como “mundo dos mortos”, “Sheol” ou “inferno”.
  rationale: O hebraico emprega linguagem poética de descida ao domínio dos mortos. A tradução evita identificá-la diretamente com uma formulação posterior e mais sistematizada do destino após a morte.
- issue: A ação do profeta ao fazer o Egito descer
  choice: Conservar o imperativo causativo “faça-a descer”.
  alternative: Explicitar como “anuncie que ela descerá” ou “mande-a descer”.
  rationale: A formulação mantém a força performativa e a tensão poética da ordem divina sem explicar além do que o hebraico declara.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A construção “faça-a descer” preserva o movimento vertical central do verso; os travessões delimitam a retomada explicativa “a ela e às filhas...” sem alterar sua função sintática. As imagens “filhas”, “profundezas” e “cova” foram mantidas para conservar o caráter poético e funerário do hebraico.
