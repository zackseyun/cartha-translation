revisions:
- from: Filho do homem, lamente pela multidão do Egito[a] e faça-a descer — a ela e às filhas de nações poderosas[b] — à terra das profundezas[c], junto com os que descem à cova.
  to: Filho do homem, lamente pela multidão do Egito e faça descer o Egito e as filhas de nações poderosas[b] às profundezas da terra[c], junto com os que descem à cova.
  rationale: A revisão torna a sintaxe portuguesa natural e clara, substituindo a duplicação pronominal por uma retomada explícita de «Egito». Também ajusta a expressão para «às profundezas da terra», que comunica melhor a imagem hebraica das regiões inferiores. A nota a é mantida por continuidade editorial, embora o marcador não seja necessário para a redação principal; a nota b permanece ancorada em «filhas», e a nota c em «profundezas da terra».
  reviewer_model: gpt-5.6-terra
