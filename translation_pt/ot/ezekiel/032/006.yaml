  text: I will drench the land with your flowing blood up to the mountains[c][b][a], and the ravines will be filled with you.
translation:
  language: pt
  text: Encharcarei a terra com o sangue que jorra de você[a], até os montes, e as ravinas[b] ficarão cheias de você[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “regarei a terra do seu derramamento com o seu sangue”. A expressão hebraica é difícil; a tradução no texto apresenta seu provável sentido no contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os canais”, “os leitos dos rios” ou “os vales”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “ficarão cheias a partir de você”, provavelmente com seu sangue ou seus restos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקֵיתִי
  choice: Encharcarei
  rationale: O hifil de שׁקה significa literalmente “farei beber” ou “regarei”. No contexto de sangue derramado em juízo, “encharcarei” comunica naturalmente a saturação violenta da terra.
- source_word: אֶרֶץ
  choice: a terra
  rationale: אֶרֶץ designa aqui o território ou solo atingido; “a terra” é corrente e preserva a amplitude da imagem.
- source_word: צָפָתְךָ מִדָּמְךָ
  choice: com o sangue que jorra de você
  rationale: A expressão hebraica é difícil e inclui um termo raro ligado provavelmente a derramamento, fluxo ou matéria que emerge. A formulação explicita o sentido provável sem esconder em nota a incerteza lexical.
- source_word: אֶל הֶהָרִים
  choice: até os montes
  rationale: אֶל indica aqui a extensão do sangue pelo terreno, alcançando os montes.
- source_word: וַאֲפִקִים
  choice: os vales
  rationale: אֲפִיקִים pode indicar canais, leitos de rios ou ravinas. “Vales” é compreensível em português e se ajusta à paisagem, enquanto a nota registra opções mais específicas.
- source_word: יִמָּלְאוּן
  choice: ficarão cheios
  rationale: O nifal imperfeito de מלא exprime que esses acidentes do terreno serão preenchidos.
- source_word: מִמֶּךָּ
  choice: de você
  rationale: A expressão significa literalmente “a partir de você”; no contexto, refere-se ao sangue ou aos restos da figura personificada. A tradução direta conserva a força e a ambiguidade da imagem.
