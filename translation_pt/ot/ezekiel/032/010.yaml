  text: וַ/הֲשִׁמּוֹתִ֨י עָלֶ֜י/ךָ עַמִּ֣ים רַבִּ֗ים וּ/מַלְכֵי/הֶם֙ יִשְׂעֲר֤וּ עָלֶ֨י/ךָ֙ שַׂ֔עַר בְּ/עוֹפְפִ֥/י חַרְבִּ֖/י עַל פְּנֵי/הֶ֑ם וְ/חָרְד֤וּ לִ/רְגָעִים֙ אִ֣ישׁ לְ/נַפְשׁ֔/וֹ בְּ/י֖וֹם מַפַּלְתֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
translation:
  language: pt
  text: Farei com que muitos povos fiquem horrorizados por sua causa, e os reis deles estremecerão de horror por causa de você[a], quando eu brandir minha espada diante deles[b]. Tremerão a cada instante[c], cada um por sua própria vida, no dia da sua queda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os reis deles ficarão terrivelmente apavorados a seu respeito”. O hebraico emprega um verbo e um substantivo da mesma raiz para intensificar a ideia de horror.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão hebraica diz literalmente: “quando eu fizer minha espada voar diante deles”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “de instante em instante”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמּוֹתִי
  choice: Farei com que ... fiquem horrorizados
  rationale: O hifil de שמם, tendo “muitos povos” como objeto, indica que Deus os deixa atônitos ou horrorizados diante do destino do Egito. “Fiquem horrorizados” se ajusta à sequência de reações de terror.
- source_word: עַמִּים רַבִּים
  choice: muitos povos
  rationale: Mantém o sentido coletivo de עַמִּים sem sugerir necessariamente Estados-nação modernos.
- source_word: יִשְׂעֲרוּ ... שַׂעַר
  choice: estremecerão de horror
  rationale: O verbo e o substantivo cognato formam uma expressão intensiva. A formulação portuguesa comunica tanto a reação física quanto o horror extremo.
- source_word: בְּעוֹפְפִי חַרְבִּי
  choice: quando eu fizer minha espada voar
  rationale: Preserva a imagem vívida e incomum do hebraico, na qual Deus faz sua espada “voar”; o contexto permite entendê-la como agitada ou brandida.
- source_word: עַל־פְּנֵיהֶם
  choice: diante deles
  rationale: Equivalente espacial natural para a exibição pública da espada perante os reis.
- source_word: וְחָרְדוּ
  choice: Tremerão
  rationale: חרד expressa tremor causado por medo, reunindo a dimensão física e emocional.
- source_word: לִרְגָעִים
  choice: a cada instante
  rationale: O plural com ל pode indicar momentos repetidos; a expressão transmite pavor contínuo e conserva a possível ideia de “de instante em instante” em nota.
- source_word: אִישׁ לְנַפְשׁוֹ
  choice: cada um por sua própria vida
  rationale: נֶפֶשׁ, neste contexto de ameaça mortal, significa a própria vida. “Cada um” reproduz naturalmente o distributivo singular.
- source_word: בְּיוֹם מַפַּלְתֶּךָ
  choice: no dia da sua queda
  rationale: מַפָּלָה designa a queda ou ruína do Egito sob juízo; “queda” é clara, digna e próxima da imagem hebraica.
theological_decisions:
- issue: Agência divina na imagem do juízo
  choice: Deus fala em primeira pessoa e apresenta a espada como sua própria espada.
  alternative: A espada pode atuar historicamente por meio da Babilônia como instrumento de Deus.
  rationale: As formas de primeira pessoa — “farei” e “minha espada” — exigem que a agência divina permaneça explícita, sem excluir uma mediação histórica que o versículo não especifica.
- issue: Referente do terror dos reis
  choice: Os reis estremecem por causa do destino do Egito, ao verem a espada de Deus diante deles.
  alternative: A preposição עָלֶיךָ pode ser vertida de modo mais formal como “a seu respeito” ou “sobre você”.
  rationale: “Por causa de você” comunica em português que a queda do Egito provoca terror nos reis, sem afirmar que o medo se limita à compaixão ou que o próprio Egito seja o agente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é solene sem ser arcaico. A segunda pessoa singular hebraica dirigida ao Egito foi vertida com “você/sua”, favorecendo clareza contemporânea. A ordem das notas acompanha os respectivos marcadores no texto.
