  to: Farei com que muitos povos fiquem horrorizados por sua causa, e os reis deles estremecerão de horror por causa de você[a], quando eu brandir minha espada diante deles[b]. Tremerão a cada instante[c], cada um por sua própria vida, no dia da sua queda.
