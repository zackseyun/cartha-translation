source:
  edition: WLC
  text: בֶּן אָדָ֕ם הָיוּ לִ֥/י בֵֽית יִשְׂרָאֵ֖ל ל/סוג כֻּלָּ֡/ם נְ֠חֹשֶׁת וּ/בְדִ֨יל וּ/בַרְזֶ֤ל וְ/עוֹפֶ֨רֶת֙ בְּ/ת֣וֹךְ כּ֔וּר סִגִ֥ים כֶּ֖סֶף הָיֽוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/018.yaml
  text: Son of man[a], the house of Israel has become dross to me; all of them are bronze and tin and iron and lead in the midst of a furnace; they are the dross of silver.
translation:
  language: pt
  text: Filho do homem, a casa de Israel tornou-se escória para mim; todos eles são bronze[a], estanho, ferro e chumbo numa fornalha; são a escória da prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”.
    reason: נְחֹשֶׁת pode designar cobre ou bronze.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a fórmula hebraica de tratamento característica de Ezequiel, já consagrada e compreensível em português.
- source_word: הָיוּ לִי
  choice: tornou-se ... para mim
  rationale: Expressa o estado resultante da casa de Israel na avaliação do falante divino, sem acrescentar uma interpretação como “aos meus olhos”.
- source_word: בֵית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a expressão coletiva e pactual do hebraico, em vez de reduzi-la simplesmente a “Israel”.
- source_word: לְסוּג
  choice: escória
  rationale: Designa o resíduo ou as impurezas separados no processo de fundição e conserva a metáfora metalúrgica.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Reproduz a força distributiva do pronome e retoma coletivamente os membros da casa de Israel.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: O termo pode indicar cobre ou bronze; “bronze” é natural nesta lista de metais, enquanto a alternativa legítima é registrada em nota.
- source_word: בְדִיל
  choice: estanho
  rationale: Equivalente usual do metal no contexto de ligas e fundição.
- source_word: בַרְזֶל
  choice: ferro
  rationale: Equivalente lexical direto.
- source_word: עוֹפֶרֶת
  choice: chumbo
  rationale: Equivalente lexical direto.
- source_word: בְּתוֹךְ כּוּר
  choice: no meio da fornalha
  rationale: Conserva a ideia espacial de בְּתוֹךְ e traduz כּוּר como fornalha de fundição em linguagem natural.
- source_word: סִגִים כֶּסֶף
  choice: a escória da prata
  rationale: Preserva a relação da cadeia construta e a imagem de Israel como resíduo sem valor separado da prata.
theological_decisions:
- issue: Referência ao falante divino no pronome לִי
  choice: para mim
  alternative: aos meus olhos; diante de mim
  rationale: O hebraico marca a relação avaliativa com o Senhor sem explicá-la; a tradução evita ampliar a afirmação.
- issue: Metáfora metalúrgica do juízo
  choice: Tradução literal com “escória”, metais e “fornalha”
  alternative: Paráfrase geral sobre corrupção moral
  rationale: A força teológica do texto está na própria imagem da fundição; mantê-la evita reduzir ou resolver interpretativamente a metáfora.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A pontuação com ponto e vírgula mantém unidas as duas formulações da metáfora. O marcador [a] foi colocado imediatamente após o termo ao qual a alternativa lexical se refere.
