  text: וְ/נִחַ֥לְתְּ בָּ֖/ךְ לְ/עֵינֵ֣י גוֹיִ֑ם וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/016.yaml
  text: And you will be profaned through yourself before the eyes of the nations[a], and you will know that I am Yahweh.
translation:
  language: pt
  text: E você será profanada em si mesma diante dos olhos das nações[a], e saberá que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será contaminada” ou “será desonrada em si mesma”. O verbo hebraico pode expressar profanação, contaminação ou desonra pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַלְתְּ
  choice: será profanada
  rationale: A forma feminina singular é mais bem entendida aqui como passiva/reflexiva de חלל, com o sentido de sofrer profanação. No contexto de impureza e juízo em Ezequiel, “profanada” preserva melhor a dimensão de santidade violada do que o termo mais geral “desonrada”.
- source_word: בָּךְ
  choice: em si mesma
  rationale: A preposição ב com sufixo feminino é concisa e admite mais de uma nuance. “Em si mesma” mantém a ligação da profanação com a própria Jerusalém sem impor a leitura causal mais forte de “por sua própria culpa”.
- source_word: לְעֵינֵי
  choice: diante dos olhos de
  rationale: Reproduz a imagem concreta do idioma hebraico e comunica que a profanação ocorrerá publicamente.
- source_word: גוֹיִם
  choice: as nações
  rationale: No contexto profético, refere-se coletivamente às nações estrangeiras; esta é a formulação mais clara e não introduz terminologia moldada pelo Novo Testamento.
- source_word: וְיָדַעַתְּ
  choice: e saberá
  rationale: O perfeito com conjunção tem força futura ou resultativa no anúncio profético. A coordenação simples preserva a forma hebraica, deixando que o contexto comunique a consequência.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
theological_decisions:
- issue: Sentido de חלל neste versículo
  choice: profanação judicial e cultual de Jerusalém perante as nações
  alternative: perda de posse ou herança; desonra pública em sentido apenas geral
  rationale: O contexto imediato de impureza, vergonha e juízo, bem como o vocabulário característico de santidade em Ezequiel, favorece a ideia de profanação. A nota preserva as nuances lexicais alternativas sem apagar a tensão do hebraico.
- issue: Força de בָּךְ
  choice: “em si mesma”, sem explicitar causalidade
  alternative: “por si mesma” ou “por sua própria culpa”
  rationale: O hebraico permite associar a profanação à própria Jerusalém, mas não exige que a tradução principal transforme essa relação numa declaração causal explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Você” torna explícito o discurso direto a Jerusalém; o feminino em “profanada” preserva essa personificação. A expressão “diante dos olhos” mantém a imagem pública e vívida do hebraico.
