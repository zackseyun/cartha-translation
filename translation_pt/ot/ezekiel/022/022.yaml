  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כְּ/הִתּ֥וּךְ כֶּ֨סֶף֙ בְּ/ת֣וֹךְ כּ֔וּר כֵּ֖ן תֻּתְּכ֣וּ בְ/תוֹכָ֑/הּ וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה שָׁפַ֥כְתִּי חֲמָתִ֖/י עֲלֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/022.yaml
  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
translation:
  language: pt
  text: Assim como a prata é derretida dentro da fornalha, assim vocês serão derretidos dentro dela[a]; e saberão que eu, Yahweh, derramei sobre vocês o meu furor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, dentro da cidade, Jerusalém, conforme o contexto imediato.
    reason: Esclarece o antecedente implícito do pronome feminino sem inseri-lo no texto principal.
lexical_decisions:
- source_word: כְּהִתּוּךְ כֶּסֶף
  choice: Assim como a prata é derretida
  rationale: A construção nominal com כְּ introduz a comparação. A formulação verbal passiva é natural em português e preserva a imagem literal da prata sendo derretida.
- source_word: בְּתוֹךְ כּוּר
  choice: dentro da fornalha
  rationale: כּוּר designa uma fornalha usada para fundição ou refino. 'Dentro' comunica de modo natural a localização interna expressa por בְּתוֹךְ.
- source_word: כֵּן תֻּתְּכוּ
  choice: assim vocês serão derretidos
  rationale: Mantém a correlação 'assim como... assim' e a voz passiva do hebraico, sem enfraquecer a metáfora de juízo.
- source_word: בְתוֹכָהּ
  choice: dentro dela
  rationale: Preserva o pronome feminino singular e seu antecedente implícito; no contexto imediato, ele se refere à cidade, Jerusalém.
- source_word: וִידַעְתֶּם
  choice: e saberão
  rationale: Reproduz de forma direta a fórmula de reconhecimento frequente em Ezequiel, sem acrescentar um 'então' interpretativo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: שָׁפַכְתִּי
  choice: derramei
  rationale: O perfeito hebraico apresenta o ato divino como realizado. O pretérito perfeito é direto e natural após 'saberão que'.
- source_word: חֲמָתִי
  choice: o meu furor
  rationale: חֵמָה denota ira intensa e ardente. 'Furor' conserva a força da linguagem profética e é idiomático em português.
- source_word: עֲלֵיכֶם
  choice: sobre vocês
  rationale: Equivalente natural de עַל neste contexto e apropriado à expressão portuguesa 'derramar sobre'.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: Jeová; SENHOR
  rationale: O texto traz diretamente o Tetragrama. 'Yahweh' preserva o nome pessoal e não o substitui por um título.
- issue: Natureza da imagem da fundição
  choice: Manter literalmente 'serão derretidos'
  alternative: Explicitar como purificação ou destruição
  rationale: O contexto é de juízo, mas a metáfora não deve ser convertida numa conclusão teológica mais específica do que o próprio verso declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição 'Assim como... assim' conserva a estrutura retórica hebraica; 'vocês' expressa claramente o plural. A opção 'fornalha' sustenta o cenário metalúrgico sem tecnicismo excessivo.
