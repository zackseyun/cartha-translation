  text: בֶּן אָדָ֕ם אֱמָר לָ֕/הּ אַ֣תְּ אֶ֔רֶץ לֹ֥א מְטֹהָרָ֖ה הִ֑יא לֹ֥א גֻשְׁמָ֖/הּ בְּ/י֥וֹם זָֽעַם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/024.yaml
  text: Son of man[a], say to her[c][b], ‘You are a land not cleansed and not rained on in the day of indignation.’
translation:
  language: pt
  text: 'Filho do homem, diga-lhe: “Você é uma terra que não foi purificada[a] nem recebeu chuva[b] no dia da indignação[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não foi limpa”. O particípio hebraico pode indicar impureza ou o estado daquilo que não foi purificado.'
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica é rara. Também pode ser entendida como “não foi regada pela chuva” ou “ficou sem chuva”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “no dia da ira”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Mantém a forma tradicional e o registro da maneira característica como Ezequiel é interpelado, sem transformar a expressão em uma interpretação como “mortal”.
- source_word: אֱמָר לָהּ
  choice: diga-lhe
  rationale: Reproduz o imperativo singular e o pronome feminino que retoma a terra, com formulação natural em português.
- source_word: אַתְּ אֶרֶץ
  choice: Você é uma terra
  rationale: Expressa a identificação metafórica da destinatária com a terra e preserva a interpelação direta no feminino indicada pelo hebraico.
- source_word: לֹא מְטֹהָרָה
  choice: que não foi purificada
  rationale: Preserva o valor passivo do particípio de טהר e sua possível abrangência moral e ritual, sem reduzi-lo apenas ao estado de estar suja.
- source_word: לֹא גֻשְׁמָהּ
  choice: nem recebeu chuva
  rationale: A rara forma passiva ligada a גשם refere-se provavelmente a chover sobre a terra. “Não recebeu chuva” comunica isso de modo natural em português, mantendo em nota as alternativas plausíveis.
- source_word: בְּיוֹם זָעַם
  choice: no dia da indignação
  rationale: Conserva a expressão temporal e o tom profético de זעם, sem explicitar de quem procede a indignação, embora o contexto aponte para o juízo divino.
theological_decisions:
- issue: Natureza da condição da terra
  choice: A terra é descrita como não purificada e privada de chuva no tempo da indignação.
  alternative: As imagens podem destacar sobretudo a impureza moral ou a ausência de chuva purificadora como sinal do desagrado divino.
  rationale: O hebraico permite que as imagens de impureza, seca e juízo atuem juntas. A tradução preserva essa tensão sem reduzir a linguagem a uma explicação exclusivamente ritual, moral ou meteorológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Diga-lhe” preserva o referente feminino sem tornar a frase pesada; “recebeu chuva” traduz naturalmente a construção passiva rara. Os marcadores aparecem imediatamente após as expressões a que se referem.
