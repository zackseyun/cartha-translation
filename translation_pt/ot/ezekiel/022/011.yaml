  text: וְ/אִ֣ישׁ אֶת אֵ֣שֶׁת רֵעֵ֗/הוּ עָשָׂה֙ תּֽוֹעֵבָ֔ה וְ/אִ֥ישׁ אֶת כַּלָּת֖/וֹ טִמֵּ֣א בְ/זִמָּ֑ה וְ/אִ֛ישׁ אֶת אֲחֹת֥/וֹ בַת אָבִ֖י/ו עִנָּה בָֽ/ךְ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/011.yaml
  text: One man commits an abomination with his neighbor’s wife[a], another defiles his daughter-in-law with lewdness, and another violates his sister, his father’s daughter[c][b], within you.
translation:
  language: pt
  text: Um homem comete uma abominação com a mulher do seu próximo[a]; outro contamina sua nora com depravação sexual[b]; e outro viola sua irmã, filha de seu pai[c], em seu meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pratica com a mulher do seu próximo um ato detestável”. A expressão hebraica significa literalmente “faz uma abominação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com perversidade” ou “com conduta vergonhosa”. Neste contexto, o termo hebraico tem sentido sexual.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “humilha” ou “abusa de”. Em contexto sexual, o verbo hebraico pode indicar violação acompanhada de humilhação ou maus-tratos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: um homem... outro... outro
  rationale: A repetição do singular אִישׁ organiza uma lista de transgressores individuais; esta estrutura é natural em português e evita a repetição rígida de “e um homem”.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: a mulher do seu próximo
  rationale: רֵעַ pode designar próximo, companheiro ou semelhante. “Próximo” preserva a relação social e ecoa naturalmente a linguagem jurídica bíblica.
- source_word: עָשָׂה תּוֹעֵבָה
  choice: comete uma abominação com
  rationale: A expressão significa literalmente “faz uma abominação”. A tradução conserva o forte juízo moral do hebraico sem explicitar além do texto o ato sexual indicado pelo contexto.
- source_word: כַּלָּתוֹ
  choice: sua nora
  rationale: É o equivalente direto e corrente do termo hebraico de parentesco.
- source_word: טִמֵּא
  choice: contamina
  rationale: No contexto sexual, o verbo abrange impureza e corrupção moral. “Contamina” mantém essa sobreposição e soa mais natural aqui do que “torna impura”.
- source_word: בְּזִמָּה
  choice: com depravação sexual
  rationale: זִמָּה designa aqui conduta sexual perversa e vergonhosa. A explicitação “sexual” torna o sentido contextual claro sem suavizar sua força moral.
- source_word: אֲחֹתוֹ בַת אָבִיו
  choice: sua irmã, filha de seu pai
  rationale: Mantém a aposição jurídica e familiar do hebraico, sem decidir se a expressão necessariamente indica uma meia-irmã.
- source_word: עִנָּה
  choice: viola
  rationale: Em contexto sexual, ענה pode envolver abuso, humilhação e violação, não apenas relações sexuais. “Viola” preserva essa gravidade e a possível coerção.
- source_word: בָּךְ
  choice: no meio de você
  rationale: O pronome feminino singular se dirige à cidade de Jerusalém personificada. “No meio de você” é compreensível, conserva a interpelação direta e expressa que os atos ocorrem dentro dela.
theological_decisions:
- issue: Força moral e teológica da terminologia dos delitos sexuais
  choice: 'Manter linguagem ética forte: “abominação”, “contamina” e “viola”.'
  alternative: Empregar formulações mais eufemísticas, como “mantém relações” ou “age imoralmente”.
  rationale: O versículo denuncia grave corrupção pactual, familiar e social. Os termos hebraicos trazem forte condenação moral e, na última oração, provável sentido de abuso ou humilhação; suavizá-los reduziria indevidamente a tensão do texto.
- issue: Precisão da relação indicada por “filha de seu pai”
  choice: Preservar a formulação hebraica “sua irmã, filha de seu pai”.
  alternative: Traduzir interpretativamente como “sua meia-irmã por parte de pai”.
  rationale: A aposição identifica a relação incestuosa em linguagem de caráter jurídico, mas a tradução mais específica pode impor uma estrutura familiar que o verso não precisa resolver por si só.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção em série reproduz a acusação profética; a linguagem forte do hebraico é preservada sem acrescentar pormenores não expressos. Os marcadores aparecem junto aos termos a que se referem.
