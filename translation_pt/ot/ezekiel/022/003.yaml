  terminology: “Senhor DEUS” representa adequadamente אֲדֹנָי יְהוִה segundo a convenção adotada. “Ídolos” é apropriado para גִּלּוּלִים, embora não reproduza isoladamente sua carga depreciativa, a qual não precisa ser explicitada aqui.
