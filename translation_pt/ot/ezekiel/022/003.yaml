  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עִ֣יר שֹׁפֶ֥כֶת דָּ֛ם בְּ/תוֹכָ֖/הּ לָ/ב֣וֹא עִתָּ֑/הּ וְ/עָשְׂתָ֧ה גִלּוּלִ֛ים עָלֶ֖י/הָ לְ/טָמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/003.yaml
  text: 'And say, ‘Thus says the Lord GOD: O city that sheds blood in her midst, so that her time may come, and that makes idols against herself to defile herself!’'
translation:
  language: pt
  text: 'E diga: “Assim diz o Senhor DEUS: Ó cidade que derrama sangue dentro de si, para que chegue a sua hora, e que faz ídolos contra si mesma, para se contaminar!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִיר שֹׁפֶכֶת דָּם
  choice: Ó cidade que derrama sangue
  rationale: O particípio hebraico descreve a cidade por sua ação contínua; o vocativo com “Ó” reproduz naturalmente o tom de denúncia.
- source_word: בְּתוֹכָהּ
  choice: em seu próprio meio
  rationale: Expressa que o derramamento de sangue ocorre dentro da própria cidade e reforça sua responsabilidade interna.
- source_word: לָבוֹא עִתָּהּ
  choice: fazendo chegar a sua hora
  rationale: Preserva a construção final/causal e a ambiguidade de “hora” como tempo determinado, aqui implicitamente ligado ao juízo.
- source_word: גִלּוּלִים
  choice: ídolos
  rationale: Equivalente corrente e claro para o termo depreciativo de Ezequiel aplicado a imagens idolátricas.
- source_word: עָלֶיהָ
  choice: para si mesma
  rationale: No contexto, indica que a fabricação dos ídolos recai contra a própria cidade; esta formulação comunica o sentido reflexivo sem acrescentar uma interpretação extensa.
- source_word: לְטָמְאָה
  choice: contaminando-se
  rationale: Mantém o sentido de impureza cultual e moral e a relação resultante com a fabricação de ídolos.
theological_decisions:
- issue: Sentido de “sua hora”
  choice: Manter “a sua hora” sem explicitar “hora do juízo”
  alternative: “fazendo chegar a hora do seu castigo”
  rationale: O contexto aponta para juízo, mas o hebraico não traz aqui a palavra “castigo”; preservar a formulação evita resolver implicitamente o que o texto deixa condensado.
- issue: Forma do nome divino אֲדֹנָי יְהוִה
  choice: “Senhor DEUS”
  alternative: “Soberano SENHOR” ou “Senhor Yahweh”
  rationale: Distingue os dois elementos da fórmula hebraica e segue uma convenção portuguesa reconhecível, sem inserir uma preferência denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura profética e o tom acusatório foram preservados, evitando tanto literalismo áspero quanto explicitações interpretativas não presentes no hebraico.
