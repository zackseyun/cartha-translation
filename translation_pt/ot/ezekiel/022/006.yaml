  text: Look[a], the princes of Israel in you, each according to his power, were in you to shed blood.
translation:
  language: pt
  text: Eis que os príncipes de Israel, cada um conforme o seu poder[a], estavam em teu meio para derramar sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada um segundo o seu braço”. Em hebraico, “braço” pode representar força ou poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Veja
  rationale: Introduz enfaticamente a denúncia e chama a atenção do ouvinte, em linguagem portuguesa atual.
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: os príncipes de Israel
  rationale: Preserva a referência aos governantes de elevada posição e a linguagem política tradicional do contexto profético.
- source_word: אִישׁ לִזְרֹעוֹ
  choice: cada um segundo o seu poder
  rationale: אִישׁ tem função distributiva, e 'braço' é usado metonimicamente para força, poder ou capacidade de ação.
- source_word: הָיוּ בָךְ
  choice: estavam em seu meio
  rationale: Mantém o valor verbal passado e localiza os governantes dentro de Jerusalém, a cidade diretamente interpelada, evitando a formulação pouco natural 'em você'.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: para derramar sangue
  rationale: Reproduz de modo direto a construção de finalidade e conserva a imagem concreta e acusatória do hebraico.
