base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/027.yaml
  text: Her princes within her are like wolves tearing prey[a], to shed blood, to destroy lives[b], in order to gain dishonest profit.
translation:
  language: pt
  text: Os seus príncipes, no meio dela, são como lobos que dilaceram a presa, para derramar sangue e destruir vidas[a], a fim de obter lucro desonesto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruir pessoas” ou “destruir almas”; o termo hebraico néfesh pode indicar pessoa, vida ou alma, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “obter ganho injusto” ou “lucrar por extorsão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: os seus príncipes
  rationale: שַׂר pode designar príncipe, governante ou autoridade. “Príncipes” preserva o sentido político elevado da denúncia e mantém a personificação feminina da cidade.
- source_word: בְקִרְבָּהּ
  choice: no meio dela
  rationale: Reproduz de modo natural a localização interna expressa pelo hebraico e mantém a referência feminina à cidade.
- source_word: כִּזְאֵבִים
  choice: como lobos
  rationale: Expressa diretamente a comparação introduzida por כְּ.
- source_word: טֹרְפֵי טָרֶף
  choice: que dilaceram a presa
  rationale: A construção com particípio e objeto cognato intensifica a imagem predatória; “dilaceram a presa” comunica sua violência com clareza e dignidade.
- source_word: לִשְׁפָּךְ דָּם
  choice: para derramar sangue
  rationale: Preserva a construção infinitiva e o conhecido idioma hebraico para matar violentamente.
- source_word: לְאַבֵּד נְפָשׁוֹת
  choice: destruir vidas
  rationale: Neste contexto de sangue e violência pública, נְפָשׁוֹת se refere concretamente a vidas ou pessoas, sem exigir uma afirmação sobre a alma imaterial.
- source_word: לְמַעַן
  choice: a fim de
  rationale: Marca com clareza a finalidade ou motivação da violência.
- source_word: בְּצֹעַ בָּצַע
  choice: obter lucro desonesto
  rationale: O infinitivo com substantivo cognato destaca a busca gananciosa de vantagem obtida injustamente; a formulação é clara no português atual.
theological_decisions:
- issue: Sentido de נְפָשׁוֹת numa denúncia de violência
  choice: “vidas”, referindo-se às pessoas destruídas
  alternative: “almas” ou “pessoas”
  rationale: O contexto imediato trata de derramamento de sangue e violência praticada por governantes. “Vidas” preserva o sentido concreto sem introduzir uma definição doutrinária da constituição humana.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A repetição de duas expressões de finalidade — “para” e “a fim de” — mantém a progressão sintática do hebraico sem tornar a frase artificial. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
