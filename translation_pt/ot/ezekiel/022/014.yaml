source:
  edition: WLC
  text: הֲ/יַעֲמֹ֤ד לִבֵּ/ךְ֙ אִם תֶּחֱזַ֣קְנָה יָדַ֔יִ/ךְ לַ/יָּמִ֕ים אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה אוֹתָ֑/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/014.yaml
  text: Will your heart endure[a], or will your hands remain strong, in the days when I deal with you? I, Yahweh, have spoken, and I will do it.
translation:
  language: pt
  text: Seu coração resistirá[a], ou suas mãos continuarão fortes, nos dias em que eu agir contra você? Eu, Yahweh, falei e o farei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu coração permanecerá firme, ou suas mãos serão fortes, nos dias em que eu agir contra você?”'
    reason: Alternativa lexical que preserva mais literalmente o sentido de “ficar de pé” ou “permanecer” em עמד e a formulação simples de חזק.
lexical_decisions:
- source_word: הֲיַעֲמֹד
  choice: resistirá
  rationale: Embora עמד signifique literalmente “ficar de pé” ou “permanecer”, aqui a pergunta retórica trata da capacidade de suportar o juízo vindouro. “Resistirá” comunica esse sentido idiomático em português natural.
- source_word: לִבֵּךְ
  choice: seu coração
  rationale: Preserva a imagem antropológica hebraica do coração como sede da coragem e da determinação, em paralelo com “suas mãos”.
- source_word: תֶּחֱזַקְנָה יָדַיִךְ
  choice: suas mãos continuarão fortes
  rationale: Mantém a metáfora corporal e expressa a capacidade contínua de agir ou conservar forças diante do juízo.
- source_word: לַיָּמִים
  choice: nos dias
  rationale: A preposição tem valor temporal; “nos dias” reproduz de modo claro e digno a formulação hebraica.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ
  choice: em que eu agir contra você
  rationale: A construção hebraica é elíptica, literalmente próxima de “em que eu faço você”. No contexto de julgamento, indica ação divina dirigida contra Jerusalém; a tradução explicita essa direção sem inserir o termo mais específico “julgar”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: דִּבַּרְתִּי
  choice: falei
  rationale: O perfeito apresenta a declaração divina como já proferida e irrevogável. O pretérito perfeito é direto e solene em português.
- source_word: וְעָשִׂיתִי
  choice: e o farei
  rationale: Apesar da forma perfeita, a sequência profética assegura a realização futura daquilo que Yahweh declarou. “O farei” transmite a certeza do cumprimento.
theological_decisions:
- issue: Sentido da ação divina em אֲנִי עֹשֶׂה אוֹתָךְ
  choice: em que eu agir contra você
  alternative: quando eu tratar com você; quando eu julgar você
  rationale: O contexto indica uma ação punitiva de Yahweh contra a cidade personificada. “Agir contra” preserva a severidade e a direção da ação sem restringir o verbo ao vocabulário jurídico de “julgar”.
- issue: Valor temporal de וְעָשִׂיתִי
  choice: e o farei
  alternative: e o fiz; e agirei
  rationale: Na fórmula solene, o perfeito expressa a certeza do ato divino anunciado. O futuro em português comunica adequadamente que o cumprimento ainda ocorrerá, mas é irrevogável.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa é expressa por “você”, forma natural no Brasil, mantendo a referência feminina singular à cidade personificada sem acrescentar explicação ao versículo. As imagens hebraicas de “coração” e “mãos” foram preservadas.
