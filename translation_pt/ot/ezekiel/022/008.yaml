base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/008.yaml
  text: You have despised my holy things[a], and you have profaned my Sabbaths.
translation:
  language: pt
  text: Você desprezou as minhas coisas santas[a] e profanou os meus sábados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os meus santuários” ou “os meus lugares santos”. O hebraico pode referir-se mais especificamente a lugares sagrados, mas aqui foi traduzido de modo mais amplo como “as minhas coisas santas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדָשַׁי
  choice: as minhas coisas santas
  rationale: O plural com sufixo de primeira pessoa significa literalmente “minhas coisas santas”. A formulação mantém a amplitude do hebraico, sem restringir a referência ao santuário ou a lugares santos.
- source_word: בָּזִית
  choice: você desprezou
  rationale: O verbo expressa desprezo ou tratamento desdenhoso. “Desprezou” é direto, natural e conserva a força moral da acusação.
- source_word: שַׁבְּתֹתַי
  choice: os meus sábados
  rationale: O plural com sufixo de primeira pessoa é preservado. “Sábados” mantém a terminologia cultual e pactual do texto.
- source_word: חִלָּלְתְּ
  choice: profanou
  rationale: No contexto da santidade, o piel de חלל indica tratar como comum aquilo que é santo. “Profanou” é o equivalente português mais preciso.
theological_decisions:
- issue: Âmbito de קָדָשַׁי
  choice: referência ampla às coisas santas de Deus
  alternative: referência específica aos santuários, aos lugares santos ou ao templo de Deus
  rationale: O plural hebraico admite um sentido coletivo amplo. A tradução evita definir de modo indevido um referente específico, preservando ao mesmo tempo o contexto de santidade e culto em Ezequiel.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A segunda pessoa feminina singular do hebraico, dirigida à cidade, é vertida pelo “você” não marcado quanto ao gênero; a referência feminina decorre do contexto. A ordem paralela e a terminologia de santidade foram preservadas.
