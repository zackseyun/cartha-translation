  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “YHWH”; tradicionalmente traduzido como “SENHOR”.'
    reason: Registra a forma hebraica do nome divino e sua tradução tradicional.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: O wayyiqtol de היה integra a fórmula narrativa profética; em português natural, seu valor é incorporado à expressão «a palavra ... veio», sem o literalismo «e aconteceu».
- source_word: דְבַר
  choice: A palavra
  rationale: Na fórmula דְבַר יְהוָה, «a palavra» preserva a transparência lexical e o caráter estabelecido da revelação profética.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo pelo título tradicional «SENHOR».
- source_word: אֵלַי
  choice: a mim
  rationale: Equivalente direto e natural da preposição com sufixo de primeira pessoa singular.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala direta subsequente; «dizendo» mantém a cadência formal da fórmula profética.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o Tetragrama. «Yahweh» preserva o nome pessoal, sem substituí-lo por um título; a nota registra a tradição de vertê-lo como «SENHOR».
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A fórmula profética foi mantida de modo conciso. O conectivo hebraico inicial não foi representado por «e», pois aqui funciona como introdução sequencial e sua tradução explícita seria pouco natural no início isolado da seção.
