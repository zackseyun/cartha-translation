  text: וָ/אֲבַקֵּ֣שׁ מֵ/הֶ֡ם אִ֣ישׁ גֹּֽדֵר גָּדֵר֩ וְ/עֹמֵ֨ד בַּ/פֶּ֧רֶץ לְ/פָנַ֛/י בְּעַ֥ד הָ/אָ֖רֶץ לְ/בִלְתִּ֣י שַׁחֲתָ֑/הּ וְ/לֹ֖א מָצָֽאתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/030.yaml
  text: And I sought among them for a man who would build up a wall and stand in the breach before me on behalf of the land[a], so that I would not destroy it[b], but I found none.
translation:
  language: pt
  text: Procurei entre eles um homem que construísse um muro e se pusesse na brecha diante de mim em favor da terra, para que eu não a destruísse, mas não encontrei nenhum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲבַקֵּשׁ
  choice: Procurei
  rationale: בקש expressa procurar ou buscar. “Procurei” é natural no português atual e mantém o peso da busca divina no discurso profético.
- source_word: מֵהֶם
  choice: entre eles
  rationale: A preposição מן indica que o homem procurado deveria surgir dentre o grupo mencionado. “Entre eles” comunica isso com fluidez.
- source_word: אִישׁ
  choice: um homem
  rationale: Preserva o singular masculino do hebraico e sua possível força representativa, sem o neutralizar.
- source_word: גֹּדֵר גָּדֵר
  choice: que reconstruísse o muro
  rationale: A construção cognata descreve alguém que ergue ou repara uma barreira. No contexto de uma brecha, “reconstruísse o muro” torna explícita a restauração defensiva sem reproduzir de modo artificial a repetição hebraica.
- source_word: וְעֹמֵד בַּפֶּרֶץ
  choice: e se pusesse na brecha
  rationale: Mantém a imagem concreta de alguém tomando posição na abertura de um muro para protegê-lo, sem reduzir a expressão apenas à oração ou intercessão.
- source_word: לְפָנַי
  choice: diante de mim
  rationale: Tradução direta e idiomática da expressão de presença perante Deus.
- source_word: בְּעַד הָאָרֶץ
  choice: em favor da terra
  rationale: בְּעַד indica atuação em favor de alguém ou algo. A formulação preserva a dimensão representativa e deixa “terra” com sua amplitude contextual.
- source_word: לְבִלְתִּי שַׁחֲתָהּ
  choice: para que eu não a destruísse
  rationale: Expressa a finalidade ou prevenção indicada pela construção; o pronome feminino retoma “a terra”.
- source_word: וְלֹא מָצָאתִי
  choice: mas não encontrei nenhum
  rationale: “Mas” comunica naturalmente o contraste trágico, embora o hebraico use a conjunção comum; “nenhum” retoma de modo claro “um homem”.
theological_decisions:
- issue: Imagem de defesa e intervenção representativa
  choice: Preservar conjuntamente “muro”, “brecha”, “diante de mim” e “em favor da terra”.
  alternative: Explicitar somente a intercessão, como “alguém que orasse ou interviesse pela terra”.
  rationale: O hebraico combina a imagem concreta de defesa urbana com a atuação representativa perante Deus. A tradução mantém ambas as dimensões e não determina se a ação deve ser entendida exclusivamente como oração, liderança moral ou proteção cívica.
- issue: Gênero e número de אִישׁ
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: O substantivo hebraico é masculino singular e pode ter valor representativo. A tradução conserva essa forma sem acrescentar uma interpretação sobre a identidade ou função específica do homem procurado.
- issue: Referente e alcance de הָאָרֶץ
  choice: a terra
  alternative: o país; a nação
  rationale: “Terra” preserva a amplitude lexical de אֶרֶץ e evita restringir antecipadamente o referente político ou geográfico, embora no contexto se trate da terra sob juízo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe conserva o movimento da busca, da ação esperada e do resultado negativo. Não foram necessárias notas, pois “brecha” mantém de forma suficientemente clara a imagem hebraica e não há variante textual relevante a registrar.
