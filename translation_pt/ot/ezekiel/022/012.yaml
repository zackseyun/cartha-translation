  text: שֹׁ֥חַד לָֽקְחוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם נֶ֧שֶׁךְ וְ/תַרְבִּ֣ית לָקַ֗חַתְּ וַ/תְּבַצְּעִ֤י רֵעַ֨יִ/ךְ֙ בַּ/עֹ֔שֶׁק וְ/אֹתִ֣/י שָׁכַ֔חַתְּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/012.yaml
  text: In you they have taken bribes to shed blood; you have taken interest and profit[a], and you have extorted your neighbors by oppression, and you have forgotten me, declares the Lord GOD.
translation:
  language: pt
  text: Em você, aceitam subornos para derramar sangue; você cobra juros e acréscimos[a], explorou os seus próximos por meio da opressão e se esqueceu de mim — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “usura e acréscimo”. O hebraico emprega dois termos relacionados ao ganho proveniente de empréstimos: נֶשֶׁךְ, “juros”, e תַרְבִּית, “acréscimo”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: שֹׁחַד
  choice: subornos
  rationale: O substantivo designa suborno; o plural expressa naturalmente o caráter coletivo e repetido da acusação contra os habitantes da cidade.
- source_word: לָקְחוּ בָךְ
  choice: Em você, têm aceitado
  rationale: Mantém a mudança para a terceira pessoa do plural e a personificação de Jerusalém, dentro da qual seus habitantes praticam esses atos.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: para derramar sangue
  rationale: A construção indica finalidade e conserva a expressão bíblica clara para provocar morte violenta ou judicial.
- source_word: נֶשֶׁךְ
  choice: juros
  rationale: É o equivalente moderno mais claro para o encargo cobrado sobre empréstimos, aqui condenado em contexto de exploração.
- source_word: תַרְבִּית
  choice: lucro
  rationale: Designa ganho ou aumento obtido por empréstimo e, ao lado de 'juros', preserva os dois termos correlatos do hebraico sem linguagem excessivamente técnica.
- source_word: לָקַחַתְּ
  choice: você tem cobrado ... e obtido
  rationale: A forma feminina singular retoma Jerusalém personificada; o perfeito composto apresenta as ações como práticas reiteradas que fundamentam a acusação.
- source_word: וַתְּבַצְּעִי רֵעַיִךְ בָּעֹשֶׁק
  choice: tem conseguido ganhos à custa dos seus próximos por meio da opressão
  rationale: Expressa o ganho injusto do verbo בצע, identifica as vítimas como membros próximos da comunidade e mantém o valor instrumental de בָּעֹשֶׁק.
- source_word: וְאֹתִי שָׁכַחַתְּ
  choice: e de mim se esqueceu
  rationale: A colocação de 'de mim' antes do verbo preserva a ênfase do objeto antecipado no hebraico e o clímax da denúncia.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: Reproduz a fórmula profética e distingue אֲדֹנָי, 'Senhor', do nome divino יהוה, transliterado como 'Yahweh'.
theological_decisions:
- issue: Representação do nome divino יהוה na fórmula אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: A tradução mantém tanto o título אֲדֹנָי quanto o nome de aliança יהוה, sem substituir o nome por outro título nem fundir os dois elementos.
- issue: Relação entre exploração econômica e esquecimento de Deus
  choice: Preservar a sequência acusatória sem explicar causalidade
  alternative: Explicitar que o esquecimento de Deus é a causa dos abusos
  rationale: O texto coloca o esquecimento de Deus como clímax, mas não formula explicitamente uma relação causal; a tradução conserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A alternância do plural ('têm aceitado') para o singular feminino dirigido à cidade ('você tem cobrado') foi preservada. A fórmula final usa 'declaração' para manter concisão profética.
