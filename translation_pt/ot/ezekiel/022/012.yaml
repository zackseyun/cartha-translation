revisions:
- from: Em você, têm aceitado subornos para derramar sangue; você tem cobrado juros e obtido lucro[a], tem conseguido ganhos à custa dos seus próximos por meio da opressão e de mim se esqueceu — declaração do Senhor Yahweh.
  to: Em você, aceitam subornos para derramar sangue; você cobra juros e acréscimos[a], explorou os seus próximos por meio da opressão e se esqueceu de mim — declara o Senhor Yahweh.
  rationale: A revisão conserva a acusação dirigida aos habitantes da cidade no início e à Jerusalém personificada no restante do versículo. Substitui uma perífrase interpretativa por «explorou os seus próximos», torna explícito o caráter correlato de «juros e acréscimos» e adota uma fórmula oracular portuguesa mais natural. Não resolve além do necessário a extensão semântica dos termos de empréstimo; a nota mantém «usura e acréscimo» como alternativa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:41:43Z'
review_pass:
  verdict: revise
  source_fidelity: A estrutura acusatória e a alternância entre os habitantes de Jerusalém no plural e a cidade personificada no singular foram preservadas. Contudo, «tem conseguido ganhos à custa dos seus próximos» enfraquece e reformula excessivamente o verbo בצע, que aqui descreve exploração injusta dos próximos, e «obtido lucro» não representa com precisão o segundo termo financeiro como ganho/acréscimo de empréstimo.
  naturalness: O texto é em geral compreensível, mas «declaração do Senhor Yahweh» é menos idiomático como fórmula profética em português do que «declara o Senhor Yahweh». «Explorou os seus próximos por meio da opressão» é mais direto, natural e próximo da construção hebraica.
  terminology: «Subornos», «derramar sangue», «juros», «opressão» e «Senhor Yahweh» são adequados. Para o par נֶשֶׁךְ/תַרְבִּית, «juros e acréscimos» mantém melhor a distinção lexical e o campo de ganho obtido em empréstimos; a nota explica a alternativa «usura e acréscimo».
  issues:
  - severity: medium
    issue: «tem conseguido ganhos à custa dos seus próximos» para וַתְּבַצְּעִי רֵעַיִךְ
    rationale: A expressão portuguesa desloca o foco para o ganho da cidade e torna indireto o objeto humano. No contexto, בצע denota obter ganho injusto explorando alguém; «explorou os seus próximos» comunica mais diretamente a ação contra os próximos e conserva a opressão como meio.
  - severity: medium
    issue: «obtido lucro» para תַרְבִּית
    rationale: Embora possível de modo amplo, «lucro» pode sugerir qualquer rendimento e perde a ligação específica com aumento/ganho de empréstimo, reforçada pelo paralelismo com נֶשֶׁךְ. «Acréscimos» preserva melhor o pareamento sem impor a noção moderna e restrita de usura excessiva.
  - severity: low
    issue: «declaração do Senhor Yahweh»
    rationale: É compreensível, mas soa nominal e menos fluente como fecho oracular. «Declara o Senhor Yahweh» reproduz naturalmente a fórmula נְאֻם e mantém ambos os elementos do nome divino.
