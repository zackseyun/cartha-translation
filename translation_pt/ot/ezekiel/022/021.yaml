base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/021.yaml
  text: I will gather you[a], and I will blow on you with the fire of my wrath, and you will be melted within it.
translation:
  language: pt
  text: Eu reunirei vocês, soprarei sobre vocês com o fogo da minha ira, e vocês serão derretidos dentro dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio dela”. O pronome feminino pode se referir à cidade no contexto mais amplo ou à fornalha no quadro metafórico da fundição.'
    reason: Leitura alternativa e referente pronominal ambíguo.
lexical_decisions:
- source_word: כִנַּסְתִּי
  choice: reunirei
  rationale: O verbo descreve a ação de ajuntar o povo para o juízo e dá continuidade à imagem da fundição. “Reunirei” é claro e não acrescenta uma interpretação além do texto.
- source_word: נָפַחְתִּי עֲלֵיכֶם
  choice: soprarei sobre vocês
  rationale: Preserva a imagem concreta de soprar para intensificar o fogo de uma fornalha, além de representar de modo natural a preposição עַל.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: com o fogo da minha ira
  rationale: “Com” expressa adequadamente o valor instrumental da construção, enquanto “ira” mantém a força e a dignidade de עֶבְרָה.
- source_word: נִתַּכְתֶּם
  choice: vocês serão derretidos
  rationale: No contexto da metalurgia, o verbo indica que o metal se torna líquido. A forma passiva mantém a voz do hebraico e a ação do juízo divino.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: A expressão conserva o pronome feminino singular sem identificar de modo definitivo seu referente, permitindo que permaneça a sobreposição entre a cidade e a fornalha.
theological_decisions:
- issue: Referente do sufixo feminino em בְּתוֹכָהּ
  choice: Manter o pronome genérico em “no meio dela”
  alternative: Explicitar “no meio da cidade” ou “dentro da fornalha”
  rationale: O contexto entrelaça Jerusalém e a imagem de uma fornalha. Não especificar o referente preserva a ambiguidade e a tensão da metáfora profética.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível. A repetição de “vocês” evita a possível ambiguidade de formas pronominais e mantém explícitos os destinatários plurais.
