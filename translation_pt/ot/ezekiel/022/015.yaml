  text: וַ/הֲפִיצוֹתִ֤י אוֹתָ/ךְ֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֖י/ךְ בָּ/אֲרָצ֑וֹת וַ/הֲתִמֹּתִ֥י טֻמְאָתֵ֖/ךְ מִמֵּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/015.yaml
  text: I will scatter you among the nations and disperse you through the lands[a], and I will purge your uncleanness from you.
translation:
  language: pt
  text: Eu te espalharei entre as nações e te dispersarei pelas terras, e porei fim à tua impureza em ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “removerei de ti a tua impureza”.'
    reason: A construção com תמם e מִן pode salientar tanto o fim completo da impureza quanto sua remoção da cidade personificada.
lexical_decisions:
- source_word: וַהֲפִיצוֹתִי
  choice: Eu a espalharei
  rationale: O verbo expressa dispersão em contexto de juízo e exílio. O pronome feminino preserva a referência à cidade personificada.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Refere-se às nações estrangeiras entre as quais Jerusalém seria dispersa; é uma formulação natural e não sobrecarregada teologicamente.
- source_word: וְזֵרִיתִיךְ
  choice: e a dispersarei
  rationale: זרה pode significar espalhar, dispersar ou joeirar. “Dispersarei” mantém o paralelismo sem repetir exatamente o verbo anterior.
- source_word: בָּאֲרָצוֹת
  choice: por outras terras
  rationale: O plural indica diversos territórios ou países. “Outras” explicita naturalmente em português o deslocamento para fora da própria terra, sem alterar o sentido contextual.
- source_word: וַהֲתִמֹּתִי
  choice: assim, eliminarei
  rationale: A forma causativa de תמם indica levar ao fim ou remover por completo. “Eliminarei” preserva a ideia de extinção da impureza sem definir o mecanismo além do juízo descrito.
- source_word: טֻמְאָתֵךְ
  choice: a sua impureza
  rationale: טֻמְאָה pode abranger impureza moral e ritual. “Impureza” é atual, digna e mantém essa amplitude.
- source_word: מִמֵּךְ
  choice: de você
  rationale: A preposição indica remoção a partir da pessoa ou cidade interpelada.
theological_decisions:
- issue: Natureza da purificação efetuada pelo juízo
  choice: “eliminarei de você a sua impureza” apresenta o exílio-julgamento como ocasião da remoção da impureza, sem restringi-la ao âmbito moral ou ritual.
  alternative: “porei fim à sua impureza em você” ou “consumirei a sua impureza”
  rationale: A cláusula hebraica admite nuances entre acabar com, consumir e remover a impureza. A tradução conserva a tensão entre punição e purificação sem impor uma explicação doutrinária mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A cidade é tratada no feminino (“a”), em conformidade com a personificação hebraica. O conectivo “assim” torna explícita a relação contextual entre dispersão judicial e eliminação da impureza.
