  naturalness: O registro é claro e moderno. Porém, a alternância entre os pronomes de terceira pessoa (“a”) e de segunda pessoa (“você”) para a mesma cidade personificada é inconsistente. A revisão conserva a interlocução direta do hebraico com “te”.
  terminology: “Nações”, “dispersarei” e “impureza” são escolhas fiéis e naturais. “Eliminar” é defensável para a forma causativa de תמם; “porei fim” expressa de modo mais idiomático a ideia de fazer cessar, preservando a ambiguidade entre cessação e remoção.
  issues:
