    rationale: O texto-fonte coordena as ações com “e”; “assim” torna explícita uma inferência causal/consecutiva que convém não acrescentar.
  - severity: medium
    issue: Alternância entre “a” e “você”
    rationale: Os pronomes mudam a perspectiva gramatical para a mesma destinatária. “Te” mantém a segunda pessoa do discurso profético e evita a inconsistência.
