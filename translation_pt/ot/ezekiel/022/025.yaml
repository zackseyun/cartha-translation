base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/025.yaml
  text: 'A conspiracy of her prophets is in her midst[a], like a roaring lion tearing prey: they have devoured lives, they take wealth and precious things, they have multiplied her widows in her midst.'
translation:
  language: pt
  text: 'Há uma conspiração dos profetas dela no meio dela, como um leão que ruge e dilacera a presa: eles devoraram vidas[a], tomam riquezas e coisas preciosas e multiplicaram as viúvas dela no meio dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devoraram pessoas”; mais literalmente, “devoraram almas”. O hebraico néfesh muitas vezes se refere a um ser vivo ou à vida, e não apenas à alma imaterial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁר
  choice: conspiração
  rationale: O substantivo indica uma aliança conspiratória ou trama hostil; “conspiração” comunica a ação coordenada e criminosa.
- source_word: נְבִיאֶיהָ
  choice: os profetas dela
  rationale: Preserva a relação possessiva com a cidade personificada sem sugerir que sejam profetas legitimamente enviados por Deus.
- source_word: בְּתוֹכָהּ
  choice: em seu meio
  rationale: Mantém o idioma hebraico e a repetição que emoldura o versículo.
- source_word: כַּאֲרִי שׁוֹאֵג טֹרֵף טָרֶף
  choice: Como um leão que ruge enquanto dilacera a presa
  rationale: Reproduz a imagem predatória e relaciona naturalmente as ações simultâneas expressas pelos particípios hebraicos.
- source_word: נֶפֶשׁ אָכָלוּ
  choice: eles devoram vidas
  rationale: נֶפֶשׁ designa aqui vidas ou pessoas vivas; “vidas” mantém a metáfora sem impor o sentido técnico de alma imaterial.
- source_word: חֹסֶן וִיקָר
  choice: riquezas e coisas preciosas
  rationale: No contexto de saque, os termos se referem a bens materiais valiosos; a formulação conserva o paralelismo amplo.
- source_word: יִקָּחוּ
  choice: tomam
  rationale: O imperfeito descreve uma ação característica; o contexto predatório já comunica violência, sem exigir explicitação por “saqueiam”.
- source_word: אַלְמְנוֹתֶיהָ הִרְבּוּ
  choice: multiplicam as viúvas dela
  rationale: 'Preserva a formulação contundente do hebraico: a violência deles aumenta o número de viúvas na cidade.'
theological_decisions:
- issue: Sentido de נֶפֶשׁ no contexto de juízo
  choice: vidas
  alternative: pessoas; almas
  rationale: A denúncia trata de violência mortal e exploração, não formula uma afirmação técnica sobre a alma imaterial. “Vidas” conserva a amplitude concreta do termo.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do hebraico. “Os profetas dela” favorece clareza no português brasileiro e mantém a cidade personificada; a repetição de “em seu meio” foi preservada deliberadamente.
