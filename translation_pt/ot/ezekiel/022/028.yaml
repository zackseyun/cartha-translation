  source_fidelity: A tradução preserva a estrutura acusatória, a referência aos profetas da cidade, a atividade visionária e divinatória falsa e o nome Yahweh. Contudo, “rebocaram para eles com cal” deixa o verbo sem complemento natural em português e não comunica com clareza a imagem de uma camada superficial aplicada para encobrir defeitos. A relação adversativa final também fica mais fiel e clara com “mas Yahweh não falou”.
  naturalness: “Rebocaram para eles com cal” é pouco idiomático; “aplicaram uma camada de cal” preserva a metáfora e é compreensível em português internacional. “O Senhor Yahweh” é um equivalente mais direto de אֲדֹנָי יְהוִה do que “o Soberano Yahweh”.
  terminology: Mantém-se “Yahweh” para o tetragrama. “O Senhor Yahweh” traduz o título divino composto sem ocultar o nome próprio. “Camada de cal” representa de modo claro o revestimento/caiação enganoso; a nota conserva alternativas legítimas para תָּפֵל.
