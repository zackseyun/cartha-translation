source:
  edition: WLC
  text: וּ/נְבִיאֶ֗י/הָ טָח֤וּ לָ/הֶם֙ תָּפֵ֔ל חֹזִ֣ים שָׁ֔וְא וְ/קֹסְמִ֥ים לָ/הֶ֖ם כָּזָ֑ב אֹמְרִ֗ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וַֽ/יהוָ֖ה לֹ֥א דִבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/028.yaml
  text: And her prophets have plastered for them with whitewash[a], seeing falsehood and divining lies for them, saying[b], ‘Thus says the Lord GOD,’ when Yahweh has not spoken.
translation:
  language: pt
  text: 'E os profetas dela lhes aplicaram uma camada de cal[a], tendo visões falsas e adivinhando mentiras para eles, dizendo: “Assim diz o Senhor Yahweh”, mas Yahweh não falou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com argamassa sem liga” ou “com reboco frágil”. A imagem hebraica é a de um revestimento enganoso que encobre defeitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְבִיאֶיהָ
  choice: E os profetas dela
  rationale: O plural construto com sufixo feminino singular se refere aos profetas da cidade; a formulação preserva claramente essa referência.
- source_word: טָחוּ לָהֶם תָּפֵל
  choice: rebocaram para eles com cal
  rationale: Mantém a metáfora de aplicar um revestimento enganoso, sem acrescentar ao verbo uma ideia ausente no hebraico.
- source_word: חֹזִים שָׁוְא
  choice: tendo visões falsas
  rationale: No contexto profético, חזה designa a atividade visionária, enquanto שָׁוְא indica falsidade, vazio ou engano.
- source_word: וְקֹסְמִים לָהֶם כָּזָב
  choice: e adivinhando mentiras para eles
  rationale: Distingue a adivinhação da profecia em geral e conserva o valor explícito de falsidade de כָּזָב.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Preserva a fórmula profética reconhecível e sua cadência solene.
- source_word: אֲדֹנָי יְהוִה
  choice: o Soberano Yahweh
  rationale: Evita a combinação pouco natural 'Senhor Yahweh', distingue אֲדֹנָי do nome divino e preserva o sentido de autoridade soberana.
- source_word: וַיהוָה לֹא דִבֵּר
  choice: quando Yahweh não falou
  rationale: Conserva o nome divino e traduz o perfeito de modo direto, salientando que a alegada mensagem não procedeu de Yahweh.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega explicitamente o tetragrama; a transliteração preserva o nome próprio e evita ocultá-lo sob um título.
- issue: Sentido da imagem תָּפֵל
  choice: cal
  alternative: argamassa sem liga / reboco frágil
  rationale: A expressão descreve um revestimento superficial e enganoso; 'cal' comunica essa imagem com clareza, enquanto a nota preserva as alternativas lexicais.
- issue: Fórmula אֲדֹנָי יְהוִה
  choice: o Soberano Yahweh
  alternative: o Senhor DEUS / Senhor Yahweh
  rationale: A opção expressa אֲדֹנָי como título de autoridade sem substituir יהוה nem produzir uma repetição artificial.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe mantém o paralelismo acusatório do hebraico; a segunda oração foi separada para evitar um período excessivamente carregado.
