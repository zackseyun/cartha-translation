    issue: «atiçar o fogo sobre eles»
    rationale: O hebraico לָפַחַת עָלָיו אֵשׁ descreve soprar fogo sobre/contra o objeto no forno. «Atiçar o fogo» faz do fogo aquilo que é intensificado e torna «sobre eles» sintaticamente e imageticamente menos fiel.
  - severity: low
    issue: «eu os porei ali»
    rationale: O verbo וְהִנַּחְתִּי pode ser traduzido por «os porei/colocarei», mas «ali» não tem correspondente expresso no hebraico. O contexto permite inferi-lo, porém não é necessário para uma tradução de equivalência ótima.
