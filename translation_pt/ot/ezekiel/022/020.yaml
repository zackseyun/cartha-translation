  text: קְבֻ֣צַת כֶּ֡סֶף וּ֠/נְחֹשֶׁת וּ/בַרְזֶ֨ל וְ/עוֹפֶ֤רֶת וּ/בְדִיל֙ אֶל תּ֣וֹךְ כּ֔וּר לָ/פַֽחַת עָלָ֥י/ו אֵ֖שׁ לְ/הַנְתִּ֑יךְ כֵּ֤ן אֶקְבֹּץ֙ בְּ/אַפִּ֣/י וּ/בַ/חֲמָתִ֔/י וְ/הִנַּחְתִּ֥י וְ/הִתַּכְתִּ֖י אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/020.yaml
  text: As silver and bronze and iron and lead and tin are gathered into the midst of a furnace[a], to blow fire on it in order to melt it, so I will gather you in my anger and in my wrath[b], and I will place you there and melt you.
translation:
  language: pt
  text: Assim como prata, bronze[a], ferro, chumbo e estanho são ajuntados no meio de uma fornalha, para soprar fogo sobre eles e derretê-los, assim eu ajuntarei vocês na minha ira e no meu furor e os porei e derreterei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”.
    reason: lexical_alternative
  - marker: b
    text: O verbo mantém a metáfora da fornalha e também pode ser traduzido como “os fundirei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְבֻצַת
  choice: Assim como se ajuntam
  rationale: O substantivo verbal introduz, em correlação com כֵּן, a comparação metalúrgica. A formulação verbal em português comunica naturalmente esse valor sem acrescentar um agente indefinido.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Em listas bíblicas de metais, o termo frequentemente designa bronze, embora 'cobre' continue sendo uma possibilidade lexical legítima.
- source_word: אֶל תּוֹךְ כּוּר
  choice: no meio da fornalha
  rationale: Preserva a ideia de interior expressa por תּוֹךְ e traduz כּוּר como a fornalha usada para fundir metais.
- source_word: לָפַחַת עָלָיו אֵשׁ
  choice: para atiçar o fogo sobre eles
  rationale: Expressa a ação de soprar ou intensificar o fogo contra a massa de metais; o plural retoma de modo natural os metais enumerados.
- source_word: לְהַנְתִּיךְ
  choice: derretê-los
  rationale: O causativo de נתך descreve fazer os metais derreterem; 'derreter' é claro e mantém a imagem concreta.
- source_word: בְּאַפִּי וּבַחֲמָתִי
  choice: na minha ira e no meu furor
  rationale: Mantém dois termos distintos e a intensificação da indignação divina presente no hebraico.
- source_word: וְהִנַּחְתִּי
  choice: eu os porei ali
  rationale: No encadeamento da metáfora, o verbo indica colocar ou deixar os destinatários no lugar figurado da fornalha; 'porei ali' torna explícito o destino contextual sem suavizar o juízo.
- source_word: וְהִתַּכְתִּי אֶתְכֶם
  choice: e os derreterei
  rationale: Retoma a linguagem da fundição e aplica diretamente aos destinatários a severa imagem de juízo.
theological_decisions:
- issue: Força da metáfora de juízo
  choice: 'Manter a imagem punitiva da fornalha: ''eu os derreterei''.'
  alternative: Traduzir de forma interpretativa como 'eu os purificarei' ou 'eu os provarei'.
  rationale: O contexto imediato enfatiza o juízo contra Jerusalém. 'Purificar' introduziria uma finalidade positiva que este versículo não declara e reduziria a tensão da metáfora.
- issue: Referente pronominal na primeira metade
  choice: Usar 'eles/os' para os metais e 'vocês/os' para os destinatários.
  alternative: Empregar formas impessoais ou repetir todos os substantivos.
  rationale: A distinção pronominal torna clara a passagem da comparação para sua aplicação, sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Vocês' representa com clareza o plural de segunda pessoa; a repetição de 'ira' e 'furor' preserva a intensidade hebraica. Todos os marcadores de nota aparecem no texto.
