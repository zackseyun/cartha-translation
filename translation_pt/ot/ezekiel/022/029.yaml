reference: Ezekiel 22:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: עַ֤ם הָ/אָ֨רֶץ֙ עָ֣שְׁקוּ עֹ֔שֶׁק וְ/גָזְל֖וּ גָּזֵ֑ל וְ/עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנ֔וּ וְ/אֶת הַ/גֵּ֥ר עָשְׁק֖וּ בְּ/לֹ֥א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/029.yaml
  text: The people of the land have practiced oppression and committed robbery; they have mistreated the poor and needy[a], and they have oppressed the foreigner without justice.
translation:
  language: pt
  text: O povo da terra tem praticado a opressão e cometido roubos; tem maltratado o pobre e o necessitado e oprimido o estrangeiro[a], negando-lhe justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o residente estrangeiro”. O termo hebraico se refere a uma pessoa de origem estrangeira que vivia entre o povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: o povo da terra
  rationale: Preserva de modo natural a expressão hebraica e, no contexto de Ezequiel, refere-se amplamente à população da terra, sem restringi-la a uma classe técnica.
- source_word: עָשְׁקוּ עֹשֶׁק
  choice: tem praticado a opressão
  rationale: A construção cognata verbo-substantivo intensifica e caracteriza a conduta; esta formulação portuguesa evita repetição artificial sem perder a força contínua.
- source_word: וְגָזְלוּ גָּזֵל
  choice: e cometido roubos
  rationale: A segunda construção cognata descreve atos flagrantes de apropriação violenta ou ilícita; 'cometido roubos' é claro e idiomático.
- source_word: וְעָנִי וְאֶבְיוֹן
  choice: o pobre e o necessitado
  rationale: Mantém as duas designações hebraicas de pessoas social e economicamente vulneráveis, em linguagem atual e digna.
- source_word: הוֹנוּ
  choice: tem maltratado
  rationale: O Hifil comunica tratamento abusivo ou explorador; 'maltratado' mantém essa amplitude e não o confunde com עשק.
- source_word: הַגֵּר
  choice: o estrangeiro
  rationale: Designa uma pessoa de origem estrangeira que reside entre o povo. 'Estrangeiro' é moderno e legível, enquanto a nota explicita o caráter residente.
- source_word: עָשְׁקוּ
  choice: oprimido
  rationale: Preserva a ligação lexical com a opressão mencionada no início e expressa exploração social concreta.
- source_word: בְּלֹא מִשְׁפָּט
  choice: negando-lhe justiça
  rationale: Expressa idiomaticamente a ausência de justiça ou direito indicada pelo hebraico, relacionando-a com clareza ao estrangeiro, sem reduzir משפט a mero procedimento jurídico.
theological_decisions:
- issue: Terminologia social e ética na denúncia profética
  choice: Manter categorias concretas de opressão, roubo, maus-tratos e negação de justiça.
  alternative: Generalizar como maldade ou comportamento injusto.
  rationale: O texto denuncia violações sociais específicas e não apenas uma culpa moral genérica; a tradução conserva essa concretude e a tensão ética do original.
- issue: Sentido de בְּלֹא מִשְׁפָּט
  choice: negando-lhe justiça
  alternative: sem direito; sem julgamento; injustamente
  rationale: No contexto, מִשְׁפָּט abrange a ordem justa e o direito devido. A opção escolhida é natural em português e evita limitar o sentido a um processo judicial formal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e direto. O paralelismo acusatório foi mantido, com tempos verbais coordenados e terminologia social concreta.
