source:
  edition: WLC
  text: וָ/אֶשְׁפֹּ֤ךְ עֲלֵי/הֶם֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י כִּלִּיתִ֑י/ם דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/031.yaml
  text: So I poured out my indignation on them[a]; with the fire of my wrath I consumed them. I have put their way on their own heads[c][b], declares the Lord GOD.
translation:
  language: pt
  text: Por isso, derramei sobre eles a minha indignação; com o fogo da minha ira, eu os consumi. Fiz recair sobre a cabeça deles a sua própria conduta[a], declara o Senhor Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Pus o caminho deles sobre a cabeça deles”, expressão que indica que as consequências da conduta deles recaíram sobre eles mesmos.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: אֲדֹנָי יְהוִה (Adonai YHWH), aqui traduzido como “Senhor Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: derramei
  rationale: Preserva a metáfora direta de שׁפך para a ira divina e soa natural em português.
- source_word: זַעְמִי
  choice: a minha indignação
  rationale: זַעַם expressa ira moral e judicial; “indignação” mantém essa força melhor que o termo mais genérico “raiva”.
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: com o fogo da minha ira
  rationale: Mantém a imagem do fogo e o valor instrumental da preposição; “ira” é corrente, digna e forte.
- source_word: כִּלִּיתִים
  choice: eu os consumi
  rationale: O piel de כלה pode significar consumir ou destruir; “consumi” combina com a imagem imediatamente anterior do fogo.
- source_word: דַּרְכָּם
  choice: a sua própria conduta
  rationale: דֶּרֶךְ é singular coletivo e, neste contexto, refere-se ao modo de viver; “conduta” comunica naturalmente o sentido metafórico.
- source_word: בְּרֹאשָׁם נָתַתִּי
  choice: Fiz recair sobre a cabeça deles
  rationale: Reproduz de modo inteligível a imagem hebraica de retribuição, na qual a própria conduta retorna sobre os responsáveis.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: “Declara” representa a fórmula profética נְאֻם; “Senhor Yahweh” distingue אֲדֹנָי do nome divino יְהוִה sem produzir a repetição “Senhor SENHOR”.
- source_word: יְהוִה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico e evita ocultá-lo sob um título.
theological_decisions:
- issue: Linguagem do juízo divino
  choice: Manter a linguagem pessoal e severa da indignação, da ira e da retribuição divina.
  alternative: Abrandar com termos como “desagrado” ou explicitar apenas uma punição impessoal.
  rationale: O hebraico atribui diretamente a Deus tanto a ira judicial quanto o ato de fazer a conduta do povo recair sobre ele; suavizar isso reduziria a força do oráculo.
- issue: Relação entre conduta e consequência
  choice: Preservar a imagem retributiva de a própria conduta recair sobre a cabeça deles.
  alternative: Parafrasear inteiramente como “dei-lhes o castigo que mereciam”.
  rationale: A formulação escolhida mantém a tensão e a imagem profética sem impor uma explicação teológica mais ampla do mecanismo do juízo.
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR; Senhor Deus; Senhor, o SENHOR
  rationale: A escolha representa separadamente o título אֲדֹנָי e o nome próprio יְהוִה, mantendo visível o nome divino do original.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem das duas primeiras orações segue o hebraico. “Por isso” traduz o valor consequencial de וָ no contexto imediato, enquanto “eu” antes de “os consumi” favorece ritmo e clareza. A expressão idiomática final foi tornada natural sem eliminar a imagem da cabeça.
