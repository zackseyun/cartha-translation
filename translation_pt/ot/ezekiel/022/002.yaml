  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/תִשְׁפֹּ֥ט הֲ/תִשְׁפֹּ֖ט אֶת עִ֣יר הַ/דָּמִ֑ים וְ/ה֣וֹדַעְתָּ֔/הּ אֵ֖ת כָּל תּוֹעֲבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/002.yaml
  text: And you[a], son of man, will you judge, will you judge the bloody city? Then make known to her all her abominations.
translation:
  language: pt
  text: E você, filho do homem, julgará, julgará a cidade sanguinária[a]? Então, dê-lhe a conhecer todas as suas abominações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cidade de derramamento de sangue» ou «cidade culpada de sangue»; literalmente, «cidade de sangues».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Preserva a forma do tratamento divino recorrente dirigido a Ezequiel e seu sentido humano, mantendo a consistência ao longo do livro.
- source_word: הֲתִשְׁפֹּט הֲתִשְׁפֹּט
  choice: julgará, julgará
  rationale: A repetição conserva a ênfase retórica deliberada do hebraico; a interrogação é expressa pela pontuação da frase.
- source_word: עִיר הַדָּמִים
  choice: a cidade de sangue
  rationale: Reproduz de perto a expressão hebraica e mantém sua força profética, podendo abranger tanto derramamento de sangue quanto culpa de sangue.
- source_word: וְהוֹדַעְתָּהּ
  choice: Então faça-a conhecer
  rationale: Expressa o valor causativo do hifil de ידע e toma a conjunção como progressão discursiva após a pergunta retórica.
- source_word: כָּל תּוֹעֲבוֹתֶיהָ
  choice: todas as suas abominações
  rationale: Preserva tanto a totalidade de כָּל quanto o forte peso moral e cultual de תּוֹעֵבָה.
theological_decisions:
- issue: Sentido de אָדָם em בֶן אָדָם
  choice: filho do homem
  alternative: mortal; ser humano
  rationale: Trata-se do título vocativo característico aplicado ao profeta; a forma tradicional reflete diretamente o idioma hebraico sem identificar aqui a expressão com um título cristológico.
- issue: Alcance de עִיר הַדָּמִים
  choice: cidade de sangue
  alternative: cidade sanguinária; cidade de derramamento de sangue; cidade culpada de sangue
  rationale: A formulação mais literal preserva a tensão entre violência efetiva e culpa decorrente do sangue derramado, em vez de limitar a expressão a apenas uma dessas ideias.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura retórica próxima do hebraico. A repetição verbal foi mantida por ser enfática; “abominações” conserva o registro profético e teológico do termo-fonte.
