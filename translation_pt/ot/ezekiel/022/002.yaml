  source_fidelity: A repetição interrogativa de הֲתִשְׁפֹּט é preservada, assim como o vocativo «filho do homem», a totalidade de «todas» e o peso de «abominações». Contudo, «cidade de sangue» é um decalque pouco idiomático em português para עִיר הַדָּמִים; o hebraico usa «sangues» como expressão de derramamento de sangue e/ou culpa de sangue.
  naturalness: «E você» é adequado ao português moderno de ampla compreensão. «Faça-a conhecer» é gramatical, mas soa rígido e pouco natural neste contexto; «dê-lhe a conhecer» expressa com clareza o sentido causativo e mantém registro profético digno.
  terminology: «Filho do homem» deve ser mantido como o tratamento característico de Ezequiel. «Cidade sanguinária» é uma formulação portuguesa natural para uma cidade marcada por violência homicida, enquanto a nota preserva as alternativas de derramamento e culpa de sangue. «Abominações» é apropriado para תּוֹעֲבוֹת.
