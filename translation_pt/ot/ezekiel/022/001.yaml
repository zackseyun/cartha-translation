  text: And the word of Yahweh came to me[a], saying,
translation:
  language: pt
  text: 'E a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico YHWH, tradicionalmente traduzido por “SENHOR”.
    reason: Identifica o Tetragrama e sua tradução tradicional; “Yahweh” é a forma empregada no texto.
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Na fórmula profética, a construção narrativa com היה é expressa naturalmente em português por “veio”, sem o peso desnecessário de “aconteceu que”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na expressão construta דְבַר יְהוָה, “a palavra” preserva a fórmula recorrente de revelação profética e mantém maior proximidade formal que “a mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Reproduz diretamente a direção da palavra ao profeta, em português atual e digno.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo introduz a fala direta que vem no versículo seguinte; “dizendo” conserva de modo claro a fórmula hebraica.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz explicitamente o Tetragrama. “Yahweh” preserva o nome próprio e a distinção entre nome e título, enquanto a nota registra a tradição de vertê-lo por “SENHOR”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A ordem da fórmula profética foi preservada. O sinal [a] aparece imediatamente após o referente “Yahweh”.
