  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: אַנְשֵׁ֥י רָכִ֛יל הָ֥יוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם וְ/אֶל הֶֽ/הָרִים֙ אָ֣כְלוּ בָ֔/ךְ זִמָּ֖ה עָשׂ֥וּ בְ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/009.yaml
  text: Men of slander were in you in order to shed blood[a]; and on the mountains they ate[c][b]; they committed lewdness in your midst.
translation:
  language: pt
  text: Em você havia homens que espalhavam calúnias para derramar sangue[a]. Nos montes, comiam[b]; no seu meio, praticavam atos vergonhosos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica também pode ser entendida como “caluniadores”, “mexeriqueiros” ou “informantes”: pessoas que faziam circular acusações ou difamações que levavam à morte.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, participavam de refeições ilícitas nos lugares altos, provavelmente ligadas ao culto idólatra.
    reason: cultural_note
  - marker: c
    text: Ou “perversidades”, “imoralidade sexual” ou “depravação”. O termo hebraico indica uma conduta vergonhosa e ultrajante, muitas vezes de natureza sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי רָכִיל
  choice: homens que espalhavam calúnias
  rationale: Expressa naturalmente a ideia de pessoas que faziam circular acusações difamatórias, preservando a força moral e judicial do hebraico sem recorrer ao termo menos comum “mexeriqueiros”.
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: para derramar sangue
  rationale: Mantém a relação de finalidade e o idioma concreto do hebraico, que aqui aponta para violência homicida.
- source_word: וְאֶל הֶהָרִים אָכְלוּ
  choice: Nos montes, comiam
  rationale: Conserva a imagem hebraica sem inserir “santuários” no texto principal; o provável contexto de refeições cultuais ilícitas é esclarecido em nota.
- source_word: זִמָּה
  choice: atos vergonhosos
  rationale: Preserva a amplitude do termo, que pode indicar conduta moral ultrajante e, com frequência, depravação sexual, sem resolver em excesso a ambiguidade.
- source_word: עָשׂוּ בְתוֹכֵךְ
  choice: no seu meio, praticavam
  rationale: Forma idiomática em português que conserva a personificação de Jerusalém e a ideia de praticar repetidamente tais atos.
theological_decisions:
- issue: Natureza dos atos designados por זִמָּה
  choice: atos vergonhosos
  alternative: imoralidade sexual; depravação
  rationale: O termo frequentemente possui conotação sexual, mas também pode designar perversidade ou ultraje moral de modo mais amplo. A tradução mantém essa tensão, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem foi ajustada para soar natural, mantendo a interpelação de Jerusalém no feminino singular por meio de “em você” e “no seu meio”. Todos os marcadores de nota aparecem no texto principal.
