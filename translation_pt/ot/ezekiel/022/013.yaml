  text: וְ/הִנֵּה֙ הִכֵּ֣יתִי כַפִּ֔/י אֶל בִּצְעֵ֖/ךְ אֲשֶׁ֣ר עָשִׂ֑ית וְ/עַ֨ל דָּמֵ֔/ךְ אֲשֶׁ֥ר הָי֖וּ בְּ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/013.yaml
  text: And behold[a], I strike my hand against your unjust gain that you have made[b], and against the bloodshed that has been in your midst.
translation:
  language: pt
  text: Eis que bato a mão contra o lucro injusto[a] que você obteve e contra o derramamento de sangue[b] que houve em seu meio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ganho desonesto” ou “ganância”. O termo hebraico pode indicar lucro obtido por injustiça ou violência.
    reason: lexical_alternative
  - marker: b
    text: Ou “culpa de sangue”. O hebraico traz literalmente “sangues”, expressão que pode se referir coletivamente a atos de derramamento de sangue e à culpa ligada a eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Eis que
  rationale: Conserva o marcador profético que chama a atenção, em linguagem elevada, mas ainda clara e corrente.
- source_word: הִכֵּיתִי
  choice: bato
  rationale: O perfeito hebraico pode apresentar vividamente a ação declarada; o presente comunica o gesto imediato de juízo sem especificá-lo como aplauso.
- source_word: כַפִּי
  choice: a mão
  rationale: כף pode significar “palma” ou “mão”; “mão” é natural em português e preserva a imagem corporal.
- source_word: אֶל
  choice: contra
  rationale: No contexto de indignação e juízo, exprime adequadamente a direção hostil do gesto.
- source_word: בִּצְעֵךְ
  choice: o lucro injusto
  rationale: בצע frequentemente designa ganho obtido por injustiça ou violência; a formulação mantém tanto o sentido econômico quanto a condenação moral.
- source_word: אֲשֶׁר עָשִׂית
  choice: que você obteve
  rationale: Embora o verbo básico signifique “fazer”, com “lucro” o português idiomático pede “obter”; evita a expressão menos natural “lucro que você fez”.
- source_word: וְעַל
  choice: e contra
  rationale: Mantém o paralelismo com a primeira acusação e o caráter judicial da denúncia.
- source_word: דָּמֵךְ
  choice: o derramamento de sangue
  rationale: O hebraico “sangues” pode designar coletivamente homicídios, violência sanguinária ou a culpa resultante; esta opção é clara sem excluir a dimensão de culpa.
- source_word: אֲשֶׁר הָיוּ בְּתוֹכֵךְ
  choice: que houve no meio de você
  rationale: Preserva a referência aos atos ocorridos dentro da cidade personificada, com sintaxe compreensível no português brasileiro contemporâneo.
theological_decisions:
- issue: Natureza do gesto divino de juízo
  choice: bato a mão contra
  alternative: bato palmas por causa de; bati a mão contra
  rationale: Mantém a imagem antropomórfica concreta de indignação e juízo sem transformá-la em aplauso nem reduzir o gesto a uma abstração.
- issue: Sentido de דָּמֵךְ (“teus sangues”)
  choice: derramamento de sangue
  alternative: culpa de sangue; sangue
  rationale: A expressão coletiva denuncia a violência homicida dentro de Jerusalém; a nota conserva a possibilidade de que o termo inclua também a culpa decorrente.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Eis que” preserva a vivacidade profética; “você” torna explícita a interpelação direta à cidade sem recorrer a flexões regionais de “tu”. Os marcadores de nota foram colocados junto aos termos que efetivamente explicam.
