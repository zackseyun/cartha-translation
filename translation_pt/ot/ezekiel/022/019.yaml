  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן הֱי֥וֹת כֻּלְּ/כֶ֖ם לְ/סִגִ֑ים לָ/כֵן֙ הִנְ/נִ֣י קֹבֵ֣ץ אֶתְ/כֶ֔ם אֶל תּ֖וֹךְ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/019.yaml
  text: 'Therefore thus says the Lord GOD: Because all of you have become dross[a], therefore behold, I am gathering you into the midst of Jerusalem.'
translation:
  language: pt
  text: 'Por isso, assim diz o Senhor Yahweh: “Visto que todos vocês se tornaram escória[a], por isso, eis que eu os reunirei no meio de Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resíduos” ou “impurezas metálicas”. O hebraico se refere ao material sem valor separado do metal durante a fundição.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: 'Preserva os dois elementos do título hebraico: אֲדֹנָי como “Senhor” e o nome divino יהוה como “Yahweh”, sem produzir a repetição pouco natural “Senhor SENHOR”.'
- source_word: יַעַן הֱיוֹת
  choice: Visto que ... se tornaram
  rationale: Expressa em português atual a causa do juízo e a condição resultante indicada pela construção hebraica.
- source_word: כֻּלְּכֶם
  choice: todos vocês
  rationale: Mantém explicitamente a totalidade e a segunda pessoa do plural do hebraico, com ampla legibilidade em português.
- source_word: לְסִגִים
  choice: escória
  rationale: É o termo português natural para os resíduos ou impurezas separados do metal na fundição, preservando a metáfora metalúrgica do contexto.
- source_word: הִנְנִי קֹבֵץ
  choice: eis que eu os reunirei
  rationale: “Eis que” conserva a ênfase da fórmula de anúncio; o futuro traduz o particípio como ação iminente e certa, de modo mais natural em português do que o presente progressivo.
- source_word: אֶל תּוֹךְ יְרוּשָׁלִָם
  choice: no meio de Jerusalém
  rationale: Preserva o sentido espacial de תּוֹךְ, isto é, o interior da cidade, e não apenas o destino genérico “em Jerusalém”.
theological_decisions:
- issue: Tradução do nome divino no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A escolha mantém tanto o título אֲדֹנָי quanto o nome próprio יהוה e evita substituir silenciosamente o nome divino por outro título.
- issue: Valor temporal de הִנְנִי קֹבֵץ
  choice: eis que eu os reunirei
  alternative: eis que estou reunindo vocês
  rationale: O particípio com הִנְנִי pode apresentar vividamente uma ação iminente. O futuro comunica em português a certeza e iminência do juízo sem afirmar que o ajuntamento já estava em andamento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa plural. A formulação mantém a repetição retórica de “Portanto ... Visto que ... eis que”, embora ajuste o segundo לָכֵן à fluência portuguesa sem apagar a relação causal.
