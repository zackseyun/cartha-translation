  text: כֹּהֲנֶ֜י/הָ חָמְס֣וּ תוֹרָתִ/י֮ וַ/יְחַלְּל֣וּ קָדָשַׁ/י֒ בֵּֽין קֹ֤דֶשׁ לְ/חֹל֙ לֹ֣א הִבְדִּ֔ילוּ וּ/בֵין הַ/טָּמֵ֥א לְ/טָה֖וֹר לֹ֣א הוֹדִ֑יעוּ וּ/מִ/שַׁבְּתוֹתַ/י֙ הֶעְלִ֣ימוּ עֵֽינֵי/הֶ֔ם וָ/אֵחַ֖ל בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/026.yaml
  text: Her priests have done violence to my law and have profaned my holy things[a]. They have not distinguished between the holy and the common, and they have not made known the difference between the unclean and the clean. They have hidden their eyes from my Sabbaths[b], and I have been profaned among them.
translation:
  language: pt
  text: Seus sacerdotes trataram a minha lei com violência e profanaram as minhas coisas santas. Não fizeram distinção entre o santo e o comum[a], nem deram a conhecer a diferença entre o impuro e o puro. Fecharam os olhos para os meus sábados, e fui profanado no meio deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «entre o santo e o profano». Aqui, o termo hebraico designa mais precisamente aquilo que é comum ou não consagrado, em contraste com o que é santo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «fui tratado como profano no meio deles».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמְסוּ
  choice: trataram ... com violência
  rationale: Preserva a força da ideia de violência e ultraje contra a lei, sem empregar o verbo português «violentar», que poderia sugerir um sentido indevido.
- source_word: תוֹרָתִי
  choice: a minha lei
  rationale: No contexto da acusação contra os sacerdotes, «lei» expressa de modo claro e natural a instrução normativa de Deus.
- source_word: וַיְחַלְּלוּ
  choice: profanaram
  rationale: Verbo adequado para a violação daquilo que pertence à esfera santa.
- source_word: קָדָשַׁי
  choice: as minhas coisas santas
  rationale: Mantém a abrangência do plural hebraico, sem o restringir a ofertas, lugares ou objetos específicos.
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: entre o santo e o comum
  rationale: «Comum» indica aquilo que não foi separado como santo, sem sugerir necessariamente perversidade ou irreverência moral.
- source_word: וּבֵין הַטָּמֵא לְטָהוֹר
  choice: entre o impuro e o puro
  rationale: Emprega termos correntes e apropriados às categorias sacerdotais de pureza ritual.
- source_word: לֹא הוֹדִיעוּ
  choice: nem deram a conhecer a diferença
  rationale: Reflete de perto o sentido causativo de «fazer saber», preservando a responsabilidade instrutiva dos sacerdotes.
- source_word: הֶעְלִימוּ עֵינֵיהֶם
  choice: Fecharam os olhos para
  rationale: Expressa em português natural a imagem hebraica de desconsideração deliberada.
- source_word: שַׁבְּתוֹתַי
  choice: os meus sábados
  rationale: Preserva o plural e a linguagem de pertencimento pactual do texto.
- source_word: וָאֵחַל בְּתוֹכָם
  choice: fui profanado no meio deles
  rationale: Toma a forma como passiva e apresenta a profanação do nome e da santidade de Deus como consequência da conduta sacerdotal.
theological_decisions:
- issue: Sentido de חֹל no contraste sacerdotal
  choice: comum
  alternative: profano ou ordinário
  rationale: O contraste diz respeito às categorias de santo e não santo; «comum» evita afirmar que tudo o que não é consagrado seja moralmente perverso.
- issue: Voz e sentido de וָאֵחַל
  choice: fui profanado no meio deles
  alternative: fui tratado como profano no meio deles
  rationale: A leitura passiva se ajusta ao texto vocalizado e ao contexto. A alternativa explicita o sentido sem transformar Deus no agente da profanação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conserva a imagem forte de violência contra a lei, as categorias sacerdotais e a voz passiva da cláusula final.
