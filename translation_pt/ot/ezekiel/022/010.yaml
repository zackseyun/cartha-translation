    issue: «Violentam» pode afirmar coerção sexual explícita além do que o hebraico determina neste versículo.
    rationale: ענה tem conotação de humilhação e tratamento degradante no contexto sexual, mas o texto não detalha coerção. Uma formulação menos específica preserva a ambiguidade.
