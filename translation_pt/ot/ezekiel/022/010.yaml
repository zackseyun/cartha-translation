  text: עֶרְוַת אָ֖ב גִּלָּה בָ֑/ךְ טְמֵאַ֥ת הַ/נִּדָּ֖ה עִנּוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
translation:
  language: pt
  text: Em você, descobrem a nudez do pai[a][b]; em você, humilham a mulher impura por causa da menstruação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “descobrem a nudez do pai”, expressão levítica para relações sexuais ilícitas; compare Levítico 18:7.'
    reason: cross_reference
  - marker: b
    text: 'Ou: “entre vocês”. O hebraico se dirige a Jerusalém como mulher e cidade: “em você”.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: “a impura da menstruação”, isto é, a mulher impura por causa da menstruação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  choice: a nudez do pai
  rationale: Preserva a expressão legal hebraica, conhecida de Levítico, sem especificar além do texto qual relação ilícita está em vista.
- source_word: גִּלָּה
  choice: eles descobrem
  rationale: Embora a forma seja singular, funciona coletivamente no contexto das acusações contra os habitantes de Jerusalém; o presente torna direta a denúncia profética.
- source_word: בָךְ
  choice: em você
  rationale: Mantém a interpelação à cidade personificada no feminino; 'entre vocês' seria possível, mas eliminaria essa forma retórica.
- source_word: טְמֵאַת הַנִּדָּה
  choice: a mulher durante a impureza menstrual
  rationale: Explicita o referente feminino implícito e conserva a dimensão ritual de impureza associada à menstruação.
- source_word: עִנּוּ
  choice: violentam
  rationale: No contexto sexual, o verbo indica tratamento abusivo e degradante; 'violentam' comunica a gravidade sem reduzir a expressão a uma relação sexual neutra.
theological_decisions:
- issue: Tradução do idiomatismo sexual levítico
  choice: Manter 'descobrem a nudez do pai' no texto principal.
  alternative: Explicitar 'têm relações sexuais com a mulher do pai' ou 'cometem incesto'.
  rationale: A formulação hebraica é uma expressão jurídica fixa. Mantê-la preserva a ligação com Levítico e evita impor uma identificação mais específica do ato do que este versículo formula.
- issue: Possível conotação coercitiva de עִנּוּ
  choice: Traduzir por 'violentam'.
  alternative: Traduzir por 'têm relações com' ou 'humilham'.
  rationale: O contexto sexual e o valor degradante do verbo favorecem uma expressão forte, embora o hebraico não descreva aqui todos os pormenores do ato.
translation_notes:
  register: Português moderno, digno e acessível, com a personificação feminina de Jerusalém preservada. A expressão levítica foi mantida no corpo do texto e esclarecida em nota; 'impureza menstrual' conserva a dimensão ritual do original.
