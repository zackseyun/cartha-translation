  source_fidelity: A primeira oração preserva bem o idiomatismo hebraico. Na segunda, porém, «durante a impureza menstrual» descreve o momento do ato, ao passo que טְמֵאַת הַנִּדָּה designa a mulher que está ritualmente impura por sua menstruação. Além disso, «violentam» em português normalmente especifica violência sexual/coerção, algo que עִנּוּ pode sugerir, mas que o versículo não explicita de modo inequívoco.
  naturalness: «Em você» é natural no quadro da personificação de Jerusalém e a repetição tem força retórica. «A mulher durante a impureza menstrual» soa menos natural e é semanticamente impreciso; «a mulher impura por causa da menstruação» é claro e idiomático.
  terminology: «Nudez do pai» mantém apropriadamente a fórmula legal levítica. «Humilham» reproduz o sentido básico degradante de ענה sem impor a leitura mais específica de estupro; o contexto e a nota permitem reconhecer a natureza sexual da acusação.
