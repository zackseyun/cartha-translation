  text: אָ֤ב וָ/אֵם֙ הֵקַ֣לּוּ בָ֔/ךְ לַ/גֵּ֛ר עָשׂ֥וּ בַ/עֹ֖שֶׁק בְּ/תוֹכֵ֑/ךְ יָת֥וֹם וְ/אַלְמָנָ֖ה ה֥וֹנוּ בָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/007.yaml
  text: In you they have treated father and mother with contempt[a]; in your midst they have oppressed the sojourner[c][b]; in you they have defrauded the fatherless and the widow.
translation:
  language: pt
  text: Em você, desprezaram pai e mãe; no seu meio, o estrangeiro residente foi oprimido[a]; em você, exploraram o órfão e a viúva.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o estrangeiro”.'
    reason: lexical_alternative
  - marker: b
    text: A repetição de “em você” dirige-se à cidade, personificando Jerusalém como mulher.
    reason: cultural_note
lexical_decisions:
- source_word: הֵקַלּוּ
  choice: desprezaram
  rationale: O hifil de קלל comunica tratar levianamente, desonrar ou mostrar desprezo. “Desprezaram” é natural e conserva a força moral da acusação.
- source_word: אָב וָאֵם
  choice: pai e mãe
  rationale: Mantém os dois termos explícitos do hebraico e sua ressonância com a linguagem do mandamento, em vez de generalizá-los como “pais”.
- source_word: בָךְ / בְּתוֹכֵךְ
  choice: em você / no seu meio
  rationale: Preserva a interpelação direta à cidade, em forma feminina no hebraico, e a variação entre בָךְ e בְּתוֹכֵךְ.
- source_word: לַגֵּר
  choice: o estrangeiro residente
  rationale: גֵּר designa alguém de origem externa que reside no meio da comunidade. “Estrangeiro residente” preserva melhor essa categoria social do que apenas “estrangeiro”.
- source_word: עָשׂוּ בָעֹשֶׁק
  choice: foi oprimido
  rationale: A expressão idiomática, literalmente relacionada a agir com opressão ou extorsão, indica tratamento explorador. A passiva portuguesa reflete naturalmente o objeto antecipado no hebraico.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: o órfão e a viúva
  rationale: “Órfão” é a designação portuguesa corrente para יָתוֹם no par jurídico-social tradicional com a viúva; o termo hebraico pode enfatizar especificamente a ausência do pai.
- source_word: הוֹנוּ
  choice: exploraram
  rationale: O hifil de ינה denota maltratar, oprimir ou tirar vantagem injustamente. “Exploraram” mantém a amplitude social e econômica sem restringir o sentido a fraude financeira.
theological_decisions:
- issue: Terminologia ético-social da aliança para pessoas vulneráveis
  choice: Manter as categorias específicas “estrangeiro residente”, “órfão” e “viúva”.
  alternative: Generalizar como “os vulneráveis” ou usar apenas “estrangeiro”.
  rationale: O texto acusa violações contra grupos nominalmente protegidos na legislação de Israel. Preservar essas categorias mantém a força intertextual sem acrescentar interpretação doutrinária.
- issue: Personificação de Jerusalém no pronome feminino singular
  choice: Traduzir literalmente a repetição por “em você” e explicá-la em nota.
  alternative: Explicitar “em Jerusalém” no corpo do versículo.
  rationale: O hebraico interpela diretamente a cidade como figura feminina. Manter o pronome preserva a retórica e evita inserir um nome ausente neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do hebraico foram mantidas sempre que naturais; “estrangeiro residente” conserva a categoria social específica de גֵּר, e “exploraram” evita estreitar indevidamente הוֹנוּ a fraude monetária.
