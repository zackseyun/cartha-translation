source:
  edition: WLC
  text: בְּ/דָמֵ֨/ךְ אֲשֶׁר שָׁפַ֜כְתְּ אָשַׁ֗מְתְּ וּ/בְ/גִלּוּלַ֤יִ/ךְ אֲשֶׁר עָשִׂית֙ טָמֵ֔את וַ/תַּקְרִ֣יבִי יָמַ֔יִ/ךְ וַ/תָּב֖וֹא עַד שְׁנוֹתָ֑יִ/ךְ עַל כֵּ֗ן נְתַתִּ֤י/ךְ חֶרְפָּה֙ לַ/גּוֹיִ֔ם וְ/קַלָּסָ֖ה לְ/כָל הָ/אֲרָצֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/004.yaml
  text: By your blood that you have shed[a], you have become guilty, and by your idols that you have made, you have become unclean. You have brought your days near and have come to your years[b]. Therefore I have made you a reproach to the nations and a mockery to all the lands.
translation:
  language: pt
  text: Por causa do sangue que você derramou, você se tornou culpada; e, por causa dos ídolos que fez[a], você se tornou impura. Você aproximou os seus dias e chegou aos seus anos[b]. Por isso, fiz de você motivo de vergonha para as nações e de zombaria para todas as terras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra hebraica traduzida como “ídolos” é um termo depreciativo, usado com frequência em Ezequiel para falsos deuses; sua conotação é mais desdenhosa do que a palavra neutra para imagens.
    reason: cultural_note
  - marker: b
    text: 'Ou, de modo mais interpretativo: “Você apressou o fim dos seus dias e chegou ao fim dos seus anos”. A expressão hebraica provavelmente se refere à aproximação do tempo determinado para o juízo de Jerusalém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדָמֵךְ אֲשֶׁר שָׁפַכְתְּ
  choice: Por causa do sangue que você derramou
  rationale: O בְּ tem valor causal ou instrumental no contexto da acusação. A formulação comunica com naturalidade que Jerusalém incorreu em culpa pelo sangue derramado, sem substituir a imagem concreta por um termo abstrato.
- source_word: אָשַׁמְתְּ
  choice: tornou-se culpada
  rationale: O verbo indica incorrer em culpa ou passar a carregar culpa. O feminino preserva a personificação de Jerusalém presente no hebraico.
- source_word: גִלּוּלַיִךְ
  choice: seus ídolos
  rationale: É o termo claro e corrente em português. A carga depreciativa peculiar da palavra hebraica usada frequentemente por Ezequiel é registrada em nota, sem impor no texto uma expressão artificial.
- source_word: טָמֵאת
  choice: tornou-se impura
  rationale: O Qal pode expressar tornar-se impuro. A tradução mantém o paralelismo com 'tornou-se culpada' e não acrescenta uma reflexividade que a forma hebraica não explicita.
- source_word: וַתַּקְרִיבִי יָמַיִךְ
  choice: Você aproximou os seus dias
  rationale: Mantém a imagem do Hifil de קרב, 'fazer chegar perto', preservando a expressão profética sem explicitar no corpo do texto que se trata dos dias de juízo.
- source_word: וַתָּבֹוא עַד שְׁנוֹתָיִךְ
  choice: e chegou aos seus anos
  rationale: Reproduz de perto a formulação deliberadamente compacta do hebraico e seu paralelismo com a oração anterior. A provável referência ao tempo determinado de juízo é explicada em nota, não inserida como certeza no texto.
- source_word: חֶרְפָּה
  choice: motivo de vergonha
  rationale: Expressa desonra pública e reprovação em português atual, além de funcionar naturalmente com a construção 'fiz de você'.
- source_word: קַלָּסָה
  choice: zombaria
  rationale: Comunica escárnio ou derisão e mantém distinção suficiente em relação à vergonha da oração paralela.
- source_word: הָאֲרָצוֹת
  choice: todas as terras
  rationale: O plural se refere a terras ou países em paralelo com 'nações'; 'terras' conserva a amplitude geopolítica do hebraico.
theological_decisions:
- issue: Natureza da culpa e da impureza de Jerusalém
  choice: Manter lado a lado a culpa judicial decorrente do derramamento de sangue e a impureza associada à idolatria.
  alternative: Reduzir a impureza a uma categoria meramente cerimonial ou tratar a culpa como figura puramente metafórica.
  rationale: O hebraico apresenta ambas como acusações concretas contra Jerusalém. A tradução preserva as dimensões moral, ritual e pactual sem importar categorias doutrinárias posteriores.
- issue: Sentido dos 'dias' e 'anos' de Jerusalém
  choice: Conservar no texto a expressão hebraica compacta e explicar em nota sua provável referência ao tempo determinado de juízo.
  alternative: Traduzir explicitamente como 'apressou o fim dos seus dias e chegou ao fim dos seus anos'.
  rationale: O contexto favorece a chegada do juízo, mas as palavras 'fim' e 'juízo' não aparecem expressamente nessas orações. A solução evita transformar uma inferência contextual provável em formulação textual inequívoca.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” torna natural a interpelação direta, enquanto as formas femininas “culpada” e “impura” deixam clara a personificação de Jerusalém. As notas foram associadas aos marcadores semanticamente correspondentes: [a] aos ídolos e [b] à expressão sobre dias e anos.'
