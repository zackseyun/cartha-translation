base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/005.yaml
  text: Those who are near and those who are far from you will mock you[a], defiled of name[b], full of turmoil.
translation:
  language: pt
  text: As que estão perto e as que estão longe de você zombarão de você, ó impura de nome[a], cheia de tumulto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “impura de nome”. Também pode significar “de nome manchado” ou “cujo nome está contaminado”; a expressão hebraica é compacta e provavelmente se refere à reputação da cidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “cheia de confusão”, “cheia de alvoroço” ou “repleta de desordem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרֹבוֹת וְהָרְחֹקוֹת מִמֵּךְ
  choice: As que estão perto e as que estão longe de você
  rationale: Preserva o paralelismo espacial e o feminino plural substantivado, provavelmente referente a cidades ou nações personificadas, sem explicitar um referente ausente do hebraico.
- source_word: יִתְקַלְּסוּ בָךְ
  choice: zombarão de você
  rationale: Expressa de modo natural a ideia de escárnio ou zombaria do verbo no hitpael, mantendo a destinatária na segunda pessoa.
- source_word: טְמֵאַת הַשֵּׁם
  choice: ó desonrada
  rationale: A expressão hebraica é compacta e literalmente associa impureza ao nome. Em português, 'desonrada' comunica com naturalidade a reputação manchada, enquanto a nota preserva a ambiguidade lexical.
- source_word: רַבַּת הַמְּהוּמָה
  choice: cheia de tumulto
  rationale: '''Cheia de'' traduz idiomaticamente a ideia de abundância, e ''tumulto'' abrange agitação, confusão e desordem.'
theological_decisions:
- issue: Como interpretar a expressão comprimida טְמֵאַת הַשֵּׁם
  choice: vocativo que caracteriza a destinatária como 'desonrada'
  alternative: '''impura de nome'', ''de nome manchado'' ou ''cujo nome está contaminado'''
  rationale: A tradução principal torna inteligível a provável referência à reputação contaminada de Jerusalém, sem definir a natureza exata dessa impureza; a nota registra a forma e as leituras possíveis.
- issue: Se a destinatária deve ser identificada explicitamente
  choice: manter apenas a segunda pessoa e as formas femininas
  alternative: acrescentar 'Jerusalém' ou 'cidade'
  rationale: O contexto identifica a destinatária, mas o nome não aparece neste versículo; por isso, não foi acrescentado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com vocativo profético natural. O feminino plural de 'as que' e o feminino singular de 'desonrada/cheia' preservam a personificação presente no hebraico.
