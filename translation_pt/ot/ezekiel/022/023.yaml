  text: 'E a palavra de Yahweh veio a mim[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «E aconteceu que a palavra de Yahweh veio a mim, dizendo» — fórmula profética habitual que significa que a palavra de Yahweh foi comunicada ao profeta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: veio
  rationale: Embora o verbo signifique literalmente “e aconteceu/foi”, na fórmula profética וַיְהִי דְבַר־יְהוָה אֵלַי o português idiomático pede “a palavra ... veio a mim”.
- source_word: דְבַר
  choice: a palavra
  rationale: No contexto profético, דָּבָר designa a palavra ou mensagem divina. “A palavra” preserva a fórmula profética tradicional e sua solenidade.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: Representa diretamente o destinatário da palavra profética em português natural.
- source_word: לֵאמֹר
  choice: ':'
  rationale: O infinitivo introduz a fala direta seguinte; em português atual, os dois-pontos comunicam essa função com mais naturalidade do que “dizendo” no fim do versículo.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome pessoal sem substituí-lo por um título.
- issue: Relação entre a palavra divina e o profeta
  choice: “A palavra de Yahweh veio a mim”
  alternative: “A mensagem de Yahweh foi dirigida a mim”
  rationale: A formulação mantém a expressão profética e sua imagem sem explicar além do que o hebraico afirma.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção formular foi preservada, enquanto os dois-pontos traduzem idiomaticamente לֵאמֹר e introduzem o oráculo do versículo seguinte.
