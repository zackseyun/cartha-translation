base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/033.yaml
  text: And its guardrooms[a], its side pillars, and its portico were according to these measurements; and it and its side pillars had windows all around. Its length was fifty cubits[b], and its width twenty-five cubits.
translation:
  language: pt
  text: Suas salas da guarda, seus pilares laterais[a] e seu pórtico[b] tinham as mesmas dimensões. A porta e seu pórtico tinham janelas por todos os lados. Seu comprimento era de cinquenta côvados[c], e sua largura, de vinte e cinco côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ombreiras” ou “pilastras”. O termo arquitetônico hebraico é difícil e pode designar elementos estruturais da porta.
    reason: lexical_alternative
  - marker: b
    text: Ou “vestíbulo”.
    reason: lexical_alternative
  - marker: c
    text: Um côvado correspondia aproximadamente à distância do cotovelo à ponta dos dedos; seu valor exato podia variar.
    reason: measurement_clarification
lexical_decisions:
- source_word: תָּא
  choice: salas da guarda
  rationale: No contexto das portas da visão do templo, designa as pequenas câmaras integradas à estrutura; “salas da guarda” comunica com clareza seu provável uso sem recorrer a terminologia excessivamente técnica.
- source_word: אַיִל
  choice: pilares laterais
  rationale: O termo arquitetônico designa elementos estruturais salientes da porta. “Pilares laterais” é claro em português moderno, embora “ombreiras” ou “pilastras” também sejam possíveis.
- source_word: אֵילָם
  choice: pórtico
  rationale: Designa a estrutura de entrada associada à porta. “Pórtico” preserva o caráter arquitetônico melhor que opções potencialmente mais domésticas, como “varanda”.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: tinham as mesmas dimensões
  rationale: A expressão indica conformidade com as medidas da estrutura descrita anteriormente; esta formulação é natural e precisa em português.
- source_word: חַלּוֹנוֹת
  choice: janelas
  rationale: O sentido comum de “janelas” se ajusta à descrição arquitetônica; “aberturas” seria possível, mas desnecessariamente vago.
- source_word: לוֹ וּלְאֵילַמּוֹ
  choice: tanto ele como seu pórtico
  rationale: A construção indica que havia janelas na estrutura mencionada e em seu pórtico. O referente pronominal permanece expresso de modo geral como no hebraico.
- source_word: סָבִיב סָבִיב
  choice: por todos os lados
  rationale: A repetição intensifica a ideia de distribuição ao redor de toda a estrutura.
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה
  choice: Seu comprimento era de cinquenta côvados
  rationale: Formulação portuguesa direta para a primeira dimensão, preservando a unidade antiga.
- source_word: רֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: sua largura, de vinte e cinco côvados
  rationale: Expressa de modo conciso e natural a segunda dimensão.
