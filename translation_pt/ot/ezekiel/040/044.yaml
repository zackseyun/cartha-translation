base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
translation:
  language: pt
  text: 'Do lado de fora do portão interno havia câmaras para os cantores, no pátio interno: uma ficava junto ao lado[a] do portão norte, com a frente voltada para o sul, e outra junto ao lado[b] do portão leste, com a frente voltada para o norte.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “junto ao ombro do portão norte”. Em linguagem arquitetônica, o hebraico usa “ombro” para indicar o lado ou flanco de uma estrutura.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “junto ao ombro do portão leste”. Em linguagem arquitetônica, o hebraico usa “ombro” para indicar o lado ou flanco de uma estrutura.
    reason: lexical_alternative
  - marker: c
    text: A sintaxe hebraica deste versículo é condensada, e a disposição exata das câmaras pode ser expressa de maneiras diferentes. O texto descreve câmaras no pátio interno, próximas aos portões norte e leste, orientadas respectivamente para o sul e para o norte.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִחוּצָה לַשַּׁעַר הַפְּנִימִי
  choice: Do lado de fora do portão interno
  rationale: Expressa de modo natural a localização indicada por וּמִחוּצָה e mantém a ligação espacial com o portão interno.
- source_word: לִשְׁכוֹת שָׁרִים
  choice: câmaras para os cantores
  rationale: לִשְׁכוֹת designa dependências ou câmaras do complexo do templo, e שָׁרִים refere-se aos que cantam.
- source_word: בֶּחָצֵר הַפְּנִימִי
  choice: no pátio interno
  rationale: ‘Pátio interno’ é uma expressão arquitetônica clara e corrente para a área delimitada do templo.
- source_word: אֶל כֶּתֶף שַׁעַר הַצָּפוֹן
  choice: junto ao lado do portão norte
  rationale: כֶּתֶף significa literalmente ‘ombro’, mas no uso arquitetônico indica o lado ou flanco de uma estrutura; ‘lado’ comunica esse sentido naturalmente em português.
- source_word: וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם
  choice: com a frente voltada para o sul
  rationale: Em descrição arquitetônica, פָּנִים indica a frente ou orientação da construção, não necessariamente rostos humanos.
- source_word: אֶחָד אֶל כֶּתֶף שַׁעַר הַקָּדִים
  choice: uma ficava junto ao lado do portão leste
  rationale: O feminino ‘uma’ retoma naturalmente uma câmara; o verbo ‘ficava’ é suprido em português pela elipse sintática do hebraico.
- source_word: פְּנֵי דֶּרֶךְ הַצָּפוֹן
  choice: com a frente voltada para o norte
  rationale: Mantém o paralelismo espacial com a orientação para o sul mencionada anteriormente.
