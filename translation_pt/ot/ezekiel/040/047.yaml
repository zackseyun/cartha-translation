  text: 'Then he measured the court: one hundred cubits long and one hundred cubits wide[a], square[b]; and the altar was before the house.'
translation:
  language: pt
  text: 'Então ele mediu o pátio: cem côvados de comprimento e cem côvados de largura, quadrado; e o altar estava diante do templo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “casa”; aqui, o edifício do templo visto por Ezequiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão com naturalidade em português, e “mediu” preserva o sentido de מדד.
- source_word: הֶחָצֵר
  choice: o pátio
  rationale: חָצֵר designa um espaço aberto e cercado. “Pátio” é claro e natural no contexto arquitetônico do templo.
- source_word: אֹרֶךְ מֵאָה אַמָּה וְרֹחַב מֵאָה אַמָּה
  choice: cem côvados de comprimento e cem côvados de largura
  rationale: Mantém as duas dimensões paralelas e conserva a unidade antiga “côvado”, sem conversão conjectural.
- source_word: מְרֻבָּעַת
  choice: formando um quadrado
  rationale: Expressa de modo idiomático que o pátio tinha lados iguais e formato quadrado.
- source_word: הַמִּזְבֵּחַ
  choice: o altar
  rationale: Equivalente português corrente e preciso para מִזְבֵּחַ no contexto cultual.
- source_word: לִפְנֵי הַבָּיִת
  choice: diante do templo
  rationale: לִפְנֵי indica posição à frente de algo. Embora בַּיִת signifique literalmente “casa”, neste contexto aponta para o edifício do templo; a nota preserva a forma lexical hebraica.
theological_decisions:
- issue: Referente de הַבָּיִת na visão do templo
  choice: templo
  alternative: casa
  rationale: “Templo” comunica com clareza o referente arquitetônico no contexto, sem introduzir uma interpretação denominacional; a tradução literal “casa” é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe arquitetônica natural. A medida antiga foi mantida, e a ambiguidade lexical de בַּיִת foi preservada em nota.
