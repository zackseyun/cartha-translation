base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/027.yaml
  text: 'And there was a gate to the inner court toward the south[a], and he measured from gate to gate toward the south: one hundred cubits.'
translation:
  language: pt
  text: 'Havia também uma porta para o pátio interno voltada para o sul[a]. E ele mediu de uma porta à outra, na direção do sul: cem côvados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no lado sul”. Em hebraico, literalmente, “pelo caminho do sul”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁעַר
  choice: Havia também uma porta
  rationale: A oração hebraica é nominal; em português, “havia” explicita naturalmente a existência da porta, e “também” dá continuidade à descrição.
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: para o pátio interno
  rationale: O לְ marca aqui relação e acesso; “para o pátio interno” preserva o sentido arquitetônico sem sugerir posse exclusiva.
- source_word: דֶּרֶךְ הַדָּרוֹם (primeira ocorrência)
  choice: voltada para o sul
  rationale: A expressão significa literalmente “pelo caminho/direção do sul”; no contexto da porta, a formulação indica sua orientação de modo natural em português.
- source_word: וַיָּמָד
  choice: E ele mediu
  rationale: Mantém a progressão narrativa e o sujeito implícito, o homem que realiza as medições no contexto.
- source_word: מִשַּׁעַר אֶל הַשַּׁעַר
  choice: de uma porta à outra
  rationale: Expressa com clareza a medição entre as duas portas correspondentes, preservando a relação de origem e destino.
- source_word: דֶּרֶךְ הַדָּרוֹם (segunda ocorrência)
  choice: na direção do sul
  rationale: Nesta ocorrência, a expressão especifica a direção da medição; a tradução conserva explicitamente essa nuance direcional.
- source_word: מֵאָה אַמּוֹת
  choice: cem côvados
  rationale: Mantém a unidade antiga do texto-fonte, sem conversão aproximativa para uma medida moderna.
