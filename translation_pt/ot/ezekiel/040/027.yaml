translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação distingue a orientação da porta (“voltada para o sul”) da direção da medição (“na direção do sul”), sem eliminar a amplitude semântica da expressão hebraica; a alternativa locativa aparece em nota.
