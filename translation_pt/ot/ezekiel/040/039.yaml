  text: וּ/בְ/אֻלָ֣ם הַ/שַּׁ֗עַר שְׁנַ֤יִם שֻׁלְחָנוֹת֙ מִ/פּ֔וֹ וּ/שְׁנַ֥יִם שֻׁלְחָנ֖וֹת מִ/פֹּ֑ה לִ/שְׁח֤וֹט אֲלֵי/הֶם֙ הָ/עוֹלָ֔ה וְ/הַ/חַטָּ֖את וְ/הָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/039.yaml
  text: And in the portico of the gate were two tables on this side and two tables on that side[a], on which they slaughtered the burnt offering, the sin offering[b], and the guilt offering.
translation:
  language: pt
  text: E no pórtico do portão havia duas mesas de um lado e duas mesas do outro, para nelas abater o holocausto, a oferta pelo pecado[a] e a oferta pela culpa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “oferta de purificação”; o termo hebraico pode designar a oferta relacionada à purificação do pecado ou da impureza.
    reason: lexical_alternative
  - marker: b
    text: Ou “oferta de reparação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֻלָם
  choice: E no pórtico
  rationale: אֻלָם designa a área coberta de entrada, como pórtico ou vestíbulo. “Pórtico” é arquitetonicamente adequado, claro e digno em português.
- source_word: הַשַּׁעַר
  choice: do portão
  rationale: שַׁעַר pode indicar o portão ou toda a estrutura da entrada. “Portão” preserva o referente arquitetônico concreto e combina naturalmente com “pórtico”.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת ... וּשְׁנַיִם שֻׁלְחָנוֹת מִפּוֹ ... מִפֹּה
  choice: duas mesas de um lado e duas mesas do outro
  rationale: A formulação expressa com naturalidade a disposição bilateral descrita pelo hebraico, preservando tanto a repetição do número quanto o contraste espacial.
- source_word: לִשְׁחֹט אֲלֵיהֶם
  choice: para nelas abater
  rationale: O infinitivo com לְ indica a finalidade prática das mesas. שׁחט é o verbo próprio para o abate sacrificial, e “nelas” retoma explicitamente as mesas sem acrescentar um agente ausente do hebraico.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עוֹלָה é a oferta inteiramente queimada. “Holocausto” é o termo bíblico sacrificial consolidado em português e mantém concisão.
- source_word: הַחַטָּאת
  choice: a oferta pelo pecado
  rationale: חַטָּאת, no contexto ritual, designa a oferta relacionada ao pecado e à purificação. A expressão escolhida é amplamente compreensível; a nuance alternativa de purificação é preservada em nota.
- source_word: הָאָשָׁם
  choice: a oferta pela culpa
  rationale: אָשָׁם designa a oferta ritual ligada à culpa, podendo incluir reparação. “Oferta pela culpa” mantém a categoria cultual tradicional, enquanto a alternativa é registrada em nota.
theological_decisions:
- issue: Tradução da terminologia sacrificial sem impor uma interpretação doutrinária posterior
  choice: holocausto, oferta pelo pecado e oferta pela culpa
  alternative: oferta queimada, oferta de purificação e oferta de reparação
  rationale: O versículo descreve categorias sacrificiais no contexto da visão do templo. A tradução principal usa termos reconhecíveis e próximos do emprego cultual hebraico, enquanto as notas preservam as nuances legítimas de purificação e reparação sem resolver além do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “para nelas abater” preserva o valor final do infinitivo hebraico e evita introduzir um sujeito não expresso. Os marcadores de nota aparecem imediatamente após os termos a que se referem.
