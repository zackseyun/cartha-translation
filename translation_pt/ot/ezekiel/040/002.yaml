id: EZK.40.2
reference: Ezekiel 40:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: בְּ/מַרְא֣וֹת אֱלֹהִ֔ים הֱבִיאַ֖/נִי אֶל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יְנִיחֵ֗/נִי אֶל הַ֤ר גָּבֹ֨הַּ֙ מְאֹ֔ד וְ/עָלָ֥י/ו כְּ/מִבְנֵה עִ֖יר מִ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/002.yaml
  text: In visions of God he brought me into the land of Israel and set me down on a very high mountain[a]; on it, to the south[b], was something like the structure of a city.
translation:
  language: pt
  text: Em visões de Deus[a], ele me levou para a terra de Israel e me colocou sobre um monte muito alto. Sobre ele, ao sul[b], havia algo semelhante à estrutura de uma cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em visões divinas” ou “em visões vindas de Deus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em direção ao sul”; o hebraico pode indicar orientação meridional, e não procedência.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: Em visões de Deus
  rationale: 'Preserva a formulação hebraica e sua possível amplitude: visões divinas, pertencentes a Deus ou procedentes dele. A preposição בְּ é expressa naturalmente por “em” no contexto da experiência visionária.'
- source_word: הֱבִיאַנִי
  choice: ele me levou
  rationale: O hifil de בוא significa normalmente “levar” ou “trazer”. “Levou” é natural em português a partir do ponto de vista narrativo de Ezequiel, e o pronome mantém implícita a identificação do sujeito.
- source_word: אֶל אֶרֶץ יִשְׂרָאֵל
  choice: para a terra de Israel
  rationale: Expressa movimento em direção ao interior da terra de Israel de modo claro e idiomático em português.
- source_word: וַיְנִיחֵנִי
  choice: e me colocou
  rationale: O hifil de נוח pode significar pôr, colocar ou depositar. “Me colocou” comunica a localização do profeta no cenário visionário sem sugerir indevidamente que ele recebeu descanso.
- source_word: אֶל הַר גָּבֹהַּ מְאֹד
  choice: sobre um monte muito alto
  rationale: Depois de “colocou”, “sobre” comunica naturalmente a posição no monte; גָּבֹהַּ מְאֹד corresponde diretamente a “muito alto”.
- source_word: וְעָלָיו
  choice: Sobre ele
  rationale: O pronome retoma o monte. A abertura de uma nova frase oferece clareza sem perder a ligação expressa pelo hebraico.
- source_word: כְּמִבְנֵה עִיר
  choice: algo semelhante à estrutura de uma cidade
  rationale: מִבְנֶה indica estrutura ou configuração construída, enquanto כְּ marca comparação. A formulação preserva o caráter cauteloso da descrição visionária, sem identificar diretamente o que foi visto como uma cidade.
- source_word: מִנֶּגֶב
  choice: ao sul
  rationale: A expressão indica mais provavelmente a localização ou orientação meridional. “Ao sul” é conciso e natural, enquanto a nota registra a possibilidade direcional “em direção ao sul”.
theological_decisions:
- issue: Sujeito implícito dos verbos de transporte visionário
  choice: Manter “ele”, sem substituir explicitamente por “Deus”
  alternative: “Deus me levou... e me colocou...”
  rationale: Os verbos hebraicos estão na terceira pessoa masculina singular, mas o sujeito não é nomeado no versículo. “Ele” preserva essa economia textual; a expressão inicial já situa a experiência no âmbito divino.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. A ordem foi levemente ajustada para clareza, sem eliminar as ambiguidades reais da expressão sobre as visões nem da indicação meridional.
