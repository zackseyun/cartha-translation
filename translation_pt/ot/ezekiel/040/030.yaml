lexical_decisions:
- source_word: אֵלַמּוֹת
  choice: vestíbulos
  rationale: O plural designa estruturas de entrada ou antecâmaras no contexto arquitetônico do templo; «vestíbulos» é claro, atual e adequado à descrição do complexo dos portões.
- source_word: סָבִיב סָבִיב
  choice: ao redor, ao redor
  rationale: A repetição preserva a ênfase distributiva e o ritmo incomum do hebraico, sem reduzi-los a um único advérbio.
- source_word: אֹרֶךְ
  choice: de comprimento
  rationale: A formulação nominal é natural em português na descrição de dimensões e mantém o sentido preciso da medida longitudinal.
- source_word: חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: vinte e cinco côvados
  rationale: Emprega a ordem numérica moderna e conserva o côvado como unidade antiga convencional.
- source_word: רֹחַב
  choice: de largura
  rationale: Mantém o paralelismo natural em português com «de comprimento».
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: Tradução direta da medida de largura, preservando a unidade antiga.
