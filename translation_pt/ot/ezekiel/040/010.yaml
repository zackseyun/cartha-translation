  yaml_path: translation/ot/ezekiel/040/010.yaml
  text: And the guardrooms of the gate facing east were three on this side and three on that side[a]; the three of them had one measure[b], and the side pillars had one measure on this side and on that side.
translation:
  language: pt
  text: As salas da guarda do portão voltado para o leste eram três de um lado e três do outro[a]. As três tinham as mesmas medidas, e os pilares laterais[b] de ambos os lados também tinham as mesmas medidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salas laterais”; o termo hebraico se refere a pequenas câmaras integradas à estrutura do portão.
    reason: lexical_alternative
  - marker: b
    text: Ou “ombreiras” ou “pilastras”; o sentido exato deste termo arquitetônico na visão do templo de Ezequiel é discutido.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָאֵי
  choice: salas da guarda
  rationale: O termo designa pequenas câmaras integradas à estrutura do portão. “Salas da guarda” é claro e natural no contexto, embora a função exata não seja explicitada pelo termo hebraico; por isso, a alternativa mais formal é registrada em nota.
- source_word: הַשַּׁעַר
  choice: o portão
  rationale: Tradução corrente de שַׁעַר, adequada à entrada monumental descrita na visão.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: voltado para o leste
  rationale: Expressa naturalmente a orientação indicada pela construção hebraica, literalmente relacionada à direção do leste.
- source_word: שְׁלֹשָׁה מִפֹּה וּשְׁלֹשָׁה מִפֹּה
  choice: três de um lado e três do outro
  rationale: Reproduz com clareza a disposição simétrica das câmaras nos lados opostos da passagem.
- source_word: מִדָּה אַחַת לִשְׁלָשְׁתָּם
  choice: As três tinham as mesmas medidas
  rationale: Comunica a igualdade das dimensões entre as três câmaras em português natural; o singular coletivo “medida” do hebraico indica uniformidade dimensional.
- source_word: אֵילִם
  choice: pilares laterais
  rationale: O termo arquitetônico exato é discutido. “Pilares laterais” comunica de modo acessível a ideia de elementos verticais da estrutura sem adotar uma identificação técnica excessivamente específica.
- source_word: וּמִדָּה אַחַת לָאֵילִם מִפֹּה וּמִפּוֹ
  choice: os pilares laterais de ambos os lados também tinham as mesmas medidas
  rationale: Preserva o paralelismo e a simetria do hebraico, indicando que os elementos estruturais dos dois lados possuíam dimensões iguais.
