base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/016.yaml
  text: And there were recessed windows toward the guardrooms and toward their side pillars[a], inward, all around the gate; and likewise for the porticos. And windows were all around on the inside[c][b], and on each pillar were palm-tree decorations.
translation:
  language: pt
  text: Havia janelas recuadas voltadas para as salas da guarda e para seus pilares laterais[a], para o interior, em toda a volta do portal; o mesmo se aplicava aos pórticos[c]. Havia janelas ao redor, voltadas para o interior, e em cada pilar[b] havia decorações de palmeiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “janelas fechadas”, “janelas estreitas” ou “janelas com molduras recuadas”. O adjetivo hebraico provavelmente descreve uma forma arquitetônica específica, não janelas que impediam por completo a entrada de luz.
    reason: lexical_alternative
  - marker: b
    text: Os termos hebraicos traduzidos por “pilares laterais” e “pilar” são vocabulário arquitetônico difícil; outras traduções possíveis são “ombreiras” ou “pilastras”.
    reason: lexical_alternative
  - marker: c
    text: Ou “vestíbulos”, “alpendres” ou “varandas cobertas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלֹּנוֹת אֲטֻמוֹת
  choice: janelas recuadas
  rationale: חַלֹּנוֹת significa normalmente “janelas”; o adjetivo אֲטֻמוֹת parece indicar uma forma arquitetônica fechada, estreita ou reentrante. “Recuadas” evita sugerir que não deixavam passar luz e comunica uma provável característica estrutural.
- source_word: הַתָּאִים
  choice: as salas da guarda
  rationale: No contexto dos portais de Ezequiel 40, o termo designa os compartimentos laterais do conjunto do portal, provavelmente usados por guardas.
- source_word: אֵלֵיהֶמָה
  choice: seus pilares laterais
  rationale: Vocabulário arquitetônico difícil derivado de אַיִל; pode designar pilares, ombreiras ou pilastras laterais. A escolha é clara em português sem eliminar as alternativas em nota.
- source_word: לִפְנִימָה
  choice: no interior / parte interna
  rationale: O advérbio indica orientação ou localização para dentro. As duas formulações naturais em português preservam esse sentido nas duas ocorrências.
- source_word: לַשַּׁעַר
  choice: o portal
  rationale: Neste contexto, שַׁעַר abrange o conjunto arquitetônico da entrada, não apenas uma porta móvel; “portal” expressa isso com naturalidade.
- source_word: סָבִיב סָבִיב
  choice: ao redor de todo / por toda
  rationale: A repetição hebraica intensifica a ideia de distribuição em todos os lados; a tradução varia idiomaticamente conforme a frase.
- source_word: אֵלַמּוֹת
  choice: os pórticos
  rationale: O termo designa estruturas cobertas semelhantes a alpendres ou vestíbulos junto às entradas. “Pórticos” é um equivalente arquitetônico claro.
- source_word: אַיִל
  choice: pilar
  rationale: O singular tem provável valor distributivo, “em cada pilar”. O termo também pode significar ombreira ou pilastra, conforme registrado na nota.
- source_word: תִּמֹרִים
  choice: decorações de palmeiras
  rationale: No contexto arquitetônico, refere-se a figuras ou motivos ornamentais de palmeiras, não a árvores plantadas.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe longa do hebraico foi dividida em duas frases, preservando a distribuição das janelas e dos ornamentos. “Portal” foi preferido a “porta” para indicar o conjunto arquitetônico.
