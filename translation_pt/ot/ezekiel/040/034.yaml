  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: pt
  text: Seu pórtico dava para o pátio exterior, e havia palmeiras[a] em suas ombreiras[b], de um lado e do outro; oito degraus conduziam até ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entalhes de palmeiras”; o termo significa literalmente “palmeiras”, mas neste contexto arquitetônico provavelmente se refere a motivos decorativos.
    reason: lexical_alternative
  - marker: b
    text: Ou “pilares laterais” em vez de “ombreiras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַמּוֹ
  choice: Seu pórtico
  rationale: אֵלָם, no contexto arquitetônico das portas do templo, designa o pórtico ou vestíbulo projetado; “pórtico” é natural e preciso em português.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: dava para o pátio exterior
  rationale: A preposição ל indica aqui orientação espacial; “dava para” expressa isso de modo idiomático sem acrescentar uma direção não especificada.
- source_word: וְתִמֹרִים
  choice: e havia palmeiras
  rationale: תִמֹרִים significa literalmente “palmeiras”. No contexto, provavelmente são motivos decorativos entalhados, possibilidade mantida em nota.
- source_word: אֶל־אֵלָיו
  choice: nas suas ombreiras
  rationale: No refrão arquitetônico desta seção, אֵילָיו refere-se aos elementos laterais ou batentes da porta; “ombreiras” é um termo arquitetônico claro em português.
- source_word: מִפֹּה וּמִפֹּה
  choice: de um lado e do outro
  rationale: A expressão indica disposição bilateral e preserva o caráter distributivo do hebraico.
- source_word: וּשְׁמֹנֶה מַעֲלוֹת מַעֲלוֹ
  choice: oito degraus conduziam até ele
  rationale: מַעֲלוֹת são degraus de subida, e מַעֲלוֹ indica a subida até a estrutura; a formulação portuguesa explicita naturalmente essa função.
