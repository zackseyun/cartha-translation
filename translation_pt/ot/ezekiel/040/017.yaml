    rationale: O hebraico distingue עָשׂוּי לֶחָצֵר (“feito/preparado para o pátio”) de סָבִיב סָבִיב (“ao redor, por toda a volta”). A redação revista explicita ambas as informações sem acrescentar detalhes construtivos.
