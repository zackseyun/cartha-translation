- from: Então ele me levou ao pátio externo. Vi ali câmaras e um piso pavimentado, feito ao redor de todo o pátio; havia trinta câmaras junto ao piso pavimentado.[a]
  to: Então ele me levou ao pátio externo. Ali havia câmaras e um pavimento feito para o pátio, que se estendia por toda a volta; havia trinta câmaras junto ao pavimento.[a]
