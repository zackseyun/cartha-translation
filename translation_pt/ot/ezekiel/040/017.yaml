base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/017.yaml
  text: Then he brought me into the outer court[a], and behold, there were chambers and a pavement made for the court all around, all around; thirty chambers were on the pavement.
translation:
  language: pt
  text: Então ele me levou ao pátio externo. Ali havia câmaras e um pavimento feito para o pátio, que se estendia por toda a volta; havia trinta câmaras junto ao pavimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre o pavimento” ou “voltadas para o pavimento”. O hebraico diz literalmente “trinta câmaras para o pavimento”, deixando imprecisa a relação espacial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Então ele me levou
  rationale: O wayyiqtol de בוא dá continuidade à sequência narrativa; “Então” expressa naturalmente esse avanço, e “me levou” preserva a ação do guia sobre Ezequiel.
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: ao pátio externo
  rationale: חָצֵר designa pátio ou átrio. “Pátio externo” é claro no contexto arquitetônico e acessível no português contemporâneo.
- source_word: וְהִנֵּה
  choice: Vi ali
  rationale: הִנֵּה chama a atenção para o que se apresenta à vista. “Vi ali” transmite sua função deíctica no relato em primeira pessoa sem recorrer ao arcaizante “e eis”.
- source_word: לְשָׁכוֹת
  choice: câmaras
  rationale: לִשְׁכָּה, em contexto de templo ou edifício, indica aposentos ou salas; “câmaras” mantém o caráter arquitetônico e solene.
- source_word: וְרִצְפָה
  choice: e um piso pavimentado
  rationale: רִצְפָה designa uma superfície pavimentada. “Piso pavimentado” é mais imediatamente compreensível que o substantivo isolado “pavimento”, que também pode indicar um andar de edifício.
- source_word: עָשׂוּי לֶחָצֵר
  choice: feito ... [no] pátio
  rationale: O particípio passivo עָשׂוּי com ל descreve o piso preparado ou feito em relação ao pátio; a formulação portuguesa evita especificar indevidamente o método de construção.
- source_word: סָבִיב סָבִיב
  choice: ao redor de todo
  rationale: A duplicação hebraica intensifica a abrangência espacial. Em português natural, “ao redor de todo o pátio” comunica essa totalidade sem uma repetição pouco idiomática.
- source_word: שְׁלֹשִׁים לְשָׁכוֹת
  choice: trinta câmaras
  rationale: Tradução direta do numeral com o substantivo, mantendo consistência com a primeira ocorrência de לְשָׁכוֹת.
- source_word: אֶל הָרִצְפָה
  choice: junto ao piso pavimentado
  rationale: A preposição אֶל indica aqui uma relação espacial cuja precisão é discutível. “Junto ao” expressa associação ou proximidade sem afirmar categoricamente que as câmaras estavam sobre o piso ou voltadas para ele.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção foi reorganizada em duas frases para clareza, sem alterar a sequência visual. Evitou-se “e eis”, por soar arcaico, e preservou-se em nota a ambiguidade arquitetônica de אֶל הָרִצְפָה.
