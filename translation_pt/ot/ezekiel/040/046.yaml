  text: וְ/הַ/לִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨י/הָ֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן לַ/כֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ הֵ֣מָּה בְנֵֽי צָד֗וֹק הַ/קְּרֵבִ֧ים מִ/בְּנֵֽי לֵוִ֛י אֶל יְהוָ֖ה לְ/שָׁרְתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/046.yaml
  text: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
translation:
  language: pt
  text: E a sala cuja frente dá para o norte é destinada aos sacerdotes encarregados do altar. Eles são os filhos de Zadoque, os que, dentre os filhos de Levi, se aproximam de Yahweh para servi-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִּשְׁכָּה
  choice: sala
  rationale: No contexto arquitetônico do templo, designa um recinto específico. “Sala” é natural e claro em português contemporâneo, sem sugerir necessariamente um aposento residencial.
- source_word: פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן
  choice: cuja frente dá para o norte
  rationale: A expressão descreve a orientação da construção. A formulação preserva a ideia de “frente” e soa natural em português.
- source_word: לַכֹּהֲנִים
  choice: é destinada aos sacerdotes
  rationale: O לְ marca destinação ou atribuição; o verbo foi suprido para formar uma frase completa e idiomática em português.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ
  choice: encarregados do altar
  rationale: O idioma שׁמר משׁמרת indica guardar uma incumbência ou cumprir uma responsabilidade cultual, não apenas vigiar fisicamente.
- source_word: בְנֵי צָדוֹק
  choice: os filhos de Zadoque
  rationale: Mantém a expressão genealógica formal do hebraico e a ênfase na linhagem sacerdotal.
- source_word: הַקְּרֵבִים
  choice: os que ... se aproximam
  rationale: Preserva a linguagem sacerdotal de aproximação a Deus para o serviço sagrado.
- source_word: מִבְּנֵי לֵוִי
  choice: dentre os filhos de Levi
  rationale: Expressa a força partitiva de מִן e mantém a formulação familiar do texto hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino pessoal em vez de substituí-lo por um título.
- source_word: לְשָׁרְתוֹ
  choice: para servi-lo
  rationale: “Servir” comunica de modo natural o serviço sacerdotal prestado a Yahweh; o contexto já deixa claro seu caráter sagrado.
theological_decisions:
- issue: O privilégio sacerdotal dos filhos de Zadoque dentro da ordem levítica
  choice: O texto identifica os filhos de Zadoque como o grupo, dentre os filhos de Levi, que se aproxima de Yahweh para o serviço do altar.
  alternative: Entender a referência como abrangendo indistintamente todos os levitas.
  rationale: A redação hebraica distingue explicitamente os filhos de Zadoque dentro do grupo maior dos filhos de Levi, sem desenvolver implicações teológicas além dessa identificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a terminologia arquitetônica e sacerdotal sem arcaísmos desnecessários.
