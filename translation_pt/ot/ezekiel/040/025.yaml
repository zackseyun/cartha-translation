  text: And it had windows all around[a], and its porch also had windows all around, like these windows. The length was fifty cubits, and the width twenty-five cubits.
translation:
  language: pt
  text: Havia janelas por toda a volta nele e em seu pórtico, como estas janelas. O comprimento era de cinquenta côvados, e a largura, de vinte e cinco côvados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַלּוֹנִים
  choice: janelas
  rationale: O substantivo designa as janelas ou aberturas da estrutura do portão; “janelas” é a forma mais natural e coerente com a descrição arquitetônica repetida no capítulo.
- source_word: לוֹ
  choice: Havia ... ao redor dele
  rationale: A construção hebraica indica que a estrutura descrita possuía janelas. Em português, a formulação existencial evita o artificial “havia para ele” e mantém claro o referente masculino.
- source_word: וְלְאֵילָמָו
  choice: e também ao redor do seu pórtico
  rationale: אֵילָם designa a área saliente ou coberta ligada ao portão. “Pórtico” é um termo arquitetônico corrente e digno; a presença de janelas é recuperada naturalmente pelo contexto coordenado.
- source_word: סָבִיב סָבִיב
  choice: ao redor
  rationale: A repetição hebraica reforça a ideia de distribuição por todos os lados. “Ao redor” comunica isso de maneira natural, sem uma duplicação pouco idiomática em português.
- source_word: כְּהַחֲלֹּנוֹת הָאֵלֶּה
  choice: semelhantes àquelas janelas
  rationale: A expressão estabelece comparação com as janelas anteriormente descritas. “Aquelas” torna clara em português a referência anafórica, embora o hebraico use literalmente o demonstrativo “estas”.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: O comprimento era de cinquenta côvados
  rationale: Preserva a fórmula arquitetônica de medição em português natural e mantém a unidade antiga do texto.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: e a largura, de vinte e cinco côvados
  rationale: Reproduz de forma clara a medida da largura; a elipse verbal é natural em português e corresponde ao paralelismo do hebraico.
