  naturalness: O texto é claro e de registro adequado. “Por toda a volta nele e em seu pórtico” expressa de modo mais direto a distribuição arquitetônica indicada pelo hebraico, sem perder fluência em português contemporâneo.
  terminology: “Janelas”, “pórtico” e “côvados” são escolhas apropriadas. “Pórtico” mantém o sentido arquitetônico de אֵילָם sem impor uma interpretação mais específica.
