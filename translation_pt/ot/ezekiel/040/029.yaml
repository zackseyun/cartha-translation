  yaml_path: translation/ot/ezekiel/040/029.yaml
  text: And its guardroom[a], its side pillars, and its porch were according to these measurements; and it had windows, and its porch had windows, all around. The length was fifty cubits[b], and the width twenty-five cubits.
translation:
  language: pt
  text: A sala da guarda[a], seus pilares laterais[b] e seu vestíbulo[c] eram conforme estas medidas. Havia janelas nela e em seu vestíbulo, em toda a volta. O comprimento era de cinquenta côvados[d], e a largura, de vinte e cinco côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “câmara”, “câmara do portão” ou “cela”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ombreiras”, “pilastras” ou “postes”.
    reason: lexical_alternative
  - marker: c
    text: Ou “pórtico”.
    reason: lexical_alternative
  - marker: d
    text: O côvado era uma medida de comprimento baseada no antebraço; seu valor exato podia variar.
    reason: measurement_clarification
lexical_decisions:
- source_word: תָּא
  choice: sala da guarda
  rationale: No contexto arquitetônico dos portões da visão de Ezequiel, designa uma pequena câmara ligada ao portão. “Sala da guarda” é clara e contextual, sem reduzir o termo a uma cela.
- source_word: אַיִל
  choice: pilar lateral
  rationale: O termo indica um elemento vertical estrutural do portão. “Pilar lateral” é compreensível em português corrente e mantém a referência arquitetônica.
- source_word: אֵילָם
  choice: vestíbulo
  rationale: Designa a área de entrada coberta ou saliente da estrutura. “Vestíbulo” é natural no registro arquitetônico e evita a possível ideia doméstica de “varanda”.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: tinham as mesmas medidas que os anteriores
  rationale: A expressão assinala conformidade com as dimensões já apresentadas. A explicitação de “os anteriores” torna a referência natural em português sem acrescentar uma medida nova.
- source_word: חַלּוֹנוֹת
  choice: janelas
  rationale: É o sentido usual do termo; o versículo não exige que se especifique se eram gradeadas ou estreitas.
- source_word: סָבִיב סָבִיב
  choice: ao redor
  rationale: A duplicação hebraica reforça a distribuição circundante. “Ao redor” comunica isso de modo idiomático.
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: O comprimento era de cinquenta côvados
  rationale: Preserva explicitamente a primeira dimensão e o estilo de descrição arquitetônica.
- source_word: וְרֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: e a largura, de vinte e cinco côvados
  rationale: Mantém a estrutura coordenada e apresenta claramente a segunda dimensão.
- source_word: לּוֹ ... וְלְאֵילָמוֹ
  choice: Havia janelas nela e em seu vestíbulo
  rationale: Expressa com clareza a localização das janelas tanto na estrutura mencionada quanto no vestíbulo.
