  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וַ/יְבִאֵ/נִי֮ אֶל אֻלָ֣ם הַ/בַּיִת֒ וַ/יָּ֨מָד֙ אֵ֣ל אֻלָ֔ם חָמֵ֤שׁ אַמּוֹת֙ מִ/פֹּ֔ה וְ/חָמֵ֥שׁ אַמּ֖וֹת מִ/פֹּ֑ה וְ/רֹ֣חַב הַ/שַּׁ֔עַר שָׁלֹ֤שׁ אַמּוֹת֙ מִ/פּ֔וֹ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת מִ/פּֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/048.yaml
  text: 'Then he brought me to the vestibule of the house[a], and he measured the jambs of the vestibule: five cubits on this side and five cubits on that side[c][b]; and the width of the gate was three cubits on this side and three cubits on that side.'
translation:
  language: pt
  text: 'Então ele me levou ao pórtico da Casa[a] e mediu os pilares laterais do pórtico[b]: cinco côvados de um lado e cinco côvados do outro. A largura da entrada era de três côvados de um lado e três côvados do outro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o edifício do templo na visão.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico é arquitetônico e também pode ser traduzido por “ombreiras” ou “postes laterais”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֻלָם
  choice: pórtico
  rationale: No contexto da arquitetura do templo, designa o espaço coberto de entrada diante do edifício principal. “Pórtico” é natural e arquitetonicamente adequado em português.
- source_word: הַבַּיִת
  choice: a Casa
  rationale: Preserva o sentido literal do hebraico e sua possível ressonância teológica, enquanto a nota esclarece que se trata do edifício do templo na visão.
- source_word: אֵל אֻלָם
  choice: os pilares laterais do pórtico
  rationale: אֵל é aqui um termo arquitetônico para as estruturas laterais da entrada, não a palavra comum para “Deus”. “Pilares laterais” comunica de modo claro a disposição bilateral indicada pelas medidas.
- source_word: חָמֵשׁ אַמּוֹת ... מִפֹּה וְחָמֵשׁ אַמּוֹת מִפֹּה
  choice: cinco côvados de um lado e cinco côvados do outro
  rationale: As expressões dêiticas distinguem os dois lados correspondentes; esta formulação é idiomática e clara em português.
- source_word: רֹחַב הַשַּׁעַר
  choice: a largura da entrada
  rationale: Embora שַׁעַר possa significar “portão” ou “portal”, neste contexto a medida parece referir-se à abertura de entrada; “entrada” evita sugerir necessariamente uma folha de portão.
- source_word: שָׁלֹשׁ אַמּוֹת מִפּוֹ וְשָׁלֹשׁ אַמּוֹת מִפּוֹ
  choice: três côvados de um lado e três côvados do outro
  rationale: Mantém o paralelismo e a referência às duas partes laterais da entrada.
- source_word: וַיְבִאֵנִי ... וַיָּמָד
  choice: Então ele me levou ... e mediu
  rationale: A sequência verbal faz avançar a narrativa da visão; “Então” produz fluidez natural sem acrescentar conteúdo interpretativo.
theological_decisions:
- issue: Identificação de הַבַּיִת
  choice: Manter “a Casa” no texto e explicar que é o edifício do templo
  alternative: Traduzir diretamente “o templo”
  rationale: A opção preserva a formulação e a ressonância do hebraico sem deixar obscuro o referente arquitetônico.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia arquitetônica compreensível. “Casa” recebe inicial maiúscula para sinalizar seu uso como designação do edifício sagrado sem substituir a expressão hebraica por uma interpretação explícita.
