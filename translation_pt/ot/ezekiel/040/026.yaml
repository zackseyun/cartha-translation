  text: And its ascent had seven steps[a], with its vestibule before them; and it had palm-tree ornaments, one on this side and one on that side[b], on its jambs.
translation:
  language: pt
  text: Sua subida tinha sete degraus, e seu vestíbulo[a] ficava diante deles. Em suas ombreiras[b] havia ornamentos em forma de palmeira, um de cada lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pórtico”.
    reason: lexical_alternative
  - marker: b
    text: Ou “postes” ou “pilares laterais”.
