lexical_decisions:
- source_word: מַעֲלוֹת שִׁבְעָה ... עֲלוֹתוֹ
  choice: Sete degraus levavam até ele
  rationale: Expressa de modo natural em português a subida de sete degraus até o portão, preservando o sentido arquitetônico da construção hebraica, cuja forma textual é difícil.
- source_word: וְאֵילַמּוֹ
  choice: seu vestíbulo
  rationale: No contexto da visão do templo, אֵילָם designa a estrutura de entrada do portão. “Vestíbulo” é uma opção arquitetônica clara; “pórtico” continua possível.
- source_word: לִפְנֵיהֶם
  choice: ficava diante deles
  rationale: Mantém o plural do hebraico e a relação espacial do vestíbulo com os degraus.
- source_word: וְתִמֹרִים
  choice: ornamentos em forma de palmeira
  rationale: O contexto arquitetônico indica motivos decorativos, não palmeiras vivas.
- source_word: אֶחָד מִפּוֹ וְאֶחָד מִפּוֹ
  choice: um de cada lado
  rationale: Equivalente idiomático e conciso da expressão distributiva hebraica, que descreve disposição simétrica.
- source_word: אֵילָו
  choice: suas ombreiras
  rationale: O termo se refere aos elementos estruturais laterais do portão; “ombreiras” é preciso em português, embora “postes” ou “pilares laterais” também sejam possíveis.
