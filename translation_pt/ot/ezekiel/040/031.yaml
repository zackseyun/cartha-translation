base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/031.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, and eight steps went up to it.
translation:
  language: pt
  text: Seu pórtico dava para o pátio externo[a]; havia palmeiras em suas ombreiras, e oito degraus levavam até ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu vestíbulo dava para o pátio externo; havia palmeiras em suas pilastras”. Os termos arquitetônicos hebraicos de Ezequiel 40 são especializados e podem ser traduzidos de maneiras diferentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלַמּוֹ
  choice: seu pórtico
  rationale: No contexto arquitetônico da visão de Ezequiel, אֵלָם designa a estrutura de entrada projetada; “pórtico” é natural, digno e evita a possível ideia de um espaço estritamente interior sugerida por “vestíbulo”.
- source_word: אֶל חָצֵר הַחִיצוֹנָה
  choice: dava para o pátio externo
  rationale: A preposição direcional אֶל, em uma oração nominal, indica a orientação do pórtico. “Dava para” expressa isso de modo idiomático em português.
- source_word: תִמֹרִים
  choice: palmeiras
  rationale: O termo denota formas de palmeira usadas na ornamentação arquitetônica. “Palmeiras” preserva a expressão concreta do hebraico, enquanto o contexto deixa claro seu caráter decorativo.
- source_word: אֵילָו
  choice: suas ombreiras
  rationale: Em Ezequiel 40, o termo se refere aos elementos estruturais laterais de uma abertura. “Ombreiras” é preciso e compreensível; “pilastras” também é possível.
- source_word: מַעֲלוֹת שְׁמוֹנֶה
  choice: oito degraus
  rationale: A expressão indica o número de degraus da subida, e “oito degraus” é a formulação mais direta e natural em português.
- source_word: מַעֲלוֹ
  choice: levavam até ele
  rationale: O substantivo com sufixo descreve a subida ou acesso ao pórtico. Em português, “oito degraus levavam até ele” comunica naturalmente essa relação arquitetônica.
