  text: וְ/אַרְבָּעָה֩ שֻׁלְחָנ֨וֹת לָ/עוֹלָ֜ה אַבְנֵ֣י גָזִ֗ית אֹרֶךְ֩ אַמָּ֨ה אַחַ֤ת וָ/חֵ֨צִי֙ וְ/רֹ֨חַב אַמָּ֤ה אַחַת֙ וָ/חֵ֔צִי וְ/גֹ֖בַהּ אַמָּ֣ה אֶחָ֑ת אֲלֵי/הֶ֗ם וְ/יַנִּ֤יחוּ אֶת הַ/כֵּלִים֙ אֲשֶׁ֨ר יִשְׁחֲט֧וּ אֶת הָ/עוֹלָ֛ה בָּ֖/ם וְ/הַ/זָּֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/042.yaml
  text: And four tables for the burnt offering were of cut stone[a], a cubit and a half long, a cubit and a half wide, and one cubit high[b]. On them they placed the implements with which they slaughtered the burnt offering and the sacrifice.
translation:
  language: pt
  text: Quatro mesas para o holocausto eram de pedra lavrada[a], cada uma com um côvado e meio de comprimento, um côvado e meio de largura e um côvado de altura. Sobre elas colocavam os utensílios com que abatiam o holocausto e o sacrifício[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pedra talhada”.
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico zévaḥ pode significar “sacrifício” em geral; em alguns contextos, refere-se mais especificamente a um sacrifício pacífico, também chamado oferta de comunhão.
    reason: alternative_reading
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: mesas
  rationale: O substantivo designa mesas ou superfícies semelhantes a mesas; a função sacrificial já é indicada pelo restante do versículo.
- source_word: לָעוֹלָה
  choice: para o holocausto
  rationale: עוֹלָה é o termo usual para a oferta inteiramente queimada, e a preposição ל indica finalidade ou destinação.
- source_word: אַבְנֵי גָזִית
  choice: de pedra lavrada
  rationale: A expressão designa pedra cortada e trabalhada; “pedra lavrada” é uma formulação clara e digna em português.
- source_word: אַמָּה אַחַת וָחֵצִי
  choice: um côvado e meio
  rationale: Mantém a unidade antiga e reproduz naturalmente a medida hebraica.
- source_word: וְגֹבַהּ אַמָּה אֶחָת
  choice: um côvado de altura
  rationale: Expressa de modo natural o sentido literal de “sua altura era de um côvado”.
- source_word: וְיַנִּיחוּ
  choice: colocavam
  rationale: O yiqtol pode ter sentido habitual ou funcional neste relatório visionário; o imperfeito português comunica o uso costumeiro das mesas.
- source_word: הַכֵּלִים
  choice: os utensílios
  rationale: כֵּלִים é um termo amplo para objetos, instrumentos ou recipientes; no contexto, “utensílios” é específico sem identificar ferramentas não nomeadas.
- source_word: אֲשֶׁר יִשְׁחֲטוּ ... בָּם
  choice: com que abatiam
  rationale: A construção apresenta os utensílios como o meio empregado no abate sacrificial; “abatiam” conserva essa ação sem linguagem excessivamente técnica.
- source_word: הָעוֹלָה
  choice: o holocausto
  rationale: Mantém de forma coerente o mesmo termo sacrificial usado no início do versículo.
- source_word: וְהַזָּבַח
  choice: e o sacrifício
  rationale: זֶבַח pode designar um sacrifício em sentido amplo e não precisa ser restringido aqui a uma categoria específica.
theological_decisions:
- issue: Especificidade de זֶבַח na terminologia sacrificial
  choice: o sacrifício
  alternative: o sacrifício pacífico / a oferta de comunhão
  rationale: O termo hebraico pode indicar sacrifício em geral ou, em certos contextos, uma oferta específica de comunhão. Como o versículo não exige a leitura mais estreita, o texto principal preserva o sentido amplo e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém “côvado” como unidade antiga e usa o aspecto habitual em “colocavam” e “abatiam”. “Cada uma” explicita naturalmente que as medidas se aplicam às quatro mesas.
