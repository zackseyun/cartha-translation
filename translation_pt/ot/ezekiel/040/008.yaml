  text: 'Then he measured the vestibule of the gate on the inside: one rod[a][b].'
translation:
  language: pt
  text: 'Então ele mediu o vestíbulo do portão, no lado interno[b]: uma vara de medir[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma cana”. O termo hebraico pode designar uma cana usada como vara de medir.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “da casa”. Na visão do templo em Ezequiel, “a casa” muitas vezes se refere ao templo; a nuance espacial exata da preposição aqui é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa esse avanço com naturalidade em português.
- source_word: אֻלָם
  choice: vestíbulo
  rationale: Designa o espaço coberto de entrada do portão; “vestíbulo” é claro e arquitetonicamente adequado.
- source_word: הַשַּׁעַר
  choice: do portão
  rationale: Traduz diretamente a estrutura de acesso mencionada no contexto da visão.
- source_word: מֵהַבַּיִת
  choice: do lado do templo
  rationale: בַּיִת refere-se aqui provavelmente ao templo, enquanto a preposição מִן tem nuance espacial difícil. A formulação indica orientação sem fingir precisão maior que a do hebraico.
- source_word: קָנֶה אֶחָד
  choice: uma vara
  rationale: No contexto, קָנֶה é uma cana usada como instrumento de medição; “vara” comunica de modo natural sua função e preserva a unidade mencionada.
