  text: בְּ/עֶשְׂרִ֣ים וְ/חָמֵ֣שׁ שָׁנָ֣ה לְ֠/גָלוּתֵ/נוּ בְּ/רֹ֨אשׁ הַ/שָּׁנָ֜ה בֶּ/עָשׂ֣וֹר לַ/חֹ֗דֶשׁ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ שָׁנָ֔ה אַחַ֕ר אֲשֶׁ֥ר הֻכְּתָ֖ה הָ/עִ֑יר בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה הָיְתָ֤ה עָלַ/י֙ יַד יְהוָ֔ה וַ/יָּבֵ֥א אֹתִ֖/י שָֽׁמָּ/ה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/001.yaml
  text: In the twenty-fifth year of our exile[a], at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city had been struck down, on that very day the hand of Yahweh was upon me[b], and he brought me there.
translation:
  language: pt
  text: No vigésimo quinto ano do nosso exílio, no início do ano[a], no décimo dia do mês, no décimo quarto ano depois que a cidade foi derrubada[b], naquele mesmo dia, a mão de Yahweh esteve sobre mim, e ele me levou para lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “na cabeça do ano”. A expressão pode se referir à celebração do Ano-Novo, mas também pode indicar simplesmente o início do ano.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi tomada” ou “caiu”. O hebraico emprega literalmente um verbo que significa “golpear” ou “abater”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגָלוּתֵנוּ
  choice: do nosso exílio
  rationale: גָּלוּת designa exílio ou deportação, e o sufixo de primeira pessoa do plural é preservado em “nosso”. “Exílio” é claro e não sugere mero encarceramento.
- source_word: בְּרֹאשׁ הַשָּׁנָה
  choice: no início do ano
  rationale: A expressão significa literalmente “na cabeça do ano”. A tradução idiomática mantém a referência temporal sem decidir que se trata necessariamente de uma festa específica de Ano-Novo.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: no décimo dia do mês
  rationale: Explicita naturalmente em português a data indicada pelo hebraico.
- source_word: הֻכְּתָה
  choice: foi derrubada
  rationale: O passivo de נכה comunica que a cidade sofreu um golpe destrutivo. “Foi derrubada” preserva a violência e a voz passiva, embora “foi tomada” também seja possível no contexto.
- source_word: הָעִיר
  choice: a cidade
  rationale: O hebraico não nomeia Jerusalém neste versículo; por isso, a tradução não acrescenta o nome, embora a referência seja clara no contexto.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: naquele mesmo dia
  rationale: A expressão enfatiza a exatidão e a identidade do dia mencionado.
- source_word: יַד יְהוָה
  choice: a mão de Yahweh
  rationale: Mantém a imagem profética recorrente da mão divina, que pode indicar poder, domínio ou impulso profético, sem reduzi-la a uma única interpretação.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, distinguindo-o de títulos como “Senhor”.
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: e ele me levou para lá
  rationale: “Para lá” reproduz o destino não especificado de שָׁמָּה, e o pronome retoma naturalmente Yahweh como agente.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome próprio divino, não apenas um título. “Yahweh” o representa diretamente e evita substituir o nome por uma interpretação tradicional.
- issue: Sentido da expressão “a mão de Yahweh esteve sobre mim”
  choice: Preservar a metáfora corporal
  alternative: O poder de Yahweh veio sobre mim
  rationale: A metáfora é característica da experiência profética de Ezequiel e pode abranger poder, domínio e impulso revelador. Traduzir simplesmente por “poder” resolveria uma tensão que o hebraico deixa aberta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A longa sequência cronológica do hebraico foi mantida, mas com formulações naturais. As metáforas proféticas e a referência não especificada a “a cidade” foram preservadas.
