  text: אַרְבָּעָ֨ה שֻׁלְחָנ֜וֹת מִ/פֹּ֗ה וְ/אַרְבָּעָ֧ה שֻׁלְחָנ֛וֹת מִ/פֹּ֖ה לְ/כֶ֣תֶף הַ/שָּׁ֑עַר שְׁמוֹנָ֥ה שֻׁלְחָנ֖וֹת אֲלֵי/הֶ֥ם יִשְׁחָֽטוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/041.yaml
  text: Four tables on this side and four tables on that side[a], by the side of the gate—eight tables[c][b]; on them they slaughtered.
translation:
  language: pt
  text: Quatro mesas de um lado e quatro mesas do outro lado[a], junto à lateral do portão[b] — oito mesas; sobre elas se fazia o abate[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deste lado e daquele lado”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “junto ao ombro do portão”; trata-se de uma expressão para a lateral ou o flanco da estrutura do portão.
    reason: cultural_note
  - marker: c
    text: 'Ou: “sobre elas fariam o abate” ou “sobre elas abaterão”. O imperfeito hebraico pode indicar ação habitual, finalidade prevista ou ação futura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  choice: Quatro
  rationale: Número cardinal direto que introduz o primeiro conjunto de mesas.
- source_word: שֻׁלְחָנוֹת
  choice: mesas
  rationale: O substantivo significa simplesmente “mesas”; sua função é indicada pela oração final, sem necessidade de acrescentá-la ao nome.
- source_word: מִפֹּה ... מִפֹּה
  choice: de um lado ... do outro lado
  rationale: A expressão deítica repetida assinala lados opostos; esta formulação é natural em português e preserva o contraste espacial.
- source_word: לְכֶתֶף הַשָּׁעַר
  choice: junto à lateral do portão
  rationale: כָּתֵף significa literalmente “ombro”, mas, em contexto arquitetônico, designa a lateral ou o flanco de uma estrutura.
- source_word: שְׁמוֹנָה
  choice: oito
  rationale: Número cardinal que resume o total dos dois conjuntos de quatro mesas.
- source_word: אֲלֵיהֶם
  choice: sobre elas
  rationale: Indica as mesas como superfície ou local em que ocorria o abate.
- source_word: יִשְׁחָטוּ
  choice: se fazia o abate
  rationale: O imperfeito hebraico pode descrever a função prevista ou habitual das mesas. A construção impessoal evita identificar agentes não expressos e não restringe a forma a um único ato passado.
