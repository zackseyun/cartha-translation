base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/043.yaml
  text: And hooks[a], a handbreadth long, were fastened all around inside the house, and on the tables was the flesh of the offering.
translation:
  language: pt
  text: E havia ganchos[a] de um palmo de comprimento, fixados por toda parte no interior do edifício; sobre as mesas ficava a carne da oferta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido como “ganchos” é incerto; também pode designar saliências ou outro tipo de peça usada na área de abate.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁפַתַּיִם
  choice: ganchos
  rationale: O substantivo é raro e de sentido incerto. No contexto da área de abate e das mesas, “ganchos” designa de modo plausível utensílios ou peças destinados a pendurar carne ou instrumentos; a incerteza é registrada em nota.
- source_word: טֹפַח אֶחָד
  choice: de um palmo de comprimento
  rationale: טֹפַח é uma pequena medida correspondente à largura da mão. A formulação explicita naturalmente que se trata da dimensão dos ganchos, sem substituir a unidade concreta do hebraico.
- source_word: מוּכָנִים
  choice: fixados
  rationale: O particípio passivo de כון pode indicar algo estabelecido ou colocado firmemente. “Fixados” combina com o provável referente “ganchos” e conserva a ideia de instalação estável.
- source_word: בַּבַּיִת
  choice: no interior do edifício
  rationale: בַּיִת refere-se aqui ao edifício dentro do complexo do templo. “Edifício” evita sugerir uma residência comum, enquanto “no interior” expressa a localização contextual.
- source_word: סָבִיב סָבִיב
  choice: por toda parte
  rationale: A repetição intensifica a distribuição ao redor. A expressão portuguesa comunica de forma natural que os objetos estavam dispostos por todo o recinto.
- source_word: וְאֶל הַשֻּׁלְחָנוֹת
  choice: sobre as mesas
  rationale: Embora אֶל normalmente indique direção, neste enunciado descritivo comprimido expressa provavelmente relação espacial. “Sobre as mesas” produz o sentido mais coerente com a presença da carne mencionada em seguida.
- source_word: בְּשַׂר הַקָּרְבָן
  choice: a carne da oferta
  rationale: “Carne” é a correspondência portuguesa natural de בָּשָׂר neste contexto sacrificial, e “oferta” preserva o sentido cultual de קָרְבָּן sem acrescentar uma classificação não expressa no texto.
