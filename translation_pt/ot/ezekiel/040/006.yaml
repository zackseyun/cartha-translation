base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/006.yaml
  text: 'Then he came to the gate that faced east[a], and he went up its steps and measured the threshold of the gate: one reed wide. And the other threshold was one reed wide.'
translation:
  language: pt
  text: 'Então ele chegou ao portão cuja frente dava para o leste, subiu os seus degraus e mediu o umbral do portão: uma cana de largura. E o outro umbral[a], uma cana de largura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um umbral”. Pelo contexto, provavelmente se trata do umbral correspondente do outro lado do portão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר
  choice: portão
  rationale: No contexto arquitetônico, “portão” designa com clareza a entrada monumental e sua estrutura, sendo natural no português moderno.
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִימָה
  choice: cuja frente dava para o leste
  rationale: Preserva a imagem hebraica da “frente” do portão orientada na direção leste, em formulação portuguesa natural.
- source_word: במעלותיו
  choice: os seus degraus
  rationale: O plural se refere aos degraus pelos quais se subia até o portão; “degraus” é claro e arquitetonicamente adequado.
- source_word: סַף הַשַּׁעַר
  choice: o umbral do portão
  rationale: “Umbral” expressa a soleira ou peça inferior da entrada e mantém o caráter técnico da descrição.
- source_word: קָנֶה אֶחָד רֹחַב
  choice: uma cana de largura
  rationale: Mantém a unidade de medida própria da visão e traduz diretamente a indicação de largura.
- source_word: וְאֵת סַף אֶחָד
  choice: O outro umbral
  rationale: No contexto da estrutura pareada do portão, “outro” torna inteligível a referência ao umbral correspondente; a formulação literalmente mais próxima, “um umbral”, é preservada em nota.
- source_word: וַיָּבֹא ... וַיַּעַל ... וַיָּמָד
  choice: Então ele chegou ... subiu ... e mediu
  rationale: A sequência verbal hebraica apresenta ações sucessivas; os pretéritos e “Então” reproduzem naturalmente esse avanço narrativo.
