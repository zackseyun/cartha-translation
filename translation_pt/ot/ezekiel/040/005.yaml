base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/005.yaml
  text: 'And behold[a], there was a wall outside the house, all around, and in the hand of the man was a measuring reed of six cubits, each cubit being a cubit and a handbreadth. And he measured the width of the structure: one reed[b], and the height: one reed.'
translation:
  language: pt
  text: 'E eis que havia um muro do lado de fora da casa, ao redor, por todos os lados. O homem tinha na mão uma cana de medir de seis côvados, sendo cada côvado um côvado e um palmo[a]. Ele mediu a largura da estrutura[b]: uma cana; e a altura: uma cana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “seis côvados, segundo o côvado e um palmo”; isto é, usava-se o côvado longo, equivalente a um côvado comum mais um palmo.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “do edifício”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função dêitica e visionária da expressão hebraica, chamando a atenção para um novo elemento da visão.
- source_word: חוֹמָה
  choice: muro
  rationale: Equivalente corrente para uma parede externa substancial, sem acrescentar uma função defensiva que o contexto não explicita.
- source_word: מִחוּץ לַבַּיִת
  choice: do lado de fora da casa
  rationale: Mantém o sentido literal de בַּיִת, que no contexto pode designar a casa-templo, sem eliminar essa amplitude referencial.
- source_word: סָבִיב סָבִיב
  choice: ao redor de todo o conjunto
  rationale: Expressa idiomaticamente a repetição intensiva, indicando que o muro circundava toda a área.
- source_word: וּבְיַד הָאִישׁ
  choice: O homem tinha na mão
  rationale: Forma natural em português que preserva a imagem concreta do instrumento na mão do guia.
- source_word: קְנֵה הַמִּדָּה
  choice: uma cana de medir
  rationale: Identifica tanto o objeto antigo, uma cana, quanto sua função de instrumento de medição.
- source_word: שֵׁשׁ אַמּוֹת בָּאַמָּה וָטֹפַח
  choice: de seis côvados, sendo cada côvado um côvado e um palmo
  rationale: Mantém a unidade antiga e torna compreensível que se empregava o côvado longo, composto do côvado comum acrescido de um palmo.
- source_word: רֹחַב הַבִּנְיָן
  choice: a largura da estrutura
  rationale: Estrutura representa o sentido arquitetônico de בִּנְיָן e evita identificá-la sem necessidade com a casa já mencionada.
- source_word: קָנֶה אֶחָד
  choice: uma cana
  rationale: Conserva como resultado da medição a mesma unidade apresentada anteriormente.
- source_word: וְקוֹמָה
  choice: e a altura
  rationale: Altura é o equivalente arquitetônico natural para a extensão vertical indicada por קוֹמָה.
