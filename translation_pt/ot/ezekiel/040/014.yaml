  yaml_path: translation/ot/ezekiel/040/014.yaml
  text: And he made the jambs sixty cubits, and to the jamb of the court the gate extended all around.
translation:
  language: pt
  text: Fez os pilares laterais de sessenta côvados; e, até o pilar do átrio, o portão se estendia por todo o redor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da segunda parte deste versículo é obscuro e não traz verbo expresso. Outra tradução possível é: “e até o pilar do átrio, o portão, todo ao redor”.'
    reason: Preserva a incerteza sintática e arquitetônica do hebraico, ao mesmo tempo que esclarece que “se estendia” é uma explicitação necessária em português.
lexical_decisions:
- source_word: אֵילִים / אֵיל
  choice: pilares laterais / pilar
  rationale: No contexto arquitetônico, os termos designam os elementos verticais ou salientes que ladeiam a passagem. “Pilares laterais” é mais claro em português corrente do que “ombreiras” para uma medida de sessenta côvados, preservando o plural e o singular do hebraico.
- source_word: שִׁשִּׁים אַמָּה
  choice: com sessenta côvados de altura
  rationale: Mantém a unidade antiga. “De altura” explicita a dimensão mais provável no contexto, embora o substantivo da dimensão não apareça no hebraico.
- source_word: סָבִיב סָבִיב
  choice: ao redor
  rationale: Expressa naturalmente a ideia distributiva ou circundante da repetição hebraica.
theological_decisions:
- issue: A sintaxe da segunda oração é obscura e não contém verbo expresso.
  choice: e, junto ao pilar do átrio, o portão se estendia ao redor
  alternative: e até o pilar do átrio, o portão ao redor
  rationale: A formulação segue a relação espacial mais plausível e fornece em português o verbo necessário para uma oração compreensível, sem transformar a dificuldade textual em afirmação teológica ou arquitetônica excessivamente precisa. A nota registra a incerteza.
translation_notes:
  register: Português moderno, claro e digno, com terminologia arquitetônica acessível. Conserva “côvados” como medida histórica e sinaliza em nota a obscuridade da segunda oração.
