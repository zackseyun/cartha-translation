- from: Fez os pilares laterais com sessenta côvados de altura; e, junto ao pilar do átrio, o portão se estendia ao redor.[a]
  to: Fez os pilares laterais de sessenta côvados; e, até o pilar do átrio, o portão se estendia por todo o redor.[a]
