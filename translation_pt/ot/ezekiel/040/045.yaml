base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/045.yaml
  text: 'Then he spoke to me: “This chamber[a], whose front faces south, is for the priests who keep charge of the temple.”'
translation:
  language: pt
  text: 'Então ele me disse: “Esta sala, cuja frente dá para o sul, é para os sacerdotes encarregados de cuidar do templo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “casa”. Neste contexto da visão do templo, o termo hebraico refere-se ao templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלַי
  choice: Então ele me disse
  rationale: A forma narrativa de דבר com אֶל introduz a fala e dá continuidade à sequência. “Então ele me disse” é natural em português e adequado neste contexto de discurso direto.
- source_word: זֹה הַלִּשְׁכָּה
  choice: Esta sala
  rationale: לִשְׁכָּה designa uma sala ou câmara no complexo do templo. “Sala” é claro e corrente, sem perder o sentido arquitetônico.
- source_word: אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַדָּרוֹם
  choice: cuja frente dá para o sul
  rationale: פָּנֶיהָ indica a frente ou face da sala, e דֶּרֶךְ הַדָּרוֹם expressa sua orientação. A formulação preserva a imagem espacial concreta em português natural.
- source_word: לַכֹּהֲנִים
  choice: é para os sacerdotes
  rationale: A preposição לְ indica destinação ou uso. “É para” comunica essa função sem afirmar propriedade.
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: encarregados de cuidar
  rationale: A construção com particípio e substantivo cognato indica o cumprimento de uma responsabilidade designada. “Encarregados de cuidar” expressa de modo idiomático o serviço confiado aos sacerdotes.
- source_word: הַבָּיִת
  choice: o templo
  rationale: Embora בַּיִת signifique literalmente “casa”, no contexto da visão arquitetônica de Ezequiel refere-se ao templo. A escolha torna o referente claro ao leitor moderno, enquanto a nota preserva a forma literal.
theological_decisions:
- issue: Referente de הַבָּיִת na visão do templo
  choice: o templo
  alternative: a casa
  rationale: O contexto arquitetônico identifica a “casa” como o templo. A tradução contextual não introduz uma interpretação doutrinária, e a alternativa literal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Sala” evita o tom arcaico de “câmara”; “cuja frente dá para o sul” conserva a descrição arquitetônica; e “encarregados de cuidar” comunica a responsabilidade cultual sem sugerir apenas vigilância física.
