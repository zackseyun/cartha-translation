  yaml_path: translation/ot/ezekiel/040/024.yaml
  text: Then he led me by way of the south[a], and behold, there was a gate facing south[b]. He measured its side pillars and its porch according to these measurements.
translation:
  language: pt
  text: Então ele me levou na direção do sul, e eis que havia um portão voltado para o sul. Ele mediu seus pilares laterais[a] e seu pórtico segundo estas medidas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em linguagem mais técnica, “suas jambas”. O termo arquitetônico hebraico provavelmente se refere às estruturas laterais de sustentação do portão.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as dimensões do portão correspondiam às descritas anteriormente.
    reason: cross_reference
lexical_decisions:
- source_word: וַיּוֹלִכֵנִי
  choice: Então ele me levou
  rationale: O hifil de הלך tem sentido causativo, “fazer ir, conduzir”. “Então” expressa com naturalidade a sequência narrativa do waw.
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: na direção do sul
  rationale: A expressão significa literalmente “pelo caminho do sul”; a tradução escolhida comunica de modo natural o movimento direcional sem perder a referência espacial.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Mantém a função de chamar a atenção para o que aparece na visão profética.
- source_word: שַׁעַר דֶּרֶךְ הַדָּרוֹם
  choice: um portão voltado para o sul
  rationale: No contexto arquitetônico, a expressão identifica a orientação do portão; “voltado para o sul” é claro e natural.
- source_word: וּמָדַד
  choice: Ele mediu
  rationale: Expressa a continuação simples da ação narrativa.
- source_word: אֵילוֹ
  choice: seus pilares laterais
  rationale: O termo arquitetônico designa estruturas salientes de sustentação nas laterais do portão. “Pilares laterais” é mais compreensível ao leitor comum que o termo técnico “jambas”.
- source_word: וְאֵילַמּוֹ
  choice: e seu pórtico
  rationale: אֵילָם designa a área coberta de entrada, ou vestíbulo, em arquitetura; “pórtico” é claro, digno e apropriado ao contexto do templo.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: segundo estas mesmas medidas
  rationale: Preserva a comparação com as dimensões descritas anteriormente e explicita naturalmente que eram iguais.
