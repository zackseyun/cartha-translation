base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/009.yaml
  text: 'Then he measured the portico of the gate: eight cubits[a], and its side pillars two cubits[b]; and the portico of the gate was toward the temple.'
translation:
  language: pt
  text: 'Então ele mediu o pórtico do portão: oito côvados; e seus pilares laterais, dois côvados[a]. O pórtico do portão ficava voltado para o templo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas ombreiras”, “suas pilastras” ou “seus postes”, para o termo arquitetônico aqui traduzido como “pilares laterais”.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “a casa”; nesta visão do templo, o termo se refere ao edifício do templo.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol de מדד dá sequência às ações da visão; “Então” expressa naturalmente a progressão narrativa.
- source_word: אֻלָם
  choice: pórtico
  rationale: Designa uma estrutura de entrada semelhante a um vestíbulo ou alpendre; “pórtico” é atual, digno e adequado à arquitetura do complexo.
- source_word: הַשַּׁעַר
  choice: o portão
  rationale: שער refere-se aqui à estrutura de acesso que está sendo medida; “portão” mantém o sentido arquitetônico direto.
- source_word: שְׁמֹנֶה אַמּוֹת
  choice: oito côvados
  rationale: Preserva a antiga unidade de medida, apropriada ao contexto das medições do templo.
- source_word: וְאֵילוֹ
  choice: e seus pilares laterais
  rationale: אֵיל pode indicar suportes estruturais salientes do portão. “Pilares laterais” comunica o provável referente, enquanto a incerteza arquitetônica é preservada em nota.
- source_word: שְׁתַּיִם אַמּוֹת
  choice: dois côvados
  rationale: Tradução direta da medida atribuída aos elementos arquitetônicos precedentes.
- source_word: וְאֻלָם הַשַּׁעַר
  choice: O pórtico do portão
  rationale: Mantém a repetição do hebraico e a consistência terminológica.
- source_word: מֵהַבָּיִת
  choice: ficava voltado para o templo
  rationale: No contexto espacial da visão, בית é o edifício do templo, e a expressão indica que o pórtico se situava no lado voltado para ele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura métrica e a repetição arquitetônica do hebraico foram preservadas; o ponto e vírgula separa com clareza as duas medições.
