base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/018.yaml
  text: And the pavement was beside the side of the gates[a], corresponding to the length of the gates—the lower pavement.
translation:
  language: pt
  text: O pavimento ficava ao lado dos portões, correspondendo ao comprimento dos portões[a] — o pavimento inferior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em frente ao comprimento dos portões”. O hebraico pode indicar correspondência espacial ou posição em frente a algo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִצְפָה
  choice: o pavimento
  rationale: רִצְפָה designa uma superfície pavimentada; “pavimento” é natural e adequado ao contexto arquitetônico.
- source_word: אֶל כֶּתֶף הַשְּׁעָרִים
  choice: ao lado dos portões
  rationale: A expressão combina a preposição אֶל com כֶּתֶף, literalmente “ombro”, empregado espacialmente no sentido de lado ou flanco; aqui indica adjacência.
- source_word: הַשְּׁעָרִים
  choice: os portões
  rationale: Mantém o plural hebraico e comunica com clareza as estruturas de entrada do recinto visionário.
- source_word: לְעֻמַּת אֹרֶךְ הַשְּׁעָרִים
  choice: acompanhando toda a extensão deles
  rationale: לְעֻמַּת pode expressar correspondência espacial ou posição fronteira; em combinação com אֹרֶךְ, a formulação comunica que o pavimento se estendia em correspondência com o comprimento dos portões. “Toda” explicita naturalmente a ideia de extensão sem acrescentar uma medida.
- source_word: הָרִצְפָה הַתַּחְתּוֹנָה
  choice: o pavimento inferior
  rationale: תַּחְתּוֹנָה distingue esse pavimento de outro situado em nível superior; “inferior” é conciso e arquitetonicamente claro.
theological_decisions: []
