  yaml_path: translation/ot/ezekiel/040/019.yaml
  text: 'Then he measured the width from the front of the lower gate to the front of the inner court outside: one hundred cubits[b][a], to the east and to the north.'
translation:
  language: pt
  text: 'Então ele mediu a largura da frente do portão inferior[a] até a frente do átrio interno, pelo lado de fora: cem côvados[b], a leste e ao norte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portal inferior”. O termo hebraico traduzido por “portão” pode designar toda a estrutura de acesso, e não apenas a abertura.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a largura era de cem côvados tanto no lado leste como no lado norte.
    reason: clarification
lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol dá sequência à narrativa da visão; “Então” expressa essa progressão com naturalidade.
- source_word: רֹחַב
  choice: a distância
  rationale: Embora o substantivo signifique literalmente “largura”, aqui designa a extensão medida entre dois pontos arquitetônicos; “distância” evita sugerir a largura de um único objeto.
- source_word: מִלִּפְנֵי
  choice: desde a frente de
  rationale: A preposição composta indica espacialmente o ponto inicial da medição.
- source_word: הַשַּׁעַר הַתַּחְתּוֹנָה
  choice: o portão inferior
  rationale: “Portão” é natural em português e pode designar, neste contexto, a estrutura de acesso, não apenas sua abertura.
- source_word: לִפְנֵי הֶחָצֵר הַפְּנִימִי
  choice: até a frente do átrio interno
  rationale: A expressão indica o ponto final da medição; “átrio” é o termo arquitetônico corrente para חָצֵר no complexo do templo.
- source_word: מִחוּץ
  choice: pelo lado de fora
  rationale: Indica que a medição foi feita no lado exterior; a formulação é mais clara e idiomática do que apenas “fora”.
- source_word: מֵאָה אַמָּה
  choice: cem côvados
  rationale: Mantém a unidade antiga e a precisão do texto hebraico, sem conversão conjectural.
- source_word: הַקָּדִים וְהַצָּפוֹן
  choice: tanto a leste como ao norte
  rationale: Os substantivos direcionais indicam que a mesma medida se aplica aos lados oriental e norte; a construção distributiva torna isso natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário arquitetônico bíblico corrente. A sintaxe conserva os pontos inicial e final da medição e explicita com moderação o sentido distributivo das direções.
