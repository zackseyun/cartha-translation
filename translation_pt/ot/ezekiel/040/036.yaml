  yaml_path: translation/ot/ezekiel/040/036.yaml
  text: Its guardrooms[a], its side pillars, and its portico, with windows all around[b], had a length of fifty cubits and a width of twenty-five cubits.
translation:
  language: pt
  text: O portão tinha salas da guarda, pilares laterais[a], um pórtico[b] e janelas ao redor, por toda parte; media cinquenta côvados de comprimento e vinte e cinco côvados de largura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ombreiras” ou “pilastras”. O termo arquitetônico hebraico é técnico.
    reason: lexical_alternative
  - marker: b
    text: Ou “vestíbulo” ou “alpendre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּאָיו
  choice: suas salas da guarda
  rationale: No contexto dos portões da visão do templo, תָּא designa os pequenos compartimentos associados à passagem. “Salas da guarda” comunica sua provável função e mantém a coerência arquitetônica do capítulo.
- source_word: אֵלָיו
  choice: seus pilares laterais
  rationale: O termo técnico parece indicar elementos estruturais nas laterais do portão. “Pilares laterais” é claro para leitores atuais, enquanto “ombreiras” e “pilastras” permanecem alternativas possíveis.
- source_word: אֵלַמּוֹ
  choice: seu pórtico
  rationale: Na arquitetura do templo, o termo designa uma estrutura coberta de entrada. “Pórtico” preserva o sentido arquitetônico sem tornar a frase excessivamente técnica.
- source_word: וְחַלּוֹנוֹת לוֹ סָבִיב סָבִיב
  choice: com janelas em todo o redor
  rationale: A formulação expressa de modo natural que havia janelas distribuídas ao redor da estrutura; “em todo o redor” conserva a força abrangente da repetição hebraica.
- source_word: אֹרֶךְ חֲמִשִּׁים אַמָּה
  choice: tinham cinquenta côvados de comprimento
  rationale: Mantém a unidade antiga do texto e verte a fórmula nominal de medida em prosa portuguesa natural.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: e vinte e cinco côvados de largura
  rationale: Traduz diretamente a segunda dimensão e conserva o côvado, sem introduzir uma conversão aproximada no texto principal.
