lexical_decisions:
- source_word: וְהַשַּׁעַר
  choice: Quanto ao portão
  rationale: A conjunção e o substantivo definido introduzem o próximo elemento arquitetônico da descrição. “Quanto ao portão” expressa naturalmente essa mudança de tópico.
- source_word: אֲשֶׁר פָּנָיו
  choice: cuja frente dava
  rationale: פָּנִים significa literalmente “face”, mas, no contexto arquitetônico, “frente” é natural e preserva a imagem espacial.
- source_word: דֶּרֶךְ הַצָּפוֹן
  choice: para o norte
  rationale: דֶּרֶךְ com uma direção indica orientação; “dava para o norte” comunica isso de modo claro e idiomático.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: em direção ao pátio externo
  rationale: O לְ indica aqui relação espacial ou direção. A tradução mantém essa nuance sem fundi-la com a orientação norte.
- source_word: מָדַד
  choice: ele mediu
  rationale: O verbo descreve diretamente a ação de medir; o pronome retoma a figura que realiza as medições no contexto.
- source_word: אָרְכּוֹ
  choice: seu comprimento
  rationale: Equivalente arquitetônico corrente; o sufixo pronominal se refere ao portão.
- source_word: וְרָחְבּוֹ
  choice: e sua largura
  rationale: “Largura” é o termo moderno e claro para a dimensão transversal.
