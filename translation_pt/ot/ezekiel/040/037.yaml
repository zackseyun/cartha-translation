  yaml_path: translation/ot/ezekiel/040/037.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: pt
  text: Seus pilares estavam voltados para o pátio externo, e havia palmeiras[a] em seus pilares, de um lado e do outro; sua escadaria tinha oito degraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “motivos de palmeiras”. No contexto arquitetônico, o termo pode referir-se a imagens ou entalhes de palmeiras, e não a árvores vivas.
    reason: contextual_lexical_clarification
lexical_decisions:
- source_word: וְאֵילָו
  choice: Seus pilares
  rationale: O texto massorético traz o termo arquitetônico אֵיל com sufixo, aqui entendido como os pilares ou montantes laterais da estrutura. A tradução conserva essa leitura em vez de substituí-la silenciosamente por אֵלַמּוֹ, “seu pórtico”.
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: davam para o pátio externo
  rationale: A preposição ל indica a orientação da estrutura. “Davam para” expressa isso em português arquitetônico natural.
- source_word: תִמֹרִים
  choice: palmeiras
  rationale: O substantivo nomeia palmeiras explicitamente. No contexto arquitetônico, provavelmente são imagens ou entalhes em forma de palmeira, possibilidade indicada em nota sem ser imposta ao texto.
- source_word: אֶל אֵילָו
  choice: junto a eles
  rationale: A expressão situa as palmeiras nos pilares ou junto deles. O pronome retoma “pilares” e evita repetir um termo técnico pesado.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: de um lado e do outro
  rationale: A expressão distributiva descreve disposição simétrica nos dois lados e preserva a repetição do hebraico em português corrente.
- source_word: שְׁמֹנֶה מַעֲלוֹת מַעֲלוֹ
  choice: sua escadaria tinha oito degraus
  rationale: A construção descreve a subida pertencente à estrutura. “Escadaria” e “degraus” comunicam com clareza a relação arquitetônica sem acrescentar um referente não expresso no versículo.
