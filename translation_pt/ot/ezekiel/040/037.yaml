translation_notes:
  register: Português moderno, claro e digno, com vocabulário arquitetônico acessível. A leitura do texto massorético foi mantida no corpo do versículo; a formulação alternativa, comum em traduções modernas, foi registrada em nota. Todos os marcadores de nota aparecem no texto.
