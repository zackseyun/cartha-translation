  text: And a gate to the inner court was opposite the gate on the north and on the east[a]; and he measured from gate to gate one hundred cubits.
translation:
  language: pt
  text: Havia um portão para o pátio interno, em frente ao portão do norte e ao do leste; ele mediu de portão a portão cem côvados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁעַר
  choice: portão
  rationale: Designa o portão ou a entrada arquitetônica; “portão” é natural e preciso neste contexto do complexo do templo.
- source_word: חָצֵר הַפְּנִימִי
  choice: pátio interno
  rationale: Refere-se à área interna cercada do complexo; “pátio interno” é claro e mantém a terminologia arquitetônica.
- source_word: נֶגֶד
  choice: em frente a
  rationale: Indica correspondência espacial, com um portão situado diante do outro; a expressão também pode ser entendida como “de frente para”.
- source_word: לַצָּפוֹן וְלַקָּדִים
  choice: do lado norte, assim como no lado leste
  rationale: As expressões localizam os portões correspondentes nos lados norte e leste. A formulação explicita naturalmente em português a construção hebraica elíptica.
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O verbo dá sequência à narrativa; o sujeito é o homem que mede no contexto da visão.
- source_word: מִשַּׁעַר אֶל שַׁעַר
  choice: de um portão ao outro
  rationale: Expressa com naturalidade a distância medida entre os portões.
- source_word: מֵאָה אַמָּה
  choice: cem côvados
  rationale: Preserva a antiga unidade de medida do texto-fonte, sem impor uma conversão moderna incerta.
