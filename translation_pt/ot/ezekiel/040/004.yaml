  text: וַ/יְדַבֵּ֨ר אֵלַ֜/י הָ/אִ֗ישׁ בֶּן אָדָ֡ם רְאֵ֣ה בְ/עֵינֶי/ךָ֩ וּ/בְ/אָזְנֶ֨י/ךָ שְּׁמָ֜ע וְ/שִׂ֣ים לִבְּ/ךָ֗ לְ/כֹ֤ל אֲשֶׁר אֲנִי֙ מַרְאֶ֣ה אוֹתָ֔/ךְ כִּ֛י לְמַ֥עַן הַרְאוֹתְ/כָ֖ה הֻבָ֣אתָה הֵ֑נָּה הַגֵּ֛ד אֶת כָּל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/004.yaml
  text: And the man said to me[a], “Son of man, see with your eyes, and hear with your ears, and set your heart on all that I show you, for you were brought here so that I might show you these things. Declare to the house of Israel all that you see.”
translation:
  language: pt
  text: 'E o homem me disse: “filho do homem[a], veja com os seus olhos, ouça com os seus ouvidos e ponha no coração tudo o que eu lhe mostrar, pois você foi trazido para cá a fim de que eu lhe mostrasse estas coisas. Anuncie à casa de Israel tudo o que você vê.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mortal” ou “ser humano”. A expressão hebraica é a forma habitual de tratamento dirigida a Ezequiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: o homem
  rationale: É o termo hebraico comum para “homem” e, no contexto, retoma a figura masculina apresentada no versículo anterior.
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a fórmula recorrente com que Ezequiel é interpelado e sua continuidade literária; a nota registra traduções de sentido possíveis.
- source_word: רְאֵה בְעֵינֶיךָ
  choice: veja com os seus olhos
  rationale: Mantém o imperativo e o paralelismo concreto com “ouça com os seus ouvidos”.
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: ouça com os seus ouvidos
  rationale: Reproduz a ordem de recepção atenta e conserva o paralelismo do hebraico.
- source_word: וְשִׂים לִבְּךָ
  choice: ponha no coração
  rationale: Preserva a imagem antropológica hebraica, na qual o coração abrange atenção, pensamento e vontade, sem reduzi-la a mera audição.
- source_word: לְכֹל אֲשֶׁר אֲנִי מַרְאֶה אוֹתָךְ
  choice: tudo o que eu lhe mostrar
  rationale: Expressa naturalmente o valor causativo de ראה no Hifil, “mostrar/fazer ver”.
- source_word: כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה
  choice: pois você foi trazido para cá a fim de que eu lhe mostrasse estas coisas
  rationale: Mantém a finalidade da construção hebraica e explicita de modo natural em português o conteúdo visionário implicitamente retomado.
- source_word: הַגֵּד
  choice: anuncie
  rationale: O imperativo no Hifil significa dar a conhecer ou relatar; “anuncie” corresponde ao registro solene da incumbência profética.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: à casa de Israel
  rationale: Conserva a expressão profética tradicional e sua textura literária.
- source_word: כָּל אֲשֶׁר אַתָּה רֹאֶה
  choice: tudo o que você vir
  rationale: O futuro do subjuntivo é idiomático em português na referência ao conteúdo da visão que Ezequiel deverá observar e comunicar.
theological_decisions:
- issue: Sentido da fórmula recorrente בֶּן אָדָם em Ezequiel
  choice: Filho do homem
  alternative: mortal; ser humano
  rationale: Aqui a expressão é uma forma profética de tratamento dirigida a Ezequiel, não um título cristológico. A tradução tradicional preserva a repetição literária, enquanto a nota evita que seu sentido humano seja obscurecido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para clareza brasileira. A coordenação dos três imperativos conserva o ritmo solene e concreto do hebraico; “ponha no coração” mantém sua imagem sem recorrer à formulação menos natural “ponha o seu coração sobre”.
