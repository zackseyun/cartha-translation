  text: Then he brought me into the inner court by way of the east[a], and he measured the gate according to these measurements.
translation:
  language: pt
  text: Então ele me levou ao pátio interno pelo lado leste e mediu o portão conforme estas medidas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a entrada”. O termo hebraico שַׁעַר pode se referir tanto ao portão propriamente dito quanto a toda a estrutura de entrada nesta visão do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Então ele me levou
  rationale: O wayyiqtol de בוא com sufixo de primeira pessoa singular indica a ação seguinte na narrativa; “Então” comunica a progressão, e “me levou” preserva o sentido causativo.
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: ao pátio interno
  rationale: חָצֵר designa o pátio de um complexo, e הַפְּנִימִי o identifica como o interno; “pátio interno” é natural e claro em português.
- source_word: דֶּרֶךְ הַקָּדִים
  choice: pelo lado leste
  rationale: דֶּרֶךְ indica a via ou direção de acesso, enquanto הַקָּדִים se refere ao leste. A expressão portuguesa comunica a rota sem sugerir simplesmente movimento em direção ao leste.
- source_word: וַיָּמָד
  choice: e mediu
  rationale: O verbo מדד tem aqui seu sentido arquitetônico direto de medir e dá continuidade à sequência narrativa.
- source_word: הַשַּׁעַר
  choice: o portão
  rationale: שַׁעַר pode designar tanto o portão propriamente dito quanto toda a estrutura de entrada; “portão” mantém a tradução concisa e usual, com a amplitude lexical registrada em nota.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: conforme estas mesmas medidas
  rationale: A preposição כְּ expressa conformidade, e הָאֵלֶּה é demonstrativo proximal. “Estas mesmas medidas” torna natural em português a referência às dimensões já apresentadas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega “pátio interno” e “portão” como vocabulário arquitetônico acessível, preservando em nota a possível extensão de שַׁעַר à estrutura inteira.
