  yaml_path: translation/ot/ezekiel/040/013.yaml
  text: 'Then he measured the gateway from the roof of one guardroom to the roof of the other: twenty-five cubits wide[b][a], doorway opposite doorway.'
translation:
  language: pt
  text: 'Então ele mediu o portal, desde o teto de uma sala da guarda até o teto da outra: vinte e cinco côvados de largura, de uma entrada à entrada oposta.[a]'
  philosophy: optimal-equivalence
  footnotes:
