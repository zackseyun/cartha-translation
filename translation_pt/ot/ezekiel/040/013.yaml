lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol dá continuidade à sequência narrativa; “Então” expressa essa progressão com naturalidade.
- source_word: הַשַּׁעַר
  choice: o portal
  rationale: No contexto arquitetônico de Ezequiel 40, o termo designa a estrutura do portão como um todo, não apenas a abertura ou uma folha da porta.
- source_word: מִגַּג הַתָּא לְגַגּוֹ
  choice: desde o teto de uma sala da guarda até o teto da outra
  rationale: תָּא designa uma câmara lateral na estrutura do portal, provavelmente usada por guardas. A formulação explicita de modo natural a medição entre as câmaras correspondentes, sem ocultar a expressão singular do hebraico.
- source_word: רֹחַב
  choice: de largura
  rationale: Expressa de maneira idiomática em português a dimensão indicada pelo substantivo hebraico.
- source_word: עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: vinte e cinco côvados
  rationale: Mantém a antiga unidade de medida e emprega a forma numérica corrente em português.
- source_word: פֶּתַח נֶגֶד פָּתַח
  choice: de uma entrada à entrada oposta
  rationale: Conserva a ideia arquitetônica de duas aberturas correspondentes, uma diante da outra, em português claro e natural.
