  text: And each guardroom was one reed long and one reed wide[a], and between the guardrooms was five cubits[c][b]. And the threshold of the gate beside the portico of the gate on the inside was one reed.
translation:
  language: pt
  text: Cada câmara de guarda media uma cana de comprimento e uma cana de largura[a], e havia cinco côvados entre as câmaras. A soleira do portão, junto ao pórtico[b] do portão, do lado de dentro[c], media uma cana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “câmara lateral” ou simplesmente “câmara”. O hebraico תָּא é um termo arquitetônico usado para as pequenas salas da estrutura do portão nesta visão.
    reason: lexical_alternative
  - marker: b
    text: Ou “vestíbulo” ou “alpendre”.
    reason: lexical_alternative
  - marker: c
    text: Em hebraico, literalmente “da casa” ou “do edifício”; a expressão provavelmente indica o lado interior do complexo do portão.
    reason: cultural_note
lexical_decisions:
- source_word: הַתָּא
  choice: câmara de guarda
  rationale: O termo arquitetônico designa as pequenas câmaras integradas à estrutura do portão. “Câmara de guarda” comunica tanto a forma quanto a provável função no contexto, sem ocultar a alternativa mais genérica registrada em nota.
- source_word: קָנֶה אֶחָד
  choice: uma cana
  rationale: Neste contexto, קָנֶה é a unidade de medida definida em Ezequiel 40:5. “Uma cana” preserva a terminologia concreta da visão e evita converter a medida.
- source_word: אֹרֶךְ / רֹחַב
  choice: de comprimento / de largura
  rationale: A formulação dimensional é natural em português e mantém o paralelismo do hebraico.
- source_word: בֵּין הַתָּאִים
  choice: entre as câmaras
  rationale: Retoma de modo conciso as câmaras de guarda já identificadas, preservando a relação espacial.
- source_word: חָמֵשׁ אַמּוֹת
  choice: cinco côvados
  rationale: “Côvado” é a designação tradicional e precisa da unidade אַמָּה; o texto não explicita “de espaço”.
- source_word: סַף
  choice: soleira
  rationale: No contexto arquitetônico, סַף indica a base atravessada na entrada; “soleira” é o termo português direto.
- source_word: הַשַּׁעַר
  choice: o portão
  rationale: “Portão” expressa uma entrada arquitetônica ampla e se ajusta naturalmente à descrição do complexo.
- source_word: מֵאֵצֶל
  choice: junto a
  rationale: A expressão indica proximidade espacial; “junto a” é clara e idiomática em português.
- source_word: אוּלָם הַשַּׁעַר
  choice: o pórtico do portão
  rationale: אוּלָם designa um pórtico, vestíbulo ou alpendre. “Pórtico” é arquitetonicamente claro e mantém registro digno.
- source_word: מֵהַבַּיִת
  choice: do lado de dentro
  rationale: Literalmente relacionado a “a casa/o edifício”, o sintagma parece indicar a orientação interior do complexo do portão. A tradução apresenta a leitura espacial provável, enquanto a nota preserva a forma literal e a ambiguidade.
