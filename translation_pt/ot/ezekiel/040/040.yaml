base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/040.yaml
  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
translation:
  language: pt
  text: Do lado de fora[a], junto à subida para a entrada do portão norte[b], havia duas mesas; e, do outro lado, junto ao pórtico do portão[c], havia duas mesas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no ombro exterior”; nesta descrição arquitetônica, “ombro” indica uma lateral ou área lateral.
    reason: lexical_alternative
  - marker: b
    text: Ou “onde se sobe para a entrada do portão norte”.
    reason: lexical_alternative
  - marker: c
    text: Ou “do lado que pertencia ao pórtico do portão”. A expressão hebraica indica associação espacial com o pórtico ou vestíbulo do portão.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתֵף
  choice: lado
  rationale: Embora o sentido literal seja “ombro”, em uma descrição arquitetônica o termo indica uma lateral ou área lateral. “Lado” comunica esse sentido com clareza e naturalidade em português.
- source_word: מִחוּצָה
  choice: do lado de fora
  rationale: Indica a parte exterior; a expressão se integra naturalmente à referência espacial feita por כָּתֵף.
- source_word: לָעוֹלֶה
  choice: junto à subida
  rationale: O particípio de עלה pode designar o lugar por onde se sobe ou a ação de subir. “Subida” é conciso e adequado ao contexto arquitetônico, sem excluir a ideia de acesso ascendente.
- source_word: פֶּתַח
  choice: entrada
  rationale: É a forma corrente e clara para uma abertura que dá acesso a um portão ou complexo arquitetônico.
- source_word: שַׁעַר
  choice: portão
  rationale: Termo natural em português para a estrutura de acesso descrita na visão do templo.
- source_word: הַצָּפוֹנָה
  choice: norte
  rationale: Na expressão com שַׁעַר, “portão norte” é uma construção natural e fiel.
- source_word: שְׁנַיִם שֻׁלְחָנוֹת
  choice: duas mesas
  rationale: Correspondência direta e adequada ao contexto de preparação dos sacrifícios.
- source_word: הָאַחֶרֶת
  choice: o outro lado
  rationale: Identifica a lateral correspondente ou oposta de modo natural em português.
- source_word: אֲשֶׁר לְאֻלָם הַשַּׁעַר
  choice: junto ao pórtico do portão
  rationale: A preposição לְ marca aqui uma relação espacial ou associativa algo flexível. “Junto ao” oferece uma leitura arquitetônica clara, enquanto a nota preserva outras possibilidades.
- source_word: אֻלָם
  choice: pórtico
  rationale: Termo acessível, digno e apropriado à arquitetura do templo; “vestíbulo” também seria possível.
