  text: And from the front of the outer gateway to the front of the vestibule of the inner gate was fifty cubits[a][b][c].
translation:
  language: pt
  text: E, desde a frente do portal exterior[a] até a frente do vestíbulo[b] do portal interior[c], havia cinquenta côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico é difícil neste ponto; o termo traduzido como “exterior” é incomum aqui. Pelo contexto das medidas ao redor, muitos entendem que se refere ao portal exterior.
    reason: textual_variant
  - marker: b
    text: Ou “pórtico”.
    reason: lexical_alternative
  - marker: c
    text: Neste capítulo, o termo hebraico também pode ser traduzido como “portão”; ele pode designar todo o complexo da entrada, e não apenas suas portas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: E, desde
  rationale: No contexto de medição, a combinação introduz o ponto inicial da distância; “desde” expressa isso naturalmente, enquanto “E” preserva a ligação com o contexto anterior.
- source_word: פְּנֵי
  choice: a frente de
  rationale: Na linguagem arquitetônica, פָּנִים indica a face frontal da estrutura, não um rosto ou uma superfície em sentido genérico.
- source_word: הַשַּׁעַר
  choice: o portal
  rationale: Neste capítulo, שַׁעַר designa o conjunto arquitetônico da entrada, e não somente a porta ou suas folhas.
- source_word: היאתון
  choice: exterior
  rationale: A forma hebraica é incomum e difícil; “exterior” se ajusta à sequência espacial e às medidas do contexto, sem ocultar a incerteza, que é indicada em nota.
- source_word: לִפְנֵי
  choice: até a frente de
  rationale: A expressão marca o ponto final do espaço medido e mantém a precisão espacial do hebraico.
- source_word: אֻלָם
  choice: vestíbulo
  rationale: O termo indica um espaço coberto de entrada semelhante a um pórtico; “vestíbulo” é claro e arquitetonicamente adequado.
- source_word: הַשַּׁעַר הַפְּנִימִי
  choice: o portal interior
  rationale: Mantém a terminologia arquitetônica uniforme e identifica a parte interior do complexo de entrada.
- source_word: חֲמִשִּׁים אַמָּה
  choice: cinquenta côvados
  rationale: É a forma convencional, concisa e reconhecível de traduzir a antiga unidade de medida.
