base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/028.yaml
  text: Then he brought me into the inner court by way of the south gate[b][a], and he measured the south gate according to these measurements.
translation:
  language: pt
  text: Então ele me levou ao pátio interno pelo portão sul[a] e mediu o portão sul conforme essas medidas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “através do portão sul”. A preposição hebraica pode indicar a entrada por meio do portão.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o portão tinha as mesmas medidas dos portões descritos anteriormente.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Então ele me levou
  rationale: O hifil de בוא significa “levar/trazer”. “Então” expressa com naturalidade a progressão narrativa do wayyiqtol.
- source_word: חָצֵר הַפְּנִימִי
  choice: ao pátio interno
  rationale: חָצֵר designa pátio ou átrio. “Pátio interno” é claro para leitores comuns e adequado à arquitetura da visão do templo.
- source_word: בְּשַׁעַר הַדָּרוֹם
  choice: pelo portão sul
  rationale: A preposição בְּ indica aqui, de modo mais natural, o trajeto ou meio de entrada. “Pelo” preserva essa nuance de forma concisa, sem excluir a tradução “através do”.
- source_word: וַיָּמָד
  choice: e mediu
  rationale: O qal de מדד significa diretamente “medir”; mantém-se explícito o motivo recorrente das medições.
- source_word: אֶת הַשַּׁעַר הַדָּרוֹם
  choice: o portão sul
  rationale: É o objeto definido do verbo e retoma o portão que acabou de ser mencionado.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: conforme essas medidas
  rationale: כְּ com מִדּוֹת indica correspondência com medidas já apresentadas. “Conforme essas medidas” transmite essa relação com naturalidade.
