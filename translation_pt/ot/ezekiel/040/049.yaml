base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/049.yaml
  text: The length of the vestibule was twenty cubits, and the width was twelve cubits, and by the steps by which one went up to it; and pillars were beside the sidewalls, one on this side and one on that side.
translation:
  language: pt
  text: O vestíbulo tinha vinte côvados de comprimento e onze côvados de largura.[a] Chegava-se a ele pelos degraus. Junto às ombreiras havia colunas, uma de cada lado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico diz “onze”; a antiga versão grega diz “doze” e também menciona dez degraus.
    reason: Registra uma variante textual antiga relevante sem substituir a leitura da fonte hebraica adotada.
lexical_decisions:
- source_word: אֻלָם
  choice: vestíbulo
  rationale: Designa o pórtico ou salão de entrada do templo; “vestíbulo” é claro e coerente com o contexto arquitetônico.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: onze
  rationale: É a leitura explícita do texto hebraico massorético; não se adotou “doze” da antiga versão grega.
- source_word: מַעֲלוֹת
  choice: degraus
  rationale: No contexto de acesso elevado ao templo, refere-se aos degraus pelos quais se subia ao vestíbulo.
- source_word: אֵילִים
  choice: ombreiras
  rationale: Termo arquitetônico que aqui indica os suportes laterais ou batentes da entrada, junto aos quais ficavam as colunas.
- source_word: עַמֻּדִים
  choice: colunas
  rationale: Equivalente arquitetônico direto e natural em português.
