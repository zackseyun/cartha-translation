base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/012.yaml
  text: And there was a barrier of one cubit in front of the side rooms[a], and a barrier of one cubit on the other side[b]; and each side room was six cubits on this side and six cubits on that side.
translation:
  language: pt
  text: Diante das câmaras laterais[a] havia uma barreira de um côvado de um lado e uma barreira de um côvado do outro[b]. Cada câmara media seis côvados de um lado e seis côvados do outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guaritas”, “celas” ou “nichos”. O termo hebraico se refere a pequenas câmaras na estrutura do portão.
    reason: lexical_alternative
  - marker: b
    text: O hebraico emprega expressões dêiticas repetidas, literalmente “daqui” e “dali”, para indicar as medidas em lados opostos.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּל
  choice: barreira
  rationale: No contexto arquitetônico, indica uma faixa ou delimitação física diante das câmaras; “barreira” comunica melhor essa função concreta do que “limite” ou “fronteira”.
- source_word: לִפְנֵי
  choice: diante de
  rationale: Expressa naturalmente a relação espacial indicada pelo hebraico no contexto da planta do edifício.
- source_word: הַתָּאוֹת / הַתָּא
  choice: câmaras laterais / cada câmara
  rationale: תָּא designa pequenas dependências integradas à estrutura do portão. “Câmaras laterais” preserva a função arquitetônica sem pressupor que fossem necessariamente guaritas; o singular posterior é entendido distributivamente.
- source_word: אַמָּה אֶחָת / שֵׁשׁ אַמּוֹת
  choice: um côvado / seis côvados
  rationale: Mantém a unidade antiga e o estilo metrológico da visão, sem introduzir conversão aproximada.
- source_word: מִפֹּה ... מִפּוֹ
  choice: de um lado ... do outro
  rationale: As expressões dêiticas apontam para lados opostos. A formulação portuguesa é natural e conserva o contraste bilateral.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para tornar inequívoca a simetria arquitetônica. Preservou-se “côvado” e evitou-se atribuir às câmaras uma função militar não explicitada pelo texto.
