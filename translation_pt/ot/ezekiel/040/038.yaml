  yaml_path: translation/ot/ezekiel/040/038.yaml
  text: There was a chamber with its doorway by the gateposts of the gates[a]; there they would rinse the burnt offering.
translation:
  language: pt
  text: Havia uma câmara, com sua entrada junto aos pilares dos portões[a]; ali lavavam o holocausto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo arquitetônico hebraico traduzido como “pilares” também pode indicar vestíbulos, pilastras salientes ou outra estrutura semelhante do conjunto dos portões.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁכָּה
  choice: uma câmara
  rationale: Designa uma dependência dentro do conjunto arquitetônico do templo ou dos portões. “Câmara” conserva o sentido arquitetônico e mantém linguagem digna e compreensível.
- source_word: וּפִתְחָהּ
  choice: com sua entrada
  rationale: פתח com sufixo feminino singular refere-se à entrada da câmara. A formulação expressa naturalmente em português a relação possessiva.
- source_word: בְּאֵילִים
  choice: junto aos pilares
  rationale: אֵילִים é um termo arquitetônico de sentido exato incerto no contexto da visão. “Pilares” oferece uma representação clara e plausível, enquanto a nota preserva outras possibilidades.
- source_word: הַשְּׁעָרִים
  choice: dos portões
  rationale: Mantém o plural hebraico e se ajusta ao complexo arquitetônico descrito na visão.
- source_word: שָׁם
  choice: ali
  rationale: Advérbio locativo que retoma o lugar imediatamente descrito.
- source_word: יָדִיחוּ
  choice: lavavam
  rationale: O hifil de דוח indica lavar ou enxaguar o material sacrificial. O imperfeito tem valor habitual nesta descrição, expresso naturalmente pelo pretérito imperfeito português.
- source_word: הָעֹלָה
  choice: o holocausto
  rationale: עלה é o termo sacrificial usual para a oferta inteiramente queimada. “Holocausto” é a equivalência bíblica tradicional e corrente em português.
