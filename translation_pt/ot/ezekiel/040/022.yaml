  yaml_path: translation/ot/ezekiel/040/022.yaml
  text: Its windows[a], its porch, and its palm-tree decorations had the same measurements as the gate that faced east. People would go up to it by seven steps[c][b], and its porch was in front of them.
translation:
  language: pt
  text: 'Suas janelas, seu pórtico[a] e seus ornamentos em forma de palmeira[b] tinham as mesmas medidas que as do portão voltado para o leste. Subia-se até ele por sete degraus[c], e seu pórtico ficava diante deles.


    [a] Ou “vestíbulo”; o mesmo termo arquitetônico ocorre novamente no fim do versículo.

    [b] Hebraico: “suas palmeiras”; neste contexto, provavelmente se trata de entalhes ou motivos decorativos em forma de palmeira.

    [c] O hebraico emprega um verbo no plural, literalmente “subiam”, provavelmente com sentido impessoal: “subia-se” ou “as pessoas subiam”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestíbulo”; o mesmo termo arquitetônico ocorre novamente no fim do versículo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “suas palmeiras”; neste contexto, provavelmente se trata de entalhes ou motivos decorativos em forma de palmeira.'
    reason: cultural_note
  - marker: c
    text: 'O hebraico emprega um verbo no plural, literalmente “subiam”, provavelmente com sentido impessoal: “subia-se” ou “as pessoas subiam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַלּוֹנוֹ
  choice: Suas janelas
  rationale: חַלּוֹן designa janela ou abertura de janela; o plural coletivo é natural em português neste contexto arquitetônico.
- source_word: וְאֵלַמּוֹ / וְאֵילַמּוֹ
  choice: seu pórtico
  rationale: O termo designa uma estrutura coberta de entrada. “Pórtico” é claro, digno e adequado ao contexto do templo; a tradução é mantida nas duas ocorrências.
- source_word: וְתִמָּרוֹ
  choice: seus ornamentos em forma de palmeira
  rationale: No contexto arquitetônico, o termo indica motivos ou entalhes de palmeira, não árvores plantadas; a formulação torna explícito o sentido ornamental provável.
- source_word: כְּמִדַּת
  choice: tinham as mesmas medidas que as do
  rationale: A combinação da preposição comparativa com מִדָּה expressa conformidade de dimensões; a formulação é idiomática e precisa em português.
- source_word: הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: o portão voltado para o leste
  rationale: A expressão hebraica descreve a orientação da frente do portão; “voltado para o leste” comunica isso de modo conciso.
- source_word: וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ בוֹ
  choice: Subia-se até ele por sete degraus
  rationale: O verbo na terceira pessoa do plural provavelmente tem uso impessoal. A construção com “subia-se” preserva essa indeterminação sem introduzir um sujeito específico.
- source_word: לִפְנֵיהֶם
  choice: diante deles
  rationale: A expressão significa literalmente “diante deles”. O referente do pronome está comprimido no hebraico, por isso a tradução preserva a formulação e sua ambiguidade.
theological_decisions: []
