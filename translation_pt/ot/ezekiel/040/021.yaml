  text: 'Its guardrooms were three on this side and three on that side[a], and its side pillars and its portico had the same measurements as the first gate: its length was fifty cubits[b], and the width twenty-five cubits.'
translation:
  language: pt
  text: Suas câmaras de guarda eram três de um lado e três do outro, e seus pilares laterais[a] e seu pórtico[b] tinham as mesmas medidas que as do primeiro portão. Seu comprimento era de cinquenta côvados, e sua largura, de vinte e cinco côvados.
