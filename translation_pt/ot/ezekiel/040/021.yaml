lexical_decisions:
- source_word: תָּא
  choice: câmaras de guarda
  rationale: No contexto arquitetônico de Ezequiel 40, designa pequenos compartimentos integrados ao portão; a expressão é clara e preserva a provável função.
- source_word: שְׁלוֹשָׁה מִפּוֹ ... וּשְׁלוֹשָׁה מִפּוֹ
  choice: três de um lado e três do outro
  rationale: Expressa com naturalidade a distribuição simétrica dos compartimentos nos lados opostos da passagem.
- source_word: אֵיל
  choice: pilares laterais
  rationale: Indica elementos estruturais salientes do complexo do portão, embora a identificação arquitetônica exata permaneça incerta.
- source_word: אֵלַם
  choice: pórtico
  rationale: Designa a área coberta semelhante a um alpendre no conjunto do portão; “pórtico” é corrente e arquitetonicamente adequado.
- source_word: הָיָה כְּמִדַּת הַשַּׁעַר הָרִאשׁוֹן
  choice: tinham as mesmas medidas que os do primeiro portão
  rationale: Torna explícita a comparação dos pilares e do pórtico com os elementos correspondentes do portão descrito anteriormente, de modo idiomático.
- source_word: הַשַּׁעַר הָרִאשׁוֹן
  choice: o primeiro portão
  rationale: Preserva o sentido sequencial da descrição da visão.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ
  choice: Seu comprimento era de cinquenta côvados
  rationale: Mantém o substantivo explícito “comprimento” e a unidade bíblica original.
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים בָּאַמָּה
  choice: e sua largura, de vinte e cinco côvados
  rationale: Reproduz de forma concisa e paralela a segunda dimensão.
- source_word: אַמָּה
  choice: côvados
  rationale: Conserva a unidade de medida bíblica usada de modo sistemático em toda a visão.
