base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/011.yaml
  text: 'Then he measured the width of the entrance of the gate: ten cubits[b][a], and the length of the gate: thirteen cubits.'
translation:
  language: pt
  text: 'Então ele mediu a largura da entrada do portão: dez côvados; e o comprimento do portão[a]: treze côvados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da passagem”. O termo hebraico pode designar a estrutura do portão como um todo. Algumas traduções entendem esta segunda medida de modo mais específico, como a profundidade ou a extensão da passagem, mas o texto hebraico diz literalmente “o comprimento do portão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: Então ele mediu
  rationale: O wayyiqtol de מדד dá continuidade à sequência narrativa da visão; “Então ele mediu” expressa essa progressão com naturalidade.
- source_word: רֹחַב
  choice: largura
  rationale: É o termo dimensional comum para a extensão transversal e a opção mais clara no português atual.
- source_word: פֶּתַח
  choice: entrada
  rationale: Designa a abertura ou o acesso; “entrada” é natural na descrição arquitetônica e mantém a distinção em relação ao portão como estrutura.
- source_word: הַשַּׁעַר
  choice: do portão
  rationale: שַׁעַר pode indicar tanto o portão quanto o conjunto arquitetônico da passagem. “Portão” é uma tradução direta e clara, enquanto a nota preserva a amplitude lexical relevante.
- source_word: עֶשֶׂר אַמּוֹת
  choice: dez côvados
  rationale: Mantém a antiga unidade de medida e segue de perto a formulação hebraica.
- source_word: אֹרֶךְ
  choice: comprimento
  rationale: É o sentido dimensional básico do termo. Evita interpretar a medida como profundidade ou extensão específica quando o hebraico diz apenas “comprimento”.
- source_word: שְׁלֹשׁ עֶשְׂרֵה אַמּוֹת
  choice: treze côvados
  rationale: Tradução direta do numeral e da unidade de medida, em paralelo com a primeira dimensão.
theological_decisions: []
translation_notes:
