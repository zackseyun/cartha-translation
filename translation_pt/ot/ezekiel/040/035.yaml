  text: וַ/יְבִיאֵ֖/נִי אֶל שַׁ֣עַר הַ/צָּפ֑וֹן וּ/מָדַ֖ד כַּ/מִּדּ֥וֹת הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/035.yaml
  text: Then he brought me to the north gate and measured it according to these measurements[a].
translation:
  language: pt
  text: Então ele me levou ao portão do norte e o mediu conforme estas medidas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e o mediu com estas medidas”, isto é, usando as mesmas dimensões descritas anteriormente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: Então ele me levou
  rationale: O waw consecutivo dá prosseguimento à narrativa. O hifil de בוא significa aqui levar ou conduzir; “levou” é natural e direto em português.
- source_word: אֶל
  choice: ao
  rationale: A preposição indica movimento em direção ao destino; com o artigo de “portão”, “ao” é a forma idiomática.
- source_word: שַׁעַר הַצָּפוֹן
  choice: portão do norte
  rationale: A cadeia construta designa o portão situado no lado norte; “portão do norte” preserva a concisão da descrição arquitetônica.
- source_word: וּמָדַד
  choice: e o mediu
  rationale: O sujeito masculino singular permanece o mesmo. O pronome “o”, cujo antecedente é o portão, explicita em português o objeto implícito no hebraico.
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: conforme estas medidas
  rationale: O prefixo כ expressa correspondência ou conformidade. “Conforme estas medidas” comunica que as dimensões correspondiam às já descritas, sem eliminar a alternativa instrumental possível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Portão” foi preferido a “porta” por se tratar de uma estrutura arquitetônica de acesso; a formulação mantém a concisão técnica do contexto.
