revisions:
- from: Ele me levou até lá, e eis que havia um homem cuja aparência era como a aparência do bronze. Ele tinha na mão um cordão de linho[a] e uma vara de medir, e estava de pé no portal[b].
  to: Ele me levou até lá e eis que havia um homem cuja aparência era como a aparência do bronze, com um cordão de linho na mão[a] e uma vara de medir; ele estava de pé no portal[b].
  rationale: A revisão conserva todas as escolhas lexicais centrais e a ambiguidade quanto à identidade do homem. Ela apenas reúne a descrição dos instrumentos na mesma unidade sintática, preserva explicitamente “na mão” no singular e ajusta a primeira nota para alternativas portuguesas mais naturais e lexicalmente diretas.
