  text: וַ/יָּבֵ֨יא אוֹתִ֜/י שָׁ֗מָּ/ה וְ/הִנֵּה אִישׁ֙ מַרְאֵ֨/הוּ֙ כְּ/מַרְאֵ֣ה נְחֹ֔שֶׁת וּ/פְתִיל פִּשְׁתִּ֥ים בְּ/יָד֖/וֹ וּ/קְנֵ֣ה הַ/מִּדָּ֑ה וְ/ה֥וּא עֹמֵ֖ד בַּ/שָּֽׁעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/003.yaml
  text: He brought me there[a], and behold, there was a man whose appearance was like the appearance of bronze, with a linen cord in his hand and a measuring reed[c][b]; and he was standing in the gateway.
translation:
  language: pt
  text: Ele me levou até lá e eis que havia um homem cuja aparência era como a aparência do bronze, com um cordão de linho na mão[a] e uma vara de medir; ele estava de pé no portal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma linha de linho” ou “um cordão de linho cru”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “junto ao portão”. O termo hebraico pode indicar o portão, a passagem ou toda a estrutura do portal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: Ele me levou até lá
  rationale: A forma narrativa faz a cena avançar, e שָׁמָּה indica movimento até o lugar anteriormente descrito. “Até lá” é natural e explícito em português.
- source_word: וְהִנֵּה
  choice: e eis que
  rationale: Preserva o marcador que introduz vividamente uma nova visão, mantendo o registro profético sem soar arcaico demais.
- source_word: אִישׁ
  choice: um homem
  rationale: Traduz diretamente o substantivo masculino comum, sem identificar a figura como anjo ou manifestação divina.
- source_word: מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת
  choice: cuja aparência era como a aparência do bronze
  rationale: Mantém a repetição intencional de מַרְאֶה e verte נְחֹשֶׁת como “bronze”, opção natural no contexto da aparência metálica visionária.
- source_word: פְּתִיל פִּשְׁתִּים
  choice: um cordão de linho
  rationale: Expressa com clareza um cordão feito de fibra de linho; “cordão de linho” é mais natural no português corrente que “cordão de linho cru” ou “linha de linho”.
- source_word: בְּיָדוֹ
  choice: na mão
  rationale: Preserva o singular explícito do hebraico.
- source_word: קְנֵה הַמִּדָּה
  choice: uma vara de medir
  rationale: קָנֶה designa uma cana usada como instrumento de medição. “Vara de medir” comunica naturalmente a função em português moderno.
- source_word: וְהוּא עֹמֵד
  choice: e estava de pé
  rationale: O particípio retrata uma postura contínua na cena; “estava de pé” preserva esse aspecto descritivo.
- source_word: בַּשַּׁעַר
  choice: no portal
  rationale: No contexto arquitetônico da visão, שַׁעַר pode indicar toda a estrutura ou passagem da entrada, não apenas uma porta. “Portal” é conciso e adequado, com a alternativa registrada em nota.
theological_decisions:
- issue: Identidade do homem na visão
  choice: A figura é chamada apenas de “um homem”.
  alternative: Identificá-lo como mensageiro angelical ou figura teofânica.
  rationale: O hebraico não dá uma identificação mais específica; acrescentá-la resolveria indevidamente uma questão que o texto deixa em aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “aparência... aparência” foi mantida por corresponder à ênfase do hebraico. Os marcadores de nota aparecem no texto em ordem.
