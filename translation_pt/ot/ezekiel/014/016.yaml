source:
  edition: WLC
  text: שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בָּנִ֥ים וְ/אִם בָּנ֖וֹת יַצִּ֑ילוּ הֵ֤מָּה לְ/בַדָּ/ם֙ יִנָּצֵ֔לוּ וְ/הָ/אָ֖רֶץ תִּהְיֶ֥ה שְׁמָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/016.yaml
  text: Even if these three men were in its midst[a], as I live, declares the Lord GOD, they would deliver neither sons nor daughters; they alone would be delivered, and the land would become a desolation.
translation:
  language: pt
  text: Ainda que estes três homens estivessem no meio dela, tão certo como eu vivo — declaração do Senhor Yahweh —, não salvariam nem filhos nem filhas[a]; somente eles seriam salvos, e a terra ficaria desolada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “se filhos e se filhas salvariam”. Neste contexto de juramento, a expressão funciona como negação enfática: “não salvariam nem filhos nem filhas”.'
    reason: Explica o uso idiomático de אִם na fórmula de juramento e registra a forma mais literal do hebraico.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: estes três homens
  rationale: Reproduz de modo direto o demonstrativo e o substantivo masculino; o contexto identifica três figuras masculinas exemplares.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: Expressão natural em português para a presença dentro da terra mencionada no contexto; o pronome feminino retoma “terra”.
- source_word: חַי אָנִי
  choice: tão certo como eu vivo
  rationale: Preserva a fórmula solene de juramento divino com uma construção idiomática e clara em português.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: Mantém a fórmula profética e representa diretamente o nome divino יהוה como “Yahweh”, evitando a combinação pouco natural “Senhor SENHOR”.
- source_word: אִם בָּנִים וְאִם בָּנוֹת יַצִּילוּ
  choice: não salvariam nem filhos nem filhas
  rationale: No contexto do juramento, אִם exprime uma negação enfática; “salvar” comunica com naturalidade o resgate da calamidade e conserva a ligação lexical com a forma passiva seguinte.
- source_word: הֵמָּה לְבַדָּם יִנָּצֵלוּ
  choice: somente eles seriam salvos
  rationale: A ordem e “somente” preservam a ênfase do pronome הֵמָּה e a exclusividade de לְבַדָּם; a voz passiva corresponde ao nifal.
- source_word: וְהָאָרֶץ תִּהְיֶה שְׁמָמָה
  choice: e a terra ficaria desolada
  rationale: Expressa de maneira natural o estado resultante indicado por תִּהְיֶה שְׁמָמָה, sem enfraquecer o juízo anunciado.
theological_decisions:
- issue: Representação do nome divino יהוה no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano SENHOR
  rationale: “Yahweh” conserva o nome da aliança presente no hebraico, enquanto “Senhor” representa אֲדֹנָי.
- issue: Limite da capacidade dos três justos de salvar outras pessoas
  choice: não salvariam nem filhos nem filhas; somente eles seriam salvos
  alternative: não salvariam seus filhos nem suas filhas; apenas escapariam
  rationale: A tradução preserva a forte responsabilidade individual afirmada no oráculo, mas não acrescenta o possessivo “seus”, ausente no texto hebraico, nem extrai conclusões doutrinárias além do contexto imediato.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A construção “ainda que” explicita a relação concessiva implícita no contexto, e o travessão destaca sem obscurecer a fórmula profética. O marcador da nota foi colocado junto à expressão que ela esclarece.
