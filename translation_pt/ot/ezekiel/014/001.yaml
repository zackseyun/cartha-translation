  text: Then some of the elders of Israel came to me and sat before me[a].
translation:
  language: pt
  text: Então, alguns dos anciãos de Israel vieram até mim e se sentaram diante de mim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “homens dentre os anciãos de Israel vieram até mim”; a expressão hebraica salienta que eles procediam do grupo dos anciãos, sem se referir necessariamente ao grupo inteiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֤וֹא
  choice: Então, ... vieram
  rationale: O waw narrativo é expresso por “Então”. Embora o verbo hebraico esteja morfologicamente no singular por preceder o sujeito plural, o português exige concordância no plural.
- source_word: אֵלַי
  choice: até mim
  rationale: Expressa de maneira natural o movimento em direção ao profeta; “a mim” também seria possível, mas é menos corrente neste contexto.
- source_word: אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: alguns dos anciãos de Israel
  rationale: A construção indica homens provenientes do grupo dos anciãos, sem sugerir que todo o corpo de anciãos compareceu. A formulação evita o pouco natural “homens dentre os anciãos”, sem apagar a ideia partitiva.
- source_word: וַיֵּשְׁבוּ
  choice: se sentaram
  rationale: O verbo descreve aqui o ato físico de tomar assento; a forma pronominal é a expressão portuguesa mais natural.
- source_word: לְפָנָי
  choice: diante de mim
  rationale: Preserva o sentido espacial e presencial do idiomatismo hebraico, adequado à cena em que os anciãos se apresentam ao profeta.
