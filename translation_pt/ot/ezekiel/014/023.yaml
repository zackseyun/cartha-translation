  text: וְ/נִחֲמ֣וּ אֶתְ/כֶ֔ם כִּֽי תִרְא֥וּ אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וִֽ/ידַעְתֶּ֗ם כִּי֩ לֹ֨א חִנָּ֤ם עָשִׂ֨יתִי֙ אֵ֣ת כָּל אֲשֶׁר עָשִׂ֣יתִי בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/023.yaml
  text: And they will comfort you when you see their ways and their deeds[a], and you will know that I have not done without cause all that I did in it[c][b], declares the Lord GOD.
translation:
  language: pt
  text: Eles consolarão vocês[a] quando vocês virem os caminhos e as ações deles. Então vocês saberão que não foi sem motivo que fiz tudo o que fiz nela[b] — declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês serão consolados por eles”. A forma hebraica permite entender que os sobreviventes se tornam o meio do consolo quando a conduta deles é vista.'
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, em Jerusalém. Também se pode traduzir: “contra ela”.'
    reason: referent_and_alternative_reading
lexical_decisions:
- source_word: וְנִחֲמוּ אֶתְכֶם
  choice: Eles consolarão vocês
  rationale: Mantém os sobreviventes como sujeito e os ouvintes como objeto. O consolo decorre de se observar a conduta deles; uma nota registra a ambiguidade possível da forma hebraica.
- source_word: כִּי תִרְאוּ
  choice: quando vocês virem
  rationale: Aqui כִּי introduz naturalmente a circunstância em que o consolo ocorrerá. A tradução evita impor uma relação causal mais rígida do que o contexto exige.
- source_word: דַּרְכָּם וְאֶת עֲלִילוֹתָם
  choice: os caminhos e as ações deles
  rationale: “Caminhos” conserva a metáfora hebraica referente à conduta, enquanto “ações” expressa os atos concretos sem fundir os dois termos.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: “Então” explicita com naturalidade em português o resultado indicado pela sequência do discurso, sem alterar seu conteúdo.
- source_word: לֹא חִנָּם
  choice: não foi sem motivo
  rationale: חִנָּם indica que a ação não foi gratuita, arbitrária ou destituída de causa. “Sem motivo” comunica isso em linguagem atual e digna.
- source_word: עָשִׂיתִי אֵת כָּל אֲשֶׁר עָשִׂיתִי
  choice: fiz tudo o que fiz
  rationale: Preserva a repetição enfática do verbo עשה e a abrangência de “tudo”.
- source_word: בָהּ
  choice: nela
  rationale: O pronome feminino remete à cidade de Jerusalém. “Nela” preserva a preposição hebraica sem adotar a interpretação mais específica “contra ela”.
- source_word: נְאֻם אֲדֹנָי יְהוָה
  choice: declara o Senhor Yahweh
  rationale: “Declara” reproduz a fórmula profética; “Senhor” traduz אֲדֹנָי, e “Yahweh” representa diretamente o nome divino יְהוָה.
theological_decisions:
- issue: Como os sobreviventes consolam os ouvintes
  choice: A conduta observável dos sobreviventes leva os ouvintes a reconhecer que o juízo sobre Jerusalém teve motivo.
  alternative: Os sobreviventes seriam um consolo apenas por terem sobrevivido, ou os ouvintes consolariam a si mesmos ao vê-los.
  rationale: A progressão do versículo liga a visão dos caminhos e ações deles ao reconhecimento de que as ações divinas não foram sem motivo. A tradução mantém essa lógica sem ampliar sua explicação no texto principal.
- issue: Sentido de לֹא חִנָּם na ação divina
  choice: O que Deus fez não foi sem motivo.
  alternative: O que Deus fez não foi em vão.
  rationale: No contexto do juízo sobre Jerusalém, o termo ressalta que a ação não foi arbitrária ou gratuita; “não foi em vão” poderia sugerir sobretudo que ela alcançou um resultado útil.
- issue: Forma do título divino אֲדֹנָי יְהוָה
  choice: Senhor Yahweh
  alternative: SENHOR Deus; Soberano Senhor; Senhor DEUS
  rationale: A escolha distingue o título אֲדֹנָי do nome próprio יְהוָה e conserva explicitamente o nome divino presente no hebraico.
translation_notes:
  register: Português moderno, claro e digno, com uso de “vocês” para o plural. A repetição “fiz tudo o que fiz” foi mantida por sua força retórica. “Caminhos” conserva a imagem bíblica, acompanhada de “ações” para assegurar compreensão imediata.
