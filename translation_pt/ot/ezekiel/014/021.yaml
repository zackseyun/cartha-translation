  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר אֲדֹנָ֣/י יְהֹוִ֗ה אַ֣ף כִּֽי אַרְבַּ֣עַת שְׁפָטַ֣/י הָ/רָעִ֡ים חֶ֠רֶב וְ/רָעָ֞ב וְ/חַיָּ֤ה רָעָה֙ וָ/דֶ֔בֶר שִׁלַּ֖חְתִּי אֶל יְרוּשָׁלִָ֑ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/021.yaml
  text: 'For thus says the Lord GOD: How much more when I send my four disastrous judgments against Jerusalem—sword and famine and wild beasts and plague—to cut off from it man and beast![a][b]'
translation:
  language: pt
  text: 'Pois assim diz o Senhor Yahweh: Quanto mais quando eu enviar contra Jerusalém os meus quatro julgamentos devastadores[a] — espada, fome, animais ferozes e peste[b] — para eliminar dela seres humanos e animais!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus quatro julgamentos severos”. O adjetivo hebraico pode significar “maus”, “nocivos” ou “calamitosos” neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “epidemia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Preserva os dois elementos do título hebraico e apresenta o nome divino como Yahweh, sem produzir a repetição pouco natural “Senhor SENHOR”.
- source_word: אַף כִּי
  choice: Quanto mais quando
  rationale: Expressa o argumento a fortiori que retoma o versículo anterior, em vez de reduzir a expressão a uma condição simples.
- source_word: אַרְבַּעַת שְׁפָטַי הָרָעִים
  choice: os meus quatro julgamentos devastadores
  rationale: שְׁפָטִים designa atos punitivos de julgamento, e הָרָעִים descreve seu efeito calamitoso, não uma deficiência moral em Deus.
- source_word: חֶרֶב
  choice: espada
  rationale: Mantém a imagem concreta e tradicional do instrumento de julgamento, sem generalizá-la como “guerra”.
- source_word: רָעָב
  choice: fome
  rationale: É a forma corrente em português para a calamidade coletiva indicada pelo termo neste contexto.
- source_word: חַיָּה רָעָה
  choice: animais ferozes
  rationale: Comunica animais perigosos e predadores sem atribuir-lhes maldade moral.
- source_word: דֶבֶר
  choice: peste
  rationale: Termo claro e corrente para uma epidemia mortífera no contexto profético.
- source_word: שִׁלַּחְתִּי
  choice: eu enviar
  rationale: Embora a forma hebraica seja perfeita, no enunciado retórico ela apresenta o ato divino como o caso culminante contemplado; o futuro do subjuntivo é natural após “quando”.
- source_word: לְהַכְרִית
  choice: para eliminar
  rationale: Transmite a remoção destrutiva expressa pelo verbo hebraico em português natural; “exterminar” seria mais intensivo e “cortar” pouco idiomático aqui.
- source_word: אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  rationale: Reproduz a fórmula abrangente com linguagem atual, deixando claro que אָדָם se refere à humanidade, não apenas a indivíduos do sexo masculino.
theological_decisions:
- issue: Representação de יְהוָה no título composto אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A escolha conserva tanto o título אֲדֹנָי quanto o nome pessoal divino יְהוָה e evita ocultar o nome sob um segundo título.
- issue: Sentido de הָרָעִים aplicado aos julgamentos de Deus
  choice: devastadores
  alternative: maus
  rationale: No contexto, o adjetivo caracteriza os julgamentos como calamitosos em seus efeitos; “maus” poderia sugerir equivocadamente uma avaliação moral negativa dos atos de Deus.
- issue: Força retórica de אַף כִּי
  choice: Quanto mais quando
  alternative: mesmo que
  rationale: O contexto estabelece uma progressão do caso anterior para o caso mais grave de Jerusalém; a tradução mantém essa relação sem transformar a frase em mera hipótese concessiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “Quanto mais quando” preserva deliberadamente a ligação retórica com o versículo anterior. O paralelismo final usa “seres humanos e animais” para comunicar de modo inclusivo e natural a fórmula hebraica.
