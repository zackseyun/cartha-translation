reference: Ezekiel 14:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/הַ/נָּבִ֤יא כִֽי יְפֻתֶּה֙ וְ/דִבֶּ֣ר דָּבָ֔ר אֲנִ֤י יְהוָה֙ פִּתֵּ֔יתִי אֵ֖ת הַ/נָּבִ֣יא הַ/ה֑וּא וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עָלָ֔י/ו וְ/הִ֨שְׁמַדְתִּ֔י/ו מִ/תּ֖וֹךְ עַמִּ֥/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/009.yaml
  text: And if the prophet is deceived and speaks a word[a], I, Yahweh, have deceived that prophet; and I will stretch out my hand against him and destroy him from the midst of my people Israel.
translation:
  language: pt
  text: E, se o profeta for enganado e disser alguma palavra, fui eu, Yahweh, que enganei esse profeta[a]. Estenderei a mão contra ele e o destruirei do meio do meu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seduzi esse profeta”. Alguns entendem o sentido de maneira mais permissiva: “permiti que esse profeta fosse enganado”.'
    reason: Registra nuances possíveis de פתה e uma interpretação permissiva tradicional, preservando no texto principal a agência expressa no hebraico.
lexical_decisions:
- source_word: יְפֻתֶּה
  choice: for enganado
  rationale: O Pual de פתה tem sentido passivo. “For enganado” comunica com clareza que o profeta cai em engano e se ajusta ao contexto judicial, sem excluir por completo a nuance de sedução.
- source_word: וְדִבֶּר דָּבָר
  choice: e disser alguma palavra
  rationale: Mantém o substantivo “palavra” e a concisão da expressão hebraica, com formulação natural em português.
- source_word: אֲנִי יְהוָה
  choice: fui eu, Yahweh
  rationale: O pronome explícito torna a afirmação enfática. A construção portuguesa “fui eu” preserva essa ênfase, e “Yahweh” representa diretamente o nome divino.
- source_word: פִּתֵּיתִי
  choice: enganei
  rationale: O Piel na primeira pessoa atribui diretamente a ação a Yahweh e emprega a mesma raiz de יְפֻתֶּה. A tradução não atenua essa afirmação difícil com uma formulação meramente permissiva.
- source_word: וְנָטִיתִי אֶת יָדִי עָלָיו
  choice: Estenderei a mão contra ele
  rationale: Preserva a imagem hebraica convencional de intervenção divina em juízo e soa natural em português bíblico atual.
- source_word: וְהִשְׁמַדְתִּיו
  choice: e o destruirei
  rationale: Expressa a força causativa de שׁמד sem recorrer a uma formulação coloquial ou desnecessariamente ampliada.
- source_word: מִתּוֹךְ עַמִּי יִשְׂרָאֵל
  choice: do meio do meu povo Israel
  rationale: Reflete de perto a expressão hebraica e comunica a remoção do profeta de dentro da comunidade de Israel.
theological_decisions:
- issue: A agência divina no engano do profeta
  choice: 'Manter no texto principal a declaração direta: “fui eu, Yahweh, que enganei esse profeta”.'
  alternative: “permiti que esse profeta fosse enganado” ou “seduzi esse profeta”
  rationale: O hebraico atribui explicitamente a ação a Yahweh e repete a mesma raiz verbal usada para o engano do profeta. A tradução preserva essa tensão teológica, enquanto a nota registra nuances possíveis sem impor uma solução interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para naturalidade, mas a repetição da raiz “enganado/enganei”, a ênfase em Yahweh e a imagem da mão estendida foram preservadas.
