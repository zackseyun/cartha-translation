  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ֠/הָיוּ שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ בְּ/תוֹכָ֔/הּ נֹ֖חַ דנאל וְ/אִיּ֑וֹב הֵ֤מָּה בְ/צִדְקָתָ/ם֙ יְנַצְּל֣וּ נַפְשָׁ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/014.yaml
  text: even if these three men were in its midst—Noah[a], Daniel, and Job—they would deliver only themselves by their righteousness, declares the Lord GOD.
translation:
  language: pt
  text: mesmo que estes três homens estivessem no meio dela — Noé, Daniel[a] e Jó — eles livrariam apenas a si mesmos por sua própria justiça, declara o Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico דנאל também pode ser vertido como “Danel”; alguns entendem que se trata da figura Danel, conhecida no antigo Oriente Próximo, e não do Daniel bíblico.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיוּ
  choice: mesmo que ... estivessem
  rationale: No contexto do oráculo de juízo, a construção tem sentido concessivo e condicional; esta formulação reproduz naturalmente esse valor em português.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: estes três homens
  rationale: Tradução direta e natural, preservando a referência masculina específica.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: O sufixo feminino singular retoma a terra mencionada no contexto; a expressão conserva a referência sem explicitá-la indevidamente.
- source_word: נֹחַ
  choice: Noé
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: דנאל
  choice: Daniel
  rationale: Forma bíblica tradicional em português; a grafia hebraica sem yod e a possível leitura 'Danel' são registradas em nota.
- source_word: וְאִיּוֹב
  choice: e Jó
  rationale: Forma tradicional do nome em português, com a conjunção preservada.
- source_word: הֵמָּה
  choice: eles
  rationale: O pronome independente é representado explicitamente; a ênfase e a exclusividade são reforçadas por 'apenas a si mesmos'.
- source_word: בְצִדְקָתָם
  choice: por sua justiça
  rationale: צְדָקָה indica aqui a retidão pessoal dos três homens, e 'por' exprime de modo natural o valor instrumental.
- source_word: יְנַצְּלוּ
  choice: livrariam
  rationale: O verbo נצל significa arrancar do perigo, resgatar ou livrar; 'livrariam' se ajusta ao registro profético e ao contexto de juízo.
- source_word: נַפְשָׁם
  choice: apenas a si mesmos
  rationale: נֶפֶשׁ refere-se aqui às próprias pessoas ou vidas deles. 'A si mesmos' comunica com clareza que não livrariam outros; 'apenas' explicita a exclusividade exigida pelo contexto.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: נְאֻם é a fórmula profética 'declara'. אֲדֹנָי é traduzido por 'Senhor', e o nome divino יהוה é representado como 'Yahweh', evitando ocultar o nome e também a repetição 'Senhor SENHOR'.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Senhor DEUS
  rationale: A formulação distingue o título אֲדֹנָי do nome próprio יהוה e preserva na tradução o nome divino presente no hebraico.
- issue: Identificação de דנאל
  choice: Daniel no texto principal, com nota sobre Danel
  alternative: Danel no texto principal
  rationale: A tradição bíblica identifica o nome como Daniel, mas a grafia consonantal דנאל permite a leitura Danel e pode apontar para a figura conhecida em textos do antigo Oriente Próximo. A nota preserva essa incerteza sem impô-la ao texto principal.
- issue: Alcance da libertação pela justiça dos três homens
  choice: apenas a si mesmos
  alternative: suas próprias vidas
  rationale: A formulação comunica que a justiça deles não livraria outras pessoas, preservando o contraste teológico do oráculo sem transformar a frase numa afirmação geral sobre mérito ou salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concessiva, o vocabulário profético e a ambiguidade do nome דנאל foram preservados sem linguagem denominacional.
