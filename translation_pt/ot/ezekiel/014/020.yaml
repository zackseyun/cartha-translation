  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: וְ/נֹ֨חַ דנאל וְ/אִיּוֹב֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בֵּ֥ן אִם בַּ֖ת יַצִּ֑ילוּ הֵ֥מָּה בְ/צִדְקָתָ֖/ם יַצִּ֥ילוּ נַפְשָֽׁ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/020.yaml
  text: Even if Noah[a], Daniel, and Job were in it, as I live, declares the Lord GOD, they would deliver neither son nor daughter; by their righteousness they would deliver only themselves.
translation:
  language: pt
  text: Mesmo que Noé, Daniel[a] e Jó estivessem no meio dela, tão certo como eu vivo — declara o Senhor Yahweh —, não livrariam nem filho nem filha; por sua justiça, livrariam somente a si mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico דנאל também pode ser lido como “Danel”, talvez em referência a uma antiga figura justa, e não ao Daniel mais conhecido.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: Preserva a imagem locativa e o sufixo feminino, que retoma a terra no contexto; é natural em português.
- source_word: חַי אָנִי נְאֻם אֲדֹנָי יְהוִה
  choice: tão certo como eu vivo — declaração do Senhor Yahweh —
  rationale: Expressa claramente a força solene da fórmula de juramento divina e representa o título אֲדֹנָי seguido do nome יהוה sem ocultar o nome próprio.
- source_word: אִם בֵּן אִם בַּת
  choice: nem filho nem filha
  rationale: No contexto do juramento, a construção hebraica exclui enfaticamente ambos.
- source_word: יַצִּילוּ
  choice: livrariam
  rationale: O hifil de נצל indica fazer escapar ou resgatar do juízo; o condicional concorda naturalmente com a hipótese iniciada por 'mesmo que'.
- source_word: הֵמָּה
  choice: a si mesmos
  rationale: A combinação do pronome enfático com נַפְשָׁם salienta que apenas os próprios justos escapariam.
- source_word: בְצִדְקָתָם
  choice: por sua justiça
  rationale: Mantém a justiça deles como meio ou fundamento do livramento sem explicar além do texto.
- source_word: נַפְשָׁם
  choice: a si mesmos
  rationale: Neste contexto, נֶפֶשׁ designa as próprias pessoas ou vidas, não especificamente uma alma imaterial.
- source_word: דנאל
  choice: Daniel
  rationale: Mantém a forma tradicional e reconhecível no texto principal, enquanto a grafia consonantal incomum e a leitura alternativa 'Danel' são registradas em nota.
theological_decisions:
- issue: Representação de אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Soberano Senhor; Senhor DEUS
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e preserva este último como nome próprio.
- issue: Identidade de דנאל
  choice: Daniel no texto principal, com nota sobre Danel
  alternative: Danel no texto principal
  rationale: A grafia hebraica permite debate sobre a identidade. A tradução conserva a leitura tradicional sem silenciar a alternativa nem decidir uma questão que o próprio texto não resolve.
- issue: Alcance da justiça dos três homens
  choice: somente a si mesmos
  alternative: suas próprias vidas
  rationale: Preserva a afirmação de que a justiça deles não livraria seus filhos, sem desenvolver uma doutrina mais ampla além deste cenário de juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula 'tão certo como eu vivo' comunica a força do juramento com mais naturalidade do que o literal 'vivo eu'. O feminino em 'dela' conserva a referência contextual à terra.
