  text: א֛וֹ דֶּ֥בֶר אֲשַׁלַּ֖ח אֶל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/שָׁפַכְתִּ֨י חֲמָתִ֤/י עָלֶ֨י/הָ֙ בְּ/דָ֔ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/019.yaml
  text: Or if I send a plague against that land and pour out my wrath on it with blood[a], to cut off from it man and beast,
translation:
  language: pt
  text: Ou, se eu enviar uma peste contra aquela terra e derramar sobre ela a minha ira com sangue[a], para eliminar dela seres humanos e animais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de derramamento de sangue”. Em hebraico, literalmente, “em sangue”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Ou, se
  rationale: No encadeamento de juízos hipotéticos, introduz mais uma possibilidade; a inclusão de “se” explicita naturalmente em português a força condicional do contexto.
- source_word: דֶּבֶר
  choice: peste
  rationale: Designa uma epidemia devastadora enviada como juízo; “peste” é corrente, clara e mantém a gravidade do termo.
- source_word: אֲשַׁלַּח
  choice: eu enviar
  rationale: Tradução direta do verbo; o pronome expresso dá clareza e ênfase adequada à fala divina.
- source_word: אֶל הָאָרֶץ הַהִיא
  choice: contra aquela terra
  rationale: Embora אֶל indique direção, neste contexto de juízo “contra” comunica naturalmente a ação hostil dirigida à terra.
- source_word: וְשָׁפַכְתִּי חֲמָתִי
  choice: e derramar ... a minha ira
  rationale: Preserva a metáfora hebraica de derramar e a intensidade de חֲמָה, em linguagem portuguesa digna e corrente.
- source_word: עָלֶיהָ
  choice: sobre ela
  rationale: Retoma “terra”, substantivo feminino em português, e conserva a relação espacial/metafórica do hebraico.
- source_word: בְּדָם
  choice: com sangue
  rationale: Mantém a formulação breve e concreta do hebraico, sem decidir no corpo do texto se o sangue é meio, circunstância ou metonímia de derramamento de sangue; a nota registra a principal explicitação alternativa.
- source_word: לְהַכְרִית
  choice: para eliminar
  rationale: O Hifil de כרת aqui indica fazer desaparecer ou exterminar da terra. “Eliminar” transmite o resultado do juízo com naturalidade, sem acrescentar intensidade não expressa.
- source_word: מִמֶּנָּה
  choice: dela
  rationale: Retoma de modo conciso e natural “aquela terra”.
- source_word: אָדָם
  choice: seres humanos
  rationale: Neste par formular com os animais, אָדָם tem referência coletiva à humanidade, não apenas a homens do sexo masculino.
- source_word: וּבְהֵמָה
  choice: e animais
  rationale: No contraste abrangente com os seres humanos, o termo designa os animais; “animais” é mais natural e amplo para leitores modernos do que “bestas”.
theological_decisions:
- issue: Sentido coletivo de אָדָם na fórmula de juízo
  choice: seres humanos
  alternative: homem
  rationale: A expressão abrange a vida humana em geral em contraste com a vida animal. “Seres humanos” evita uma leitura exclusivamente masculina sem reduzir a extensão do juízo.
- issue: Relação semântica de בְּדָם com o derramamento da ira
  choice: com sangue
  alternative: por meio de derramamento de sangue
  rationale: A construção hebraica é condensada e admite mais de uma nuance. O texto conserva sua imagem concreta, e a nota oferece a leitura metonímica mais explícita sem torná-la obrigatória.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom solene do anúncio de juízo, preserva a metáfora de derramar a ira e conserva, por meio de nota, a concisão ambígua de בְּדָם.
