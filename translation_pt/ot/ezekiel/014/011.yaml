source:
  edition: WLC
  text: לְ֠מַעַן לֹֽא יִתְע֨וּ ע֤וֹד בֵּֽית יִשְׂרָאֵל֙ מֵ/אַֽחֲרַ֔/י וְ/לֹֽא יִטַּמְּא֥וּ ע֖וֹד בְּ/כָל פִּשְׁעֵי/הֶ֑ם וְ/הָ֥יוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/011.yaml
  text: so that the house of Israel may no longer go astray from me[a], and may no longer defile themselves with all their transgressions, but may be my people, and I may be their God, declares the Lord GOD.
translation:
  language: pt
  text: para que a casa de Israel não mais se desvie de mim[a], nem se contamine com todas as suas transgressões, mas seja para mim um povo, e eu seja o seu Deus — declaração do Senhor Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “andem errantes de detrás de mim”. A expressão hebraica descreve o afastamento de seguir Yahweh com fidelidade.
    reason: Preserva a imagem de תעה e מֵאַחֲרַי sem atribuir à formulação literal elementos interpretativos ou a noção de repetição expressa na tradução principal.
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado pretendido e corresponde naturalmente à força do hebraico.
- source_word: יִתְעוּ ... מֵאַחֲרַי
  choice: se desviar, deixando de me seguir
  rationale: תעה expressa desviar-se ou andar errante, enquanto מֵאַחֲרַי significa literalmente afastar-se de seguir alguém. A formulação preserva tanto o desvio quanto a imagem de deixar de seguir Yahweh.
- source_word: יִטַּמְּאוּ
  choice: se contaminar
  rationale: A forma reflexiva indica contaminação contraída pelos próprios israelitas e comporta as dimensões moral e ritual do termo.
- source_word: בְּכָל פִּשְׁעֵיהֶם
  choice: com todas as suas transgressões
  rationale: פשע designa transgressão com forte matiz de rebeldia; a preposição pode indicar o meio pelo qual se contaminam.
- source_word: וְהָיוּ לִי לְעָם
  choice: eles serão o meu povo
  rationale: Reproduz em português natural a fórmula da aliança. O futuro se ajusta à sequência final introduzida por לְמַעַן sem transformar a frase em mero desejo.
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: e eu serei o seu Deus
  rationale: Preserva a fórmula relacional da aliança e traduz diretamente אֶהְיֶה.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declaração do Senhor Yahweh
  rationale: נְאֻם é uma fórmula profética de pronunciamento. 'Senhor Yahweh' distingue o título אֲדֹנָי do nome divino יהוה e evita a expressão artificial 'Senhor SENHOR'.
theological_decisions:
- issue: Fórmula da aliança
  choice: eles serão o meu povo, e eu serei o seu Deus
  alternative: eles serão para mim um povo, e eu serei para eles Deus
  rationale: A expressão idiomática preserva a conhecida fórmula da aliança sem acrescentar conteúdo doutrinário.
- issue: Sentido de מֵאַחֲרַי
  choice: deixando de me seguir
  alternative: afastando-se de mim
  rationale: A escolha mantém explícita a imagem hebraica de seguir Yahweh e, portanto, a dimensão de lealdade, sem reduzir a expressão a mera distância espacial.
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto traz o nome pessoal da aliança após אֲדֹנָי; transliterá-lo preserva a distinção presente no hebraico.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'casa de Israel' e 'transgressões' para conservar o registro profético e pactual; usa uma nota para preservar a imagem hebraica sem tornar a frase principal artificial.
