  text: לְמַ֛עַן תְּפֹ֥שׂ אֶת בֵּֽית יִשְׂרָאֵ֖ל בְּ/לִבָּ֑/ם אֲשֶׁ֤ר נָזֹ֨רוּ֙ מֵֽ/עָלַ֔/י בְּ/גִלּֽוּלֵי/הֶ֖ם כֻּלָּֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/005.yaml
  text: so that I may seize the house of Israel by their heart[b][a], because all of them have turned away from me through their idols.
translation:
  language: pt
  text: para que eu apanhe a casa de Israel em seu coração[a], pois todos eles se afastaram de mim por meio de seus ídolos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pelo coração” ou “por meio de seu coração”. A expressão hebraica é difícil e pode indicar tanto a esfera quanto o meio pelo qual o SENHOR apanha Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “se tornaram estranhos para mim por meio de seus ídolos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade da ação divina de modo natural e preserva a força de propósito.
- source_word: תְּפֹשׂ
  choice: eu apanhe
  rationale: Preserva a metáfora vigorosa de capturar ou tomar alguém, sem reduzi-la a mera persuasão.
- source_word: אֶת בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a expressão coletiva e pactual do hebraico.
- source_word: בְּלִבָּם
  choice: em seu coração
  rationale: Conserva o substantivo coletivo no singular e apresenta o coração como esfera em que Israel é apanhado; a possível nuance instrumental é registrada em nota.
- source_word: אֲשֶׁר
  choice: pois
  rationale: No contexto, introduz a razão ou circunstância que explica a ação divina.
- source_word: נָזֹרוּ
  choice: se afastaram
  rationale: Expressa em português corrente a separação ou alienação indicada pelo nifal de זור.
- source_word: מֵעָלַי
  choice: de mim
  rationale: Marca diretamente a separação em relação ao SENHOR.
- source_word: בְּגִלּוּלֵיהֶם
  choice: por meio de seus ídolos
  rationale: Representa a possível força instrumental da preposição ב e mantém o termo característico de Ezequiel para imagens idolátricas.
- source_word: כֻּלָּם
  choice: todos eles
  rationale: Preserva explicitamente a ênfase na totalidade do grupo.
theological_decisions:
- issue: A ação divina dirigida ao coração de Israel
  choice: eu apanhe a casa de Israel em seu coração
  alternative: eu apanhe a casa de Israel pelo coração
  rationale: A construção hebraica é compacta e ambígua quanto a esfera ou meio. O texto principal usa uma formulação compreensível em português, enquanto a nota preserva a leitura instrumental sem transformar a imagem em persuasão afetiva.
- issue: A natureza da apostasia de Israel
  choice: se afastaram de mim
  alternative: se tornaram estranhos para mim
  rationale: A escolha comunica com clareza a ruptura de relação expressa pelo verbo hebraico; a alternativa mais resultativa é mantida em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a imagem judicial de captura, o singular coletivo “coração” e a ambiguidade legítima da preposição hebraica.
