  source_fidelity: A tradução preserva corretamente a sequência condicional, a agência divina, o sentido adversativo de «contra aquela terra» e a fórmula abrangente referente à vida humana e animal. Contudo, «atravesse a terra» pode sugerir apenas cruzar a terra de um lado a outro; «passe pela terra» reproduz mais precisamente a imagem de a espada percorrer o território.
  naturalness: «Eliminar dela seres humanos e animais» é compreensível, mas a colocação de «dela» entre o verbo e os objetos é pouco natural no português atual. «Eliminar da terra seres humanos e animais» é mais fluente e mantém o referente explícito.
  terminology: «Espada» mantém adequadamente a imagem profética concreta. «Seres humanos e animais» comunica com clareza o alcance genérico de אָדָם וּבְהֵמָה; a nota informa de modo útil a expressão hebraica subjacente.
