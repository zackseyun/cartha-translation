base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/017.yaml
  text: Or if I bring a sword against that land and say[a], ‘Let a sword pass through the land,’ and I cut off from it man and beast,
translation:
  language: pt
  text: 'Ou, se eu trouxer uma espada contra aquela terra e disser: “Que a espada passe pela terra”, e eliminar da terra seres humanos e animais,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “homem e animal”, expressão recorrente que indica a eliminação tanto da vida humana quanto da animal na terra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֛וֹ
  choice: Ou, se
  rationale: Introduz mais uma situação condicional na sequência de juízos; o contexto fornece a força de “se”.
- source_word: חֶ֥רֶב
  choice: uma espada
  rationale: A primeira ocorrência introduz a calamidade; “espada” também funciona profeticamente como imagem de guerra e morte violenta.
- source_word: אָבִ֖יא
  choice: eu trouxer
  rationale: O hifil de בוא expressa fazer vir ou trazer, preservando aqui a ação divina dentro da condição.
- source_word: עַל הָאָרֶץ הַהִיא
  choice: contra aquela terra
  rationale: No contexto de juízo, עַל tem força adversativa, não apenas espacial.
- source_word: וְאָמַרְתִּי
  choice: e disser
  rationale: A forma verbal continua naturalmente a oração condicional em português.
- source_word: חֶרֶב תַּעֲבֹר בָּאָרֶץ
  choice: Que a espada atravesse a terra
  rationale: Expressa o decreto divino com valor volitivo e mantém a imagem da espada percorrendo toda a terra.
- source_word: וְהִכְרַתִּי
  choice: e eliminar
  rationale: כרת, nesta fórmula de juízo, indica remover ou exterminar; “eliminar” comunica o resultado sem perder a gravidade.
- source_word: מִמֶּנָּה
  choice: dela
  rationale: Retoma naturalmente o substantivo feminino “terra” em português.
- source_word: אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  rationale: Reproduz de modo claro e atual a fórmula abrangente que inclui a vida humana e animal.
theological_decisions:
- issue: Sentido genérico de אָדָם na fórmula de juízo
  choice: seres humanos
  alternative: homem; gente; humanidade
  rationale: Aqui אָדָם não designa um indivíduo masculino, mas a população humana em contraste abrangente com os animais. “Seres humanos” preserva esse alcance sem introduzir distinção de gênero inexistente no contexto.
- issue: Força de חֶרֶב no decreto
  choice: manter a imagem concreta de “espada”
  alternative: guerra
  rationale: Embora “espada” possa representar metonimicamente a guerra, conservar a imagem mantém a linguagem profética e sua possível amplitude.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção permanece ligada ao contexto anterior por terminar em vírgula, como no versículo-fonte.
