  text: וְ/נָתַתִּ֨י פָנַ֜/י בָּ/אִ֣ישׁ הַ/ה֗וּא וַ/הֲשִֽׂמֹתִ֨י/הוּ֙ לְ/א֣וֹת וְ/לִ/מְשָׁלִ֔ים וְ/הִכְרַתִּ֖י/ו מִ/תּ֣וֹךְ עַמִּ֑/י וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/008.yaml
  text: And I will set my face against that man[a], and I will make him a sign and a proverb, and I will cut him off from the midst of my people. Then you will know that I am Yahweh.
translation:
  language: pt
  text: Porei o meu rosto contra aquele homem, farei dele um sinal e um provérbio[a] e o eliminarei do meio do meu povo. Então vocês saberão que eu sou Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “motivo de ditos populares” ou “motivo de zombaria”. O termo hebraico pode designar um provérbio, um dito de escárnio ou uma expressão pública a respeito de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא
  choice: Porei o meu rosto contra aquele homem
  rationale: Conserva a imagem concreta e a força judicial da expressão hebraica, na qual Deus se coloca em oposição decidida ao indivíduo.
- source_word: וַהֲשִׂמֹתִיהוּ לְאוֹת
  choice: farei dele um sinal
  rationale: Expressa naturalmente em português que o homem será transformado em exemplo público do juízo divino, sem acrescentar a interpretação mais específica de “sinal de advertência”.
- source_word: וְלִמְשָׁלִים
  choice: e um provérbio
  rationale: Mantém o núcleo lexical de מָשָׁל. Embora o hebraico esteja no plural e possa abranger provérbios, ditos de escárnio ou fórmulas populares, o singular funciona naturalmente como predicativo do indivíduo; a amplitude semântica é indicada em nota.
- source_word: וְהִכְרַתִּיו מִתּוֹךְ עַמִּי
  choice: e o eliminarei do meio do meu povo
  rationale: “Eliminar do meio” comunica com clareza a exclusão severa indicada pelo Hifil de כרת, conservando a imagem espacial de מִתּוֹךְ. “Cortarei” seria mais literal, mas menos natural e potencialmente ambíguo em português atual.
- source_word: וִידַעְתֶּם
  choice: Então vocês saberão
  rationale: “Então” explicita a relação resultante entre o juízo e o reconhecimento de quem é Yahweh; “vocês” representa corretamente a segunda pessoa masculina plural.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Preserva o nome divino pessoal representado pelo Tetragrama, em vez de substituí-lo por um título.
theological_decisions:
- issue: A imagem do rosto divino na fórmula de juízo
  choice: Porei o meu rosto contra aquele homem
  alternative: Voltarei o meu rosto contra aquele homem
  rationale: A opção escolhida preserva a formulação antropomórfica e o sentido de oposição ativa, sem sugerir simplesmente que Deus deixa de olhar para o homem.
- issue: O sentido de מְשָׁלִים no contexto de juízo
  choice: um provérbio
  alternative: motivo de zombaria / objeto de ditos populares
  rationale: “Provérbio” conserva o sentido lexical central e a tensão do termo, enquanto a nota registra os matizes públicos e depreciativos plausíveis no contexto.
- issue: A extensão de וְהִכְרַתִּיו
  choice: o eliminarei do meio do meu povo
  alternative: o excluirei do meio do meu povo / o destruirei
  rationale: O hebraico afirma um corte severo do meio do povo, mas não define aqui, isoladamente, se a ênfase recai em morte, destruição ou exclusão; a tradução evita resolver essa questão de modo mais específico do que o texto.
translation_notes:
  register: Português moderno, solene e acessível, com ampla legibilidade brasileira. A colocação do pronome em “o eliminarei” mantém dignidade literária sem recorrer a vocabulário arcaico. A forma “vocês” é clara no português internacional de leitura brasileira.
