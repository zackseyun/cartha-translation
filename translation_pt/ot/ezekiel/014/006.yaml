id: EZK.14.6
reference: Ezekiel 14:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה שׁ֣וּבוּ וְ/הָשִׁ֔יבוּ מֵ/עַ֖ל גִּלּֽוּלֵי/כֶ֑ם וּ/מֵ/עַ֥ל כָּל תּוֹעֲבֹתֵי/כֶ֖ם הָשִׁ֥יבוּ פְנֵי/כֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/006.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: Turn back, and turn away from your idols[b], and turn your faces away from all your abominations.’'
translation:
  language: pt
  text: 'Por isso, diga à casa de Israel: “Assim diz o Senhor Yahweh: Voltem-se e afastem-se dos seus ídolos; desviem o rosto de todas as suas abominações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Por isso
  rationale: Introduz naturalmente a consequência da acusação precedente e preserva a lógica profética.
- source_word: אֱמֹר אֶל־בֵּית יִשְׂרָאֵל
  choice: diga à casa de Israel
  rationale: Mantém a fórmula de comissão profética e a designação coletiva e pactual 'casa de Israel'.
- source_word: כֹּה אָמַר
  choice: Assim diz
  rationale: Fórmula profética tradicional, clara e digna em português.
- source_word: אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  rationale: Distingue o título אֲדֹנָי do nome divino יהוה e evita a combinação pouco clara 'Senhor SENHOR'.
- source_word: שׁוּבוּ
  choice: Voltem!
  rationale: Preserva a imagem concreta de retorno de שׁוב e, no contexto, comunica um chamado ao arrependimento sem substituí-la por um termo teológico mais estreito.
- source_word: וְהָשִׁיבוּ מֵעַל גִּלּוּלֵיכֶם
  choice: Afastem-se dos seus ídolos
  rationale: Expressa em português natural a força causativa/reflexiva do hifil e a separação exigida em relação aos ídolos.
- source_word: גִּלּוּלֵיכֶם
  choice: seus ídolos
  rationale: Transmite o referente contextual com clareza; o caráter depreciativo do termo hebraico é reconhecido sem recorrer a uma formulação etimológica excessivamente gráfica.
- source_word: וּמֵעַל כָּל תּוֹעֲבֹתֵיכֶם
  choice: de todas as suas práticas detestáveis
  rationale: No contexto, תועבות abrange atos e objetos religiosos ofensivos; 'práticas detestáveis' torna o sentido acessível sem reduzir a gravidade moral e cultual.
- source_word: הָשִׁיבוּ פְנֵיכֶם
  choice: desviem o rosto
  rationale: Conserva a imagem corporal hebraica de uma mudança deliberada de orientação; o afastamento é indicado pelo contexto e pela regência da frase coordenada.
theological_decisions:
- issue: Representação do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução mantém separadamente o título 'Senhor' e o nome pactual Yahweh, em vez de ocultar o nome ou produzir a repetição 'Senhor SENHOR'.
- issue: Sentido penitencial de שׁוב
  choice: Voltem!
  alternative: Arrependam-se!
  rationale: O contexto exige arrependimento e abandono da idolatria, mas o verbo hebraico conserva a metáfora de retornar. 'Voltem' preserva essa amplitude e a frase seguinte explicita a mudança requerida.
- issue: Extensão de תּוֹעֲבוֹת
  choice: práticas detestáveis
  alternative: abominações
  rationale: '''Práticas detestáveis'' comunica de modo natural a repulsa moral e cultual do termo, sem impor que ele designe apenas objetos ou apenas atos.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo inicial foi isolado por pontuação para reproduzir a força do chamado profético. Não foram necessárias notas de rodapé, pois 'Yahweh' explicita diretamente o nome divino e as escolhas lexicais cabem no texto principal.
