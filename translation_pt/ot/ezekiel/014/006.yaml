  naturalness: O texto é claro, atual e digno. “Desviem o rosto de” é idiomático em português e conserva de forma suficiente a imagem hebraica de orientar o rosto para longe. “Voltem-se” oferece uma ligação um pouco mais natural com a sequência de imperativos de afastamento.
  terminology: “Ídolos” é uma boa tradução contextual de גִּלּוּלִים. “Abominações” preserva melhor a amplitude e a gravidade cultual e moral de תּוֹעֲבוֹת do que “práticas detestáveis”, sem impor uma delimitação indevida. “Senhor Yahweh” mantém distintos o título e o nome divino.
