  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: כִּי֩ אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מֵ/הַ/גֵּר֮ אֲשֶׁר יָג֣וּר בְּ/יִשְׂרָאֵל֒ וְ/יִנָּזֵ֣ר מֵֽ/אַחֲרַ֗/י וְ/יַ֤עַל גִּלּוּלָי/ו֙ אֶל לִבּ֔/וֹ וּ/מִכְשׁ֣וֹל עֲוֺנ֔/וֹ יָשִׂ֖ים נֹ֣כַח פָּנָ֑י/ו וּ/בָ֤א אֶל הַ/נָּבִיא֙ לִ/דְרָשׁ ל֣/וֹ בִ֔/י אֲנִ֣י יְהוָ֔ה נַֽעֲנֶה לּ֖/וֹ בִּֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/007.yaml
  text: For any man from the house of Israel[a], or from the foreigner who sojourns in Israel, who separates himself from following me and brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet to inquire of me through him, I, Yahweh[d][c][b], will answer him myself.
translation:
  language: pt
  text: Pois todo homem da casa de Israel[a], ou todo estrangeiro que resida em Israel[b], que se afastar de me seguir[c], elevar seus ídolos ao coração, puser diante de si a pedra de tropeço da sua iniquidade e vier ao profeta para me consultar por meio dele — eu, Yahweh, lhe responderei eu mesmo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “cada homem” ou “qualquer homem”. O hebraico repete “homem” para dar ênfase distributiva.
    reason: lexical_alternative
  - marker: b
    text: Isto é, um não israelita estabelecido e vivendo entre o povo de Israel; tradicionalmente, “estrangeiro residente”.
    reason: cultural_note
  - marker: c
    text: O hebraico diz literalmente “se separar de após mim”, isto é, afastar-se de seguir Yahweh.
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “responderei a ele por mim mesmo”. A expressão hebraica é compacta e enfática, e o sentido exato de sua expressão final é discutido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: todo homem
  rationale: 'A repetição do substantivo hebraico tem força distributiva: cada homem, considerado individualmente. “Todo homem” conserva tanto essa ênfase quanto a forma masculina do texto.'
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: da casa de Israel
  rationale: Mantém a expressão nacional e pactual do hebraico sem reduzi-la simplesmente a “Israel”.
- source_word: הַגֵּר אֲשֶׁר יָגוּר
  choice: todo estrangeiro que resida
  rationale: גֵּר designa aqui um não israelita estabelecido entre o povo. “Estrangeiro que resida” comunica essa condição em português atual sem recorrer ao tecnicismo “alienígena residente”.
- source_word: וְיִנָּזֵר מֵאַחֲרַי
  choice: que se afastar de me seguir
  rationale: Preserva a ideia reflexiva de separar-se e a imagem hebraica de deixar de seguir atrás de Yahweh.
- source_word: וְיַעַל גִּלּוּלָיו אֶל לִבּוֹ
  choice: erguer seus ídolos no coração
  rationale: Conserva a metáfora de elevar ou fazer subir os ídolos ao coração, sem explicá-la como mera preferência interior.
- source_word: מִכְשׁוֹל עֲוֺנוֹ
  choice: a pedra de tropeço da sua iniquidade
  rationale: A formulação mantém a imagem recorrente em Ezequiel e a gravidade moral de עָוֹן. “Pedra de tropeço” é uma expressão portuguesa clara e tradicional para algo que ocasiona queda.
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: puser diante de si
  rationale: Expressa naturalmente em português a imagem literal de colocar algo diante do próprio rosto.
- source_word: לִדְרָשׁ לוֹ בִי
  choice: para me consultar por meio dele
  rationale: No contexto, o homem procura uma resposta de Deus recorrendo ao profeta como intermediário. A tradução preserva essa relação sem fazer do profeta a fonte da resposta.
- source_word: נַעֲנֶה לוֹ בִּי
  choice: responderei pessoalmente a ele
  rationale: A construção final é compacta e difícil, mas enfatiza que o próprio Yahweh dará a resposta. “Pessoalmente” comunica essa ênfase em português natural.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto emprega diretamente o Tetragrama. “Yahweh” representa o nome próprio divino e evita convertê-lo em título.
- issue: Masculino singular distributivo אִישׁ אִישׁ
  choice: todo homem
  alternative: qualquer pessoa
  rationale: A opção conserva a forma masculina explícita da fonte e sua força distributiva, sem impedir que a advertência seja entendida em seu alcance geral.
- issue: Agência divina na resposta final
  choice: eu, Yahweh, responderei pessoalmente a ele
  alternative: eu, Yahweh, lhe responderei por mim mesmo
  rationale: A redação preserva a ênfase de que a resposta procede do próprio Yahweh, sem definir além do que o hebraico permite o valor exato do בִּי final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe longa do hebraico foi preservada como uma única construção condicional, marcada por travessão antes da declaração divina. Mantiveram-se as imagens do coração e da pedra de tropeço, sem suavizar a tensão entre consulta religiosa externa e afastamento interior.
