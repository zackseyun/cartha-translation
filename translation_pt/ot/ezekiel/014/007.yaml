  to: Pois todo homem da casa de Israel[a], ou todo estrangeiro que resida em Israel[b], que se afastar de me seguir[c], elevar seus ídolos ao coração, puser diante de si a pedra de tropeço da sua iniquidade e vier ao profeta para me consultar por meio dele — eu, Yahweh, lhe responderei eu mesmo[d].
  rationale: A revisão ajusta a metáfora dos ídolos para refletir o direcionamento ao coração no hebraico e melhora duas formulações que poderiam induzir ou dificultar a leitura. Não resolve de maneira doutrinária a construção final difícil; conserva sua ênfase mediante “eu mesmo” e a explicita em nota.
