source:
  edition: WLC
  text: וּ/שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֥א יַצִּ֖ילוּ בָּנִ֣ים וּ/בָנ֑וֹת כִּ֛י הֵ֥ם לְ/בַדָּ֖/ם יִנָּצֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/018.yaml
  text: And if these three men were in its midst[a], as I live, declares the Lord GOD, they would not deliver sons or daughters[b]; they alone would be delivered.
translation:
  language: pt
  text: E se estes três homens estivessem no meio dela, tão certo como eu vivo — declara o Senhor Yahweh —, eles não livrariam nem filhos nem filhas; somente eles seriam livrados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Livrados” também pode ser traduzido como “salvos” ou “resgatados”; aqui o verbo se refere a escapar do juízo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: E, mesmo que esses três homens
  rationale: O וּ liga o versículo ao padrão hipotético repetido no contexto; “mesmo que” explicita naturalmente em português essa força condicional e concessiva. “Homens” preserva o masculino do hebraico e corresponde aos três homens mencionados no contexto.
- source_word: בְּתוֹכָהּ
  choice: no meio dela
  rationale: Preserva a expressão concreta hebraica e o sufixo feminino, que retoma a terra mencionada no contexto.
- source_word: חַי אָנִי
  choice: tão certo como eu vivo
  rationale: Equivalente português natural e solene da fórmula hebraica de juramento divino.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: declara o Senhor Yahweh
  rationale: “Declara” comunica a fórmula profética נְאֻם; “Senhor Yahweh” distingue o título אֲדֹנָי do nome divino יְהוִה sem produzir a repetição artificial “Senhor SENHOR”.
- source_word: לֹא יַצִּילוּ בָּנִים וּבָנוֹת
  choice: eles não livrariam nem filhos nem filhas
  rationale: “Livrar” expressa o Hifil de נצל no contexto de escapar ao juízo. Após a negação, “nem... nem...” é idiomático em português e conserva a menção explícita aos dois sexos.
- source_word: כִּי הֵם לְבַדָּם יִנָּצֵלוּ
  choice: somente eles seriam livrados
  rationale: A formulação transmite o contraste enfático e a exclusividade de לְבַדָּם, preservando também a ligação lexical entre o Hifil e o Nifal de נצל.
theological_decisions:
- issue: Forma do nome divino em אֲדֹנָי יְהוִה
  choice: o Senhor Yahweh
  alternative: o Soberano SENHOR
  rationale: A tradução conserva tanto o título אֲדֹנָי quanto o nome pessoal יְהוִה, evitando ocultar o nome divino ou criar a sequência pouco natural “Senhor SENHOR”.
- issue: Natureza do livramento
  choice: livrariam / seriam livrados
  alternative: salvariam / seriam salvos
  rationale: O contexto trata de preservação diante de um juízo histórico. “Livrar” mantém essa referência sem impor a ideia mais específica de salvação eterna, além de conservar a repetição do mesmo verbo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição verbal do hebraico foram preservadas onde soam naturais; a condição implícita pelo contexto foi expressa por “mesmo que”.
