  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: 'O waw consecutivo com היה introduz a sequência narrativa. Em português, a construção natural se combina com o sujeito seguinte: “E a palavra ... veio”, evitando o literalismo pouco fluente “E aconteceu”.'
- source_word: דְבַר
  choice: a palavra
  rationale: Na fórmula profética, דָּבָר designa a palavra ou mensagem divina. “A palavra” preserva o idioma profético tradicional e o registro solene sem explicitar além do hebraico.
- source_word: יְהוָה
  choice: Yahweh
  rationale: O tetragrama é apresentado como nome próprio divino; a transliteração “Yahweh” preserva o nome em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo de primeira pessoa indica direção ao profeta. “Veio a mim” é claro, digno e corrente em português.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala divina que vem em seguida. “Dizendo” reproduz de forma transparente a fórmula profética hebraica.
theological_decisions:
- issue: Forma de verter o nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto traz diretamente o tetragrama. “Yahweh” conserva o caráter de nome próprio e evita substituí-lo pelo título “SENHOR”; “Jeová” reflete uma forma híbrida posterior.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural e preservação da fórmula profética. O dois-pontos sinaliza que a fala divina continua no versículo seguinte.
