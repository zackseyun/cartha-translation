id: EZK.14.15
reference: Ezekiel 14:15
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לֽוּ חַיָּ֥ה רָעָ֛ה אַעֲבִ֥יר בָּ/אָ֖רֶץ וְ/שִׁכְּלָ֑תָּ/ה וְ/הָיְתָ֤ה שְׁמָמָה֙ מִ/בְּלִ֣י עוֹבֵ֔ר מִ/פְּנֵ֖י הַ/חַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/015.yaml
  text: If I cause dangerous wild animals to pass through the land[a], and they bereave it, and it becomes a desolation, without anyone passing through because of the animals[b],
translation:
  language: pt
  text: Se eu fizer animais selvagens perigosos[a] passarem pela terra, e eles a deixarem sem filhos[b], e ela se tornar uma desolação, sem ninguém passar por ela por causa dos animais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “feras”; literalmente, “animal mau/perigoso”, expressão coletiva para animais selvagens perigosos.
    reason: lexical_alternative
  - marker: b
    text: Ou “a privarem de seus habitantes”. O hebraico personifica a terra como alguém que ficou sem filhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֽוּ
  choice: Se
  rationale: Introduz a condição hipotética desta sequência de juízos; “Se” é claro e natural em português.
- source_word: חַיָּה רָעָה
  choice: animais selvagens perigosos
  rationale: O substantivo singular tem sentido coletivo e designa animais selvagens nocivos ou ameaçadores. A formulação evita a expressão ambígua “animais maus”.
- source_word: אַעֲבִיר
  choice: fizer ... passarem
  rationale: O hifil de עבר é causativo. Esta construção preserva tanto a ação divina explícita quanto a imagem de movimento através da terra.
- source_word: בָּאָרֶץ
  choice: pela terra
  rationale: Com o verbo de movimento עבר, “pela terra” expressa naturalmente o percurso através do território.
- source_word: וְשִׁכְּלָתָּהּ
  choice: e eles a deixarem sem filhos
  rationale: שׁכל denota privar de filhos ou causar perda. A tradução conserva a personificação da terra como mãe privada de seus habitantes, sem reduzi-la simplesmente a “despovoar”.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: e ela se tornar uma desolação
  rationale: Mantém a construção nominal hebraica e a linguagem profética forte de devastação.
- source_word: מִבְּלִי עוֹבֵר
  choice: sem ninguém passar por ela
  rationale: Expressa de modo idiomático a ausência total de viajantes ou transeuntes.
- source_word: מִפְּנֵי הַחַיָּה
  choice: por causa dos animais
  rationale: מִפְּנֵי indica aqui a causa; “os animais” retoma a classe coletiva mencionada anteriormente.
theological_decisions:
- issue: Agência divina no juízo
  choice: “Se eu fizer animais selvagens perigosos passarem pela terra”
  alternative: “Se eu permitir que animais selvagens perigosos passem pela terra”
  rationale: A forma causativa hebraica apresenta Deus como agente explícito no cenário hipotético de juízo. A tradução não enfraquece essa agência transformando-a em mera permissão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha o encadeamento hipotético do hebraico. A metáfora incomum de a terra ficar “sem filhos” foi preservada no texto e esclarecida em nota.
