  text: וְ/נָשְׂא֖וּ עֲוֺנָ֑/ם כַּֽ/עֲוֺן֙ הַ/דֹּרֵ֔שׁ כַּ/עֲוֺ֥ן הַ/נָּבִ֖יא יִֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/010.yaml
  text: And they will bear their punishment[a]; the punishment of the one who inquires will be the same as the punishment of the prophet.
translation:
  language: pt
  text: Eles levarão sobre si o seu castigo[a]; o castigo de quem consulta será igual ao castigo do profeta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles levarão sobre si a sua culpa [ou iniquidade]; a culpa de quem consulta será como a culpa do profeta”. A palavra hebraica pode indicar iniquidade, culpa ou o castigo resultante da culpa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: Eles levarão sobre si
  rationale: A construção נשא עון expressa carregar a culpa ou sofrer a consequência dela. “Levar sobre si” preserva o caráter idiomático e é compreensível em português atual.
- source_word: עֲוֺנָם
  choice: o seu castigo
  rationale: עון pode indicar iniquidade, culpa ou o castigo decorrente da culpa. Neste anúncio judicial, “castigo” comunica com clareza a consequência, enquanto a amplitude lexical é registrada em nota.
- source_word: כַּעֲוֺן ... כַּעֲוֺן
  choice: o castigo ... será igual ao castigo
  rationale: A preposição comparativa כ estabelece correspondência entre o destino de quem consulta e o do profeta. “Será igual a” torna essa comparação natural e explícita.
- source_word: הַדֹּרֵשׁ
  choice: quem consulta
  rationale: דרש, neste contexto, designa a pessoa que procura o profeta para obter uma resposta oracular. “Quem consulta” é conciso e contextualmente preciso.
- source_word: הַנָּבִיא
  choice: o profeta
  rationale: Equivalente português normal de נביא.
- source_word: יִהְיֶה
  choice: será
  rationale: Expressa naturalmente em português o valor futuro e copular da forma hebraica.
theological_decisions:
- issue: Sentido de עון em uma fórmula de juízo
  choice: “castigo” no texto principal
  alternative: “culpa” ou “iniquidade”
  rationale: No idioma נשא עון e neste contexto judicial, עון pode designar a consequência punitiva da culpa. Contudo, o hebraico conserva também a dimensão moral de culpa ou iniquidade; por isso, essas possibilidades não são eliminadas, mas preservadas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Quem consulta” pressupõe, conforme o contexto, a consulta a um profeta. A repetição de “castigo” preserva a simetria enfática do hebraico.
