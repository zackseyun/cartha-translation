id: EZK.14.4
reference: Ezekiel 14:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: WLC
  text: לָ/כֵ֣ן דַּבֵּר א֠וֹתָ/ם וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה אִ֣ישׁ אִ֣ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֡ל אֲשֶׁר֩ יַעֲלֶ֨ה אֶת גִּלּוּלָ֜י/ו אֶל לִבּ֗/וֹ וּ/מִכְשׁ֤וֹל עֲוֺנ/וֹ֙ יָשִׂים֙ נֹ֣כַח פָּנָ֔י/ו וּ/בָ֖א אֶל הַ/נָּבִ֑יא אֲנִ֣י יְהוָ֗ה נַעֲנֵ֧יתִי ל֦/וֹ ב/ה בְּ/רֹ֥ב גִּלּוּלָֽי/ו־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/004.yaml
  text: 'Therefore speak to them and say to them[a], ‘Thus says the Lord GOD: Any man of the house of Israel who brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet—I, Yahweh[c][b], will answer him according to the multitude of his idols.’'
translation:
  language: pt
  text: 'Portanto, fale com eles e diga-lhes: “Assim diz o Senhor Yahweh: Todo homem da casa de Israel que acolher seus ídolos em seu coração, puser diante de si a pedra de tropeço da sua iniquidade e depois vier ao profeta — eu, Yahweh, lhe responderei conforme a multidão dos seus ídolos.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico da última oração é difícil, sobretudo בָּהּ, que pode significar “por ela” ou “nisso”. Por isso, também se pode entender: “eu, Yahweh, lhe responderei por meio dela, conforme a multidão dos seus ídolos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Portanto
  rationale: Mantém a relação de consequência com o contexto anterior em português natural.
- source_word: דַּבֵּר אוֹתָם וְאָמַרְתָּ אֲלֵיהֶם
  choice: fale com eles e diga-lhes
  rationale: Conserva a dupla formulação verbal hebraica sem tornar a frase artificial.
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: Assim diz o Senhor Yahweh
  rationale: Preserva a fórmula profética e distingue o título אֲדֹנָי do nome divino יהוה.
- source_word: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל
  choice: Todo homem da casa de Israel
  rationale: A repetição distributiva אִישׁ אִישׁ significa cada ou todo homem; mantém também a expressão pactual e familiar 'casa de Israel'.
- source_word: יַעֲלֶה אֶת גִּלּוּלָיו אֶל לִבּוֹ
  choice: acolher seus ídolos no coração
  rationale: Expressa de modo corrente a instalação interior dos ídolos sugerida pela imagem hebraica, sem reduzi-la à mera lembrança mental.
- source_word: וּמִכְשׁוֹל עֲוֺנוֹ יָשִׂים נֹכַח פָּנָיו
  choice: puser diante de si o tropeço que o leva à iniquidade
  rationale: Preserva a metáfora do obstáculo deliberadamente colocado diante da pessoa e explicita a relação semântica provável entre tropeço e iniquidade.
- source_word: וּבָא אֶל הַנָּבִיא
  choice: e depois vier consultar o profeta
  rationale: O contexto mostra que a ida ao profeta visa obter uma palavra divina; 'depois' torna clara a sequência já presente no hebraico.
- source_word: אֲנִי יְהוָה נַעֲנֵיתִי לוֹ
  choice: eu, Yahweh, lhe responderei
  rationale: Mantém a ênfase do pronome e do nome divino; o futuro comunica adequadamente a declaração judicial no contexto.
- source_word: בָהּ בְּרֹב גִּלּוּלָיו
  choice: conforme a multidão dos seus ídolos
  rationale: Apresenta a interpretação contextual mais provável, mas sinaliza em nota a dificuldade de בָהּ e as alternativas possíveis.
theological_decisions:
- issue: Representação do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Javé
  rationale: Translitera o nome pactual e, na fórmula אֲדֹנָי יְהוִה, evita a repetição 'Senhor SENHOR' por meio de 'Senhor Yahweh'.
- issue: Força de אִישׁ אִישׁ
  choice: Todo homem
  alternative: Toda pessoa; qualquer israelita
  rationale: Preserva a forma masculina distributiva do texto sem acrescentar uma limitação teológica além da formulação hebraica.
- issue: Sentido da resposta divina em נַעֲנֵיתִי לוֹ בָהּ בְּרֹב גִּלּוּלָיו
  choice: lhe responderei conforme a multidão dos seus ídolos
  alternative: lhe responderei por meio dela, por causa da multidão dos seus ídolos; permitirei que ele me consulte apesar da multidão dos seus ídolos
  rationale: O contexto favorece uma resposta judicial correspondente à idolatria, mas a sintaxe, sobretudo בָהּ, permanece difícil; a nota conserva essa ambiguidade real.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação mantém as imagens centrais do hebraico, mas evita calques pouco naturais como 'fazer subir os ídolos ao coração'. O nome Yahweh é usado de modo consistente.
