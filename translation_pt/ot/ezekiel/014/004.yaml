    text: 'O hebraico da última oração é difícil, sobretudo בָּהּ, que pode significar “por ela” ou “nisso”. Por isso, também se pode entender: “eu, Yahweh, lhe responderei por meio dela, conforme a multidão dos seus ídolos”.'
