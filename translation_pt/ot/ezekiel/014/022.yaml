source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נֽוֹתְרָה בָּ֜/הּ פְּלֵטָ֗ה הַֽ/מּוּצָאִים֮ בָּנִ֣ים וּ/בָנוֹת֒ הִנָּ/ם֙ יוֹצְאִ֣ים אֲלֵי/כֶ֔ם וּ/רְאִיתֶ֥ם אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וְ/נִחַמְתֶּ֗ם עַל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר הֵבֵ֖אתִי עָלֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/022.yaml
  text: Yet behold[a], a remnant will be left in it—those brought out, sons and daughters. Behold, they are coming out to you, and you will see their way and their deeds; and you will be comforted concerning the disaster that I brought upon Jerusalem[c][b], all that I brought upon it.
translation:
  language: pt
  text: Contudo, eis que nela restará um remanescente de sobreviventes[a], filhos e filhas[b], que serão levados para fora. Eis que eles estão saindo para junto de vocês, e vocês verão o caminho deles e as suas ações; e vocês serão consolados quanto à calamidade[c] que eu trouxe sobre Jerusalém, quanto a tudo o que trouxe sobre ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nela restará quem tenha escapado” ou “nela ficará um remanescente”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico menciona explicitamente “filhos e filhas”.
    reason: lexical_alternative
  - marker: c
    text: Aqui, “calamidade” se refere à desgraça do juízo que atingiu Jerusalém, não ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Contudo, eis que
  rationale: No contexto, a conjunção introduz uma ressalva enfática após o anúncio de juízo; “contudo” expressa a força adversativa contextual, e “eis que” preserva a ênfase de הִנֵּה.
- source_word: נֽוֹתְרָה ... פְּלֵטָה
  choice: restará um grupo de sobreviventes
  rationale: A combinação designa pessoas que escapam e permanecem vivas. A formulação explicita o sentido coletivo de פְּלֵטָה sem impor a carga teológica que “remanescente” pode adquirir em português.
- source_word: בָּהּ
  choice: nela
  rationale: O pronome feminino retoma Jerusalém; “nela” preserva naturalmente o gênero gramatical da cidade em português.
- source_word: הַמּוּצָאִים
  choice: que serão levados para fora
  rationale: 'O particípio Hophal de יצא tem valor causativo-passivo: essas pessoas são retiradas ou conduzidas para fora, não simplesmente saem por iniciativa própria.'
- source_word: בָּנִים וּבָנוֹת
  choice: filhos e filhas
  rationale: Mantém a nomeação explícita de ambos os grupos no hebraico, em vez de reduzi-la ao termo genérico “filhos” ou “crianças”.
- source_word: הִנָּם יוֹצְאִים אֲלֵיכֶם
  choice: Eles virão até vocês
  rationale: O particípio ativo descreve o movimento dos sobreviventes na direção dos ouvintes. “Virão até vocês” é natural em português; a ideia de saída já foi expressa na oração anterior.
- source_word: דַּרְכָּם
  choice: o caminho ... deles
  rationale: “Caminho” conserva a metáfora hebraica para modo de vida ou conduta e mantém a distinção em relação às “ações” mencionadas em seguida.
- source_word: עֲלִילוֹתָם
  choice: as ações deles
  rationale: Expressa os atos ou feitos concretos dessas pessoas, com a possível coloração moral própria do contexto profético.
- source_word: וְנִחַמְתֶּם
  choice: vocês serão consolados
  rationale: O Nifal, neste contexto, indica receber consolo ou confirmação ao observar a conduta dos sobreviventes; a tradução evita o sentido alternativo de “arrepender-se”, inadequado aqui.
- source_word: עַל הָרָעָה
  choice: quanto à calamidade
  rationale: רָעָה designa aqui a desgraça ou calamidade do juízo sofrido por Jerusalém, e não maldade moral.
- source_word: הֵבֵאתִי עַל יְרוּשָׁלִַם
  choice: que eu trouxe sobre Jerusalém
  rationale: Reproduz o idioma de trazer uma calamidade sobre alguém e preserva explicitamente a agência divina afirmada pelo texto.
- source_word: אֵת כָּל אֲשֶׁר הֵבֵאתִי עָלֶיהָ
  choice: quanto a tudo o que trouxe sobre ela
  rationale: Mantém a retomada enfática e totalizante do hebraico, com “ela” retomando naturalmente Jerusalém.
theological_decisions:
- issue: Sentido de הָרָעָה quando Deus é apresentado como agente
  choice: calamidade
  alternative: mal; desgraça
  rationale: Neste contexto de juízo sobre Jerusalém, o termo se refere ao acontecimento calamitoso trazido sobre a cidade, não a uma ação moralmente má. A escolha preserva a agência divina sem resolver além do texto a tensão teológica do juízo.
- issue: Razão do consolo dos ouvintes
  choice: não explicitada além de verem o caminho e as ações dos sobreviventes
  alternative: explicitar que o comportamento deles provará que o juízo foi justo
  rationale: O contexto pode sugerir que a conduta dos sobreviventes confirmará a razão do juízo, mas o versículo não formula essa conclusão diretamente. A tradução preserva a conexão sem acrescentar a explicação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Vocês” traduz o plural dirigido aos exilados. A repetição de “trouxe sobre” e a referência feminina a Jerusalém foram preservadas; a segunda ocorrência de הִנֵּה foi absorvida na construção direta para evitar um “eis” artificialmente repetido, sem perder a vivacidade da cena.
