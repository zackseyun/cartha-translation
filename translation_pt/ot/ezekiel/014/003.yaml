base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/003.yaml
  text: Son of man[a], these men have set up their idols in their hearts and have placed the stumbling block of their iniquity before their faces[b]. Should I indeed let myself be consulted by them?
translation:
  language: pt
  text: Filho do homem, estes homens ergueram seus ídolos[a] em seu coração e puseram diante de si a pedra de tropeço de sua iniquidade. Acaso permitirei que eles me consultem?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “ídolos” é fortemente depreciativo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Serei eu realmente consultado por eles?” A construção hebraica intensifica a pergunta e sugere uma resposta negativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a fórmula característica com que Deus se dirige a Ezequiel e sua ressonância ao longo do livro.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: estes homens
  rationale: O contexto se refere aos anciãos do sexo masculino; por isso, mantém-se a referência masculina explícita do hebraico.
- source_word: הֶעֱלוּ
  choice: ergueram
  rationale: O verbo significa literalmente fazer subir ou levantar; aqui retrata a instalação deliberada dos ídolos no interior da pessoa.
- source_word: גִלּוּלֵיהֶם
  choice: seus ídolos
  rationale: Comunica com clareza o referente, enquanto a nota preserva o tom fortemente depreciativo do termo peculiar de Ezequiel.
- source_word: עַל לִבָּם
  choice: no coração
  rationale: Expressa em português corrente a localização metafórica da lealdade interior, sem reproduzir de modo rígido a preposição hebraica.
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: o tropeço da sua iniquidade
  rationale: Mantém a metáfora de algo que leva à queda e conserva a gravidade moral de עָוֹן, que também pode envolver culpa.
- source_word: נָתְנוּ נֹכַח פְּנֵיהֶם
  choice: puseram diante de si
  rationale: Reproduz a ideia de colocação deliberada à frente deles em português natural, embora sem conservar literalmente a expressão 'diante do rosto'.
- source_word: הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  choice: Acaso permitirei que eles me consultem?
  rationale: O nifal de דרש se refere aqui a Deus ser consultado para obter orientação, e a construção intensiva forma uma pergunta retórica que espera resposta negativa.
theological_decisions:
- issue: Resposta divina a idólatras que buscam orientação profética
  choice: Acaso permitirei que eles me consultem?
  alternative: Serei eu realmente consultado por eles?
  rationale: A pergunta retórica intensificada sugere recusa divina, mas a tradução não acrescenta um 'não' explícito que não consta do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação preserva a metáfora profética e a força retórica sem se tornar excessivamente literal.
