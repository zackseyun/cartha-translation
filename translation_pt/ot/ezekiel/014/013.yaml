base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
translation:
  language: pt
  text: Filho do homem, se uma terra pecar contra mim, agindo com infidelidade, estenderei a mão contra ela, cortarei seu suprimento de alimento[a], enviarei fome sobre ela e eliminarei dela seres humanos e animais[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quebrar-lhe a vara de pão”, expressão hebraica que significa cortar o suprimento de alimento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “homem e animal”, expressão convencional que abrange pessoas e animais.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a fórmula característica com que Deus se dirige a Ezequiel, mantendo sua força profética sem interpretá-la como mero vocativo genérico.
- source_word: אֶרֶץ
  choice: uma terra
  rationale: A construção é indefinida e genérica neste enunciado condicional; “uma terra” evita restringir o sentido a Israel ou a um Estado nacional moderno.
- source_word: תֶחֱטָא לִי
  choice: pecar contra mim
  rationale: Expressa de modo direto que o pecado é cometido contra Deus.
- source_word: לִמְעָל מַעַל
  choice: agindo com infidelidade
  rationale: A construção com verbo e substantivo cognatos realça uma quebra de fidelidade; a formulação comunica essa dimensão sem especificar indevidamente a forma da transgressão.
- source_word: וְנָטִיתִי יָדִי עָלֶיהָ
  choice: e eu estender a mão contra ela
  rationale: Mantém a imagem hebraica convencional de ação divina em juízo e soa natural em português bíblico atual.
- source_word: וְשָׁבַרְתִּי לָהּ מַטֵּה לָחֶם
  choice: cortar seu suprimento de alimento
  rationale: Transmite com clareza o sentido do idioma hebraico, enquanto a imagem literal, “quebrar o sustento do pão”, é preservada em nota.
- source_word: וְהִשְׁלַחְתִּי בָהּ רָעָב
  choice: enviar fome sobre ela
  rationale: “Fome” designa aqui uma calamidade coletiva, e “sobre ela” expressa naturalmente o juízo dirigido à terra.
- source_word: וְהִכְרַתִּי מִמֶּנָּה
  choice: eliminar dela
  rationale: Comunica a remoção decisiva expressa por כרת em contexto de juízo, de maneira natural em português.
- source_word: אָדָם וּבְהֵמָה
  choice: seres humanos e animais
  rationale: Torna explícito o valor coletivo e inclusivo da expressão hebraica, sem limitar אָדָם ao sexo masculino; a forma literal é registrada em nota.
theological_decisions:
- issue: Natureza da transgressão expressa por מַעַל
  choice: infidelidade contra Deus
  alternative: pecado em sentido genérico ou traição em sentido jurídico mais estreito
  rationale: A combinação de “pecar contra mim” com a construção cognata לִמְעָל מַעַל aponta para grave quebra de fidelidade. A tradução conserva essa dimensão relacional, sem definir uma forma específica de apostasia.
- issue: Alcance de אָדָם וּבְהֵמָה
  choice: todos os habitantes humanos e animais afetados pelo juízo
  alternative: um homem e um animal individuais
  rationale: A expressão funciona como uma fórmula abrangente de juízo. O plural natural em português comunica o sentido coletivo sem acrescentar categorias ausentes do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura condicional permanece aberta, pois a frase continua nos versículos seguintes. As imagens proféticas foram mantidas quando naturais; o idioma menos transparente sobre o pão foi explicitado no texto e documentado em nota.
