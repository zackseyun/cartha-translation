  verdict: revise
  source_fidelity: A tradução preserva adequadamente o vocativo profético, a condição genérica, a infidelidade intensificada, a imagem da mão estendida em juízo, a fome e o par abrangente «ser humano e animal». Contudo, os verbos divinos que seguem a condição hebraica estão no imperfeito e devem ser vertidos por formas finitas de futuro em português, não por infinitivos.
  naturalness: A sequência «e eu estender a mão..., cortar..., enviar...» não é gramaticalmente natural como continuação de «se uma terra pecar». Formas como «estenderei», «cortarei», «enviarei» e «eliminarei» tornam clara a relação condicional e mantêm a frase aberta para os versículos seguintes.
  terminology: '«Filho do homem», «uma terra», «pecar contra mim», «infidelidade», «fome» e «seres humanos e animais» são escolhas apropriadas. A nota sobre מַטֵּה לֶחֶם deve refletir mais exatamente a imagem hebraica: literalmente é «vara de pão», não «sustento do pão».'
