    rationale: '«E eu estender a mão... cortar... enviar...» não traduz adequadamente a série de imperfeitos consequentes no hebraico e produz uma construção defeituosa em português. O contexto condicional requer futuro: «estenderei... cortarei... enviarei... eliminarei».'
  - severity: medium
    issue: Formulação literal imprecisa na nota a
    rationale: O hebraico מַטֵּה לֶחֶם significa literalmente «vara/bastão de pão»; «sustento do pão» já é uma explicação do sentido, não a forma literal. A nota pode conservar a imagem literal e então explicá-la.
