  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: E ... veio
  rationale: O wayyiqtol de היה introduz a sequência narrativa. Em português, sua função é expressa naturalmente junto ao verbo da oração, sem o acréscimo mais rígido de “E aconteceu”.
- source_word: דְבַר
  choice: a palavra
  rationale: Na construção דְבַר יְהוָה, דבר pertence à fórmula profética consagrada. “Palavra” preserva melhor sua forma e força teológica do que o mais interpretativo “mensagem”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino representado pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: אֵלַי
  choice: a mim
  rationale: A preposição אֶל com o sufixo da primeira pessoa do singular significa diretamente “a mim”; esta construção é natural após “veio”.
- source_word: לֵאמֹר
  choice: dizendo
  rationale: O infinitivo construto introduz a fala divina que vem a seguir; “dizendo” conserva formalmente essa transição e é corrente em português bíblico moderno.
theological_decisions:
- issue: Representação do nome divino יְהוָה
  choice: Yahweh
  alternative: Javé; SENHOR
  rationale: O hebraico apresenta diretamente o Tetragrama. “Yahweh” preserva o nome próprio, sem substituí-lo pelo título tradicional “SENHOR”; “Javé” é uma adaptação portuguesa possível, mas a transliteração escolhida mantém maior correspondência internacional.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência profética. A formulação conserva a estrutura tradicional “a palavra de Yahweh veio a mim, dizendo”, sem arcaísmos desnecessários.
