  text: וְ/נָתַתָּ֨ה עָלֶ֜י/הָ מָצ֗וֹר וּ/בָנִ֤יתָ עָלֶ֨י/הָ֙ דָּיֵ֔ק וְ/שָׁפַכְתָּ֥ עָלֶ֖י/הָ סֹֽלְלָ֑ה וְ/נָתַתָּ֨ה עָלֶ֧י/הָ מַחֲנ֛וֹת וְ/שִׂים עָלֶ֥י/הָ כָּרִ֖ים סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/002.yaml
  text: And set a siege against it[a], and build a siege wall against it, and heap up a ramp against it, and set camps against it[b], and place battering rams against it all around.
translation:
  language: pt
  text: Ponha-a sob cerco, construa contra ela uma fortificação de cerco[a], levante contra ela uma rampa[b], monte acampamentos contra ela e disponha aríetes ao redor dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico designa uma estrutura de cerco; também pode ser entendido como “muro de cerco” ou “torre de cerco”.
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, uma rampa de cerco: um aterro amontoado contra a muralha da cidade.'
    reason: lexical_clarification
lexical_decisions:
- source_word: מָצוֹר
  choice: cerco
  rationale: O substantivo designa o cerco militar ou o bloqueio de uma cidade. “Ponha-a sob cerco” é natural em português e mantém a força da instrução hebraica.
- source_word: דָּיֵק
  choice: fortificação de cerco
  rationale: O termo designa uma estrutura militar erguida contra uma cidade, mas seu formato exato é incerto. A expressão genérica preserva essa ambiguidade melhor do que identificar sem ressalvas um muro ou uma torre.
- source_word: סֹלְלָה
  choice: rampa
  rationale: Refere-se a um aterro levantado para alcançar ou atacar a muralha. “Rampa” é claro no contexto, e a nota explicita que se trata de uma obra de cerco.
- source_word: מַחֲנוֹת
  choice: acampamentos
  rationale: O plural indica acampamentos militares dispostos contra a cidade. O contexto de cerco torna o sentido militar inequívoco.
- source_word: כָּרִים
  choice: aríetes
  rationale: Neste contexto militar, o termo se refere a máquinas usadas para golpear muralhas ou portões, não a animais.
- source_word: עָלֶיהָ
  choice: contra ela / sob cerco
  rationale: A preposição repetida indica ações hostis dirigidas contra a representação da cidade. A formulação varia apenas onde o português natural exige “sob cerco”.
- source_word: סָבִיב
  choice: ao redor dela
  rationale: Expressa o completo envolvimento da cidade pelas forças e máquinas de cerco.
- source_word: וְנָתַתָּה / וּבָנִיתָ / וְשָׁפַכְתָּ / וְנָתַתָּה / וְשִׂים
  choice: ponha / construa / levante / monte / disponha
  rationale: A sequência de verbos concretos conserva o caráter cumulativo das instruções, com escolhas idiomáticas para cada operação militar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia militar acessível. A repetição de “contra ela” preserva o ritmo cumulativo do hebraico sem tornar a frase artificial. Os marcadores foram colocados junto aos termos hebraicos que efetivamente explicam.
