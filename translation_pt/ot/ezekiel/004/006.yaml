  text: וְ/כִלִּיתָ֣ אֶת אֵ֗לֶּה וְ/שָׁ֨כַבְתָּ֜ עַל צִדְּ/ךָ֤ ה/ימיני שֵׁנִ֔ית וְ/נָשָׂ֖אתָ אֶת עֲוֺ֣ן בֵּית יְהוּדָ֑ה אַרְבָּעִ֣ים י֔וֹם י֧וֹם לַ/שָּׁנָ֛ה י֥וֹם לַ/שָּׁנָ֖ה נְתַתִּ֥י/ו לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/006.yaml
  text: When you have finished these[a], you shall lie down a second time on your right side, and you shall bear the iniquity of the house of Judah for forty days. I have assigned you a day for each year.
translation:
  language: pt
  text: Quando você tiver concluído essas coisas, você se deitará uma segunda vez sobre o seu lado direito e carregará a iniquidade da casa de Judá durante quarenta dias. Eu lhe atribuí um dia para cada ano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “um dia por um ano, um dia por um ano”. A repetição enfatiza a correspondência simbólica entre os dias durante os quais Ezequiel fica deitado e os anos representados.'
    reason: Alternativa lexical e preservação da ênfase formal do hebraico.
lexical_decisions:
- source_word: וְכִלִּיתָ אֶת־אֵלֶּה
  choice: Quando você tiver concluído essas coisas
  rationale: A forma verbal ligada por וְ introduz, no contexto, a ação seguinte após o término do sinal anterior. “Essas coisas” retoma as ações e os dias mencionados antes.
- source_word: וְשָׁכַבְתָּ עַל־צִדְּךָ הַיְמָנִי שֵׁנִית
  choice: deverá deitar-se uma segunda vez, agora sobre o lado direito
  rationale: “Uma segunda vez” preserva שֵׁנִית como indicação da repetição da ação; “agora” esclarece naturalmente em português a mudança para o lado direito sem acrescentar conteúdo substantivo.
- source_word: וְנָשָׂאתָ אֶת־עֲוֺן
  choice: carregará a iniquidade
  rationale: A expressão pode abranger tanto a culpa/iniquidade quanto o peso de suas consequências. A formulação mantém essa amplitude no ato simbólico do profeta.
- source_word: בֵּית יְהוּדָה
  choice: a casa de Judá
  rationale: Preserva a designação profética tradicional para o povo ou reino de Judá.
- source_word: אַרְבָּעִים יוֹם
  choice: durante quarenta dias
  rationale: “Durante” expressa de modo idiomático em português a duração indicada pelo hebraico.
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: um dia para cada ano
  rationale: Comunica com clareza a correspondência simbólica proporcional; a repetição enfática do hebraico é registrada em nota.
- source_word: נְתַתִּיו לָךְ
  choice: Eu lhe atribuí
  rationale: O verbo נתן tem aqui o sentido contextual de designar ou atribuir ao profeta a medida simbólica de dia por ano.
theological_decisions:
- issue: Sentido de עָוֺן no ato simbólico
  choice: iniquidade
  alternative: culpa; castigo pela iniquidade
  rationale: No contexto profético, o termo pode incluir o pecado do povo e o peso ou consequência ligado a ele. “Iniquidade” evita reduzir a expressão exclusivamente à culpa ou ao castigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” conforme o registro corrente da obra, sem coloquialismo excessivo; mantém “casa de Judá” e “iniquidade” por sua relevância profética e teológica.
