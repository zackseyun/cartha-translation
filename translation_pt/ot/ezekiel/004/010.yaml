base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/010.yaml
  text: And your food that you shall eat shall be by weight[a], twenty shekels a day[b]; from time to time you shall eat it.
translation:
  language: pt
  text: 'E o alimento que você comer deverá ser pesado: vinte siclos por dia[a]. Você o comerá de tempo em tempo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siclo era uma unidade de peso, não necessariamente uma moeda neste contexto.
    reason: cultural_note
  - marker: b
    text: Ou “em horários determinados”. O hebraico diz literalmente “de tempo em tempo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכָלְךָ
  choice: o alimento
  rationale: מַאֲכָל designa alimento ou aquilo que se come; “o alimento” é natural, digno e adequado ao contexto.
- source_word: אֲשֶׁר תֹּאכֲלֶנּוּ
  choice: que você comer
  rationale: A oração relativa especifica o alimento, e o futuro do subjuntivo em português transmite naturalmente a instrução prospectiva.
- source_word: בְּמִשְׁקוֹל
  choice: deverá ser pesado
  rationale: מִשְׁקוֹל refere-se especificamente ao peso; esta formulação deixa claro que a ração deve ser determinada por pesagem.
- source_word: עֶשְׂרִים שֶׁקֶל לַיּוֹם
  choice: vinte siclos por dia
  rationale: Mantém a unidade histórica de peso e expressa com naturalidade o valor distributivo de לַיּוֹם.
- source_word: מֵעֵת עַד עֵת
  choice: em horários determinados
  rationale: O idiomatismo indica momentos ou intervalos estabelecidos para comer, não uma ação contínua; a tradução evita o sentido moderno potencialmente ocasional de “de tempos em tempos”.
- source_word: תֹּאכֲלֶנּוּ
  choice: Você o comerá
  rationale: Preserva a repetição verbal conclusiva e o tom diretivo do hebraico.
