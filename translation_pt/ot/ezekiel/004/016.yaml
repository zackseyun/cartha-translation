base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/016.yaml
  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
translation:
  language: pt
  text: 'Então ele me disse: “Filho do homem, eis que vou cortar o suprimento de pão[a] em Jerusalém. Eles comerão pão por peso e com ansiedade, e beberão água por medida e com horror.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o cajado do pão”, um idiomatismo para o suprimento de pão ou de alimento que sustenta a vida.'
    reason: Explica a metáfora hebraica de מַטֵּה לֶחֶם, enquanto o texto principal expressa seu sentido de modo natural em português.
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: Filho do homem
  rationale: Preserva a forma hebraica característica com que Ezequiel é interpelado, sem tratá-la aqui como título cristológico.
- source_word: הִנְנִי שֹׁבֵר
  choice: eis que vou quebrar
  rationale: “Eis que” mantém a força enfática e deítica; “vou quebrar” expressa de modo natural a ação iminente ou certa indicada pela construção hebraica.
- source_word: מַטֵּה לֶחֶם
  choice: o sustento do pão
  rationale: Mantém a imagem do pão como apoio sustentador, mas evita a expressão portuguesa pouco inteligível “cajado do pão”; a nota esclarece o sentido idiomático.
- source_word: וְאָכְלוּ לֶחֶם בְּמִשְׁקָל
  choice: Eles comerão pão pesado
  rationale: Preserva a imagem concreta do pão distribuído por peso em situação de escassez.
- source_word: וּבִדְאָגָה
  choice: com ansiedade
  rationale: Expressa a preocupação angustiada indicada pelo substantivo hebraico.
- source_word: וּמַיִם בִּמְשׂוּרָה
  choice: beberão água medida
  rationale: Mantém o paralelismo concreto entre o pão pesado e a água medida.
- source_word: וּבְשִׁמָּמוֹן
  choice: com horror
  rationale: Reflete o espanto desolador e aterrador do termo no contexto do juízo, sem reduzir sua intensidade a mera surpresa.
theological_decisions:
- issue: Metáfora de מַטֵּה לֶחֶם
  choice: Conservar parcialmente a imagem como “o sustento do pão” e explicar seu sentido em nota.
  alternative: Traduzir diretamente como “o suprimento de alimento” ou reproduzir literalmente “o cajado do pão”.
  rationale: A escolha preserva a ideia teológica de que Deus retirará aquilo que sustenta a vida, mantendo a imagem profética compreensível sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada para ligar a nota à expressão correspondente; mantiveram-se o tom profético e as imagens de racionamento.
