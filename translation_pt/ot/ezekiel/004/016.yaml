review_pass:
  verdict: revise
  source_fidelity: A formulação «pão pesado» não traduz בְּמִשְׁקָל, que indica pão distribuído ou consumido por peso; em português, pode sugerir simplesmente pão de grande peso ou difícil de digerir. «Água medida» é compreensível, mas «água por medida» reproduz mais claramente o paralelismo hebraico de racionamento. «Cortar o suprimento de pão» comunica com naturalidade o sentido idiomático de «quebrar o cajado do pão», explicado em nota.
  naturalness: A revisão mantém um registro profético moderno e digno. «Pão por peso» e «água por medida» são claros, idiomáticos e paralelos. A colocação da nota imediatamente após «suprimento de pão» torna seu referente inequívoco.
  terminology: «Filho do homem» preserva a forma convencional do tratamento dado a Ezequiel, sem importar sentido cristológico. «Eis que», «ansiedade» e «horror» representam adequadamente a ênfase e o campo semântico hebraicos. A nota registra a metáfora literal sem exigir que uma expressão pouco natural permaneça no texto principal.
  issues:
  - severity: medium
    issue: «Eles comerão pão pesado»
    rationale: O hebraico לֶחֶם בְּמִשְׁקָל significa pão por peso, isto é, pão racionado/pesado para distribuição. «Pão pesado» altera o sentido e não expressa o ato de pesar ou racionar.
  - severity: low
    issue: «beberão água medida»
    rationale: Embora possível, a expressão pode qualificar a água como algo já medido. «Beberão água por medida» preserva com mais nitidez a construção paralela e a imagem de escassez.
  - severity: low
    issue: «o sustento do pão»
    rationale: A expressão é pouco idiomática em português e pode sugerir que o pão sustenta outra coisa. «Suprimento de pão» comunica o sentido do idiomatismo hebraico; a nota preserva a imagem literal do «cajado do pão».
