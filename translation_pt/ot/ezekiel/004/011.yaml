  yaml_path: translation/ot/ezekiel/004/011.yaml
  text: And you shall drink water by measure[a], a sixth of a hin; from time to time you shall drink.
translation:
  language: pt
  text: 'E você beberá água por medida: um sexto de um him. De tempos em tempos, você beberá.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em horários determinados, você beberá.”'
    reason: Alternativa lexical para מֵעֵת עַד־עֵת, que pode indicar tempos fixados.
lexical_decisions:
- source_word: וּמַיִם
  choice: E você beberá água
  rationale: מַיִם significa “água”, e a conjunção וּ dá continuidade à sequência de instruções. A colocação do verbo produz uma frase natural em português.
- source_word: בִּמְשׂוּרָה
  choice: em quantidade medida
  rationale: מְשׂוּרָה designa uma medida ou porção determinada. A expressão comunica claramente o racionamento da água.
- source_word: תִשְׁתֶּה
  choice: você beberá
  rationale: O imperfeito qal na segunda pessoa masculina singular tem força diretiva neste contexto. O futuro em português mantém o tom solene de instrução sem soar excessivamente jurídico.
- source_word: שִׁשִּׁית הַהִין
  choice: a sexta parte de um him
  rationale: Mantém a quantidade expressa no texto e preserva a antiga unidade de capacidade, sem introduzir uma conversão aproximada.
- source_word: מֵעֵת עַד עֵת
  choice: De tempos em tempos
  rationale: A expressão indica consumo periódico ou em ocasiões determinadas. “De tempos em tempos” conserva de modo natural a formulação idiomática hebraica.
- source_word: תִּשְׁתֶּה
  choice: você beberá
  rationale: A repetição do verbo foi preservada para refletir a ênfase hebraica no caráter regulado do consumo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “him” como unidade antiga e a repetição verbal do hebraico. Não se acrescenta nota para a alternativa “em horários determinados”, pois ela explica o sentido contextual da expressão, mas não exige alteração do texto publicado.
