source:
  edition: WLC
  text: לְמַ֥עַן יַחְסְר֖וּ לֶ֣חֶם וָ/מָ֑יִם וְ/נָשַׁ֨מּוּ֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/נָמַ֖קּוּ בַּ/עֲוֺנָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/017.yaml
  text: so that they may lack bread and water[a], and each man and his brother may be appalled[b], and waste away in their iniquity.
translation:
  language: pt
  text: para que lhes faltem pão e água, e cada homem e seu irmão fiquem estarrecidos[a] e definhem em sua iniquidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiquem desolados”, “horrorizados” ou “atônitos”. O verbo hebraico pode exprimir tanto desolação como o estado de choque produzido por ela.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sua culpa” ou “por causa do castigo de sua iniquidade”. A palavra hebraica pode denotar iniquidade, culpa ou a punição resultante da iniquidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: para que
  rationale: Introduz a finalidade ou o resultado decorrente das instruções anteriores, preservando a força télica do hebraico em português natural.
- source_word: יַחְסְרוּ
  choice: lhes faltem
  rationale: O verbo חסר significa “faltar, estar em falta”. A construção portuguesa comunica de modo idiomático a privação projetada, sem acrescentar uma causa não expressa.
- source_word: לֶחֶם וָמָיִם
  choice: pão e água
  rationale: Mantém o par concreto do hebraico, que representa os meios básicos de sustento, em vez de generalizar “pão” como “alimento”.
- source_word: וְנָשַׁמּוּ
  choice: fiquem estarrecidos
  rationale: O nifal de שמם pode descrever desolação ou o estado de choque que ela produz. Com pessoas como sujeito, “estarrecidos” expressa naturalmente a reação humana intensa sem eliminar a amplitude semântica, registrada em nota.
- source_word: אִישׁ וְאָחִיו
  choice: cada homem e seu irmão
  rationale: Preserva a forma masculina, distributiva e relacional do hebraico. Embora menos coloquial que “uns com os outros”, mantém “homem” e “irmão” sem transformar a relação em “próximo”.
- source_word: וְנָמַקּוּ
  choice: e definhem
  rationale: O verbo מקק denota consumir-se, decompor-se ou definhar. “Definhem” é conciso, digno e adequado ao contexto de privação e juízo.
- source_word: בַּעֲוֺנָם
  choice: em sua iniquidade
  rationale: עָוֹן pode significar iniquidade, culpa ou a pena decorrente dela. A formulação compacta mantém a dimensão moral e não resolve indevidamente a ambiguidade entre pecado, culpa e consequência penal.
theological_decisions:
- issue: Linguagem masculina representativa em אִישׁ וְאָחִיו
  choice: cada homem e seu irmão
  alternative: cada um com seu irmão; uns com os outros
  rationale: A tradução conserva os substantivos masculinos e a força distributiva da expressão, sem neutralizar “irmão” nem substituí-lo por “próximo”.
- issue: Amplitude semântica de עָוֹן
  choice: em sua iniquidade
  alternative: em sua culpa; por causa do castigo de sua iniquidade
  rationale: O termo hebraico abrange o ato perverso, a culpa e, em certos contextos, a punição resultante. O texto principal preserva essa tensão, e a nota explicita as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção conserva a concretude de “pão e água”, a linguagem masculina do original e as ambiguidades relevantes de שמם e עָוֹן.
