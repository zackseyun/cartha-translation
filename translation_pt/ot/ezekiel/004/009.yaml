base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
translation:
  language: pt
  text: E você, pegue trigo e cevada, favas e lentilhas, painço e espelta[a]. Coloque tudo num só recipiente e faça pão com esses ingredientes para você. Durante os trezentos e noventa dias em que estiver deitado de lado, você comerá desse pão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trigo emmer” ou “uma espécie de trigo”; a identificação exata do cereal antigo כֻסְּמִים é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: pegue ... para você
  rationale: O imperativo com o dativo pronominal tem força benefactiva; a formulação preserva essa nuance em português natural.
- source_word: חִטִּין וּשְׂעֹרִים
  choice: trigo e cevada
  rationale: Equivalentes correntes e seguros para os dois cereais.
- source_word: פּוֹל
  choice: favas
  rationale: O termo provavelmente designa favas; esta opção é mais específica que 'feijões' e é amplamente compreensível em português.
- source_word: עֲדָשִׁים
  choice: lentilhas
  rationale: Equivalente lexical padrão.
- source_word: דֹחַן
  choice: painço
  rationale: Identificação usual do cereal e denominação corrente em português.
- source_word: כֻסְּמִים
  choice: espelta
  rationale: É a identificação tradicional e plausível, mas a incerteza taxonômica antiga é registrada em nota.
- source_word: בִּכְלִי אֶחָד
  choice: num só recipiente
  rationale: '''Recipiente'' comunica o sentido amplo de כְּלִי, enquanto ''só'' preserva a ênfase em reunir os ingredientes numa única vasilha.'
- source_word: וְעָשִׂיתָ אוֹתָם לְךָ לְלָחֶם
  choice: faça pão com esses ingredientes para você
  rationale: Formulação idiomática que expressa a transformação dos itens em pão e mantém a ideia benefactiva.
- source_word: מִסְפַּר הַיָּמִים
  choice: durante o número de dias
  rationale: Preserva a referência explícita à duração contada, sem tornar a frase excessivamente literal.
- source_word: שׁוֹכֵב עַל צִדְּךָ
  choice: estiver deitado de lado
  rationale: Expressa o estado contínuo do particípio no contexto da ação simbólica ordenada.
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: trezentos e noventa dias
  rationale: Reproduz por extenso a duração especificada no hebraico.
- source_word: תֹּאכֲלֶנּוּ
  choice: você comerá desse pão
  rationale: O sufixo masculino singular retoma naturalmente לֶחֶם, 'pão'; 'desse pão' evita a ambiguidade de um pronome isolado em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você”. A enumeração mantém o ritmo do hebraico; a segunda frase explicita “esses ingredientes” e a última, “desse pão”, para assegurar coesão referencial natural em português.
