base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/003.yaml
  text: And you[a], take for yourself an iron griddle and set it as an iron wall between yourself and the city, and set your face toward it; and it will be under siege, and you shall besiege it. It is a sign for the house of Israel.
translation:
  language: pt
  text: E você, pegue uma chapa de ferro[a] e coloque-a como um muro de ferro entre você e a cidade. Volte o rosto para a cidade; ela ficará sitiada, e você a sitiará. Isso será um sinal para a casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “placa de ferro” ou “frigideira de ferro”. O termo hebraico se refere a um utensílio metálico para cozinhar, usado aqui simbolicamente como barreira.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲבַת בַּרְזֶל
  choice: uma chapa de ferro
  rationale: מַחֲבַת designa um utensílio metálico plano usado para cozinhar, como uma chapa ou frigideira. “Chapa” conserva a forma provável do objeto e funciona naturalmente, no sinal profético, como barreira; a nota registra alternativas culinárias.
- source_word: קִיר בַּרְזֶל
  choice: uma muralha de ferro
  rationale: קִיר significa concretamente “parede” ou “muro”. “Muralha” é natural no contexto de cerco e preserva a imagem concreta, sem reduzi-la a uma explicação como “barreira”.
- source_word: וַהֲכִינֹתָה אֶת־פָּנֶיךָ אֵלֶיהָ
  choice: Volte o rosto para ela
  rationale: A expressão indica orientação deliberada e determinada para a cidade. “Volte o rosto para ela” conserva a imagem corporal do hebraico em português claro.
- source_word: וְהָיְתָה בַמָּצוֹר
  choice: ela ficará sitiada
  rationale: מָצוֹר designa o cerco ou a condição resultante dele. Esta formulação portuguesa exprime de modo direto o estado da cidade no sinal encenado.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: você a sitiará
  rationale: O verbo צור, neste contexto, significa cercar militarmente ou sitiar. A tradução mantém a repetição semântica entre a condição de cerco e a ação do profeta.
- source_word: אוֹת הִיא
  choice: Isso será um sinal
  rationale: אוֹת é um sinal simbólico. “Isso” remete naturalmente ao conjunto da ação encenada, enquanto “será” acompanha a forma verbal hebraica e a progressão das instruções.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: para a casa de Israel
  rationale: A preposição ל indica o destinatário ou referente do sinal. “Casa de Israel” preserva a expressão coletiva e pactual do texto.
theological_decisions:
- issue: Imagens do ato profético simbólico
  choice: Manter as imagens concretas de “muralha de ferro” e “casa de Israel”
  alternative: Interpretar como “barreira de ferro” e simplificar para “Israel”
  rationale: A força teológica da passagem está no ato simbólico concreto. Preservar suas imagens permite que o leitor perceba o simbolismo sem que a tradução o explique ou resolva antecipadamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” mantém clareza contemporânea; a sintaxe conserva a sequência enfática das instruções e do sinal profético.
