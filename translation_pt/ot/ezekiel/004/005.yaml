  text: וַ/אֲנִ֗י נָתַ֤תִּֽי לְ/ךָ֙ אֶת שְׁנֵ֣י עֲוֺנָ֔/ם לְ/מִסְפַּ֣ר יָמִ֔ים שְׁלֹשׁ מֵא֥וֹת וְ/תִשְׁעִ֖ים י֑וֹם וְ/נָשָׂ֖אתָ עֲוֺ֥ן בֵּֽית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/005.yaml
  text: And I have assigned to you the years of their iniquity according to the number of days[a], three hundred and ninety days, and you shall bear the iniquity of the house of Israel.
translation:
  language: pt
  text: 'Eu lhe atribuí os anos da iniquidade deles, conforme o número de dias: trezentos e noventa dias; e você levará sobre si a iniquidade da casa de Israel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתַתִּי
  choice: atribuí
  rationale: Embora o verbo signifique literalmente “dei”, neste contexto ele expressa a imposição ou designação do período simbólico confiado a Ezequiel.
- source_word: שְׁנֵי עֲוֺנָם
  choice: os anos da iniquidade deles
  rationale: Preserva a construção hebraica e deixa que a frase seguinte explique a correspondência simbólica entre anos e dias.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: O termo pode indicar a transgressão, a culpa decorrente dela ou sua punição. “Iniquidade” conserva o sentido moral sem eliminar as outras nuances presentes no contexto.
- source_word: לְמִסְפַּר יָמִים
  choice: correspondentes ao número de dias
  rationale: Expressa de modo natural em português a relação estabelecida no hebraico entre os anos da iniquidade e os dias do ato simbólico.
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: trezentos e noventa dias
  rationale: Tradução direta e idiomática do numeral e do substantivo.
- source_word: וְנָשָׂאתָ
  choice: você levará sobre si
  rationale: Com עָוֹן, o verbo נשׂא descreve assumir ou suportar a iniquidade, a culpa e suas consequências. “Levará sobre si” mantém a força do ato profético com clareza em português atual.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Mantém a designação hebraica coletiva e pactual, sem reduzi-la simplesmente a “Israel”.
theological_decisions:
- issue: Sentido de עָוֹן no ato profético simbólico
  choice: iniquidade
  alternative: culpa; punição pela iniquidade
  rationale: O hebraico pode abranger a transgressão, a culpa contraída e a consequência punitiva. A tradução “iniquidade” preserva essa tensão, enquanto “levará sobre si” permite que a dimensão de culpa e consequência permaneça perceptível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a correspondência simbólica entre anos e dias e mantém a expressão coletiva “casa de Israel”.
