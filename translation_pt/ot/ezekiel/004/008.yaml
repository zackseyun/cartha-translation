base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/008.yaml
  text: And behold[a], I have put ropes on you[b], and you will not turn yourself from your side to your other side until you have completed the days of your siege.
translation:
  language: pt
  text: E eis que pus cordas[a] sobre você, e você não se virará de um lado para o outro[b] até completar os dias do seu cerco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cordões” ou “amarras”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do seu lado para o seu lado”.
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִנֵּה
  choice: E eis que
  rationale: Preserva a função de chamar a atenção e o tom solene da fala profética, sem recorrer a uma expressão excessivamente arcaica.
- source_word: נָתַתִּי עָלֶיךָ
  choice: pus ... sobre você
  rationale: Expressa de modo direto a ação apresentada como realizada e mantém a construção espacial do hebraico.
- source_word: עֲבוֹתִים
  choice: cordas
  rationale: Designa com clareza objetos usados para prender; 'cordões' e 'laços' também são possíveis, mas podem sugerir materiais mais finos ou uma forma específica não exigida pelo contexto.
- source_word: וְלֹא תֵהָפֵךְ
  choice: e você não se virará
  rationale: Mantém a coordenação e a negação explícitas do hebraico. A forma pronominal comunica naturalmente em português o ato corporal de virar-se, sem transformar em finalidade a incapacidade causada pelas cordas.
- source_word: מִצִּדְּךָ אֶל צִדֶּךָ
  choice: de um lado para o outro
  rationale: É a expressão idiomática corrente em português para mudar a posição do corpo, enquanto a formulação hebraica mais literal é registrada em nota.
- source_word: עַד כַּלּוֹתְךָ
  choice: até completar
  rationale: Marca de maneira natural o limite temporal da ação incumbida ao profeta e conserva a ideia de levar o período designado ao fim.
- source_word: יְמֵי מְצוּרֶךָ
  choice: os dias do seu cerco
  rationale: Conserva a concretude temporal e o sufixo de segunda pessoa do hebraico, sem explicar no corpo do texto aquilo que o contexto apresenta como encenação profética.
theological_decisions:
- issue: Referente de 'seu cerco'
  choice: Manter 'seu cerco', deixando implícito que se trata do cerco simbolicamente representado por Ezequiel.
  alternative: Explicitar 'o cerco que você representa' ou entender que Ezequiel pessoalmente está sendo sitiado.
  rationale: O contexto de Ezequiel 4 identifica a ação como sinal profético relacionado ao cerco de Jerusalém. Manter o pronome preserva a forma hebraica e evita inserir uma explicação interpretativa no texto.
- issue: As cordas como causa de incapacidade
  choice: Traduzir diretamente 'e você não se virará'.
  alternative: Traduzir 'para que você não possa se virar' ou 'e você não poderá se virar'.
  rationale: Embora as cordas indiquem restrição física, o hebraico coordena diretamente as orações e não explicita uma construção de finalidade. A tradução escolhida preserva essa forma e deixa a relação causal emergir do contexto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. 'E eis que' conserva a solenidade profética; o restante da frase emprega sintaxe natural e evita tanto arcaísmos quanto explicações interpretativas no corpo do texto.
