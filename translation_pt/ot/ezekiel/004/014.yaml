  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הִנֵּ֥ה נַפְשִׁ֖/י לֹ֣א מְטֻמָּאָ֑ה וּ/נְבֵלָ֨ה וּ/טְרֵפָ֤ה לֹֽא אָכַ֨לְתִּי֙ מִ/נְּעוּרַ֣/י וְ/עַד עַ֔תָּה וְ/לֹא בָ֥א בְּ/פִ֖/י בְּשַׂ֥ר פִּגּֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/014.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I have never defiled myself. From my youth until now I have not eaten what dies of itself or what is torn by beasts[c][b], and no defiled meat has entered my mouth.”
translation:
  language: pt
  text: 'Então eu disse: “Ah, Senhor Yahweh! Veja, eu nunca me contaminei[a]. Desde a minha juventude até agora, não comi nenhum animal que morreu por si mesmo nem nenhum animal que foi dilacerado por feras[b], e nenhuma carne abominável entrou na minha boca[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “minha alma/vida não está contaminada”; isto é, “não me tornei impuro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “carcaça e [animal] dilacerado”; refere-se a animais que morreram por si mesmos ou foram atacados por predadores, ambos proibidos como alimento nas leis de pureza de Israel.'
    reason: cultural_note
  - marker: c
    text: Ou “carne contaminada”. O termo hebraico se refere a carne ritualmente inaceitável ou contaminada.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah
  rationale: Interjeição de aflição e protesto; “Ah” preserva a reação alarmada de Ezequiel de modo natural em português.
- source_word: אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  rationale: Reproduz o título אֲדֹנָי e o nome divino יהוה sem fundi-los nem substituir o nome próprio por um título.
- source_word: הִנֵּה
  choice: Veja
  rationale: Marcador discursivo que chama a atenção para a alegação do profeta; “Veja” é atual e mantém sua força.
- source_word: נַפְשִׁי לֹא מְטֻמָּאָה
  choice: eu nunca me contaminei
  rationale: O hebraico diz literalmente que a vida ou pessoa do profeta não está contaminada. A formulação reflexiva comunica com naturalidade sua afirmação de pureza ritual ao longo da vida.
- source_word: נְבֵלָה
  choice: animal que morreu por si mesmo
  rationale: Designa a carcaça de um animal que morreu sem o abate apropriado; a formulação explicita o sentido no contexto alimentar.
- source_word: טְרֵפָה
  choice: que foi dilacerado por feras
  rationale: Termo alimentar para animal despedaçado ou atacado por predadores; a tradução preserva o agente provável sem tornar a expressão obscura.
- source_word: מִנְּעוּרַי וְעַד עַתָּה
  choice: Desde a minha juventude até agora
  rationale: Expressa claramente a duração de toda a prática pessoal reivindicada por Ezequiel.
- source_word: וְלֹא בָא בְּפִי
  choice: e nenhuma ... entrou na minha boca
  rationale: Mantém a imagem concreta do hebraico, usada para dizer que ele jamais ingeriu tal carne.
- source_word: בְּשַׂר פִּגּוּל
  choice: carne impura
  rationale: Comunica em linguagem acessível que se trata de carne ritualmente inaceitável, enquanto a nota registra a alternativa mais forte, “carne repugnante”.
theological_decisions:
- issue: Forma do nome divino no título אֲדֹנָי יְהוִה
  choice: Senhor Yahweh
  alternative: Senhor DEUS
  rationale: O texto contém o nome divino יהוה depois do título אֲדֹנָי. “Senhor Yahweh” conserva tanto o título quanto o nome da aliança.
- issue: Natureza da contaminação alegada por Ezequiel
  choice: Linguagem de pureza ritual
  alternative: Contaminação moral genérica
  rationale: Os alimentos mencionados e o vocabulário hebraico situam a declaração no âmbito da pureza alimentar e ritual, sem excluir implicações de obediência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A sintaxe conserva a progressão da defesa de Ezequiel, e as notas preservam os sentidos literais e cultuais que não cabem integralmente no texto corrido.
