  text: וְ/אַתָּ֤ה שְׁכַב֙ עַל צִדְּ/ךָ֣ הַ/שְּׂמָאלִ֔י וְ/שַׂמְתָּ֛ אֶת עֲוֺ֥ן בֵּֽית יִשְׂרָאֵ֖ל עָלָ֑י/ו מִסְפַּ֤ר הַ/יָּמִים֙ אֲשֶׁ֣ר תִּשְׁכַּ֣ב עָלָ֔י/ו תִּשָּׂ֖א אֶת עֲוֺנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/004.yaml
  text: And you[a], lie on your left side, and place the iniquity of the house of Israel upon it; for the number of the days that you lie on it, you shall bear their iniquity.
translation:
  language: pt
  text: E você, deite-se sobre o seu lado esquerdo e coloque sobre ele a iniquidade da casa de Israel. Pelo número de dias em que estiver deitado sobre ele, você levará a iniquidade deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a culpa” ou “o castigo pela iniquidade”, nas duas ocorrências de “iniquidade”. O termo hebraico pode incluir o próprio pecado, a culpa que ele produz ou sua consequência.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכַב
  choice: deite-se
  rationale: O imperativo descreve a adoção de uma postura física; “deite-se” é direto e natural em português.
- source_word: צִדְּךָ הַשְּׂמָאלִי
  choice: o lado esquerdo
  rationale: Expressa de modo idiomático e preciso o lado esquerdo do corpo do profeta.
- source_word: וְשַׂמְתָּ
  choice: coloque
  rationale: שׂים significa pôr, colocar ou estabelecer; “coloque” preserva a ação simbólica sem soar excessivamente formal.
- source_word: עֲוֺן
  choice: iniquidade
  rationale: O termo pode abranger o pecado, a culpa decorrente dele ou sua consequência. “Iniquidade” mantém a dimensão moral, enquanto a nota registra a amplitude lexical.
- source_word: בֵּית יִשְׂרָאֵל
  choice: a casa de Israel
  rationale: Preserva a designação coletiva e pactual do hebraico.
- source_word: עָלָיו
  choice: sobre ele / sobre esse lado
  rationale: O pronome retoma mais naturalmente “lado”; a segunda ocorrência é explicitada para evitar ambiguidade pronominal pouco natural em português.
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר
  choice: durante o número de dias em que
  rationale: Conserva a ideia de duração determinada por uma contagem de dias, com sintaxe corrente em português.
- source_word: תִּשָּׂא
  choice: você levará
  rationale: נשׂא com עָוֹן comunica carregar ou suportar um peso moral. “Levar a iniquidade” mantém a metáfora do encargo e é compreensível em português.
- source_word: עֲוֺנָם
  choice: a iniquidade deles
  rationale: Mantém a correspondência com a primeira ocorrência de עָוֹן e expressa o sufixo plural referente coletivamente à casa de Israel.
theological_decisions:
- issue: Sentido de Ezequiel levar simbolicamente o עָוֹן de Israel
  choice: Manter “levará a iniquidade deles” como descrição de um ato profético simbólico.
  alternative: “Levará a culpa deles” ou “sofrerá o castigo pela iniquidade deles”.
  rationale: O hebraico admite pecado, culpa ou consequência punitiva, mas o versículo não exige uma formulação de expiação substitutiva. A tradução preserva a tensão teológica e a nota informa a amplitude sem decidir por uma interpretação específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Casa de Israel” preserva a expressão bíblica coletiva; “sobre esse lado” evita uma retomada pronominal confusa.
