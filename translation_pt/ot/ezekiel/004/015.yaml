base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/015.yaml
  text: Then he said to me[a], “See, I have given you cow dung instead of human dung, and you shall prepare your bread over it.”
translation:
  language: pt
  text: 'Então ele me disse: “Veja, eu lhe dei esterco de gado em lugar de fezes humanas[a], e você preparará o seu pão sobre o esterco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “excremento humano”. O hebraico emprega um termo para fezes ou excremento e usa הָאָדָם com sentido genérico, em contraste com o gado.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Então ele me disse
  rationale: O waw consecutivo faz a narrativa avançar; “então” expressa com naturalidade a sequência, e o sujeito implícito remete a Deus no contexto anterior.
- source_word: רְאֵה
  choice: Veja
  rationale: O imperativo funciona como chamado de atenção. “Veja” é direto, atual e preserva a forma verbal do hebraico.
- source_word: נָתַתִּי לְךָ
  choice: eu lhe dou
  rationale: Embora a forma hebraica seja perfeita, neste ato de concessão a expressão idiomática comunica uma dádiva ou permissão efetiva no presente, sem acrescentar explicitamente o verbo “permitir”.
- source_word: צפועי הַבָּקָר
  choice: esterco de gado
  rationale: Designa excremento bovino empregado como combustível. “Esterco de gado” é concreto, natural em português e mantém a referência coletiva a bovinos.
- source_word: תַּחַת
  choice: em lugar de
  rationale: 'A preposição indica substituição, e não posição espacial: Deus concede esterco bovino em substituição às fezes humanas.'
- source_word: גֶּלְלֵי הָאָדָם
  choice: fezes humanas
  rationale: גֶּלְלֵי designa excremento, e הָאָדָם se refere aqui aos seres humanos em geral, em contraste com o gado. “Fezes humanas” é claro e atual.
- source_word: וְעָשִׂיתָ אֶת לַחְמְךָ
  choice: e você preparará o seu pão
  rationale: עשה é amplo, com o sentido de fazer ou preparar. “Preparará” se ajusta ao contexto culinário sem especificar indevidamente uma etapa como assar.
- source_word: עֲלֵיהֶם
  choice: sobre o esterco
  rationale: O sufixo hebraico é plural e retoma os excrementos; a repetição explícita de “esterco” evita uma referência pronominal pouco natural ou ambígua em português e comunica seu uso como combustível.
theological_decisions:
- issue: Sentido de הָאָדָם
  choice: humanas
  alternative: do homem
  rationale: Neste contexto, הָאָדָם designa a humanidade de modo genérico, não um indivíduo masculino. “Humanas” preserva o contraste entre excremento humano e esterco de gado sem impor uma leitura referente ao sexo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém a linguagem concreta do sinal profético sem eufemismo excessivo; “você” comunica naturalmente o singular no português brasileiro, e “sobre o esterco” explicita a função do material como combustível.
