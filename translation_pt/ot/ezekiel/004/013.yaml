source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כָּ֣כָה יֹאכְל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת לַחְמָ֖/ם טָמֵ֑א בַּ/גּוֹיִ֕ם אֲשֶׁ֥ר אַדִּיחֵ֖/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/013.yaml
  text: And Yahweh said[c][b][a], “Thus the sons of Israel will eat their bread unclean among the nations where I will drive them.”
translation:
  language: pt
  text: 'E Yahweh disse: “Assim os filhos de Israel comerão o seu pão impuro[a] entre as nações para onde eu os expulsarei[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contaminado”. O termo tem conotações de impureza ritual, especialmente neste contexto de exílio entre nações estrangeiras.
    reason: lexical_alternative
  - marker: b
    text: Ou “banirei” ou “dispersarei”. O verbo hebraico expressa a ação de fazer alguém ser afastado ou expulso.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome da aliança expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: כָּכָה
  choice: Assim
  rationale: Mantém o sentido de modo e resultado, com formulação natural e digna em português.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar literal do hebraico e seu uso corporativo para a nação.
- source_word: לַחְמָם
  choice: o seu pão
  rationale: Conserva a imagem concreta do pão, importante no contexto do ato simbólico, sem generalizá-la como alimento.
- source_word: טָמֵא
  choice: impuro
  rationale: Expressa o sentido ritual e pactual do termo neste contexto; em português, concorda naturalmente com pão.
- source_word: בַּגּוֹיִם
  choice: entre as nações
  rationale: Refere-se aos povos estrangeiros no cenário do exílio, sem introduzir associações posteriores de gentios.
- source_word: אַדִּיחֵם
  choice: eu os expulsarei
  rationale: Preserva a força causativa de fazê-los sair ou ser afastados, adequada ao exílio imposto por Deus.
- source_word: שָׁם
  choice: para onde
  rationale: Integra idiomaticamente o advérbio hebraico à oração relativa, indicando o destino da expulsão.
theological_decisions:
- issue: Tradução do nome da aliança יְהוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto apresenta diretamente o Tetragrama; a transliteração preserva o nome próprio sem substituí-lo por um título.
- issue: Expressão corporativa בְנֵי יִשְׂרָאֵל
  choice: os filhos de Israel
  alternative: os israelitas; o povo de Israel
  rationale: A formulação literal preserva a imagem familiar do hebraico, embora seu referente seja corporativamente toda a nação.
- issue: Natureza da impureza indicada por טָמֵא
  choice: impuro
  alternative: contaminado
  rationale: Impuro mantém a conotação ritual no ato simbólico e no exílio entre as nações, sem limitar o termo à sujeira física.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A ordem foi ajustada à sintaxe natural do português, preservando a imagem concreta do pão e a linguagem corporativa do hebraico.
