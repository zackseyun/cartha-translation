  text: וְ/אֶל מְצ֤וֹר יְרוּשָׁלִַ֨ם֙ תָּכִ֣ין פָּנֶ֔י/ךָ וּֽ/זְרֹעֲ/ךָ֖ חֲשׂוּפָ֑ה וְ/נִבֵּאתָ֖ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/007.yaml
  text: And toward the siege of Jerusalem you shall set your face[a], with your arm bared, and you shall prophesy against it.
translation:
  language: pt
  text: Você voltará o rosto para o cerco de Jerusalém, com o braço descoberto, e profetizará contra ela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito dela”. A preposição hebraica pode ter sentido mais amplo, mas, neste contexto de cerco e juízo, “contra ela” é a leitura mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצוֹר
  choice: cerco
  rationale: O substantivo designa o cerco ou a condição de estar sitiado. “Cerco de Jerusalém” é natural em português e evita concretizar indevidamente a referência como obras de cerco.
- source_word: תָּכִין פָּנֶיךָ
  choice: volte o rosto
  rationale: A construção no hifil com “rosto” indica orientar-se deliberada e resolutamente para algo. “Volte o rosto” preserva a imagem idiomática em português atual.
- source_word: זְרֹעֲךָ חֲשׂוּפָה
  choice: com o braço descoberto
  rationale: A expressão nominal significa literalmente que o braço está exposto ou descoberto. A formulação mantém a imagem de prontidão para agir sem explicá-la além do texto.
- source_word: וְנִבֵּאתָ עָלֶיהָ
  choice: e profetize contra ela
  rationale: Neste contexto de cerco e juízo, נבא com עַל tem força adversativa. O pronome feminino é retomado naturalmente por “ela”, referindo-se a Jerusalém.
theological_decisions:
- issue: Sentido da fala profética dirigida a Jerusalém
  choice: contra ela
  alternative: a respeito dela
  rationale: Embora עַל possa ter um sentido mais amplo, o sinal encenado anuncia cerco e juízo, favorecendo aqui o valor adversativo. A nota preserva a alternativa lexical sem enfraquecer a severidade contextual.
translation_notes:
  register: Português moderno, claro e solene, com imperativos naturais. “Jerusalém” é retomada pelo pronome feminino “ela”. O marcador da nota foi colocado após a expressão cuja ambiguidade esclarece.
