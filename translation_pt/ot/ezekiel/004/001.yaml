base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/001.yaml
  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
translation:
  language: pt
  text: 'E você, filho do homem, pegue um tijolo, coloque-o diante de você e grave[a] nele uma cidade: Jerusalém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inscreva” ou “desenhe”. O verbo hebraico pode se referir a gravar ou inscrever; aqui descreve a produção de uma representação de Jerusalém no tijolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: E você
  rationale: Reproduz a transição e o destaque dado ao destinatário de maneira natural em português.
- source_word: בֶן אָדָם
  choice: filho do homem
  rationale: Mantém a forma literal do tratamento hebraico recorrente dirigido ao profeta em Ezequiel, sem substituí-la por uma interpretação como “mortal”.
- source_word: לְבֵנָה
  choice: um tijolo
  rationale: É o sentido lexical direto do substantivo; o contexto permite usá-lo como superfície para uma representação, mas não exige “placa” ou “tabuleta”.
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  choice: coloque-o diante de você
  rationale: Expressa com clareza e naturalidade o ato de pôr o tijolo à frente do profeta.
- source_word: וְחַקּוֹתָ עָלֶיהָ
  choice: grave nele
  rationale: O verbo pode indicar gravar ou inscrever. “Grave” preserva a ação concreta de marcar a superfície do tijolo.
- source_word: עִיר אֶת יְרוּשָׁלָם
  choice: 'uma cidade: Jerusalém'
  rationale: Mantém o substantivo indefinido e apresenta Jerusalém como identificação explicativa da cidade representada.
- source_word: יְרוּשָׁלָם
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
