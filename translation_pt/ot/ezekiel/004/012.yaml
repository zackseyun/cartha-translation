  text: You shall eat it as a barley cake, and you shall bake it over human dung in their sight.
translation:
  language: pt
  text: Comerás isso como um bolo de cevada e o assarás sobre bolos de excremento humano, à vista deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֻגַת שְׂעֹרִים
  choice: bolo de cevada
  rationale: Traduz a expressão de modo direto e compreensível; עֻגָה designa um pão ou bolo achatado, e aqui é feito de cevada.
- source_word: בְּגֶלְלֵי צֵאַת הָאָדָם
  choice: sobre excremento humano
  rationale: Preserva o sentido chocante do hebraico e entende a matéria como combustível sobre o qual o alimento seria assado, sem sugerir que fosse ingrediente.
- source_word: לְעֵינֵיהֶם
  choice: diante dos olhos deles
  rationale: Mantém a imagem concreta e enfática do hebraico, em vez de reduzi-la simplesmente a 'à vista deles'.
theological_decisions:
- issue: Relação entre o alimento e o excremento humano
  choice: assará sobre excremento humano
  alternative: assará com excremento humano
  rationale: A preposição ב pode admitir formulações diferentes, mas o contexto indica o excremento como combustível. 'Sobre' comunica isso sem amenizar a impureza ritual e simbólica do ato.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com construção direta. O pronome feminino em 'a comerá' retoma a porção de alimento descrita no contexto; 'bolo de cevada' conserva a forma do original sem recorrer a vocabulário excessivamente técnico.
