base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/026.yaml
  text: And there were shuttered windows and palm trees on this side and on that[a], along the sidewalls of the vestibule, and on the side chambers of the temple[c][b], and the canopies.
translation:
  language: pt
  text: Havia janelas fechadas[a] e palmeiras[b] de um lado e do outro, ao longo das paredes laterais do vestíbulo, nas câmaras laterais do templo e nas coberturas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “janelas vedadas”; o hebraico indica que as janelas estavam fechadas ou protegidas de algum modo.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto arquitetônico, “palmeiras” provavelmente significa motivos decorativos em forma de palmeira.
    reason: cultural_note
  - marker: c
    text: O sentido do termo hebraico é incerto; talvez se refira a coberturas salientes, beirais ou outros elementos arquitetônicos que se projetavam para fora.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים אֲטֻמוֹת
  choice: janelas fechadas
  rationale: A expressão designa janelas ou aberturas arquitetônicas fechadas de algum modo. “Janelas fechadas” é natural em português e evita especificar, sem apoio seguro, se tinham postigos, grades ou outro tipo de vedação.
- source_word: תִמֹרִים
  choice: palmeiras
  rationale: O substantivo designa palmeiras; neste contexto arquitetônico, provavelmente se refere a motivos decorativos em forma de palmeira. A tradução mantém o termo concreto e deixa a explicação para a nota.
- source_word: מִפּוֹ וּמִפּוֹ
  choice: de um lado e do outro
  rationale: Reproduz de maneira clara a expressão distributiva hebraica, que indica disposição em ambos os lados.
- source_word: אֶל כִּתְפוֹת הָאוּלָם
  choice: ao longo das paredes laterais do vestíbulo
  rationale: כָּתֵף significa literalmente “ombro” e, em linguagem arquitetônica, indica as partes ou paredes laterais. אוּלָם é o vestíbulo ou pórtico do edifício do templo.
- source_word: צַלְעוֹת הַבַּיִת
  choice: câmaras laterais do templo
  rationale: No contexto da construção do templo, צֵלָע designa os compartimentos ou estruturas laterais; הַבַּיִת se refere aqui ao edifício do templo.
- source_word: הָעֻבִּים
  choice: alpendres
  rationale: O termo arquitetônico raro é de sentido incerto e parece indicar elementos salientes ou cobertos. “Alpendres” oferece uma leitura compreensível sem ocultar a incerteza, registrada em nota.
theological_decisions: []
