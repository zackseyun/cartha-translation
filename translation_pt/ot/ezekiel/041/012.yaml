  text: וְ/הַ/בִּנְיָ֡ן אֲשֶׁר֩ אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה פְּאַ֣ת דֶּֽרֶךְ הַ/יָּ֗ם רֹ֚חַב שִׁבְעִ֣ים אַמָּ֔ה וְ/קִ֧יר הַ/בִּנְיָ֛ן חָֽמֵשׁ אַמּ֥וֹת רֹ֖חַב סָבִ֣יב סָבִ֑יב וְ/אָרְכּ֖/וֹ תִּשְׁעִ֥ים אַמָּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/012.yaml
  text: And the building that faced the separate area on the side toward the west was seventy cubits wide[a], and the wall of the building was five cubits wide all around, and its length was ninety cubits.
translation:
  language: pt
  text: O edifício que ficava diante da área separada, no lado voltado para o oeste,[a] tinha setenta côvados de largura. A parede do edifício tinha cinco côvados de espessura em toda a volta, e o edifício tinha noventa côvados de comprimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no lado do caminho do mar”, isto é, no lado oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּנְיָן
  choice: o edifício
  rationale: בִּנְיָן designa uma construção ou edificação; “edifício” é natural, digno e adequado ao contexto arquitetônico.
- source_word: אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה
  choice: que ficava diante da área separada
  rationale: אֶל־פְּנֵי expressa relação espacial, podendo significar “diante de”, “em frente a” ou “defronte de”. A formulação preserva essa relação sem definir com excessiva precisão a orientação da fachada. הַגִּזְרָה refere-se à área delimitada ou separada no complexo do templo.
- source_word: פְּאַת דֶּרֶךְ הַיָּם
  choice: no lado voltado para o oeste
  rationale: A expressão significa literalmente “no lado do caminho do mar”. Na orientação geográfica de Israel, o mar indica o oeste; a tradução comunica o sentido, enquanto a nota preserva o idioma hebraico.
- source_word: רֹחַב שִׁבְעִים אַמָּה
  choice: tinha setenta côvados de largura
  rationale: רֹחַב indica largura. Esta construção é corrente em português e mantém a medida antiga do texto.
- source_word: קִיר הַבִּנְיָן חָמֵשׁ אַמּוֹת רֹחַב
  choice: A parede do edifício tinha cinco côvados de espessura
  rationale: Embora רֹחַב seja literalmente “largura”, aplicado a uma parede o português arquitetônico natural usa “espessura”, sem alterar a dimensão indicada.
- source_word: סָבִיב סָבִיב
  choice: em toda a volta
  rationale: A duplicação intensifica a ideia de que a medida se aplicava ao redor de todo o edifício.
- source_word: וְאָרְכּוֹ תִּשְׁעִים אַמָּה
  choice: e o edifício tinha noventa côvados de comprimento
  rationale: O referente do sufixo é explicitado como “o edifício” para evitar que, em português, “seu comprimento” pareça referir-se à parede mencionada imediatamente antes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com terminologia arquitetônica natural. Mantém “côvado” como unidade antiga e explicita o referente final para evitar ambiguidade gramatical não pretendida em português.
